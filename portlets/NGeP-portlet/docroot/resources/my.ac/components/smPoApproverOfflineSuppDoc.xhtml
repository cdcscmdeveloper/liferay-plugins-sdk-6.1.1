<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="tableId" required="true" />
		<cc:attribute name="smApplSupportDocs" required="true" />
		<cc:attribute name="mandatory" default="false"/>
	</cc:interface>

	<cc:implementation>
		<p:dataTable var="offTable" id="#{cc.attrs.tableId}" style="width:100% !important;"
			value="#{cc.attrs.smApplSupportDocs}" rowIndexVar="index" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.mandatory.suppdoc']}" colspan="3" rendered="#{cc.attrs.mandatory}"
						style="background-color:PeachPuff !important;text-align: center !important;color:black !important"/>
					<p:column headerText="#{lbl['lbl.sm.nonmandatory.suppdoc']}" colspan="3" rendered="#{!cc.attrs.mandatory}"
						style="background-color:PaleGreen !important;text-align: center !important;color:black !important"/>
                </p:row>
                <p:row>
                	<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 5%;"/>
					<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" style="width : 75%;"/>
					<p:column headerText="#{lbl['lbl.sm.suppDoc.document.dwldVld']}" style="width : 20%;" />
                </p:row>
			</p:columnGroup>
			
			<p:column style="width : 5%;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal;" />
			</p:column>

			<p:column style="width :75%;">
				<h:outputText value="#{offTable.pmDocument.docName}"
					style="float: left;white-space: normal;" />
				<p:outputPanel rendered="#{offTable.pmDocument.licenseReq}">
					<table style="width: 50%;table-layout:fixed">
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.suppdoc.license.no']}" /></td>
							<td style="border-style: none !important;width: 10% !important;">:</td>
							<td style="border-style: none !important;">
								<h:outputText value="#{offTable.licenseNo}" rendered="#{not empty offTable.licenseNo}"/>
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty offTable.licenseNo}"/>
							</td>
						</tr>
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.suppdoc.license.effdate']}" /></td>
							<td style="border-style: none !important;">:</td>
							<td style="border-style: none !important;">
								<h:outputText value="#{offTable.licenseEffDate}" rendered="#{not empty offTable.licenseEffDate}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty offTable.licenseEffDate}"/>
							</td>
						</tr>
						<tr>
							<td style="border-style: none !important;"><h:outputText
									value="#{lbl['lbl.sm.suppdoc.license.expdate']}" /></td>
							<td style="border-style: none !important;">:</td>
							<td style="border-style: none !important;">
								<h:outputText value="#{offTable.licenseExpDate}" rendered="#{not empty offTable.licenseExpDate}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty offTable.licenseExpDate}"/>
							</td>
						</tr>
					</table>
				</p:outputPanel>
			</p:column>

			<p:column style="width : 20%;" rendered="#{backingBean.managedBean.poUser}">
				<p:selectOneRadio value="#{offTable.verifiedFlg}"
					label="#{offTable.pmDocument.docName} - #{lbl['lbl.sm.suppDoc.document.dwldVld']}"
					layout="pageDirection" id="offlnPo">
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.valid']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.invalid']}"
						itemValue="0" />
					<!-- #31043 start -->	
					<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form" listener="#{backingBean.assignDocVerified}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"></p:ajax>
					<!-- #31043 end -->
				</p:selectOneRadio>
				<p:message id="offlnPoMsg" for="offlnPo" showSummary="true"
					showDetail="false" display="icon" />
			</p:column>
			
			<p:column style="width : 20%;" rendered="#{backingBean.managedBean.approverUser}">
				<p:selectOneRadio value="#{offTable.approverVerifiedFlg}"
					label="#{offTable.pmDocument.docName} - #{lbl['lbl.sm.suppDoc.document.dwldVld']}"
					layout="pageDirection" id="offlnApp">
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.valid']}"
						itemValue="1" />
					<f:selectItem itemLabel="#{lbl['lbl.sm.suppDoc.document.invalid']}"
						itemValue="0" />
					<!-- #31043 start -->	
					<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form" listener="#{backingBean.assignDocVerified}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"></p:ajax>
					<!-- #31043 end -->
				</p:selectOneRadio>
				<p:message id="offlnAppMsg" for="offlnApp" showSummary="true"
					showDetail="false" display="icon" />
			</p:column>
		</p:dataTable>
		
	</cc:implementation>
</ui:component>
