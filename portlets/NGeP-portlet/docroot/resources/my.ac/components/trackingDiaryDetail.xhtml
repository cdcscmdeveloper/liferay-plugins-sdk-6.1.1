<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="action" method-signature="void action()" />
		<cc:attribute name="dataTable" />
	</cc:interface>

	<cc:implementation>
		<p:panel id="Pnl" toggleable="true">
			<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
			<div style="text-align: right; min-height: 40px;">	
				<div style="float: left; clear: both;">
					<p:commandButton value="#{lbl['lbl.btn.back']}" action="#{cc.attrs.action}" />
				</div>
			</div>
		</p:panel>
	<p:panel header="Trackng Diary Details" toggleable="true" >
		<p:dataTable id="trackingDiaryTableID" lazy="true"  value="#{cc.attrs.dataTable}" 
			var="trackingDiaryObj" width="100%" rows="10" styleClass="fixed-size" >

				<ac:paginator for="trackingDiaryTableID"></ac:paginator>

				<p:column width="10%">
					<f:facet name="header">
					Creation Timestamp
					</f:facet>
				#{trackingDiaryObj.actionedDate}
				</p:column>
				<p:column width="10%">
					<f:facet name="header">
					Actioned By
					</f:facet>
				#{trackingDiaryBackingBean.getUserName(trackingDiaryObj.actionedBy)}
				</p:column>
				<p:column width="10%">
					<f:facet name="header">
					Role
					</f:facet>
				#{trackingDiaryObj.roleCode}
				</p:column>
				<p:column style="white-space: normal" >
					<f:facet name="header">
					Description
					</f:facet>
				#{trackingDiaryObj.actionDesc}
				</p:column>
				<p:column width="10%" style="white-space: normal" >
					<f:facet name="header">
					Status
					</f:facet>
				#{trackingDiaryBackingBean.getStatusDescById(trackingDiaryObj.statusId)}
				</p:column>

		</p:dataTable>
	</p:panel>			

	</cc:implementation>
</ui:component>
