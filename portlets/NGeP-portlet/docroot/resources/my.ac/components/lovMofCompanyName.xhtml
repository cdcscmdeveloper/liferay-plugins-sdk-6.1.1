<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="saveObj" required="true" default="" />
	</cc:interface>
	
	<cc:implementation>
			<ac:lov id="smCompanyName" readonly="true" style="width:289px;"
				lovId="SM_SUPPLIER_MOFNO" size="40"
				headerText="#{lbl['lbl.rpt.cmpName']}" 
				value="#{cc.attrs.bBean.managedBean.selectedOrgProfile.smSupplier.companyName}"
				saveObject="#{cc.attrs.saveObj}" />
			<ac:lovPopup />
	</cc:implementation>
</ui:component>
