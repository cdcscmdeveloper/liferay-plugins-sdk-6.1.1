<ui:composition
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

<cc:interface>
	<cc:attribute name="okAction" required="true" default="" />
	<cc:attribute name="update" required="true" default="@this" />
</cc:interface>

<cc:implementation>
    <h:outputScript target="body">
        function hideCategoryCodePopup() {
            try {
                if (typeof PF === 'function' &amp;&amp; PF('catCodePopup')) {
                    PF('catCodePopup').hide();
                }
            } catch (e) {}
        }
    </h:outputScript>
    
	<p:dialog id="catCodeCtPopup"
		header="#{lbl['lbl.sc.category.code.search']}"
		widgetVar="catCodePopup" modal="true" width="680" position="top"
		positionType="fixed"
    	contentStyle="margin-top: 50px;">

		<p:messages id="catCodeCtPopupMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		<h:panelGroup id="catCodeCtPnl">
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="25%">
					<p:outputLabel value="#{lbl['lbl.sc.category.code.search.by']}" />
				</td>
				<td width="75%">
					<p:selectOneRadio id="catCodeCtSearchBy" label="#{lbl['lbl.sc.category.code.search.by']}"
						value="#{categoryCodeSearchBackingBean.managedBean.searchBy}" styleClass="commonLabel">
						<f:selectItems value="#{categoryCodeSearchBackingBean.getRadioButtonCodeValues(ParameterTypeConst.categoryCodeSearchBy)}" />
						<p:ajax event="change" update="catCodeCtPnl" />
					</p:selectOneRadio>
				</td>
			</tr>
			<c:if test="#{categoryCodeSearchBackingBean.managedBean.searchBy == ParameterConst.categoryCodeSearchByCode}">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.main.category']}"/>
				</td>
				<td>
					<h:selectOneMenu id="catCodeCtLvl1" label="#{lbl['lbl.sc.main.category']}"
						value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl1}"
						style="width: 500px;">
						<f:selectItems value="#{categoryCodeSearchBackingBean.level1CategoryCodes}" />
						<p:ajax event="change" partialSubmit="true" process="@this" update="catCodeCtLvl2,catCodeCtLvl3" />
					</h:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.sub.category']}" />
				</td>
				<td>
					<h:selectOneMenu id="catCodeCtLvl2" label="#{lbl['lbl.sc.sub.category']}"
						value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl2}"
						style="width: 500px;">
						<f:selectItems value="#{categoryCodeSearchBackingBean.level2CategoryCodes}" />
						<p:ajax event="change" partialSubmit="true" process="@this" update="catCodeCtLvl3" />
					</h:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.sub.category.division']}" />
				</td>
				<td>
					<h:selectOneMenu id="catCodeCtLvl3" label="#{lbl['lbl.sc.sub.category.division']}"
						value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl3}"
						style="width: 500px;">
						<f:selectItems value="#{categoryCodeSearchBackingBean.level3CategoryCodes}" />
						<p:ajax event="change" partialSubmit="true" process="@this" />
					</h:selectOneMenu>
				</td>
			</tr>
			</c:if>
			</table>
			
			<c:if test="#{categoryCodeSearchBackingBean.managedBean.searchBy == ParameterConst.categoryCodeSearchByDescription}">
			<p:panel header="#{lbl['lbl.pm.search.category']}" toggleable="true">
				<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td width="25%">
						<p:outputLabel value="#{lbl['lbl.sc.category.description']}" />
					</td>
					<td width="75%">
						<p:inputText id="catCodeCtDecsr" value="#{categoryCodeSearchBackingBean.managedBean.categoryDesciption}" 
							onkeypress="if (event.keyCode == 13) { categoryCodeCtSearch.jq.click(); return false; }"
							maxlength="100" label="#{lbl['lbl.sc.category.description']}"
							style="width:475px;" />
						<p:message id="catCodeCtDecsrMsg" for="catCodeCtDecsr" display="icon" />
					</td>
				</tr>
				<tr>
					<td colspan="2" class="ppRightBtn">
						<p:commandButton
							value="#{lbl['lbl.btn.search']}"
							widgetVar="categoryCodeCtSearch"
							action="#{categoryCodeSearchBackingBean.searchAction}" 
							process="catCodeCtPnl" update="catCodeCtDescrTbl" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{categoryCodeSearchBackingBean.resetAction}" 
							resetValues="true" 
							process="@this" update="catCodeCtPnl" />
					</td>
				</tr>
				</table>
			</p:panel>

			<p:panel header="#{lbl['lbl.pm.category.result']}" toggleable="true">
				<p:dataTable id="catCodeCtDescrTbl"
					value="#{categoryCodeSearchBackingBean.categoryDescrDataModel}"
					selectionMode="single"
					selection="#{categoryCodeSearchBackingBean.managedBean.selectedCategoryL3}"
					rowKey="#{pmCategoryL3.categoryL3Id}"
					var="pmCategoryL3" lazy="true" rows="10">
	
					<ac:paginator for="catCodeCtDescrTbl" />
		
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.ct.menu.category.code']}" />
						</f:facet>
						#{pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}#{pmCategoryL3.pmCategoryL2.categoryL2Code}#{pmCategoryL3.categoryL3Code}
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.tbl.sub.category']}" style="min-width: 80px; white-space: normal;">
					<h:outputText value="#{pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.sub.category']}" style="min-width: 120px; white-space: normal;">
					<h:outputText value="#{pmCategoryL3.pmCategoryL2.categoryName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.tbl.sub.category.div']}" style="min-width: 120px; white-space: normal;">
					<h:outputText value="#{pmCategoryL3.categoryName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.ct.tbl.category.type']}" style="min-width: 80px; white-space: normal;">
					<h:outputText value="#{categoryCodeSearchBackingBean.getParameterDesc(pmCategoryL3.categoryTypeCode)}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			</c:if>
		</h:panelGroup>

			<table style="width: 100%;">
				<tr>
					<td style="text-align: right;">
						<p:commandButton
							value="#{lbl['lbl.btn.ok']}"
							action="#{categoryCodeSearchBackingBean.okAction(cc.attrs.okAction)}"
							process="@form" update="#{cc.attrs.update}"
							oncomplete="if (!args || !args.validationFailed) hideCategoryCodePopup();"
							styleClass="BtnSpacing" id="catCodeCtOkBttn" name="catCodeCtOkBttn"/> 
						<p:commandButton
							value="#{lbl['lbl.btn.cancel']}" partialSubmit="true"
							process="@this" update="@this"
							action="#{categoryCodeSearchBackingBean.cancelAction}"
							oncomplete="catCodePopup.hide()"
							styleClass="BtnSpacing" id="catCodeCtCnclBttn" name="catCodeCtCnclBttn" />
					</td>
				</tr>
			</table>
		</p:dialog>
</cc:implementation>
</ui:composition>
