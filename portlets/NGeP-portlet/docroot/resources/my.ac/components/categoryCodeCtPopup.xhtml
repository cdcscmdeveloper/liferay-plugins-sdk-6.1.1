<ui:composition
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

<cc:interface>
	<cc:attribute name="okAction" required="true" default="" />
	<cc:attribute name="update" required="true" default="@this" />
</cc:interface>

<cc:implementation>
<!-- #40500,#30014 fixing css-->
<h:outputStylesheet>
    <style>
        /* Fix overflow dialog */
        .category-search-dialog .ui-dialog-content {
            overflow: visible;
        }

        /* Lebar 100% untuk semua elemen */
        .category-search-dialog .ui-datatable,
        .category-search-dialog .ui-datatable-tablewrapper,
        .category-search-dialog .ui-datatable-scrollable-header,
        .category-search-dialog .ui-datatable-scrollable-header .ui-datatable-tablewrapper,
        .category-search-dialog .ui-datatable-scrollable-header table,
        .category-search-dialog .ui-datatable-scrollable-body table {
            width: 100% !important;
        }

        /* Layout tabel */
        .category-search-dialog .ui-datatable-scrollable-header table,
        .category-search-dialog .ui-datatable-scrollable-body table {
            table-layout: fixed;
        }

        /* Styling Header */
        .category-search-dialog .ui-datatable th.ui-state-default,
        .category-search-dialog .ui-datatable-scrollable-header,
        .category-search-dialog .ui-datatable-scrollable-header .ui-datatable-tablewrapper,
        .category-search-dialog .ui-datatable-scrollable-header table,
        .category-search-dialog .ui-datatable-scrollable-header th:last-child {
            background: #295066 !important;
            background-image: none !important;
        }

        .category-search-dialog .ui-datatable th.ui-state-default {
            color: #ffffff !important;
            text-align: center !important;
            font-weight: bold !important;
            border: 1px solid #1e3d6f !important;
        }

        /* Hilangkan extra space */
        .category-search-dialog .ui-datatable-scrollable-header::after {
            content: none !important;
            display: none !important;
        }

        /* HILANGKAN RESIZE HANDLE */
        .category-search-dialog .ui-column-resizer {
            display: none !important;
        }

        /* Scroll Body */
        .category-search-dialog .ui-datatable-scrollable-body {
        	overflow-x: hidden !important;
            overflow-y: auto !important;
            max-height: 300px !important;
            border: 1px solid #d3d3d3 !important;
        }

        /* Alignment header dan body */
        .category-search-dialog .ui-datatable-scrollable-header {
            padding-right: 0 !important;
            margin-right: 0 !important;
        }

        /* Pastikan body juga tidak ada space ekstra */
        .category-search-dialog .ui-datatable-scrollable-body {
            padding-right: 0 !important;
            margin-right: 0 !important;
        }

        /* Border untuk isi tabel */
        .category-search-dialog .ui-datatable td {
            border: 1px solid #d3d3d3 !important;
        }

        /* Paginator */
        #catCodeCtDescrTbl + .ui-paginator {
            position: relative;
            z-index: 11;
        }
    </style>
</h:outputStylesheet>
	<p:remoteCommand
    name="afterCloseCategoryPopupRC"
    action="#{panelBackingBean.afterCloseCategoryPopup}" /> <!-- #40498,#30014 -->

		<p:dialog id="categoryDialog"  header="#{lbl['lbl.ct.category.code.search']}" 
			width="900" resizable="false" position="top" widgetVar="catCodePopup" modal="true"
			styleClass="category-search-dialog"
			onHide="afterCloseCategoryPopupRC();"> <!-- #40500,#30014 -->
			<p:messages id="catCodeCtPopupMsg" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false"
				severity="error, info" />
			<h:panelGroup id="catCodeCtPnl">
				<table border="0" cellspacing="0" cellpadding="0" width="100%">
					<tr>
						<td width="25%" style="text-align: right; padding-right: 15px;">
							<h:outputText value="#{lbl['lbl.ct.category.code.search.by']}" />
						</td>
						<td width="75%"><p:selectOneRadio id="catCodeCtSearchBy"
								label="#{lbl['lbl.ct.category.code.search.by']}"
								value="#{categoryCodeSearchBackingBean.managedBean.searchBy}"
								layout="custom" styleClass="commonLabel">
								<f:selectItems
									value="#{categoryCodeSearchBackingBean.getRadioButtonCodeValues(ParameterTypeConst.categoryCodeSearchBy)}" />
								<p:ajax event="change" process="@this" update="catCodeCtPnl" />
							</p:selectOneRadio> <!-- Layout manual, horizontal --> <h:panelGrid columns="4"
								cellpadding="5" style="vertical-align: middle;">
								<!-- itemIndex 0 = By Category Code -->
								<p:radioButton for="catCodeCtSearchBy" itemIndex="0" />
								<h:outputText value="#{lbl['lbl.ct.menu.category.code']}"
									style="margin-right:25px;" />

								<!-- itemIndex 1 = By Category Description -->
								<p:radioButton for="catCodeCtSearchBy" itemIndex="1" />
								<h:outputText value="#{lbl['lbl.ct.category.description']}" />
							</h:panelGrid></td>
					</tr>
					<ui:fragment
						rendered="#{categoryCodeSearchBackingBean.managedBean.searchBy == ParameterConst.categoryCodeSearchByCode}"> <!-- #40500,#30014 -->
						<tr>
							<td style="text-align: right; padding-right: 15px;"><h:outputText
									value="#{lbl['lbl.ct.tbl.category']}" /></td>
							<td><h:selectOneMenu id="catCodeCtLvl1"
									label="#{lbl['lbl.ct.tbl.category']}"
									value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl1}"
									style="width: 500px;">
									<f:selectItems
										value="#{categoryCodeSearchBackingBean.level1CategoryCodes}" />
									<p:ajax event="change" partialSubmit="true" process="@this"
										update="catCodeCtLvl2,catCodeCtLvl3" />
								</h:selectOneMenu></td>
						</tr>
						<tr>
							<td style="text-align: right; padding-right: 15px;"><h:outputText
									value="#{lbl['lbl.ct.tbl.sub.category']}" /></td>
							<td><h:selectOneMenu id="catCodeCtLvl2"
									label="#{lbl['lbl.ct.tbl.sub.category']}"
									value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl2}"
									style="width: 500px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
        										  itemValue=""
        										  noSelectionOption="true" /> <!-- #41031,#30014 -->
									<f:selectItems
										value="#{categoryCodeSearchBackingBean.level2CategoryCodes}" />
									<p:ajax event="change" partialSubmit="true" process="@this"
										update="catCodeCtLvl3" />
								</h:selectOneMenu></td>
						</tr>
						<tr>
							<td style="text-align: right; padding-right: 15px;"><h:outputText
									value="#{lbl['lbl.ct.tbl.sub.category.div']}" /></td>
							<td><h:selectOneMenu id="catCodeCtLvl3"
									label="#{lbl['lbl.ct.tbl.sub.category.div']}"
									value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl3}"
									style="width: 500px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
        										  itemValue=""
        										  noSelectionOption="true" /> <!-- #41031,#30014 -->
									<f:selectItems
										value="#{categoryCodeSearchBackingBean.level3CategoryCodes}" />
									<p:ajax event="change" partialSubmit="true" process="@this" />
								</h:selectOneMenu></td>
						</tr>
					</ui:fragment>
				</table>

				<ui:fragment
					rendered="#{categoryCodeSearchBackingBean.managedBean.searchBy == ParameterConst.categoryCodeSearchByDescription}"> <!-- #40500,#30014 -->
					<p:panel header="#{lbl['lbl.ct.search.category']}"
						toggleable="true">
						<table border="0" cellspacing="0" cellpadding="0" width="100%">
							<tr>
								<td width="25%" style="text-align: right; padding-right: 15px;">
									<h:outputText value="#{lbl['lbl.ct.category.description']}" />
								</td>
								<td width="75%"><p:inputText id="catCodeCtDecsr"
										value="#{categoryCodeSearchBackingBean.managedBean.categoryDesciption}"
										onkeypress="if (event.keyCode == 13) { categoryCodeCtSearch.jq.click(); return false; }"
										maxlength="100" label="#{lbl['lbl.ct.category.description']}"
										style="width:475px;" /> <p:message id="catCodeCtDecsrMsg"
										for="catCodeCtDecsr" display="icon" /></td>
							</tr>
							<tr>
								<td colspan="2" class="ppRightBtn"><p:commandButton
										value="#{lbl['lbl.btn.search']}"
										widgetVar="categoryCodeCtSearch"
										action="#{categoryCodeSearchBackingBean.searchAction}"
										process="catCodeCtPnl" update="catCodeCtDescrTbl" /> <p:commandButton
										value="#{lbl['lbl.ct.btn.reset']}"
										action="#{categoryCodeSearchBackingBean.resetAction}"
										resetValues="true" process="@this" update="catCodeCtPnl" /></td>
							</tr>
						</table>
					</p:panel>
					<!-- #40500,#30014 //Refinement Scrollbar function -->
					<p:panel header="#{lbl['lbl.ct.category.result']}"
						toggleable="true">

						<p:dataTable id="catCodeCtDescrTbl"
							value="#{categoryCodeSearchBackingBean.categoryDescrDataModel}"
							selection="#{categoryCodeSearchBackingBean.managedBean.selectedCategoryL3}"
							selectionMode="single" rowKey="#{pmCategoryL3.categoryL3Id}" scrollWidth="100%"
							var="pmCategoryL3" lazy="true" rows="10" scrollable="true" resizableColumns="false"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">

							<ac:paginator for="catCodeCtDescrTbl" />

							<p:column>
								<f:facet name="header">
									<h:outputText value="#{lbl['lbl.ct.menu.category.code']}" />
								</f:facet>
						#{pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}#{pmCategoryL3.pmCategoryL2.categoryL2Code}#{pmCategoryL3.categoryL3Code}
					</p:column>
							<p:column headerText="#{lbl['lbl.ct.tbl.category']}"
								style="min-width: 90px; white-space: normal;">
								<h:outputText
									value="#{pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.sc.sub.category']}"
								style="min-width: 300px; white-space: normal;">
								<h:outputText value="#{pmCategoryL3.pmCategoryL2.categoryName}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.ct.tbl.sub.category.div']}"
								style="min-width: 300px; white-space: normal;">
								<h:outputText value="#{pmCategoryL3.categoryName}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.ct.tbl.category.type']}"
								style="min-width: 100px; white-space: normal;">
								<h:outputText
									value="#{categoryCodeSearchBackingBean.getParameterDesc(pmCategoryL3.categoryTypeCode)}" />
							</p:column>
						</p:dataTable>
					</p:panel>
				</ui:fragment>
			</h:panelGroup>

			<table style="width: 100%;">
				<tr>
					<td style="text-align: right;"><p:commandButton
							value="#{lbl['lbl.btn.ok']}"
							action="#{categoryCodeSearchBackingBean.okAction(cc.attrs.okAction)}"
							process="@form" update="#{cc.attrs.update} catCodeCtPnl"
							resetValues="true" /> <!-- #40498,#30014 --> <p:commandButton
							value="#{lbl['lbl.btn.cancel']}" partialSubmit="true"
							process="@this" update="@this"
							action="#{categoryCodeSearchBackingBean.cancelAction}"
							oncomplete="catCodePopup.hide()" styleClass="BtnSpacing"
							id="catCodeCtCnclBttn" name="catCodeCtCnclBttn" /></td>
				</tr>
			</table>
		</p:dialog>
	</cc:implementation>
</ui:composition>
