<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="okAction" required="false" default="" />		
		<cc:attribute name="id" required="true" />
	</cc:interface>

	<cc:implementation>
		<style>
.ui-selectonemenu.pmGoPopupSomWidth {
	width: 400px !important;
}

.ui-selectonemenu.pmGoPopupSomWidth label {
	width: 400px !important;
	max-width: 400% !important;
}
</style>

	<p:remoteCommand name="resetAllData" update="goPnlId pmGoResultPnlId" partialSubmit="true" action="#{pmGoSearchBackingBean.resetAction()}" process="@this" />
		<p:dialog id="pmGoPopup" header="#{lbl['lbl.lov.listing']} - #{lbl['lbl.pm.gl.account']}" onHide="resetAllData();"
			widgetVar="pmGoPopup" modal="true" width="680" position="top">

			<p:outputPanel id="goDoPanelId">
			<p:focus for="somAccType"/>
			<h:panelGroup id="goPnlGrp">
				<p:panel id="goPnlId"
					header="#{lbl['lbl.pm.header.general.org.search']}"
					toggleable="true">
					<h:panelGrid columns="5" id="orgProfilePg">
						<p:inputText id="itAccType" disabled="true" style="width:170px"
							value="#{lbl['lbl.pm.go.search.acc.type']}" />
						<p:spacer height="1"/>
						<p:selectOneMenu id="somAccType" styleClass="pmGoPopupSomWidth"
							disabled="#{pmGoSearchBackingBean.managedBean.accTypeDisabled}"
							value="#{pmGoSearchBackingBean.managedBean.selectedAccType}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems
								value="#{pmGoSearchBackingBean.retrieveAccountType()}"
								var="parameter" itemLabel="#{parameter.codeName}"
								itemValue="#{parameter.pmParameter.parameterCode}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{pmGoSearchBackingBean.onChangeAccType()}"
								update="somAccClass,somGoCode,somGoSoCode" />
						</p:selectOneMenu>
						<p:spacer height="1"/>
						<p:spacer height="1"/>

						<p:inputText id="itAccClass" disabled="true" style="width:170px"
							value="#{lbl['lbl.pm.go.search.acc.class']}" />
						<p:spacer height="1"/>
						<p:selectOneMenu id="somAccClass" styleClass="pmGoPopupSomWidth"
							value="#{pmGoSearchBackingBean.managedBean.selectedAccClass}"
							disabled="#{pmGoSearchBackingBean.managedBean.accClassDisabled}">
							<f:selectItems
								value="#{pmGoSearchBackingBean.retrieveAccountClass()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{pmGoSearchBackingBean.onChangeAccClass()}"
								update="@this,somGoCode,somGoSoCode" />
						</p:selectOneMenu>
						<p:spacer height="1"/>
						<p:spacer height="1"/>

						<p:inputText id="itGoCode" disabled="true" style="width:170px"
							value="#{lbl['lbl.pm.go.search.gen.obj.code']}" />
						<p:spacer height="1"/>
						<p:selectOneMenu id="somGoCode" styleClass="pmGoPopupSomWidth"
							value="#{pmGoSearchBackingBean.managedBean.selectedGenObjCode}">
							<f:selectItems
								value="#{pmGoSearchBackingBean.retrieveGoCodeList()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{pmGoSearchBackingBean.onChangeGenObjCode()}"
								update="@this,somGoSoCode" />
						</p:selectOneMenu>
						<p:graphicImage id="giGoCode" value="/css/images/design/tooltips.png"/>
						<p:tooltip for="giGoCode" value="#{lbl['lbl.pm.go.search.gocode.tooltip']}" 
							showEffect="fade" hideEffect="fade"/>						
						
						<p:inputText id="itGoSoCode" disabled="true" style="width:170px"
							value="#{lbl['lbl.pm.go.search.goso.obj.code']}" />						
						<p:spacer height="1"/>
						<p:selectOneMenu id="somGoSoCode" styleClass="pmGoPopupSomWidth"
							value="#{pmGoSearchBackingBean.managedBean.selectedGoSoObjCode}">
							<f:selectItems
								value="#{pmGoSearchBackingBean.retrieveGoSoCodeList()}"/>
							<p:ajax event="change" process="@this" partialSubmit="true"								
								update="@this"/>
						</p:selectOneMenu>
						<p:graphicImage id="giGoSoCode" value="/css/images/design/tooltips.png" />
						<p:tooltip for="giGoSoCode" value="#{lbl['lbl.pm.go.search.gosocode.tooltip']}" 
							showEffect="fade" hideEffect="fade"/>	
						
						<p:inputText id="itDesc" disabled="true" style="width:170px"
							value="#{lbl['lbl.pm.go.search.desc']}" />
						<p:spacer height="1"/>
						<p:inputText id="itSearchDesc"  style="width:300px"
							maxlength="100" value="#{pmGoSearchBackingBean.managedBean.desc}" >
							<p:ajax event="blur" process="@this" partialSubmit="true" update="@this"/>
						</p:inputText>
					</h:panelGrid>
					<div class="ppRightBtn">
					<!-- 200911@akmal - Enhancement27624 - Start -->
						<p:commandButton id="searcbBtnId" widgetVar="ptjSearchBtnWV"
							value="#{lbl['lbl.btn.search']}" update="pmGoDt pmGoDtMultiple slbtnPmGoDt"
							action="#{pmGoSearchBackingBean.searchGoView()}" process="@this" />
					<!-- 200911@akmal - Enhancement27624 - End -->
						<p:commandButton
							value="#{lbl['lbl.btn.reset']}"
							action="#{pmGoSearchBackingBean.resetAction()}"
							partialSubmit="true"
							process="goPnlId"
							update="goPnlId pmGoResultPnlId">
						</p:commandButton>
					</div>
				</p:panel>
			</h:panelGroup>
			<p:panel id="pmGoResultPnlId"
				header="#{lbl['lbl.pm.organisation.result']}" toggleable="true">
				<!-- 200911@akmal - Enhancement27624 - Start -->
				<h:panelGroup id="resultPanel" style="width:100%;" rendered="#{pmGoSearchBackingBean.managedBean.selectionMode == 'single'}">
				<!-- 200911@akmal - Enhancement27624 - End -->
					<p:dataTable id="pmGoDt" var="pmGo" rows="10"
						selection="#{pmGoSearchBackingBean.managedBean.vPmGo}"
						selectionMode="single"
						value="#{pmGoSearchBackingBean.pmGoDataModel}" rowIndexVar="index" lazy="true">
						<ac:paginator for="pmGoDt"></ac:paginator>
						<!-- 11022021@azza - Bug #30066 - Start -->
						<p:ajax event="rowUnselect" update="@([id$=slbtnPmGoDt])"  listener="#{pmGoSearchBackingBean.rowSelectPmGoDt}"/>
						<p:ajax event="rowSelect"  update="@([id$=slbtnPmGoDt])"   listener="#{pmGoSearchBackingBean.rowSelectPmGoDt}"/>
						<p:ajax event="toggleSelect" update="@([id$=slbtn1])" listener="#{pmGoSearchBackingBean.rowSelecPpmGoDt}"/>
						<p:ajax event="page" listener="#{pmGoSearchBackingBean.onPageChangePmGoDt}" update="@([id$=slbtnPmGoDt])" />
						<!-- 11022021@azza - Bug #30066 - End -->
						<p:column headerText="#{lbl['lbl.pm.go.search.acc.code']}"
							style="width :15%">
							<h:outputText value="#{pmGo.glAccCode}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.pm.go.search.desc']}"
							style="width :60%">
							<h:outputText value="#{pmGo.desc}" />
						</p:column>
					</p:dataTable>
				</h:panelGroup>
				
				<!-- 200911@akmal - Enhancement27624 - Start -->
				<h:panelGroup id="resultPanelMultiple" style="width:100%;" rendered="#{pmGoSearchBackingBean.managedBean.selectionMode == 'multiple'}">
					<p:remoteCommand name="PmGoPopulateSelection" partialSubmit="true" update="pmGoDtMultiple @([id$=slbtn])" actionListener="#{pmGoSearchBackingBean.populateSelectedItems()}" />
					<p:dataTable id="pmGoDtMultiple" 
						var="pmGo" 
						rows="10"
						selection="#{pmGoSearchBackingBean.selectedEntities}"
						rowKey="#{pmGo.glAccCode}"
						value="#{pmGoSearchBackingBean.pmGoDataModel}" 
						rowIndexVar="rowIndex" 
						lazy="true">
						
						<ac:paginator for="pmGoDtMultiple"></ac:paginator>
						
						<p:column selectionMode="multiple" styleClass="td-check-box-spacing" style="width :10%"/> 
						<p:ajax event="rowSelectCheckbox" update="@([id$=slbtn])" listener="#{pmGoSearchBackingBean.onSelectRow}"/>
						<p:ajax event="rowUnselectCheckbox" update="@([id$=slbtn])" listener="#{pmGoSearchBackingBean.onUnselectRow}"/>
						<p:ajax event="rowSelect" update="@([id$=slbtn])" />   
		                <p:ajax event="rowUnselect" update="@([id$=slbtn])" />  
		                <p:ajax event="toggleSelect" update="@([id$=slbtn])" listener="#{pmGoSearchBackingBean.onToggleSelect}"/>
		                <p:ajax event="page" listener="#{pmGoSearchBackingBean.onPageChange}" oncomplete="PmGoPopulateSelection()"/>
						<p:column headerText="#{lbl['lbl.pm.go.search.acc.code']}"
							style="width :30%">
							<h:outputText value="#{pmGo.glAccCode}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.pm.go.search.desc']}"
							style="width :60%">
							<h:outputText value="#{pmGo.desc}" />
						</p:column>
					</p:dataTable>
				</h:panelGroup>
				<!-- 200911@akmal - Enhancement27624 - End -->
				
				<table style="width: 100%;">
				<tr>
					<TD style="text-align: right;"><p:commandButton id="slbtn"
							value="#{lbl['lbl.btn.select']}" partialSubmit="true"
							disabled="#{pmGoSearchBackingBean.managedBean.isDisableSelectbtn()}"
							action="#{pmGoSearchBackingBean.okAction(cc.attrs.okAction)}"
							rendered="#{pmGoSearchBackingBean.managedBean.selectionMode == 'multiple'}"
							process="@this" update="#{pmGoSearchBackingBean.managedBean.update}" styleClass="BtnSpacing" />
							<!-- 11022021@azza - Bug #30066 - Start -->
							<p:commandButton id="slbtnPmGoDt"
							value="#{lbl['lbl.btn.select']}" partialSubmit="true"
							disabled="#{!pmGoSearchBackingBean.managedBean.disableSelectbtnPmGoDt or pmGoSearchBackingBean.managedBean.vPmGo == null}"
							action="#{pmGoSearchBackingBean.okAction(cc.attrs.okAction)}"
							rendered="#{pmGoSearchBackingBean.managedBean.selectionMode == 'single'}"
							process="@this" update="#{pmGoSearchBackingBean.managedBean.update}" styleClass="BtnSpacing" />
				            <!-- 11022021@azza - Bug #30066 - End -->
					<!-- 210118@akmal - Enhancement27624 - Start --> 
						<p:commandButton
							value="#{lbl['lbl.btn.cancel']}" partialSubmit="true"
							action="#{pmGoSearchBackingBean.resetAction()}"
							process="@this" update="@this"
							oncomplete="pmGoPopup.hide()"  styleClass="BtnSpacing" /></TD>
					<!-- 210118@akmal - Enhancement27624 - End -->
				</tr>
			</table>
				</p:panel>
				</p:outputPanel>
		</p:dialog>
	</cc:implementation>
</ui:composition>
