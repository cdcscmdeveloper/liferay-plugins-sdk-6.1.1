<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id" />
		<cc:attribute name="update" required="true" default="@this" />
		<cc:attribute name="title" default="" />
		<cc:attribute name="content" default="" />
		<!-- <cc:attribute name="postSignAction" method-signature="void action()" /> -->
		<cc:attribute name="widget" default="" />
		<cc:attribute name="okAction" required="true" default="" />
		<cc:attribute name="width" default="400" />
		<cc:attribute name="height" default="200" />
		<cc:attribute name="resetInput" default="" />
		<cc:attribute name="okProcess" default="@this" />
	</cc:interface>

	<cc:implementation>
		<ui:param name="confirmationheader" value="#{cc.attrs.title}" />
		<ui:param name="confirmationContent" value="#{cc.attrs.content}" />
		<!-- <ui:param name="confirmationMethod" value="#{cc.attrs.postSignAction}" /> -->
		<p:dialog id="#{cc.attrs.id}" widgetVar="#{cc.attrs.widget}"
			header="#{confirmationheader}" resizable="false"
			width="#{cc.attrs.width}" height="#{cc.attrs.height}"
			closable="false" modal="true">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{confirmationContent}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<c:choose>
				    <c:when test="#{empty cc.attrs.resetInput}">
				       <p:commandButton value="#{lbl['lbl.btn.yes']}" process="#{cc.attrs.okProcess}"
							partialSubmit="true"
							action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
							oncomplete="#{cc.attrs.widget}.hide();" update="#{cc.attrs.update}" />
				    </c:when>
				    <c:otherwise>
				        <p:commandButton value="#{lbl['lbl.btn.yes']}" process="#{cc.attrs.okProcess}"
							partialSubmit="true"
							action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
							oncomplete="#{cc.attrs.widget}.hide();" update="#{cc.attrs.update}" >
								<p:resetInput target="#{cc.attrs.resetInput}" />
							</p:commandButton>
				    </c:otherwise>
				</c:choose>
				<p:commandButton value="#{lbl['lbl.btn.no']}" immediate="true"
					oncomplete="#{cc.attrs.widget}.hide();" />
			</div>
		</p:dialog>
	</cc:implementation>
</ui:composition>
