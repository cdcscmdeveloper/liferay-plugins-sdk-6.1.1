<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id" />
		<cc:attribute name="update" required="true" default="@this" />
		<cc:attribute name="title" default="" />
		<cc:attribute name="content" default="" />
		<cc:attribute name="widget" default="" />
		<cc:attribute name="okAction" required="true" default="" />
		<cc:attribute name="cancelAction" default="" />
		<!-- 25037 -start- -->
		<cc:attribute name="width" default="auto" />
		<cc:attribute name="height" default="auto" />
		<!-- 25037 -end- -->
		<cc:attribute name="resetInput" default="" />
		<cc:attribute name="okProcess" default="@this" />
		<!-- 25037 -start- -->
		<cc:attribute name="noProcess" default="@this" />
		<!-- 25037 -end- -->
		<!-- 25692 -start- -->
		<cc:attribute name="style" default="" />
		<!-- 25037 -start- -->
		<cc:attribute name="dialogCSS" default="" />
		<cc:attribute name="loadingWidget" default="" />
		<!-- 25037 -end- -->
	</cc:interface>

	<cc:implementation>
		<!-- 25037 -start- -->
		<style>
			#{cc.attrs.dialogCSS}
			.confirm-ui-dialog{
				max-width: 500px;
				width: auto;
			}
			.confirm-ui-dialog .ui-dialog-content table{
				margin: auto;
			}
			.confirm-ui-dialog .ui-dialog-content table td label {
				white-space: normal;
				padding-left: 5px;
				display: inline !important;
				float: none !important;
			}
			.confirm-ui-dialog .ui-dialog-content{
				padding: 1em 1em !important;
				height: auto !important;
			}
			.confirm-ui-dialog .ui-dialog-content span img{
				margin-top: -4px;
			}
		
		</style>
		<!-- 25037 -end- -->

		<ui:param name="confirmationheader" value="#{cc.attrs.title}" />
		<ui:param name="confirmationContent" value="#{cc.attrs.content}" />

		<!-- 25692,25037 -start- -->
		<p:dialog styleClass="confirm-ui-dialog" id="#{cc.attrs.id}"
			widgetVar="#{cc.attrs.widget}" header="#{confirmationheader}"
			resizable="false" width="#{cc.attrs.width}"
			height="#{cc.attrs.height}" closable="false" modal="true"
			style="#{cc.attrs.style}">
			<!-- 25692,25037 -end- -->

			<p:blockUI block="#{cc.attrs.id}Popup"
				widgetVar="confirmPopupBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			<h:panelGroup id="#{cc.attrs.id}Popup" layout="block">
				<table>
					<tr>
						<!-- #28765 START -->
						<td align="center"
							style="white-space: normal; word-wrap: break-word !important;">
							<!-- #28765 END --> <h:graphicImage
								value="/css/images/design/exclamation.png" /> <p:outputLabel
								value="#{confirmationContent}" />
						</td>
					</tr>
				</table>
				<p:spacer height="1" />
				<div class="ppRightBtn">
					<c:choose>
						<!-- 25037 -start- -->
						<c:when test="#{not empty cc.attrs.loadingWidget}">
							<ui:remove>
								<!--trigger external blockwidget, TODO: maybe refactor this conditional fragment -->
							</ui:remove>
							<p:commandButton id="yesWithLoadId" value="#{lbl['lbl.btn.yes']}"
								process="#{cc.attrs.okProcess}" partialSubmit="true"
								onstart="#{cc.attrs.widget}.hide();#{cc.attrs.loadingWidget}.show();"
								action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
								oncomplete="#{cc.attrs.loadingWidget}.hide();"
								update="#{cc.attrs.update}" />
						</c:when>
						<!-- 25037 -end- -->
						<c:when test="#{empty cc.attrs.resetInput}">
							<!-- 25037 -start- -->
							<p:commandButton id="yesWithResetId"
								value="#{lbl['lbl.btn.yes']}" process="#{cc.attrs.okProcess}"
								partialSubmit="true" onstart="confirmPopupBlockWidget.show();"
								action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
								oncomplete="confirmPopupBlockWidget.hide(); #{cc.attrs.widget}.hide();"
								update="#{cc.attrs.update}" />
							<!-- 25037 -end- -->
						</c:when>
						<c:otherwise>
							<!-- 25037 -start- -->
							<p:commandButton id="yesWithoutResetId"
								value="#{lbl['lbl.btn.yes']}" process="#{cc.attrs.okProcess}"
								partialSubmit="true" onstart="confirmPopupBlockWidget.show();"
								action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
								oncomplete="confirmPopupBlockWidget.hide(); #{cc.attrs.widget}.hide();"
								update="#{cc.attrs.update}">
								<!-- 25037 -end- -->
								<p:resetInput target="#{cc.attrs.resetInput}" />
							</p:commandButton>
						</c:otherwise>
					</c:choose>
					<c:choose>
						<c:when test="#{not empty cc.attrs.cancelAction}">
							<!-- 25037 -start- -->
							<p:commandButton id="noWithActionId" value="#{lbl['lbl.btn.no']}"
								partialSubmit="true" onstart="confirmPopupBlockWidget.show();"
								action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.cancelAction)}"
								oncomplete="confirmPopupBlockWidget.hide(); #{cc.attrs.widget}.hide();"
								update="#{cc.attrs.update}" process="#{cc.attrs.noProcess}" />
							<!-- 25037 -end- -->
						</c:when>
						<c:otherwise>
							<!-- 25037 -start- -->
							<p:commandButton id="noWithoutActionId"
								value="#{lbl['lbl.btn.no']}" immediate="true"
								oncomplete="#{cc.attrs.widget}.hide();"
								process="#{cc.attrs.noProcess}" />
							<!-- 25037 -end- -->
						</c:otherwise>
					</c:choose>

				</div>
			</h:panelGroup>
		</p:dialog>
	</cc:implementation>
</ui:composition>
