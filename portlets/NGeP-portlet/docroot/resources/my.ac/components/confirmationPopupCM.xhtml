<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id" />
		<cc:attribute name="widget" default="" />
		<cc:attribute name="blockWidget" default="" />
		<cc:attribute name="title" default="#{lbl['lbl.btn.dialog.cofirm.header']}" />
		<cc:attribute name="content" default="" />
		<cc:attribute name="okAction" default="" />
		<cc:attribute name="width" default="400" />
		<cc:attribute name="height" default="100" />
		<cc:attribute name="update" required="true" default="@this" />
		<cc:attribute name="itemList" default="" />
		<cc:attribute name="selectedItem" default="" />
		<cc:attribute name="selectedExtItem" default="" />
		<cc:attribute name="hasParam" default="false" />
		<cc:attribute name="okParam" required="false"
			method-signature="java.lang.String action(java.lang.String)" />
		<cc:attribute name="loadingWidget" default="pageBlockWidget" />
	</cc:interface>

	<cc:implementation>
		<style>
		    .confirm-ui-dialog .ui-dialog-content {
		        padding: 0.5em 1em !important;
		        height: auto !important;
		    }
		</style>
		<p:dialog styleClass="confirm-ui-dialog"
			id="#{cc.attrs.id}"
			widgetVar="#{cc.attrs.widget}"
			header="#{cc.attrs.title}"
			resizable="false" closable="true" modal="true"
			width="#{cc.attrs.width}" height="#{cc.attrs.height}">

			<p:outputPanel id="contentPanel" layout="block">
				<div style="text-align: left; margin-bottom: 5px;">
					<ui:fragment rendered="#{not empty cc.attrs.itemList}">
						<ui:repeat value="#{cc.attrs.itemList}" var="unspscObj">
							<h:outputText value="#{unspscObj.unspscCode}" />
							<h:outputText value=" - " />
							<h:outputText value="#{unspscObj.unspscTitle}" />
							<br />
						</ui:repeat>
					</ui:fragment>
					<ui:fragment rendered="#{not empty cc.attrs.selectedItem}">
						<h:outputText value="#{cc.attrs.selectedItem.unspscCode}" />
						<h:outputText value=" - " />
						<h:outputText value="#{cc.attrs.selectedItem.unspscTitle}" />
						<br />
					</ui:fragment>
					<ui:fragment rendered="#{not empty cc.attrs.selectedExtItem}">
						<h:outputText value="#{cc.attrs.selectedExtItem.tempCode}" />
						<h:outputText value=" - " />
						<h:outputText value="#{cc.attrs.selectedExtItem.tempTitle}" />
						<br />
					</ui:fragment>
					<ui:fragment rendered="#{empty cc.attrs.itemList and empty cc.attrs.selectedItem and empty cc.attrs.selectedExtItem}">
						<cc:insertChildren />
					</ui:fragment>
				</div>
				
				<h:outputText value="#{cc.attrs.content}" escape="false"
					style="display:block; text-align:left; padding: 0px 0px;" />

				<div class="ppRightButton" style="text-align:right; margin-top:15px;">
					<c:choose>
						<c:when test="#{cc.attrs.hasParam}">
							<p:commandButton id="yesBtn" value="#{lbl['lbl.cm.dialog.cofirm.yes']}" partialSubmit="true"
								onstart="#{cc.attrs.widget}.hide();#{cc.attrs.loadingWidget}.show();"
								action="#{cc.attrs.okParam}"
								oncomplete="#{cc.attrs.loadingWidget}.hide();" update="#{cc.attrs.update}" />
						</c:when>
						<c:otherwise>
							<p:commandButton id="yesBtnNoParam" value="#{lbl['lbl.cm.dialog.cofirm.yes']}" partialSubmit="true"
								onstart="#{cc.attrs.widget}.hide();#{cc.attrs.loadingWidget}.show();"
								action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
								oncomplete="#{cc.attrs.loadingWidget}.hide();" update="#{cc.attrs.update}" />
						</c:otherwise>
					</c:choose>
					<p:commandButton id="noBtn"
						value="#{lbl['lbl.cm.dialog.cofirm.no']}" immediate="true"
						style="margin-left:10px;" oncomplete="#{cc.attrs.widget}.hide();" />
				</div>
			</p:outputPanel>
		</p:dialog>
	</cc:implementation>
</ui:composition>
