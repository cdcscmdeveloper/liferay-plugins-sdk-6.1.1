<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<cc:interface>
		<cc:attribute name="backingBean" required="true" />
		<cc:attribute name="smGstSupplier" required="true" />
		<cc:attribute name="isViewOnly" required="true" />
		<cc:attribute name="suppierType" default="HQ" type="java.util.String"/>
		<cc:attribute name="sameAsHq" default="false" type="java.lang.Boolean"/>
	</cc:interface>
	
	<cc:implementation>
	
	<p:outputPanel id="gstPanelId" >
		<p:outputPanel rendered="#{cc.attrs.suppierType ne 'HQ'}">
			 <table style="width: 100%">
				<tr>
					<td style="border-style: none !important;float: right !important;">
						<p:selectBooleanCheckbox value="#{cc.attrs.sameAsHq}">
							<p:ajax update="@([id$=gstPanelId])" event="change"
								process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								listener="#{cc.attrs.backingBean.copyHqGstToBranch(smGstSupplier)}" />
						</p:selectBooleanCheckbox>
					</td>
					<td valign="top" style="border-style: none !important;">
						<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.brnch.gstSame']}" />
					</td>
				</tr>
			</table>
		 </p:outputPanel>
		<p:outputPanel rendered="#{!cc.attrs.sameAsHq}">
			<table style="width: 50%">
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.gstNo']}" />
						<p:outputLabel value="*" styleClass="mandatory" 
						rendered="#{not empty cc.attrs.smGstSupplier.gstEffDate 
						or not empty cc.attrs.smGstSupplier.gstEndDate}"/>
					</td>
					<td><c:choose>
							<c:when test="#{!cc.attrs.isViewOnly}">
								<p:inputText label="#{lbl['lbl.sm.gstNo']}"
									required="#{not empty cc.attrs.smGstSupplier.gstEffDate 
									or not empty cc.attrs.smGstSupplier.gstEndDate}"
									value="#{cc.attrs.smGstSupplier.gstRegNo}"
									id="smGstRegistrationNo" size="35" maxlength="12"
									validatorMessage="#{lbl['lbl.sm.gstNo']} - #{lbl['lbl.sm.invalidNo']}">
									<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
									<p:ajax process="@this" partialSubmit="true" update="gstPanelId" />
								</p:inputText>
								<p:message id="smgstRegistrationNoMsg" for="smGstRegistrationNo"
									showSummary="true" showDetail="false" display="icon" />
							</c:when>
							<c:otherwise>
								<p:inputText label="#{lbl['lbl.sm.gstNo']}"
									value="#{cc.attrs.smGstSupplier.gstRegNo}"
									id="smGstRegistrationNoRdOnly" size="35" maxlength="12"
									readonly="true" disabled="true" />
							</c:otherwise>
						</c:choose></td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" 
						rendered="#{not empty cc.attrs.smGstSupplier.gstRegNo 
						or not empty cc.attrs.smGstSupplier.gstEndDate}"/>
					</td>
					<td><c:choose>
							<c:when test="#{!cc.attrs.isViewOnly}">
								<p:calendar id="gstEffDate" showOn="button" navigator="true"
									display="inline" label="#{lbl['lbl.sm.gst.effdate']}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									yearRange="-99:+0" readonlyInput="true"
									maxdate="#{CommonConstants.CURRENT_DATE}"
									value="#{cc.attrs.smGstSupplier.gstEffDate}" 
									required="#{not empty cc.attrs.smGstSupplier.gstRegNo 
									or not empty cc.attrs.smGstSupplier.gstEndDate}">
									<p:ajax event="dateSelect"  update="gstPanelId" process="@this" partialSubmit="true"/>
								</p:calendar>
								<p:message id="gstEffDateMsg" for="gstEffDate"
									showSummary="true" showDetail="false" display="icon" />
							</c:when>
							<c:otherwise>
								<p:inputText
									value="#{cc.attrs.smGstSupplier.gstEffDate}"
									readonly="true" size="35">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText>
							</c:otherwise>

						</c:choose></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td><c:choose>
							<c:when test="#{!cc.attrs.isViewOnly}">
								<p:calendar id="gstEndDate" showOn="button" navigator="true"
									display="inline" label="#{lbl['lbl.sm.gst.eff.end.date']}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									yearRange="-99:+0" readonlyInput="true"
									mindate="#{CommonConstants.CURRENT_DATE}"
									value="#{cc.attrs.smGstSupplier.gstEndDate}" >
									<p:ajax event="dateSelect"  update="gstPanelId" process="@this" partialSubmit="true"/>
								</p:calendar>
								<p:message id="gstEndDateMsg" for="gstEndDate"
									showSummary="true" showDetail="false" display="icon" />
							</c:when>
							<c:otherwise>
								<p:inputText
									value="#{cc.attrs.smGstSupplier.gstEndDate}"
									readonly="true" size="35">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</p:inputText>
							</c:otherwise>
						</c:choose></td>
				</tr>
				<tr>
					<td colspan="2">
						<p:dataTable var="table" id="hqSuppDocDtId" value="#{cc.attrs.smGstSupplier.smGstSupplierDocs}" rowIndexVar="index">
				
							<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
								style="width : 5%;">
								<p:outputLabel value="#{index + 1}"
									style="float: left;white-space: normal;" />
							</p:column>
				
							<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}"
								style="width : 55%;">
								<h:outputText value="#{table.pmDocument.docName}"
									style="float: left;white-space: normal;" />
							</p:column>
				
							<p:column headerText="#{lbl['lbl.btn.upload.doc']}"
								style="width : 20%;" rendered="#{!cc.attrs.isViewOnly}">
				
								<p:commandLink oncomplete="gstUploadDialog.show();return false;"
									rendered="#{!table.pmDocument.hardCopyReq}"
									update="@([id$=gstUploadDialog])"
									action="#{cc.attrs.backingBean.assignSelectedGstDoc(table)}">
									<p:graphicImage value="/css/images/design/upload.png"
										style="margin-right:2px;" />
								</p:commandLink>
				
							</p:column>
							<p:column headerText="#{lbl['lbl.pm.document.name']}"
								style="width : 20%;">
								<h:outputText value="#{table.fileName}" rendered="#{not empty table.fileName}"
									style="float: left;white-space: normal;" />
								<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty table.fileName}" />
							</p:column>
						</p:dataTable>
					</td>
				</tr>
			</table>
		</p:outputPanel>
		
		<p:outputPanel rendered="#{cc.attrs.sameAsHq}">
		 	<ui:include src="/xhtml/sm/shared/gstInformation/gstDisableFields.xhtml" />
		</p:outputPanel>
	</p:outputPanel>
		
		<p:dialog id="gstUploadDialog" widgetVar="gstUploadDialog" modal="true"
			dynamic="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
			<p:fileUpload allowTypes="/(\.|\/)(pdf|doc|docx)$/"
				sizeLimit="1000000"
				invalidFileMessage="#{lbl['lbl.sm.upload.format.errmsg']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed1Mb']}"
				fileUploadListener="#{cc.attrs.backingBean.handleGstSupDocFileAttachment}"
				update="@form" oncomplete="gstUploadDialog.hide();" />
		</p:dialog>
	</cc:implementation>

</ui:component>
