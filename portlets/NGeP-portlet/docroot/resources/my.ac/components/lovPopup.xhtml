<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:ac="http://ac.my/jsf/composite/cc">
    
<cc:interface>
	<!-- <cc:attribute name="required" />
	<cc:attribute name="value" /> -->
</cc:interface>

<cc:implementation>
	<p:remoteCommand name="updateSearchDialog" update="searchPanel lovTitle resultPanel" partialSubmit="true" process="@this resultPanel" />
	<p:remoteCommand name="resetAllData" update="searchPanel lovTitle resultPanel" partialSubmit="true" action="#{lovBackingBean.resetAction}" process="@this" />
	
	<p:dialog id="lovPopup" widgetVar="lovPopup" modal="true" width="700" position="top" onHide="resetAllData();">
	
		<f:facet name="header">
			<h:panelGroup id="lovTitle">#{lovBackingBean.lovBean.title} Listing</h:panelGroup>
		</f:facet>
		
		<p:panel header="Search" toggleable="true">
		
		<h:panelGroup id="searchPanel" style="width:100%;">

		<ui:include src="lovSearchPanel.xhtml" />

		<table style="width:100%;"><tr><TD style="text-align:right;">
			<p:commandButton 
				icon="ui-icon-search"
				value="#{lbl['lbl.btn.search']}"
				action="#{lovBackingBean.searchAction}"
				partialSubmit="true"
				process="searchPanel"
				update="resultPanel">
			</p:commandButton>		
			<p:commandButton
				icon="ui-icon-reset"
				value="#{lbl['lbl.btn.reset']}"
				action="#{lovBackingBean.resetAction}"
				partialSubmit="true"
				process="searchPanel"
				update="searchPanel resultPanel">
			</p:commandButton>
		</TD></tr></table>

		</h:panelGroup>
		</p:panel>
		<p:panel header="Result" toggleable="true">
		<h:panelGroup id="resultPanel" style="width:100%;">
			
			<h:panelGroup rendered="#{lovBackingBean.lovBean.selectionMode == 'single'}">
			<p:dataTable id="lovTb"
				var="entity" 
				selection="#{lovBackingBean.selectedEntity}"
				selectionMode="single"
				rowIndexVar="rowIndex"
				rowKey="#{entity[lovBackingBean.lovBean.pk]}"
				rows="10"
				lazy="true"
				value="#{lovBackingBean.searchDataModel}" >
				
				<ac:paginator for="lovTb" />
				
				<!-- <p:column selectionMode="single" style="width:2%" /> 
				
				<p:column width="5%">
					<f:facet name="header">
						<p:outputLabel value="No." />
					</f:facet>
					<p:outputLabel value="#{rowIndex + 1}" />
				</p:column> -->
				
				<p:columns var="column" value="#{lovBackingBean.columnsToDisplay}">
				
					<f:facet name="header">  
		                #{column.columnTitle}  
		            </f:facet>
						#{column.columnNameve.getValue(facesContext.ELContext)}
				</p:columns>
				
			</p:dataTable>
			</h:panelGroup>

			<h:panelGroup rendered="#{lovBackingBean.lovBean.selectionMode == 'multiple'}">
			<p:dataTable id="lovTb2"
				var="entity" 
				selection="#{lovBackingBean.selectedEntities}"
				rowIndexVar="rowIndex"
				rowKey="#{entity[lovBackingBean.lovBean.pk]}"
				rows="10"
				lazy="true"
				value="#{lovBackingBean.searchDataModel}" >
				
				<ac:paginator for="lovTb2" />
				
				<p:column selectionMode="multiple" style="width:2%" /> 
				
				<!-- <p:column width="5%">
					<f:facet name="header">
						<p:outputLabel value="No." />
					</f:facet>
					<p:outputLabel value="#{rowIndex + 1}" />
				</p:column> -->
				
				<p:columns var="column" value="#{lovBackingBean.columnsToDisplay}">
				
					<f:facet name="header">  
		                #{column.columnTitle}  
		            </f:facet>
						#{column.columnNameve.getValue(facesContext.ELContext)}
				</p:columns>
				
			</p:dataTable>
			</h:panelGroup>

			<table style="width:100%;"><tr><TD style="text-align:right;">
				<p:commandButton 
					id="slbtn"
					value="Select"
					action="#{lovBackingBean.populateToSaveObject}"
					update="searchPanel #{lovBackingBean.lovBean.clientId} #{lovBackingBean.lovBean.update}"
					oncomplete="lovPopup.hide();"
					process="resultPanel"
					partialSubmit="true" />	
			</TD></tr></table>
			
		</h:panelGroup>
		</p:panel>
	</p:dialog>
</cc:implementation>
</ui:composition>
