<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="id" default="#{cc.id}"/>
	</cc:interface>

	<cc:implementation>
	<!-- Enhancement #19245 -->
		<c:if test="#{!cc.attrs.bBean.managedBean.isCdcCollector()}">
			<p:selectManyCheckbox label="#{lbl['lbl.rpt.smPaymentType']}" id="#{cc.attrs.id}"
				value="#{cc.attrs.bBean.managedBean.selectedPaymentTypes}" required="#{cc.attrs.required}"
				disabled="#{cc.attrs.disabled}">
				<f:selectItem itemLabel="#{lbl['lbl.rpt.smProcessingFee']}" itemValue="P" />
				<f:selectItem itemLabel="#{lbl['lbl.rpt.smRegistrationFee']}" itemValue="M" />
				<f:selectItem itemLabel="#{lbl['lbl.rpt.smSoftCertificateFee']}" itemValue="S" />
			</p:selectManyCheckbox>
		</c:if>	
		<c:if test="#{cc.attrs.bBean.managedBean.isCdcCollector()}">		
			<h:outputText value="#{lbl['lbl.rpt.smSoftCertificateFee']}" /> 
			<ui:param name="softCert" value="#{cc.attrs.bBean.managedBean.softCert}" />
		</c:if>
	<!-- end of Enhancement #19245 -->	 
		<p:message id="#{cc.attrs.id}Msg" for="#{cc.attrs.id}" display="icon" showDetail="false" />
	</cc:implementation>
</ui:composition>
