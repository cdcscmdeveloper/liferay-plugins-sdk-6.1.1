<ui:composition
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

<cc:interface>
	<cc:attribute name="attachment" required="true" />
	<cc:attribute name="readonly" default="false" />
	<cc:attribute name="encrypted" default="false" />
	<cc:attribute name="encryptionKey" required="#{cc.attrs.encrypted}" />
	<cc:attribute name="popupWidgetVar" required="true" />
	<cc:attribute name="rowIndex" default="0" />
	<cc:actionSource name="actionEvent" targets="#{cc.attrs.id}Btn" />
</cc:interface>

<cc:implementation>
	<h:panelGroup id="#{cc.attrs.id}">
		<p:commandButton id="#{cc.attrs.id}Btn"
			icon="ui-icon-upload"
			partialSubmit="true" process="@this" update="@([id$=#{cc.attrs.popupWidgetVar}Id])"
			oncomplete="#{cc.attrs.popupWidgetVar}.show();return false;"
			disabled="#{readonly}"
			rendered="#{empty cc.attrs.attachment}">
			<cc:insertChildren />
		</p:commandButton>
		
		<h:panelGroup rendered="#{!empty cc.attrs.attachment}">
			<c:choose>
				<c:when test="#{cc.attrs.encrypted}">
					<h:commandLink value="#{cc.attrs.attachment.fileName}" styleClass="blue_font"
						immediate="true"
						action="#{scRemarkAndAttachmentBackingBean.downloadEncryptedFile(cc.attrs.attachment, cc.attrs.encryptionKey)}" />
				</c:when>
				<c:otherwise>
					<h:commandLink value="#{cc.attrs.attachment.fileName}" styleClass="blue_font"
						immediate="true"
						action="#{scRemarkAndAttachmentBackingBean.downloadFile(cc.attrs.attachment)}" />
				</c:otherwise>
			</c:choose>
			<p:commandLink 
				process="@this" partialSubmit="true" update="@([id$=#{cc.attrs.popupWidgetVar}delAttPopupId])"
				oncomplete="#{cc.attrs.popupWidgetVar}delAttPopup.show();" 
				rendered="#{!cc.attrs.readonly}">
				<h:graphicImage
					value="#{CommonUIConstant.imagePathUptoDesign}/icon_trash.png"
					styleClass="tasklist_title1" />
				<f:setPropertyActionListener
					target="#{scRemarkAndAttachmentBackingBean.selectedComponentId}"
					value="#{cc.attrs.id}#{rowIndex}" />
			</p:commandLink>
		</h:panelGroup>
	</h:panelGroup>
		
	<c:if test="#{!cc.attrs.readonly}">
		<p:remoteCommand name="#{cc.attrs.id}#{rowIndex}deleteSelAttachment"
			partialSubmit="true" process="@this" update="@([id$=#{cc.attrs.id}])">
			<f:setPropertyActionListener target="#{cc.attrs.attachment}" value="#{null}" />
		</p:remoteCommand>
	</c:if>
</cc:implementation>
</ui:composition>
