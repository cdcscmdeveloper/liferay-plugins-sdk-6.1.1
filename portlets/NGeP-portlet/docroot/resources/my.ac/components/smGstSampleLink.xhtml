<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="dialogWidget" required="true" />
	</cc:interface>

	<cc:implementation>
		
		<p:blockUI block=":form" widgetVar="blockGstWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:dialog id="#{cc.attrs.dialogWidget}" widgetVar="#{cc.attrs.dialogWidget}" modal="true"
			dynamic="true" resizable="false" width="900px"
			height="700px" styleClass="pop_up_top" 
			header="#{lbl['lbl.sm.gst.sample']}">
			<p:media value="#{applicationBean.getGstSample()}" 
				width="100%" height="700px" player="pdf" />
			<p:panelGrid styleClass="noBorders tr,noBorders td" >
				<p:row>
					<p:column width="100%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.btn.close']}"
							onclick="#{cc.attrs.dialogWidget}.hide()" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:dialog>
		
		<p:commandLink action="#{applicationBean.onClickGstSample(cc.attrs.dialogWidget)}" update="#{cc.attrs.dialogWidget}"
		   onstart="blockGstWidget.show()" oncomplete="blockGstWidget.hide()" process="@this" 
		   title="#{lbl['lbl.sm.gst.click.sample']}">
		   	<p:graphicImage value="/css/images/design/tooltips.png" /> 
		</p:commandLink>
			   
	</cc:implementation>
</ui:component>
