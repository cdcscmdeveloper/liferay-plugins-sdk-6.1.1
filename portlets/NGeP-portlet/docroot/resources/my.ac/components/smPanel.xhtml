<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id" />
	</cc:interface>

	<cc:implementation>
		<!-- #38890 -->
		<p:confirmDialog id="saveDraftConfirmDialog_#{cc.attrs.id}" closable="true"
			message="#{lbl['lbl.sm.savefirsttime.confirm.msg']}"
			header="#{lbl['lbl.sm.savefirsttime.confirm.header']}" severity="alert"
			widgetVar="saveDraftConfirmDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" onclick="saveDraftConfirmDialog.hide();" 
					action="#{backingBean.confirmSaveDraftFirstTime}" update="@form"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="saveDraftConfirmDialog.hide();" />
			</div>
		</p:confirmDialog>
		
		<p:outputPanel id="#{cc.attrs.id}" layout="block">
			
			<style type="text/css">
				.container-fluid{
					display:table !important;
					width: 100% !important;
				}
			</style>
			
			<cc:insertChildren />

		</p:outputPanel>
		
	</cc:implementation>
</ui:component>
