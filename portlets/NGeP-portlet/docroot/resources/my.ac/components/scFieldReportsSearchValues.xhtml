<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="true" />
	</cc:interface>

	<cc:implementation>
		<style type="text/css">
/* 
  for SC Screens allignement
*/
.columnWidthSc1 {
	width: 18%;
}

.columnWidthSc2 {
	width: 0%;
}

.columnWidthSc3 {
	width: 0%;
}

.columnWidthSc4 {
	width: 32.5%;
}

/* for Common allignement for all screens */
.columnGenClass {
	width: 15%;
}

.columnDateFromClass {
	width: 13%;
}

.columnDateToClass {
	width: 1%;
}

.columnDateRangeClass {
	margin-top: -3%;
}

.columnDateFromWidthClass {
	width: 46%;
}

.columnDateToWidthClass {
	width: 6.4%;
}
</style>

		<h:outputText styleClass="instruction"
			style="float:left;margin-left:20px;"
			value="#{lbl['lbl.instruction.mandatory']}" />

		<ui:param name="qtNumEnabelDisable"
			value="#{qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_LETTER_OF_ACCPT_OR_RPT_VAL and qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_QUOT_TENDER_OR_RPT_VAL}"></ui:param>
		<ui:param name="statusEnabelDisable"
			value="#{qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_PRAPOSAL_SUB_LST_OR_RPT_VAL and qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_SUMMRY_SRC_OR_RPT_VAL}"></ui:param>
		<ui:remove>#29580 add SC_PRICE_SCHEDULE_OR_RPT_VAL -start</ui:remove>
		<ui:param name="publishDateEnableDisable"
			value="#{qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_QUOT_TENDER_OR_RPT_VAL and qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_PRICE_SCHEDULE_OR_RPT_VAL}"></ui:param>
		<ui:remove>#29580 add SC_PRICE_SCHEDULE_OR_RPT_VAL -end</ui:remove>	
		<!--#29580 - Start (Harun)-->
		<ui:param name="createdDateEnableDisable"
			value="#{qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_PRICE_SCHEDULE_OR_RPT_VAL}"></ui:param>
		<ui:param name="brifSiteStatusEnabelDisable"
			value="#{qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_BRIF_SITE_VISIT_OR_RPT_VAL}"></ui:param>
		<ui:param name="priceSchStatusEnabelDisable"
			value="#{qtReportMainBB.managedBean.reportCode ne QtReportConst.SC_PRICE_SCHEDULE_OR_RPT_VAL}"></ui:param>
		<ui:remove>#29580-start</ui:remove>
		<ui:param name="qtTitleEnabelDisable"
			value="#{qtReportMainBB.managedBean.reportCode eq QtReportConst.SC_PRICE_SCHEDULE_OR_RPT_VAL}"></ui:param>
		<ui:remove>#29580-end</ui:remove>		
	    <!--#29580 - End (Harun)-->
		
		<ui:param name="deskofficerEnableDisable"
			value="#{cc.attrs.bBean.retriveUserRoles()}"></ui:param>
		<ui:param name="ptjEnableDisable"
			value="#{cc.attrs.bBean.retrivePtjRoles()}"></ui:param>
		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:panelGrid id="scReportCriteria" columns="4"
						columnClasses="columnWidthSc1,columnWidthSc2,columnWidthSc3,columnWidthSc4"
						style="width:85%;">
						<p:outputLabel value="#{lbl['lbl.rpt.scProcurementMethod']}"
							style="margin-top:5px;width:160px;" />
						<p:selectManyCheckbox id="procureAllChk"
							value="#{cc.attrs.bBean.managedBean.scReportSearchBean.allCheckboxValue}">
							<f:selectItem itemLabel="#{lbl['lbl.rpt.sc.chkall']}"
								itemValue="A"
								itemDisabled="#{cc.attrs.bBean.managedBean.scReportSearchBean.allCheckboxEditView}" />
							<p:ajax event="change"
								listener="#{cc.attrs.bBean.onSelectEffectedValues(cc.attrs.bBean.managedBean.scReportSearchBean)}"
								partialSubmit="true" process="@this"
								update="@([id$=quotationChk],[id$=tenderChk],[id$=restrctdTenderChk])" />
						</p:selectManyCheckbox>

						<p:outputLabel value="" style="margin-top:5px;width:160px;" />
						<p:selectManyCheckbox id="quotationChk"
							value="#{cc.attrs.bBean.managedBean.scReportSearchBean.quotationCheckboxValue}">
							<f:selectItem itemLabel="#{lbl['lbl.rpt.sc.quotation']}"
								itemValue="Q"
								itemDisabled="#{cc.attrs.bBean.managedBean.scReportSearchBean.quotationCheckboxEditView}" />
							<p:ajax event="change"
								listener="#{cc.attrs.bBean.onSelectEffectedValues(cc.attrs.bBean.managedBean.scReportSearchBean)}"
								partialSubmit="true" process="@this"
								update="@([id$=procureAllChk],[id$=tenderChk],[id$=restrctdTenderChk])" />
						</p:selectManyCheckbox>

						<p:outputLabel value="" style="margin-top:5px;width:160px;" />
						<p:selectManyCheckbox id="tenderChk" 
							value="#{cc.attrs.bBean.managedBean.scReportSearchBean.tenderCheckboxValue}">
							<f:selectItem itemLabel="#{lbl['lbl.rpt.sc.tender']}"
								itemValue="T"
								itemDisabled="#{cc.attrs.bBean.managedBean.scReportSearchBean.tenderCheckboxEditView}" />
							<p:ajax event="change"
								listener="#{cc.attrs.bBean.onSelectEffectedValues(cc.attrs.bBean.managedBean.scReportSearchBean)}"
								partialSubmit="true" process="@this"
								update="@([id$=procureAllChk],[id$=quotationChk],[id$=restrctdTenderChk])" />
						</p:selectManyCheckbox>

						<p:outputLabel value="" style="margin-top:5px;width:160px;" />
						<p:selectManyCheckbox id="restrctdTenderChk"
							value="#{cc.attrs.bBean.managedBean.scReportSearchBean.restrictedTndrCheckboxValue}">
							<f:selectItem itemLabel="#{lbl['lbl.rpt.sc.restrict.tender']}"
								itemValue="R"
								itemDisabled="#{cc.attrs.bBean.managedBean.scReportSearchBean.restrictedTndrCheckboxEditView}" />
							<p:ajax event="change"
								listener="#{cc.attrs.bBean.onSelectEffectedValues(cc.attrs.bBean.managedBean.scReportSearchBean)}"
								partialSubmit="true" process="@this"
								update="@([id$=procureAllChk],[id$=quotationChk],[id$=tenderChk])" />
						</p:selectManyCheckbox>
						
						<ui:remove>#29580-start</ui:remove>
						<c:if test="#{qtTitleEnabelDisable}">	
							<p:outputLabel value="#{lbl['lbl.sc.title']}"
								style="margin-top:5px;width:100px;" />
							<p:inputText id="rptTitle"
								value="#{cc.attrs.bBean.managedBean.quotationTitle}"
								style="margin-top:5px;width:255px;"/>
						</c:if>
						<ui:remove>#29580-end</ui:remove>

						<c:if test="#{qtNumEnabelDisable}">
							<p:outputLabel value="#{lbl['lbl.rpt.qtNo']}"
								style="margin-top:5px;width:100px;" />
							<p:inputText id="rptQuotation"
								value="#{cc.attrs.bBean.managedBean.quotationNumber}"
								style="margin-top:5px;width:115px;">
								<p:ajax event="blur" process="@form" partialSubmit="true"
									listener="#{cc.attrs.bBean.quotationNumberValidation()}"
									update="@form" />
							</p:inputText>
						</c:if>

						<c:if test="#{ptjEnableDisable}">
							<p:outputLabel value="#{lbl['lbl.rpt.ptj']}"
								style="margin-top:5px;width:130px;" />
							<p:selectOneMenu
								value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scPtj}"
								style="margin-top:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>

								<f:selectItems value="#{cc.attrs.bBean.retrievePTJList()}"></f:selectItems>
								<p:ajax event="change" partialSubmit="true" update="@this"
									process="@this" />
							</p:selectOneMenu>
						</c:if>
						<c:if test="#{deskofficerEnableDisable}">
							<p:outputLabel value="#{lbl['lbl.rpt.deskOfficer']}"
								style="margin-top:5px;width:160px;" />
							<p:selectOneMenu
								value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scDeskOfficer}"
								style="margin-top:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>

								<f:selectItems value="#{cc.attrs.bBean.retrieveDescOfficer()}"></f:selectItems>
								<p:ajax event="change" partialSubmit="true" update="@this" />
							</p:selectOneMenu>
						</c:if>
						<!--#29580 - Start (Harun) change from dropdownlist to selectManyMenu-->
						<c:if test="#{statusEnabelDisable and brifSiteStatusEnabelDisable and priceSchStatusEnabelDisable}">
							<p:outputLabel value="#{lbl['lbl.rpt.status']}"
								style="margin-top:5px;width:160px;" />
							 <p:selectManyMenu id="manyMenuSts" value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scStatusManyMenu}" 
								converter="#{statusConverter}" filter="true" multiple="true" filterMatchMode="startsWith" showCheckbox="true" styleClass="manymenu-advanced"
								style="width:300px;height:100px;position:relative;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue="#{lbl['lbl.rpt.all']}" >
								</f:selectItem>
								<f:selectItems
									value="#{cc.attrs.bBean.reportStatusDropdownValuesSelectManyMenu(qtReportMainBB.managedBean.reportCode)}"
									var="status" itemValue="#{status}" itemLabel="#{status}" 
									itemDisabled="#{cc.attrs.bBean.isDisabled(status,qtReportMainBB.managedBean.reportCode)}" ></f:selectItems>
								<p:ajax event="change" process="@this" update="@this"
								listener="#{cc.attrs.bBean.onSelectAll(qtReportMainBB.managedBean.reportCode)}" />	
							</p:selectManyMenu>
						</c:if>
						<!--#29580 - End (Harun) change from dropdownlist to selectManyMenu-->
					</h:panelGrid></td>
			</tr>
		</table>

        <!--#29580 - Start (Harun) add checking if disabled--> 
		<c:if test="#{createdDateEnableDisable}">
		<TABLE style="width: 85%;" id="createDateTable">
			<TR>
				<TD><p:outputLabel value="#{lbl['lbl.rpt.createdFrom']}"
						style="margin-top:5px;width:162px;margin-left:-8px" /></TD>
				<TD><p:selectOneMenu
						value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scCreatedFromMonth}"
						style="margin-top:5px;width:154px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{cc.attrs.bBean.generateMonthList()}"></f:selectItems>
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{cc.attrs.bBean.createdToMonthUpdate(cc.attrs.bBean.managedBean.scReportSearchBean)}"
							update="@([id$=createMonth])" />
					</p:selectOneMenu></TD>
				<TD><p:selectOneMenu
						value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scCreatedFromYear}"
						style="margin-top:5px;width:132px;">
						<f:selectItems value="#{cc.attrs.bBean.generateYearList()}"></f:selectItems>
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{cc.attrs.bBean.createdToDtUpdate(cc.attrs.bBean.managedBean.scReportSearchBean)}"
							update="@([id$=createDt])" />
					</p:selectOneMenu></TD>
				<TD><p:outputLabel value="#{lbl['lbl.rpt.createdTo']}"
						style="margin-top:5px;width:145px;;margin-left:4px" /></TD>
				<TD><p:selectOneMenu id="createMonth"
						value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scCreatedToMonth}"
						style="margin-top:5px;width:151px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{cc.attrs.bBean.generateMonthList()}"></f:selectItems>
						<p:ajax event="change" process="@this" partialSubmit="true" />
					</p:selectOneMenu></TD>
				<TD><p:selectOneMenu id="createDt" disabled="true"
						value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scCreatedToYear}"
						style="margin-top:5px;width:132px;">
						<f:selectItems value="#{cc.attrs.bBean.generateYearList()}"></f:selectItems>
						<p:ajax event="change" process="@this" partialSubmit="true" />
					</p:selectOneMenu></TD>
			</TR>
		</TABLE>
		</c:if>
		<!--#29580 - End (Harun) add checking if disabled--> 

		<c:if test="#{publishDateEnableDisable}">
			<TABLE style="width: 100%;">
				<TR>
					<TD class="columnGenClass"><p:outputLabel
							value="#{lbl['lbl.rpt.publishedDt']}" style="width:181px;" /></TD>
					<TD class="columnDateFromClass"><p:calendar showOn="button"
							value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scPublishFromDate}"
							navigator="true" display="inline" readonlyInput="true" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">

						</p:calendar></TD>
					<TD class="columnDateToClass"><p:outputLabel
							value="#{lbl['lbl.rpt.dtRangeTo']}" style="width:57px;" /></TD>
					<TD><p:calendar showOn="button" navigator="true"
							value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scPublishToDate}"
							display="inline" readonlyInput="true" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
						</p:calendar></TD>
				</TR>
			</TABLE>
		</c:if>
	</cc:implementation>
</ui:component>
