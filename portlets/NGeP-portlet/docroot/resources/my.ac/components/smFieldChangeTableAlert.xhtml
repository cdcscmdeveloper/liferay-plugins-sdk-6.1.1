<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="object" required="true"/>
	</cc:interface>

	<cc:implementation>
		<p:outputPanel rendered="#{not empty cc.attrs.object.changedFieldStatus}">
		&#160;
		 	<p:graphicImage id="alertChangeDtImgId" style="vertical-align:top"
				value="/css/images/design/icon_alert.png" />
			<p:tooltip id="alertChangeDtTtId" for="alertChangeDtImgId">
				<p:outputLabel escape="false"
					value="#{cc.attrs.object.changedFieldStatus eq 'N' ? lbl['lbl.sm.newly.added'] : lbl['lbl.sm.ammend']}" />
			</p:tooltip>
		</p:outputPanel>
	</cc:implementation>

</ui:component>
