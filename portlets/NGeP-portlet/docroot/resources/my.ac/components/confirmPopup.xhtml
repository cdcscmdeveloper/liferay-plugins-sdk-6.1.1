<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="message" required="true" />
		<cc:attribute name="okAction" required="true" />
	</cc:interface>

	<cc:implementation>
				<p:dialog id="confirmDialog" header="#{lbl['lbl.sm.userprofile.confirmation']}"
					widgetVar="confirmDialog" modal="true" width="500px" height="100px">
					<p:panel id="dPanel" style="border: none;">
						<table style="width: 100%">
							<tr>
								<td style="white-space: nowrap;"><p:outputLabel value="#{cc.attrs.message}" style="float:left"/></td>
							</tr>
						</table>
					</p:panel>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDialog.hide();" action="#{cc.attrs.okAction}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" update="@form" />
						<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDialog.hide();" />
					</div>
				</p:dialog>
			
	</cc:implementation>
</ui:component>
