<!-- 25651 - Start -->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="true" />
	</cc:interface>

	<cc:implementation>
	
	<p:panel
		header="#{lbl['lbl.sc.list.of.report.stage.section']}"
		toggleable="true">

		<p:dataTable id="contentReportTbl" widgetVar="contentsTblWidget"
			var="scReport"
			value="#{cc.attrs.bBean.managedBean.qtReportDocumentList}"
			rows="10" rowKey="#{scReport}" rowIndexVar="rowIndex">
			<ac:paginator for="contentReportTbl" />
			
			<p:column headerText="#{lbl['lbl.sc.no']}">
		       #{rowIndex + 1}
		    </p:column>
		   
		    <p:column headerText="#{lbl['lbl.rpt.qtNo']}">
				<h:outputText value="#{cc.attrs.bBean.managedBean.quotationNumber}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.rpt.reportName']}">
				<h:outputText value="#{scReport.title}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.created.date']}">
				<h:outputText
					value="#{scReport.createdDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.sc.action']}">
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{cc.attrs.bBean.downloadReport(scReport)}" />
			</p:column>
		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
				styleClass="ui-button" action="#{cc.attrs.bBean.downloadAllReports}" />
		</div>
		
      </p:panel>
	
	
	</cc:implementation>
</ui:component>
<!-- 25651 - End -->
