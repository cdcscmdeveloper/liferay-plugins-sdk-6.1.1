<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="historyPaginator" required="true" />
		<cc:attribute name="memberHistoryPaginator" required="true" />
		<cc:attribute name="selectedHistory" required="true" />
	    <cc:attribute name="onSelectHistory" required="true" />
	    <cc:attribute name="committeeName" required="true" />
	    <cc:attribute name="isSFCommittee" default="#{false}" required="false" />
	    <cc:attribute name="isLegacy" default="#{false}" required="false" /><ui:remove>25037 note 670, add islegacy</ui:remove>
	</cc:interface>

	<cc:implementation>
		<ui:param name="historyPaginator" value="#{cc.attrs.historyPaginator}"/>
		<ui:param name="memberHistoryPaginator" value="#{cc.attrs.memberHistoryPaginator}" />
		<ui:param name="selectedHistory" value="#{cc.attrs.selectedHistory}" />
		<ui:param name="committeeName" value="#{cc.attrs.committeeName}" />
		<ui:param name="onSelectHistory" value="#{cc.attrs.onSelectHistory}" />
		<ui:param name="backingBean" value="#{cc.attrs.backingBean}" />
		<ui:param name="isSFCommittee" value="#{cc.attrs.isSFCommittee}" />
		<ui:param name="isLegacy" value="#{cc.attrs.isLegacy}" /> <ui:remove>25037 note 670, add islegacy</ui:remove>
		
		<style>
			.firstCol {
				width: 25%;
				min-width: 220px;
				vertical-align: top;
				height: auto;
			}
			.secondCol {
				width: 75%;
				vertical-align: top;
				height: auto;
			}
			.gridContainer{
			    width: 100%;
			}
			.sp-centered{
				text-align:center; 
				display: block;
			}
			.history-member-table span > img{
				margin-top: -4px;
			}
		</style>
		
		<h:panelGroup id="updateId" layout="block" >
		<h:panelGrid columns="2" styleClass="gridContainer"
			columnClasses="firstCol, secondCol">
			<p:panel id="historyPanelId" header="#{lbl['lbl.sc.history']}">
				<p:dataTable id="historyTableId" styleClass=""
					value="#{historyPaginator.model}"
					var="history" rowKey="#{history}" rowIndexVar="index"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					selectionMode="single"
					selection="#{selectedHistory}">
					<p:ajax event="rowSelect" listener="#{backingBean[onSelectHistory]}" update="@([id$=updateId])" />
					<p:column>
						<f:facet name="header" >
      						<h:outputText value="#{lbl['lbl.sm.no']}" styleClass="sp-centered"/>
   						</f:facet>
						<h:outputText value="#{((historyPaginator.pageIndex-1)*5)+(index+1)}" styleClass="sp-centered"/>
					</p:column>

					<p:column>
						<f:facet name="header" >
      						<h:outputText value="#{lbl['lbl.sc.created.date']}" styleClass="sp-centered"/>
   						</f:facet>
						<h:outputText value="#{history.createdDate}" styleClass="sp-centered">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
				<ac:detachablePaginator minimal="true" loopId="@([id$=historyPanelId])" paginatorObject="#{historyPaginator}" />
			</p:panel>
			<p:panel id="historyMemberPanelId"
				header="#{committeeName}">
				<p:dataTable id="historyMemberTableId" styleClass="history-member-table"
					value="#{memberHistoryPaginator.model}"
					var="member" rowIndexVar="index"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
					<p:column headerText="#{lbl['lbl.sc.name']}">
						<h:outputText value="#{member.memberName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.identification.no']}">
						<h:outputText value="#{member.identificationNo}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.designation']}"
						style="white-space: normal;">
						<h:outputText value="#{member.designation}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.email']}">
						<h:outputText value="#{member.email}" style="white-space: normal;" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
						<h:outputText value="#{member.grade}" />
					</p:column>
					<p:column style="width: 6%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.pnp']}" />
							<ac:iconTooltip id="pnpId"
								value="#{lbl['lbl.sc.pnp.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{lbl[ member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>
						<p:column style="width: 13%">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.role']}" />
							</f:facet>
							<h:outputText
								value="#{qTDetailBB.getParameterDesc('CR', member.memberRole)}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.representative.type']}" rendered="#{isSFCommittee}">
						<h:outputText value="#{qTDetailBB.getParameterDesc(qTDetailBB.getRepresentativeType(selectedHistory.committeeType), member.representativeType)}" /><ui:remove><!-- 25037 - note 677 --></ui:remove>
						</p:column>
					</p:dataTable>
				<ac:detachablePaginator loopId="@([id$=historyMemberTableId])" paginatorObject="#{memberHistoryPaginator}" />
			</p:panel>
		</h:panelGrid>
		<h:panelGrid columns="1" styleClass="gridContainer" rendered="#{isSFCommittee and isLegacy}"><ui:remove>25037 note 670, add islegacy</ui:remove>
			<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true" >
				<p:dataTable
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{selectedHistory.scCommittee.scQtCommittees}"
					var="scQtCommittee">
					<p:column headerText="#{lbl['lbl.sc.qtn.no']}" style="width:15%">
					#{scQtCommittee.scQt.qtNo}
				</p:column>
					<p:column headerText="#{lbl['lbl.sc.title']}" style="width:10px;">
					#{scQtCommittee.scQt.qtTitle}
				</p:column>
					<p:column headerText="#{lbl['lbl.sc.procurement.mode']}"
						style="width:10%">
					#{committeBackingBean.getParameterDesc(scQtCommittee.scQt.procurementMode)}
				</p:column>
					<p:column headerText="#{lbl['lbl.sc.created.date']}"
						style="width:10%">
						<h:outputText value="#{scQtCommittee.scQt.createdDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.status']}" style="width:10%">
						<h:outputText
							value="#{committeBackingBean.getStatusDescById(scQtCommittee.scQt.qtStatus.statusId)}" />
					</p:column>
				</p:dataTable>
				<br />
				<table style="width: 100%">
					<tr>
						<td style="width: 2px"><p:outputLabel
								value="#{lbl['lbl.sc.total']}" /></td>
						<td colspan="3"><p:inputText
								value="#{selectedHistory.scCommittee.scQtCommittees.size()}"
								readonly="true" style="text-align: right;" /></td>
					</tr>
				</table>
			</p:panel>
		</h:panelGrid>
		</h:panelGroup>
	</cc:implementation>
</ui:composition>
