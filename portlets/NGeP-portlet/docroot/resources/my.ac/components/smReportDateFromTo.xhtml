<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
	</cc:interface>

	<cc:implementation>
		<table style="width: 100%;">
			<tr>
				<td class="columnDateFromClass">
					<p:calendar label="#{lbl['lbl.rpt.frmdate']}"
						id="calDtFrm" showOn="button" navigator="true"
						display="inline" readonlyInput="true" size="9" update="calDtTo" 
						value="#{cc.attrs.bBean.managedBean.dateFrom}" required="true" maxdate="#{CommonConstants.CURRENT_DATE}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"  update="calDtTo" process="@this"/>
					</p:calendar>
					<p:message id="calDtFrmMsg" for="calDtFrm" display="icon" showDetail="false" />
				</td>
				
				<td class="columnDateToClass"><p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
				<td><p:calendar label="#{lbl['lbl.rpt.todate']}"
					id="calDtTo" showOn="button" navigator="true" disabled="#{empty cc.attrs.bBean.managedBean.dateFrom}"
					display="inline" readonlyInput="true" size="9" mindate="#{cc.attrs.bBean.managedBean.dateFrom}"
					value="#{cc.attrs.bBean.managedBean.dateTo}" required="true" maxdate="#{CommonConstants.CURRENT_DATE}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar>
					<p:message id="calDtToMsg" for="calDtTo" display="icon" showDetail="false" />
				</td>
			</tr>
		</table>
	</cc:implementation>
</ui:composition>
