<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:cc="http://java.sun.com/jsf/composite">

	<cc:interface>
		<cc:attribute name="dialogHeader"
			default="#{lbl['lbl.sm.other.desc.edit.header']}" />
	</cc:interface>
	<cc:implementation>
		<p:dialog
			id="otherDescriptionEditMaintenanceDlgId"
			header="#{cc.attrs.dialogHeader} #{supplierDataMaintenanceBackingBean.managedBean.historySuppCategory.pmCategoryL1.categoryL1Code}#{supplierDataMaintenanceBackingBean.managedBean.historySuppCategory.pmCategoryL2.categoryL2Code}#{supplierDataMaintenanceBackingBean.managedBean.historySuppCategory.pmCategoryL3.categoryL3Code}"
			closable="true"
			widgetVar="otherDescriptionEditMaintenanceDlg"
			resizable="false" modal="true"
			style="width: auto; height: auto; display: block;">
			<p:outputPanel
				id="otherDescriptionMsg">
				<table style="width: 100%">
					<tr>
						<td><h:outputText
								value="#{lbl['lbl.sm.other.desc.edit.text']}" style="margin: 10px;"/>
							<p:inputTextarea id="smOtherDesc"
								maxlength="5000"
								value="#{supplierDataMaintenanceBackingBean.managedBean.otherDescEdited}"
								style="width:auto;" cols="90" rows="10"
								autoResize="false" />
						</td>
					</tr>
					<tr>
						<td><p:selectBooleanCheckbox
								id="cbSavRecordId"
								value="#{supplierDataMaintenanceBackingBean.managedBean.updateRecordTC}">
								<p:ajax update="btnYes"
									partialSubmit="true"
									process="@this" />
							</p:selectBooleanCheckbox>
							#{lbl['lbl.sm.other.desc.edit.tick']}
						</td>
					</tr>
					<tr>
						<td>
							<div align="right">
							<p:commandButton
								id="btnYes"
								value="#{lbl['lbl.btn.yes']}"
								disabled="#{!supplierDataMaintenanceBackingBean.managedBean.updateRecordTC}"
								partialSubmit="true"
								process="@form"
    							update="@form"
								action="#{supplierDataMaintenanceBackingBean.saveOtherDescriptionEdit}"
								oncomplete="otherDescriptionEditMaintenanceDlg.hide()" />
							<p:commandButton id="btnNo"
								value="#{lbl['lbl.btn.no']}"
								action="#{supplierDataMaintenanceBackingBean.resetOtherDescriptionEdit}"
								onclick="otherDescriptionEditMaintenanceDlg.hide();" />
							</div>
						</td>
					</tr>
				</table>
			</p:outputPanel>
		</p:dialog>
	</cc:implementation>
</ui:composition>
