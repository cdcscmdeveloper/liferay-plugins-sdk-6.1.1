<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core">
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="lovId" required="true" />
	<cc:attribute name="value" />
	<cc:attribute name="disabled" default="false" />
	<cc:attribute name="required" default="false" />
	<cc:attribute name="readonly" default="false" />
	<cc:attribute name="saveObject" required="true" />
	<cc:attribute name="headerText" />
	<cc:attribute name="conditionField" default="" />
	<cc:attribute name="update" default="" />
	<cc:attribute name="size" />
	<cc:attribute name="postUpdateListener" default="" />
	<cc:attribute name="selectionMode" default="single" />
	<cc:attribute name="buttonLabel" default="" />
	<cc:attribute name="buttonIcon" default="ui-icon-lov" />
	<cc:actionSource name="actionEvent" targets="#{cc.attrs.id}#{cc.attrs.selectionMode eq 'single' ? 'lovLink' : 'lovBtn'}" />
</cc:interface>

<cc:implementation>

<h:panelGroup id="#{cc.attrs.id}">

	<h:panelGroup id="sMode" rendered="#{cc.attrs.selectionMode eq 'single'}">
		<p:inputText id="#{cc.attrs.id}lov" 
			value="#{cc.attrs.value}"
			size="#{cc.attrs.size}"
			readonly="#{cc.attrs.readonly}"
			disabled="#{cc.attrs.disabled}"
			required="#{cc.attrs.required}">
			
			<!-- <f:valueChangeListener type="my.ep.web.backingbean.components.lov.PopulateObjectListener" /> -->
			
			<f:attribute name="conditionField" 	value="#{cc.attrs.conditionField}" />
			<f:attribute name="lovId" 			value="#{cc.attrs.lovId}" />
			<f:attribute name="saveObject" 		value="#{cc.attrs.saveObject}" />
			<f:attribute name="lovBB" 			value="#{lovBackingBean}" />
			
		</p:inputText>
	</h:panelGroup>
	&#160;
	<h:panelGroup id="linkpg" rendered="#{cc.attrs.selectionMode eq 'single'}">
		<p:commandLink
			id="#{cc.attrs.id}lovLink"
			action="#{lovBackingBean.initLov}"
			oncomplete="updateSearchDialog(); lovPopup.show();"
			disabled="#{cc.attrs.disabled}"
			readonly="#{cc.attrs.readonly}"
			partialSubmit="true" process="@this">
			
			<f:param name="lovId" 			value="#{cc.attrs.lovId}" />
			<f:param name="componentId" 	value="#{cc.attrs.id}" />
			<f:param name="headerText" 		value="#{cc.attrs.headerText}" />
			<f:param name="saveObject" 		value="#{cc.attrs.saveObject}" />
			<f:param name="conditionField" 	value="#{cc.attrs.conditionField}" />
			<f:param name="clientId" 		value="#{p:component(cc.attrs.id)}" />
			<f:param name="update" 			value="#{cc.attrs.update}" />
			<f:param name="selectionMode" 	value="#{cc.attrs.selectionMode}" />
			<f:param name="postUpdateListener" value="#{cc.attrs.postUpdateListener}" />
			
			<cc:insertChildren />
			
			<p:graphicImage library="ep/images/design" name="magnifier_zoom_in.png" />
					
		</p:commandLink>
	</h:panelGroup>
	
	<h:panelGroup id="btnpg" rendered="#{cc.attrs.selectionMode eq 'multiple'}">
		<p:commandButton
			id="#{cc.attrs.id}lovBtn"
			icon="#{cc.attrs.buttonIcon}"
			action="#{lovBackingBean.initLov}"
			oncomplete="updateSearchDialog(); lovPopup.show();"
			disabled="#{cc.attrs.disabled}"
			readonly="#{cc.attrs.readonly}">
			
			<f:param name="lovId" 			value="#{cc.attrs.lovId}" />
			<f:param name="componentId" 	value="#{cc.attrs.id}" />
			<f:param name="headerText" 		value="#{cc.attrs.headerText}" />
			<f:param name="saveObject" 		value="#{cc.attrs.saveObject}" />
			<f:param name="conditionField" 	value="#{cc.attrs.conditionField}" />
			<f:param name="clientId" 		value="#{p:component(cc.attrs.id)}" />
			<f:param name="update" 			value="#{cc.attrs.update}" />
			<f:param name="selectionMode" 	value="#{cc.attrs.selectionMode}" />
			<f:param name="postUpdateListener" value="#{cc.attrs.postUpdateListener}" />
			
			<cc:insertChildren />
			
			<c:if test="#{cc.attrs.buttonLabel != ''}">
				<f:attribute name="value" value="#{cc.attrs.buttonLabel}" />
			</c:if>
					
		</p:commandButton>
	</h:panelGroup>
	<p:message id="#{cc.attrs.id}Msg" for="#{cc.attrs.id}"></p:message>
	
	
	
</h:panelGroup>


	<!-- <p:remoteCommand name="updateLov#{cc.attrs.id}" update="#{cc.attrs.id}" partialSubmit="true" /> -->

</cc:implementation>
</ui:composition>
