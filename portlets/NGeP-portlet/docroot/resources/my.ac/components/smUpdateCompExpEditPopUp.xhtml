<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
	<cc:interface>
		<cc:attribute name="dialogName" required="true" />
		<cc:attribute name="fromSM" required="true" />
		<cc:attribute name="fromCT" required="true" />
	</cc:interface>
	<cc:implementation>
		<ui:param name="selectedDraf"
			value="#{updateCompExpBB.managedBean.selectedCompExpDrafList}" />
		<c:if test="#{cc.attrs.fromSM}">
			<ui:param name="headerTitle"
				value="#{lbl['lbl.sm.update.comp.exp.draft.header.sm']}" />
		</c:if>
		<c:if test="#{cc.attrs.fromCT}">
			<ui:param name="headerTitle"
				value="#{lbl['lbl.sm.update.comp.exp.draft.header.ct']}" />
		</c:if>
		<p:dialog id="#{cc.attrs.dialogName}Id"
			widgetVar="#{cc.attrs.dialogName}WV" modal="true" dynamic="true"
			resizable="true" style="width: 70%;" styleClass="pop_up_top" header="#{headerTitle}">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.update.comp.exp.draft.instruction']}" />
			<table style="table-layout: fixed">
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.project.done.for']}" /></td>
					<td style="width: 66%"><p:selectOneRadio id="regStatus"
							label="#{lbl['lbl.sm.update.comp.exp.draft.project.done.for']}"
							value="#{selectedDraf.clientType}" disabled="true">
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.update.comp.exp.draft.federal']}"
								itemValue="F"></f:selectItem>
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.update.comp.exp.draft.non.federal']}"
								itemValue="O"></f:selectItem>
						</p:selectOneRadio></td>
				</tr>
				<tr rendered="#{selectedDraf.clientType eq F}">
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.ori.agency.name']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view mandatory"
							value="#{selectedDraf.oriAgencyName}" /> <p:graphicImage
							id="oriAgencyNameId" value="/css/images/design/tooltips.png" />
						<p:tooltip for="oriAgencyNameId"
							value="#{lbl['lbl.sm.update.comp.exp.draft.ori.agency.name.tooltip']}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.agency.name']}" /> <p:outputLabel
							rendered="#{selectedDraf.clientType eq F}" value="*"
							styleClass="mandatory" /></td>
					<td style="width: 66%"><p:outputPanel
							rendered="#{selectedDraf.clientType eq F}">
							<!-- Ptj LOV -->
						</p:outputPanel> <p:outputLabel rendered="#{selectedDraf.clientType eq O}"
							styleClass="outputLabel-view mandatory"
							value="#{selectedDraf.agencyName}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.file.ref.no']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:inputText
							value="#{selectedDraf.fileReferenceNo}" /> <p:spacer width="3px"></p:spacer>
						<p:inputText value="#{selectedDraf.fileExtensionNo}" size="3"
							maxlength="3" />
						<p:graphicImage id="fileReferenceNoId"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							for="fileReferenceNoId">
							<img
								src="/NGeP-portlet/images/suratSetujuTerima_fileReference_tooltip.jpeg" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.loa.no']}" /></td>
					<td style="width: 66%"><p:inputText
							value="#{selectedDraf.loaNo}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.proc.cont.proj.title']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view" value="#{selectedDraf.title}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.cont.value']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{selectedDraf.contractValue}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.pay.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{selectedDraf.paymentMethod}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.proc.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{selectedDraf.procumentMode}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.cont.eff.date']}" /></td>
					<td style="width: 66%"><p:outputLabel
							rendered="#{selectedDraf.contractStartDate ne null}"
							styleClass="outputLabel-view"
							value="#{selectedDraf.contractStartDate}" /> <p:calendar
							rendered="#{selectedDraf.contractStartDate eq null}"
							showOn="button" readonlyInput="true"
							value="#{selectedDraf.contractStartDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.cont.exp.date']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:calendar showOn="button"
							readonlyInput="true" value="#{selectedDraf.contractEndDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.cont.status']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{selectedDraf.contractStatus}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.update.comp.exp.draft.supp.doc']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%">
						<!-- upload -->
					</td>
				</tr>
			</table>
		</p:dialog>
	</cc:implementation>
</ui:component>
