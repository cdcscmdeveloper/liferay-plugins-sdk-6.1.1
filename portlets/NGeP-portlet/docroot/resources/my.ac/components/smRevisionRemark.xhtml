<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="backingBean" required="true" />
		<cc:attribute name="isInsideTable" required="true"/>
		<cc:attribute name="poRemark" />
		<cc:attribute name="approverRemark" />
	</cc:interface>

	<cc:implementation>

			<p:outputPanel rendered="#{cc.attrs.backingBean.managedBean.poUser}">
				<c:choose>
					<c:when test="#{cc.attrs.isInsideTable eq 'true'}">
						<tr height="15"><td></td></tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.poRemark}" /></td>
						</tr>
					</c:when>
					<c:otherwise>
						<table style="width: 30%;">
							<tr height="15"><td></td></tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.poRemark}" /></td>
							</tr>
						</table>
					</c:otherwise>
				</c:choose>
			</p:outputPanel>
			<p:outputPanel rendered="#{cc.attrs.backingBean.managedBean.approverUser}">
				<c:choose>
					<c:when test="#{cc.attrs.isInsideTable eq 'true'}">
						<tr height="15"><td></td></tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.poRemark}" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
							<td><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.approverRemark}" /></td>
						</tr>
					</c:when>
					<c:otherwise>
						<table style="width: 30%;">
							<tr height="15"><td></td></tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.sectionPoRmrk']} :" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.poRemark}" /></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sm.sectionApprRmrk']} :" /></td>
								<td><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.approverRemark}" /></td>
							</tr>
						</table>
					</c:otherwise>
				 </c:choose>
			</p:outputPanel>
	</cc:implementation>
</ui:component>
