<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="backingBean" required="true" />
		<cc:attribute name="poRemark" />
		<cc:attribute name="approverRemark" />
	</cc:interface>

	<cc:implementation>
			
			<p:outputPanel rendered="#{cc.attrs.backingBean.managedBean.approverUser or cc.attrs.backingBean.managedBean.poUser}">
				<br />
				<br />
				<p:panelGrid styleClass="tablePanel" id="remarkTableId" style="table-layout: fixed; width: 50%">
					<p:row id="remarkHeaderId">
						<p:column style="background-color: #F0EFEF;font-weight: bold;word-wrap: break-word">#{lbl['lbl.sm.remarks.officer']}</p:column>
						<p:column style="background-color: #F0EFEF;font-weight: bold;word-wrap: break-word">#{lbl['lbl.sm.remarks']}</p:column>
					</p:row>
					<p:row id="remarkDataPoId">
						<p:column style="word-wrap: break-word">#{lbl['lbl.sm.sectionPoRmrk']}</p:column>
						<p:column style="word-wrap: break-word">#{cc.attrs.poRemark}</p:column>
					</p:row>
					<p:row id="remarkDataApprvId" rendered="#{cc.attrs.backingBean.managedBean.approverUser}">
						<p:column style="word-wrap: break-word">#{lbl['lbl.sm.sectionApprRmrk']}</p:column>
						<p:column style="word-wrap: break-word">#{cc.attrs.approverRemark}</p:column>
					</p:row>
				</p:panelGrid>
				<br />
			</p:outputPanel>
	</cc:implementation>
</ui:component>
