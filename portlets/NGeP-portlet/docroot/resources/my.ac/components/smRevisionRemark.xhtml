<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="backingBean" required="true" />
		<cc:attribute name="poRemark" />
		<cc:attribute name="approverRemark" />
	</cc:interface>

	<cc:implementation>
			
			<p:outputPanel rendered="#{cc.attrs.backingBean.managedBean.approverUser or cc.attrs.backingBean.managedBean.poUser}">
				<br />
				
				<table style="width:70%">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sm.remark']}" style="width:auto;background-color:whitesmoke;font-size: 12px;font-weight: bold;font-family:Arial;text-decoration: underline;float:right;font-style:italic;"/>
						</td>
					</tr>
					<tr>
						<td height="5"></td>
					</tr>
					<tr>
						<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sectionPoRmrk']}" /></td>
						<td style="word-wrap: break-word"><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.poRemark}"/></td>
					</tr>
					<c:if test="#{cc.attrs.backingBean.managedBean.approverUser}">
						<tr>
							<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.sectionApprRmrk']}" /></td>
								<td style="word-wrap: break-word"><p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.approverRemark}"/></td>
						</tr>
					</c:if>
				</table>
				
				<br />
			</p:outputPanel>
	</cc:implementation>
</ui:component>
