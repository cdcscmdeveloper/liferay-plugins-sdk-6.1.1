<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="paginator" required="true" />
	</cc:interface>

	<cc:implementation>

	<h:outputText
		value="#{lbl['lbl.datatable.paginator.page']} #{cc.attrs.paginator.pageIndex} / #{cc.attrs.paginator.pages}"
		style="font-weight: bold !important;" />&#160;&#160;&#160;
	<p:commandLink value="#{lbl['lbl.datatable.paginator.previous']}" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages gt 1 and cc.attrs.paginator.pageIndex ne 1}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.prev}" partialSubmit="true" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages gt 1}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="1" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 1 and cc.attrs.paginator.pageIndex ne 1}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(1)}" partialSubmit="true" />
	<h:outputText value="1" rendered="#{cc.attrs.paginator.pageIndex eq 1}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 1}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="2" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 2 and cc.attrs.paginator.pageIndex ne 2}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(2)}" partialSubmit="true" />
	<h:outputText value="2" rendered="#{cc.attrs.paginator.pageIndex eq 2}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 2}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="3" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 3 and cc.attrs.paginator.pageIndex ne 3}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(3)}" partialSubmit="true" />
	<h:outputText value="3" rendered="#{cc.attrs.paginator.pageIndex eq 3}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 3}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="4" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 4 and cc.attrs.paginator.pageIndex ne 4}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(4)}" partialSubmit="true" />
	<h:outputText value="4" rendered="#{cc.attrs.paginator.pageIndex eq 4}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 4}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="5" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 5 and cc.attrs.paginator.pageIndex ne 5}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(5)}" partialSubmit="true" />
	<h:outputText value="5" rendered="#{cc.attrs.paginator.pageIndex eq 5}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 5}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="6" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 6 and cc.attrs.paginator.pageIndex ne 6}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(6)}" partialSubmit="true" />
	<h:outputText value="6" rendered="#{cc.attrs.paginator.pageIndex eq 6}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 6}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="7" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 7 and cc.attrs.paginator.pageIndex ne 7}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(7)}" partialSubmit="true" />
	<h:outputText value="7" rendered="#{cc.attrs.paginator.pageIndex eq 7}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 7}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="8" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 8 and cc.attrs.paginator.pageIndex ne 8}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(8)}" partialSubmit="true" />
	<h:outputText value="8" rendered="#{cc.attrs.paginator.pageIndex eq 8}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 8}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="9" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 9 and cc.attrs.paginator.pageIndex ne 9}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(9)}" partialSubmit="true" />

	<p:commandLink value="10" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages ge 10 and cc.attrs.paginator.pageIndex ne 10}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.goToPage(10)}" partialSubmit="true" />
	<h:outputText value="10" rendered="#{cc.attrs.paginator.pageIndex eq 10}" />
	<p:outputPanel rendered="#{cc.attrs.paginator.pages ge 2}">&#160;&#160;&#160;</p:outputPanel>
	<p:commandLink value="#{lbl['lbl.datatable.paginator.next']}" update="@form" onstart="blockWidget.show()"
			rendered="#{cc.attrs.paginator.pages gt 1 and cc.attrs.paginator.pageIndex ne cc.attrs.paginator.pages}"
			oncomplete="blockWidget.hide()" process="@this"
			action="#{cc.attrs.paginator.next}" partialSubmit="true" />
    <h:inputHidden value="#{cc.attrs.paginator.pageIndex}" />

	</cc:implementation>
</ui:composition>
