<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dataTable id="memberList_#{prefix}" widgetVar="table_#{prefix}"
		styleClass="history-member-table"
		value="#{memberHistoryPaginator.model}" var="member"
		rowIndexVar="index"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
		<p:column headerText="#{lbl['lbl.sc.name']}">
			<h:outputText value="#{member.memberName}" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.identification.no']}">
			<h:outputText value="#{member.identificationNo}" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.designation']}"
			style="white-space: normal;">
			<h:outputText value="#{member.designation}" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.email']}">
			<h:outputText value="#{member.email}" style="white-space: normal;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
			<h:outputText value="#{member.grade}" />
		</p:column>
		<p:column style="width: 6%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.pnp']}" />
				<ac:iconTooltip id="pnpId" value="#{lbl['lbl.sc.pnp.tooltip']}" />
			</f:facet>
			<h:outputText
				value="#{lbl[ member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
		</p:column>
		<p:column style="width: 13%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.role']}" />
			</f:facet>
			<h:outputText
				value="#{qTDetailBB.getParameterDesc('FCR', member.memberRole)}" />
		</p:column>
		<p:column rendered="#{isSFCommittee}">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.representative.type']}" />
			</f:facet>
			<h:outputText
				value="#{qTDetailBB.getParameterDesc(qTDetailBB.getRepresentativeType(selectedHistory.committeeType),
				 member.representativeType)}" />
		</p:column>
	</p:dataTable>
	<ac:detachablePaginator minimal="true" loopId="@([id$=#{tableId}])"
		paginatorObject="#{memberHistoryPaginator}" />
</ui:composition>
