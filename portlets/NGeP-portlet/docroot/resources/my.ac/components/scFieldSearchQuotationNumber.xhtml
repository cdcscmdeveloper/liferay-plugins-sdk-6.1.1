<!-- 25651 - Start -->
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="true" />
	</cc:interface>

	<cc:implementation>

	<div class="columnScTableClass">
		<h:outputText styleClass="instruction"
			style="float:left;margin-left:20px;"
			value="#{lbl['lbl.instruction.mandatory']}" />

		<table style="width: 100%;">
			<tr>
				<td style="width: 168px;"><p:outputLabel
						value="#{lbl['lbl.rpt.qtNo']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>

				<td style="width: 84%"><p:inputText
						label="#{lbl['lbl.rpt.qtNo']}" id="rptQuotationNum" maxlength="17"
						size="17" value="#{cc.attrs.bBean.managedBean.quotationNumber}"
						required="#{cc.attrs.required}"
						style="margin-top:5px;width:120px;">
			
			    <p:ajax
			        event="blur"
			        listener="#{cc.attrs.bBean.validateAndGetScReports}"
			        process="@this"
			        partialSubmit="true"
			        update="@form" />
        
					</p:inputText> <p:message id="rptQuotationNumMsg" for="rptQuotationNum"
						 display="icon"  /></td>
			</tr>
		</table>
	</div>
	
	</cc:implementation>
</ui:component>
<!-- 25651 - End -->
