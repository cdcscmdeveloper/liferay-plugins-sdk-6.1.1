<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
	</cc:interface>

	<cc:implementation>
		<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.applStatus}"
			style="width:300px;" required="#{cc.attrs.required}">
			<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
			<f:selectItems value="#{cc.attrs.bBean.retrieveApplStatus()}"/>
			<p:ajax event="change" listener="#{cc.attrs.bBean.onChangeApplProgressStatus}" 
				process="@this" partialSubmit="true" update="@form" />
		</p:selectOneMenu>
	</cc:implementation>
</ui:composition>
