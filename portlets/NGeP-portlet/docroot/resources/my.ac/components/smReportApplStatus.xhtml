<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="showItemAll" default="false" />
		<cc:attribute name="id" default="#{cc.id}"/>
		<!-- 32521 - START -->
		<cc:attribute name="statusApplication" default="false" />
		<!-- 32521 - END -->
	</cc:interface>

	<cc:implementation>
		<!-- 32521 - START -->
		<c:choose>
			<c:when test="#{cc.attrs.statusApplication}">
				<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.applStatus}" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pleaseSelect']}" itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingApplicationVerification']}" itemValue="PAV" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingApplicationApproval']}" itemValue="PAA" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSiteVisitAssignmentBefore']}" itemValue="PSVAB" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSiteVisitAssignmentAfter']}" itemValue="PSVAA" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSiteVisitBefore']}" itemValue="PSVB" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSiteVisitAfter']}" itemValue="PSVA" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingReviewSiteVisitReportAfter']}" itemValue="PRSVRA" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingReviewSiteVisitReportBefore']}" itemValue="PRSVRB" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.registered']}" itemValue="REG" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</c:when>
			<c:otherwise>
				<ui:param name="paramRequired" value="#{cc.attrs.showItemAll ? false : cc.attrs.required}" />
				<ui:param name="defaultLabel" value="#{cc.attrs.showItemAll ? 'lbl.rpt.all' : 'lbl.rpt.selectOne'}" />
				<p:selectOneMenu label="#{lbl['lbl.rpt.applStatus']}" id="#{cc.attrs.id}" 
					value="#{cc.attrs.bBean.managedBean.applStatus}" style="width:300px;" 
					required="#{paramRequired}" disabled="#{cc.attrs.disabled}">
					<f:selectItem itemLabel="#{lbl[defaultLabel]}"
						itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.approvedLabel']}"
						itemValue="A"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.rejectedLabel']}"
						itemValue="R"></f:selectItem>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</c:otherwise>
		</c:choose>
		<!-- 32521 - END -->
	</cc:implementation>
</ui:composition>
