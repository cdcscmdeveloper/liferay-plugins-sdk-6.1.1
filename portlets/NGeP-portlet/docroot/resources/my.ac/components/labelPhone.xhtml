<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="fullNo" />
		<cc:attribute name="countryCode" />
		<cc:attribute name="areaCode"/>
		<cc:attribute name="number"/>
		<cc:attribute name="rendered" default="true"/>
		<cc:attribute name="styleClass" default="outputLabel-view"/>
	</cc:interface>

	<cc:implementation>
		<p:outputPanel rendered="#{empty cc.attrs.fullNo and not empty cc.attrs.number}">
			<h:outputLabel value="+#{cc.attrs.countryCode}  #{cc.attrs.areaCode}-#{cc.attrs.number}" styleClass="#{cc.attrs.styleClass}" />
		</p:outputPanel>
		<p:outputPanel rendered="#{not empty cc.attrs.fullNo}">
			<h:outputLabel value="#{cc.attrs.fullNo}" styleClass="#{cc.attrs.styleClass}" />
		</p:outputPanel>
	</cc:implementation>

</ui:component>
