<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<cc:interface>
		<cc:attribute name="okAction" required="false" default="" />
		<cc:attribute name="saveIndex" required="true" />
		<cc:attribute name="orgProfile" required="true" />
		<cc:attribute name="update" required="false" default="@this" />
		<cc:attribute name="orgTypeParamCode" required="true" />
		<cc:attribute name="id" required="true" />
	</cc:interface>

	<cc:implementation>
	<f:event type="preRenderComponent" 
         listener="#{userOrganisationSearchBackingBean.loadDefaultResult(cc.attrs.orgTypeParamCode, cc.attrs.orgProfile)}" />
		<style>
.ui-selectonemenu.userPtjPopupSomWidth {
	width: 400px !important;
}

.ui-selectonemenu.userPtjPopupSomWidth label {
	width: 400px !important;
	max-width: 400px !important;
}
</style>
		<p:dialog id="beforeSavePopup"
			header="#{lbl['lbl.lov.listing']} - #{lbl['lbl.sc.request.note.loa.prepare.by']}"
			widgetVar="beforeSavePopup" modal="true" width="680" position="top">

			<p:messages id="beforeSavePopupMsg" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<h:panelGroup id="userOrgPnlGrp">
				<p:panel id="userOrgPnlId"
					header="#{lbl['lbl.pm.header.general.org.search']}"
					toggleable="true">
					<table style="margin-left: auto; margin-right: auto;">
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td><p:outputLabel id="searchMinistryLbL"
									value="#{lbl['lbl.sc.ministry']}" /></td>
							<td colspan="3"><p:selectOneMenu id="somMinistry"
									styleClass="userPtjPopupSomWidth"
									disabled="#{userOrganisationSearchBackingBean.managedBean.disabledMinistry}"
									value="#{userOrganisationSearchBackingBean.managedBean.ministryProfileId}">
									<f:selectItems
										value="#{userOrganisationSearchBackingBean.getMinistryDropdown()}" />
									<p:ajax event="change" process="@this" partialSubmit="true"
										update="@this" />
								</p:selectOneMenu></td>
						</tr>
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td><p:outputLabel id="searchPtjGroupLbL"
									value="#{lbl['lbl.sc.kumpulan.ptj']}" /></td>
							<td colspan="3"><p:selectOneMenu id="somJabatan"
									styleClass="userPtjPopupSomWidth"
									disabled="#{userOrganisationSearchBackingBean.managedBean.disabledJabatan}"
									rendered="#{ParameterConst.orgTypePtj eq cc.attrs.orgTypeParamCode}"
									value="#{userOrganisationSearchBackingBean.managedBean.jabatanProfileId}">
									<f:selectItems
										value="#{userOrganisationSearchBackingBean.getJabatanDropdown()}" />
									<p:ajax event="change" process="@this" partialSubmit="true"
										update="ptjPanel" />
								</p:selectOneMenu></td>
						</tr>
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td><p:outputLabel id="searchPtjLbL"
									value="#{lbl['lbl.sc.ptj']}" /></td>
							<td colspan="3"><p:outputPanel id="ptjPanel" layout="block">
									<p:selectOneMenu id="somPtj" styleClass="userPtjPopupSomWidth"
										value="#{userOrganisationSearchBackingBean.managedBean.ptjProfileId}">
										<f:selectItems
											value="#{userOrganisationSearchBackingBean.getPtjDropdown()}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											update="@this" />
									</p:selectOneMenu>
								</p:outputPanel></td>
						</tr>
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td><p:outputLabel id="searchNameLbL"
									value="#{lbl['lbl.sc.name']}" /></td>
							<td><p:inputText id="searchName" style="width:60%"
									value="#{userOrganisationSearchBackingBean.managedBean.searchName}">
									<p:ajax event="blur" process="@this" partialSubmit="true"
										update="@this" />
								</p:inputText></td>
						</tr>
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td><p:outputLabel id="searchIdentificationTypeIdLbL"
									value="#{lbl['lbl.pm.profiles.userdetails.idtype']}" /></td>
							<td colspan="3">
									<p:selectOneMenu id="somIdType" style="width:30%" styleClass="userPtjPopupSomWidth"
										value="#{userOrganisationSearchBackingBean.managedBean.identificationTypeId}">
										<f:selectItems
											value="#{userOrganisationSearchBackingBean.getIdentityTypeList()}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											update="@this" />
									</p:selectOneMenu></td>
						</tr>
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td><p:outputLabel id="searchIcLbL"
									value="#{lbl['lbl.sm.soft.cert.idno']}" /></td>
							<td><p:inputText id="searchIc" style="width:35%"
									value="#{userOrganisationSearchBackingBean.managedBean.searchIcNo}">
									<p:ajax event="blur" process="@this" partialSubmit="true"
										update="@this" />
								</p:inputText></td>
						</tr>
					</table>
					<div class="ppRightBtn">
						<p:commandButton id="searcbBtnId" widgetVar="userPtjSearchBtnWV"
							value="#{lbl['lbl.btn.search']}" update="dtUserOrg"
							action="#{userOrganisationSearchBackingBean.searchUserOfOrgs(cc.attrs.orgTypeParamCode)}"
							process="userOrgPnlId" />

						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{userOrganisationSearchBackingBean.resetUserOrgRN()}"
							partialSubmit="true" process="userOrgPnlId"
							update="userOrgPnlId resultPanel">
						</p:commandButton>
					</div>
				</p:panel>
				<p:panel id="userOrgResultPnlId"
					header="#{lbl['lbl.sc.requisitioner.result']}" toggleable="true">
					<h:panelGroup id="resultPanel" style="width:100%;">
						<p:dataTable id="dtUserOrg" var="userOrg" rows="10"
							value="#{userOrganisationSearchBackingBean.userOrgDataModel}"
							selection="#{userOrganisationSearchBackingBean.managedBean.selectedUser}"
							selectionMode="single" rowIndexVar="index" lazy="true">
							<ac:paginator for="dtUserOrg"></ac:paginator>
							<p:ajax event="rowDblselect" 
							        listener="#{userOrganisationSearchBackingBean.okActionForRN(cc.attrs.okAction,cc.attrs.saveIndex)}"
							        oncomplete="beforeSavePopup.hide()"
							        process="@this"
							        update="@form">
							</p:ajax>
							<p:ajax event="rowUnselect" update="dtUserOrg" process="@this"
								partialSubmit="true" />
							<p:ajax event="rowSelect" update="dtUserOrg" process="@this"
								partialSubmit="true" />
							<p:ajax event="toggleSelect" update="dtUserOrg" process="@this"
								partialSubmit="true" />
							<p:column headerText="#{lbl['lbl.sc.name']}" style="width :35%">
								<h:outputText value="#{userOrg.pmUser.userName}" />
							</p:column>
							<!-- 
							<p:column headerText="#{lbl['lbl.pm.ic.no']}" style="width :30%">
								<h:outputText value="#{userOrg.pmUser.identificationNo}" />
							</p:column> -->
							<p:column headerText="#{lbl['lbl.sc.requisitioner.email']}"
								style="width :35%">
								<h:outputText value="#{userOrg.pmUser.email}" />
							</p:column>
						</p:dataTable>
					</h:panelGroup>
					<table style="width: 100%;">
						<tr style="border: 2px solid white; border-collapse: collapse;">
							<td style="text-align: right;"><p:commandButton id="slbtn"
									value="#{lbl['lbl.btn.select']}" partialSubmit="true"
									action="#{userOrganisationSearchBackingBean.okActionForRN(cc.attrs.okAction)}"
									process="@this" update="#{cc.attrs.update}"
									styleClass="BtnSpacing">
									<f:param name="saveIndex" value="#{cc.attrs.saveIndex}" />
								</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.cancel']}"
									partialSubmit="true" process="@this" update="@this"
									oncomplete="beforeSavePopup.hide()" styleClass="BtnSpacing" />
							</td>
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>

		</p:dialog>
		<p:defaultCommand target="searcbBtnId" scope="userOrgPnlGrp"></p:defaultCommand>
	</cc:implementation>
</ui:composition>
