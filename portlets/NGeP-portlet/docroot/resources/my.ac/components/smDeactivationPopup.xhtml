<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="dialogHeader" default="#{lbl['lbl.sm.success.dialog.header']}"/>
		<cc:attribute name="dialogWidth" default="550px" />
		<cc:attribute name="dialogHeight" default="180px" />
	</cc:interface>

	<cc:implementation>
	
			<h:outputScript library="js" name="logout.js" />
			
			<p:dialog id="deactivationDialog" header="#{cc.attrs.dialogHeader}" closable="false"
				widgetVar="deactivationDialog" modal="true" width="#{cc.attrs.dialogWidth}" height="#{cc.attrs.dialogHeight}">
				<p:messages id="deactivationDialogMsg" showSummary="false"
					showDetail="true" autoUpdate="true" closable="false" />
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.proceed']}" onclick="clickLogout();" />
				</div>
			</p:dialog>
			
	</cc:implementation>
</ui:component>
