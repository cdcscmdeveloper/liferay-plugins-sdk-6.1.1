<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="title" default="#{lbl['lbl.tpl.spec.maintenance.content']}" />
		<cc:attribute name="templateSpecBean" />
		<cc:attribute name="scrollWidth" default="1215" />
		<cc:attribute name="newable" default="true" />
		<cc:attribute name="removable" default="true" />
		<cc:attribute name="editable" default="true" />
		<cc:attribute name="processValidationId" default="#{null}" />
		<cc:attribute name="updateSpec" default="true" />
	    <cc:attribute name="isWorkflowStatus" default="false" />
	    <cc:attribute name="addNewSpec" default="false" />
	    <cc:attribute name="first" default="0" />
	    <cc:attribute name="instruction"/>
	</cc:interface>

	<cc:implementation>
		<ui:param name="templateSpecId" value="#{cc.attrs.id}" />
		<ui:param name="title" value="#{cc.attrs.title}" />
		<ui:param name="templateSpecBean" value="#{cc.attrs.templateSpecBean}" />
		<ui:param name="scrollWidth" value="#{cc.attrs.scrollWidth}" />
		<ui:param name="newable" value="#{cc.attrs.newable}" />
		<ui:param name="removable" value="#{cc.attrs.removable}" />
		<ui:param name="editable" value="#{cc.attrs.editable}" />
		<ui:param name="processValidationId" value="#{cc.attrs.processValidationId}" />
		<ui:param name="updateSpec" value="#{cc.attrs.updateSpec}" />
		<ui:param name="isWorkflowStatus" value="#{cc.attrs.isWorkflowStatus}" />
		<ui:param name="addNewSpec" value="#{cc.attrs.addNewSpec}" />
		<ui:param name="initRow" value="#{cc.attrs.first}" />
		<ui:param name="instruction" value="#{cc.attrs.instruction}" />
		
		<ui:include src="/xhtml/tpl/spec/specContent.xhtml" />
		
	</cc:implementation>
	
</ui:component>
