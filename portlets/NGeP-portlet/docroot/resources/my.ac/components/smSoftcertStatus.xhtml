<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="personnel" required="true" />
	</cc:interface>

	<cc:implementation>
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.request.failed']}" rendered="#{cc.attrs.personnel.softcertFlg eq '9' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.ready.renewal']}" rendered="#{cc.attrs.personnel.softcertFlg eq '7' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.rejected']}" rendered="#{cc.attrs.personnel.softcertFlg eq '6' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.pending.request']}" rendered="#{cc.attrs.personnel.softcertFlg eq '4' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.processing']}" rendered="#{cc.attrs.personnel.softcertFlg eq '3' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.requested']}" rendered="#{cc.attrs.personnel.softcertFlg eq '2' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.person.composition.issued']}" rendered="#{cc.attrs.personnel.softcertFlg eq '1' and cc.attrs.personnel.epRole ne 'CM_USER'}" />
		<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.txt.na']}" rendered="#{cc.attrs.personnel.softcertFlg eq '0' or cc.attrs.personnel.epRole eq 'CM_USER'}" />
		&#160;
		<p:outputLabel styleClass="outputLabel-view" value="#{cc.attrs.personnel.softcertRejectReason}" rendered="#{not empty cc.attrs.personnel.softcertRejectReason}" />
	</cc:implementation>
</ui:component>
