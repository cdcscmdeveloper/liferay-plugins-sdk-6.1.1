<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">
	
	<cc:interface>
		<cc:attribute name="roleCode" required="true" />
		<cc:attribute name="backingBean" required="true"/>
		<cc:attribute name="rendered" default="true"/>
	</cc:interface>
	
	<cc:implementation>
		<h:outputText value="#{cc.attrs.backingBean.getEpRoleDescByRoleCode(cc.attrs.roleCode)}" rendered="#{cc.attrs.rendered}" />
	</cc:implementation>

</ui:component>
