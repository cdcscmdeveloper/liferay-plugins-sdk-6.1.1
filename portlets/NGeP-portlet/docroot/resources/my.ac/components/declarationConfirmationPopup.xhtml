<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id" />
		<cc:attribute name="update" required="true" default="@this" />
		<cc:attribute name="title" default="" />
		<cc:attribute name="content" default="" />
		<cc:attribute name="widget" default="" />
		<cc:attribute name="okAction" required="true" default="" />
		<cc:attribute name="cancelAction" default="" />
		<cc:attribute name="width" default="auto" />
		<cc:attribute name="height" default="auto" />
		<cc:attribute name="resetInput" default="" />
		<cc:attribute name="okProcess" default="@this" />
		<cc:attribute name="noProcess" default="@this" />
		<cc:attribute name="style" default="" />
		<cc:attribute name="dialogCSS" default="" />
		<cc:attribute name="loadingWidget" default=""/>
		<cc:attribute name="resizable" default=""/>
		<cc:attribute name="closable" default=""/>
		<cc:attribute name="confirmLabel" default=""/>
	</cc:interface>

	<cc:implementation>
		<style>
			#{cc.attrs.dialogCSS}
			.confirm-ui-dialog{
				max-width: 500px;
				width: auto;
			}
			.confirm-ui-dialog .ui-dialog-content table{
				margin: auto;
			}
			.confirm-ui-dialog .ui-dialog-content table td label {
				white-space: normal;
				padding-left: 5px;
				display: inline !important;
				float: none !important;
			}
			.confirm-ui-dialog .ui-dialog-content{
				padding: 1em 1em !important;
				height: auto !important;
			}
			.confirm-ui-dialog .ui-dialog-content span img{
				margin-top: -4px;
			}
			/* #30457 start */
			.ui-dialog {
			position: fixed !important;
			}
			/* #30457 end */
		
		</style>
		<ui:param name="confirmationheader" value="#{cc.attrs.title}" />
		<ui:param name="confirmationContent" value="#{cc.attrs.content}" />
		<p:dialog styleClass="confirm-ui-dialog" id="#{cc.attrs.id}" widgetVar="#{cc.attrs.widget}"
			header="#{confirmationheader}" resizable="#{cc.attrs.resizable}"
			width="#{cc.attrs.width}" height="#{cc.attrs.height}"
			closable="#{cc.attrs.closable}" modal="true" style="#{cc.attrs.style}">
			
			<p:blockUI block="#{cc.attrs.id}Popup" widgetVar="confirmPopupBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			
			<p:outputPanel id="#{cc.attrs.id}Popup" layout="block">
			<table width="100%">
				<tr><td colspan="2" style="padding-bottom: 10px; vertical-align: top;">
					<p:outputLabel value="#{cc.attrs.confirmLabel}" style="float: left;"/><br/>
				</td></tr>
				<tr>
					<td align="center" style="white-space: normal; word-wrap: break-word !important; vertical-align: top;">
						<p:selectBooleanCheckbox id="isDeclareChkBox" style="float:left;"
							value="#{cofirmationPopUpBackingBean.declareChecked}">
							<p:ajax update="yesWithLoadId" />
						</p:selectBooleanCheckbox>
					</td>
					<td>
						<p:outputLabel style="white-space: normal; word-wrap: break-word !important; vertical-align: top;" 
						value="#{confirmationContent}" escape="false" />
					</td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton id="yesWithLoadId" value="#{lbl['lbl.btn.yes']}" process="#{cc.attrs.okProcess}"
					partialSubmit="true" disabled="#{not cofirmationPopUpBackingBean.declareChecked}"
					onstart="#{cc.attrs.widget}.hide();#{cc.attrs.loadingWidget}.show();"
					action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
					oncomplete="confirmPopupBlockWidget.hide(); #{cc.attrs.widget}.hide();" update="#{cc.attrs.update}" />
		    	<p:commandButton id="noWithoutActionId" value="#{lbl['lbl.btn.no']}" immediate="true"
					oncomplete="#{cc.attrs.widget}.hide();" process="#{cc.attrs.noProcess}"/>
				
			</div>
			</p:outputPanel>
		</p:dialog>
	</cc:implementation>
</ui:composition>
