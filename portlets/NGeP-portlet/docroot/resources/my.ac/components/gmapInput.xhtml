<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="latitude" required="true" />
	<cc:attribute name="longitude" required="true" />
	<cc:attribute name="address" required="true" />
	<cc:attribute name="showButton" 	default="true" />
	<cc:attribute name="disabled" 		default="false" />
	<cc:attribute name="isShow" 		default="false"/>
	<cc:attribute name="oriLatValue" 	required="true" />
	<cc:attribute name="currLatValue" 	required="true" />
	<cc:attribute name="alertLatValue" 	required="true"  />
	<cc:attribute name="oriLongValue" 	required="true" />
	<cc:attribute name="currLongValue" 	required="true" />
	<cc:attribute name="alerLongtValue" required="true"  />
</cc:interface>

<cc:implementation>

<h:panelGroup id="#{cc.attrs.id}">

	<fieldset style="width:auto">
	
		<legend>
			<i class="icon icon-map-marker"></i>&#160;#{lbl['lbl.gmap.panel.title']}
		</legend>
		
		<ac:instructionText value="#{lbl['lbl.gmap.instruction']}" />
  		
  		<div class="ui-fieldset-content">
  		
  		<h:panelGroup layout="block" style="display: flex; align-items: center; gap: 5px;">
  		
		X: <p:inputText id="plat" value="#{cc.attrs.latitude}" disabled="#{cc.attrs.disabled}" maxlength="20" />
			<ac:smFieldChangeAlert 
				isShow="#{cc.attrs.isShow}"
				oriValue="#{cc.attrs.oriLatValue}" 
				currValue="#{cc.attrs.currLatValue}" 
				alertValue="#{cc.attrs.alertLatValue}"/>
		
		&#160;
		
		Y: <p:inputText id="plng" value="#{cc.attrs.longitude}" disabled="#{cc.attrs.disabled}" maxlength="20"/>
			<ac:smFieldChangeAlert 
				isShow="#{cc.attrs.isShow}"
				oriValue="#{cc.attrs.oriLongValue}" 
				currValue="#{cc.attrs.currLongValue}" 
				alertValue="#{cc.attrs.alertLongValue}"/>
		
		<p:commandButton id="gmId" 
			value="#{lbl['lbl.gmap.viewmap']}" 
			onclick="codeAddress(#{cc.attrs.address}, this.previousSibling.previousSibling.previousSibling, this.previousSibling);"
			rendered="#{cc.attrs.showButton}"
			disabled="#{cc.attrs.disabled}"
			process="@this">
			
			<f:setPropertyActionListener 
				target="#{gmapBackingBean.renderMap}" 
				value="#{true}" />
				
		</p:commandButton>	
		
		</h:panelGroup>	

		<p:remoteCommand 
			id="updateGmap"
			name="updateGmap" 
			action="#{gmapBackingBean.updateCoordinates}"
			process="#{cc.attrs.id}"
			update="@([id$=mapPanel])" 
			oncomplete="dlg.show();" />
		</div>
			
	</fieldset>
	
</h:panelGroup>
	
</cc:implementation>

</ui:composition>
