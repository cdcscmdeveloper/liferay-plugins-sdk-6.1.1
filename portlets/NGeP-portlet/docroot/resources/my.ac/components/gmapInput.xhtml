<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="latitude" required="true" />
	<cc:attribute name="longitude" required="true" />
	<cc:attribute name="address" required="true" />
	<cc:attribute name="showButton" 	default="true" />
	<cc:attribute name="disabled" 		default="false" />
</cc:interface>

<cc:implementation>
<h:panelGroup id="#{cc.attrs.id}">
	<fieldset style="margin-bottom:20px; border: 1px solid #E8E8E8; padding: 0.6em 1em;">
	
		<legend style="background: rgb(220, 220, 220); width: auto; padding: 0.6em 1em; border: 1px solid #E8E8E8; font-weight: bold; margin-bottom: 0px; font-size: 12px;">
			#{lbl['lbl.gmap.panel.title']}
		</legend>
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.gmap.instruction']}" escape="false" />
  		
  		<div class="ui-fieldset-content">
  		
		x: <p:inputText id="plat" value="#{cc.attrs.latitude}" disabled="#{cc.attrs.disabled}" />
		
		&#160;
		
		y: <p:inputText id="plng" value="#{cc.attrs.longitude}" disabled="#{cc.attrs.disabled}" />
		
		<p:commandButton id="gmId" 
			value="#{lbl['lbl.gmap.viewmap']}" 
			onclick="codeAddress(#{cc.attrs.address});"
			rendered="#{cc.attrs.showButton}"
			disabled="#{cc.attrs.disabled}">
			
			<f:setPropertyActionListener 
				target="#{gmapBackingBean.renderMap}" 
				value="#{true}" />
				
		</p:commandButton>
		
		<p:remoteCommand 
			name="updateGmap" 
			process="plat, plng" 
			update="@([id$=mapPanel])" 
			oncomplete="dlg.show();" />
		</div>
			
	</fieldset>	
</h:panelGroup>	
</cc:implementation>
</ui:composition>
