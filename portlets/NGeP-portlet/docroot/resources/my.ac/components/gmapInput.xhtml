<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="latitude" required="true" />
	<cc:attribute name="longitude" required="true" />
	<cc:attribute name="address" required="true" />
	<cc:attribute name="showButton" 	default="true" />
	<cc:attribute name="disabled" 		default="false" />
</cc:interface>

<cc:implementation>

<h:panelGroup id="#{cc.attrs.id}">

	<fieldset>
	
		<legend>
			<i class="icon icon-map-marker"></i>&#160;#{lbl['lbl.gmap.panel.title']}
		</legend>
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.gmap.instruction']}" escape="false" />
  		
  		<div class="ui-fieldset-content">
  		
		X: <p:inputText id="plat" value="#{cc.attrs.latitude}" disabled="#{cc.attrs.disabled}" />
		
		&#160;
		
		Y: <p:inputText id="plng" value="#{cc.attrs.longitude}" disabled="#{cc.attrs.disabled}" />
		
		<p:commandButton id="gmId" 
			value="#{lbl['lbl.gmap.viewmap']}" 
			onclick="codeAddress(#{cc.attrs.address}, this.previousSibling.previousSibling.previousSibling, this.previousSibling);"
			rendered="#{cc.attrs.showButton}"
			disabled="#{cc.attrs.disabled}"
			partialSubmit="true"
			process="@this">
			
			<f:setPropertyActionListener 
				target="#{gmapBackingBean.renderMap}" 
				value="#{true}" />
				
		</p:commandButton>		

		<p:remoteCommand 
			name="updateGmap" 
			process="plat, plng" 
			update="@([id$=mapPanel])" 
			oncomplete="dlg.show();" />
		</div>
			
	</fieldset>
	
</h:panelGroup>
	
</cc:implementation>

</ui:composition>
