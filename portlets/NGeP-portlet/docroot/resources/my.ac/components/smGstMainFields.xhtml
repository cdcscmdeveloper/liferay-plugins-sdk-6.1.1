<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="smGstSupplier" required="true" />
		<cc:attribute name="isGstEmpty" required="true" />
	</cc:interface>

	<cc:implementation>
		<p:outputPanel id="gstEditInfoPanelId" rendered="#{!cc.attrs.isGstEmpty}">
			<table style="width: 50%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.gst.regno']}" /></td>
					<td><p:inputText id="gstRegNo"  maxlength="12" 
						value="#{cc.attrs.smGstSupplier.gstRegNo}" 
						size="40" label="#{lbl['lbl.sm.gst.regno']}" >
						<p:ajax event="blur" update="gstEffDatePanelId" />
						</p:inputText>
					</td>
				</tr>
				<p:outputPanel id="gstEffDatePanelId">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
							<p:outputLabel value="*" styleClass="mandatory" rendered="#{not empty cc.attrs.smGstSupplier.gstRegNo}"/></td>
						<td><p:calendar id="gstRegDateCalId"
								navigator="true" 
								required="#{not empty cc.attrs.smGstSupplier.gstRegNo}" 
								label="#{lbl['lbl.sm.gst.effdate']}"
								value="#{cc.attrs.smGstSupplier.gstEffDate}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
								readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" 
								maxdate="#{CommonConstants.CURRENT_DATE}">
							</p:calendar></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td><p:calendar id="gstEffEndDateCalId"
							navigator="true" 
							label="#{lbl['lbl.sm.gst.eff.end.date']}"
							value="#{cc.attrs.smGstSupplier.gstEndDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" 
							mindate="#{CommonConstants.CURRENT_DATE}">
						</p:calendar></td>
				</tr>
			</table>
	  	</p:outputPanel>
	  	<p:outputPanel id="gstEditInfoPanelId" rendered="#{cc.attrs.isGstEmpty}">
	  		<table style="width: 50%">
		  		<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.regno']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.effdate']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
			</table>
	  	</p:outputPanel>
	</cc:implementation>
</ui:component>
