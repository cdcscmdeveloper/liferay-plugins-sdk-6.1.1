<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="smGstSupplier" required="true" />
		<cc:attribute name="isGstEmpty" required="true" />
	</cc:interface>

	<cc:implementation>
		<p:outputPanel id="gstNotEmptyPanelId" rendered="#{!cc.attrs.isGstEmpty}">
			<table style="width: 50%;table-layout:fixed">
				<tr>
					<td style="border-style: none !important;">
						<p:outputLabel value="#{lbl['lbl.sm.gst.regno']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td style="border-style: none !important;"><p:inputText id="gstRegNo"  maxlength="12" 
						value="#{cc.attrs.smGstSupplier.gstRegNo}" required="true"
						size="35" label="#{lbl['lbl.sm.gst.regno']}" >
						<p:ajax event="blur" update="gstRegDateCalId" process="@this"/>
						</p:inputText>
						<p:message id="gstRegNoMsg"
							for="gstRegNo" showSummary="true" showDetail="false"
							display="icon" />
					</td>
				</tr>
				<tr>
					<td style="border-style: none !important;">
						<p:outputLabel value="#{lbl['lbl.sm.gst.effdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td style="border-style: none !important;"><p:calendar id="gstRegDateCalId"
							navigator="true" 
							required="#{not empty cc.attrs.smGstSupplier.gstRegNo}" 
							label="#{lbl['lbl.sm.gst.effdate']}"
							value="#{cc.attrs.smGstSupplier.gstEffDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" 
							maxdate="#{CommonConstants.CURRENT_DATE}">
							<p:ajax event="dateSelect"  update="gstNotEmptyPanelId" process="@this"/>
						</p:calendar>
						<p:message id="gstRegDateCalIdMsg"
							for="gstRegDateCalId" showSummary="true" showDetail="false"
							display="icon" />
					</td>
				</tr>
				<tr>
					<td style="border-style: none !important;"><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td style="border-style: none !important;"><p:calendar id="gstEffEndDateCalId"
							navigator="true" 
							label="#{lbl['lbl.sm.gst.eff.end.date']}"
							value="#{cc.attrs.smGstSupplier.gstEndDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
							readonlyInput="true" size="30" showOn="button" yearRange="-99:+0" 
							mindate="#{CommonConstants.CURRENT_DATE}">
							<p:ajax event="dateSelect"  update="gstNotEmptyPanelId" process="@this"/>
						</p:calendar>
						<p:message id="gstEffEndDateCalIdMsg"
							for="gstEffEndDateCalId" showSummary="true" showDetail="false"
							display="icon" />
					</td>
				</tr>
			</table>
	  	</p:outputPanel>
	  	<p:outputPanel id="gstEmptyPanelId" rendered="#{cc.attrs.isGstEmpty}">
	  		<table style="width: 50%;table-layout:fixed">
		  		<tr>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.regno']}" /></td>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
				<tr>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.effdate']}" /></td>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
				<tr>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view-label" value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
					<td style="border-style: none !important;"><p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.no.available']}" /></td>
				</tr>
			</table>
	  	</p:outputPanel>
	</cc:implementation>
</ui:component>
