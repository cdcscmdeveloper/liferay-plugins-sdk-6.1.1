<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="showItemAll" default="false" />
	</cc:interface>

	<cc:implementation>
		<ui:param name="paramRequired" value="#{cc.attrs.showItemAll ? false : cc.attrs.required}" />
		<ui:param name="defaultLabel" value="#{cc.attrs.showItemAll ? 'lbl.rpt.all' : 'lbl.rpt.selectOne'}" />
		<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.zone}" style="width:300px;" 
			required="#{paramRequired}" disabled="#{cc.attrs.disabled}"
			label="#{lbl['lbl.rpt.zone']}">
			<f:selectItem itemLabel="#{lbl[defaultLabel]}" itemValue="" />
			<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
				itemValue="#{SmReportConst.SM_ZONE_SEMENANJUNG}"></f:selectItem>
			<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
				itemValue="#{SmReportConst.SM_ZONE_SABAH}"></f:selectItem>
			<f:selectItem itemLabel="#{SmReportConst.SM_ZONE_SARAWAK}"
				itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
			<p:ajax event="change" process="@this"
				listener="#{cc.attrs.bBean.onChangeZone}"
				partialSubmit="true" update="@form" />
		</p:selectOneMenu>
	</cc:implementation>
</ui:composition>
