<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:ac="http://ac.my/jsf/composite/cc">
    
<cc:interface>
	<!-- <cc:attribute name="required" />
	<cc:attribute name="value" /> -->
</cc:interface>

<cc:implementation>
	<p:remoteCommand name="updateSearchDialog" update="searchPanel lovTitle resultPanel" partialSubmit="true" process="@this resultPanel" oncomplete="lovPopupStoreproc.show();" />
	<p:remoteCommand name="resetAllData" update="searchPanel lovTitle resultPanel" partialSubmit="true" action="#{lovspBackingBean.resetAllSP}" process="@this" />
	<p:remoteCommand name="lovPopsetAutoUpdateValue" partialSubmit="true" process="@this" update="@this" action="#{lovspBackingBean.setAutoUpdateValue()}" />
	
	<p:dialog id="lovPopupStoreproc" widgetVar="lovPopupStoreproc" modal="true" width="700" position="top" 
		onShow="lovPopsetAutoUpdateValue([{name:'enableAutoUpdate', value:false}]);"
		onHide="lovPopsetAutoUpdateValue([{name:'enableAutoUpdate', value:true}]); resetAllData();" 
		resizable="false">
	
		<f:facet name="header">
			<h:panelGroup id="lovTitle">#{lbl['lbl.lov.listing']} - #{lovspBackingBean.lovBean.title} </h:panelGroup>
		</f:facet>
		
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false"/>
		
		<p:panel header="#{lbl['lbl.cm.search']}" toggleable="true">
		
		<h:panelGroup id="searchPanel" style="width:100%;">

		<ui:include src="lovSearchPanelStoreproc.xhtml" />

		<table style="width:100%;"><tr><TD style="text-align:right;">
			<p:commandButton id="lovSearchBtn"
				value="#{lbl['lbl.pm.audit.search']}"
				action="#{lovspBackingBean.searchActionSP}"
				partialSubmit="true"
				process="searchPanel"
				update="resultPanel"
				widgetVar="lovSearch">
			</p:commandButton>		
			<p:commandButton
				value="#{lbl['lbl.btn.reset']}"
				action="#{lovspBackingBean.resetAction}"
				partialSubmit="true"
				process="searchPanel"
				update="searchPanel resultPanel">
			</p:commandButton>
		</TD></tr></table>

		</h:panelGroup>
		</p:panel>  
		<p:panel header="#{lbl['lbl.pm.audit.result']}" toggleable="true">
		<h:panelGroup id="resultPanel" style="width:100%;">
			
			<h:panelGroup rendered="#{lovspBackingBean.lovBean.selectionMode == 'single'}">
			<p:dataTable id="lovTbSP"
				var="entity" 
				selection="#{lovspBackingBean.selectedEntity}"
				selectionMode="single"
				rowIndexVar="rowIndex"
				rowKey="#{entity[lovspBackingBean.lovBean.pk]}"
				rows="10"
				lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{lovspBackingBean.searchPmUserDataModel}" >
				
				<ac:paginator for="lovTbSP" />
				<p:ajax event="rowDblselect" listener="#{lovspBackingBean.populateToSaveObject}" 
                     update="@form" />
                <p:ajax event="rowSelect" update="@([id$=slbtn])" />   
                <p:ajax event="rowUnselect" update="@([id$=slbtn])" />   
								
				<p:columns var="column" value="#{lovspBackingBean.columnsToDisplay}">
				
					<f:facet name="header">  
		                #{column.columnTitle}  
		            </f:facet>
						#{column.columnNameve.getValue(facesContext.ELContext)}
				</p:columns>
				
			</p:dataTable>
			</h:panelGroup>

			<h:panelGroup rendered="#{lovspBackingBean.lovBean.selectionMode == 'multiple'}">
			<p:remoteCommand name="lovPopulateSelection" partialSubmit="true" update="lovTb2, @([id$=slbtn])" actionListener="#{lovspBackingBean.populateSelectedItems()}" />
			<p:dataTable id="lovTb2"
				var="entity" 
				selection="#{lovspBackingBean.selectedEntities}"
				rowIndexVar="rowIndex"
				rowKey="#{entity[lovspBackingBean.lovBean.pk]}"
				rows="10"
				lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{lovspBackingBean.searchPmUserDataModel}" >
				
				<ac:paginator for="lovTb2" />
				
				<p:column selectionMode="multiple" styleClass="td-check-box-spacing" /> 
				<p:ajax event="rowSelectCheckbox" update="@([id$=slbtn])" />
				<p:ajax event="rowUnselectCheckbox" update="@([id$=slbtn])" listener="#{lovspBackingBean.onUnselectRow}"/>
				<p:ajax event="rowSelect" update="@([id$=slbtn])" />   
                <p:ajax event="rowUnselect" update="@([id$=slbtn])" />  
                <p:ajax event="toggleSelect" update="@([id$=slbtn])" listener="#{lovspBackingBean.onToggleSelect}"/>
                <p:ajax event="page" listener="#{lovspBackingBean.onPageChange}" oncomplete="lovPopulateSelection()"/>
             				
				<p:columns var="column" value="#{lovspBackingBean.columnsToDisplay}">				
					<f:facet name="header">  
		                #{column.columnTitle}  
		            </f:facet>
						#{column.columnNameve.getValue(facesContext.ELContext)}
				</p:columns>
				
			</p:dataTable>
			</h:panelGroup>

			<table style="width:100%;"><tr><TD style="text-align:right;">
				<p:commandButton 
					id="slbtn"
					value="#{lbl['lbl.pm.audit.select']}"  
					action="#{lovspBackingBean.populateToSaveObject}"
					update="searchPanel #{lovspBackingBean.lovBean.clientId} #{lovspBackingBean.lovBean.update}"
					oncomplete="lovPopupStoreproc.hide();"
					process="resultPanel"
					disabled="#{lovspBackingBean.isSelectButtonDisable()}"
					partialSubmit="true"  styleClass="BtnSpacing"/>	
			   <p:commandButton value="#{lbl['lbl.btn.cancel']}"
				  partialSubmit="true" process="@this" update="@this"
				  action="#{lovspBackingBean.resetAction()}"
				  oncomplete="lovPopupStoreproc.hide();" styleClass="BtnSpacing"/>
			</TD>
			</tr></table>
			
		</h:panelGroup>
		</p:panel>
	</p:dialog>
	
	<p:defaultCommand target="lovSearchBtn" scope="searchPanel"></p:defaultCommand>
</cc:implementation>
</ui:composition>
