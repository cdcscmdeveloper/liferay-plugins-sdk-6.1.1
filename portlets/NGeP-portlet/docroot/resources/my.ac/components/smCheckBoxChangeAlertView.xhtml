<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="isShow" default="false"/>
		<cc:attribute name="oriValue" required="true" />
		<cc:attribute name="currValue" required="true" />
	</cc:interface>

	<cc:implementation>
		<ui:param name="alertCheckImgId" value="#{cc.id}"></ui:param>
		<p:outputPanel rendered="#{cc.attrs.isShow and cc.attrs.oriValue ne cc.attrs.currValue}">
		&#160;
		 	<p:graphicImage id="#{alertCheckImgId}gc" style="vertical-align:top"
				value="/css/images/design/icon_alert.png" />
			<p:tooltip id="alertChangeTtId" for="#{alertCheckImgId}gc">
				<p:outputLabel escape="false"
					value="#{cc.attrs.currValue ? lbl['lbl.txt.no'] : lbl['lbl.txt.yes']}" />
			</p:tooltip>
		</p:outputPanel>
	</cc:implementation>

</ui:component>
