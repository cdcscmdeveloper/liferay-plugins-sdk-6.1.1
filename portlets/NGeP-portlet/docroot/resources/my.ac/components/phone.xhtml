<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="countryCode"	required="true" default="60"/>
	<cc:attribute name="areaCode" 		required="true" />
	<cc:attribute name="number" 		required="true" />
	<cc:attribute name="telcoId" 						/>
	<cc:attribute name="required" 		default="false" />
	<cc:attribute name="isMobile" 		default="false" />
	<cc:attribute name="validatorMessage" 		default="#{lbl['lbl.txt.invalid.digit']}" />
	<cc:attribute name="label" 		default="#{lbl['lbl.sm.phoneno']}" />
</cc:interface>

<cc:implementation>
	<ui:param name="phoneNoId" value="#{cc.id}"></ui:param>
	<h:panelGroup id="#{cc.attrs.id}">

		+
		<p:inputText value="#{cc.attrs.countryCode}" size="4" maxlength="4" label="#{lbl['lbl.sm.country.code']}" 
			required="#{cc.attrs.required or not empty cc.attrs.areaCode or not empty cc.attrs.number or (cc.attrs.isMobile and not empty cc.attrs.telcoId)}" >
			<p:ajax process="@this" update="#{cc.attrs.id}" partialSubmit="true"/>
		</p:inputText>
		<p:inputText value="#{cc.attrs.areaCode}" size="4" maxlength="4" label="#{lbl['lbl.sm.area.code']}"
			required="#{cc.attrs.required or not empty cc.attrs.number or (cc.attrs.isMobile and not empty cc.attrs.telcoId)}" >
			<p:ajax process="@this" update="#{cc.attrs.id}" partialSubmit="true"/>
		</p:inputText>
		<p:inputText value="#{cc.attrs.number}" size="10" maxlength="10" id="#{phoneNoId}ph"
			required="#{cc.attrs.required or not empty cc.attrs.areaCode or (cc.attrs.isMobile and not empty cc.attrs.telcoId)}" 
			validatorMessage="#{cc.attrs.validatorMessage}" label="#{cc.attrs.label}">
			<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
			<p:ajax process="@this" update="#{cc.attrs.id}" partialSubmit="true" />
		</p:inputText>	
		<p:graphicImage id="#{phoneNoId}teleno"	value="/css/images/design/tooltips.png" /> 
		<p:tooltip	id="#{phoneNoId}tfno" for="#{phoneNoId}teleno">
			<p:outputLabel escape="false" value="#{lbl['tt.sm.registration.company.telephoneno']}" />
		</p:tooltip>
		&#160;
		<p:selectOneMenu value="#{cc.attrs.telcoId}" rendered="#{cc.attrs.isMobile}" label="#{lbl['lbl.sm.telco']}"
			required="#{cc.attrs.required or not empty cc.attrs.areaCode or not empty cc.attrs.number}">
			<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
			<f:selectItems value="#{applicationBean.telcoItems}" />
		</p:selectOneMenu>
		<p:message id="#{phoneNoId}phMsg" for="#{phoneNoId}ph" showSummary="true" showDetail="false" display="icon" />	
	</h:panelGroup>
</cc:implementation>
</ui:composition>
