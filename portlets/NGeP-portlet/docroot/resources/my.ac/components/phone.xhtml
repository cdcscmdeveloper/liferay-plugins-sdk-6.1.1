<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="countryCode"	required="true" default="60" />
	<cc:attribute name="areaCode" 		required="true" />
	<cc:attribute name="number" 		required="true" />
	<cc:attribute name="telcoId" 						/>
	<cc:attribute name="required" 		default="false" />
	<cc:attribute name="isMobile" 		default="false" />
	<cc:attribute name="validatorMessage" 		default="#{lbl['lbl.txt.invalid.digit']}" />
</cc:interface>

<cc:implementation>
	<h:panelGroup id="#{cc.attrs.id}">

		+
		<p:inputText value="#{cc.attrs.countryCode}" size="4" maxlength="4" required="#{cc.attrs.required}" />
		<p:inputText value="#{cc.attrs.areaCode}" 	 size="4" maxlength="4" required="#{cc.attrs.required}" />
		<p:inputText value="#{cc.attrs.number}" size="10" maxlength="10" required="#{cc.attrs.required}" validatorMessage="#{cc.attrs.validatorMessage}">
			<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		</p:inputText>		
		<p:graphicImage id="teleno"	value="/css/images/design/tooltips.png" /> 
		<p:tooltip	id="tfno" for="teleno">
			<p:outputLabel escape="false" value="#{lbl['tt.sm.registration.company.telephoneno']}" />
		</p:tooltip>
		&#160;
		<p:selectOneMenu value="#{cc.attrs.telcoId}" rendered="#{cc.attrs.isMobile}">
			<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
			<f:selectItems value="#{applicationBean.telcoItems}" />
		</p:selectOneMenu>
	
	</h:panelGroup>
</cc:implementation>
</ui:composition>
