<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:cc="http://java.sun.com/jsf/composite">

	<cc:interface>
		<cc:attribute name="dialogHeader"
			default="#{lbl['lbl.sm.other.desc.edit.header']}" />
	</cc:interface>
	<cc:implementation>
		<p:dialog
			id="otherDescriptionEditDlgId"
			header="#{cc.attrs.dialogHeader} #{backingBean.managedBean.selectedCategory.pmCategoryL1.categoryL1Code}#{backingBean.managedBean.selectedCategory.pmCategoryL2.categoryL2Code}#{backingBean.managedBean.selectedCategory.pmCategoryL3.categoryL3Code}"
			closable="true"
			widgetVar="otherDescriptionEditDlg"
			resizable="false"
			style="width: auto; height: auto; display: block;">
			<p:outputPanel
				id="otherDescriptionMsg">
				<table style="width: 100%">
					<tr>
						<td><h:outputText
								value="#{lbl['lbl.sm.other.desc.edit.text']}" style="margin: 10px;"/>
							<h:inputText id="smOtherDesc"
								maxlength="5000"
								value="#{backingBean.managedBean.otherDescEdited}"
								size="35" />
						</td>
					</tr>
					<tr>
						<td><p:selectBooleanCheckbox
								id="cbSavRecordId"
								value="#{backingBean.managedBean.updateRecordTC}">
								<p:ajax update="btnYes"
									partialSubmit="true"
									process="@this" />
							</p:selectBooleanCheckbox>
							#{lbl['lbl.sm.other.desc.edit.tick']}
						</td>
					</tr>
					<tr>
						<td><p:commandButton
								id="btnYes"
								value="#{lbl['lbl.btn.yes']}"
								disabled="#{!backingBean.managedBean.updateRecordTC}"
								partialSubmit="true"
								update=":form"
								action="#{backingBean.saveOtherDescriptionEdit}" />
							<p:commandButton id="btnNo"
								value="#{lbl['lbl.btn.no']}"
								action="#{backingBean.resetOtherDescriptionEdit}"
								onclick="otherDescriptionEditDlg.hide();" />
						</td>
					</tr>
				</table>
			</p:outputPanel>
		</p:dialog>
	</cc:implementation>
</ui:composition>
