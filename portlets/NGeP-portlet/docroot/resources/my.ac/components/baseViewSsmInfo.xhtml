<ui:composition 
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml">
	>
<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="title" required="true" />
		<cc:attribute name="dialogId" required="true" />
		<cc:attribute name="height" default="650" />
		<cc:attribute name="width" default="650" />
	</cc:interface>

	<cc:implementation>
		<p:dialog id="#{cc.attrs.dialogId}" header="#{cc.attrs.title}"
			widgetVar="#{cc.attrs.dialogId}WidgetVar" modal="true"
			height="cc.attrs.height" width="cc.attrs.width"
			resizable="true" style="display: block;">
			
			<div id="#{cc.attrs.dialogId}ContentDiv"
				style="overflow-wrap: break-word;">
				
		
		<p:panel header="#{lbl['lbl.sm.panHdr.comBasic']}" toggleable="true"
			toggleSpeed="500">

		<h:panelGrid columns="2" layout="grid">
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.companyname']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.managedBean.smSupplierSsm.companyName}"></h:outputText>

				<!-- h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.regtype']} :">
					</h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.getParameterDesc(cc.attrs.bBean.managedBean.businessTypeParamCode,cc.attrs.bBean.managedBean.smSupplier.businessType)}"></h:outputText -->

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.txt.business.reg.no']} :"></h:outputLabel>
				<h:outputText value="#{cc.attrs.bBean.managedBean.smSupplierSsm.regNo}"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.estdate']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.managedBean.smCompanyBasicSsm.establishDate}">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>

				<c:if
					test="#{cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'C' or cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'F'}">
					<h:outputLabel style="font-weight:bold"
						value="#{lbl['lbl.sm.account.rob.expire']} :"></h:outputLabel>
					<h:outputText 
						value="${cc.attrs.bBean.managedBean.smCompanyBasicSsm.robExpiryDate}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</c:if>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.status']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.setStatusMessageFromSSM(cc.attrs.bBean.managedBean.smCompanyBasicSsm.companySsmStatus)}"></h:outputText>

				<h:outputLabel
					style="font-weight:bold;display: inline-block; vertical-align: top;"
					value="#{lbl['lbl.sm.companyaddress']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.managedBean.smAddress.address1} &lt;br/&gt;#{cc.attrs.bBean.managedBean.smAddress.address2} &lt;br/&gt;#{cc.attrs.bBean.managedBean.smAddress.address3}"
					escape="false"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.state']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.managedBean.smAddress.pmState.stateName}"></h:outputText>

				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.postcode']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.managedBean.smAddress.postcode}"></h:outputText>
				
				<!-- 27346 -->
				<c:if test="#{cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'I' or cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'J'}">	
				<h:outputLabel style="font-weight:bold"
					value="#{lbl['lbl.sm.country']} :"></h:outputLabel>
				<h:outputText
					value="#{cc.attrs.bBean.managedBean.smAddress.pmCountry.countryName}"></h:outputText>	
				
				<h:outputLabel style="font-weight:bold" 
					value="#{lbl['lbl.sm.annualRev']} :"></h:outputLabel>
					<h:panelGrid columns="3" layout="grid"> 
						<h:outputText value="#{cc.attrs.bBean.managedBean.smCompanyBasicSsm.annualRevenueSSM}" >
							<f:convertNumber groupingUsed="true" maxFractionDigits="3" minFractionDigits="3" />
						</h:outputText>
						<h:outputText>&#160;&#160;</h:outputText>    
						<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
							label="#{lbl['lbl.sm.annualRev']}" required="true"
							id="smSupAnnRev"
							disabled="true"
							value="#{cc.attrs.bBean.managedBean.smCompanyBasicSsm.annualRevenue}">
							<f:selectItems value="#{cc.attrs.bBean.getDropdownValues('SAR')}" />
						</p:selectOneMenu>
					</h:panelGrid>
					</c:if>
					
				
	
				<!-- <h:outputText
					value="#{cc.attrs.bBean.getParameterDesc('SAR',cc.attrs.bBean.managedBean.smAppl.smCompanyBasic.annualRevenue)}"></h:outputText> -->
			</h:panelGrid>
		</p:panel>

		<c:if
			test="#{cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'C' or cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'F'}">
			<ui:include
				src="/xhtml/sm/shared/onlinereg/viewSsmInformationBranchAc.xhtml" />
		</c:if>
		
		<!-- 27346 -->
		<ui:include
			src="/xhtml/sm/shared/onlinereg/viewSsmInformationOwnerDirectorAc.xhtml" />
		
		<c:if
			test="#{cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'I' or cc.attrs.bBean.managedBean.smSupplierSsm.businessType == 'J'}">	
		<ui:include
			src="/xhtml/sm/shared/onlinereg/viewSsmInformationCompanyEquityAc.xhtml" />
		<ui:include
			src="/xhtml/sm/shared/onlinereg/viewSsmInformationPersonnelAc.xhtml" />
		</c:if>
		
		
		<ui:include
			src="/xhtml/sm/shared/onlinereg/viewSsmInformationNatureBusinessAc.xhtml" />
		
		</div>
		</p:dialog>
	</cc:implementation>
</ui:composition>
