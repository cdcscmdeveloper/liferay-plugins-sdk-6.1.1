<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>

		<cc:attribute name="generateAction" required="true" default="" />
		<cc:attribute name="resetAction" required="true" default="" />

	</cc:interface>

	<cc:implementation>

		<div style="text-align: right;">
			<p:commandButton id="generateId" value="#{lbl['lbl.rpt.generate']}"
				update="@form"
				action="#{cmReportsBackingBean.generateAction(cc.attrs.generateAction)}">

			</p:commandButton>

			<p:commandButton id="resetId" value="#{lbl['lbl.btn.reset']}"
				update=":form"
				action="#{cmReportsBackingBean.resetAction(cc.attrs.resetAction)}">

			</p:commandButton>
		</div>

		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">


			
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{cmReportsBackingBean.managedBean.popUpMsg}">
			</h:outputText>
			<br />

			<div style="float:right;">

				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{cmReportsBackingBean.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>



			</div>
		</p:dialog>

	</cc:implementation>
</ui:composition>
