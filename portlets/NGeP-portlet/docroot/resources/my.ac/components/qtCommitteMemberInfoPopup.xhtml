<!-- #12471 Start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="widget" default="" />
	</cc:interface>
	<cc:implementation>
		<ui:param name="bBean" value="#{cc.attrs.bBean}" />
		<ui:param name="widget" value="#{cc.attrs.widget}" />
		<style>
			.dialogContainer {
				width: 70% !important;
			}
			.gridContainer {
				width: 100%;
			}
			.sp-centered {
				text-align: center;
				display: block;
			}
		</style>
		<p:dialog id="memberInfoPopup"
			header="#{lbl['lbl.sc.committee.add.member.search.header.user.info'].toUpperCase()}"
			closable="true" widgetVar="#{widget}" modal="true"
			styleClass="dialogContainer" position="center" resizable="false">
			<h:panelGroup id="memberInfoId" layout="block">
				<h:panelGrid styleClass="gridContainer">
					<p:panel id="memberInfoPanelId">
						<p:dataTable id="memberInfoTableId" lazy="true"
							value="#{bBean.managedBean}" var="bb"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
							<p:column headerText="#{lbl['lbl.sc.name']}">
								<h:outputText style="white-space: normal;" value="#{bb.memberName}">
								</h:outputText>
							</p:column>
							<p:column
								headerText="#{lbl['lbl.sc.committee.add.member.search.header.member.info.ministry.org']}">
								<h:outputText style="white-space: normal;" value="#{bb.memberMinOrg}">
								</h:outputText>
							</p:column>
							<p:column
								headerText="#{lbl['lbl.sc.committee.add.member.search.header.member.info.ptj.org.code']}">
								<h:outputText style="white-space: normal;" value="#{bb.memberPtjOrgCode}">
								</h:outputText>
							</p:column>
							<p:column
								headerText="#{lbl['lbl.sc.committee.add.member.search.header.member.info.ptj.org.name']}">
								<h:outputText style="white-space: normal;" value="#{bb.memberPtjOrgName}">
								</h:outputText>
							</p:column>
						</p:dataTable>
					</p:panel>
				</h:panelGrid>
				<h:panelGrid style="float:right">
					<p:commandButton value="#{lbl['lbl.sc.ok']}" immediate="true"
						oncomplete="#{widget}.hide()" />
				</h:panelGrid>
			</h:panelGroup>
		</p:dialog>
	</cc:implementation>
</ui:composition>
<!-- #12471 End -->
