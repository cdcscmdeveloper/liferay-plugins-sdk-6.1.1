<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:ac="http://ac.my/jsf/composite/cc">
    
<cc:interface>
	<cc:attribute name="beforeSignText" />
	<cc:attribute name="postSignAction" method-signature="java.lang.String action()" />
</cc:interface>

<cc:implementation>
       
    <p:dialog widgetVar="spki_dlg" resizable="false">
        <span id="#{cc.clientId}">
        
    
        <h:outputLabel value="*Please answer the following challenge question" />
          <h:panelGrid id="spkiPanel" columns="2" cellpadding="3">
           <h:outputLabel value="#{spkiBackingBean.challengeQues1}" />
           <p:inputText value="#{spkiBackingBean.challsAnswer}" />
        
            <h:outputLabel for="password" value="*Digital Certificate PIN" />
            <p:password binding="#{pin}" id="password" value="12345678" required="true" />
 			<p:commandButton value="Sign" action="#{cc.attrs.postSignAction}" />        
		</h:panelGrid></span>
    </p:dialog>
</cc:implementation>
</ui:composition>
