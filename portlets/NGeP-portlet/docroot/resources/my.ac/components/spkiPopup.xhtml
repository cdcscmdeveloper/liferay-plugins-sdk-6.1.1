<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="beforeSignText" />
		<cc:attribute name="postSignAction"
			method-signature="java.lang.String action()" />
		<cc:attribute name="enableAutoUpdate" required="false"
			method-signature="void action()" />
		<cc:attribute name="challengeQues1" />
		<cc:attribute name="challengeAns1" />
		<cc:attribute name="password" />
	</cc:interface>

	<cc:implementation>

		<script type="application/javascript">
		
	
			function blockEnter() {
				$(document).keypress(function(event) {
					if (event.which == '13') {
						event.preventDefault();
					}
				});
			}

			var runEnableAutoUpdate = true;
			function setRunEnableAutoUpdate(runEnableAutoUpdate) {
				this.runEnableAutoUpdate = runEnableAutoUpdate;
			}

			function isRunEnableAutoUpdate() {
				return this.runEnableAutoUpdate;
			}
		</script>
		<p:remoteCommand name="resetQuestion" id="resetQuestion"
			action="#{spkiBackingBean.clearInput}" update="spkiPanel"></p:remoteCommand>


		<p:dialog id="spki_dlg_id" header="#{lbl['lbl.cc.spki.title']}"
			widgetVar="spki_dlg" onShow="resetQuestion();" resizable="false"
			modal="true">

			<p:ajax event="close" listener="#{cc.attrs.enableAutoUpdate}"
				onstart="return isRunEnableAutoUpdate()"
				oncomplete="setRunEnableAutoUpdate(true);"
				disabled="#{empty cc.getValueExpression('enableAutoUpdate')}" />

			<p:blockUI block="spkiPopup" widgetVar="spkiBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			<p:panel id="spkiPopup">
				<span id="#{cc.clientId}"> 

					<h:panelGroup id="spkiPanel">
						<p:messages id="dlgMessages" showDetail="true" escape="false" autoUpdate="true" closable="true" />
						
						<table>
							<tr>
								<td><!-- #36605 -->
									<p:outputLabel style="white-space: normal;" value="#{cc.attrs.challengeQues1}" 
										rendered="#{not empty cc.attrs.challengeQues1}"/>
									<p:outputLabel value="*" styleClass="mandatory" rendered="#{not empty cc.attrs.challengeQues1}"/>
								</td>
								<td><p:inputText id="answerId" value="#{cc.attrs.challengeAns1}" onkeypress="blockEnter();" 
										rendered="#{not empty cc.attrs.challengeQues1}"/></td>
							</tr>
							<tr>
								<td>
									<p:outputLabel for="password" value="#{lbl['lbl.cc.spki.pin']}" />
									<p:outputLabel value="*" styleClass="mandatory" />
								</td>
								<td><p:password id="password" value="#{cc.attrs.password}" onkeypress="blockEnter();" maxlength="8" /></td>
							</tr>
						</table>

						<table style="width: 100%">
							<tr>
								<td><p:commandButton id="spkiSign"
										value="#{lbl['lbl.btn.sign']}" update="spkiPanel"
										onclick="spkiBlockWidget.show(); setRunEnableAutoUpdate(false);"
										action="#{spkiBackingBean.spkiSignAction(cc.attrs.postSignAction, cc.attrs.enableAutoUpdate)}"
										oncomplete="spkiBlockWidget.hide();" /> 
										<p:commandButton action="#{spkiBackingBean.changeChallengeQuestions()}" 
										onclick="spkiBlockWidget.show();" 
										value="#{lbl['lbl.btn.change.question']}" update="spkiPanel"
										oncomplete="spkiBlockWidget.hide();" /></td>
							</tr>
						</table>
					</h:panelGroup>
				</span>
			</p:panel>
		</p:dialog>
	</cc:implementation>
</ui:composition>
