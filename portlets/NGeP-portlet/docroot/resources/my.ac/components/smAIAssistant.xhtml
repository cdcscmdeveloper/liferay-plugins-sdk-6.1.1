<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="aiDlg" default="aiDlg"/>
		<cc:attribute name="docType" default="bank" />
		<cc:attribute name="showBtn" default="true" />
		<cc:attribute name="smAppl" type="my.ep.persistence.entity.sm.SmAppl" default="#{null}"/>
		<cc:attribute name="updateId" default=""/>
	</cc:interface>

	<cc:implementation>
		<style type="text/css">
			.ui-fileupload td.cancel,
			.ui-fileupload td.start {
		        display: none;
		    }
		</style>
		
		<ui:param name="ai" value="#{smAIDocBackingBean}" />
		<ui:param name="pnlId" value="pnl#{cc.attrs.aiDlg}" />
		
		<p:dialog id="block#{cc.attrs.aiDlg}" widgetVar="block#{cc.attrs.aiDlg}"
			modal="true" resizable="false" closable="false" showHeader="false">
			<p:outputPanel style="display: flex; flex-direction: column;align-items: center;">
				<p:outputLabel value="#{lbl['lbl.sm.ai.load']}..."/>
				<p:spacer width="10" />
				<p:graphicImage value="/css/images/ai/load.gif"/>
			</p:outputPanel>
		</p:dialog>
		
		<p:dialog id="#{cc.attrs.aiDlg}" widgetVar="#{cc.attrs.aiDlg}" modal="true"
			dynamic="true" resizable="true" width="700px" height="500px"
			header="#{lbl['lbl.btn.upload.doc']}"
			styleClass="pop_up_top">
			<!-- every hide() fires close, so Submit and Cancel come through here as well as the X -->
			<p:ajax event="close" listener="#{ai.deleteInvalidDocs}" process="@this"
				update=":#{p:component(pnlId)} :#{p:component(cc.attrs.updateId)}"
				disabled="#{cc.attrs.docType ne 'epf'}"/>

		<p:outputPanel id="pnl#{cc.attrs.aiDlg}" layout="block">
		
			<f:event type="preRenderComponent" listener="#{ai.initContext(cc.attrs.docType, cc.attrs.smAppl)}" />
			
			<!-- #40112 -->
			<p:outputPanel id="messages" layout="block" styleClass="ui-messages ui-widget" autoUpdate="true">
				<ui:repeat var="sev" value="#{fn:split('warn,error', ',')}">
					<h:panelGroup layout="block" styleClass="ui-messages-#{sev} ui-corner-all"
						rendered="#{not empty ai.getDialogMessages(sev)}">
						<a href="#" class="ui-messages-close" onclick="$(this).parent().slideUp();return false;"><span class="ui-icon ui-icon-close"></span></a>
						<span class="ui-messages-#{sev}-icon"></span>
						<ul>
							<ui:repeat var="msg" value="#{ai.getDialogMessages(sev)}">
								<li><span class="ui-messages-#{sev}-detail">#{msg}</span></li>
							</ui:repeat>
						</ul>
					</h:panelGroup>
				</ui:repeat>
			</p:outputPanel>
			
			<h:outputText value="#{lbl['lbl.sm.ai.tnc.instruction']}" rendered="#{cc.attrs.docType eq 'tenancy'}"
				styleClass="instruction" escape="false"/>
			<h:outputText value="#{lbl['lbl.sm.ai.epf.instruction']}" rendered="#{cc.attrs.docType eq 'epf'}"
				styleClass="instruction" escape="false"/>
			<br/><br/>
			<p:dataTable id="docs#{cc.attrs.aiDlg}" var="doc" value="#{ai.getDocs()}" emptyMessage="">
				<p:column style="width:5%;text-align:center;">
					<p:outputPanel rendered="#{ai.getDocVerdict(doc) eq 1}">
						<p:graphicImage id="imgAiEpf1" value="/css/images/ai/yes.png" />
						<p:tooltip for="imgAiEpf1" rendered="#{not empty ai.getDocLabel(doc)}">
							<p:outputLabel escape="false" value="#{ai.getDocLabel(doc)}"/>
						</p:tooltip>
					</p:outputPanel>
					<p:outputPanel rendered="#{ai.getDocVerdict(doc) eq 2}">
						<p:graphicImage id="imgAiEpf2" value="/css/images/ai/no.png" />
						<p:tooltip for="imgAiEpf2" rendered="#{not empty ai.getDocLabel(doc)}">
							<p:outputLabel escape="false" value="#{ai.getDocLabel(doc)}"/>
						</p:tooltip>
					</p:outputPanel>
					<p:outputPanel rendered="#{ai.getDocVerdict(doc) eq 3}">
						<p:graphicImage id="imgAiEpf3" value="/css/images/ai/warning.png" />
						<p:tooltip for="imgAiEpf3" rendered="#{not empty ai.getDocLabel(doc)}">
							<p:outputLabel escape="false" value="#{ai.getDocLabel(doc)}"/>
						</p:tooltip>
					</p:outputPanel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sm.sme.supp.doc.name']}">
					<h:commandLink id="file" value="#{doc.fileName}" >
            			<p:fileDownload value="#{ai.commonDownload(doc.filePath, doc.fileName)}" />
        			</h:commandLink>
				</p:column>
				<p:column style="width:5%;text-align:center;">
					<p:commandLink action="#{ai.deleteDoc(doc)}" process="@this" update=":#{p:component(pnlId)}"
						rendered="#{empty cc.attrs.updateId}">
						<p:graphicImage value="/css/images/design/trash.png" />
					</p:commandLink>
					<p:commandLink action="#{ai.deleteDoc(doc)}" process="@this"
						update=":#{p:component(pnlId)} :#{p:component(cc.attrs.updateId)}"
						rendered="#{not empty cc.attrs.updateId}">
						<p:graphicImage value="/css/images/design/trash.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<br/>
			
			<!-- temp, allowTypes buang json -->
			<p:fileUpload mode="advanced"
				allowTypes="/(\.|\/)(pdf|json)$/"
				sizeLimit="#{SupplierManagementConst.SM_SUPPORTDOCS_FILE_SIZE_LIMIT}"
				invalidFileMessage="#{lbl['lbl.txt.upload.pdf.file']}"
				invalidSizeMessage="#{lbl['lbl.sm.upload.fileSize.exceed20Mb']}"
				fileUploadListener="#{ai.handleSupDocFileAttachment}"
				update="docs#{cc.attrs.aiDlg} result#{cc.attrs.aiDlg} btns#{cc.attrs.aiDlg}"
				auto="true"
				label="#{lbl['lbl.txt.upload']}"
				dragDropSupport="false"
				multiple="#{cc.attrs.docType eq 'epf'}"
				showButtons="false"
				onstart="this.uploadContent.find('tr.ui-state-error').remove(); block#{cc.attrs.aiDlg}.show()"
				oncomplete="if (this.form.data('fileupload')._active == 1) block#{cc.attrs.aiDlg}.hide();"/>
			
			<p:outputPanel id="result#{cc.attrs.aiDlg}">
				<!-- epf -->
				<p:outputPanel rendered="#{ai.postAI and cc.attrs.docType eq 'epf'}">
					<h:outputText value="#{lbl['lbl.sm.ai.epf.extracted']}" styleClass="instruction" />
					<br/>
					<h:outputText value="#{lbl['lbl.sm.ai.epf.select']}" />
					<p:spacer height="5" />

					<p:dataTable id="dt#{cc.attrs.aiDlg}" var="emp" value="#{ai.getEmployees()}" rowKey="#{emp}"
						selection="#{ai.selectedEmployees}"
						rows="10"
						style="width:100%">
						<ac:paginator for="dt#{cc.attrs.aiDlg}" />
						<p:column selectionMode="multiple" style="width:5%" />
						<p:column headerText="#{lbl['lbl.sm.person.name']}">
							<h:outputText value="#{emp.employeeName}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.person.composition.idenNum']}">
							<h:outputText value="#{emp.idNo}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sm.person.epfNo']}">
							<h:outputText value="#{emp.kwspNumber}" />
						</p:column>
					</p:dataTable>
				</p:outputPanel>

                <!-- tenancy -->
				<p:outputPanel rendered="#{ai.postAI and cc.attrs.docType eq 'tenancy'}">
					<h:outputText value="#{lbl['lbl.sm.ai.tnc.extracted']}" styleClass="instruction" />
					<br/><br/>
					<h:outputText value="#{lbl['lbl.sm.assocCmpny.companyName']}: " style="font-weight:bold;" />
					<h:outputText value="#{ai.tenancy.tenantsName}" />
					<br/>
					<h:outputText value="#{lbl['lbl.sm.facility.landLordName']}: " style="font-weight:bold;" />
					<h:outputText value="#{ai.tenancy.landlordsName}" />
					<br/>
					<h:outputText value="#{lbl['lbl.sm.facility.monthRent']}: " style="font-weight:bold;" />
					<h:outputText value="#{ai.tenancy.monthlyRental}" />
					<br/>
					<h:outputText value="#{lbl['lbl.sm.companyaddress']}: " style="font-weight:bold;" />
					<h:outputText value="#{ai.tenancy.premisesAddress}" />
				</p:outputPanel>

                <!-- others -->
                <p:outputPanel rendered="#{ai.postAI and cc.attrs.docType != 'epf' and cc.attrs.docType != 'tenancy'}">
					<p:spacer height="10" />
					<h:outputText value="#{lbl['lbl.sm.ai.success']}" />
				</p:outputPanel>
			</p:outputPanel>

			<p:spacer height="10" />
			<h:panelGroup id="btns#{cc.attrs.aiDlg}" layout="block" styleClass="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{ai.submit(cc.attrs.docType, cc.attrs.smAppl)}"
					rendered="#{empty cc.attrs.updateId}"
					onclick="#{cc.attrs.aiDlg}.hide();"
					disabled="#{ai.blockSubmit}"/>

				<p:commandButton id="submitBtnAI"
					value="#{lbl['lbl.btn.submit']}"
					action="#{ai.submit(cc.attrs.docType, cc.attrs.smAppl)}"
					process="@this dt#{cc.attrs.aiDlg}"
					update=":#{p:component(cc.attrs.updateId)} :#{p:component(pnlId)}"
					rendered="#{not empty cc.attrs.updateId}"
					onstart="block#{cc.attrs.aiDlg}.show()"
					oncomplete="block#{cc.attrs.aiDlg}.hide(); #{cc.attrs.aiDlg}.hide();"
					disabled="#{empty ai.docs or ai.blockSubmit}"/>
					
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" onclick="#{cc.attrs.aiDlg}.hide()"/>
			</h:panelGroup>
		</p:outputPanel>
		</p:dialog>
	</cc:implementation>
</ui:component>
