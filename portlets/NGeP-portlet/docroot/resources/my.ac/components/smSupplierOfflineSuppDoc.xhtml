<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="tableId" required="true" />
		<cc:attribute name="smApplSupportDocs" required="true" />
		<cc:attribute name="mandatory" default="false"/>
		<cc:attribute name="uploadDialogId" default="false"/>
	</cc:interface>

	<cc:implementation>
		<p:dataTable var="table" id="#{cc.attrs.tableId}" 
			value="#{cc.attrs.smApplSupportDocs}" rowIndexVar="index" 
			style="width:100% !important; table-layout: fixed !important;" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
			
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.mandatory.suppdoc']}" colspan="3" rendered="#{cc.attrs.mandatory}"
						style="background-color:PeachPuff !important;text-align: center !important;color:black !important"/>
					<p:column headerText="#{lbl['lbl.sm.nonmandatory.suppdoc']}" colspan="3" rendered="#{!cc.attrs.mandatory}"
						style="background-color:PaleGreen !important;text-align: center !important;color:black !important"/>
                </p:row>
                <p:row>
                	<p:column headerText="#{lbl['lbl.sm.userprofile.num']}"
						style="width : 5%;text-align: center !important;" />
					<p:column headerText="#{lbl['lbl.sm.suppDoc.document.description']}" 
						style="width : 90%;overflow: hidden !important;" />
					<p:column headerText="#{lbl['lbl.btn.download']}"
						rendered="#{backingBean.managedBean.hasSuppDocToDownload}"
						style="width : 5%;text-align: center  !important;" />
                </p:row>
			</p:columnGroup>

			<p:column style="width : 5%;text-align: center !important;">
				<h:outputText value="#{index + 1}" />
			</p:column>

			<p:column style="width : 90%;">
			
				<h:outputText value="#{table.pmDocument.docName}" style="float: left;white-space: normal;" />
				
				<p:outputPanel rendered="#{table.pmDocument.licenseReq}">
					<br /><br />
					<table style="width: 60%;">
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.no']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}" />
							</td>
							<td style="border-style: none !important;">
								<p:inputText value="#{table.licenseNo}" size="20" id="licenseNoOfflineId" required="#{table.pmDocument.mandatory}" label="#{lbl['lbl.sm.suppdoc.license.no']}" maxlength="30">
									<p:ajax process="@this" partialSubmit="true"/>
								</p:inputText>
								<p:message id="licenseNoOfflineIdMsg" for="licenseNoOfflineId" showSummary="true" showDetail="false" display="icon" />
							</td>
							<td colspan="2" style="border-style: none !important;"></td>
						</tr>
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.effdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}" />
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseEffDateOfflineId"
									navigator="true" required="#{table.pmDocument.mandatory}" 
									label="#{lbl['lbl.sm.suppdoc.license.effdate']}"
									value="#{table.licenseEffDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+0" >
									<p:ajax event="dateSelect" update="licenseExpDateOfflineId" process="@this" partialSubmit="true"/>
								</p:calendar>
								<p:message id="licenseEffDateOfflineIdMsg"
									for="licenseEffDateOfflineId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.expdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}" />
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseExpDateOfflineId" disabled="#{empty table.licenseEffDate}"
									navigator="true" required="#{table.pmDocument.mandatory}"
									label="#{lbl['lbl.sm.suppdoc.license.expdate']}"
									value="#{table.licenseExpDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+10" 
									mindate="#{table.licenseEffDate}">
									<p:ajax event="dateSelect" process="@this" partialSubmit="true"/>
								</p:calendar>
								<p:message id="licenseExpDateOfflineIdMsg"
									for="licenseExpDateOfflineId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
						</tr>
					</table>
					<br />
				</p:outputPanel>
				
			</p:column>

			<p:column rendered="#{backingBean.managedBean.hasSuppDocToDownload}"
				style="width : 5%;text-align: center  !important;">
				<p:commandLink rendered="#{table.pmDocument.download}"
					action="#{backingBean.downloadSignatureSuppDoc(table.pmDocument.docDefinitionKey)}"
					update=":form" ajax="false">
					<p:fileDownload value="#{backingBean.file}" />
					<p:graphicImage value="/css/images/design/download.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</cc:implementation>
</ui:component>
