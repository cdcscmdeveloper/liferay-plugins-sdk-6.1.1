<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="title" required="true" />
		<cc:attribute name="dialogId" required="true" />
		<cc:attribute name="content" required="true" />
		<cc:attribute name="btnOkLabel" required="true" />
		<cc:attribute name="btnOkProcess" required="false" default="@this" />
		<cc:attribute name="btnOkUpdate" required="false" default="@form" />
		<cc:attribute name="btnCancelLabel" required="true" />
		<cc:attribute name="height" required="false" default="" />
		<cc:attribute name="width" required="false" default="" />
	</cc:interface>

	<cc:implementation>
		<p:dialog id="#{cc.attrs.dialogId}" header="#{cc.attrs.title}"
			widgetVar="#{cc.attrs.dialogId}WidgetVar" modal="true"
			height="#{cc.attrs.height}" width="#{cc.attrs.width}">
			<div id="#{cc.attrs.dialogId}ContentDiv">
				<h:outputText value="#{cc.attrs.content}" />
			</div>

			<div style="float: right;">
				<p:commandButton value="#{cc.attrs.btnOkLabel}"
					process="#{cc.attrs.btnOkProcess}" partialSubmit="true" immediate="true"
					action="#{cc.attrs.bBean.redirectToHomepage()}" update="#{cc.attrs.btnOkUpdate}" />
				<p:commandButton value="#{cc.attrs.btnCancelLabel}"
					oncomplete="#{cc.attrs.dialogId}WidgetVar.hide()" />
			</div>
		</p:dialog>

	</cc:implementation>
</ui:composition>
