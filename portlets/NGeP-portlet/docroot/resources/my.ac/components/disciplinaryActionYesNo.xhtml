<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:cc="http://java.sun.com/jsf/composite">

	<cc:interface>
		<cc:attribute name="supplier"
			type="my.ep.persistence.entity.sm.SmSupplier" />
		<cc:attribute name="showTooltip" default="false" />
		<cc:attribute name="index" default="0" />
		<cc:attribute name="childIndex" default="0" />
		<cc:attribute name="prefix" default="" />
	</cc:interface>
	<cc:implementation>
		<p:commandLink onstart="blockWidget.show()"
			oncomplete="blockWidget.hide()" style="color:red; font-weight:bold;"
			rendered="#{cc.attrs.supplier.disciplinaryActions}"
			action="#{viewSuppProfileBackingBean.onViewActiveDisciplinaryAction(cc.attrs.supplier)}"
			update="@([id$=disciplinaryActionHistoryDlgId])">
			<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
				styleClass="warning" />
		</p:commandLink>
		<p:spacer width="2" />
		<ui:fragment rendered="#{!cc.attrs.supplier.disciplinaryActions}">
			<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.no']}" />
			<p:spacer width="4" />
			<ui:fragment rendered="#{true and not cc.attrs.showTooltip}">
				<p:commandLink onstart="blockWidget.show()"
					oncomplete="blockWidget.hide();suspendAlertWidget.show();"
					update="@([id$=suspendAlertWidgetId])">
					<p:graphicImage id="imageId"
						value="/css/images/design/icon_error.png" />
				</p:commandLink>
			</ui:fragment>
		</ui:fragment>
		<p:spacer width="2" />
		<ac:iconTooltip rendered="#{cc.attrs.showTooltip}"
			value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" />
		<ui:fragment rendered="#{(cc.attrs.index + cc.attrs.childIndex) == 0}">
			<ac:disciplinaryActionActiveQT
				voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}"
				btnView="true"
				startDate="#{viewSuppProfileBackingBean.managedBean.startDate}"
				endDate="#{viewSuppProfileBackingBean.managedBean.endDate}"
				isWarning="#{viewSuppProfileBackingBean.managedBean.warning}" />
			<p:dialog id="suspendAlertWidgetId" widgetVar="suspendAlertWidget"
				header="#{lbl['lbl.sc.qt.details']}" resizable="false" modal="true"
				dynamic="true">
				<p:outputPanel id="panelId">
					<h:graphicImage value="/css/images/design/icon_error.png" />
					<p:spacer width="4" />
					<p:outputLabel
						value="#{lbl['lbl.sc.disciplinary.company.acc.status']} #{viewSuppProfileBackingBean.evaluateSuspensionStatus(cc.attrs.supplier)}"
						escape="false" />
				</p:outputPanel>
			</p:dialog>
		</ui:fragment>
	</cc:implementation>
</ui:composition>
