<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="supplier"
			type="my.ep.persistence.entity.sm.SmSupplier" />
		<cc:attribute name="showTooltip" default="false" />
		<cc:attribute name="index" default="0" />
		<cc:attribute name="childIndex" default="0" />
		<cc:attribute name="prefix" default="" />
	</cc:interface>
	<cc:implementation>
		<table>
			<tr style="border: 0 !important;">
				<td style="width: 18px !important; border: 0 !important; padding: 0;"><p:commandLink onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						style="color:red; font-weight:bold;"
						rendered="#{cc.attrs.supplier.disciplinaryActions}"
						action="#{viewSuppProfileBackingBean.onViewActiveDisciplinaryAction(cc.attrs.supplier)}"
						update="@([id$=disciplinaryActionHistoryDlgId])">
						<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
							styleClass="warning" />
					</p:commandLink> <ui:fragment rendered="#{!cc.attrs.supplier.disciplinaryActions}">
						<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.no']}" />
					</ui:fragment></td>
				<td style="width: 18px !important; border: 0 !important; padding: 0; text-align: left;"><p:spacer width="4" /> <ui:param name="message"
						value="#{viewSuppProfileBackingBean.evaluateQTWarningMessage(cc.attrs.supplier)}" />
					<ui:fragment
						rendered="#{not empty message and not cc.attrs.showTooltip}">
						<p:commandLink onstart="blockWidget.show()"
							action="#{viewSuppProfileBackingBean.onViewQTAlertMessage(cc.attrs.supplier)}"
							oncomplete="blockWidget.hide();"
							update="@([id$=suspendAlertWidgetId])">
							<p:graphicImage id="imageId"
								value="/css/images/design/icon_error.png" style="margin-top: 4px;"/>
						</p:commandLink>
					</ui:fragment> <p:spacer width="2" /> <ac:iconTooltip
						rendered="#{cc.attrs.showTooltip}"
						value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" /></td>
<!-- 				<td style="width: 18px !important; border: 0 !important; padding: 0;"><h:outputText value="#{cc.attrs.supplier.companyName}" -->
<!-- 						styleClass="warning" /></td> -->
			</tr>
		</table>

		<ui:fragment rendered="#{(cc.attrs.index + cc.attrs.childIndex) == 0}">
			<style>
				[id*="disciplinaryActionHistoryDlgId"].ui-dialog {
					width: 1100px !important;
				}
				[id*="disciplinaryActionHistoryDlgId"].ui-dialog .ui-datatable {
				 	width: auto !important;
				}
			</style>
			<ac:disciplinaryActionHistory dynamic="true" 
				voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}"
				btnView="true" />
			<p:dialog id="suspendAlertWidgetId" widgetVar="suspendAlertWidget"
				header="#{lbl['lbl.sc.qt.details']}" resizable="false" modal="true"
				dynamic="true">
				<p:outputPanel id="panelId">
					<table style="border: none !important;">
						<tr>
							<td style="border: none !important;"><p:spacer width="2" /> <h:graphicImage
									value="/css/images/design/icon_error.png" /> <p:spacer
									width="2" /></td>
							<td style="border: none !important;"><p:outputLabel style="text-align: left;"
									value="#{viewSuppProfileBackingBean.managedBean.disciplinaryActionMsg}"
									escape="false" /></td>
						</tr>
					</table>
				</p:outputPanel>
			</p:dialog>
		</ui:fragment>
	</cc:implementation>
</ui:composition>
