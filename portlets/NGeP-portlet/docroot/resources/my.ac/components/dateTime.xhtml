<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface componentType="ac.DateTimeInput">
		<cc:attribute name="id" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="mindate" />
		<cc:attribute name="maxdate" />
		<cc:attribute name="label" />
		<cc:attribute name="size" />
		<cc:attribute name="postUpdateListener" />
		<cc:valueHolder name="calDate" />
		<cc:valueHolder name="calHour" />
		<cc:valueHolder name="calMin" />
		<cc:attribute name="rowIndex" default="0" />
		<cc:attribute name="update" />
		<cc:attribute name="modVal" default="15" />
	</cc:interface>

	<cc:implementation>
	<f:subview id="#{cc.id}sb">
	<h:panelGroup id="#{cc.attrs.id}">
		<p:calendar id="calDate"
			showOn="button" 
			size="7"
			required="#{cc.attrs.required}"
			disabled="#{cc.attrs.disabled}"
			readonlyInput="true" 
			mindate="#{cc.attrs.mindate}" 
			maxdate="#{cc.attrs.maxdate}" 
			label="#{cc.attrs.label}"
			pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
			<p:ajax event="dateSelect" partialSubmit="true" process="@this" update="@this" oncomplete="#{cc.id}#{cc.attrs.rowIndex}SetValue();" />
			
			<cc:insertChildren />
		</p:calendar>
		
		<h:selectOneMenu id="calHour" style="width: 62px;"
			disabled="#{cc.attrs.disabled}"
			required="#{cc.attrs.required}"
			label="#{cc.attrs.label} #{lbl['lbl.txt.hour']}">
			<f:selectItems value="#{dateTimeBackingBean.hoursDropdownValues}" />
			<p:ajax event="change" partialSubmit="true" process="@this" update="@this" oncomplete="#{cc.id}#{cc.attrs.rowIndex}SetValue();" />
		</h:selectOneMenu>
		<h:selectOneMenu id="calMin" style="width: 72px;"
			disabled="#{cc.attrs.disabled}"
			required="#{cc.attrs.required}"
			label="#{cc.attrs.label} #{lbl['lbl.txt.minute']}">
			<f:selectItems value="#{dateTimeBackingBean.getMinutesDropdownValues(cc.attrs.modVal)}" />
			<p:ajax event="change" partialSubmit="true" process="@this" update="@this" oncomplete="#{cc.id}#{cc.attrs.rowIndex}SetValue();" />
		</h:selectOneMenu>
		<p:message id="calDateMsg" for="calDate" display="icon" />
		
		<p:remoteCommand name="#{cc.id}#{cc.attrs.rowIndex}SetValue"
			partialSubmit="true" process="@this" 
			update="#{cc.id} #{cc.attrs.update}"
			action="#{dateTimeBackingBean.postUpdateListener(cc.attrs.postUpdateListener)}">
			<f:setPropertyActionListener target="#{cc.attrs.value}" value="#{dateTimeBackingBean.timeChangedAction(cc)}" />
		</p:remoteCommand>
	</h:panelGroup>
	</f:subview>
	</cc:implementation>
</ui:composition>
