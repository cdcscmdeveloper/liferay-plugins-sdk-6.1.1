<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="tableId" required="true" />
		<cc:attribute name="smApplSupportDocs" required="true" />
		<cc:attribute name="mandatory" default="false"/>
		<cc:attribute name="hasAI" default="false"/> <!-- #38890 -->
	</cc:interface>

	<cc:implementation>
		<p:dataTable var="suppDoc" value="#{cc.attrs.smApplSupportDocs}" id="#{cc.attrs.tableId}" 
			rowIndexVar="index" style="width:100% !important; table-layout: fixed !important;" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
					
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sm.mandatory.suppdoc']}" colspan="#{cc.attrs.hasAI ? 6 : 5}" rendered="#{cc.attrs.mandatory}"
						style="background-color:PeachPuff !important;text-align: center !important;color:black !important"/>
					<p:column headerText="#{lbl['lbl.sm.nonmandatory.suppdoc']}" colspan="5" rendered="#{!cc.attrs.mandatory}"
						style="background-color:PaleGreen !important;text-align: center !important;color:black !important"/>
                </p:row>
                <p:row>
                	<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" />
					<p:column headerText="#{lbl['lbl.sm.supportingdoc.docName']}" />
					<p:column headerText="#{lbl['lbl.sm.supportingdoc.file.name']}"
						rendered="#{sdoReviewBackingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE}" />
					<p:column headerText="AI" rendered="#{cc.attrs.hasAI}"/> <!-- #38890 -->
					<p:column headerText="#{lbl['lbl.sm.supportingdoc.isreceive']}" />
					<p:column headerText="#{lbl['lbl.sm.remark']}"/>
                </p:row>
			</p:columnGroup>
			
			<p:column style="width : 2%;">
				<p:outputLabel value="#{index + 1}"
					style="float: center;white-space: normal;" />
			</p:column>
			<!-- #11641 - START -->
			<p:column style="width:50% !important; white-space:normal;overflow: hidden !important;">  
	            <h:outputText value="#{suppDoc.pmDocument.docName}"  /> 
	        </p:column>
		
			<p:column style="width:18% !important;white-space:normal;overflow: hidden !important;"
				rendered="#{sdoReviewBackingBean.managedBean.smAppl.supportingDocMode eq SupplierManagementConst.SUPPORTING_DOC_ONLINE}">
				<!-- #11641 - END -->
				<!-- #28807 - Start -->
				<ui:repeat var="applDocs" value="#{suppDoc.smApplDocFiles}">
					<ui:remove>
						<p:commandLink value="#{applDocs.fileName}" rendered="#{not empty suppDoc.smApplDocFiles}"  ajax="false"
		            		action="#{sdoReviewBackingBean.downloadSuppDoc(applDocs.fileName,applDocs.filePath)}">
		           			<p:fileDownload value="#{sdoReviewBackingBean.file}" />
		        		</p:commandLink>
		        	</ui:remove>
		        	<h:panelGroup rendered="#{not empty suppDoc.smApplDocFiles}">
		        		<!-- #11641 -START reopen log #125-->
		        		<a href="#{DocumentRepositoryUtils.baseRepo}#{applDocs.filePath}#{applDocs.fileName}">#{sdoReviewBackingBean.getShortFileName(applDocs.fileName)}</a>
		        		<!-- #11641 - END reopen log #125-->
		        	</h:panelGroup>
					<br />
				</ui:repeat>
				<!-- #28807 - End -->		        
	        </p:column>
	        
	        <!-- #38890 -->
	        <p:column style="width:3% !important; white-space:normal;overflow: hidden !important; text-align:center;"
	        	rendered="#{cc.attrs.hasAI}">
	        	<ui:repeat var="applDocs" value="#{suppDoc.smApplDocFiles}">
					<p:outputPanel rendered="#{applDocs.validatedAI eq 1}">
						<p:graphicImage id="imgHasAI1" value="/css/images/ai/yes.png" />
						<p:tooltip for="imgHasAI1">
							<p:outputLabel escape="false" value="#{applDocs.mappedFieldAI}"/>
						</p:tooltip>
					</p:outputPanel>
					<p:outputPanel rendered="#{applDocs.validatedAI eq 2}">
						<p:graphicImage id="imgHasAI2" value="/css/images/ai/no.png" />
						<p:tooltip for="imgHasAI2">
							<p:outputLabel escape="false" value="#{applDocs.mappedFieldAI}"/>
						</p:tooltip>
					</p:outputPanel>
					<br/>
				</ui:repeat>
	        </p:column>
			
			<p:column style="width:3% !important; white-space:normal;overflow: hidden !important;" >
				<div align="center">
				<p:selectBooleanCheckbox value="#{suppDoc.received}" disabled="#{!sdoReviewBackingBean.managedBean.claimTask}">
					<!-- #11641 - START -->
					<p:ajax event="change" update=":form:btnInquiryId,:form:btnSubmitId" 
					listener="#{sdoReviewBackingBean.receiveStatusChange(suppDoc)}"/>
					<!-- #11641 - END -->
				</p:selectBooleanCheckbox>
				</div>
			</p:column>
			
			<!-- #11641 - START -->
			<p:column style="width:27% !important; white-space:normal;overflow: hidden !important;">
				<p:inputTextarea value="#{suppDoc.sdoRemarks}" id="docRemarkId" label="#{lbl['lbl.sm.remark']}" 
					autoResize="false" maxlength="100" style="width:97% !important" disabled="#{!sdoReviewBackingBean.managedBean.claimTask}">
					<p:ajax event="change" partialSubmit="true" process="@this" /> <!-- #3460 -->		
					<f:validateLength maximum="100" />
				</p:inputTextarea>
			</p:column>
			<!-- #11641 - END -->

		</p:dataTable>
		
	</cc:implementation>
</ui:component>
