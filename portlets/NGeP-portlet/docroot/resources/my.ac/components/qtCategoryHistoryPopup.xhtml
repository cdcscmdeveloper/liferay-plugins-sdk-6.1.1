<!-- #29732 Start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml" 
	xmlns:cc="http://java.sun.com/jsf/composite" 
	xmlns:ui="http://java.sun.com/jsf/facelets" 
	xmlns:h="http://java.sun.com/jsf/html" 
	xmlns:f="http://java.sun.com/jsf/core" 
	xmlns:p="http://primefaces.org/ui" 
	xmlns:c="http://java.sun.com/jsp/jstl/core" 
	xmlns:ac="http://ac.my/jsf/composite/cc"> 
	<cc:interface> 
		<cc:attribute name="catCode" /> 
		<cc:attribute name="historyList" type="java.util.List" />
		<cc:attribute name="widget" default="" /> 
	</cc:interface> 
	<cc:implementation> 
		<ui:param name="catCode" value="#{cc.attrs.catCode}" /> 
		<ui:param name="historyList" value="#{cc.attrs.historyList}" />
		<ui:param name="widget" value="#{cc.attrs.widget}" /> 
		<style> 
.dialogContainer {
	width: 70% !important;
}
 
.gridContainer {
	width: 100%;
}
 
.sp-centered {
	text-align: center;
	display: block;
}
</style>
		<p:dialog id="catCodePopup"
			header="#{lbl['lbl.sc.category.history.header']}" closable="true"
			widgetVar="#{widget}" modal="true" styleClass="dialogContainer"
			position="center" resizable="false">
			<h:panelGroup id="historyCategGroupId" layout="block">
				<table style="width: 60%;"> 
					<tr> 
						<td style="width: 20%;"><p:outputLabel style="float: left;"
								value="#{lbl['lbl.sc.category.history.catgory.code']}" /></td>
						<td><p:inputText value="#{catCode}" size="10" maxlength="2"
								disabled="true" /></td>
					</tr> 
				</table> 
				<h:panelGrid styleClass="gridContainer"> 
					<p:panel id="historyCategPanelId"> 
						<p:dataTable id="historyCategTableId" var="history" lazy="true"
							value="#{historyList}" rowIndexVar="index" rows="5"
							paginator="true" paginatorPosition="bottom"
							paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink}"
							sortBy="#{history.createdDate}" sortOrder="descending"
							emptyMessage="#{lbl['lbl.sc.category.history.datatable.msg.no.records.found']}">
							<p:column
								headerText="#{lbl['lbl.sc.category.history.datatable.action.date']}">
								<h:outputText value="#{history.createdDate}">
									<f:convertDateTime pattern="dd/MM/yyyy HH:mm:ss" /> 
								</h:outputText>
							</p:column> 
							<p:column
								headerText="#{lbl['lbl.sc.category.history.datatable.old.desc']}">
								<h:outputText value="#{history.oldDescription}" />
							</p:column> 
							<p:column
								headerText="#{lbl['lbl.sc.category.history.datatable.action.by']}"
								style="white-space: normal;"> 
								<h:outputText value="#{history.createdUsername}" />
							</p:column> 
							<p:column
								headerText="#{lbl['lbl.sc.category.history.datatable.remark']}">
								<h:outputText value="#{history.remark}" />
							</p:column> 
						</p:dataTable> 
					</p:panel> 
				</h:panelGrid> 
				<h:panelGrid style="float:right"> 
					<p:commandButton value="#{lbl['lbl.sc.category.history.close']}"
						immediate="true" oncomplete="#{widget}.hide()" />
				</h:panelGrid> 
			</h:panelGroup> 
		</p:dialog> 
	</cc:implementation> 
</ui:composition> 
<!-- #29732 End -->
