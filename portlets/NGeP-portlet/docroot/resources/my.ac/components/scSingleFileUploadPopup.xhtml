<ui:composition
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

<cc:interface>
	<cc:attribute name="widgetVar" required="true" />
	<cc:attribute name="readonly" default="false" />
	<cc:attribute name="update" default="@form" />
	<cc:attribute name="fileUploadListener" required="true" />
	<cc:attribute name="autoUpdateValue" />
</cc:interface>

<cc:implementation>
	<c:if test="#{!cc.attrs.readonly}">
		<p:dialog id="#{cc.attrs.widgetVar}Id" widgetVar="#{cc.attrs.widgetVar}" 
			modal="true" dynamic="true"
			resizable="false" width="700px" height="350px"
			styleClass="pop_up_top" 
			header="#{lbl['lbl.txt.choose.files']}">
			<p:messages id="#{cc.id}Msg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
			<p:ajax event="close" />
			<p:fileUpload id="#{cc.id}FU" style="display:inline;"
				fileUploadListener="#{scRemarkAndAttachmentBackingBean.handleFileUploadListener}"
				mode="advanced" 
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
				label="#{lbl['lbl.btn.choose']}" 
				showButtons="false"
				oncomplete="#{cc.attrs.widgetVar}postUploadActionIfSuccess();">
				<f:attribute name="widgetComponent" value="#{cc.attrs.widgetVar}" />
				<f:attribute name="fileUploadListenerMethod" value="#{cc.attrs.fileUploadListener}" />
			</p:fileUpload>
			<div class="ppRightBtn">
			    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="#{cc.attrs.widgetVar}.hide();" />
			</div>
		</p:dialog>
		
		<p:remoteCommand name="#{cc.attrs.widgetVar}postUploadActionIfSuccess"
			partialSubmit="true" process="@this" update="@this"
			action="#{scRemarkAndAttachmentBackingBean.postUploadActionIfSuccess(cc, cc.attrs.widgetVar)}" />
		
		<p:remoteCommand name="#{cc.attrs.widgetVar}reRender"
			partialSubmit="true" process="@this" update="#{cc.attrs.update}" />
			
		<p:dialog id="#{cc.attrs.widgetVar}delAttPopupId" widgetVar="#{cc.attrs.widgetVar}delAttPopup"
			header="#{lbl['lbl.sc.supporting.document']}" resizable="false"
			width="33%" height="100"
			closable="false" modal="true">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.ct.dialog.delete.attachment.msg']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				 <p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
					partialSubmit="true"
					action="#{cofirmationPopUpBackingBean.okAction('scRemarkAndAttachmentBackingBean.executeDeleteAttachmentAction')}"
					oncomplete="#{cc.attrs.widgetVar}delAttPopup.hide();" update="@this" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" immediate="true"
					oncomplete="#{cc.attrs.widgetVar}delAttPopup.hide();" />
			</div>
		</p:dialog>
	</c:if>
</cc:implementation>
</ui:composition>
