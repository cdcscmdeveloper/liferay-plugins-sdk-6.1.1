<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
<cc:attribute name="panelId" default="#{cc.id}" />
	<cc:attribute name="backingBean" required="true" />
	<cc:attribute name="smAddress" required="true" />
	<cc:attribute name="countryItems" required="true" />
	<cc:attribute name="stateItems" required="true" />
	<cc:attribute name="districtItems" required="true" />
	<cc:attribute name="cityItems" required="true" />
	<cc:attribute name="facilityPanel" required="true" />
</cc:interface>

<cc:implementation>
	
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.sm.facility.address.same.as']}" /></td>
		<td>
			<p:selectOneMenu id="sameAsAddrId"
				label="#{lbl['lbl.sm.facility.address.same.as']}"
				value="#{cc.attrs.backingBean.managedBean.facAddresSameAs}"
				style="width: 207px;margin-bottom: 5px;">
				<f:selectItems 
					value="#{cc.attrs.backingBean.managedBean.addrSameAsItems}" />
				<p:ajax event="change" process="@this"
					listener="#{cc.attrs.backingBean.onChangeFacAddrSameAs(cc.attrs.smAddress)}"
					update="addr1LabelId,addr1InputId,addr2InputId,addr3InputId,addr4InputId,
					countryLabelId,countryInputId,stateLabelId,stateInputId,districtLabelId,districtInputId,
					cityLabelId,cityInputId,postCodeLabelId,postCodeInputId" />
			</p:selectOneMenu>
			&#160; 
			<p:graphicImage id="sameAsAddrGraphicId"
				value="/css/images/design/tooltips.png" />
			<p:tooltip id="sameAsAddrToolId" for="sameAsAddrGraphicId">
				<p:outputLabel escape="false"
					value="#{lbl['tt.sm.facility.address.same.as']}" />
			</p:tooltip>
		</td>
	</tr>
	
	
	<tr>
		<td>
			<p:outputPanel id="addr1LabelId">
				<p:outputLabel value="#{lbl['lbl.sm.address']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
		<td>
			<p:outputPanel id="addr1InputId">
				<p:inputText maxlength="35" rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"
					required="#{cc.attrs.backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.address']}" id="addr1Id"
					value="#{cc.attrs.smAddress.address1}" size="35" /> 
				<p:message id="addr1IdMsg" for="addr1Id" showSummary="true" showDetail="false" 
					display="icon" rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}" />
				<p:inputText readonly="true" disabled="true" value="" size="35" 
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
	</tr>
	
	<tr>
		<td></td>
		<td>
			<p:outputPanel id="addr2InputId">
				<p:inputText maxlength="35" value="#{cc.attrs.smAddress.address2}" size="35" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:inputText readonly="true" disabled="true" value="" size="35" 
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
	</tr>
	<tr>
		<td></td>
		<td>
			<p:outputPanel id="addr3InputId">
				<p:inputText maxlength="35" value="#{cc.attrs.smAddress.address3}" size="35" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:inputText readonly="true" disabled="true" value="" size="35" 
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
	</tr>
	<tr>
		<td></td>
		<td>
			<p:outputPanel id="addr4InputId">
				<p:inputText maxlength="35" value="#{cc.attrs.smAddress.address4}" size="35" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:inputText readonly="true" disabled="true" value="" size="35" 
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
	</tr>
	<tr>
		<td>
			<p:outputPanel id="countryLabelId">
				<p:outputLabel value="#{lbl['lbl.sm.country']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
		<td>
			<p:outputPanel id="countryInputId">
				<p:selectOneMenu id="countryId"
					required="#{cc.attrs.backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.country']}"
					value="#{cc.attrs.smAddress.countryId}"
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"
					style="width: 207px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems 
						value="#{cc.attrs.countryItems}" />
					<p:ajax event="change" process="@this"
						listener="#{cc.attrs.backingBean.onChangeCountry(cc.attrs.smAddress,cc.attrs.facilityPanel)}"
						update="stateId,districtId,cityId,postCodeInputId" />
				</p:selectOneMenu> 
				<p:message id="countryIdMsg" for="countryId" showSummary="true" showDetail="false" display="icon" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:selectOneMenu disabled="true" value="" style="width: 207px;margin-bottom: 5px;"
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				</p:selectOneMenu>
			</p:outputPanel>
		</td>
	</tr>

	<tr>
		<td>
			<p:outputPanel id="stateLabelId">
				<p:outputLabel value="#{lbl['lbl.sm.state']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
		<td>
			<p:outputPanel id="stateInputId">
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					required="#{cc.attrs.backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.state']}"
					value="#{cc.attrs.smAddress.stateId}"
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"
					id="stateId">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems 
						value="#{cc.attrs.stateItems}" />
					<p:ajax event="change" process="@this"
						listener="#{cc.attrs.backingBean.onChangeState(cc.attrs.smAddress,cc.attrs.facilityPanel)}"
						update="districtId,cityId" />
	
				</p:selectOneMenu> 
				<p:message id="stateIdMsg" for="stateId" showSummary="true" showDetail="false" display="icon" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:selectOneMenu disabled="true" value="" style="width: 207px;margin-bottom: 5px;"
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				</p:selectOneMenu>
			</p:outputPanel>
		</td>
	</tr>

	<tr>
		<td>
			<p:outputPanel id="districtLabelId">
				<p:outputLabel value="#{lbl['lbl.sm.district']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
		<td>
			<p:outputPanel id="districtInputId">
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					id="districtId" required="#{cc.attrs.backingBean.managedBean.valueReqd}"
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"
					label="#{lbl['lbl.sm.district']}"
					value="#{cc.attrs.smAddress.districtId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems 
						value="#{cc.attrs.districtItems}" />
					<p:ajax event="change" process="@this"
						listener="#{cc.attrs.backingBean.onChangeDistrict(cc.attrs.smAddress,cc.attrs.facilityPanel)}"
						update="cityId" />
				</p:selectOneMenu> 
				<p:message id="districtIdMsg" for="districtId" showSummary="true" showDetail="false" display="icon" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:selectOneMenu disabled="true" value="" style="width: 207px;margin-bottom: 5px;"
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				</p:selectOneMenu>
			</p:outputPanel>
		</td>
	</tr>
	<tr>
		<td>
			<p:outputPanel id="cityLabelId">
				<p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
		<td>
			<p:outputPanel id="cityInputId">
				<p:selectOneMenu style="width: 207px;margin-bottom: 5px;"
					id="cityId" required="#{cc.attrs.backingBean.managedBean.valueReqd}"
					label="#{lbl['lbl.sm.towncity']}"
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"
					value="#{cc.attrs.smAddress.cityId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{cc.attrs.cityItems}" />
					<p:ajax event="change" process="@this"
						listener="#{cc.attrs.backingBean.onChangeCity(cc.attrs.smAddress,cc.attrs.facilityPanel)}"
						update="cityId" />
				</p:selectOneMenu> 
				<p:message id="cityIdMsg" for="cityId" showSummary="true" showDetail="false" display="icon" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
				<p:selectOneMenu disabled="true" value="" style="width: 207px;margin-bottom: 5px;"
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				</p:selectOneMenu>
			</p:outputPanel>
		</td>
	</tr>
	<tr>
		<td>
			<p:outputPanel id="postCodeLabelId">
				<p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
		<td>
			<p:outputPanel id="postCodeInputId">
				<p:outputPanel
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs and 
						cc.attrs.smAddress.countryId==cc.attrs.backingBean.managedBean.myCountryId}">
					<p:inputText maxlength="5"
						required="#{cc.attrs.backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.postcode']}" id="posCodeMyId"
						value="#{cc.attrs.smAddress.postcode}"
						validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
						size="35">
						<f:validator validatorId="postcodeValidator" />
					</p:inputText>
					<p:message id="posCodeMyIdMsg" for="posCodeMyId"
						showSummary="true" showDetail="false" display="icon" />
				</p:outputPanel>
				<p:outputPanel
					rendered="#{empty cc.attrs.backingBean.managedBean.facAddresSameAs and 
						cc.attrs.smAddress.countryId!=cc.attrs.backingBean.managedBean.myCountryId}">
					<p:inputText maxlength="10"
						required="#{cc.attrs.backingBean.managedBean.valueReqd}"
						label="#{lbl['lbl.sm.postcode']}" id="posCodeForeignId"
						value="#{cc.attrs.smAddress.postcode}"
						size="35">
					</p:inputText>
					<p:message id="posCodeForeignIdMsg"
						for="posCodeForeignId" showSummary="true"
						showDetail="false" display="icon" />
				</p:outputPanel>
				<p:inputText readonly="true" disabled="true" value="" size="35" 
					rendered="#{not empty cc.attrs.backingBean.managedBean.facAddresSameAs}"/>
			</p:outputPanel>
		</td>
	</tr>
</cc:implementation>
</ui:composition>
