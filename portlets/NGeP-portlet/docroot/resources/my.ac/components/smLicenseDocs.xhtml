<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="tableId" required="true" />
		<cc:attribute name="licenseInfoDocs" required="true" />
		<cc:attribute name="supportingDocMode" required="true"/>
		<cc:attribute name="mandatoryDocSize" required="true"/>
		<cc:attribute name="backingBean" required="true"/>
	</cc:interface>

	<cc:implementation>
		
		<div class="ui-datatable ui-widget" style="width:100% !important; table-layout: fixed !important;">
			<div class="ui-datatable-tablewrapper">
				<table role="grid">
					<thead>
						<tr>
							<th class="ui-state-default" role="columnheader" style="text-align: center !important;">
								<span><h:outputText value="#{lbl['lbl.sm.license.cert.info']}"/></span>
							</th>
						</tr>
					</thead>
				</table>
			</div>
		</div>
		
		<ui:repeat var="mainTable" value="#{cc.attrs.licenseInfoDocs}" varStatus="mainTableStatus">
			<p:dataTable var="table" id="#{cc.attrs.tableId}Sub" 
				value="#{mainTable.licenseSuppDocs}" rowIndexVar="index" 
				style="width:100% !important; table-layout: fixed !important;">
				
				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sm.category']} : #{backingBean.getLicenseConcatCategories(table.pmDocument.pmDocumentRestrs)}" 
							style="background-color:lightblue !important;text-align: left !important;color:black !important" colspan="2"/>
	                </p:row>
				</p:columnGroup>
	
				<p:column style="width : 5% !important;text-align: center !important;">
					<h:outputText value="#{index + cc.attrs.mandatoryDocSize + 1}" />
				</p:column>
	
				<p:column style="width : 95% !important;">
				
					<h:outputText value="#{table.pmDocument.docName}" style="float: left;white-space: normal;" />
						
					<br /><br />
					<table width="60%">
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.no']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:inputText value="#{table.licenseNo}" size="20" id="licenseNoId" required="#{table.pmDocument.mandatory}" 
									label="#{lbl['lbl.sm.suppdoc.license.no']}" >
									<p:ajax process="@this" partialSubmit="true"/>
								</p:inputText>
								<p:message id="licenseNoIdMsg" for="licenseNoId" showSummary="true" showDetail="false" display="icon" />
							</td>
							<td colspan="2" style="border-style: none !important;"></td>
						</tr>
						<tr>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.effdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseEffDateId"
									navigator="true" required="#{table.pmDocument.mandatory}" 
									label="#{lbl['lbl.sm.suppdoc.license.effdate']}"
									value="#{table.licenseEffDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+0" >
									<p:ajax event="dateSelect" update="licenseExpDateId" process="@this"/>
								</p:calendar>
								<p:message id="licenseEffDateIdMsg"
									for="licenseEffDateId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
							<td style="border-style: none !important;">
								<p:outputLabel value="#{lbl['lbl.sm.suppdoc.license.expdate']}" />
								<p:outputLabel value="*" styleClass="mandatory" rendered="#{table.pmDocument.mandatory}"/>
							</td>
							<td style="border-style: none !important;">
								<p:calendar id="licenseExpDateId" disabled="#{empty table.licenseEffDate}"
									navigator="true" required="#{table.pmDocument.mandatory}"
									label="#{lbl['lbl.sm.suppdoc.license.expdate']}"
									value="#{table.licenseExpDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" display="inline"
									readonlyInput="true" size="10" showOn="button" yearRange="-99:+10" 
									mindate="#{table.licenseEffDate}">
									<p:ajax event="dateSelect" process="@this"/>
								</p:calendar>
								<p:message id="licenseExpDateIdMsg"
									for="licenseExpDateId" showSummary="true" showDetail="false"
									display="icon" />
							</td>
						</tr>
					</table>
					
				</p:column>
			</p:dataTable>
		</ui:repeat>
		
		
		<br />
	</cc:implementation>
</ui:component>
