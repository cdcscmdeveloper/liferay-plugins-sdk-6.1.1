<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="beforeSignText" />
		<cc:attribute name="postSignAction"
			method-signature="void action(my.ep.persistence.entity.pm.common.PmDigiSign)" />
		<cc:attribute name="enableAutoUpdate" required="false"
			method-signature="void action()" />
	</cc:interface>


	<cc:implementation>
	<script>
		var runGPKIEnableAutoUpdate = true;
		function setRunGPKIEnableAutoUpdate(runGPKIEnableAutoUpdate) {
		  this.runGPKIEnableAutoUpdate = runGPKIEnableAutoUpdate;
		}

		function isRunGPKIEnableAutoUpdate() {
		  return this.runGPKIEnableAutoUpdate;
		}
		
		
	</script>
		<!-- #35488 -->
		<p:remoteCommand name="errorAction"
			action="#{gpkiBackingBean.showError}" />
		<p:remoteCommand name="postSignOTP"
			action="#{gpkiBackingBean.postSignActionOTP(cc.attrs.postSignAction, cc.attrs.enableAutoUpdate)}" />
		<h:inputHidden id="inputTextBeforeSign" binding="#{textBeforeSign}"
			value="#{cc.attrs.textBeforeSign}" />
			
		<c:if test="#{!gpkiBackingBean.isGpkiNewRoaming()}" >
			<ui:include src="gpkiPopupV1.xhtml"/>
		</c:if>
		<c:if test="#{gpkiBackingBean.isGpkiNewRoaming()}" >
			<ui:include src="gpkiPopupV2.xhtml"/>
		</c:if>
	</cc:implementation>
</ui:composition>
