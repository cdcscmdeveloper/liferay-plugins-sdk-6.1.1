<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="beforeSignText" />
		<cc:attribute name="postSignAction"
			method-signature="void action(my.ep.persistence.entity.pm.common.PmDigiSign)" />
	</cc:interface>


	<cc:implementation>
		<p:remoteCommand name="postSignAction"
			action="#{gpkiBackingBean.gpkiSignAction(cc.attrs.postSignAction)}" />
		<p:remoteCommand name="errorAction"
			action="#{gpkiBackingBean.showError}" />
		<h:inputHidden id="inputTextBeforeSign" binding="#{textBeforeSign}"
			value="#{cc.attrs.textBeforeSign}" />
		<h:outputScript library="ep/gpki_js" name="gpki-api.js" />

		<script>
			function DigiSign() {
				var textBeforeSign = $("[id='#{textBeforeSign.clientId}']")
						.val();
				var plainText = encodeURIComponent(Aegis.hash(textBeforeSign));
				var pin = $("[id='#{pin.clientId}']").val();
			    sign_st(pin, plainText);
			
			}
			function parseVerifyResult(msg) {
				$(document).ready(
						function() {
							var obj = jQuery.parseJSON(msg);
							var statusCode = obj.status_code;
							var statusMsg = obj.status_message;
							//         		$("#gpki-data").html(statusMsg);

							if (statusCode == "0") {
								var serialNo = obj.serial_no;
								var validity = obj.cert_validity;
								var subjectDn = obj.subject_dn;
								gpki_dlg.hide();
								msg = "This signature is *VALID*" + "\n"
										+ "serialNo = " + serialNo + "\n"
										+ "validity = " + validity + "\n"
										+ "subjectDn = " + subjectDn;
// 								Aegis.alert(msg);
							} else {
								Aegis.alert("This signature is *INVALID* :"
										+ statusMsg);
							}

						});
			}

			function parseSignResult(msg) {
				$(document)
						.ready(
								function() {
									var obj = jQuery.parseJSON(msg);
									var statusCode = obj.status_code;
									var statusMsg = obj.status_message;
									var startDate = obj.start_date;
									var endDate = obj.end_date;
									var subjectDN = obj.subject_dn;
									var serialNo = obj.serial_no;
									var ic = obj.ic_no;
									var signedData = encodeURIComponent(obj.signed_data);
									if (statusCode == "0") {
										
										var textBeforeSign = $("[id='#{textBeforeSign.clientId}']")
												.val();
										var originalText = encodeURIComponent(Aegis
												.hash(textBeforeSign));
										var signedText = encodeURIComponent(signedData);
										var serialNo = obj.serial_no;
										verify(originalText, signedText);
// 										Aegis.alert(signedText);

// 										Aegis.alert(signedData);

										postSignAction([ {
											name : 'textBeforeSign',
											value : textBeforeSign
										}, {
											name : 'signedText',
											value : signedText
										}, {
											name : 'serialNo',
											value : serialNo
										} ]);


										/* put your logic to handle the result here */
// 									} else if (statusCode == "50") {
// 										Aegis.alert("Wrong PIN");
// 									} else if (statusCode == "40") {
// 										Aegis.alert("CERT_EXPIRED");
// 									} else if (statusCode == "41") {
// 										Aegis.alert("CERT_REVOKED");
// 									} else if (statusCode == "43") {
// 										Aegis.alert("CERT_NOT_YET_VALID");
									} else {
										errorAction([ {
											name : 'statusCode',
											value : statusCode
										}, {
											name : 'statusMsg',
											value : statusMsg
										} ]);
									}
								});
			}
		</script>

		<p:dialog header="Digital Certificate Signing" widgetVar="gpki_dlg" resizable="false" modal="true">
			<p:messages id="dlgMessages" for="somekey" showDetail="true" autoUpdate="true" closable="true" />
			<h:panelGrid columns="4" cellpadding="4">
				<h:outputLabel value="*" styleClass="mandatory" />
				<h:outputLabel for="password" value="Digital Certificate PIN" />
				<p:password binding="#{pin}" id="password" />
				<p:commandButton value="Sign" oncomplete="DigiSign();return false;" />
			</h:panelGrid>
		</p:dialog>
	</cc:implementation>
</ui:composition>
