<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="beforeSignText" />
		<cc:attribute name="postSignAction"
			method-signature="void action(my.ep.persistence.entity.pm.common.PmDigiSign)" />
		<cc:attribute name="postCancelAction" method-signature="void action()"
			required="false" />
		<cc:attribute name="enableAutoUpdate" required="false"
			method-signature="void action()" />
	</cc:interface>


	<cc:implementation>
		<p:remoteCommand name="postSignAction"
			action="#{gpkiBackingBean.gpkiSignAction(cc.attrs.postSignAction)}" />
		<p:remoteCommand name="errorAction"
			action="#{gpkiBackingBean.showError}" />
		<h:inputHidden id="inputTextBeforeSign" binding="#{textBeforeSign}"
			value="#{cc.attrs.textBeforeSign}" />
		<c:choose>
			<c:when test="#{not empty cc.getValueExpression('enableAutoUpdate')}">
				<p:remoteCommand name="autoUpdateAction"
					action="#{cc.attrs.enableAutoUpdate}" />
			</c:when>
			<c:otherwise>
				<p:remoteCommand name="autoUpdateAction" />
			</c:otherwise>
		</c:choose>
		<h:outputScript library="ep/gpki_js" name="gpki-api.js" />

		<script>
			function DigiSign() {
				gpkiBlockWidget.show();
				var textBeforeSign = $("[id='#{textBeforeSign.clientId}']")
						.val();
				var plainText = encodeURIComponent(Aegis.hash(textBeforeSign));
				var pin = $("[id='#{pin.clientId}']").val();

				sign_st(pin, plainText);

			}
			function parseVerifyResult(msg) {
				$(document).ready(
						function() {
							var obj = jQuery.parseJSON(msg);
							var statusCode = obj.status_code;
							var statusMsg = obj.status_message;
							//         		$("#gpki-data").html(statusMsg);
							if (statusCode == "0") {
								var serialNo = obj.serial_no;
								var validity = obj.cert_validity;
								var subjectDn = obj.subject_dn;

								msg = "This signature is *VALID*" + "\n"
										+ "serialNo = " + serialNo + "\n"
										+ "validity = " + validity + "\n"
										+ "subjectDn = " + subjectDn;
								// 								Aegis.alert(msg);
							} else {
								Aegis.alert("This signature is *INVALID* :"
										+ statusMsg);
							}

						});

			}

			function parseSignResult(msg) {
				$(document)

									var statusCode = obj.status_code;
									var statusMsg = obj.status_message;
									var startDate = obj.start_date;
									var endDate = obj.end_date;
									var subjectDN = obj.subject_dn;
									var serialNo = obj.serial_no;
									var ic = obj.ic_no;
									var signedText = encodeURIComponent(obj.signed_data);
									if (statusCode == "0") {

										var textBeforeSign = $(
												"[id='#{textBeforeSign.clientId}']")
												.val();
										var originalText = encodeURIComponent(Aegis
												.hash(textBeforeSign));
										//var signedText = encodeURIComponent(signedData);
										//verify(originalText, signedText);
										// 										Aegis.alert(signedText);

										// 										Aegis.alert(signedData);
										autoUpdateAction();
										postSignAction([ {
											name : 'textBeforeSign',
											value : textBeforeSign
										}, {
											name : 'signedText',
											value : signedText
										}, {
											name : 'serialNo',
											value : serialNo
										}, {
											name : 'subjectDN',
											value : subjectDN
										} ]);
										//gpkiBlockWidget.hide();
										//blockWidget.show();
										/* put your logic to handle the result here */
										// 									} else if (statusCode == "50") {
										// 										Aegis.alert("Wrong PIN");
										// 									} else if (statusCode == "40") {
										// 										Aegis.alert("CERT_EXPIRED");
										// 									} else if (statusCode == "41") {
										// 										Aegis.alert("CERT_REVOKED");
										// 									} else if (statusCode == "43") {
										// 										Aegis.alert("CERT_NOT_YET_VALID");
									} else {
										errorAction([ {
											name : 'statusCode',
											value : statusCode
										}, {
											name : 'statusMsg',
											value : statusMsg
										} ]);
										gpkiBlockWidget.hide();
									}
								});
			}
		</script>

	<p:dialog header="#{lbl['lbl.cc.gpki.title']}" widgetVar="gpki_dlg"
			resizable="false" modal="true">
		<p:blockUI block="gpkiPopup" widgetVar="gpkiBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>

		<p:panel id="gpkiPopup" >
			<p:messages id="dlgMessages" for="gpki" showDetail="true"
				autoUpdate="true" closable="true" />
<!-- 			<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5"> -->
<!-- 				<p:outputLabel value="#{lbl['lbl.cc.gpki.signmethod']}" /> -->
<!-- 				<p:selectOneRadio binding="#{SignMethod}" id="SignMethod" value="Token"> -->
<!-- 					<f:selectItem id="r1" binding="#{r1}" itemLabel="Token" itemValue="Token"  /> -->
<!-- 					<f:selectItem id="r2" itemLabel="Smart Card" itemValue="Smart Card" /> -->
<!-- 				</p:selectOneRadio> -->
<!-- 			</h:panelGrid> -->
			<h:panelGrid columns="4" cellpadding="4">
				<h:outputLabel value="*" styleClass="mandatory" />
				<h:outputLabel for="password" value="#{lbl['lbl.cc.gpki.pin']}" />
				<p:password binding="#{pin}" id="password" />
				<p:commandButton id="signButtonId" value="Sign" onstart="DigiSign();" />
				
			</h:panelGrid>
			<c:if test="#{not empty cc.getValueExpression('postCancelAction')} ">
				<p:ajax event="close" listener="#{cc.attrs.postCancelAction}" />
			</c:if>
		</p:panel>
	</p:dialog>
	</cc:implementation>
</ui:composition>
