<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
	</cc:interface>

	<cc:implementation>
		<!-- #37874 -->
		<script>
		function fixCatcodeMenu(){
			var panels = document.getElementsByClassName('ui-selectonemenu-panel');
			if (!panels || panels.length === 0) { return; }
			
			for (var i = 0; i &lt; panels.length; i++) {
				var panel = panels[i];
				// Check for all category code menu
		        if (!panel || !panel.id || panel.id.indexOf('catCodeLvl') === -1) continue;
				if (!panel.style || panel.style.display === 'none') continue;
				
				var left = parseInt(panel.style.left);
				if (isNaN(left)) continue;
				
				
				var windowWidth = window.innerWidth || document.documentElement.clientWidth;
				var panelRight = panel.getBoundingClientRect().right;
				var diff = panelRight - windowWidth;
					
				if (diff &gt; 0) {
					left = left - diff - 5;
					panel.style.left = left + 'px';
				}
				
				if (left &gt;= 0) continue;
				panel.style.left = '3px';
	  		}
		}
		
		jQuery(document).ready(function() {
			jQuery(document).on('mousedown', '.ui-selectonemenu', function() {
				setTimeout(fixCatcodeMenu, 200);
			});
		});
		</script>
		<p:dataTable var="cat" widgetVar="category"
			selection="#{cc.attrs.bBean.managedBean.selectedCategoryLs}"
			value="#{cc.attrs.bBean.managedBean.categoryLs}" rows="10"
			rowKey="#{cat}" rowIndexVar="index"
			id="categoryDtTbl">
			
			<ac:paginator for="categoryDtTbl" />
			
			<p:column style="width:2%" selectionMode="multiple" />
			
			<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
				<h:outputText value="*" styleClass="mandatory" rendered="#{!empty param['disableValidation']}"/>
				<p:selectOneMenu required="#{!empty param['disableValidation']}" label="#{lbl['lbl.sm.projDtls.mainCat']}" 
					id="catCodeLvl1" value="#{cat.catLvl1}"
					style="width: 460px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems value="#{cc.attrs.bBean.retrieveL1CategoryLs()}" var="catL1"
						itemLabel="#{catL1.categoryL1Code} - #{catL1.categoryName}"
						itemValue="#{catL1.categoryL1Id}" />
					<p:ajax event="change" process="@this" update="catCodeLvl2,catCodeLvl3" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
				<p:selectOneMenu required="false" label="#{lbl['lbl.sm.projDtls.mainCat']}" 
					id="catCodeLvl2" value="#{cat.catLvl2}"
					style="width: 460px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems value="#{cc.attrs.bBean.retrieveL2CategoryLs(cat.catLvl1)}" var="catL2"
						itemLabel="#{catL2.categoryL2Code} - #{catL2.categoryName}"
						itemValue="#{catL2.categoryL2Id}" />
					<p:ajax event="change" process="@this" update="catCodeLvl3" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
				<p:selectOneMenu required="false" label="#{lbl['lbl.sm.projDtls.mainCat']}" 
					id="catCodeLvl3" value="#{cat.catLvl3}"
					style="width: 460px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems value="#{cc.attrs.bBean.retrieveL3CategoryLs(cat.catLvl2)}" var="catL3"
						itemLabel="#{catL3.categoryL3Code} - #{catL3.categoryName}"
						itemValue="#{catL3.categoryL3Id}" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>
		<br />
		<div style="float: right;">
			<table style="width: 100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.btn.add']}"
							action="#{cc.attrs.bBean.addCategory}" update="categoryDtTbl">
							<f:param name="disableValidation" value="true" />
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.delete']}"
							action="#{cc.attrs.bBean.removeCategory}" update="categoryDtTbl">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</cc:implementation>
</ui:composition>
