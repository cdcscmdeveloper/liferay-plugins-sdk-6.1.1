
<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="lovId" required="true" />
	<cc:attribute name="value" type="java.lang.String" />
	<cc:attribute name="disabled" default="false" />
	<cc:attribute name="required" default="false" />
	<cc:attribute name="readonly" default="false" />
	<cc:attribute name="label" />
	<cc:attribute name="saveObject" required="true" />
	<cc:attribute name="headerText" />
	<cc:attribute name="conditionField" default="" />
	<cc:attribute name="update" default="" />
	<cc:attribute name="rows" />
	<cc:attribute name="cols" />
	<cc:attribute name="postUpdateListener" default="" />
	<cc:attribute name="postUpdateListenerWithIndex" default="" />
	<cc:attribute name="selectionMode" default="single" />
	<cc:attribute name="uiMode" default="" />
	<cc:attribute name="buttonLabel" default="" />
	<cc:attribute name="buttonIcon" default="ui-icon-lov" />
	<cc:attribute name="tooltip" default="" />
	<cc:attribute name="autoUpdateValue" default="" />
	<cc:attribute name="displayResultWhenFirstLoad" default="true" />
	<cc:attribute name="displayResultWhenReset" default="true" />
	<cc:actionSource name="actionEvent" targets="#{cc.attrs.id}#{cc.attrs.selectionMode eq 'multiple' ? 'lovBtn' : (cc.attrs.uiMode eq 'button' ? 'lovSingleBtn' : 'lovLink')}" />
	<cc:attribute name="autoResize" default="false"/>
	<cc:attribute name="maxlength"/>
	<cc:attribute name="flagBean" required="true" default="" />
	

</cc:interface>

<cc:implementation>
		<p:blockUI block=":form" widgetVar="lovItemReportPopup">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
<h:panelGroup id="#{cc.attrs.id}">

		<!-- #29521 - start -->
	
		<h:panelGroup id="mMode" rendered="#{cc.attrs.selectionMode eq 'multiple' and cc.attrs.uiMode ne 'button' and cc.attrs.uiMode ne 'link'}">
			<p:inputTextarea id="#{cc.attrs.id}lov" 
				value="#{cc.attrs.value}"
				readonly="#{cc.attrs.readonly}"
				disabled="#{cc.attrs.disabled}"
				required="#{cc.attrs.required}"
				label="#{cc.attrs.label}"
				rows="#{cc.attrs.rows}" cols="#{cc.attrs.cols}"
				autoResize="#{cc.attrs.autoResize}"
				maxlength="#{cc.attrs.maxlength}"
				style="padding-right:120px;">
				
				<!-- <f:valueChangeListener type="my.ep.web.backingbean.components.lov.PopulateObjectListener" /> -->
				<!--   <f:ajax event="change" execute="@this" render=":form:ctReportItemName:ctReportItemNamelov" /> -->
				 
				<f:attribute name="conditionField" 	value="#{cc.attrs.conditionField}" />
				<f:attribute name="lovId" 			value="#{cc.attrs.lovId}" />
				<f:attribute name="saveObject" 		value="#{cc.attrs.saveObject}" />
				<f:attribute name="lovBB" 			value="#{lovBackingBean}" />
			</p:inputTextarea>
	</h:panelGroup>
	&#160;
	<h:panelGroup id="linkpgMultiple" rendered="#{cc.attrs.selectionMode eq 'multiple' and cc.attrs.uiMode ne 'button'}">
		<p:commandLink
			id="#{cc.attrs.id}lovLink"
			action="#{lovBackingBean.initLov}"
			oncomplete="if (!args.lovValidationError) { updateSearchDialog(); lovItemReportPopup.show(); }"
			disabled="#{cc.attrs.disabled}"
			readonly="#{cc.attrs.readonly}"
			partialSubmit="true"
			process="@this"
			flagBean="#{cc.attrs.flagBean}">
					
			<f:param name="lovId" 			value="#{cc.attrs.lovId}" />
			<f:param name="componentId" 	value="#{cc.attrs.id}" />
			<f:param name="headerText" 		value="#{cc.attrs.headerText}" />
			<f:param name="saveObject" 		value="#{cc.attrs.saveObject}" />
			<f:param name="conditionField" 	value="#{cc.attrs.conditionField}" />
			<f:param name="clientId" 		value="#{p:component(cc.attrs.id)}" />
			<f:param name="update" 			value="#{cc.attrs.update}" />
			<f:param name="selectionMode" 	value="#{cc.attrs.selectionMode}" />
			<f:param name="postUpdateListener" value="#{cc.attrs.postUpdateListener}" />
			<f:param name="postUpdateListenerWithIndex" value="#{cc.attrs.postUpdateListenerWithIndex}" />
			<f:param name="autoUpdateValue" value="#{cc.attrs.autoUpdateValue}" />
			<f:param name="displayResultWhenFirstLoad" value="#{cc.attrs.displayResultWhenFirstLoad}" />
			<f:param name="displayResultWhenReset" value="#{cc.attrs.displayResultWhenReset}" />
			<f:param name="flagBean" 			value="#{cc.attrs.flagBean}" />
			<cc:insertChildren />
			
			<p:graphicImage value="/css/images/design/search.png" style="background:transparent;"></p:graphicImage>
					
		</p:commandLink>
	</h:panelGroup>
	
	</h:panelGroup>
	
	
</cc:implementation>
	
	<!-- #29521 - end -->
	</ui:component>
