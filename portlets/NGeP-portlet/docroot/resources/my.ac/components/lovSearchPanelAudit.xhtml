    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui">
   	
	<h:panelGrid columns="2" id="lovCriteria" cellpadding="0" cellspacing="0">
		<p:selectOneMenu value="#{lovAuditBackingBean.lovSearchBean.dataFilterBeans[0].searchField}">
			<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />

		<p:inputText value="#{lovAuditBackingBean.lovSearchBean.dataFilterBeans[0].searchValue}" style="margin-bottom: 5px;" onkeypress="if (event.keyCode == 13) { lovSearch.jq.click(); return false; }" autocomplete="off"/>
	</h:panelGrid>
