<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="showTick" default="false"/>
		<cc:attribute name="tickLabel" default=""/>
		<cc:attribute name="addrSameAsObj" />
		<cc:attribute name="addrObj" required="true" />
		<cc:attribute name="latestAddrObj" required="true" />
		<cc:attribute name="addressTitle" required="true" />
		<cc:attribute name="addrPanelId" required="true"/>
		<cc:attribute name="addrId" required="true"/>
		<cc:attribute name="countryId" required="true"/>
		<cc:attribute name="stateId" required="true"/>
		<cc:attribute name="districtId" required="true"/>
		<cc:attribute name="divisionId" required="true"/>
		<cc:attribute name="cityId" required="true"/>
		<cc:attribute name="postCodeId" required="true"/>
		<cc:attribute name="addressType" required="true"/>
		<cc:attribute name="stateItems" required="true"/>
		<cc:attribute name="districtItems" required="true"/>
		<cc:attribute name="cityItems" required="true"/>
	</cc:interface>

	<cc:implementation>
		
		
		<table style="width: 100%">
			<tr><td colspan="2"><u><b><h:outputText value="#{cc.attrs.addressTitle}" /></b></u></td></tr>
			<tr>
				<td></td>
				<td style="float: left;">
					<p:selectBooleanCheckbox rendered="#{cc.attrs.showTick}"
						value="#{cc.attrs.addrObj.sameAsPerm}"
						disabled="#{cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.addressSsmNull)}"
						>
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{cc.attrs.bBean.onTickSameAsAddress(cc.attrs.addrSameAsObj,cc.attrs.addrObj)}"
							update=":#{p:component(cc.attrs.addrPanelId)}" onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()"/>
					</p:selectBooleanCheckbox>
					<p:outputPanel rendered="#{!cc.attrs.showTick}"><p:selectBooleanCheckbox style="display:none"/>&#160;&#160;</p:outputPanel>
					<b><h:outputText value="#{cc.attrs.tickLabel}" /></b>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.address']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
						
				<td><p:inputText id="#{cc.attrs.addrId}" maxlength="100"
						label="#{cc.attrs.addressTitle} - #{lbl['lbl.sm.address']}"
						required="#{!cc.attrs.addrObj.sameAsPerm}"
						readonly="#{cc.attrs.addrObj.sameAsPerm}"
						disabled="#{cc.attrs.addrObj.sameAsPerm || cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.addressSsmNull)}"
						value="#{cc.attrs.addrObj.smAddress.address1}"
						size="35">
						<p:ajax process="@this" partialSubmit="true"
							update="@this,#{cc.attrs.addrId}Msg" />
					</p:inputText> 
					<ac:smFieldChangeAlert 
						isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
							and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
						oriValue="#{cc.attrs.latestAddrObj.smAddress.address1}" 
						currValue="#{cc.attrs.addrObj.smAddress.address1}" 
						alertValue="#{cc.attrs.latestAddrObj.smAddress.address1}"/>
					<p:message id="#{cc.attrs.addrId}Msg"
						for="#{cc.attrs.addrId}" showSummary="true"
						showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td></td>
					<td><p:inputText maxlength="100"
							readonly="#{cc.attrs.addrObj.sameAsPerm}"
							disabled="#{cc.attrs.addrObj.sameAsPerm || cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.addressSsmNull)}"
							value="#{cc.attrs.addrObj.smAddress.address2}"
							
							size="35">
							<p:ajax process="@this" partialSubmit="true" update="@this" />
						</p:inputText>
						<ac:smFieldChangeAlert 
							isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
								and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
							oriValue="#{cc.attrs.latestAddrObj.smAddress.address2}" 
							currValue="#{cc.attrs.addrObj.smAddress.address2}" 
							alertValue="#{cc.attrs.latestAddrObj.smAddress.address2}"/>
					</td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="100"
							readonly="#{cc.attrs.addrObj.sameAsPerm}"
							disabled="#{cc.attrs.addrObj.sameAsPerm || cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.addressSsmNull)}"
							value="#{cc.attrs.addrObj.smAddress.address3}"
							size="35">
							<p:ajax process="@this" partialSubmit="true" update="@this" />
						</p:inputText>
						<ac:smFieldChangeAlert 
							isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
								and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
							oriValue="#{cc.attrs.latestAddrObj.smAddress.address3}" 
							currValue="#{cc.attrs.addrObj.smAddress.address3}" 
							alertValue="#{cc.attrs.latestAddrObj.smAddress.address3}"/>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.country']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							label="#{cc.attrs.addressTitle} - #{lbl['lbl.sm.country']}"
							required="#{!cc.attrs.addrObj.sameAsPerm}"
							id="#{cc.attrs.countryId}"
							disabled="#{cc.attrs.addrObj.sameAsPerm || cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.countrySsmNull)}"
							value="#{cc.attrs.addrObj.smAddress.countryId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="" />
							<f:selectItems value="#{cc.attrs.bBean.managedBean.countryItems}" />
							<p:ajax event="change" process="@this"
								listener="#{cc.attrs.bBean.onChangeCountry(cc.attrs.addrObj.smAddress,cc.attrs.addressType)}"
								update="#{cc.attrs.stateId},#{cc.attrs.divisionId},#{cc.attrs.districtId},#{cc.attrs.cityId},:#{p:component(cc.attrs.addrPanelId)}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
								and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
							oriValue="#{cc.attrs.latestAddrObj.smAddress.pmCountry.countryId}" 
							currValue="#{cc.attrs.addrObj.smAddress.pmCountry.countryId}" 
							alertValue="#{cc.attrs.bBean.getCountryLabelById(cc.attrs.latestAddrObj.smAddress.pmCountry.countryId)}"/>
						<p:message id="#{cc.attrs.countryId}Msg" for="#{cc.attrs.countryId}"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							label="#{cc.attrs.addressTitle} - #{lbl['lbl.sm.state']}"
							disabled="#{cc.attrs.addrObj.sameAsPerm || cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.stateSsmNull)}"
							required="#{!cc.attrs.addrObj.sameAsPerm}"
							style="width: 207px;margin-bottom: 5px;"
							value="#{cc.attrs.addrObj.smAddress.stateId}"
							id="#{cc.attrs.stateId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="" />
							<f:selectItems value="#{cc.attrs.stateItems}" />
							<p:ajax event="change" process="@this"
								listener="#{cc.attrs.bBean.onChangeState(cc.attrs.addrObj.smAddress,cc.attrs.addressType)}"
								update="divisionSharLabelPanelId,divisionSharDropdownPanelId,#{cc.attrs.districtId},#{cc.attrs.cityId}" />

						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
								and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
							oriValue="#{cc.attrs.latestAddrObj.smAddress.pmState.stateId}" 
							currValue="#{cc.attrs.addrObj.smAddress.pmState.stateId}" 
							alertValue="#{cc.attrs.bBean.getStateLabelById(cc.attrs.latestAddrObj.smAddress.pmState.stateId)}"/>
						<p:message id="#{cc.attrs.stateId}Msg" for="#{cc.attrs.stateId}"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<!-- 13320-AddressInfo -->
				
					<tr>
					<td  class="tdTitle">
				<p:outputPanel id="divisionSharLabelPanelId" >
					<ui:fragment rendered="#{cc.attrs.addrObj.smAddress.pmState.adoptDivision}">
						<p:outputLabel value="#{lbl['lbl.sm.division']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
						</ui:fragment>
					</p:outputPanel>
					</td>
					<td>
					<p:outputPanel id="divisionSharDropdownPanelId">
				<ui:fragment rendered="#{cc.attrs.addrObj.smAddress.pmState.adoptDivision}">
					<p:selectOneMenu
							label="#{cc.attrs.addressTitle} - #{lbl['lbl.sm.division']}"
							disabled="#{cc.attrs.addrObj.sameAsPerm}"
							required="#{!cc.attrs.addrObj.sameAsPerm}"
							style="width: 207px;margin-bottom: 5px;" id="#{cc.attrs.divisionId}"
							value="#{cc.attrs.addrObj.smAddress.divisionId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="" />
							<f:selectItems value="#{cc.attrs.divisionItems}" />
							<p:ajax event="change" process="@this"
							 listener="#{cc.attrs.bBean.onChangeDistrictByDivision(cc.attrs.addrObj.smAddress,cc.attrs.addressType)}"
								update="#{cc.attrs.districtId},#{cc.attrs.cityId}" />
						</p:selectOneMenu> 
					</ui:fragment>
					</p:outputPanel></td>
					
				</tr>

				<tr>
					<!-- #32014 - START -->
					<p:outputPanel rendered="#{cc.attrs.addrObj.addressType eq 'R' and cc.attrs.addrObj.smAddress.pmState.stateCode != null and cc.attrs.bBean.managedBean.supplierUser}">
				 		#{cc.attrs.bBean.onChangeState(cc.attrs.addrObj.smAddress,cc.attrs.addressType)}
					</p:outputPanel>
					<!-- #32014 - END -->
					<td><p:outputLabel value="#{lbl['lbl.sm.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							label="#{cc.attrs.addressTitle} - #{lbl['lbl.sm.district']}"
							disabled="#{cc.attrs.addrObj.sameAsPerm}"
							required="#{!cc.attrs.addrObj.sameAsPerm}"
							style="width: 207px;margin-bottom: 5px;" id="#{cc.attrs.districtId}"
							value="#{cc.attrs.addrObj.smAddress.districtId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="" />
							<f:selectItems value="#{cc.attrs.districtItems}" />
							<p:ajax event="change" process="@this"
								listener="#{cc.attrs.bBean.onChangeDistrict(cc.attrs.addrObj.smAddress,cc.attrs.addressType)}"
								update="#{cc.attrs.cityId}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
								and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
							oriValue="#{cc.attrs.latestAddrObj.smAddress.pmDistrict.districtId}" 
							currValue="#{cc.attrs.addrObj.smAddress.pmDistrict.districtId}" 
							alertValue="#{cc.attrs.bBean.getDistrictLabelById(cc.attrs.latestAddrObj.smAddress.pmDistrict.districtId)}"/>
						<p:message id="#{cc.attrs.districtId}Msg" for="#{cc.attrs.districtId}"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.towncity']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							label="#{cc.attrs.addressTitle} - #{lbl['lbl.sm.towncity']}"
							disabled="#{cc.attrs.addrObj.sameAsPerm}"
							required="#{!cc.attrs.addrObj.sameAsPerm}"
							style="width: 207px;margin-bottom: 5px;" id="#{cc.attrs.cityId}"
							value="#{cc.attrs.addrObj.smAddress.cityId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="" />
							<f:selectItems  value="#{cc.attrs.cityItems}" />
							<p:ajax event="change" process="@this"
								listener="#{cc.attrs.bBean.onChangeCity(cc.attrs.addrObj.smAddress,cc.attrs.addressType)}"
								update="#{cc.attrs.cityId}" />
						</p:selectOneMenu> 
						<ac:smFieldChangeAlert 
							isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
								and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
							oriValue="#{cc.attrs.latestAddrObj.smAddress.pmCity.cityId}" 
							currValue="#{cc.attrs.addrObj.smAddress.pmCity.cityId}" 
							alertValue="#{cc.attrs.bBean.getCityLabelById(cc.attrs.latestAddrObj.smAddress.pmCity.cityId)}"/>
						<p:message id="#{cc.attrs.cityId}Msg" for="#{cc.attrs.cityId}"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sm.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:outputPanel id="postCodeMailPanelId">
							<p:outputPanel
								rendered="#{cc.attrs.addrObj.smAddress.countryId==cc.attrs.bBean.managedBean.myCountryId}">
								<p:inputText maxlength="5"
									required="#{!cc.attrs.addrObj.sameAsPerm}"
									disabled="#{cc.attrs.addrObj.sameAsPerm || cc.attrs.bBean.disableFieldSSm(cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.ssmData,cc.attrs.addrObj.smAddress.postcodeSsmNull)}"
									label="#{cc.attrs.addressTitle} -#{lbl['lbl.sm.postcode']}"
									id="#{cc.attrs.postCodeId}My"
									value="#{cc.attrs.addrObj.smAddress.postcode}"
									validatorMessage="#{lbl['lbl.sm.postcode.numberformat.errmsg']}"
									size="35">
									<f:validator validatorId="postcodeValidator" />
									<p:ajax process="@this" partialSubmit="true"
										update="@this,#{cc.attrs.postCodeId}MyMsg" />
								</p:inputText>
								<ac:smFieldChangeAlert 
									isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
										and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
									oriValue="#{cc.attrs.latestAddrObj.smAddress.postcode}" 
									currValue="#{cc.attrs.addrObj.smAddress.postcode}" 
									alertValue="#{cc.attrs.latestAddrObj.smAddress.postcode}"/>
								<p:message id="#{cc.attrs.postCodeId}MyMsg"
									for="#{cc.attrs.postCodeId}My" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
							<p:outputPanel
								rendered="#{cc.attrs.addrObj.smAddress.countryId!=cc.attrs.bBean.managedBean.myCountryId}">
								<p:inputText maxlength="10"
									required="#{!cc.attrs.addrObj.sameAsPerm}"
									disabled="#{cc.attrs.addrObj.sameAsPerm}"
									label="#{cc.attrs.addressTitle} -#{lbl['lbl.sm.postcode']}"
									id="#{cc.attrs.postCodeId}Foreign"
									value="#{cc.attrs.addrObj.smAddress.postcode}"
									size="35">
									<p:ajax process="@this" partialSubmit="true"
										update="@this,#{cc.attrs.postCodeId}ForeignMsg" />
								</p:inputText>
								<ac:smFieldChangeAlert 
									isShow="#{cc.attrs.bBean.managedBean.showFieldChanges
										and not empty cc.attrs.bBean.managedBean.latestPersonnel}"
									oriValue="#{cc.attrs.latestAddrObj.smAddress.postcode}" 
									currValue="#{cc.attrs.addrObj.smAddress.postcode}" 
									alertValue="#{cc.attrs.latestAddrObj.smAddress.postcode}"/>
								<p:message id="#{cc.attrs.postCodeId}ForeignMsg"
									for="#{cc.attrs.postCodeId}Foreign" showSummary="true"
									showDetail="false" display="icon" />
							</p:outputPanel>
						</p:outputPanel></td>
				</tr>
		</table>
		
	</cc:implementation>
</ui:composition>
