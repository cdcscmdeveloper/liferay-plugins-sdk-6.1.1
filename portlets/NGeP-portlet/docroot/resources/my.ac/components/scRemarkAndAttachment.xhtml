<ui:composition
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

<cc:interface>
	<cc:attribute name="remarkList" />
	<cc:attribute name="attachmentList" />
	<cc:attribute name="readonly" default="false" />
	<cc:attribute name="showRemark" default="true" />
	<cc:attribute name="showRemarkLabel" default="true" />
	<cc:attribute name="showAttachment" default="true" />
	<cc:attribute name="instruction" default="" />
	<cc:attribute name="header" default="#{lbl['lbl.sc.remarks']}" />
	<cc:attribute name="fileUploadListener" required="#{cc.attrs.showAttachment}" />
</cc:interface>

<cc:implementation>	
	<c:choose>
		<c:when test="#{!empty cc.attrs.header}">
			<p:panel id="#{cc.id}Pnl" header="#{cc.attrs.header}" toggleable="true">
				<ui:include src="/xhtml/sc/common/remarkAndAttachmentContent.xhtml" />
			</p:panel>
		</c:when>
		<c:otherwise>
			<ui:include src="/xhtml/sc/common/remarkAndAttachmentContent.xhtml" />
		</c:otherwise>
	</c:choose>
	
	<c:if test="#{cc.attrs.showAttachment}">
		<p:dialog id="#{cc.id}uploadDlgId" widgetVar="uploadDlg" 
			modal="true" dynamic="true" 
			resizable="false" width="700px" height="350px"
			styleClass="pop_up_top" 
			header="#{lbl['lbl.txt.choose.files']}">
			<p:messages id="uploadDlgMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
			<p:ajax event="close" />
			<p:fileUpload id="fileUploadId" style="display:inline;"
				fileUploadListener="#{scRemarkAndAttachmentBackingBean.handleFileUploadListener}"
				mode="advanced" 
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
				label="#{lbl['lbl.btn.choose']}" 
				uploadLabel="#{lbl['lbl.btn.upload.all']}" 
				cancelLabel="#{lbl['lbl.btn.remove.all']}"
				update="attachmentTbId">
				<f:attribute name="fileUploadListenerMethod" value="#{cc.attrs.fileUploadListener}" />
			</p:fileUpload>
			<div class="ppRightBtn">
			    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadDlg.hide();" />
	   		</div>
		</p:dialog>
	</c:if>
</cc:implementation>
</ui:composition>
