<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
	</cc:interface>

	<cc:implementation>
		<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.regType}"
			style="width:300px;">
			<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue="" />
			<f:selectItem itemLabel="#{lbl['lbl.rpt.regBasic']}" itemValue="#{SmReportConst.SM_REG_TYPE_BASIC}" />
			<f:selectItem itemLabel="#{lbl['lbl.rpt.regMOF']}" itemValue="#{SmReportConst.SM_REG_TYPE_MOF}" />
			<p:ajax event="change"
				listener="#{cc.attrs.bBean.onChangeRegType}"
				process="@this" partialSubmit="true" update="@form" />
		</p:selectOneMenu>
	</cc:implementation>
</ui:composition>
