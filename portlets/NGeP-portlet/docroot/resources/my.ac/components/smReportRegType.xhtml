<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="showAll" default="true" />
		<cc:attribute name="showUpgrade" default="false" />
		<cc:attribute name="showG2g" default="false" />
		<cc:attribute name="selectOne" default="false"/>
		<cc:attribute name="compProfile" default="false"/>
	</cc:interface>

	<cc:implementation>
		<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.regType}"
			style="width:300px;">
			<c:if test="#{cc.attrs.selectOne}">
				<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
			</c:if>
			<f:selectItems value="#{cc.attrs.bBean.retrieveRegType(cc.attrs.showAll,cc.attrs.showUpgrade,cc.attrs.compProfile)}"/>
			<c:if test="#{cc.attrs.showG2g}">
				<f:selectItem itemValue="#{SupplierManagementConst.SUPP_TYPE_GOVT_TO_GOVT}" itemLabel="#{lbl['lbl.rpt.g2g']}" />
			</c:if>
			<p:ajax event="change" listener="#{cc.attrs.bBean.onChangeRegType}" process="@this" partialSubmit="true" update="@form" />
		</p:selectOneMenu>
	</cc:implementation>
</ui:composition>
