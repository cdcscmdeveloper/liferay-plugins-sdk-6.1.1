<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="showItemAll" default="false" />
	</cc:interface>

	<cc:implementation>
		<ui:param name="paramRequired" value="#{cc.attrs.showItemAll ? false : cc.attrs.required}" />
		<ui:param name="defaultLabel" value="#{cc.attrs.showItemAll ? 'lbl.rpt.all' : 'lbl.rpt.selectOne'}" />
		<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.year}" style="width:300px;" 
			required="#{paramRequired}" disabled="#{cc.attrs.disabled}"
			label="#{lbl['lbl.rpt.yearone']}">
			<f:selectItems value="#{cc.attrs.bBean.managedBean.yearList}" />
			<p:ajax event="change" listener="#{cc.attrs.bBean.onChangeYear}" 
				partialSubmit="true" update="@form" />
		</p:selectOneMenu>
	</cc:implementation>
</ui:composition>
