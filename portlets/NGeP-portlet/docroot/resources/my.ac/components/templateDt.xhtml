<ui:component xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:c="http://java.sun.com/jsp/jstl/core">
    
	<cc:interface>
		<cc:attribute name="index" required="true" />
	</cc:interface>
    
    <cc:implementation>
    	<ui:param name="tableId" value="sec#{cc.attrs.index}" />
    	<c:if test="#{templateSpecBackingBean.managedBean.questionListMap[cc.attrs.index] != null}">
		<p:dataTable 
			id="sec#{cc.attrs.index}" 
			value="#{templateSpecBackingBean.managedBean.questionListMap[cc.attrs.index]}"
			var="question"
			rowIndexVar="row"
			style="width:100%;">
			
			<p:column style="width:5%;#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText value="#{question.questionNumber}" style="width:25px;#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;' : ''}" />
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.addColumn(1,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_show.png" /></p:commandLink>
			</p:column>
			
			<p:column
				colspan="#{(question.questionType == 2) ? templateSpecBackingBean.managedBean.colspanMap[tableId] : 1}"
				styleClass="colspan#{(question.questionType == 2) ? templateSpecBackingBean.managedBean.colspanMap[tableId] : ''}"
				style="#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText value="#{question.question1}" style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:95%;'}" />
				<p:spacer width="2px"/>
				<p:commandLink action="#{templateSpecBackingBean.addColumn(2,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_show.png" /></p:commandLink>
				<p:spacer width="2px"/>
				<p:commandLink action="#{templateSpecBackingBean.deleteColumn(1,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_hide.png" /></p:commandLink>
			</p:column>
			
			<p:column 
				rendered="#{templateSpecBackingBean.managedBean.colnoMap[tableId] >= 2 and !(question.questionType == 2)}"
				style="#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText value="#{question.question2}" 
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:95%;'}" />
				<p:spacer width="2px" />
				<p:commandLink action="#{templateSpecBackingBean.addColumn(3,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_show.png" /></p:commandLink>
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.deleteColumn(2,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_hide.png" /></p:commandLink>
			</p:column>
			
			<p:column 
				rendered="#{templateSpecBackingBean.managedBean.colnoMap[tableId] >= 3 and !(question.questionType == 2)}"
				style="#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText value="#{question.question3}" 
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:95%;'}" />
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.addColumn(4,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_show.png" /></p:commandLink>
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.deleteColumn(3,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_hide.png" /></p:commandLink>
			</p:column>
			
			<p:column 
				rendered="#{templateSpecBackingBean.managedBean.colnoMap[tableId] >= 4 and !(question.questionType == 2)}"
				style="#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText value="#{question.question4}" 
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:95%;'}" />
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.addColumn(5,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_show.png" /></p:commandLink>
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.deleteColumn(4,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_hide.png" /></p:commandLink>
			</p:column>
		
			<p:column 
				rendered="#{templateSpecBackingBean.managedBean.colnoMap[tableId] >= 5 and !(question.questionType == 2)}"
				style="#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText value="#{question.question5}" 
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:95%;'}" />
				<p:spacer width="2px"></p:spacer>
				<p:commandLink action="#{templateSpecBackingBean.deleteColumn(5,cc.attrs.index)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
				rendered="#{(question.questionType == 1)}">
				<h:graphicImage library="ep/images/design" name="icon_hide.png" /></p:commandLink>
			</p:column>
			<p:column
				rendered="#{templateSpecBackingBean.managedBean.questionListMap[cc.attrs.index][0].answer and !(question.questionType == 2)}"
				style="width:10%; #{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:outputLabel value="#{(question.answerType)}"></p:outputLabel>
				<p:inputText 
					value="#{question.answerHeader}"
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:95%;'}" 
					rendered="#{!(question.questionType == 3)}" />
					<p:spacer width="2px"></p:spacer>
					<p:commandLink action="#{templateSpecBackingBean.removeAnswerFlg(cc.attrs.index,1)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
						rendered="#{(question.questionType == 1)}">
						<h:graphicImage library="ep/images/design" name="icon_hide.png" />
					</p:commandLink>
					
				<p:inputText 
					value="#{question.answerHeader}"
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;width:75%;' : 'width:70%;'}" 
					rendered="#{(question.questionType == 3) and !(question.answerType == 3)}" 
					 />
					
				<h:selectOneMenu 
					value="#{question.answerHeader}"
					rendered="#{(question.questionType == 3) and (question.answerType == 3)}" 
					readonly="true">
					<f:selectItem itemLabel="" itemValue="0" />
					<f:selectItems value="#{templateSpecBackingBean.managedBean.optionMap[question.tplOptionGroup.optionGroupId]}" />
				</h:selectOneMenu>
				
				<p:commandLink 
					partialSubmit="true"  
					rendered="#{question.questionType == 3}"
					oncomplete="answerSetting.show();" 
					update=":form:asID,:form:checkScore" 
					process="@this" 
					action="#{templateSpecBackingBean.storeAnswerData}">
					<h:graphicImage id="editpic" library="ep/images/design" name="icon-edit.png" />
				</p:commandLink>
				
				
			</p:column>
			
			<p:column
				rendered="#{templateSpecBackingBean.managedBean.questionListMap[cc.attrs.index][0].lastAnswer and !(question.questionType == 2)}"
				style="width:15%;#{(question.questionType == 2 or question.questionType == 1) ? 'background-color:#dddddd;' : ''}">
				<p:inputText 
					value="#{question.lastAnswerHeader}"
					style="#{(question.questionType == 2 or question.questionType == 1) ? 'background:#dddddd;' : ''}"
					readonly="#{(question.questionType == 3)}" />
					<p:spacer width="2px"></p:spacer>
					<p:commandLink action="#{templateSpecBackingBean.removeAnswerFlg(cc.attrs.index,2)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan();" 
						rendered="#{(question.questionType == 1)}">
						<h:graphicImage library="ep/images/design" name="icon_hide.png" />
					</p:commandLink>
			</p:column>
			
			<p:column style="width:2%; align:center;">
				<p:menuButton value="" id="addSecMenu" styleClass="addSecMenu">
			            <p:menuitem value="Add Section" actionListener="#{templateSpecBackingBean.addQuestion(cc.attrs.index, row, 2)}" update="sec#{cc.attrs.index}" 
			            oncomplete="updateColspan()" process="@this">
			            </p:menuitem>
			            <p:menuitem value="Add Question" action="#{templateSpecBackingBean.addQuestion(cc.attrs.index, row, 3)}" update="sec#{cc.attrs.index}"
			             oncomplete="updateColspan()" process="@this">
			            </p:menuitem>
			             <p:menuitem rendered="#{templateSpecBackingBean.managedBean.questionListMap[cc.attrs.index][0].answer == false}" value="Add Answer" 
			             process="@this" action="#{templateSpecBackingBean.addAnswerFlg(cc.attrs.index,1)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan()">
			            </p:menuitem>
			             <p:menuitem rendered="#{templateSpecBackingBean.managedBean.questionListMap[cc.attrs.index][0].lastAnswer == false}" value="Add Additional Answer" 
			             process="@this" action="#{templateSpecBackingBean.addAnswerFlg(cc.attrs.index,2)}" update="sec#{cc.attrs.index}" oncomplete="updateColspan()">
			            </p:menuitem>
			     </p:menuButton>
			</p:column>
				
			<p:column style="width:2%; align:center;">
					<p:commandLink onclick="pp2.show();" process="@this">
						<h:graphicImage library="ep/images/design" name="icon_trash.png" />
						<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.tableIndexToDelete}" value="#{cc.attrs.index}"></f:setPropertyActionListener>
						<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.rowToDelete}" value="#{row}"/>
					</p:commandLink>					
		    
			</p:column>
			
			
		</p:dataTable>
		
		</c:if>
	</cc:implementation>
    
</ui:component>
