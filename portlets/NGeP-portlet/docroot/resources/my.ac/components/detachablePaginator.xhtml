<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<cc:interface>
		<cc:attribute name="paginatorObject" required="true" />
		<cc:attribute name="loopId" required="true" />
	    <cc:attribute name="minimal" default="false" required="false" />
	</cc:interface>

	<cc:implementation>
		<p:remoteCommand name="updateForm" update=":form:#{loopId}"></p:remoteCommand>
			
		<!-- #35320 - start -->
		<h:panelGroup layout="block"  styleClass="ui-paginator ui-paginator-bottom ui-widget-header ui-corner-bottom" >
		<!-- #35320 - end -->
		
			<h:outputText value="#{lbl['lbl.datatable.paginator.page']} #{cc.attrs.paginatorObject.pageIndex} / #{cc.attrs.paginatorObject.pages}" style="font-weight: bold !important;" />
				&#160;&#160;&#160;
				<p:commandLink rendered="#{!cc.attrs.minimal}"
					styleClass="ui-paginator-first ui-state-default ui-corner-all"
					action="#{cc.attrs.paginatorObject.goToPage(1)}" process="@this" update=":form:#{cc.attrs.loopId}" oncomplete="updateForm();" partialSubmit="true" disabled="#{cc.attrs.paginatorObject.pageIndex==1}">
					<i class="ui-icon ui-icon-seek-first">p</i> <ui:remove><!-- #25138 add update =form... --></ui:remove>
				</p:commandLink>
				<p:commandLink id="prevBtn" 
					styleClass="ui-paginator-prev ui-state-default ui-corner-all"
					action="#{cc.attrs.paginatorObject.prev()}" process="@this" update=":form:#{cc.attrs.loopId}" oncomplete="updateForm();" partialSubmit="true" disabled="#{cc.attrs.paginatorObject.pageIndex==1}">
					<i class="ui-icon ui-icon-seek-prev">p</i>	<ui:remove><!-- #25138 add update =form... --></ui:remove>
				</p:commandLink>
					<c:forEach var = "i" begin = "1" end = "#{cc.attrs.paginatorObject.pages}">
        				<p:commandLink action="#{cc.attrs.paginatorObject.goToPage(i)}" process="@this" update=":form:#{cc.attrs.loopId}" oncomplete="updateForm();" partialSubmit="true" value="#{i}" style="text-decoration: none !important; font-weight: bold !important;" 
        				styleClass="ui-paginator-next ui-state-default ui-corner-all #{cc.attrs.paginatorObject.pageIndex == i ?'ui-state-active':''}"></p:commandLink>
      				</c:forEach>
				<p:commandLink styleClass="ui-paginator-next ui-state-default ui-corner-all" action="#{cc.attrs.paginatorObject.next()}" process="@this" update=":form:#{cc.attrs.loopId}" oncomplete="updateForm();" partialSubmit="true"  disabled="#{cc.attrs.paginatorObject.pageIndex==cc.attrs.paginatorObject.pages}" >
					<i class="ui-icon ui-icon-seek-next">p</i>	<ui:remove><!-- #25138 add update =form... --></ui:remove>
					</p:commandLink>
				<p:commandLink rendered="#{!cc.attrs.minimal}"
					styleClass="ui-paginator-last ui-state-default ui-corner-all"
					action="#{cc.attrs.paginatorObject.goToPage(cc.attrs.paginatorObject.pages)}" process="@this" update=":form:#{cc.attrs.loopId}" oncomplete="updateForm();" partialSubmit="true" disabled="#{cc.attrs.paginatorObject.pageIndex==cc.attrs.paginatorObject.pages}">
					<i class="ui-icon ui-icon-seek-end">p</i> <ui:remove><!-- #25138 add update =form... --></ui:remove>
				</p:commandLink>
		</h:panelGroup>
</cc:implementation>
</ui:composition>
