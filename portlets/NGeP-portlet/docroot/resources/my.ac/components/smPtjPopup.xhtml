<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">
	<cc:interface>
		<cc:attribute name="id" required="true" />
		<cc:attribute name="header" required="false"
			default="#{lbl['lbl.sm.ptj.popup.header']}" />
	</cc:interface>
	<cc:implementation>
		<p:dialog id="#{cc.attrs.id}" header="#{cc.attrs.header}"
			widgetVar="smPtjPopupWV" modal="true" styleClass="pop_up_top">
			<h:panelGroup>
				<p:panel header="#{lbl['lbl.sm.ptj.popup.search']}"
					toggleable="true">
					<h:panelGrid columns="3">
						<p:inputText value="#{lbl['lbl.sm.ptj.popup.ministry']}" disabled />
						<p:spacer height="1" />
						<p:selectOneMenu id="somMinistry"
							value="#{smPtjPopupMB.ministryProfileId}">
							<f:selectItems value="#{smPtjPopupBB.getMinistryDropdown()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update=":form:#{cc.attrs.id}:somPtjGroup" />
						</p:selectOneMenu>

						<p:inputText value="#{lbl['lbl.sm.ptj.popup.ptjGroup']}" disabled />
						<p:spacer height="1" />
						<p:selectOneMenu id="somPtjGroup"
							value="#{smPtjPopupMB.ministryProfileId}">
							<f:selectItems value="#{smPtjPopupBB.getPtjGroupDropdown()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="@this" />
						</p:selectOneMenu>

						<p:selectOneMenu id="somPtjCodeNameKey"
							value="#{smPtjPopupMB.ptjCodeName}">
							<f:selectItems value="#{smPtjPopupBB.getPtjCodeNameDropDown()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="@this" />
						</p:selectOneMenu>
						<p:spacer height="1" />
						<p:inputText value="#{smPtjPopupMB.ptjCodeNameValue}">
					</h:panelGrid>
				</p:panel>
			</h:panelGroup>
		</p:dialog>
	</cc:implementation>
</ui:composition>
