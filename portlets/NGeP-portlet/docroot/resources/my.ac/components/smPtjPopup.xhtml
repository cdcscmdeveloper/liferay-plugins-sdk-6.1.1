<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui">
	<cc:interface>
		<cc:attribute name="dialogName" required="true" />
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="mBean" required="true" />
	</cc:interface>
	<cc:implementation>
		<p:dialog id="#{cc.attrs.dialogName}Id"
			widgetVar="#{cc.attrs.dialogName}WV" modal="true" dynamic="true"
			styleClass="pop_up_top"
			header="#{lbl['lbl.lov.listing']} -  #{cc.attrs.bBean.getParameterDesc(ParameterTypeConst.organisationTypes, ParameterConst.orgTypePtj)}">
		</p:dialog>
	</cc:implementation>
</ui:composition>
