<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<cc:interface>
		<cc:attribute name="mBean" required="true" />
		<cc:attribute name="bBean" required="true" />
	</cc:interface>
	<cc:implementation>
		<p:dialog id="compExpViewPopup"
			header="#{lbl['lbl.sm.comp.exp.master.popup.header.ct.qt']}"
			widgetVar="compExpViewPopupWV" modal="true" styleClass="pop_up_top"
			position="top" width="700px">
			<div align="center">
				<table>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.proj.done.for']}" /></td>
						<td style="width: 66%"><p:selectOneRadio disabled="true"
								id="clientType"
								value="#{cc.attrs.mBean.selectedCompExpMaster.clientType}">
								<f:selectItems value="#{cc.attrs.mBean.clientTypeItems}"></f:selectItems>
							</p:selectOneRadio></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.agency.name']}" /></td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.agencyName}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.file.ref.no']}" /></td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.fileReferenceNo} #{cc.attrs.mBean.selectedCompExpMaster.fileExtensionNo}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.loa.no']}" /></td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.loaNo}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.proc.cont.proj.title']}" /></td>
						<td style="width: 66%"><h:outputText
								style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;"
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.title}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.contract.value']}" /></td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.contractValue}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.payment.method']}" /></td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.bBean.getParameterDesc(cc.attrs.mBean.selectedCompExpMaster.paymentMethod)}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.proc.method']}" /></td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.bBean.getParameterDesc(cc.attrs.mBean.selectedCompExpMaster.procumentMode)}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.contract.eff.date']}" />
						</td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.contractEffDate}">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.contract.exp.date']}" />
						</td>
						<td style="width: 66%"><h:outputText
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedCompExpMaster.contractExpDate}">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label2"
								value="#{lbl['lbl.sm.comp.exp.master.popup.contract.status']}" /></td>
						<td style="width: 66%"><c:if
								test="#{cc.attrs.mBean.selectedCompExpMaster.contractStatus eq ParameterConst.contractStatusInactive}">
								<h:outputText styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.comp.exp.update.contract.status.inactive']}" />
							</c:if> <c:if
								test="#{cc.attrs.mBean.selectedCompExpMaster.contractStatus eq ParameterConst.contractStatusEffective}">
								<h:outputText styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.comp.exp.update.contract.status.effective']}" />
							</c:if> <c:if
								test="#{cc.attrs.mBean.selectedCompExpMaster.contractStatus eq ParameterConst.contractStatusExpired}">
								<h:outputText styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.comp.exp.update.contract.status.expired']}" />
							</c:if> <c:if
								test="#{cc.attrs.mBean.selectedCompExpMaster.contractStatus eq ParameterConst.contractStatusTerminated}">
								<h:outputText styleClass="outputLabel-view"
									value="#{lbl['lbl.sm.comp.exp.update.contract.status.terminated']}" />
							</c:if></td>
					</tr>
				</table>
				<!--p:panel header="#{lbl['lbl.sm.comp.exp.update.project.cat.code']}"
					toggleable="true">
					<p:dataTable id="smCompExpCatCodes" rows="10" rowIndexVar="index"
						value="#{smCompExpMB.smCompExpCatDraftList}"
						var="smCompExpCatCode" widgetVar="smCompExpCatCodesWV">
						<ac:paginator for="smCompExpCatCodes" />
						<c:if test="#{smCompExpMB.smCompExpCatDraftListEmpty}">
							<p:column style="width:2%">
								<f:facet name="header">
									<p:selectBooleanCheckbox value="#{smCompExpMB.selectedAll}">
										<p:ajax listener="#{smCompExpBB.selectAllCatCodes}"
											update=":#{p:component('smCompExpCatCodes')}, :#{p:component('delCatBtn')}" />
									</p:selectBooleanCheckbox>
								</f:facet>
								<p:selectBooleanCheckbox value="#{smCompExpCatCode.selected}">
									<p:ajax listener="#{smCompExpBB.selectCatCode(index)}"
										update=":#{p:component('smCompExpCatCodes')}, :#{p:component('delCatBtn')}" />
								</p:selectBooleanCheckbox>
							</p:column>
							<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
								<h:outputText styleClass="mandatory" value="*" />
								<p:selectOneMenu id="mainDDId"
									label="#{lbl['lbl.sm.projDtls.mainCat']}"
									value="#{smCompExpCatCode.categoryL1.categoryL1Id}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems itemLabel="#{main.categoryName}"
										itemValue="#{main.categoryL1Id}"
										value="#{smCompExpMB.supplierMainCatList}" var="main" />
									<p:ajax event="change" update="subDDId,subDivDDId"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
										listener="#{smCompExpBB.getSupplierSubCatList(smCompExpCatCode.categoryL1.categoryL1Id, index)}" />
								</p:selectOneMenu>
							</p:column>
							<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
								<h:outputText styleClass="mandatory" value="*" />
								<p:selectOneMenu id="subDDId"
									label="#{lbl['lbl.sm.projDtls.subCat']}"
									value="#{smCompExpCatCode.categoryL2.categoryL2Id}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems itemLabel="#{sub.categoryName}"
										itemValue="#{sub.categoryL2Id}"
										value="#{smCompExpMB.supplierSubCatList}" var="sub" />
									<p:ajax event="change" update="subDivDDId"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
										listener="#{smCompExpBB.getSupplierSubDivCatList(smCompExpCatCode.categoryL2.categoryL2Id, index)}" />
								</p:selectOneMenu>
							</p:column>
							<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
								<h:outputText styleClass="mandatory" value="*" />
								<p:selectOneMenu id="subDivDDId"
									label="#{lbl['lbl.sm.projDtls.subCatDiv']}"
									value="#{smCompExpCatCode.categoryL3.categoryL3Id}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems itemLabel="#{subDiv.categoryName}"
										itemValue="#{subDiv.categoryL3Id}"
										value="#{smCompExpMB.supplierSubDivCatList}" var="subDiv" />
									<p:ajax event="change"
										update=":#{p:component('smCompExpCatCodes')}, :#{p:component('addCatBtn')}"
										onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
										listener="#{smCompExpBB.checkDuplicateCatCode(smCompExpCatCode.categoryL3.categoryL3Id, index)}" />
								</p:selectOneMenu>
							</p:column>
						</c:if>
						<c:if test="#{!smCompExpMB.smCompExpCatDraftListEmpty}">
							<p:column headerText="#{lbl['lbl.sm.projDtls.mainCat']}">
								<h:outputText value="#{smCompExpCatCode.categoryL1Name}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.sm.projDtls.subCat']}">
								<h:outputText value="#{smCompExpCatCode.categoryL2Name}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.sm.projDtls.subCatDiv']}">
								<h:outputText value="#{smCompExpCatCode.categoryL3Name}" />
							</p:column>
						</c:if>
					</p:dataTable>
					<div align="right">
						<p:commandButton id="addCatBtn"
							action="#{smCompExpBB.addSmCompExpCatDraft}"
							disabled="#{smCompExpMB.smCompExpCatDrafNotComplete}"
							onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
							rendered="#{smCompExpMB.smCompExpCatDraftListEmpty}"
							update=":#{p:component('smCompExpCatCodes')}, @this"
							value="#{lbl['lbl.sm.button.add']}">
						</p:commandButton>
						<p:commandButton id="delCatBtn"
							disabled="#{empty smCompExpMB.selectedSmCompExpCatDraft}"
							onclick="confirmDelSelectedCatDialogWV.show()" process="@this"
							rendered="#{smCompExpMB.smCompExpCatDraftListEmpty}"
							value="#{lbl['lbl.sm.button.delete']}">
						</p:commandButton>
					</div>
				</p:panel -->
			</div>
		</p:dialog>
	</cc:implementation>
</ui:composition>
