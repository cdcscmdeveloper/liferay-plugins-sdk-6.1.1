<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
	</p:blockUI>	
	<ui:remove>#34444 Start Ann</ui:remove>
	<cc:interface>
		<cc:attribute name="id" />
		<cc:attribute name="update" required="true" default="" />
		<cc:attribute name="title" default="" />
		<cc:attribute name="content" default="" />
		<cc:attribute name="widget" default="" />
		<cc:attribute name="okAction" default="" />
		<cc:attribute name="width" default="400" />
		<cc:attribute name="height" default="100" />
		<cc:attribute name="oncompleteOk" default="" />
		<cc:attribute name="okProcess" default="@this" />
	</cc:interface>

	<cc:implementation>
		<ui:param name="confirmationheader" value="#{cc.attrs.title}" />
		<ui:param name="confirmationContent" value="#{cc.attrs.content}" />

		<p:dialog id="#{cc.attrs.id}" widgetVar="#{cc.attrs.widget}"
			header="#{confirmationheader}" hide="true" resizable="false"
			width="#{cc.attrs.width}" height="#{cc.attrs.height}"
			closable="false" modal="true">
			<h:panelGroup id="#{cc.attrs.id}Popup" layout="block">
				<table>
					<tr>
						<td align="center"><p:outputLabel
								value="#{confirmationContent}" /></td>
					</tr>
				</table>
				<p:spacer height="1" />
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.yes']}" process="#{cc.attrs.okProcess}" partialSubmit="true"
						onclick="blockWidget.show(); #{cc.attrs.widget}.hide(); "
						action="#{cofirmationPopUpBackingBean.okAction(cc.attrs.okAction)}"
						update="#{cc.attrs.update}"
						oncomplete="blockWidget.hide(); #{cc.attrs.widget}.hide(); #{cc.attrs.oncompleteOk}">
					</p:commandButton>

					<p:commandButton value="#{lbl['lbl.btn.no']}" immediate="true"
						oncomplete="#{cc.attrs.widget}.hide();" />
				</div>
			</h:panelGroup>
		</p:dialog>
	</cc:implementation>
</ui:composition>
