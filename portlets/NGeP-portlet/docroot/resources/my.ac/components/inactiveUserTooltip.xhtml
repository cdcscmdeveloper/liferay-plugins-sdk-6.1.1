<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id" />
		<cc:attribute name="value" />
				
	</cc:interface>

	<cc:implementation>
		<p:graphicImage id="inactiveUserTooltipImageId" value="/css/images/design/ico-inactive_user.png" style="width:20px; height:20px;"/>
		<p:tooltip id="inactiveUserTooltipId" for="inactiveUserTooltipImageId">
			<p:outputLabel escape="false" value="#{lbl['lbl.txt.inactive']}"  />
		</p:tooltip>
	</cc:implementation>
	
</ui:component>
