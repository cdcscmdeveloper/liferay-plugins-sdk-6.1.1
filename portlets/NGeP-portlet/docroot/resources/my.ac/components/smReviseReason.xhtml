<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<cc:interface>
		<cc:attribute name="bBean" required="true"/>
	</cc:interface>
	
	<cc:implementation>
		<h:outputText value="#{lbl['lbl.sm.revise.reason']} : " style="font-weight:bold"
			rendered="#{cc.attrs.bBean.renderRevisedReason()}"/>
		<h:outputText value="#{cc.attrs.bBean.currentReviseReason()}"  escape="false"
			rendered="#{cc.attrs.bBean.renderRevisedReason()}"/>
	</cc:implementation>
</ui:component>
