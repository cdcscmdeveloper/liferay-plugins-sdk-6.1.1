<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="true" />
	</cc:interface>

	<cc:implementation>





		<h:outputText styleClass="instruction"
			style="float:left;margin-left:20px;"
			value="#{lbl['lbl.instruction.mandatory']}" />

		<ui:param name="deskofficerEnableDisable"
			value="#{cc.attrs.bBean.retriveUserRoles()}"></ui:param>
		<ui:param name="ptjEnableDisable"
			value="#{cc.attrs.bBean.getPtjValues()}"></ui:param>
		
		<table style="width:80%;margin-left: auto;margin-right: auto;">
			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.rpt.supplier']}"/>
					
				</td>
			    
			    <td>	
					<p:inputText value="#{qtPropOfferSubReportBB.managedBean.supplierName}"
					disabled="true" readonly="true" style="width:520px;" />	
			    </td>
			</tr>				
			
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.qtn.no']}"/>
				</td>
				<td>
					<p:autoComplete size="40" width="200px !important"
							title="#{lbl['lbl.sc.qtn.no']}"
							value="#{qtPropOfferSubReportBB.managedBean.autoScQt.qtNo}"
							completeMethod="#{qtPropOfferSubReportBB.autoCompleteQtNo}"
							scrollHeight="100"/>
				</td>
			</tr>
			
			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.sc.title']}"/>
				</td>
				<td colspan="2">
				<p:autoComplete size="90" width="500px !important"
							title="#{lbl['lbl.sc.title']}"
							value="#{qtPropOfferSubReportBB.managedBean.autoScQt.qtTitle}"
							completeMethod="#{qtPropOfferSubReportBB.autoCompleteQtTitle}"
							scrollHeight="300"/>
		    	</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.proposal.no']}"/>
				</td>
				<td>
					<p:autoComplete size="40" width="200px !important"
							title="#{lbl['lbl.sc.proposal.no']}"
							value="#{qtPropOfferSubReportBB.managedBean.autoScQtProposal.proposalNo}"
							completeMethod="#{qtPropOfferSubReportBB.autoCompleteProposalNo}"
							scrollHeight="100"/>
				</td>
				
				<td>	
					<p:outputLabel value="#{lbl['lbl.rpt.status']}"/>
				</td>
				<td>		
					 <p:selectManyMenu id="manyMenuSts" value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scStatusManyMenu}" 
						converter="#{statusConverter}" filter="true" multiple="true" filterMatchMode="startsWith" showCheckbox="true" styleClass="manymenu-advanced"
						style="width:200px;height:70px;position:relative;">
						<f:selectItems
							value="#{cc.attrs.bBean.reportStatusDropdownValuesProposalOfferSubmission()}"
							var="status" itemValue="#{status}" itemLabel="#{status}" 
							itemDisabled="#{cc.attrs.bBean.isDisabled(status,qtReportMainBB.managedBean.reportCode)}" ></f:selectItems>
						<p:ajax event="change" process="@this" update="@this"
						listener="#{cc.attrs.bBean.onSelectAll(qtReportMainBB.managedBean.reportCode)}" />	
					</p:selectManyMenu>
				</td>	
			</tr>
			<tr>
				<td class="columnGenClass"><p:outputLabel
						value="#{lbl['lbl.rpt.proposal.submitted.date.from']}" style="width:120px;" /></td>
				<td class="columnDateFromClass"><p:calendar showOn="button"
						value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scPublishFromDate}"
						navigator="true" display="inline" readonlyInput="true" size="9"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						partialSubmit="true" process="@form">

					</p:calendar></td>
				<td class="columnDateToClass"><p:outputLabel
						value="#{lbl['lbl.rpt.proposal.submitted.date.to']}" style="width:120px;" /></td>
				<td><p:calendar showOn="button" navigator="true"
						value="#{cc.attrs.bBean.managedBean.scReportSearchBean.scPublishToDate}"
						display="inline" readonlyInput="true" size="9"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						partialSubmit="true" process="@form">
					</p:calendar></td>
			</tr>
		</table>	

	</cc:implementation>
</ui:component>
