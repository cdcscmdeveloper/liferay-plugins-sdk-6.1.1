<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:cc="http://java.sun.com/jsf/composite">
	
	<cc:interface>
		<cc:attribute name="dialogHeader" default="#{lbl['lbl.sm.view.history.disciplinary.action.headerlbl']}"/>
		<cc:attribute name="dialogHeader1" default="#{lbl['lbl.sm.view.details.disciplinary.action.headerlbl']}"/>
		<cc:attribute name="dialogWidth" default="1100px" />
		<cc:attribute name="dialogHeight" default="500px" />
		<cc:attribute name="voList" type="java.util.List" required="true" />
		<cc:attribute name="mofView" default="true" />
		<cc:attribute name="dialogMessage" default=""/>
		<cc:attribute name="smSupplier" type="my.ep.persistence.entity.sm.SmSupplier" />
		<!-- 30842 Start -->
		<cc:attribute name="smAppl" type="my.ep.persistence.entity.sm.SmAppl" />
		<!-- 30842 End -->
		<cc:attribute name="btnView" default="false" />
	</cc:interface>
	<cc:implementation>
	<p:dialog id="disciplinaryActionHistoryDlgId" header="#{!cc.attrs.btnView ? cc.attrs.dialogHeader : cc.attrs.dialogHeader1}" closable="true"
		widgetVar="disciplinaryActionHistoryDlg" modal="true" width="#{cc.attrs.dialogWidth}" height="auto"
		resizable="true" style="display: block;">		
		<p:outputPanel id="disciplinaryActionMsgOP" rendered="#{not empty cc.attrs.dialogMessage}">     
			<h:outputText value = "#{cc.attrs.dialogMessage}" style="color:red;" escape="false" />
			<p:spacer height="3" />
		</p:outputPanel>
							
		<p:dataTable value="#{cc.attrs.voList}" var="disciplinaryAction" id="disciplinaryActionDtId"
		 sortBy="#{disciplinaryAction.endDate}" rowIndexVar="index" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
		 style="table-layout: fixed;">
			
	/*  start : 27445 = Disciplinary Actions / history popup window*/
			<p:column headerText="#{lbl['lbl.sm.userprofile.num']}" style="width : 2% !important; vertical-align:top;">
				<p:outputLabel value="#{index + 1}"
					style="float: left;white-space: normal !important;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.disciplinary.jktt.punishment.type']}" style="width : 23% !important; vertical-align:top;white-space: normal !important;">
				<p:outputLabel rendered="#{disciplinaryAction.warning}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.warning']}"/>
					<h:outputText value="," rendered="#{disciplinaryAction.warning and (disciplinaryAction.cancelCategory || 
					disciplinaryAction.suspendRegistration || disciplinaryAction.cancelRegistration || disciplinaryAction.blacklistOwnerDirector ||
					disciplinaryAction.bumiputeraCancel || disciplinaryAction.manufacturerCancel)}"/>
				</p:outputLabel>
				
				
				<p:outputLabel rendered="#{disciplinaryAction.cancelCategory}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.cat.code']}"/>
					<h:outputText value="," rendered="#{disciplinaryAction.cancelCategory and (disciplinaryAction.suspendRegistration || disciplinaryAction.cancelRegistration || disciplinaryAction.blacklistOwnerDirector ||
					disciplinaryAction.bumiputeraCancel || disciplinaryAction.manufacturerCancel)}"/>
				</p:outputLabel>
				
				<p:outputLabel rendered="#{disciplinaryAction.suspendRegistration}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.suspend.registration']}"/>
					<h:outputText value="," rendered="#{disciplinaryAction.suspendRegistration and (disciplinaryAction.cancelRegistration || disciplinaryAction.blacklistOwnerDirector ||
					disciplinaryAction.bumiputeraCancel || disciplinaryAction.manufacturerCancel)}"/>
				</p:outputLabel>
				
				<p:outputLabel rendered="#{disciplinaryAction.cancelRegistration}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.registration']}"/>
					<h:outputText value="," rendered="#{disciplinaryAction.cancelRegistration and (disciplinaryAction.blacklistOwnerDirector ||
					disciplinaryAction.bumiputeraCancel || disciplinaryAction.manufacturerCancel)}"/>
				</p:outputLabel>
				
				<p:outputLabel rendered="#{disciplinaryAction.blacklistOwnerDirector}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.blacklist.owner']}"/>
					<h:outputText value="," rendered="#{disciplinaryAction.blacklistOwnerDirector and (disciplinaryAction.bumiputeraCancel || disciplinaryAction.manufacturerCancel)}"/>
				</p:outputLabel>
				
				<p:outputLabel rendered="#{disciplinaryAction.bumiputeraCancel}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.of.bumiputera']}"/>
					<h:outputText value="," rendered="#{disciplinaryAction.bumiputeraCancel and disciplinaryAction.manufacturerCancel}"/>
				</p:outputLabel>
				
				<p:outputLabel rendered="#{disciplinaryAction.manufacturerCancel}" styleClass="outputLabel-view">
					<h:outputText value="#{lbl['lbl.sm.disciplinary.jktt.cancel.of.manufacturer']}"/>
				</p:outputLabel>
			</p:column>			
			<p:column headerText="#{lbl['lbl.sm.disciplinary.jktt.start.date']}" style="width : 10% !important; vertical-align:top;">
				<ac:labelDateTime styleClass="outputLabel-view" value="#{disciplinaryAction.startDate}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.disciplinary.jktt.end.date']}" style="width : 10% !important; vertical-align:top;">
				<ac:labelDateTime styleClass="outputLabel-view" value="#{disciplinaryAction.endDate}"/>
			</p:column>
			<!-- 27796: Disciplinary Action - start - 26238 -->
			<p:column headerText="#{lbl['lbl.sm.disciplinary.jktt.remarks']}" style="white-space: normal !important; width : 25% !important; vertical-align:top;word-break: break-all;">
				<h:dataTable value="#{disciplinaryAction.remarksList}" var="remarksList" rendered="#{not empty disciplinaryAction.remarksList}"
					rowIndexVar="indexCat" emptyMessage="#{lbl['lbl.sm.no.available']}" 
					style="border: none !important; table-layout: fixed;">
					<p:column style="border: none !important;">
						<h:outputText value="#{remarksList.remarks}" escape="false" style="white-space:pre-line;"/>
					</p:column>
				</h:dataTable>
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty disciplinaryAction.remarksList}"/>
			</p:column>
			<!-- 27796: Disciplinary Action - end - 26238 -->
			<!-- 28613, 28637 -->
			<!-- 30842 -->
			<p:column headerText="#{lbl['lbl.sm.disciplinary.list.cancel.category.code']}" 
				rendered="#{supplierDataMaintenanceBackingBean.managedBean.viewCatCode || cc.attrs.mofView || cc.attrs.smAppl.supplierType eq 'K' || cc.attrs.smAppl.supplierType eq 'J'}"
				style="white-space: normal !important;width : 15% !important; vertical-align:top;">
				<!-- 30842 End -->
				<h:dataTable value="#{disciplinaryAction.categoryCodeList}" var="suppCat" rendered="#{not empty disciplinaryAction.categoryCodeList}"
					rowIndexVar="indexCat" emptyMessage="#{lbl['lbl.sm.no.available']}" style="border: none !important;">
					<p:column style="border: none !important;">
						<h:outputText value="#{suppCat.categoryCode}"/>
					</p:column>
				</h:dataTable>
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty disciplinaryAction.categoryCodeList}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sm.disciplinary.list.of.ic.no.blacklist']}" style="white-space: normal !important;width : 15% !important; vertical-align:top;">
				<h:dataTable value="#{disciplinaryAction.blacklistownerDirectorList}" var="personnel" 
					rowIndexVar="indexPer" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" rendered="#{not empty disciplinaryAction.blacklistownerDirectorList}">
					<p:column style="border: none !important;">
						<h:outputText value="#{personnel.icNo}"/>
					</p:column>
				</h:dataTable>
				<h:outputText value="#{lbl['lbl.sm.no.available']}" rendered="#{empty disciplinaryAction.blacklistownerDirectorList}" />
			</p:column>
			
	/*  end : 27445 = Disciplinary Actions / history popup window*/
		</p:dataTable>
		<p:commandButton value="#{lbl['lbl.btn.download']}" style="float:right;"
		    rendered="#{!cc.attrs.btnView}"
			action="#{supplierDataMaintenanceBackingBean.downloadDAHistory(cc.attrs.smSupplier)}"
			ajax="false">
			<p:fileDownload value="#{supplierDataMaintenanceBackingBean.file}" />
		</p:commandButton>
	</p:dialog>
	</cc:implementation>
</ui:composition>
