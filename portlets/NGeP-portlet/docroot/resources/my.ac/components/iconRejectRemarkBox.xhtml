<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="id"/>
		<cc:attribute name="show" default="false" />
		<cc:attribute name="supplierCode"/>
		<cc:attribute name="remark"/>

	</cc:interface>
	<cc:implementation>
		<ui:fragment rendered="#{cc.attrs.show}">
			<p:commandLink onclick="widget#{cc.attrs.supplierCode}.show()">
				<ui:param name="imgId" value="#{cc.attrs.id}Img" />
				<p:graphicImage id="#{imgId}#{cc.attrs.supplierCode}"
					value="/css/images/design/ico-tooltips.png" />
				<p:tooltip id="#{cc.attrs.id}" for="#{imgId}">
					<p:outputLabel escape="false" value="#{lbl['lbl.sc.supplier.reject.popup.tooltip']}" />
				</p:tooltip>
			</p:commandLink>

			<p:dialog id="WidgetId#{cc.attrs.supplierCode}"
				widgetVar="widget#{cc.attrs.supplierCode}" header="#{lbl['lbl.sc.supplier.reject.popup.header']}"
				resizable="false" modal="true">
				<p:outputPanel id="panelRejectRemark#{cc.attrs.supplierCode}" layout="block">
				<table class="ui-panelgrid ui-widget">
					<thead class="ui-panelgrid-header">
						<tr class="ui-widget-header">
							<td style="text-align: center !important;" class="ui-widget-header"><h:outputText value="#{lbl['lbl.sc.supplier.code']}" /></td>
							<td style="text-align: center !important;" class="ui-widget-header"><h:outputText value="#{lbl['lbl.sc.supplier.reject.remark']}" /></td>
						</tr>
					</thead>
					<tbody>
						<tr class="ui-widget-content">
							<td style="text-align: center !important;"><h:outputText value="#{cc.attrs.supplierCode}" /></td>
							<td style="text-align: center !important;"><h:outputText value="#{cc.attrs.remark}" /></td>
						</tr>
					</tbody>
				</table>
					<div class="ppRightBtn">
						<p:commandButton
							oncomplete="widget#{cc.attrs.supplierCode}.hide()"
							value="#{lbl['lbl.btn.ok']}" />
					</div>
				</p:outputPanel>
			</p:dialog>
		</ui:fragment>
	</cc:implementation>

</ui:component>
