<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="required" default="false" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="showAll" default="true" />
		<cc:attribute name="allValue" default=""/>
		<cc:attribute name="selectOne" default="false"/>
	</cc:interface>

	<cc:implementation>
		<p:selectOneMenu value="#{cc.attrs.bBean.managedBean.supplierType}"
			style="width:300px;" required="#{cc.attrs.required}" label="#{lbl['lbl.rpt.supplierType']}">
			<c:if test="#{cc.attrs.showAll}">
				<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue="#{cc.attrs.allValue}"></f:selectItem>
			</c:if>
			<c:if test="#{cc.attrs.selectOne}">
				<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
			</c:if>
			<f:selectItem itemLabel="#{lbl['lbl.rpt.consultant']}" itemValue="#{SupplierMgmtConst.suppTypeConsultant}"></f:selectItem>
			<f:selectItem itemLabel="#{lbl['lbl.rpt.contractor']}" itemValue="#{SupplierMgmtConst.suppTypeContractor}"></f:selectItem>
			<p:ajax event="change" listener="#{cc.attrs.bBean.onChangeSuppType}" 
				process="@this" partialSubmit="true" update="@form" />
		</p:selectOneMenu>
	</cc:implementation>
</ui:composition>
