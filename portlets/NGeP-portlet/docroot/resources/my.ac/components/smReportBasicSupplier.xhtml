	<cc:interface>
		<cc:attribute name="bBean" required="true" default="" />
		<cc:attribute name="saveObj" required="true" default="" />
	</cc:interface>
	
	<cc:implementation>
			<!-- #30824 & #29712, #32564 - start -->
			<ac:lov id="basicMofSupplier" readonly="true" style="width:289px;"

				headerText="#{lbl['lbl.sm.supplov']}" 
				value="#{cc.attrs.bBean.managedBean.selectedSupplier.companyName}"
				saveObject="#{cc.attrs.saveObj}" 
				tooltip="#{lbl['lbl.sm.rpt.profile.tooltip']}" />
			<ac:lovPopup />
