<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<cc:interface>
		<cc:valueHolder name="spinnerInput"  />
		<cc:attribute name="stepFactor" default="1" />
		<cc:attribute name="min" />
		<cc:attribute name="max" />
		<cc:attribute name="disabled" default="false" />
		<cc:attribute name="maxlength" type="java.lang.Integer" />
		<cc:attribute name="size" />
		<cc:attribute name="label" />
		<cc:attribute name="style" />
		<cc:attribute name="pattern" default="0" />
		<cc:attribute name="update" />
		<cc:attribute name="postUpdateListener" />
	</cc:interface>

	<cc:implementation>	
		<p:inputText id="spinnerInput" 
			disabled="#{cc.attrs.disabled}" 
			value="#{cc.attrs.value}"
			size="#{cc.attrs.size}"
			label="#{cc.attrs.label}"
			style="margin-bottom:0px; text-align:right; #{cc.attrs.style}">
			<cc:insertChildren />
			
			<c:if test="#{!empty cc.attrs.maxlength}">
				<f:attribute name="maxlength" value="#{cc.attrs.maxlength}" />
			</c:if>
			
			<f:convertNumber pattern="#{cc.attrs.pattern}" />
			<p:ajax event="blur" process="@this" update="@this #{cc.attrs.update}" listener="#{spinnerBackingBean.valueChangedAction(cc, cc.attrs.value, cc.attrs.stepFactor, cc.attrs.min, cc.attrs.max, cc.attrs.postUpdateListener)}" />
		</p:inputText>
		<h:panelGroup layout="block" 
			style="display:inline-block; vertical-align:top;">
			<p:commandLink id="#{cc.attrs.id}spinUp"
				partialSubmit="true" process="@this" 
				update="spinnerInput #{cc.attrs.update}"
				disabled="#{cc.attrs.disabled}"
				styleClass="ui-icon"
				style="height:10px; background-position:1px -19px; border-top:1px solid #CECECE; border-left:1px solid #CECECE; border-right:1px solid #CECECE; margin-bottom:0px;">
				<f:setPropertyActionListener target="#{cc.attrs.value}" value="#{spinnerBackingBean.getSpinValue(cc, cc.attrs.value, cc.attrs.stepFactor, cc.attrs.min, cc.attrs.max, cc.attrs.postUpdateListener)}" />
			</p:commandLink>
			<p:commandLink id="#{cc.attrs.id}spinDown"
				process="@this" partialSubmit="true"
				update="spinnerInput #{cc.attrs.update}"
				disabled="#{cc.attrs.disabled}"
				styleClass="ui-icon"
				style="height:10px; background-position:-64px -18px; border:1px solid #CECECE; margin-bottom:0px;">
				<f:setPropertyActionListener target="#{cc.attrs.value}" value="#{spinnerBackingBean.getSpinValue(cc, cc.attrs.value, -1*cc.attrs.stepFactor, cc.attrs.min, cc.attrs.max, cc.attrs.postUpdateListener)}" />
			</p:commandLink>
		</h:panelGroup>
	</cc:implementation>
</ui:composition>
