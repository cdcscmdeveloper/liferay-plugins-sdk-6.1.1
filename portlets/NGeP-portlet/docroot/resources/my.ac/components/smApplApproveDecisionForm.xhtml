<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<cc:interface>
		<cc:attribute name="changeRegStatusUpdateId" default="approveApplOutPanelId"/>
		<cc:attribute name="smAppl" required="true" />
		<cc:attribute name="currRegStatus" />
		<cc:attribute name="facilityType" />
		<cc:attribute name="changeCurrRegStatus" default="false" />
		<cc:attribute name="approvedStatusId" />
		<cc:attribute name="regStatusDescList" />
		<cc:attribute name="approvalRemarks" />
		<cc:attribute name="overLapRemarks" />
		<cc:attribute name="valueReqd" default="false" />
		<cc:attribute name="border" default="true" />
		<cc:attribute name="overLappedCategoryExists" default="false" />
	</cc:interface>
	
	<cc:implementation>
		<p:outputPanel id="approveApplOutPanelId">
			<table style="width: 100%" border="#{cc.attrs.border ? 1 : 0}">
				<c:if test="#{cc.attrs.smAppl.applType ne 'C'}">
					<p:outputPanel rendered="#{cc.attrs.smAppl.applType ne 'N'}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sm.curr.regstatus']}" /></td>
							<td>
								<h:outputText value="#{cc.attrs.currRegStatus}"/>
							</td>
						</tr>
					</p:outputPanel>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.panHdr.offFacility']}" /></td>
						<td>
							<h:outputText value="#{lbl['lbl.sm.facility.facilityType.home.office']}" 
								rendered="#{cc.attrs.facilityType eq 'H'}"/>
							<h:outputText value="#{lbl['lbl.sm.facility.facilityType.business.office']}" 
								rendered="#{cc.attrs.facilityType eq 'B'}" />
						</td>
					</tr>
					<p:outputPanel rendered="#{cc.attrs.smAppl.applType ne 'N' and cc.attrs.smAppl.applType ne 'B'}">
						<tr>
							<td style="border-style: none !important;float: right !important;">
								<p:selectBooleanCheckbox value="#{cc.attrs.changeCurrRegStatus}">
									<p:ajax event="change" partialSubmit="true" process="@this"
										update=":#{p:component(cc.attrs.changeRegStatusUpdateId)}" />
								</p:selectBooleanCheckbox>
							</td>
							<td valign="top" style="border-style: none !important;">
								<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.sm.curr.regstatus.change.msg']}" />
							</td>
						</tr>
					</p:outputPanel>
					<p:outputPanel rendered="#{cc.attrs.smAppl.applType eq 'N' or cc.attrs.smAppl.applType eq 'B'
							or cc.attrs.changeCurrRegStatus}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
			
							<td><p:selectOneMenu label="#{lbl['lbl.rpt.rgstStatus']}"
									id="approveSelBox" required="#{cc.attrs.valueReqd}"
									value="#{cc.attrs.approvedStatusId}"
									style="width: 240px;margin-bottom: 5px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems value="#{cc.attrs.regStatusDescList}" var="reg"
										itemLabel="#{reg.statusName}" itemValue="#{reg.pmStatus.statusId}" />
			
								</p:selectOneMenu> <p:message id="approveSelBoxMsg" for="approveSelBox"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
					</p:outputPanel>
				</c:if>
				<tr>
					<td style="vertical-align: top"><p:outputLabel
							value="#{lbl['lbl.sm.remarks.approval']}" /></td>
					<td style="padding-top: 5px;"><p:inputTextarea cols="90"
							style="width : auto;" rows="10"
							value="#{cc.attrs.approvalRemarks}"
							id="rmrksForApprTxtArea" label="#{lbl['lbl.sm.remarks.approval']}"
							validatorMessage="#{lbl['lbl.sm.remarks.approval']} #{lbl['lbl.sm.rmrkLength.thsndCharLimit']}"
							maxlength="2500">
							<f:validateLength maximum="2500" />
						</p:inputTextarea> <p:message id="rmrksForApprTxtAreaMsg" for="rmrksForApprTxtArea"
							showSummary="true" showDetail="false" display="icon" /></td>
				</tr>
				<c:if test="#{cc.attrs.overLappedCategoryExists}">
					<tr>
						<td colspan="2"><p:outputLabel
								value="#{lbl['lbl.sm.remarks.overLap.note1']}" escape="false" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.remarks.overLapping']}" /><p:outputLabel value="*" styleClass="mandatory" /></td>
						<td style="padding-top: 5px;"><p:inputTextarea cols="90"
								style="width : auto;" rows="10" id="rmrksForSplApprTxtArea"
								maxlength="2500"
								value="#{cc.attrs.overLapRemarks}"
								label="#{lbl['lbl.sm.remarks.overLapping']}"
								validatorMessage="#{lbl['lbl.sm.remarks.overLapping']} #{lbl['lbl.sm.rmrkLength.thsndCharLimit']}"
								required="#{cc.attrs.valueReqd}">
								<f:validateLength maximum="2500" />
							</p:inputTextarea> <p:message id="rmrksForSplApprTxtAreaMsg"
								for="rmrksForSplApprTxtArea" showSummary="true" showDetail="false"
								display="icon" /></td>
					</tr>
					<tr>
						<td colspan="2"><p:outputLabel
								value="#{lbl['lbl.sm.remarks.overLap.note2']}" escape="false" /></td>
					</tr>
				</c:if>
			</table>
		</p:outputPanel>
	</cc:implementation>
</ui:composition>
