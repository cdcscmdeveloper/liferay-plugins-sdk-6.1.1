<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<cc:interface>
		<cc:attribute name="dialogName" required="true" />
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="mBean" required="true" />
	</cc:interface>
	<cc:implementation>
		<ui:param name="selectedDraf" value="#{cc.attrs.mBean.selectedDraft}" />
		<c:if test="#{cc.attrs.mBean.selectedDraft.sourceType == ParameterConst.sourceTypeIdSm}">
			<ui:param name="header" value="#{lbl['lbl.sm.comp.exp.update.sm.instruction']}" />
		</c:if>
		<p:dialog id="#{cc.attrs.dialogName}Id"
			widgetVar="#{cc.attrs.dialogName}WV" modal="true" dynamic="true"
			resizable="true" style="width: 70%;" styleClass="pop_up_top"
			header="#{headerTitle}">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.update.sm.instruction']}" />
		</p:dialog>
	</cc:implementation>
</ui:composition>
