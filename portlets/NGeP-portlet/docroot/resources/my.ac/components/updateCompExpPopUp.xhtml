<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<cc:interface>
		<cc:attribute name="dialogName" required="true" />
		<cc:attribute name="fromSM" required="true" />
		<cc:attribute name="fromCT" required="true" />
	</cc:interface>
	<cc:implementation>
		<ui:param name="selectedDraf" value="#{compExpMB.selectedDraft}" />
		<c:if test="#{cc.attrs.fromSM}">
			<ui:param name="headerTitle"
				value="#{lbl['lbl.sm.comp.exp.update.sm.header']}" />
		</c:if>
		<p:dialog id="#{cc.attrs.dialogName}Id"
			widgetVar="#{cc.attrs.dialogName}WV" modal="true" dynamic="true"
			resizable="true" style="width: 70%;" styleClass="pop_up_top"
			header="#{headerTitle}">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.update.sm.instruction']}" />
		</p:dialog>
	</cc:implementation>
</ui:component>
