<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:p="http://primefaces.org/ui"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<cc:interface>
		<cc:attribute name="dialogName" required="true" />
		<cc:attribute name="bBean" required="true" />
		<cc:attribute name="mBean" required="true" />
	</cc:interface>
	<cc:implementation>
		<p:dialog id="#{cc.attrs.dialogName}Id"
			widgetVar="#{cc.attrs.dialogName}WV" modal="true" dynamic="true"
			style="width: 70%;" styleClass="pop_up_top"
			header="#{cc.attrs.mBean.headerTitle}">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sm.comp.exp.update.instruction']}" />
			<table style="table-layout: fixed">
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.project.for']}" /></td>
					<td style="width: 66%"><p:selectOneRadio id="clientType"
							label="#{lbl['lbl.sm.comp.exp.update.project.for']}"
							value="#{cc.attrs.mBean.selectedDraft.clientType}"
							disabled="true">
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.comp.exp.update.client.type.federal']}"
								itemValue="#{ParameterConst.clientTypeFederal}"></f:selectItem>
							<f:selectItem
								itemLabel="#{lbl['lbl.sm.comp.exp.update.client.type.other']}"
								itemValue="#{ParameterConst.clientTypeNonFederal}"></f:selectItem>
						</p:selectOneRadio></td>
				</tr>
				<p:outputPanel
					rendered="#{cc.attrs.mBean.selectedDraft.clientType == ParameterConst.clientTypeFederal}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label mandatory"
								value="#{lbl['lbl.sm.comp.exp.update.client.ori.agency.name']}" /></td>
						<td style="width: 66%"><p:outputLabel
								styleClass="outputLabel-view mandatory"
								value="#{cc.attrs.mBean.selectedDraft.oriAgencyName}" /> <p:graphicImage
								id="oriAgencyNameToolTipsId"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="oriAgencyNameToolTipsId"
								value="#{lbl['lbl.sm.comp.exp.update.client.ori.agency.name.tooltip']}" /></td>
					</tr>
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label"
								value="#{lbl['lbl.sm.comp.exp.update.client.agency.name']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td style="width: 66%"><p:inputText size="60"
								value="#{cc.attrs.mBean.selectedDraft.agencyName}"
								readonly="true" /> <p:commandLink onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()"
								action="#{compExpBB.onClickSearchAgency}" process="@this"
								partialSubmit="true" update=":form">
								<p:graphicImage value="/css/images/design/search.png" />
							</p:commandLink></td>
					</tr>
				</p:outputPanel>
				<p:outputPanel
					rendered="#{cc.attrs.mBean.selectedDraft.clientType == ParameterConst.clientTypeNonFederal}">
					<tr>
						<td style="width: 34%"><p:outputLabel
								styleClass="outputLabel-view-label"
								value="#{lbl['lbl.sm.comp.exp.update.client.agency.name']}" />
						</td>
						<td style="width: 66%"><p:outputLabel
								styleClass="outputLabel-view"
								value="#{cc.attrs.mBean.selectedDraft.agencyName}" /></td>
					</tr>
				</p:outputPanel>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.client.file.ref.no']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:inputText
							value="#{cc.attrs.mBean.selectedDraft.fileReferenceNo}"
							required="true"
							label="#{lbl['lbl.sm.comp.exp.update.client.file.ref.no']}" /> <p:spacer
							width="3px"></p:spacer> <p:inputText
							value="#{cc.attrs.mBean.selectedDraft.fileExtensionNo}" size="3"
							maxlength="3" required="true"
							label="#{lbl['lbl.sm.comp.exp.update.client.file.ref.no']}" /> <p:graphicImage
							id="fileReferenceNoToolTipsId"
							value="/css/images/design/tooltips.png" /> <p:tooltip
							for="fileReferenceNoToolTipsId">
							<img
								src="/NGeP-portlet/images/suratSetujuTerima_fileReference_tooltip.jpeg" />
						</p:tooltip></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.client.loa.no']}" /></td>
					<td style="width: 66%"><p:inputText
							value="#{cc.attrs.mBean.selectedDraft.loaNo}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.client.project.title']}" /></td>
					<td style="width: 66%"><p:outputLabel
							style="word-wrap: break-word;overflow-wrap: break-word;white-space: normal;"
							styleClass="outputLabel-view"
							value="#{cc.attrs.mBean.selectedDraft.title}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.client.contract.value']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{cc.attrs.mBean.selectedDraft.contractValue}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.client.payment.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{cc.attrs.bBean.getParameterDesc(cc.attrs.mBean.selectedDraft.paymentMethod)}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.client.procument.method']}" /></td>
					<td style="width: 66%"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{cc.attrs.bBean.getParameterDesc(cc.attrs.mBean.selectedDraft.procumentMode)}" /></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.contract.eff.date']}" /></td>
					<td style="width: 66%"><h:outputText
							rendered="#{cc.attrs.mBean.selectedDraft.contractEffDate ne null}"
							styleClass="outputLabel-view"
							value="#{cc.attrs.mBean.selectedDraft.contractEffDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText> <p:calendar
							rendered="#{cc.attrs.mBean.selectedDraft.contractEffDate eq null}"
							showOn="button" readonlyInput="true"
							value="#{cc.attrs.mBean.selectedDraft.contractEffDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 66%"><p:calendar showOn="button"
							readonlyInput="true" required="true"
							label="#{lbl['lbl.sm.comp.exp.update.contract.exp.date']}"
							value="#{cc.attrs.mBean.selectedDraft.contractExpDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						</p:calendar></td>
				</tr>
				<tr>
					<td style="width: 34%"><p:outputLabel
							styleClass="outputLabel-view-label"
							value="#{lbl['lbl.sm.comp.exp.update.contract.status']}" /></td>
					<td style="width: 66%"></td>
				</tr>
			</table>
		</p:dialog>
		<ac:smPtjPopup dialogName="agencyNameSearchLov"
			mBean="#{cc.attrs.mBean}" bBean="#{cc.attrs.bBean}" />
	</cc:implementation>
</ui:composition>
