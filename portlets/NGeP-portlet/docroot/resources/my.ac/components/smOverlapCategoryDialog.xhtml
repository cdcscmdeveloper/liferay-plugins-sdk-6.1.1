<ui:component xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<cc:interface>
		<cc:attribute name="dialogHeader" default="#{lbl['lbl.sm.success.dialog.header']}"/>
		<cc:attribute name="dialogWidth" default="1100px" />
		<cc:attribute name="dialogHeight" default="500px" />
		<cc:attribute name="voList" type="java.util.List" required="true" />
		<!--  Start 13362 -->
		<cc:attribute name="showButton" default="" />
		<cc:attribute name="bBean" />
		<!--  end 13362 -->
		<cc:attribute name="voList" type="java.util.List" required="true" />
	</cc:interface>

	<cc:implementation>
			
	<p:dialog id="overlapCategoryDialog" header="#{cc.attrs.dialogHeader}" closable="true"
		widgetVar="overlapCategoryDialog" modal="true" width="#{cc.attrs.dialogWidth}" height="#{cc.attrs.dialogHeight}">
		
		<p:dataTable id="overlapMainDtId" var="vo" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{cc.attrs.voList}" rowKey="#{vo}" rowIndexVar="index" >
			<ac:paginator for="overlapMainDtId" />

			<p:column headerText="#{lbl['lbl.sm.overlapping.category']}">
				<br /><h:outputText value="#{vo.categoryCode}" />&#160;<h:outputText value="#{vo.categoryName}" />
				
				<p:dataTable id="overlapSubDtId" var="voSub" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{vo.overlapInfoList}" rowKey="#{voSub}" rowIndexVar="index">
					<ac:paginator for="overlapSubDtId" />
					
					<p:column style="width : 5%;text-align: center !important;" headerText="#{lbl['lbl.sm.userprofile.num']}">
						<h:outputText value="#{index + 1}" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.name']}" 
						style="width : 15% !important;white-space: normal !important;">
						<h:outputText value="#{voSub.personnelName}" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.idno']}">
						<h:outputText value="#{voSub.identificationNo}" />
					</p:column>
		
					<p:column style="width : 15% !important;white-space: normal !important;"
						headerText="#{lbl['lbl.sm.overlapped.category.personnel.rolename']}" >
						<h:outputText value="#{voSub.role}" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.compname']}" 
						style="width : 15% !important;white-space: normal !important;">
						<h:outputText value="#{voSub.companyName}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.mofno']}">
						<h:outputText value="#{voSub.mofNo}" rendered="#{voSub.mofNo ne 'null'}" />
						<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}" rendered="#{voSub.mofNo eq 'null'}" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.expdate']}">
						<h:outputText value="#{voSub.expDate}" rendered="#{voSub.expDate ne 'null'}" />
						<h:outputText value="#{lbl['lbl.sm.sme.txt.no.available']}" rendered="#{voSub.expDate eq 'null'}" />
					</p:column>
		
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.regno']}">
						<h:outputText value="#{voSub.regNo}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.overlapped.category.personnel.applno']}">
						<h:outputText value="#{voSub.applNo}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sm.application.status']}" 
						style="width : 10% !important;white-space: normal !important;">
						<h:outputText value="#{voSub.applStatus}" />
					</p:column>
					
				</p:dataTable>
		
			</p:column>
		</p:dataTable>
		<!--  Start 13362 -->
		<div style="width: 100%" align="right">
		<p:commandButton  value="#{lbl['lbl.btn.download']}" ajax="false" immediate="true" rendered="#{not empty cc.attrs.showButton}">
				<p:fileDownload value="#{cc.attrs.bBean.generateAndDownloadOverlapCategoryDetailsExcel()}"/>
				<f:ajax execute="@this" render="@form"  />
		</p:commandButton>
		</div>
		<!--  End 13362 -->
	</p:dialog>
			
	</cc:implementation>
</ui:component>
