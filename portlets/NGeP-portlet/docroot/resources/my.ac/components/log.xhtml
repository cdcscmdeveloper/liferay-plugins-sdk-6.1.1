<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"> 
	<cc:interface>
		<cc:attribute name="m" required="true" />
		<cc:attribute name="pr" required="false" />
		<cc:attribute name="in" default="0" required="false" />
	</cc:interface>
	<cc:implementation>
		<div class="log-file-finder" style="visibility: hidden;position: relative; height: 0 !important; width: 0 !important">
			<h:outputText style="font-weight: bolder;" value="#{cc.attrs.pr} - #{cc.attrs.m}"></h:outputText>
		</div>
	</cc:implementation>
</ui:composition>
