<ui:composition
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

<cc:interface>
	<cc:attribute name="okAction" required="true" default="" />
	<cc:attribute name="update" required="true" default="@this" />
	<cc:attribute name="supplierType"   type="java.lang.String" />
	<cc:attribute name="facilityType"   type="java.lang.String"	/>
	<cc:attribute name="paidUpCapital"  type="java.lang.Integer"/>
	<cc:attribute name="categoryType"   type="java.lang.String"	/>
	<cc:attribute name="bumiPercentage" type="java.lang.Integer"/>
	<cc:attribute name="businessTypeCode" type="java.lang.String"/>
	<cc:attribute name="catcodeL1" type="java.lang.String"/>
</cc:interface>

<cc:implementation>

	<p:remoteCommand name="resetAllFields" action="#{categoryCodeSearchBackingBean.resetAllOnShow}" update="catCodePnl" />

	<p:dialog id="catCodePopup"
		header="#{lbl['lbl.pm.select.category']}"
		widgetVar="catCodePopup" modal="true" position="top"
		width="670px" 
		onShow="resetAllFields();">

		<p:messages id="catCodePopupMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		<h:panelGroup id="catCodePnl">
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%">
					<p:outputLabel value="#{lbl['lbl.sc.category.code.search.by']}" />
				</td>
				<td width="80%">
					<p:selectOneRadio id="searchBy"
						value="#{categoryCodeSearchBackingBean.managedBean.searchBy}">
						<f:selectItems value="#{categoryCodeSearchBackingBean.getRadioButtonCodeValues(ParameterTypeConst.categoryCodeDescriptionSearchBy)}" />
						<p:ajax event="change" update="catCodePnl" />
					</p:selectOneRadio>
				</td>
			</tr>
			<c:if test="#{categoryCodeSearchBackingBean.managedBean.searchBy == ParameterConst.categoryCodeSearchByCode}">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.main.category']}" />
				</td>
				<td>
					<h:selectOneMenu id="catCodeLvl1"
						value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl1}"
						style="width: 500px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{categoryCodeSearchBackingBean.retrieveCategoryL1List(cc.attrs.supplierType, cc.attrs.facilityType, cc.attrs.paidUpCapital, cc.attrs.bumiPercentage, cc.attrs.categoryType, cc.attrs.businessTypeCode,cc.attrs.catcodeL1)}" />
						<p:ajax event="change" partialSubmit="true" process="@this" listener="#{categoryCodeSearchBackingBean.resetL2L3CategoryCode}" update="catCodeLvl2,catCodeLvl3" />
					</h:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.sub.category']}" />
				</td>
				<td>
					<h:selectOneMenu id="catCodeLvl2"
						value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl2}"
						style="width: 500px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{categoryCodeSearchBackingBean.retrieveCategoryL2List(categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl1, cc.attrs.supplierType, cc.attrs.facilityType, cc.attrs.paidUpCapital, cc.attrs.bumiPercentage, cc.attrs.categoryType, cc.attrs.businessTypeCode)}" />
						<p:ajax event="change" partialSubmit="true" process="@this" update="catCodeLvl3" />
					</h:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.sub.category.division']}" />
				</td>
				<td>
					<h:selectOneMenu id="catCodeLvl3"
						value="#{categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl3}"
						style="width: 500px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{categoryCodeSearchBackingBean.retrieveCategoryL3List(categoryCodeSearchBackingBean.managedBean.categoryCodeIdLvl2, cc.attrs.supplierType, cc.attrs.facilityType, cc.attrs.paidUpCapital, cc.attrs.bumiPercentage, cc.attrs.categoryType, cc.attrs.businessTypeCode)}" />
						<p:ajax event="change" partialSubmit="true" process="@this" update="@this" />
					</h:selectOneMenu>
				</td>
			</tr>
			</c:if>
			</table>
			
			<c:if test="#{categoryCodeSearchBackingBean.managedBean.searchBy == ParameterConst.categoryCodeSearchByDescription}">
			<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText style="float : left"
					value="#{lbl['lbl.pm.search.category']}" />
			</f:facet>
				<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td width="20%">
						<p:outputLabel value="#{lbl['lbl.pm.category.code']}" />
					</td>
					<td width="80%">
						<p:inputText id="catCode" value="#{categoryCodeSearchBackingBean.managedBean.categoryCode}" 
							size="35" maxlength="100" />
						<p:message id="catCodeMsg" for="catCode" display="icon" />
					</td>
				</tr>
				<tr>
					<td width="20%">
						<p:outputLabel value="#{lbl['lbl.sc.category.description']}" />
					</td>
					<td width="80%">
						<p:inputText id="catDecsr" value="#{categoryCodeSearchBackingBean.managedBean.categoryDesciption}" 
							size="65" maxlength="100" />
						<p:message id="catDecsrMsg" for="catDecsr" display="icon" />
					</td>
				</tr>
				<tr>
					<td colspan="2" class="ppRightBtn">
						<p:commandButton
							value="#{lbl['lbl.btn.search']}"
							action="#{categoryCodeSearchBackingBean.categorySearchAction(cc.attrs.supplierType,cc.attrs.facilityType,cc.attrs.paidUpCapital,cc.attrs.bumiPercentage,cc.attrs.categoryType,cc.attrs.businessTypeCode,cc.attrs.catcodeL1)}" 
							process="catCodePnl" update="catDescrTbl" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{categoryCodeSearchBackingBean.categoryResetAction}" 
							resetValues="true" 
							process="@this" update="catCodePnl" />
					</td>
				</tr>
				</table>
			</p:panel>

			<p:panel toggleable="true" >
				<f:facet name="header">
					<h:outputText style="float : left"
						value="#{lbl['lbl.pm.category.result']}" />
				</f:facet>
				<p:dataTable id="catDescrTbl"
					value="#{categoryCodeSearchBackingBean.categoryDataModel}"
					selectionMode="single"
					selection="#{categoryCodeSearchBackingBean.managedBean.selectedCategoryL3}"
					rowKey="#{pmCategoryL3.categoryL3Id}"
					var="pmCategoryL3" lazy="true" rows="10">
	
					<ac:paginator for="catDescrTbl" />
		
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.category.code']}" />
						</f:facet>
						#{pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}#{pmCategoryL3.pmCategoryL2.categoryL2Code}#{pmCategoryL3.categoryL3Code}
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.main.category']}" />
						</f:facet>
						#{pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.sub.category']}" />
						</f:facet>
						#{pmCategoryL3.pmCategoryL2.categoryName}
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText
								value="#{lbl['lbl.sc.sub.category.division']}" />
							</f:facet>
						#{pmCategoryL3.categoryName}
					</p:column>
				</p:dataTable>
			</p:panel>
			</c:if>
		</h:panelGroup>
		
		<br />

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}"
				action="#{categoryCodeSearchBackingBean.okAction(cc.attrs.okAction)}"
				process="@form"
				update="#{cc.attrs.update}" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				partialSubmit="true" process="@this" update="@this"
				action="#{categoryCodeSearchBackingBean.cancelAction}"
				oncomplete="catCodePopup.hide()" />
		</div>
	</p:dialog>
</cc:implementation>
</ui:composition>
