<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="latitude" 		required="true" />
	<cc:attribute name="longitude" 		required="true" />
	<cc:attribute name="locationName" 	required="false" default="" />
</cc:interface>

<cc:implementation>
	<h:panelGroup id="#{cc.attrs.id}">
		
		<p:remoteCommand name="disableMap" action="#{gmapBackingBean.setRenderMap(false)}" />
		
		<p:dialog id="gmapDialogId" 
			header="#{lbl['lbl.gmap.dialog.title']}"
			widgetVar="dlg" 
			width="625" 
			height="400" 
			modal="true" 
			resizable="false"
			onHide="disableMap();">
		
			<p:panel id="mapPanel">
				
			 	<p:gmap id="geomap" 
			 		center="#{cc.attrs.latitude}, #{cc.attrs.longitude}" 
			 		zoom="15" 
			 		type="HYBRID" 
			 		style="width:100%;height:400px"
					rendered="#{gmapBackingBean.renderMap}"
			 		model="#{gmapBackingBean.retSimpleModel(cc.attrs.latitude, cc.attrs.longitude, cc.attrs.locationName)}" />
			 		
			</p:panel>
			
		</p:dialog>
		
	</h:panelGroup>
</cc:implementation>
</ui:composition>
