<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="smSupplier" required="true" />
	<cc:attribute name="backingBean" required="true" />
</cc:interface>

<cc:implementation>
	<p:selectOneMenu value="#{cc.attrs.smSupplier.localAuthorityId}" 
		required="true"
		rendered="#{cc.attrs.smSupplier.businessType eq 'D' or cc.attrs.smSupplier.businessType eq 'E' 
				or cc.attrs.smSupplier.businessType eq 'G' or cc.attrs.smSupplier.businessType eq 'H'}" 
		disabled="#{cc.attrs.backingBean.getListSize(cc.attrs.backingBean.managedBean.localAuthorityItems) eq 1}"
		label="#{lbl['lbl.sm.local.authority']}"
		style="width:80%" id="localAuthorityId">
		<f:selectItems value="#{cc.attrs.backingBean.managedBean.localAuthorityItems}" />
	</p:selectOneMenu>
	<p:message id="localAuthorityIdMsg" for="localAuthorityId" 
		rendered="#{cc.attrs.smSupplier.businessType eq 'D' or cc.attrs.smSupplier.businessType eq 'E' 
				or cc.attrs.smSupplier.businessType eq 'G' or cc.attrs.smSupplier.businessType eq 'H'}"
		showSummary="true" showDetail="false" display="icon" />	
</cc:implementation>
</ui:composition>
