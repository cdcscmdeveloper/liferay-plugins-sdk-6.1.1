<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:c="http://java.sun.com/jsp/jstl/core"
   	xmlns:ac="http://ac.my/jsf/composite/cc" >
    
<cc:interface>
	<cc:attribute name="id" />
	<cc:attribute name="latitude" required="true" />
	<cc:attribute name="longitude" required="true" />
	<cc:attribute name="address" required="true" />
</cc:interface>

<cc:implementation>
	<h:panelGroup id="#{cc.attrs.id}">

	<ac:gmapScript />

	<ac:gmapInput id="gmapInput" latitude="#{cc.attrs.latitude}" longitude="#{cc.attrs.longitude}" address="#{cc.attrs.address}" />
	
	<ac:gmapDialog id="gmapDialog" latitude="#{cc.attrs.latitude}" longitude="#{cc.attrs.longitude}" />

	</h:panelGroup>
</cc:implementation>
</ui:composition>
