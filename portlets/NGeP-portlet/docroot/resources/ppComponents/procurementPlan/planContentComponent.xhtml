<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:composite="http://java.sun.com/jsf/composite"
xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	

 	<composite:interface>
      	<composite:attribute name="selectedPlan" type="java.lang.Object"/>
      	<composite:attribute name="selectedPlanMaster" type="java.lang.Object"/>
      	<composite:attribute name="viewMode" type="java.lang.String"/>
      	<composite:attribute name="tabId" type="java.lang.String" required="false"/>
   	</composite:interface>
	
	<composite:implementation>
		<p:outputPanel id="opPlanDetailsContent">
		
			<p:tabView widgetVar="tvPlanContentVar" id="tvPlanContent" dynamic="false" cache="false" orientation="top">
				<p:tab id="tPlanHeader" title="#{lbl['lbl.pp.header']}">  
					<p:panel id="pTabPlanHeader" styleClass="ppScrollableHeader">
					<h:inputHidden id="enableDetailFlag" value="#{planBackingBean.managedBean.enableDetail}" />
					<table class="ppTwoTable">
					<!-- 
						<c:if test="#{cc.attrs.viewMode==PPConst.modeApproval}">
							<tr>
								<th>#{lbl['lbl.pp.check.to.approve']}</th>
								<td>
									<p:selectBooleanCheckbox value="#{cc.attrs.selectedPlan.approved}">  
			        				</p:selectBooleanCheckbox>  
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</c:if>
						 -->
						<c:if test="#{cc.attrs.viewMode!=PPConst.modeNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeDraft}">
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.plan.number']}"/></th>
								<td>	
									<p:inputText disabled="true" styleClass="ppDisplayTextM"
										value="#{cc.attrs.selectedPlan.planNo}"/>
									<br/>
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</c:if>
						<tr>
							<th><p:outputLabel value="* #{lbl['lbl.pp.vot.type']}"/></th>
							<td>	
								<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.votType}" styleClass="ppDropDownWidthM"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.votTypeOptions()}"/>
								</p:selectOneMenu>
								<br/>
							</td>
							
							<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextM"
									value="#{cc.attrs.selectedPlan.statusId}"/>
							</td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pp.ministry.code.name']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextM"
									value="#{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.parentOrgProfile.orgCode} / #{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.parentOrgProfile.orgName}"/>
							</td>
							<th><p:outputLabel value="* #{lbl['lbl.pp.plan.type']}"/></th>
							<td>
								<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.planType}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew}" styleClass="ppDropDownWidthM">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.planTypeOptions()}"/>
									<p:ajax event="change" update="pTabPlanHeader, pTabPlanDetails"
										oncomplete="return updateDetailTab()" listener="#{planBackingBean.changePlanType(true)}"  /> 
								</p:selectOneMenu>
							</td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pp.jabatan.code.name']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextM"
									value="#{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.orgCode} / #{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.orgName}" />
							</td>
							<th><p:outputLabel value="* #{lbl['lbl.pp.procurement.mode']}"/></th>
							<td>
								<p:selectOneMenu id="somProcureMode" value="#{cc.attrs.selectedPlanMaster.procurementMode}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew}" styleClass="ppDropDownWidthM">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.procurementModeOptions(cc.attrs.selectedPlanMaster.planType)}"/>
									<p:ajax event="change" update="pTabPlanHeader, pTabPlanDetails"
										oncomplete="return updateDetailTab()" listener="#{planBackingBean.changeProcurementMode()}"  /> 
								</p:selectOneMenu>
							</td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pp.ptj.code.name']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextM"
									value="#{cc.attrs.selectedPlanMaster.orgProfile.orgCode} / #{cc.attrs.selectedPlanMaster.orgProfile.orgName}" /> 
							</td>
							<th><p:outputLabel value="* #{lbl['lbl.pp.plan.description']}"/></th>
							<td>
								<p:inputTextarea cols="40" value="#{cc.attrs.selectedPlan.planDesc}" 
										disabled="#{!cc.attrs.selectedPlan.editable}"/>
							</td>
						</tr>
						<tr>
							<th>&nbsp;</th>
							<td>&nbsp;</td>
							<th><p:outputLabel value="#{lbl['lbl.pp.short.total.estimated.amount']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextM"
									value="#{cc.attrs.selectedPlan.estimatedAmount}"/>
							</td>
						</tr>
						

						<!-- Executing Jabatan -->
						<tr>
							<th><p:outputLabel value="* #{lbl['lbl.pp.executing.jabatan']}"/></th>
							<td>
								<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{cc.attrs.selectedPlanMaster.issueOrgProfile.parentOrgProfile.orgProfileId}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.departmentOptions()}" var="obj" 
										itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
									<p:ajax event="change" update="somIssuePtj"/>
								</p:selectOneMenu>
							</td>
							<th><p:outputLabel value="* #{lbl['lbl.pp.product.segment']}"/></th>
							<td>
								<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlan.unspscSegmentCode}"
									disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew &amp;&amp; 
									!planBackingBean.managedBean.selectedPlan.editable}" styleClass="ppDropDownWidthM">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.unspscSegmentOptions()}" 
										var="obj" itemLabel="#{obj.unspscTitle}" itemValue="#{obj.unspscCode}"/>
									<p:ajax event="change" update="somPpProdFamily" />
								</p:selectOneMenu>
							</td>
						</tr>
						<!-- Executing PTJ -->
						<tr>	
							<th><p:outputLabel value="* #{lbl['lbl.pp.executing.ptj']}"/></th>
							<td>
								<p:selectOneMenu styleClass="ppDropDownWidthM" id="somIssuePtj" value="#{cc.attrs.selectedPlanMaster.issueOrgProfile.orgProfileId}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew 
										|| cc.attrs.selectedPlanMaster.issueOrgProfile.parentOrgProfile.orgProfileId==null}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.divisionOptions(cc.attrs.selectedPlanMaster.issueOrgProfile.parentOrgProfile.orgProfileId)}" 
										var="obj" itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
								</p:selectOneMenu>
							</td>
							<th><p:outputLabel value="* #{lbl['lbl.pp.product.family']}"/></th>
							<td>
								<p:selectOneMenu id="somPpProdFamily" value="#{cc.attrs.selectedPlan.unspscFamilyCode}"
									disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew &amp;&amp; 
									!planBackingBean.managedBean.selectedPlan.editable}" styleClass="ppDropDownWidthM">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.unspscFamilyOptions(planBackingBean.managedBean.selectedPlan.unspscSegmentCode)}" 
										var="obj" itemLabel="#{obj.unspscTitle}" itemValue="#{obj.unspscCode}"/>
									<p:ajax event="change" update="somPpProdClass" />
								</p:selectOneMenu>
							</td>
						</tr>
						<tr>
							<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeProcurement}">
								<th><p:outputLabel value="* #{lbl['lbl.pp.quotation.tender.type']}"/></th>
								<td>
									<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.qtType}"  styleClass="ppDropDownWidthM"
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew}" >
										<f:selectItem itemLabel="#{lbl['lbl.select']}" />
										<f:selectItems value="#{planBackingBean.qtTypeOptions()}" />
									</p:selectOneMenu>
								</td>
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</p:outputPanel>
							<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeExpenditure}">
								<th>&nbsp;</th>
								<td>&nbsp;</td>
								<th><p:outputLabel value="* #{lbl['lbl.pp.product.class']}"/></th>
								<td>
								<p:selectOneMenu id="somPpProdClass" value="#{cc.attrs.selectedPlan.unspscClassCode}"
									disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew &amp;&amp; 
									!planBackingBean.managedBean.selectedPlan.editable}" styleClass="ppDropDownWidthM">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.unspscClassOptions(planBackingBean.managedBean.selectedPlan.unspscFamilyCode)}" 
										var="obj" itemLabel="#{obj.unspscTitle}" itemValue="#{obj.unspscCode}"/>
								</p:selectOneMenu>
								</td>
							</p:outputPanel>
						</tr>
						<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeProcurement}">
							<tr>
								<th><p:outputLabel value="#{lbl['lbl.pp.item.origin.type']}"/></th>
								<td>
									<p:selectOneMenu id="somItemOrigin" value="#{cc.attrs.selectedPlanMaster.itemOrigin}" 
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew}" styleClass="ppDropDownWidthM">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.itemOriginTypeOptions()}" />
									</p:selectOneMenu>
								</td>
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</p:outputPanel>
						<tr>
							<th><p:outputLabel value="* #{lbl['lbl.pp.plan.approver']}"/></th>
							<td>
								<p:selectOneMenu value="#{cc.attrs.selectedPlan.approver.userId}" styleClass="ppDropDownWidthM"
									disabled="#{!cc.attrs.selectedPlan.editable}" >
									<f:selectItem itemLabel="#{lbl['lbl.select']}" />
									<f:selectItem itemLabel="USER005" itemValue="39" />
									<f:selectItem itemLabel="USER006" itemValue="40" />
									<f:selectItem itemLabel="USER007" itemValue="41" />
								</p:selectOneMenu>
							</td>
							
					        <th>&nbsp;</th>
							<td>&nbsp;</td>
						</tr>
						<tr>
							<th><p:outputLabel value="* #{lbl['lbl.pp.require.verification']}"/></th>
							<td>
								<p:selectOneRadio  id="sorPvo" required="false" value="#{cc.attrs.selectedPlan.submissionType}"
									disabled="#{!cc.attrs.selectedPlan.editable}">
									<f:selectItem itemLabel="Yes" itemValue="V" />
									<f:selectItem itemLabel="No" itemValue="A" />
									<p:ajax event="change" update="opPvo, sorPvoLvl" />
								</p:selectOneRadio> 
					        </td>
					        
					        <th>&nbsp;</th>
							<td>&nbsp;</td>
						</tr>
						<tr>
							<th><p:outputLabel value="* #{lbl['lbl.pp.verification.level']}"/></th>
							<td>
								 <p:selectOneRadio disabled="#{cc.attrs.selectedPlan.submissionType=='A'
								 	|| !cc.attrs.selectedPlan.brandNew}" 
									value="#{cc.attrs.selectedPlan.multiLevel}" id="sorPvoLvl">  
						            <f:selectItems value="#{planBackingBean.verificationLevelOptions()}" /> &nbsp;
						            <p:ajax event="change" update="opPvo" />
						        </p:selectOneRadio> 
					        </td>
				         	<th><p:outputLabel value="* #{lbl['lbl.pp.plan.verification.officer']}"/></th>
				         	
							<td>
								<p:outputPanel id="opPvo">	
									<ui:repeat var="vo" value="#{cc.attrs.selectedPlan.verificationOfficers}" varStatus="status">
										<ui:fragment rendered="#{status.index==0}">
											<p:selectOneMenu value="#{vo.userId}" styleClass="ppDropDownWidthM"
												disabled="#{cc.attrs.selectedPlan.submissionType=='A'
													|| !cc.attrs.selectedPlan.brandNew}">
												<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
												<f:selectItem itemLabel="USER009" itemValue="43" />
												<f:selectItem itemLabel="USER033" itemValue="67" />
												<f:selectItem itemLabel="USER034" itemValue="68" />
												<f:selectItem itemLabel="USER036" itemValue="70" />
											</p:selectOneMenu>
										</ui:fragment>
										<ui:fragment rendered="#{status.index&gt;0}">
											<p:selectOneMenu value="#{vo.userId}" styleClass="ppDropDownWidthM"
												disabled="#{cc.attrs.selectedPlan.submissionType=='A'
													|| !cc.attrs.selectedPlan.multiLevel
													|| !cc.attrs.selectedPlan.brandNew}">
												<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
												<f:selectItem itemLabel="USER009" itemValue="43" />
												<f:selectItem itemLabel="USER033" itemValue="67" />
												<f:selectItem itemLabel="USER034" itemValue="68" />
												<f:selectItem itemLabel="USER036" itemValue="70" />
											</p:selectOneMenu>
										</ui:fragment>
										<br/>
									</ui:repeat>
								</p:outputPanel>
							</td>
				        </tr>
				        
						<c:if test="#{cc.attrs.viewMode==PPConst.modeVerification || cc.attrs.viewMode==PPConst.modeApproval}">
							<!-- Revision Types -->
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.revision.type']}"/></th>
								<td>
									<p:selectOneRadio value="#{cc.attrs.selectedPlan.selfRevise}" required="false" id="sorRevType">  
							            <f:selectItem itemLabel="#{lbl['lbl.pp.self.revise']}" itemValue="true" /> &nbsp;
							            <f:selectItem itemLabel="#{lbl['lbl.pp.send.to.officer']}" itemValue="false" /> &nbsp;
							        </p:selectOneRadio>  
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
							<!-- Rejection Reason -->
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.rejection.reason']}"/></th>
								<td colspan="3">
									<p:selectOneMenu value="#{cc.attrs.selectedPlan.pmRejectReasonIds}" 
										converter="javax.faces.Long" >  
							            <f:selectItems value="#{planBackingBean.rejectionReasonOptions()}"
							            	 var="obj" itemLabel="#{obj.reasonDesc}" itemValue="#{obj.pmReason.reasonId}"  />
					            	    <f:selectItem itemLabel="Others" itemValue="0" />  
						            	<p:ajax event="change" listener="#{planBackingBean.customReason}" update="itRejectOthers"/>
							        </p:selectOneMenu>  
								</td>
								<td>&nbsp;</td>
							</tr>
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.others']}"/></th>
								<td>
									<p:inputText id="itRejectOthers" value="#{cc.attrs.selectedPlan.customReason}" 
										disabled="#{!planBackingBean.managedBean.reasonRejectOther}" />  
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</c:if>
						
					</table>
					
					<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeProcurement}">
						<ui:include src="details/itemDetailsPp.xhtml"/>
					</p:outputPanel>
					
					<!-- Remarks -->
					<p:panel id="pTabPlanRmk" toggleable="true" header="#{lbl['lbl.pp.remarks']}">
						<p:dataGrid value="#{cc.attrs.selectedPlan.ppRemarks}" var="remarkVar" 
							rowIndexVar="remarkIndex" columns="1" >
							<table>
								<tr>
									<td rowspan="2" valign="top">
										<p:graphicImage styleClass="smallUserImage" value="#{planBackingBean.userImagePath(remarkVar.createdByObj.loginId)}" />
									</td>
									<td width="5"></td>
									<td>
										<h:outputText value="#{remarkVar.createdByObj.loginId}"></h:outputText>,
										<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
											<f:convertDateTime pattern="#{PPConst.datetimeDisplayPattern}" />
										</h:outputText>
									</td>
								</tr>
								<tr>
									<td></td>
									<td>
										<p:inputTextarea cols="60" value="#{remarkVar.remark}" 
											disabled="#{(fn:length(cc.attrs.selectedPlan.ppRemarks)-1)!=remarkIndex}" /> 
									</td>
								</tr>
							</table>
						</p:dataGrid>
					</p:panel>
					</p:panel>
				</p:tab>
				<!-- Details -->
				<p:tab id="tPlanDetails" title="#{lbl['lbl.pp.details']}" disabled="#{!planBackingBean.managedBean.enableDetail}">
					<p:panel id="pTabPlanDetails" styleClass="ppScrollableDet">
						<ui:include src="#{planBackingBean.managedBean.dynamicDetailsName}"/>
					</p:panel>
				</p:tab>
			</p:tabView>
			
		</p:outputPanel>
	</composite:implementation>
</ui:composition>
