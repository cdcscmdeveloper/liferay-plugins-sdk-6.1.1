<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:composite="http://java.sun.com/jsf/composite">
	

 	<composite:interface>
      	<composite:attribute name="selectedPlan" type="java.lang.Object"/>
      	<composite:attribute name="selectedPlanMaster" type="java.lang.Object"/>
      	<composite:attribute name="viewMode" type="java.lang.String"/>
   	</composite:interface>
	
	<composite:implementation>
		<p:outputPanel id="opPlanDetailsContent">
			
			<p:tabView widgetVar="tvPlanContentVar" id="tvPlanContent" dynamic="false" cache="false" orientation="top">
				
				<p:tab id="tPlanHeader" title="#{lbl['lbl.pp.header']}">  
					<p:panel id="pTabPlanHeader">
					
					<h:inputHidden id="enableMtoFlag" value="#{planBackingBean.managedBean.enableMto}" />
					<h:inputHidden id="enableDetailFlag" value="#{planBackingBean.managedBean.enableDetail}" />
					<table class="ppThreePartsTable">
					<!-- 
						<c:if test="#{cc.attrs.viewMode==PPConst.modeApproval}">
							<tr>
								<th>#{lbl['lbl.pp.check.to.approve']}</th>
								<td>
									<p:selectBooleanCheckbox value="#{cc.attrs.selectedPlan.approved}">  
			        				</p:selectBooleanCheckbox>  
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</c:if>
						 -->
						<c:if test="#{cc.attrs.viewMode!=PPConst.modeNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeDraft}">
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.plan.number']}"/></th>
								<td>	
									<p:inputText disabled="true" styleClass="ppDisplayTextSmall"
										value="#{cc.attrs.selectedPlan.planNo}"/>
									<br/>
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</c:if>
						<tr>
							<th>* <p:outputLabel value="#{lbl['lbl.pp.vot.type']}"/></th>
							<td>	
								<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.votType}" disabled="#{!cc.attrs.selectedPlanMaster.brandNew}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.votTypeOptions()}"/>
									<p:ajax event="change" update="somProjList, somMaksudCode"  /> 
								</p:selectOneMenu>
								<br/>
							</td>
							
							<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextSmall"
									value="#{cc.attrs.selectedPlan.statusId}"/>
							</td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pp.ministry.code.name']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextSmall"
									value="#{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.parentOrgProfile.orgCode} / #{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.parentOrgProfile.orgName}"/>
							</td>
							
							<th>* <p:outputLabel value="#{lbl['lbl.pp.procurement.mode']}"/></th>
							<td>
								<p:selectOneMenu id="procurementMode" value="#{cc.attrs.selectedPlanMaster.procurementMode}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew || cc.attrs.selectedPlanMaster.mtoPlan}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.procurementModeOptions()}"/>
									<p:ajax event="change" update="pTabPlanHeader, pTabPlanDetails, enableDetailFlag" oncomplete="return updateMtoTab()"
										listener="#{planBackingBean.updateViewMode(true)}"  /> <!--  update=":form:tvPlan:tabM" -->
								</p:selectOneMenu>
							</td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pp.jabatan.code.name']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextSmall"
									value="#{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.orgCode} / #{cc.attrs.selectedPlanMaster.orgProfile.parentOrgProfile.orgName}" />
							</td>
							
							<th>* <p:outputLabel value="#{lbl['lbl.pp.plan.description']}"/></th>
							<td>
								<p:inputText value="#{cc.attrs.selectedPlan.planDesc}" disabled="#{!cc.attrs.selectedPlan.editable}"/>
							</td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pp.ptj.code.name']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextSmall"
									value="#{cc.attrs.selectedPlanMaster.orgProfile.orgCode} / #{cc.attrs.selectedPlanMaster.orgProfile.orgName}" /> 
							</td>
							
							<th><p:outputLabel value="#{lbl['lbl.pp.project.name']}"/></th>
							<td>
								<p:selectOneMenu id="somProjList" value="#{cc.attrs.selectedPlanMaster.projectId}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew || cc.attrs.selectedPlanMaster.votType!=PPConst.votPs}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItem itemLabel="Project Name ABC"  itemValue="1"/>
								</p:selectOneMenu>
							</td>
						</tr>
						<tr>
							<th>&nbsp;</th>
							<td>&nbsp;</td>
							
							<th><p:outputLabel value="#{lbl['lbl.pp.total.estimated.amount']}"/></th>
							<td>
								<p:inputText disabled="true" styleClass="ppDisplayTextSmall"
									value="#{cc.attrs.selectedPlan.estimatedAmount}"/>
							</td>
						</tr>
						
						<!-- Issue/Received/Charge PTJ -->
						<tr>
							<th>* <p:outputLabel value="#{lbl['lbl.pp.issue.ptj']}"/></th>
							<td>
								<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.issueOrgProfile.parentOrgProfile.orgProfileId}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.departmentOptions()}" var="obj" 
										itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
									<p:ajax event="change" update="somIssuePtj"/>
								</p:selectOneMenu>
							</td>
							
							<th>* <p:outputLabel value="#{lbl['lbl.pp.issue.ptj']}"/></th>
							<td>
								<p:selectOneMenu id="somIssuePtj" value="#{cc.attrs.selectedPlanMaster.issueOrgProfile.orgProfileId}"
									disabled="#{!cc.attrs.selectedPlanMaster.brandNew 
										|| cc.attrs.selectedPlanMaster.issueOrgProfile.parentOrgProfile.orgProfileId==null}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
									<f:selectItems value="#{planBackingBean.divisionOptions(cc.attrs.selectedPlanMaster.issueOrgProfile.parentOrgProfile.orgProfileId)}" 
										var="obj" itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
								</p:selectOneMenu>
							</td>
						</tr>
						<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeExpenditure}">
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.received.jabatan']}"/></th>
								<td>
									<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.receivedOrgProfile.parentOrgProfile.orgProfileId}"
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.departmentOptions()}" var="obj" 
											itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
										<p:ajax event="change" update="somReceivedPtj"/>
									</p:selectOneMenu>
								</td>
								
								<th>* <p:outputLabel value="#{lbl['lbl.pp.received.ptj']}"/></th>
								<td>
									<p:selectOneMenu id="somReceivedPtj" value="#{cc.attrs.selectedPlanMaster.receivedOrgProfile.orgProfileId}"
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew  
											|| cc.attrs.selectedPlanMaster.receivedOrgProfile.parentOrgProfile.orgProfileId==null}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.divisionOptions(cc.attrs.selectedPlanMaster.receivedOrgProfile.parentOrgProfile.orgProfileId)}" 
											var="obj" itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
									</p:selectOneMenu>
								</td>
							</tr>
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.charge.jabatan']}"/></th>
								<td>
									<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.chargeOrgProfile.parentOrgProfile.orgProfileId}"
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.departmentOptions()}" var="obj" 
											itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
										<p:ajax event="change" update="somChargePtj"/>
									</p:selectOneMenu>
								</td>
								
								<th>* <p:outputLabel value="#{lbl['lbl.pp.charge.ptj']}"/></th>
								<td>
									<p:selectOneMenu id="somChargePtj" value="#{cc.attrs.selectedPlanMaster.chargeOrgProfile.orgProfileId}"
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew 
											|| cc.attrs.selectedPlanMaster.chargeOrgProfile.parentOrgProfile.orgProfileId==null}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.divisionOptions(cc.attrs.selectedPlanMaster.chargeOrgProfile.parentOrgProfile.orgProfileId)}" 
											var="obj" itemLabel="#{obj.orgName}" itemValue="#{obj.orgProfileId}"  />
									</p:selectOneMenu>
								</td>
							</tr>
						</p:outputPanel>
						

						<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeExpenditure}">
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.fulfillment.type']}"/></th>
								<td>
									<p:selectOneMenu id="somFulfillment" value="#{cc.attrs.selectedPlanMaster.fulfilmentType}" 
										disabled="#{cc.attrs.selectedPlanMaster.procurementMode==PPConst.procurementDirectPurchase || 
										!cc.attrs.selectedPlanMaster.brandNew}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
										<f:selectItems value="#{planBackingBean.fulfillmentTypeOptions()}"/>
										<p:ajax event="change" listener="#{planBackingBean.enableDetailTab}" 
											update="enableDetailFlag, pTabPlanDetails" oncomplete="return updateDetailTab()" />
									</p:selectOneMenu>
									<p:tooltip for="somFulfillment" value="Fade effect is used by default" showEffect="fade" hideEffect="fade" />
								</td>
								
								<th>* <p:outputLabel value="#{lbl['lbl.pp.favourite.options']}"/></th>
								<td>
									<p:selectOneRadio id="sorFavOpt" value="#{cc.attrs.selectedPlan.favouriteOption}" 
										disabled="#{cc.attrs.selectedPlanMaster.procurementMode==PPConst.procurementExistingContract 
										|| !cc.attrs.selectedPlanMaster.brandNew}">  
							            <f:selectItems value="#{planBackingBean.favouriteOptions()}"/>
							            <p:ajax event="change"  listener="#{planBackingBean.enableDetailTab}" update="pTabPlanDetails" />
							        </p:selectOneRadio>  
							        <p:tooltip for="sorFavOpt" value="Fade effect is used by default" showEffect="fade" hideEffect="fade" />
								</td>
							</tr>
							<tr>
								<th><p:outputLabel value="#{lbl['lbl.pp.maksud.code']}"/></th>
								<td>
									<p:selectOneMenu id="somMaksudCode" value="#{cc.attrs.selectedPlanMaster.maksudId}" 
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew || cc.attrs.selectedPlanMaster.votType!=PPConst.votWithout}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
										<f:selectItems var="obj" itemLabel="#{obj.maksudCode}" itemValue="#{obj.maksudId}" 
											value="#{planBackingBean.maksudCodeOptions()}"/> 
										<p:ajax event="change" update="pTabPlanDetails" />
									</p:selectOneMenu>
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
				
						</p:outputPanel>
						

						<p:outputPanel rendered="#{cc.attrs.selectedPlanMaster.planType==PPConst.planTypeProcurement}">
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.quotation.tender.type']}"/></th>
								<td>
									<p:selectOneMenu value="#{cc.attrs.selectedPlanMaster.qtType}" 
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew}" >
										<f:selectItem itemLabel="#{lbl['lbl.select']}" />
										<f:selectItems value="#{planBackingBean.qtTypeOptions()}" />
									</p:selectOneMenu>
								</td>
								
								<th><p:outputLabel value="#{lbl['lbl.pp.item.origin.type']}"/></th>
								<td>
									<p:selectOneMenu id="somItemOrigin" value="#{cc.attrs.selectedPlanMaster.itemOrigin}" 
										disabled="#{!cc.attrs.selectedPlanMaster.brandNew || cc.attrs.selectedPlanMaster.mtoPlan}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.itemOriginTypeOptions()}" />
										<p:ajax event="change" listener="#{planBackingBean.updateMtoFlag}" update="sorMto, enableMtoFlag" 
											oncomplete="return updateMtoTab()"/><!-- :form:tvPlan,  -->
									</p:selectOneMenu>
								</td>
							</tr>
							<tr>
								<th>&nbsp;</th>
								<td>&nbsp;</td>
								
								<th>* <p:outputLabel value="#{lbl['lbl.pp.mto.required']}"/></th>
								<td>
									<p:selectOneRadio required="false" id="sorMto" value="#{cc.attrs.selectedPlanMaster.requiredMto}" 
										disabled="#{planBackingBean.lockMto()}" >  
						            	<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
										<p:ajax event="change" listener="#{planBackingBean.updateMtoFlag}" update="enableMtoFlag"
											oncomplete="return updateMtoTab()"/><!--  update=":form:tvPlan" -->
							        </p:selectOneRadio>  
								</td>
							</tr>
						</p:outputPanel>

						<tr>
							<th>* <p:outputLabel value="#{lbl['lbl.pp.plan.approver']}"/></th>
							<td>
								<p:selectOneMenu value="#{cc.attrs.selectedPlan.approver.userId}"
									disabled="#{!cc.attrs.selectedPlan.editable}" >
									<f:selectItem itemLabel="#{lbl['lbl.select']}" />
									<f:selectItem itemLabel="Lailah" itemValue="1" />
								</p:selectOneMenu>
							</td>
							
					        <th>&nbsp;</th>
							<td>&nbsp;</td>
						</tr>
						<tr>
							<th>* <p:outputLabel value="#{lbl['lbl.pp.require.verification']}"/></th>
							<td>
								<p:selectOneRadio  id="sorPvo" required="false" value="#{cc.attrs.selectedPlan.submissionType}"
									disabled="#{!cc.attrs.selectedPlan.editable}">
									<f:selectItem itemLabel="Yes" itemValue="V" />
									<f:selectItem itemLabel="No" itemValue="A" />
									<p:ajax event="change" update="opPvo, sorPvoLvl" />
								</p:selectOneRadio> 
					        </td>
					        
					        <th>&nbsp;</th>
							<td>&nbsp;</td>
						</tr>
						<tr>
							<th>* <p:outputLabel value="#{lbl['lbl.pp.verification.level']}"/></th>
							<td>
								 <p:selectOneRadio disabled="#{cc.attrs.selectedPlan.submissionType=='A'
								 	|| !cc.attrs.selectedPlan.brandNew}" 
									value="#{cc.attrs.selectedPlan.multiLevel}" id="sorPvoLvl">  
						            <f:selectItems value="#{planBackingBean.verificationLevelOptions()}" /> &nbsp;
						            <p:ajax event="change" update="opPvo" />
						        </p:selectOneRadio> 
					        </td>
				         	<th>* <p:outputLabel value="#{lbl['lbl.pp.plan.verification.officer']}"/></th>
				         	
							<td>
								<p:outputPanel id="opPvo">	
									<ui:repeat var="vo" value="#{cc.attrs.selectedPlan.verificationOfficers}" varStatus="status">
										<ui:fragment rendered="#{status.index==0}">
											<p:selectOneMenu value="#{vo.userId}"
												disabled="#{cc.attrs.selectedPlan.submissionType=='A'
													|| !cc.attrs.selectedPlan.brandNew}">
												<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
												<f:selectItem itemLabel="Khai" itemValue="2" />
												<f:selectItem itemLabel="Tan" itemValue="3" />
												<f:selectItem itemLabel="Alex" itemValue="4" />
											</p:selectOneMenu>
										</ui:fragment>
										<ui:fragment rendered="#{status.index&gt;0}">
											<p:selectOneMenu value="#{vo.userId}"
												disabled="#{!cc.attrs.selectedPlan.submissionType
													|| !cc.attrs.selectedPlan.multiLevel
													|| !cc.attrs.selectedPlan.brandNew}">
												<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
												<f:selectItem itemLabel="Khai" itemValue="2" />
												<f:selectItem itemLabel="Tan" itemValue="3" />
												<f:selectItem itemLabel="Alex" itemValue="4" />
											</p:selectOneMenu>
										</ui:fragment>
										<br/>
									</ui:repeat>
								</p:outputPanel>
							</td>
				        </tr>
				        
						<c:if test="#{cc.attrs.viewMode==PPConst.modeVerification || cc.attrs.viewMode==PPConst.modeApproval}">
							<!-- Revision Types -->
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.revision.type']}"/></th>
								<td>
									<p:selectOneRadio value="#{cc.attrs.selectedPlan.selfRevise}" required="false" id="sorRevType">  
							            <f:selectItem itemLabel="#{lbl['lbl.pp.self.revise']}" itemValue="true" /> &nbsp;
							            <f:selectItem itemLabel="#{lbl['lbl.pp.send.to.officer']}" itemValue="false" /> &nbsp;
							        </p:selectOneRadio>  
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
							<!-- Rejection Reason -->
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.rejection.reason']}"/></th>
								<td colspan="3">
									<p:selectManyCheckbox value="#{cc.attrs.selectedPlan.pmRejectReasonIds}" converter="javax.faces.Long" >  
							            <f:selectItems value="#{planBackingBean.rejectionReasonOptions()}"
							            	 var="obj" itemLabel="#{obj.reasonDesc}" itemValue="#{obj.pmReason.reasonId}"  />
					            	    <f:selectItem itemLabel="Others" itemValue="0" />  
						            	<p:ajax event="change" listener="#{planBackingBean.customReason}" update="itRejectOthers"/>
							        </p:selectManyCheckbox>  
								</td>
								<td>&nbsp;</td>
							</tr>
							<tr>
								<th>* <p:outputLabel value="#{lbl['lbl.pp.others']}"/></th>
								<td>
									<p:inputText id="itRejectOthers" value="#{cc.attrs.selectedPlan.customReason}" 
										disabled="#{!planBackingBean.managedBean.reasonRejectOther}" />  
								</td>
								
								<th>&nbsp;</th>
								<td>&nbsp;</td>
							</tr>
						</c:if>
					</table>
					</p:panel>
					<br/>
					
					<br/>
				</p:tab>
				<!-- Details -->
				<p:tab id="tPlanDetails" title="#{lbl['lbl.pp.details']}" disabled="#{!planBackingBean.managedBean.enableDetail}">
					<div class="ppScrollableDet">  
						<p:panel id="pTabPlanDetails">
							<ui:include src="#{planBackingBean.managedBean.dynamicDetailsName}"/>
						</p:panel>
					</div>
				</p:tab>
				<!-- Remarks -->
				<p:tab id="tPlanRmk" title="#{lbl['lbl.pp.remarks']}">
					<br/>  
					<p:panel id="pTabPlanRmk">
						<p:dataTable id="dtPlanRemark" styleClass="ppRmkList" var="remarkObj" rowIndexVar="rowIndex"
								value="#{cc.attrs.selectedPlan.ppRemarks}"
								emptyMessage="#{lbl['lbl.pp.pls.add.item']}">  
								<!-- 
		                        <p:column headerText="#{lbl['lbl.pp.seq']}">  
		                            #{rowIndex+1}
		                        </p:column>   
		                         -->
		                        <p:column headerText="#{lbl['lbl.pp.comment']}">  
		                            <p:inputTextarea value="#{remarkObj.remark}" rows="2" cols="50" 
		                            	disabled="#{!remarkObj.brandNew}" />
		                        </p:column>  
		                        <p:column headerText="#{lbl['lbl.pp.created.by']}">  
		                            <p:inputText value="#{remarkObj.createdBy}" disabled="true" />  
		                        </p:column> 
		                        <p:column headerText="#{lbl['lbl.pp.created.date']}">  
		                            <p:inputText value="#{remarkObj.createdDate}" disabled="true" />  
		                        </p:column>  
		                </p:dataTable>  
						<div class="ppRightBtn">
							<p:commandButton id="cbAddPlanRemark" value="#{lbl['lbl.pp.add']}" update="dtPlanRemark"
								action="#{planBackingBean.addPlanRemark()}" icon="ui-icon-add" />
						</div>
					</p:panel>
				</p:tab>
			</p:tabView>
			
		</p:outputPanel>
	</composite:implementation>
</ui:composition>
