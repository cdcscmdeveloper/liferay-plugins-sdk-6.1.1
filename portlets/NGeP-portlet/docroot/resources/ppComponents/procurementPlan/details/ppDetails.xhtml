<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanPp">
		
 		
 		
		<!-- Sourcing Activities -->
		<p:panel header="#{lbl['lbl.pp.sourcing.activities']}" toggleable="true" >
			<p:dataTable id="dtSrcAct" styleClass="ppFixTdWidth" var="qtActivity" rowIndexVar="rowIndex"
				value="#{cc.attrs.selectedPlan.allPpQtActivities}"
				emptyMessage="..">   
				<!-- 
				<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
	               	#{rowIndex+1}
	            </p:column> 
	             -->  
	            <p:column headerText="#{lbl['lbl.pp.activity.name']}">  
		            #{qtActivity.pmBusinessActivity.activityName}
	            </p:column>     
	           	<p:column headerText="#{lbl['lbl.pp.kpi.sla']}">  
		       		#{qtActivity.pmBusinessActivity.slaDay}
	            </p:column>   
	            <p:column headerText="#{lbl['lbl.pp.planned.activity.startdate']}">  
		             <p:calendar showOn="button" value="#{qtActivity.planStartDate}" pattern="MM/dd/yyyy" 
		             	disabled="#{!cc.attrs.selectedPlan.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
		             	<p:ajax event="dateSelect" update="ipEndDate" listener="#{planBackingBean.calculateActEndDate(qtActivity)}"  /> 
		             	<p:ajax event="change" update="ipEndDate" listener="#{planBackingBean.calculateActEndDate(qtActivity)}"  />
		             </p:calendar>
	            </p:column>  
	            <p:column headerText="#{lbl['lbl.pp.planned.activity.enddate']}">  
	            	<p:calendar showOn="button" id="ipEndDate" value="#{qtActivity.planEndDate}" pattern="MM/dd/yyyy"
		             	disabled="true"/>
		        
	            </p:column>   
	       	</p:dataTable>  
		</p:panel>
	
	
	</p:outputPanel>
	<!-- mindate -->
	
	
	
</ui:composition>
