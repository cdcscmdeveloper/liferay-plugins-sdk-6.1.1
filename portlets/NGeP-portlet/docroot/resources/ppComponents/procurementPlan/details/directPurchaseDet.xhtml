<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opEpDirectPurchase">
		
		<!-- Top Button -->
		<div class="ppRightBtn">
			<!-- update="tvPlanContent:dtEpItemDetails" -->
			<p:commandButton id="cbConfirm" value="#{lbl['lbl.pp.confirm']}" action="#{planBackingBean.addPpPlanToList()}"
			  onclick="dlItemDetailsDpModal.hide()" oncomplete="dlItemDetailsDpModal.hide()"  process="opEpDirectPurchase"
			  update="dtEpPlanItem"  />
			&nbsp; 
			<p:commandButton id="cbCancel" value="#{lbl['lbl.pp.cancel']}" onclick="dlItemDetailsDpModal.hide()" 
				immediate="true"/>&nbsp;
		</div>
		<!-- Sub Header -->
		<p:panel id="pSubDirectPurchase" header="#{lbl['lbl.pp.item.details.form']}" toggleable="true">
			<table width="70%" class="ppTwoPartsTable ppMedWidth">
				<tr>
					<th>#{lbl['lbl.pp.planned.activities.startmonth']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlanItem.planStartMonth}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
							<f:selectItems value="#{planBackingBean.shortMonths()}"/>
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<th>#{lbl['lbl.pp.planned.activities.endmonth']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlanItem.planEndMonth}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
							<f:selectItems value="#{planBackingBean.shortMonths()}"/>
						</p:selectOneMenu>
					</td>
				</tr>
			</table>
		</p:panel>
		<!-- Details -->
		<p:panel id="pItemDetailsDp" header="#{lbl['lbl.pp.details']}" toggleable="true">
			<!-- Item List -->
			<ui:include src="itemList.xhtml"/>
	    	<br/>
	    	<br/>
			<!-- Item Details -->
			<div class="ppItemDetails">
				<ui:include src="itemDetails.xhtml"/>
			</div>
		</p:panel>
	</p:outputPanel>
</ui:composition>
