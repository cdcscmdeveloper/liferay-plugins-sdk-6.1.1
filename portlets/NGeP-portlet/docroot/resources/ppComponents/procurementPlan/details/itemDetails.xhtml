<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:outputPanel id="pItemDetails">

		<table class="ppTwoPartsTable">
			<c:if test="#{cc.attrs.viewMode==PPConst.modeApproval || cc.attrs.viewMode==PPConst.modeVerification}">
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.require.revision']}"/></th>
					<td>
						<p:selectBooleanCheckbox value="#{planBackingBean.managedBean.selectedItem.revisionRequired}" /> 
					</td>
					<th></th>
					<td></td>
	    		</tr>
    		</c:if>
			<tr>
				<td colspan="4">
					<p:panel  header="#{lbl['lbl.pp.item.details']}" toggleable="true" >
						<table class="ppThreePartsTable">
						<tr>
							<th><p:outputLabel value="* #{lbl['lbl.pp.gosodo.code']}"/></th>
							<td>
								<p:selectOneMenu value="#{planBackingBean.managedBean.selectedItem.goId}"
									disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
										!planBackingBean.managedBean.selectedItem.editable}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.goOptions()}" 
											var="obj" itemLabel="#{obj.pmGo.goCode}" itemValue="#{obj.budgetId}" />
									<p:ajax event="change" update="somSo"/>
								</p:selectOneMenu>
								<p:selectOneMenu id="somSo" value="#{planBackingBean.managedBean.selectedItem.soId}"
									disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
										!planBackingBean.managedBean.selectedItem.editable}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.soOptions(planBackingBean.managedBean.selectedItem.goId)}" 
											var="obj" itemLabel="#{obj.soCode}" itemValue="#{obj.soId}" />
									<p:ajax event="change" update="somDo"/>
								</p:selectOneMenu>
								<p:selectOneMenu  id="somDo" value="#{planBackingBean.managedBean.selectedItem.budgetAllocDtlId}"
									disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
										!planBackingBean.managedBean.selectedItem.editable}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
									<f:selectItems value="#{planBackingBean.doOptions(
										planBackingBean.managedBean.selectedItem.goId, planBackingBean.managedBean.selectedItem.soId)}" 
											var="obj" itemLabel="#{obj.pmDo.doCode}" itemValue="#{obj.budgetAllocDtlId}" />
									<p:ajax event="change" listener="#{planBackingBean.selectedGoSoDo(planBackingBean.managedBean.selectedItem)}" 
										update="itGosodo, itAvailbleBud"/><!-- somYear,  -->
								</p:selectOneMenu>
							</td>
							<th><p:outputLabel value="#{lbl['lbl.pp.balance.amount']}"/></th>
							<td>
								<p:inputText id="itAvailbleBud" disabled="true" styleClass="ppDisplayTextS"
										value="#{planBackingBean.generateAvailableBudget(
										planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.allocAmount
										,planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.usedAmount)}"/>
							</td>
						</tr>
						<tr>
				   			<th><p:outputLabel value="#{lbl['lbl.pp.gosodo.name']}"/></th>
							<td> 
								<p:inputText id="itGosodo" disabled="true" styleClass="ppDisplayTextM"
										value="#{planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.ppBudget.pmGo.goName} #{planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.pmDo.pmSo.soName}#{planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.pmDo.doName}"/>
   
							</td>
							<th><p:outputLabel value="* #{lbl['lbl.pp.estimated.amount']}"/></th>
							<td>
								 <p:inputText styleClass="ppDisplayTextS"
								 	value="#{planBackingBean.managedBean.selectedItem.estimatedAmount}" 
								 	disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
										!planBackingBean.managedBean.selectedItem.editable}"/>
							</td>
				   		</tr>
						
						<!-- UNSPSC Product -->
						<c:if test="#{cc.attrs.selectedPlanMaster.procurementMode==PPConst.procurementDirectPurchase}">
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.product.segment']}"/></th>
								<td colspan="3">
									<p:selectOneMenu styleClass="ppDropDownWidthM"
										value="#{planBackingBean.managedBean.selectedItem.unspscSegmentCode}"
										disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
										!planBackingBean.managedBean.selectedItem.editable}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.unspscSegmentOptions(planBackingBean.managedBean.selectedItem.unspscSegmentCode)}" 
											var="obj" itemLabel="#{obj.unspscTitle}" itemValue="#{obj.unspscCode}"/>
										<p:ajax event="change" update="somEpProdFamily" />
									</p:selectOneMenu>
								</td>
							</tr>
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.product.family']}"/></th>
								<td colspan="3">
									<p:selectOneMenu styleClass="ppDropDownWidthM"
										id="somEpProdFamily" value="#{planBackingBean.managedBean.selectedItem.unspscFamilyCode}"
										disabled="#{planBackingBean.managedBean.selectedItem.unspscSegmentCode==null
										|| (!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; !planBackingBean.managedBean.selectedItem.editable)}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.unspscFamilyOptions(planBackingBean.managedBean.selectedItem.unspscSegmentCode)}" 
											var="obj" itemLabel="#{obj.unspscTitle}" itemValue="#{obj.unspscCode}"/>
										<p:ajax event="change" update="somProdClass" />
									</p:selectOneMenu>
								</td>	
							</tr>
							<tr>
								<th><p:outputLabel value="* #{lbl['lbl.pp.product.class']}"/></th>
								<td colspan="3">
									<p:selectOneMenu styleClass="ppDropDownWidthM"
										id="somProdClass" value="#{planBackingBean.managedBean.selectedItem.unspscClassCode}"
										disabled="#{planBackingBean.managedBean.selectedItem.unspscFamilyCode==null
										|| (!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; !planBackingBean.managedBean.selectedItem.editable)}">
										<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
										<f:selectItems value="#{planBackingBean.unspscClassOptions(planBackingBean.managedBean.selectedItem.unspscFamilyCode)}" 
											var="obj" itemLabel="#{obj.unspscTitle}" itemValue="#{obj.unspscCode}"/>
										<p:ajax event="change" listener="#{planBackingBean.selectedProduct()}"/>
									</p:selectOneMenu>
								</td>
							</tr>
						</c:if>
						</table>
					</p:panel>
				</td>
			</tr>
			
			<tr>
	   			<td colspan="4">
	   			 	<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.pp.ok']}"  action="#{planBackingBean.addItemToList()}"
							process="pItemDetails" update="dtEpItemDetails" icon="ui-icon-accept" oncomplete="dlItemDetailsModal.hide()"/>
						&nbsp;
						<p:commandButton value="#{lbl['lbl.pp.cancel']}" icon="ui-icon-cancel"
							onclick="dlItemDetailsModal.hide()" immediate="true"/>
					</div>
				</td>
	   		</tr>
		</table>
	</p:outputPanel>

</ui:composition>
