<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions">
   
	<p:outputPanel id="opPlanEpDirectPurchase">
		<br/>
		<!-- Direct Purchase Plan List -->
		<p:dataTable id="dtEpPlanItem" styleClass="ppFixTdWidth"  rowIndexVar="rowIndex" 
			selection="#{planBackingBean.managedBean.selectedPlanItem}" selectionMode="single"
			rowKey="#{ppPlan}" var="ppPlan" value="#{cc.attrs.selectedPlanMaster.ppPlans}"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
			
			<p:ajax event="rowSelect" listener="#{planBackingBean.selectPlanItem()}" update="@([id$=opChildList])" />
			
	    	<p:column rendered="#{cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeDraft}" 
	    		styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.submit']}">  
                <p:selectBooleanCheckbox id="sbcbSubmit" value="#{ppPlan.submitPlan}"/>
            </p:column>      
        	<p:column headerText="#{lbl['lbl.pp.planned.activity.startmonth']}">  
				<p:selectOneMenu value="#{ppPlan.planStartMonth}" disabled="#{!ppPlan.brandNew &amp;&amp; !ppPlan.editable}">
					<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
					<f:selectItems value="#{planBackingBean.shortMonths()}"/>
				</p:selectOneMenu>
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.planned.activity.endmonth']}">  
	            <p:selectOneMenu value="#{ppPlan.planEndMonth}" disabled="#{!ppPlan.brandNew &amp;&amp; !ppPlan.editable}">
					<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
					<f:selectItems value="#{planBackingBean.shortMonths()}"/>
				</p:selectOneMenu>
	        </p:column>	    
	        <p:column headerText="#{lbl['lbl.pp.action']}"> 
                <p:commandLink 
                  	update="dtEpPlanItem, @([id$=opChildList])" disabled="#{!ppPlan.brandNew}"
                  	action="#{planBackingBean.deletePpPlan(ppPlan)}" >  
                  	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
               	</p:commandLink> 
            </p:column>  
    	</p:dataTable>  
    	<br/>
    	<!-- Button(s) -->
   		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.pp.add']}" action="#{planBackingBean.addEmptyPlanToList()}"
				 update="dtEpPlanItem" icon="ui-icon-add" 
				 disabled="#{!(cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision)}"/> 
	 		<br/>
	 		<br/>
 		</div>
 		<br/>
 		
 		<!-- Direct Purchase Item List -->
 		<p:outputPanel id="opChildList">
 			<ui:include src="itemList.xhtml"/>
 			<!-- Button(s) -->
    		<div class="ppRightBtn">
				<p:commandButton id="cbAddChild" value="#{lbl['lbl.pp.add']}" action="#{planBackingBean.showPpItem(null)}"
					 oncomplete="dlItemDetailsModal.show()" update="dlItemDetails" icon="ui-icon-add" 
					 disabled="#{!planBackingBean.managedBean.enableChildDetail || !(cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision)}"/> 
		 		<br/>
		 		<br/>
	 		</div>
	 		<br/>
	 		
	 		<!-- Item Details -->
	 		<p:dialog id="dlItemDetails" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsModal" 
		              	resizable="false" styleClass="ppDiaglogBg" dynamic="true">  
	      			<ui:include src="itemDetails.xhtml"/>
			</p:dialog>  
 		</p:outputPanel>
	</p:outputPanel>

</ui:composition>
