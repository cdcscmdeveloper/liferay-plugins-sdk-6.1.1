<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpFavorItem">
	  	<!-- Details -->
		<p:panel id="pItemDetailsSub" header="#{lbl['lbl.pp.favourite.item']}" toggleable="true" >
		
			<!-- Item List -->
			<ui:include src="itemList.xhtml"/>
		
			<!-- Button(s) -->
			<c:if test="#{cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision}">
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.pp.add']}" action="#{planBackingBean.showPpItem(null)}"
						 oncomplete="dlItemDetailsModal.show()" update="dlItemDetails" /> 
			 		<br/>
			 		<br/>
		 		</div>
			</c:if>
	 		<!-- Sub Item Details -->
	 		<p:dialog id="dlItemDetails" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsModal" 
		            resizable="false" styleClass="ppDiaglogBg" dynamic="true">  
	      			<ui:include src="itemDetails.xhtml"/>
			</p:dialog>  
		</p:panel>
	</p:outputPanel>

</ui:composition>
