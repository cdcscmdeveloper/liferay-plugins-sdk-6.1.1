<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpExistingContract">
		<br/>
		<!-- Existing Contract Plan List -->
		<p:dataTable id="dtEpPlanItem" styleClass="ppFixTdWidth"  rowIndexVar="rowIndex" 
			selection="#{planBackingBean.managedBean.selectedPlanItem}" selectionMode="single"
			rowKey="#{ppPlan}" var="ppPlan" value="#{cc.attrs.selectedPlanMaster.ppPlans}"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
	    	
	    	<p:ajax event="rowSelect" listener="#{planBackingBean.selectPlanItem()}" update="@([id$=opChildList])" />
	    		    	
	    	<p:column rendered="#{cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeDraft}" 
	    		styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.submit']}">  
                <p:selectBooleanCheckbox id="sbcbSubmit" value="#{ppPlan.submitPlan}"/>
            </p:column>    
	        <p:column headerText="#{lbl['lbl.pp.doc.type']}">  
            	#{ppPlan.contractInd}
	        </p:column>   
        	<p:column headerText="#{lbl['lbl.pp.planned.activity.startdate']}">  
        	 	<h:outputText value="#{ppPlan.planStartDate}" >
               		<f:convertDateTime pattern="#{PPConst.dateDisplayPattern}" />
                </h:outputText>
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.planned.activity.enddate']}">  
	            <h:outputText value="#{ppPlan.planEndDate}" >
               		<f:convertDateTime pattern="#{PPConst.dateDisplayPattern}" />
                </h:outputText>
	        </p:column>	    
	        <p:column headerText="#{lbl['lbl.pp.action']}">  
	         	<p:commandLink 
                  	update="@([id$=opChildList])" oncomplete="dlExistingContractModal.show()" 
                  	action="#{planBackingBean.showContractPlan(ppPlan)}" >  
               		<p:graphicImage value="#{!(ppPlan.brandNew || !cc.attrs.viewMode==PPConst.modeRevision) 
               			? '/resources/ep/images/design/document.png' 
                  		: '/resources/ep/images/design/edit.png'}"/>
               	</p:commandLink> 
                 <p:commandLink 
                  	update="dtEpPlanItem, @([id$=opChildList])" disabled="#{!ppPlan.brandNew}"
                  	action="#{planBackingBean.deletePpPlan(ppPlan)}" >  
                  	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
               	</p:commandLink> 
            </p:column>  
    	</p:dataTable>  
    	<br/>
    	
    	<!-- Button(s) -->
   		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.pp.add']}" action="#{planBackingBean.showContractPlan(null)}"
				 oncomplete="dlExistingContractModal.show()" update="dlExistingContract" icon="ui-icon-add"
				 disabled="#{!(cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision)}"/> 
	 		<br/>
	 		<br/>
 		</div>
 		
 		<p:outputPanel id="opChildList">
 		
	 		<!-- Existing Contract Item List -->
	 		<!-- Item List -->
			<p:dataTable id="dtEpItemDetails" styleClass="ppFixTdWidth" var="ppItem" 
					value="#{planBackingBean.managedBean.selectedPlanItem.ppPlanItems}"  rowIndexVar="rowIndex"
					emptyMessage="#{lbl['lbl.pp.no.record.found']}"> 
				<p:column rendered="#{cc.attrs.viewMode==PPConst.modeApproval || cc.attrs.viewMode==PPConst.modeVerification }" 
					headerText="#{lbl['lbl.pp.revise']}">  
					<p:selectBooleanCheckbox value="#{ppItem.revisionRequired}" />
				</p:column>	   
			    <p:column headerText="#{lbl['lbl.pp.gosodo.code']}"> 
	                   <p:selectOneMenu value="#{ppItem.goId}"
						disabled="#{!ppItem.brandNew &amp;&amp; !ppItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<f:selectItems value="#{planBackingBean.goOptions()}" 
								var="obj" itemLabel="#{obj.pmGo.goCode}" itemValue="#{obj.budgetId}" />
						<p:ajax event="change" update="somSo"/>
					</p:selectOneMenu>
					<p:selectOneMenu id="somSo" value="#{ppItem.soId}"
						disabled="#{!ppItem.brandNew &amp;&amp; !ppItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<f:selectItems value="#{planBackingBean.soOptions(ppItem.goId)}" 
								var="obj" itemLabel="#{obj.soCode}" itemValue="#{obj.soId}" />
						<p:ajax event="change" update="somDo"/>
					</p:selectOneMenu>
					<p:selectOneMenu  id="somDo" value="#{ppItem.budgetAllocDtlId}"
						disabled="#{!ppItem.brandNew &amp;&amp; !ppItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<f:selectItems value="#{planBackingBean.doOptions(ppItem.goId, ppItem.soId)}" 
								var="obj" itemLabel="#{obj.pmDo.doCode}" itemValue="#{obj.budgetAllocDtlId}" />
						<p:ajax event="change" listener="#{planBackingBean.selectedGoSoDo(ppItem)}" update="itAvailbleBud"/> <!-- somYear,  -->
					</p:selectOneMenu> 
		        </p:column>   	 
		 
				<p:column headerText="#{lbl['lbl.pp.balance.amount']}"> 
					 <p:inputText id="itAvailbleBud" styleClass="ppDisplayTextS" disabled="true"
						 	value="#{planBackingBean.generateAvailableBudget(
						 	ppItem.ppBudgetAllocDtl.allocAmount, ppItem.ppBudgetAllocDtl.usedAmount)}" />
				</p:column>
		        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}">    
	                   <p:inputText value="#{ppItem.estimatedAmount}" styleClass="ppDisplayTextS"
	                   	disabled="#{!ppItem.brandNew &amp;&amp; !ppItem.editable}"/>&nbsp;
		        </p:column>  
		        <p:column headerText="#{lbl['lbl.pp.action']}">  
	         	 	<p:commandLink 
	                  	update="dtEpItemDetails" disabled="#{!(ppItem.brandNew || cc.attrs.viewMode==PPConst.modeRevision)}" 	 
	                  	action="#{planBackingBean.deletePpItem(ppItem)}">
	                  	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
	           		</p:commandLink>
		        </p:column>
		   	</p:dataTable> 
		   	
	 		<!-- Button(s) -->
	   		<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pp.add']}" action="#{planBackingBean.addPlanItems}"
					 update="dtEpItemDetails" icon="ui-icon-add"
					 disabled="#{!planBackingBean.managedBean.enableChildDetail || 
					 !(cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision)}"/> 
		 		<br/>
		 		<br/>
	 		</div>
 		</p:outputPanel>
 		
 		<!-- Contract Header Details -->
 		<p:dialog id="dlExistingContract" header="#{lbl['lbl.pp.contract.details.form']}" widgetVar="dlExistingContractModal" 
	              resizable="false" styleClass="ppDiaglogBg" dynamic="true">  
      			<ui:include src="existingContractDet.xhtml"/>
		</p:dialog>  
	</p:outputPanel>

</ui:composition>
