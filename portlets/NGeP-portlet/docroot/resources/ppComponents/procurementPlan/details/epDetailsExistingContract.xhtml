<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpExistingContract">
		 
		<!-- Item List -->
		<p:dataTable id="dtEpPlanItem" styleClass="ppFixTdWidth"  rowIndexVar="rowIndex" 
			var="ppPlan" value="#{cc.attrs.selectedPlanMaster.ppPlans}"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.expand']}">
	    		<p:rowToggler />
    		</p:column>
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.submit']}">  
                <p:outputLabel value="" />  
            </p:column>   
            <p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
               	#{rowIndex+1}
            </p:column>   
	        <p:column headerText="#{lbl['lbl.pp.contract.class']}">  
            	#{ppPlan.contractInd}
	        </p:column>   
        	<p:column headerText="#{lbl['lbl.pp.planned.activities.startdate']}">  
	            #{ppPlan.planStartDate}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.planned.activities.enddate']}">  
	            #{ppPlan.planEndDate}
	        </p:column>	    
	        <p:column headerText="#{lbl['lbl.pp.action']}">  
                <p:commandLink value="#{lbl['lbl.pp.edit']}" 
					action="#{planBackingBean.showPpPlan(ppPlan)}" 
                    oncomplete="dlItemDetailsModal.show();"/>
                &nbsp;&nbsp;
                <p:commandLink value="#{lbl['lbl.pp.delete']}"
                  	update="dtEpItem" rendered="#{ppPlan.brandNew || cc.attrs.viewMode==PPConst.modeRevision}"
                  	action="#{planBackingBean.deletePpPlan(ppPlan)}" />  
            </p:column>  
            <p:rowExpansion>  
            	<p:dataTable id="dtEpItem" styleClass="ppFixTdWidth" var="ppItem" value="#{ppPlan.ppItems}" 
            		rowIndexVar="rowSubIndex" emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
			    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
			            #{rowSubIndex+1}
			        </p:column>   
			      	<p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
						#{ppItem.ppBudgetAllocDtl.ppBudget.pmGo.goName}
						#{ppItem.ppBudgetAllocDtl.pmDo.pmSo.soName}
						#{ppItem.ppBudgetAllocDtl.pmDo.doName}
			        </p:column>   
			        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}">  
			            #{ppItem.estimatedAmount}
			        </p:column>  
			        <p:column headerText="#{lbl['lbl.pp.product.code']}">  
			             #{ppItem.unspscClassId}
			        </p:column>
			        <p:column headerText="#{lbl['lbl.pp.program.activiti.projek.setia.amanah.code']}">  
			             todo 
			        </p:column>  
		    	</p:dataTable>  
            </p:rowExpansion>
    	</p:dataTable>  
    	<br/>
    	
    	<!-- Button(s) -->
    	<c:if test="#{cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision}">
    		<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pp.add.item']}" action="#{planBackingBean.showPpPlan(null)}"
					 oncomplete="dlItemDetailsEcModal.show()" update="dlItemDetailsEc" /> 
		 		<br/>
		 		<br/>
	 		</div>
 		</c:if>
 		
 		<!-- Sub Item Details -->
 		<p:dialog id="dlItemDetailsEc" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsEcModal" 
	              resizable="false" styleClass="ppDiaglogBigBg" dynamic="true">  
      			<ui:include src="existingContractDet.xhtml"/>
		</p:dialog>  

	</p:outputPanel>

</ui:composition>
