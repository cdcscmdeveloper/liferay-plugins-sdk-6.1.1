<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpFavorPlan">
		<!-- Favourite Activities -->
		<p:panel header="#{lbl['lbl.pp.favourite.activities']}">
			<table class="ppTwoPartsTable">
				<tr>
					<th>#{lbl['lbl.pp.plan.name']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:inputText value="#{planBackingBean.managedBean.selectedPlanItem.favorPlanRecurFreq.planName}" 
							disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}"/>
					</td>
				</tr>
				<tr>
					<th>#{lbl['lbl.pp.recurring.frequency']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:inputText value="#{planBackingBean.managedBean.selectedPlanItem.favorPlanRecurFreq.recurFreq}"
							disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
						    <p:ajax event="change" listener="#{planBackingBean.changeRecurFreq}" update="opPlanEpFavorPlan" />
						</p:inputText>
					</td>
				</tr>
				<!-- Repeat this based on recurring frequency -->
				<ui:repeat var="fav" value="#{planBackingBean.managedBean.selectedPlanItem.favorPlanRecurFreq.ppRecurFreqDtls}" varStatus="status">
					<tr>
						<th>#{lbl['lbl.pp.planned.activities.start.end.month']} ${status.index+1}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:selectOneMenu value="#{fav.intPlanStartMonth}"
								disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
								<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
								<f:selectItems value="#{planBackingBean.shortMonths()}"/>
							</p:selectOneMenu>
							&nbsp;
							<p:selectOneMenu value="#{fav.intPlanEndMonth}"
								disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
								<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
								<f:selectItems value="#{planBackingBean.shortMonths()}"/>
							</p:selectOneMenu>
						</td>
					</tr>
				</ui:repeat>	
			</table>
		</p:panel>
		<!-- Details -->
		<p:panel id="pItemDetailsSub" header="#{lbl['lbl.pp.details']}" >
			<!-- Item List -->
	
			<ui:include src="itemList.xhtml"/>

			
			<!-- Button(s) -->
			<c:if test="#{cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision}">
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.pp.add.item']}" action="#{planBackingBean.showPpItem(null)}"
					 oncomplete="dlItemDetailsModal.show()" update="dlItemDetails" /> 
				</div>
			</c:if>
			
	 		<!-- Sub Item Details -->
	 		<p:dialog id="dlItemDetails" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsModal" 
		              	resizable="false" styleClass="ppDiaglogBg" dynamic="true" >  
	      			<ui:include src="itemDetails.xhtml"/>
			</p:dialog>  
		</p:panel>
		  
			
	</p:outputPanel>

</ui:composition>
