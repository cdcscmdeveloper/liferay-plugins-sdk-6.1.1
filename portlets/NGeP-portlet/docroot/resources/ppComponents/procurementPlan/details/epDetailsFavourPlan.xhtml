<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpFavorPlan">
		<!-- Favourite Activities -->
		<p:panel header="#{lbl['lbl.pp.favourite.plan.activities']}" toggleable="true">
			<table class="ppTwoPartsTable">
				<tr>
					<td colspan="3">
						<table class="ppHalf">
							<tr>					
								<td><p:outputLabel value="* #{lbl['lbl.pp.plan.name']}"/></td>
								<td>
									<p:inputText value="#{planBackingBean.managedBean.selectedPlanItem.favorPlanRecurFreq.planName}" 
										disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}"/>
								</td>
							</tr>
							<tr>
								<td><p:outputLabel value="* #{lbl['lbl.pp.recurring.frequency']}"/></td>
								<td>
									<p:inputText value="#{planBackingBean.managedBean.selectedPlanItem.favorPlanRecurFreq.recurFreq}"
										disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
									    <p:ajax event="change" listener="#{planBackingBean.changeRecurFreq}" update="dtFavItem" />
									</p:inputText>
								</td>
							</tr>
						</table>
					</td>
				</tr>
				<!-- Repeat this based on recurring frequency -->
				<tr>
					<td colspan="3">
						<p:dataTable id="dtFavItem" styleClass="ppFixTdWidth" var="fav" 
							value="#{planBackingBean.managedBean.selectedPlanItem.favorPlanRecurFreq.ppRecurFreqDtls}"  
							rowIndexVar="rowIndex">    
							<p:column styleClass="ppNumericAlign ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
				             	#{rowIndex+1} 
					        </p:column>   
					        <p:column headerText="* #{lbl['lbl.pp.planned.activity.startmonth']}">  
					        	<p:selectOneMenu value="#{fav.intPlanStartMonth}"
									disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
									<f:selectItems value="#{planBackingBean.shortMonths()}"/>
								</p:selectOneMenu>
					        </p:column>		
					        <p:column headerText="* #{lbl['lbl.pp.planned.activity.endmonth']}">  
						       <p:selectOneMenu value="#{fav.intPlanEndMonth}"
									disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; cc.attrs.viewMode!=PPConst.modeRevision}">
									<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
									<f:selectItems value="#{planBackingBean.shortMonths()}"/>
								</p:selectOneMenu>
					        </p:column>			
						</p:dataTable>
					</td>
				</tr>
			</table>
		</p:panel>
		<!-- Details -->
		<p:panel id="pItemDetailsSub" header="#{lbl['lbl.pp.details']}" toggleable="true" >
			<!-- Item List -->
			<ui:include src="itemList.xhtml"/>

			<!-- Button(s) -->
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pp.add']}" action="#{planBackingBean.showPpItem(null)}"
				 oncomplete="dlItemDetailsModal.show()" update="dlItemDetails" icon="ui-icon-add" 
				 disabled="#{!(cc.attrs.viewMode==PPConst.modeNew || cc.attrs.viewMode==PPConst.modeRevision)}"/> 
			</div>

	 		<!-- Sub Item Details -->
	 		<p:dialog id="dlItemDetails" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsModal" 
		              	resizable="false" styleClass="ppDiaglogBg" dynamic="true" >  
	      			<ui:include src="itemDetails.xhtml"/>
			</p:dialog>  
		</p:panel>
		  
			
	</p:outputPanel>

</ui:composition>
