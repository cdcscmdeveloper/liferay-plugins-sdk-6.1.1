<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opEpExistingContract">
		<table class="ppThreePartsTable">
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.doc.type']}"/></th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{planBackingBean.managedBean.selectedPlanItem.contractInd}"
						disabled="#{!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; 
			    		!planBackingBean.managedBean.selectedPlanItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<f:selectItems value="#{planBackingBean.contractIndOptions()}"/>
						<p:ajax event="change" update="opEpExistingContract" />
					</p:selectOneMenu>
				</td>
				<!-- based on selected contract -->
				<th><p:outputLabel value="#{lbl['lbl.pp.supplier.id']}"/></th>
				<td>
					<p:outputPanel id="opSupId">
						<p:inputText disabled="true" styleClass="ppDisplayTextM"
							value="#{planBackingBean.managedBean.selectedPlanItem.ctContract.smSupplier!=null? 
							planBackingBean.managedBean.selectedPlanItem.ctContract.smSupplier.supplierId 
							: ''}"/>
					</p:outputPanel>
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.contract.type']}"/></th>
				<td>
					<p:selectOneMenu id="somContractType" styleClass="ppDropDownWidthM"
						value="#{planBackingBean.managedBean.selectedPlanItem.contractType}" 
						disabled="#{planBackingBean.managedBean.selectedPlanItem.contractInd!=PPConst.contractIndContract
						|| (!planBackingBean.managedBean.selectedPlanItem.brandNew 
						&amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{planBackingBean.contractTypeOptions()}"/>
						<p:ajax event="change" update="somContractNum" />
					</p:selectOneMenu>
				</td>
				<!-- based on selected contract -->
				<th><p:outputLabel value="#{lbl['lbl.pp.supplier.name']}"/></th>
				<td>
					<p:outputPanel id="opSupName">
						<p:inputText disabled="true" styleClass="ppDisplayTextM"
							value="#{planBackingBean.managedBean.selectedPlanItem.ctContract.smSupplier!=null? 
							planBackingBean.managedBean.selectedPlanItem.ctContract.smSupplier.supplierName : 
							''}"/>
					</p:outputPanel>
					
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.pkp.number']}"/></th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{planBackingBean.managedBean.selectedPlanItem.circularId}"
						disabled="#{planBackingBean.managedBean.selectedPlanItem.contractInd!=PPConst.contractIndPkp
						|| (!planBackingBean.managedBean.selectedPlanItem.brandNew 
						&amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}" >
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{planBackingBean.circularOptions()}" var="obj" 
							itemLabel="#{obj.latestCircularVer.circularNo}" itemValue="#{obj.circularId}"/>
						<p:ajax event="change" update="somPkpContractNum" />
					</p:selectOneMenu>
				</td>
				<!-- based on selected contract -->
				<th><p:outputLabel value="#{lbl['lbl.pp.duration.month']}"/></th>
				<td>
					<p:outputPanel id="opDuration">
						<p:inputText disabled="true" styleClass="ppDisplayTextM"
							value="#{planBackingBean.managedBean.selectedPlanItem.ctContract.latestContractVer.ctContractValue!=null? planBackingBean.managedBean.selectedPlanItem.ctContract.latestContractVer.ctContractValue.contractPeriod : ''}" />
					</p:outputPanel>
					
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.contract.number']}"/></th>
				<td>
					<p:outputPanel rendered="#{planBackingBean.managedBean.selectedPlanItem.contractInd==PPConst.contractIndPkp}">
						<p:selectOneMenu id="somPkpContractNum" styleClass="ppDropDownWidthM"
							value="#{planBackingBean.managedBean.selectedPlanItem.ctContract.contractId}"
							disabled="#{planBackingBean.managedBean.selectedPlanItem.contractInd==PPConst.contractIndLoa 
							|| planBackingBean.managedBean.selectedPlanItem.circularId==null
							||(!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}" >
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{planBackingBean.cicularContractOptions(planBackingBean.managedBean.selectedPlanItem.circularId)}" 
								var="obj" itemLabel="#{obj.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" itemValue="#{obj.ctContract.contractId}"/>
							<p:ajax event="change" listener="#{planBackingBean.selectedContract(planBackingBean.managedBean.selectedPlanItem.ctContract.contractId)}" update="opEpExistingContract" />
						</p:selectOneMenu>
					</p:outputPanel>
					<p:outputPanel rendered="#{planBackingBean.managedBean.selectedPlanItem.contractInd!=PPConst.contractIndPkp}">
						<p:selectOneMenu id="somContractNum" styleClass="ppDropDownWidthM"
							value="#{planBackingBean.managedBean.selectedPlanItem.ctContract.contractId}"
							disabled="#{planBackingBean.managedBean.selectedPlanItem.contractInd==PPConst.contractIndLoa
							|| planBackingBean.managedBean.selectedPlanItem.contractType==null 
							||(!planBackingBean.managedBean.selectedPlanItem.brandNew &amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{planBackingBean.contractOptions(planBackingBean.managedBean.selectedPlanItem.contractType)}"
								var="obj" itemLabel="#{obj.latestContractVer.ctContractValue.contractPhysicalNo}" itemValue="#{obj.contractId}"/>
							<p:ajax event="change" listener="#{planBackingBean.selectedContract(planBackingBean.managedBean.selectedPlanItem.ctContract.contractId)}" update="opEpExistingContract" />
						</p:selectOneMenu>
					</p:outputPanel>
				</td>
				<th>
					<p:outputLabel value="* #{planBackingBean.managedBean.selectedPlanItem.ctContract.fulfillmentType.code==PPConst.fulfillmentSchedule ? 
						lbl['lbl.pp.planned.activity.startdate'] : lbl['lbl.pp.planned.activity.startmonth']}" />
				</th>
				<td>
					<p:outputPanel id="opStartMonth">
						<p:calendar styleClass="ppDisplayCalM"
							showOn="button" value="#{planBackingBean.managedBean.selectedPlanItem.planStartDate}" 
							rendered="#{planBackingBean.managedBean.selectedPlanItem.ctContract.fulfillmentType.code==PPConst.fulfillmentSchedule}" pattern="#{PPConst.dateDisplayPattern}" 
			             	disabled="#{planBackingBean.managedBean.selectedPlanItem.ctContract.contractId==null 
			             	 	|| (!planBackingBean.managedBean.selectedPlanItem.brandNew 
			             		&amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}">
			             	<p:ajax event="dateSelect" update="opEndDate" listener="#{planBackingBean.calculatePlanEndDate()}"  />              	
		           			<p:ajax event="change" update="opEndDate" listener="#{planBackingBean.calculatePlanEndDate()}" />
			             </p:calendar>
						<p:selectOneMenu styleClass="ppDropDownWidthM"
							rendered="#{planBackingBean.managedBean.selectedPlanItem.ctContract.fulfillmentType.code!=PPConst.fulfillmentSchedule}"
							value="#{planBackingBean.managedBean.selectedPlanItem.planStartMonth}"
						 	disabled="#{planBackingBean.managedBean.selectedPlanItem.ctContract.contractId==null 
						 		|| (!planBackingBean.managedBean.selectedPlanItem.brandNew 
			             		&amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
							<f:selectItems value="#{planBackingBean.shortMonths()}"/>
							<p:ajax event="change" update="opEndDate"
							 listener="#{planBackingBean.calculatePlanEndDate()}"/>
						</p:selectOneMenu>
					</p:outputPanel>
				</td>
				
			</tr>
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.loa.number']}"/></th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{planBackingBean.managedBean.selectedPlanItem.loaId}"
						disabled="#{planBackingBean.managedBean.selectedPlanItem.contractInd!=PPConst.contractIndLoa
						|| (!planBackingBean.managedBean.selectedPlanItem.brandNew 
		             		&amp;&amp; !planBackingBean.managedBean.selectedPlanItem.editable)}" >
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
						<f:selectItem itemLabel="1" itemValue="1"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{planBackingBean.managedBean.selectedPlanItem.ctContract.fulfillmentType.code==PPConst.fulfillmentSchedule ? 
						lbl['lbl.pp.planned.activity.enddate'] : lbl['lbl.pp.planned.activity.endmonth']}"/>
				</th>
				<td>
					<p:outputPanel id="opEndDate">
						<p:inputText disabled="true" styleClass="ppDisplayTextM"
							rendered="#{planBackingBean.managedBean.selectedPlanItem.ctContract.fulfillmentType.code!=PPConst.fulfillmentSchedule}"
							value="#{planBackingBean.managedBean.selectedPlanItem.planEndMonthString}"/>
						<p:inputText disabled="true" styleClass="ppDisplayTextM" 
							rendered="#{planBackingBean.managedBean.selectedPlanItem.ctContract.fulfillmentType.code==PPConst.fulfillmentSchedule}"
							value="#{planBackingBean.managedBean.selectedPlanItem.planEndDate}">
							<f:convertDateTime pattern="#{PPConst.dateDisplayPattern}" />
						</p:inputText>
					</p:outputPanel>
				</td>
			</tr>
		</table>
		<!-- Top Button -->
		<div class="ppRightBtn">
			<p:commandButton id="cbConfirm" value="#{lbl['lbl.pp.confirm']}" action="#{planBackingBean.addPlanToList()}"
			  onclick="dlExistingContractModal.hide()" oncomplete="dlExistingContractModal.hide()"  process="opEpExistingContract"
			  update="dtEpPlanItem" icon="ui-icon-accept" />
			&nbsp; 
			<p:commandButton id="cbCancel" value="#{lbl['lbl.pp.cancel']}" onclick="dlExistingContractModal.hide()" 
				icon="ui-icon-cancel" immediate="true"/>
		</div>
	</p:outputPanel>

</ui:composition>
