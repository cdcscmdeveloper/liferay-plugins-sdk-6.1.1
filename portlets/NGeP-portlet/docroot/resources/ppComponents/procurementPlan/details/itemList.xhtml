
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

		<!-- Item List -->
		<p:dataTable id="dtEpItemDetails" styleClass="ppFixTdWidth" var="ppItem" 
				value="#{cc.attrs.selectedPlanItem.ppPlanItems}"  rowIndexVar="rowIndex"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}">    
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
             	#{rowIndex+1} 
	        </p:column>   
	        <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
	           	#{ppItem.ppBudgetAllocDtl.ppBudget.pmGo.goName}
				#{ppItem.ppBudgetAllocDtl.pmDo.pmSo.soName}
				#{ppItem.ppBudgetAllocDtl.pmDo.doName}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}">  
	            #{ppItem.estimatedAmount}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.product.code']}">  
	             #{ppItem.unspscClassId}
	        </p:column>
	        <p:column headerText="#{planBackingBean.managedBean.votType==PPConst.votBt? 
	        	lbl['lbl.pp.program.activiti.code'] : (planBackingBean.managedBean.votType==PPConst.votPs ?
	        	lbl['lbl.pp.projek.setia.code'] : lbl['lbl.pp.amanah.code'])}">  
	             todo 
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.action']}">  
	            <p:commandLink value="#{lbl['lbl.pp.edit']}"/>
                &nbsp;&nbsp;
                <p:commandLink value="#{lbl['lbl.pp.delete']}"/>   
	        </p:column>
	   	</p:dataTable>  
   </ui:composition>
