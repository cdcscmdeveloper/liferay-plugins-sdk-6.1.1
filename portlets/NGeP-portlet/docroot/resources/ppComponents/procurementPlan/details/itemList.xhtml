
<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
	
		<!-- Item List -->
		<p:dataTable id="dtEpItemDetails" styleClass="ppFixTdWidth" var="ppItem" 
				value="#{planBackingBean.managedBean.selectedPlanItem.ppPlanItems}"  rowIndexVar="rowIndex"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}">    
			<p:column rendered="#{cc.attrs.viewMode==PPConst.modeApproval || cc.attrs.viewMode==PPConst.modeVerification }" 
				headerText="#{lbl['lbl.pp.revise']}">  
				<p:selectBooleanCheckbox value="#{ppItem.revisionRequired}" />
			</p:column>		
		    <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
	           	<!-- #{ppItem.ppBudgetAllocDtl.ppBudget.pmGo.goCode}/
				#{ppItem.ppBudgetAllocDtl.pmDo.pmSo.soCode}/ -->
				
				#{ppItem.ppBudgetAllocDtl.pmDo.doCode}
	        </p:column>
	     
	        <p:column headerText="#{lbl['lbl.pp.gosodo.name']}">
	          	<!--   		     
	           	#{ppItem.ppBudgetAllocDtl.ppBudget.pmGo.goName}
				#{ppItem.ppBudgetAllocDtl.pmDo.pmSo.soName} -->
				#{ppItem.ppBudgetAllocDtl.pmDo.doName}
	        </p:column>  
	        
	        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}" styleClass="ppNumericAlign">  
	            #{ppItem.estimatedAmount}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.product.class']}">  
	            #{ppItem.cmUnspscClass.unspscTitle}
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pp.action']}"> 
	         	<p:commandLink 
	         		action="#{planBackingBean.showPpItem(ppItem)}" 
	         		update="@([id$=pItemDetails])" oncomplete="dlItemDetailsModal.show()">
	         		<p:graphicImage value="#{!(ppItem.brandNew || (cc.attrs.viewMode==PPConst.modeRevision 
                  		&amp;&amp; ppItem.revisionRequired)) ? '/resources/ep/images/design/document.png' 
                  		: '/resources/ep/images/design/edit.png'}"/>
	         	</p:commandLink> 
                 &nbsp;&nbsp;
                <p:commandLink
                  	update="dtEpItemDetails" disabled="#{!(ppItem.brandNew || (cc.attrs.viewMode==PPConst.modeRevision 
                  		&amp;&amp; ppItem.revisionRequired))}" action="#{planBackingBean.deletePpItem(ppItem)}" >
               		<p:graphicImage value="/resources/ep/images/design/trash.png"/>
           		</p:commandLink>
	        </p:column>
	   	</p:dataTable>  

   </ui:composition>
