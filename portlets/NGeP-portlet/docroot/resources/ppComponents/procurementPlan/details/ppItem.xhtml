<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="pItemDetails" header="#{lbl['lbl.pp.item.details.form']}">
		<table class="ppTwoPartsTable">
			<tr>
				<th>#{lbl['lbl.pp.gosodo.code']}</th>
				<td class="ppSmallTd">:</td>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedItem.goId}"
						disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
							!planBackingBean.managedBean.selectedItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" />
						<f:selectItem itemLabel="1" itemValue="1"/>
					</p:selectOneMenu>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedItem.soId}"
						disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
							!planBackingBean.managedBean.selectedItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" />
						<f:selectItem itemLabel="1" itemValue="1"/>
					</p:selectOneMenu>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedItem.budgetAllocDtlId}"
						disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
							!planBackingBean.managedBean.selectedItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" />
						<f:selectItem itemLabel="197" itemValue="197"/>
						<p:ajax event="change" listener="#{planBackingBean.selectedDo}" update="pItemDetails, opGosodo"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
	   			<th>#{lbl['lbl.pp.gosodo.name']}</th>
				<td class="ppSmallTd">:</td>
				<td> 
					<p:outputPanel id="opGosodo">
						<p:inputText disabled="true"
							value="#{planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.ppBudget.pmGo.goName}"/>
						<p:inputText disabled="true"
							value="#{planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.pmDo.pmSo.soName}"/>  
						<p:inputText disabled="true"
							value="#{planBackingBean.managedBean.selectedItem.ppBudgetAllocDtl.pmDo.doName}"/>
					</p:outputPanel>    
				</td>
	   		</tr>
			<!-- For Amanah Without VOT only -->
			<tr>
				<th>#{lbl['lbl.pp.financial.year']}</th>
				<td class="ppSmallTd">:</td>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedItem.ovrFinancialYear}"
						disabled="#{!planBackingBean.managedBean.withoutVot}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" />
					</p:selectOneMenu>
				</td>
			</tr>
				
			<tr>
				<th>#{lbl['lbl.pp.available.budgeted.amount']}</th>
				<td class="ppSmallTd">:</td>
				<td>
					 <p:inputText value="#{planBackingBean.generateAvailableBudget()}" disabled="true"/>
				</td>
			</tr>
			<tr>
				<th>#{lbl['lbl.pp.estimated.amount']}</th>
				<td class="ppSmallTd">:</td>
				<td>
					 <p:inputText value="#{planBackingBean.managedBean.selectedItem.estimatedAmount}" 
					 	disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
							!planBackingBean.managedBean.selectedItem.editable}"/>
				</td>
			</tr>
			<tr>
				<th>#{lbl['lbl.pp.product.code']}</th>
				<td class="ppSmallTd">:</td>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedItem.unspscClassId}"
						disabled="#{!planBackingBean.managedBean.selectedItem.brandNew &amp;&amp; 
						!planBackingBean.managedBean.selectedItem.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" />
						<f:selectItem itemLabel="Metal byproducts" itemValue="69527"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
	   			<th>#{lbl['lbl.pp.remarks']}</th>
				<td class="ppSmallTd">:</td>
				<td>
					
					<p:inputTextarea value="#{planBackingBean.managedBean.selectedItemRemark.remark}" 
						rows="3" cols="70"/>
				</td>
	   		</tr>
	   		<tr>
	   			<td colspan="2">&nbsp;</td>
				<td>
					<p:commandButton value="#{lbl['lbl.pp.save']}" action="#{planBackingBean.addItemToList()}"
						onclick="dlItemDetailsPpModal.hide()" oncomplete="dlItemDetailsPpModal.hide()" 
						process="pItemDetails" update="tvPlanContent:dtPpItem" />
					<p:commandButton value="#{lbl['lbl.pp.cancel']}" 
						onclick="dlItemDetailsPpModal.hide()" immediate="true"/>
				</td>
	   		</tr>
		</table>
	</p:panel>
</ui:composition>
