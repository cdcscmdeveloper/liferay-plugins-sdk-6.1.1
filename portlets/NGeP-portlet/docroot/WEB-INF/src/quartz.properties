#============================================================================
#  Main Scheduler Properties  
#============================================================================
org.quartz.scheduler.instanceName = NGEP_SCHEDULER
org.quartz.scheduler.instanceId = AUTO
#org.quartz.scheduler.userTransactionURL = java:jboss/UserTransaction
#org.quartz.scheduler.wrapJobExecutionInUserTransaction = true
org.quartz.scheduler.threadsInheritContextClassLoaderOfInitializer = true
#============================================================================
#  ThreadPool  
#============================================================================
org.quartz.threadPool.class = org.quartz.simpl.SimpleThreadPool
org.quartz.threadPool.threadCount = 20
org.quartz.threadPool.threadPriority = 5

#============================================================================
#  JobStore  
#============================================================================
#Using JNDI JDBC Jobstore


org.quartz.jobStore.misfireThreshold = 60000
#org.quartz.jobStore.class = org.quartz.impl.jdbcjobstore.JobStoreTX
#org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.oracle.OracleDelegate
org.quartz.jobStore.class = org.quartz.impl.jdbcjobstore.JobStoreCMT
org.quartz.jobStore.driverDelegateClass = org.quartz.impl.jdbcjobstore.StdJDBCDelegate
org.quartz.jobStore.useProperties = false
org.quartz.jobStore.dataSource = quartzDS
org.quartz.jobStore.tablePrefix = QRTZ_
org.quartz.jobStore.isClustered = true
org.quartz.jobStore.clusterCheckinInterval = 20000
org.quartz.jobStore.nonManagedTXDataSource = quartzDSNoTx
org.quartz.jobStore.maxMisfiresToHandleAtATime = 20
org.quartz.jobStore.txIsolationLevelReadCommitted = true
#org.quartz.jobStore.acquireTriggersWithinLock=true

#Using RAM Jobstore
#org.quartz.jobStore.class = org.quartz.simpl.RAMJobStore

