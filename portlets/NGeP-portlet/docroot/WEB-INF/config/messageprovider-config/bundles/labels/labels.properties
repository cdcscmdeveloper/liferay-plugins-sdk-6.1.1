lbl.sc.pricetype.tooltip = Standard : Harga normal pasaran<br /> Berperingkat : Harga berdasarkan julat kuantiti pesanan<br /> Standard Zon: Harga normal pasaran mengikut Zon<br /> Berperingkat Promosi: Harga Promosi berdasarkan julat kuantiti pesanan<br /> Zon Promosi: Harga Promosi mengikut Zon<br /> Berperingkat Zon: Harga berdasarkan julat kuantiti pesanan mengikut Zon<br /> Berperingkat Zon Promosi: Harga Promosi berdasarkan julat kuantiti pesanan mengikut Zon<br /><br /> Jenis harga item yang dipilih akan dibawa kepada proses pemenuhan
lbl.sc.procurementtype.tooltip = Normal: Procurement which required at least three (3) Suppliers per item<br /><br /> Emergency:  Procurement involved public saftey and security.<br /> For example: Nature disaster<br /><br /> Ad Hoc: Procurement ad hoc which only for allowed justification.<br /> For example: Urgent meeting, Car break down<br /><br /> G2G: Procurement involved Government Agency as Supplier<br /> Example: Maps purchasing from Jabatan Ukur dan Pemetaan Malaysia,<br /> Payment for Training participant at Government Institution such as INTAN, IPN etc. 
