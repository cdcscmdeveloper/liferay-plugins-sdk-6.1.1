lbl.sc.pid.tooltip = Permission to purchase in default<br /><br /> Eg:<br /> i) Purchase contracted item from Others Supplier<br /> ii) Purchase contracted item outside the Terms of Contract 
lbl.sc.sq.tooltip = Allow PTJ to key in item description to be listed in Simple Quote<br /><br /> Simple Quote is an process to invite at least three (3) Suppliers to offered their price
