lbl.sm.basic.account=Basic Account Lorem ipsum dolor sit amet, enim evertitur percipitur id qui, altera torquatos voluptaria ex duo. Mei utinam praesent dignissim at Et graeci definiebas vet Eros iudicabitte sea.<br /><br />1. Basic account boleh menyertai pemilihan pembekal sehingga nilai RM20,000 sahaja selaras dengan SPP Bil 1/2014.<br /><br />2. Kementerian Kewangan Malaysia berhak untuk membatalkan pendaftaran dan menyahaktifkan maklumat syarikat dari rekod system ePerolehan sekiranya tempoh setahun pendaftaran.<br /><br />3. Syarikat boleh mengaktif semula akaun dengan log masuk semula dan menjawab soalan rahsia. Jika syarikat berjaya menjawab soalan rahsia, syarikat akan alamat e-mel yang telah didaftarkan dalam maklumat syarikat. Syarikat dikehendaki log masuk semula ke dalam sistem melalui pautan yang telah diberikan.<br /><br />4. Syarikat perlu kemukakan akaun bank yang sah bagi tujuan pembayaran.<br /><br />5. Individu yang diisyhtiharkan dalam system ePerolehan sahaja dibenarkan menguruskan dokumen-dokumen dan urusan pendaftaran dan perolehan Maksimum 3 orang personal syarikat sahaja dibenarkan untuk diisytiharkan dalam sistem eP.

