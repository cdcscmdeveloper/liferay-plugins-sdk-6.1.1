lbl.sc.atc.tooltip = Select Item to be list in the Request Note
lbl.sc.pi.tooltip = Enable PTJ to inquiry Supplier for lowest price compared to Catalogue price and item stock availability 
lbl.sc.compare.sq = Select Item to be listed for Simple Quote<br /><br /> Simple Quote is an process to invite at least three (3) Suppliers to offered their price
lbl.sc.pricetype.tooltip = Standard price: Normal market price<br /> Tier Price: Price based on Quantity Order<br /> Standard Zon Price: Normal market price by Zonal<br /> Promotion Tier Price: Promotion Price base on Quantity Order<br /> Promotion Zonal Price: Promotion price by Zonal<br /> Tier Zonal Price: Zonal Price based on Quantity Order<br /> Tier Zonal Promotion Price: Promotion Price based on Quantity Order by Zonal<br /><br /> Price type selected will be carry to Fulfillment process
lbl.sc.procurementtype.tooltip = Normal: Procurement which required at least three (3) Suppliers per item<br /><br /> Emergency:  Procurement involved public saftey and security.<br /> For example: Nature disaster<br /><br /> Ad Hoc: Procurement ad hoc which only for allowed justification.<br /> For example: Urgent meeting, Car break down<br /><br /> G2G: Procurement involved Government Agency as Supplier<br /> Example: Maps purchasing from Jabatan Ukur dan Pemetaan Malaysia,<br /> Payment for Training participant at Government Institution such as INTAN, IPN etc. 
lbl.sc.itemsearch.tooltip = Back to Search Catalogue  
lbl.sc.pi.summary.tooltip = View Supplier respond for Simple Quote / Item Inquiry and Comparisons item for search result
lbl.sc.summary.searchresult.tooltip = Summary Item Search Result
lbl.sc.summary.item.tooltip = Summary Item Inquiry
lbl.sc.deliveryterm.tooltip = lbl.sc.deliveryterm.tooltip = To define fulfilment type by One off or periodic<br /><br /> One Off: One time order and payment<br /><br /> Schedule (Periodic) : Order based on schedule defined  along with payment<br /><br /> Periodic as and when: Order base on as and when needed along with payment 
lbl.sc.sq.zonal.tooltip = Yes: Supplier offered price is based on zone / location<br /><br /> No: Only one offered price from Supplier<br /><br /> Zone/location of product will deliver or service to 
lbl.sc.sq.panel.zonal.tooltip = Price are allowed quote  to all Item panel OR to certain Item panel only
lbl.sc.sq.normal.zonal.tooltip = Price are allowed quote  to all Item OR to certain Item only
lbl.sc.sq.quotetype.tooltip = Single Quote:<br /> Allowed Supplier to quote one time only<br />  - Recommended Supplier based on PTJ selection<br /><br /> Mutiple Quote:<br /> Allowed Supplier to quote multiple time by decrease or increase their price until closing date<br />  - Recommended Supplier base on the lowest price
lbl.sc.locationlevel.tooltip = Naming the zon and define the location for the zone base on state/ division/district 
lbl.sc.sq.location.action.tooltip = User not allowed to edit or add location / Zonal for panel item.<br />  Only allowed to select Location / Zonal related  to invite for Simple Quote. 
lbl.sc.sq.locality.tooltip = Supplier locality is refer to the business / branch address registered with Supplier registration,<br /> Ministry Of Finance or ePerolehan itself.<br /> Selection must be based on supply or service address. <br /><br /> If no. of Supplier in particular state of Supply<br />  or service  have no Supplier / not meet the no. of minimum requirement,<br />  Supplier in near or border State/District/Division allowed to invite. 
lbl.sc.sq.clone.tooltip = User able to Clone Item from previous Simple Quote
lbl.sc.sq.clonebtn.tooltip = To copy item from previous Simple Quote<br /><br /> Which comprise searching process, select previous Simple Quote follow by identify item to proceed with new Simple Quote
lbl.sc.sq.businessnature.tooltip = Business nature is refer to the type of business registered with Suruhanjaya Syarikat Malaysia / related Agencies.<br /><br /> Example: Stationery
lbl.sc.sq.supplier.zonal.tooltip = Price are allowed quote  to all Zonal / Item OR to certain Zonal / Item only
lbl.sc.sq.supplier.quotetype.tooltip = Single Quote:<br /> Price can be offered only once<br /><br /> Mutiple Quote:<br /> Prices can be offered more than once within the prescribed period, if necessary
lbl.sc.sq.recommendedsupplier.tooltip = For Single Quote,Supplier with lowest price offered will autmatically recommend by system but PTJ allow to recommend others Supplier if necessary.<br /><br /> For multiple Quote, first (1) ranking Supplier will automatically recommended by system but not allowed to amend. 
