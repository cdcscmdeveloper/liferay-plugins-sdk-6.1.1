lbl.sc.fulfilment.tooltip = Menetapkan pemenuhan pembekalan secara One Off atau bermasa<br /><br /> One Off: Sekali Pesanan Pembekalan dan pembayaran<br /><br /> Bermasa (Berjadual) : Pesanan Pembekalan  mengikut Jadual beserta pembayaran<br /><br /> Bermasa ( Bila Perlu) : Pesanan Pembekalan mengikut keperluan beserta Pembayaran
lbl.sc.sq.zonal.tooltip = Ya : Harga daripada Pembekal ditawarkan mengikut Zon/Lokasi<br /><br /> Tidak: Hanya satu harga ditawarkan daripada Pembekal<br /><br /> Zon/Lokasi di mana pembekalan atau perkhidmatan dihantar/dilaksanakan
lbl.sc.sq.panel.zonal.tooltip = Penawaran harga boleh dibuat untuk semua Item panel ATAU Item panel yang ingin disertai sahaja
lbl.sc.sq.normal.zonal.tooltip = Penawaran harga boleh dibuat untuk semua Item ATAU Item yang ingin disertai sahaja
lbl.sc.sq.quotetype.tooltip = Tawaran Tunggal:<br /> Membenarkan pembekal membuat tawaran sekali sahaja<br />  - Pembekal disyorkan berdasarkan pemilihan PTJ<br /><br /> Tawaran Berulang:<br /> Membenarkan pembekal membuat tawaran berulang sehingga tarikh tutup<br />  - Pembekal disyorkan berdasarkan harga terendah
lbl.sc.locationlevel.tooltip = Menamakan Zon dan menetapkan lokasi bagi zone berkenaan mengikut negeri / bahagian / daerah<br /><br /> Negeri : Lokasi bagi Zon ditetapkan pada peringkat negeri sahaja. Cth: Zone Utara, negeri-negeri terlibat ialah Perlis, Pulau Pinang, Perak<br /><br /> Daerah: Lokasi bagi Zon ditetapkan sehingga peringkat daerah di dalam sesebuah negeri.<br /> Cth: Zon Tengah, negeri/daerah terlibat Selangor, WP, Negeri Sembilan, (melibatkan semua daerah di negeri berkenaan) Daerah Raub dan Bentong di Pahang, serta daerah Tanjung Malim di Perak.<br /><br /> Bahagian: Lokasi bagi Zon ditetapkan sehingga peringkat bahagian di dalam sesebuah negeri (Untuk Sabah dan Sarawak sahaja)
lbl.sc.sq.location.action.tooltip = PTJ tidak dibenarkan mengemaskini atau menambah Lokasi / Zon bagi item panel.<br />  Hanya dibenarkan memilih Zon yang berkaitan sahaja untuk Pelawaan Tawaran Harga
lbl.sc.sq.locality.tooltip = Lokaliti pembekal merujuk kepada alamat perniagaan / cawangan pembekal yang didaftarkan<br /> dengan Kementerian Kewangan atau  ePerolehan.<br /> Pemilihan perlu berdasarkan lokasi /alamat pembekalan atau perkhidmatan.<br /><br /> Sekiranya bilangan pembekal di negeri pembekalan<br /> atau perkhidmatan berkenaan tiada / tidak mencukupi,<br />  pembekal di negeri/ bahagian/ daerah berhampiran/sempadan boleh dipelawa<br /><br /> Contoh: Lokasi pembekalan dan perkhidmatan adalah di daerah Jasin, Melaka.<br /> Pemilihan lokaliti yang boleh dibuat adalah semua daerah di negeri Melaka.<br /> Negeri bersempadan yang boleh dipilih adalah Johor dan <br />perlu mengenalpasti daerah di Johor yang berdekatan dengan Jasin.
lbl.sc.sq.clone.tooltip = Membolehkan PTJ untuk klon item daripada Pelawaan Tawaran Harga yang lepas
lbl.sc.sq.clonebtn.tooltip = Kemudahan untuk menyalin semula item daripada Pelawaan Tawaran Harga yang lepas.<br /><br /> Ia merangkumi proses carian, pilihan Pelawaan Tawaran Harga yang lepas serta menentukan item bagi Pelawaan Tawaran  Harga yang baru
lbl.sc.sq.businessnature.tooltip = Ciri perniagaan merujuk kepada jenis perniagaan yang didaftarkan<br /> dengan Suruhanjaya Syarikat Malaysia / Agensi-agensi berkaitan.<br /><br /> Contoh: Alatulis
