lbl.sc.pid.tooltip = Kebenaran Perolehan Luar Aturan\nContoh:\ni) Pembelian item kontrak daripada pembekal luar\nii) Pembelian item kontrak diluar terma kontrak 
lbl.sc.sq.tooltip = Membolehkan PTJ menguncimasuk maklumat item untuk disenaraikan\nbagi tujuan Pelawaan Tawaran Harga\n\nPelawaan Tawaran Harga ialah proses di mana PTJ  menjemput sekurang-kurangnya tiga (3) pembekal untuk membuat tawaran Harga
lbl.compare.tooltip = Item yang dipilih untuk perbandingan - Sekurang-kurangnya dua (2) Item diperlukan
lbl.sc.recentprice.tooltip = Paparan harga semasa item yang ditawarkan oleh Pembekal<br /> Harga tawaran lampau Pembekal dalam tempoh  (Cth: 7 hari dari tarikh semasa) yang ditetapkan oleh PTJ
lbl.sc.atc.tooltip = Pilih Item untuk disenaraikan di dalam  Nota Minta
lbl.sc.pi.tooltip = Membolehkan PTJ bertanya kepada Pembekal harga yang lebih rendah berbanding harga Katalog dan ketersediaan stok item
lbl.sc.compare.sq = Memilih item untuk disenaraikan bagi tujuan Pelawaan Tawaran Harga<br /> Pelawaan Tawaran Harga ialah proses di mana PTJ menjemput sekurang-kurangnya tiga (3) pembekal untuk membuat tawaran Harga
lbl.sc.pricetype.tooltip = Standard : Harga normal pasaran<br /> Berperingkat : Harga berdasarkan julat kuantiti pesanan<br /> Standard Zon: Harga normal pasaran mengikut Zon<br /> Berperingkat Promosi: Harga Promosi berdasarkan julat kuantiti pesanan<br /> Zon Promosi: Harga Promosi mengikut Zon<br /> Berperingkat Zon: Harga berdasarkan julat kuantiti pesanan mengikut Zon<br /> Berperingkat Zon Promosi: Harga Promosi berdasarkan julat kuantiti pesanan mengikut Zon<br /><br /> Jenis harga item yang dipilih akan dibawa kepada proses pemenuhan
lbl.sc.procurementtype.tooltip = Normal: Pembelian yang memerlukan perbandingan sekurang-kurangnya tiga (3) pembekal<br /><br /> Darurat: Perolehan yang melibatkan kepentingan dan keselamatan awam<br /> Contoh: Bencana alam<br /><br /> Segera: Perolehan segera bagi sebab-sebab tertentu yang dibenarkan.<br /> Contoh: Kerosakan kereta ketika perjalanan, mesyuarat tergempar<br /><br /> G2G: Perolehan yang melibatkan Agensi Kerajaan sebagai Pembekal<br /> Contoh: Pembelian peta daripada Jabatan Ukur dan Pemetaan Malaysia,<br /> Bayaran yuran peserta kursus di Institusi Latihan Kerajaan seperti INTAN, IPN dan lain-lain. 
lbl.sc.itemsearch.tooltip = Kembali kepada  Carian Katalog 
lbl.sc.pi.summary.tooltip = Melihat maklumbalas Pembekal berkaitan Pelawaan tawaran harga / Pertanyaan Item dan perbandingan harga hasil carian Item
lbl.sc.summary.searchresult.tooltip = Lihat perincian tawaran harga bagi setiap pembekal
lbl.sc.summary.item.tooltip = Maklumbalas Pertanyaan Item
lbl.sc.fulfilment.tooltip = Menetapkan pemenuhan pembekalan secara One Off atau bermasa<br /><br /> One Off: Sekali Pesanan Pembekalan dan pembayaran<br /><br /> Bermasa (Berjadual) : Pesanan Pembekalan  mengikut Jadual beserta pembayaran<br /><br /> Bermasa ( Bila Perlu) : Pesanan Pembekalan mengikut keperluan beserta Pembayaran
lbl.sc.sq.zonal.tooltip = Ya : Harga daripada Pembekal ditawarkan mengikut Zon/Lokasi<br /><br /> Tidak: Hanya satu harga ditawarkan daripada Pembekal<br /><br /> Zon/Lokasi di mana pembekalan atau perkhidmatan dihantar/dilaksanakan
lbl.sc.sq.panel.zonal.tooltip = Penawaran harga boleh dibuat untuk semua Item panel ATAU Item panel yang ingin disertai sahaja
lbl.sc.sq.normal.zonal.tooltip = Penawaran harga boleh dibuat untuk semua Item ATAU Item yang ingin disertai sahaja
lbl.sc.sq.quotetype.tooltip = Tawaran Tunggal:<br /> Membenarkan pembekal membuat tawaran sekali sahaja<br />  - Pembekal disyorkan berdasarkan pemilihan PTJ<br /><br /> Tawaran Berulang:<br /> Membenarkan pembekal membuat tawaran berulang sehingga tarikh tutup<br />  - Pembekal disyorkan berdasarkan harga terendah
lbl.sc.locationlevel.tooltip = Menamakan Zon dan menetapkan lokasi bagi zone berkenaan mengikut negeri / bahagian / daerah<br /><br /> Negeri : Lokasi bagi Zon ditetapkan pada peringkat negeri sahaja. Cth: Zone Utara, negeri-negeri terlibat ialah Perlis, Pulau Pinang, Perak<br /><br /> Daerah: Lokasi bagi Zon ditetapkan sehingga peringkat daerah di dalam sesebuah negeri.<br /> Cth: Zon Tengah, negeri/daerah terlibat Selangor, WP, Negeri Sembilan, (melibatkan semua daerah di negeri berkenaan) Daerah Raub dan Bentong di Pahang, serta daerah Tanjung Malim di Perak.<br /><br /> Bahagian: Lokasi bagi Zon ditetapkan sehingga peringkat bahagian di dalam sesebuah negeri (Untuk Sabah dan Sarawak sahaja)
lbl.sc.sq.location.action.tooltip = PTJ tidak dibenarkan mengemaskini atau menambah Lokasi / Zon bagi item panel.<br />  Hanya dibenarkan memilih Zon yang berkaitan sahaja untuk Pelawaan Tawaran Harga
lbl.sc.sq.locality.tooltip = Lokaliti pembekal merujuk kepada alamat perniagaan / cawangan pembekal yang didaftarkan<br /> dengan Kementerian Kewangan atau  ePerolehan.<br /> Pemilihan perlu berdasarkan lokasi /alamat pembekalan atau perkhidmatan.<br /><br /> Sekiranya bilangan pembekal di negeri pembekalan<br /> atau perkhidmatan berkenaan tiada / tidak mencukupi,<br />  pembekal di negeri/ bahagian/ daerah berhampiran/sempadan boleh dipelawa<br /><br /> Contoh: Lokasi pembekalan dan perkhidmatan adalah di daerah Jasin, Melaka.<br /> Pemilihan lokaliti yang boleh dibuat adalah semua daerah di negeri Melaka.<br /> Negeri bersempadan yang boleh dipilih adalah Johor dan <br />perlu mengenalpasti daerah di Johor yang berdekatan dengan Jasin.
lbl.sc.sq.clone.tooltip = Membolehkan PTJ untuk klon item daripada Pelawaan Tawaran Harga yang lepas
lbl.sc.sq.clonebtn.tooltip = Kemudahan untuk menyalin semula item daripada Pelawaan Tawaran Harga yang lepas.<br /><br /> Ia merangkumi proses carian, pilihan Pelawaan Tawaran Harga yang lepas serta menentukan item bagi Pelawaan Tawaran  Harga yang baru
lbl.sc.sq.businessnature.tooltip = Ciri perniagaan merujuk kepada jenis perniagaan yang didaftarkan<br /> dengan Suruhanjaya Syarikat Malaysia / Agensi-agensi berkaitan.<br /><br /> Contoh: Alatulis
lbl.sc.sq.supplier.zonal.tooltip = Sekiranya Ya, Pembekal perlu memberi maklumbalas harga untuk  semua Zon
lbl.sc.sq.supplier.quotetype.tooltip = Tawaran Tunggal:-<br /> Harga boleh ditawarkan sekali sahaja<br /><br /> Tawaran Berulang:<br /> Harga boleh  ditawarkan lebih daripada sekali   dalam tempoh ditetapkan sekiranya perlu
lbl.sc.sq.recommendedsupplier.tooltip = Bagi Tawaran Tunggal, Pembekal yang menawarkan harga terendah akan disyorkan secara automatik tetapi PTJ boleh memilih Pembekal lain sekiranya perlu<br /><br /> Bagi Tawaran Berulang, Pembekal di kedudukan pertama akan disyorkan secara automatik dan pindaan tidak dibenarkan.
lbl.sc.sq.panel.tooltip = Sistem akan menetapkan kepada Ya sekiranya Pengguna memilih item panel dari Katalog. 
lbl.sc.compare.remove.tooltip = Keluarkan item daripada senarai perbandingan
lbl.sc.delivery.term.tooltip = Tempoh penghantaran yang berbeza akan menjana Permintaan Pembelian yang berlainan.
