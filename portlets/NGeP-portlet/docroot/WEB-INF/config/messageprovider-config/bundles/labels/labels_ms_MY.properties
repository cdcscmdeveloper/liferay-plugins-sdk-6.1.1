lbl.sm.basic.account.basic.tnc=1.	Akaun Asas boleh menyertai pemilihan pembekal sehingga nilai RM20,000 sahaja selaras dengan SPP Bil 1/2014<br /><br />2.	Individu yang diisyhtiharkan dalam system ePerolehan sahaja dibemarkan menguruskan dokumen-dokumen dan urusan pendaftaran dan perolehan<br /><br />3.	Basic account boleh menyertai pemilihan pembekal sehingga nilai RM20,000 sahaja selaras dengan SPP Bil 1/2014<br /><br />4.	Kementerian Kewangan Malaysia berhak untuk membatalkan pendaftaran dan menyahaktifkan maklumat syarikat dari rekod system ePerolehan sekiranya syarikat tiada log masuk dalam tempoh setahun pendaftaran.<br /><br />5.	Syarikat boleh mengaktif semula akaun dengan log masuk semula dan menjawab soalan rahsia. Jika syarikat berjaya menjawab soalan rahsia, syarikat akan diberikan pautan pengaktifan melalui alamat e-mel yang telah didaftarkan dalam maklumat syarikat. Syarikat dikehendaki log masuk semula ke dalam system melalui pautan yang telah diberikan.<br /><br />6.	Syarikat mestilah bebas dan tidak terlibat dalam penggulungan, likuidasi atau pembubaran<br /><br />7.	Sebarang perubahan ke atas maklumat syarikat perlu dikemaskini dengan segera.<br /><br />8.	Syarikat perlu kemukakan akaun bank yang sah bagi tujuan pembayaran.<br /><br />9.	Maksimum 3 orang personal syarikat sahaja dibenarkan untuk diisythiharkan dalam sistem eP<br /><br />10.	Kerajaan tidak bertanggungjawab terhadap kerugian yang ditanggung jika pengguna berbuat demikian<br />
lbl.sm.basic.account.mof.tnc=1. Tempoh sah laku Sijil Akuan Pendaftaran MOF ialah tiga(3) tahun dari tarikhdidaftarkan<br /><br />2. Setiap permohonan untuk memperbaharui pendaftaran iludibuat oleh syarikat dalam tempoh tiga bulan sebelum tempoh penda\uFB02aran syarikat tamaL Kegagalan berbuat demikian akan menyebabkan syarikat tidak dapat menyertai tender! sebuthargal pembelian terus yang ditawarkan<br /><br />3. Syarikat hanya perlu membuat pembayaran setelah permohonan pendaftaran diluluskan<br /><br />4. Syarikat yang telah didaftarkan bertanggungjawab untuk mengemaskini maklumat secara atas talian sekiranya terdapat apa-apa perubahan dalam tempoh masa 21 hari dari tarikh perubahan tersebut berlaku kecuali syarikat atau pemilik bertaraf Bumiputera (3 bulan).<br /><br />5. Sekiranya gagal, MOF boleh membatalkan pendaftaran atau mengambil lain-lain tindakan seperti di SPP 6/2010<br /><br />6. Had bidang bagi pendaftaran barul pembaharuan syarikat hanya dibenarkan maksimum tiga puluh(30) kod bidang sahaja.<br /><br />7. Bidang yang dipohon hendaklah selaras dengan jenis pemiagaan yang didaftarkan di bawah undang-undang organisasi pendaftaran masing-masing<br /><br />8. Pemilik modal! pengarah yang sama dalam dua atau lebih syarikat tidak boleh didaftarkan dalam bidang yang sama<br /><br />9. Syarikat hendaklah mempunyai satu akaun semasa yang aktif atas nama syarikat untuk tujuan pendaftaran dan satu akaun untuk tujuan pembayaran sekiranya bertransaksi dengan kerajaan<br /><br />10. Kerajaan tidak akan bertanggungjawab ke atas kerugian yang dialami syarikat jika membenarkan individu yang tidak diisyliharkan di dalam system ePerolehan untuk berurusan dengan Kementerian Kewangan<br /><br />
lbl.sm.basic.account.basicdesc=1. Akaun Asas boleh menyertai pemilihan pembekal sehingga nilai RM20,000 sahaja selaras dengan SPP Bil 1/2014.<br /><br />2. Kementerian Kewangan Malaysia berhak untuk membatalkan pendaftaran dan menyahaktifkan maklumat syarikat dari rekod sistem ePerolehan sekiranya tempoh setahun pendaftaran.<br /><br />3. Syarikat boleh mengaktif semula akaun dengan log masuk semula dan menjawab soalan rahsia. Jika syarikat berjaya menjawab soalan rahsia, syarikat akan alamat e-mel yang telah didaftarkan dalam maklumat syarikat. Syarikat dikehendaki log masuk semula ke dalam sistem melalui pautan yang telah diberikan.<br /><br />4. Syarikat perlu kemukakan akaun bank yang sah bagi tujuan pembayaran.<br /><br />5. Individu yang diisyhtiharkan dalam sistem ePerolehan sahaja dibenarkan menguruskan dokumen-dokumen dan urusan pendaftaran dan perolehan maksimum 3 orang personel/pekerja syarikat sahaja dibenarkan untuk diisytiharkan dalam sistem eP.
lbl.sm.basic.account.mofdesc=1. Pembekal yang berdaftar dengan Kementerian Kewangan Malaysia (MOF) boleh menyertai pemilihan pembekal sehingga atau melebihi nilai RM20,000.<br /><br />2. Tempoh sah laku Sijil Akuan Pendaftaran MOF ialah tiga(3) tahun dari tarikh didaftarkan. MOF akan membatalkan pendaftaran syarikat secara automatic sekiranya syarikat tidak membuat pembaharuan dalam tempoh satu(1) tahun dari tarikh tamat pendaftaran.<br /><br />3. Had bidang bagi pendaftaran baru/ pembaharuan syarikat hanya dibenarkan maksimum tiga puluh(30) kod bidang sahaja. Bidang yang dipohon hendaklah selaras dengan jenis perniagaan yang didaftarkan di bawah undang-undang organisasi pendaftaran masing-masing.<br /><br />4. Syarikat hendaklah mempunyai satu akaun semasa yang aktif atas nama syarikat untuk tujuan pendaftaran dan satu akaun untuk tujuan pembayaran sekiranya bertransaksi dengan kerajaan.<br /><br />5. Bayaran proses sebanyak RM50 (tidak dikembalikan) hendaklah dijelaskan selepas pengisytiharan sebelum permohonan dapat diproses manakala bayaran pendaftaran sebanyak RM400 hanya perlu dibuat setelah permohonan pendaftaran diluluskan.
