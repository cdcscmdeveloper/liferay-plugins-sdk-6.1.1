lbl.sc.evaluation.type = Kaedah Penilaian
lbl.sc.evaluation.type.tooltip=Terdapat dua kaedah penilaian: <br/><br/>1 Peringkat : <br/>Cadangan teknikal dan kewangan dinilai oleh satu jawatankuasa sahaja iaitu Jawatankuasa Penilaian. Ianya meliputi semakan pematuhan dokumen dan cadangan spesifikasi daripada pembekal. Hasil penilaian teknikal dan kewangan akan disatukan untuk tujuan pengesyoran.<br/><br/>2 Peringkat :<br/>Penilaian cadangan dilaksanakan oleh tiga jawatankuasa iaitu:<br/>a. Jawatankuasa Pembuka - melaksanakan semakan pematuhan dokumen.<br/><br/>b. Jawatankuasa Penilaian Teknikal - melaksanakan penilaian cadangan teknikal hanya kepada pembekal yang melepasi semakan pematuhan dokumen<br/><br/>c. Jawatankuasa Penilaian Kewangan - melaksanakan penilaian cadangan kewangan hanya kepada tawaran pembekal yang melepasi penilaian teknikal<br/><br/>Panduan pemilihan kaedah:<br/>\u2022 Kaedah penilaian 1 peringkat lebih sesuai digunapakai apabila perolehan melibatkan spesifikasi yang ringkas/mudah, manakala kaedah penilaian 2 peringkat lebih sesuai digunapakai apabila perolehan melibatkan spesifikasi yang kompleks.<br/>\u2022 Bagi anggaran harga sehingga RM50,000, kaedah penilaian ditetapkan secara automatik kepada 1 Peringkat.
