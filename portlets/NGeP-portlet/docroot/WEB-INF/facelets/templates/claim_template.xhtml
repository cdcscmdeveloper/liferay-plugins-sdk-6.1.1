<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">


	<c:choose>
		<c:when
			test="${bpmTasklistBackingBean.managedBean.groupTask eq 'true' and !bpmTasklistBackingBean.managedBean.claim}">
			<p:commandButton value="#{lbl['lbl.bpm.btn.claim']}"
				action="#{bpmTasklistBackingBean.claimTaskInDetailPage}"
				update="@form">
				<f:setPropertyActionListener target="#{readOnlyTask}" value="false" />
				</p:commandButton>
		</c:when>
		<c:otherwise>
			<ui:insert name="outComeSection" />
		</c:otherwise>
	</c:choose>




</ui:composition>
