<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<h:head>

	<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
	<ui:insert name="resourceSection" />
	<!--  	<h:outputScript library="my.ac/js" name="cc.js" />-->
	<script>
	
		 function limitTextArea(element, limit) { 
       	  var total = 0;
       	  var value = 0;
       	  total = element.value.split(/\n[\r\n]*/).length;
        	  if ( element.value.length > limit-total-1) { 
                   element.value = element.value.substring(0, limit-total-1); 
              } 
         } 
		 
		var timeOut;
		function scrollToTop() {
			if (document.body.scrollTop!=0 || document.documentElement.scrollTop!=0){
				window.scrollBy(0,-50);
				timeOut=setTimeout('scrollToTop()',10);
			}
			else clearTimeout(timeOut);
		}
		
		function singleUploadListener(upload_widget) {
			addChooseOnchange(upload_widget);
		}
		function uploadListener(upload_widget) {
			upload_widget.uploadContent.find('tr.ui-state-error').remove();
			addChooseOnchange(upload_widget);
		}		
		
		function addChooseOnchange(upload_widget) {
			if(upload_widget.buttonBar.find('input[type=file]').get(0).type == 'file') {
				upload_widget.buttonBar.find('input[type=file]').get(0).title = '#{lbl['lbl.btn.upload.tooltip']}';
				upload_widget.buttonBar.find('input[type=file]').change(function() {
					clearInvalidFiles(upload_widget);
					//var files = upload_widget.uploadContent.find('.files .template-upload');
					if(!upload_widget.buttonBar.find('input[type=file]').get(0).multiple) {
						var files = upload_widget.uploadContent.find('.files tr:not(.ui-state-error)');
						if (files.length >= 1) {
							upload_widget.buttonBar.find('input[type=file]').get(0).disabled=true;
							doggleChooseButton(upload_widget);
						}
						addChooseOnchange(upload_widget);	
					}
				});
			}
		}
		
		function doggleChooseButton(upload_widget) {
			upload_widget.uploadContent.find('.cancel').get(0).onclick = function(){
				//var files = upload_widget.uploadContent.find('.files .template-upload');
				var files = upload_widget.uploadContent.find('.files tr:not(.ui-state-error)');
				if (files.length == 1) {
					upload_widget.buttonBar.find('input[type=file]').get(0).disabled=false;
				}
			}		
		}
		
	    function clearInvalidFiles(upload_widget) {
	    	/*if(upload_widget.uploadContent.find('.files .template-upload').length > 1) {
	    		upload_widget.uploadContent.find('tr.ui-state-error').get(0).remove();	    		
	    	}*/
	    	var files = upload_widget.uploadContent.find('.files .template-upload');
	    	if(files.length >= 2) {
	    		var last2ndFile = files.get(files.length - 2);
	    		if(last2ndFile.className.indexOf('ui-state-error') >= 0) {
	    			upload_widget.uploadContent.find('tr.ui-state-error').get(0).remove();
	    		}
	    	}
	    }

	</script>
</h:head>

<h:body>


	<h:form id="form">
		<div id="content" style="width: 100%;">
		
			<ui:insert name="titleSection"/>
			
			
			<ui:insert name="contentSection" />
			
		</div>
	</h:form>

	<div id="footer">
		<ui:insert name="footerSection" />
	</div>
</h:body>

</html>
