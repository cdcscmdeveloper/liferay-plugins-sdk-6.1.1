		function autoSelectOrgType() {
			if ($("input[id$=':form:sorSearchOrgTypeId:0']").is(':disabled') || $("input[id$=':form:sorSearchOrgTypeIdUser:0']").is(':disabled')) {
				console.log("0");
				$("input[id$=':form:sorSearchOrgTypeId:1']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeId:1']").change();
				
				//sorSearchOrgTypeIdUser
				$("input[id$=':form:sorSearchOrgTypeIdUser:1']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeIdUser:1']").change();
				
			} else if ($("input[id$=':form:sorSearchOrgTypeId:1']").is(
					':disabled') || $("input[id$=':form:sorSearchOrgTypeIdUser:1']").is(
					':disabled')) {
				console.log("1");
				$("input[id$=':form:sorSearchOrgTypeId:0']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeId:0']").change();
				
				//sorSearchOrgTypeIdUser
				$("input[id$=':form:sorSearchOrgTypeIdUser:0']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeIdUser:0']").change();
				
			} else {
				console.log("2");
				$("input[id$=':form:sorSearchOrgTypeId:0']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeId:0']").change();
				
				//sorSearchOrgTypeIdUser
				$("input[id$=':form:sorSearchOrgTypeIdUser:0']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeIdUser:0']").change();
			}
		}
	</script>
