<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<p:blockUI widgetVar="blkPanelSearchTable"  block=":form" trigger="panelSearchId">  
			  <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		 </p:blockUI> 
	<p:panel header="#{lbl['lbl.pm.audit.result_']}" toggleable="true">
		<p:dataTable id="searchMasters" var="master" rows="10"
			value="#{searchPMAuditBackingBean.searchMaster}"
			rowIndexVar="index" lazy="true">
			<ac:paginator for="searchMasters"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.audit.config']}" style="width :10%">
				<h:outputText value="#{master.paramLevel1}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.configCategory']}" style="width :10%"> 
				<h:outputText value="#{master.paramLevel2}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.configItem']}" style="width :10%"> 
				<h:outputText value="#{master.paramLevel3}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionBy']}" style="width :15%">
				<h:outputText value="#{master.actionBy}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Role']}" style="width :10%"> 
				<h:outputText value="#{master.roleCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.action']}" style="width:5%;text-align:center;">
				<p:commandLink id="panelSearchId"
					action="#{searchPMAuditBackingBean.redirectToDetails(master.paramLevel3,master.pmParameterLvlId,master.createBy,master.roleCode)}"
					onstart="blkPanelSearchTable.show();" oncomplete="blkPanelSearchTable.hide();">
					<p:graphicImage library="ep/images/design" 
						title="#{lbl['lbl.pm.update.location']}"
						value="/css/images/design/ico-view.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
