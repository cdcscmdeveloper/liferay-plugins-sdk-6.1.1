<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="locationSearchPanel"
		header="#{lbl['lbl.pm.search.location']}" toggleable="true">
		<table class="ppTwoTable">
				<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.location.type']}" /><h:outputLabel
							value="*" styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="locationSearchType" styleClass="ppDropDownWidthM" style="width: 135px;margin-bottom: 5px;"
				        label="#{lbl['lbl.pm.location.type']}"
						value="#{locationAuditBackingBean.managedBean.locationSearchBean.locationType}" >
						<f:selectItems value="#{locationAuditBackingBean.getDropdownCodeValues(ParameterTypeConst.locationLevel)}" />	
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>			
			  <tr>
				<td colspan="4" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							update="searchLocations" process="locationSearchPanel"
							 action="#{locationAuditBackingBean.searchLocation}" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							update=":form:locationSearchPanel,:form:searchLocations" process="@this"
							action="#{locationAuditBackingBean.resetLocationSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
