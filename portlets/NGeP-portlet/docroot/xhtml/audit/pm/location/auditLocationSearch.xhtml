<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >
	<p:panel id="locationSearchPanel"
		header="#{lbl['lbl.pm.search.location']}" toggleable="true">
		<table class="ppTwoTable">
			<!--  <tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.audit.PM']}" /> <h:outputLabel value="*"
						styleClass="mandatory" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" maxlength="10"
						style="width:8%" value="Sistem Konfigurasi" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>-->
		
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.PM']}" />
					<h:outputLabel value="*" styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="paramLevel1"
						styleClass="ppDropDownWidthM" required="true"
						label="#{lbl['lbl.pm.audit.SC']}"
						value="#{locationAuditBackingBean.managedBean.locationSearchBean.systemConfigParamLevel1}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{locationAuditBackingBean.getDropdownLevel1()}"
							var="lvl1" itemLabel="#{lvl1.codeName}"
							itemValue="#{lvl1.levelCode}" />
						<p:ajax event="change" update="paramLevel1,paramLevel2"
							listener="#{locationAuditBackingBean.changeLocationType()}" />
					</p:selectOneMenu></td>
				<td><p:message for="paramLevel1" id="paramLevel1Msg"
						display="icon" /></td>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.configCategory']}" />
					<h:outputLabel value="*" styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="paramLevel2"
						styleClass="ppDropDownWidthM" required="true"
						label="#{lbl['lbl.pm.audit.configCategory']}"
						value="#{locationAuditBackingBean.managedBean.locationSearchBean.categoryConfigParamLevel2}"
						style="width: 275px;margin-bottom: 5px;"
						disabled="#{locationAuditBackingBean.managedBean.locationSearchBean.systemConfigParamLevel1 eq null}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{locationAuditBackingBean.getDropdownLevel2()}"
							var="lvl2" itemLabel="#{lvl2.codeName}"
							itemValue="#{lvl2.levelCode}" />
						<p:ajax event="change" update="paramLevel1,paramLevel2,paramLevel3"
							listener="#{locationAuditBackingBean.changeLocationType()}" />
					</p:selectOneMenu></td>
				<td><p:message for="paramLevel2" id="paramLevel2Msg"
						display="icon" /></td>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.configItem']}" /></th>
				<td><p:selectOneMenu id="paramLevel3"
						styleClass="ppDropDownWidthM" required="false" label="#{lbl['lbl.pm.audit.configItem']}"
						value="#{locationAuditBackingBean.managedBean.locationSearchBean.itemConfigParamLevel3}"
						style="width: 275px;margin-bottom: 5px;"
						disabled="#{locationAuditBackingBean.managedBean.locationSearchBean.categoryConfigParamLevel2 eq null}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{locationAuditBackingBean.getDropdownLevel3()}"
							var="lvl3" itemLabel="#{lvl3.codeName}"
							itemValue="#{lvl3.levelCode}" />
						<p:ajax event="change" update="paramLevel1,paramLevel2,paramLevel3"
						listener="#{locationAuditBackingBean.changeLocationType()}" />
					</p:selectOneMenu></td>
				<td><p:message for="paramLevel3" id="paramLevel3Msg"
						display="icon" /></td>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.Role']}" /></th>
				<td><p:selectOneMenu id="roles"
						styleClass="ppDropDownWidthM" required="false" label="#{lbl['lbl.pm.audit.Role']}"
						value="#{locationAuditBackingBean.managedBean.locationSearchBean.roleCode}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{locationAuditBackingBean.getDropdownRoleList()}"
							var="roleItem" itemLabel="#{roleItem.roleCode}"
							itemValue="#{roleItem.roleCode}" />
						<p:ajax event="change" update="roles,searchActionBylist"
						listener="#{locationAuditBackingBean.getActionByListbyRoleCode()}" />
					</p:selectOneMenu></td>
				<td><p:message for="roles" id="rolesMsg"
						display="icon" /></td>
				<td>&#160;</td>
			</tr>
			<tr>
			<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.actionBy']}" /></th>
           	<td><ac:lov id="searchActionBylist" lovId="PM_USER" size="60" readonly="true"
				disabled="#{ocationAuditBackingBean.managedBean.locationSearchBean.role eq null}"
				headerText="#{lbl['lbl.pm.audit.lbl.pm.audit.actionBy']}" 
				value="#{locationAuditBackingBean.managedBean.locationSearchBean.actionById}"
				postUpdateListener=""
				update="@form"
				saveObject="locationAuditBackingBean.managedBean.vpmAuditLocationDTOList">
			</ac:lov>
			</td>
			</tr>
			<!--  <tr>
				<th width="20%"><p:outputLabel value="Tindakan Oleh" /></th>
				<td><p:selectOneMenu id="actionsby"
						styleClass="ppDropDownWidthM" required="false" label="Role"
						value="#{locationAuditBackingBean.managedBean.locationSearchBean.actionById}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{locationAuditBackingBean.getActionByListbyRoleCode()}"
							var="actionItem" itemLabel="#{actionItem.userName}"
							itemValue="#{actionItem.actionById}" />
						<p:ajax event="change" update=""
						listener="#{locationAuditBackingBean.changeLocationType()}" />
					</p:selectOneMenu></td>
				<td><p:message for="actionsby" id="actionsbyMsg"
						display="icon" /></td>
				<td>&#160;</td>
			</tr>
			-->
			<tr><th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.actionDate']}"/></th></tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.dateFrom']}"/></th>
           	<td><p:calendar id="popupButtonCal"   showOn="button" style="width:130px;" readonlyInput="true" 
               	value="#{locationAuditBackingBean.managedBean.locationSearchBean.dateFrom}" 
               	pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
               	<p:ajax event="dateSelect" update="popupButtonCal,popupButtonCal1" />
               	</p:calendar>
               	</td>
               	<td>&#160;</td>
               	<td>&#160;</td>
           	</tr>
           				<!--  <tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar showOn="button" size="35"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentFromDuration}">
							<p:ajax event="dateSelect" update="toDate" />
						</p:calendar></td>

					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar showOn="button" size="20"
							mindate="#{directPurchaseBackingBean.managedBean.searchDocumentFromDuration}"
							id="toDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentToDuration}">
						</p:calendar></td>
				</tr>-->
           	<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.audit.dateTo']}" /></th>
           	<td><p:calendar id="popupButtonCal1" showOn="button"  style="width:130px;"  readonlyInput="true" 
             	mindate="#{locationAuditBackingBean.managedBean.locationSearchBean.dateFrom}"
             	value="#{locationAuditBackingBean.managedBean.locationSearchBean.dateTo}"
             	pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
				<p:ajax event="dateSelect" update="popupButtonCal,popupButtonCal1" />
				</p:calendar>
			</td>
			<td>&#160;</td>
               	<td>&#160;</td>
			</tr>

			<tr>
				<td colspan="4" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							update="searchLocations" process="locationSearchPanel"
							action="#{locationAuditBackingBean.searchLocation}" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							update=":form:locationSearchPanel,:form:searchLocations"
							process="@this"
							action="#{locationAuditBackingBean.resetLocationSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
