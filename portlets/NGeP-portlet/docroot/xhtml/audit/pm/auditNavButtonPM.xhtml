<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="pSupportDocHeader">

		<table style="width: 100%">
			<tr>
				<td>
					<div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.back']}"
							action="#{searchPMAuditBackingBean.backToSearch}" style="float:left;"
							process="@this" />
					</div>
				</td>
				<td>	
					<div align="right" style="width: 100%">
						<p:commandLink value="#{lbl['lbl.btn.print']}" styleClass="blue_font" style="color:#009ae5 !important;" ajax="false">
						<p:fileDownload value="#{auditPMDocBBean.generateReport(
												searchPMAuditBackingBean.reqDTO)}" />
						</p:commandLink>
						&#160;
						<p:commandLink value="#{lbl['lbl.btn.download']}" styleClass="blue_font" style="color:#009ae5 !important;" ajax="false">
						<p:fileDownload value="#{auditPMDocBBean.generateRptExcel(
												searchPMAuditBackingBean.reqDTO, 
												searchPMAuditBackingBean.searchDetail)}" />
						</p:commandLink>
						&#160;
					</div>
				</td>
			</tr>
		</table>

	</p:outputPanel>
</ui:composition>
