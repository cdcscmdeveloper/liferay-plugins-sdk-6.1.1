<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">
		<p:dataTable style="table-layout: fixed; width: 100%;"
			id="searchDetails" var="detail" rows="10"
			value="#{searchPMAuditBackingBean.searchDetail}" rowIndexVar="index"
			lazy="true">
			<ac:paginator for="searchDetails"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.audit.actionDate']}" style="white-space: normal!important;" width="6%">
				<h:outputText value="#{detail.createdDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionType']}" style="white-space: normal!important;" width="6%">
				<h:outputText value="#{detail.actionType}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionBy']}" style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.actionBy}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Organization']}" style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.orgName}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Role']}" style="white-space: normal!important;" width="9%">
				<h:outputText value="#{detail.roleName}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.docType']}" style="white-space:pre-wrap!important;word-break: break-word;width: 13%;">
				<h:outputText value="#{detail.docType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.docNo']}" style="white-space:normal!important;width: 8%;">
				<h:outputText value="#{detail.docNo}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.fieldName']}" style="white-space:normal!important;width: 8%;">
				<h:outputText value="#{detail.fieldLabelName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.oldValue']}" style="white-space:pre-wrap!important;word-break: break-word;width: 16%;"> 
				<h:outputText value="#{detail.oldValue}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.newValue']}" style="white-space:pre-wrap!important;word-break: break-word;width: 16%;">
				<h:outputText value="#{detail.newValue}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
