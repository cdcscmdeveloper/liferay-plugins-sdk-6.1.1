<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">
		<p:dataTable style="table-layout: fixed; width: 100%;"
			id="searchDetails" var="detail" rows="10"
			value="#{searchPMAuditBackingBean.searchDetail}" rowIndexVar="index"
			lazy="true">
			<ac:paginator for="searchDetails"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.audit.actionDate']}"
				style="white-space: normal!important;" width="6%">
				<h:outputText value="#{detail.createdDate}"
					style="display: block; width: 100%; white-space: normal;">
					<f:convertDateTime
						pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionType']}"
				style="white-space: normal!important;" width="6%">
				<h:outputText value="#{detail.actionType}"
					style="display: block; width: 100%; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionBy']}"
				style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.actionBy}"
					style="display: block; width: 100%; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Organization']}"
				style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.orgName}"
					style="display: block; width: 100%; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Role']}"
				style="white-space: normal!important;" width="9%">
				<h:outputText value="#{detail.roleName}"
					style="display: block; width: 100%; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.docType']}" style="width: 13%;">
				<h:outputText value="#{searchPMAuditBackingBean.wrapText(detail.docType)}"
					style="display: block; width: 100%; word-break: break-all; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.docNo']}"
				style="width: 8%;">
				<h:outputText value="#{detail.docNo}"
					style="display: block; width: 100%; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.fieldName']}"
				style="width: 8%;">
				<h:outputText value="#{detail.fieldLabelName}"
					style="display: block; width: 100%; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.oldValue']}"
				style="width: 16%;">
				<h:outputText value="#{searchPMAuditBackingBean.wrapText(detail.oldValue)}"
					style="display: block; width: 100%; word-break: break-word; white-space: normal;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.newValue']}"
				style="width: 16%;">
				<h:outputText value="#{searchPMAuditBackingBean.wrapText(detail.newValue)}"
					style="display: block; width: 100%; word-break: break-word; white-space: normal;" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
