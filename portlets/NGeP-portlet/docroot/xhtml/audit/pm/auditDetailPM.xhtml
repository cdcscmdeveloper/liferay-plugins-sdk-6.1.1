<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Audit Trail Details" toggleable="true">
		<div align="right" style="vertical-align: top; width: 100%">
			<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
			<p:fileDownload value="#{auditPMDocBBean.generateReport(searchPMAuditBackingBean.reqDTO)}" />
			</p:commandLink>
			&#160;
			<p:commandLink value="#{lbl['lbl.btn.download']}" ajax="false">
			<p:fileDownload value="#{auditPMDocBBean.generateRptExcel(searchPMAuditBackingBean.reqDTO, searchPMAuditBackingBean.searchDetail)}" />
			</p:commandLink>
			&#160;
		</div>
		
		<p:dataTable id="searchDetails" var="detail" rows="10"
			value="#{searchPMAuditBackingBean.searchDetail}"
			rowIndexVar="index" lazy="true">
			<ac:paginator for="searchDetails"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.audit.actionDate']}" style="white-space: normal!important;" width="6%">
				<h:outputText value="#{detail.createdDate}" >
				<f:convertDateTime pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionType']}" style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.actionType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.actionBy']}" style="white-space: normal!important;" width="10%"> 
				<h:outputText value="#{detail.actionBy}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Organization']}" style="white-space: normal!important;" width="8%"> 
				<h:outputText value="#{detail.orgName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.Role']}" style="white-space: normal!important;" width="8%"> 
				<h:outputText value="#{detail.roleName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.docType']}" style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.docType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.docNo']}" style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.docNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.fieldName']}" style="white-space: normal!important;" width="8%">
				<h:outputText value="#{detail.fieldLabelName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.oldValue']}" style="white-space: normal!important;" width="18%">
				<h:outputText value="#{detail.oldValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.audit.newValue']}" style="white-space: normal!important;" width="18%">
				<h:outputText value="#{detail.newValue}" />
			</p:column>	
		</p:dataTable>
	</p:panel>
</ui:composition>
