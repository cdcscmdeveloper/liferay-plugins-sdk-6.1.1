<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">
		<p:dataTable style="table-layout: fixed; width: 100%;"
			id="searchPatchDetails" var="detail" rows="10"
			value="#{auditPatchBackingBean.searchDetail}" rowIndexVar="index"
			lazy="true">
			<ac:paginator for="searchDetails"></ac:paginator>
			<p:column headerText="#{lbl['lbl.audit.header.action.date']}" style="white-space: normal!important;" width="6%">
				<h:outputText value="#{detail.actionDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.action.type']}" style="white-space: normal!important;" width="5%">
				<h:outputText value="#{detail.actionType}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.action.by']}" style="white-space: normal!important;" width="7%">
				<h:outputText value="#{detail.actionBy}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.org.name']}" style="white-space: normal!important;" width="7%">
				<h:outputText value="#{detail.organization}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.role']}" style="white-space: normal!important;" width="7%">
				<h:outputText value="#{detail.role}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.docType']}" style="white-space:pre-wrap!important;word-break: break-word;width: 7%;">
				<h:outputText value="#{detail.docTypeName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.docNo']}" style="white-space:normal!important;width: 7%;">
				<h:outputText value="#{detail.docNo}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.fieldName']}" style="white-space:normal!important;width: 7%;">
				<h:outputText value="#{detail.fieldName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.oldValue']}" style="white-space:pre-wrap!important;word-break: break-word;width: 8%;"> 
				<h:outputText value="#{detail.oldValue}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.newValue']}" style="white-space:pre-wrap!important;word-break: break-word;width: 8%;">
				<h:outputText value="#{detail.newValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.patch.change.type']}" style="white-space:pre-wrap!important;word-break: break-word;width: 7%;">
				<h:outputText value="#{detail.changeTypeName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.patch.req.by']}" style="white-space:pre-wrap!important;word-break: break-word;width: 7%;">
				<h:outputText value="#{detail.requestBy}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.patch.req.org']}" style="white-space:pre-wrap!important;word-break: break-word;width: 9%;">
				<h:outputText value="#{detail.requestOrg}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.patch.eaduan.no']}" style="white-space:pre-wrap!important;word-break: break-word;width: 7%;"
				rendered="#{auditPatchBackingBean.managedBean.hideAduan}">
				<h:outputText value="#{detail.eAduanNo}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
