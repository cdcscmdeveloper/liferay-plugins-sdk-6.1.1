<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<p:blockUI widgetVar="blkPanelSearchTable"  block=":form" trigger="panelSearchId">  
			  <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		 </p:blockUI> 
	<p:panel header="#{lbl['lbl.audit.patch.search.result']}" toggleable="true">
		<p:dataTable id="searchPatchMaster" var="master" rows="10"
			value="#{auditPatchBackingBean.searchMaster}"
			rowIndexVar="index" lazy="true">
			<ac:paginator for="searchPatchMaster"></ac:paginator>	
			<p:column headerText="#{lbl['lbl.audit.patch.change.type']}" style="width :10%">
				<h:outputText value="#{master.changeType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.patch.eaduan.no']}" style="width :10%"> 
				<h:outputText value="#{master.eAduanNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.docType']}" style="width :10%"> 
				<h:outputText value="#{master.docType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.header.docNo']}" style="width :15%">
				<h:outputText value="#{master.docNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.audit.patch.action']}" width="5%" style="text-align: center;">
				<p:commandLink action="#{auditPatchBackingBean.redirectToDetails(master.auPatchChangeTypeID,master.eAduanNo,master.auPatchDocumentTypeID,master.docNo)}">
					<p:graphicImage  id="downloadFileImg" value="/css/images/design/document.png"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
