<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">


		<p:messages id="errorListMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false">
		</p:messages>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<h:panelGroup id="errorsListViewId">

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.bpm.btn.refresh']}"
					onclick="this.disabled=true;" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{bpmErrorListBackingBean.refreshError()}" update="@form" >
				</p:commandButton>
			</div>

			<p:dataTable id="errorListMyErrorId"
				value="#{bpmErrorListBackingBean.managedBean.errorListDataModel}"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}" lazy="true"
				rowIndexVar="rowIndex" rows="10"
				style="width:100%;" var="errors" widgetVar="errorListTableWidget">
				<ac:paginator for="errorListMyErrorId"></ac:paginator>

				<p:column width="25%;" style="white-space:normal;">
					<f:facet name="header">#{lbl['lbl.bpm.title']}</f:facet>
					<p:commandLink
						action="#{bpmErrorListBackingBean.onClickPayload(errors.title,errors.taskId)}"
						oncomplete="payloadPopUp.show()" partialSubmit="true"
						update="@form" >#{errors.title}
					</p:commandLink>
				</p:column>

				<p:column width="10%">
					<f:facet name="header">#{lbl['lbl.bpm.created.date']}</f:facet>
					<h:outputText value="#{errors.createDate.time}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column width="18%">
					<f:facet name="header">#{lbl['lbl.bpm.status']}</f:facet>
					#{bpmErrorListBackingBean.applicationStatus(errors.docStatus)}
				</p:column>

				<p:column width="6%">
					<f:facet name="header">#{lbl['lbl.cm.action']}</f:facet>
					<p:commandButton value="#{lbl['lbl.bpm.btn.retry']}"
						onclick="this.disabled=true;" onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{bpmErrorListBackingBean.submitError(errors.taskId,errors.title)}"
						update="@form">

						<f:param name="errorId" value="#{errors.taskId}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
			
			<p:dialog id="payloadPopUp" widgetVar="payloadPopUp"
				header="#{bpmErrorListBackingBean.managedBean.errorMessageTitle}"
				styleClass="screen-title" resizable="false" modal="true" width="650"
				height="500">
				<h:outputText
					value="#{bpmErrorListBackingBean.managedBean.payloadContent}"
					escape="false" >
				</h:outputText>
				<p:inputTextarea autoResize="false" readonly="true"
					value="#{bpmErrorListBackingBean.managedBean.bodyPayload}"
					escape="false" style="margin: 0px;width: 602px;height: 367px;">
				</p:inputTextarea>
			</p:dialog>

		</h:panelGroup>

	</ui:define>

</ui:composition>
