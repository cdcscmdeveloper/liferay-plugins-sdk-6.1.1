<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">



		<p:panel header="#{lbl['lbl.cm.search.result']}" toggleable="true">
			<p:remoteCommand name="refreshPtj" id="refreshPtj"
				action="#{interfacePtjBackingBean.checkingCheckAll}"
				update=":form:interfacePtjListId:selectAllCheckBoxId"></p:remoteCommand>

			<p:dataTable id="interfacePtjListId" lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="rowIndex"
				value="#{interfacePtjBackingBean.managedBean.searchDataModel}"
				rowKey="#{ptj.interfacePtjId}" var="ptj" width="100%" rows="10">



				<ac:paginator for="interfacePtjListId"></ac:paginator>


				<p:column style="text-align: left;width:2%;">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selectAllCheckBoxId"
							value="#{interfacePtjBackingBean.managedBean.checkBoxAll}">
							<p:ajax event="change" update="@(.ui-chkbox[id$=singleCheckBoxID])"
								listener="#{interfacePtjBackingBean.cloneAllSelection()}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox id="singleCheckBoxID"
						value="#{ptj.selected}">
						<p:ajax event="change" update="@(.ui-chkbox[id$=selectAllCheckBoxId])"
							listener="#{interfacePtjBackingBean.cloneItemSelection(rowIndex)}"></p:ajax>
					</p:selectBooleanCheckbox>
				</p:column>




				<p:column>
					<f:facet name="header">
					Ptj Code
				</f:facet>
				#{ptj.ptjCode}
			</p:column>


				<p:column width="5%">
					<f:facet name="header">
						Effective Date
			</f:facet>
					<h:outputText value="#{ptj.effDate}" size="10" disabled="true"
						style="text-align:right">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column width="5%">
					<f:facet name="header">
						Expiry Date
			</f:facet>
					<h:outputText value="#{ptj.expDate}" size="10" disabled="true"
						style="text-align:right">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

			</p:dataTable>



		</p:panel>



	</ui:define>

</ui:composition>
