<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasPrjActChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.prg.act.info']}"
			id="childPrjActPage" toggleable="true">
			<p:dataTable id="gfMasPrgActId" var="pmInterfacePrgAct" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfacePrgAct}"
				selection="#{gfMasBackingBean.managedBean.selectedProgActList}"
				value="#{gfMasBackingBean.managedBean.listOfPrgAct}">

				<p:ajax event="rowSelect" 
					update=":form:prcessIdButton,:form:childPrjActPage"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselect" 
					update=":form:prcessIdButton,:form:childPrjActPage"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowSelectCheckbox" 
					update=":form:prcessIdButton,:form:childPrjActPage"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":form:prcessIdButton,:form:childPrjActPage"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="toggleSelect"
					update=":form:prcessIdButton,:form:childPrjActPage"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				
				<ac:paginator for="gfMasPrgActId"></ac:paginator>

				<p:column selectionMode="multiple" style="width:5%"
					disabledSelection="#{pmInterfacePrgAct.processStatus eq '1'}" />
				
				<p:ajax event="rowSelectCheckbox"></p:ajax>
				
				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfacePrgAct.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}">
					<h:outputText value="#{pmInterfacePrgAct.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.prg.act.code']}">
					<h:outputText value="#{pmInterfacePrgAct.prgActCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.prg.act.desc']}">
					<h:outputText value="#{pmInterfacePrgAct.prgActDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.code.status']}">
					<h:outputText value="#{pmInterfacePrgAct.codeStatus}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.process.status']}">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfacePrgAct.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfacePrgAct.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfacePrgAct.processStatus==2}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:10%">
					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{pmInterfacePrgAct.recordStatusFlg==1}" />
					<h:outputText value="#{lbl['lbl.pm.inactive']}"
						rendered="#{pmInterfacePrgAct.recordStatusFlg!=1}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
