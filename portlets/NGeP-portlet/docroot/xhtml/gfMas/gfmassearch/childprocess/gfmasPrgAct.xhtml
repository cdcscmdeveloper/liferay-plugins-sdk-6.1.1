<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasProgActChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glprgdef']}" id="childPrjActPage"
			toggleable="true">
			<p:dataTable id="gfMasPrgActId" var="pmInterfacePrgAct" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfacePrgAct}" lazy="true"				
				value="#{gfMasBackingBean.managedBean.searchProgAct}">
				<ac:paginator for="gfMasPrgActId"></ac:paginator>
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"							
							value="#{gfMasBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@this" update="@form"
								listener="#{gfMasBackingBean.selectAllPrgAct}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{pmInterfacePrgAct.selected}"
						disabled="#{pmInterfacePrgAct.processStatus eq '1' or pmInterfacePrgAct.processStatus eq '2'}">
						<p:ajax partialSubmit="true" process="@this" update="@form"
							listener="#{gfMasBackingBean.selectPrgActSingleRow(pmInterfacePrgAct)}" />
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePrgAct.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePrgAct.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.prg.act.code']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePrgAct.prgActCode}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.prg.act.desc']}"
					style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePrgAct.prgActDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.effDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePrgAct.effDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.expDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePrgAct.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfacePrgAct.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfacePrgAct.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfacePrgAct.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfacePrgAct.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfacePrgAct.processStatus==2}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
