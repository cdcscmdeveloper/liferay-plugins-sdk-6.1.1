<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		
		<p:messages id="gfMasDanaChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		
		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.process.info']}" id="childPage"
			toggleable="true">			
			<p:dataTable id="gfMasDanaId" var="pmInterfacceDana" rows="10"
				value="#{gfMasBackingBean.managedBean.listOfDana}">

				<ac:paginator for="gfMasDanaId"></ac:paginator>
				
				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfacceDana.dIInterfaceLog.logId}" />
				</p:column>			

                <p:column headerText="#{lbl['lbl.gfmas.financial.year']}">
					<h:outputText value="#{pmInterfacceDana.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.dana.code']}">
					<h:outputText value="#{pmInterfacceDana.danaCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.dana.desc']}">
					<h:outputText value="#{pmInterfacceDana.danaDesc}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}">
					<h:outputText value="#{pmInterfacceDana.codeStatus}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}">
					<h:outputText value="#{pmInterfacceDana.processStatus}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:10%">
					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{pmInterfacceDana.recordStatusFlg==1}" />
					<h:outputText value="#{lbl['lbl.pm.inactive']}"
						rendered="#{pmInterfacceDana.recordStatusFlg!=1}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
