<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasDanaChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.gldanadef']}" id="childPage"
			toggleable="true">
			<p:dataTable id="gfMasDanaId" var="pmInterfacceDana" rows="10"
				rowIndexVar="index" lazy="true"
				selection="#{gfMasBackingBean.managedBean.selectedDanaList}"
				rowKey="#{pmInterfacceDana}"
				value="#{gfMasBackingBean.managedBean.searchDana}">
				<p:ajax event="rowSelectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasDanaId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasDanaId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
			
				<ac:paginator for="gfMasDanaId"></ac:paginator>

				<p:column selectionMode="multiple" style="width:5%"
					disabledSelection="#{pmInterfacceDana.processStatus eq '1' or pmInterfacceDana.processStatus eq '2'}" />

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}" style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacceDana.dIInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}" style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacceDana.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.dana.code']}" style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacceDana.danaCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.dana.desc']}" style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacceDana.danaDesc}" />
				</p:column>				
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}" style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfacceDana.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfacceDana.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}" style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfacceDana.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfacceDana.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfacceDana.processStatus==2}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
