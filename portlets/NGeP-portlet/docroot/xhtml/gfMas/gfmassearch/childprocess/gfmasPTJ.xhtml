<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasPTJChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glptjdef']}" id="childPTJPage"
			toggleable="true">
			<p:dataTable id="gfMasPTJId" var="pmInterfacePTJ" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfacePTJ}" lazy="true"
				selection="#{gfMasBackingBean.managedBean.selectedPtjList}"
				value="#{gfMasBackingBean.managedBean.searchPtj}">              
				<p:ajax event="rowSelectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasPTJId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasPTJId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />			
				<ac:paginator for="gfMasPTJId"></ac:paginator>

				<p:column selectionMode="multiple" style="width:5%"
					disabledSelection="#{pmInterfacePTJ.processStatus eq '1' or pmInterfacePTJ.processStatus eq '2'}" />

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfacePTJ.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}" style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePTJ.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.ptj.code']}" style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePTJ.ptjCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.ptj.desc']}" style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePTJ.ptjDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}" style="width:20%;white-space: normal;word-wrap: break-word;">					
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfacePTJ.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfacePTJ.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}" style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfacePTJ.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfacePTJ.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfacePTJ.processStatus==2}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
