<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasProjChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glprjdef']}" id="childProjectPage"
			toggleable="true">
			<p:dataTable id="gfMasProjectId" var="pmInterfaceProject" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfaceProject}" lazy="true"				
				value="#{gfMasBackingBean.managedBean.searchProject}">
				<ac:paginator for="gfMasProjectId"></ac:paginator>
			
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"							
							value="#{gfMasBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@this" update="@form"
								listener="#{gfMasBackingBean.selectAllProject}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{pmInterfaceProject.selected}"
						disabled="#{pmInterfaceProject.processStatus eq '1' or pmInterfaceProject.processStatus eq '2'}">
						<p:ajax partialSubmit="true" process="@this" update="@form"
							listener="#{gfMasBackingBean.selectProjectSingleRow(pmInterfaceProject)}" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceProject.dIInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceProject.financialYear}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.project.code']}"
					style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceProject.projectCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.project.desc']}"
					style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceProject.projectDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.effDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceProject.effDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.expDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceProject.exfDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceProject.codeStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceProject.codeStatus==1}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
