<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		
		<p:messages id="gfMasProjChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		
		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.process.info']}" id="childProjectPage"
			toggleable="true">			
			<p:dataTable id="gfMasProjectId" var="pmInterfaceProject" rows="10"
				value="#{gfMasBackingBean.managedBean.listOfProjectt}">

				<ac:paginator for="gfMasProjectId"></ac:paginator>
				
				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfaceProject.dIInterfaceLog.logId}" />
				</p:column>			

                <p:column headerText="#{lbl['lbl.gfmas.financial.year']}">
					<h:outputText value="#{pmInterfaceProject.financialYear}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.project.code']}">
					<h:outputText value="#{pmInterfaceProject.projectCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.project.desc']}">
					<h:outputText value="#{pmInterfaceProject.projectDesc}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.pp.code']}">
					<h:outputText value="#{pmInterfaceProject.ppCode}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.ag.code']}">
					<h:outputText value="#{pmInterfaceProject.agCode}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}">
					<h:outputText value="#{pmInterfaceProject.codeStatus}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}">
					<h:outputText value="#{pmInterfaceProject.processStatus}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:10%">
					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{pmInterfaceProject.recordStatusFlg==1}" />
					<h:outputText value="#{lbl['lbl.pm.inactive']}"
						rendered="#{pmInterfaceProject.recordStatusFlg!=1}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
