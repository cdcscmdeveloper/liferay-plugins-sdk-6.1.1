<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasBankChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.bank.info']}" id="childBankPage"
			toggleable="true">
			<p:dataTable id="gfMasBankId" var="pmInterfaceBank" rows="10"
				rowIndexVar="index"
				selection="#{gfMasBackingBean.managedBean.selectedBankList}" 
				rowKey="#{pmInterfaceBank}"
				value="#{gfMasBackingBean.managedBean.listOfBank}">

				<ac:paginator for="gfMasBankId"></ac:paginator>

				<p:column selectionMode="multiple" style="width:5%"  disabledSelection ="#{pmInterfaceBank.processStatus eq '1'}" />

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfaceBank.dIInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.bank.code']}">
					<h:outputText value="#{pmInterfaceBank.bankCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.bank.desc']}">
					<h:outputText value="#{pmInterfaceBank.bankName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.bank.action']}">
					<h:outputText value="#{pmInterfaceBank.action}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.process.status']}">

					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceBank.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceBank.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceBank.processStatus==2}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:10%">
					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{pmInterfaceBank.recordStatusFlg==1}" />
					<h:outputText value="#{lbl['lbl.pm.inactive']}"
						rendered="#{pmInterfaceBank.recordStatusFlg!=1}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
