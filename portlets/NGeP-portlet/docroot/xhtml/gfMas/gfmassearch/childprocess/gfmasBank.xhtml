<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasBankChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glbnkdef']}" id="childBankPage"
			toggleable="true">
			<p:dataTable id="gfMasBankId" var="pmInterfaceBank" rows="10"
				rowIndexVar="index" lazy="true" rowKey="#{pmInterfaceBank}"
				value="#{gfMasBackingBean.managedBean.searchBank}">
				
				<ac:paginator for="gfMasBankId"></ac:paginator>
				

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceBank.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.bank.code']}"
					style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceBank.bankCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.bank.desc']}"
					style="width:35%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceBank.bankName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.bank.action']}"
					style="width:20%;white-space: normal;word-wrap: break-word;">
					<p:column headerText="#{lbl['lbl.gfmas.code.status']}">
						<h:outputText value="#{lbl['lbl.gfmas.codestatus.creation']}"
							rendered="#{pmInterfaceBank.action=='C'}" />
						<h:outputText value="#{lbl['lbl.gfmas.codestatus.modification']}"
							rendered="#{pmInterfaceBank.action=='M'}" />
						<h:outputText value="#{lbl['lbl.gfmas.codestatus.deletion']}"
							rendered="#{pmInterfaceBank.action=='D'}" />
					</p:column>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
					style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceBank.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceBank.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceBank.processStatus==2}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.dependency']}"
						rendered="#{pmInterfaceBank.processStatus==3}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.error']}"
						rendered="#{pmInterfaceBank.processStatus==4}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
