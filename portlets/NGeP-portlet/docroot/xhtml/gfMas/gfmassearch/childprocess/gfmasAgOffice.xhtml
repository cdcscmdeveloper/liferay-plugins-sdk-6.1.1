<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasAgChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glbacdef']}"
			id="childAgOfficePage" toggleable="true">
			<p:dataTable id="gfMasAgOfficeId" var="pmInterfaceAgOffice"
				rowIndexVar="index" rows="10" lazy="true"
				selection="#{gfMasBackingBean.managedBean.selectedAgOfficeList}"
				rowKey="#{pmInterfaceAgOffice}"
				value="#{gfMasBackingBean.managedBean.searchAgOff}">               
               
				<p:ajax event="rowSelectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasAgOfficeId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasAgOfficeId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
			
				<ac:paginator for="gfMasAgOfficeId"></ac:paginator>

				<p:column selectionMode="multiple" style="width:5%"
					disabledSelection="#{pmInterfaceAgOffice.processStatus eq '1' or pmInterfaceAgOffice.processStatus eq '2'}" />					

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}" style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceAgOffice.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}" style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceAgOffice.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.ag.office.code']}" style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceAgOffice.offCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.ag.office.desc']}" style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceAgOffice.offDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}" style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfaceAgOffice.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfaceAgOffice.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}" style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceAgOffice.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceAgOffice.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceAgOffice.processStatus==2}" />
				</p:column>
				
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
