<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasVotChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glvotdef']}" id="childVotPage"
			toggleable="true">
			<p:dataTable id="gfMasVotId" var="pmInterfaceVot" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfaceVot}" lazy="true"				
				value="#{gfMasBackingBean.managedBean.searchVot}">
				<ac:paginator for="gfMasVotId"></ac:paginator>
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"						
							value="#{gfMasBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@this" update="@form"
								listener="#{gfMasBackingBean.selectAllVot}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{pmInterfaceVot.selected}"
						disabled="#{pmInterfaceVot.processStatus eq '1' or pmInterfaceVot.processStatus eq '2'}">
						<p:ajax partialSubmit="true" process="@this" update="@form"
							listener="#{gfMasBackingBean.selectVotSingleRow(pmInterfaceVot)}" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceVot.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceVot.financialYear}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.vot.code']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceVot.votCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.vot.desc']}"
					style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceVot.votDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.effDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceVot.effDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.expDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceVot.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfaceVot.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfaceVot.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceVot.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceVot.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceVot.processStatus==2}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
