<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasPPChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.pp.info']}" id="childPPPage"
			toggleable="true">
			<p:dataTable id="gfMasPPId" var="pmInterfacePP" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfacePP}"
				selection="#{gfMasBackingBean.managedBean.selectedPpList}"
				value="#{gfMasBackingBean.managedBean.listOfPP}">
                
                <p:ajax event="rowSelect" 
					update=":form:prcessIdButton,:form:gfMasPPId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselect" 
					update=":form:prcessIdButton,:form:gfMasPPId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowSelectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasPPId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="rowUnselectCheckbox" 
					update=":form:prcessIdButton,:form:gfMasPPId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<p:ajax event="toggleSelect"
					update=":form:prcessIdButton,:form:gfMasPPId"					
					listener="#{gfMasBackingBean.rowSelectEvent}" />
				<ac:paginator for="gfMasPPId"></ac:paginator>

				<p:column selectionMode="multiple" style="width:5%" disabledSelection="#{pmInterfacePP.processStatus eq '1'}" />

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfacePP.dIInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}">
					<h:outputText value="#{pmInterfacePP.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.pp.code']}">
					<h:outputText value="#{pmInterfacePP.ppCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.pp.desc']}">
					<h:outputText value="#{pmInterfacePP.ppDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.code.status']}">
					<h:outputText value="#{pmInterfacePP.codeStatus}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.process.status']}">

					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfacePP.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfacePP.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfacePP.processStatus==2}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:10%">
					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{pmInterfacePP.recordStatusFlg==1}" />
					<h:outputText value="#{lbl['lbl.pm.inactive']}"
						rendered="#{pmInterfacePP.recordStatusFlg!=1}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
