<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasPPChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glsegdef']}" id="childPPPage"
			toggleable="true">
			<p:dataTable id="gfMasPPId" var="pmInterfacePP" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfacePP}" lazy="true"			
				value="#{gfMasBackingBean.managedBean.searchPp}">
					<ac:paginator for="gfMasPPId"></ac:paginator>
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"							
							value="#{gfMasBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@this" update="@form"
								listener="#{gfMasBackingBean.selectAllPp}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{pmInterfacePP.selected}"
						disabled="#{pmInterfacePP.processStatus eq '1' or pmInterfacePP.processStatus eq '2'}">
						<p:ajax partialSubmit="true" process="@this" update="@form"
							listener="#{gfMasBackingBean.selectPpSingleRow(pmInterfacePP)}" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePP.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePP.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.pp.code']}"
					style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePP.ppCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.pp.desc']}"
					style="width:30%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfacePP.ppDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}"
					style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfacePP.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfacePP.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
					style="width:15%;white-space: normal;word-wrap: break-word;">

					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfacePP.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfacePP.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfacePP.processStatus==2}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
