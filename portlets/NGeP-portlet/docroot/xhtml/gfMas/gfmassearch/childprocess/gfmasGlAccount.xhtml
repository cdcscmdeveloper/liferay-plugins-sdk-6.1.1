<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasGlAcntChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glglcdef']}" id="childGlAcntPage"
			toggleable="true">
			<p:dataTable id="gfMasGlAcntId" var="pmInterfaceGlAcnt" rows="10"
				rowIndexVar="index" lazy="true" rowKey="#{pmInterfaceGlAcnt}"
				value="#{gfMasBackingBean.managedBean.searchGlAccount}">
				<ac:paginator for="gfMasGlAcntId"></ac:paginator>

				
				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceGlAcnt.dIInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceGlAcnt.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.gl.acnt.code']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceGlAcnt.glAccountCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.gl.acnt.desc']}"
					style="width:25%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceGlAcnt.glAccountDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.gl.kptj.code']}"
					style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceGlAcnt.kptjCode}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}"
					style="width:20%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfaceGlAcnt.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfaceGlAcnt.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceGlAcnt.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceGlAcnt.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceGlAcnt.processStatus==2}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.dependency']}"
						rendered="#{pmInterfaceGlAcnt.processStatus==3}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.error']}"
						rendered="#{pmInterfaceGlAcnt.processStatus==4}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
