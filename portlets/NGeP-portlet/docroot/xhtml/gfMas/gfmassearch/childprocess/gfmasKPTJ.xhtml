<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="gfMasKptjChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>

		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.glpcgdef']}" id="childKPTJPage"
			toggleable="true">
			<p:dataTable id="gfMasKPTJId" var="pmInterfaceKPTJ" rows="10"
				rowIndexVar="index" rowKey="#{pmInterfaceKPTJ}" lazy="true"			
				value="#{gfMasBackingBean.managedBean.searchKptj}">

				<ac:paginator for="gfMasKPTJId"></ac:paginator>
			

				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
					style="width:5%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceKPTJ.diInterfaceLog.logId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.financial.year']}"
					style="width:15%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceKPTJ.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.kptj.code']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceKPTJ.kptjCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.kptj.desc']}"
					style="width:25%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceKPTJ.kptjDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.effDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceKPTJ.effDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.expDate']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{pmInterfaceKPTJ.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.valid']}"
						rendered="#{pmInterfaceKPTJ.codeStatus=='V'}" />
					<h:outputText value="#{lbl['lbl.gfmas.codestatus.inValid']}"
						rendered="#{pmInterfaceKPTJ.codeStatus=='X'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
					style="width:10%;white-space: normal;word-wrap: break-word;">

					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceKPTJ.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceKPTJ.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceKPTJ.processStatus==2}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.dependency']}"
						rendered="#{pmInterfaceKPTJ.processStatus==3}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.error']}"
						rendered="#{pmInterfaceKPTJ.processStatus==4}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
