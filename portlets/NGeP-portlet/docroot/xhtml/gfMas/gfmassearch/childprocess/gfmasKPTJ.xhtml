<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		
		<p:messages id="gfMasKptjChild" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		
		<ui:include src="/xhtml/gfMas/gfmassearch/gfmasNavButton.xhtml" />

		<p:panel header="#{lbl['lbl.gfmas.process.info']}" id="childKPTJPage"
			toggleable="true">			
			<p:dataTable id="gfMasKPTJId" var="pmInterfaceKPTJ" rows="10"
			    rowIndexVar="index" rowKey="pmInterfaceKPTJ"
			    selection="#{gfMasBackingBean.managedBean.selectedKptjList}"
				value="#{gfMasBackingBean.managedBean.listOfKPTJ}">

				<ac:paginator for="gfMasKPTJId"></ac:paginator>
				
				<p:column selectionMode="multiple" style="width:5%" />				
				
				<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}">
					<h:outputText value="#{pmInterfaceKPTJ.diInterfaceLog.logId}" />
				</p:column>			

                <p:column headerText="#{lbl['lbl.gfmas.financial.year']}">
					<h:outputText value="#{pmInterfaceKPTJ.financialYear}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.gfmas.kptj.code']}">
					<h:outputText value="#{pmInterfaceKPTJ.kptjCode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.gfmas.kptj.desc']}">
					<h:outputText value="#{pmInterfaceKPTJ.kptjDesc}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.code.status']}">
					<h:outputText value="#{pmInterfaceKPTJ.codeStatus}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.gfmas.process.status']}">
				
					<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
						rendered="#{pmInterfaceKPTJ.processStatus==0}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.success']}"
						rendered="#{pmInterfaceKPTJ.processStatus==1}" />
					<h:outputText value="#{lbl['lbl.gfmas.process.fail']}"
						rendered="#{pmInterfaceKPTJ.processStatus==2}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:10%">
					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{pmInterfaceKPTJ.recordStatusFlg==1}" />
					<h:outputText value="#{lbl['lbl.pm.inactive']}"
						rendered="#{pmInterfaceKPTJ.recordStatusFlg!=1}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
