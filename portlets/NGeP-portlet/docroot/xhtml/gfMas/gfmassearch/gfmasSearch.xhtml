<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<p:panel header="#{lbl['lbl.gfmas.master.data.list']}"
		toggleable="true" id="masterDataListPanelId">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.gfmas.instruction.one']}" />&#160;
			<p:commandLink id="refreshId" partialSubmit="true" process="@this"
			action="#{gfMasBackingBean.searchGfMas}" update="@form"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
			<p:graphicImage value="/css/images/design/ico-refresh.png"
				title="#{lbl['lbl.gfmas.refresh.job']}" />
		</p:commandLink>&#160;
			<h:outputText styleClass="instruction"
			value="#{lbl['lbl.gfmas.instruction.two']}" />
     
		<table>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.gfmas.filter.by.master.data']}" /></td>
				<td><p:selectOneMenu style="width: 250px;margin-bottom: 5px;"
						id="processId" label="#{lbl['lbl.gfmas.process.id']}"
						value="#{gfMasBackingBean.managedBean.processId}">
						<f:selectItem itemLabel="#{lbl['lbl.gfmas.select.data.all']}"
							itemValue="" />
						<f:selectItems value="#{gfMasBackingBean.getProcessCodelist()}" />
						<p:ajax event="change" process="@form"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							listener="#{gfMasBackingBean.changeProcessCode}" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	
		<table style="width: 100%; height: 100%;">
			<tr>
				<td width="100%"><h:outputText styleClass="instruction"
						style="float:left;margin-left:1px;"
						value="#{lbl['lbl.gfmas.instruction.info']}" /></td>
			</tr>
		</table>
		<p:dataTable id="gfMas"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{gfMasBackingBean.searchGfMas}" rows="10" var="gfMasList"
			rowIndexVar="index" lazy="true">
			<ac:paginator for="gfMas" />           
			<p:column headerText="#{lbl['lbl.pm.state.seq.no']}"
				style="width:5%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.gfmas.interface.log.id']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{gfMasList.logId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.gfmas.service.code']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{gfMasList.serviceCode}" />
			</p:column>
            
			<p:column headerText="#{lbl['lbl.gfmas.process.id']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">			
				
				<h:outputText value="#{lbl['lbl.gfmas.glbacdef']}"
					rendered="#{gfMasList.processId == 'GLBAC'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glsegdef']}"
					rendered="#{gfMasList.processId == 'GLSEG'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glvotdef']}"
					rendered="#{gfMasList.processId == 'GLVOT'}" />
				<h:outputText value="#{lbl['lbl.gfmas.gldanadef']}"
					rendered="#{gfMasList.processId == 'GLDNA'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glprgdef']}"
					rendered="#{gfMasList.processId == 'GLPRG'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glprjdef']}"
					rendered="#{gfMasList.processId == 'GLPRJ'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glglcdef']}"
					rendered="#{gfMasList.processId == 'GLGLC'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glpcgdef']}"
					rendered="#{gfMasList.processId == 'GLPCG'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glptjdef']}"
					rendered="#{gfMasList.processId == 'GLPTJ'}" />
				<h:outputText value="#{lbl['lbl.gfmas.glbnkdef']}"
					rendered="#{gfMasList.processId == 'CMBNK'}" />					
			</p:column>
			<p:column headerText="#{lbl['lbl.gfmas.direction']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{lbl['lbl.gfmas.direction.inbound']}"
					rendered="#{gfMasList.direction=='I'}" />
				<h:outputText value="#{lbl['lbl.gfmas.direction.outbound']}"
					rendered="#{gfMasList.direction=='O'}" />
			</p:column>			
			
			<p:column headerText="#{lbl['lbl.gfmas.fileName']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{gfMasList.fileName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.gfmas.createdDate']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{gfMasList.createdDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.gfmas.process.status']}"
				style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{lbl['lbl.gfmas.process.ready']}"
					rendered="#{gfMasList.processStatus==0}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.action']}"
				style="width:10%;text-align:center;">
				<p:commandLink
					action="#{gfMasBackingBean.goToGfMasProcessMaintaincePage(gfMasList)}">
					<p:graphicImage value="/css/images/design/icon-view.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
