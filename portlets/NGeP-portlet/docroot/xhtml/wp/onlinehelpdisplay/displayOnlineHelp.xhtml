<ui:composition
	template="/WEB-INF/facelets/templates/onlinehelpdisplay_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<h:form id="searchform">  
			<h:panelGrid columns="3" cellpadding="5" cellspacing="2" columnClasses="leftalign,rightalign,inputSearch" >  
       			<h:outputText value=" " />
       			<p:inputText size="50" id="searchhelp"  name="searchhelp" value="#{SearchHelp.helpSearch}" required="true" requiredMessage="Input is required" >
        			<f:validateLength minimum="3" />  
            	</p:inputText>  
           
        		<p:commandButton value="#{lbl['lbl.portal.online.help.search']}" type="submit" action="#{SearchHelp.searchcontent}" icon="ui-icon-search" title="Icon Only" ajax="false"/> 
  			</h:panelGrid>
   		</h:form>
		<br/>
		<h:form id="viewform">  
    		<p:messages id="msgs"/> 
    		<p:dataList value="#{HelpDisplay.helpcontents}" var="content" type="definition" id="helpList">  
	   			<f:facet name="header">
	   				<div class="center">
						<h:link value="#{lbl['lbl.portal.online.help.table.of.content']}" outcome="/xhtml/wp/onlinehelpdisplay/displayOnlineHelp.xhtml" />
					</div>
					<div class="next">
	   					<h:link value="#{lbl['lbl.portal.online.help.start']}" outcome="/xhtml/wp/onlinehelpdisplay/displayContent.xhtml" />
	   				</div>
	   			</f:facet>
	   			<f:facet name="description">
	   				<br/>
	   				<h:link value="#{content.helpTitle}" outcome="/xhtml/wp/onlinehelpdisplay/displayContent.xhtml" style="#{'subhelp' eq content.helpCategory? 'font-weight:normal;margin-left:10px;' : 'font-weight:bold'}" includeViewParams="true" >
				    	<f:param name="helpcount" value="#{content.helpCount}"/>
				    </h:link>
				    <h:link value="." outcome="/xhtml/wp/onlinehelpdisplay/displayContent?faces-redirect=true" 
				    	action="#{AllHelpDisplay.processPage(content.helpCount)}"/>
	   			</f:facet>	   					
			</p:dataList>  
		</h:form> 		
	</ui:define>
</ui:composition>
