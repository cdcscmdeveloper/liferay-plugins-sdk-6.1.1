<ui:composition
	template="/WEB-INF/facelets/templates/onlinehelpdisplay_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<h:form id="searchform">  
   			<p:messages id="msgs"/>  
         	<h:panelGrid columns="3" cellpadding="5" cellspacing="2" columnClasses="leftalign,rightalign,inputSearch" >  
       			<h:outputText value=" " />
       			<p:inputText size="50" id="searchhelp"  name="searchhelp" value="#{SearchHelp.helpSearch}" required="true" requiredMessage="Input is required" >
        			<f:validateLength minimum="3" />  
            	</p:inputText>  
           
        		<p:commandButton value="#{lbl['lbl.portal.online.help.search']}" type="submit" action="#{SearchHelp.searchcontent}" icon="ui-icon-search" title="Icon Only" ajax="false"/> 
  			</h:panelGrid>
		</h:form>	
		<br/>
     	<h:form id="viewform">  
    		<p:dataTable id="dataTable" var="content" value="#{SearchHelp.resulthelpcontents}"  
                 paginator="true" rows="5"  
                 paginatorTemplate=" {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"  
                 rowsPerPageTemplate="1,5,10,15">  
        		
        		<f:facet name="header">
	   				<div class="previous">
						<h:link value="#{lbl['lbl.portal.online.help.back.to.table.of.content']}" outcome="/xhtml/wp/onlinehelpdisplay/displayOnlineHelp.xhtml" />
					</div>
					<div class="next">
					  	#{lbl['lbl.portal.online.help.search.result']} "<h:outputText value="#{SearchHelp.helpSearch}"/>"
					</div>
				</f:facet>
	   			
	   			<p:column>  
            		<f:facet name="header">  
                		<h:outputText value="#{lbl['lbl.portal.online.help.tableheader.title']}" />  
            		</f:facet>  
            		<h:outputText value="#{content.helpTitle}" style="font-weight: bold;"/>  
        		</p:column>  
  				<p:column>  
            		<f:facet name="header">  
                		<h:outputText value="#{lbl['lbl.portal.online.help.tableheader.content']}" />  
            		</f:facet>  
            		<h:outputText value="#{content.helpContent}" escape="false"/>  
        		</p:column>  
  			</p:dataTable>  
		</h:form> 
	</ui:define>
</ui:composition>
