<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	<h:form id="forgotLoginPasswordForm">
		<p:messages id="errMsgs" showSummary="false" showDetail="true" closable="true" severity="error, info, warn" />			
		<h:outputText styleClass="instruction" value="#{lbl['lbl.lg.instruction.identify.yourself']}" escape="false" /><br/><br/>
		<h:panelGrid columns="2">
			<p:outputLabel value="#{lbl['lbl.lg.login.id']}"  styleClass="required" />
			<p:inputText  id="userId"  name="userId" value="#{ForgotLogin.loginId}" required="true" 
				requiredMessage="#{lbl['lbl.lg.required.login.id.field']}" />
		</h:panelGrid>
		<p:commandButton value="#{lbl['lbl.btn.cancel']}" type="submit" action="#{ForgotLogin.cancelBtnAction}" ajax="false" immediate="true" />
		<p:commandButton value="#{lbl['lbl.btn.submit']}" type="submit" action="#{ForgotLogin.forgotLoginPassword}" ajax="false" />
	 </h:form>
 	</ui:define>
</ui:composition>
