<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	<h:form id="forgotLoginIdForm">
		<p:messages id="errMsgs" showSummary="false" showDetail="true" closable="true" severity="error, info, warn" />			
		<h:outputText styleClass="instruction" value="#{lbl['lbl.lg.instruction.forgot.login']}" escape="false" /><br/><br/>
		<h:panelGrid columns="2">
			<p:outputLabel value="#{lbl['lbl.lg.registered.email']}"  styleClass="required" />
			<p:inputText  id="emailAddress"  name="emailAddress" value="#{ForgotLogin.emailAddress}" required="true" 
				requiredMessage="#{lbl['lbl.lg.required.email.field']}"
				validatorMessage="#{lbl['lbl.lg.email.validation.msg']}">
				<f:validateRegex pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
			</p:inputText>
		</h:panelGrid>
		<p:commandButton id="btnCancel" value="#{lbl['lbl.btn.cancel']}" type="submit" action="#{ForgotLogin.cancelBtnAction}" ajax="false" immediate="true" />
		<p:commandButton id="btnSubmit" value="#{lbl['lbl.btn.submit']}" type="submit" action="#{ForgotLogin.forgotLoginId}" ajax="false" />
	 </h:form>
 	</ui:define>
</ui:composition>
