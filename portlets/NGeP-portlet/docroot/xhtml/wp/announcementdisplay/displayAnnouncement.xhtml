<ui:composition
	template="/WEB-INF/facelets/templates/informationdisplay_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<h:form id="displayAnnouncementForm">  
    		<p:dataList value="#{AnnouncementContent.announcementcontents}" var="content" id="announcementList"  
        		paginator="true" rows="5"  
        		paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"    
        		rowsPerPageTemplate="5,10,15" type="none">  
  
            	<f:facet name="header">  
                	#{lbl['lbl.portal.information.tab.title.announcement']}  
            	</f:facet>  
  
           		<h:outputText value="#{content.infoContent}"  escape="false" />
	    				
           		<p:separator id="customSeparator1" style="width:850px;height:2px" />
	   		</p:dataList>  
		</h:form>
	</ui:define>
</ui:composition>
