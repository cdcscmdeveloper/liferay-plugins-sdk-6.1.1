<ui:composition
	template="/WEB-INF/facelets/templates/alertdisplay_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<ul id="js-news" class="js-hidden" >
			<ui:repeat value="#{TickerDisplay.alertcontents}" var="content">
				<li class="news-item"><h:outputText value="#{content.alertContent}" escape="false"/></li>
			</ui:repeat>
		</ul>
	</ui:define>
</ui:composition>
