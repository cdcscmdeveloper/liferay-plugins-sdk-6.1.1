<ui:composition
	template="/WEB-INF/facelets/templates/informationdisplay_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<h:form id="infoForm">  
			<div id="infoTab">
    		<p:tabView id="tabView" dynamic="true" cache="true">  
  				<p:tab id="tba1" title="#{lbl['lbl.portal.information.tab.title.announcement']}">  
           			<p:dataList value="#{DisplayInformation.informationcontents}" var="content" type="definition" id="announcementList">  
	   					<f:facet name="description">
	   						<h:outputText value="#{content.infoContent}" escape="false" />
	   						<p:separator id="customSeparator1" style="width:335px;height:2px" />	   					
	    				</f:facet>
					</p:dataList>    
					<div style="text-align:right"><a href="./announcement"><h:outputText value="#{lbl['lbl.portal.information.more.title.announcement']}" escape="false"/></a></div>
  				</p:tab>  
  				<p:tab id="tab2" title="#{lbl['lbl.portal.information.tab.title.news']}">  
            		<p:dataList value="#{DisplayInformation.newscontents}" var="content" type="definition" id="newsList">  
	   					<f:facet name="description">
	   						<h:outputText value="#{content.infoContent}" escape="false" />
	    				</f:facet>
	    				<p:separator id="customSeparator2" style="width:280px;height:2px" />	    				
					</p:dataList>  
					<div style="text-align:right"><a href="./news"><h:outputText value="#{lbl['lbl.portal.information.more.title.news']}" escape="false"/></a></div>
  				</p:tab>  
  				<p:tab id="tab3" title="#{lbl['lbl.portal.information.tab.title.event']}">  
  					<p:dataList value="#{DisplayInformation.eventcontents}" var="content" type="definition" id="eventList">  
	   					<f:facet name="description">
	   						<h:outputText value="#{content.infoContent}" escape="false" />
	    				</f:facet>
	    				<p:separator id="customSeparator3" style="width:280px;height:2px" />	    				
					</p:dataList> 
            		<div style="text-align:right"><a href="./event"><h:outputText value="#{lbl['lbl.portal.information.more.title.event']}" escape="false"/></a></div>
  				</p:tab>  
  			</p:tabView>  
  			</div>
		</h:form> 				
	</ui:define>
</ui:composition>
