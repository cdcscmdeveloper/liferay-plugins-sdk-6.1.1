<ui:composition
	template="/WEB-INF/facelets/templates/informationdisplay_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<h:form prependId="false">  
      		<p:dataTable id="dataTable" var="content" value="#{EventContent.eventcontents}"  
            paginator="true" rows="5"  
            paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"  
            rowsPerPageTemplate="5,10,15">  
        
        		<f:facet name="header">  
            		#{lbl['lbl.portal.information.tab.title.event']}  
        		</f:facet>  
  
        		<p:column>  
            		<f:facet name="header">  
                		<h:outputText value="#{lbl['lbl.portal.information.tableheader.event.title']}" />  
            		</f:facet>  
            		<h:outputText value="#{content.infoTitle}" />  
        		</p:column>  
  				<p:column>  
            		<f:facet name="header">  
                		<h:outputText value="#{lbl['lbl.portal.information.tableheader.event.description']}" />  
            		</f:facet>  
            		<h:outputText value="#{content.infoContent}" escape="false"/>  
        		</p:column>  
  				<p:column>  
            		<f:facet name="header">  
                		<h:outputText value="#{lbl['lbl.portal.information.tableheader.event.startdate']}" />  
            		</f:facet>  
            		<h:outputText value="#{content.displayDate}" />  
        		</p:column>  
    		</p:dataTable>  
 		</h:form> 
	</ui:define>
</ui:composition>
