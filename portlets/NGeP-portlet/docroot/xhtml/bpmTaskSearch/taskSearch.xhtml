<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<f:view
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
>
<h:head />
<h:body>

<h:form id="form">
	<p:messages id="taskSearchMsg" showDetail="true" autoUpdate="true"
		closable="true" showSummary="false" severity="error, info" />
			
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
	</p:blockUI>
	<table>
		<tr>
			<td>Document Number</td>
			<td><p:inputText value="#{bpmTaskSearchBackingBean.docNumber}" /> </td>
			<td>
				<p:commandButton 
					value="Search"
					action="#{bpmTaskSearchBackingBean.searchAction}"
					update="resultPanel"
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />
			</td>
		</tr>		
	</table>
	
	<h:panelGroup id="resultPanel">
	
		<p:dataTable id="dt" value="#{bpmTaskSearchBackingBean.resultList}" var="vo">
			
			<p:column>
				<f:facet name="header">
					Task Id
				</f:facet>
				#{vo.taskId}
			</p:column>

			<p:column>
				<f:facet name="header">
					Task Name
				</f:facet>
				#{vo.taskName}
			</p:column>
			
			<p:column>
				<f:facet name="header">
					Assignees
				</f:facet>
				#{vo.assignees}
			</p:column>
			
			<p:column>
				<f:facet name="header">
					Status
				</f:facet>
				#{vo.state}
			</p:column>
			
			<p:column>
				<f:facet name="header">
					Instance
				</f:facet>
				#{vo.instanceId}
			</p:column>
			
			<p:column>
				<f:facet name="header">
					Version
				</f:facet>
				#{vo.instanceVersion}
			</p:column>
			
		</p:dataTable>
	
	</h:panelGroup>
	
	<table style="width: 100%" align="right">
		<tr>
			<td>Current Build: #{bpmTaskSearchBackingBean.currentBuildVersion}</td>
		</tr>
	</table>
	
</h:form>

</h:body>
</f:view>
