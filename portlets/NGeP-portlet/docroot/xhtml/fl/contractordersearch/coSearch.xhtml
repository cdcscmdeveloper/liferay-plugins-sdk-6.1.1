<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:tabView id="tabView">
			<p:tab id="tab1" title="Contract List">
				<p:panel header="CONTRACT ORDER" toggleable="true">
					<p:dataTable id="contractListTable" var="contract"
						value="#{contractRequestBackingBean.managedBean.contractList}"
						paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
						rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
						<p:column headerText="Contract No.">
							<h:outputText value="#{contract.contractValue.contractNo}" />
						</p:column>
						<p:column headerText="Plan No.">
							<h:outputText value="#{contract.plan.planNo}" />
						</p:column>
						<p:column headerText="Schedule No.">
							<h:outputText value="#{contract.schedule.scheduleNo}" />
						</p:column>
						<p:column headerText="Circular No.">
							<h:outputText value="#{contract.circular.latestCircularVer.circularNo}" />
						</p:column>
						<p:column headerText="Period(Start)">
							<h:outputText value="#{contract.schedule.startDate}">
								<f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
							</h:outputText>
						</p:column>
						<p:column headerText="Period(End)">
							<h:outputText value="#{contract.schedule.endDate}" >
								<f:convertDateTime type="date" pattern="dd-MM-yyyy"/>
							</h:outputText>
						</p:column>
						<p:column headerText="Fulfillment Type">
							<h:outputText value="#{contract.fulfillmentTypeCode.code}" />
						</p:column>
						<p:column headerText="Contract Type">
							<h:outputText value="#{contract.contractTypeCode.code}" />
						</p:column>
						<p:column headerText="Supplier Id">
							<h:outputText value="#{contract.smSupplier.supplierId}" />
						</p:column>
						<p:column headerText="Supplier Name">
							<h:outputText value="#{contract.smSupplier.supplierName}" />
						</p:column>
						<p:column headerText="Action">
							<p:commandLink id="crBasepageLink" value="request"
								action="#{contractRequestBackingBean.procureContract}">
								<f:setPropertyActionListener value="#{contract}" target="#{contractRequestBackingBean.managedBean.selectedContract}" />  
								</p:commandLink>
						</p:column>
					</p:dataTable>
				</p:panel>
			</p:tab>
			<p:tab id="tab2" title="Catalogue">
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
