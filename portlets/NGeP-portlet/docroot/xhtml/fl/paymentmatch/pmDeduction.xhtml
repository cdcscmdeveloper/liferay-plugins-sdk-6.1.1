<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel id="deductionPanel" header="#{lbl['lbl.fl.payment.match.deduction']}" toggleable="true">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction']}" escape="false"/>
		<p:dataTable id="deductionDataTable" var="deduction" value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flPaymentDeduction}"
			rowIndexVar="index"
			selection="#{paymentMatchBackingBean.managedBean.selectedDeductions}" rowKey="#{deduction}">
			<ac:paginator for="deductionDataTable" />
			<p:column selectionMode="multiple" style="width:2%;text-align:center" disabledSelection="#{index == 0}"/>
			<p:column headerText="#{lbl['lbl.fl.payment.match.deduction.type']}">
				<h:outputText rendered="#{index == 0}" value="#{paymentMatchBackingBean.getParameterDesc(deduction.deductionType)}" />
				<p:selectOneMenu rendered="#{index > 0}" value="#{deduction.deductionType.parameterCode}" >
					<p:ajax event="change" process="@this" update=":form:deductionDataTable" />
					<f:selectItem itemLabel="-- Select -- " itemValue="" />
					<f:selectItems var="ctDeduction"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.latestContractVer.ctDeductions}"
						itemLabel="#{paymentMatchBackingBean.getParameterDesc(ctDeduction.deductionType)}"
						itemValue="#{ctDeduction.deductionType.parameterCode}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.payment.match.deduction.desc']}">
				<p:inputText rendered="#{index > 0}" value="#{deduction.deductionDesc}" />
			</p:column>
			<p:column>
			<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.payment.match.clauses']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.clauses']}"/>
				</f:facet>
			<p:commandLink rendered="#{index > 0}" 
					value="Clauses" action="#{paymentMatchBackingBean.retrieveClauses(deduction)}" oncomplete="clauses.show();"
					update=":form:clauseDialog"></p:commandLink>
				<h:outputText style="text-align:right" />
			</p:column>
			<p:column>
				<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.payment.match.amanah']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.vot.code']}"/>
				</f:facet>
				<h:outputText rendered="#{deduction.deductionType.parameterCode==ParameterConst.deductionTypeTransactionFee}" 
					value="#{deduction.pmVotFund.votFundCode}" />
					<p:selectOneMenu style="margin-bottom:15px;" value="#{deduction.pmVotFund.votFundId}" 
					rendered="#{deduction.deductionType.parameterCode!=ParameterConst.deductionTypeTransactionFee}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="votFund"
							value="#{paymentMatchBackingBean.managedBean.votFundList}"
							itemLabel="#{votFund.votFundCode}"
							itemValue="#{votFund.votFundId}" />
					</p:selectOneMenu>				
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gosodo']}">
			<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.gosodo']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gosodo']}"/>
				</f:facet>
				<h:outputText rendered="#{deduction.deductionType.parameterCode==ParameterConst.deductionTypeTransactionFee}" 
					value="#{deduction.pmGlAccount.glAccCode}" />
					<p:selectOneMenu style="margin-bottom:15px;" value="#{deduction.pmGlAccount.glAccountId}" 
					rendered="#{deduction.deductionType.parameterCode!=ParameterConst.deductionTypeTransactionFee}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="glAccount"
							value="#{paymentMatchBackingBean.managedBean.glAccountList}"
							itemLabel="#{glAccount.glAccCode}"
							itemValue="#{glAccount.glAccountId}" />
					</p:selectOneMenu>				
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount']}" style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{deduction.deductionAmt}" 
					rendered="#{deduction.deductionType.parameterCode==ParameterConst.deductionTypeFixed or deduction.deductionType.parameterCode==ParameterConst.deductionTypeTransactionFee}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<p:inputText styleClass="colFloatRight" value="#{deduction.deductionAmt}" 
					rendered="#{!(deduction.deductionType.parameterCode==ParameterConst.deductionTypeFixed or deduction.deductionType.parameterCode==ParameterConst.deductionTypeTransactionFee)}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>				
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton 
			rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.docType == ParameterConst.doctypeContractOrder}" 
			value="Add" icon="ui-icon-add" action="#{paymentMatchBackingBean.addDeductionRow()}" update="deductionDataTable"/>
			<p:commandButton rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.docType == ParameterConst.doctypeContractOrder}" 
			id="deleteDeductionBtn" value="Delete" icon="ui-icon-delete"/>
		</div>
	</p:panel>
	
	<p:dialog id="clauseDialog" header="#{lbl['lbl.fl.payment.match.clauses']}"
		widgetVar="clauses" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="clauseDt" var="clause" style="width:100%"
			value="#{paymentMatchBackingBean.managedBean.ctDeductionClauseList}">
			<ac:paginator for="clauseDt" />
			<p:column headerText="#{lbl['lbl.fl.payment.match.clauses.desc']}" style="white-space:normal;">
				#{clause.clauseDescription}
			</p:column>
		</p:dataTable>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.btn.close']}" icon="ui-icon-cancel"
				oncomplete="clauses.hide();" >
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
