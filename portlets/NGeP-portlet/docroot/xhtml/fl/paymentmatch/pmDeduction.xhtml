<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<!-- 29551 - start -->
	 <style>
      .column-align-center { text-align: center !important;}
     .ui-menu.ui-menu-dynamic.ui-widget.ui-widget-content.ui-corner-all.ui-helper-clearfix.ui-shadow{  
              width:250px;
              
     
}
    </style>
    <!-- 29551 - end -->
	<p:panel id="deductionPanel" header="#{lbl['lbl.fl.payment.match.deduction']}" toggleable="true">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction']}" escape="false" />
	<h:outputText value="&lt;br/&gt;" escape="false" />
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction.payment']}" escape="false" />
			<p:commandLink value="#{lbl['lbl.fl.instruction.here']}" ajax="false" 
				style="font-size:10px;font-style:italic" process="@this"
				action="#{paymentMatchBackingBean.downloadFile('/shared/FL/GARIS PANDUAN Potongan Bayaran_REVIEW- FINAL Apr2020.pdf')}"></p:commandLink>
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction.payment1']}" escape="false"  />
	
		<p:dataTable id="deductionDataTable" var="deduction" value="#{paymentMatchBackingBean.deductionTable}"
			rowIndexVar="index" rowStyleClass="selectable" style="width: 100%"
			selection="#{paymentMatchBackingBean.managedBean.selectedDeductions}" rowKey="#{deduction}">
			<ac:paginator for="deductionDataTable" />
			<p:ajax event="rowSelect" listener="#{paymentMatchBackingBean.onRowSelect}" partialSubmit="true" update="@parent" /><!-- 29551 -->
			<p:ajax event="rowUnselect" listener="#{paymentMatchBackingBean.onRowUnselect}" partialSubmit="true" update="@parent" /><!-- 29551 -->
			<p:ajax event="rowSelectCheckbox" listener="#{paymentMatchBackingBean.onRowSelect}" partialSubmit="true" update="@parent"></p:ajax><!-- 29551 -->
			<p:ajax event="rowUnselectCheckbox" listener="#{paymentMatchBackingBean.onRowUnselect}" partialSubmit="true" update="@parent"></p:ajax><!-- 29551 -->
			<p:column selectionMode="multiple" style="text-align:center"/>
			<p:column headerText="#{lbl['lbl.fl.payment.match.deduction.type']}">
				<p:selectOneMenu id="deductionList" value="#{deduction.ctDeduction.deductionId}" 
				disabled="#{paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="ctDeduction"
						value="#{paymentMatchBackingBean.getDropdownValuesByCtDetails()}"/>
						 <p:ajax event="change" process="@this" update="deductionList,descId,danaPnl,gosodoPnl,deductionAmtPnl"
						 listener="#{paymentMatchBackingBean.checkDeductionList(deduction)}"/>
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.payment.match.deduction.desc']}">
				<p:inputText id="descId" value="#{deduction.deductionDesc}" disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}">
				<p:ajax process="@this" />
				</p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.charge.ptj']}">
				<p:inputTextarea id="chargeOrgProfile" rows="1" cols="10" readonly="true" autoResize="false" style="resize:none;" 
						value="#{deduction.orgProfile.orgCode}" />										
				<p:commandLink
						oncomplete="dlgChargedPtj.show();"
						action="#{paymentMatchBackingBean.resetChargedPtjDetails}"
						update=":form:deductionDataTable"
						style="padding-left:10px">
						<f:setPropertyActionListener value="#{deduction}" target="#{paymentMatchBackingBean.managedBean.selectedDeduction}"/>						
						<p:graphicImage value="/css/images/design/search.png" />
				</p:commandLink> <ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.payment.match.amanah']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.deduction.amanah']}"/>
				</f:facet>
				<p:outputPanel id="danaPnl">
				<div style="width: 100%">
					<p:inputText id="dana" value="#{deduction.pmVotFund.votFundCode}"  disabled="true" size="10"/>
					<p:commandLink id="votfundLink" disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						onclick="deductionPopup.show();" >
						<f:setPropertyActionListener value="#{deduction}" target="#{paymentMatchBackingBean.managedBean.selectedDeduction}"/>
						<p:graphicImage value="/css/images/design/search.png"/>
					</p:commandLink>
				</div>
				</p:outputPanel>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.program.activiti']}">
			<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.program.activiti']}"/>
				</f:facet>
				<h:panelGroup styleClass="pmActiveLov" id="pmActiveLov" rendered="#{deduction.votPogram}">
				<ac:lov id="pmActive"
						lovId="PM_PRG_ACTIVITY" headerText="#{lbl['lbl.fl.program.activiti']}"
						saveObject="paymentMatchBackingBean.managedBean.paymentAdvice.flPaymentDeduction[#{index}].pmPrgActivity"
						readonly="true"
						size="7"
						conditionField="pmVotFund.votFundId^#{deduction.pmVotFund.votFundId}" 
						value="#{deduction.pmPrgActivity.prgActivityCode}"	>
				</ac:lov></h:panelGroup>
				<h:panelGroup styleClass="projectLov" id="projectLov"  rendered="#{deduction.votProjek}">
					<ac:lov id="pmProject" 
						lovId="PM_PROJECT" headerText="#{lbl['lbl.fl.project']}"
						saveObject="paymentMatchBackingBean.managedBean.paymentAdvice.flPaymentDeduction[#{index}].pmSubSetia"
						readonly="true"
						size="14"
						conditionField="pmVotFund.votFundId^#{deduction.pmVotFund.votFundId}" 
						value="#{deduction.projekSetiaDisplay }"	>
					</ac:lov>
				</h:panelGroup>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gosodo']}">
			<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.gosodo']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gosodo']}"/>
				</f:facet>
				<p:outputPanel id="gosodoPnl">
				<div style="width: 100%">
					<ac:lov id="gosodo" update=":form:deductionDataTable"
						disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						lovId="PM_GL_ACCOUNT" headerText="#{lbl['lbl.fl.gosodo']}"
						saveObject="paymentMatchBackingBean.managedBean.paymentAdvice.flPaymentDeduction[#{index}].pmGlAccount"
						conditionField="ptjGroupId^#{paymentMatchBackingBean.retrieveJabatanOrgProfile(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.chargeOrgProfile.orgProfileId).orgProfileId}*ptjGroupId^1^11|excludeCode^1^11"
						readonly="true" size="9"
						value="#{deduction.pmGlAccount.glAccCode}">
					</ac:lov>
				</div>
				</p:outputPanel>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount']}" style="text-align:center">
				<p:outputPanel id="deductionAmtPnl">
					<h:outputText styleClass="colFloatRight"
						value="#{deduction.deductionAmt}"
						rendered="#{deduction.ctDeduction.deductionType.parameterCode==ParameterConst.deductionTypeFixed}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<p:inputText styleClass="colFloatRight" disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						value="#{deduction.deductionAmt}"
						rendered="#{!(deduction.ctDeduction.deductionType.parameterCode==ParameterConst.deductionTypeFixed)}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax event="blur" listener="#{paymentMatchBackingBean.validateDeductionAmt}" update="@form"></p:ajax>
					</p:inputText>
				</p:outputPanel>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right" id="deductionButton">
			<p:commandButton id="addButton" rendered="#{paymentMatchBackingBean.managedBean.buttonVal != BpmOutcomeConstant.bpmView}"
			disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
			value="#{lbl['lbl.btn.add']}" action="#{paymentMatchBackingBean.addDeductionRow()}" update="deductionDataTable" />
			<p:commandButton rendered="#{paymentMatchBackingBean.managedBean.buttonVal != BpmOutcomeConstant.bpmView}"
				disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
			id="deleteDeductionBtn" value="#{lbl['lbl.btn.delete']}" action="#{paymentMatchBackingBean.removeAddRow()}" update="@form"/>
		</div>
		<!-- 29551 - start -->
		<p:dataTable id="deductionClauseTbl" var="deductionClause"  rowIndexVar="clauseIndex" width="100%"
			value="#{paymentMatchBackingBean.managedBean.ctDeductionClauseList}" 
			rendered="#{paymentMatchBackingBean.managedBean.showDeductionClause}">
			<p:column width="3%" styleClass="column-align-center">
				<f:facet name="header">
				<h:outputText value="#{lbl['lbl.ct.deduction.clause.desc']}" />
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.deduction.desc']}" />
				</f:facet>
				<h:outputText value="#{deductionClause.clauseDescription}" style="text-align:left; float:left;" />
			</p:column>										
		</p:dataTable>
		<!-- 29551 - end -->
	</p:panel>
	
	<p:dialog id="clauseDialog" header="#{lbl['lbl.fl.payment.match.clauses']}"
		widgetVar="clauses" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="clauseDt" var="clause" style="width:100%"
			value="#{paymentMatchBackingBean.managedBean.ctDeductionClauseList}">
			<ac:paginator for="clauseDt" />
			<p:column headerText="#{lbl['lbl.fl.payment.match.clauses.desc']}" style="white-space:normal;">
				#{clause.clauseDescription}
			</p:column>
		</p:dataTable>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.btn.close']}" 
				oncomplete="clauses.hide();" >
			</p:commandButton>
		</div>
	</p:dialog>
	
	<p:dialog id="dialogChargedPtj"  header="#{lbl['lbl.fl.add.charge.ptj']}" widgetVar="dlgChargedPtj" 
			styleClass="pop_up_top" modal="true" width="700" resizable="false" position="top">
			<p:messages id="chargePtjMsg" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		   <h:panelGroup  id="chargedPtj">
		   	<p:panel id="chargePtjSearchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
              <h:panelGrid columns="3">
                 <p:selectOneMenu for="chargeMinistry"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.fl.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="chargeMinistry" style="width:300px"
                      value="#{paymentMatchBackingBean.managedBean.ministryProfileId}" >
            	   <f:selectItems value="#{paymentMatchBackingBean.getMinistryDropdown()}"/>
            	   <p:ajax event="change" update=":form:jabatan" />
                 </p:selectOneMenu>
                 <p:selectOneMenu for="jabatan"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.fl.jabatan']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="jabatan" style="width:300px"
                      value="#{paymentMatchBackingBean.managedBean.jabatanProfileId}" >
            	   <f:selectItems value="#{paymentMatchBackingBean.getJabatanDropdown()}"/>
            	    <p:ajax event="change" update=":form:jabatan"/>
                 </p:selectOneMenu>
                 <p:selectOneMenu for="ptjcodename" 
                    value="#{paymentMatchBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                       <f:selectItem itemLabel="#{lbl['lbl.fl.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            	      <f:selectItem itemLabel="#{lbl['lbl.fl.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
            	      <p:ajax process="@this"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                     value="#{paymentMatchBackingBean.managedBean.ptjCodeNameSearchValues}" >
                     <p:ajax process="@this"/></p:inputText>
			  </h:panelGrid>
			  </p:panel>
			  	<div class="ppRightBtn">
       		         
       		         <p:commandButton id="chargePtjSearchId" value="#{lbl['lbl.btn.search']}" update=":form:tableChargePtj"  
       		            action="#{paymentMatchBackingBean.searchChargedPtjDetails}" process="@this" /> 
			         <p:commandButton id="resetlBtn" value="#{lbl['lbl.btn.reset']}" process="@this"
			            action="#{paymentMatchBackingBean.resetChargedPtjDetails}" update=":form:chargedPtj"   />
		       </div>
			  <p:panel id="chargeResultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
              <p:dataTable id="tableChargePtj" var="pmVar" value="#{paymentMatchBackingBean.chargedPtjDataModel}" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
                 rowIndexVar="rowIndex" selection="#{paymentMatchBackingBean.managedBean.selectedPmOrgProfile}" rowKey="#{pmVar}" lazy="true" rows="10">
               <p:ajax event="rowSelectRadio" update=":form:chargePtjSelectBtn" ></p:ajax>
                  <ac:paginator for="tableChargePtj"/>
                    <p:column selectionMode="single" style="width:18px;"> 
                         <f:facet name="header">
		               </f:facet>
                    </p:column>       
                    <p:column headerText="#{lbl['lbl.fl.ptj.code']}" >
                       	#{pmVar.orgCode}
					</p:column>
                    <p:column headerText="#{lbl['lbl.fl.ptj.name']}" >
                      	#{pmVar.orgName}
					</p:column>
			 </p:dataTable>
			 </p:panel>           
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.select']}"  id="chargePtjSelectBtn"
				    action="#{paymentMatchBackingBean.addChargedPtjDetails}" update=":form:deductionDataTable" 
				    onclick="dlgChargedPtj.hide();"/>
				    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="dlgChargedPtj.hide();" />
           </div>
           </h:panelGroup>
	</p:dialog>
	
	<ui:include src="/xhtml/fl/paymentmatch/deductionPopUp.xhtml" />
	<ac:lovPopup />	
</ui:composition>
