<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel id="deductionPanel" header="#{lbl['lbl.fl.payment.match.deduction']}" toggleable="true">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction']}" escape="false" />
	<h:outputText value="&lt;br/&gt;" escape="false" />
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction.payment']}" escape="false" />
			<p:commandLink  oncomplete="paymentDeductionGuideLineInfo.show();"  value="#{lbl['lbl.fl.instruction.here']}" style="font-size:10px;font-style:italic"
					process="@this"
					update=":form:paymentDeductionGuideLineInfoDialog" disabled="true"/>
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.deduction.payment1']}" escape="false"  />
		<p:dataTable id="deductionDataTable" var="deduction" value="#{paymentMatchBackingBean.deductionTable}"
			rowIndexVar="index" rowStyleClass="selectable" style="width: 100%"
			selection="#{paymentMatchBackingBean.managedBean.selectedDeductions}" rowKey="#{deduction}">
			<ac:paginator for="deductionDataTable" />
			<p:column selectionMode="multiple" style="text-align:center"/>
			<p:column headerText="#{lbl['lbl.fl.payment.match.deduction.type']}">
				<p:selectOneMenu id="deductionList" value="#{deduction.ctDeduction.deductionId}" 
				disabled="#{paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="ctDeduction"
						value="#{paymentMatchBackingBean.getDropdownValuesByCtDetails()}"/>
						 <p:ajax event="change" process="@this" update="deductionList,descId,danaPnl,gosodoPnl,deductionAmtPnl"
						 listener="#{paymentMatchBackingBean.checkDeductionList(deduction)}"/>
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.payment.match.deduction.desc']}">
				<p:inputText id="descId" value="#{deduction.deductionDesc}" disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}">
				<p:ajax process="@this" />
				</p:inputText>
			</p:column>
			<p:column style="white-space:normal;text-align:center">
			<f:facet name="header" >
					<h:outputText value="#{lbl['lbl.fl.payment.match.clauses.reference']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.clauses']}"/>
				</f:facet>
			<p:commandLink
					value="#{lbl['lbl.fl.payment.match.clauses']}"  action="#{paymentMatchBackingBean.retrieveClauses(deduction)}" oncomplete="clauses.show();"
					update=":form:clauseDialog"></p:commandLink>
				<h:outputText style="text-align:right" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.payment.match.amanah']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.deduction.amanah']}"/>
				</f:facet>
				<p:outputPanel id="danaPnl">
				<div style="width: 100%">
					<p:inputText id="dana" value="#{deduction.pmVotFund.votFundCode}"  disabled="true" size="10"/>
					<p:commandLink id="votfundLink" disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						onclick="deductionPopup.show();" >
						<f:setPropertyActionListener value="#{deduction}" target="#{paymentMatchBackingBean.managedBean.selectedDeduction}"/>
						<p:graphicImage value="/css/images/design/search.png"/>
					</p:commandLink>
				</div>
				</p:outputPanel>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.cp']}">
				<p:selectOneMenu id="paymentMethod" value="#{deduction.financingType}" disabled="#{deduction.enableCp or !bpmTasklistBackingBean.managedBean.claim}"
					style="width:100px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems var="payment" 
						value="#{paymentMatchBackingBean.getFinancingTypeDropdownValues()}"/>
						 <p:ajax event="change" process="@this" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gosodo']}">
			<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.gosodo']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gosodo']}"/>
				</f:facet>
				<p:outputPanel id="gosodoPnl">
				<div style="width: 100%">
					<ac:lov id="gosodo" update=":form:deductionDataTable"
						disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						lovId="PM_GL_ACCOUNT" headerText="#{lbl['lbl.fl.gosodo']}"
						saveObject="paymentMatchBackingBean.managedBean.paymentAdvice.flPaymentDeduction[#{index}].pmGlAccount"
						conditionField="pmOrgProfile.orgProfileId^#{paymentMatchBackingBean.retrieveJabatanOrgProfile(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.chargeOrgProfile.orgProfileId).orgProfileId}*pmOrgProfile^1^11"
						readonly="true" size="9"
						value="#{deduction.pmGlAccount.glAccCode}">
					</ac:lov>
				</div>
				</p:outputPanel>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount']}" style="text-align:center">
				<p:outputPanel id="deductionAmtPnl">
					<h:outputText styleClass="colFloatRight"
						value="#{deduction.deductionAmt}"
						rendered="#{deduction.ctDeduction.deductionType.parameterCode==ParameterConst.deductionTypeFixed}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<p:inputText styleClass="colFloatRight" disabled="#{deduction.ctDeduction.deductionId == null or paymentMatchBackingBean.managedBean.buttonVal == BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						value="#{deduction.deductionAmt}"
						rendered="#{!(deduction.ctDeduction.deductionType.parameterCode==ParameterConst.deductionTypeFixed)}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax event="blur" listener="#{paymentMatchBackingBean.validateDeductionAmt}" update="@form"></p:ajax>
					</p:inputText>
				</p:outputPanel>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right" id="deductionButton">
			<p:commandButton id="addButton" rendered="#{paymentMatchBackingBean.managedBean.buttonVal != BpmOutcomeConstant.bpmView}"
			disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
			value="#{lbl['lbl.btn.add']}" action="#{paymentMatchBackingBean.addDeductionRow()}" update="deductionDataTable" />
			<p:commandButton rendered="#{paymentMatchBackingBean.managedBean.buttonVal != BpmOutcomeConstant.bpmView}"
				disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
			id="deleteDeductionBtn" value="#{lbl['lbl.btn.delete']}" action="#{paymentMatchBackingBean.removeAddRow()}" update="@form"/>
		</div>
	</p:panel>
	
	<p:dialog id="clauseDialog" header="#{lbl['lbl.fl.payment.match.clauses']}"
		widgetVar="clauses" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="clauseDt" var="clause" style="width:100%"
			value="#{paymentMatchBackingBean.managedBean.ctDeductionClauseList}">
			<ac:paginator for="clauseDt" />
			<p:column headerText="#{lbl['lbl.fl.payment.match.clauses.desc']}" style="white-space:normal;">
				#{clause.clauseDescription}
			</p:column>
		</p:dataTable>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.btn.close']}" 
				oncomplete="clauses.hide();" >
			</p:commandButton>
		</div>
	</p:dialog>
	
	<p:dialog id="paymentDeductionGuideLineInfoDialog" header="#{lbl['lbl.fl.instruction.deduction.payment1']}"
		widgetVar="paymentDeductionGuideLineInfo" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="paymentDeductionDt" var="paymentDeduction" style="width:100%">
			<ac:paginator for="paymentDeductionDt" />
			<p:column headerText= "CONTENT NOT AVAILABLE" style="white-space:normal;">
			</p:column>
		</p:dataTable>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.btn.close']}" 
				oncomplete="paymentDeductionGuideLineInfo.hide();" >
			</p:commandButton>
		</div>
	</p:dialog>
	
	<ui:include src="/xhtml/fl/paymentmatch/deductionPopUp.xhtml" />
	<ac:lovPopup />	
</ui:composition>
