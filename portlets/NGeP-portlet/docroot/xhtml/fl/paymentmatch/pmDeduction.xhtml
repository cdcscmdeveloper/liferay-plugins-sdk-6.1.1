<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="deductionPanel" header="DEDUCTIONS" toggleable="true">
		<p:dataTable id="deductionDataTable" var="deduction" value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flPaymentDeduction}"
			rowIndexVar="index"
			selection="#{paymentMatchBackingBean.managedBean.selectedDeductions}" rowKey="#{deduction}" lazy="true">
			<ac:paginator for="deductionDataTable" />
			<p:column selectionMode="multiple" style="width:2%;text-align:center" />
			<p:column headerText="Type">
				<h:outputText rendered="#{index == 0}" value="#{paymentMatchBackingBean.getParameterDesc(deduction.deductionType)}" />
				<p:selectOneMenu rendered="#{index > 0}" value="#{paymentMatchBackingBean.managedBean.deductionId}" >
				<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="ctDeduction"
							value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.latestContractVer.ctDeductions}"
							itemLabel="#{paymentMatchBackingBean.getParameterDesc(ctDeduction.deductionType)}"
							itemValue="#{ctDeduction.deductionId}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Description">
				<p:inputText rendered="#{index > 0}" value="#{deduction.deductionDesc}" />
			</p:column>
			<p:column headerText="Clauses">
				<h:outputText style="text-align:right">
				</h:outputText>
			</p:column>
			<p:column headerText="Amanah">
				<h:inputText style="text-align:right" />
			</p:column>
			<p:column headerText="GOSODO">
				<h:outputText value="#{deduction.pmGlAccount.glAccCode}" />
			</p:column>
			<p:column headerText="Amount (RM)" style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{deduction.deductionAmt}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton 
			rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.docType == ParameterConst.doctypeContractOrder}" 
			value="Add" icon="ui-icon-add" action="#{paymentMatchBackingBean.addDeductionRow()}" update="deductionDataTable"/>
			<p:commandButton rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.docType == ParameterConst.doctypeContractOrder}" 
			id="deleteDeductionBtn" value="Delete" icon="ui-icon-delete"/>
		</div>
	</p:panel>
</ui:composition>
