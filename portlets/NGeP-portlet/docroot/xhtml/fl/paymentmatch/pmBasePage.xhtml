<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<ac:gpkiPopup 
			textBeforeSign="#{paymentMatchBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{paymentMatchBackingBean.preSubmitAction(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{paymentMatchBackingBean.enableAutoUpdate()}" 
		/>	
		<f:event listener="#{paymentMatchBackingBean.preRenderView}"
			type="preRenderView" />
		<table>
			<tr>
				<td><p:outputLabel value="1GFMAS Error: " rendered="#{paymentMatchBackingBean.managedBean.gfmasError}"/> </td>
				<td><p:commandLink oncomplete="gfmasError.show();" immediate="true"
					action="#{paymentMatchBackingBean.show1GFMASError()}"
					rendered="#{paymentMatchBackingBean.managedBean.gfmasError}">
						<p:graphicImage value="/css/images/design/exclamation.png" />
					</p:commandLink>
				</td>
			</tr>
		</table>
		<p:messages id="messages" showDetail="true" autoUpdate="#{paymentMatchBackingBean.managedBean.autoUpdate}" showSummary="false"
			closable="true" severity="error, info, warn" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						rendered="#{paymentMatchBackingBean.managedBean.taskId==null}"
						action="#{paymentMatchBackingBean.backToPervious}" /></td>			
				<td colspan="4" style="text-align: right;">
				<ui:decorate template="/xhtml/fl/shared/claim_template.xhtml">
						<ui:define name="outComeSection">
							<ui:repeat var="bpmAction"
							value="#{paymentMatchBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
							action="#{paymentMatchBackingBean.gpkiSignAction(bpmAction)}"
							styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>							
							</ui:repeat>
						</ui:define>
					</ui:decorate></td>
				<c:if
					test='#{paymentMatchBackingBean.managedBean.buttonVal eq "View"}'>
					<td colspan="4" style="text-align: right">	
					<p:commandLink 
						value="#{lbl['lbl.td.doc.trackingDiary']}"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypePaymentAdvice,paymentMatchBackingBean.managedBean.paymentAdvice.paymentAdviceId)}"
						immediate="true" />&#160;&#160;
					<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
						<p:fileDownload value="#{flDocumentBackingBean.generateReport(ParameterConst.doctypePaymentAdvice,paymentMatchBackingBean.managedBean.paymentAdvice.paymentAdviceNo,flDocumentManagedBean.taxable)}" />
					</p:commandLink>
					</td>		
				</c:if>	
			</tr>
		</table>
		<ui:include src="/xhtml/fl/paymentmatch/pmReviewHeaderPage.xhtml" />		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu" 
						activeIndex="#{paymentMatchBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form"
						actionListener="#{paymentMatchBackingBean.onTabChange(0)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.summary']}" update="@form"
							actionListener="#{paymentMatchBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.payment.match.deduction']}" update="@form" 
						actionListener="#{paymentMatchBackingBean.onTabChange(2)}" rendered="#{paymentMatchBackingBean.managedBean.showDeductionTab}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.payment.match.payment.summary']}" update="@form"
							actionListener="#{paymentMatchBackingBean.onTabChange(3)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="#{paymentMatchBackingBean.managedBean.showDeductionTab ? 3 : 2}" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.advanced.payment.summary']}" update="@form" 
						rendered="#{paymentMatchBackingBean.managedBean.haveAdvancedPymt}"
							actionListener="#{paymentMatchBackingBean.onTabChange(4)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="#{paymentMatchBackingBean.managedBean.showDeductionTab ? 4 : 3}" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="pmGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="pmChargeLine.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 2 and paymentMatchBackingBean.managedBean.showDeductionTab}">
						<ui:include src="pmDeduction.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == (paymentMatchBackingBean.managedBean.showDeductionTab ? 3 : 2)}">
						<ui:include src="pmSummary.xhtml" />
					</p:outputPanel>
					 <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == (paymentMatchBackingBean.managedBean.showDeductionTab ? 4 : 3)}">
						<ui:include src="pmAdvancedPaymentSumm.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
		<p:dialog id="gfmasErrorDlg" header="1GFMAS Error" widgetVar="gfmasError"
		showEffect="fade" hideEffect="fade" modal="true" 
		resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:messages id="gfmasMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" /></td>
			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Close" oncomplete="gfmasError.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	</ui:define>
</ui:composition>
