<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<f:event listener="#{paymentMatchBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<ui:include src="/xhtml/fl/paymentmatch/pmReviewHeaderPage.xhtml" />
		<table style="width: 100%;">
			<tr>
				<td style="text-align: left; width: 66px;"><p:outputLabel
						value="DOC NO:" /></td>
				<td style="width: 70px"><p:outputLabel
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.docNo}" />
				</td>
				<td colspan="4" style="text-align: right;"><ui:repeat
						var="bpmAction"
						value="#{paymentMatchBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}"
							action="#{paymentMatchBackingBean.submitAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu styleClass="sidemenu"
						style="display : table-caption;"
						activeIndex="#{paymentMatchBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="Charge Line Summary" update="@form"
							actionListener="#{paymentMatchBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="Deduction" update="@form">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
						<p:menuitem value="Payment Summary" update="@form"
							actionListener="#{paymentMatchBackingBean.onTabChange(3)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="3" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="pmGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="pmChargeLine.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="pmDeduction.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="pmSummary.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
