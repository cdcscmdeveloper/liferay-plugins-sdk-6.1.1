<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>	
		<f:event listener="#{paymentMatchBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true" showSummary="false"
			closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						rendered="#{paymentMatchBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" action="#{paymentMatchBackingBean.backToPervious}" /></td>			
				<td colspan="4" style="text-align: right;"><ui:repeat
						var="bpmAction"
						value="#{paymentMatchBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}" update="@form"
							action="#{paymentMatchBackingBean.submitAction(bpmAction)}"
							styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							icon="ui-icon-#{fn:toLowerCase(bpmAction)}" />							
					</ui:repeat></td>
			</tr>
		</table>
		<ui:include src="/xhtml/fl/paymentmatch/pmReviewHeaderPage.xhtml" />		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu" 
						activeIndex="#{paymentMatchBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.summary']}" update="@form"
							actionListener="#{paymentMatchBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.payment.match.deduction']}" update="@form">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.payment.match.payment.summary']}" update="@form"
							actionListener="#{paymentMatchBackingBean.onTabChange(3)}">
							<f:setPropertyActionListener
								target="#{paymentMatchBackingBean.managedBean.selectedTabIndex}"
								value="3" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="pmGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="pmChargeLine.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="pmDeduction.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{paymentMatchBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="pmSummary.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
