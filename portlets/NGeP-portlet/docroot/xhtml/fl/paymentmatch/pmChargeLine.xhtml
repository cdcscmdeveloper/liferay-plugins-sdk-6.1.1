<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true" styleClass="pmChargeLinePnlClass">

		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			
			selection="#{paymentMatchBackingBean.managedBean.selectedNode}"
			selectionMode="single"
			value="#{paymentMatchBackingBean.managedBean.chargeLineItemRoot}">
			<p:ajax event="select"
				listener="#{paymentMatchBackingBean.onNodeSelect()}"
				update="@(.chargeLineSection)" />
			<p:column headerText="Item Code">
				<h:outputText
					value="#{chargeLineNode.scRequestItem.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Item Name">
				<h:outputText value="#{chargeLineNode.scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="Unit"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Unit &lt;br /&gt; Price (RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.unitPrice}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeOrderedQty}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeReceivedQty}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Recalled &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText 
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeReceivedAmt}"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.chargeReceivedAmt}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Invoice &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeInvAmt}" id="invSumAmountTxt"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText  value="#{chargeLineNode.chargeInvAmt}" style="text-align:right;"  
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="DAN &lt;br /&gt; Amt.(RM)" style="text-align:right">
				
			</p:column>
		</p:treeTable>
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.vot.code']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.votFundCode}"
							size="9" disabled="true" /> </td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.asset.ind']}" /></td>
					<td><p:inputText
							size="9" disabled="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.asset.gosodo']}" /></td>
					<td><p:inputText
							size="9" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.program.activity']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.prgActivityCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.Project']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.projectCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.setia.subsetia']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.setiaCode}"
							size="9" disabled="true" /></td>
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.subSetiaCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.cp']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							size="9" disabled="true" /></td>

				</tr>
			</table>
		</h:panelGroup>
		
		<table style="width: 93%">
			<tr>
				<td style="text-align: right; font: bold; size: 10;">Grand
					Total: <p:spacer width="10px" />
					<h:outputText
						value="#{paymentMatchBackingBean.managedBean.orderedAmtGrandTotal}">
						<f:convertNumber pattern="#,#00.00" />
					</h:outputText>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
