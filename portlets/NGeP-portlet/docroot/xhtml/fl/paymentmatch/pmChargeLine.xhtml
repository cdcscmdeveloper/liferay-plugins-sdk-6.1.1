<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.menu.charge.line.summary']}" toggleable="true" styleClass="pmChargeLinePnlClass">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.charge.line.summary']}" escape="false"/>
		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			selection="#{paymentMatchBackingBean.managedBean.selectedNode}"
			selectionMode="single"
			value="#{paymentMatchBackingBean.managedBean.chargeLineItemRoot}">
			<p:ajax event="expand" 
                onstart="blockTreeTable.show();" oncomplete="blockTreeTable.hide();" />  			
			<p:ajax event="select"
				listener="#{paymentMatchBackingBean.onNodeSelect()}"
				update="@(.chargeLineSection)" />
			<p:ajax event="unselect"
				listener="#{paymentMatchBackingBean.onNodeUnSelect()}"
				update="@(.chargeLineSection)" />				
			<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;width:20%;" >
			<f:facet name="footer">
				<h:outputText value=""></h:outputText>			
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemName}" id="itemDesc"
				rendered="#{chargeLineNode.level == 1}" style="text-align:left; float:left;" title="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:center">
			<f:facet name="footer">
				<h:outputText value=""></h:outputText>			
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].unitPrice}"
				rendered="#{chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:center">
			<f:facet name="footer">
				<h:outputText value=""></h:outputText>			
			</f:facet>
				<h:outputText value="#{paymentMatchBackingBean.managedBean.taxInvoice=='false' ? lbl['lbl.txt.na'] : chargeLineNode.flInvoiceItem.gstUnitPrice}" rendered="#{chargeLineNode.level == 3}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal; text-align:center" >
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.fl.ordered.qty']}"></h:outputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ordered.quantity']}"/>
			</f:facet>
			<f:facet name="footer">
				<h:outputText value=""></h:outputText>			
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.orderedQty}" rendered="#{chargeLineNode.level == 2}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal; text-align:center">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.fl.received.qty']}"></h:outputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.received.quantity']}"/>
			</f:facet>
			<f:facet name="footer">
				<h:outputText value=""></h:outputText>			
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceItem.receivedQty}" rendered="#{chargeLineNode.level == 3}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="white-space:normal;text-align:center">
			<f:facet name="footer">
				<h:outputText value="#{paymentMatchBackingBean.managedBean.orderedAmtGrandTotal}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>	
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.orderedAmt}" rendered="#{chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.received.amount']}" style="white-space:normal;text-align:center">
				<f:facet name="footer">
					<h:outputText value="#{paymentMatchBackingBean.managedBean.receivedAmtGrandTotal}" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceItem.receivedAmt}" rendered="#{chargeLineNode.level == 3}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount.invoice']}" style="white-space:normal;text-align:center">
			<f:facet name="footer">
				<f:facet name="footer">
					<h:outputText value="#{paymentMatchBackingBean.managedBean.invAmtGrandTotal}" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>		
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.invAmt}" id="invSumAmountTxt" rendered="#{chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText  value="#{chargeLineNode.flInvoiceItem.invAmt}" rendered="#{chargeLineNode.level == 3}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.payment.match.dan.amount']}" style="white-space:normal;text-align:center">
			<f:facet name="footer">
				<h:outputText value="#{paymentMatchBackingBean.managedBean.danAmtGrandTotal}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>			
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.flAdjustmentItem.adjustedAmt}" rendered="#{chargeLineNode.flInvoiceSummary.flAdjustmentItem.flAdjustment.docType eq ParameterConst.doctypeDebitAdjustmentNote and chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.payment.match.can.amount']}" style="white-space:normal;text-align:center">
			<f:facet name="footer">
				<h:outputText value="#{paymentMatchBackingBean.managedBean.canAmtGrandTotal}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>				
			</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.flAdjustmentItem.adjustedAmt}" rendered="#{chargeLineNode.flInvoiceSummary.flAdjustmentItem.flAdjustment.docType eq ParameterConst.doctypeCreditAdjustmentNote and chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
		</p:treeTable>
		<p:blockUI widgetVar="blockTreeTable" block="chargeLineTbl">  
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		</p:blockUI> 			
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.asset.ind']}" /></td>
					<td><p:inputText size="17" disabled="true" 
							value="#{paymentMatchBackingBean.getParameterDesc(ParameterTypeConst.assetInd, paymentMatchBackingBean.managedBean.assetIndCode)}"/></td>
					<td style="width:95px;"><p:outputLabel value="#{lbl['lbl.fl.vot']}" /></td>
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.votFundType == ParameterConst.votAmanah? '':(paymentMatchBackingBean.managedBean.votFundCode)}" 
							size="9" disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.vot.code']}"/>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.fund']}" /></td> 
					<td>
						<p:inputText value="#{paymentMatchBackingBean.managedBean.votFundType == ParameterConst.votAmanah? (paymentMatchBackingBean.managedBean.votFundCode):''}" size="9" disabled="true" />
					</td>					
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.program.activiti']}" /></td>
					<td ><p:inputText
							value="#{paymentMatchBackingBean.managedBean.prgActivityCode}"
							size="9" disabled="true" /></td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.project']}" /></td> 
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.projectCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.setia.subsetia']}" /></td> 
					<td><p:inputText
							value="#{paymentMatchBackingBean.managedBean.setiaCode}"
							size="9" disabled="true" />
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.cp']}" /></td> 
					<td>
						<p:inputText value="#{paymentMatchBackingBean.getParameterDesc(ParameterTypeConst.financingType,paymentMatchBackingBean.managedBean.financingTypeCode)}"
							size="9" disabled="true" />
					</td>		
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.gosodo']}" /></td> 
					<td><p:inputText
							size="9" disabled="true" value="#{paymentMatchBackingBean.managedBean.glAccountCode}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gosodo']}"/></td>
				</tr>
			</table>	
		</h:panelGroup>
	</p:panel>
</ui:composition>
