<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAILS" toggleable="true">

		<p:dataTable id="itemDataTable" var="item" value="" paginator="true">
			<ac:paginator for="itemDataTable" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="Product Code" />
					<p:column rowspan="2" headerText="Item Name" />
					<p:column rowspan="2" headerText="GOSODO" />
					<p:column rowspan="2" headerText="Activity Code" />
					<p:column rowspan="2" headerText="Unit Price (MYR)" />
					<p:column colspan="4" headerText="Quantity" />
					<p:column colspan="2" headerText="Amount (MYR)" />
				</p:row>
				<p:row>
					<p:column headerText="Ord." />
					<p:column headerText="Recv." />
					<p:column headerText="Del." />
					<p:column headerText="Recall." />
					<p:column headerText="Ordered" />
					<p:column headerText="Delivered" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
			<p:column>
				<p:outputLabel />
			</p:column>
		</p:dataTable>

		<br />
		<br />

	</p:panel>
	<p:panel header="DEDUCTION" toggleable="true">
		<p:dataTable id="deductionDataTable" var="deduction">
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Type">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Description">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Amanah Code">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Amount (MYR)">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Action">
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
