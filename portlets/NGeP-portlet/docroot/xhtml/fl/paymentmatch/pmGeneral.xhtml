<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 124px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td style="width: 140px;"><p:inputText size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td ><p:outputLabel value="#{lbl['lbl.fl.pm.dan.no']}" /></td>
				<td style="width: 146px;"><p:inputText disabled="true" size="20"
						value="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="preparedPtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
				<td ><p:outputLabel value="#{lbl['lbl.fl.pm.can.no']}" /></td>
				<td style="width: 146px;"><p:inputText disabled="true" size="20"
						value="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo}" /></td>		
				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="issuePtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td ><p:outputLabel value="#{lbl['lbl.fl.pm.stop.instr.no']}" /></td>
				<td><p:inputText disabled="true" size="20"
						value="#{paymentMatchBackingBean.managedBean.stopInstrNo}" /></td>		
			</tr>			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="chargedPtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.chargeOrgProfile.orgName}"
						disabled="true" /></td>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.contr.no']}" /></td>
				<td style="width: 25px;"><p:inputText size="20"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo}"
						disabled="true" /></td>		
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.agOffice.officeCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.agOffice.officeName}" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.pm.mto']}" /></td>
				<td><p:selectBooleanCheckbox
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.mto}"
						disabled="true" /></td>		
			</tr>
		</table>
	</p:panel>
	<p:panel header="PAYMENT DESCRIPTION" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 145px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.supp.inv.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="20"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.supplierInvoiceRef}" /></td>
							<td style="width: 152px;"><p:outputLabel
									value="#{lbl['lbl.fl.pm.factored']}" /></td>
							<td><p:selectBooleanCheckbox disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.factored}" /></td>
						</tr>
					</table></td>
				<td style="width: 137px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.payment.pre.date']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td ><p:outputLabel
						value="#{lbl['lbl.fl.pm.inv.no']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceNo}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.sub.date']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.inv.date']}" /></td>
				<td><p:inputText size="20" disabled="true"
					value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				<h:panelGroup rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.status.statusId ne FulfilmentStatusCont.paPendingPaymentMatch}">
				<td style="width: 137px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.payment.date']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				</h:panelGroup>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.desc']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="53" maxlength="25"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.description}">
					</p:inputText></td>
				<h:panelGroup rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.status.statusId ne FulfilmentStatusCont.paPendingPaymentMatch}">	
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.ref']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentRefNo}" /></td>
				</h:panelGroup>		
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 145px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.smSupplier.regNo}" /></td>
							<td style="width: 88px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td>
								<p:inputText size="9" value="#{paymentMatchBackingBean.retrieveMofNo(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.smSupplier)}" disabled="true" />
							</td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{paymentMatchBackingBean.getFullAddress(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 88px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FACTORING DETAILS" toggleable="true"
		rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.factored eq 'true'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 135px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.pmFinancialOrg.finOrgName}" /></td>
				<td style="width: 133px;"><p:outputLabel
						value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.paymentBank.finOrgName}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.branch']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.branchName}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.accountNo}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{paymentMatchBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.phoneNo}" /></td>
							<td style="width: 68px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{paymentMatchBackingBean.managedBean.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
