	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">

						value="#{lbl['lbl.fl.ministry']}" /></td>

						value="#{paymentMatchBackingBean.retrieveMinistryByOrgProfileId(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.issuedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td><p:inputText size="66" id="controlOff"
						value="#{paymentMatchBackingBean.retrievePegawaiPengawalByOrgProfileId(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="66" id="ptjGroup"
						value="#{paymentMatchBackingBean.retrieveJabatanByOrgProfileId(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:490px;" 
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.pmOrgValidity.orgCode} #{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.preparedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:490px;" 
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.issuedOrgProfile.pmOrgValidity.orgCode} #{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.issuedOrgProfile.orgName}"/>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/></td>
			</tr>			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:490px;" 
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.chargeOrgProfile.pmOrgValidity.orgCode} #{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.chargeOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.acc.office']}" /></td>
				<td><p:inputText size="8" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.agOffice.officeCode}" />
					<p:spacer width="5" /> <p:inputText size="50" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.agOffice.officeName}" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.acc.office']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.fulfilment.type']}" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.docType eq 'CR'}" /></td>
				<td><p:inputText disabled="true" size="45" value="#{paymentMatchBackingBean.getParameterDesc(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.fulfillmentType)}" 
				rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.docType eq 'CR'}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.support.info.doc']}" toggleable="true">
		<table>
			<tr>
				<td style="width:150px;"><p:outputLabel value="#{lbl['lbl.fl.dan.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo}"
						 action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeDebitAdjustmentNote)}" immediate="true" rendered="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo !=null}"/>
					<h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo ==null}"/>  </td>
				<td style="width:390px;"><p:outputLabel value="#{lbl['lbl.fl.can.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo}"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeCreditAdjustmentNote)}" immediate="true" rendered="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo !=null}"/>
						 <h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo ==null}"/></td>		 	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.stop.instuc.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.stopInstrNo}"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeStopDelivery)}" immediate="true" rendered="#{paymentMatchBackingBean.managedBean.stopInstrNo !=null}"/>
						<h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.stopInstrNo ==null}"/> 
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.stop.inst.no']}"/> </td>		
				<td><p:outputLabel
						value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo}"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.contract)}" immediate="true" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo !=null}"/>
						<h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo ==null}"/></td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.dan.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.factored}" />
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.factored']}"/></td>		
			</tr>
		</table>
	</p:panel>
	<p:panel id="recvNoteListPanel"
		header="#{lbl['lbl.fl.goods.received.note.list']}" toggleable="true">
		<p:dataTable id="addressDataTable" var="delOrder"
			value="#{paymentMatchBackingBean.managedBean.delOrderList}"
			rowIndexVar="index" rowKey="#{delOrder}">
			<ac:paginator for="delOrderDataTable" />
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}"
				style="white-space:normal;width:480px;text-align:center;">
				<h:outputText style="text-align:left; float:left;"
					rendered="#{delOrder.flDeliveryAddress.flAddress != null}"
					value="#{paymentMatchBackingBean.getFullAddress(delOrder.flDeliveryAddress.flAddress)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.frn.do.no']}"
				style="white-space:normal;text-align:center;">
				<p:commandLink value="#{delOrder.supplierDoRef}" style="float:left;"
					rendered="#{delOrder.recordStatusFlg==1}" immediate="true"
					action="#{paymentMatchBackingBean.navigateDelOrder(delOrder)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.frn.no']}" style="text-align:center;">
				<p:commandLink style="float:left;"
					value="#{delOrder.fulfilmentNote.fulfilmentNoteNo}"
					rendered="#{delOrder.fulfilmentNote.recordStatusFlg==1}"
					immediate="true"
					action="#{paymentMatchBackingBean.navigateFulfilmentNote(delOrder)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.payment.match.payment.desc']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 145px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.invoice.no']}" /></td>
				<td><table>
						<tr>
							<td style="width: 25px;"><p:inputText size="45"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.supplierInvoiceRef}" /></td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supplier.invoice.no']}"/></td>
							
						</tr>
					</table></td>
				<td style="width: 102px;"><p:outputLabel
						value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.prepared.date']}"/></td>
			</tr>
			<tr>
				<td ><p:outputLabel
						value="#{lbl['lbl.fl.invoice.no']}" /></td>
				<td>
						<p:commandLink value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.supplierInvoiceRef}"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeInvoice)}" immediate="true"></p:commandLink>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.invoice.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.submission.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.invoice.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
					value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				<td style="width: 137px;"><p:outputLabel
						value="#{lbl['lbl.fl.payment.match.payment.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.payment.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.payment.desc']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="26"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceNo}/#{paymentMatchBackingBean.managedBean.invoiceDate}">
					</p:inputText>
					<p:inputText size="24" maxlength="24"
						disabled="#{paymentMatchBackingBean.managedBean.buttonVal=='View' or !bpmTasklistBackingBean.managedBean.claim}"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.description}"
						required="#{bpmTasklistBackingBean.managedBean.claim}"
						label="#{lbl['lbl.fl.payment.match.payment.desc']}">
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.desc']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.payment.ref']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentRefNo}" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.payment.reference']}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">

			</tr>

						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.accountNo}  #{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.paymentBank.finOrgName}"

			</tr>
			<tr>
				
				<td style="width: 80px;"><p:outputLabel
						value="#{lbl['lbl.fl.bank.acc.no.name']}" 
						rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.factored eq 'false'}"/></td>
				<td><p:inputText disabled="true" size="53"
						rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.factored eq 'false'}"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.accountNo}  #{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.paymentBank.finOrgName}" /></td>			
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50"

			</tr>

				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"

			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel

							<td style="width: 88px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.flAddress.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"

			</tr>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.flSupplierDtl.flAddress.contactPhoneNo}" /></td>
			</tr>
		</table>

				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
				<td><p:inputText disabled="true" size="25"

	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">

			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
