				<td><p:inputText disabled="true" size="51" value="#{paymentMatchBackingBean.getParameterDesc(paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.fulfillmentType)}"

	<p:panel header="#{lbl['lbl.fl.support.info.doc']}" toggleable="true">
		<table>
			<tr>
				<td style="width:150px;"><p:outputLabel value="#{lbl['lbl.fl.dan.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo}" immediate="true"
						 action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeDebitAdjustmentNote)}" rendered="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo !=null}"/>
					<h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.adjustmentDanDocNo ==null}"/>  </td>
				<td style="width:390px;"><p:outputLabel value="#{lbl['lbl.fl.can.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo}" immediate="true"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeCreditAdjustmentNote)}" rendered="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo !=null}"/>
						 <h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.adjustmentCanDocNo ==null}"/></td>		 	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.stop.instuc.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.stopInstrNo}" immediate="true"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeStopDelivery)}" rendered="#{paymentMatchBackingBean.managedBean.stopInstrNo !=null}"/>
						<h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.stopInstrNo ==null}"/> 
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.stop.inst.no']}"/> </td>		
				<td><p:outputLabel
						value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:commandLink value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo}"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.contract)}" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo !=null}"/>
						<h:outputText value="#{lbl['lbl.fl.supp.na']}" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract.contractNo ==null}"/></td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.dan.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.fulfilmentOrder.factored}" />
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.factored']}"/></td>		
			</tr>
		</table>

	<p:panel id="recvNoteListPanel"
		header="#{lbl['lbl.fl.goods.received.note.list']}" toggleable="true">
		<p:dataTable id="addressDataTable" var="delOrder"
			value="#{paymentMatchBackingBean.managedBean.delOrderList}"
			rowIndexVar="index" rowKey="#{delOrder}">
			<ac:paginator for="delOrderDataTable" />
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}"
				style="white-space:normal;width:480px;text-align:center;">
				<h:outputText style="text-align:left; float:left;"
					rendered="#{delOrder.flDeliveryAddress.flAddress != null}"
					value="#{paymentMatchBackingBean.getFullAddress(delOrder.flDeliveryAddress.flAddress)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.do.supp.do.no']}"
				style="white-space:normal;text-align:center;">
				<p:commandLink value="#{delOrder.supplierDoRef}" style="float:left;" immediate="true"
					rendered="#{delOrder.recordStatusFlg==1}" 
					action="#{paymentMatchBackingBean.navigateDelOrder(delOrder)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.frn.no']}" style="text-align:center;">
				<p:commandLink style="float:left;"
					value="#{delOrder.fulfilmentNote.fulfilmentNoteNo}" immediate="true"
					rendered="#{delOrder.fulfilmentNote.recordStatusFlg==1}"
					action="#{paymentMatchBackingBean.navigateFulfilmentNote(delOrder)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.payment.match.payment.desc']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 145px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.invoice.no']}" /></td>
				<td><table>
						<tr>
							<td style="width: 25px;"><p:inputText size="45"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.supplierInvoiceRef}" /></td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supplier.invoice.no']}"/></td>
							
						</tr>
					</table></td>
				<td style="width: 102px;"><p:outputLabel
						value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.prepared.date']}"/></td>
			</tr>
			<tr>
				<td ><p:outputLabel
						value="#{lbl['lbl.fl.invoice.no']}" /></td>
				<td>
						<p:commandLink value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceNo}" immediate="true"
						action="#{paymentMatchBackingBean.navigateDocument(ParameterConst.doctypeInvoice)}" ></p:commandLink>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.invoice.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.submission.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.invoice.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
					value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				<td style="width: 137px;"><p:outputLabel
						value="#{lbl['lbl.fl.payment.match.payment.date']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.payment.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.payment.desc']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="26"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceNo}/#{paymentMatchBackingBean.managedBean.invoiceDate}">
					</p:inputText>
					<p:inputText size="24" maxlength="24" 
						disabled="#{paymentMatchBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.description}"
						required="false"
						label="#{lbl['lbl.fl.payment.match.payment.desc']}">
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.desc']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.payment.ref']}" /></td>
				<td><p:inputText size="17" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentRefNo}" >
						<p:ajax update="@this"/>
						</p:inputText> <ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.payment.reference']}"/></td>
			</tr>
		</table>
	</p:panel>
