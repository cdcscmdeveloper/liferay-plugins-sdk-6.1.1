<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 116px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.supp.inv.no']}" /></td>
				<td><p:inputText size="33" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.inv.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="20"
									disabled="true" value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceNo}"/></td>
							<td style="width: 75px;"><p:outputLabel
									value="#{lbl['lbl.fl.pm.factored']}" /></td>
							<td><p:selectBooleanCheckbox disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="39" id="preparedPtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.adj.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value=" " /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="39" id="issuePtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.stop.instr.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value=" " /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.chargeOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="39" id="chargedPtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.chargeOrgProfile.orgName}"
						disabled="true" /></td>

				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.contr.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="20"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" /></td>
							<td style="width: 75px;"><p:outputLabel
									value="#{lbl['lbl.fl.pm.mto']}" /></td>
							<td><p:selectBooleanCheckbox disabled="true" /></td>
						</tr>
					</table></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true" /> <p:spacer
						width="5" /> <p:inputText size="39" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="PAYMENT DESCRIPTION" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="4" valign="top" style="width: 115px;"><p:outputLabel
						value="* #{lbl['lbl.fl.pm.payment.desc']}" /></td>
				<td rowspan="4"><p:inputTextarea cols="50" rows="6"
						style=" margin-bottom:5px;" disabled="true" /></td>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.payment.pre.date']}" /></td>
				<td><p:inputText size="25" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.sub.date']}" /></td>
				<td><p:inputText size="25" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.date']}" /></td>
				<td><p:inputText size="25" disabled="true">
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.ref']}" /></td>
				<td><p:inputText size="12" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="21" disabled="true" /></td>

						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{paymentMatchBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.supplierBranch.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="21" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.supplierBranch.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FACTORING DETAILS" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.branch']}" /></td>

				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{paymentMatchBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.supplierBranch.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="21" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.supplierBranch.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
