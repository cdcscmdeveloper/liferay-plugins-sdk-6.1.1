<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="FULFILMENT DETAIL" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="Ministry" /></td>
					<td><p:inputText style="width: 260px;"
							value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
					<td><p:outputLabel value="Contract NO." /></td>
					<td><p:inputText style="width: 260px;" value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.contractValue.contractNo}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Jabatan" /></td>
					<td><p:inputText style="width: 260px;"
							value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
					<td><p:outputLabel value="Order NO." /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value="" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Issued PTJ" /></td>
					<td><p:inputText style="width: 260px;"
							value="IBU PEJABAT KASTAM" disabled="true" /></td>
					<td><p:outputLabel value="Order Amt." /></td>
					<td><p:inputText disabled="true" style="width: 160px;"
							value=" " />MYR</td>
				</tr>
				<tr>
					<td><p:outputLabel value="Received PTJ" /></td>
					<td><p:inputText style="width: 260px;"
							value="IBU PEJABAT KASTAM" disabled="true" /></td>
					<td><p:outputLabel value="Stop Fulfilment NO" /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value=" " /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Charge PTJ" /></td>
					<td><p:inputText style="width: 260px;" disabled="true"
							value="IBU PEJABAT KASTAM (RECEIVING PTJ)" /></td>
					<td><p:outputLabel value="Stop Fulfilment Amt." /></td>
					<td><p:inputText disabled="true" style="width: 160px;"
							value="" />MYR</td>
				</tr>
				<tr>
					<td><p:outputLabel value="Maksud Code" /></td>
					<td><p:inputText style="width: 160px;" disabled="true"
							value="" /></td>
					<td><p:outputLabel value="Invoice Amt." /></td>
					<td><p:inputText disabled="true" style="width: 160px;"
							value="" />MYR</td>
				</tr>
				<tr>
					<td rowspan="4"><p:outputLabel value="Title" /></td>
					<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"  disabled="true"/></td>
					<td><p:outputLabel value="Supp. Invoice NO." /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value="" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Invoice Amt." /></td>
					<td><p:inputText disabled="true" style="width: 160px;"
							value="" />MYR</td>
				</tr>
				<tr>
					<td><p:outputLabel value="CAN NO." /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value="" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="CAN Amt." /></td>
					<td><p:inputText disabled="true" style="width: 160px;"
							value="" />MYR</td>
				</tr>
				<tr>
					<td rowspan="4"><p:outputLabel value="Payment Description" /></td>
					<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"  /></td>
					<td><p:outputLabel value="DAN NO." /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value="" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="DAN Amt." /></td>
					<td><p:inputText disabled="true" style="width: 160px;"
							value="" />MYR</td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="DELIVERY AND FRN DETAIL" toggleable="true">
			<p:dataTable id="dataTable" var="item" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:column headerText="Delivery Order NO.">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="FRN NO.">
					<h:outputText value="" />
				</p:column>

				<p:column style="width: 360px;" headerText="Delivery Address">
					<h:outputText value="" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="SUPPLIER DETAIL" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="Supplier ID" /></td>
					<td><p:inputText disabled="true" style="width: 120px;"
							value="" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Supplier Name" /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value="001" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputTextarea rows="8" style="width: 260px;"  disabled="true"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Telephone NO." /></td>
					<td><p:inputText disabled="true" style="width: 120px;"
							value="02-7324800" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Email" /></td>
					<td><p:inputText disabled="true" style="width: 260px;"
							value="KBB.XY@gmail.com" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="REMARKS AND ATTACHMENT" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="* Remarks    " /></td>
					<td><p:inputTextarea rows="8" style="width: 260px;"  /></td>
					<td><p:outputLabel value="Attachment" /></td>
					<td><p:commandButton value="Attach Files" /></td>
				</tr>
			</table>
		</p:panel>
</ui:composition>
