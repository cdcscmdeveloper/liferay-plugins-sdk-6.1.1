<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Ministry" /></td>
				<td><p:inputText size="35" value="KEMENTERIAN KEWANGAN"
						disabled="true" /></td>
				<td><p:outputLabel value="Contract No." /></td>
				<td><p:inputText size="20"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Jabatan" /></td>
				<td><p:inputText size="35"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="Order No." /></td>
				<td><p:inputText disabled="true" size="20" value="" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Issued PTJ" /></td>
				<td><p:inputText size="35" value="IBU PEJABAT KASTAM"
						disabled="true" /></td>
				<td><p:outputLabel value="Order Amt." /></td>
				<td><p:inputText disabled="true" size="20" value=" " /> <p:spacer
						width="5" /> <p:inputText disabled="true" style="width: 15px;"
						value="MYR" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Received PTJ" /></td>
				<td><p:inputText size="35" value="IBU PEJABAT KASTAM"
						disabled="true" /></td>
				<td><p:outputLabel value="Stop Fulfilment No" /></td>
				<td><p:inputText disabled="true" size="20" value=" " /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Charge PTJ" /></td>
				<td><p:inputText size="35" disabled="true"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" /></td>
				<td><p:outputLabel value="Stop Fulfilment Amt." /></td>
				<td><p:inputText disabled="true" size="20" value="" /> <p:spacer
						width="5" /> <p:inputText disabled="true" style="width: 20px;"
						value="MYR" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Maksud Code" /></td>
				<td><p:inputText size="20" disabled="true" value="" /></td>
				<td><p:outputLabel value="Invoice No." /></td>
				<td><p:inputText disabled="true" size="20" value="" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel value="Title" /></td>
				<td rowspan="2"><p:inputTextarea
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.title}"
						cols="36" style="margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel value="Supp. Invoice No." /></td>
				<td><p:inputText disabled="true" size="20" value="" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Invoice Amt." /></td>
				<td><p:inputText disabled="true" size="20" value="" /> <p:spacer
						width="5" /> <p:inputText disabled="true" style="width: 20px;"
						value="MYR" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="Payment Description" /></td>
				<td rowspan="2"><p:inputTextarea cols="36" /></td>
				<td><p:outputLabel value="CAN No." /></td>
				<td><p:inputText disabled="true" size="20" value="" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="CAN Amt." /></td>
				<td><p:inputText disabled="true" size="20" value="" /> <p:spacer
						width="5" /> <p:inputText disabled="true" style="width: 20px;"
						value="MYR" /></td>
			</tr>
			<tr>
				<td colspan="3"><p:outputLabel value="DAN No." /></td>
				<td><p:inputText disabled="true" size="20" value="" /></td>

			</tr>
			<tr>
				<td colspan="3"><p:outputLabel value="DAN Amt." /></td>
				<td><p:inputText disabled="true" size="20" value="" /> <p:spacer
						width="5" /> <p:inputText disabled="true" style="width: 20px;"
						value="MYR" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="DELIVERY AND FRN DETAIL" toggleable="true">
		<p:dataTable id="dataTable" var="item">
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Delivery Order NO.">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="FRN NO.">
				<h:outputText value="" />
			</p:column>
			<p:column style="width: 360px;" headerText="Delivery Address">
				<h:outputText value="" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 135px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText disabled="true" size="35" value="001" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td><p:inputTextarea cols="36" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Tel No." /></td>
				<td><p:inputText disabled="true" size="20" value="02-7324800" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText disabled="true" size="35"
						value="KBB.XY@gmail.com" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
