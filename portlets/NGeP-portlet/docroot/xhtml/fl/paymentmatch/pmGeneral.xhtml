<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 126px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td style="width: 360px;"><p:inputText size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td style="width: 150px;"><p:outputLabel value="#{lbl['lbl.fl.pm.supp.inv.no']}" /></td>
				<td><p:inputText size="33" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.supplierInvoiceRef}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="preparedPtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.inv.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="20"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceNo}" /></td>
							<td style="width: 80px;"><p:outputLabel
									value="#{lbl['lbl.fl.pm.factored']}" /></td>
							<td><p:selectBooleanCheckbox disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.factored}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="issuePtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.adj.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value="#{paymentMatchBackingBean.managedBean.adjustmentDocNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="chargedPtj"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.chargeOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.stop.instr.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value="#{paymentMatchBackingBean.managedBean.stopInstrNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.agOffice.officeCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.agOffice.officeName}" /></td>

				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.contr.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="20"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.contractNo}"
									disabled="true" /></td>
							<td style="width: 75px;"><p:outputLabel
									value="#{lbl['lbl.fl.pm.mto']}" /></td>
							<td><p:selectBooleanCheckbox value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.mto}" disabled="true" /></td>
						</tr>
					</table></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="PAYMENT DESCRIPTION" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="4" valign="top" style="width: 127px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.payment.desc']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td rowspan="4" style="width: 280px;"><p:inputTextarea cols="55" rows="6"
						maxlength="255" style=" margin-bottom:5px;" id="paymentDesc"
						label="PaymentDescription" required="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.description}" />
				</td>
				<td style="width: 106px;">
					<p:message for="paymentDesc" display="icon" />
				</td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.fl.pm.payment.pre.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.sub.date']}" /></td>
				<td><p:inputText size="25" disabled="true" 
				value="#{paymentMatchBackingBean.managedBean.paymentAdvice.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentDate}">
					</p:inputText></td>
			</tr>
			<tr>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.pm.payment.ref']}" /></td>
				<td><p:inputText size="12" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentRefNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 133px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.smSupplier.regNo}" /></td>
							<td style="width: 68px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="16" disabled="true" /></td>

						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{paymentMatchBackingBean.getFullAddress(paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 68px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.flFulfilmentRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FACTORING DETAILS" toggleable="true"
		rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.factored eq 'true'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 132px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.flFulfilmentOrder.pmFinancialOrg.finOrgName}" /></td>
				<td style="width: 133px;"><p:outputLabel
						value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.paymentBank.finOrgName}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.branch']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.branchName}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.accountNo}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{paymentMatchBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{paymentMatchBackingBean.managedBean.phoneNo}" /></td>
							<td style="width: 68px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{paymentMatchBackingBean.managedBean.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{paymentMatchBackingBean.managedBean.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{paymentMatchBackingBean.managedBean.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
