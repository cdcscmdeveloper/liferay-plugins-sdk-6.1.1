<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.payment.match.payment.summary']}" toggleable="true"
		styleClass="pmSummaryPnlClass">
		<table>
			<tr>
				<td style="width:230px"><p:outputLabel value="#{lbl['lbl.fl.invoice.amount.excl.gst']}" /></td>
				<td><p:inputText size="35" value="#{paymentMatchBackingBean.managedBean.invoiceAmountWithoutGST}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.amt.excl.gst']}"/></td>	
			</tr>
			<tr>
				<td style="width:185px"><p:outputLabel value="#{lbl['lbl.fl.gst.amt']}" /></td>
				<td><p:inputText size="35" value="#{paymentMatchBackingBean.managedBean.gstAmount}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.gst.amt']}"/></td>	
			</tr>
			<tr>
				<td style="width:185px"><p:outputLabel value="#{lbl['lbl.fl.invoice.amount.incl.gst']}" /></td>
				<td><p:inputText size="35" value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceAmtNew}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.inv.amt.incl.gst']}"/></td>	
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.payment.match.total.deduction']}" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract != null}"/></td>
				<td><p:inputText size="35" style="text-align:right"
						disabled="true" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract != null}"
						value="#{paymentMatchBackingBean.managedBean.deductionAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.total.deduction.amt']}" rendered="#{paymentMatchBackingBean.managedBean.paymentAdvice.flRequest.ctContract != null}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.inv.service.fee']}" /></td>
				<td>
					<p:inputText size="35" value="#{paymentMatchBackingBean.managedBean.serviceCharge}" disabled="true" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</p:inputText><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.service.fee']}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.fee.amount']}" /></td>
				<td><p:inputText size="35" style="text-align:right"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.feeAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.service.fee.amt']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.payment.amount']}" /></td>
				<td><p:inputText size="35" style="text-align:right"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pm.payment.amt']}"/></td>
			</tr>
		</table>
		<p:spacer height="10px" />
		<p:dataTable value="#{paymentMatchBackingBean.managedBean.taxInvoiceList}" var="taxInvoice" style="width:50%" rendered="#{paymentMatchBackingBean.managedBean.taxInvoice}">
			<p:column headerText="#{lbl['lbl.fl.gst.rate']}" style="white-space:normal;">
				<h:outputText value="#{taxInvoice.gstFlag}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amt.wo.gst']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{taxInvoice.amountWithoutGst}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{taxInvoice.gstAmount}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>		
	</p:panel>
</ui:composition>
