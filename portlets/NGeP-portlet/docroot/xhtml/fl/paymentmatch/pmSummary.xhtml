<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.payment.match.payment.summary']}" toggleable="true"
		styleClass="pmSummaryPnlClass">
		<table>
			<tr>
				<td style="width: 250px"><p:outputLabel
						value="#{lbl['lbl.fl.total.invoice.amount']}" /></td>
				<td><p:inputText size="35" style="text-align:right"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.flInvoice.invoiceAmtNew}"
						disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.payment.match.total.deduction']}" /></td>
				<td><p:inputText size="35" style="text-align:right"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.deductionAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.fee.amount']}" /></td>
				<td><p:inputText size="35" style="text-align:right"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.feeAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.payment.amount']}" /></td>
				<td><p:inputText size="35" style="text-align:right"
						disabled="true"
						value="#{paymentMatchBackingBean.managedBean.paymentAdvice.paymentAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
