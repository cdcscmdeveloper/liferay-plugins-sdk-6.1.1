<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel id="pymtTrackingPnl" header="#{lbl['lbl.fl.advanced.payment.summary']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.advance.payment.co.issued']}" /></td>
				<td><p:inputText value="#{paymentMatchBackingBean.managedBean.numberOfCO}" disabled="true" size="10" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.advance.payment.paid.amount']}" /></td>
				<td><p:inputText value="#{paymentMatchBackingBean.managedBean.paidAmt}" disabled="true" size="10" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.advance.payment.paid.percentage']}" /></td>
				<td><p:inputText value="#{paymentMatchBackingBean.managedBean.paidPerc}" disabled="true" size="10" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.advance.payment.balance.to.paid']}" /></td>
				<td><p:inputText value="#{paymentMatchBackingBean.managedBean.balanceAmt}" disabled="true" size="10" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
