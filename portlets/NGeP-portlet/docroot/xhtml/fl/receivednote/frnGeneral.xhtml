<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td style="width: 378px;"><p:inputText size="53" id="ministry"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td style="width: 150px;" rowspan="3" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="55" rows="4"
						maxlength="500"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.title}"
						style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="preparedPtj"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="issuePtj"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="chargePtj"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.frn.poco.no']}" /></td>
				<td><p:inputText disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.flFulfilmentOrder.docNo}"></p:inputText>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.requisitioner']}" /></td>
				<td><p:inputText size="53"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.requistioner.userName}"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 130px;" rowspan="3" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td style="width: 350px;" rowspan="3"><p:inputTextarea
						id="delAddrText1" cols="55" rows="4" maxlength="500"
						style=" margin-bottom:5px;" disabled="true"
						value="#{receivedNoteBackingBean.getFullAddress(receivedNoteBackingBean.managedBean.fulfilmentNote.flDeliveryOrder.flDeliveryAddress.pmAddress)}" />
				</td>
				<td style="width: 180px;"><p:outputLabel
						value="#{lbl['lbl.fl.frn.prepare.date']}" /></td>

				<td><p:inputText size="25" disabled="true" value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.createdDate}">
				<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="25" disabled="true" value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.submissionDate}">
				<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.frn.act.received.date']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="width: 170px;"><p:calendar mode="popup" showOn="button" id="receivedDate" label="#{lbl['lbl.fl.frn.act.received.date']}" required="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.receivedDate}"
						maxdate="#{receivedNoteBackingBean.getCurrentDate()}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar>
				</td>
				<td><p:message for="receivedDate" display="icon" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 135px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" /></td>
							<td style="width: 68px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{receivedNoteBackingBean.getFullAddress(receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 68px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.contactFaxNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	
	
	
	
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
	
	
</ui:composition>
