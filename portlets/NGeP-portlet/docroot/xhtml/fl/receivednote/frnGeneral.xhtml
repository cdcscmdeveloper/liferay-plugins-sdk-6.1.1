<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.frn.no']}" /></td>
				<td><p:inputText style="width: 120px;" value="FRN-01010101"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.frn.ord.no']}" /></td>
				<td><p:inputText disabled="true" style="width: 120px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText style="width: 120px;"
						value="12/10/2012 10:45 AM" disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="4" valign="top"><p:outputLabel value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="4"><p:inputTextarea rows="8"
						style="width: 260px;margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText style="width: 260px;" value="NEW REQUEST"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText style="width: 120px;" value="2013"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:inputText style="width: 120px;" value="002 CAWANGAN KL"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']} ?" /></td>
				<td><p:selectBooleanCheckbox /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="DELIVERY DETAIL" toggleable="true">


		<table>
			<tr>
				<td rowspan="4" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.del.delivery.address']}" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.delivery.ord.no']}" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.supp.del.ord.no']}" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.actual.recv.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						value="#{recievedNoteBackingBean.managedBean.fulfilmentNote.actStartDate}" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.id']}" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText style="width: 260px;" value="KBB SDN BHD"
						disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea rows="8"
						style="width: 260px;margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText style="width: 260px;" value="KBB.XY@gmail.com"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText style="width: 120px;" value="02-7324800 "
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="REMARKS AND ATTACHMENT" toggleable="true">
		<table>
			<tr>
				<td valign="top"><p:outputLabel value="* Remarks    " /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;" /></td>
				<td><p:outputLabel value="Attachment" /></td>
				<td><p:commandButton value="Attach Files" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
