<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right">
				<ui:repeat var="bpmAction"
					value="#{createFRNBackingBean.managedBean.actions}">
					<p:commandButton value="#{bpmAction}" ajax='false' action="#{createFRNBackingBean.submitAction(bpmAction)}" process="@this"/>
				</ui:repeat> 
				</td>
			</tr>
		</table>

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Ministry" /></td>
				<td><p:inputText style="width: 260px;"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
				<td><p:outputLabel value="FRN. NO." /></td>
				<td><p:inputText style="width: 260px;" value="FRN-01010101"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Jabatan" /></td>
				<td><p:inputText style="width: 260px;"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="Order NO." /></td>
				<td><p:inputText disabled="true" style="width: 260px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Issued PTJ" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM" disabled="true" /></td>
				<td><p:outputLabel value="Contract NO." /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Received PTJ" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM" disabled="true" /></td>
				<td><p:outputLabel value="Creation Date" /></td>
				<td><p:inputText style="width: 260px;"
						value="12/10/2012 10:45 AM" disabled="true" /></td>
			</tr>

			<tr>
				<td rowspan="4"><p:outputLabel value="Title" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText style="width: 260px;" value="NEW REQUEST"
						disabled="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Financial Year" /></td>
				<td><p:inputText style="width: 260px;" value="2013"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Maksud  Code" /></td>
				<td><p:inputText style="width: 260px;"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="Charge PTJ" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" disabled="true" /></td>


			</tr>
			<tr>
				<td><p:outputLabel value="AG Office" /></td>
				<td><p:inputText style="width: 260px;" value="002 CAWANGAN KL"
						disabled="true" /></td>

				<td><p:outputLabel value="Financing?" /></td>
				<td><p:selectBooleanCheckbox /></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="DELIVERY DETAIL" toggleable="true">


		<table>
			<tr>
				<td rowspan="4"><p:outputLabel value="Delivery Address" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
				<td><p:outputLabel value="Delivery Order NO." /></td>
				<td><p:inputText style="width: 220px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supp. Del. Order NO." /></td>
				<td><p:inputText style="width: 220px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Actual Received Date" /></td>
				<td><p:calendar mode="popup" showOn="button" value="#{createFRNBackingBean.managedBean.fulfilmentNote.actStartDate}"/></td>
				
			</tr>

		</table>
	</p:panel>

	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Supplier ID" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText style="width: 260px;" value="KBB SDN BHD"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText style="width: 260px;" value="KBB.XY@gmail.com"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Telephone NO." /></td>
				<td><p:inputText style="width: 120px;" value="02-7324800 "
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="REMARKS AND ATTACHMENT" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="* Remarks    " /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;" /></td>
				<td><p:outputLabel value="Attachment" /></td>
				<td><p:commandButton value="Attach Files" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
