<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50"  id="ministry"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 99px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.title}"
						style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="37" id="preparedPtj"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="37" id="issuePtj"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.frn.poco.no']}" /></td>
				<td><p:inputText value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.flFulfilmentOrder.docNo}"></p:inputText> </td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="37" id="chargePtj"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.requisitioner']}" /></td>
				<td><p:inputText size="50"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style=" width:130px;" rowspan="3" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td style=" width:50px;" rowspan="3">
						<p:inputTextarea id="delAddrText1" cols="50" rendered="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flDeliveryOrder.flDeliveryAddress.addressType != null}"
						rows="6" style=" margin-bottom:5px;" disabled="true" value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flDeliveryOrder.flDeliveryAddress.addressType.pmAddress.address1}"/>
						
						<p:inputTextarea id="delAddrText2" cols="50" rendered="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flDeliveryOrder.flDeliveryAddress.addressType eq null}"
						rows="6" style=" margin-bottom:5px;" disabled="true" value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flDeliveryOrder.flDeliveryAddress.pmAddress.address1}"/>
				</td>
				<td style=" width:190px;"><p:outputLabel value="#{lbl['lbl.fl.frn.prepare.date']}" /></td>
				
				<td><p:inputText size="25" disabled="true" /></td>
			</tr>
			<tr>
				<td ><p:outputLabel
						value="* #{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="25" disabled="true"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="* #{lbl['lbl.fl.frn.act.received.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						pattern="dd/mm/yyyy" requiredMessage="Received date is Required"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.receivedDate}"
						required="true" /></td>
			</tr>
			
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style=" width:129px;"><p:outputLabel
						value="#{lbl['lbl.txt.business.reg.no']}" /></td>
				<td style=" width:50px;"><p:inputText size="25" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" /></td>
				<td style=" width:182px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{receivedNoteBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.supplierBranch.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.supplierBranch.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
