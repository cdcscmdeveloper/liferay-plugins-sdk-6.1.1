<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35" value="KEMENTERIAN KEWANGAN"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.frn.no']}" /></td>
				<td><p:inputText size="20" value="FRN-01010101" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:inputText size="35"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.frn.ord.no']}" /></td>
				<td><p:inputText disabled="true" size="20" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="35" value="IBU PEJABAT KASTAM"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText size="35" value="IBU PEJABAT KASTAM"
						disabled="true" /></td>

				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20" value="2013" disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="2"><p:inputTextarea  cols="36" value="#{recievedNoteBackingBean.managedBean.fulfilmentRequest.title}"
						style="margin-bottom:5px;" disabled="true" /></td>

				<td><p:outputLabel value="#{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:inputText size="35" value="KEMENTERIAN KEWANGAN"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:inputText size="35"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']} " /></td>
				<td><p:selectOneRadio
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financingLoan}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText size="20" value="12/10/2012 10:45 AM"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:inputText size="20" value="002 CAWANGAN KL"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText size="35" value="NEW REQUEST" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="DELIVERY DETAIL" toggleable="true">


		<table style="width: 100%">
			<tr>
				<td rowspan="2" valign="top" style="width: 110px;"><p:outputLabel
						value="#{lbl['lbl.fl.del.delivery.address']}" /></td>
				<td rowspan="2" style="width: 210px;"><p:inputTextarea 
						cols="36" /></td>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.fl.del.delivery.ord.no']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.supp.del.ord.no']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="* #{lbl['lbl.fl.del.recv.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						requiredMessage="Actual received date is required" required="true"
						pattern="dd/mm/yyyy"
						value="#{recievedNoteBackingBean.managedBean.fulfilmentNote.actStartDate}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 110px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="35" value="KBB SDN BHD" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea  cols="36"
						style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText size="35" value="KBB.XY@gmail.com"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="20" value="02-7324800 " disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
