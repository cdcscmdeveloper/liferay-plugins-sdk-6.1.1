<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions" >

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>	
		<f:event listener="#{receivedNoteBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true" showSummary="false" closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true" 
						rendered="#{receivedNoteBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" oncomplete="location.replace(document.referrer);" /></td>
				<td colspan="4" style="text-align: right">
					<ui:repeat
						var="bpmAction"
						value="#{receivedNoteBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}" update="@form" styleClass="ui-button" icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{receivedNoteBackingBean.submitAction(bpmAction)}" />
					</ui:repeat>
					<c:if
						test='#{receivedNoteBackingBean.managedBean.buttonVal eq "Update"}'>
						<td colspan="4" style="text-align: right"><p:commandButton
								value="UPDATE" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{receivedNoteBackingBean.submitAction('UPDATE')}">
								<f:param name="actionName" value="UPDATE" />
							</p:commandButton></td>
					</c:if>
					<c:if
						test='#{receivedNoteBackingBean.managedBean.buttonVal eq "Cancel"}'>
						<td colspan="4" style="text-align: right"><p:commandButton
								value="CANCEL" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{receivedNoteBackingBean.submitAction('CANCEL')}">
								<f:param name="actionName" value="CANCEL" />
							</p:commandButton></td>
					</c:if>					
				</td>
			</tr>
		</table>
		<ui:include src="frnReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu"
						activeIndex="#{receivedNoteBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{receivedNoteBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="FRN Item" update="@form">
							<f:setPropertyActionListener
								target="#{receivedNoteBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="Evaluation" update="@form">
							<f:setPropertyActionListener
								target="#{receivedNoteBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{receivedNoteBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="frnGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{receivedNoteBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="frnItem.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{receivedNoteBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="frnEvaluation.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
