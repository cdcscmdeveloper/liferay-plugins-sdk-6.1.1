<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<f:event listener="#{receivedNoteBackingBean.preRenderView}" type="preRenderView" />	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td style="text-align: left; width: 66px;"><p:outputLabel
						value="DOC NO:" /></td>
				<td style="width: 70px"><p:outputLabel
						value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.docNo}" />
				</td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction"
						value="#{receivedNoteBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}" ajax='false'
							action="#{receivedNoteBackingBean.submitAction(bpmAction)}"
							process="@this" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<c:if
					test='#{receivedNoteBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{receivedNoteBackingBean.submitAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{receivedNoteBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{receivedNoteBackingBean.submitAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<p:tabView id="tt" orientation="left" widgetVar="tt">
			<p:tab title="General">
				<ui:include src="frnGeneral.xhtml" />
			</p:tab>
			<p:tab title="Item">
				<ui:include src="frnItem.xhtml" />
			</p:tab>
			<p:tab title="Supplier Evaluation">
				<ui:include src="frnEvaluation.xhtml" />
			</p:tab>
			
			
		</p:tabView>
	</ui:define>
</ui:composition>
