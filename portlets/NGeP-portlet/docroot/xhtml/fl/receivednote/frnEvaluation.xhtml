<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="SUPPLIER EVALUATION" toggleable="true">
		<br />
		<h:outputText value="Supplier Evaluation: " />
		<h:outputLink id="grow" value="#">
			<h:outputText value="?" />
		</h:outputLink>
		<br />
		<br />
		<p:tooltip for="grow"
			value="Rating Tips
						1 - 2 Non Satisfactory
						3 - 4 Satisfactory
						5      Very Satisfactory"
			showEffect="clip" hideEffect="explode"  />
		<p:panelGrid style="margin-top:10px;width: 300px ">
			<f:facet name="header">
				<p:row>
					<p:column colspan="1">Criteria</p:column>
					<p:column colspan="1">Score</p:column>
				</p:row>
			</f:facet>
			<p:row>
				<p:column style="font-weight: bold;">Delivery service</p:column>
				<p:column rowspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
			</p:row>
			<p:row>
				<p:column style="font-weight: bold;">Quality</p:column>
				<p:column rowspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
			</p:row>
			<p:row>
				<p:column style="font-weight: bold;">Score</p:column>
				<p:column rowspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
</ui:composition>
