<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.frn.supp.rating']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.fl.supp.rating']}"/>
		<br />
		<table style="width: 100%">
			<tr>
				<td style="width: 180px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 260px;"><p:inputText size="25"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}"
									disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}"/></td>
							<td style="width: 109px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="25"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.mofNo}"
									disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}"/></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="85"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
		</table>
		<p:dataTable id="suppEvalutionDt" var="suppEvalution" rowKey="#{suppEvalution}"
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flSupplierEvaluation}">
			<ac:paginator for="suppEvalutionDt" />
			<p:column>
				<f:facet name="header">
	                <h:outputText value="#{lbl['lbl.fl.frn.criteria']}" />
	            </f:facet>
				<h:outputText value="#{receivedNoteBackingBean.getCriteriaDesc(suppEvalution.pmCriteria)}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.fl.frn.score']}"  />
				</f:facet>
				<h:selectOneMenu id="score" value="#{suppEvalution.score}" label="#{lbl['lbl.fl.frn.score']}" 
					disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks() or receivedNoteBackingBean.managedBean.isDisableEvaluation() or receivedNoteBackingBean.managedBean.buttonVal eq 'View' or !bpmTasklistBackingBean.managedBean.claim}" >
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItem itemLabel="1" itemValue="1" />
					<f:selectItem itemLabel="2" itemValue="2" />
					<f:selectItem itemLabel="3" itemValue="3" />
					<f:selectItem itemLabel="4" itemValue="4" />
					<f:selectItem itemLabel="5" itemValue="5" />
				</h:selectOneMenu>
				<p:message for="score" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.remarks']}" />
				</f:facet>
				<p:inputText value="#{suppEvalution.remark}" maxlength="255" style="width:450px" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks() or receivedNoteBackingBean.managedBean.isDisableEvaluation() or receivedNoteBackingBean.managedBean.buttonVal eq 'View' or !bpmTasklistBackingBean.managedBean.claim}"/>
			</p:column>
		</p:dataTable>
		<p:spacer height="20" />
		<table>
			<tr><td><b><h:outputText value="#{lbl['lbl.fl.frn.rating.scale']}" /></b></td></tr>
			<tr><td><h:outputText value="#{lbl['lbl.fl.frn.non.satifactory']}" /></td></tr>
			<tr><td><h:outputText value="#{lbl['lbl.fl.frn.satisfactory']}" /></td></tr>
			<tr><td><h:outputText value="#{lbl['lbl.fl.frn.very.satisfactory']}" /></td></tr>
		</table>
	</p:panel>
</ui:composition>
