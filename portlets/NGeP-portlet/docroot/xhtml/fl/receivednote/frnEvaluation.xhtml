<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right"><p:commandButton value="SAVE" />
					<p:commandButton value="ACKNOWLEDGE" /> <p:commandButton
						value="REJECT" /> <p:commandButton value="PRINT" /></td>
			</tr>
		</table>

		<p:panel header="SUPPLIER EVALUATION" toggleable="true">
			<br />
			<h:outputText value="Supplier Evaluation: " />
			<h:outputLink id="slide" value="#">
				<h:outputText value="?" />
			</h:outputLink>
			<br/>
			<br/>
			<p:tooltip for="slide"
				value="Rating Tips
						1 - 2 Non Satisfactory
						3 - 4 Satisfactory
						5      Very Satisfactory"
				showEffect="slide" hideEffect="slide" showEffectLength="1"
				hideEffectLength="1" />
			<table style="width: 400px;">
				<tr>
					<td colspan="2"><p:dataTable id="dataTable" var="sv" 
							paginator="false">
							<p:column style="width:200px" headerText="Criteria">
								<h:outputText  value="aaaaaaaaa"/>
							</p:column>
							<p:column style="width:150px" headerText="Score">
								<h:outputText  value="ssssssss"/>
							</p:column>
						</p:dataTable></td>
				</tr>
			</table>
			
		</p:panel>
</ui:composition>
