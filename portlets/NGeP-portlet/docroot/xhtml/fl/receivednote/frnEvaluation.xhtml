<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="SUPPLIER RATING" toggleable="true">
		<br />
		<table style="width: 100%">
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.txt.business.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 30px;"><p:inputText size="32"
									value="#{receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}"
									disabled="true" /></td>
							<td style="width: 109px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="23"
									value="#{receivedNoteBackingBean.retrieveMofNo(receivedNoteBackingBean.managedBean.fulfilmentRequest.smSupplier)}"
									disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="85"
						value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
		</table>
		<p:dataTable id="suppEvalutionDt" var="suppEvalution" rowKey="#{suppEvalution}"
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flSupplierEvaluation}">
			<ac:paginator for="suppEvalutionDt" />
			<p:column>
				<f:facet name="header">
	                <h:outputText value="Criteria" />
	            </f:facet>
				<h:outputText value="#{receivedNoteBackingBean.getCriteriaDesc(suppEvalution.pmCriteria)}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<p:outputLabel value="*" styleClass="mandatory" style="float : left" />
					<h:outputText value="Score" />
				</f:facet>
				<p:inputText validatorMessage="Maximum score is 5" 
				 value="#{suppEvalution.score}" style="text-align:right" maxlength="1"  id="score" label="Score" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks()}">
				<p:ajax update="score" listener="#{receivedNoteBackingBean.checkScore(suppEvalution)}"></p:ajax>
				</p:inputText>
				<p:message for="score" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Remarks" />
				</f:facet>
				<p:inputText value="#{suppEvalution.remark}" maxlength="255" style="width:450px" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks()}"/>
			</p:column>
		</p:dataTable>
		<p:spacer height="20" />
		<table>
			<tr><td><b>Rating Scale</b></td></tr>
			<tr><td>1 - 2 Non Satisfactory</td></tr>
			<tr><td>3 - 4 Satisfactory</td></tr>
			<tr><td>5     Very Satisfactory</td></tr>
		</table>
	</p:panel>
</ui:composition>
