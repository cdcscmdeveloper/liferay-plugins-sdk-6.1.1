<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="SUPPLIER EVALUATION" toggleable="true">
			<br />
			<h:outputText value="Supplier Evaluation: " />
			<h:outputLink id="slide" value="#">
				<h:outputText value="?" />
			</h:outputLink>
			<br/>
			<br/>
			<p:tooltip for="slide"
				value="Rating Tips
						1 - 2 Non Satisfactory
						3 - 4 Satisfactory
						5      Very Satisfactory"
				showEffect="slide" hideEffect="slide" showEffectLength="1"
				hideEffectLength="1" />
			<table style="width: 400px;">
			<tr>
			<th>Criteria</th>
			<th>Score</th>
			</tr>
			<tr>
			<td><h:outputText  value="Delivery service"/></td>
			<td><p:inputText  /></td>
			</tr>
			<tr>
			<td><h:outputText  value="Quality"/></td>
			<td><p:inputText  /></td>
			</tr>
			<tr>
			<td><h:outputText  value="Score"/></td>
			<td><p:inputText  /></td>
			</tr>
				
			</table>
			
			
		</p:panel>
</ui:composition>
