<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true">
		<br />
		<p:dataTable id="frnItemDt" var="item" width="100%"
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNoteItem}">
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Type">
				<h:outputText
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'PR'}" />
				<h:outputText
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Item Code">
				<h:outputText
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.requestNoteItemId}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'PR'}" />
				<h:outputText
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Item Name">
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemName}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'PR'}" />
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.qtItem.itemName}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<h:outputText
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#,###.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Qty.">
				<h:outputText
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty}" />
			</p:column>
			<p:column headerText="Delivered Qty.">
				<h:outputText value="#{item.flDelOrderItem.deliveredQty}" />
			</p:column>
			<p:column headerText="Received Qty.">
				<p:inputText value="#{item.receivedQty}"
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P'}">
				</p:inputText>
				<h:outputText
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S'}"
					value="#{item.receivedQty}" />
			</p:column>
			<p:column headerText="Ordered Amt.(RM)">
				<h:outputText
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedAmt}">
					<f:convertNumber pattern="#,###.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Delivered Amt.(RM)">
				<h:panelGroup id="delAmountTxt">
					<p:inputText value="#{item.flDelOrderItem.deliveredAmt}"
						rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P'}">
						<f:convertNumber pattern="#,###.00" />
					</p:inputText>
					<h:outputText
						rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S'}"
						value="#{item.flDelOrderItem.deliveredAmt}">
						<f:convertNumber pattern="#,###.00" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="Received Amt.(RM)">
				<p:inputText
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S'}"
					value="#{item.receivedAmt}">
					<f:convertNumber pattern="#,###.00" />
				</p:inputText>
				<h:outputText
					value="#{item.receivedAmt}"
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P'}">
					<f:convertNumber pattern="#,###.00" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
