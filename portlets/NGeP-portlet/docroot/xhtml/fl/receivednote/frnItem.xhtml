<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/fl/shared/sidemenu/flFrnSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right"><p:commandButton value="SAVE" />
					<p:commandButton value="ACKNOWLEDGE" /> <p:commandButton
						value="REJECT" /> <p:commandButton value="PRINT" /></td>
			</tr>
		</table>
		<p:panel header="ITEM DETAIL" toggleable="true">

			<br />

			<p:dataTable id="itemDataTable" var="item" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" headerText="Product Code" />
						<p:column rowspan="2" headerText="Item Name" />
						<p:column colspan="4" headerText="Unit Price" />
						<p:column rowspan="2" headerText="Unit Price (MYR" />
						<p:column colspan="2" headerText="* Delivery" />
					</p:row>
					<p:row>
						<p:column headerText="(MYR)" />
						<p:column headerText="Ord." />
						<p:column headerText="Recv." />
						<p:column headerText="Del." />
						<p:column headerText="Quantity" />
						<p:column headerText="Amount (MYR)" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
			</p:dataTable>
			<br />
			<br />
			<table>
				<tr>
					<td><p:outputLabel value="Product Code" /></td>
					<td><p:inputText style="width: 140px;" value="200003"
							disabled="true" /></td>
					<td><p:outputLabel value="Unit Price" /></td>
					<td><p:inputText style="width: 140px;" value="0.50"
							disabled="true" /></td>
					<td><p:outputLabel value="Ordered Amt. (MYR)" /></td>
					<td><p:inputText style="width: 140px;" value="100.00"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Item Name" /></td>
					<td><p:inputText style="width: 140px;" value="Blue Pen"
							disabled="true" /></td>
					<td><p:outputLabel value="Ordered Qty" /></td>
					<td><p:inputText style="width: 140px;" value="200"
							disabled="true" /></td>
					<td><p:outputLabel value="* Delivery Amt. (MYR)" /></td>
					<td><p:inputText style="width: 140px;" value="25.00"
							disabled="true" /></td>

				</tr>
				<tr>
					<td colspan="1"></td>
					<td colspan="1"></td>
					<td><p:outputLabel value="Received Qty." /></td>
					<td><p:inputText style="width: 140px;" value="100"
							disabled="true" /></td>
				</tr>
				<tr>
					<td colspan="1"></td>
					<td colspan="1"></td>
					<td><p:outputLabel value="* Delivery Qty." /></td>
					<td><p:inputText style="width: 140px;" value="50" /></td>
				</tr>
			</table>
			<table>
				<tr>
					<td><p:outputLabel value="* Remarks" /></td>
					<td><p:inputTextarea rows="8" style="width: 260px;"  disabled="true"/></td>
				</tr>
			</table>
			<table style="width: 800px;">
				<tr>
					<td colspan="4" align="right"><p:commandButton type="button"
							icon="ui-icon-circle-triangle-w" /> <p:commandButton
							type="button" icon="ui-icon-circle-triangle-e" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
