<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEMS" toggleable="true" id="itemPnl">
		<br />
		<p:dataTable id="frnItemDt" var="item" width="100%"
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flFulfilmentNoteItem}"
			selection="#{receivedNoteBackingBean.managedBean.selectedItem}"
			rowIndexVar="index" selectionMode="single" rowKey="#{item}" >
			<p:ajax event="rowSelect" update=":form:selectedItemSection" />
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Item Code">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.cmItem.extensionCode}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemName}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="Unit Price &lt;br /&gt;(MYR)" style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedAmt}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>			
			<p:column headerText="Delivered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredQty}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Delivered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:panelGroup id="delAmountTxt">
					<h:outputText  styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
				<p:inputText id="receivedQty" styleClass="colFloatRight" value="#{item.receivedQty}" size="8" maxlength="14" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks()}"
					rendered="#{item.flItem.itemType.parameterCode eq ParameterConst.itemTypeProduct}">
					<p:ajax update="receivedAmt,receivedQty" listener="#{receivedNoteBackingBean.retrieveReceivedAmt(item)}"></p:ajax>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</p:inputText>
				<h:outputText
					rendered="#{item.flItem.itemType.parameterCode eq ParameterConst.itemTypeService}"
					value="#{item.receivedQty}" styleClass="colFloatRight">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<p:inputText styleClass="colFloatRight"
					rendered="#{item.flItem.itemType.parameterCode eq ParameterConst.itemTypeService}" value="#{item.receivedAmt}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<h:outputText id="receivedAmt" value="#{item.receivedAmt}" styleClass="colFloatRight"
					rendered="#{item.flItem.itemType.parameterCode eq ParameterConst.itemTypeProduct}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="50"/>
		<h:panelGroup styleClass="selectedItemSection" id="selectedItemSection">
			<table>
				<tr>
					<td valign="top"><p:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
					<td>
						<p:inputTextarea cols="40" maxlength="200" value="#{receivedNoteBackingBean.managedBean.selectedItem.rejectionRemark}" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks()}">
							<p:ajax process="@this" />
						</p:inputTextarea>
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
</ui:composition>
