<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
	<p:panel header="#{lbl['lbl.fl.menu.items']}" toggleable="true" id="itemPnl">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.frn.item']}" escape="false"/>
		<br />
	<div id="flDataTableScroll">	
	<p:dataTable id="frnItemDt" var="item" 
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flFulfilmentNoteItem}"	
			selection="#{receivedNoteBackingBean.managedBean.selectedItem}"
			rowIndexVar="index" selectionMode="single" rowKey="#{item}" >
			<p:ajax event="rowSelect" update=":form:selectedItemSection" />
			<ac:paginator for="itemDataTable" />
         <p:columnGroup type="header">
			<p:row>
				<p:column rowspan="3">
					<f:facet name="header" >
	    				<h:outputText value="#{lbl['lbl.fl.item.code']}"/>
	     				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
	    			</f:facet>
    			</p:column>		
				<p:column rowspan="3" headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;"/>
				<p:column rowspan="3" headerText="#{lbl['lbl.fl.uom']}" style="text-align:center;"/>
				<p:column rowspan="3" headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:center;"/>
				<p:column rowspan="3" headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:center;"/>
				<p:column rowspan="3" headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:center;"/>
                <p:column colspan="2" headerText="#{lbl['lbl.fl.ordered']}"  style="white-space:normal;text-align:center;"/>
                <p:column colspan="2" headerText="#{lbl['lbl.fl.delivery']}"  style="white-space:normal;text-align:center;"/>	
                <p:column rowspan="3">
					<f:facet name="header" >
    					<h:outputText value="#{lbl['lbl.fl.frn.remaining.qty']}" style="white-space:normal;text-align:center;"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.remain.qty']}"/>
    				</f:facet>
    			</p:column>
                <p:column colspan="2" headerText="#{lbl['lbl.fl.total.received']}" style="white-space:normal;text-align:center;"/>
                <p:column colspan="2" headerText="#{lbl['lbl.fl.received']}" style="white-space:normal;text-align:center;"/>
            </p:row>
            <p:row>
                <p:column style="white-space:normal;text-align:center;">
                	<f:facet name="header" >
    				 	<h:outputText value="#{lbl['lbl.fl.qty']}" style="white-space:normal;text-align:left;"/>
    				 		<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.order.qty']}"/>
    				</f:facet>
    			</p:column>	
                <p:column headerText="#{lbl['lbl.fl.amount']}" />
                <p:column style="white-space:normal;text-align:center;">
                	<f:facet name="header" >
    				 	<h:outputText value="#{lbl['lbl.fl.qty']}" style="text-align:center"/>
     						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.del.qty']}" style="white-space:normal;text-align:center;"/>	
    				</f:facet>
    			</p:column>	
                <p:column headerText="#{lbl['lbl.fl.amount']}" style="text-align:center"/>
               <p:column >
                	<f:facet name="header" >
    				 	<h:outputText value="#{lbl['lbl.fl.qty']}" style="white-space:normal;text-align:center;"/>
     						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.total.received.qty']}"/>
    				</f:facet>
    			</p:column>	
                <p:column headerText="#{lbl['lbl.fl.amount']}" style="text-align:center"/>
                 <p:column >
                	<f:facet name="header" >
    				 	<h:outputText value="#{lbl['lbl.fl.qty']}" style="text-align:center"/>
     						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
    			</p:column>	
                <p:column headerText="#{lbl['lbl.fl.amount']}" style="text-align:center"/>
            </p:row>
          </p:columnGroup>    
             <p:column>
            	<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.itemCode}" />
        	</p:column>
        	<p:column style="white-space:normal;">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemName}" id="itemDesc"/>
				<p:tooltip for="itemDesc" value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemDesc}"  />
			</p:column>
			<p:column >
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.gstAmount}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.gstUnitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column >
			<p:column style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedAmt}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column  style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredQty}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<h:panelGroup id="delAmountTxt">
					<h:outputText  styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>	
			<p:column>
				<h:outputText id="remaingQtyTxt" styleClass="colFloatRight" rendered="#{receivedNoteBackingBean.managedBean.isAcknowledged() eq 'false'}"  value="#{receivedNoteBackingBean.getRemainingQuantity(item)}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
				<h:outputText  styleClass="colFloatRight" 
					rendered="#{receivedNoteBackingBean.managedBean.isAcknowledged() eq 'true'}" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty-item.receivedQty}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<h:outputText
					value="#{item.totalRecvQty}" styleClass="colFloatRight">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column  headerText="#{lbl['lbl.fl.received.amount']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{item.totalRecvAmount}" styleClass="colFloatRight">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.received.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
				<p:inputText id="receivedQty" label="#{lbl['lbl.fl.received.qty']}" style="text-align:right;" styleClass="colFloatRight" value="#{item.receivedQty}" size="8" maxlength="14" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks()}"
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.itemType.parameterCode eq ParameterConst.itemTypeProduct}">
					<p:ajax event="blur" update="receivedAmt,receivedQty,remaingQtyTxt" process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" listener="#{receivedNoteBackingBean.retrieveReceivedAmt(item)}"/>
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</p:inputText>
				<h:outputText
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.itemType.parameterCode eq ParameterConst.itemTypeService}"
					value="#{item.receivedQty}" styleClass="colFloatRight">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column  style="white-space:normal;text-align:right;">
				<f:facet name="header">
							<h:outputText value="#{lbl['lbl.fl.received.amount']}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.del.amt']}" />
						</f:facet>
				<p:inputText style="text-align:right;" styleClass="colFloatRight" id="receivedAmtVal" label="#{lbl['lbl.fl.received.amount']}" 
					disabled="#{receivedNoteBackingBean.managedBean.buttonVal=='Cancel' or  receivedNoteBackingBean.managedBean.buttonVal=='View'}"
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.itemType.parameterCode eq ParameterConst.itemTypeService}" value="#{item.receivedAmt}">
					<p:ajax update="receivedAmtVal" listener="#{receivedNoteBackingBean.receivedAmtValidation(item)}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<h:outputText id="receivedAmt" value="#{item.receivedAmt}" styleClass="colFloatRight"
					disabled="#{receivedNoteBackingBean.managedBean.buttonVal=='View'}"
					rendered="#{item.flDelOrderItem.flFulfilmentItemAddr.itemType.parameterCode eq ParameterConst.itemTypeProduct}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>	
       
		</p:dataTable>
		</div>
		<p:spacer height="50"/>
		<h:panelGroup styleClass="selectedItemSection" id="selectedItemSection">
			<table>
				<tr>
					<td valign="top"><p:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
					<td>
						<p:inputTextarea cols="40" maxlength="200" value="#{receivedNoteBackingBean.managedBean.selectedItem.rejectionRemark}" disabled="#{receivedNoteBackingBean.managedBean.isDocMaintainRemarks()}">
							<p:ajax process="@this" />
						</p:inputTextarea><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.frn.item.remarks']}"/>
					</td>
				</tr>
			</table>
		</h:panelGroup>	
	</p:panel>	
</ui:composition>
