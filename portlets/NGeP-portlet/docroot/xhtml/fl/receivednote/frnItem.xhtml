<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEMS" toggleable="true" id="itemPnl">
		<br />
		<p:dataTable id="frnItemDt" var="item" width="100%"
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flFulfilmentNoteItem}"
			selection="#{receivedNoteBackingBean.managedBean.selectedItem}"
			rowIndexVar="index" selectionMode="single" rowKey="#{item}"
			lazy="true">
			<p:ajax event="rowSelect" update=":form:selectedItemSection" />
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Item Code">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.cmItem.extensionCode}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;">
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemName}" />
			</p:column>

			<p:column headerText="UOM" style="text-align:right">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomName}">
				</h:outputText>
			</p:column>
			<p:column headerText="Unit Price &lt;br /&gt;(MYR)" style="text-align:right">
				<h:outputText styleClass="colFloatRight"
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Delivered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredQty}" />
			</p:column>
			<p:column headerText="Delivered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:panelGroup id="delAmountTxt">
					<h:outputText  styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredAmt}">
						<f:convertNumber pattern="#,#00.00" />
					</h:outputText>
					<p:inputText styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredAmt}"
						rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}">
						<f:convertNumber pattern="#,#00.00" />
					</p:inputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
				<p:inputText styleClass="colFloatRight" value="#{item.receivedQty}"
					rendered="#{receivedNoteBackingBean.getParameterDesc(item.flItem.itemType) eq 'Product' and receivedNoteBackingBean.managedBean.docType eq 'PR'}">
					<p:ajax update="receivedAmt"
						listener="#{receivedNoteBackingBean.retrieveReceivedAmt(item)}"></p:ajax>
				</p:inputText>
				<h:outputText
					rendered="#{receivedNoteBackingBean.getParameterDesc(item.flItem.itemType) eq 'Service' and receivedNoteBackingBean.managedBean.docType eq 'PR'}"
					value="#{item.receivedQty}" styleClass="colFloatRight"/>
				<p:inputText value="#{item.receivedQty}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<p:inputText styleClass="colFloatRight"
					rendered="#{receivedNoteBackingBean.getParameterDesc(item.flItem.itemType) eq 'Service'}"
					value="#{item.receivedAmt}">
					<f:convertNumber pattern="#,#00.00" />
				</p:inputText>
				<h:outputText id="receivedAmt" value="#{item.receivedAmt}" styleClass="colFloatRight"
					rendered="#{receivedNoteBackingBean.getParameterDesc(item.flItem.itemType) eq 'Product'}">
					<f:convertNumber pattern="#,##0.00" />
				</h:outputText>
				<h:outputText value="#{item.receivedAmt}" styleClass="colFloatRight"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}">
					<f:convertNumber pattern="#,#00.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Qty." style="text-align:right">
				<h:outputText styleClass="colFloatRight"
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty}" />
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText styleClass="colFloatRight"
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedAmt}">
					<f:convertNumber pattern="#,#00.00" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="50"/>
		<h:panelGroup styleClass="selectedItemSection"
			id="selectedItemSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.txt.remarks']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputTextarea cols="40"
							value="#{receivedNoteBackingBean.managedBean.selectedItem.rejectionRemark}" />
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
</ui:composition>
