<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true">
		<br />
		<p:dataTable id="frnItemDt" width="100%"
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNoteItem}"
			var="item">
			<ac:paginator for="frnItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="Item Name" />
					<p:column rowspan="2" headerText="Ord. Qty" />
					<p:column rowspan="2" headerText="Recv. Qty" />
					<p:column rowspan="2" headerText="Del. Qty" />
					<p:column rowspan="2" headerText="Unit Price (MYR)" />
					<p:column colspan="2" headerText="* Delivery" />
				</p:row>
				<p:row>
					<p:column headerText="Quantity" />
					<p:column headerText="Amount (MYR)" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestNote.scRequestList.requestItems[0].itemName}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'PR'}" />
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.flFulfilmentItem.qtItem.itemName}"
					rendered="#{receivedNoteBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>


			<p:column>
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.receivedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flDelOrderItem.deliveredQty}" />
			</p:column>
			<p:column>
				<p:outputLabel
					value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}" />
			</p:column>
			<p:column>
				<p:inputText value="#{item.receivedQty}" />
			</p:column>
			<p:column>
				<p:inputText value="#{item.receivedAmt}" />
			</p:column>
		</p:dataTable>
		<br />
		<br />

		<table>
			<tr>
				<td valign="top"><p:outputLabel value="* Remarks" /></td>
				<td><p:inputTextarea cols="36" disabled="true" /></td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
