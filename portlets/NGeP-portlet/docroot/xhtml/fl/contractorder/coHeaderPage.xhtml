<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 99%; margin-left: 25px;">
		<tr style="margin-button: 10px;">
			<td><h6>
					<h:outputText value="#{lbl['lbl.fl.rev.hed.document.type']} :" />
				</h6></td>
			<td>
				<h6>
					<h:outputText
						value="#{purchaseRequestBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, purchaseRequestBackingBean.managedBean.fulfilmentRequest.docType)}" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText value="#{lbl['lbl.fl.rev.hed.document.no']} :" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.docNo}" />
				</h6>

			</td>
		</tr>
		<tr>
			<td>
				<h6>
					<h:outputText value="#{lbl['lbl.fl.rev.hed.prepared.by']} :" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText value="#{purchaseRequestBackingBean.managedBean.pmUserOrg.pmUser.userName}" />
				</h6>
			</td>

			<td>
				<h6>
					<h:outputText value="#{lbl['lbl.fl.rev.hed.current.status']} :" />
				</h6>
			</td>
			<td>
				<h6>
					<h:outputText value="Pending Submission"
						rendered="#{purchaseRequestBackingBean.managedBean.docStatusId ==0}" />
					<h:outputText
						value="#{purchaseRequestBackingBean.getStatusDescById(purchaseRequestBackingBean.managedBean.docStatusId)}" />
				</h6>
			</td>
		</tr>
	</table>
</ui:composition>
