<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.fl.rev.hed.contract.request.no']} " /></td>
				<td class="header-info-text">
					#{flOrderBB.managedBean.flRequest.ctContract.contractNo}</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.rev.hed.contract.ord.no']} " /></td>
				<td class="header-info-text">
					#{flOrderBB.managedBean.fulfilmentOrder.docNo}</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.rev.hed.contract.ptj.name']} " /></td>
				<td class="header-info-text">
					#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.rev.hed.contract.status']} " /></td>
				<td class="header-info-text">
					#{flOrderBB.getStatusDescById(flOrderBB.managedBean.fulfilmentOrder.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
	<p:spacer height="10px" />
</ui:composition>
