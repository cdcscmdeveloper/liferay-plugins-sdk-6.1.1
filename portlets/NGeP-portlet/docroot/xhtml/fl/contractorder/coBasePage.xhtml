<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction" value="#{flOrderBB.managedBean.actions}">
						<p:commandButton value="#{bpmAction}" ajax='false'
							action="#{flOrderBB.fulfillmentOrderAction(bpmAction)}"/>
					</ui:repeat></td>
			</tr>
		</table>
		<p:tabView id="cotabs" orientation="left" widgetVar="tt">
			<p:tab title="#{lbl['lbl.tab.fl.general']}">
				<ui:include src="coGeneral.xhtml" />
			</p:tab>
			<p:tab title="#{lbl['lbl.tab.fl.item']}">
				<ui:include src="coItem.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
