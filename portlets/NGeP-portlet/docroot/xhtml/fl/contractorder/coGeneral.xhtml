<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%;">
		<tr>
			<c:if test='#{flOrderBB.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right"><p:commandButton
						value="#{lbl['lbl.update']}"
						action="#{flOrderBB.fulfillmentOrderAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{flOrderBB.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right"><p:commandButton
						value="#{lbl['lbl.cancel']}"
						action="#{flOrderBB.fulfillmentOrderAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>

	<p:panel header="AGENCY DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" id="ministry"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="5" id="preparedOrgProfileId" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" id="issuedOrgProfileId" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText id="chargedPtj" size="39"
						disabled="true" value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeCode}"/> <p:spacer
						width="5" /> <p:inputText size="39" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeName}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4" id="title"
						disabled="true" style=" margin-bottom:5px;"
						value="#{flOrderBB.managedBean.flRequest.title}" /> <h:outputText
						value="" /></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20" disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.financialYear}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="20" disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><p:inputText size="12" disabled="true" style="text-align:right"
						value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTerm}"
						rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing eq false}" />
					<p:spacer width="5" /> <p:inputText size="2"
						value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTermUom)}"
						disabled="true"
						rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing eq false}" />
					<p:inputText size="12" disabled="true"
						value=""
						rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing}" />
					<p:spacer width="5" /> <p:inputText size="2" value="" disabled="true" rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing}"/>
					<p:spacer width="5" /> <h:outputText
						value="#{lbl['lbl.fl.zonal']}" /> <p:selectBooleanCheckbox
						value="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.approver.date']}" /></td>
				<td><p:inputText size="20" disabled="true"
					value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.approvedDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.start.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button" disabled="true" readonlyInput="true"
						value="#{flOrderBB.managedBean.flRequest.startDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{flOrderBB.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.cr.mto']}" /></td>
				<td><p:selectBooleanCheckbox
						value="#{flOrderBB.managedBean.flRequest.ctContract.mto}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.end.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button" disabled="true" readonlyInput="true" id="delEndDate"
						value="#{flOrderBB.managedBean.flRequest.endDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.cr.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
						value="#{flOrderBB.managedBean.flRequest.ctContract.factored}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.ctContract.smSupplier.regNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="20" disabled="true" 
							value="#{flOrderBB.retrieveMofNo(flOrderBB.managedBean.flRequest.smSupplier)}"/></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierBranch}"
						/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true" 
				value="#{contractRequestBackingBean.getFullAddress(contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.smAddress)}"
						style=" margin-bottom:5px;"
						 /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierPhoneNo}"
									/></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="20" disabled="true" value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierFaxNo}"
									/></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierContact}"
						 /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierEmail}"
						 /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="15" value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierFaxNo}"
						 /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FACTORING DETAILS" toggleable="true" rendered="#{flOrderBB.managedBean.flRequest.ctContract.factored}">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true" value="" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
