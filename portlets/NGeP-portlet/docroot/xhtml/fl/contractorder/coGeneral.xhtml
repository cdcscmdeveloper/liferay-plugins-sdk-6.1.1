<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.fl.agency.details']}" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="65" id="ministry"
						value="#{flOrderBB.retrieveMinistryByOrgProfileId(flOrderBB.managedBean.flRequest.issuedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td><p:inputText size="65" id="controlOff"
						value="#{flOrderBB.retrievePegawaiPengawalByOrgProfileId(flOrderBB.managedBean.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="65" id="ptjGroup"
						value="#{flOrderBB.retrieveJabatanByOrgProfileId(flOrderBB.managedBean.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:483px;" 
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.pmOrgValidity.orgCode} #{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.prepared.for.ptj']}"/></td>
						
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:483px;" 
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.pmOrgValidity.orgCode} #{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:483px;" 
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.pmOrgValidity.orgCode} #{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="8" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeCode}"/> <p:spacer
						width="5" /> <p:inputText size="50" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeName}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.acc.office']}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4" id="title"
						disabled="true" style=" margin-bottom:5px;" autoResize="false"
						value="#{flOrderBB.managedBean.flRequest.title}" /> <h:outputText
						value="" /></td>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.match.mto']}" rendered="false" /></td>
				<td><p:selectBooleanCheckbox rendered="false"
						value="#{flOrderBB.managedBean.flRequest.ctContract.mto}"
						disabled="true" /><!-- <ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.mto']}"/> --></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.factored.contract']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.factored}" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.factored']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="30" disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.getParameterDesc(flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.procurementTypeCategory)}" /></td>
			</tr>
			<tr>
				<td style="width: 142px;"><p:outputLabel rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"
						value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><table style="width: 80%">
						<tr>
							<td style="width:100px;">
								<p:inputText size="12" style="text-align:right;"
									disabled="true" rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"
									value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTerm}" />
							</td>
							<ui:remove>
							<td style="width: 211px;"><p:outputLabel styleClass="outputLabel-view" rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"
									value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTermUom)}" /></td>
						    </ui:remove>			
						</tr>
					</table></td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.approved.date']}" /></td>
				<td>	
				<p:inputText size="25" disabled="true"
					value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.agApprovedDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.approver.date']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.start']}" rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"/></td>
				<td><p:calendar mode="popup" showOn="button" disabled="true" readonlyInput="true"
						value="#{flOrderBB.managedBean.flRequest.startDate}"
						rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{flOrderBB.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.zonal.price']}"  /></td>
				<td><p:selectBooleanCheckbox style="vertical-align:-4px"
						value="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing}"
						disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.zonal.price']}" />
				</td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.end']}" rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"/></td>
				<td><p:calendar mode="popup" showOn="button" disabled="true" readonlyInput="true" id="delEndDate"
						value="#{flOrderBB.managedBean.flRequest.endDate}"
						rendered="#{flOrderBB.managedBean.flRequest.ctContract.zonalPricing =='false'}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" rendered="false"/></td>
				<td><p:inputText size="20" disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.financialYear}" rendered="false"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" rendered="false"/></td>
				<td><p:inputText size="20" disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.createdDate}" rendered="false">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 175px;"><p:inputText size="15"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.ctContract.smSupplier.regNo}" />
							<ac:iconTooltip
									value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}" /></td>
							<td style="width: 62px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.mofNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width: 277px;"><p:inputText size="15"
						disabled="true"
						value="#{flOrderBB.managedBean.flRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.smSupplier.epNo}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.gstRegNo}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.gstDeclaredDate ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.gstEffectiveDate ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.gstEffectiveDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50"
					value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.branchName}">
				</p:inputText></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"  autoResize="false"
				value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress)}"
						style=" margin-bottom:5px;"
						 /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.phoneNoFull}"
									/></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="20" disabled="true" value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.faxNoFull}"
									/></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactPerson}"
						 /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactEmail}"
						 /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="15" value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactPhoneNoFull}"
						 /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.factoring.details']}" toggleable="true" rendered="#{flOrderBB.managedBean.fulfilmentOrder.factored}">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.fulfilmentOrder.factoringOrgName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;" autoResize="false"
						value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.fulfilmentOrder.factoringAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.phoneNoFull}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.faxNoFull}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactPerson}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactEmail}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="25" value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactPhoneNoFull}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
