<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">	

	<table>
		<tr>
			<c:if
				test='#{flOrderBB.managedBean.buttonVal eq "Update"}'>
				<td colspan="4">
					<div align="right">
						<p:commandButton value="#{lbl['lbl.update']}"
							action="#{flOrderBB.fulfillmentOrderAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton>
					</div>
				</td>
			</c:if>
			<c:if
				test='#{flOrderBB.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" align="right"><div align="right">
						<p:commandButton value="#{lbl['lbl.cancel']}"
							action="#{flOrderBB.fulfillmentOrderAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton>
					</div></td>
			</c:if>
		</tr>
	</table>

	<p:panel header="#{lbl['lbl.fl.fulfilment.detail']}" toggleable="true" id="flDetails">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText style="width: 240px;"
						value="#{flOrderBB.managedBean.flRequest.createdOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.request.no']}" /></td>
				<td><p:inputText disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="* #{lbl['lbl.fl.contract.request.no']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.mto']}" /></td>
				<td>
						<p:selectOneRadio 
						value="#{flOrderBB.managedBean.flRequest.mto}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
						
						
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText 
						value="#{flOrderBB.managedBean.flRequest.ctContract.contractName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.div']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.receivedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText 
						value="#{flOrderBB.managedBean.flRequest.ctContract.contractTypeCode.code}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.receivedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.fulfilment.type']}" /></td>
				<td><p:inputText 
						value="#{flOrderBB.managedBean.flRequest.ctContract.fulfillmentTypeCode.code}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="4" valign="top"><p:outputLabel value="* #{lbl['lbl.fl.title']}"
						style="vertical-align:top;" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 240px; margin-bottom:5px;"
						value="#{flOrderBB.managedBean.flRequest.title}" disabled="true"/></td>
				<td><p:outputLabel value="Plan NO." /></td>
				<td><p:inputText 
						value="#{flOrderBB.managedBean.flRequest.planId}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.fs.no']}" /></td>
				<td><p:inputText disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText 
						value="#{flOrderBB.managedBean.flRequest.createdDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText style="width: 240px;"
						value="#{flOrderBB.managedBean.flRequest.pmDocStatus.statusId}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.financialYear}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value=" * #{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.maksudId}"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.orgProfileAgoId}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.orgProfileAgoId}"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
						value="#{flOrderBB.managedBean.flRequest.financingLoan}" /></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supplier.detail']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.id']}" /></td>
				<td><p:inputText style="width: 120px;"
						value="#{flOrderBB.managedBean.flRequest.ctContract.smSupplier.supplierId}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText style="width: 240px;" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea rows="8" style="width: 240px;margin-bottom:5px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText style="width: 240px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
