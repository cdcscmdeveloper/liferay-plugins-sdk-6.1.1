<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%;">
		<tr>
			<c:if test='#{flOrderBB.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right"><p:commandButton
						value="#{lbl['lbl.update']}"
						action="#{flOrderBB.fulfillmentOrderAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{flOrderBB.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right"><p:commandButton
						value="#{lbl['lbl.cancel']}"
						action="#{flOrderBB.fulfillmentOrderAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>

	<p:panel header="#{lbl['lbl.fl.fulfilment.detail']}" toggleable="true"
		id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width:125px;"><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText disabled="true" size="35" value="#{flOrderBB.managedBean.flRequest.docNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="* #{lbl['lbl.fl.contract.request.no']}" /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.mto']}" /></td>
				<td><p:selectOneRadio
						value="#{flOrderBB.managedBean.flRequest.mto}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.jabatan']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.receivedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.receivedOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.fulfilment.type']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.flRequest.ctContract.fulfillmentType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" style="vertical-align:top;" /></td>
				<td rowspan="2"><p:inputTextarea  cols="36"
						style=" margin-bottom:5px;"
						value="#{flOrderBB.managedBean.flRequest.title}" disabled="true" /></td>
				<td><p:outputLabel value="Plan No." /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.managedBean.flRequest.planId}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.fs.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value="#{flOrderBB.managedBean.flRequest.scheduleNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" * #{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:inputText
						value="#{flOrderBB.managedBean.flRequest.pmVotFund.maksudName}"
						disabled="true" size="20"></p:inputText></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.managedBean.flRequest.financialYear}"
						disabled="true"></p:inputText></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.agOffice.officeName}"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']}" /></td>
				<td><p:selectOneRadio
						value="#{flOrderBB.managedBean.flRequest.financingLoan}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText size="20"
						value="#{flOrderBB.managedBean.flRequest.createdDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText size="35"
						value=""
						disabled="true" /></td>
			</tr>

		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supplier.detail']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 125px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea  cols="36"
						style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
