		<!--  28377 -->
		<p:remoteCommand name="enableAckBtn" update="@form" />
			 <p:dialog id="uploadLetterAP" widgetVar="uploadLetterAP" resizable="false" modal="true" 
		    	  width="700px" height="350px" styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}" onShow="singleUploadListener(letterUploadWV);">
					<p:ajax event="close" />
					<p:fileUpload style="display:inline;" mode="advanced"  dragDropSupport="false" 
					      sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"  showButtons="false"  
					      fileUploadListener="#{flOrderBB.UploadApprovalLetterAP}" multiple="false"  
					      allowTypes="#{CommonConstants.FILE_UPLOAD_PDF_TYPE}"  widgetVar="letterUploadWV"
					      invalidFileMessage="#{lbl['lbl.txt.upload.pdf.file']}"					      
						  invalidSizeMessage="#{lbl['lbl.txt.upload.sizeExceed20Mb']}"
						  update=":form:uploadAP58AL"
					      label="#{lbl['lbl.btn.choose']}" oncomplete="uploadLetterAP.hide();" >
					</p:fileUpload>
					<f:facet name="footer">
							<div class="ppRightBtn">
			   					 <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="uploadLetterAP.hide();" />
	   						</div>
	   				</f:facet>
				</p:dialog>
				<p:confirmDialog id="deleteUploadLetterId" widgetVar="deleteUploadLetterAP" message="#{lbl['lbl.msg.confirm.delete']}" 	
                		  severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                  		 <div class="ppRightBtn">
		               			<p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this"  partialSubmit="true"
		                        		 action="#{flOrderBB.DeleteApprovalLetterAP}" update=":form:uploadAP58AL" 
		                       			  oncomplete="deleteUploadLetterAP.hide();"/>
			                	 <p:commandButton value="#{lbl['lbl.btn.no']}"  onclick="deleteUploadLetterAP.hide();" type="button" />
		                 </div>
                   </p:confirmDialog>
