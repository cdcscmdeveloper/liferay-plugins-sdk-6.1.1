<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.menu.order.summary']}" toggleable="true">
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange hide-column-names"
			value="#{flOrderBB.managedBean.flRequest.flDeliveryAddresses}">
			<ac:paginator for="delAddressSummary" />
			<p:ajax event="rowToggle" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;">
				<h:outputText value="#{flOrderBB.getFullAddress(delAddressSummary.flAddress)}" />
			</p:column>
			<p:column style="white-space:normal;" >
			<table style="width : 100%;" class="noBorder" >
			<tr>
			<td>
			<h:outputText value="#{lbl['lbl.fl.delivery.period']}" />
			</td>
			</tr>
			<tr>
			<td>
			<p:inputText size="4" style="width:75px; text-align:right;" disabled="true" value="#{delAddressSummary.deliveryTerm}"/>
				<ui:remove>
				<p:spacer width="2" />
				<p:inputText size="4" style="width:50px" disabled="true" value="#{flOrderBB.getParameterDesc(delAddressSummary.pmUom)}" />
				</ui:remove>
			</td>
			</tr>
			</table>
			</p:column>
			<p:column style="white-space:normal;">
			<table style="width : 100%;" class="noBorder">
			<tr>
			<td>
			<h:outputText value="#{lbl['lbl.fl.delivery.start']}" />
			</td>
			</tr>
			<tr>
			<td>
			<p:spacer width="7" />
				<p:inputText size="8" value="#{delAddressSummary.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</td>
			</tr>
			</table>
			</p:column>
			<p:column style="white-space:normal;">
			<table style="width : 100%;" class="noBorder">
			<tr>
			<td>
			<h:outputText value="#{lbl['lbl.fl.delivery.end']}" />
			</td>
			</tr>
			<tr>
			<td>
			<p:spacer width="7" />
				<p:inputText size="8" value="#{delAddressSummary.endDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</td>
			</tr>
			</table>
			</p:column>
			<p:rowExpansion>

				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}">
					<p:column style="text-align:center">
						<f:facet name="header" style="width:8%;">
							<h:outputText value="#{lbl['lbl.fl.item.code']}"/>
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}" />
						</f:facet>
						<h:outputText
							value="#{newItems.itemCode}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;width:20%">
						<h:outputText value="#{newItems.scRequestItem.itemName}" id="itemDesc" style="float:left;text-align:left;" title="#{newItems.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : newItems.scRequestItem.itemDesc}"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.uom']}">
						<h:outputText value="#{newItems.scRequestItem.uom.uomName}" style="float:left;"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:center;white-space:normal;">
						<h:outputText value="#{newItems.unitPrice}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="text-align:center;white-space:normal;">
						<h:outputText value="#{newItems.gstAmount}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="text-align:center;white-space:normal;">
						<h:outputText value="#{newItems.gstUnitPrice}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:center;">
						<h:outputText value="#{newItems.orderedQty}" style="float:right;">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:center">
						<h:outputText value="#{newItems.orderedAmt}" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
	</p:panel>
</ui:composition>
