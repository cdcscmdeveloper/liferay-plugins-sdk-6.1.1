<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="delAddrPanel" header="#{lbl['lbl.fl.del.addr']}" toggleable="true">

		<p:dataTable id="addressDataTable" var="address"
			value="#{flOrderBB.managedBean.flRequest.flDeliveryAddresses}"
			selection="#{flOrderBB.managedBean.selectedDelAddr}" rowKey="#{address}" lazy="true"
			selectionMode="single">
			<ac:paginator for="addressDataTable"/>
			<p:ajax event="rowSelect" update=":form:cotabs:itemDetPanel">
			</p:ajax>
			<p:column headerText="#{lbl['lbl.fl.del.addr']}">
				<h:outputText value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.exp.del.start']}">
				 <p:calendar disabled="true" value="#{address.startDate}" id="calStartDate" showOn="button" />  
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.exp.del.end']}">
				<p:calendar disabled="true" value="#{address.endDate}" id="calEndDate" showOn="button" />  
			</p:column>

		</p:dataTable>
	</p:panel>
	<p:panel id="itemDetPanel" header="ITEM DETAIL" toggleable="true">
		
		<p:dataTable id="itemDataTable" var="item" lazy="true"
			value="#{flOrderBB.managedBean.selectedDelAddr.flFulfilmentItemAddr}">
			<ac:paginator for="itemDataTable"/>
			
			<p:column headerText="Item Name">
				<h:outputText value="#{item.flFulfilmentItem.qtItem.itemName}" />
			</p:column>

			<p:column headerText="GOSODO">
			</p:column>

			<p:column headerText="Activity Code">
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<p:inputText disabled="true"></p:inputText>
			</p:column>
			<p:column headerText="Ord. Qty.">
				<p:inputText value="#{item.orderedQty}" disabled="true"/>
			</p:column>
			<p:column headerText="Sub Total">
				<p:inputText value="#{item.orderedQty * item.unitPrice}" disabled="true"/>
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
