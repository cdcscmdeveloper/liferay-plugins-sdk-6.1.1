<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange hide-column-names"
			value="#{flOrderBB.managedBean.flRequest.flDeliveryAddresses}">
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="Delivery Address" style="white-space:normal;">
				<h:outputText rendered="#{delAddressSummary.addressType != null}"
					value="#{delAddressSummary.addressType.pmAddress.address1}, #{delAddressSummary.addressType.pmAddress.address2}, #{delAddressSummary.addressType.pmAddress.address3}, #{delAddressSummary.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{delAddressSummary.addressType eq null}"
					value="#{delAddressSummary.pmAddress.address1}, #{delAddressSummary.pmAddress.address2}, #{delAddressSummary.pmAddress.address3}, #{delAddressSummary.pmAddress.address4}" />
			</p:column>
			<p:column>
				<p:spacer width="7" />
				<h:outputText value="Delivery Term" />
				<p:spacer width="7" />
				<p:inputText size="4" disabled="true" style="text-align:right;"
					value="#{delAddressSummary.deliveryTerm}" />
				<p:spacer width="7" />
				<h:inputText size="4" disabled="true"
					value="#{flOrderBB.getParameterDesc(delAddressSummary.pmUom)}" />
				<p:spacer width="7" />
				<h:outputText value="Delivery Start" />
				<p:spacer width="7" />
				<p:inputText size="9"
					value="#{delAddressSummary.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="7" />
				<h:outputText value="Delivery End" />
				<p:spacer width="7" />
				<p:inputText size="9"
					value="#{delAddressSummary.endDate}" disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:rowExpansion>

				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}">
					
					<p:column headerText="Item Code">
						<h:outputText
							value="#{newItems.cmItem.extensionCode}" />
					</p:column>
					<p:column headerText="Item Name">
						<h:outputText value="#{newItems.scRequestItem.itemName}" />
					</p:column>
					<p:column headerText="UOM">
						<h:outputText />
					</p:column>
					<p:column headerText="Unit Price (RM)" style="text-align:right">
						<h:outputText value="#{newItems.unitPrice}">
							<f:convertNumber pattern="#,#00.00" />
						</h:outputText>
					</p:column>
					<p:column headerText="Ordered Qty." style="text-align:right">
						<h:outputText value="#{newItems.orderedQty}" />
					</p:column>
					<p:column headerText="Ordered Amt.(RM)" style="text-align:right">
						<h:outputText value="#{newItems.orderedAmt}" />
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
	</p:panel>
</ui:composition>
