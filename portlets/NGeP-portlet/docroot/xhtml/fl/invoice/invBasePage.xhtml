<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<script>
			$('#portlet_flInvoice_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{invoiceBackingBean.getPortletTitle()}');
		</script>
		<f:event listener="#{invoiceBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="#{invoiceBackingBean.managedBean.autoUpdate}"
			showSummary="false" closable="true" severity="error, info, warn" />
		<ac:gpkiPopup 
			textBeforeSign="#{invoiceBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{invoiceBackingBean.preSubmitAction(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{invoiceBackingBean.enableAutoUpdate()}" />
		<ac:spkiPopup id="spkiPopUp"
			password="#{invoiceBackingBean.managedBean.spkiBackingBean.password}"
   		 	challengeAns1="#{invoiceBackingBean.managedBean.spkiBackingBean.challengeAns1}"
  		 	challengeQues1="#{invoiceBackingBean.managedBean.spkiBackingBean.challengeQues1}"
			postSignAction="#{invoiceBackingBean.preSubmitAction(spkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{invoiceBackingBean.enableAutoUpdate()}" />
		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						rendered="#{invoiceBackingBean.managedBean.taskId==null}"
						action="#{invoiceBackingBean.backToPervious}" /></td>
				<td colspan="4" style="text-align: right;">
				<ui:decorate template="/xhtml/fl/shared/claim_template.xhtml">
						<ui:define name="outComeSection">
							<ui:repeat var="bpmAction" value="#{invoiceBackingBean.managedBean.outComes}">
								<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
								<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{invoiceBackingBean.signingAction(bpmAction)}" />
							</ui:repeat>
						</ui:define>
					</ui:decorate></td>
			<h:panelGroup
					rendered="#{invoiceBackingBean.managedBean.buttonVal eq 'Update'}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.update']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{invoiceBackingBean.signingAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{invoiceBackingBean.managedBean.buttonVal eq 'Cancel'}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.cancel']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{invoiceBackingBean.signingAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</h:panelGroup>
				<c:if
					test='#{invoiceBackingBean.managedBean.buttonVal eq "View" and !invoiceBackingBean.managedBean.isHyperLinkPage()}'>
					<td colspan="4" style="text-align: right"><p:commandLink
							value="#{lbl['lbl.td.doc.trackingDiary']}"
							action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeInvoice,invoiceBackingBean.managedBean.invoice.invoiceId)}"
							immediate="true" /></td>
				</c:if>
				<h:panelGroup id="printButtonInv"
					rendered="#{invoiceBackingBean.managedBean.invoice.status.statusId != FulfilmentStatusCont.inPendingInvoice}">
					<td style="text-align: right; width: 30px;"><p:commandLink
							value="#{lbl['lbl.btn.print']}" ajax="false">
							<p:fileDownload
								value="#{flDocumentBackingBean.generateReport(ParameterConst.doctypeInvoice,invoiceBackingBean.managedBean.invoice.invoiceNo,invoiceBackingBean.managedBean.taxable)}" />
						</p:commandLink></td>
				</h:panelGroup>
			</tr>
		</table>
		<ui:include src="/xhtml/fl/invoice/invReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{invoiceBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.items']}" update="@form"
							actionListener="#{invoiceBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.invoice.summary']}" update="@form"
							actionListener="#{invoiceBackingBean.onTabChange(2)}">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>

					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="invGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="invItem.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="invSummary.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
