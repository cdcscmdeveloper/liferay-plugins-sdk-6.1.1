<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	
	<table style="width: 100%">
			<tr>
				<td colspan="4" style="text-align:right;">
				<ui:repeat var="bpmAction"
					value="#{invoiceBackingBean.managedBean.actions}">
					<p:commandButton value="#{bpmAction}" action="#{invoiceBackingBean.submitAction(bpmAction)}" process="@this"/>
				</ui:repeat> </td>
			</tr>
		</table>
		<p:tabView id="tt" orientation="left" widgetVar="tt">
			<p:tab title="GENERAL">
				<ui:include src="invGeneral.xhtml" />
			</p:tab>
			<p:tab title="ITEM">
			<ui:include src="invItem.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
