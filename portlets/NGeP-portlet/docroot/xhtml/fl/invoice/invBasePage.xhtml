<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<f:event listener="#{invoiceBackingBean.preRenderView}" type="preRenderView" />	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
	<ui:include src="/xhtml/fl/invoice/invHeaderPage.xhtml" />
	<table style="width: 100%">
			<tr>
				<td style="text-align: left; width: 66px;"><p:outputLabel
						value="DOC NO:" /></td>
				<td style="width: 70px"><p:outputLabel
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.docNo}" />
				</td>
				<td colspan="4" style="text-align:right;">
				<ui:repeat var="bpmAction"
					value="#{invoiceBackingBean.managedBean.outComes}">
					<p:commandButton value="#{bpmAction}" action="#{invoiceBackingBean.submitAction(bpmAction)}" process="@this" ajax="false"/>
				</ui:repeat> </td>
			</tr>
		</table>
		<p:tabView id="tt" orientation="left" widgetVar="tt">
			<p:tab title="GENERAL">
				<ui:include src="invGeneral.xhtml" />
			</p:tab>
			<p:tab title="ITEM">
			<ui:include src="invItem.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
