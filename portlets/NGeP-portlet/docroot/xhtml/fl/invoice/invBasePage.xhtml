<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<script>
			$('#portlet_flInvoice_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{invoiceBackingBean.getPortletTitle()}');
		</script>
		<f:event listener="#{invoiceBackingBean.preRenderView}"	type="preRenderView" />
		<h:panelGroup rendered="#{(invoiceBackingBean.managedBean.taxInvoice=='false' and (invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView or 
					  invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmUpdate or
					  invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmCancel or
					  invoiceBackingBean.managedBean.isHyperLinkPage()))}">
		<ac:title value="#{invoiceBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, ParameterConst.doctypeInvoice)}" />
		</h:panelGroup>
		<h:panelGroup rendered="#{(invoiceBackingBean.managedBean.taxInvoice=='true' and (invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView or 
					  invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmUpdate or
					  invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmCancel ))}">
		<ac:title value="#{lbl['lbl.fl.tax.invoice']}" />
		</h:panelGroup>
		
		<p:messages id="messages" showDetail="true" autoUpdate="#{invoiceBackingBean.managedBean.autoUpdate}"
			showSummary="false" closable="true" severity="error, info, warn" />
		<p:panel style="background:#f2dede !important; border:0px;" styleClass="gfmasPanelCss" rendered="#{invoiceBackingBean.managedBean.gfmasError}" >		
			<table>
				<tr>
					<td>
						<p:commandLink oncomplete="gfmasError.show();" immediate="true"
							action="#{invoiceBackingBean.show1GFMASError()}"
							rendered="#{invoiceBackingBean.managedBean.gfmasError}">
							<p:graphicImage value="/css/images/design/exclamation.png" />
						</p:commandLink>
						<p:spacer width="2" />
					</td>
					<td>
						<p:outputLabel value="#{invoiceBackingBean.managedBean.gfmasErrorDesc} #{lbl['lbl.fl.integration.click.for.exception.details']} (ERR-#{invoiceBackingBean.managedBean.gfmasErrorCode})" style="color: #C55751 !important; font-weight: normal !important"
							rendered="#{invoiceBackingBean.managedBean.gfmasError}" />
					</td>					
				</tr>
			</table>
		</p:panel>					
		<ac:gpkiPopup 
			textBeforeSign="#{invoiceBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{invoiceBackingBean.preSubmitAction(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{invoiceBackingBean.enableAutoUpdate()}" />
		<ac:spkiPopup id="spkiPopUp"
			password="#{invoiceBackingBean.managedBean.spkiBackingBean.password}"
   		 	challengeAns1="#{invoiceBackingBean.managedBean.spkiBackingBean.challengeAns1}"
  		 	challengeQues1="#{invoiceBackingBean.managedBean.spkiBackingBean.challengeQues1}"
			postSignAction="#{invoiceBackingBean.preSubmitAction(spkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{invoiceBackingBean.enableAutoUpdate()}" />
		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						rendered="#{invoiceBackingBean.managedBean.taskId==null}"
						action="#{invoiceBackingBean.backToPervious}" /></td>
				<td colspan="4" style="text-align: right;">
				<c:if test="#{invoiceBackingBean.managedBean.buttonVal ne BpmOutcomeConstant.bpmView}" >
				<ui:decorate template="/xhtml/fl/shared/claim_template.xhtml">
						<ui:define name="outComeSection">
							<ui:repeat var="bpmAction" value="#{invoiceBackingBean.managedBean.outComes}">
								<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
								<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{invoiceBackingBean.signingAction(bpmAction)}" />
							</ui:repeat>
						</ui:define>
					</ui:decorate>
					</c:if>
				</td>
			<h:panelGroup
					rendered="#{invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmUpdate}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.update']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{invoiceBackingBean.signingAction(BpmOutcomeConstant.bpmUpdate)}">
							<f:param name="actionName" value="#{BpmOutcomeConstant.bpmUpdate}" />
						</p:commandButton></td>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmCancel}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.cancel']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{invoiceBackingBean.signingAction(BpmOutcomeConstant.bpmCancel)}">
							<f:param name="actionName" value="#{BpmOutcomeConstant.bpmCancel}" />
						</p:commandButton></td>
				</h:panelGroup>
				<c:if
					test='#{invoiceBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView and !invoiceBackingBean.managedBean.isHyperLinkPage()}'>
					<td colspan="4" style="text-align: right"><p:commandLink
							value="#{lbl['lbl.td.doc.trackingDiary']}"
							action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeInvoice,invoiceBackingBean.managedBean.invoice.invoiceId)}"
							immediate="true" /></td>
				</c:if>
				<h:panelGroup id="printButtonInv"
					rendered="#{invoiceBackingBean.managedBean.invoice.status.statusId != FulfilmentStatusCont.inPendingInvoice}">
					<td style="text-align: right; width: 30px;"><p:commandLink
							value="#{lbl['lbl.btn.print']}" ajax="false">
							<p:fileDownload
								value="#{flDocumentBackingBean.generateReport(ParameterConst.doctypeInvoice,invoiceBackingBean.managedBean.invoice.invoiceNo,invoiceBackingBean.managedBean.taxable)}" />
						</p:commandLink></td>
				</h:panelGroup>
			</tr>
		</table>
		<ui:include src="/xhtml/fl/invoice/invReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{invoiceBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.items']}" update="@form"
							actionListener="#{invoiceBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.invoice.summary']}" update="@form"
							actionListener="#{invoiceBackingBean.onTabChange(2)}">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>

					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="invGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="invItem.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="invSummary.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
		<p:dialog id="gfmasErrorDlg" header="#{lbl['lbl.fl.integration.exception.details']}" widgetVar="gfmasError" width="80%"
			showEffect="fade" hideEffect="fade" modal="true" resizable="false">
			<table style="width: 100%">
				<tr>
					<td><p:messages id="gfmasMsg" showSummary="false" escape="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" /></td>
				</tr>
			</table>
			<p:spacer height="2px"></p:spacer>
			<div style="width: 100%; text-align: right">
				<p:commandButton value="#{lbl['lbl.btn.close']}" oncomplete="gfmasError.hide();" />
			</div>
		</p:dialog>			
	</ui:define>
</ui:composition>
