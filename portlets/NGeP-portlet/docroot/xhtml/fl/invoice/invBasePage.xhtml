<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<f:event listener="#{invoiceBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="Back" immediate="true" rendered="#{invoiceBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<td colspan="4" style="text-align: right;"><ui:repeat
						var="bpmAction" value="#{invoiceBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}"
							action="#{invoiceBackingBean.submitAction(bpmAction)}"
							process="@this" ajax="false" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 100%">
		<tr>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="UPDATE"
						action="#{invoiceBackingBean.submitAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="CANCEL"
						action="#{invoiceBackingBean.submitAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>
		<ui:include src="/xhtml/fl/invoice/invReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu styleClass="sidemenu"
						style="display : table-caption;"
						activeIndex="#{invoiceBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="Invoice Item" update="@form"
							actionListener="#{invoiceBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="Invoice Summary" update="@form"
							actionListener="#{invoiceBackingBean.onTabChange(2)}">
							<f:setPropertyActionListener
								target="#{invoiceBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
						
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="invGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="invItem.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{invoiceBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="invSummary.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
