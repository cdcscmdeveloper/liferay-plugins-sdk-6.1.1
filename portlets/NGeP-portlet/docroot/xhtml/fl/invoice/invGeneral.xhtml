<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table>
		<tr>
			<td><p:outputLabel value="For iteration1 - generate DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.dan}"><p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax> </p:selectBooleanCheckbox></td>
		</tr>
		<tr>
			<td><p:outputLabel value="For interation1 - update DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.updateDan}"><p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax> </p:selectBooleanCheckbox></td>
		</tr>
	</table>
	<table style="width: 800px;">
		<tr>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Update"}'>
				<td colspan="4">
					<div align="right">
						<p:commandButton value="UPDATE"
							action="#{invoiceBackingBean.submitAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton>
					</div>
				</td>
			</c:if>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" align="right"><div align="right">
						<p:commandButton value="CANCEL"
							action="#{invoiceBackingBean.submitAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton>
					</div></td>
			</c:if>
		</tr>
	</table>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td><p:inputText size="5" disabled="true" /></td>
							<td><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="15" disabled="true" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="Invoice NO." /></td>
				<td><p:inputText style="width: 120px;"
						value="- SYSTEM GENERATED - " disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
				<td><p:outputLabel value="Invoice Date" /></td>
				<td><p:inputText style="width: 120px;"
						value=" - SYSTEM DATE - " disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="4" valign="top"><p:outputLabel value="Address" /></td>
				<td rowspan="4"><p:inputTextarea rows="8"
						style="width: 260px; margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel value="Supplier Inv. NO." /></td>
				<td><p:inputText style="width: 120px;" value=" " /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Ori. Invoice Amt." /></td>
				<td><p:inputText style="width: 120px;" value="20,000.00"
						disabled="true" />MYR</td>
			</tr>
			<tr>
				<td><p:outputLabel value="New Invoice Amt." /></td>
				<td><p:inputText style="width: 120px;" value="18,500.00"
						disabled="true" />MYR</td>
			</tr>
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText style="width: 260px;" value="KBB.XY@gmail.com"
						disabled="true" /></td>
				<td><p:outputLabel value="Tel No." /></td>
				<td><p:inputText style="width: 120px;" value="02-7324800 "
						disabled="true" /></td>
			</tr>

		</table>
	</p:panel>
	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Ministry" /></td>
				<td><p:inputText style="width: 260px;"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
				<td><p:outputLabel value="Contract No." /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Jabatan" /></td>
				<td><p:inputText style="width: 260px;"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="Order No." /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Issued PTJ" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM (CHARGE PTJ)" disabled="true" /></td>
				<td><p:outputLabel value="Maksud Code" /></td>
				<td><p:inputText style="width: 260px;" value=" "
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Received PTJ" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" disabled="true" /></td>
				<td><p:outputLabel value="Charge Account" /></td>
				<td><p:inputText style="width: 120px;" value="0001010"
						disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="Title" /></td>
				<td><p:inputTextarea rows="8"
						style="width: 260px; margin-bottom:5px;" disabled="true" /></td>
			</tr>


		</table>

	</p:panel>

	<p:panel header="PAYMENT INSTRUCTION" toggleable="true">
		<p:panel header="Supplier / Factoring Company" />

		<table>
			<tr>
				<td><p:outputLabel value="Factored?" /></td>
				<td><p:selectOneRadio  value="No">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
				<td valign="top" rowspan="4"><p:outputLabel
						value="Bank Address" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Bank Code" /></td>
				<td><p:selectOneMenu style="width: 260px;margin-bottom:5px;">
						<f:selectItem itemLabel="Select One" itemValue="" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Account NO" /></td>
				<td><p:selectOneMenu style="width: 260px;">
						<f:selectItem itemLabel="Select One" itemValue="" />

					</p:selectOneMenu></td>
				<td></td>
				<td></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Pay Amt (MYR)" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
				<td></td>
				<td></td>
			</tr>
		</table>
		<br />
		<p:panel header="Commerce Dot Com" />
		<br />
		<br />
		<p:outputLabel value="Pay Amt (MYR)" />
		<p:inputText style="width: 260px;" disabled="true" />

	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
