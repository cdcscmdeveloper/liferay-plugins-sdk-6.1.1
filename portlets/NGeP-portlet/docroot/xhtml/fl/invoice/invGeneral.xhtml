<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table>
		<tr>
			<td><p:outputLabel
					value="For iteration1 - generate DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.dan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="For interation1 - update DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.updateDan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
	</table>
	<table style="width: 100%">
		<tr>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="UPDATE"
						action="#{invoiceBackingBean.submitAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="CANCEL"
						action="#{invoiceBackingBean.submitAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>
	<p:panel header="REQUEST DETAILS" toggleable="true">
		<table>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 140px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3" colspan="3"><p:inputTextarea cols="40" rows="3"
						style=" margin-bottom:5px;"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.title}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td colspan="3"><p:inputText size="5" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="34"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.preparedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.requisitioner']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.inv.contract.no']}" /></td>
				<td><p:commandLink value="ContractNo">
					</p:commandLink></td>
				<td><h:outputLabel value="#{lbl['lbl.fl.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"></p:selectBooleanCheckbox></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true" id="suppDetPnl">
		<table>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true" /></td>
						</tr>
					</table></td>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:selectOneMenu id="accountId" required="true" style="width:210px;margin-bottom: 5px;" label="#{lbl['lbl.fl.payment.bank.name']}"
                value="#{invoiceBackingBean.managedBean.invoice.accountNo}">
			     <f:selectItem itemLabel="-Select One-" itemValue="#{null}"/>
			     <f:selectItems value="#{invoiceBackingBean.populateBankAccountList}"/>
			     <p:ajax event="change" process="@this"  update="suppDetPnl"
			      listener="#{invoiceBackingBean.bankInfoActionListener}"/>
		   </p:selectOneMenu>
		   <p:message for="accountId" display="icon"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.supplierName}" /></td>
				<td style="width: 140px;"><p:outputLabel value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.paymentBank.finOrgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 137px;"><p:outputLabel
						value="Address" /></td>
				<td><p:inputTextarea rows="5" cols="45"
						style="margin-bottom:5px;" disabled="true"
						value="#{invoiceBackingBean.getFullAddress(invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="45"  disabled="true"
						value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
			<tr>
				<td style="width: 72px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.inv.no']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.invoice.supplierInvoiceRef}" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="FACTORING DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText size="45" disabled="true" /></td>
				<td style="width: 133px;"><p:outputLabel
						value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="45" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.factoring.branch']}" /></td>
				<td><p:inputText size="45" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:inputText size="45" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 137px;"><p:outputLabel
						value="Address" /></td>
				<td><p:inputTextarea cols="45" rows="5"
						style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactEmail}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
