<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="REQUEST DETAILS" toggleable="true">
		<table>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="2" valign="top" style="width: 165px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="2" colspan="3"><p:inputTextarea cols="40" rows="2"
						style=" margin-bottom:5px;"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.title}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td colspan="3"><p:inputText size="5" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="32"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.requisitioner']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.requistioner.userName}"
						disabled="true" /></td>
				<td><h:outputLabel value="#{lbl['lbl.fl.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored}"></p:selectBooleanCheckbox></td>						
			</tr>
			<tr>			
				<td><p:outputLabel value="#{lbl['lbl.fl.inv.contract.no']}" rendered="#{invoiceBackingBean.managedBean.invoice.flRequest.docType eq 'CR'}" /></td>
				<td><p:inputText disabled="true" size="45" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.contractNo}" 
				rendered="#{invoiceBackingBean.managedBean.invoice.flRequest.docType eq 'CR'}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true" id="suppDetPnl">
		<table>
			<tr>
				<td style="width: 152px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15" value="#{invoiceBackingBean.managedBean.invoice.flRequest.smSupplier.regNo}"
									disabled="true" /></td>
							<td style="width: 80px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="9" value="#{invoiceBackingBean.managedBean.invoice.flRequest.smSupplier.smMofAccounts[0].mofNo}" disabled="true" /></td>
						</tr>
					</table></td>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.bank.acc.no']}"
						rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'false'}" />
					<p:outputLabel value="*" styleClass="mandatory"
						rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'false'}" /></td>
				<td><p:selectOneMenu id="accountId" label="AccountNo" required="true"
						rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'false' and invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.docType eq 'PO'}"
						disabled="#{invoiceBackingBean.managedBean.buttonVal=='Cancel'}"
						style="width:210px;margin-bottom: 5px;"
						value="#{invoiceBackingBean.managedBean.invoice.accountNo}">
						<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItems value="#{invoiceBackingBean.populateBankAccountList}" />
						<p:ajax event="change" update="suppBankName"
							listener="#{invoiceBackingBean.bankInfoActionListener}" />
					</p:selectOneMenu> <p:message for="accountId" display="icon" />
					 <p:inputText disabled="true" rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.docType eq 'CO'}"
		   			value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.latestContractVer.ctContractValue.bankAccountNo}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="45" disabled="true" id="suppName"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.supplierName}" /></td>
				<td style="width: 148px;"><p:outputLabel
						rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'false'}"
						value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="45" disabled="true" id="suppBankName"
						rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'false' and invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.docType eq 'PO'}"
						value="#{invoiceBackingBean.managedBean.invoice.paymentBank.finOrgName}" />
						<p:inputText size="45" disabled="true"
						rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'false' and invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.docType eq 'CO'}"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.latestContractVer.ctContractValue.bankName}" />
						</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 137px;"><p:outputLabel
						value="Address" /></td>
				<td><p:inputTextarea rows="5" cols="47"
						style="margin-bottom:5px;" disabled="true"
						value="#{invoiceBackingBean.getFullAddress(invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="13"
									disabled="true"
									value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 80px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="11" disabled="true"
									value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
			<tr>
				<td style="width: 72px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.inv.no']}" /></td>
				<td><p:inputText size="45" disabled="#{invoiceBackingBean.managedBean.buttonVal=='Cancel'}" 
						value="#{invoiceBackingBean.managedBean.invoice.supplierInvoiceRef}" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="FACTORING DETAIL" toggleable="true"
		rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'true'}">
		<table>
			<tr>
				<td style="width: 141px;"><p:outputLabel value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText size="45" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.pmFinancialOrg.finOrgName}" /></td>
				<td style="width: 170px;"><p:outputLabel
						value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.paymentBank.finOrgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.factoring.branch']}" /></td>
				<td><p:inputText size="45" disabled="true" value="#{invoiceBackingBean.managedBean.branchName}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.accountNo}" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 137px;"><p:outputLabel
						value="Address" /></td>
				<td><p:inputTextarea cols="47" rows="5"
						value="#{invoiceBackingBean.managedBean.supplierAddress}"
						style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="13"
									disabled="true"
									value="#{invoiceBackingBean.managedBean.phoneNo}" /></td>
							<td style="width: 80px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="11" disabled="true"
									value="#{invoiceBackingBean.managedBean.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="45"
						value="#{invoiceBackingBean.managedBean.contactEmail}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="45" disabled="true"
						value="#{invoiceBackingBean.managedBean.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
