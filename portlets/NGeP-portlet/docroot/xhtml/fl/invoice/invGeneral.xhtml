<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table>
		<tr>
			<td><p:outputLabel
					value="For iteration1 - generate DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.dan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="For interation1 - update DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.updateDan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
	</table>
	<table style="width: 100%">
		<tr>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="UPDATE"
						action="#{invoiceBackingBean.submitAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="CANCEL"
						action="#{invoiceBackingBean.submitAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="Invoice NO." /></td>
				<td><p:inputText size="20" value="- SYSTEM GENERATED - "
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
				<td style="width: 100px;"><p:outputLabel
						value="Supplier Inv. NO." /></td>
				<td><p:inputText size="20" value=" " /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel value="Address" /></td>
				<td rowspan="2"><p:inputTextarea cols="36"
						style="margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel value="Ori. Invoice Amt." /></td>
				<td><p:inputText size="20" value="20,000.00" disabled="true"
						style="margin-right:5px;" /> <p:inputText disabled="true"
						size="1" value="MYR" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="New Invoice Amt." /></td>
				<td><p:inputText size="20" value="18,500.00" disabled="true"
						style="margin-right:5px;" /> <p:inputText disabled="true"
						size="1" value="MYR" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText size="35" value="KBB.XY@gmail.com"
						disabled="true" /></td>
				<td><p:outputLabel value="Submission Date" /></td>
				<td><p:inputText size="20" value=" - SYSTEM DATE - "
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Tel No." /></td>
				<td><p:inputText size="20" value="02-7324800 " disabled="true" /></td>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 98px;"><p:outputLabel value="Ministry" /></td>
				<td><p:inputText size="35" value="KEMENTERIAN KEWANGAN"
						disabled="true" /></td>
				<td style="width: 140px;"><p:outputLabel value="Contract No." /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Jabatan" /></td>
				<td><p:inputText size="35"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="Order No." /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Issued PTJ" /></td>
				<td><p:inputText size="35"
						value="IBU PEJABAT KASTAM (CHARGE PTJ)" disabled="true" /></td>
				<td><p:outputLabel value="Maksud Code" /></td>
				<td><p:inputText size="35" value=" " disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Received PTJ" /></td>
				<td><p:inputText size="35"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" disabled="true" /></td>
				<td><p:outputLabel value="Charge Account" /></td>
				<td><p:inputText size="20" value="0001010" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="Title" /></td>
				<td><p:inputTextarea
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.title}"
						cols="36" style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="PAYMENT INSTRUCTION" toggleable="true">
		<p:panel header="Supplier / Factoring Company" />
		<table style="width: 100%">
			<tr>
				<td style="width: 97px;"><p:outputLabel value="Factored" /></td>
				<td><p:selectOneRadio value="#{invoiceBackingBean.managedBean.factoringCheck}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" process="@this" listener="#{invoiceBackingBean.factoringChecked}" update="@(.factStyle)" partialSubmit="true" />
					</p:selectOneRadio></td>
				<td style="width: 140px;" valign="top" rowspan="4"><p:outputLabel
						value="Bank Address" /></td>
				<td rowspan="2"><p:inputTextarea cols="36" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Bank Code" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom:5px;"  disabled="#{invoiceBackingBean.managedBean.factoringCheck eq 'false'}" styleClass="factStyle">
						<f:selectItem itemLabel="Select One" itemValue="" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Account NO" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom:5px;" disabled="#{invoiceBackingBean.managedBean.factoringCheck eq 'false'}" styleClass="factStyle">
						<f:selectItem itemLabel="Select One" itemValue="" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Pay Amt" /></td>
				<td><p:inputText size="26" disabled="true"
						style="margin-right:5px;" /> <p:inputText disabled="true"
						size="1" value="MYR" /></td>
			</tr>
		</table>
		<p:panel header="Commerce Dot Com" />
		<table style="width: 100%">
			<tr>
				<td style="width: 96px;"><p:outputLabel value="Pay Amt" /></td>
				<td colspan="3"><p:inputText size="26" disabled="true"
						style="margin-right:5px;" /> <p:inputText disabled="true"
						size="1" value="MYR" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
