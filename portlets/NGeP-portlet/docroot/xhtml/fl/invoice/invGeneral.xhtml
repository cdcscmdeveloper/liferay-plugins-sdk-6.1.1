<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table>
		<tr>
			<td><p:outputLabel
					value="For iteration1 - generate DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.dan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="For interation1 - update DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.updateDan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
	</table>
	<table style="width: 100%">
		<tr>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="UPDATE"
						action="#{invoiceBackingBean.submitAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="CANCEL"
						action="#{invoiceBackingBean.submitAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>
	<p:panel header="REQUEST DETAILS" toggleable="true">
		<table>
			<tr>
				<td style="width:139px"><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 140px;"><p:outputLabel value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3" colspan="3"><p:inputTextarea cols="37" rows="4"
						style=" margin-bottom:5px;"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.title}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td colspan="3"><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.orgName}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.orgName}" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.inv.no']}" /></td>
				<td><p:inputText value="#{invoiceBackingBean.managedBean.invoice.invoiceNo}" disabled="true" /></td>
				<td><h:outputLabel value="#{lbl['lbl.fl.factored']}" /></td>
				<td><p:selectBooleanCheckbox value="" disabled="true"></p:selectBooleanCheckbox></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.chargeOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.chargeOrgProfile.orgName}"
						size="35" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" disabled="true" /></td>
				<td><h:outputLabel value="#{lbl['lbl.fl.mto']}" /></td>
				<td><p:selectBooleanCheckbox value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.mto}" disabled="true" ></p:selectBooleanCheckbox></td>
				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.requisitioner']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.orgName}" disabled="true" /></td>
				
				
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table>
			<tr>
				<td style="width: 100px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
				<td style="width: 140px;"><p:outputLabel value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:selectOneMenu
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="MALAYSIA BANK" itemValue="1" />
					</p:selectOneMenu></td> 
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.smSupplier.companyName}"/></td>
				<td style="width: 100px;"><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:inputText size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.smSupplier.companyName}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.supp.inv.no']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.invoice.supplierInvoiceRef}"/></td>
			</tr>
			<tr>
				<td valign="top" style="width:137px;"><p:outputLabel value="Address" /></td>
				<td><p:inputTextarea rows="5" cols="37" style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="35" disabled="true" style="margin-right:5px;" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.fax.no']}" /></td>
				<td><p:inputText size="35" disabled="true" style="margin-right:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="35" value="02-7324800 " disabled="true" /></td>
				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="35" disabled="true" value="02-7324800 "/></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="FACTORING DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
				<td style="width:133px;"><p:outputLabel value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.factoring.branch']}" /></td>
				<td><p:selectOneMenu
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="MALAYSIA BANK BRANCH" itemValue="1" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top" style="width:137px;"><p:outputLabel value="Address" /></td>
				<td><p:inputTextarea cols="37" rows="5" style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="35" value="02-63248001" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.fax.no']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="35" value="02-7324800 " disabled="true" /></td>
				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="35" disabled="true" value="02-7324800 "/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
