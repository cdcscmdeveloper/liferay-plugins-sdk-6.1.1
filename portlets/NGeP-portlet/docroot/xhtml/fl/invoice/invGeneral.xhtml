<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table>
		<tr>
			<td><p:outputLabel
					value="For iteration1 - generate DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.dan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="For interation1 - update DAN Testing Purpose: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{invoiceBackingBean.managedBean.updateDan}">
					<p:ajax listener="#{invoiceBackingBean.test}" process="@this"></p:ajax>
				</p:selectBooleanCheckbox></td>
		</tr>
	</table>
	<table style="width: 100%">
		<tr>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Update"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="UPDATE"
						action="#{invoiceBackingBean.submitAction('UPDATE')}">
						<f:param name="actionName" value="UPDATE" />
					</p:commandButton></td>
			</c:if>
			<c:if test='#{invoiceBackingBean.managedBean.buttonVal eq "Cancel"}'>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="CANCEL"
						action="#{invoiceBackingBean.submitAction('CANCEL')}">
						<f:param name="actionName" value="CANCEL" />
					</p:commandButton></td>
			</c:if>
		</tr>
	</table>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 140px;"><p:outputLabel value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="36" rows="4"
						style=" margin-bottom:5px;"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.title}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.orgName}" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.issuedOrgProfile.orgName}" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText size="20" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.receivedOrgProfile eq null ? '' : invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.receivedOrgProfile.orgName}"
						size="35" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.mto']}" /></td>
				<td><p:selectOneRadio disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.mto}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.factored']}" /></td>
				<td><p:selectOneRadio 
						value="#{invoiceBackingBean.managedBean.invoice.isFactored}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.smSupplier.companyName}"/></td>
				<td style="width: 100px;"><p:outputLabel value="#{lbl['lbl.fl.del.ord.supp.ref.no']}" /></td>
				<td><p:inputText size="20" value="#{invoiceBackingBean.managedBean.invoice.supplierInvoiceRef}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.smSupplier.companyName}"/></td>
				<td style="width: 100px;"><p:outputLabel value="#{lbl['lbl.fl.ori.inv.amt']}" /></td>
				<td><p:inputText size="20" value="#{invoiceBackingBean.managedBean.invoice.invoiceAmtOri}" style="margin-right:5px;text-align:right;">
					<f:convertNumber pattern="#,#0.00" />
					</p:inputText>
					<p:inputText disabled="true" size="1" value="MYR" /></td>
			</tr>
			<tr>
				<td rowspan="3" valign="top" style="width:137px;"><p:outputLabel value="Address" /></td>
				<td rowspan="3"><p:inputTextarea rows="5" cols="36" style="margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.new.inv.amt']}" /></td>
				<td><p:inputText size="20" value="#{invoiceBackingBean.managedBean.invoice.invoiceAmtNew}" 
						style="margin-right:5px;text-align:right;">
						<f:convertNumber pattern="#,#0.00" />
						</p:inputText> 
						<p:inputText disabled="true" size="1" value="MYR" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.payment.bank']}" /></td>
				<td><p:inputText size="35" disabled="true"
						style="margin-right:5px;" /> </td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ct.bank.acc.no']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="20" value="02-7324800 " disabled="true" /></td>
				
			</tr>
			 	<td><p:outputLabel value="#{lbl['lbl.ct.su.fax']}" /></td>
				<td><p:inputText size="20" disabled="true" value="02-7324800 "/></td>
			<tr>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="FACTORING DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyname']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top" style="width:137px;"><p:outputLabel value="Address" /></td>
				<td><p:inputTextarea cols="36" rows="5" style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="20" value="02-63248001 " disabled="true" /></td>
				
			</tr>
			<tr>
			 	<td><p:outputLabel value="#{lbl['lbl.ct.su.fax']}" /></td>
				<td><p:inputText size="20" disabled="true" value="02-63248001 "/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
