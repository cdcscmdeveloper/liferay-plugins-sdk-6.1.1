<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:panel header="REQUEST DETAILS" toggleable="true">
			<table>
				<tr>
					<td style="width: 139px"><p:outputLabel
							value="#{lbl['lbl.fl.ministry']}" /></td>
					<td><p:inputText size="50"
							value="#{danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
							disabled="true" /></td>
					<td rowspan="3" valign="top" style="width: 140px;"><p:outputLabel
							value="#{lbl['lbl.fl.title']}" /></td>
					<td rowspan="3" colspan="3"><p:inputTextarea cols="40"
							rows="4" style=" margin-bottom:5px;"
							value="#{danBackingBean.managedBean.adjustment.flRequest.title}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
					<td><p:inputText size="5" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
						<p:spacer width="5" /> <p:inputText size="39"
							value="#{danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.orgName}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
					<td><p:inputText size="5" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
						<p:spacer width="5" /> <p:inputText size="39"
							value="#{danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile eq null ? '' : danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile.orgName}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.ptj']}" /></td>
					<td><p:inputText size="5" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
						<p:spacer width="5" /> <p:inputText
							value="#{danBackingBean.managedBean.adjustment.flRequest.chargeOrgProfile eq null ? '' : danBackingBean.managedBean.adjustment.flRequest.chargeOrgProfile.orgName}"
							size="39" disabled="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.del.ord.supp.inv.no']}" /></td>
					<td colspan="2"><p:inputText size="40"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.supplierInvoiceRef}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.requisitioner']}" /></td>
					<td><p:inputText size="50"
							value="#{danBackingBean.managedBean.adjustment.flRequest.requistioner.userName}"
							disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.inv.no']}" /></td>
					<td><p:inputText size="20"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.invoiceNo}"
							disabled="true" /></td>
					<td><h:outputLabel value="#{lbl['lbl.fl.factored']}" /></td>
					<td><p:selectBooleanCheckbox value="" disabled="true"></p:selectBooleanCheckbox></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
					<td><p:inputText size="25"
							value="#{danBackingBean.managedBean.adjustment.flRequest.ctContract.contractNo}"
							disabled="true" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="SUPPLIER DETAIL" toggleable="true">
			<table>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"
										value="#{danBackingBean.managedBean.adjustment.flRequest.smSupplier.regNo}" /></td>
								<td style="width: 65px;"><p:outputLabel
										value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
								<td><p:inputText size="20" disabled="true" value="#{danBackingBean.retrieveMofNo(danBackingBean.managedBean.adjustment.flRequest.smSupplier)}"/></td>
							</tr>
						</table></td>
						
					<td style="width: 134px;"><p:outputLabel
							value="#{lbl['lbl.fl.bank.acc.no.name']}"
							rendered="#{!danBackingBean.managedBean.adjustment.flOrder.factored}" /></td>
					<td><p:inputText size="55"
							value="#{danBackingBean.managedBean.accountNoName}"
							disabled="true"
							rendered="#{!danBackingBean.managedBean.adjustment.flOrder.factored}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}"
							rendered="#{!danBackingBean.managedBean.adjustment.flOrder.factored}" /></td>
					<td><p:inputText size="50" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.smSupplier.companyName}"
							rendered="#{!danBackingBean.managedBean.adjustment.flOrder.factored}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
					<td><p:inputText size="50" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.branchName}" /></td>
				</tr>
				<tr>
					<td valign="top" style="width: 137px;"><p:outputLabel
							value="Address" /></td>
					<td><p:inputTextarea rows="5" cols="50"
							value="#{danBackingBean.getFullAddress(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.smAddress)}"
							style="margin-bottom:5px;" disabled="true" /></td>
				</tr>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.supp.telno']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"
										value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.phoneNo}" /></td>
								<td style="width: 65px;"><p:outputLabel
										value="#{lbl['lbl.fl.fax.no']}" /></td>
								<td><p:inputText size="20" disabled="true"
										value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.faxNo}" /></td>
							</tr>
						</table></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
					<td><p:inputText size="50" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.contactPerson}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
					<td><p:inputText size="50"  disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.contactEmail}" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
					<td><p:inputText size="15" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.contactPhoneNo}" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="FACTORING DETAIL" toggleable="true" rendered="#{danBackingBean.managedBean.adjustment.flOrder.factored}">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
					<td><p:inputText size="50" disabled="true" value="#{danBackingBean.managedBean.adjustment.flOrder.pmFinancialOrg.finOrgName}"/></td>
					<td style="width: 133px;"><p:outputLabel
							value="#{lbl['lbl.fl.payment.bank.name']}" /></td>
					<td><p:inputText size="40" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.paymentBank.finOrgName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.factoring.branch']}" /></td>
					<td><p:inputText  disabled="true" size="50" value="#{danBackingBean.managedBean.branchName}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.bank.acc.no']}" /></td>
					<td><p:inputText size="40" disabled="true" value="#{danBackingBean.managedBean.adjustment.flInvoice.accountNo}"/></td>
				</tr>
				<tr>
					<td valign="top" style="width: 137px;"><p:outputLabel
							value="Address" /></td>
					<td><p:inputTextarea cols="50" rows="5"
							style="margin-bottom:5px;" disabled="true" value="#{danBackingBean.managedBean.supplierAddress}"/></td>
				</tr>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.supp.telno']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"  value="#{danBackingBean.managedBean.phoneNo}"/></td>
								<td style="width: 65px;"><p:outputLabel
										value="#{lbl['lbl.fl.fax.no']}" /></td>
								<td><p:inputText size="20" disabled="true" value="#{danBackingBean.managedBean.faxNo}"/></td>
							</tr>
						</table></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
					<td><p:inputText size="50" disabled="true" value="#{danBackingBean.managedBean.contactPerson}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
					<td><p:inputText size="50"  disabled="true" value="#{danBackingBean.managedBean.contactEmail}"/></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
					<td><p:inputText size="15" disabled="true" value="#{danBackingBean.managedBean.contactPhoneNo}" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
