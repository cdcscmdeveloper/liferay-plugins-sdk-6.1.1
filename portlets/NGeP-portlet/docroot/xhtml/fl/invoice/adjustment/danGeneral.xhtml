<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
			<table>
				<tr>
					<td style="width: 139px"><p:outputLabel
							value="#{lbl['lbl.fl.ministry']}" /></td>
					<td style="width: 389px;"><p:inputText size="66"
							value="#{danBackingBean.retrieveMinistryByOrgProfileId(danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile.orgProfileId, danBackingBean.managedBean.adjustment.flRequest.agApprovedDate)}"
							disabled="true" /></td>
					<td rowspan="3" valign="top" style="width: 140px;"><p:outputLabel
							value="#{lbl['lbl.fl.title']}" /></td>
					<td rowspan="3" colspan="3"><p:inputTextarea cols="40"
							rows="4" style=" margin-bottom:5px;"
							value="#{danBackingBean.managedBean.adjustment.flRequest.title}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td style="width: 106px;"><p:outputLabel
							value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
					<td><p:inputText size="66" id="controlOff"
							value="#{danBackingBean.retrievePegawaiPengawalByOrgProfileId(danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.orgProfileId, danBackingBean.managedBean.adjustment.flRequest.agApprovedDate)}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td style="width: 106px;"><p:outputLabel
							value="#{lbl['lbl.fl.jabatan']}" /></td>
					<td><p:inputText size="66" id="ptjGroup"
							value="#{danBackingBean.retrieveJabatanByOrgProfileId(danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.orgProfileId, danBackingBean.managedBean.adjustment.flRequest.agApprovedDate)}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
					<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:396px;" 
						value="#{danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.orgCode} #{danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.orgName}"/>
					<ac:iconTooltip
							value="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
					<td><p:inputText size="36" disabled="true"
						value="#{danBackingBean.managedBean.adjustment.flRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : danBackingBean.getParameterDesc(danBackingBean.managedBean.adjustment.flRequest.procurementTypeCategory)}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
					<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:396px;" 
						value="#{danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile.orgCode} #{danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile eq null ? '' : danBackingBean.managedBean.adjustment.flRequest.issuedOrgProfile.orgName}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.invoice.no']}" /></td>
					<td style="width: 320px;"><p:inputText size="36"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.supplierInvoiceRef}"
							disabled="true" /> <ac:iconTooltip
							value="#{lbl['lbl.fl.tooltip.supp.inv.no']}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.ptj']}" /></td>
					<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:396px;" 
						value="#{danBackingBean.managedBean.adjustment.flRequest.chargeOrgProfile.orgCode} #{danBackingBean.managedBean.adjustment.flRequest.chargeOrgProfile eq null ? '' : danBackingBean.managedBean.adjustment.flRequest.chargeOrgProfile.orgName}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.invoice.no']}" /></td>
					<td><p:commandLink value="#{danBackingBean.managedBean.adjustment.flInvoice.invoiceNo}" immediate="true"
							action="#{danBackingBean.navigateDocument(ParameterConst.doctypeInvoice)}"/>
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.invoice.no']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.do.requisitioner']}" /></td>
					<td><p:inputText size="66"
							value="#{danBackingBean.managedBean.adjustment.flRequest.requistioner.userName}"
							disabled="true" /></td>
					<td><h:outputLabel value="#{lbl['lbl.fl.dan.factored']}" /></td>
					<td><p:selectBooleanCheckbox value="#{danBackingBean.managedBean.adjustment.flOrder.factored}" disabled="true" />
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.factored']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
					<td><p:inputText size="25"
							value="#{danBackingBean.managedBean.adjustment.flRequest.ctContract.contractNo}"
							disabled="true" /></td>
					
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
			<table>
				<tr>
					<td ><p:outputLabel
							value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
					<td ><table style="width: 100%">
							<tr>
								<td><p:inputText size="15"
										disabled="true"
										value="#{danBackingBean.managedBean.adjustment.flRequest.smSupplier.regNo}" />
									<ac:iconTooltip
										value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}" /></td>
								<td style="width:60px;"><p:outputLabel
										value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
								<td><p:inputText size="14"
										disabled="true"
										value="#{danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.mofNo}" />
									<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}" />
								</td>
							</tr>
						</table></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
					<td style="width: 295px;"><p:inputText size="15"
							disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : danBackingBean.managedBean.adjustment.flRequest.smSupplier.epNo}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
					<td><p:inputText size="15" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : danBackingBean.managedBean.adjustment.flInvoice.gstRegNo}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
					<td><p:inputText size="15" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.gstDeclaredDate ==null ? lbl['lbl.fl.supp.na'] : danBackingBean.managedBean.adjustment.flInvoice.gstDeclaredDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
					<td><p:inputText size="15" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.gstEffectiveDate ==null ? lbl['lbl.fl.supp.na'] : danBackingBean.managedBean.adjustment.flInvoice.gstEffectiveDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

				</tr>
				<tr>
					<td style="width: 134px;white-space:nowrap;"><p:outputLabel
							value="#{lbl['lbl.fl.payment.match.paymentbankname']}"
							rendered="#{!danBackingBean.managedBean.adjustment.flOrder.factored}" /></td>
					<td><p:inputText size="50"
							value="#{danBackingBean.managedBean.accountNoName}"
							disabled="true"
							rendered="#{!danBackingBean.managedBean.adjustment.flOrder.factored}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
					<td colspan="4"><p:inputText size="50" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flRequest.smSupplier.companyName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
					<td colspan="3"><p:inputText size="50" disabled="true"
							value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.branchName)}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.branch']}"/></td>
				</tr>
				<tr>
					<td valign="top" style="width: 137px;"><p:outputLabel
							value="#{lbl['lbl.fl.supp.address']}" /></td>
					<td><p:inputTextarea rows="5" cols="50" autoResize="false"
							value="#{danBackingBean.getFullAddress(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.flAddress)}"
							style="margin-bottom:5px;" disabled="true" /></td>
				</tr>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.telno']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"
										value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.flAddress.phoneNoFull)}" /></td>
								<td style="width: 65px;white-space: nowrap;"><p:outputLabel
										value="#{lbl['lbl.fl.faxno']}" /></td>
								<td><p:inputText size="20" disabled="true"
										value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.flAddress.faxNoFull)}" /></td>
							</tr>
						</table></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
					<td><p:inputText size="50" disabled="true"
							value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.flAddress.contactPerson)}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.email']}" /></td>
					<td><p:inputText size="50"  disabled="true"
							value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.flAddress.contactEmail)}" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
					<td><p:inputText size="15" disabled="true"
							value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flRequest.flSupplierDtl.flAddress.contactPhoneNoFull)}" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.fl.factoring.details']}" toggleable="true" rendered="#{danBackingBean.managedBean.adjustment.flOrder.factored}">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.factoring.company']}" /></td>
					<td><p:inputText size="50" disabled="true" value="#{danBackingBean.managedBean.adjustment.flOrder.factoringOrgName}"/></td>
					<td style="width: 133px;"><p:outputLabel
							value="#{lbl['lbl.fl.bank.acc.no.name']}" /></td>
					<td><p:inputText size="40" disabled="true"
							value="#{danBackingBean.managedBean.adjustment.flInvoice.accountNo}  #{danBackingBean.managedBean.adjustment.flInvoice.paymentBank.finOrgName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.factoring.branch']}" rendered="false"/></td>
					<td><p:inputText  disabled="true" size="50" value="#{danBackingBean.getText(danBackingBean.managedBean.branchName)}" rendered="false"/></td>
				</tr>
				<tr>
					<td valign="top" style="width: 137px;"><p:outputLabel
							value="#{lbl['lbl.fl.supp.address']}" /></td>
					<td><p:inputTextarea cols="50" rows="5"
							style="margin-bottom:5px;" disabled="true" value="#{danBackingBean.getFullAddress(danBackingBean.managedBean.adjustment.flOrder.factoringAddress)}"/></td>
				</tr>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.telno']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"  value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flOrder.factoringAddress.phoneNoFull)}"/></td>
								<td style="width: 65px;"><p:outputLabel
										value="#{lbl['lbl.fl.faxno']}" /></td>
								<td><p:inputText size="20" disabled="true" value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flOrder.factoringAddress.faxNoFull)}"/></td>
							</tr>
						</table></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
					<td><p:inputText size="50" disabled="true" value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flOrder.factoringAddress.contactPerson)}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.email']}" /></td>
					<td><p:inputText size="50"  disabled="true" value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flOrder.factoringAddress.contactEmail)}"/></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
					<td><p:inputText size="15" disabled="true" value="#{danBackingBean.getText(danBackingBean.managedBean.adjustment.flOrder.factoringAddress.contactPhoneNoFull)}" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
