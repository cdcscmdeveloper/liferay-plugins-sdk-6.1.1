<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<f:event listener="#{danBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />

		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						rendered="#{danBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction" value="#{danBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}" update="@form"
							styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
							action="#{danBackingBean.submitAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<ui:include src="/xhtml/fl/invoice/adjustment/danHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu" 
						activeIndex="#{danBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form" >
							<f:setPropertyActionListener
								target="#{danBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.summary']}" update="@form" >
							<f:setPropertyActionListener
								target="#{danBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>

					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{danBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="danGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{danBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="danChargeLine.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
