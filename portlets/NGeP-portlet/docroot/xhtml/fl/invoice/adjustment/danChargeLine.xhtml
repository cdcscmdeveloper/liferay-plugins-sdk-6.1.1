<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="INVOICE SUMMARY" toggleable="true">
		<table>
			<tr>
				<td style="width:139px"><p:outputLabel value="#{lbl['lbl.fl.total.oredered.amt']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.inv.amt']}" /></td>
				<td><p:inputText size="35" value="" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.dan.amt']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="CHARGE LINE ITEMS">
		<p:dataTable id="chargeLine">
		<ac:paginator for="chargeLine" />
			<p:column headerText="Item Code"></p:column>
			<p:column headerText="Item Name"></p:column>
			<p:column headerText="UOM"></p:column>
			<p:column headerText="Unit Price"></p:column>
			<p:column headerText="Ordered Amt."></p:column>
			<p:column headerText="DAN Amt."></p:column>
		
		</p:dataTable>
	</p:panel>
</ui:composition>
