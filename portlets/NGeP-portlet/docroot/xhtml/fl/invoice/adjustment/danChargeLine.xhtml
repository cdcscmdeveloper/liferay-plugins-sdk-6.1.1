<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="SUMMARY" toggleable="true">
		<table>
			<tr>
				<td style="width: 148px"><p:outputLabel
						value="#{lbl['lbl.fl.total.oredered.amt']}"	 /></td>
				<td><p:inputText size="15" disabled="true" style="text-align:right"
						value="#{danBackingBean.managedBean.orderedAmtTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.inv.amt']}" /></td>
				<td><p:inputText size="15" disabled="true" style="text-align:right"
						value="#{danBackingBean.managedBean.invAmtTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.dan.amt']}" /></td>
				<td><p:inputText size="15" disabled="true" style="text-align:right"
						value="#{danBackingBean.managedBean.danAmtTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="CHARGE LINE ITEMS">

		<p:dataTable id="danItemDt" var="danItem" width="100%"
			value="#{danBackingBean.managedBean.adjustment.flAdjustmentItem}"
			rowIndexVar="index"
			selection="#{danBackingBean.managedBean.selectedDanItem}"
			selectionMode="single" rowKey="#{danItem}" >
			<p:ajax event="rowSelect" update=":form:chargeLineSection"
				listener="#{danBackingBean.selectDanItem()}" />
			<p:ajax event="rowUnselect" listener="#{danBackingBean.onNodeUnSelect()}"
				update=":form:chargeLineSection" />				
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Item Code">
				<h:outputText value="#{danItem.flItem.cmItem.extensionCode}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;">
				<h:outputText value="#{danItem.flItem.cmItem.itemName}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="#{danItem.flItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="Unit Price (RM)" style="text-align:right">
				<h:outputText value="#{danItem.flItem.unitPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Amt.(RM)" style="text-align:right">
				<h:outputText value="#{danItem.flInvoiceItem.orderedAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Invoice Amt.(RM)" style="text-align:right">
				<h:outputText value="#{danItem.flInvoiceItem.invAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="DAN Amt.(RM)" style="text-align:right">
				<h:outputText
					value="#{danItem.adjustedAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.vot.code']}" /></td>
					<td><p:inputText
							value="#{danBackingBean.managedBean.votFundCode}" size="9"
							disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.asset.ind']}" /></td>
					<td><p:inputText size="9" disabled="true"
							value="#{danBackingBean.getParameterDesc(ParameterTypeConst.assetInd, danBackingBean.managedBean.assetIndCode)}" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.asset.gosodo']}" /></td>
					<td><p:inputText size="9" disabled="true" value="#{danBackingBean.managedBean.glAccountCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.program.activity']}" /></td>
					<td><p:inputText
							value="#{danBackingBean.managedBean.prgActivityCode}" size="9"
							disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.Project']}" /></td>
					<td><p:inputText
							value="#{danBackingBean.managedBean.projectCode}" size="9"
							disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.setia.subsetia']}" /></td>
					<td><p:inputText
							value="#{danBackingBean.managedBean.setiaCode}" size="9"
							disabled="true" /></td>
					<td><p:inputText
							value="#{danBackingBean.managedBean.subSetiaCode}" size="9"
							disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.cp']}" /></td>
					<td><p:inputText
							value="#{danBackingBean.getParameterDesc(ParameterTypeConst.financingType,danBackingBean.managedBean.financingTypeCode)}"
							size="9" disabled="true" /></td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
</ui:composition>
