<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.dan.summary']}" toggleable="true">
		<table>
			<tr>
				<td style="width: 250px"><p:outputLabel
						value="#{lbl['lbl.fl.dan.total.ordered.amount']}"	 /></td>
				<td><p:inputText size="15" disabled="true" style="text-align:right"
						value="#{danBackingBean.managedBean.orderedAmtTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.total.order.amt']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.invoice.amount']}" /></td>
				<td><p:inputText size="15" disabled="true" style="text-align:right"
						value="#{danBackingBean.managedBean.invAmtTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.total.invoice.amt']}"/></td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.fl.dan.total.dan.amount']}" rendered="#{danBackingBean.managedBean.adjustment.docType eq ParameterConst.doctypeDebitAdjustmentNote}" />
					<p:outputLabel value="#{lbl['lbl.fl.dan.total.can.amount']}" rendered="#{danBackingBean.managedBean.adjustment.docType eq ParameterConst.doctypeCreditAdjustmentNote}" />
				</td>
				<td><p:inputText size="15" disabled="true" style="text-align:right"
						value="#{danBackingBean.managedBean.danAmtTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{danBackingBean.managedBean.adjustment.docType eq ParameterConst.doctypeDebitAdjustmentNote?lbl['lbl.fl.tooltip.total.dan.amt']:lbl['lbl.fl.tooltip.total.can.amt']}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.dan.charge.line.items']}">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.charge.line.summary']}" escape="false"/>
		<p:treeTable id="danItemDt" var="danItem" selectionMode="single" style="width: 100%"
			selection="#{danBackingBean.managedBean.selectedNode}"
			value="#{danBackingBean.managedBean.danChargeLineTree}" >
			<p:ajax event="expand" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />  
			<p:ajax event="select" update=":form:chargeLineSection"
				listener="#{danBackingBean.selectDanItem()}" disabled="#{danItem.level == 2}" />
			<p:ajax event="unselect" listener="#{danBackingBean.onNodeUnSelect()}"
				update=":form:chargeLineSection" disabled="#{danItem.level == 2}" />				
			<p:column>
			<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.item.code']}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}"/>
				</f:facet>
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.flItem.itemCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;width:35%;">
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.flItem.flFulfilmentItemAddr[0].scRequestItem.itemName}" id="itemDesc" style="text-align:left; float:left;" title="#{danItem.flAdjustmentItem.flItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : danItem.flAdjustmentItem.flItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}" style="white-space:normal;text-align:center;width:20%;">
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.flItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomName}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}"  style="white-space:normal;text-align:center;" rendered="false">
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.flItem.unitPrice}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:center;" rendered="false">
				<h:outputText rendered="#{danItem.level == 2}" value="#{danItem.flInvoiceItem.gstAmount}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}"  style="white-space:normal;text-align:center;" rendered="false">
				<h:outputText rendered="#{danItem.level == 2}" value="#{danItem.flInvoiceItem.gstUnitPrice}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.rate']}" style="white-space:normal;text-align:center;" rendered="false">
				<h:outputText value="#{danItem.flInvoiceItem.gstFlag.parameterCode}" rendered="#{danItem.level == 2}" style="float:right;">
				</h:outputText>
			</p:column>			
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="white-space:normal;text-align:center;width:6%;">
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.flInvoiceItemSummary.orderedAmt}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount.invoice']}" style="white-space:normal;text-align:center;width:6%;">
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.flInvoiceItemSummary.invAmt}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText rendered="#{danItem.level == 2}" value="#{danItem.flInvoiceItem.invAmt}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>				
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.dan.dan.amount']}" style="white-space:normal;text-align:center;width:6%;">
				<h:outputText rendered="#{danItem.level == 1}" value="#{danItem.flAdjustmentItem.adjustedAmt}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:treeTable>
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.asset.ind']}" /></td>
					<td><p:inputText size="17" disabled="true" 
							value="#{danBackingBean.getParameterDesc(ParameterTypeConst.assetInd, danBackingBean.managedBean.assetIndCode)}"/></td>
					<td style="width:95px;"><p:outputLabel value="#{lbl['lbl.fl.vot']}" /></td>
					<td><p:inputText
							value="#{danBackingBean.managedBean.votFundType == ParameterConst.votAmanah? '':(danBackingBean.managedBean.votFundCode)}" size="9"
							disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.vot.code']}"/>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.fund']}" /></td> 
					<td>
						<p:inputText value="#{danBackingBean.managedBean.votFundType == ParameterConst.votAmanah? (danBackingBean.managedBean.votFundCode):''}" size="9" disabled="true" />
					</td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.program.activiti']}" /></td>
					<td ><p:inputText
							value="#{danBackingBean.managedBean.prgActivityCode}" size="9"
							disabled="true" /></td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.project']}" /></td> 
					<td><p:inputText
							value="#{danBackingBean.managedBean.projectCode}" size="9"
							disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.setia.subsetia']}" /></td> 
					<td><p:inputText
							value="#{danBackingBean.managedBean.setiaCode}" size="9"
							disabled="true" />
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.cp']}" /></td> 
					<td>
						<p:inputText
							value="#{danBackingBean.getParameterDesc(ParameterTypeConst.financingType,danBackingBean.managedBean.financingTypeCode)}"
							size="9" disabled="true" />
					</td>		
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.gosodo']}" /></td> 
					<td><p:inputText size="9" disabled="true" value="#{danBackingBean.managedBean.glAccountCode}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gosodo']}"/></td>
				</tr>
			</table>	
		</h:panelGroup>
	</p:panel>
</ui:composition>
