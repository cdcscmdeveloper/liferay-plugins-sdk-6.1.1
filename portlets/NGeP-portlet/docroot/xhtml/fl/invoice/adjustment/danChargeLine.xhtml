<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="INVOICE SUMMARY" toggleable="true">
		<table>
			<tr>
				<td style="width:139px"><p:outputLabel value="#{lbl['lbl.fl.total.oredered.amt']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.inv.amt']}" /></td>
				<td><p:inputText size="35" value="" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.total.dan.amt']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="CHARGE LINE ITEMS">
		
		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="chargeLineChange"
			value="#{danBackingBean.managedBean.danChargeLineTree}">
			<p:column headerText="Item Code">
				<h:outputText
					value="#{chargeLineNode.itemCode}" />
			</p:column>
			<p:column headerText="Item Name">
				<h:outputText value="#{chargeLineNode.itemName}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Unit Price (RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.unitPrice}" >
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.orderedAmt}" >
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Invoice Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.invoiceAmt}" >
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="DAN Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.danAmt}" >
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:treeTable>
	</p:panel>
</ui:composition>
