<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.fl.do.poco.no']} " /></td>
				<td class="header-info-text">
					#{danBackingBean.managedBean.adjustment.flOrder.docNo}</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.fl.dan.no']}" rendered="#{danBackingBean.managedBean.adjustment.docType eq 'DN'}" />
					<p:outputLabel value="#{lbl['lbl.fl.can.no']}" rendered="#{danBackingBean.managedBean.adjustment.docType eq 'CN'}" />
				</td>
				<td class="header-info-text">
					#{danBackingBean.managedBean.adjustment.docNo}
				</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']} " />
				</td>
				<td class="header-info-text">
					#{danBackingBean.managedBean.adjustment.flRequest.preparedOrgProfile.orgName}
				</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']} " /></td>
				<td class="header-info-text">
					#{danBackingBean.getStatusDescById(danBackingBean.managedBean.adjustment.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
</ui:composition>
