<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.item.details']}" toggleable="true" styleClass="invItemPnlClass">
		<p:treeTable id="normalInvItemTbl" var="chargeLineNode"
			rendered="#{!invoiceBackingBean.managedBean.taxInvoice and not empty invoiceBackingBean.managedBean.chargeLineItemRoot}"
			styleClass="invItemChange"
			value="#{invoiceBackingBean.managedBean.chargeLineItemRoot}">
			<p:ajax event="expand" onstart="blockTreeTable.show();"
				oncomplete="blockTreeTable.hide();" />
			<p:column headerText="#{lbl['lbl.fl.item.name']}"
				style="white-space:normal;text-align:center;width:20%;">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>
				</f:facet>
				<h:outputText
					value="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemName}"
					id="itemDesc" rendered="#{chargeLineNode.level == 1}"
					style="text-align:left; float:left;"
					title="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}"
				style="white-space:normal;text-align:center">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>
				</f:facet>
				<h:outputText
					value="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomName}"
					rendered="#{chargeLineNode.level == 1}" style="float:left;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}"
				style="white-space:normal;text-align:center">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>
				</f:facet>
				<h:outputText
					value="#{chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].unitPrice}"
					rendered="#{chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal; text-align:center">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.received.qty']}"></h:outputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.received.quantity']}" />
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceItem.receivedQty}"
					rendered="#{chargeLineNode.level == 3}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern"
						value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flInvoiceSummary.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<ui:remove>
				<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}"
					style="white-space:normal;text-align:center">
					<f:facet name="footer">
						<h:outputText value=""></h:outputText>
					</f:facet>
					<h:outputText value="#{lbl['lbl.txt.na']}"
						rendered="#{chargeLineNode.level == 3}" style="float:right;">
					</h:outputText>
				</p:column>
			</ui:remove>
			<p:column headerText="#{lbl['lbl.fl.inv.total.amt']}" style="white-space:normal;text-align:center">
				<f:facet name="footer">
					<f:facet name="footer">
						<h:outputText value="#{invoiceBackingBean.managedBean.invAmtGrandTotal}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</f:facet>
				</f:facet>
				<h:outputText value="#{chargeLineNode.flInvoiceSummary.invAmt}" id="invSumAmountTxt" 
							rendered="#{chargeLineNode.level == 2}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<p:inputText size="9"
					value="#{chargeLineNode.flInvoiceItem.invAmt}" maxlength="15"
					id="chargeInvAmt" label="#{lbl['lbl.fl.invoice.amount']}"
					required="true" style="text-align:right;color: red;float:right"
					rendered="#{chargeLineNode.level == 3}" disabled="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<p:message for="chargeInvAmt" display="icon" />
			</p:column>
		</p:treeTable>
		
		<ui:include src="invTaxScreen.xhtml"></ui:include>
		<ui:include src="outOfScopeScreen.xhtml"></ui:include>
		
		<p:blockUI widgetVar="blockTreeTable" block="normalInvItemTbl" >
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
	</p:panel>
</ui:composition>
