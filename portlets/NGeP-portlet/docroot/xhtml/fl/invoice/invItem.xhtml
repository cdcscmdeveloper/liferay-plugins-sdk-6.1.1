<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true" styleClass="invItemPnlClass">

		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="invItemChange"
			value="#{invoiceBackingBean.managedBean.chargeLineItemRoot}">
			<p:column headerText="Item Code" style="white-space:normal;">
				<h:outputText
					value="#{chargeLineNode.scRequestItem.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;" >
				<h:outputText value="#{chargeLineNode.scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="Unit"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Unit &lt;br /&gt; Price (RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.unitPrice}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.orderedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.receivedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Recalled &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeRecalledQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.orderedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeReceivedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Invoice &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeInvAmt}" id="invSumAmountTxt"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<p:inputText size="9" value="#{chargeLineNode.chargeInvAmt}" id="chargeInvAmt" label = "InvoiceAmount" required="true" style="text-align:right;color: red;"  
					rendered="#{chargeLineNode.parent == 'false'}">
					<p:ajax event="blur"  process="@this" partialSubmit="true" update="chargeLineTbl,:form:grandTotalPnl"
								listener="#{invoiceBackingBean.retrieveInvTotalAmount(chargeLineNode)}">
					</p:ajax>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText><p:message for="chargeInvAmt" display="icon" />
			</p:column>
		</p:treeTable>
		<br />
		<h:panelGroup id="grandTotalPnl">
			<table style="width: 93%">
				<tr>
					<td style="text-align: right; font: bold; size: 10;">Grand Total: <p:spacer width="10px" />
						<h:outputText value="#{invoiceBackingBean.managedBean.orderedAmtGrandTotal}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
						<p:spacer width="40px" />
						<h:outputText value="#{invoiceBackingBean.managedBean.receivedAmtGrandTotal}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
						<p:spacer width="40px" />
						<h:outputText value="#{invoiceBackingBean.managedBean.invAmtGrandTotal}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
</ui:composition>
