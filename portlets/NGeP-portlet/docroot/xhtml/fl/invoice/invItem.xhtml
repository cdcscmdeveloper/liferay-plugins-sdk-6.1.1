<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<p:panel header="ITEM DETAIL" toggleable="true">

			<p:dataTable id="invItemDt" var="item" value="#{invoiceBackingBean.managedBean.invItem}" >
			<ac:paginator for="invItemDt"/>
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="Item Name" />
					<p:column rowspan="2" headerText="Ord. Qty" />
					<p:column rowspan="2" headerText="Recv. Qty" />
					<p:column rowspan="2" headerText="Del. Qty" />
					<p:column colspan="4" headerText="Amount (MYR)" />
				</p:row>
				<p:row>
					<p:column headerText="Ordered" />
					<p:column headerText="Delivered" />
					<p:column headerText="Ori. Sub Total" />
					<p:column headerText="New Sub Total" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:outputLabel
					value="#{item.flFulfilmentItem.scRequestNoteDtl.scRequestNote.scRequestList.requestItems[0].itemName}"
					rendered="#{invoiceBackingBean.managedBean.docType eq 'PR'}" />
				<p:outputLabel
					value="#{item.flFulfilmentItem.qtItem.itemName}"
					rendered="#{invoiceBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItem.sumOrderedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItem.sumReceivedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItem.sumDeliveredQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItem.sumOrderedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItem.sumDeliveredQty}" />
			</p:column>
			<p:column>
				<p:inputText value="#{item.itemAmtOri}" />
			</p:column>
			<p:column>
				<p:inputText value="#{item.itemAmtNew}" />
			</p:column>
		</p:dataTable>
		<br />
		<br />
		
		</p:panel>
</ui:composition>
