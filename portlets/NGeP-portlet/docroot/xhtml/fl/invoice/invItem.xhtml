<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true">
		<ui:repeat var="address" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.flFulfilmentRequest.flDeliveryAddresses}">
			<h:outputText rendered="#{address.addressType != null}"
					value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{address.addressType eq null}"
					value="#{address.pmAddress.address1}, #{address.pmAddress.address2}, #{address.pmAddress.address3}, #{address.pmAddress.address4}" />
			<p:spacer height="5px"></p:spacer>
			<p:dataTable id="invItemDt" var="item" width="100%"
				value="#{address.flFulfilmentItemAddr}">
				<ac:paginator for="invItemDt" />
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" headerText="Type" />
						<p:column rowspan="2" headerText="Item Code" />
						<p:column rowspan="2" headerText="Item Name" />
						<p:column rowspan="2" headerText="Ordered Qty." />
						<p:column rowspan="2" headerText="Delivered Qty." />
						<p:column rowspan="2" headerText="Recalled Qty." />
						<p:column rowspan="2" headerText="Ordered Amt. (RM)" />
						<p:column rowspan="2" headerText="Delivered Amt. (RM)" />
						<p:column rowspan="2" headerText="Recalled Amt. (RM)" />
						<p:column rowspan="2" headerText="Invoice Amt. (RM)" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:outputLabel
						value="#{item.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType}"
						rendered="#{invoiceBackingBean.managedBean.docType eq 'PR'}" />
					<h:outputText style="text-align:right"
						value="#{item.flFulfilmentItem.qtItem.itemName}"
						rendered="#{invoiceBackingBean.managedBean.docType eq 'CR'}" />
				</p:column>
				<p:column>
					<p:outputLabel
						value="#{item.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.requestNoteItemId}"
						rendered="#{invoiceBackingBean.managedBean.docType eq 'PR'}" />
					<h:outputText style="text-align:right"
						value="#{item.flFulfilmentItem.qtItem.itemName}"
						rendered="#{invoiceBackingBean.managedBean.docType eq 'CR'}" />
				</p:column>
				<p:column>
					<p:outputLabel
						value="#{item.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemName}"
						rendered="#{invoiceBackingBean.managedBean.docType eq 'PR'}" />
					<h:outputText style="text-align:right"
						value="#{item.flFulfilmentItem.qtItem.itemName}"
						rendered="#{invoiceBackingBean.managedBean.docType eq 'CR'}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{item.orderedQty}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{item.sumDeliveredQty}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{item.recalledQty}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{item.orderedAmt}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{item.sumDeliveredAmt}" />
				</p:column>
				<p:column>
					<p:outputLabel value="#{item.recalledAmt}" />
				</p:column>
				<p:column>
					<p:inputText value="#{item.receivedAmt}" style="text-align:right">
					<f:convertNumber pattern="#,#00.00" />
						<p:ajax event="blur"
							listener="#{invoiceBackingBean.updateNewInvoiceAmt(item)}"
							process="@this">
						</p:ajax>
					</p:inputText>
				</p:column>
			</p:dataTable>
			<br />
			<br />
		</ui:repeat>
	</p:panel>
</ui:composition>
