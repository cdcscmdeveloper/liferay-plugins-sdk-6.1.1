<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true" styleClass="invItemPnlClass">

		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="invItemChange" value="#{invoiceBackingBean.managedBean.chargeLineItemRoot}">
			<p:ajax event="expand" 
                onstart="blockTreeTable.show();" oncomplete="blockTreeTable.hide();" />  			
			<p:column style="white-space:normal; width:145px;">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.item.code']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
    				</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" rendered="#{chargeLineNode.parent == 'test'}"/>
				</f:facet>
				<h:outputText
					value="#{chargeLineNode.flFulfilmentItem.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;" >
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" rendered="#{chargeLineNode.parent == 'test'}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" rendered="#{chargeLineNode.parent == 'test'}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:right">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" rendered="#{chargeLineNode.parent == 'test'}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.unitPrice}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column  style="text-align:right">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.ordered.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.order.qty']}"/>
    				</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" rendered="#{chargeLineNode.parent == 'test'}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.orderedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="text-align:right">
			
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.received.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" rendered="#{chargeLineNode.parent == 'test'}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.receivedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column  style="text-align:right">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.invoice.recalled.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.recalled.qty']}"/>
    			</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.fl.inv.grand.total']}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.recalledQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:right">
				<f:facet name="footer">
					<h:outputText value="#{invoiceBackingBean.managedBean.orderedAmtGrandTotal}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.orderedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.orderedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.received.amount']}" style="text-align:right">
				<f:facet name="footer">
					<h:outputText value="#{invoiceBackingBean.managedBean.receivedAmtGrandTotal}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount.invoice']}" style="text-align:right">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.amount.invoice']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.amount']}"/>
    			</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{invoiceBackingBean.managedBean.invAmtGrandTotal}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.invAmt}" id="invSumAmountTxt"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<p:inputText size="9" value="#{chargeLineNode.invAmt}" maxlength="15" id="chargeInvAmt" label = "InvoiceAmount" required="true" style="text-align:right;color: red;"  
					rendered="#{chargeLineNode.parent == 'false'}" disabled="#{invoiceBackingBean.managedBean.buttonVal=='Cancel' || invoiceBackingBean.managedBean.buttonVal=='Update' || invoiceBackingBean.managedBean.buttonVal=='ACK'}">
					<p:ajax event="blur"  process="@this" partialSubmit="true" update="chargeLineTbl"
								listener="#{invoiceBackingBean.retrieveInvTotalAmount(chargeLineNode)}">
					</p:ajax>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText><p:message for="chargeInvAmt" display="icon" />
			</p:column>
		</p:treeTable>
		<p:blockUI widgetVar="blockTreeTable" block="chargeLineTbl">  
			<p:graphicImage value="/resources/ep/images/ajax-loader.gif"></p:graphicImage>  
		</p:blockUI> 			
	</p:panel>
</ui:composition>
