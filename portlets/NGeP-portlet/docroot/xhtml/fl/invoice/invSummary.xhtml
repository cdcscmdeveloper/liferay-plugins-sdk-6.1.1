<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.invoice.summary']}" toggleable="true" styleClass="invItemSummaryPnlClass" >
		<table>
			<tr>
				<td style="width:185px"><p:outputLabel value="#{lbl['lbl.fl.invoice.amount.excl.gst']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.invoiceAmountWithoutGST}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.amt.excl.gst']}"/></td>			
			</tr>
			<tr>
				<td style="width:185px"><p:outputLabel value="#{lbl['lbl.fl.gst.amt']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.gstAmount}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.gst.amt']}"/></td>			
			</tr>
			<tr>
				<td style="width:185px"><p:outputLabel value="#{lbl['lbl.fl.invoice.amount.incl.gst']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.invoice.invoiceAmtNew}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.amt.incl.gst']}"/></td>			
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.inv.service.fee']}" /></td>
				<td>
					<p:inputText size="35" value="#{invoiceBackingBean.managedBean.serviceCharge}" disabled="true" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</p:inputText><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.service.fee']}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.invoice.fee.amount']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.feeAmt}"  style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.service.fee.amt']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.invoice.amount.to.supp']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.supplierOrFactorAmt}" style="text-align:right"><f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.amt.to.supplier']}"/></td>
			</tr>
		</table>
		<p:spacer height="10px" />
		<p:dataTable value="#{invoiceBackingBean.managedBean.taxInvoiceList}" var="taxInvoice" style="width:50%">
			<p:column headerText="#{lbl['lbl.fl.gst.rate']}" style="white-space:normal;">
				<h:outputText value="#{taxInvoice.gstFlag}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amt.wo.gst']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{taxInvoice.amountWithoutGst}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{taxInvoice.gstAmount}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		</p:panel>
		<p:spacer height="10px" />
	<p:panel
		rendered="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factored eq 'true'}"
		style="text-align: center;">
		<table>
			<tr>
				<td style="width: 135px;"></td>
				<td style="text-align: center;"><h:outputText
						value="#{lbl['lbl.fl.instruction.inv.summary1']}" /> <h:outputText
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factoringOrgName}."
						style="font-weight:bold" /><p:spacer width="10px" /> <h:outputText
						value="#{lbl['lbl.fl.instruction.inv.summary2']}" /></td>
			</tr>
		</table>
		<p:spacer height="10px" />
		<table>
			<tr>
				<td style="width: 50px;"></td>
				<td style="text-align: center;"><h:outputText
						value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.factoringOrgName}" /></td>
			</tr>
			<tr>
				<td ></td>
				<td style="text-align: center;"><h:outputText
						value="#{invoiceBackingBean.managedBean.invoice.paymentBank.finOrgName}" />
					<h:outputText value="#{lbl['lbl.fl.instruction.inv.summary3']}" />
					<p:spacer width="10px" /> <h:outputText
						value="#{invoiceBackingBean.managedBean.invoice.accountNo}" /> <h:outputText
						value="#{lbl['lbl.fl.instruction.inv.summary4']}" /></td>
			</tr>
			<tr>
				<td ></td>
				<td style="text-align: center;"><h:outputText
						value="#{invoiceBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
