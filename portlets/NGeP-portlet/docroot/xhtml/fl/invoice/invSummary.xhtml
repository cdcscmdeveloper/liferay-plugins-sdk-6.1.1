<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="INVOICE SUMMARY" toggleable="true" styleClass="invItemSummaryPnlClass" >
		<table>
			<tr>
				<td style="width:185px"><p:outputLabel value="#{lbl['lbl.fl.new.inv.amt']}" /></td>
				<td><p:inputText size="35" value="#{invoiceBackingBean.managedBean.invoice.invoiceAmtNew}"  disabled="true" style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.service.fee']}" /></td>
				<td>
					<p:inputText size="35" value="#{invoiceBackingBean.managedBean.serviceCharge}" disabled="true" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</p:inputText>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.fee.amt']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.feeAmt}"  style="text-align:right">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" /></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.amt.to.supplier']}" /></td>
				<td><p:inputText size="35" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.supplierOrFactorAmt}" style="text-align:right"><f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
