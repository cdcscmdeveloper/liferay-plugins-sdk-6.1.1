<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="DELIVERY ADDRESS" toggleable="true">

		<table style="width: 775px;">

			<tr>
				<td colspan="6" align="right"><p:commandButton value="ADD" />
				</td>

			</tr>
		</table>
		<p:dataTable id="dataTable" var="address" value="" paginator="true"
			rows="10"
			paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
			rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
			<p:column style="width: 400px;" headerText="Delivery Address">
				<h:outputText value=" " />
			</p:column>

			<p:column headerText="Exp. Delivery (Start)">
				<h:outputText value=" " />
			</p:column>

			<p:column headerText="Exp. Delivery (End)">
				<h:outputText value="" />
			</p:column>

			<p:column headerText="Sub Total (MYR)">
				<h:outputText value="" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
