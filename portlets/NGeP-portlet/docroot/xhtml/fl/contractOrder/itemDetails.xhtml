<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="ITEM DETAIL" toggleable="false">

		<br />

		<p:dataTable id="dataTable" var="item" value="" paginator="true"
			rows="10"
			paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
			rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
			<p:column headerText="Product Code">
				<h:outputText value="" />
			</p:column>

			<p:column headerText="Item Name">
				<h:outputText value="" />
			</p:column>

			<p:column headerText="GOSODO">
				<h:outputText value="" />
			</p:column>

			<p:column headerText="Activity Code">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Ord. Qty.">
				<h:outputText value="" />
			</p:column>
			<p:column headerText="Total">
				<h:outputText value="" />
			</p:column>
		</p:dataTable>

		<br />
		<br />
		<table>
			<tr>
				<td><p:outputLabel value="Product Code" /></td>
				<td><p:inputText style="width: 260px;" value="200003"
						disabled="true" /></td>
				<td><p:outputLabel value="Unit Price" /></td>
				<td><p:inputText style="width: 260px;" value="0.50"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Item Name" /></td>
				<td><p:inputText style="width: 260px;" value="Blue Pen"
						disabled="true" /></td>
				<td><p:outputLabel value="Ordered Qty" /></td>
				<td><p:inputText style="width: 260px;" value="200" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="GOSODO" /></td>
				<td><p:inputText style="width: 260px;" value="GOSODO001"
						disabled="true" /></td>
				<td><p:outputLabel value="Total" /></td>
				<td><p:inputText style="width: 260px;" value="100.00"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Activity Code" /></td>
				<td><p:inputText style="width: 260px;" value="ACTIVITY1 "
						disabled="true" /></td>

			</tr>

		</table>
	</p:panel>
</ui:composition>
