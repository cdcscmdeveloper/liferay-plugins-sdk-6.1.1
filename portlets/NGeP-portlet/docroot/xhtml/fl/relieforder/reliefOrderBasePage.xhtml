<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<f:event listener="#{reliefOrderBB.preRenderView}" type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="#{reliefOrderBB.managedBean.autoUpdate}"
			closable="true" severity="error, info" />
			
		<ac:gpkiPopup 
			textBeforeSign="#{reliefOrderBB.managedBean.textBeforeSign}"
			postSignAction="#{reliefOrderBB.preSubmitFulfillmentRequest(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{reliefOrderBB.enableAutoUpdate()}"	/>

		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"  
						action="#{reliefOrderBB.backToPervious}"
						rendered="#{reliefOrderBB.managedBean.taskId==null}" /></td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction" value="#{reliefOrderBB.managedBean.outComes}">	
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}"
							styleClass="ui-button" 
							update="@form" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{reliefOrderBB.gpkiSignAction(bpmAction)}" />
					</ui:repeat>
					</td>
				<c:if
					test='#{reliefOrderBB.managedBean.buttonVal eq "View"}'>
					<td colspan="4" style="text-align: right">	
					<p:commandLink
						value="#{lbl['lbl.td.doc.trackingDiary']}"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeReliefOrder,reliefOrderBB.managedBean.flReliefOrder.reliefOrderId)}"
						immediate="true" />
					</td>		
				</c:if>	
			</tr>
		</table>
		<ui:include src="/xhtml/fl/relieforder/reliefOrderHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu" 
						activeIndex="#{reliefOrderBB.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{reliefOrderBB.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.relief.item']}" update="@form" >
							<f:setPropertyActionListener
								target="#{reliefOrderBB.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.non.relief.item']}" update="@form" rendered="#{reliefOrderBB.managedBean.nonReliefMenuDisplay=='true'}">
							<f:setPropertyActionListener
								target="#{reliefOrderBB.managedBean.selectedTabIndex}" value="2" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%">
					<p:outputPanel
						rendered="#{reliefOrderBB.managedBean.selectedTabIndex == 0}">
						<ui:include src="reliefOrderGeneral.xhtml" />
					</p:outputPanel> 
					<p:outputPanel
						rendered="#{reliefOrderBB.managedBean.selectedTabIndex == 1}">
						<ui:include src="reliefOrderItem.xhtml" />
					</p:outputPanel>
					<p:outputPanel
						rendered="#{reliefOrderBB.managedBean.selectedTabIndex == 2}">
						<ui:include src="reliefOrderNonItem.xhtml" />
					</p:outputPanel>
					
					
					 </td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
