<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.non.relief.item.details']}" toggleable="true" styleClass="nonReliefOrderItemPnlClass">

		<p:dataTable id="nonReliefItemDataTable" var="nonReliefItem" rows="10"
			value="#{reliefOrderBB.managedBean.nonReliefItems}" rowIndexVar="index"
			rowKey="#{nonReliefItem}">
			<ac:paginator for="nonReliefItemDataTable" />
			<p:column style="white-space:normal; width:145px;">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.item.code']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
    				</f:facet>
				<h:outputText
					value="#{nonReliefItem.flFulfilmentItem.itemCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;" >
				<h:outputText value="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemName}" id="itemDesc"/>
				<p:tooltip for="itemDesc" value="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc}" rendered="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemDesc!=null}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}" style="white-space:normal;">
				<h:outputText value="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].unitPrice}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].gstAmount}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].gstUnitPrice}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.rate']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{nonReliefItem.gstFlag.parameterCode}" >
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.received.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
				<h:outputText value="#{nonReliefItem.receivedQty}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, nonReliefItem.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.received.amount']}" style="white-space:normal;text-align:right;">
				<h:outputText value="#{nonReliefItem.receivedAmt}" >
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
	</p:panel>
</ui:composition>
