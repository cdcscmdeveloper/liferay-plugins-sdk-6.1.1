<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/fl/shared/sidemenu/flCrSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right"><p:commandButton value="SAVE" />
					<p:commandButton value="SUBMIT" /> <p:commandButton value="PRINT" /></td>
			</tr>
		</table>

		<p:panel header="DELIVERY ADDRESS" toggleable="false">

			<table style="width: 775px;">

				<tr>
					<td colspan="6" align="right"><p:commandButton value="ADD" />
					</td>

				</tr>
			</table>
			<p:dataTable id="dataTable" var="address" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:column headerText="Delivery Address">
					<h:outputText value=" " />
				</p:column>

				<p:column headerText="Exp. Delivery (Start)">
					<h:outputText value=" " />
				</p:column>

				<p:column headerText="Exp. Delivery (End)">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Action">
					<p:commandLink id="deleteLink" styleClass="ui-icon ui-icon-trash" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="ITEM DETAIL" toggleable="false">
			<table style="width: 775px;">
				<tr>
					<td colspan="6" align="right"><p:commandButton value="ACTION" />
					</td>
				</tr>
			</table>
			<p:dataTable id="dataTable" var="item" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:column headerText="Product Code">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Item Name">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="GOSODO">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Activity Code">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Unit Price (MYR)">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Ord. Qty.">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Sub Total">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Action">
					<p:commandLink id="deleteLink" styleClass="ui-icon ui-icon-trash" />
				</p:column>
			</p:dataTable>

			<br />
			<br />
			<table>
				<tr>
					<td><p:outputLabel value="Product Code" /></td>
					<td><p:inputText style="width: 140px;" value="200003"
							disabled="true" /></td>
					<td><p:outputLabel value="Unit Price" /></td>
					<td><p:inputText style="width: 140px;" value="0.50"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Item Name" /></td>
					<td><p:inputText style="width: 140px;" value="Blue Pen"
							disabled="true" /></td>
					<td><p:outputLabel value="Ordered Qty" /></td>
					<td><p:inputText style="width: 140px;" value="200" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="GOSODO" /></td>
					<td><p:selectOneMenu value="" style="width: 260px;">
							<f:selectItem itemLabel="GOSODO001" itemValue="1" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Total" /></td>
					<td><p:inputText style="width: 140px;" value="100.00"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Activity Code" /></td>
					<td><p:selectOneMenu value="" style="width: 260px;">
							<f:selectItem itemLabel="ACTIVITY1" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
			</table>
			<table style="width: 800px;">
				<tr>
					<td colspan="4" align="right"><p:commandButton type="button"
							icon="ui-icon-circle-triangle-w" /> <p:commandButton
							type="button" icon="ui-icon-circle-triangle-e" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
