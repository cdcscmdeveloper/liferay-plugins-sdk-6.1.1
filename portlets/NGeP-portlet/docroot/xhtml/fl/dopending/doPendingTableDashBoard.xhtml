<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<table style="width: 100%;">
			<tr>
				<td
					style="width: 80%; padding-left: 5px; border-style: ridge; border-width: 1px; border-color: #000000;">
					<p:outputLabel value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.poPendingFulfilment)}"
						style="float:left;" />
				</td>
				<td
					style="width: 20%; text-align: center; border-style: ridge; border-width: 1px; border-color: #000000;">
					#{flOrderBB.managedBean.totalPendingFl}</td>
			</tr>
			<tr>
				<td
					style="width: 80%; padding-left: 5px; border-style: ridge; border-width: 1px; border-color: #000000;">
					<p:outputLabel value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.coPendingPartialFl)}"
						style="float:left;" />
				</td>
				<td
					style="width: 20%; text-align: center; border-style: ridge; border-width: 1px; border-color: #000000;">
					#{flOrderBB.managedBean.totalPendingPartialFl}</td>
			</tr>
			<tr>
				<td colspan="3"
					style="text-align: right; padding-right: 6%; border-style: ridge; border-width: 1px; border-color: #000000;">
					<p:commandLink value="#{lbl['lbl.ct.dash.board.more']}"
						styleClass="blue_font" process="@this" update="@form"
						action="#{flOrderBB.navigateToDeliveryOrder}">
					</p:commandLink>
				</td>
			</tr>
		</table>
	</ui:define>

</ui:composition>
