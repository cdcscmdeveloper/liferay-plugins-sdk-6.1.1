<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:panel header="DELIVERY ORDER DETAILS" toggleable="true">
			<br />
			<p:dataTable value="#{flOrderBB.managedBean.pendingDoList}"
				var="pending" id="pendingTable" rowIndexVar="rowIndex" width="100%">
				<ac:paginator for="pendingTable" />
				<p:column headerText="Order Number">
					<p:commandLink value="#{pending.fulfilmentOrderId}"
						action="#{flOrderBB.navigateToFlOrder(rowIndex)}">
						<f:setPropertyActionListener target="#{flOrderBB.managedBean.selectedFlOrder}" value="#{pending}"></f:setPropertyActionListener>
					</p:commandLink>
				</p:column>
				<p:column headerText="Document Type">
					<h:outputText value="#{pending.docType}" />
				</p:column>
				<p:column headerText="Title">
					<h:outputText value="#{pending.flFulfilmentRequest.title}" />
				</p:column>
				<p:column headerText="Created Date">
					<h:outputText value="#{pending.createdDate}">
						<f:convertDateTime pattern="dd-MM-yyyy HH:mm" />
					</h:outputText>
				</p:column>
				<p:column headerText="Status">
					<h:outputText value="PENDING" />
				</p:column>
			</p:dataTable>
			<p:remoteCommand action="#{flOrderBB.stopDelivery}"
				name="goToDetail" update="pendingTable" process="@this"/>

		</p:panel>
	</ui:define>

</ui:composition>
