<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
	
		<p:dataTable value="#{flOrderBB.pendingDoDataModel}" lazy="true"
			var="pending" id="flPendingDoListDt" rowIndexVar="rowIndex" width="100%" rows="10">
			<ac:paginator for="flPendingDoListDt" />
			<p:column headerText="Order Number">
				<p:commandLink value="#{pending.docNo}"
					action="#{flOrderBB.navigateToFlOrder(rowIndex)}">
					<f:setPropertyActionListener
						target="#{flOrderBB.managedBean.selectedFlOrder}"
						value="#{pending}"></f:setPropertyActionListener>
						<f:param name="status" value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" />
				</p:commandLink>
			</p:column>
			<p:column headerText="Document Type">
				<h:outputText value="#{flOrderBB.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, pending.docType)}" />
			</p:column>
			<p:column headerText="Title">
				<h:outputText value="#{pending.flFulfilmentRequest.title}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ptj.name']}">
				<h:outputText value="#{pending.flFulfilmentRequest.preparedOrgProfile.orgName}" />
			</p:column>			
			<p:column headerText="Created Date">
				<h:outputText value="#{pending.createdDate}">
					<f:convertDateTime pattern="dd-MM-yyyy HH:mm" />
				</h:outputText>
			</p:column>
			<p:column headerText="Status">
				<h:outputText
					value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" />
					
			</p:column>
		</p:dataTable>
	</ui:define>

</ui:composition>
