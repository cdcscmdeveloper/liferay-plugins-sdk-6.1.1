<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		
		<style>
			div[id$="ctSubListTree"] thead {
    			display:none;
			}
			
			.ui-datatable.ctlisttree thead th,
			.ui-datatable.ctlisttree tbody,
			.ui-datatable.ctlisttree tbody tr,
			.ui-datatable.ctlisttree tbody td {
				padding:4px;
			}
			
			
			tr.ui-expanded-row-content.ui-widget-content td[colspan="11"]:first-child{
    			padding: 0px;
    			border-top: 0 !important;
    			border-right: 0 !important;    		
    			border-left: 0 !important;
			}
				
			.ui-datatable.borderless thead th,
			.ui-datatable.borderless tbody,
			.ui-datatable.borderless tbody tr,
			.ui-datatable.borderless tbody td {
    			border-style: none;
    			padding:4px 10px !important;
    			border: 0px !important;
    			
			}
			.ui-datatable.borderless table{
				border:0 !important;
				border-collapse:collapse !important;
			}
			
			.borderless.ui-datatable .ui-datatable-tablewrapper {
			    overflow:hidden !important;
			    padding:0px !important;
			}
			
			.ui-datatable.borderless.ui-datatable-resizable{
				padding:0px;
			}
			
			.ui-row-toggler{
				margin-left:auto !important;
				margin-right:auto !important;
			}
			
			tr.ui-widget-content.ui-datatable-odd.ui-expanded-row ~ tr.ui-expanded-row-content.ui-widget-content td{
				background-color:#F9F9F9 !important;
			}
			
			tr.ui-widget-content.ui-datatable-even.ui-expanded-row ~ tr.ui-expanded-row-content.ui-widget-content td{
				background-color:white !important;
			}
			
			@-moz-document url-prefix() {
				tr.ui-expanded-row-content.ui-widget-content td[colspan="11"]:first-child{
	    			padding: 0px;
	    			border-top: 0 !important;
	    			border-right: 0 !important;  
	    			border-bottom : 0 !important;
    			}
			}
			
			@media screen and (-ms-high-contrast: active), (-ms-high-contrast: none) { 
    			.ui-datatable.borderless tbody td:last-child {
	    			border-right: 0 !important;
				}
				.ui-datatable.borderless tbody tr:last-child td {
	    			border-bottom: 0 !important;
				}
				.ui-datatable table{
					width:auto; !important;
				}
			}
		</style>
	
	
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
		<p:panel id="purchaseOrderPanel" header="#{lbl['lbl.fl.purchaseorder']}" toggleable="true">
		<p:messages id="messages" showSummary="false" showDetail="true"  closable="true" severity="error,info" />
			<table style="width: 100%">

			<tr>
				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.fl.doc.search.purchase.order.no']}" /></td>
				<td width="40%"><p:inputText size="35"
						value="#{flOrderBB.managedBean.docNo}"></p:inputText></td>


				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.fl.doc.search.datatable.title']}" /></td>
				<td width="40%"><p:inputText size="60"
						value="#{flOrderBB.managedBean.title}"></p:inputText></td>

			</tr>
				<tr>
					<td width="10%"><p:outputLabel
							value="#{lbl['lbl.fl.ptj.name']}" /></td>
					<td width="40%"><ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="56" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							value="#{flOrderBB.managedBean.selectedOrgProfile.orgName}"
							saveObject="flOrderBB.managedBean.selectedOrgProfile"	
							>			
						</ac:lov>
					</td>

					<td width="10%"><p:outputLabel
							value="#{lbl['lbl.fl.status']}" /></td>
					<td width="40%"><p:selectOneMenu id="docStatus"
							style="width: 200px;"
							value="#{flOrderBB.managedBean.docStatusId}">
							<f:selectItems value="#{flOrderBB.managedBean.docStatusList}"
								itemLabel="#{docStatus.statusName}" var="docStatus"
								itemValue="#{docStatus.statusDescId}"></f:selectItems>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td width="10%"><p:outputLabel value="#{lbl['lbl.fl.created.date.from']} " /></td>
					<td width="40%"><p:calendar showOn="button" navigator="true" id="createdDateFrom"
							display="inline" readonlyInput="true"
							value="#{flOrderBB.managedBean.fromDate}" size="9"
							maxdate="#{flOrderBB.managedBean.toDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form" >
							<p:ajax event="dateSelect" update="createdDateTo"
							 />
							</p:calendar></td>
							
					<td width="10%"><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
					<td width="40%"><p:calendar showOn="button" navigator="true" id="createdDateTo"
							display="inline" readonlyInput="true"
							mindate="#{flOrderBB.managedBean.fromDate}" 
							value="#{flOrderBB.managedBean.toDate}" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
							<p:ajax event="dateSelect" update="createdDateFrom"
							 />
						</p:calendar></td>

				</tr>
			</table>
			</p:panel>
			<p:panel id="deliveryOrderPanel" header="#{lbl['lbl.fl.deliveryorder']}" toggleable="true">
					
			<table style="width: 100%">

			<tr>
				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.fl.doc.search.delivery.order.no']}" /></td>
				<td width="40%"><p:inputText size="35"
						value="#{flOrderBB.managedBean.delOrdNo}"></p:inputText></td>


				<td width="10%"><p:outputLabel
							value="#{lbl['lbl.fl.status']}" /></td>
					<td width="40%"><p:selectOneMenu id="delOrderStatus"
							style="width: 200px;"
							value="#{flOrderBB.managedBean.delOrdStatusId}">
							<f:selectItems value="#{flOrderBB.managedBean.docDeliveryOrderStatusList}"
								itemLabel="#{docStatus.statusName}" var="delOrderStatus"
								itemValue="#{docStatus.statusDescId}"></f:selectItems>
						</p:selectOneMenu></td>

			</tr>
				<tr>
					<td width="10%"><p:outputLabel
						value="#{lbl['lbl.fl.doc.search.supplier.delivery.order.no']}" /></td>
					<td width="40%"><p:inputText size="35"
						value="#{flOrderBB.managedBean.delOrdSupNo}"></p:inputText></td>
				</tr>
			</table>
			
			</p:panel>
			<div class="clear"></div>
			<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{flOrderBB.searchPendingDeliveryList}"
					update="flPendingDoListDt,messages" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					action="#{flOrderBB.searchReset}" 
					update=":form" />
			</div>
		</p:panel>
		
		<p:dataTable value="#{flOrderBB.managedBean.pendingDoDataModel}" lazy="true"
			var="pending" id="flPendingDoListDt" rowIndexVar="rowIndex" width="100%" rows="10">
			<ac:paginator for="flPendingDoListDt" />
			<p:column style="width:25px">
            	<p:rowToggler rendered="#{not empty pending.flDeliveryOrders}" />
        	</p:column>
			<p:column headerText="#{lbl['lbl.fl.dopending.order.number']}" style="text-align:center">
				<h:outputText value="#{pending.docNo}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.doc.search.datatable.doc.type']}" style="text-align:center">
				<h:outputText value="#{flOrderBB.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, pending.docType)}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.doc.search.datatable.title']}" style="white-space:normal;text-align:center">
				<p:commandLink value="#{pending.flFulfilmentRequest.title}"
					action="#{flOrderBB.navigateToFlOrder(rowIndex)}" style="text-align:left;float:left;">
					<f:setPropertyActionListener
						target="#{flOrderBB.managedBean.selectedFlOrder}"
						value="#{pending}"></f:setPropertyActionListener>
						<f:param name="status" value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" />
				</p:commandLink>				
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ptj.name']}" style="white-space:normal;text-align:center">
				<h:outputText value="#{flOrderBB.retrievePTJByOrgProfileId(pending.flFulfilmentRequest.preparedOrgProfile.orgProfileId, pending.flFulfilmentRequest.agApprovedDate)}" style="text-align:left;float:left;"/>
			</p:column>			
			<p:column headerText="#{lbl['lbl.fl.created.date']}" style="text-align:center">
				<h:outputText value="#{pending.createdDate}" style="float:left;">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Status" style="white-space:normal;text-align:center">
				<h:outputText value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" style="text-align:left;float:left;" />
			</p:column>
			
			<p:rowExpansion>
			
			<p:dataTable id="delSubListTree" var="deliveryExpansion"  rowIndexVar="index" width="100%"
					value="#{pending.flDeliveryOrders}"  resizableColumns="true">
					
					<p:column headerText="#{lbl['lbl.fl.delivery.order.index']}" style="text-align:center" width="3%">
						<h:outputText value="#{index + 1}" >
						</h:outputText>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.fl.delivery.order.number']}" style="text-align:center" width="27%">
						<p:commandLink value="#{deliveryExpansion.deliveryOrderNo}"
							onclick="goToDetail([{name:'docType', value:'DO'}, {name:'docId', value:'#{deliveryExpansion.deliveryOrderId}'},{name:'buttonVal', value:'VIEW'}, {name:'isPendingDelivery', value:'true'} , {name:'statusDesc', value:'#{deliveryExpansion.status.statusId}'}])" style="float:left;">
						</p:commandLink>				
					</p:column>
					
					<p:column headerText="#{lbl['lbl.fl.delivery.order.number.supplier']}" style="text-align:center;width:300px" width="50%" >
						<h:outputText value="#{deliveryExpansion.supplierDoRef}"  style="float:left;">
						</h:outputText>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.fl.delivery.order.status']}" style="text-align:center" width="20%">
						<h:outputText value="#{flOrderBB.getStatusDescById(deliveryExpansion.status.statusId)}" style="float:left;"/>
					</p:column>
					
			</p:dataTable>
			
			<p:remoteCommand action="#{flDocumentBackingBean.navigateToPage}" name="goToDetail" />
			
		</p:rowExpansion>
			
		</p:dataTable>

	<ac:lovPopup />
	</ui:define>
	
</ui:composition>
