<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="STOP DELIVERY" action="#{flOrderBB.stopDelivery}" ></p:commandButton>
		</div>
		<p:panel header="FULFILMENT DETAIL" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="Ministry" /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
					<td><p:outputLabel value="Purchase Req. NO." /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Issued Jabatan" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItems />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Req. Note NO" /></td>
					<td><p:inputText disabled="true" style="width: 260px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Issued PTJ" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItems />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Plan NO." /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Received Jabatan" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItems />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Procurement Type" /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Received PTJ" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItems />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Creation Date" /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
				</tr>
				<tr>
					<td rowspan="4"><p:outputLabel value="* Title" /></td>
					<td rowspan="4"><p:inputTextarea rows="8"
							style="width: 260px;" /></td>
					<td><p:outputLabel value="Status" /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="*Financial Year" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItem itemLabel="2012" itemValue="2012" />
							<f:selectItem itemLabel="2013" itemValue="2013" />
							<f:selectItem itemLabel="2014" itemValue="2014" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value=" *Maksud  Code" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItem itemLabel="Select One" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="*AG Office" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItem itemLabel="002 KAWANGAN KL" itemValue="1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="*Charge PTJ" /></td>
					<td><p:selectOneMenu style="width: 260px;">
							<f:selectItems />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Financing?" /></td>
					<td><p:selectBooleanCheckbox /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="DELIVERY ADDRESS DETAILS" toggleable="true">
			<br />
			<p:dataTable value="#{flOrderBB.managedBean.deliveryAddressList}"
				var="delivery" id="deliveryTable" rowIndexVar="rowIndex"
				width="100%">
				<ac:paginator for="deliveryTable" />

				<p:column headerText="Del Address Id">
					<p:commandLink value="#{delivery.deliveryAddressId}"
						action="#{flOrderBB.navigateToDO(rowIndex)}">
					</p:commandLink>
				</p:column>
				<p:column headerText="Del Address">
					<h:outputText value="#{delivery.addressType.pmAddress.address1}" />
				</p:column>
				<p:column headerText="Start Date">
					<h:outputText value="#{delivery.startDate}">
						<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
					</h:outputText>
				</p:column>
				<p:column headerText="End Date">
					<h:outputText value="#{delivery.endDate}">
						<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
					</h:outputText>
				</p:column>
				<p:column headerText="Status">
					<h:outputText value="Active" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="DELIVERY ORDER" toggleable="true">
			<br />
			<p:dataTable value="#{flOrderBB.managedBean.deliveryOrderStatusList}"
				var="deliveryOrder"  id="doTable"
				rowIndexVar="rowIndex" width="100%">
				<p:column headerText="Del Order No">
					<h:outputText value="#{deliveryOrder.deliveryOrderId}" />
				</p:column>
				<p:column headerText="Start Date">
					<h:outputText value="#{deliveryOrder.estStartDate}">
						<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
					</h:outputText>
				</p:column>
				<p:column headerText="End Date">
					<h:outputText value="#{deliveryOrder.estEndDate}">
						<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
					</h:outputText>
				</p:column>
				<p:column headerText="Status">
					<h:outputText value="CREATED" />
				</p:column>

			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
