<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />		
		<p:selectOneMenu
			value="#{flDocumentBackingBean.managedBean.tempLoginId}">
			<f:selectItem itemLabel="CURRENT LOGIN" itemValue="0" />
			<f:selectItem itemLabel="Roslan" itemValue="roslan" />
			<f:selectItem itemLabel="Lailah" itemValue="lailah" />
			<f:selectItem itemLabel="Khai" itemValue="khai" />
			<f:selectItem itemLabel="Alex" itemValue="alex" />
			<p:ajax event="change" update="defineSearchTbl" listener="#{flDocumentBackingBean.selectedUser}" />
		</p:selectOneMenu>		
		<p:panel id="searchPanel" header="SEARCH" toggleable="true">
			<table>
				<tr>
					<td>
						<p:selectOneRadio id="searchRadio" value="#{flDocumentBackingBean.managedBean.searchType}">
							<f:selectItem itemValue="D" itemLabel="Define Search" />
							<!--  <f:selectItem itemValue="A" itemLabel="Advance Search" /> -->
							<p:ajax event="click" listener="#{flDocumentBackingBean.advanceSearch()}" update="advanceSearchID" />
						</p:selectOneRadio>
					</td>
				</tr>
			</table>
			<h:panelGroup id="defineSearchTbl">
				<h:panelGrid columns="3" columnClasses="cmWidth1">
					<p:outputLabel value="Fulfilment Order Type" />
					<p:selectOneMenu value="#{flDocumentBackingBean.managedBean.searchOrderType}">
						<f:selectItems value="#{flDocumentBackingBean.getDropdownCodeValues(PmCodeCatConst.fulfilmentOrderType)}" />
						<p:ajax event="change" update="defineSearchTbl"	listener="#{flDocumentBackingBean.selectedDoctype}" />
					</p:selectOneMenu>
				</h:panelGrid>
				<h:panelGrid columns="3" columnClasses="cmWidth1" >
					<p:outputLabel value="Document Type" />
					<p:selectOneMenu value="#{flDocumentBackingBean.managedBean.searchDocType}">
						<f:selectItems value="#{flDocumentBackingBean.getDropdownCodeValues(PmCodeCatConst.fulfilmentDocumentType)}" />
						<p:ajax event="change" update="defineSearchTbl" listener="#{flDocumentBackingBean.selectedDoctype}" />
					</p:selectOneMenu>
				</h:panelGrid>
			</h:panelGroup>		
			<p:outputPanel id="advanceSearchID" style="width:100%">
				
			</p:outputPanel>	
			<p:commandButton value="search"	action="#{flDocumentBackingBean.searchDocument}" update="resultPanel" />
		</p:panel>	
		<p:panel id="resultPanel" header="RESULT" toggleable="true">
			<p:dataTable id="flDocListDt" value="#{flDocumentBackingBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}" width="100%">
	
			 	<ac:paginator for="flDocListDt" />
			 	
				<p:column headerText="Document Type">
					<h:outputText value="#{flDocument.docType}" />
				</p:column>
				<p:column headerText="Doc No">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="Contract No.">
					<h:outputText value="#{flDocument.contractNo}" />
				</p:column>
				<p:column headerText="Circular No.">
					<h:outputText value="#{flDocument.circularNo}" />
				</p:column>	
				<p:column headerText="Status">
					<h:outputText value="#{flDocument.status.statusId}" />
				</p:column>										
				<p:column headerText="Detail">
					<p:commandButton action="#{flDocumentBackingBean.navigateToFulfillmentDet(rowIndex)}" value="Detail">
						<f:param name="flDocId" value="#{flDocument.docId}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
