<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<p:selectOneMenu
			value="#{flDocumentBackingBean.managedBean.tempLoginId}">
			<f:selectItem itemLabel="CURRENT LOGIN" itemValue="0" />
			<f:selectItem itemLabel="Roslan" itemValue="roslan" />
			<f:selectItem itemLabel="Lailah" itemValue="lailah" />
			<f:selectItem itemLabel="Khai" itemValue="khai" />
			<f:selectItem itemLabel="Alex" itemValue="alex" />
			<p:ajax event="change" update="defineSearchTbl"
				listener="#{flDocumentBackingBean.selectedUser}" />
		</p:selectOneMenu>
		<p:panel id="searchPanel" header="SEARCH" toggleable="true">
			<table>
				<tr>
					<td><p:selectOneRadio id="searchRadio"
							value="#{flDocumentBackingBean.managedBean.searchType}">
							<f:selectItem itemValue="D" itemLabel="Define Search" />
							<!--  <f:selectItem itemValue="A" itemLabel="Advance Search" /> -->
							<p:ajax event="click"
								listener="#{flDocumentBackingBean.advanceSearch()}"
								update="advanceSearchID" />
						</p:selectOneRadio></td>
				</tr>
			</table>
			<h:panelGroup id="defineSearchTbl">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.fl.order.type']}" />
					<p:selectOneMenu
						value="#{flDocumentBackingBean.managedBean.searchOrderType}">
						<f:selectItems
							value="#{flDocumentBackingBean.getDropdownCodeValues(PmCodeCatConst.fulfilmentOrderType)}" />
					</p:selectOneMenu>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.doc.type']}" />
					<p:selectOneMenu
						value="#{flDocumentBackingBean.managedBean.searchDocType}">
						<f:selectItems
							value="#{flDocumentBackingBean.getDropdownCodeValues(PmCodeCatConst.fulfilmentDocumentType)}" />
						<p:ajax event="change" update="docTypeSearch"
							listener="#{flDocumentBackingBean.selectedDoctype}" />
					</p:selectOneMenu>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.doc.no']}" />
					<p:inputText size="50"
						value="#{flDocumentBackingBean.managedBean.searchDocNo}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTypeSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.contract.no']}"  />
					<p:inputText size="50"
						value="#{flDocumentBackingBean.managedBean.searchContractNo}"></p:inputText>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.circular.no']}" />
					<p:inputText size="50"
						value="#{flDocumentBackingBean.managedBean.searchCircularNo}"></p:inputText>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.loa.no']}" />
					<p:inputText size="50"
						value="#{flDocumentBackingBean.managedBean.searchLoaNo}"></p:inputText>
				</h:panelGrid>

			</h:panelGroup>
			<p:outputPanel id="advanceSearchID" style="width:100%">
			</p:outputPanel>
			<p:commandButton value="search" icon="ui-icon-search"
				action="#{flDocumentBackingBean.searchDocument}"
				update="resultPanel" />
		</p:panel>
		<p:panel id="resultPanel" header="RESULT" toggleable="true">
			<p:dataTable id="flDocListDt"
				value="#{flDocumentBackingBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}"
				width="100%">

				<ac:paginator for="flDocListDt" />

				<p:column headerText="Document Type">
					<h:outputText value="#{flDocument.docType}" />
				</p:column>
				<p:column headerText="Doc No">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="Contract No.">
					<h:outputText value="#{flDocument.contractNo}" />
				</p:column>
				<p:column headerText="Circular No.">
					<h:outputText value="#{flDocument.circularNo}" />
				</p:column>
				<p:column headerText="Status">
					<h:outputText value="#{flDocument.status.statusId}" />
				</p:column>

				<p:column headerText="Action" style="text-align: center">
					<p:commandButton
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'View'}])"
						value="View" />
					<p:commandButton
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Update'}])"
						value="Update" />
					<p:commandButton
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Cancel'}])"
						value="Cancel" />
					<p:commandButton rendered="#{flDocument.docType == 'CR'}"
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'complain'}])"
						value="Complain" />
				</p:column>

			</p:dataTable>
			<p:remoteCommand action="#{flDocumentBackingBean.navigateToPage}"
				name="goToDetail" />



		</p:panel>
	</ui:define>
</ui:composition>
