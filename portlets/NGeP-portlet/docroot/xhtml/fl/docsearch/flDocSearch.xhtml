<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />

		<p:panel id="searchPanel" header="SEARCH" toggleable="true">

			<h:panelGroup id="defineSearchTbl">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.fl.order.type']}" />
					<p:selectOneMenu
						value="#{flDocumentBackingBean.managedBean.searchOrderType}" style="width: 207px;">
						<f:selectItems
							value="#{flDocumentBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentOrderType)}"/>
					</p:selectOneMenu>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.doc.type']}" />
					<p:selectOneMenu
						value="#{flDocumentBackingBean.managedBean.searchDocType}" style="width: 207px;">
						<f:selectItems
							value="#{flDocumentBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentDocumentType)}" />
						<p:ajax event="change" update="docTypeSearch"
							listener="#{flDocumentBackingBean.selectedDoctype}" />
					</p:selectOneMenu>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.doc.no']}" />
					<p:inputText size="35"
						value="#{flDocumentBackingBean.managedBean.searchDocNo}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTypeSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.contract.no']}" />
					<p:inputText size="35"
						value="#{flDocumentBackingBean.managedBean.searchContractNo}"></p:inputText>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.circular.no']}" />
					<p:inputText size="35"
						value="#{flDocumentBackingBean.managedBean.searchCircularNo}"></p:inputText>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.loa.no']}" />
					<p:inputText size="35"
						value="#{flDocumentBackingBean.managedBean.searchLoaNo}"></p:inputText>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="cmWidth1" 
					rendered="#{flDocumentBackingBean.managedBean.checkPoDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.search.procurement.type']}" />
					<p:inputText size="35"
						value="#{flDocumentBackingBean.managedBean.searchProcurementType}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<p:outputPanel id="advanceSearchID" style="width:100%">
			</p:outputPanel>
			<table style="width: 100%;">
				<tr>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="Search" icon="ui-icon-search"
							action="#{flDocumentBackingBean.searchDocument}"
							update="resultPanel" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel id="resultPanel" header="RESULT" toggleable="true">
			<p:dataTable id="flDocListDt"
				value="#{flDocumentBackingBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}"
				width="100%">

				<ac:paginator for="flDocListDt" />

				<p:column headerText="Document Type">
					<h:outputText value="#{flDocumentBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, flDocument.docType)}" />
				</p:column>
				<p:column headerText="Doc No">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="Contract No.">
					<h:outputText value="#{flDocument.contractNo}" />
				</p:column>
				<p:column headerText="Circular No.">
					<h:outputText value="#{flDocument.circularNo}" />
				</p:column>
				<p:column headerText="Status">
				<h:outputText value="#{flDocument.workflowStatus}" />
				</p:column>

				<p:column headerText="Action" style="text-align: center">
					<p:commandLink
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'View'}])">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							title="View Document" />
					</p:commandLink>
					<p:spacer width="7" />
					<p:commandLink
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Update'}])">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png"
							title="Update Document" />
					</p:commandLink>
					<p:spacer width="7" />
					<p:commandLink
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Cancel'}])">
						<p:graphicImage library="ep/images/design" name="cancel.png"
							value="/resources/ep/images/design/cancel.png"
							title="Cancel Document" />
					</p:commandLink>
					<p:spacer width="7" />
					<p:commandLink rendered="#{flDocument.docType == 'CR'}"
						onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'complain'}])">
						<p:graphicImage library="ep/images/design" name="exclamation.png"
							value="/resources/ep/images/design/exclamation.png"
							title="Complain" />
					 </p:commandLink>

				</p:column>

			</p:dataTable>
			<p:remoteCommand action="#{flDocumentBackingBean.navigateToPage}"
				name="goToDetail" />



		</p:panel>
	</ui:define>
</ui:composition>
