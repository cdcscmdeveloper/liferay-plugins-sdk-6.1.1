<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
			<h:panelGroup id="orderTypeSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.type']}" />
					<p:selectOneMenu
						value="#{flDocumentBackingBean.managedBean.searchOrderType}"
						style="width: 314px;">
						<f:selectItems
							value="#{flDocumentBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentOrderType)}" />
						<p:ajax event="change" update="searchPanel"
							listener="#{flDocumentBackingBean.selectedOrderType}" />
					</p:selectOneMenu>
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.no']}" style="padding-left : 300px;"/>
					<p:inputText size="28" maxlength="17" 
						value="#{flDocumentBackingBean.managedBean.searchOrderNo}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTYpeSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.type']}"	/>
					<p:selectOneMenu id="searchDocTypeDD" style="width: 314px;"
						value="#{flDocumentBackingBean.managedBean.searchDocType}">
						<f:selectItems
							value="#{flDocumentBackingBean.getDocumentTypeDropDown()}" />
						<p:ajax event="change"
							update="docTypeSearch,docStatusSearch,docDoStatusSearch,docInvStatusSearch"
							listener="#{flDocumentBackingBean.selectedDoctype}" />
					</p:selectOneMenu>
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}" style="padding-left : 274px;"/>
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchDocNo}"></p:inputText>	
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth" >
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
					<p:selectOneMenu id="statusId"
						value="#{flDocumentBackingBean.managedBean.statusDescId}"
						style="width: 314px;">
						<f:selectItems value="#{flDocumentBackingBean.getStatusDropdownValues('FL',flDocumentBackingBean.managedBean.searchDocType)}" />
					</p:selectOneMenu>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGrid columns="4" columnClasses="flDocSearchWidth" >
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.supp.name']}" />
				<p:inputText size="45"
					value="#{flDocumentBackingBean.managedBean.searchSuppName}"></p:inputText>
			</h:panelGrid>
			<h:panelGroup id="docDoStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDoDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.supp.reference']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchSuppDoRef}"></p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.supp.ref']}"/>	
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docInvStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkInDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.inv.ref']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchSuppInvRef}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTypeSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.circular.no']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchLoaNo}"></p:inputText>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phyloa']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.contract.no']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no']}"/>
				</h:panelGrid>
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDocType}">
					<p:outputLabel
						value="#{lbl['lbl.fl.doc.maintain.circular.contract.duration']}" />
					<p:calendar mode="popup" showOn="button"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{flDocumentBackingBean.managedBean.searchContractFromDuration}">
					</p:calendar>
					<p:spacer width="5" />
					<p:calendar mode="popup" showOn="button"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{flDocumentBackingBean.managedBean.searchContractToDuration}">
					</p:calendar>
				</h:panelGrid>
			</h:panelGroup>
			<p:outputPanel id="advanceSearchID" style="width:100%">
			</p:outputPanel>

			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{flDocumentBackingBean.searchDocument}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					icon="ui-icon-search" update="resultPanel" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					action="#{flDocumentBackingBean.searchReset}" icon="ui-icon-reset"
					update=":form"  title="#{lbl['lbl.fl.tooltip.doc.maintain.reset']}"/>
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.doc.maintain.result']}"/>
			<p:dataTable id="flDocListDt"
				value="#{flDocumentBackingBean.managedBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}"
				width="100%">
				<ac:paginator for="flDocListDt" />
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.doc.type']}">
					<h:outputText
						value="#{flDocumentBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, flDocument.docType)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.order.no']}">
					<h:outputText value="#{flDocument.orderNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.doc.title']}">
					<h:outputText value="#{flDocument.title}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.contract.no']}">
					<h:outputText value="#{flDocument.contractNo}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.circular.no']}">
					<h:outputText value="#{flDocument.circularNo}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.doc.status']}">
					<h:outputText
						value="#{flDocumentBackingBean.getStatusDescById(flDocument.status.statusId)}" />
				</p:column>  
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.action.no']}"
					style="text-align: center">
					<p:menuButton value="">
									<p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.view']}"  
							        rendered="#{flDocument.isViewAction()}"
							        onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'View'}])"/>
									<p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.update']}"  
							        rendered="#{flDocument.isUpdateAction()}"
							        onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Update'}])"/>
							        <p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.cancel']}" 
							        rendered="#{flDocument.isCancelAction()}"
									onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Cancel'}])"/>
							        <p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.stop.fulfilment']}"  
							        rendered="#{flDocument.isStopFulfilmentAction()}"
							        onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Stop Fulfilment'}])"/>
							        <p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.factory.comp.removal']}"  
							        rendered="#{flDocument.isRemoveFactoringAction()}"
							        onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Remove Factoring'}])"/>
					</p:menuButton>
				</p:column>
			</p:dataTable>
			<p:remoteCommand action="#{flDocumentBackingBean.navigateToPage}"
				name="goToDetail" />



		</p:panel>
	</ui:define>
</ui:composition>
