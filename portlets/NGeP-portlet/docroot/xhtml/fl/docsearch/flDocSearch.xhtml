<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
				
				.highlight-mark:before {
 					color: red;
 					content: "*";
				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
			<h:panelGroup id="orgSearch">
			<table>
				<tr>
					<td style="width: 190px;">
						<p:outputLabel value="#{lbl['lbl.fl.ministry']}"	/><p:outputLabel
						value="*" styleClass="mandatory" />
					</td>
					<td>
						<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="46" readonly="true" style="width:314px"
							disabled="#{flDocumentBackingBean.disableMinistryLov()}"
							headerText="#{lbl['lbl.fl.ministry']}" 
							value="#{flDocumentBackingBean.managedBean.ministry.orgName}"
							postUpdateListener="flDocumentBackingBean.resetPtjGroupProfile()"
							update=":form:searchPtj,:form:orgSearch"
							saveObject="flDocumentBackingBean.managedBean.ministry">
						</ac:lov>
					</td>
				</tr>
				<tr>
					<td style="width: 190px;">
						<p:outputLabel value="#{lbl['lbl.fl.jabatan']}"	/>
					</td>
					<td>
						<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="46" readonly="true" style="width:314px"
							disabled="#{flDocumentBackingBean.disablePtjGroupLov()}"
							headerText="#{lbl['lbl.fl.jabatan']}" 
							value="#{flDocumentBackingBean.managedBean.ptjGroup.orgName}"
							postUpdateListener="flDocumentBackingBean.resetPtjProfile()"
							update=":form:searchPtj,:form:orgSearch"
							saveObject="flDocumentBackingBean.managedBean.ptjGroup"
							conditionField="#{flDocumentBackingBean.constuctConditionFieldsForPTJGroup()}">
						</ac:lov>
					</td>
				</tr>
				<tr>
					<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.ptj']}"	/></td>
					<td>
						<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="46" readonly="true" style="width:314px"
							disabled="#{flDocumentBackingBean.disablePtjLov()}"
							headerText="#{lbl['lbl.fl.ptj']}"
							value="#{flDocumentBackingBean.managedBean.ptj.orgName}"
							saveObject="flDocumentBackingBean.managedBean.ptj"	
							conditionField="#{flDocumentBackingBean.getPTJCondition()}">			
						</ac:lov>
					</td>
				</tr>
			</table>
			</h:panelGroup>
			<table>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.type']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						value="#{flDocumentBackingBean.managedBean.searchOrderType}"
						style="width: 314px;">
						<f:selectItems
							value="#{flDocumentBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentOrderType)}" />
						<p:ajax event="change" update="form:searchPanel"
							listener="#{flDocumentBackingBean.selectedOrderType}"/>
					</p:selectOneMenu></td>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.no']}" /></td>
				<td><p:inputText size="28" maxlength="17" 
						value="#{flDocumentBackingBean.managedBean.searchOrderNo}"></p:inputText></td>
			</tr>
			<tr>
			<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.type']}"	/></td>
			<td><p:selectOneMenu id="searchDocTypeDD" style="width: 314px;"
						value="#{flDocumentBackingBean.managedBean.searchDocType}">
						<f:selectItems
							value="#{flDocumentBackingBean.getDocumentTypeDropDown()}" />
						<p:ajax event="change"
							update="docTypeSearch,docStatusSearch,docDoStatusSearch,docInvStatusSearch"
							listener="#{flDocumentBackingBean.selectedDoctype}" />
					</p:selectOneMenu></td>
			<td ><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}" /></td>
			<td><p:inputText size="28" value="#{flDocumentBackingBean.managedBean.searchDocNo}" />
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.document.no']}"/>	
			</td>
			</tr>
			</table>
			<h:panelGroup id="docStatusSearch">
				<table>
					<tr>
						<td style="width: 190px;"><p:outputLabel
								value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
						<td><p:selectOneMenu id="statusId"
								value="#{flDocumentBackingBean.managedBean.statusDescId}"
								style="width: 314px;">
								<f:selectItems
									value="#{flDocumentBackingBean.getStatusDropdownValues('FL',flDocumentBackingBean.managedBean.searchDocType)}" />
								<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>	
							</p:selectOneMenu></td>
						<td style="width: 250px;"><p:outputLabel
								value="#{lbl['lbl.fl.financial.year']}" /></td>
						<td><p:selectOneMenu id="searchFinancialYear"
								style="width: 100px;"
								value="#{flDocumentBackingBean.managedBean.searchFinancialYear}">
								<f:selectItems
									value="#{flDocumentBackingBean.getFinancialYearOpt()}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</h:panelGroup>
			<h:panelGrid columns="4" columnClasses="flDocSearchWidth" >
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.business.company.name']}" />
				<p:inputText size="45"
					value="#{flDocumentBackingBean.managedBean.searchSuppName}"></p:inputText>
			</h:panelGrid>
			
			<h:panelGroup id="docDoStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkDoDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.supp.reference']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchSuppDoRef}"></p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.supp.ref']}"/>	
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docInvStatusSearch">
				<h:panelGrid columns="4" columnClasses="flDocSearchWidth"
					rendered="#{flDocumentBackingBean.managedBean.checkInDocType}">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.supp.reference']}" />
					<p:inputText size="28"
						value="#{flDocumentBackingBean.managedBean.searchSuppInvRef}"></p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.supp.ref']}"/>	
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTypeSearch">
			
				<table>
					<tr>
						<td style="width: 190px;"><p:outputLabel rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.sistem.panel.name']}" /></td>
						<td><p:inputText size="28" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
						value="#{flDocumentBackingBean.managedBean.searchCentralContractName}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.central.contract.name']}" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"/></td>
						<td style="width: 340px;"><p:outputLabel rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.doc.maintain.circular.no']}" /></td>
						<td><p:inputText size="28" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
						value="#{flDocumentBackingBean.managedBean.searchCircularNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.treasury.circular']}" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"/></td>
					</tr>
					<tr>
						<td style="width: 190px;"><p:outputLabel rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.doc.maintain.loa.no']}" /></td>
						<td><p:inputText size="28" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
						value="#{flDocumentBackingBean.managedBean.searchLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa']}" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"/></td>
						<td style="width: 340px;"><p:outputLabel rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" /></td>
						<td><p:inputText size="28" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
						value="#{flDocumentBackingBean.managedBean.searchPhysLoaNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phyloa']}" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"/></td>
					</tr>
					<tr>
						<td style="width: 190px;"><p:outputLabel rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.doc.maintain.contract.no']}" /></td>
						<td><p:inputText size="28" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
						value="#{flDocumentBackingBean.managedBean.searchContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no']}" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"/></td>
						<td style="width: 340px;"><p:outputLabel rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.physical.contract.no']}" /></td>
						<td><p:inputText size="28" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
						value="#{flDocumentBackingBean.managedBean.searchPhysContractNo}"></p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no']}" rendered="#{flDocumentBackingBean.managedBean.checkDocType}"/></td>
					</tr>
					<tr>
						<td style="width: 190px;"><p:outputLabel
								rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.doc.maintain.contract.start.date']}" /></td>
						<td><p:calendar mode="popup" showOn="button"
								id="calendarStart" readonlyInput="true"
								rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								value="#{flDocumentBackingBean.managedBean.searchContractFromDuration}">
							</p:calendar> </td>
						<td style="width: 340px;"><p:outputLabel
								rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								value="#{lbl['lbl.fl.doc.maintain.contract.end.date']}" /></td>
						<td><p:calendar mode="popup" showOn="button" id="calendarEnd"
								readonlyInput="true"
								rendered="#{flDocumentBackingBean.managedBean.checkDocType}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								value="#{flDocumentBackingBean.managedBean.searchContractToDuration}">
							</p:calendar></td>
					</tr>
				</table>
			</h:panelGroup>
			
			<p:outputPanel id="advanceSearchID" style="width:100%">
			</p:outputPanel>

			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{flDocumentBackingBean.searchDocument}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					update="resultPanel" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					action="#{flDocumentBackingBean.searchReset}" 
					update=":form"  title="#{lbl['lbl.fl.tooltip.doc.maintain.reset']}"/>
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.doc.maintain.result']}"/>
			<p:dataTable id="flDocListDt"
				value="#{flDocumentBackingBean.managedBean.flDocumentDataModel}" lazy="true"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}" rows="10"
				width="100%">
				<ac:paginator for="flDocListDt" />
				
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.order.type']}" style="white-space:normal;" >
					<h:outputText
						value="#{flDocumentBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentOrderType, flDocument.orderType)}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.doc.type']}" style="white-space:normal;" >
					<h:outputText
						value="#{flDocumentBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, flDocument.docType)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.order.no']}">
					<h:outputText value="#{flDocument.orderNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.doc.title']}" style="white-space:normal;" >
					<h:outputText value="#{flDocument.title}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.contract.no']}" style="white-space:normal;">
					<h:outputText value="#{flDocument.physicalNo}" rendered="#{flDocument.physicalNo != null}"/>
					<h:outputText value="&lt;br/&gt;" escape="false" rendered="#{flDocument.physicalNo != null}"/>
					<h:outputText value="#{flDocument.contractNo}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.circular.no']}">
					<h:outputText value="#{flDocument.circularNo}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.doc.status']}" style="white-space:normal;" >
					<h:outputText
						value="#{flDocumentBackingBean.getStatusDescById(flDocument.statusId)}" />
				</p:column>  
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.action.no']}"
					style="text-align: center">
					<p:menuButton value="#{lbl['lbl.btn.option']}">
									<p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.view']}"  
							        	rendered="#{flDocument.isViewAction()}"
							        	icon="ui-icon-view"
							        	onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'View'}, {name:'statusDesc', value:'#{flDocument.statusId}'}])"/>
									<p:menuitem value="#{lbl['lbl.btn.print']}" ajax="false"
										rendered="#{!(flDocument.docType==ParameterConst.doctypePurchaseRequest || flDocument.docType==ParameterConst.doctypeContractRequest || flDocument.docType==ParameterConst.doctypeShippingInstruction || (flDocument.docType==ParameterConst.doctypeFulfilmentNote and flDocument.statusId!=FulfilmentStatusCont.fnAcknowledged) )}"
										icon="ui-icon-print" 
										action="#{flDocumentBackingBean.generateReport(flDocument.docType, flDocument.docNo, flDocument.taxable)}" />							        
									<p:menuitem value="#{lbl['lbl.btn.print.cogstr']}" ajax="false"
										rendered="#{flDocument.coGSTR}"
										icon="ui-icon-print" 
										action="#{flDocumentBackingBean.generateReport(flDocument.docType, flDocument.docNo, flDocument.taxable)}" />
									<p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.update']}"  
							        	rendered="#{flDocument.isUpdateAction()}"
							        	icon="ui-icon-update"
							        	onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Update'}, {name:'statusDesc', value:'#{flDocument.statusId}'}])"/>
							        <p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.cancel']}" 
							        	rendered="#{flDocument.isCancelAction()}"
							        	icon="ui-icon-fl-cancel"
										onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Cancel'}, {name:'statusDesc', value:'#{flDocument.statusId}'}])"/>
							        <p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.stop.fulfilment']}"  
							        	rendered="#{flDocument.isStopFulfilmentAction()}"
							        	icon="ui-icon-suspension"
							        	onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Stop Fulfilment'}, {name:'statusDesc', value:'#{flDocument.statusId}'}])"/>
							        <p:menuitem value="#{lbl['lbl.fl.doc.maintain.action.factory.comp.removal']}"  
							        	rendered="#{flDocument.isRemoveFactoringAction()}"
							        	icon="ui-icon-termination"
							        	onclick="goToDetail([{name:'docType', value:'#{flDocument.docType}'}, {name:'docId', value:'#{flDocument.docId}'}, {name:'docNo', value:'#{flDocument.docNo}'}, {name:'buttonVal', value:'Remove Factoring'}, {name:'statusDesc', value:'#{flDocument.statusId}'}])"/>
					</p:menuButton>
				</p:column>
			</p:dataTable>
			<p:remoteCommand action="#{flDocumentBackingBean.navigateToPage}"
				name="goToDetail" />
		</p:panel>
		<ac:lovPopup />
	</ui:define>
</ui:composition>
