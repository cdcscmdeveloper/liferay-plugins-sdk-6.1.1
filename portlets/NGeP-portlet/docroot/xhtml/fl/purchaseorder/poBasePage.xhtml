<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction" value="#{flOrderBB.managedBean.actions}">
						<p:commandButton value="#{bpmAction}" ajax='false'
							action="#{flOrderBB.fulfillmentOrderAction(bpmAction)}"
							process="@this" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<c:if test='#{flOrderBB.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{flOrderBB.fulfillmentOrderAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if test='#{flOrderBB.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{flOrderBB.fulfillmentOrderAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>

		<p:tabView id="tt" orientation="left" widgetVar="tt">
			<p:tab title="General">
				<ui:include src="poGeneral.xhtml" />
			</p:tab>
			<p:tab title="Item">
				<ui:include src="poItem.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
