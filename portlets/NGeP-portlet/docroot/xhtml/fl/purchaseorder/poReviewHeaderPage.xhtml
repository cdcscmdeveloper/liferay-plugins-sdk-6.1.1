<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.fl.purchase.request.no']} " /></td>
				<ui:remove>start - #25790</ui:remove>
				<c:choose>
					<c:when test="#{flOrderBB.managedBean.isDpContinuityView()}">
						<td class="header-info-text">
							<p:commandLink value="#{flOrderBB.managedBean.flRequest.docNo}"
								action="#{flOrderBB.navigatePurchaseRequest()}"
								immediate="true" /></td>
					</c:when>
					<c:otherwise>
						<td class="header-info-text"><p:outputLabel
								rendered="#{flOrderBB.hasSupplierRole()}"
								style="font-weight:normal !important"
								value="#{flOrderBB.managedBean.flRequest.docNo}"></p:outputLabel>
							<p:commandLink value="#{flOrderBB.managedBean.flRequest.docNo}"
								action="#{flOrderBB.navigateDocument(flOrderBB.managedBean.flRequest.docType)}"
								immediate="true" rendered="#{!flOrderBB.hasSupplierRole()}" /></td>
					</c:otherwise>
				</c:choose>
				<ui:remove>end - #25790</ui:remove>
				<td><p:outputLabel value="#{lbl['lbl.fl.do.poco.no']} " /></td>
				<td class="header-info-text">
					<p:outputLabel style="font-weight:normal !important" value="#{flOrderBB.managedBean.fulfilmentOrder.docNo}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']} " />
				</td>
				<td class="header-info-text">
					<p:outputLabel style="font-weight:normal !important" value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']} " />
				</td>
				<td class="header-info-text">
					<p:outputLabel style="font-weight:normal !important" value="#{flOrderBB.getStatusDescById(flOrderBB.managedBean.fulfilmentOrder.status.statusId)}" />
				</td>
			</tr>
		</table>
	</div>
	<p:spacer height="10px" />

</ui:composition>
