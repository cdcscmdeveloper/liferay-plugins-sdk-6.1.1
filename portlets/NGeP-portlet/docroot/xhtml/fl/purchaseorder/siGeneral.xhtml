<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="REQUEST DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" id="ministry"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4" id="title"
						disabled="true" style=" margin-bottom:5px;"
						value="#{flOrderBB.managedBean.flRequest.title}" /> <h:outputText
						value="" /></td>						
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="5" id="preparedOrgProfileId" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" id="issuedOrgProfileId" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText id="chargedPtj" size="39" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Requistioner" /></td>
				<td><p:inputText size="50" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.requistioner.userName}" />
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="16"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.smSupplier.regNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.flRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="16"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	
	<h:panelGroup>
		<p:panel header="STOP INSTRUCTION REASON" toggleable="true" id="stopInstructionPnl"
			rendered="#{flOrderBB.managedBean.buttonVal eq 'Stop Fulfilment'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 116px;"><p:outputLabel
						value="Reason"/>
					<p:outputLabel value="*" styleClass="mandatory"/></td>
				<td style="width: 295px;"><p:selectOneMenu id="reasonId" label="Reason" required="true"
						style="width:365px;margin-bottom: 5px;"
						value="#{flOrderBB.managedBean.stopIns.pmReason.reasonCode}">
						<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItems value="#{flOrderBB.populateReasonList}" var="reason"
							itemLabel="#{reason.reasonDesc}"
							itemValue="#{reason.pmReason.reasonCode}"/>
						<p:ajax event="change" update="otherId"/>
					</p:selectOneMenu> 
					</td>
					<td><p:message for="reasonId" display="icon" /></td>
					<td style="width: 257px;"><p:outputLabel
							value="Submission Date" /></td>
					<td><p:inputText value="#{flOrderBB.managedBean.stopIns.createdDate}" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText> </td>
				</tr>
				<tr>
					<td><p:outputLabel value="Others" /></td>
					<td><p:inputText size="50" value="#{flOrderBB.managedBean.stopIns.reasonDesc}" id="otherId" 
					disabled="#{flOrderBB.managedBean.stopIns.pmReason.reasonCode ne 'OTHERS'}" /></td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>
	
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
