<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="AGENCY DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" id="ministry"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="50" id="preparedPtj"
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}"
						disabled="true" />
				</td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="50" id="issuePtj"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText size="50" id="receivedPtj"
						value="#{flOrderBB.managedBean.flRequest.receivedOrgProfile.orgName}"
						disabled="true" />
				</td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText id="chargedPtj" size="50" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}"></p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="4" valign="top" style="width: 99px;"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="4"><p:inputTextarea cols="50" rows="8"
						style=" margin-bottom:5px;" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.title}" />
				</td>
				<td style="width: 98px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="25"
						value="#{flOrderBB.managedBean.flRequest.procurementType.codeId}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.plan.no']}" /></td>
				<td><p:inputText size="25"
						value="#{flOrderBB.managedBean.flRequest.planId.planNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25"
						value="#{flOrderBB.managedBean.flRequest.financialYear}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="50" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px;"><p:outputLabel  value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" value="#{flOrderBB.managedBean.flRequest.smSupplier.epNo}"/></td>
							<td style="width: 65px;"><p:outputLabel value="#{lbl['lbl.fl.supp.mof.no']}"/></td>
							<td><p:inputText size="10" disabled="true" value="#{flOrderBB.managedBean.flRequest.smSupplier.smMofAccounts[0].mofNo}"/></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="Factoring" /></td>
				<td><p:selectOneRadio
						value="#{flOrderBB.managedBean.factoringCheck}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" process="@this" listener="#{flOrderBB.factoringChecked}" update="@(.factStyle)" partialSubmit="true" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				    <td><p:inputText disabled="true" size="50" value="#{flOrderBB.managedBean.flRequest.smSupplier.companyName}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
					<td><p:selectOneMenu style="width: 325px;" disabled="#{flOrderBB.managedBean.factoringCheck eq 'false'}" styleClass="factStyle">
							<f:selectItem itemLabel="Select One" itemValue="1" />
						</p:selectOneMenu></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" style=" margin-bottom:5px;"
						value="#{flOrderBB.managedBean.supplierAddress}"  disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="KBB.XY@gmail.com" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText disabled="true" size="25" value="02-7324800" /></td>
			</tr>
		</table>
	</p:panel>
	

</ui:composition>
