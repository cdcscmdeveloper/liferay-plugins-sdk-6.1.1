<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style>
		.highlight-mark:before {
 			color: red;
 			content: "*";
		}
	</style>

	<p:panel header="#{lbl['lbl.fl.agency.details']}" toggleable="true" id="flDetails">
		<table>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td colspan="1"><p:inputText size="66" id="ministry"
						value="#{flOrderBB.retrieveMinistryByOrgProfileId(flOrderBB.managedBean.flRequest.issuedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td><p:inputText size="66" id="controlOff"
						value="#{flOrderBB.retrievePegawaiPengawalByOrgProfileId(flOrderBB.managedBean.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="66" id="ptjGroup"
						value="#{flOrderBB.retrieveJabatanByOrgProfileId(flOrderBB.managedBean.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 142px;"><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:490px;" 
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.pmOrgValidity.orgCode} #{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:490px;" 
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.pmOrgValidity.orgCode} #{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:490px;" 
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.pmOrgValidity.orgCode} #{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.acc.office']}" /></td>
				<td><p:inputText size="8" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeCode}"/> <p:spacer
						width="5" /> <p:inputText size="50" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeName}"/><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.acc.office']}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
		<table>
			<tr>
				<td rowspan="3" valign="top" style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3" valign="top" style="width: 250px;"><p:inputTextarea cols="50" rows="4"
						style=" margin-bottom:5px;" autoResize="false"
						value="#{flOrderBB.managedBean.flRequest.title}" disabled="true" /></td>
				<td style="width:240px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td style="width:235px;"><p:inputText size="25" 
						value="#{purchaseRequestBackingBean.getParameterDesc(flOrderBB.managedBean.flRequest.procurementType)}"
						disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.procurement.type']}"/></td>
			</tr>
			<tr>		
				<td><p:outputLabel value="#{lbl['lbl.fl.approved.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.agApprovedDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.po.approve.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="highlight-mark" value="#{lbl['lbl.fl.po.factored']} " /></td>
				<td><p:selectOneRadio disabled="#{flOrderBB.managedBean.buttonVal!=null or flOrderBB.managedBean.fulfilmentOrder.status.statusId eq FulfilmentStatusCont.poPendingRejAck or flOrderBB.managedBean.flRequest.procurementType.parameterCode eq ParameterConst.procurementTypeG2G or !bpmTasklistBackingBean.managedBean.claim}" 
						value="#{flOrderBB.managedBean.factoringCheck}">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}" itemValue="false" />
						<p:ajax event="change" process="@this"
							listener="#{flOrderBB.factoringChecked}" update="@(.factStyle)"
							partialSubmit="true" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="30" disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.getParameterDesc(flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.procurementTypeCategory)}" /></td>
			</tr>
			<tr>
				<td style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><table style="width: 75%">
						<tr>
							<td>
								<p:inputText size="12" style="text-align:right;"
									disabled="true"
									value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.deliveryTerm}" />
							</td>
							<td style="width: 211px;"><p:outputLabel styleClass="outputLabel-view"
									value="#{flOrderBB.getParameterDesc(flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.pmUom)}" /></td>
						</tr>
					</table></td>		
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.start']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.startDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.end']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.endDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" rendered="false"/></td>
				<td><p:inputText size="25"
						value="#{flOrderBB.managedBean.flRequest.financialYear}"
						disabled="true" rendered="false"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" rendered="false"/></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.createdDate}" rendered="false">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 175px;"><p:inputText size="15"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.smSupplier.regNo}" />
							<ac:iconTooltip
									value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}" /></td>
							<td style="width: 62px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.mofNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width: 242px;"><p:inputText size="15"
						disabled="true"
						value="#{flOrderBB.managedBean.flRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.smSupplier.epNo}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.gstRegNo}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.gstDeclaredDate ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.gstEffectiveDate ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.gstEffectiveDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;" autoResize="false"
						value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="16"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.phoneNo}" /></td>
							<td style="width: 72px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<h:panelGroup styleClass="factStyle" id="factStyle">
		<p:panel header="#{lbl['lbl.fl.factoring.details']}" toggleable="true" id="factoringCompPnl"
			rendered="#{flOrderBB.managedBean.factoringCheck eq 'true'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 142px;"><p:outputLabel
							value="#{lbl['lbl.fl.factoring.company']}" /></td>
					<td><p:selectOneMenu id="factoringComp"
					disabled="#{flOrderBB.managedBean.buttonVal=='View'}"
					value="#{flOrderBB.managedBean.fulfilmentOrder.pmFinancialOrg.financialOrgId}" 
					style="width: 425px;margin-bottom:5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="factoringComp"
							value="#{flOrderBB.managedBean.pmFinancialOrgs}"
							itemLabel="#{factoringComp.finOrgName}"
							itemValue="#{factoringComp.financialOrgId}" />
						<p:ajax event="change"
							listener="#{flOrderBB.getSelectedFactoringCompDtl}"
							update="factoringCompPnl" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.fl.supp.address']}" /></td>
					<td><p:inputTextarea cols="50" rows="8" disabled="true"
							style=" margin-bottom:5px;" autoResize="false"
							value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.fulfilmentOrder.factoringAddress)}" /></td>
				</tr>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.telno']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"
										value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.phoneNo}" /></td>
								<td style="width: 72px;"><p:outputLabel
										value="#{lbl['lbl.fl.faxno']}" /></td>
								<td><p:inputText size="15" disabled="true"
										value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.faxNo}" /></td>
							</tr>
						</table></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactPerson}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.email']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactEmail}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
					<td><p:inputText disabled="true" size="25"
							value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactPhoneNo}" /></td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>
	<h:panelGroup>
		<p:panel header="#{lbl['lbl.fl.stop.instuc.reason']}" toggleable="true" id="stopInstructionPnl"
			rendered="#{flOrderBB.managedBean.buttonVal eq 'Stop Fulfilment'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.stop.instuc.reason.justification']}"/>
					<p:outputLabel value="*" styleClass="mandatory"/></td>
				<td style="width: 295px;"><p:selectOneMenu id="reasonId" label="Reason" required="true"
						style="width:288px;margin-bottom: 5px;"
						value="#{flOrderBB.managedBean.stopIns.pmReason.reasonCode}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems value="#{flOrderBB.populateReasonList}" var="reason"
							itemLabel="#{reason.reasonDesc}"
							itemValue="#{reason.pmReason.reasonCode}"/>
						<p:ajax event="change" update="otherId"/>
					</p:selectOneMenu> 
					</td>
					<td><p:message for="reasonId" display="icon" /></td>
					<td style="width: 257px;"><p:outputLabel
							value="Submission Date" /></td>
					<td><p:inputText value="#{flOrderBB.managedBean.stopIns.createdDate}" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText> </td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.stop.instuc.others']}" /></td>
					<td><p:inputText size="50" value="#{flOrderBB.managedBean.stopIns.reasonDesc}" id="otherId" 
					disabled="#{flOrderBB.managedBean.stopIns.pmReason.reasonCode ne 'OTHERS'}" /></td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
</ui:composition>
