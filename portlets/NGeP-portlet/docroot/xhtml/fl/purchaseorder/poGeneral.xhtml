<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.createdOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.purchase.request.no']}" /></td>
				<td><p:inputText disabled="true" size="20"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:inputText size="35"
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.req.note.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value="10202-0202" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="35" value="IBU PEJABAT KASTAM"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.plan.no']}" /></td>
				<td><p:inputText disabled="true" size="20" value="PL_FL_003" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText size="35" value="IBU PEJABAT KASTAM"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText disabled="true" size="35" value="NORMAL" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="2"><p:inputTextarea cols="36"
						style="margin-bottom:5px;"
						value="#{flOrderBB.managedBean.flRequest.title}" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:inputText size="35" value="KEMENTERIAN KEWANGAN"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:inputText size="35"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ)" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="35" value="2013" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:inputText size="35" value="002 CAWANGAN KL"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']} " /></td>
				<td><p:selectOneRadio disabled="true"
						value="#{flOrderBB.managedBean.flRequest.financingLoan}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText disabled="true" size="20"
						value="12/10/2012 10:45 AM" /></td>
			</tr>
			<tr>

				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText size="20" value="PENDING ACKNOWLEDGE"
						disabled="true" /></td>
			</tr>

		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="Factoring" /></td>
				<td><p:selectOneRadio
						value="#{flOrderBB.managedBean.factoringCheck}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" process="@this" listener="#{flOrderBB.factoringChecked}" update="@(.factStyle)" partialSubmit="true" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				    <td><p:inputText disabled="true" size="35" value="KBB SDN BHD" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
					<td><p:selectOneMenu style="width: 207px;" disabled="#{flOrderBB.managedBean.factoringCheck eq 'false'}" styleClass="factStyle">
							<f:selectItem itemLabel="Select One" itemValue="1" />
						</p:selectOneMenu></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="36" style=" margin-bottom:5px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText disabled="true" size="35"
						value="KBB.XY@gmail.com" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText disabled="true" size="20" value="02-7324800" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true" >
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
