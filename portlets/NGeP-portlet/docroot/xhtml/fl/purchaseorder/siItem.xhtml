<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="ITEM" toggleable="true" styleClass="siInvItemPnlClass">
		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="invItemChange" value="#{flOrderBB.managedBean.chargeLineItemRoot}">
			<p:column headerText="Item Code" style="white-space:normal; width:130px;">
				<h:outputText
					value="#{chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;" >
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Unit &lt;br /&gt; Price (RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.unitPrice}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.orderedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.receivedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Recalled &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.orderedQty - chargeLineNode.receivedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.orderedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.orderedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Recalled &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.orderedAmt - chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.orderedAmt - chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
		</p:treeTable>
		</p:panel>
</ui:composition>
