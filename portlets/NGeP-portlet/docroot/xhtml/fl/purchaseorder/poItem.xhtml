<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right"><p:commandButton value="SAVE" />
					<p:commandButton value="ACKNOWLEDGE" /> <p:commandButton
						value="PRINT" /></td>
			</tr>
		</table>
		<p:panel header="DELIVERY ADDRESS" toggleable="true">
			<table style="width: 775px;">
				<tr>
					<td colspan="6" align="right"><p:commandButton value="ADD" />
					</td>
				</tr>
			</table>
			<p:dataTable id="dataTable" var="address" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:column style="width: 400px;" headerText="Delivery Address">
					<h:outputText value=" " />
				</p:column>

				<p:column headerText="Exp. Delivery (Start)">
					<h:outputText value=" " />
				</p:column>

				<p:column headerText="Exp. Delivery (End)">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Sub Total (MYR)">
					<h:outputText value="" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="ITEM DETAIL" toggleable="true">

			<br />

			<p:dataTable id="dataTable" var="item" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:column headerText="Product Code">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Item Name">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="GOSODO">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Activity Code">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Unit Price (MYR)">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Ord. Qty.">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="Total">
					<h:outputText value="" />
				</p:column>
			</p:dataTable>

			<br />
			<br />
			<table>
				<tr>
					<td><p:outputLabel value="Product Code" /></td>
					<td><p:inputText style="width: 260px;" value="200003"
							disabled="true" /></td>
					<td><p:outputLabel value="Unit Price" /></td>
					<td><p:inputText style="width: 260px;" value="0.50"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Item Name" /></td>
					<td><p:inputText style="width: 260px;" value="Blue Pen"
							disabled="true" /></td>
					<td><p:outputLabel value="Ordered Qty" /></td>
					<td><p:inputText style="width: 260px;" value="200" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="GOSODO" /></td>
					<td><p:inputText style="width: 260px;" value="GOSODO001"
							disabled="true" /></td>
					<td><p:outputLabel value="Total" /></td>
					<td><p:inputText style="width: 260px;" value="100.00"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Activity Code" /></td>
					<td><p:inputText style="width: 260px;" value="ACTIVITY1 "
							disabled="true" /></td>
				</tr>
			</table>
		</p:panel>
		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right"><p:commandButton type="button"
						icon="ui-icon-circle-triangle-w" /> <p:commandButton
						type="button" icon="ui-icon-circle-triangle-e" /></td>
			</tr>
		</table>
</ui:composition>
