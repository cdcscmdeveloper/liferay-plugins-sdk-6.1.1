<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="delAddrPanel" header="DELIVERY ADDRESS" toggleable="true">

		<p:dataTable id="addressDataTable" var="address"
			value="#{flOrderBB.managedBean.flRequest.flDeliveryAddresses}"
			selection="#{flOrderBB.managedBean.selectedDelAddr}"
			rowKey="#{address}" lazy="true" selectionMode="single">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelect" update=":form:poTabs:itemDetPanel"/>
			<p:column headerText="Delivery Address">
				<h:outputText
					value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
			</p:column>

			<p:column headerText="Exp. Delivery (Start)">
				<p:calendar value="#{address.startDate}" pattern="dd/mm/yyyy"
					id="calStartDate" showOn="button" />
			</p:column>

			<p:column headerText="Exp. Delivery (End)">
				<p:calendar value="#{address.endDate}" pattern="dd/mm/yyyy"
					id="calEndDate" showOn="button" />
			</p:column>

		</p:dataTable>
	</p:panel>
	<p:panel id="itemDetPanel" header="ITEM DETAIL" toggleable="true">

		<p:dataTable id="itemDataTable" var="flItem" lazy="true"
			value="#{flOrderBB.managedBean.selectedDelAddr.flFulfilmentItemAddr}">
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Item Name">
				<h:outputText
					value="#{flItem.flFulfilmentItem.scRequestNoteDtl.scRequestNote.scRequestList.requestItems[0].itemName}" />
			</p:column>
			<p:column headerText="GOSODO">
			</p:column>
			<p:column headerText="Activity Code">
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<p:inputText disabled="true"></p:inputText>
			</p:column>
			<p:column headerText="Ord. Qty.">
				<p:inputText value="#{flItem.orderedQty}">
				</p:inputText>
			</p:column>
			<p:column headerText="Sub Total">
				<p:inputText id="subTotalTxt" value="#{flItem.subTotal}"
					disabled="true"></p:inputText>
			</p:column>
		</p:dataTable>

	</p:panel>
</ui:composition>
