<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.delivery.address']}" toggleable="true">
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange hide-column-names"
			value="#{flOrderBB.managedBean.flRequest.flDeliveryAddresses}">
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="#{lbl['bl.fl.delivery.address']}" style="white-space:normal;">
				<h:outputText value="#{flOrderBB.getFullAddress(delAddressSummary.pmAddress)}" />
			</p:column>
			<p:column>
				<p:spacer width="7" />
				<h:outputText value="#{lbl['lbl.fl.delivery.period']}" />
				<p:spacer width="7" />
				<p:inputText size="4" disabled="true" style="text-align:right;"
					value="#{delAddressSummary.deliveryTerm}" />
				<p:spacer width="7" />
				<h:inputText size="4" disabled="true"  style="width:50px"
					value="#{flOrderBB.getParameterDesc(delAddressSummary.pmUom)}" />
				<p:spacer width="7" />
				<h:outputText value="#{lbl['lbl.fl.delivery.start']}" />
				<p:spacer width="7" />
				<p:inputText size="9"
					value="#{flOrderBB.managedBean.flRequest.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="7" />
				<h:outputText value="#{lbl['lbl.fl.delivery.end']}" />
				<p:spacer width="7" />
				<p:inputText size="9"
					value="#{flOrderBB.managedBean.flRequest.endDate}" disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:rowExpansion>

				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}">
					<p:column>
						<f:facet name="header" style="width:8%;">
							<h:outputText value="#{lbl['lbl.fl.item.code']}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}" />
						</f:facet>
						<h:outputText
							value="#{newItems.scRequestItem.cmItem.extensionCode}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;" >
						<h:outputText value="#{newItems.scRequestItem.itemName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.uom']}">
						<h:outputText value="#{newItems.scRequestItem.uom.uomName}"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:right">
						<h:outputText value="#{newItems.unitPrice}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:right">
						<h:outputText value="#{newItems.orderedQty}" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:right">
						<h:outputText value="#{newItems.orderedAmt}" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
	</p:panel>
</ui:composition>
