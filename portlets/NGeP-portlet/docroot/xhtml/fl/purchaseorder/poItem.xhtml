<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="DELIVERY ADDRESS" toggleable="true">

		<p:dataTable id="dataTable1" var="address" width="100%">
			<ac:paginator for="dataTable1" />
			<p:column style="width: 400px;" headerText="Delivery Address">
				<h:outputText />
			</p:column>
			<p:column headerText="Exp. Delivery (Start)">
				<h:outputText />
			</p:column>
			<p:column headerText="Exp. Delivery (End)">
				<h:outputText />
			</p:column>
			<p:column headerText="Sub Total (MYR)">
				<h:outputText />
			</p:column>
		</p:dataTable>
		<table style="width: 100%;">
			<tr>
				<td colspan="6" style="text-align: right"><p:commandButton
						value="ADD" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="ITEM DETAIL" toggleable="true">
		<br />
		<p:dataTable id="dataTable2" var="item" width="100%">
			<ac:paginator for="dataTable2" />
			<p:column headerText="Product Code">
				<h:outputText />
			</p:column>
			<p:column headerText="Item Name">
				<h:outputText />
			</p:column>
			<p:column headerText="GOSODO">
				<h:outputText />
			</p:column>
			<p:column headerText="Activity Code">
				<h:outputText />
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<h:outputText />
			</p:column>
			<p:column headerText="Ord. Qty.">
				<h:outputText />
			</p:column>
			<p:column headerText="Total">
				<h:outputText />
			</p:column>
		</p:dataTable>
		<br />
		<br />
		<table>
			<tr>
				<td><p:outputLabel value="Product Code" /></td>
				<td><p:inputText style="width: 260px;" value="200003"
						disabled="true" /></td>
				<td><p:outputLabel value="Unit Price" /></td>
				<td><p:inputText style="width: 260px;" value="0.50"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Item Name" /></td>
				<td><p:inputText style="width: 260px;" value="Blue Pen"
						disabled="true" /></td>
				<td><p:outputLabel value="Ordered Qty" /></td>
				<td><p:inputText style="width: 260px;" value="200" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="GOSODO" /></td>
				<td><p:inputText style="width: 260px;" value="GOSODO001"
						disabled="true" /></td>
				<td><p:outputLabel value="Total" /></td>
				<td><p:inputText style="width: 260px;" value="100.00"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Activity Code" /></td>
				<td><p:inputText style="width: 260px;" value="ACTIVITY1 "
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
