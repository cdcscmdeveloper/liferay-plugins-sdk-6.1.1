<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<table style="width: 100%;">
			<tr>
				<td colspan="4" style="text-align: right;"><p:commandButton
						value="SUBMIT" /></td>
			</tr>
		</table>
		<p:panel header="FULFILMENT DETAILS" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="Contract No." /></td>
					<td><p:inputText style="width: 120px;" disabled="true" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Fulfilment Request No." /></td>
					<td><p:inputText style="width: 120px;" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Supplier Name" /></td>
					<td><p:inputText style="width: 260px;" disabled="true" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="ITEM" toggleable="true">
			<table>
				<tr>
					<td><p:dataTable id="itemDt"
							value="#{flOrderBB.managedBean.flItemList}" var="items"
							style="width:100%">
							<ac:paginator for="itemDt" />

							<p:column headerText="Product Code">
								<h:outputText value="" />
							</p:column>

							<p:column headerText="Item Name">
								<h:outputText value="" />
							</p:column>

							<p:column headerText="GOSODO">
								<h:outputText value="" />
							</p:column>

							<p:column headerText="Activity Code">
								<h:outputText value="" />
							</p:column>
							<p:column headerText="Unit Price (MYR)">
								<h:outputText value="" />
							</p:column>
							<p:column headerText="Ord. Qty.">
								<h:outputText value="" />
							</p:column>
							<p:column headerText="Sub Total">
								<h:outputText value="" />
							</p:column>

						</p:dataTable></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="COMPLAIN REASON" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="Reason: " /></td>
					<td><p:selectOneMenu style="width: 260px;margin-bottom:5px;">
							<f:selectItems itemLabel="Late Delivery" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel value="Title: " /></td>
					<td><p:inputTextarea cols="36" style=" margin-bottom:5px;"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
