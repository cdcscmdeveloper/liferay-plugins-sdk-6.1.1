<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<style>
.column-align-center {
	text-align: center !important;
}
</style>
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<p:panel id="searchPanel" header="SEARCH" toggleable="true">
			<h:panelGroup id="defineSearchTbl">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.ap59.contr.no']}"
						style="width: 125px;" />
					<p:inputText size="40"
					></p:inputText>
					<p:outputLabel value="#{lbl['lbl.fl.ap59.phys.contr.no']}"
						 style="padding-left: 50px;"/>
					<p:inputText size="40"
					></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docLoaSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.ap59.loa.no']}"
						style="width: 125px;" />
					<p:inputText size="40"
					></p:inputText>
					<p:outputLabel value="#{lbl['lbl.fl.ap59.phys.loa.no']}"
						 style="padding-left: 71px;"/>
					<p:inputText size="40"
					></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTitleSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.ap59.contr.title']}"
						style="width: 125px;" />
					<p:inputText size="80"
					></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			
			<p:outputPanel id="advanceSearchID" style="width:100%">
			</p:outputPanel>

			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lblfl.doc.search.btn.search']}"
					action=""
					icon="ui-icon-search" update="resultPanel" />
				<p:commandButton value="#{lbl['lblfl.doc.search.btn.reset']}"
					action="" icon="ui-icon-reset"
					update=":form" />
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="RESULT" toggleable="true">
			<p:dataTable 
				 lazy="true"
				 rowIndexVar="rowIndex" 
				width="100%">
				<ac:paginator for="flDocListDt" />
				<p:column
					headerText="#{lbl['lbl.fl.ap59.search.datatable.contr.ord.no']}">
					<h:outputText
						 />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ap59.search.datatable.contr.no']}">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ap59.search.datatable.loa.no']}">
					<h:outputText  />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.ap59.search.datatable.contr.own.ptj']}">
					<h:outputText />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.ap59.search.datatable.contr.ord.ptj']}">
					<h:outputText
						 />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.ap59.search.datatable.supp']}">
					<h:outputText
						 />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.fl.ap59.search.datatable.action']}"
					style="text-align: center">
					<p:commandLink
						onclick=""">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							title="View Document" />
					</p:commandLink>
					<p:spacer width="7" />
				</p:column>

			</p:dataTable>
			<p:remoteCommand action=""
				name="goToDetail" />



		</p:panel>
	</ui:define>
</ui:composition>
