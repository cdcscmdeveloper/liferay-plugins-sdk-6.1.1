<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<style>
.column-align-center {
	text-align: center !important;
}
</style>
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<h:panelGroup id="defineSearchTbl">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.contract.no']}"
						style="width: 125px;" />
					<p:inputText size="40" value="#{invoiceBackingBean.managedBean.contractNo}"></p:inputText>
				
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docLoaSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}"
						style="width: 125px;" />
					<p:inputText size="40" value="#{invoiceBackingBean.managedBean.loaNo}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docTitleSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.ap59.contract.title']}"
						style="width: 125px;" />
					<p:inputText size="80" value="#{invoiceBackingBean.managedBean.title}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docPhyContNoSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}"
						style="width: 125px;" />
					<p:inputText size="40" value="#{invoiceBackingBean.managedBean.physicalContractNo}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup id="docPhyLoaNoSearch">
				<h:panelGrid columns="4" columnClasses="cmWidth1">
					<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
						style="width: 125px;" />
					<p:inputText size="40" value="#{invoiceBackingBean.managedBean.physicalLoaNo}"></p:inputText>
				</h:panelGrid>
			</h:panelGroup>

			<p:outputPanel id="advanceSearchID" style="width:100%">
			</p:outputPanel>

			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>
			<f:verbatim></f:verbatim>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					 update="resultPanel" action="#{invoiceBackingBean.searchDocument}"/>
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					 update=":form" action="#{invoiceBackingBean.searchReset}"/>
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<p:dataTable lazy="true"  width="100%" id="flInvoiceListDt"
			value="#{invoiceBackingBean.flInvoiceDataModel}" rows="10"
				var="flInvoice">
				<ac:paginator for="flInvoiceListDt" />
				<p:column
					headerText="#{lbl['lbl.fl.do.poco.no']}">
					<h:outputText value="#{flInvoice.flRequest.flFulfilmentOrder.docNo}"/>
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.contract.no']}" rendered="#{flInvoice.flRequest.ctContract.latestContractVer.contractPhysicalNo != null and flInvoice.flRequest.ctContract.contractNo != null}">
					<h:outputText value="#{flInvoice.flRequest.ctContract.latestContractVer.contractPhysicalNo}&lt;br/&gt;#{flInvoice.flRequest.ctContract.contractNo }" escape="false"/>
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.contract.no']}" rendered="#{flInvoice.flRequest.ctContract.latestContractVer.contractPhysicalNo == null or flInvoice.flRequest.ctContract.contractNo == null}">
					<h:outputText value="#{flInvoice.flRequest.ctContract.latestContractVer.contractPhysicalNo} #{flInvoice.flRequest.ctContract.contractNo }" escape="false"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.loa.no']}">
					<h:outputText value="#{flInvoice.flRequest.ctContract.loaPhysicalNo} &lt;br/&gt; #{flInvoice.flRequest.ctContract.loa.loaNo}" escape="false"/>
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.ptj.name']}">
					<h:outputText value="#{flInvoice.flRequest.ctContract.ownerOrgProfile.pmOrgValidity.orgName}" style="white-space:normal"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ap59.contract.supplier']}">
					<h:outputText value="#{flInvoice.flRequest.smSupplier.companyName}" style="white-space:normal"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.fl.doc.maintain.action.no']}"
					style="text-align: center">
					<p:commandLink onclick="goToDetail([{name:'invoiceId', value:'#{flInvoice.invoiceId}'}])">
						<p:graphicImage value="/css/images/design/document.png"
							title="View Document" />
					</p:commandLink>
					<p:spacer width="7" />
				</p:column>

			</p:dataTable>
			<p:remoteCommand name="goToDetail" action="#{invoiceBackingBean.navigateToPage}"/>



		</p:panel>
	</ui:define>
</ui:composition>
