<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.fl.do.poco.no']} " /></td>
				<td class="header-info-text">
					#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.docNo}</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.contract.no']}" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no']}"/></td>
				<td class="header-info-text">
					#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.contractNo}</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ap59.contract.effective.date']}" />
				</td>
				<td class="header-info-text">
					#{invoiceBackingBean.managedBean.effDate}
				</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ap59.contract.expiry.date']}"/></td>
				<td class="header-info-text">
				#{invoiceBackingBean.managedBean.expDate}
				</td>
			</tr>
		</table>
	</div>
</ui:composition>
