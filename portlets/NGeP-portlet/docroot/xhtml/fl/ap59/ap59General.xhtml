<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.menu.gen.info']}"  toggleable="true">
		<table>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50"
						value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.contractType.parameterCode==ParameterConst.contractTypeMinistry?
								invoiceBackingBean.retrieveMinistryByOrgProfileId(invoiceBackingBean.managedBean.invoice.flRequest.ctContract.ownerOrgProfile.orgProfileId):''}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" /></td>
				<td><p:inputText size="40" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.loa.loaNo}"/><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa']}"/></td>
				
			</tr>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ptj.name']}" /></td>
				<td><p:inputText size="50" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.ownerOrgProfile.pmOrgValidity.orgName}"/></td>
			<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" /></td>
				<td><p:inputText size="40" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.loaPhysicalNo}"/><ac:iconTooltip value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"/></td>
			</tr>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.doc.maintain.supp.name']}" /></td>
				<td><p:inputText size="50" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.smSupplier.companyName}"/></td>
				<td style="width: 139px"><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText size="40" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.contractNo}"/><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no']}"/></td>
			</tr>
			<tr>
				<td valign="top" style="width: 137px;"><p:outputLabel
						value="#{lbl['lbl.fl.ap59.contract.title']}" /></td>
				<td><p:inputTextarea rows="4" cols="50" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.contractName}"
						style="margin-bottom:5px;" autoResize="false" disabled="true" /></td>
				<td style="width: 139px;vertical-align: top;"><p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" /></td>
				<td style="vertical-align: top;"><p:inputText size="40" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.ctContract.latestContractVer.contractPhysicalNo}"/><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ap59.physical.contr.no']}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.menu.contract.order']}" toggleable="true" id="suppDetPnl">
		<table>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" disabled="true" value="#{invoiceBackingBean.retrieveMinistryByOrgProfileId(invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile.orgProfileId)}"/></td>
				<td style="width: 139px"><p:outputLabel value="#{lbl['lbl.fl.ap59.order.date']}" /></td>
				<td><p:inputText size="40" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flFulfilmentOrder.createdDate}">
				<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" /></p:inputText></td>
			</tr>
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ptj.name']}" /></td>
				<td><p:inputText size="50" disabled="true" value="#{invoiceBackingBean.managedBean.invoice.flRequest.issuedOrgProfile.pmOrgValidity.orgName}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ap59.order.amt']}" /></td>
				<td>
					<p:inputText size="40" disabled="true" value="#{invoiceBackingBean.managedBean.sumOrderedAmt}" style="text-align:right">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</td>
			</tr>
			<tr>
				<td valign="top" style="width: 137px;"><p:outputLabel
						value="#{lbl['lbl.fl.ap59.order.title']}" /></td>
				<td><p:inputTextarea rows="4" cols="50" value="#{invoiceBackingBean.managedBean.invoice.flRequest.title}"
						style="margin-bottom:5px;" disabled="true" autoResize="false"/></td>
			</tr>

		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.menu.invoice.summary']}" toggleable="true">
		<table>
			<tr>
				<td style="width: 180px"><p:outputLabel
						value="#{lbl['lbl.fl.invoice.no']}" /></td>
				<td><p:commandLink value="#{invoiceBackingBean.managedBean.invoice.invoiceNo}" immediate="true"
						action="#{invoiceBackingBean.navigateDocument(ParameterConst.doctypeInvoice)}"/> </td>
			</tr>
			<tr>
				<td style="width: 180px"><p:outputLabel
						value="#{lbl['lbl.fl.supp.invoice.no']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.supplierInvoiceRef}"
						disabled="true">
					</p:inputText></td>
			</tr>
			<tr>
				<td style="width: 180px"><p:outputLabel
						value="#{lbl['lbl.fl.ap59.inv.amount']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.invoice.invoiceAmtNew}"
						disabled="true" style="text-align:right">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ap59.service.fee']}" /></td>
				<td><p:inputText size="35"
						value="#{invoiceBackingBean.managedBean.serviceCharge}"
						disabled="true" style="text-align:right" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.service.fee']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ap59.fee.amount']}" /></td>
				<td><p:inputText size="35" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.feeAmt}"
						style="text-align:right">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ap59.payment.suppt']}" /></td>
				<td><p:inputText size="35" disabled="true"
						value="#{invoiceBackingBean.managedBean.invoice.supplierOrFactorAmt}"
						style="text-align:right">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.menu.bpk.decision']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 139px"><p:outputLabel
						value="#{lbl['lbl.fl.ap59.decision']}" />
						 <p:outputLabel	value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="margin-bottom:15px;" value="#{invoiceBackingBean.managedBean.statusId}" label="#{lbl['lbl.fl.ap59.decision']}" required="true">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="decision"
							value="#{invoiceBackingBean.managedBean.decisionList}"
							itemLabel="#{decision.statusName}"
							itemValue="#{decision.pmStatus.statusId}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
