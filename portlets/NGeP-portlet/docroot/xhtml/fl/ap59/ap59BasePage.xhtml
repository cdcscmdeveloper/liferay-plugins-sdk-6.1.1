<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<f:event listener="#{invoiceBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			showSummary="false" closable="true" severity="error, info" />
		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="Back" immediate="true" 
						rendered="#{invoiceBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<td colspan="4" style="text-align: right;"><p:commandButton 
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						value="SUBMIT" action="#{invoiceBackingBean.submitAp59}"
						icon="ui-icon-submit">
					</p:commandButton>
					</td>
			</tr>
		</table>
		<ui:include src="/xhtml/fl/ap59/ap59ReviewHeaderPage.xhtml" />
		<table width="100%">
			<tr>
				<td width="100%"><p:outputPanel>
						<ui:include src="ap59General.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
