<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						action="#{flCustomerServiceBackingBean.backToPervious}"  /></td>
				<td colspan="4" style="text-align: right"></td>
			</tr>
		</table>			
		<table>
			
		</table>
		<p:panel header="#{lbl['lbl.fl.doc.info']}" toggleable="true"
			id="flDetails">
			<table>
				<tr>
					<td style="width: 117px;"><p:outputLabel
							value="#{lbl['lbl.fl.ministry']}" /></td>
					<td colspan="1"><p:inputText size="66" id="ministry"
							value="#{flCustomerServiceBackingBean.managedBean.viewMinistry}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td valign="top" style="width: 106px;"><p:outputLabel
							value="#{lbl['lbl.fl.jabatan']}" /></td>
					<td><p:inputText size="66" readonly="true"
							value="#{flCustomerServiceBackingBean.managedBean.viewKumpulanPTJ}" />
					</td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.fl.charge.ptj']}" /></td>
					<td><p:inputText size="6" readonly="true"
							value="#{flCustomerServiceBackingBean.managedBean.viewPtjCode}" />
						<p:spacer width="1"/>
						<p:inputText size="53" readonly="true"
							value="#{flCustomerServiceBackingBean.managedBean.viewPtjName}" />
						</td>
				</tr>
				<tr>
					<td style="width: 190px;"><p:outputLabel
							value="#{lbl['lbl.fl.doc.maintain.doc.type']}" /></td>
					<td><p:inputText size="28" readonly="true"
							value="#{flCustomerServiceBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, flCustomerServiceBackingBean.managedBean.docType)}" />
					</td>
				</tr>
				<tr><td><p:outputLabel
							value="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}" /></td>
					<td><p:inputText size="28" readonly="true"
							value="#{flCustomerServiceBackingBean.managedBean.viewDocNo}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.doc.maintain.order.no']}" /></td>
					<td><p:inputText size="28" maxlength="17" readonly="true"
							value="#{flCustomerServiceBackingBean.managedBean.viewOrdrNo}"></p:inputText></td>
					
				</tr>
				<tr>
					<td style="width: 190px;"><p:outputLabel
							value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
					<td><p:inputText size="28" maxlength="17" readonly="true"
							value="#{flCustomerServiceBackingBean.getStatusDescById(flCustomerServiceBackingBean.managedBean.statusId)}"></p:inputText>
					</td>
				</tr>
				<tr>
					<td class="columnWidth20"></td>
					<td>
						<table style="width: 610px">
							<tr>
								<td>
									<p:dataTable id="officerInfoName" var="officerInfo"
										widgetVar="tableOfficerWidget"
										value="#{flCustomerServiceBackingBean.managedBean.customerServiceEntity}"
										rowIndexVar="index" rows="10">
										<ac:paginator for="officerInfoName" />
										<p:column style="width:2%" headerText="No.">
											<h:outputText value="#{index+1}" style="float:left;" />
										</p:column>
										<p:column style="width:45%;white-space:normal;"
											headerText="#{lbl['lbl.fl.customer.service.officer.name']}">
											<h:outputText value="#{officerInfo.officerName}"
												style="float:left;" />
										</p:column>
									</p:dataTable>
								</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</p:panel>
		<ac:lovPopup />
	</ui:define>
</ui:composition>
