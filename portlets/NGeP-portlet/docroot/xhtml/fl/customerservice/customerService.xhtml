<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<style>
				.column-align-center {
				text-align: center !important;
				}
				
				.highlight-mark:before {
 					color: red;
 					content: "*";
				}
				
				.ui-menu.ui-menu-dynamic.ui-widget.ui-widget-content.ui-corner-all.ui-helper-clearfix.ui-shadow{  
              		width:180px;
   				}
		</style>
		<p:panel id="searchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
			<h:panelGroup id="ptjPanel">
			<table>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.fl.ptj.code']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 560px;"><p:inputText size="45"
							id="ptjOrgProfileId" readonly="true"
							value="#{flCustomerServiceBackingBean.managedBean.ptj.orgCode}"  />					
					<ac:lov id="ptj" uiMode="link" lovId="PM_ORG_PROFILE_PTJ"
							headerText="#{lbl['lbl.fl.pm.org.code']}"
							saveObject="flCustomerServiceBackingBean.managedBean.ptj"
							value="#{flCustomerServiceBackingBean.managedBean.ptj.orgName}"
							size="50" update=":form:ptjPanel"
							readonly="true"	>
							</ac:lov></td>
				</tr>
				<tr>
					<td style="width: 190px;"><p:outputLabel
							value="#{lbl['lbl.fl.ptj.name']}" /></td>
					<td><p:inputText size="122" readonly="true" id="ptjOrgName"
							value="#{flCustomerServiceBackingBean.managedBean.ptj.orgName}" /></td>
				</tr>
			</table>
			</h:panelGroup>
			<table>
			<tr>
				<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.type']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						value="#{flCustomerServiceBackingBean.managedBean.searchOrderType}"
						style="width: 314px;">
						<f:selectItems
							value="#{flCustomerServiceBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentOrderType)}" />
					<p:ajax event="change" update="form:searchPanel"
							listener="#{flCustomerServiceBackingBean.selectedOrderType}"/>		
					</p:selectOneMenu></td>
				
			</tr>
			<tr>
			<td style="width: 190px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.type']}"	/><p:outputLabel
						value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu id="searchDocTypeDD" style="width: 314px;"
						value="#{flCustomerServiceBackingBean.managedBean.searchDocType}">
						<f:selectItems
							value="#{flCustomerServiceBackingBean.getDocumentTypeDropDown()}" />
					<p:ajax event="change"
							update="docStatusSearch"
							listener="#{flCustomerServiceBackingBean.selectedDoctype}" />		
					</p:selectOneMenu></td>
			<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}" /></td>
			<td><p:inputText size="28" value="#{flCustomerServiceBackingBean.managedBean.searchDocNo}" />
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.document.no']}"/>	
			</td>
			</tr>
			</table>
			<h:panelGroup id="docStatusSearch">
				<table>
					<tr>
						<td style="width: 190px;"><p:outputLabel
								value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
						<td><p:selectOneMenu id="statusId"
								value="#{flCustomerServiceBackingBean.managedBean.statusId}"
								style="width: 314px;">
								<f:selectItems
									value="#{flCustomerServiceBackingBean.getStatusDropdownValues('FL',flCustomerServiceBackingBean.managedBean.searchDocType)}" />
								<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>	
							</p:selectOneMenu></td>
						<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.order.no']}" /></td>
						<td><p:inputText size="28" maxlength="17" 
							value="#{flCustomerServiceBackingBean.managedBean.searchOrderNo}"></p:inputText></td>
					</tr>
					<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.business.company.name']}" /> 
					</td>
					<td colspan="3">
						<p:inputText size="122" value="#{flCustomerServiceBackingBean.managedBean.searchSuppName}" />
					</td>
				</tr>
				</table>
			</h:panelGroup>


			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{flCustomerServiceBackingBean.searchDocument}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					update="resultPanel" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
					action="#{flCustomerServiceBackingBean.searchReset}" 
					update=":form"  title="#{lbl['lbl.fl.tooltip.doc.maintain.reset']}"/>
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.doc.maintain.result']}"/>
			<p:dataTable id="flDocListDt"
				value="#{flCustomerServiceBackingBean.managedBean.flDocumentDataModel}" lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="flDocument" rowIndexVar="rowIndex" rowKey="#{flDocument.docId}" rows="10"
				width="100%">
				<ac:paginator for="flDocListDt" />
				<p:column style="width:2%" headerText="No.">
				              <h:outputText value="#{rowIndex+1}" style="float:left;"/>
			       	</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.doc.type']}" style="white-space:normal;width:20%;" >
					<h:outputText
						value="#{flCustomerServiceBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, flDocument.docType)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.circular.doc.no']}" style="width:10%;">
					<h:outputText value="#{flDocument.docNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.order.no']}" style="width:10%;">
					<h:outputText value="#{flDocument.orderNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.doc.title']}" style="white-space:normal;width:41%;" >
					<h:outputText value="#{flDocument.title}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.fl.doc.maintain.doc.status']}" style="white-space:normal;width:10%;" >
					<h:outputText
						value="#{flCustomerServiceBackingBean.getStatusDescById(flDocument.statusId)}" />
				</p:column>  
				<p:column headerText="#{lbl['lbl.fl.doc.maintain.action.no']}" 
					style="text-align: center;width:7%;">
					<p:commandLink onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{flCustomerServiceBackingBean.navigateToPage(flDocument.docType,flDocument.docId,flDocument.statusId,flDocument.docNo,flDocument.orderNo)}"
							style="padding-left:10px">
							<p:graphicImage value="/css/images/design/ico-view.png" />
						</p:commandLink> 
				</p:column>
			</p:dataTable>
		</p:panel>
		
	
	<ac:lovPopup />
	</ui:define>
</ui:composition>
