<ui:composition

			</tr>

							</tr>

				</tr>
			</table>
		</p:panel>
		<p:panel header="ROUTE AND OVERSEA AGENT" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="Country of Origin" /></td>

							value="#{shipInstrBackingBean.managedBean.shippingInstr.specialInstruction}" /></td>
					<td valign="top" style="width: 130px;"><p:outputLabel
							value="Marks And Numbers" /></td>
					<td><p:inputTextarea cols="36" style="margin-bottom:5px;" autoResize="false"/></td>
				</tr>

				<ac:paginator for="addressDataTable" />

					<h:outputText value="" />
