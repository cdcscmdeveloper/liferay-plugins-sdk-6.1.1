<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table>
		<tr>
			<td valign="top"><p:outputLabel
					value="#{lbl['lbl.fl.delivery.address']}" /></td>
			<td><p:inputTextarea cols="50" rows="3"
					style=" margin-bottom:5px;" disabled="true" autoResize="false"
					value="#{createDOBackingBean.getFullAddress(createDOBackingBean.managedBean.flDeliveryOrder.flDeliveryAddress.flAddress)}" />
			</td>
		</tr>
	</table>
		
	<p:panel header="#{lbl['lbl.fl.do.delivery.items']}" toggleable="true">
		<p:dataTable id="doItems" var="doItems" rowIndexVar="index"
			rowKey="#{flItem}"
			value="#{createDOBackingBean.managedBean.flDeliveryOrder.flDeliveryAddress.flFulfilmentItemAddr}">
			<ac:paginator for="doItems" />
			<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center">
				<h:outputText value="#{doItems.scRequestItem.itemName}" id="itemDesc" style="text-align:left; float:left;" title="#{doItems.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : doItems.scRequestItem.itemDesc}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}" style="text-align:center">
				<h:outputText value="#{doItems.scRequestItem.uom.uomName}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}"
				style="text-align:center">
				<h:outputText disabled="true" value="#{doItems.unitPrice}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.qty']}"
				style="text-align:center">
				<h:outputText value="#{doItems.orderedQty}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />	
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.do.delivery.qty']}"
				style="text-align:center">
				<h:panelGroup id="delQtyTxt">
					<h:outputText value="#{doItems.deliveredQty}" size="5" style="float:right;"
						styleClass="colFloatRight">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.amount']}"
				style="text-align:center">
				<h:panelGroup id="delAmountTxt">
					<h:outputText value="#{doItems.deliveredAmt}" disabled="true" style="float:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}"
				style="text-align:center">
				<h:outputText value="#{doItems.orderedAmt}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
