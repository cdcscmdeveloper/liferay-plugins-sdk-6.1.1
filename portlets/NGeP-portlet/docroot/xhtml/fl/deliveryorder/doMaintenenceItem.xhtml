<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table>
		<tr>
			<td valign="top"><p:outputLabel
					value="#{lbl['lbl.fl.delivery.address']}" /></td>
			<td><p:inputTextarea cols="50" rows="3"
					style=" margin-bottom:5px;" disabled="true" autoResize="false"
					value="#{createDOBackingBean.getFullAddress(createDOBackingBean.managedBean.flDeliveryOrder.flDeliveryAddress.flAddress)}" />
			</td>
		</tr>
	</table>
		
	<p:panel header="#{lbl['lbl.fl.do.delivery.items']}" toggleable="true">
		<p:dataTable id="doItems" var="doItems" rowIndexVar="index"
			rowKey="#{flItem}"
			value="#{createDOBackingBean.managedBean.flDeliveryOrder.flDeliveryAddress.flFulfilmentItemAddr}">
			<ac:paginator for="doItems" />
			<!-- 28855 Start -->
			<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal">
				<h:outputText value="#{doItems.scRequestItem.itemName}" id="itemDesc" 
				 title="#{doItems.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : doItems.scRequestItem.itemDesc}"/>
				<p:commandLink oncomplete="doItemInfo.show();" process="@this"
					rendered="#{createDOBackingBean.managedBean.contractFlag}"  
					action="#{createDOBackingBean.doItemInfoList(doItems)}"
					update=":form:doItemInfoDialog,@(.orderSummaryChange)">
					<ac:iconTooltip value="#{lbl['lbl.fl.item.tooltip']}"  escape="false"/>
					</p:commandLink>
			</p:column>
			<!-- 28855 End -->
			<p:column headerText="#{lbl['lbl.fl.uom']}" style="text-align:center">
				<h:outputText value="#{doItems.scRequestItem.uom.uomName}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}"
				style="text-align:center">
				<h:outputText disabled="true" value="#{doItems.unitPrice}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.qty']}"
				style="text-align:center">
				<h:outputText value="#{doItems.orderedQty}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />	
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.do.delivery.qty']}"
				style="text-align:center">
				<h:panelGroup id="delQtyTxt">
					<h:outputText value="#{doItems.deliveredQty}" size="5" style="float:right;"
						styleClass="colFloatRight">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.amount']}"
				style="text-align:center">
				<h:panelGroup id="delAmountTxt">
					<h:outputText value="#{doItems.deliveredAmt}" disabled="true" style="float:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}"
				style="text-align:center">
				<h:outputText value="#{doItems.orderedAmt}" style="float:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

	<!-- 28855 Start -->
	<p:dialog id="doItemInfoDialog" header="#{lbl['lbl.fl.do.item']}"
		widgetVar="doItemInfo" showEffect="fade" hideEffect="fade"
		modal="true" width="900" height="400" resizable="false"
		style="overflow:scroll">
		<table style="width: 100%">
			<tr>
				<td valign="top" width="25%"><p:outputLabel
						value="#{lbl['lbl.fl.item.name']} :&#160;" /></td>
				<td><p:inputTextarea disabled="true" size="35" style="float:left;"
						rendered="#{createDOBackingBean.managedBean.dpFlag}"
						value="#{createDOBackingBean.managedBean.itemName}" cols="60" rows="3" autoResize="false"></p:inputTextarea>
					<h:outputText
						style="float:left;"
						rendered="#{!createDOBackingBean.managedBean.dpFlag}"
						value="#{createDOBackingBean.managedBean.itemName}" /></td>
			</tr>
			<tr>
				<td valign="top" width="25%"><p:outputLabel
						value="#{lbl['lbl.fl.supp.offer']} :&#160;"
						rendered="#{createDOBackingBean.managedBean.dpFlag}" /></td>
				<td><p:inputTextarea disabled="true" style="float:left;"
						rendered="#{createDOBackingBean.managedBean.dpFlag}"
						escape="false"
						value="#{createDOBackingBean.managedBean.supplierOffer == null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.managedBean.supplierOffer}"
						cols="60" rows="3" autoResize="false"></p:inputTextarea> <ac:iconTooltip
						value="#{lbl['lbl.fl.supp.offer.tooltip']}"
						rendered="#{createDOBackingBean.managedBean.dpFlag}" /></td>
			</tr>
			<tr>
				<td valign="top" width="25%"><p:outputLabel
						value="#{lbl['lbl.fl.new.supp.offer']} :&#160;"
						rendered="#{createDOBackingBean.managedBean.dpFlag}" /></td>
				<td><p:inputTextarea disabled="true" style="float:left;"
						rendered="#{createDOBackingBean.managedBean.dpFlag}"
						value="#{createDOBackingBean.managedBean.newOfferedSpec == null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.managedBean.newOfferedSpec}"
						cols="60" rows="3" autoResize="false"></p:inputTextarea> <ac:iconTooltip
						value="#{lbl['lbl.fl.new.supp.offer.tooltip']}"
						rendered="#{createDOBackingBean.managedBean.dpFlag}" /></td>
			</tr>
		</table>
		<p:dataTable id="specificationDt" var="specificationList"
			value="#{createDOBackingBean.managedBean.itemSpecList}" width="100%">
			<ac:paginator for="specificationDt" />

			<p:column headerText="#{lbl['lbl.fl.spec']}"
				style="text-align:center"
				rendered="#{createDOBackingBean.managedBean.dpFlag}">
				<p:inputTextarea disabled="true"
					rendered="#{createDOBackingBean.managedBean.dpFlag}"
					styleClass="colFloatLeft" value="#{specificationList.itemSpec}"
					cols="135" rows="2" style="width: 100% !important;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.spec']}"
				style="text-align:center"
				rendered="#{!createDOBackingBean.managedBean.dpFlag}">
				<p:inputTextarea cols="41" rows="10" id="itemSpecification"
					rendered="#{!createDOBackingBean.managedBean.dpFlag}"
					styleClass="colFloatLeft" autoResize="false"
					style="width: 96% !important; margin-left:0px;" disabled="true"
					value="#{specificationList.itemSpec == null ? lbl['lbl.fl.supp.na'] : specificationList.itemSpec}" />
			</p:column>
			<p:column rendered="#{!createDOBackingBean.managedBean.dpFlag}">
				<f:facet name="header" style="text-align:center">
					<h:outputText value="#{lbl['lbl.fl.supp.offer']}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.supp.offer.spec.tooltip']}" />
				</f:facet>
				<p:inputTextarea cols="41" rows="10" id="supplierOffer"
					rendered="#{!createDOBackingBean.managedBean.dpFlag}"
					styleClass="colFloatLeft" autoResize="false"
					style="width: 96% !important; margin-left:0px;" disabled="true"
					value="#{specificationList.supplierOffer == null ? lbl['lbl.fl.supp.na'] : specificationList.supplierOffer}" />
			</p:column>
			<p:column rendered="#{!createDOBackingBean.managedBean.dpFlag}">
				<f:facet name="header" style="text-align:center">
					<h:outputText value="#{lbl['lbl.fl.new.offer.spec']}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.new.supp.offer.tooltip']}" />
				</f:facet>
				<p:inputTextarea cols="41" rows="10" id="newOfferedSpec"
					rendered="#{!createDOBackingBean.managedBean.dpFlag}"
					styleClass="colFloatLeft" autoResize="false"
					style="width: 96% !important; margin-left:0px;" disabled="true"
					value="#{specificationList.newOfferSpec == null ? lbl['lbl.fl.supp.na'] : specificationList.newOfferSpec}" />
			</p:column>
		</p:dataTable>

		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.close']}" process="@this"
				oncomplete="doItemInfo.hide()" partialSubmit="true">
			</p:commandButton>
		</div>

	</p:dialog>
	<!-- 28855 End -->

</ui:composition>
