<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 99%;" class="header-info">
		<tr style="margin-button: 10px;">

			<td>
				<h6>
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.del.ord.poco.no']} " />
				</h6>
			</td>
			<td>
				<h6>
					<p:inputText size="20"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.docNo}"
						disabled="true" />
				</h6>

			</td>
			<td>
				<h6>
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.ptj.name']} " />
				</h6>
			</td>
			<td>
				<h6>
					<p:inputText
						size="45" disabled="true" value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}" />
				</h6>
			</td>

			<td>
				<h6>
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.status']} " />
				</h6>
			</td>
			<td>
				<h6>
					<p:inputText size="30"
						value="#{createDOBackingBean.getStatusDescById(createDOBackingBean.managedBean.fulfilmentRequest.status.statusId)}"
						disabled="true" />
				</h6>
			</td>
		</tr>
	</table>
</ui:composition>
