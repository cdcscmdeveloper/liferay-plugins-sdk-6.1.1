<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 99%; margin-left: 25px;">
		<tr style="margin-button: 10px;">

			<td>
				<h6 style="color: blue;">
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.del.ord.no']} ." />
				</h6>
			</td>
			<td>
				<h6>
					<p:inputText size="30"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.docNo}"
						disabled="true" />
				</h6>

			</td>
			<td><h6 style="color: blue;">
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.request.note.no']} ." />
				</h6></td>
			<td>
				<h6>
					<p:inputText value="RNPTJ00142020200" disabled="true" size="30" />
				</h6>
			</td>

			<td>
				<h6 style="color: blue;">
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.ptj.name']} " />
				</h6>
			</td>
			<td>
				<h6>
					<p:inputText
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.receivedOrgProfile.parentOrgProfile.orgName}"
						size="40" disabled="true" />
				</h6>
			</td>

			<td>
				<h6 style="color: blue;">
					<p:outputLabel value="#{lbl['lbl.fl.rev.hed.status']} " />
				</h6>
			</td>
			<td>
				<h6>
					<p:inputText size="30"
						value="#{createDOBackingBean.getStatusDescById(createDOBackingBean.managedBean.fulfilmentRequest.status.statusId)}"
						disabled="true" />
				</h6>
			</td>
		</tr>
	</table>
</ui:composition>
