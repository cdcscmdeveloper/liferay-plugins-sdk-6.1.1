<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<script>
			$('#portlet_flDeliveryOrder_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{createDOBackingBean.getPortletTitle()}');
		</script>
		<f:event listener="#{createDOBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="#{createDOBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info, warn" />
			
		<table>
			<tr>
				<td><p:outputLabel value="1GFMAS Error: "
						rendered="#{createDOBackingBean.managedBean.gfmasError}" /></td>
				<td><p:commandLink oncomplete="gfmasError.show();" immediate="true"
						action="#{createDOBackingBean.show1GFMASError()}"
						rendered="#{createDOBackingBean.managedBean.gfmasError}">
						<p:graphicImage value="/css/images/design/exclamation.png" />
					</p:commandLink></td>
			</tr>
		</table>
		<ac:gpkiPopup 
			textBeforeSign="#{createDOBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{createDOBackingBean.preSubmitDeliveryOrder(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{createDOBackingBean.enableAutoUpdate()}" />
		<ac:spkiPopup id="spkiPopUp"
		 password="#{createDOBackingBean.managedBean.spkiBackingBean.password}"
   		 challengeAns1="#{createDOBackingBean.managedBean.spkiBackingBean.challengeAns1}"
  		 challengeQues1="#{createDOBackingBean.managedBean.spkiBackingBean.challengeQues1}"
		 postSignAction="#{createDOBackingBean.preSubmitDeliveryOrder(spkiBackingBean.pmDigiSign)}"
		 enableAutoUpdate="#{createDOBackingBean.enableAutoUpdate()}" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" rendered="#{createDOBackingBean.managedBean.taskId==null}" 
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						action="#{createDOBackingBean.backAction}" /></td>
				<h:panelGroup
					rendered="#{empty createDOBackingBean.managedBean.buttonVal}">
					<td colspan="4" style="text-align: right">
						<p:commandButton
							styleClass="ui-button"  value="#{lbl['lbl.btn.save']}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form"  
							action="#{createDOBackingBean.createDeliveryOrder('SAVE')}" /> 
						<p:commandButton update="spkiPopUp, @form"
							styleClass="ui-button"  value="#{lbl['lbl.btn.submit']}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.signingAction('SUBMIT')}" />
					</td>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{createDOBackingBean.managedBean.buttonVal eq 'ACK'}">
					<td colspan="4" style="text-align: right"><ui:repeat
							var="bpmAction"
							value="#{createDOBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								action="#{createDOBackingBean.signingAction(bpmAction)}" />
						</ui:repeat></td>
				</h:panelGroup>
				
				<h:panelGroup
					rendered="#{createDOBackingBean.managedBean.buttonVal eq 'Update'}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.update']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.signingAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{createDOBackingBean.managedBean.buttonVal eq 'Cancel'}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.cancel']}" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.signingAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</h:panelGroup>
				<c:if test='#{createDOBackingBean.managedBean.buttonVal eq "View"}'>
					<td colspan="4" style="text-align: right"><p:commandLink 
							rendered="#{!createDOBackingBean.managedBean.isHyperLinkPage()}"
							value="#{lbl['lbl.td.doc.trackingDiary']}"
							action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeDeliveryOrder,createDOBackingBean.managedBean.flDeliveryOrder.deliveryOrderId)}"
							immediate="true" /></td>
				</c:if>
				<h:panelGroup id="printButtonDo"
					rendered="#{(createDOBackingBean.managedBean.flDeliveryOrder.status.statusId != FulfilmentStatusCont.doPendingAcknowledgement) and (createDOBackingBean.managedBean.flDeliveryOrder.deliveryOrderNo != null)}">
					<td style="text-align: right; width: 30px;"><p:commandLink
							value="#{lbl['lbl.btn.print']}" ajax="false">
							<p:fileDownload
								value="#{flDocumentBackingBean.generateReport(ParameterConst.doctypeDeliveryOrder,createDOBackingBean.managedBean.flDeliveryOrder.deliveryOrderNo,flDocumentManagedBean.taxable)}" />
						</p:commandLink></td>
				</h:panelGroup>
			</tr>
		</table>
		<ui:include src="doReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{createDOBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.do.delivery.items']}" update="@form" actionListener="#{createDOBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
					</p:tabMenu></td>
				<h:panelGroup id="doMaintenence" rendered="#{createDOBackingBean.managedBean.isModificationCancel() or not empty createDOBackingBean.managedBean.buttonVal }">
					<td width="80%"><p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="doMaintenenceGeneral.xhtml" />
						</p:outputPanel> <p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 1}">
							<ui:include src="doMaintenenceItem.xhtml" />
						</p:outputPanel></td>
				</h:panelGroup>
				<h:panelGroup id="do" rendered="#{empty createDOBackingBean.managedBean.buttonVal and !createDOBackingBean.managedBean.isModificationCancel()}">
					<td width="80%"><p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="doGeneral.xhtml" />
						</p:outputPanel> <p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 1}">
							<ui:include src="doItem.xhtml" />
						</p:outputPanel></td>
				</h:panelGroup>
			</tr>
		</table>
		<p:dialog id="gfmasErrorDlg" header="1GFMAS Error" widgetVar="gfmasError"
		showEffect="fade" hideEffect="fade" modal="true" 
		resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:messages id="gfmasMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" /></td>
			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Close" oncomplete="gfmasError.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	</ui:define>
</ui:composition>
