<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<script>
			$('#portlet_flDeliveryOrder_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{createDOBackingBean.getPortletTitle()}');
		</script>
		<f:event listener="#{createDOBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true" rendered="#{createDOBackingBean.managedBean.taskId==null}" 
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						icon="ui-icon-back" action="#{createDOBackingBean.backAction}" /></td>
				<h:panelGroup
					rendered="#{empty createDOBackingBean.managedBean.buttonVal}">
					<td colspan="4" style="text-align: right"><p:commandButton
							styleClass="ui-button" icon="ui-icon-save" value="Save"
							ajax='false' onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.createDeliveryOrder('SAVE')}" /> <p:commandButton
							styleClass="ui-button" icon="ui-icon-submit" value="Submit"
							ajax='false' onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.createDeliveryOrder('SUBMIT')}" />
						<p:commandButton value="STOP DELIVERY" icon="ui-icon-cancel" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							rendered="#{false and createDOBackingBean.managedBean.statusDesc eq 'Pending Partial Fulfilment'}"
							action="#{createDOBackingBean.stopDelivery}" immediate="true" />
					</td>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{createDOBackingBean.managedBean.buttonVal eq 'ACK'}">
					<td colspan="4" style="text-align: right"><ui:repeat
							var="bpmAction"
							value="#{createDOBackingBean.managedBean.outComes}">
							<p:commandButton value="#{bpmAction}" update="@form"
								styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
								icon="ui-icon-#{fn:toLowerCase(bpmAction)}" 
								action="#{createDOBackingBean.createDeliveryOrder(bpmAction)}" />
						</ui:repeat></td>
				</h:panelGroup>
				
				<h:panelGroup
					rendered="#{createDOBackingBean.managedBean.buttonVal eq 'Update'}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE" icon="ui-icon-edit" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.createDeliveryOrder('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{createDOBackingBean.managedBean.buttonVal eq 'Cancel'}">	
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL" icon="ui-icon-cancel" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							action="#{createDOBackingBean.createDeliveryOrder('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</h:panelGroup>
			</tr>
		</table>
		<ui:include src="doReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{createDOBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="Delivery Items" update="@form">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
					</p:tabMenu></td>
				<h:panelGroup id="doMaintenence" rendered="#{createDOBackingBean.managedBean.isModificationCancel() or not empty createDOBackingBean.managedBean.buttonVal }">
					<td width="80%"><p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="doMaintenenceGeneral.xhtml" />
						</p:outputPanel> <p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 1}">
							<ui:include src="doMaintenenceItem.xhtml" />
						</p:outputPanel></td>
				</h:panelGroup>
				<h:panelGroup id="do" rendered="#{empty createDOBackingBean.managedBean.buttonVal and !createDOBackingBean.managedBean.isModificationCancel()}">
					<td width="80%"><p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="doGeneral.xhtml" />
						</p:outputPanel> <p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 1}">
							<ui:include src="doItem.xhtml" />
						</p:outputPanel></td>
				</h:panelGroup>
			</tr>
		</table>
	</ui:define>
</ui:composition>
