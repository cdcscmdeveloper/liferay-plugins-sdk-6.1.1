<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<f:event listener="#{createDOBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true"
						icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<c:if test="#{empty createDOBackingBean.managedBean.buttonVal}">

					<td colspan="4" style="text-align: right">
						<p:commandButton styleClass="ui-button" icon="ui-icon-save"
							value="Save" ajax='false'
							action="#{createDOBackingBean.createDeliveryOrder('SAVE')}" />						
						<p:commandButton styleClass="ui-button" icon="ui-icon-submit"
							value="Submit" ajax='false'
							action="#{createDOBackingBean.createDeliveryOrder('SUBMIT')}" />
						<p:commandButton value="STOP DELIVERY" icon="ui-icon-cancel"
							rendered="#{createDOBackingBean.managedBean.statusDesc eq 'Pending Partial Fulfilment'}"
							action="#{createDOBackingBean.stopDelivery}" immediate="true" />
					</td>
				</c:if>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<c:if
					test='#{createDOBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{createDOBackingBean.createDeliveryOrder('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{createDOBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{createDOBackingBean.createDeliveryOrder('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<ui:include src="doReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu styleClass="sidemenu"
						style="display : table-caption;"
						activeIndex="#{createDOBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="Delivery Items" update="@form">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>

					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="doGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="doItem.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
