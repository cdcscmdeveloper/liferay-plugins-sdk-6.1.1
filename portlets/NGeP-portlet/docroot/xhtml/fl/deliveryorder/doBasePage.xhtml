<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" 
			closable="true" severity="error, info" />
		<table style="width: 100%;">

			<tr>
				<td><p:commandButton value="Back" immediate="true" icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<c:if test="#{empty createDOBackingBean.managedBean.buttonVal}">

					<td colspan="4" style="text-align: right" ><p:commandButton
							value="Submit" ajax='false'
							action="#{createDOBackingBean.createDeliveryOrder('Submit')}" />
						<p:commandButton value="Stop Delivery" icon="ui-icon-cancel" 
							action="#{createDOBackingBean.stopDelivery}" immediate="true" />
					</td>
				</c:if>
			</tr>

		</table>

		<table style="width: 100%;">
			<tr>
				<c:if
					test='#{createDOBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{createDOBackingBean.createDeliveryOrder('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{createDOBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{createDOBackingBean.createDeliveryOrder('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<ui:include src="doReviewHeaderPage.xhtml" />
		<p:spacer height="20px"/>
		<p:tabView id="dotabs" orientation="left" widgetVar="tt">
			<p:tab title="General">
				<ui:include src="doGeneral.xhtml" />
			</p:tab>
			<p:tab title="Item and Remarks">
				<ui:include src="doItem.xhtml" />
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
