<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="REQUEST DETAILS" toggleable="true" id="flDoDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="53" id="doministry"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="53" rows="4" 
						disabled="true" style=" margin-bottom:5px;"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.title}" />
					<h:outputText value="" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="5" id="dopreparedOrgProfileId"
						disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" id="doissuedOrgProfileId"
						disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText id="dochargedPtj" size="39"
						disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Requistioner" /></td>
				<td><p:inputText size="53" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.requistioner.userName}" />
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td style="width: 100px"><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" /></td>
							<td style="width: 74px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
						</tr>
					</table></td>
					<td style="width: 184px;"><p:outputLabel
							value="#{lbl['lbl.fl.supp.ref.no']}" /></td>
					<td><p:inputText size="25"
							value="#{createDOBackingBean.managedBean.flDeliveryOrder.supplierDoRef}" readonly="#{createDOBackingBean.managedBean.buttonVal == 'View'}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.supplierName}" /></td>
				<td style="width: 140px;"><p:outputLabel
						value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"  value="#{createDOBackingBean.managedBean.fulfilmentRequest.createdDate}"><f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" /></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.branchName}" /></td>
				<td style="width: 140px;"><p:outputLabel
						value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="15" disabled="true" value="#{createDOBackingBean.managedBean.fulfilmentRequest.submissionDate}"><f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" /></p:inputText></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{flOrderBB.getFullAddress(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 74px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="19"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<h:panelGroup  rendered="#{createDOBackingBean.managedBean.isModificationCancel() or not empty createDOBackingBean.managedBean.buttonVal }">
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true" >
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/doMaintainattachment.xhtml" /></td>				
			</tr>
		</table>
	</p:panel>
	</h:panelGroup>
</ui:composition>
