<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 126px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="66" id="ministry"
						value="#{createDOBackingBean.retrieveMinistryByOrgProfileId(createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId, createDOBackingBean.managedBean.fulfilmentRequest.agApprovedDate)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td><p:inputTextarea rows="2" cols="67"  readonly="true" autoResize="false" style="resize:none;" 
						value="#{createDOBackingBean.retrievePegawaiPengawalByOrgProfileId(createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId, createDOBackingBean.managedBean.fulfilmentRequest.agApprovedDate)}"/>
				</td>
			</tr>
			<tr>
				<td valign="top" style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputTextarea rows="2" cols="67"  readonly="true" autoResize="false" style="resize:none;" 
						value="#{createDOBackingBean.retrieveJabatanByOrgProfileId(createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId, createDOBackingBean.managedBean.fulfilmentRequest.agApprovedDate)}"/>
				</td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputTextarea rows="2" cols="67"  readonly="true" autoResize="false" style="resize:none;" 
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgCode} #{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputTextarea rows="2" cols="67"  readonly="true" autoResize="false" style="resize:none;" 
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgCode} #{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputTextarea rows="2" cols="67"  readonly="true" autoResize="false" style="resize:none;" 
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgCode} #{createDOBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.do.requisitioner']}" /></td>
				<td><p:inputText size="66" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.requistioner.userName}" />
				</td>
			</tr>
			<tr>
				<td valign="top" style="width: 108px;"><p:outputLabel
						value="#{lbl['lbl.fl.do.title']}" /></td>
				<td ><p:inputTextarea cols="67" rows="4" id="title"
						disabled="true" style=" margin-bottom:5px;" autoResize="false"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.title}" /> <h:outputText
						value="" /></td>						
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="66" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.getParameterDesc(createDOBackingBean.managedBean.fulfilmentRequest.procurementTypeCategory)}" /></td>		
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 130px;"><p:inputText size="15"
									disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" /></td>
							<td><ac:iconTooltip
									value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}" /></td>
							<td style="width: 60px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.mofNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}" />
								
							</td>
						</tr>
					</table></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width: 205px;"><p:inputText size="15"
						disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{createDOBackingBean.managedBean.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.managedBean.gstRegNo}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{createDOBackingBean.managedBean.gstDeclareDate ==null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.managedBean.gstDeclareDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{createDOBackingBean.managedBean.gstEffDate ==null ? lbl['lbl.fl.supp.na'] : createDOBackingBean.managedBean.gstEffDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="60"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="60" value="#{createDOBackingBean.getText(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.branchName)}"/><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.branch']}"/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="55" rows="8" disabled="true" autoResize="false"
						style=" margin-bottom:5px;"
						value="#{flOrderBB.getFullAddress(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress)}"
						 /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="25"
									disabled="true"
									value="#{createDOBackingBean.getText(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.phoneNoFull)}" /></td>
							<td style="width: 88px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="25" disabled="true"
									value="#{createDOBackingBean.getText(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.faxNoFull)}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="70" value="#{createDOBackingBean.getText(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.contactPerson)}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="70" value="#{createDOBackingBean.getText(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.contactEmail)}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="25" value="#{createDOBackingBean.getText(createDOBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.contactPhoneNoFull)}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.stop.instr.rejection.details']}" toggleable="true" rendered="#{createDOBackingBean.managedBean.isDisplayStopIntrDetls()}">
		<table style="width: 100%">
			<tr>
				<td width="200px;"><p:outputLabel value="#{lbl['lbl.fl.stop.instuc.no']}" /></td>
				<td><p:commandLink value="#{createDOBackingBean.managedBean.flStopInstr.stopInstrNo}" immediate="true"
					action="#{createDOBackingBean.navigateDocument(createDOBackingBean.managedBean.flStopInstr.stopInstrId)}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.txt.reject.date']}" /></td>
				<td><p:inputText disabled="true" size="15"
						value="#{createDOBackingBean.managedBean.flStopInstr.changedDate}">
					<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.stop.instuc.remark']}" /></td>
				<td><p:inputTextarea cols="40"  value="#{createDOBackingBean.managedBean.rejectedRemark.get(0).remark}" autoResize="false" disabled="true"/> </td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
