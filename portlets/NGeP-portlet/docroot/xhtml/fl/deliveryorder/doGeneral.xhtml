<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td style="width: 10px;"><p:inputText size="50" id="ministry"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 99px;"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="6"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.title}"
						style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="37" id="preparedPtj"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText size="37" id="issuePtj"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.mto']}" /></td>
				<td><p:selectOneRadio
						value="#{flOrderBB.managedBean.factoringCheck}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="* #{lbl['lbl.fl.del.ord.requisitioner']}" /></td>
				<td><p:inputText size="50" id="receivedPtj"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.receivedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td rowspan="3"><p:inputTextarea id="delAddrText" cols="50"
						rows="8"
						value="#{createDOBackingBean.managedBean.selectedLovDelAddr}"
						style=" margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel
						value="* #{lbl['lbl.fl.del.ord.supp.ref.no']}" /></td>
				<td><p:inputText size="25" value="#{createDOBackingBean.managedBean.flDeliveryOrder.supplierDoRef}" requiredMessage="Please input the supplier reference number." required="true"/></td>
			</tr>
			<tr>
				<td ><p:outputLabel
						value="* #{lbl['lbl.fl.delivery.start']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						pattern="dd/mm/yyyy"
						value="#{createDOBackingBean.managedBean.flDeliveryOrder.estStartDate}"
						requiredMessage="Start date is Required" required="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.delivery.end']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						pattern="dd/mm/yyyy"
						value="#{createDOBackingBean.managedBean.flDeliveryOrder.estEndDate}"
						requiredMessage="End date is Required" required="true" /></td>
			</tr>
			<tr>
				<td style="width: 103px;"><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td style="width: 50px;"><p:inputText size="50" style=" margin-bottom:5px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText size="50" style=" margin-bottom:5px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText size="50" style=" margin-bottom:5px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="" /></td>
				<td><p:commandButton value="Select Delivery Address"
						action="#{createDOBackingBean.delAddrList}" update="delAddr"
						oncomplete="delAddrList.show();" process="@this,delAddr" /></td>
			</tr>
			
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 102px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td style="width: 50px;"><p:inputText size="25" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo}" /></td>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true" style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>

	<p:dialog id="delAddrList" header="Select Delivery Address"
		widgetVar="delAddrList" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="600" resizable="false">

		<p:dataTable id="delAddr" var="delivery"
			value="#{createDOBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
			rowKey="#{delivery}"
			selection="#{createDOBackingBean.managedBean.selectedDelAddr}">
			<p:ajax event="rowSelect" update=":form:dotabs:delAddr" />
			<ac:paginator for="delAddr" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="ADDRESS"></p:column>
					<p:column rowspan="1" headerText="Exp.Delivery Start"></p:column>
					<p:column rowspan="1" headerText="Exp.Delivery End"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="single" />
			<p:column>
				<h:outputText value="#{delivery.addressType.pmAddress.address1}" />
				<h:outputText rendered="#{delivery.addressType != null}"
					value="#{delivery.addressType.pmAddress.address1}, #{delivery.addressType.pmAddress.address2}, #{delivery.addressType.pmAddress.address3}, #{delivery.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{delivery.addressType eq null}"
					value="#{delivery.pmAddress.address1}, #{delivery.pmAddress.address2}, #{delivery.pmAddress.address3}, #{delivery.pmAddress.address4}" />
			</p:column>
			<p:column>
				<h:outputText value="#{delivery.startDate}">
					<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText value="#{delivery.endDate}">
					<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Add"
				action="#{createDOBackingBean.updateDeliveryAddrText}"
				oncomplete="delAddrList.hide();" process="@this,delAddr"
				update="delAddrText,:form:dotabs:itemDataTable">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
