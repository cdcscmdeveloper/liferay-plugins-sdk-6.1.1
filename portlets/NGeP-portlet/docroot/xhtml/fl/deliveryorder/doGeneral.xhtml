<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="SUPPLIER DETAIL (FROM)" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td ><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.del.ord.no']}" /></td>
				<td><p:inputText size="20"
						value="- system generated -" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="35" value="KBB SDN BHD"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.del.ord.date']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td rowspan="2"><p:inputTextarea id="delAddrText"  cols="36"
						value="#{createDOBackingBean.managedBean.selectedLovDelAddr}"
						style=" margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.supp.del.ord.no']}" /></td>
				<td><p:inputText size="20" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.ord.no']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText size="35" style=" margin-bottom:5px;"
						value="KBB.XY@gmail.com" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="20" value="02-7324800"
						disabled="true" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="" /></td>
				<td><p:commandButton value="Select Delivery Address"
						action="#{createDOBackingBean.delAddrList}" update="delAddr"
						oncomplete="delAddrList.show();" process="@this,delAddr" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.status']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>

			</tr>
		</table>
	</p:panel>
	<p:panel header=" FULFILMENT DETAIL (TO)" toggleable="true">

		<br />
		<table style="width: 100%">
			<tr>
				<td style="width:104px;"><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td style="width:100px;"><p:inputText size="35"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
				<td style="width:225px;"><p:outputLabel value="* #{lbl['lbl.fl.delivery.start']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						pattern="dd/mm/yyyy"
						value="#{createDOBackingBean.managedBean.flDeliveryOrder.estStartDate}"
						requiredMessage="Start date is Required" required="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:inputText size="35"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.delivery.end']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						pattern="dd/mm/yyyy"
						value="#{createDOBackingBean.managedBean.flDeliveryOrder.estEndDate}"
						requiredMessage="End date is Required" required="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:inputText size="35"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ) " disabled="true" /></td>
				<td colspan="3"></td>
				<td colspan="4"></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.delivery.address']}" /></td>
				<td><p:inputTextarea  cols="36"
						style="margin-bottom:5px;" disabled="true"
						value="#{createDOBackingBean.managedBean.deliveryAddress.addressType.pmAddress.address1}" /></td>
				<td colspan="3"></td>
				<td colspan="4"></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.account']}" /></td>
				<td><p:inputText size="20" value="0001010"
						disabled="true" /></td>
				<td colspan="3"></td>
				<td colspan="4"></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

	<p:dialog id="delAddrList" header="Select Delivery Address"
		widgetVar="delAddrList" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="600" resizable="false">

		<p:dataTable id="delAddr" var="delivery"
			value="#{createDOBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
			rowKey="#{delivery}"
			selection="#{createDOBackingBean.managedBean.selectedDelAddr}">
			<p:ajax event="rowSelect" update=":form:dotabs:delAddr" />
			<ac:paginator for="delAddr" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Del. Address Id"></p:column>
					<p:column rowspan="1" headerText="Del. Address"></p:column>
					<p:column rowspan="1" headerText="Start Date"></p:column>
					<p:column rowspan="1" headerText="End Date"></p:column>
					<p:column rowspan="1" headerText="Status"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="single" />
			<p:column>
				<h:outputLabel value="#{delivery.deliveryAddressId}" />
			</p:column>
			<p:column>
				<h:outputText value="#{delivery.addressType.pmAddress.address1}" />
			</p:column>
			<p:column>
				<h:outputText value="#{delivery.startDate}">
					<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText value="#{delivery.endDate}">
					<f:convertDateTime pattern="MM-dd-yyyy HH:mm" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText value="Active" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Add"
				action="#{createDOBackingBean.updateDeliveryAddrText}"
				oncomplete="delAddrList.hide();" process="@this,delAddr"
				update="delAddrText,:form:dotabs:itemDataTable">
			</p:commandButton>
		</div>


	</p:dialog>
</ui:composition>
