<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 132px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td style="width: 10px;"><p:inputText size="50" id="ministry"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top" style="width: 139px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.title}"
						style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="7" /> <p:inputText size="39" id="preparedPtj"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="7" /> <p:inputText size="39" id="issuePtj"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgProfileId}" />
					<p:spacer width="7" /> <p:inputText size="39" id="chargedPtj"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.requisitioner']}" /></td>
				<td><p:inputText size="50" id="receivedPtj"
						
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" /></td>
							<td style="width: 72px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{createDOBackingBean.managedBean.fulfilmentRequest.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{flOrderBB.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.supplierBranch.phoneNo}" /></td>
							<td style="width: 72px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{createDOBackingBean.managedBean.fulfilmentRequest.supplierBranch.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="19" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
