<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<table style="width: 800px;">

		<tr>
			<td colspan="4" align="right">
				<p:commandButton value="SUBMIT" ajax='false'
					action="#{createDOBackingBean.createDeliveryOrder}" /> <p:commandButton value="PRINT" /></td>
		</tr>
		
	</table>
	<c:if
		test='#{createDOBackingBean.managedBean.docProcess eq "DO"}'>
		<p:commandButton value="Cancel" />
	</c:if>

	<p:panel header="SUPPLIER DETAIL (FROM)" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Supplier ID" /></td>
				<td><p:inputText style="width: 260px;"  disabled="true" /></td>
				<td><p:outputLabel value="Delivery Order NO." /></td>
				<td><p:inputText style="width: 260px;"
						value="- system generated -" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText style="width: 260px;" value="KBB SDN BHD"
						disabled="true" /></td>
				<td><p:outputLabel value="Delivery Order Date" /></td>
				<td><p:inputText style="width: 260px;"  disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="4"><p:outputLabel value="Address" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
				<td><p:outputLabel value="Supp. Del. Order NO." /></td>
				<td><p:inputText style="width: 260px;"  /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Order NO." /></td>
				<td><p:inputText style="width: 260px;"  disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText style="width: 260px;"  disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText style="width: 260px;" value="KBB.XY@gmail.com"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Telephone NO." /></td>
				<td><p:inputText style="width: 260px;" value="02-7324800"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header=" FULFILMENT DETAIL (TO)" toggleable="true">

		<br />
		<table>
			<tr>
				<td><p:outputLabel value="Ministry" /></td>
				<td><p:inputText style="width: 260px;"
						value="KEMENTERIAN KEWANGAN" disabled="true" /></td>
				<td><p:outputLabel value="Delivery (Start)" /></td>
				<td><p:calendar mode="popup" showOn="button"
						value="#{createDOBackingBean.managedBean.flDeliveryOrder.estStartDate}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Jabatan" /></td>
				<td><p:inputText style="width: 260px;"
						value="JABATAN KASTAM DAN EKSAIS DIRAJA" disabled="true" /></td>
				<td><p:outputLabel value="Delivery (End)" /></td>
				<td><p:calendar mode="popup" showOn="button" value="#{createDOBackingBean.managedBean.flDeliveryOrder.estEndDate}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Received PTJ" /></td>
				<td><p:inputText style="width: 260px;"
						value="IBU PEJABAT KASTAM (RECEIVING PTJ) " disabled="true" /></td>
				<td colspan="3"></td>
				<td colspan="4"></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Delivery Address" /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" value="#{createDOBackingBean.managedBean.deliveryAddress.orgAddress.pmAddress.address1}"/></td>
				<td colspan="3"></td>
				<td colspan="4"></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Charge Account" /></td>
				<td><p:inputText style="width: 260px;" value="0001010"
						disabled="true" /></td>
				<td colspan="3"></td>
				<td colspan="4"></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REMARKS And ATTACHMENT" toggleable="true">
		<br />
		<table>
			<tr>
				<td><p:outputLabel value="* Remarks    " /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;" /></td>
				<td><p:outputLabel value="Attachment" /></td>
				<td><p:commandButton value="Attach Files" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
