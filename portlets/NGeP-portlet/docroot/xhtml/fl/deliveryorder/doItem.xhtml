<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<p:dataTable id="doDelAddress" var="doDelAddress"
			styleClass="orderSummaryChange hide-column-names"
			selection="#{createDOBackingBean.managedBean.selectedAddrRow}"
			rowIndexVar="index" rowKey="#{doDelAddress}"
			value="#{createDOBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}">
			<ac:paginator for="doDelAddress" />
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="Delivery Address">
				<h:outputText rendered="#{doDelAddress.addressType !=null}"
					value="#{doDelAddress.addressType.pmAddress.address1}, #{doDelAddress.addressType.pmAddress.address2}, #{doDelAddress.addressType.pmAddress.address3}, #{doDelAddress.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{doDelAddress.addressType eq null}"
					value="#{doDelAddress.pmAddress.address1}, #{doDelAddress.pmAddress.address2}, #{doDelAddress.pmAddress.address3}, #{doDelAddress.pmAddress.address4}" />
			</p:column>
			<p:column>
				<h:outputText value="Delivery Start / End" />
				<p:spacer width="7" />
				<p:inputText size="13" value="10/02/2014" disabled="true" />
				<p:spacer width="7" />
				<p:inputText size="13" value="10/02/2014" disabled="true" />
			</p:column>
			<p:column>
				<h:outputText value="* Supplier Ref. No." />
				<p:spacer width="15" />
				<p:inputText></p:inputText>
				<p:commandLink oncomplete="addRemarks.show();" action="#{fulfilmentBackingBean.openAttachmentPage(doDelAddress)}" update=":form:dotabs:addRemarmAttachmentDialog" >
					<p:graphicImage library="ep/images/design" name="attach.png"
						value="/resources/ep/images/design/attach.png"
						title="Remark and Attachment" />
				</p:commandLink>
			</p:column>
			<p:rowExpansion>
				<p:dataTable id="doItems" var="doItems" selectionMode="single"
					rowIndexVar="index" rowKey="#{doItems}"
					selection="#{createDOBackingBean.managedBean.selectedItemRow}"
					value="#{doDelAddress.flFulfilmentItemAddr}"
					styleClass="show-column-names">
					<p:ajax event="rowSelect"
						listener="#{createDOBackingBean.selectItemEvent(doItems)}"
						update="@(.#{index+1}OrderAmountSection)" />
					<p:column headerText="Item Type">
						<h:outputText
							value="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType}" />
					</p:column>
					<p:column headerText="Item Code">
						<h:outputText />
					</p:column>
					<p:column headerText="Item Name">
						<h:outputText
							value="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemName}" />
					</p:column>
					<p:column headerText="UOM">
						<h:outputText />
					</p:column>
					<p:column headerText="Unit Price (RM)">
						<h:outputText disabled="true" value="#{doItems.unitPrice}"
							style="text-align:right">
							<f:convertNumber pattern="#,#00.00" />
						</h:outputText>
					</p:column>
					<p:column headerText="Ordered Qty.">
						<h:outputText value="#{doItems.orderedQty}"
							style="text-align:right" />
					</p:column>
					<p:column headerText="Received Qty.">
						<h:outputText value="#{doItems.receivedQty}" />
					</p:column>
					<p:column headerText="Delivered Qty.">
						<p:inputText value="#{doItems.deliveredQty}" size="5"
							rendered="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P' and createDOBackingBean.managedBean.docType eq 'PR'}">
							<p:ajax event="blur" update="delAmountTxt" process="@this"
								listener="#{createDOBackingBean.retrievedDelAmount(doItems)}" />
						</p:inputText>
						<p:inputText value="#{doItems.deliveredQty}" size="5"
							rendered="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S' and doItems.orderedQty > 1 and createDOBackingBean.managedBean.docType eq 'PR'}">
							<p:ajax event="blur" update="delAmountTxt" process="@this"
								listener="#{createDOBackingBean.retrievedDelAmount(doItems)}" />
						</p:inputText>
						<p:inputText value="#{doItems.deliveredQty}" disabled="true"
							rendered="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S' and doItems.orderedQty == 1 and createDOBackingBean.managedBean.docType eq 'PR'}" />
						<p:inputText value="#{item.deliveredQty}"
							rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}">
						</p:inputText>
					</p:column>
					<p:column headerText="Ordered Amt.(RM)">
						<h:outputText value="#{doItems.orderedAmt}"
							style="text-align:right" disabled="true">
							<f:convertNumber pattern="#,#00.00" />
						</h:outputText>
					</p:column>
					<p:column headerText="Received Amt.(RM)">
						<h:outputText value="#{doItems.receivedAmt}">
							<f:convertNumber pattern="#,#00.00" />
						</h:outputText>
					</p:column>
					<p:column headerText="Delivered Amt.(RM)">
						<h:panelGroup id="delAmountTxt">
							<h:outputText value="#{doItems.deliveredAmt}"
								rendered="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P'}"
								disabled="true">
								<f:convertNumber pattern="#,#00.00" />
							</h:outputText>
							<p:inputText value="#{doItems.deliveredAmt}" size="10"
								rendered="#{doItems.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S'}">
								<f:convertNumber pattern="#,#00.00" />
							</p:inputText>
						</h:panelGroup>
					</p:column>
				</p:dataTable>
				<h:panelGroup styleClass="#{index+1}OrderAmountSection">
					<table style="width: 100%">
						<tr>
							<td><p:outputLabel value="Ordered Amt. (RM)" /></td>
							<td><p:inputText size="10"
									value="#{createDOBackingBean.managedBean.selectedItemAmountSection.orderedAmt}"
									disabled="true">
									<f:convertNumber pattern="#,#00.00" />
								</p:inputText></td>
							<td><p:outputLabel value="Received Amt.(RM)" /></td>
							<td><p:inputText size="10" id="recAmtText" disabled="true">
									<f:convertNumber pattern="#,#00.00" />
								</p:inputText></td>
							<td><p:outputLabel value="Delivery Qty." /></td>
							<td><p:inputText size="5" id="delQtyText">
								</p:inputText></td>
							<td><p:outputLabel value="Delivery Amt.(RM)" /></td>
							<td><p:inputText size="10" id="delAmtText">
									<f:convertNumber pattern="#,#00.00" />
								</p:inputText></td>
						</tr>
					</table>
				</h:panelGroup>
			</p:rowExpansion>
		</p:dataTable>
	</p:panel>
	<p:dialog id="addRemarmAttachmentDialog" header="Remarks"
		widgetVar="addRemarks" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="900" resizable="false">
		<table>
		<tr>
		<td> <p:outputLabel value="#{lbl['lbl.fl.delivery.address']}"/> </td>  
		<td>
			<p:inputTextarea cols="50" rows="6"
						style=" margin-bottom:5px;" disabled="true" />
		</td>
		</tr>
		</table>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Ok" icon="ui-icon-accept"
				oncomplete="addRemarks.hide();" 
				process="@this">
			</p:commandButton>
			<p:commandButton value="Close" icon="ui-icon-cancel"
				oncomplete="addRemarks.hide();" 
				process="@this">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
