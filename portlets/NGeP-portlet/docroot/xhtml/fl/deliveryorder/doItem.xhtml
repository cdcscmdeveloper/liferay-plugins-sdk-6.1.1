<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="ITEM DETAIL" toggleable="true">
		<br />
		<p:dataTable id="itemDataTable" var="item" width="100%" value="#{createDOBackingBean.managedBean.delOrderItem}">
			<ac:paginator for="itemDataTable" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="Item Name" />
					<p:column rowspan="2" headerText="Ord. Qty" />
					<p:column rowspan="2" headerText="Recv. Qty" />
					<p:column rowspan="2" headerText="Del. Qty" />
					<p:column rowspan="2" headerText="Unit Price (MYR)" />
					<p:column colspan="2" headerText="* Delivery" />
				</p:row>
				<p:row>
					<p:column headerText="Quantity" />
					<p:column headerText="Amount (MYR)" />
				</p:row>
			</p:columnGroup>
				<p:column>
			<p:outputLabel
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestNote.scRequestList.requestItems[0].itemName}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'PR'}" />
				<p:outputLabel
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.contractItem.itemName}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>		
			
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItemAddr.orderedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItemAddr.receivedQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.deliveredQty}" />
			</p:column>
			<p:column>
				<p:outputLabel value="#{item.flFulfilmentItemAddr.unitPrice}"/>
			</p:column>
			<p:column>
				<p:inputText value="#{item.deliveredQty}" />
			</p:column>
			<p:column>
				<p:inputText value="#{item.deliveredAmt}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
