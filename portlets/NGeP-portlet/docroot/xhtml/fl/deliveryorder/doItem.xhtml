<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="ITEM DETAIL" toggleable="true">
		<br />
		<p:dataTable id="itemDataTable" var="item" width="100%"
			value="#{createDOBackingBean.managedBean.flDeliveryOrder.flDelOrderItem}">
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Type">
				<h:outputText
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'PR'}" />
				<h:outputText
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.qtItem.itemName}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Item Code">
				<h:outputText
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.requestNoteItemId}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'PR'}" />
				<h:outputText
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.qtItem.itemName}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Item Name">
				<h:outputText
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemName}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'PR'}" />
				<h:outputText
					value="#{item.flFulfilmentItemAddr.flFulfilmentItem.qtItem.itemName}"
					rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}" />
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<h:outputText value="#{item.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#,###.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Qty.">
				<h:outputText value="#{item.flFulfilmentItemAddr.orderedQty}" />
			</p:column>
			<p:column headerText="Received Qty.">
				<h:outputText value="#{item.flFulfilmentItemAddr.receivedQty}" />
			</p:column>
			<p:column headerText="Delivered Qty.">
				<p:inputText value="#{item.deliveredQty}"
					rendered="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P'}">
					<p:ajax event="blur" update="delAmountTxt" process="@this"
						listener="#{createDOBackingBean.retrievedDelAmount(item)}" />
				</p:inputText>
				<p:inputText value="#{item.deliveredQty}"
					rendered="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S' and item.flFulfilmentItemAddr.orderedQty > 1}">
					<p:ajax event="blur" update="delAmountTxt" process="@this"
						listener="#{createDOBackingBean.retrievedDelAmount(item)}" />
				</p:inputText>
				<p:inputText value="#{item.deliveredQty}" disabled="true"
					rendered="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S' and item.flFulfilmentItemAddr.orderedQty == 1}" />
			</p:column>
			<p:column headerText="Ordered Amt.(RM)">
				<h:outputText value="#{item.flFulfilmentItemAddr.orderedAmt}">
					<f:convertNumber pattern="#,###.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received Amt.(RM)">
				<h:outputText value="">
					<f:convertNumber pattern="#,###.00" />
				</h:outputText>
			</p:column>
			<p:column headerText="Delivered Amt.(RM)">
				<h:panelGroup id="delAmountTxt">
					<p:inputText value="#{item.deliveredAmt}"
						rendered="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'P'}"
						disabled="true">
						<f:convertNumber pattern="#,###.00" />
					</p:inputText>
					<p:inputText value="#{item.deliveredAmt}"
						rendered="#{item.flFulfilmentItemAddr.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType eq 'S'}">
						<f:convertNumber pattern="#,###.00" />
					</p:inputText>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
