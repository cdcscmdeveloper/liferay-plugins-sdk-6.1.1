<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<p:dataTable id="doDelAddress" var="doDelAddress"
			styleClass="orderSummaryChange hide-column-names "
			rowIndexVar="index"
			selection="#{createDOBackingBean.managedBean.selectedDelAddressList}"
			rowKey="#{doDelAddress}"
			value="#{createDOBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}">
			<ac:paginator for="doDelAddress" />
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column selectionMode="multiple" rowspan="2" width="5%" />

			<p:column headerText="Delivery Address" width="10" style="white-space:normal;" 
				styleClass="fixed-size">
				<h:outputText rendered="#{doDelAddress.addressType !=null}"
					value="#{doDelAddress.addressType.pmAddress.address1}, #{doDelAddress.addressType.pmAddress.address2}, #{doDelAddress.addressType.pmAddress.address3}, #{doDelAddress.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{doDelAddress.addressType eq null}"
					value="#{doDelAddress.pmAddress.address1}, #{doDelAddress.pmAddress.address2}, #{doDelAddress.pmAddress.address3}, #{doDelAddress.pmAddress.address4}" />
			</p:column>
			<p:column style="width:2%">
				<h:outputText value="Delivery Start / End" />
				<p:spacer width="4" />
				<p:inputText size="7" disabled="true" />
				<p:spacer width="4" />
				<p:inputText size="7" disabled="true" />
			</p:column>
			<p:column>
				<h:outputText value="* Supplier DO.No." />
				<p:spacer width="4" />
				<p:inputText size="9" value="#{createDOBackingBean.managedBean.supplierDoRef}"></p:inputText>
				<p:commandLink oncomplete="addRemarks.show();"
					action="#{fulfilmentBackingBean.openAttachmentPage(doDelAddress)}"
					update=":form:addRemarmAttachmentDialog">
					<p:graphicImage library="ep/images/design" name="attach.png"
						value="/resources/ep/images/design/attach.png"
						title="Remark and Attachment" />
				</p:commandLink>
			</p:column>
			<p:rowExpansion>
				<p:dataTable id="doItems" var="doItems"
					value="#{doDelAddress.flFulfilmentItemAddr}" lazy="true"
					rowIndexVar="index" rowKey="#{flItem}"
					styleClass="itemsSelectedPanel show-column-names">
					<p:column headerText="Item Code" style="white-space:normal;" >
						<h:outputText
							value="#{doItems.scRequestItem.cmItem.extensionCode}" />
					</p:column>
					<p:column headerText="Item Name" style="white-space:normal;" >
						<h:outputText value="#{doItems.scRequestItem.itemName}"
							rendered="#{createDOBackingBean.managedBean.docType eq 'PR'}" />
						<h:outputText value="#{doItems.scRequestItem.itemName}"
							rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}" />
					</p:column>
					<p:column headerText="UOM">
						<h:outputText value="#{doItems.scRequestItem.uom.uomName}" />
					</p:column>
					<p:column headerText="Unit Price &lt;br /&gt; (RM)" style="text-align:right">
						<h:outputText disabled="true" value="#{doItems.unitPrice}" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Ordered &lt;br /&gt; Qty." style="text-align:right">
						<h:outputText value="#{doItems.orderedQty}"	>
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Remaining &lt;br /&gt; Qty." style="text-align:right">
						<h:outputText value="#{doItems.orderedQty}" >
							 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Delivery &lt;br /&gt; Qty." style="text-align:right">
						<p:inputText value="#{doItems.deliveredQty}" size="5" styleClass="colFloatRight"
							rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeProduct and createDOBackingBean.managedBean.docType eq 'PR' }">
							<p:ajax event="blur" update="delAmountTxt" process="@this"
								listener="#{createDOBackingBean.retrieveDelAmount(doItems)}" />
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />	
						</p:inputText>   
						<h:outputText value="#{doItems.deliveredAmt}" size="5" rendered="#{createDOBackingBean.managedBean.docProcess eq 'DO'}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
						<p:inputText value="#{doItems.deliveredQty}" size="5" styleClass="colFloatRight"
							rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeService and doItems.orderedQty > 1 and createDOBackingBean.managedBean.docType eq 'PR' }">
							<p:ajax event="blur" update="delAmountTxt" process="@this" listener="#{createDOBackingBean.retrieveDelAmount(doItems)}" />
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</p:inputText>
						<p:inputText value="#{doItems.deliveredQty}" disabled="true" styleClass="colFloatRight"
							rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeService and doItems.orderedQty == 1 and createDOBackingBean.managedBean.docType eq 'PR' }" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</p:inputText>
						<p:inputText value="#{doItems.deliveredQty}" size="5"  styleClass="colFloatRight" rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}">
							<p:ajax event="blur" update="delAmountTxt" process="@this" listener="#{createDOBackingBean.retrieveDelAmount(doItems)}" />
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />	
						</p:inputText>
					</p:column>
					<p:column headerText="Delivery &lt;br /&gt; Amt.(RM)" style="text-align:right">
						<h:panelGroup id="delAmountTxt">
							<h:outputText value="#{doItems.deliveredAmt}" disabled="true"
								rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeProduct}">
								<f:convertNumber pattern="#,#00.00" />
							</h:outputText>
							<p:inputText value="#{doItems.deliveredAmt}" size="5"
								rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeService}">
								<f:convertNumber pattern="#,#00.00" />
							</p:inputText>
							<h:outputText value="#{doItems.deliveredAmt}" size="5"
								rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}">
								<f:convertNumber pattern="#,#00.00" />
							</h:outputText>

						</h:panelGroup>
					</p:column>
					<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
						<h:outputText value="#{doItems.orderedAmt}" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
						<h:outputText value="#{doItems.receivedQty}" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>						
					</p:column>
					<p:column headerText="Rejected &lt;br /&gt; Qty." style="text-align:right">
						<h:outputText value="#{doItems.receivedQty}" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>						
					</p:column>
				</p:dataTable>

			</p:rowExpansion>

		</p:dataTable>
	</p:panel>
	<p:dialog id="addRemarmAttachmentDialog" header="Remarks"
		widgetVar="addRemarks" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="900" resizable="false">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.address']}" />
				</td>
				<td><p:inputTextarea cols="50" rows="6"
						style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
		</table>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<ui:param name="deliverAddress" value="#{doDelAddress}"></ui:param>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Ok" icon="ui-icon-accept"
				oncomplete="addRemarks.hide();" process="@this">
			</p:commandButton>
			<p:commandButton value="Close" icon="ui-icon-cancel"
				oncomplete="addRemarks.hide();" process="@this">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
