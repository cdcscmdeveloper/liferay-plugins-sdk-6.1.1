<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.delivery.address']}"  toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.del.address']}" escape="false"/>
		<p:dataTable id="doDelAddress" var="doDelAddress"
			styleClass="orderSummaryChange hide-column-names "
			rowIndexVar="index" rowKey="#{doDelAddress}"
			value="#{createDOBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}">
			<ac:paginator for="doDelAddress" />
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column rowspan="2" width="5%">
				<p:selectBooleanCheckbox
					value="#{doDelAddress.flTempDoAddr.selected}" />
			</p:column>
			<p:column headerText="Delivery Address" width="10"
				style="white-space:normal;" styleClass="fixed-size">
				<h:outputText
					value="#{createDOBackingBean.getFullAddress(doDelAddress.pmAddress)}" />
			</p:column>
			<p:column style="width:2%">
				<h:outputText value="#{lbl['lbl.fl.do.delivery.service.start.end.date']}" />
				<p:spacer width="4" />
				<p:inputText size="9" disabled="true"
					value="#{doDelAddress.startDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<p:spacer width="4" />
				<p:inputText size="9" disabled="true"
					value="#{doDelAddress.endDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.fl.do.supp.do.no']}" />
				<p:spacer width="4" />
				<p:inputText size="9" maxlength="30"
					value="#{doDelAddress.flTempDoAddr.supplierDoRef}"></p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.del.order.no']}"/>
				<p:commandLink oncomplete="addRemarks.show();"
					action="#{fulfilmentBackingBean.openAttachmentPage(doDelAddress)}"
					update=":form:addRemarmAttachmentDialog">
					<f:setPropertyActionListener
						target="#{createDOBackingBean.managedBean.selectedDelAddr}"
						value="#{doDelAddress}" />
					<p:graphicImage library="ep/images/design" name="attach.png"
						value="/resources/ep/images/design/attach.png"
						title="Remark and Attachment" />
				</p:commandLink>

				<p:spacer width="10" />
			</p:column>
			<p:rowExpansion>
				<p:dataTable id="doItems" var="doItems"
					value="#{doDelAddress.flFulfilmentItemAddr}" rowIndexVar="index"
					rowKey="#{flItem}"
					styleClass="itemsSelectedPanel show-column-names">
					<p:column headerText="#{lbl['lbl.fl.item.name']}"   style="white-space:normal;">
						<h:outputText value="#{doItems.scRequestItem.itemName}"
							rendered="#{createDOBackingBean.managedBean.docType eq 'PR'}" />
						<h:outputText value="#{doItems.scRequestItem.itemName}"
							rendered="#{createDOBackingBean.managedBean.docType eq 'CR'}" />
					</p:column>
					<p:column style="white-space:normal;">
						<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.uom']}"/>
    				</f:facet>
						<h:outputText value="#{doItems.scRequestItem.uom.uomName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:right;">
						<h:outputText disabled="true" value="#{doItems.unitPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column style="white-space:normal;text-align:right;"> 
						<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.ordered.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.order.qty']}"/>
    				</f:facet>
						<h:outputText value="#{doItems.orderedQty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column  style="white-space:normal;text-align:right;">
						<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.do.remaining.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.remain.qty']}"/>
    				</f:facet>
						<h:outputText id="remaingQtyTxt"
							value="#{doItems.orderedQty - doItems.sumDeliveredQty - doItems.deliveredQty + doItems.rejectedQty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column style="white-space:normal;text-align:right;">
						<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.do.delivery.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.del.qty']}"/>
    				</f:facet>
						<h:panelGroup id="delQtyTxt">
							<p:inputText value="#{doItems.deliveredQty}" size="5" styleClass="colFloatRight" maxlength="14"	disabled="#{doItems.delQtyDisabled}"
								rendered="#{createDOBackingBean.managedBean.docProcess ne 'DO'}">
								<p:ajax event="blur" update="delQtyTxt,delAmountTxt,remaingQtyTxt" process="@this"
									listener="#{createDOBackingBean.retrieveDelAmount(doItems)}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
							</p:inputText>
							<h:outputText value="#{doItems.deliveredQty}" size="5"
								rendered="#{createDOBackingBean.managedBean.docProcess eq 'DO'}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
							</h:outputText>
						</h:panelGroup>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.delivery.amount']}" style="white-space:normal;text-align:right;">
						<h:panelGroup id="delAmountTxt">
							<h:outputText value="#{doItems.deliveredAmt}" disabled="true"
								rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeProduct}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</h:outputText>
							<p:inputText value="#{doItems.deliveredAmt}" size="5"
								disabled="#{doItems.delQtyDisabled}"
								maxlength="15" styleClass="colFloatRight"
								rendered="#{doItems.itemType.parameterCode eq ParameterConst.itemTypeService}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
						</h:panelGroup>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="white-space:normal;text-align:right;">
						<h:outputText value="#{doItems.orderedAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column style="white-space:normal;text-align:right;">
						<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.received.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
						<h:outputText value="#{doItems.chargeReceivedQty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}"
						style="white-space:normal;text-align:right;">
						<h:outputText value="#{doItems.chargeReceivedAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column style="white-space:normal;text-align:right;">
						<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.do.rejected.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.rejected.qty']}"/>
    				</f:facet>
						<h:outputText value="#{doItems.rejectedQty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, doItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
						<p:commandLink oncomplete="rejectionDialog.show();"
							rendered="#{doItems.rejectedQty > 0}"
							action="#{createDOBackingBean.retrieveRejectionData(doItems)}"
							update=":form:rejectionDialog">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedItemRow}"
								value="#{doItems}" />
							<p:graphicImage library="ep/images/design" name="document.png"
								value="/resources/ep/images/design/document.png" />
						</p:commandLink>
					</p:column>
				</p:dataTable>

			</p:rowExpansion>

		</p:dataTable>
	</p:panel>
	<p:dialog id="addRemarmAttachmentDialog" header="#{lbl['lbl.txt.remarks']}"
		widgetVar="addRemarks" showEffect="fade" hideEffect="fade"
		modal="true" width="900" resizable="false">
		<table>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.delivery.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="3"
						style=" margin-bottom:5px;" disabled="true"
						value="#{createDOBackingBean.getFullAddress(createDOBackingBean.managedBean.selectedDelAddr.pmAddress)}" />
				</td>
			</tr>
		</table>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<ui:param name="deliverAddress" value="#{doDelAddress}"></ui:param>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-accept"
				oncomplete="addRemarks.hide();" process="@this">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.close']}" icon="ui-icon-cancel"
				oncomplete="addRemarks.hide();" process="@this">
			</p:commandButton>
		</div>
	</p:dialog>

	<p:dialog id="rejectionDialog" header="#{lbl['lbl.fl.do.rejection.history']}" 
		widgetVar="rejectionDialog" showEffect="fade" hideEffect="fade"
		modal="true" width="800" resizable="false">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.code']}" /></td>
				<td><p:inputText disabled="true"
						value="#{createDOBackingBean.managedBean.selectedItemRow.scRequestItem.cmItem.extensionCode}" />
				</td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
				<td width="10"></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.name']}" /></td>
				<td><p:inputText disabled="true" style="width: 400px;"
						value="#{createDOBackingBean.managedBean.selectedItemRow.scRequestItem.itemName}" />
				</td>
			</tr>
		</table>
		<p:dataTable id="rejectionHistoryDt" var="frnItem" rowIndexVar="index"
			rowKey="#{frnItem}"
			value="#{createDOBackingBean.managedBean.rejectionList}">
			<ac:paginator for="rejectionHistoryDt" />
			<p:column>
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.do.relected.delivery.ord.no']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.rejected.del.ord.no']}"/>
    				</f:facet>
				<h:outputText
					value="#{frnItem.flDelOrderItem.flDeliveryOrder.deliveryOrderNo}" />
			</p:column>
			<p:column value="#{lbl['lbl.txt.remarks']}"  style="white-space:normal;">
				<h:outputText value="#{frnItem.rejectionRemark}" />
			</p:column>
			<p:column >
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.do.rejected.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.rejected.qty']}"/>
    				</f:facet>
				<h:outputText value="#{frnItem.rejectedQty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, frnItem.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount']}"  style="text-align:right;">
				<h:outputText value="#{frnItem.rejectedAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.close']}" icon="ui-icon-cancel"
				oncomplete="rejectionDialog.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
