<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<table>
			<tr>
				<td><p:outputLabel value="1GFMAS Error: " rendered="#{stopInstrBB.managedBean.gfmasError}"/> </td>
				<td><p:commandLink oncomplete="gfmasError.show();"
					action="#{stopInstrBB.show1GFMASError()}"
					rendered="#{stopInstrBB.managedBean.gfmasError}">
						<p:graphicImage value="/css/images/design/exclamation.png" />
					</p:commandLink>
				</td>
			</tr>
		</table>	
		<ac:gpkiPopup 
			textBeforeSign="#{stopInstrBB.managedBean.textBeforeSign}"
			postSignAction="#{stopInstrBB.preSubmitStopInstruction(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{stopInstrBB.enableAutoUpdate()}" />
		<f:event listener="#{stopInstrBB.preRenderView}" type="preRenderView" />
		<ac:spkiPopup id="spkiPopUp"
			password="#{stopInstrBB.managedBean.spkiBackingBean.password}"
   		 	challengeAns1="#{stopInstrBB.managedBean.spkiBackingBean.challengeAns1}"
  		 	challengeQues1="#{stopInstrBB.managedBean.spkiBackingBean.challengeQues1}"
			textBeforeSign="#{stopInstrBB.managedBean.textBeforeSign}"
			postSignAction="#{stopInstrBB.preSubmitStopInstruction(spkiBackingBean.pmDigiSign)}"/>
		<p:messages id="messages" showDetail="true" autoUpdate="#{stopInstrBB.managedBean.autoUpdate}" showSummary="false" closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"  
						action="#{stopInstrBB.backToPervious}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						rendered="#{stopInstrBB.managedBean.taskId==null}" />
				</td>
				<td colspan="4" style="text-align: right">
					<ui:repeat var="bpmAction" value="#{stopInstrBB.managedBean.outComes}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{stopInstrBB.signingAction(bpmAction)}"  update="@form"  />
					</ui:repeat> 
					<c:if test='#{stopInstrBB.managedBean.stopInstr.brandNew}'>
						<p:commandButton value="#{lbl['lbl.btn.stop.fulfilment']}" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{stopInstrBB.signingAction('STOP FULFILMENT')}"  update="@form">
						</p:commandButton>
					</c:if>
					<c:if
						test='#{stopInstrBB.managedBean.buttonVal eq "View" and !stopInstrBB.managedBean.isHyperLinkPage()}'>
						<td colspan="4" style="text-align: right"><p:commandLink
								value="#{lbl['lbl.td.doc.trackingDiary']}"
								action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeStopDelivery,stopInstrBB.managedBean.stopInstr.stopInstrId)}"
								immediate="true" />
						</td>
					</c:if>
					<h:panelGroup id="printButtonSi"
						rendered="#{(stopInstrBB.managedBean.stopInstr.pmStatus.statusId != FulfilmentStatusCont.sdPendingSubmission) and 
						     (stopInstrBB.managedBean.stopInstr.pmStatus.statusId != FulfilmentStatusCont.sdPendingApproval)}">
						<td style="text-align: right; width: 30px;"><p:commandLink
								value="#{lbl['lbl.btn.print']}" ajax="false">
								<p:fileDownload
									value="#{flDocumentBackingBean.generateReport(ParameterConst.doctypeStopDelivery,stopInstrBB.managedBean.stopInstr.stopInstrNo,flDocumentManagedBean.taxable)}" />
							</p:commandLink></td>
					</h:panelGroup>
				</td>
			</tr>
		</table>
		<ui:include src="siHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu"
						activeIndex="#{stopInstrBB.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener target="#{stopInstrBB.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.summary']}" update="@form" actionListener="#{stopInstrBB.onTabChange(1)}">
							<f:setPropertyActionListener target="#{stopInstrBB.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>
					</p:tabMenu>
				</td>
				<td width="80%">
					<p:outputPanel rendered="#{stopInstrBB.managedBean.selectedTabIndex == 0}">
						<ui:include src="siGeneral.xhtml" />
					</p:outputPanel> 
					<p:outputPanel rendered="#{stopInstrBB.managedBean.selectedTabIndex == 1}">
						<ui:include src="siItem.xhtml" />
					</p:outputPanel>
				</td>
			</tr>
		</table>
		<p:dialog id="gfmasErrorDlg" header="1GFMAS Error" widgetVar="gfmasError"
		showEffect="fade" hideEffect="fade" modal="true" 
		resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:messages id="gfmasMsg" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" /></td>
			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Close" oncomplete="gfmasError.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	</ui:define>
</ui:composition>
