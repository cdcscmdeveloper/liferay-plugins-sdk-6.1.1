<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include src="/xhtml/fl/shared/sidemenu/flSiSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right"><p:commandButton value="SAVE" />
					<p:commandButton value="STOP" /> <p:commandButton value="PRINT" /></td>
			</tr>
		</table>
		<p:panel header="ITEM DETAILS" toggleable="false">

			<br />
			<p:dataTable id="dataTable" var="item" value="" paginator="true"
				rows="10"
				paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
				rowsPerPageTemplate="5,10,15" paginatorPosition="bottom">
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" headerText="Product Code" />
						<p:column rowspan="2" headerText="Item Name" />
						<p:column rowspan="2" headerText="GOSODO" />
						<p:column rowspan="2" headerText="Activity Code" />
						<p:column rowspan="2" headerText="Unit Price (MYR)" />
						<p:column colspan="4" headerText="Quantity" />
						<p:column colspan="2" headerText="Amount (MYR)" />
					</p:row>
					<p:row>
						<p:column headerText="Ord." />
						<p:column headerText="Recv." />
						<p:column headerText="Del." />
						<p:column headerText="Recall." />
						<p:column headerText="Ordered" />
						<p:column headerText="Delivered" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
				<p:column>
					<p:outputLabel />
				</p:column>
			</p:dataTable>

			<br />
			<br />
			<table>
				<tr>
					<td><p:outputLabel value="Product Code" /></td>
					<td><p:inputText style="width: 140px;" value="200003"
							disabled="true" /></td>
					<td><p:outputLabel value="Ordered Qty" /></td>
					<td><p:inputText style="width: 140px;" value="200"
							disabled="true" /></td>
					<td><p:outputLabel value="Unit Price (MYR)" /></td>
					<td><p:inputText style="width: 140px;" value="0.50"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Item Name" /></td>
					<td><p:inputText style="width: 140px;" value="Blue Pen"
							disabled="true" /></td>
					<td><p:outputLabel value="Received Qty." /></td>
					<td><p:inputText style="width: 140px;" value="100"
							disabled="true" /></td>
					<td><p:outputLabel value="Ordered Amt. (MYR)" /></td>
					<td><p:inputText style="width: 140px;" value="100.00"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="GOSODO" /></td>
					<td><p:inputText style="width: 140px;" value="GOSODO001"
							disabled="true" /></td>
					<td><p:outputLabel value="Delivery Qty." /></td>
					<td><p:inputText style="width: 140px;" value="50"
							disabled="true" /></td>
					<td><p:outputLabel value="Delivered Amt. (MYR)" /></td>
					<td><p:inputText style="width: 140px;" value="100.00"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Activity Code" /></td>
					<td><p:inputText style="width: 140px;" value="ACTIVITY1"
							disabled="true" /></td>
					<td><p:outputLabel value="Recalled Qty" /></td>
					<td><p:inputText style="width: 140px;" value="50"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Stop Instr. Reason" /></td>
					<td><p:selectOneMenu value="" style="width: 140px;">
							<f:selectItem
								itemLabel="Unable to Deliver due to unforeseen circumstances"
								itemValue="2" />
							<f:selectItem itemLabel="Shortage of Stock" itemValue="1" />
							<f:selectItem
								itemLabel="Product are no longer required due to specific reasons"
								itemValue="3" />
						</p:selectOneMenu></td>
				</tr>
			</table>
			<table style="width: 800px;">
				<tr>
					<td colspan="4" align="right"><p:commandButton type="button"
							icon="ui-icon-circle-triangle-w" /> <p:commandButton
							type="button" icon="ui-icon-circle-triangle-e" /></td>
				</tr>
			</table>

		</p:panel>

	</ui:define>
</ui:composition>
