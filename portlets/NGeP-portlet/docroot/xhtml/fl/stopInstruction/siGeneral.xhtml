<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td>
					<p:inputText size="54" id="ministry" disabled="true" 
						value="#{stopInstrBB.retrieveMinistryByOrgProfileId(stopInstrBB.managedBean.stopInstr.flRequest.issuedOrgProfile.orgProfileId)}"/>
				</td>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel value="#{lbl['lbl.fl.do.title']}" /></td>
				<td rowspan="3">
					<p:inputTextarea cols="50" rows="4" id="title" disabled="true" style=" margin-bottom:5px;" autoResize="false"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.title}" /> 
					<h:outputText value="" />
				</td>						
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td><p:inputText size="54" id="controlOff"
						value="#{stopInstrBB.retrievePegawaiPengawalByOrgProfileId(stopInstrBB.managedBean.stopInstr.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="54" id="ptjGroup"
						value="#{stopInstrBB.retrieveJabatanByOrgProfileId(stopInstrBB.managedBean.stopInstr.flRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td width="390px"><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:379px;"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.preparedOrgProfile.orgCode} #{stopInstrBB.managedBean.stopInstr.flRequest.preparedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"/>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="30" disabled="true"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : stopInstrBB.getParameterDesc(stopInstrBB.managedBean.stopInstr.flRequest.procurementTypeCategory)}" /></td>				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputTextarea rows="2" readonly="true" autoResize="false" style="resize:none;width:379px;"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.issuedOrgProfile.pmOrgValidity.orgCode} #{stopInstrBB.managedBean.stopInstr.flRequest.issuedOrgProfile.orgName}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.do.requisitioner']}" /></td>
				<td><p:inputText size="54" disabled="true"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.requistioner.userName}" />
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td><p:inputText size="15" disabled="true"
									value="#{stopInstrBB.managedBean.stopInstr.flRequest.smSupplier.regNo}" />
									<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}"/></td>
							<td><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.mofNo}" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}"/></td>
						</tr>
					</table>
				</td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width:235px;"><p:inputText size="15" disabled="true" 
									value="#{stopInstrBB.managedBean.stopInstr.flRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : stopInstrBB.managedBean.stopInstr.flRequest.smSupplier.epNo}"></p:inputText></td>		
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{stopInstrBB.managedBean.stopInstr.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : stopInstrBB.managedBean.stopInstr.gstRegNo}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{stopInstrBB.managedBean.stopInstr.gstDeclaredDate ==null ? lbl['lbl.fl.supp.na'] : stopInstrBB.managedBean.stopInstr.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{stopInstrBB.managedBean.stopInstr.gstEffectiveDate ==null ? lbl['lbl.fl.supp.na'] : stopInstrBB.managedBean.stopInstr.gstEffectiveDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="55"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.supplierName}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="55"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.branchName}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.branch']}"/>
				</td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel	value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true" autoResize="false"
						style=" margin-bottom:5px;"
						value="#{stopInstrBB.getFullAddress(stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.smAddress)}" />
				</td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="16"
									disabled="true"
									value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="53"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{stopInstrBB.managedBean.stopInstr.flRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	
	<h:panelGroup>
		<p:panel toggleable="true" id="stopInstructionPnl" >
	        <f:facet name="header">
				<h:outputText id="stopInstructionPnlHeader" value="#{lbl['lbl.fl.stop.instuc.reason']}" />
		        <ac:iconTooltip value="#{lbl['lbl.fl.tooltip.stop.instr']}"/>
		  	</f:facet>			
			<table style="width: 100%">
				<tr>
					<td style="width: 138px;">
						<p:outputLabel
						value="#{lbl['lbl.fl.stop.instuc.reason.justification']}" />
						<p:outputLabel value="*" styleClass="mandatory"/>
					</td>
					<td style="width: 295px;">
						<p:selectOneMenu id="reasonId" required="true" label="#{lbl['lbl.fl.stop.instuc.reason.justification']}" 
							style="width:365px;margin-bottom: 5px;" 
							disabled="#{stopInstrBB.managedBean.buttonVal=='View' or stopInstrBB.managedBean.taskName eq 'Review SD'}"
							value="#{stopInstrBB.managedBean.stopInstr.pmReason.reasonCode}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
							<f:selectItems value="#{stopInstrBB.populateReasonList}" var="reason"
								itemLabel="#{reason.reasonDesc}"
								itemValue="#{reason.pmReason.reasonCode}"/>
							<p:ajax event="change" update="otherId"/>
						</p:selectOneMenu> 
					</td>
					<td><p:message for="reasonId" display="icon" /></td>
					<td style="width: 138px;"><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
					<td>
						<p:inputText value="#{stopInstrBB.managedBean.stopInstr.createdDate}" disabled="true">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText> 
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
						value="#{lbl['lbl.fl.stop.instuc.others']}" />
					</td>
					<td>
						<p:inputText size="53" maxlength="255" value="#{stopInstrBB.managedBean.stopInstr.reasonDesc}" id="otherId" 
							disabled="#{stopInstrBB.managedBean.stopInstr.pmReason.reasonCode ne 'OTHERS'}" />
					</td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>
	
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
