<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="ITEM" toggleable="true" styleClass="siInvItemPnlClass">
		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="invItemChange" value="#{stopInstrBB.managedBean.chargeLineItemRoot}">
			<p:ajax event="expand" 
                onstart="blockTreeTable.show();" oncomplete="blockTreeTable.hide();" />  			
			<p:column headerText="Item Code" style="white-space:normal; width:130px;">
				<h:outputText
					value="#{chargeLineNode.flFulfilmentItemAddr.scRequestItem.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;" >
				<h:outputText value="#{chargeLineNode.flFulfilmentItemAddr.scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="UOM">
				<h:outputText value="#{chargeLineNode.flFulfilmentItemAddr.scRequestItem.uom.uomName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Unit &lt;br /&gt; Price (RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.unitPrice}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumOrderedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumReceivedQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Recalled &lt;br /&gt; Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumRecalledQty}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.flFulfilmentItem.flFulfilmentItemAddr[0].scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="Ordered &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumOrderedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumOrderedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Received &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumReceivedAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumReceivedAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Recalled &lt;br /&gt; Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumRecalledAmt}" rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.flFulfilmentItem.sumRecalledAmt}" rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:treeTable>
		<p:blockUI widgetVar="blockTreeTable" block="chargeLineTbl">  
			<p:graphicImage value="/resources/ep/images/ajax-loader.gif"></p:graphicImage>  
		</p:blockUI> 		
	</p:panel>
</ui:composition>
