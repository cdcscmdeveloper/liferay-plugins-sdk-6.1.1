<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.delivery.address']}" toggleable="true">
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange"
			value="#{stopInstrBB.managedBean.stopInstr.flRequest.flDeliveryAddresses}">
			<ac:paginator for="delAddressSummary" />
			<p:ajax event="rowToggle" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;width:350px;">
				<h:outputText value="#{stopInstrBB.getFullAddress(delAddressSummary.flAddress)}" />
			</p:column>
			<p:rowExpansion>
				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}">
					<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;width:20%" >
						<h:outputText value="#{newItems.scRequestItem.itemName}" id="itemDesc" style="float:left;text-align:left;" title="#{newItems.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : newItems.scRequestItem.itemDesc}"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.uom']}" style="text-align:center">
						<h:outputText value="#{newItems.scRequestItem.uom.uomName}" style="float:left;"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:center;white-space:normal">
						<h:outputText value="#{newItems.unitPrice}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="text-align:center;white-space:normal">
						<h:outputText value="#{newItems.gstUnitPrice}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:center">
						<h:outputText value="#{newItems.orderedQty}" style="float:right;">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.received.qty']}" style="text-align:center">
						<h:outputText value="#{newItems.flFulfilmentItem.sumReceivedQty}" style="float:right;">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.received.amount']}" style="text-align:center">
						<h:outputText value="#{newItems.flFulfilmentItem.sumReceivedAmt}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:center">
						<h:outputText value="#{newItems.orderedAmt}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
		
	</p:panel>
</ui:composition>
