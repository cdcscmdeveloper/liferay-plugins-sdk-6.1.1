<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.menu.order.summary']}" toggleable="true">
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange hide-column-names"
			value="#{contractRequestBackingBean.managedBean.flRequest.flDeliveryAddresses}">
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;">
				<h:outputText rendered="#{delAddressSummary.addressType != null}"
					value="#{delAddressSummary.addressType.pmAddress.address1}, #{delAddressSummary.addressType.pmAddress.address2}, #{delAddressSummary.addressType.pmAddress.address3}" />
				<h:outputText rendered="#{delAddressSummary.addressType eq null}"
					value="#{delAddressSummary.pmAddress.address1}, #{delAddressSummary.pmAddress.address2}, #{delAddressSummary.pmAddress.address3}" />
			</p:column>
			<p:column>
				<h:outputText value="#{lbl['lbl.fl.delivery.period']}" />
				<p:spacer width="10" />
				<p:inputText size="3" disabled="true" value="#{delAddressSummary.deliveryTerm}" style="width:50px; text-align:right;"/>
				<p:spacer width="5" />
				<h:inputText size="4" style="width:50px" disabled="true"  value="#{contractRequestBackingBean.getParameterDesc(delAddressSummary.pmUom)}"/>
			</p:column>
			<p:column>
				<h:outputText value="#{lbl['lbl.fl.delivery.start']}" />
				<p:spacer width="7" />
				<p:inputText size="8" value="#{delAddressSummary.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<h:outputText value="#{lbl['lbl.fl.delivery.end']}" />
				<p:spacer width="10" />
				<p:inputText size="8" value="#{delAddressSummary.endDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:rowExpansion>

				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}">
					<p:column>
						<f:facet name="header" style="width:8%;">
							<h:outputText value="#{lbl['lbl.fl.item.code']}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}" />
						</f:facet>
						<h:outputText value="#{newItems.cmItem.extensionCode}"/> 
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;">
						<h:outputText value="#{newItems.scRequestItem.itemName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.uom']}">
						<h:outputText value="#{newItems.scRequestItem.uom.uomName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:right">
						<h:outputText value="#{newItems.unitPrice}"
							styleClass="colFloatRight" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:right">
						<h:outputText value="#{newItems.orderedQty}" styleClass="colFloatRight" >
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:right">
						<h:outputText value="#{newItems.orderedAmt}" styleClass="colFloatRight" >
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
	</p:panel>
</ui:composition>
