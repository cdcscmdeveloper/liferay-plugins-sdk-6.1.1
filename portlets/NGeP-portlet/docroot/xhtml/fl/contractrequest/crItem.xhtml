<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="delAddrPanel" header="#{lbl['lbl.fl.delivery.address']}"
		toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.add.address']}" escape="false"/>
		<p:dataTable id="addressDataTable" var="address"
			value="#{contractRequestBackingBean.managedBean.flRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{contractRequestBackingBean.managedBean.selectedDelAddr}"
			selectionMode="single" 
			rowKey="#{address}">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelect"
				update=":form:itemDetPanelGroup,:form:deleteAddrBtn" />
			<p:column>
				<p:selectBooleanCheckbox value="#{address.selectedAddressRowDelete}"
					styleClass="myCustomChekBox">
					<p:ajax event="change"
						update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
						listener="#{contractRequestBackingBean.selectOneCheckboxSelect}"></p:ajax>
				</p:selectBooleanCheckbox>
			</p:column>	
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;">
				<p:commandLink oncomplete="addManualDeliveryAddr.show();"
					action="#{contractRequestBackingBean.editManualAddress(address)}"
					update=":form:addManualDelAddrDialog,@(.orderSummaryChange)"
					style="padding-right:5px" rendered="#{address.receivingGrp!=null}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
				<h:outputText rendered="#{address.addressType != null}"
					value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{address.addressType eq null}"
					value="#{address.pmAddress.address1}, #{address.pmAddress.address2}, #{address.pmAddress.address3}, #{address.pmAddress.address4}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.period']}" style="text-align:right">
				<h:outputText
					value="#{address.deliveryTerm} #{contractRequestBackingBean.getParameterDesc(address.pmUom)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.delivery.start']}">
				<p:calendar value="#{address.startDate}" id="calStartDate"  disabled="#{!contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
						listener="#{contractRequestBackingBean.updateDeliveryAddrDate}"
						update="calEndDate" />
				</p:calendar>
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.delivery.end']}">
				<p:calendar value="#{address.endDate}" id="calEndDate" disabled="#{!contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
					mindate="#{address.startDate}" 
					maxdate="#{contractRequestBackingBean.managedBean.maxDate}"
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</p:column>
			<p:column>
				<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.receiving.officer']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.recv.officer']}"/>
				</f:facet>
				<p:commandLink oncomplete="addOfficer.show();"
					action="#{contractRequestBackingBean.receivingOfficerList(address)}"
					update=":form:addReceivingOfficerDialog">
					<p:graphicImage library="ep/images/design" name="register.png"
						value="/resources/ep/images/design/register.png"
						title="Recv Officer List" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.btn.ptj.address']}" icon="ui-icon-add"
				action="#{contractRequestBackingBean.flDeliveryAddrList}"
				update="delAddr,@(.orderSummaryChange) " process="@this,delAddr"
				title="#{lbl['lbl.fl.tooltip.ptj.address']}"
				oncomplete="addDeliveryAddr.show();" />
			<p:commandButton value="#{lbl['lbl.fl.btn.other.address']}" icon="ui-icon-add"
				action="#{contractRequestBackingBean.flManualDeliveryAddr}"
				update="addManualDelAddrPnl,delAddr,@(.orderSummaryChange) " process="@this,delAddr"
				title="#{lbl['lbl.fl.tooltip.other.address']}"
				oncomplete="addManualDeliveryAddr.show();" >
				<f:setPropertyActionListener
					target="#{contractRequestBackingBean.managedBean.required}"
					value="true" />
					</p:commandButton>
			<p:commandButton id="deleteAddrBtn" value="#{lbl['lbl.fl.btn.delete']}"
				icon="ui-icon-delete" onsuccess="delAddrDlg.show()" process="@this"
				update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
				title="#{lbl['lbl.fl.tooltip.delete']}"
				disabled="#{contractRequestBackingBean.managedBean.deleteButtonHide}">
			</p:commandButton>

		</div>
		<p:confirmDialog message="Are you sure you want to delete this record?"
			severity="alert" widgetVar="delAddrDlg" closable="true"
			appendToBody="true" header="Delete Confirmation">
			<h:panelGrid columns="2">
				<p:commandButton value="Yes" icon="ui-icon-accept"
					partialSubmit="true"
					action="#{contractRequestBackingBean.removeAddRow()}"
					update=":form:deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					oncomplete="delAddrDlg.hide();" />
				<p:commandButton value="No" icon="ui-icon-reject"
					onclick="delAddrDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
		<p:spacer height="20" />
		<h:panelGroup id="itemDetPanelGroup">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.item.list']}" escape="false" rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}" />
			<p:dataTable id="itemDataTable" var="item"
				rowIndexVar="index" rowKey="#{item}"
				value="#{contractRequestBackingBean.managedBean.selectedDelAddr.flFulfilmentItemAddr}"
				selection="#{contractRequestBackingBean.managedBean.selectedItemsRows}"
				rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}">
				<ac:paginator for="itemDataTable" />
				<p:column selectionMode="multiple" width="5%" />
				<p:column headerText="#{lbl['lbl.fl.item.name']}">
					<h:outputText value="#{item.scRequestItem.itemName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:right">
					<p:inputText value="#{item.unitPrice}" disabled="true"
						style="text-align:right"></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:right">
					<p:inputText value="#{item.orderedQty}" style="text-align:right"
						required="true" requiredMessage="Please input the quantity.">
						<p:ajax update="subTotalTxt"
							process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							listener="#{contractRequestBackingBean.retrieveOrderAmount(item)}"></p:ajax>
							<p:commandLink oncomplete="reqItemInfo.show();"
					action="#{contractRequestBackingBean.reqItemInfoList(item)}"
					update=":form:reqItemInfoDialog,@(.orderSummaryChange)">
					<p:graphicImage library="ep/images/design" name="tooltips.png"
						value="/resources/ep/images/design/tooltips.png"
						title="Request Item Information" />
					</p:commandLink>
					</p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:right">
					<p:inputText id="subTotalTxt" style="text-align:right"
						value="#{item.orderedAmt}" disabled="true">
						<f:convertNumber pattern="#,#00.00" />
					</p:inputText>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px"></p:spacer>
			<div style="width: 100%; text-align: right">
				<p:commandButton id="addItems" value="#{lbl['lbl.btn.add']}" icon="ui-icon-add"
					action="#{contractRequestBackingBean.addContractedItems}"
					rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}"
					update="contractedItemDt" process="@this,contractedItemDt"
					oncomplete="addItems.show();" />
				<p:commandButton value="#{lbl['lbl.fl.btn.delete']}" icon="ui-icon-delete"
					rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}"
					action="#{contractRequestBackingBean.removeItemRow}"
					update="itemDataTable" partialSubmit="true" />
			</div>
		</h:panelGroup>
	</p:panel>

	<p:dialog id="addDelAddrDialog" header="Add Delivery Address"
		widgetVar="addDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true" width="600" resizable="false">
		<p:dataTable id="delAddr" var="delAddr"
			value="#{contractRequestBackingBean.managedBean.addressTypesList}"
			rowKey="#{delAddr}"
			selection="#{contractRequestBackingBean.managedBean.selectedAddrTypeList}">
			<ac:paginator for="delAddr" />
			<p:column selectionMode="multiple" style="width:2%;text-align:center" />
			<p:column headerText="#{lbl['lbl.fl.supp.address']}" style="white-space:normal;">
				<h:outputText
					value="#{contractRequestBackingBean.getFullAddress(delAddr.pmAddress)}"
					escape="false" />
			</p:column>
			
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" icon="ui-icon-add"
				action="#{contractRequestBackingBean.updateDeliveryAddrDt}"
				oncomplete="addDeliveryAddr.hide();" update="addressDataTable,itemDetPanelGroup">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="addContractedItemDialog" header="#{lbl['lbl.fl.item.list']}" 
		widgetVar="addItems" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="contractedItemDt" var="contractedItem"
			value="#{contractRequestBackingBean.managedBean.contractedItemList}"
			rowKey="#{contractedItem.contractItemId}"
			selection="#{contractRequestBackingBean.managedBean.selectedContractedItemList}">
			<p:ajax event="rowSelect" update=":form:addContractedItemDialog"
				process="@this" />
			<ac:paginator for="contractedItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="#{lbl['lbl.fl.item.name']}"></p:column>
					<p:column rowspan="1" headerText="#{lbl['lbl.fl.item.type']}"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText
					value="#{contractedItem.scRequestItem.itemName}" />
			</p:column>
			<p:column>
				<h:outputText
					value="#{contractRequestBackingBean.getParameterDesc(contractedItem.itemType)}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton  value="#{lbl['lbl.btn.add']}"
				action="#{contractRequestBackingBean.updateContractedItemDt}"
				oncomplete="addItems.hide();" update="itemDataTable"
				process="@this,contractedItemDt">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="addManualDelAddrDialog" header="#{lbl['lbl.fl.delivery.address']}"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		visible="#{facesContext.validationFailed}" modal="true" width="900px"
		 resizable="false">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}" escape="false"/>
		<p:ajax event="close"
			listener="#{contractRequestBackingBean.closeListener}"
			update="addManualDelAddrDialog" />
		<p:panel id="addManualDelAddrPnl">
			<p:messages id="manualAddrMessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
				<tr>
					<td width="120"><p:outputLabel value="#{lbl['lbl.fl.country']}" /> <h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="manCountry"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="Country"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmCountry.countryId}"
							style="width: 212px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="countryList"
								value="#{contractRequestBackingBean.managedBean.countryList}"
								itemLabel="#{countryList.countryName}"
								itemValue="#{countryList.countryId}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveStateList}"
								update="manState" />
						</p:selectOneMenu></td>
					<td><p:message for="manCountry" display="icon" /></td>
					<td width="150"><p:outputLabel value="#{lbl['lbl.fl.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="manState"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="State"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmState.stateId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="stateList"
								value="#{contractRequestBackingBean.managedBean.stateList}"
								itemLabel="#{stateList.stateName}"
								itemValue="#{stateList.stateId}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveDivisionList}"
								update="manDivison,manDistrict" />
						</p:selectOneMenu></td>
					<td colspan="2"><p:message for="manState" display="icon" /></td>
				</tr>
				<tr>
					<td width="126"><p:outputLabel value="#{lbl['lbl.fl.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="address1" label="Address Line 1"
							maxlength="255"
							required="#{contractRequestBackingBean.managedBean.required}"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.address1}"
							size="35" /></td>
					<td><p:message for="address1" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.division']}" /></td>
					<td><p:selectOneMenu id="manDivison"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmDivision.divisionId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="divisionList"
								value="#{contractRequestBackingBean.managedBean.divisionList}"
								itemValue="#{divisionList.divisionId}"
								itemLabel="#{divisionList.divisionName}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveDistrictList}"
								update="manDistrict" />
						</p:selectOneMenu></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.address2}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manDistrict"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="District"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmDistrict.districtId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="districtList"
								value="#{contractRequestBackingBean.managedBean.districtList}"
								itemValue="#{districtList.districtId}"
								itemLabel="#{districtList.districtName}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveCityList}"
								update="manCity" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveDeliveryAddressList}"
								update="manAddress" />
						</p:selectOneMenu></td>
					<td><p:message for="manDistrict" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.address3}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manCity"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="City"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmCity.cityId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="cityList"
								value="#{contractRequestBackingBean.managedBean.cityList}"
								itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
						</p:selectOneMenu></td>
					<td><p:message for="manCity" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.address4}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="postCode"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="Post Code" maxlength="10"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.postcode}"
							 validatorMessage="#{lbl['lbl.fl.postal.code.msg']}"
							size="34" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
					<td><p:message for="postCode" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.email']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:inputText id="email"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="Email" maxlength="80"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.email}"
							validatorMessage="#{lbl['lbl.fl.email.msg']}"
							size="35" ><f:validateRegex disabled="#{contractRequestBackingBean.managedBean.emailValidate}"
       						pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
       					</p:inputText>	
       					
       				</td>
       				<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.email']}"/>
       				<p:message for="email" display="icon" /></td>
       				
					<td><p:outputLabel value="#{lbl['lbl.fl.delivery.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manAddress" label="Manual Address"
							required="#{contractRequestBackingBean.managedBean.required}"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.receivingGrp.addressTypeId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="delAddByDistrict"
								value="#{contractRequestBackingBean.managedBean.manualAddrList}" />
						</p:selectOneMenu>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.delivery.address']}"/>
						<p:message for="manAddress" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.telno']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="telNo"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="Tel No" maxlength="20"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.phoneNo}"
							validatorMessage="#{lbl['lbl.fl.tel.no.msg']}"
							size="35" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
							</td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.tel.no']}"/>
							<p:message for="telNo" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.faxno']}" /></td>
					<td><p:inputText maxlength="20"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.faxNo}"
							 validatorMessage="#{lbl['lbl.fl.fax.no.msg']}"
							size="35" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
							</td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.fax.no']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
					<td><p:inputText maxlength="20"
							value="#{contractRequestBackingBean.managedBean.flManulaAddress.pmAddress.mobileNo}"
							 validatorMessage="#{lbl['lbl.fl.mobile.no.msg']}"
							size="35" required="false" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
							</td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.mobile.no']}"/></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-accept"
				process="@this addManualDelAddrDialog"
				action="#{contractRequestBackingBean.updateManualDeliveryAddrDt}"
				update="itemDetPanelGroup,addManualDelAddrPnl,addressDataTable,@(.orderSummaryChange)">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel" process="@this"
				action="#{contractRequestBackingBean.closeListener}"
				partialSubmit="true">
			</p:commandButton>
		</div>
	</p:dialog>
	
	<p:dialog id="addReceivingOfficerDialog" header="#{lbl['lbl.fl.receiving.officer']}"
		widgetVar="addOfficer" showEffect="fade" hideEffect="fade"
		modal="true" width="600" resizable="false">
		<p:dataTable id="receivingOfficerDt" var="receivingOfficer"
			value="#{contractRequestBackingBean.managedBean.receivingOffList}"
			rowKey="#{purchasedItem}">
			<ac:paginator for="receivingOfficerDt" />
			<p:column headerText="#{lbl['lbl.fl.receiving.officer.name']}">
				<h:outputText value="#{receivingOfficer.pmUser.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.telno']}">
				<h:outputText value="#{receivingOfficer.pmUser.phoneNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.email']}">
				<h:outputText value="#{receivingOfficer.pmUser.email}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.cancel']}" icon="ui-icon-cancel"
				oncomplete="addOfficer.hide();" update="addressDataTable"
				process="@this,receivingOfficerDt">
			</p:commandButton>
		</div>
	</p:dialog>
	
	<p:dialog id="reqItemInfoDialog" header="#{lbl['lbl.fl.requested.item']}"
		widgetVar="reqItemInfo" showEffect="fade" hideEffect="fade"
		modal="true" width="900" resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{contractRequestBackingBean.managedBean.itemName}"
						size="60" /></td>
			</tr>
			<tr>		
				<td><p:outputLabel value="#{lbl['lbl.fl.requested.qty']}" style="text-align:right"/></td>
				<td><p:inputText disabled="true" 
						value="#{contractRequestBackingBean.managedBean.quantity ==0 ? 'N/A' : contractRequestBackingBean.managedBean.quantity}"
						size="35" ><f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" /></p:inputText></td>
			</tr>
			<tr>			
				<td><p:outputLabel value="#{lbl['lbl.fl.price.type']}" /></td>
				<td><p:inputText disabled="true" rendered="#{contractRequestBackingBean.managedBean.priceType != null}"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.priceType)}" 
						size="35" /></td>					
			</tr>
			<tr>			
				<td><p:outputLabel value="#{lbl['lbl.fl.standard.price']}" rendered="#{contractRequestBackingBean.managedBean.standardPrice}"/></td>
				<td><p:inputText disabled="true"  rendered="#{contractRequestBackingBean.managedBean.standardPrice}"
						value="#{contractRequestBackingBean.managedBean.standardUnitPrice}" 
						size="35" >
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>					
			</tr>
		</table> 
		<h:panelGroup rendered="#{!contractRequestBackingBean.managedBean.standardPrice}">
			<p:panel id="reqItemInfoPanel" header="#{lbl['lbl.fl.zone.tier.price.detail']}" toggleable="false" >
				<p:dataTable id="reqItemInfoDt" var="reqItemInfoList" liveScroll="true"
					value="#{contractRequestBackingBean.managedBean.supplierItemPriceList}"
					rowKey="#{purchasedItem}">
					<ac:paginator for="reqItemInfoDt" />
					<p:column headerText="Zone" rendered="#{contractRequestBackingBean.managedBean.zonalPrice || contractRequestBackingBean.managedBean.zonalTierPrice}">
						<p:tree value="#{reqItemInfoList.itemZoneTree}" var="location" rendered="#{contractRequestBackingBean.managedBean.zonalPrice || contractRequestBackingBean.managedBean.zonalTierPrice}">
							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.state.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.division.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.district.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.from.qty']}" style="text-align:right" rendered="#{!contractRequestBackingBean.managedBean.zonalPrice }">
						<h:outputText value="#{reqItemInfoList.supplierItemPrice.fromQty}" styleClass="colFloatRight" rendered="#{!contractRequestBackingBean.managedBean.zonalPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>			
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.to.qty']}" style="text-align:right" rendered="#{!contractRequestBackingBean.managedBean.zonalPrice}">
						<h:outputText value="#{reqItemInfoList.supplierItemPrice.toQty}" styleClass="colFloatRight" rendered="#{!contractRequestBackingBean.managedBean.zonalPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>			
					</p:column>
					
				</p:dataTable>
			</p:panel>
		</h:panelGroup>
	</p:dialog>
</ui:composition>
