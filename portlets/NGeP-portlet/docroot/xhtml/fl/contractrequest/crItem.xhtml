<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="delAddrPanel" header="DELIVERY ITEM DETAILS" toggleable="true">

		<p:dataTable id="addressDataTable" var="address"
			value="#{contractRequestBackingBean.managedBean.flRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{contractRequestBackingBean.managedBean.selectedDelAddr}"
			rowKey="#{address}" lazy="true">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelectRadio" update=":form:cotabs:itemDetPanel,:form:cotabs:deleteAddrBtn"
			listener="#{contractRequestBackingBean.selectAddrEvent()}"/>
			<p:column selectionMode="single" width="5%" />
			<p:column headerText="Delivery Address">
				<h:outputText rendered="#{address.addressType != null}"
					value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
				<h:outputText rendered="#{address.addressType eq null}"
					value="#{address.pmAddress.address1}, #{address.pmAddress.address2}, #{address.pmAddress.address3}, #{address.pmAddress.address4}" />
			</p:column>

			<p:column headerText="Exp. Delivery (Start)">
				<p:calendar value="#{address.startDate}" id="calStartDate"
					showOn="button" pattern="dd/mm/yyyy" />
			</p:column>

			<p:column headerText="Exp. Delivery (End)">
				<p:calendar value="#{address.endDate}" id="calEndDate"
					showOn="button" pattern="dd/mm/yyyy" />

				<p:commandLink rendered="#{address.checkManualAddress}"
					oncomplete="addManualDeliveryAddr.show();"
					action="#{contractRequestBackingBean.editManualAddress(address)}"
					update=":form:cotabs:addManualDelAddrDialog"
					style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Ptj Address" icon="ui-icon-add"
				action="#{contractRequestBackingBean.flDeliveryAddrList}"
				update="delAddr" process="@this,delAddr"
				oncomplete="addDeliveryAddr.show();" />
			<p:commandButton value="Manual Address" icon="ui-icon-add"
				action="#{contractRequestBackingBean.flManualDeliveryAddr}"
				update="delAddr" process="@this,delAddr"
				oncomplete="addManualDeliveryAddr.show();" />
			<p:commandButton id="deleteAddrBtn" value="Delete" icon="ui-icon-delete" onsuccess="delAddrDlg.show()" process="@this"
						disabled="#{contractRequestBackingBean.managedBean.selectedDelAddr == null}" >
			</p:commandButton>
			
		</div>
		
		<p:confirmDialog message="Do you want to delete the record?" severity="alert" widgetVar="delAddrDlg"
			closable="true" appendToBody="true" header="Delete Confirmation" >
			<h:panelGrid columns="2">
				<p:commandButton value="Yes" icon="ui-icon-accept" partialSubmit="true" action="#{contractRequestBackingBean.removeAddRow()}" 
					update=":form:cotabs:deleteAddrBtn,:form:cotabs:itemDataTable,addressDataTable" oncomplete="delAddrDlg.hide();"   /> 
				<p:commandButton value="No" icon="ui-icon-reject" onclick="delAddrDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>	
	
	<p:spacer height="20" />
	<h:panelGroup id="itemDetPanel">

		<p:dataTable id="itemDataTable" var="item" lazy="true"
			rowIndexVar="index" rowKey="#{item}"
			value="#{contractRequestBackingBean.managedBean.selectedDelAddr.flFulfilmentItemAddr}"
			selection="#{contractRequestBackingBean.managedBean.selectedItemsRows}"
			rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}">
			<ac:paginator for="itemDataTable" />
			<p:column selectionMode="multiple" width="5%" />
			<p:column headerText="Type">
					<h:outputText
						value="P" />
				</p:column>
			<p:column headerText="Item Name">
				<h:outputText value="#{item.flFulfilmentItem.qtItem.itemName}" />
			</p:column>

			<p:column headerText="VOT/fund">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="VOT1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Prog./proj.">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="PROG1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Setia">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="SETIA1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Sub Setia">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="SUBset1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Asset Ind.">
					<h:outputText value="Expenses" >
					</h:outputText>
				</p:column>
				<p:column headerText="Charge Code">
					<h:outputText value="#{item.pmDo.doId}" >
					</h:outputText>
				</p:column>
			<p:column headerText="Unit Price (MYR)">
				<p:inputText value="#{item.unitPrice}" disabled="true" style="text-align:right"></p:inputText>
			</p:column>
			<p:column headerText="Ord. Qty.">
				<p:inputText value="#{item.orderedQty}" style="text-align:right">
					<p:ajax update="subTotalTxt" listener="#{contractRequestBackingBean.retrieveZonalPrice(item)}"></p:ajax>
				</p:inputText>
			</p:column>
			<p:column headerText="Sub Total">
				<p:inputText id="subTotalTxt" style="text-align:right"
					value="#{item.orderedAmt}"
					disabled="true">
					<f:convertNumber pattern="#,#00.00" />
					</p:inputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton id="addItems" value="ADD" icon="ui-icon-add"
				action="#{contractRequestBackingBean.addContractedItems}"
				rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}"
				update="contractedItemDt" process="@this,contractedItemDt"
				oncomplete="addItems.show();" />
			<p:commandButton value="Delete" icon="ui-icon-delete"
				rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}"
				action="#{contractRequestBackingBean.removeItemRow}"
				update="itemDataTable" partialSubmit="true" />	

		</div>
	</h:panelGroup>
	</p:panel>

	<p:dialog id="addDelAddrDialog" header="Add Delivery Address"
		widgetVar="addDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="600" resizable="false">

		<p:dataTable id="delAddr" var="delAddr"
			value="#{contractRequestBackingBean.managedBean.addressTypesList}"
			rowKey="#{delAddr.agencyAddressId}"
			selection="#{contractRequestBackingBean.managedBean.selectedCtAddrTypeList}">
			<p:ajax event="rowSelect" update=":form:cotabs:delAddr" />
			<ac:paginator for="delAddr" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Address"></p:column>
					<p:column rowspan="1" headerText="Ptj Name"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText value="#{delAddr.addressType.pmAddress.address1}, #{delAddr.addressType.pmAddress.address2}, 
									#{delAddr.addressType.pmAddress.address3}, #{delAddr.addressType.pmAddress.address4}"
					escape="false" />
			</p:column>
			<p:column>
			 <h:outputText value="#{delAddr.ctAgency.orgProfile.orgName}"></h:outputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD" icon="ui-icon-add"
				action="#{contractRequestBackingBean.updateDeliveryAddrDt}"
				oncomplete="addDeliveryAddr.hide();" update="addressDataTable">
			</p:commandButton>
		</div>


	</p:dialog>
	<p:dialog id="addContractedItemDialog" header="Add Contract Items"
		widgetVar="addItems" showEffect="fade" hideEffect="fade" modal="true"
		height="450" width="600" resizable="false">

		<p:dataTable id="contractedItemDt" var="contractedItem"
			value="#{contractRequestBackingBean.managedBean.contractedItemList}"
			rowKey="#{contractedItem.contractItemId}"
			selection="#{contractRequestBackingBean.managedBean.selectedContractedItemList}">
			<p:ajax event="rowSelect"
				update=":form:cotabs:addContractedItemDialog" process="@this" />
			<ac:paginator for="contractedItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Item"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText value="#{contractedItem.itemName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD"
				action="#{contractRequestBackingBean.updateContractedItemDt}"
				oncomplete="addItems.hide();" update="itemDataTable"
				process="@this,contractedItemDt">
			</p:commandButton>
		</div>

	</p:dialog>
	
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="addManualDelAddrDialog" header="Delivery Address"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true" width="800px" height="450px" resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Country" /></td>
				<td><p:selectOneMenu
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="MALAYSIA" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.address1}"
						size="35" /></td>
				<td><p:outputLabel value="City/Town" /></td>
				<td><p:selectOneMenu
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.pmCity.cityCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="KUALA SELANGOR" itemValue="124" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.address2}"
						size="35" /></td>
				<td><p:outputLabel value="Distict" /></td>
				<td><p:selectOneMenu
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.pmDistrict.districtId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="TAMAN MEDAN" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.address3}"
						size="35" /></td>
				<td><p:outputLabel value="Divison" /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.pmDivision.divisionId}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.address4}"
						size="35" /></td>
				<td><p:outputLabel value="State" /></td>
				<td><p:selectOneMenu
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.pmState.stateCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="SELANGOR" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Postal Code" /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.postcode}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Contact Person" /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.contactName}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Tel.No." /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.phoneNo}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Fax.No." /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.faxNo}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Mobile.No." /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.mobileNo}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText
						value="#{contractRequestBackingBean.managedBean.flManualAddress.pmAddress.email}"
						size="35" /></td>

			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Ok" icon="ui-icon-add"
				action="#{contractRequestBackingBean.updateManualDeliveryAddrDt}"
				oncomplete="addManualDeliveryAddr.hide();" update="addressDataTable">
			</p:commandButton>
			<p:commandButton value="Cancel" icon="ui-icon-add"
				oncomplete="addManualDeliveryAddr.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
