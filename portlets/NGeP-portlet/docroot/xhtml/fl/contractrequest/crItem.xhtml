<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="delAddrPanel" header="DELIVERY ADDRESS" toggleable="true">

		<p:dataTable id="addressDataTable" var="address"
			value="#{contractRequestBackingBean.managedBean.flRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{contractRequestBackingBean.managedBean.selectedDelAddr}"
			rowKey="#{address}" lazy="true">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelectRadio" update=":form:cotabs:itemDetPanel"
				process="@this" />
			<p:column selectionMode="single" width="5%" />
			<p:column headerText="Delivery Address">
				<h:outputText
					value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
			</p:column>

			<p:column headerText="Exp. Delivery (Start)">
				<p:calendar value="#{address.startDate}" id="calStartDate"
					showOn="button" pattern="dd/mm/yyyy" />
			</p:column>

			<p:column headerText="Exp. Delivery (End)">
				<p:calendar value="#{address.endDate}" id="calEndDate"
					showOn="button" pattern="dd/mm/yyyy" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD" icon="ui-icon-add"
				action="#{contractRequestBackingBean.flDeliveryAddrList}"
				update="delAddr" process="@this,delAddr"
				oncomplete="addDeliveryAddr.show();" />
			<p:commandButton value="Delete" icon="ui-icon-delete"
				action="#{contractRequestBackingBean.removeAddRow}"
				update="addressDataTable" partialSubmit="true">
				<f:setPropertyActionListener value="#{address}"
					target="#{contractRequestBackingBean.managedBean.selectedAddrRow}" />
			</p:commandButton>

		</div>
	</p:panel>
	<p:panel id="itemDetPanel" header="ITEM DETAIL" toggleable="true">

		<p:dataTable id="itemDataTable" var="item" lazy="true"
			rowIndexVar="index" rowKey="#{item}"
			value="#{contractRequestBackingBean.managedBean.selectedDelAddr.flFulfilmentItemAddr}"
			selection="#{contractRequestBackingBean.managedBean.selectedItemsRows}"
			rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}">
			<ac:paginator for="itemDataTable" />
			<p:column selectionMode="multiple" width="5%" />
			<p:column headerText="Item Name">
				<h:outputText value="#{item.flFulfilmentItem.qtItem.itemName}" />
			</p:column>

			<p:column headerText="GOSODO">
				<p:selectOneMenu id="goId"
					value="#{contractRequestBackingBean.managedBean.goId}">
					<f:selectItems value="#{contractRequestBackingBean.goList}" />
					<p:ajax event="change" update="soId,doId"></p:ajax>
				</p:selectOneMenu>
				<br />
				<p:selectOneMenu id="soId"
					value="#{contractRequestBackingBean.managedBean.soId}">
					<f:selectItems value="#{contractRequestBackingBean.soList}" />
					<p:ajax event="change" update="doId"></p:ajax>
				</p:selectOneMenu>
				<br />
				<p:selectOneMenu id="doId"
					value="#{contractRequestBackingBean.managedBean.doId}">
					<f:selectItems value="#{contractRequestBackingBean.doList}" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="Activity Code">
				<p:selectOneMenu id="actCode"
					value="#{contractRequestBackingBean.managedBean.goId}">
					<f:selectItems value="#{contractRequestBackingBean.goList}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<p:inputText disabled="true"></p:inputText>
			</p:column>
			<p:column headerText="Ord. Qty.">
				<p:inputText value="#{item.orderedQty}">
					<p:ajax update="subTotalTxt"></p:ajax>
				</p:inputText>
			</p:column>
			<p:column headerText="Sub Total">
				<p:inputText id="subTotalTxt"
					value="#{item.orderedQty}"
					disabled="true"></p:inputText>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton id="addItems" value="ADD" icon="ui-icon-add"
				action="#{contractRequestBackingBean.addContractedItems}"
				rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}"
				update="contractedItemDt" process="@this,contractedItemDt"
				oncomplete="addItems.show();" />
			<p:commandButton value="Delete" icon="ui-icon-delete"
				rendered="#{not empty contractRequestBackingBean.managedBean.selectedDelAddr}"
				action="#{contractRequestBackingBean.removeItemRow}"
				update="itemDataTable" partialSubmit="true" />	

		</div>
	</p:panel>

	<p:dialog id="addDelAddrDialog" header="Add Delivery Address"
		widgetVar="addDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="600" resizable="false">

		<p:dataTable id="delAddr" var="delAddr"
			value="#{contractRequestBackingBean.managedBean.addressTypesList}"
			rowKey="#{delAddr.agencyAddressId}"
			selection="#{contractRequestBackingBean.managedBean.selectedCtAddrTypeList}">
			<p:ajax event="rowSelect" update=":form:cotabs:delAddr" />
			<ac:paginator for="delAddr" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Address"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText
					value="#{delAddr.addressType.pmAddress.address1}, #{delAddr.addressType.pmAddress.address2}, #{delAddr.addressType.pmAddress.address3}, #{delAddr.addressType.pmAddress.address4}"
					escape="false" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD" icon="ui-icon-add"
				action="#{contractRequestBackingBean.updateDeliveryAddrDt}"
				oncomplete="addDeliveryAddr.hide();" update="addressDataTable">
			</p:commandButton>
		</div>


	</p:dialog>
	<p:dialog id="addContractedItemDialog" header="Add Contract Items"
		widgetVar="addItems" showEffect="fade" hideEffect="fade" modal="true"
		height="450" width="600" resizable="false">

		<p:dataTable id="contractedItemDt" var="contractedItem"
			value="#{contractRequestBackingBean.managedBean.contractedItemList}"
			rowKey="#{contractedItem.contractItemId}"
			selection="#{contractRequestBackingBean.managedBean.selectedContractedItemList}">
			<p:ajax event="rowSelect"
				update=":form:cotabs:addContractedItemDialog" process="@this" />
			<ac:paginator for="contractedItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Item"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText value="#{contractedItem.itemName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD"
				action="#{contractRequestBackingBean.updateContractedItemDt}"
				oncomplete="addItems.hide();" update="itemDataTable"
				process="@this,contractedItemDt">
			</p:commandButton>
		</div>


	</p:dialog>
</ui:composition>
