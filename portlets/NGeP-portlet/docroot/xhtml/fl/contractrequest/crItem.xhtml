<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="delAddrPanel" header="#{lbl['lbl.fl.delivery.address']}"
		toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.add.address']}" escape="false"/>
		<p:dataTable id="addressDataTable" var="address"
			value="#{contractRequestBackingBean.managedBean.flRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{contractRequestBackingBean.managedBean.selectedDelAddr}"
			selectionMode="single" 
			rowKey="#{address}">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelect"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
				update=":form:itemDetPanelGroup"
				listener="#{contractRequestBackingBean.selectAddrEvent()}" />			
			<p:column rendered="#{contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}">
				<p:selectBooleanCheckbox value="#{address.selectedAddressRowDelete}" disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
					styleClass="myCustomChekBox">
					<p:ajax event="change"
						update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
						listener="#{contractRequestBackingBean.selectOneCheckboxSelect}"></p:ajax>
				</p:selectBooleanCheckbox>
			</p:column>	
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;text-align:center">
				<p:commandLink oncomplete="addManualDeliveryAddr.show();"
					action="#{contractRequestBackingBean.editManualAddress(address)}"
					update=":form:addManualDelAddrDialog,@(.orderSummaryChange)"
					disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					style="padding-right:5px" rendered="#{address.receivingGrp!=null}">
					<p:graphicImage value="/css/images/design/ico-view-edit.png" />
					<f:setPropertyActionListener
					target="#{contractRequestBackingBean.managedBean.required}"
					value="true" />
				</p:commandLink>
				<h:outputText rendered="#{address.flAddress != null}" style="text-align:left; float:left;width:280px;"
					value="#{contractRequestBackingBean.getFullAddress(address.flAddress)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.period']}" style="white-space:normal;text-align:center" >
				<h:outputText style="float:left;"
					value="#{address.deliveryTerm} #{contractRequestBackingBean.getParameterDesc(address.pmUom)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.delivery.start']}"  style="white-space:normal;text-align:center">
				<p:calendar value="#{address.startDate}" id="calStartDate" style="float:right;"  
					mindate="#{address.startDate}"
					readonlyInput="true"
					rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
					size="8" 
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
						listener="#{contractRequestBackingBean.updateDeliveryAddrDate}"
						update="calEndDate" />
				</p:calendar>
				<h:outputText value="#{address.startDate}" style="float:right;" rendered="#{!contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing or contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.fl.delivery.end']}"  style="white-space:normal;text-align:center">
				<p:calendar value="#{address.endDate}" id="calEndDate" 
					mindate="#{address.startDate}"
					style="float:right;"
					readonlyInput="true"
					disabled="true"
					rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing }"
					size="8"
					maxdate="#{contractRequestBackingBean.managedBean.maxDate}"
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				<h:outputText value="#{address.endDate}" style="float:right;" rendered="#{!contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing or contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>	
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header" style="white-space:normal;">
					<h:outputText value="#{lbl['lbl.fl.receiving.officer']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.recv.officer']}"/>
				</f:facet>
				<p:commandLink oncomplete="addOfficer.show();" process="@this" 
					action="#{contractRequestBackingBean.receivingOfficerList(address)}"
					update=":form:addReceivingOfficerDialog">
					<p:graphicImage value="/css/images/design/ico-officer.png"
						title="#{lbl['lbl.fl.receiving.officer']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<ac:lov id="agencyAddressId" lovId="FL_AGENCY_ADDRESS" disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
						postUpdateListener="contractRequestBackingBean.updateDeliveryAddrDt"
						headerText="#{lbl['lbl.ct.delivery.address']}" 
						buttonLabel="#{lbl['lbl.fl.btn.ptj.address']}"
						selectionMode="multiple"
						saveObject="contractRequestBackingBean.managedBean.selectedAgencyAddressList"
						conditionField="CONTRACT_VER_ID^#{contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.contractVerId}|ORG_PROFILE_ID^#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgProfileId}"
						update=":form:addressDataTable,:form:itemDetPanelGroup"
						rendered="#{contractRequestBackingBean.managedBean.agencyAddress and contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"/>
			
						<ac:lov id="addressTypeId" lovId="DELIVERY_FULL_ADDRESS_FL" disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
						postUpdateListener="contractRequestBackingBean.updateDeliveryAddrDt"
						headerText="#{lbl['lbl.ct.delivery.address']}" 
						buttonLabel="#{lbl['lbl.fl.btn.ptj.address']}"
						selectionMode="multiple"
						saveObject="contractRequestBackingBean.managedBean.selectedDeliveryFullAddr"
						conditionField="ORG_PROFILE_ID^#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgProfileId}"
						update=":form:addressDataTable,:form:itemDetPanelGroup"
						rendered="#{!contractRequestBackingBean.managedBean.agencyAddress and contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"/>
			<p:commandButton value="#{lbl['lbl.fl.btn.other.address']}" disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
				action="#{contractRequestBackingBean.flManualDeliveryAddr}"
				rendered="#{contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView and contractRequestBackingBean.managedBean.flRequest.phisNo==null }"
				update="addManualDelAddrPnl,@(.orderSummaryChange) " process="@this"
				title="#{lbl['lbl.fl.tooltip.other.address']}"
				oncomplete="addManualDeliveryAddr.show();" >
				<f:setPropertyActionListener
					target="#{contractRequestBackingBean.managedBean.required}"
					value="true" />
					</p:commandButton>
			<p:commandButton id="deleteAddrBtn" value="#{lbl['lbl.fl.btn.delete']}"
				onsuccess="delAddrDlg.show()" process="@this"
				update="addressDataTable,@(.orderSummaryChange)"
				title="#{lbl['lbl.fl.tooltip.delete']}"
				rendered="#{contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
				disabled="#{contractRequestBackingBean.managedBean.deleteButtonHide or !bpmTasklistBackingBean.managedBean.claim}">
			</p:commandButton>

		</div>
		<p:confirmDialog message="#{lbl['lbl.msg.confirm.delete']}"
			severity="alert" widgetVar="delAddrDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					partialSubmit="true" 
					update=":form:deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					action="#{contractRequestBackingBean.removeAddRow()}"
					oncomplete="delAddrDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					partialSubmit="true"
					update=":form:deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					action="#{contractRequestBackingBean.notRemoveAddressRow()}"
					onclick="delAddrDlg.hide();" />	
			</div>
		</p:confirmDialog>			
		
		<h:panelGroup id="itemDetPanelGroup">
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.item.list']}" escape="false"  /> 
			<p:commandLink oncomplete="uomRefDialog.show();" value="#{lbl['lbl.fl.instruction.here']}" style="font-size:10px;font-style:italic"
					action="#{contractRequestBackingBean.resetMeasurementSearch}" process="@this"
					update=":form:uomRefDlg"/>
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.del.address2']}" />
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.item.list2']}" escape="false"  />
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.tax.guideline1']}" escape="false"  />
			<p:commandLink  oncomplete="taxGuideLineInfo.show();"  value="#{lbl['lbl.fl.instruction.here']}" style="font-size:10px;font-style:italic"
					process="@this"
					update=":form:itemTaxGuideLineDialog"/>
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.tax.guideline2']}" escape="false"  /> 			
			<p:dataTable id="itemDataTable" var="item"
				rowIndexVar="index" rowKey="#{item}"
				value="#{contractRequestBackingBean.managedBean.showItemAddrList}"
				selection="#{contractRequestBackingBean.managedBean.selectedItemsRows}" >
				<p:ajax event="toggleSelect"
					disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					update=":form:deleteItemBtn,itemDataTable,@(.orderSummaryChange)"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					listener="#{contractRequestBackingBean.itemToggleSelect}" />
				<p:ajax event="rowSelectCheckbox"
					disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					update=":form:deleteItemBtn,itemDataTable,@(.orderSummaryChange)"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					listener="#{contractRequestBackingBean.itemRowSelectCheckbox}" />
				<p:ajax event="rowUnselectCheckbox"
					disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					update=":form:deleteItemBtn,itemDataTable,@(.orderSummaryChange)"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					listener="#{contractRequestBackingBean.itemRowUnselectCheckbox}" />
				<p:ajax event="rowSelect" 
					disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					update=":form:deleteItemBtn,itemDataTable,@(.orderSummaryChange)"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					listener="#{contractRequestBackingBean.itemRowSelectCheckbox}" />
				<p:ajax event="rowUnselect"
					disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					update=":form:deleteItemBtn,itemDataTable,@(.orderSummaryChange)"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					listener="#{contractRequestBackingBean.itemRowUnselectCheckbox}" />				
				<ac:paginator for="itemDataTable" />
				<p:column selectionMode="multiple" style="width:5%" styleClass="td-check-box-spacing" disabledSelection="#{!bpmTasklistBackingBean.managedBean.claim}"
					rendered="#{(contractRequestBackingBean.managedBean.flRequest.ctContract.fulfillmentType.parameterCode != ParameterConst.fulfilmentTypeOneOff) and contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}">
				</p:column>	
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.fl.gst']}" /><br/>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.flag']}"/>
					</f:facet>				
					<p:selectBooleanCheckbox value="#{item.gst}"
						disabled="#{(empty contractRequestBackingBean.managedBean.selectedDelAddr  or item.orderedQty == 0) or  
									contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}">
						<p:ajax process="@this" listener="#{contractRequestBackingBean.retrieveOrderAmount(item)}"
						update="subTotalTxt,unitPrice,orderedQty,itemDataTable"/>
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column>
					<f:facet name="header" style="width:8%;text-align:center">
						<h:outputText value="#{lbl['lbl.fl.item.code']}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}"/>
					</f:facet>
					<h:outputText rendered="#{item.scRequestItem.cmItem==null}" value="#{item.scRequestItem.tempUnspscCode}" />
					<h:outputText rendered="#{item.scRequestItem.cmItem!=null}" value="#{item.scRequestItem.cmItem.extensionCode}" />
				</p:column>				
				<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;width:20%">
					<h:outputText value="#{item.scRequestItem.itemName}" id="itemDesc" style="text-align:left; float:left;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.uom']}" style="text-align:center">
					<h:outputText value="#{item.scRequestItem.uom.uomName}" style="float:left;"/>
				</p:column>				
				<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:center">
					<h:outputText value="#{item.unitPrice}" disabled="true" size="6" id="unitPrice" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:center">
					<h:outputText value="#{item.gstAmount}" disabled="true" size="6" id="gstAmt" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:center">
					<h:outputText value="#{item.gstUnitPrice}" disabled="true" size="6" id="unitPriceGST" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:center;width:148px">
					<p:inputText value="#{item.orderedQty}" size="13" id="orderedQty" label="#{lbl['lbl.fl.ordered.qty']}"
						disabled="#{(empty contractRequestBackingBean.managedBean.selectedDelAddr or contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView 
									or (contractRequestBackingBean.managedBean.flRequest.scPurchaseInDefault != null and item.itemType.parameterCode eq ParameterConst.itemTypeService))
									or !bpmTasklistBackingBean.managedBean.claim}"
						maxlength="#{item.scRequestItem.uom.decimalScale == 0 ? 13 : 14}" style="text-align:right" styleClass="colFloatLeft" 
						onkeypress="if (event.keyCode == 13) { return false; }">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.scRequestItem.uom.uomCode)}" />
						<f:attribute name="max" value="#{contractRequestBackingBean.getItemMaxQuantity(item.scRequestItem.uom)}"/>		
						<f:validator validatorId="quantityDoubleRangeValidator" />
						<p:ajax update="subTotalTxt,unitPrice,orderedQty,itemDataTable"
							process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							listener="#{contractRequestBackingBean.retrieveOrderAmount(item)}"></p:ajax>
							<p:commandLink oncomplete="reqItemInfo.show();" process="@this"  
					action="#{contractRequestBackingBean.reqItemInfoList(item)}"
					update=":form:reqItemInfoDialog,@(.orderSummaryChange)">
					<p:graphicImage value="/css/images/ico-info.png"
						title="#{lbl['lbl.fl.request.item.info']}" />
					</p:commandLink>
					</p:inputText>
					<p:message for="orderedQty" display="icon" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:center">
					<h:outputText id="subTotalTxt" size="5" style="float:right" styleClass="colFloatRight" 
						value="#{item.orderedAmt}" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px"></p:spacer>
			<div style="width: 100%; text-align: right">
				<p:commandButton id="addItems" value="#{lbl['lbl.btn.add']}" disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
					action="#{contractRequestBackingBean.addContractedItems}"
					rendered="#{contractRequestBackingBean.managedBean.itemAddButtonShow and contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
					process="@this" update="resultPanel,searchPanel,messages,messages2"
					oncomplete="addItems.show();" />
				<p:commandButton value="#{lbl['lbl.fl.btn.delete']}" id="deleteItemBtn"
					rendered="#{contractRequestBackingBean.managedBean.itemAddButtonShow and contractRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
					onsuccess="delItemDlg.show()" title="#{lbl['lbl.fl.tooltip.delete']}"
					disabled="#{contractRequestBackingBean.managedBean.itemDeleteButtonShow or !bpmTasklistBackingBean.managedBean.claim}"
					update="itemDataTable" partialSubmit="true" />
			</div>
		</h:panelGroup>
		<p:confirmDialog message="#{lbl['lbl.fl.msg.confirm.delete.item']}"
			severity="alert" widgetVar="delItemDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					partialSubmit="true" 
					action="#{contractRequestBackingBean.removeItemRow}"
					update="deleteItemBtn,itemDataTable"
					oncomplete="delItemDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					onclick="delItemDlg.hide()" type="button" />
			</div>
		</p:confirmDialog>		
	</p:panel>
	<p:dialog id="addManualDelAddrDialog" header="#{lbl['lbl.fl.btn.other.address']}"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		 modal="true" width="900px" resizable="false" position="top">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}" escape="false"/>
		<p:ajax event="close" listener="#{contractRequestBackingBean.closeListener}" update="addManualDelAddrDialog" />
		<p:panel id="addManualDelAddrPnl">
			<p:messages id="manualAddrMessages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
				<tr>
					<td width="120"><p:outputLabel value="#{lbl['lbl.fl.country']}" /> <h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="276"><p:selectOneMenu id="manCountry"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="Country"
							value="#{contractRequestBackingBean.managedBean.flManualAddress.flAddress.pmCountry.countryId}"
							style="width: 276px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="countryList"
								value="#{contractRequestBackingBean.managedBean.countryList}"
								itemLabel="#{countryList.countryName}"
								itemValue="#{countryList.countryId}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveStateList}"
								update="manState" />
						</p:selectOneMenu></td>
					<td><p:message for="manCountry" display="icon" /></td>
					<td width="150"><p:outputLabel value="#{lbl['lbl.fl.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="210"><p:selectOneMenu id="manState"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="State"
							value="#{contractRequestBackingBean.managedBean.flManualAddress.flAddress.pmState.stateId}"
							style="width: 210px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="stateList"
								value="#{contractRequestBackingBean.managedBean.stateList}"
								itemLabel="#{stateList.stateName}"
								itemValue="#{stateList.stateId}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveDivisionList}"
								update="manDivison,manDistrict" />
						</p:selectOneMenu></td>
					<td><p:message for="manState" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="address1" label="Address Line 1"
							maxlength="255" size="38"  
							required="#{contractRequestBackingBean.managedBean.required}"
							value="#{contractRequestBackingBean.managedBean.flManualAddress.flAddress.address1}"
							onkeypress="if (event.keyCode == 13) { addManualDelAddrBtn.jq.click(); return false; }"/></td>
					<td><p:message for="address1" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.division']}" /></td>
					<td><p:selectOneMenu id="manDivison"
							value="#{contractRequestBackingBean.managedBean.flManualAddress.flAddress.pmDivision.divisionId}"
							disabled="#{contractRequestBackingBean.managedBean.divisionDisplay}"
							style="width: 180px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="divisionList"
								value="#{contractRequestBackingBean.managedBean.divisionList}"
								itemValue="#{divisionList.divisionId}"
								itemLabel="#{divisionList.divisionName}" />
							<p:ajax event="change"
								listener="#{contractRequestBackingBean.retrieveDistrictList}"
								update="manDistrict" />
						</p:selectOneMenu>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.manual.addr']}"/>
					</td>
					<td><p:message for="manDivison" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255" size="38"
							value="#{contractRequestBackingBean.managedBean.flManualAddress.flAddress.address2}"
							onkeypress="if (event.keyCode == 13) { addManualDelAddrBtn.jq.click(); return false; }"/></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manDistrict"
							required="#{contractRequestBackingBean.managedBean.required}"
							label="District"
