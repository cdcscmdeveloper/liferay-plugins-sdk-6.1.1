<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="AGENCY DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" id="ministry"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.ptj']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="5" id="preparedOrgProfileId" readonly="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <ac:lov id="preparedPtj"
						lovId="PM_ORG_PROFILE" headerText="Prepared PTJ Lov"
						saveObject="contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile"
						value="#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgName}"
						size="39" update=":form:preparedOrgProfileId,:form:issuedOrgCode,:form:preparedOrgProfileId" readonly="true"
						postUpdateListener="contractRequestBackingBean.getAgAccount()"
						conditionField="parentOrgProfile.orgProfileId^#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.parentOrgProfile.orgProfileId}|orgProfileId^#{contractRequestBackingBean.managedBean.orgProfileIds}^9">
					</ac:lov></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /> </td>
				<td><p:inputText size="5" id="issuedOrgCode" readonly="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <p:inputText size="39" id="issuedOrgName"
						readonly="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgName}"/> </td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="5" id="chargeOrgProfileId" readonly="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <ac:lov id="chargePtj"
						lovId="PM_ORG_PROFILE" headerText="Charge PTJ Lov" readonly="true"
						saveObject="contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile"
						value="#{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.orgName}"
						conditionField="parentOrgProfile.orgProfileId^#{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.parentOrgProfile.orgProfileId}"
						update=":form:chargeOrgProfileId" size="39">
					</ac:lov></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true" id="agOffice"
						value="#{contractRequestBackingBean.managedBean.flRequest.agOffice.officeCode}" />
					<p:spacer width="5" /> <p:inputText size="39" disabled="true" id="agOfficeName"
						value="#{contractRequestBackingBean.managedBean.flRequest.agOffice.officeName}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td rowspan="3" style="width:290px"><p:inputTextarea cols="50" rows="4" id="title"
						maxlength="500" style=" margin-bottom:5px;" label="Title"
						value="#{contractRequestBackingBean.managedBean.flRequest.title}"
						required="true" /> </td>
						<td><p:message for="title" display="icon" /></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="20"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.financialYear}" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="20" disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><p:inputText size="12" disabled="true" style="text-align:right"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTerm}"
						rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing eq false}" />
					<p:spacer width="5" /> <p:inputText size="2"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTermUom)}"
						disabled="true"
						rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing eq false}" />
					<p:inputText size="12" disabled="true"
						value=""
						rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}" />
					<p:spacer width="5" /> <p:inputText size="2" value="" disabled="true" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"/>
					<p:spacer width="5" /> <h:outputText
						value="#{lbl['lbl.fl.zonal']}" /> <p:selectBooleanCheckbox
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
						disabled="true" /></td>

				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="20" disabled="true" 	value="#{contractRequestBackingBean.managedBean.flRequest.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.start.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button" disabled="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}" readonlyInput="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
						value="#{contractRequestBackingBean.managedBean.flRequest.startDate}"
						mindate="#{contractRequestBackingBean.managedBean.flRequest.startDate}" 
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{contractRequestBackingBean.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.cr.mto']}" /></td>
				<td><p:selectBooleanCheckbox
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.mto}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.end.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button" id="delEndDate" 
						disabled="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}" 
						readonlyInput="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
						mindate="#{contractRequestBackingBean.managedBean.flRequest.startDate}" 
						maxdate="#{contractRequestBackingBean.managedBean.maxDate}"
						value="#{contractRequestBackingBean.managedBean.flRequest.endDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{contractRequestBackingBean.updateDeliveryEndDate}" />
					</p:calendar></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.cr.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.factored}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.smSupplier.regNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="20" disabled="true" 
							value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.smSupplier.smMofAccounts[0].mofNo}"/></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.branchName}"
						/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true" 
				value="#{contractRequestBackingBean.getFullAddress(contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.smAddress)}"
						style=" margin-bottom:5px;"
						 /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.phoneNo}"
									/></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="20" disabled="true" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.faxNo}"
									/></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.contactPerson}"
						 /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.contactEmail}"
						 /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="15" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.contactPhoneNo}"
						 /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FACTORING DETAILS" toggleable="true" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.factored}">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true" value="" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
	<ac:lovPopup />
</ui:composition>
