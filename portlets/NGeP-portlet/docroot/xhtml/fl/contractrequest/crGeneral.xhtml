<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:messages id="msgs" />
	<table>
		<tr>
			<td><p:outputLabel value="Is Mto: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{contractRequestBackingBean.managedBean.mto}" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="Have Imported Items: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{contractRequestBackingBean.managedBean.importedItems}" /></td>
		</tr>
	</table>
	<p:panel header="AGENCY DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" id="ministry"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.prepared.ptj']}" /></td>
				<td><p:inputText size="5" id="preparedOrgProfileId"
						value="#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <ac:lov id="preparedPtj"
						lovId="PM_ORG_PROFILE" headerText="PreparedPtj Lov"
						saveObject="contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile"
						value="#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgName}"
						update=":form:cotabs:preparedOrgProfileId" readonly="true"
						conditionField="orgProfileId^#{contractRequestBackingBean.managedBean.testOrg}">
					</ac:lov></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" id="issuedOrgProfileId"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <ac:lov id="issuePtj"
						lovId="PM_ORG_PROFILE" headerText="IssuePtj Lov"
						saveObject="contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgName}"
						conditionField="orgProfileId^#{contractRequestBackingBean.managedBean.testOrg}"
						update=":form:cotabs:ministry,:form:cotabs:issuedJabatan,:form:cotabs:issuedOrgProfileId">
					</ac:lov></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <p:inputText id="chargedPtj" size="39"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true" /> <p:spacer
						width="5" /> <p:inputText size="39" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 138px;"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4" id="title"
						style=" margin-bottom:5px;"
						value="#{contractRequestBackingBean.managedBean.flRequest.title}" />
					<h:outputText value="" /></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="20"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="20" value=" " disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><p:inputText size="12" disabled="true" value="10" /> <p:spacer
						width="5" /> <p:inputText size="2" value="Days" disabled="true" />
					<p:spacer width="5" /> <p:outputLabel
						value="#{lbl['lbl.fl.zonal']}" /> <h:selectBooleanCheckbox /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="25" disabled="true">
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.start.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button" value="#{contractRequestBackingBean.managedBean.flRequest.startDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.cr.mto']}" /></td>
				<td><p:selectBooleanCheckbox
						value="#{contractRequestBackingBean.managedBean.mto}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.end.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button" value="#{contractRequestBackingBean.managedBean.flRequest.endDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.cr.factored']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true"/></td>
			</tr>

		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.smSupplier.regNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="20" disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{contractRequestBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="20" disabled="true"
									value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.contactPerson}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.contactEmail}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="15" value="#{contractRequestBackingBean.managedBean.flRequest.flSupplierDtl.contactPhoneNo}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="FACTORING DETAILS" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 136px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.fact.com']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{contractRequestBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true" value="" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true" value="" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
	<ac:lovPopup />
</ui:composition>
