		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.bond.waiver.cr.approval']}" rendered="#{contractRequestBackingBean.isApprover()}" escape="false"/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}" escape="false"/>

			</tr>

					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.prepared.date']}"/></td>

						<table>
							<tr>
								<td>

									<p:selectBooleanCheckbox id="crGeneralRadio" required="true"
										value="#{contractRequestBackingBean.managedBean.flRequest.radioCheckDeliveryDate}">

										<p:ajax event="change"
											listener="#{contractRequestBackingBean.upDateStartDateFromBpm}"

								<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.flag']}" /></td>
							</tr>
						</table>

					</td>








				</tr>
			</c:if>







			<tr>

						maxdate="#{contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.expDate}"
						value="#{contractRequestBackingBean.managedBean.flRequest.startDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{contractRequestBackingBean.editDeliveryDate}"
							update="delEndDate" />
					</p:calendar>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.delivery.start.date']}" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"/></td>

					<td><p:inputText size="25" disabled="true" 	value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.fulfillmentType)}">
					</p:inputText>
				</td>
				
					
			</tr>

			<tr>

					</p:inputText>

						<table style="width: 100%">
							
								<td>&#160;<p:commandLink

										style="color: blue;display: inline;text-align: right;font-size: 12px;"/></td>
							
						</table>

						<p:dialog header="#{lbl['lbl.quartz.scheduled.jobs.info']}"

							<h3></h3>
							<p></p>

							<p:dataTable
								emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"

								<ac:paginator for="contractRequestIdd"></ac:paginator>
				
				
								<p:columnGroup type="header">
									<p:row>
										<p:column colspan="3"
											style="white-space:normal;text-align: center;"
											headerText="#{lbl['lbl.pm.org.ptjCode']}/#{lbl['lbl.pm.org.ptjName']} : #{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgCode} #{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgName}" />


									</p:row>
									<p:row>
										<p:column style="text-align: center;" colspan="1"
											headerText="#{lbl['lbl.fl.fs.tableinfo']}" />
										<p:column style="text-align: center;" colspan="1"
											headerText="#{lbl['lbl.fl.title.contract.contractreq']}" />
										<p:column style="text-align: center;" colspan="1"
											headerText="#{lbl['lbl.fl.do.pocostatus']}" />
									</p:row>

								</p:columnGroup>


								<p:column>
									<h:outputText value="#{contractObjj.schNo}"

								</p:column>

								<p:column>
									<h:outputText value="#{contractObjj.crNo}"
										style="display: block; width:100%; text-align:center;" />
									<h:outputText value="#{contractObjj.crNoStatus=='(null)' ? '' : contractObjj.crNoStatus}"

								</p:column>

								<p:column>
									<h:outputText value="#{contractObjj.coNo}"
										style="display: block; width:100%; text-align:center;" />

								<h:outputText value="#{contractObjj.coNoStatus=='(null)' ? '' : contractObjj.coNoStatus}"
										style="display: block; width:100%; text-align:center;white-space: pre-wrap;" />

								</p:column>


							</p:dataTable>


							<table style="width: 100%">
								<tr>
									<td style="text-align: right; width: 12%"><p:commandButton
											value="#{lbl['lbl.fl.btn.close']}" type="text"
											onclick="sample.hide();" style="text-align: right;" /></td>
								</tr>
							</table>
						</p:dialog>
					<!-- ENDING FOR #13984 Dialog Box for schedule and phase -->


				</td>
			</tr>
			<!--#13984 ENDING Schedule/ phase table  -->

						rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing == 'false'}"

						maxdate="#{contractRequestBackingBean.managedBean.maxDate}"
						value="#{contractRequestBackingBean.managedBean.flRequest.endDate}"

						<p:ajax event="dateSelect"
							listener="#{contractRequestBackingBean.updateDeliveryEndDate}" />
					</p:calendar></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.factored.contract']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true" style="vertical-align:-4px"

						contractRequestBackingBean.managedBean.factored}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.factored']}"/></td>	
			</tr>
			<tr>
				<td></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.zonal.price']}"  /></td>
				<td><p:selectBooleanCheckbox style="vertical-align:-4px"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
						disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.zonal.price']}" /></td>
			</tr>
			<tr>

				<td><p:selectBooleanCheckbox style="vertical-align:-4px"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.mto}"
						disabled="true" rendered="false"/></td>	
			</tr>
		</table>
		<table>

				<td><p:selectBooleanCheckbox

					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><h:outputText style="text-align:left" value="#{lbl['lbl.fl.declaration']}"/></td>
		</tr>
	</table>
	</p:panel>
