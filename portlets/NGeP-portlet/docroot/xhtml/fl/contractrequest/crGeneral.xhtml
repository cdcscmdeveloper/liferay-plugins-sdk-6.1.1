<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >


	<p:messages id="msgs" />
	<table>
		<tr>
			<td><p:outputLabel value="Is Mto: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{contractRequestBackingBean.managedBean.mto}" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="Have Imported Items: " /></td>
			<td><p:selectBooleanCheckbox
					value="#{contractRequestBackingBean.managedBean.importedItems}" /></td>
		</tr>
	</table>
	<p:panel header="FULFILMENT DETAIL" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35" id="ministry"
						value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.request.no']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:inputText size="35" disabled="true" id="issuedJabatan" value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.parentOrgProfile.orgName}"/> </td>
				<td><p:outputLabel value="#{lbl['lbl.fl.mto']}" /></td>
				<td><p:selectOneRadio disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.mto}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:selectOneMenu value="#{contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgProfileId}" style="width: 207px;">
					<f:selectItems value="#{contractRequestBackingBean.issuedPTJList}"></f:selectItems>
					<p:ajax event="change" update="issuedJabatan,ministry,chargedPtj" listener="#{contractRequestBackingBean.updateIssuedJabatan}"></p:ajax>
				</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
				<td><p:inputText size="20"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.contractPhysicalNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.jabatan']}" /></td>
				<td><p:inputText size="35" disabled="true" id="receivedJabatan" value="#{contractRequestBackingBean.managedBean.flRequest.receivedOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.receivedOrgProfile.parentOrgProfile.orgName}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="35"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:selectOneMenu value="#{contractRequestBackingBean.managedBean.flRequest.receivedOrgProfile.orgProfileId}" style="width: 207px;">
					<f:selectItems value="#{contractRequestBackingBean.receivedPTJList}"></f:selectItems>
					<p:ajax event="change" update="receivedJabatan" listener="#{contractRequestBackingBean.updateReceivedJabatan}"></p:ajax>
				</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.fulfilment.type']}" /></td>
				<td><p:inputText size="35"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.fulfillmentType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="2"><p:inputTextarea  cols="36"
						style=" margin-bottom:5px;"
						value="#{contractRequestBackingBean.managedBean.flRequest.title}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.plan.no']}" /></td>
				<td><p:inputText size="20"
						value="#{contractRequestBackingBean.managedBean.flRequest.planId}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.fs.no']}" /></td>
				<td><p:inputText size="20" disabled="true" value="#{contractRequestBackingBean.managedBean.flRequest.scheduleNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" * #{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:selectOneMenu
						value="#{contractRequestBackingBean.managedBean.flRequest.pmVotFund}"
						style="width: 207px;">
						<f:selectItems
							value="#{contractRequestBackingBean.maksudCodeList}" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:inputText id="chargedPtj" size="35" disabled="true" value="#{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile eq null ? '' : contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.orgName}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20"
						value="#{contractRequestBackingBean.managedBean.flRequest.financialYear}"
						disabled="true" /></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:selectOneMenu
						value="#{contractRequestBackingBean.managedBean.flRequest.agOffice}"
						style="width: 207px;">
						<f:selectItems itemLabel="002 KAWANGAN KL" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']}" /></td>
				<td><p:selectOneRadio id="financingOpt"
						value="#{contractRequestBackingBean.managedBean.flRequest.financingLoan}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText size="20"
						value="#{contractRequestBackingBean.managedBean.flRequest.createdDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText size="35"
						value=""
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 125px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea  cols="36"
						style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText size="35" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
	<ac:lovPopup />
</ui:composition>
