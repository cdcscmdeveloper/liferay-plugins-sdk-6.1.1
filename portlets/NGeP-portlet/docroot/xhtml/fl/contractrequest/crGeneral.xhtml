<ui:composition
	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<!-- <ui:define name="sideMenu">
		<ui:include src="/xhtml/fl/shared/sidemenu/flCrSideMenu.xhtml" />
	</ui:define>
	<ui:define name="content"> -->
		<table style="width: 800px;">
			<tr>
				<td colspan="4" align="right">
				<ui:repeat var="bpmAction"
					value="#{fulfilmentRequestBackingBean.managedBean.actions}">
					<p:commandButton value="#{bpmAction}" action="#{fulfilmentRequestBackingBean.submitAction(bpmAction)}" process="@this"/>
				</ui:repeat> 
				</td>
			</tr>
		</table>
		 <p:messages id="msgs"/>
		<p:panel header="FULFILMENT DETAIL" toggleable="true" id="flDetails">
			<table>
				<tr>
					<td><p:outputLabel value="Ministry" /></td>
					<td><p:inputText style="width: 260px;"
							value="#{fulfilmentRequestBackingBean.managedBean.flRequest.createdOrgProfile.pmOrgProfile.pmOrgProfile.orgName}" disabled="true" /></td>
					<td><p:outputLabel value="Contract Req. NO." /></td>
					<td><p:inputText style="width: 260px;" 
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Issued Jabatan" /></td>
					<td><p:selectOneMenu value="#{fulfilmentRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgProfileId}" style="width: 260px;">
							<f:selectItems value="#{fulfilmentRequestBackingBean.divisionProfileList}" />
							<p:ajax event="change" update="flDetails" process="@this"
								listener="#{fulfilmentRequestBackingBean.checkPtjFlg}" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="MTO?" /></td>
					<td><p:selectBooleanCheckbox value="#{fulfilmentRequestBackingBean.managedBean.flRequest.mto}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Issued PTJ" /></td>
					<td><p:selectOneMenu
						disabled="#{fulfilmentRequestBackingBean.managedBean.checkPtjFlg}"
						value="#{fulfilmentRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems value="#{fulfilmentRequestBackingBean.PTJList}" />
					</p:selectOneMenu></td>
					<td><p:outputLabel value="Contract NO." /></td>
					<td><p:inputText style="width: 260px;" value="#{fulfilmentRequestBackingBean.managedBean.flRequest.ctContract.contractName}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Received Jabatan" /></td>
					<td><p:selectOneMenu value="#{fulfilmentRequestBackingBean.managedBean.flRequest.receivedOrgProfile.orgProfileId}" style="width: 260px;">
							<f:selectItems value="#{fulfilmentRequestBackingBean.divisionProfileList}"/>
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Contract Type" /></td>
					<td><p:inputText style="width: 260px;"
							value="#{fulfilmentRequestBackingBean.managedBean.flRequest.ctContract.contractTypeCode.code}" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="* Received PTJ" /></td>
					<td><p:selectOneMenu disabled="#{fulfilmentRequestBackingBean.managedBean.checkPtjFlg}" value="#{fulfilmentRequestBackingBean.managedBean.flRequest.receivedOrgProfile.orgProfileId}" style="width: 260px;">
							<f:selectItems value="#{fulfilmentRequestBackingBean.PTJList}" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="Fulfillment Type" /></td>
					<td><p:inputText style="width: 260px;"
							value="#{fulfilmentRequestBackingBean.managedBean.flRequest.ctContract.fulfillmentTypeCode.code}" disabled="true" /></td>
				</tr>
				<tr>
					<td rowspan="4"><p:outputLabel value="* Title" /></td>
					<td rowspan="4"><p:inputTextarea rows="8"
							style="width: 260px;" value="#{fulfilmentRequestBackingBean.managedBean.flRequest.title}"/></td>
					<td><p:outputLabel value="Plan NO." /></td>
					<td><p:inputText style="width: 260px;" value="#{fulfilmentRequestBackingBean.managedBean.flRequest.planId}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="FS. NO." /></td>
					<td><p:inputText style="width: 260px;" 
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Creation Date" /></td>
					<td><p:inputText style="width: 260px;"
							value="#{fulfilmentRequestBackingBean.managedBean.flRequest.createdDate}" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Status" /></td>
					<td><p:inputText style="width: 260px;" value="#{fulfilmentRequestBackingBean.managedBean.flRequest.pmDocStatus.statusId}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="*Financial Year" /></td>
					<td><p:selectOneMenu value="#{fulfilmentRequestBackingBean.managedBean.flRequest.financialYear}" style="width: 260px;">
							<f:selectItems itemLabel="2013" itemValue="1" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value=" *Maksud  Code" /></td>
					<td><p:selectOneMenu value="#{fulfilmentRequestBackingBean.managedBean.flRequest.maksudId}" style="width: 260px;">
							<f:selectItems value="#{fulfilmentRequestBackingBean.maksudCodeList}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="*AG Office" /></td>
					<td><p:selectOneMenu value="#{fulfilmentRequestBackingBean.managedBean.flRequest.orgProfileAgoId}" style="width: 260px;">
							<f:selectItems itemLabel="002 KAWANGAN KL" itemValue="1" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="*Charge PTJ" /></td>
					<td><p:selectOneMenu disabled="#{fulfilmentRequestBackingBean.managedBean.checkPtjFlg}" style="width: 260px;">
							<f:selectItems value="#{fulfilmentRequestBackingBean.PTJList}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Financing?" /></td>
					<td><p:selectBooleanCheckbox value="#{fulfilmentRequestBackingBean.managedBean.flRequest.financingLoan}"/></td>

				</tr>
			</table>
		</p:panel>
		<p:panel header="SUPPLIER DETAIL" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="Supplier ID" /></td>
					<td><p:inputText style="width: 120px;" value="#{fulfilmentRequestBackingBean.managedBean.flRequest.ctContract.smSupplier.supplierId}"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Supplier Name" /></td>
					<td><p:inputText style="width: 260px;" 
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputTextarea rows="8" style="width: 260px;"
							disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Email" /></td>
					<td><p:inputText style="width: 260px;"
							 disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Telephone NO." /></td>
					<td><p:inputText style="width: 120px;" 
							disabled="true"/></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="APPROVER DETAIL" toggleable="true">
			<table>
				<tr>
					<td colspan="2"><p:pickList id="pickList"
							value="#{screenDesignListsBean.approverDetails}" var="approver"
							itemLabel="#{approver}" itemValue="#{approver}">
							<f:facet name="sourceCaption">Available</f:facet>
							<f:facet name="targetCaption">Selected</f:facet>
						</p:pickList> 
						<p:dialog modal="true" showEffect="fade" hideEffect="fade"
							widgetVar="approverDialog">
							<h:panelGrid id="displayApproverDetails" columns="2">
								<h:outputText value="Source: " style="font-weight:bold" />
								<ui:repeat
									value="#{screenDesignListsBean.approverDetails.source}"
									var="item">
									<h:outputText value="#{item}" style="margin-right:5px" />
								</ui:repeat>

								<h:outputText value="Target: " style="font-weight:bold" />
								<ui:repeat
									value="#{screenDesignListsBean.approverDetails.target}"
									var="item">
									<h:outputText value="#{item}" style="margin-right:5px" />
								</ui:repeat>
							</h:panelGrid>

						</p:dialog></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="REMARKS AND ATTACHMENT" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="* Remarks    " /></td>
					<td><p:inputTextarea rows="8" style="width: 260px;" required="true" id="remark"
							requiredMessage="Please enter remarks."
							value="#{fulfilmentRequestBackingBean.managedBean.flRemark.remark}" maxlength="200"       
    						counterTemplate="{0} characters remaining." autoResize="false"/>
    						<p:message for="remark" /></td>
					<td><p:outputLabel value="Attachment" /></td>
					<td><p:fileUpload
							fileUploadListener="#{fulfilmentRequestBackingBean.fileUpload}"
							 update="messages" mode="advanced" dragDropSupport="false" sizeLimit="100000"
							multiple="true" allowTypes="/(\.|\/)(doc|docx|xls|xlsx|pdf)$/" />
							 <p:growl id="messages" showDetail="true"/></td>
				</tr>
			</table>

		</p:panel>
	<!-- </ui:define> -->
</ui:composition>
