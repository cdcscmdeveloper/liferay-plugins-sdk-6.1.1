<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.agency.details']}"  toggleable="true" id="flDetails">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
		<table style="width: 100%">
			<tr>
				<td style="width: 138px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="65" id="ministry" style="width: 416px;"
						value="#{contractRequestBackingBean.retrieveMinistryByOrgProfileId(contractRequestBackingBean.managedBean.flRequest.issuedOrgProfile.orgProfileId, contractRequestBackingBean.getTransactionDate(contractRequestBackingBean.managedBean.flRequest))}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td>
					<p:inputTextarea id="controlOff" rows="2" cols="67" disabled="true" autoResize="false" style="resize:none;" 
						value="#{contractRequestBackingBean.retrievePegawaiPengawalByOrgProfileId(contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgProfileId, contractRequestBackingBean.getTransactionDate(contractRequestBackingBean.managedBean.flRequest))}" />
				</td>
			</tr>
			<tr>

				</td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="width: 560px;">
					<p:inputTextarea id="preparedOrgProfileId" rows="2" cols="63" readonly="true" autoResize="false" style="resize:none;" 
						value="#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgCode} #{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgName}" />					
					<ac:lov id="preparedPtj" uiMode="link" 
						lovId="PM_ORG_PROFILE_FL" headerText="#{lbl['lbl.fl.prepared.for.ptj']}"
						saveObject="contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile"
						value="#{contractRequestBackingBean.managedBean.flRequest.preparedOrgProfile.orgName}"
						disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or contractRequestBackingBean.isApprover() or !bpmTasklistBackingBean.managedBean.claim}"

						postUpdateListener="contractRequestBackingBean.getAgAccount"
						conditionField="#{contractRequestBackingBean.getPreparedPTJCondition()}"
						tooltip="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"	>
					</ac:lov>

			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /> </td>
				<td>

						value="#{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.orgCode} #{contractRequestBackingBean.managedBean.flRequest.chargeOrgProfile.orgName}" />										
					<p:commandLink
						oncomplete="dlgChargedPtj.show();"
						action="#{contractRequestBackingBean.resetChargedPtjDetails}"
						update=":form:chargeOrgProfile,chargeResultPanel,dialogChargedPtj"
						disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						style="padding-left:10px">
						<p:graphicImage value="/css/images/design/search.png" />
					</p:commandLink> <ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.ptj']}" /></td>

			</tr>

	</p:panel>
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.bond.waiver.cr.creation']}" rendered="#{contractRequestBackingBean.isFlFulfilmentRequisitioner()}" escape="false"/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.bond.waiver.cr.approval']}" rendered="#{contractRequestBackingBean.isApprover()}" escape="false"/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}" escape="false"/>
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /><p:outputLabel
						value="*" styleClass="mandatory" /> </td>
				<td rowspan="3" style="width:380px"><p:inputTextarea cols="45" rows="4" id="title"
						onkeyup="limitTextArea(this,500);"
						onkeydown="limitTextArea(this,500);"
						autoResize="false"
						style=" margin-bottom:5px;" label="#{lbl['lbl.fl.title']}"
						disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						value="#{contractRequestBackingBean.managedBean.flRequest.title}" /> 						
						<ac:iconTooltip value="#{lbl['lbl.fl.cr.tooltip.title']}"/></td>
						<td><p:message for="title" display="icon" /></td>
				<td style="width: 134px;"><p:outputLabel
						value="#{lbl['lbl.fl.contract.type']}" /></td>
				<td><p:inputText size="25"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.contractType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.financialYear}" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.prepared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="30" disabled="true"
						value="#{contractRequestBackingBean.managedBean.flRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.procurementTypeCategory)}" /></td>
			</tr>
			<tr>
				<td style="width: 142px;"><p:outputLabel rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"
						value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td>
								<p:inputText size="12" style="text-align:right;"
									disabled="true" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"
									value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTerm}" />
							</td>
							<ui:remove>
							<td style="width: 211px;"><p:outputLabel styleClass="outputLabel-view" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"
									value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.latestContractVer.ctContractValue.deliveryTermUom)}" /></td>
							</ui:remove>
						</tr>
					</table></td>
				<td colspan="2"><p:outputLabel rendered="#{contractRequestBackingBean.managedBean.flRequest.submissionDate != null}"
						value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td>	
				<p:inputText size="25" disabled="true" rendered="#{contractRequestBackingBean.managedBean.flRequest.submissionDate != null}"
					value="#{contractRequestBackingBean.managedBean.flRequest.submissionDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pr.submission.date']}" rendered="#{contractRequestBackingBean.managedBean.flRequest.submissionDate != null}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.start']}" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"/></td>
				<td><p:calendar mode="popup" showOn="button" 
						disabled="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing or contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}" 
						readonlyInput="true"
						rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"
						value="#{contractRequestBackingBean.managedBean.flRequest.startDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{contractRequestBackingBean.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.fulfilment.type']}" /></td>
					<td><p:inputText size="25" disabled="true" 	value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.flRequest.ctContract.fulfillmentType)}">
					</p:inputText>
					</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.end']}" rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing =='false'}"/></td>
				<td><p:calendar mode="popup" showOn="button" id="delEndDate" 
						disabled="true" 
						readonlyInput="true"
						rendered="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing == 'false'}"
						mindate="#{contractRequestBackingBean.managedBean.flRequest.startDate}" 
						maxdate="#{contractRequestBackingBean.managedBean.maxDate}"
						value="#{contractRequestBackingBean.managedBean.flRequest.endDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"
							listener="#{contractRequestBackingBean.updateDeliveryEndDate}" />
					</p:calendar></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.factored.contract']}" /></td>
				<td><p:selectBooleanCheckbox disabled="true" style="vertical-align:-4px"
						value="#{contractRequestBackingBean.managedBean.flRequest.flFulfilmentOrder!=null ? 
						contractRequestBackingBean.managedBean.flRequest.flFulfilmentOrder.factored : 
						contractRequestBackingBean.managedBean.flRequest.ctContract.factored}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.factored']}"/></td>	
			</tr>
			<tr>
				<td></td>
				<td></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.zonal.price']}"  /></td>
				<td><p:selectBooleanCheckbox style="vertical-align:-4px"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.zonalPricing}"
						disabled="true" /><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ct.zonal.price']}" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.payment.match.mto']}" rendered="false"/></td>
				<td><p:selectBooleanCheckbox style="vertical-align:-4px"
						value="#{contractRequestBackingBean.managedBean.flRequest.ctContract.mto}"
						disabled="true" rendered="false"/></td>	
			</tr>
		</table>
		<table>
		<tr>
				<td><p:selectBooleanCheckbox
						disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
						value="#{contractRequestBackingBean.managedBean.declarationCheck}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><h:outputText style="text-align:left" value="#{lbl['lbl.fl.declaration']}"/></td>
		</tr>
	</table>
	</p:panel>

					</table></td>

						 /></td>

	</p:panel>

															contractRequestBackingBean.managedBean.contactEmail}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="25" value="#{contractRequestBackingBean.managedBean.flRequest.flFulfilmentOrder!=null ? 
															contractRequestBackingBean.managedBean.flRequest.flFulfilmentOrder.factoringAddress.contactPhoneNoFull :
															contractRequestBackingBean.managedBean.contactPhoneNo}"/></td>

	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">

			<tr>
				<td width="50%" valign="top"><ui:include

				<td width="50%" valign="top">

	<p:dialog id="dialogChargedPtj"  header="#{lbl['lbl.fl.add.charge.ptj']}" widgetVar="dlgChargedPtj" 
			styleClass="pop_up_top" modal="true" width="700" resizable="false" position="top">
			<p:messages id="chargePtjMsg" showSummary="false" showDetail="true"  autoUpdate="true" closable="true" severity="error, info" />
		   <h:panelGroup  id="chargedPtj">
		   	<p:panel id="chargePtjSearchPanel" header="#{lbl['lbl.fl.search']}" toggleable="true">
              <h:panelGrid columns="3">
                 <p:selectOneMenu for="chargeMinistry"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.fl.ministry']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="chargeMinistry" style="width:300px"
                      value="#{contractRequestBackingBean.managedBean.ministryProfileId}" >
            	   <f:selectItems value="#{contractRequestBackingBean.getMinistryDropdown()}"/>
            	   <p:ajax event="change" update=":form:jabatan" />
                 </p:selectOneMenu>
                 <p:selectOneMenu for="jabatan"  style="width:150px" disabled="true" >
            	    <f:selectItem itemLabel="#{lbl['lbl.fl.jabatan']}" itemValue=""/>
                 </p:selectOneMenu>
                 <p:spacer height="1"/>
                 <p:selectOneMenu id="jabatan" style="width:300px"
                      value="#{contractRequestBackingBean.managedBean.jabatanProfileId}" >
            	   <f:selectItems value="#{contractRequestBackingBean.getJabatanDropdown()}"/>
            	    <p:ajax event="change" update=":form:jabatan"/>
                 </p:selectOneMenu>
                 <p:selectOneMenu for="ptjcodename" 
                    value="#{contractRequestBackingBean.managedBean.ptjCodeName}"  style="width:150px;">
                       <f:selectItem itemLabel="#{lbl['lbl.fl.ptj.code']}" itemValue="#{CtConst.ptjCode}"/>
            	      <f:selectItem itemLabel="#{lbl['lbl.fl.ptj.name']}" itemValue="#{CtConst.ptjName}"/>
            	      <p:ajax process="@this"/>
                 </p:selectOneMenu>
				 <p:spacer height="1"/>
                 <p:inputText id="ptjCodeVaue"  style="width:300px;" 
                     value="#{contractRequestBackingBean.managedBean.ptjCodeNameSearchValues}" >
                     <p:ajax process="@this"/></p:inputText>
			  </h:panelGrid>
			  </p:panel>
			  	<div class="ppRightBtn">
       		         
       		         <p:commandButton id="chargePtjSearchId" value="#{lbl['lbl.btn.search']}" update=":form:tableChargePtj"  
       		            action="#{contractRequestBackingBean.searchChargedPtjDetails}" process="@this" /> 
			         <p:commandButton id="resetlBtn" value="#{lbl['lbl.btn.reset']}" process="@this"
			            action="#{contractRequestBackingBean.resetChargedPtjDetails}" update=":form:chargedPtj"   />
		       </div>
			  <p:panel id="chargeResultPanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
              <p:dataTable id="tableChargePtj" var="pmVar" value="#{contractRequestBackingBean.chargedPtjDataModel}" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
                 rowIndexVar="rowIndex" selection="#{contractRequestBackingBean.selectedPmOrgProfile}" rowKey="#{pmVar}" lazy="true" rows="10">
               <p:ajax event="rowSelectRadio" update=":form:chargePtjSelectBtn" ></p:ajax>
                  <ac:paginator for="tableChargePtj"/>
                    <p:column selectionMode="single" style="width:18px;"> 
                         <f:facet name="header">
		               </f:facet>
                    </p:column>       
                    <p:column headerText="#{lbl['lbl.fl.ptj.code']}" >
                       	#{pmVar.orgCode}
					</p:column>
                    <p:column headerText="#{lbl['lbl.fl.ptj.name']}" >
                      	#{pmVar.orgName}
					</p:column>
			 </p:dataTable>
			 </p:panel>           
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.select']}" process="@form"  update=":form:chargeOrgProfile" id="chargePtjSelectBtn"
					disabled="#{fn:length(contractRequestBackingBean.chargedPtjDataModel.list) == 0 }"
				    action="#{contractRequestBackingBean.addChargedPtjDetails()}" onclick="dlgChargedPtj.hide();"/>
				    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="dlgChargedPtj.hide();" />
           </div>
           </h:panelGroup>
	</p:dialog>
</ui:composition>
