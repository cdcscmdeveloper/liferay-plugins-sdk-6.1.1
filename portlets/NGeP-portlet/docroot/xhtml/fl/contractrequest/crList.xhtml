<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:dataTable id="contractListTable" var="data" lazy="true"
			value="#{contractRequestBackingBean.managedBean.activeContractList}">
			<ac:paginator for="contractListTable" />
			<p:column headerText="Contract No.">
				<h:outputText value="#{data.contractNo}" />
			</p:column>
			<p:column headerText="Circular No.">
				<h:outputText value="#{data.circularNo}" />
			</p:column>
			<p:column headerText="Contract Type">
				<h:outputText value="#{contractRequestBackingBean.getParameterDesc(data.contractType)}" />
			</p:column>
			<p:column headerText="Fulfilment Type">
				<h:outputText value="#{contractRequestBackingBean.getParameterDesc(data.fulfilmentType)}" />
			</p:column>
			<p:column headerText="Supplier Name">
				<h:outputText value="#{data.supplierName}">
					<f:convertDateTime type="date" pattern="MMM-yyyy" />
				</h:outputText>
			</p:column>
			<p:column headerText="Start Effective">
				<h:outputText value="#{data.startEffective}">
					<f:convertDateTime type="date" pattern="MMM-yyyy" />
				</h:outputText>
			</p:column>
			<p:column headerText="End Effective">
				<h:outputText value="#{data.endEffective}" />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink id="crBasepageLink"
					onclick="procure([{name:'contractId',value:'#{data.contract.contractId}'}])">
					<p:graphicImage library="ep/images/design" name="revise.png"
						value="/resources/ep/images/design/revise.png"
						title="Contract Request" />
				</p:commandLink>

			</p:column>
		</p:dataTable>
		<p:remoteCommand name="procure" action="#{contractRequestBackingBean.procureContract}" />
	</ui:define>
</ui:composition>
