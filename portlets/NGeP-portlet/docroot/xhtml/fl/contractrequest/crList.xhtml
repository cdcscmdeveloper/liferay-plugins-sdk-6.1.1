<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<style>
			div[id$="ctSubListTree"] thead {
    			display:none;
			}
			
			.ui-datatable.ctlisttree thead th,
			.ui-datatable.ctlisttree tbody,
			.ui-datatable.ctlisttree tbody tr,
			.ui-datatable.ctlisttree tbody td {
				padding:4px;
			}
			
			
			tr.ui-expanded-row-content.ui-widget-content td[colspan="10"]:first-child{
    			padding: 0px;
    			border-top: 0 !important;
    			border-right: 0 !important;    			
			}
				
			.ui-datatable.borderless thead th,
			.ui-datatable.borderless tbody,
			.ui-datatable.borderless tbody tr,
			.ui-datatable.borderless tbody td {
    			border-style: none;
    			padding:4px;
			}
			.ui-datatable.borderless table{
				border:0 !important;
				border-collapse:collapse !important;
			}
			
			.borderless.ui-datatable .ui-datatable-tablewrapper {
			    overflow:hidden !important;
			    padding:0px !important;
			}
			
			.ui-datatable.borderless.ui-datatable-resizable{
				padding:0px;
			}
			
			.ui-row-toggler{
				margin-left:auto !important;
				margin-right:auto !important;
			}
			
			tr.ui-widget-content.ui-datatable-odd.ui-expanded-row ~ tr.ui-expanded-row-content.ui-widget-content td{
				background-color:#F9F9F9 !important;
			}
			
			tr.ui-widget-content.ui-datatable-even.ui-expanded-row ~ tr.ui-expanded-row-content.ui-widget-content td{
				background-color:white !important;
			}
			
			@-moz-document url-prefix() {
				tr.ui-expanded-row-content.ui-widget-content td[colspan="10"]:first-child{
	    			padding: 0px;
	    			border-top: 0 !important;
	    			border-right: 0 !important;  
	    			border-bottom : 0 !important;
    			}
			}
			
			@media screen and (-ms-high-contrast: active), (-ms-high-contrast: none) { 
    			.ui-datatable.borderless tbody td:last-child {
	    			border-right: 0 !important;
				}
				.ui-datatable.borderless tbody tr:last-child td {
	    			border-bottom: 0 !important;
				}
				.ui-datatable table{
					width:auto; !important;
				}
			}
		</style>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.tooltip.active.contract.mof']}"/>
		<p:dataTable id="ctListTree" var="contractTreeNode" rows="10"  resizableColumns="true" styleClass="ctlisttree"
			value="#{contractRequestBackingBean.managedBean.contractListTable}">
			<ac:paginator for="ctListTree" />
			 <p:column style="width:25px">
            	<p:rowToggler rendered="#{not empty contractTreeNode.activeContractSubList}" />
        	</p:column>
			<p:column headerText="#{lbl['lbl.fl.contract.no']}" style="width:142px">
					<p:commandLink value="#{contractTreeNode.contractNo}" 
				action="#{contractRequestBackingBean.navigateDocument(contractTreeNode.contractId)}"/>
				
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.contract.name']}" style="width:142px;white-space:normal">
				<h:outputText
					value="#{contractTreeNode.contractName}" />
			</p:column>
			<p:column style="width:150px;">
				<f:facet name="header" style="width:200px;white-space:normal">
					<h:outputText value="#{lbl['lbl.fl.fs.no']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.crlist.phase.no']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{contractTreeNode.scheduleNo == null ? contractTreeNode.phaseNo : contractTreeNode.scheduleNo}">
				</h:outputText>			
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.physical.treasury.circular']}" style="width:100px;white-space:normal">
				<h:outputText value="#{contractTreeNode.circularNo}" />
			</p:column>
			<p:column>
				<f:facet name="header" style="width:85px">
					<h:outputText value="#{lbl['lbl.fl.period.start']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.crlist.period.start']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{contractTreeNode.startEffective}">
					<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>			
			</p:column>
			<p:column>
				<f:facet name="header" style="width:85px">
					<h:outputText value="#{lbl['lbl.fl.period.end']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.crlist.period.end']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{contractTreeNode.endEffective}">
					<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>			
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.fulfilment.type']}" style="width:108px;white-space:normal">
				<h:outputText value="#{contractRequestBackingBean.getParameterDesc(contractTreeNode.fulfilmentType)}" >
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.contract.type']}" style="width:99px">
				<h:outputText value="#{contractRequestBackingBean.getParameterDesc(contractTreeNode.contractType)}" >
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.supp.name']}" style="width:98px;white-space:normal">
				<h:outputText value="#{contractTreeNode.supplierName}" >
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.fl.doc.maintain.action.no']}" style="width:58px;text-align:center">
				<p:commandLink id="crBasepageLink" rendered="#{contractTreeNode.fulfilmentType.parameterCode ne ParameterConst.fulfilmentTypeScheduled}"
					onclick="procure([{name:'contractId',value:'#{contractTreeNode.contractId}'},{name:'scheduleNo',value:'#{contractTreeNode.scheduleNo == null ? contractTreeNode.phaseNo : contractTreeNode.scheduleNo}'}])">
					<p:graphicImage value="/css/images/design/revise.png"
						title="Contract Request" />
				</p:commandLink>
			</p:column>
			
			<p:rowExpansion>
			
				<p:dataTable id="ctSubListTree" var="contractExpansion" styleClass="borderless"
					value="#{contractTreeNode.activeContractSubList}"  resizableColumns="true">
					<p:column style="width:25px">
					</p:column>
					<p:column style="width:142px">
					</p:column>
					<p:column style="width:142px">
					</p:column>
					<p:column style="width:70px;text-align:center">
						<h:outputText value="#{contractExpansion.scheduleNo == null ? contractExpansion.phaseNo : contractExpansion.scheduleNo}" />
					</p:column>
					<p:column style="width:100px">
					</p:column>
					<p:column style="width:97px;">
						<h:outputText value="#{contractExpansion.startEffective}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column style="width:91px;">
						<h:outputText value="#{contractExpansion.endEffective}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column style="width:108px">
					</p:column>
					<p:column style="width:99px">
					</p:column>
				
					<p:column style="width:98px">
					</p:column>
					<p:column style="width:58px;text-align:center">
						<p:commandLink id="crBasepageLink" 
							onclick="procure([{name:'contractId',value:'#{contractExpansion.contractId}'},{name:'scheduleNo',value:'#{contractExpansion.scheduleNo == null ? contractExpansion.phaseNo : contractExpansion.scheduleNo}'}])">
							<p:graphicImage value="/css/images/design/revise.png"
								title="#{lbl['lbl.fl.contract.request']}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>

		</p:dataTable>
		
		<p:remoteCommand name="procure" action="#{contractRequestBackingBean.procureContract}" />
	</ui:define>
</ui:composition>
