<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Search" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td>
					<p:tabView style="width: 70%;" id="searchTabId">
						<p:tab id="tab1" title="Search">
							<table style="width: 100%; margin-top: 10px;">
								<tr>
									<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" /></td>
									<td>
										<p:inputText size="50" value="#{catalogueBackingBean.managedBean.itemName}" />
									</td>
								</tr>
							</table>
							<div style="text-align: right;">
								<p:commandButton value="Search" 
									action="#{catalogueBackingBean.searchCatalogue}"
									update=":form:tabView:supplierItemID" />
							</div>
						</p:tab>
						<p:tab id="tab2" title="Advance Search">
							<table style="margin-top: 10px;">
								<tr>
									<td style="padding-left: 64px;">
										<p:outputLabel value="#{lbl['lbl.cm.item.name']}" />
									</td>
									<td>
										<p:inputText size="50" value="#{catalogueBackingBean.managedBean.itemName}" />
									</td>
								</tr>
							</table>
							<ui:repeat var="search" value="#{catalogueBackingBean.managedBean.advanceSearchList}">
								<h:panelGrid columns="2" columnClasses="cmPadding5">
									<p:selectOneMenu value="#{search.name}">
										<f:selectItems
											value="#{catalogueBackingBean.managedBean.searchCriteria}" />
									</p:selectOneMenu>
									<p:inputText size="50" value="#{search.value}" />
								</h:panelGrid>
							</ui:repeat>
							<div style="text-align: right;">
								<p:commandButton value="Search" 
									action="#{catalogueBackingBean.searchCatalogue}"
									update=":form:tabView:supplierItemID" />
							</div>
						</p:tab>
					</p:tabView>
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel style="width: 100%;" header="SEARCH RESULTS" toggleable="true">
		<p:dataGrid	value="#{catalogueBackingBean.managedBean.supplierItemList}"
			id="supplierItemID" var="supplierItem" rowIndexVar="rowIndex"
			width="70%" columns="1">
			<div style="border-bottom: 1px solid #EEE;">
				<table style="width: 100%;">
					<tr>
						<td width="80%">
							<table style="width: 100%;">
								<tr>
									<td rowspan="4" style="width: 20%;"><p:graphicImage
											value="/resources/ep/images/product/computer/879949914_125.jpg"
											height="80" width="80" /></td>
									<td style="font-weight: bold; width: 15%;"><p:outputLabel
											value="Item Name:"></p:outputLabel></td>
									<td><p:commandLink
											value="#{supplierItem.cmItem.itemName}"
											action="#{catalogueBackingBean.navigateToSupplierItemDet(rowIndex)}" /></td>
									<td></td>
									<td></td>
								</tr>
								<tr>
									<td style="font-weight: bold; width: 15%;"><p:outputLabel
											value="Supplier:"></p:outputLabel></td>
									<td>ABC SDN BHD</td>
								</tr>
							</table>
						</td>
						<td width="20%"
							style="background-color: #EEEEEE; padding-left: 5px;">
							<table>
								<tr>
									<td style="font-weight: bold !important; border-bottom: 1px solid"><p:outputLabel> Price
										(MYR)</p:outputLabel></td>
									<td rowspan="2" style="padding-left: 6px;width: 20%;"><p:commandLink
											action="#{catalogueBackingBean.addToCart}"
											update=":form:tabView:supplierItemViewID">
											<p:graphicImage
												value="/resources/ep/images/design/cart_add.png"></p:graphicImage>
										</p:commandLink></td>
								</tr>
								<tr>
									<td><p:outputLabel style="font-size: 14px;" value="1000.00"></p:outputLabel></td>
									<td></td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</div>
		</p:dataGrid>

	</p:panel>	

</ui:composition>
