<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<f:event listener="#{contractRequestBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error,info"></p:messages>

		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="Back" immediate="true"
						icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction"
						value="#{contractRequestBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}"
							action="#{contractRequestBackingBean.submitAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 100%">
			<tr>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{contractRequestBackingBean.submitAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{contractRequestBackingBean.submitAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<ui:include src="/xhtml/fl/contractrequest/crHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu styleClass="sidemenu"
						style="display : table-caption;"
						activeIndex="#{contractRequestBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="Delivery Address and Item" update="@form"
							actionListener="#{contractRequestBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="Order Summary" update="@form">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
						<p:menuitem value="Charge Line Summary" update="@form"
							actionListener="#{contractRequestBackingBean.onTabChange(3)}">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="3" />
						</p:menuitem>
						<p:menuitem value="Approval Setting" update="@form"
							>
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="4" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="crGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="crItem.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="crOrdersummary.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="crChargeline.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 4}">
						<p:panel id="settingId" header="Approver Setting"
							toggleable="true" toggleSpeed="500">

							<h:panelGrid columns="1">
								<h:panelGrid columns="2">
									<h:outputLabel value="Approver Group" />
									<p:selectOneMenu
										value="#{contractRequestBackingBean.managedBean.flRequest.pmUserGroup.userGroupId}"
										style="width:340px;">
										<p:ajax event="change"
											listener="#{contractRequestBackingBean.userGroupChangeListener()}"
											process="@this" update="approverpickList" />
										<f:selectItems
											value="#{contractRequestBackingBean.getUserGroupDropdown()}" />
									</p:selectOneMenu>
								</h:panelGrid>
								<p:spacer height="1" />
								<h:panelGrid style="width:500px">
									<p:pickList id="approverpickList"
										value="#{contractRequestBackingBean.managedBean.approverModel}"
										var="data" itemValue="#{data}" itemLabel="#{data}"
										showTargetControls="true" filterMatchMode="contains">
										<f:facet name="sourceCaption">Available</f:facet>
										<f:facet name="targetCaption">Selected</f:facet>
										<p:column style="width:75%;">
											<h:outputText value="#{data}" />
										</p:column>
									</p:pickList>
								</h:panelGrid>
							</h:panelGrid>
						</p:panel>
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
