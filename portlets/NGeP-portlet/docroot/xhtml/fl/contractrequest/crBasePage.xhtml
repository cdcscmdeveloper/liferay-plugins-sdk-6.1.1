<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<style>
			.gfmasPanelCss>.ui-panel-content {
				background: #f2dede !important;
			}
		</style>	
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<ac:gpkiPopup 
			textBeforeSign="#{contractRequestBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{contractRequestBackingBean.preSubmitFulfillmentRequest(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{contractRequestBackingBean.enableAutoUpdate()}" />		
		<f:event listener="#{contractRequestBackingBean.preRenderView}"	type="preRenderView" />		
		<c:if test="#{contractRequestBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView or contractRequestBackingBean.managedBean.isHyperLinkPage()}">
			<ac:title value="#{contractRequestBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, ParameterConst.doctypeContractRequest)}" />
		</c:if>			
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="#{contractRequestBackingBean.managedBean.autoUpdate}" closable="true" severity="error,info" />
		<p:panel style="background:#f2dede !important; border:0px;" styleClass="gfmasPanelCss" rendered="#{contractRequestBackingBean.managedBean.gfmasError}" >		
			<table>
				<tr>
					<td>
						<p:commandLink oncomplete="gfmasError.show();" immediate="true"
							action="#{contractRequestBackingBean.show1GFMASError()}"
							rendered="#{contractRequestBackingBean.managedBean.gfmasError}">
							<p:graphicImage value="/css/images/design/exclamation.png" />
						</p:commandLink>
						<p:spacer width="2" />
					</td>
					<td>
						<p:outputLabel value="#{contractRequestBackingBean.managedBean.gfmasErrorDesc} #{lbl['lbl.fl.integration.click.for.exception.details']} (ERR-#{contractRequestBackingBean.managedBean.gfmasErrorCode})" style="color: #C55751 !important; font-weight: normal !important"
							rendered="#{contractRequestBackingBean.managedBean.gfmasError}" />
					</td>					
				</tr>
			</table>
		</p:panel>			
		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" rendered="#{contractRequestBackingBean.managedBean.buttonVal != null}" 
						action="#{contractRequestBackingBean.backToPervious}" /></td>
				<td colspan="4" style="text-align: right">
					<c:if test='#{contractRequestBackingBean.managedBean.buttonVal ne BpmOutcomeConstant.bpmView}'>
						<ui:decorate template="/xhtml/fl/shared/claim_template.xhtml">
							<ui:define name="outComeSection">
								<ui:repeat
								var="bpmAction" value="#{contractRequestBackingBean.managedBean.outComes}">	
								<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
								<p:commandButton value="#{lbl[buttonLabel]}"
									styleClass="ui-button" 
									update="@form" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
									action="#{contractRequestBackingBean.gpkiSignAction(bpmAction)}" />
								</ui:repeat>
							</ui:define>
						</ui:decorate>
					</c:if>				
				</td>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView and !contractRequestBackingBean.managedBean.isHyperLinkPage()}'>
					<td colspan="4" style="text-align: right">	
					<p:commandLink
						value="#{lbl['lbl.td.doc.trackingDiary']}"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(contractRequestBackingBean.managedBean.flRequest.docType,contractRequestBackingBean.managedBean.flRequest.fulfilmentReqId)}"
						immediate="true" />
					</td>		
				</c:if>	
			</tr>
		</table>
		<ui:include src="/xhtml/fl/contractrequest/crHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu"
						activeIndex="#{contractRequestBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.delivery.address.item']}" update="@form"
							actionListener="#{contractRequestBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.order.summary']}" update="@form"
							actionListener="#{contractRequestBackingBean.onTabChange(3)}" >
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.summary']}" update="@form"
							actionListener="#{contractRequestBackingBean.onTabChange(3)}">
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="3" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.approver.list']}" update="@form" actionListener="#{contractRequestBackingBean.onTabChange(4)}"
						rendered="#{contractRequestBackingBean.isFlFulfilmentRequisitioner()}"
							>
							<f:setPropertyActionListener
								target="#{contractRequestBackingBean.managedBean.selectedTabIndex}"
								value="4" />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%" valign="top">
					<p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="crGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="crItem.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="crOrdersummary.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="crChargeline.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{contractRequestBackingBean.managedBean.selectedTabIndex == 4}">
						<p:panel id="settingId" header="#{lbl['lbl.fl.ptj.approver.details']}"
							toggleable="true" toggleSpeed="500">

							<h:panelGrid columns="1">
								<h:panelGrid columns="2">
									<h:outputLabel value="#{lbl['lbl.fl.ptj.approver.group']}" />
									<p:selectOneMenu
										disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
										value="#{contractRequestBackingBean.managedBean.flRequest.pmUserGroup.userGroupId}"
										style="width:450px;">
										<p:ajax event="change"
											listener="#{contractRequestBackingBean.userGroupChangeListener()}"
											process="@this" update="approverDropdown" />
										<f:selectItems
											value="#{contractRequestBackingBean.getUserGroupDropdown()}" />
									</p:selectOneMenu>
								</h:panelGrid>
								<h:panelGrid columns="2">
									<h:outputLabel value="#{lbl['lbl.rpt.approverName']}" />
									<p:selectOneMenu id="approverDropdown"
										disabled="#{contractRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or !bpmTasklistBackingBean.managedBean.claim}"
										value="#{contractRequestBackingBean.managedBean.selectedApprover}"
										style="width:450px;">
										<f:selectItems
											value="#{contractRequestBackingBean.getApproverListDropDown()}" />
									</p:selectOneMenu>
								</h:panelGrid>
							</h:panelGrid>
						</p:panel>
					</p:outputPanel></td>
			</tr>
		</table>
		<p:dialog id="gfmasErrorDlg" header="#{lbl['lbl.fl.integration.exception.details']}" widgetVar="gfmasError" width="80%"
			showEffect="fade" hideEffect="fade" modal="true" resizable="false">
			<table style="width: 100%">
				<tr>
					<td><p:messages id="gfmasMsg" showSummary="false" escape="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" /></td>
				</tr>
			</table>
			<p:spacer height="2px"></p:spacer>
			<div style="width: 100%; text-align: right">
				<p:commandButton value="#{lbl['lbl.btn.close']}" oncomplete="gfmasError.hide();" />
			</div>
		</p:dialog>					
		<p:confirmDialog message="#{lbl['lbl.fl.confirmation.cancel.dialogue']}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					partialSubmit="true" 
					action="#{contractRequestBackingBean.submitAction(BpmOutcomeConstant.bpmCancel)}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					partialSubmit="true"
					onclick="cancelConfirmDlg.hide();" />
			</div>
		</p:confirmDialog>	
		<ac:lovPopup />
	</ui:define>
</ui:composition>
