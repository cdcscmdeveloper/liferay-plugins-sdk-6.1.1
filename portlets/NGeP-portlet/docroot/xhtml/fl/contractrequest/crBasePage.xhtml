<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<f:event listener="#{contractRequestBackingBean.preRenderView}" type="preRenderView" />	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error,info"></p:messages>
		<table style="width:100%">
			<tr>
				<td>
				<h:outputText
						value="Document Number: " />
				<h:outputText
						value="#{contractRequestBackingBean.managedBean.flRequest.docNo}" />
				</td>
			</tr>
			
			<tr>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction"
						value="#{contractRequestBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}"
							action="#{contractRequestBackingBean.submitAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width:100%">
			<tr>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right">
							<p:commandButton value="UPDATE"
								action="#{contractRequestBackingBean.submitAction('UPDATE')}">
								<f:param name="actionName" value="UPDATE" />
							</p:commandButton>
					</td>
				</c:if>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right">
							<p:commandButton value="CANCEL"
								action="#{contractRequestBackingBean.submitAction('CANCEL')}">
								<f:param name="actionName" value="CANCEL" />
							</p:commandButton>
						</td>
				</c:if>
			</tr>
		</table>
		<p:tabView id="cotabs" orientation="left" dynamic="true" cache="true">
			<p:tab id="tab1" title="#{lbl['lbl.tab.fl.general']}">
				<ui:include src="crGeneral.xhtml" />
			</p:tab>
			<p:tab id="tab2" title="#{lbl['lbl.tab.fl.item']}">
					<ui:include src="crItem.xhtml" /> 
			</p:tab>
			<p:tab id="tab3" title="Approver Settings" rendered="#{contractRequestBackingBean.isRequisitioner()}">
				<p:panel id="settingId" header="Approver Setting" toggleable="true"
					toggleSpeed="500">
					<h:panelGrid columns="1">
						<h:panelGrid style="width:500px">
							<p:pickList id="approverpickList"
								value="#{contractRequestBackingBean.managedBean.approverModel}"
								var="data" itemValue="#{data}" itemLabel="#{data}"
								showTargetControls="true" filterMatchMode="contains">
								<f:facet name="sourceCaption">Available</f:facet>
								<f:facet name="targetCaption">Selected</f:facet>
								<p:column style="width:75%;">
									<h:outputText value="#{data}" />
								</p:column>
							</p:pickList>
						</h:panelGrid>
					</h:panelGrid>
				</p:panel>
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
