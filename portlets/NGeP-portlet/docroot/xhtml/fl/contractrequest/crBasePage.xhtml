<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<table style="width:100%">
			<tr>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction"
						value="#{contractRequestBackingBean.managedBean.actions}">
						<p:commandButton value="#{bpmAction}"
							action="#{contractRequestBackingBean.submitAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 800px;">
			<tr>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4">
						<div align="right">
							<p:commandButton value="UPDATE"
								action="#{contractRequestBackingBean.submitAction('UPDATE')}">
								<f:param name="actionName" value="UPDATE" />
							</p:commandButton>
						</div>
					</td>
				</c:if>
				<c:if
					test='#{contractRequestBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" align="right"><div align="right">
							<p:commandButton value="CANCEL"
								action="#{contractRequestBackingBean.submitAction('CANCEL')}">
								<f:param name="actionName" value="CANCEL" />
							</p:commandButton>
						</div></td>
				</c:if>
			</tr>
		</table>
		<p:tabView id="cotabs" orientation="left" dynamic="true" cache="false">
			<p:tab id="tab1" title="#{lbl['lbl.tab.fl.general']}">
				<ui:include src="crGeneral.xhtml" />
			</p:tab>
			<p:tab id="tab2" title="#{lbl['lbl.tab.fl.item']}">
					<ui:include src="crItem.xhtml" /> 
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
