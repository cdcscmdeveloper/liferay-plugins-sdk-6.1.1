<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" 
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
			<td class="TableFieldRight">
				<p:dataGrid value="#{fulfilmentBackingBean.managedBean.remarkList}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" styleClass="noBorder">
					<table>
						<tr>
							<td rowspan="2" valign="top">
								<h:graphicImage value="#{fulfilmentBackingBean.userImagePath(remarkVar.userId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td width="210px">
								<h:outputText value="#{remarkVar.createdUsername}"></h:outputText>,
								<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
									<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea cols="40" 
									value="#{remarkVar.remark}" rendered="#{remarkIndex==0 and !fulfilmentBackingBean.managedBean.isHideRemarks()}"
									disabled="#{!bpmTasklistBackingBean.managedBean.claim}"
									autoResize="false"
									onkeyup="limitTextArea(this,1000);"
									onkeydown="limitTextArea(this,1000);">
									<p:ajax event="blur" process="@this" />
								</p:inputTextarea> 
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0 or fulfilmentBackingBean.managedBean.isHideRemarks()}" style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
							<td>
								<h:panelGroup rendered="#{remarkIndex==0 and !fulfilmentBackingBean.managedBean.isHideRemarks()}">
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.remarks']}"/> 
								</h:panelGroup>
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>    				

</ui:composition>
