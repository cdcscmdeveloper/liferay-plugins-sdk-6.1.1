<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>

	<p:panel header="#{lbl['lbl.fl.menu.items']}" toggleable="true" id="itemPnl">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.frn.item']}" escape="false"/>
		<br />
		<div id="flDataTableScroll">	
		<p:dataTable id="frnItemDt" var="item" 
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flFulfilmentNoteItem}"
			selection="#{receivedNoteBackingBean.managedBean.selectedItem}"
			rowIndexVar="index" selectionMode="single" rowKey="#{item}" >
			<p:ajax event="rowSelect" update=":form:selectedItemSection" />
			<ac:paginator for="itemDataTable" />
			<p:column>
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.item.code']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
    				</f:facet>
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.itemCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.gstAmount}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.gstUnitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.ordered.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.order.qty']}"/>
    				</f:facet>
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column >
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}"  style="white-space:normal;text-align:right;">
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedAmt}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>			
			<p:column  style="white-space:normal;text-align:right;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.do.delivery.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.del.qty']}"/>
    				</f:facet>
				<h:outputText styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredQty}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.amount']}" style="white-space:normal;text-align:right;">
				<h:panelGroup id="delAmountTxt">
					<h:outputText  styleClass="colFloatRight" value="#{item.flDelOrderItem.deliveredAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column style="white-space:normal;text-align:right;">
				<f:facet name="header" >
    				<h:outputText value="#{lbl['lbl.fl.frn.remaining.qty']}"/>
     				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.remain.qty']}"/>
    			</f:facet>			
				<h:outputText  styleClass="colFloatRight" 
					rendered="#{receivedNoteBackingBean.managedBean.isAcknowledged() eq 'true'}" value="#{item.flDelOrderItem.flFulfilmentItemAddr.orderedQty-item.receivedQty}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>			
			<p:column style="white-space:normal;text-align:right;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.received.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
				<h:outputText id="receivedQty" styleClass="colFloatRight" value="#{item.receivedQty}" >	
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column  style="white-space:normal;text-align:right;">
				<f:facet name="header">
							<h:outputText value="#{lbl['lbl.fl.received.amount']}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.del.amt']}" />
						</f:facet>
				<h:outputText id="receivedAmt" value="#{item.receivedAmt}" styleClass="colFloatRight">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		</div>
		<p:spacer height="50"/>
		<h:panelGroup styleClass="selectedItemSection" id="selectedItemSection">
			<table>
				<tr>
					<td valign="top"><p:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
					<td>
						<p:inputTextarea cols="40" maxlength="200" value="#{receivedNoteBackingBean.managedBean.selectedItem.rejectionRemark}" disabled="true">
							<p:ajax process="@this" />
						</p:inputTextarea><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.frn.item.remarks']}"/>
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
</ui:composition>
