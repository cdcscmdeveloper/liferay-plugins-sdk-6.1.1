<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>

	<p:panel header="#{lbl['lbl.fl.menu.items']}" toggleable="true" id="itemPnl">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.frn.item']}" escape="false"/>
		<br />
		<div id="flDataTableScroll">	
		<p:dataTable id="frnItemDt" var="item" 
			value="#{receivedNoteBackingBean.managedBean.fulfilmentNote.flFulfilmentNoteItem}"
			selection="#{receivedNoteBackingBean.managedBean.selectedItem}"
			rowIndexVar="index" selectionMode="single" rowKey="#{item}" >
			<p:ajax event="rowSelect" update=":form:selectedItemSection" />
			<ac:paginator for="itemDataTable" />
			<p:column style="text-align:center;">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.item.code']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
    				</f:facet>
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.itemCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center;">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemName}" id="itemDesc" style="float:left;"/>
				<p:tooltip for="itemDesc" value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.itemDesc}"  />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}" style="text-align:center;">
				<h:outputText value="#{item.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomName}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:center;">
				<h:outputText style="float:right;" value="#{item.flDelOrderItem.flFulfilmentItemAddr.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:center;">
				<h:outputText style="float:right;" value="#{item.flDelOrderItem.flFulfilmentItemAddr.gstAmount}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:center;">
				<h:outputText style="float:right;" value="#{item.flDelOrderItem.flFulfilmentItemAddr.gstUnitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
		</p:dataTable>
		</div>
		<p:spacer height="20"/>
		<h:panelGroup styleClass="selectedItemSection" id="selectedItemSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.ordered.qty']}" /></td>
					<td><p:inputText style="text-align:right;" styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.orderedQty}"
							size="15" disabled="true" /></td>
					<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.order.qty']}"/></td>		
					<td><p:outputLabel value="#{lbl['lbl.fl.ordered.amount']}" /></td>
					<td><p:inputText style="text-align:right;" styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.orderedAmt}"
							size="15" disabled="true">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.do.delivery.qty']}" /></td>
					<td><p:inputText style="text-align:right;" styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.deliveredQty}"
							size="15" disabled="true" /></td>
					<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.del.qty']}" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.delivery.amount']}" /></td>
					<td><p:inputText style="text-align:right;" styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.deliveredAmt}"
							size="15" disabled="true">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>		
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.frn.remaining.qty']}" /></td>
					<td><p:inputText id="remaingQtyTxt" styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.remainingQty}"
							size="15" disabled="true" style="text-align:right;" /></td>
					<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.remain.qty']}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.total.received.qty']}" /></td>
					<td><p:inputText styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.totalReceivedQty}"
							size="15" disabled="true" style="text-align:right;" /></td>
					<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.total.received.qty']}"/></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.total.received.amt']}" /></td>
					<td><p:inputText style="text-align:right;" styleClass="colFloatRight"
							value="#{receivedNoteBackingBean.managedBean.totalReceivedAmt}"
							size="15" disabled="true">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
				<tr>
					
					<td><p:outputLabel value="#{lbl['lbl.fl.received.qty']}" /></td>

					<td><p:inputText id="receivedQty"
							label="#{lbl['lbl.fl.received.qty']}" style="text-align:right;"
							styleClass="colFloatRight" value="#{receivedNoteBackingBean.managedBean.selectedItem.receivedQty}" 
							maxlength="14" size="15"
							disabled="true">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern"
								value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, receivedNoteBackingBean.managedBean.selectedItem.flDelOrderItem.flFulfilmentItemAddr.scRequestItem.uom.uomCode)}" />
						</p:inputText> </td>
					<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/></td>	
					<td><p:outputLabel value="#{lbl['lbl.fl.received.amount']}" /></td>
					<td><p:inputText size="15" style="text-align:right;" styleClass="colFloatRight"
							id="receivedAmtVal"
							label="#{lbl['lbl.fl.received.amount']}"
							disabled="true"
							value="#{receivedNoteBackingBean.managedBean.selectedItem.receivedAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText> 
					</td>
				</tr>
				
			</table>
			<p:spacer height="30"/>	
			<table>
				<tr>
					<td valign="top" style="width:132px;"><p:outputLabel value="#{lbl['lbl.txt.remarks']}" /></td>
					<td>
						<p:inputTextarea cols="40" maxlength="200" value="#{receivedNoteBackingBean.managedBean.selectedItem.rejectionRemark}" disabled="true">
							<p:ajax process="@this" />
						</p:inputTextarea><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.frn.item.remarks']}"/>
					</td>
				</tr>
			</table>
		</h:panelGroup>	
	</p:panel>
</ui:composition>
