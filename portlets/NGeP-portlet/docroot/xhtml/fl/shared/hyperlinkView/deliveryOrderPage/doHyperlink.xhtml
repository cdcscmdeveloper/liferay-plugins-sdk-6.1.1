<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<script>
			$('#portlet_flDeliveryOrder_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{createDOBackingBean.getPortletTitle()}');
		</script>
		<f:event listener="#{createDOBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="#{createDOBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" rendered="#{createDOBackingBean.managedBean.taskId==null}" 
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						action="#{createDOBackingBean.backAction}" /></td>
			</tr>
		</table>
		<ui:include src="dohHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{createDOBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.do.delivery.items']}" update="@form" actionListener="#{createDOBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{createDOBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
					</p:tabMenu></td>
				<h:panelGroup id="do" >
					<td width="80%"><p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="dohGeneral.xhtml" />
						</p:outputPanel> <p:outputPanel
							rendered="#{createDOBackingBean.managedBean.selectedTabIndex == 1}">
							<ui:include src="dohItem.xhtml" />
						</p:outputPanel></td>
				</h:panelGroup>
			</tr>
		</table>
	</ui:define>
</ui:composition>
