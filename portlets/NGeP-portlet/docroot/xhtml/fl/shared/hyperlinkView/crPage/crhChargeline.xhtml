<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.charge.assignment']}" id="chargeAss" toggleable="true" styleClass="crChargeLinePnlClass">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.charge.assignment']}" escape="false"/>
		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="chargeLineChange"
			selection="#{contractRequestBackingBean.managedBean.selectedNode}"
			selectionMode="single"
			value="#{contractRequestBackingBean.managedBean.chargeLineItemRoot}" >
			<p:ajax event="expand" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />  
			<p:ajax event="select"
				listener="#{contractRequestBackingBean.onNodeSelect()}"
				update="chargeLineTbl,@(.chargeLineSection)" />
			<p:ajax event="unselect"
				listener="#{contractRequestBackingBean.onNodeUnSelect()}"
				update="chargeLineTbl,@(.chargeLineSection)"></p:ajax>
			<p:column>
				<f:facet name="header">
					<h:outputText value=" " />
					<p:spacer width="15" />
					<h:selectBooleanCheckbox 
						onclick="goToSelectAll()"
						disabled="#{contractRequestBackingBean.managedBean.buttonVal=='View'}"
						value="#{contractRequestBackingBean.selectAllCheckbox}">
					</h:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					value="#{chargeLineNode.selectedChargeItem}"
					rendered="#{chargeLineNode.parent == 'true'}"
					disabled="#{contractRequestBackingBean.managedBean.buttonVal=='View'}"
					styleClass="myCustomChekBox">
					<p:ajax event="change"
					listener="#{contractRequestBackingBean.selectCheckbox}"
					update="chargeLineTbl,@(.chargeLineSection)"/>	
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column>
				<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.charge.line.coa']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.complete']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<p:graphicImage rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.coaValue == 'Y' }"
					value="/css/images/design/ico-check.png" title="#{chargeLineNode.coaValue}" />		
				<p:graphicImage  rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.coaValue != 'Y' }"
					value="/css/images/design/ico-reject.png" title="#{chargeLineNode.coaValue}" />					
			</p:column>
			<p:column sortBy="#{chargeLineNode.cmItem.extensionCode}">
				<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.item.code']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText
					value="#{chargeLineNode.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.cmItem!=null}" />
				<h:outputText
					value="#{chargeLineNode.scRequestItem.tempUnspscCode}"
					rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.cmItem==null}" />	
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" id="itemDesc"/>
				<p:tooltip for="itemDesc" value="#{chargeLineNode.scRequestItem.itemDesc}" rendered="#{chargeLineNode.scRequestItem.itemDesc!=null}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}"  style="white-space:normal;">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.scRequestItem.uom.uomName}" 
				rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:right">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.unitPrice}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:right">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.gstAmount}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:right">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.gstUnitPrice}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="white-space:normal;text-align:right">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.fl.charge.line.grandtotal']}"></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.chargeOrderedQty}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.scRequestItem.uom.uomCode)}" />	
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}"  style="white-space:normal;text-align:right">
				<f:facet name="footer">
					<h:outputText
						value="#{contractRequestBackingBean.managedBean.orderedAmtGrandTotal}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>		
				</f:facet>
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column rendered="#{contractRequestBackingBean.managedBean.queryDisplay}">
			<f:facet name="header" style="width:8%;">
			<h:outputText style="text-align:right" />
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.query']}"/>
			</f:facet>
			<p:commandLink oncomplete="addQuery.show();"
					action="#{contractRequestBackingBean.showItemQuery(chargeLineNode)}"
					rendered="#{contractRequestBackingBean.managedBean.queryDisplay and chargeLineNode.parent == 'false' and chargeLineNode.flFulfilmentItem.flQuery != null}"
					update=":form:queryDialog,@(.orderSummaryChange)">
					<p:graphicImage value="/css/images/design/exclamation.png"
						title="Query" />
			</p:commandLink>
			</p:column>
		</p:treeTable>
		<p:remoteCommand action="#{contractRequestBackingBean.selectAllCheckboxes}"
				name="goToSelectAll" update="chargeLineTbl,@(.chargeLineSection)"/>		
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.asset.ind']}" /><h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 150px; margin-bottom:5px;" value="#{contractRequestBackingBean.managedBean.assetIndId}" disabled="#{!contractRequestBackingBean.managedBean.chargeLinePanel}">
						<f:selectItems value="#{contractRequestBackingBean.getDropdownValues(ParameterTypeConst.assetInd)}" />
					</p:selectOneMenu></td>
					<td style="width:95px;"><p:outputLabel value="#{lbl['lbl.fl.vot']}" /></td>
					<td><p:selectOneMenu id="votCode1" disabled="#{!contractRequestBackingBean.managedBean.chargeLinePanel}"
						value="#{contractRequestBackingBean.managedBean.votFundId}"
						style="width: 102px; margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="votCodeList"
							value="#{contractRequestBackingBean.managedBean.votFundList}"
							itemLabel="#{votCodeList.votFundCode}"
							itemValue="#{votCodeList.votFundId}" />
							<p:ajax event="change"
							listener="#{contractRequestBackingBean.checkVotFundDropdown}"
							update="fundLov,pmActiveLov,projectLov,setiaCode,subSetiaCode,cpCode" />
					</p:selectOneMenu>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.vot.code']}"/>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.fund']}" /></td> 
					<td><h:panelGroup styleClass="fundLov" id="fundLov"><ac:lov id="fund"
						lovId="PM_VOT_FUND" headerText="#{lbl['lbl.fl.fund.code']}"
						saveObject="contractRequestBackingBean.managedBean.pmVoteFund"
						update=":form:votCode1,:form:pmActiveLov,:form:projectLov,:form:setiaCode,:form:subSetiaCode,:form:cpCode"
						readonly="true"
						size="4"
						disabled="#{!contractRequestBackingBean.managedBean.chargeLinePanel}" 
						postUpdateListener="contractRequestBackingBean.checkVotFundLov" 
						conditionField="recordStatusFlg^1|votFundType^A|votFundCode^#{contractRequestBackingBean.managedBean.feeVoteFund.votFundCode}^2"
						value="#{contractRequestBackingBean.managedBean.pmVoteFund.votFundCode}"	>
					</ac:lov></h:panelGroup></td>
					<td></td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.program.activiti']}" /></td>
					<td ><h:panelGroup styleClass="pmActiveLov" id="pmActiveLov"><ac:lov id="pmActive"
						lovId="PM_PRG_ACTIVITY" headerText="#{lbl['lbl.fl.program.activiti']}"
						saveObject="contractRequestBackingBean.managedBean.pmPrgActivity"
						readonly="true"
						size="7"
						disabled="#{!contractRequestBackingBean.managedBean.programLov}" 
						conditionField="recordStatusFlg^1|pmVotFund.votFundId^#{contractRequestBackingBean.managedBean.votFundId}" 
						value="#{contractRequestBackingBean.managedBean.pmPrgActivity.prgActivityCode}"	>
					</ac:lov></h:panelGroup></td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.project']}" /></td> 
					<td><h:panelGroup styleClass="projectLov" id="projectLov"><ac:lov id="pmProject"
						lovId="PM_PROJECT" headerText="#{lbl['lbl.fl.project']}"
						saveObject="contractRequestBackingBean.managedBean.pmSubSetia"
						readonly="true"
						size="7"
						disabled="#{!contractRequestBackingBean.managedBean.projectLov}" 
						update=":form:setiaCode,:form:subSetiaCode,:form:cpCode" 
						conditionField="recordStatusFlg^1|pmVotFund.votFundId^#{contractRequestBackingBean.managedBean.votFundId}" 
						value="#{contractRequestBackingBean.managedBean.pmSubSetia.projectCode}"	>
					</ac:lov>
					</h:panelGroup></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.setia.subsetia']}" /></td> 
					<td><h:panelGroup styleClass="setiaLov" id="setiaLov">
						<p:inputText size="2" id="setiaCode"
						readonly="true"
						value="#{contractRequestBackingBean.managedBean.pmSubSetia.setiaCode}" /><p:inputText size="2" id="subSetiaCode"
						readonly="true"
						value="#{contractRequestBackingBean.managedBean.pmSubSetia.subSetiaCode}" /></h:panelGroup>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.cp']}" /></td> 
					<td>
						<p:inputText size="5" id="cpCode"
						readonly="true"
						value="#{contractRequestBackingBean.getParameterDesc(contractRequestBackingBean.managedBean.pmSubSetia.financingType)}" />
					</td>		
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.gosodo']}" /></td> 
					<td><h:panelGroup styleClass="gosodoLov" id="gosodoLov"><ac:lov id="gosodo"
						lovId="PM_GL_ACCOUNT" headerText="#{lbl['lbl.fl.charge.asset.gosodo']}"
						saveObject="contractRequestBackingBean.managedBean.gosodo"
						readonly="true"
						size="7"
						disabled="#{!contractRequestBackingBean.managedBean.chargeLinePanel}"
						value="#{contractRequestBackingBean.managedBean.gosodo.glAccCode}"	
						tooltip="#{lbl['lbl.fl.tooltip.gosodo']}"	>
					</ac:lov></h:panelGroup>
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
	<p:dialog id="queryDialog" header="#{lbl['lbl.fl.query']}" widgetVar="addQuery"
		showEffect="fade" hideEffect="fade" modal="true" width="600px"
		height="250px" resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.code']}" /></td>
				<td><p:inputText disabled="true" size="20"
						value="#{contractRequestBackingBean.queryItemCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.name']}" /></td>
				<td><p:inputText disabled="true" size="35"
						value="#{contractRequestBackingBean.queryItemName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.query.desc']}" /></td>
				<td><p:inputTextarea cols="50" rows="6" disabled="true"
						style=" margin-bottom:5px;" value="#{contractRequestBackingBean.queryDesc}"/></td>
			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.close']}" 
				oncomplete="addQuery.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
