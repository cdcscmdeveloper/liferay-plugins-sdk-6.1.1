<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.item.details']}" toggleable="true" styleClass="invItemPnlClass">

		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="invItemChange" value="#{invoiceBackingBean.managedBean.chargeLineItemRoot}">
			<p:ajax event="expand" 
                onstart="blockTreeTable.show();" oncomplete="blockTreeTable.hide();" />  			
			<p:column style="white-space:normal; width:145px;text-align:center;">
				<f:facet name="header" style="width:8%;">
    				 <h:outputText value="#{lbl['lbl.fl.item.code']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.item.code']}"/>
    				</f:facet>
				<h:outputText
					value="#{chargeLineNode.itemCode}"
					rendered="#{chargeLineNode.lvl1 == 'true'}" />
			</p:column>
			<p:column style="white-space:normal;text-align:center;" >
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.item']}"/>
				</f:facet>			
				<h:outputText value="#{chargeLineNode.itemName}" style="float:left;"
					rendered="#{chargeLineNode.lvl1 == 'true'}" id="itemDesc"/>
				<p:tooltip for="itemDesc" value="#{chargeLineNode.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : chargeLineNode.itemDesc}"  />
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.uom']}"/>
				</f:facet>			
				<h:outputText value="#{chargeLineNode.uom}" style="float:left;"
					rendered="#{chargeLineNode.lvl1 == 'true'}" />
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.unit.price']}" style="float:right;"/>
				</f:facet>				
				<h:outputText value="#{chargeLineNode.unitPrice}" rendered="#{chargeLineNode.lvl2 == 'true'}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.gst.amt']}"/>
				</f:facet>				
				<h:outputText value="#{chargeLineNode.gstAmount}" rendered="#{chargeLineNode.lvl3 == 'true'}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.unit.price.w.gst']}"/>
				</f:facet>			
				<h:outputText value="#{chargeLineNode.gstUnitPrice}" rendered="#{chargeLineNode.lvl3 == 'true'}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.fl.gst.rate']}"/>
				</f:facet>
				<h:outputText value="#{chargeLineNode.gstFlag}" rendered="#{chargeLineNode.lvl3 == 'true'}" style="float:right;">
				</h:outputText>
			</p:column>
			<p:column  style="white-space:normal;text-align:center;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.ordered.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.order.qty']}"/>
    				</f:facet>
				<h:outputText value="#{chargeLineNode.orderedQty}" rendered="#{chargeLineNode.lvl2 == 'true'}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:center;">
			
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.received.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.do.received.qty']}"/>
    				</f:facet>
				<h:outputText value="#{chargeLineNode.receivedQty}" rendered="#{chargeLineNode.lvl3 == 'true'}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column  style="white-space:normal;text-align:center;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.invoice.recalled.qty']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.recalled.qty']}"/>
    			</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.fl.charge.line.grandtotal']}"/>
				</f:facet>    			
				<h:outputText value="#{chargeLineNode.recalledQty}" rendered="#{chargeLineNode.lvl2 == 'true'}" style="float:right;">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="white-space:normal;text-align:center;">
				<f:facet name="footer">
					<h:outputText value="#{invoiceBackingBean.managedBean.orderedAmtGrandTotal}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.orderedAmt}" rendered="#{chargeLineNode.lvl2 == 'true'}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.received.amount']}" style="white-space:normal;text-align:center;">
				<f:facet name="footer">
					<h:outputText value="#{invoiceBackingBean.managedBean.receivedAmtGrandTotal}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.lvl2 == 'true'}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.receivedAmt}" rendered="#{chargeLineNode.lvl3 == 'true'}" style="float:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.amount.invoice']}" style="white-space:normal;text-align:center;">
				<f:facet name="header" >
    				 <h:outputText value="#{lbl['lbl.fl.amount.invoice']}"/>
     					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.inv.amount']}"/>
    			</f:facet>
				<f:facet name="footer">
					<h:outputText value="#{invoiceBackingBean.managedBean.invAmtGrandTotal}" style="float:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</f:facet>
				<h:outputText value="#{chargeLineNode.invoiceAmt}" id="invSumAmountTxt" style="float:right;"
					rendered="#{chargeLineNode.lvl2 == 'true'}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<p:inputText size="9" value="#{chargeLineNode.invoiceAmt}" maxlength="15" id="chargeInvAmt" label="#{lbl['lbl.fl.invoice.amount']}" required="true" style="text-align:right;color: red;"  
					rendered="#{chargeLineNode.lvl3 == 'true'}" disabled="true">
					<p:ajax event="blur"  process="@this" partialSubmit="true" update="chargeLineTbl"
								listener="#{invoiceBackingBean.retrieveInvTotalAmount(chargeLineNode)}">
					</p:ajax>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText><p:message for="chargeInvAmt" display="icon" />
			</p:column>
		</p:treeTable>
		<p:spacer height="2px"></p:spacer>
		<table>
			<tr>
				<td><p:outputLabel style="text-align:left"
						value="#{lbl['lbl.fl.invoice.relief.clause.goods']}"
						rendered="#{invoiceBackingBean.managedBean.invoice.flRequest.procurementTypeCategory.parameterCode eq ParameterConst.procurementTypeCodeSupply}" /></td>
				<td><p:outputLabel style="text-align:left"
						value="#{lbl['lbl.fl.invoice.relief.clause.service']}"
						rendered="#{invoiceBackingBean.managedBean.invoice.flRequest.procurementTypeCategory.parameterCode eq ParameterConst.procurementTypeCodeService}" /></td>
			</tr>
		</table>
		<p:spacer height="5px"></p:spacer>
		<table>	
			<tr>
				<td><p:selectBooleanCheckbox
						disabled="true"
						value="true" /></td>
				<td><p:outputLabel style="text-align:left"
						value="#{lbl['lbl.fl.invoice.relief.declaration']}" /></td>
			</tr>
		</table>
		<p:blockUI widgetVar="blockTreeTable" block="chargeLineTbl">  
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>  
		</p:blockUI> 			
	</p:panel>
</ui:composition>
