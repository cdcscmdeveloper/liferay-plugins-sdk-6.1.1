<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>		
		<script>
			$('#portlet_flDeliveryOrder_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{flOrderBB.getPortletTitle()}');
		</script>
		<p:messages id="messages" showDetail="true" closable="true" severity="error, info" />
		
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						action="#{flOrderBB.backToDeliveryOrder}" /></td>
			</tr>
		</table>
		<ui:include src="orderNoHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{flOrderBB.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{flOrderBB.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.order.summary']}" update="@form"  actionListener="#{flOrderBB.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{flOrderBB.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>
					</p:tabMenu></td>

				<td width="80%"><p:outputPanel
						rendered="#{flOrderBB.managedBean.selectedTabIndex == 0}">
						<ui:include src="orderNoGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{flOrderBB.managedBean.selectedTabIndex == 1}">
						<ui:include src="orderNoItem.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
