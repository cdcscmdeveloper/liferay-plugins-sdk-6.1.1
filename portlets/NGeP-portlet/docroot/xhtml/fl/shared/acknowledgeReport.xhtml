<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
    <ui:define name="contentSection">
    <script type="text/javascript">
			 function handleLocalesDialogComplete(xhr, status, args) {
				if (args) {
					window.open(args.reportViewUrl, '_blank');
				}
			} 
			function generateReportURL(deliveryOrderNo){
				document.querySelector('[id*=reportOrderNo]').value=deliveryOrderNo;
				var reportCmdLink=document.getElementsByClassName("reportLink")[0];
				reportCmdLink.click();
			}
		</script>
		<h:inputHidden id="reportOrderNo" value="#{commonBackingBean.orderNo}" />
		<p:panel id="acknowledge" header="#{lbl['lbl.acknowledgement.title']}">
			<p:messages id="ackMsg" showDetail="true" autoUpdate="true" severity="info" escape="false"/>
		<p:commandLink ajax="false" value="#{commonBackingBean.managedBean.reportDisplayName}" style="display:none;" 
				action="#{commonBackingBean.generateReportByOrderNo}" styleClass="reportLink" id="reportLink"/>	
		</p:panel>
	</ui:define>
		    
</ui:composition>
