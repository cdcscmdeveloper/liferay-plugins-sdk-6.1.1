<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<table style="width: 100%">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.attachment']}" escape="false"/>
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel
					value="#{lbl['lbl.txt.attachment']}" /></td>
			<td class="TableFieldRight"><p:commandButton
					oncomplete="doUploadDlg.show();return false;" 
					disabled="#{fulfilmentBackingBean.managedBean.isHideRemarks() or !bpmTasklistBackingBean.managedBean.claim}"
					update="doMaintain,doUploadDlg" partialSubmit="true" value="#{lbl['lbl.fl.attach.files']}" /></td>
		</tr>
		<tr>
			<td />
			<td><p:dataGrid id="doMaintain"
					value="#{fulfilmentBackingBean.managedBean.attachmentList}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1"
					emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}" 
					style="width:100%" styleClass="noBorder">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage value="/css/images/design/#{fulfilmentBackingBean.determineIcon(attachFile)}"
									height="30" width="30" /></td>
							<td width="5"></td>
							<td><h:outputText value=" #{attachFile.createdUsername}"></h:outputText>,
								<h:outputText value="#{attachFile.createdDate}">
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
								</h:outputText></td>
						</tr>
						<tr>
							<td></td>
							<td><h:commandLink value="#{attachFile.fileName}"
									styleClass="blue_font"
									action="#{fulfilmentBackingBean.downloadFile(attachFile)}" />
								<p:commandLink
									oncomplete="delFileDlg.show()" 
									action="#{fulfilmentBackingBean.confirmDeleteAttachment(attachFileIndex)}"
									immediate="true"
									rendered="#{fulfilmentBackingBean.compareAttachmentUserName(attachFile.createdUsername)
													and bpmTasklistBackingBean.managedBean.claim
													and !fulfilmentBackingBean.managedBean.isHideRemarks()}"									
									update="doMaintain">
									<p:graphicImage value="/css/images/design/delete.png"
										styleClass="tasklist_title1" />
								</p:commandLink></td>
						</tr>
					</table>
				</p:dataGrid></td>
		</tr>
	</table>

	<p:dialog id="doUploadDlg" widgetVar="doUploadDlg" appendToBody="false"	resizable="false" width="700px" height="350" 
		styleClass="pop_up_top"	header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{fulfilmentBackingBean.handleFileUpload}"
			mode="advanced" multiple="true" id="doupload" 
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload.all']}" cancelLabel="#{lbl['lbl.btn.remove.all']}" 
			update="doMaintain">
		</p:fileUpload>
		<f:facet name="footer">
			<div class="ppRightBtn">
			    <p:commandButton value="#{lbl['lbl.btn.close']}" type="button" ajax="false" onclick="doUploadDlg.hide();" />
   			</div>
   		</f:facet>			
	</p:dialog>

	<p:confirmDialog message="#{lbl['lbl.msg.confirm.delete']}"
		severity="alert" widgetVar="delFileDlg" closable="true"
		appendToBody="true" header="Delete Confirmation">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" 
				partialSubmit="true" immediate="true"
				update="doMaintain"
				action="#{fulfilmentBackingBean.deleteAttachmentAction()}"/>
			<p:commandButton value="#{lbl['lbl.btn.no']}" 
				onclick="delFileDlg.hide();" type="button" />
		</div>
	</p:confirmDialog>	

</ui:composition>
