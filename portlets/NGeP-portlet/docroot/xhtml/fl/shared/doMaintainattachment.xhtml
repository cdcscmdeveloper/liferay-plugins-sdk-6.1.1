<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel
					value="#{lbl['lbl.txt.attachment']}" /></td>
			<td class="TableFieldRight"><p:commandButton
					oncomplete="doUploadDlg.show();return false;" icon="iconAttachment"
					disabled="#{fulfilmentBackingBean.managedBean.isHideRemarks()}"
					update="doMaintain" partialSubmit="true" value="#{lbl['lbl.fl.attach.files']}" /></td>
		</tr>
		<tr>
			<td />
			<td><p:dataGrid id="doMaintain"
					value="#{fulfilmentBackingBean.managedBean.attachmentList}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1"
					emptyMessage ="#{lbl['lbl.datatable.msg.no.records.found']}" 
					style="width:100%" styleClass="noBorder">
					<table>
						<tr>
							<td rowspan="2"><h:graphicImage value="/css/images/design/#{fulfilmentBackingBean.determineIcon(attachFile)}"
									height="30" width="30" /></td>
							<td width="5"></td>
							<td><h:outputText value=" #{attachFile.createdUsername}"></h:outputText>,
								<h:outputText value="#{attachFile.createdDate}">
									<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
								</h:outputText></td>
						</tr>
						<tr>
							<td></td>
							<td><h:commandLink value="#{attachFile.fileName}"
									styleClass="blue_font"
									action="#{fulfilmentBackingBean.downloadFile(attachFile)}" />
								<p:commandLink
									oncomplete="maintainDelFileDlg.show()" 
									action="#{fulfilmentBackingBean.confirmDeleteAttachment(attachFileIndex)}"
									immediate="true"
									rendered="#{fulfilmentBackingBean.compareAttachmentUserName(attachFile.createdUsername)}"
									update="doMaintain">
									<p:graphicImage value="/css/images/design/delete.png"
										styleClass="tasklist_title1" />
								</p:commandLink></td>
						</tr>
					</table>
				</p:dataGrid></td>
		</tr>
	</table>

	<p:dialog id="doUploadDlg" widgetVar="doUploadDlg" appendToBody="false"
		hideEffect="explode" resizable="false" width="700px"
		height="350" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{fulfilmentBackingBean.handleFileUpload}"
			mode="advanced" id="doupload" fileLimit="2"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" cancelLabel="#{lbl['lbl.btn.cancel']}" 
			update="doMaintain">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog id="maintainDelFileDlg" widgetVar="maintainDelFileDlg"
			header="Delete Confirmation" styleClass="screen-title"
			style="z-index: 100 !important;"
			appendToBody="true"
			resizable="false" modal="true" width="325" height="90">
			<h:panelGrid columns="3">
				<p:graphicImage styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea disabled="true"
					value="#{lbl['lbl.fl.dialog.delete.file.msg']}" rows="2"
					cols="48" styleClass="ui-inputtextarea" />
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					partialSubmit="true"
					update="doMaintain"
					action="#{fulfilmentBackingBean.deleteAttachmentAction()}"
					 />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					onclick="delFileDlg.hide();" type="button" />
			</div>
	</p:dialog>

</ui:composition>
