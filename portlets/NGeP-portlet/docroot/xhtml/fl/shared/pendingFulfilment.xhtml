<ui:composition template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:selectOneMenu
			value="#{flOrderBB.managedBean.docStatusDesc}"
			style="width: 314px;">
			<f:selectItems
				value="#{flOrderBB.getPendingFlListStatus()}" />
			<p:ajax event="change" update="form:flPendingFlDt"
				listener="#{flOrderBB.getSelectedFlDocStatusDesc}" />
		</p:selectOneMenu>
		<p:spacer height="2px"></p:spacer>
		<p:dataTable value="#{flOrderBB.managedBean.pendingFlDataModel}" lazy="true"
			var="pending" id="flPendingFlDt" rowIndexVar="rowIndex" width="100%" rows="10">
			<ac:paginator for="flPendingFlDt" />
			<p:column headerText="#{lbl['lbl.fl.dopending.order.number']}" style="text-align:center">
				<h:outputText value="#{pending.docNo}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.doc.search.datatable.doc.type']}" style="text-align:center">
				<h:outputText value="#{flOrderBB.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, pending.docType)}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.doc.search.datatable.title']}" style="white-space:normal;text-align:center">
				<p:commandLink value="#{pending.flFulfilmentRequest.title}"
					action="#{flOrderBB.navigateToFlOrder(rowIndex)}" style="text-align:left;float:left;">
					<f:setPropertyActionListener
						target="#{flOrderBB.managedBean.selectedFlOrder}"
						value="#{pending}"></f:setPropertyActionListener>
						<f:param name="status" value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" />
				</p:commandLink>				
			</p:column>
			<p:column headerText="Status" style="white-space:normal;text-align:center">
				<h:outputText value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" style="text-align:left;float:left;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.created.date']}" style="text-align:center">
				<h:outputText value="#{pending.createdDate}" style="float:left;">
					<f:convertDateTime pattern="dd-MM-yyyy HH:mm" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.supp.name']}" style="white-space:normal;text-align:center">
				<h:outputText value="#{pending.flFulfilmentRequest.flSupplierDtl.supplierName}" style="text-align:left;float:left;"/>
			</p:column>	
		</p:dataTable>
	</ui:define>

</ui:composition>
