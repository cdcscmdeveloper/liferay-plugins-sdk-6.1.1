<ui:composition template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:selectOneMenu rendered="false"
			value="#{flOrderBB.managedBean.docStatusId}"
			style="width: 314px;">
			<f:selectItems
				value="#{flOrderBB.getPendingFlListStatus()}" />
			<p:ajax event="change" update="form:flPendingFlDt"
				listener="#{flOrderBB.getSelectedFlDocStatusDesc}" />
		</p:selectOneMenu>
		<p:spacer height="2px" rendered="false"></p:spacer>
		<p:dataTable value="#{flOrderBB.managedBean.pendingFlDataModel}" lazy="true"
			var="pending" id="flPendingFlDt" rowIndexVar="rowIndex" width="100%" rows="5">
			<ac:paginator for="flPendingFlDt" />
			<p:column headerText="#{lbl['lbl.fl.dopending.order.number']}" style="text-align:center;width:15%">
				<h:outputText value="#{pending.docNo}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.doc.search.datatable.doc.type']}" style="text-align:center" rendered="false">
				<h:outputText value="#{flOrderBB.getParameterDesc(ParameterTypeConst.fulfilmentDocumentType, pending.docType)}" style="float:left;"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.doc.search.datatable.title']}" style="white-space:normal;text-align:center;width:30%">
				<p:commandLink value="#{pending.flFulfilmentRequest.title}"
					action="#{flOrderBB.navigateToFlOrderFromDashBoard(rowIndex)}" style="text-align:left;float:left;">
					<f:setPropertyActionListener
						target="#{flOrderBB.managedBean.selectedFlOrder}"
						value="#{pending}"></f:setPropertyActionListener>
						<f:param name="status" value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" />
				</p:commandLink>				
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.supp.name']}" style="white-space:normal;text-align:center;width:30%">
				<h:outputText value="#{pending.flFulfilmentRequest.flSupplierDtl.supplierName}" style="text-align:left;float:left;"/>
			</p:column>				
			<p:column headerText="#{lbl['lbl.fl.created.date']}" style="text-align:center" rendered="false">
				<h:outputText value="#{pending.createdDate}" style="float:left;">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column style="white-space:normal;text-align:center;width:25%">
				<f:facet name="header">
					#{lbl['lbl.fl.status']}
					<p:commandButton id="addBtn" icon="ui-icon-lov" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
						partialSubmit="true" process="@this" />					
					<p:menu overlay="true" trigger="addBtn" my="left top" at="left bottom" style="width:250px;">
			            <p:menuitem value="#{lbl['lbl.txt.all']}" update=":form:flPendingFlDt" action="#{flOrderBB.onFlStatusChange(null)}">
			            	<f:setPropertyActionListener value="#{null}" target="#{flOrderBB.managedBean.docStatusId}" />
			            </p:menuitem>					
			            <p:menuitem value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.poPendingSupplierAcknowledgement)}" update=":form:flPendingFlDt" action="#{flOrderBB.onFlStatusChange(FulfilmentStatusCont.poPendingSupplierAcknowledgement)}">
			            	<f:setPropertyActionListener value="#{FulfilmentStatusCont.poPendingSupplierAcknowledgement}" target="#{flOrderBB.managedBean.docStatusId}" />
			            </p:menuitem>	
			            <p:menuitem value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.poPendingFulfilment)}" update=":form:flPendingFlDt" action="#{flOrderBB.onFlStatusChange(FulfilmentStatusCont.poPendingFulfilment)}">
			            	<f:setPropertyActionListener value="#{FulfilmentStatusCont.poPendingFulfilment}" target="#{flOrderBB.managedBean.docStatusId}" />
			            </p:menuitem>			            					
			            <p:menuitem value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.poPendingPartialFulfilment)}" actionListener="#{flOrderBB.onFlStatusChange(FulfilmentStatusCont.poPendingPartialFulfilment)}" update=":form:flPendingFlDt" >
				            <f:setPropertyActionListener value="#{FulfilmentStatusCont.poPendingPartialFulfilment}" target="#{flOrderBB.managedBean.docStatusId}" />
			            </p:menuitem>
			            <p:menuitem value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.poPendingInvoice)}" update=":form:flPendingFlDt" action="#{flOrderBB.onFlStatusChange(FulfilmentStatusCont.poPendingInvoice)}">
			            	<f:setPropertyActionListener value="#{FulfilmentStatusCont.poPendingInvoice}" target="#{flOrderBB.managedBean.docStatusId}" />
			            </p:menuitem>
					</p:menu>
				</f:facet>
				<h:outputText value="#{flOrderBB.getStatusDescById(pending.status.statusId)}" style="text-align:left;float:left;" />
			</p:column>			
		</p:dataTable>
	</ui:define>

</ui:composition>
