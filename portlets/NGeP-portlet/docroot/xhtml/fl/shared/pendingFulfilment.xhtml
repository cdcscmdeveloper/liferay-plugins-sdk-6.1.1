<ui:composition template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
	 <style>
      .dashboarTable {
             color: #000 !important;
             font-family: Arial,Helvetica,sans-serif;
              font-size: 12px;
              border-color: #ddd;
              border-width:1px;
              padding-left: 5px;
              border-style:solid;
      }
      
     .tableWidth80{
          width:80%;
     }
     
      .tableWidth20{
          width:20%;
          text-align: center;
     }
    
    
    </style>
		<table style="width: 100%;">
			<tr>
				<td class="tableWidth80 dashboarTable">
					<p:outputLabel value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.poPendingFulfilment)}"
						style="float:left;text-align:left;" />
				</td>
				<td class=" tableWidth20 dashboarTable">
					#{flOrderBB.managedBean.totalPendingFl}</td>
			</tr>
			<tr>
				<td class="tableWidth80 dashboarTable">
					<p:outputLabel value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.coPendingPartialFl)}"
						style="float:left;text-align:left;" />
				</td>
				<td class=" tableWidth20 dashboarTable">
					#{flOrderBB.managedBean.totalPendingPartialFl}</td>
			</tr>
			<tr>
				<td class="tableWidth80 dashboarTable">
					<p:outputLabel value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.coPendingSupplierAcknowledgement)}"
						style="float:left;text-align:left;" />
				</td>
				<td class=" tableWidth20 dashboarTable">
					#{flOrderBB.managedBean.totalPendingSupplierAck}</td>
			</tr>
			<tr>
				<td class="tableWidth80 dashboarTable">
					<p:outputLabel value="#{flOrderBB.getStatusDescById(FulfilmentStatusCont.coPendingInvoice)}"
						style="float:left;text-align:left" />
				</td>
				<td class=" tableWidth20 dashboarTable">
					#{flOrderBB.managedBean.totalPendingInvoice}</td>
			</tr>
			<tr>
				<td colspan="3" style="text-align:right;padding-right: 6%;" class="dashboarTable">
					<p:commandLink value="#{lbl['lbl.ct.dash.board.more']}"
						styleClass="blue_font" process="@this" update="@form"
						action="#{flOrderBB.navigateToFlAudit}">
					</p:commandLink>
				</td>
			</tr>
		</table>
	</ui:define>

</ui:composition>
