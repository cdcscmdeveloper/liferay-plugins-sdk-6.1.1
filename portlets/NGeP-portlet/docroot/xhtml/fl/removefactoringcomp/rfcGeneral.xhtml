<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.fl.agency.details']}" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="66" id="ministry"
						value="#{flOrderBB.retrieveMinistryByOrgProfileId(flOrderBB.managedBean.flRequest.issuedOrgProfile.orgProfileId, flOrderBB.managedBean.flRequest.agApprovedDate)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top" style="width: 142px;"><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td>
					<p:inputTextarea rows="2" cols="67" readonly="true" autoResize="false" style="resize:none;" 
						value="#{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgCode} #{flOrderBB.managedBean.flRequest.preparedOrgProfile.orgName}" />
				</td>				
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /></td>
				<td>
					<p:inputTextarea rows="2" cols="67" disabled="true" autoResize="false" style="resize:none;" 
						value="#{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgCode} #{flOrderBB.managedBean.flRequest.issuedOrgProfile.orgName}" />
				</td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td>
					<p:inputTextarea rows="2" cols="67"
						readonly="true" autoResize="false" style="resize:none;"
						value="#{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgCode} #{flOrderBB.managedBean.flRequest.chargeOrgProfile.orgName}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.acc.office']}" /></td>
				<td><p:inputText size="8" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOffice.officeCode}"/> <p:spacer
						width="5" /> <p:inputText size="50" disabled="true" value="#{flOrderBB.managedBean.flRequest.agOfficeName}"/></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="4"
						style=" margin-bottom:5px;"
						autoResize="false"
						value="#{flOrderBB.managedBean.flRequest.title}" disabled="true" /></td>
				<td style="width: 134px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="25"
						value="#{purchaseRequestBackingBean.getParameterDesc(flOrderBB.managedBean.flRequest.procurementType)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25"
						value="#{flOrderBB.managedBean.flRequest.financialYear}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><p:inputText size="12" disabled="true" value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.deliveryTerm}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.po.approved.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.agApprovedDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.start']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.startDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.factored']} " /></td>
				<td><p:selectBooleanCheckbox disabled="true"
									value="#{flOrderBB.managedBean.fulfilmentOrder.factored}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.end']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{flOrderBB.managedBean.flRequest.endDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="16"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.smSupplier.regNo}" /></td>
							<td style="width: 71px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.mofNo}" /></td>
						</tr>
					</table></td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width:295px;"><p:inputText size="15" disabled="true" 
									value="#{flOrderBB.managedBean.flRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : flOrderBB.managedBean.flRequest.smSupplier.epNo}"></p:inputText></td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.branchName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						autoResize="false"
						value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 117px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="16"
									disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.phoneNoFull}" /></td>
							<td style="width: 71px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="16" disabled="true"
									value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.faxNoFull}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{flOrderBB.managedBean.flRequest.flSupplierDtl.flAddress.contactPhoneNoFull}" /></td>
			</tr>
		</table>
	</p:panel>
	<h:panelGroup styleClass="factStyle" id="factStyle">
		<p:panel header="#{lbl['lbl.fl.factoring.details']}" toggleable="true" id="factoringCompPnl"
			rendered="#{flOrderBB.managedBean.fulfilmentOrder.factored}">
			<table style="width: 100%">
				<tr>
					<td style="width: 141px;"><p:outputLabel
							value="#{lbl['lbl.fl.factoring.company']}" /></td>
					<td><p:inputText disabled="true" size="75"
						value="#{flOrderBB.managedBean.fulfilmentOrder.factoringOrgName}" /></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.fl.supp.address']}" /></td>
					<td><p:inputTextarea cols="50" rows="8" disabled="true"
							style=" margin-bottom:5px;"
							autoResize="false"
							value="#{flOrderBB.getFullAddress(flOrderBB.managedBean.fulfilmentOrder.factoringAddress)}" /></td>
				</tr>
				<tr>
					<td style="width: 100px;"><p:outputLabel
							value="#{lbl['lbl.fl.telno']}" /></td>
					<td><table style="width: 100%">
							<tr>
								<td style="width: 25px;"><p:inputText size="15"
										disabled="true"
										value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.phoneNoFull}" /></td>
								<td style="width: 71px;"><p:outputLabel
										value="#{lbl['lbl.fl.faxno']}" /></td>
								<td><p:inputText size="15" disabled="true"
										value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.faxNoFull}" /></td>
							</tr>
						</table></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactPerson}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.email']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactEmail}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
					<td><p:inputText disabled="true" size="25"
							value="#{flOrderBB.managedBean.fulfilmentOrder.factoringAddress.contactPhoneNoFull}" /></td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>
		<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/remark.xhtml" /></td>
					<td width="50%" valign="top"><ui:include
							src="/xhtml/fl/shared/attachment.xhtml" /></td>
				</tr>
			</table>
		</p:panel>
</ui:composition>
