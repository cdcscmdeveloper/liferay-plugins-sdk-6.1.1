<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<script>
			$('#portlet_flDocumentMaintenance_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{flOrderBB.getPortletTitle()}');
		</script>
		<f:event listener="#{flOrderBB.preRenderViewPR}" type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			showSummary="false" closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true"
						icon="ui-icon-back" oncomplete="window.history.back();"
						rendered="#{flOrderBB.managedBean.taskId==null}" /></td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction" value="#{flOrderBB.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}" ajax='false'
							styleClass="ui-button"
							icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
							action="#{flOrderBB.fulfillmentOrderAction(bpmAction)}"
							process="@this" />
					</ui:repeat> </td>
			</tr>
		</table>
		
		<ui:include src="rfcReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{flOrderBB.managedBean.selectedTabIndex}">
						<p:menuitem value="General" update="@form">
							<f:setPropertyActionListener
								target="#{flOrderBB.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="Order Summary" update="@form"
							actionListener="#{flOrderBB.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{flOrderBB.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>
					</p:tabMenu></td>

				<td width="80%"><p:outputPanel
						rendered="#{flOrderBB.managedBean.selectedTabIndex == 0}">
						<ui:include src="rfcGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{flOrderBB.managedBean.selectedTabIndex == 1}">
						<ui:include src="rfcItem.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
