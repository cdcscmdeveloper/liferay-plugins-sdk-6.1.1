<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>	
		<script>
			$('#portlet_flDocumentMaintenance_WAR_NGePportlet').find(
					'.portlet-title-text').html(
					'#{flOrderBB.getPortletTitle()}');
		</script>
		<f:event listener="#{flOrderBB.preRenderViewPR}" type="preRenderView" />
		<c:if test="#{flOrderBB.managedBean.buttonVal eq BpmOutcomeConstant.bpmRemoveFactoring}">
			<ac:title value="#{flOrderBB.getParameterDesc(ParameterTypeConst.documentTypes, flOrderBB.managedBean.fulfilmentOrder.docType)}" />
		</c:if>				
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			showSummary="false" closable="true" severity="error, info" />
		<ac:gpkiPopup 
			textBeforeSign="#{flOrderBB.managedBean.textBeforeSign}"
			postSignAction="#{flOrderBB.preSubmitFulfillmentOrder(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{flOrderBB.enableAutoUpdate()}"/>
		<ac:spkiPopup id="spkiPopUp"
			password="#{flOrderBB.managedBean.spkiBackingBean.password}"
   		 	challengeAns1="#{flOrderBB.managedBean.spkiBackingBean.challengeAns1}"
  		 	challengeQues1="#{flOrderBB.managedBean.spkiBackingBean.challengeQues1}"
			textBeforeSign="#{flOrderBB.managedBean.textBeforeSign}"
			postSignAction="#{flOrderBB.preSubmitFulfillmentOrder(spkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{flOrderBB.enableAutoUpdate()}"/>
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						action="#{flOrderBB.backToPervious}"
						rendered="#{flOrderBB.managedBean.taskId==null}" /></td>
				<td colspan="4" style="text-align: right">
					<ui:decorate template="/xhtml/fl/shared/claim_template.xhtml">
						<ui:define name="outComeSection">
							<ui:repeat
						var="bpmAction" value="#{flOrderBB.managedBean.outComes}">
						<ui:param name="buttonLabel1" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<ui:param name="buttonLabel2" value="#{fn:replace(buttonLabel1, ' ','.')}" />
						<p:commandButton value="#{lbl[buttonLabel2]}" 
							styleClass="ui-button" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{flOrderBB.signingAction(bpmAction)}"
							process="@this" />
							</ui:repeat>
						</ui:define>
					</ui:decorate>
				</td>
			</tr>
		</table>
		
		<ui:include src="rfcReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{flOrderBB.managedBean.selectedTabIndex}">
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener
								target="#{flOrderBB.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.order.summary']}" update="@form"
							actionListener="#{flOrderBB.onTabChange(1)}">
							<f:setPropertyActionListener
								target="#{flOrderBB.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>
					</p:tabMenu></td>

				<td width="80%"><p:outputPanel
						rendered="#{flOrderBB.managedBean.selectedTabIndex == 0}">
						<ui:include src="rfcGeneral.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{flOrderBB.managedBean.selectedTabIndex == 1}">
						<ui:include src="rfcItem.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
		<p:confirmDialog message="#{lbl['lbl.fl.confirmation.reject.dialogue']}"
			severity="alert" widgetVar="cancelConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					partialSubmit="true" 
					action="#{flOrderBB.fulfillmentOrderAction(BpmOutcomeConstant.bpmReject)}"
					onstart="cancelConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					partialSubmit="true"
					onclick="cancelConfirmDlg.hide();" />
			</div>
		</p:confirmDialog>	
	</ui:define>
</ui:composition>
