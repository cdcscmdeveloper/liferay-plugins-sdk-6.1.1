<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.fl.purchase.request.no']} " />
				</td>
				<td class="header-info-text">
					#{flOrderBB.managedBean.flRequest.docNo}</td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.po.co.no']} " /></td>
				<td class="header-info-text">
					#{flOrderBB.managedBean.fulfilmentOrder.docNo}
					<ui:remove>
					<p:commandLink value="#{flOrderBB.managedBean.fulfilmentOrder.docNo}" 
					action="#{flOrderBB.navigateDocument(flOrderBB.managedBean.fulfilmentOrder.docType)}"/>
					</ui:remove>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']} " />
				</td>
				<td class="header-info-text">
					#{flOrderBB.managedBean.fulfilmentOrder.flFulfilmentRequest.preparedOrgProfile.orgName}</td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']} " />
				</td>
				<td class="header-info-text">
					#{flOrderBB.getStatusDescById(flOrderBB.managedBean.fulfilmentOrder.status.statusId)}
				</td>
			</tr>
		</table>
	</div>
	<p:spacer height="10px" />

</ui:composition>
