<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="ORDER SUMMARY" toggleable="true">
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange hide-column-names"
			value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}">
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="Delivery Address" style="white-space:normal;">
				<h:outputText rendered="#{delAddressSummary.addressType != null}"
					value="#{delAddressSummary.addressType.pmAddress.address1}, #{delAddressSummary.addressType.pmAddress.address2}, #{delAddressSummary.addressType.pmAddress.address3}" />
				<h:outputText rendered="#{delAddressSummary.addressType eq null}"
					value="#{delAddressSummary.pmAddress.address1}, #{delAddressSummary.pmAddress.address2}, #{delAddressSummary.pmAddress.address3}" />
			</p:column>
			<p:column>
				<h:outputText value="Delivery Term" />
				<p:spacer width="5" />
				<h:inputText size="3" style="width:50px; text-align:right;" disabled="true" value="#{delAddressSummary.deliveryTerm}"/>
				<p:spacer width="2" />
				<h:inputText size="4" style="width:50px" disabled="true" value="#{purchaseRequestBackingBean.getParameterDesc(delAddressSummary.pmUom)}" />
			</p:column>
			<p:column>
				<h:outputText value="Delivery Start" />
				<p:spacer width="7" />
				<p:inputText size="8" value="#{delAddressSummary.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<h:outputText value="Delivery End" />
				<p:spacer width="10" />
				<p:inputText size="8" value="#{delAddressSummary.endDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:rowExpansion>

				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}">
					<p:column headerText="Item Code">
						<h:outputText value="#{newItems.scRequestItem.cmItem.extensionCode}"/> 
					</p:column>
					<p:column headerText="Item Name" style="white-space:normal;">
						<h:outputText value="#{newItems.scRequestItem.itemName}" />
					</p:column>
					<p:column headerText="UOM">
						<h:outputText value="#{newItems.scRequestItem.uom.uomName}" />
					</p:column>
					<p:column headerText="Unit Price (RM)" style="text-align:right">
						<h:outputText value="#{newItems.unitPrice}" styleClass="colFloatRight" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Ordered Qty." style="text-align:right">
						<h:outputText value="#{newItems.orderedQty}" styleClass="colFloatRight">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="Ordered Amt.(RM)" style="text-align:right">
						<h:outputText value="#{newItems.orderedAmt}" styleClass="colFloatRight">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
	</p:panel>
</ui:composition>
