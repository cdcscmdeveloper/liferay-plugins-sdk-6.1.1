<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.fl.menu.order.summary']}" toggleable="true" id="prOrderSumm">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.order.summary1']}" escape="false"/>&#160;
	<p:graphicImage value="/css/images/icon-expand.png" />&#160;
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.order.summary2']}" escape="false"/>
		<p:dataTable id="delAddressSummary" var="delAddressSummary"
			styleClass="orderSummaryChange"
			value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}">
			<ac:paginator for="delAddressSummary" />
			<p:ajax event="rowToggle" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			<p:column style="width:2%">
				<p:rowToggler />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="width: 350px;white-space:normal;">
				<h:outputText rendered="#{delAddressSummary.flAddress != null}" 
					value="#{purchaseRequestBackingBean.getFullAddress(delAddressSummary.flAddress)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.period']}" style="white-space:normal;">
				<p:inputText size="3" style="width:50px; text-align:right;" disabled="true" value="#{delAddressSummary.deliveryTerm}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.start']}" style="white-space:normal;">
				<p:inputText size="8" value="#{delAddressSummary.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.end']}" style="white-space:normal;">
				<p:inputText size="8" value="#{delAddressSummary.endDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</p:column>
			<ui:remove>
			<p:column style="white-space:normal;" >
			<table style="width : 100%;" class="noBorder" >
			<tr >
			<td>
			<h:outputText value="#{lbl['lbl.fl.delivery.period']}" />
			</td>
			</tr>
			<tr>
			<td>
			<p:inputText size="3" style="width:50px; text-align:right;" disabled="true" value="#{delAddressSummary.deliveryTerm}"/>
				<p:spacer width="2" />
				<p:inputText size="4" style="width:50px" disabled="true" value="#{purchaseRequestBackingBean.getParameterDesc(delAddressSummary.pmUom)}" />
			</td>
			</tr>
			</table>
			</p:column>
			<p:column style="white-space:normal;">
			<table style="width : 100%;" class="noBorder">
			<tr>
			<td>
			<h:outputText value="#{lbl['lbl.fl.delivery.start']}" />
			</td>
			</tr>
			<tr>
			<td>
			<p:spacer width="7" />
				<p:inputText size="8" value="#{delAddressSummary.startDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</td>
			</tr>
			</table>
			</p:column>
			<p:column style="white-space:normal;">
			<table style="width : 100%;" class="noBorder">
			<tr>
			<td>
			<h:outputText value="#{lbl['lbl.fl.delivery.end']}" />
			</td>
			</tr>
			<tr>
			<td>
			<p:spacer width="7" />
				<p:inputText size="8" value="#{delAddressSummary.endDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</td>
			
			</tr>
			</table>
			</p:column>
			</ui:remove>
			<p:rowExpansion>
				<p:dataTable id="newItems" var="newItems"
					styleClass="show-column-names"
					value="#{delAddressSummary.flFulfilmentItemAddr}" >
					<p:column style="text-align:center">
						<f:facet name="header" style="width:8%;text-align:center">
							<h:outputText value="#{lbl['lbl.fl.item.code']}" />
							<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}" />
						</f:facet>
						<h:outputText rendered="#{newItems.scRequestItem.cmItem==null}" value="#{newItems.scRequestItem.tempUnspscCode}" style="float:left;"/>
						<!-- #31344 display item details in popup -->	
						<p:commandLink rendered="#{newItems.scRequestItem.cmItem!=null}" 
							oncomplete="itemDescDialogId.show();" 
							value="#{newItems.scRequestItem.cmItem.extensionCode}" 
							style="color: #009ae5; font-size:12px; font-style:italic; text-align:left; float:left;"
							action="#{purchaseRequestBackingBean.showItemDescPopup(newItems.scRequestItem.cmItem.itemId)}" 
							process="@this" 
							update="@([id$=itemDescDialogId])"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center">
						<!--#31344 filter item name-->
						<h:outputText value="#{CommonUtils.removeItemNameNA(newItems.scRequestItem.itemName)}" id="itemDesc" style="text-align:left; float:left;" title="#{newItems.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : newItems.scRequestItem.itemDesc}"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.uom']}" style="text-align:center">
						<h:outputText value="#{newItems.scRequestItem.uom.uomName}" style="float:left;"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:center;white-space:normal">
						<h:outputText value="#{newItems.unitPrice}" style="float:right;" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="text-align:center;white-space:normal">
						<h:outputText value="#{newItems.gstAmount}" style="float:right;" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="text-align:center;white-space:normal">
						<h:outputText value="#{newItems.gstUnitPrice}" style="float:right;" >
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:center">
						<h:outputText value="#{newItems.orderedQty}" style="float:right;">
							<f:converter converterId="dynamicNumberConverter" />
							<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, newItems.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:center">
						<h:outputText value="#{newItems.orderedAmt}" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:rowExpansion>
		</p:dataTable>
		<table style="width: 100%;">
			<tr>
				<td style="text-align:right;font-weight:bold;"><h:outputText
						value="#{lbl['lbl.fl.charge.line.grandtotal']}" /><p:spacer width="10" /><h:outputText
						value="#{purchaseRequestBackingBean.managedBean.orderSummaryOrderedAmtGrandTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
