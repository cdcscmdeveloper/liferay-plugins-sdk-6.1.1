<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="AGENCY DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="52" id="ministry"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 146px;"><p:outputLabel
						value="#{lbl['lbl.fl.prepared.for.ptj']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="5" id="preparedOrgProfileId"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <ac:lov id="preparedPtj"
						lovId="PM_ORG_PROFILE" headerText="Prepared PTJ Lov"
						saveObject="purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						update=":form:preparedOrgProfileId,:form:issuedOrgCode,:form:issuedOrgName" readonly="true" size="39"
						postUpdateListener="purchaseRequestBackingBean.getAgAccount()"
						conditionField="parentOrgProfile.orgProfileId^#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.parentOrgProfile.orgProfileId}">
					</ac:lov></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /> </td>
				<td><p:inputText size="5" id="issuedOrgCode"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
						<p:spacer width="8"></p:spacer>
						<p:inputText size="39" id="issuedOrgName"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"></p:inputText>
				</td>
			</tr>										
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" id="chargeOrgProfileId" readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <ac:lov id="chargePtj"
						lovId="PM_ORG_PROFILE" headerText="Charge PTJ Lov" readonly="true"
						saveObject="purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}"
						conditionField="parentOrgProfile.orgProfileId^#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.parentOrgProfile.orgProfileId}" 
						update=":form:chargeOrgProfileId" size="39">
					</ac:lov></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true" id="agOffice"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.agOffice.officeCode}" />
					<p:spacer width="10" /> <p:inputText size="39" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.agOffice.officeName}" />
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /> </td>
				<td rowspan="3" style="width:290px"><p:inputTextarea cols="50" rows="4" id="title"
						maxlength="500" style=" margin-bottom:5px;" label="Title"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}"
						/></td>
						<td><p:message for="title" display="icon" /></td>
				<td style="width: 134px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementType)}" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.term']}" /></td>
				<td><p:inputText size="12" style="text-align:right;"
						disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.deliveryTerm}" />
					<p:spacer width="5" /> <p:inputText size="2"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.pmUom)}"
						disabled="true" /></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.start.delivery.date']}" /></td>
				<td><p:calendar mode="popup" readonlyInput="true"
						showOn="button"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						mindate="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}" 
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}">
						<p:ajax event="dateSelect"
							listener="#{purchaseRequestBackingBean.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.end.delivery.date']}" /></td>
				<td><p:calendar id="delEndDate" mode="popup"
						readonlyInput="true"  showOn="button"
						mindate="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}" 
						maxdate="#{purchaseRequestBackingBean.managedBean.maxDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.endDate}">
						<p:ajax event="dateSelect"
							listener="#{purchaseRequestBackingBean.updateDeliveryEndDate}" />
					</p:calendar></td>
			</tr>
		</table>
	</p:panel>
	<p:panel id="supplierPnl" header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" /></td>
							<td style="width: 78px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="51"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:selectOneMenu id="suppBranch"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.branchCode}"
						style="width: 360px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="suppBranchList"
							value="#{purchaseRequestBackingBean.managedBean.supplierBranchesList}"
							itemLabel="#{suppBranchList.branchName}"
							itemValue="#{suppBranchList.supplierBranchId}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getSelectedSupplierBranchDtl}"
							update="supplierPnl" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						id="smAddress" style=" margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.getFullAddress(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 80px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="51"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="51"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="15"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
	<ac:lovPopup />
</ui:composition>
