<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="FULFILMENT DETAIL" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="35"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.purchase.request.no']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 207px;">
						<f:selectItems
							value="#{purchaseRequestBackingBean.divisionProfileList}" />
						<p:ajax event="change" update="flDetails" process="@this"
							listener="#{purchaseRequestBackingBean.checkPtjFlg}" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.req.note.no']}" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.selectedRequestNote.requestNoteNo}"
						disabled="true" size="20" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 207px;">
						<f:selectItems value="#{purchaseRequestBackingBean.PTJList}" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.plan.no']}" /></td>
				<td><p:inputText size="20"
						value="#{purchaseRequestBackingBean.managedBean.selectedRequestNote.scRequestList.ppPlan.planNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.jabatan']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.receivedOrgProfile.orgProfileId}"
						style="width: 207px;">
						<f:selectItems
							value="#{purchaseRequestBackingBean.divisionProfileList}" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="35"
						value="#{purchaseRequestBackingBean.managedBean.selectedRequestNote.fulfillmentType}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.receivedOrgProfile.orgProfileId}"
						style="width: 207px; margin-bottom:5px;">
						<f:selectItems value="#{purchaseRequestBackingBean.PTJList}" />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="20"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}" />
				</td>
			</tr>
			<tr>
				<td rowspan="2" valign="top"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="2"><p:inputTextarea  cols="36"
						style=" margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}" />
				</td>

				<td><p:outputLabel value="* #{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:selectOneMenu style="width: 207px; margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.maksudId}">
						<f:selectItems
							value="#{purchaseRequestBackingBean.maksudCodeList}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:selectOneMenu style="width: 207px; margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.orgProfileAgoId}">
						<f:selectItem itemLabel="002 KAWANGAN KL" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']}" /></td>
				<td><p:selectOneRadio
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financingLoan}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
					<td><p:outputLabel value="* #{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:selectOneMenu style="width: 207px;margin-bottom:5px;">
						<f:selectItems value="#{purchaseRequestBackingBean.PTJList}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText size="20" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 125px;"><p:outputLabel value="EP No." /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="5"
									disabled="true" /></td>
							<td style="width: 65px;"><p:outputLabel value="MOF No." /></td>
							<td><p:inputText size="10" disabled="true" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="35" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea  cols="36"
						style="margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText disabled="true" size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText disabled="true" size="20" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel id="settingId" header="Approver Setting" toggleable="true"
		toggleSpeed="500">
		<h:panelGrid columns="1">
			<h:panelGrid style="width:500px">
				<p:pickList id="approverpickList"
					value="#{purchaseRequestBackingBean.managedBean.approverModel}"
					var="data" itemValue="#{data}" itemLabel="#{data}"
					showTargetControls="true" filterMatchMode="contains">
					<f:facet name="sourceCaption">Available</f:facet>
					<f:facet name="targetCaption">Selected</f:facet>
					<p:column style="width:75%;">
						<h:outputText value="#{data}" />
					</p:column>
				</p:pickList>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
