<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="AGENCY DETAILS" toggleable="true" id="flDetails">
		<table style="width: 100%">
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="50" id="ministry"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="50" id="issuedJabatan"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.prepared.for.ptj']}" /></td>
				<td><p:inputText size="50"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:inputText size="5" id="issuedOrgProfileId"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <ac:lov id="issuePtj"
						lovId="PM_ORG_PROFILE" headerText="IssuePtj Lov"
						saveObject="purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"
						update=":form:prtabs:issuedOrgProfileId" readonly="true"
						conditionField="orgProfileId^#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.parentOrgProfile.orgProfileId}">
					</ac:lov> <ac:lovPopup /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.charge.ptj']}" /></td>
				<td><p:inputText size="5" id="chargeOrgProfileId"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgProfileId}" />
					<p:spacer width="5" /> <ac:lov id="chargedPtj"
						lovId="PM_ORG_PROFILE" headerText="ChargedPtj Lov"
						saveObject="purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}"
						update=":form:prtabs:chargeOrgProfileId" readonly="true"
						conditionField="orgProfileId^#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.parentOrgProfile.orgProfileId}">
					</ac:lov> <ac:lovPopup /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.accounting.ofc']}" /></td>
				<td><p:inputText size="5" disabled="true" /> <p:spacer
						width="5" /> <p:inputText size="39" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 106px;"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="3"><p:inputTextarea cols="50" rows="6" id="title"
						style=" margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}"
						required="true" label="Title" /> <p:message for="title" /> <h:outputText
						value="" /></td>
				<td style="width: 109px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="25"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementType.codeId}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.created.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><p:inputText size="12" disabled="true" /> <p:spacer
						width="5" /> <p:inputText size="2" value="Days" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.approver.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.approvedDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.start.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:calendar></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.end.delivery.date']}" /></td>
				<td><p:calendar mode="popup" showOn="button"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.endDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:calendar></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.ep.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.smMofAccounts[0].mofNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" /></td>
				<td><p:selectOneMenu style="width: 325px; margin-bottom:5px;">

					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						style=" margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.supplierAddress}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.supplierBranch.phoneNo}" /></td>
							<td style="width: 65px;"><p:outputLabel
									value="#{lbl['lbl.fl.supp.faxno']}" /></td>
							<td><p:inputText size="19" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.supplierBranch.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.del.ord.contact.email']}" /></td>
				<td><p:inputText disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.del.ord.contact.no']}" /></td>
				<td><p:inputText disabled="true" size="25" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
