<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.agency.details']}" toggleable="true" id="flDetails">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
		<table style="width: 100%">
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText size="66" id="ministry"
						value="#{purchaseRequestBackingBean.retrieveMinistryByOrgProfileId(purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.pegawai.pengawal']}" /></td>
				<td><p:inputText size="66" id="controlOff"
						value="#{purchaseRequestBackingBean.retrievePegawaiPengawalByOrgProfileId(purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 106px;"><p:outputLabel
						value="#{lbl['lbl.fl.jabatan']}" /></td>
				<td><p:inputText size="66" id="ptjGroup"
						value="#{purchaseRequestBackingBean.retrieveJabatanByOrgProfileId(purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.prepared.for.ptj']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="width: 560px;"><p:inputText size="8" id="preparedOrgProfileId"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <ac:lov id="preparedPtj"
						lovId="PM_ORG_PROFILE_FL" headerText="#{lbl['lbl.fl.prepared.for.ptj']}"
						saveObject="purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgName}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View' or purchaseRequestBackingBean.isFlFulfilmentApprover()}"
						update=":form:preparedOrgProfileId,:form:issuedOrgCode,:form:issuedOrgName" readonly="true" size="50"
						postUpdateListener="purchaseRequestBackingBean.getAgAccount"
						conditionField="#{purchaseRequestBackingBean.getPreparedPTJCondition()}"
						tooltip="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"	>
					</ac:lov>
				</td>				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.issued.ptj']}" /> </td>
				<td><p:inputText size="8" id="issuedOrgCode"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.pmOrgValidity.orgCode}" />
						<p:spacer width="8"></p:spacer>
						<p:inputText size="50" id="issuedOrgName"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}"></p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.issued.ptj']}"/>	
				</td>
			</tr>										
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.ptj']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="8" id="chargeOrgProfileId" readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.pmOrgValidity.orgCode}" />
					<p:spacer width="5" /> <ac:lov id="chargePtj"
						lovId="PM_ORG_PROFILE" headerText="#{lbl['lbl.fl.charge.ptj']}" readonly="true"
						saveObject="purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgName}" 
						update=":form:chargeOrgProfileId" size="50"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View'}"
						postUpdateListener="purchaseRequestBackingBean.comparePtjGroup"
						conditionField="orgTypeCode.parameterCode^#{ParameterConst.orgTypePtj}|recordStatusFlg^1|pmOrgValidity.recordStatusFlg^1"
						tooltip="#{lbl['lbl.fl.tooltip.charge.ptj']}" >
					</ac:lov>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.acc.office']}" /></td>
				<td><p:inputText size="8" disabled="true" id="agOffice"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.agOffice.officeCode}" />
					<p:spacer width="9" /> <p:inputText size="50" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.agOffice.officeName}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.acc.office']}"/>	
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td rowspan="3" style="width:290px"><p:inputTextarea cols="50" rows="4" id="title"
						maxlength="500" style=" margin-bottom:5px;" label="#{lbl['lbl.fl.title']}"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View'}"/>
						<ac:iconTooltip value="#{lbl['lbl.fl.pr.tooltip.title']}"/></td>
						<td><p:message for="title" display="icon" /></td>
				<td style="width: 134px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementType)}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.procurement.type']}"/>	
				</td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.date']}"/>	
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="50" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementTypeCategory)}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><p:inputText size="12" style="text-align:right;"
						disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.deliveryTerm}" />
					<p:spacer width="5" /> <p:inputText size="2"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.pmUom)}"
						disabled="true" /></td>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.submissionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pr.submission.date']}"/>	
				</td>
			</tr>
			<ui:remove>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.start']}" /></td>
				<td><p:calendar mode="popup" readonlyInput="true"
						showOn="button"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						mindate="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}" 
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View'}"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}">
						<p:ajax event="dateSelect"
							listener="#{purchaseRequestBackingBean.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.end']}" /></td>
				<td><p:calendar id="delEndDate" mode="popup"
						readonlyInput="true"  showOn="button"
						mindate="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}" 
						maxdate="#{purchaseRequestBackingBean.managedBean.maxDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View'}"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.endDate}">
						<p:ajax event="dateSelect"
							listener="#{purchaseRequestBackingBean.updateDeliveryEndDate}" />
					</p:calendar></td>
			</tr>
			</ui:remove>
		</table>
		<table>
		<tr>
			<td><p:selectBooleanCheckbox disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View'}" value="#{purchaseRequestBackingBean.managedBean.declarationCheck}"/></td>
			<td><p:outputLabel style="text-align:left" value="#{lbl['lbl.fl.declaration']}"/></td>
		</tr>
	</table>
	</p:panel>
		
	<p:panel id="supplierPnl" header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 155px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}"/>	
							</td>
							<td><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.mofNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}"/>	
							</td>
						</tr>
					</table></td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width:295px;"><p:inputText size="15" disabled="true" 
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo}"></p:inputText></td>		
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstRegNo}" />
						<ac:iconTooltip value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstRegNo ==null ? lbl['lbl.fl.tooltip.gst.reg.no.na'] : lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstDeclaredDate ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstDeclaredDate ==null ? lbl['lbl.fl.tooltip.ep.declared.date.na'] : lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstEffectiveDate ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstEffectiveDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstEffectiveDate ==null ? lbl['lbl.fl.tooltip.gst.effect.date.na'] : lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="59"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" />
				</td>
				
				<td><p:selectOneMenu id="suppBranch"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.branchCode}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal=='View'}"
						style="width: 360px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="suppBranchList"
							value="#{purchaseRequestBackingBean.managedBean.supplierBranchesList}"
							itemLabel="#{suppBranchList.branchName}"
							itemValue="#{suppBranchList.supplierBranchId}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getSelectedSupplierBranchDtl}"
							update="supplierPnl" />
					</p:selectOneMenu>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.branch']}"/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						id="smAddress" style=" margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.getFullAddress(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.smAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.phoneNo}" /></td>
							<td style="width: 73px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.faxNo}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="51"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPerson}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="51"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactEmail}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
				<td><p:inputText disabled="true" size="15"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.contactPhoneNo}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
