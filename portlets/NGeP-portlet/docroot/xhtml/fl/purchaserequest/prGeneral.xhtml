						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgCode} #{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgName}" />

			</tr>										
		
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.acc.office']}" /></td>

						readonly="true" autoResize="false" style="resize:none;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.agOffice.officeCode} #{purchaseRequestBackingBean.managedBean.fulfilmentRequest.agOfficeName}" />

			</tr>

	</p:panel>
	<p:panel header="#{lbl['lbl.fl.req.details']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}"/>
		<table style="width: 100%">
			<tr>
				<td rowspan="3" valign="top" style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.title']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td rowspan="3" style="width:380px"><p:inputTextarea cols="45" rows="4" id="title"
						onkeyup="limitTextArea(this,500);"
						onkeydown="limitTextArea(this,500);"
						autoResize="false"
						style=" margin-bottom:5px;" label="#{lbl['lbl.fl.title']}"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}">
						<p:ajax update="@this"></p:ajax>
						</p:inputTextarea>
						<ac:iconTooltip value="#{lbl['lbl.fl.pr.tooltip.title']}"/></td>
						<td><p:message for="title" display="icon" /></td>
				<td style="width: 134px;"><p:outputLabel
						value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementType)}" />
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.procurement.type']}"/>	
				</td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText size="25"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td colspan="2"><p:outputLabel value="#{lbl['lbl.fl.prepared.date']}" /></td>
				<td><p:inputText size="25" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.date']}"/>	
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.procur.type.category']}" /></td>
				<td><p:inputText size="30" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementTypeCategory ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.procurementTypeCategory)}" /></td>
			</tr>
			
			<tr>
				<td style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.delivery.period']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td>
								<p:inputText size="12" style="text-align:right;"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.deliveryTerm}" />
								<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.delivery.service.period']}" />							
							</td>
							<ui:remove>
							<td style="width: 208px;"><p:outputLabel styleClass="outputLabel-view"
									value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.fulfilmentRequest.pmUom)}" /></td>
							</ui:remove>
						</tr>
					</table></td>
				<td colspan="2"><p:outputLabel rendered="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.submissionDate != null}"
						value="#{lbl['lbl.fl.submission.date']}" /></td>
				<td>	
				<p:inputText size="25" disabled="true" rendered="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.submissionDate != null}"
					value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.submissionDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.pr.submission.date']}" rendered="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.submissionDate != null}"/></td>
			</tr>
			<!--#17087 icon tooltip -->
           	<tr>
           		<td colspan="5">
           		    <p:outputLabel style="float:left !important; color:red" value="#{lbl['lbl.fl.flag']}" />
           			<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.flag']}" />
           		</td>
			</tr>
			<!--#17087 radio select -->
			<tr>
				<td>
          			<p:outputLabel  value="*" styleClass="mandatory" />
          		</td>
				<td>
					<p:selectOneRadio id="prGeneralRadio" required="true" value="#{purchaseRequestBackingBean.managedBean.radioCheckDeliveryDate}">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}" itemValue="false" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.upDateStartDateFromBpm}" 
							update="delStartDate"/>                   
           			</p:selectOneRadio>
           		</td>
           	</tr>
			<tr>
				<td style="width: 142px;">
				</td>
			</tr>
			<!--#17087 calendar -->
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.start']}" /></td>
				<td><p:calendar id="delStartDate" mode="popup" readonlyInput="true"
						showOn="button"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}">
						<p:ajax event="dateSelect"
							listener="#{purchaseRequestBackingBean.updateDeliveryDate}"
							update="delEndDate" />
					</p:calendar>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.delivery.start.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.delivery.end']}" /></td>
				<td><p:calendar id="delEndDate" mode="popup"
						readonlyInput="true"  showOn="button"
						mindate="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.startDate}" 
						maxdate="#{purchaseRequestBackingBean.managedBean.maxDate}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.endDate}">
						<p:ajax event="dateSelect"
							listener="#{purchaseRequestBackingBean.updateDeliveryEndDate}" />
					</p:calendar></td>
			</tr>
		</table>
		<table>
		<tr>
				<td><p:selectBooleanCheckbox
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
						value="#{purchaseRequestBackingBean.managedBean.declarationCheck}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><h:outputText style="text-align:left" value="#{lbl['lbl.fl.declaration']}"/></td>
		</tr>
	</table>
	</p:panel>
		
	<p:panel id="supplierPnl" header="#{lbl['lbl.fl.supp.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 142px;"><p:outputLabel
						value="#{lbl['lbl.fl.supp.buss.reg.no']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 175px;"><p:inputText size="15"
									disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.regNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.buss.reg.no']}"/>	
							</td>
							<td><p:outputLabel
									value="#{lbl['lbl.fl.supp.mof.no']}" /></td>
							<td><p:inputText size="15" disabled="true"
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.mofNo}" />
								<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.mof.no']}"/>	
							</td>
						</tr>
					</table></td>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.ep.basic.acct.no']}" /></td>
				<td style="width:230px;"><p:inputText size="15" disabled="true" 
									value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.epNo}"></p:inputText></td>		
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.reg.no']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstRegNo ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstRegNo}" />
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.reg.no']}"/></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.ep.declared.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstDeclaredDate ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.ep.declared.date']}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.gst.effective.date']}" /></td>
				<td><p:inputText size="15" disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstEffectiveDate ==null ? lbl['lbl.fl.supp.na'] : purchaseRequestBackingBean.managedBean.fulfilmentRequest.gstEffectiveDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.effect.date']}"/></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="59"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.supplierName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.branch']}" />
				</td>
				
				<td><p:selectOneMenu id="suppBranch"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.branchCode}"
						disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView or empty purchaseRequestBackingBean.managedBean.supplierBranchesList}"
						style="width: 360px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems var="suppBranchList"
							value="#{purchaseRequestBackingBean.managedBean.supplierBranchesList}"
							itemLabel="#{suppBranchList.branchName}"
							itemValue="#{suppBranchList.branchCode}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getSelectedSupplierBranchDtl}"
							update="supplierPnl" />
					</p:selectOneMenu>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.supp.branch']}"/></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea cols="50" rows="8" disabled="true"
						id="smAddress" style=" margin-bottom:5px;"
						autoResize="false"
						value="#{purchaseRequestBackingBean.getFullAddress(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress)}" /></td>
			</tr>
			<tr>
				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.fl.telno']}" /></td>
				<td><table style="width: 100%">
						<tr>
							<td style="width: 25px;"><p:inputText size="25"
									disabled="true"
									value="#{purchaseRequestBackingBean.getText(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.phoneNoFull)}" /></td>
							<td style="width: 66px;"><p:outputLabel
									value="#{lbl['lbl.fl.faxno']}" /></td>
							<td><p:inputText size="25" disabled="true"
									value="#{purchaseRequestBackingBean.getText(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.faxNoFull)}" /></td>
						</tr>
					</table></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.supp.contact.person']}" /></td>
				<td><p:inputText disabled="true" size="70"
						value="#{purchaseRequestBackingBean.getText(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.contactPerson)}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.email']}" /></td>
				<td><p:inputText disabled="true" size="70"
						value="#{purchaseRequestBackingBean.getText(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.contactEmail)}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.contact.telno']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{purchaseRequestBackingBean.getText(purchaseRequestBackingBean.managedBean.fulfilmentRequest.flSupplierDtl.flAddress.contactPhoneNoFull)}" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top">
				<h:panelGroup rendered="#{purchaseRequestBackingBean.managedBean.taskName ne FulfilmentConst.reviewPR}">
						<ui:include src="/xhtml/fl/shared/attachment.xhtml" />
					</h:panelGroup> 
					<h:panelGroup rendered="#{purchaseRequestBackingBean.managedBean.taskName eq FulfilmentConst.reviewPR}">
						<ui:include src="/xhtml/fl/shared/attachmentAuthorize.xhtml" />
					</h:panelGroup></td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
