<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdOrgProfile.orgProfileId}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.purchase.request.no']}" /></td>
				<td><p:inputText style="width: 120px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.jabatan']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.req.note.no']}" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.selectedRequestNote.requestNoteNo}"
						disabled="true" style="width: 120px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.issued.ptj']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.plan.no']}" /></td>
				<td><p:inputText style="width: 120px;"
						value="#{purchaseRequestBackingBean.managedBean.selectedRequestNote.scRequestList.ppPlan.planNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.jabatan']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.procurement.type']}" /></td>
				<td><p:inputText style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.selectedRequestNote.fulfillmentType}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.received.ptj']}" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px; margin-bottom:5px;">
						<f:selectItems />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="* #{lbl['lbl.fl.financial.year']}" /></td>
				<td><p:inputText style="width: 120px"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}" />
				</td>
			</tr>
			<tr>
				<td rowspan="4" valign="top"><p:outputLabel
						value="* #{lbl['lbl.fl.title']}" /></td>
				<td rowspan="4"><p:inputTextarea rows="8"
						style="width: 260px; margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}" /></td>

				<td><p:outputLabel value="* #{lbl['lbl.fl.maksud.code']}" /></td>
				<td><p:selectOneMenu style="width: 260px; margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.maksudId}">
						<f:selectItem itemLabel="Select One" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.ag.office']}" /></td>
				<td><p:selectOneMenu style="width: 260px; margin-bottom:5px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.orgProfileAgoId}">
						<f:selectItem itemLabel="002 KAWANGAN KL" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.financing']} ?" /></td>
				<td><p:selectBooleanCheckbox
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financingLoan}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.creation.date']}" /></td>
				<td><p:inputText style="width: 120px" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.fl.charged.ptj']}" /></td>
				<td><p:selectOneMenu style="width: 260px;">
						<f:selectItems />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.fl.status']}" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<br />
	<br />
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.id']}" /></td>
				<td><p:inputText disabled="true" style="width: 120px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.supplierId}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}" /></td>
				<td><p:inputText disabled="true" style="width: 260px;" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.fl.supp.address']}" /></td>
				<td><p:inputTextarea rows="8"
						style="width: 260px; margin-bottom:5px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.email']}" /></td>
				<td><p:inputText disabled="true" style="width: 260px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.telno']}" /></td>
				<td><p:inputText disabled="true" style="width: 120px;" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="APPROVER DETAIL" toggleable="true">
		<table>
			<tr>
				<td colspan="2"><p:pickList id="pickList"
						value="#{screenDesignListsBean.approverDetails}" var="approver"
						itemLabel="#{approver}" itemValue="#{approver}"
						showTargetControls="true" filterMatchMode="contains">
						<f:facet name="sourceCaption">Available</f:facet>
						<f:facet name="targetCaption">Selected</f:facet>
					</p:pickList> <p:dialog modal="true" showEffect="fade" hideEffect="fade"
						widgetVar="approverDialog">
						<h:panelGrid id="displayApproverDetails" columns="2">
							<h:outputText value="Source: " style="font-weight:bold" />
							<ui:repeat
								value="#{screenDesignListsBean.approverDetails.source}"
								var="item">
								<h:outputText value="#{item}" style="margin-right:5px" />
							</ui:repeat>
							<h:outputText value="Target: " style="font-weight:bold" />
							<ui:repeat
								value="#{screenDesignListsBean.approverDetails.target}"
								var="item">
								<h:outputText value="#{item}" style="margin-right:5px" />
							</ui:repeat>
						</h:panelGrid>

					</p:dialog></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="REMARKS AND ATTACHMENT" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="* Remarks    " /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.flRemark.remark}" /></td>
				<td><p:outputLabel value="Attachment" /></td>
				<td><p:fileUpload
						fileUploadListener="#{purchaseRequestBackingBean.fileUpload}"
						update="messages" mode="advanced" dragDropSupport="false"
						sizeLimit="100000" multiple="true"
						allowTypes="/(\.|\/)(doc|docx|xls|xlsx|pdf)$/" /> <p:growl
						id="messages" showDetail="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
