<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 800px;">
			<tr>
				<td>
				<p:commandButton value="SUBMIT" ajax='false'
					action="#{purchaseRequestBackingBean.fulfillmentRequestAction(action)}" />
				</td>	
				<td colspan="4" align="right">
				<ui:repeat var="bpmAction"
					value="#{purchaseRequestBackingBean.managedBean.actions}">
					<p:commandButton value="#{bpmAction}" ajax='false' action="#{purchaseRequestBackingBean.fulfillmentRequestAction(bpmAction)}" process="@this"/>
				</ui:repeat> 
				</td>
			</tr>
		</table>
	<p:panel header="FULFILMENT DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Ministry" /></td>
				<td><p:inputText style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdOrgProfile.orgProfileId}"
						disabled="true" /></td>
				<td><p:outputLabel value="Purchase Req. NO." /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Issued Jabatan" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems  />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Req. Note NO" /></td>
				<td><p:inputText disabled="true" style="width: 260px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Issued PTJ" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems  />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Plan NO." /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Received Jabatan" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems  />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Procurement Type" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* Received PTJ" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.issuedOrgProfile.orgProfileId}"
						style="width: 260px;">
						<f:selectItems  />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Creation Date" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>
			<tr>
				<td rowspan="4"><p:outputLabel value="* Title" /></td>
				<td rowspan="4"><p:inputTextarea rows="8" style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.title}" /></td>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText style="width: 260px;" disabled="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="*Financial Year" /></td>
				<td><p:selectOneMenu style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financialYear}">
						<f:selectItem itemLabel="2012" itemValue="2012" />
						<f:selectItem itemLabel="2013" itemValue="2013" />
						<f:selectItem itemLabel="2014" itemValue="2014" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" *Maksud  Code" /></td>
				<td><p:selectOneMenu style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.maksudId}">
						<f:selectItem itemLabel="Select One" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><p:outputLabel value="*AG Office" /></td>
				<td><p:selectOneMenu style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.orgProfileAgoId}">
						<f:selectItem itemLabel="002 KAWANGAN KL" itemValue="1" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="*Charge PTJ" /></td>
				<td><p:selectOneMenu style="width: 260px;">
						<f:selectItems />
					</p:selectOneMenu></td>
				<td><p:outputLabel value="Financing?" /></td>
				<td><p:selectBooleanCheckbox
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.financingLoan}" /></td>

			</tr>

		</table>
	</p:panel>
	<br />
	<br />
	<p:panel header="SUPPLIER DETAIL" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="Supplier ID" /></td>
				<td><p:inputText disabled="true" style="width: 120px;"
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.smSupplier.supplierId}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Supplier Name" /></td>
				<td><p:inputText disabled="true" style="width: 260px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText disabled="true" style="width: 260px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Telephone NO." /></td>
				<td><p:inputText disabled="true" style="width: 120px;" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="APPROVER DETAIL" toggleable="true">
		<table>
			<tr>
				<td colspan="2"><p:pickList id="pickList"
						value="#{screenDesignListsBean.approverDetails}" var="approver"
						itemLabel="#{approver}" itemValue="#{approver}">
						<f:facet name="sourceCaption">Available</f:facet>
						<f:facet name="targetCaption">Selected</f:facet>
					</p:pickList> <p:dialog modal="true" showEffect="fade" hideEffect="fade"
						widgetVar="approverDialog">
						<h:panelGrid id="displayApproverDetails" columns="2">
							<h:outputText value="Source: " style="font-weight:bold" />
							<ui:repeat
								value="#{screenDesignListsBean.approverDetails.source}"
								var="item">
								<h:outputText value="#{item}" style="margin-right:5px" />
							</ui:repeat>

							<h:outputText value="Target: " style="font-weight:bold" />
							<ui:repeat
								value="#{screenDesignListsBean.approverDetails.target}"
								var="item">
								<h:outputText value="#{item}" style="margin-right:5px" />
							</ui:repeat>
						</h:panelGrid>

					</p:dialog></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="REMARKS AND ATTACHMENT" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="* Remarks    " /></td>
				<td><p:inputTextarea rows="8" style="width: 260px;"
						value="#{purchaseRequestBackingBean.managedBean.flRemark.remark}" /></td>
				<td><p:outputLabel value="Attachment" /></td>
				<td><p:fileUpload
						fileUploadListener="#{purchaseRequestBackingBean.fileUpload}"
						update="messages" mode="advanced" dragDropSupport="false"
						sizeLimit="100000" multiple="true"
						allowTypes="/(\.|\/)(doc|docx|xls|xlsx|pdf)$/" /> <p:growl
						id="messages" showDetail="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
