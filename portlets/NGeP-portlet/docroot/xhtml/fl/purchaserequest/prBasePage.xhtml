<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<style>
			.gfmasPanelCss>.ui-panel-content {
				background: #f2dede !important;
			}
		</style>		
	</ui:define>
	
	<ui:define name="contentSection">
		<h:panelGroup layout="block" class="ui-messages ui-widget" rendered="#{(purchaseRequestBackingBean.managedBean.fulfilmentRequest.status.statusId.longValue() == FulfilmentStatusCont.prPendingPurchaseRequestCreation.longValue() 
		or purchaseRequestBackingBean.managedBean.fulfilmentRequest.status.statusId.longValue() == FulfilmentStatusCont.prPendingApproval.longValue() 
		or purchaseRequestBackingBean.managedBean.fulfilmentRequest.status.statusId.longValue() == FulfilmentStatusCont.prPendingRevision.longValue() 
		or purchaseRequestBackingBean.managedBean.fulfilmentRequest.status.statusId.longValue() == FulfilmentStatusCont.prPendingRevisionApproval.longValue() 
		or purchaseRequestBackingBean.managedBean.fulfilmentRequest.status.statusId.longValue() == FulfilmentStatusCont.prPendingQueryVerification.longValue()) 
		and not empty purchaseRequestBackingBean.managedBean.disciplinaryActionMessage}">
		<h:panelGroup layout="block" class="ui-messages-info ui-corner-all">
		<h:outputText class="ui-messages-info-icon" /><ul><li>
		<h:outputText class="ui-messages-info-detail" /> #{purchaseRequestBackingBean.managedBean.disciplinaryActionMessage} <p:commandLink id="sharedcommand" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{purchaseRequestBackingBean.viewDisciplinaryAction(purchaseRequestBackingBean.managedBean.smDisciplinaryAction)}" process="@this" partialSubmit="true" update=":form">#{lbl['lbl.sm.disciplinary.here']}</p:commandLink> #{lbl['lbl.sm.supplier.to.view.disc.action.details']}</li></ul>
		</h:panelGroup>
		</h:panelGroup>	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<ac:gpkiPopup 
			textBeforeSign="#{purchaseRequestBackingBean.managedBean.textBeforeSign}"
			postSignAction="#{purchaseRequestBackingBean.preSubmitFulfillmentRequest(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{purchaseRequestBackingBean.enableAutoUpdate()}"	/>
		<c:if test="#{purchaseRequestBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView or purchaseRequestBackingBean.managedBean.isHyperLinkPage()}">
			<ac:title value="#{purchaseRequestBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, ParameterConst.doctypePurchaseRequest)}" />
		</c:if>			
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="#{purchaseRequestBackingBean.managedBean.autoUpdate}" closable="true" severity="error,info" escape="false"/>
		<!-- #28718 - Start -->
		<h:panelGroup layout="block" class="ui-messages ui-widget"
		rendered="#{(purchaseRequestBackingBean.managedBean.triggerPRErrorMsg)}">
		<h:panelGroup layout="block" class="ui-messages-error ui-corner-all">
		<a href="#" class="ui-messages-close" onclick="$(this).parent().slideUp();return false;"><h:outputText class="ui-icon ui-icon-close"></h:outputText></a>
		<h:outputText class="ui-messages-error-icon" /><ul><li>
		<h:outputText class="ui-messages-error-detail" />#{lbl['lbl.fl.error.message1']} <p:commandLink id="triggeredNewPR" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" action="#{purchaseRequestBackingBean.triggeredNewPR()}" process="@this" partialSubmit="true" update=":form"> <u>#{lbl['lb1.fl.error.message3']}</u> </p:commandLink> #{lbl['lb1.fl.error.message2']}</li></ul>		
		</h:panelGroup>
		</h:panelGroup>
		<!-- #28718 - End -->
		<p:panel style="background:#f2dede !important; border:0px;" styleClass="gfmasPanelCss" rendered="#{purchaseRequestBackingBean.managedBean.gfmasError}" >		
			<table>
				<tr>
					<td>
						<p:commandLink oncomplete="gfmasError.show();" immediate="true"
							action="#{purchaseRequestBackingBean.show1GFMASError()}"
							rendered="#{purchaseRequestBackingBean.managedBean.gfmasError}">
							<p:graphicImage value="/css/images/design/exclamation.png" />
						</p:commandLink>
						<p:spacer width="2" />
					</td>
					<td>
						<p:outputLabel value="#{purchaseRequestBackingBean.managedBean.gfmasErrorDesc} #{lbl['lbl.fl.integration.click.for.exception.details']} (ERR-#{purchaseRequestBackingBean.managedBean.gfmasErrorCode})" style="color: #C55751 !important; font-weight: normal !important"
							rendered="#{purchaseRequestBackingBean.managedBean.gfmasError}" />
					</td>					
				</tr>
			</table>
		</p:panel>				
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" rendered="#{purchaseRequestBackingBean.managedBean.taskId==null}"
						action="#{purchaseRequestBackingBean.backToPervious}"  /></td>
				<td colspan="4" style="text-align: right">
			<c:choose>
			<c:when test="#{purchaseRequestBackingBean.managedBean.isPidValidityExpired()}">
			<ui:repeat var="bpmAction" value="#{purchaseRequestBackingBean.managedBean.outComes}">
						<ui:fragment rendered="#{(bpmAction eq 'REJECT')or(bpmAction eq 'CANCEL')}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								process="@form"
								update="@form"
								action="#{purchaseRequestBackingBean.gpkiSignAction(bpmAction)}"/>	
						</ui:fragment>	
					</ui:repeat>
			
			</c:when>
			<c:otherwise>
			<ui:repeat var="bpmAction" value="#{purchaseRequestBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								process="@form"
								update="@form"
								action="#{purchaseRequestBackingBean.gpkiSignAction(bpmAction)}"/>	
					</ui:repeat>
			</c:otherwise>
			</c:choose>
				</td>
				
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq BpmOutcomeConstant.bpmView and !purchaseRequestBackingBean.managedBean.isHyperLinkPage() }'>
					<td colspan="4" style="text-align: right">	
					<p:commandLink
						value="#{lbl['lbl.td.doc.trackingDiary']}"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(purchaseRequestBackingBean.managedBean.fulfilmentRequest.docType,purchaseRequestBackingBean.managedBean.fulfilmentRequest.fulfilmentReqId)}"
						immediate="true" />
					</td>		
				</c:if>
			</tr>
		</table>
		<ui:include src="prReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu" activeIndex="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" >
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.delivery.address.item']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(1)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>	
						<p:menuitem value="#{lbl['lbl.fl.menu.order.summary']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(2)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="2" />
						</p:menuitem>	
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.assignment']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(3)}"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="3" />
						</p:menuitem>	
						<p:menuitem value="#{lbl['lbl.fl.menu.approver.list']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(4)}"
							rendered="#{purchaseRequestBackingBean.isFlFulfilmentRequisitioner()}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="4" />
						</p:menuitem>																								
					</p:tabMenu></td>
				<td width="80%" valign="top">
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 0}" >
						<ui:include src="prGeneral.xhtml" />
					</p:outputPanel>
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="prItem.xhtml" />
					</p:outputPanel>		
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="prordersummary.xhtml" />
					</p:outputPanel>	
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="chargeline.xhtml" />
					</p:outputPanel>	
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 4}">
						<p:panel id="settingId" header="#{lbl['lbl.fl.ptj.approver.details']}" toggleable="true" toggleSpeed="500">
							<h:panelGrid columns="1">
								<h:panelGrid columns="2">
									<h:outputLabel value="#{lbl['lbl.fl.ptj.approver.group']}" style="text-align: top" />
									<p:selectOneMenu style="width:450px; margin-bottom:5px;"
										disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
										value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.pmUserGroup.userGroupId}" >
										<p:ajax event="change" process="@this" update="approverDropdown"
											listener="#{purchaseRequestBackingBean.userGroupChangeListener()}"  />
										<f:selectItems value="#{purchaseRequestBackingBean.getUserGroupDropdown()}" />
									</p:selectOneMenu>
								</h:panelGrid>
								<h:panelGrid columns="2">
									<h:outputLabel value="#{lbl['lbl.rpt.approverName']}" />
									<p:selectOneMenu id="approverDropdown"
										disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
										value="#{purchaseRequestBackingBean.managedBean.selectedApprover}"
										style="width:450px;">
										<f:selectItems
											value="#{purchaseRequestBackingBean.getApproverListDropDown()}" />
									</p:selectOneMenu>
								</h:panelGrid>
							</h:panelGrid>
						</p:panel>
					</p:outputPanel>																			
				</td>
			</tr>
		</table>
		<p:dialog id="gfmasErrorDlg" header="#{lbl['lbl.fl.integration.exception.details']}" widgetVar="gfmasError" width="80%"
			showEffect="fade" hideEffect="fade" modal="true" resizable="false">
			<table style="width: 100%">
				<tr>
					<td><p:messages id="gfmasMsg" showSummary="false" escape="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" /></td>
				</tr>
			</table>
			<p:spacer height="2px"></p:spacer>
			<div style="width: 100%; text-align: right">
				<p:commandButton value="#{lbl['lbl.btn.close']}" oncomplete="gfmasError.hide();" />
			</div>
		</p:dialog>		
		<p:confirmDialog message="#{lbl['lbl.fl.confirmation.cancel.dialogue']}"
				severity="alert" widgetVar="cancelConfirmDlg" closable="true"
				appendToBody="true" header="#{lbl['lbl.msg.confirm.cancel.header']}">
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.yes']}" 
						partialSubmit="true" 
						action="#{purchaseRequestBackingBean.fulfillmentRequestAction(BpmOutcomeConstant.bpmCancel)}"
						onstart="cancelConfirmDlg.hide();blockWidget.show();"
						oncomplete="blockWidget.hide();"/>
					<p:commandButton value="#{lbl['lbl.btn.no']}" 
						partialSubmit="true"
						onclick="cancelConfirmDlg.hide();" />
				</div>
		</p:confirmDialog>	
		<ac:lovPopup />
		<ac:disciplinaryActionHistory voList="#{purchaseRequestBackingBean.managedBean.disciplineVOs}" 
		dialogHeader="#{lbl['lbl.sm.view.details.disciplinary.action.headerlbl']}" dialogWidth="800px" dialogHeight="400px" btnView="true" />
	</ui:define>
</ui:composition>
