<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>
	
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" rendered="#{purchaseRequestBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" action="#{purchaseRequestBackingBean.backToPervious}"  /></td>
				<td colspan="4" style="text-align: right">
					<ui:repeat var="bpmAction" value="#{purchaseRequestBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form" 
							styleClass="ui-button"  onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction(bpmAction)}" />
					</ui:repeat>
				</td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.update']}"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="#{lbl['lbl.btn.cancel']}"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<ui:include src="prReviewHeaderPage.xhtml" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu" activeIndex="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" >
						<p:menuitem value="#{lbl['lbl.fl.menu.general']}" update="@form">
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="0" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.fl.menu.delivery.address.item']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(1)}">
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="1" />
						</p:menuitem>	
						<p:menuitem value="#{lbl['lbl.fl.menu.order.summary']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(2)}">
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="2" />
						</p:menuitem>	
						<p:menuitem value="#{lbl['lbl.fl.menu.charge.line.summary']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(3)}">
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="3" />
						</p:menuitem>	
						<p:menuitem value="#{lbl['lbl.fl.menu.approver.list']}" update="@form" actionListener="#{purchaseRequestBackingBean.onTabChange(4)}"
						rendered="#{purchaseRequestBackingBean.isFlFulfilmentRequisitioner()}" >
							<f:setPropertyActionListener target="#{purchaseRequestBackingBean.managedBean.selectedTabIndex}" value="4" />
						</p:menuitem>																								
					</p:tabMenu></td>
				<td width="80%" valign="top">
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 0}" >
						<ui:include src="prGeneral.xhtml" />
					</p:outputPanel>
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="prItem.xhtml" />
					</p:outputPanel>		
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="prordersummary.xhtml" />
					</p:outputPanel>	
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="chargeline.xhtml" />
					</p:outputPanel>	
					<p:outputPanel rendered="#{purchaseRequestBackingBean.managedBean.selectedTabIndex == 4}">
						<p:panel id="settingId" header="#{lbl['lbl.fl.ptj.approver.details']}" toggleable="true" toggleSpeed="500">
							<h:panelGrid columns="1">
								<h:panelGrid columns="2">
									<h:outputLabel value="#{lbl['lbl.fl.ptj.approver.group']}" style="text-align: top" />
									<p:selectOneMenu style="width:350px; margin-bottom:5px;"
										value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.pmUserGroup.userGroupId}" >
										<p:ajax event="change" process="@this" update="approverpickList"
											listener="#{purchaseRequestBackingBean.userGroupChangeListener()}"  />
										<f:selectItems value="#{purchaseRequestBackingBean.getUserGroupDropdown()}" />
									</p:selectOneMenu>
								</h:panelGrid>
								<h:panelGrid style="width:500px">
									<p:pickList id="approverpickList" var="data" itemValue="#{data}" itemLabel="#{data}"
										value="#{purchaseRequestBackingBean.managedBean.approverModel}"
										showTargetControls="true" filterMatchMode="contains">
										<f:facet name="sourceCaption">#{lbl['lbl.fl.ptj.available']}</f:facet>
										<f:facet name="targetCaption">#{lbl['lbl.fl.ptj.selected']}</f:facet>
										<p:column style="width:75%;">
											<h:outputText value="#{data}" />
										</p:column>
									</p:pickList>
								</h:panelGrid>
							</h:panelGrid>
						</p:panel>
					</p:outputPanel>																			
				</td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
