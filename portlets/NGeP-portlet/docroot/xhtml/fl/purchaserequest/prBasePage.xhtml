<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<f:event listener="#{purchaseRequestBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<table style="width: 100%;">
			<tr>
				<td style="text-align: left; width: 66px;"><p:outputLabel
						value="DOC NO:" rendered="#{not empty purchaseRequestBackingBean.managedBean.fulfilmentRequest.docNo}"/></td>
				<td style="width: 70px"><p:outputLabel
						value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.docNo}" />
				</td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction"
						value="#{purchaseRequestBackingBean.managedBean.outComes}">

						<p:commandButton value="#{bpmAction}" ajax='false'
							styleClass="ui-button" icon="#{iconVar}"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<p:tabView id="prtabs" orientation="left" dynamic="true" cache="true">
			<p:tab id="tab1" title="General">
				<ui:include src="prGeneral.xhtml" />
			</p:tab>
			<p:tab id="tab2" title="Item">
				<ui:include src="prItem.xhtml" />
			</p:tab>
		</p:tabView>

	</ui:define>
</ui:composition>
