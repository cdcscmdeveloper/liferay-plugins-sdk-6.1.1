<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>
	
	<ui:define name="contentSection">
		<f:event listener="#{purchaseRequestBackingBean.preRenderView}"
			type="preRenderView" />
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error,info"></p:messages>
	
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true" rendered="#{purchaseRequestBackingBean.managedBean.taskId==null}"
						icon="ui-icon-back" oncomplete="window.history.back();" /></td>
				<td colspan="4" style="text-align: right"><ui:repeat
						var="bpmAction"
						value="#{purchaseRequestBackingBean.managedBean.outComes}">
						<p:commandButton value="#{bpmAction}" ajax='false'
							styleClass="ui-button"
							icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction(bpmAction)}" />
					</ui:repeat></td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq "Update"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="UPDATE"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction('UPDATE')}">
							<f:param name="actionName" value="UPDATE" />
						</p:commandButton></td>
				</c:if>
				<c:if
					test='#{purchaseRequestBackingBean.managedBean.buttonVal eq "Cancel"}'>
					<td colspan="4" style="text-align: right"><p:commandButton
							value="CANCEL"
							action="#{purchaseRequestBackingBean.fulfillmentRequestAction('CANCEL')}">
							<f:param name="actionName" value="CANCEL" />
						</p:commandButton></td>
				</c:if>
			</tr>
		</table>
		<ui:include src="prReviewHeaderPage.xhtml" />
		<p:spacer height="20px" />
		<p:tabView id="prtabs" orientation="left" dynamic="true" cache="false">
		<p:ajax event="tabChange" listener="#{purchaseRequestBackingBean.onTabChange}" update="#{purchaseRequestBackingBean.className}"></p:ajax>
			<p:tab id="prGeneralTabId" title="General">
				<ui:include src="prGeneral.xhtml" />
			</p:tab>
			<p:tab id="prItemsTabId" title="Delivery Address and Item " >
				<ui:include src="prItem.xhtml" />
			</p:tab>
			<p:tab id="prOrderSummeryTabId" title="Order Summary">
				<ui:include src="prordersummary.xhtml" />
			</p:tab>
			<p:tab id="prChargeLineTabId" title="Charge Line Summary" >
				<ui:include src="chargeline.xhtml" />
			</p:tab>
			<p:tab id="settingsTabId" title="Approval Setting"
				rendered="#{purchaseRequestBackingBean.isFlFulfilmentRequisitioner()}">
				<p:panel id="settingId" header="Approver Setting" toggleable="true"
					toggleSpeed="500">
					<h:panelGrid columns="1">
						<h:panelGrid columns="2">
							<h:outputLabel value="Approver Group" style="text-align: top" />
							<p:selectOneMenu
								value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.pmUserGroup.userGroupId}"
								style="width:350px; margin-bottom:5px;">
								<p:ajax event="change"
									listener="#{purchaseRequestBackingBean.userGroupChangeListener()}"
									process="@this" update="approverpickList" />
								<f:selectItems
									value="#{purchaseRequestBackingBean.getUserGroupDropdown()}" />
							</p:selectOneMenu>

						</h:panelGrid>
						<h:panelGrid style="width:500px">
							<p:pickList id="approverpickList"
								value="#{purchaseRequestBackingBean.managedBean.approverModel}"
								var="data" itemValue="#{data}" itemLabel="#{data}"
								showTargetControls="true" filterMatchMode="contains">
								<f:facet name="sourceCaption">Available</f:facet>
								<f:facet name="targetCaption">Selected</f:facet>
								<p:column style="width:75%;">
									<h:outputText value="#{data}" />
								</p:column>
							</p:pickList>
						</h:panelGrid>
					</h:panelGrid>
				</p:panel>
			</p:tab>
		</p:tabView>

	</ui:define>
</ui:composition>
