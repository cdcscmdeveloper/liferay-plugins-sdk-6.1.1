<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="delAddrPanel" header="#{lbl['lbl.fl.delivery.address']}" toggleable="true" >
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.add.address']}" escape="false"/>
		<!--#17087 icon tooltip and select radio -->
		<!-- #17087 zonal flag check -->
		<c:if test="#{purchaseRequestBackingBean.zonalTest eq '298'}">
		<table style="width: 100%">
			 <tr>
           		<br/>
           		<br/>
           	</tr>
           	<tr>
           		<td>
           		 <p:selectBooleanCheckbox id="prGeneralRadio" required="true" value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.radioCheckDeliveryDate}">
					
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.upDateStartDateFromBpm}" 
							update="delStartDate"/>                   
           			</p:selectBooleanCheckbox>
          			
          		</td>
           		<td>
                <!--  <h:outputText value="#{purchaseRequestBackingBean.zonalTest}"/> -->
               
                            
                <p:outputLabel style="float:left !important; color:red" value="#{lbl['lbl.fl.flag']}"/> 
           			<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.flag']}"/>
				
					<br/>

            	</td>
			</tr>

		</table>		
		 </c:if>
		<p:dataTable id="addressDataTable" var="address"
			value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{purchaseRequestBackingBean.managedBean.selectedDelAddr}"
			selectionMode="single" rowKey="#{address}">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelect"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
				update=":form:itemDetPanelGroup"
				listener="#{purchaseRequestBackingBean.selectAddrEvent()}" />
			<p:column rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}">
				<p:selectBooleanCheckbox value="#{address.selectedAddressRowDelete}"
					styleClass="myCustomChekBox">
					<p:ajax event="change"
						update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
						listener="#{purchaseRequestBackingBean.selectOneCheckboxSelect}"></p:ajax>

				</p:selectBooleanCheckbox>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;text-align:center">
				<p:commandLink oncomplete="addManualDeliveryAddr.show();"
					action="#{purchaseRequestBackingBean.editManualAddress(address)}"
					update=":form:chargeOrgProfileNew,:form:chargeOrgProfileNewHidden,:form:addManualDelAddrDialog,@(.orderSummaryChange)"
					disabled="#{purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
					style="padding-right:5px" rendered="#{address.receivingGrp!=null}">
					<p:graphicImage value="/css/images/design/ico-view-edit.png" />
					<f:setPropertyActionListener
					target="#{purchaseRequestBackingBean.managedBean.required}"
					value="true" />
				</p:commandLink>
				<h:outputText style="text-align:left; float:left;"
					value="#{purchaseRequestBackingBean.getFullAddress(address.flAddress)}" />
			</p:column>
			

			<p:column headerText="#{lbl['lbl.fl.delivery.period']}" style="white-space:normal;text-align:center">
				<h:outputText style="float:left;"
					value="#{address.deliveryTerm} #{purchaseRequestBackingBean.getParameterDesc(address.pmUom)}" />
			</p:column>
			<ui:remove>
			<p:column headerText="#{lbl['lbl.fl.delivery.start']}" style="white-space:normal;">
				<h:outputText value="#{address.startDate}" style="text-align:right">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.end']}" style="white-space:normal;">
				<h:outputText value="#{address.endDate}" style="text-align:right">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			</ui:remove>
			<p:column style="white-space:normal;text-align:center;">
				<f:facet name="header" style="white-space:normal;">
					<h:outputText value="#{lbl['lbl.fl.receiving.officer']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.recv.officer']}"/>
				</f:facet>
				<h:outputText style="text-align:right" />
				<p:commandLink oncomplete="addOfficer.show();" process="@this" 
					action="#{purchaseRequestBackingBean.receivingOfficerList(address)}"
					update=":form:addReceivingOfficerDialog,@(.orderSummaryChange)">
					<p:graphicImage value="/css/images/design/ico-officer.png"
						title="#{lbl['lbl.fl.tooltip.recv.officer']}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<ac:lov id="addressTypeId" lovId="DELIVERY_FULL_ADDRESS_FL"
						postUpdateListener="purchaseRequestBackingBean.updateDeliveryAddrDt"
						headerText="#{lbl['lbl.ct.delivery.address']}" 
						buttonLabel="#{lbl['lbl.fl.btn.ptj.address']}"
						selectionMode="multiple" 
						saveObject="purchaseRequestBackingBean.managedBean.selectedDeliveryFullAddr"
						conditionField="ORG_PROFILE_ID^#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.preparedOrgProfile.orgProfileId},#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.createdOrgProfile.orgProfileId}^9"
						update=":form:addressDataTable,:form:itemDetPanelGroup,:form:messages"
						rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
						/>
			<p:commandButton value="#{lbl['lbl.fl.btn.other.address']}" 
				action="#{purchaseRequestBackingBean.flManualDeliveryAddr}"
				update="addManualDelAddrPnl,@(.orderSummaryChange) "
				rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
				process="@this" oncomplete="addManualDeliveryAddr.show();"
				title="#{lbl['lbl.fl.tooltip.other.address']}">
				<f:setPropertyActionListener
					target="#{purchaseRequestBackingBean.managedBean.required}"
					value="true" />
			</p:commandButton>
			<p:commandButton id="deleteAddrBtn" value="#{lbl['lbl.fl.btn.delete']}"
				onclick="delAddrDlg.show()" process="@this"
				update="addressDataTable,@(.orderSummaryChange)"
				disabled="#{purchaseRequestBackingBean.managedBean.deleteButtonHide}"
				rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
				title="#{lbl['lbl.fl.tooltip.delete']}">
			</p:commandButton>
		</div>
		
		<p:confirmDialog message="#{lbl['lbl.msg.confirm.delete']}"
			severity="alert" widgetVar="delAddrDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					partialSubmit="true" 
					update="deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					action="#{purchaseRequestBackingBean.removeAddRow()}"
					oncomplete="delAddrDlg.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					partialSubmit="true"
					update=":form:deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					action="#{purchaseRequestBackingBean.notRemoveAddressRow()}"
					onclick="delAddrDlg.hide();" />
			</div>
		</p:confirmDialog>		
	</p:panel>
	<h:panelGroup id="itemDetPanelGroup">
		<p:panel id="itemDetPanel" header="#{lbl['lbl.fl.item.list']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.item.list']}" escape="false"  /> 
			<p:commandLink oncomplete="uomRefDialog.show();" value="#{lbl['lbl.fl.instruction.here']}" style="font-size:10px;font-style:italic"
					action="#{purchaseRequestBackingBean.resetMeasurementSearch}" process="@this"
					update=":form:uomRefDlg"/>
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.del.address2']}" />
			<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.item.list2']}" escape="false"  />
			<c:choose>
				<c:when test="#{purchaseRequestBackingBean.managedBean.oldGstRateFlg}">
					<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.tax.guideline1']}" escape="false"  />
					<p:commandLink value="#{lbl['lbl.fl.instruction.here']}" ajax="false" 
						style="font-size:10px;font-style:italic" process="@this"
						action="#{purchaseRequestBackingBean.downloadFile('/shared/FL/Garis_Panduan_Penetapan_Item_Bercukai.pdf')}"></p:commandLink>
					<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.tax.guideline2']}" escape="false"  />
				</c:when>
			</c:choose>
			<p:dataTable id="itemDataTable" var="flItem" 
				rowIndexVar="index"
				value="#{purchaseRequestBackingBean.managedBean.showAllItemsRows}"
				rowKey="#{flItem}">
				<ac:paginator for="itemDataTable" />
				<p:column>
				
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.fl.gst']}" /><br/>
						<c:choose>
							<c:when test="#{purchaseRequestBackingBean.managedBean.oldGstRateFlg}">
						 		<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gst.flag']}"/>
						 	</c:when>
						 </c:choose>
					</f:facet>				
					<p:selectBooleanCheckbox value="#{flItem.gst}"
						disabled="true">
						<p:ajax process="@this" listener="#{purchaseRequestBackingBean.retrieveOrderAmount(flItem)}"
						update="subTotalTxt,unitPrice,orderedQty,itemDataTable"/>
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column style="width:25%;text-align:center">
				<f:facet name="header" style="width:8%;text-align:center">
					<h:outputText value="#{lbl['lbl.fl.item.code']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.details(a)']}"/>
				</f:facet>
				<h:panelGroup style="text-align:left; width:25%">	
					<h:outputText rendered="#{flItem.scRequestItem.cmItem==null}" value="#{flItem.scRequestItem.tempUnspscCode}" title="Requested Quantity: #{flItem.scRequestItem.quantity eq null ? lbl['lbl.fl.supp.na'] : flItem.scRequestItem.quantity}" style="text-align:left; float:left;"/>
					<h:outputText rendered="#{flItem.scRequestItem.cmItem!=null}" value="#{flItem.scRequestItem.cmItem.extensionCode}" title="Requested Quantity: #{flItem.scRequestItem.quantity eq null ? lbl['lbl.fl.supp.na'] : flItem.scRequestItem.quantity}" style="text-align:left; float:left;"/>
					<span style="white-space:pre-wrap; text-align:left; float:left;">(<h:outputText value="#{flItem.scRequestItem.uom.uomName}" />)</span>
							<br />
							<!--#21416 filter item name-->
					<h:outputText value="#{purchaseRequestBackingBean.filterItemName(flItem.scRequestItem.itemName)}" id="itemDesc" style="white-space:pre-wrap; text-align:left; float:left;" />
							<br />
<!--#16344 Display SKU-->
					<h:outputText value="#{purchaseRequestBackingBean.getSkuDescription(flItem.scRequestItem)}"
					style="white-space:pre-wrap; text-align:left; float:left;" />				
				</h:panelGroup>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="white-space:normal;text-align:center">
					<h:outputText disabled="true" size="6" value="#{flItem.unitPrice}" id="unitPrice" style="float:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="white-space:normal;text-align:center">
					<h:outputText disabled="true" size="6" value="#{flItem.gstAmount}" id="gstAmt" style="float:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="white-space:normal;text-align:center">
					<h:outputText disabled="true" size="6" value="#{flItem.gstUnitPrice}" id="gstUnitPrice" style="float:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.qty']}"
					style="width:148px;text-align:center; padding: 0 20px 0 0 !important;">
					<p:inputText value="#{flItem.orderedQty}" size="13" id="orderedQty"
						label="#{lbl['lbl.fl.ordered.qty']}" style="text-align:right"
						styleClass="colFloatLeft"
						maxlength="#{flItem.scRequestItem.uom.decimalScale == 0 ? 13 : 14}"
						disabled="#{purchaseRequestBackingBean.managedBean.selectedDelAddr == null or purchaseRequestBackingBean.managedBean.buttonVal==BpmOutcomeConstant.bpmView}"
						onkeypress="if (event.keyCode == 13) { return false; }">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern"
							value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						<f:attribute name="max"
							value="#{purchaseRequestBackingBean.getItemMaxQuantity(flItem.scRequestItem.uom)}" />
						<f:validator validatorId="quantityDoubleRangeValidator" />
						<p:ajax event="blur"
							update="subTotalTxt,@(.orderSummaryChange),unitPrice,orderedQty,itemDataTable"
							process="@this" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							listener="#{purchaseRequestBackingBean.retrieveOrderAmount(flItem)}" />
						<p:commandLink oncomplete="reqItemInfo.show();" process="@this"
							action="#{purchaseRequestBackingBean.reqItemInfoList(flItem)}"
							update=":form:reqItemInfoDialog,@(.orderSummaryChange)">
							<p:graphicImage value="/css/images/ico-info.png"
								title="#{lbl['lbl.fl.request.item.info']}" />
						</p:commandLink>
					</p:inputText>
					<p:message for="orderedQty" display="icon" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:center">
					<h:outputText id="subTotalTxt" size="5" style="float:right;"
						value="#{flItem.orderedAmt}" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>
	</h:panelGroup>

	<p:dialog id="addManualDelAddrDialog" header="#{lbl['lbl.fl.btn.other.address']}"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		 modal="true" width="900px" position="top" resizable="false">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}" escape="false"/>
		<p:ajax event="close" listener="#{purchaseRequestBackingBean.closeListener}" update="addManualDelAddrDialog" />
		<p:panel id="addManualDelAddrPnl">
			<p:messages id="manualAddrMessages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
			<p:panel header="#{lbl['lbl.fl.delivery.address']}"  toggleable="true" id="delAddrDetails">
			<table style="width: 100%">
				<tr>
					<td width="120"><p:outputLabel value="#{lbl['lbl.fl.country']}" /> <h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="276"><p:selectOneMenu id="manCountry"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="#{lbl['lbl.fl.country']}"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.pmCountry.countryId}"
							style="width: 276px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="countryList"
								value="#{purchaseRequestBackingBean.managedBean.countryList}"
								itemLabel="#{countryList.countryName}"
								itemValue="#{countryList.countryId}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveStateList}"
								update="manState" />
						</p:selectOneMenu></td>
					<td><p:message for="manCountry" display="icon" /></td>
					<td width="150"><p:outputLabel value="#{lbl['lbl.fl.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="210"><p:selectOneMenu id="manState"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="#{lbl['lbl.fl.state']}"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.pmState.stateId}"
							style="width: 210px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="stateList"
								value="#{purchaseRequestBackingBean.managedBean.stateList}"
								itemLabel="#{stateList.stateName}"
								itemValue="#{stateList.stateId}" />
								<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDivisionList}"
								update="manDivison,manDistrict,manCity" />
						</p:selectOneMenu></td>
					<td><p:message for="manState" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="address1" label="#{lbl['lbl.fl.address']}"
							maxlength="255" size="38" 
							required="#{purchaseRequestBackingBean.managedBean.required}"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.address1}"
							onkeypress="if (event.keyCode == 13) { addManualDelAddrBtn.jq.click(); return false; }"/></td>
					<td><p:message for="address1" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.division']}" /></td> 
					<td><p:selectOneMenu id="manDivison"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.pmDivision.divisionId}"
							disabled="#{purchaseRequestBackingBean.managedBean.divisionDisplay}"
							style="width: 180px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="divisionList"
								value="#{purchaseRequestBackingBean.managedBean.divisionList}"
								itemValue="#{divisionList.divisionId}"
								itemLabel="#{divisionList.divisionName}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDistrictList}"
								update="manDistrict,manCity" />
						</p:selectOneMenu>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.manual.addr']}"/></td>
					<td><p:message for="manDivison" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255" size="38" 
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.address2}"
							onkeypress="if (event.keyCode == 13) { addManualDelAddrBtn.jq.click(); return false; }"/></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manDistrict"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="#{lbl['lbl.fl.district']}"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.pmDistrict.districtId}"
							style="width: 210px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="districtList"
								value="#{purchaseRequestBackingBean.managedBean.districtList}"
								itemValue="#{districtList.districtId}"
								itemLabel="#{districtList.districtName}" />
							<p:ajax event="change" 
								listener="#{purchaseRequestBackingBean.retrieveCityList}"
								update="manCity" />
						</p:selectOneMenu></td>
					<td><p:message for="manDistrict" display="icon" /></td>
				</tr>			
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255" size="38" 
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.address3}"
							onkeypress="if (event.keyCode == 13) { addManualDelAddrBtn.jq.click(); return false; }"/></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manCity"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="#{lbl['lbl.fl.city']}"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.pmCity.cityId}"
							style="width: 210px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="cityList"
								value="#{purchaseRequestBackingBean.managedBean.cityList}"
								itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
						</p:selectOneMenu></td>
					<td><p:message for="manCity" display="icon" /></td>
				</tr>	
				<tr>
					<td></td>
					<td></td>
					<td></td>	
					<td><p:outputLabel value="#{lbl['lbl.fl.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="postCode"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="#{lbl['lbl.fl.postcode']}" maxlength="5"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.postcode}"
							validatorMessage="#{lbl['lbl.fl.postal.code.msg']}"
							onkeypress="if (event.keyCode == 13) { addManualDelAddrBtn.jq.click(); return false; }"
							size="10" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
					<td><p:message for="postCode" display="icon" /></td>
				</tr>
				</table>
				</p:panel>
				
				<p:panel header="#{lbl['lbl.fl.goods.receivingdetails']}"  toggleable="true" id="goodsReceivingDetails">
				<table style="width: 100%">
				<tr>
					<td width="120"><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="276"><p:inputText id="contactPerson" 
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="#{lbl['lbl.pm.contact.name']}" maxlength="85" size="34"
							value="#{purchaseRequestBackingBean.managedBean.flManualAddress.flAddress.contactPerson}"
