<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="delAddrPanel" header="#{lbl['lbl.fl.delivery.address']}" toggleable="true" >
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.add.address']}" escape="false"/>
		<p:dataTable id="addressDataTable" var="address"
			value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{purchaseRequestBackingBean.managedBean.selectedDelAddr}"
			selectionMode="single" rowKey="#{address}">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelect"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
				update=":form:itemDetPanelGroup,:form:deleteAddrBtn"
				listener="#{purchaseRequestBackingBean.selectAddrEvent()}" />
			<p:column>
				<p:selectBooleanCheckbox value="#{address.selectedAddressRowDelete}"
					styleClass="myCustomChekBox">
					<p:ajax event="change"
						update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
						listener="#{purchaseRequestBackingBean.selectOneCheckboxSelect}"></p:ajax>

				</p:selectBooleanCheckbox>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.address']}" style="white-space:normal;">
				<p:commandLink oncomplete="addManualDeliveryAddr.show();"
					action="#{purchaseRequestBackingBean.editManualAddress(address)}"
					update=":form:addManualDelAddrDialog,@(.orderSummaryChange)"
					style="padding-right:5px" rendered="#{address.receivingGrp!=null}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
				<h:outputText rendered="#{address.addressType != null}"
					value="#{purchaseRequestBackingBean.getFullAddress(address.addressType.pmAddress)}" />
				<h:outputText rendered="#{address.addressType eq null}"
					value="#{purchaseRequestBackingBean.getFullAddress(address.pmAddress)}" />
			</p:column>
			

			<p:column headerText="#{lbl['lbl.fl.delivery.period']}">
				<p:outputLabel style="text-align:right"
					value="#{address.deliveryTerm} #{purchaseRequestBackingBean.getParameterDesc(address.pmUom)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.start']}">
				<h:outputText value="#{address.startDate}" style="text-align:right">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.delivery.end']}">
				<h:outputText value="#{address.endDate}" style="text-align:right">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.receiving.officer']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.prepared.for.ptj']}"/>
				</f:facet>
				<h:outputText style="text-align:right" />
				<p:commandLink oncomplete="addOfficer.show();"
					action="#{purchaseRequestBackingBean.receivingOfficerList(address)}"
					update=":form:addReceivingOfficerDialog,@(.orderSummaryChange)">
					<p:graphicImage library="ep/images/design" name="register.png"
						value="/resources/ep/images/design/register.png"
						title="Recv Officer List" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.btn.ptj.address']}" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.flDeliveryAddrList}"
				update="delAddr,@(.orderSummaryChange) " process="@this,delAddr"
				oncomplete="addDeliveryAddr.show();" 
				title="#{lbl['lbl.fl.tooltip.recv.officer']}"/>
			<p:commandButton value="#{lbl['lbl.fl.btn.other.address']}" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.flManualDeliveryAddr}"
				update="addManualDelAddrPnl,delAddr,@(.orderSummaryChange) "
				process="@this,delAddr" oncomplete="addManualDeliveryAddr.show();"
				title="#{lbl['lbl.fl.tooltip.other.address']}">
				<f:setPropertyActionListener
					target="#{purchaseRequestBackingBean.managedBean.required}"
					value="true" />
			</p:commandButton>
			<p:commandButton id="deleteAddrBtn" value="#{lbl['lbl.fl.btn.delete']}"
				icon="ui-icon-delete" onclick="delAddrDlg.show()" process="@this"
				update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
				disabled="#{purchaseRequestBackingBean.managedBean.deleteButtonHide}"
				title="#{lbl['lbl.fl.tooltip.delete']}">
			</p:commandButton>
		</div>
		<p:dialog id="delAddrDlg" widgetVar="delAddrDlg"
			header="Delete Confirmation" styleClass="screen-title"
			resizable="false" modal="true" width="325" height="90">
			<h:panelGrid columns="3">
				<p:graphicImage styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea disabled="true"
					value="Are you sure you want to delete this record?" rows="2"
					cols="48" styleClass="ui-inputtextarea" />
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="Yes" icon="ui-icon-accept"
					partialSubmit="true"
					update=":form:deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					action="#{purchaseRequestBackingBean.removeAddRow()}"
					oncomplete="delAddrDlg.hide();" />
				<p:commandButton value="No" icon="ui-icon-reject"
					onclick="delAddrDlg.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
	<h:panelGroup id="itemDetPanelGroup">
		<p:panel id="itemDetPanel" header="#{lbl['lbl.fl.item.list']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.item.list']}" escape="false"/>
			<p:dataTable id="itemDataTable" var="flItem" 
				rowIndexVar="index"
				value="#{purchaseRequestBackingBean.managedBean.showAllItemsRows}"
				rowKey="#{flItem}">
				<ac:paginator for="itemDataTable" />

				<p:column>
				<f:facet name="header" style="width:8%;">
					<h:outputText value="#{lbl['lbl.fl.item.code']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}"/>
				</f:facet>
					<h:outputText rendered="#{flItem.scRequestItem.cmItem==null}" value="#{flItem.scRequestItem.tempUnspscCode}" title="Requested Quantity: #{flItem.scRequestItem.quantity eq null ? 'N/A' : flItem.scRequestItem.quantity}"/>
					<h:outputText rendered="#{flItem.scRequestItem.cmItem!=null}" value="#{flItem.scRequestItem.cmItem.extensionCode}" title="Requested Quantity: #{flItem.scRequestItem.quantity eq null ? 'N/A' : flItem.scRequestItem.quantity}"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.item.name']}" style="white-space:normal;">
					<h:outputText value="#{flItem.scRequestItem.itemName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.uom']}">
					<h:outputText value="#{flItem.scRequestItem.uom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:right">
					<h:outputText disabled="true" size="6" value="#{flItem.unitPrice}" id="unitPrice">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:right">
					<p:inputText value="#{flItem.orderedQty}" size="5" id="orderedQty"
						styleClass="colFloatRight" maxlength="14"
						disabled="#{purchaseRequestBackingBean.managedBean.selectedDelAddr == null}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						<p:ajax event="blur" update="subTotalTxt,@(.orderSummaryChange),unitPrice,orderedQty,itemDataTable"
							process="@this" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
							listener="#{purchaseRequestBackingBean.retrieveOrderAmount(flItem)}" />
					</p:inputText>
					<p:commandLink oncomplete="reqItemInfo.show();"
					action="#{purchaseRequestBackingBean.reqItemInfoList(flItem)}"
					update=":form:reqItemInfoDialog,@(.orderSummaryChange)">
					<p:graphicImage library="ep/images/design" name="tooltips.png"
						value="/resources/ep/images/design/tooltips.png"
						title="Request Item Information" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:right">
					<h:outputText id="subTotalTxt" size="5"
						value="#{flItem.orderedAmt}" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>
	</h:panelGroup>
	<p:dialog id="addDelAddrDialog" header="#{lbl['lbl.fl.add.delivery.address']}"
		widgetVar="addDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true"  width="600" resizable="false">
		<p:dataTable id="delAddr" var="delAddr"
			value="#{purchaseRequestBackingBean.managedBean.addressTypesList}"
			rowKey="#{delAddr.addressTypeId}"
			selection="#{purchaseRequestBackingBean.managedBean.selectedPmDelAddrList}">
			<p:ajax event="rowSelect" update=":form:delAddr" />
			<ac:paginator for="delAddr" />
			<p:column selectionMode="multiple" style="width:2%;text-align:center" />
			<p:column headerText="Address" style="white-space:normal;">
				<h:outputText
					value="#{purchaseRequestBackingBean.getFullAddress(delAddr.pmAddress)}"
					escape="false" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updateDeliveryAddrDt}"
				oncomplete="addDeliveryAddr.hide();"
				update=":form:itemDetPanelGroup,addressDataTable,@(.orderSummaryChange) ">
			</p:commandButton>
		</div>
	</p:dialog>

	<p:dialog id="addManualDelAddrDialog" header="#{lbl['lbl.fl.delivery.address']}"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		visible="#{facesContext.validationFailed}" modal="true" width="900px"
		 resizable="false">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.instruction.mandatory']}" escape="false"/>
		<p:ajax event="close"
			listener="#{purchaseRequestBackingBean.closeListener}"
			update="addManualDelAddrDialog" />
		<p:panel id="addManualDelAddrPnl">
			<p:messages id="manualAddrMessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
				<tr>
					<td width="120"><p:outputLabel value="#{lbl['lbl.fl.country']}" /> <h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="manCountry"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Country"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmCountry.countryId}"
							style="width: 212px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="countryList"
								value="#{purchaseRequestBackingBean.managedBean.countryList}"
								itemLabel="#{countryList.countryName}"
								itemValue="#{countryList.countryId}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveStateList}"
								update="manState" />
						</p:selectOneMenu></td>
					<td><p:message for="manCountry" display="icon" /></td>
					<td width="150"><p:outputLabel value="#{lbl['lbl.fl.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="manState"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="State"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmState.stateId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="stateList"
								value="#{purchaseRequestBackingBean.managedBean.stateList}"
								itemLabel="#{stateList.stateName}"
								itemValue="#{stateList.stateId}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDivisionList}"
								update="manDivison,manDistrict" />
						</p:selectOneMenu></td>
					<td colspan="2"><p:message for="manState" display="icon" /></td>
				</tr>
				<tr>
					<td width="126"><p:outputLabel value="#{lbl['lbl.fl.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="address1" label="Address Line 1"
							maxlength="255"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address1}"
							size="35" /></td>
					<td><p:message for="address1" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.division']}" /></td>
					<td><p:selectOneMenu id="manDivison"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmDivision.divisionId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="divisionList"
								value="#{purchaseRequestBackingBean.managedBean.divisionList}"
								itemValue="#{divisionList.divisionId}"
								itemLabel="#{divisionList.divisionName}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDistrictList}"
								update="manDistrict" />
						</p:selectOneMenu></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address2}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manDistrict"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="District"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmDistrict.districtId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="districtList"
								value="#{purchaseRequestBackingBean.managedBean.districtList}"
								itemValue="#{districtList.districtId}"
								itemLabel="#{districtList.districtName}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveCityList}"
								update="manCity" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDeliveryAddressList}"
								update="manAddress" />
						</p:selectOneMenu></td>
					<td><p:message for="manDistrict" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address3}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manCity"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="City"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmCity.cityId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="cityList"
								value="#{purchaseRequestBackingBean.managedBean.cityList}"
								itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
						</p:selectOneMenu></td>
					<td><p:message for="manCity" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="" /></td>
					<td><p:inputText maxlength="255"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address4}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="postCode"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Post Code" maxlength="10"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.postcode}"
							 validatorMessage="Postal Code - must be a number Example: 0-9"
							size="34" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
					<td><p:message for="postCode" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.email']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:inputText id="email"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Email" maxlength="80"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.email}"
							validatorMessage="Email - Invalid Email Format"
							size="35" ><f:validateRegex disabled="#{purchaseRequestBackingBean.managedBean.emailValidate}"
       						pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
       					</p:inputText>	
       					
       				</td>
       				<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.email']}"/>
       				<p:message for="email" display="icon" /></td>
       				
					<td><p:outputLabel value="#{lbl['lbl.fl.delivery.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manAddress" label="Manual Address"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.receivingGrp.addressTypeId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="delAddByDistrict"
								value="#{purchaseRequestBackingBean.managedBean.manualAddrList}" />
						</p:selectOneMenu>
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.delivery.address']}"/>
						<p:message for="manAddress" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.telno']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="telNo"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Tel No" maxlength="20"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.phoneNo}"
							validatorMessage="Tel.No. - must be a number Example: 0-9"
							size="35" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
							</td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.tel.no']}"/>
							<p:message for="telNo" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.faxno']}" /></td>
					<td><p:inputText maxlength="20"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.faxNo}"
							 validatorMessage="Fax.No. - must be a number Example: 0-9"
							size="35" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
							</td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.fax.no']}"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.mobile']}" /></td>
					<td><p:inputText maxlength="20"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.mobileNo}"
							 validatorMessage="Mobile.No. - must be a number Example: 0-9"
							size="35" required="false" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
							</td>
							<td><ac:iconTooltip value="#{lbl['lbl.fl.tooltip.mobile.no']}"/></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-accept"
				process="@this addManualDelAddrDialog"
				action="#{purchaseRequestBackingBean.updateManualDeliveryAddrDt}"
				update="itemDetPanelGroup,addManualDelAddrPnl,addressDataTable,@(.orderSummaryChange)">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel" process="@this"
				action="#{purchaseRequestBackingBean.closeListener}"
				partialSubmit="true">
			</p:commandButton>
		</div>
	</p:dialog>

	<p:dialog id="addPurchasedItemDialog" header="#{lbl['lbl.fl.item.list']}"
		widgetVar="addItems" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="purchasedItemDt" var="purchasedItem"
			value="#{purchaseRequestBackingBean.managedBean.requestNoteWithDtlsList}"
			rowKey="#{purchasedItem}"
			selection="#{purchaseRequestBackingBean.managedBean.selectedPurchasedItemList}">
			<p:ajax event="rowSelect" update=":form:addPurchasedItemDialog"
				process="@this" />
			<ac:paginator for="purchasedItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="#{lbl['lbl.fl.item.type']}"></p:column>
					<p:column rowspan="1" headerText="#{lbl['lbl.fl.item.code']}"></p:column>
					<p:column rowspan="1" headerText="#{lbl['lbl.fl.item.name']}"></p:column>
					<p:column rowspan="1" headerText="#{lbl['lbl.fl.uom']}"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText />
			</p:column>
			<p:column>
				<h:outputText />
			</p:column>
			<p:column>
				<h:outputText
					value="#{purchasedItem.scRequestSupplierItem.requestNoteItem.itemName}" />
			</p:column>
			<p:column>
				<h:outputText />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updatePurchasedItemDt}"
				oncomplete="addItems.hide();"
				update="itemDataTable,@(.orderSummaryChange)"
				process="@this,purchasedItemDt">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="addReceivingOfficerDialog" header="#{lbl['lbl.fl.receiving.officer']}"
		widgetVar="addOfficer" showEffect="fade" hideEffect="fade"
		modal="true" width="600" resizable="false">
		<p:dataTable id="receivingOfficerDt" var="receivingOfficer"
			value="#{purchaseRequestBackingBean.managedBean.receivingOffList}"
			rowKey="#{purchasedItem}">
			<ac:paginator for="receivingOfficerDt" />
			<p:column headerText="#{lbl['lbl.fl.receiving.officer.name']}">
				<h:outputText value="#{receivingOfficer.pmUser.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.telno']}">
				<h:outputText value="#{receivingOfficer.pmUser.phoneNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.email']}">
				<h:outputText value="#{receivingOfficer.pmUser.email}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="#{lbl['lbl.fl.cancel']}" icon="ui-icon-cancel"
				oncomplete="addOfficer.hide();" update="addressDataTable"
				process="@this,receivingOfficerDt">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="reqItemInfoDialog" header="#{lbl['lbl.fl.requested.item']}"
		widgetVar="reqItemInfo" showEffect="fade" hideEffect="fade"
		modal="true" width="900" resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseRequestBackingBean.managedBean.itemName}"
						size="60" /></td>
			</tr>
			<tr>		
				<td><p:outputLabel value="#{lbl['lbl.fl.requested.qty']}" style="text-align:right"/></td>
				<td><p:inputText disabled="true" 
						value="#{purchaseRequestBackingBean.managedBean.quantity ==0 ? 'N/A' : purchaseRequestBackingBean.managedBean.quantity}"
						size="35" ><f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" /></p:inputText></td>
			</tr>
			<tr>			
				<td><p:outputLabel value="#{lbl['lbl.fl.price.type']}" /></td>
				<td><p:inputText disabled="true" rendered="#{purchaseRequestBackingBean.managedBean.priceType != null}"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.priceType)}" 
						size="35" /></td>					
			</tr>
			<tr>			
				<td><p:outputLabel value="#{lbl['lbl.fl.standard.price']}" rendered="#{purchaseRequestBackingBean.managedBean.standardPrice}"/></td>
				<td><p:inputText disabled="true"  rendered="#{purchaseRequestBackingBean.managedBean.standardPrice}"
						value="#{purchaseRequestBackingBean.managedBean.standardUnitPrice}" 
						size="35" >
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>					
			</tr>
		</table> 
		<h:panelGroup rendered="#{!purchaseRequestBackingBean.managedBean.standardPrice}">
			<p:panel id="reqItemInfoPanel" header="#{lbl['lbl.fl.zone.tier.price.detail']}" toggleable="false" >
				<p:dataTable id="reqItemInfoDt" var="reqItemInfoList" liveScroll="true"
					value="#{purchaseRequestBackingBean.managedBean.supplierItemPriceList}"
					rowKey="#{purchasedItem}">
					<ac:paginator for="reqItemInfoDt" />
					<p:column headerText="Zone" rendered="#{purchaseRequestBackingBean.managedBean.zonalPrice || purchaseRequestBackingBean.managedBean.zonalTierPrice}">
						<p:tree value="#{reqItemInfoList.itemZoneTree}" var="location" rendered="#{purchaseRequestBackingBean.managedBean.zonalPrice || purchaseRequestBackingBean.managedBean.zonalTierPrice}">
							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.from.qty']}" style="text-align:right" rendered="#{!purchaseRequestBackingBean.managedBean.zonalPrice }">
						<h:outputText value="#{reqItemInfoList.supplierItemPrice.fromQty}" styleClass="colFloatRight" rendered="#{!purchaseRequestBackingBean.managedBean.zonalPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>			
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.to.qty']}" style="text-align:right" rendered="#{!purchaseRequestBackingBean.managedBean.zonalPrice}">
						<h:outputText value="#{reqItemInfoList.supplierItemPrice.toQty}" styleClass="colFloatRight" rendered="#{!purchaseRequestBackingBean.managedBean.zonalPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>			
					</p:column>
					<p:column headerText="#{lbl['lbl.fl.price.offered']}" style="text-align:right" >
						<h:outputText value="#{reqItemInfoList.supplierItemPrice.itemPrice}" styleClass="colFloatRight" >
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:panelGroup>
	</p:dialog>
</ui:composition>
