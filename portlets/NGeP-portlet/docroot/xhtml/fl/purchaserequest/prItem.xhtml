<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="delAddrPanel" header="DELIVERY ADDRESS" toggleable="true" >
		Please select the address to show the items.
		<p:dataTable id="addressDataTable" var="address"
			value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{purchaseRequestBackingBean.managedBean.selectedDelAddr}"
			selectionMode="single" rowKey="#{address}">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelect"
				update=":form:itemDetPanelGroup,:form:deleteAddrBtn"
				listener="#{purchaseRequestBackingBean.selectAddrEvent()}" />
			<p:column>
				<p:selectBooleanCheckbox value="#{address.selectedAddressRowDelete}"
					styleClass="myCustomChekBox">
					<p:ajax event="change"
						update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
						listener="#{purchaseRequestBackingBean.selectOneCheckboxSelect}"></p:ajax>

				</p:selectBooleanCheckbox>
			</p:column>
			<p:column headerText="Delivery Address" style="white-space:normal;">
				<p:commandLink oncomplete="addManualDeliveryAddr.show();"
					action="#{purchaseRequestBackingBean.editManualAddress(address)}"
					update=":form:addManualDelAddrDialog,@(.orderSummaryChange)"
					style="padding-right:5px" rendered="#{address.receivingGrp!=null}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
				<h:outputText rendered="#{address.addressType != null}"
					value="#{purchaseRequestBackingBean.getFullAddress(address.addressType.pmAddress)}" />
				<h:outputText rendered="#{address.addressType eq null}"
					value="#{purchaseRequestBackingBean.getFullAddress(address.pmAddress)}" />
			</p:column>
			

			<p:column headerText="Delivery Term">
				<p:outputLabel style="text-align:right"
					value="#{address.deliveryTerm} #{purchaseRequestBackingBean.getParameterDesc(address.pmUom)}" />
			</p:column>
			<p:column headerText="Delivery Start">
				<h:outputText value="#{address.startDate}" style="text-align:right">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Delivery End">
				<h:outputText value="#{address.endDate}" style="text-align:right">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText=" Recv. Officer">
				<h:outputText style="text-align:right" />
				<p:commandLink oncomplete="addOfficer.show();"
					action="#{purchaseRequestBackingBean.receivingOfficerList(address)}"
					update=":form:addReceivingOfficerDialog,@(.orderSummaryChange)">
					<p:graphicImage library="ep/images/design" name="register.png"
						value="/resources/ep/images/design/register.png"
						title="Recv Officer List" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="PTJ Address" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.flDeliveryAddrList}"
				update="delAddr,@(.orderSummaryChange) " process="@this,delAddr"
				oncomplete="addDeliveryAddr.show();" />
			<p:commandButton value="Manual Address" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.flManualDeliveryAddr}"
				update="addManualDelAddrPnl,delAddr,@(.orderSummaryChange) "
				process="@this,delAddr" oncomplete="addManualDeliveryAddr.show();">
				<f:setPropertyActionListener
					target="#{purchaseRequestBackingBean.managedBean.required}"
					value="true" />
			</p:commandButton>
			<p:commandButton id="deleteAddrBtn" value="Delete"
				icon="ui-icon-delete" onclick="delAddrDlg.show()" process="@this"
				update=":form:deleteAddrBtn,addressDataTable,@(.orderSummaryChange)"
				disabled="#{purchaseRequestBackingBean.managedBean.deleteButtonHide}">
			</p:commandButton>
		</div>
		<p:dialog id="delAddrDlg" widgetVar="delAddrDlg"
			header="Delete Confirmation" styleClass="screen-title"
			resizable="false" modal="true" width="325" height="90">
			<h:panelGrid columns="3">
				<p:graphicImage styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea
					value="Are you sure you want to delete this record?" rows="2"
					cols="48" styleClass="ui-inputtextarea" />
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="Yes" icon="ui-icon-accept"
					partialSubmit="true"
					update=":form:deleteAddrBtn,itemDetPanelGroup,addressDataTable,@(.orderSummaryChange)"
					action="#{purchaseRequestBackingBean.removeAddRow()}"
					oncomplete="delAddrDlg.hide();" />
				<p:commandButton value="No" icon="ui-icon-reject"
					onclick="delAddrDlg.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
	<h:panelGroup id="itemDetPanelGroup">
		<p:panel id="itemDetPanel" header="ITEM LIST" toggleable="true">
			<p:dataTable id="itemDataTable" var="flItem" 
				rowIndexVar="index"
				value="#{purchaseRequestBackingBean.managedBean.showAllItemsRows}"
				rowKey="#{flItem}">
				<ac:paginator for="itemDataTable" />

				<p:column headerText=" Item Code">
					<h:outputText value="#{flItem.scRequestItem.cmItem.extensionCode}" title="Requested Quantity: #{flItem.scRequestItem.quantity}"/>
				</p:column>
				<p:column headerText="Item Name" style="white-space:normal;">
					<h:outputText value="#{flItem.scRequestItem.itemName}" />
				</p:column>
				<p:column headerText="UOM">
					<h:outputText value="#{flItem.scRequestItem.uom.uomName}" />
				</p:column>
				<p:column headerText="Unit Price (RM)" style="text-align:right">
					<h:outputText disabled="true" size="6" value="#{flItem.unitPrice}" id="unitPrice">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="Ordered Qty." style="text-align:right">
					<p:inputText value="#{flItem.orderedQty}" size="5"
						styleClass="colFloatRight" maxlength="14"
						disabled="#{purchaseRequestBackingBean.managedBean.selectedDelAddr == null}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, flItem.scRequestItem.uom.uomCode)}" />
						<p:ajax event="blur" update="subTotalTxt,@(.orderSummaryChange),unitPrice "
							process="@this"
							listener="#{purchaseRequestBackingBean.retrieveOrderAmount(flItem)}" />
					</p:inputText>
				</p:column>
				<p:column headerText="Ordered Amt.(RM)" style="text-align:right">
					<h:outputText id="subTotalTxt" size="5"
						value="#{flItem.orderedAmt}" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>
	</h:panelGroup>
	<p:dialog id="addDelAddrDialog" header="Add Delivery Address"
		widgetVar="addDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true"  width="600" resizable="false">
		<p:dataTable id="delAddr" var="delAddr"
			value="#{purchaseRequestBackingBean.managedBean.addressTypesList}"
			rowKey="#{delAddr.addressTypeId}"
			selection="#{purchaseRequestBackingBean.managedBean.selectedPmDelAddrList}">
			<p:ajax event="rowSelect" update=":form:delAddr" />
			<ac:paginator for="delAddr" />
			<p:column selectionMode="multiple" style="width:2%;text-align:center" />
			<p:column headerText="Address" style="white-space:normal;">
				<h:outputText
					value="#{purchaseRequestBackingBean.getFullAddress(delAddr.pmAddress)}"
					escape="false" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updateDeliveryAddrDt}"
				oncomplete="addDeliveryAddr.hide();"
				update=":form:itemDetPanelGroup,addressDataTable,@(.orderSummaryChange) ">
			</p:commandButton>
		</div>
	</p:dialog>

	<p:dialog id="addManualDelAddrDialog" header="Delivery Address"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		visible="#{facesContext.validationFailed}" modal="true" width="900px"
		 resizable="false">
		<p:ajax event="close"
			listener="#{purchaseRequestBackingBean.closeListener}"
			update="addManualDelAddrDialog" />
		<p:panel id="addManualDelAddrPnl">
			<p:messages id="manualAddrMessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
				<tr>
					<td width="120"><p:outputLabel value="Country" /> <h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="manCountry"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Country"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmCountry.countryId}"
							style="width: 212px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="countryList"
								value="#{purchaseRequestBackingBean.managedBean.countryList}"
								itemLabel="#{countryList.countryName}"
								itemValue="#{countryList.countryId}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveStateList}"
								update="manState" />
						</p:selectOneMenu></td>
					<td><p:message for="manCountry" display="icon" /></td>
					<td width="150"><p:outputLabel value="State" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="manState"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="State"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmState.stateId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="stateList"
								value="#{purchaseRequestBackingBean.managedBean.stateList}"
								itemLabel="#{stateList.stateName}"
								itemValue="#{stateList.stateId}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDivisionList}"
								update="manDivison,manDistrict" />
						</p:selectOneMenu></td>
					<td><p:message for="manState" display="icon" /></td>
				</tr>
				<tr>
					<td width="126"><p:outputLabel value="Address Line 1" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="address1" label="Address Line 1"
							maxlength="255"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address1}"
							size="35" /></td>
					<td><p:message for="address1" display="icon" /></td>
					<td><p:outputLabel value="Divison" /></td>
					<td><p:selectOneMenu id="manDivison"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmDivision.divisionId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="divisionList"
								value="#{purchaseRequestBackingBean.managedBean.divisionList}"
								itemValue="#{divisionList.divisionId}"
								itemLabel="#{divisionList.divisionName}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDistrictList}"
								update="manDistrict" />
						</p:selectOneMenu></td>
					<td></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Line 2" /></td>
					<td><p:inputText maxlength="255"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address2}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="District" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manDistrict"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="District"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmDistrict.districtId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="districtList"
								value="#{purchaseRequestBackingBean.managedBean.districtList}"
								itemValue="#{districtList.districtId}"
								itemLabel="#{districtList.districtName}" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveCityList}"
								update="manCity" />
							<p:ajax event="change"
								listener="#{purchaseRequestBackingBean.retrieveDeliveryAddressList}"
								update="manAddress" />
						</p:selectOneMenu></td>
					<td><p:message for="manDistrict" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Line 3" /></td>
					<td><p:inputText maxlength="255"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address3}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="City/Town" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manCity"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="City"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.pmCity.cityId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="cityList"
								value="#{purchaseRequestBackingBean.managedBean.cityList}"
								itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
						</p:selectOneMenu></td>
					<td><p:message for="manCity" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Line 4" /></td>
					<td><p:inputText maxlength="255"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.address4}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="Postal Code" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="postCode"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Post Code" maxlength="10"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.postcode}"
							size="34" /></td>
					<td><p:message for="postCode" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Email" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:inputText id="email"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Email" maxlength="80"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.email}"
							size="35" /></td>
					<td><p:message for="email" display="icon" /></td>
					<td><p:outputLabel value="Delivery Address" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="manAddress" label="Manual Address"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.receivingGrp.addressTypeId}"
							style="width: 207px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="delAddByDistrict"
								value="#{purchaseRequestBackingBean.managedBean.manualAddrList}" />

						</p:selectOneMenu></td>
					<td><p:message for="manAddress" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Tel.No." /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="telNo"
							required="#{purchaseRequestBackingBean.managedBean.required}"
							label="Tel No" maxlength="20"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.phoneNo}"
							size="35" /></td>
					<td><p:message for="telNo" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax.No." /></td>
					<td><p:inputText maxlength="20"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.faxNo}"
							size="35" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Mobile.No." /></td>
					<td><p:inputText maxlength="20"
							value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.pmAddress.mobileNo}"
							size="35" required="false" /></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Ok" icon="ui-icon-accept"
				process="@this addManualDelAddrDialog"
				action="#{purchaseRequestBackingBean.updateManualDeliveryAddrDt}"
				update="itemDetPanelGroup,addManualDelAddrPnl,addressDataTable,@(.orderSummaryChange)">
			</p:commandButton>
			<p:commandButton value="Cancel" icon="ui-icon-cancel" process="@this"
				action="#{purchaseRequestBackingBean.closeListener}"
				partialSubmit="true">
			</p:commandButton>
		</div>
	</p:dialog>

	<p:dialog id="addPurchasedItemDialog" header="ITEM LIST"
		widgetVar="addItems" showEffect="fade" hideEffect="fade" modal="true"
		width="600" resizable="false">
		<p:dataTable id="purchasedItemDt" var="purchasedItem"
			value="#{purchaseRequestBackingBean.managedBean.requestNoteWithDtlsList}"
			rowKey="#{purchasedItem}"
			selection="#{purchaseRequestBackingBean.managedBean.selectedPurchasedItemList}">
			<p:ajax event="rowSelect" update=":form:addPurchasedItemDialog"
				process="@this" />
			<ac:paginator for="purchasedItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Item Type"></p:column>
					<p:column rowspan="1" headerText="Item Code"></p:column>
					<p:column rowspan="1" headerText="Item Name"></p:column>
					<p:column rowspan="1" headerText="UOM"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText />
			</p:column>
			<p:column>
				<h:outputText />
			</p:column>
			<p:column>
				<h:outputText
					value="#{purchasedItem.scRequestSupplierItem.requestNoteItem.itemName}" />
			</p:column>
			<p:column>
				<h:outputText />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Add" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updatePurchasedItemDt}"
				oncomplete="addItems.hide();"
				update="itemDataTable,@(.orderSummaryChange)"
				process="@this,purchasedItemDt">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="addReceivingOfficerDialog" header="RECEIVING OFFICER"
		widgetVar="addOfficer" showEffect="fade" hideEffect="fade"
		modal="true" width="600" resizable="false">
		<p:dataTable id="receivingOfficerDt" var="receivingOfficer"
			value="#{purchaseRequestBackingBean.managedBean.receivingOffList}"
			rowKey="#{purchasedItem}">
			<ac:paginator for="receivingOfficerDt" />
			<p:column headerText="Receiving Officer Name">
				<h:outputText value="#{receivingOfficer.pmUser.userName}" />
			</p:column>
			<p:column headerText="Tel. No.">
				<h:outputText value="#{receivingOfficer.pmUser.phoneNo}" />
			</p:column>
			<p:column headerText="Email">
				<h:outputText value="#{receivingOfficer.pmUser.email}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Close" icon="ui-icon-cancel"
				oncomplete="addOfficer.hide();" update="addressDataTable"
				process="@this,receivingOfficerDt">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
