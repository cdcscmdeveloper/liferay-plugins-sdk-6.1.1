<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="DELIVERY ADDRESS" toggleable="true">
		<p:dataTable id="addressDataTable" var="address" width="100%">
			<ac:paginator for="addressDataTable" />
			<p:column headerText="Delivery Address">
				<h:outputText value=" " />
			</p:column>
			<p:column headerText="Exp. Delivery (Start)">
				<h:outputText value=" " />
			</p:column>
			<p:column headerText="Exp. Delivery (End)">
				<h:outputText />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink id="deleteLink" styleClass="ui-icon ui-icon-trash" />
			</p:column>
		</p:dataTable>
		<table style="width: 100%;">

			<tr>
				<td colspan="6" style="text-align: right"><p:commandButton
						value="ADD" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="ITEM DETAIL" toggleable="true">
		<table style="width: 100%;">
			<tr>
				<td colspan="6" style="text-align: right"><p:commandButton
						value="ACTION" /></td>
			</tr>
		</table>
		<p:dataTable id="itemDataTable" var="item" width="100%">
			<ac:paginator for="itemDataTable" />
			<p:column headerText="Product Code">
				<h:outputText />
			</p:column>
			<p:column headerText="Item Name">
				<h:outputText />
			</p:column>
			<p:column headerText="GOSODO">
				<h:outputText />
			</p:column>
			<p:column headerText="Activity Code">
				<h:outputText />
			</p:column>
			<p:column headerText="Unit Price (MYR)">
				<h:outputText />
			</p:column>
			<p:column headerText="Ord. Qty.">
				<h:outputText />
			</p:column>
			<p:column headerText="Sub Total">
				<h:outputText />
			</p:column>
			<p:column headerText="Action">
				<p:commandLink id="deleteLink" styleClass="ui-icon ui-icon-trash" />
			</p:column>
		</p:dataTable>
		<f:verbatim>
			<hr width="12" />
		</f:verbatim>
	</p:panel>
</ui:composition>
