<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="delAddrPanel" header="DELIVERY ADDRESS" toggleable="true">

		<p:dataTable id="addressDataTable" var="address"
			value="#{purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
			rowIndexVar="index"
			selection="#{purchaseRequestBackingBean.managedBean.selectedDelAddr}"
			rowKey="#{address}" lazy="true">
			<ac:paginator for="addressDataTable" />
			<p:ajax event="rowSelectRadio"
				update=":form:prtabs:itemDetPanelGroup,:form:prtabs:deleteAddrBtn"
				listener="#{purchaseRequestBackingBean.selectAddrEvent()}" />
			<p:column selectionMode="single" width="5%" />
			<p:column headerText="Delivery Address">
				<h:outputText
					value="#{address.addressType.pmAddress.address1}, #{address.addressType.pmAddress.address2}, #{address.addressType.pmAddress.address3}, #{address.addressType.pmAddress.address4}" />
			</p:column>
			<p:column headerText="Exp. Delivery (Start)">
				<p:calendar value="#{address.startDate}" id="calStartDate"
					pattern="dd/MM/yyyy" showOn="button" />
			</p:column>
			<p:column headerText="Exp. Delivery (End)">
				<p:calendar value="#{address.endDate}" id="calEndDate"
					pattern="dd/MM/yyyy" showOn="button" />
			</p:column>
			<p:column rendered="#{address.checkManualAddress}">
				<p:commandLink oncomplete="addManualDeliveryAddr.show();"
					action="#{purchaseRequestBackingBean.editManualAddress(address)}"
					update=":form:prtabs:addManualDelAddrDialog"
					style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="PTJ Address" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.flDeliveryAddrList}"
				update="delAddr" process="@this,delAddr"
				oncomplete="addDeliveryAddr.show();" />
			<p:commandButton value="Manual Address" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.flManualDeliveryAddr}"
				update="delAddr" process="@this,delAddr"
				oncomplete="addManualDeliveryAddr.show();" />
			<p:commandButton id="deleteAddrBtn" value="Delete"
				icon="ui-icon-delete" onclick="delAddrDlg.show()" process="@this"
				disabled="#{purchaseRequestBackingBean.managedBean.selectedDelAddr == null}">
			</p:commandButton>
		</div>
		<p:confirmDialog message="Do you want to delete the record?"
			severity="alert" widgetVar="delAddrDlg" closable="true"
			appendToBody="true" header="Delete Confirmation">
			<h:panelGrid columns="2">
				<p:commandButton value="Yes" icon="ui-icon-accept"
					partialSubmit="true"
					action="#{purchaseRequestBackingBean.removeAddRow()}"
					update=":form:prtabs:deleteAddrBtn,:form:prtabs:itemDetPanelGroup,addressDataTable"
					oncomplete="delAddrDlg.hide();" />
				<p:commandButton value="No" icon="ui-icon-reject"
					onclick="delAddrDlg.hide()" type="button" />
			</h:panelGrid>
		</p:confirmDialog>
	</p:panel>
	<h:panelGroup id="itemDetPanelGroup">
		<p:panel id="itemDetPanel" header="ITEM DETAIL" toggleable="true"
			rendered="#{null != purchaseRequestBackingBean.managedBean.selectedDelAddr}">
			<p:dataTable id="itemDataTable" var="flItem" lazy="true"
				rowIndexVar="index"
				value="#{purchaseRequestBackingBean.managedBean.selectedDelAddr.flFulfilmentItemAddr}"
				selection="#{purchaseRequestBackingBean.managedBean.selectedItemsRows}"
				rowKey="#{flItem}">
				<ac:paginator for="itemDataTable" />
				<p:column selectionMode="multiple" width="5%" />
				<p:column headerText="Type">
					<h:outputText
						value="#{flItem.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemType}" />
				</p:column>
				<p:column headerText="Item Name">
					<h:outputText
						value="#{flItem.flFulfilmentItem.scRequestNoteDtl.scRequestSupplierItem.requestNoteItem.itemName}" />
				</p:column>
				<p:column headerText="VOT/fund">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="VOT1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Prog./proj.">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="PROG1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Setia">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="SETIA1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Sub Setia">
					<p:selectOneMenu>
						<f:selectItem itemLabel="-- Select One -- "  />
						<f:selectItem itemLabel="SUBset1" itemValue="1" />
					</p:selectOneMenu>
				</p:column>
				<p:column headerText="Asset Ind.">
					<h:outputText value="AILE" >
					</h:outputText>
				</p:column>
				<p:column headerText="Charge Code">
					<h:outputText value="#{flItem.pmDo.doId}" >
					</h:outputText>
				</p:column>
				<p:column headerText="Unit Price (MYR)">
					<p:inputText disabled="true" value="#{flItem.unitPrice}"
						style="text-align:right">
						<f:convertNumber pattern="#,###.00" />
					</p:inputText>
				</p:column>
				<p:column headerText="Ord. Qty.">
					<p:inputText value="#{flItem.orderedQty}" style="text-align:right">
						<p:ajax event="blur" update="subTotalTxt" process="@this"
							listener="#{purchaseRequestBackingBean.retrieveOrderAmount(flItem)}" />
					</p:inputText>
				</p:column>
				<p:column headerText="Sub Total">
					<p:inputText id="subTotalTxt" value="#{flItem.orderedAmt}"
						disabled="true" style="text-align:right">
						<f:convertNumber pattern="#,###.00" />
					</p:inputText>
				</p:column>
			</p:dataTable>
			<p:spacer height="2px"></p:spacer>
			<div style="width: 100%; text-align: right">
				<p:commandButton id="addItems" value="ADD" icon="ui-icon-add"
					action="#{purchaseRequestBackingBean.addPurchsedItems}"
					rendered="#{not empty purchaseRequestBackingBean.managedBean.fulfilmentRequest.flDeliveryAddresses}"
					update="purchasedItemDt" process="@this,purchasedItemDt"
					oncomplete="addItems.show();" />
				<p:commandButton value="Delete" icon="ui-icon-delete"
					rendered="#{not empty purchaseRequestBackingBean.managedBean.selectedDelAddr}"
					action="#{purchaseRequestBackingBean.removeItemRow}"
					update="itemDataTable" partialSubmit="true" />
			</div>
		</p:panel>
	</h:panelGroup>
	<p:panel header="#{lbl['lbl.fl.remark.attachment']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/remark.xhtml" /></td>
				<td width="50%" valign="top"><ui:include
						src="/xhtml/fl/shared/attachment.xhtml" /></td>
			</tr>
		</table>
	</p:panel>

	<p:dialog id="addDelAddrDialog" header="Add Delivery Address"
		widgetVar="addDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true" height="450" width="600" resizable="false">
		<p:dataTable id="delAddr" var="delAddr"
			value="#{purchaseRequestBackingBean.managedBean.addressTypesList}"
			rowKey="#{delAddr.addressTypeId}"
			selection="#{purchaseRequestBackingBean.managedBean.selectedPmDelAddrList}">
			<p:ajax event="rowSelect" update=":form:prtabs:delAddr" />
			<ac:paginator for="delAddr" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Address"></p:column>
					<p:column rowspan="1" headerText="Ptj Name"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText
					value="#{delAddr.pmAddress.address1}, #{delAddr.pmAddress.address2}, #{delAddr.pmAddress.address3}, #{delAddr.pmAddress.address4}"
					escape="false" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="ADD" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updateDeliveryAddrDt}"
				oncomplete="addDeliveryAddr.hide();" update="addressDataTable">
			</p:commandButton>
		</div>
	</p:dialog>

	<p:dialog id="addManualDelAddrDialog" header="Delivery Address"
		widgetVar="addManualDeliveryAddr" showEffect="fade" hideEffect="fade"
		modal="true" width="800px" height="450px" resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Country" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.pmCountry.countryId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="MALAYSIA" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.address1}"
						size="35" /></td>
				<td><p:outputLabel value="City/Town" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.pmCity.cityCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="KUALA SELANGOR" itemValue="124" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.address2}"
						size="35" /></td>
				<td><p:outputLabel value="Distict" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.pmDistrict.districtId}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="TAMAN MEDAN" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.address3}"
						size="35" /></td>
				<td><p:outputLabel value="Divison" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.pmDivision.divisionId}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.address4}"
						size="35" /></td>
				<td><p:outputLabel value="State" /></td>
				<td><p:selectOneMenu
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.pmState.stateCode}"
						style="width: 207px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select One -- " itemValue="" />
						<f:selectItem itemLabel="SELANGOR" itemValue="1" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Postal Code" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.postcode}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Contact Person" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.contactName}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Tel.No." /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.phoneNo}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Fax.No." /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.faxNo}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Mobile.No." /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.mobileNo}"
						size="35" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="Email" /></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.flManulaAddress.addressType.pmAddress.email}"
						size="35" /></td>

			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Ok" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updateManualDeliveryAddrDt}"
				oncomplete="addManualDeliveryAddr.hide();" update="addressDataTable">
			</p:commandButton>
			<p:commandButton value="Cancel" icon="ui-icon-add"
				oncomplete="addManualDeliveryAddr.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="addPurchasedItemDialog" header="Add Contract Items"
		widgetVar="addItems" showEffect="fade" hideEffect="fade" modal="true"
		height="450" width="600" resizable="false">
		<p:dataTable id="purchasedItemDt" var="purchasedItem"
			value="#{purchaseRequestBackingBean.managedBean.requestNoteWithDtlsList}"
			rowKey="#{purchasedItem}"
			selection="#{purchaseRequestBackingBean.managedBean.selectedPurchasedItemList}">
			<p:ajax event="rowSelect"
				update=":form:prtabs:addPurchasedItemDialog" process="@this" />
			<ac:paginator for="purchasedItemDt" />
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="1" headerText=""></p:column>
					<p:column rowspan="1" headerText="Item"></p:column>
				</p:row>
			</p:columnGroup>
			<p:column selectionMode="multiple" />
			<p:column>
				<h:outputText
					value="#{purchasedItem.scRequestSupplierItem.requestNoteItem.itemName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Add" icon="ui-icon-add"
				action="#{purchaseRequestBackingBean.updatePurchasedItemDt}"
				oncomplete="addItems.hide();" update="itemDataTable"
				process="@this,purchasedItemDt">
			</p:commandButton>
		</div>
	</p:dialog>
</ui:composition>
