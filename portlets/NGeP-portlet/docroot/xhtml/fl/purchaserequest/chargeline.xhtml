<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="CHARGE ASSIGNMENT" id="chargeAss" toggleable="true" styleClass="prChargeLinePnlClass">

		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="chargeLineChange"
			selection="#{purchaseRequestBackingBean.managedBean.selectedNode}"
			selectionMode="single"
			value="#{purchaseRequestBackingBean.managedBean.chargeLineItemRoot}" >
			<p:ajax event="expand" 
                onstart="blockTreeTable.show();" oncomplete="blockTreeTable.hide();" />  
			<p:ajax event="select"
				listener="#{purchaseRequestBackingBean.onNodeSelect()}"
				update="@(.chargeLineSection)" />
			<p:ajax event="unselect"
				listener="#{purchaseRequestBackingBean.onNodeUnSelect()}"
				update="@(.chargeLineSection)"></p:ajax>
			<p:column>
				<p:selectBooleanCheckbox
					value="#{chargeLineNode.selectedChargeItem}"
					rendered="#{chargeLineNode.parent == 'true'}"
					styleClass="myCustomChekBox">
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column headerText="COA">
				<h:outputText value="#{chargeLineNode.coaValue}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Item Code">
				<h:outputText
					value="#{chargeLineNode.cmItem.extensionCode}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Item Name" style="white-space:normal;">
				<h:outputText value="#{chargeLineNode.scRequestItem.itemName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="UOM" style="white-space:normal;">
				<h:outputText value="#{chargeLineNode.scRequestItem.uom.uomName}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="Unit Price (RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.unitPrice}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Qty." style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeOrderedQty}"
					rendered="#{chargeLineNode.parent == 'false'}" >
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Ordered Amt.(RM)" style="text-align:right">
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="Query">

			</p:column>
		</p:treeTable>
		<p:blockUI widgetVar="blockTreeTable"  block="chargeLineTbl">  
			<p:graphicImage value="/resources/ep/images/ajax-loader.gif"></p:graphicImage>  
		</p:blockUI> 
		
		<br />
		<br />
		<br />
		<table style="width: 93%">
			<tr>
				<td style="text-align: right; font: bold; size: 10;">Grand
					Total: <p:spacer width="10px" />
					<h:outputText
						value="#{purchaseRequestBackingBean.managedBean.orderedAmtGrandTotal}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</td>
			</tr>
		</table>
		<table style="width: 100%;">
			<tr>

				<td colspan="4" style="text-align: left"><p:commandButton
						value="Update COA" icon="ui-icon-add" ajax='true'
						styleClass="ui-button" process="@this,chargeAss"
						update=":form:applyBulkChargeDialog"
						action="#{purchaseRequestBackingBean.clearPopupLists}" /></td>

			</tr>
		</table>
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.vot.code']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{purchaseRequestBackingBean.managedBean.votFundCode}"
							size="9" disabled="true" /> </td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.asset.ind']}" /></td>
					<td><p:inputText value="#{purchaseRequestBackingBean.getParameterDesc(ParameterTypeConst.assetInd,purchaseRequestBackingBean.managedBean.assetIndCode)}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.asset.gosodo']}" /></td>
					<td><p:inputText value="#{purchaseRequestBackingBean.managedBean.glAccountCode}"
							size="9" disabled="true" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.program.activity']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{purchaseRequestBackingBean.managedBean.prgActivityCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.Project']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{purchaseRequestBackingBean.managedBean.projectCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.fl.charge.setia.subsetia']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText
							value="#{purchaseRequestBackingBean.managedBean.setiaCode}"
							size="9" disabled="true" /></td>
					<td><p:inputText
							value="#{purchaseRequestBackingBean.managedBean.subSetiaCode}"
							size="9" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.charge.cp']}"
							style="margin-bottom:15px;" /></td>
					<td><p:inputText value="#{purchaseRequestBackingBean.getParameterDesc(ParameterTypeConst.financingType,purchaseRequestBackingBean.managedBean.financingTypeCode)}"
							size="9" disabled="true" /></td>

				</tr>
			</table>
		</h:panelGroup>
		
	</p:panel>
	<p:dialog id="queryDialog" header="QUERY" widgetVar="addQuery"
		showEffect="fade" hideEffect="fade" modal="true" width="600px"
		resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="Item Code" /></td>
				<td><p:inputText disabled="true" size="20"
						value="#{purchaseRequestBackingBean.queryItemCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Item Name" /></td>
				<td><p:inputText disabled="true" size="35"
						value="#{purchaseRequestBackingBean.queryItemName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Query Description" /></td>
				<td><p:inputTextarea cols="50" rows="6" disabled="true"
						style=" margin-bottom:5px;" /></td>
			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Close" icon="ui-icon-close"
				oncomplete="addQuery.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	<p:dialog id="applyBulkChargeDialog" header="Bulk Update"
		widgetVar="applyBulkCharge" showEffect="fade" hideEffect="fade"
		modal="true" width="500px" resizable="false">
		<p:panel id="bulkUpdatePnl">
		<p:messages id="bulkUpdateMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.vot.code']}"
						style="margin-bottom:15px;" /></td>
				<td><p:selectOneMenu id="votCode"
						value="#{purchaseRequestBackingBean.managedBean.votFundId}"
						style="width: 207px; margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="votCodeList"
							value="#{purchaseRequestBackingBean.managedBean.votFundList}"
							itemLabel="#{votCodeList.votFundCode}"
							itemValue="#{votCodeList.votFundId}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getProjectList}"
							update="project" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getProgramList}"
							update="prgActivity" />
						<p:ajax event="change"
							update="setia" />
						<p:ajax event="change"
							update="subSetia" />			
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.asset.ind']}" /></td>
				<td><p:selectOneMenu style="margin-bottom:15px;" value="#{purchaseRequestBackingBean.managedBean.assetIndId}" >
						<f:selectItems value="#{purchaseRequestBackingBean.getDropdownValues(ParameterTypeConst.assetInd)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.asset.gosodo']}" /></td>
				<td><p:selectOneMenu style="margin-bottom:15px;" value="#{purchaseRequestBackingBean.managedBean.glAccountId}" >
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="glAccount"
							value="#{purchaseRequestBackingBean.managedBean.glAccountList}"
							itemLabel="#{glAccount.glAccCode}"
							itemValue="#{glAccount.glAccountId}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.fl.charge.program.activity']}"
						style="margin-bottom:15px;" /></td>
				<td><p:selectOneMenu id="prgActivity" disabled="#{purchaseRequestBackingBean.managedBean.votFundType eq 'A' or empty purchaseRequestBackingBean.managedBean.prgActivityList}"
						value="#{purchaseRequestBackingBean.managedBean.prgActivityId}"
						style="width: 207px; margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="prgActivityList"
							value="#{purchaseRequestBackingBean.managedBean.prgActivityList}"
							itemLabel="#{prgActivityList.prgActivityCode}"
							itemValue="#{prgActivityList.prgActivityId}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.Project']}"
						style="margin-bottom:15px;" /></td>
				<td><p:selectOneMenu id="project" disabled="#{purchaseRequestBackingBean.managedBean.votFundType eq 'A' or empty purchaseRequestBackingBean.managedBean.projectList}"
						value="#{purchaseRequestBackingBean.managedBean.projectId}"
						style="width: 207px; margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="projectList"
							value="#{purchaseRequestBackingBean.managedBean.projectList}"
							itemLabel="#{projectList.projectCode}"
							itemValue="#{projectList.projectId}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getSetiaList}"
							update="setia" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.setia']}"
						style="margin-bottom:15px;" /></td>
				<td><p:selectOneMenu id="setia" disabled="#{purchaseRequestBackingBean.managedBean.votFundType eq 'A' or purchaseRequestBackingBean.managedBean.votFundType eq 'B' or empty purchaseRequestBackingBean.managedBean.setiaList}"
						value="#{purchaseRequestBackingBean.managedBean.setiaId}"
						style="width: 207px; margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="setiaList"
							value="#{purchaseRequestBackingBean.managedBean.setiaList}"
							itemLabel="#{setiaList.setiaCode}"
							itemValue="#{setiaList.setiaId}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getSubSetiaList}"
							update="subSetia" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.subsetia']}"
						style="margin-bottom:15px;" /></td>
				<td><p:selectOneMenu id="subSetia" disabled="#{purchaseRequestBackingBean.managedBean.votFundType eq 'A' or purchaseRequestBackingBean.managedBean.votFundType eq 'B' or empty purchaseRequestBackingBean.managedBean.subSetiaList}"
						value="#{purchaseRequestBackingBean.managedBean.subSetiaId}"
						style="width: 207px; margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="subSetiaList"
							value="#{purchaseRequestBackingBean.managedBean.subSetiaList}"
							itemLabel="#{subSetiaList.subSetiaCode}"
							itemValue="#{subSetiaList.subSetiaId}" />
						<p:ajax event="change"
							listener="#{purchaseRequestBackingBean.getFinancingType}"
							update="financingType" />							
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.charge.cp']}"
						style="margin-bottom:15px;" /></td>
				<td>
					<p:inputText id="financingType" disabled="true" 
						value="#{purchaseRequestBackingBean.getParameterDesc(ParameterTypeConst.financingType,purchaseRequestBackingBean.managedBean.financingTypeCode)}" />
				</td>
			</tr>
		</table>
		</p:panel>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Apply" icon="ui-icon-accept" 
				process="@this,chargeAss,applyBulkChargeDialog"
				update="bulkUpdatePnl,chargeLineTbl,chargeAss"
				action="#{purchaseRequestBackingBean.chargeLineApply}">
			</p:commandButton>
			<p:commandButton value="Cancel" icon="ui-icon-cancel"
				oncomplete="applyBulkCharge.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	
</ui:composition>
