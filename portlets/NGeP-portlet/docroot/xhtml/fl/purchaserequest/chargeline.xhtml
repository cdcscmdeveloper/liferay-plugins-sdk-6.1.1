<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.fl.charge.assignment']}" id="chargeAss" toggleable="true" styleClass="prChargeLinePnlClass">
	<h:outputText styleClass="instruction" value="#{lbl['lbl.fl.instruction.charge.assignment']}" escape="false"/>
		<p:treeTable id="chargeLineTbl" var="chargeLineNode"
			styleClass="chargeLineChange"
			selection="#{purchaseRequestBackingBean.managedBean.selectedNode}"
			selectionMode="single"
			style="width: 100%"
			value="#{purchaseRequestBackingBean.managedBean.chargeLineItemRoot}" >
			<p:ajax event="expand" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />  
			<p:ajax event="select" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				listener="#{purchaseRequestBackingBean.onNodeSelect()}"
				update="chargeLineTbl,@(.chargeLineSection)" 
				disabled="#{purchaseRequestBackingBean.managedBean.selectChargeLineRow=='true'}"/>
			<p:ajax event="unselect"
				listener="#{purchaseRequestBackingBean.onNodeUnSelect()}"
				update="chargeLineTbl,@(.chargeLineSection)"
				disabled="#{purchaseRequestBackingBean.managedBean.selectChargeLineRow=='true'}"></p:ajax>
			<p:column />
			<p:column style="white-space:normal;width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox 
						onchange="goToSelectAll()"
						rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
						value="#{purchaseRequestBackingBean.selectAllCheckbox}">
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					value="#{chargeLineNode.selectedChargeItem}"
					rendered="#{chargeLineNode.parent == 'true' and purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
					styleClass="myCustomChekBox">
				<p:ajax event="change"
					listener="#{purchaseRequestBackingBean.selectCheckbox}"
					update="chargeLineTbl,@(.chargeLineSection)"/>	
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="white-space:normal;width:10%;text-align:center;" >
				<f:facet name="header" style="white-space:normal;width:8%;">
					<h:outputText value="#{lbl['lbl.fl.charge.line.coa']}"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.charge.complete']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<p:graphicImage rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.coaValue == 'Y' }"
					value="/css/images/design/ico-check.png" title="#{chargeLineNode.coaValue}" />		
				<p:graphicImage rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.coaValue != 'Y' }"
					value="/css/images/design/ico-reject.png" title="#{chargeLineNode.coaValue}" />								
			</p:column>
			<p:column sortBy="#{chargeLineNode.cmItem.extensionCode}" style="width:25%;">
				<f:facet name="header" style="white-space:normal;">
					<h:outputText value="#{lbl['lbl.fl.item.details']}" style="text-align:center;"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.details']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.scRequestItem.cmItem==null}" value="#{chargeLineNode.scRequestItem.tempUnspscCode}" style="text-align:left; float:left;"/>
				<h:outputText rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.scRequestItem.cmItem!=null}" value="#{chargeLineNode.scRequestItem.cmItem.extensionCode}" style="text-align:left; float:left;"/>
				<h:outputText value="(" rendered="#{chargeLineNode.parent == 'true'}" />
					<h:outputText value="#{chargeLineNode.scRequestItem.uom.uomName}" 
					rendered="#{chargeLineNode.parent == 'true'}" style="white-space:normal;"/>
					<h:outputText value=")" rendered="#{chargeLineNode.parent == 'true'}" />		
				<br />
				<h:outputText value="#{chargeLineNode.scRequestItem.itemName}" id="itemDesc" style="text-align:left; float:left;"
					title="#{chargeLineNode.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : chargeLineNode.scRequestItem.itemDesc}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<ui:remove>
			<p:column sortBy="#{chargeLineNode.cmItem.extensionCode}" style="width:15%;">
				<f:facet name="header" style="white-space:normal;width:8%;">
					<h:outputText value="#{lbl['lbl.fl.item.code']}" style="text-align:center;"/>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.item.code']}"/>
				</f:facet>
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.scRequestItem.cmItem==null}" value="#{chargeLineNode.scRequestItem.tempUnspscCode}" style="float:right;"/>
				<h:outputText rendered="#{chargeLineNode.parent == 'true' and chargeLineNode.scRequestItem.cmItem!=null}" value="#{chargeLineNode.scRequestItem.cmItem.extensionCode}" style="float:right;"/>			
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.item']}" style="white-space:normal;text-align:center">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.scRequestItem.itemName}" id="itemDesc" style="text-align:left; float:left;"
					title="#{chargeLineNode.scRequestItem.itemDesc ==null ? lbl['lbl.fl.item.desc.na'] : chargeLineNode.scRequestItem.itemDesc}"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.uom']}" style="white-space:normal;text-align:center">
			 	<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.scRequestItem.uom.uomName}" style="float:left;"
					rendered="#{chargeLineNode.parent == 'true'}" />
			</p:column>
			</ui:remove>
			<p:column headerText="#{lbl['lbl.fl.unit.price']}" style="text-align:center;white-space:normal">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.unitPrice}" style="float:right;"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.gst.amt']}" style="text-align:center;white-space:normal">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.gstAmount}" style="float:right;"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.unit.price.w.gst']}" style="text-align:center;white-space:normal">
				<f:facet name="footer">
					<h:outputText value=""></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.gstUnitPrice}" style="float:right;"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.qty']}" style="text-align:center;" >
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.fl.charge.line.grandtotal']}"></h:outputText>			
				</f:facet>
				<h:outputText value="#{chargeLineNode.chargeOrderedQty}" style="float:right;"
					rendered="#{chargeLineNode.parent == 'false'}" >
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, chargeLineNode.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.ordered.amount']}" style="text-align:center;width:15%;">
				<f:facet name="footer">
					<h:outputText
						value="#{purchaseRequestBackingBean.managedBean.orderedAmtGrandTotal}" style="float:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>		
				</f:facet>
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}" style="float:right;"
					rendered="#{chargeLineNode.parent == 'true'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<h:outputText value="#{chargeLineNode.chargeOrderedAmt}" style="float:right;"
					rendered="#{chargeLineNode.parent == 'false'}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column rendered="#{purchaseRequestBackingBean.managedBean.queryDisplay}">
			<f:facet name="header" style="width:8%;">
			<h:outputText style="text-align:right" />
				
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.query']}"/>
			</f:facet>
			<p:commandLink oncomplete="addQuery.show();"
					action="#{purchaseRequestBackingBean.showItemQuery(chargeLineNode)}"
					 rendered="#{purchaseRequestBackingBean.managedBean.queryDisplay and chargeLineNode.parent == 'false' and chargeLineNode.flFulfilmentItem.flQuery != null}"
					update=":form:queryDialog,@(.orderSummaryChange)">
					<p:graphicImage value="/css/images/design/exclamation.png"
						title="Query" />
				</p:commandLink>
			</p:column>
		</p:treeTable>
		<p:remoteCommand action="#{purchaseRequestBackingBean.selectAllCheckboxes}"
				name="goToSelectAll" update="chargeLineTbl,@(.chargeLineSection)"/>
		
		<br />
		<br />
		<br />
		<h:panelGroup styleClass="chargeLineSection" id="chargeLineSection">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.fl.asset.ind']}" /><h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 150px; margin-bottom:5px;" value="#{purchaseRequestBackingBean.managedBean.assetIndId}" disabled="#{!purchaseRequestBackingBean.managedBean.chargeLinePanel}">
						<p:ajax update="@this"></p:ajax>
						<f:selectItems value="#{purchaseRequestBackingBean.getDropdownValues(ParameterTypeConst.assetInd)}" />
					</p:selectOneMenu></td>
					<td style="width:95px;"><p:outputLabel value="#{lbl['lbl.fl.vot']}" /></td>
					<td>
					<h:panelGroup styleClass="votCode2" id="votCode2">
					<ac:lov id="pmVotCode"
						lovId="PM_VOT" headerText="#{lbl['lbl.fl.vot']}"
						saveObject="purchaseRequestBackingBean.managedBean.pmVoteFund"
						update=":form:fundLov,:form:pmActiveLov,:form:projectLov,:form:setiaCode,:form:subSetiaCode,:form:cpCode"
						readonly="true"	size="7"
						disabled="#{!purchaseRequestBackingBean.managedBean.chargeLinePanel}" 
						postUpdateListener="purchaseRequestBackingBean.checkVotLov" 
						conditionField="pmOrgProfile.orgProfileId^#{purchaseRequestBackingBean.retrieveJabatanOrgProfile(purchaseRequestBackingBean.managedBean.fulfilmentRequest.chargeOrgProfile.orgProfileId).orgProfileId}"
						value="#{purchaseRequestBackingBean.managedBean.votFundCode}"	
						tooltip="#{lbl['lbl.fl.tooltip.vot.code']}" >
					</ac:lov>
					</h:panelGroup>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.fund']}" /></td> 
					<td><h:panelGroup styleClass="fundLov" id="fundLov"><ac:lov id="fund"
						lovId="PM_VOT_FUND" headerText="#{lbl['lbl.fl.fund.code']}"
						saveObject="purchaseRequestBackingBean.managedBean.pmVoteFund"
						update=":form:votCode2,:form:pmActiveLov,:form:projectLov,:form:setiaCode,:form:subSetiaCode,:form:cpCode"
						readonly="true"
						size="4"
						disabled="#{!purchaseRequestBackingBean.managedBean.chargeLinePanel}" 
						postUpdateListener="purchaseRequestBackingBean.checkVotFundLov" 
						conditionField="votFundCode^#{purchaseRequestBackingBean.managedBean.feeVoteFund.votFundCode}^2"
						value="#{purchaseRequestBackingBean.managedBean.pmVoteFund.votFundCode}"	>
					</ac:lov></h:panelGroup></td>
					<td></td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.program.activiti']}" /></td>
					<td ><h:panelGroup styleClass="pmActiveLov" id="pmActiveLov"><ac:lov id="pmActive"
						lovId="PM_PRG_ACTIVITY" headerText="#{lbl['lbl.fl.program.activiti']}"
						saveObject="purchaseRequestBackingBean.managedBean.pmPrgActivity"
						readonly="true"
						size="7"
						disabled="#{!purchaseRequestBackingBean.managedBean.programLov}" 
						conditionField="pmVotFund.votFundId^#{purchaseRequestBackingBean.managedBean.votFundId}" 
						value="#{purchaseRequestBackingBean.managedBean.pmPrgActivity.prgActivityCode}"	>
					</ac:lov></h:panelGroup></td>
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.project']}" /></td> 
					<td><h:panelGroup styleClass="projectLov" id="projectLov"><ac:lov id="pmProject"
						lovId="PM_PROJECT" headerText="#{lbl['lbl.fl.project']}"
						saveObject="purchaseRequestBackingBean.managedBean.pmSubSetia"
						readonly="true"
						size="7"
						disabled="#{!purchaseRequestBackingBean.managedBean.projectLov}" 
						update=":form:setiaCode,:form:subSetiaCode,:form:cpCode" 
						conditionField="pmVotFund.votFundId^#{purchaseRequestBackingBean.managedBean.votFundId}" 
						value="#{purchaseRequestBackingBean.managedBean.pmSubSetia.projectCode}"	>
					</ac:lov>
					</h:panelGroup></td>
					<td><p:outputLabel value="#{lbl['lbl.fl.setia.subsetia']}" /></td> 
					<td><h:panelGroup styleClass="setiaLov" id="setiaLov">
						<p:inputText size="2" id="setiaCode"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.pmSubSetia.setiaCode}" /><p:inputText size="2" id="subSetiaCode"
						readonly="true"
						value="#{purchaseRequestBackingBean.managedBean.pmSubSetia.subSetiaCode}" /></h:panelGroup>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.fl.cp']}" /></td> 
					<td>
						<p:inputText size="5" id="cpCode"
						readonly="true"
						value="#{purchaseRequestBackingBean.getParameterDesc(purchaseRequestBackingBean.managedBean.pmSubSetia.financingType)}" />
					</td>		
				</tr>
				<tr>
					<td colspan="3"><p:outputLabel value="#{lbl['lbl.fl.gosodo']}" /></td> 
					<td><h:panelGroup styleClass="gosodoLov" id="gosodoLov">
					<p:inputText 
						size="7"
						id="itSelectedGlAccount" 
						value="#{purchaseRequestBackingBean.managedBean.gosodo.glAccCode}" 
						readonly="true"
						/>
					&#160;	
					<p:commandLink id="gosodo" 
						partialSubmit="true"
						disabled="#{!purchaseRequestBackingBean.managedBean.chargeLinePanel}"
						process="@this" 
						readonly="true" 
						oncomplete="accountCode.show();"
						update="@form">
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
					</p:commandLink>
					<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.gosodo']}"/>
					</h:panelGroup>
					</td>
				</tr>
			</table>	
			<table style="width: 100%;">
			<tr>
				<td colspan="4" style="text-align: right"><p:commandButton title="#{lbl['lbl.fl.btn.bulk.update']}"
						value="#{lbl['lbl.fl.bulk.update']}" ajax='true'
						styleClass="ui-button" process="@this,chargeAss"
						update="chargeLineTbl,chargeAss,chargeLineSection,messages"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						disabled="#{!purchaseRequestBackingBean.managedBean.chargeLinePanel}"
						rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
						action="#{purchaseRequestBackingBean.chargeLineApply}" />
						<p:commandButton
						title="#{lbl['lbl.btn.reset']}"
						value="#{lbl['lbl.btn.reset']}" ajax='true'
						styleClass="ui-button" process="@this,chargeAss"
						update="chargeLineTbl,chargeAss,chargeLineSection"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" 
						disabled="#{!purchaseRequestBackingBean.managedBean.chargeLinePanel}"
						rendered="#{purchaseRequestBackingBean.managedBean.buttonVal!=BpmOutcomeConstant.bpmView}"
						action="#{purchaseRequestBackingBean.resetChargeLineDetails}" /></td>
			</tr>
		</table>
		</h:panelGroup>
	</p:panel>
	<p:dialog id="queryDialog" header="#{lbl['lbl.fl.query']}" widgetVar="addQuery"
		showEffect="fade" hideEffect="fade" modal="true" width="600px"
		resizable="false">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.code']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{purchaseRequestBackingBean.queryItemCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.fl.item.name']}" /></td>
				<td><p:inputText disabled="true" size="50"
						value="#{purchaseRequestBackingBean.queryItemName}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.fl.query.desc']}" /></td>
				<td><p:inputTextarea cols="50" rows="6" disabled="true" autoResize="false"
						style=" margin-bottom:5px;" value="#{purchaseRequestBackingBean.queryDesc}"  /></td>
			</tr>
		</table>
		<p:spacer height="2px"></p:spacer>
		<div style="width: 100%; text-align: right">
			<p:commandButton value="Close" 
				oncomplete="addQuery.hide();">
			</p:commandButton>
		</div>
	</p:dialog>
	
	<p:dialog id="accountCode" header="Listing - Account Code List" widgetVar="accountCode"
		showEffect="fade" hideEffect="fade" modal="true" width="700" position="top"
		resizable="false">
		<p:panel id="glAccountPanel" header="#{lbl['lbl.pm.gl.account.search.location']}" toggleable="true" >
		<table style="width:100%">
			<tr>
				<td width="30%"><p:outputLabel value="#{lbl['lbl.pm.go.search.acc.type']}"></p:outputLabel></td>
				<td width="30%">
					<p:selectOneMenu id="somAccType" style="width:205px"
							value="#{purchaseRequestBackingBean.managedBean.glAccountSearchBean.selectedAccType}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems
								value="#{purchaseRequestBackingBean.retrieveAccountType()}"
								var="parameter" itemLabel="#{parameter.codeName}"
								itemValue="#{parameter.pmParameter.parameterCode}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{purchaseRequestBackingBean.onChangeAccType()}"
								onstart="blockWidget.show()" 
								oncomplete="blockWidget.hide()" 
								update="somAccClass,somGoCode" />
						</p:selectOneMenu>	
						</td>	
				<td width="40%">&#160;</td>			
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.go.search.acc.class']}"></p:outputLabel></td>
				<td>
					<p:selectOneMenu id="somAccClass" 
							style="width:205px" 
							disabled="#{empty purchaseRequestBackingBean.managedBean.glAccountSearchBean.selectedAccType}"
							value="#{purchaseRequestBackingBean.managedBean.glAccountSearchBean.selectedAccClass}">
							<f:selectItems
								value="#{purchaseRequestBackingBean.retrieveAccountClass()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{purchaseRequestBackingBean.onChangeAccClass()}"
								update="@this,somGoCode" 
								onstart="blockWidget.show()" 
								oncomplete="blockWidget.hide()" />
						</p:selectOneMenu>				
						</td>
						<td>&#160;</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.go.search.gen.obj.code']}"></p:outputLabel></td>
				<td>
					<p:selectOneMenu id="somGoCode"  style="width:205px" 
							disabled="#{empty purchaseRequestBackingBean.managedBean.glAccountSearchBean.selectedAccType 
							or empty purchaseRequestBackingBean.managedBean.glAccountSearchBean.selectedAccClass}"
							value="#{purchaseRequestBackingBean.managedBean.glAccountSearchBean.selectedGenObjCode}">
							<f:selectItems
								value="#{purchaseRequestBackingBean.retrieveGoCodeList()}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="@this" />
						</p:selectOneMenu>	
				</td>	
				<td>&#160;</td>		
			</tr>
		
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.gl.accountCode']}"></p:outputLabel></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.glAccountSearchBean.accountCode}"
						id="glaccountCode" size="28" /></td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.gl.description']}"></p:outputLabel></td>
				<td><p:inputText
						value="#{purchaseRequestBackingBean.managedBean.glAccountSearchBean.accountName}"
						size="50" /></td>
				<td>&#160;</td>
			</tr>			
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{purchaseRequestBackingBean.searchGlAccount}"
							update=":form:glAccountResult"
							onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()"  />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{purchaseRequestBackingBean.resetGlAccountSearchBean}"
							process="@this"
							update=":form:glAccountPanel, :form:glAccountResult"
							onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()"  />
					</div>
				</td>
			</tr>
		</table>
		</p:panel>
		<p:panel id="glAccountResult" header="#{lbl['lbl.pm.gl.account.search.result']}"
		toggleable="true">
		<p:dataTable id="glAccountSR"
