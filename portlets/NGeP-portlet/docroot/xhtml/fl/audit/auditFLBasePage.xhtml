<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:tp="http://java.sun.com/jsf/composite/ep"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:panel>
			<table style="width: 100%">
				<tr>
					<td>
						<div align="left" style="width: 100%">
							<p:commandButton value="#{lbl['lbl.btn.back']}"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{auditFulfilmentBackingBean.redirectToMainPage}" />
						</div>
					</td>
					<td>
						<div align="right" style="width: 100%">
							<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
								<p:fileDownload
									value="#{auditFulfilmentBackingBean.generateReport(auditFulfilmentBackingBean.managedBean.docId,
									auditFulfilmentBackingBean.managedBean.docType)}" />
							</p:commandLink>
							&#160;
							<p:commandLink value="#{lbl['lbl.btn.download']}" ajax="false">
								<p:fileDownload
									value="#{auditFulfilmentBackingBean.generateRptExcelForAuditTrailDetails(auditFulfilmentBackingBean.managedBean.docId,
									auditFulfilmentBackingBean.managedBean.docType)}" />
							</p:commandLink>
							&#160;
						</div>
					</td>
				</tr>
			</table>
			<ui:include src="/xhtml/fl/audit/auditFLPanel.xhtml" />
		</p:panel>
	</ui:define>
</ui:composition>
