<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<p:outputPanel id="opPendingPlanApprovalList">
		<p:dataTable id="dtPendingApproval" var="ppPlan" value="#{planBackingBean.managedBean.pendingApprovalPlans}" 
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">
		 		<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.expand']}">
		    		<p:rowToggler />
	    		</p:column>
		    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.approve']}">  
	                <p:selectBooleanCheckbox value="#{planBackingBean.managedBean.approve}"/>  
	            </p:column>   
               	<p:column headerText="#{lbl['lbl.pp.plan.number']}">  
	           		#{ppPlan.planNo}
               	</p:column>   
               	<p:column headerText="#{lbl['lbl.pp.procurement.mode']}">  
	           		#{ppPlan.ppPlanMaster.procurementMode}
               	</p:column>  
               	<p:column headerText="#{lbl['lbl.pp.plan.description']}">  
                   	#{ppPlan.planDesc}
	            </p:column> 
               	<p:column headerText="#{lbl['lbl.pp.total.estimated.amount']}" styleClass="ppNumericAlign">  
                   	#{ppPlan.estimatedAmount}
               	</p:column> 
               	<p:column headerText="#{lbl['lbl.pp.status']}">  
                   	#{ppPlan.statusId}
               	</p:column> 
              	<p:column headerText="#{lbl['lbl.pp.created.by']}">  
                   	#{ppPlan.createdBy}
               	</p:column>  
               	<p:column headerText="#{lbl['lbl.pp.created.date']}">  
                   	#{ppPlan.createdDate}
               	</p:column>  
				<p:rowExpansion>  
					<div>
	       				<tp:planContentComponent 
				            selectedPlan="#{ppPlan}" 
				            selectedPlanMaster="#{ppPlan.ppPlanMaster}" 
				            viewMode="#{planBackingBean.managedBean.viewMode}"/>
		       		</div>
                </p:rowExpansion>
         </p:dataTable>
	</p:outputPanel>
	
	
</ui:composition>
