<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opViewBudgetAllocationContent">
	 	<p:dataTable styleClass="ppTableFull" lazy="true"
		 	var="obj" rowIndexVar="rowIndex" id="dtBudgetAlloc"
		 	value="#{planBackingBean.budgetAllocDtlDataModel}"
		 	emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
		 	<ac:paginator for="dtBudgetAlloc" />
		 	
	        <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
	            #{obj.pmDo.doCode}
	        </p:column>  
	        	
	        <p:column headerText="#{lbl['lbl.pp.gosodo.name']}">  
	            #{obj.pmDo.doName}
	        </p:column> 
	       
	        <p:column headerText="#{lbl['lbl.pp.budget.amount']}" styleClass="ppNumericAlign">  
	            #{obj.allocAmount}    
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.available.amount']}" styleClass="ppNumericAlign"> 
	        	#{planBackingBean.generateAvailableBudget(obj.allocAmount, obj.usedAmount)} 
	        </p:column> 
    	</p:dataTable> 
	</p:outputPanel>
		
</ui:composition>
