<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:outputPanel id="opViewBudgetAllocationContent">
		<br/>
		 	<p:dataTable styleClass="ppTableFull" 
			 	var="obj" rowIndexVar="rowIndex"
			 	value="#{planBackingBean.managedBean.budgetAllocDtlList}" 
			 	emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
			 	   
		        <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
		            #{obj.pmDo.pmSo.pmGo.goCode} #{obj.pmDo.pmSo.soCode}#{obj.pmDo.doCode}
		        </p:column>  
		        <p:column headerText="#{lbl['lbl.pp.gosodo.name']}">  
		            #{obj.pmDo.pmSo.pmGo.goName} #{obj.pmDo.pmSo.soName}#{obj.pmDo.doName}
		        </p:column> 
		        <p:column headerText="#{lbl['lbl.pp.budgeted.amount']}" styleClass="ppNumericAlign">  
		            #{obj.allocAmount}    
		        </p:column>  
		        <p:column headerText="#{lbl['lbl.pp.available.amount']}" styleClass="ppNumericAlign"> 
		        	#{planBackingBean.generateAvailableBudget(obj.allocAmount, obj.usedAmount)} 
		        </p:column> 
	    	</p:dataTable> 
	   		<br/>
	</p:outputPanel>
		
</ui:composition>
