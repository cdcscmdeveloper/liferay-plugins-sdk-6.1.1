<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions" 
>
	<!-- Amanah Disbursement -->
	<p:panel id="pGosodoDisburse" toggleable="true" header="#{lbl['lbl.pp.budget.amanah.disbursement']}">
		<p:dataTable id="dtGosodoDisburse" rowIndexVar="rowIndex"
			value="">
			<p:column headerText="#{lbl['lbl.pp.amanah.code']}">  
				
               </p:column>  
               <p:column headerText="#{lbl['lbl.pp.amanah.description']}">  
              		
               </p:column>
               <p:column headerText="#{lbl['lbl.pp.amanah.balance.amount']}">  
              	
               </p:column>
               <p:column headerText="#{lbl['lbl.pp.alloc.amount']}">  
                 
               </p:column>  
               <p:column headerText="#{lbl['lbl.pp.status']}">  
                   
              	</p:column>     
              	<p:column headerText="#{lbl['lbl.pp.action']}">  
             		<p:commandLink
                   	action="#{budgetAllocBackingBean.showBudgetAllocationItem(budgetAllocationDet)}" 
                   	oncomplete="dlItemDetailsBudgetModal.show();">
                   	<p:graphicImage value="#{!(budgetAllocationDet.brandNew || 
                   		(budgetAllocBackingBean.managedBean.viewMode==PPConst.modeRevision 
                   		&amp;&amp; budgetAllocationDet.revisionRequired )) ? '/resources/ep/images/design/document.png' 
                   		:'/resources/ep/images/design/edit.png'}" />
                  	</p:commandLink>
                   &nbsp;
                   <p:commandLink
                   	update="dtBudgetAllocDet" disabled="#{!(budgetAllocationDet.brandNew || 
                   	(budgetAllocBackingBean.managedBean.viewMode==PPConst.modeRevision &amp;&amp; budgetAllocationDet.revisionRequired ))}"
                   	action="#{budgetAllocBackingBean.deleteBudgetAllocItem(budgetAllocationDet)}">
                   	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
                  	</p:commandLink>
              	</p:column>  
		</p:dataTable>
		<!-- Button -->
	  	<div class="ppRightBtn">
			<c:if test="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.editable}">
				<p:commandButton value="#{lbl['lbl.pp.verify.confirm']}" icon="ui-icon-accept"
					/> 
				<p:commandButton value="#{lbl['lbl.pp.add']}" icon="ui-icon-add"
					action="dlItemBudgetDisModal.show()" oncomplete="dlItemBudgetDisModal.show()" /> 
			</c:if>
		</div>
	</p:panel>
	
	<!-- Item Budget Disburse Form -->
       <p:dialog id="dlItemBudgetDis" header="#{lbl['lbl.pp.budget.amanah.disbursement']}" widgetVar="dlItemBudgetDisModal"
    		 resizable="false" styleClass="ppDiaglogSmallBg" dynamic="true">  
    	<p:outputPanel id="opItemBudgetDis">
    	<table class="ppOneTable">
    	 	<tr>
    			<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
				<td>
					<p:inputText value="-" disabled="true" styleClass="ppDisplayTextM"/>
				</td>
			</tr>
    		<tr>
    			<th><p:outputLabel value="#{lbl['lbl.pp.gosodo.code']}"/></th>
				<td>
					<p:selectOneMenu>
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
					</p:selectOneMenu>
					<p:selectOneMenu>
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
    			<th><p:outputLabel value="#{lbl['lbl.pp.gosodo.name']}"/></th>
				<td>
					<p:inputText value="-" disabled="true" styleClass="ppDisplayTextM"/>
				</td>
			</tr>
			<tr>
    			<th><p:outputLabel value="#{lbl['lbl.pp.goso.balance.amount']}"/></th>
				<td>
					<p:inputText value="-" disabled="true" styleClass="ppDisplayTextM"/>
				</td>
			</tr>
			<p:outputPanel rendered="#{budgetAllocBackingBean.managedBean.viewMode!=PPConst.modeNew}">
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.gosodo.used.amount']}"/></th>
					<td>
						<p:inputText value="-" disabled="true" styleClass="ppDisplayTextM"/>
					</td>
				</tr>
			</p:outputPanel>
               <tr>
    			<th><p:outputLabel value="#{lbl['lbl.pp.alloc.amount']}"/></th>
				<td>
					<p:inputText value="-" styleClass="ppDisplayTextM"/>
				</td>
			</tr>
			<tr>
    			<td colspan="2">
    				<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.pp.ok']}" update="dtGosodoDisburse" 
							action="#{budgetAllocBackingBean.addBudgetAllocationItemList()}"
							onclick="dlItemBudgetDisModal.hide()" oncomplete="dlItemBudgetDisModal.hide()" 
							process="opItemBudgetDis" icon="ui-icon-accept"/>
						<p:commandButton value="#{lbl['lbl.pp.cancel']}" icon="ui-icon-cancel"
							onclick="dlItemBudgetDisModal.hide()" immediate="true"/>
					</div>
				</td>
    		</tr>
    	</table>
   		</p:outputPanel>
   	</p:dialog>

</ui:composition>
