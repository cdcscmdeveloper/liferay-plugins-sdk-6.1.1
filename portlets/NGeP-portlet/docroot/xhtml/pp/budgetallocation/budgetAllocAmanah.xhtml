<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions" 
>
	<!-- Amanah Disbursement -->
	<p:panel id="pAmanahDisburse" toggleable="true" header="#{lbl['lbl.pp.budget.amanah.disbursement']}">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.verify.status']}"/></th>
				<td>
					<p:inputText id="itVerifiedDisburse" 
						value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.verifyDisburse==true ? 'Verified' : 
						(budgetAllocBackingBean.managedBean.selectedBudgetAllocation.verifyDisburse==false ? 'Invalid' : 'None')}"  
						styleClass="ppDisplayTextL" disabled="true"/>
				</td>
				<th>&nbsp;</th>
				<td>&nbsp;</td>
			</tr>
		</table>
		<br/>
		<p:dataTable id="dtAmanahDisburse" rowIndexVar="rowIndex"
			value="">
			<p:column headerText="#{lbl['lbl.pp.amanah.code']}">  
				#{budgetAllocDtl.pmMaksud.maksudCode}
            </p:column>  
            <p:column headerText="#{lbl['lbl.pp.amanah.description']}">  
           		#{budgetAllocDtl.pmMaksud.maksudDesc}
            </p:column>
            <p:column headerText="#{lbl['lbl.pp.amanah.balance.amount']}">  
           		TODO
            </p:column>
            <p:column headerText="#{lbl['lbl.pp.alloc.amount']}">  
              	#{budgetAllocDtl.allocAmt}
            </p:column>  
            <p:column headerText="#{lbl['lbl.pp.status']}">  
                #{budgetAllocDtl.ppWorkflowStatus.statusId}
           	</p:column>     
           	<p:column headerText="#{lbl['lbl.pp.action']}">  
          		<p:commandLink update="@([id$=opItemAmanahDis])"
                	action="#{budgetAllocBackingBean.showBudgetAllocAmanah(budgetAllocDtl)}" 
                	oncomplete="dlItemAmanahDisModal.show();">
                	<p:graphicImage value="#{(!budgetAllocDtl.brandNew &amp;&amp;
                		budgetAllocBackingBean.managedBean.viewMode==PPConst.modeView)
                		? '/resources/ep/images/design/document.png' 
                		:'/resources/ep/images/design/edit.png'}" />
               	</p:commandLink>
                &nbsp;
                <p:commandLink
                	update="@([id$=pAmanahDisburse])" disabled="#{budgetAllocBackingBean.managedBean.viewMode==PPConst.modeView}"
                	action="#{budgetAllocBackingBean.deleteBudgetAllocDtl(budgetAllocDtl)}">
                	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
               	</p:commandLink>
           	</p:column>  
		</p:dataTable>
		<!-- Button -->
	  	<div class="ppRightBtn">
			<c:if test="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.editable}">
				<p:commandButton value="#{lbl['lbl.pp.verify.confirm']}" icon="ui-icon-accept"
					/> 
				<p:commandButton value="#{lbl['lbl.pp.add']}" icon="ui-icon-add"
					action="dlItemAmanahDisModal.show()" oncomplete="dlItemAmanahDisModal.show()" /> 
			</c:if>
		</div>
	</p:panel>
	
	<!-- Item Budget Disburse Form -->
    <p:dialog id="dlItemAmanahDis" header="#{lbl['lbl.pp.budget.amanah.disbursement']}" widgetVar="dlItemAmanahDisModal"
    		 resizable="false" styleClass="ppDiaglogSmallBg" dynamic="true">  
    	<p:outputPanel id="opItemAmanahDis">
	    	<table class="ppOneTable">
	    	 	<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.amanah.code']}"/></th>
					<td>
						<p:selectOneMenu styleClass="ppDropDownWidthS"
						 	disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.editable}" 
							value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.pmMaksud.maksudId}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.amanah.desc']}"/></th>
					<td>
						<p:inputText id="itDoName" value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.pmMaksud.maksudDesc}" 
							disabled="true" styleClass="ppDisplayTextL"/>
					</td>
				</tr>
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.amanah.balance.amount']}"/></th>
					<td>
						<p:inputText id="itAmanahBalance" value="-"
							disabled="true" styleClass="ppDisplayTextL"/>
					</td>
				</tr>
				<p:outputPanel rendered="#{budgetAllocBackingBean.managedBean.viewMode!=PPConst.modeNew}">
					<tr>
		    			<th><p:outputLabel value="#{lbl['lbl.pp.amanah.used.amount']}"/></th>
						<td>
							<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.usedAmt}"
								 disabled="true" styleClass="ppDisplayTextL"/>
						</td>
					</tr>
				</p:outputPanel>
	               <tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.alloc.amount']}"/></th>
					<td>
						<p:inputText disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.editable}" 
							value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.allocAmt}" 
							styleClass="ppDisplayTextL"/>
					</td>
				</tr>
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.ppWorkflowStatus.statusId}" 
							disabled="true" styleClass="ppDisplayTextL"/>
					</td>
				</tr>
				<tr>
	    			<td colspan="2">
	    				<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.pp.ok']}" update="pAmanahDisburse" 
								action="#{budgetAllocBackingBean.addBudgetAllocDtlList()}"
								onclick="dlItemAmanahModal.hide()" oncomplete="dlItemAmanahDisModal.hide()" 
								process="opItemAmanahDis" icon="ui-icon-accept"/>
							<p:commandButton value="#{lbl['lbl.pp.cancel']}" icon="ui-icon-cancel"
								onclick="dlItemAmanahDisModal.hide()" immediate="true"/>
						</div>
					</td>
	    		</tr>
	    	</table>
   		</p:outputPanel>
   	</p:dialog>

</ui:composition>
