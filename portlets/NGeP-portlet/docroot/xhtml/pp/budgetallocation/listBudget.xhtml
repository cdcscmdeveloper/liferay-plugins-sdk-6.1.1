<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	
	<ui:define name="contentSection">
		
	
			<table width="100%">
				<tr>
					<td colspan="3">
						<table class="ppHalf">
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.pp.ministry.code.name']}" /></td>
								<td>
									<p:inputText disabled="true" styleClass="ppDisplayTextL"
										value="#{budgetAllocBackingBean.managedBean.currentUser.orgCode} / #{budgetAllocBackingBean.managedBean.currentUser.orgName}" />
									
								</td>
							</tr>
						</table>
					</td>
				</tr>
							<tr>
					<td colspan="3">&nbsp;</td>
				</tr>
				<tr>
					<td colspan="3">
						<ui:include src="listBudgetContent.xhtml"/>
					</td>
				</tr>
			</table>
		
			<!-- Bottom Button(s) -->
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pp.new.budget.allocation']}" id="cbNewBudgetAlloc"
			 		action="#{budgetAllocBackingBean.redirectToBudgetAllocation}" icon="ui-icon-add"   /> 
			</div>
			
			<br/>
			<br/>
		
	</ui:define>

</ui:composition>
