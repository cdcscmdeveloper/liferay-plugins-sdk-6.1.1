<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions" 
>

	<!-- PTJ Allocation -->
	<p:panel id="pBudgetAllocOrg" toggleable="true" header="#{lbl['lbl.pp.budget.ptj.alloc']}">
		<br/>
		<table class="ppTwoTable">
		
			<tr>
				<th><p:outputLabel value="#{budgetAllocBackingBean.managedBean.amanahFlag 
            		? lbl['lbl.pp.amanah.code'] : lbl['lbl.pp.gosodo.code']}"/></th>
				<td>
					<p:inputText
						value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.pmDo.doCode}"  
						styleClass="ppDisplayTextL" disabled="true"/>
				</td>
				<th>&nbsp;</th>
				<td>&nbsp;</td>
			</tr>
			<tr>
				<th><p:outputLabel value="#{budgetAllocBackingBean.managedBean.amanahFlag 
            		? lbl['lbl.pp.amanah.balance.amount'] : lbl['lbl.pp.gosodo.balance.amount']}"/></th>
				<td>
					<p:inputText
						value="#{budgetAllocBackingBean.balanceAmount(
						budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.allocAmt,
						budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.usedAmt,
						budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.floatingAllocAmt)}"  
						styleClass="ppDisplayTextL" disabled="true"/>
				</td>
				<th>&nbsp;</th>
				<td>&nbsp;</td>
			</tr>
		</table>
		<br/>
		<p:dataTable id="dtOrgAlloc" rowIndexVar="rowIndex" var="budgetAllocOrg"
			value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.ppBudgetAllocOrgs}">
            <p:column headerText="#{lbl['lbl.pp.ptj.code.name']}">  
                #{budgetAllocOrg.pmOrgProfile.orgCode}
            </p:column>      
            <p:column headerText="#{lbl['lbl.pp.ptj.used.amount']}"
            		rendered="#{budgetAllocBackingBean.managedBean.viewMode!=PPConst.modeNew}"> 
       			#{budgetAllocOrg.usedAmt}
            </p:column> 
            <p:column headerText="#{lbl['lbl.pp.alloc.amount']}">  
             	#{budgetAllocOrg.allocAmt}
            </p:column>
       		<p:column headerText="#{lbl['lbl.pp.status']}">  
              	#{budgetAllocOrg.ppWorkflowStatus.statusId}
          	</p:column>                
           	<p:column headerText="#{lbl['lbl.pp.action']}">  
          		<p:commandLink
                	action="#{budgetAllocBackingBean.showBudgetAllocOrg(budgetAllocOrg)}" 
                	oncomplete="dlItemOrgAllocModal.show();" update="@([id$=opItemOrgAlloc])">
                	<p:graphicImage value="#{(!budgetAllocationDet.brandNew &amp;&amp; 
                		budgetAllocBackingBean.managedBean.viewMode==PPConst.modeView)
                		? '/resources/ep/images/design/document.png'
                		: '/resources/ep/images/design/edit.png'}" />
               	</p:commandLink>
                &nbsp;
                <p:commandLink
                	update="@([id$=pBudgetAllocOrg])" disabled="#{budgetAllocBackingBean.managedBean.viewMode==PPConst.modeView}"
                	action="#{budgetAllocBackingBean.deleteBudgetAllocOrg(budgetAllocOrg)}">
                	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
               	</p:commandLink>
           	</p:column>  
       	</p:dataTable>  
        <br/>
     
	   	<!-- Button(s) -->
	  	<div class="ppRightBtn">
			<c:if test="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.editable}">
				<p:commandButton value="#{lbl['lbl.pp.add']}" icon="ui-icon-add"
					disabled="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.pmDo.doId==null}"
					oncomplete="dlItemOrgAllocModal.show()" update="opItemOrgAlloc"
					action="#{budgetAllocBackingBean.showBudgetAllocOrg(null)}" />  
				
			</c:if>
		</div>
	</p:panel>
	<!-- Item PTJ Alloc Form -->
   	<p:dialog id="dlItemOrgAlloc" header="#{lbl['lbl.pp.budget.ptj.alloc.form']}" widgetVar="dlItemOrgAllocModal"
   		 resizable="false" styleClass="ppDiaglogSmallBg" dynamic="true">  
   		<p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
    	<p:outputPanel id="opItemOrgAlloc">
	    	<table class="ppOneTable">
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.ministry.code.name']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppBudget.pmOrgProfile.orgCode} / #{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppBudget.pmOrgProfile.orgName}" 
							disabled="true" styleClass="ppDisplayTextM"/>
					</td>
				</tr>
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.jabatan.code.name']}"/></th>
					<td>
						<p:selectOneMenu styleClass="ppDropDownWidthM"
							disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.editable}" 
							value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.pmOrgProfile.parentOrgProfile.orgProfileId}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{budgetAllocBackingBean.populateJabatan()}" 
								var="orgProf" itemLabel="#{orgProf.orgName}" itemValue="#{orgProf.orgProfileId}" />
							<p:ajax event="change" update="somPtj"  />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.ptj.code.name']}"/></th>
					<td>
						<p:selectOneMenu styleClass="ppDropDownWidthM" id="somPtj" 
							disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.editable ||
							budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.pmOrgProfile.parentOrgProfile.orgProfileId == null}" 
							value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.pmOrgProfile.orgProfileId}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{budgetAllocBackingBean.populatePtj(
								budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.pmOrgProfile.parentOrgProfile.orgProfileId)}" 
								var="orgProf" itemLabel="#{orgProf.orgName}" itemValue="#{orgProf.orgProfileId}" />
							<p:ajax event="change" listener="#{budgetAllocBackingBean.selectedOrgProfile(
								budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.pmOrgProfile.orgProfileId)}"  />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
	    			<th>
	    				<p:outputLabel value="#{budgetAllocBackingBean.managedBean.amanahFlag 
	    				? lbl['lbl.pp.amanah.balance.amount'] : lbl['lbl.pp.gosodo.balance.amount']}"/>
	    			</th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.balanceAmount(
							budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.allocAmt,
							budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.usedAmt,
							budgetAllocBackingBean.managedBean.selectedBudgetAllocDtl.floatingAllocAmt)}" 
							disabled="true" styleClass="ppDisplayTextM"/>
					</td>
				</tr>
				<c:if test="#{budgetAllocBackingBean.managedBean.viewMode!=PPConst.modeNew}">
					<tr>
		    			<th><p:outputLabel value="#{lbl['lbl.pp.ptj.used.amount']}"/></th>
						<td>
							<p:inputText value="-" disabled="true" styleClass="ppDisplayTextM"/>
						</td>
					</tr>
				</c:if>
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.alloc.amount']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.allocAmt}" 
							disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.editable}" 
							styleClass="ppDisplayTextM" />
					</td>
				</tr>
				<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocOrg.ppWorkflowStatus.statusId}" 
						disabled="true" styleClass="ppDisplayTextM"/>
					</td>
				</tr>
				<tr>
	    			<td colspan="2">
	    				<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.pp.ok']}" update="pBudgetAllocOrg" 
								action="#{budgetAllocBackingBean.addBudgetAllocOrgList()}"
								process="opItemOrgAlloc" icon="ui-icon-accept"/>
							<p:commandButton value="#{lbl['lbl.pp.cancel']}" icon="ui-icon-cancel"
								onclick="dlItemOrgAllocModal.hide()" immediate="true"/>
						</div>
					</td>
	    		</tr>
	    		
	    	</table> 
		</p:outputPanel>
	</p:dialog>  	
</ui:composition>
