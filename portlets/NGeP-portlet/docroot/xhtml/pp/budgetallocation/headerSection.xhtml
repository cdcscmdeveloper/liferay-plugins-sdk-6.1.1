<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div class="ppRightBtn">
		<c:choose>
			<c:when test="#{budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeApproval}">
				<ui:repeat var="bpmAction" value="#{budgetAllocationBackingBean.managedBean.actions}">
					<p:commandButton value="#{bpmAction}" action="#{budgetAllocationBackingBean.submitBudgetAllocation(bpmAction)}" />&nbsp;
				</ui:repeat>
				<br/>
			</c:when>
			<c:when test="#{budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeNew}">
				<p:commandButton id="cbSave" value="#{lbl['lbl.pp.save']}" action="#{budgetAllocationBackingBean.submitBudgetAllocation('SAVE')}"   />&nbsp; 
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" action="#{budgetAllocationBackingBean.submitBudgetAllocation('SUBMIT')}"   />&nbsp;
			</c:when>
			<c:when test="#{budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeRevision}">
				<ui:repeat var="bpmAction" value="#{budgetAllocationBackingBean.managedBean.actions}">
					<p:commandButton value="#{bpmAction}" action="#{budgetAllocationBackingBean.submitBudgetAllocation(bpmAction)}" />&nbsp;
				</ui:repeat>
			</c:when>
		</c:choose>
	</div>
</ui:composition>
