<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opListBudgetAllocContent">
		<br/>
		<p:dataTable id="dtBudgetAllocResult" styleClass="ppTableFull" rowIndexVar="rowIndex"
			value="#{budgetAllocBackingBean.budgetAllocDataModel}" var="budgetAlloc"  lazy="true"
		 	emptyMessage="#{lbl['lbl.pp.no.record.found']}">
		 	<ac:paginator for="dtBudgetAllocResult" />
	        <p:column headerText="#{lbl['lbl.pp.budget.alloc.no']}">  
	            #{budgetAlloc.budgetAllocNo}
	        </p:column>  
	         <p:column headerText="#{lbl['lbl.pp.budget.alloc.desc']}">  
	            #{budgetAlloc.budgetAllocDesc}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.status']}">  
	            #{budgetAllocBackingBean.getStatusDescById(budgetAlloc.pmStatus.statusId
	            	)}
	        </p:column>  
          	<p:column headerText="#{lbl['lbl.pp.action']}">  
	            <p:commandLink action="#{budgetAllocBackingBean.redirectToBudgetAllocation(budgetAlloc.budgetAllocId)}" >
					<p:graphicImage value="#{(budgetAllocBackingBean.managedBean.viewMode==PPConst.modeList)
               			? '/resources/ep/images/design/edit.png' 
                  		: '/resources/ep/images/design/document.png'}"/>
				</p:commandLink>
	        </p:column>  
    	</p:dataTable> 
		<br/> 
	</p:outputPanel>				
</ui:composition>
