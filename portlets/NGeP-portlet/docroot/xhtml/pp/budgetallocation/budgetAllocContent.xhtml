<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions" 
>
	<p:outputPanel id="opBudgetAllocationContent">
	
		<!-- Header -->
		<p:panel id="pTabBudgetAllocHeader" toggleable="true"  header="#{lbl['lbl.pp.budget.alloc.header']}">
			<table class="ppTwoTable">
				<!-- Hide for new -->
				<tr>
					<th><p:outputLabel value="* #{lbl['lbl.pp.budget.alloc.desc']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.budgetAllocDesc}"  
							styleClass="ppDisplayTextM" disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocation.editable}"/>
					</td>
					<th><p:outputLabel value="#{lbl['lbl.pp.budget.alloc.no']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.budgetAllocNo}"  
							styleClass="ppDisplayTextM" disabled="true"/>
					</td>
				</tr>
				<tr>
					<th><p:outputLabel value="* #{lbl['lbl.pp.go.code']}"/></th>
					<td>
						<p:selectOneMenu styleClass="ppDropDownWidthM" required="true" label="#{lbl['lbl.pp.go.code']}"
							value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppBudget.budgetId}"
							disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocation.brandNew}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
							<f:selectItems value="#{budgetAllocBackingBean.populateGo()}" 
									var="obj" itemLabel="#{obj.pmGo.goCode}" itemValue="#{obj.budgetId}" />
							<p:ajax event="change" update="itGoName, itGoYear, pDisburse"
								listener="#{budgetAllocBackingBean.selectedGo(budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppBudget.budgetId)}" />
						</p:selectOneMenu>
					</td>
					<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocBackingBean.getStatusDescById(
							budgetAllocBackingBean.managedBean.selectedBudgetAllocation.pmStatus.statusId)}"  
							styleClass="ppDisplayTextM" disabled="true"/>
					</td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.go.name']}"/></th>
					<td>
						<p:inputText id="itGoName" value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppBudget.pmGo.goName}"  
							styleClass="ppDisplayTextM" disabled="true"/>
					</td>
					<th></th>
					<td></td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.financial.year']}"/></th>
					<td>
						<p:inputText id="itGoYear" value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppBudget.financialYear}"  
							styleClass="ppDisplayTextM" disabled="true"/>
					</td>
					<th></th>
					<td></td>
				</tr>
				<tr>
					<th><p:outputLabel value="* #{lbl['lbl.pp.plan.approver']}"/></th>
					<td>
						<p:selectOneMenu value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.approverUser.userId}" 
							styleClass="ppDropDownWidthM" disabled="#{!budgetAllocBackingBean.managedBean.selectedBudgetAllocation.editable}"
							required="true" label="#{lbl['lbl.pp.plan.approver']}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{budgetAllocBackingBean.userWithRoleOptions()}" var="user"
								itemLabel="#{user.loginId}" itemValue="#{user.userId}"/>
							<p:ajax event="change" listener="#{budgetAllocBackingBean.selectedApprover(budgetAllocBackingBean.managedBean.selectedBudgetAllocation.approverUser.userId)}" />
						</p:selectOneMenu>
					</td>
					<th></th>
					<td></td>
				</tr>
			</table>
		</p:panel>
		
		<!-- GOSODO/Amanah Disbursement -->
		<c:choose>
			<c:when test="#{budgetAllocBackingBean.managedBean.amanahFlag}">
				<ui:include src="budgetAllocAmanah.xhtml"/>
			</c:when>
			<c:when test="#{!budgetAllocBackingBean.managedBean.amanahFlag}">
				<ui:include src="budgetAllocVot.xhtml"/>
			</c:when>
		</c:choose>
		
		<!-- PTJ Allocation -->
		<ui:include src="budgetAllocOrg.xhtml"/>

		<!-- Remarks -->
		<p:panel id="pTabBudgetAllocRmk" toggleable="true" header="#{lbl['lbl.pp.remarks']}">
			<p:dataGrid value="#{budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppRemarks}" var="remarkVar" 
				rowIndexVar="remarkIndex" columns="1" >
				<table>
					<tr>
						<td rowspan="2" valign="top">
							<p:graphicImage styleClass="smallUserImage" value="#{budgetAllocBackingBean.userImagePath(remarkVar.createdByObj.loginId)}" />
						</td>
						<td width="5"></td>
						<td>
							<h:outputText value="#{remarkVar.createdByObj.loginId}"></h:outputText>,
							<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
								<f:convertDateTime pattern="#{PPConst.datetimeDisplayPattern}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td></td>
						<td>
							<p:inputTextarea cols="60" value="#{remarkVar.remark}" 
								disabled="#{(fn:length(budgetAllocBackingBean.managedBean.selectedBudgetAllocation.ppRemarks)-1)!=remarkIndex}" /> 
						</td>
					</tr>
				</table>
			</p:dataGrid>	
		</p:panel>
	</p:outputPanel>
</ui:composition>
