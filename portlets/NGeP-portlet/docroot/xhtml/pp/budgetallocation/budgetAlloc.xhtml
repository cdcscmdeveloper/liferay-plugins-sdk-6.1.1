<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
 
    <ui:define name="contentSection">
       	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
    	<!-- Top Button -->
    	<ui:include src="headerSection.xhtml"/>
    	
    	<!-- Content -->
    	<p:tabView id="tvBudgetAlloc" dynamic="true" cache="false" orientation="left">
    		<!-- Content -->
    		 <p:tab id="tBudgetAlloc" title="#{budgetAllocBackingBean.generateHeader(budgetAllocBackingBean.managedBean.viewMode)}">
    		 	<!-- View Disbursed Budget List -->
    		 	<p:panel header="#{lbl['lbl.pp.disbursed.budget.list']}" toggleable="true">
	 				<ui:include src="budgetDisbursementSummary.xhtml"/>
	 			</p:panel>
    		 	<!-- Budget Alloc -->
    		 	<ui:include src="budgetAllocContent.xhtml"/>
    		 </p:tab>
    		 <!-- Budget Alloc List -->
    		 <p:tab id="tBudgetAllocList" title="#{lbl['lbl.pp.budget.alloc.list']}">
    		 	<ui:include src="listBudgetAllocContent.xhtml"/>
    		 </p:tab>
    	</p:tabView>
	</ui:define>
</ui:composition>
