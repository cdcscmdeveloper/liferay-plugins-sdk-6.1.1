<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions" 
>
	<p:outputPanel id="opBudgetAllocationContent">
		<!-- Header -->
		<p:panel id="pTabBudgetAllocHeader" toggleable="true"  header="#{lbl['lbl.pp.header']}">
			<table class="ppTwoPartsTable">
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.ministry.code.name']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ptjOrgProfile.parentOrgProfile.parentOrgProfile.orgCode} / #{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ptjOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"  
							styleClass="ppDisplayTextL" disabled="true"/>
					</td>
		
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.jabatan.code.name']}"/></th>
					<td>
						<p:selectOneMenu id="somJbt" value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ptjOrgProfile.parentOrgProfile.orgProfileId}"
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.editable}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{budgetAllocationBackingBean.populateJabatan()}" 
								var="orgProf" itemLabel="#{orgProf.orgName}" itemValue="#{orgProf.orgProfileId}" />
							<p:ajax event="change" update="somPtj"  />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.ptj.code.name']}"/></th>
					<td>
						<p:selectOneMenu id="somPtj" value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ptjOrgProfile.orgProfileId}" 
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.editable 
							|| budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ptjOrgProfile.parentOrgProfile.orgProfileId==null}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItems value="#{budgetAllocationBackingBean.populatePtj()}" 
								var="orgProf" itemLabel="#{orgProf.orgName}" itemValue="#{orgProf.orgProfileId}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.statusId}"  
							styleClass="ppDisplayTextL" disabled="true"/>
					</td>
				</tr>
				<tr>
					<th><p:outputLabel value="* #{lbl['lbl.pp.plan.approver']}"/></th>
					<td>
						<p:selectOneMenu value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.approverUser.userId}" 
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.editable}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
							<f:selectItem itemLabel="USER0018" itemValue="52"/>
							<p:ajax event="change" listener="#{budgetAllocationBackingBean.selectedApprover(budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.approverUser.userId)}" />
						</p:selectOneMenu>
					</td>
				</tr>
			</table>
		</p:panel>
		<!-- Details -->
		<p:panel id="pTabBudgetDet" toggleable="true" header="#{lbl['lbl.pp.details']}">
			<p:dataTable id="dtBudgetAllocDet" var="budgetAllocationDet"  rowIndexVar="rowIndex"
				value="#{budgetAllocationBackingBean.activeItems()}">
					<p:column rendered="#{budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeApproval}" 
						headerText="#{lbl['lbl.pp.revise']}">  
						<p:selectBooleanCheckbox value="#{budgetAllocationDet.revisionRequired}" />
					</p:column>
                    <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
                       	#{budgetAllocationDet.ppBudget.pmGo.goCode}
                    </p:column>  
                    <p:column headerText="#{lbl['lbl.pp.gosodo.name']}">  
                       	#{budgetAllocationDet.ppBudget.pmGo.goName}
                    </p:column>      
                    <p:column headerText="#{lbl['lbl.pp.financial.year']}">  
                       	#{budgetAllocationDet.ovrFinancialYear}  
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.allocate.budget.amount']}">  
                       	#{budgetAllocationDet.allocAmount} 
                   	</p:column>
                   	<p:column headerText="#{lbl['lbl.pp.status']}" rendered="#{budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeRevision}">  
                        #{budgetAllocationDet.recordStatus?'Active':'Deleted'}
                   	</p:column>                
                   	<p:column headerText="#{lbl['lbl.pp.action']}">  
                  		<p:commandLink
                        	action="#{budgetAllocationBackingBean.showBudgetAllocationItem(budgetAllocationDet)}" 
                        	oncomplete="dlItemDetailsBudgetModal.show();" update=":form:dlItemDetailsBudget">
                        	<p:graphicImage value="#{!(budgetAllocationDet.brandNew || 
                        		(budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeRevision 
                        		&amp;&amp; budgetAllocationDet.revisionRequired )) ? '/resources/ep/images/design/document.png' 
                        		:'/resources/ep/images/design/edit.png'}" />
                       	</p:commandLink>
                        &nbsp;
                        <p:commandLink
                        	update="dtBudgetAllocDet" disabled="#{!(budgetAllocationDet.brandNew || 
                        	(budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeRevision &amp;&amp; budgetAllocationDet.revisionRequired ))}"
                        	action="#{budgetAllocationBackingBean.deleteBudgetAllocItem(budgetAllocationDet)}">
                        	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
                       	</p:commandLink>
                   	</p:column>  
           	</p:dataTable>  
            <br/>
		   	<!-- Button(s) -->
		  	<div class="ppRightBtn">
				<c:if test="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.editable}">
					<p:commandButton value="#{lbl['lbl.pp.add']}" icon="ui-icon-add"
						action="#{budgetAllocationBackingBean.showBudgetAllocationItem(null)}" 
						oncomplete="dlItemDetailsBudgetModal.show();" update=":form:dlItemDetailsBudget" /> 
				</c:if>
			</div>
		</p:panel>
		<!-- Remarks -->
		<p:panel id="pTabBudgetAllocRmk" toggleable="true" header="#{lbl['lbl.pp.remarks']}">
			<p:dataGrid value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ppRemarks}" var="remarkVar" 
				rowIndexVar="remarkIndex" columns="1" >
				<table>
					<tr>
						<td rowspan="2" valign="top">
							<p:graphicImage styleClass="smallUserImage" value="#{budgetAllocationBackingBean.userImagePath(remarkVar.createdByObj.loginId)}" />
						</td>
						<td width="5"></td>
						<td>
							<h:outputText value="#{remarkVar.createdByObj.loginId}"></h:outputText>,
							<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
								<f:convertDateTime pattern="#{PPConst.datetimeDisplayPattern}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td></td>
						<td>
							<p:inputTextarea cols="60" value="#{remarkVar.remark}" 
								disabled="#{(fn:length(budgetAllocationBackingBean.managedBean.selectedBudgetAllocation.ppRemarks)-1)!=remarkIndex}" /> 
						</td>
					</tr>
				</table>
			</p:dataGrid>
			
		</p:panel>

		<!-- Item Detail Form -->
        <p:dialog id="dlItemDetailsBudget" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsBudgetModal"
     		 resizable="false" styleClass="ppDiaglogBg" dynamic="true">  
	    	<p:outputPanel id="opItemDetailsBudget">
	    	<table class="ppTwoPartsTable">
	    		<c:if test="#{budgetAllocationBackingBean.managedBean.viewMode==PPConst.modeApproval}">
		    		<tr>
		    			<th><p:outputLabel value="#{lbl['lbl.pp.require.revision']}"/></th>
						<td>
							<p:selectBooleanCheckbox value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.revisionRequired}" /> 
						</td>
		    		</tr>
	    		</c:if>
	    		<tr>
	    			<th><p:outputLabel value="* #{lbl['lbl.pp.gosodo.code']}"/></th>
					<td>
					    <p:selectOneMenu
					    	value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.budgetId}"
					    	disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.brandNew &amp;&amp; 
					    		!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.editable}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
							<f:selectItems value="#{budgetAllocationBackingBean.populateGo()}" 
								var="budget" itemLabel="#{budget.pmGo.goCode}" itemValue="#{budget.budgetId}" />
							<p:ajax event="change" listener="#{budgetAllocationBackingBean.selectedGo}" update="opItemDetailsBudget"  />
						</p:selectOneMenu>
						<p:selectOneMenu 
							value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.soId}"
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.brandNew &amp;&amp; 
					    		!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.editable}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
							<f:selectItems value="#{budgetAllocationBackingBean.populateSo()}" 
								var="pmSo" itemLabel="#{pmSo.soCode}" itemValue="#{pmSo.soId}" />
							<p:ajax event="change" update="somDo, opGosodo"  />
						</p:selectOneMenu>
						<p:selectOneMenu id="somDo"
							value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.doId}"
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.brandNew &amp;&amp; 
					    		!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.editable}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
							<f:selectItems value="#{budgetAllocationBackingBean.populateDo()}" 
								var="pmDo" itemLabel="#{pmDo.doCode}" itemValue="#{pmDo.doId}" />
							<p:ajax event="change" listener="#{budgetAllocationBackingBean.selectedDo}" update="opGosodo" />
						</p:selectOneMenu>
					</td>
	    		</tr>
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.gosodo.name']}"/></th>
					<td>
						<p:outputPanel id="opGosodo">
							<p:inputText disabled="true" styleClass="ppDisplayTextL"
								value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.pmDo.pmSo.pmGo.goName} #{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.pmDo.pmSo.soName} #{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.pmDo.doName}"/>
						</p:outputPanel>    
					</td>
	    		</tr>
	    		<tr>
	    			<th><p:outputLabel value="* #{lbl['lbl.pp.financial.year']}"/></th>
					<td>
						<p:selectOneMenu value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.ovrFinancialYear}"
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.brandNew &amp;&amp; 
					    		!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.editable}">
							<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
							<f:selectItems value="#{budgetAllocationBackingBean.financialYearOptions()}"/>
						</p:selectOneMenu>
					</td>
	    		</tr>
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.budgeted.amount']}"/></th>
					<td>
						<p:inputText disabled="true" styleClass="ppDisplayTextL"
							value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.ppBudget.budgetAmount}"/>
						
					</td>
	    		</tr>
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.available.amount']}"/></th>
					<td>
						<p:inputText disabled="true" styleClass="ppDisplayTextL"
								value="#{budgetAllocationBackingBean.generateAvailableBudget(
								budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.ppBudget.budgetAmount,
								budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.ppBudget.usedAmount)}"/>
					</td>
	    		</tr>
	    		<tr>
	    			<th><p:outputLabel value="* #{lbl['lbl.pp.allocate.budget.amount']}"/></th>
					<td>
						<p:inputText value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.allocAmount}" 
							disabled="#{!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.brandNew &amp;&amp; 
					    		!budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.editable}">
						</p:inputText>
					</td>
	    		</tr>
	    		<tr>
	    			<th><p:outputLabel value="#{lbl['lbl.pp.remarks']}"/></th>
					<td>
						<c:if test="#{budgetAllocationBackingBean.managedBean.viewMode!=PPConst.modeNew}">
							<p:inputTextarea value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItem.latestRemark.remark}" 
								rows="3" cols="70" disabled="true"/>
						</c:if>
						<p:inputTextarea value="#{budgetAllocationBackingBean.managedBean.selectedBudgetAllocItemRmk.remark}" 
							rows="3" cols="70"/>
					</td>
	    		</tr>
	    		<tr>
	    			<td colspan="2">
	    				<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.pp.ok']}" action="#{budgetAllocationBackingBean.addBudgetAllocationItemList()}"
								onclick="dlItemDetailsBudgetModal.hide()" oncomplete="dlItemDetailsBudgetModal.hide()" update="dtBudgetAllocDet" 
								process="opItemDetailsBudget" icon="ui-icon-accept"/>
							<p:commandButton value="#{lbl['lbl.pp.cancel']}" icon="ui-icon-cancel"
								onclick="dlItemDetailsBudgetModal.hide()" immediate="true"/>
						</div>
					</td>
	    		</tr>
	    	</table> 
  			</p:outputPanel>
		</p:dialog>  		

	</p:outputPanel>
</ui:composition>
