<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opViewBudgetAllocationContent">
		<br/>

		<p:dataTable id="dtBudget" styleClass="ppTableFull" var="budget" rowIndexVar="rowIndex"
		 	emptyMessage="#{lbl['lbl.pp.no.record.found']}"
		 	value="#{budgetAllocationBackingBean.budgetDataModel}"
			lazy="true">
		 	
		 	<ac:paginator for="dtBudget" />
	    	
	        <p:column headerText="#{lbl['lbl.pp.go.code']}">  
	            #{budget.pmGo.goCode}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.go.name']}">  
	             #{budget.pmGo.goName}
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pp.financial.year']}" styleClass="ppNumericAlign">  
	            #{budget.financialYear}   
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.budgeted.amount']}" styleClass="ppNumericAlign">  
	            #{budget.budgetAmount}    
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.warrant.amount']}" styleClass="ppNumericAlign">  
	            #{budget.warrantAmount}    
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.used.amount']}" styleClass="ppNumericAlign">  
	            #{budget.usedAmount}    
	        </p:column>  
         	<p:column headerText="#{lbl['lbl.pp.created.date']}">  
	            <h:outputText value="#{budget.createdDate}" >
               		<f:convertDateTime pattern="#{PPConst.dateDisplayPattern}" />
                </h:outputText>  
	        </p:column>
	        <!-- 
	        <p:column headerText="#{lbl['lbl.pp.flag']}">  
				#{budget.budgetType}   
	        </p:column>  
	         -->
    	</p:dataTable> 
				

		<br/> 
		<br/> 
		<!-- 
			id<p:inputText value="#{budgetAllocationBackingBean.managedBean.tempId}" />, 
			<p:inputText value="#{budgetAllocationBackingBean.managedBean.actionDesc}" />
			<p:commandButton value="Load" action="#{budgetAllocationBackingBean.dummyTask(budgetAllocationBackingBean.managedBean.tempId, budgetAllocationBackingBean.managedBean.actionDesc)}" 
			update="@form"  />  -->
			
		
	</p:outputPanel>
					
</ui:composition>
