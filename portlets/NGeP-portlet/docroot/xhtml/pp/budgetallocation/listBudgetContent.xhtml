<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:outputPanel id="opViewBudgetAllocationContent">
		<br/>
		<div class="ppProfileInfo">
			<table class="ppTwoPartsTable" align="left">
					<tr>
						<th>#{lbl['lbl.pp.ministry.code.name']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:inputText value="#{budgetAllocationBackingBean.managedBean.currentUser.orgName}" disabled="true"/>
						</td>
					</tr>
					<tr>
						<td colspan="3">&nbsp;</td>
					</tr>
			</table>
		</div>
		<br/> 
		<br/> 
	 	<p:dataTable styleClass="ppTableFull" var="budget" rowIndexVar="rowIndex"
		 	value="#{budgetAllocationBackingBean.managedBean.budgetList}" 
		 	emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
                #{rowIndex+1}
            </p:column>   
	        <p:column headerText="#{lbl['lbl.pp.go.code']}">  
	            #{budget.pmGo.goCode}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.go.name']}">  
	             #{budget.pmGo.goName}
	        </p:column> 
	        <!-- 
	        <p:column headerText="#{lbl['lbl.pp.activity.description']}">  
	            <p:outputLabel value="" /> 
	        </p:column>  
	         -->
	        <p:column headerText="#{lbl['lbl.pp.financial.year']}">  
	            #{budget.financialYear}   
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.budgeted.amount']}">  
	            #{budget.budgetAmount}    
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.used.amount']}">  
	            #{budget.usedAmount}    
	        </p:column>  
         	<p:column headerText="#{lbl['lbl.pp.created.date']}">  
	            #{budget.createdDate}     
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.flag']}">  
				#{budget.budgetType}   
	        </p:column>  
    	</p:dataTable> 
    	<br/>
		<br/>
		
	</p:outputPanel>
					
</ui:composition>
