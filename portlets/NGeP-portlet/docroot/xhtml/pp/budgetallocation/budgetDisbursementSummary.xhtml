<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="opBudgetDisburseSummary">
		<p:dataTable id="dtSumBudget" styleClass="ppTableFull" rowIndexVar="rowIndex" 
			value="#{budgetAllocBackingBean.budgetDtlDataModel}"
			var="ppBudgetDtl" lazy="true" emptyMessage="#{lbl['lbl.pp.no.record.found']}">
			<ac:paginator for="dtSumBudget" />
	        <p:column headerText="#{lbl['lbl.pp.so.code']}">  
		    	#{ppBudgetDtl.pmSo.soCode}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.so.name']}">  
	            #{ppBudgetDtl.pmSo.soName}
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pp.alloc.amount']}" styleClass="ppNumericAlign">  
	            #{ppBudgetDtl.allocAmt}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.balance.amount']}" styleClass="ppNumericAlign">  
	      		#{budgetDisburseBackingBean.balanceAmount(ppBudgetDtl.allocAmt, ppBudgetDtl.usedAmt)} 
	        </p:column>  
	   	</p:dataTable> 
	   	<br/>
   	</p:outputPanel>
</ui:composition>
