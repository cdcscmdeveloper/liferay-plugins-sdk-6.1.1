<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opViewBudgetAllocationContent">
		<p:dataTable id="dtBudget" styleClass="ppTableFull" rowIndexVar="rowIndex" 
			value="#{budgetDisburseBackingBean.budgetDataModel}" lazy="true"  var="ppBudget"
		 	emptyMessage="#{lbl['lbl.pp.no.record.found']}">
	    	<ac:paginator for="dtBudget" />
	        <p:column headerText="#{lbl['lbl.pp.go.code']}">  
	          	#{ppBudget.pmGo.goCode}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.go.name']}">  
	            #{ppBudget.pmGo.goName}
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pp.budget.amount']}" styleClass="ppNumericAlign">  
	      		#{ppBudget.budgetAmt}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.balance.amount']}" styleClass="ppNumericAlign">
	        	#{budgetDisburseBackingBean.balanceAmount(ppBudget.budgetAmt, ppBudget.usedAmt)} 
	        </p:column>  
         	<p:column headerText="#{lbl['lbl.pp.created.date']}">  
	           	<h:outputText value="#{ppBudget.createdDate}" >
               		<f:convertDateTime pattern="#{PPConst.dateDisplayPattern}" />
               	</h:outputText>
	        </p:column>
	      	<p:column headerText="#{lbl['lbl.pp.action']}"> 
				<p:commandLink action="#{budgetDisburseBackingBean.redirectToBudgetDisbursement(ppBudget.budgetId)}"> 	
					<p:graphicImage value="/resources/ep/images/design/edit.png" />
				</p:commandLink>	
	        </p:column>
    	</p:dataTable> 
		<br/> 
	</p:outputPanel>
					
</ui:composition>
