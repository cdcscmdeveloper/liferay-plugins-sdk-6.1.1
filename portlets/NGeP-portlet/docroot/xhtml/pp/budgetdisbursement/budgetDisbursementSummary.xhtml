<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="opBudgetDisburseSummary">
		<p:dataTable id="dtSumBudget" styleClass="ppTableFull" rowIndexVar="rowIndex" 
			value="#{budgetDisburseBackingBean.managedBean.selectedPpBudget.ppBudgetDtls}"
			selection="#{budgetDisburseBackingBean.managedBean.selectedPpBudgetDtl}" selectionMode="single"
			rowKey="#{ppBudgetDtl}" var="ppBudgetDtl" emptyMessage="#{lbl['lbl.pp.no.record.found']}">
			
			<p:ajax event="rowSelect" update="@([id$=pTransaction])" />
			
	        <p:column headerText="#{lbl['lbl.pp.so.code']}">  
		    	<p:selectOneMenu value="#{ppBudgetDtl.soId}" styleClass="ppDropDownWidthS" disabled="#{!ppBudgetDtl.brandNew}"> 
					<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
					<f:selectItems value="#{budgetDisburseBackingBean.soOptions(budgetDisburseBackingBean.managedBean.selectedPpBudget.pmGo.goId)}" 
						var="obj" itemLabel="#{obj.soCode}" itemValue="#{obj.soId}" />
					<p:ajax event="change" listener="#{budgetDisburseBackingBean.selectedSo(ppBudgetDtl.soId)}" update="dtSumBudget"/>
				</p:selectOneMenu>
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.so.name']}">  
	            #{ppBudgetDtl.pmSo.soName}
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pp.alloc.amount']}" styleClass="ppNumericAlign">  
	            #{ppBudgetDtl.allocAmt}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.balance.amount']}" styleClass="ppNumericAlign">  
	      		#{budgetDisburseBackingBean.balanceAmount(ppBudgetDtl.allocAmt, ppBudgetDtl.usedAmt)} 
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.action']}"> 
                <p:commandLink 
                  	update="dtSumBudget, @([id$=pTransaction])" disabled="#{!ppBudgetDtl.brandNew}" 	 
                  	action="#{budgetDisburseBackingBean.deleteBudgetDtl(ppBudgetDtl)}">
                  	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
               	</p:commandLink>
            </p:column> 
	       
	   	</p:dataTable> 
	   	<br/>
	   	<!-- Button -->
	  	<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.pp.add']}" icon="ui-icon-add" 
				action="#{budgetDisburseBackingBean.addBudgetDtls}" update="dtSumBudget, @([id$=pTransaction])"/>
		</div>
		<br/>
   	</p:outputPanel>
</ui:composition>
