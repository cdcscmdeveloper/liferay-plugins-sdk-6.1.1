<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div class="ppRightBtn">
		<c:choose>
			<c:when test="#{budgetAllocationBackingBean.managedBean.viewMode=='A'}">
				<p:commandButton id="cbRevise" value="#{lbl['lbl.pp.revise']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp;
		 		<p:commandButton id="cbApprove" value="#{lbl['lbl.pp.approve']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp;
			</c:when>
			<c:when test="#{budgetAllocationBackingBean.managedBean.viewMode=='N'}">
				<p:commandButton id="cbSave" value="#{lbl['lbl.pp.save']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp; 
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp;
	 			<p:commandButton id="cbBack" value="#{lbl['lbl.pp.back']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp;
			</c:when>
			<c:when test="#{budgetAllocationBackingBean.managedBean.viewMode=='S'}">
				<p:commandButton id="cbSave" value="#{lbl['lbl.pp.reserve']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp; 
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" action="#{budgetAllocationBackingBean.redirectToListBudgetAllocation}"   />&nbsp;
			</c:when>
		</c:choose>
	</div>
	
		
</ui:composition>
