<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	
	<ui:define name="sideMenu">
   		<ui:include src="menuPlan.xhtml"/>
    </ui:define>
    <ui:define name="content">
		<p:panel id="pRightPanel" header="#{planBackingBean.generateHeader('N')}">
			<!-- Top Button -->
			<div class="ppRightBtn">
				<p:commandButton id="cbSave" value="#{lbl['lbl.pp.save']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp; 
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" partialSubmit="true" action="#{planBackingBean.submitNewPlan()}"   />&nbsp;
			</div>
			<ui:include src="planContent.xhtml"/>
		</p:panel>
   		<!-- View MTO -->
		<p:dialog id="dlMTO" header="#{lbl['lbl.pp.view.plan.details']}" widgetVar="dlMTOModal" 
          		modal="true" resizable="false" styleClass="ppDiaglogBigBg" dynamic="true">  
       		<c:if test="#{planBackingBean.managedBean.planType=='P' &amp;&amp; planBackingBean.managedBean.mtoRequired==1}">
	       		<f:subview id="mto">
	       			<ui:include src="planContent.xhtml"/>
	       		</f:subview>
       		</c:if>
		</p:dialog> 
	</ui:define>
</ui:composition>
