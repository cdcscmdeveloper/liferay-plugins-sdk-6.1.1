<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanPp">
		<!-- Item List -->
		<p:dataTable id="dtPpItem" styleClass="ppFixTdWidth" var="ppItem" value="#{planBackingBean.managedBean.ppItemList}" 
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
                <p:outputLabel value="" />  
            </p:column>   
	        <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
               	<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
					<f:selectItem itemLabel="28" itemValue="28" />
				</p:selectOneMenu>
				<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
					<f:selectItem itemLabel="19" itemValue="19" />
				</p:selectOneMenu>
				<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
					<f:selectItem itemLabel="9" itemValue="9" />
				</p:selectOneMenu>
	        </p:column>   
	        <p:column headerText="#{lbl['lbl.pp.activity.description']}">  
	            <p:outputLabel value="PembelianBekalanPejabat" />
	        </p:column> 
	        <!--  
	      
	        <p:column headerText="#{lbl['lbl.pp.financial.year']}">  
	           	<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
					<f:selectItem itemLabel="2013" itemValue="2013" />
				</p:selectOneMenu>
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.available.budgeted.amount']}">  
	            <p:outputLabel value="75,000.00" /> 
	        </p:column>   
	        -->
	        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}">  
	            <p:inputText value="0" readonly="#{!planBackingBean.managedBean.brandNew}"/> 
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.product.code']}">  
	            <p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
					<f:selectItem itemLabel="- Select -" itemValue="XX" />
				</p:selectOneMenu>
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pp.action']}">  
                <!--  <p:rowEditor /> -->    
            </p:column>  
    	</p:dataTable>  
    	<br/>
    	
    	<!-- Button(s) -->
    	<c:if test="#{planBackingBean.managedBean.brandNew}">
    		<div class="ppRightBtn">
				<p:commandButton id="addPpItemDet" value="#{lbl['lbl.pp.add.item']}" 
					onclick="dlItemDetailsPpModal.show();" />  
		 		<br/>
		 		<br/>
	 		</div>
 		</c:if>
 		
 		<p:dialog id="dlItemDetailsPp" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsPpModal" 
	              	 modal="true" resizable="false" styleClass="ppDiaglogBg" dynamic="true" appendToBody="true">  
	 		<p:panel id="pItemDetails" header="#{lbl['lbl.pp.item.details.form']}">
				<table class="ppTwoPartsTable">
					<tr>
						<th>#{lbl['lbl.pp.gosodo.code']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:outputPanel>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
									<f:selectItem itemLabel="- Select -" itemValue="XX" />
								</p:selectOneMenu>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="- Select -" itemValue="XX" />
								</p:selectOneMenu>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="- Select -" itemValue="XX" />
								</p:selectOneMenu>
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.activity.description']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							 <p:inputText disabled="true" value="xxxx" />  
						</td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.abm.type']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:outputPanel>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="- Select -" itemValue="XX" />
								</p:selectOneMenu>
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.financial.year']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:outputPanel>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="- Select -" itemValue="XX" />
								</p:selectOneMenu>
							</p:outputPanel>
						</td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.available.budgeted.amount']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							 <p:inputText disabled="true" value="xx" />  
						</td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.estimated.amount']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							 <p:inputText value="xx" readonly="#{!planBackingBean.managedBean.brandNew}" />  
						</td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.product.code']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:outputPanel>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">
									<f:selectItem itemLabel="- Select -" itemValue="XX" />
								</p:selectOneMenu>
							</p:outputPanel>
						</td>
					</tr>
					<tr>
			   			<td colspan="2">&nbsp;</td>
						<td>
							<p:commandButton type="button" value="#{lbl['lbl.pp.save']}" onclick="dlItemDetailsModal.hide();"/>
						</td>
			   		</tr>
				</table>
			</p:panel>
 		</p:dialog>  
 		
		<!-- Item Detail Form -->
		<!-- Sourcing Activities -->
		<p:dataTable id="dtSrcAct" var="srcAct" value="#{planBackingBean.sourcingAct()}"
			emptyMessage="..">   
            <p:column headerText="#{lbl['lbl.pp.sourcing.activities']}">  
	             <p:outputLabel value="#{srcAct}" />  
            </p:column>     
           	<p:column headerText="#{lbl['lbl.pp.kpi.sla']}">  
	             <p:outputLabel value="" />  
            </p:column>   
            <p:column headerText="#{lbl['lbl.pp.planned.activities.startdate']}">  
	             <p:calendar showOn="button" readonly="#{!planBackingBean.managedBean.brandNew}"/> 
            </p:column>  
            <p:column headerText="#{lbl['lbl.pp.planned.activities.enddate']}">  
	          	<p:inputText disabled="true" value="xxx"/>
            </p:column>   
       	</p:dataTable>  
	</p:outputPanel>
	 
</ui:composition>
