<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<ui:define name="sideMenu">
   		<ui:include src="menuPlan.xhtml"/>
    </ui:define>
    <ui:define name="content">
   		<p:panel id="pRightPanel" header="#{planBackingBean.generateHeader('V')}">
   			<!-- Top Button -->
			<div class="ppRightBtn">
				<c:if id="opVerifyButtons" test="#{planBackingBean.managedBean.viewMode == 'V'}">
					<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
					<p:commandButton id="cbAcknowledge" value="#{lbl['lbl.pp.acknowledge']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
					<p:commandButton id="cbVerify" value="#{lbl['lbl.pp.verify']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
					<p:commandButton id="cbReject" value="#{lbl['lbl.pp.reject']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
				</c:if>
			</div>
   			<ui:include src="planContent.xhtml"/>
   		</p:panel>
	</ui:define>
</ui:composition>
