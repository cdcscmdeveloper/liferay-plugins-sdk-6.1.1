<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpDirectPurchase">
		 <br/>
		 <!-- Item List -->
		<p:dataTable id="dtEpItem" styleClass="ppFixTdWidth" var="" value="" emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.expand']}">
	    		<p:rowToggler />
    		</p:column>
	    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.submit']}">  
                <p:outputLabel value="" />  
            </p:column>   
            <p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
                <p:outputLabel value="" />  
            </p:column>   
	        <p:column headerText="#{lbl['lbl.pp.startmonth']}">  
	            <p:outputLabel value="75,000.00" /> 
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.endmonth']}">  
	            <p:outputLabel value="" /> 
	        </p:column>	      
	        <p:column headerText="#{lbl['lbl.pp.item.remarks']}">  
	            <p:outputLabel value="" /> 
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pp.action']}">  
                <!--  <p:rowEditor /> -->    
            </p:column>  
            <p:rowExpansion>  
            	<p:dataTable id="dtEpItem" styleClass="ppFixTdWidth" var="" value="" emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
			    	<p:column styleClass="ppSmallTd" headerText="#{lbl['lbl.pp.seq']}">  
			            <p:outputLabel value="" />  
			        </p:column>   
			        <p:column headerText="#{lbl['lbl.pp.gosodo.code']}">  
			            <p:outputLabel value="27199" /> 
			        </p:column>   
			        <p:column headerText="#{lbl['lbl.pp.activity.description']}">  
			            <p:outputLabel value="PembelianBekalanPejabat" />
			        </p:column> 
			        <p:column headerText="#{lbl['lbl.pp.financial.year']}">  
			            <p:outputLabel value="2013" />     
			        </p:column>  
			        <p:column headerText="#{lbl['lbl.pp.available.budgeted.amount']}">  
			            <p:outputLabel value="75,000.00" /> 
			        </p:column>  
			        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}">  
			            <p:outputLabel value="75,000.00" /> 
			        </p:column>  
		           <p:column headerText="#{lbl['lbl.pp.product.code']}">  
			            <p:outputLabel value="xxx" /> 
			        </p:column>
			        <p:column headerText="#{lbl['lbl.pp.program.activiti.projek.setia.amanah.code']}">  
			            <p:outputLabel value="75,000.00" /> 
			        </p:column> 
			        <p:column headerText="#{lbl['lbl.pp.item.remarks']}">  
		            	<p:outputLabel value="xxx" /> 
		        	</p:column>   
		    	</p:dataTable>  
            </p:rowExpansion>
    	</p:dataTable>  
    	<br/>
    	<!-- Button(s) -->
    	<c:if test="#{planBackingBean.managedBean.brandNew}">
	    	<div class="ppRightBtn">
				<p:commandButton id="cbAddItemDet" value="#{lbl['lbl.pp.add.item']}"  onclick="dlItemDetailsDpModal.show();" />
				<br/>
				<br/>
			</div>
		</c:if>
		
 		<!-- Sub Item Details -->
 		<p:dialog id="dlItemDetailsDp" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsDpModal" 
	              	 modal="true" resizable="false" styleClass="ppDiaglogBigBg" dynamic="true" appendToBody="true">  
      			<ui:include src="directPurchaseDet.xhtml"/>
		</p:dialog>  
	</p:outputPanel>

</ui:composition>
