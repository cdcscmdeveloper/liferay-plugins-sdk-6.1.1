<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opEpDirectPurchase">
		
		<!-- Top Button -->
		<div class="ppRightBtn">
			<p:commandButton id="cbSubConfirm" value="#{lbl['lbl.pp.confirm']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp; 
			<p:commandButton id="cbSubCancel" value="#{lbl['lbl.pp.cancel']}" onclick="dlItemDetailsModal.hide();"  />&nbsp;
		</div>
		<p:panel header="#{lbl['lbl.pp.item.details.form']}">
			<table width="70%" class="ppTwoPartsTable">
				<tr>
					<th>#{lbl['lbl.pp.planned.activities.startdate']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:calendar showOn="button" /> 
					</td>
				</tr>
				<tr>
					<th>#{lbl['lbl.pp.planned.activities.enddate']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:calendar showOn="button" /> 
					</td>
				</tr>
				<tr>
					<th>#{lbl['lbl.pp.item.remarks']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:inputTextarea cols="20" rows="3" value="xxx" />
					</td>
				</tr>
			</table>
		</p:panel>
		<!-- Details -->
		<p:panel id="pItemDetailsContract" header="#{lbl['lbl.pp.details']}" toggleable="true">
			<!-- Item List -->
			<p:outputPanel>
				<ui:include src="itemList.xhtml"/>
			</p:outputPanel>
	    	<br/>
	    	<br/>
			<!-- Item Details -->
			<p:outputPanel>
				<ui:include src="itemDetails.xhtml"/>
			</p:outputPanel>
		</p:panel>
	</p:outputPanel>
</ui:composition>
