<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpFavorPlan">
		<!-- Favourite Activities -->
		<p:panel header="#{lbl['lbl.pp.favourite.activities']}">
			<table width="70%" class="ppTwoPartsTable">
				<tr>
					<th>#{lbl['lbl.pp.plan.name']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:inputText value="xxx" />
					</td>
				</tr>
				<tr>
					<th>#{lbl['lbl.pp.recurring.frequency']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:inputText value="#{planBackingBean.managedBean.recurringFreq}">
						    <p:ajax event="change" update="opPlanEpFavorPlan" />
						</p:inputText>
					</td>
				</tr>
				<!-- Repeat this based on recurring frequency -->
				<c:if id="recurFreq" test="#{planBackingBean.managedBean.recurringFreq &gt; 1}">
					<!-- Repeat this based on recurring frequency -->
					<c:forEach begin="0" end="#{planBackingBean.managedBean.recurringFreq-1}" varStatus="loop">
						<tr>
							<th>#{lbl['lbl.pp.planned.activities.start.end.month']} ${loop.index+1}</th>
							<td class="ppSmallTd">:</td>
							<td>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="#{lbl['lbl.select']}" />
								</p:selectOneMenu>
								<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="#{lbl['lbl.select']}" />
								</p:selectOneMenu>
							</td>
						</tr>
					</c:forEach>
				</c:if>
				<c:if id="recurFreq" test="#{planBackingBean.managedBean.recurringFreq &lt; 1}">
					<tr>
						<th>#{lbl['lbl.pp.planned.activities.start.end.month']}</th>
						<td class="ppSmallTd">:</td>
						<td>
							<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
									<f:selectItem itemLabel="#{lbl['lbl.select']}" />
							</p:selectOneMenu>
							<p:selectOneMenu disabled="#{!planBackingBean.managedBean.brandNew}">>
								<f:selectItem itemLabel="#{lbl['lbl.select']}" />
							</p:selectOneMenu>
						</td>
					</tr>
				</c:if>
				<tr>
					<th>#{lbl['lbl.pp.item.remarks']}</th>
					<td class="ppSmallTd">:</td>
					<td>
						<p:inputTextarea cols="20" rows="3" value="-" />
					</td>
				</tr>
			</table>
		</p:panel>
		<!-- Details -->
		<p:panel id="pItemDetailsContract" header="#{lbl['lbl.pp.details']}" >
			<!-- Item List -->
			<p:outputPanel>
				<ui:include src="itemList.xhtml"/>
			</p:outputPanel>
			
			<!-- Button(s) -->
			<c:if test="#{planBackingBean.managedBean.brandNew}">
				<div class="ppRightBtn">
			    	<br/>
			    	<br/>
					<p:commandButton id="cbAddItemDet" value="#{lbl['lbl.pp.add.item']}"  onclick="dlItemDetailsFpModal.show();" />
				</div>
			</c:if>
			
	 		<!-- Sub Item Details -->
	 		<p:dialog id="dlItemDetailsFp" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsFpModal" 
		              	 modal="true" resizable="false" styleClass="ppDiaglogBg" dynamic="true" appendToBody="true">  
	      			<ui:include src="itemDetails.xhtml"/>
			</p:dialog>  
		</p:panel>
		  
			
	</p:outputPanel>

</ui:composition>
