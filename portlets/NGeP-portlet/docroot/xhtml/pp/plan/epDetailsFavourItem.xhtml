<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opPlanEpFavorItem">
	  	<!-- Details -->
		<p:panel id="pItemDetailsContract" header="#{lbl['lbl.pp.favourite.item']}" >
			<!-- Item List -->
			<p:outputPanel>
				<ui:include src="itemList.xhtml"/>
			</p:outputPanel> 
			
			<!-- Button(s) -->
			<c:if test="#{planBackingBean.managedBean.brandNew}">
				<div class="ppRightBtn">
			    	<br/>
			    	<br/>
					<p:commandButton id="cbAddItemDet" value="#{lbl['lbl.pp.add.item']}"  onclick="dlItemDetailsModal.show();" />
				</div>
			</c:if>
	 		<!-- Sub Item Details -->
	 		<p:dialog id="dlItemDetails" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDetailsModal" 
		              	 modal="true" resizable="false" styleClass="ppDiaglogBg" dynamic="true">  
	      			<ui:include src="itemDetails.xhtml"/>
			</p:dialog>  
		</p:panel>
	</p:outputPanel>

</ui:composition>
