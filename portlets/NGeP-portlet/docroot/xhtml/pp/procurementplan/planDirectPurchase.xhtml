<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<p:outputPanel id="opTabDirectPurchase">
		<!-- Direct Purchase Sub Header -->
		<table class="ppTwoTable">
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.planned.activity.startmonth']}"/></th>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlanActivity.planStartMonth}" 
						styleClass="ppDropDownWidthM" disabled="#{!planBackingBean.managedBean.selectedPlanActivity.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
						<f:selectItems value="#{planBackingBean.shortMonths()}"/>
					</p:selectOneMenu>
				</td>
				<th><p:outputLabel value="#{lbl['lbl.pp.planned.activity.endmonth']}"/></th>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlanActivity.planEndMonth}" 
						styleClass="ppDropDownWidthM" disabled="#{!planBackingBean.managedBean.selectedPlanActivity.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="12"/>
						<f:selectItems value="#{planBackingBean.shortMonths()}"/>
					</p:selectOneMenu>
				</td>
			</tr>
		</table>
		
		<!-- Direct Purchase Commodity List -->
		<p:dataTable id="dtCommodities" styleClass="ppFixTdWidth"  rowIndexVar="rowIndex" 
			var="ppPlanItem" value="#{planBackingBean.managedBean.selectedPlanActivity.ppPlanItems}"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
			
        	<p:column headerText="#{lbl['lbl.pp.product.commodity.code']}">  
				<p:selectOneMenu id="somCommodity" disabled="#{!ppPlanItem.editable}" styleClass="ppDropDownWidthM">
					<f:selectItem itemLabel="#{lbl['lbl.select']}" />	
				</p:selectOneMenu>
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.product.commodity.desc']}">  
				<p:inputText id="itCommodityDesc" disabled="true" styleClass="ppDisplayTextS" value="-" />
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pp.item']}"> 
              	<p:commandLink id="clItem" immediate="true" oncomplete="dlItemDpModal.show()">
                	<p:graphicImage value="#{
                		planBackingBean.managedBean.viewMode==PPConst.modeView
                		? '/resources/ep/images/design/document.png' 
                		:'/resources/ep/images/design/edit.png'}" />
          		</p:commandLink>
            </p:column>  
            <p:column headerText="#{lbl['lbl.pp.action']}"> 
               	<p:commandLink 
                  	update="dtCommodities" disabled="#{!ppPlanItem.brandNew}">  
                  	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
               	</p:commandLink> 
            </p:column>  
    	</p:dataTable> 
    	
    	<br/>
    	<!-- Button(s) -->
   		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.pp.add']}" icon="ui-icon-add" immediate="true"
				 action="#{planBackingBean.addCommodity()}" update="dtCommodities"
				 disabled="#{!(planBackingBean.managedBean.viewMode==PPConst.modeNew 
				 || planBackingBean.managedBean.viewMode==PPConst.modeRevision)}"/> 
	 		<br/>
	 		<br/>
 		</div> 
	</p:outputPanel>
	<ui:include src="planItemDp.xhtml"/>
</ui:composition>
