<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>

	<!-- Item List for Direct Purchase -->
	<p:dialog id="dlItemDp" header="#{lbl['lbl.pp.item.details']}" widgetVar="dlItemDpModal"
   		resizable="false" styleClass="ppDialogBg" dynamic="true">  
		<p:outputPanel id="opItemDp">
			<p:dataTable id="dtItemDp" styleClass="ppFixTdWidth" var="item" 
				value="#{planBackingBean.managedBean.selectedPlanItem.ppPlanDtls}"  rowIndexVar="rowIndex"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
		        <p:column headerText="#{lbl['lbl.pp.gosodo.code']}"> 
                   <p:selectOneMenu 
						disabled="#{!item.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<p:ajax event="change" update="somSo"/>
					</p:selectOneMenu>
					<p:selectOneMenu id="somSo"
						disabled="#{!item.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<p:ajax event="change" update="somDo"/>
					</p:selectOneMenu>
					<p:selectOneMenu  id="somDo" 
						disabled="#{!item.editable}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
						<p:ajax event="change" update="itAvailbleBud"/>
					</p:selectOneMenu> 
		        </p:column>   
		        <p:column headerText="#{lbl['lbl.pp.estimated.amount']}">    
	                   <p:inputText value="-" styleClass="ppDisplayTextS"
	                   		disabled="#{!item.editable}"/>&nbsp;
		        </p:column>
	        	<p:column headerText="#{lbl['lbl.pp.balance.amount']}"> 
					 <p:inputText id="itAvailbleBud" styleClass="ppDisplayTextS" disabled="true"
						 	value="-" />
				</p:column>  
		        <p:column headerText="#{lbl['lbl.pp.action']}"> 
	                <p:commandLink action="#{planBackingBean.deleteItem(item)}"
	                  	update="dtItemDp" disabled="#{!(item.brandNew ||planBackingBean.managedBean.viewMode==PPConst.modeRevision)}" 	 
	                  	>
	                  	<p:graphicImage value="/resources/ep/images/design/trash.png"/>
                 	</p:commandLink>
	            </p:column>  
	    	</p:dataTable>  
	    	<br/>
	    	
	    	<!-- Button(s) -->
	   		<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pp.add']}" 
					update="dtItemDp" icon="ui-icon-add" action="#{planBackingBean.addItem}"
					disabled="#{!(planBackingBean.managedBean.viewMode==PPConst.modeNew 
						|| planBackingBean.managedBean.viewMode==PPConst.modeRevision)}"/>  
		 		<br/>
		 		<br/>
	 		</div>
	 		
			<hr/>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pp.ok']}" update="opItemDp" oncomplete="dlItemDpModal.hide()"
					process="dlItemDp" icon="ui-icon-accept"/>
				<p:commandButton value="#{lbl['lbl.pp.cancel']}" icon="ui-icon-cancel" update="opItemDp" 
					onclick="dlItemDpModal.hide()" immediate="true"/>
			</div>
		</p:outputPanel>
	</p:dialog>
</ui:composition>
