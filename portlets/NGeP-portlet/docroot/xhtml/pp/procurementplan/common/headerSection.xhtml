<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<p:outputPanel id="pPlanHeader">
		
		<div class="button-wrapper">
			<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
		    	action="#{pPlanBackingBean.redirectToSearchPlan}"/>

	    	<div class="rowBtnRight">
			 	<p:commandButton value="#{lbl['lbl.btn.save']}" 
   					update="@([id$=Msg])">
   					<f:param name="disableValidation" value="true" />     
				</p:commandButton>
				&nbsp;
				<p:commandButton value="#{lbl['lbl.btn.submit']}" 
		    		action="#{pPlanBackingBean.redirectToSearchPlan}">
					<f:param name="disableValidation" value="true" />     
				</p:commandButton>
	    	</div>
	  	</div>
	</p:outputPanel>
</ui:composition>
