<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:outputPanel id="pPlanHeaderSection">
		
		<div class="button-wrapper">
			<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif" />
			</p:blockUI>		
			<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
				rendered="#{pPlanBackingBean.managedBean.backAllow}" 
		    	action="#{pPlanBackingBean.redirectToSearchPlan}"/>

	    	<div class="rowBtnRight">
				<ui:repeat
					var="bpmAction"
					value="#{pPlanBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" update="@form" rendered="#{bpmAction != 'CANCEL'}"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{pPlanBackingBean.savePlan(bpmAction)}">
						<f:param name="disableValidation" value="true" />     
					</p:commandButton>
				</ui:repeat>
				<c:if
					test='#{pPlanBackingBean.managedBean.viewMode}'>
						<td colspan="4" style="text-align: right">	
							<p:commandLink
								value="#{lbl['lbl.td.doc.trackingDiary']}"
								action="#{trackingDiarySearchBackingBean.goToTrackingDiarySearch(ModuleCodeConstant.PROCUREMENT_PLAN,pPlanBackingBean.retrievePlanDocType(pPlanBackingBean.managedBean.selectedPlan),pPlanBackingBean.managedBean.selectedPlan.planNo,pPlanBackingBean.managedBean.selectedPlan.planId,pPlanBackingBean.managedBean.selectedPlan.status.statusId)}"
								immediate="true" />&#160;&#160;
					<p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
						<p:fileDownload value="#{pPlanBackingBean.generateReport(plan)}" />
					</p:commandLink>
						</td>		
				</c:if>
	    	</div>
	  	</div>
	</p:outputPanel>
	<div class="clear"></div>
</ui:composition>
