<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:fn="http://java.sun.com/jsp/jstl/functions"
>
	<p:outputPanel id="opTabQt">
		<p:dataTable id="dtSrcAct" styleClass="ppFixTdWidth" var="qtActivity" 
			value="#{planBackingBean.managedBean.selectedPlan.allPpPlanActivities}"
			rowIndexVar="rowIndex">
			<p:column headerText="#{lbl['lbl.pp.activity.name']}">  
	            #{qtActivity.pmBusinessActivity.mandatory ? '*' : ''} 
	            #{qtActivity.pmBusinessActivity.activityName}
	            
	            #{qtActivity.pmBusinessActivity.multiple ? 'add' : ''}
	        </p:column>
			<p:column headerText="#{lbl['lbl.pp.kpi.sla']}">  
				#{qtActivity.pmBusinessActivity.slaDay}
	        </p:column>
			<p:column headerText="#{lbl['lbl.pp.planned.activity.startdate']}">
				<p:calendar showOn="button" value="#{qtActivity.planStartDate}" pattern="MM/dd/yyyy" 
					disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew &amp;&amp; planBackingBean.managedBean.viewMode!=PPConst.modeRevision}">
					<p:ajax event="dateSelect" update="ipEndDate"
						 />
					<p:ajax event="change" update="ipEndDate" value="#{qtActivity.planEndDate}" pattern="MM/dd/yyyy" 
						 />
				</p:calendar>
			</p:column>
			<p:column headerText="#{lbl['lbl.pp.planned.activity.enddate']}">
				<p:calendar showOn="button" id="ipEndDate"
					disabled="true" />
			</p:column>
		</p:dataTable>
	</p:outputPanel>
</ui:composition>
