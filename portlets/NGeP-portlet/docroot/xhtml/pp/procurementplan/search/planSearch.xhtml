<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pPlanSearch" header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pp.ministry']}"/>
				</td>
				<td><ac:lov id="lovMinistry" lovId="PM_ORG_PROFILE" size="60" 	
						disabled="#{pPlanBackingBean.managedBean.disabledMinistryLov}"		        	
		            	update=":form:pPlanSearch" readonly="true"
						headerText="#{lbl['lbl.pp.ministry']}"
						postUpdateListener="pPlanBackingBean.updateMinistrySearchCriteria"
						value="#{pPlanBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}" 
						saveObject="pPlanBackingBean.managedBean.selectedMinistry"
						conditionField="#{pPlanBackingBean.constructMinistryConditionFields()}"/>						
		         	<p:message id="lovMinistryMsg" for="lovMinistry" display="icon" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}"/>
				</td>
				<td>
					<ac:lov id="lovKumpulanPTJ" lovId="PM_ORG_PROFILE" size="60" 	
						disabled="#{empty pPlanBackingBean.managedBean.selectedMinistry or pPlanBackingBean.managedBean.disabledKumpulanPTJLov}"		        	
		            	update=":form:pPlanSearch" readonly="true"
						headerText="#{lbl['lbl.pp.kumpulan.ptj']}"
						postUpdateListener="pPlanBackingBean.updateKPTJSearchCriteria"
						value="#{pPlanBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}" 
						saveObject="pPlanBackingBean.managedBean.selectedKumpulanPTJ"
						conditionField="#{pPlanBackingBean.constructKumpulanPTJConditionFields()}"/>						
		         	<p:message id="lovKumpulanPTJMsg" for="lovKumpulanPTJ" display="icon" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pp.ptj']}"/>
				</td>
				<td>
					<ac:lov id="lovPTJ" lovId="PM_ORG_PROFILE" size="60" 	
					disabled="#{empty pPlanBackingBean.managedBean.selectedKumpulanPTJ or pPlanBackingBean.managedBean.disabledPTJLov}"		        	
		            	update=":form:pPlanSearch" readonly="true"
						headerText="#{lbl['lbl.pp.ptj']}"
						value="#{pPlanBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}" 
						saveObject="pPlanBackingBean.managedBean.selectedPTJ"
						postUpdateListener="pPlanBackingBean.updateSearchCriteria"
						conditionField="#{pPlanBackingBean.constructPTJConditionFields()}"/>						
		         	<p:message id="lovPTJMsg" for="lovPTJ" display="icon" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.plan.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somPlanType" label="#{lbl['lbl.pp.plan.type']}" 
						styleClass="ppDropDownWidthM"  value="#{pPlanBackingBean.managedBean.planSearchBean.planType.parameterCode}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{pPlanBackingBean.retrievePplanType()}"
							var="parameter" itemLabel="#{parameter.codeName}"
							itemValue="#{parameter.pmParameter.parameterCode}" />					
							<!-- <f:selectItems value="#{pPlanBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.planType, pPlanBackingBean.planTypeSearchBean)}" />
							<p:ajax event="change" listener="#{pPlanBackingBean.changePlanTypeSearch(pPlanBackingBean.managedBean.planSearchBean.planType.parameterId)}" 
									update="somVotSearch"/> -->
						<p:ajax event="change" process="@this" update="ppSearchTitle,@this,ppSearchStatus" 
							listener="#{pPlanBackingBean.changeSearchPlanType(pPlanBackingBean.managedBean.planSearchBean.planType.parameterCode)}" /> 
					</p:selectOneMenu>
				</td>				
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.plan.year']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somPlanYearSearch" label="#{lbl['lbl.pp.plan.year']}" 
						styleClass="ppDropDownWidthM"  value="#{pPlanBackingBean.managedBean.planSearchBean.year}"
						>
						<f:selectItems value="#{pPlanBackingBean.getPlanYearOptions(false)}"/>
					</p:selectOneMenu>
				</td>				
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.pp.plan.number']}"/>
				</td>
				<td>
					<p:inputText size="27" styleClass="ppDisplayTextM" value="#{pPlanBackingBean.managedBean.planSearchBean.planNumber}"/>
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.pp.plan.title']}"/>
				</td>
				<td>
					<p:inputText id="ppSearchTitle" 
						disabled="#{empty pPlanBackingBean.managedBean.planSearchBean.planType or 
						ProcurementPlanConst.planTypeProcurement ne pPlanBackingBean.managedBean.planSearchBean.planType.parameterCode}" 
						size="60" 
						value="#{pPlanBackingBean.managedBean.planSearchBean.planTitle}"/>
				</td>				
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
				<td><p:selectOneMenu id="ppSearchStatus" 
						disabled="#{empty pPlanBackingBean.managedBean.planSearchBean.planType or empty pPlanBackingBean.managedBean.planSearchBean.planType.parameterCode}" 
						value="#{pPlanBackingBean.managedBean.planSearchBean.status}">
								<f:selectItems
									value="#{pPlanBackingBean.retrievePlanStatus()}" />
				</p:selectOneMenu></td>
					
					</tr>
			<ui:remove>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.vot.amanah.type']}" />
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" id="somVotSearch" 
						disabled="#{pPlanBackingBean.managedBean.planSearchBean.planType.parameterCode ne ParameterConst.planTypeExpenditure}"
						label="#{lbl['lbl.pp.vot.amanah.type']}" value="#{pPlanBackingBean.managedBean.planSearchBean.votType.parameterId}"
					>
						<f:selectItems value="#{pPlanBackingBean.getVotTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			</ui:remove>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"  id="ppSearchBtn"
							process="pPlanSearch"
							update="dtPlanResult" 
							action="#{pPlanBackingBean.searchPlan}"
							/>
						<p:commandButton id="ppResetBtn" value="#{lbl['lbl.btn.reset']}" action="#{pPlanBackingBean.resetPlanSearchBean}"
							update="pPlanSearch, dtPlanResult" 
							/> 
					</div>
				</td>
			</tr>
		</table>
		  <ac:lovPopup />
	</p:panel>

</ui:composition>
