<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.pp.annual.plan.searchCriteria']}" id="apSearchCriteria" style="margin-right:20px;" toggleable="false" collapsed="false">	
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pp.annual.plan.searchCriteria.title']}" />
				</td>
				<td>
					<p:inputText value="#{pPlanBackingBean.managedBean.planSearchBean.titleOrDesc}" size="30" />
				</td>
			</tr>
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pp.category']}" />
				</td>
				<td>					
					<p:selectOneMenu id="somCategory" label="#{lbl['lbl.pp.category']}" 
						value="#{pPlanBackingBean.managedBean.planSearchBean.categoryType.parameterId}" >
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems value="#{pPlanBackingBean.getProcurementCategoryOptions()}" var="obj" 
							itemValue="#{obj.procurementCat.parameterId}" 
							itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementCat)}"/>					
					</p:selectOneMenu>
				</td>
			</tr>			
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pp.ministry']}" />
				</td>
				<td>
					<ac:lov id="minstryPtj" lovId="PM_ORG_PROFILE_MINSTRY"
						headerText="#{lbl['lbl.pp.annual.plan.searchCriteria.ministry']}" update="@form"
						saveObject="pPlanBackingBean.managedBean.selectedMinistry"
						value="#{pPlanBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
						size="25" readonly="true"
						postUpdateListener="pPlanBackingBean.updateMinistrySearchCriteria" 
						conditionField="#{pPlanBackingBean.constructMinistryConditionFields()}" />				
				</td>
			</tr>			
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}" />
				</td>
				<td>
					<ac:lov id="PtjGropup" lovId="PM_ORG_PROFILE_PTJ_GROUP"
						headerText="#{lbl['lbl.pp.annual.plan.searchCriteria.kump.ptj']}" update="@form"
						saveObject="pPlanBackingBean.managedBean.selectedKumpulanPTJ"
						value="#{pPlanBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
						size="25" readonly="true" 
						postUpdateListener="pPlanBackingBean.updateKPTJSearchCriteria"
						conditionField="#{pPlanBackingBean.constuctConditionFieldsForPTJGroup()}" /> <!-- [Bug#27032] -->			
				</td>
			</tr>			
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pp.ptj']}" />
				</td>
				<td>
					<ac:lov id="openPtj" lovId="PM_ORG_PROFILE_PTJ"
						headerText="#{lbl['lbl.pp.annual.plan.searchCriteria.ptj']}"
						saveObject="pPlanBackingBean.managedBean.selectedPTJ"
						value="#{pPlanBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}"
						size="25" readonly="true"
						postUpdateListener="pPlanBackingBean.updateSearchCriteria"
						conditionField="#{pPlanBackingBean.constuctConditionFieldsForPTJ()}" /> <!-- [Bug#27032] -->					
				</td>	
			</tr>
		</table>
		
		<p:panel header="#{lbl['lbl.pp.invitation.date']}" id="invitationdate" toggleable="true" collapsed="true">
			<h:panelGrid id="rangeInvitationDatePG" columns="2" border="0"
				cellpadding="0" cellspacing="0" width="100%" rendered="true">
				<p:column rendered="true" style="white-space: nowrap">
					<h:outputText value="#{lbl['lbl.pp.annual.plan.searchCriteria.fromdate']}" />
				</p:column>
				<p:column rendered="true">
					<p:calendar showOn="button" readonlyInput="true" id="invitationDtFrm"
						value="#{pPlanBackingBean.managedBean.planSearchBean.invitationDateFrom}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						size="10" 
						mindate="#{pPlanBackingBean.managedBean.invitationMinDateFrom}" 
						maxdate="#{pPlanBackingBean.managedBean.invitationMaxDate}" >
						<p:ajax event="dateSelect" partialSubmit="true" listener="#{pPlanBackingBean.setMinDateMaxDate}" update=":form:invitationDtTo" />
					</p:calendar>
				</p:column>				
				<p:column rendered="true" style="white-space: nowrap">
					<h:outputText value="#{lbl['lbl.pp.annual.plan.searchCriteria.todate']}" />
				</p:column>
				<p:column rendered="true">
					<p:calendar showOn="button" readonlyInput="true" id="invitationDtTo"
						value="#{pPlanBackingBean.managedBean.planSearchBean.invitationDateTo}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						mindate="#{pPlanBackingBean.managedBean.invitationMinDateTo}"						 
						maxdate="#{pPlanBackingBean.managedBean.invitationMaxDate}"
						size="10" >
					</p:calendar>
				</p:column>
			</h:panelGrid>			
		</p:panel>
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td class="ppRightBtn">
					<p:commandButton
						id="apSearchButton" value="#{lbl['lbl.btn.search']}"
						action="#{pPlanBackingBean.searchProcurementAnnualPlan}"
						update="@form" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" process=":form:apSearchCriteria" 
						styleClass="BtnSpacing">
					</p:commandButton> 
					<p:commandButton 
						id="apResetButton" value="#{lbl['lbl.btn.reset']}" 
						action="#{pPlanBackingBean.resetProcurementAnnualPlanSearchBean}" 
						update="@form"
						process="@this" styleClass="BtnSpacing">
					</p:commandButton>
				</td>
			</tr>
		</table>
		
		<!-- include dialog panel  -->
		<ac:lovPopup />
	</p:panel>
	
</ui:composition>
