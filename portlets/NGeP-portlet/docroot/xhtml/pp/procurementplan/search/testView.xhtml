<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
		<p>TEST VIEW</p>
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="BPM STATUS"/>
				</th>
				<td>
					<p:selectOneMenu
						styleClass="ppDropDownWidthM" value="#{pPlanBackingBean.managedBean.currentStatus}"
						>
						<f:selectItems value="#{pPlanBackingBean.managedBean.statusList}"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="ROLE"/>
				</th>
				<td>
					<p:selectOneMenu
						styleClass="ppDropDownWidthM" value="#{pPlanBackingBean.managedBean.currentRole}"
						>
						<f:selectItems value="#{pPlanBackingBean.managedBean.roleList}"/>
					</p:selectOneMenu>
				</td>
			</tr>
		</table>
		<hr/>
</ui:composition>
