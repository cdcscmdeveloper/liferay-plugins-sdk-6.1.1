<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<script type="text/javascript">
		/*
			This is to update grand total at footer without reloading the whole datatable
			gtBudgetAmt, gtPlanAmt, gtNonAllocAmt - the class name of grand total fields 
			hiddenGtBudgetAmt, hiddenGtPlanAmt, hiddenGtNonAllocAmt - the class name of calculated value in hidden fields
		*/
		function updateEpFooterH(){
			document.getElementsByClassName('gtBudgetAmtH')[0].innerHTML = document.getElementsByClassName('hiddenGtBudgetAmtH')[0].value;
			document.getElementsByClassName('gtPlanAmtH')[0].innerHTML = document.getElementsByClassName('hiddenGtPlanAmtH')[0].value;
			document.getElementsByClassName('gtNonAllocAmtH')[0].innerHTML = document.getElementsByClassName('hiddenGtNonAllocAmtH')[0].value;
			
		}
			
 	</script>
	<p:panel id="opPlanEpH" header="#{lbl['lbl.pp.plan.details.h']}" toggleable="true">

		<p:inputText style="display:none" id="hiddenGtBudgetAmtH" styleClass="hiddenGtBudgetAmtH" value="#{pPlanBackingBean.managedBean.epTotalBudgetH}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<p:inputText style="display:none" id="hiddenGtPlanAmtH" styleClass="hiddenGtPlanAmtH" value="#{pPlanBackingBean.managedBean.epTotalPlanH}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<p:inputText style="display:none" id="hiddenGtNonAllocAmtH" styleClass="hiddenGtNonAllocAmtH" value="#{pPlanBackingBean.managedBean.epTotalNonEpAllocH}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<div id="hGlAccErrMsgDiv" style="display:none;">
			<p:messages id="hGlAccMsg" showDetail="true" autoUpdate="false" closable="true" showSummary="false" escape="false"/>
		</div>
	   	<p:dataTable id="dtExpenditurePlanH" styleClass="dtProcurementPlan" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
		     var="epItem" value="#{pPlanBackingBean.managedBean.epItemsH}" rendered="#{epItem.recordStatusFlg != 2}"
		     rowIndexVar="index" rowKey="#{epItem}">
			<ac:paginator for="dtExpenditurePlanH" />
	    	<p:columnGroup type="header">
				<p:row>
				 	<!-- #24975 -->
				 	<p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.action']}" />
					     	<ac:iconTooltip value="#{lbl['lbl.pp.action.tooltip']}" />
					    </f:facet>
				    </p:column>
				    <p:column  width="10%">
					    <f:facet name="header">
					    	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.object']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="15%" headerText="#{lbl['lbl.pp.type.of.expenses']}" />
				    <p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.total.approved.budget']}" />
					    </f:facet>
				    </p:column>
			        <p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.budget.spend.ep']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.non.ep.allocation']}" />
					    </f:facet>
				    </p:column>
				    <!-- hiding fulfillment via ep column -->
					<ui:remove>
				    	<p:column width="5%">
					    	<f:facet name="header">
					     		<h:outputText value="#{lbl['lbl.pp.fulfillment.via.ep']}" />
					    	</f:facet>
				    	</p:column>
				    </ui:remove>
				    <!-- hiding ep usage target column -->
					<ui:remove>
				    	<p:column width="5%">
					    	<f:facet name="header">
					     		<h:outputText value="#{lbl['lbl.pp.ep.usage.target']}" />
					    	</f:facet>
				    	</p:column>
				    </ui:remove>
			      	<p:column width="5%" rendered="#{pPlanBackingBean.managedBean.modeReview}">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reject.and.reason']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.justification']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%" rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}">
				    	<f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reason.for.update']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.status']}" />
					    </f:facet>
				    </p:column>
			        <p:column width="5%" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" >
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.last.updated']}" />
					    </f:facet>
				    </p:column>
				</p:row>
			</p:columnGroup>
			<!-- [SIR#12802] - start -->
			<p:column>
				<!--25549@18092020 -->
				<p:selectBooleanCheckbox id="checkBox" 
					disabled="#{!(epItem.brandNew ? epItem.brandNew : epItem.selectable) or !epItem.selectable}" 
					value="#{epItem.deleted}"/>
			<!-- #24975 -->
				<p:commandLink
				        rendered="#{!(epItem.brandNew ? epItem.brandNew : epItem.selectable) and pPlanBackingBean.managedBean.modeEditable}"
				        id="addUpdateEpBInfo" 
						immediate="true" 
						update="dtExpenditurePlanH" 
						partialSubmit="true"
						disabled="#{epItem.cloneEnabled or epItem.disableForPindaan or (epItem.recordStatusFlg eq 9)}">
				     <h:graphicImage value="/css/images/design/ico-viewnedit.png"  
				     style="float:left; padding-left: 5px;" process="@this">
				      <p:ajax event="click"
				      		listener="#{pPlanBackingBean.addUpdateEpAllInfo(ParameterConst.votAmanah, pPlanBackingBean.managedBean.selectedPlan, index)}"
				      		disabled="#{epItem.cloneEnabled or epItem.disableForPindaan or (epItem.recordStatusFlg eq 9)}"
				      		update="@form"/>
				      </h:graphicImage>
				</p:commandLink>
			  </p:column>
			<!-- [SIR#12802] - end -->
	        <p:column style="white-space:nowrap;">
	        	<p:inputText 
						size="10"
						id="itSelectedGlAccount" 
						value="#{epItem.pmGlAccount.glAccCode}" 
						readonly="true"
						required="#{!empty param['disableValidation']}"
						/>
					&#160;	
					<!--25549@18092020 -->
					<p:commandLink id="glAccountSearchCL" 
						partialSubmit="true"
						disabled="#{!(epItem.brandNew) or epItem.disableEditAccount or (epItem.recordStatusFlg eq 9)}"
						process="@this" 
						readonly="true" 
						action="#{pmGoSearchBackingBean.initPmGoPopup}"
						oncomplete="pmGoPopup.show();"
						update=":form:glAccountCcId:goDoPanelId" >
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
						<f:param name="index" 	value="#{index}" />
						<f:param name="type" 	value="h" />
						<f:param name="update" 	value=":form:dtExpenditurePlanH :form:hGlAccMsg" />
						<f:param name="kptjId" 	value="#{pPlanBackingBean.retrieveKptjId()}" />
						<p:resetInput target=":form"></p:resetInput>						
					</p:commandLink>
					
	       		<ui:remove><ac:lov id="lovGlAccount" lovId="PM_GL_ACCOUNT" size="10" 
	       			update=":form:dtExpenditurePlanH :form:hGlAccMsg" 
   					disabled="#{!epItem.brandNew}"
			    	required="#{!empty param['disableValidation']}"
	            	readonly="true" 
	            	postUpdateListenerWithIndex="pPlanBackingBean.validateEpItemHLov"
					headerText="#{lbl['lbl.pp.goso.code']}"
					value="#{epItem.pmGlAccount.glAccCode}" 
					saveObject="pPlanBackingBean.managedBean.epItemsH[#{index}].pmGlAccount"
					conditionField="recordStatus^1" 
				/></ui:remove>
				
	        </p:column>	 
	        <p:column>
		  		#{epItem.pmGlAccount.description}
	        </p:column>
	        <p:column>
	            <!--25549@18092020 -->
   				<p:inputText style="width:90%; " value="#{epItem.budgetAmt}" required="#{!empty param['disableValidation']}" 
		  			id="itBudgetAmt" styleClass="amountRight" label="#{lbl['lbl.pp.total.approved.budget']}" 
		  			disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable) or (epItem.recordStatusFlg eq 9)}"
		  			onkeypress="if (event.keyCode == 13) { return false; }">
		  			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		  			<f:attribute name="max" value="99999999999"/>		
					<f:validator validatorId="quantityDoubleRangeValidator" />
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculateNonAllocationBudget(epItem, ParameterConst.votAmanah)}"
		  				update=":form:hiddenGtBudgetAmtH, :form:hiddenGtNonAllocAmtH, otNonAllocAmt, itBudgetAmt,itBudgetAmtMsg" oncomplete="updateEpFooterH();" 
		  				 />
		  		</p:inputText>
		  		<p:message id="itBudgetAmtMsg" for="itBudgetAmt" display="icon" />
	        </p:column>
	        <p:column>
	         <!--25549@18092020 -->
   				<p:inputText style="width:90%" value="#{epItem.planAmt}" required="#{!empty param['disableValidation']}" 
		  			id="itPlanAmt" styleClass="amountRight" label="#{lbl['lbl.pp.budget.spend.ep']}"
		  			disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable) or (epItem.recordStatusFlg eq 9)}"
		  			onkeypress="if (event.keyCode == 13) { return false; }">
		  			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		  			<f:attribute name="max" value="99999999999"/>		
					<f:validator validatorId="quantityDoubleRangeValidator" />
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculateNonAllocationBudget(epItem, ParameterConst.votAmanah)}"
		  				update=":form:hiddenGtPlanAmtH, :form:hiddenGtNonAllocAmtH, otNonAllocAmt, itPlanAmt,itPlanAmtMsg" oncomplete="updateEpFooterH();"   />
		  		</p:inputText>
		  		<p:message id="itPlanAmtMsg" for="itPlanAmt" display="icon" />
	        </p:column>
	        <p:column styleClass="amountRight">
	        	<h:outputText id="otNonAllocAmt" value="#{epItem.nonEpAmt}">
	        	<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
	        	</h:outputText>
	        </p:column>
	        <!-- hiding fulfillment via ep column -->
			<ui:remove>
	        	<p:column>
			    	#{lbl['lbl.pp.no.available']}
	        	</p:column>
	        </ui:remove>
	        <!-- hiding ep usage target column -->
			<ui:remove>
	        	<p:column>
			    	#{lbl['lbl.pp.no.available']}
	        	</p:column>
	        </ui:remove>
	        <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeReview}">
		    <p:selectBooleanCheckbox id="chkRejected" value="#{epItem.rejected}" disabled="#{epItem.cloneEnabled or epItem.statusEnabled or !pPlanBackingBean.managedBean.modeReviewEditable}">
		    	<p:ajax event="change" update="clEpReason"/>
			    </p:selectBooleanCheckbox>
			    &#160;
			    <p:commandLink oncomplete="dlRejectReasonWv.show();" action="#{pPlanBackingBean.retrieveEpRejectReasons(epItem)}"
			    	disabled="#{!epItem.rejected or !epItem.reviseReject or (epItem.recordStatusFlg eq 9)}" id="clEpReason" update=":form:dgReason" immediate="true">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.modeReviewEditable ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
	        </p:column>
	        <p:column style="text-align:center;">
	          <!--25549@18092020 -->
	        	<p:commandLink oncomplete="dlItemJustificationWv.show();"  update="@form" action="#{pPlanBackingBean.retrieveJustification(epItem)}"
			    	 id="clEpJustification" disabled="#{epItem.recordStatusFlg eq 9}">
					 <p:graphicImage value="#{!pPlanBackingBean.managedBean.modeEditable or !epItem.selectable ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"
					 disabled="#{pPlanBackingBean.managedBean.modeEditable or epItem.justificationEnabled}" update="@form" />
				</p:commandLink>
	        </p:column>
	        <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}">
	            <!--25549@18092020 -->
		      	<p:commandLink oncomplete="dlItemRemarkWv.show();" action="#{pPlanBackingBean.retrieveEpItemRemark(epItem)}"
			    	update="@form"  immediate="true"  id="clEpRemarkH"
			    	disabled="#{epItem.brandNew ? epItem.brandNew : epItem.selectable}">
				   <p:graphicImage value="/css/images/design/edit.png"
					 disabled="#{(pPlanBackingBean.managedBean.modeEditable) or !epItem.reasonForUpdateEnabled}" update="@form" />
					<f:param name="disableValidation" value="" />
				</p:commandLink>
	        </p:column>
	        <p:column>
	        	<p:selectOneMenu value="#{epItem.recordStatusFlg}" style="width:99%"
	        	   	disabled="#{!(pPlanBackingBean.managedBean.modeEditable) or epItem.cloneEnabled or epItem.statusEnabled}"> 
	        	   	<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
	        	    <!--25549@18092020 -->
	  	            <p:ajax event="change" update="dtExpenditurePlanH" partialSubmit="true"/>
	          	</p:selectOneMenu> 
	        </p:column>
	        <p:column rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}">
	        	<h:outputText value="#{epItem.changedDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
	        </p:column>
	        <p:columnGroup type="footer">
				<p:row>
					<p:column colspan="3">
					 	<f:facet name="footer">
					     	<p:outputLabel value="#{lbl['lbl.pp.grand.total']}" />
					    </f:facet>
					</p:column>
					<p:column>
					   	<f:facet name="footer">
				     		<h:outputText  id="gtBudgetAmtH" value="#{pPlanBackingBean.managedBean.epTotalBudgetH}" styleClass="gtBudgetAmtH">
			     				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				     		</h:outputText>
					    </f:facet>
					</p:column>
					<p:column>
					 	<f:facet name="footer">
					     	<h:outputText  id="gtPlanAmtH" value="#{pPlanBackingBean.managedBean.epTotalPlanH}" styleClass="gtPlanAmtH">
					     		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					     	</h:outputText>
					    </f:facet>
					</p:column>
					 <p:column>
					 	<f:facet name="footer">
					     	<h:outputText  id="gtNonAllocAmtH" value="#{pPlanBackingBean.managedBean.epTotalNonEpAllocH}" styleClass="gtNonAllocAmtH" >
					     		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					     	</h:outputText>
					    </f:facet>
					</p:column>
					<!-- hiding fulfillment via ep column -->
					<ui:remove>
						<p:column>
							<f:facet name="footer">
					     		#{lbl['lbl.pp.no.available']}
					    	</f:facet>
						</p:column>
					</ui:remove>
					<!-- hiding ep usage target column -->
					<ui:remove>
						<p:column>
							<f:facet name="footer">
					     		#{lbl['lbl.pp.no.available']}
					    	</f:facet>
						</p:column>
					</ui:remove>
					<p:column footerText="&#160;"  rendered="#{pPlanBackingBean.managedBean.modeReview}"/>
					<p:column footerText="&#160;" />
				 	<p:column footerText="&#160;"  rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}"/>
				 	<p:column footerText="&#160;" />
					<p:column footerText="&#160;" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" />
				</p:row>
			</p:columnGroup>
		</p:dataTable>

		<div class="ppRightBtn">
		     
		    <!-- #25549@20200819 - start -->
	         <p:commandButton id="btnCloneH" value="#{lbl['lbl.btn.clone']}"
	            action="#{pPlanBackingBean.parameterExpenditure(ParameterConst.votAmanah)}"
	            disabled="#{!pPlanBackingBean.managedBean.modeEditable}"
			    update="dtExpenditurePlanH, ppExpenditureHCloneid, dtclonepitemsHsearchresults"
		 		onclick="cloneExpenditureHPopUp.show()"
		 		rendered="#{pPlanBackingBean.isRolePlanner()}"/>
			    <p:tooltip id="toolTipH" for="btnCloneH" value="#{lbl['lbl.pp.clone.year.tooltip']}"
                    position="bottom"/>
		    <!-- end --> 
		    &#160;
		 	<p:commandButton value="#{lbl['lbl.btn.add']}" immediate="true" update="dtExpenditurePlanH" 
		 		disabled="#{!pPlanBackingBean.managedBean.modeEditable}" partialSubmit="true"
		 		process="@this" action="#{pPlanBackingBean.addEpItemDet(ParameterConst.votAmanah)}"/>
			&#160;
			<p:commandButton value="#{lbl['lbl.btn.delete']}" update="dtExpenditurePlanH" 
				disabled="#{!pPlanBackingBean.managedBean.modeEditable}" action="#{pPlanBackingBean.deleteEpItemDet(ParameterConst.votAmanah)}"
				
			/> 
		</div>
		
	   <!-- #25549 - start -->
		  <p:dialog id="cloneExpenditureHPopUp"  widgetVar="cloneExpenditureHPopUp" closable="false" 
		      header="#{lbl['lbl.pp.plan.h.clone']}" modal="true" width="680">
			<ui:include src="planExpenditureHPopup.xhtml"></ui:include>
		 </p:dialog> 
		<!-- end -->
		
	</p:panel>	
	
</ui:composition>
