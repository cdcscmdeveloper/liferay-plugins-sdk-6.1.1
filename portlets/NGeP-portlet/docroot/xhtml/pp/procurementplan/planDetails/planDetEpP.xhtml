<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<script type="text/javascript">
		/*
			This is to update grand total at footer without reloading the whole datatable
			gtBudgetAmt, gtPlanAmt, gtNonAllocAmt - the class name of grand total fields 
			hiddenGtBudgetAmt, hiddenGtPlanAmt, hiddenGtNonAllocAmt - the class name of calculated value in hidden fields
		*/
		function updateEpFooterP(){
			document.getElementsByClassName('gtBudgetAmtP')[0].innerHTML = document.getElementsByClassName('hiddenGtBudgetAmtP')[0].value;
			document.getElementsByClassName('gtPlanAmtP')[0].innerHTML = document.getElementsByClassName('hiddenGtPlanAmtP')[0].value;
			document.getElementsByClassName('gtNonAllocAmtP')[0].innerHTML = document.getElementsByClassName('hiddenGtNonAllocAmtP')[0].value;
			
		}
			
 	</script>
	<p:panel id="opPlanEpP" header="#{lbl['lbl.pp.plan.details.p']}" toggleable="true">

		<p:inputText style="display:none" id="hiddenGtBudgetAmtP" styleClass="hiddenGtBudgetAmtP" value="#{pPlanBackingBean.managedBean.epTotalBudgetP}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<p:inputText style="display:none" id="hiddenGtPlanAmtP" styleClass="hiddenGtPlanAmtP" value="#{pPlanBackingBean.managedBean.epTotalPlanP}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<p:inputText style="display:none" id="hiddenGtNonAllocAmtP" styleClass="hiddenGtNonAllocAmtP" value="#{pPlanBackingBean.managedBean.epTotalNonEpAllocP}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<div id="pGlAccErrMsgDiv" style="display:none;">
			<p:messages id="pGlAccMsg" showDetail="true" autoUpdate="false" closable="true" showSummary="false" escape="false"/>
		</div>
	   	<p:dataTable id="dtExpenditurePlanP" styleClass="dtProcurementPlan" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
		     var="epItem" value="#{pPlanBackingBean.managedBean.epItemsP}"
		     rowIndexVar="index" rowKey="#{epItem}">
			<ac:paginator for="dtExpenditurePlanP" />
	    	<p:columnGroup type="header">
				<p:row>
				 	<p:column  style="width:2%" />
				    <p:column  width="10%">
					    <f:facet name="header">
					    	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.object']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="15%" headerText="#{lbl['lbl.pp.type.of.expenses']}" />
				    <p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.total.approved.budget']}" />
					    </f:facet>
				    </p:column>
			        <p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.budget.spend.ep']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.non.ep.allocation']}" />
					    </f:facet>
				    </p:column>
				    <!-- hiding fulfillment via ep column -->
					<ui:remove>
				    	<p:column width="5%">
					    	<f:facet name="header">
					     		<h:outputText value="#{lbl['lbl.pp.fulfillment.via.ep']}" />
					    	</f:facet>
				    	</p:column>
				    </ui:remove>
				    <!-- hiding ep usage target column -->
					<ui:remove>
				    	<p:column width="5%">
					    	<f:facet name="header">
					     		<h:outputText value="#{lbl['lbl.pp.ep.usage.target']}" />
					    	</f:facet>
				    	</p:column>
				    </ui:remove>
			      	<p:column width="5%" rendered="#{pPlanBackingBean.managedBean.modeReview}">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reject.and.reason']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.justification']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%" rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}">
				    	<f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reason.for.update']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.status']}" />
					    </f:facet>
				    </p:column>
			        <p:column width="5%" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" >
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.last.updated']}" />
					    </f:facet>
				    </p:column>
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:selectBooleanCheckbox disabled="#{!epItem.brandNew}" value="#{epItem.deleted}"/>
			</p:column>
	        <p:column style="white-space:nowrap;">
	        	<p:inputText 
						size="10"
						id="itSelectedGlAccount" 
						value="#{epItem.pmGlAccount.glAccCode}" 
						readonly="true"
						required="#{!empty param['disableValidation']}"
						/>
					&#160;	
					<p:commandLink id="glAccountSearchCL" 
						partialSubmit="true"
						disabled="#{!epItem.brandNew}"
						process="@this" 
						readonly="true" 
						action="#{pmGoSearchBackingBean.initPmGoPopup}"
						oncomplete="pmGoPopup.show();"
						update=":form:glAccountCcId:goDoPanelId" >
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
						<f:param name="index" 	value="#{index}" />
						<f:param name="type" 	value="p" />
						<f:param name="update" 	value=":form:dtExpenditurePlanP :form:pGlAccMsg" />
					</p:commandLink>
					
					<ui:remove>
	        
	       		<ac:lov id="lovGlAccount" lovId="PM_GL_ACCOUNT" size="10"
	       			update=":form:dtExpenditurePlanP :form:pGlAccMsg" 
   					disabled="#{!epItem.brandNew}"
			    	required="#{!empty param['disableValidation']}"
	            	readonly="true" 
	            	postUpdateListenerWithIndex="pPlanBackingBean.validateEpItemPLov"
					headerText="#{lbl['lbl.pp.goso.code']}"
					value="#{epItem.pmGlAccount.glAccCode}" 
					saveObject="pPlanBackingBean.managedBean.epItemsP[#{index}].pmGlAccount"
					conditionField="recordStatus^1" 
				/>
   		
				<p:message id="lovGOSOMsg" for="lovGlAccount" display="icon" />	</ui:remove> 
	        </p:column>	 
	        <p:column>
		  		#{epItem.pmGlAccount.description}
	        </p:column>
	        <p:column>
   				<p:inputText style="width:90%; " value="#{epItem.budgetAmt}" required="#{!empty param['disableValidation']}" 
		  			id="itBudgetAmt" styleClass="amountRight" label="#{lbl['lbl.pp.total.approved.budget']}" 
		  			disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable)}"
		  			onkeypress="if (event.keyCode == 13) { return false; }">
		  			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		  			<f:attribute name="max" value="99999999999"/>		
					<f:validator validatorId="quantityDoubleRangeValidator" />
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculateNonAllocationBudget(epItem, ParameterConst.votPembangunan)}"
		  				update=":form:hiddenGtBudgetAmtP, :form:hiddenGtNonAllocAmtP, otNonAllocAmt, itBudgetAmt,itBudgetAmtMsg" oncomplete="updateEpFooterP();" 
		  				 />
		  		</p:inputText>
		  		<p:message id="itBudgetAmtMsg" for="itBudgetAmt" display="icon" />
	        </p:column>
	        <p:column>
   				<p:inputText style="width:90%" value="#{epItem.planAmt}" required="#{!empty param['disableValidation']}" 
		  			id="itPlanAmt" styleClass="amountRight" label="#{lbl['lbl.pp.budget.spend.ep']}"
		  			disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable)}"
		  			onkeypress="if (event.keyCode == 13) { return false; }">
		  			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		  			<f:attribute name="max" value="99999999999"/>		
					<f:validator validatorId="quantityDoubleRangeValidator" />
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculateNonAllocationBudget(epItem, ParameterConst.votPembangunan)}"
		  				update=":form:hiddenGtPlanAmtP, :form:hiddenGtNonAllocAmtP, otNonAllocAmt, itPlanAmt,itPlanAmtMsg" oncomplete="updateEpFooterP();"   />
		  		</p:inputText>
		  		<p:message id="itPlanAmtMsg" for="itPlanAmt" display="icon" />
	        </p:column>
	        <p:column styleClass="amountRight">
	        	<h:outputText id="otNonAllocAmt" value="#{epItem.nonEpAmt}">
	        	<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
	        	</h:outputText>
	        </p:column>
	        <!-- hiding fulfillment via ep column -->
			<ui:remove>
	        	<p:column>
			    	#{lbl['lbl.pp.no.available']}
	        	</p:column>
	        </ui:remove>
	        <!-- hiding ep usage target column -->
			<ui:remove>
	        	<p:column>
			    	#{lbl['lbl.pp.no.available']}
	        	</p:column>
	        </ui:remove>
	        <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeReview}">
			    <p:selectBooleanCheckbox id="chkRejected" value="#{epItem.rejected}" disabled="#{!pPlanBackingBean.managedBean.modeReviewEditable or epItem.brandNew}">
			    	<p:ajax event="change" update="clEpReason"/>
			    </p:selectBooleanCheckbox>
			    &#160;
			    <p:commandLink oncomplete="dlRejectReasonWv.show();" action="#{pPlanBackingBean.retrieveEpRejectReasons(epItem)}"
			    	disabled="#{!epItem.rejected or !epItem.editable}" id="clEpReason" update=":form:dgReason" immediate="true">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.modeReviewEditable ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
	        </p:column>
	        <p:column style="text-align:center;">
	        	<p:commandLink oncomplete="dlItemJustificationWv.show();"  update="@form" action="#{pPlanBackingBean.retrieveJustification(epItem)}"
			    	 id="clEpJustification">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.modeEditable ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"/>
					<f:param name="disableValidation" value="" />
				</p:commandLink>
	        </p:column>
	        <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}">
		      	<p:commandLink oncomplete="dlItemRemarkWv.show();" action="#{pPlanBackingBean.retrieveEpItemRemark(epItem)}"
			    	immediate="true" update=":form:dlItemRemark">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.selectedPlan.updatable ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
	        </p:column>
	        <p:column>
	        	<p:selectOneMenu value="#{epItem.recordStatusFlg}" style="width:99%"
	        		disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable) or epItem.brandNew}">  
	            	<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
	          	</p:selectOneMenu> 
	        </p:column>
	        <p:column rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}">
	        	<h:outputText value="#{epItem.changedDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
	        </p:column>
	        <p:columnGroup type="footer">
				<p:row>
					<p:column colspan="3">
					 	<f:facet name="footer">
					     	<p:outputLabel value="#{lbl['lbl.pp.grand.total']}" />
					    </f:facet>
					</p:column>
					<p:column>
					   	<f:facet name="footer">
				     		<h:outputText  id="gtBudgetAmtP" value="#{pPlanBackingBean.managedBean.epTotalBudgetP}" styleClass="gtBudgetAmtP">
			     				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				     		</h:outputText>
					    </f:facet>
					</p:column>
					<p:column>
					 	<f:facet name="footer">
					     	<h:outputText  id="gtPlanAmtP" value="#{pPlanBackingBean.managedBean.epTotalPlanP}" styleClass="gtPlanAmtP">
					     		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					     	</h:outputText>
					    </f:facet>
					</p:column>
					 <p:column>
					 	<f:facet name="footer">
					     	<h:outputText  id="gtNonAllocAmtP" value="#{pPlanBackingBean.managedBean.epTotalNonEpAllocP}" styleClass="gtNonAllocAmtP" >
					     		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					     	</h:outputText>
					    </f:facet>
					</p:column>
					<!-- hiding fulfillment via ep column -->
					<ui:remove>
						<p:column>
							<f:facet name="footer">
					     		#{lbl['lbl.pp.no.available']}
					    	</f:facet>
						</p:column>
					</ui:remove>
					<!-- hiding ep usage target column -->
					<ui:remove>
						<p:column>
							<f:facet name="footer">
					     		#{lbl['lbl.pp.no.available']}
					    	</f:facet>
						</p:column>
					</ui:remove>
					<p:column footerText="&#160;"  rendered="#{pPlanBackingBean.managedBean.modeReview}"/>
					<p:column footerText="&#160;" />
				 	<p:column footerText="&#160;"  rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}"/>
				 	<p:column footerText="&#160;" />
					<p:column footerText="&#160;" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" />
				</p:row>
			</p:columnGroup>
		</p:dataTable>
	
		<div class="ppRightBtn">
		 	<p:commandButton value="#{lbl['lbl.btn.add']}" immediate="true" update="dtExpenditurePlanP" 
		 		disabled="#{!pPlanBackingBean.managedBean.modeEditable}" partialSubmit="true"
		 		process="@this" action="#{pPlanBackingBean.addEpItemDet(ParameterConst.votPembangunan)}"/>
			&#160;
			<p:commandButton value="#{lbl['lbl.btn.delete']}" update="dtExpenditurePlanP" 
				disabled="#{!pPlanBackingBean.managedBean.modeEditable}" action="#{pPlanBackingBean.deleteEpItemDet(ParameterConst.votPembangunan)}"
				
			/> 
		</div>
	</p:panel>
</ui:composition>
