<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:outputPanel id="opRejectReason">
	<p:dialog id="dlRejectReason" header="#{lbl['lbl.pp.reject.reason']}" 
		widgetVar="dlRejectReasonWv" dynamic="true" width="1000" height="300">
		
		<!-- Validation Message -->
		<p:messages id="messagesReason" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:dataGrid id="dgReason" value="#{pPlanBackingBean.managedBean.selectedRejectReasons}" var="reason" 
			rowIndexVar="reasonIndex" columns="1" >
			<table class="ppRmkTable">
				<tr>
					<th rowspan="2" valign="top">
						<h:graphicImage styleClass="smallUserImage" value="#{pPlanBackingBean.userImagePath(reason.createdUser.loginId)}" />
					</th>
					<td>
						<h:outputText value="#{reason.createdUser.loginId}"/>,
						<h:outputText id="reasonDate" value="#{reason.changedDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						</h:outputText>
					</td>
				</tr>
				<tr>
					<td>
						<h:inputTextarea cols="40" value="#{reason.reasonDesc}" rendered="#{reasonIndex==0}" maxlength="1000" /> 
						<h:outputText value="#{reason.reasonDesc}" rendered="#{reasonIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
					</td>
				</tr>
			</table>
		</p:dataGrid>
		<br/>
		<br/>    
 		<div class="ppRightBtn">
		  <p:commandButton value="#{lbl['lbl.btn.ok']}" action="#{pPlanBackingBean.confirmRejectReason}" update="opRejectReason"
		  	oncomplete="dlRejectReasonWv.hide();"/>	
		  <p:commandButton value="#{lbl['lbl.btn.cancel']}" oncomplete="dlRejectReasonWv.hide();" update="opRejectReason"
		  	action="#{pPlanBackingBean.confirmRejectReason}" immediate="true" />		
		</div>      
		
	</p:dialog>
	</p:outputPanel>
</ui:composition>
