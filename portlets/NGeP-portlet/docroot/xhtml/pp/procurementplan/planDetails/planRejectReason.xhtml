<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="dlRejectReason" header="#{lbl['lbl.pp.reject.reason']}" 
		widgetVar="dlRejectReasonWv" dynamic="true" width="700" height="200" closable="false">
		<p:ajax event="close" listener="#{pPlanBackingBean.closeRejectReason}" update="dgReason"/>
		<p:remoteCommand name="confirmCmd" action="#{pPlanBackingBean.confirmReasonCloseDialog}" update="dgReason" oncomplete="dlRejectReasonWv.hide()" />
		<p:remoteCommand name="cancelCmdRjt"  update="dgReason"  oncomplete="dlRejectReasonWv.hide()" />
		<p:outputPanel id="opRejectReason">
		<!-- Validation Message -->
		<p:messages id="messagesReason" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:dataGrid id="dgReason" value="#{pPlanBackingBean.managedBean.selectedRejectReasons}" var="reason" emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
			rowIndexVar="reasonIndex" columns="1" >
			<table class="ppRmkTable">
				<tr>
					<th rowspan="2" valign="top" style="width:15%;">
						<h:graphicImage styleClass="smallUserImage" value="#{pPlanBackingBean.userImagePathWithDefaultImage(reason.userId)}" />
					</th>
					<td style="width:85%;white-space:normal;">
						<h:outputText value="#{reason.createdUsername}"/>,
						<h:outputText id="reasonDate" value="#{reason.changedDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						</h:outputText>
					</td>
				</tr>
				<tr>
					<td>
						<!-- for phase 1 -->
						<p:inputTextarea cols="40" value="#{reason.reasonDesc}" disabled="#{!pPlanBackingBean.managedBean.modeReviewEditable}"
							 maxlength="1000">
						</p:inputTextarea>
						
						<!-- enable this for phase 2 and disable phase 1 section to test 
						<p:inputTextarea id="itaReason" cols="40" value="#{reason.reasonDesc}" 
							disabled="#{!pPlanBackingBean.managedBean.modeReviewEditable}"
							rendered="#{reason.editable or reason.brandNew}" /> 
						<h:outputText value="#{reason.reasonDesc}" rendered="#{!reason.editable and !reason.brandNew}" 
							style="display: inline-block; width:220px;word-wrap: break-word;" />
					-->
						
					</td>
				</tr>
			</table>
		</p:dataGrid>
	
		<br/>
		<br/>  
 		<div class="ppRightBtn">
		  <p:commandButton id="cmdReasonOk" value="#{lbl['lbl.btn.ok']}"  immediate="true" oncomplete="confirmCmd();" />
		  <p:commandButton id="cmdReasonCancel" value="#{lbl['lbl.btn.cancel']}" immediate="true" oncomplete="cancelCmdRjt();" />		
		</div>      
		</p:outputPanel>
	</p:dialog>
	
</ui:composition>
