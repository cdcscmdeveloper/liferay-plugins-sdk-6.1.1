<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	
	<p:outputPanel id="opPlanActors">
		<table class="ppTwoTable">
			<c:if test="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterCode eq ParameterConst.planTypeProcurement}">
				<tr>
					<th>
						<p:outputLabel value="#{lbl['lbl.pp.plan.verification.officer']}"/>
						<p:outputLabel value="*" styleClass="mandatory" />
					</th>
					<td>
						<p:pickList styleClass="ppActors" id="plVerifier" var="actor" itemValue="#{actor}" itemLabel="#{actor.userName}"
							value="#{pPlanBackingBean.managedBean.verifierModel}" disabled="#{!pPlanBackingBean.managedBean.modeEditable or !pPlanBackingBean.isRolePlanner()}"
						    filterMatchMode="contains" converter="pmUserConverter">
							<f:facet name="sourceCaption">#{lbl['lbl.pp.available.verifier']}</f:facet>
							<f:facet name="targetCaption">#{lbl['lbl.pp.selected.verifier']}</f:facet>
							<p:column style="width:75%;">
								<h:outputText value="#{actor.userName}" />
							</p:column>
						</p:pickList>
					</td>
					<th>
						
					</th>
					<td>
						
					</td>
				</tr>
			</c:if>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.plan.approver']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:pickList styleClass="ppActors" id="plAppover" var="actor" itemValue="#{actor}" itemLabel="#{actor.userName}"
						value="#{pPlanBackingBean.managedBean.approverModel}" disabled="#{!pPlanBackingBean.managedBean.modeEditable or !pPlanBackingBean.isRolePlanner()}"
						filterMatchMode="contains" converter="pmUserConverter">
						<f:facet name="sourceCaption">#{lbl['lbl.pp.available.approver']}</f:facet>
						<f:facet name="targetCaption">#{lbl['lbl.pp.selected.approver']}</f:facet>
						<p:column style="width:75%;">
							<h:outputText value="#{actor.userName}" />
						</p:column>
					</p:pickList>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
		</table>
	</p:outputPanel>
</ui:composition>
