<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	
	<p:outputPanel id="opPlanRemark">
		<p:dataGrid value="#{pPlanBackingBean.managedBean.selectedPlan.ppRemarks}" var="remarkVar" 
			rowIndexVar="remarkIndex" columns="1" >
			<table class="ppRmkTable">
				<tr>
					<th rowspan="2" valign="top">
						<h:graphicImage styleClass="smallUserImage" value="#{pPlanBackingBean.userImagePath(remarkVar.createdUser.loginId)}" />
					</th>
					<td>
						<h:outputText value="#{remarkVar.createdUser.loginId}"/>,
						<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						</h:outputText>
					</td>
					<th>
						
					</th>
					<td>
						
					</td>
				</tr>
				<tr>
					<td>
						<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" maxlength="1000" /> 
						<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
					</td>
					<th>
						
					</th>
					<td>
						
					</td>
				</tr>
			</table>
		</p:dataGrid>
	</p:outputPanel>
</ui:composition>
