<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	
	<p:outputPanel id="opPlanRemark">
	
		<p:dataGrid value="#{pPlanBackingBean.managedBean.selectedRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
			<table class="ppRmkTable">
				<tr>
					<td rowspan="2" valign="top">
						<h:graphicImage styleClass="smallUserImage"  value="#{pPlanBackingBean.userImagePathWithDefaultImage(remarkVar.userId)}"  />
					</td>
					<td width="5"></td>
					<td>
						<h:outputText value="#{remarkVar.createdUsername}"></h:outputText>,
						<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						</h:outputText>
					</td>
				</tr>
				<tr>
					<td></td>
					<td>
						<p:inputTextarea cols="40" maxlength="1000" value="#{remarkVar.remark}" rendered="#{remarkVar.brandNew}"/> 
						<h:outputText value="#{remarkVar.remark}" rendered="#{!remarkVar.brandNew}" style="display: inline-block; width:220px;word-wrap: break-word;" />
					</td>
				</tr>
			</table>
		</p:dataGrid>

	</p:outputPanel>
</ui:composition>
