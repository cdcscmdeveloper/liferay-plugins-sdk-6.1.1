<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
    
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<table class="ppTwoTable" style="width: 100%;">
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pp.ministry']}" />
			</th>
			<td>
				<p:inputTextarea disabled="true" value="#{pPlanBackingBean.retrieveMinistry()}"></p:inputTextarea>
			</td>
			<th>
				<p:outputLabel value="#{lbl['lbl.pp.pegawai.pengawal']}" />
			</th>
			<td>
				<p:inputTextarea disabled="true" value="#{pPlanBackingBean.retrievePegawaiPengawal()}"></p:inputTextarea>
			</td>
			<th>
				
			</th>
			<td>
				
			</td>
		</tr>
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}" />
			</th>
			<td>
				<p:inputTextarea disabled="true" value="#{pPlanBackingBean.retrieveKumpulanPtj()}"></p:inputTextarea>
			</td>
			<th>
				<p:outputLabel value="#{lbl['lbl.pp.ptj']}" />
			</th>
			<td>
				<p:inputTextarea disabled="true" value="#{pPlanBackingBean.managedBean.selectedPlan.orgProfile.pmOrgValidity.orgCode} /
					 #{pPlanBackingBean.managedBean.selectedPlan.orgProfile.pmOrgValidity.orgName}"></p:inputTextarea>
			</td>
			<th>
				
			</th>
			<td>
				
			</td>
		</tr>
		
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pp.plan.type']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</th>
			<td>
				<p:selectOneMenu styleClass="ppDropDownWidthM" id="somPlanType" disabled="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}"
					required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pp.plan.type']}"
					value="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterId}"
					>
						<f:selectItems value="#{pPlanBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.planType, pPlanBackingBean.planTypeSearchBean)}" />
					<p:ajax event="change" listener="#{pPlanBackingBean.changePlanType(pPlanBackingBean.managedBean.selectedPlan.planType.parameterId)}" 
						update=":form:pPlanDet, :form:pPlanActor, somPlanYear"/>
				</p:selectOneMenu>
				<p:message id="somPlanTypeMsg" for="somPlanType" display="icon" />
			</td>
			<th>
				<p:outputLabel value="#{lbl['lbl.pp.plan.year']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</th>
			<td>
				<p:selectOneMenu styleClass="ppDropDownWidthM" id="somPlanYear" 
					disabled="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew 
					or pPlanBackingBean.managedBean.selectedPlan.planType.parameterId == null}"
					required="#{!empty param['disableValidation']}"
					label="#{lbl['lbl.pp.plan.year']}"
					value="#{pPlanBackingBean.managedBean.selectedPlan.planYear}"
					>
					<f:selectItems value="#{pPlanBackingBean.getPlanYearOptions(pPlanBackingBean.managedBean.selectedPlan.brandNew)}"/>
					<p:ajax event="change" listener="#{pPlanBackingBean.updatePlanYearControl(pPlanBackingBean.managedBean.selectedPlan.planYear)}" 
						update="@form"/>
				</p:selectOneMenu>
				&#160;&#160;   
                <p:graphicImage id="giPlanYear" value="/css/images/design/tooltips.png" />
				<p:tooltip for="giPlanYear" value="#{lbl['lbl.pp.plan.year.tooltip']}" showEffect="fade" hideEffect="fade" />
				<p:message id="somPlanYearMsg" for="somPlanYear" display="icon" />
			</td>
			<th>
				
			</th>
			<td>
				
			</td>
		</tr>
		<tr>
			<th>
				&nbsp;
			</th>
			<td>
				&nbsp;
			</td>
			<th>
				&nbsp;
			</th>
			<td>
				&nbsp;
			</td>
		</tr>
	</table>
</ui:composition>
