<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
    
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<table class="ppTwoTable" style="width: 70%;">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.pp.ministry']}" />
			</td>
			<td colspan ="3">
				<p:inputText disabled="true" style="width:100%;" value="#{pPlanBackingBean.retrieveMinistry()}"></p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.pp.pegawai.pengawal']}" />
			</td>
			<td colspan ="3">
				<p:inputText disabled="true" style="width:100%;" value="#{pPlanBackingBean.retrievePegawaiPengawal()}"></p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}" />
			</td>
			<td colspan ="3">
				<p:inputText disabled="true" style="width:100%;" value="#{pPlanBackingBean.retrieveKumpulanPtj()}"></p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.pp.ptj']}" />
			</td>
			<td colspan ="3">
				<p:inputText disabled="true" style="width:100%;" value="#{pPlanBackingBean.managedBean.selectedPlan.orgProfile.pmOrgValidity.orgCode} / #{pPlanBackingBean.managedBean.selectedPlan.orgProfile.pmOrgValidity.orgName}"></p:inputText>
			</td>
		</tr>
		<c:if test="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterCode eq ParameterConst.planTypeProcurement}">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.pp.ptj.address']}" />
				</td>
				<td colspan ="3">
					<p:inputTextarea disabled="true" style="white-space:normal" readonly="true"
						rows="7" cols="60" escape="false" value="#{pPlanBackingBean.retrievePpBillingAddr()}"/>
				</td>
			</tr>
		</c:if>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.pp.plan.type']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:selectOneMenu styleClass="ppDropDownWidthM" id="somPlanType" disabled="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}"
					required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pp.plan.type']}"
					value="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterId}"
					>
						<f:selectItems value="#{pPlanBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.planType, pPlanBackingBean.planTypeSearchBean)}" />
					<p:ajax event="change" listener="#{pPlanBackingBean.changePlanType(pPlanBackingBean.managedBean.selectedPlan.planType.parameterId)}" 
						update=":form:pPlanDet, :form:pPlanActor, somPlanYear,:form:pPlanHeader"/>
				</p:selectOneMenu>
				<p:message id="somPlanTypeMsg" for="somPlanType" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.pp.plan.year']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:selectOneMenu styleClass="ppDropDownWidthM" id="somPlanYear" 
					disabled="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew 
					or pPlanBackingBean.managedBean.selectedPlan.planType.parameterId == null}"
					required="#{!empty param['disableValidation']}"
					label="#{lbl['lbl.pp.plan.year']}"
					value="#{pPlanBackingBean.managedBean.selectedPlan.planYear}"
					valueChangeListener="#{pPlanBackingBean.verifyPlanYearControl}"
					>
					<f:selectItems value="#{pPlanBackingBean.getPlanYearOptions(pPlanBackingBean.managedBean.selectedPlan.brandNew)}"/>
					<p:ajax event="change"  partialSubmit="true"  
						update=":form:pPlanDet, :form:pPlanActor,:form:pPlanHeader"/>
					<p:ajax event="valueChange" partialSubmit="true" process="@this" update=":form:pPlanDet, :form:pPlanActor,:form:pPlanHeader"/>
				</p:selectOneMenu>
				&#160;&#160;   
                <p:graphicImage id="giPlanYear" value="/css/images/design/tooltips.png" />
				<p:tooltip for="giPlanYear" value="#{lbl['lbl.pp.plan.year.tooltip']}" showEffect="fade" hideEffect="fade" />
				<p:message id="somPlanYearMsg" for="somPlanYear" display="icon" />
			</td>			
		</tr>
	</table>
	<ui:remove>
	<ac:confirmationPopup id="planYearChangeId"
			widget="planYearChangeId"
			okProcess="@form"
			okAction="pPlanBackingBean.updatePlanYearControl()"
			cancelAction="pPlanBackingBean.cancelPlanYearUpdate()"
			width="220" height="200"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pp.plan.year.change']}" 
			update=":form:pPlanDet,:form:pPlanHeader" 
			resetInput="" />
	</ui:remove>	
	<p:dialog id="planYearChangeId" widgetVar="planYearChangeId"
			header="#{lbl['lbl.btn.dialog.cofirm.header']}" 
			resizable="false"
			width="420" height="150"
			closable="false" modal="true"
			visible="false">
			
		<p:blockUI block="dlgPPlanHeader" widgetVar="confirmPopupBlockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:panel id="dlgPPlanHeader" style="border: none">
		<table>
			<tr>
				<td>
					<h:graphicImage style="text-align:left" value="/css/images/design/exclamation.png" />
					<p:outputLabel style="text-align:left" value="#{lbl['lbl.pp.plan.year.change']}" />
				</td>
			</tr>
		</table>
		<p:spacer height="1" />
		<div class="ppRightBtn">				
		   <p:commandButton value="#{lbl['lbl.btn.yes']}" 
				process="@form"
				partialSubmit="true"
				onstart="confirmPopupBlockWidget.show();"
				action="#{pPlanBackingBean.updatePlanYearControl()}"
				oncomplete="confirmPopupBlockWidget.hide(); planYearChangeId.hide();" 
				update=":form:pPlanDet,:form:pPlanHeader" />	   
	
			<p:commandButton value="#{lbl['lbl.btn.no']}"
				partialSubmit="true" 
				onstart="confirmPopupBlockWidget.show();"
				action="#{pPlanBackingBean.cancelPlanYearUpdate()}"
				oncomplete="confirmPopupBlockWidget.hide(); planYearChangeId.hide();" 
				update=":form:pPlanDet,:form:pPlanHeader" />			
		</div>
		</p:panel>
	</p:dialog>
	
</ui:composition>
