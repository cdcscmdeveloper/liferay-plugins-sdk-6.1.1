<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<script type="text/javascript">
		/*
			This is to update grand total at footer without reloading the whole datatable
			gtBudgetAmt, gtPlanAmt, gtNonAllocAmt - the class name of grand total fields 
			hiddenGtBudgetAmt, hiddenGtPlanAmt, hiddenGtNonAllocAmt - the class name of calculated value in hidden fields
		*/
		function updateEpFooter(){
			document.getElementsByClassName('gtBudgetAmt')[0].innerHTML = document.getElementsByClassName('hiddenGtBudgetAmt')[0].value;
			document.getElementsByClassName('gtPlanAmt')[0].innerHTML = document.getElementsByClassName('hiddenGtPlanAmt')[0].value;
			document.getElementsByClassName('gtNonAllocAmt')[0].innerHTML = document.getElementsByClassName('hiddenGtNonAllocAmt')[0].value;
			
		}
			
 	</script>
	<p:outputPanel id="opPlanEp">
	<br/>
		<p:inputText style="display:none" id="hiddenGtBudgetAmt" styleClass="hiddenGtBudgetAmt" value="#{pPlanBackingBean.managedBean.epTotalBudget}"/>
		<p:inputText style="display:none" id="hiddenGtPlanAmt" styleClass="hiddenGtPlanAmt" value="#{pPlanBackingBean.managedBean.epTotalPlan}"/>
		<p:inputText style="display:none" id="hiddenGtNonAllocAmt" styleClass="hiddenGtNonAllocAmt" value="#{pPlanBackingBean.managedBean.epTotalNonEpAlloc}"/>

	   	<p:dataTable id="dtExpenditurePlan" styleClass="dtProcurementPlan" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
		     var="epItem" value="#{pPlanBackingBean.managedBean.selectedPlan.ppExpenditureItems}"
		     selection="#{pPlanBackingBean.managedBean.deleteEpItems}" 
		     rowIndexVar="index" rowKey="#{epItem}">
		
	    	<p:columnGroup type="header">
				<p:row>
				 	<p:column selectionMode="multiple"  style="width:2%" />
				    <p:column  width="10%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.object']}" />
					     	<h:outputText value="* " styleClass="mandatory" />
					    </f:facet>
				    </p:column>
			     	<p:column width="15%" headerText="#{lbl['lbl.pp.type.of.expenses']}" />
				    <p:column width="7%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.total.approved.budget']}" />
					    </f:facet>
				    </p:column>
			        <p:column width="7%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.budget.spend.ep']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="7%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.non.ep.allocation']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="7%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.fulfillment.via.ep']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="7%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.ep.usage.target']}" />
					    </f:facet>
				    </p:column>
			      	<p:column width="5%" rendered="#{pPlanBackingBean.managedBean.modeReview}">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reject.and.reason']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.justification']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%" rendered="#{pPlanBackingBean.managedBean.modeEditable and pPlanBackingBean.managedBean.selectedPlan.updatable}">
				    	<f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reason.for.update']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.status']}" />
					    </f:facet>
				    </p:column>
			        <p:column width="5%" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" >
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.last.updated']}" />
					    </f:facet>
				    </p:column>
				</p:row>
			</p:columnGroup>
		  
			<p:column selectionMode="multiple"  style="width:2%" />
	        <p:column style="white-space:nowrap;">
	        
	       		<ac:lov id="lovGlAccount" lovId="PM_GL_ACCOUNT" size="10" update=":form:dtExpenditurePlan" 
   					disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable)}"
			    	required="#{!empty param['disableValidation']}"
	            	readonly="true" 
					headerText="#{lbl['lbl.pp.goso.code']}"
					value="#{epItem.pmGlAccount.glAccCode}" 
					saveObject="pPlanBackingBean.managedBean.selectedPlan.ppExpenditureItems[#{index}].pmGlAccount"
					conditionField="recordStatus^1" 
				/>
   		
				<p:message id="lovGOSOMsg" for="lovGlAccount" display="icon" />	 
	        </p:column>	 
	        <p:column>
		  		#{epItem.pmGlAccount.description}
	        </p:column>
	        <p:column>
   				<p:inputText style="width:90%; " value="#{epItem.budgetAmt}" required="#{!empty param['disableValidation']}" 
		  			id="itBudgetAmt" label="#{lbl['lbl.pp.total.approved.budget']}" 
		  			disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable)}">
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculateNonAllocationBudget(epItem)}"
		  				update=":form:hiddenGtBudgetAmt, :form:hiddenGtNonAllocAmt, otNonAllocAmt" oncomplete="updateEpFooter();" 
		  				 />
		  		</p:inputText>
		  		<p:message id="itBudgetAmtMsg" for="itBudgetAmt" display="icon" />
	        </p:column>
	        <p:column>
   				<p:inputText style="width:90%" value="#{epItem.planAmt}" required="#{!empty param['disableValidation']}" 
		  			id="itPlanAmt" label="#{lbl['lbl.pp.budget.spend.ep']}"
		  			disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable)}">
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculateNonAllocationBudget(epItem)}"
		  				update=":form:hiddenGtPlanAmt, :form:hiddenGtNonAllocAmt, otNonAllocAmt" oncomplete="updateEpFooter();"   />
		  		</p:inputText>
		  		<p:message id="itPlanAmtMsg" for="itPlanAmt" display="icon" />
	        </p:column>
	        <p:column>
	        	<p:outputLabel id="otNonAllocAmt" value="#{epItem.nonEpAmt}" />
	        </p:column>
	        <p:column>
			    #{lbl['lbl.pp.no.available']}
	        </p:column>
	        <p:column>
			    #{lbl['lbl.pp.no.available']}
	        </p:column>
	        <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeReview}">
			    <p:selectBooleanCheckbox id="chkRejected" value="#{epItem.rejected}" disabled="#{!pPlanBackingBean.managedBean.modeReviewEditable}">
			    	<p:ajax event="change" update="clEpReason"/>
			    </p:selectBooleanCheckbox>
			    &#160;
			    <p:commandLink oncomplete="dlRejectReasonWv.show();" action="#{pPlanBackingBean.retrieveEpRejectReasons(epItem)}"
			    	disabled="#{!epItem.rejected}" id="clEpReason" update=":form:dlRejectReason" immediate="true">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.modeReviewEditable ? '/css/images/design/document.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
	        </p:column>
	        <p:column>
	        	<p:commandLink oncomplete="dlItemJustificationWv.show();" action="#{pPlanBackingBean.retrieveJustification(epItem)}"
			    	 id="clEpJustification" update=":form:dlItemJustification" immediate="true">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.modeEditable ? '/css/images/design/document.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
   			 	<p:inputTextarea id="itaRemark" value="#{epItem.remark}" required="#{epItem.nonEpAmt>0}" rendered="false"
   			 		
					label="#{lbl['lbl.pp.remarks']}" autoResize="false" 
			 		style="width:90%" maxlength="1000">
			 		<p:ajax event="change"  process="@this"/>
			 	</p:inputTextarea>
	        </p:column>
	        <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeEditable and pPlanBackingBean.managedBean.selectedPlan.updatable}">
		      	<p:commandLink oncomplete="dlItemRemarkWv.show();" action="#{pPlanBackingBean.retrieveEpItemRemark(epItem)}"
			    	immediate="true" update=":form:dlItemRemark">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.selectedPlan.updatable ? '/css/images/design/document.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
	        </p:column>
	        <p:column>
	        	<p:selectOneMenu value="#{epItem.recordStatusFlg}" style="width:99%"
	        		disabled="#{!(pPlanBackingBean.managedBean.modeEditable and epItem.editable) or epItem.brandNew}">  
	            	<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
	          	</p:selectOneMenu> 
	        </p:column>
	        <p:column rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}">
	        	<h:outputText value="#{epItem.changedDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
	        </p:column>
	        <p:columnGroup type="footer">
				<p:row>
					<p:column colspan="3">
					 	<f:facet name="footer">
					     	<p:outputLabel value="#{lbl['lbl.pp.grand.total']}" />
					    </f:facet>
					</p:column>
					<p:column>
					   	<f:facet name="footer">
				     		<p:outputLabel id="gtBudgetAmt" value="#{pPlanBackingBean.managedBean.epTotalBudget}" styleClass="gtBudgetAmt"  />
					    </f:facet>
					</p:column>
					<p:column>
					 	<f:facet name="footer">
					     	<p:outputLabel id="gtPlanAmt" value="#{pPlanBackingBean.managedBean.epTotalPlan}" styleClass="gtPlanAmt" />
					    </f:facet>
					</p:column>
					 <p:column>
					 	<f:facet name="footer">
					     	<p:outputLabel id="gtNonAllocAmt" value="#{pPlanBackingBean.managedBean.epTotalNonEpAlloc}" styleClass="gtNonAllocAmt"  />
					    </f:facet>
					</p:column>
					<p:column>
						<f:facet name="footer">
					     	#{lbl['lbl.pp.no.available']}
					    </f:facet>
					</p:column>
					<p:column>
						<f:facet name="footer">
					     	#{lbl['lbl.pp.no.available']}
					    </f:facet>
					</p:column>
					<p:column footerText="&#160;"  rendered="#{pPlanBackingBean.managedBean.modeReview}"/>
					<p:column footerText="&#160;" />
				 	<p:column footerText="&#160;"  rendered="#{pPlanBackingBean.managedBean.modeEditable  and pPlanBackingBean.managedBean.selectedPlan.updatable}"/>
				 	<p:column footerText="&#160;" />
					<p:column footerText="&#160;" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" />
				</p:row>
			</p:columnGroup>
		</p:dataTable>
		<br/>
       	<br/>
		<div class="ppRightBtn">
		 	<p:commandButton value="#{lbl['lbl.btn.add']}" immediate="true" update="dtExpenditurePlan" 
		 		disabled="#{!pPlanBackingBean.managedBean.modeEditable}" partialSubmit="true"
		 		process="@this" action="#{pPlanBackingBean.addEpItemDet()}"/>
			&#160;
			<p:commandButton id="cbEpItemDelete" value="#{lbl['lbl.btn.delete']}" update="dtExpenditurePlan" 
				disabled="#{!pPlanBackingBean.managedBean.modeEditable}" action="#{pPlanBackingBean.deleteEpItemDet()}"
				
			/> 
		</div>
	</p:outputPanel>
	<ac:lovPopup /> 	
	
</ui:composition>
