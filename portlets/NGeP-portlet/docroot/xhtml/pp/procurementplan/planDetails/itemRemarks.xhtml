<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<p:dialog id="dlItemRemark" header="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterCode ne ParameterConst.planTypeExpenditure ? lbl['lbl.pp.item.remark'] : lbl['lbl.pp.reason.for.update']}" 
		widgetVar="dlItemRemarkWv" modal="true" dynamic="true" width="700" height="200" closable="false">
		
		<p:ajax event="close" listener="#{pPlanBackingBean.closeItemRemark}" update="opItemRemark"/>
				
		<p:outputPanel id="opItemRemark">
			<p:dataGrid id="dgItemRemark" value="#{pPlanBackingBean.managedBean.selectedItemRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" emptyMessage="#{lbl['lbl.pp.no.record.found']}" >
				<table class="ppRmkTable">
					<tr>
						<td rowspan="2" valign="top" style="width:15%;">
							<h:graphicImage styleClass="smallUserImage"  value="#{pPlanBackingBean.userImagePathWithDefaultImage(remarkVar.userId)}"  />
						</td>
						<td style="width:85%;white-space:normal;">
							<h:outputText value="#{remarkVar.createdUsername}"></h:outputText>,
							<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td>
							<!-- for phase 1 -->
							<p:inputTextarea cols="40" maxlength="1000" value="#{remarkVar.remark}"
								disabled="#{!pPlanBackingBean.managedBean.modeEditable}">								
							</p:inputTextarea>  
								
							<!-- enable this for phase 2 and disable phase 1 section to test	
							<p:inputTextarea cols="40" maxlength="1000" value="#{remarkVar.remark}" 
								disabled="#{!pPlanBackingBean.managedBean.modeEditable}"
								rendered="#{remarkVar.editable or remarkVar.brandNew}"/> 
							<h:outputText value="#{remarkVar.remark}" rendered="#{!remarkVar.editable and !remarkVar.brandNew}" 
								style="display: inline-block; width:220px;word-wrap: break-word;" />
								 -->
					 
					
						</td>
					</tr>
				</table>
			</p:dataGrid>
			<br/>
			<br/>  
	 		<div class="ppRightBtn">
			  <p:commandButton id="cmdItemRemarkOk" value="#{lbl['lbl.btn.ok']}" process=":form:opItemRemark" action="#{pPlanBackingBean.confirmRemarkCloseDialog}"  update="@form"/>
			  <p:commandButton id="cmdItemRemarkCancel" value="#{lbl['lbl.btn.cancel']}" immediate="true"  oncomplete="dlItemRemarkWv.hide();" update="@form"/>		
			</div>      
		</p:outputPanel>
	</p:dialog>
</ui:composition>
