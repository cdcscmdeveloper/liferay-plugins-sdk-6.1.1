<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="dlUpdateReason" header="#{lbl['lbl.pp.reason.for.update']}" 
		widgetVar="dlUpdateReasonWv" dynamic="true" width="700" height="200" closable="false">
		<p:ajax event="close" listener="#{pPlanBackingBean.closeUpdateReason}" update="updReason"/>
		<p:remoteCommand name="confirmCmd" action="#{pPlanBackingBean.confirmReasonCloseDialog}" update="updReason" oncomplete="dlUpdateReasonWv.hide()" />
		<p:remoteCommand name="cancelCmdRjt"  update="updReason"  oncomplete="dlUpdateReasonWv.hide()" />
		<p:outputPanel id="opUpdateReason">
		<!-- Validation Message -->
		<p:messages id="updateReason" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:dataGrid id="updReason" value="#{pPlanBackingBean.managedBean.selectedUpdateReasons}" var="reason" emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
			rowIndexVar="reasonIndex" columns="1" >
			<table class="ppRmkTable">
				<tr>
					<th rowspan="2" valign="top" style="width:15%;">
						#{lbl['lbl.pp.reason.for.update']}
					</th>
				</tr>
				<tr>
					<td>
						<!-- for phase 1 -->
						<p:inputTextarea cols="40" value="#{reason.reasonDesc}" rendered="#{reason.editable or !reason.brandNew}"
							 maxlength="200"
							 onkeyup="limitTextArea(this,200);"
							onkeydown="limitTextArea(this,200);"
							required="#{!empty param['disableValidation']}"
							disabled="#{pPlanBackingBean.managedBean.disable}"> <!-- #24975@18012021 -->
							<p:ajax event="change" process="@this" />
						</p:inputTextarea>
						<!-- enable this for phase 2 and disable phase 1 section to test 
						<p:inputTextarea id="itaReason" cols="40" value="#{reason.reasonDesc}" 
							disabled="#{!pPlanBackingBean.managedBean.modeReviewEditable}"
							rendered="#{reason.editable or reason.brandNew}" /> 
						<h:outputText value="#{reason.reasonDesc}" rendered="#{!reason.editable and !reason.brandNew}" 
							style="display: inline-block; width:220px;word-wrap: break-word;" />
					-->
					</td>
				</tr>
				<!-- #24975 - Hide Remarks as per consensus with business
				<tr>
					<th rowspan="2" valign="top" style="width:15%;">
						#{lbl['lbl.pm.access.app.remarks']}
					</th>
				</tr>
				<tr>
					<td>
						<p:inputTextarea cols="40" value="#{reason.reasonDesc}" rendered="#{reason.editable or reason.brandNew}"
							 maxlength="200"
							 onkeyup="limitTextArea(this,200);"
							onkeydown="limitTextArea(this,200);">
						</p:inputTextarea>
					</td>
				</tr>
				 -->
				<tr>
					<th rowspan="2" valign="top" style="width:15%;">
						<h:graphicImage styleClass="smallUserImage" value="#{pPlanBackingBean.userImagePathWithDefaultImage(reason.userId)}" />
					</th>
					<td style="width:85%;white-space:normal;">
						<h:outputText value="#{reason.createdUsername}"/>,
						<h:outputText id="reasonDate" value="#{reason.changedDate}">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						</h:outputText>
					</td>
				</tr>
			</table>
		</p:dataGrid>
 		<div class="ppRightBtn">
				<!-- #35502, Fix as-is bug: #38696 Start -->
				<p:commandButton id="updReasonOk" value="#{lbl['lbl.btn.ok']}"
					process=":form:updReason"
					action="#{pPlanBackingBean.confirmReasonCloseDialog}"
					update="@form" />
				<p:commandButton id="updReasonCancel"
					value="#{lbl['lbl.btn.cancel']}"
					oncomplete="dlUpdateReasonWv.hide();" process="@this"
					immediate="true" update="@form" />
				<!--#35502, Fix as-is bug: #38696 End -->
			</div>   
		</p:outputPanel>
	</p:dialog>
	
</ui:composition>
