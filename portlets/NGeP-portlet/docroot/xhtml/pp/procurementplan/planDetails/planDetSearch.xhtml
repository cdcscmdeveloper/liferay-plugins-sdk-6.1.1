<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<!-- #27624 - NEW SEARCH CRITERIA   -->
	<p:panel id="pPlanDetSearch">
		<table class="ppTwoTable" style="width: 100%; padding-top: 10px;">
			<!-- rendered on procurement plan screen -->
			
			
			<tr>
				<td style="#{pPlanBackingBean.managedBean.pageStyle eq 'create' ? 'width: 20%;':'width: 30%;'}">
				<table class="ppTwoTable">
					<tr>
						<td style="#{pPlanBackingBean.managedBean.pageStyle eq 'create' ? 'width: 45%;': 
									pPlanBackingBean.managedBean.pageStyle eq 'm_approved' ? 'width: 45%;': 'width: auto;'}">
							<p:outputLabel value="#{lbl['lbl.pp.title.desc']}"></p:outputLabel>
						</td>
						<td>
						<!-- 201111@akmal - Enhancement27624 - Start -->
							<p:inputText value="#{pPlanBackingBean.managedBean.planSearchBean.titleOrDesc}" disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"></p:inputText>
						<!-- 201111@akmal - Enhancement27624 - End -->
						</td>	
					</tr>
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.pp.category']}"></p:outputLabel>
						</td>
						<td>
						<!-- 201111@akmal - Enhancement27624 - Start -->
							<p:selectOneMenu id="pDetCategorySearch" label="#{lbl['lbl.pp.category']}" disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"
								styleClass="ppDropDownWidthM"  value="#{pPlanBackingBean.managedBean.planSearchBean.categoryType.parameterCode}">
								<f:selectItem itemLabel="#{lbl['lbl.pp.all']}"
								itemValue="#{null}" />
								<f:selectItems value="#{pPlanBackingBean.retrievePplanTypeCategory()}" 
								var="parameter" itemValue="#{parameter.pmParameter.parameterId}"
								itemLabel="#{parameter.codeName}"/>
								<p:ajax event="change" update="pDetProcMthdSearch" listener="#{pPlanBackingBean.onSelectCategorySearch(pPlanBackingBean.managedBean.planSearchBean.categoryType.parameterCode)}" process="@this" />
						<!-- 201111@akmal - Enhancement27624 - End -->
							</p:selectOneMenu>
						</td>
					</tr>
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.pp.procurement.method']}"></p:outputLabel>
						</td>
						<td>
						<!-- 201111@akmal - Enhancement27624 - Start -->
							<p:selectOneMenu id="pDetProcMthdSearch" label="#{lbl['lbl.pp.procurement.method']}" disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"
								styleClass="ppDropDownWidthM"  value="#{pPlanBackingBean.managedBean.planSearchBean.procurementType.parameterCode}">
								<f:selectItem itemLabel="#{lbl['lbl.pp.all']}"
								itemValue="#{null}" />
								<f:selectItems value="#{pPlanBackingBean.retrievePplanProcurementMethod()}" 
								var="parameter" itemValue="#{parameter.pmParameter.parameterId}"
								itemLabel="#{parameter.codeName}"/>
						<!-- 201111@akmal - Enhancement27624 - End -->
							</p:selectOneMenu>
						</td>
					</tr>
				</table>		
				</td>
				<td style="width:45%;">		
					<table class="ppTwoTable">
					<tr>
					<!-- fields rendered conditionally; pplan or eplan -->
						<td>
							<p:outputLabel value="#{lbl['lbl.pp.invitation.date']}"></p:outputLabel>
						</td>
						<td>
							<table>
								<tr>
									<td style="width:44px; text-align:center;">
										<h:outputText value="#{lbl['lbl.pp.annual.plan.searchCriteria.fromdate']}"/>
									</td>
									<td>
									<!-- 201111@akmal - Enhancement27624 - Start -->
										<p:calendar rendered="true"
										value="#{pPlanBackingBean.managedBean.planSearchBean.invitationDateFrom}" readonlyInput="true"
										showOn="button" navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
										mindate="#{pPlanBackingBean.managedBean.minInvitationYear}"
										maxdate="#{pPlanBackingBean.managedBean.maxInvitationYear}"
										disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"/>
									<!-- 201111@akmal - Enhancement27624 - End -->
									</td>
									<td>
										<h:outputText value="#{lbl['lbl.pp.annual.plan.searchCriteria.todate']}"/>
									</td>
									<td>
									<!-- 201111@akmal - Enhancement27624 - Start -->
										<p:calendar rendered="true"
										value="#{pPlanBackingBean.managedBean.planSearchBean.invitationDateTo}" readonlyInput="true"
										showOn="button" navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
										mindate="#{pPlanBackingBean.managedBean.minInvitationYear}"
										maxdate="#{pPlanBackingBean.managedBean.maxInvitationYear}"
										disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"/>
									<!-- 201111@akmal - Enhancement27624 - End -->
									</td>
								</tr>
							</table>
						</td>
					</tr>
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.pp.annual.plan.last.updated']}"></p:outputLabel>
						</td>
						<td>
							<table>
							<tr>
								<td style="width:44px; text-align:center;">
									<h:outputText value="#{lbl['lbl.pp.annual.plan.searchCriteria.fromdate']}"/>
								</td>
								<td>
								<!-- 201111@akmal - Enhancement27624 - Start -->
									<p:calendar rendered="true"
									value="#{pPlanBackingBean.managedBean.planSearchBean.updatedDateFrom}" readonlyInput="true"
									showOn="button" navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
									mindate="#{pPlanBackingBean.managedBean.minYear}"
									maxdate="#{pPlanBackingBean.managedBean.maxYear}"
									disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"/>
								<!-- 201111@akmal - Enhancement27624 - End -->
								</td>
								<td>
									<h:outputText value="#{lbl['lbl.pp.annual.plan.searchCriteria.todate']}"/>
								</td>
								<td>
								<!-- 201111@akmal - Enhancement27624 - Start -->
									<p:calendar rendered="true"
									value="#{pPlanBackingBean.managedBean.planSearchBean.updatedDateTo}" readonlyInput="true"
									showOn="button" navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
									mindate="#{pPlanBackingBean.managedBean.minYear}"
									maxdate="#{pPlanBackingBean.managedBean.maxYear}"
									disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"/>
								<!-- 201111@akmal - Enhancement27624 - End -->
								</td>
								</tr>
							</table>
						</td>
					</tr>	
					<tr>
						<td></td>
						<td>
							<table>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.pp.status']}"></p:outputLabel>
								</td>
								<td>
								<!-- 201111@akmal - Enhancement27624 - Start -->
									<p:selectOneMenu id="pDetStatusSearch" label="#{lbl['lbl.pp.status']}" disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"
									styleClass="ppDropDownWidthM"  value="#{pPlanBackingBean.managedBean.planSearchBean.planDetstatus}">
									<f:selectItems value="#{pPlanBackingBean.getRecordStatusDropdownValues()}"/>
									</p:selectOneMenu>
								<!-- 201111@akmal - Enhancement27624 - End -->
								</td>
								<td></td>
								<td></td>
							</tr>
							</table>
						</td>
					</tr>	
					</table>	
				</td>
				<td style="width:10%;"></td>
			</tr>
			
		</table>
		<div style="text-align: right;">
		<!-- 201111@akmal - Enhancement27624 - Start -->
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"
				action="#{pPlanBackingBean.searchPlanDetails()}"
				update="@form"
				process="@form" 
				id="searchButtonId">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				disabled="#{pPlanBackingBean.managedBean.disablePlanSearchDet}"
				action="#{pPlanBackingBean.resetPlanDetailSearch()}"
				update="@form"> 
			</p:commandButton>
		<!-- 201111@akmal - Enhancement27624 - End -->
		</div>
		
	</p:panel>			
		

</ui:composition>
