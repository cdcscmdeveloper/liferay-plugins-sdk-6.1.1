<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	
		<h:panelGroup id="ppProcurementCloneid">
	
		<p:panel header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.plan.year']}"/>
					   <p:outputLabel value="*" styleClass="mandatory"/></td>			
				    <td>
				        <h:selectOneMenu label="#{lbl['lbl.pp.plan.year']}"
						 value="#{pPlanBackingBean.managedBean.planSearchBean.year}" style="width: 240px;height: 25px;margin-bottom: 5px;">
						<f:selectItems value="#{pPlanBackingBean.getPlanPreviousYearOptions()}" />
					</h:selectOneMenu>
					   </td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.procurement.title']}"/></td>
					<td><p:inputText value="#{pPlanBackingBean.managedBean.planSearchBean.planTitle}" size="35"
						maxlength="21" style="width: 230px;" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.procurement.desc']}"/></td>
					<td><p:inputText value="#{pPlanBackingBean.managedBean.planSearchBean.planDesc}" size="35"
						maxlength="21" style="width: 230px;" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.category']}" /></td>
					<td><p:selectOneMenu id="somCategoryHeader"  style="width:240px;margin-bottom: 5px;"
					       label="#{lbl['lbl.pp.category']}" 
						   value="#{pPlanBackingBean.managedBean.planSearchBean.categoryType.parameterId}" >
						<f:selectItem itemLabel="#{lbl['lbl.pp.all']}" itemValue="#{null}" />
						<f:selectItems value="#{pPlanBackingBean.getProcurementCategoryOptions()}" var="obj" 
							itemValue="#{obj.procurementCat.parameterId}" 
							itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementCat)}"/>
					  <p:ajax event="change" update="somProcurementMethodHeader" listener="#{pPlanBackingBean.onSelectCategoryClone(pPlanBackingBean.managedBean.planSearchBean.categoryType.parameterId)}"/>				
					</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.procurement.method']}" /></td>
					<td><p:selectOneMenu id="somProcurementMethodHeader" style="width:240px;margin-bottom: 5px;"
       				      label="#{lbl['lbl.pp.procurement.method']}" value="#{pPlanBackingBean.managedBean.planSearchBean.procurementType.parameterId}" >
					    <f:selectItem itemLabel="#{lbl['lbl.pp.all']}" itemValue="#{null}" />
					    <f:selectItems value="#{pPlanBackingBean.getProcurementTypeOptions(pPlanBackingBean.managedBean.planSearchBean.categoryType.parameterId)}" var="obj" 
			     		  itemValue="#{obj.procurementType.parameterId}" 
				    	  itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementType)}"/>
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.status']}" /></td>
					<td><p:selectOneMenu value="#{pPlanBackingBean.managedBean.planSearchBean.status}" style="width: 240px;margin-bottom: 5px;">
							<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
		
			<div class="ppRightBtn">
				<p:commandButton styleClass="BtnSpacing"
				    value="#{lbl['lbl.btn.search']}"
				    action="#{pPlanBackingBean.searchCloneProcurementPlan}"
					update="dtcloneprosearchresults"/>
				<p:commandButton styleClass="BtnSpacing"
				    value="#{lbl['lbl.btn.reset']}"
					action="#{pPlanBackingBean.resetProcurementClone}"
					update="ppProcurementCloneid, dtcloneprosearchresults"/>
					
			</div>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.pp.result.plan']}" toggleable="true">
		
			<p:dataTable tableStyleClass = "fixedTable" id="dtcloneprosearchresults" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{pPlanBackingBean.ppCloneProcurementDataModel}" var="ppItem" selection="#{pPlanBackingBean.managedBean.clonePpProcurementItemLs}" rowKey="#{ppItem.procurementItemId}"
				width="100%" rows="10">
			
			<!-- #25549@24022021 - start -->	
			  <p:ajax event="rowSelectCheckbox" listener="#{pPlanBackingBean.rowSelectProcurement}" update=":form:btnSelect"/>
          	  <p:ajax event="rowUnselectCheckbox" listener="#{pPlanBackingBean.rowSelectProcurement}" update=":form:btnSelect"/>
              <p:ajax event="toggleSelect"  listener="#{pPlanBackingBean.rowSelectProcurement}" update=":form:btnSelect" />		
              <p:ajax event="rowUnselect" listener="#{pPlanBackingBean.rowSelectProcurement}" update=":form:btnSelect"/>
			  <p:ajax event="rowSelect"  listener="#{pPlanBackingBean.rowSelectProcurement}" update=":form:btnSelect"/>
			  <p:ajax event="page" listener="#{pPlanBackingBean.onPageChangeProcurementClone}" update=":form:btnSelect" />
			 <!-- #25549@24022021 - end -->	
			<ac:paginator for="dtcloneprosearchresults"/>
				
			<p:column
			      selectionMode="multiple" styleClass="selectionCheckBox" style="width:3%;text-align:center;"/>	
			 <p:column>
				<f:facet name="header">
				  #{lbl['lbl.pp.procurement.title']}
				</f:facet>
				<p:inputTextarea value="#{ppItem.procurementTitle}"
        			disabled="true" autoResize="false" 
			 		style="width: 95%;" maxlength="200"/>
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.procurement.desc']}
				</f:facet>
				<p:inputTextarea value="#{ppItem.procurementDesc}"
        			disabled="true" autoResize="false" 
			 		style="width: 95%;" maxlength="200"/>

				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.category']}
				</f:facet>
				   <p:selectOneMenu disabled="true" id="somCategory" style="width:99%"
					label="#{lbl['lbl.pp.category']}" value="#{ppItem.procurementCat.parameterId}">
					<f:selectItems value="#{pPlanBackingBean.getProcurementCategoryOptions()}" noSelectionOption="true" var="obj" 
						itemValue="#{obj.procurementCat.parameterId}" itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementCat)}"/>
				</p:selectOneMenu>
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.procurement.method']}
				</f:facet>
				  <p:selectOneMenu disabled="true" id="somProcurementMethod" style="width:99%"
       			    label="#{lbl['lbl.pp.procurement.method']}" value="#{ppItem.procurementType.parameterId}">
					<f:selectItems value="#{pPlanBackingBean.getProcurementTypeOptions(ppItem.procurementCat.parameterId)}"
						var="obj" itemValue="#{obj.procurementType.parameterId}" 
						itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementType)}"
						noSelectionOption="true"/>
					<p:ajax event="change" listener="#{pPlanBackingBean.onSelectCategoryType(ppItem.procurementType.parameterId, index)}" process="@this" />
				</p:selectOneMenu>
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.estimated.amount']}
				</f:facet>
				<!-- 24975@05112020-Start -->
				 <h:outputText id="gtEstAmt" value="#{ppItem.estimatedAmt}" styleClass="gtEstAmt">
				    <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				 </h:outputText> 
				<!-- 24975@05112020-End -->
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.status']}
				</f:facet>
				  <p:selectOneMenu  disabled="true"  value="#{ppItem.recordStatusFlg}" style="width:99%;vertical-align:middle;"> 
	            	<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}"/>
	          	</p:selectOneMenu> 
				</p:column>
			</p:dataTable>
			
			<div class="ppRightBtn">
		    <p:commandButton 
		       value="#{lbl['lbl.pp.select']}"
		       id="btnSelect"
		       action="#{pPlanBackingBean.addPpItemClone()}"
		       update="dtProcurementPlan, ppProcurementCloneid, dtcloneprosearchresults"
		 	   disabled="#{pPlanBackingBean.managedBean.disableSelectBtn}"
		 	   oncomplete="cloneAcquirementPopUp.hide();"/>
			<p:commandButton 
			   value="#{lbl['lbl.pp.cancel']}" 
			   action="#{pPlanBackingBean.resetProcurementClone}"
			   update="@form"
			   onclick="cloneAcquirementPopUp.close()"/> 	
		</div>
		
		</p:panel>
		
		</h:panelGroup>
</ui:composition>
