<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">
		
	<script type="text/javascript">
		/*
			This is to update grand total at footer without reloading the whole datatable
			gtEstAmt - the class name of grand total field
			hiddenGtEstAmt - the class name of calculated value in hidden field
		*/
		function updatePpFooter(){
			document.getElementsByClassName('gtEstAmt')[0].innerHTML = document.getElementsByClassName('hiddenGtEstAmt')[0].value;
			
		}
			
 	</script>
	<p:outputPanel id="opPlanPp">
		<p:inputText style="display:none" id="hiddenGtEstAmt" styleClass="hiddenGtEstAmt" value="#{pPlanBackingBean.managedBean.ppTotalEst}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		
		<!-- 200911@akmal - Enhancement27624 - Start -->
		 <ui:include src="planDetSearch.xhtml"/>
		<!-- 200911@akmal - Enhancement27624 - End -->

		<!-- 200911@akmal - Enhancement27624 - Start -->
	   	<p:dataTable id="dtProcurementPlan" styleClass="dtProcurementPlan" emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
	   		 var="ppItem" value="#{pPlanBackingBean.managedBean.selectedPlan.ppProcurementItems}" rendered="#{ppItem.recordStatusFlg != 2}"
		     rowIndexVar="index" rowKey="#{ppItem}" rows="10">
	     <!-- 200911@akmal - Enhancement27624 - End -->
			<ac:paginator for="dtProcurementPlan" />
			<p:columnGroup type="header">
				<p:row>
					<!-- #24975 -->
				 	<!-- <p:column style="width:2%" /> -->
				 	<p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.action']}" />
					     	<ac:iconTooltip value="#{lbl['lbl.pp.action.tooltip']}" />
					    </f:facet>
				    </p:column>
			 	 	<p:column width="12%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.procurement.title']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="12%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.procurement.desc']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="12%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.category']}" />
					    </f:facet>
				    </p:column>
			     	<p:column width="12%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.procurement.method']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="8%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.invitation.date']}" />
					     	&#160; <p:graphicImage id="giOthersOrg"
								value="/css/images/design/tooltips.png" /> 
					<p:tooltip id="ttOthersOrg" for="giOthersOrg">
							<h:outputText escape="false" value="#{lbl['lbl.pp.invitation.date.tooltip']}"  />
					</p:tooltip>&#160;
					    </f:facet>
				    </p:column>
			     	<p:column width="13%">
					    <f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.estimated.amount']}" />
					    </f:facet>
				    </p:column>			      
			     	<p:column  width="5%" rendered="#{pPlanBackingBean.managedBean.modeReview}">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.reject.and.reason']}" />
					    </f:facet>
				    </p:column>
				     <!-- #24975 -->
				    <p:column width="5%" 
				    		rendered="#{pPlanBackingBean.managedBean.modeEditable and 
				    		(pPlanBackingBean.managedBean.selectedPlan.updatable or 
				    		pPlanBackingBean.managedBean.approvedPlan)}">
				    	<f:facet name="header">
				    		<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pp.reason.for.update']}" />
					    </f:facet>
				    </p:column>			      	
				    <p:column width="5%">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.status']}" />
					    </f:facet>
				    </p:column>
				    <p:column width="5%" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}">
					    <f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pp.last.updated']}" />
					    </f:facet>
				    </p:column>
			 	</p:row>
		 	</p:columnGroup>
		 	
			  <p:column>
				<!-- [SIR#12802] - start -->	
				  <!--25549@18092020 -->
				<!--24975@azza - start -->
				<p:selectBooleanCheckbox 
				    id="checkbox"
					disabled="#{ppItem.viewMode or !(ppItem.brandNew ? ppItem.brandNew : ppItem.selectable)}" 
					value="#{ppItem.deleted}" title="#{lbl['lbl.pp.make.amendment']}" />
				<!-- [SIR#12802] - end -->
				<!-- #24975 -->
				<p:commandLink id="addUpdateInfo" 
						immediate="true" 
						update="dtProcurementPlan" 
						partialSubmit="true"
						rendered="#{!(ppItem.brandNew ? ppItem.brandNew : ppItem.selectable) or ppItem.allowAnotherPindaan}"
						disabled="#{ppItem.viewMode or ppItem.cloneEnabled or ppItem.disableForPindaan or (!ppItem.enableRevise) or (ppItem.disableRow)}">
				     <h:graphicImage value="/css/images/design/ico-viewnedit.png"  
				     style="float:left; padding-left: 5px;" process="@this">
				      <p:ajax event="click"
				      		listener="#{pPlanBackingBean.addUpdateInfo(pPlanBackingBean.managedBean.selectedPlan, index)}"
						    disabled="#{ppItem.viewMode or ppItem.cloneEnabled or ppItem.disableForPindaan or (!ppItem.enableRevise) or (ppItem.disableRow)}"
     			      		update="@form" />
				      </h:graphicImage>
				</p:commandLink>
			</p:column>
		    <!--24975@azza - end -->
		    <!--24975@azza - start -->
	        <p:column>	
	          <!--25549@18092020 -->
        		<p:inputTextarea id="itaPpTitle" value="#{ppItem.procurementTitle}" 
        			disabled="#{ppItem.viewMode or !(pPlanBackingBean.managedBean.modeEditable and ppItem.editable) or (ppItem.disableRow)}"
					label="#{lbl['lbl.pp.procurement.title']}" autoResize="false" 
			 		style="width: 95%;" maxlength="200" required="#{!empty param['disableValidation']}">
			 		<f:validateLength maximum="200" /> <!-- #35502, Fix as-is bug: #38964 -->
			 		<p:ajax event="change" process="@this" />
		 		</p:inputTextarea>
		 		<p:message id="itPpTitleMsg" for="itaPpTitle" display="icon" />  
	        </p:column>

	         <p:column>	
	           <!--25549@18092020 -->	
        		<p:inputTextarea id="itaPpDesc" value="#{ppItem.procurementDesc}" 
        			disabled="#{ppItem.viewMode or !(pPlanBackingBean.managedBean.modeEditable and ppItem.editable) or (ppItem.disableRow)}"
					label="#{lbl['lbl.pp.procurement.desc']}" autoResize="false" 
			 		style="width: 95%;" maxlength="1000" required="#{!empty param['disableValidation']}">
			 		<f:validateLength maximum="1000" /> <!-- #35502, Fix as-is bug: #38964 -->
			 		<p:ajax event="change" process="@this" />
		 		</p:inputTextarea>
		 		<p:message id="itaPpDescMsg" for="itaPpDesc" display="icon" />  
	        </p:column>
	        <!--24975@azza - end -->
	        <p:column>
	        <!--25549@18092020 -->	
	        	<!--24975@09022021 - start -->
       			<p:selectOneMenu id="somCategory" style="width:99%"
       				disabled="#{ppItem.viewMode or !(pPlanBackingBean.managedBean.modeEditable and ppItem.editable) or (ppItem.disableRow)}"
					label="#{lbl['lbl.pp.category']}" value="#{ppItem.procurementCat.parameterId}" required="#{!empty param['disableValidation']}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems value="#{pPlanBackingBean.getProcurementCategoryOptions()}" var="obj" 
						itemValue="#{obj.procurementCat.parameterId}" itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementCat)}"/>
					<p:ajax event="change" update="somProcurementMethod" listener="#{pPlanBackingBean.onSelectCategory(ppItem.procurementCat.parameterId, index)}" 						
					    immediate="true" partialSubmit="true" />
				</p:selectOneMenu>
				<p:message id="somCategoryMsg" for="somCategory" display="icon" />
	        </p:column>
	        
	        <p:column>
	            <!-- #34156 - Start -->
	            <!--Bug #306439@30032021 - start -->
       			<p:selectOneMenu id="somProcurementMethod" style="width:99%"
       				disabled="#{ppItem.viewMode or !(pPlanBackingBean.managedBean.modeEditable and ppItem.editable) or ppItem.procurementCat.parameterId==null or (ppItem.disableRow)}"
					label="#{lbl['lbl.pp.procurement.method']}" value="#{ppItem.procurementType.parameterId}" required="#{!empty param['disableValidation']}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems value="#{pPlanBackingBean.getProcurementTypeOptionsNewLabel(ppItem.procurementCat.parameterId, ppItem.newLabcatMethodType)}"
						var="obj" itemValue="#{obj.procurementType.parameterId}" itemLabel="#{pPlanBackingBean.getProcurementCategoryLabels(obj.procurementType)}"/>
					<p:ajax event="change" listener="#{pPlanBackingBean.onSelectCategoryTypeNewLabel(ppItem.procurementType.parameterId, index, ppItem.newLabcatMethodType)}"
					    immediate="true" partialSubmit="true" />
				</p:selectOneMenu>
			 <p:message id="somProcurementMethodMsg" for="somProcurementMethod" display="icon" />
	        </p:column>
	         <!--Bug #306439@30032021 - end -->
	         <!-- #34156 - End --> 
	        <p:column  style="white-space:nowrap;">
	             <!--25549@18092020 -->
	            <!--24975@azza - start -->
       			<p:calendar styleClass="ppDisplayCalXS" id="effDateId" value="#{ppItem.invitationDate}" 
	  				disabled="#{ppItem.viewMode or !(pPlanBackingBean.managedBean.modeEditable and ppItem.editable) or (ppItem.disableRow)}"
	  				mindate="#{pPlanBackingBean.minDate}" 
	  				maxdate="#{pPlanBackingBean.maxDate}"
			  		required="#{!empty param['disableValidation']}" navigator="true" 
			  		label="#{lbl['lbl.pp.invitation.date']}" readonlyInput="true" 
			  		yearRange="c+0:c+0"
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
				<p:message id="effDateIdMsg" for="effDateId" display="icon" />
	        </p:column>
	        
	        <p:column>
	        <!--25549@18092020 -->	
       			<p:inputText style="width:90%" value="#{ppItem.estimatedAmt}"
       				disabled="#{ppItem.viewMode or !(pPlanBackingBean.managedBean.modeEditable and ppItem.editable) or (ppItem.disableRow)}" 
		  			id="itEstAmt" styleClass="amountRight" label="#{lbl['lbl.pp.estimated.amount']}"
		  			required="#{!empty param['disableValidation']}"
		  			onkeypress="if (event.keyCode == 13) { return false; }">
		  			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		  			<f:attribute name="max" value="99999999999"/>		
					<f:validator validatorId="quantityDoubleRangeValidator" />
		  			<p:ajax event="change" listener="#{pPlanBackingBean.calculatePpGrandTotal}"
						update=":form:hiddenGtEstAmt, itEstAmt,itEstAmtMsg" 
		  				oncomplete="updatePpFooter();"/>
		  		</p:inputText>
		  		<p:message id="itEstAmtMsg" for="itEstAmt" display="icon" />
	        </p:column>
	        <!--24975@azza - end -->
	        <!--24975@azza - start -->
	       <p:column style="white-space:nowrap;" rendered="#{pPlanBackingBean.managedBean.modeReview}">
			    <p:selectBooleanCheckbox id="chkRejected" value="#{ppItem.rejected}"  style="float:left;margin-bottom:3px;margin-left:10px;" disabled="#{!ppItem.enableRevise or !pPlanBackingBean.managedBean.modeReviewEditable or (ppItem.disableRow)}">
			    	<p:ajax event="change" update="clPpReason"/>
			    </p:selectBooleanCheckbox>
			     <!--25549@18092020 -->				    
			    <p:commandLink oncomplete="dlRejectReasonWv.show();" action="#{pPlanBackingBean.retrievePpRejectReasons(ppItem)}"
			    	disabled="#{!ppItem.rejected or (ppItem.disableRow)}" id="clPpReason" update=":form:dlRejectReason" immediate="true">
					<p:graphicImage value="#{!pPlanBackingBean.managedBean.modeReviewEditable ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"/>
				</p:commandLink>
	        </p:column>
			<!-- #24975 -->
			<!-- #25549 - start --> 
		    <!--24975@20112020azza - start -->
		    <!-- #35502, Fix as-is bug: #38696 Start -->
			<p:column style="white-space:nowrap;text-align:center;" rendered="#{pPlanBackingBean.managedBean.modeEditable and (pPlanBackingBean.managedBean.selectedPlan.updatable or pPlanBackingBean.managedBean.approvedPlan)}">		
			    <p:commandLink oncomplete="dlUpdateReasonWv.show();" action="#{pPlanBackingBean.retrievePpUpdateReasons(ppItem)}"
			    	update="@form" immediate="true" id="UpdateReason" process="@this" partialSubmit="true"
			    	disabled="#{ppItem.viewMode or (ppItem.brandNew ? ppItem.brandNew : ppItem.selectable) or (ppItem.disableRow)}">
					<p:graphicImage value="#{ppItem.changePencilToNote ? '/css/images/design/ico-view.png' : '/css/images/design/edit.png'}"
					disabled="#{ppItem.viewMode or (pPlanBackingBean.managedBean.modeEditable) or (pPlanBackingBean.managedBean.modeEditable) or !ppItem.reasonForUpdateEnabled}" update="@form" />
				</p:commandLink>
					<p:graphicImage
				    rendered="#{ppItem.indicator}"
				    value="#{ppItem.indicator ? '/css/images/design/exclamation.png' : ''}" update="@form" />
	        </p:column>
	        <!-- #35502, Fix as-is bug: #38696 End -->
	        <!--24975@20112020azza - end -->
	        <!-- #25549 - end --> 
	        <p:column>
	        	<p:selectOneMenu id="recordStatus" value="#{ppItem.recordStatusFlg}" style="width:99%"
	        		disabled="#{ppItem.viewMode or (ppItem.cloneEnabled or ppItem.statusEnabled or !pPlanBackingBean.managedBean.modeEditable)}">  
	            	<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
	                <!--25549@18092020 -->
	  	            <p:ajax event="change"  update="UpdateReason, clPpReason, itEstAmt, effDateId, somProcurementMethod, somCategory, addUpdateInfo, itaPpTitle, itaPpDesc, chkRejected"
	  	            listener="#{pPlanBackingBean.selectedPpStatus(ppItem.recordStatusFlg, index)}" partialSubmit="true" />           	
	          	</p:selectOneMenu> 
	        </p:column>
	        <!--24975@azza - end -->
	        <p:column  rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}">
	        	<h:outputText value="#{ppItem.changedDate}" >
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
	        </p:column>

	        <p:columnGroup type="footer">
				<p:row>
					<p:column colspan="6">
					 	<f:facet name="footer">
					     	<p:outputLabel value="#{lbl['lbl.pp.grand.total']}" />
					    </f:facet>
					</p:column>
					<p:column>
					   	<f:facet name="footer">
					     	<h:outputText id="gtEstAmt" value="#{pPlanBackingBean.managedBean.ppTotalEst}" styleClass="gtEstAmt">
					     		<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					     	</h:outputText>
					    </f:facet>
					</p:column>
					<p:column rendered="#{pPlanBackingBean.managedBean.modeReview}" footerText="&#160;"/>
					<p:column footerText="&#160;"/>
					<p:column footerText="&#160;" rendered="#{!pPlanBackingBean.managedBean.selectedPlan.brandNew}" />
				</p:row>
			</p:columnGroup>
		</p:dataTable>
		<div class="ppRightBtn">
		<!-- #25549@20200818 - start --> 
		<!-- 02022021@#27624 - start --> 
		     <p:commandButton id="btnClone" value="#{lbl['lbl.btn.clone']}"
		        disabled="#{!pPlanBackingBean.managedBean.modeEditable or (pPlanBackingBean.managedBean.isAudit())}" 
			    action="#{pPlanBackingBean.rowSelectProcurement()}"
			    update="dtProcurementPlan, ppProcurementCloneid, dtcloneprosearchresults"
			    onclick="cloneAcquirementPopUp.show()"
			    rendered="#{pPlanBackingBean.isRolePlanner()}"/>
			    <p:tooltip id="toolTipGrow" for="btnClone" value="#{lbl['lbl.pp.clone.year.tooltip']}"
                    position="bottom"/>
		<!-- end --> 
		
			<p:commandButton value="#{lbl['lbl.btn.add']}" immediate="true" update="dtProcurementPlan" 
		 		disabled="#{!pPlanBackingBean.managedBean.modeEditable or (pPlanBackingBean.managedBean.isAudit())}"  partialSubmit="true"
		 		process="@this" action="#{pPlanBackingBean.addPpItemDet()}"/> 
		 		
			<p:commandButton id="cbEpItemDelete" value="#{lbl['lbl.btn.delete']}" update="dtProcurementPlan" 
				disabled="#{!pPlanBackingBean.managedBean.modeEditable or (pPlanBackingBean.managedBean.isAudit())}" action="#{pPlanBackingBean.deletePpItemDet()}"	/> 
				<!-- 02022021@#27624 - end --> 
		</div>
		
		<!-- #25549@24022021 - start -->
		<p:remoteCommand name="resetAllData" update="ppProcurementCloneid, dtcloneprosearchresults, dtProcurementPlan" partialSubmit="true" action="#{pPlanBackingBean.resetProcurementClone()}" process="@this" />
		<p:dialog id="cloneAcquirementPopUp" widgetVar="cloneAcquirementPopUp" closable="true" modal="true" onHide="resetAllData();"
			header="#{lbl['lbl.pp.procurement.plan.clone']}" width="800" height="500">
			<ui:include src="planProcurementPopup.xhtml"></ui:include>
		</p:dialog>
		<!-- #25549@24022021 - start -->
		
	</p:outputPanel>
</ui:composition>
