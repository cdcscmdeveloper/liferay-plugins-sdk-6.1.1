<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc">

    <h:panelGroup id="ppExpenditureBCloneid">
		<p:panel  header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
	    	<p:messages id="messageId" showDetail="true" autoUpdate="true" closable="true" showSummary="false"></p:messages>		
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.plan.year']}"/>
					    <p:outputLabel value="*" styleClass="mandatory"/></td>
					<td><h:selectOneMenu id="yearB" label="#{lbl['lbl.pp.plan.year']}"
						 value="#{pPlanBackingBean.managedBean.planSearchBean.yearB}" style="width: 240px;height: 25px;margin-bottom: 5px;">
						<f:selectItems value="#{pPlanBackingBean.getPlanPreviousYearOptions()}" />
					</h:selectOneMenu></td>
				</tr>
			    <tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.gl.accountCode']}" /></td>
					<td><p:inputText id="codeB" value="#{pPlanBackingBean.managedBean.planSearchBean.planExCode}" size="35" style="width: 230px;" />
					</td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.type.of.expenses']}" /></td>
					<td><p:inputText id="descB" value="#{pPlanBackingBean.managedBean.planSearchBean.planExDesc}" size="35" style="width: 230px;" />
					</td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.status']}" /></td>
					<td><p:selectOneMenu id="statusB" value="#{pPlanBackingBean.managedBean.planSearchBean.statusB}" 
					        style="width: 240px;margin-bottom: 5px;">
							<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			
			<div class="ppRightBtn">
			    <p:commandButton styleClass="BtnSpacing"
			        id="btnSearchB"
				    value="#{lbl['lbl.btn.search']}"	
				    action="#{pPlanBackingBean.searchCloneExpenditureBPlan}"
					update="dtclonepitemsBsearchresults"/>
				<p:commandButton styleClass="BtnSpacing"
				    id="btnResetB"
				    value="#{lbl['lbl.btn.reset']}"
					action="#{pPlanBackingBean.resetExpenditureClone}"
					update="ppExpenditureBCloneid, dtclonepitemsBsearchresults"/>
			</div>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.pp.result.plan']}" toggleable="true">
		<!-- #25549@24022021 - start -->
		<p:dataTable tableStyleClass = "fixedTable" id="dtclonepitemsBsearchresults" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		    value="#{pPlanBackingBean.ppEpItemsDataModel}"  var="epItem" selection="#{pPlanBackingBean.managedBean.clonePpExpenditureItemLs}" rowKey="#{epItem.expenditureItemId}"
				     width="50%" rows="10" >
		    
		      <p:ajax event="rowSelectCheckbox" listener="#{pPlanBackingBean.rowSelectExpenditure}" update=":form:btnSelectExB"/>
          	  <p:ajax event="rowUnselectCheckbox" listener="#{pPlanBackingBean.rowSelectExpenditure}"  update=":form:btnSelectExB"/>
              <p:ajax event="toggleSelect"  listener="#{pPlanBackingBean.rowSelectExpenditure}" update=":form:btnSelectExB" />		   
	          <p:ajax event="rowUnselect" listener="#{pPlanBackingBean.rowSelectExpenditure}" update=":form:btnSelectExB"/>
			  <p:ajax event="rowSelect"  listener="#{pPlanBackingBean.rowSelectExpenditure}" update=":form:btnSelectExB"/>
			  <p:ajax event="page" listener="#{pPlanBackingBean.onPageChangeExpenditureClone}" update=":form:btnSelectExB" />
			  <!-- #25549@24022021 - end -->
			  
				<ac:paginator for="dtclonepitemssearchresults" />
				
				<p:column 
		           selectionMode="multiple" styleClass="selectionCheckBox" style="width:3%;text-align:center;"/>	
				<p:column>		
					<f:facet name="header">
					#{lbl['lbl.pp.object']}
				</f:facet>
					#{epItem.pmGlAccount.glAccCode}
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.type.of.expenses']}
				</f:facet>
				    #{epItem.pmGlAccount.description}
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.status']}
				</f:facet>
				    #{pPlanBackingBean.managedBean.status}
				</p:column>
			</p:dataTable>
			

			
			<div class="ppRightBtn">
		    <p:commandButton 
		       id="btnSelectExB"
		       value="#{lbl['lbl.pp.select']}"
		       action="#{pPlanBackingBean.addPpExenditureItemClone()}"
		       update="dtExpenditurePlanB, ppExpenditureBCloneid, dtclonepitemsBsearchresults"
		       disabled="#{pPlanBackingBean.managedBean.disableSelectExpBtn}"
		       oncomplete="cloneExpenditureBPopUp.hide();"/>	
			<p:commandButton 
			   id="btnCancelB"
			   value="#{lbl['lbl.pp.cancel']}" 
			   action="#{pPlanBackingBean.resetExpenditureClone}"
			   update="ppExpenditureBCloneid, dtclonepitemsBsearchresults"
			   oncomplete="cloneExpenditureBPopUp.hide();"/> 	
		</div>
		</p:panel>
		
		</h:panelGroup>
</ui:composition>
