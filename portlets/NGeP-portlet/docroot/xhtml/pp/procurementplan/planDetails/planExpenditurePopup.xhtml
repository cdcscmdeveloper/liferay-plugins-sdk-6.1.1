<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<h:panelGroup id="ppExpenditureBCloneid">
	
		<p:panel header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.plan.year']}"/>
					    <p:outputLabel value="*" styleClass="mandatory"/></td>
					<td> <h:selectOneMenu label="#{lbl['lbl.pp.plan.year']}"
						 value="#{pPlanBackingBean.managedBean.planSearchBean.year}" style="width: 240px;height: 25px;margin-bottom: 5px;">
						<f:selectItems value="#{pPlanBackingBean.getPlanPreviousYearOptions()}" />
					</h:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.gl.accountCode']}" /></td>
					<td><p:inputText value="#{pPlanBackingBean.managedBean.planSearchBean.code}" size="35" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.type.of.expenses']}" /></td>
					<td><p:inputText value="#{pPlanBackingBean.managedBean.planSearchBean.desc}" size="35" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pp.status']}" /></td>
					<td><p:selectOneMenu value="#{pPlanBackingBean.managedBean.planSearchBean.status}" 
					        style="width: 240px;margin-bottom: 5px;">
							<f:selectItems value="#{pPlanBackingBean.getStatusOptions()}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			
			<div class="ppRightBtn">
			    <p:commandButton styleClass="BtnSpacing"
				    value="#{lbl['lbl.btn.search']}"	
				    action="#{pPlanBackingBean.searchCloneExpenditureBPlan}"
					update="dtclonepitemssearchresults"/>
				<p:commandButton styleClass="BtnSpacing"
				    value="#{lbl['lbl.btn.reset']}"
					action="#{pPlanBackingBean.resetExpenditureClone}"
					update="ppExpenditureBCloneid, dtclonepitemssearchresults"/>
			</div>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.pp.result.plan']}" toggleable="true">
		<p:dataTable tableStyleClass = "fixedTable" id="dtclonepitemssearchresults" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		    value="#{pPlanBackingBean.ppEpItemsDataModel}"  var="epItem" selection="#{pPlanBackingBean.managedBean.clonePpExpenditureItemLs}" rowKey="#{epItem.expenditureItemId}"
				     width="50%" rows="10">
		    
		      <p:ajax event="rowSelectCheckbox" listener="#{pPlanBackingBean.rowSelect}" update=":form:btnSelectExB"/>
          	  <p:ajax event="rowUnselectCheckbox" listener="#{pPlanBackingBean.rowSelect}" update=":form:btnSelectExB"/>
              <p:ajax event="toggleSelect"  listener="#{pPlanBackingBean.rowSelect}" update=":form:btnSelectExB" />		   
	
				<ac:paginator for="dtclonepitemssearchresults" />
				
				<p:column
		           selectionMode="multiple" styleClass="selectionCheckBox" style="width:3%;text-align:center;"/>	
				<p:column>		
					<f:facet name="header">
					#{lbl['lbl.pp.object']}
				</f:facet>
					#{epItem.pmGlAccount.glAccCode}
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.type.of.expenses']}
				</f:facet>
				    #{epItem.pmGlAccount.description}
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.pp.status']}
				</f:facet>
				    #{pPlanBackingBean.managedBean.status}
				</p:column>
			</p:dataTable>
			
			<div class="ppRightBtn">
		    <p:commandButton 
		       id="btnSelectExB"
		       value="#{lbl['lbl.pp.select']}"
		       action="#{pPlanBackingBean.addPpExenditureItemClone()}"
		       update="dtExpenditurePlanB, ppExpenditureBCloneid, dtclonepitemssearchresults"
		 	   oncomplete="cloneExpenditureBPopUp.hide();"/>	
			<p:commandButton 
			   value="#{lbl['lbl.pp.cancel']}" 
			   action="#{pPlanBackingBean.resetExpenditureClone}"
			   update="@form"
			   oncomplete="cloneExpenditureBPopUp.hide();"/> 	
		</div>
		
		</p:panel>
		
	</h:panelGroup>
</ui:composition>
