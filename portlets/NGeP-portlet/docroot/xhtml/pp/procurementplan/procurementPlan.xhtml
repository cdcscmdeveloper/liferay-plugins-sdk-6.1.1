<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:tp="http://java.sun.com/jsf/composite/ppComponents/procurementPlan"
>
	
		
    <ui:define name="contentSection">
    	<script type="text/javascript">
   		    /**
   			 * Disable/enable MTO without refreshing the whole tabs
   			 */
   			function updateMtoTab(){
   			 	var enableTab= $("input[name$='enableMtoFlag']").val();
   				if(enableTab=='true'){
	 				tvPlanVar.enable(1);
	 			}else{
	 				tvPlanVar.disable(1);
	 			}
   				updateDetailTab();
   		    }
   		    
   			/**
   			 * Disable/enable details tab without refreshing the whole tabs
   			 */
   			function updateDetailTab(){
   			 	var enableTab= $("input[name$='enableDetailFlag']").val();
   				if(enableTab=='true'){
   					tvPlanContentVar.enable(1);
	 			}else{
	 				tvPlanContentVar.disable(1);
	 			}
   		    }
		</script>
	
		<!-- Top Button -->
		<ui:include src="headerSection.xhtml"/>
	
		<p:tabView widgetVar="tvPlanVar" id="tvPlan" dynamic="true" cache="true" orientation="left">
			<p:ajax event="tabChange" listener="#{planBackingBean.updateCurrentView}" update="tvPlan"/>  
		    <p:tab id="#{PPConst.currentNew}" title="#{planBackingBean.generateHeader(planBackingBean.managedBean.viewMode)}">
    		  	<tp:planContentComponent 
		            selectedPlan="#{planBackingBean.managedBean.plan}" 
		            selectedPlanMaster="#{planBackingBean.managedBean.planMaster}" 
		            viewMode="#{planBackingBean.managedBean.viewMode}"/>
		    </p:tab>
		    <p:tab id="#{PPConst.currentMto}" title="#{lbl['lbl.pp.plan.title.mto.plan']}" disabled="#{!planBackingBean.managedBean.enableMto}">
		      	<tp:planContentComponent 
		            selectedPlan="#{planBackingBean.managedBean.mtoPlan}" 
		            selectedPlanMaster="#{planBackingBean.managedBean.mtoPlanMaster}" 
 					viewMode="#{planBackingBean.managedBean.viewMode}"/>
		    </p:tab>
		    <p:tab id="#{PPConst.currentAllocBudget}" title="#{lbl['lbl.pp.budget.title.allocated.gosodo']}">  
		    	<br/>
		    	<p:panel header="#{lbl['lbl.pp.budget.title.allocated.gosodo']}">
		    		<ui:include src="../budgetallocation/listAllocatedBudget.xhtml"/>
		    	</p:panel>
		    </p:tab>
		    <p:tab id="#{PPConst.currentPlan}" title="#{lbl['lbl.pp.plan.title.list']}"> 
		    	<br/>
		    	<p:panel header="#{planBackingBean.generateHeader(PPConst.modeList)}"> 
		    		<ui:include src="listPlanContent.xhtml"/>
		    	</p:panel>
		    </p:tab>
		    <p:tab id="#{PPConst.currentAudit}" title="#{lbl['lbl.pp.title.audit.trail']}">  
		    	Coming Soon
		    </p:tab>
		     
	    </p:tabView>

	</ui:define>
</ui:composition>
