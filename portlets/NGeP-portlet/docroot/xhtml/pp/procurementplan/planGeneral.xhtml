<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	 
	 <script type="text/javascript">
			/**
			 * Disable/enable details tab without refreshing the whole tabs
			 */
			function updateDetailTab(){
				
			 	var enableTab= $("input[name$='enableTabFlag']").val();
	
			 	for (var i=1;i &lt; 4;i++)
			 	{
			 		if(enableTab==i){
			 			tvPlanContentVar.enable(i);
			 		}else{
			 			tvPlanContentVar.disable(i);
			 		}
			 	}
		    }
	   		
		</script>

	<p:outputPanel id="opTabPlanGeneral">

		<h:inputHidden id="enableTabFlag" value="#{planBackingBean.managedBean.selectedTab}" />
		<table class="ppTwoTable">
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.plan.type']}"/></th>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlan.planTypeParam.parameterId}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew}" styleClass="ppDropDownWidthM">
						<f:selectItems value="#{planBackingBean.planTypeOptions()}"/>
						<p:ajax event="change" update="opTabPlanGeneral, opTabQt" 
							listener="#{planBackingBean.selectedPlanTypeParam(planBackingBean.managedBean.selectedPlan.planTypeParam.parameterId)}" 
							oncomplete="return updateDetailTab()"/> 
					</p:selectOneMenu>
				</td>
				<th><p:outputLabel value="* #{lbl['lbl.pp.plan.approver']}"/></th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{planBackingBean.managedBean.approver}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable}" >
						<f:selectItem itemLabel="#{lbl['lbl.select']}" />
						<f:selectItems value="#{planBackingBean.generateApprovers()}" var="user"
							itemLabel="#{user.loginId}" itemValue="#{user.userId}"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.procurement.mode']}"/></th>
				<td>
					<p:selectOneMenu id="somProcureMode" value="#{planBackingBean.managedBean.selectedPlan.procurementModeParam.parameterId}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew}" styleClass="ppDropDownWidthM">
						<f:selectItems value="#{planBackingBean.procurementModeOptions(planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode)}"/>
						<p:ajax event="change" listener="#{planBackingBean.selectedProcurementModeParam(planBackingBean.managedBean.selectedPlan.procurementModeParam.parameterId)}" 
							update="enableTabFlag, clItem, opTabDirectPurchase, opTabContract, :form:tvPlanContent:lovClass:lovClass,
									:form:tvPlanContent:lovFamily:lovFamily, :form:tvPlanContent:lovSegment:lovSegment" 
							oncomplete="return updateDetailTab()"/> 
					</p:selectOneMenu>
				</td>
				<th><p:outputLabel value="* #{lbl['lbl.pp.require.verification']}"/></th>
				<td>
					<p:selectOneRadio  id="sorPvo" required="false" 
						value="#{planBackingBean.managedBean.selectedPlan.verifyReq}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" update="sorPvoLevel, plPvo"/>
					</p:selectOneRadio> 
		        </td>
	        </tr>				
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.vot.amanah.type']}"/></th>
				<td>	
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlan.votTypeParam.parameterId}" styleClass="ppDropDownWidthM"
						disabled="#{!planBackingBean.managedBean.selectedPlan.brandNew}">
						<f:selectItems value="#{planBackingBean.votTypeOptions()}"/>
						<p:ajax event="change" listener="#{planBackingBean.selectedVotTypeParam(planBackingBean.managedBean.selectedPlan.votTypeParam.parameterId)}" />
					</p:selectOneMenu>
					<br/>
				</td>
				<th><p:outputLabel value="#{planBackingBean.managedBean.selectedPlan.verifyReq ? '*' : ''} #{lbl['lbl.pp.verification.level']}"/></th>
				<td>
					<p:selectOneRadio id="sorPvoLevel" required="false" value="#{planBackingBean.managedBean.selectedPlan.multiLevel}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable || !planBackingBean.managedBean.selectedPlan.verifyReq}">
						<f:selectItem itemLabel="Single" itemValue="false" />
						<f:selectItem itemLabel="Multiple" itemValue="true" />
					</p:selectOneRadio> 
				</td>
			</tr>
			<tr>
				<th class="verticalAlignNone"><p:outputLabel value="* #{lbl['lbl.pp.product.segment']}"/></th>
				<td>
					<ac:lov id="lovSegment" lovId="CM_UNSPSC" size="26" update=":form:tvPlanContent:lovFamily:lovFamily"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable 
							|| planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode==null
							|| planBackingBean.managedBean.selectedPlan.procurementModeParam.parameterCode==PPConst.procurementExistingContract}"
						headerText="#{lbl['lbl.pp.product.segment']}" 
						saveObject="planBackingBean.managedBean.selectedPlan.cmUnspscSegment"
						value="#{planBackingBean.managedBean.selectedPlan.cmUnspscSegment.unspscTitle}"
						conditionField="recordStatus^1|unspscLevel^0">
					</ac:lov>
				</td>
				<td rowspan="10" colspan="2">
					<p:pickList id="plPvo" value="#{planBackingBean.managedBean.verifiers}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable || !planBackingBean.managedBean.selectedPlan.verifyReq}"
						var="user" itemLabel="#{user}" itemValue="#{user}">
						<f:facet name="sourceCaption">Available</f:facet>  
	        			<f:facet name="targetCaption">Selected</f:facet> 
						<p:column>
							<h:outputText value="#{user}" />
						</p:column>
					</p:pickList>
				</td>
			</tr>
			<tr>
				<th class="verticalAlignNone"><p:outputLabel value="* #{lbl['lbl.pp.product.family']}"/></th>
				<td>
					<ac:lov id="lovFamily" lovId="CM_UNSPSC" size="26"
						headerText="#{lbl['lbl.pp.product.family']}"  update=":form:tvPlanContent:lovSegment:lovSegment,:form:tvPlanContent:lovClass:lovClass"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable
							|| planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode==null
							|| planBackingBean.managedBean.selectedPlan.procurementModeParam.parameterCode==PPConst.procurementExistingContract}"
						saveObject="planBackingBean.managedBean.selectedPlan.cmUnspscFamily"
						value="#{planBackingBean.managedBean.selectedPlan.cmUnspscFamily.unspscTitle}"
						conditionField="recordStatus^1|unspscLevel^1|unspscParentCode^#{planBackingBean.managedBean.selectedPlan.cmUnspscSegment.unspscCode}">
					</ac:lov>
		
				</td>
			</tr>
			<tr>
				<th class="verticalAlignNone"><p:outputLabel value="* #{lbl['lbl.pp.product.class']}"/></th>
				<td>
				
					<ac:lov id="lovClass" lovId="CM_UNSPSC" size="26"
						headerText="#{lbl['lbl.pp.product.class']}" update=":form:tvPlanContent:opTabDirectPurchase"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable
							|| planBackingBean.managedBean.selectedPlan.procurementModeParam.parameterCode!=PPConst.procurementDirectPurchase}"
						saveObject="planBackingBean.managedBean.selectedPlan.cmUnspscClass"
						value="#{planBackingBean.managedBean.selectedPlan.cmUnspscClass.unspscTitle}"
						conditionField="recordStatus^1|unspscLevel^2|cmUnspsc.unspscCode^#{planBackingBean.managedBean.selectedPlan.cmUnspscFamily.unspscCode}">
					</ac:lov>
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.quotation.tender.type']}"/></th>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlan.qtTypeParam.parameterId}"  
						styleClass="ppDropDownWidthM"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable ||
							 planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode!=PPConst.planTypeProcurement}" >
						<f:selectItems value="#{planBackingBean.qtTypeOptions()}" />
						<p:ajax event="change" listener="#{planBackingBean.selectedQtTypeParam(planBackingBean.managedBean.selectedPlan.qtTypeParam.parameterId)}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.item.origin.type']}"/></th>
				<td>
					<p:selectOneMenu id="somItemOrigin" 
						styleClass="ppDropDownWidthM" value="#{planBackingBean.managedBean.selectedPlan.itemOriginParam.parameterId}" 
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable ||
						planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode!=PPConst.planTypeProcurement}" >
						<f:selectItems value="#{planBackingBean.itemOriginTypeOptions()}" />
						<p:ajax event="change" listener="#{planBackingBean.selectedItemOriginTypeParam(planBackingBean.managedBean.selectedPlan.itemOriginParam.parameterId)}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.plan.description']}"/></th>
				<td>
					<p:inputTextarea cols="35" value="#{planBackingBean.managedBean.selectedPlan.planDesc}" 
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable}"/>
				</td>	
			</tr>
			<tr>
				<th rowspan="9"><p:outputLabel value="* #{lbl['lbl.pp.item']}"/></th>
				<td rowspan="9">
					<p:commandLink id="clItem" immediate="true" oncomplete="dlItemModal.show()" 
						action="#{planBackingBean.showItem}" update=":form:tvPlanContent:opItem"
 						disabled="#{planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode==null or
 						(planBackingBean.managedBean.selectedPlan.planTypeParam.parameterCode==PPConst.planTypeExpenditure and
						planBackingBean.managedBean.selectedPlan.procurementModeParam.parameterCode!=PPConst.procurementExistingContract)}">
	                	<p:graphicImage value="#{
	                		planBackingBean.managedBean.viewMode==PPConst.modeView
	                		? '/resources/ep/images/design/document.png' 
	                		:'/resources/ep/images/design/edit.png'}" />
               		</p:commandLink>
				</td>
			</tr>
			<tr>
				<th>&nbsp;</th>
				<td>&nbsp;</td>
			</tr>
		</table>
	</p:outputPanel>
	<!-- Item Dialog -->
	<ui:include src="planItem.xhtml"/>
	
</ui:composition>
