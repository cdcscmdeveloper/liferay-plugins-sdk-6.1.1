<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:tp="http://java.sun.com/jsf/composite/ep">
	<ui:define name="contentSection">
		<!-- Search Plan -->

		<p:panel header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" >

				<h:outputLabel value="#{lbl['lbl.pp.plan.number']}" />


				<p:inputText styleClass="ppDisplayTextM"
					value="#{procurementPlanBackingBean.managedBean.planNumber}" />


				<h:outputLabel value="#{lbl['lbl.pp.procurement.mode']}" />


				<p:selectOneMenu id="somProcureMode" styleClass="ppDropDownWidthM"
					value="#{procurementPlanBackingBean.managedBean.procurementMode}">

					<f:selectItems
						value="#{procurementPlanBackingBean.getDropdownCodeValues(PmCodeCatConst.procurementMode)}" />
				</p:selectOneMenu>

				
				<h:outputLabel value="#{lbl['lbl.pp.status']}" />


				<p:selectOneMenu styleClass="ppDropDownWidthM"
					value="#{procurementPlanBackingBean.managedBean.planStatus}">
					<f:selectItems value="#{procurementPlanBackingBean.statusDropdownValues()}" />
				</p:selectOneMenu>

<p:column></p:column>
				<p:commandButton value="#{lbl['lbl.pp.search']}"
					icon="ui-icon-search" update="dtPlanResult" style="float:right"
					action="#{procurementPlanBackingBean.retriveProcuremntPlanDtls}" />

			</h:panelGrid>


		</p:panel>
		<!-- Result List -->
		<p:panel header="#{lbl['lbl.pp.result']}" toggleable="true">
			<br />
			<ui:include src="listPlanContent.xhtml" />
		</p:panel>


	</ui:define>
</ui:composition>
