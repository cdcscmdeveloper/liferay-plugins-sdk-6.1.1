<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:tp="http://java.sun.com/jsf/composite/ep"
>
	<ui:define name="contentSection">
   			<!-- Search Plan -->
   			<!-- Search -->
			<p:panel header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
				<br />
				<table class="ppTwoTable">
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pp.plan.number']}" /></th>
						<td><p:inputText styleClass="ppDisplayTextM"
								value="#{planBackingBean.managedBean.ppSearchPlan.planNo}" /></td>
						<th>&nbsp;</th>
						<td>&nbsp;</td>
						<td>&nbsp;</td>
					</tr>
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pp.plan.description']}" /></th>
						<td><p:inputText styleClass="ppDisplayTextM"
								value="#{planBackingBean.managedBean.ppSearchPlan.planDesc}" />
						</td>
						<th><p:outputLabel value="#{lbl['lbl.pp.status']}" /></th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM"
								value="#{planBackingBean.managedBean.ppSearchPlan.status}">
								<f:selectItems value="#{planBackingBean.statusDropdownValues()}"/>
							</p:selectOneMenu></td>
						<td>&nbsp;</td>
						
					</tr>
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pp.plan.type']}" /></th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM"
								value="#{planBackingBean.managedBean.ppSearchPlan.planType}">
								<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
								<f:selectItems value="#{planBackingBean.planTypeOptions()}"/>
								<p:ajax event="change" update="somProcureMode" /> 
							</p:selectOneMenu>
						</td>
						<th><p:outputLabel value="#{lbl['lbl.pp.procurement.mode']}" /></th>
						<td>
							<p:selectOneMenu id="somProcureMode" styleClass="ppDropDownWidthM"
								value="#{planBackingBean.managedBean.ppSearchPlan.procurementMode}">
								<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
								<f:selectItems value="#{planBackingBean.procurementModeOptions(planBackingBean.managedBean.ppSearchPlan.planType)}"/>
							</p:selectOneMenu>
						</td>
						<td>&nbsp;</td>
					</tr>
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pp.from.created.date']}" /></th>
						<td><p:calendar styleClass="ppDisplayCalM" showOn="button" pattern="MM/dd/yyyy"
								value="#{planBackingBean.managedBean.ppSearchPlan.fromDate}" /></td>
						<th><p:outputLabel value="#{lbl['lbl.pp.to.created.date']}" /></th>
						<td><p:calendar styleClass="ppDisplayCalM" showOn="button" pattern="MM/dd/yyyy"
								value="#{planBackingBean.managedBean.ppSearchPlan.toDate}" /></td>
						<td>&nbsp;</td>
					</tr>
					<tr>
						<td colspan="5">
							<div class="ppRightBtn">
								<p:commandButton value="#{lbl['lbl.pp.search']}"
									icon="ui-icon-search" update="dtPlanResult"
									action="#{planBackingBean.searchPlan()}" />
							</div>
						</td>
					</tr>
				</table>
				<br />
			</p:panel>
			<!-- Result List -->
			<p:panel header="#{lbl['lbl.pp.result']}" toggleable="true">
				<br />
	   			<ui:include src="listPlanContent.xhtml"/>
   			</p:panel>
   			
   			
   			<!-- Bottom Button(s) -->
   			<div class="ppRightBtn">
				<!-- Enable for Org Profile PTJ -->
				<p:commandButton value="#{lbl['lbl.pp.create.new.plan']}" 
					id="cbNewPlan" icon="ui-icon-add"
			 		action="#{planBackingBean.redirectToPlanContent(null)}"   /> 
			</div>
  
	</ui:define>
</ui:composition>
