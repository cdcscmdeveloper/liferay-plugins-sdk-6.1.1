<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div class="ppLeftBtn">
		<p:commandButton value="#{lbl['lbl.pp.back']}" icon="ui-icon-back" action="#{planBackingBean.redirectToListPlan()}"/>&nbsp;
	</div>
	<div class="ppRightBtn">
		<ui:repeat var="bpmAction" value="#{planBackingBean.managedBean.outComes}">
			<p:commandButton value="#{bpmAction}" icon="#{planBackingBean.getIcon(bpmAction)}" action="#{planBackingBean.submitPlan(bpmAction)}" />&nbsp;
		</ui:repeat>	
	</div>
	
		
</ui:composition>
