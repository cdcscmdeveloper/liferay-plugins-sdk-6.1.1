<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">




	<div class="ppRightBtn">
		<c:choose>
			<c:when test="#{planBackingBean.managedBean.viewMode==PPConst.modeApproval}">
				<p:commandButton id="cbSubConfirm" value="#{lbl['lbl.pp.confirm']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp; 
				<p:commandButton id="cbSubCancel" value="#{lbl['lbl.pp.cancel']}" onclick="dlItemDetailsModal.hide();"  />&nbsp;
			</c:when>
			<c:when test="#{planBackingBean.managedBean.viewMode==PPConst.modeNew}">
				<p:commandButton id="cbSave" value="#{lbl['lbl.pp.save']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp; 
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" partialSubmit="true" action="#{planBackingBean.submitNewPlan()}"   />&nbsp;
				<p:commandButton id="cbBack" value="#{lbl['lbl.pp.back']}" action="#{planBackingBean.redirectToViewPlan()}"   />&nbsp;
			</c:when>
			<c:when test="#{planBackingBean.managedBean.viewMode==PPConst.modeVerification}">
				<p:commandButton id="cbRevise" value="#{lbl['lbl.pp.revise']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
				<p:commandButton id="cbAcknowledge" value="#{lbl['lbl.pp.acknowledge']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
				<p:commandButton id="cbVerify" value="#{lbl['lbl.pp.verify']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
				<p:commandButton id="cbReject" value="#{lbl['lbl.pp.reject']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
			</c:when>
			<c:when test="#{planBackingBean.managedBean.viewMode==PPConst.modeMaintain}">
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
				<p:commandButton id="cbCancel" value="#{lbl['lbl.pp.cancel']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
				<p:commandButton id="cbReject" value="#{lbl['lbl.pp.reject']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
			</c:when>
			<c:when test="#{planBackingBean.managedBean.viewMode==PPConst.modeRevision}">
				<p:commandButton id="cbSubmit" value="#{lbl['lbl.pp.submit']}" action="#{planBackingBean.redirectToViewPlan}"   />&nbsp;
			</c:when>
		</c:choose>
	</div>
	
		
</ui:composition>
