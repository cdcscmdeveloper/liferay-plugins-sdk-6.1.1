<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<style>
			input[id$="effDateId_input"] {
    			width:80px !important;
			}
			
		</style>
	
		<p:outputPanel id="opPlanDetails">
			<!-- Validation Message -->
			<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
			<!-- Header Buttons -->
			<ui:include src="common/headerSection.xhtml"/>

			<!-- Plan Header -->
			<ui:include src="common/planGeneralInfo.xhtml"/>
					
			<!-- Plan General Info -->			
			<p:panel id="pPlanHeader" header="#{lbl['lbl.pp.header']}" toggleable="true">
				<ui:include src="planDetails/planDetHeader.xhtml"/>
			</p:panel>	
				
			<!-- Plan Details -->
			<p:panel id="pPlanDet" header="#{lbl['lbl.pp.plan.detail']}" toggleable="true">
				<c:choose>
					<c:when test="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterCode eq ParameterConst.planTypeExpenditure}">
						<ui:include src="planDetails/planDetEpList.xhtml"/>
						<ui:include src="planDetails/itemJustification.xhtml"/> 
					</c:when>
					<c:when test="#{pPlanBackingBean.managedBean.selectedPlan.planType.parameterCode eq ParameterConst.planTypeProcurement}">
						<ui:include src="planDetails/planDetPpList.xhtml"/> 
					</c:when>
					<c:otherwise>
						<h:outputText styleClass="instruction" value="#{lbl['lbl.pp.select.plan.type']}" />
					</c:otherwise>
				</c:choose>
				<ui:include src="planDetails/planRejectReason.xhtml"/> 
				<ui:include src="planDetails/itemRemarks.xhtml"/>
			</p:panel>
			
			<!-- Plan Actors -->			
			<p:panel id="pPlanActor" header="#{lbl['lbl.pp.approver.det']}" toggleable="true">
				<ui:include src="planDetails/planActors.xhtml"/> 	
			</p:panel>	
			
			<!-- Plan Remarks -->			
			<p:panel id="pPlanRemark" header="#{lbl['lbl.pp.remarks']}" toggleable="true">
				<ui:include src="planDetails/planRemarks.xhtml"/> 
			</p:panel>	
		</p:outputPanel>
	
	</ui:define>
</ui:composition>
