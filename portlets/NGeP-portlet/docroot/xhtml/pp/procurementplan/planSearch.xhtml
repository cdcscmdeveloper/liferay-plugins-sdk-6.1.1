<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pPlanSearch" header="#{lbl['lbl.pp.search.plan']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.plan.year']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somPlanYearSearch" label="#{lbl['lbl.pp.plan.year']}" styleClass="ppDropDownWidthM"  
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.ministry']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somMinistrySearch" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pp.ministry']}"
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.ptj']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somPtjSearch" label="#{lbl['lbl.pp.ptj']}" styleClass="ppDropDownWidthM"  
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							process="pPlanSearch"
							update="dtPlanResult" 
							action="#{pPlanBackingBean.searchPlan}"
							/>&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{pPlanBackingBean.resetPlanSearchBean}"
							update="pPlanSearch" 
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
