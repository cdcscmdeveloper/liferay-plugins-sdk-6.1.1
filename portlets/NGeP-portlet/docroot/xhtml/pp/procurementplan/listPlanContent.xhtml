<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opViewPlanContent">

		<!--  
		id<p:inputText value="#{planBackingBean.managedBean.tempId}" />, 
		<p:inputText value="#{planBackingBean.managedBean.actionDesc}" />
		<p:commandButton value="Load" action="#{planBackingBean.dummyTask(planBackingBean.managedBean.tempId, planBackingBean.managedBean.actionDesc)}" 
		update="@form"  />  -->

		<p:dataTable id="dtPlanResult" styleClass="ppTableFull" var="ppPlan"
			value="#{planBackingBean.managedBean.planList}"
			rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">

			<p:column headerText="#{lbl['lbl.pp.details']}">
				<p:commandLink id="clPlanDetails"
					action="#{planBackingBean.redirectToPlanContent(ppPlan)}">  
			        	#{lbl['lbl.pp.details']}
			       </p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.pp.plan.number']}">  
               		#{ppPlan.planNo}
                   </p:column>
			<p:column headerText="#{lbl['lbl.pp.procurement.mode']}">  
               		#{ppPlan.ppPlanMaster.procurementMode}
                   </p:column>
			<p:column headerText="#{lbl['lbl.pp.plan.description']}">  
                       #{ppPlan.planDesc}
                   </p:column>
			<p:column headerText="#{lbl['lbl.pp.total.estimated.amount']}"
				styleClass="ppNumericAlign">  
                       #{ppPlan.estimatedAmount}
                   </p:column>
			<p:column headerText="#{lbl['lbl.pp.status']}">  
                       #{ppPlan.statusId}
                   </p:column>
			<p:column headerText="#{lbl['lbl.pp.created.by']}">  
                       #{ppPlan.createdBy}
                   </p:column>
			<p:column headerText="#{lbl['lbl.pp.created.date']}">  
                       #{ppPlan.createdDate}
                   </p:column>
		</p:dataTable>
		<br />
		<br />
	</p:outputPanel>


</ui:composition>
