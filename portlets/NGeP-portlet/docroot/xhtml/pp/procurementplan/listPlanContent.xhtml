<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<p:outputPanel id="opViewPlanContent">
   			<div class="ppProfileInfo">
   				<br/>
				<table class="ppHalf">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.pp.ministry.code.name']}"/></td>
						<td>
							<p:inputText disabled="true" styleClass="ppDisplayText"
								value="#{planBackingBean.managedBean.currentUser.parentOrgProfile.parentOrgProfile.orgCode} / #{planBackingBean.managedBean.currentUser.parentOrgProfile.parentOrgProfile.orgName}" /> 
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.pp.jabatan.code.name']}"/></td>
						<td>
							<p:inputText disabled="true" styleClass="ppDisplayText"
								value="#{planBackingBean.managedBean.currentUser.parentOrgProfile.orgCode} / #{planBackingBean.managedBean.currentUser.parentOrgProfile.orgName}" />
						</td>
					</tr>
					<tr> 
						<td><p:outputLabel value="#{lbl['lbl.pp.ptj.code.name']}"/></td>
						<td>
							<p:inputText disabled="true" styleClass="ppDisplayText"
								value="#{planBackingBean.managedBean.currentUser.orgCode} / #{planBackingBean.managedBean.currentUser.orgName}" />
						</td>
					</tr>
				</table>
				<br/>
			</div>
			<!--   -->
			id<p:inputText value="#{planBackingBean.managedBean.tempId}" />, 
			<p:inputText value="#{planBackingBean.managedBean.actionDesc}" />
			<p:commandButton value="Load" action="#{planBackingBean.dummyTask(planBackingBean.managedBean.tempId, planBackingBean.managedBean.actionDesc)}" 
			update="@form"  /> 
			
   			<!-- Search -->
   			<p:panel header="#{lbl['lbl.pp.search.plan']}"  toggleable="true">
   				<br/>
   				<table class="ppThreePartsTable">
   					<tr>
   						<th><p:outputLabel value="#{lbl['lbl.pp.plan.number']}"/></th>
   						<td>
   							<p:inputText value="#{planBackingBean.managedBean.ppSearchPlan.planNo}" />
						</td>
							<th><p:outputLabel value="#{lbl['lbl.pp.status']}"/></th>
   						<td>
    						<p:selectOneMenu value="#{planBackingBean.managedBean.ppSearchPlan.status}">
								<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
								<f:selectItem itemLabel="New" itemValue="10005"/>
							</p:selectOneMenu>
   						</td>
   						<td>
   							&nbsp;
   						</td>
   					</tr>
   					<tr>
   						<th><p:outputLabel value="#{lbl['lbl.pp.plan.description']}"/></th>
   						<td>
   							<p:inputText value="#{planBackingBean.managedBean.ppSearchPlan.planDesc}" />
						</td>
						<th><p:outputLabel value="#{lbl['lbl.pp.procurement.mode']}"/></th>
   						<td>
    						<p:selectOneMenu value="#{planBackingBean.managedBean.ppSearchPlan.procurementMode}">
								<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}" />
								<f:selectItems value="#{planBackingBean.procurementModeOptions()}"/>
							</p:selectOneMenu>
   						</td>
   						<td>
   							&nbsp;
   						</td>
   					</tr>
   					<tr>
   						<th><p:outputLabel value="#{lbl['lbl.pp.from.created.date']}"/></th>
   						<td>
   							<p:calendar showOn="button" pattern="MM/dd/yyyy" value="#{planBackingBean.managedBean.ppSearchPlan.fromDate}"/> 
						</td>
   						<th><p:outputLabel value="#{lbl['lbl.pp.to.created.date']}"/></th>
   						<td>
   							<p:calendar showOn="button" pattern="MM/dd/yyyy" value="#{planBackingBean.managedBean.ppSearchPlan.toDate}"/> 
						</td>
   						<td>&nbsp;</td>
   					</tr>
   					<tr>
   						<td colspan="5">
   							<div class="ppRightBtn">
   								<p:commandButton value="#{lbl['lbl.pp.search']}" icon="ui-icon-search"
			 						update="dtPlanResult" action="#{planBackingBean.searchPlan()}"   /> 
		 					</div>
   						</td>
   					</tr>
   				</table>
   				<br/>
   			</p:panel>
   			<!-- Result List -->
   			<p:panel header="#{lbl['lbl.pp.result']}"  toggleable="true">
   				<br/>
    			<p:dataTable id="dtPlanResult" styleClass="ppTableFull"  var="ppPlan" 
					value="#{planBackingBean.managedBean.planList}"  rowIndexVar="rowIndex"
					emptyMessage="#{lbl['lbl.pp.no.record.found']}">  
			 		 
                    <p:column headerText="#{lbl['lbl.pp.details']}">  
                       <p:commandLink id="clPlanDetails" action="#{planBackingBean.redirectToPlanContent(ppPlan)}">  
				        	#{lbl['lbl.pp.details']}
				       </p:commandLink>  
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.plan.number']}">  
                		#{ppPlan.planNo}
                    </p:column>   
                    <p:column headerText="#{lbl['lbl.pp.procurement.mode']}">  
                		#{ppPlan.ppPlanMaster.procurementMode}
                    </p:column>  
                    <p:column headerText="#{lbl['lbl.pp.plan.description']}">  
                        #{ppPlan.planDesc}
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.total.estimated.amount']}" styleClass="ppNumericAlign">  
                        #{ppPlan.estimatedAmount}
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.status']}">  
                        #{ppPlan.statusId}
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.created.by']}">  
                        #{ppPlan.createdBy}
                    </p:column>  
                    <p:column headerText="#{lbl['lbl.pp.created.date']}">  
                        #{ppPlan.createdDate}
                    </p:column>  
                </p:dataTable>  
   			</p:panel>
   			
			<br/>
			<br/>
   		</p:outputPanel>
	
	
</ui:composition>
