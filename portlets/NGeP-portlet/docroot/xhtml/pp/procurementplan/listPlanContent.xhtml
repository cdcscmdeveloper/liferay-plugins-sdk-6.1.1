<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<p:outputPanel id="opViewPlanContent">
   			<div class="ppProfileInfo">
				<table class="ppTwoPartsTable">
					<tr>
						<th>#{lbl['lbl.pp.ministry.code.name']}</th>
						<td class="ppSmallTd">:</td>
						<td><p:inputText disabled="true" value="-" /></td>
					</tr>
					<tr>
						<th>#{lbl['lbl.pp.jabatan.code.name']}</th>
						<td class="ppSmallTd">:</td>
						<td><p:inputText disabled="true" value="-" /></td>
					</tr>
					<tr> 
						<th>#{lbl['lbl.pp.ptj.code.name']}</th>
						<td class="ppSmallTd">:</td>
						<td><p:inputText disabled="true" value="-" /></td>
					</tr>
				</table>
			</div>
   			<!-- Search -->
   			<p:panel header="#{lbl['lbl.pp.search.plan']}"  toggleable="true">
   				<table class="ppThreePartsTable">
   					<tr>
   						<th>#{lbl['lbl.pp.plan.number']}</th>
   						<td class="ppSmallTd">:</td>
   						<td>
   							<p:inputText id="txtPlanName" />
						</td>
   						<th>#{lbl['lbl.pp.plan.created.date']}</th>
   						<td class="ppSmallTd">:</td>
   						<td colspan="2">
   							<p:calendar showOn="button" /> 
						</td>
   						<td>
   							<p:commandButton value="#{lbl['lbl.pp.search']}" id="cbSearchPlanBtn"
			 					update="dtPlanResult" action="#{planBackingBean.searchPlan()}"   /> 
   						</td>
   					</tr>
   					<tr>
   						<th>#{lbl['lbl.pp.status']}</th>
   						<td class="ppSmallTd">:</td>
   						<td>
    						<p:selectOneMenu>
								<f:selectItem itemLabel="#{lbl['lbl.select']}" />
							</p:selectOneMenu>
   						</td>
   						<th>&nbsp;</th>
   						<td>&nbsp;</td>
   						<td>&nbsp;</td>
   						<td>&nbsp;</td>
   						<td>&nbsp;</td>
   					</tr>
   				</table>
   			</p:panel>
   			<!-- Result List -->
   			<p:panel header="#{lbl['lbl.pp.result']}"  toggleable="true">
    			<p:dataTable id="dtPlanResult" styleClass="ppTableFull" var="" value="">
			 		<p:column headerText="#{lbl['lbl.pp.seq']}">  
                        <p:outputLabel value="" />  
                    </p:column>    
                    <p:column headerText="#{lbl['lbl.pp.details']}">  
                       <p:commandLink id="clPlanDetails" action="#{planBackingBean.redirectToViewPlan}">  
				        	#{lbl['lbl.pp.details']}
				       </p:commandLink>  
                    </p:column>  
                    <p:column headerText="#{lbl['lbl.pp.procurement.mode']}">  
                        <p:outputLabel value="" />  
                    </p:column>  
                    <p:column headerText="#{lbl['lbl.pp.plan.description']}">  
                        <p:outputLabel value="" /> 
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.total.estimated.amount']}">  
                        <p:outputLabel value="" /> 
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.status']}">  
                        <p:outputLabel value="" />
                    </p:column> 
                    <p:column headerText="#{lbl['lbl.pp.created.by']}">  
                         <p:outputLabel value="" />
                    </p:column>  
                    <p:column headerText="#{lbl['lbl.pp.created.date']}">  
                         <p:outputLabel value="" />
                    </p:column>  
                </p:dataTable>  
   			</p:panel>
   			
			<br/>
			<br/>
   		</p:outputPanel>
	
	
</ui:composition>
