<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="opViewPlanContent">
		<p:dataTable id="dtPlanResult" styleClass="ppTableFull" var="ppPlan"
			value="#{planBackingBean.planDataModel}" lazy="true"
			rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}">
			<ac:paginator for="dtPlanResult" />

			<p:column headerText="#{lbl['lbl.pp.plan.number']}">  
               		#{ppPlan.planNo}
            </p:column>
            <p:column headerText="#{lbl['lbl.pp.plan.type']}">  
               		#{ppPlan.planTypeParam.parameterCode}
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.procurement.mode']}">  
               		#{ppPlan.procurementModeParam.parameterCode}
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.description']}">  
                    #{ppPlan.planDesc}
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.short.total.estimated.amount']}"
				styleClass="ppNumericAlign">  
                    #{ppPlan.estimatedAmt}
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.status']}">  
                    TODO
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.created.by']}">  
                    #{ppPlan.createdBy}
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.created.date']}">  
                 <h:outputText value="#{ppPlan.createdDate}" >
               		<f:convertDateTime pattern="#{PPConst.dateDisplayPattern}" />
                 </h:outputText>
            </p:column>
			<p:column headerText="#{lbl['lbl.pp.action']}">
				<p:commandLink action="#{planBackingBean.redirectToPlanContent(ppPlan.planId)}" >
					<p:graphicImage value="#{(planBackingBean.managedBean.viewMode==PPConst.modeList)
               			? '/resources/ep/images/design/edit.png' 
                  		: '/resources/ep/images/design/document.png'}"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
	

		<br />
		<br />
	</p:outputPanel>


</ui:composition>
