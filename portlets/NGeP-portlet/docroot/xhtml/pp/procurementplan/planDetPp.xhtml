<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	
	<p:outputPanel id="opPlanPp">
		<br/>
	   	<p:dataTable id="dtProcurementPlan" emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
		     selectionMode="multiple">
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pp.procurement.title']}" />
			    </f:facet>
		  		<p:inputText styleClass="ppDisplayTextM" id="itPpTitle"
					label="#{lbl['lbl.pp.procurement.title']}">
				</p:inputText>
	            <p:message id="itPpTitleMsg" for="itPpTitle" display="icon" />    
	        </p:column>	 
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pp.category']}" />
			    </f:facet>
		  		
	        </p:column>
	         <p:column>
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pp.procurement.type']}" />
			    </f:facet>
		  		
	        </p:column>
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pp.invitation.date']}" />
			    </f:facet>
		  		
	        </p:column>
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pp.estimated.amount']}" />
			    </f:facet>
		  		
	        </p:column>
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="#{lbl['lbl.pp.cost.center.code']}" />
			    </f:facet>
		  		
	        </p:column>
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="#{lbl['lbl.pp.cost.center.name']}" />
			    </f:facet>
		  		
	        </p:column>
	        <p:column>
			    <f:facet name="header">
			     	<h:outputText value="#{lbl['lbl.pp.reject']}" />
			    </f:facet>
		  		
	        </p:column>
          	<p:column>
			    <f:facet name="header">
			     	<h:outputText value="#{lbl['lbl.pp.reject.reason']}" />
			    </f:facet>
		  		
	        </p:column>
	         <p:column>
			    <f:facet name="header">
			     	<h:outputText value="#{lbl['lbl.pp.remarks']}" />
			    </f:facet>
		  		
	        </p:column>
		</p:dataTable>
	
	</p:outputPanel>
</ui:composition>
