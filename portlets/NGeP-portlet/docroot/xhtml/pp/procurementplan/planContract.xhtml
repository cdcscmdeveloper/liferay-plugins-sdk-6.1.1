<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<p:outputPanel id="opTabContract">
		<table class="ppTwoTable">
			<tr>
				<th><p:outputLabel value="* #{lbl['lbl.pp.doc.type']}"/></th>
				<td>
					<p:selectOneMenu value="#{planBackingBean.managedBean.selectedPlan.docTypeParam.parameterId}"
						styleClass="ppDropDownWidthM"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable}">
						<f:selectItems value="#{planBackingBean.epContractTypeOptions()}"/>
						<p:ajax event="change" listener="#{planBackingBean.selectedDocTypeParam
							(planBackingBean.managedBean.selectedPlan.docTypeParam.parameterId)}" 
							update="opTabContract"/> 
					</p:selectOneMenu>
				</td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<th>
					<p:outputLabel 
						value="#{planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode==PPConst.contractTypePkp ? '*' : ''}
							#{lbl['lbl.pp.pkp.number']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{planBackingBean.managedBean.selectedPlan.ctCircular.circularId}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable
							or planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode != PPConst.contractTypePkp}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{planBackingBean.circularOptions()}"  var="obj" 
							itemLabel="#{obj.latestCircularVer.circularNo}" itemValue="#{obj.circularId}"/>
						<p:ajax event="change" listener="#{planBackingBean.selectedCircular(
							planBackingBean.managedBean.selectedPlan.ctCircular.circularId)}"
							update="itCircularTitle, somContract"/> 
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.pkp.title']}"/>
				</th>
				<td>
					<p:inputText id="itCircularTitle" disabled="true" styleClass="ppDisplayTextL"
							value="#{planBackingBean.managedBean.selectedPlan.ctCircular.latestCircularVer!=null ?
							planBackingBean.managedBean.selectedPlan.ctCircular.latestCircularVer.name : ''}" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{(planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode==null || 
						planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode==PPConst.contractTypeLoa) ? '' : '*'}
						#{lbl['lbl.pp.contract.number']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somContract"
						value="#{planBackingBean.managedBean.selectedPlan.ctContract.contractId}"
						styleClass="ppDropDownWidthM"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable
							or planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode==contractTypeLoa
							or planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode==null}">
						<f:selectItems value="#{planBackingBean.contractOptions()}"/>
						<p:ajax event="change" listener="#{planBackingBean.selectedContract
							(planBackingBean.managedBean.selectedPlan.ctContract.contractId)}" 
							update="itContractTitle, itSupName, itConDuration"/> 
					</p:selectOneMenu>
				</td>
					<th>
					<p:outputLabel value="#{lbl['lbl.pp.contract.title']}"/>
				</th>
				<td>
					<p:inputText id="itContractTitle" disabled="true" styleClass="ppDisplayTextL"
							value="#{planBackingBean.managedBean.selectedPlan.ctContract.contractName}" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode==PPConst.contractTypeLoa ? '*' : ''}
						#{lbl['lbl.pp.loa.number']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{planBackingBean.managedBean.selectedPlan.scLoa.loaId}"
						disabled="#{!planBackingBean.managedBean.selectedPlan.editable
							or planBackingBean.managedBean.selectedPlan.docTypeParam.parameterCode!=PPConst.contractTypeLoa}">
						<f:selectItem itemLabel="#{lbl['lbl.select']}" itemValue="#{null}"/>
						<p:ajax event="change" 
							update="itLoaTitle"/> 
					</p:selectOneMenu>
				</td>
					<th>
					<p:outputLabel value="#{lbl['lbl.pp.loa.title']}"/>
				</th>
				<td>
					<p:inputText id="itLoaTitle" disabled="true" styleClass="ppDisplayTextL"
							value="#{planBackingBean.managedBean.selectedPlan.scLoa.loaId}" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pp.mof.number']}"/>
				</th>
				<td>
					<p:inputText disabled="true" styleClass="ppDisplayTextM"
							value="-" />
				</td>
				<th><p:outputLabel value="#{lbl['lbl.pp.supplier.name']}"/></th>
				<td>
					<p:inputText id="itSupName" disabled="true" styleClass="ppDisplayTextL"
						value="#{planBackingBean.managedBean.selectedPlan.ctContract.smSupplier!=null ?
							planBackingBean.managedBean.selectedPlan.ctContract.smSupplier.companyName : ''}" />
				</td>
			</tr>
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pp.duration.month']}"/></th>
				<td>
					<p:inputText id="itConDuration" disabled="true" styleClass="ppDisplayTextM"
							value="#{planBackingBean.managedBean.selectedPlan.ctContract.latestContractVer!=null ?
								planBackingBean.managedBean.selectedPlan.ctContract.latestContractVer.ctContractValue.contractPeriod : ''}" />
					
				</td>
				<th></th>
				<td></td>
			</tr>
		</table>
	</p:outputPanel>
</ui:composition>
