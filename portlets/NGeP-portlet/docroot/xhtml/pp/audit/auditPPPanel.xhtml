<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.audit.panel.view']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td>
					<div align="left" style="width: 100%">
						<p:dataTable id="searchPPID" var="obj" rows="10" width="100%"
							value="#{auditProcurementPlanReportBackingBean.searchPlan}"
							rowIndexVar="index" lazy="true">
							<ac:paginator for="searchPPID"></ac:paginator>
							<p:column headerText="#{lbl['lbl.audit.header.action.date']}"
								style="white-space: normal!important;" width="5%">
								<h:outputText value="#{obj.createdDate}">
									<f:convertDateTime
										pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
								</h:outputText>
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.action.type']}"
								style="white-space: normal!important;" width="5%">
								<h:outputText rendered="#{obj.actionType == null}"
									value="#{lbl['lbl.audit.no.available']}" />
								<h:outputText rendered="#{obj.actionType != null}"
									value="#{obj.actionType}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.action.by']}"
								style="white-space: normal!important;" width="5%">
								<h:outputText value="#{obj.actionBy}" escape="false" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.org.name']}"
								style="white-space: normal!important;" width="10%">
								<h:outputText value="#{obj.orgName}" escape="false" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.role']}" width="5%">
								<h:outputText value="#{obj.roleName}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.docType']}"
								width="5%">
								<h:outputText value="#{obj.docType}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.docNo']}"
								width="10%">
								<h:outputText value="#{obj.docNo}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.subDocNo']}"
								width="10%">
								<h:outputText value="#{obj.subDocNo}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.docStatus']}"
								width="10%">
								<h:outputText value="#{obj.docStatus}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.fieldName']}"
								style="white-space: pre-line;" width="15%">
								<h:outputText rendered="#{obj.fieldName == null}"
									value="#{lbl['lbl.audit.no.available']}" />
								<h:outputText rendered="#{obj.fieldName != null}"
									value="#{obj.fieldName}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.oldValue']}"
								style="max-width:100px;word-wrap: break-word;overflow-wrap: break-word;white-space: normal;">
								<h:outputText rendered="#{obj.oldValue == null}"
									value="#{lbl['lbl.audit.no.available']}" />
								<h:outputText rendered="#{obj.oldValue != null}"
									value="#{auditProcurementPlanReportBackingBean.getFormattedValue(obj.oldValue)}"
									escape="false" />
							</p:column>
							<p:column headerText="#{lbl['lbl.audit.header.newValue']}"
								style="max-width:100px;word-wrap: break-word;overflow-wrap: break-word;white-space: normal;">
								<h:outputText rendered="#{obj.newValue == null}"
									value="#{lbl['lbl.audit.no.available']}" />
								<h:outputText rendered="#{obj.newValue != null}"
									value="#{auditProcurementPlanReportBackingBean.getFormattedValue(obj.newValue)}"
									escape="false" />
							</p:column>
						</p:dataTable>
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
