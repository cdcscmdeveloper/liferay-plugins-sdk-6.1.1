<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	
		<p:messages id="taskListMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>
 		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<h:panelGroup id="tasksListViewId">

		<div class="clear"></div>
		
		<!-- Enhancement #24714  -->
	 	<p:outputLabel
			style="font-weight:bold;float:left;font-size:15px;margin-top: 10px;padding-left: 10px;"
			value="My Task (Combined)" />
        <div class="clear"></div>
		<ui:include src="normalAndAdvanceView.xhtml"></ui:include>

		</h:panelGroup>
		
	</ui:define>

</ui:composition>
