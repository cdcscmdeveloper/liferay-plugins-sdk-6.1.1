<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<h:panelGroup id="taskListMenuId">

	
			<table style="width: 100%;">
				<tr>

                  
					<td><p:commandLink value="#{lbl['lbl.bpm.my.tasks']}" styleClass="menuItemLink"
							action="#{bpmTasklistBackingBean.goToMyTasks(0)}" 
							update="tasksListViewId" />
				<p:spacer width="20px"></p:spacer>
					<p:commandLink value="#{lbl['lbl.bpm.catalogue.item.approval']}" styleClass="menuItemLink"
							action="#{bpmTasklistBackingBean.goToMyTasks(1)}" 
							 update="tasksListViewId" />
							 <p:spacer width="20px"></p:spacer>
					<p:commandLink value="#{lbl['lbl.bpm.pending.delivery.list']}" styleClass="menuItemLink"
							action="#{bpmTasklistBackingBean.goToMyTasks(2)}" 
							update="tasksListViewId" />
							<p:spacer width="20px"></p:spacer>
							</td>		
							
						
						
				</tr>
			</table>
	

	</h:panelGroup>

</ui:composition>
