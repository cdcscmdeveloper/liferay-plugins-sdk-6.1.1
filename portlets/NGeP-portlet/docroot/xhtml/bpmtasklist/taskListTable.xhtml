<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup id="taskListID" >



		<div style="text-align: left; float: right;">
		
			<p:selectOneMenu value="#{bpmTasklistBackingBean.managedBean.viewBy}">
				<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue=""></f:selectItem>
				<f:selectItem itemLabel="#{lbl['lbl.bpm.past.day']}" itemValue="DAY"></f:selectItem>
				<f:selectItem itemLabel="#{lbl['lbl.bpm.past.week']}"
					itemValue="WEEK"></f:selectItem>
				<f:selectItem itemLabel="#{lbl['lbl.bpm.past.month']}"
					itemValue="MONTH"></f:selectItem>
				<p:ajax event="change"
					listener="#{bpmTasklistBackingBean.filterViewbyNAssignment}"
					update="taskListId"></p:ajax>
			</p:selectOneMenu>
			</div>
			<div style="text-align: left;margin-right: 2px; float: right;">
			<p:outputLabel value="#{lbl['lbl.bpm.date']} : "/>
		</div>
       <p:spacer width="2px"></p:spacer>
		<div style="text-align: left;margin-right: 20px; float: right;">
		
			<p:selectOneMenu value="#{bpmTasklistBackingBean.managedBean.assignment}">
			<f:selectItem itemLabel="#{lbl['lbl.bpm.me.n.my.group']}"
					itemValue="ALL"></f:selectItem>
				<f:selectItem itemLabel="#{lbl['lbl.bpm.me']}" itemValue="MY"></f:selectItem>
				<f:selectItem itemLabel="#{lbl['lbl.bpm.my.group']}" itemValue="GROUP"></f:selectItem>
				<p:ajax event="change"
					listener="#{bpmTasklistBackingBean.filterViewbyNAssignment}"
					update="taskListId"></p:ajax>
			</p:selectOneMenu>
			</div>
			<div style="text-align: left;margin-right: 2px; float: right;">
			<p:outputLabel value="#{lbl['lbl.bpm.assignment']} : "/>
		</div>

		<div style="text-align: left; float: left;">
			<p:commandButton action="#{bpmTasklistBackingBean.refreshTaskList}"
				value="#{lbl['lbl.bpm.refresh']}" icon="ui-icon-reset"
				update="taskListId"></p:commandButton>
		</div>




		<div class="clear"></div>


		<p:dataTable value="#{bpmTasklistBackingBean.managedBean.taskListDataModel}" lazy="true" rowIndexVar="rowIndex" rows="10"
			id="taskListId" style="width:100%;" var="tasks" >
				<ac:paginator for="taskListId"></ac:paginator>	

			<p:column width="5%;">
				<f:facet name="header">
					#{lbl['lbl.bpm.doc.no']}
				</f:facet>
				<p:commandLink value="#{tasks.docNumber}"
					action="#{bpmTasklistBackingBean.navigateToURL}">
					<f:param name="taskId" value="#{tasks.taskId}" />
				</p:commandLink>
			</p:column>
			<p:column width="5%;">
				<f:facet name="header">
					#{lbl['lbl.bpm.doc.type']}
				</f:facet>
				#{tasks.docType}
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.description']}
				</f:facet>
				<p:commandLink value="#{tasks.title}"
					action="#{bpmTasklistBackingBean.navigateToURL}">
					<f:param name="taskId" value="#{tasks.taskId}" />
				</p:commandLink>

			</p:column>
			<p:column width="12%;">
				<f:facet name="header">
					#{lbl['lbl.bpm.created.date']}
				</f:facet>
				<h:outputText value="#{tasks.createDate.time}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>

			</p:column>
			<p:column width="12%;">
				<f:facet name="header">
					#{lbl['lbl.bpm.due.date']}
				</f:facet>
				<h:outputText value="#{tasks.expirationDate.time}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.status']}
				</f:facet>
				
				#{bpmTasklistBackingBean.applicationStatus(tasks.docStatus)}
				
				

			</p:column>




		</p:dataTable>

	</h:panelGroup>




</ui:composition>
