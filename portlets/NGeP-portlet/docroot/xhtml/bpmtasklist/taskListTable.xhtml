<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<h:panelGroup id="taskListID">
	
	

		<div style="text-align: left; float: right;">
			<p:selectOneMenu value="#{bpmTasklistBackingBean.managedBean.status}">
				<f:selectItem itemLabel="ASSIGNED" itemValue="ASSIGNED"></f:selectItem>
				<f:selectItem itemLabel="COMPLETED" itemValue="COMPLETED"></f:selectItem>
				<p:ajax event="change"
							listener="#{bpmTasklistBackingBean.filterStatus}"
							update="taskListID"></p:ajax>
			</p:selectOneMenu>
		</div>
		
		
		


		<div class="clear"></div>

		<p:dataTable value="#{bpmTasklistBackingBean.managedBean.taskList}" style="width:100%;"
			var="tasks" paginator="true" rows="10" paginatorPosition="bottom"
			paginatorTemplate="{LastPageLink} {NextPageLink} {PreviousPageLink} {FirstPageLink} Page {JumpToPageDropdown} {CurrentPageReport}"
			currentPageReportTemplate="/ {totalPages}"
			rowsPerPageTemplate="5,10,15">

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.task.number']}
				</f:facet>
				<p:commandLink value="#{tasks.taskNumber}"
					action="#{bpmTasklistBackingBean.navigateToURL}">
					<f:param name="taskId" value="#{tasks.taskId}" />
				</p:commandLink>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.task.title']}
				</f:facet>
				#{tasks.title}
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.created.date']}
				</f:facet>
				#{tasks.createDate.time}
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.state']}
				</f:facet>
				#{tasks.state}
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.process']}
				</f:facet>
				#{tasks.process}
			</p:column>


		</p:dataTable>

	</h:panelGroup>




</ui:composition>
