<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="tasksListViewId">
			<p:tabMenu id="taskListTabId" orientation="left"
				activeIndex="#{bpmTasklistBackingBean.managedBean.showIndex}">

				<p:menuitem value="#{lbl['lbl.bpm.my.tasks']}"
					action="#{bpmTasklistBackingBean.goToMyTasks(0)}" update="@form" />
				<p:menuitem value="#{lbl['lbl.bpm.catalogue.item.approval']}" rendered="#{unspscCodeBackingBean.catalogueAdmin}"
					action="#{bpmTasklistBackingBean.goToMyTasks(1)}" update="@form" />
				<p:menuitem value="#{lbl['lbl.bpm.pending.delivery.list']}" rendered="#{unspscCodeBackingBean.requisitioner}"
					action="#{bpmTasklistBackingBean.goToMyTasks(2)}" update="@form" />
			</p:tabMenu>

			<c:choose>

				<c:when test="#{bpmTasklistBackingBean.managedBean.showIndex == 0}">
					<ui:include src="taskListTable.xhtml" />
				</c:when>
				<c:when test="#{bpmTasklistBackingBean.managedBean.showIndex == 1}">
					<ui:include src="../cm/catalogue/catalogueTaskListDetail.xhtml" />
				</c:when>
				<c:when test="#{bpmTasklistBackingBean.managedBean.showIndex == 2}">
					<ui:include src="pendingDeliveryList.xhtml" />
				</c:when>
			</c:choose>
		</h:panelGroup>



	</ui:define>

</ui:composition>
