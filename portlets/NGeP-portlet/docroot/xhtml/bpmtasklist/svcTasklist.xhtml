<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	
		
		<table>
			<tr>
				<td><p:outputLabel value="Application No"></p:outputLabel></td>
				<td><p:inputText value="#{svcTasklistBackingBean.applNo}" /></td>
			</tr>
		</table>
         	<div style="text-align: right;">
         <p:commandButton id="schBtn" action="#{svcTasklistBackingBean.searchAction}" value="Search" update="rspl" />
         
         </div>
         
         
         <p:panel id="rspl">
	         <p:dataTable id="rsDt"
	         	value="#{svcTasklistBackingBean.resultList}" var="appl">
	         	
	         	<p:column headerText="Application No">
	         	
	         		<p:commandLink id="navL" value="#{appl.applNo}" action="#{svcTasklistBackingBean.navigateToSiteVisitAssignment}" >
	         			<f:param name="selApplNo" value="#{appl.applNo}"></f:param>
	         		</p:commandLink> 

	         	</p:column>
	         	
	         		<p:column headerText="Supplier Name">
	         	
	         		<h:outputText value="#{appl.smSupplier.companyName}"></h:outputText>

	         	</p:column>
	         	
	         	
	         	
	         	
	         	<p:column headerText="test">
	         		<h:outputText value="#{appl.applId}"></h:outputText>
	         	</p:column>
	         	
	         </p:dataTable>
         </p:panel>
		
	</ui:define>

</ui:composition>
