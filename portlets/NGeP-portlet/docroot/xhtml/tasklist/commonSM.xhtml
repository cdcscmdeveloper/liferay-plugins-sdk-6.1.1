<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<c:if
			test='#{tasklistBackingBean.managedBean.taskName eq "Verify Supporting Documents"}'>
			Verify Supporting Documents
		<ui:include src="/xhtml/sdoreview/reviewSupportingDocuments.xhtml"></ui:include>
		</c:if>


		<c:if
			test='#{tasklistBackingBean.managedBean.taskName eq "Assign Site Visit"}'>
			Assign Site Visit
		<ui:include src="/xhtml/svcassignation/assignSiteVisitView.xhtml"></ui:include>
		</c:if>
		
		<c:if
			test='#{tasklistBackingBean.managedBean.taskName eq "Complete Site Visit Report"}'>
		<ui:include src="/xhtml/svositevisit/siteVisitView.xhtml"></ui:include>
		</c:if>
	</ui:define>
</ui:composition>
