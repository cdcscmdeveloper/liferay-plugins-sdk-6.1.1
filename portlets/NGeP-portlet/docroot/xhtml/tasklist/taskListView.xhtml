<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="taskListID">


			<p:commandButton value="BPM"
				action="#{tasklistBackingBean.taskListAction}" update="taskListID"></p:commandButton>


			<p:dataTable value="#{tasklistBackingBean.managedBean.taskList}"
				var="tasks">

				<p:column>
					<f:facet name="header">
						<p:outputLabel value="#{lbl['lbl.bpm.task.number']}" />
					</f:facet>
					<p:commandLink value="#{tasks.taskNumber}" action="#{tasklistBackingBean.navigateToURL}">
						<f:param name="key" value="key" />
					</p:commandLink>
				</p:column>
				<p:column>
					<f:facet name="header">
						<p:outputLabel value="#{lbl['lbl.bpm.task.title']}" />
					</f:facet>
					<p:outputLabel value="#{tasks.title}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<p:outputLabel value="#{lbl['lbl.bpm.created.date']}" />
					</f:facet>
					<p:outputLabel value="#{tasks.createDate.time}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<p:outputLabel value="#{lbl['lbl.bpm.state']}" />
					</f:facet>
					<p:outputLabel value="#{tasks.state}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<p:outputLabel value="#{lbl['lbl.bpm.process']}" />
					</f:facet>
					<p:outputLabel value="#{tasks.process}" />
				</p:column>


			</p:dataTable>

		</h:panelGroup>

	</ui:define>

</ui:composition>
