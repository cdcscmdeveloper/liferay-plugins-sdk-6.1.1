<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">



		<h:panelGroup id="cmReviewUnspsc">

			<p:outputLabel styleClass="titleFront"
				value="#{lbl['lbl.cm.unspsc.code.request.form']}"></p:outputLabel>

			<p:selectOneRadio>
				<f:selectItem itemValue="P" itemLabel="Product " />
				<f:selectItem itemValue="S" itemLabel="Service" />
			</p:selectOneRadio>

			<h:panelGrid columns="2">
				<p:outputLabel value="* #{lbl['lbl.cm.item.name']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.requestCode.itemName}"></p:inputText>

				<p:outputLabel value="* #{lbl['lbl.cm.item.details']}"></p:outputLabel>
				<p:inputText
					value="#{unspscCodeBackingBean.managedBean.requestCode.itemDetail}"></p:inputText>

				<p:outputLabel value="* #{lbl['lbl.cm.type']}"></p:outputLabel>
				<p:inputText></p:inputText>

				<p:outputLabel value="* #{lbl['lbl.cm.brand']}"></p:outputLabel>
				<p:inputText></p:inputText>

				<p:outputLabel value="* #{lbl['lbl.cm.measurement']}"></p:outputLabel>
				<p:inputText></p:inputText>

				<p:outputLabel value="* #{lbl['lbl.cm.color']}"></p:outputLabel>
				<p:inputText></p:inputText>

				<p:commandButton value="#{lbl['lbl.cm.search']}"
					action="#{unspscCodeBackingBean.navigateToSearch}"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.cm.submit']}"
					action="#{unspscCodeBackingBean.submitForRequest}"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.cm.create.unspsc.code']}"
					action="#{unspscCodeBackingBean.createTempCode}"></p:commandButton>
					<p:commandButton value="#{lbl['lbl.cm.create.ext.code']}"
					action="#{unspscCodeBackingBean.createExtCode}"></p:commandButton>

			</h:panelGrid>



		</h:panelGroup>




	</ui:define>


</ui:composition>
