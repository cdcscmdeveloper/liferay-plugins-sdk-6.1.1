<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">



	<ui:define name="contentSection">


		<h:panelGroup id="extensionReviewID">
			<p:outputLabel styleClass="screen-title"
				value="Extension Code Review"></p:outputLabel>
				
			<div style="text-align: right;">
				<ui:repeat var="action"
					value="#{tasklistBackingBean.managedBean.action}">
					<p:commandButton value="#{action}"
						action="#{unspscCodeBackingBean.submitToReviewExt(action)}"></p:commandButton>
				</ui:repeat>
			</div>

			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.code']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.unspsc.title']}"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList[0].tempTitle}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="User"></p:outputLabel></td>
					<td><p:inputText
							value="#{unspscCodeBackingBean.managedBean.tempUser}" /></td>
				</tr>
			</table>

			<p:dataTable style="width:100%;"
				value="#{unspscCodeBackingBean.managedBean.reviewExtCodeList}"
				var="review">
				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.item.name']}
						</f:facet>
					<p:outputLabel value="#{review.itemName}"></p:outputLabel>
				</p:column>
				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.item.description']}
						</f:facet>
					<p:outputLabel value="#{review.itemDetail}"></p:outputLabel>
				</p:column>
				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.type']}
						</f:facet>
					<h:panelGrid columns="2" columnClasses="border0, border0">
						<p:inputText value="#{review.typeName}"
							disabled="#{!review.requestType}"></p:inputText>
						<p:selectOneMenu rendered="#{review.requestType}"
							value="#{review.typeNameDD}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItems
								value="#{unspscCodeBackingBean.managedBean.typeList}" var="type"
								itemLabel="#{type.typeName}" itemValue="#{type.typeName}"></f:selectItems>
						</p:selectOneMenu>
					</h:panelGrid>
				</p:column>
				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.brand']}
						</f:facet>

					<h:panelGrid columns="2" columnClasses="border0, border0">
						<p:inputText value="#{review.brandName}"
							disabled="#{!review.requestBrand}"></p:inputText>
						<p:selectOneMenu rendered="#{review.requestBrand}"
							value="#{review.brandNameDD}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItems
								value="#{unspscCodeBackingBean.managedBean.brandList}"
								var="brand" itemLabel="#{brand.brandName}"
								itemValue="#{brand.brandName}"></f:selectItems>
						</p:selectOneMenu>
					</h:panelGrid>

				</p:column>
				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.measurement']}
						</f:facet>

					<h:panelGrid columns="2" columnClasses="border0, border0">
						<p:inputText value="#{review.measurementName}"
							disabled="#{!review.requestMeasurement}"></p:inputText>
						<p:selectOneMenu rendered="#{review.requestMeasurement}"
							value="#{review.measurementNameDD}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItems
								value="#{unspscCodeBackingBean.managedBean.measurementList}"
								var="measurement" itemLabel="#{measurement.measurementName}"
								itemValue="#{measurement.measurementName}"></f:selectItems>
						</p:selectOneMenu>
					</h:panelGrid>


				</p:column>
				<p:column>
					<f:facet name="header">
							#{lbl['lbl.cm.color']}
						</f:facet>
					<h:panelGrid columns="2" columnClasses="border0, border0">
						<p:inputText value="#{review.colorName}"
							disabled="#{!review.requestColor}"></p:inputText>
						<p:selectOneMenu rendered="#{review.requestColor}"
							value="#{review.colorNameDD}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItems
								value="#{unspscCodeBackingBean.managedBean.colorList}"
								var="color" itemLabel="#{color.colorName}"
								itemValue="#{color.colorName}"></f:selectItems>
						</p:selectOneMenu>
					</h:panelGrid>

				</p:column>


			</p:dataTable>


		</h:panelGroup>



	</ui:define>

</ui:composition>
