<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<h:panelGroup id="taskListID">
	
	

		<div style="text-align: left; float: right;">
			<p:selectOneMenu value="#{tasklistBackingBean.managedBean.tempLoginId}">
				<f:selectItem itemLabel="CURRENT LOGIN" itemValue="0"/>
				<f:selectItem itemLabel="Lailah" itemValue="lailah"/>
				<f:selectItem itemLabel="Roslan" itemValue="roslan"/>
				<f:selectItem itemLabel="Khai" itemValue="khai"/>
				<f:selectItem itemLabel="Alex" itemValue="Alex"/>
				<f:selectItem itemLabel="Tan" itemValue="Tan"/>
				<p:ajax event="change" update="@form" listener="#{tasklistBackingBean.tempFilterLogin}"/>
			</p:selectOneMenu>
			<p:selectOneMenu value="#{tasklistBackingBean.managedBean.status}">
				<f:selectItem itemLabel="ASSIGNED" itemValue="ASSIGNED"></f:selectItem>
				<f:selectItem itemLabel="COMPLETED" itemValue="COMPLETED"></f:selectItem>
				<p:ajax event="change"
							listener="#{tasklistBackingBean.filterStatus}"
							update="taskListID"></p:ajax>
			</p:selectOneMenu>
		</div>
		
		
		


		<p:outputLabel styleClass="screen-title" value="Task List"></p:outputLabel><div class="clear"></div>

		<p:dataTable value="#{tasklistBackingBean.managedBean.taskList}" style="width:780px;"
			var="tasks" paginator="true" rows="10" paginatorPosition="bottom"
			paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
			rowsPerPageTemplate="5,10,15">

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.task.number']}
				</f:facet>
				<p:commandLink value="#{tasks.taskNumber}"
					action="#{tasklistBackingBean.navigateToURL}">
					<f:param name="taskId" value="#{tasks.taskId}" />
				</p:commandLink>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.task.title']}
				</f:facet>
				#{tasks.title}
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.created.date']}
				</f:facet>
				#{tasks.createDate.time}
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.state']}
				</f:facet>
				#{tasks.state}
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.bpm.process']}
				</f:facet>
				#{tasks.process}
			</p:column>


		</p:dataTable>

	</h:panelGroup>




</ui:composition>
