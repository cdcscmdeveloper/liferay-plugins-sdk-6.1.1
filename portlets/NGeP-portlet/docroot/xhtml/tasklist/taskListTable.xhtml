<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<h:panelGroup id="taskListID">

		<div style="text-align: left; float: right;">

			<p:selectOneMenu value="#{tasklistBackingBean.managedBean.status}">
				<f:selectItem itemLabel="ASSIGNED" itemValue="ASSIGNED"></f:selectItem>
				<f:selectItem itemLabel="COMPLETED" itemValue="COMPLETED"></f:selectItem>
				<p:ajax event="change"
							listener="#{tasklistBackingBean.filterStatus}"
							update="taskListID"></p:ajax>
			</p:selectOneMenu>
		</div>


		<p:outputLabel styleClass="screen-title" value="TaskList"></p:outputLabel>

		<p:dataTable value="#{tasklistBackingBean.managedBean.taskList}"
			var="tasks" paginator="true" rows="10"
			paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
			rowsPerPageTemplate="5,10,15">

			<p:column>
				<f:facet name="header">
					<p:outputLabel value="#{lbl['lbl.bpm.task.number']}" />
				</f:facet>
				<p:commandLink value="#{tasks.taskNumber}"
					action="#{tasklistBackingBean.navigateToURL}">
					<f:param name="key" value="key" />
					<f:param name="taskId" value="#{tasks.taskId}" />

				</p:commandLink>
			</p:column>
			<p:column>
				<f:facet name="header">
					<p:outputLabel value="#{lbl['lbl.bpm.task.title']}" />
				</f:facet>
				<p:outputLabel value="#{tasks.title}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<p:outputLabel value="#{lbl['lbl.bpm.created.date']}" />
				</f:facet>
				<p:outputLabel value="#{tasks.createDate.time}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<p:outputLabel value="#{lbl['lbl.bpm.state']}" />
				</f:facet>
				<p:outputLabel value="#{tasks.state}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<p:outputLabel value="#{lbl['lbl.bpm.process']}" />
				</f:facet>
				<p:outputLabel value="#{tasks.process}" />
			</p:column>


		</p:dataTable>

	</h:panelGroup>




</ui:composition>
