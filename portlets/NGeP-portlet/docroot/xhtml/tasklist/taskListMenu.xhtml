<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<h:panelGroup id="taskListMenuId">

		<h:panelGrid columns="2" width="100%">
			<p:panelMenu>

				<p:submenu label="View By">
					<p:menuitem value="Past Day"  action="#{tasklistBackingBean.viewby('DAY')}" update="taskListID"/>
					<p:menuitem value="Past Week" action="#{tasklistBackingBean.viewby('WEEK')}" update="taskListID"/>
					<p:menuitem value="Past Month" action="#{tasklistBackingBean.viewby('MONTH')}" update="taskListID" />
				</p:submenu>


			</p:panelMenu>
		</h:panelGrid>

	</h:panelGroup>

</ui:composition>
