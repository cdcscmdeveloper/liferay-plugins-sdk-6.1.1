<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if test='#{tasklistBackingBean.managedBean.processName eq "UNSPSC Request"}'>
		<ui:include src="reviewUnspscCode.xhtml"></ui:include>
	</c:if>
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Extension Code Request"}'>
		<ui:include src="extensionCodeReview.xhtml"></ui:include>
	</c:if>
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Intiate Normal Contract Order"}'>
		<ui:include src="/xhtml/fl/contractrequest/crBasePage.xhtml"></ui:include>
	</c:if>
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Create Contract Order"}'>
		<ui:include src="/xhtml/fl/contractrequest/crBasePage.xhtml"></ui:include>
	</c:if>
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Create MTO Contract Order"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Create Shipping Instructions"}'>
				<ui:include
					src="/xhtml/fl/shippingInstruction/shippingInstruction.xhtml"></ui:include>
			</c:when>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Review Shipping Instrctions"}'>
				<ui:include
					src="/xhtml/fl/shippingInstruction/shippingInstruction.xhtml"></ui:include>
			</c:when>
			<c:otherwise>
				<ui:include src="/xhtml/fl/contractrequest/crBasePage.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Delvery Order Fullfillment"}'>
		<ui:include src="/xhtml/fl/receivednote/frnBasePage.xhtml"></ui:include>
	</c:if>
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Create Purchase Order"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Acknowledge the Purchase Request"}'>
				<ui:include src="/xhtml/fl/purchaseorder/poBasePage.xhtml"></ui:include>
			</c:when>
			<c:otherwise>
				<ui:include src="/xhtml/fl/purchaserequest/prBasePage.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>
	<!-- Procurement Plan -->
	<c:if test='#{tasklistBackingBean.managedBean.processName eq "Budget Endorsement"}'>
		<ui:include src="/xhtml/pp/budgetallocation/budgetAllocation.xhtml"></ui:include>
	</c:if>


</ui:composition>
