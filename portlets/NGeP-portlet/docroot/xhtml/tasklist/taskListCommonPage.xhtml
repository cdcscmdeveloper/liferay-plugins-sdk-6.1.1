<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "UNSPSC Code Request"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Create Temporary Code"}'>

				<ui:include
					src="/xhtml/cm/codification/reviewBeforeCreateTempCode.xhtml"></ui:include>
			</c:when>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Create Extension Code"}'>

				<ui:include
					src="/xhtml/cm/codification/reviewBeforeCreateExtCode.xhtml"></ui:include>
			</c:when>
			<c:otherwise>
				<ui:include src="reviewUnspscCode.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Contract Creation"}'>
		<ui:include
			src="/xhtml/ct/fulfilmentdetails/creation/fulfilment.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Agreement Creation"}'>
		<ui:include
			src="/xhtml/ct/agreement/shared/sidemenu/agreementTab.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Bank Account Change Request"}'>
		<ui:include src="/xhtml/ct/supplier/bank/tabView.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Factoring Company Request"}'>
		<ui:include src="/xhtml/ct/supplier/factoring/tabView.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Contract Activation Suspension Request"}'>
		<ui:include
			src="/xhtml/ct/fulfilmentdetails/suspension/suspendTab.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Contract Amendment Request"}'>
		<ui:include src="/xhtml/ct/fulfilmentdetails/amendment/amendmentTab.xhtml"></ui:include>
	</c:if>
	
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Contract Termination"}'>
		<ui:include src="/xhtml/ct/fulfilmentdetails/termination/terminationTab.xhtml"></ui:include>
	</c:if>
	
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Extension Code Request"}'>
		<ui:include src="extensionCodeReview.xhtml"></ui:include>
	</c:if>


	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Extension Code Maintenance"}'>
		<ui:include src="reviewDeleteExtension.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Contract Request Initiation"}'>
		<ui:include src="/xhtml/fl/contractrequest/crBasePage.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Contract Request Creation"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Acknowledge Contract Order"}'>
				<ui:include src="/xhtml/fl/contractorder/coBasePage.xhtml"></ui:include>
			</c:when>
			<c:otherwise>
				<ui:include src="/xhtml/fl/contractrequest/crBasePage.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "MTO Contract Request Creation"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Create Shipping Instructions"}'>
				<ui:include
					src="/xhtml/fl/shippingInstruction/shippingInstruction.xhtml"></ui:include>
			</c:when>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Review Shipping Instructions"}'>
				<ui:include
					src="/xhtml/fl/shippingInstruction/shippingInstruction.xhtml"></ui:include>
			</c:when>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Revise Shipping Instructions"}'>
				<ui:include
					src="/xhtml/fl/shippingInstruction/shippingInstruction.xhtml"></ui:include>
			</c:when>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Acknowledge MTO Contract Order"}'>
				<ui:include src="/xhtml/fl/contractorder/coBasePage.xhtml"></ui:include>
			</c:when>
			<c:otherwise>
				<ui:include src="/xhtml/fl/contractrequest/crBasePage.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Delvery Order Fullfillment"}'>
		<ui:include src="/xhtml/fl/receivednote/frnBasePage.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Purchase Request Creation"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Acknowledge Purchase Request"}'>
				<ui:include src="/xhtml/fl/purchaseorder/poBasePage.xhtml"></ui:include>
			</c:when>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Review Rejected Acknowledgement"}'>
				<ui:include src="/xhtml/fl/purchaseorder/poBasePage.xhtml"></ui:include>
			</c:when>
			<c:otherwise>
				<ui:include src="/xhtml/fl/purchaserequest/prBasePage.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Stop Fullfillment Request"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Review Stop Fullfillment Request"}'>
				<ui:include src="/xhtml/fl/contractorder/coBasePage.xhtml"></ui:include>
			</c:when>
		</c:choose>
	</c:if>
	<!-- Procurement Plan -->
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Budget Endorsement"}'>
		<ui:include src="/xhtml/pp/budgetallocation/budgetAllocation.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Plan Preparation"}'>
		<ui:include src="/xhtml/pp/procurementplan/procurementPlan.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Invoice and Payment Creation"}'>
		<c:choose>
			<c:when
				test='#{tasklistBackingBean.managedBean.taskName eq "Create Invoice"}'>
				<ui:include src="/xhtml/fl/invoice/invBasePage.xhtml"></ui:include>
			</c:when>
			<c:otherwise>

				<ui:include src="/xhtml/fl/paymentmatch/pmBasePage.xhtml"></ui:include>
			</c:otherwise>
		</c:choose>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "DAN Generation"}'>
		<ui:include src="/xhtml/fl/invoice/DAN.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "MOF Supplier Registration"}'>
		<ui:include src="commonSM.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "MOF Account Maintain"}'>
		<ui:include src="commonSM.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "MOF Registration Cancellation"}'>
		<ui:include src="commonSM.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Processing Officer Manage"}'>
		<ui:include src="commonSM.xhtml"></ui:include>
	</c:if>

	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Site Visit Manage"}'>
		<ui:include src="commonSM.xhtml"></ui:include>
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Circular Contract Maintenance"}'>
		<ui:include src="#{tasklistBackingBean.managedBean.pageUrl}" />
	</c:if>
	<c:if
		test='#{tasklistBackingBean.managedBean.processName eq "Circular Contract Cancellation"}'>
		<ui:include src="/xhtml/ct/circular/panel/cancelCircularBase.xhtml" />
	</c:if>

</ui:composition>
