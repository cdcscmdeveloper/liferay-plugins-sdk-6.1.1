<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<f:facet name="{EditablePageLink}">
		<p:commandButton id="firstBtn"
			styleClass="ui-paginator-first-ed ui-state-default ui-corner-all"
			icon="ui-icon ui-icon-seek-first" partialSubmit="true"
			process="questionTbl" update="questionTbl"
			action="#{dataTableBackingBean.navToFirstPage(templateSpecId)}" />
		<p:commandButton id="prevBtn"
			styleClass="ui-paginator-prev-ed ui-state-default ui-corner-all"
			icon="ui-icon ui-icon-seek-prev" partialSubmit="true"
			process="questionTbl" update="questionTbl"
			action="#{dataTableBackingBean.navToPrevPage(templateSpecId)}" />
		<p:commandButton id="nextBtn"
			styleClass="ui-paginator-next-ed ui-state-default ui-corner-all"
			icon="ui-icon ui-icon-seek-next" partialSubmit="true"
			process="questionTbl" update="questionTbl"
			action="#{dataTableBackingBean.navToNextPage(templateSpecId)}" />
		<p:commandButton id="lastBtn"
			styleClass="ui-paginator-last-ed ui-state-default ui-corner-all"
			icon="ui-icon ui-icon-seek-end" partialSubmit="true"
			process="questionTbl" update="questionTbl"
			action="#{dataTableBackingBean.navToLastPage(templateSpecId)}" />
	</f:facet>
	<ac:paginator for="questionTbl" />
	<f:attribute name="paginatorTemplate"
		value="#{lbl['lbl.datatable.paginator.page']} {CurrentPageReport} {EditablePageLink}" />

</ui:composition>
