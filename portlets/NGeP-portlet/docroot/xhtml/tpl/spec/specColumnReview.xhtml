<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:50px;" rendered="#{isSpecTypeTechnical}">
		<h:outputLabel value="Mandatory" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:selectBooleanCheckbox value="#{question.clAnswerRequired}" rendered="#{!isQuestionTypeHeader}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:155px;">
		<h:outputLabel value="#{isSpecTypeFinancial ? 'Total Amount' : 'Answer'}" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText size="18" 
			rendered="#{!isQuestionTypeHeader}" disabled="true" />	
		<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;" id="scoringBtn" rendered="#{!isQuestionTypeHeader}" disabled="#{(isAnswerTypeText)}" 
			oncomplete="scoringSetting.show();"
			partialSubmit="true" process="@this" update="@this">
			<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.selectedIndex}" value="#{row}" />
		</p:commandButton>
	</p:column>
	<p:column style="#{columnStyle}width:80px;" rendered="#{isEstCostReq and isSpecTypeFinancial}">
		<h:outputLabel value="Estimate Cost" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="10" dir="rtl" value="#{question.clEstimatedCost}" rendered="#{!isQuestionTypeHeader}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Comment" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText size="19" value="#{question.clReviewRemark}" rendered="#{!isQuestionTypeHeader}" />
	</p:column>
</ui:composition>
