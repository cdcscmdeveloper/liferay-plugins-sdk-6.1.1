<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:50px;" rendered="#{isSpecTypeTechnical}" headerText="#{lbl['lbl.sc.tpl.mandatory']}">
		<p:selectBooleanCheckbox value="#{question.clAnswerRequired}" disabled="true" />
	</p:column>
	<p:column style="width:155px;" headerText="#{lbl[isSpecTypeFinancial ? 'lbl.sc.tpl.total.amount' : 'lbl.sc.tpl.answer']}">
		<p:inputText size="18" disabled="true" />	
		<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;" id="scoringBtn" disabled="#{(isAnswerTypeText)}" 
			oncomplete="scoringSetting.show();"
			partialSubmit="true" process="@this" update="@this">
			<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.selectedIndex}" value="#{row}" />
		</p:commandButton>
	</p:column>
	<p:column style="width:80px;" rendered="#{isEstCostReq and isSpecTypeFinancial}" headerText="#{lbl['lbl.sc.tpl.estimate.cost']}">
		<p:inputText style="min-width:0px !important" size="10" dir="rtl" value="#{question.clEstimatedCost}" disabled="true" />
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.comment']}">
		<p:inputText size="19" value="#{question.clReviewRemark}" />
	</p:column>
</ui:composition>
