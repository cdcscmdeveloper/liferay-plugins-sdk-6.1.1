<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:dialog id="zoneLocPopup" widgetVar="zoneLocPopup" header="#{lbl['lbl.tpl.spec.zone.details']}" modal="true" width="350" height="200">

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" valign="top">
				<p:outputLabel value="#{lbl['lbl.tpl.spec.zone']}" />
				<ac:iconTooltip value="#{lbl['lbl.tpl.spec.zone.tooltip']}" />
			</td>
			<td width="80%">
				<p:inputText disabled="true"
					value="#{zoneLocationBackingBean.managedBean.tplSpecZoneDtl.zoneName}"
					size="30" />
			</td>
		</tr>
		<tr>
			<td colspan="2">
				<p:panel header="#{lbl['lbl.tpl.spec.location.name']}">
					<p:tree id="treeZoneLoc"
						value="#{zoneLocationBackingBean.managedBean.locationTree}"
						var="location">
						
						<p:treeNode type="state">
							#{location.pmState.stateName}
						</p:treeNode>
						
						<p:treeNode type="division">
							#{location.pmDivision.divisionName}
						</p:treeNode>
						
						<p:treeNode type="district">
							#{location.pmDistrict.districtName}
						</p:treeNode>
						
						<p:treeNode type="city">
							#{location.pmCity.cityName}
						</p:treeNode>
					</p:tree>
				</p:panel>
			</td>
		</tr>
		</table>

	</p:dialog>
</ui:composition>
