<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
			 
    <p:dataTable var="tplSpecZoneOffer" id="specZoneTbl" rowIndexVar="rowIndex" value="#{question.tplSpecZoneQties}"

	        <p:column headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}">
	        	<h:outputText value="#{tplSpecZoneOffer.tplSpecZoneDtl.zoneName}" />
	        </p:column>
	       
			<p:column>
				<h:selectBooleanCheckbox value="#{tplSpecZoneOffer.offer}" checked = "checked" />
	        </p:column>

        <f:facet name="footer"/>
    </p:dataTable>   
	
</ui:composition>
