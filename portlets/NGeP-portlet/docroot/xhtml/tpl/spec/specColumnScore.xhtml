<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:70px;text-align:right;" rendered="#{isEstCostReq and isSpecTypeFinancial}" headerText="#{lbl['lbl.tpl.spec.content.estimate.cost']}">
		<h:outputText value="#{question.clEstimatedCost}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</h:outputText>
	</p:column>
	<p:column style="width:70px;" headerText="#{lbl['lbl.tpl.spec.content.system.score']}">
		<p:inputText style="min-width:0px !important;width:96%;" dir="rtl" value="#{tplSpecAnswer.autoScore}"
			rendered="#{isScoring}" disabled="true">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
		</p:inputText>
	</p:column>
	<p:column style="width:50px;" headerText="#{lbl['lbl.tpl.spec.content.user.score']}">
		<p:inputText style="min-width:0px !important;width:96%;" dir="rtl" value="#{tplSpecAnswer.userScore}"
			rendered="#{!isScoring}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
		</p:inputText>
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.tpl.spec.content.comment']}">
		<p:inputTextarea style="width:96%;" value="#{tplSpecAnswer.userRemark}" rows="1" />
	</p:column>
</ui:composition>
