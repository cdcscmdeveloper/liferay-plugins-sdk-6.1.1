<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:60px; text-align:right;"  
		rendered="#{templateSpecBackingBean.hasWeightage(templateSpecBean)}">
		
		<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.weightage}" rendered="#{tplSpecAnswer.tplSpecQuestion.weightageReq}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
		</h:outputText>
	</p:column>
	<ui:remove>#29187 Start Vinod Added condition for width</ui:remove>
	<p:column style="width:#{isManSpecAndCompliance ? '10%' : '50px'}; white-space:normal; text-align:right;"  rendered="#{isScoringReq}">
	<ui:remove>#29187 End Vinod</ui:remove>
		<h:panelGroup rendered="#{isScoring and !isRepeated}">
			<h:outputText value="#{tplSpecAnswer.autoScore}">
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
			</h:outputText>
			 / 
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}">
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<p:column style="width:50px; white-space:normal; text-align:right;"  rendered="#{isScoringReq}">
		
		<h:panelGroup rendered="#{!empty question.scoreTypeCode and !isScoring and !isRepeated}">
			<ui:remove>#29187 Start Vinod Added Compliance checking in disable and removed required</ui:remove>
			<p:inputText id="userScore" style="min-width:0px !important;width:30px; text-align:right;"
				value="#{tplSpecAnswer.userScore}"
				required="false" maxlength="14"
				disabled="#{(tplSpecAnswer.compliance ne null and !tplSpecAnswer.compliance)}"
				label="#{lbl['lbl.tpl.spec.content.user.score']}">
				<ui:remove>#29187 End Vinod</ui:remove>
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}"
					maxIntegerDigits="14" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
				<f:attribute name="min" value="0" />
				<f:attribute name="max" value="#{(tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)).toString()}" />
				<p:ajax partialSubmit="true" process="@this" update="@this, userScoreMsg, @(.calcScore)" />
			</p:inputText>
			 / 
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}">
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
			</h:outputText>
			<p:message id="userScoreMsg" for="userScore" display="icon" />
		</h:panelGroup>
	</p:column>
	<ui:remove>#29187 Start Vinod</ui:remove>
	<p:column style="width:10%;" rendered="#{isManSpecAndCompliance}">
		<ui:fragment
			rendered="#{isSpecTypeTechnical 
			and (tplSpecAnswer.notApplicable and tplSpecAnswer.notOfferAll or tplSpecAnswer.notOfferAll)}">
			<h:outputText value="#{lbl['lbl.txt.na']}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification 
				and tplSpecAnswer.tplSpecQuestion.mandatorySpec}" />
		</ui:fragment>
		<ui:fragment
			rendered="#{isSpecTypeTechnical 
			and !tplSpecAnswer.notOfferAll }">
			<h:selectOneMenu id="specCompliance"
				label="#{lbl['lbl.sc.tec.compliance']}"
				value="#{tplSpecAnswer.compliance}"
				valueChangeListener="#{templateSpecBackingBean.itemComplianceChangeControl}"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification 
				and tplSpecAnswer.tplSpecQuestion.mandatorySpec}">
				<f:selectItems
					value="#{templateSpecBackingBean.getMandatorySpecAndComplianceDropdownValues(true)}" />
				<p:ajax event="change" process="@this" partialSubmit="true"
					update="@([id$=questionTbl])"
					listener="#{templateSpecBackingBean.onchangeCompliance(tplSpecAnswer)}" />
			</h:selectOneMenu>
			<h:outputText value=""
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification  
				and !tplSpecAnswer.tplSpecQuestion.mandatorySpec}" />
			<p:message id="specComplianceMsg" for="specCompliance" display="icon" />
		</ui:fragment>
	</p:column>
	<ui:remove>#29187 End Vinod</ui:remove>
	<ui:remove>#29187 Start Vinod Added condition for width</ui:remove>
	<p:column style="width:#{isManSpecAndCompliance ? '10%' : '130px'};">	
	<ui:remove>#29187 End Vinod</ui:remove>
		<p:inputTextarea style="width:calc(100% - 15px);" value="#{tplSpecAnswer.userRemark}" rows="1" maxlength="500" onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);" onmouseout="limitTextArea(this,500);"/>
	</p:column>
</ui:composition>
