<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:60px; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.scoring.settings.weightage']}" 
		rendered="#{templateSpecBackingBean.hasWeightage(templateSpecBean)}">
		
		<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.weightage}" rendered="#{tplSpecAnswer.tplSpecQuestion.weightageReq}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
		</h:outputText>
	</p:column>
	<p:column style="width:50px; white-space:normal; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.system.score']}" rendered="#{isScoringReq}">
		<h:panelGroup rendered="#{isScoring and !isRepeated}">
			<h:outputText value="#{tplSpecAnswer.autoScore}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
			 / 
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<p:column style="width:50px; white-space:normal; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.user.score']}" rendered="#{isScoringReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"/>
		</f:facet>
		<h:panelGroup rendered="#{!empty question.scoreTypeCode and !isScoring and !isRepeated}">
			<p:inputText id="userScore" style="min-width:0px !important;width:30px;" styleClass="ppNumericAlign"
				value="#{tplSpecAnswer.userScore}"
				required="true" maxlength="14"
				label="#{lbl['lbl.tpl.spec.content.user.score']}">
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" maxIntegerDigits="14" integerOnly="true" />
				<f:attribute name="min" value="0" />
				<f:attribute name="max" value="#{(tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)).toString()}" />
				<p:ajax partialSubmit="true" process="@this" update="@this, userScoreMsg" />
			</p:inputText>
			 / 
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
			<p:message id="userScoreMsg" for="userScore" display="icon" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.tpl.spec.content.comment']}">
		<p:inputTextarea style="width:118px;" value="#{tplSpecAnswer.userRemark}" rows="1" maxlength="500" />
	</p:column>
</ui:composition>
