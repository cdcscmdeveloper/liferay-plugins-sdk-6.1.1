<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:60px; text-align:right;"  
		rendered="#{templateSpecBackingBean.hasWeightage(templateSpecBean)}">
		
		<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.weightage}" rendered="#{tplSpecAnswer.tplSpecQuestion.weightageReq}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
		</h:outputText>
	</p:column>

	<!-- #25138 #21695 - start -->
	<p:column style="width:50px; white-space:normal; text-align:right;"
		rendered="#{isScoringReq}">
		<h:panelGroup rendered="#{isScoring and !isRepeated}">
			<h:outputText
				rendered="#{isSpecTypeFinancial and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty eq 0 or isSpecTypeFinancial and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity eq 0}"
				style="width:calc(100% - 15px);"
				value="#{isSpecTypeFinancial and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty eq 0 or isSpecTypeFinancial and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity eq 0 ? lbl['lbl.sc.no.available'] : tplSpecAnswer.userRemark}"
				rows="1" maxlength="500" onkeyup="limitTextArea(this,500);"
				onkeydown="limitTextArea(this,500);"
				onmouseout="limitTextArea(this,500);">
			</h:outputText>

			<h:outputText value="#{tplSpecAnswer.autoScore}"
				rendered="#{isSpecTypeFinancial and isZonal and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or 
			isSpecTypeFinancial and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0}">
				<!-- #35293 -Start- -->
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<!-- #35293 -End- -->
			</h:outputText>

			<h:outputText value="#{tplSpecAnswer.autoScore}"
				rendered="#{isSpecTypeTechnical and isZonal and !tplSpecAnswer.notOfferAll or 
			isSpecTypeTechnical and !isZonal and !tplSpecAnswer.notOfferAll}">
				<!-- #35293 -Start- -->
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<!-- #35293 -End- -->
			</h:outputText>

			<!-- Bug #33991 Start-->
			<h:outputText value="0"
				rendered="#{isSpecTypeTechnical and tplSpecAnswer.notOfferAll or 
							isSpecTypeTechnical and tplSpecAnswer.autoScore eq null}">
				<!-- Bug #33991 End-->
				<!-- #35293 -Start- -->
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
			    <!-- #35293 -End- -->
			</h:outputText>

			<h:outputText value="/"
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq 'S' or tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0}"></h:outputText>

			<h:outputText
				value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
				rendered="#{isSpecTypeTechnical and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or isSpecTypeTechnical and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 or isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.questionType eq 'S'}">
				<!-- #35293 -Start- -->
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<!-- #35293 -End- -->
			</h:outputText>
			<c:if
				test="#{isZonal and isSpecTypeFinancial and evaluationBackingBean.managedBean.speczonedtlReq}">
				<h:outputText
					value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
					rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0}">
					<!-- #35293 -Start- -->
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					<!-- #35293 -End- -->
				</h:outputText>
			</c:if>
			<c:if
				test="#{isZonal and isSpecTypeFinancial and !evaluationBackingBean.managedBean.speczonedtlReq}">
				<h:outputText
					value="#{tplSpecAnswer.tplSpecZoneQty.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
					rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0}">
					<!-- #35293 -Start- -->
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					<!-- #35293 -End- -->
				</h:outputText>
			</c:if>
			<c:if test="#{!isZonal and isSpecTypeFinancial}">
				<h:outputText
					value="#{tplSpecAnswer.tplSpecQuestion.maxScore* (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
					rendered="#{tplSpecAnswer.tplSpecQuestion.clQuantity ne 0}">
					<!-- #35293 -Start- -->
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					<!-- #35293 -End- -->
				</h:outputText>
			</c:if>
			<ui:remove>
				<!-- #32334,#29021 -start-->
			</ui:remove>
			<ac:toggleRate update="@([id$=questionTbl])" show="#{isSpecTypeTechnical and !evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}"
				disabled="#{evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.notOfferAll}"
				value="#{tplSpecAnswer.rating}"
				tooltip="#{lbl['lbl.sc.tec.rating.tooltip']}" />
			<ui:remove>
				<!-- #32334,#29021-end -->
			</ui:remove>

		</h:panelGroup>
	</p:column>
	<!-- #25138 #21695 - end -->

	<ui:remove>
		Bug #28312
		ADDED : disabled="#{evaluationBackingBean.managedBean.readOnly}
	</ui:remove>
	<!-- #25138, #21695 -start- -->
	<p:column style="width:50px; white-space:normal; text-align:right;"
		rendered="#{isScoringReq}">
		<c:when
			test="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty eq 0 and tplSpecAnswer.tplSpecQuestion.questionType ne 'S'
		or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity eq 0 and tplSpecAnswer.tplSpecQuestion.questionType ne 'S'}">

			<h:panelGroup
				rendered="#{!empty question.scoreTypeCode and !isScoring and !isRepeated}">
				<h:outputText
					disabled="#{tplSpecAnswer.ratePerUom eq 0 or evaluationBackingBean.managedBean.readOnly}"
					rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty eq 0}"
					style="width:calc(100% - 15px);"
					value="#{isSpecTypeFinancial and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty eq 0 or isSpecTypeFinancial and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity eq 0 ? lbl['lbl.sc.no.available'] : tplSpecAnswer.userRemark}"
					rows="1" maxlength="500" onkeyup="limitTextArea(this,500);"
					onkeydown="limitTextArea(this,500);"
					onmouseout="limitTextArea(this,500);">
				</h:outputText>
			</h:panelGroup>
		</c:when>
		<c:otherwise>
		<!-- #25138, #21695 -end- -->
		<h:panelGroup rendered="#{!empty question.scoreTypeCode and !isScoring and !isRepeated}">
				<!-- #25138, #21695 -start- --><!-- #28784 - start -->
				<p:inputText id="userScore"
					style="min-width:0px !important;width:30px; text-align:right;"
					value="#{tplSpecAnswer.userScore}" required="false" maxlength="14"
					label="#{lbl['lbl.tpl.spec.content.user.score']}"
					rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null and (isZonal and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 or tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification)}"
					disabled="#{evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.ratePerUom eq 0 or tplSpecAnswer.notOfferAll}">
					<!-- #28784 -end- --><!-- #25138, #21695 -end- -->	
				<!-- #35293 -Start- -->		
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" maxIntegerDigits="14"/>
				<!-- #35293 -End- -->
				<f:attribute name="min" value="0" />
				<f:attribute name="max" value="#{(tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)).toString()}" />
				<p:ajax partialSubmit="true" process="@this" update="@this, userScoreMsg, @(.calcScore)" />
				</p:inputText>
			
				<!-- #25138, #21695 -start- --><!-- #28784 -start- -->
				<h:outputText value="/"
					rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null and (tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification or tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0)}"></h:outputText>
				<h:outputText
					value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
					rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null and (isSpecTypeTechnical and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or isSpecTypeTechnical and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 or isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification)}">
					<!-- #28784 -end- --><!-- #25138, #21695 -end- -->
				<!-- #35293 -Start- -->
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<!-- #35293 -End- -->
				</h:outputText>

				<!-- #25138 - start -->
				<c:if
					test="#{isZonal and isSpecTypeFinancial and evaluationBackingBean.managedBean.speczonedtlReq}">
					<h:outputText
						value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
						rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0}">
						<!-- #35293 -Start- -->
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
						<!-- #35293 -End- -->
					</h:outputText>
				</c:if>
				<c:if
					test="#{isZonal and isSpecTypeFinancial and !evaluationBackingBean.managedBean.speczonedtlReq}">
					<h:outputText
						value="#{tplSpecAnswer.tplSpecZoneQty.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
						rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0}">
						<!-- #35293 -Start- -->
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
						<!-- #35293 -End- -->
					</h:outputText>
				</c:if>
				<!-- #25138 - end -->

				<c:if test="#{!isZonal and isSpecTypeFinancial}">
				<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore* (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
								rendered="#{tplSpecAnswer.tplSpecQuestion.clQuantity ne 0}">
					<!-- #35293 -Start- -->
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					<!-- #35293 -End- -->
				</h:outputText>
			</c:if>
			<p:message id="userScoreMsg" for="userScore" display="icon" />
				<ui:remove><!--#29021-start--></ui:remove>
				<ac:toggleRate update="@([id$=questionTbl])" show="#{isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.maxScore ne null and !evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}"
					disabled="#{evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.ratePerUom eq 0 or tplSpecAnswer.notOfferAll}"
					value="#{tplSpecAnswer.rating}"
					tooltip="#{lbl['lbl.sc.tec.rating.tooltip']}" />
				<ui:remove><!--#29021-end--></ui:remove>
			</h:panelGroup>
		<!-- #25138, #21695 -start- -->
		</c:otherwise>
		<!-- #25138, #21695 -end- -->
	</p:column>

	<!-- #31537 related #21695 Farid START 28/8/2021 -->
	<p:column style="width:130px;">
		<p:inputTextarea
			disabled="#{tplSpecAnswer.ratePerUom eq 0 or evaluationBackingBean.managedBean.readOnly}"
			rendered="#{isSpecTypeFinancial and isZonal and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 and tplSpecAnswer.ratePerUom eq 0 or isSpecTypeFinancial and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 and tplSpecAnswer.ratePerUom eq 0}"
			style="width:calc(100% - 15px);"
			value="#{isZonal and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 and tplSpecAnswer.ratePerUom eq 0 or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 and tplSpecAnswer.ratePerUom eq 0 ? lbl['lbl.sc.spec.score.po'] : tplSpecAnswer.userRemark}"
			rows="1" maxlength="500" onkeyup="limitTextArea(this,500);"
			onkeydown="limitTextArea(this,500);"
			onmouseout="limitTextArea(this,500);">
			<p:ajax event="change" process="@this" partialSubmit="true"
				update="@this" />
		</p:inputTextarea>

		<p:inputTextarea
			disabled="#{evaluationBackingBean.managedBean.readOnly}"
			rendered="#{isZonal and isSpecTypeFinancial and tplSpecAnswer.ratePerUom ne 0 or !isZonal and isSpecTypeFinancial and tplSpecAnswer.ratePerUom ne 0}"
			style="width:calc(100% - 15px);" value="#{tplSpecAnswer.userRemark}"
			rows="1" maxlength="500" onkeyup="limitTextArea(this,500);"
			onkeydown="limitTextArea(this,500);"
			onmouseout="limitTextArea(this,500);">
			<p:ajax event="change" process="@this" partialSubmit="true"
				update="@this" />
		</p:inputTextarea>

		<p:inputTextarea
			disabled="#{evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.notOfferAll}"
			rendered="#{isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.questionType eq 'S' and tplSpecAnswer.notOfferAll and !tplSpecAnswer.notApplicable}"
			style="width:calc(100% - 15px);"
			value="#{lbl['lbl.sc.spec.score.po']}" rows="1" maxlength="500"
			onkeyup="limitTextArea(this,500);"
			onkeydown="limitTextArea(this,500);"
			onmouseout="limitTextArea(this,500);">
			<p:ajax event="change" process="@this" partialSubmit="true"
				update="@this" />
		</p:inputTextarea>

		<p:inputTextarea
			disabled="#{evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.notOfferAll}"
			rendered="#{isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.questionType eq 'S' and tplSpecAnswer.notApplicable and tplSpecAnswer.notOfferAll}"
			style="width:calc(100% - 15px);"
			value="#{lbl['lbl.sc.not.applicable']}" rows="1" maxlength="500"
			onkeyup="limitTextArea(this,500);"
			onkeydown="limitTextArea(this,500);"
			onmouseout="limitTextArea(this,500);">
			<p:ajax event="change" process="@this" partialSubmit="true"
				update="@this" />
		</p:inputTextarea>

		<p:inputTextarea
			disabled="#{evaluationBackingBean.managedBean.readOnly}"
			rendered="#{isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.questionType eq 'S' and !tplSpecAnswer.notOfferAll}"
			style="width:calc(100% - 15px);" value="#{tplSpecAnswer.userRemark}"
			rows="1" maxlength="500" onkeyup="limitTextArea(this,500);"
			onkeydown="limitTextArea(this,500);"
			onmouseout="limitTextArea(this,500);">
			<p:ajax event="change" process="@this" partialSubmit="true"
				update="@this" />
		</p:inputTextarea>
	</p:column>
	<!--#31537 related to #21695 Farid end 28/8/2021-->
</ui:composition>
