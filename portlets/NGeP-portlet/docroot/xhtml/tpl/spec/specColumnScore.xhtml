<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:60px; text-align:right;"  
		rendered="#{templateSpecBackingBean.hasWeightage(templateSpecBean)}">
		
		<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.weightage}" rendered="#{tplSpecAnswer.tplSpecQuestion.weightageReq}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
		</h:outputText>
	</p:column>
	<p:column style="width:50px; white-space:normal; text-align:right;"  rendered="#{isScoringReq}">
		<h:panelGroup rendered="#{isScoring and !isRepeated}">
			<h:outputText value="#{tplSpecAnswer.autoScore}">
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
			</h:outputText>
			 / 
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}">
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<p:column style="width:50px; white-space:normal; text-align:right;"  rendered="#{isScoringReq}">
		
		<h:panelGroup rendered="#{!empty question.scoreTypeCode and !isScoring and !isRepeated}">
			<ui:remove><!-- 28784 - Start --></ui:remove>
			<p:inputText id="userScore" style="min-width:0px !important;width:30px; text-align:right;"
				value="#{tplSpecAnswer.userScore}"
				required="false" maxlength="14"
				label="#{lbl['lbl.tpl.spec.content.user.score']}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null}"
				disabled="#{evaluationBackingBean.isStatusAfterDemo()
					or (evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected
					or evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}">
			<ui:remove><!-- 28784 - End -->21692</ui:remove>
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}"
					maxIntegerDigits="14" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
				<f:attribute name="min" value="0" />
				<f:attribute name="max" value="#{(tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)).toString()}" />
				<p:ajax partialSubmit="true" process="@this" update="@this, userScoreMsg, @(.calcScore)" />
			</p:inputText>
			<ui:remove><!-- 28784 - Start --></ui:remove>
			<h:outputText value="/"
				rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null}"></h:outputText>
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null}">
			<ui:remove><!-- 28784 - End --></ui:remove>
				<ui:remove><!-- 35384,35293 -start- --></ui:remove>
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				<ui:remove><!-- 35384,35293 -end- --></ui:remove>
			</h:outputText>
			<p:message id="userScoreMsg" for="userScore" display="icon" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:130px;">
		<ui:remove>21692 - Start</ui:remove>
		<p:inputTextarea style="width:calc(100% - 15px);"
			value="#{tplSpecAnswer.userRemark}" rows="1" maxlength="500" onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);"
			rendered="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq null
					or (evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod ne SourcingConstants.extendProposalValidityPeriodRejected
					and evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod ne SourcingConstants.extendProposalValidityPeriodNotQualified)}"
			onmouseout="limitTextArea(this,500);"/>
		<p:inputTextarea style="width:calc(100% - 15px);"
			value="#{lbl['lbl.sc.qt.proposal.evaluation.remark']}" rows="1" maxlength="500" onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);"
			rendered="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod ne null
					and (evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected
					or evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}"
			disabled="true"
			onmouseout="limitTextArea(this,500);"/>
		<ui:remove>21692 - End</ui:remove>
	</p:column>
</ui:composition>
