<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:70px;" rendered="#{isEstCostReq and isSpecTypeFinancial}" headerText="#{lbl['lbl.sc.tpl.estimate.cost']}">
		<p:inputText style="min-width:0px !important" size="10" dir="rtl" value="#{question.clEstimatedCost}" disabled="true" />
	</p:column>
	<p:column style="width:70px;" headerText="#{lbl['lbl.sc.tpl.system.score']}">
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{tplSpecAnswer.autoScore}"
			rendered="#{isScoring}" disabled="true" />
	</p:column>
	<p:column style="width:50px;" headerText="#{lbl['lbl.sc.tpl.user.score']}">
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{tplSpecAnswer.userScore}"
			rendered="#{!isScoring}" />
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.comment']}">
		<p:inputText size="19" value="#{tplSpecAnswer.userRemark}" />
	</p:column>
</ui:composition>
