	<p:column style="width:50px; white-space:normal; text-align:right;"  rendered="#{isScoringReq}">
	

		<c:when test="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty eq 0 and tplSpecAnswer.tplSpecQuestion.questionType ne 'S'

		<h:panelGroup rendered="#{!empty question.scoreTypeCode and !isScoring and !isRepeated}">
			  	<h:outputText disabled="#{tplSpecAnswer.ratePerUom eq 0 or evaluationBackingBean.managedBean.readOnly or (evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected or evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}"

				</h:outputText><ui:remove>#21692</ui:remove>
		</h:panelGroup>
		</c:when>

				value="#{tplSpecAnswer.userScore}"
				required="true" maxlength="14"
				label="#{lbl['lbl.tpl.spec.content.user.score']}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null and (isZonal and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 or tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification)}"
				disabled="#{(tplSpecAnswer.compliance ne null and !tplSpecAnswer.compliance) or evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.ratePerUom eq 0 or tplSpecAnswer.notOfferAll or (evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected or evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}"><ui:remove>#21692</ui:remove><!-- #29187 Vinod Added Compliance checking -->

				<f:attribute name="min" value="0" />
				<f:attribute name="max" value="#{(tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)).toString()}" />
				<p:ajax partialSubmit="true" process="@this" update="@this, userScoreMsg, @(.calcScore)" />
			</p:inputText>
			 <h:outputText value="/" rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null and (tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification or tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0)}"></h:outputText> 
			<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
							rendered="#{tplSpecAnswer.tplSpecQuestion.maxScore ne null and (isSpecTypeTechnical and tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0 or isSpecTypeTechnical and !isZonal and tplSpecAnswer.tplSpecQuestion.clQuantity ne 0 or isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
			</h:outputText>
			<ui:remove><!-- #28784 - end --></ui:remove>
			<!-- #25138 - start -->
			<c:if test="#{isZonal and isSpecTypeFinancial and evaluationBackingBean.managedBean.speczonedtlReq}">
				<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
								rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0}">

				</h:outputText>
			</c:if>
			<c:if test="#{isZonal and isSpecTypeFinancial and !evaluationBackingBean.managedBean.speczonedtlReq}">
				<h:outputText value="#{tplSpecAnswer.tplSpecZoneQty.maxScore * (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
								rendered="#{tplSpecAnswer.tplSpecZoneQty ne null and tplSpecAnswer.tplSpecZoneQty.qty ne 0}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				</h:outputText>
			</c:if>
			<!-- #25138 - end -->
			<c:if test="#{!isZonal and isSpecTypeFinancial}">
				<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.maxScore* (tplSpecAnswer.tplSpecQuestion.weightageReq ? tplSpecAnswer.tplSpecQuestion.weightage : 1)}"
								rendered="#{tplSpecAnswer.tplSpecQuestion.clQuantity ne 0}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
				</h:outputText>
			</c:if>
			<p:message id="userScoreMsg" for="userScore" display="icon" />
			<ui:remove><!--#29021-start--></ui:remove>
			<ui:remove><!--#28784 - Start--></ui:remove>
			<ac:toggleRate update="@([id$=questionTbl])" show="#{isSpecTypeTechnical and tplSpecAnswer.tplSpecQuestion.maxScore ne null and !evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}" disabled="#{evaluationBackingBean.managedBean.readOnly or tplSpecAnswer.ratePerUom eq 0 or tplSpecAnswer.notOfferAll or (evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected or evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}" value="#{tplSpecAnswer.rating}" tooltip="#{lbl['lbl.sc.tec.rating.tooltip']}" /><ui:remove>#32334  for 29021 || #21692</ui:remove>
			<ui:remove><!-- #28784 - end --></ui:remove>
			<ui:remove><!--#29021-end--></ui:remove>
		</h:panelGroup>
		</c:otherwise>

	<p:column style="width:5%;" rendered="#{isManSpecAndCompliance}">
		<ui:fragment
			rendered="#{isSpecTypeTechnical 
			and !(evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected)
			and (tplSpecAnswer.notApplicable and tplSpecAnswer.notOfferAll or tplSpecAnswer.notOfferAll)}">
			<h:outputText value="#{lbl['lbl.txt.na']}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification 
				and tplSpecAnswer.tplSpecQuestion.mandatorySpec}" />
		</ui:fragment>
		<ui:fragment
			rendered="#{isSpecTypeTechnical 
			and !tplSpecAnswer.notOfferAll 
			and !(evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected)}">
			<h:selectOneMenu id="specCompliance" required="true"
				label="#{lbl['lbl.sc.tec.compliance']}"
				value="#{tplSpecAnswer.compliance}"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification 
				and tplSpecAnswer.tplSpecQuestion.mandatorySpec}">
				<f:selectItems
					value="#{templateSpecBackingBean.getMandatorySpecAndComplianceDropdownValues(true)}" />
				<p:ajax event="change" process="@this" partialSubmit="true"
					update="@([id$=questionTbl])"
					listener="#{templateSpecBackingBean.onchangeCompliance(tplSpecAnswer)}" />
			</h:selectOneMenu>
			<h:outputText value=""
				rendered="#{tplSpecAnswer.tplSpecQuestion.questionType eq ParameterConst.tplSpecQuestionTypeSpecification  
				and !tplSpecAnswer.tplSpecQuestion.mandatorySpec}" />
			<p:message id="specComplianceMsg" for="specCompliance" display="icon" />
		</ui:fragment>
	</p:column>
