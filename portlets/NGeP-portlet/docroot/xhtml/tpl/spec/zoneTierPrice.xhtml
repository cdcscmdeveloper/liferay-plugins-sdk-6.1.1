<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="isSelectedPriceTypeTier" value="#{templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypePromotionTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalPromotionTier 
		or isSelectedPriceTypeTariff}" />
	
	<p:dataTable id="specAnswerTbl" 
		var="tplSpecAnswer"
		rowIndexVar="rowIndex"
		value="#{templateSpecBean.selectedSpecQuestion.tplSpecAnswers}"
		rowKey="#{tplSpecAnswer}">
							
		<ac:paginator for="specAnswerTbl" />
		
		<p:column headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}" rendered="#{!empty templateSpecBean.specMaster.tplSpecZone}">
			#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl.zoneName}
		</p:column>
		<p:column headerText="#{lbl['lbl.tpl.spec.content.quantity']}" style="text-align:right;">
			<h:panelGroup rendered="#{isSelectedPriceTypeTier}">
				<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.fromQty}" rendered="#{isQuestionTypeItem}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, templateSpecBean.selectedSpecQuestion.clUom.uomCode)}" />
				</h:outputText>
				<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{isQuestionTypeItem and empty tplSpecAnswer.tplSpecTierQty.toQty}" />
				<h:outputText value=" - " rendered="#{isQuestionTypeItem and !empty tplSpecAnswer.tplSpecTierQty.toQty}" />
				<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.toQty}" rendered="#{isQuestionTypeItem and !empty tplSpecAnswer.tplSpecTierQty.toQty}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, templateSpecBean.selectedSpecQuestion.clUom.uomCode)}" />
				</h:outputText>
			</h:panelGroup>
			<h:panelGroup rendered="#{!isSelectedPriceTypeTier}">
				<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.clQuantity}" rendered="#{empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, templateSpecBean.selectedSpecQuestion.clUom.uomCode)}" />
				</h:outputText>
				<h:outputText value="#{tplSpecAnswer.tplSpecZoneQty.qty}" rendered="#{!empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
				</h:outputText>
			</h:panelGroup>
		</p:column>
		<p:column style="width:80px;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.unit.price']}"/>
			</f:facet>
			<p:inputText id="ratePerUomAns" value="#{tplSpecAnswer.ratePerUom}" style="width:86px; text-align:right;" 
				required="true" maxlength="19"
				label="#{lbl['lbl.tpl.spec.content.unit.price']}"
				disabled="#{!editable}">
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
				<p:ajax partialSubmit="true" process="@this" update="@this, ratePerUomAnsMsg, totalAmount" listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, tplSpecAnswer, isItemTypeService)}" />
			</p:inputText>
			<p:message id="ratePerUomAnsMsg" for="ratePerUomAns" display="icon" />
		</p:column>
		<p:column style="text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.total.amount']}">			
			<h:outputText id="totalAmount" 
				value="#{tplSpecAnswer.answerNumeric}"
				rendered="#{!isSelectedPriceTypeTier}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</p:column>
	</p:dataTable>
</ui:composition>
