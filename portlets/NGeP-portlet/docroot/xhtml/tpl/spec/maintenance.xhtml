<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<ui:param name="templateSpecBean" value="#{templateSpecBackingBean.managedBean.templateSpecBean}" />
	<ui:param name="specMaster" value="#{templateSpecBean.specMaster}"/>
	<ui:param name="isReadOnly" value="#{templateSpecBackingBean.managedBean.readOnly}"/>
	
		<p:messages id="specMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
		<table border="0" cellpadding="0" cellspacing="0" width="100%">
		<tr>
			<td>
				<p:commandButton value="#{lbl['lbl.btn.back']}" 
					action="templateSpecSearch"
					partialSubmit="true"
					process="@this" />
			</td>
			<td class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.clone']}" 
					action="#{templateSpecBackingBean.cloneAction(templateSpecBean)}"
					update="@form" rendered="#{templateSpecBackingBean.managedBean.cloneBtnRendered and 
					!specMaster.brandNew}"/>
				<p:commandButton value="#{lbl['lbl.btn.save']}" 
					action="#{templateSpecBackingBean.saveAction(templateSpecBean)}"
					update="@form" rendered="#{!isReadOnly}"/>
			</td>
		</tr>
		</table>

		<p:panel id="smpg" header="#{lbl['lbl.tpl.spec.maintenance.header']}" toggleable="true">
			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.title']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight">
						<p:inputTextarea id="title" rows="3" style="width:280px" 
							value="#{specMaster.specName}"
							required="true" maxlength="200"
							label="#{lbl['lbl.tpl.spec.title']}" disabled="#{isReadOnly}"><p:ajax partialSubmit="true" process="@this" /></p:inputTextarea>
						<p:message id="titleMsg" for="title" display="icon" />
					</td>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.description']}" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:inputTextarea id="descr" rows="3" style="width:280px" 
							value="#{specMaster.specDesc}"
							maxlength="500"
							label="#{lbl['lbl.tpl.spec.description']}"  disabled="#{isReadOnly}"><p:ajax partialSubmit="true" process="@this" />
							</p:inputTextarea>
					</td>
				</tr>	
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.sc.procurement.category']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:selectOneMenu id="procCat" style="width:289px" 
							value="#{specMaster.procurementCategory.parameterId}"
							required="true"
							label="#{lbl['lbl.sc.procurement.category']}" disabled="#{isReadOnly}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
							<p:ajax partialSubmit="true" process="@this" />
						</p:selectOneMenu>
						<p:message id="procCatMsg" for="procCat" display="icon" />
					</td>
				</tr>		
				<tr>
					<td class="TableFieldLeft" width="250px">
						<p:outputLabel value="#{lbl['lbl.sc.item.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" width="350px">
						<p:selectOneMenu id="itemType" style="width:289px" 
							value="#{specMaster.itemTypeCode.parameterId}"
							required="true"
							label="#{lbl['lbl.sc.item.type']}" disabled="#{isReadOnly}">
							<f:selectItems value="#{templateSpecBackingBean.itemTypeDropdownList}" />
							<p:ajax event="change" partialSubmit="true" process="@this" update="spg" listener="#{templateSpecBackingBean.itemTypeChange()}" />
						</p:selectOneMenu>
						<p:message id="itemTypeMsg" for="itemType" display="icon" />
					</td>
					<td class="TableFieldLeft" width="250px">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.specification.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" width="*">
						<p:selectOneMenu id="specType" style="width:289px" 
							value="#{specMaster.specTypeCode.parameterId}"
							required="true"
							label="#{lbl['lbl.tpl.spec.specification.type']}" disabled="#{isReadOnly}">
							<f:selectItems value="#{templateSpecBackingBean.getSpecTypeDropdownList()}" />
							<p:ajax event="change" partialSubmit="true" process="@this" update="spg" listener="#{templateSpecBackingBean.specTypeChange()}" />
						</p:selectOneMenu>
						<p:message id="specTypeMsg" for="specType" display="icon" />
					</td>
				</tr>				
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.template.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="templateType" style="width:289px" 
							value="#{specMaster.templateTypeCode.parameterId}"
							required="true"
							label="#{lbl['lbl.tpl.spec.template.type']}" disabled="#{isReadOnly}">
							<p:ajax event="change" partialSubmit="true" process="@this" update="ministryLBL,ministryDD" listener="#{templateSpecBackingBean.templateTypeChange}" />
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.templateType)}" />
						</p:selectOneMenu>
						<p:message id="templateTypeMsg" for="templateType" display="icon" />
					</td>
					
					<td class="TableFieldLeft">
						<h:panelGroup id="ministryLBL">
							<c:if test="#{specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypeMinistry or specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypePtj}">
								<p:outputLabel value="#{lbl['lbl.tpl.spec.ministry']}" />
								<p:outputLabel value="*" styleClass="mandatory" />
							</c:if>
						</h:panelGroup>
					</td>
					<td class="TableFieldRight">
						<h:panelGroup id="ministryDD">
							<c:choose>
							<c:when test="#{specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypeMinistry}">
								<ac:lov id="minstryOrg" lovId="PM_ORG_PROFILE_MINSTRY"
									headerText="#{lbl['lbl.sc.notice.board.ministry.search']}" 
									saveObject="templateSpecBackingBean.managedBean.templateSpecBean.specMaster.orgProfile"
									value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.orgProfile.orgName}"
									size="32" readonly="true"
									required="true" label="#{lbl['lbl.tpl.spec.ministry']}" disabled="#{isReadOnly}"/>
							</c:when>
							<c:when test="#{specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypePtj}">
								<ac:lov id="ptjOrg" lovId="PM_ORG_PROFILE_PTJ"
									headerText="#{lbl['lbl.sc.notice.board.ptj.search']}"
									saveObject="templateSpecBackingBean.managedBean.templateSpecBean.specMaster.orgProfile"
									value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.orgProfile.orgName}"
									size="32" readonly="true"
									required="true" label="#{lbl['lbl.tpl.spec.ministry']}" disabled="#{isReadOnly}" />
							</c:when>
							</c:choose>
							
							<ac:lovPopup />
						</h:panelGroup>
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.ministry.owner']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:inputText id="minOwner" 
							value="#{specMaster.ownerOrgProfile.orgName}"
							disabled="true" style="width:280px"  />
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.pm.status']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:selectOneMenu id="recStatus" 
							required="true" style="width:289px" 
							label="#{lbl['lbl.pm.status']}"  disabled="#{specMaster.brandNew or isReadOnly}"
							value="#{specMaster.recordStatusFlg}">
							<f:selectItems  value="#{templateSpecBackingBean.getStatusOptions()}"/>
						</p:selectOneMenu>
						<p:message id="recStatusMsg" for="recStatus" display="icon" />
					</td>
				</tr>
			</table>
		</p:panel>
		
		<h:panelGroup id="spg">
			<ac:templateSpec templateSpecBean="#{templateSpecBackingBean.managedBean.templateSpecBean}" editable="#{!isReadOnly}"/>
		</h:panelGroup>
	</ui:define>

	<ui:define name="footerSection" />
</ui:composition>
