<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="specMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
		
		<table border="0" cellpadding="0" cellspacing="0" width="100%">
		<tr>
			<td>
				<p:commandButton value="#{lbl['lbl.btn.back']}" 
					icon="ui-icon-back" 
					action="templateSpecSearch"
					partialSubmit="true"
					process="@this" />
			</td>
			<td class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.save']}" 
					icon="ui-icon-save" 
					action="#{templateSpecBackingBean.saveAction(templateSpecBackingBean.managedBean.templateSpecBean)}"
					update="@form" />
			</td>
		</tr>
		</table>

		<p:panel id="smpg" header="#{lbl['lbl.tpl.spec.maintenance.header']}" toggleable="true">
			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.title']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:inputText id="title" style="width:280px" 
							value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.specName}"
							required="true" maxlength="200"
							label="#{lbl['lbl.tpl.spec.title']}" />
						<p:message id="titleMsg" for="title" display="icon" />
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.description']}" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:inputTextarea id="descr" rows="2" style="width:280px" 
							value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.specDesc}"
							maxlength="500"
							label="#{lbl['lbl.tpl.spec.description']}" />
					</td>
				</tr>	
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.procurement.category']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" colspan="3">
						<p:selectOneMenu id="procCat" style="width:289px" 
							value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.procurementCategory.parameterId}"
							required="true"
							label="#{lbl['lbl.tpl.spec.procurement.category']}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
						<p:message id="procCatMsg" for="procCat" display="icon" />
					</td>
				</tr>		
				<tr>
					<td class="TableFieldLeft" width="15%">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.item.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" width="35%">
						<p:selectOneMenu id="itemType" style="width:148px" 
							value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.itemTypeCode.parameterId}"
							required="true"
							label="#{lbl['lbl.tpl.spec.item.type']}">
							<f:selectItems value="#{templateSpecBackingBean.itemTypeDropdownList}" />
							<p:ajax event="change" partialSubmit="true" process="@this" update="spg" listener="#{templateSpecBackingBean.itemTypeChange()}" />
						</p:selectOneMenu>
						<p:message id="itemTypeMsg" for="itemType" display="icon" />
					</td>
					<td class="TableFieldLeft" width="15%">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.specification.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight" width="35%">
						<p:selectOneMenu id="specType" style="width:148px" 
							value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.specTypeCode.parameterId}"
							required="true"
							label="#{lbl['lbl.tpl.spec.specification.type']}">
							<f:selectItems value="#{templateSpecBackingBean.getSpecTypeDropdownList()}" />
							<p:ajax event="change" partialSubmit="true" process="@this" update="spg" listener="#{templateSpecBackingBean.specTypeChange()}" />
						</p:selectOneMenu>
						<p:message id="specTypeMsg" for="specType" display="icon" />
					</td>
				</tr>				
				<tr>
					<td class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.template.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="templateType" style="width:148px" 
							value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.templateTypeCode.parameterId}"
							required="true"
							label="#{lbl['lbl.tpl.spec.template.type']}">
							<p:ajax event="change" partialSubmit="true" process="@this" update="ministryLBL, ministryDD" listener="#{templateSpecBackingBean.templateTypeChange()}" />
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.templateType)}" />
						</p:selectOneMenu>
						<p:message id="templateTypeMsg" for="templateType" display="icon" />
					</td>
					<td class="TableFieldLeft">
						<h:panelGroup id="ministryLBL">
							<c:if test="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypeMinistry}">
								<p:outputLabel value="#{lbl['lbl.tpl.spec.ministry']}" />
								<p:outputLabel value="*" styleClass="mandatory" />
							</c:if>
						</h:panelGroup>
					</td>
					<td class="TableFieldRight">
						<h:panelGroup id="ministryDD">
							<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.orgProfile.orgProfileId}" 
								rendered="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypeMinistry}"
								required="true"
								label="#{lbl['lbl.tpl.spec.ministry']}">
								<f:selectItems value="#{templateSpecBackingBean.ministryList}" />
							</p:selectOneMenu>
							<p:message id="ministryDDMsg" for="ministryDD" display="icon" />
						</h:panelGroup>
					</td>
				</tr>
			</table>
		</p:panel>
		
		<h:panelGroup id="spg">
			<ac:templateSpec templateSpecBean="#{templateSpecBackingBean.managedBean.templateSpecBean}" />
		</h:panelGroup>
	</ui:define>

	<ui:define name="footerSection" />
</ui:composition>
