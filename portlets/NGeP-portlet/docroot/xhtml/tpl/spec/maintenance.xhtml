<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		
		<table border="0" cellpadding="0" cellspacing="0" width="100%">
		<tr>
			<td>
				<p:commandButton value="#{lbl['lbl.btn.back']}" 
					icon="ui-icon-back" 
					action="templateSpecSearch" />
			</td>
			<td class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.save']}" 
					icon="ui-icon-save" 
					action="#{templateSpecBackingBean.saveAction(templateSpecBackingBean.managedBean.templateSpecBean)}" />
			</td>
		</tr>
		</table>

		<p:panel id="smpg" header="#{lbl['lbl.tpl.spec.maintenance.header']}" toggleable="true">
			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft" style="width:120px"><p:outputLabel value="#{lbl['lbl.tpl.spec.title']}" /></td>
					<td class="TableFieldRight" colspan="3">
						<p:inputText style="width:280px" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.specName}" />
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft"><p:outputLabel value="#{lbl['lbl.tpl.spec.description']}" /></td>
					<td class="TableFieldRight" colspan="3">
						<p:inputTextarea rows="2" style="width:280px" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.specDesc}" />
					</td>
				</tr>	
				<tr>
					<td class="TableFieldLeft"><p:outputLabel value="#{lbl['lbl.tpl.spec.procurement.category']}" /></td>
					<td class="TableFieldRight" colspan="3">
						<p:selectOneMenu style="width:289px" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.procurementCategory.parameterId}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
					</td>
				</tr>		
				<tr>
					<td class="TableFieldLeft"><p:outputLabel value="#{lbl['lbl.tpl.spec.item.type']}" /></td>
					<td class="TableFieldRight" style="width:330px">
						<p:selectOneMenu style="width:148px" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.itemTypeCode.parameterId}" >
							<f:selectItems value="#{templateSpecBackingBean.itemTypeDropdownList}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px"><p:outputLabel value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu style="width:148px" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.specTypeCode.parameterId}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.specificationType)}" />
						</p:selectOneMenu>
					</td>
				</tr>				
				<tr>
					<td class="TableFieldLeft"><p:outputLabel value="#{lbl['lbl.tpl.spec.template.type']}" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu style="width:148px" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.templateTypeCode.parameterId}">
							<p:ajax event="change" partialSubmit="true" process="@this" update="ministryLBL, ministryDD" />
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.templateType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft"><p:outputLabel id="ministryLBL" value="#{lbl['lbl.tpl.spec.ministry']}" rendered="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypeMinistry}" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="ministryDD" value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.orgProfile.orgProfileId}" rendered="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.templateTypeCode.parameterCode == ParameterConst.templateTypeMinistry}">
							<f:selectItems value="#{templateSpecBackingBean.ministryList}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
									
				</tr>	
				<tr>
					<td class="TableFieldLeft"><p:outputLabel value="#{lbl['lbl.tpl.spec.duration.month']}" /></td>
					<td class="TableFieldRight" colspan="3">
						<p:inputText value="#{templateSpecBackingBean.managedBean.templateSpecBean.specMaster.durationMonth}" />
					</td>					
				</tr>								
				<tr>
					<td colspan="4" class="ppRightBtn">
						<p:commandButton value="Render Table" actionListener="#{templateSpecBackingBean.renderTable}" 
							partialSubmit="true" process="smpg" update1="spg" />
					</td>
				</tr>
			</table>
		</p:panel>
		
		<ac:templateSpec templateSpecBean="#{templateSpecBackingBean.managedBean.templateSpecBean}" isScoringReq="false" />
	</ui:define>

	<ui:define name="footerSection" />
</ui:composition>
