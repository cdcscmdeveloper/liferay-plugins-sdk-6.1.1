<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		<p:commandButton value="Save" action="#{templateSpecBackingBean.saveAction}" />

		<p:spacer height="10px" />

		<p:panel id="smpg" header="Detail" toggleable="true">
			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Template Category" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu style="width:200px" value="#{templateSpecBackingBean.managedBean.specMaster.procurementCategory.codeId}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.procurementCategory)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Title" /></td>
					<td class="TableFieldRight">
						<p:inputText style="width:280px" value="#{templateSpecBackingBean.managedBean.specMaster.specName}" />
					</td>
				</tr>		
				<tr>
					<td class="TableFieldLeft"><h:outputLabel value="Item Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.specMaster.itemTypeCode.codeId}" >
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.itemType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Description" /></td>
					<td class="TableFieldRight">
						<p:inputTextarea rows="2" style="width:280px" value="#{templateSpecBackingBean.managedBean.specMaster.specDesc}" />
					</td>
				</tr>				
				<tr>
					<td class="TableFieldLeft"><h:outputLabel value="Template Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.specMaster.templateTypeCode.codeId}" >
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.templateType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft"><h:outputLabel value="Ministry Id" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.specMaster.orgProfile.orgProfileId}">
							<f:selectItems value="#{templateSpecBackingBean.ministryList}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft"><h:outputLabel value="Specification Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.specMaster.specTypeCode.codeId}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.specificationType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Is Estimated Cost Required" /></td>
					<td class="TableFieldRight">
						<p:selectBooleanCheckbox value="#{templateSpecBackingBean.managedBean.specMaster.estCostReq}"  />
					</td>					
				</tr>	
				<tr>
					<td class="TableFieldLeft"><h:outputLabel value="Specification Total" /></td>
					<td class="TableFieldRight">
						<p:inputText style="width:280px" value="#{templateSpecBackingBean.managedBean.specMaster.specTotal}" />
					</td>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Is Tier Price" /></td>
					<td class="TableFieldRight">
						<p:selectBooleanCheckbox value="#{templateSpecBackingBean.managedBean.specMaster.tierPrice}"  />
					</td>					
				</tr>								
				<tr>
					<td colspan="4">
						<p:commandButton value="Render Table" actionListener="#{templateSpecBackingBean.renderTable}" 
							partialSubmit="true" process="smpg" update="spg" />
					</td>
				</tr>
			</table>
		</p:panel>
		<ui:include src="specContent.xhtml" />
	</ui:define>

	<ui:define name="footerSection" />
</ui:composition>
