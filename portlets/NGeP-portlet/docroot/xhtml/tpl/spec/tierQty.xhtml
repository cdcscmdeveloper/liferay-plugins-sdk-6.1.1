<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="isSelectedPriceTypeTariff" value="#{templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTariff or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTariff}" />
	
	<p:dataTable id="tierQtyTbl" widgetVar="tierQtyWidget"
		var="tplSpecTierQty"
		rowIndexVar="rowIndex"
		value="#{templateSpecBean.selectedSpecQuestion.tplSpecTierQties}"
		rowKey="#{tplSpecTierQty}">
							
		<ac:paginator for="tierQtyTbl" />
		<ui:param name="uomCode" value="#{templateSpecBean.selectedSpecQuestion.clUom.uomCode}" />
		
		<p:column style="width:20px;" rendered="#{editable}">
			<f:facet name="header">
				<p:selectBooleanCheckbox id="selAllChk" value="#{templateSpecBean.selectAll}">
					<p:ajax partialSubmit="true" process="@this" update="tierQtyTbl"  listener="#{templateSpecBackingBean.selectAll(templateSpecBean.selectAll, templateSpecBean.selectedSpecQuestion.tplSpecTierQties)}" />
				</p:selectBooleanCheckbox>
			</f:facet>
			<p:selectBooleanCheckbox value="#{tplSpecTierQty.selected}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:selectBooleanCheckbox>
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.tier.from.qty']}"/>
			</f:facet>
			<p:inputText id="fromQty" value="#{tplSpecTierQty.fromQty}" style="width:65%;" styleClass="ppNumericAlign" 
				required="true" maxlength="14"
				label="#{lbl['lbl.tpl.spec.content.tier.from.qty']}"
				disabled="#{!editable}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, uomCode)}" maxIntegerDigits="10" />
			</p:inputText>
			<p:message id="fromQtyMsg" for="fromQty" display="icon" />
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.tier.to.qty']}"/>
			</f:facet>
			<p:inputText id="toQty" value="#{tplSpecTierQty.toQty}" style="width:65%;" styleClass="ppNumericAlign" 
				required="true" maxlength="14"
				label="#{lbl['lbl.tpl.spec.content.tier.to.qty']}"
				disabled="#{!editable}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, uomCode)}" maxIntegerDigits="10" />
			</p:inputText>
			<p:message id="toQtyMsg" for="toQty" display="icon" />
		</p:column>
		<p:column style="width:100px;" rendered="#{isSelectedPriceTypeTariff}">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.tier.sub.sequence']}"/>
			</f:facet>
			<p:inputText id="subSeq" value="#{tplSpecTierQty.subSequence}" style="width:65%;" styleClass="ppNumericAlign" 
				rendered="#{rowIndex > 0}" required="true" maxlength="6"
				label="#{lbl['lbl.tpl.spec.content.tier.sub.sequence']}"
				disabled="#{!editable}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" maxIntegerDigits="6" />
			</p:inputText>
			<p:message id="subSeqMsg" for="subSeq" display="icon" />
		</p:column>
	</p:dataTable>
	
	<div class="ppRightBtn">
		<p:commandButton id="addTierBtn" value="#{lbl['lbl.btn.add']}"
			process="@this, tierQtyTbl" partialSubmit="true"
			action="#{templateSpecBackingBean.addTierQtyAction(templateSpecBean.selectedSpecQuestion)}"
			oncomplete="tierQtyWidget.paginator.endLink.click();"
			update="tierQtyTbl" icon="ui-icon-add"
			rendered="#{editable}" />
		<p:tooltip id="addTierTtp" for="addTierBtn">
			<p:outputLabel escape="false" value="#{lbl['lbl.tpl.spec.content.tier.btn.add.tooltip']}"  />
		</p:tooltip>
		
		<p:commandButton value="#{lbl['lbl.btn.delete']}"
			process="@this" partialSubmit="true"
			icon="ui-icon-delete"
			action="#{templateSpecBackingBean.deleteSelectedRowsAction(templateSpecBean.selectedSpecQuestion.tplSpecTierQties)}"
			update="tierQtyTbl"
			rendered="#{editable}">
			<f:setPropertyActionListener target="#{templateSpecBean.selectAll}" value="#{false}" />
		</p:commandButton>
	</div>
</ui:composition>
