<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:155px;">
		<h:outputLabel value="Total Price" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText size="18" 
			rendered="#{!isQuestionTypeHeader}" disabled="true" />&#160;		
		<p:commandLink id="scoringBtn" rendered="#{!isQuestionTypeHeader}" disabled="#{(isAnswerTypeText)}" 
			action="#{templateSpecBackingBean.setIndex(row)}" oncomplete="scoringSetting.show();">
			<p:graphicImage library="ep/images/design" name="edit.png"
				value="/resources/ep/images/design/edit.png" />
		</p:commandLink>
	</p:column>
	<p:column style="#{columnStyle}width:70px;" rendered="#{isEstCostReq and isSpecTypeFinancial}">
		<h:outputLabel value="Estimate Cost" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="10" dir="rtl" value="#{question.clEstimatedCost}" rendered="#{!isQuestionTypeHeader}" required="true" />
	</p:column>
</ui:composition>
