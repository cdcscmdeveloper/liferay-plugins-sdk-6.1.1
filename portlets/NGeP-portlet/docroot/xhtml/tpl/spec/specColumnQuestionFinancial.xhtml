<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:55px;" rendered="#{isSpecTypeFinancial}" headerText="#{lbl['lbl.tpl.spec.content.unit.price']}">
		<f:facet name="footer">
			<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}" rendered="#{isSpecTypeFinancial}" />
		</f:facet>
		
		<p:inputText style="min-width:0px !important;width:96%;" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="width:95px;" rendered="#{isItemTypeService and isSpecTypeFinancial}" headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
		<p:inputText style="min-width:0px !important;width:96%;" dir="rtl" value=""
			rendered="#{isQuestionTypeItem}" disabled="true">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
	</p:column>
	<p:column style="width:125px;" headerText="#{lbl['lbl.tpl.spec.content.total.amount']}">
		<f:facet name="footer">
			<p:inputText style="width:80%;" value="#{templateSpecBean.specMaster.specTotal}" dir="rtl" disabled="true" rendered="#{isSpecTypeFinancial}" />
			<p:spacer width="16%" />
		</f:facet>
		
		<p:inputText style="min-width:0px !important;width:75%;" rendered="#{isQuestionTypeItem}" disabled="true" />
		<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;" id="scoringBtn" 
			oncomplete="scoringSetPopup.show();"
			partialSubmit="true" process="@this" update="@([id$=scoringSetPopup])">
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
		</p:commandButton>
	</p:column>
	<p:column style="width:80px;" rendered="#{isEstCostReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.cost']}"/>
		</f:facet>
		<p:inputText id="estimatedCost" style="min-width:0px !important;width:96%;" dir="rtl" 
			value="#{question.tplSpecEstimations[0].estimatedCost}" 
			required="true" rendered="#{isPriceTypeStandard}" maxlength="19"
			label="#{lbl['lbl.tpl.spec.content.estimate.cost']}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</p:inputText>
		<p:message id="estimatedCostMsg" for="estimatedCost" display="icon" />
		<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;"  
			action="#{templateSpecBackingBean.estimationPopupAction(question)}"
			oncomplete="estimationPopup.show();"
			partialSubmit="true" process="@this" update="@([id$=estimationPopup])"
			rendered="#{!isPriceTypeStandard}">
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
		</p:commandButton>
	</p:column>
</ui:composition>
