<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:97px;" rendered="#{isSpecTypeFinancial}" headerText="#{lbl['lbl.tpl.spec.content.unit.price']}">
		<f:facet name="footer">
			<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}" rendered="#{isSpecTypeFinancial}" />
		</f:facet>
		
		<p:inputText style="min-width:0px !important;width:86px;" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="width:115px;white-space:normal;" rendered="#{isItemTypeService and isSpecTypeFinancial and !isDurationByItem}" headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
		<p:inputText style="min-width:0px !important;width:104px;" styleClass="ppNumericAlign"
			rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="width:115px;white-space:normal;" rendered="#{isEstCostReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.cost']}"/>
		</f:facet>
		<f:facet name="footer">
			<h:outputText id="totalEstAmount" 
				styleClass="calcEstAmount" 
				value="#{templateSpecBackingBean.calcGrandTotalEstAmount(templateSpecBean)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<c:if test="#{!isZonal}">
			<p:inputText id="estimatedCost" style="min-width:0px !important;width:71px;" styleClass="ppNumericAlign" 
				value="#{question.tplSpecEstimations[0].estimatedCost}" 
				required="true" maxlength="19"
				label="#{lbl['lbl.tpl.spec.content.estimate.cost']}">
				<p:ajax partialSubmit="true" process="@this" update="@this, estimatedCostMsg, @(.calcEstAmount)" />
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
			</p:inputText>
			<p:message id="estimatedCostMsg" for="estimatedCost" display="icon" />
		</c:if>
		<c:if test="#{isZonal}">
			<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;"  
				action="#{templateSpecBackingBean.estimationPopupAction(templateSpecBean)}"
				oncomplete="#{estimationPopup}.show();"
				partialSubmit="true" process="@this" update="@([id$=estimationPopup])">
				<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			</p:commandButton>
		</c:if>
	</p:column>
	<p:column style="width:125px;" headerText="#{lbl['lbl.tpl.spec.content.total.amount']}">
		<f:facet name="footer">
			<p:inputText style="width:113px;" styleClass="ppNumericAlign" value="#{templateSpecBean.specMaster.specTotal}" disabled="true" rendered="#{isSpecTypeFinancial}" />
		</f:facet>
		
		<p:inputText style="min-width:0px !important;width:75px;" rendered="#{isQuestionTypeItem}" disabled="true" />
		<p:commandButton id="scoringBtn"
			icon="#{empty question.maxScore ? 'ui-icon-pencil' : 'ui-icon-evaluate'}" 
			style="background-color:transparent !important; border:0px none;"
			styleClass="scoringBtn"
			action="#{templateSpecBackingBean.scoringPopupAction(templateSpecBean)}"
			oncomplete="#{scoringSetPopup}.show();"
			partialSubmit="true" process="@this" update="@([id$=scoringSetPopup])"
			rendered="#{isScoringReq}">
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
		</p:commandButton>
	</p:column>
</ui:composition>
