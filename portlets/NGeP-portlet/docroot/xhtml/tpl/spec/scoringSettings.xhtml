<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
	<tr>
		<td width="17%"><p:outputLabel value="#{lbl['lbl.tpl.spec.content.scoring.settings.answer.type']}" /></td>
		<td width="30%">
			<p:inputText id="answerType" value="#{templateSpecBackingBean.getParameterDesc(templateSpecBean.selectedSpecQuestion.answerTypeCode)}" disabled="true" size="15" />
		</td>
		<td width="17%"><p:outputLabel value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type']}" /></td>
		<td width="36%">
			<h:selectOneMenu id="scoreType" value="#{templateSpecBean.selectedSpecQuestion.scoreTypeCode.parameterId}" required="true">
				<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.scoreType)}" />
				<p:ajax event="change" listener="#{templateSpecBackingBean.scoreTypeChange(templateSpecBean.selectedSpecQuestion)}" update="scorePG" />
			</h:selectOneMenu>
		</td>
	</tr>
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.tpl.spec.content.scoring.settings.max.score']}" /></td>
		<td>
			<p:inputText id="maxScore" dir="rtl" value="#{templateSpecBean.selectedSpecQuestion.maxScore}" required="true" size="15" />
			<p:message id="maxScoreMsg" for="maxScore" display="icon" />
		</td>
		<td><p:outputLabel value="#{lbl['lbl.tpl.spec.content.scoring.settings.weightage']}" /></td>
		<td>
			<p:selectBooleanCheckbox id="isWeightage" value="#{templateSpecBean.selectedSpecQuestion.weightageReq}">
				<p:ajax partialSubmit="true" process="@this" update="weightagePG" />
			</p:selectBooleanCheckbox>
			<h:panelGroup id="weightagePG">
				<h:panelGroup rendered="#{templateSpecBean.selectedSpecQuestion.weightageReq}">
					<p:inputText id="weightage" dir="rtl" value="#{templateSpecBean.selectedSpecQuestion.weightage}" required="true" size="15">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</p:inputText>
					#{lbl['lbl.tpl.spec.content.scoring.settings.weightage.percentage']}
					<p:message id="weightageMsg" for="weightage" display="icon" />
				</h:panelGroup>
			</h:panelGroup>
		</td>
	</tr>
	</table>
	
	<br />
	
	<h:panelGroup id="scorePG">
	<p:panel id="scorePnl" 
		header="#{lbl['lbl.tpl.spec.content.scoring.scoring.title']}" 
		toggleable="true"
		rendered="#{templateSpecBean.selectedSpecQuestion.scoreTypeCode.parameterCode == ParameterConst.scoreTypeAuto}">
		
		<p:dataTable id="scoringTbl" widgetVar="scoringWidget"
			var="tplSpecScoring"
			rowIndexVar="rowIndex"
			value="#{templateSpecBean.selectedSpecQuestion.tplSpecScorings}"
			rowKey="#{tplSpecScoring}"
			selection="#{templateSpecBean.selectedScoringList}">
								
			<ac:paginator for="scoringTbl" />
			
			<p:column selectionMode="multiple" style="width:20px;" />
			<p:column headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.range.from']}">
				<p:inputText id="rangeFrom" value="#{tplSpecScoring.rangeFrom}" dir="rtl" style="width:96%;" required="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
				<p:message id="rangeFromMsg" for="rangeFrom" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.range.to']}">
				<p:inputText id="rangeTo" value="#{tplSpecScoring.rangeTo}" dir="rtl" style="width:96%;" required="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
				<p:message id="rangeToMsg" for="rangeTo" display="icon" />
			</p:column>
			<p:column style="width:100px;" headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.score']}">
				<p:inputText id="score" value="#{tplSpecScoring.score}" dir="rtl" style="width:96%;" required="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
				<p:message id="scoreMsg" for="score" display="icon" />
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, scoringTbl" partialSubmit="true"
				action="#{templateSpecBackingBean.addScoringAction(templateSpecBean.selectedSpecQuestion)}"
				oncomplete="scoringWidget.paginator.endLink.click();"
				update="scoringTbl" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, scoringTbl" partialSubmit="true"
				icon="ui-icon-delete"
				action="#{templateSpecBackingBean.deleteRowAction(templateSpecBean.selectedSpecQuestion.tplSpecScorings, templateSpecBean.selectedScoringList)}"
				update="scoringTbl" />
		</div>
	</p:panel>
	</h:panelGroup>
</ui:composition>
