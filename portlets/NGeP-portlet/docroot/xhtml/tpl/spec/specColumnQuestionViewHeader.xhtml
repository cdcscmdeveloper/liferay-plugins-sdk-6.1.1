<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">

	<ui:param name="isRepeated"
		value="#{prevSpecQuestion != null ? prevSpecQuestion.specQuestionId == question.specQuestionId : false}" />
		<ui:param name="specificationRequired" value="#{isSpecTypeTechnical or isSqSpec or (isSpecTypeFinancial and !isSpecificationReq)}"></ui:param>
	<ui:remove>#29187 Start Vinod</ui:remove>
	<ui:param name="isRenderUOMandQuantity" value="#{evaluationBackingBean.checkUOMandQuantityRender()}" /> 
	<ui:remove>#29187 End Vinod</ui:remove>
	<p:columnGroup type="header">
		<p:row>
			<ui:remove>#29187 Start Vinod Added condition for width</ui:remove>
			<p:column colspan="1" style="#{isManSpecAndCompliance ? 'width: 30%;' : ''} white-space: normal;word-break:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.item']}"><!-- #29006 add CSS property -->
			<ui:remove>#29187 End Vinod</ui:remove>
				

			</p:column>

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:75px;"
				headerText="#{lbl['lbl.tpl.spec.content.fulfilment.type']}"
				rendered="#{isItemTypeService and isFulfilmentTypeReq}">

			</p:column>
			<ui:remove>#29187 Start Vinod</ui:remove>
			<c:if test="#{!isContentTypeScore or isRenderUOMandQuantity}"> 
			<ui:remove>#29187 End Vinod</ui:remove>
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:8%;white-space:normal;word-break:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.uom']}"><!-- #29006 add CSS property -->

			</p:column>


			<c:if test="#{isItemTypeService}">
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:70px;white-space:normal;word-break:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}"><!-- #29006 add CSS property -->

				</p:column>
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:60px;white-space:normal;word-break:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}"><!-- #29006 add CSS property -->

				</p:column>
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:60px;white-space:normal;word-break:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}"><!-- #29006 add CSS property -->

				</p:column>
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:2%;white-space:normal;word-break:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.duration.month']}"
					rendered="#{isDurationByItem}"><!-- #29006 add CSS property -->

				</p:column>
			</c:if>

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:75px; white-space:normal;word-break:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.price.type']}"
				rendered="#{!isItemTypeService}"><!-- #29006 add CSS property -->

			</p:column>

			<!-- 11715 danial start -->
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:4%;text-align:right;"
				headerText="#{lbl['lbl.tpl.spec.content.quantity']}">

			</p:column>
			<ui:remove>#29187 Start Vinod</ui:remove>
			</c:if>
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:4%;text-align:right;"
				headerText="#{lbl['lbl.tpl.spec.content.scoring.settings.mandatory.specification']}" 
				rendered="#{templateSpecBackingBean.displayMandatorySpecColumn(templateSpecBean)}">

			</p:column>
			<ui:remove>#29187 End Vinod</ui:remove>
			
			<!-- 31134 Farid start -->
			<p:column rowspan="#{specificationRequired ? 2 : 1}"
				style="width:4%;text-align:right;"
				headerText="#{lbl['lbl.tpl.spec.content.tier.title']}"
				rendered="#{isSqSpec and isSpecTypeFinancial and supplierProposalDetailManagedBean.tierType 
				or (!isSqSpec and isSpecTypeFinancial and supplierProposalDetailManagedBean.tierType and templateSpecBackingBean.checkPriceTierEnableColumn(templateSpecBean))}">

			</p:column>
			<!-- 31134 Farid end -->
			<!-- 11715 danial end -->

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:100px;white-space:normal;word-break:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.supplier.note']}"
				rendered="#{isUpdateSpecByAnswers}"><!-- #29006 add CSS property -->

			</p:column>

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:100px;white-space:normal;word-break:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.comment']}"
				rendered="#{isUpdateSpecByAnswers}"><!-- #29006 add CSS property -->

			</p:column>
			<ui:insert name="otherHeaderSection" />
		<ui:remove> #29007 Start Vinod </ui:remove>
		<c:if test="#{directLOABackingBean.managedBean.searchItemForDL and !templateSpecBean.specMaster.brandNew and !isItemTypeService}">
			<ui:param name="specificationRequired1" value="#{isSpecTypeTechnical or isSqSpec or (isSpecTypeFinancial and !isSpecificationReq)}"></ui:param>
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:97px; white-space:normal;word-break:normal;"
			headerText="#{lbl['lbl.tpl.spec.content.unit.price']}">
			</p:column><!-- #29006 add CSS property -->
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:90px;white-space:normal;word-break:normal;text-align:right;"
			rendered="#{isItemTypeService}"
			headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
			</p:column><!-- #29006 add CSS property -->
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:115px; text-align:right; white-space:normal;word-break:normal;"
			headerText="#{lbl['lbl.tpl.spec.content.total.amount']}">
			</p:column><!-- #29006 add CSS property -->
		</c:if>
		<ui:remove> #29007 End Vinod </ui:remove>
		</p:row>
		<p:row rendered="#{specificationRequired}">
			<p:column colspan="1" style="width: 30%;white-space: normal;word-break:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.specification']}"
				rendered="#{specificationRequired}"><!-- #29006 add CSS property -->

			</p:column>
		</p:row>
	</p:columnGroup>
</ui:composition>
