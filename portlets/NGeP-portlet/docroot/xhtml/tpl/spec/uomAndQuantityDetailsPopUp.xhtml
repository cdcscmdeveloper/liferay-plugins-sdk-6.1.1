<ui:composition xmlns="http://www.w3.org/1999/xhtml"
				xmlns:f="http://java.sun.com/jsf/core"
				xmlns:h="http://java.sun.com/jsf/html"
				xmlns:ui="http://java.sun.com/jsf/facelets"
				xmlns:p="http://primefaces.org/ui"
				xmlns:c="http://java.sun.com/jsp/jstl/core">
<p:dialog id="viewUOMQuantityDetailsId" widgetVar="viewUOMQuantityDetails" modal="true"
		  dynamic="true"  resizable="false" width="500px" height="200px" styleClass="pop_up_top"
		  header="#{templateSpecBackingBean.managedBean.questionForItemHlink.clItem}">
		<p:panelGrid style="margin-top:5px;width:100%;" styleClass="panelGridBorders tr, panelGridBorders td">
			<f:facet name="header">
				<p:row>
					<p:column styleClass="panelGridHeaders" style="width:20%;white-space:normal; text-align: center">
						#{lbl['lbl.tpl.spec.content.uom']}
					</p:column>
					<p:column styleClass="panelGridHeaders" style="width:20%;white-space:normal; text-align: center">
						#{lbl['lbl.tpl.spec.content.frequency.per.uom']}
					</p:column>
					<p:column styleClass="panelGridHeaders" style="width:20%;white-space:normal; text-align: center">
						#{lbl['lbl.tpl.spec.content.no.uom.per.day']}
					</p:column>
					<p:column styleClass="panelGridHeaders" style="width:20%;white-space:normal; text-align: center">
						#{lbl['lbl.tpl.spec.content.no.uom.per.month']}
					</p:column>
					<p:column styleClass="panelGridHeaders" style="width:20%;white-space:normal; text-align: center">
						#{lbl['lbl.tpl.spec.content.quantity']}
					</p:column>
				</p:row>
			</f:facet>
			<p:row>
				<p:column style="width:20%;white-space:normal; text-align: center">
					<h:outputText value="#{templateSpecBackingBean.managedBean.questionForItemHlink.clUom.uomName}" />
				</p:column>
				<p:column style="width:20%;white-space:normal; text-align: center">
					<h:outputText value="#{templateSpecBackingBean.managedBean.questionForItemHlink.clUomFrequency}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
				<p:column style="width:20%;white-space:normal; text-align: center">
					<h:outputText value="#{templateSpecBackingBean.managedBean.questionForItemHlink.clUomPerDay}">
						<f:convertNumber pattern="0.0" />
					</h:outputText>
				</p:column>
				<p:column style="width:20%;white-space:normal; text-align: center">
					<h:outputText value="#{templateSpecBackingBean.managedBean.questionForItemHlink.clUomPerMonth}">
						<f:convertNumber pattern="0.0" />
					</h:outputText>
				</p:column>
				<p:column style="width:20%;white-space:normal; text-align: center" >
					<h:outputText value="#{templateSpecBackingBean.managedBean.questionForItemHlink.clQuantity}" 
								  rendered="#{!templateSpecBackingBean.managedBean.zoneForItemHlink}"/>
							
					<p:commandLink process="@this" styleClass="BtnSpacing" id="viewZoneQTYBtn" immediate="true"
								   action="#{templateSpecBackingBean.zoneQuantityPopup()}"
								   oncomplete="viewZoneQuantityPopup.show();" 
								   update="@([id$=viewZoneQuantityPopupId])"
								   rendered="#{templateSpecBackingBean.managedBean.zoneForItemHlink}">
						<p:graphicImage value="/css/images/design/edit.png" />
						<f:setPropertyActionListener
								target="#{templateSpecBackingBean.managedBean.zoneQtyForItemHlink}"
								value="#{templateSpecBackingBean.managedBean.questionForItemHlink.tplSpecZoneQties}" />
					</p:commandLink>
				</p:column>
			</p:row>
		</p:panelGrid>
		
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.close']}" 
							 onclick="viewUOMQuantityDetails.hide();" 
							 type="button" 
							 partialSubmit="true"  
							 process="@this"/>
		</div>
</p:dialog>
<p:dialog id="viewZoneQuantityPopupId" widgetVar="viewZoneQuantityPopup" modal="true"
		  dynamic="true"  resizable="false" width="350px" height="300px" styleClass="pop_up_top"
		  header="#{lbl['lbl.tpl.spec.content.zone.quantity.header']}">
		<p:dataTable id="qtyList" value="#{templateSpecBackingBean.managedBean.zoneQtyForItemHlink}"
					 var="qnty" rowIndexVar="rowIndex" rowKey="#{qnty}" rows="10" width="100%">
			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sc.zone']}" 
							  style="width:50%;white-space:normal; text-align: center" />
					<p:column headerText="#{lbl['lbl.tpl.spec.content.quantity']}" 
							  style="width:50%;white-space:normal; text-align: center" />
				</p:row>
			</p:columnGroup>
			
			<p:column style="width:50%; text-align: center;">
				<h:outputText value="#{qnty.tplSpecZoneDtl.zoneName}" /><br/>
			</p:column>
			<p:column style="width:50%; text-align: center;">
				<h:outputText value="#{qnty.qty}" /><br/>
			</p:column>
		</p:dataTable>
		
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.close']}" onclick="viewZoneQuantityPopup.hide();" 
							 type="button" partialSubmit="true" process="@this"/>
		</div>
</p:dialog>
</ui:composition>
