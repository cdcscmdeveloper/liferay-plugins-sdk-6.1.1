<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:dialog id="specScorePopupId#{row}" widgetVar="specScorePopup#{row}"
		modal="true">
		<f:facet name="header">
			<p:row>
				<p:column styleClass="panelGridHeaders"
					style="width:20%;white-space:normal; text-align: center">
						#{lbl['lbl.sc.spec.score.header.popup']}
					</p:column>

			</p:row>
		</f:facet>
		<p:panelGrid style="margin-top:20px;"
			layout="tabular">
			<f:facet name="header">
				<p:row rowspan="2">
					<p:column>
						<h:outputText value="#{lbl['lbl.sc.spec.weightage.popup']}" />
					</p:column>
					<p:column>
						<h:outputText
							value="#{lbl['lbl.sc.spec.score.with.weightage.popup']}" />
							<br />
						<h:outputText value="#{lbl['lbl.sc.spec.maxscore.with.weightage.popup']}" />
					</p:column>
				</p:row>

			</f:facet>

			<p:row>
				<p:column>
					<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.weightage}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{tplSpecAnswer.autoScore}" rendered="#{isSpecTypeTechnical and tplSpecAnswer.autoScore ne null}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					</h:outputText>
					<h:outputText value="#{tplSpecAnswer.userScore * (tplSpecAnswer.tplSpecQuestion.weightage)}" rendered="#{isSpecTypeTechnical and tplSpecAnswer.autoScore eq null}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					</h:outputText>
					<h:outputText value="/" />

					<h:outputText
						value="#{tplSpecAnswer.tplSpecQuestion.maxScore * (tplSpecAnswer.tplSpecQuestion.weightage)}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(templateSpecBackingBean.hasWeightage(templateSpecBean) ? CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT : CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}" />
					</h:outputText>

				</p:column>isSpecTypeTechnical and tplSpecAnswer.autoScore eq null
			</p:row>
			<p:row>
					<br />
				<p:column styleClass="ui-grid-col-12" colspan="2">
					<h:outputText
						value="#{lbl['lbl.sc.spec.score.formula.weightage.popup.1']}" />
					<br />
					<h:outputText
						value="#{lbl['lbl.sc.spec.score.formula.weightage.popup.2']}" />
				</p:column>
			</p:row>

		</p:panelGrid>


	</p:dialog>
</ui:composition>
