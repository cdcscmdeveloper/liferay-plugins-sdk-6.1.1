<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:remove>#29187 Start Vinod</ui:remove>
	<ui:param name="isManSpecAndCompliance" value="#{evaluationBackingBean.displayMandatorySpecAndComplianceColumn(templateSpecBean)}" /> 
	<ui:param name="isRenderZone" value="#{evaluationBackingBean.renderZoneForFinancial()}" /> 
	<ui:remove>#29187 End Vinod</ui:remove>
	<ui:decorate template="specColumnQuestionViewHeader.xhtml">
	<ui:define name="otherHeaderSection">
	<!-- Bug #32378 Farid Start related to #21695-->
	<ui:param name="notofferAll" value= "#{!isSqSpec and !tplSpecAnswer.notOfferAll}" /> 
	<!-- Bug #32378 Farid End related to #21695--> 
	<ui:param name="specificationRequired" value="#{isSpecTypeTechnical or isSqSpec or (isSpecTypeFinancial and !isSpecificationReq)}"></ui:param>
	<ui:param name="remarklbl" value="#{isSqSpec ? 'lbl.sc.supplier.offer' : 'lbl.tpl.spec.content.answer'}" />
		<ui:remove>#29187 Start Vinod Added isRenderZone Vinod</ui:remove>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:80px;" rendered="#{isSpecTypeFinancial and isZonal and isRenderZone}" headerText="#{lbl['lbl.sc.zone']}">
		</p:column>
		<ui:remove>#29187 End Vinod</ui:remove>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:82px;white-space:normal;text-align:right;" rendered="#{isEstCostReq and isSpecTypeFinancial}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.total']}" />
			<ac:iconTooltip value="#{lbl['lbl.tpl.spec.content.estimate.total.tooltip']}" />
		</f:facet>
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:70px; white-space:normal; text-align:right;" rendered="#{isSpecTypeFinancial}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.tpl.spec.content.unit.price']}" />
			<ac:iconTooltip value="#{lbl['lbl.tpl.spec.content.unit.price.tooltip']}" />
		</f:facet>
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:82px; white-space:normal; text-align:right;" rendered="#{isItemTypeService and isSpecTypeFinancial and !isDurationByItem}" headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
		</p:column>
		<ui:remove>#29187 Start Vinod</ui:remove>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:100px;" headerText="#{lbl['lbl.tpl.spec.content.scoring.settings.mandatory.specification']}" rendered="#{isScoringReq and isManSpecAndCompliance}">
		</p:column>
		<ui:remove>#29187 End Vinod</ui:remove>
	<!-- #33859 - start -->
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:82px; white-space:pre-line !important; #{isSpecTypeFinancial ? 'text-align:right;' : ''}" headerText="#{lbl[isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : remarklbl]}">
		</p:column>
	<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:100px; white-space:pre-line !important;" headerText="#{lbl['lbl.tpl.spec.content.supplier.note']}">
	</p:column>
	<!-- #33859 - end -->
	<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:60px; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.scoring.settings.weightage']}" 
		rendered="#{templateSpecBackingBean.hasWeightage(templateSpecBean)}">
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:50px; white-space:normal; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.system.score']}" rendered="#{isScoringReq}">
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:50px; white-space:normal; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.user.score']}" rendered="#{isScoringReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"/>
		</f:facet>
		</p:column>
		<ui:remove>#29187 End Vinod</ui:remove>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:10%; white-space:normal;" rendered="#{isScoringReq and isManSpecAndCompliance}">
			<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.tec.compliance']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.tpl.spec.content.scoring.compliance.tooltip']}" />
			</f:facet>
		</p:column>
		<ui:remove>#29187 End Vinod</ui:remove>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:130px;" headerText="#{lbl['lbl.tpl.spec.content.comment']}">
		</p:column>
	</ui:define>
	</ui:decorate>
	<ui:decorate template="specColumnQuestionView.xhtml">
		<ui:define name="qtySection">
			<p:column style="width:60px;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.quantity']}">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}" rendered="#{isSpecTypeFinancial}" />
				</f:facet>
				
				<h:panelGroup rendered="#{isPriceTypeTier and isSpecTypeFinancial}">
					<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.fromQty}" rendered="#{isQuestionTypeItem}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{isQuestionTypeItem and empty tplSpecAnswer.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{isQuestionTypeItem and !empty tplSpecAnswer.tplSpecTierQty.toQty}" />
					<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.toQty}" rendered="#{isQuestionTypeItem and !empty tplSpecAnswer.tplSpecTierQty.toQty}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
				<h:panelGroup rendered="#{((!isPriceTypeTier and isSpecTypeFinancial) or !isSpecTypeFinancial) and !isRepeated}">
					<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.clQuantity}" rendered="#{isQuestionTypeItem  and (empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone)}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<h:outputText value="#{tplSpecAnswer.tplSpecZoneQty.qty}" rendered="#{isQuestionTypeItem and isSpecTypeFinancial and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<p:commandButton id="zoneQtyBtn" icon="ui-icon-pencil"
						style="background-color:transparent !important; border:0px none;"
						action="#{templateSpecBackingBean.zoneQtyPopupAction(templateSpecBean)}"
						partialSubmit="true" process="@this"
						update="@([id$=zoneQtyPopup])"
						rendered="#{isQuestionTypeItem and (isSpecTypeTechnical or isSqSpec)and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}">
						<f:setPropertyActionListener
							target="#{templateSpecBean.selectedSpecQuestion}"
							value="#{question}" />
						<f:setPropertyActionListener
							target="#{templateSpecBean.specComponentId}"
							value="#{templateSpecId}" />
					</p:commandButton>
				</h:panelGroup>
			</p:column>
			
			<ui:remove>#29187 Start Vinod Added isRenderZone</ui:remove>
			<p:column style="width:80px;" rendered="#{isSpecTypeFinancial and isZonal and isRenderZone}">
				<p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl}" />
					<h:outputText value="#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl.zoneName}" />
				</p:commandLink>
			</p:column> 
			<ui:remove>#29187 End Vinod</ui:remove>
		</ui:define>
	</ui:decorate>
	
	<p:column style="width:82px;white-space:normal;text-align:right;" rendered="#{isEstCostReq and isSpecTypeFinancial}">
		
		<f:facet name="footer">
			<h:outputText id="totalEstAmount" 
				styleClass="calcEstAmount" 
				value="#{templateSpecBackingBean.calcGrandTotalEstAmount(templateSpecBean)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<ui:param name="prevSpecZoneDtl" value="#{isZonal and row > 0 ? templateSpecBean.specAnswerList[row-1].tplSpecSuppAnswer.tplSpecZoneDtl : null}" />
		<ui:param name="isZoneRepeated" value="#{prevSpecZoneDtl != null ? prevSpecZoneDtl.specZoneId == tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl.specZoneId : !isZonal}" />
		
		<h:outputText value="#{templateSpecBackingBean.getEstimationCostByAnswer(tplSpecAnswer)}"
			rendered="#{!isRepeated or !isZoneRepeated}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</h:outputText>
	</p:column>
	<p:column style="width:70px; white-space:normal; text-align:right;" rendered="#{isSpecTypeFinancial}">
		
		<h:outputText value="#{tplSpecAnswer.ratePerUom}"
			rendered="#{isQuestionTypeItem}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</h:outputText>
	</p:column>	
	<p:column style="width:82px; white-space:normal; text-align:right;" rendered="#{isItemTypeService and isSpecTypeFinancial and !isDurationByItem}">
		<f:facet name="footer">
			<h:outputText value="#{templateSpecBean.specMaster.totalAmountPerYear}" rendered="#{isSpecTypeFinancial and isDurationYear}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:outputText value="#{tplSpecAnswer.amountPerYear}" rendered="#{isQuestionTypeItem and isDurationYear}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
		</h:outputText>
		<h:panelGroup rendered="#{!isDurationYear}">
			<h:outputText value="#{lbl['lbl.txt.na']}"/>
		</h:panelGroup>
	</p:column>
	<!-- Bug #32378 Farid Start related to #21695 -->
	<p:column style="width:82px; white-space:pre-line; #{isSpecTypeFinancial ? 'text-align:right;' : ''}"> <!-- 20220920@syazani - Bug #33859 -->
		<f:facet name="footer">
			<h:outputText value="#{templateSpecBackingBean.calcGrandTotalAmount(templateSpecBean)}" rendered="#{isSpecTypeFinancial}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:panelGroup>
			<h:outputText value="#{tplSpecAnswer.answerText}" rendered="#{isAnswerTypeText and notofferAll or isSqSpec and isAnswerTypeText}" />
			<h:outputText value="#{tplSpecAnswer.answerNumeric}" rendered="#{isAnswerTypeNumeric and notofferAll or isSqSpec and isAnswerTypeNumeric}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
			<!-- Bug #32389 Farid Start-->
			<h:outputText value="#{tplSpecAnswer.answerCompliance ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}" rendered="#{isAnswerTypeDropdown and notofferAll or isSqSpec and isAnswerTypeDropdown}" />
			<!-- Bug #32389 Farid end-->
		</h:panelGroup>
	</p:column>
	<!-- Bug #32378 Farid End related to #21695 -->
	<p:column style="width:100px;white-space:pre-line;"> <!-- 20220920@syazani - Bug #33859 -->
		<ui:param name="answerRemark" value="#{fn:replace(tplSpecAnswer.answerRemark,',',',  ')}"></ui:param>
		<!-- #{answerRemark} -->
		<h:outputText style="word-wrap: break-word; " value="#{answerRemark}" /><!-- Bug #34976 Added Vinod -->
	</p:column>
</ui:composition>
