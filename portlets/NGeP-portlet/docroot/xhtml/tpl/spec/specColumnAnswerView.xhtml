<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:decorate template="specColumnQuestionView.xhtml">
		<ui:define name="answerSection">
			<p:column style="width:55px;" rendered="#{isSpecTypeFinancial}" headerText="#{lbl['lbl.sc.tpl.rate.per.uom']}">
				<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{tplSpecAnswer.ratePerUom}"
					rendered="#{isQuestionTypeItem}" disabled="true" />
			</p:column>
		</ui:define>
	</ui:decorate>
	
	<p:column style="width:95px;" rendered="#{isItemTypeService and isSpecTypeFinancial}" headerText="#{lbl['lbl.sc.tpl.amount.per.year']}">
		<p:inputText style="min-width:0px !important" size="13" dir="rtl" value="#{tplSpecAnswer.amountPerYear}"
			rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl[isSpecTypeFinancial ? 'lbl.sc.tpl.total.amount' : 'lbl.sc.tpl.answer']}">
		<h:panelGroup>
			<p:inputText size="19" value="#{tplSpecAnswer.answerText}" rendered="#{isAnswerTypeText}" disabled="true" />
			<p:inputText size="19" dir="rtl" value="#{tplSpecAnswer.answerNumeric}" rendered="#{isAnswerTypeNumeric}" disabled="true" />
			<p:inputText size="19" value="#{tplSpecAnswer.answerCompliance ? 'Yes' : 'No'}" rendered="#{isAnswerTypeDropdown}" disabled="true" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.note']}">
		<p:inputText size="19" value="#{tplSpecAnswer.answerRemark}" disabled="true" />
	</p:column>
</ui:composition>
