<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:60px;" rendered="#{isSpecTypeFinancial}">
		<h:outputLabel value="Rate per UOM" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.tplSpecAnswer.ratePerUom}"
			rendered="#{isQuestionTypeItem and !empty question.tplSpecAnswer}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:60px;" rendered="#{isItemTypeService and isSpecTypeFinancial}">
		<h:outputLabel value="Amount/Year" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.tplSpecAnswer.amountPerYear}"
			rendered="#{isQuestionTypeItem and !empty question.tplSpecAnswer}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="#{isSpecTypeFinancial ? 'Total Price' : 'Answer'}" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<h:panelGroup rendered="#{!isQuestionTypeHeader and !empty question.tplSpecAnswer}">
			<p:inputText value="#{question.tplSpecAnswer.answerText}" rendered="#{isAnswerTypeText}" disabled="true" />
			<p:inputText value="#{question.tplSpecAnswer.answerNumeric}" rendered="#{isAnswerTypeNumeric}" disabled="true" />
			<p:inputText value="#{question.tplSpecAnswer.answerCompliance ? 'Yes' : 'No'}" rendered="#{isAnswerTypeDropdown}" disabled="true" />
		</h:panelGroup>
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Supplier Remark" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText value="#{question.tplSpecAnswer.answerRemark}" rendered="#{!isQuestionTypeHeader and !empty question.tplSpecAnswer}" disabled="true" />
	</p:column>
</ui:composition>
