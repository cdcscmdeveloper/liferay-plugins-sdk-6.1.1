<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
 <!-- START #21695 Bug #31544 farid-->	
<table style="width: 425px;">
<tr>
	<td>
		<h:outputText style="float: left;" styleClass="instruction" escape="false" value="#{lbl['lbl.tpl.qty.instruction.tooltip']}"
		rendered="#{isSpecificationReq and isSpecTypeTechnical}"/>
		<h:outputText style="float: left;" styleClass="instruction" escape="false" value="#{lbl['lbl.tpl.qty.instruction.tooltip.financial']}" 
		rendered="#{isSpecificationReq and !isSpecTypeTechnical}"/>	
		<h:outputText></h:outputText>
	</td>
</tr>

<tr>
	<td>
<!-- END #21695 Bug #31544 farid-->	
		<p:dataTable id="specZoneQtyTbl" 
		var="tplSpecZoneQty"
		rowIndexVar="rowIndex"
		value="#{templateSpecBean.selectedSpecQuestion.tplSpecZoneQties}"
		rowKey="#{tplSpecZoneQty}">
							
		<ac:paginator for="specZoneQtyTbl" />
		
		<p:column headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}">
			#{tplSpecZoneQty.tplSpecZoneDtl.zoneName}
		</p:column>
		<p:column style="width:95px;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}"/>
			</f:facet>
			<p:inputText id="zoneQty"
				style="min-width:0px !important;width:90px; text-align:right;"
				value="#{tplSpecZoneQty.qty}" required="true"
				maxlength="14" label="#{lbl['lbl.tpl.spec.content.quantity']}"
				disabled="#{!isQuestion or !editable or (isSpecificationReq and !isSpecTypeTechnical)}">
				<p:ajax partialSubmit="true" process="@this" 
				    listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, templateSpecBean.selectedSpecQuestion.tplSpecAnswers[0], isItemTypeService)}"
					update="@this, zoneQtyMsg, @(.calcAmount)" />
 <!-- START #21695  & Bug #28948 farid-->	
 			<c:choose>
 					<c:when test="#{!templateSpecBackingBean.managedBean.secretaryValidate}">
 						<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, templateSpecBean.selectedSpecQuestion.clUom.uomCode)}"
						maxIntegerDigits="10"/>
 					</c:when>
 					<c:otherwise>
	 					<f:attribute name="min" value="0"></f:attribute>
	 					<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, templateSpecBean.selectedSpecQuestion.clUom.uomCode)}"
							maxIntegerDigits="10"/>
 					</c:otherwise>
 			</c:choose>
 <!-- END #21695  & Bug #28948 farid-->	
			</p:inputText>
				<p:message id="zoneQtyMsg" for="zoneQty" display="icon" />
			</p:column>
		</p:dataTable>
	</td>
</tr>
</table>
<!-- END #21695 farid-->
</ui:composition>
