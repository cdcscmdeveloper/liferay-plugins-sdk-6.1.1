<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:dataTable id="specZoneQtyTbl" 
		var="tplSpecZoneQty"
		rowIndexVar="rowIndex"
		value="#{templateSpecBean.selectedSpecQuestion.tplSpecZoneQties}"
		rowKey="#{tplSpecZoneQty}">
							
		<ac:paginator for="specZoneQtyTbl" />
		
		<p:column headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}">
			#{tplSpecZoneQty.tplSpecZoneDtl.zoneName}
		</p:column>
		<p:column style="width:80px;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}"/>
			</f:facet>
			<p:inputText id="zoneQty"
				style="min-width:0px !important;width:35px; text-align:right;"
				value="#{tplSpecZoneQty.qty}" required="true"
				maxlength="14" label="#{lbl['lbl.tpl.spec.content.quantity']}"
				disabled="#{!isQuestion or !editable or (isSpecificationReq and !isSpecTypeTechnical)}">
				<p:ajax partialSubmit="true" process="@this"
					update="@this, zoneQtyMsg" />
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, templateSpecBean.selectedSpecQuestion.clUom.uomCode)}"
					maxIntegerDigits="10" />
			</p:inputText>
			<p:message id="zoneQtyMsg" for="zoneQty" display="icon" />
		</p:column>
	</p:dataTable>
</ui:composition>
