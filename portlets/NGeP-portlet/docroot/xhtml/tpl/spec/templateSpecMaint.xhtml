<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="resourceSection">
	</ui:define>
	
	<ui:define name="contentSection">
	<h:outputText value="New Template Document" styleClass="pageTitle" />
		
		<table width="100%">
			<tr>
				<td style="text-align: right"><p:commandButton
						value="New Table" onclick="pp1.show();">
					</p:commandButton> </td>
			</tr>
		</table>
		
		<p:dialog header="Create New Section" widgetVar="pp1" showEffect="fade" hideEffect="fade" modal="true" height="450" width="600" resizable="false">  
		
			<h:panelGrid id="cspg" columns="2">
				
				<h:outputLabel value="Number Of columns: " />
				<h:inputText value="#{templateSpecBackingBean.numberOfColumns}" />
				<h:outputLabel value="Answer: " />
				<h:selectBooleanCheckbox value="#{templateSpecBackingBean.answer}" />
				<h:outputLabel value="Additional Answer: " />
				<h:selectBooleanCheckbox value="#{templateSpecBackingBean.lastAnswer}" />
				
			</h:panelGrid>
			
			<p:commandButton 
				value="Create" 
				action="#{templateSpecBackingBean.createSection}"
				onclick="pp1.hide();"
				process="cspg"
				update="spg">
			</p:commandButton>
			
		</p:dialog>

	</ui:define>
	
	<ui:define name="footerSection"></ui:define>
	
</ui:composition>
