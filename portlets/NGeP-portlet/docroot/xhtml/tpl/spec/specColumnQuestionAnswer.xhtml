<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<ui:param name="isFulfilmentTypeOneOff"
		value="#{question.clFulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff}" />
	<ui:param name="isShowService"
		value="#{(!isFulfilmentTypeReq or (isFulfilmentTypeReq and !isFulfilmentTypeOneOff))}" />
	<ui:param name="widthPixes"
		value="#{(isSpecificationReq and !isItemTypeService)?'170px':'100px'}" />
		<ui:param name="specificationrequired" value="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq) or isSqSpec }"></ui:param>


	<p:columnGroup type="header">
		<p:row>
			<p:column colspan="1">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{updateSpec}" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.item']}" />
				</f:facet>

			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:98px;"
				rendered="#{isItemTypeService and isFulfilmentTypeReq}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText
						value="#{lbl['lbl.tpl.spec.content.fulfilment.type']}" />
				</f:facet>

			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:120px;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.uom']}" />
				</f:facet>


			</p:column>
			<c:if test="#{isItemTypeService}">
				<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:70px;white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" />
					</f:facet>

				</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:60px;white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" />
					</f:facet>

				</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:60px;white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" />
					</f:facet>

				</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:63px;white-space:normal;"
					rendered="#{isDurationByItem}">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.duration.month']}" />
					</f:facet>

				</p:column>
			</c:if>
			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:#{widthPixes}"
				rendered="#{!isItemTypeService}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.price.type']}" />
					<ac:iconTooltip id="priceType#{row}TP"
						value="#{lbl['lbl.tpl.spec.content.price.type.tooltip']}" />
				</f:facet>

			</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:170px;white-space:normal">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}" />
				</f:facet>
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:97px; white-space:normal;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.unit.price']}" />
				</f:facet>
				
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:90px;white-space:normal;text-align:right;"
				rendered="#{isItemTypeService}"
				headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">


			</p:column>

			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:115px; text-align:right; white-space:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.total.amount']}">
				


			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}" style="width:40px;" rendered="#{newable}">
			<f:facet name="header">
				 <p:commandButton id="addTopBtn" icon="ui-icon-add"
					style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
					oncomplete="#{templateSpecId}addedQuestionsAndAnswers()"
					title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}" /> 
						
			</f:facet>
		</p:column>
		</p:row>
		<p:row rendered="#{specificationrequired}">
			<p:column colspan="1"
				rendered="#{specificationrequired }">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.specification']}" />
				</f:facet>

			</p:column>
		</p:row>
	</p:columnGroup>

	<p:column style="width:170px;">

		<h:panelGroup id="qtyPG" rendered="#{isQuestionTypeItem}">
			<p:inputText id="qty"
				style="min-width:0px !important;width:90px; text-align:right;"
				value="#{question.clQuantity}" required="#{isValidationReq}"
				maxlength="14" label="#{lbl['lbl.tpl.spec.content.quantity']}"
				rendered="#{empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone}">
				<p:ajax partialSubmit="true" process="@this"
					update="@this, qtyMsg, ansYearPG, ansPG, @(.calcAmount)"
					listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, question.tplSpecAnswers[0], isItemTypeService)}" />
				<ac:validateNumber maxIntegerDigits="10" />
				<f:attribute name="pattern"
					value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
			</p:inputText>
			<ui:param name="tierQtyTooltip"
				value="#{(isQuestionTypeItem and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone)? 'lbl.tpl.spec.zone.tier.qty.tooltip':'lbl.tpl.spec.content.tier.dtls.tooltip'}" />
			<p:commandLink id="tierQtyBtn"
				action="#{templateSpecBackingBean.tierQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this,qty"
				update="@([id$=tierQtyPopup])"
				rendered="#{!isPriceTypeAllStandard and !empty question.clPriceTypeCode.parameterId}"
				title="#{lbl[tierQtyTooltip]}">
				<p:graphicImage value="/css/images/design/ico-price.png"
					style="vertical-align:middle" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandLink>
<!-- #21695 Farid tooltip -->			
			<p:commandButton id="zoneQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.zoneQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this" update="@([id$=zoneQtyPopup])"
				rendered="#{!empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}"
				title="#{lbl['lbl.tpl.qty.instruction.tooltip']}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
			<p:message id="qtyMsg" for="qty" display="icon" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:97px; white-space:normal;">
		<f:facet name="footer">
			<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}"
				rendered="#{isAllPriceTypesStandard}" />
		</f:facet>

		<h:panelGroup id="ratePerUomPG">
			<p:inputText id="ratePerUom"
				style="min-width:0px !important;width:86px; text-align:right;"
				value="#{question.tplSpecAnswers[0].ratePerUom}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}"
				required="#{isValidationReq}" maxlength="19"
				label="#{lbl['lbl.tpl.spec.content.unit.price']}">
				<p:ajax event="blur" partialSubmit="true" process="@this"
					update="@this, ansYearPG, ansPG, @(.calcAmount)"
					listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, question.tplSpecAnswers[0], isItemTypeService)}" />
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
					maxIntegerDigits="14" />
			</p:inputText>
			<p:message id="ratePerUomMsg" for="ratePerUom" display="icon" />
			<p:commandButton id="ratePerUomBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.zoneTierPricePopupAction(templateSpecBean)}"
				oncomplete="#{zoneTierPricePopup}.show();" partialSubmit="true"
				process="@this" update="@([id$=zoneTierPricePopup])"
				rendered="#{isQuestionTypeItem and !isPriceTypeStandard and !empty question.clPriceTypeCode.parameterCode}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
			</p:commandButton>
		</h:panelGroup>
	</p:column>

	<p:column style="width:90px;white-space:normal;text-align:right;"
		rendered="#{isItemTypeService}">
		<f:facet name="footer">
			<h:outputText id="totalAmountPerYr" rendered="#{isDurationYear}" styleClass="calcAmount"
				value="#{templateSpecBean.specMaster.totalAmountPerYear}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:panelGroup id="ansYearPG" rendered="#{isDurationYear}">
			<h:outputText value="#{question.tplSpecAnswers[0].amountPerYear}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
		<h:panelGroup rendered="#{!isDurationYear}">
			<h:outputText value="#{lbl['lbl.txt.na']}"/>
		</h:panelGroup>
	</p:column>

	<p:column style="width:115px; text-align:right; white-space:normal;">

		<f:facet name="footer">
			<h:outputText id="totalAmount" styleClass="calcAmount"
				value="#{templateSpecBackingBean.calcGrandTotalAmount(templateSpecBean)}"
				rendered="#{isAllPriceTypesStandard}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:panelGroup id="ansPG">
			<h:outputText id="answerNumText"
				value="#{question.tplSpecAnswers[0].answerNumeric}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<p:column style="width:40px;" rendered="#{newable}">


		<p:commandButton value="#{lbl['lbl.btn.assign']}"
			rendered="#{isQuestionTypeItem and isWorkflowStatus}"
			action="#{codificationBackingBean.assignProductCode(null, question, false)}" />

		<p:commandButton id="addBtn" icon="ui-icon-add"
			style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
			partialSubmit="true" process="@this"
			title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}" />
		<p:menu overlay="true" trigger="addBtn" my="left top" at="left bottom">
			<p:menuitem value="#{lbl['lbl.tpl.spec.content.item']}"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"
				update="questionTbl" partialSubmit="true" process="questionTbl"
				oncomplete="#{addItemSpecOnComplete}">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.tpl.spec.content.specification']}"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItemSpec)}"
				update="questionTbl" partialSubmit="true" process="questionTbl"
				oncomplete="#{addItemSpecOnComplete}">
			</p:menuitem>
		</p:menu>
		<p:commandButton id="#{templateSpecId}delBtn" icon="ui-icon-delete"
			style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
			partialSubmit="true" process="questionTbl" update="questionTbl"
			action="#{templateSpecBackingBean.deleteConfirmationAction(templateSpecBean, question)}"
			title="#{lbl['lbl.tpl.spec.content.btn.delete.tooltip']}">
			<f:setPropertyActionListener
				target="#{templateSpecBean.specComponentId}"
				value="#{templateSpecId}" />
		</p:commandButton>

	</p:column>

</ui:composition>
