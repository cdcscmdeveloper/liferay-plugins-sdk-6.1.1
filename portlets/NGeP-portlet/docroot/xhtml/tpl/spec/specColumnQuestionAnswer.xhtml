<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:column style="width:97px;">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.unit.price']}"/>
		</f:facet>
		<f:facet name="footer">
			<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}" rendered="#{isAllPriceTypesStandard}" />
		</f:facet>
		
		<h:panelGroup id="ratePerUomPG">
			<p:inputText id="ratePerUom" style="min-width:0px !important;width:86px; text-align:right;"
				value="#{question.tplSpecAnswers[0].ratePerUom}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}" required="true" maxlength="19"
				label="#{lbl['lbl.tpl.spec.content.unit.price']}">
				<p:ajax event="blur" partialSubmit="true" process="@this" update="@this, ansYearPG, ansPG, @(.calcAmount)" listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, question.tplSpecAnswers[0], isItemTypeService)}" />
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
			</p:inputText>
			<p:message id="ratePerUomMsg" for="ratePerUom" display="icon" />
			<p:commandButton id="ratePerUomBtn" icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;"  
				action="#{templateSpecBackingBean.zoneTierPricePopupAction(templateSpecBean)}"
				oncomplete="#{zoneTierPricePopup}.show();"
				partialSubmit="true" process="@this" update="@([id$=zoneTierPricePopup])"
				rendered="#{isQuestionTypeItem and !isPriceTypeStandard and !empty question.clPriceTypeCode.parameterCode}">
				<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			</p:commandButton>
		</h:panelGroup>
	</p:column>
	<p:column style="width:90px;white-space:normal;text-align:right;" rendered="#{isItemTypeService}" headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
		<f:facet name="footer">
			<h:outputText id="totalAmountPerYr" 
				styleClass="calcAmount" 
				value="#{templateSpecBean.specMaster.totalAmountPerYear}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:panelGroup id="ansYearPG">
			<h:outputText 
				value="#{question.tplSpecAnswers[0].amountPerYear}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<p:column style="width:115px; text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.total.amount']}">
		<f:facet name="footer">
			<h:outputText id="totalAmount" 
				styleClass="calcAmount" 
				value="#{templateSpecBackingBean.calcGrandTotalAmount(templateSpecBean)}"
				rendered="#{isAllPriceTypesStandard}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		
		<h:panelGroup id="ansPG">
			<h:outputText id="answerNumText" 
				value="#{question.tplSpecAnswers[0].answerNumeric}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<p:column style="width:40px;" rendered="#{newable}">
		<f:facet name="header">
			<p:commandButton id="addTopBtn" icon="ui-icon-add" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,-1,TplSpecConst.questionTypeItem)}"  
				update="questionTbl" partialSubmit="true" process="questionTbl"
				title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}" />
		</f:facet>
		<p:commandButton id="addBtn" icon="ui-icon-add" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
			partialSubmit="true" process="@this"
			title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}" />
		<p:menu overlay="true" trigger="addBtn" my="left top" at="left bottom">
			<p:menuitem value="#{lbl['lbl.tpl.spec.content.item']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"  
				update="questionTbl" partialSubmit="true" process="@this">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.tpl.spec.content.specification']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItemSpec)}" 
				update="questionTbl" partialSubmit="true" process="@this">
			</p:menuitem>
		</p:menu>
		<p:commandButton id="delBtn" icon="ui-icon-delete" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
			partialSubmit="true" process="@this" oncomplete="#{delConfirmPopup}.show();"
			title="#{lbl['lbl.tpl.spec.content.btn.delete.tooltip']}">
			<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.tplSpecQuestions}" value="#{templateSpecBean.specMaster.tplSpecQuestions}" />
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion.selected}" value="#{true}" />
		</p:commandButton>
	</p:column>
</ui:composition>
