<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isFulfilmentTypeOneOff"
		value="#{question.clFulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff}" />
	<ui:param name="isShowService"
		value="#{(!isFulfilmentTypeReq or (isFulfilmentTypeReq and !isFulfilmentTypeOneOff))}" />
	<ui:param name="widthPixes"
		value="#{(isSpecificationReq and !isItemTypeService)?'170px':'100px'}" />
	<ui:param name="specificationrequired"
		value="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq) or isSqSpec }"></ui:param>


	<p:columnGroup type="header">
		<p:row>
			<p:column colspan="1">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{updateSpec}" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.item']}" />
				</f:facet>

			</p:column>
			<!-- #25725 start -->
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:180px;"
				rendered="#{isItemTypeService and isFulfilmentTypeReq}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText
						value="#{lbl['lbl.tpl.spec.content.fulfilment.type']}" />						
						<!-- #36238 - start @zaim add id to tooltip to prevent duplicate id in server -->
						<ac:iconTooltip id="fulfilmentType#{row}TP"
						value="#{lbl['lbl.sc.fulfilment.type.tooltip']}" />
						<!-- #25725 & 36238 end -->
				</f:facet>

			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:120px;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.uom']}" />
				</f:facet>


			</p:column>
			<c:if test="#{isItemTypeService}">
				<p:column rowspan="#{specificationrequired ? 2 : 1}"
					style="width:70px;white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" />
					</f:facet>

				</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}"
					style="width:60px;white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" />
					</f:facet>

				</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}"
					style="width:60px;white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" />
					</f:facet>

				</p:column>
				<p:column rowspan="#{specificationrequired ? 2 : 1}"
					style="width:63px;white-space:normal;"
					rendered="#{isDurationByItem}">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText
							value="#{lbl['lbl.tpl.spec.content.duration.month']}" />
					</f:facet>

				</p:column>
			</c:if>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:#{widthPixes}" rendered="#{!isItemTypeService}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.price.type']}" />
					<ac:iconTooltip id="priceType#{row}TP"
						value="#{lbl['lbl.tpl.spec.content.price.type.tooltip']}" />
				</f:facet>

			</p:column>
			<ui:param name="widthPixes"
				value="#{(isSpecificationReq and !isItemTypeService)?'100px':'85px'}" />
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:170px;white-space:normal">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}" />
				</f:facet>
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:67px; white-space: normal;"
				rendered="#{!isItemTypeService and isDeliveryTermReq}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.delivery.term']}" />
					<ac:iconTooltip id="deliveryTerm#{row}TP"
						value="#{lbl['lbl.sc.delivery.term.tooltip']}" />
				</f:facet>
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:67px; white-space: normal;"
				rendered="#{isItemTypeService and isDeliveryTermReq and isSqSpec}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.service.term']}" />
					<ac:iconTooltip id="serviceTerm#{row}TP"
						value="#{lbl['lbl.sc.service.term.tooltip']}" />
				</f:facet>
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:125px;" rendered="#{isSpecificationReq and !isSqSpec}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText
						value="#{lbl[isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : 'lbl.tpl.spec.content.answer.schema']}" />
				</f:facet>
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:56px;white-space:normal;"
				rendered="#{isEstCostReq and (!isSpecificationReq or isSqSpec)}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.cost']}" />
					<ac:iconTooltip id="itemTotalIntendedPrice#{row}TP"
						value="#{lbl['lbl.tpl.spec.total.intended.price.tooltip']}" />
				</f:facet>
			</p:column>
			<p:column rowspan="#{specificationrequired ? 2 : 1}"
				style="width:40px;" rendered="#{newable or removable}">
				<f:facet name="header">
					<p:commandButton id="addTopBtn" icon="ui-icon-add"
						rendered="#{newable}"
						style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
						oncomplete="#{templateSpecId}addedQuestionsTechnical()"
						title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}" />
				</f:facet>
			</p:column>
		</p:row>
		<p:row rendered="#{specificationrequired}">
			<p:column colspan="1" rendered="#{specificationrequired }">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.tpl.spec.content.specification']}" />
				</f:facet>

			</p:column>
		</p:row>
	</p:columnGroup>
	<ui:param name="widthPixes"
		value="#{(isSpecificationReq and !isItemTypeService)?'100px':'85px'}" />
	<p:column style="width:170px;white-space:normal">

		<h:panelGroup id="qtyPG" rendered="#{isQuestionTypeItem}">
			<p:inputText id="qty"
				style="min-width:0px !important;text-align:right;width:90px;"
				value="#{question.clQuantity}" required="#{isValidationReq}"
				disabled = "#{simpleQuoteBackingBean.managedBean.qtyNonEditable}"
				maxlength="14" label="#{lbl['lbl.tpl.spec.content.quantity']}"
				rendered="#{empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone}"
				onkeypress="if (event.keyCode == 13) { return false; }"> <!-- #32362 -->
				<p:ajax partialSubmit="true" process="@this"
					update="@this, qtyMsg, @(.calcAmount)" />
				<ac:validateNumber maxIntegerDigits="10" />
				<f:attribute name="pattern"
					value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
			</p:inputText>
			<ui:param name="tierQtyTooltip"
				value="#{(isQuestionTypeItem and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone)? 'lbl.tpl.spec.zone.tier.qty.tooltip':'lbl.tpl.spec.content.tier.dtls.tooltip'}" />
			<p:commandButton id="tierQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.tierQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this,qty"
				update="@([id$=tierQtyPopup])"
				rendered="#{!isPriceTypeAllStandard and !empty question.clPriceTypeCode.parameterId}"
				title="#{lbl[tierQtyTooltip]}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
<!-- #21695 FARID tooltip -->
			<p:commandButton id="zoneQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.zoneQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this" update="@([id$=zoneQtyPopup])"
				rendered="#{!empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}"
				title="#{lbl['lbl.tpl.qty.instruction.tooltip']}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
			<p:message id="qtyMsg" for="qty" display="icon" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:67px; white-space: normal;"
		rendered="#{!isItemTypeService and isDeliveryTermReq}">

		<p:inputText id="deliveryTerm"
			style="min-width:0px !important;width:calc(100% - 40px); text-align:right;"
			value="#{question.clDeliveryTerm}" rendered="#{isQuestionTypeItem}"
			required="#{isValidationReq}" maxlength="4" validator="#{webappBean.validateInteger}"
			label="#{lbl['lbl.tpl.spec.content.delivery.term']}"
			onkeypress="if (event.keyCode == 13) { return false; }"> <!-- #32362 -->
			<p:ajax partialSubmit="true" process="@this"
				update="@this, deliveryTermMsg" />
		</p:inputText>
		<p:spacer width="2px"></p:spacer>
		<h:outputText
			value="#{templateSpecBackingBean.getParameterDesc(question.clDeliveryTermTypeCode)}"
			rendered="#{isQuestionTypeItem}" />
		<p:message id="deliveryTermMsg" for="deliveryTerm" display="icon" />
	</p:column>
	<p:column style="width:67px; white-space: normal;"
		rendered="#{isItemTypeService and isDeliveryTermReq and isSqSpec}">

		<p:inputText id="serviceTerm"
			style="min-width:0px !important;width:calc(100% - 40px); text-align:right;"
			value="#{question.clDeliveryTerm}" rendered="#{isQuestionTypeItem}"
			required="#{isValidationReq}" maxlength="4" validator="#{webappBean.validateInteger}"
			label="#{lbl['lbl.tpl.spec.content.service.term']}"
			onkeypress="if (event.keyCode == 13) { return false; }"> <!-- #32362 -->
			<p:ajax partialSubmit="true" process="@this"
				update="@this, serviceTermMsg" />
		</p:inputText>
		<p:spacer width="2px"></p:spacer>
		<h:outputText
			value="#{templateSpecBackingBean.getParameterDesc(question.clDeliveryTermTypeCode)}"
			rendered="#{isQuestionTypeItem}" />
		<p:message id="serviceTermMsg" for="serviceTerm" display="icon" />
	</p:column>
	<p:column style="width:125px;"
		rendered="#{isSpecificationReq and !isSqSpec}">

		<h:selectOneMenu id="answerTypeId"
			value="#{question.answerTypeCode.parameterId}" style="width:calc(100% - 30px);"
			required="#{isValidationReq}"
			label="#{lbl[isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : 'lbl.tpl.spec.content.answer.schema']}"
			rendered="#{!isQuestionTypeItem}">
			<f:selectItems
				value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.answerType)}" />
			<p:ajax event="change"
				listener="#{templateSpecBackingBean.answerTypeChange(question)}"
				partialSubmit="true" process="@this" update="scoringBtnPG" />
		</h:selectOneMenu>
		<h:panelGroup id="scoringBtnPG">
			<p:commandButton id="scoringBtn"
				icon="#{empty question.maxScore ? 'ui-icon-pencil' : 'ui-icon-evaluate'}"
				style="background-color:transparent !important; border:0px none;"
				styleClass="scoringBtn"
				action="#{templateSpecBackingBean.scoringPopupAction(templateSpecBean)}"
				oncomplete="#{scoringSetPopup}.show();" partialSubmit="true"
				process="@this" update="@([id$=scoringSetPopup])"
				rendered="#{!isQuestionTypeItem and !empty question.answerTypeCode.parameterId and isScoringReq}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
			</p:commandButton>
			<p:message id="answerTypeIdMsg" for="answerTypeId" display="icon" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:56px;white-space:normal;"
		rendered="#{isEstCostReq and (!isSpecificationReq or isSqSpec)}">

		<h:panelGroup id="estPG" rendered="#{isQuestionTypeItem}"
			style="white-space:nowrap;">
			<c:if test="#{!isZonal}">
				<p:inputText id="estCost"
					style="min-width:0px !important;width:44px; text-align:right;"
					value="#{question.tplSpecEstimations[0].estimatedCost}"
					required="#{isValidationReq}" maxlength="19"
					label="#{lbl['lbl.tpl.spec.content.estimate.cost']}">
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
					<p:ajax partialSubmit="true" process="@this"
						update="@this, estCostMsg" />
				</p:inputText>
				<p:message id="estCostMsg" for="estCost" display="icon" />
			</c:if>
			<c:if test="#{isZonal}">
				<p:commandButton icon="ui-icon-pencil"
					style="background-color:transparent !important; border:0px none;"
					action="#{templateSpecBackingBean.estimationPopupAction(templateSpecBean)}"
					oncomplete="#{estimationPopup}.show();" partialSubmit="true"
					process="@this" update="@([id$=estimationPopup])">
					<f:setPropertyActionListener
						target="#{templateSpecBean.selectedSpecQuestion}"
						value="#{question}" />
				</p:commandButton>
			</c:if>
		</h:panelGroup>
	</p:column>
	<p:column style="width:40px;" rendered="#{newable or removable}">

		<c:if test="#{isSpecificationReq}">
			<p:commandButton id="addBtn" icon="ui-icon-add"
				style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
				partialSubmit="true" process="@this"
				title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}"
				rendered="#{newable}" />
			<p:menu overlay="true" trigger="addBtn" my="left top"
				at="left bottom">
				<p:menuitem value="#{lbl['lbl.tpl.spec.content.item']}"
					action="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"
					update="questionTbl" partialSubmit="true" process="questionTbl"
					oncomplete="#{addItemSpecOnComplete}">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.tpl.spec.content.specification']}"
					action="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItemSpec)}"
					update="questionTbl" partialSubmit="true" process="questionTbl"
					oncomplete="#{addItemSpecOnComplete}">
				</p:menuitem>
			</p:menu>
			<p:commandButton id="addSpecBtn" icon="ui-icon-add"
				style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
				update="questionTbl" partialSubmit="true" process="questionTbl"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItemSpec)}"
				title="#{lbl['lbl.tpl.spec.content.btn.add.spec.tooltip']}"
				rendered="#{!newable and addNewSpec}"
				oncomplete="#{addItemSpecOnComplete}" />
		</c:if>
		<c:if test="#{!isSpecificationReq}">
			<p:commandButton id="addBtn" icon="ui-icon-add" rendered="#{newable}"
				style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"
				update="questionTbl" partialSubmit="true" process="questionTbl"
				title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}"
				oncomplete="#{addItemSpecOnComplete}" />
		</c:if>
		<p:commandButton id="#{templateSpecId}delBtn" icon="ui-icon-delete"
			rendered="#{removable}"
			style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
			partialSubmit="true" process="questionTbl" update="questionTbl"
			action="#{templateSpecBackingBean.deleteConfirmationAction(templateSpecBean, question)}"
			title="#{lbl['lbl.tpl.spec.content.btn.delete.tooltip']}">
			<f:setPropertyActionListener
				target="#{templateSpecBean.specComponentId}"
				value="#{templateSpecId}" />
		</p:commandButton>
	</p:column>
</ui:composition>
