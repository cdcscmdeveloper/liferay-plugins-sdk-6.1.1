<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.item']}">	
		<p:inputText size="19" value="#{question.clItem}" rendered="#{isQuestionTypeItem}" required="true" />
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.specification']}">
		<p:inputText size="19" value="#{question.clSpecDetail}"  />
	</p:column>
	<p:column style="width:70px;" headerText="#{lbl['lbl.sc.tpl.uom']}">
		<h:selectOneMenu style="width:80px;" value="#{question.clUom.uomId}" rendered="#{isQuestionTypeItem}" required="true">
			<f:selectItems value="#{templateSpecBackingBean.uomList}" 
				var="pmUom" itemLabel="#{pmUom.uomName}" itemValue="#{pmUom.uomCode}" />
		</h:selectOneMenu>
	</p:column>
	
	<c:if test="#{isItemTypeService}">
		<p:column style="width:50px;" headerText="#{lbl['lbl.sc.tpl.frequency.per.uom']}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomFrequency}" rendered="#{isQuestionTypeItem}" required="true" />
		</p:column>
		<p:column style="width:55px;" headerText="#{lbl['lbl.sc.tpl.no.uom.per.day']}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerDay}" rendered="#{isQuestionTypeItem}" required="true" />
		</p:column>
		<p:column style="width:60px;" headerText="#{lbl['lbl.sc.tpl.no.uom.per.month']}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerMonth}" rendered="#{isQuestionTypeItem}" required="true" />
		</p:column>
		<p:column style="width:70px;" headerText="#{lbl['lbl.sc.tpl.duration.month']}" rendered="#{isDurationByItem}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clDurationMonth}" rendered="#{isQuestionTypeItem}" required="true" />
		</p:column>
	</c:if>
	
	<p:column style="width:50px;" headerText="#{lbl['lbl.sc.tpl.quantity']}">
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clQuantity}" rendered="#{isQuestionTypeItem}" required="true" />
	</p:column>	
	<p:column style="width:50px;" headerText="#{lbl['lbl.sc.tpl.mandatory']}">
		<p:selectBooleanCheckbox value="#{question.clAnswerRequired}" />
	</p:column>
	<p:column style="width:155px;" headerText="#{lbl['lbl.sc.tpl.answer']}">
		<h:selectOneMenu id="answerTypeId" value="#{question.answerTypeCode.parameterId}" required="true">
			<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.answerType)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.answerTypeChange(question)}" update="scoringBtn" />
		</h:selectOneMenu>	
		<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;" id="scoringBtn" disabled="#{(isAnswerTypeText)}" 
			oncomplete="scoringSetting.show();"
			partialSubmit="true" process="@this" update="@this">
			<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.selectedIndex}" value="#{row}" />
		</p:commandButton>
	</p:column>
	<p:column style="width:90px;">
		<f:facet name="header">
			<p:menuButton value="#{lbl['lbl.sc.tpl.btn.add']}">
				<p:menuitem value="#{lbl['lbl.sc.tpl.item']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster.tplSpecQuestions,-1,TplSpecConst.questionTypeItem)}"  
					update="questionTbl" partialSubmit="true" process="questionTbl">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.sc.tpl.specification']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster.tplSpecQuestions,-1,TplSpecConst.questionTypeItemSpec)}" 
					update="questionTbl" partialSubmit="true" process="questionTbl">
				</p:menuitem>
			</p:menuButton>
		</f:facet>
		<p:menuButton value="#{lbl['lbl.sc.tpl.btn.add']}">
			<p:menuitem value="#{lbl['lbl.sc.tpl.item']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"  
				update="questionTbl" partialSubmit="true" process="questionTbl">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.sc.tpl.specification']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItemSpec)}" 
				update="questionTbl" partialSubmit="true" process="questionTbl">
			</p:menuitem>
		</p:menuButton>
		<p:commandButton icon="ui-icon-delete" style="background-color:transparent !important; border:0px none;"
			process="@form" oncomplete="pp2.show();">
			<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.selectedIndex}" value="#{row}" />
		</p:commandButton>
	</p:column>
</ui:composition>
