<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:column>
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" rendered="#{newable}" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.item']}"/>
		</f:facet>
		<c:if test="#{newable}">
			<p:inputTextarea id="itemName" style="width:96%;" value="#{question.clItem}" 
				rendered="#{isQuestionTypeItem}" required="#{!question.selected}" rows="1" maxlength="200"
				label="#{lbl['lbl.tpl.spec.content.item']}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="itemNameMsg" for="itemName" display="icon" />
		</c:if>
		<c:if test="#{!newable}">
			<h:outputText value="#{question.clItem}" escape="false" rendered="#{isQuestionTypeItem}" />
		</c:if>
	</p:column>
	<p:column rendered="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq)}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.specification']}"/>
		</f:facet>
		<p:inputTextarea id="specification" style="width:96%;" value="#{question.clSpecDetail}" 
			rendered="#{!isQuestionTypeItem or !isSpecificationReq}" required="#{!question.selected}" rows="1" maxlength="200"
			label="#{lbl['lbl.tpl.spec.content.specification']}">
			<p:ajax partialSubmit="true" process="@this" update="@this" />
		</p:inputTextarea>
		<p:message id="specificationMsg" for="specification" display="icon" />
	</p:column>
	<p:column style="width:75px;" rendered="#{isItemTypeService and isFulfilmentTypeReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.fulfilment.type']}"/>
		</f:facet>
		<h:selectOneMenu id="fulfilType" value="#{question.clFulfilmentTypeCode.parameterId}" required="#{!question.selected}" style="width:100%;" 
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.fulfilment.type']}">
			<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.fulfilmentTypeChange(question)}" update="@this, freqUOMPG, dayUOMPG, monthUOMPG, durationPG" />
		</h:selectOneMenu>
		<p:message id="fulfilTypeMsg" for="fulfilType" display="icon" />
	</p:column>
	<p:column style="width:125px;">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.uom']}"/>
		</f:facet>
		
		<c:if test="#{newable}">
			<ac:lov id="#{templateSpecId}uomLovId" lovId="PM_UOM" 
				headerText="UOM Lov"
				saveObject="templateSpecBackingBean.managedBean.tplSpecQuestions[#{row}].clUom"
				value="#{question.clUom.uomName}"
				conditionField="recordStatus^1"
				rendered="#{isQuestionTypeItem}"
				required="#{!question.selected}"
				size="12"
				readonly="true"
				update1="#{p:component('freqUOM')}">
				<f:setPropertyActionListener for="actionEvent" target="#{templateSpecBackingBean.managedBean.tplSpecQuestions}" value="#{templateSpecBean.specMaster.tplSpecQuestions}" />
			</ac:lov>
		</c:if>
		<c:if test="#{!newable}">
			<h:outputText value="#{question.clUom.uomName}" rendered="#{isQuestionTypeItem}" />
		</c:if>
	</p:column>
	
	<ui:param name="isFulfilmentTypeOneOff" value="#{question.clFulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff}" />
	<ui:param name="isShowService" value="#{(!isFulfilmentTypeReq or (isFulfilmentTypeReq and !isFulfilmentTypeOneOff))}" />
	<c:if test="#{isItemTypeService}">
		<p:column style="width:50px;white-space:normal;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}"/>
			</f:facet>
			<h:panelGroup id="freqUOMPG">
				<p:inputText id="freqUOM" style="min-width:0px !important;width:96%;" styleClass="ppNumericAlign" 
					value="#{question.clUomFrequency}" 
					rendered="#{isQuestionTypeItem and isShowService}" required="#{!question.selected}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
					<ac:validateNumber  maxIntegerDigits="4" integerOnly="true" />
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:inputText>
				<p:message id="freqUOMMsg" for="freqUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:60px;white-space:normal;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}"/>
			</f:facet>
			<h:panelGroup id="dayUOMPG">
				<p:inputText id="dayUOM" style="min-width:0px !important;width:96%;" styleClass="ppNumericAlign"
					value="#{question.clUomPerDay}" 
					rendered="#{isQuestionTypeItem and isUOMHours and isShowService}" required="#{!question.selected}" maxlength="5"
					label="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
					<ac:validateNumber pattern="0.0" maxIntegerDigits="3" />
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:inputText>
				<p:message id="dayUOMMsg" for="dayUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:65px;white-space:normal;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}"/>
			</f:facet>
			<h:panelGroup id="monthUOMPG">
				<p:inputText id="monthUOM" style="min-width:0px !important;width:96%;" styleClass="ppNumericAlign"
					value="#{question.clUomPerMonth}" 
					rendered="#{isQuestionTypeItem and (isUOMHours or isUOMDays) and isShowService}" required="#{!question.selected}" maxlength="5"
					label="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
					<ac:validateNumber pattern="0.0" maxIntegerDigits="3" />
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:inputText>
				<p:message id="monthUOMMsg" for="monthUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:60px;white-space:normal;" rendered="#{isDurationByItem}">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.duration.month']}"/>
			</f:facet>
			<h:panelGroup id="durationPG">
				<p:inputText id="duration" style="min-width:0px !important;width:96%;" styleClass="ppNumericAlign"
					value="#{question.clDurationMonth}" 
					rendered="#{isQuestionTypeItem and isShowService}" required="#{!question.selected}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.duration.month']}">
					<ac:validateNumber maxIntegerDigits="4" integerOnly="true" />
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:inputText>
				<p:message id="durationMsg" for="duration" display="icon" />
			</h:panelGroup>
		</p:column>
	</c:if>
	
	<p:column style="width:115px;" rendered="#{!isItemTypeService}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.price.type']}"/>
		</f:facet>
		<h:selectOneMenu id="priceType" value="#{question.clPriceTypeCode.parameterId}" required="#{!question.selected}" style="width:100%;"
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.price.type']}">
			<f:selectItems value="#{templateSpecBackingBean.getPriceTypeDropdownList(templateSpecBean.specMaster)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.priceTypeChange(question)}" update="qtyPG, estPG" />
		</h:selectOneMenu>
		<p:message id="priceTypeMsg" for="priceType" display="icon" />
	</p:column>
	<p:column style="width:65px;">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}"/>
		</f:facet>
		<h:panelGroup id="qtyPG" rendered="#{isQuestionTypeItem}">
			<p:inputText id="qty" style="min-width:0px !important;width:50%;" styleClass="ppNumericAlign"
				value="#{question.clQuantity}" 
				required="#{!question.selected}" maxlength="14"
				label="#{lbl['lbl.tpl.spec.content.quantity']}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" maxIntegerDigits="10" />
			</p:inputText>
			<p:commandButton id="tierQtyBtn" icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;"  
				action="#{templateSpecBackingBean.tierQtyPopupAction(templateSpecBean)}"
				oncomplete="#{tierQtyPopup}.show();"
				partialSubmit="true" process="@this" update="@([id$=tierQtyPopup])"
				rendered="#{!isPriceTypeAllStandard and !empty question.clPriceTypeCode.parameterId}">
				<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			</p:commandButton>
			<p:tooltip id="tierQtyTtp" for="tierQtyBtn">
				<p:outputLabel escape="false" value="#{lbl['lbl.tpl.spec.content.tier.dtls.tooltip']}"  />
			</p:tooltip>
			<p:message id="qtyMsg" for="qty" display="icon" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:140px;" rendered="#{!isItemTypeService and isDeliveryTermReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.delivery.term']}"/>
			<ac:iconTooltip value="#{lbl['lbl.sc.delivery.term.tooltip']}" />
		</f:facet>
		<p:inputText id="deliveryTerm" style="min-width:0px !important;width:21%;" styleClass="ppNumericAlign"
			value="#{question.clDeliveryTerm}" 
			rendered="#{isQuestionTypeItem}" required="#{!question.selected}" maxlength="4"
			label="#{lbl['lbl.tpl.spec.content.delivery.term']}">
			<p:ajax partialSubmit="true" process="@this" update="@this" />
		</p:inputText>
		<h:selectOneMenu id="delTermType" value="#{question.clDeliveryTermTypeCode.parameterId}" required="#{!question.selected}" style="width:75%;" 
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.delivery.term']}">
			<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.deliveryTermChange(question)}" />
		</h:selectOneMenu>
		<p:message id="deliveryTermMsg" for="deliveryTerm" display="icon" />
		<p:message id="delTermTypeMsg" for="delTermType" display="icon" />
	</p:column>
	<p:column style="width:125px;" rendered="#{isScoringReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl[isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : 'lbl.tpl.spec.content.answer']}"/>
		</f:facet>
		<h:selectOneMenu id="answerTypeId" value="#{question.answerTypeCode.parameterId}" style="width:83%;"
			required="#{!question.selected}"
			label="#{lbl[isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : 'lbl.tpl.spec.content.answer']}"
			rendered="#{!isQuestionTypeItem}">
			<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.answerType)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.answerTypeChange(question)}" update="scoringBtnPG" />
		</h:selectOneMenu>	
		<h:panelGroup id="scoringBtnPG">
			<p:commandButton id="scoringBtn"
				icon="#{empty question.maxScore ? 'ui-icon-pencil' : 'ui-icon-evaluate'}" 
				style="background-color:transparent !important; border:0px none;"
				styleClass="scoringBtn"
				action="#{templateSpecBackingBean.scoringPopupAction(templateSpecBean)}"
				oncomplete="#{scoringSetPopup}.show();"
				partialSubmit="true" process="@this" update="@([id$=scoringSetPopup])"
				rendered="#{!isQuestionTypeItem and !empty question.answerTypeCode.parameterId}">
				<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			</p:commandButton>
		</h:panelGroup>
		<p:message id="answerTypeIdMsg" for="answerTypeId" display="icon" />
	</p:column>
	<p:column style="width:80px;" rendered="#{isEstCostReq and !isSpecificationReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.cost']}"/>
		</f:facet>
		<h:panelGroup id="estPG" rendered="#{isQuestionTypeItem}">
			<p:inputText id="estCost" style="min-width:0px !important;width:96%;" styleClass="ppNumericAlign"
				value="#{question.tplSpecEstimations[0].estimatedCost}" 
				required="#{!question.selected}" rendered="#{isPriceTypeStandard}" maxlength="19"
				label="#{lbl['lbl.tpl.spec.content.estimate.cost']}">
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputText>
			<p:message id="estCostMsg" for="estCost" display="icon" />
			<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;"  
				action="#{templateSpecBackingBean.estimationPopupAction(question)}"
				oncomplete="#{estimationPopup}.show();"
				partialSubmit="true" process="@this" update="@([id$=estimationPopup])"
				rendered="#{!isPriceTypeStandard}">
				<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			</p:commandButton>
		</h:panelGroup>
	</p:column>
	<p:column style="width:40px;" rendered="#{newable}">
		<f:facet name="header">
			<p:commandButton id="addTopBtn" icon="ui-icon-add" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,-1,TplSpecConst.questionTypeItem)}"  
				update="questionTbl" partialSubmit="true" process="questionTbl" />
			<p:tooltip id="addTopTtp" for="addTopBtn">
				<p:outputLabel escape="false" value="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}"  />
			</p:tooltip>
		</f:facet>
		<c:if test="#{isSpecificationReq}">
			<p:commandButton id="addBtn" icon="ui-icon-add" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;" />
			<p:menu overlay="true" trigger="addBtn" my="left top" at="left bottom">
				<p:menuitem value="#{lbl['lbl.tpl.spec.content.item']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"  
					update="questionTbl" partialSubmit="true" process="questionTbl">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.tpl.spec.content.specification']}" action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItemSpec)}" 
					update="questionTbl" partialSubmit="true" process="questionTbl">
				</p:menuitem>
			</p:menu>
		</c:if>
		<c:if test="#{!isSpecificationReq}">
			<p:commandButton id="addBtn" icon="ui-icon-add" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
				action="#{templateSpecBackingBean.addQuestion(templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,row,TplSpecConst.questionTypeItem)}"  
				update="questionTbl" partialSubmit="true" process="questionTbl" />
		</c:if>
		<p:tooltip id="addTtp" for="addBtn">
			<p:outputLabel escape="false" value="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}"  />
		</p:tooltip>
		<p:commandButton id="delBtn" icon="ui-icon-delete" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
			immediate="true" process="@form" oncomplete="#{delConfirmPopup}.show();">
			<f:setPropertyActionListener target="#{templateSpecBackingBean.managedBean.tplSpecQuestions}" value="#{templateSpecBean.specMaster.tplSpecQuestions}" />
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion.selected}" value="#{true}" />
		</p:commandButton>
		<p:tooltip id="delTtp" for="delBtn">
			<p:outputLabel escape="false" value="#{lbl['lbl.tpl.spec.content.btn.delete.tooltip']}"  />
		</p:tooltip>
	</p:column>
</ui:composition>
