<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Item" style="float: left" rendered="#{isQuestionTypeHeader}" />	
		<p:inputText value="#{question.clItem}" rendered="#{isQuestionTypeItem}" required="true" />
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Specification" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText value="#{question.clSpecDetail}" rendered="#{!isQuestionTypeHeader}" />
	</p:column>
	<p:column style="#{columnStyle}width:110px;">
		<h:outputLabel value="Uom" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:selectOneMenu value="#{question.clUom.uomId}" rendered="#{isQuestionTypeItem}" required="true">
			<f:selectItems value="#{templateSpecBackingBean.uomList}" 
				var="pmUom" itemLabel="#{pmUom.uomName}" itemValue="#{pmUom.uomCode}" />
		</p:selectOneMenu>
	</p:column>
	<p:column style="#{columnStyle}width:50px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="Frequency" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomFrequency}" rendered="#{isQuestionTypeItem}" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="UOM/Day" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerDay}" rendered="#{isQuestionTypeItem}" />
	</p:column>
	<p:column style="#{columnStyle}width:55px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="UOM/Month" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerMonth}" rendered="#{isQuestionTypeItem}" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="Month/Year" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clMonthPerYear}" rendered="#{isQuestionTypeItem}" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;">
		<h:outputLabel value="Quantity" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clQuantity}" rendered="#{isQuestionTypeItem}" required="true" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;">
		<h:outputLabel value="Mandatory" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:selectBooleanCheckbox value="#{question.clAnswerRequired}" rendered="#{!isQuestionTypeHeader}" />
	</p:column>
	<p:column style="#{columnStyle}width:155px;">
		<h:outputLabel value="Answer" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:selectOneMenu id="answerTypeId" rendered="#{!isQuestionTypeHeader}" value="#{question.answerTypeCode.codeId}" required="true">
			<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.answerType)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.answerTypeChange(row)}" update="scoringBtn" />
		</p:selectOneMenu>&#160;		
		<p:commandLink id="scoringBtn" rendered="#{!isQuestionTypeHeader}" disabled="#{(isAnswerTypeText)}" 
			action="#{templateSpecBackingBean.setIndex(row)}" oncomplete="scoringSetting.show();">
			<p:graphicImage library="ep/images/design" name="edit.png"
				value="/resources/ep/images/design/edit.png" />
		</p:commandLink>
	</p:column>
	<p:column style="#{columnStyle}width:90px;">
		<p:menuButton value="Add">
			<p:menuitem value="Item" action="#{templateSpecBackingBean.addQuestion(row,TplSpecConst.questionTypeItem)}"  
				update="questionTbl" partialSubmit="true" process="questionTbl" oncomplete="updateColspan()">
			</p:menuitem>
			<p:menuitem value="Specification" action="#{templateSpecBackingBean.addQuestion(row,TplSpecConst.questionTypeItemSpec)}" 
				update="questionTbl" partialSubmit="true" process="questionTbl" oncomplete="updateColspan()">
			</p:menuitem>
		</p:menuButton>
		<p:commandLink 
			rendered="#{!isQuestionTypeHeader}" process="@form"
			action="#{templateSpecBackingBean.setIndex(row)}" oncomplete="pp2.show();">
			<p:graphicImage library="ep/images/design" name="delete.png"
				value="/resources/ep/images/design/delete.png" />
		</p:commandLink>
	</p:column>
</ui:composition>
