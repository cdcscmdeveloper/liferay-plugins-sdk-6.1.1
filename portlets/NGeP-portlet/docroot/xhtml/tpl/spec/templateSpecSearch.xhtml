<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="resourceSection"></ui:define>

	<ui:define name="contentSection">
		<h:outputText value="Template Specification" styleClass="pageTitle" />			
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />		
		<p:panel id="panel1" header="Search" toggleable="true">
			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Template Category" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu style="width:200px" value="#{templateSpecBackingBean.managedBean.searchProcurementCategoryId}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Title" /></td>
					<td class="TableFieldRight">
						<p:inputText style="width:280px" value="#{templateSpecBackingBean.managedBean.searchSpecName}" />
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft"><h:outputLabel value="Item Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.searchItemTypeId}" >
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.itemType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft"><h:outputLabel value="Specification Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.searchSpecTypeId}">
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.specificationType)}" />
						</p:selectOneMenu>
					</td>
				</tr>				
				<tr>
					<td class="TableFieldLeft"><h:outputLabel value="Template Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.searchTemplateTypeId}" >
							<f:selectItems value="#{templateSpecBackingBean.getDropdownValues(ParameterTypeConst.templateType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft"><h:outputLabel value="Ministry Id" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.searchOrgProfileId}">
							<f:selectItems value="#{templateSpecBackingBean.ministryList}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<td colspan="4" style="text-align:right;">
						<p:commandButton value="Search"	action="#{templateSpecBackingBean.searchResult}"
							process="@form" update="resultID" />
					</td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="panel2" header="Search Results" toggleable="true">
			<table style="width:100%">
				<tr>
					<td>
						<p:dataTable id="resultID" selectionMode="single" selection="#{templateSpecBackingBean.managedBean.specMaster}"
							value="#{templateSpecBackingBean.managedBean.specMasterList}" 
							var="tplMasterObj" rowKey="#{tplMasterObj.specMasterId}" width="100%">
							<p:columnGroup type="header">
								<p:row>
									<p:column rowspan="1" headerText="Key"></p:column>
									<p:column rowspan="1" headerText="Procurement Category"></p:column>
									<p:column rowspan="1" headerText="Template Type"></p:column>
									<p:column rowspan="1" headerText="Title"></p:column>
									<p:column rowspan="1" headerText="Description"></p:column>
									<p:column rowspan="1" headerText="Item Type"></p:column>
									<p:column rowspan="1" headerText="Created User"></p:column>
									<p:column rowspan="1" headerText="Created Date"></p:column>
								</p:row>
							</p:columnGroup>
							<p:column>
								<h:outputText value="#{tplMasterObj.specMasterId}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.procurementCategory.parameterCode}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.templateTypeCode.parameterCode}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.specName}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.specDesc}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.itemTypeCode.parameterCode}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.createdBy}" />
							</p:column>
							<p:column>
								<h:outputText value="#{tplMasterObj.createdDate}" >
									<f:convertDateTime pattern="dd-MM-YYYY" />
								</h:outputText>
							</p:column>
						</p:dataTable>
					</td>
				</tr>
				<tr>
					<td style="text-align:right">
						<p:commandButton value="Create New" process="@this" action="#{templateSpecBackingBean.newAction}" />
						<p:spacer width="5px" />
						<p:commandButton value="View Template"
							action="#{templateSpecBackingBean.retrieveTemplateSpecMaster}"/>
					</td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
	
	<ui:define name="footerSection"></ui:define>
</ui:composition>
