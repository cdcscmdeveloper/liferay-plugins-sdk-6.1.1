<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="resourceSection"></ui:define>

	<ui:define name="contentSection">
	
		<h:outputText value="Template Specification" styleClass="pageTitle" />					
		<p:panel id="panel1" header="Search" toggleable="true">

			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Type"></h:outputLabel></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.categoryId}">
							<f:selectItems value="#{templateSpecBackingBean.templateCategoryList}" />
						</p:selectOneMenu>
					</td>

					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="*Title"></h:outputLabel></td>
					<td class="TableFieldRight"><p:inputText style="width:280px"></p:inputText></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="#{lbl['lbl.template.doc.category']}"></h:outputLabel></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.categoryId}"
							id="templateCategory">
							<f:selectItems value="#{templateSpecBackingBean.templateCategoryList}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="*Process Type"></h:outputLabel></td>
					<td class="TableFieldRight"><p:selectOneMenu value="#{templateSpecBackingBean.managedBean.categoryId}">
													<f:selectItems value="#{templateSpecBackingBean.templateCategoryList}" />
												</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width:120px"><h:outputLabel value="Decription"></h:outputLabel></td>
					<td class="TableFieldRight"><p:inputTextarea style="width:280px" cols="33" rows="2"  ></p:inputTextarea></td>
				</tr>

				<tr>
					
					<td colspan="4" style="text-align:right;"><p:commandButton value="Search"
					action="#{templateSpecBackingBean.searchResult}"
					process="@this,templateCategory" update="resultID" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="panel2" header="Search Results" toggleable="true">
			<table style="width:100%">
				<tr>
					<td><p:dataTable id="resultID" selectionMode="single" selection="#{templateSpecBackingBean.managedBean.selectedTemplate}"
				value="#{templateSpecBackingBean.managedBean.templateSpecMasterList}" 
				var="tplMasterObj" rowKey="#{tplMasterObj.specMasterId}" width="100%">
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="1" headerText="Key"></p:column>
						<p:column rowspan="1" headerText="Category"></p:column>
						<p:column rowspan="1" headerText="Process Type"></p:column>
						<p:column rowspan="1" headerText="Title"></p:column>
						<p:column rowspan="1" headerText="Description"></p:column>
						<p:column rowspan="1" headerText="Type"></p:column>
						<p:column rowspan="1" headerText="Created User"></p:column>
						<p:column rowspan="1" headerText="Created Date"></p:column>
					</p:row>
				</p:columnGroup>

				<p:column>
					<h:outputText value="#{tplMasterObj.specMasterId}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.tplCategory.categoryCode}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.templateType}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.specName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.specDesc}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.templateType}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.createdBy}" />
				</p:column>
				<p:column>
					<h:outputText value="#{tplMasterObj.createdDate}" />
				</p:column>
				
			</p:dataTable></td>
				</tr>
				<tr>
					<td style="text-align:right"><p:commandButton value="Create New" update="resultID"
					action="#{templateSpecBackingBean.createNewTemplate}"></p:commandButton>
					<p:spacer width="5px"></p:spacer>
					<p:commandButton value="View Template"
						action="#{templateSpecBackingBean.findQuestionsBySectionId}"/></td>
				</tr>
			
			</table>
		</p:panel>
	</ui:define>
	
	<ui:define name="footerSection"></ui:define>
	
</ui:composition>
