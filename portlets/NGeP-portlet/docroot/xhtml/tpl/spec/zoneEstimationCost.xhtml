<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="isSelectedPriceTypeTariff" value="#{templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTariff or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTariff}" />
	<ui:param name="isSelectedPriceTypeTier" value="#{templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypePromotionTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalPromotionTier 
		or isSelectedPriceTypeTariff}" />
	<ui:param name="isFulfilmentTypeScheduled" 
		value="#{specificationBackingBean.managedBean.fulfilmentType == ParameterConst.fulfilmentTypeScheduled}" />
	<ui:param name="isItemTypeService" value="#{templateSpecBean.specMaster.itemTypeCode.parameterCode == ParameterConst.itemTypeService}" />
	<!-- #21695 farid add instruction START -->
	<ui:remove>
		<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
	</ui:remove>
<table>
<tr>
<ui:remove><!-- #21695 farid add instruction START --></ui:remove>
	<td>
		<h:outputText style="float: left;" styleClass="instruction" escape="false" rendered="#{specificationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}" value="#{lbl['lbl.tpl.qty.estimation.instruction']}" />
	</td>
<ui:remove><!-- #21695 END --></ui:remove>
</tr>
<tr>
	<td>
		<p:dataTable id="zoneEstimationTbl" widgetVar="tierQtyWidget"
		var="tplSpecEstimation"
		rowIndexVar="rowIndex"
		value="#{templateSpecBean.selectedSpecQuestion.tplSpecEstimations}"
		rowKey="#{tplSpecEstimation}">
							
		<ac:paginator for="zoneEstimationTbl" />
		
		<p:column headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}" rendered="#{!empty templateSpecBean.specMaster.tplSpecZone}">
			#{tplSpecEstimation.tplSpecZoneDtl.zoneName}
		</p:column>
		
		<c:if test="#{isItemTypeService}">
			<p:column style="width:70px;white-space:normal;">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}"/>
				</f:facet>			
				<p:inputText id="zonefreqUOMPG"
						style="min-width:0px !important;width:50px; text-align:right;"
						value="#{templateSpecBean.selectedSpecQuestion.clUomFrequency}" 
						required="true"
						maxlength="14" 
						disabled="#{!isQuestion or !editable or (isSpecificationReq and !isSpecTypeTechnical)}">
				</p:inputText>
			</p:column>
			<p:column style="width:70px;white-space:normal;">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}"/>
				</f:facet>			
				<p:inputText id="zonedayUOMPG"
						style="min-width:0px !important;width:50px; text-align:right;"
						value="#{templateSpecBean.selectedSpecQuestion.clUomPerDay}" 
						required="true"
						maxlength="14" 
						disabled="#{!isQuestion or !editable or (isSpecificationReq and !isSpecTypeTechnical)}">
				</p:inputText>
			</p:column>
			<p:column style="width:70px;white-space:normal;">
				<f:facet name="header">
						<h:outputText value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}"/>
				</f:facet>			
				<p:inputText id="zonemonthUOMPG"
						style="min-width:0px !important;width:50px; text-align:right;"
						value="#{templateSpecBean.selectedSpecQuestion.clUomPerMonth}"
						required="true"
						maxlength="14" 
						disabled="#{!isQuestion or !editable or (isSpecificationReq and !isSpecTypeTechnical)}">
				</p:inputText>
			</p:column>
		</c:if>
		<p:column style="width:95px;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}"/>
			</f:facet>			
			<p:inputText id="zoneQty1"
				style="min-width:0px !important;width:90px; text-align:right;"
				value="#{templateSpecBean.selectedSpecQuestion.tplSpecZoneQties[rowIndex].qty}" required="true"
				maxlength="14" label="#{lbl['lbl.tpl.spec.content.quantity']}"
				disabled="#{!isQuestion or !editable or (isSpecificationReq and !isSpecTypeTechnical)}">
			</p:inputText>
			<p:message id="zoneQtyMsg1" for="zoneQty1" display="icon" />
		</p:column>
		<p:column style="width:80px;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.Indicative.unit.price']}"/>
			</f:facet>
			<p:inputText id="zoneEstCost" 
				value="#{tplSpecEstimation.indicativeUnitPrice}" style="width:165px; text-align:right;" 
				required="true" maxlength="19"
				label="#{lbl['lbl.tpl.spec.content.Indicative.unit.price']}"
				disabled="#{!editable or templateSpecBean.selectedSpecQuestion.tplSpecZoneQties[rowIndex].qty eq 0}">

				<!-- #25039#152 start -->	
				<f:converter converterId="dynamicNumberConverter" />
				<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />						
				<f:validator validatorId="quantityDoubleRangeValidator" />
				<!-- #25039#152 end -->
				<!-- #25039#152 ajax update add  zoneEstCost -->
				<!-- #25726 Add non periodic schedule to the parameter -->
				<p:ajax 
					update="@all, zoneEstCostMsg, @(.calcEstAmount), zoneEstCost1, zoneEstCost"
					partialSubmit="true"
					process="@this" 
					event="change"
					listener="#{templateSpecBackingBean.calcItemTotalIndicateUnitPrice(templateSpecBean,
						tplSpecEstimation.indicativeUnitPrice, 
						templateSpecBean.selectedSpecQuestion.tplSpecZoneQties[rowIndex].qty, 
						templateSpecBean.selectedSpecQuestion.clUomFrequency, 
						templateSpecBean.selectedSpecQuestion.clUomPerDay, 
						templateSpecBean.selectedSpecQuestion.clUomPerMonth, 
						specificationBackingBean.managedBean.qt.contractDuration, 
						tplSpecEstimation.specEstimationId, 
						isItemTypeService,
						isFulfilmentTypeScheduled, 
						templateSpecBean.selectedSpecQuestion.tplSpecZoneQties[rowIndex].tplSpecZoneDtl.specZoneId,
						tplSpecEstimation.tplSpecQuestion.specQuestionId)}"></p:ajax>
			</p:inputText>
			
			<p:message id="zoneEstCostMsg" for="zoneEstCost" display="icon" />
	
		</p:column>		
		
		<p:column style="width:80px;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.cost']}"/>
			</f:facet>
			<!-- #25039 #162 - Begin - disabled QT tranx 
				disabled="#{editable or templateSpecBean.selectedSpecQuestion.tplSpecZoneQties[rowIndex].qty eq 0} change to "true"-->
			<p:inputText id="zoneEstCost1" value="#{tplSpecEstimation.estimatedCost}" style="width:165px; text-align:right;" 
				required="true" maxlength="19" 
				label="#{lbl['lbl.tpl.spec.content.estimate.cost']}"
				disabled="true">
					<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" /> <!--#25039# -->
			</p:inputText>
			<!-- #25039#162 end -->
		</p:column>
	</p:dataTable>
	</td>
</tr>
</table>


	
</ui:composition>
