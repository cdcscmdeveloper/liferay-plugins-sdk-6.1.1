<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:dialog id="tierQtyPopup"
		header="#{lbl['lbl.tpl.spec.content.tier.title']}"
		widgetVar="#{tierQtyPopup}" modal="true" width="450" height="390"
		closable="false">

		<c:if test="#{!empty templateSpecBean.selectedSpecQuestion}">
			<div style="height: 330px;">
				<h:panelGroup id="tierQtyPnl">
					<p:messages id="tierPopupMsg" showDetail="true" autoUpdate="true"
						closable="true" showSummary="false" severity="error, info" />

					<ui:include src="tierQty.xhtml" />
				</h:panelGroup>
			</div>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					action="#{templateSpecBackingBean.tierQtyOkAction(templateSpecBean)}"
					partialSubmit="true" process="@this, tierQtyPnl"
					update="tierQtyPnl">
					<f:setPropertyActionListener
						target="#{templateSpecBean.specComponentId}"
						value="#{templateSpecId}" />
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					partialSubmit="true" process="@this" update="@this"
					action="#{templateSpecBackingBean.tierQtyCancelAction(templateSpecBean)}"
					oncomplete="#{tierQtyPopup}.hide()" rendered="#{editable and (!isSpecificationReq or isSpecTypeTechnical)}" />
			</div>
		</c:if>
	</p:dialog>
</ui:composition>
