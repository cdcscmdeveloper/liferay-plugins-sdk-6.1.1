<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.item']}">	
		<p:inputText size="19" value="#{question.clItem}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.sc.tpl.specification']}">
		<p:inputText size="19" value="#{question.clSpecDetail}" disabled="true" />
	</p:column>
	<p:column style="width:70px;" headerText="#{lbl['lbl.sc.tpl.uom']}">
		<p:inputText style="min-width:0px !important" size="9" value="#{question.clUom.uomName}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	
	<ui:insert name="answerSection"/>	
	
	<c:if test="#{isItemTypeService}">
		<p:column style="width:50px;" headerText="#{lbl['lbl.sc.tpl.frequency.per.uom']}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomFrequency}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
		<p:column style="width:55px;" headerText="#{lbl['lbl.sc.tpl.no.uom.per.day']}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerDay}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
		<p:column style="width:60px;" headerText="#{lbl['lbl.sc.tpl.no.uom.per.month']}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerMonth}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
		<p:column style="width:70px;" headerText="#{lbl['lbl.sc.tpl.duration.month']}" rendered="#{isDurationByItem}">
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clDurationMonth}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
	</c:if>
	
	<p:column style="width:50px;" headerText="#{lbl['lbl.sc.tpl.quantity']}">
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clQuantity}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
</ui:composition>
