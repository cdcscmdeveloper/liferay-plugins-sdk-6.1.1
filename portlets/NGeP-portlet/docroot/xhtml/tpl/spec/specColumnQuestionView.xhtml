<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Item" style="float: left" rendered="#{isQuestionTypeHeader}" />	
		<p:inputText value="#{question.clItem}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Specification" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText value="#{question.clSpecDetail}" rendered="#{!isQuestionTypeHeader}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:110px;">
		<h:outputLabel value="Uom" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="10" value="#{question.clUom.uomName}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="Frequency" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomFrequency}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="UOM/Day" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerDay}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:55px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="UOM/Month" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerMonth}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;" rendered="#{isItemTypeService}">
		<h:outputLabel value="Month/Year" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clMonthPerYear}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:50px;">
		<h:outputLabel value="Quantity" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clQuantity}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
</ui:composition>
