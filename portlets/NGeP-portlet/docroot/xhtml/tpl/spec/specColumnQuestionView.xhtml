<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Item" style="float: left" rendered="#{isQuestionTypeHeader}" />	
		<p:inputText size="19" value="#{question.clItem}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Specification" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText size="19" value="#{question.clSpecDetail}" rendered="#{!isQuestionTypeHeader}" disabled="true" />
	</p:column>
	<p:column style="#{columnStyle}width:70px;">
		<h:outputLabel value="UOM" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="9" value="#{question.clUom.uomName}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
	
	<ui:insert name="answerSection"/>	
	
	<c:if test="#{isItemTypeService}">
		<p:column style="#{columnStyle}width:50px;">
			<h:outputLabel value="Frequency per UOM" style="float: left; white-space: normal !important;" rendered="#{isQuestionTypeHeader}" />
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomFrequency}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
		<p:column style="#{columnStyle}width:55px;">
			<h:outputLabel value="No. UOM per day" style="float: left; white-space: normal !important;" rendered="#{isQuestionTypeHeader}" />
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerDay}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
		<p:column style="#{columnStyle}width:60px;">
			<h:outputLabel value="No. UOM per month" style="float: left; white-space: normal !important;" rendered="#{isQuestionTypeHeader}" />
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clUomPerMonth}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
		<p:column style="#{columnStyle}width:70px;">
			<h:outputLabel value="No. Months per year" style="float: left; white-space: normal !important;" rendered="#{isQuestionTypeHeader}" />
			<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clMonthPerYear}" rendered="#{isQuestionTypeItem}" disabled="true" />
		</p:column>
	</c:if>
	
	<p:column style="#{columnStyle}width:50px;">
		<h:outputLabel value="Quantity" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.clQuantity}" rendered="#{isQuestionTypeItem}" disabled="true" />
	</p:column>
</ui:composition>
