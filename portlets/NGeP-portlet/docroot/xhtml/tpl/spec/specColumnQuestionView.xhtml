<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isRepeated"
		value="#{prevSpecQuestion != null ? prevSpecQuestion.specQuestionId == question.specQuestionId : false}" />
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<p:column style="width: 25%;white-space: normal;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">
		<h:outputText value="#{fn:replace(question.clItem,',',',  ')}"  escape="false"
			rendered="#{!isRepeated}" /><br /><br />
		<h:outputText value="#{question.cmItem.extensionCode}" rendered="#{!isRepeated}" />
		<!-- #29007 Start Vinod -->
		<ui:fragment rendered="#{!empty question.cmItem.extensionCode and directLOABackingBean.managedBean.iconForDL}">
		<p:commandLink id="itemName"
						action="#{directLOABackingBean.searchSupplierSpecification(question,true)}"
						partialSubmit="true" process="@this">
		<p:graphicImage value="/css/images/design/ico-viewnedit.png" />
		</p:commandLink>
		<p:tooltip id="toolTipSpecAndSupplierOffer"
					for="itemName"
					value="#{lbl['lbl.sc.proposal.specification.update.mouseover']}" trackMouse="true" />
		</ui:fragment>
		<!-- #29007 End Vinod -->
		<ui:fragment rendered="#{isSpecTypeTechnical or isSqSpec or (isSpecTypeFinancial and !isSpecificationReq)}">
		<c:if test="#{isContentTypeUpdateSpec}">
			<p:inputTextarea id="specification" style="width:calc(100% - 20px);"
				value="#{question.clSpecDetail}"
				rendered="#{!isQuestionTypeItem or !isSpecificationReq}"
				required="#{!question.selected}" rows="5" maxlength="1000"
				onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);" onmouseout="limitTextArea(this,1000);"
				label="#{lbl['lbl.tpl.spec.content.specification']}"
				autoResize="false">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="specificationMsg" for="specification" display="icon" />
		</c:if>
		<c:if test="#{!isContentTypeUpdateSpec}">
			<ui:param name="clspecDetail" value="#{fn:replace(question.clSpecDetail,',',',  ')}"></ui:param>
			<h:outputText value="#{templateSpecBackingBean.replaceWithBR(clspecDetail)}" escape="false"
				rendered="#{!isRepeated}"
				style="white-space: normal;word-wrap: break-word;" />
		</c:if>
		</ui:fragment>
	</p:column>
	<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<p:column style="width:75px;"
		rendered="#{(!qtyZero and isItemTypeService and isFulfilmentTypeReq) or !isSqSpec and !isZonal and isItemTypeService and isFulfilmentTypeReq or isSqSpec and isItemTypeService and isFulfilmentTypeReq}">
		<h:outputText
			value="#{templateSpecBackingBean.getParameterDesc(question.clFulfilmentTypeCode)}"
			rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>
	<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<p:column style="width:8%;white-space:normal;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">
		<h:outputText value="#{question.clUom.uomName}"
			rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>

	<ui:insert name="answerSection" />
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<c:if test="#{isItemTypeService}">
		<p:column style="width:70px;white-space:normal;text-align:right;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">
			<h:outputText value="#{question.clUomFrequency}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
		<p:column style="width:60px;white-space:normal;text-align:right;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">
			<h:outputText value="#{question.clUomPerDay}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="0.0" />
			</h:outputText>
		</p:column>
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
		<p:column style="width:60px;white-space:normal;text-align:right;" rendered="#{(!qtyZero) or !isSqSpec and !isZonal or isSqSpec}">
			<h:outputText value="#{question.clUomPerMonth}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="0.0" />
			</h:outputText>
		</p:column>
		<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
		<p:column style="width:2%;white-space:normal;text-align:right;"
			rendered="#{(!qtyZero and isDurationByItem) or (!isSqSpec and !isZonal and isDurationByItem) or (isSqSpec and isDurationByItem)}">
			<h:outputText value="#{question.clDurationMonth}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
	</c:if>
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<p:column style="width:75px; white-space:normal;"
		rendered="#{(!qtyZero and !isItemTypeService) or (!isSqSpec and !isZonal and !isItemTypeService) or (isSqSpec and !isItemTypeService)}">
		<h:outputText
			value="#{templateSpecBackingBean.getParameterDesc(question.clPriceTypeCode)}"
			rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<ui:insert name="qtySection">
		<p:column style="width:4%;text-align:right;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">

			<h:outputText value="#{question.clQuantity}"
				rendered="#{isQuestionTypeItem and isPriceTypeAllStandard and (empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone)}">
				<f:converter converterId="dynamicNumberConverter" />
				<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
			</h:outputText>
			<ui:param name="tierQtyTooltip"
				value="#{(isQuestionTypeItem and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone)? 'lbl.tpl.spec.zone.tier.qty.tooltip':'lbl.tpl.spec.content.tier.dtls.tooltip'}" />
			<p:commandButton id="tierQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.tierQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this" update="@([id$=tierQtyPopup])"
				rendered="#{isQuestionTypeItem and !isPriceTypeAllStandard}"
				title="#{lbl[tierQtyTooltip]}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
<!-- #21695 FARID tooltip -->
			<p:commandButton id="zoneQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.zoneQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this"
				update="@([id$=zoneQtyPopup])"
				rendered="#{isQuestionTypeItem and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}"
				title="#{lbl['lbl.tpl.qty.instruction.tooltip']}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
		</p:column>
	</ui:insert>
	<!-- #29007 Start Vinod -->
	<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<c:if test="#{directLOABackingBean.managedBean.searchItemForDL and !templateSpecBean.specMaster.brandNew and !isItemTypeService}">
	<p:column style="width:97px; white-space:normal;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">
		
		<h:panelGroup id="ratePerUomPG1">
			<h:outputText id="ratePerUom1"
				style="min-width:0px !important;width:86px; text-align:right;"
				value="#{question.tplSpecAnswers[0].ratePerUom}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}"
				label="#{lbl['lbl.tpl.spec.content.unit.price']}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
					maxIntegerDigits="14" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<!-- Bug #31733 Related to #21695 12/10/2021 -->
	<p:column style="width:90px;white-space:normal;text-align:right;"
		rendered="#{(!qtyZero and isItemTypeService) or (!isSqSpec and !isZonal and isItemTypeService) or (isSqSpec and isItemTypeService)}">
		<h:panelGroup id="ansYearPG1" rendered="#{isDurationYear}">
			<h:outputText value="#{question.tplSpecAnswers[0].amountPerYear}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
		<h:panelGroup rendered="#{!isDurationYear}">
			<h:outputText value="#{lbl['lbl.txt.na']}"/>
		</h:panelGroup>
	</p:column>
	<!-- Bug #31733 Related to #21695 12/10/2021 -->
	<p:column style="width:115px; text-align:right; white-space:normal;" rendered="#{(!qtyZero) or (!isSqSpec and !isZonal) or (isSqSpec)}">

		<h:panelGroup id="ansPG1">
			<h:outputText id="answerNumText1"
				value="#{question.tplSpecAnswers[0].answerNumeric}"
				rendered="#{isQuestionTypeItem and isPriceTypeStandard}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	</c:if>
	<!-- #29007 End Vinod -->
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<p:column style="width:100px;white-space:normal;"
		rendered="#{(!qtyZero and isUpdateSpecByAnswers) or (!isSqSpec and !isZonal and isUpdateSpecByAnswers) or (isSqSpec and isUpdateSpecByAnswers)}">
		<h:outputText value="#{fn:replace(tplSpecAnswer.answerRemark,',',',  ')}" escape="false" />
	</p:column>
<!-- Bug #31733 Related to #21695 12/10/2021 rendered-->
	<p:column style="width:100px;white-space:normal;"
		rendered="#{(!qtyZero and isUpdateSpecByAnswers) or (!isSqSpec and !isZonal and isUpdateSpecByAnswers) or (isSqSpec and isUpdateSpecByAnswers)}">
		<h:outputText value="#{fn:replace(tplSpecAnswer.userRemark,',',',  ')}"  escape="false" />
	</p:column>
</ui:composition>
