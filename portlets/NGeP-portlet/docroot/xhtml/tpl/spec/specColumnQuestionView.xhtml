<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="isRepeated" value="#{prevSpecQuestion != null ? prevSpecQuestion.specQuestionId == question.specQuestionId : false}" />
	
	<p:column style="white-space:normal;" headerText="#{lbl['lbl.tpl.spec.content.item']}">	
		<h:outputText value="#{question.clItem}" escape="false" rendered="#{!isRepeated}" />
	</p:column>
	<p:column style="white-space:normal;" headerText="#{lbl['lbl.tpl.spec.content.specification']}" rendered="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq)}">
		<h:outputText value="#{question.clSpecDetail}" escape="false" rendered="#{!isRepeated}" />
	</p:column>
	<p:column style="width:75px;" headerText="#{lbl['lbl.tpl.spec.content.fulfilment.type']}" rendered="#{isItemTypeService and isFulfilmentTypeReq}">
		<h:outputText value="#{templateSpecBackingBean.getParameterDesc(question.clFulfilmentTypeCode)}" rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>
	<p:column style="width:90px;white-space:normal;" headerText="#{lbl['lbl.tpl.spec.content.uom']}">
		<h:outputText value="#{question.clUom.uomName}" rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>
	
	<ui:insert name="answerSection"/>
	
	<c:if test="#{isItemTypeService}">
		<p:column style="width:50px;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
			<h:outputText value="#{question.clUomFrequency}" rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:60px;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
			<h:outputText value="#{question.clUomPerDay}" rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:65px;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
			<h:outputText value="#{question.clUomPerMonth}" rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:60px;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.duration.month']}" rendered="#{isDurationByItem}">
			<h:outputText value="#{question.clDurationMonth}" rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
	</c:if>
	
	<p:column style="width:115px;" headerText="#{lbl['lbl.tpl.spec.content.price.type']}" rendered="#{!isItemTypeService}">
		<h:outputText value="#{templateSpecBackingBean.getParameterDesc(question.clPriceTypeCode)}" rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>
	
	<p:column style="width:65px;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.quantity']}">
		<ui:insert name="qtySection">
			<h:outputText value="#{question.clQuantity}" rendered="#{isQuestionTypeItem and isPriceTypeAllStandard}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
			</h:outputText>
			<p:commandButton icon="ui-icon-pencil" style="background-color:transparent !important; border:0px none;"  
				oncomplete="#{tierQtyPopup}.show();"
				partialSubmit="true" process="@this" update="@([id$=tierQtyPopup])"
				rendered="#{isQuestionTypeItem and !isPriceTypeAllStandard}">
				<f:setPropertyActionListener target="#{templateSpecBean.selectedSpecQuestion}" value="#{question}" />
			</p:commandButton>
		</ui:insert>
	</p:column>
</ui:composition>
