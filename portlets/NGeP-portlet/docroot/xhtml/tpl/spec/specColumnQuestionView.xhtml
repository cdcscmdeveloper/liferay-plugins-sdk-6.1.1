<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">

	<ui:param name="isRepeated"
		value="#{prevSpecQuestion != null ? prevSpecQuestion.specQuestionId == question.specQuestionId : false}" />

	<p:column style="width: 15%;"
		headerText="#{lbl['lbl.tpl.spec.content.item']}">
		<h:outputText value="#{question.clItem}" escape="false"
			rendered="#{!isRepeated}" />
	</p:column>
	<p:column style="width: 22%;"
		headerText="#{lbl['lbl.tpl.spec.content.specification']}"
		rendered="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq)}">
		<c:if test="#{isContentTypeUpdateSpec}">
			<p:inputTextarea id="specification" style="width:calc(100% - 20px);"
				value="#{question.clSpecDetail}"
				rendered="#{!isQuestionTypeItem or !isSpecificationReq}"
				required="#{!question.selected}" rows="5" maxlength="1000"
				label="#{lbl['lbl.tpl.spec.content.specification']}"
				autoResize="false">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="specificationMsg" for="specification" display="icon" />
		</c:if>
		<c:if test="#{!isContentTypeUpdateSpec}">
			<h:outputText value="#{question.clSpecDetail}" escape="false"
				rendered="#{!isRepeated}"
				style="white-space: normal;word-wrap: break-word;" />
		</c:if>
	</p:column>
	<p:column style="width:75px;"
		headerText="#{lbl['lbl.tpl.spec.content.fulfilment.type']}"
		rendered="#{isItemTypeService and isFulfilmentTypeReq}">
		<h:outputText
			value="#{templateSpecBackingBean.getParameterDesc(question.clFulfilmentTypeCode)}"
			rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>
	<p:column style="width:8%;white-space:normal;"
		headerText="#{lbl['lbl.tpl.spec.content.uom']}">
		<h:outputText value="#{question.clUom.uomName}"
			rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>

	<ui:insert name="answerSection" />

	<c:if test="#{isItemTypeService}">
		<p:column style="width:70px;white-space:normal;text-align:right;"
			headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
			<h:outputText value="#{question.clUomFrequency}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:60px;white-space:normal;text-align:right;"
			headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
			<h:outputText value="#{question.clUomPerDay}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="0.0" />
			</h:outputText>
		</p:column>
		<p:column style="width:60px;white-space:normal;text-align:right;"
			headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
			<h:outputText value="#{question.clUomPerMonth}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber pattern="0.0" />
			</h:outputText>
		</p:column>
		<p:column style="width:2%;white-space:normal;text-align:right;"
			headerText="#{lbl['lbl.tpl.spec.content.duration.month']}"
			rendered="#{isDurationByItem}">
			<h:outputText value="#{question.clDurationMonth}"
				rendered="#{isQuestionTypeItem and !isRepeated}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			</h:outputText>
		</p:column>
	</c:if>

	<p:column style="width:75px; white-space:normal;"
		headerText="#{lbl['lbl.tpl.spec.content.price.type']}"
		rendered="#{!isItemTypeService}">
		<h:outputText
			value="#{templateSpecBackingBean.getParameterDesc(question.clPriceTypeCode)}"
			rendered="#{isQuestionTypeItem and !isRepeated}" />
	</p:column>

	<ui:insert name="qtySection">
		<p:column style="width:4%;text-align:right;"
			headerText="#{lbl['lbl.tpl.spec.content.quantity']}">

			<h:outputText value="#{question.clQuantity}"
				rendered="#{isQuestionTypeItem and isPriceTypeAllStandard and (empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone)}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
			</h:outputText>
			<p:commandButton id="tierQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.tierQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this" update="@([id$=tierQtyPopup])"
				rendered="#{isQuestionTypeItem and !isPriceTypeAllStandard}"
				title="#{lbl['lbl.tpl.spec.content.tier.dtls.tooltip']}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
			<p:commandButton id="zoneQtyBtn" icon="ui-icon-pencil"
				style="background-color:transparent !important; border:0px none;"
				action="#{templateSpecBackingBean.zoneQtyPopupAction(templateSpecBean)}"
				partialSubmit="true" process="@this"
				update="@([id$=zoneQtyPopup])"
				rendered="#{isQuestionTypeItem and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}">
				<f:setPropertyActionListener
					target="#{templateSpecBean.selectedSpecQuestion}"
					value="#{question}" />
				<f:setPropertyActionListener
					target="#{templateSpecBean.specComponentId}"
					value="#{templateSpecId}" />
			</p:commandButton>
		</p:column>
	</ui:insert>

	<p:column style="width:100px;white-space:normal;"
		headerText="#{lbl['lbl.tpl.spec.content.supplier.note']}"
		rendered="#{isUpdateSpecByAnswers}">
		<h:outputText value="#{tplSpecAnswer.answerRemark}" escape="false" />
	</p:column>

	<p:column style="width:100px;white-space:normal;"
		headerText="#{lbl['lbl.tpl.spec.content.comment']}"
		rendered="#{isUpdateSpecByAnswers}">
		<h:outputText value="#{tplSpecAnswer.userRemark}" escape="false" />
	</p:column>
</ui:composition>
