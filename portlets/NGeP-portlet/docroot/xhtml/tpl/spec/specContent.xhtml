<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
		
		<p:panel id="spg" header="#{cc.attrs.title}" toggleable="true">
			<h:panelGroup rendered1="false">
			Content Type: 
			<p:selectOneMenu value="#{templateSpecBean.contentType}">
				<f:selectItem itemLabel="Question" itemValue="#{TplSpecConst.contentTypeQuestion}" />
				<f:selectItem itemLabel="Review" itemValue="#{TplSpecConst.contentTypeReview}" />
				<f:selectItem itemLabel="Answer" itemValue="#{TplSpecConst.contentTypeAnswer}" />
				<f:selectItem itemLabel="Score" itemValue="#{TplSpecConst.contentTypeScore}" />
				<p:ajax event="change" update="questionTbl, saveAnsPG" />
			</p:selectOneMenu>
			
			<h:panelGroup id="saveAnsPG" >
				<p:commandButton value="Save Answer" action="#{templateSpecBackingBean.saveAnswerAction}" 
					rendered="#{templateSpecBean.contentType != TplSpecConst.contentTypeQuestion
							and templateSpecBean.contentType != TplSpecConst.contentTypeReview}" />
			</h:panelGroup>
			</h:panelGroup>
			
			<ui:param name="isContentTypeQuestion" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeQuestion}" />
			<ui:param name="isContentTypeReview" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeReview}" />
			<ui:param name="isContentTypeAnswer" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeAnswer}" />
			<ui:param name="isContentTypeScore" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeScore}" />	
			<ui:param name="isItemTypeService" value="#{templateSpecBean.specMaster.itemTypeCode.parameterCode == ParameterConst.itemTypeService}" />
			<ui:param name="isSpecTypeTechnical" value="#{templateSpecBean.specMaster.specTypeCode.parameterCode == ParameterConst.specificationTypeTechnical}" />
			<ui:param name="isSpecTypeFinancial" value="#{templateSpecBean.specMaster.specTypeCode.parameterCode == ParameterConst.specificationTypeFinancial}" />
			<ui:param name="isDurationByItem" value="#{templateSpecBean.specMaster.durationByItem}" />
			<ui:param name="durationMonth" value="#{templateSpecBean.specMaster.durationMonth}" />
			
			<c:if test="#{isContentTypeQuestion or isContentTypeReview}">
				<c:if test="#{isContentTypeQuestion and isSpecTypeTechnical}">
					<ac:lovPopup />
				</c:if>
				
				<p:dataTable id="questionTbl" var="question" rowIndexVar="row"
					value="#{templateSpecBean.specMaster.tplSpecQuestions}"
					scrollable1="true" scrollWidth1="#{cc.attrs.scrollWidth}">
					
					<ui:param name="isQuestionTypeItem" value="#{question.questionType == TplSpecConst.questionTypeItem}" />
					<ui:param name="isPriceTypeStandard" value="#{question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard}" />
					<ui:param name="isAnswerTypeDropdown" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeDropdown}" />
					<ui:param name="isAnswerTypeText" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeText}" />
					<ui:param name="isAnswerTypeNumeric" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeNumeric}" />
					
					<c:if test="#{isContentTypeQuestion and isSpecTypeTechnical}">
						<ui:decorate template="specColumnQuestionTechnical.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeQuestion and isSpecTypeFinancial}">
						<ui:decorate template="specColumnQuestionView.xhtml" />
						<ui:decorate template="specColumnQuestionFinancial.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeReview}">
						<ui:decorate template="specColumnQuestionView.xhtml" />
						<ui:decorate template="specColumnReview.xhtml" />
					</c:if>
				</p:dataTable>
			</c:if>
			
			<c:if test="#{isContentTypeAnswer or isContentTypeScore}">
				<p:dataTable id="questionTbl" var="tplSpecAnswer" rowIndexVar="row"
					value="#{templateSpecBean.specAnswerList}"
					scrollable1="true" scrollWidth1="#{cc.attrs.scrollWidth}">
					
					<ui:param name="question" value="#{tplSpecAnswer.tplSpecQuestion}" />
					<ui:param name="isQuestionTypeItem" value="#{question.questionType == TplSpecConst.questionTypeItem}" />
					<ui:param name="isAnswerTypeDropdown" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeDropdown}" />
					<ui:param name="isAnswerTypeText" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeText}" />
					<ui:param name="isAnswerTypeNumeric" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeNumeric}" />
					<ui:param name="isScoring" value="#{question.scoring}" />
					
					<c:if test="#{isContentTypeAnswer}">
						<ui:decorate template="specColumnAnswer.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeScore}">
						<ui:decorate template="specColumnAnswerView.xhtml" />
						<ui:decorate template="specColumnScore.xhtml" />
					</c:if>
				</p:dataTable>
			</c:if>
		</p:panel>

		<p:dialog header="Delete Confirmation" widgetVar="pp2" showEffect="fade" hideEffect="fade"
			 modal="true" height="100" width="350" resizable="false" >
			<f:facet name="header">
				<h:outputLabel value="Delete Confirmation" />
			</f:facet>
			<h:outputText value="Confirm to delete?" />
			<br />
			<h:outputText value="All child nodes belong to this node will be deleted as well" />
			<br />
			<p:commandButton value="Ok" oncomplete="pp2.hide();" immediate1="true" action="#{templateSpecBackingBean.deleteQuestion(templateSpecBean)}"
				partialSubmit="true" pprocess="@this,spg" update="spg" />
			<p:commandButton value="Cancel" onclick="pp2.hide();return false" />
		</p:dialog>
		
		<p:dialog id="tierQtyPopup" header="#{lbl['lbl.tpl.spec.content.tier.title']}" widgetVar="tierQtyPopup" modal="true" width="450" height="350">
			<c:if test="#{!empty templateSpecBean.selectedSpecQuestion}">
				<div style="height:310px;">
					<h:panelGroup id="tierQtyPnl">
						<ui:include src="tierQty.xhtml" />
					</h:panelGroup>
				</div>
				
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}" 
						icon="ui-icon-accept"
						action="#{templateSpecBackingBean.tierQtyOkAction(templateSpecBean)}"
						partialSubmit="true"
						process="tierQtyPnl"
						update="tierQtyTbl"  
						oncomplete="tierQtyPopup.hide()"  />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel"  oncomplete="tierQtyPopup.hide()" />
				</div>			
			</c:if>
		</p:dialog>

		<p:dialog id="scoringSetPopup" header="#{lbl['lbl.tpl.spec.content.scoring.settings.title']}" widgetVar="scoringSetPopup" modal="true" width="550" height="410">
			<c:if test="#{!empty templateSpecBean.selectedSpecQuestion}">
				<div style="height:370px;">
					<h:panelGroup id="scoreSettPnl">
						<ui:include src="scoringSettings.xhtml" />
					</h:panelGroup>
				</div>
				
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}" 
						icon="ui-icon-accept"
						action="#{templateSpecBackingBean.scoringOkAction(templateSpecBean)}"
						partialSubmit="true"
						process="scoreSettPnl" 
						oncomplete="scoringSetPopup.hide()"  />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel"  oncomplete="scoringSetPopup.hide()" />
				</div>
			</c:if>
		</p:dialog>

</ui:composition>
