<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

		<script>
			$(document).ready(function() {
				updateColspan = function() {
					$(".colspan2").attr('colspan', 2);
					$(".colspan3").attr('colspan', 3);
					$(".colspan4").attr('colspan', 4);
					$(".colspan5").attr('colspan', 5);
					$(".colspan6").attr('colspan', 6);
					$(".colspan7").attr('colspan', 7);
				};
				updateColspan();
			});
		</script>
		
		<p:panel id="spg" header="Specification Content" toggleable="true">
			<h:panelGroup rendered="false">
			Content Type: 
			<p:selectOneMenu value="#{templateSpecBackingBean.managedBean.contentType}">
				<f:selectItem itemLabel="Question" itemValue="#{TplSpecConst.contentTypeQuestion}" />
				<f:selectItem itemLabel="Review" itemValue="#{TplSpecConst.contentTypeReview}" />
				<f:selectItem itemLabel="Answer" itemValue="#{TplSpecConst.contentTypeAnswer}" />
				<f:selectItem itemLabel="Score" itemValue="#{TplSpecConst.contentTypeScore}" />
				<p:ajax event="change" update="questionTbl, saveAnsPG" />
			</p:selectOneMenu>
			
			<h:panelGroup id="saveAnsPG" >
				<p:commandButton value="Save Answer" action="#{templateSpecBackingBean.saveAnswerAction}" 
					rendered="#{templateSpecBackingBean.managedBean.contentType != TplSpecConst.contentTypeQuestion
							and templateSpecBackingBean.managedBean.contentType != TplSpecConst.contentTypeReview}" />
			</h:panelGroup>
			</h:panelGroup>
			<p:dataTable id="questionTbl" var="question" rowIndexVar="row"
				value="#{templateSpecBackingBean.managedBean.specMaster.tplSpecQuestions}"
				scrollable="true" scrollWidth="940">
				
				<ui:param name="isQuestionTypeHeader" value="#{question.questionType == TplSpecConst.questionTypeHeader}" />
				<ui:param name="isQuestionTypeItem" value="#{question.questionType == TplSpecConst.questionTypeItem}" />
				<ui:param name="isContentTypeQuestion" value="#{templateSpecBackingBean.managedBean.contentType == TplSpecConst.contentTypeQuestion}" />
				<ui:param name="isContentTypeReview" value="#{templateSpecBackingBean.managedBean.contentType == TplSpecConst.contentTypeReview}" />
				<ui:param name="isContentTypeAnswer" value="#{templateSpecBackingBean.managedBean.contentType == TplSpecConst.contentTypeAnswer}" />
				<ui:param name="isContentTypeScore" value="#{templateSpecBackingBean.managedBean.contentType == TplSpecConst.contentTypeScore}" />
				<ui:param name="isAnswerTypeDropdown" value="#{question.answerTypeCode.code == PmCodeConst.answerTypeDropdown}" />
				<ui:param name="isAnswerTypeText" value="#{question.answerTypeCode.code == PmCodeConst.answerTypeText}" />
				<ui:param name="isAnswerTypeNumeric" value="#{question.answerTypeCode.code == PmCodeConst.answerTypeNumeric}" />
				<ui:param name="isItemTypeService" value="#{templateSpecBackingBean.managedBean.specMaster.itemTypeCode.code == TplSpecConst.itemTypeService}" />
				<ui:param name="isSpecTypeTechnical" value="#{templateSpecBackingBean.managedBean.specMaster.specTypeCode.code == TplSpecConst.specTypeTechnical}" />
				<ui:param name="isSpecTypeFinancial" value="#{templateSpecBackingBean.managedBean.specMaster.specTypeCode.code == TplSpecConst.specTypeFinancial}" />
				<ui:param name="isEstCostReq" value="#{templateSpecBackingBean.managedBean.specMaster.estCostReq}" />
				<ui:param name="isScoring" value="#{question.scoring}" />
				<ui:param name="columnStyle" value="#{isQuestionTypeHeader ? 'background-color:#dddddd;' : ''}" />
				
				<c:if test="#{isContentTypeQuestion and isSpecTypeTechnical}">
					<ui:decorate template="specColumnQuestionTechnical.xhtml" />
				</c:if>
				<c:if test="#{isContentTypeQuestion and isSpecTypeFinancial}">
					<ui:decorate template="specColumnQuestionView.xhtml" />
					<ui:decorate template="specColumnQuestionFinancial.xhtml" />
				</c:if>
				<c:if test="#{isContentTypeReview}">
					<ui:decorate template="specColumnQuestionView.xhtml" />
					<ui:decorate template="specColumnReview.xhtml" />
				</c:if>
				<c:if test="#{isContentTypeAnswer}">
					<ui:decorate template="specColumnQuestionView.xhtml" />
					<ui:decorate template="specColumnAnswer.xhtml" />
				</c:if>
				<c:if test="#{isContentTypeScore}">
					<ui:decorate template="specColumnQuestionView.xhtml" />
					<ui:decorate template="specColumnAnswerView.xhtml" />
					<ui:decorate template="specColumnScore.xhtml" />
				</c:if>
			</p:dataTable>
		</p:panel>

		<p:dialog header="Delete Confirmation" widgetVar="pp2" showEffect="fade" hideEffect="fade"
			 modal="true" height="100" width="350" resizable="false" >
			<f:facet name="header">
				<h:outputLabel value="Delete Confirmation" />
			</f:facet>
			<h:outputText value="Confirm to delete?" />
			<br />
			<h:outputText value="All child nodes belong to this node will be deleted as well" />
			<br />
			<p:commandButton value="Ok" onclick="pp2.hide();" immediate="true" action="#{templateSpecBackingBean.deleteQuestion}"
				process="@this,spg" update="spg" oncomplete="updateColspan();" />
			<p:commandButton value="Cancel" onclick="pp2.hide();return false" />
		</p:dialog>

		<p:dialog header="Scoring Settings" widgetVar="scoringSetting"
			showEffect="fade" hideEffect="fade" modal="true" height="350"
			width="550" resizable="false">
			<br/>
			<p:panel id="panelOcl">
				<table>
					<tr>
						<td>
							<p:outputLabel value="Scoring:"	/>
						</td>
						<td>
							<p:selectBooleanCheckbox id="checkScore" value="#{templateSpecBackingBean.managedBean.selectedSpecQuestion.scoring}" >
								<p:ajax update="panelOcl" />
							</p:selectBooleanCheckbox>
						</td>
					</tr>
					<tr>
						<td colspan="2"></td>
					</tr>
					<tr>
						<td>
							<p:commandButton value="OK" actionListener="#{templateSpecBackingBean.storeAnswerSetting}" process="@this"
								oncomplete="scoringSetting.hide();return false;" update="spg" />
						</td>
					</tr>
				</table>
			</p:panel>
		</p:dialog>

</ui:composition>
