<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="delConfirmPopup" value="#{templateSpecId}delConfirmPopup" />
	<ui:param name="tierQtyPopup" value="#{templateSpecId}tierQtyPopup" />
	<ui:param name="scoringSetPopup" value="#{templateSpecId}scoringSetPopup" />
	<ui:param name="estimationPopup" value="#{templateSpecId}estimationPopup" />
	<ui:param name="zoneTierPricePopup" value="#{templateSpecId}zoneTierPricePopup" />
	<ui:param name="zoneQtyPopup" value="#{templateSpecId}zoneQtyPopup" />
	<ui:param name="rowsPerPage" value="#{ac:convertAsInteger(50)}" />
	<ui:param name="navToFirstPage" value="#{templateSpecId}questionTblWidget.paginator.setPage(0, false);" />
	<ui:param name="navToNextPage" value="#{templateSpecId}nextBtnWG.getJQ().click();" />
	<ui:param name="addItemSpecOnComplete" value="#{row mod rowsPerPage == (rowsPerPage - 1) ? navToNextPage : ''}" />
<!-- 	#25039 Begin - version zonal -->	
	<ui:param name="zoneEstimationPopup" value="#{templateSpecId}zoneEstimationPopup" />
<!-- 	#25039 End - version zonal -->		
	<p:blockUI block="spg" widgetVar="#{templateSpecId}specBlockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif" />
	</p:blockUI>
	<ui:remove>
		Development #34216 START
		</ui:remove>
	<script type="text/javascript">
		$(document).on('ready', function(){
			blockWidget.show();
		})
	</script>
	<ui:remove>
		Development #34216 END
	</ui:remove>
	<p:panel id="spg" header="#{title}" toggleable="true">
			<h:panelGroup rendered="false">
			Content Type: 
			<p:selectOneMenu value="#{templateSpecBean.contentType}">
				<f:selectItem itemLabel="Question" itemValue="#{TplSpecConst.contentTypeQuestion}" />
				<f:selectItem itemLabel="Review" itemValue="#{TplSpecConst.contentTypeReview}" />
				<f:selectItem itemLabel="Answer" itemValue="#{TplSpecConst.contentTypeAnswer}" />
				<f:selectItem itemLabel="Score" itemValue="#{TplSpecConst.contentTypeScore}" />
				<f:selectItem itemLabel="Update Specification" itemValue="#{TplSpecConst.contentTypeUpdateSpec}" />
				<f:selectItem itemLabel="Question and Answer" itemValue="#{TplSpecConst.contentTypeQuestionAndAsnwer}" />
				<p:ajax event="change" update="questionTbl, saveAnsPG" />
			</p:selectOneMenu>
			
			<p:selectOneMenu value="#{templateSpecBean.specMaster.weightageReq}">
				<f:selectItem itemLabel="Yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
				<p:ajax event="change" partialSubmit="true" process="@this" listener="#{templateSpecBackingBean.updateItemWeightageReq(templateSpecBean)}" />
			</p:selectOneMenu>
			
			<h:panelGroup id="saveAnsPG" >
				<p:commandButton value="Save Answer" action="#{templateSpecBackingBean.saveAnswerAction(templateSpecBean)}" 
					rendered="#{templateSpecBean.contentType != TplSpecConst.contentTypeQuestion
							and templateSpecBean.contentType != TplSpecConst.contentTypeReview}" />
			</h:panelGroup>
			</h:panelGroup>
			
			<ui:param name="isContentTypeQuestion" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeQuestion}" />
			<ui:param name="isContentTypeReview" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeReview}" />
			<ui:param name="isContentTypeAnswer" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeAnswer}" />
			<ui:param name="isContentTypeScore" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeScore}" />
			<ui:param name="isContentTypeUpdateSpec" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeUpdateSpec}" />	
			<ui:param name="isContentTypeQuestionAndAnswer" value="#{templateSpecBean.contentType == TplSpecConst.contentTypeQuestionAndAsnwer}" />
			<ui:param name="isItemTypeService" value="#{templateSpecBean.specMaster.itemTypeCode.parameterCode == ParameterConst.itemTypeService}" />
			<ui:param name="isSpecTypeTechnical" value="#{templateSpecBean.specMaster.specTypeCode.parameterCode == ParameterConst.specificationTypeTechnical}" />
			<ui:param name="isSpecTypeFinancial" value="#{templateSpecBean.specMaster.specTypeCode.parameterCode == ParameterConst.specificationTypeFinancial}" />
			<ui:param name="isEstCostReq" value="#{templateSpecBean.specMaster.estCostReq}" />
			<ui:param name="isFulfilmentTypeReq" value="#{templateSpecBean.specMaster.fulfilTypeReq}" />
			<ui:param name="isDeliveryTermReq" value="#{templateSpecBean.specMaster.deliveryTermReq}" />
			<ui:param name="isSpecificationReq" value="#{templateSpecBean.specMaster.specificationReq}" />
			<ui:param name="isScoringReq" value="#{templateSpecBean.specMaster.scoringReq}" />
			<ui:param name="isDurationByItem" value="#{templateSpecBean.specMaster.durationByItem}" />
			<ui:param name="isZonal" value="#{!empty templateSpecBean.specMaster.tplSpecZone}" />
			<ui:param name="isAllPriceTypesStandard" value="#{templateSpecBackingBean.isAllPriceTypesStandard(templateSpecBean)}" />
			<ui:param name="durationMonth" value="#{templateSpecBean.specMaster.durationMonth}" />
			<ui:param name="isUpdateSpecByAnswers" value="#{templateSpecBean.updateSpecByAnswers}" />
			<ui:param name="isDurationYear" value="#{templateSpecBean.specMaster.durationMonth ge 12}"/>
			<ui:param name="isSqSpec" value="#{templateSpecBean.specMaster.specCreatedBySQ}"/>
			<ui:param name="isPackageItemSpec" value="#{templateSpecBean.evaluatioStageActiveIndex == 1}" />
			<ui:param name="isPartialQt" value="#{templateSpecBean.specMaster.scQtDoc.scQt.partial eq null ? 'false': templateSpecBean.specMaster.scQtDoc.scQt.partial}" />
			<ui:param name="isWeightageReq" value="#{templateSpecBean.specMaster.weightageReq}" />	<!-- Bug #35307@Syazani 12/12/2023 -->
			
			<c:if test="#{isItemTypeService and !isDurationByItem and !isContentTypeQuestion and !isContentTypeQuestionAndAnswer and isSpecTypeFinancial and durationMonth ne null}">
				<table style="width:100%">
				<tr>
					<td width="16%" class="TableFieldLeft">
						<p:outputLabel value="#{lbl['lbl.tpl.spec.duration.month']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td width="84%">
						<c:if test="#{isContentTypeAnswer or isContentTypeScore}">
						<h:outputText id="duraMonId" value="#{templateSpecBean.specMaster.durationMonth}"/>
						</c:if>
						<c:if test="#{!isContentTypeAnswer and !isContentTypeScore}">
							<p:inputText id="durationMonth" style="text-align:right;"
								value="#{templateSpecBean.specMaster.durationMonth}" 
								required="true" maxlength="4"
								label="#{lbl['lbl.tpl.spec.content.duration.month']}" readonly="#{isUpdateSpecByAnswers}">
								<ac:validateNumber maxIntegerDigits="4" integerOnly="true" />
								<p:ajax partialSubmit="true" process="@this" update="@this" />
							</p:inputText>
							<p:message id="durationMonthMsg" for="durationMonth" display="icon" />
						</c:if>
					</td>
				</tr>
				</table>
			</c:if>
			
			<c:if test="#{isContentTypeQuestion or isContentTypeReview or (isContentTypeUpdateSpec and !isUpdateSpecByAnswers)}">
				<c:if test="#{isContentTypeQuestion and editable and isScoringReq}">
					<h:outputText  styleClass="instruction" value="#{lbl['lbl.tpl.spec.content.instruction']}" escape="false" />
				</c:if>
				
			
				<p:remoteCommand name="#{templateSpecId}addedQuestionsTechnical" 
				actionListener="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,-1,TplSpecConst.questionTypeItem)}"
					update="@([id$=questionTbl])" partialSubmit="true" process="@this,questionTbl"
					oncomplete="#{navToFirstPage}"
							 />
				<p:remoteCommand name="#{templateSpecId}SpecReRender" 
					partialSubmit="true" process="@this" update="@(.ac-paginator)"
					oncomplete="#{templateSpecId}specBlockWidget.hide();" />
				<!-- SHAFFUL START HERE (ITEM) -->
				<ac:dataTable id="questionTbl" converter="PositionMetricConverter" value="#{templateSpecBean.specMaster.tplSpecQuestions}" widgetVar="#{templateSpecId}questionTblWidget" var="question" rowIndexVar="row"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					scrollable1="true" scrollWidth1="#{scrollWidth}">					
					<ui:param name="prevSpecQuestion" value="#{row > 0 ? templateSpecBean.specMaster.tplSpecQuestions[row-1] : null}" />
					<ui:param name="isQuestionTypeItem" value="#{question.questionType == TplSpecConst.questionTypeItem}" />
					<ui:param name="isPriceTypeStandard" value="#{question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard}" />
					<ui:param name="isPriceTypeAllStandard" value="#{isPriceTypeStandard or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard}" />
					<ui:param name="isAnswerTypeDropdown" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeDropdown}" />
					<ui:param name="isAnswerTypeText" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeText}" />
					<ui:param name="isAnswerTypeNumeric" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeNumeric}" />
					<ui:param name="isUOMHours" value="#{question.clUom.uomCode == 'H' or question.clUom.uomCode == 'HUR' or question.clUom.uomCode == 'HR'}" />
					<ui:param name="isUOMDays" value="#{question.clUom.uomCode == 'D' or question.clUom.uomCode == 'DAY'}" />
					<ui:param name="isUOMNoOfPerson" value="#{question.clUom.uomCode == 'PRS'}" />
					<ui:param name="delBtnClientId" value="#{templateSpecId}delBtn" />
					<ui:param name="isValidationReq" value="#{param[p:component(delBtnClientId)]==null}" />
					<ui:param name="isQuestion" value="true" />
					
					<c:if test="#{isContentTypeQuestion and (isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq) or isSqSpec) and editable}">
						<f:attribute name="rows" value="#{rowsPerPage}" />
						<ui:decorate template="editablePaginator.xhtml" />
						<ui:decorate template="specColumnQuestion.xhtml" />
						<ui:decorate template="specColumnQuestionTechnical.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeUpdateSpec and isSpecTypeTechnical and editable}">
					   <ui:decorate template="specColumnQuestionViewHeader.xhtml" />
						<ui:decorate template="specColumnQuestionView.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeQuestion and isSpecTypeFinancial and isSpecificationReq and editable and !isSqSpec}">
						<ui:decorate template="specColumnQuestionView.xhtml" />
						<ui:decorate template="specColumnQuestionFinancial.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeReview or !editable}">
						<ui:decorate template="specColumnQuestionView.xhtml" />
						<ui:decorate template="specColumnReview.xhtml" />
					</c:if>
				</ac:dataTable>
				
				<ui:include src="deleteConfirmPopup.xhtml" />
				<ui:include src="tierQtyPopup.xhtml" />
				
				<p:dialog id="scoringSetPopup" header="#{lbl['lbl.tpl.spec.content.scoring.settings.title']}" widgetVar="#{scoringSetPopup}" modal="true" 
				   width="800" height="auto" rendered="#{isScoringReq}" closable="false" position="top">
					
					<c:if test="#{!empty templateSpecBean.selectedSpecQuestion}">
						<h:panelGroup id="scoreSettPnl">
							<p:messages id="scorePopupMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
								
							<ui:include src="scoringSettings.xhtml" />
						</h:panelGroup>
						
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.ok']}" 
								action="#{templateSpecBackingBean.scoringOkAction(templateSpecBean)}"
								partialSubmit="true"
								process="@this, scoreSettPnl"
								update="scoreSettPnl, @(.scoringBtn)">
								<f:setPropertyActionListener target="#{templateSpecBean.specComponentId}" value="#{templateSpecId}" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
								partialSubmit="true" process="@this" update="@this"
								action="#{templateSpecBackingBean.scoringCancelAction(templateSpecBean)}"
								oncomplete="#{scoringSetPopup}.hide()" rendered="#{editable}" />
						</div>
					</c:if>
				</p:dialog>
				
				<p:dialog id="estimationPopup" header="#{lbl['lbl.tpl.spec.content.estimation.title']}" widgetVar="#{estimationPopup}" modal="true" width="450" height="290" closable="false">
					
					<c:if test="#{!empty templateSpecBean.selectedSpecQuestion}">
						<div style="height:250px;">
							<h:panelGroup id="estimationPnl">
								<p:messages id="estPopupMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
								
								<ui:include src="estimationCost.xhtml" />
							</h:panelGroup>
						</div>
						
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.ok']}" 
								action="#{templateSpecBackingBean.estCostOkAction(templateSpecBean)}"
								partialSubmit="true"
								process="@this, estimationPnl"
								update="estimationPnl, @(.calcEstAmount)">
								<f:setPropertyActionListener target="#{templateSpecBean.specComponentId}" value="#{templateSpecId}" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
								partialSubmit="true" process="@this" update="@this"
								action="#{templateSpecBackingBean.estCostCancelAction(templateSpecBean)}"
								oncomplete="#{estimationPopup}.hide()" rendered="#{editable}" />
						</div>			
					</c:if>
				</p:dialog>
				<!-- 	#25039 Begin - version zonal -->
				<!-- 	#25039#67 Begin 
				<p:dialog id="zoneEstimationPopup" header="#{lbl['lbl.tpl.spec.content.estimation.title']}" widgetVar="#{zoneEstimationPopup}" modal="true" width="450" height="290" closable="false">				
				-->
				<p:dialog id="zoneEstimationPopup" header="#{lbl['lbl.tpl.spec.content.estimation.title']}" widgetVar="#{zoneEstimationPopup}" modal="true" width="800" height="auto" closable="false">				
				<!-- 	#25039#67 End -->
					<c:if test="#{!empty templateSpecBean.selectedSpecQuestion}">
						<div style="height:250px;">
							<h:panelGroup id="zoneEstimationPnl">
								<p:messages id="zoneEstPopupMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
								
								<ui:include src="zoneEstimationCost.xhtml" />
							</h:panelGroup>
						</div>
						
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.ok']}" 
								action="#{templateSpecBackingBean.zoneEstCostOkAction(templateSpecBean)}"
								partialSubmit="true"
								process="@this, zoneEstimationPnl"
								update="zoneEstimationPnl, @(.calcEstAmount)"> <!--#25039#67 add indicativeBtn -->
								<f:setPropertyActionListener target="#{templateSpecBean.specComponentId}" value="#{templateSpecId}" />
							</p:commandButton>
							<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
								partialSubmit="true" process="@this" update="@this"
								action="#{templateSpecBackingBean.zoneEstCostCancelAction(templateSpecBean)}"
								oncomplete="#{zoneEstimationPopup}.hide()" rendered="#{editable}" />
						</div>			
					</c:if>
				</p:dialog>
				<!-- 	#25039 End - version zonal -->			
				<ui:include src="zoneQtyPopup.xhtml" />
				
			</c:if>
			
					
			<c:if test="#{isContentTypeAnswer or isContentTypeScore or (isContentTypeUpdateSpec and isUpdateSpecByAnswers)}">
			<ui:fragment
				rendered="#{isContentTypeScore and isSpecTypeTechnical and !evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}">
				<h:outputText rendered="#{!isPartialQt}" styleClass="instruction"
					value="#{lbl['lbl.sc.tec.rating.instruction']}" escape="false" />
				<h:outputText rendered="#{isPartialQt}" styleClass="instruction"
					value="#{lbl['lbl.sc.tec.partialoffer.instruction']}"
					escape="false" />
				<br />
			</ui:fragment>
			<ui:remove> #32110 related to #21695 Farid Start 30/11/2021</ui:remove>
				<ui:param name="filterList" value="#{!isSqSpec and isZonal and !templateSpecBackingBean.filterAllitemQtyZero(templateSpecBean.specAnswerList) and isSpecTypeFinancial and isContentTypeAnswer ? null : templateSpecBean.specAnswerList}">
				
				</ui:param>
				<ui:remove> #32110 related to #21695 Farid End 30/11/2021</ui:remove>
				<ui:remove> #32110 related to #21695 Farid Start 30/11/2021</ui:remove>
				<ui:remove>#29187 Start Vinod</ui:remove>
				<ui:include src="uomAndQuantityDetailsPopUp.xhtml" />
				<ui:remove>#29187 End Vinod</ui:remove>
				<!-- #33859 - start -->
				<!-- SHAFFUL (START HERE)UOM oncomplete="blockWidget.hide();" -->
			    <p:dataTable id="questionTbl" var="tplSpecAnswer" rowIndexVar="row" 
					value="#{filterList}" 	emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					scrollable1="true" scrollWidth1="#{scrollWidth}" style="word-break: break-all">
				<!-- #33859 - end -->
					
					<ui:param name="prevSpecQuestion" value="#{row > 0 ? templateSpecBean.specAnswerList[row-1].tplSpecQuestion : null}" />
					<ui:param name="question" value="#{tplSpecAnswer.tplSpecQuestion}" />
					<ui:param name="isQuestionTypeItem" value="#{question.questionType == TplSpecConst.questionTypeItem}" />
					<ui:param name="isPriceTypeStandard" value="#{question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard}" />
					<ui:param name="isPriceTypeAllStandard" value="#{isPriceTypeStandard or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard}" />
					<ui:param name="isPriceTypeTariff" value="#{question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTariff 
						or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTariff}" />
					<ui:param name="isPriceTypeTier" value="#{question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTier 
						or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypePromotionTier
						or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTier 
						or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalPromotionTier 
						or isPriceTypeTariff}" />
					<ui:param name="isAnswerTypeDropdown" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeDropdown}" />
					<ui:param name="isAnswerTypeText" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeText}" />
					<ui:param name="isAnswerTypeNumeric" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeNumeric}" />
					<ui:param name="isScoring" value="#{question.scoreTypeCode.parameterCode == ParameterConst.scoreTypeAuto}" />
					<ui:param name="isValidationReq" value="#{!empty processValidationId ? param[p:component(processValidationId)]==null : true}" />
					
					<c:if test="#{isContentTypeAnswer}">
						<ui:decorate template="specColumnAnswer.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeScore}">
						<ui:decorate template="specColumnAnswerView.xhtml" />
						<ui:decorate template="specColumnScore.xhtml" />
					</c:if>
					<c:if test="#{isContentTypeUpdateSpec}">
					<ui:decorate template="specColumnQuestionViewHeader.xhtml" />
						<ui:decorate template="specColumnQuestionView.xhtml" />
					</c:if>
				</p:dataTable>
				<!-- SHAFFUL (END HERE)UOM -->
				<ui:remove>
						<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
				</ui:remove>
				<c:if test="#{isContentTypeScore and isSpecTypeFinancial and templateSpecBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}">
					<p:spacer height="10" />
					<table style="width:100%">
					<tr>
						<td class="TableFieldLeft" width="8%">
							<p:outputLabel value="#{lbl['lbl.sc.total.score']}" />
						</td>
						<td class="TableFieldRight" width="92%">
							<p:inputText style="text-align:right;" styleClass="calcScore" size="8" 
								value="#{templateSpecBackingBean.calcTotalScore(templateSpecBean)}"
								disabled="true" />
						</td>
					</tr>
					</table>
				</c:if>
				<ui:remove><!--#25138 total score for technical --></ui:remove>
				<c:if test="#{isContentTypeScore and isSpecTypeTechnical and templateSpecBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}">
					<p:spacer height="10" />
					<table style="width:100%">
					<tr>
						<td class="TableFieldLeft" width="8%">
							<p:outputLabel value="#{lbl['lbl.sc.total.score']}" />
						</td>
						<td class="TableFieldRight" width="92%">
							<p:inputText style="text-align:right;" styleClass="calcScore" size="8" 
								value="#{templateSpecBackingBean.calcTotalScore(templateSpecBean)}"
								disabled="true" />
						</td>
					</tr>
					</table>
				</c:if>
				<ui:remove>
					<!-- //#25138(wip 4serangkai) bug -End 8/6/2023 -->
				</ui:remove>
				<c:if test="#{isContentTypeUpdateSpec}">
					<ui:include src="tierQtyPopup.xhtml" />
				</c:if>
				
				<c:if test="#{isSpecTypeFinancial and isZonal}">
					<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
				</c:if>
				
				<c:if test="#{!isSpecTypeFinancial and isZonal}">
					<ui:include src="zoneQtyPopup.xhtml" />
				</c:if>
			</c:if>
			
			<c:if test="#{isContentTypeQuestionAndAnswer}">
				
				<p:remoteCommand name="#{templateSpecId}addedQuestionsAndAnswers" 
				actionListener="#{templateSpecBackingBean.addQuestion(templateSpecBean, templateSpecBean.specMaster, templateSpecBean.specMaster.tplSpecQuestions,-1,TplSpecConst.questionTypeItem)}"
					update="@([id$=questionTbl])" partialSubmit="true" process="@this,questionTbl"
					oncomplete="#{navToFirstPage}"
							 />
				<p:remoteCommand name="#{templateSpecId}SpecReRender" 
					partialSubmit="true" process="@this" update="@(.ac-paginator)"
					oncomplete="#{templateSpecId}specBlockWidget.hide();" />
					
				<ac:dataTable id="questionTbl" widgetVar="#{templateSpecId}questionTblWidget" var="question" rowIndexVar="row"
					value="#{templateSpecBean.specMaster.tplSpecQuestions}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					scrollable1="true" scrollWidth1="#{scrollWidth}">
					
					<ui:param name="prevSpecQuestion" value="#{row > 0 ? templateSpecBean.specMaster.tplSpecQuestions[row-1] : null}" />
					<ui:param name="isQuestionTypeItem" value="#{question.questionType == TplSpecConst.questionTypeItem}" />
					<ui:param name="isPriceTypeStandard" value="#{question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard}" />
					<ui:param name="isPriceTypeAllStandard" value="#{isPriceTypeStandard or question.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard}" />
					<ui:param name="isAnswerTypeDropdown" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeDropdown}" />
					<ui:param name="isAnswerTypeText" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeText}" />
					<ui:param name="isAnswerTypeNumeric" value="#{question.answerTypeCode.parameterCode == ParameterConst.answerTypeNumeric}" />
					<ui:param name="isUOMHours" value="#{question.clUom.uomCode == 'H' or question.clUom.uomCode == 'HUR' or question.clUom.uomCode == 'HR'}" />
					<ui:param name="isUOMDays" value="#{question.clUom.uomCode == 'D' or question.clUom.uomCode == 'DAY'}" />
