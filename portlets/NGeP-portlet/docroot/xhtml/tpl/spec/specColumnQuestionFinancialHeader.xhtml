<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">

	<ui:param name="isRepeated"
		value="#{prevSpecQuestion != null ? prevSpecQuestion.specQuestionId == question.specQuestionId : false}" />
		<ui:param name="specificationRequired" value="#{isSpecTypeTechnical or isSqSpec or (isSpecTypeFinancial and !isSpecificationReq)}"></ui:param>
	<p:columnGroup type="header">
		<p:row>
			<p:column colspan="1" style="white-space: normal;"
				headerText="#{lbl['lbl.tpl.spec.content.item']}">
				

			</p:column>

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:75px;"
				headerText="#{lbl['lbl.tpl.spec.content.fulfilment.type']}"
				rendered="#{isItemTypeService and isFulfilmentTypeReq}">

			</p:column>
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:8%;white-space:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.uom']}">

			</p:column>


			<c:if test="#{isItemTypeService}">
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:70px;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">

				</p:column>
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:60px;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">

				</p:column>
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:60px;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">

				</p:column>
				<p:column rowspan="#{specificationRequired ? 2 : 1}"
					style="width:2%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.duration.month']}"
					rendered="#{isDurationByItem}">

				</p:column>
			</c:if>

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:75px; white-space:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.price.type']}"
				rendered="#{!isItemTypeService}">

			</p:column>


			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:4%;text-align:right;"
				headerText="#{lbl['lbl.tpl.spec.content.quantity']}">
			</p:column>		
			
			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:100px;white-space:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.supplier.note']}"
				rendered="#{isUpdateSpecByAnswers}">

			</p:column>

			<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:100px;white-space:normal;"
				headerText="#{lbl['lbl.tpl.spec.content.comment']}"
				rendered="#{isUpdateSpecByAnswers}">

			</p:column>
			<ui:insert name="otherHeaderSection" />
		</p:row>
		<p:row rendered="#{specificationRequired}">
			<p:column colspan="1" style="width: 30%;white-space: normal;"
				headerText="#{lbl['lbl.tpl.spec.content.specification']}"
				rendered="#{specificationRequired}">

			</p:column>
		</p:row>
	</p:columnGroup>
</ui:composition>
