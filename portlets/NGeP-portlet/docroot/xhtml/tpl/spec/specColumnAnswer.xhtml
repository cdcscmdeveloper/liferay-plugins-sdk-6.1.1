<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="answerlbl" value="#{isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : 'lbl.tpl.spec.content.answer'}" />
	<ui:param name="remarklbl" value="#{isSqSpec or isSpecTypeTechnical ? 'lbl.sc.supplier.offer' : 'lbl.tpl.spec.content.note'}" /><!-- #29007 Vinod changed lbl.tpl.spec.content.note to lbl.sc.supplier.offer -->
	<ui:decorate template="specColumnQuestionViewHeader.xhtml">
	<ui:define name="otherHeaderSection">
	<ui:param name="specificationRequired" value="#{isSpecTypeTechnical or isSqSpec or (isSpecTypeFinancial and !isSpecificationReq)}"></ui:param>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:80px;" rendered="#{isSpecTypeFinancial and isZonal and (!isSpecificationReq or isSqSpec)}" headerText="#{lbl['lbl.sc.zone']}">
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:50px;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.sub.sequence']}" rendered="#{isSpecTypeFinancial and !isItemTypeService and isSpecificationReq and false}">
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:10%;" rendered="#{isSpecTypeFinancial}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.unit.price']}"/>
		</f:facet>
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:90px;white-space:normal;text-align:right;" rendered="#{isItemTypeService and isSpecTypeFinancial and !isDurationByItem}" headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
		</p:column>
		<p:column rowspan="#{specificationRequired ? 2 : 1}" style="#{isSpecTypeFinancial ? 'width:115px; text-align:right;' : 'width:150px;'}" headerText="#{lbl[answerlbl]}" rendered="#{!isSpecTypeFinancial or (isSpecTypeFinancial and (((!isZonal or isItemTypeService) and !isSpecificationReq) or isSpecificationReq)) and isAllPriceTypesStandard}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" rendered="#{!isSpecTypeFinancial}" />
			<h:outputText value="#{lbl[answerlbl]}"/>
		</f:facet>
	</p:column>
	<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:8%;" rendered="#{!isItemTypeService and isDeliveryTermReq}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.tpl.spec.content.delivery.term']}"/>
		</f:facet>
	</p:column>
	<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:8%;" rendered="#{isItemTypeService and isDeliveryTermReq and isSqSpec}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.tpl.spec.content.service.term']}"/>
		</f:facet>
	</p:column>
	<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:50px;text-align:right;" rendered="#{isSpecTypeFinancial and isEstCostReq and !isScoringReq}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.tpl.spec.content.ranking']}"/>
			<ac:iconTooltip value="#{lbl['lbl.tpl.spec.content.ranking.tooltip']}" />
		</f:facet>
		</p:column>
	<p:column rowspan="#{specificationRequired ? 2 : 1}" style="width:200px;" headerText="#{lbl[remarklbl]}"
		rendered="#{!(isSpecTypeFinancial and !isSpecificationReq) or isSqSpec}">
	</p:column>
	</ui:define>
	</ui:decorate>
	<ui:decorate template="specColumnQuestionView.xhtml">
		<ui:define name="qtySection">
		<!-- #11715 danial start -->
			<p:column style="width:5%;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.quantity']}">
				<h:panelGroup rendered="#{(isSpecTypeFinancial or !isSpecTypeFinancial) and !isRepeated}">
					<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.clQuantity}" rendered="#{isQuestionTypeItem  and (empty templateSpecBean.specMaster.tplSpecZone or !templateSpecBean.specMaster.qtyByZone)}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<h:outputText value="#{tplSpecAnswer.tplSpecZoneQty.qty}" rendered="#{isQuestionTypeItem and isSpecTypeFinancial and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<p:commandButton id="zoneQtyBtn" icon="ui-icon-pencil"
						style="background-color:transparent !important; border:0px none;"
						action="#{templateSpecBackingBean.zoneQtyPopupAction(templateSpecBean)}"
						partialSubmit="true" process="@this"
						update="@([id$=zoneQtyPopup])"
						rendered="#{isQuestionTypeItem and (isSpecTypeTechnical or isSqSpec )and !empty templateSpecBean.specMaster.tplSpecZone and templateSpecBean.specMaster.qtyByZone}">
						<f:setPropertyActionListener
							target="#{templateSpecBean.selectedSpecQuestion}"
							value="#{question}" />
						<f:setPropertyActionListener
							target="#{templateSpecBean.specComponentId}"
							value="#{templateSpecId}" />
					</p:commandButton>
				</h:panelGroup>
			</p:column>
			<!-- #31134 Farid Start 25/6/2021-->
			<p:column style="width:5%;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.tier.title']}" rendered="#{isPriceTypeTier and isSpecTypeFinancial or !isSqSpec and isSpecTypeFinancial and templateSpecBackingBean.checkPriceTierEnableColumn(templateSpecBean)}">
				<h:panelGroup rendered="#{isPriceTypeTier and isSpecTypeFinancial}">
				<!-- Align if has mix data normal standard and tier price -->
					<h:outputText value=" " rendered="#{!isSqSpec and isSpecTypeFinancial and templateSpecBackingBean.checkPriceTierEnableColumn(templateSpecBean)}">
						<f:converter converterId="dynamicNumberConverter" />
					</h:outputText>
				<!-- #31134 Farid End 25/6/2021-->
					<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.fromQty}" rendered="#{isQuestionTypeItem}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{isQuestionTypeItem and empty tplSpecAnswer.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{isQuestionTypeItem and !empty tplSpecAnswer.tplSpecTierQty.toQty}" />
					<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.toQty}" rendered="#{isQuestionTypeItem and !empty tplSpecAnswer.tplSpecTierQty.toQty}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:column style="width:80px;" rendered="#{isSpecTypeFinancial and isZonal and (!isSpecificationReq or isSqSpec)}" >
				<p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl}" />
					<h:outputText value="#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl.zoneName}" rendered="#{tplSpecAnswer.tplSpecTierQty ne null or isQuestionTypeItem}"/>
				</p:commandLink>
			</p:column>
			<!-- #11715 danial end -->
			
			
		</ui:define>
	</ui:decorate>
	
	<p:column style="width:50px;text-align:right;"  rendered="#{isSpecTypeFinancial and !isItemTypeService and isSpecificationReq and false}">
		<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.subSequence}" rendered="#{isQuestionTypeItem and isPriceTypeTariff}">
			<f:converter converterId="dynamicNumberConverter" />
			<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
		</h:outputText>
	</p:column>
	
	<p:column style="width:10%;" rendered="#{isSpecTypeFinancial}">
		<f:facet name="footer">
			<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}" rendered="#{isAllPriceTypesStandard and !(isZonal and isSqSpec)}" />
		</f:facet>
<!-- FARID START #28673 fix bug #21695 -->
		<!-- FARID START  add disable tplSpecAnswer.tplSpecZoneQty.qty eq 0-->
		<p:inputText id="ratePerUom" style="min-width:0px !important; width:calc(100% - 40px); text-align:right;"
			value="#{tplSpecAnswer.ratePerUom}" required="false"
			rendered="#{isQuestionTypeItem}"  maxlength="19"
			label="#{lbl['lbl.tpl.spec.content.unit.price']}"
			disabled="#{!editable or 
			tplSpecAnswer ne null 
			and tplSpecAnswer.tplSpecZoneQty ne null 
			and tplSpecAnswer.tplSpecZoneQty.qty eq 0 
			or tplSpecAnswer.notOfferSingle}">
			<p:ajax event="change" partialSubmit="true" process="@this" update="@this, ratePerUomMsg, ansYearPG, ansPG, @(.calcAmount)" listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, tplSpecAnswer, isItemTypeService)}" />
			<!-- FARID START -->
		<c:if test="#{!isSqSpec and tplSpecAnswer.ratePerUom eq null}">
			<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
			<f:validateDoubleRange minimum="0.01" maximum="99999999999.99" />
		</c:if>
		<!-- FARID END -->
		</p:inputText>
		
		<p:message id="ratePerUomMsg" for="ratePerUom" display="icon" />
	</p:column>
	<p:column style="width:90px;white-space:normal;text-align:right;" rendered="#{isItemTypeService and isSpecTypeFinancial and !isDurationByItem}">
		<f:facet name="footer">
			<h:outputText id="totalAmountPerYr" rendered="#{isDurationYear}"
				styleClass="calcAmount" 
				value="#{templateSpecBean.specMaster.totalAmountPerYear}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:panelGroup id="ansYearPG" rendered="#{isDurationYear}">
			<h:outputText 
				value="#{tplSpecAnswer.amountPerYear}"
				rendered="#{isQuestionTypeItem}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
		<h:panelGroup rendered="#{!isDurationYear}">
			<h:outputText value="#{lbl['lbl.txt.na']}"/>
		</h:panelGroup>
	</p:column>
	
	<p:column style="#{isSpecTypeFinancial ? 'width:115px; text-align:right;' : 'width:150px;'}"  rendered="#{!isSpecTypeFinancial or (isSpecTypeFinancial and (((!isZonal or isItemTypeService) and !isSpecificationReq) or isSpecificationReq)) and isAllPriceTypesStandard}">
		
		<f:facet name="footer">
			<h:outputText id="totalAmount" 
				styleClass="calcAmount" 
				value="#{templateSpecBean.specMaster.totalAmount}"
				rendered="#{isSpecTypeFinancial and isAllPriceTypesStandard and !(isZonal and isSqSpec)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
<!-- #21695 Farid start 1/4/2021-->	
		<h:panelGroup id="ansPG">
			<p:inputTextarea id="answerText" style="width:calc(100% - 40px);" value="#{tplSpecAnswer.answerText}" 
			onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);" onmouseout="limitTextArea(this,1000);"
				rendered="#{isAnswerTypeText}" required="false" rows="1" 
				label="#{lbl[answerlbl]}" disabled="#{(!editable or !isSqSpec and tplSpecAnswer.offer ne null and !tplSpecAnswer.offer and !isZonal) or (!isSqSpec and isSpecTypeTechnical and isZonal and templateSpecBean.specMaster.scQtDoc.scQt.partial eq true and templateSpecBackingBean.evaluateSpecDisable(tplSpecAnswer) and !tplSpecAnswer.offer)}"> 
				<p:ajax partialSubmit="true" process="@this" update="@this, answerTextMsg" />
				<f:validateLength for="answerText" maximum="1000" />
			</p:inputTextarea>
			<p:message id="answerTextMsg" for="answerText" display="icon" rendered="#{isAnswerTypeText}" />
			<h:outputText value="#{templateSpecBackingBean.getParameterDesc(tplSpecAnswer.tplSpecQuestion.answerTypeCode)}" rendered="#{isAnswerTypeText}"/><!-- #29007	Vinod Added -->
			<p:inputText id="answerNumeric" style="width:calc(100% - 40px); text-align:right;" 
				value="#{tplSpecAnswer.answerNumeric}" maxlength="19"
				rendered="#{isAnswerTypeNumeric and !isSpecTypeFinancial}" required="false"
				label="#{lbl[answerlbl]}" disabled="#{!editable or (!isSqSpec and tplSpecAnswer.offer ne null and !tplSpecAnswer.offer and !isZonal) or (!isSqSpec and isSpecTypeTechnical and isZonal and templateSpecBean.specMaster.scQtDoc.scQt.partial eq true and templateSpecBackingBean.evaluateSpecDisable(tplSpecAnswer) and !tplSpecAnswer.offer)}"> 
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
				<p:ajax partialSubmit="true" process="@this" update="@this, answerNumericMsg" />
			</p:inputText>
			<p:message id="answerNumericMsg" for="answerNumeric" display="icon" rendered="#{isAnswerTypeNumeric and !isSpecTypeFinancial}" />
			<h:outputText value="#{templateSpecBackingBean.getParameterDesc(tplSpecAnswer.tplSpecQuestion.answerTypeCode)}" rendered="#{isAnswerTypeNumeric and !isSpecTypeFinancial}"/><!-- #29007	Vinod Added -->
			<h:outputText id="answerNumText" 
				value="#{tplSpecAnswer.answerNumeric}"
				rendered="#{isAnswerTypeNumeric and (isSpecTypeFinancial and !isPriceTypeTier)}"
				disabled="#{!editable or (!isSqSpec and tplSpecAnswer.offer ne null and !tplSpecAnswer.offer and !isZonal) or (!isSqSpec and  isSpecTypeTechnical and isZonal and templateSpecBean.specMaster.scQtDoc.scQt.partial eq true and templateSpecBackingBean.evaluateSpecDisable(tplSpecAnswer) and !tplSpecAnswer.offer)}"> 
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
			<h:selectOneMenu id="answerCompliance" style="width:calc(100% - 30px);" 
				value="#{tplSpecAnswer.answerCompliance}" 
				rendered="#{isAnswerTypeDropdown}" required="false"
				label="#{lbl[answerlbl]}" 
				disabled="#{!editable or (!isSqSpec and tplSpecAnswer.offer ne null and !tplSpecAnswer.offer and !isZonal) or (!isSqSpec and isSpecTypeTechnical and isZonal and templateSpecBean.specMaster.scQtDoc.scQt.partial eq true and templateSpecBackingBean.evaluateSpecDisable(tplSpecAnswer) and !tplSpecAnswer.offer)}"> 
				<f:selectItems value="#{templateSpecBackingBean.getDropdownCodeValues(ParameterTypeConst.yesNoFlag)}" />
			</h:selectOneMenu>
			<p:message id="answerComplianceMsg" for="answerCompliance" display="icon" rendered="#{isAnswerTypeDropdown}" />
<!-- #21695 Farid end 1/4/2021-->				
<!-- #21695 Farid start 3/8/2021-->	
			<h:panelGroup layout="div" rendered="#{!isSqSpec and 
														
												   !isSpecTypeFinancial}">
				<h:selectOneMenu id="answerOffer" style="width:calc(100% - 30px);" 
						value="#{tplSpecAnswer.offer}"
						rendered="#{!isSqSpec and templateSpecBean.specMaster.scQtDoc.scQt.partial ne null and 
						templateSpecBean.specMaster.scQtDoc.scQt.partial eq true and
						!isSpecTypeFinancial and isQuestionTypeItem}" 
						label="#{lbl[answerlbl]}"
						disabled="#{!editable}">
					<f:selectItems value="#{templateSpecBackingBean.offerDetails}"></f:selectItems>
									  
					<p:ajax event="change" partialSubmit="true" process="@form" update="@form"
						
					     		listener="#{templateSpecBackingBean.offerTypeChange(tplSpecAnswer.offer,tplSpecAnswer.tplSpecQuestion.specQuestionId,row)}"/>					  							  	
	   
				</h:selectOneMenu>
<!-- #21695 Farid start 3/8/2021-->					
		<c:if test="#{isZonal}">		
			<h:panelGroup layout="div" 
			rendered="#{!tplSpecAnswer.offer and tplSpecAnswer.offer ne null and
						templateSpecBean.specMaster.scQtDoc.scQt.partial ne null and
						templateSpecBean.specMaster.scQtDoc.scQt.partial eq true and isZonal
						and isQuestionTypeItem}"
			disabled="#{!editable}">
<!-- #21695 Farid end 3/8/2021-->						
							<ui:decorate template="specColumnAnswerOfferZone.xhtml" />
			</h:panelGroup>	
		</c:if>					
		</h:panelGroup>	
<!-- #21695 Farid end 3/8/2021-->			
	 
<!-- END -->
		
		</h:panelGroup>
	</p:column>
	<p:column style="width:8%;" rendered="#{!isItemTypeService and isDeliveryTermReq}">
		
		<h:panelGroup rendered="#{!isRepeated}">
			<h:outputText id="deliveryTerm" 
				value="#{question.clDeliveryTerm}" 
				rendered="#{isQuestionTypeItem}" />
			&#160;
			<h:outputText id="delTermType" 
				value="#{templateSpecBackingBean.getParameterDesc(question.clDeliveryTermTypeCode)}"  
				rendered="#{isQuestionTypeItem}" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:8%;" rendered="#{isItemTypeService and isDeliveryTermReq and isSqSpec}">
		
		<h:panelGroup rendered="#{!isRepeated}">
			<h:outputText id="serviceTerm" 
				value="#{question.clDeliveryTerm}" 
				rendered="#{isQuestionTypeItem}" />
			&#160;
			<h:outputText id="servTermType" 
				value="#{templateSpecBackingBean.getParameterDesc(question.clDeliveryTermTypeCode)}"  
				rendered="#{isQuestionTypeItem}" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:50px;text-align:right;" rendered="#{isSpecTypeFinancial and isEstCostReq and !isScoringReq}">
		
		<h:outputText value="#{tplSpecAnswer.tplSpecSuppAnswer.ranking}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
		</h:outputText>
	</p:column>
	<p:column  style="width:200px;"  rendered="#{!(isSpecTypeFinancial and !isSpecificationReq) and !isSqSpec}"> <!-- #29006 add !isSqSpec -->
		<p:inputTextarea id="answerRemarks" label="#{lbl[remarklbl]}" style="width:calc(100% - 15px);" value="#{tplSpecAnswer.answerRemark}" 
		disabled="#{!editable}" rows="1"  onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
		onmouseout="limitTextArea(this,1000);" rendered="#{!isSqSpec or (isSqSpec and isQuestionTypeItem)}">
		<p:ajax partialSubmit="true" process="@this" update="@this" />
		<f:validateLength for="answerRemarks" maximum="1000" />
		</p:inputTextarea>
		<p:message id="answerRemarksMsg" for="answerRemarks" display="icon" />
	</p:column>
	<!-- #29006 start -->
	<p:column  style="width:200px;"  rendered="#{!(isSpecTypeFinancial and !isSpecificationReq) and isSqSpec}">
	
	<c:if test="#{isZonal}">
		<h:panelGroup rendered="#{!isRepeated}">
			<p:inputTextarea id="answerSqZonalRemarks" label="#{lbl[remarklbl]}" style="width:calc(100% - 15px);" value="#{tplSpecAnswer.answerRemark}" 
			disabled="#{!editable}" rows="1"  onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
			onmouseout="limitTextArea(this,1000);" rendered="#{!isSqSpec or (isSqSpec and isQuestionTypeItem)}">
			<p:ajax partialSubmit="true" process="@this" update="@this" />
			<f:validateLength for="answerSqZonalRemarks" maximum="1000" />
			</p:inputTextarea>
			<p:message id="answerSqZonalRemarksMsg" for="answerSqZonalRemarks" display="icon" />
		</h:panelGroup>	
	</c:if>	
	<c:if test="#{!isZonal}">
		<p:inputTextarea id="answerSqRemarks" label="#{lbl[remarklbl]}" style="width:calc(100% - 15px);" value="#{tplSpecAnswer.answerRemark}" 
		disabled="#{!editable}" rows="1"  onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
		onmouseout="limitTextArea(this,1000);" rendered="#{!isSqSpec or (isSqSpec and isQuestionTypeItem)}">
		<p:ajax partialSubmit="true" process="@this" update="@this" />
		<f:validateLength for="answerSqRemarks" maximum="1000" />
		</p:inputTextarea>
		<p:message id="answerSqRemarksMsg" for="answerSqRemarks" display="icon" />
	</c:if>	
		
	</p:column>
	<!-- #29006 end -->
</ui:composition>
