<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:decorate template="specColumnQuestionView.xhtml">
		<ui:define name="qtySection">
			<p:column style="width:65px;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.quantity']}">
				<h:panelGroup rendered="#{isPriceTypeTier and isSpecTypeFinancial}">
					<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.fromQty}" rendered="#{isQuestionTypeItem}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
					<h:outputText value=" - " rendered="#{isQuestionTypeItem}">
					</h:outputText> 
					<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.toQty}" rendered="#{isQuestionTypeItem}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
				<h:panelGroup rendered="#{((!isPriceTypeTier and isSpecTypeFinancial) or !isSpecTypeFinancial) and !isRepeated}">
					<h:outputText value="#{tplSpecAnswer.tplSpecQuestion.clQuantity}" rendered="#{isQuestionTypeItem}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			
			<p:column style="width:80px;" rendered="#{isSpecTypeFinancial and isZonal}" headerText="#{lbl['lbl.sc.zone']}">
				<p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl}" />
					<h:outputText value="#{tplSpecAnswer.tplSpecSuppAnswer.tplSpecZoneDtl.zoneName}" />
				</p:commandLink>
			</p:column>
		</ui:define>
	</ui:decorate>
	
	<p:column style="width:50px;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.sub.sequence']}" rendered="#{isSpecTypeFinancial and !isItemTypeService and isSpecificationReq}">
		<h:outputText value="#{tplSpecAnswer.tplSpecTierQty.subSequence}" rendered="#{isQuestionTypeItem and isPriceTypeTariff}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, tplSpecAnswer.tplSpecQuestion.clUom.uomCode)}" />
		</h:outputText>
	</p:column>
	
	<p:column style="width:55px;" rendered="#{isSpecTypeFinancial}" headerText="#{lbl['lbl.tpl.spec.content.unit.price']}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.unit.price']}"/>
		</f:facet>
		<f:facet name="footer">
			<h:outputText value="#{lbl['lbl.tpl.spec.specification.total']}" rendered="#{isAllPriceTypesStandard}" />
		</f:facet>
		
		<p:inputText id="ratePerUom" style="min-width:0px !important;width:96%;" styleClass="ppNumericAlign"
			value="#{tplSpecAnswer.ratePerUom}"
			rendered="#{isQuestionTypeItem}" required="#{isScoringReq}" maxlength="19"
			label="#{lbl['lbl.tpl.spec.content.unit.price']}">
			<p:ajax event="blur" partialSubmit="true" process="@this" update="ansYearPG, ansPG, @(.calcAmount)" listener="#{templateSpecBackingBean.calcTotalAmount(templateSpecBean, tplSpecAnswer, isItemTypeService)}" />
			<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
		</p:inputText>
		<p:message id="ratePerUomMsg" for="ratePerUom" display="icon" />
	</p:column>
	<p:column style="width:90px;white-space:normal;text-align:right;" rendered="#{isItemTypeService and isSpecTypeFinancial and !isDurationByItem}" headerText="#{lbl['lbl.tpl.spec.content.amount.per.year']}">
		<f:facet name="footer">
			<h:outputText id="totalAmountPerYr" 
				styleClass="calcAmount" 
				value="#{templateSpecBean.specMaster.totalAmountPerYear}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		<h:panelGroup id="ansYearPG">
			<h:outputText 
				value="#{tplSpecAnswer.amountPerYear}"
				rendered="#{isQuestionTypeItem}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</h:panelGroup>
	</p:column>
	<ui:param name="answerlbl" value="#{isSpecTypeFinancial ? 'lbl.tpl.spec.content.total.amount' : 'lbl.tpl.spec.content.answer'}" />
	<p:column style="width:115px;#{isSpecTypeFinancial ? 'text-align:right;' : ''}" headerText="#{lbl[answerlbl]}" rendered="#{!isZonal}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" rendered="#{!isSpecTypeFinancial}" />
			<h:outputText value="#{lbl[answerlbl]}"/>
		</f:facet>
		<f:facet name="footer">
			<h:outputText id="totalAmount" 
				styleClass="calcAmount" 
				value="#{templateSpecBackingBean.calcGrandTotalAmount(templateSpecBean)}"
				rendered="#{isSpecTypeFinancial and isAllPriceTypesStandard}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</f:facet>
		
		<h:panelGroup id="ansPG">
			<p:inputText id="answerText" style="width:96%;" value="#{tplSpecAnswer.answerText}" 
				rendered="#{isAnswerTypeText}" required="#{question.clAnswerRequired}" maxlength="200"
				label="#{lbl[answerlbl]}" />
			<p:message id="answerTextMsg" for="answerText" display="icon" rendered="#{isAnswerTypeText and question.clAnswerRequired}" />
			<p:inputText id="answerNumeric" style="width:96%;" styleClass="ppNumericAlign" 
				value="#{tplSpecAnswer.answerNumeric}" maxlength="19"
				rendered="#{isAnswerTypeNumeric and !isSpecTypeFinancial}" required="#{question.clAnswerRequired}"
				label="#{lbl[answerlbl]}">
				<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
			</p:inputText>
			<p:message id="answerNumericMsg" for="answerNumeric" display="icon" rendered="#{isAnswerTypeNumeric and ((isSpecTypeFinancial and !isPriceTypeTier) or !isSpecTypeFinancial) and question.clAnswerRequired}" />
			<h:outputText id="answerNumText" 
				value="#{tplSpecAnswer.answerNumeric}"
				rendered="#{isAnswerTypeNumeric and (isSpecTypeFinancial and !isPriceTypeTier)}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
			<h:selectOneMenu id="answerCompliance" style="width:100%;" 
				value="#{tplSpecAnswer.answerCompliance}" 
				rendered="#{isAnswerTypeDropdown}" required="#{question.clAnswerRequired}"
				label="#{lbl[answerlbl]}">
				<f:selectItems value="#{templateSpecBackingBean.getDropdownCodeValues(ParameterTypeConst.yesNoFlag)}" />
			</h:selectOneMenu>
			<p:message id="answerComplianceMsg" for="answerCompliance" display="icon" rendered="#{isAnswerTypeDropdown and question.clAnswerRequired}" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:140px;" rendered="#{!isItemTypeService and isDeliveryTermReq}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.tpl.spec.content.delivery.term']}"/>
		</f:facet>
		<h:panelGroup rendered="#{!isRepeated}">
			<h:outputText id="deliveryTerm" 
				value="#{question.clDeliveryTerm}" 
				rendered="#{isQuestionTypeItem}" />
			&#160;
			<h:outputText id="delTermType" 
				value="#{templateSpecBackingBean.getParameterDesc(question.clDeliveryTermTypeCode)}"  
				rendered="#{isQuestionTypeItem}" />
		</h:panelGroup>
	</p:column>
	<p:column style="width:50px;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.ranking']}" rendered="#{isSpecTypeFinancial and isEstCostReq and !isScoringReq}">
		<h:outputText value="#{tplSpecAnswer.tplSpecSuppAnswer.ranking}">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
		</h:outputText>
	</p:column>
	<p:column style="width:130px;" headerText="#{lbl['lbl.tpl.spec.content.note']}" rendered="#{!(isSpecTypeFinancial and !isSpecificationReq)}">
		<p:inputTextarea style="width:96%;" value="#{tplSpecAnswer.answerRemark}" rows="1" maxlength="500" />
	</p:column>
</ui:composition>
