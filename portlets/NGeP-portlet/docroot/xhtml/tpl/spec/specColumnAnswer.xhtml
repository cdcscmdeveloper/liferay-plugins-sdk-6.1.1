<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<p:column style="#{columnStyle}width:60px;" rendered="#{isSpecTypeFinancial}">
		<h:outputLabel value="Rate per UOM" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.tplSpecAnswer.ratePerUom}"
			rendered="#{isQuestionTypeItem and !empty question.tplSpecAnswer}">
			<p:ajax event="blur" partialSubmit="true" process="@this" update="ansPG" listener="#{templateSpecBackingBean.calcTotalAmount(question.tplSpecAnswer, isItemTypeService)}" />
		</p:inputText>
	</p:column>
	<p:column style="#{columnStyle}width:60px;" rendered="#{isItemTypeService and isSpecTypeFinancial}">
		<h:outputLabel value="Amount/Year" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.tplSpecAnswer.amountPerYear}"
			rendered="#{isQuestionTypeItem and !empty question.tplSpecAnswer}">
			<p:ajax event="blur" partialSubmit="true" process="@this" update="ansPG" listener="#{templateSpecBackingBean.calcTotalAmount(question.tplSpecAnswer, isItemTypeService)}" />
		</p:inputText>
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="#{isSpecTypeFinancial ? 'Total Price' : 'Answer'}" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<h:panelGroup id="ansPG" rendered="#{!isQuestionTypeHeader and !empty question.tplSpecAnswer}">
			<p:inputText value="#{question.tplSpecAnswer.answerText}" rendered="#{isAnswerTypeText}" required="#{question.clAnswerRequired}" />
			<p:inputText value="#{question.tplSpecAnswer.answerNumeric}" rendered="#{isAnswerTypeNumeric}" disabled="#{isSpecTypeFinancial}" required="#{question.clAnswerRequired}" />
			<p:selectOneMenu style="width:120px;" value="#{question.tplSpecAnswer.answerCompliance}" rendered="#{isAnswerTypeDropdown}" required="#{question.clAnswerRequired}">
				<f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
				<f:selectItem itemLabel="Yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
			</p:selectOneMenu>
		</h:panelGroup>
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Remark" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText value="#{question.tplSpecAnswer.answerRemark}" rendered="#{!isQuestionTypeHeader and !empty question.tplSpecAnswer}" />
	</p:column>
</ui:composition>
