<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:decorate template="specColumnQuestionView.xhtml">
		<ui:define name="answerSection">
			<p:column style="#{columnStyle}width:55px;" rendered="#{isSpecTypeFinancial}">
				<h:outputLabel value="Rate per UOM" style="float: left; white-space: normal !important;" rendered="#{isQuestionTypeHeader}" />
				<p:inputText style="min-width:0px !important" size="6" dir="rtl" value="#{question.tplSpecAnswer.ratePerUom}"
					rendered="#{isQuestionTypeItem and !empty question.tplSpecAnswer}">
					<p:ajax event="blur" partialSubmit="true" process="@this" update="ansYearPG, ansPG" listener="#{templateSpecBackingBean.calcTotalAmount(question.tplSpecAnswer, isItemTypeService)}" />
				</p:inputText>
			</p:column>
		</ui:define>
	</ui:decorate>
	
	<p:column style="#{columnStyle}width:95px;" rendered="#{isItemTypeService and isSpecTypeFinancial and noOfYear > 1}">
		<h:outputLabel value="Amount per year" style="float: left; white-space: normal !important;" rendered="#{isQuestionTypeHeader}" />
		<h:panelGroup id="ansYearPG">
			<p:inputText style="min-width:0px !important" size="13" dir="rtl" value="#{question.tplSpecAnswer.amountPerYear}"
				rendered="#{isQuestionTypeItem and !empty question.tplSpecAnswer}" disabled="true" />
		</h:panelGroup>
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="#{isSpecTypeFinancial ? 'Total Amount' : 'Answer'}" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<h:panelGroup id="ansPG" rendered="#{!isQuestionTypeHeader and !empty question.tplSpecAnswer}">
			<p:inputText size="19" value="#{question.tplSpecAnswer.answerText}" rendered="#{isAnswerTypeText}" required="#{question.clAnswerRequired}" />
			<p:inputText size="19" dir="rtl" value="#{question.tplSpecAnswer.answerNumeric}" rendered="#{isAnswerTypeNumeric}" disabled="#{isSpecTypeFinancial}" required="#{question.clAnswerRequired}" />
			<h:selectOneMenu style="width:120px;" value="#{question.tplSpecAnswer.answerCompliance}" rendered="#{isAnswerTypeDropdown}" required="#{question.clAnswerRequired}">
				<f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
				<f:selectItem itemLabel="Yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
			</h:selectOneMenu>
		</h:panelGroup>
	</p:column>
	<p:column style="#{columnStyle}width:130px;">
		<h:outputLabel value="Note" style="float: left" rendered="#{isQuestionTypeHeader}" />
		<p:inputText size="19" value="#{question.tplSpecAnswer.answerRemark}" rendered="#{!isQuestionTypeHeader and !empty question.tplSpecAnswer}" />
	</p:column>
</ui:composition>
