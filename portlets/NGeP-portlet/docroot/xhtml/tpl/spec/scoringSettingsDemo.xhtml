<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<style>
	#labelId1, #labelId2, #scoreId1, #scoreId2{
	border: 0 !important;
}
</style>
	
	<ui:param name="isQuestionTypeItem" value="#{specificationBackingBean.managedBean.templateSpecBean.selectedSpecQuestion.questionType == TplSpecConst.questionTypeItem}" />
	
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
	<ui:param name="itemSpecInfo" value="#{isQuestionTypeItem ? specificationBackingBean.managedBean.templateSpecBean.selectedSpecQuestion.clItem : specificationBackingBean.managedBean.templateSpecBean.selectedSpecQuestion.clSpecDetail}"></ui:param>
	<tr>
		<td id="labelId1"><p:outputLabel value="#{lbl[isQuestionTypeItem ? 'lbl.tpl.spec.content.item' : 'lbl.tpl.spec.content.specification']}" /></td>
		<td id="labelId2" colspan="3" >
			<h:inputTextarea id="itemSpec" style="width:calc(100% - 50px);"
			value="#{itemSpecInfo}" 
			disabled="true" autoResize="false" rows="#{templateSpecBackingBean.getNumOfRows(itemSpecInfo)}"/>
		</td>
	</tr>
	<tr>
		<td id="scoreId1">
			<h:panelGroup id="maxScoreLPG">
				<p:outputLabel value="#{lbl['lbl.tpl.spec.content.scoring.settings.max.score']}" />
					<p:outputLabel value="*" styleClass="mandatory" 
					rendered="#{editable and specificationBackingBean.managedBean.templateSpecBean.selectedSpecQuestion.scoreTypeCode.parameterCode == ParameterConst.scoreTypeUser}" />
			</h:panelGroup>
		</td>
		<td id="scoreId1">
			<h:panelGroup id="maxScorePG">
				<p:inputText id="maxScore" style="text-align:right;"
					value="#{specificationBackingBean.managedBean.templateSpecBean.selectedSpecQuestion.demoScore}" 
					required="true" size="15" maxlength="3"
					onkeypress="if (event.keyCode == 46) { return false; }"
					disabled="#{!editable}"
					label="#{lbl['lbl.demo.spec.demo.score.setting']}">
					<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" maxIntegerDigits="3" integerOnly="true" />
				</p:inputText>
				<p:message id="maxScoreMsg" for="maxScore" display="icon" />
			</h:panelGroup>
		</td>
	</tr>
	</table>
	
	<br />
</ui:composition>
