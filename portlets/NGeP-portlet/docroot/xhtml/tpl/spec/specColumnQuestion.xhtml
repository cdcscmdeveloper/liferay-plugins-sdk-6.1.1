<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:column style="width:18%">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" rendered="#{newable}" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.item']}"/>
		</f:facet>
		<c:if test="#{newable}">
			<p:inputTextarea id="itemName" style="width:150px" value="#{question.clItem}" 
				rendered="#{isQuestionTypeItem}" required="#{isValidationReq}" rows="2" maxlength="2000"
				onkeyup="limitTextArea(this,2000);" onkeydown="limitTextArea(this,2000);"
				label="#{lbl['lbl.tpl.spec.content.item']}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="itemNameMsg" for="itemName" display="icon" />
		</c:if>
		<c:if test="#{!newable}">
			<h:outputText value="#{question.clItem}" escape="false" rendered="#{isQuestionTypeItem}" />
		</c:if>
	</p:column>
	<p:column rendered="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq)}"> 
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.specification']}"/>
		</f:facet>
		<c:if test="#{newable}">
			<p:inputTextarea id="specification" style="width:calc(100% - 20px);" value="#{question.clSpecDetail}" 
				rendered="#{!isQuestionTypeItem or !isSpecificationReq}" required="#{isValidationReq}" rows="5" maxlength="1000"
				onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
				label="#{lbl['lbl.tpl.spec.content.specification']}" autoResize="false">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="specificationMsg" for="specification" display="icon" />
		</c:if>
		<c:if test="#{!newable}">
			<h:outputText value="#{templateSpecBackingBean.replaceWithBR(question.clSpecDetail)}" escape="false" rendered="#{!isQuestionTypeItem or !isSpecificationReq}" 
			style="white-space: normal;word-wrap: break-word;" />
		</c:if>
	</p:column>
	<p:column style="width:98px;" rendered="#{isItemTypeService and isFulfilmentTypeReq}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.fulfilment.type']}"/>
		</f:facet>
		<h:selectOneMenu id="fulfilType" value="#{question.clFulfilmentTypeCode.parameterId}" required="#{isValidationReq}" style="width:98px;" 
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.fulfilment.type']}">
			<f:selectItems value="#{templateSpecBackingBean.getFulfilmentTypeDropdownList(templateSpecBean.specMaster)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.fulfilmentTypeChange(question)}" 
				partialSubmit="true" process="@this" update="fulfilTypeMsg, freqUOMPG, dayUOMPG, monthUOMPG, durationPG" />
		</h:selectOneMenu>
		<p:message id="fulfilTypeMsg" for="fulfilType" display="icon" />
	</p:column>
	<p:column style="width:120px;">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.uom']}"/>
		</f:facet>
		
		<c:if test="#{newable}">
			<h:panelGroup layout="block" style="width:120px;">
				<ac:lov id="#{templateSpecId}uomLovId" lovId="PM_UOM" 
					headerText="#{lbl['lbl.sc.uom']}"
					saveObject="templateSpecBackingBean.managedBean.tplSpecQuestions[#{row}].clUom"
					value="#{question.clUom.uomCode}"
					conditionField="recordStatus^1"
					rendered="#{isQuestionTypeItem}"
					required="#{!question.selected}"
					label="#{lbl['lbl.tpl.spec.content.uom']}"
					size="8"
					readonly="true"
					update="@form">
					<f:setPropertyActionListener for="actionEvent" target="#{templateSpecBackingBean.managedBean.tplSpecQuestions}" value="#{templateSpecBean.specMaster.tplSpecQuestions}" />
				</ac:lov>
			</h:panelGroup>
			<h:outputText value="#{question.clUom.uomName}" />
		</c:if>
		<c:if test="#{!newable}">
			<h:outputText value="#{question.clUom.uomName}" rendered="#{isQuestionTypeItem}" />
		</c:if>
	</p:column>
	
	<ui:param name="isFulfilmentTypeOneOff" value="#{question.clFulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff}" />
	<ui:param name="isShowService" value="#{(!isFulfilmentTypeReq or (isFulfilmentTypeReq and !isFulfilmentTypeOneOff))}" />
	<c:if test="#{isItemTypeService}">
		<p:column style="width:70px;white-space:normal;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}"/>
			</f:facet>
			<h:panelGroup id="freqUOMPG" style="white-space:nowrap;">
				<p:inputText id="freqUOM" style="min-width:0px !important;width:50px; text-align:right;" 
					value="#{question.clUomFrequency}" 
					rendered="#{isQuestionTypeItem and isShowService}" required="#{isValidationReq}" maxlength="5"
					label="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
					<ac:validateNumber  maxIntegerDigits="7"  pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					<p:ajax partialSubmit="true" process="@this" update="@this, freqUOMMsg" />
				</p:inputText>
				<p:message id="freqUOMMsg" for="freqUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:60px;white-space:normal;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}"/>
			</f:facet>
			<h:panelGroup id="dayUOMPG" style="white-space:nowrap;">
				<p:inputText id="dayUOM" style="min-width:0px !important;width:22px; text-align:right;"
					value="#{question.clUomPerDay}" 
					rendered="#{isQuestionTypeItem and isUOMHours and isShowService}" required="#{isValidationReq}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
					<ac:validateNumber pattern="0.0" maxIntegerDigits="3" />
					<p:ajax partialSubmit="true" process="@this" update="@this, dayUOMMsg" />
					<f:attribute name="min" value="0.1" />
					<f:attribute name="max" value="23.9" />
				</p:inputText>
				<p:message id="dayUOMMsg" for="dayUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:60px;white-space:normal;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}"/>
			</f:facet>
			<h:panelGroup id="monthUOMPG" style="white-space:nowrap;">
				<p:inputText id="monthUOM" style="min-width:0px !important;width:22px; text-align:right;"
					value="#{question.clUomPerMonth}" 
					rendered="#{isQuestionTypeItem and (isUOMHours or isUOMDays) and isShowService}" required="#{isValidationReq}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
					<ac:validateNumber pattern="0.0" maxIntegerDigits="3" />
					<p:ajax partialSubmit="true" process="@this" update="@this, monthUOMMsg" />
					<f:attribute name="min" value="0.1" />
					<f:attribute name="max" value="31.0" />
				</p:inputText>
				<p:message id="monthUOMMsg" for="monthUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:63px;white-space:normal;" rendered="#{isDurationByItem}">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.duration.month']}"/>
			</f:facet>
			<h:panelGroup id="durationPG" style="white-space:nowrap;">
				<p:inputText id="duration" style="min-width:0px !important;width:30px; text-align:right;"
					value="#{question.clDurationMonth}" 
					rendered="#{isQuestionTypeItem and isShowService}" required="#{isValidationReq}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.duration.month']}">
					<ac:validateNumber maxIntegerDigits="4" integerOnly="true" />
					<p:ajax partialSubmit="true" process="@this" update="@this, durationMsg" />
				</p:inputText>
				<p:message id="durationMsg" for="duration" display="icon" />
			</h:panelGroup>
		</p:column>
	</c:if>
	<ui:param name="widthPixes"
		value="#{(isSpecificationReq and !isItemTypeService)?'170px':'100px'}" />
	<p:column style="width:#{widthPixes}" rendered="#{!isItemTypeService}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.tpl.spec.content.price.type']}"/>
			<ac:iconTooltip id="priceType#{row}TP" value="#{lbl['lbl.tpl.spec.content.price.type.tooltip']}" />
		</f:facet>
		<h:selectOneMenu id="priceType" value="#{question.clPriceTypeCode.parameterId}" required="#{isValidationReq}" style="width:#{widthPixes}"
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.price.type']}">
			<f:selectItems value="#{templateSpecBackingBean.getPriceTypeDropdownList(templateSpecBean.specMaster)}" />
			<p:ajax event="change" listener="#{templateSpecBackingBean.priceTypeChange(templateSpecBean, question)}" partialSubmit="true" process="@this" update="priceTypeMsg, qtyPG, @([id$=estPG],[id$=ratePerUomPG])" />
		</h:selectOneMenu>
		<p:message id="priceTypeMsg" for="priceType" display="icon" />
	</p:column>
	
</ui:composition>
