<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="isFulfilmentTypeOneOff"
		value="#{question.clFulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff}" />
	<ui:param name="isFulfilmentTypeAsAndWhen"
		value="#{question.clFulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeAsAndWhen}" />
	<ui:param name="isShowService"
		value="#{(!isFulfilmentTypeReq or (isFulfilmentTypeReq and !isFulfilmentTypeOneOff))}" />
	<ui:param name="widthPixes"
		value="#{(isSpecificationReq and !isItemTypeService)?'170px':'100px'}" />
		<ui:param name="specificationrequired" value="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq) or isSqSpec }"></ui:param>


	<p:column>

		<c:if test="#{updateSpec}">
			<p:inputTextarea id="itemName" style="width:calc(100% - 30px);"
				value="#{question.clItem}" rendered="#{isQuestionTypeItem}"
				required="#{isValidationReq}" rows="5" maxlength="2000"
				onkeyup="limitTextArea(this,2000);"
				onkeydown="limitTextArea(this,2000);" onmouseout="limitTextArea(this,2000);" autoResize="false"
				label="#{lbl['lbl.tpl.spec.content.item']}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="itemNameMsg" for="itemName" display="icon" />
			<ui:fragment rendered="#{specificationrequired }">
			<ui:remove>#36681 - start</ui:remove>
			<p:inputTextarea id="specification" style="width:calc(100% - 30px);"
				value="#{question.clSpecDetail}"
				rendered="#{!isQuestionTypeItem or !isSpecificationReq}"
				required="#{isValidationReq}" rows="5" maxlength="1000"
				validatorMessage="#{lbl['lbl.sc.validate.onethousand.charLimit']}"
				onkeyup="limitTextAreaWithBreakline(this,1000);"
				onkeydown="limitTextAreaWithBreakline(this,1000);"
				onmouseout="limitTextAreaWithBreakline(this,1000);"
				label="#{lbl['lbl.tpl.spec.content.specification']}"
				autoResize="false">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
				<f:validateLength for="specification" maximum="1000" />
			</p:inputTextarea>
			<ui:remove>#36681 - end</ui:remove>
			<p:message id="specificationMsg" for="specification" display="icon" />
			<br />

				<!-- #31503 Start -->				
				<p:commandLink oncomplete="itemDescDialogId.show();" value="#{question.cmItem.extensionCode}" style="color: #009ae5; font-size:12px;font-style:italic"
					action="#{codificationBackingBean.showItemDescPopup(question)}" process="@this" update="@([id$=itemDescDialogId])"/>
				<!-- #31503 End -->


				<p:spacer width="20" />
			<p:commandLink id="itemSpecificationLink" process="@this"
				update="@([id$=itemSpecificationDlg])"
				oncomplete="itemSpecificationDlgVar.show();"
				rendered="#{!simpleQuoteBackingBean.managedBean.panelItemFlag and !simpleQuoteBackingBean.managedBean.newableFlag and simpleQuoteBackingBean.managedBean.addNewSpecFlag and question.ctPanelItem != null}">
				<p:graphicImage value="/css/images/design/ico-viewnedit.png" />
			</p:commandLink>
			</ui:fragment>
		</c:if>
		<c:if test="#{!updateSpec}">
			<h:outputText value="#{fn:replace(question.clItem,',',',  ')}" escape="false"
				rendered="#{isQuestionTypeItem}" />
				<ui:fragment rendered="#{specificationrequired }">
				<ui:param name="clspecDetail" value="#{fn:replace(question.clSpecDetail,',',',  ')}"></ui:param>
				<h:outputText
				value="#{templateSpecBackingBean.replaceWithBR(clspecDetail)}"
				escape="false"
				rendered="#{!isQuestionTypeItem or !isSpecificationReq}"
				style="white-space: normal;word-wrap: break-word;" />
				</ui:fragment>
		</c:if>
	</p:column>
	
	<!-- <p:column
		rendered="#{isSpecTypeTechnical or (isSpecTypeFinancial and !isSpecificationReq) or isSqSpec }">

		<c:if test="#{updateSpec}">
			<p:inputTextarea id="specification" style="width:calc(100% - 20px);"

				rendered="#{!isQuestionTypeItem or !isSpecificationReq}"

				onkeyup="limitTextArea(this,1000);"
				onkeydown="limitTextArea(this,1000);" onmouseout="limitTextArea(this,1000);"
				label="#{lbl['lbl.tpl.spec.content.specification']}"
				autoResize="false">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<p:message id="specificationMsg" for="specification" display="icon" />
		</c:if>
		<c:if test="#{!updateSpec}">
			<h:outputText
				value="#{templateSpecBackingBean.replaceWithBR(question.clSpecDetail)}"

				rendered="#{!isQuestionTypeItem or !isSpecificationReq}"
				style="white-space: normal;word-wrap: break-word;" />
		</c:if>
	</p:column> -->
	
	<p:column style="width:98px;"
		rendered="#{isItemTypeService and isFulfilmentTypeReq}">

		<h:selectOneMenu id="fulfilType"
			value="#{question.clFulfilmentTypeCode.parameterId}"
			required="#{isValidationReq}" style="width:98px;"
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.fulfilment.type']}">
			<f:selectItems
				value="#{templateSpecBackingBean.getFulfilmentTypeDropdownList(templateSpecBean.specMaster)}" />
			<p:ajax event="change"
				listener="#{templateSpecBackingBean.fulfilmentTypeChange(question)}"
				partialSubmit="true" process="@this"
				update="fulfilTypeMsg, freqUOMPG, dayUOMPG, monthUOMPG, durationPG" />
		</h:selectOneMenu>
		<p:message id="fulfilTypeMsg" for="fulfilType" display="icon" />
	</p:column>
	<p:column style="width:120px;">


		<c:if test="#{updateSpec}">
			<h:panelGroup layout="block" style="width:120px;">
				<p:autoComplete id="uom" required="#{isValidationReq}" scrollHeight="250" size="10"
					label="#{lbl['lbl.tpl.spec.content.uom']}" panelStyleClass="uomAuto"
					  title="#{templateSpecBackingBean.retriveUomCodeDesc(pmUom)}" 
					value="#{question.clUom}" converter="PmUomConverter" 
					var="pmUom" itemLabel="#{templateSpecBackingBean.retriveUomCodeDesc(pmUom)}" itemValue="#{pmUom}"
					completeMethod="#{templateSpecBackingBean.autoCompleteUom}"
					maxResults1="15" dropdown="false" forceSelection="true"
					rendered="#{isQuestionTypeItem}">
					<p:ajax event="itemSelect"
						listener="#{templateSpecBackingBean.uomValuesClearListener(question)}"
						partialSubmit="true" process="@this" update="@this, @([id$=freqUOMPG],[id$=dayUOMPG],[id$=monthUOMPG],[id$=qtyPG])" />
				</p:autoComplete>
				
					<p:commandLink oncomplete="uomRefDialog.show();" value="UOM" style="font-size:10px;font-style:italic"
					action="#{uomBackingBean.resetMeasurementSearch}" process="@this" rendered="#{isQuestionTypeItem}"
					update="@([id$=uomRefDlg])"/>
				<p:message id="uomMsg" for="uom" display="icon" />
			</h:panelGroup>
		</c:if>
		<c:if test="#{!updateSpec}">
			<h:outputText value="#{question.clUom.uomName}"
				rendered="#{isQuestionTypeItem}" />
		</c:if>
	</p:column>
	

	<c:if test="#{isItemTypeService}">
		<p:column style="width:70px;white-space:normal;">

			<h:panelGroup id="freqUOMPG" style="white-space:nowrap;">
				<p:inputText id="freqUOM"
					style="min-width:0px !important;width:50px; text-align:right;"
					value="#{question.clUomFrequency}"
					rendered="#{isQuestionTypeItem and isShowService}"
					required="#{isValidationReq}" maxlength="5"
					label="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}"
					onkeypress="if (event.keyCode == 13) { return false; }"> <!-- #32362 -->
					<ac:validateNumber maxIntegerDigits="7"
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					<p:ajax partialSubmit="true" process="@this"
						update="@this, freqUOMMsg, @(.calcAmount, [id$=ansYearPG], [id$=ansPG])"
						listener="#{templateSpecBackingBean.calcTotalAmountPerQuestion(templateSpecBean, question, isItemTypeService)}" />
				</p:inputText>
				<p:message id="freqUOMMsg" for="freqUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:60px;white-space:normal;">

			<h:panelGroup id="dayUOMPG" style="white-space:nowrap;">
				<p:inputText id="dayUOM"
					style="min-width:0px !important;width:22px; text-align:right;"
					value="#{question.clUomPerDay}"
					rendered="#{isQuestionTypeItem and isUOMHours and isShowService}"
					required="#{isValidationReq}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
					<ac:validateNumber pattern="0.0" maxIntegerDigits="3" />
					<p:ajax partialSubmit="true" process="@this"
						update="@this, dayUOMMsg, @(.calcAmount, [id$=ansYearPG], [id$=ansPG])"
						listener="#{templateSpecBackingBean.calcTotalAmountPerQuestion(templateSpecBean, question, isItemTypeService)}" />
					<f:attribute name="min" value="0.1" />
					<f:attribute name="max" value="23.9" />
				</p:inputText>
				<p:message id="dayUOMMsg" for="dayUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:60px;white-space:normal;">

			<h:panelGroup id="monthUOMPG" style="white-space:nowrap;">
				<p:inputText id="monthUOM"
					style="min-width:0px !important;width:22px; text-align:right;"
					value="#{question.clUomPerMonth}"
					rendered="#{isQuestionTypeItem and (isUOMHours or isUOMDays or isUOMNoOfPerson) and isShowService}"
					required="#{isValidationReq}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
					<ac:validateNumber pattern="0.0" maxIntegerDigits="3" />
					<p:ajax partialSubmit="true" process="@this"
						update="@this, monthUOMMsg, @(.calcAmount, [id$=ansYearPG], [id$=ansPG])"
						listener="#{templateSpecBackingBean.calcTotalAmountPerQuestion(templateSpecBean, question, isItemTypeService)}" />
					<f:attribute name="min" value="0.1" />
					<f:attribute name="max" value="31.0" />
				</p:inputText>
				<p:message id="monthUOMMsg" for="monthUOM" display="icon" />
			</h:panelGroup>
		</p:column>
		<p:column style="width:63px;white-space:normal;"
			rendered="#{isDurationByItem}">

			<h:panelGroup id="durationPG" style="white-space:nowrap;">
				<p:inputText id="duration"
					style="min-width:0px !important;width:30px; text-align:right;"
					value="#{question.clDurationMonth}"
					rendered="#{isQuestionTypeItem and isShowService}"
					required="#{isValidationReq}" maxlength="4"
					label="#{lbl['lbl.tpl.spec.content.duration.month']}"
					onkeypress="if (event.keyCode == 13) { return false; }"> <!-- #32362 -->
					<ac:validateNumber maxIntegerDigits="4" integerOnly="true" />
					<p:ajax partialSubmit="true" process="@this"
						update="@this, durationMsg" />
				</p:inputText>
				<p:message id="durationMsg" for="duration" display="icon" />
			</h:panelGroup>
		</p:column>
	</c:if>
	<p:column style="width:#{widthPixes}" rendered="#{!isItemTypeService}">

		<h:selectOneMenu id="priceType"
			value="#{question.clPriceTypeCode.parameterId}"
			required="#{isValidationReq}" style="width:calc(100% - 30px);"
			rendered="#{isQuestionTypeItem}"
			label="#{lbl['lbl.tpl.spec.content.price.type']}">
			<f:selectItems
				value="#{templateSpecBackingBean.getPriceTypeDropdownList(templateSpecBean.specMaster)}" />
			<p:ajax event="change"
				listener="#{templateSpecBackingBean.priceTypeChange(templateSpecBean, question)}"
				partialSubmit="true" process="@this"
				update="priceTypeMsg, qtyPG, @([id$=estPG],[id$=ratePerUomPG])" />
		</h:selectOneMenu>
		<p:message id="priceTypeMsg" for="priceType" display="icon" />
	</p:column>
</ui:composition>
