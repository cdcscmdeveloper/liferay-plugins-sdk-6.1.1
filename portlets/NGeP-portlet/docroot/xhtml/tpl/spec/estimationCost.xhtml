<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<ui:param name="isSelectedPriceTypeTariff" value="#{templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTariff or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTariff}" />
	<ui:param name="isSelectedPriceTypeTier" value="#{templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypePromotionTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalTier 
		or templateSpecBean.selectedSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalPromotionTier 
		or isSelectedPriceTypeTariff}" />
		
	<ui:param name="isQT" value="#{templateSpecBean.specMaster.scQtDoc != null}" /> <!-- #25039 ruzaimah (REOPEN 51) -->

	<p:dataTable id="estimationTbl" widgetVar="tierQtyWidget"
		var="tplSpecEstimation"
		rowIndexVar="rowIndex"
		value="#{templateSpecBean.selectedSpecQuestion.tplSpecEstimations}"
		rowKey="#{tplSpecEstimation}">
							
		<ac:paginator for="estimationTbl" />
		
		<p:column headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}" rendered="#{!empty templateSpecBean.specMaster.tplSpecZone}">
			#{tplSpecEstimation.tplSpecZoneDtl.zoneName}
		</p:column>
		<p:column style="width:80px;">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" rendered="#{editable}" />
				<h:outputText value="#{lbl['lbl.tpl.spec.content.estimate.cost']}"/>
			</f:facet>
			<!-- #25039 ruzaimah (REOPEN 51) Begin - only editable for non QT tranx -->	
			<!-- #25039 #162 - Begin - disabled QT tranx 
				disabled="#{editable}" change to "true"-->
			<c:if test="#{isQT}">
				<p:inputText id="estCost" value="#{tplSpecEstimation.estimatedCost}" style="width:165px; text-align:right;" 
						styleClass="mandatory"
						required="true" maxlength="19"
						label="#{lbl['lbl.tpl.spec.content.estimate.cost']}"
						disabled="true">
					<!-- #25039#123 start  -->	
					<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
					<!-- #25039#123 end -->
					<p:ajax partialSubmit="true" process="@this" update="@this, estCostMsg" />
				</p:inputText>
			</c:if>
			<c:if test="#{!isQT}">
				<p:inputText id="estCost" value="#{tplSpecEstimation.estimatedCost}" style="width:165px; text-align:right;" 
					required="true" maxlength="19"
					label="#{lbl['lbl.tpl.spec.content.estimate.cost']}"
					disabled="#{!editable}">
					<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" maxIntegerDigits="14" />
					<p:ajax partialSubmit="true" process="@this" update="@this, estCostMsg" />
				</p:inputText>
			</c:if>
			<!--#25039 ruzaimah (REOPEN 162) End -->
			<!--#25039 ruzaimah (REOPEN 51) End -->
			<p:message id="estCostMsg" for="estCost" display="icon" />
		</p:column>
	</p:dataTable>
</ui:composition>
