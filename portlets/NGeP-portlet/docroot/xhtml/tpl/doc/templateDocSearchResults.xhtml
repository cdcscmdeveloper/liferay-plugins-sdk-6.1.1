<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
   
	<p:panel id="panel2" header="#{lbl['lbl.pm.search.result']}" toggleable="true">
		<table style="width:100%">
			<tr>
				<td>
					<p:dataTable id="tplDocMasterDt" var="tplMasterObj" lazy="true" rows="10" rowIndexVar="rowIndex" styleClass="ctlisttree"
						rowKey="#{tplMasterObj.docMasterId}" value="#{templateDocBackingBean.managedBean.docMasterDataModel}">
						<ac:paginator for="tplDocMasterDt" />					
						<p:columnGroup type="header">
							<p:row>
								<p:column rowspan="1" headerText="#{lbl['lbl.tpl.doc.section.title']}"></p:column>
								<p:column rowspan="1" headerText="#{lbl['lbl.pm.procurement.category']}"></p:column>
								<p:column rowspan="1" headerText="#{lbl['lbl.pm.status']}"></p:column>
								<p:column rowspan="1" headerText="#{lbl['lbl.tpl.spec.search.action']}"></p:column>
							</p:row>
						</p:columnGroup>
						<p:column>
							<h:outputText value="#{tplMasterObj.docTitle}" />
						</p:column>
						<p:column>
							<h:outputText value="#{templateDocBackingBean.getParameterDesc(tplMasterObj.procurementCategory)}" />
						</p:column>
						<p:column>
							#{(tplMasterObj.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
						</p:column>
						<p:column>
							<p:commandLink action="#{templateDocBackingBean.goToMaint(tplMasterObj)}">
								<p:graphicImage value="/css/images/design/ico-viewnedit.png" update="tplDocMasterDt" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</td>
			</tr>
			<tr>
				<td style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.create']}" update="tplDocMasterDt"
						action="#{templateDocBackingBean.createNewTemplate}" />
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
