<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	
		<p:messages id="tempDocSearchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" ></p:messages>

		<p:panel id="panel1" header="#{lbl['lbl.btn.search']}" toggleable="true">
			<table style="width:100%">
				<tr>
					<td class="TableFieldLeft" style="width:120px">
						<h:outputLabel value="#{lbl['lbl.pm.procurement.category']}" />
					</td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateDocBackingBean.managedBean.procurementCategoryId}" id="templateCategory">
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width:120px">
					      <h:outputLabel value="#{lbl['lbl.tpl.doc.section.title']}" />
					</td>
					<td class="TableFieldRight">
					     <p:inputText id="templateTitle" value="#{templateDocBackingBean.managedBean.title}" style="width:280px" />
					</td>					
				</tr>
				<tr style="height: 3px;"></tr>
				<tr>
					<td colspan="4" style="text-align:right;">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{templateDocBackingBean.tempDocSearch}"
							  process="@this,panel1" update="tplDocMasterDt" />

						<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{templateDocBackingBean.reset}" 
							   update="panel1,panel2" resetValues="true" partialSubmit="true" process="@this">
					    </p:commandButton>						 
					 
					</td>
				 </tr>
			</table> 
		</p:panel>
</ui:composition>
