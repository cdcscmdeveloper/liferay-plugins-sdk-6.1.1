<ui:composition template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui" >

	<ui:define name="resourceSection"/>
	<ui:define name="contentSection">
		<h:outputText value="New Template Document" styleClass="pageTitle" />
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<table width="100%">
			<tr>
				<td style="text-align:left">
					<p:commandButton immediate="true" action="#{templateDocBackingBean.backAction}" value="Back" />
				</td>
				<td style="text-align:right">
					<p:commandButton action="#{templateDocBackingBean.saveAction}" value="Save" />
					<p:spacer width="5px" rendered="#{templateDocBackingBean.managedBean.externalPageUrl==null}" />
					<p:commandButton action="#{templateDocBackingBean.saveAction}" rendered="#{templateDocBackingBean.managedBean.externalPageUrl==null}" value="Submit" />
				</td>
			</tr>
		</table>
		<p:panel id="panel1" header="Header" toggleable="true">
			<table width="100%">
				<tr>
					<td class="TableFieldLeft" style="width: 120px">
						<h:outputLabel value="#{lbl['lbl.tpl.doc.category']}" />
					</td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="procCat" style="width:289px" 
							value="#{templateDocBackingBean.managedBean.selectedTemplate.procurementCategory.parameterId}"
							required="true"	label="#{lbl['lbl.tpl.spec.procurement.category']}" 
							disabled="#{templateDocBackingBean.managedBean.externalPageUrl!=null}" >
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
						<p:message for="procCat" display="icon" />
					</td>
					<td class="TableFieldLeft" style="width:120px">
						<h:outputLabel value="#{lbl['lbl.tpl.doc.processtype']}" />
					</td>
					<td class="TableFieldRight">
					<p:selectOneMenu value="#{templateDocBackingBean.managedBean.selectedTemplate.processType.parameterId}" id="templateCategory111"
						disabled="#{templateDocBackingBean.managedBean.externalPageUrl!=null}" >
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.tplDocProcessType)}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr style="height: 5px;"></tr>
				<tr>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.tpl.doc.title']}" /></td>
					<td class="TableFieldRight">
						<p:inputText value="#{templateDocBackingBean.managedBean.selectedTemplate.docTitle}" style="width:280px" 
							disabled="#{templateDocBackingBean.managedBean.externalPageUrl!=null}" />
					</td>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.tpl.doc.description']}" /></td>
					<td class="TableFieldRight">
						<p:inputTextarea value="#{templateDocBackingBean.managedBean.selectedTemplate.docDesc}"
							disabled="#{templateDocBackingBean.managedBean.externalPageUrl!=null}"
							style="width:280px" cols="33" rows="3" autoResize="false" />
					</td>
				</tr>
				<tr style="height: 5px;"></tr>
					<tr>
					<td class="TableFieldLeft" style="width: 120px;"><h:outputLabel value="#{lbl['lbl.tpl.doc.createduser']}" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}"/></td>
					<td class="TableFieldRight" >
						<p:inputText value="#{tplMasterObj.createdBy}" readonly="true" disabled="true" style="width:280px" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}" />
					</td>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.tpl.doc.date']}" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}" /></td>
					<td class="TableFieldRight">
						<p:inputText value="#{tplMasterObj.createdDate}" readonly="true" disabled="true" style="width:280px" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}" />
					</td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="panel2" header="Contents" toggleable="true">
			
			<h:panelGrid width="100%">
				<p:treeTable id="sampleTT" var="document" 
					value="#{templateDocBackingBean.managedBean.docSectionTN}" >
					<p:column style="width:200px">
						<f:facet name="header">Section</f:facet>
						<h:outputText value="#{document.sectionNumber}" />
						<p:spacer width="5px" />
						<h:outputText value="#{document.sectionName}" />
					</p:column>
					<p:column style="width:50px;text-align:center;">
						<f:facet name="header">Positioning</f:facet>
						<p:commandLink action="#{templateDocBackingBean.positionNode('left')}"
							update="sampleTT">
							<h:graphicImage library="ep/images/design" name="icon_arrow_left.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.positionNode('right')}"
							update="sampleTT">
							<h:graphicImage library="ep/images/design" name="icon_arrow_right.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.positionNode('up')}"
							update="sampleTT">
							<h:graphicImage library="ep/images/design" name="icon_arrow_up.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.positionNode('down')}"
							update="sampleTT">
							<h:graphicImage library="ep/images/design" name="icon_arrow_down.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
					</p:column>
					<p:column style="width:50px;text-align:center;">
						<f:facet name="header">Action</f:facet>
						<p:commandLink action="#{templateDocBackingBean.editContent}"
							oncomplete="popupEdit.show();return false;" update=":form:popupEdit">
							<h:graphicImage library="ep/images/design" name="icon-edit.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:spacer width="5px" />
						<p:commandLink action="#{templateDocBackingBean.deleteNode}" update=":form">
							<!-- oncomplete="popupsEdit.show();return false;" update=":form:popupsEdit"> -->							 
							<h:graphicImage library="ep/images/design" name="icon_trash.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:spacer width="3px" />
						<p:menuButton value="" id="addSecMenu" styleClass="addSecMenu">
				            <p:menuitem value="Import Section" actionListener="#{templateDocBackingBean.initializeImport}" update=":form:popupImportSec" oncomplete="popupImportSec.show();return false;">
					            <f:setPropertyActionListener value="#{document}"
									target="#{templateDocBackingBean.managedBean.selectedSection}" />
				            </p:menuitem>
				            <p:menuitem value="Add Section" update="sampleTT" action="#{templateDocBackingBean.addNode}">
				            	<f:setPropertyActionListener value="#{document}"
									target="#{templateDocBackingBean.managedBean.selectedSection}" />
				            </p:menuitem>
			       		</p:menuButton>
					</p:column>
					<f:facet name="footer">
					</f:facet>
				</p:treeTable>
			</h:panelGrid>
			<h:panelGrid width="100%" columns="1" >
				<h:panelGroup style="float: right;">
					<p:commandButton value="Re-Numbering"
						action="#{templateDocBackingBean.reNumbering(templateDocBackingBean.managedBean.docSectionTN)}"
						process="@this" update=":form:sampleTT" />
					<p:commandButton action="#{templateDocBackingBean.previewAction}" 
						value="Preview" update="display" oncomplete="dlg.show()" />
				</h:panelGroup>
			</h:panelGrid>
		</p:panel>

		<p:dialog id="popupEdit" widgetVar="popupEdit" modal="false"
			resizable="false" header="Edit Content" width="650" height="460">
			<p:ajax event="close" />
			
			<h:panelGroup id="docs">
				<h:panelGrid width="100%">
					<h:outputLabel value="#{lbl['lbl.tpl.doc.section.name']}" style="float: left;" />
				</h:panelGrid>
				<h:panelGrid width="100%">
					<h:inputText id="sectionName"
						value="#{templateDocBackingBean.managedBean.selectedSectionName}"
						maxlength="100" style="width: 100%;" />
				</h:panelGrid>
				<h:panelGrid style="width:100%;">
					<h:outputLabel value="#{lbl['lbl.tpl.doc.section.title']}" style="float: left;" />
				</h:panelGrid>
				<h:panelGrid width="100%">
					<h:inputText id="sectionTitle"
						value="#{templateDocBackingBean.managedBean.selectedSectionTitle}"
						maxlength="100" style="width: 100%; float: left;" />
				</h:panelGrid>
				<p:spacer height="5px" />
				<h:panelGrid width="100%">
					 <p:selectOneRadio id="options" style="width:130px" value="#{templateDocBackingBean.managedBean.selectedOption}" >  
           				 <f:selectItem itemLabel="Content" itemValue="1" /> 
           				 <f:selectItem itemLabel="Variable" itemValue="2" />  
           				 <p:ajax listener="#{templateDocBackingBean.viewContent}" update="contentID,variableID" process="@this" />
       				 </p:selectOneRadio>  
				</h:panelGrid>
				<p:spacer height="5px" />
				<h:panelGrid width="100%">
					<h:outputLabel value="#{lbl['lbl.tpl.doc.section.contents']}" style="float: left;" />
				</h:panelGrid>
				<h:panelGrid id="contentID" width="100%">
					<p:editor id="editor" width="600" height="200"
						value="#{templateDocBackingBean.managedBean.selectedSectionText}"
						controls="bold italic color underline alignleft center alignright justify" rendered="#{templateDocBackingBean.managedBean.selectedOption == '1'}">
					</p:editor>
				</h:panelGrid>
				<h:panelGrid id="variableID" width="100%" >
					<p:dataTable rendered="#{templateDocBackingBean.managedBean.selectedOption == '2'}"
						value="#{templateDocBackingBean.managedBean.variableList}"
						var="variableObj" width="100%">
						<p:columnGroup type="header">
							<p:row>
								<p:column rowspan="2" headerText="Name" />
								<p:column rowspan="2" headerText="Value" />
								<p:column rowspan="2" headerText="Action" />
							</p:row>
						</p:columnGroup>
						<p:column>
							<h:outputText value="#{variableObj.sectionNumber}" />
						</p:column>
						<p:column>
							<h:outputText value="#{variableObj.sectionName}" />
						</p:column>
						<p:column>
							<h:outputText value="#{variableObj.sectionNumber}" />
						</p:column>
					</p:dataTable>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup>		
				<p:commandButton id="editlinkM" action="#{templateDocBackingBean.saveContent}"
					value="OK" oncomplete="popupEdit.hide()" update=":form:sampleTT" />
				<p:commandButton id="editl" action="#{templateDocBackingBean.saveContent}"
					value="Cancel" oncomplete="popupEdit.hide()" update=":form:sampleTT" />									
			</h:panelGroup>
		</p:dialog>
		
		<p:dialog id="popupImportSec" widgetVar="popupImportSec" modal="false" 
			resizable="false" header="Import Section" width="650" height="460">
			<table>
				<tr>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="Name" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="imptTemplateCategory" style="width:100px;"
							value="#{templateDocBackingBean.managedBean.impCategoryId}">
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="Process Type" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu style="width:100px;"
							value="#{templateDocBackingBean.managedBean.impProcessTypeId}">
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.tplDocProcessType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="Title" /></td>
					<td class="TableFieldRight"><p:inputText style="width:180px" value="#{templateDocBackingBean.managedBean.impTitle}" /></td>
					<td>
						<p:commandLink action="#{templateDocBackingBean.imptSearchResult}" 
							process="@this,imptTemplateCategory" update="impMasterList">
							<h:graphicImage library="ep/images/design" name="Search-icon.png"/> 
						</p:commandLink> 
					</td>
				</tr>
				<tr>
					<td colspan="7">
						<p:dataTable id="impMasterList"
							selection="#{templateDocBackingBean.managedBean.selectedImpMaster}"
							value="#{templateDocBackingBean.managedBean.importMasterList}"
							var="tplMasterObj" rowKey="#{tplMasterObj.docMasterId}"
							width="100%">
							<p:ajax event="rowSelectRadio" update=":form:impSectionList" listener="#{templateDocBackingBean.selectedSectionTree}"/>
							<p:columnGroup type="header">
								<p:row>
									<p:column rowspan="1" />
									<p:column rowspan="1" headerText="Template Document" />
								</p:row>
							</p:columnGroup>
							<p:column selectionMode="single" style="width:2%" />
							<p:column>
								<h:outputText value="#{tplMasterObj.docTitle}" />
							</p:column>
						</p:dataTable>
					</td>
				</tr>
				<tr><td><br></br></td></tr>
				<tr>
					<td colspan="7">
						<p:treeTable id="impSectionList" value="#{templateDocBackingBean.managedBean.imptSectionTN}"
							var="document">
							<p:column style="width:150px">
								<f:facet name="header">Section</f:facet>
	            				<p:selectBooleanCheckbox value="#{templateDocBackingBean.uncheck}">
	            					<p:ajax listener="#{templateDocBackingBean.checkRow(document)}" />
	            				</p:selectBooleanCheckbox>
								<h:outputText value="#{document.sectionNumber}" />
								<p:spacer width="5px" />
								<h:outputText value="#{document.sectionName}" />
							</p:column>
							<f:facet name="footer" />
						</p:treeTable>
					</td>
				</tr>
				<tr>
					<td>
						<p:commandButton value="Select" action="#{templateDocBackingBean.addSelectedImptNodes}" 
							update=":form:sampleTT"	oncomplete="popupImportSec.hide();" />
					</td>
				</tr>
			</table>
		</p:dialog>
  
	    <p:dialog header="Content" widgetVar="dlg" modal="true" height="450" width="600" resizable="true" >  
	        <h:outputText id="display" value="#{templateDocBackingBean.managedBean.previewValue}" escape="false" />  
	       
	 
	  
	   <p:panel style="float:right;">
            
	   <h:commandButton id="tbls" value="GenerateDoc" action="#{templateDocBackingBean.createPDF}" onclick="alert('testtest');" />
	   <p:remoteCommand name="createPdf" action="#{templateDocBackingBean.createPDF}" partialSubmit="true" />
	
      </p:panel>
	  
	    </p:dialog>
	</ui:define>
	<ui:define name="footerSection"></ui:define>
</ui:composition>
