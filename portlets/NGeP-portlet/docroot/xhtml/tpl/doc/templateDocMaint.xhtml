<ui:composition template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui" >

	<ui:define name="resourceSection"/>
	<ui:define name="contentSection">
		
		<p:messages id="messages" showSummary="false" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
		<table width="100%">
			<tr>
				<td style="text-align:left">
					<p:commandButton immediate="true" action="#{templateDocBackingBean.backAction}" value="#{lbl['lbl.btn.back']}" />
				</td>
				<td style="text-align:right">
					<p:commandButton action="#{templateDocBackingBean.saveAction}" value="#{lbl['lbl.btn.save']}" />
					<p:spacer width="5px" rendered="#{false and templateDocBackingBean.managedBean.externalPageUrl==null}" />
					<p:commandButton action="#{templateDocBackingBean.saveAction}" rendered="#{false and templateDocBackingBean.managedBean.externalPageUrl==null}" value="Submit" />
				</td>
			</tr>
		</table>
		<p:panel id="panel1" header="#{lbl['lbl.tpl.doc.header']}" toggleable="true">
			<table width="100%">
				<tr>
					<td class="TableFieldLeft" style="width: 120px">
						<h:outputLabel value="#{lbl['lbl.sc.procurement.category']}" />
					</td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="procCat" style="width:289px" 
							value="#{templateDocBackingBean.managedBean.selectedTemplate.procurementCategory.parameterId}"
							required="true"	label="#{lbl['lbl.sc.procurement.category']}" 
							disabled="#{templateDocBackingBean.managedBean.externalPageUrl != null}" >
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
						<p:message for="procCat" display="icon" />
					</td>
					<td class="TableFieldLeft" style="width:120px">
						<h:outputLabel value="#{lbl['lbl.tpl.doc.processtype']}" />
					</td>
					<td class="TableFieldRight">
					<p:selectOneMenu value="#{templateDocBackingBean.managedBean.selectedTemplate.processType.parameterId}" id="templateCategory111"
						disabled="#{true}" >
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.tplDocProcessType)}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr style="height: 5px;"></tr>
				<tr>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.tpl.doc.title']}" /></td>
					<td class="TableFieldRight">
						<p:inputText value="#{templateDocBackingBean.managedBean.selectedTemplate.docTitle}" style="width:280px" 
							disabled="#{templateDocBackingBean.managedBean.externalPageUrl!=null}" required="true" label="#{lbl['lbl.tpl.doc.title']}" />
					</td>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.pm.recordstatus']}" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu value="#{templateDocBackingBean.managedBean.selectedTemplate.recordStatusFlg}"
							id="recordStatusFlg" disabled="#{templateDocBackingBean.managedBean.selectedTemplate.brandNew or templateDocBackingBean.managedBean.externalPageUrl!=null}">
							<f:selectItems value="#{templateDocBackingBean.getDropdownCodeValuesBySearchBean(ParameterTypeConst.recordStatus, templateDocBackingBean.getRecordStatusSearchBean())}" />
						</p:selectOneMenu>
					</td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.tpl.doc.description']}" /></td>
					<td class="TableFieldRight">
						<p:inputTextarea value="#{templateDocBackingBean.managedBean.selectedTemplate.docDesc}"
							disabled="#{templateDocBackingBean.managedBean.externalPageUrl!=null}"
							style="width:280px" cols="33" rows="3" autoResize="false" />
					</td>				
				</tr>
				<tr style="height: 5px;"></tr>
					<tr>
					<td class="TableFieldLeft" style="width: 120px;"><h:outputLabel value="#{lbl['lbl.tpl.spec.created.user']}" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}"/></td>
					<td class="TableFieldRight" >
						<p:inputText value="#{templateDocBackingBean.getUserNameById(templateDocBackingBean.managedBean.selectedTemplate.createdBy)}" readonly="true" disabled="true" style="width:280px" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}" />
					</td>
					<td class="TableFieldLeft" style="width: 120px"><h:outputLabel value="#{lbl['lbl.tpl.doc.date']}" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}" /></td>
					<td class="TableFieldRight">
						<p:inputText value="#{templateDocBackingBean.managedBean.selectedTemplate.createdDate}" readonly="true" disabled="true" style="width:280px" rendered="#{! templateDocBackingBean.managedBean.selectedTemplate.brandNew}" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
					</td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="panel2" header="#{lbl['lbl.tpl.doc.section.contents']}" toggleable="true">
			
			<h:panelGrid width="100%">
				<p:treeTable id="sampleTT" var="document" 
					value="#{templateDocBackingBean.managedBean.docSectionTN}" >
					<p:column style="width:200px">
						<f:facet name="header">#{lbl['lbl.tpl.doc.section']}</f:facet>
						<h:outputText value="#{document.sectionNumber}" />
						<p:spacer width="5px" />
						<h:outputText value="#{document.sectionName}" />
					</p:column>
					<p:column style="width:50px;text-align:center;">
						<f:facet name="header">#{lbl['lbl.tpl.doc.positioning']}</f:facet>
						<p:commandLink action="#{templateDocBackingBean.positionNode('left')}"
							update="sampleTT">
							<h:graphicImage value="/css/images/design/icon_arrow_left.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.positionNode('right')}"
							update="sampleTT">
							<h:graphicImage value="/css/images/design/icon_arrow_right.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.positionNode('up')}"
							update="sampleTT">
							<h:graphicImage value="/css/images/design/icon_arrow_up.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.positionNode('down')}"
							update="sampleTT">
							<h:graphicImage value="/css/images/design/icon_arrow_down.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
					</p:column>
					<p:column style="width:50px;text-align:center;">
						<f:facet name="header">#{lbl['lbl.td.action']}</f:facet>
						<p:commandButton id="addBtn" icon="ui-icon-add" style="background-color:transparent !important; border:0px none; width:10px !important; height:10px !important;"
							partialSubmit="true" process="@this" disabled="#{templateDocBackingBean.managedBean.readOnlyFlag}"
							title="#{lbl['lbl.tpl.spec.content.btn.add.tooltip']}" />
						<p:menu overlay="true" trigger="addBtn" my="left top" at="left bottom">
				            <p:menuitem value="#{lbl['lbl.tpl.doc.import.section']}" actionListener="#{templateDocBackingBean.initializeImport}" update=":form:popupImportSec" oncomplete="popupImportSec.show();return false;">
					            <f:setPropertyActionListener value="#{document}"
									target="#{templateDocBackingBean.managedBean.selectedSection}" />
				            </p:menuitem>
				            <p:menuitem value="#{lbl['lbl.tpl.doc.add.section']}" update="sampleTT" action="#{templateDocBackingBean.addNode}">
				            	<f:setPropertyActionListener value="#{document}"
									target="#{templateDocBackingBean.managedBean.selectedSection}" />
				            </p:menuitem>
						</p:menu>	
						<p:spacer width="5px" />							
						<p:commandLink action="#{templateDocBackingBean.editContent}" rendered="#{!templateDocBackingBean.managedBean.readOnlyFlag}"
							oncomplete="popupEdit.show();return false;" update=":form:popupEdit">
							<h:graphicImage value="/css/images/design/ico-edit.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:commandLink action="#{templateDocBackingBean.editContent}" rendered="#{templateDocBackingBean.managedBean.readOnlyFlag}"
							oncomplete="popupEdit.show();return false;" update=":form:popupEdit">
							<h:graphicImage value="/css/images/design/document.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
						<p:spacer width="5px" />
						<p:commandLink action="#{templateDocBackingBean.deleteNode}" update=":form" disabled="#{templateDocBackingBean.managedBean.readOnlyFlag}" >
							<!-- oncomplete="popupsEdit.show();return false;" update=":form:popupsEdit"> -->							 
							<h:graphicImage value="/css/images/design/delete.png" />
							<f:setPropertyActionListener value="#{document}"
								target="#{templateDocBackingBean.managedBean.selectedSection}" />
						</p:commandLink>
					</p:column>
					<f:facet name="footer">
					</f:facet>
				</p:treeTable>
			</h:panelGrid>
			<h:panelGrid width="100%" columns="1" >
				<h:panelGroup style="float: right;">
					<p:commandButton value="Re-Numbering"
						action="#{templateDocBackingBean.reNumbering(templateDocBackingBean.managedBean.docSectionTN)}"
						process="@this" update=":form:sampleTT" />
					<p:commandButton action="#{templateDocBackingBean.previewAction}" 
						value="Preview" update="display" oncomplete="dlg.show()" />
				</h:panelGroup>
			</h:panelGrid>
		</p:panel>

		<p:dialog id="popupEdit" widgetVar="popupEdit" modal="false"
			resizable="false" header="#{lbl['lbl.tpl.doc.edit.content']}" width="650" height="460">
			<p:ajax event="close" />
			
			<h:panelGroup id="docs">
				<h:panelGrid width="100%">
					<h:outputLabel value="#{lbl['lbl.tpl.doc.section.name']}" style="float: left;" />
				</h:panelGrid>
				<h:panelGrid width="100%">
					<h:inputText id="sectionName" readonly="#{templateDocBackingBean.managedBean.readOnlyFlag}"
						value="#{templateDocBackingBean.managedBean.selectedSectionName}"
						maxlength="100" style="width: 95%;" />
				</h:panelGrid>
				<h:panelGrid style="width:100%;">
					<h:outputLabel value="#{lbl['lbl.tpl.doc.section.title']}" style="float: left;" />
				</h:panelGrid>
				<h:panelGrid width="100%">
					<h:inputText id="sectionTitle" readonly="#{templateDocBackingBean.managedBean.readOnlyFlag}"
						value="#{templateDocBackingBean.managedBean.selectedSectionTitle}"
						maxlength="100" style="width: 95%; float: left;" />
				</h:panelGrid>
				<p:spacer height="5px" />
				<ui:remove>
				<h:panelGrid width="100%">
					 <p:selectOneRadio id="options" style="width:130px" value="#{templateDocBackingBean.managedBean.selectedOption}" >  
           				 <f:selectItem itemLabel="#{lbl['lbl.tpl.doc.content']}" itemValue="1" /> 
           				 <f:selectItem itemLabel="#{lbl['lbl.tpl.doc.variable']}" itemValue="2" />    
           				 <p:ajax listener="#{templateDocBackingBean.viewContent}" update="contentID,variableID" process="@this" />
       				 </p:selectOneRadio>  
				</h:panelGrid>
				<p:spacer height="5px" />
				</ui:remove>
				<h:panelGrid width="100%">
					<h:outputLabel value="#{lbl['lbl.tpl.doc.section.contents']}" style="float: left;" />
				</h:panelGrid>
				<h:panelGrid id="contentID" width="100%">
					<p:editor id="editor" width="600" height="230" disabled="#{templateDocBackingBean.managedBean.readOnlyFlag}"
						value="#{templateDocBackingBean.managedBean.selectedSectionText}"
						controls="bold italic color underline alignleft center alignright justify" rendered="#{templateDocBackingBean.managedBean.selectedOption == '1'}">
					</p:editor>
				</h:panelGrid>
				<h:panelGrid id="variableID" width="100%" >
					<p:dataTable rendered="#{templateDocBackingBean.managedBean.selectedOption == '2'}"
						value="#{templateDocBackingBean.managedBean.variableList}"
						var="variableObj" width="100%">
						<p:columnGroup type="header">
							<p:row>
								<p:column rowspan="2" headerText="#{lbl['lbl.tpl.doc.section.name']}" />
								<p:column rowspan="2" headerText="#{lbl['lbl.pm.value']}" />
								<p:column rowspan="2" headerText="#{lbl['lbl.td.action']}" />
							</p:row>
						</p:columnGroup>
						<p:column>
							<h:outputText value="#{variableObj.sectionNumber}" />
						</p:column>
						<p:column>
							<h:outputText value="#{variableObj.sectionName}" />
						</p:column>
						<p:column>
							<h:outputText value="#{variableObj.sectionNumber}" />
						</p:column>
					</p:dataTable>
				</h:panelGrid>
			</h:panelGroup>
			<h:panelGroup style="float:right">		
				<p:commandButton id="editlinkM" action="#{templateDocBackingBean.saveContent}"
					value="#{lbl['lbl.btn.ok']}" oncomplete="popupEdit.hide()" update=":form:sampleTT" />
				<p:commandButton id="editl" action="#{templateDocBackingBean.saveContent}"
					value="#{lbl['lbl.btn.cancel']}" oncomplete="popupEdit.hide()" update=":form:sampleTT" />									
			</h:panelGroup>
		</p:dialog>
		
		<p:dialog id="popupImportSec" widgetVar="popupImportSec" modal="false" 
			resizable="false" header="#{lbl['lbl.tpl.doc.import.section']}" width="900" height="460">
			
			<p:remoteCommand name="tempDocFunc" action="#{templateDocBackingBean.imptSearchResult}" 
			process="@this,imptTemplateCategory,imptProcessType,imptTitle" update="impMasterList,impSectionList"></p:remoteCommand>
			
			<table style="width:100%;">
				<tr>
					<td class="TableFieldLeft" style="width: 80px"><h:outputLabel value="#{lbl['lbl.sc.procurement.category']}" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="imptTemplateCategory" style="width:150px;"
							value="#{templateDocBackingBean.managedBean.impCategoryId}">
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width: 80px"><h:outputLabel value="#{lbl['lbl.tpl.doc.processtype']}" /></td>
					<td class="TableFieldRight">
						<p:selectOneMenu id="imptProcessType" style="width:120px;"
							value="#{templateDocBackingBean.managedBean.impProcessTypeId}">
							<f:selectItems value="#{templateDocBackingBean.getDropdownValues(ParameterTypeConst.tplDocProcessType)}" />
						</p:selectOneMenu>
					</td>
					<td class="TableFieldLeft" style="width: 80px"><h:outputLabel value="#{lbl['lbl.tpl.doc.section.title']}" /></td>
					<td class="TableFieldRight"><p:inputText id="imptTitle" style="width:180px" value="#{templateDocBackingBean.managedBean.impTitle}" onkeypress="if (event.keyCode == 13) { tempDocFunc(); return false; }" /></td>
					<td>
						<p:commandLink action="#{templateDocBackingBean.imptSearchResult}"
							process="@this,imptTemplateCategory,imptProcessType,imptTitle" update="impMasterList,impSectionList">
							<h:graphicImage value="/css/images/design/ico-search.png"/> 
						</p:commandLink> 

					</td>
				</tr>
				<tr>
					<td colspan="7">
						<p:dataTable id="impMasterList" rows="5"
							selection="#{templateDocBackingBean.managedBean.selectedImpMaster}"
							value="#{templateDocBackingBean.managedBean.importMasterList}"
							var="tplMasterObj" rowKey="#{tplMasterObj.docMasterId}"
							width="100%">
							<ac:paginator for="impMasterList" />
							<p:ajax event="rowSelectRadio" update=":form:impSectionList" listener="#{templateDocBackingBean.selectedSectionTree}"/>
							<p:columnGroup type="header">
								<p:row>
									<p:column rowspan="1" />
									<p:column rowspan="1" headerText="#{lbl['lbl.tpl.doc.template.doc']}" />
								</p:row>
							</p:columnGroup>
							<p:column selectionMode="single" style="width:2%" />
							<p:column>
								<h:outputText value="#{tplMasterObj.docTitle}" />
							</p:column>
						</p:dataTable>
					</td>
				</tr>
				<tr><td><br></br></td></tr>
				<tr>
					<td colspan="7">
						<p:treeTable id="impSectionList" value="#{templateDocBackingBean.managedBean.imptSectionTN}" selection="#{templateDocBackingBean.managedBean.treenode}" selectionMode="checkbox"
							var="document">
							<p:ajax event="select" listener="#{templateDocBackingBean.checkChild()}" update="impSectionList" />
							<p:column style="width:150px">
								<f:facet name="header">#{lbl['lbl.tpl.doc.section']}</f:facet>
								
								<h:outputText value="#{document.sectionNumber}" />
								<p:spacer width="5px" />
								<h:outputText value="#{document.sectionName}" />
							</p:column>
							<f:facet name="footer" />
						</p:treeTable>
					</td>
				</tr>
				<tr>
					<td colspan="7" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.btn.select']}" action="#{templateDocBackingBean.addSelectedImptNodes}" 
							update=":form:sampleTT"	oncomplete="popupImportSec.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.cancel']}" oncomplete="popupImportSec.hide();" />								
					</td>
				</tr>
			</table>
		</p:dialog>
  
	    <p:dialog header="#{lbl['lbl.tpl.doc.content']}" widgetVar="dlg" modal="true" height="450" width="600" resizable="true" >  
	        <h:outputText id="display" value="#{templateDocBackingBean.managedBean.previewValue}" escape="false" />
	        <table width="100%">
	        	<tr>  
				   	<td style="text-align:right;">
				   		<p:commandButton id="tbls" ajax="false" value="#{lbl['lbl.tpl.doc.generate.doc']}" action="#{templateDocBackingBean.createPDF}" />
			      	</td>
	      		</tr>
	      	</table>
	    </p:dialog>
	</ui:define>
	<ui:define name="footerSection"></ui:define>
</ui:composition>
