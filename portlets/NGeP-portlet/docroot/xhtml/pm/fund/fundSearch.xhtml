<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="fundPanel" header="#{lbl['lbl.pm.fund.search.location']}" toggleable="true" >

		<table class="ppTwoTable">
			<tr>
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.fund.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{fundBackingBean.managedBean.fundSearchBean.fundCode}"
						id="fundCode" size="28" /></td>			
				
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.fund.desc']}"></p:outputLabel></td>
				<td width="19%"><p:inputText
						value="#{fundBackingBean.managedBean.fundSearchBean.fundName}"
						size="50" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
				
			</tr>		
				
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.fund.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{fundBackingBean.managedBean.fundSearchBean.status}">
						<f:selectItems value="#{fundBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{fundBackingBean.searchFund}"
							update=":form:fundResult" />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{fundBackingBean.resetFundSearchBean}"
							process="@this"
							update=":form:fundPanel, :form:fundResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
