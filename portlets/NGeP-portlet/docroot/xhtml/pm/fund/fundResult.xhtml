<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="fundResult" header="#{lbl['lbl.pm.fund.search.result']}"
		toggleable="true">
		<p:dataTable id="fund"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{fundBackingBean.searchFund}" rows="10"
			var="fundList" rowIndexVar="index" lazy="true">
			<ac:paginator for="fund" />

			<p:column headerText="#{lbl['lbl.pm.fund.code']}" style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{fundList[0]}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.fund.desc']}" style="width:60%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{fundList[1]}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.fund.valid.from']}"
				style="width:10%;white-space: normal;">
				<h:outputText value="#{fundList[2]}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.fund.valid.to']}" style="width:10%;white-space: normal;">
				<h:outputText value="#{fundList[3]}" >
				<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
			</p:column>			

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:10%;white-space: normal;"> 
   	    #{(fundList[4]==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
