<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection" />
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	<table>
		<tr>
			<td colspan="2">
				<h:outputText styleClass="instruction" value="#{lbl['lbl.sm.activation.msg']}"></h:outputText>
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.pm.profiles.resorg.table.name']}" />
			</td>
			<td>
				<h:outputText value="#{accessApplActivationBackingBean.managedBean.accessAppl.applicantName}" disabled="true" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.pm.access.app.request.idno']}" />
			</td>
			<td>
				<h:outputText value="#{accessApplActivationBackingBean.managedBean.accessAppl.identificationNo}" disabled="true" />
			</td>
		</tr>

		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.key']}" />
			</td>
			<td>
				<p:inputText value="#{accessApplActivationBackingBean.activationKey}" maxlength="15" required="true" label="#{lbl['lbl.sm.activation.key']}" />
			</td>
		</tr>
		
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sm.activation.loginid']}" />
			</td>
			<td>
				<h:outputText value="#{accessApplActivationBackingBean.managedBean.accessAppl.identificationNo}" disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:commandButton 
					value="#{lbl['lbl.btn.submit']}" onclick="submissionDialog.show();"  
					oncomplete="submissionDialog.hide();"
					action="#{accessApplActivationBackingBean.activateAccount}"
					ajax="false" />
			</td>
			<td />
		</tr>

	</table>

			<p:dialog widgetVar="submissionDialog" modal="true" draggable="false"
				closable="false" resizable="false" showHeader="false">
				<p:graphicImage value="/css/images/ajax-loader.gif" />
			</p:dialog>

	</ui:define>


</ui:composition>
