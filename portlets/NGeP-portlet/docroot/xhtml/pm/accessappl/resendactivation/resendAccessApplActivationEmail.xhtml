<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
	
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	
	<table>
		<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width:300px;"
						id="somAccessApplOrgType" 
						required="true"
						label="#{lbl['lbl.pm.organisation.orgType']}"
						value="#{accessApplResendActivationBB.selectedOrgType}">
						<f:selectItems
							value="#{accessApplResendActivationBB.getOrgTypeDropdownValues()}" />
						<p:ajax event="change"
							listener="#{accessApplResendActivationBB.changeOrgType()}"
							update=":form:lovOrg:lovOrg,@this" />
					</p:selectOneMenu>
					<p:message for="somAccessApplOrgType" id="somAccessApplOrgTypeMsg" display="icon" /></td>
				<td></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgName']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><ac:lov id="lovOrg"
						lovId="PM_ORG_PROFILE" size="53" 
						required="#{!empty param['disableValidation']}" 
						update="@form"
						label="#{lbl['lbl.pm.organisation.orgName']}"
						disabled="#{empty accessApplResendActivationBB.selectedOrgType}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{accessApplResendActivationBB.selectedOrgProfile.pmOrgValidity.orgName}"
						saveObject="accessApplResendActivationBB.selectedOrgProfile"
						conditionField="#{accessApplResendActivationBB.constructConditionFields()}"
					 /></td>
				<td></td>
			</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.access.app.email']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText id="itEmail"
					label="#{lbl['lbl.pm.access.app.email']}"
					required="true"
					value="#{accessApplResendActivationBB.email}"
					size="40" >
					<f:validateRegex
					pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td>
				<p:inputText id="itIdNo"
					label="#{lbl['lbl.pm.profiles.userdetails.idno']}"
					required="true" maxlength="15"
					value="#{accessApplResendActivationBB.identificationNo}"
					size="35"  />
			</td>
		</tr>
	</table>
	
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sm.button.resend.activation']}" 
					update=":form" onstart="blockWidget.show()" 
					oncomplete="if (!args.validationFailed) confirmDialog.show();" />
	</div>
	<ac:confirmationPopup id="confirmDialog"
			widget="confirmDialog"
			okAction="accessApplResendActivationBB.resendAccessApplActivationEmail()"
			width="400" height="100"
			title="#{lbl['lbl.sm.userprofile.confirmation']}"
			content="#{lbl['lbl.sm.req.reactivation.confirmation.msg']}" 
			update="@form" />	
	<ac:lovPopup />
	</ui:define>
</ui:composition>
