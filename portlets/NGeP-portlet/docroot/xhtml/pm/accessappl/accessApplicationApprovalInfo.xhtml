<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.pm.access.app.approval.info']}" toggleable="true"
		id="approvalInfoPnl" rendered="#{not isBrandNew}">
		<table>
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.pm.access.app.remarks']}" /> </td>
				<td class="tdContent">
					<h:inputTextarea id="textAreaId"    
							cols="40"  value="#{accessApplBackingBean.managedBean.remarks}"  
							autoResize="false" 
							onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);">
					 </h:inputTextarea>
				</td>
			</tr>
		</table>
		
	</p:panel>
</ui:composition>
