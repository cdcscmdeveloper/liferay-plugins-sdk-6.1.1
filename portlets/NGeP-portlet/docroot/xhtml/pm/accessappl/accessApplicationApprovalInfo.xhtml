<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.pm.access.app.approval.info']}" toggleable="true"
		id="approvalInfoPnl" rendered="#{not isBrandNew}">
		<table>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.pm.access.app.remarks']}" /> </td>
				<td>
					<p:inputTextarea id="textAreaId"   disabled="#{accessApplBackingBean.managedBean.showTrackingDairy}"
							cols="40" maxlength="1000"  value="#{accessApplBackingBean.managedBean.remarks}"  							
							>
					 </p:inputTextarea>
				</td>
			</tr>
		</table>
		
	</p:panel>
</ui:composition>
