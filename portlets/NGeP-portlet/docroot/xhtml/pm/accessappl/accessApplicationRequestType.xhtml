<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.pm.access.app.request.type']}"
		toggleable="true" id="requestTypePnl" rendered="#{isBrandNew}">
		<p:panelGrid style="width: 100%">
			<f:facet name="header">
				<p:row>
					<p:column>#{lbl['lbl.pm.access.app.request.type']}</p:column>
					<p:column>#{lbl['lbl.pm.status']}</p:column>
				</p:row>
			</f:facet>
			<p:row>
				<p:column>
					<p:selectBooleanCheckbox id="isMarketResearchChxBox"
						value="#{accessApplBackingBean.managedBean.accessAppl.marketResearch}">
						<p:ajax update="@this" />
					</p:selectBooleanCheckbox>
							#{lbl['lbl.pm.access.app.market.research']}</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:selectBooleanCheckbox id="isCompanyProfileChxBox"
						value="#{accessApplBackingBean.managedBean.accessAppl.companyProfile}">
						<p:ajax update="@this" />
					</p:selectBooleanCheckbox>
							#{lbl['lbl.pm.access.app.company.profile']}</p:column>
			</p:row>
		</p:panelGrid>

	</p:panel>
</ui:composition>
