<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.pm.access.app.supp.doc']}"
		toggleable="true" id="suppDocPnl">
		<h:outputText style="color:red;" rendered="#{isBrandNew}"
			value="#{lbl['lbl.pm.access.app.supp.doc.desc']}" />
		<p:dataTable id="suppDocDt" var="accessApplDoc" rows="5"
			value="#{accessApplBackingBean.managedBean.accessApplDocList}"
			rowIndexVar="index">
			<ac:paginator for="suppDocDt" />
			<p:column headerText="#{lbl['lbl.pm.document.name']}">
				<h:outputText value="#{accessApplDoc.document.docName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.txt.attachment']}" >
				<p:commandLink oncomplete="accessApplUploadDlg.show();"
					update="@([id$=accessApplUploadDialog])" process="@this"
					action="#{accessApplBackingBean.assignSelectedApplDoc(accessApplDoc)}"
					rendered="#{accessApplDoc.brandNew}">
					<p:graphicImage value="/css/images/design/upload.png"
						style="margin-right:2px;" />
				</p:commandLink>
				<h:commandLink value="#{accessApplDoc.fileName}" 
								styleClass="blue_font"
								rendered="#{not accessApplDoc.brandNew}" 
								action="#{accessApplBackingBean.downloadFile(accessApplDoc.filePath)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
