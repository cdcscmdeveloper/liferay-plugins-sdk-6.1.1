<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="#{lbl['lbl.pm.access.app.org']}" toggleable="true"
		id="accessApplPnl">
		<table style="width:100%">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						id="somAccessApplOrgType" 
						disabled="#{not isBrandNew}"
						required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.organisation.orgType']}"
						value="#{accessApplBackingBean.managedBean.selectedOrgType}">
						<f:selectItems
							value="#{accessApplBackingBean.getOrgTypeDropdownValues()}" />
						<p:ajax event="change"
							listener="#{accessApplBackingBean.changeOrgType()}"
							update=":form:lovOrg:lovOrg,@this" />
					</p:selectOneMenu></td>
				<td></td>
			</tr>
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgName']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><ac:lov id="lovOrg"
						lovId="PM_ORG_PROFILE" size="40" 
						required="#{!empty param['disableValidation']}" 
						update="@form"
						readonly="true"
						disabled="#{empty accessApplBackingBean.managedBean.selectedOrgType or not isBrandNew}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{accessApplBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
						saveObject="accessApplBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{accessApplBackingBean.constructConditionFields()}"
						postUpdateListener="accessApplBackingBean.changeOrgUnit" /></td>
				<td></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
