<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<div class="header-spacing">
			<p:outputPanel id="accessApplBttnOp">
			<table style="width: 100%;">
				<tr style="float:right">
					<td><p:commandButton value="#{lbl['lbl.btn.submit']}" 
							action="#{accessApplBackingBean.saveAccessApplication('SAVE')}" 
							disabled="#{not accessApplBackingBean.managedBean.declarationChecked or not accessApplBackingBean.managedBean.tncChecked}" 
							update="@([id$=Msg])"  onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()"
							rendered="#{isBrandNew}">
							 <f:param name="disableValidation" value="true" /> 
						</p:commandButton>
					</td>
					<ui:repeat var="action" value="#{accessApplBackingBean.managedBean.outComes}" 
						rendered ="#{not isBrandNew}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
							<td>
								<p:commandButton value="#{lbl[buttonLabel]}" 
									action="#{accessApplBackingBean.saveAccessApplication(action)}" 
									onstart="blockWidget.show()" 
									oncomplete="blockWidget.hide()">
									<f:param name="disableValidation" value="true" /> 
							</p:commandButton>
							</td>
						</ui:repeat>
				</tr>
			</table>
			</p:outputPanel>	
		</div>
</ui:composition>
