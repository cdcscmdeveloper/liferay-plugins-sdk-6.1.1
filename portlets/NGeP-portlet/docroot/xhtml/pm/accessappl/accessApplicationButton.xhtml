<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<div class="header-spacing">
			<p:outputPanel id="accessApplBttnOp">
			<c:if test="#{accessApplBackingBean.managedBean.showTrackingDairy}">
				<table style="width: 100%;">
					<tr>
						<td>
							<div align="left" style="width: 100%">
								<p:commandButton value="#{lbl['lbl.btn.back']}"
									action="#{accessApplBackingBean.redirectToProfileSearchPage}"
									/>
							</div>
						</td>
						<td><div align="right" style="width: 100%">
						<p:commandLink value="#{lbl['lbl.td.tracking.diary']}"
								action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(accessApplBackingBean.managedBean.accessAppl.docType, accessApplBackingBean.managedBean.accessAppl.accessApplId)}">

							</p:commandLink>
							</div>
							</td>
					</tr>
				</table>
			</c:if>
			<c:otherwise>
			<table style="width: 100%;">
				<tr style="float:right">
					<td>
						<!-- 34445 start -->
						<p:commandButton value="#{lbl['lbl.btn.submit']}"
							update="@([id$=Msg])"
							disabled="#{not accessApplBackingBean.managedBean.declarationChecked}"
							oncomplete="if(!args.validationFailed) submitApplDlg.show();"
							rendered="#{isBrandNew}">
							<f:param name="disableValidation" value="true" />
						</p:commandButton>
						<!-- 34445 end -->
					</td>
					<td colspan="4" style="text-align: right">
					<ui:decorate template="/xhtml/pm/shared/claim_template.xhtml">
						<ui:define name="outComeSection">
							<ui:repeat var="action" value="#{accessApplBackingBean.managedBean.outComes}" 
								rendered ="#{not isBrandNew}">
								<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />
								<!-- 34445 start -->
								<p:commandButton value="#{lbl[buttonLabel]}"
									rendered="#{action=='APPROVE'}"
									oncomplete="if(!args.validationFailed) approveApplDlg.show();">
									<f:param name="disableValidation" value="true" />
								</p:commandButton>
								
								<p:commandButton value="#{lbl[buttonLabel]}"
									rendered="#{action=='REJECT'}"
									oncomplete="if(!args.validationFailed) rejectApplDlg.show();">
									<f:param name="disableValidation" value="true" />
								</p:commandButton>
								<!-- 34445 end -->
							</ui:repeat>
						</ui:define>
					</ui:decorate>
					</td>
				</tr>
			</table>
			</c:otherwise>
			</p:outputPanel>	
		</div>
		
		<!-- 34445 start -->
		<ac:confirmationPopupSM id="submitApplDlg" widget="submitApplDlg"
			okParam="#{accessApplBackingBean.saveAccessApplication('SAVE')}"
			width="400" height="100" hasParam="true"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.submit.msg']}" 
			update="@([id$=Msg])"
			loadingWidget="blockWidget" />
			
		<ac:confirmationPopupSM id="approveApplDlg" widget="approveApplDlg"
			okParam="#{accessApplBackingBean.saveAccessApplication('APPROVE')}"
			width="400" height="100" hasParam="true"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.approve.msg']}" 
			update="@([id$=Msg])"
			loadingWidget="blockWidget" />
			
		<ac:confirmationPopup id="rejectApplDlg" widget="rejectApplDlg"
			okParam="#{accessApplBackingBean.saveAccessApplication('REJECT')}"
			width="400" height="100" hasParam="true"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.reject.msg']}"
			update="@([id$=Msg])"/>
		<!-- 34445 end -->
</ui:composition>
