<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<div class="header-spacing">
			<p:outputPanel id="accessApplBttnOp">
			<c:if test="#{accessApplBackingBean.managedBean.showTrackingDairy}">
				<table style="width: 100%;">
					<tr>
						<td>
							<div align="left" style="width: 100%">
								<p:commandButton value="#{lbl['lbl.btn.back']}"
									action="#{accessApplBackingBean.redirectToProfileSearchPage}"
									/>
							</div>
						</td>
						<td><div align="right" style="width: 100%">
						<p:commandLink value="#{lbl['lbl.td.tracking.diary']}"
								action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(accessApplBackingBean.managedBean.accessAppl.docType, accessApplBackingBean.managedBean.accessAppl.accessApplId)}">

							</p:commandLink>
							</div>
							</td>
					</tr>
				</table>
			</c:if>
			<c:otherwise>
			<table style="width: 100%;">
				<tr style="float:right">
					<td><p:commandButton value="#{lbl['lbl.btn.submit']}" 
							action="#{accessApplBackingBean.saveAccessApplication('SAVE')}" 
							disabled="#{not accessApplBackingBean.managedBean.declarationChecked or not accessApplBackingBean.managedBean.tncChecked}" 
							update="@([id$=Msg])"  onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()"
							rendered="#{isBrandNew}">
							 <f:param name="disableValidation" value="true" /> 
						</p:commandButton>
					</td>
					<td colspan="4" style="text-align: right">
					<ui:decorate template="/xhtml/pm/shared/claim_template.xhtml">
						<ui:define name="outComeSection">
							<ui:repeat var="action" value="#{accessApplBackingBean.managedBean.outComes}" 
								rendered ="#{not isBrandNew}">
								<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(action)}" />									
										<p:commandButton value="#{lbl[buttonLabel]}" 
											action="#{accessApplBackingBean.saveAccessApplication(action)}" 
											onstart="blockWidget.show()" 
											oncomplete="blockWidget.hide()">
											<f:param name="disableValidation" value="true" /> 
									</p:commandButton>									
								</ui:repeat>
						</ui:define>
					</ui:decorate>
					</td>
				</tr>
			</table>
			</c:otherwise>
			</p:outputPanel>	
		</div>
</ui:composition>
