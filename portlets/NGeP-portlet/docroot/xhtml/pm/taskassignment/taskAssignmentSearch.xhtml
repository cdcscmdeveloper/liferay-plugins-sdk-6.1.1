<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pTaskAssignSearch" header="#{lbl['lbl.pm.ta.search']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.ministry']}"/>
				</th>
				<td width="15%">
					<ac:lov id="lovMinistry" lovId="PM_ORG_PROFILE" size="20" 
		            	update=":form:pTaskAssignSearch" readonly="true" 
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry.pmOrgValidity.orgCode}" 
						saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry"
						conditionField="orgTypeCode.parameterType^#{ParameterTypeConst.organisationTypes}|orgTypeCode.parameterCode^#{ParameterConst.orgTypeMinistry}|recordStatus^1"/>
				</td>
				<td>
					<p:inputText styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.ta.ministry']}" disabled="true"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry.pmOrgValidity.orgName}"/>
				</td>
				<td width="40%">
					
				</td>
			</tr>
			<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.ptj']}"/>
				</th>
				<td width="15%">
					<ac:lov id="lovPtj" lovId="PM_ORG_PROFILE" size="20" 
		            	update=":form:pTaskAssignSearch" readonly="true" disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj.pmOrgValidity.orgCode}" 
						saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj"
						conditionField="orgTypeCode.parameterType^#{ParameterTypeConst.organisationTypes}|orgTypeCode.parameterCode^#{ParameterConst.orgTypePtj}|parentOrgProfile.orgProfileId^#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry.orgProfileId}|recordStatus^1"/>
				</td>
				<td>
					<p:inputText styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.ta.ptj']}" disabled="true"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj.pmOrgValidity.orgName}"/>
				</td>
				<td width="40%">
				
				</td>
			</tr>
			<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.username']}"/>
				</th>
				<td width="15%">
					<c:choose>
						<c:when test="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj!=null and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj.orgProfileId!=null}">
							<ac:lov id="lovUser" lovId="PM_USER" size="20"  disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj==null}"
				            	update=":form:pTaskAssignSearch" readonly="true" 
								headerText="#{lbl['lbl.pm.ta.user.lov']}"
								value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.loginId}" 
								saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user"
								conditionField="pmUserOrgs.pmOrgProfile.orgProfileId^#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ptj.orgProfileId}|recordStatus^1"/>		
						</c:when>
						<c:otherwise>
							<ac:lov id="lovUser" lovId="PM_USER" size="20" disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry==null}"
				            	update=":form:pTaskAssignSearch" readonly="true" 
								headerText="#{lbl['lbl.pm.ta.user.lov']}" 
								value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.loginId}" 
								saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user"
								conditionField="pmUserOrgs.pmOrgProfile.orgProfileId^#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.ministry.orgProfileId}|recordStatus^1"/>							
						</c:otherwise>
					</c:choose>
					
					
				</td>
				<td>
					<p:inputText styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.ta.username']}" disabled="true"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.userName}"/>
				</td>
				<td width="40%">
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							id="cbSearchTask" widgetVar="cbSearchTask"
							process="pTaskAssignSearch" action="#{taskAssignBackingBean.searchTaskAssign}"
							update="dtTaskAssignResult" 
							onclick="cbSearchTask.disable();cbResetTask.disable()"  
			  				oncomplete="cbSearchTask.enable();cbResetTask.enable()"
							/>&#160;
						<p:commandButton id="cbResetTask" widgetVar="cbResetTask"
							onclick="cbSearchTask.disable();cbResetTask.disable()"  
			  				oncomplete="cbSearchTask.enable();cbResetTask.enable()"
							value="#{lbl['lbl.btn.reset']}" action="#{taskAssignBackingBean.resetTaskAssignSearchBean}"
							update="pTaskAssignSearch" 
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
