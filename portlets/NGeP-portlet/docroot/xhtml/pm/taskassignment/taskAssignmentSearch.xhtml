<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pTaskAssignSearch" header="#{lbl['lbl.pm.ta.search']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.ta.ministry']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somMinistry" label="#{lbl['lbl.pm.ta.ministry']}" styleClass="ppDropDownWidthM"  
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					</p:selectOneMenu>
					<p:inputText styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.ta.ministry']}"/>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.ta.ptj']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somPtj" label="#{lbl['lbl.pm.ta.ptj']}" styleClass="ppDropDownWidthM"  
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					</p:selectOneMenu>
					<p:inputText styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.ta.ptj']}"/>
				</td>
				<th>
					
				</th>
				<td>
				
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.ta.username']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.ta.username']}"/>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							process="pTaskAssignSearch" action="#{taskAssignBackingBean.searchTaskAssign}"
							update="dtTaskAssignResult" 
							
							/>&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{taskAssignBackingBean.resetTaskAssignSearchBean}"
							update="pTaskAssignSearch" 
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
