<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	<style>
	table[id$="rolecheckboxes"] tr td label{
		float: left;
	}
	
	</style>
	<ui:param name="isSysOrgType" value="#{ParameterConst.orgTypeSys eq taskAssignBackingBean.managedBean.currentActiveOrg.orgTypeCode.parameterCode}" />		
	<p:panel id="pTaskAssignSearch" header="#{lbl['lbl.pm.ta.search']}" toggleable="true">
		
		<table class="ppTwoTable">
			<tr>
				<th width="15%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.org.type']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td width="55%" style="white-space:nowrap;">
					<p:selectOneMenu 
						disabled="#{not isSysOrgType}"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterId}" 
						styleClass="ppDropDownWidthM" id="somOrgType"   
						label="#{lbl['lbl.pm.ta.org.type.name']}">  
						<f:selectItems value="#{taskAssignBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.organisationTypes, taskAssignBackingBean.orgTypeSearchBean)}" />   
				     	<p:ajax event="change" listener="#{taskAssignBackingBean.changeOrgType()}" 
				     		update=":form:pTaskAssignSearch"/> 
		            </p:selectOneMenu>	            	
				</td>
				<td width="30%">
					
				</td>
			</tr>
			<tr>
				<th width="15%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.org.name']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td width="55%" style="white-space:nowrap;">
					<p:outputPanel id="opPtjOrgCode" 
					rendered="#{ParameterConst.orgTypePtj eq taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterCode}">
				<p:inputText 
						size="60"
						id="itSelectedPtj" 
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgProfile.pmOrgValidity.orgName}" 
						readonly="true"
						disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterId==null
							or !taskAssignBackingBean.managedBean.orgProfileRequired}"
						/>
					&#160;	
					<p:commandLink id="ptjSearchCL" partialSubmit="true"
						disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterId==null
							or !taskAssignBackingBean.managedBean.orgProfileRequired}"
						process="@this" update=":form:orgProfileCcId:ptjPopup"
						action="#{organisationSearchBackingBean.initPtjPopup}"
						oncomplete="ptjPopup.show();" >
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
					</p:commandLink>
					</p:outputPanel>
					<p:outputPanel id="opSysOrgCode" 
					rendered="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterId==null or 
					ParameterConst.orgTypeSys eq taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterCode}">				
	            	<ac:lov id="lovMinistry" lovId="PM_ORG_PROFILE" size="60" 
						disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterId==null
							or !taskAssignBackingBean.managedBean.orgProfileRequired}"
		            	update=":form:pTaskAssignSearch" readonly="true" 
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgProfile.pmOrgValidity.orgName}" 
						saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgProfile"
						conditionField="#{taskAssignBackingBean.constructConditionFields()}"
						postUpdateListener ="taskAssignBackingBean.onChangeOrg"/>
						</p:outputPanel>
				</td>
				<td width="30%">
					
				</td>
			</tr>
						
			<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.username']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td width="55%">
					<ac:lov id="lovUser" lovId="PM_USER_ID" size="55"  
						disabled="#{!(taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgProfile!=null
						and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgProfile.orgProfileId!=null
						and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgProfile.orgName !='')}"
		            	update=":form:pTaskAssignSearch" readonly="true" 
						headerText="#{lbl['lbl.pm.ta.user.lov']}"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.loginId} &#160; #{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.userName}" 
						saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user"
						conditionField="#{taskAssignBackingBean.constructUserConditionFields()}"
						postUpdateListener ="taskAssignBackingBean.onChangeUser"/>
						
				</td>
				
				<td width="30%">
					
				</td>
			</tr>
			<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.role']}"/>
				</th>
				<td width="55%">
					<div style="overflow-y: scroll; height:100px; width:400px;border: 1px solid #DDD;margin-bottom: 5px; ">
						<p:selectManyCheckbox id="rolecheckboxes" 
						    value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.selectedRoles}" 
						    layout="pageDirection" 
					    disabled="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docNo !=null 
						    and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docNo !=''}">
	            			<f:selectItems value="#{taskAssignBackingBean.getRoleList()}" />
	            			<p:ajax event="change" process="@this"  partialSubmit ="true" update="@this,:form:lovDocType:lovDocType"/> 
	       				 </p:selectManyCheckbox>
       				</div>
				</td>
				
				<td width="30%">
					
				</td>
			</tr>
			<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.process.doctype']}"/>
				</th>
				<td width="55%">
					<ac:lov id="lovDocType" lovId="PM_PARAMETER_DESC" size="55" 
						disabled="#{!(taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user!=null
						and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.userId!=null
						and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.user.userName !='')
						or (taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docNo !=''
						and taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docNo != null)}" 
		            	update="@this" readonly="true" 
						headerText="#{lbl['lbl.pm.ta.document.type']}"
						value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docType.codeDesc}"
						saveObject="taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docType"
						conditionField="#{taskAssignBackingBean.constuctConditionFields()}"/>
				</td>
				
				<td width="30%">
					
				</td>
			</tr>
				<tr>
				<th width="10%">
					<p:outputLabel value="#{lbl['lbl.pm.ta.doc.no']}"/>
				</th>
				<td width="55%">
					<p:inputText id="docNo"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.ta.doc.no']}" maxlength="20"
							value="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.docNo}"
							size="30" >
						<p:ajax event="blur" listener="#{taskAssignBackingBean.onChangeUser(null)}" 
				     		update=":form:pTaskAssignSearch"/> 
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.pm.ta.docno.tooltips']}" />
				</td>
				
				<td width="30%">
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							id="cbSearchTask" widgetVar="cbSearchTask"
							process="pTaskAssignSearch" action="#{taskAssignBackingBean.searchTaskAssign}"
							update="dtTaskAssignResult" 
							onclick="cbSearchTask.disable();cbResetTask.disable()"  
			  				oncomplete="cbSearchTask.enable();cbResetTask.enable()"
							/>
						<p:commandButton id="cbResetTask" widgetVar="cbResetTask"
							onclick="cbSearchTask.disable();cbResetTask.disable()"  
			  				oncomplete="cbSearchTask.enable();cbResetTask.enable()"
							value="#{lbl['lbl.btn.reset']}" action="#{taskAssignBackingBean.resetTaskAssignSearchBean}"
							update="pTaskAssignSearch" 
							/> 
					</div>
				</td>
			</tr>
		</table>
		<ac:ptjPopup 
		  	id="orgProfileCcId"
		  	orgTypeParamCode="#{taskAssignBackingBean.managedBean.taskAssignmentSearchBean.orgType.parameterCode}"
		  	okAction="taskAssignBackingBean.selectPtjAction"
		  	update=":form:pTaskAssignSearch"  />
	</p:panel>

</ui:composition>
