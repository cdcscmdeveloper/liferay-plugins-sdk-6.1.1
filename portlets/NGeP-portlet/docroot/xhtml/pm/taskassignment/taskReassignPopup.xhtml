<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:dialog id="dlTaskReassignment" header="#{lbl['lbl.pm.ta.task.reassignment']}" modal="true"
		widgetVar="dlTaskReassignment" dynamic="true" width="750" height="300">
		<!-- Validation Message -->
		<p:messages id="messagesRole" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
		<p:outputPanel id="opTaskReassign" header="#{lbl['lbl.pm.ta.result']}" toggleable="true">
			<table class="ppTwoTable">
				<tr>
					<th style="width:15%;">
						<p:outputLabel value="#{lbl['lbl.pm.ta.doc.type']}"/>
					</th>
					<td style="width:45%;">
						<p:inputText label="#{lbl['lbl.pm.ta.doc.type']}" disabled="true" size="40"
							value="#{taskAssignBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, taskAssignBackingBean.managedBean.selectedTask.docType)}" />

					</td>
					<th style="width:15%;">
						<p:outputLabel value="#{lbl['lbl.pm.ta.doc.no']}"/>
					</th>
					<td style="width:25%;"> 
						<p:inputText label="#{lbl['lbl.pm.ta.doc.no']}"  disabled="true" size="16"
							value="#{taskAssignBackingBean.managedBean.selectedTask.docNumber}"/>
					</td>
				</tr>
			</table>
			<p:dataTable id="dtTaskReassign" emptyMessage="#{lbl['lbl.pp.no.record.found']}"			
				value="#{taskAssignBackingBean.managedBean.availableUsers}"
				selection="#{taskAssignBackingBean.managedBean.selectedUser}"
				rowIndexVar="index" rowKey="#{user}" var="user"
			   selectionMode="single"
				 >
				<p:ajax event="rowSelect"/>
				<ac:paginator for="dtTaskReassign" />
  
		        <p:column headerText="#{lbl['lbl.pm.ta.name']}">  
			    	#{user.userName}
		        </p:column>  
		      
		   	</p:dataTable> 
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.pm.ta.btn.assign']}" oncomplete="dlTaskReassignment.hide()"
					action="#{taskAssignBackingBean.confirmReassignTask()}" update=":form:dtTaskAssignResult"
					immediate="true"/>
				
				<p:commandButton id="cbCancel" 
					value="#{lbl['lbl.btn.cancel']}" oncomplete="dlTaskReassignment.hide()"
					immediate="true" />
			</div>
		</p:outputPanel>
	</p:dialog>
</ui:composition>
