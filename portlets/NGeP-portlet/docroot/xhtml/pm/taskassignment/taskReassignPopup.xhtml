<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	<p:outputPanel id="opTaskReassign" header="#{lbl['lbl.pm.ta.result']}" toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.ta.doc.type']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" label="#{lbl['lbl.pm.ta.doc.type']}"/>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.ta.doc.no']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" label="#{lbl['lbl.pm.ta.doc.no']}"/>
				</td>
			</tr>
		</table>
		<br/>
		<p:dataTable id="dtTaskReassign" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			 >
			<ac:paginator for="dtTaskReassign" />
	        <p:column headerText="#{lbl['lbl.pm.ta.name']}">  
		    	
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pm.ta.designation']}">  
	            
	        </p:column> 
	   	</p:dataTable> 
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.pm.ta.btn.assign']}" 
				immediate="true"/>
			&#160;
			<p:commandButton id="cbSuppDelete" value="#{lbl['lbl.btn.cancel']}"
				immediate="true" />
		</div>
	</p:outputPanel>
</ui:composition>
