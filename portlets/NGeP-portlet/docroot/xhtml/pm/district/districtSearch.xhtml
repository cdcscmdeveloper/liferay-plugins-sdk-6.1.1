<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="districtPanel" header="#{lbl['lbl.pm.district.search']}"
		toggleable="true">

		<table class="ppTwoTable">
			<tr>
				<td width="16%"><p:outputLabel
						value="#{lbl['lbl.pm.district.state']}"></p:outputLabel></td>
				<td width="35%"><p:selectOneMenu
						label="#{lbl['lbl.pm.district.state']}" id="stateCode"
						value="#{districtBackingBean.managedBean.districtSearchBean.stateCode}"
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{districtBackingBean.getListOfStates()}"/>							
						<p:ajax event="change"  process="@this" partialSubmit="true" listener="#{districtBackingBean.changeStateSelection()}"
						update="@form" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td width="16%"><p:outputLabel
						value="#{lbl['lbl.pm.division']}"></p:outputLabel></td>
				<td width="19%"><p:inputText disabled="#{!districtBackingBean.managedBean.adoptDivision}"
						value="#{districtBackingBean.managedBean.districtSearchBean.divisionName}"
						size="44" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.district']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{districtBackingBean.managedBean.districtSearchBean.districtName}"
						id="districtName" size="44" /></td>
			</tr>
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{districtBackingBean.searchDistrict}"
							update=":form:districtResult" />
						&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{districtBackingBean.resetDistrictSearchBean}"
							process="@this"
							update=":form:districtPanel, :form:districtResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
