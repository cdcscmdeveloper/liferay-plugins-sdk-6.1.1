<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="districtResult" header="#{lbl['lbl.pm.disrict.result']}"
		toggleable="true">
		<p:dataTable id="district"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{districtBackingBean.searchDistrict}" rows="10"
			var="districtList" rowIndexVar="index" lazy="true">
			<ac:paginator for="district" />

	        <p:column headerText="#{lbl['lbl.pm.state.seq.no']}" style="width:5%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{index+1}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.district.state.name']}" style="width:25%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{districtList.pmState.stateName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.district.code']}" style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{districtList.districtCode}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.district.name']}" style="width:30%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{districtList.districtName}" />				
			</p:column>
			
		</p:dataTable>
	</p:panel>
	
</ui:composition>
