<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:panel id="locationSearchPanel"
			header="#{lbl['lbl.pm.search.location']}" toggleable="true">
			<p:outputPanel id="jobWeightOpId">
				<table width="100%">
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.instruction.mandatory']}" />
					<c:forEach
						items="#{poJobWeightBackingBean.managedBean.jobWeightList}"
						var="jobWeight">
						<!-- 12852 Start -->
						<tr>
							<td width="20%"><p:outputLabel
									value="#{poJobWeightBackingBean.getParameterDesc(ParameterTypeConst.jobWeightType,jobWeight.weightType.parameterCode)}" />
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td width="80%"><p:inputText
									label="#{poJobWeightBackingBean.getParameterDesc(ParameterTypeConst.jobWeightType,jobWeight.weightType.parameterCode)}"
									size="5" value="#{jobWeight.weightValue}" maxlength="1" style="width:2%"
									required="#{!empty param['disableValidation']}">
								</p:inputText>
								</td>
						</tr>
						<!-- 12852 End -->
					</c:forEach>
				</table>
				<p:tooltip id="tt" rendered="false">
							<p:outputLabel escape="false" value="tt"  />
				</p:tooltip>
			</p:outputPanel>
			<p:outputPanel id="buttonOpId">
				<table width="100%">
					<tr>
						<td colspan="4">
							<div class="ppRightBtn">
								<p:commandButton id="jobWeightSaveBtn"
									value="#{lbl['lbl.btn.save']}"
									action="#{poJobWeightBackingBean.saveJobWeight()}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
									<f:param name="disableValidation" value="true" />
								</p:commandButton>

								<p:commandButton id="jobWeightResetBtn"
									value="#{lbl['lbl.btn.reset']}" partialSubmit="true"
									process="@this" update="jobWeightOpId"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									action="#{poJobWeightBackingBean.resetJobWeight()}" />
							</div>
						</td>
					</tr>
				</table>


			</p:outputPanel>

		</p:panel>
			
	</ui:define>
</ui:composition>
