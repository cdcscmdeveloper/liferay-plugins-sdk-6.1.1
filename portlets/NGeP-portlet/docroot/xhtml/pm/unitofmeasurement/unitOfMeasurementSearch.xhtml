<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="measurementPanel" header="#{lbl['lbl.pm.uom.search']}"
		toggleable="true">

		<table class="ppTwoTable">
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.uom.uomcode']}"></h:outputLabel></th>
				<td><p:inputText
						value="#{unitOfMeasurementBackingBean.managedBean.measurementCodes}"
						size="30" maxlength="3"/></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.uom.uomname']}"></h:outputLabel></th>
				<td><p:inputText
						value="#{unitOfMeasurementBackingBean.managedBean.measurementNames}"
						size="30" maxlength="50"/></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.search.status']}">
					</h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{unitOfMeasurementBackingBean.managedBean.status}">
						<f:selectItems
							value="#{unitOfMeasurementBackingBean.getMeasurementStatusList()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{unitOfMeasurementBackingBean.retrieveMeasurement}"
							update=":form:measurementSR" process="measurementPanel" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{unitOfMeasurementBackingBean.resetMeasurementSearch}"
							process="@this" update="measurementPanel, :form:measurementSR" />
					</div>
				</td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
