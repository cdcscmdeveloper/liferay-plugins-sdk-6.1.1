<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	
	<p:panel id="measurementSearch" header="SEARCH" toggleable="true">
	
	 <ui:include src="/xhtml/pm/unitofmeasurement/unitOfMeasurementSearch.xhtml" />
			
      <div align="right">
			<p:commandButton value="#{lbl['lbl.btn.search']}" icon="ui-icon-search" />
            <p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset" />
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel id="measurementResult" header="RESULT" toggleable="true">
	<p:dataTable id="measurementSR">	
	   <ac:paginator for="measurementSR" />
		
       <p:column headerText="#{lbl['lbl.pm.uom.uomcode']}" style="width:15%"> 
   
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.uom.uomname']}" style="width:50%"> 

       </p:column>  
       
        <p:column headerText="#{lbl['lbl.pm.uom.uomdecimal']}" style="width:20%"> 

       </p:column>              
     
       <p:column headerText="#{lbl['lbl.pm.search.status']}" style="width:10%"> 
            
       </p:column >
        
    	<p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}" style="width:5%">
   		 <p:commandLink>
     		<p:graphicImage library="ep/images/design" name="edit.png"
     		 value="/resources/ep/images/design/edit.png" />
    	 </p:commandLink>
   	 	</p:column>    
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="#{lbl['lbl.btn.create']}" action="#{unitOfMeasurementBackingBean.createMeasurement}" 
      				   style="float:right;" icon="ui-icon-add" />
	
	 </h:panelGrid>	
	</p:panel>
</ui:composition>
