<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="measurementResult" header="#{lbl['lbl.pm.uom.result']}"
		toggleable="true">
		<p:dataTable id="measurementSR"
			value="#{unitOfMeasurementBackingBean.unitOfMeasurementDataModel}"
			rows="10" var="measurementList" rowIndexVar="index" lazy="true">
			<ac:paginator for="measurementSR" />

			<p:column headerText="#{lbl['lbl.pm.uom.uomcode']}" style="width:15%">
				<h:outputText value="#{measurementList.uomCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.uom.uomname']}" style="width:50%">
				<h:outputText value="#{measurementList.uomName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.uom.uomdecimal']}"
				style="width:20%">
				<h:outputText value="#{measurementList.decimalScale}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:10%"> 
   	    #{(measurementList.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}             
       </p:column>

			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%">
				<p:commandLink
					action="#{unitOfMeasurementBackingBean.goToUnitMaintaincePage(measurementList)}"
					process="@this" partialSubmit="true">
					<p:graphicImage library="ep/images/design" 
						value="/css/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}"
			action="#{unitOfMeasurementBackingBean.createMeasurement}" />
	</div>
</ui:composition>
