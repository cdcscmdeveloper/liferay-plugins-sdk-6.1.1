<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel header="#{lbl['lbl.pm.uom.title']}" toggleable="true">
	<p:spacer height="10"></p:spacer>
			
	<table style="width:100%;">
	  <tr>	  	
		<td style="width:12%;"><p:outputLabel value="#{lbl['lbl.pm.uom.uomcode']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{unitOfMeasurementBackingBean.managedBean.pmUom.uomCode}"  
		     size="30" maxlength="10" />
		</td>
	  </tr>	
	  <tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.uom.uomname']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{unitOfMeasurementBackingBean.managedBean.pmUom.uomName}" 
		     size="30" maxlength="50" />
		</td>
	  </tr>
		<p:spacer height="5"></p:spacer>	  
	   <tr> 
		<td><p:outputLabel value="#{lbl['lbl.pm.uom.uomdecimal']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;"
     			value="#{unitOfMeasurementBackingBean.managedBean.pmUom.decimalScale}"> 
      			<f:selectItems value="#{unitOfMeasurementBackingBean.getMeasurementDecimal()}"></f:selectItems>  	   	
    	    </p:selectOneMenu></td>				
	    </tr>
		<p:spacer height="5"></p:spacer>	    	  
	   <tr> 
		<td><p:outputLabel value="#{lbl['lbl.pm.search.status']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;"
     			value="#{unitOfMeasurementBackingBean.managedBean.pmUom.recordStatusFlg}">
     			<f:selectItems value="#{unitOfMeasurementBackingBean.getMeasurementStatusList()}"></f:selectItems>       
    	    </p:selectOneMenu></td>				
	    </tr>
	</table>
	<p:spacer height="50"></p:spacer>
   </p:panel>	
</ui:composition>
