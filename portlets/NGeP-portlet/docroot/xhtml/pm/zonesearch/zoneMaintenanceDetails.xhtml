<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td"></h:panelGrid>
	</p:panel>
	<p:panel header="SUPPLIER ZONE" toggleable="true">

		<table>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.zone.code']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td class="TableFieldRight"><p:inputText
						label="#{lbl['lbl.pm.zone.code']}"
						value="#{zoneBackingBean.managedBean.pmZone.zoneCode}"
						id="zonecode" lable="#{lbl['lbl.pm.zone.code']}" size="40"
						required="true" /></td>
				<td><p:message id="zonecodeMsg" for="zonecode" display="icon" /></td>
			</tr>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.zone.name']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td class="TableFieldRight"><p:inputText
						value="#{zoneBackingBean.managedBean.pmZone.zoneName}"
						label="#{lbl['lbl.pm.zone.name']}" id="zonename"
						lable="#{lbl['lbl.pm.zone.name']}" size="40" required="true" /></td>
				<td><p:message id="zonenameMsg" for="zonename" display="icon" /></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.location.status']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="zonestatus"
						label="#{lbl['lbl.pm.location.status']}"
						value="#{zoneBackingBean.managedBean.pmZone.recordStatusFlg}"
						required="true" style="width: 135px;margin-bottom: 5px;">
						<f:selectItems value="#{zoneBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<td><p:message id="zonestatusMsg" for="zonestatus"
						display="icon" /></td>
			</tr>
		</table>


	</p:panel>

	<p:panel header="STATE LIST" toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.pm.state']}" />
		</f:facet>
		<p:dataTable id="selectedStateId"
			value="#{zoneBackingBean.managedBean.zoneStateList}" var="state"
			rowIndexVar="index" rowKey="#{state}"
			selection="#{zoneBackingBean.managedBean.selectedZones}">
			<ac:paginator for="selectedStateId"></ac:paginator>

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.pm.state.code']}" style="width :15%">
				<h:outputText value="#{state.pmState.stateCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state.name']}" style="width :40%">
				<h:outputText value="#{state.pmState.stateName}" />
			</p:column>

		</p:dataTable>
		<br />
		<div align="right">

			<p:commandButton value="Add" process="@this"
				action="#{zoneBackingBean.addState}"
				oncomplete="statelistpopup.show();" icon="ui-icon-add" />

			<p:commandButton value="Delete" icon="ui-icon-delete"
				process="@this,selectedStateId" partialSubmit="true"
				action="#{zoneBackingBean.deleteState}" update="selectedStateId" />


		</div>
	</p:panel>
	<p:dialog id="stateSearch" header="SELECT STATE"
		widgetVar="statelistpopup" modal="true" width="600" height="300"
		resizable="false">
		<p:dataTable id="searchStateId" var="state"
			value="#{zoneBackingBean.managedBean.states}"
			selection="#{zoneBackingBean.managedBean.selectedStates}"
			rowKey="#{state.stateId}" rowIndexVar="index">
			<p:column selectionMode="multiple" style="width:2%" />
			<ac:paginator for="searchStateId"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.state.code']}" style="width :15%">
				<h:outputText value="#{state.stateCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state.name']}" style="width :40%">
				<h:outputText value="#{state.stateName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="OK" action="#{zoneBackingBean.okZoneAction}"
				ajax="true" icon="ui-icon-check"
				update="selectedStateId,searchStateId"
				process="@this, searchStateId" onclick="statelistpopup.hide();" />

			<p:commandButton value="Cancel" icon="ui-icon-cancel" process="@this"
				onclick="statelistpopup.hide();" />
		</div>
	</p:dialog>
</ui:composition>
