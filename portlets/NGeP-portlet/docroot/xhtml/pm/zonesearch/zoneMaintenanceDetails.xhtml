<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="supplierZoneDetailPanel" header="#{lbl['lbl.pm.supplier.zone.dtl']}" toggleable="true">

		<table>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.zone.code']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td class="TableFieldRight"><p:inputText styleClass="ppDisplayTextM"
						label="#{lbl['lbl.pm.zone.code']}" style="text-transform: uppercase"
						value="#{zoneBackingBean.managedBean.pmZone.zoneCode}"
						disabled="#{!zoneBackingBean.managedBean.pmZone.brandNew}"
						id="zonecode" lable="#{lbl['lbl.pm.zone.code']}" size="40"						
						required="true" >						
						</p:inputText></td>
				<td><p:message id="zonecodeMsg" for="zonecode" display="icon" /></td>
			</tr>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.zone.name']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td class="TableFieldRight"><p:inputText styleClass="ppDisplayTextM"
						value="#{zoneBackingBean.managedBean.pmZone.zoneName}"
						label="#{lbl['lbl.pm.zone.name']}" id="zonename"
						lable="#{lbl['lbl.pm.zone.name']}" size="40" required="true" /></td>
				<td><p:message id="zonenameMsg" for="zonename" display="icon" /></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.location.status']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="zonestatus" styleClass="ppDropDownWidthM"
						label="#{lbl['lbl.pm.location.status']}" disabled="#{zoneBackingBean.managedBean.pmZone.brandNew}" 
						value="#{zoneBackingBean.managedBean.pmZone.recordStatusFlg}"
						required="true" >
						<f:selectItems value="#{zoneBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<td><p:message id="zonestatusMsg" for="zonestatus"
						display="icon" /></td>
			</tr>
		</table>

	</p:panel>

	<p:panel id="statePanel" toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.pm.state']}" />
		</f:facet>
		<p:dataTable id="selectedStateId"
			value="#{zoneBackingBean.managedBean.zoneStateList}" var="zoneState"
			rowIndexVar="index" rowKey="#{zoneState}"
			selection="#{zoneBackingBean.managedBean.selectedZones}">
			<ac:paginator for="selectedStateId"></ac:paginator>

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.pm.state.code']}" style="width :15%">
				<h:outputText value="#{zoneState.pmState.stateCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state.name']}" style="width :40%">
				<h:outputText value="#{zoneState.pmState.stateName}" />
			</p:column>

		</p:dataTable>
		<div align="right">

			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this"
				action="#{zoneBackingBean.addState}" immediate="true" update="searchStateId"
				/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this,selectedStateId" partialSubmit="true"
				action="#{zoneBackingBean.deleteState}" update="selectedStateId" />


		</div>
	</p:panel>
	<p:dialog id="stateSearch" header="#{lbl['lbl.pm.zone.select.state']}"
		widgetVar="statelistpopup" modal="true" width="600" height="300"
		resizable="false" closable="false">
		<p:messages showDetail="true" autoUpdate="true" closable="true"
			severity="error, info" />
		<p:dataTable id="searchStateId" var="state"
			value="#{zoneBackingBean.managedBean.states}"
			selection="#{zoneBackingBean.managedBean.selectedStates}"
			rowKey="#{state.stateId}" rowIndexVar="index">
			<p:ajax event="rowSelect" listener="#{zoneBackingBean.removeDisabledStates}" update="searchStateId"></p:ajax>
			<p:ajax event="rowUnselect" listener="#{zoneBackingBean.removeDisabledStates}" update="searchStateId"></p:ajax>
			<p:ajax event="rowSelectCheckbox" listener="#{zoneBackingBean.removeDisabledStates}" update="searchStateId"></p:ajax>
			<p:ajax event="rowUnselectCheckbox" listener="#{zoneBackingBean.removeDisabledStates}" update="searchStateId"></p:ajax>
			<p:ajax event="rowDblselect" listener="#{zoneBackingBean.removeDisabledStates}" update="searchStateId"></p:ajax>
			<p:column selectionMode="multiple" style="width:2%" disabledSelection="#{state.existingState}"/>
			<ac:paginator for="searchStateId"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.state.code']}" style="width :15%" >
				<h:outputText value="#{state.stateCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state.name']}" style="width :40%" >
				<h:outputText value="#{state.stateName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.select']}" action="#{zoneBackingBean.okZoneAction}"
				ajax="true" 
				update="selectedStateId,searchStateId"
				process="@this, stateSearch"  />
               
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"  process="@this"
				action="#{zoneBackingBean.cancleZone}" />
		</div>
	</p:dialog>
</ui:composition>
