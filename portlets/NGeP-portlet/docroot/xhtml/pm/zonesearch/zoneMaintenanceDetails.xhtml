<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td"></h:panelGrid>
	</p:panel>
	<p:panel header="SUPPLIER ZONE" toggleable="true">

		<table>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.zone.code']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:inputText
						value="#{zoneBackingBean.managedBean.pmZone.zoneCode}"
						id="zonecode" lable="#{lbl['lbl.pm.zone.code']}" size="20"
						required="true" /> <p:message id="zonecodeMsg" for="zonecode"
						display="icon" /></td>
			</tr>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.zone.name']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:inputText
						value="#{zoneBackingBean.managedBean.pmZone.zoneName}"
						id="zonename" lable="#{lbl['lbl.pm.zone.name']}" size="50"
						required="true" /> <p:message id="zonenameMsg" for="zonename"
						display="icon" /></td>
			</tr>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.pm.location.status']}"></h:outputLabel></td>
				<td><p:selectOneMenu lable="#{lbl['lbl.pm.location.status']}"
						value="#{zoneBackingBean.managedBean.pmZone.recordStatusFlg}"
						id="zonestatus" required="true" style="margin-bottom: 5px;">
						<f:selectItems
							value="#{zoneBackingBean.getDropdownCodeValues(ParameterTypeConst.recordStatus)}" />
					</p:selectOneMenu>
					<p:message id="zonestatusMsg" for="zonestatus" display="icon" /></td>
			</tr>
		</table>


	</p:panel>

	<p:panel header="STATE LIST" toggleable="true">
		<p:dataTable id="selectedStateId"
			value="#{zoneBackingBean.managedBean.zoneStateList}" var="state"
			rowIndexVar="index" rowKey="#{state}"
			selection="#{zoneBackingBean.managedBean.selectedZones}">
			<ac:paginator for="selectedStateId"></ac:paginator>
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.pm.state.code']}" style="width :15%">
				<h:outputText value="#{state.pmState.stateCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state.name']}" style="width :40%">
				<h:outputText value="#{state.pmState.stateName}" />
			</p:column>
		</p:dataTable>
		<br />
		<div align="right">

			<p:commandButton value="Add" process="@this"
				action="#{zoneBackingBean.addState}"
				oncomplete="statelistpopup.show();" icon="ui-icon-add" />

			<p:commandButton value="Delete" icon="ui-icon-delete"
				action="#{zoneBackingBean.addState}" update="selectedStateId" />

		</div>
	</p:panel>
</ui:composition>
