<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel>
	<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
   </p:panel>
	
   <p:panel header="SUPPLIER ZONE" toggleable="true">
		
	<h:panelGrid  columns="2" >
	
	<h:outputLabel value="* Zone Code"></h:outputLabel>
	<p:inputText size="20"></p:inputText>
	
	<h:outputLabel value="* Zone Name"></h:outputLabel>
	<p:inputText size="50"></p:inputText>
	
	<h:outputLabel value="Status"></h:outputLabel>
	<p:inputText size="20"></p:inputText>			
	
	</h:panelGrid>
   </p:panel>
	
	<p:panel header="STATE LIST" toggleable="true">
	<p:dataTable id="groupUser"  value="" var="groupuser" editable="true">
 	  <ac:paginator /> 
       <p:column />	       
       <p:column headerText="State Code" > 
          <h:outputText value="WP"/>
       </p:column>  
       
       <p:column headerText="State Name" > 
          <h:outputText value="WILAYAH PERSEKUTUAN"/>
       </p:column>             
       
     </p:dataTable>

  <br/>
    <div align="right">
	<p:commandButton value="Add" oncomplete="statelistpopup.show();" icon="ui-icon-add"></p:commandButton>
    <p:commandButton value="Delete" icon="ui-icon-delete"></p:commandButton>
    </div>
   </p:panel>	

</ui:composition>
