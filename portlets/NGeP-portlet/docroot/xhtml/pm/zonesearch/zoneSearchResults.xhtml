<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="pRejectReasonResult"
		header="#{lbl['lbl.pm.rejection.reason.result']}" toggleable="true">
		<p:dataTable id="searchZones" var="zone" rows="10"
			value="#{zoneBackingBean.searchZone}" rowIndexVar="index" lazy="true">

			<ac:paginator for="searchZones"></ac:paginator>

			<p:column headerText="#{lbl['lbl.pm.zone.code']}" style="width :15%">
				<h:outputText value="#{zone.zoneCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.zone.name']}" style="width :30%">
				<h:outputText value="#{zone.zoneName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.status']}">  
	            #{(zone.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	         </p:column>


			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink
					action="#{zoneBackingBean.redirectToZone(zone.zoneId)}">
					<p:graphicImage library="ep/images/design" 
						title="#{lbl['lbl.pm.zone.update']}" value="/css/images/design/edit.png" />
				</p:commandLink>

			</p:column>
		</p:dataTable>

	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}"
			action="#{zoneBackingBean.redirectToZone(null)}" />
	</div>
</ui:composition>
