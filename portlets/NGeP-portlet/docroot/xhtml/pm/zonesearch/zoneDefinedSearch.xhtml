<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<h:panelGrid columns="2" id="zoneSerchState">
			<h:outputLabel value="#{lbl['lbl.pm.zone.code']}"></h:outputLabel>
			<p:inputText value="#{zoneBackingBean.managedBean.zoneCode}"
				size="20" />

			<h:outputLabel value="#{lbl['lbl.pm.zone.name']}"></h:outputLabel>
			<p:inputText value="#{zoneBackingBean.managedBean.zoneName}"
				size="50" />

			<h:outputLabel value="#{lbl['lbl.pm.state.name']}"></h:outputLabel>
			<p:inputText value="#{zoneBackingBean.managedBean.stateName}"
				size="50" />
				<h:outputLabel value="#{lbl['lbl.pm.location.status']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{zoneBackingBean.managedBean.status}"
				style="width: 127px;margin-bottom: 5px;">
				<f:selectItems
					value="#{zoneBackingBean.getDropdownCodeValues(ParameterTypeConst.recordStatus)}" />
			</p:selectOneMenu>
		</h:panelGrid>
	</p:panel>
</ui:composition>
