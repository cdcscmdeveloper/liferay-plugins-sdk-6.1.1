<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="zoneSearchPanel"
		header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<table class="ppTwoTable">

			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.zone.code']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" maxlength="10"
						value="#{zoneBackingBean.managedBean.zoneSearchBean.zoneCode}" />
				</td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.zone.name']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM"
						value="#{zoneBackingBean.managedBean.zoneSearchBean.zoneName}"
						cols="50" rows="5" maxlength="50" autoResize="false" /></td>
						<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.state.name']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM"
						value="#{zoneBackingBean.managedBean.zoneSearchBean.stateName}"
						cols="50" rows="5" maxlength="50" autoResize="false" /></td>
						<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.status']}" /></th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM" 
						value="#{zoneBackingBean.managedBean.zoneSearchBean.status}">
						<f:selectItems
							value="#{zoneBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							update="searchZones" process="zoneSearchPanel" 
							action="#{zoneBackingBean.searchZone}" />
						
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							update=":form:zoneSearchPanel,:form:searchZones" 
							action="#{zoneBackingBean.resetZoneSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
