<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<p:panel>
		<h:panelGrid columns="2">
			<h:outputLabel value="#{lbl['lbl.pm.zone.code']}"></h:outputLabel>
			<p:inputText value="#{zoneBackingBean.managedBean.zoneCode}"
				size="40" />

			<h:outputLabel value="#{lbl['lbl.pm.zone.name']}"></h:outputLabel>
			<p:inputText value="#{zoneBackingBean.managedBean.zoneName}"
				size="40" />

			<h:outputLabel value="#{lbl['lbl.pm.state.name']}"></h:outputLabel>
			<p:inputText value="#{zoneBackingBean.managedBean.stateName}"
				size="40" />
			<h:outputLabel value="#{lbl['lbl.pm.location.status']}"></h:outputLabel>
			<p:selectOneMenu value="#{zoneBackingBean.managedBean.status}"
				style="width: 135px;margin-bottom: 5px;">
				<f:selectItems value="#{zoneBackingBean.getStatusOptions()}" />
			</p:selectOneMenu>
		</h:panelGrid>

	</p:panel>
</ui:composition>
