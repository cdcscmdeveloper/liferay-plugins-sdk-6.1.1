<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
		
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="userGroupSearch" style="width:100%;">
	</h:panelGrid>
     
			<p:tabView>
				<p:tab id="definedZoneSearch" title="DEFINED SEARCH">
				   <ui:include src="/xhtml/pm/zonesearch/zoneDefinedSearch.xhtml" />
				</p:tab>		
			</p:tabView>
				
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search" />
            <p:commandButton value="Reset" icon="ui-icon-reset" />
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchZoneProfile" value="" var="" editable="true">
 	<ac:paginator />
    <p:ajax event="rowEdit" />  
    <p:ajax event="rowEditCancel"/> 
    				
       <p:column headerText="Zone Code" > 
        <h:outputText />
       </p:column>
       
       <p:column headerText="Zone Name" > 
        <h:outputText />
       </p:column>     
    
    <p:column headerText="Action">
    <p:commandLink>
     <p:graphicImage library="ep/images/design" name="edit.png"
      value="/resources/ep/images/design/edit.png" />
    </p:commandLink>
    </p:column>    
     </p:dataTable>
	</p:panel>
	
     <div>
      <p:commandButton value="Create" style="float:right;" action="zoneMaintenance.xhtml?faces-redirect=true"
         ajax="false" icon="ui-icon-add" />
     </div>
</ui:composition>
