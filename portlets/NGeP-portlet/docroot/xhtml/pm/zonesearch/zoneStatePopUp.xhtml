<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="zoneStateSearch" header="SELECT STATE" widgetVar="statelistpopup" modal="true" width="600" height="200">
		
		<p:panel header="SELECT STATE" toggleable="true">
	    <p:dataTable id="zoneListResult" value="" var="zonelistresults">
		<ac:paginator />
		<p:column />
	    <p:column headerText="State Code" > 
          <h:outputText value="00ad"/>
        </p:column> 
 	    <p:column headerText="State Name" > 
          <h:outputText value="Wilayah Persekutuan"/>
        </p:column>           
                             
		</p:dataTable>
       <p:spacer height="15"></p:spacer>

		<div align="right">
		  <p:commandButton value="Ok" icon="ui-icon-check"/>		
		  <p:commandButton value="Cancel" icon="ui-icon-cancel" />		
		</div>
		</p:panel>
	</p:dialog>
</ui:composition>
