<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="stateSearch" header="SELECT STATE"
		widgetVar="statelistpopup" modal="true" width="600" height="300"
		resizable="false">
		<p:dataTable id="searchStateId" var="state"
			value="#{zoneBackingBean.managedBean.states}"
			selection="#{zoneBackingBean.managedBean.selectedStates}"
			rowKey="#{state.stateId}" rowIndexVar="index">
			<p:column selectionMode="multiple" style="width:2%" />
			<ac:paginator for="searchStateId"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.state.code']}" style="width :15%">
				<h:outputText value="#{state.stateCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state.name']}" style="width :40%">
				<h:outputText value="#{state.stateName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="OK" action="#{zoneBackingBean.okZoneAction}"
				ajax="true" icon="ui-icon-check"
				update="selectedStateId,searchStateId"
				process="@this, searchStateId" onclick="statelistpopup.hide();" />

			<p:commandButton value="Cancel" icon="ui-icon-cancel" process="@this"
				onclick="statelistpopup.hide();" />
		</div>
	</p:dialog>
</ui:composition>
