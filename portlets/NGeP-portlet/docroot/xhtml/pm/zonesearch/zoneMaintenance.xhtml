<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages showDetail="true"
			autoUpdate="#{zoneBackingBean.managedBean.showParentMsg}"
			closable="true" severity="error, info" />

		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}"
						immediate="true" update=":form" process="@this"
						action="#{zoneBackingBean.backToSearch}" style="float:left;" /></td>
				<td><p:commandButton
						value="#{zoneBackingBean.managedBean.pmZone.brandNew? lbl['lbl.btn.create'] : lbl['lbl.btn.update']}"
						action="#{zoneBackingBean.saveZone}" update="@([id$=Msg])"
						style="float:right;">
					</p:commandButton></td>
			</tr>


		</table>
		<ui:include src="/xhtml/pm/zonesearch/zoneMaintenanceDetails.xhtml"></ui:include>
	</ui:define>
</ui:composition>
