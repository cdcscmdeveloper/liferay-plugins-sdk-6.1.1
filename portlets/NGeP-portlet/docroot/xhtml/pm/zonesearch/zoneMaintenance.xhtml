<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<ui:remove>
			<p:messages showDetail="true"
				autoUpdate="#{zoneBackingBean.managedBean.showParentMsg}"
				closable="true" severity="error, info" />

			<div class="ppLeftBtn">
				<p:commandButton value="#{lbl['lbl.btn.back']}"
					action="#{zoneBackingBean.backToSearch}" immediate="true" />
			</div>
			<div style="width: 100%; text-align: right">
				<p:commandButton
					value="#{zoneBackingBean.managedBean.pmZone.brandNew? lbl['lbl.btn.save'] : lbl['lbl.btn.update']}"
					style="float:right;" action="#{zoneBackingBean.saveZone}"
					update="@([id$=Msg])" />
			</div>
		</ui:remove>
		<p:messages id="zonesearch" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>
		<ui:include src="/xhtml/pm/zonesearch/zonesearchNav.xhtml"></ui:include>

		<ui:include src="/xhtml/pm/zonesearch/zoneMaintenanceDetails.xhtml"></ui:include>
	</ui:define>
</ui:composition>
