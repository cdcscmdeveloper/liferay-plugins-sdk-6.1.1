<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:outputPanel id="addManualDelAddrPnl">
		<table style="width: 100%">
			<tr>
				<td style="width:15%;">
					<p:outputLabel value="#{lbl['lbl.pm.address.country']}"/>
					<h:outputLabel styleClass="mandatory" rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td style="width:35%;">
					<p:selectOneMenu id="facCountry" tabindex="0" style="width: 297px;" required="true"
						label="#{lbl['lbl.pm.address.country']}" disabled="true" value="#{financialOrgBackingBean.managedBean.pmAddress.pmCountry.countryId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{financialOrgBackingBean.getCountryList()}" var="country"
							itemLabel="#{country.countryName}" itemValue="#{country.countryId}"/>
					</p:selectOneMenu>
					<p:message for="facCountry" id="facCountryMsg" display="icon"/>
				</td>
				<td style="width:15%;">
					<p:outputLabel required="true" value="#{lbl['lbl.pm.address.state']}"/>
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td style="width:35%;">
					<p:selectOneMenu id="facState" tabindex="1"
						required="#{not empty financialOrgBackingBean.managedBean.pmAddress.address1 or not empty financialOrgBackingBean.managedBean.pmAddress.address2 or not empty financialOrgBackingBean.managedBean.pmAddress.address3}"
						disabled="true" label="#{lbl['lbl.pm.address.state']}" style="width:297px;" value="#{financialOrgBackingBean.managedBean.pmAddress.pmState.stateId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{financialOrgBackingBean.getStateList(financialOrgBackingBean.managedBean.pmAddress.pmCountry.countryId)}"
							var="state" itemLabel="#{state.stateName}" itemValue="#{state.stateId}"/>
						<p:ajax event="change" update="olDivisionMandatory,facDistrict, facDivision, facCity"
							listener="#{financialOrgBackingBean.retrievePmState(financialOrgBackingBean.managedBean.pmAddress.pmState)}"/>
					</p:selectOneMenu>
					<p:message for="facState" id="facStateMsg" display="icon"/></td>
			</tr>
			
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.address']}"/> 
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td>
					<p:inputText id="address1" tabindex="2" label="#{lbl['lbl.pm.address.address']}" maxlength="100"
						styleClass="ppDisplayTextL" value="#{financialOrgBackingBean.managedBean.pmAddress.address1}"
						disabled="true" size="52">
						<p:ajax event="blur" update="@([id$=telNo])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=faxNo])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facState])" process="@this" partialSubmit="true"/> 
						<p:ajax event="blur" update="@([id$=facDistrict])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facCity])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=postCode])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=contacePerson])" process="@this" partialSubmit="true"/>
					</p:inputText>
					<p:message for="address1" id="address1Msg" display="icon"/>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.division']}"/>
					<p:outputPanel id="olDivisionMandatory">
						<p:outputLabel styleClass="mandatory"
							rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory and financialOrgBackingBean.managedBean.pmAddress.pmState.adoptDivision}"/>
					</p:outputPanel>
				</td>
				<td>
					<p:selectOneMenu id="facDivision" tabindex="8" style="width:297px;" disabled="true"
						required="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory and financialOrgBackingBean.managedBean.pmAddress.pmState.adoptDivision}"
						label="#{lbl['lbl.pm.address.division']}" value="#{financialOrgBackingBean.managedBean.pmAddress.pmDivision.divisionId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{financialOrgBackingBean.getDivisionList(financialOrgBackingBean.managedBean.pmAddress.pmState.stateId)}"
							var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>
						<p:ajax event="change" update="facDivision,facDistrict,facCity"
							listener="#{financialOrgBackingBean.retrievePmDivision(financialOrgBackingBean.managedBean.pmAddress.pmDivision)}"/>
					</p:selectOneMenu>
					<p:message for="facDivision" id="facDivisionMsg" display="icon"/>
				</td>
			</tr>
			
			<tr>
				<td></td>
				<td>
					<p:inputText styleClass="ppDisplayTextL" tabindex="3" value="#{financialOrgBackingBean.managedBean.pmAddress.address2}"
						disabled="true" size="52" maxlength="100">
						<p:ajax event="blur" update="@([id$=telNo])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=faxNo])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facState])" process="@this" partialSubmit="true"/> 
						<p:ajax event="blur" update="@([id$=facDistrict])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facCity])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=postCode])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=contacePerson])" process="@this" partialSubmit="true"/>
					</p:inputText>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.district']}"/>
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td>
					<p:selectOneMenu id="facDistrict" tabindex="9"
						required="#{not empty financialOrgBackingBean.managedBean.pmAddress.address1 or not empty financialOrgBackingBean.managedBean.pmAddress.address2 or not empty financialOrgBackingBean.managedBean.pmAddress.address3}"
						disabled="true" label="#{lbl['lbl.pm.address.district']}" style="width:297px;"
						value="#{financialOrgBackingBean.managedBean.pmAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{financialOrgBackingBean.getDistrictList(financialOrgBackingBean.managedBean.pmAddress.pmState)}"
							var="district" itemLabel="#{district.districtName}" itemValue="#{district.districtId}"/>
						<p:ajax event="change" update="facDistrict,facCity"
							listener="#{financialOrgBackingBean.retrievePmDistrict(financialOrgBackingBean.managedBean.pmAddress.pmDistrict)}"/>
					</p:selectOneMenu>
					<p:message for="facDistrict" id="facDistrictMsg" display="icon"/>
				</td>
			</tr>
			
			<tr>
				<td></td>
				<td>
					<p:inputText maxlength="100" styleClass="ppDisplayTextL"  tabindex="4" value="#{financialOrgBackingBean.managedBean.pmAddress.address3}"
						disabled="true" size="52">
						<p:ajax event="blur" update="@([id$=telNo])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=faxNo])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facState])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facDistrict])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=facCity])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=postCode])" process="@this" partialSubmit="true"/>
						<p:ajax event="blur" update="@([id$=contacePerson])" process="@this" partialSubmit="true"/>
					</p:inputText>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.city']}"/>
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td class="tdContent">
					<p:selectOneMenu id="facCity" tabindex="10"
						required="#{not empty financialOrgBackingBean.managedBean.pmAddress.address1 or not empty financialOrgBackingBean.managedBean.pmAddress.address2 or not empty financialOrgBackingBean.managedBean.pmAddress.address3}"
						disabled="true" label="#{lbl['lbl.pm.address.city']}" style="width:297px;"
						value="#{financialOrgBackingBean.managedBean.pmAddress.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems value="#{financialOrgBackingBean.getCityList(financialOrgBackingBean.managedBean.pmAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}" itemValue="#{city.cityId}"/>
						<p:ajax event="change" update="facCity" listener="#{financialOrgBackingBean.retrievePmCity(financialOrgBackingBean.managedBean.pmAddress.pmCity)}"/>
					</p:selectOneMenu>
					<p:message id="facCityMsg" for="facCity" display="icon"/>
				</td>
			</tr>
			
			<tr>
				<td></td>
				<td class="tdContent"></td>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.postcode']}"/>
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td>
					<p:inputText id="postCode"
						required="#{not empty financialOrgBackingBean.managedBean.pmAddress.address1 or not empty financialOrgBackingBean.managedBean.pmAddress.address2 or not empty financialOrgBackingBean.managedBean.pmAddress.address3}"
						disabled="true" label="#{lbl['lbl.pm.address.postcode']}" maxlength="5"
						value="#{financialOrgBackingBean.managedBean.pmAddress.postcode}" styleClass="ppDisplayTextL"
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$"/>
						<p:ajax event="blur" update="@this" process="@this" partialSubmit="true"/>
					</p:inputText>
					<p:message for="postCode" id="postCodeMsg" display="icon"/>
				</td>
			</tr>
			
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.tel']}"/>
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td>
					<ac:phone id="telNo" isMobile="false" label="#{lbl['lbl.pm.address.tel']}"
						countryCode="#{financialOrgBackingBean.managedBean.pmAddress.phoneCountry}"
						areaCode="#{financialOrgBackingBean.managedBean.pmAddress.phoneArea}"
						number="#{financialOrgBackingBean.managedBean.pmAddress.phoneNo}" disabled="true"/>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.fax']}"/>
				</td>
				<td>
					<ac:phone id="faxNo" isMobile="false" label="#{lbl['lbl.pm.address.fax']}"
						countryCode="#{financialOrgBackingBean.managedBean.pmAddress.faxCountry}"
						areaCode="#{financialOrgBackingBean.managedBean.pmAddress.faxArea}"
						number="#{financialOrgBackingBean.managedBean.pmAddress.faxNo}" disabled="true"/>
				</td>
				<td></td>
			</tr>
			
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.header.general.org.contactPerson']}"/>
					<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
				</td>
				<td>
					<p:commandLink action="#{financialOrgBackingBean.addContacePerson}"
						tabindex="7" update="addManualDelAddrPnl" process="addManualDelAddrPnl" id="contacePerson"
						disabled = "#{empty financialOrgBackingBean.managedBean.pmAddress.address1 and empty financialOrgBackingBean.managedBean.pmAddress.address2 and empty financialOrgBackingBean.managedBean.pmAddress.address3}"
						partialSubmit="true">
						<p:graphicImage title="#{lbl['lbl.pm.header.general.org.contactPerson']}" value="/css/images/design/ico-edit-contact.png"/>
					</p:commandLink>
				</td>
				<td></td>
				<td></td>
			</tr>
		</table>
	</p:outputPanel>
	
	<p:dialog id="contactPerson" header="#{lbl['lbl.pm.header.general.org.contactPerson']}"
		closable="false" resizable ="false" widgetVar="contactPersonPopup" modal="true" width="600" height="250">
		<p:messages id="finOrgContactMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false"/>
		<p:panel id="contactPersond">
			<table>
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.contact.name']}"/>
						<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
					</td>
					<td class="tdContent">
						<p:inputText id="contactName" styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.contact.name']}"
							maxlength="85" disabled="true" value="#{financialOrgBackingBean.managedBean.contactPerson.contactName}" size="50"/>
					</td>
					<td>
						<p:message id="contactNameMsg" for="contactName" display="icon"/>
					</td>
				</tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.contact.email']}"/>
						<p:outputLabel rendered="#{financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"/>
					</td>
					<td class="tdContent">
						<p:inputText id="contactEmail" styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.contact.email']}"
							maxlength="80" size="50" disabled="true" value="#{financialOrgBackingBean.managedBean.contactPerson.email}"
							validatorMessage="#{lbl['lbl.pm.contact.email']} - #{lbl['lbl.pm.profiles.invalidEmail']}">
							<f:validateRegex disabled="#{not financialOrgBackingBean.managedBean.addressAndContactPersonMandatory}"
								pattern="^(?:[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,}))?$" />
						</p:inputText>
					</td>
					<td>
						<p:message id="contactEmailMsg" for="contactEmail" display="icon"/>
					</td>
				</tr>
				
				<tr><td><br /></td></tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.contact.phone']}"/>
					</td>
					<td class="tdContent">
						<ac:phone id="contactPhone" isMobile="false" label="#{lbl['lbl.pm.address.tel']}"
							countryCode="#{financialOrgBackingBean.managedBean.contactPerson.phoneCountry}"
							areaCode="#{financialOrgBackingBean.managedBean.contactPerson.phoneArea}"
							number="#{financialOrgBackingBean.managedBean.contactPerson.phoneNo}" disabled="true"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}"/>
					</td>
					<td>
						<p:message id="contactPhoneMsg" for="contactPhone" display="icon"/>
					</td>
				</tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.contact.fax']}"/>
					</td>
					<td class="tdContent">
						<ac:phone id="contactFax" isMobile="false" label="#{lbl['lbl.pm.contact.fax']}"
							countryCode="#{financialOrgBackingBean.managedBean.contactPerson.faxCountry}"
							areaCode="#{financialOrgBackingBean.managedBean.contactPerson.faxArea}"
							number="#{financialOrgBackingBean.managedBean.contactPerson.faxNo}" disabled="true"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}"/>
					</td>
				    <td>
				    	<p:message id="contactFaxMsg" for="contactFax" display="icon"/>
				    </td>
				</tr>
				
				<tr>
					<td class="tdTitle">
						<p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}"/>
					</td>
					<td class="tdContent">
						<ac:phone id="contactMobile" label="#{lbl['lbl.pm.contact.mobile']}"
							countryCode="#{financialOrgBackingBean.managedBean.contactPerson.mobileCountry}"
							areaCode="#{financialOrgBackingBean.managedBean.contactPerson.mobileArea}"
							number="#{financialOrgBackingBean.managedBean.contactPerson.mobileNo}"
							isMobile="false" disabled="true"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}"/>
					</td>
					<td>
						<p:message id="contactMobileMsg" for="contactMobile" display="icon"/>
					</td>
				</tr>
			</table>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.close']}" process="@this" action="#{financialOrgBackingBean.closeContacePerson}"/>
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
