<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<style type="text/css">
		div[id$="factoringBankStatusId_panel"] .ui-selectonemenu-items-wrapper{width:110px;}
	</style>
	
	<p:outputPanel id="opFacBankDet">
		<p:dataTable id="financialaccid" var="financialacc" resizableColumns="true" style="width: 100% !important;"
			value="#{financialOrgBackingBean.managedBean.financialOrg.pmFinancialAccs}"
			rowKey="#{financialacc}" rowIndexVar="rowIndex">
			<ac:paginator for="financialacc"/>
			<p:column style="width: 25% !important;white-space:normal;">
				<f:facet name="header">
					<h:outputText styleClass="mandatory"/>
					<h:outputText value="#{lbl['lbl.pm.financialorg.paymentbankname']}"/>
				</f:facet>
				<h:outputText value="#{financialacc.pmPaymentBankOrg.finOrgName}"
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}"
					rendered="#{!financialacc.brandNew}"/>
				<p:selectOneMenu value="#{financialacc.pmPaymentBankOrg.financialOrgId}" id="finorgn"
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}" rendered="#{financialacc.brandNew}"
					style="margin-bottom: 5px;width:210px !important" styleClass="ppDropDownWidthL" required="true">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
					<f:selectItems var="finorgLs" value="#{financialOrgBackingBean.getPaymentBankList()}"
						itemLabel="#{finorgLs.finOrgName}" itemValue="#{finorgLs.financialOrgId}"/>
						<p:ajax event="change" update="bankCode" listener="#{financialOrgBackingBean.getBankCode(financialacc.pmPaymentBankOrg.financialOrgId)}"/>
				</p:selectOneMenu>
				<p:message id="finorgnMsg" for="finorgn" display="icon"/>
			</p:column>
			
			<p:column style="width: 11% !important">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.financialorg.bankcode']}"/>
				</f:facet>
				<p:inputText id="bankCode" value="#{financialacc.bankCode}" disabled="true" size="10"/>
			</p:column>
			
			<p:column style="width: 16% !important">
				<f:facet name="header">
					<h:outputText styleClass="mandatory"/>
					<h:outputText value="#{lbl['lbl.pm.financialorg.acnumber']}"/>
				</f:facet>
				<p:inputText id="accountNo" value="#{financialacc.accountNo}" label="#{lbl['lbl.pm.financialorg.acnumber']}"
					required="true" size="18" styleClass="ppDisplayTextS" maxlength="18" disabled="true"/>
				<p:message for="accountNo" id="accountNoMsg" display="icon"/>
			</p:column>
			
			<p:column width="14%" headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{financialacc.recordStatusFlg}" style="width: 110px !important;"
					disabled="true" styleClass="ppDropDownWidthS" required="true" id="factoringBankStatusId">
					<f:selectItems value="#{financialOrgBackingBean.getStatusOptions()}"/>
					<p:ajax event="change" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						listener="#{financialOrgBackingBean.disableBankActiveStatus(financialacc.recordStatusFlg, financialacc.accountNo, financialacc.financialAccId)}"
						update="financialaccid" partialSubmit="true" process="@this"/>
					</p:selectOneMenu>
			</p:column>
		</p:dataTable>
	</p:outputPanel>
</ui:composition>
