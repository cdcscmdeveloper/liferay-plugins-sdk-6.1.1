<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="pCriteriaSearch" header="#{lbl['lbl.pm.search.location']}" toggleable="true" >
  
		<table class="ppTwoTable">
			<!-- 12852 Start -->
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.criteria.code']}"></h:outputLabel></th>
				<td><p:inputText maxlength="10"
						value="#{criteriaBackingBean.managedBean.criteriaSearchBean.criteriaCode}"
						id="supplierCriteriaCode" size="10" update="pCriteriaSearch"/></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<!-- 12852 End -->
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.criteria.name']}"></h:outputLabel></th>
				<td><p:inputText maxlength="10"
						value="#{criteriaBackingBean.managedBean.criteriaSearchBean.criteriaName}"
						id="supplierCriteriaName" size="30" update="pCriteriaSearch"/></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
	<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.search.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{criteriaBackingBean.managedBean.criteriaSearchBean.status}">
						<f:selectItems value="#{criteriaBackingBean.getStatusList()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="2" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{criteriaBackingBean.searchSupplierCriteria}"
							update="dtCriteriaResult" process="pCriteriaSearch"/>
                       
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{criteriaBackingBean.resetSupCriteriaSearch}"
							update="pCriteriaSearch, dtCriteriaResult" />
							
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
