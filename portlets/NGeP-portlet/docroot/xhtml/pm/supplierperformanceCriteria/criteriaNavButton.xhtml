<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%">
		<tr>
			<td>
				<div align="left" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{criteriaBackingBean.redirectSupCriteriaSearch}"
						process="@this" style="float:left;" />
				</div>
			</td><td>
			<div align="right" style="width: 100%">
				<!-- 34445 start -->
				<c:choose>
					<c:when test="#{criteriaBackingBean.managedBean.selectedCriteria.brandNew}">
						<p:commandButton id="btnCriteriaSave" value="#{lbl['lbl.btn.save']}"
							oncomplete="if (!args.validationFailed) saveInfoDlg.show()" style="float:right;"/>
					</c:when>
					<c:otherwise>
						<p:commandButton id="btnCriteriaUpdate" value="#{lbl['lbl.btn.update']}"
							oncomplete="updateInfoDlg.show()" style="float:right;"/>
					</c:otherwise>
				</c:choose>
				<!-- 34445 end -->
			</div>
			</td>
		</tr>
	</table>
	
	<!-- 34445 start -->
	<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
		okAction="criteriaBackingBean.saveSupplierCriteriaDtls()"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.save.msg']}"/>
		
	<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
		okAction="criteriaBackingBean.saveSupplierCriteriaDtls()"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.update.msg']}"/>
	<!-- 34445 end -->
</ui:composition>
