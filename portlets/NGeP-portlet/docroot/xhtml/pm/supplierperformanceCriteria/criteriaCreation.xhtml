<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel header="#{lbl['lbl.pm.criteria.title']}" toggleable="true">
	<p:spacer height="10"></p:spacer>
			
	<table style="width:100%;">  
	  <tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.criteria.code']}" /></th>
					<td><p:inputText id="criteriaCode" styleClass="ppDisplayTextM"
							style="text-transform:uppercase" required="true" maxlength="10"
							disabled="true"
							value="#{criteriaBackingBean.managedBean.selectedCriteria.criteriaCode}"
							validatorMessage="#{lbl['lbl.pm.criteria.code']} - #{lbl['lbl.pm.uppercase']}"
							label="#{lbl['lbl.pm.criteria.code']}">

						</p:inputText> <p:message id="criteriaCodeMsg" for="criteriaCode" display="icon" />
					</td>
				</tr>
	
	    <tr>
					<!-- List of languages with description -->
					<th><p:outputLabel value="#{lbl['lbl.pm.criteria.name']}" /> <p:outputLabel
							value="* " styleClass="mandatory" /></th>
					<td><p:dataTable id="dtCriteriaDesc" styleClass="criteriaDescList"
							var="criteriaDesc"
							value="#{criteriaBackingBean.managedBean.selectedCriteria.pmCriteriaDescs}" sortBy="#{criteriaDesc.pmLanguage.languageName}">
							<p:column headerText="#{lbl['lbl.pm.settings.language']}"
								width="10%">  
								#{criteriaDesc.pmLanguage.languageName}
					        </p:column>
							<!-- 34445 Start -->
							<p:column headerText="* #{lbl['lbl.pm.criteria.name']}">
								<p:inputTextarea id="itCriteriaDesc" 
									value="#{criteriaDesc.criteria}" cols="50" rows="5"
									required="true" maxlength="50"
									label="#{lbl['lbl.pm.criteria.name']}" autoResize="false" />
								<p:message id="itCriteriaDescMsg" for="itCriteriaDesc"
									display="icon" />
							</p:column>
							<!-- 34445 End -->
						</p:dataTable></td>
				</tr>
	   
	    <tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.status']}" /> <p:outputLabel
							value="* " styleClass="mandatory" /></th>
					<td><p:selectOneMenu styleClass="ppDropDownWidthM"
							label="#{lbl['lbl.pm.status']}"
							disabled="#{criteriaBackingBean.managedBean.selectedCriteria.brandNew}"
							value="#{criteriaBackingBean.managedBean.selectedCriteria.recordStatusFlg}">
							<f:selectItems
								value="#{criteriaBackingBean.getStatusList()}" />
						</p:selectOneMenu></td>
				</tr>
	</table>
   </p:panel>	
   </ui:composition>
