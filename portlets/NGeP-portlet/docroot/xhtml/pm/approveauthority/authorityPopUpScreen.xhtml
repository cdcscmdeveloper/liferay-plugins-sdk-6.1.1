<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc" >

	<p:dialog id="updateCommitteeDialog" header="#{lbl['lbl.pm.approveAuthority.update']}" modal="true"
		widgetVar="updateCommitteeDialog" dynamic="true" width="900px" position="339,300" >
		<p:messages id="committeeMsgId" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error" />
		<p:panel id="updateCommitteePanel" toggleable="true">
			<h:panelGroup id="committeePopupPanel">
		 	<table>
		 		<tr>
		 			<td>
		 				<p:outputLabel value="*" styleClass="mandatory"/>
		 				<h:outputLabel value="#{lbl['lbl.pm.approveAuthority.name']}" />
		 			</td>
		 			<td>
		 				<p:inputText id="comName" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.approveAuthority.name']}" maxlength="150" size="50"
							value="#{ApproveAuthorityBackingBean.managedBean.updateAuthCommittee.committeeName}" />
						<ac:iconTooltip value="#{lbl['lbl.pm.approveAuthority.tooltip']}" />
		 			</td>
		 		</tr>
		 		<tr>
		 			<td>
		 				<p:outputLabel value="*" styleClass="mandatory" />
		 				<h:outputLabel value="#{lbl['lbl.pm.approveAuthority.status']}" />
		 			</td>
		 			<td>
		 				<p:selectOneMenu style="width:278px;margin-bottom:5px;"
							value="#{ApproveAuthorityBackingBean.managedBean.updateAuthCommittee.recordStatusFlg}">
							<f:selectItems value="#{ApproveAuthorityBackingBean.getResultStatusList()}" />
						</p:selectOneMenu>
		 			</td>
		 		</tr>
		 		<tr>
		 			<td>
		 				<p:outputLabel value="*" styleClass="mandatory" />
		 				<h:outputLabel value="#{lbl['lbl.pm.approveAuthority.remark']}" />
		 			</td>
		 			<td>
		 				<p:inputTextarea id="remark" label="#{lbl['lbl.pm.approveAuthority.remark']}"
							value="#{ApproveAuthorityBackingBean.managedBean.remark}"
							cols="100" rows="8" maxlength="1000" autoResize="false" styleClass="ui-inputtextarea">
						</p:inputTextarea>
		 			</td>
		 		</tr>
		 		<tr>
		 			<td colspan="2" style="text-align: right;">
			 			<div class="ppRightBtn">
			 				<!-- 34445 start -->
							<p:commandButton id="comSaveButton"
				                 value="#{lbl['lbl.pm.approveAuthority.save']}"
				                 process="@form"
				                 oncomplete="updateCommitteePopupBlockWidget.hide(); if (!args.validationFailed) saveAprvAuthInfoDlg.show();" />
							<!-- 34445 end -->

							<p:commandButton id="comCancel"
								value="#{lbl['lbl.btn.cancel']}" process="@this"
								immediate="true"
								action="#{ApproveAuthorityBackingBean.closePopup()}"
								update="updateCommitteePanel"
								resetValues="true"
								onclick="updateCommitteePopupBlockWidget.hide();updateCommitteeDialog.hide();" />	
						</div>
					</td>
		 		</tr>
		 	</table>
	 	</h:panelGroup>
	 </p:panel>
	</p:dialog>

	<!-- 34445 start -->
	<ac:confirmationPopupSM id="saveAuthInfoDlg" widget="saveAuthInfoDlg"
		okAction="ApproveAuthorityBackingBean.saveNewCommittee"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.save.msg']}"
		update=":form:listAuthTbl, :form:committeeMsgId" />

	<ac:confirmationPopupSM id="saveAprvAuthInfoDlg" widget="saveAprvAuthInfoDlg"
		okAction="ApproveAuthorityBackingBean.updateAuthCommittee"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.save.msg']}"
		update=":form:listAuthTbl" />
 	<!-- 34445 end -->
</ui:composition>
