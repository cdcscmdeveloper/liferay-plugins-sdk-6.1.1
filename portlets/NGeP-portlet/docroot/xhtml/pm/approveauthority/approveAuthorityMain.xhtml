<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />			
 		<p:tabView orientation="left" dynamic="true"
			value="#{ApproveAuthorityBackingBean.managedBean.listAuthCode}"
			var="varAuthMenu" cache="false">
			<p:ajax event="tabChange" listener="#{ApproveAuthorityBackingBean.loadCommitteeList}" update="authMenu"></p:ajax>
			<p:tab id="authMenu" title="#{varAuthMenu.authCodeDesc}" style="height:30%;white-space: normal !important;">
				<ui:include src="/xhtml/pm/approveauthority/approveAuthorityDetails.xhtml"></ui:include>
			</p:tab>
		</p:tabView>
	</ui:define>
</ui:composition>
