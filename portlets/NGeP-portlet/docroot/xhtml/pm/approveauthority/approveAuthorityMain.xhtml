<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<table style="border:0; cellspacing:0; cellpadding:0; width:100%;">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu styleClass="sidemenu" id="tApproveAuth" activeIndex="#{ApproveAuthorityBackingBean.managedBean.selectedTabIndex}">
						<p:menuitem style="white-space:normal;" 
						value="#{ApproveAuthorityBackingBean.managedBean.authIdInString == 1 ? 
						ApproveAuthorityBackingBean.managedBean.authCodeDesc : lbl['lbl.pm.approveAuthority.desc1']}" 
							action="#{ApproveAuthorityBackingBean.updateJawatankuasaPerolehanDetail()}" update="@form">
							<f:setPropertyActionListener target="#{ApproveAuthorityBackingBean.managedBean.selectedTabIndex}" 
											value="#{ApproveAuthorityBackingBean.jawatankuasaPerolehan}" />
						</p:menuitem>
						<p:menuitem style="white-space:normal;" 
						value="#{ApproveAuthorityBackingBean.managedBean.authIdInString == 2 ? 
						ApproveAuthorityBackingBean.managedBean.authCodeDesc : lbl['lbl.pm.approveAuthority.desc2']}" 
							action="#{ApproveAuthorityBackingBean.updatePengurusanTertinggiDetail()}" update="@form">
							<f:setPropertyActionListener target="#{ApproveAuthorityBackingBean.managedBean.selectedTabIndex}" 
											value="#{ApproveAuthorityBackingBean.pengurusanTertinggi}" />										
						</p:menuitem>
					</p:tabMenu>
				</td>
				<td style="width:80%;vertical-align:top;">
					<p:outputPanel id="committeeList">
						<ui:include src="/xhtml/pm/approveauthority/approveAuthorityDetails.xhtml"></ui:include>
					</p:outputPanel>
				</td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
