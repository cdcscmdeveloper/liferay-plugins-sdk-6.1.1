<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<ui:define name="contentSection">
	
		<!-- Validation Message -->
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<!-- Search User -->
		<p:outputPanel id="opSearchAll">
			<br/>
			<table class="ppTwoTable">
				<tr>
					<th width="20%">
						<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.loginid']}"/>
					</th>
					<td>
						<p:inputText styleClass="ppDisplayTextM" value="#{searchAllUserBackingBean.managedBean.loginId}" maxlength="75"/>
					</td>
					<th>&#160;</th>
					<td>&#160;</td>
				</tr>
				<tr>
					<td colspan="4">
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.search']}" 
								widgetVar="cbSearchAll" id="cbSearchAll"
				  				onclick="cbSearchAll.disable()"  oncomplete="cbSearchAll.enable()" process="opSearchAll"
								action="#{searchAllUserBackingBean.tempSearchUserProfile()}"
								update="opSearchAllResult" />
					  	</div>
					</td>
				</tr>
			</table>
		</p:outputPanel>
		<p:outputPanel id="opSearchAllResult">			
			<br/>
			<!-- User Roles -->
			<table class="ppTwoTable">
				<tr>
					<th width="30%">
						<div class="screen-title">
							Result Login ID: 
						</div>
					</th>
					<td>
						<div class="screen-title">
							#{searchAllUserBackingBean.managedBean.resultLoginId}
						</div>
					</td>
				</tr>
			</table>
			
			<!-- User Status Result -->
			<p:dataTable id="dtUserStatusResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
					value="#{searchAllUserBackingBean.managedBean.resultStatus}"
					var="result">
					<p:column headerText="PM" width="15%">
						#{result[0]}
					</p:column>
					<p:column headerText="LIFERAY" width="15%">
						#{result[1]}
					</p:column>
					<p:column headerText="OIM" width="15%">
						#{result[2]}
					</p:column>
			</p:dataTable>
 			<br/>
 			<br/>
 			<!-- User Roles -->
			<table class="ppTwoTable">
				<tr>
					<th width="30%">
						<div class="screen-title">
							PM
						</div>
					</th>
					<th width="30%">
						<div class="screen-title">
							Liferay
						</div>
					</th>
					<th width="30%">
						<div class="screen-title">
							OIM
						</div>
					</th>
				</tr>
				<tr>
					<td width="30%">
						<p:dataTable id="dtUserPmRoleResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
							value="#{searchAllUserBackingBean.managedBean.pmRoleList}"
							var="result">
							<p:column headerText="Role Name" width="15%">
								#{result}
							</p:column>
						</p:dataTable>
					</td>
					<td width="30%">
						<p:dataTable id="dtUserLfRoleResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
							value="#{searchAllUserBackingBean.managedBean.liferayRoleList}"
							var="result">
							<p:column headerText="Role Name" width="15%">
								#{result}
							</p:column>
						</p:dataTable>
						
					</td>
					<td width="30%">
						<p:dataTable id="dtUserOimRoleResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
							value="#{searchAllUserBackingBean.managedBean.oimRoleList}"
							var="result">
							<p:column headerText="Role Name" width="15%">
								#{result}
							</p:column>
						</p:dataTable>
					</td>
				</tr>
			</table>
			<br/>
			<br/>
	 	</p:outputPanel>
	 	<ui:remove>
	 		<p:panel id="pProMngSearch" header="#{lbl['lbl.pm.search.user']}" toggleable="true">
			<br/>
			<!-- User Search -->
	    	<ui:include src="/xhtml/pm/searchAllUser/tempDefinedSearch.xhtml" />
			<br/>
			</p:panel>
			<!-- User Result -->
			<ui:include src="/xhtml/pm/searchAllUser/tempUserResult.xhtml" />
		</ui:remove>
	</ui:define>
</ui:composition>
