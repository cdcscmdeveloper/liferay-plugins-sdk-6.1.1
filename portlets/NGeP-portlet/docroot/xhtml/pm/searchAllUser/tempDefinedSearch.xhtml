<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opDefinedSearch">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></th>
				<td><p:outputPanel id="somType"><p:selectOneMenu id="somOrgType" 						
						styleClass="ppDropDownWidthL" required="true" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;"
						value="#{searchAllUserBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{searchAllUserBackingBean.getOrgTypeDropdownValues()}" />
							<p:ajax event="change" listener="#{searchAllUserBackingBean.clearOrgNameAndRoleLovSearchFields()}" 
				     		update=":form:opDefinedSearch"/> 
					</p:selectOneMenu>
					</p:outputPanel></td>
			
			</tr>
			<tr>
					
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.search.orgname']}"/><p:outputLabel
								value="*" styleClass="mandatory" /></th>
							
				<td>
				<p:outputPanel id="opFfcOrgCode" rendered="#{ParameterConst.orgTypeFactoring eq searchAllUserBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <ac:lov id="lovFfcOrg" lovId="PM_ORG_PROFILE_FFC" size="29" 
				    	required="true" 
		            	update=":form:opDefinedSearch" 
		            	readonly="true" disabled="#{searchAllUserBackingBean.managedBean.selectedOrgType.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{searchAllUserBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.finOrgName}" 
						postUpdateListener="searchAllUserBackingBean.updateSearchCriteriaForOrgName"
						saveObject="searchAllUserBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{searchAllUserBackingBean.constructConditionFields()}" />
						<p:message id="lovFfcOrgMsg" for="lovFfcOrg" display="icon" />
				</p:outputPanel>
				<p:outputPanel id="opSupOrgCode" rendered="#{ParameterConst.orgTypeSupplier eq searchAllUserBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <ac:lov id="lovSupOrg" lovId="PM_ORG_PROFILE_WITH_SUPPLIER" size="29" 
				    	required="true" 
		            	update=":form:opDefinedSearch" 
		            	readonly="true" disabled="#{searchAllUserBackingBean.managedBean.selectedOrgType.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{searchAllUserBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}" 
						postUpdateListener="searchAllUserBackingBean.updateSearchCriteriaForOrgName"
						saveObject="searchAllUserBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{searchAllUserBackingBean.constructConditionFields()}" />
						<p:message id="lovSupOrgMsg" for="lovSupOrg" display="icon" />
				</p:outputPanel>
				<p:outputPanel id="opOrgCode" rendered="#{ParameterConst.orgTypeFactoring ne searchAllUserBackingBean.managedBean.selectedOrgType.parameterCode and ParameterConst.orgTypeSupplier ne searchAllUserBackingBean.managedBean.selectedOrgType.parameterCode}">
				   <ac:lov id="lovMinistry1" lovId="PM_ORG_PROFILE" size="29" required="true"
			        	disabled="#{searchAllUserBackingBean.managedBean.selectedOrgType.parameterId==null}"
		            	update=":form:opDefinedSearch" readonly="true"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{searchAllUserBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}" 
						saveObject="searchAllUserBackingBean.managedBean.selectedOrgProfile"
						postUpdateListener="searchAllUserBackingBean.updateSearchCriteriaForOrgName"
						conditionField="#{searchAllUserBackingBean.constructConditionFields()}"/>						
		         	<p:message id="lovMinistryMsg" for="lovMinistry1" display="icon" />
				</p:outputPanel>
				
			</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM"  maxlength="12" value="#{searchAllUserBackingBean.managedBean.userProfileSearchBean.identificationNo}"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.name']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" value="#{searchAllUserBackingBean.managedBean.userProfileSearchBean.userName}" maxlength="100"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.loginid']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" value="#{searchAllUserBackingBean.managedBean.userProfileSearchBean.loginId}" maxlength="100"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
				<tr>
				<th width="20%">
					<p:outputLabel value="User Status"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{searchAllUserBackingBean.managedBean.userProfileSearchBean.userStatus}">  
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="20%">
					<p:outputLabel value="User Org Status"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{searchAllUserBackingBean.managedBean.userProfileSearchBean.userOrgStatus}">  
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" action="#{searchAllUserBackingBean.searchUserProfile}"
							update=":form:dtUserAllStatusResult" />
				        <p:commandButton value="#{lbl['lbl.btn.reset']}"  update=":form:opDefinedSearch, :form:dtUserAllStatusResult" 
				           	action="#{searchAllUserBackingBean.resetUserProfileSearchBean}"/>
				  	</div>
				</td>
			</tr>
		</table>
		  <ac:lovPopup />
 	</p:outputPanel>
</ui:composition>
