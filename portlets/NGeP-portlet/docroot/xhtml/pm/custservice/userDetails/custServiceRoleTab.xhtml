<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="opRoleTab">
		<p:dataTable id="dtCustSvcRole" var="role" rows="5"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{custServiceBackingBean.managedBean.selectedRoleList}"
			rowIndexVar="index">
			<ac:paginator for="dtCustSvcRole" />

			<p:column headerText="#{lbl['lbl.pm.state.seq.no']}"
				style="width :10%;white-space : normal;text-align:center;">
				#{index + 1}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}"
				width="60%">
			     #{custServiceBackingBean.getRoleDescByRoleCode(role.pmRole.roleCode)}
			 </p:column>

			<p:column
				headerText="#{lbl['lbl.pm.status']}"
				style="width:30%;text-align:center;">
						#{(role.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
			    </p:column>
		</p:dataTable>
	</p:outputPanel>
</ui:composition>
