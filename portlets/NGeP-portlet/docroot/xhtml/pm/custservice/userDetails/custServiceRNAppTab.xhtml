<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="opRNAppTab">
		<p:dataTable id="dtRNUserGroup" var="rnUsergroup" rows="5"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{custServiceBackingBean.managedBean.rnUserGroups}"
			rowIndexVar="rnIndex">
			<ac:paginator for="dtRNUserGroup" />

			<p:column headerText="#{lbl['lbl.pm.state.seq.no']}"
				style="width :6%;white-space : normal;text-align:center;">
				#{rnIndex + 1}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.ug.result.groupname']}"
				width="60%">
			     #{rnUsergroup.groupName}
			 </p:column>

		</p:dataTable>
	</p:outputPanel>
</ui:composition>
