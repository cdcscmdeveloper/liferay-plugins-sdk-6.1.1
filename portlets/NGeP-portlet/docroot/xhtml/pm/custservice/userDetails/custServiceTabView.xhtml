<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:outputPanel id="opCustServiceTab">
		<p:tabView id="tvCustService" widgetVar="tvCustService"
			dynamic="false" cache="false" orientation="top"
			activeIndex="#{custServiceBackingBean.managedBean.tabActiveIndex}">
			<p:tab id="tRole" title="#{lbl['lbl.pm.profiles.search.role']}">
				<ui:include src="/xhtml/pm/custservice/userDetails/custServiceRoleTab.xhtml" />
			</p:tab>
			<p:tab id="tFLApproverGroup"
				title="#{lbl['lbl.pm.custsvc.fl.app.group']}"
				disabled="#{empty custServiceBackingBean.managedBean.flUserGroups ? 'true':'false'}" >
				<ui:include src="/xhtml/pm/custservice/userDetails/custServiceFLAppTab.xhtml" />
			</p:tab>		
			<p:tab title="#{lbl['lbl.pm.custsvc.rn.app.group']}"
				id="tRNApproverGroup"
				disabled="#{empty custServiceBackingBean.managedBean.rnUserGroups ? 'true':'false'}">
				<ui:include src="/xhtml/pm/custservice/userDetails/custServiceRNAppTab.xhtml" />
			</p:tab>
		</p:tabView>

	</p:outputPanel>

</ui:composition>
