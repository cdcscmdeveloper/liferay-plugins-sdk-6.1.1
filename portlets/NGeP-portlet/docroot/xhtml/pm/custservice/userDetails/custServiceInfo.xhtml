<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table width="1100px">
		<tr>
			<th width="20%"><p:outputLabel
					value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /></th>

			<td style="width: 165px;"><p:inputText size="40" disabled="true"
					maxlength="15"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmUser.identificationNo}" /></td>
			<td style="width: 86px;"><p:outputLabel
					value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" /></td>
			<td style="width: 165px;"><p:inputText size="40" disabled="true"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmUser.loginId}" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pm.profiles.search.name']}" /></td>
			<td colspan="3"><p:inputText size="111" disabled="true"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmUser.userName}"
					maxlength="70" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>
		<tr>
			<th style="vertical-align: top;"><p:outputLabel
					value="#{lbl['lbl.pm.ucd.organization']}" /></th>
			<td colspan="3"><p:inputTextarea id="orgName" disabled="true"
					label="#{lbl['lbl.pm.ucd.organization']}"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmOrgProfile.pmOrgValidity.orgName}"
					rendered="#{custServiceBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterCode !='SUP'}"
					rows="3" cols="113" maxlength="255" />
			<p:inputTextarea id="orgName1" disabled="true" 
					label="#{lbl['lbl.pm.ucd.organization']}"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmOrgProfile.smSupplier.companyName}"
					rendered="#{custServiceBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterCode =='SUP'}"
					rows="3" cols="113" maxlength="255" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.profiles.userdetails.designation']}" /></td>
			<td colspan="3"><p:inputText size="111" disabled="true"
					style="margin-top: 5px;"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmUser.designation}"
					maxlength="80" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>

		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.profiles.userdetails.email']}"
				 /></td>
			<td colspan="3"><p:inputText size="111"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmUser.email}"
					rendered="#{custServiceBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterCode =='SUP'}"
					maxlength="80" validatorMessage="#{lbl['lbl.pm.profiles.invalidEmail']}">
					<f:validateRegex disabled="#{empty param['disableValidation']}"
									pattern="^[_'A-Za-z0-9-\+]+(\.[_'A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText>
							<p:inputText size="111"
					value="#{custServiceBackingBean.managedBean.selectedUserOrg.pmUser.email}"
					rendered="#{custServiceBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterCode !='SUP'}"
					maxlength="80" validatorMessage="#{lbl['lbl.pm.profiles.invalidEmail']}"
					disabled="true">
					<f:validateRegex disabled="#{empty param['disableValidation']}"
									pattern="^[_'A-Za-z0-9-\+]+(\.[_'A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText></td>
		</tr>
		<tr>
			<th width="20%"><p:outputLabel
					value="#{lbl['lbl.fl.ptj.approver.group']}" /></th>
			<td><p:selectBooleanCheckbox style="float:left;margin-top:10px;"
					id="flApproverBcb" disabled="true"
					value="#{empty custServiceBackingBean.managedBean.flUserGroups ? 'false':'true'}" />
				<p:outputLabel
					style="float:left;margin-left:10px;font-weight:normal !important;margin-top:10px;"
					value="#{custServiceBackingBean.getRoleDescByRoleCode(ProfileManagementConst.flApprover)}" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>
		<tr>
			<th width="20%"></th>
			<td><p:selectBooleanCheckbox style="float:left;"
					id="rnApproverBcb" disabled="true"
					value="#{empty custServiceBackingBean.managedBean.rnUserGroups ? 'false':'true'}" />
				<p:outputLabel
					style="float:left;margin-left:10px;font-weight:normal !important;"
					value="#{custServiceBackingBean.getRoleDescByRoleCode(ProfileManagementConst.rnApprover)}" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>
		<tr>
			<th width="20%"><p:outputLabel
					value="#{lbl['lbl.pm.profiles.search.user.status']}" /></th>
			<td><p:inputText size="38" disabled="true" maxlength="15"
					value="#{(custServiceBackingBean.managedBean.selectedUserOrg.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}" /></td>
			<th>&#160;</th>
			<td>&#160;</td>
		</tr>
	</table>
	<br />
</ui:composition>
