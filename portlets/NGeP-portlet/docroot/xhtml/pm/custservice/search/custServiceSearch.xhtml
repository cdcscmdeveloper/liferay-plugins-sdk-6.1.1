<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="isPTJOrgType"
		value="#{ParameterConst.orgTypePtj eq custServiceBackingBean.managedBean.selectedOrgTypeParam.parameterCode}" />
	<ui:param name="isKPTJOrgType"
		value="#{ParameterConst.orgTypePtjGroup eq custServiceBackingBean.managedBean.selectedOrgTypeParam.parameterCode}" />
	<ui:param name="isSUPOrgType"
		value="#{ParameterConst.orgTypeSupplier eq custServiceBackingBean.managedBean.selectedOrgTypeParam.parameterCode}" />
	<p:panel id="custServicePnl" header="#{lbl['lbl.pm.search']}"
		toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /></th>
				<td><p:selectOneMenu id="somCustServiceOrgType"
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.organisation.orgType']}"
						style="margin-bottom: 5px;"
						value="#{custServiceBackingBean.managedBean.searchBean.selectedOrgType}">
						<f:selectItems
							value="#{custServiceBackingBean.getOrgTypeDropdownValues()}" />
						<p:ajax event="change"
							listener="#{custServiceBackingBean.changeOrgType()}"
							update="@form" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td><h:panelGroup id="orgNamePanel1">
						<p:outputLabel rendered="#{not isSUPOrgType}"
							value="#{lbl['lbl.pm.organisation.orgCode']}" />
						<p:outputLabel rendered="#{isSUPOrgType}"
							value="#{lbl['lbl.pm.organisation.orgName']}" />
					</h:panelGroup></td>
				<td>
					<div style="display: inline-block;">
						<h:panelGroup id="orgProfilePG">
							<ui:fragment rendered="#{isPTJOrgType or isKPTJOrgType}">
								<h:panelGroup id="lovResOrg">
									<p:inputText size="38" id="itSelectedPtj"
										value="#{custServiceBackingBean.managedBean.searchBean.selectedOrgProfile.pmOrgValidity.orgCode}"
										readonly="true" />
									&#160;	
									<p:commandLink id="ptjSearchCL" partialSubmit="true"
										disabled="#{empty custServiceBackingBean.managedBean.searchBean.selectedOrgType}"
										process="@this" update=":form:orgProfileCcId:ptjPopup"
										action="#{organisationSearchBackingBean.initPtjPopup}"
										oncomplete="ptjPopup.show();">
										<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
									</p:commandLink>
								</h:panelGroup>
							</ui:fragment>
							<ui:fragment
								rendered="#{not isPTJOrgType and not isKPTJOrgType and not isSUPOrgType}">
								<ac:lov id="lovOtherOrg" lovId="PM_ORG_PROFILE" size="38"
									label="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
									update=":form:orgProfilePG,:form:itOrgName"
									disabled="#{empty custServiceBackingBean.managedBean.searchBean.selectedOrgType}"
									headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
									value="#{custServiceBackingBean.managedBean.searchBean.selectedOrgProfile.pmOrgValidity.orgCode}"
									saveObject="custServiceBackingBean.managedBean.searchBean.selectedOrgProfile"
									conditionField="#{custServiceBackingBean.constructConditionFields()}"
									readonly="true" />
							</ui:fragment>
							<ui:fragment
								rendered="#{not isPTJOrgType and not isKPTJOrgType and isSUPOrgType}">
								<ac:lov id="lovSupOrg" lovId="PM_ORG_PROFILE_WITH_SUPPLIER"
									size="98"
									label="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
									update=":form:orgProfilePG,:form:itOrgName"
									disabled="#{empty custServiceBackingBean.managedBean.searchBean.selectedOrgType}"
									headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
									value="#{custServiceBackingBean.managedBean.searchBean.selectedOrgProfile.smSupplier.companyName}"
									postUpdateListener="custServiceBackingBean.updateSearchCriteriaForOrgName"
									saveObject="custServiceBackingBean.managedBean.searchBean.selectedOrgProfile"
									conditionField="#{custServiceBackingBean.constructConditionFields()}"
									readonly="true" />
							</ui:fragment>
						</h:panelGroup>
					</div>

				</td>

			</tr>
			<tr>
				<td><h:panelGroup id="orgNamePanel2">
						<p:outputLabel rendered="#{not isSUPOrgType}"
							value="#{lbl['lbl.pm.organisation.orgName']}" />

					</h:panelGroup></td>
				<td><h:panelGroup id="orgNamePanel3">
						<p:inputText styleClass="ppDisplayTextM" size="103"
							disabled="true" id="itOrgName"
							value="#{custServiceBackingBean.managedBean.searchBean.selectedOrgProfile.pmOrgValidity.orgName}"
							maxlength="80" rendered="#{not isSUPOrgType}" />
					</h:panelGroup></td>
			</tr>

			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.profiles.search.name']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" size="103"
						value="#{custServiceBackingBean.managedBean.searchBean.userName}"
						maxlength="80" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" size="38"
						maxlength="15"
						value="#{custServiceBackingBean.managedBean.searchBean.identificationNo}" />
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>

			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{custServiceBackingBean.searchUser}" update="custSvcTb"
							process="custServicePnl" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
							<f:param name="disableValidation" value="true" />
						</p:commandButton>

						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							partialSubmit="true" process="@this"
							update="custServicePnl,:form:custSvcTb"
							action="#{custServiceBackingBean.resetUserDataModel}" />
					</div>

				</td>
			</tr>
		</table>
		<ac:ptjPopup id="orgProfileCcId"
			orgTypeParamCode="#{custServiceBackingBean.managedBean.selectedOrgTypeParam.parameterCode}"
			okAction="custServiceBackingBean.selectPtjAction"
			update=":form:orgProfilePG,:form:itOrgName" />
	</p:panel>
	<ac:lovPopup />

</ui:composition>
