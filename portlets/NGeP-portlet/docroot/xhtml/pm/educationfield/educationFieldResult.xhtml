<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="educationResult" header="#{lbl['lbl.pm.sa.result']}"
		toggleable="true">
		<p:dataTable id="educationSR"
			value="#{educationBackingBean.educationFieldDataModel}" rows="10"
			var="educationList" rowIndexVar="index" lazy="true">
			<ac:paginator for="educationSR" />

			<p:column headerText="#{lbl['lbl.pm.ef.code']}" style="width:20%;">
				<h:outputText value="#{educationList.fieldCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.ef.name']}">
				<h:outputText value="#{educationList.fieldName}" style="width:60%;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:15%;"> 
     	 #{(educationList.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}                 
       </p:column>

			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;">
				<p:commandLink
					action="#{educationBackingBean.goToMaintaincePage(educationList)}"
					process="@this" partialSubmit="true">
					<p:graphicImage library="ep/images/design" 
						value="/css/images/design/edit.png" />						
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}"
			action="#{educationBackingBean.createEducation}" />
	</div>
</ui:composition>
