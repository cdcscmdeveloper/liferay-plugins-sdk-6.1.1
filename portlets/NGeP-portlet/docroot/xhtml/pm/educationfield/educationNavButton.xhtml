<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<table style="width: 100%">
		<tr>
			<td>
				<div align="left" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{educationBackingBean.redirectEduSearch()}"
						style="float:left;" process="@this" />
				</div>
			</td>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton
						value="#{educationBackingBean.managedBean.pmEduField.brandNew? lbl['lbl.btn.save'] : lbl['lbl.btn.update']}"
						action="#{educationBackingBean.saveEducationDtls}"
						style="float:right;" />
				</div>
			</td>
		</tr>
	</table>
</ui:composition>
