<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.pm.edu.name']}" toggleable="true"
		id="eduFieldId">
		<p:spacer height="10"></p:spacer>
		<table>
			<!-- 12852 Start -->
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ef.code']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="text-transform:uppercase;width:40%" required="true" label="#{lbl['lbl.pm.ef.code']}"
						value="#{educationBackingBean.managedBean.pmEduField.fieldCode}"
						disabled="#{!educationBackingBean.managedBean.pmEduField.brandNew}"
						size="30" maxlength="10">
						<f:validateLength minimum="3" />
					</p:inputText></td>
			</tr>
			<!-- 12852 End -->
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ef.fname']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText
						value="#{educationBackingBean.managedBean.pmEduField.fieldName}"
						size="30" maxlength="100" /></td>
			</tr>
			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.pm.search.status']}" /> <p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td><p:selectOneMenu style="width:178px;margin-bottom:5px;"
						required="true" label="#{lbl['lbl.pm.search.status']}"
						value="#{educationBackingBean.managedBean.pmEduField.recordStatusFlg}"
						disabled="#{educationBackingBean.managedBean.pmEduField.brandNew}">
						<f:selectItems
							value="#{educationBackingBean.getPmEducationStatusList()}"></f:selectItems>
						<p:ajax event="change" process="@form" partialSubmit="true"
							update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	<ui:remove>
		<p:panel header="Education Field Restriction" toggleable="true">
			<ac:lovPopup />
			<p:dataTable id="educationfieldres"
				selection="#{educationBackingBean.managedBean.eduRestrDeleteList}"
				rowKey="#{eduFieldRes}"
				value="#{educationBackingBean.managedBean.eduRestrList}"
				var="eduFieldRes">

				<ac:paginator for="educationfieldres" />

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.pm.ef.catcode']}" style="width:28%">
					<h:outputText value="#{eduFieldRes.pmCategoryL3.categoryL3Code}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.ef.catname']}" style="width:50%">
					<h:outputText value="#{eduFieldRes.pmCategoryL3.categoryName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.search.status']}"
					style="width:20%">
					<p:selectOneMenu style="width:178px;"
						value="#{eduFieldRes.recordStatusFlg}">
						<f:selectItems
							value="#{educationBackingBean.getPmEducationStatusList()}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>

			</p:dataTable>
			
			<div>
				<table style="width: 100%">
					<tr>
						<td class="TableFieldLeft" width="80%"></td>
						<td>
							<table>
								<tr>
									<td class="TableFieldLeft"><ac:lov id="lovCategory"
											lovId="PM_CATEGORY_L3_EDU" headerText="Category Lov"
											buttonLabel="#{lbl['lbl.btn.add']}" buttonIcon="ui-icon-add"
											selectionMode="multiple"
											saveObject="educationBackingBean.managedBean.eduRestrSelectList"
											postUpdateListener="educationBackingBean.addEducationList(educationBackingBean.managedBean.eduRestrSelectList)"
											update="@form" /></td>
									<td><p:commandButton value="#{lbl['lbl.btn.delete']}"
											action="#{educationBackingBean.deleteEducationList}"
											update="@form" /></td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			</div>
		</p:panel>
	</ui:remove>

</ui:composition>
