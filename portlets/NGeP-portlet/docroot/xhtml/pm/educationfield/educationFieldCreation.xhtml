<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<style>
.ui-state-hover
	{
	text-decoration: none;
    }
</style>	
		
   <p:panel header="Education Field" toggleable="true" >
	<p:spacer height="10"></p:spacer>
		
	<table style="width:100%;">
	   <p:spacer height="5"></p:spacer>
	  <tr>	  	
		<td style="width:10%;"><p:outputLabel value="#{lbl['lbl.pm.ef.code']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{educationBackingBean.managedBean.pmEduField.fieldCode}" 
			  size="30" maxlength="10" />
		</td>
	  </tr>	
	  <tr>	  	
		<td><p:outputLabel value="#{lbl['lbl.pm.ef.fname']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{educationBackingBean.managedBean.pmEduField.fieldName}"
			 size="30" maxlength="100" />
		</td>
	  </tr>		  
		<p:spacer height="5"></p:spacer>
	   <tr> 
		<td><p:outputLabel value="#{lbl['lbl.pm.search.status']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;"
     			value="#{educationBackingBean.managedBean.pmEduField.recordStatusFlg}" >
     	       <f:selectItems value="#{educationBackingBean.getEducationStatusList()}"></f:selectItems> 	 	    	
  	        </p:selectOneMenu></td>				
	    </tr>	    	    
	</table>
	<p:spacer height="50"></p:spacer>	
   </p:panel>
   
	<p:panel header="Education Field Restriction" toggleable="true">
	<ac:lovPopup />
	<p:dataTable id="educationfieldres" 
		selection="#{educationBackingBean.managedBean.eduRestrDeleteList}" rowKey="#{eduFieldRes}"
		value="#{educationBackingBean.managedBean.eduRestrList}" var="eduFieldRes">
		
	<ac:paginator for="educationfieldres" />
		
	   <p:column selectionMode="multiple" style="width:2%" /> 
		  	  	         
       <p:column headerText="#{lbl['lbl.pm.ef.catcode']}" style="width:28%">
		 <h:outputText value="#{eduFieldRes.pmCategoryL3.categoryL3Code}" />	
       </p:column>  
       
       <p:column headerText="#{lbl['lbl.pm.ef.catname']}" style="width:50%"> 
		 <h:outputText value="#{eduFieldRes.pmCategoryL3.categoryName}" />
       </p:column> 

       <p:column headerText="#{lbl['lbl.pm.search.status']}" style="width:20%"> 
		 <p:selectOneMenu style="width:178px;" value="#{eduFieldRes.recordStatusFlg}">
     	    <f:selectItems value="#{educationBackingBean.getEducationStatusList()}"></f:selectItems> 	 	    	
  	     </p:selectOneMenu>
       </p:column>            
       
     </p:dataTable>
	<p:spacer height="15"></p:spacer>
	
	<div>
		<table style="width: 100%">
			<tr>
			  <td class="TableFieldLeft" width="80%"></td>
			  <td>
				<table>
				    <tr>
				    <td class="TableFieldLeft">
				      <ac:lov id="lovCategory" lovId="PM_CATEGORY_L3"
            		     headerText="Category Lov" buttonLabel="#{lbl['lbl.btn.add']}"
	       				 buttonIcon="ui-icon-add" selectionMode="multiple"
	        			 saveObject="educationBackingBean.managedBean.eduRestrSelectList"
	        			 postUpdateListener="educationBackingBean.addEducationList(educationBackingBean.managedBean.eduRestrSelectList)"
	        			 update="@form" /></td>
					<td><p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" 
						 action="#{educationBackingBean.deleteEducationList}"
						 update="@form"/></td>
					</tr>
				</table>
			</td>
		 </tr>
	  </table>
			</div>    
   </p:panel>   	
</ui:composition>
