<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
		
   <p:panel header="EDUCATION FIELD" toggleable="true" styleClass="noBorders tr,noBorders td" >
	<p:spacer height="10"></p:spacer>
		
	<table style="width:100%;">
	  <tr>	  	
		<td style="width:10%;"><p:outputLabel value="#{lbl['lbl.pm.ef.code']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{educationBackingBean.managedBean.pmEduField.fieldCode}" size="30" /></td>
	  </tr>	
	  <tr>	  	
		<td><p:outputLabel value="#{lbl['lbl.pm.ef.fname']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{educationBackingBean.managedBean.pmEduField.fieldName}" size="50" /></td>
	  </tr>		  
		<p:spacer height="5"></p:spacer>
	   <tr> 
		<td><p:outputLabel value="#{lbl['lbl.pm.search.status']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;"
     			value="#{educationBackingBean.managedBean.pmEduField.recordStatusFlg}" >
     	       <f:selectItems value="#{educationBackingBean.getEducationStatusList()}"></f:selectItems> 	 	    	
  	        </p:selectOneMenu></td>				
	    </tr>	    	    
	</table>
	<p:spacer height="50"></p:spacer>	
   </p:panel>
   
	<p:panel header="EDUCATION FIELD RESTRICTION" toggleable="true">
	<ac:lovPopup />
	<p:dataTable 
		value="educationBackingBean.managedBean.categoryList"
		id="educationfieldres" var="eduFieldRes">
	 <ac:paginator for="educationfieldres" />
		  	  	         
       <p:column headerText="#{lbl['lbl.pm.ef.catcode']}" > 
	
       </p:column>  
       
       <p:column headerText="#{lbl['lbl.pm.ef.catname']}" > 

       </p:column> 

       <p:column headerText="#{lbl['lbl.pm.search.status']}" > 
          <h:outputText />
       </p:column>            
       
     </p:dataTable>
	<p:spacer height="15"></p:spacer>
	
	<div>
		<table style="width: 100%">
			<tr>
			  <td class="TableFieldLeft" width="80%"></td>
			  <td>
				<table>
				    <tr>
				    <td class="TableFieldLeft">
				      <ac:lov id="educate" lovId="PM_CATEGORY_L3"
            		     headerText="Category No Lov" buttonLabel="Add"
	       				 buttonIcon="ui-icon-add" selectionMode="multiple"
	        			 saveObject="educationBackingBean.managedBean.categoryList"
	        			 update="@form" /></td>
					<td><p:commandButton value="#{lbl['lbl.sc.action.delete']}" icon="ui-icon-delete" /></td>
					</tr>
				</table>
			</td>
		 </tr>
	  </table>
			</div>    
   </p:panel>   	
</ui:composition>
