<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="educationSearch" header="#{lbl['lbl.pm.sa.search']}"
		toggleable="true">

		<table class="ppTwoTable">
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.ef.code']}"></h:outputLabel></th>
				<td><p:inputText
						value="#{educationBackingBean.managedBean.fieldCodes}" size="30" maxlength="10"/></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.ef.fname']}"></h:outputLabel></th>
				<td><p:inputText
						value="#{educationBackingBean.managedBean.fieldNames}" size="30" maxlength="100"/></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><panelGroup style="float: right"><h:outputLabel
						value="#{lbl['lbl.pm.search.status']}"></h:outputLabel></panelGroup></th>
				<td><p:selectOneMenu style="width:205px" 
						label="lbl.pm.search.status"
						value="#{educationBackingBean.managedBean.status}">
						<f:selectItems
							value="#{educationBackingBean.getPmEducationStatusList()}"></f:selectItems>
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{educationBackingBean.retrieveEducationField}"
							update=":form:educationSR" process="educationSearch" />
						
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{educationBackingBean.resetSearchEdu}" process="@this"
							update=":form:educationResult, :form:educationSR, :form:educationSearch" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
