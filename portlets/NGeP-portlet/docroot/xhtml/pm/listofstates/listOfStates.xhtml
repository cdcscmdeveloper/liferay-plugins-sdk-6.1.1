<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:dataTable style="size : 200px;" id="listOfStatesTableID"
			var="statesObj" rows="10" rowIndexVar="index"
			value="#{statesBackingBean.managedBean.listOfStates}">
			<ac:paginator for="listOfStatesTableID" />
			<p:column style="width:5%;">
				<f:facet name="header">
			    #{lbl['lbl.pm.state.seq.no']}
			  </f:facet> 
			#{index+1}
		</p:column>
			<p:column style="width:12%;">
				<f:facet name="header">
			    #{lbl['lbl.pm.state.code']}
			  </f:facet> 
			#{statesObj.stateCode}
		</p:column>
			<p:column>
				<f:facet name="header">
			    #{lbl['lbl.pm.state.name']}
			  </f:facet> 
			#{statesObj.stateName}
		</p:column>
		</p:dataTable>
		<br />
	</ui:define>
</ui:composition>
