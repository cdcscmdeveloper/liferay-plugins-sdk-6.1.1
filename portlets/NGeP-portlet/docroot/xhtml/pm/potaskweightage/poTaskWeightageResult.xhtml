<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="Result" toggleable="true" id="pnlTaskWeightageResult">			
			<p:dataTable id="poUserResultDtTbl"
					value="#{poTaskWeightageBB.managedBean.userLs}" var="poUser">
				<ac:paginator for="poUserResultDtTbl" />
				<p:column headerText="#{lbl['lbl.pm.po.task.user.name']}">
					<h:outputText value="#{poUser.userName}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.po.task.identification.no']}">
					<h:outputText value="#{poUser.identificationNo}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.po.task.current.accumulated.weight']}">
					<h:outputText value="#{poUser.pmPoWeightage.accumulatedWeight}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.po.task.new.weight']}">
					<h:outputText value="#{poUser.pmPoWeightage.newWeight}" />
				</p:column>

				<ui:param name="roleTaskLs" value="#{poUser.pmPoRoleTasks}"></ui:param>
				<p:column headerText="#{lbl['lbl.pm.po.task.supplier.type']}">
					<ui:repeat var="suppType" value="#{roleTaskLs}">
						<h:outputText value="#{poTaskWeightageBB.getParameterDesc(ParameterTypeConst.supplierTypes,suppType.supplierType)}" /><br />
					</ui:repeat>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.pm.po.task.appl.type']}">
					<ui:repeat var="applType" value="#{roleTaskLs}">
						<h:outputText value="#{poTaskWeightageBB.getApplDesc(applType.applType)}" /><br />
					</ui:repeat>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.pm.po.task.category.type']}">
					<ui:repeat var="category" value="#{roleTaskLs}">
					<h:outputText value="#{lbl['lbl.txt.na']}" rendered="#{empty category.categoryType}" />
					<h:outputText value="#{category.categoryType == SupplierManagementConst.smApplCategoryTypeSpecial ? lbl['lbl.pm.po.task.category.special'] : lbl['lbl.pm.po.task.category.normal']}" 
					rendered="#{!empty category.categoryType}"/><br />
					</ui:repeat>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.pm.po.task.action']}">
					<p:commandLink id="poWeightageEditBtn" 
						action="#{poTaskWeightageBB.editUser(poUser)}">
						<p:graphicImage value="/css/images/design/edit.png" title="#{lbl['lbl.sm.edit']}" >
						</p:graphicImage>
					</p:commandLink>
				</p:column>
			</p:dataTable>
	</p:panel>
</ui:composition>
