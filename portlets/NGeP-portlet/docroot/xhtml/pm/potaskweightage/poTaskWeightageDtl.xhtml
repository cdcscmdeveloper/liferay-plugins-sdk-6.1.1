<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">

	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<div class="nav-wrapper" align="justify">
			<p:commandButton id="backBtn"  style="left;"
				action="#{poTaskWeightageBB.returnToPoUserMain}" value="#{lbl['lbl.btn.back']}"/>
				
			<p:commandButton id="btnSave" style="float:right;"
				action="#{poTaskWeightageBB.updateUser()}" value="#{lbl['lbl.btn.save']}"/>
	</div>
	<div style="clear: both;"></div>
	
	<p:panel header="Processing Officer Role Task Assignment" id="pnlPoRoleTask">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.processing.officer']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText value="#{poTaskWeightageBB.managedBean.selectedUser.userName}" disabled="true"/>
				</td>
				
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.identification.no']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText value="#{poTaskWeightageBB.managedBean.selectedUser.identificationNo}" disabled="true"/>
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.current.accumulated.weight']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText value="#{poTaskWeightageBB.managedBean.selectedUser.pmPoWeightage.accumulatedWeight}" disabled="true" />
				</td>
				
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.new.weight']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText  value="#{poTaskWeightageBB.managedBean.selectedUser.pmPoWeightage.weightEnter}" />
					<p:commandButton id="btnReset" update="pnlPoRoleTask" action="#{poTaskWeightageBB.resetWeightage}" 
					value="#{lbl['lbl.btn.reset']}"/>
				</td>
			</tr>
		</table>
		<br />
		<p:dataTable id="poRoleTaskDtTbl" value="#{poTaskWeightageBB.managedBean.selectedUser.pmPoRoleTasks}" var="roleTask" rowKey="#{roleTask}"
		 rowIndexVar="index">
		 	<ac:paginator for="poRoleTaskDtTbl" />
			
			<p:column headerText="Supplier Type">
				<p:outputLabel value="#{poTaskWeightageBB.getParameterDesc(ParameterTypeConst.supplierTypes,roleTask.supplierType)}" />
			</p:column>
			
			<p:column headerText="ApplicationType Type">
				<p:outputLabel value="#{poTaskWeightageBB.getApplDesc(roleTask.applType)}" />
			</p:column>
			
			<p:column headerText="Category Type">
				<p:outputLabel value="#{lbl['lbl.txt.na']}" rendered="#{empty roleTask.categoryType}" />
				<p:outputLabel value="#{roleTask.categoryType == SupplierManagementConst.smApplCategoryTypeSpecial ? lbl['lbl.pm.po.task.category.special'] : lbl['lbl.pm.po.task.category.normal']}" 
				rendered="#{!empty roleTask.categoryType}"/>
			</p:column>
			
			<p:column headerText="Record Status">
				<p:outputLabel value="#{(roleTask.recordStatusFlg==DbValueConst.recordStatusActive) ? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']} " />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
			<p:commandLink id="btnRoleTaskEdit" oncomplete="roleTaskDlg.show();" update=":#{p:component('roleTaskDlgId')}"
					action="#{poTaskWeightageBB.editRoleTask(roleTask)}" process="@this">
					<p:graphicImage value="/css/images/design/edit.png" />
			</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<br />
	<div style="text-align: right;">
			<p:commandButton id="btnAdd" update="roleTaskDlgId" process="@this" 
				action="#{poTaskWeightageBB.addRoleTask}" value="#{lbl['lbl.btn.add']}" oncomplete="roleTaskDlg.show();" />
	</div>
	
	<p:dialog  header="#{lbl['lbl.pm.po.task.new.role.task.assignment']}" widgetVar="roleTaskDlg" id="roleTaskDlgId"
		modal="true" width="500" dynamic="true" minHeight="500">
		<p:messages id="roleTaskDlgMessages" showDetail="true" autoUpdate="#{!empty param['disableRTValidation']}" closable="true" showSummary="false" />
		<p:outputPanel id="roleTaskPnl">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.supplier.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:selectOneMenu  value="#{poTaskWeightageBB.managedBean.selectedRoleTask.supplierType}" 
					label = "#{lbl['lbl.pm.po.task.supplier.type']}"
					required="#{!empty param['disableRTValidation']}">
						<p:ajax event="change" listener="#{poTaskWeightageBB.supplierTypeOnChange}" 
							update="roleTaskPnl" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="#{SupplierManagementConst.SUPP_TYPE_CONTRACTOR}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="#{SupplierManagementConst.SUPP_TYPE_CONSULTANT}"></f:selectItem>
					</p:selectOneMenu>
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.appl.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:selectOneMenu  value="#{poTaskWeightageBB.managedBean.selectedRoleTask.applType}" 
					disabled="#{empty poTaskWeightageBB.managedBean.selectedRoleTask.supplierType}"
					required="#{!empty param['disableRTValidation']}"
					label="#{lbl['lbl.pm.po.task.appl.type']}" >
						<p:ajax event="change" listener="#{poTaskWeightageBB.applTypeOnChange}" 
							update="roleTaskPnl" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{poTaskWeightageBB.applTypeDropDown()}" var="applTypeCode" 
						itemLabel="#{poTaskWeightageBB.getApplDesc(applTypeCode.pmParameter.parameterCode)}" 
						itemValue="#{applTypeCode.pmParameter.parameterCode}"></f:selectItems>
					</p:selectOneMenu>
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.category.type']}" />
				</td>
				
				<td class="tdContent">
					<p:selectOneMenu  value="#{poTaskWeightageBB.managedBean.selectedRoleTask.categoryType}" 
					disabled="#{poTaskWeightageBB.disabledCategory()}"
					label="#{lbl['lbl.pm.po.task.category.type']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.norm']}" itemValue="#{SupplierManagementConst.smApplCategoryTypeNormal}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.spl']}" itemValue="#{SupplierManagementConst.smApplCategoryTypeSpecial}"></f:selectItem>
					</p:selectOneMenu>
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.status']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				
				<td class="tdContent">
					<p:selectOneMenu value="#{poTaskWeightageBB.managedBean.selectedRoleTask.recordStatusFlg}"
					required="#{!empty param['disableRTValidation']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.active']}" itemValue="#{DbValueConst.recordStatusActive}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.txt.inactive']}" itemValue="#{DbValueConst.recordStatusSuspended}"></f:selectItem>
					</p:selectOneMenu>
				</td>
			</tr>
		</table>
		</p:outputPanel>
		
		<div style="text-align: right;">
			<p:commandButton id="btnCreate" update="poRoleTaskDtTbl" 
				action="#{poTaskWeightageBB.saveRoleTask}" 
				value="#{empty poTaskWeightageBB.managedBean.selectedRoleTask.poRoleTaskdId ? lbl['lbl.btn.add'] : lbl['lbl.btn.update']}">
				<f:param name="disableRTValidation" value="true" />
			</p:commandButton>
			
			<ui:remove>
			<p:commandButton id="btnClear" update="roleTaskPnl"
				action="#{poTaskWeightageBB.clearRoleTask}" value="#{lbl['clear']}"/>
			</ui:remove>
				
			<p:commandButton id="btnCancel" onclick="roleTaskDlg.hide();" value="#{lbl['lbl.btn.cancel']}"/>
		</div>
	</p:dialog>
	</ui:define>
</ui:composition>
