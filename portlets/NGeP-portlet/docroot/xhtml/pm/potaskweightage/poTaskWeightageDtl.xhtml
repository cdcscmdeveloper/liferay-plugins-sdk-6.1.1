<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">
	<script type="text/javascript">
            function paginatorGoToLastPage() {
            	roleTaskTblWV.paginator.setPage(roleTaskTblWV.paginator.cfg.pageCount - 1);
            }
	 </script>
 
	<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
	<div class="nav-wrapper" align="justify">
			<p:commandButton id="backBtn"  style="left;"
				action="#{poTaskWeightageBB.returnToPoUserMain}" value="#{lbl['lbl.btn.back']}"/>
				
			<p:commandButton id="btnSave" style="float:right;" update="pnlPoRoleTask"
				action="#{poTaskWeightageBB.updateUser()}" value="#{lbl['lbl.btn.save']}">
				<f:param name="disableValidation" value="true" />
			</p:commandButton>
	</div>
	<div style="clear: both;"></div>
	
	<p:panel header="#{lbl['lbl.pm.po.task.pnl.header.assignment']}" id="pnlPoRoleTask">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.processing.officer']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText id="txtUserName" value="#{poTaskWeightageBB.managedBean.selectedUser.userName}" disabled="true"/>
				</td>
				
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.pm.po.task.identification.no']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText id="txtIdentNo" value="#{poTaskWeightageBB.managedBean.selectedUser.identificationNo}" disabled="true" />
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel id="txtAccummualtedWeight" value="#{lbl['lbl.pm.po.task.current.accumulated.weight']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText value="#{poTaskWeightageBB.managedBean.selectedUser.pmPoWeightage.accumulatedWeight}" disabled="true" />
				</td>
				
				<td class="tdTitle">
					<p:outputLabel id="txtNewWeight" value="#{lbl['lbl.pm.po.task.new.weight']}" />
				</td>
			
				<td class="tdContent">
					<p:inputText  value="#{poTaskWeightageBB.managedBean.selectedUser.pmPoWeightage.weightEnter}" id="weightId" />
					<p:commandLink id="btnRoleTaskDel" action="#{poTaskWeightageBB.resetWeightage}" update="weightId">
							<p:graphicImage value="/css/images/design/btn_reset.png" title="#{lbl['lbl.btn.reset']}" />
					</p:commandLink>
				</td>
			</tr>
		</table>
		<br />
		<p:dataTable id="poRoleTaskDtTbl" value="#{poTaskWeightageBB.managedBean.selectedUser.pmPoRoleTasks}" var="roleTask" rowKey="#{roleTask}"
		 rowIndexVar="index" widgetVar="roleTaskTblWV">
		 	<ac:paginator for="poRoleTaskDtTbl"  />
			
			<p:column headerText="#{lbl['lbl.pm.po.task.supplier.type']}">
				<h:outputText value="#{poTaskWeightageBB.getParameterDesc(ParameterTypeConst.supplierTypes,roleTask.supplierType)}" rendered="#{!roleTask.brandNew}" />
				<p:selectOneMenu  value="#{roleTask.supplierType}" rendered="#{roleTask.brandNew}"
					label = "#{lbl['lbl.pm.po.task.supplier.type']}"
					required="#{!empty param['disableValidation']}">
						<p:ajax event="change" listener="#{poTaskWeightageBB.supplierTypeOnChange(roleTask)}" update="poRoleTaskDtTbl" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.contractor']}" itemValue="#{SupplierManagementConst.SUPP_TYPE_CONTRACTOR}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.consultant']}" itemValue="#{SupplierManagementConst.SUPP_TYPE_CONSULTANT}"></f:selectItem>
				</p:selectOneMenu>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.po.task.appl.type']}">
				<h:outputText value="#{poTaskWeightageBB.getApplDesc(roleTask.applType)}" rendered="#{!roleTask.brandNew}" />
				
				<p:selectOneMenu  value="#{roleTask.applType}" rendered="#{roleTask.brandNew}"
					disabled="#{empty roleTask.supplierType}" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.po.task.appl.type']}" >
						<p:ajax event="change" listener="#{poTaskWeightageBB.applTypeOnChange(roleTask)}" 
							update="poRoleTaskDtTbl" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{poTaskWeightageBB.applTypeDropDown(roleTask)}" var="applTypeCode" 
						itemLabel="#{poTaskWeightageBB.getApplDesc(applTypeCode.pmParameter.parameterCode)}" 
						itemValue="#{applTypeCode.pmParameter.parameterCode}"></f:selectItems>
				</p:selectOneMenu>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.po.task.category.type']}">
					<p:selectOneMenu value="#{roleTask.categoryType}" rendered="#{roleTask.brandNew}"
						disabled="#{poTaskWeightageBB.disabledCategory(roleTask)}" required="#{!empty param['disableValidation']}" 
						label="#{lbl['lbl.pm.po.task.category.type']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.norm']}"
							itemValue="#{SupplierManagementConst.smApplCategoryTypeNormal}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.catCodes.spl']}"
							itemValue="#{SupplierManagementConst.smApplCategoryTypeSpecial}"></f:selectItem>
					</p:selectOneMenu>

					<h:outputText value="#{lbl['lbl.txt.na']}"
						rendered="#{empty roleTask.categoryType and !roleTask.brandNew}" />
					<h:outputText
						value="#{roleTask.categoryType == SupplierManagementConst.smApplCategoryTypeSpecial ? lbl['lbl.pm.po.task.category.special'] : lbl['lbl.pm.po.task.category.normal']}"
						rendered="#{!empty roleTask.categoryType and !roleTask.brandNew}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.recordstatus']}">
				<p:selectOneMenu value="#{roleTask.recordStatusFlg}"
					required="#{!empty param['disableValidation']}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="#{DbValueConst.recordStatusActive}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="#{DbValueConst.recordStatusSuspended}"></f:selectItem>
				</p:selectOneMenu>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
			<p:commandLink id="btnRoleTaskDel" action="#{poTaskWeightageBB.deleteRoleTask(roleTask)}" 
				update="poRoleTaskDtTbl" rendered="#{roleTask.brandNew}">
					<p:graphicImage value="/css/images/design/delete.png" title="#{lbl['lbl.ct.delete']}" />
			</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<br />
	<div style="text-align: right;">
			<p:commandButton id="btnAdd" action="#{poTaskWeightageBB.validateAddRoleTask(true)}" value="#{lbl['lbl.btn.add']}" 
			update="poRoleTaskDtTbl" oncomplete="paginatorGoToLastPage();">
				<f:param name="disableValidation" value="true" />
			</p:commandButton>
	</div>
	 
	</ui:define>
</ui:composition>
