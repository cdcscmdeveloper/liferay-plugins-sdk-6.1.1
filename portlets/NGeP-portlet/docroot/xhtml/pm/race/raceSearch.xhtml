<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="racePanel" header="#{lbl['lbl.pm.race.search']}" toggleable="true" >  
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.race.code']}"></h:outputLabel></th>
				<td><p:inputText maxlength="5"
						value="#{raceBackingBean.managedBean.raceCode}"
						id="raceCode" size="30" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.race.name']}"></h:outputLabel></th>
				<td><p:inputText maxlength="100" id="raceName"
						value="#{raceBackingBean.managedBean.raceNames}"
						size="30" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.search.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px" id="raceStatus"
						value="#{raceBackingBean.managedBean.recordStatus}">
						<f:selectItems value="#{raceBackingBean.getStatusList()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="2" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{raceBackingBean.retrieveRace}"
							update=":form:raceTb" />
                       
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{raceBackingBean.resetRaceSearch}"
							update=":form:racePanel, :form:raceTb" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
