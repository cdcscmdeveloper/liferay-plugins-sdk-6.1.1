<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="raceResult" header="#{lbl['lbl.pm.race.result']}"
		toggleable="true">
		<p:dataTable id="raceTb"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{raceBackingBean.raceDataModel}" rows="10"
			var="race" rowIndexVar="index" lazy="true">
			<ac:paginator for="raceTb" />

			<p:column headerText="#{lbl['lbl.pm.race.code']}" style="width:15%">
				<h:outputText value="#{race.raceCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.race.name']}" style="width:60%">
				<h:outputText value="#{race.raceName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:20%"> 
   	    #{(race.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column>

			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink
					action="#{raceBackingBean.goToMaintaincePage(race)}"
					process="@this" partialSubmit="true">
					<p:graphicImage library="ep/images/design" 
						value="/css/images/design/edit.png" />						
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}"
			action="#{raceBackingBean.createRace}" />
	</div>
</ui:composition>
