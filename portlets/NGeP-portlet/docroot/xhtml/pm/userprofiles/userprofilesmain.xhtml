<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
		
	<ui:define name="contentSection">		
	<table>
    <tr>
		<td colspan="3"><h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.userName}"></h:outputText></td>
    </tr>
	<tr>
		<td rowspan="4">
			<h:graphicImage value="#{userprofileBackingBean.userImagePath(userprofileBackingBean.managedBean.pmUser.loginId)}" width="100" height="110" />
		</td>	
		<td style="width:90px;"><h:outputLabel style="font-weight:bold;" value="#{lbl['lbl.pm.profiles.designation']}" /></td>
		<td><h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.designation}"></h:outputText></td>
	</tr>
	<tr>
		<td><h:outputLabel style="font-weight:bold;" value="#{lbl['lbl.pm.profiles.grade']}" /></td>
		<td><h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.grade}"></h:outputText></td>	
	</tr>
    <tr>				
		<td><h:outputLabel style="font-weight:bold;" value="#{lbl['lbl.pm.profiles.email']}" /></td>
		<td><h:outputText  value="#{userprofileBackingBean.managedBean.pmAddress.email}"></h:outputText></td>
    </tr>
    <tr>
		<td><h:outputLabel style="font-weight:bold;" value="#{lbl['lbl.pm.profiles.mobileno']}" /></td>
		<td><h:outputText  value="#{userprofileBackingBean.managedBean.pmAddress.mobileNo}"></h:outputText></td>	
	</tr>
	<tr>
		<td>
			<p:commandLink>
				#{lbl['lbl.pm.profiles.more.details']}
			</p:commandLink>
		</td>
		<td colspan="2"></td>
	</tr>
	</table>					
	</ui:define>
</ui:composition>
