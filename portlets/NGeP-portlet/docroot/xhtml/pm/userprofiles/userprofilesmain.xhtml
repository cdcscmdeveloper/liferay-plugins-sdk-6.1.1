<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		
	<ui:define name="contentSection">		
		<table>
		    <tr>
				<td colspan="3">
				<h:outputText  value="#{userProfileBackingBean.managedBean.selectedUser.userName}" style="font-weight:bold;font-size:17.5px;"></h:outputText></td>
		    </tr>
			<tr>
				<td rowspan="4" style="padding-right:10px;">
					<h:graphicImage value="#{userProfileBackingBean.userImagePath(userProfileBackingBean.managedBean.selectedUser.loginId)}" width="100" height="110" />
				</td>	
				<td><h:graphicImage library="ep/images/design" name="user.png"
		                                 value="/resources/ep/images/design/user.png" />
		        </td>
				<td>:<h:outputText value="#{userProfileBackingBean.managedBean.selectedUser.designation}">
				    </h:outputText></td>
			</tr> 
			<tr>
				<td><h:graphicImage library="ep/images/design" name="award_star.png"
		               value="/resources/ep/images/design/award_star.png" /></td>
				<td>:<h:outputText  value="#{userProfileBackingBean.managedBean.selectedUser.grade}"></h:outputText></td>	
			</tr>
		    <tr>				
				<td><h:graphicImage library="ep/images/design" name="mail.png"
		               value="/resources/ep/images/design/mail.png" /></td>
				<td>:<h:outputText  value="#{userProfileBackingBean.managedBean.selectedUser.email}"></h:outputText></td>
		    </tr>
		    <tr>
				<td><h:graphicImage library="ep/images/design" name="mobile-phone-icon.png"
		              value="/resources/ep/images/design/mobile-phone-icon.png" /></td>
				<td>:<h:outputText  value="#{userProfileBackingBean.managedBean.selectedUser.mobileNo}"></h:outputText></td>	
			</tr>
			<tr>
				<td>
		<!-- 			<p:commandLink a="/web/epapp/user-profiles?faces-redirect=true"> -->
		<!-- 				#{lbl['lbl.pm.profiles.more.details']} &#187; -->
		<!-- 			</p:commandLink> -->
		
					<a href="../epapp/user-profiles" >
					  #{lbl['lbl.pm.profiles.more.details']} &#187;
					</a>
				</td>
				<td colspan="2"></td>
			</tr>
		</table>					
	</ui:define>
</ui:composition>
