<ui:composition
	template="/WEB-INF/facelets/templates/userprofiles_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
	
    <h:panelGrid  columns="1" border="0" cellpadding="0" cellspacing="0" width="100%">
    	<h:graphicImage value="#{userprofileBackingBean.userImagePath(userprofileBackingBean.managedBean.pmUser.loginId)}" width="100" height="110" style="padding-left:30px;"/>
	</h:panelGrid>
	
	<br />
	
	<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0" width="100%" columnClasses="columnWidth30">   
	<h:outputLabel style="height:15px;" value="Login ID: "/>
	<h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.loginId}"></h:outputText>
   
	<h:outputLabel style="height:15px;" value="Name: "/>
	<h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.userName}"></h:outputText>
    		
	<h:outputLabel style="height:15px;" value="Designation: "/>
	<h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.designation}"></h:outputText>
    				
	<h:outputLabel style="height:15px;" value="Email: "/>
	<h:outputText  value="#{userprofileBackingBean.managedBean.pmAddress.email}"></h:outputText>

	<h:outputLabel style="height:15px;" value="Mobile No.: "/>
	<h:outputText  value="#{userprofileBackingBean.managedBean.pmAddress.mobileNo}"></h:outputText>	
	
	<h:outputLabel style="height:15px;" value="City: "/>
	<h:outputText  value="#{userprofileBackingBean.managedBean.pmUser.pmCountry.countryCode} , #{userprofileBackingBean.managedBean.pmAddress.pmCity.cityName}" ></h:outputText>	
	
	
	</h:panelGrid>					
	</ui:define>
</ui:composition>
