<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<style>
table tr td {
    padding: 3px;
}
</style>		
    <h:panelGrid  columns="1" border="0" cellpadding="0" cellspacing="0" width="100%">
    	<h:graphicImage value="#{userprofileBackingBean.userImagePath(userprofileBackingBean.managedBean.pmUser.loginId)}" width="100" height="110"/>
	</h:panelGrid>
	
	<br />
	
	<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0" width="100%" columnClasses="columnWidth30">   
	<h:outputText style="height:20px;" value="Login ID: "></h:outputText>
	<h:outputText style="height:20px;" value="#{userprofileBackingBean.managedBean.pmUser.loginId}"></h:outputText>
   
	<h:outputText style="height:20px;" value="Name: "></h:outputText>
	<h:outputText style="height:20px;" value="#{userprofileBackingBean.managedBean.pmUser.userName}"></h:outputText>
    		
	<h:outputText style="height:20px;" value="Designation: "></h:outputText>
	<h:outputText style="height:20px;" value="#{userprofileBackingBean.managedBean.pmUser.designation}"></h:outputText>
    				
	<h:outputText style="height:20px;" value="Email: "></h:outputText>
	<h:outputText style="height:20px;" value="#{userprofileBackingBean.managedBean.pmAddress.email}"></h:outputText>

	<h:outputText style="height:20px;" value="Mobile No.: "></h:outputText>
	<h:outputText style="height:20px;" value="#{userprofileBackingBean.managedBean.pmAddress.mobileNo}"></h:outputText>	
	
	<h:outputText style="height:20px;" value="City: "></h:outputText>
	<h:outputText style="height:20px;" value="#{userprofileBackingBean.managedBean.pmAddress.pmCity.cityName}" ></h:outputText>	
	
	</h:panelGrid>
</ui:composition>
