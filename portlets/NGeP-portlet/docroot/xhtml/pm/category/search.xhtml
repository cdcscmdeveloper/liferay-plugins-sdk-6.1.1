<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
		
		<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
	
		<p:panel>
			<h:panelGrid styleClass="noBorders tr,noBorders td"></h:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.pm.header.general.org.search']}" toggleable="true">
			<h:panelGrid id="organisationSearchr" columns="2">
				<h:column>

				<p:panel style="width:100%;">
					<h:panelGrid columns="4">
						<h:outputLabel value="#{lbl['lbl.pm.main.category.code']}"></h:outputLabel>
						<p:inputText value="#{categoryBackingBean.managedBean.mainCatCode}" size="40" />
						
						<h:outputLabel value="#{lbl['lbl.pm.main.category.desc']}"></h:outputLabel>
						<p:inputText value="#{categoryBackingBean.managedBean.mainCatDesc}" size="40" />
						
						<h:outputLabel value="#{lbl['lbl.pm.sub.category.code']}"></h:outputLabel>
						<p:inputText value="#{categoryBackingBean.managedBean.subCatCode}" size="40" />
						
						<h:outputLabel value="#{lbl['lbl.pm.sub.category.desc']}"></h:outputLabel>
						<p:inputText value="#{categoryBackingBean.managedBean.subCatDesc}" size="40" />
						
						<h:outputLabel value="#{lbl['lbl.pm.sub.div.code']}"></h:outputLabel>
						<p:inputText value="#{categoryBackingBean.managedBean.subDivCode}" size="40" />
						
						<h:outputLabel value="#{lbl['lbl.pm.sub.div.desc']}"></h:outputLabel>
						<p:inputText value="#{categoryBackingBean.managedBean.subDivDesc}" size="40" />
						
					</h:panelGrid>
				</p:panel>

				</h:column>

			</h:panelGrid>
			<h:panelGrid border="0" columns="1" cellpadding="0" cellspacing="0"
				width="100%">
				<h:column>
					<p:commandButton value="#{lbl['lbl.pm.organisation.reset']}"
						style="float:right;"
						action="#{categoryBackingBean.resetOrganisation}"
						update="organisationSearchr" icon="ui-icon-reset"
						resetValues="true" partialSubmit="true" process="@this" />
					<p:commandButton value="#{lbl['lbl.pm.organisation.search']}"
						style="float:right;" icon="ui-icon-search"
						action="#{categoryBackingBean.search}"
						update="searchCategory" />
				</h:column>
			</h:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.pm.organisation.result']}" toggleable="true" style="width:100%">
			<p:dataTable id="searchCategory" var="category"
				value="#{categoryBackingBean.searchCategoryPagingDataModel}"
				rowIndexVar="index" lazy="true" rows="10">

				<ac:paginator for="searchCategory"></ac:paginator>

				<p:column headerText="#{lbl['lbl.pm.category.level']}" 
					style="width :15%">
					<h:outputText value="#{category[0]}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.category.code']}"
					style="width :40%">
					<h:outputText value="#{category[2]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.pm.category.desc']}"
					style="width :40%">
					<h:outputText value="#{category[3]}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.pm.status']}"
					style="width :15%">

					<h:outputText value="#{lbl['lbl.pm.active']}"
						rendered="#{category[4] == '1'}" />
					<h:outputText value="Expired"
						rendered="#{category[4] == '2'}" />
					<h:outputText value="Cancled"
						rendered="#{category[4] == '3'}" />
					<h:outputText value="Inactive"
						rendered="#{category[4] == '0'}" />
					<h:outputText value="Deleted"
						rendered="#{category[4] == '9'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.pm.organisation.action']}"
					style="width :5%">
					<ui:remove>
					<p:commandLink
						action="#{categoryBackingBean.editOrganization(category)}"
						update="@form">
						<p:graphicImage library="ep/images/design" name="edit.png"
							title="Edit Organisation"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
					</ui:remove>
				</p:column>
			</p:dataTable>
		</p:panel>
		<div class="ppRightBtn">

			<p:commandButton id="addLocation"
				value="#{lbl['lbl.pm.create.location']}" icon="ui-icon-add"
				action="#{categoryBackingBean.addOrganisation()}" />
		</div>

	</ui:define>

</ui:composition>
