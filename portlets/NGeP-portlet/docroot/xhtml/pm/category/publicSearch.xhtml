<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<!-- Validation Message -->
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:panel header="#{lbl['lbl.pm.header.general.org.search']}"
			toggleable="true" id="catPublicSearch">
			<table style="width: 100%;">
				<tr>
					<td colspan="4" style="padding-bottom:15px;">
						<h:outputText styleClass="instruction" value="#{lbl['lbl.pm.category.search.instruction']}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.category.desc']}" /></td>

					<td rowspan="3">
						<p:inputTextarea rows="4" cols="33" 
							value="#{categoryBackingBean.managedBean.categoryCodePublicSearchBean.catDesc}"/>
					</td>
					<td><p:outputLabel value="#{lbl['lbl.pm.supplier.type']}" /></td>
					<td><p:selectOneMenu
						    id="somSupplierType"
							label="#{lbl['lbl.pm.supplier.type']}"
							value="#{categoryBackingBean.managedBean.categoryCodePublicSearchBean.selectedSupplierType}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""></f:selectItem>
						<f:selectItems
								value="#{categoryBackingBean.managedBean.supplierType}"
								var="supplierType" itemLabel="#{supplierType.codeName}"
								itemValue="#{supplierType.pmParameter.parameterId}">	
						</f:selectItems>
						<p:ajax partialSubmit="true" update="@this" process="@this" />			
						</p:selectOneMenu>
					</td>
					
				</tr>
				<tr>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.by.company.type']}" /></td>
				<td><p:selectOneMenu
							id="somCompanyType"
							label="#{lbl['lbl.pm.by.company.type']}"
							value="#{categoryBackingBean.managedBean.categoryCodePublicSearchBean.selectedCompanyType}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""></f:selectItem>	
						<f:selectItems
									value="#{categoryBackingBean.getPopulateCompanyTypeList()}"
									var="compType"
									itemValue="#{compType.pmParameter.parameterId}"
									itemLabel="#{compType.codeName}" />
						<p:ajax partialSubmit="true" update="@this" process="@this" />						
						</p:selectOneMenu></td>
				</tr>
				<tr>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.bumi.percentage']}" /></td>
				<td><p:selectOneMenu
						    id="somBumiPercentage"
							label="#{lbl['lbl.pm.bumi.percentage']}"
							value="#{categoryBackingBean.managedBean.categoryCodePublicSearchBean.selectedBumiPercentage}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""></f:selectItem>	
						<f:selectItem itemLabel="0%" itemValue="0" />
						<f:selectItem itemLabel="51%" itemValue="51" />
						<f:selectItem itemLabel="100%" itemValue="100" />	
						<p:ajax partialSubmit="true" update="@this" process="@this" />						
					</p:selectOneMenu></td>
				</tr>
				<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.paid.capital']}" /></td>
				<td><p:inputText 
					size="15" 
					label="#{lbl['lbl.pm.paid.capital']}"
					maxlength="16"
					converterMessage="#{lbl['lbl.pm.paid.capital.invalid']}" 
					value="#{categoryBackingBean.managedBean.categoryCodePublicSearchBean.paidUpCapital}">
						<f:validateDoubleRange minimum="1" />
						<f:validateDoubleRange maximum="9999999999999" />						
						<p:ajax event="blur" process="@this" update="@this" />
					</p:inputText>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.pm.operate.from.home']}" /></td>
				<td><p:selectOneMenu
							id="somOperateFromHome"
							label="#{lbl['lbl.pm.operate.from.home']}"
							value="#{categoryBackingBean.managedBean.categoryCodePublicSearchBean.homeOperated}">
						<f:selectItems
									value="#{categoryBackingBean.getOperateFromHomeStatus()}" />	
						<p:ajax partialSubmit="true" update="@this" process="@this" />							
						</p:selectOneMenu></td>
				</tr>
				</table>
				
				<div style="text-align: right;margin-top:15px;">
				<p:commandButton value="#{lbl['lbl.pm.organisation.search']}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{categoryBackingBean.publicSearchCategory}"					
					update="catPublicSearch,publicSearchCategoryTable" />

				<p:commandButton value="#{lbl['lbl.pm.organisation.reset']}"
					action="#{categoryBackingBean.resetPublicSearchBean}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					update="catPublicSearch,publicSearchCategoryTable" resetValues="true"
					partialSubmit="true" process="@this" />

			</div>
				
			</p:panel>
			<p:panel header="#{lbl['lbl.pm.organisation.result']}"
			toggleable="true" style="width:100%">
			<p:dataTable id="publicSearchCategoryTable" var="category"
				value="#{categoryBackingBean.publicSearchCategoryPagingDataModel}" rowIndexVar="index"
				lazy="true" rows="10">

				<ac:paginator for="publicSearchCategoryTable"></ac:paginator>
				<p:columnGroup type="header">		       
		            <p:row>
		                <p:column colspan="2" headerText="#{lbl['lbl.pm.main.category']}" />
		                <p:column colspan="2" headerText="#{lbl['lbl.pm.sub.category']}" />
		                <p:column colspan="2" headerText="#{lbl['lbl.pm.sub.div']}" />
		                <p:column colspan="1" headerText="" />
		            </p:row>
		            <p:row>
		                <p:column headerText="#{lbl['lbl.pm.category.code.only']}" />
		                <p:column headerText="#{lbl['lbl.pm.category.desc.only']}" />
		                <p:column headerText="#{lbl['lbl.pm.category.code.only']}" />
		                <p:column headerText="#{lbl['lbl.pm.category.desc.only']}" />
		                <p:column headerText="#{lbl['lbl.pm.category.code.only']}" />
		                <p:column headerText="#{lbl['lbl.pm.category.desc.only']}" />
		                <p:column headerText="#{lbl['lbl.pm.category.details']}" />
		            </p:row>
	        	</p:columnGroup>
	        	
	       
 				<p:column style="width :3%;white-space:normal">
					<h:outputText value="#{category.pmCategoryL2.pmCategoryL1.categoryL1Code}"/>
				</p:column>
				<p:column style="width :18%;white-space:normal">
					<h:outputText escape="false" value="#{categoryBackingBean.getBoldWithSearchDesc(category.pmCategoryL2.pmCategoryL1.categoryName)}"/>
				</p:column>
				<p:column style="width :3%;white-space:normal">
					<h:outputText value="#{category.pmCategoryL2.categoryL2Code}"/>
				</p:column>
				<p:column style="width :18%;white-space:normal">
					<h:outputText escape="false" value="#{categoryBackingBean.getBoldWithSearchDesc(category.pmCategoryL2.categoryName)}"/>
				</p:column>
				<p:column style="width :3%;white-space:normal">
					<h:outputText value="#{category.categoryL3Code}"/>
				</p:column>
				<p:column style="width :18%;white-space:normal">
					<h:outputText escape="false" value="#{categoryBackingBean.getBoldWithSearchDesc(category.categoryName)}"/>
				</p:column>
				<p:column style="width :37%;white-space:normal">
					<h:outputText escape="false" value="#{categoryBackingBean.constructCategoryDetails(category)}"/>
					<h:outputText value="#{lbl['lbl.pm.category.machines']}"/>
					<h:outputText value=" - " rendered="#{!category.hasMachine}"/>
					<p:commandLink style="color:blue" rendered="#{category.hasMachine}" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{categoryBackingBean.constructMachineDlg(category)}"
						update=":form:opMachines" value="#{lbl['lbl.pm.machine.desc.click']}">						
					</p:commandLink>
					
				</p:column>
			</p:dataTable>
			 <!-- Machine List Popup -->
			<ui:include src="/xhtml/pm/category/machinePopUp.xhtml" />
		</p:panel>
		
	</ui:define>
</ui:composition>
