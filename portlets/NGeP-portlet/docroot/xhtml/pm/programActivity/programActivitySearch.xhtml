<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="programActivityPanel" header="#{lbl['lbl.pm.program.activity.search.location']}" toggleable="true" >

		<table class="ppTwoTable">
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.vot.program.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{programActivityBackingBean.managedBean.programSearchBean.votCode}"
						id="votCode" size="28" /></td>			
				
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.vot.program.desc']}"></p:outputLabel></td>
				<td width="17%"><p:inputText
						value="#{programActivityBackingBean.managedBean.programSearchBean.votName}"
						size="50" /></td>
				<th>&#160;</th>
				<td>&#160;</td>				
			</tr>			
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.program.activity.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{programActivityBackingBean.managedBean.programSearchBean.programActivityCode}"
						id="programActivityCodeId" size="28" /></td>			
				
				<td width="1%"><p:outputLabel value="#{lbl['lbl.pm.program.activity.desc']}"></p:outputLabel></td>
				<td width="17%"><p:inputText
						value="#{programActivityBackingBean.managedBean.programSearchBean.programActivityDesc}"
						size="50" /></td>				
			</tr>						
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.program.activity.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{programActivityBackingBean.managedBean.programSearchBean.status}">
						<f:selectItems value="#{programActivityBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{programActivityBackingBean.searchProgramActivity}"
							update=":form:programActivityResult" />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{programActivityBackingBean.resetVotProgramActivitySearchBean}"
							process="@this"
							update=":form:programActivityPanel, :form:programActivityResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
