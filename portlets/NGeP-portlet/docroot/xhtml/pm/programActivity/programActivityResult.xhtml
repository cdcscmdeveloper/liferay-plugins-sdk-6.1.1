<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="programActivityResult"
		header="#{lbl['lbl.pm.vot.program.search.result']}" toggleable="true">
		<p:dataTable id="programActivitySR"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{programActivityBackingBean.searchVotProgramActivity}"
			rows="10" var="programActivityList" rowIndexVar="index" lazy="true">
			<ac:paginator for="programActivitySR" />

			<p:column style="width:10%;white-space: normal;word-wrap: break-word;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.vot.program.code']}" />
				</f:facet>
				#{programActivityList[0]}
			</p:column>

			<p:column style="width:40%;white-space: normal;word-wrap: break-word;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.vot.program.desc']}" />
				</f:facet>
				#{programActivityList[1]}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.program.activity.code']}"
				style="width:15%;white-space: normal;">
				#{programActivityList[2]}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.program.activity.desc']}"
				style="width:40%;white-space: normal;word-wrap: break-word;">
				#{programActivityList[3]}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.vot.program.valid.from']}"
				style="width:15%;">
				<h:outputText value="#{programActivityList[4]}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.vot.program.valid.to']}"
				style="width:15%;">
				<h:outputText value="#{programActivityList[5]}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:10%;white-space: normal;word-wrap: break-word;"> 
   	    #{(programActivityList[9]==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
