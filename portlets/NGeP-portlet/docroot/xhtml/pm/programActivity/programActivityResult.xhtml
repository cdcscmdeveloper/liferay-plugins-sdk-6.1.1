<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="programActivityResult"
		header="#{lbl['lbl.pm.vot.program.search.result']}" toggleable="true">
		<p:dataTable id="programActivitySR"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{programActivityBackingBean.searchVotProgramActivity}"
			rows="10" var="programActivityList" rowIndexVar="index" lazy="true">
			<ac:paginator for="programActivitySR" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.vot.program.code']}" />
				</f:facet>
				<ui:repeat var="pmVotFunds" value="#{programActivityList.pmVotFund}">
					<h:outputText value="#{(pmVotFunds.votFundCode)}" />
					<br />
				</ui:repeat>
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.vot.program.desc']}" />
				</f:facet>
				<ui:repeat var="pmVotFunds" value="#{programActivityList.pmVotFund}">
					<h:outputText value="#{(pmVotFunds.description)}" />
					<br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.program.activity.code']}"
				style="width:25%">
				<h:outputText value="#{programActivityList.prgActivityCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.program.activity.desc']}"
				style="width:25%">
				<h:outputText value="#{programActivityList.description}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.vot.program.valid.from']}"
				style="width:25%">
				<h:outputText value="#{programActivityList.effDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.vot.program.valid.to']}"
				style="width:25%">
				<h:outputText value="#{programActivityList.expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:10%"> 
   	    #{(programActivityList.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
