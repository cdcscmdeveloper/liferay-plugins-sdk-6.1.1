<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:outputScript id="applyChangeHandler" target="body">
	applyChangeHandler();
	</h:outputScript>
	<script type="text/javascript">
		function applyChangeHandler() {
			alert("");
			jqId = '#form\\:datatable-checkbox';
			var rowSelector = jqId
					+ ' tbody.ui-datatable-data > tr.ui-widget-content.ui-datatable-selectable';
			$(document).off('click.datatable', rowSelector);
			$(document).off('mouseover.datatable mouseout.datatable',
					rowSelector);
		}
	</script>

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages"  autoUpdate="true" />
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<tr>
				<td width="40%" valign="top">
					<div align="right">
						<p:commandButton value="Refresh" icon="ui-icon-reset"
							action="#{notifyBackingBean.retrieveNotifyList}"
							update=":form:notifyTable" />
						<p:commandButton value="Delete" icon="ui-icon-delete"
							action="#{notifyBackingBean.removeNotifys}"
							update=":form:notifyTable,:form:pnldetail" />
					</div> <p:dataTable value="#{notifyBackingBean.managedBean.notifyLists}"
						sortMode="multiple" var="notify" id="notifyTable"
						rowIndexVar="index" width="100%" rowKey="#{notify}"
						selection="#{notifyBackingBean.managedBean.selectedNotifys}">

						<ac:paginator for="notifyTable" />

						<p:column selectionMode="multiple" style="width:2%" />

						<p:column headerText="Sender/Subject">
							#{notify.pmUser.userName} <br />
							<p:commandLink id="btnNotifyLink" update=":form:pnldetail">
								<h:outputText value="#{notify.pmNotifyLog.subject}"></h:outputText>
								<f:setPropertyActionListener value="#{notify}"
									target="#{notifyBackingBean.managedBean.selectedNotify}" />
							</p:commandLink>
						</p:column>
						<p:column headerText="Date/Time" style="text-align: right">
							<h:outputText value="#{notify.pmNotifyLog.createdDate}">
								<f:convertDateTime pattern="dd-MM-yyyy" />
							</h:outputText>
							<br />
							<h:outputText value="#{notify.pmNotifyLog.createdDate}">
								<f:convertDateTime pattern="hh:mm:ss a" />
							</h:outputText>
						</p:column>
					</p:dataTable>
				</td>
				<td width="3%"><p:spacer width="3" /></td>
				<td width="57%" valign="top"><p:panel id="pnldetail"
						toggleable="true">
						<table border="1" width="100%" cellpadding="0" cellspacing="0">
							<tr>
								<td style="width: 80px; height: 30px;"><h:outputLabel
										style="font-weight:bold;text-align: left" value="From :" /></td>
								<td><p:inputText
										value="#{notifyBackingBean.managedBean.selectedNotify.pmUser.userName}"
										readonly="true"></p:inputText></td>
								<td><h:outputLabel style="font-weight:bold;"
										value="DateTime :" /></td>
								<td style="width: 200px;"><p:inputText style="width:140px"
										value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.createdDate}"
										readonly="true">
										<f:convertDateTime pattern="dd-MM-yyyy  hh:mm:ss a" />
									</p:inputText></td>
							</tr>
							<tr>
								<td style="width: 80px; height: 30px;"><h:outputLabel
										style="font-weight:bold;text-align: left" value="Subject :" /></td>
								<td colspan="3"><p:inputText readonly="true"
										style="width:545px"
										value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.subject}"></p:inputText>
								</td>
							</tr>
							<tr>
								<td style="width: 80px; height: 60px;" colspan="1" valign="top"><h:outputLabel
										style="font-weight:bold;text-align:left;" value="Message :" /></td>
								<td colspan="3"><p:scrollPanel layout="block"
										style="text-align:left;width:555px;height:240px;border:1px solid #CECECE;">
										<p:outputLabel escape="false" readonly="true" style="width:540px;height:240px;"
											value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.content}"></p:outputLabel>
									</p:scrollPanel></td>
							</tr>
						</table>
					</p:panel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
