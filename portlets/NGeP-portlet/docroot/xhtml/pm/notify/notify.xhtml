<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" autoUpdate="true" />
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<tr>
				<td width="40%" valign="top">
					<table width="100%">
						<tr>
							<td style="text-align: left; vertical-align: middle;"><p:commandLink
									id="allLink" action="#{notifyBackingBean.retrieveNotifyList}"
									update=":form:pnldetail,:form:notifyTable">
									<h:outputText value="#{lbl['lbl.portal.notify.all']}"></h:outputText>
								</p:commandLink> &#160;&#160;|&#160;&#160; <h:graphicImage
									style="vertical-align:bottom;" library="ep/images/design"
									name="mail.png" value="/resources/ep/images/design/mail.png" />&#160;
								<p:commandLink
									action="#{notifyBackingBean.retrieveUnreadNotifyList}"
									id="unreadLink" update=":form:pnldetail,:form:notifyTable">
									<h:outputText value="#{lbl['lbl.portal.notify.unread']}"></h:outputText>
								</p:commandLink></td>
							<td style="text-align: right;"><p:commandButton
									value="#{lbl['lbl.portal.notify.btn.refresh']}"
									icon="ui-icon-reset"
									action="#{notifyBackingBean.retrieveNotifyList}"
									update=":form:pnldetail,:form:notifyTable" /> <p:commandButton
									value="#{lbl['lbl.portal.notify.btn.delete']}"
									icon="ui-icon-delete"
									action="#{notifyBackingBean.removeNotifys}"
									update=":form:notifyTable,:form:pnldetail" /></td>
						</tr>
						<tr>
							<td colspan="2" width="100%" valign="top"><p:dataTable
									value="#{notifyBackingBean.notifyDataModel}" var="notify"
									id="notifyTable" rows="5" rowIndexVar="index" width="100%"
									rowKey="#{notify}" lazy="true"
									selection="#{notifyBackingBean.managedBean.selectedNotifys}">

									<ac:paginator for="notifyTable" />

									<p:column selectionMode="multiple" style="width:7%" />

									<p:column style="text-align: right;width:7%">
										<h:graphicImage library="ep/images/design" name="mail.png"
											value="/resources/ep/images/design/mail.png"
											rendered="#{notify.pmAlert.isRead eq '0'}" />
									</p:column>
									<p:column
										headerText="#{lbl['lbl.portal.notify.sender']}/#{lbl['lbl.portal.notify.subject']}">
							#{notify.pmNotifyLog.pmUser.userName} <br />
										<p:commandLink id="btnNotifyLink"
											action="#{notifyBackingBean.selectedNotify}"
											update=":form:pnldetail,:form:notifyTable">
											<h:outputText
												value="#{notify.pmNotifyLog.subject.length() gt 50 ? notify.pmNotifyLog.subject.substring(0,47).concat('...') : notify.pmNotifyLog.subject}"></h:outputText>
											<f:setPropertyActionListener value="#{notify}"
												target="#{notifyBackingBean.managedBean.selectedNotify}" />
										</p:commandLink>
									</p:column>
									<p:column headerText="#{lbl['lbl.portal.notify.datetime']}"
										style="text-align: right;width:2%;">
										<h:outputText value="#{notify.pmNotifyLog.createdDate}">
											<f:convertDateTime pattern="dd-MM-yyyy" />
										</h:outputText>
										<br />
										<h:outputText value="#{notify.pmNotifyLog.createdDate}">
											<f:convertDateTime pattern="hh:mm:ss a" />
										</h:outputText>
									</p:column>
								</p:dataTable></td>
						</tr>
					</table>
				</td>
				<td width="3%"><p:spacer width="3" /></td>
				<td width="57%" valign="top"><p:panel id="pnldetail"
						style="border-width:1px 1px; border:1px solid #cecece;"
						toggleable="true">
						<table border="0" width="100%" cellpadding="0" cellspacing="0">
							<c:if
								test="#{empty notifyBackingBean.managedBean.selectedNotify}">
								<tr>
									<td style="text-align: center; width: 100%; height: 100px;"><h:outputText
											value="#{lbl['lbl.portal.notify.selectmessagetoread']}"></h:outputText></td>
								</tr>
							</c:if>
							<c:if
								test="#{not empty notifyBackingBean.managedBean.selectedNotify}">
								<tr>
									<td align="left" style="width: 70px; height: 30px;"><h:outputText
											style="font-weight:bold;text-align: left"
											value="#{lbl['lbl.portal.notify.sender']}"> : </h:outputText></td>
									<td style="text-align: left"><h:outputText
											value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.pmUser.userName}"></h:outputText>
									</td>
									<td align="right"
										style="width: 200px; text-align: right; font-size: 12px;"><h:outputText
											value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.createdDate}"
											readonly="true">
											<f:convertDateTime pattern="dd-MM-yyyy hh:mm:ss a" />
										</h:outputText></td>
								</tr>
								<tr>
									<td style="height: 30px;"><h:outputText
											style="font-weight:bold;text-align: left"
											value="#{lbl['lbl.portal.notify.subject']}"></h:outputText></td>
									<td colspan="3"><h:outputText readonly="true"
											style="width:545px"
											value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.subject}"></h:outputText>
									</td>
								</tr>
								<tr>
									<td style="height: 30px;" colspan="3"><hr /> <p:scrollPanel
											layout="block"
											style="text-align:left;width:100%;height:240px;border:0">
											<p:outputLabel escape="false" readonly="true"
												style="width:98%;height:220px;overflow: auto;"
												value="#{notifyBackingBean.managedBean.selectedNotify.pmNotifyLog.content}"></p:outputLabel>
										</p:scrollPanel></td>
								</tr>
							</c:if>
						</table>
					</p:panel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
