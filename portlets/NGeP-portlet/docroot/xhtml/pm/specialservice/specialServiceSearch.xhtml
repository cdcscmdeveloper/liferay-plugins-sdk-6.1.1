<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="pSpecialServiceSearch" header="#{lbl['lbl.pm.search.special.service']}" toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pm.ss.name']}"/></th>
				<td><p:inputText id="specialServiceName" size="30" maxlength="100" value="#{SpecialServiceBackingBean.managedBean.codeName}"/></td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.ss.status']}"/></th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{SpecialServiceBackingBean.managedBean.status}">
						<f:selectItems value="#{SpecialServiceBackingBean.getPmspecialServiceStatusList()}"/>
					</p:selectOneMenu>
				</td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{SpecialServiceBackingBean.retrieveSpecialService}"
							process="pSpecialServiceSearch" update="dtSpecialServiceResult"/>
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{SpecialServiceBackingBean.resetSearchSpecialService}"
							update="pSpecialServiceSearch, dtSpecialServiceResult"/>
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
