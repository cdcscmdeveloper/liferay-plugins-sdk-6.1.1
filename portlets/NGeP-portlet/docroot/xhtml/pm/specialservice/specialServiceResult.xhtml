<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="pSpecialServiceResult" header="#{lbl['lbl.pm.special.service.result']}" toggleable="true">
		<p:dataTable id="dtSpecialServiceResult"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}" rows="10" lazy="true" rowIndexVar="rowIndex"
			value="#{SpecialServiceBackingBean.specialServiceDataModel}" var="SpecialServicelist">
			<ac:paginator for="dtSpecialServiceResult"/>
			<p:column headerText="#{lbl['lbl.pm.ss.name']}" style="width:50%; white-space:normal;">
				<h:outputText value="#{SpecialServicelist.codeName}"/>
			</p:column>
			<p:column style="width:30%;" headerText="#{lbl['lbl.pm.status']}">
	            #{(SpecialServicelist.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	        </p:column>
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:20%;text-align:center;">
				<p:commandLink action="#{SpecialServiceBackingBean.goToMaintaincePage(SpecialServicelist)}" process="@this" partialSubmit="true">
					<p:graphicImage library="ep/images/design" value="/css/images/design/edit.png"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}" action="#{SpecialServiceBackingBean.createspecialService}"/>
	</div>
</ui:composition>
