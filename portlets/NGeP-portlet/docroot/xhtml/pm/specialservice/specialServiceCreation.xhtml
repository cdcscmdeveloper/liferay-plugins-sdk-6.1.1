<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.pm.ss.detail']}" toggleable="true" id="specialServiceId">
		<p:spacer height="10"></p:spacer>
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.ss.name']}"/>
					<p:outputLabel value="*" styleClass="mandatory"/>
				</th>
				<td>
					<p:inputText required="true" label="#{lbl['lbl.pm.ss.name']}" size="30" maxlength="100"
						value="#{SpecialServiceBackingBean.managedBean.pmSpecialService.codeName}"
						disabled="#{!SpecialServiceBackingBean.managedBean.pmSpecialService.brandNew}"/>
				</td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.search.status']}"/>
					<p:outputLabel value="*" styleClass="mandatory"/>
				</th>
				<td>
					<p:selectOneMenu style="width:178px;margin-bottom:5px;"
						required="true" label="#{lbl['lbl.pm.search.status']}"
						value="#{SpecialServiceBackingBean.managedBean.pmSpecialService.recordStatusFlg}"
						disabled="#{SpecialServiceBackingBean.managedBean.pmSpecialService.brandNew}">
						<f:selectItems value="#{SpecialServiceBackingBean.getPmspecialServiceStatusList()}"></f:selectItems>
						<p:ajax event="change" process="@form" partialSubmit="true" update="@form"/>
					</p:selectOneMenu>
				</td>
				<th></th>
				<td></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
