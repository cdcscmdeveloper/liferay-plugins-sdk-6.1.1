<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>

	<p:outputPanel id="opRejectReasonCat">
		<table class="ppOneTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.reason.category']}"/>
					<p:outputLabel value="* " styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu id="somReasonCategory" required="true" disabled="#{!rejectionReasonBackingBean.managedBean.selectedReason.brandNew}"
						label="#{lbl['lbl.pm.reason.category']}" styleClass="ppDropDownWidthM"  
						value="#{rejectionReasonBackingBean.managedBean.selectedReason.reasonCategoryCode.parameterId}">
						<f:selectItems  value="#{rejectionReasonBackingBean.reasonCategoryOptions()}" />
						<p:ajax event="change" listener="#{rejectionReasonBackingBean.reasonCategoryChange(false,
						rejectionReasonBackingBean.managedBean.selectedReason.reasonCategoryCode.parameterId)}"
							update="pReasonRestriction"/>
					</p:selectOneMenu>
					<p:message id="somReasonCategoryMsg" for="somReasonCategory" display="icon" />
				</td>
			</tr>
		</table>
		<br/>
		<p:panel id="pRejectReasonDet" header="#{lbl['lbl.pm.rejection.reason.details']}" toggleable="true">
			<table class="ppOneTable">
				<tr>
					<th>
						<p:outputLabel value="#{lbl['lbl.pm.reason.code']}"/>
						<p:outputLabel value="* " styleClass="mandatory" />
					</th>
					<td>
						<p:inputText id="itReasonCode" styleClass="ppDisplayTextM" required="true" maxlength="10" 
							disabled="#{!rejectionReasonBackingBean.managedBean.selectedReason.brandNew}"
							value="#{rejectionReasonBackingBean.managedBean.selectedReason.reasonCode}" 
							label="#{lbl['lbl.pm.reason.code']}"/>
						<p:message id="itReasonCodeMsg" for="itReasonCode" display="icon" />							
					</td>
				</tr>
				<tr>
					<!-- List of languages with description -->
					<th>
						<p:outputLabel value="#{lbl['lbl.pm.reason.desc']}"/>
						<p:outputLabel value="* " styleClass="mandatory" />
					</th>
					<td>
						<p:dataTable id="dtReasonDesc" styleClass="reasonDescList" var="reasonDesc"   
							value="#{rejectionReasonBackingBean.managedBean.selectedReason.pmReasonDescs}">
					        <p:column headerText="#{lbl['lbl.pm.settings.language']}" width="10%">  
						    	#{reasonDesc.pmLanguage.languageName}
					        </p:column>  
					        <p:column headerText="* #{lbl['lbl.pm.reason.desc']}">  
					            <p:inputTextarea id="itReasonDesc" value="#{reasonDesc.reasonDesc}" cols="50" rows="5" required="true"
					            	maxlength="255" label="#{lbl['lbl.pm.reason.desc']}"/>
				            	<p:message id="itReasonDescMsg" for="itReasonDesc" display="icon" />	
					        </p:column>  
					   	</p:dataTable>
					</td>
				</tr>
				<tr>
					<th>
						<p:outputLabel value="#{lbl['lbl.pm.status']}"/>
						<p:outputLabel value="* " styleClass="mandatory" />
					</th>
					<td>
						<p:selectOneMenu styleClass="ppDropDownWidthM"  label="#{lbl['lbl.pm.status']}"
							value="#{rejectionReasonBackingBean.managedBean.selectedReason.recordStatusFlg}">
							<f:selectItems  value="#{rejectionReasonBackingBean.getStatusOptions()}"/>
						</p:selectOneMenu>
					</td>
				</tr>
			</table>
			<br/>
		</p:panel>
		<!-- Restriction List (App Type, Supp Type, Comp Reg Type) -->
		<ui:include src="restrictionList.xhtml"/>
	</p:outputPanel>
</ui:composition>
