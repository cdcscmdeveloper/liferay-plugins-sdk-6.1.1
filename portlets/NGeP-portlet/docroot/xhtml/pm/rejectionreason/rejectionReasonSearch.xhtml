<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pRejectReasonSearch" header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<td><table style="width:600px;">
						<!-- 8411 - START -->
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pm.reason.category']}" />
								<p:outputLabel value="* " styleClass="mandatory" /></th>
							<td><p:selectOneMenu id="somReasonCategory"
									label="#{lbl['lbl.pm.reason.category']}"
									styleClass="ppDropDownWidthM"
									value="#{rejectionReasonBackingBean.managedBean.reasonCategory}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""/>
									<f:selectItem itemLabel="#{lbl['lbl.pm.reason.justification']}" itemValue="#{rejectionReasonBackingBean.justification}"/>
									<f:selectItem itemLabel="#{lbl['lbl.pm.reason.rejectionreason']}" itemValue="#{rejectionReasonBackingBean.rejectionReason}"/>
									<p:ajax process="@this" event="change"
											update="pRejectReasonSearch, dtRejectReasonResult"
											listener ="#{rejectionReasonBackingBean.resetCategoryChange(true)}"/>
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pm.reason.type']}" />
								<p:outputLabel value="* " styleClass="mandatory" /></th>
							<td><p:selectOneMenu id="somReasonCat"
									label="#{lbl['lbl.pm.reason.type']}"
									styleClass="ppDropDownWidthM"
									value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonCategoryParam.parameterId}">
									<f:selectItems
										value="#{rejectionReasonBackingBean.reasonCategoryOptions(true)}" />
									<p:ajax event="change"
										listener="#{rejectionReasonBackingBean.reasonCategoryChange(true,
							rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonCategoryParam.parameterId)}"
										update="pRejectReasonSearch" />
								</p:selectOneMenu></td>
						</tr>
						<!-- 8411 - END -->
						<!-- 12852 Start -->
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pm.reason.code']}" /></th>
							<td><p:inputText styleClass="ppDisplayTextS" maxlength="10" style="width:19%"
									value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonCode}">
									<p:ajax process="@this" />
								</p:inputText></td>
						</tr>
						<!-- 12852 End -->
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pm.reason.desc']}" /></th>
							<td><p:inputTextarea
									value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonDesc}"
									cols="50" rows="5" maxlength="255" autoResize="false">
									<p:ajax process="@this" />
								</p:inputTextarea></td>
						</tr>
						<tr>
							<th><p:outputLabel value="#{lbl['lbl.pm.status']}" /></th>
							<td><p:selectOneMenu styleClass="ppDropDownWidthM"
									value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.status}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems
										value="#{rejectionReasonBackingBean.getStatusOptions()}" />
								</p:selectOneMenu></td>
							<th></th>
							<td></td>
						</tr>
					</table>
				</td>
				<td><table>
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pm.application.type']}"
								id="applTypeLbl"
								rendered="#{rejectionReasonBackingBean.managedBean.searchSuppReason}" />
						</th>
						<td><p:selectOneMenu id="somAppType"
								styleClass="ppDropDownWidthM"
								rendered="#{rejectionReasonBackingBean.managedBean.searchSuppReason}"
								value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.applicationType}">
								<f:selectItems
									value="#{rejectionReasonBackingBean.applicationTypeOptions()}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pm.company.type']}"
								id="comTypeLbl"
								rendered="#{rejectionReasonBackingBean.managedBean.searchSuppReason}" />
						</th>
						<td><p:selectOneMenu id="somComType"
								styleClass="ppDropDownWidthM"
								rendered="#{rejectionReasonBackingBean.managedBean.searchSuppReason}"
								value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.companyType}">
								<f:selectItems
									value="#{rejectionReasonBackingBean.companyTypeOptions()}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<th><p:outputLabel value="#{lbl['lbl.pm.supplier.type']}"
								id="suppTypeLbl"
								rendered="#{rejectionReasonBackingBean.managedBean.searchSuppReason}" />
						</th>
						<td><p:selectOneMenu id="somSuppType"
								styleClass="ppDropDownWidthM"
								rendered="#{rejectionReasonBackingBean.managedBean.searchSuppReason}"
								value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.supplierType}">
								<f:selectItems
									value="#{rejectionReasonBackingBean.supplierTypeOptions()}" />
							</p:selectOneMenu></td>
					</tr>
					</table>
				</td>
			</tr>
			<tr>
							<td colspan="4">
								<div class="ppRightBtn">
									<p:commandButton value="#{lbl['lbl.btn.search']}"
										update="dtRejectReasonResult" process="pRejectReasonSearch"
										action="#{rejectionReasonBackingBean.searchReason}" />
									
									<p:commandButton value="#{lbl['lbl.btn.reset']}"
										update="pRejectReasonSearch, dtRejectReasonResult"
										action="#{rejectionReasonBackingBean.resetReasonSearchBean}" />
								</div>
							</td>
						</tr>
		</table>

	</p:panel>

</ui:composition>
