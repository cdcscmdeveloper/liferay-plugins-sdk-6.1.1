<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<p:panel id="pRejectReasonSearch" header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.reason.category']}"/>
				</th>
				<td>
					<p:selectOneMenu label="#{lbl['lbl.pm.reason.category']}" styleClass="ppDropDownWidthM"  
						value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonCategoryParam.parameterId}">
						<f:selectItems  value="#{rejectionReasonBackingBean.reasonCategoryOptions()}" />
						<p:ajax event="change" listener="#{rejectionReasonBackingBean.reasonCategoryChange(true,
							rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonCategoryParam.parameterId)}"
							update="somSuppType, somAppType, somComType"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.application.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM" 
						disabled="#{!rejectionReasonBackingBean.managedBean.searchSuppReason}"
						value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.applicationType}">
						<f:selectItems  value="#{rejectionReasonBackingBean.applicationTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.reason.code']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="10" 
						value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonCode}"/>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.company.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somComType" styleClass="ppDropDownWidthM"
						disabled="#{!rejectionReasonBackingBean.managedBean.searchSuppReason}"
						value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.companyType}">
						<f:selectItems  value="#{rejectionReasonBackingBean.companyTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.reason.desc']}"/>
				</th>
				<td>
				 	<p:inputTextarea value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.reasonDesc}" 
				 		cols="50" rows="5" maxlength="255"/>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somSuppType" styleClass="ppDropDownWidthM" 
						disabled="#{!rejectionReasonBackingBean.managedBean.searchSuppReason}"
						value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.supplierType}">
						<f:selectItems  value="#{rejectionReasonBackingBean.supplierTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.status']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{rejectionReasonBackingBean.managedBean.reasonSearchBean.status}">
						<f:selectItems  value="#{rejectionReasonBackingBean.getStatusOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"  
							update="dtRejectReasonResult" process="pRejectReasonSearch"
							action="#{rejectionReasonBackingBean.searchReason}"/>&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}" 
							update="pRejectReasonSearch" 
							action="#{rejectionReasonBackingBean.resetReasonSearchBean}"/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
