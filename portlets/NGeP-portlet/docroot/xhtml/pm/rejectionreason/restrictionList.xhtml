<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>

	<p:outputPanel id="opRestriction">
		<p:panel id="pReasonRestriction" header="#{lbl['lbl.pm.reason.restriction']}" toggleable="true" 
			visible="#{rejectionReasonBackingBean.managedBean.suppReason}">
			<p:tabView widgetVar="tvReasonRestriction" id="tvReasonRestriction" dynamic="false" cache="false" orientation="top"
				activeIndex="#{rejectionReasonBackingBean.managedBean.selectedTabIndex}">
				<!-- Application Type -->
				<p:tab id="tAppType" title="#{lbl['lbl.pm.application.type']}" disabled="#{!rejectionReasonBackingBean.managedBean.suppAppCheck}">  
					
						<p:outputPanel
							rendered="#{rejectionReasonBackingBean.managedBean.suppAppCheck}">
						<p:dataTable id="dtAppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
							value="#{rejectionReasonBackingBean.managedBean.appTypeRestrictions}"
							var="restrict" rowKey="#{restrict}"	rowIndexVar="rowIndex"> 
					        <p:column>
					          	<f:facet name="header">
							     	<h:outputText value="* " styleClass="mandatory" />
							     	<h:outputText value="#{lbl['lbl.pm.application.type']}" />
							    </f:facet>
							    <h:outputText
									value="#{supportDocBackingBean.getParameterDesc(restrict.restrType)}"
									rendered="#{!restrict.brandNew}" />
						    	<p:selectOneMenu id="somAppType"  styleClass="ppDropDownWidthM" 
						    		rendered="#{restrict.brandNew}"
									value="#{restrict.restrType.parameterId}">
									<f:selectItems  value="#{rejectionReasonBackingBean.applicationTypeOptions()}"/>
									<p:ajax event="change" update="somAppType" 
										listener="#{rejectionReasonBackingBean.validateUniqueRestrType(ParameterTypeConst.supplierApplicationTypes)}"/>
								</p:selectOneMenu>
					        </p:column>  
					        <p:column width="5%" headerText="#{lbl['lbl.pm.action']}">
	           					<p:commandLink partialSubmit="true" 
									process="@this" action="#{rejectionReasonBackingBean.deleteRestrictions(rejectionReasonBackingBean.restrApp,rowIndex)}"
									update="dtAppType" >
									<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
								</p:commandLink>
							</p:column>
					   	</p:dataTable>
					   	
				   		<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.add']}"  update="dtAppType"
								action="#{rejectionReasonBackingBean.addRestriction(ParameterTypeConst.supplierApplicationTypes)}"
								partialSubmit="true" process="@this"/>
					
						</div>
					</p:outputPanel>
				</p:tab>
				<!-- Company Type -->
				<p:tab id="tComType" title="#{lbl['lbl.pm.company.type']}" disabled="#{!rejectionReasonBackingBean.managedBean.suppComCheck}">  
					
					<p:outputPanel
						rendered="#{rejectionReasonBackingBean.managedBean.suppComCheck}">
						<p:dataTable id="dtComType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
							value="#{rejectionReasonBackingBean.managedBean.comTypeRestrictions}"						
							var="restrict" rowKey="#{restrict}" rowIndexVar="rowIndex">
							<p:column>
					          	<f:facet name="header">
							     	<h:outputText value="* " styleClass="mandatory" />
							     	<h:outputText value="#{lbl['lbl.pm.company.type']}" />
							    </f:facet>
							    <h:outputText
										value="#{supportDocBackingBean.getParameterDesc(restrict.restrType)}"
										rendered="#{!restrict.brandNew}" />
						    	<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM"
									value="#{restrict.restrType.parameterId}"
									rendered="#{restrict.brandNew}">
									<f:selectItems  value="#{rejectionReasonBackingBean.companyTypeOptions()}" />
									<p:ajax event="change" update="somAppType" 
										listener="#{rejectionReasonBackingBean.validateUniqueRestrType(ParameterTypeConst.financialOrgRegType)}"/>
								</p:selectOneMenu>
					        </p:column>  
					       	 <p:column width="5%" headerText="#{lbl['lbl.pm.action']}">
	           					<p:commandLink partialSubmit="true" 
									process="@this" action="#{rejectionReasonBackingBean.deleteRestrictions(rejectionReasonBackingBean.restrComp,rowIndex)}"
									update="dtComType" >
									<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
								</p:commandLink>
							</p:column>
					   	</p:dataTable>
				   		
				   		<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.add']}" update="dtComType"
								action="#{rejectionReasonBackingBean.addRestriction(ParameterTypeConst.financialOrgRegType)}"
								partialSubmit="true" process="@this"/>
							
						</div>
					</p:outputPanel>
				</p:tab>
				<!-- Supplier Type -->
				<p:tab id="tSuppType" title="#{lbl['lbl.pm.supplier.type']}" disabled="#{!rejectionReasonBackingBean.managedBean.suppTypeCheck}">  
					
					<p:outputPanel
							rendered="#{rejectionReasonBackingBean.managedBean.suppTypeCheck}">
						<p:dataTable id="dtSuppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
							value="#{rejectionReasonBackingBean.managedBean.suppTypeRestrictions}"							
							var="restrict" rowKey="#{restrict}" rowIndexVar="rowIndex">
							<p:column>
					          	<f:facet name="header">
							     	<h:outputText value="* " styleClass="mandatory" />
							     	<h:outputText value="#{lbl['lbl.pm.supplier.type']}" />
							    </f:facet>  
							    <h:outputText
										value="#{supportDocBackingBean.getParameterDesc(restrict.restrType)}"
										rendered="#{!restrict.brandNew}" />
						    	<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM"
									value="#{restrict.restrType.parameterId}"
									rendered="#{restrict.brandNew}">
									<f:selectItems  value="#{rejectionReasonBackingBean.supplierTypeOptions()}"/>
										<p:ajax event="change" update="somAppType" 
										listener="#{rejectionReasonBackingBean.validateUniqueRestrType(ParameterTypeConst.supplierTypes)}"/>
								</p:selectOneMenu>
					        </p:column>  
				        	 <p:column width="5%" headerText="#{lbl['lbl.pm.action']}">
	           					<p:commandLink partialSubmit="true" 
									process="@this" action="#{rejectionReasonBackingBean.deleteRestrictions(rejectionReasonBackingBean.restrSupp,rowIndex)}"
									update="dtSuppType" >
									<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
								</p:commandLink>
							</p:column> 
					   	</p:dataTable>
					   
				   		<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.add']}" update="dtSuppType"
								action="#{rejectionReasonBackingBean.addRestriction(ParameterTypeConst.supplierTypes)}"
								partialSubmit="true" process="@this"/>
						
						</div>
					</p:outputPanel>
				</p:tab>
			</p:tabView>
			
			
		</p:panel>
	</p:outputPanel>
</ui:composition>
