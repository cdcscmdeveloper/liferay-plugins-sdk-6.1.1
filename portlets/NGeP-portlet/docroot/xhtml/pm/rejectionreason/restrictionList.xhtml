<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>

	<p:outputPanel id="opRestriction">
		<p:panel id="pReasonRestriction" header="#{lbl['lbl.pm.reason.restriction']}" toggleable="true" 
			visible="#{rejectionReasonBackingBean.managedBean.suppReason}">
			<p:tabView widgetVar="tvReasonRestriction" id="tvReasonRestriction" dynamic="false" cache="false" orientation="top">
				<!-- Application Type -->
				<p:tab id="tAppType" title="#{lbl['lbl.pm.application.type']}">  
					<br/>
					<p:dataTable id="dtAppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						value="#{rejectionReasonBackingBean.managedBean.appTypeRestrictions}"
						selection="#{rejectionReasonBackingBean.managedBean.deleteAppTypeRestrictions}"
						var="restrict" rowKey="#{restrict}">
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />
				        <p:column headerText="* #{lbl['lbl.pm.application.type']}">
					    	<p:selectOneMenu id="somAppType"  styleClass="ppDropDownWidthM"
								value="#{restrict.restrType.parameterId}">
								<f:selectItems  value="#{rejectionReasonBackingBean.applicationTypeOptions()}"/>
								<p:ajax event="change" update="somAppType"/>
							</p:selectOneMenu>
				        </p:column>  
				        <p:column headerText="* #{lbl['lbl.pm.status']}">  
				         	<p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{rejectionReasonBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				   	</p:dataTable>
				   	<br/>
			   		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.add']}"  update="dtAppType"
							action="#{rejectionReasonBackingBean.addRestriction(ParameterTypeConst.supplierApplicationTypes)}"
							immediate="true"/>
						&#160;
						<p:commandButton id="cbAppDelete" value="#{lbl['lbl.btn.delete']}" update="dtAppType"
							immediate="true" 
							action="#{rejectionReasonBackingBean.deleteRestrictions(ParameterTypeConst.supplierApplicationTypes)}" /> 
					</div>
				</p:tab>
				<!-- Company Type -->
				<p:tab id="tComType" title="#{lbl['lbl.pm.company.type']}">  
					<br/>
					<p:dataTable id="dtComType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						value="#{rejectionReasonBackingBean.managedBean.comTypeRestrictions}"
						selection="#{rejectionReasonBackingBean.managedBean.deleteComTypeRestrictions}"
						var="restrict" rowKey="#{restrict}">
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />
				        <p:column headerText="* #{lbl['lbl.pm.company.type']}">  
					    	<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM"
								value="#{restrict.restrType.parameterId}">
								<f:selectItems  value="#{rejectionReasonBackingBean.companyTypeOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				        <p:column headerText="* #{lbl['lbl.pm.status']}">  
				            <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{rejectionReasonBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>
				   	</p:dataTable>
			   		<br/>
			   		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.add']}" icon="ui-icon-add"  update="dtComType"
							action="#{rejectionReasonBackingBean.addRestriction(ParameterTypeConst.companyTypes)}"
							immediate="true"/>
						&#160;
						<p:commandButton id="cbComDelete" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" update="dtComType"
							immediate="true"
							action="#{rejectionReasonBackingBean.deleteRestrictions(ParameterTypeConst.companyTypes)}" /> 
					</div>
				</p:tab>
				<!-- Supplier Type -->
				<p:tab id="tSuppType" title="#{lbl['lbl.pm.supplier.type']}">  
					<br/>
					<p:dataTable id="dtSuppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						value="#{rejectionReasonBackingBean.managedBean.suppTypeRestrictions}"
						selection="#{rejectionReasonBackingBean.managedBean.deleteSuppTypeRestrictions}"
						var="restrict" rowKey="#{restrict}">
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />

				        <p:column headerText="* #{lbl['lbl.pm.supplier.type']}">  
					    	<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM"
								value="#{restrict.restrType.parameterId}">
								<f:selectItems  value="#{rejectionReasonBackingBean.supplierTypeOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				        <p:column headerText="* #{lbl['lbl.pm.status']}">  
					        <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{rejectionReasonBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				   	</p:dataTable>
				   	<br/>
			   		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.add']}" icon="ui-icon-add"  update="dtSuppType"
							action="#{rejectionReasonBackingBean.addRestriction(ParameterTypeConst.supplierTypes)}"
							immediate="true"/>
						&#160;
						<p:commandButton id="cbSuppDelete" value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete"  update="dtSuppType"
							immediate="true"
							action="#{rejectionReasonBackingBean.deleteRestrictions(ParameterTypeConst.supplierTypes)}" /> 
					</div>
				</p:tab>
			</p:tabView>
			<br/>
			
		</p:panel>
	</p:outputPanel>
</ui:composition>
