<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	<p:panel id="pRejectReasonResult" header="#{lbl['lbl.pm.rejection.reason.result']}" toggleable="true">
		<p:dataTable id="dtRejectReasonResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			 rowIndexVar="rowIndex" value="#{rejectionReasonBackingBean.pmReasonDescDataModel}" var="reason"  lazy="true">
			<ac:paginator for="dtRejectReasonResult" />
	        <p:column headerText="#{lbl['lbl.pm.reason.code']}">  
		    	#{reason.pmReason.reasonCode}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pm.reason.category']}">  
	            #{rejectionReasonBackingBean.getParameterDesc(ParameterTypeConst.reasonCategory, reason.pmReason.reasonCategoryCode.parameterCode)}
	        </p:column> 
	         <p:column headerText="#{lbl['lbl.pm.reason.desc']}">  
	            #{reason.reasonDesc}
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pm.status']}">  
	            #{(reason.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pm.action']}">  
      		   <p:commandLink action="#{rejectionReasonBackingBean.redirectToMaintainReason(reason.pmReason.reasonId)}" >
					<p:graphicImage value="/css/images/design/edit.png"/>
				</p:commandLink>
	        </p:column>  
	   	</p:dataTable> 
	   	<br/>
	   	<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.create']}"
				action="#{rejectionReasonBackingBean.redirectToMaintainReason(null)}"/>
		</div>
	</p:panel>
</ui:composition>
