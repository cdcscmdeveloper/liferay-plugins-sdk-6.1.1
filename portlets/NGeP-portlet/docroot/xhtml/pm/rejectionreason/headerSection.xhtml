<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:outputPanel id="pRejectReasonHeader">

		<table style="width: 100%">
			<tr>
				<td>
					<div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
							action="#{rejectionReasonBackingBean.redirectToSearchReason}" />
					</div>
				</td>
				<td>
					<div align="right" style="width: 100%">
						<p:commandButton id="btnReasonSave"
							value="#{rejectionReasonBackingBean.managedBean.selectedReason.brandNew? lbl['lbl.btn.save'] : lbl['lbl.btn.update']}"
							action="#{rejectionReasonBackingBean.saveRejectReason()}"
							update="@form" />
					</div>
				</td>
			</tr>
		</table>
	</p:outputPanel>
</ui:composition>
