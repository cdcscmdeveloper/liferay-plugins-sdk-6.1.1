<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<p:outputPanel id="pRejectReasonHeader">
		
		<div class="button-wrapper">
			<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
		    				action="#{rejectionReasonBackingBean.redirectToSearchReason}"/>

	    	<div class="rowBtnRight">
			 	<p:commandButton value="#{rejectionReasonBackingBean.managedBean.selectedReason.brandNew? lbl['lbl.btn.add'] : lbl['lbl.btn.save']}" 
   					action="#{rejectionReasonBackingBean.saveRejectReason()}" update="@([id$=Msg])"/>
	    	</div>
	  	</div>
	</p:outputPanel>
</ui:composition>
