<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="orgSearchPanel" header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<table class="ppTwoTable">
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.reason.ministry']}" />
				</th>
				<td>
					<p:inputText id="ministryCodeName"
						styleClass="ppDisplayTextM" size="60" maxlength="276"
						value="#{rejectionReasonBackingBean.managedBean.ministryCodeName}">
					</p:inputText>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.reason.kumpulan.ptj']}" />
				</th>
				<td>
					<p:inputText id="kumpPtjCodeName"
						styleClass="ppDisplayTextM" size="60" maxlength="276"
						value="#{rejectionReasonBackingBean.managedBean.kumpPtjCodeName}">
					</p:inputText>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.reason.ptj']}" />
				</th>
				<td>
				 	<p:inputText id="ptjCodeName" 
				        styleClass="ppDisplayTextM" size="60" maxlength="276"
						value="#{rejectionReasonBackingBean.managedBean.agencyCodeName}">
					</p:inputText>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{rejectionReasonBackingBean.searchOrganisation}"
							update="@([id$=dtAgencyResult])" process="orgSearchPanel"
							onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
						</p:commandButton>

						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							partialSubmit="true"
							update="@form"
							action="#{rejectionReasonBackingBean.resetOrganisationSearchBean}" >
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
