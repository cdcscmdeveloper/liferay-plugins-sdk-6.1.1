<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="orgSearchPanel"
		header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<table class="ppTwoTable">

			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.reason.ministry']}" /></th>
				<td><p:inputText id="ministryCodeName"
						styleClass="ppDisplayTextM" size="60" maxlength="276"
						value="#{rejectionReasonBackingBean.managedBean.ministryCodeName}"
						label="#{lbl['lbl.pm.reason.ministry']}">
					</p:inputText> <p:message for="ministryCodeName" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.reason.kumpulan.ptj']}" /></th>
				<td><p:inputText id="kumpPtjCodeName"
						styleClass="ppDisplayTextM" size="60" maxlength="276"
						value="#{rejectionReasonBackingBean.managedBean.kumpPtjCodeName}"
						label="#{lbl['lbl.pm.reason.kumpulan.ptj']}">
					</p:inputText> <p:message for="kumpPtjCodeName" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.reason.ptj']}" /></th>
				<td><p:inputText id="ptjCodeName" 
				        styleClass="ppDisplayTextM" size="60" maxlength="276"
						value="#{rejectionReasonBackingBean.managedBean.agencyCodeName}"
						label="#{lbl['lbl.pm.reason.ptj']}">
					</p:inputText> <p:message for="ptjCodeName" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>

			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{rejectionReasonBackingBean.searchOrganisation}"
							update="@([id$=dtAgencyResult])" process="orgSearchPanel">
						</p:commandButton>

						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							partialSubmit="true" process="@this"
							update="orgSearchPanel,@([id$=dtAgencyResult])"
							action="#{rejectionReasonBackingBean.resetOrganisationSearchBean}" />
					</div>

				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
