<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="controllerResult"
		header="#{lbl['lbl.pm.rejection.reason.result']}" toggleable="true">
		<p:dataTable id="searchCtrOfficer" var="ctrlOfficer" rows="10"
			value="#{ctrlBackingBean.searchCtrOfficer}" rowIndexVar="index" lazy="true">

			<ac:paginator for="searchCtrOfficer"></ac:paginator>

			<p:column headerText="#{lbl['lbl.pm.ctrl.code']}" style="width :25%">
				<h:outputText value="#{ctrlOfficer.ctrlOfficerCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.ctrl.description']}" style="width :60%">
				<h:outputText value="#{ctrlOfficer.description}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.status']}" style="width :15%">  
	            #{(ctrlOfficer.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	         </p:column>
		</p:dataTable>

	</p:panel>
	
</ui:composition>
