<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="ctrlSearchPanel"
		header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<br />
		<table class="ppTwoTable">

			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.ctrl.code']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" maxlength="10"
						value="#{ctrlBackingBean.managedBean.controllerSearchBean.ctrlCode}" />
				</td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.ctrl.description']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM"
						value="#{ctrlBackingBean.managedBean.controllerSearchBean.ctrlDescription}"
						cols="50" rows="5" maxlength="50" autoResize="false" /></td>
						<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.status']}" />
				</th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM"  
				label="#{lbl['lbl.pm.status']}"
						value="#{ctrlBackingBean.managedBean.controllerSearchBean.status}">
						<f:selectItems
							value="#{ctrlBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							update="searchCtrOfficer" process="ctrlSearchPanel" 
							action="#{ctrlBackingBean.searchCtrOfficer}" />
						&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							update=":form:ctrlSearchPanel,:form:searchCtrOfficer" 
							action="#{ctrlBackingBean.resetCtrlSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
