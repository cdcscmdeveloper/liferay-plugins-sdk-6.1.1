<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="glAccountPanel" header="#{lbl['lbl.pm.gl.account.search.location']}" toggleable="true" >

		<table class="ppTwoTable">
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.gl.account.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{glAccountBackingBean.managedBean.glAccountSearchBean.accountCode}"
						id="glaccountCode" size="28" /></td>			
				
				<td width="1%"><p:outputLabel value="#{lbl['lbl.pm.gl.description']}"></p:outputLabel></td>
				<td width="17%"><p:inputText
						value="#{glAccountBackingBean.managedBean.glAccountSearchBean.accountName}"
						size="50" /></td>
				<th>&#160;</th>
				<td>&#160;</td>				
			</tr>			
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.gl.account.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{glAccountBackingBean.managedBean.glAccountSearchBean.status}">
						<f:selectItems value="#{glAccountBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{glAccountBackingBean.searchGlAccount}"
							update=":form:glAccountResult" />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{glAccountBackingBean.resetGlAccountSearchBean}"
							process="@this"
							update=":form:glAccountPanel, :form:glAccountResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
