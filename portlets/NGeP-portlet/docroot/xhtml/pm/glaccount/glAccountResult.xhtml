<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="glAccountResult" header="#{lbl['lbl.pm.gl.account.search.result']}"
		toggleable="true">
		<p:dataTable id="glAccountSR"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{glAccountBackingBean.searchGlAccount}" rows="10"
			var="glAccountList" rowIndexVar="index" lazy="true">
			<ac:paginator for="glAccountSR" />

			<p:column headerText="#{lbl['lbl.pm.gl.account.code']}" style="width:7%">
				<h:outputText value="#{glAccountList.glAccCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.gl.account.desc']}" style="width:46%">
				<h:outputText value="#{glAccountList.description}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.gl.account.kumpulan.ptj']}" style="width:40%">
				
				<h:outputText value="#{(glAccountList.pmOrgProfile.pmOrgValidity.orgCode)}" />
				<p:spacer width="1%"></p:spacer>
				<h:outputText value="#{glAccountList.pmOrgProfile.pmOrgValidity.orgName}" />
				
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:7%"> 
   	    #{(glAccountList.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
