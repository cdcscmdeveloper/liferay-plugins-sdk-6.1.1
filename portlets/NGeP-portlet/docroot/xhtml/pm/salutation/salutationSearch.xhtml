<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="salPanel" header="#{lbl['lbl.pm.search.location']}" toggleable="true" >
  
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.sa.code']}"></h:outputLabel></th>
				<td><p:inputText maxlength="10"
						value="#{salutationBackingBean.managedBean.salutationCodes}"
						id="salutationCode" size="30" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><h:outputLabel value="#{lbl['lbl.pm.sa.name']}"></h:outputLabel></th>
				<td><p:inputText maxlength="100"
						value="#{salutationBackingBean.managedBean.salutationNames}"
						size="30" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.search.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{salutationBackingBean.managedBean.status}">
						<f:selectItems value="#{salutationBackingBean.getStatusList()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="2" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{salutationBackingBean.retrieveSalutation}"
							update=":form:salutationSR" />
                       
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{salutationBackingBean.resetSalSearch}"
							update=":form:salPanel, :form:salutationSR" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
