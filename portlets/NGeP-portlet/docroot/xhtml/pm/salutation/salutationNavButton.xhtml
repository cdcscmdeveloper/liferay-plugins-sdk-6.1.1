<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:commandButton value="#{lbl['lbl.btn.back']}"
		action="#{salutationBackingBean.redirectSalSearch()}"
		style="float:left;" />
	<p:commandButton
		value="#{salutationBackingBean.managedBean.pmSalutation.brandNew? lbl['lbl.btn.create'] : lbl['lbl.btn.update']}"
		style="float:right;"
		action="#{salutationBackingBean.saveSaluationDtls}" />

	<p:messages id="saluation" showDetail="true" autoUpdate="true"
		closable="true" showSummary="true"></p:messages>
</ui:composition>
