<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel id="salutationSearch" header="SEARCH" toggleable="true">
		
	<h:panelGrid style="width:100%;">
	</h:panelGrid>
	
	 <ui:include src="/xhtml/pm/salutation/salutationSearch.xhtml" />
			
      <div align="right">
			<p:commandButton value="#{lbl['lbl.btn.search']}" icon="ui-icon-search" 
							 action="#{salutationBackingBean.retrieveSalutation}"
						     update="salutationSR" process="salutationSearch"/>
            <p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset"
            				 type="reset" actionListener="#{salutationBackingBean.resetSalSearch}"
            				 process="@this" update="salPanel" />
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel id="salutationResult" header="RESULT" toggleable="true">
	<p:dataTable id="salutationSR" value="#{salutationBackingBean.salutationDataModel}"
				var="salutationList" rowIndexVar="index" lazy="true">	
	   <ac:paginator for="salutationSR" />
		
       <p:column headerText="#{lbl['lbl.pm.sa.code']}" style="width:15%"> 
		<h:outputText value="#{salutationList.salutationCode}" />      
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.sa.name']}" style="width:70%"> 
		<h:outputText value="#{salutationList.salutationName}" />
       </p:column>       
     
       <p:column headerText="#{lbl['lbl.pm.search.status']}" style="width:10%"> 
   	    #{(salutationList.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column >
        
    	<p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}" style="width:5%">
   		 <p:commandLink action="#{salutationBackingBean.goToMaintaincePage(salutationList)}" process="@this" partialSubmit="true">
     		<p:graphicImage library="ep/images/design" name="edit.png"
     		 value="/resources/ep/images/design/edit.png" />
    	 </p:commandLink>
   	 	</p:column>    
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="#{lbl['lbl.btn.create']}" action="#{salutationBackingBean.createSalutation}" 
      				   style="float:right;" icon="ui-icon-add" />
	
	 </h:panelGrid>	
	</p:panel>
</ui:composition>
