<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.pm.header.general.org.control']}"
		toggleable="true">
		<h:panelGrid columns="2" rendered="#{organisationBackingBean.managedBean.orgType eq 'FPJ'}">				
			<h:outputLabel value="#{lbl['lbl.pm.org.ministryName']}"></h:outputLabel>
			<p:inputText label="#{lbl['lbl.pm.org.ministryName']}" size="50"
				value="#{organisationBackingBean.retrieveMinistryName()}"
				styleClass="ppDisplayTextL" disabled="true" />
			<p:outputLabel value="#{lbl['lbl.pm.org.pegawai.pegawal']}" />
			<p:inputText label="#{lbl['lbl.pm.org.pegawai.pegawal']}" size="50"
				value="#{organisationBackingBean.retrievePegawaiPengawalName()}"
				styleClass="ppDisplayTextL" disabled="true" />	
			<p:outputLabel value="#{lbl['lbl.pm.organisation.ptjGroup']}" />
			<p:inputText label="#{lbl['lbl.pm.organisation.ptjGroup']}" size="50"
				value="#{organisationBackingBean.retrieveJabatanName()}"
				styleClass="ppDisplayTextL" disabled="true" />
			<h:outputLabel value="#{lbl['lbl.pm.organisation.businessArea']}"></h:outputLabel>
			<p:inputText label="#{lbl['lbl.pm.organisation.businessArea']}" size="50"
				value="#{organisationBackingBean.managedBean.orgProfile.pmAgOffice.officeName}"
				styleClass="ppDisplayTextL" disabled="true" />
		</h:panelGrid>
		<h:panelGrid columns="2" rendered="#{organisationBackingBean.managedBean.orgType eq 'FJA'}">
				<h:outputLabel value="#{lbl['lbl.pm.org.ministryName']}"></h:outputLabel>
				<p:inputText label="#{lbl['lbl.pm.org.ministryName']}" size="50"
					value="#{organisationBackingBean.managedBean.orgProfile.parentOrgProfile !=null and
					organisationBackingBean.managedBean.orgProfile.parentOrgProfile.parentOrgProfile !=null ?
					organisationBackingBean.managedBean.orgProfile.parentOrgProfile.parentOrgProfile.orgName : ''}"
					styleClass="ppDisplayTextL" disabled="true" />
				<h:outputLabel value="#{lbl['lbl.pm.org.pegawai.pegawal']}"></h:outputLabel>
				<p:inputText label="#{lbl['lbl.pm.org.pegawai.pegawal']}" size="50"
					value="#{organisationBackingBean.managedBean.orgProfile.parentOrgProfile !=null ?
					organisationBackingBean.managedBean.orgProfile.parentOrgProfile.orgName : ''}"
					styleClass="ppDisplayTextL" disabled="true" />
		</h:panelGrid>
		<h:panelGrid columns="2" rendered="#{organisationBackingBean.managedBean.orgType eq 'FPP'}">
				<h:outputLabel value="#{lbl['lbl.pm.org.ministryName']}"></h:outputLabel>
				<p:selectOneMenu disabled="#{(organisationBackingBean.managedBean.orgProfile.recordStatusFlg == 1 )? 'false': 'true'}"
					label="#{lbl['lbl.pm.org.ministryName']}" 
					value="#{organisationBackingBean.managedBean.orgProfile.parentOrgProfile.orgProfileId}"
					styleClass="ppDropDownWidthL" style="width: 335px;margin-bottom: 5px;"
					required="true" id="ministryNameSelect">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="orgProfileLs"
						value="#{organisationBackingBean.managedBean.orgProfileList}"
						itemLabel="#{orgProfileLs.pmOrgValidity.orgName}"
						itemValue="#{orgProfileLs.orgProfileId}" />
					<p:ajax event="change" partialSubmit="true" process="@this" 
						listener ="#{organisationBackingBean.resetProfileGroup()}"/> 
				</p:selectOneMenu>
		</h:panelGrid>
	</p:panel>
</ui:composition>
