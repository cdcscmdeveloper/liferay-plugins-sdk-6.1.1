<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.pm.header.general.org.control']}" 
		toggleable="true" >
		<h:panelGrid columns="2">

			<p:outputLabel value="#{lbl['lbl.pm.organisation.ptjGroup']}" />
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.orgProfile.pmPtjGroup.ptjGroupId}"
				style="margin-bottom: 5px;">
				<f:selectItem itemValue="0" itemLabel="---Select---" />
				<f:selectItems var="ptjLs"
					value="#{organisationBackingBean.managedBean.ptjGroup}"
					itemLabel="#{ptjLs.groupName}" itemValue="#{ptjLs.groupCode}" />

			</p:selectOneMenu>

			<h:outputLabel value="#{lbl['lbl.pm.organisation.businessArea']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.orgProfile.pmAgOffice.agOfficeId}"
				required="true" style="margin-bottom: 5px;">
				<f:selectItem itemValue="0" itemLabel="---Select---" />
				<f:selectItems var="agOfficeLs"
					value="#{organisationBackingBean.managedBean.agOffice}"
					itemLabel="#{agOfficeLs.officeName}" itemValue="#{agOfficeLs.officeCode}" />

			</p:selectOneMenu>

			<h:outputLabel value="#{lbl['lbl.pm.organisation.parent']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.orgProfile.parentOrgProfile.orgProfileId}"
				required="true" style="margin-bottom: 5px;">
				<f:selectItem itemValue="0" itemLabel="---Select---" />
				<f:selectItems var="orgProfileLs"
					value="#{organisationBackingBean.managedBean.pmOrgProfile}"
					itemLabel="#{orgProfileLs.pmOrgValidity.orgName}" itemValue="#{orgProfileLs.pmOrgValidity.orgCode}" />

			</p:selectOneMenu>


		</h:panelGrid>

	</p:panel>

</ui:composition>
