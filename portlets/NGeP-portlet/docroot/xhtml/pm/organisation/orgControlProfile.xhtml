<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.pm.header.general.org.control']}" 
		toggleable="true" >
		<h:panelGrid columns="2">

			<p:outputLabel value="#{lbl['lbl.pm.organisation.ptjGroup']}" />
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.ptjGroupId}" styleClass="ppDropDownWidthL"
				style="margin-bottom: 5px;" disabled="true">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
				<f:selectItems var="ptjLs"
					value="#{organisationBackingBean.managedBean.ptjGroup}"
					itemLabel="#{ptjLs.groupName}" itemValue="#{ptjLs.ptjGroupId}" />

			</p:selectOneMenu>

			<h:outputLabel value="#{lbl['lbl.pm.organisation.businessArea']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.agOfficeId}" styleClass="ppDropDownWidthL" disabled="true"
				 style="margin-bottom: 5px;">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
				<f:selectItems var="agOfficeLs"
					value="#{organisationBackingBean.managedBean.agOffice}"
					itemLabel="#{agOfficeLs.officeName}" itemValue="#{agOfficeLs.agOfficeId}" />

			</p:selectOneMenu>

			<h:outputLabel value="#{lbl['lbl.pm.organisation.parent']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.orgProfile.parentOrgProfile.orgProfileId}" styleClass="ppDropDownWidthL"
				 style="margin-bottom: 5px;" required="true">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
				<f:selectItems var="orgProfileLs"
					value="#{organisationBackingBean.managedBean.orgProfileList}"
					itemLabel="#{orgProfileLs.pmOrgValidity.orgName}" itemValue="#{orgProfileLs.orgProfileId}" />

			</p:selectOneMenu>


		</h:panelGrid>

	</p:panel>

</ui:composition>
