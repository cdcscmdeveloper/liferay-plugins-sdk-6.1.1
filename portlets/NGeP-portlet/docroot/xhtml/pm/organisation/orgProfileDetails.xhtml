<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<script type="text/javascript">
		function firstDayEnabled(date){
			if (date.getDate() == 1) {
		           return [true, ''];
		     }
		     return [false, ''];
		}
	 </script>
	<p:panel id="orgProfileOrgTypePanel">
		<table class="ppOneTable">
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.org.category']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></th>
				<td><p:selectOneRadio id="orgCatergoryId" value="#{organisationBackingBean.managedBean.orgCategory}" disabled="#{!organisationBackingBean.managedBean.orgProfile.brandNew}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.federal.government']}" itemValue="#{organisationBackingBean.federalGovt}"/>
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}" itemValue="#{organisationBackingBean.others}"/>
						<p:ajax process="@this" event="change" partialSubmit="true" update="orgtypeId" />
					</p:selectOneRadio></td>			
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><c:choose>
						<c:when
							test="#{!organisationBackingBean.managedBean.orgProfile.brandNew}">
							<p:selectOneMenu id="orgtypeId" styleClass="ppDropDownWidthM"
								disabled="true" label="#{lbl['lbl.pm.organisation.orgType']}"
								value="#{organisationBackingBean.managedBean.orgTypeId}"
								style="width: 275px;margin-bottom: 5px;">
								<f:selectItems
									value="#{organisationBackingBean.getAllOrgTypeDropdownValues(ParameterTypeConst.organisationTypes)}" />
							</p:selectOneMenu>
						</c:when>
						<c:otherwise>
							<p:outputPanel id="orgtypeId">
								<p:selectOneMenu id="newOrgTypeFederalList"
									rendered="#{organisationBackingBean.managedBean.orgCategory eq organisationBackingBean.federalGovt}" 
									styleClass="ppDropDownWidthL" required="true" label="#{lbl['lbl.pm.organisation.orgType']}" 
									style="width:275px;margin-bottom:5px;"
									value="#{organisationBackingBean.managedBean.orgTypeId}">
									<f:selectItems
										value="#{organisationBackingBean.getNewOrgTypeDropdownValues()}" />
									<p:ajax event="change" update="@form"
										listener="#{organisationBackingBean.resetOrgProfile}" />
								</p:selectOneMenu>
							
								<p:selectOneMenu id="newOrgTypeOtherList" 
									rendered="#{organisationBackingBean.managedBean.orgCategory eq organisationBackingBean.others}" 
									styleClass="ppDropDownWidthL"
									label="#{lbl['lbl.pm.organisation.orgType']}"
									value="#{organisationBackingBean.managedBean.orgTypeId}"
									style="width: 275px;margin-bottom: 5px;" required="true">
									<f:selectItems
										value="#{organisationBackingBean.getNewOrgTypeDropdownValues()}" />
									<p:ajax event="change" update="@form"
										listener="#{organisationBackingBean.resetOrgProfile}" />
								</p:selectOneMenu>
							</p:outputPanel>
						</c:otherwise>
					</c:choose></td>
				<td><p:message id="orgtypeMsg" for="orgtypeId" display="icon" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.pm.header.general.org.profile']}"
		id="orgproflieId" styleClass="sampleDetails" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgCode']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>				
						<td><p:inputText id="orgCode" disabled="#{!organisationBackingBean.managedBean.orgProfile.brandNew}"
								label="#{lbl['lbl.pm.organisation.orgCode']}" size="50"
								styleClass="ppDisplayTextL"
								value="#{organisationBackingBean.managedBean.orgProfile.pmOrgValidity.orgCode}"
								maxlength="20" required="#{!empty param['disableValidation']}" /></td>
						<td><p:message id="orgCodeMsg" for="orgCode" display="icon" /></td>					
				<ui:fragment
					rendered="#{organisationBackingBean.managedBean.orgType eq 'FPJ' and not organisationBackingBean.isGroupOrg()}">
					<td><h:outputText
							value="#{lbl['lbl.pm.org.jabatan']}" /></td>
					<td><p:selectBooleanCheckbox id="isPTJCheckBoxId"
							value="#{organisationBackingBean.managedBean.orgProfile.groupOrg}">
							<p:ajax update="@form" />
						</p:selectBooleanCheckbox></td>
				</ui:fragment>
				<ui:fragment
					rendered="#{!organisationBackingBean.managedBean.orgProfile.brandNew and (organisationBackingBean.managedBean.orgType eq 'FPJ' )}">
					<td><h:outputText
							value="#{lbl['lbl.pm.organisation.govSeller']}" /></td>
					<td><p:selectBooleanCheckbox id="isGovtSellerCheckBoxId"
							disabled="#{organisationBackingBean.managedBean.orgProfile.brandNew}"
							value="#{organisationBackingBean.managedBean.orgProfile.govtSeller}">
							<p:ajax update="@form" />
						</p:selectBooleanCheckbox></td>
				</ui:fragment>
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.pm.organisation.orgName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				
						<td><p:inputText id="orgName" disabled="#{organisationBackingBean.managedBean.orgType eq 'FPJ' or organisationBackingBean.managedBean.orgType eq 'FJA'}"
								label="#{lbl['lbl.pm.organisation.orgName']}"
								value="#{organisationBackingBean.managedBean.orgProfile.pmOrgValidity.orgName}"
								required="#{!empty param['disableValidation']}" size="50" styleClass="ppDisplayTextL"
								maxlength="99" /></td>
						<td><p:message id="orgNameMsg" for="orgName" display="icon" /></td>					
			</tr>
			<ui:fragment
				rendered="#{organisationBackingBean.managedBean.orgType eq 'RHQ' or organisationBackingBean.managedBean.orgType eq 'RSH'or organisationBackingBean.managedBean.orgType eq 'RSQ' }">
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.pm.zone.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="zoneCode"
							label="#{lbl['lbl.pm.zone.name']}" styleClass="ppDropDownWidthM"
							value="#{organisationBackingBean.managedBean.orgProfile.pmZone.zoneId}"
							required="#{organisationBackingBean.managedBean.orgType eq 'RHQ' or organisationBackingBean.managedBean.orgType eq 'RSH'or organisationBackingBean.managedBean.orgType eq 'RSQ'}"
							style="width: 300px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="zoneLs"
								value="#{organisationBackingBean.managedBean.zoneList}"
								itemLabel="#{zoneLs.zoneName}" itemValue="#{zoneLs.zoneId}" />

						</p:selectOneMenu></td>
					<td><p:message id="zoneCodeMsg" for="zoneCode" display="icon" /></td>
				</tr>
			</ui:fragment>
			<ui:fragment
				rendered="#{organisationBackingBean.managedBean.orgType eq 'FPJ' }">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.org.gst.reg.no']}" /> </td>
				<td>
				<ui:fragment rendered="#{organisationBackingBean.managedBean.orgProfile.govtSeller}">
				<p:inputText id="gstRegNoId" 
						label="#{lbl['lbl.pm.org.gst.reg.no']}"
						value="#{organisationBackingBean.managedBean.gstSupplier.gstRegNo}"
						size="50" styleClass="ppDisplayTextL"
						maxlength="12" >						
				</p:inputText>				
				</ui:fragment>	
				<ui:fragment rendered="#{!(organisationBackingBean.managedBean.orgProfile.govtSeller)}">
				<p:inputText id="gstRegId" 
						disabled="true" 
						label="#{lbl['lbl.pm.org.gst.reg.no']}"
						value="#{lbl['lbl.pm.org.gst.na']}"
						size="50" styleClass="ppDisplayTextL"
						/>
				</ui:fragment>				
				</td>
				<td><p:message id="gstRegNoIdMsg" for="gstRegNoId" display="icon" /></td>
				<td><ac:iconTooltip value="#{lbl['lbl.pm.org.gst.reg.no.tooltip']}" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.org.gst.eff.date']}" /> </td>
				<td>
				<ui:fragment rendered="#{organisationBackingBean.managedBean.orgProfile.govtSeller}">
				<p:calendar id="gstEffDateId"  beforeShowDay="firstDayEnabled"					
					value="#{organisationBackingBean.managedBean.gstSupplier.gstEffDate}" 
					mindate="#{ProfileManagementConst.gstMinDate}"
					navigator="true"
					disabled="#{!(organisationBackingBean.managedBean.orgProfile.govtSeller)}"					
					label="#{lbl['lbl.pm.org.gst.eff.date']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
				</ui:fragment>
				<ui:fragment rendered="#{!(organisationBackingBean.managedBean.orgProfile.govtSeller)}">
				<p:inputText id="gstEffDate" 
						disabled="true" 
						label="#{lbl['lbl.pm.org.gst.eff.date']}"
						value=" "
						size="25" styleClass="ppDisplayTextL"
						/>
				</ui:fragment>
				<ac:iconTooltip value="#{lbl['lbl.pm.org.gst.eff.date.tooltip']}" />
				</td>
				<td></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.org.gst.end.date']}" /> </td>
				<ui:fragment rendered="#{organisationBackingBean.managedBean.orgProfile.govtSeller}">
				<td><p:calendar id="gstEndDateId"  beforeShowDay="firstDayEnabled"					
					value="#{organisationBackingBean.managedBean.gstSupplier.gstEndDate}" 
					mindate="#{ProfileManagementConst.gstMinDate}"
					navigator="true"
					disabled="#{!(organisationBackingBean.managedBean.orgProfile.govtSeller)}"					
					label="#{lbl['lbl.pm.org.gst.end.date']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar></td>
				</ui:fragment>
				<ui:fragment rendered="#{!(organisationBackingBean.managedBean.orgProfile.govtSeller)}">
				<td><p:inputText id="gstEndDate" 
						disabled="true" 
						label="#{lbl['lbl.pm.org.gst.end.date']}"
						value=" "
						size="25" styleClass="ppDisplayTextL"
						/></td>
				</ui:fragment>
				<td></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.org.gst.declare.date']}" /> </td>			
				<td><p:inputText id="gstDeclareDateId" 
						disabled="true" 
						label="#{lbl['lbl.pm.org.gst.declare.date']}"
						value="#{organisationBackingBean.managedBean.gstSupplier.gstDeclaredDate}"
						size="25" styleClass="ppDisplayTextL">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>				
				<td></td>
			</tr>
			</ui:fragment>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.organisation.status']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="orgStatus"
						styleClass="ppDropDownWidthM" 
						label="#{lbl['lbl.pm.organisation.status']}"
						disabled="#{organisationBackingBean.managedBean.orgProfile.brandNew or organisationBackingBean.managedBean.orgType eq 'FPJ' or organisationBackingBean.managedBean.orgType eq 'FJA'}"
						value="#{organisationBackingBean.managedBean.orgProfile.recordStatusFlg}"
						required="#{!empty param['disableValidation']}" style="margin-bottom: 5px;">
						<f:selectItems
							value="#{organisationBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<td><p:message id="orgStatusMsg" for="orgStatus" display="icon" /></td>
			</tr>
		</table>
	</p:panel>
	<ui:fragment
		rendered="#{organisationBackingBean.managedBean.orgType eq 'FPJ' or organisationBackingBean.managedBean.orgType eq 'FJA' or organisationBackingBean.managedBean.orgType eq 'FPP'}">
		<ui:include src="/xhtml/pm/organisation/orgControlProfile.xhtml" />
	</ui:fragment>
	<p:panel header="#{lbl['lbl.pm.header.general.org.address']}"
		toggleable="true">
		<p:tabView>
			<p:tab title="#{lbl['lbl.pm.header.general.org.office']}">
				<ui:include src="/xhtml/pm/organisation/orgOfficeAddress.xhtml" />
			</p:tab>
		<p:tab title="#{lbl['lbl.pm.header.general.org.delivery']}"
				rendered="#{organisationBackingBean.managedBean.orgType eq 'FPJ'}">
				<ui:include src="/xhtml/pm/organisation/orgDeliveryAddres.xhtml" />
			</p:tab>
		</p:tabView>
	</p:panel>


</ui:composition>
