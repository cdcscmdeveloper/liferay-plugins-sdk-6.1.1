<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.pm.organisation.result']}" 
		toggleable="true">
		<p:dataTable id="searchOrganisation" var="organisation" rows="10"
			value="#{organisationBackingBean.searchOrganisation}"
			rowIndexVar="index" lazy="true">

			<ac:paginator for="searchOrganisation"></ac:paginator>

			<p:column headerText="#{lbl['lbl.pm.organisation.orgCode']}"
				style="width :15%">
				<h:outputText value="#{organisation.pmOrgValidity.orgCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.organisation.orgName']}"
				style="width :60%">
				<h:outputText value="#{organisation.pmOrgValidity.orgName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.status']}" style="width :20%">  
	            #{(organisation.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	         </p:column>
			<p:column headerText="#{lbl['lbl.pm.organisation.action']}"
				style="width :5%;text-align:center;">
				<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
					action="#{organisationBackingBean.redirectToOrganisation(organisation.orgProfileId)}"
					update="@form">
					<p:graphicImage 
						title="#{lbl['lbl.pm.org.edit']}"
						value="/css/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton id="addOrgProfileBtnId" partialSubmit="true" process="@this"
			value="#{lbl['lbl.pm.create.location']}" 
			action="#{organisationBackingBean.redirectToOrganisation(null)}"
			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"  />
	</div>
</ui:composition>
