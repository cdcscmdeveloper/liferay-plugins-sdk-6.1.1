<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="orgMessages" showDetail="true" showSummary="false" autoUpdate="#{organisationBackingBean.managedBean.showParentMsg}"
			closable="true" severity="error,info"></p:messages>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<div class="header-spacing">	
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton id="orgBackBtnId" value="#{lbl['lbl.btn.back']}" immediate="true"
						update=":form" process="@this"
						action="#{organisationBackingBean.backToSearch}"
						style="float:left;"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" /></td>
				<td><p:commandButton id="orgCreateBtnId" value="#{lbl['lbl.btn.save']}" 
						action="#{organisationBackingBean.saveOrganization('SAVE')}" 
						update="@([id$=Msg])"  style="float:right;"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						rendered ="#{organisationBackingBean.managedBean.orgProfile.brandNew}">
						 <f:param name="disableValidation" value="true" /> 
					</p:commandButton>
					<p:commandButton id="orgUpdateBtnId" value="#{lbl['lbl.btn.update']}" 
						action="#{organisationBackingBean.saveOrganization('UPDATE')}" 
						update="@form"  style="float:right;"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						rendered ="#{!organisationBackingBean.managedBean.orgProfile.brandNew}"
					> <f:param name="disableValidation" value="true" /> 
					</p:commandButton>
				</td>
			</tr>
		</table>
		</div>		
		<!-- <c:if
			test="#{!organisationBackingBean.managedBean.orgProfile.brandNew}">
			<ui:include src="orgProfileHeader.xhtml" />
		</c:if> -->
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{organisationBackingBean.managedBean.selectedTabIndex}"
						>

						<p:menuitem value="#{lbl['lbl.pm.sidemenu.general.org.profile']}"
							update="@form">
							<f:param name="disableValidation" value="" />
							<f:setPropertyActionListener
								target="#{organisationBackingBean.managedBean.selectedTabIndex}"
								value="#{organisationBackingBean.profileDetails}" />
						</p:menuitem>
						<p:menuitem partialSubmit="true" 
							value="#{lbl['lbl.pm.sidemenu.general.org.govSeller']}" rendered="#{organisationBackingBean.managedBean.orgProfile.govtSeller and (ParameterConst.orgTypePtj eq organisationBackingBean.managedBean.orgType)}"
							update="@form">
							<f:param name="disableValidation" value="" />
							<f:setPropertyActionListener
								target="#{organisationBackingBean.managedBean.selectedTabIndex}"
								value="#{organisationBackingBean.governmentSeller}" />
						</p:menuitem>
						<p:menuitem partialSubmit="true"
							value="#{lbl['lbl.pm.sidemenu.general.org.resProfile']}" 
							rendered="#{not empty organisationBackingBean.managedBean.orgProfile.groupOrgType and
									ParameterConst.orgAuthTypeOrgGroup eq organisationBackingBean.managedBean.orgProfile.groupOrgType}"
							update="@form">
							<f:param name="disableValidation" value="" />
							<f:setPropertyActionListener
								target="#{organisationBackingBean.managedBean.selectedTabIndex}"
								value="#{organisationBackingBean.managedBean.orgProfile.govtSeller ? 2 : 1 }"  />
						</p:menuitem>

					</p:tabMenu></td>
				<td width="80%" valign="top"><p:outputPanel
						rendered="#{organisationBackingBean.managedBean.selectedTabIndex == organisationBackingBean.profileDetails}">
						<ui:include src="orgProfileDetails.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{organisationBackingBean.managedBean.orgProfile.govtSeller and organisationBackingBean.managedBean.selectedTabIndex == organisationBackingBean.governmentSeller and (ParameterConst.orgTypePtj eq organisationBackingBean.managedBean.orgType)}">
						<ui:include src="orgGovernmentSeller.xhtml" />
					</p:outputPanel> <p:outputPanel
						rendered="#{organisationBackingBean.managedBean.selectedTabIndex == (organisationBackingBean.managedBean.orgProfile.govtSeller ? 2: 1)}">
						<ui:include src="orgResponsibleProfile.xhtml" />
					</p:outputPanel></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
