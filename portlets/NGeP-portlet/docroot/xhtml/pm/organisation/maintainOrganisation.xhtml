<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error,info"></p:messages>
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true"
						icon="ui-icon-back" update=":form" process="@this"
						action="#{organisationBackingBean.backToSearch}"
						style="float:left;" /></td>
				<td><p:commandButton value="Save"
						action="#{organisationBackingBean.saveOrganization}"
						update="@([id$=Msg])" icon="ui-icon-save" style="float:right;" /></td>
			</tr>


		</table>
		<c:if
			test="#{!organisationBackingBean.managedBean.orgProfile.brandNew}">
			<ui:include src="orgProfileHeader.xhtml" />
		</c:if>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						styleClass="sidemenu"
						activeIndex="#{organisationBackingBean.managedBean.organisationActiveIndex}"
						style="display : table-caption;">
						<p:menuitem value="#{lbl['lbl.pm.sidemenu.general.org.profile']}"
							action="#{organisationBackingBean.getProfileDetails}"
							update="@form" />
						<p:menuitem
							value="#{lbl['lbl.pm.sidemenu.general.org.govSeller']}"
							action="#{organisationBackingBean.getGovernmentSeller}"
							rendered="#{organisationBackingBean.managedBean.orgProfile.govtSeller}"
							update="@form" />
						<p:menuitem
							value="#{lbl['lbl.pm.sidemenu.general.org.resProfile']}"
							action="#{organisationBackingBean.getResponsibleProfile}"
							rendered="#{organisationBackingBean.managedBean.orgProfile.groupOrg}"
							update="@form" />

					</p:tabMenu></td>
				<td width="80%" valign="top"><c:if
						test="#{organisationBackingBean.managedBean.organisationActiveIndex eq '0'}">
						<ui:include src="orgProfileDetails.xhtml" />
					</c:if> <c:if
						test="#{organisationBackingBean.managedBean.organisationActiveIndex eq '1'}">
						<ui:include src="orgGovernmentSeller.xhtml" />
					</c:if> <c:if
						test="#{organisationBackingBean.managedBean.organisationActiveIndex eq '2'}">
						<ui:include src="orgResponsibleProfile.xhtml" />
					</c:if></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
