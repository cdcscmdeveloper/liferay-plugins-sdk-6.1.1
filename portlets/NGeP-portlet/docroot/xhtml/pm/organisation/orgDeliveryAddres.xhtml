<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel >

		<p:dataTable id="deliveryAddressId"
			value="#{organisationBackingBean.managedBean.addressTypesList}" widgetVar="deliveryAddres"
			var="address" rowIndexVar="index" rowKey="#{address}" selection="#{organisationBackingBean.managedBean.selectedAddressTypes}">
			<ac:paginator for="deliveryAddressId" />
			<p:column selectionMode="multiple" disabledSelection="#{!address.brandNew}"
				 style="width:2%" />
			<!-- <p:column headerText="#{lbl['lbl.pm.address.address']}">
				<h:outputText value="#{address.pmAddress.address1}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.address.district']}"
				style="width : 15%">
				<h:outputText value="#{address.pmAddress.pmDistrict.districtName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.address.state']}"
				style="width : 15%">
				<h:outputText value="#{address.pmAddress.pmState.stateName}" />
			</p:column> -->
			 <p:column headerText="#{lbl['lbl.pm.address.address']}" style="white-space:normal;">
				<h:outputText value="#{organisationBackingBean.getFullAddress(address.pmAddress)}" />
			</p:column>
				<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu styleClass="ppDropDownWidthS"  label="#{lbl['lbl.pm.financialorg.status']}"
					disabled="#{address.brandNew}"
					value="#{address.recordStatusFlg}" required="true"
					style="width: 135px;margin-bottom: 5px;">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>

			</p:column>
			<p:column>
				<p:commandLink oncomplete="addressPopup.show();"
					actionListener="#{organisationBackingBean.editDeliveryAddress(address)}"
					update="@([id$=deliveryAddressDialog])"								
					style="padding-right:5px">
					<p:graphicImage 
						value="/css/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this"
				oncomplete="addressPopup.show();" update="@([id$=deliveryAddressDialog])"	
				actionListener="#{organisationBackingBean.addDeliveryAddr}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				actionListener="#{organisationBackingBean.deleteSelectedAdddress}"
				update="deliveryAddressId,deliveryAddressDialog" process="@this,deliveryAddressId"
				partialSubmit="true" />
		</div>

	</p:panel>
	<p:dialog header="#{lbl['lbl.pm.header.general.org.delivery']}" widgetVar="addressPopup" id="deliveryAddressDialog" resizable="false"
		modal="true" width="900" height="450">

		<p:panel header="#{lbl['lbl.pm.header.general.org.delivery']}" toggleable="true" >
			<p:messages id="deliveryAddressMessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
			<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="addressname"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.address.name']}" maxlength="80"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.addressName}"
							size="35" /></td>
					<td><p:message for="addressname" id="addressnameMsg"
							display="icon" /></td>

					<td></td>
				</tr>
			<tr>
				<td width="120">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" />
				</td>				
				<td width="220">
					<p:selectOneMenu id="dCountry" styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.address.country']}" disabled="true"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCountry.countryId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{organisationBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />
					</p:selectOneMenu>
				</td>
				<td><p:message for="dCountry" id="dCountryMsg" display="icon" /></td>
				<td width="150">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td width="220">
					<p:selectOneMenu id="dState" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
						  value="#{organisationBackingBean.getStateList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCountry.countryId)}" 
						  var="state" itemLabel="#{state.stateName}"
						  itemValue="#{state.stateId}"/>
						<p:ajax event="change" update="dDistrict, dDivision, dCity" 
						 	listener="#{organisationBackingBean.retrieveDeliveryPmState(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState)}"/>
					</p:selectOneMenu></td>
				<td><p:message for="dState" id="dStateMsg" display="icon" /></td>
			</tr>
			<tr>
				<td width="126">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="daddress1" 
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{!empty param['disableValidation']}" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address1}"
						size="40" /></td>
				<td><p:message for="daddress1" id="daddress1Msg" display="icon" /></td>
				<td width="150">
					<p:outputLabel value="#{lbl['lbl.pm.address.division']}" /> 
				</td>
				<td width="220">
					<p:selectOneMenu id="dDivision" 
						disabled="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateCode ne ParameterConst.sarakSkCode}"
						required="#{!empty param['disableValidation']
							and organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateCode eq ParameterConst.sarakSkCode}" 
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.division']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDivision.divisionId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
						  value="#{organisationBackingBean.getDivisionList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId)}" 
						  var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>
						<p:ajax event="change" update="dDivision" listener="#{organisationBackingBean.retrieveDeliveryPmDivision(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDivision)}" />
					</p:selectOneMenu>
				</td>
				<td><p:message for="dDivision" id="dDivisionMsg" display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address2}"
						size="40" maxlength="255" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="dDistrict" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.district']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict.districtId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems 
							value="#{organisationBackingBean.getDistrictList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"/>
						<p:ajax event="change" update="dDistrict,dCity" listener="#{organisationBackingBean.retrieveDeliveryPmDistrict(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict)}" />
					</p:selectOneMenu></td>
				<td><p:message for="dDistrict" id="dDistrictMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address3}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="dCity" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.city']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCity.cityId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems 
							value="#{organisationBackingBean.getCityList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}"/>
						<p:ajax event="change" update="dCity" listener="#{organisationBackingBean.retrieveDeliveryPmCity(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCity)}" />
					</p:selectOneMenu></td>
				<td><p:message id="dCityMsg" for="dCity" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address4}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="dpostCode" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="5"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.postcode}" styleClass="ppDisplayTextL"
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="dpostCode" id="dpostCodeMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="dtelNo" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.tel']}" maxlength="12" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.phoneNo}"
						  validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText></td>
				<td><p:message for="dtelNo" id="dtelNoMsg" display="icon" /></td>

				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td><p:inputText id="dfaxNo" maxlength="12" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.faxNo}"
						  validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						  </p:inputText></td>
						  	<td><p:message for="dfaxNo" id="dfaxNoMsg" display="icon" /></td>
			</tr>
			</table>
		</p:panel>

		<p:spacer height="15"></p:spacer>

		<div align="right">

			<p:commandButton value="#{lbl['lbl.btn.ok']}" 
				process="@this deliveryAddressDialog"
				action="#{organisationBackingBean.updateDeliveryAddrDt}"
				update="deliveryAddressId">			
			</p:commandButton>
			&#160;&#160;
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" 
				onclick="addressPopup.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
