<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel styleClass="sampleDetails" >

		<p:dataTable id="deliveryAddressId"
			value="#{organisationBackingBean.managedBean.addressTypesList}"
			var="address" rowIndexVar="index" rowKey="#{address}">
			<ac:paginator for="deliveryAddressId" />

			<p:column headerText="#{lbl['lbl.pm.address.address']}">
				<h:outputText value="#{address.pmAddress.address1}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.address.district']}"
				style="width : 15%">
				<h:outputText value="#{address.pmAddress.pmDistrict.districtName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.address.state']}"
				style="width : 15%">
				<h:outputText value="#{address.pmAddress.pmState.stateName}" />
			</p:column>
			<p:column>
				<p:commandLink oncomplete="addressPopup.show();"
					actionListener="#{organisationBackingBean.editDeliveryAddress(address)}"
					update="@([id$=deliveryAddressDialog])"								
					style="padding-right:5px">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				oncomplete="addressPopup.show();" update="@([id$=deliveryAddressDialog])"	
				actionListener="#{organisationBackingBean.addDeliveryAddr}" />
			<p:commandButton value="#{lbl['lbl.so.delete']}"
				actionListener="#{organisationBackingBean.deleteSelectedAdddress}"
				update="deliveryAddressId,deliveryAddressDialog" process="@this,deliveryAddressId"
				partialSubmit="true" />
		</div>

	</p:panel>
	<p:dialog header="Delivery Address" widgetVar="addressPopup" id="deliveryAddressDialog"
		modal="true" width="900" height="450">

		<p:panel header="#{lbl['lbl.pm.header.general.org.delivery']}" toggleable="true" >

			<table style="width: 100%">
			<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="addressname"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.address.name']}" maxlength="80"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.addressName}"
							size="35" /></td>
					<td><p:message for="addressname" id="addressnameMsg"
							display="icon" /></td>

					<td></td>

				</tr>
				<tr>
					<td width="120"><p:outputLabel
							value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="dmanCountry"
							 label="#{lbl['lbl.pm.address.country']}"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCountry.countryId}"
							style="width: 276px;margin-bottom: 5px;"
							styleClass="ppDropDownWidthL">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="countryList"
								value="#{organisationBackingBean.managedBean.deliveryCountryList}"
								itemLabel="#{countryList.countryName}"
								itemValue="#{countryList.countryId}" />
							<p:ajax event="change"
								listener="#{organisationBackingBean.retrieveDeliveryStateList}"
								update="dmanState" />
						</p:selectOneMenu></td>
					<td><p:message for="dmanCountry" id="dmanCountryMsg"
							display="icon" /></td>
					<td width="150"><p:outputLabel
							value="#{lbl['lbl.pm.address.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td width="220"><p:selectOneMenu id="dmanState"
							 label="#{lbl['lbl.pm.address.state']}"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId}"
							style="width: 207px;margin-bottom: 5px;"
							styleClass="ppDropDownWidthL">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="stateList"
								value="#{organisationBackingBean.managedBean.deliveryStateList}"
								itemLabel="#{stateList.stateName}"
								itemValue="#{stateList.stateId}" />
							<p:ajax event="change"
								listener="#{organisationBackingBean.retrieveDeliveryDivisionList}"
								update="dmanDistrict" />
						</p:selectOneMenu></td>
					<td><p:message for="dmanState" id="dmanStateMsg"
							display="icon" /></td>
				</tr>
				<tr>
					<td width="126"><p:outputLabel
							value="#{lbl['lbl.pm.address.address']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="daddress1" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.address.address']}" maxlength="255"							
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address1}"
							size="40" /></td>
					<td><p:message for="daddress1" id="daddress1Msg"
							display="icon" /></td>

				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address2}"
							size="40" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="dmanDistrict" 
							label="#{lbl['lbl.pm.address.district']}"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict.districtId}"
							style="width: 207px;margin-bottom: 5px;"
							styleClass="ppDropDownWidthL">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="districtList"
								value="#{organisationBackingBean.managedBean.deliveryDistrictList}"
								itemValue="#{districtList.districtId}"
								itemLabel="#{districtList.districtName}" />
							<p:ajax event="change"
								listener="#{organisationBackingBean.retrieveDeliveryCityList}"
								update="dmanCity" />

						</p:selectOneMenu></td>
					<td><p:message for="dmanDistrict" id="dmanDistrictMsg"
							display="icon" /></td>
				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address3}"
							size="40" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="dmanCity"
							label="#{lbl['lbl.pm.address.city']}"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCity.cityId}"
							style="width: 207px;margin-bottom: 5px;"
							styleClass="ppDropDownWidthL">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="cityList"
								value="#{organisationBackingBean.managedBean.deliveryCityList}"
								itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
						</p:selectOneMenu></td>
					<td><p:message id="dmanCityMsg" for="dmanCity" display="icon" /></td>

				</tr>
				<tr>
					<td></td>
					<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address4}"
							size="35" /></td>
					<td></td>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="dpostCode" 
							styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.address.postcode']}" maxlength="10"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.postcode}"
							validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}"
							size="34">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText></td>
					<td><p:message for="dpostCode" id="dpostCodeMsg"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="dtelNo" 
							styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.address.tel']}"
							maxlength="20"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.phoneNo}"
							validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}"
							size="35">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText></td>
					<td><p:message for="dtelNo" id="dtelNoMsg" display="icon" /></td>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
					<td><p:inputText id="daddressFax" maxlength="20"
							styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.faxNo}"
							validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}">
							<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText></td>
					<td><p:message for="daddressFax" id="daddressFaxMsg"
							display="icon" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.pm.header.general.org.contactPerson']}"
			toggleable="true">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="dcontactName" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.name']}" 
							value="#{organisationBackingBean.managedBean.deliveryContactPerson.contactName}"
							size="50" /></td>
					<td><p:message id="dcontactNameMsg" for="dcontactName"
							display="icon" /></td>
				
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="dcontactEmail"
							label="#{lbl['lbl.pm.contact.email']}" 
							styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryContactPerson.email}"
							size="50" >							
						</p:inputText></td>
					<td><p:message id="dcontactEmailMsg" for="dcontactEmail"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><p:inputText id="dcontactPhone" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryContactPerson.phoneNo}"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="dcontactPhoneMsg" for="dcontactPhone"
							display="icon" /></td>
				
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><p:inputText id="dcontactMobile" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.deliveryContactPerson.mobileNo}"
							validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="dcontactMobileMsg" for="dcontactMobile"
							display="icon" /></td>
				</tr>
			</table>
		</p:panel>

		<p:spacer height="15"></p:spacer>

		<div align="right">

			<p:commandButton value="Ok" style="float:right;"
				action="#{organisationBackingBean.updateDeliveryAddrDt}"
				update="deliveryAddressId" onclick="addressPopup.hide();">
			</p:commandButton>
			&#160;&#160;
			<p:commandButton value="Cancel" style="float:right;"
				onclick="addressPopup.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
