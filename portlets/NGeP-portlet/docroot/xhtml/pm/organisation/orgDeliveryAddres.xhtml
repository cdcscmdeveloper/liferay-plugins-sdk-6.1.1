<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel styleClass="sampleDetails">

		<p:dataTable id="deliveryAddressId"
			value="#{organisationBackingBean.managedBean.deliveryAddressList}"
			var="address" rowIndexVar="index" 
			selectionMode="single" rowKey="#{address}"
			selection="#{organisationBackingBean.managedBean.selectedDeliveryAddress}">


			<ac:paginator for="deliveryAddressId" />

			<p:column headerText="#{lbl['lbl.pm.address.address']}">
				<h:outputText value="#{address.pmAddress.address1}" />
			</p:column>

		</p:dataTable>
		<div align="right">


			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				oncomplete="addressPopup.show();"
				action="#{organisationBackingBean.addDeliveryAddr}"
				icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{organisationBackingBean.deleteSelectedAdddress}"
				update="deliveryAddressId" process="@this,deliveryAddressId"
				partialSubmit="true" />
		</div>

	</p:panel>
	<p:dialog header="Delivery Address" widgetVar="addressPopup"
		modal="true" width="900" height="450">

		<p:panel id="deliveryAddress">

			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.address.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="addressname" required="true"
							label="#{lbl['lbl.pm.address.name']}" maxlength="80"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.addressName}"
							size="35" /></td>
					<td><p:message for="addressname" id="addressnameMsg"
							display="icon" /></td>

					<td></td>

				</tr>
				</table>
		</p:panel>
		
		<p:spacer height="15"></p:spacer>

		<div align="right">

			<p:commandButton value="Ok" style="float:right;" 	
			
				action="#{organisationBackingBean.assignNewAddress}"
				update="deliveryAddressId,deliveryAddress" onclick="addressPopup.hide();">
			</p:commandButton>
			&#160;&#160;
			<p:commandButton value="Cancel" style="float:right;"
				onclick="addressPopup.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
