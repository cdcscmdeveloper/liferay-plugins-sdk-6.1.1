<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<style type="text/css">
		div[id$="deliveryAddressStatusId_panel"] .ui-selectonemenu-items-wrapper{
	        width:135px;
	     }
	</style>
	<p:panel>
		<p:dataTable id="deliveryAddressId"
			value="#{organisationBackingBean.managedBean.addressTypesList}" widgetVar="deliveryAddres"
			var="address" rowIndexVar="index" rowKey="#{address}" selection="#{organisationBackingBean.managedBean.selectedAddressTypes}">
			<ac:paginator for="deliveryAddressId" />
			<p:column selectionMode="multiple" disabledSelection="#{!address.brandNew}"
				 style="width:2%" />
			 <p:column headerText="#{lbl['lbl.pm.address.address']}" style="white-space:normal;">
				<h:outputText value="#{organisationBackingBean.getFullAddress(address.pmAddress)}" />
			</p:column>
			<p:column style="width:15%;" headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu label="#{lbl['lbl.pm.financialorg.status']}" id="deliveryAddressStatusId" 
					disabled="#{address.brandNew}" style="width:135px;"
					value="#{address.recordStatusFlg}" required="true">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>
			</p:column>
			<p:column style="width:5%;text-align:center;">
				<p:commandLink oncomplete="addressPopup.show();" process="@this" partialSubmit="true"
					actionListener="#{organisationBackingBean.editDeliveryAddress(address)}"
					update="@([id$=deliveryAddressDialog])"	>
					<p:graphicImage 
						value="/css/images/design/edit.png" />
					<p:resetInput target=":form:addressTabs:deliveryAddressPanel" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this" partialSubmit="true"
				oncomplete="addressPopup.show();" update="@([id$=deliveryAddressDialog])"	
				actionListener="#{organisationBackingBean.addDeliveryAddr}" >
				<p:resetInput target=":form:addressTabs:deliveryAddressPanel" />
				</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				actionListener="#{organisationBackingBean.deleteSelectedAdddress}"
				update="deliveryAddressId,deliveryAddressDialog" process="@this,deliveryAddressId"
				partialSubmit="true" >
				<p:resetInput target=":form:addressTabs:deliveryAddressPanel" />
			</p:commandButton>
		</div>
	</p:panel>
	<p:dialog header="#{lbl['lbl.pm.header.general.org.delivery']}" widgetVar="addressPopup" id="deliveryAddressDialog" resizable="false"
		modal="true" width="910" height="450">
		<p:outputPanel id="deliveryAddressPanel">
			<p:messages id="deliveryAddressMessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
			<tr>
					<td style="width:15%;"><p:outputLabel value="#{lbl['lbl.pm.address.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width:35%;"><p:inputText id="addressname"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.address.name']}" maxlength="255"
							value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.addressName}"
							size="31" /></td>
					<td style="width:15%;"><p:message for="addressname" id="addressnameMsg"
							display="icon" /></td>

					<td style="width:35%;"></td>
				</tr>
			<tr>
				<td>
					<p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" />
				</td>				
				<td>
					<p:selectOneMenu id="dCountry" styleClass="ppDropDownWidthL"
						required="#{!empty param['dialogValidation']}" label="#{lbl['lbl.pm.address.country']}" disabled="true"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCountry.countryId}"
						style="width: 250px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{organisationBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />
					</p:selectOneMenu><p:message for="dCountry" id="dCountryMsg" display="icon" />
				</td>				
				<td>
					<p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu id="dState" required="#{!empty param['dialogValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
						  value="#{organisationBackingBean.getStateList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCountry.countryId)}" 
						  var="state" itemLabel="#{state.stateName}"
						  itemValue="#{state.stateId}"/>
						<p:ajax event="change" update="olDelDivisionMandatory,dDistrict, dDivision, dCity" 
						 	listener="#{organisationBackingBean.retrieveDeliveryPmState(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState)}"/>
					</p:selectOneMenu><p:message for="dState" id="dStateMsg" display="icon" /></td>			
			</tr>
			<tr>
				<td>
					<p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="daddress1" 
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{!empty param['dialogValidation']}" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address1}"
						size="31" /><p:message for="daddress1" id="daddress1Msg" display="icon" /></td>				
				<td>
					<p:outputLabel value="#{lbl['lbl.pm.address.division']}" /> 
					<p:outputPanel id="olDelDivisionMandatory">
					<p:outputLabel
						value="*" styleClass="mandatory" 
						rendered="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.adoptDivision}"/>
					</p:outputPanel>
				</td>
				<td>
					<p:selectOneMenu id="dDivision" 
						disabled="#{not organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.adoptDivision}"
						required="#{!empty param['dialogValidation']
							and organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.adoptDivision}" 
						label="#{lbl['lbl.pm.address.division']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDivision.divisionId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
						  value="#{organisationBackingBean.getDivisionList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId)}" 
						  var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>
						<p:ajax event="change" update="dDistrict, dDivision, dCity"  
							listener="#{organisationBackingBean.retrieveDeliveryPmDivision(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDivision)}" />
					</p:selectOneMenu><p:message for="dDivision" id="dDivisionMsg" display="icon" />
				</td>				
			</tr>
			<tr>
				<td></td>
				<td><p:inputText
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address2}"
						size="31" maxlength="255" /></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="dDistrict" required="#{!empty param['dialogValidation']}" 
						label="#{lbl['lbl.pm.address.district']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems 
							value="#{organisationBackingBean.getDistrictList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmState.stateId,organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDivision)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"/>
						<p:ajax event="change" update="dDistrict,dCity" listener="#{organisationBackingBean.retrieveDeliveryPmDistrict(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict)}" />
					</p:selectOneMenu><p:message for="dDistrict" id="dDistrictMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address3}"
						size="31" /></td>				
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="dCity" required="#{!empty param['dialogValidation']}"
						label="#{lbl['lbl.pm.address.city']}"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems 
							value="#{organisationBackingBean.getCityList(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}"/>
						<p:ajax event="change" update="dCity" listener="#{organisationBackingBean.retrieveDeliveryPmCity(organisationBackingBean.managedBean.deliveryAddress.pmAddress.pmCity)}" />
					</p:selectOneMenu><p:message id="dCityMsg" for="dCity" display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.address4}"
						size="31" /></td>				
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="dpostCode" required="#{!empty param['dialogValidation']}"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="5" size="10"
						value="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.postcode}" 
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText>
						<p:message for="dpostCode" id="dpostCodeMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3"><ac:phone id="dtelNo" required="#{!empty param['dialogValidation']}" isMobile="false"
						label="#{lbl['lbl.pm.address.tel']}" 
						countryCode="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.phoneCountry}"
						areaCode="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.phoneArea}"
						number="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.phoneNo}"
						validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
						<p:message for="dtelNo" id="dtelNoMsg" display="icon" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td colspan="3"><ac:phone id="dfaxNo" isMobile="false"
						label="#{lbl['lbl.pm.address.fax']}"
						countryCode="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.faxCountry}"
						areaCode="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.faxArea}"
						number="#{organisationBackingBean.managedBean.deliveryAddress.pmAddress.faxNo}"
						validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
						<p:message for="dfaxNo" id="dfaxNoMsg" display="icon" />
				</td>
			</tr>
			</table>
		</p:outputPanel>

		<p:spacer height="15"></p:spacer>

		<div align="right">

			<p:commandButton value="#{lbl['lbl.btn.ok']}" 
				process="@this,deliveryAddressPanel"
				action="#{organisationBackingBean.updateDeliveryAddrDt}"
				update="deliveryAddressId,deliveryAddressPanel"><f:param name="dialogValidation" value="true" /> 
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
				onclick="addressPopup.hide();">
				<f:param name="dialogValidation" value="false" /> </p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
