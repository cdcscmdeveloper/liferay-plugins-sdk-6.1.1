<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="stateSearch" header="Contact Person"
		widgetVar="contactPersonPopup" modal="true" width="600" height="200">

		<p:panel >
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /></td>
					<td><p:inputText id="contactName"
						label="#{lbl['lbl.pm.contact.name']}"
							value="#{organisationBackingBean.managedBean.contactPerson.contactName}"
							size="50" /><p:message id="contactNameMsg"
						for="contactName" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Email" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.email}"
							size="50" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Tel No." /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.phoneNo}"
							size="20" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax No." /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.faxNo}"
							size="20" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Mobile No" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.mobileNo}"
							size="20" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">

				<p:commandButton value="Ok" style="float:right;"
					onclick="contactPersonPopup.hide();">
				</p:commandButton>
				&#160;&#160;
				<p:commandButton value="Cancel" style="float:right;"
					onclick="contactPersonPopup.hide();"></p:commandButton>
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
