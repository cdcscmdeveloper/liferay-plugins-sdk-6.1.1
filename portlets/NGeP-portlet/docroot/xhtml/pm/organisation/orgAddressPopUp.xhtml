<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="Delivery Address" widgetVar="addressPopup"
		modal="true" width="900" height="450">

		<p:panel header="#{lbl['lbl.pm.header.general.org.address']}"
			toggleable="true">
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.pm.financialorg.country']}"></h:outputLabel></td>
					<td><p:selectOneMenu
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.pmCountry.countryId}"
							required="true" style="width: 218px;margin-bottom: 5px;">
							<f:selectItem itemValue="0" itemLabel="---Select---" />
							<f:selectItems var="counLs"
								value="#{organisationBackingBean.managedBean.countries}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />

						</p:selectOneMenu></td>
					<td style="width: 200px;"><p:outputLabel value="* State" /></td>
					<td><p:selectOneMenu style="width: 218px;margin-bottom: 5px;"
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.pmState.stateId}">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="state"
								value="#{organisationBackingBean.managedBean.states}"
								itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
							<p:ajax event="change"
								listener="#{organisationBackingBean.retrievePmDistrictList}"
								update="@(.stateDistrict)" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td><p:outputLabel value="Address" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.address1}"
							size="50" /></td>
					<td><p:outputLabel value="District" /></td>
					<td><p:selectOneMenu styleClass="stateDistrict"
							style="width: 218px;margin-bottom: 5px;"
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.pmDistrict.districtId}">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="district"
								value="#{organisationBackingBean.managedBean.districts}"
								itemValue="#{district.districtId}"
								itemLabel="#{district.districtName}" />
							<p:ajax event="change"
								listener="#{organisationBackingBean.retrievePmCityList}"
								update="@(.districtCity)" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.address2}"
							size="50" /></td>
					<td><p:outputLabel value="* City/Town" /></td>
					<td><p:selectOneMenu styleClass="districtCity"
							style="width: 218px;margin-bottom: 5px;"
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.pmCity.cityId}">
							<f:selectItem itemLabel="-- Select -- " itemValue="" />
							<f:selectItems var="city"
								value="#{organisationBackingBean.managedBean.citys}"
								itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.address3}"
							size="50" /></td>
					<td><p:outputLabel value="* Postalcode" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.postcode}"
							size="30" /></td>
				</tr>
				<tr>
					<td><p:outputLabel /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.address4}"
							size="50" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Email" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.email}"
							size="50" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Fax" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.mobileNo}"
							size="15" /></td>

					<td><p:outputLabel value="Tel No." /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.pmAddressType.pmAddress.faxNo}"
							size="15" /></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.pm.header.general.org.contactPerson']}"
			toggleable="true">
			<table>

				<tr>
					<td><p:outputLabel value="Name" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.contactName}"
							size="50" /></td>

					<td><p:outputLabel value="Tel No." /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.phoneNo}"
							size="20" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Email" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.email}"
							size="50" /></td>
					<td><p:outputLabel value="Mobile No" /></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.contactPerson.mobileNo}"
							size="20" /></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="15"></p:spacer>

		<div align="right">

			<p:commandButton value="Ok" style="float:right;" action="#{organisationBackingBean.addNewAddress}" update="deliveryaddressId"
				onclick="addressPopup.hide();">
			</p:commandButton>
			&#160;&#160;
			<p:commandButton value="Cancel" style="float:right;"
				onclick="addressPopup.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
