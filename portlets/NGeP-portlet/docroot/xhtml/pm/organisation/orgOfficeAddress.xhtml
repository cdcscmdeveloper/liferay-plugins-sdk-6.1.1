<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<style>
.pmrequiredfield:before {
	color: red;
	content: "* ";
}
</style>

	<p:panel id="addManualDelAddrPnl">

		<table style="width: 100%">
			<tr>
				<td style="width:18%;"><p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="width:34%;"><p:selectOneMenu id="orgCountry"
						required="true" style="width:250px;"
						label="#{lbl['lbl.pm.address.country']}" disabled="true"
						value="#{organisationBackingBean.managedBean.officeAddress.pmCountry.countryId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{organisationBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}"
							itemValue="#{country.countryId}" />
					</p:selectOneMenu>
					<p:message for="orgCountry" id="orgCountryMsg"
						display="icon" /></td>				
				<td style="width:13%;"><p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="width:35%;"><p:selectOneMenu id="orgState" required="true"
						label="#{lbl['lbl.pm.address.state']}"
						styleClass="ppDropDownWidthM"
						value="#{organisationBackingBean.managedBean.selectedStateId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{organisationBackingBean.getStateList(organisationBackingBean.managedBean.officeAddress.pmCountry.countryId)}"
							var="state" itemLabel="#{state.stateName}"
							itemValue="#{state.stateId}" />
						<p:ajax event="change"
							update="olOffDivisionMandatory,orgDistrict, orgDivision, orgCity,:form:addressTabs:acgmap:gmapInput:gmapInput"
							process="@this"
							listener="#{organisationBackingBean.retrievePmState()}" />
					</p:selectOneMenu>
					<p:message for="orgState" id="orgStateMsg" display="icon" /></td>				
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="address1"
						label="#{lbl['lbl.pm.address.address']}" maxlength="100"
						required="true" 
						value="#{organisationBackingBean.managedBean.officeAddress.address1}"
						size="45">
						<p:ajax event="blur"
							update=":form:addressTabs:acgmap:gmapInput:gmapInput"></p:ajax>
					</p:inputText>
					<p:message for="address1" id="address1Msg" display="icon" /></td>				
				<td><p:outputLabel	value="#{lbl['lbl.pm.address.division']}" />
						<p:outputPanel id="olOffDivisionMandatory">
							<p:outputLabel 
								value="*" styleClass="mandatory" 
								rendered="#{organisationBackingBean.managedBean.officeAddress.pmState.adoptDivision}"
							/>
						</p:outputPanel>
				</td>
				<td><p:selectOneMenu id="orgDivision"
						disabled="#{not organisationBackingBean.managedBean.officeAddress.pmState.adoptDivision}"
						required="#{organisationBackingBean.managedBean.officeAddress.pmState.adoptDivision}"
						styleClass="ppDropDownWidthM"
						label="#{lbl['lbl.pm.address.division']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmDivision.divisionId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{organisationBackingBean.getDivisionList(organisationBackingBean.managedBean.officeAddress.pmState.stateId)}"
							var="division" itemLabel="#{division.divisionName}"
							itemValue="#{division.divisionId}" />
						<p:ajax event="change"
							update="orgDivision,orgDistrict,orgCity,:form:addressTabs:acgmap:gmapInput:gmapInput"
							listener="#{organisationBackingBean.retrievePmDivision(organisationBackingBean.managedBean.officeAddress.pmDivision)}" />
					</p:selectOneMenu><p:message for="orgDivision" id="orgDivisionMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText id="address2"
						value="#{organisationBackingBean.managedBean.officeAddress.address2}"
						size="45" maxlength="100" /></td>				
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="orgDistrict" required="true"
						label="#{lbl['lbl.pm.address.district']}"
						styleClass="ppDropDownWidthM"
						value="#{organisationBackingBean.managedBean.officeAddress.pmDistrict.districtId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{organisationBackingBean.getDistrictList(organisationBackingBean.managedBean.officeAddress.pmState.stateId,organisationBackingBean.managedBean.officeAddress.pmDivision)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}" />
						<p:ajax event="change"
							update="orgDistrict,orgCity,:form:addressTabs:acgmap:gmapInput:gmapInput"
							listener="#{organisationBackingBean.retrievePmDistrict(organisationBackingBean.managedBean.officeAddress.pmDistrict)}" />
					</p:selectOneMenu><p:message for="orgDistrict" id="orgDistrictMsg"
						display="icon" /></td>				
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="100"
						id="address3"
						value="#{organisationBackingBean.managedBean.officeAddress.address3}"
						size="45" /></td>				
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="orgCity" required="true"						
						label="#{lbl['lbl.pm.address.city']}"
						styleClass="ppDropDownWidthM"
						value="#{organisationBackingBean.managedBean.officeAddress.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{organisationBackingBean.getCityList(organisationBackingBean.managedBean.officeAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}" />
						<p:ajax event="change"
							update="orgCity,:form:addressTabs:acgmap:gmapInput:gmapInput"
							listener="#{organisationBackingBean.retrievePmCity(organisationBackingBean.managedBean.officeAddress.pmCity)}" />
					</p:selectOneMenu>
					<p:message id="orgCityMsg" for="orgCity" display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><ui:remove><p:inputText maxlength="255"
						id="address4"
						value="#{organisationBackingBean.managedBean.officeAddress.address4}"
						size="30" /></ui:remove></td>				
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="postCode" required="true" size="10"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="5"
						value="#{organisationBackingBean.managedBean.officeAddress.postcode}"
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
					</p:inputText>
					<p:message for="postCode" id="postCodeMsg" display="icon" />
				</td>				
			</tr>
			<tr>		
				<td></td>		
				<td colspan="3"><SCRIPT type="text/javascript">
					function getAddress() {

						var addr1 = document
								.getElementById('#{p:component(&quot;address1&quot;)}').value
								+ ',';
						var addr2 = document
								.getElementById('#{p:component(&quot;address2&quot;)}').value
								+ ',';
						var addr3 = document
								.getElementById('#{p:component(&quot;address3&quot;)}').value
								+ ',';
						

						var cityName = document
								.getElementById('#{p:component(&quot;orgCity&quot;)}_input').options[document
								.getElementById('#{p:component(&quot;orgCity&quot;)}_input').selectedIndex].text;
						var districtName = document
								.getElementById('#{p:component(&quot;orgDistrict&quot;)}_input').options[document
								.getElementById('#{p:component(&quot;orgDistrict&quot;)}_input').selectedIndex].text;
						var stateName = document
								.getElementById('#{p:component(&quot;orgState&quot;)}_input').options[document
								.getElementById('#{p:component(&quot;orgState&quot;)}_input').selectedIndex].text;
						var countryName = document
								.getElementById('#{p:component(&quot;orgCountry&quot;)}_input').options[document
								.getElementById('#{p:component(&quot;orgCountry&quot;)}_input').selectedIndex].text;

						/*var cityName = '';
						var districtName = '';
						var stateName = '';
						var countryName = '';
						 */
						var address = addr1 + addr2 + addr3 + cityName
								+ ',' + districtName + ',' + stateName + ','
								+ countryName;

						return address;
					}
				</SCRIPT> <ac:gmap id="acgmap" address="getAddress()"
						locationName="#{organisationBackingBean.managedBean.orgProfile.pmOrgValidity.orgName}"
						latitude="#{organisationBackingBean.managedBean.officeAddress.mapLatitude}"
						longitude="#{organisationBackingBean.managedBean.officeAddress.mapLongitude}"
						disabled="#{organisationBackingBean.gmapDisabled}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3"><ac:phone id="telNo" isMobile="false"
						label="#{lbl['lbl.pm.address.tel']}" required="true"
						countryCode="#{organisationBackingBean.managedBean.officeAddress.phoneCountry}"
						areaCode="#{organisationBackingBean.managedBean.officeAddress.phoneArea}"
						number="#{organisationBackingBean.managedBean.officeAddress.phoneNo}"
						validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td colspan="3"><ac:phone id="faxNo" isMobile="false"
						label="#{lbl['lbl.pm.address.fax']}"
						countryCode="#{organisationBackingBean.managedBean.officeAddress.faxCountry}"
						areaCode="#{organisationBackingBean.managedBean.officeAddress.faxArea}"
						number="#{organisationBackingBean.managedBean.officeAddress.faxNo}"
						validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="pmrequiredfield"
						value="#{lbl['lbl.pm.header.general.org.contactPerson']}" /></td>
				<td><p:commandLink
						action="#{organisationBackingBean.addContacePerson}"
						update="addManualDelAddrPnl" process="addManualDelAddrPnl"
						partialSubmit="true">
						<p:graphicImage
							title="#{lbl['lbl.pm.header.general.org.contactPerson']}"
							value="/css/images/design/ico-edit-contact.png" />
					</p:commandLink></td>
				<td colspan="2"></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="contactPerson"
		header="#{lbl['lbl.pm.header.general.org.contactPerson']}"
		closable="false" resizable="false" widgetVar="contactPersonPopup"
		modal="true" width="600" height="250">
		<p:messages id="OrgContactMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:panel id="contactPersond">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="contactName" maxlength="85"
							label="#{lbl['lbl.pm.contact.name']}" required="true"
							value="#{organisationBackingBean.managedBean.officeContactPerson.contactName}"
							size="50" /></td>
					<td><p:message id="contactNameMsg" for="contactName"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="contactEmail"
							label="#{lbl['lbl.pm.contact.email']}" required="true"
							maxlength="80" size="50" 
							value="#{organisationBackingBean.managedBean.officeContactPerson.email}"
							validatorMessage="#{lbl['lbl.pm.contact.email']} - #{lbl['lbl.pm.profiles.invalidEmail']}">
							<f:validateRegex
								pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						</p:inputText>
						&#160; <p:graphicImage id="giEmail"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="giEmail" id="ttEmail"
								value="#{lbl['lbl.pm.profiles.userdetails.email.tooltip']}"
								showEffect="fade" hideEffect="fade" /></td>
					<td><p:message id="contactEmailMsg" for="contactEmail"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><ac:phone id="contactPhone" isMobile="false"
							label="#{lbl['lbl.pm.contact.phone']}"
							countryCode="#{organisationBackingBean.managedBean.officeContactPerson.phoneCountry}"
							areaCode="#{organisationBackingBean.managedBean.officeContactPerson.phoneArea}"
							number="#{organisationBackingBean.managedBean.officeContactPerson.phoneNo}"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
					</td>
					<td><p:message id="contactPhoneMsg" for="contactPhone"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.fax']}" /></td>
					<td><ac:phone id="contactFax" isMobile="false"
							label="#{lbl['lbl.pm.contact.fax']}"
							countryCode="#{organisationBackingBean.managedBean.officeContactPerson.faxCountry}"
							areaCode="#{organisationBackingBean.managedBean.officeContactPerson.faxArea}"
							number="#{organisationBackingBean.managedBean.officeContactPerson.faxNo}"
							validatorMessage="#{lbl['lbl.pm.contact.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
					</td>
					<td><p:message id="contactFaxMsg" for="contactFax"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><ac:phone id="contactMobile"
							label="#{lbl['lbl.pm.contact.mobile']}"
							countryCode="#{organisationBackingBean.managedBean.officeContactPerson.mobileCountry}"
							areaCode="#{organisationBackingBean.managedBean.officeContactPerson.mobileArea}"
							number="#{organisationBackingBean.managedBean.officeContactPerson.mobileNo}"
							isMobile="false"
							validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" />
					</td>
					<td><p:message id="contactMobileMsg" for="contactMobile"
							display="icon" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					process="@this, contactPerson"
					action="#{organisationBackingBean.okContacePerson}" ajax="true"
					update="@([id$=Msg])">
					<f:param name="dialogValidation" value="true" />
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
					action="#{organisationBackingBean.closeContacePerson}" />

			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
