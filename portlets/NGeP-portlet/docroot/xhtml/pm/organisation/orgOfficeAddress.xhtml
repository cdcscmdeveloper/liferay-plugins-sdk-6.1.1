<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<style>
		.pmrequiredfield:before {
		 color: red;
		 content: "* ";
		}
	
	</style>

	<p:panel id="addManualDelAddrPnl">

		<table style="width: 100%">
			<tr>
				<td width="120">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td width="220">
					<p:selectOneMenu id="orgCountry" styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.address.country']}" disabled="true"
						value="#{organisationBackingBean.managedBean.officeAddress.pmCountry.countryId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{organisationBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />
					</p:selectOneMenu>
				</td>
				<td><p:message for="orgCountry" id="orgCountryMsg" display="icon" /></td>
				<td width="150">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td width="220">
					<p:selectOneMenu id="orgState" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmState.stateId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
						  value="#{organisationBackingBean.getStateList(organisationBackingBean.managedBean.officeAddress.pmCountry.countryId)}" 
						  var="state" itemLabel="#{state.stateName}"
						  itemValue="#{state.stateId}"/>
						<p:ajax event="change" update="orgDistrict, orgDivision, orgCity" 
						 	listener="#{organisationBackingBean.retrievePmState(organisationBackingBean.managedBean.officeAddress.pmState)}"/>
					</p:selectOneMenu></td>
				<td><p:message for="orgState" id="orgStateMsg" display="icon" /></td>
			</tr>
			<tr>
				<td width="126">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="address1" 
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{!empty param['disableValidation']}" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address1}"
						size="40" /></td>
				<td><p:message for="address1" id="address1Msg" display="icon" /></td>
				<td width="150">
					<p:outputLabel value="#{lbl['lbl.pm.address.division']}" /> 
				</td>
				<td width="220">
					<p:selectOneMenu id="orgDivision" 
						disabled="#{organisationBackingBean.managedBean.officeAddress.pmState.stateCode ne ParameterConst.sarakSkCode}"
						required="#{!empty param['disableValidation']
							and organisationBackingBean.managedBean.officeAddress.pmState.stateCode eq ParameterConst.sarakSkCode}" 
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmDivision.divisionId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
						  value="#{organisationBackingBean.getDivisionList(organisationBackingBean.managedBean.officeAddress.pmState.stateId)}" 
						  var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>
					</p:selectOneMenu>
				</td>
				<td><p:message for="orgDivision" id="orgDivisionMsg" display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address2}"
						size="40" maxlength="255" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="orgDistrict" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.district']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmDistrict.districtId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems 
							value="#{organisationBackingBean.getDistrictList(organisationBackingBean.managedBean.officeAddress.pmState.stateId)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"/>
						<p:ajax event="change" update="orgCity" />
					</p:selectOneMenu></td>
				<td><p:message for="orgDistrict" id="orgDistrictMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address3}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="orgCity" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.city']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmCity.cityId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems 
							value="#{organisationBackingBean.getCityList(organisationBackingBean.managedBean.officeAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}"/>
					</p:selectOneMenu></td>
				<td><p:message id="orgCityMsg" for="orgCity" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address4}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="postCode" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="10"
						value="#{organisationBackingBean.managedBean.officeAddress.postcode}" styleClass="ppDisplayTextL"
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="postCode" id="postCodeMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="telNo" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.tel']}" maxlength="12" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.phoneNo}"
						  validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText></td>
				<td><p:message for="telNo" id="telNoMsg" display="icon" /></td>

				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td><p:inputText id="faxNo" maxlength="12" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.faxNo}"
						  validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						  </p:inputText></td>
						  	<td><p:message for="faxNo" id="faxNoMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel styleClass="pmrequiredfield" value="#{lbl['lbl.pm.header.general.org.contactPerson']}" />
				</td>
				<td><p:commandLink
						action="#{organisationBackingBean.addContacePerson}"
						update="addManualDelAddrPnl" process="addManualDelAddrPnl"
						partialSubmit="true">
						<p:graphicImage
							title="#{lbl['lbl.pm.header.general.org.contactPerson']}"
							value="/css/images/design/ico-edit-contact.png" />
					</p:commandLink></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="contactPerson" header="#{lbl['lbl.pm.header.general.org.contactPerson']}" closable="false" resizable="false" 
		widgetVar="contactPersonPopup" modal="true" width="600" height="250">
		<p:messages id="OrgContactMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:panel id="contactPersond">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="contactName"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.name']}" required="#{!empty param['disableValidation'] || !empty param['dialogValidation']}"
							value="#{organisationBackingBean.managedBean.officeContactPerson.contactName}"
							size="50" /></td>
					<td><p:message id="contactNameMsg" for="contactName"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="contactEmail" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.email']}" required="#{!empty param['disableValidation'] || !empty param['dialogValidation']}" maxlength="80"
							value="#{organisationBackingBean.managedBean.officeContactPerson.email}"
							validatorMessage="#{lbl['lbl.pm.contact.email']} - #{lbl['lbl.pm.profiles.invalidEmail']}" >
							<f:validateRegex disabled="#{empty param['disableValidation']}"
								pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						</p:inputText>
					</td>
					<td><p:message id="contactEmailMsg" for="contactEmail"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><p:inputText id="contactPhone" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.phoneNo}"
							 validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText></td>
							<td><p:message id="contactPhoneMsg" for="contactPhone"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.fax']}" /></td>
					<td><p:inputText id="contactFax" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.faxNo}"
							 validatorMessage="#{lbl['lbl.pm.contact.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactFaxMsg" for="contactFax"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><p:inputText id="contactMobile" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.mobileNo}"
							 validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactMobileMsg" for="contactMobile"
							display="icon" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" process="@this, contactPerson"
					action="#{organisationBackingBean.okContacePerson}" ajax="true"
					update="@([id$=Msg])" >
					<f:param name="dialogValidation" value="true" />   
				</p:commandButton>
				&#160;&#160;
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
					action="#{organisationBackingBean.closeContacePerson}"
					 />

			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
