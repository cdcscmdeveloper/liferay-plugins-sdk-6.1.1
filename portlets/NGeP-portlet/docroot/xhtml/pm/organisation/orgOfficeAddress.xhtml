<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">


	<p:panel id="addManualDelAddrPnl">

		<table style="width: 100%">
			<tr>
				<td width="120"><p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220"><p:selectOneMenu id="manCountry"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.address.country']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmCountry.countryId}"
						style="width: 276px;margin-bottom: 5px;"
						styleClass="ppDropDownWidthL">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="countryList"
							value="#{organisationBackingBean.managedBean.countryList}"
							itemLabel="#{countryList.countryName}"
							itemValue="#{countryList.countryId}" />
						<p:ajax event="change"
							listener="#{organisationBackingBean.retrieveStateList}"
							update="manState" />
					</p:selectOneMenu></td>
				<td><p:message for="manCountry" id="manCountryMsg"
						display="icon" /></td>
				<td width="150"><p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220"><p:selectOneMenu id="manState" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmState.stateId}"
						style="width: 207px;margin-bottom: 5px;"
						styleClass="ppDropDownWidthL">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="stateList"
							value="#{organisationBackingBean.managedBean.stateList}"
							itemLabel="#{stateList.stateName}"
							itemValue="#{stateList.stateId}" />
						<p:ajax event="change"
							listener="#{organisationBackingBean.retrieveDivisionList}"
							update="manDistrict" />
					</p:selectOneMenu></td>
				<td><p:message for="manState" id="manStateMsg" display="icon" /></td>
			</tr>
			<tr>
				<td width="126"><p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="address1" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{!empty param['disableValidation']}"
						value="#{organisationBackingBean.managedBean.officeAddress.address1}"
						size="40" /></td>
				<td><p:message for="address1" id="address1Msg" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address2}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="manDistrict" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.district']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmDistrict.districtId}"
						style="width: 207px;margin-bottom: 5px;"
						styleClass="ppDropDownWidthL">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="districtList"
							value="#{organisationBackingBean.managedBean.districtList}"
							itemValue="#{districtList.districtId}"
							itemLabel="#{districtList.districtName}" />
						<p:ajax event="change"
							listener="#{organisationBackingBean.retrieveCityList}"
							update="manCity" />

					</p:selectOneMenu></td>
				<td><p:message for="manDistrict" id="manDistrictMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address3}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="manCity" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.city']}"
						value="#{organisationBackingBean.managedBean.officeAddress.pmCity.cityId}"
						style="width: 207px;margin-bottom: 5px;"
						styleClass="ppDropDownWidthL">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="cityList"
							value="#{organisationBackingBean.managedBean.cityList}"
							itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
					</p:selectOneMenu></td>
				<td><p:message id="manCityMsg" for="manCity" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.address4}"
						size="35" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="postCode" required="#{!empty param['disableValidation']}"
						styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="10"
						value="#{organisationBackingBean.managedBean.officeAddress.postcode}"
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}"
						size="34" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="postCode" id="postCodeMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="telNo" required="#{!empty param['disableValidation']}"
						styleClass="ppDisplayTextL" label="#{lbl['lbl.pm.address.tel']}"
						maxlength="20"
						value="#{organisationBackingBean.managedBean.officeAddress.phoneNo}"
						 validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}"
						size="35" ><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="telNo" id="telNoMsg" display="icon" /></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td><p:inputText id="addressFax" maxlength="20" styleClass="ppDisplayTextL"
						value="#{organisationBackingBean.managedBean.officeAddress.faxNo}"
						 validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						 <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
						 <td><p:message for="addressFax" id="addressFaxMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Contact Person" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:commandLink
						action="#{organisationBackingBean.addContacePerson}"
						update="addManualDelAddrPnl" process="addManualDelAddrPnl"
						partialSubmit="true">
						<p:graphicImage library="ep/images/design" name="edit.png"
							title="Contact Person"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="contactPerson" header="Contact Person" closable="false"
		widgetVar="contactPersonPopup" modal="true" width="600" height="200">
		<p:messages id="messagesRoleMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:panel id="contactPersond">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="contactName" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.name']}" required="#{!empty param['disableValidation']}"
							value="#{organisationBackingBean.managedBean.officeContactPerson.contactName}"
							size="50" /></td>
					<td><p:message id="contactNameMsg" for="contactName"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="contactEmail"
							label="#{lbl['lbl.pm.contact.email']}" 
							styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.email}"
							size="50"
							validatorMessage="#{lbl['lbl.pm.profiles.invalidEmail']}">
							<f:validateRegex required="#{!empty param['disableValidation']}"
								pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						</p:inputText></td>
					<td><p:message id="contactEmailMsg" for="contactEmail"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><p:inputText id="contactPhone" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.phoneNo}"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactPhoneMsg" for="contactPhone"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.fax']}" /></td>
					<td><p:inputText id="contactFax" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.faxNo}"
							validatorMessage="#{lbl['lbl.pm.contact.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactFaxMsg" for="contactFax"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><p:inputText id="contactMobile" styleClass="ppDisplayTextL"
							value="#{organisationBackingBean.managedBean.officeContactPerson.mobileNo}"
							validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactMobileMsg" for="contactMobile"
							display="icon" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">
				<p:commandButton value="OK" process="@this, contactPerson"
					action="#{organisationBackingBean.okContacePerson}" ajax="true"
					icon="ui-icon-check" update="@([id$=Msg])" />
				&#160;&#160;
				<p:commandButton value="Cancel" process="@this"
					action="#{organisationBackingBean.closeContacePerson}"
					icon="ui-icon-cancel" />

			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
