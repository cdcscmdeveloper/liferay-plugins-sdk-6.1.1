<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel header="#{lbl['lbl.pm.header.general.org.paymentBank']}"
		toggleable="true">
		<p:dataTable id="govorgid" var="financialacc"
			value="#{organisationBackingBean.managedBean.pmFinancialAcc}"
			rowKey="#{financialacc}" rowIndexVar="rowIndex"
			selection="#{organisationBackingBean.managedBean.selectedPmFinancialAcc}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="financialacc" />
			<p:column headerText="#{lbl['lbl.pm.financialorg.paymentbankname']}">
				<p:selectOneMenu value="#{financialacc.financialAccId}" id="finorgn"
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}" disabled="#{!financialacc.brandNew}" 
					required="true" style="margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems var="finorgLs"
						value="#{organisationBackingBean.managedBean.pmFinancialOrg}"
						itemLabel="#{finorgLs.finOrgName}"
						itemValue="#{finorgLs.financialOrgId}" />

				</p:selectOneMenu>
				<p:message id="finorgnMsg" for="finorgn" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.financialorg.acnumber']}">

				<p:inputText value="#{financialacc.accountNo}" size="15" disabled="#{!financialacc.brandNew}"  />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{financialacc.recordStatusFlg}"
					required="true" disabled="#{financialacc.brandNew}" style="margin-bottom: 5px;">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>

			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,govorgid" partialSubmit="true"
				action="#{organisationBackingBean.addFinancialAcc}"
				update="govorgid" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="govorgid" process="@this,govorgid"
				partialSubmit="true"
				action="#{organisationBackingBean.deleteFinancialAcc}" />

		</div>


	</p:panel>

	<p:panel header="#{lbl['lbl.pm.header.general.org.supplierusr']}"
		toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.pm.header.general.org.supplierusr']}" />
		</f:facet>
		<p:dataTable id="supplierUsers"
			value="#{organisationBackingBean.managedBean.supplierUsers}" var="supUser"
			rowIndexVar="index" rowKey="#{supUser}"
			selection="#{organisationBackingBean.managedBean.selectedUsers}">
			<ac:paginator for="supplierUsers"></ac:paginator>

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.loginid']}" style="width :15%">
				<h:outputText value="#{supUser.loginId}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.username']}" style="width :40%">
				<h:outputText value="#{supUser.userName}" />
			</p:column>

		</p:dataTable>
		<br />
		
		<div align="right">

			<p:commandButton value="Add" process="@this"
				action="#{organisationBackingBean.addUser}" immediate="true" update="userSearch"
				oncomplete="userlistpopup.show();" icon="ui-icon-add" />

			<p:commandButton value="Delete" icon="ui-icon-delete"
				process="@this,supplierUsers" partialSubmit="true"
				action="#{organisationBackingBean.deleteUser}" update="supplierUsers" />
		</div>		
	</p:panel>
	<p:dialog id="userSearch" header="USER LIST"
		widgetVar="userlistpopup" modal="true" width="600" height="300"
		resizable="false">
		<p:messages showDetail="true" autoUpdate="true" closable="true"
			severity="error, info" />
		<p:dataTable id="searchUserId" var="user"
			value="#{organisationBackingBean.managedBean.supplierUserList}"
			selection="#{organisationBackingBean.managedBean.selectedSupplierUsers}"
			rowKey="#{user.userId}" rowIndexVar="index">
			<p:column selectionMode="multiple" style="width:2%" />
			<ac:paginator for="searchUserId"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.loginid']}" style="width :15%" >
				<h:outputText value="#{user.loginId}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.username']}" style="width :40%" >
				<h:outputText value="#{user.userName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="OK" action="#{organisationBackingBean.conformUsers}"
				ajax="true" icon="ui-icon-check"
				update="userSearch,supplierUsers"
				process="@this, userSearch" onclick="userlistpopup.hide();" />

			<p:commandButton value="Cancel" icon="ui-icon-cancel" process="@this"
				onclick="userlistpopup.hide();" />
		</div>
	</p:dialog>

</ui:composition>
