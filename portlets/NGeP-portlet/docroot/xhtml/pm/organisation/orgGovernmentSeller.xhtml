<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel header="#{lbl['lbl.pm.header.general.org.paymentBank']}"
		toggleable="true">
		<p:dataTable id="govorgid" var="supplierBank"
			value="#{organisationBackingBean.managedBean.smSupplierBanks}"
			rowKey="#{supplierBank}" rowIndexVar="rowIndex">

			<ac:paginator for="govorgid" />
			<p:column headerText="#{lbl['lbl.pm.financialorg.paymentbankname']}">
				<p:selectOneMenu value="#{supplierBank.pmFinancialOrg.financialOrgId}" id="finorgn" 
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}" disabled="#{!supplierBank.brandNew}" 
					required="true" style="margin-bottom: 5px;" styleClass="ppDropDownWidthL">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems var="finorgLs"
						value="#{organisationBackingBean.managedBean.financialBanks}"
						itemLabel="#{finorgLs.finOrgName}"
						itemValue="#{finorgLs.financialOrgId}" />

				</p:selectOneMenu>
				<p:message id="finorgnMsg" for="finorgn" display="icon" />
			</p:column>
			<p:column >
			<f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			    	<h:outputText value="#{lbl['lbl.pm.financialorg.acnumber']}" />
			    </f:facet>

				<p:inputText id="finAccountNo" value="#{supplierBank.accountNo}" label="#{lbl['lbl.pm.financialorg.acnumber']}"
				maxlength="20" required="true" disabled="#{!supplierBank.brandNew}"  />
			<p:message id="finAccountNoMsg" for="finAccountNo" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{supplierBank.recordStatusFlg}"
					required="true" disabled="#{supplierBank.brandNew}" style="margin-bottom: 5px;">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>

			</p:column>
	        <p:column width="5%" headerText="#{lbl['lbl.pm.action']}">
             <p:commandLink partialSubmit="true" disabled="#{!supplierBank.brandNew}"
				process="@this" action="#{organisationBackingBean.deleteSupplierBank(rowIndex)}"
				update="govorgid" >
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,govorgid" partialSubmit="true"
				action="#{organisationBackingBean.addSupplierBank}"
				update="govorgid" />


		</div>


	</p:panel>

	<p:panel header="#{lbl['lbl.pm.header.general.org.supplierusr']}"
		toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.pm.header.general.org.supplierusr']}" />
		</f:facet>
		<p:dataTable id="supplierUsers"
			value="#{organisationBackingBean.managedBean.smPersonnels}" var="personnel"
			rowIndexVar="index" rowKey="#{personnel}"
			>
			<ac:paginator for="supplierUsers"></ac:paginator>

			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.loginid']}" style="width :15%">
				<h:outputText value="#{personnel.pmUser.loginId}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.username']}" style="width :40%">
				<h:outputText value="#{personnel.pmUser.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{personnel.pmUser.recordStatusFlg}"
					required="true" disabled="#{personnel.pmUser.brandNew}" style="margin-bottom: 5px;">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>

			</p:column>
			<p:column width="5%" headerText="#{lbl['lbl.pm.action']}">
             <p:commandLink partialSubmit="true"
				process="@this" disabled="#{!personnel.brandNew}"
				action="#{organisationBackingBean.deletePersonnel(index)}" update="supplierUsers">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			</p:column>
		</p:dataTable>
		<br />
		
		<div align="right">

			<p:commandButton value="Add" process="@this"
				action="#{organisationBackingBean.addPersonnel}" update="userSearch"
				oncomplete="userlistpopup.show();"  />

		</div>		
	</p:panel>
	<p:dialog id="userSearch" header="USER LIST"
		widgetVar="userlistpopup" modal="true" width="600" height="300"
		resizable="false">
		<p:messages showDetail="true" autoUpdate="true" closable="true"
			severity="error, info" />
		<p:dataTable id="searchUserId" var="user"
			value="#{organisationBackingBean.managedBean.supplierUserList}"
			selection="#{organisationBackingBean.managedBean.selectedSupplierUsers}"
			rowKey="#{user.userId}" rowIndexVar="index">
			<p:column selectionMode="multiple" style="width:2%" />
			<ac:paginator for="searchUserId"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.loginid']}" style="width :15%" >
				<h:outputText value="#{user.loginId}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.username']}" style="width :40%" >
				<h:outputText value="#{user.userName}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="OK" action="#{organisationBackingBean.conformUsers}"
				ajax="true" 
				update="userSearch,supplierUsers"
				process="@this, userSearch" onclick="userlistpopup.hide();" />

			<p:commandButton value="Cancel"  process="@this"
				onclick="userlistpopup.hide();" />
		</div>
	</p:dialog>

</ui:composition>
