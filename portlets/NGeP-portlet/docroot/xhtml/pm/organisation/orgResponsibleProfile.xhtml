<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<ac:lovPopup />
	<p:panel header="#{lbl['lbl.pm.sidemenu.general.org.resProfile']}"
		toggleable="true">
		<p:dataTable id="resProfileid" var="resprofile"
			value="#{organisationBackingBean.managedBean.ptjGroupList}"
			rowKey="#{resprofile}" rowIndexVar="rowIndex"
			selection="#{organisationBackingBean.managedBean.selectedPtjGroup}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="resprofile" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.org.ptjCode']}" />
				</f:facet>
				<ac:lov id="lovResOrg" lovId="PM_ORG_PROFILE" size="20"
					 readonly="true"
					value="#{resprofile.pmOrgProfiles.pmOrgValidity.orgCode}"
					postUpdateListener="profileManagementBackingBean.updatePtjCode
					(organisationBackingBean.managedBean.ptjGroupList.pmOrgProfiles)"					
					saveObject="organisationBackingBean.managedBean.selectedPtj.pmOrgProfiles">
				</ac:lov>
			</p:column>			
			 <p:column headerText="#{lbl['lbl.pm.org.ptjName']}" > 
       			#{resprofile.groupName}
	        </p:column>
			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{resprofile.recordStatusFlg}"
					required="true" style="margin-bottom: 5px;">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>

			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,resProfileid" partialSubmit="true"
				action="#{organisationBackingBean.addNewPtjAction}"
				update="resProfileid" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="resProfileid"
				process="@this,resProfileid" partialSubmit="true"
				action="#{organisationBackingBean.deletePtjAction}" />

		</div>

	</p:panel>
	<p:spacer height="1" />

</ui:composition>
