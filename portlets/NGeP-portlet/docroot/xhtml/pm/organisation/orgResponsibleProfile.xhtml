<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<p:panel id="pResponsibleOrg" header="#{lbl['lbl.pm.profiles.authorisation.responsible.org']}" toggleable="true">
		<br/>
	   	<p:dataTable id="dtOrgUnit" var="orgUnit" styleClass="dtOrgUnit" 
		     value="#{organisationBackingBean.managedBean.profileGroup}"
		     selection="#{organisationBackingBean.managedBean.selectedProfileGroup}" 
		     selectionMode="single"
		     rowIndexVar="index" rowKey="#{orgUnit}">   
			
			<ac:paginator for="dtOrgUnit"/>
		    
	        <p:column width="10%">
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			    	<h:outputText value="#{lbl['lbl.pm.profiles.resorg.table.code']}" />
			    </f:facet>
			    <ac:lov id="lovResOrg" lovId="PM_ORG_PROFILE" size="10"			    	
	            	update=":form:dtOrgUnit" readonly="true"
					headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
					value="#{orgUnit.authorizedOrgProfile.pmOrgValidity.orgCode}" 
					disabled="#{!orgUnit.brandNew}"
					postUpdateListener="organisationBackingBean.updateOrgCode
					(organisationBackingBean.managedBean.profileGroup[#{index}].authorizedOrgProfile, #{index})"
					saveObject="organisationBackingBean.managedBean.profileGroup[#{index}].authorizedOrgProfile"
					conditionField="parentOrgProfile.orgProfileId^#{organisationBackingBean.managedBean.orgProfile.parentOrgProfile.orgProfileId}|recordStatus^1"
					
					>
				</ac:lov> 
				<p:message id="lovResOrgMsg" for="lovResOrg" display="icon" />   
		    </p:column>
		    <p:column   style="white-space:nowrap; width:20%" headerText="#{lbl['lbl.pm.profiles.resorg.table.name']}" > 
       			#{orgUnit.authorizedOrgProfile.pmOrgValidity.orgName}
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{orgUnit.recordStatusFlg}"
					required="true" disabled="#{orgUnit.brandNew}" style="margin-bottom: 5px;">
					<f:selectItems
						value="#{organisationBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>

			</p:column>
	           
	       
	        <p:column width="5%" headerText="#{lbl['lbl.pm.action']}">  
      		    <p:commandLink action="#{organisationBackingBean.deleteOrgUnit(orgUnit)}" disabled="#{!orgUnit.brandNew}"
      		    	partialSubmit="true" process="@this" update="dtOrgUnit">
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>
	        </p:column>  
		</p:dataTable>
       	<br/>
       	<br/>
		<div class="ppRightBtn">
		 	<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this,dtOrgUnit" partialSubmit="true" immediate="true" 
		   	 	update="dtOrgUnit" action="#{organisationBackingBean.addOrgUnit()}" />
		</div>
    	<ac:lovPopup /> 		
	</p:panel>
</ui:composition>
