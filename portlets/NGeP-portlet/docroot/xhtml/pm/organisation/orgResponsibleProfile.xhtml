<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">
		
		<p:dataTable id="orgRespId" var="org"
			value="#{organisationBackingBean.managedBean.orgProfileList}"
			rowKey="#{org}" rowIndexVar="rowIndex"
			selection="#{organisationBackingBean.managedBean.selectedPmOrgProfile}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="org" />

			<p:column headerText="#{lbl['lbl.pm.financialbranch.branchname']}">

				<p:inputText value="#{org.orgCode}" size="40" maxlength="100"/>
			</p:column>

			

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,orgRespId" partialSubmit="true"
				action="#{organisationBackingBean.addNewPtjAction}"
				update="orgRespId" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="orgRespId"
				process="@this,orgRespId" partialSubmit="true"
				action="#{organisationBackingBean.deletePtjAction}" />

		</div>
		

	</p:panel>
	<p:spacer height="1" />

</ui:composition>
