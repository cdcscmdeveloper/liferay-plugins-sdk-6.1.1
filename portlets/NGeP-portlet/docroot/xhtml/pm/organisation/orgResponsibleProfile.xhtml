<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

		<p:panel>
		<p:dataTable id="govtSellerId" var="data" rowKey="#{data}"
			rowIndexVar="index"
			selection="#{organisationBackingBean.managedBean.selectedPmOrgProfile}"
			value="#{organisationBackingBean.managedBean.pmOrgProfile}">
			<ac:paginator for="govtSellerId" />
			<p:column selectionMode="multiple" style="width:2%" />
			

			<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.org.type']}"
				style="width:10%">
				<h:outputText
					value="#{data.pmOrgValidity.orgCode}" />
			</p:column>

			

		</p:dataTable>

		<div>
			
				<table style="width: 100%">
					<tr>
						<td class="TableFieldLeft" width="80%"></td>
						<td>
							<table>
								<tr>
									<td class="TableFieldLeft"><ac:lov id="govtSeller"
											lovId="PM_ORG_PROFILE"
											postUpdateListener="organisationBackingBean.ptjGroupListener(organisationBackingBean.managedBean.orgProfileList)"
											headerText="Government Seller" buttonLabel="Add"
											buttonIcon="ui-icon-add" selectionMode="multiple"
											saveObject="organisationBackingBean.managedBean.orgProfileList"
											conditionField="recordStatus^1" update="@form" /></td>
									<td><p:commandButton
											value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
											process="@this,govtSellerId" partialSubmit="true"
											action="#{organisationBackingBean.deletePtjGroup}"
											update="govtSellerId" icon="ui-icon-delete" /></td>
								</tr>
							</table>
						</td>
					</tr>
				</table>
			
		</div>
		<ac:lovPopup />
	</p:panel>
	<p:spacer height="1" />

</ui:composition>
