<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
<ac:lovPopup />
	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">
		<p:dataTable id="openPnlId" var="org"
			value="#{organisationBackingBean.managedBean.pmOrgProfile}"
			rowIndexVar="index" styleClass="openPnlId"
			selection="#{organisationBackingBean.managedBean.selectedPmOrgProfile}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" style="width:2%"></p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				 <ac:lov id="openPtj" lovId="PM_ORG_PROFILE"
					headerText="Category Lov"
					saveObject="organisationBackingBean.managedBean.pmOrgProfile[#{index}].pmOrgValidity"
					value="#{org.pmOrgValidity.orgCode}"
					update=":form:openPnlId">
				</ac:lov> 
				
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%; white-space: normal;">
				<h:outputText value="#{org.pmOrgValidity.orgCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%; white-space: normal;">
				<h:outputText value="#{org.pmOrgValidity.orgName}" />
			</p:column>


		</p:dataTable>
		<div align="right">
			
			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				update="openPnlId" icon="ui-icon-add"
				actionListener="#{organisationBackingBean.addNewPtjAction}" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" process="@this,openPnlId" partialSubmit="true"
				action="#{organisationBackingBean.deletePtjAction}"
				update="openPnlId" />
		</div>

	</p:panel>
	<p:spacer height="1" />

</ui:composition>
