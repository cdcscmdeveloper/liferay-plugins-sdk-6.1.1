<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel>
		<h:panelGrid columns="2">
			<h:outputLabel value="#{lbl['lbl.pm.organisation.orgType']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.orgTypeCode}"
				style="width: 275px;margin-bottom: 5px;">
				<f:selectItems
					value="#{organisationBackingBean.getDropdownCodeValues(ParameterTypeConst.organisationTypes)}" />
			</p:selectOneMenu>
			<h:outputLabel value="#{lbl['lbl.pm.organisation.orgCode']}"></h:outputLabel>
			<p:inputText value="#{organisationBackingBean.managedBean.orgCode}"
				size="40" />
			<h:outputLabel value="#{lbl['lbl.pm.organisation.orgName']}"></h:outputLabel>
			<p:inputText value="#{organisationBackingBean.managedBean.orgName}"
				size="40" />
			<h:outputLabel value="#{lbl['lbl.pm.organisation.status']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{organisationBackingBean.managedBean.orgStatus}"
				style="width: 135px;margin-bottom: 5px;">
				<f:selectItems
					value="#{organisationBackingBean.getDropdownCodeValues(ParameterTypeConst.recordStatus)}" />
			</p:selectOneMenu>

		</h:panelGrid>
	</p:panel>
</ui:composition>
