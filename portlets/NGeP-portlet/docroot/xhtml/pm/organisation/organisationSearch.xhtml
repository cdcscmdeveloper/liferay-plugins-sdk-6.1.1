<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="orgSearchPanel"
		header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.org.category']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></th>
				<td><p:selectOneRadio styleClass="commonLabel" value="#{organisationBackingBean.managedBean.searchOrgCategory}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.federal.government']}" itemValue="#{organisationBackingBean.federalGovt}"/>
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}" itemValue="#{organisationBackingBean.others}"/>
						<p:ajax process="@this" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
							event="change" partialSubmit="true" update="orgSearchPanel,:form:searchOrganisation" listener ="#{organisationBackingBean.resetOrganisationSearchBean()}"/>
					</p:selectOneRadio></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /><p:outputLabel
						value="*" styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="orgTypeFederalList"
						rendered="#{organisationBackingBean.managedBean.searchOrgCategory eq organisationBackingBean.federalGovt}" 
						styleClass="ppDropDownWidthL" required="true" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;"
						value="#{organisationBackingBean.managedBean.organisationSearchBean.orgTypeCode}">
						<f:selectItems
							value="#{organisationBackingBean.getOrgTypeDropdownValues()}" />
					</p:selectOneMenu>
					<p:selectOneMenu id="orgTypeOthersList" 
							rendered="#{organisationBackingBean.managedBean.searchOrgCategory eq organisationBackingBean.others}" 
							styleClass="ppDropDownWidthL" required="true" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;"
							value="#{organisationBackingBean.managedBean.organisationSearchBean.orgTypeCode}">
						<f:selectItems
					value="#{organisationBackingBean.getOrgTypeDropdownValues()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgCode']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" maxlength="10" size="40"
						value="#{organisationBackingBean.managedBean.organisationSearchBean.orgCode}" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgName']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" size="40"
						value="#{organisationBackingBean.managedBean.organisationSearchBean.orgName}"
						maxlength="255"/></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>

			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.status']}" /></th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{organisationBackingBean.managedBean.organisationSearchBean.orgStatus}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{organisationBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>

			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" action="#{organisationBackingBean.searchOrganisation}"
							update="searchOrganisation" process="orgSearchPanel" 
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							 />
						
						<p:commandButton value="#{lbl['lbl.btn.reset']}" partialSubmit="true" process="@this"
							update="orgSearchPanel,:form:searchOrganisation"  
							action="#{organisationBackingBean.resetOrganisationSearchBean}" />
					</div>

				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
