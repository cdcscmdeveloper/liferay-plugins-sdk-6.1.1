<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">


	<p:panel id="addManualDelAddrPnl">

		<table style="width: 100%">
			<tr>
				<td width="120"><p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220"><p:selectOneMenu id="manCountry" styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.address.country']}" disabled="true"
						value="#{financialOrgBackingBean.managedBean.pmAddress.pmCountry.countryId}"
						style="width: 275px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="countryList"
							value="#{financialOrgBackingBean.managedBean.countryList}"
							itemLabel="#{countryList.countryName}"
							itemValue="#{countryList.countryId}" />
						<p:ajax event="change"
							listener="#{financialOrgBackingBean.retrieveStateList}"
							update="manState" />
					</p:selectOneMenu></td>
				<td><p:message for="manCountry" id="manCountryMsg"
						display="icon" /></td>
				<td width="150"><p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220"><p:selectOneMenu id="manState" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{financialOrgBackingBean.managedBean.pmAddress.pmState.stateId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="stateList"
							value="#{financialOrgBackingBean.managedBean.stateList}"
							itemLabel="#{stateList.stateName}"
							itemValue="#{stateList.stateId}" />
						<p:ajax event="change"
							listener="#{financialOrgBackingBean.retrieveDivisionList}"
							update="manDistrict" />
					</p:selectOneMenu></td>
				<td><p:message for="manState" id="manStateMsg" display="icon" /></td>
			</tr>
			<tr>
				<td width="126"><p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="address1" 
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{!empty param['disableValidation']}" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.pmAddress.address1}"
						size="40" /></td>
				<td><p:message for="address1" id="address1Msg" display="icon" /></td>
				<td></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.pmAddress.address2}"
						size="40" maxlength="255" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="manDistrict" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.district']}"
						value="#{financialOrgBackingBean.managedBean.pmAddress.pmDistrict.districtId}"
						style="width: 275px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="districtList"
							value="#{financialOrgBackingBean.managedBean.districtList}"
							itemValue="#{districtList.districtId}"
							itemLabel="#{districtList.districtName}" />
						<p:ajax event="change"
							listener="#{financialOrgBackingBean.retrieveCityList}"
							update="manCity" />

					</p:selectOneMenu></td>
				<td><p:message for="manDistrict" id="manDistrictMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.pmAddress.address3}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="manCity" required="#{!empty param['disableValidation']}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.city']}"
						value="#{financialOrgBackingBean.managedBean.pmAddress.pmCity.cityId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="cityList"
							value="#{financialOrgBackingBean.managedBean.cityList}"
							itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
					</p:selectOneMenu></td>
				<td><p:message id="manCityMsg" for="manCity" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.pmAddress.address4}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="postCode" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="10"
						value="#{financialOrgBackingBean.managedBean.pmAddress.postcode}" styleClass="ppDisplayTextL"
						validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="postCode" id="postCodeMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="telNo" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.address.tel']}" maxlength="12" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.pmAddress.phoneNo}"
						  validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						</p:inputText></td>
				<td><p:message for="telNo" id="telNoMsg" display="icon" /></td>

				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td><p:inputText id="faxNo" maxlength="12" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.pmAddress.faxNo}"
						  validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" />
						  </p:inputText></td>
						  	<td><p:message for="faxNo" id="faxNoMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Contact Person" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:commandLink
						action="#{financialOrgBackingBean.addContacePerson}"
						update="addManualDelAddrPnl" process="addManualDelAddrPnl"
						partialSubmit="true">
						<p:graphicImage library="ep/images/design" name="edit.png"
							title="Contact Person"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="contactPerson" header="Contact Person" closable="false"
		widgetVar="contactPersonPopup" modal="true" width="600" height="200">
		<p:messages id="finOrgContactMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:panel id="contactPersond">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="contactName"  styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.name']}" required="#{!empty param['disableValidation'] || !empty param['dialogValidation']}"
							value="#{financialOrgBackingBean.managedBean.contactPerson.contactName}"
							size="50" /></td>
					<td><p:message id="contactNameMsg" for="contactName"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="contactEmail" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.email']}" required="#{!empty param['disableValidation'] || !empty param['dialogValidation']}" maxlength="80"
							value="#{financialOrgBackingBean.managedBean.contactPerson.email}"
							validatorMessage="#{lbl['lbl.pm.contact.email']} - #{lbl['lbl.pm.profiles.invalidEmail']}" >
							<f:validateRegex disabled="#{empty param['disableValidation']}"
								pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						</p:inputText>
					</td>
					<td><p:message id="contactEmailMsg" for="contactEmail"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><p:inputText id="contactPhone" styleClass="ppDisplayTextL"
							value="#{financialOrgBackingBean.managedBean.contactPerson.phoneNo}"
							 validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText></td>
							<td><p:message id="contactPhoneMsg" for="contactPhone"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.fax']}" /></td>
					<td><p:inputText id="contactFax" styleClass="ppDisplayTextL"
							value="#{financialOrgBackingBean.managedBean.contactPerson.faxNo}"
							 validatorMessage="#{lbl['lbl.pm.contact.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactFaxMsg" for="contactFax"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><p:inputText id="contactMobile" styleClass="ppDisplayTextL"
							value="#{financialOrgBackingBean.managedBean.contactPerson.mobileNo}"
							 validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="contactMobileMsg" for="contactMobile"
							display="icon" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">
				<p:commandButton value="OK" process="@this, contactPerson"
					action="#{financialOrgBackingBean.okContacePerson}" ajax="true"
					icon="ui-icon-check" update="@([id$=Msg])" >
					<f:param name="dialogValidation" value="true" />   
				</p:commandButton>
				&#160;&#160;
				<p:commandButton value="Cancel" process="@this"
					action="#{financialOrgBackingBean.closeContacePerson}"
					icon="ui-icon-cancel" />

			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
