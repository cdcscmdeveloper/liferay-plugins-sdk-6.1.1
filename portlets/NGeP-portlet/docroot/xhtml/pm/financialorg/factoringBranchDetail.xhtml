<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel id="financialBranchDtl">
		<p:dataTable id="financialBranchAccId" var="financialacc"
			value="#{financialOrgBackingBean.managedBean.pmFinancialBranchAcc}"
			rowKey="#{financialacc}" rowIndexVar="rowIndex"
			selection="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranchAcc}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="financialacc" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.paymentbankname']}" />
				</f:facet>
				<p:selectOneMenu value="#{financialacc.pmPaymentBankOrg.financialOrgId}" id="finorgn"
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}"
					required="true" style="width: 275px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="finorgLs"
						value="#{financialOrgBackingBean.managedBean.pmFinancialOrg}"
						itemLabel="#{finorgLs.finOrgName}"
						itemValue="#{finorgLs.financialOrgId}" />

				</p:selectOneMenu>
				<p:message id="finorgnMsg" for="finorgn" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.acnumber']}" />
				</f:facet>
				<p:inputText id="finActNo" value="#{financialacc.accountNo}"  label="#{lbl['lbl.pm.financialorg.acnumber']}" required="true"
					size="15" styleClass="ppDisplayTextS" maxlength="20"  />
					<p:message id="finActNoMsg" for="finActNo" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.effdate']}" />
				</f:facet>
				<p:calendar value="#{financialacc.effDate}" showOn="button" id="feffDte"
					size="10" readonlyInput="true" required="true" label="#{lbl['lbl.pm.financialorg.effdate']}"
					mindate="#{financialOrgBackingBean.managedBean.currentDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" update="branchexpDate" />
				</p:calendar>
				<p:message for="feffDte" id="feffDteMsg" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.expdate']}">
				<p:calendar id="branchexpDate" value="#{financialacc.expDate}"
					showOn="button" size="10" mindate="#{financialacc.effDate}"
					readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">

				</p:calendar>

			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{financialacc.recordStatusFlg}"
					required="true" style="width: 135px;margin-bottom: 5px;">
					<f:selectItems
						value="#{financialOrgBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>


			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,financialBranchAccId" partialSubmit="true"
				action="#{financialOrgBackingBean.addFinancialBranchAcc}"
				update="financialBranchAccId" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				update="financialBranchAccId" process="@this,financialBranchAccId"
				partialSubmit="true"
				action="#{financialOrgBackingBean.deleteFinancialBranchAcc}" />

		</div>


	</p:panel>
</ui:composition>
