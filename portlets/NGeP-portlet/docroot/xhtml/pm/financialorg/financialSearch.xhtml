<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="finSearchPanel"
		header="#{lbl['lbl.pm.search.rejection.reason']}" toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.financialorg.services']}" />
				</th>
				<td><p:selectOneMenu id="serviceTypeId"
						label="#{lbl['lbl.pm.financialorg.services']}"
						value="#{financialOrgBackingBean.managedBean.financialOrgSearchBean.serviceType}">
						<f:selectItems
							value="#{financialOrgBackingBean.getDropdownCodeValues(ParameterTypeConst.bankServices)}" />
					</p:selectOneMenu></td>
				<td>&#160;</td>
				<th>&#160;</th>				
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.financialorg.buzregno']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" maxlength="20" size="40" 
						value="#{financialOrgBackingBean.managedBean.financialOrgSearchBean.regNumber}" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.financialorg.name']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM" size="40" 
						value="#{financialOrgBackingBean.managedBean.financialOrgSearchBean.orgName}"
						maxlength="100" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>

			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.status']}" /></th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM" style="margin-bottom: 5px;"
						value="#{financialOrgBackingBean.managedBean.financialOrgSearchBean.orgStatus}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{financialOrgBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>

			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							update="searchFinancialOrg" process="finSearchPanel"
							onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()" 
							action="#{financialOrgBackingBean.searchFinancialOrg}" />
						
						<p:commandButton value="#{lbl['lbl.btn.reset']}" process="@this"
							update=":form:finSearchPanel,:form:searchFinancialOrg" 
							onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()" 
							action="#{financialOrgBackingBean.resetFinancialOrgSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
