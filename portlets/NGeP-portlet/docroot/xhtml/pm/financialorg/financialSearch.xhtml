
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td"></h:panelGrid>
	</p:panel>

	<p:panel>
		<h:panelGrid columns="2">
			<h:outputLabel value="#{lbl['lbl.pm.financialorg.services']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{financialOrgBackingBean.managedBean.serviceType}"
				style="width: 235px;margin-bottom: 5px;">
				<f:selectItems
					value="#{financialOrgBackingBean.getDropdownCodeValues(ParameterTypeConst.bankServices)}" />
			</p:selectOneMenu>

			<h:outputLabel value="#{lbl['lbl.pm.financialorg.buzregno']}"></h:outputLabel>
			<p:inputText value="#{financialOrgBackingBean.managedBean.regNumber}"
				size="40" />
			<h:outputLabel value="#{lbl['lbl.pm.financialorg.name']}"></h:outputLabel>
			<p:inputText value="#{financialOrgBackingBean.managedBean.orgName}"
				size="40" />

			<h:outputLabel value="#{lbl['lbl.pm.organisation.status']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{financialOrgBackingBean.managedBean.orgStatus}"
				style="width: 235px;margin-bottom: 5px;">
				<f:selectItems
					value="#{financialOrgBackingBean.getDropdownCodeValues(ParameterTypeConst.recordStatus)}" />
			</p:selectOneMenu>
		</h:panelGrid>
	</p:panel>

</ui:composition>
