<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection"/>

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" escape="false"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
						update=":form" process="@this"
						onstart="blockWidget.show()"
						oncomplete="blockWidget.hide()"
						action="#{financialOrgBackingBean.backToMain}" style="float:left;" />
				</td>
				<td>
					<!-- 34445 start -->
					<p:commandButton value="#{lbl['lbl.btn.save']}"
						oncomplete="if (!args.validationFailed) saveInfoDlg.show();"
						style="float:right;"
						rendered="#{financialOrgBackingBean.managedBean.financialOrg.brandNew}">
						<f:param name="disableValidation" value="true" />
					</p:commandButton>
					
					<p:commandButton value="#{lbl['lbl.btn.update']}"
						oncomplete="if (!args.validationFailed) updateInfoDlg.show();"
						style="float:right;"
						rendered="#{!financialOrgBackingBean.managedBean.financialOrg.brandNew}">
						<f:param name="disableValidation" value="true" />
					</p:commandButton>
					<!-- 34445 end -->
				</td>
			</tr>
		</table>
		<ui:include src="generalFinancialdetails.xhtml" />
		
		<!-- 34445 start -->
		<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
			loadingWidget="blockWidget"
			okParam="#{financialOrgBackingBean.saveFinancialOrg('SAVE')}"
			width="400" height="100" hasParam="true"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.save.msg']}"
			update="@([id$=Msg])"/>
			
		<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
			loadingWidget="blockWidget"
			okParam="#{financialOrgBackingBean.saveFinancialOrg('UPDATE')}"
			width="400" height="100" hasParam="true"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.update.msg']}"
			update=":form"/>
		<!-- 34445 end -->
	</ui:define>
</ui:composition>
