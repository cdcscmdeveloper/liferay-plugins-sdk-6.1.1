<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true"  showSummary="false" autoUpdate="#{financialOrgBackingBean.managedBean.showParentMsg}"
			closable="true" severity="error,info"></p:messages>
		<table style="width: 100%;">
			<tr>
				<td><p:commandButton value="Back" immediate="true"
						 update=":form" process="@this"
						action="#{financialOrgBackingBean.backToMain}" style="float:left;" /></td>
				<td><p:commandButton value="#{financialOrgBackingBean.managedBean.financialOrg.brandNew? lbl['lbl.btn.create'] : lbl['lbl.btn.update']}"
						action="#{financialOrgBackingBean.saveFinancialOrg}"
						update="@([id$=Msg])" style="float:right;" >
						<f:param name="disableValidation" value="true" />   
					</p:commandButton>
				</td>
			</tr>


		</table>
		<!-- <c:if
			test="#{!financialOrgBackingBean.managedBean.financialOrg.brandNew}">
			<ui:include src="/xhtml/pm/financialorg/financialOrgHeader.xhtml"></ui:include>
		</c:if> -->
		<table style="border:0; cellspacing:0; cellpadding:0; width:100%;" id="subMenu">
			<tr>
				<td width="20%" valign="top" class="sidemenutd">
					<p:tabMenu id="tmFacMenu"
						styleClass="sidemenu"
						activeIndex="#{financialOrgBackingBean.managedBean.selectedTabIndex}"
						style="display : table-caption;">
						<p:menuitem value="#{lbl['lbl.pm.menu.general.finance']}" action="#{financialOrgBackingBean.changeMenuIndex(financialOrgBackingBean.generalInfoTab)}"
							update="@form">
							<f:param name="disableValidation" value="" />
						</p:menuitem>
						<p:menuitem value="#{lbl['lbl.pm.menu.factoringbranch.finance']}" id="factoringMenu"
							action="#{financialOrgBackingBean.changeMenuIndex(financialOrgBackingBean.factringBranchInfoTab)}"
							disabled="#{!financialOrgBackingBean.managedBean.serviceTypes.contains(ParameterConst.bankServicesFactoringCompany)}"
							update="@form">
							<f:param name="disableValidation" value="" />
						</p:menuitem>

					</p:tabMenu>
				</td>
				<td width="80%" valign="top">
					<p:outputPanel
						rendered="#{financialOrgBackingBean.managedBean.selectedTabIndex == financialOrgBackingBean.generalInfoTab}">
						<ui:include src="generalFinancialdetails.xhtml" />
					</p:outputPanel>
					<p:outputPanel id="opFactoringBranch"
						rendered="#{financialOrgBackingBean.managedBean.selectedTabIndex == financialOrgBackingBean.factringBranchInfoTab}">
						<ui:include src="factoringBranch.xhtml" />
					</p:outputPanel> 
				</td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
