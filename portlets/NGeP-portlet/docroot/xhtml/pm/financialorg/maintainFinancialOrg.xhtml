<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<!-- <p:messages id="messages" showDetail="true"  showSummary="false" autoUpdate="#{financialOrgBackingBean.managedBean.showParentMsg}"
			closable="true" severity="error,info"></p:messages> -->
		<table style="width: 100%;">
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true" 
						 update=":form" process="@this"
						 onstart="blockWidget.show()" 
						oncomplete="blockWidget.hide()" 
						action="#{financialOrgBackingBean.backToMain}" style="float:left;" /></td>
				<td><p:commandButton value="#{lbl['lbl.btn.save']}"
						onstart="blockWidget.show()" 
						oncomplete="blockWidget.hide()" 
						action="#{financialOrgBackingBean.saveFinancialOrg('SAVE')}"
						update="@([id$=Msg])" style="float:right;" 
						rendered="#{financialOrgBackingBean.managedBean.financialOrg.brandNew}">
						<f:param name="disableValidation" value="true" />   
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.btn.update']}"
						onstart="blockWidget.show()" 
						oncomplete="blockWidget.hide()" 
						action="#{financialOrgBackingBean.saveFinancialOrg('UPDATE')}"
						update="@form, @([id$=Msg])" style="float:right;" 
						rendered="#{!financialOrgBackingBean.managedBean.financialOrg.brandNew}">
						<f:param name="disableValidation" value="true" />   
					</p:commandButton>
				</td>
			</tr>
		</table>	
		<ui:include src="generalFinancialdetails.xhtml" />
	</ui:define>
</ui:composition>
