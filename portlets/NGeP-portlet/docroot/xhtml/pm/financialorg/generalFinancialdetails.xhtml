<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel></p:panel>
	<p:panel header="#{lbl['lbl.pm.header.general.finance']}"
		styleClass="sampleDetails" toggleable="true">

		<table>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.pm.financialorg.regType']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="regType"
						
						value="#{financialOrgBackingBean.managedBean.regTypeId}"
						style="width: 276px;margin-bottom: 5px;">
						<f:selectItems
							value="#{financialOrgBackingBean.getDropdownCodeValues(ParameterTypeConst.financialOrgRegType)}" />
					</p:selectOneMenu> </td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.financialorg.regNo']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="bizRegNo"
						label="#{lbl['lbl.pm.financialorg.regNo']}"
						value="#{financialOrgBackingBean.managedBean.financialOrg.bizRegNumber}"
						required="true" size="40" maxlength="20" /></td> <td><p:message
						id="bizRegNoMsg" for="bizRegNo" display="icon" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.financialorg.name']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="finOrgName"
						label="#{lbl['lbl.pm.financialorg.name']}"
						value="#{financialOrgBackingBean.managedBean.financialOrg.finOrgName}"
						required="true" size="40" maxlength="100" /></td><td> <p:message
						id="finOrgNameMsg" for="finOrgName" display="icon" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.address.country']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="country"
						label="#{lbl['lbl.pm.address.country']}"
						value="#{financialOrgBackingBean.managedBean.financialOrg.pmCountry.countryId}"
						required="true" style="width: 276px;margin-bottom: 5px;">
						<f:selectItem itemValue="0" itemLabel="---Select---" />
						<f:selectItems var="counLs"
							value="#{financialOrgBackingBean.managedBean.countryList}"
							itemLabel="#{counLs.countryName}" itemValue="#{counLs.countryId}" />

					</p:selectOneMenu></td><td> <p:message id="countryMsg" for="country" display="icon" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.financialorg.status']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						label="#{lbl['lbl.pm.financialorg.status']}"
						value="#{financialOrgBackingBean.managedBean.financialOrg.recordStatusFlg}"
						id="recordSts" required="true"
						style="width: 135px;margin-bottom: 5px;">
						<f:selectItems
							value="#{financialOrgBackingBean.getDropdownCodeValues(ParameterTypeConst.recordStatus)}" />
					</p:selectOneMenu></td><td> <p:message id="recordStsMsg" for="recordSts" display="icon" /></td>

			</tr>
		</table>
	</p:panel>
	<br />
	<br />
	<p:panel toggleable="true" id="subTab">
		<h:panelGrid id="financial" style="width:100%;" toggleable="true">
			<p:tabView>
				<p:tab title="MAIN ADDRESS">
					<ui:include src="/xhtml/pm/financialorg/mainAddress.xhtml" />
				</p:tab> 
				<p:tab title="FINANCIAL SERVICES">
					<ui:include src="/xhtml/pm/financialorg/financialServices.xhtml" />
				</p:tab>
				<p:tab title="FACTORING BANK DETAIL"
					activeIndex="#{financialOrgBackingBean.managedBean.byFactoring}"
					rendered="#{financialOrgBackingBean.managedBean.pmFinancialSvc[0].serviceTypeCode.parameterCode eq 'FC'}">
					<ui:include src="/xhtml/pm/financialorg/factoringBankDetail.xhtml" />
				</p:tab>
			</p:tabView>
		</h:panelGrid>
	</p:panel>

</ui:composition>
