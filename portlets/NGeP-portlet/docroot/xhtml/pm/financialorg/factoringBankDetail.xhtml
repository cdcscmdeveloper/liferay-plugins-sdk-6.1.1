<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<style type="text/css">
		div[id$="factoringBankStatusId_panel"] .ui-selectonemenu-items-wrapper{
	        width:110px;
	     }
	</style>
	<p:outputPanel id="opFacBankDet">		
		<p:dataTable id="financialaccid" var="financialacc" resizableColumns="true" style="width: 100% !important;"
			value="#{financialOrgBackingBean.managedBean.financialOrg.pmFinancialAccs}"
			rowKey="#{financialacc}" rowIndexVar="rowIndex">
			<ac:paginator for="financialacc" />
			<p:column style="width: 25% !important">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.paymentbankname']}" />
				</f:facet>
				<h:outputText value="#{financialacc.pmPaymentBankOrg.finOrgName}" label="#{lbl['lbl.pm.financialorg.paymentbankname']}" 
					rendered="#{!financialacc.brandNew}"/>
				<p:selectOneMenu value="#{financialacc.pmPaymentBankOrg.financialOrgId}" id="finorgn"
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}"
					rendered="#{financialacc.brandNew}" style="margin-bottom: 5px;width:210px !important"
					styleClass="ppDropDownWidthL" required="true">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="finorgLs"
						value="#{financialOrgBackingBean.getPaymentBankList()}"
						itemLabel="#{finorgLs.finOrgName}"
						itemValue="#{finorgLs.financialOrgId}" />
						<p:ajax event="change" update="bankCode"
									listener="#{financialOrgBackingBean.getBankCode(financialacc.pmPaymentBankOrg.financialOrgId)}" />
						
				</p:selectOneMenu>
				<p:message id="finorgnMsg" for="finorgn" display="icon" />
			</p:column>
			<p:column style="width: 11% !important">
				<f:facet name="header">					
					<h:outputText value="#{lbl['lbl.pm.financialorg.bankcode']}" />
				</f:facet>
				<p:inputText id="bankCode" value="#{financialacc.bankCode}" disabled="true"
					 size="10" 
					/>
				
			</p:column> 
			<p:column style="width: 16% !important">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.acnumber']}" />
				</f:facet>

				<p:inputText id="accountNo" value="#{financialacc.accountNo}"
					 label="#{lbl['lbl.pm.financialorg.acnumber']}" required="true"
					size="18" styleClass="ppDisplayTextS" maxlength="18" 
					disabled="#{!financialacc.brandNew}"/>
				<p:message for="accountNo" id="accountNoMsg" display="icon" />
			</p:column>

			<p:column style="width: 14% !important">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.effdate']}" />
				</f:facet>
				<h:outputText value="#{financialacc.effDate}"
					rendered ="#{!financialacc.brandNew and !financialOrgBackingBean.editableBankDet(financialacc.effDate)}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
				<p:calendar value="#{financialacc.effDate}" showOn="button"
					id="effDte" size="10" readonlyInput="true" required="true"
					label="#{lbl['lbl.pm.financialorg.effdate']}"
					mindate="#{financialOrgBackingBean.managedBean.currentDate}"
			  		maxdate="#{ProfileManagementConst.maxDate}"
					rendered="#{financialacc.brandNew or financialOrgBackingBean.editableBankDet(financialacc.effDate)}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" update="expDate" />
				</p:calendar>
				<p:message for="effDte" id="effDteMsg" display="icon" />
			</p:column>

			<p:column style="width: 14% !important" headerText="#{lbl['lbl.pm.financialorg.expdate']}" >
				<h:outputText value="#{financialacc.expDate}"
					rendered="#{!financialacc.brandNew and !financialOrgBackingBean.editableBankDet(financialacc.expDate)}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
					
				<p:calendar id="expDate" value="#{financialacc.expDate}"
					showOn="button" size="10" mindate="#{financialOrgBackingBean.managedBean.currentDate}"
					readonlyInput="true"
					rendered="#{financialacc.brandNew or financialOrgBackingBean.editableBankDet(financialacc.expDate)}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">

				</p:calendar>

			</p:column>
			<p:column width="14%" headerText="#{lbl['lbl.pm.financialorg.status']}" >
				<p:selectOneMenu value="#{financialacc.recordStatusFlg}" style="width: 110px !important;"
					disabled="#{financialacc.brandNew}" styleClass="ppDropDownWidthS" 
					required="true" id="factoringBankStatusId">
					<f:selectItems
						value="#{financialOrgBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>
			</p:column>
			
			<p:column width="6%" headerText="#{lbl['lbl.pm.financialorg.action']}">
	             <p:commandLink partialSubmit="true" disabled="#{!financialacc.brandNew}"
					process="@this" action="#{financialOrgBackingBean.deleteFinancialAcc(rowIndex)}"
					update="financialaccid" >
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,financialaccid"
				action="#{financialOrgBackingBean.addFinancialAcc}"
				update="financialaccid" />

		</div>


	</p:outputPanel>
</ui:composition>
