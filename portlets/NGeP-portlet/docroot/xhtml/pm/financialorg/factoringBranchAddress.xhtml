<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">


	<p:panel id="branchAddress">

		<table style="width: 100%">
			<tr>
				<td width="120"><p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220"><p:selectOneMenu id="manCountry" styleClass="ppDropDownWidthL"
						required="#{financialOrgBackingBean.managedBean.branchAddressreq}" label="#{lbl['lbl.pm.address.country']}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmCountry.countryId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="countryList"
							value="#{financialOrgBackingBean.managedBean.branchCountryList}"
							itemLabel="#{countryList.countryName}"
							itemValue="#{countryList.countryId}" />
						<p:ajax event="change"
							listener="#{financialOrgBackingBean.retrieveBranchStateList}"
							update="manState" />
					</p:selectOneMenu></td>
				<td><p:message for="manCountry" id="manCountryMsg"
						display="icon" /></td>
				<td width="150"><p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220"><p:selectOneMenu id="manState" required="#{financialOrgBackingBean.managedBean.branchAddressreq}" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmState.stateId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="stateList"
							value="#{financialOrgBackingBean.managedBean.branchStateList}"
							itemLabel="#{stateList.stateName}"
							itemValue="#{stateList.stateId}" />
						<p:ajax event="change"
							listener="#{financialOrgBackingBean.retrieveBranchDivisionList}"
							update="manDistrict" />
					</p:selectOneMenu></td>
				<td><p:message for="manState" id="manStateMsg" display="icon" /></td>
			</tr>
			<tr>
				<td width="126"><p:outputLabel
						value="#{lbl['lbl.pm.address.address']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="address1" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{financialOrgBackingBean.managedBean.branchAddressreq}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address1}"
						size="40" /></td>
				<td><p:message for="address1" id="address1Msg" display="icon" /></td>
				<td></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address2}"
						size="40" maxlength="255" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="manDistrict" required="#{financialOrgBackingBean.managedBean.branchAddressreq}"
						label="#{lbl['lbl.pm.address.district']}" styleClass="ppDropDownWidthL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmDistrict.districtId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="districtList"
							value="#{financialOrgBackingBean.managedBean.branchDistrictList}"
							itemValue="#{districtList.districtId}"
							itemLabel="#{districtList.districtName}" />
						<p:ajax event="change"
							listener="#{financialOrgBackingBean.retrieveBranchCityList}"
							update="manCity" />

					</p:selectOneMenu></td>
				<td><p:message for="manDistrict" id="manDistrictMsg"
						display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address3}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="manCity" 
						label="#{lbl['lbl.pm.address.city']}" styleClass="ppDropDownWidthL"
						required="#{financialOrgBackingBean.managedBean.branchAddressreq}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmCity.cityId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="cityList"
							value="#{financialOrgBackingBean.managedBean.branchCityList}"
							itemLabel="#{cityList.cityName}" itemValue="#{cityList.cityId}" />
					</p:selectOneMenu></td>
				<td><p:message id="manCityMsg" for="manCity" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address4}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="postCode" required="#{financialOrgBackingBean.managedBean.branchAddressreq}" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="10"
						value="#{financialOrgBackingBean.managedBean.branchAddress.postcode}"
						size="40" validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}"> <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="postCode" id="postCodeMsg" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="telNo" required="#{financialOrgBackingBean.managedBean.branchAddressreq}" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.tel']}" maxlength="12"
						value="#{financialOrgBackingBean.managedBean.branchAddress.phoneNo}"
						size="40"  validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}"><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="telNo" id="telNoMsg" display="icon" /></td>

				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td><p:inputText id="faxNo" maxlength="12" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.faxNo}"
						size="40"  validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
						<td><p:message for="faxNo" id="faxNoMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Contact Person" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:commandLink
						action="#{financialOrgBackingBean.addBranchContacePerson}"
						update="branchAddress" process="branchAddress"
						partialSubmit="true">
						<p:graphicImage library="ep/images/design" name="edit.png"
							title="Contact Person"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink></td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="branchContactPerson" header="Contact Person"
		widgetVar="branchContactPersonPopup" modal="true" width="600"
		height="200">

		<p:panel id="contactPersond">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="branchContactName" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.name']}" required="#{financialOrgBackingBean.managedBean.branchAddressreq}"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.contactName}"
							size="50" maxlength="100"/></td>
					<td><p:message id="branchContactNameMsg"
							for="branchContactName" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td> 
					<td><p:inputText id="branchContactEmail" styleClass="ppDisplayTextL" maxlength="80"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.email}"
							required="#{financialOrgBackingBean.managedBean.branchAddressreq}"
							size="50" validatorMessage="#{lbl['lbl.pm.contact.email']} - #{lbl['lbl.pm.profiles.invalidEmail']}" >
							<f:validateRegex 
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" /></p:inputText></td>
					<td><p:message id="branchContactEmailMsg"
							for="branchContactEmail" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><p:inputText styleClass="ppDisplayTextL" maxlength="12" id="fbranchphone"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.phoneNo}"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="fbranchphoneMsg" for="fbranchphone"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.fax']}" /></td>
					<td><p:inputText styleClass="ppDisplayTextL" maxlength="12" id="fbranchFax"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.faxNo}"
							validatorMessage="#{lbl['lbl.pm.contact.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="fbranchFaxMsg" for="fbranchFax"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><p:inputText styleClass="ppDisplayTextL" maxlength="12" id="fbranchMobile"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.mobileNo}"
							validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="fbranchMobileMsg" for="fbranchMobile"
							display="icon" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">
				<p:commandButton value="OK" process="@this, branchContactPerson"
					action="#{financialOrgBackingBean.okBranchContacePersonAction}"
					ajax="true" icon="ui-icon-check" update="branchContactPerson" />
				&#160;&#160;
				
					<p:commandButton value="Cancel" process="@this"
					action="#{financialOrgBackingBean.closeBranchContacePerson}"
					/>

			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
