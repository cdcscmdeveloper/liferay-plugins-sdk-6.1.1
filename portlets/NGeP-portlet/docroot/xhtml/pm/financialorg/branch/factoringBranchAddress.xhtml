<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">


	<p:outputPanel id="branchAddress" rendered="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}">
		<table style="width: 100%">
			<tr>
				<td width="120">
					<p:outputLabel value="#{lbl['lbl.pm.address.country']}" /> 
					<h:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td width="220">
					<p:selectOneMenu id="branchCountry" styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}" 
						label="#{lbl['lbl.pm.address.country']}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmCountry.countryId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems value="#{financialOrgBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />  
						<p:ajax event="change" update="branchAddress" />
					</p:selectOneMenu>
				</td>
				<td><p:message for="branchCountry" id="branchCountryMsg" display="icon" /></td>
				<td width="150"><p:outputLabel
						value="#{lbl['lbl.pm.address.state']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="220">
					<p:selectOneMenu id="branchState" required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}" 
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmState.stateId}"
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							  value="#{financialOrgBackingBean.getStateList(financialOrgBackingBean.managedBean.branchAddress.pmCountry.countryId)}" 
							  var="state" itemLabel="#{state.stateName}"
							  itemValue="#{state.stateId}"/>
						<p:ajax event="change" update="branchDistrict, branchDivision, branchCity" 
						 	listener="#{financialOrgBackingBean.retrievePmState(financialOrgBackingBean.managedBean.branchAddress.pmState)}"/>
					</p:selectOneMenu>
				</td>
				<td><p:message for="branchState" id="branchStateMsg" display="icon" /></td>
			</tr>
			<tr>
				<td width="126">
					<p:outputLabel value="#{lbl['lbl.pm.address.address']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:inputText id="branchAddress1" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.address']}" maxlength="255"
						required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address1}"
						size="40" />
				</td>
				<td><p:message for="branchAddress1" id="branchAddress1Msg" display="icon" /></td>
				<td width="150">
					<p:outputLabel value="#{lbl['lbl.pm.address.division']}" /> 
				</td>
				<td width="220">
					<p:selectOneMenu id="branchDivision" 
						disabled="#{financialOrgBackingBean.managedBean.branchAddress.pmState.stateCode ne ParameterConst.sarakSkCode}"
						required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null
							and financialOrgBackingBean.managedBean.branchAddress.pmState.stateCode eq ParameterConst.sarakSkCode}" 
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.address.state']}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmDivision.divisionId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
						  value="#{financialOrgBackingBean.getDivisionList(financialOrgBackingBean.managedBean.branchAddress.pmState.stateId)}" 
						  var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>
					</p:selectOneMenu>
				</td>
				<td><p:message for="branchDivision" id="branchDivisionMsg" display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td>
					<p:inputText styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address2}"
						size="40" maxlength="255" />
				</td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.district']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="branchDistrict" required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}"
						label="#{lbl['lbl.pm.address.district']}" styleClass="ppDropDownWidthL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmDistrict.districtId}"
						>
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems 
							value="#{financialOrgBackingBean.getDistrictList(financialOrgBackingBean.managedBean.branchAddress.pmState.stateId)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"/>
						<p:ajax event="change" update="branchCity" />
					</p:selectOneMenu>
				</td>
				<td><p:message for="branchDistrict" id="branchDistrictMsg" display="icon" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address3}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.city']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneMenu id="branchCity" 
						label="#{lbl['lbl.pm.address.city']}" styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}"
						value="#{financialOrgBackingBean.managedBean.branchAddress.pmCity.cityId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					 	<f:selectItems 
							value="#{financialOrgBackingBean.getCityList(financialOrgBackingBean.managedBean.branchAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}"/>
					</p:selectOneMenu>
				</td>
				<td><p:message id="branchCityMsg" for="branchCity" display="icon" /></td>

			</tr>
			<tr>
				<td></td>
				<td><p:inputText maxlength="255" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.address4}"
						size="40" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.postcode']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="branchPostCode" required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.postcode']}" maxlength="10"
						value="#{financialOrgBackingBean.managedBean.branchAddress.postcode}"
						size="40" validatorMessage="#{lbl['lbl.pm.address.postcode']} - #{lbl['lbl.pm.profiles.invalidNo']}"> <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="branchPostCode" id="branchPostCodeMsg" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.address.tel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="telNo" required="#{!empty param['disableValidation'] and financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.address.tel']}" maxlength="12"
						value="#{financialOrgBackingBean.managedBean.branchAddress.phoneNo}"
						size="40"  validatorMessage="#{lbl['lbl.pm.address.tel']} - #{lbl['lbl.pm.profiles.invalidNo']}"><f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
				<td><p:message for="telNo" id="telNoMsg" display="icon" /></td>

				<td><p:outputLabel value="#{lbl['lbl.pm.address.fax']}" /></td>
				<td><p:inputText id="faxNo" maxlength="12" styleClass="ppDisplayTextL"
						value="#{financialOrgBackingBean.managedBean.branchAddress.faxNo}"
						size="40"  validatorMessage="#{lbl['lbl.pm.address.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
						<td><p:message for="faxNo" id="faxNoMsg" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Contact Person" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:commandLink
						action="#{financialOrgBackingBean.addBranchContacePerson}"
						update="branchAddress" process="branchAddress"
						partialSubmit="true">
						<p:graphicImage title="#{lbl['lbl.pm.header.general.org.contactPerson']}"
							value="/css/images/design/edit.png" />
					</p:commandLink></td>
			</tr>
		</table>
	</p:outputPanel>
	<p:dialog id="branchContactPerson" header="#{lbl['lbl.pm.header.general.org.contactPerson']}"
		widgetVar="branchContactPersonPopup" modal="true" width="600"
		height="200">

		<p:panel id="contactPersond">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="branchContactName" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.name']}" 
							required="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null 
								and (!empty param['disableValidation'] || !empty param['dialogValidation'])}"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.contactName}"
							size="50" maxlength="100"/></td>
					<td><p:message id="branchContactNameMsg"
							for="branchContactName" display="icon" /></td>
				</tr>
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.email']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td>
						<p:inputText id="branchContactEmail" styleClass="ppDisplayTextL"
							label="#{lbl['lbl.pm.contact.email']}"
							required="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null 
								and (!empty param['disableValidation'] || !empty param['dialogValidation'])}"
							maxlength="80"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.email}"
							validatorMessage="#{lbl['lbl.pm.contact.email']} - #{lbl['lbl.pm.profiles.invalidEmail']}" >
							<f:validateRegex disabled="#{empty param['disableValidation']}"
								pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
						</p:inputText>
					</td>
					<td><p:message id="branchContactEmailMsg" for="branchContactEmail"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.phone']}" /></td>
					<td><p:inputText styleClass="ppDisplayTextL" maxlength="12" id="fbranchphone"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.phoneNo}"
							validatorMessage="#{lbl['lbl.pm.contact.phone']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="fbranchphoneMsg" for="fbranchphone"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.fax']}" /></td>
					<td><p:inputText styleClass="ppDisplayTextL" maxlength="12" id="fbranchFax"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.faxNo}"
							validatorMessage="#{lbl['lbl.pm.contact.fax']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="fbranchFaxMsg" for="fbranchFax"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.contact.mobile']}" /></td>
					<td><p:inputText styleClass="ppDisplayTextL" maxlength="12" id="fbranchMobile"
							value="#{financialOrgBackingBean.managedBean.branchContactPerson.mobileNo}"
							validatorMessage="#{lbl['lbl.pm.contact.mobile']} - #{lbl['lbl.pm.profiles.invalidNo']}" >
						  <f:validateRegex pattern="^-?\d*(\.\d+)?$" /></p:inputText></td>
							<td><p:message id="fbranchMobileMsg" for="fbranchMobile"
							display="icon" /></td>
				</tr>
			</table>

			<p:spacer height="15"></p:spacer>

			<div align="right">
				<p:commandButton value="OK" process="@this, branchContactPerson"
					action="#{financialOrgBackingBean.okBranchContacePersonAction}"
					ajax="true" update="branchContactPerson" >
					<f:param name="dialogValidation" value="true" />   
				</p:commandButton>
				&#160;&#160;
				
				<p:commandButton value="Cancel" process="@this"
					action="#{financialOrgBackingBean.closeBranchContacePerson}"
					/>

			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
