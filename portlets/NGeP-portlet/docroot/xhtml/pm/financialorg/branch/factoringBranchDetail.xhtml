<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
 
	<p:outputPanel id="financialBranchDtl"  rendered="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch!=null}" >
		
		<p:dataTable id="financialBranchAccId" var="financialacc"
			value="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch.pmFinancialAccs}"
			rowKey="#{financialacc}" rowIndexVar="rowIndex"
			selection="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranchAcc}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="financialacc" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.paymentbankname']}" />
				</f:facet>
				<p:selectOneMenu value="#{financialacc.pmPaymentBankOrg.financialOrgId}" id="somBranchPB"
					label="#{lbl['lbl.pm.financialorg.paymentbankname']}" styleClass="ppDropDownWidthL"
					required="true">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="finorgLs"
						value="#{financialOrgBackingBean.getPaymentBankList()}"
						itemLabel="#{finorgLs.finOrgName}"
						itemValue="#{finorgLs.financialOrgId}" />
					<p:ajax event="change" />
				</p:selectOneMenu>
				<p:message id="somBranchPBMsg" for="somBranchPB" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.acnumber']}" />
				</f:facet>
				<p:inputText id="finActNo" value="#{financialacc.accountNo}"  label="#{lbl['lbl.pm.financialorg.acnumber']}" required="true"
					size="15" styleClass="ppDisplayTextS" maxlength="20">
					<p:ajax event="change" />
				</p:inputText>
					<p:message id="finActNoMsg" for="finActNo" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.financialorg.effdate']}" />
				</f:facet>
				<p:calendar value="#{financialacc.effDate}" showOn="button" id="feffDte"
					size="10" readonlyInput="true" required="true" label="#{lbl['lbl.pm.financialorg.effdate']}"
					mindate="#{financialOrgBackingBean.managedBean.currentDate}"
					disabled="#{!financialacc.brandNew and !financialOrgBackingBean.editableBankDet(financialacc.effDate)}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" update="branchexpDate" />
				</p:calendar>
				<p:message for="feffDte" id="feffDteMsg" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.expdate']}">
				<p:calendar id="branchexpDate" value="#{financialacc.expDate}"
					showOn="button" size="10" mindate="#{financialOrgBackingBean.managedBean.currentDate}"
					readonlyInput="true"
					disabled="#{!financialacc.brandNew and !financialOrgBackingBean.editableBankDet(financialacc.expDate)}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" />
				</p:calendar>

			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu value="#{financialacc.recordStatusFlg}"
					required="true" style="width: 135px;margin-bottom: 5px;">
					<f:selectItems
						value="#{financialOrgBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>


			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,financialBranchAccId" partialSubmit="true"
				action="#{financialOrgBackingBean.addFinancialBranchAcc}"
				update="financialBranchAccId" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				update="financialBranchAccId" process="@this,financialBranchAccId"
				partialSubmit="true"
				action="#{financialOrgBackingBean.deleteFinancialBranchAcc}" />

		</div>


	</p:outputPanel>
</ui:composition>
