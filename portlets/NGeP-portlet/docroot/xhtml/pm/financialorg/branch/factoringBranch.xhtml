<ui:composition 
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<p:panel header="#{lbl['lbl.pm.menu.factoringbranch.finance']}" id ="factoringBranch"
		toggleable="true">
		<p:dataTable id="financialbranchid" var="financialbranch"
			value="#{financialOrgBackingBean.managedBean.financialOrg.pmFinancialBranchs}"
			rowKey="#{financialbranch}" rowIndexVar="rowIndex2"  selectionMode="single"
			selection="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch}">
			 <p:ajax event="rowSelect" update=":form:factoringPanel" listener="#{financialOrgBackingBean.showBranchAddress}" >
				<f:param name="disableValidation" value="" />     
			</p:ajax> 
			<ac:paginator for="financialbranch" />
			<p:column>
			<f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pm.financialbranch.branchname']}" />
			    </f:facet>
				<p:inputText id="branchName" value="#{financialbranch.branchName}" styleClass="ppDisplayTextL"  maxlength="100" 
				required="true" label="#{lbl['lbl.pm.financialbranch.branchname']}" disabled="#{!financialbranch.brandNew}"
				validatorMessage="#{lbl['lbl.pm.financialbranch.branchname']} #{lbl['lbl.pm.profiles.invalidString']}">
				<f:validateRegex pattern="^([a-zA-Z0-9]+[\sa-zA-Z0-9]{1,50})?$" />
				</p:inputText>
				<p:message id="branchNameMsg" for="branchName" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.financialorg.status']}">
				<p:selectOneMenu
					value="#{financialbranch.recordStatusFlg}" disabled="#{financialbranch.brandNew}"
					 style="width: 135px;margin-bottom: 5px;">
					<f:selectItems value="#{financialOrgBackingBean.getStatusOptions()}" />
				</p:selectOneMenu>
			</p:column>
			<p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">  
      		    <p:commandLink action="#{financialOrgBackingBean.deleteFinancialBranch(financialbranch)}" disabled="#{!financialbranch.brandNew}"
      		    	partialSubmit="true" process="@this" update="financialbranchid, :form:factoringPanel">
					<p:graphicImage value="/css/images/design/delete.png"/>
				</p:commandLink>
	        </p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,financialbranchid" partialSubmit="true"
				action="#{financialOrgBackingBean.addFinancialBranch}"
				update="financialbranchid,factoringPanel" />
		</div>
		
		<p:outputPanel id="factoringPanel" >
			<p:tabView id="tvBranch" widgetVar="tvBranch" dynamic="false" cache="false" orientation="top">
				<p:tab title="ADDRESS" id="tBranchAddr" disabled="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch==null}">
					<ui:include src="/xhtml/pm/financialorg/factoringBranchAddress.xhtml" />
				</p:tab>
				<p:tab title="FACTORING BANK DETAIL" id="tBranchFacBankDet" disabled="#{financialOrgBackingBean.managedBean.selectedPmFinancialBranch==null}">
					<ui:include src="/xhtml/pm/financialorg/factoringBranchDetail.xhtml" />
				</p:tab>
			</p:tabView>
		</p:outputPanel>
	</p:panel>

	

</ui:composition>
