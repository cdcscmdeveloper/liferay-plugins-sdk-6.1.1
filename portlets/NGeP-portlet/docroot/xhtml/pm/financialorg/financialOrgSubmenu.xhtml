<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" style="vertical-align: baseline;"><p:tabMenu
					styleClass="sidemenu"
					activeIndex="#{financialOrgBackingBean.managedBean.financialActiveIndex}"
					style="display : table-caption;">
					<p:menuitem value="#{lbl['lbl.pm.menu.general.finance']}"
					action="#{financialOrgBackingBean.getGeneralInfo}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.pm.menu.factoringbranch.finance']}"
					action="#{financialOrgBackingBean.getFactringBranchInfo}"
						update="@form" />

				</p:tabMenu></td>
			<td width="80%" style="vertical-align: top;"><c:if
					test="#{financialOrgBackingBean.managedBean.financialActiveIndex eq '0'}">
					<ui:include src="generalFinancialdetails.xhtml" />
				</c:if> <c:if
					test="#{financialOrgBackingBean.managedBean.financialActiveIndex eq '1'}">
					<ui:include src="factoringBranch.xhtml" />
			</c:if></td>
		</tr>
	</table>
</ui:composition>
