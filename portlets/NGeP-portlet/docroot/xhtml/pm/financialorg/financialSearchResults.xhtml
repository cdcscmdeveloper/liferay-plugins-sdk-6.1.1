<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.pm.search.result']}" toggleable="true">

		<p:dataTable id="searchFinancialOrg" var="finorg" rows="10"
			value="#{financialOrgBackingBean.searchFinancialOrg}"
			rowIndexVar="index" lazy="true">

			<ac:paginator for="searchFinancialOrg"></ac:paginator>

			<p:column headerText="#{lbl['lbl.pm.financialorg.name']}"
				style="width :50%">
				<h:outputText value="#{finorg.finOrgName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.financialorg.buzregno']}"
				style="width :30%">
				<h:outputText value="#{finorg.bizRegNumber}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.status']}" style="width :15%">  
	            #{(finorg.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	         </p:column>
			<p:column headerText="#{lbl['lbl.pm.financialorg.action']}"
				style="width :5%;text-align:center;">
				<p:commandLink
					action="#{financialOrgBackingBean.redirectToFinOrg(finorg.financialOrgId)}"
					update="@form">
					<p:graphicImage 
						title="#{lbl['lbl.pm.financialorg.edit']}"
						value="/css/images/design/edit.png" />
				</p:commandLink>

			</p:column>
		</p:dataTable>
	</p:panel>
	<div class="ppRightBtn">

		<p:commandButton value="#{lbl['lbl.pm.financialorg.create']}"
			process="@this"
			action="#{financialOrgBackingBean.redirectToFinOrg(null)}" />
	</div>
	
</ui:composition>
