<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	<style type="text/css">
		div[id$="finServiceStatusId_panel"] .ui-selectonemenu-items-wrapper{
	        width:110px;
	     }
	</style>
	<p:outputPanel id="pFacFinancialService">	
		<p:dataTable id="financialsrvid" var="financialsrv"
			value="#{financialOrgBackingBean.managedBean.bankServicesList}"
			rowKey="#{financialsrv}" rowIndexVar="rowIndex">
			<ac:paginator for="financialsrv" />
			<p:column width="10%">
				<p:selectBooleanCheckbox id="cbSelected" 
					disabled="#{ParameterConst.bankServicesPaymentBank eq financialsrv.pmParameter.parameterCode}"
					value="#{financialsrv.selected}" >
					<p:ajax update="@form" 
						onstart="blockWidget.show()" 
						oncomplete="blockWidget.hide()" 
						listener="#{financialOrgBackingBean.changeFinancialSvc(financialsrv)}" />
					</p:selectBooleanCheckbox>
			</p:column>
			<p:column width="65%">
				#{financialsrv.codeName}
			</p:column>
		</p:dataTable>

	</p:outputPanel>
</ui:composition>
