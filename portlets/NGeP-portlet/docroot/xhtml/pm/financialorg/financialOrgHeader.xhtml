<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 245px"><h:outputLabel
							value="#{lbl['lbl.pm.financialorg.name']}"></h:outputLabel></td>
					<td class="header-info">
						#{financialOrgBackingBean.managedBean.financialOrg.finOrgName}</td>
					<td style="width: 210px"><h:outputLabel
							value="#{lbl['lbl.pm.financialorg.buzregno']}"></h:outputLabel></td>
					<td class="header-info-text">
						#{financialOrgBackingBean.managedBean.financialOrg.bizRegNumber}</td>
					<td style="width: 210px"><h:outputLabel
							value="#{lbl['lbl.pm.financialorg.status']}"></h:outputLabel></td>
					<td class="header-info">
						#{financialOrgBackingBean.managedBean.financialOrg.recordStatusFlg}</td>
					<!-- <td style="width: 210px"><h:outputLabel
							value="#{lbl['lbl.pm.organisation.status']}"></h:outputLabel></td>
					<td><p:inputText
							value="#{organisationBackingBean.managedBean.orgProfile.recordStatusFlg}"
							size="10" disabled="true" /></td> -->

				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
