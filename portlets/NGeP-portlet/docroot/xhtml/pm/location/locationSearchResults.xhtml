<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.pm.result.location']}" toggleable="true">
		<p:dataTable id="searchLocations" var="location" rows="10"
			value="#{locationBackingBean.searchLocation}" rowIndexVar="index"
			lazy="true">
			<ac:paginator for="searchLocations"></ac:paginator>
			<p:column headerText="#{lbl['lbl.pm.location.type']}"
				style="width :5%">
				<h:outputText value="#{lbl['lbl.pm.state']}"
					rendered="#{location.locationType == 'ST'}" />
				<h:outputText value="#{lbl['lbl.pm.division']}"
					rendered="#{location.locationType == 'DV'}" />
				<h:outputText value="#{lbl['lbl.pm.district']}"
					rendered="#{location.locationType == 'DS'}" />
				<h:outputText value="#{lbl['lbl.pm.city']}"
					rendered="#{location.locationType == 'CT'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.location.code']}"
				style="width :10%">
				<h:outputText value="#{location.locationCode}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.location.name']}"
				style="width :35%">
				<h:outputText value="#{location.locationName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.district']}" style="width :15%">
				<h:outputText value="#{location.district}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.state']}" style="width :15%">
				<h:outputText value="#{location.state}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.status']}" style="width :15%">
				#{(location.status==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}  
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink
					action="#{locationBackingBean.redirectToLocation(location.locationType,location.locationId)}">
					<p:graphicImage library="ep/images/design" 
						title="#{lbl['lbl.pm.update.location']}"
						value="/css/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>

	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}" process="@this"
			action="#{locationBackingBean.redirectToLocation(null,null)}" />
	</div>
</ui:composition>
