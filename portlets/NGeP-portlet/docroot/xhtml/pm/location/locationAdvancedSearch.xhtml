<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>

		<h:panelGrid columns="4" cellpadding="0" cellspacing="0">

			<c:forEach var="i" begin="0" end="4">

				<p:selectOneMenu style="width: 130px;"
					value="#{locationBackingBean.managedBean.advSearchBeans[i].searchField}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems
						value="#{locationBackingBean.searchOpections}" />
				</p:selectOneMenu>

				<p:selectOneMenu style="width:130px"
					value="#{locationBackingBean.managedBean.advSearchBeans[i].searchOperator}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems value="#{locationBackingBean.searchOperators}" />
				</p:selectOneMenu>

				<p:inputText size="50"
					value="#{locationBackingBean.managedBean.advSearchBeans[i].searchValue}" />
				 <p:selectOneMenu style="width: 50px;margin-bottom: 5px;"
					value="#{locationBackingBean.managedBean.advSearchBeans[i].andOr}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems value="#{locationBackingBean.searchCondition}" />
				</p:selectOneMenu>  
			</c:forEach>
		</h:panelGrid>
	</p:panel>
</ui:composition>
