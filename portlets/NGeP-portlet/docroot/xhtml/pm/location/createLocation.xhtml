<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.pm.location.details']}" toggleable="true" id="crtLocationId">
		<table>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.location.type']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="locationcode"
						label="#{lbl['lbl.pm.location.type']}" style="width: 135px;margin-bottom: 5px;" 
						value="#{locationBackingBean.managedBean.selectedType}"
						required="true">
						<f:selectItems
							value="#{locationBackingBean.getDropdownCodeValues(ParameterTypeConst.locationLevel)}"
							/>
						<p:ajax event="change" update="@form"
							listener="#{locationBackingBean.resetLocation}" />
					</p:selectOneMenu></td><td> <p:message id="locationcodeMsg" for="locationcode" display="icon" /></td>
			</tr>

			<ui:fragment
				rendered="#{locationBackingBean.managedBean.selectedType eq 'ST'}">
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value="#{lbl['lbl.pm.state.code']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>

					<td class="TableFieldRight"><p:inputText id="statecode"
							label="#{lbl['lbl.pm.state.code']}"
							value="#{locationBackingBean.managedBean.state.stateCode}" size="40"
							required="true" maxlength="10"></p:inputText></td><td> <p:message id="statecodeMsg"
							for="statecode" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.state.name']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td class="TableFieldRight"><p:inputText id="statename"
							label="#{lbl['lbl.pm.state.name']}" maxlength="50"
							value="#{locationBackingBean.managedBean.state.stateName}" size="40"
							required="true"></p:inputText></td><td> <p:message id="statenameMsg"
							for="statename" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value=" #{lbl['lbl.pm.country']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{locationBackingBean.managedBean.state.pmCountry.countryId}" id="country"
							label="#{lbl['lbl.pm.country']}" required="true"
							style="margin-bottom: 5px;">
							<f:selectItem itemValue=" " itemLabel="---Select---" />
							<f:selectItems var="counLs"
								value="#{locationBackingBean.managedBean.countries}"
								itemLabel="#{counLs.countryName}"
								itemValue="#{counLs.countryId}" />

						</p:selectOneMenu></td><td> <p:message id="countryMsg" for="country" display="icon" /></td>
				</tr>
			</ui:fragment>


			<ui:fragment
				rendered="#{locationBackingBean.managedBean.selectedType eq 'DV'}">

				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value="#{lbl['lbl.pm.division.code']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>

					<td class="TableFieldRight"><p:inputText id="divisioncode"
							label="#{lbl['lbl.pm.division.code']}" size="40" maxlength="10"
							value="#{locationBackingBean.managedBean.division.divisionCode}"
							required="true" /></td><td> <p:message id="divisioncodeMsg"
							for="divisioncode" display="icon" /></td>
				</tr>

				<tr>
					<td class="TableFieldLeft" style="width: 40%"><h:outputLabel
							value="#{lbl['lbl.pm.division.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td class="TableFieldRight"><p:inputText id="divisionname"
							label="#{lbl['lbl.pm.division.name']}" maxlength="50"
							value="#{locationBackingBean.managedBean.division.divisionName}"
							required="true" size="40" /></td><td> <p:message id="divisionnameMsg"
							for="divisionname" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value=" #{lbl['lbl.pm.state']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{locationBackingBean.managedBean.division.pmState.stateId}"
							id="statereq" label=" #{lbl['lbl.pm.state']}" required="true"
							style="width: 275px;margin-bottom: 5px;" >
							<f:selectItem itemValue="" itemLabel="---Select---" />
							<f:selectItems var="stateLs"
								value="#{locationBackingBean.managedBean.states}"
								itemLabel="#{stateLs.stateName}" itemValue="#{stateLs.stateId}" />
							<p:ajax event="change" update="countryname"  listener="#{locationBackingBean.retriveDivisionValues}" />
							
						</p:selectOneMenu></td><td> <p:message id="statereqMsg" for="statereq" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
					<td class="TableFieldRight"><p:inputText id="countryname"
							disabled="true" size="40"
							value="#{locationBackingBean.managedBean.state.pmCountry.countryName}"
							 /></td>
				</tr>
			</ui:fragment>
			<ui:fragment
				rendered="#{locationBackingBean.managedBean.selectedType eq 'DS'}">

				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value="#{lbl['lbl.pm.district.code']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>

					<td class="TableFieldRight"><p:inputText id="districtcode"
							label="#{lbl['lbl.pm.district.code']}" maxlength="10"
							value="#{locationBackingBean.managedBean.district.districtCode}" size="40"
							required="true" style="margin-bottom: 5px;" /></td><td> <p:message
							id="districtcodeMsg" for="districtcode" display="icon" /></td>
				</tr>

				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.district.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td class="TableFieldRight"><p:inputText id="districtname"
							label="#{lbl['lbl.pm.district.name']}" maxlength="50"
							value="#{locationBackingBean.managedBean.district.districtName}"
							required="true" size="40" /></td><td> <p:message id="districtnameMsg"
							for="districtname" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value=" #{lbl['lbl.pm.state']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{locationBackingBean.managedBean.district.pmState.stateId}"
							id="stateval" label=" #{lbl['lbl.pm.state']}" required="true"
							style="width: 276px;margin-bottom: 5px;" >
							<f:selectItem itemValue=" " itemLabel="---Select---" />
							<f:selectItems var="stateLs"
								value="#{locationBackingBean.managedBean.states}"
								itemLabel="#{stateLs.stateName}" itemValue="#{stateLs.stateId}" />
							<p:ajax event="change" update="stateIdd"  listener="#{locationBackingBean.retriveDistrictValues}" />
						</p:selectOneMenu></td><td> <p:message id="statevalMsg" for="stateval" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
					<td class="TableFieldRight"><p:outputPanel id="stateIdd">
							<p:inputText disabled="true" style="margin-bottom: 5px;"
								value="#{locationBackingBean.managedBean.state.pmCountry.countryName}"
								size="40" />
						</p:outputPanel></td>
				</tr>
			</ui:fragment>
			<ui:fragment
				rendered="#{locationBackingBean.managedBean.selectedType eq 'CT'}">
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value="#{lbl['lbl.pm.city.code']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>

					<td class="TableFieldRight"><p:inputText id="citycode"
							label="#{lbl['lbl.pm.city.code']}" maxlength="10"
							value="#{locationBackingBean.managedBean.city.cityCode}" size="40"
							required="true" /></td><td> <p:message id="citycodeMsg" for="citycode"
							display="icon" /></td>
				</tr>

				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.city.name']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td class="TableFieldRight"><p:inputText id="cityname"
							label="#{lbl['lbl.pm.city.name']}" maxlength="50"
							value="#{locationBackingBean.managedBean.city.cityName}" size="40"
							required="true" /> </td><td><p:message id="citynameMsg" for="cityname"
							display="icon" /></td>
				</tr>

				<tr>
					<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
							value="#{lbl['lbl.pm.district']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:selectOneMenu label="#{lbl['lbl.pm.district']}"
							value="#{locationBackingBean.managedBean.city.pmDistrict.districtId}"
							id="districtval" required="true" style="width: 275px;margin-bottom: 5px;">
							<f:selectItem itemValue=" " itemLabel="---Select---" />
							<f:selectItems var="districtLs"
								value="#{locationBackingBean.managedBean.districts}"
								itemLabel="#{districtLs.districtName}"
								itemValue="#{districtLs.districtId}" />
							<p:ajax event="change" update="cityState,cityCountry"
								listener="#{locationBackingBean.retriveCityValues}" />
						</p:selectOneMenu></td><td> <p:message id="districtvalMsg" for="districtval" display="icon" /></td>
				</tr>
				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.state']}"></h:outputLabel></td>
					<td class="TableFieldRight"><p:inputText disabled="true" id="cityState"
							value="#{locationBackingBean.managedBean.district.pmState.stateName}"
							 size="40" /></td>
				</tr>

				<tr>
					<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
							value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
					<td class="TableFieldRight"><p:inputText disabled="true" id="cityCountry"
							value="#{locationBackingBean.managedBean.district.pmState.pmCountry.countryName}"
							 size="40" /></td>
				</tr>


			</ui:fragment>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.location.status']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="locationStatus"
						label="#{lbl['lbl.pm.location.status']}"
						value="#{locationBackingBean.managedBean.status}" required="true"
						style="width: 135px;margin-bottom: 5px;" >
						<f:selectItems
					value="#{locationBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td><td> <p:message id="locationStatusMsg" for="locationStatus"
						display="icon" /></td>
			</tr>
		</table>


	</p:panel>


</ui:composition>
