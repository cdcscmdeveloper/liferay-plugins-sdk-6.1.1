<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:panel header="#{lbl['lbl.pm.location.details']}" toggleable="true">
			<p:outputPanel>

				<table>
					<ui:fragment
						rendered="#{locationBackingBean.managedBean.selectedType eq 'ST'}">
						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.location.type']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText value="STATE"
									size="50" disabled="true" /></td>
						</tr>

						<tr>
							<td class="TableFieldLeft"><p:outputLabel
									value="#{lbl['lbl.pm.state.code']}" /></td>
							<td class="TableFieldRight"><p:inputText maxlength="10"
									size="50" disabled="true"
									value="#{locationBackingBean.managedBean.state.stateCode}" /></td>

						</tr>
						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.state.name']}"></h:outputLabel>
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td class="TableFieldRight"><p:inputText id="statename"
									value="#{locationBackingBean.managedBean.state.stateName}"
									required="true" size="50" label="#{lbl['lbl.pm.state.name']}"
									maxlength="50" /></td>
							<td><p:message id="statenameMsg" for="statename"
									display="icon" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText
									value="#{locationBackingBean.managedBean.state.pmCountry.countryName}"
									size="50" disabled="true" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.location.status']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									value="#{locationBackingBean.managedBean.state.recordStatusFlg}"
									required="true" style="width: 135px;margin-bottom: 5px;">
									<f:selectItems
										value="#{locationBackingBean.getStatusOptions()}" />
								</p:selectOneMenu></td>
						</tr>

					</ui:fragment>
					<ui:fragment
						rendered="#{locationBackingBean.managedBean.selectedType eq 'DV'}">

						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.location.type']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText value="DIVISION"
									size="50" disabled="true" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft"><p:outputLabel
									value="#{lbl['lbl.pm.division.code']}" /></td>
							<td class="TableFieldRight"><p:inputText maxlength="10"
									size="50"
									value="#{locationBackingBean.managedBean.division.divisionCode}"
									required="true" disabled="true" /></td>

						</tr>
						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.division.name']}"></h:outputLabel>
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td class="TableFieldRight"><p:inputText id="divisionname"
									label="#{lbl['lbl.pm.division.name']}" required="true"
									maxlength="50"
									value="#{locationBackingBean.managedBean.division.divisionName}"
									size="50" /></td>
							<td><p:message id="divisionnameMsg" for="divisionname"
									display="icon" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
									value=" #{lbl['lbl.pm.state']}" /> <p:outputLabel value="*"
									styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									value="#{locationBackingBean.managedBean.division.pmState.stateId}"
									id="statereq" label=" #{lbl['lbl.pm.state']}" required="true"
									style="width: 275px;margin-bottom: 5px;">
									<f:selectItem itemValue="" itemLabel="---Select---" />
									<f:selectItems var="stateLs"
										value="#{locationBackingBean.managedBean.states}"
										itemLabel="#{stateLs.stateName}"
										itemValue="#{stateLs.stateId}" />
									<p:ajax event="change" update="countryname"
										listener="#{locationBackingBean.retriveDivisionValues}" />

								</p:selectOneMenu></td>
							<td><p:message id="statereqMsg" for="statereq"
									display="icon" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText id="countryname"
									disabled="true" size="40"
									value="#{locationBackingBean.managedBean.state.pmCountry.countryName}" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.location.status']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									value="#{locationBackingBean.managedBean.division.recordStatusFlg}"
									required="true" style="width: 135px;margin-bottom: 5px;">
									<f:selectItems
										value="#{locationBackingBean.getStatusOptions()}" />
								</p:selectOneMenu></td>
						</tr>

					</ui:fragment>
					<ui:fragment
						rendered="#{locationBackingBean.managedBean.selectedType eq 'DS'}">

						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.location.type']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText value="DISTRICT"
									size="50" disabled="true" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
									value="#{lbl['lbl.pm.district.code']}" /></td>

							<td class="TableFieldRight"><p:inputText maxlength="10"
									value="#{locationBackingBean.managedBean.district.districtCode}"
									required="true" size="50" disabled="true" /></td>

						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.district.name']}" />
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td class="TableFieldRight"><p:inputText id="districtname"
									label="#{lbl['lbl.pm.district.name']}" required="true"
									maxlength="50"
									value="#{locationBackingBean.managedBean.district.districtName}"
									size="50" /></td>
							<td><p:message id="districtnameMsg" for="districtname"
									display="icon" /></td>
						</tr>


						<tr>
							<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
									value=" #{lbl['lbl.pm.state']}" /> <p:outputLabel value="*"
									styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									value="#{locationBackingBean.managedBean.district.pmState.stateId}"
									id="disstatereq" label=" #{lbl['lbl.pm.state']}"
									required="true" style="width: 275px;margin-bottom: 5px;">
									<f:selectItem itemValue="" itemLabel="---Select---" />
									<f:selectItems var="stateLs"
										value="#{locationBackingBean.managedBean.states}"
										itemLabel="#{stateLs.stateName}"
										itemValue="#{stateLs.stateId}" />
									<p:ajax event="change" update="discountryname"
										listener="#{locationBackingBean.retriveDistrictValues}" />

								</p:selectOneMenu></td>
							<td><p:message id="disstatereqMsg" for="disstatereq"
									display="icon" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:outputPanel
									id="discountryname">
									<p:inputText disabled="true"
										value="#{locationBackingBean.managedBean.district.pmState.pmCountry.countryName}"
										size="50" />
								</p:outputPanel></td>
						</tr>
						<tr>
							<td class="TableFieldLeft"><h:outputLabel
									value="#{lbl['lbl.pm.location.status']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									value="#{locationBackingBean.managedBean.district.recordStatusFlg}"
									required="true" style="width: 135px;margin-bottom: 5px;">
									<f:selectItems
										value="#{locationBackingBean.getStatusOptions()}" />
								</p:selectOneMenu></td>
						</tr>

					</ui:fragment>
					<ui:fragment
						rendered="#{locationBackingBean.managedBean.selectedType eq 'CT'}">

						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.location.type']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText value="CITY"
									size="50" disabled="true" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
									value="#{lbl['lbl.pm.city.code']}" /></td>

							<td class="TableFieldRight"><p:inputText maxlength="10"
									disabled="true"
									value="#{locationBackingBean.managedBean.city.cityCode}"
									size="50" required="true" /></td>

						</tr>

						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.city.name']}" />
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td class="TableFieldRight"><p:inputText id="cityname"
									label="#{lbl['lbl.pm.city.name']}"
									value="#{locationBackingBean.managedBean.city.cityName}"
									required="true" maxlength="50" size="50" /></td>
							<td><p:message id="citynameMsg" for="cityname"
									display="icon" /></td>
						</tr>

						<tr>
							<td class="TableFieldLeft" style="width: 30%"><p:outputLabel
									value="#{lbl['lbl.pm.district']}" /> <p:outputLabel value="*"
									styleClass="mandatory" /></td>
							<td><p:selectOneMenu label="#{lbl['lbl.pm.district']}"
									value="#{locationBackingBean.managedBean.city.pmDistrict.districtId}"
									id="districtval" required="true"
									style="width: 275px;margin-bottom: 5px;">
									<f:selectItem itemValue=" " itemLabel="---Select---" />
									<f:selectItems var="districtLs"
										value="#{locationBackingBean.managedBean.districts}"
										itemLabel="#{districtLs.districtName}"
										itemValue="#{districtLs.districtId}" />
									<p:ajax event="change" update="cityState,cityCountry"
										listener="#{locationBackingBean.retriveCityValues}" />
								</p:selectOneMenu></td>
							<td><p:message id="districtvalMsg" for="districtval"
									display="icon" /></td>
						</tr>

						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.state.name']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText id="cityState" disabled="true"
									value="#{locationBackingBean.managedBean.city.pmDistrict.pmState.stateName}"
									size="50" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.country']}"></h:outputLabel></td>
							<td class="TableFieldRight"><p:inputText disabled="true" id="cityCountry"
									value="#{locationBackingBean.managedBean.city.pmDistrict.pmState.pmCountry.countryName}"
									size="50" /></td>
						</tr>
						<tr>
							<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
									value="#{lbl['lbl.pm.location.status']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu
									value="#{locationBackingBean.managedBean.city.recordStatusFlg}"
									required="true" style="width: 135px;margin-bottom: 5px;">
									<f:selectItems
										value="#{locationBackingBean.getStatusOptions()}" />
								</p:selectOneMenu></td>
						</tr>
					</ui:fragment>
				</table>

			</p:outputPanel>

		</p:panel>

	</ui:define>
</ui:composition>
