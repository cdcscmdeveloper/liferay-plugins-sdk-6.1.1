<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="locationSearchPanel"
		header="#{lbl['lbl.pm.search.location']}" toggleable="true">
		<table class="ppTwoTable">
			<tr>
				<th width="20%">
					<p:outputLabel
						value="#{lbl['lbl.pm.address.country']}" /> <h:outputLabel
						value="*" styleClass="mandatory" />
				</th>				
				<td>
					<p:selectOneMenu id="dCountry" styleClass="ppDropDownWidthL"
						required="true" label="#{lbl['lbl.pm.address.country']}" 
						value="#{locationBackingBean.managedBean.locationSearchBean.countryId}"
						style="width: 275px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{locationBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />
					</p:selectOneMenu>
				</td>
				<td><p:message for="dCountry" id="dCountryMsg" display="icon" /></td>
				<td>&#160;</td>
			</tr>
			<!-- Enhancement29642 - Start -->
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.location.type']}" /><h:outputLabel
							value="*" styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="locationSearchType" styleClass="ppDropDownWidthM" style="width: 135px;margin-bottom: 5px;"
				        label="#{lbl['lbl.pm.location.type']}"
						value="#{locationBackingBean.managedBean.locationSearchBean.locationType}" >
						<f:selectItems value="#{locationBackingBean.getDropdownCodeValues(ParameterTypeConst.locationLevel)}" />
						<p:ajax event="change" update="locationType,locationName"
						listener="#{locationBackingBean.changeLocationType()}"/>		
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<!-- Enhancement29642 - End -->
			<!-- 12852 Start -->
			<tr>
				<th width="20%"><p:outputLabel
						 value="#{lbl['lbl.pm.location.code']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextS" maxlength="10" style="width:8%"
						value="#{locationBackingBean.managedBean.locationSearchBean.locationCode}" />
				</td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<!-- 12852 End -->
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.location.name']}" /></th>
				<td><p:inputText styleClass="ppDisplayTextM"
						value="#{locationBackingBean.managedBean.locationSearchBean.locationName}"
						cols="50" rows="5" maxlength="50" autoResize="false" /></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<!-- Enhancement29642 - Start -->
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.additional.location.type']}" /></th>
				<td><p:selectOneMenu id="locationType" styleClass="ppDropDownWidthM" style="width: 135px;margin-bottom: 5px;"
						value="#{locationBackingBean.managedBean.locationSearchBean.recordAdditional}"
						disabled="#{locationBackingBean.managedBean.locationSearchBean.locationType eq 'ST' or locationBackingBean.managedBean.locationSearchBean.locationType eq null}">
						<f:selectItems value="#{locationBackingBean.getDropdownCodeValuesAdditionalLocation(ParameterTypeConst.locationLevel,locationBackingBean.managedBean.locationSearchBean.locationType)}" />
						<p:ajax event="change" immediate="true" update="locationName"/>
					</p:selectOneMenu></td>
			</tr>
			
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.additional.location.name']}" /></th>
				<td><p:inputText id="locationName" styleClass="ppDisplayTextM"
						value="#{locationBackingBean.managedBean.locationSearchBean.additionalLocationName}"
					    disabled="#{locationBackingBean.managedBean.locationSearchBean.recordAdditional eq null}"
						cols="50" rows="5" maxlength="50" autoResize="false" /></td>
			</tr>
			<!-- Enhancement29642 - End -->
			<tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.status']}" /></th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{locationBackingBean.managedBean.locationSearchBean.recordStatus}">
						<f:selectItems value="#{locationBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<td colspan="4" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							update="searchLocations" process="locationSearchPanel"
							 action="#{locationBackingBean.searchLocation}" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							update=":form:locationSearchPanel,:form:searchLocations" process="@this"
							action="#{locationBackingBean.resetLocationSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
