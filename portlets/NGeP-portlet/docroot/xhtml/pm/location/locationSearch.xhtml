<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">

	<p:panel>
		<h:panelGrid columns="2">

			<h:outputLabel value="#{lbl['lbl.pm.location.type']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{locationBackingBean.managedBean.selectedType}"
				style="width: 276px;margin-bottom: 5px;">
				<f:selectItems
					value="#{locationBackingBean.getDropdownCodeValues(ParameterTypeConst.locationLevel)}" />
			</p:selectOneMenu>
			<h:outputLabel value="#{lbl['lbl.pm.location.code']}"></h:outputLabel>
			<p:inputText value="#{locationBackingBean.managedBean.locationCode}"
				size="40" />
			<h:outputLabel value="#{lbl['lbl.pm.location.name']}"></h:outputLabel>
			<p:inputText value="#{locationBackingBean.managedBean.locationName}"
				size="40" />
			<h:outputLabel value="#{lbl['lbl.pm.location.status']}"></h:outputLabel>
			<p:selectOneMenu
				value="#{locationBackingBean.managedBean.recordStatus}"
				style="width: 135px;margin-bottom: 5px;">
				<f:selectItems
					value="#{locationBackingBean.getStatusOptions()}" />
			</p:selectOneMenu>

		</h:panelGrid>
	</p:panel>
</ui:composition>
