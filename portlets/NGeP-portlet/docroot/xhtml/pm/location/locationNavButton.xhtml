<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="pSupportDocHeader">

		<div class="button-wrapper">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				action="#{locationBackingBean.backToSearch}" style="float:left;"
				process="@this" />
			<div class="rowBtnRight">
				<p:commandButton
					value="#{!locationBackingBean.managedBean.disabledVal? lbl['lbl.btn.create'] : lbl['lbl.btn.update']}"
					update="@([id$=Msg])" action="#{locationBackingBean.saveLocation}"
					style="float:right;" />
			</div>
		</div>
		</p:outputPanel>
</ui:composition>
