<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages id="businessNature" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		<ui:include
			src="/xhtml/pm/businessnature/businessNatureNavButton.xhtml" />
		
		<p:panel header="#{lbl['lbl.pm.category.level']}" id="categoryLevel"
			toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td style="width: 10%;"><p:outputLabel
							value="#{lbl['lbl.pm.bn.level']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="busLv"
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel}"
							disabled="true">
							<f:selectItems
								value="#{businessNatureBackingBean.getBusinessNatureCategoryLv()}"></f:selectItems>
							<p:ajax event="change" update="@form" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.bn.code']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText style="text-transform:uppercase"
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.levelCode}"
							disabled="#{!businessNatureBackingBean.managedBean.brandNew}"
							size="30" maxlength="10" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.bn.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputTextarea row="40"
							cols="60"
							disabled="#{!businessNatureBackingBean.managedBean.brandNew}"
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.levelName}"
						     maxlength="500" /></td>
				</tr>				
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.profiles.search.status']}" /></td>
					<td><p:selectOneMenu id="statusBusiness"						
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.recordStatusFlg}"
							disabled="#{businessNatureBackingBean.managedBean.brandNew}">
							<f:selectItems
								value="#{businessNatureBackingBean.getBusinessNatureStatus()}"></f:selectItems>
						</p:selectOneMenu></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.pm.parent.category']}" id="parentCategory"
			toggleable="true"
			rendered="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel &gt; '10'}">
			
			<!-- Division -->
			<c:if test="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel == '20'}">				
				<table style="width: 100%;">
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.seccode']}" /></td>
						<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelCode}"
						disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.secname']}" /></td>
						<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelName}"
						size="80" disabled="true" /></td>
					</tr>
				</table>
			</c:if>

			<!-- Group -->
			<c:if test="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel == '30'}">
				<table style="width: 100%;">
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.seccode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.secname']}" /></td>
						<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.levelName}"
						size="100" disabled="true" /></td>
					</tr>
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.divcode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.divname']}" /></td>
						<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelName}"
						size="100" disabled="true" /></td>
					</tr>
				</table>
			</c:if>
			
			<!-- Class -->
			<c:if test="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel == '40'}">
				<table style="width: 100%;">
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.seccode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.secname']}" /></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.levelName}"
							size="100" disabled="true" /></td>
					</tr>
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.divcode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.divname']}" /></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.levelName}"
							size="100" disabled="true" /></td>
					</tr>
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.groupcode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.groupname']}" /></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelName}"
							size="100" disabled="true" /></td>
					</tr>
				</table>
			</c:if>
			

			<!-- Item -->
			<c:if test="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel == '50'}">
				<table style="width: 100%;">
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.seccode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.secname']}" /></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.levelName}"
							size="100" disabled="true" /></td>
					</tr>
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.divcode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.divname']}" /></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.parentBusinessNature.levelName}"
							size="100" disabled="true" /></td>
					</tr>
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.groupcode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.groupname']}" /></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.parentBusinessNature.levelName}"
							size="100" disabled="true" /></td>
					</tr>
					<tr>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.classcode']}"/></td>
						<td><p:inputText
							value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelCode}"
							disabled="true" size="5" /></td>
						<td style="width: 10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.classname']}" /></td>
						<td><p:inputText
					value="#{businessNatureBackingBean.managedBean.pmBusinessNature.parentBusinessNature.levelName}"
					size="100" disabled="true" /></td>
					</tr>
				</table>	
			</c:if>
		</p:panel>
		<c:if test="#{!businessNatureBackingBean.managedBean.newcategory}">
			<p:panel header="#{lbl['lbl.pm.detail.category']}"
				id="detailCategory" toggleable="true"
				rendered="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel != '50'}">
				<p:dataTable id="detailCatId" var="detailCategory" rows="10"
					value="#{businessNatureBackingBean.managedBean.pmBusinessNature.childBusinessNatures}">

					<ac:paginator for="detailCatId"></ac:paginator>

					<p:column headerText="#{lbl['lbl.pm.bn.level']}">
						<h:outputText value="#{lbl['lbl.sm.businessnature.lvl1.section']}"
							rendered="#{detailCategory.businessLevel == '10'}" />
						<h:outputText
							value="#{lbl['lbl.sm.businessnature.lvl2.division']}"
							rendered="#{detailCategory.businessLevel == '20'}" />
						<h:outputText value="#{lbl['lbl.sm.businessnature.lvl3.group']}"
							rendered="#{detailCategory.businessLevel == '30'}" />
						<h:outputText value="#{lbl['lbl.sm.businessnature.lvl4.class']}"
							rendered="#{detailCategory.businessLevel == '40'}" />
						<h:outputText value="#{lbl['lbl.sm.businessnature.lvl5.item']}"
							rendered="#{detailCategory.businessLevel == '50'}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.pm.bn.code']}">
						<h:outputText value="#{detailCategory.levelCode}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.pm.bn.name']}">
						<h:outputText value="#{detailCategory.levelName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.pm.search.status']}"
						style="width:10%">
						<h:outputText value="#{lbl['lbl.pm.active']}"
							rendered="#{detailCategory.recordStatusFlg==1}" />
						<h:outputText value="#{lbl['lbl.pm.inactive']}"
							rendered="#{detailCategory.recordStatusFlg!=1}" />
					</p:column>

				</p:dataTable>
				
			</p:panel>
		</c:if>
	</ui:define>

</ui:composition>
