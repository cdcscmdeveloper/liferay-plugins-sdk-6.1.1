<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="businessNatureSearch"
		header="#{lbl['lbl.pm.search.category']}" toggleable="true">

		<table style="width: 100%;">
			<tr>
				<td style="width: 14%;"><h:outputLabel
						value="#{lbl['lbl.pm.category.level']}" /> <h:outputLabel value="*"
						styleClass="mandatory" /> </td>
				<td><p:selectOneMenu style="width:215px;margin-bottom:5px;"
						label="#{lbl['lbl.pm.category.level']}"
						value="#{businessNatureBackingBean.managedBean.categoryLvl}">
						<f:selectItems
							value="#{businessNatureBackingBean.getBusinessNatureCategoryLv()}" />
						<p:ajax event="change"
							update="businessNatureSearch" />
					</p:selectOneMenu></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.seccode']}"></h:outputLabel></td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.secLevelCode}"
						size="30" /></td>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.secname']}"></h:outputLabel></td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.secLevelName}"
						size="50" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.divcode']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 10}"></h:outputLabel></td>

				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.divLevelCode}"
						size="30"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 10}" /></td>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.divname']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 10}"></h:outputLabel>
				</td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.divLevelName}"
						size="50"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 10}" />
				</td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.groupcode']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 20}"></h:outputLabel></td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.groupLevelCode}"
						size="30"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 20}" /></td>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.groupname']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 20}"></h:outputLabel>
				</td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.groupLevelName}"
						size="50"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 20}" />
				</td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.classcode']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 30}"></h:outputLabel></td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.classLevelCode}"
						size="30"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 30}" /></td>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.classname']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 30}"></h:outputLabel>
				</td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.classLevelName}"
						size="50"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 30}" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.itemcode']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 40}"></h:outputLabel></td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.itemLevelCode}"
						size="30"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 40}" /></td>
				<td><h:outputLabel value="#{lbl['lbl.pm.bn.itemname']}"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 40}"></h:outputLabel></td>
				<td><p:inputText
						value="#{businessNatureBackingBean.managedBean.itemLevelName}"
						size="50"
						rendered="#{businessNatureBackingBean.managedBean.categoryLvl &gt; 40}" /></td>
			</tr>
			<tr>
				<td width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.search.status']}">
					</h:outputLabel></td>
				<td><p:selectOneMenu style="width:215px"
						value="#{businessNatureBackingBean.managedBean.status}">
						<f:selectItems
							value="#{businessNatureBackingBean.getBusinessNatureStatus()}" />
					</p:selectOneMenu></td>

			</tr>

		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				action="#{businessNatureBackingBean.retrieveBusinessNature}"
				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				update=":form:businessNatureDataModel" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				action="#{businessNatureBackingBean.resetBusinessNatureSearch}"
				process="@this"
				update=":form:businessNatureSearch,:form:businessNatureDataModel" />
		</div>
	</p:panel>
</ui:composition>
