<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.pm.organisation.result']}" toggleable="true">
		<p:dataTable id="businessNatureDataModel"
			value="#{businessNatureBackingBean.businessNatureDataModel}"
			var="businessNature" rows="10" rowIndexVar="index" lazy="true">

			<ac:paginator for="businessNatureDataModel" />

			<p:column headerText="#{lbl['lbl.pm.bn.level']}" style="width:10%">
				<h:outputText value="#{lbl['lbl.sm.businessnature.lvl1.section']}"
					rendered="#{businessNature.businessLevel == '10'}" />
				<h:outputText value="#{lbl['lbl.sm.businessnature.lvl2.division']}"
					rendered="#{businessNature.businessLevel == '20'}" />
				<h:outputText value="#{lbl['lbl.sm.businessnature.lvl3.group']}"
					rendered="#{businessNature.businessLevel == '30'}" />
				<h:outputText value="#{lbl['lbl.sm.businessnature.lvl4.class']}"
					rendered="#{businessNature.businessLevel == '40'}" />
				<h:outputText value="#{lbl['lbl.sm.businessnature.lvl5.item']}"
					rendered="#{businessNature.businessLevel == '50'}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.bn.code']}" style="width:10%">
				<h:outputText value="#{businessNature.levelCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.bn.name']}" style="width:65%">
				<h:outputText value="#{businessNature.levelName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:10%">
				<h:outputText value="#{lbl['lbl.pm.active']}"
					rendered="#{businessNature.recordStatusFlg==1}" />
				<h:outputText value="#{lbl['lbl.pm.inactive']}"
					rendered="#{businessNature.recordStatusFlg!=1}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}"
				style="width:5%;text-align:center;">
				<p:commandLink rendered="#{businessNature.businessLevel!='50'}"
					action="#{businessNatureBackingBean.createBusinessNature(businessNature)}"
					style="margin-right: 10px;" update="@form">
					<p:graphicImage title="#{businessNatureBackingBean.retrieveActionLabel(businessNature.businessLevel)}"
						value="/css/images/design/add.png" />
			</p:commandLink>

			<ui:remove><p:commandLink rendered="#{businessNature.businessLevel=='20'}"
					action="#{businessNatureBackingBean.createBusinessNature(businessNature)}"
					style="margin-right: 10px;" update="@form">
					<p:graphicImage library="ep/images/design" name="add.png"
						title="#{lbl['lbl.pm.add.group.category']}"
						value="/css/images/design/add.png" />
				</p:commandLink>

				<p:commandLink rendered="#{businessNature.businessLevel=='30'}"
					action="#{businessNatureBackingBean.createBusinessNature(businessNature)}"
					style="margin-right: 10px;" update="@form">
					<p:graphicImage library="ep/images/design" name="add.png"
						title="#{lbl['lbl.pm.add.class.category']}"
						value="/css/images/design/add.png" />
				</p:commandLink>

				<p:commandLink rendered="#{businessNature.businessLevel=='40'}"
					action="#{businessNatureBackingBean.createBusinessNature(businessNature)}"
					style="margin-right: 10px;" update="@form">
					<p:graphicImage library="ep/images/design" name="add.png"
						title="#{lbl['lbl.pm.add.item.category']}"
						value="/css/images/design/add.png" />
				</p:commandLink>
             </ui:remove>	
				<p:commandLink
					action="#{businessNatureBackingBean.goToBusinessMaintaincePage(businessNature)}"
					process="@this" partialSubmit="true">
					<p:graphicImage library="ep/images/design" 
						title="#{lbl['lbl.pm.edit.category']}"
						value="/css/images/design/edit.png" />
				</p:commandLink>

			</p:column>
		</p:dataTable>

	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}"
			action="#{businessNatureBackingBean.createBusinessNature}" />
	</div>

</ui:composition>
