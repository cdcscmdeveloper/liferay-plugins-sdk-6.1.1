<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
   <p:panel header="#{lbl['lbl.pm.category.level']}" id="categoryLevel" toggleable="true">
			
	<table style="width:100%;">	
	   <tr> 
		<td style="width:10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.level']}" /></td>
     	<td><p:selectOneMenu id="busLv" value="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel}" 
     			style="width:178px;margin-bottom:5px;" required="true"
     			disabled="#{!businessNatureBackingBean.managedBean.pmBusinessNature.brandNew}"> 
  	   			<f:selectItems value="#{businessNatureBackingBean.getBusinessNatureCategoryLv()}"></f:selectItems>
				<p:ajax event="change" update="@form" />
    	    </p:selectOneMenu></td>				
	    </tr>	    		    	
	  <tr>	  	
		<td><p:outputLabel value="#{lbl['lbl.pm.bn.code']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText style="text-transform:uppercase" value="#{businessNatureBackingBean.managedBean.pmBusinessNature.levelCode}" 
				disabled="#{!businessNatureBackingBean.managedBean.pmBusinessNature.brandNew}" size="30" maxlength="10" /></td>
	  </tr>	
	  <tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.bn.name']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td style="padding: 5px 0px;"><p:inputTextarea row="40" cols="80" 
				value="#{businessNatureBackingBean.managedBean.pmBusinessNature.levelName}" size="30" maxlength="500" /></td>
	  </tr>	
	  	  <tr>	  	
		<td><p:outputLabel /></td>
		<td><p:outputLabel /></td>
	  </tr>	  
	   <tr> 
		<td style="width:10%;"><p:outputLabel value="#{lbl['lbl.pm.profiles.search.status']}" /></td>
     	<td><p:selectOneMenu id="statusBusiness" style="width:178px;margin-bottom:5px;" 
     			value="#{businessNatureBackingBean.managedBean.pmBusinessNature.recordStatusFlg}"
     			disabled="#{businessNatureBackingBean.managedBean.pmBusinessNature.brandNew}"> 
  	   			<f:selectItems value="#{businessNatureBackingBean.getBusinessNatureStatus()}"></f:selectItems>
    	    </p:selectOneMenu></td>				
	    </tr>
	</table>
   </p:panel>	
</ui:composition>
