<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel header="CATEGORY LEVEL" toggleable="true">
	<p:spacer height="10"></p:spacer>
			
	<table style="width:100%;">
	   <tr> 
		<td style="width:10%;"><p:outputLabel value="#{lbl['lbl.pm.bn.level']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;"
     			value="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel}" > 
  	   			<f:selectItems value="#{businessNatureBackingBean.getBusinessNatureCategoryLv()}"></f:selectItems>
    	    </p:selectOneMenu></td>				
	    </tr>	
	  <tr>	  	
		<td><p:outputLabel value="#{lbl['lbl.pm.bn.code']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{businessNatureBackingBean.managedBean.pmBusinessNature.levelCode}" size="30" /></td>
	  </tr>	
	  <tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.bn.name']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td style="padding: 5px 0px;"><p:inputTextarea row="40" cols="80" 
				value="#{businessNatureBackingBean.managedBean.pmBusinessNature.levelName}" size="30" /></td>
	  </tr>
		<p:spacer height="5"></p:spacer>	  
	   <tr> 
		<td><p:outputLabel value="#{lbl['lbl.pm.profiles.search.status']}" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;" 
     			value="#{businessNatureBackingBean.managedBean.pmBusinessNature.recordStatusFlg}" > 
  	   			<f:selectItems value="#{businessNatureBackingBean.getBusinessNatureStatus()}"></f:selectItems>
    	    </p:selectOneMenu></td>				
	    </tr>
	</table>
   </p:panel>	
</ui:composition>
