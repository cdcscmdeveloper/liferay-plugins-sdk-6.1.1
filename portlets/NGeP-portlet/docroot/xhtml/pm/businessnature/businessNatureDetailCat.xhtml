<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
   
	<p:panel header="#{lbl['lbl.pm.detail.category']}" id="detailCategory" toggleable="true" rendered="#{businessNatureBackingBean.managedBean.pmBusinessNature.businessLevel != '50'}">
	<p:dataTable id="detailCatId" 
		var="detailCategory"
		value="#{businessNatureBackingBean.managedBean.pmBusinessNature.childBusinessNatures}"> 
		  	  	         
       <p:column headerText="#{lbl['lbl.pm.bn.level']}" > 	
         <h:outputText value="#{detailCategory.businessLevel}"/>
       </p:column>  
       
       <p:column headerText="#{lbl['lbl.pm.bn.code']}" > 
        <h:outputText value="#{detailCategory.levelCode}"/>	
       </p:column> 

       <p:column headerText="#{lbl['lbl.pm.bn.name']}" > 
         <h:outputText value="#{detailCategory.levelName}"/>
       </p:column> 
       
        <p:column headerText="#{lbl['lbl.pm.search.status']}" style="width:10%">                     
       </p:column >                 
       
     </p:dataTable>
	<p:spacer height="15"></p:spacer>   
   </p:panel>   	
</ui:composition>
