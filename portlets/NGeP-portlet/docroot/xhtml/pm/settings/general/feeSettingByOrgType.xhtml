<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.save']}" id="orgTypeFeeSaveBtn"
						partialSubmit="true" process=":form:settingTabId:feeSettingId"
						update=":form:settingTabId:feeSettingId"
						action="#{ruleCatalogueBackingBean.saveFeeExemptionForOrgType}"></p:commandButton>
				</div>
			</td>
		</tr>
	</table>
	<p:dataTable id="feeByOrgTypeTableID" var="feeObj" rows="10"
		widgetVar="feeByOrgTypeTableWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgType}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="feeByOrgTypeTableID" />
		
		<p:column  style="width:30%">
			<f:facet name="header">
			    <h:outputText value="*" styleClass="mandatory" />
				<h:outputText value=" #{lbl['lbl.pm.settings.fee.organisation.type']}" />
				
			</f:facet>
            <p:selectOneMenu id="orgTypeSysParameter" disabled="#{!feeObj.brandNew}"
						styleClass="ppDropDownWidthL" required="true" label="#{lbl['lbl.pm.settings.fee.organisation.type']}" style="margin-bottom: 5px;width : 225px;"
						value="#{feeObj.orgTypeId.parameterId}">
						<f:selectItems value="#{ruleCatalogueBackingBean.getOrgTypeDropdownValuesFOR()}" />
						<p:ajax event="change" process="@this" update="@this" partialSubmit="true" listener="#{ruleCatalogueBackingBean.getParameterObj(feeObj)}" />
					</p:selectOneMenu>
		</p:column>
		<p:column>
			<f:facet name="header">
			<h:outputText value="*" styleClass="mandatory" />
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>
			<p:calendar showOn="button" id="orgTypefeeeffDateId"
				style="width :100px;" required="true"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=orgTypefeeeffDateId])"
					process="@this" />
			</p:calendar>
		</p:column>

		<p:column>
			<f:facet name="header">
			
						#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>
			<p:calendar showOn="button" id="orgTypefeeexpDateId"
				style="width :100px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}"
				validatorMessage="#{lbl['lbl.pm.as.expdate']} #{lbl['lbl.pm.date.range.validation']} #{lbl['lbl.pm.as.effdate']}">
				<f:attribute name="startDate" value="#{feeObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />

			</p:calendar>
		</p:column>
		
		<p:column style="text-align:center;">
			<f:facet name="header">
                #{lbl['lbl.pm.action']}
			</f:facet>
			<p:commandLink id="orgTypedeleteFee" partialSubmit="true"
				process="@this"
				disabled="#{!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteOrgTypeFee(rowIndex)}"
				update=":form:settingTabId:feeSettingId:feeByOrgTypeTableID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
	</p:dataTable>

	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true" id="orgTypeFeeAddBtn"
			process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreOrgTypeFee()}"></p:commandButton>

	</div>


</ui:composition>
