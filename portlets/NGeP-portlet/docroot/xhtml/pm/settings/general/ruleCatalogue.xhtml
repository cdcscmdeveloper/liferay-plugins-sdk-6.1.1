
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="ruleCatalogMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		<p:outputPanel id="ruleCat">

			<div style="text-align: right; min-height: 40px;">

				<h:panelGroup>
					<p:commandButton value="#{lbl['lbl.cm.save.as.draft']}"
						icon="ui-icon-save"
						action="#{ruleCatalogueBackingBean.saveRuleCatalog}"
						update="@form"></p:commandButton>

				</h:panelGroup>

			</div>


			<p:tabView id="generalParameterTabID" orientation="left"
				activeIndex="#{ruleCatalogueBackingBean.managedBean.ruleCatTabActiveIndex}">

				<p:tab id="generalParameterId"
					title="#{lbl['lbl.pm.settings.general.parameter']}">

					<p:panel header="#{lbl['lbl.pm.settings.general.setting']}"
						toggleable="true">

						<table style="width: 100%; margin-top: 10px;">
							<tr style="height: 30px;">

								<td><p:outputLabel
										value="* #{lbl['lbl.pm.settings.date.format']}" /></td>
								<td><p:selectOneMenu value="#" style="width:128px;">
										<f:selectItem itemLabel="dd/MM/yy" itemValue="" />
									</p:selectOneMenu></td>
								<td><p:outputLabel value="#{lbl['lbl.pm.financial.year']}" /></td>
								<td><p:inputText value="2014" disabled="true" size="8" /></td>

							</tr>
							<tr style="height: 30px;">

								<td><p:outputLabel
										value="* #{lbl['lbl.pm.settings.time.format']}" /></td>
								<td><p:selectOneMenu value="#" style="width:128px;">
										<f:selectItem itemLabel="HH:MM" itemValue="" />
									</p:selectOneMenu></td>
								<td><p:outputLabel
										value="* #{lbl['lbl.pm.settings.notification.frequency']}" /></td>
								<td><ac:inputText value="3" required="true" size="8"></ac:inputText>
								</td>
							</tr>
							<tr style="height: 30px;">
								<td><p:outputLabel
										value="* #{lbl['lbl.pm.profiles.preferences.noformat']}" /></td>
								<td><p:selectOneMenu value="#" style="width:128px;">
										<f:selectItem itemLabel="#,##0" itemValue="" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>
							<tr style="height: 30px;">
								<td><p:outputLabel
										value="* #{lbl['lbl.pm.settings.language']}" /></td>
								<td><p:selectOneMenu value="#" style="width:128px;">
										<f:selectItem itemLabel="en" itemValue="" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>

						</table>
					</p:panel>

					<p:panel header="#{lbl['lbl.pm.settings.general.rule']}"
						toggleable="true">


					</p:panel>


				</p:tab>

				<p:tab id="kpiSlASettingId"
					title="#{lbl['lbl.pm.settings.kpi.sla.setting']}">
					<ui:include src="kpiSlASettingTab.xhtml"></ui:include>
				</p:tab>

				<p:tab id="feeSettingId"
					title="#{lbl['lbl.pm.settings.fee.setting']}">
					<ui:include src="feeSettingTab.xhtml"></ui:include>
				</p:tab>

				<p:tab id="yepSettingId"
					title="#{lbl['lbl.pm.settings.yep.setting']}">
					<ui:include src="yepSettingTab.xhtml"></ui:include>
				</p:tab>


			</p:tabView>


		</p:outputPanel>

	</ui:define>
</ui:composition>
