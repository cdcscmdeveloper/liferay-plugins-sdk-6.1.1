<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
				
		<style type="text/css">
			.value {
				width: 1000px;
			}
			
			.calendarClass td.ui-widget-content{
				border : 1px solid #dddddd !important;
			}
		</style>

		<script type="text/javascript">	
	
		function changeWeekEndColor(){
			
			clearDayColor();
			
			var weekEndDay1 = document.getElementById('#{facesContext.externalContext.encodeNamespace('')}:form:weekend1').value; 
			var weekEndDay2 = document.getElementById('#{facesContext.externalContext.encodeNamespace('')}:form:weekend2').value;
			
			
			var td1 = null;
			var td2 = null;
			
			if(weekEndDay1 !=''){			
				if(weekEndDay1 == 1){
					td1 = document.getElementsByClassName('fc-mon');
				} else if(weekEndDay1 == 2){
					td1 = document.getElementsByClassName('fc-tue');
				} else if(weekEndDay1 == 3){
					td1 = document.getElementsByClassName('fc-wed');
				} else if(weekEndDay1 == 4){
					td1 = document.getElementsByClassName('fc-thu');
				} else if(weekEndDay1 == 5){
					td1 = document.getElementsByClassName('fc-fri');
				} else if(weekEndDay1 == 6){
					td1 = document.getElementsByClassName('fc-sat');
				} else if(weekEndDay1 == 0){
					td1 = document.getElementsByClassName('fc-sun');
				}
			}
			
			if(weekEndDay2 !=''){
				if(weekEndDay2 == 1){
					td2 = document.getElementsByClassName('fc-mon');
				} else if(weekEndDay2 == 2){
					td2 = document.getElementsByClassName('fc-tue');
				} else if(weekEndDay2 == 3){
					td2 = document.getElementsByClassName('fc-wed');
				} else if(weekEndDay2 == 4){
					td2 = document.getElementsByClassName('fc-thu');
				} else if(weekEndDay2 == 5){
					td2 = document.getElementsByClassName('fc-fri');
				} else if(weekEndDay2 == 6){
					td2 = document.getElementsByClassName('fc-sat');
				} else if(weekEndDay2 == 0){
					td2 = document.getElementsByClassName('fc-sun');
				}
			}
			
			if(td1 != null){
				updateDayColor(td1, "lightGrey");
			}
			
			if(td2 != null){
				updateDayColor(td2, "lightGrey");
			}
			
			var hasClass =  document.getElementsByClassName('fc-today');
			if(hasClass.length > 0){
				document.getElementsByClassName('fc-today')[0].style.background = "#fbf9ee";
			}
 		}
		
		function clearDayColor(){
		
			updateDayColor(document.getElementsByClassName('fc-mon'),"white");
			updateDayColor(document.getElementsByClassName('fc-tue'),"white");
			updateDayColor(document.getElementsByClassName('fc-wed'),"white");
			updateDayColor(document.getElementsByClassName('fc-thu'),"white");
			updateDayColor(document.getElementsByClassName('fc-fri'),"white");
			updateDayColor(document.getElementsByClassName('fc-sat'),"white");
			updateDayColor(document.getElementsByClassName('fc-sun'),"white");
		}
		
		function updateDayColor(td, color){
		
			td[1].style.background=color;
			td[2].style.background=color;
			td[3].style.background=color;
			td[4].style.background=color;
			td[5].style.background=color;
			td[6].style.background=color;
		}
	</script>
	<script type="text/javascript">
    PrimeFaces.locales['ms'] = {
        closeText: 'Tutup',
        prevText: 'Sebelum',
        nextText: 'Selepas',
        currentText: 'Hari Ini',
        monthNames: ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'],
        monthNamesShort: ['Jan', 'Feb', 'Mac', 'Apr', 'Mei', 'Jun', 'Jul', 'Ogs', 'Sep', 'Okt', 'Nov', 'Dis'],
        dayNames: ['Ahad','Isnin','Selasa','Rabu','Khamis','Jumaat','Sabtu'],
        dayNamesShort: ['Ahd' , 'Isn' , 'Sel','Rab', 'Kha', 'Jum','Sab'],
        dayNamesMin: ['Ahd' , 'Isn' , 'Sel','Rab', 'Kha', 'Jum','Sab'],
        weekHeader: 'Hf',
        firstDay: 0,
        isRTL: false,
        showMonthAfterYear: false,
        yearSuffix: '',
        month: 'Bulan',
        week: 'Minggu',
        day: 'Hari',
        allDayText : 'ffff'
    };
</script>
		 <p:growl id="calendarMsg" showDetail="true" />
		<p:panel id="ruleConfigId">			
			<h:panelGroup id="calendarId">
				<table width="100%" >
					<tr>
						<td width="10%"><p:outputLabel
								value="#{lbl['lbl.pm.cal.state']}" /> <p:outputLabel value="*"
								styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="orgState"
								styleClass="ppDropDownWidthL" label="#{lbl['lbl.pm.cal.state']}"
								value="#{calendarBackingBean.managedBean.selectedState.stateId}"
								style="width: 275px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="-1" />
								<!--f:selectItem itemLabel="Malaysia" itemValue="0" /-->
								<f:selectItems
									value="#{calendarBackingBean.getStateListOfMalaysia()}"
									var="state" itemLabel="#{state.stateName}"
									itemValue="#{state.stateId}" />
								<p:ajax event="change"
									listener="#{calendarBackingBean.updateState}"
									partialSubmit="true" process="@this"
									update="schedule, weekend1 , weekend2" 
									oncomplete="changeWeekEndColor()" />
							</p:selectOneMenu> <h:inputHidden id="weekend1"
								value="#{calendarBackingBean.managedBean.selectedState.weekend1}" />
							<h:inputHidden id="weekend2"
								value="#{calendarBackingBean.managedBean.selectedState.weekend2}" />
						</td>
						<td><p:message for="orgState" id="orgStateMsg" display="icon" /></td>
					</tr>
					<tr />
					<tr>
					<td>
					<h:panelGrid columns="3">
				      <p:commandLink update=":form:schedule" actionListener="#{calendarBackingBean.nextPrevious}" process="@this">
				         <f:attribute name="increment" value="previous"/>
				          <h:graphicImage value="/css/images/design/ico-previous.png" />
				      </p:commandLink>
				      <p:commandLink update=":form:schedule" actionListener="#{calendarBackingBean.nextPrevious}" process="@this">
				         <f:attribute name="increment" value="next"/>
				          <h:graphicImage value="/css/images/design/ico-next.png" />
				      </p:commandLink>
				      <p:commandButton value="#{lbl['lbl.pm.cal.today']}" update=":form:schedule" actionListener="#{calendarBackingBean.today}" process="@this"/>
				   </h:panelGrid>
					
					</td>
					</tr>
					<tr>
						<td colspan="3"><p:schedule id="schedule" styleClass="calendarClass"
								pattern="dd-MM-yyyy" locale="#{calendarBackingBean.getLocale()}" timeZone="GMT+8"
								leftHeaderTemplate="" rightHeaderTemplate=""
								style="width : 700px; height : 600px;"
								value="#{calendarBackingBean.managedBean.eventModel}"
								initialDate="#{calendarBackingBean.managedBean.initialDate}"
								widgetVar="myschedule" timeFormat="">

								<p:ajax event="dateSelect"
									listener="#{calendarBackingBean.onDateSelect}"
									update="eventDetails, calendarMsg"									
									/>

								<p:ajax event="eventSelect"
									listener="#{calendarBackingBean.onEventSelect}"
									update="eventDetails, calendarMsg"
									oncomplete="eventDialog.show();"								
									/>
								<p:ajax event="eventMove"
									listener="#{calendarBackingBean.onEventMove}"
									update="calendarMsg" />
								<p:ajax event="eventResize"
									listener="#{calendarBackingBean.onEventResize}" />
							</p:schedule></td>
					</tr>
				</table>
			</h:panelGroup>		

		</p:panel>
		<p:dialog widgetVar="eventDialog" id="calEventDlg" modal="true"
				header="#{lbl['lbl.pm.cal.public.haliday.details']}" width="500"
				height="250" showEffect="clip" hideEffect="clip">
				<p:ajax event="close" update="schedule" listener="#{calendarBackingBean.changeWeekEndColor}" />
				<p:outputPanel>					
				<h:panelGroup id="eventDetails">
					<p:messages id="calendarMessages" showDetail="true" showSummary="false" autoUpdate="false"
					closable="true" severity="error"></p:messages>	
					<table width="100%">
						<tr>
							<td><h:outputLabel
								value="#{lbl['lbl.pm.cal.title']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="title" size="45" maxlength="30" 
									label="#{lbl['lbl.pm.cal.title']}"
									valueChangeListener="#{calendarBackingBean.holidayTitleValChange}"
									value="#{calendarBackingBean.managedBean.event.title}"
									required="true" >		
									</p:inputText>
									</td>
									<td>
									<p:message id="titleMsg" for="title" display="icon" />
							</td>
						</tr>
						<tr>

							<td><p:outputLabel value="#{lbl['lbl.pm.cal.frmdate']}" /></td>
							<td><p:calendar showOn="button" id="fromDateId" required="true"
									label="#{lbl['lbl.pm.cal.frmdate']}" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									value="#{calendarBackingBean.managedBean.event.startDate}">
								</p:calendar></td>
								<td>
								<p:message id="fromDateMsg" for="fromDateId" display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.pm.cal.todate']}" /></td>
							<td><p:calendar showOn="button" id="toDateId" required="true"
									label="#{lbl['lbl.pm.cal.todate']}" readonlyInput="true"
									validatorMessage="To Date should be greater than from Date"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									value="#{calendarBackingBean.managedBean.event.endDate}">
									<f:attribute name="startDate"
										value="#{calendarBackingBean.managedBean.event.startDate}" />
									<f:validator validatorId="primeDateRangeValidator" />
								</p:calendar>
								</td>
								<td>
									<p:message id="toDateMsg" for="toDateId" display="icon" />
								
								</td>
						</tr>
					</table>
					<div style="float: right;">
							<p:commandButton id="addButton" value="#{lbl['lbl.btn.save']}"
										actionListener="#{calendarBackingBean.addOrUpdateEvent}"
										update="eventDetails,calendarMessages" process="eventDetails"/>
							<p:commandButton value="#{lbl['lbl.btn.delete']}"
										actionListener="#{calendarBackingBean.deleteEvent}"
										update="schedule,eventDetails" process="@this"
										rendered="#{not calendarBackingBean.managedBean.newEvent}" />
					</div>
				</h:panelGroup>
				</p:outputPanel>
			</p:dialog>
			<p:dialog widgetVar="errDialog" id="calErrDlg" modal="true"
				header="#{lbl['lbl.pm.cal.warning']}" width="260" 
				height="100" showEffect="clip" hideEffect="clip">
				<h:panelGroup id="errDetails">

					<h:outputText value="#{lbl['lbl.pm.cal.err.popup.msg1']}" />
					<br />
					<br />
					<div style="float: right;">
						<p:commandButton value="#{lbl['lbl.btn.ok']}"
							oncomplete="errDialog.hide()"  process="@this" update="@this" />
					</div>

				</h:panelGroup>
			</p:dialog>
		
	</ui:define>
</ui:composition>
