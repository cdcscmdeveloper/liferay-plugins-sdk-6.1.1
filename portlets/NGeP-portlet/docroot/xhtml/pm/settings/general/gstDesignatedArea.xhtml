<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">	
	<style type="text/css">
		div[id$="gstDAStatusId_panel"] .ui-selectonemenu-items-wrapper{
	        width:100px;
	     }
	</style>
	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.save']}" id="daUpdateBtnId" partialSubmit="true"
						process=":form:settingTabId:gstId"
						update=":form:settingTabId:gstId"
						action="#{ruleCatalogueBackingBean.saveDesignatedArea}">
						</p:commandButton>
				</div>
			</td>
		</tr>
	</table>
	
	<p:dataTable id="designatedAreaTbl" var="daObj" rows="10"
		widgetVar="designatedAreaTblWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.daValidityList}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedDaValidity}"
		rowKey="#{daObj}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="designatedAreaTbl" />
		<p:column style="width:20%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.location.type']}" />
			</f:facet>
			<p:selectOneMenu required="true" 
				disabled="#{(!daObj.brandNew)}" 
				id="somDaLocationTypeId" value="#{daObj.designatedArea.locationType}"
				label="#{lbl['lbl.pm.settings.gst.location.type']}"
				style="width:100px;">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItems
						value="#{ruleCatalogueBackingBean.retrieveParameterDescList(ParameterTypeConst.locationLevel)}"
						var="parameter" itemLabel="#{parameter.codeName}"
						itemValue="#{parameter.pmParameter.parameterCode}" />
				<p:ajax event="change" 
					update=":form:settingTabId:gstId:designatedAreaTbl" 
					listener="#{ruleCatalogueBackingBean.resetLovLocation(daObj)}"
					process="@this" partialSubmit="true" />
			</p:selectOneMenu>
			<p:message id="somDaLocationTypeIdMsg" for="somDaLocationTypeId" display="icon" />
		</p:column>
		<p:column style="width:22%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.da.code']}" />
			</f:facet>
			<ac:lov id="lovPmLocation" lovId="V_PM_LOCATION" 
				readonly="true" required="true" 
				label="#{lbl['lbl.pm.location.code']}"
				disabled="#{!(daObj.brandNew) or empty daObj.designatedArea.locationType}"
				update=":form:settingTabId:gstId:designatedAreaTbl"
				size="15" headerText="#{lbl['lbl.pm.location.code']}"
				saveObject="ruleCatalogueBackingBean.managedBean.daValidityList[#{rowIndex}].designatedArea.vPmLocation"
				conditionField="status^1|locationType^#{daObj.designatedArea.locationType}|countryId^#{ruleCatalogueBackingBean.getDefaultCountry()}"
				value="#{daObj.designatedArea.vPmLocation.locationCode}">
			</ac:lov>
			<p:message id="lovPmLocationMsg" for="lovPmLocation" display="icon" />

		</p:column>
		
		<p:column style="width:40%;white-space:normal">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.da.title']}" />
			</f:facet>
			<h:outputText id ="daTitleId" value="#{daObj.designatedArea.vPmLocation.locationName}" />

		</p:column>
		<p:column width="10%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value=" #{lbl['lbl.pm.as.effdate']}" />
			                	</f:facet>
		<p:calendar showOn="button" id="daeffDateId" navigator="true"
				yearRange="#{DateUtils.getCalendarMaxYearRange()}"
	         	disabled="#{!daObj.brandNew and (daObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}" 
				required="true" label="#{lbl['lbl.pm.as.effdate']}"
				readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{daObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=daexpDateId])" process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
			
				<h:outputText value=" #{lbl['lbl.pm.as.expdate']}" />
						
			                	</f:facet>

			<p:calendar showOn="button" id="daexpDateId" navigator="true"
				yearRange="#{DateUtils.getCalendarMaxYearRange()}"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}" style="width :45px;"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{daObj.expDate}" validatorMessage="#{lbl['lbl.pm.as.expdate']} #{lbl['lbl.pm.date.range.validation']} #{lbl['lbl.pm.as.effdate']}">
				<f:attribute name="startDate" value="#{daObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />
			</p:calendar>
		</p:column>
		
	<!-- 	<p:column style="width:13%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.status']}" />
			</f:facet>
			<p:selectOneMenu value="#{daObj.recordStatusFlg}" id="gstDAStatusId"
				disabled="#{daObj.brandNew}" style="width:100px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<p:ajax event="change" immediate="true"
								listener="#{ruleCatalogueBackingBean.gstStatusChange(daObj)}"
								partialSubmit="true" process="@this"
								update="@this" />				
			</p:selectOneMenu>
		</p:column>  -->
	
		<p:column style="width:5%;text-align:center;">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.action']}" />
			</f:facet>
			<p:commandLink id="deldaItemCl" partialSubmit="true"
				process="@this" disabled="#{!daObj.brandNew and (daObj.effDate le ruleCatalogueBackingBean.managedBean.today)}"
				action="#{ruleCatalogueBackingBean.deleteDesignatedArea(rowIndex)}"
				update=":form:settingTabId:gstId">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			
		</p:column>
		
		
	</p:dataTable>
	
		<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true" id="daAddBtn"
				process=":form:settingTabId:gstId"
				update=":form:settingTabId:gstId"
				action="#{ruleCatalogueBackingBean.addDesignatedArea()}"></p:commandButton>
			</div>
	</ui:composition>
