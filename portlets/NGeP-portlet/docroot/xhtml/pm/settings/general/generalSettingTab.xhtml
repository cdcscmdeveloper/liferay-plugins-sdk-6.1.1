<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



		<div style="text-align: right; min-height: 40px;">

			<h:panelGroup>
				<p:commandButton value="#{lbl['lbl.cm.save']}"
				    partialSubmit="true" process="settingTabId:generalSet"
					action="#{ruleCatalogueBackingBean.saveGeneralSetting}"
					update="settingTabId"></p:commandButton>

			</h:panelGroup>

		</div>
		

			<table style="width: 100%;">
				<tr style="height: 30px;">

					<td><p:outputLabel
							value="#{lbl['lbl.pm.settings.date.format']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.formatdate}"
							style="width:128px;">
							<f:selectItem itemLabel="dd/MM/yyyy" itemValue="dd/MM/yyyy" />
							<f:selectItem itemLabel="dd/MM/yy" itemValue="dd/MM/yy" />
							<f:selectItem itemLabel="dd/MMM/yy" itemValue="dd/MMM/yy" />
							<f:selectItem itemLabel="dd-MM-yyyy" itemValue="dd-MM-yyyy" />
							<f:selectItem itemLabel="dd-MM-yy" itemValue="dd-MM-yy" />
							<f:selectItem itemLabel="dd-MMM-yyyy" itemValue="dd-MMM-yyyy" />
						</p:selectOneMenu></td>
					<td><p:outputLabel value="#{lbl['lbl.pm.financial.year']}" /></td>
					<td><p:inputText
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.financialYear}"
							disabled="true" size="8" /></td>

				</tr>
				<tr style="height: 30px;">

					<td><p:outputLabel
							value="#{lbl['lbl.pm.settings.time.format']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.formatTime}"
							style="width:128px;">
							<f:selectItem itemLabel="12H" itemValue="12H" />
							<f:selectItem itemLabel="24H" itemValue="24H" />
							<f:selectItem itemLabel="HH:mm" itemValue="HH:mm" />
						</p:selectOneMenu></td>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.gl.account']}" /></td>
					<td><ac:lov id="lovGLAccount" lovId="PM_GL_ACCOUNT"
							size="15" headerText="GL Account" readonly="true"
							saveObject="ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.pmGlAccount"
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.pmGlAccount.glAccCode}">
						</ac:lov> 
						
						</td>
				</tr>
				<tr style="height: 30px;">
					<td><p:outputLabel
							value="#{lbl['lbl.pm.profiles.preferences.noformat']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.formatNumber}"
							style="width:128px;">
							<f:selectItem itemLabel="#,##0" itemValue="#,##0" />
							<f:selectItem itemLabel="###0" itemValue="###0" />
						</p:selectOneMenu></td>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.vot.fund.code']}" /></td>
					<td><ac:lov id="lovVotFund" lovId="PM_VOT_FUND"
							size="15" headerText="Vot Fund" readonly="true"
							saveObject="ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.pmVotFund"
							conditionField="recordStatus^1|votFundType^A"
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.pmVotFund.votFundCode}">
						</ac:lov> 
						
						</td>
				</tr>
				<tr style="height: 30px;">
					<td><p:outputLabel
							value="#{lbl['lbl.pm.settings.notification.language']}" /><p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu
							value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.preferredLanguage}"
							style="width:128px;">
							<!-- <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> -->  
	            		<f:selectItems value="#{ruleCatalogueBackingBean.getLanguageList()}" 
	            			var="language" itemLabel="#{language.languageName}" itemValue="#{language.languageCode}" />    
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<!-- 
				<tr style="height: 30px;">
				  <td><p:outputLabel
							value="#{lbl['lbl.pm.settings.operational.threshold']}" />
				  </td>
				  <td><p:selectOneRadio value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isGeneralThreshold}">
				        <f:selectItem itemLabel="#{lbl['lbl.pm.settings.centralized']}" itemValue="1"/>
				        <f:selectItem itemLabel="#{lbl['lbl.pm.settings.ministry']}" itemValue="0"/>
				  </p:selectOneRadio>
				  </td>
				</tr>
              -->
			</table>
			<br/>
	

</ui:composition>
