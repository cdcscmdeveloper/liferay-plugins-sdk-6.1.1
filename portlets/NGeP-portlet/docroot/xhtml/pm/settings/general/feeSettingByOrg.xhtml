<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<div style="text-align: right; min-height: 40px;">


		<p:commandButton value="#{lbl['lbl.btn.update']}" partialSubmit="true" process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.saveFeeExemptionForOrgItem}"></p:commandButton>



	</div>


	<p:dataTable id="feeByOrgItemTableID" var="feeObj" rows="10"
		widgetVar="feeByOrgItemTableWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgAndItem}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
          <ac:paginator for="feeByOrgItemTableID" />
		<p:column style="width:30%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.fee.org.suplier.name']}" />
			</f:facet>
			<ac:lov id="lovSupplier" lovId="PM_ORG_PROFILE_WITH_SUPPLIER" size="35"
				readonly="true"
				disabled="#{!(feeObj.brandNew)}"
				label="#{lbl['lbl.pm.settings.fee.org.suplier.name']}"
				headerText="Supplier"
				update=":form:settingTabId:feeSettingId:feeByOrgItemTableID"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgAndItem[#{rowIndex}].orgProfileId"
				value="#{feeObj.orgProfileId.smSupplier.companyName}">
			</ac:lov>
 <p:message id="lovSupplierMsg" for="lovSupplier" display="icon" />

		</p:column>
		<p:column style="width:30%">
			<f:facet name="header">
				                	#{lbl['lbl.pm.itemname']}
				                </f:facet>

			<ac:lov id="lovItem" lovId="CM_ITEM"
				disabled="#{feeObj.orgProfileId.smSupplier == null or !(feeObj.brandNew)}" size="40"
				readonly="true" headerText="Item"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgAndItem[#{rowIndex}].itemId"
				conditionField="cmSupplierItems.supplierId^#{feeObj.orgProfileId.smSupplier.supplierId}"
				value="#{feeObj.itemId.itemName}">
			</ac:lov>

		</p:column>
		<p:column width="10%">
			<f:facet name="header">
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>

			<p:calendar showOn="button" id="FeeOrgeffDateId"
		    	disabled = "#{feeObj.isG2G == 1 or feeObj.recordStatusFlg == 0 or (!feeObj.brandNew and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime()))}" style="width :40px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.tomorrow}"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=FeeOrgexpDateId])"
					process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
				#{lbl['lbl.pm.as.expdate']}
			 </f:facet>

			<p:calendar showOn="button" id="FeeOrgexpDateId"
		    	disabled = "#{feeObj.isG2G == 1 or feeObj.recordStatusFlg == 0 or (!feeObj.brandNew and (feeObj.expDate lt DateUtils.getCurrentDateWithoutTime()))}" style="width :40px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.tomorrow}"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				validatorMessage="Expire Date should be greater than Effective Date"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}">
				<f:attribute name="startDate" value="#{feeObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{feeObj.recordStatusFlg}"
				disabled="#{typeValueObj.brandNew or (feeObj.isG2G == 1)}" style="width:90px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<p:ajax event="change" immediate="true"
								listener="#{ruleCatalogueBackingBean.checkFeeStatusForOrg(rowIndex)}"
								partialSubmit="true" process="@this"
								update=":form:settingTabId:feeSettingId:feeByOrgItemTableID :form:settingTabId:feeSettingId:feeOrgStatusConfirmDialog" />
					
			</p:selectOneMenu>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">

			</f:facet>
			<p:commandLink id="orgDeleteFee" partialSubmit="true" process="@this"
			disabled="#{(feeObj.isG2G == 1) || (!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime()))}"
				action="#{ruleCatalogueBackingBean.deleteOrgAndItemFee(rowIndex)}"
				update=":form:settingTabId:feeSettingId:feeByOrgItemTableID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>

		</p:column>
	</p:dataTable>

	<br />
	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" 
			partialSubmit="true" process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreOrgAndItemFee()}"></p:commandButton>

	</div>
    <p:confirmDialog id="feeOrgStatusConfirmDialog" closable="false"
			severity="alert" header="#{lbl['lbl.pm.inactive.popUp.header']}"
			widgetVar="feeOrgStatusConfirmDialog"
			message="#{ruleCatalogueBackingBean.inactiveFeeOrgPopUpMsg}"
			appendToBody="true">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					partialSubmit="true" process="@this"
					update=":form:settingTabId:feeSettingId:feeByOrgItemTableID"
				    action="#{ruleCatalogueBackingBean.feeExemptionStatusChangeForOrg}"
					onstart="feeOrgStatusConfirmDialog.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" action="#{ruleCatalogueBackingBean.revertFeeStatusChangeForOrg}"
					partialSubmit="true" process="@this"
				    update=":form:settingTabId:feeSettingId:feeByOrgItemTableID"
				     />
			</div>
		</p:confirmDialog>
</ui:composition>
