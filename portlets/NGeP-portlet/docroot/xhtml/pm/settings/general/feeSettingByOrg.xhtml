<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.save']}" id="orgFeeSaveBtn"
						partialSubmit="true" process=":form:settingTabId:feeSettingId"
						update=":form:settingTabId:feeSettingId"
						action="#{ruleCatalogueBackingBean.saveFeeExemptionForOrgItem}"></p:commandButton>
				</div>
			</td>
		</tr>
	</table>


	<p:dataTable id="feeByOrgItemTableID" var="feeObj" rows="10"
		widgetVar="feeByOrgItemTableWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgAndItem}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="feeByOrgItemTableID" />
		<p:column style="width:30%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.fee.org.suplier.name']}" />
			</f:facet>
			<ac:lov id="lovSupplier" lovId="PM_ORG_PROFILE_WITH_SUPPLIER"
				size="35" readonly="true" disabled="#{!(feeObj.brandNew)}"
				label="#{lbl['lbl.pm.settings.fee.org.suplier.name']}"
				headerText="#{lbl['lbl.pm.settings.fee.org.suplier']}"
				update=":form:settingTabId:feeSettingId:feeByOrgItemTableID"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgAndItem[#{rowIndex}].orgProfileId"
				value="#{feeObj.orgProfileId.smSupplier.companyName}">
			</ac:lov>
			<p:message id="lovSupplierMsg" for="lovSupplier" display="icon" />

		</p:column>
		<p:column style="width:30%">
			<f:facet name="header">
				                	#{lbl['lbl.pm.itemname']}
				                </f:facet>

			<ac:lov id="lovItem" lovId="CM_ITEM"
				disabled="#{feeObj.orgProfileId.smSupplier == null or !(feeObj.brandNew)}"
				size="40" readonly="true" headerText="Item"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForOrgAndItem[#{rowIndex}].itemId"
				conditionField="cmSupplierItems.itemStatus^U|cmSupplierItems.supplierId^#{feeObj.orgProfileId.smSupplier.supplierId}"
				value="#{feeObj.itemId.itemName}">
			</ac:lov>

		</p:column>
		<p:column width="10%">
			<f:facet name="header">
			<h:outputText value="*" styleClass="mandatory" />
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>
   <!-- disabled="#{feeObj.isG2G == 1 or feeObj.recordStatusFlg == 0 or (!feeObj.brandNew and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime()))}" -->
			<p:calendar showOn="button" id="FeeOrgeffDateId" navigator="true"
				yearRange="#{DateUtils.getCalendarMaxYearRange(feeObj.effDate)}"
				style="width :40px;" required="true"
				maxdate="#{ruleCatalogueBackingBean.managedBean.maxDate}"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="FeeOrgexpDateId,@this"
					process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
				#{lbl['lbl.pm.as.expdate']}
			 </f:facet>
<!-- disabled="#{feeObj.isG2G == 1 or feeObj.recordStatusFlg == 0 or (!feeObj.brandNew and (feeObj.expDate lt DateUtils.getCurrentDateWithoutTime()))}" -->
			<p:calendar showOn="button" id="FeeOrgexpDateId" navigator="true"
				yearRange="#{DateUtils.getCalendarMaxYearRange(feeObj.expDate)}"
				style="width :40px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				maxdate="#{ruleCatalogueBackingBean.managedBean.maxDate}"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				validatorMessage="#{lbl['lbl.pm.as.expdate']} #{lbl['lbl.pm.date.range.validation']} #{lbl['lbl.pm.as.effdate']}"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}">
				<f:attribute name="startDate" value="#{feeObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />
				<p:ajax event="dateSelect" update="@this"
					process="@this" />
			</p:calendar>
		</p:column>

	<!-- 	<p:column width="10%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{feeObj.recordStatusFlg}"
				disabled="#{typeValueObj.brandNew or (feeObj.isG2G == 1)}"
				style="width:90px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<p:ajax event="change" immediate="true"
					listener="#{ruleCatalogueBackingBean.checkFeeStatusForOrg(rowIndex)}"
					partialSubmit="true" process="@this"
					update=":form:settingTabId:feeSettingId:feeByOrgItemTableID :form:settingTabId:feeSettingId:feeOrgStatusConfirmDialog" />

			</p:selectOneMenu>
		</p:column>  -->
		<p:column style="width:5%;text-align:center;">
			<f:facet name="header">
               #{lbl['lbl.pm.action']}
			</f:facet>
			<p:commandLink id="orgDeleteFee" 
				partialSubmit="true" 
				process="@this" 
				disabled="#{(feeObj.isG2G == 1) || (!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime()))}"
				oncomplete="orgDeletePopUp.show();"
				update="@([id$=#{orgDeleteId}])">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				<f:setPropertyActionListener target="#{ruleCatalogueBackingBean.managedBean.deleteRowIndex}" 
							value="#{rowIndex}" />
			</p:commandLink>
		</p:column>
	</p:dataTable>

	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true" id="orgFeeAddBtn"
			process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreOrgAndItemFee()}"></p:commandButton>

	</div>
	<ac:confirmationPopup id="orgDeleteId"
				widget="orgDeletePopUp"
				okAction="ruleCatalogueBackingBean.deleteOrgAndItemFee()"
				width="400" height="100"
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" 
				update=":form:settingTabId:feeSettingId:feeByOrgItemTableID" />
	<p:dialog id="feeOrgStatusConfirmDialog"
		widgetVar="feeOrgStatusConfirmDialog" closable="false"
		header="#{lbl['lbl.pm.inactive.popUp.header']}"
		styleClass="screen-title" resizable="false" modal="true" width="400"
		height="100">
		<h:panelGrid columns="3">
			<p:graphicImage styleClass="ui-icon-complain" />
			<p:spacer width="10" />
			<p:inputTextarea disabled="true" autoResize="true"
				value="#{ruleCatalogueBackingBean.inactiveFeeOrgPopUpMsg}" rows="3"
				cols="48" styleClass="ui-inputtextarea" />
		</h:panelGrid>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" partialSubmit="true"
				process="@this"
				update=":form:settingTabId:feeSettingId:feeByOrgItemTableID"
				action="#{ruleCatalogueBackingBean.feeExemptionStatusChangeForOrg}"
				onstart="feeOrgStatusConfirmDialog.hide();blockWidget.show();"
				oncomplete="blockWidget.hide();" />
			<p:commandButton value="#{lbl['lbl.btn.no']}"
				action="#{ruleCatalogueBackingBean.revertFeeStatusChangeForOrg}"
				partialSubmit="true" process="@this"
				update=":form:settingTabId:feeSettingId:feeByOrgItemTableID" />
		</div>
	</p:dialog>

</ui:composition>
