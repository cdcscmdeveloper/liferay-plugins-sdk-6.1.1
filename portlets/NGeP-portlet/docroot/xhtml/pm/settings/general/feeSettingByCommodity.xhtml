<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div style="text-align: right; min-height: 40px;">


		<p:commandButton value="#{lbl['lbl.cm.save']}" partialSubmit="true"
			process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.saveFeeExemptionForComodity}"></p:commandButton>



	</div>

	<p:dataTable id="feeByComodityTableID" var="feeObj" row="10"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForComodity}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="feeByComodityTableID" />
		<p:column>
			<f:facet name="header">

				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.unspsc.code']}" />
			</f:facet>
			<ac:lov id="lovCommodity" lovId="CM_UNSPSC" readonly="true"
				label="#{lbl['lbl.cm.unspsc.code']}"
				disabled="#{!(feeObj.brandNew)}"
				update=":form:settingTabId:feeSettingId:feeByComodityTableID"
				size="15" headerText="unspsc commodity"
				postUpdateListener="ruleCatalogueBackingBean.updateUnspscForFee(#{rowIndex} , ruleCatalogueBackingBean.managedBean.feeExemptionsForComodity)"
				saveObject="ruleCatalogueBackingBean.managedBean.selectedComodity"
				conditionField="recordStatus^1|unspscLevel^3"
				value="#{feeObj.unspscId.unspscCode}">
			</ac:lov>
			<p:message id="lovCommodityMsg" for="lovCommodity" display="icon" />

		</p:column>
		<p:column>
			<f:facet name="header">
				                	#{lbl['lbl.cm.unspsc.title']}
				                </f:facet>
				               #{feeObj.unspscId.unspscTitle}
			            </p:column>
		<p:column id="cmTypelist">
			<f:facet name="header">
				<h:outputText value=" #{lbl['lbl.pm.unspsc.type']}" />
			</f:facet>

			<p:selectOneMenu value="#{feeObj.typeId.typeId}" label="UNSPSC Type"
				disabled="#{!(feeObj.brandNew) || feeObj.unspscId.unspscCode == null}"
				style="width:128px;">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItems value="#{feeObj.types}" itemLabel="#{type.typeName}"
					itemValue="#{type.typeId}" var="type" />
			</p:selectOneMenu>
		</p:column>
		<p:column width="10%">
			<f:facet name="header">
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>

			<p:calendar showOn="button" id="effDate" style="width :100px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=comodityfeeExpDateId])"
					process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
						#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>

			<p:calendar showOn="button" id="comodityfeeExpDateId"
				style="width :100px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}">

			</p:calendar>
		</p:column>

		<p:column width="6%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{feeObj.recordStatusFlg}"
				disabled="#{typeValueObj.brandNew}" style="width:128px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
			</p:selectOneMenu>
		</p:column>
		<p:column width="3%">
			<f:facet name="header">

			</f:facet>
			<p:commandLink id="comoditydeleteFee" partialSubmit="true"
				process="@this"
				disabled="#{!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteComodityFee(rowIndex)}"
				update=":form:settingTabId:feeSettingId:feeByComodityTableID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
	</p:dataTable>
	<br />
	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
			process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreComodityFee()}"></p:commandButton>

	</div>



</ui:composition>
