<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.save']}" id="commodityFeeSaveBtn"
						partialSubmit="true" process=":form:settingTabId:feeSettingId"
						update=":form:settingTabId:feeSettingId"
						action="#{ruleCatalogueBackingBean.saveFeeExemptionForComodity}"></p:commandButton>
				</div>
			</td>
		</tr>
	</table>
	<p:dataTable id="feeByComodityTableID" var="feeObj" rows="10"
		widgetVar="feeByComodityTableWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForComodity}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="feeByComodityTableID" />
		<p:column style="width:13%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.unspsc.code']}" />
			</f:facet>
			<ac:lov id="lovCommodity" lovId="CM_UNSPSC" readonly="true"
				label="#{lbl['lbl.cm.unspsc.code']}"
				disabled="#{!(feeObj.brandNew)}"
				update=":form:settingTabId:feeSettingId:feeByComodityTableID"
				size="7" headerText="unspsc commodity"
				postUpdateListenerWithIndex="ruleCatalogueBackingBean.updateUnspscForFee"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForComodity[#{rowIndex}].unspscId"
				conditionField="recordStatus^1|unspscLevel^3"
				value="#{feeObj.unspscId.unspscCode}">
			</ac:lov>
			<p:message id="lovCommodityMsg" for="lovCommodity" display="icon" />

		</p:column>
		<p:column style="width:37%;white-space:normal">
			<f:facet name="header">
				                	#{lbl['lbl.cm.unspsc.title']}
				                </f:facet>
				               #{feeObj.unspscId.unspscTitle}
			            </p:column>
		<p:column id="cmTypelist" style="width:15%">
			<f:facet name="header">
				<h:outputText value=" #{lbl['lbl.pm.unspsc.type']}" />
			</f:facet>

			<p:selectOneMenu value="#{feeObj.typeId.typeId}" label="UNSPSC Type"
				disabled="#{!(feeObj.brandNew) || feeObj.unspscId.unspscCode == null}"
				style="width:128px;">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItems value="#{feeObj.types}" itemLabel="#{type.typeName}"
					itemValue="#{type.typeId}" var="type" />
				<p:ajax event="change"
					listener="#{ruleCatalogueBackingBean.typeValueChgangeListener(feeObj)}"
					partialSubmit="true" process="@this" update="@this" />

			</p:selectOneMenu>
		</p:column>
		<p:column width="10%">
			<f:facet name="header">
			<h:outputText value="*" styleClass="mandatory" />
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>
<!-- disabled="#{feeObj.recordStatusFlg == 0 or (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}" -->
			<p:calendar showOn="button" id="comodityfeeeffDateId"
				style="width :100px;" required="true"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=comodityfeeexpDateId])"
					process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
			
						#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>
<!-- disabled="#{feeObj.recordStatusFlg == 0 or (feeObj.expDate lt DateUtils.getCurrentDateWithoutTime())}" -->
			<p:calendar showOn="button" id="comodityfeeexpDateId"
				style="width :100px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}"
				validatorMessage="#{lbl['lbl.pm.as.expdate']} #{lbl['lbl.pm.date.range.validation']} #{lbl['lbl.pm.as.effdate']}">
				<f:attribute name="startDate" value="#{feeObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />

			</p:calendar>
		</p:column>

<!--		<p:column width="10%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{feeObj.recordStatusFlg}"
				disabled="#{typeValueObj.brandNew}" style="width:90px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<p:ajax event="change" immediate="true"
					listener="#{ruleCatalogueBackingBean.checkFeeStatusForCommodity(rowIndex)}"
					partialSubmit="true" process="@this"
					update=":form:settingTabId:feeSettingId:feeByComodityTableID :form:settingTabId:feeSettingId:feeCommodityStatusConfirmDialog" />

			</p:selectOneMenu>
		</p:column>   -->
		
		<p:column style="width:5%;text-align:center;">
			<f:facet name="header">
                #{lbl['lbl.pm.action']}
			</f:facet>
			<p:commandLink id="comoditydeleteFee" partialSubmit="true"
				process="@this"
				disabled="#{!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteComodityFee(rowIndex)}"
				update=":form:settingTabId:feeSettingId:feeByComodityTableID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
	</p:dataTable>

	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true" id="commodityFeeAddBtn"
			process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreComodityFee()}"></p:commandButton>

	</div>

	<p:dialog id="feeCommodityStatusConfirmDialog"
		widgetVar="feeCommodityStatusConfirmDialog" closable="false"
		header="#{lbl['lbl.pm.inactive.popUp.header']}"
		styleClass="screen-title" resizable="false" modal="true" width="400"
		height="100">
		<h:panelGrid columns="3">
			<p:graphicImage styleClass="ui-icon-complain" />
			<p:spacer width="10" />
			<p:inputTextarea disabled="true" autoResize="true"
				value="#{ruleCatalogueBackingBean.inactiveFeeComoPopUpMsg}" rows="3"
				cols="50" styleClass="ui-inputtextarea" />
		</h:panelGrid>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}" partialSubmit="true"
				process="@this"
				update=":form:settingTabId:feeSettingId:feeByComodityTableID"
				action="#{ruleCatalogueBackingBean.feeExemptionStatusChangeForCommodity}"
				onstart="feeCommodityStatusConfirmDialog.hide();blockWidget.show();"
				oncomplete="blockWidget.hide();" />
			<p:commandButton value="#{lbl['lbl.btn.no']}"
				action="#{ruleCatalogueBackingBean.revertFeeStatusChangeForComodity}"
				partialSubmit="true" process="@this"
				update=":form:settingTabId:feeSettingId:feeByComodityTableID" />
		</div>
	</p:dialog>

</ui:composition>
