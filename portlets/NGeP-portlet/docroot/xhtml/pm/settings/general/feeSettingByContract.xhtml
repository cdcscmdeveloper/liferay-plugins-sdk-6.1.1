<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	
	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
		<p:commandButton value="#{lbl['lbl.btn.save']}" partialSubmit="true" process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId" id="contractFeeSaveBtn"
			action="#{ruleCatalogueBackingBean.saveFeeExemptionForContract}"></p:commandButton>
</div>
</td>
</tr>
</table>

	<p:dataTable id="feeByContractTableID" var="feeObj" rows="10"
		widgetVar="feeByContractTableWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForContract}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
 <ac:paginator for="feeByContractTableID" />
		<p:column width="20%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.contract.no']}" />
				<ac:iconTooltip value="#{lbl['lbl.pm.settings.fee.by.contract.tooltip']}" />
			</f:facet>
			<ac:lov id="lovContract" lovId="CT_CONTRACT_FOR_FEE" readonly="true" disabled="#{!(feeObj.brandNew)}"
				label="#{lbl['lbl.pm.contract.no']}" size="20" headerText="Contract"
				update=":form:settingTabId:feeSettingId:feeByContractTableID"
				postUpdateListenerWithIndex="ruleCatalogueBackingBean.updateDatesForFeeBaseOnContract"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForContract[#{rowIndex}].contractId"
				conditionField="recordStatus^1"
				value="#{feeObj.contractId.contractNo}">
			</ac:lov>
   <p:message id="lovContractMsg" for="lovContract" display="icon" />

		</p:column>
		<p:column width="45%">
			<f:facet name="header">
				                	#{lbl['lbl.pm.itemname']}
				                </f:facet>

			<ac:lov id="lovContractItem" lovId="SC_REQUEST_ITEM"
				disabled="#{feeObj.contractId.contractNo == null || !(feeObj.brandNew)}" size="50"
				headerText="Contract Item" readonly="true"
				conditionField="recordStatus^1|ctContractItem.ctContractVer.ctContract.contractId^#{feeObj.contractId.contractId}"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForContract[#{rowIndex}].requestItemId"
				value="#{feeObj.requestItemId.itemName}">
			</ac:lov>



		</p:column>
		<p:column width="10%">
			<f:facet name="header">
			<h:outputText value="*" styleClass="mandatory" />
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>
<!--  disabled ="#{feeObj.recordStatusFlg == 0 or (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}" -->
			<p:calendar showOn="button" id="contractFeeeffDateId" required="true" navigator="true"
				yearRange="#{DateUtils.getCalendarMaxYearRange()}"
				mindate="#{feeObj.defaultEffDate}" style="width :45px;"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=contractFeeexpDateId])" process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
						#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>
<!--  disabled = "#{feeObj.recordStatusFlg == 0 or (feeObj.expDate lt DateUtils.getCurrentDateWithoutTime())}" -->
			<p:calendar showOn="button" id="contractFeeexpDateId" navigator="true"
				yearRange="#{DateUtils.getCalendarMaxYearRange()}"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}" style="width :45px;"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}" validatorMessage="#{lbl['lbl.pm.as.expdate']} #{lbl['lbl.pm.date.range.validation']} #{lbl['lbl.pm.as.effdate']}">
				<f:attribute name="startDate" value="#{feeObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />
			</p:calendar>
		</p:column>

	<!-- 	<p:column width="10%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{feeObj.recordStatusFlg}"
				disabled="#{typeValueObj.brandNew}" style="width:90px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
						<p:ajax event="change" immediate="true"
								listener="#{ruleCatalogueBackingBean.checkFeeStatusForContract(rowIndex)}"
								partialSubmit="true" process="@this"
								update=":form:settingTabId:feeSettingId:feeByContractTableID :form:settingTabId:feeSettingId:feeContractStatusConfirmDialog" />
				
		
			</p:selectOneMenu>
		</p:column>  -->
		<p:column style="width:5%;text-align:center;">
			<f:facet name="header">
               #{lbl['lbl.pm.action']}
			</f:facet>
			<p:commandLink id="contractdeleteFee" partialSubmit="true" process="@this"
			disabled="#{!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteContractFee(rowIndex)}"
				update=":form:settingTabId:feeSettingId:feeByContractTableID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
	</p:dataTable>
	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" id="contractFeeAddBtn"
		partialSubmit="true" process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreContractFee()}"></p:commandButton>

	</div>
	<p:dialog id="feeContractStatusConfirmDialog" widgetVar="feeContractStatusConfirmDialog" closable="false"
			header="#{lbl['lbl.pm.inactive.popUp.header']}" styleClass="screen-title"
			resizable="false" modal="true" width="400" height="100">
			<h:panelGrid columns="3">
				<p:graphicImage styleClass="ui-icon-complain" />
				<p:spacer width="10" />
				<p:inputTextarea disabled="true" autoResize="true" 
					value="#{ruleCatalogueBackingBean.inactiveFeeContPopUpMsg}" rows="3"
					cols="50" styleClass="ui-inputtextarea" />
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					partialSubmit="true" process="@this"
					update=":form:settingTabId:feeSettingId:feeByContractTableID"
				    action="#{ruleCatalogueBackingBean.feeExemptionStatusChangeForContract}"
					onstart="feeContractStatusConfirmDialog.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" action="#{ruleCatalogueBackingBean.revertFeeStatusChangeForContract}"
					partialSubmit="true" process="@this"
				    update=":form:settingTabId:feeSettingId:feeByContractTableID"
				     />
			</div>
		</p:dialog>

</ui:composition>
