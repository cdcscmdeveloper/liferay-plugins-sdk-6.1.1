<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div style="text-align: right; min-height: 40px;">


		<p:commandButton value="#{lbl['lbl.btn.update']}" partialSubmit="true" process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.saveFeeExemptionForContract}"></p:commandButton>

	</div>

	<p:dataTable id="feeByContractTableID" var="feeObj" rows="10"
		value="#{ruleCatalogueBackingBean.managedBean.feeExemptionsForContract}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedFeeExemption}"
		rowKey="#{feeObj}" rowIndexVar="rowIndex" selectionMode="single">
 <ac:paginator for="feeByContractTableID" />
		<p:column>
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.contract.no']}" />
			</f:facet>
			<ac:lov id="lovContract" lovId="CT_CONTRACT_FOR_FEE" readonly="true" disabled="#{!(feeObj.brandNew)}"
				label="#{lbl['lbl.pm.contract.no']}" size="20" headerText="Contract"
				update=":form:settingTabId:feeSettingId:feeByContractTableID"
				postUpdateListener="ruleCatalogueBackingBean.updateDatesForFeeBaseOnContract(#{rowIndex} ,ruleCatalogueBackingBean.managedBean.feeExemptionsForContract[#{rowIndex}].contractId)"
				saveObject="ruleCatalogueBackingBean.managedBean.feeExemptionsForContract[#{rowIndex}].contractId"
				conditionField="recordStatus^1"
				value="#{feeObj.contractId.contractNo}">
			</ac:lov>
   <p:message id="lovContractMsg" for="lovContract" display="icon" />

		</p:column>
		<p:column>
			<f:facet name="header">
				                	#{lbl['lbl.pm.itemname']}
				                </f:facet>

			<ac:lov id="lovContractItem" lovId="CT_CONTRACT_ITEM"
				disabled="#{feeObj.contractId.contractNo == null || !(feeObj.brandNew)}" size="35"
				headerText="Contract Item" readonly="true"
				postUpdateListener="ruleCatalogueBackingBean.scRequestItemCodeUpdate(#{rowIndex},ruleCatalogueBackingBean.managedBean.feeExemptionsForContract)"
				conditionField="recordStatus^1|ctContractVer.ctContract.contractId^#{feeObj.contractId.contractId}"
				saveObject="ruleCatalogueBackingBean.managedBean.selectedCtContractItem"
				value="#{feeObj.requestItemId.itemName}">
			</ac:lov>



		</p:column>
		<p:column width="10%">
			<f:facet name="header">
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>

			<p:calendar showOn="button" id="effDate"  disabled ="#{feeObj.recordStatusFlg == 0 or (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				mindate="#{feeObj.defaultEffDate}" style="width :45px;"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.effDate}">
				<p:ajax event="dateSelect" update="@([id$=contractFeeExpDateId])" process="@this" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
						#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>

			<p:calendar showOn="button" id="contractFeeExpDateId"  disabled = "#{feeObj.recordStatusFlg == 0 or (feeObj.expDate lt DateUtils.getCurrentDateWithoutTime())}"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}" style="width :45px;"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{feeObj.expDate}">
				<f:attribute name="startDate" value="#{feeObj.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />
			</p:calendar>
		</p:column>

		<p:column width="8%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{feeObj.recordStatusFlg}"
				disabled="#{typeValueObj.brandNew}" style="width:128px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
			</p:selectOneMenu>
		</p:column>
		<p:column width="3%">
			<f:facet name="header">

			</f:facet>
			<p:commandLink id="contractdeleteFee" partialSubmit="true" process="@this"
			disabled="#{!(feeObj.brandNew) and (feeObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteContractFee(rowIndex)}"
				update=":form:settingTabId:feeSettingId:feeByContractTableID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
	</p:dataTable>
	<br />
	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" 
		partialSubmit="true" process=":form:settingTabId:feeSettingId"
			update=":form:settingTabId:feeSettingId"
			action="#{ruleCatalogueBackingBean.addMoreContractFee()}"></p:commandButton>

	</div>


</ui:composition>
