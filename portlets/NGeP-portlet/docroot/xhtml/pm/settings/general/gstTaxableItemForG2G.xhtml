<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:outputPanel id="opTiG2G">
	<div style="text-align: right; min-height: 40px;">
		<p:commandButton value="#{lbl['lbl.btn.update']}" id="tiG2GUpdateBtnId" partialSubmit="true"
			process=":form:settingTabId:gstId"
			update=":form:settingTabId:gstId"
			action="#{ruleCatalogueBackingBean.saveTaxableItemForG2G}"></p:commandButton>

	</div>
	
	 <p:dataTable id="taxableItemG2GTbl" var="tiG2GObj" rows="10"
		value="#{ruleCatalogueBackingBean.managedBean.taxableItemsForG2G}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedGstItemForG2G}"
		rowKey="#{tiG2GObj}" rowIndexVar="rowIndex" selectionMode="single"
		widgetVar="taxableItemG2GTblWidVar">
		<ac:paginator for="taxableItemG2GTbl" />
		<p:column style="width:15%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.org.ptj']}" />
			</f:facet>
			<ac:lov id="lovPTJOrg" lovId="PM_ORG_PROFILE_PTJ" size="29" 
				 required="true" 
		         update=":form:settingTabId:gstId:opTiG2G" 
		         readonly="true" 
		         disabled="#{!(tiG2GObj.brandNew)}"
				 headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
				 value="#{tiG2GObj.orgProfile.orgName}"
				 saveObject="ruleCatalogueBackingBean.managedBean.taxableItemsForG2G[#{rowIndex}].orgProfile"
				 conditionField="govtSeller^1"/>
				 <p:message id="lovPTJOrgMsg" for="lovPTJOrg" display="icon" />			
		</p:column>
		<p:column style="width:15%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.item.code']}" />
			</f:facet>
			<ac:lov id="g2gCommodityId" lovId="CM_UNSPSC" size="26" 
				disabled="#{empty tiG2GObj.orgProfile or !(tiG2GObj.brandNew)}"
				headerText="#{lbl['lbl.cm.commodity']}" 
				update=":form:settingTabId:gstId:opTiG2G" 
				saveObject="ruleCatalogueBackingBean.managedBean.taxableItemsForG2G[#{rowIndex}].unspsc"
				value="#{tiG2GObj.unspsc.unspscCode}"
				conditionField="recordStatus^1|unspscLevel^3">
			</ac:lov>
			
		</p:column>
		<p:column style="width:15%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.item.title']}" />
			</f:facet>
			<p:inputTextarea 
				required="true" 
				label="#{lbl['lbl.pm.settings.gst.item.title']}" 
				cols="35" rows="3" 
				id="itaG2GItemTitle" 
				value="#{tiG2GObj.unspsc.unspscTitle}" disabled="true"/>
		</p:column>
		<p:column style="width:5%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.scope']}" />
			</f:facet>
			<p:selectOneMenu id="somTiG2GScope" value="#{tiG2GObj.ruleType}" disabled="#{(!tiG2GObj.brandNew)}"
				required="true" label="#{lbl['lbl.pm.settings.gst.scope']}">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItems
						value="#{ruleCatalogueBackingBean.retrieveRuleListForTaxableItemForG2G()}"
						var="parameter" itemLabel="#{parameter.codeName}"
						itemValue="#{parameter.pmParameter.parameterCode}" />

			</p:selectOneMenu>
		</p:column>
		
		<p:column style="width:10%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.stn.effDate']}" />
			</f:facet>
			<p:calendar id="g2gEffDateId" value="#{tiG2GObj.effDate}"
					mindate="#{ruleCatalogueBackingBean.managedBean.currentDate}"
					navigator="true" maxdate="#{ProfileManagementConst.maxDate}"
					disabled = "#{tiG2GObj.recordStatusFlg == 0 or (tiG2GObj.effDate lt DateUtils.getCurrentDateWithoutTime())}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
			</p:calendar>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.stn.expDate']}" />
			</f:facet>
			<p:calendar id="g2gExpDateId" value="#{tiG2GObj.expDate}" 
					navigator="true"
					disabled ="#{tiG2GObj.recordStatusFlg == 0 or (tiG2GObj.expDate lt DateUtils.getCurrentDateWithoutTime())}"
					maxdate="#{ProfileManagementConst.maxDate}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.status']}" />
			</f:facet>
			<p:selectOneMenu id="g2gRecordStatus" value="#{tiG2GObj.recordStatusFlg}" 
				required="true" label="#{lbl['lbl.pm.status']}"
				disabled="#{tiG2GObj.brandNew}" style="width:128px;">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<p:ajax event="change" update="@([id$=g2gExpDateId]), @([id$=g2gEffDateId])"
					process="@this" />
			</p:selectOneMenu>
		</p:column>
		<p:column style="width:5%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.action']}" />
			</f:facet>
			<p:commandLink id="delG2GItemCl" partialSubmit="true"
				process="@this"
				disabled="#{!(tiG2GObj.brandNew) and (tiG2GObj.effDate lt DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteTaxableItemForG2G(rowIndex)}"
				update=":form:settingTabId:gstId">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			
		</p:column>
		
		
	</p:dataTable>
	<br />
	<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
			process=":form:settingTabId:gstId"
			update=":form:settingTabId:gstId"
			action="#{ruleCatalogueBackingBean.addTaxableItemForG2G()}"></p:commandButton>	
	</p:outputPanel>
	
	</ui:composition>
