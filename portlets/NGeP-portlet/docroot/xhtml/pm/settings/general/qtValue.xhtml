<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="qtValuePnlId">
		<table style="width: 100%; margin-bottom: 5px;">
			<tr>
				<td><h:outputText styleClass="instruction"
						value="#{lbl['lbl.pm.settings.qt.tooltip']}" /></td>
				<td>
					<div align="right" style="width: 100%">
						<!-- 34445 start -->
						<p:commandButton value="#{lbl['lbl.btn.save']}" id="qtValueSaveBtnId"
							partialSubmit="true" oncomplete="saveQtValueInfoDlg.show();"/>
						<!-- 34445 end -->
					</div>
				</td>
			</tr>
		</table>

		<!-- #36738 Start -->
		<p:panel header="#{lbl['lbl.pm.search']}" toggleable="true"
			id="qtValueSearch" collapsed="true">
			<h:panelGrid columns="2" cellpadding="5">
				<p:outputLabel value="#{lbl['lbl.pm.org.ptj.search.ministry']}" />
				<p:selectOneMenu id="somMinistryForQtVal"
					styleClass="ptjPopupSomWidth" style="width:250px;"
					disabled="#{ruleCatalogueBackingBean.managedBean.disabledSelectedMinistryId}"
					value="#{ruleCatalogueBackingBean.managedBean.selectedMinistryId}">
					<f:selectItems
						value="#{ruleCatalogueBackingBean.getAvailableMinistryDropdown()}" />
				</p:selectOneMenu>
				<p:outputLabel value="#{lbl['lbl.pm.org.ptjCode']}" />
				<p:inputText
					value="#{ruleCatalogueBackingBean.managedBean.searchPtjCode}"
					maxlength="20" style="width:250px;" />
				<p:outputLabel value=" #{lbl['lbl.pm.org.ptjName']}" />
				<p:inputText
					value="#{ruleCatalogueBackingBean.managedBean.searchPtjName}"
					maxlength="255" style="width:250px;" />
				<p:outputLabel value=" #{lbl['lbl.pm.settings.qt.limit']}" />
				<p:inputText id="qtLimit"
					value="#{ruleCatalogueBackingBean.managedBean.searchQtValueLimit}"
					maxlength="18" style="width:250px;" validatorMessage="Value is not a number format. Example: 999">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					<f:attribute name="min" value="0" />
					<f:attribute name="max" value="9999999.99" />
					<f:validator validatorId="quantityDoubleRangeValidator" />
					<!--  <f:converter converterId="javax.faces.String" />
					<p:ajax event="blur" process="@this" update="qtLimitMsg" />
					<f:validateRegex pattern="[\d.,]+" />-->
				</p:inputText>
				<p:message id="qtLimitMsg" for="qtLimit" display="tooltip" />
			</h:panelGrid>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{ruleCatalogueBackingBean.searchQtValues}"
					update=":form:settingTabId:qtValueTableId" />
				&#160;
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{ruleCatalogueBackingBean.resetQtValues}" process="@this"
					update=":form:settingTabId:qtValueTableId :form:settingTabId:qtValueSearch" />
			</div>
		</p:panel>
		<!-- #36738 End -->

		<p:dataTable id="qtValueTableId" widgetVar="qtValueTableWidget"
			var="ptjSpecialApproval" rows="10"
			value="#{ruleCatalogueBackingBean.managedBean.ptjSpecialApprovalList}"			
			rowKey="#{ptjSpecialApproval}" rowIndexVar="rowIndex">
			<ac:paginator for="qtValueTableId" />
			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update=":form:settingTabId:qtValuePnlId" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update=":form:settingTabId:qtValuePnlId" />
			<p:ajax event="page" process="@this"
				update=":form:settingTabId:qtValueTableId" />
			<p:column headerText="#{lbl['lbl.pm.settings.ministry']}"
				style="width:15%;white-space:normal;">			
				#{ptjSpecialApproval.pmOrgProfile.ministryName}			
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.org.ptjCode']}"
				style="width:10%;white-space:normal;">				
				#{ptjSpecialApproval.pmOrgProfile.pmOrgValidity.orgCode}				
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.org.ptjName']}"
				style="width:35%;white-space:normal;">				
				#{ptjSpecialApproval.pmOrgProfile.pmOrgValidity.orgName}				
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.settings.qt.limit']}"
				style="width:10%;white-space:normal;">
				<p:inputText id="qtProcureAmtId" style="text-align:right;"
					disabled="#{ptjSpecialApproval.effDate le DateUtils.getCurrentDateWithoutTime()}"
					value="#{ptjSpecialApproval.procureAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					<f:attribute name="min" value="0" />
					<f:attribute name="max" value="9999999.99" />
					<f:validator validatorId="quantityDoubleRangeValidator" />
					<p:ajax partialSubmit="true" process="@this"
						update="@this, qtProcureAmtIdMsg" />
				</p:inputText>
				<p:message id="qtProcureAmtIdMsg" for="qtProcureAmtId"
					display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.as.effdate']}" width="10%">
				<p:calendar showOn="button" id="qtValueeffDateId" navigator="true"
					disabled="#{ptjSpecialApproval.effDate le DateUtils.getCurrentDateWithoutTime()}"
					yearRange="#{DateUtils.getCalendarMaxYearRange(ptjSpecialApproval.effDate)}"
					style="width :100px;" required="true"
					maxdate="#{ruleCatalogueBackingBean.managedBean.maxDate}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					value="#{ptjSpecialApproval.effDate}">
					<p:ajax event="dateSelect" update="qtValueexpDateId,@this"
						process="@this" />
				</p:calendar>
			</p:column>

			<p:column width="10%" headerText="#{lbl['lbl.pm.as.expdate']}">
				<p:calendar showOn="button" id="qtValueexpDateId" navigator="true"
					style="width :100px;"
					disabled="#{ptjSpecialApproval.expDate lt DateUtils.getCurrentDateWithoutTime()}"
					yearRange="#{DateUtils.getCalendarMaxYearRange(ptjSpecialApproval.expDate)}"
					mindate="#{ruleCatalogueBackingBean.managedBean.today}"
					maxdate="#{ruleCatalogueBackingBean.managedBean.maxDate}"
					label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					value="#{ptjSpecialApproval.expDate}"
					validatorMessage="#{lbl['lbl.pm.as.expdate']} #{lbl['lbl.pm.date.range.validation']} #{lbl['lbl.pm.as.effdate']}">
					<f:attribute name="startDate" value="#{feeObj.effDate}" />
					<f:validator validatorId="primeDateRangeValidator" />
					<p:ajax event="dateSelect" update="@this" process="@this" />
				</p:calendar>
			</p:column>
			<p:column style="width:5%;text-align:center;"
				headerText="#{lbl['lbl.pm.action']}">
				<p:commandLink id="qtValueDeleteCL" partialSubmit="true"
					process="@this"
					disabled="#{!(ptjSpecialApproval.brandNew) and (ptjSpecialApproval.effDate le DateUtils.getCurrentDateWithoutTime())}"
					oncomplete="qtValueDeletePopUp.show();"
					update="@([id$=#{qtValueDeleteId}])">
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					<f:setPropertyActionListener
						target="#{ruleCatalogueBackingBean.managedBean.deleteRowIndex}"
						value="#{rowIndex}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>

		<div style="text-align: right;">
			<p:commandButton value="#{lbl['lbl.btn.add']}" id="qtValuesAddBtn"
				process="@this" partialSubmit="true"
				update="@([id$=ptjSearchPopup])" style="float:right;"
				oncomplete="ptjSearchPopup.show();"
				action="#{ruleCatalogueBackingBean.initPtjPopup}">
			</p:commandButton>

		</div>

		<ac:confirmationPopup id="qtValueDeleteId" widget="qtValueDeletePopUp"
			okAction="ruleCatalogueBackingBean.deleteQtValue()" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}"
			update=":form:settingTabId:qtValueTableId" />
			
		<!-- 34445 start -->
		<ac:confirmationPopupSM id="saveQtValueInfoDlg" widget="saveQtValueInfoDlg"
			okAction="ruleCatalogueBackingBean.saveQtValues"
			okProcess=":form:settingTabId:qtValuePnlId"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.save.msg']}" 
			update=":form:settingTabId:qtValuePnlId"
			loadingWidget="blockWidget" />
		<!-- 34445 end -->
	</p:panel>
</ui:composition>
