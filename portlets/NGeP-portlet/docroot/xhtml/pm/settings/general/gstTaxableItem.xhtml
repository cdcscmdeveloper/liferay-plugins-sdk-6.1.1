<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<div style="text-align: right; min-height: 40px;">
		<p:commandButton value="#{lbl['lbl.btn.update']}" id="tiUpdateBtnId" partialSubmit="true"
			process=":form:settingTabId:gstId"
			update=":form:settingTabId:gstId"
			action="#{ruleCatalogueBackingBean.saveTaxableItem}"></p:commandButton>

	</div>

	<p:dataTable id="taxableItemTbl" var="tiObj" rows="10"
		widgetVar="taxableItemTblWidVar"
		value="#{ruleCatalogueBackingBean.managedBean.taxableItems}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedGstItem}"
		rowKey="#{tiObj}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="taxableItemTbl" />
		<p:column style="width:15%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.item.code']}" />
			</f:facet>
			<p:inputText 
				size="6"  
				required="true" 
				id="unspscCodeId" 
				value="#{tiObj.unspsc.unspscCode}" 
				disabled="true"
				label="#{lbl['lbl.pm.settings.gst.item.code']}"/>
		
			<p:commandLink id="itemCodeLovId" partialSubmit="true"
				process="@this"
				disabled="#{!(tiObj.brandNew)}"
				action="#{ruleCatalogueBackingBean.managedBean.setSelectedGstItem(ruleCatalogueBackingBean.managedBean.taxableItems[rowIndex])}"
				oncomplete="dlItemCdLov.show();" 
				update=":#{p:component('dlItemCodeLov')}">
				<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
			</p:commandLink>
			<p:message id="unspscCodeIdMsg" for="unspscCodeId" display="icon" />
		</p:column>
		<p:column style="width:30%;white-space:normal">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.item.title']}" />
			</f:facet>
			<h:outputText 
				id="unspscTitleId" 
				value="#{ruleCatalogueBackingBean.getItemTitle(tiObj)}" 
			/>
			<p:message id="unspscTitleIdMsg" for="unspscTitleId" display="icon" />
		</p:column>
		<p:column  style="width:5%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.extension']}" />
			</f:facet>
			<p:commandLink id="extensioncl" partialSubmit="true"
				process="@this"
				disabled="#{(empty tiObj.unspsc or empty tiObj.unspsc.unspscId or tiObj.unspsc.unspscLevel ne '3')}"	
				action="#{ruleCatalogueBackingBean.initExtensionDetails(rowIndex)}"			
				oncomplete="dlgExtension.show();" 
				update=":#{p:component('dlExtension')}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
		<p:column style="width:5%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.scope']}" />
			</f:facet>
			<p:selectOneMenu id="somTiRuleTypes" value="#{tiObj.ruleType}" 
				disabled="#{tiObj.effDate le DateUtils.getCurrentDateWithoutTime()}"
				required="true" label="#{lbl['lbl.pm.settings.gst.scope']}" style="width:150px" >
				<f:selectItems
						value="#{ruleCatalogueBackingBean.retrieveRuleListForTaxableItem()}"
						var="parameter" itemLabel="#{parameter.codeName}"
						itemValue="#{parameter.pmParameter.parameterCode}" />

			</p:selectOneMenu>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.stn.effDate']}" />
			</f:facet>
			<p:calendar id="effDateId" value="#{tiObj.effDate}" navigator="true"
					mindate="#{ruleCatalogueBackingBean.managedBean.currentDate}"
					navigator="true" maxdate="#{ProfileManagementConst.maxDate}"
					disabled = "#{(tiObj.recordStatusFlg == 0 or (tiObj.effDate le DateUtils.getCurrentDateWithoutTime()))}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
			</p:calendar>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.stn.expDate']}" />
			</f:facet>
			<p:calendar id="expDateId" value="#{tiObj.expDate}" navigator="true" 
					mindate="#{!(tiObj.brandNew) ? tiObj.effDate :  ruleCatalogueBackingBean.managedBean.currentDate}"
					navigator="true"
					disabled ="#{tiObj.recordStatusFlg == 0 or (tiObj.expDate le DateUtils.getCurrentDateWithoutTime())}"
					maxdate="#{ProfileManagementConst.maxDate}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.status']}" />
			</f:facet>
			<p:selectOneMenu value="#{tiObj.recordStatusFlg}"
				disabled="#{tiObj.brandNew or tiObj.recordStatusFlg == 0}" style="width:90px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />				
			</p:selectOneMenu>
		</p:column>
		<p:column style="width:5%;text-align:center;">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.action']}" />
			</f:facet>
			<p:commandLink id="delTiItemCl" partialSubmit="true"
				process="@this"
				disabled="#{!(tiObj.brandNew) and (tiObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteTaxableItem(rowIndex)}"
				update=":form:settingTabId:gstId">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			
		</p:column>
		
	</p:dataTable>
	<br />
	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
				process=":form:settingTabId:gstId"
				update=":form:settingTabId:gstId"
				action="#{ruleCatalogueBackingBean.addTaxableItem()}"></p:commandButton>
	</div>
	</ui:composition>
