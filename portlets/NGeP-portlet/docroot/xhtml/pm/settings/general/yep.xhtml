<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="blablaId">
<ui:param name="language" value="#{ruleCatalogueBackingBean.getLanguage()}"></ui:param>

	<table style="width: 100%">
	<h:outputText value=" #{lbl['lbl.pm.settings.yep.process.instruction']}" style="color: blue"/>
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.save']}"></p:commandButton>
				</div>
			</td>
		</tr>
	</table>
	
	<p:dataTable
								emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
								value="#{ruleCatalogueBackingBean.yearEndInfoPhasesTooltip}" id="yearEndProcessTable"
								rowIndexVar="rowIndex" var="yepObjj" width="100%">

								<ac:paginator for="yearEndProcessTable"></ac:paginator>
				
				
								<p:columnGroup type="header">
									
									<p:row>
										<p:column style="text-align: center;" colspan="1"
											headerText="#{lbl['lbl.pm.settings.yep.period.process']}" />
										<p:column style="text-align: center;" colspan="1"
											headerText="#{lbl['lbl.pm.yep.effdate']}" />
										<p:column style="text-align: center;" colspan="1"
											headerText="#{lbl['lbl.pm.yep.expdate']}" />
									</p:row>

								</p:columnGroup>


								<p:column>
							#{yepObjj.phaseInfo}
							
                                <ac:iconTooltip value="#{yepObjj.phaseTooltip}" />

								</p:column>
								<p:column>
									<h:outputText value="#{yepObjj.effDate}"
										style="display: block; width:100%; text-align:center;" />
									
								</p:column>

								<p:column>
									<h:outputText value="#{yepObjj.expDate}"
										style="display: block; width:100%; text-align:center;" />

						
								</p:column>


							</p:dataTable>
	
	
	</p:panel>
</ui:composition>
