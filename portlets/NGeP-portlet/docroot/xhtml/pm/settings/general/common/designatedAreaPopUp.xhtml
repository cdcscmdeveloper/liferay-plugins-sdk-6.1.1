<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="dlDesignatedArea" modal="true" widgetVar="dlgDesignatedArea"
		width="700" position="top">
		<p:panel id="dlDesignatedAreaPanel" header="#{lbl['lbl.pm.settings.gst.da']}" >
			<p:messages id="messagesDA" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<h:panelGroup id="daPopUpDetailsPanel" style="width:100%;">
				<table>
					<tr>
						<td><h:outputText value="*" styleClass="mandatory" />
							<p:outputLabel
								value="#{lbl['lbl.pm.settings.gst.scope']}" /></td>
						<td><p:selectOneMenu id="somTiDaRuleTypes" value="#{ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.ruleType}" 
							disabled="#{((!ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.brandNew) 
									and ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.effDate le DateUtils.getCurrentDateWithoutTime())
									or ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.recordStatusFlg == 0}"
							required="true" label="#{lbl['lbl.pm.settings.gst.scope']}" style="width:150px">
							<f:selectItems
									value="#{ruleCatalogueBackingBean.retrieveRuleListForTaxableItemForDA()}"
									var="parameter" itemLabel="#{parameter.codeName}"
									itemValue="#{parameter.pmParameter.parameterCode}" />							
							</p:selectOneMenu>
						</td>
					</tr>
					</table>
					
			</h:panelGroup>
			<br/>
			<p:dataTable id="designatedAreaPopUpTbl" var="daGstObj" rows="5"
				widgetVar="designatedAreaPopUpTblWidVar"
				value="#{ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.pmDaGsts}"			
				rowIndexVar="rowIndex">
				<ac:paginator for="designatedAreaPopUpTbl" />
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.pm.settings.gst.da.title']}" />
					</f:facet>
					<p:selectOneMenu id="somTiDaRuleTypes" value="#{daGstObj.pmDesignatedArea.designatedAreaId}" 
							required="true" label="#{lbl['lbl.pm.settings.gst.da.title']}"
							disabled="#{(!(daGstObj.brandNew) 
							and ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.effDate le DateUtils.getCurrentDateWithoutTime())
							or ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.recordStatusFlg == 0}" >
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
									value="#{ruleCatalogueBackingBean.retrieveDesignatedAreaListForTaxableItem()}"
									var="da" itemLabel="#{da.vPmLocation.locationName}"
									itemValue="#{da.designatedAreaId}" />
							<p:ajax event="change" update="@this" partialSubmit="true"
								process="@this" />
					</p:selectOneMenu>
				</p:column>
				<p:column style="width:5%;text-align:center;">
					<f:facet name="header">				
						<h:outputText value="#{lbl['lbl.pm.action']}" />
					</f:facet>
					<p:commandLink id="delDaPopUpItemCl" partialSubmit="true"
						process="@this"
						disabled="#{(!(daGstObj.brandNew) 
						and ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.effDate le DateUtils.getCurrentDateWithoutTime())
						or ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.recordStatusFlg == 0}"
						action="#{ruleCatalogueBackingBean.deleteDAPopUpItem(rowIndex)}"
						update=":form:designatedAreaPopUpTbl">
						<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					</p:commandLink>
				</p:column>
				
			</p:dataTable>
			
			<br />
			<table style="width:100%;"><tr><td style="text-align:right;">
			<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
				process="@this"
				disabled="#{ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.effDate le DateUtils.getCurrentDateWithoutTime() 
				or ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.recordStatusFlg == 0}"
				update=":form:designatedAreaPopUpTbl"
				action="#{ruleCatalogueBackingBean.addGstDaItem()}"></p:commandButton>
			</td>
			</tr>
			<tr>
			<td style="height:30px;">
			</td>
			</tr>
			
			<tr>
			<td style="text-align:right;">
				<p:commandButton 
					id="daOkbtn"
					value="#{lbl['lbl.btn.ok']}"
					action="#{ruleCatalogueBackingBean.saveDAPopup}"
					update=":form:dlDesignatedAreaPanel"
					process="@this,:form:dlDesignatedArea"
					partialSubmit="true" />
				<p:commandButton 
					id="daCancelbtn"
					action="#{ruleCatalogueBackingBean.cancelDAPopup()}"
					value="#{lbl['lbl.btn.cancel']}"
					update=":form:dlDesignatedAreaPanel"					
					process="@this"
					partialSubmit="true" />		
			</td>			
			</tr></table>
			
		</p:panel>
		
		<p:ajax event="close" process="@this"
			listener="#{ruleCatalogueBackingBean.cancelDAPopup()}" />
		
	</p:dialog>
	
	</ui:composition>
