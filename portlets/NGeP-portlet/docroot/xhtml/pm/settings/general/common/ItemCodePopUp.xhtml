<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:cc="http://java.sun.com/jsf/composite"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:fn="http://java.sun.com/jsp/jstl/functions"
   	xmlns:p="http://primefaces.org/ui"
   	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:remoteCommand name="resetCodeItemData" update="itemCodeSearchPanel itemCodeResultPanel" partialSubmit="true" action="#{ruleCatalogueBackingBean.resetItemPopUp}" process="@this" />
	<p:dialog id="dlItemCodeLov" modal="true" widgetVar="dlItemCdLov"  width="700" position="top" onHide="resetCodeItemData();">
		<!-- Validation Message -->
		<p:messages id="messagesItemCode" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:panel header="#{lbl['lbl.cm.search']}" toggleable="true">		
		<h:panelGroup id="itemCodeSearchPanel" style="width:100%;">
		<h:panelGrid columns="2" id="itemCodeCriteria" cellpadding="0" cellspacing="0">
		<p:selectOneMenu value="#{ruleCatalogueBackingBean.managedBean.selectedSearchLvl}">
			<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
			<f:selectItems value="#{ruleCatalogueBackingBean.getUNSPSCLevels()}" />
		</p:selectOneMenu>
		<p:inputText value="#{ruleCatalogueBackingBean.managedBean.searchTitle}" 
			style="margin-bottom: 0px;" 
			onkeypress="if (event.keyCode == 13) { itemCodeSearch.jq.click(); return false; }"/>
		</h:panelGrid>	
		

		<table style="width:100%;"><tr><td style="text-align:right;">
			<p:commandButton 
				value="#{lbl['lbl.btn.search']}"
				action="#{ruleCatalogueBackingBean.searchItemCode}"
				partialSubmit="true"
				process="itemCodeSearchPanel"
				update ="itemCodeResultPanel"
				widgetVar ="itemCodeSearch" >
			</p:commandButton>	
			<p:commandButton
					value="#{lbl['lbl.btn.reset']}"
					action="#{ruleCatalogueBackingBean.resetItemPopUp}"
					partialSubmit="true"
					process="itemCodeSearchPanel"
					update="itemCodeResultPanel itemCodeSearchPanel">
				</p:commandButton>		
		</td></tr></table>

		</h:panelGroup>
		</p:panel>
		
		<p:panel id = "itemCodePanel" header="#{lbl['lbl.fl.result']}" toggleable="true">
		<h:panelGroup id="itemCodeResultPanel" style="width:100%;">			
			<p:dataTable id="itemCodeResultTb"
				var="itemCodeObj" 
				selection="#{ruleCatalogueBackingBean.managedBean.selectedUnspscResult}"
				selectionMode="single"
				rowIndexVar="rowIndex"
				rowKey="#{itemCodeObj}"
				rows="10" lazy="true" 
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{ruleCatalogueBackingBean.searchDataModel}" >
				
				<ac:paginator for="itemCodeResultTb" />	
				
				<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.settings.gst.item.code']}" />
				</f:facet>
					#{itemCodeObj.unspscCode}
				</p:column>					
				<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.settings.gst.item.title']}" />
					
				</f:facet>
				#{itemCodeObj.unspscTitle}
				</p:column>
			</p:dataTable>
			<table style="width:100%;"><tr><td style="text-align:right;">
				<p:commandButton 
					id="itemCodeSltBtn"
					value="#{lbl['lbl.btn.select']}"
					action="#{ruleCatalogueBackingBean.populateToSaveObject}"
					update=":form:settingTabId:gstId"
					oncomplete="dlItemCdLov.hide();"
					process="itemCodeResultPanel"
					partialSubmit="true" />
				
			</td></tr></table>
			
		</h:panelGroup>
		</p:panel>
	</p:dialog>
	
	
</ui:composition>
