<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<style>
		.ui-selectonemenu.ptjPopupSomWidth {
			width: 400px !important;
		}

		.ui-selectonemenu.ptjPopupSomWidth label {
			width: 400px !important;
			max-width: 400% !important;
		}
	</style>

	<p:dialog id="ptjCRPopup"
			  header="#{lbl['lbl.lov.listing']} - #{lbl['lbl.pm.ptj']}"
		      widgetVar="ptjCRPopup" modal="true" width="680" position="top">

		<p:messages id="ptjCRPopupMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false"/>

		<h:panelGroup id="ptjCRPnlGrp">
			<p:panel id="ptjCRPnlId" header="#{lbl['lbl.pm.header.general.org.search']}" toggleable="true">
				<h:panelGrid columns="3" id="orgProfilePgCR">
					<p:inputText id="itMinCR" readonly="true" style="width:170px" value="#{lbl['lbl.pm.org.ptj.search.ministry']}"/>
					<p:spacer height="1"/>
					<p:selectOneMenu id="somMinistryCR" styleClass="ptjPopupSomWidth"
						label="#{lbl['lbl.pm.org.ptj.search.ministry']}"
						value="#{ruleCatalogueBackingBean.managedBean.ministryProfileId}">
						<f:selectItems value="#{ruleCatalogueBackingBean.getMinistryDropdown()}"/>
						<p:ajax event="change" process="@this" partialSubmit="true" update=":form:somJabatanCR,:form:searcbBtnIdCR"/>
					</p:selectOneMenu>

					<p:inputText id="somJabCR" readonly="true" style="width:170px" value="#{lbl['lbl.pm.org.ptj.search.jabatan']}"/>
					<p:spacer height="1"/>
					<p:selectOneMenu id="somJabatanCR" styleClass="ptjPopupSomWidth" value="#{ruleCatalogueBackingBean.managedBean.jabatanProfileId}">
						<f:selectItems value="#{ruleCatalogueBackingBean.getJabatanDropdown()}"/>
						<p:ajax event="change" process="@this" partialSubmit="true" update="@this"/>
					</p:selectOneMenu>

					<p:selectOneMenu for="somPtjCodeName" style="width:180px" value="#{ruleCatalogueBackingBean.managedBean.ptjCodeName}">
						<f:selectItems value="#{ruleCatalogueBackingBean.getPtjOrKptjDropDown('FPJ')}"/>
						<p:ajax event="change" process="@this" partialSubmit="true" update="@this"/>
					</p:selectOneMenu>
					<p:spacer height="1"/>
					<p:inputText id="itPtjCodeValueCR" style="width:97%"
						onkeypress="if (event.keyCode == 13) {ptjSearchBtnWV.jq.click(); return false;}"
						value="#{ruleCatalogueBackingBean.managedBean.ptjCodeNameSearchValues}">
						<p:ajax event="blur" process="@this" partialSubmit="true" update="@this"/>
					</p:inputText>
				</h:panelGrid>
				<div class="ppRightBtn">
					<p:commandButton id="searcbBtnIdCR" widgetVar="ptjSearchBtnWV"
						value="#{lbl['lbl.btn.search']}" update=":form:dtOrgProfileCR"
						action="#{ruleCatalogueBackingBean.searchOrgProfiles('FPJ')}"
						process="ptjCRPnlId">
					</p:commandButton>

					<p:commandButton value="#{lbl['lbl.btn.reset']}"
						action="#{ruleCatalogueBackingBean.resetOrgProfiles()}"
						partialSubmit="true" process="ptjCRPnlId"
						update="ptjCRPnlId resultPanelCR">
					</p:commandButton>
				</div>
			</p:panel>

			<p:panel id="ptjCRResultPnlId" header="#{lbl['lbl.pm.organisation.result']}" toggleable="true">
				<h:panelGroup id="resultPanelCR" style="width:100%;">
					<p:dataTable id="dtOrgProfileCR" var="orgProfile" rows="5"
						value="#{ruleCatalogueBackingBean.managedBean.ptjList}"
						rowIndexVar="index">
						<ac:paginator for="dtOrgProfileCR"></ac:paginator>
						<p:ajax event="rowUnselect" update="dtOrgProfileCR" process="@this" partialSubmit="true"/>
						<p:ajax event="rowSelect" update="dtOrgProfileCR" process="@this" partialSubmit="true"/>
						<p:ajax event="toggleSelect" update="dtOrgProfileCR" process="@this" partialSubmit="true"/>
						<p:column headerText="" style="width :5%">
							<p:selectBooleanCheckbox id="chkSelectedPtj" value="#{orgProfile.selected}">
								<p:ajax event="change" process="@this" update="@this" partialSubmit="true"/>
							</p:selectBooleanCheckbox>
						</p:column>
						<p:column headerText="#{lbl['lbl.pm.organisation.orgCode']}" style="width :15%">
							<h:outputText value="#{orgProfile.pmOrgValidity.orgCode}"/>
						</p:column>
						<p:column headerText="#{lbl['lbl.pm.organisation.orgName']}" style="width :60%">
							<h:outputText value="#{orgProfile.pmOrgValidity.orgName}"/>
						</p:column>
					</p:dataTable>
				</h:panelGroup>

				<br/>

				<table width="100%">
					<tr>
						<td style="text-align:right;" colspan="3">
							<p:commandButton id="crOkbtn"
								value="#{lbl['lbl.btn.ok']}"
								action="#{ruleCatalogueBackingBean.addPTJCRValues()}"
								update=":form:settingTabId:ruleConfigId"
								process="@this,:form:ptjCRPopup" partialSubmit="true">
							</p:commandButton>
							<p:commandButton id="crCancelbtn"
								oncomplete="ptjCRPopup.hide();"
								value="#{lbl['lbl.btn.cancel']}"
								update=":form:ptjCRPopup" process="@this"
								partialSubmit="true">
							</p:commandButton>
						</td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>
	</p:dialog>
</ui:composition>
