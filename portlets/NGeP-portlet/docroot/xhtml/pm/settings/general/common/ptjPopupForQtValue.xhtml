<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<style>
.ui-selectonemenu.ptjPopupSomWidth {
	width: 400px !important;
}

.ui-selectonemenu.ptjPopupSomWidth label {
	width: 400px !important;
	max-width: 400% !important;
}
</style>
	<p:dialog id="ptjSearchPopup"
		header="#{lbl['lbl.lov.listing']} - #{lbl['lbl.pp.ptj']}"
		widgetVar="ptjSearchPopup" modal="true" width="680" position="top">

		<p:messages id="ptjSearchPopupMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<h:panelGroup id="ptjPnlGrp">
			<p:panel id="ptjPnlId"
				header="#{lbl['lbl.pm.header.general.org.search']}"
				toggleable="true">
				<h:panelGrid columns="3" id="orgProfilePg">
					<p:outputPanel>
						<h:outputText value="*" styleClass="mandatory" style="width:5px" />
						<p:inputText id="itMin" readonly="true" style="width:165px"
							value="#{lbl['lbl.pm.org.ptj.search.ministry']}" />
					</p:outputPanel>
					<p:spacer height="1" />
					<p:selectOneMenu id="somMinistry" styleClass="ptjPopupSomWidth"
						label="#{lbl['lbl.pm.org.ptj.search.ministry']}" 
						required="#{!empty param['ptjValueValidation']}"
						value="#{ruleCatalogueBackingBean.managedBean.ministryProfileId}">
						<f:selectItems
							value="#{ruleCatalogueBackingBean.getMinistryDropdown()}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update=":form:somJabatan,:form:searcbBtnId" />
					</p:selectOneMenu>

					<p:inputText id="somJab" readonly="true" style="width:170px"
						value="#{lbl['lbl.pm.org.ptj.search.jabatan']}" />
					<p:spacer height="1" />
					<p:selectOneMenu id="somJabatan" styleClass="ptjPopupSomWidth"
						value="#{ruleCatalogueBackingBean.managedBean.jabatanProfileId}">
						<f:selectItems
							value="#{ruleCatalogueBackingBean.getJabatanDropdown()}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@this" />
					</p:selectOneMenu>

					<p:selectOneMenu for="somPtjCodeName" style="width:180px"
						value="#{ruleCatalogueBackingBean.managedBean.ptjCodeName}">
						<f:selectItems
							value="#{ruleCatalogueBackingBean.getPtjOrKptjDropDown('FPJ')}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@this" />
					</p:selectOneMenu>
					<p:spacer height="1" />
					<p:inputText id="itPtjCodeValue" style="width:97%"
						onkeypress="if (event.keyCode == 13) { ptjSearchBtnWV.jq.click(); return false; }"
						value="#{ruleCatalogueBackingBean.managedBean.ptjCodeNameSearchValues}">
						<p:ajax event="blur" process="@this" partialSubmit="true"
							update="@this" />
					</p:inputText>
				</h:panelGrid>
				<div class="ppRightBtn">
					<p:commandButton id="searcbBtnId" widgetVar="ptjSearchBtnWV"
						value="#{lbl['lbl.btn.search']}" update=":form:dtOrgProfile"
						action="#{ruleCatalogueBackingBean.searchOrgProfiles('FPJ')}"
						process="ptjPnlId" >
						<f:param name="ptjValueValidation" value="true" /> 
					</p:commandButton>

					<p:commandButton value="#{lbl['lbl.btn.reset']}"
						action="#{ruleCatalogueBackingBean.resetOrgProfiles()}"
						partialSubmit="true" process="ptjPnlId"
						update="ptjPnlId resultPanel">
					</p:commandButton>

				</div>
			</p:panel>
			<p:panel id="ptjResultPnlId"
				header="#{lbl['lbl.pm.organisation.result']}" toggleable="true">
				<h:panelGroup id="resultPanel" style="width:100%;">
					<p:dataTable id="dtOrgProfile" var="orgProfile" rows="5"
						value="#{ruleCatalogueBackingBean.managedBean.ptjList}"
						rowIndexVar="index">
						<ac:paginator for="dtOrgProfile"></ac:paginator>
						<p:ajax event="rowUnselect" update="dtOrgProfile" process="@this"
							partialSubmit="true" />
						<p:ajax event="rowSelect" update="dtOrgProfile" process="@this"
							partialSubmit="true" />
						<p:ajax event="toggleSelect" update="dtOrgProfile" process="@this"
							partialSubmit="true" />
						<p:column headerText="" style="width :5%">
							<p:selectBooleanCheckbox id="chkSelectedPtj"
								value="#{orgProfile.selected}">
								<p:ajax event="change" process="@this" update="@this"
									partialSubmit="true" />
							</p:selectBooleanCheckbox>

						</p:column>
						<p:column headerText="#{lbl['lbl.pm.organisation.orgCode']}"
							style="width :15%">
							<h:outputText value="#{orgProfile.pmOrgValidity.orgCode}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.pm.organisation.orgName']}"
							style="width :60%">
							<h:outputText value="#{orgProfile.pmOrgValidity.orgName}" />
						</p:column>
					</p:dataTable>
				</h:panelGroup>
				<br/>
				<table width="100%">
					<tr>
						<td width="25%"><p:outputLabel
								value="#{lbl['lbl.pm.settings.qt.value.limit']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td width="30%"><p:inputText
								value="#{ruleCatalogueBackingBean.managedBean.qtLimit}"
								size="30" label="#{lbl['lbl.pm.settings.qt.value.limit']}"
								maxlength="17" id="qtLimitId" 
								required="#{!empty param['qtValueValidation']}">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								<f:attribute name="min" value="0" />
								<f:attribute name="max" value="9999999.99" />
								<f:validator validatorId="quantityDoubleRangeValidator" />
								<p:ajax partialSubmit="true" process="@this"
									update="@this, qtLimitMsg" />
							</p:inputText> <p:message id="qtLimitMsg" for="qtLimitId" display="icon" /></td>
						<td width="45%"></td>
					</tr>
					<tr>						
						<td style="text-align:right;" colspan="3">
						<p:commandButton id="qtOkbtn"
								value="#{lbl['lbl.btn.ok']}"								
								action="#{ruleCatalogueBackingBean.addQtValues()}"
								update=":form:settingTabId:qtValuePnlId"
								process="@this,:form:ptjSearchPopup" partialSubmit="true" >
								<f:param name="qtValueValidation" value="true" /> 
							</p:commandButton>
							<p:commandButton id="qtCancelbtn"
								oncomplete="ptjSearchPopup.hide();"								
								value="#{lbl['lbl.btn.cancel']}"
								update=":form:ptjSearchPopup" process="@this"
								partialSubmit="true" /></td>
					</tr>
				</table>

			</p:panel>
		</h:panelGroup>

	</p:dialog>
</ui:composition>
