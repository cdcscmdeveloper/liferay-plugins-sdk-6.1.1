<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="dlExtension" modal="true" widgetVar="dlgExtension" 
		header="#{lbl['lbl.pm.settings.gst.select.extension.code']}"
		width="700" position="top">
		<!-- Validation Message -->
		<p:messages id="messagesExtension" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:panel header="#{lbl['lbl.pm.settings.gst.extension.item']}"
			toggleable="true">
			<h:panelGroup id="extensionDetailsPanel" style="width:100%;">
				<table>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.pm.settings.gst.item.code']}" /></td>
						<td><p:inputText
								value="#{ruleCatalogueBackingBean.managedBean.gstIndex 
								eq ruleCatalogueBackingBean.taxableItemIdx ? 
								ruleCatalogueBackingBean.managedBean.selectedGstItem.unspsc.unspscCode : 
								ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.unspsc.unspscCode}"
								disabled="true" /></td>
					</tr>

					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.pm.settings.gst.item.title']}" /></td>
						<td><p:inputTextarea rows="4" cols="50"
								value="#{ruleCatalogueBackingBean.managedBean.gstIndex 
								eq ruleCatalogueBackingBean.taxableItemIdx ?
								ruleCatalogueBackingBean.managedBean.selectedGstItem.unspsc.unspscTitle : 
								ruleCatalogueBackingBean.managedBean.selectedGstItemForDA.unspsc.unspscTitle}"
								disabled="true" /></td>
					</tr>
				</table>
			</h:panelGroup>
		</p:panel>
		<p:panel id="gstExtentionDetailsPanel" header="#{lbl['lbl.pm.settings.gst.extension.details']}"
			toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.settings.gst.type']}" />
					</td>
					<td><p:selectOneMenu disabled="#{ruleCatalogueBackingBean.disabledExtensionFields()}"
							value="#{ruleCatalogueBackingBean.managedBean.selectedType}"
							styleClass="ppDropDownWidthL" style="margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{ruleCatalogueBackingBean.managedBean.typeList}" />
							<p:ajax event="change" update="@this" process="@this" partialSubmit="true" /> 
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.settings.gst.brand']}" />
					</td>
					<td><p:selectOneMenu disabled="#{ruleCatalogueBackingBean.disabledExtensionFields()}"
							value="#{ruleCatalogueBackingBean.managedBean.selectedBrand}"
							styleClass="ppDropDownWidthL" style="margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{ruleCatalogueBackingBean.managedBean.brandList}" />
							<p:ajax event="change" update="@this" process="@this" partialSubmit="true" /> 
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.pm.settings.gst.measurement']}" /></td>
					<td><p:selectOneMenu disabled="#{ruleCatalogueBackingBean.disabledExtensionFields()}"
							value="#{ruleCatalogueBackingBean.managedBean.selectedMeasurement}"
							styleClass="ppDropDownWidthL" style="margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{ruleCatalogueBackingBean.managedBean.measurementList}" />
							<p:ajax event="change" update="@this" process="@this" partialSubmit="true" /> 
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.settings.gst.color']}" />
					</td>
					<td><p:selectOneMenu disabled="#{ruleCatalogueBackingBean.disabledExtensionFields()}"
							value="#{ruleCatalogueBackingBean.managedBean.selectedColor}"
							styleClass="ppDropDownWidthL" style="margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{ruleCatalogueBackingBean.managedBean.colorList}" />
							<p:ajax event="change" update="@this" process="@this" partialSubmit="true" /> 
						</p:selectOneMenu></td>
				</tr>
			</table>
			<br/>
			<br/>
			
			<table style="width:100%;"><tr><td style="text-align:right;">
				<p:commandButton 
					id="extensionOkbtn" 
					value="#{lbl['lbl.btn.ok']}"
					action="#{ruleCatalogueBackingBean.saveExtension}"
					update=":form:settingTabId:gstId"
					oncomplete="dlgExtension.hide();"
					process="gstExtentionDetailsPanel"
					partialSubmit="true" />
				<p:commandButton 
					id="extensionCancelbtn"
					value="#{lbl['lbl.btn.cancel']}"
					update=":form:settingTabId:gstId"
					oncomplete="dlgExtension.hide();"
					process="@this"
					partialSubmit="true" />		
			</td>			
			</tr></table>

		</p:panel>




	</p:dialog>



</ui:composition>
