<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="budgetThresholdPanel">

		<table style="width: 100%">
			<tr>
				<td>
					<div align="right" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.save']}" id="budgetThreSaveBtn"
							action="#{ruleCatalogueBackingBean.saveThresholds(2)}"
							process="budgetThresholdPanel" update="@form"></p:commandButton>
					</div>
				</td>
			</tr>
		</table>
		<table width="80%">
			<tr style="height: 30px;">
				<td style="width: 10%"><p:outputLabel
						value="#{lbl['lbl.pm.settings.threshold.setting']}" /></td>
				<td style="width: 25%"><p:selectOneRadio id="budgetThreRadioSelection"
						value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isBudgetThreshold}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.settings.centralized']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.settings.ministry']}"
							itemValue="0" />
						<p:ajax process="@this" event="change" partialSubmit="true"
							update="@this" />
					</p:selectOneRadio></td>
				<td style="width: 10%"><p:outputLabel
						value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
					<h:outputLabel value="*" styleClass="mandatory" /></td>
				<td style="width: 1%"><p:inputText id="budgetThresholdId"
						value="#{ruleCatalogueBackingBean.managedBean.threshold.budgetSpent}"
						label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}"
						valueChangeListener="#{ruleCatalogueBackingBean.onChangeMainBudgetThreshold}"
						required="true">
						<f:validateLongRange minimum="0" maximum="100" />
						<p:ajax event="change"
							update="budegetMinistryList,budgetThresholdId" process="@this"></p:ajax>
					</p:inputText></td>
				<td style="width: 5%"><p:message for="budgetThresholdId"
						display="icon" /></td>
			</tr>
		</table>
		<p:dataTable id="budegetMinistryList" var="ministry" rows="10"
			value="#{ruleCatalogueBackingBean.managedBean.budgetThresholdList}">
			<ac:paginator for="budegetMinistryList" />
			<p:column width="70%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.settings.ministry']}" />
				</f:facet>
				<h:outputText value="#{ministry.orgProfileId.pmOrgValidity.orgName}" />
			</p:column>
			<p:column width="30%">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
				</f:facet>
				<p:inputText id="ministryBudegetThresholdId"
					valueChangeListener="#{ruleCatalogueBackingBean.onChangeBudgetThreshold}"
					label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}"
					disabled="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isBudgetThreshold == 1 ? 'true':'false'}"
					value="#{ministry.budgetSpent}" required="true">
					<f:attribute name="threshold" value="#{ministry}" />
					<f:validateLongRange
						minimum="#{ruleCatalogueBackingBean.managedBean.budgetThreshold}"
						maximum="100" />
					<p:ajax event="change" update="@this" process="@this"
						partialSubmit="true"></p:ajax>
				</p:inputText>
				<p:message for="ministryBudegetThresholdId" display="icon" />
			</p:column>
		</p:dataTable>
	</p:outputPanel>
</ui:composition>
