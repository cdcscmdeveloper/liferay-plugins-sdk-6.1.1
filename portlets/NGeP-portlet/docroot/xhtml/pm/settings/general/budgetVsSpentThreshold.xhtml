<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<div style="text-align: right; min-height: 40px;">
			<p:commandButton value="#{lbl['lbl.btn.save']}"
			action="#{ruleCatalogueBackingBean.saveThresholds(2)}"
			update="@form"></p:commandButton>
	</div>
	
	<table width="80%">
	<tr style="height: 30px;">
		<td style="width:10%"><p:outputLabel
				value="#{lbl['lbl.pm.settings.threshold.setting']}" />
		</td>
		 <td style="width:25%"><p:selectOneRadio value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isBudgetThreshold}"
		 	 disabled="#{not ruleCatalogueBackingBean.checkIsEpAdmin()}">
				<f:selectItem itemLabel="#{lbl['lbl.pm.settings.centralized']}" itemValue="1"/>
				<f:selectItem itemLabel="#{lbl['lbl.pm.settings.ministry']}" itemValue="0"/>
				<p:ajax process="@this" event="change" partialSubmit="true" update="@this" />
			</p:selectOneRadio>
		</td>
		<td style="width:10%">
			<p:outputLabel
				value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
		</td>
		<td style="width:20%">
			<p:inputText id="budgetThresholdId" value="#{ruleCatalogueBackingBean.managedBean.threshold.budgetSpent}" 
				label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}"
				disabled="#{not ruleCatalogueBackingBean.checkIsEpAdmin()}">				
				<f:validateLongRange minimum="0" maximum="100" />
				<p:ajax update="budegetMinistryList,budgetThresholdId"
							process="@this" 
							listener="#{ruleCatalogueBackingBean.onChangeMainBudgetThreshold()}"></p:ajax>				
			</p:inputText>
			<p:message for="budgetThresholdId" display="icon" />
		</td>
		</tr>
	</table>
	<br/>
	<p:dataTable id="budegetMinistryList" var="ministry" rows="10"
		value="#{ruleCatalogueBackingBean.managedBean.budgetThresholdList}">
        <ac:paginator for="budegetMinistryList" />
		<p:column width="70%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.ministry']}" />
			</f:facet>
			<h:outputText value="#{ministry.orgProfileId.pmOrgValidity.orgName}" />
		</p:column>
		<p:column width="30%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
			</f:facet>
			<p:inputText id="ministryBudegetThresholdId"
				label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" 
				disabled="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isBudgetThreshold == 1 ? 'true':'false' or ruleCatalogueBackingBean.checkIsEpAdmin()}" 
				value="#{ministry.budgetSpent}">				
				<f:validateLongRange minimum="#{ruleCatalogueBackingBean.managedBean.budgetThreshold}" maximum="100" />
				<p:ajax update="@this" process="@this" partialSubmit="true" ></p:ajax>	
			</p:inputText>
			<p:message for="ministryBudegetThresholdId" display="icon" />
		</p:column>
	</p:dataTable>
</ui:composition>
