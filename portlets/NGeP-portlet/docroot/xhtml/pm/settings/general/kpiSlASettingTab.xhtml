<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup>
		<div style="text-align: right; min-height: 40px;">

			<h:panelGroup>
				<p:commandButton value="#{lbl['lbl.cm.save.as.draft']}"
					icon="ui-icon-save"
					action="#{ruleCatalogueBackingBean.saveKpiValues}" update="@form"></p:commandButton>

			</h:panelGroup>

		</div>
		<p:panel header="#{lbl['lbl.pm.settings.kpi.value']}"
			toggleable="true">

			<br />
			<div style="float: left;">
				<p:outputLabel value="#{lbl['lbl.cm.doc.type']}" />
			</div>
			<div style="float: left;">
				<p:selectOneMenu
					value="#{ruleCatalogueBackingBean.managedBean.selectedDocumentType}"
					style="width:128px;">
					<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue=""></f:selectItem>
					<f:selectItems
						value="#{ruleCatalogueBackingBean.getRadioButtonCodeValuesBySearchBean(ParameterTypeConst.documentTypes, ruleCatalogueBackingBean.docTypeSearchBean)}" />
					<p:ajax event="change"
						listener="#{ruleCatalogueBackingBean.filterKPITableByDataType}"
						update="kpiValueTableID"></p:ajax>
				</p:selectOneMenu>

			</div>


			<p:spacer height="20px" />

			<p:dataTable id="kpiValueTableID" rows="10"
				value="#{ruleCatalogueBackingBean.managedBean.kpiStatusList}"
				var="kpiValueObj" lazy="true" style="width:100%;"
				rowIndexVar="index">
				 
				<p:column width="15%">
					<f:facet name="header">
					                 #{lbl['lbl.pm.settings.kpi.process.status']}
				                </f:facet>

								#{kpiValueObj.pmStatusName}
							</p:column>


				<p:column width="15%">
					<f:facet name="header">
								
				                 	#{lbl['lbl.pm.settings.kpi.value.days']}
			                	</f:facet>
					<p:inputText value="#{kpiValueObj.kpiValueDay}" size="15"></p:inputText>
				</p:column>
				<p:column>
					<f:facet name="header">
		                			#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>
							#{kpiValueObj.effDate}
							</p:column>

				<p:column>
					<f:facet name="header">
									#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>
							#{kpiValueObj.expDate}

							</p:column>

				<p:column width="10%">
					<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
					<p:selectOneMenu value="#{kpiValueObj.recordStatusFlg}"
						style="width:128px;">
						<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
					</p:selectOneMenu>
				</p:column>

			</p:dataTable>

		</p:panel>
	</h:panelGroup>

</ui:composition>
