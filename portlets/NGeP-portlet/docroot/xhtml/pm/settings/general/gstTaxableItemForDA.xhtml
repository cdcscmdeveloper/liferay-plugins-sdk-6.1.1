<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<div style="text-align: right; min-height: 40px;">
		<p:commandButton value="#{lbl['lbl.btn.update']}" id="tidaUpdateBtnId" partialSubmit="true"
			process=":form:settingTabId:gstId"
			update=":form:settingTabId:gstId"
			action="#{ruleCatalogueBackingBean.saveTaxableItemForDA}"></p:commandButton>

	</div>
	
   <p:dataTable id="taxableItemDATbl" var="tidaObj" rows="10"
		value="#{ruleCatalogueBackingBean.managedBean.taxableItemsForDA}"
		selection="#{ruleCatalogueBackingBean.managedBean.selectedGstItemForDA}"
		rowKey="#{tidaObj}" rowIndexVar="rowIndex" selectionMode="single"
		widgetVar="taxableItemDATblWidVar">
		<ac:paginator for="taxableItemDATbl" />
		<p:column style="width:15%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.item.code']}" />
			</f:facet>
			<p:inputText size="6" id="unspscCodeDAId" value="#{tidaObj.unspsc.unspscCode}" disabled="true"/>
		
			<p:commandLink id="itemCodeDALovId" partialSubmit="true"
				process="@this"
				disabled="#{!(tidaObj.brandNew)}"
				action="#{ruleCatalogueBackingBean.managedBean.setSelectedGstItemForDA(ruleCatalogueBackingBean.managedBean.taxableItemsForDA[rowIndex])}"
				oncomplete="dlItemCdLov.show();" 
				update=":#{p:component('dlItemCodeLov')}">
				<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
			</p:commandLink>
			
		</p:column>
		<p:column style="width:30%;white-space:normal">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.item.title']}" />
			</f:facet>
			<h:outputText
				id="unspscDaTitleId" 
				value="#{ruleCatalogueBackingBean.getItemTitle(tidaObj)}" />
		</p:column>
		<p:column  style="width:5%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.gst.extension']}" />
			</f:facet>
			<p:commandLink id="daExtensioncl" partialSubmit="true"
				process="@this"
				disabled="#{(empty tidaObj.unspsc or empty tidaObj.unspsc.unspscId or tidaObj.unspsc.unspscLevel ne '3')}"	
				action="#{ruleCatalogueBackingBean.initExtensionDetails(rowIndex)}"			
				oncomplete="dlgExtension.show();" 
				update=":#{p:component('dlExtension')}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
		
		<p:column  style="width:5%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.settings.gst.da']}" />
			</f:facet>
			<p:commandLink id="tidacl" partialSubmit="true"
				process="@this"
				disabled="#{(empty tidaObj.unspsc or empty tidaObj.unspsc.unspscId or tidaObj.unspsc.unspscLevel ne '3')}"	
				action="#{ruleCatalogueBackingBean.initDesignatedAreaDetails(rowIndex)}"			
				oncomplete="dlgDesignatedArea.show();" 
				update=":#{p:component('dlDesignatedArea')}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
		
		<p:column style="width:10%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.pm.stn.effDate']}" />
			</f:facet>
			<p:calendar id="tidaeffDateId" value="#{tidaObj.effDate}" navigator="true"
					mindate="#{ruleCatalogueBackingBean.managedBean.currentDate}"
					navigator="true" maxdate="#{ProfileManagementConst.maxDate}"
					disabled = "#{tidaObj.recordStatusFlg == 0 or (tidaObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
			</p:calendar>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.stn.expDate']}" />
			</f:facet>
			<p:calendar id="tidaexpDateId" value="#{tidaObj.expDate}"  navigator="true"
					navigator="true"
					mindate="#{!(tidaObj.brandNew) ? tidaObj.effDate :  ruleCatalogueBackingBean.managedBean.currentDate}"
					disabled ="#{tidaObj.recordStatusFlg == 0 or (tidaObj.expDate le DateUtils.getCurrentDateWithoutTime())}"
					maxdate="#{ProfileManagementConst.maxDate}"
					label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
					yearRange="c-50:c+99" showOn="button"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
		</p:column>
		<p:column style="width:10%">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.status']}" />
			</f:facet>
			<p:selectOneMenu id="tidaRecordStatus" value="#{tidaObj.recordStatusFlg}" 
				required="true" label="#{lbl['lbl.pm.status']}"
				disabled="#{tidaObj.recordStatusFlg == 0}" style="width:90px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />				
			</p:selectOneMenu>
		</p:column>
		<p:column style="width:5%;text-align:center;">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.action']}" />
			</f:facet>
			<p:commandLink id="delTidaItemCl" partialSubmit="true"
				process="@this"
				disabled="#{!(tidaObj.brandNew) and (tidaObj.effDate le DateUtils.getCurrentDateWithoutTime())}"
				action="#{ruleCatalogueBackingBean.deleteTaxableItemForDA(rowIndex)}"
				update=":form:settingTabId:gstId">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			
		</p:column>
		
		
	</p:dataTable>
	<br />
		<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
				process=":form:settingTabId:gstId"
				update=":form:settingTabId:gstId"
				action="#{ruleCatalogueBackingBean.addTaxableItemForDA()}"></p:commandButton>
			</div>
	
	</ui:composition>
