<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<style type="text/css">
.value {
	width: 1000px;
}
</style>

	<ui:define name="contentSection">

		<p:panel id="ruleConfigId">

<p:messages id="calenderMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>

			<h:panelGroup id="calenderId">
				<table width="100%">
					<tr>
						<td width="10%"><p:outputLabel
								value="#{lbl['lbl.pm.cal.state']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="orgState"
								styleClass="ppDropDownWidthL"
								label="#{lbl['lbl.pm.cal.state']}"
								value="#{calenderSchedulerBackingBean.managedBean.selectedState.stateId}"
								style="width: 275px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems
									value="#{calenderSchedulerBackingBean.getStateListOfMalaysia()}"
									var="state" itemLabel="#{state.stateName}"
									itemValue="#{state.stateId}" />
							</p:selectOneMenu></td>
						<td><p:message for="orgState" id="orgStateMsg" display="icon" /></td>
					</tr>
					<tr/>
					<tr>
						<td colspan="3"><p:schedule id="schedule"
								leftHeaderTemplate="prev,next, today" rightHeaderTemplate=""
								style="width : 700px; height : 600px;"
								value="#{calenderSchedulerBackingBean.managedBean.eventModel}"
								widgetVar="myschedule" timeZone="GMT+2"
								>

								<p:ajax event="dateSelect"
									listener="#{calenderSchedulerBackingBean.onDateSelect}"
									update="eventDetails" oncomplete="eventDialog.show();" />
								<p:ajax event="eventSelect"
									listener="#{calenderSchedulerBackingBean.onEventSelect}"
									update="eventDetails" oncomplete="eventDialog.show();" />
								<p:ajax event="eventMove"
									listener="#{calenderSchedulerBackingBean.onEventMove}"
									update=":form:calenderMsg" />

							</p:schedule></td>
					</tr>
				</table>
			</h:panelGroup>

			<p:dialog widgetVar="eventDialog"
				header="#{lbl['lbl.pm.cal.public.haliday.details']}" width="400"
				height="150" showEffect="clip" hideEffect="clip">
				<h:panelGroup id="eventDetails">
					<table width="100%">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.pm.cal.title']}" /></td>
							<td><p:inputText id="title" size="30" maxlength="30"
									value="#{calenderSchedulerBackingBean.managedBean.event.title}"
									required="true" /></td>
						</tr>
						<tr>

							<td><p:outputLabel value="#{lbl['lbl.pm.cal.frmdate']}" /></td>
							<td><p:calendar showOn="button" id="fromDateId"
									label="#{lbl['lbl.pm.cal.frmdate']}" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									value="#{calenderSchedulerBackingBean.managedBean.event.startDate}">
								</p:calendar></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.pm.cal.todate']}" /></td>
							<td><p:calendar showOn="button" id="toDateId"
									label="#{lbl['lbl.pm.cal.todate']}" readonlyInput="true"
									validatorMessage="To Date should be greater than from Date"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									value="#{calenderSchedulerBackingBean.managedBean.event.endDate}">
									<f:attribute name="startDate"
										value="#{calenderSchedulerBackingBean.managedBean.event.startDate}" />
									<f:validator validatorId="primeDateRangeValidator" />
								</p:calendar></td>
						</tr>
						<tr>
							<td />
							<td><h:selectBooleanCheckbox id="national"
									value="#{calenderSchedulerBackingBean.managedBean.event.allDay}" />
								<div style="float: left;"><p:outputLabel value="#{lbl['lbl.pm.cal.isNational']}" /></div></td>
						</tr>
						<br />
						<tr>
							<td />
							<td>
								<div style="float: right;">
									<p:commandButton value="#{lbl['lbl.btn.reset']}"
										update="ruleConfigId"
										action="#{calenderSchedulerBackingBean.resetPopup()}" />
									<p:commandButton id="addButton" value="#{lbl['lbl.btn.save']}"
										action="#{calenderSchedulerBackingBean.addEvent}"
										oncomplete="myschedule.update();eventDialog.hide();"
										update="ruleConfigId" />
								</div>
							</td>
						</tr>
					</table>
				</h:panelGroup>
			</p:dialog>

		</p:panel>
	</ui:define>
</ui:composition>
