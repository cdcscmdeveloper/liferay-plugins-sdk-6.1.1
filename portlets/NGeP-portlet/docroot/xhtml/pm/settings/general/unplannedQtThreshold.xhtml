<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:outputPanel id="unplannedThresholdPanel">
		<table style="width: 100%">
			<tr>
				<td>
					<div align="right" style="width: 100%">
						<!-- 34445 start -->
						<p:commandButton value="#{lbl['lbl.btn.save']}" id="unplanedThreSaveBtn"
							partialSubmit="true" oncomplete="if (!args.validationFailed) saveUnplannedThreInfoDlg.show();"/>
						<!-- 34445 end -->
					</div>
				</td>
			</tr>
		</table>
		
		<!-- 34445 start -->
		<ac:confirmationPopupSM id="saveUnplannedThreInfoDlg" widget="saveUnplannedThreInfoDlg"
			okParam="#{ruleCatalogueBackingBean.saveThresholds(1)}"
			hasParam="true"
			okProcess="@([id$=unplannedThresholdPanel])"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.save.msg']}" 
			update=":form"
			loadingWidget="blockWidget" />
		<!-- 34445 end -->
		
		<table width="80%">
			<tr style="height: 30px;">
				<td style="width: 10%"><p:outputLabel
						value="#{lbl['lbl.pm.settings.threshold.setting']}" /></td>
				<td style="width: 25%"><p:selectOneRadio id="unplanedThreRadioSelection"
						value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isUnplannedThreshold}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.settings.centralized']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.settings.ministry']}"
							itemValue="0" />
						<p:ajax process="@this" event="change" partialSubmit="true"
							update="@this" />
					</p:selectOneRadio></td>
				<td style="width: 10%"><p:outputLabel
						value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
					<h:outputLabel value="*" styleClass="mandatory" /></td>
				<td style="width: 1%"><p:inputText id="unplannedThresholdId"
						value="#{ruleCatalogueBackingBean.managedBean.threshold.s2Unplanned}"
						label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}"
						valueChangeListener="#{ruleCatalogueBackingBean.onChangeMainUnplannedThreshold}"
						required="true">
						<f:validateLongRange minimum="0" maximum="100" />
						<p:ajax event="change"
							update="unplannedMinistryList,unplannedThresholdId"
							process="@this"></p:ajax>
					</p:inputText></td>
				<td style="width: 5%"><p:message for="unplannedThresholdId"
						display="icon" /></td>
			</tr>
		</table>

		<p:dataTable id="unplannedMinistryList" var="ministry" rows="10"
			value="#{ruleCatalogueBackingBean.managedBean.unplannedThresholdList}">
			<ac:paginator for="unplannedMinistryList" />
			<p:column width="70%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.settings.ministry']}" />
				</f:facet>
				<h:outputText value="#{ministry.orgProfileId.pmOrgValidity.orgName}" />
			</p:column>
			<p:column width="30%">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
				</f:facet>
				<p:inputText id="ministryUnplannedThresholdId"
					valueChangeListener="#{ruleCatalogueBackingBean.onChangeUnplannedThreshold}"
					label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}"
					disabled="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isUnplannedThreshold == 1 ? 'true':'false'}"
					value="#{ministry.s2Unplanned}" required="true">
					<f:attribute name="threshold" value="#{ministry}" />
					<f:validateLongRange minimum="0"
						maximum="#{ruleCatalogueBackingBean.managedBean.unplannedThreshold}" />
					<p:ajax event="change" update="@this" process="@this"
						partialSubmit="true"></p:ajax>
				</p:inputText>
				<p:message for="ministryUnplannedThresholdId" display="icon" />
			</p:column>
		</p:dataTable>
	</p:outputPanel>
</ui:composition>
