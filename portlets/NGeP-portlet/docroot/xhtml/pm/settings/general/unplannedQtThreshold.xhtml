<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


<p:outputPanel id="unplannedThresholdPanel">
	<div style="text-align: right; min-height: 40px;">
		<p:commandButton value="#{lbl['lbl.btn.save']}"
			action="#{ruleCatalogueBackingBean.saveThresholds(1)}"
			process="unplannedThresholdPanel"
			update="@form"></p:commandButton>
	</div>
	
	<table width="80%">
	<tr style="height: 30px;">
		<td style="width:10%"><p:outputLabel
				value="#{lbl['lbl.pm.settings.threshold.setting']}" />
		</td>
		 <td style="width:25%"><p:selectOneRadio value="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isUnplannedThreshold}"
		 	 disabled="#{not ruleCatalogueBackingBean.checkIsEpAdmin()}">
				<f:selectItem itemLabel="#{lbl['lbl.pm.settings.centralized']}" itemValue="1"/>
				<f:selectItem itemLabel="#{lbl['lbl.pm.settings.ministry']}" itemValue="0"/>
				<p:ajax process="@this" event="change" partialSubmit="true" update="@this" />
			</p:selectOneRadio>
		</td>
		<td style="width:10%">
			<p:outputLabel
				value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
			<h:outputLabel value="*" styleClass="mandatory" />
		</td>
		<td style="width:1%">
			<p:inputText id="unplannedThresholdId" value="#{ruleCatalogueBackingBean.managedBean.threshold.s2Unplanned}" 
				label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}"
				disabled="#{not ruleCatalogueBackingBean.checkIsEpAdmin()}"
				required="true">				
				<f:validateLongRange minimum="0" maximum="100" />
				<p:ajax update="unplannedMinistryList,unplannedThresholdId"
							process="@this" 
							listener="#{ruleCatalogueBackingBean.onChangeMainUnplannedThreshold()}"></p:ajax>				
			</p:inputText>
		</td>
		<td style="width:5%">
			<p:message for="unplannedThresholdId" display="icon" />
		</td>
		</tr>
	</table>
	<br/>
	<p:dataTable id="unplannedMinistryList" var="ministry" rows="10"
		value="#{ruleCatalogueBackingBean.managedBean.unplannedThresholdList}">
        <ac:paginator for="unplannedMinistryList" />
		<p:column width="70%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.ministry']}" />
			</f:facet>
			<h:outputText value="#{ministry.orgProfileId.pmOrgValidity.orgName}" />
		</p:column>
		<p:column width="30%">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" />
			</f:facet>
			<p:inputText id="ministryUnplannedThresholdId"
				label="#{lbl['lbl.pm.settings.threshold.threshold.percentage']}" 
				disabled="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isUnplannedThreshold == 1 ? 'true':'false' or ruleCatalogueBackingBean.checkIsEpAdmin()}" 
				value="#{ministry.s2Unplanned}"
				required="true">				
				<f:validateLongRange minimum="0" maximum="#{ruleCatalogueBackingBean.managedBean.unplannedThreshold}" />
				<p:ajax update="@this" process="@this" partialSubmit="true" ></p:ajax>	
			</p:inputText>
			<p:message for="ministryUnplannedThresholdId" display="icon" />
		</p:column>
	</p:dataTable>
	</p:outputPanel>
</ui:composition>
