<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">




	<ui:define name="contentSection">
	
		<p:messages id="catalogFileMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" ></p:messages>
		
		<p:blockUI block="form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<h:panelGroup>
			<p:tabMenu id="settingTabId"
				activeIndex="#{ruleCatalogueBackingBean.managedBean.tabActiveIndex}">

				<p:menuitem value="#{lbl['lbl.pm.settings.general.parameter']}"
					action="#{ruleCatalogueBackingBean.onTabChange('general')}"
					update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:menuitem value="#{lbl['lbl.pm.settings.rule.config']}"
					action="#{ruleCatalogueBackingBean.onTabChange('rule')}"
					update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				<p:menuitem value="#{lbl['lbl.pm.settings.fee.setting']}"
					action="#{ruleCatalogueBackingBean.onTabChange('fee')}"
					update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				
			</p:tabMenu>


			<c:choose>
				<c:when
					test="#{ruleCatalogueBackingBean.managedBean.tabActiveIndex == 0}">
					<ui:include src="generalSettingTab.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{ruleCatalogueBackingBean.managedBean.tabActiveIndex == 1}">
					<ui:include src="ruleConfig.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{ruleCatalogueBackingBean.managedBean.tabActiveIndex == 2}">
					<ui:include src="feeSetting.xhtml"></ui:include>
				</c:when>

			</c:choose>





		</h:panelGroup>
	</ui:define>
</ui:composition>
