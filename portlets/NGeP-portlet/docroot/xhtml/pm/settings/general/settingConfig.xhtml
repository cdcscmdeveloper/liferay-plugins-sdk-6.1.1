<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"	
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<ui:define name="contentSection">

		<p:messages id="catalogFileMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>

		<p:blockUI block="form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:outputPanel>
			<p:tabView id="settingTabId"
				activeIndex="#{ruleCatalogueBackingBean.managedBean.tabActiveIndex}">

				<p:tab id="generalSet" title="#{lbl['lbl.pm.settings.general.parameter']}">
					<ui:include src="generalSettingTab.xhtml"></ui:include>
				</p:tab>
				<p:tab title="#{lbl['lbl.pm.settings.rule.config']}">
					<ui:include src="ruleConfig.xhtml"></ui:include>
				</p:tab>
				<p:tab title="#{lbl['lbl.pm.settings.fee.setting']}">
					<p:tabView id="feeSettingId"
						activeIndex="#{ruleCatalogueBackingBean.managedBean.feeExemptionIndex}">

						<p:tab title="#{lbl['lbl.pm.settings.fee.by.org.item']}">
							<ui:include src="feeSettingByOrg.xhtml"></ui:include>
						</p:tab>
						<p:tab title="#{lbl['lbl.pm.settings.fee.by.comodity']}">
							<ui:include src="feeSettingByCommodity.xhtml" />
						</p:tab>
						<p:tab title="#{lbl['lbl.pm.settings.fee.by.contract']}">
							<ui:include src="feeSettingByContract.xhtml"></ui:include>
						</p:tab>

					</p:tabView>
				</p:tab>
				<!--  
                <p:tab id="thresholdId" title="#{lbl['lbl.pm.settings.operational.threshold']}">
					<ui:include src="operationalThreshold.xhtml"></ui:include>
				</p:tab>
				-->
			</p:tabView>



    <ac:lovPopup />
    
		</p:outputPanel>
	</ui:define>
</ui:composition>
