<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.cm.save']}"
						action="#{ruleCatalogueBackingBean.saveOperationalThreshold}"
						update="@form"></p:commandButton>
				</div>
			</td>
		</tr>
	</table>
	<div align="center">
		<h:outputText value="*" styleClass="mandatory" />
		<h:outputText value="#{lbl['lbl.pm.settings.ministry']} " />
		<p:selectOneMenu id="ministeryDropBoxId"
			disabled="#{ruleCatalogueBackingBean.managedBean.selectedConfigGeneral.isGeneralThreshold == 1}"
			value="#{ruleCatalogueBackingBean.managedBean.selectedOrgProfile.orgProfileId}"
			label="#{lbl['lbl.pm.settings.ministry']}"
			styleClass="ppDropDownWidthL" style="margin-bottom: 5px;"
			required="true">
			<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
				itemValue="#{null}" />
			<f:selectItems var="orgProfile"
				value="#{ruleCatalogueBackingBean.managedBean.orgProfileList}"
				itemLabel="#{orgProfile.pmOrgValidity.orgName}"
				itemValue="#{orgProfile.orgProfileId}" />
			<p:ajax partialSubmit="true"
				process=":form:settingTabId:ministeryDropBoxId"
				listener="#{ruleCatalogueBackingBean.ministeryChangeListener()}"
				update="OperationalThresholdTBID" />
		</p:selectOneMenu>
	</div>
	<p:dataTable id="OperationalThresholdTBID" var="threshold" row="10"
		value="#{ruleCatalogueBackingBean.managedBean.thresholds}"
		rowKey="#{threshold}" rowIndexVar="rowIndex" selectionMode="single">
		<ac:paginator for="OperationalThresholdTBID" />
		<p:column width="15%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText
					value="#{lbl['lbl.pm.settings.threshold.unplanned.sourcingLess50k']}" />
			</f:facet>
			<p:inputText value="#{threshold.s1Unplanned}" size="20"
				id="s1UnplannedId" disabled="#{!threshold.brandNew}" required="true"
				label="#{lbl['lbl.pm.settings.threshold.unplanned.sourcingLess50k']}"
				validator="#{webappBean.validatePercentageNumber}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputText>
			<p:message id="s1UnplannedMsg" for="s1UnplannedId" display="icon" />

		</p:column>
		<p:column width="15%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText
					value="#{lbl['lbl.pm.settings.threshold.unplanned.sourcingGreater50k']}" />
			</f:facet>
			<p:inputText value="#{threshold.s2Unplanned}" size="20"
				id="s2UnplannedId" disabled="#{!threshold.brandNew}" required="true"
				label="#{lbl['lbl.pm.settings.threshold.unplanned.sourcingGreater50k']}"
				validator="#{webappBean.validatePercentageNumber}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputText>
			<p:message id="s2UnplannedMsg" for="s2UnplannedId" display="icon" />
		</p:column>
		<p:column width="15%">
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
				<h:outputText
					value="#{lbl['lbl.pm.settings.threshold.budgetVsSpent']}" />
			</f:facet>
			<p:inputText value="#{threshold.budgetSpent}" size="20"
				id="budgetSpentId" disabled="#{!threshold.brandNew}" required="true"
				label="#{lbl['lbl.pm.settings.threshold.budgetVsSpent']}"
				validator="#{webappBean.validatePercentageNumber}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputText>
			<p:message id="budgetSpentIdMsg" for="budgetSpentId" display="icon" />
		</p:column>
		<p:column>
			<f:facet name="header">
				<h:outputText value="*" styleClass="mandatory" />
								#{lbl['lbl.pm.as.effdate']}
		                		</f:facet>

			<p:calendar showOn="button" id="effDate" style="width :55px;"
				required="true"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				label="#{lbl['lbl.pm.as.effdate']}" readonlyInput="true"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{threshold.effDate}">
				<p:ajax event="dateSelect" update="@([id$=expDateId])"
					process="@this" />
			</p:calendar>
		</p:column>

		<p:column>
			<f:facet name="header">
						#{lbl['lbl.pm.as.expdate']}
			                	</f:facet>

			<p:calendar showOn="button" id="expDateId" style="width :55px;"
				mindate="#{ruleCatalogueBackingBean.managedBean.today}"
				label="#{lbl['lbl.pm.as.expdate']}" readonlyInput="true"
				validatorMessage="Expire Date should be greater than Effective Date"
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
				value="#{threshold.expDate}">
				<f:attribute name="startDate" value="#{threshold.effDate}" />
				<f:validator validatorId="primeDateRangeValidator" />
			</p:calendar>
		</p:column>

		<p:column width="10%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{threshold.recordStatusFlg}"
				disabled="#{threshold.brandNew}" style="width:128px;">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
			</p:selectOneMenu>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">

			</f:facet>
			<p:commandLink id="deleteThreshold" partialSubmit="true"
				process="@this"
				disabled="#{(!(threshold.brandNew) and (threshold.effDate le DateUtils.getCurrentDateWithoutTime()))}"
				action="#{ruleCatalogueBackingBean.deleteOperationalThreshold(rowIndex)}"
				update=":form:settingTabId:OperationalThresholdTBID">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>

		</p:column>
	</p:dataTable>

	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
			process=":form:settingTabId" update=":form:settingTabId"
			action="#{ruleCatalogueBackingBean.addMoreOperationalThreshod()}"></p:commandButton>

	</div>




</ui:composition>
