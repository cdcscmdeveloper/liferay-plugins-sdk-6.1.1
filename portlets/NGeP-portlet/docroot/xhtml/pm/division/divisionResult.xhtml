<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="divisionResult" header="#{lbl['lbl.pm.division.search.result']}"
		toggleable="true">
		<p:dataTable id="division"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{divisionBackingBean.searchDivision}" rows="10"
			var="divisionList" rowIndexVar="index" lazy="true">
			<ac:paginator for="division" />

			<p:column headerText="#{lbl['lbl.pm.state.seq.no']}" style="width:5%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{index+1}" />
			</p:column>
						
			<p:column headerText="#{lbl['lbl.pm.division.state.name']}" style="width:30%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{divisionList.pmState.stateName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.division.code']}" style="width:7%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{divisionList.divisionCode}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.division.name']}" style="width:30%;white-space: normal;word-wrap: break-word;">				
				<h:outputText value="#{divisionList.divisionName}" />
			</p:column>
			
		</p:dataTable>
	</p:panel>
	
</ui:composition>
