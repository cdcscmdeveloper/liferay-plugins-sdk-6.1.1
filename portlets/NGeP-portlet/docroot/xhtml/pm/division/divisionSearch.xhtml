<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="divisionPanel" header="#{lbl['lbl.pm.division.search']}"
		toggleable="true">

		<table class="ppTwoTable">
			<tr>
				<td width="16%"><p:outputLabel
						value="#{lbl['lbl.pm.division.state']}"></p:outputLabel></td>
				<td width="35%"><p:selectOneMenu
						label="#{lbl['lbl.pm.division.state']}" id="stateCode"
						value="#{divisionBackingBean.managedBean.divisionSearchBean.stateCode}"
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{divisionBackingBean.getListOfStates()}"
							var="state" itemLabel="#{state.stateName}"
							itemValue="#{state.stateCode}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>

			</tr>
			<tr>
				<td width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.division']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{divisionBackingBean.managedBean.divisionSearchBean.divisionName}"
						id="divisionName" size="44" /></td>
			</tr>

			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{divisionBackingBean.searchDivision}"
							update=":form:divisionResult" />
						&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{divisionBackingBean.resetDivisionSearchBean}"
							process="@this"
							update=":form:divisionPanel, :form:divisionResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
