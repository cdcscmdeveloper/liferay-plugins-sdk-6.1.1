<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	

	<p:panel id="pmResult" header="#{lbl['lbl.pm.user.result']}" toggleable="true">
		<p:dataTable id="dtPmResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			rowIndexVar="rowIndex"  lazy="true" rows="10"
			value="#{profileManagSearchBackingBean.accessAPPLDataModel}"
			var="accessAPPL">
			<ac:paginator for="dtPmResult" />
			<p:column headerText="#{lbl['lbl.pm.access.app.result.createdDate']}" style="width :25%;white-space : normal">			
				<ac:labelDateTime value="#{accessAPPL[1]}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.access.app.request.organization.type']}" style="width :25%;white-space : normal">
			#{accessAPPL[2]}
			 #{profileManagSearchBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, accessAPPL[2])}			
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.access.app.request.organization.name']}" style="width :25%;white-space : normal">			
				#{accessAPPL[3]}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.access.app.request.username']}" style="width :25%;white-space : normal">
				#{accessAPPL[4]}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.access.app.request.idno']}" style="width :15%;white-space : normal">
				#{accessAPPL[5]}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.access.app.request.status']}" width="10%">
			 <c:when test="#{not empty accessAPPL[5]}" >
		    	  #{profileManagSearchBackingBean.getStatusDescById(accessAPPL[6])}
			  </c:when>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink partialSubmit="true" process="@this"
						action="#{accessApplBackingBean.redirectToAccessApplView(accessAPPL[0], accessAPPL[6],profileManagSearchBackingBean.managedBean.selectedAppTypeParamCode)}"
						style="padding-right :5px;" 
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" >
						<p:graphicImage value="/css/images/design/ico-view.png" title="#{lbl['lbl.txt.view']}" />
					</p:commandLink>
			</p:column>
		</p:dataTable>
		
	</p:panel>
   
</ui:composition>
