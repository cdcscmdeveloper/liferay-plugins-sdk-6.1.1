<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	

	<p:panel id="pmResult" header="#{lbl['lbl.pm.user.result']}" toggleable="true">
		<p:dataTable id="dtPmResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			rowIndexVar="rowIndex"  lazy="true" rows="10"
			value="#{profileManagementBackingBean.userOrgDataModel}"
			var="userOrg">
			<ac:paginator for="dtUserResult" />
			<p:column headerText="#{lbl['lbl.pm.profiles.search.orgname']}" style="width :25%;white-space : normal">			
				#{profileManagementBackingBean.retrieveOrgName(userOrg.pmOrgProfile)}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.idno']}" style="width :15%;white-space : normal">
				#{userOrg.pmUser.identificationNo}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.search.result.username']}" style="width :25%;white-space : normal">
				#{userOrg.pmUser.userName}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.designation']}" style="width :10%;white-space : normal">
				#{userOrg.designation}
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.profiles.search.user.status']}" width="10%">
				#{(userOrg.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.search.role']}" style="width:5%;text-align:center;">
				<p:commandLink  action="#{profileManagementBackingBean.getListOfAssignedRoles(userOrg)}" oncomplete="dlRoleList.show();" update=":form:opRoleList" >
					<p:graphicImage value="/css/images/design/ico-user-role.png"/>
				</p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink  action="#{profileManagementBackingBean.redirectToMaintainUser(userOrg.pmUser.userId, userOrg)}" >
					<p:graphicImage value="/css/images/design/edit.png"/>
				</p:commandLink>
			</p:column>
			
		</p:dataTable>
		
	</p:panel>
   
</ui:composition>
