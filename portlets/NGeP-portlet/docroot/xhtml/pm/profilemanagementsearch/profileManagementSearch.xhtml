<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="pmSearch">
		<table class="ppTwoTable">

			<tr>
				<th><p:outputLabel
						value="#{lbl['lbl.pm.access.app.request.organization.type']}" /></th>
				<td><p:selectOneMenu
						id="somAccessApplOrgType" styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.organisation.orgType']}"
						value="#{profileManagSearchBackingBean.managedBean.selectedOrgType}">
						<f:selectItems
							value="#{profileManagSearchBackingBean.getOrgTypeDropdownValues()}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{profileManagSearchBackingBean.changeOrgType()}"
							update=":form:pmSearch" />
					</p:selectOneMenu></td>
					<th></th>
				<td></td>
			</tr>
			<tr>
				<th><p:outputLabel
						value="#{lbl['lbl.pm.access.app.request.organization.name']}" /></th>
				<td><ac:lov id="lovOrg"
						lovId="PM_ORG_PROFILE" size="56" update="@form" readonly="true"
						disabled="#{empty profileManagSearchBackingBean.managedBean.selectedOrgType}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{profileManagSearchBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
						saveObject="profileManagSearchBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{profileManagSearchBackingBean.constructConditionFields()}"
						postUpdateListener="profileManagSearchBackingBean.changeOrgUnit" /></td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<th><p:outputLabel
						value="#{lbl['lbl.pm.access.app.request.type']}" /> <p:outputLabel
						value="* " styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="somAppType" required="true"
						label="#{lbl['lbl.pm.access.app.request.type']}"
						styleClass="ppDropDownWidthL"
						value="#{profileManagSearchBackingBean.managedBean.selectedAppTypeParamCode}">
						<f:selectItems
							value="#{profileManagSearchBackingBean.applicationTypeOptions()}" />
						<p:ajax event="change"
							listener="#{profileManagSearchBackingBean.appTypeChange()}"
							update="somAppStatus" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<th><p:outputLabel
						value="#{lbl['lbl.pm.access.app.request.status']}" /></th>
				<td><p:selectOneMenu id="somAppStatus"
						label="#{lbl['lbl.pm.access.app.request.status']}"
						styleClass="ppDropDownWidthL"
						value="#{profileManagSearchBackingBean.managedBean.profileManagSearchBean.appStatusId}">
						<f:selectItems
							value="#{profileManagSearchBackingBean.getApplicationStatus()}" />
					</p:selectOneMenu></td>
					<th></th>
				<td></td>
			</tr>
			<tr>
				<th><p:outputLabel
						value="#{lbl['lbl.pm.access.app.request.idno']}" /></th>
				<td><p:inputText id="apIdentityNo" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.access.app.request.idno']}"
						value="#{profileManagSearchBackingBean.managedBean.profileManagSearchBean.identificationNo}"
						size="30" maxlength="15" /></td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<th><p:outputLabel
						value="#{lbl['lbl.pm.access.app.request.username']}" /></th>
				<td><p:inputText id="apUserName" styleClass="ppDisplayTextL"
						label="#{lbl['lbl.pm.access.app.request.username']}"
						value="#{profileManagSearchBackingBean.managedBean.profileManagSearchBean.userName}"
						size="60" maxlength="15" /></td>
				<th></th>
				<td></td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{profileManagSearchBackingBean.searchAccessAppL}"
							update=":form:dtPmResult" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							update="@form" partialSubmit="true" process="@this"
							action="#{profileManagSearchBackingBean.resetProfileManagSearchBean}" />
					</div>
				</td>
			</tr>
		</table>
		<ac:lovPopup />
	</p:outputPanel>
</ui:composition>
