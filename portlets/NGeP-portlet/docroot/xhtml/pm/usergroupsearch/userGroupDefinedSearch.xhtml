<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel>

		<h:panelGrid columns="2" >

			<h:outputLabel value="User Name"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.userNames}" size="30" />
	
	        <h:outputLabel value="Role"></h:outputLabel>
            <p:inputText value="#{usergroupBackingBean.managedBean.roleNames}" size="30" />
			
			<h:outputLabel value="PTJ Code"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.ptjCodes}" size="30" />
			
			<h:outputLabel value="PTJ Name"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.ptjNames}" size="30" />			
		
		    <h:outputLabel value="Status"></h:outputLabel>
		       <p:selectOneMenu style="width:203px">    
            	<f:selectItem itemLabel="Active" itemValue="1" /> 
            	<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              </p:selectOneMenu> 
			
		</h:panelGrid>
 </p:panel>
</ui:composition>
