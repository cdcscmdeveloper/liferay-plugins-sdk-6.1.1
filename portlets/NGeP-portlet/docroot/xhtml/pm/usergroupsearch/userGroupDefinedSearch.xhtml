<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="UserGroupPanel">

		<h:panelGrid columns="2">

			<h:outputLabel value="#{lbl['lbl.pm.ug.search.name']}"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.userName}" size="30" />
			
			<h:outputLabel value="#{lbl['lbl.pm.ug.result.groupcode']}"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.groupCode}" size="30" style="text-transform: uppercase" maxlength="10"/>
			
			<h:outputLabel value="#{lbl['lbl.pm.ug.result.groupname']}"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.groupName}" size="30" maxlength="50"/>

			<h:outputLabel value="#{lbl['lbl.pm.ug.search.ptjcode']}"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.ptjCode}" size="30" />

			<h:outputLabel value="#{lbl['lbl.pm.ug.search.ptjname']}"></h:outputLabel>
			<p:inputText value="#{usergroupBackingBean.managedBean.ptjName}" size="30" />

			<h:outputLabel value="#{lbl['lbl.pm.search.status']}"></h:outputLabel>
			<p:selectOneMenu style="width:203px" value="#{usergroupBackingBean.managedBean.status}">
			 	 <f:selectItems value="#{usergroupBackingBean.getUserGroupStatus()}" />
			</p:selectOneMenu>

		</h:panelGrid>
	</p:panel>
</ui:composition>
