<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel id="groupInfo" header="#{lbl['lbl.pm.ug.result.title']}"
		toggleable="true">
		<p:spacer height="10"></p:spacer>

		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.result.groupcode']}" />
				</td>
				<td><p:inputText style="width:220px;text-transform:uppercase"
						value="#{usergroupBackingBean.managedBean.userGroup.groupCode}"
						disabled="#{!usergroupBackingBean.managedBean.userGroup.brandNew or usergroupBackingBean.managedBean.userGroup.brandNew}"
						size="30" maxlength="10" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.result.groupname']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="width:220px"
						value="#{usergroupBackingBean.managedBean.userGroup.groupName}"
						size="30" maxlength="50" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.info.orgunit']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:columnGroup>
						<p:inputText
							value="#{usergroupBackingBean.managedBean.userGroup.pmOrgProfile.pmOrgValidity.orgCode}"
							id="orgCodeUpdate"
							disabled="#{!usergroupBackingBean.managedBean.userGroup.brandNew}"
							size="10" readonly="true" />&#160;&#160;
      	                   <ac:lov id="uomLovId"
							lovId="PM_ORG_PROFILE_FPJ" size="60"
							update=":form:orgCodeUpdate,:form:userPanelId"
							headerText="Org Profile Lov"
							value="#{usergroupBackingBean.managedBean.userGroup.pmOrgProfile.pmOrgValidity.orgName}"
							saveObject="usergroupBackingBean.managedBean.userGroup.pmOrgProfile"
							disabled="#{!usergroupBackingBean.managedBean.userGroup.brandNew}"
							postUpdateListener="usergroupBackingBean.userListner()"
							readonly="true" conditionField="#{usergroupBackingBean.constructConditionFields()}">
						</ac:lov>
						<ac:lovPopup />
					</p:columnGroup></td>
			</tr>
			<p:spacer height="5"></p:spacer>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.search.status']}" /></td>
				<td><p:selectOneMenu style="width:230px;margin-bottom:5px;"
						value="#{usergroupBackingBean.managedBean.userGroup.recordStatusFlg}"
						disabled="#{usergroupBackingBean.managedBean.userGroup.brandNew}">
						<f:selectItems
							value="#{usergroupBackingBean.getUserGroupStatus()}"></f:selectItems>
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	<p:spacer height="20"></p:spacer>

	<p:panel header="#{lbl['lbl.pm.ug.result.title1']}" toggleable="true"
		id="userPanelId">
		<ac:lovPopup />
		<p:dataTable id="groupUser"
			value="#{usergroupBackingBean.managedBean.userGroups}"
			var="groupuser"
			selection="#{usergroupBackingBean.managedBean.selectedUsrGrps}"
			rowKey="#{groupuser}">
			<ac:paginator />
			<p:column style="width:2%;text-align:center;"
				selectionMode="multiple" />

			<p:column style="width:68%"
				headerText="#{lbl['lbl.pm.ug.info.uname']}">
				<h:outputText value="#{groupuser.pmUser.userName}" />
			</p:column>

			<p:column style="width:20%" headerText="#{lbl['lbl.pm.ug.info.al']}">
				<h:outputText value="#{groupuser.pmUserRole.approvalLimit}" />
			</p:column>

			<p:column style="width:10%"
				headerText="#{lbl['lbl.pm.ug.result.status']}">
				<p:selectOneMenu style="width:203px"
					value="#{groupuser.pmUser.recordStatusFlg}"
					disabled="#{groupuser.pmUser.brandNew or usergroupBackingBean.managedBean.brandNew}">
					<f:selectItems value="#{usergroupBackingBean.getUserGroupStatus()}"></f:selectItems>
				</p:selectOneMenu>
			</p:column>

		</p:dataTable>
		<br />
		<div class="ppRightBtn">
			<table style="width: 100%">
				<tr>
					<td class="TableFieldLeft" width="80%"></td>
					<td>
						<table>
							<tr>
								<td class="TableFieldLeft" style="padding-bottom: 5px"
									width="100%"><ac:lov id="usergrouping" lovId="PM_USER"
										headerText="User Selection"
										buttonLabel="#{lbl['lbl.btn.add']}" selectionMode="multiple"
										saveObject="usergroupBackingBean.managedBean.users"
										postUpdateListener="usergroupBackingBean.userGroupListner(usergroupBackingBean.managedBean.users)"
										update="@form"
										disabled="#{!usergroupBackingBean.managedBean.selectGrp}"
										conditionField="#{usergroupBackingBean.constuctConditionFields()}">
									</ac:lov></td>
								<td><p:commandButton value="#{lbl['lbl.btn.delete']}"
										update="groupUser"
										action="#{usergroupBackingBean.deleteUserGroup}" /></td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
