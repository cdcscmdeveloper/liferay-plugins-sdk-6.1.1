<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel id="groupInfo" header="#{lbl['lbl.pm.ug.result.title1']}"
		toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.result.groupcode']}" />
				</td>
				<td><p:inputText style="width:220px;text-transform:uppercase"
						value="#{usergroupBackingBean.managedBean.userGroup.groupCode}"
						disabled="#{!usergroupBackingBean.managedBean.userGroup.brandNew or usergroupBackingBean.managedBean.userGroup.brandNew}"
						size="30" maxlength="10" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.result.groupname']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="width:220px"
						value="#{usergroupBackingBean.managedBean.userGroup.groupName}"
						size="30" maxlength="50" 
						disabled="#{not usergroupBackingBean.managedBean.userGroup.brandNew}"/>
						<ac:iconTooltip value="#{lbl['lbl.pm.ug.groupname.tooltips']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.search.role']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="somusergrouproles" style="width:230px;margin-bottom:5px;"
						value="#{usergroupBackingBean.managedBean.userGroup.roleCode}"
						required="true"
						label="#{lbl['lbl.pm.ug.search.role']}"
						disabled="#{not usergroupBackingBean.managedBean.userGroup.brandNew}">
						<f:selectItems
							value="#{usergroupBackingBean.getUserGroupRoles()}"></f:selectItems>
						<p:ajax event="change" update="userPanelId" process="@this" 
							listener="#{usergroupBackingBean.resetGroupUsers()}"/>	
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.ug.info.orgunit']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:columnGroup>
						<p:inputText
							value="#{usergroupBackingBean.managedBean.userGroup.pmOrgProfile.pmOrgValidity.orgCode}"
							id="orgCodeUpdate"
							disabled="#{!usergroupBackingBean.managedBean.userGroup.brandNew}"
							size="10" readonly="true" />&#160;&#160;
      	                   <ac:lov id="uomLovId"
							lovId="PM_ORG_PROFILE_FPJ" size="60"
							update=":form:orgCodeUpdate,:form:userPanelId"
							headerText="#{lbl['lbl.pm.ug.info.ptj.list']}"
							value="#{usergroupBackingBean.managedBean.userGroup.pmOrgProfile.pmOrgValidity.orgName}"
							saveObject="usergroupBackingBean.managedBean.userGroup.pmOrgProfile"
							disabled="#{!usergroupBackingBean.managedBean.userGroup.brandNew}"
							postUpdateListener="usergroupBackingBean.userListner"
							readonly="true" conditionField="#{usergroupBackingBean.constructConditionFields()}">
						</ac:lov>
						<ac:lovPopup />
					</p:columnGroup></td>
			</tr>
			<p:spacer height="5"></p:spacer>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.search.status']}" /></td>
				<td><p:selectOneMenu style="width:230px;margin-bottom:5px;"
						value="#{usergroupBackingBean.managedBean.userGroup.recordStatusFlg}"
						disabled="#{usergroupBackingBean.managedBean.userGroup.brandNew}">
						<f:selectItems
							value="#{usergroupBackingBean.getUserGroupStatus()}"></f:selectItems>
							<p:ajax event="change"
									listener="#{usergroupBackingBean.userGroupStatusChange()}"
									partialSubmit="true" process="@this"
									update="@this, usergroupmsg" />	
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.pm.ug.result.title']}" toggleable="true"
		id="userPanelId">
		<ac:lovPopup />
		<p:dataTable id="groupUser"
			value="#{usergroupBackingBean.managedBean.userGroups}"
			var="groupuser" rowIndexVar="rowIndex" 
			rowKey="#{groupuser}">
			<ac:paginator for="groupUser" />		

			<p:column style="width:65%"
				headerText="#{lbl['lbl.pm.ug.info.uname']}">
				<h:outputText value="#{groupuser.pmUser.userName}" />
			</p:column>

			<p:column style="width:20%;" headerText="#{lbl['lbl.pm.ug.info.al']}">
				<h:outputText value="#{groupuser.pmUserRole.approvalLimit}"  style="float:right;"
					rendered="#{groupuser.pmUserRole.pmRole.roleCode eq ProfileManagementConst.flApprover and groupuser.pmUserRole.pmRole.limitRequired }">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column style="width:10%"
				headerText="#{lbl['lbl.pm.ug.result.status']}">
				<p:selectOneMenu style="width:203px" 
					required="true"
					label="#{lbl['lbl.pm.ug.result.status']}"
					value="#{groupuser.recordStatusFlg}"
					disabled="#{groupuser.brandNew}">
					<f:selectItems value="#{usergroupBackingBean.getUserGroupStatus()}"></f:selectItems>
					<p:ajax event="change" update="@this" process="@this" partialSubmit="true"/>	
				</p:selectOneMenu>
			</p:column>
			<p:column style="width:5%;text-align:center;">
			<f:facet name="header">				
				<h:outputText value="#{lbl['lbl.pm.action']}" />
			</f:facet>
			<p:commandLink partialSubmit="true"
				process="@this"
				disabled="#{!(groupuser.brandNew)}"
				action="#{usergroupBackingBean.deleteUserGroup(rowIndex)}"
				update="groupUser">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
			
		</p:column>

		</p:dataTable>
		
		<div style="text-align: right;">
				<ac:lov id="usergrouping" lovId="PM_USER"
						headerText="#{lbl['lbl.pm.ug.info.users']}"
						buttonLabel="#{lbl['lbl.btn.add']}" selectionMode="multiple"
						saveObject="usergroupBackingBean.managedBean.users"
						postUpdateListener="usergroupBackingBean.userGroupListner"
						update="@form"
						disabled="#{!usergroupBackingBean.managedBean.selectGrp or empty usergroupBackingBean.managedBean.userGroup.roleCode}"
						conditionField="#{usergroupBackingBean.constuctConditionFields()}">
				</ac:lov>
		</div>
	</p:panel>

</ui:composition>
