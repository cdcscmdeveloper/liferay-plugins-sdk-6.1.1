<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel>
	<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
   </p:panel>
	
   <p:panel header="GROUP INFORMATION" toggleable="true">
		
	<table>
	  <tr>	  	
		<td><p:outputLabel value="Group Code :" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText size="30" /></td>
	  </tr>	
	  <tr>	
		<td><p:outputLabel value="Group Name :" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText size="30" /></td>
	  </tr>
	  <tr>
		<td><p:outputLabel value="Role :" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="FL_APPROVER" disabled="true" size="30" /></td>
	  </tr>
	  <tr>
		<td><p:outputLabel value="Org.Unit :" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
     	 <td><p:columnGroup> 		        
      	 <p:inputText size="10" />&#160;&#160;<p:inputText size="30" />                                          
      	</p:columnGroup></td> 
	   </tr>
	   <tr>
		<td><p:outputLabel value="Status :" /></td>
     	<td><p:selectOneMenu style="width:178px">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Active" itemValue="1" /> 
            <f:selectItem itemLabel="Non-Active" itemValue="2" />  
    	 </p:selectOneMenu></td>				
	    </tr>
	</table>
   </p:panel>
	
	<p:panel header="GROUP USER" toggleable="true">
	<p:dataTable id="groupUser"  value="" var="groupuser" editable="true">
 	  <ac:paginator /> 
	   <p:column style="width:2%;text-align:center;" /> 
		  	  	         
       <p:column headerText="Username" > 
          <h:outputText />
       </p:column>  
       
       <p:column headerText="Approver Limit" > 
          <h:outputText />
       </p:column> 

       <p:column headerText="Record Status" > 
         <p:selectOneMenu style="width:203px">    
            <f:selectItem itemLabel="Active" itemValue="1" /> 
            <f:selectItem itemLabel="Non-Active" itemValue="2" />  
          </p:selectOneMenu> 
       </p:column>            
       
     </p:dataTable>

  <br/>
    <div align="right">
	<p:commandButton value="Add" oncomplete="groupuserpopup.show();" icon="ui-icon-add"></p:commandButton>
    <p:commandButton value="Delete" icon="ui-icon-delete"></p:commandButton>
    </div>
   </p:panel>	

</ui:composition>
