<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div class="header-spacing">
	<table style="width: 100%">
		<tr>
			<td>
				<div align="left" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{usergroupBackingBean.backToMainPages}" process="@this"
						style="float:left;" />
				</div>
			</td>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton update="@form"
						value="#{usergroupBackingBean.managedBean.userGroup.brandNew? lbl['lbl.btn.save'] : lbl['lbl.btn.update']}"
						action="#{usergroupBackingBean.saveUserGroup}"
						style="float:right;" />
				</div>
			</td>
		</tr>
	</table>
	</div>
</ui:composition>
