<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:commandButton value="#{lbl['lbl.btn.back']}"
		action="#{usergroupBackingBean.backToMainPages}" process="@this" style="float:left;" />
	<p:commandButton update="@form"
		value="#{usergroupBackingBean.managedBean.userGroup.brandNew? lbl['lbl.btn.create'] : lbl['lbl.btn.update']}"
		action="#{usergroupBackingBean.saveUserGroup}" style="float:right;" />
</ui:composition>
