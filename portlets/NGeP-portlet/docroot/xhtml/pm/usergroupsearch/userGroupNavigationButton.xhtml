<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<div class="header-spacing">
	<table style="width: 100%">
		<tr>
			<td>
				<div align="left" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{usergroupBackingBean.backToMainPages}" process="@this"
						style="float:left;" />
				</div>
			</td>
			<td>
				<!-- 34445 start -->
				<div align="right" style="width: 100%">
					<p:commandButton id="userSaveBtnId" value="#{lbl['lbl.btn.save']}"
						style="float:right;" oncomplete="if (!args.validationFailed) saveInfoDlg.show();"
						rendered ="#{usergroupBackingBean.managedBean.userGroup.brandNew}"/>
						
					<p:commandButton id="userUpdateBtnId" value="#{lbl['lbl.btn.update']}"
						style="float:right;"
						onstart="updateInfoDlg.show();" oncomplete="userGroupBlockWidget.hide();"
						rendered ="#{!usergroupBackingBean.managedBean.userGroup.brandNew}"/>
				</div>
				<!-- 34445 end -->
			</td>
		</tr>
	</table>
	
	<!-- 34445 start -->
	<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
		loadingWidget="userGroupBlockWidget"
		okAction="usergroupBackingBean.saveUserGroup"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.save.msg']}"
		update="@([id$=Msg])"/>
		
	<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
		loadingWidget="userGroupBlockWidget"
		okAction="usergroupBackingBean.saveUserGroup"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.update.msg']}"
		update=":form"/>
	<!-- 34445 end -->
	</div>
</ui:composition>
