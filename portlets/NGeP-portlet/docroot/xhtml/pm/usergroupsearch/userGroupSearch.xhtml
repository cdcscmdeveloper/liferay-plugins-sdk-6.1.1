<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="userGroupSearch" style="width:100%;">
	</h:panelGrid>
	
	 <ui:include src="/xhtml/pm/usergroupsearch/userGroupDefinedSearch.xhtml" />
			
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search" update="searchGroupProfile" />
            <p:commandButton value="Reset" type="reset" icon="ui-icon-reset" 
            process="@this" actionListener="#{usergroupBackingBean.reset}"/>
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchGroupProfile">
 	<ac:paginator for="searchGroupProfile" />
		
       <p:column headerText="Group Code"> 
        <h:outputText  />       
       </p:column>
       
       <p:column headerText="Group Name"> 
        <h:outputText />
       </p:column>       
     
       <p:column headerText="PTJ Code"> 
         <h:outputText />        
       </p:column>
    
       <p:column headerText="PTJ Name">
        <h:outputText />
       </p:column>
      
    	<p:column headerText="Action">
   		 <p:commandLink>
     	<p:graphicImage library="ep/images/design" name="edit.png"
     	 value="/resources/ep/images/design/edit.png" />
    	 </p:commandLink>
   	 	</p:column>    
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="Create" style="float:right;"
        action="#{usergroupBackingBean.createUserGroupProfiles()}" ajax="false" icon="ui-icon-add" />
	
	 </h:panelGrid>	
	</p:panel>
</ui:composition>
