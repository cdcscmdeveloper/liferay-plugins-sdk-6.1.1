<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:remove>
		<p:panel id="userGroupSearch" header="#{lbl['lbl.pm.sa.search']}"
			toggleable="true">

			<ui:include
				src="/xhtml/pm/usergroupsearch/userGroupDefinedSearch.xhtml" />


			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{usergroupBackingBean.searchUserGroupAction}"
					update="searchGroupProfile" process="userGroupSearch" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					update="UserGroupPanel,searchGroupProfile" process="@this"
					partialSubmit="true" action="#{usergroupBackingBean.reset}" />
			</div>
			

		</p:panel>
	</ui:remove>
	<p:panel header="#{lbl['lbl.pm.sa.result']}" toggleable="true">
		<p:dataTable id="searchGroupProfile"
			value="#{usergroupBackingBean.userGroupList}" var="userGrp" rows="10"
			lazy="true">
			<ac:paginator for="searchGroupProfile" />

			<p:column headerText="#{lbl['lbl.pm.ug.result.groupcode']}"
				style="width:15%">
				<h:outputText value="#{userGrp.groupCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.ug.result.groupname']}"
				style="width:25%">
				<h:outputText value="#{userGrp.groupName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.ug.search.ptjcode']}"
				style="width:15%">
				<h:outputText value="#{userGrp.pmOrgProfile.orgCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.ug.search.ptjname']}"
				style="width:25%">
				<h:outputText value="#{userGrp.pmOrgProfile.orgName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:15%"> 
   	    		#{(userGrp.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
      		 </p:column>

			<p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}"
				style="width:5%;text-algin:center;">
				<p:commandLink
					action="#{usergroupBackingBean.gotoMaintanance(userGrp)}"
					process="@this" >
					<p:graphicImage library="ep/images/design" 
						value="/css/images/design/edit.png" />
				</p:commandLink>

			</p:column>
		</p:dataTable>

	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}" process="@this"
			action="#{usergroupBackingBean.createUserGroupProfiles()}" />
	</div>
</ui:composition>
