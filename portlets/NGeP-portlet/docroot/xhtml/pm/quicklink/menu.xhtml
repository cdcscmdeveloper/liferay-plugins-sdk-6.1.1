<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets">

	<ui:define name="resourceSection">

	</ui:define>

	<ui:define name="contentSection">
		<table border="0" cellpadding="0" cellspacing="0" width="100%"
			class="menuTable">			
		<tr>
			<td class="menuContent">
				<c:forEach var="menuBean" items="#{menuBackingBean.menuBeans}">
						<h:panelGroup layout="block" styleClass="menuColumn">
							<h:panelGroup layout="block" styleClass="menuCategory">
								<c:if test="#{menuBean.imageId != null}">
									<h:graphicImage
										value="/../image/layout_icon?img_id=#{menuBean.imageId}"
										title="#{menuBean.title}" styleClass="menuImage" />
								</c:if>
												
								#{menuBean.name}
							</h:panelGroup>

							<h:dataTable var="childMenuBean"
								value="#{!empty menuBean.children ? menuBean.children : menuBean}"
								columns2="1"
								columns1="#{fn:length(menuBean.children) ge 3 ? 3 : fn:length(menuBean.children)}"
								columnClasses="menuItemColumn">

								<h:column>
									<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/icon-quick-links.png" 
										styleClass="menuImage" />&#160;
									<h:outputLink value="#{childMenuBean.url}"
										styleClass="menuItemLink#{menuBackingBean.selectedMenu == childMenuBean.name ? '-selected' : ''}">#{childMenuBean.name}</h:outputLink>
								</h:column>

							</h:dataTable>
						</h:panelGroup>
					</c:forEach>
			</td>
		</tr>
		
		</table>
	</ui:define>

</ui:composition>
