<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">


		<style>
a {
	text-decoration: none;
	color: #009ae5;
}

textarea {
	width: 205px;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
	color: #000;
	line-height: 1.5em;
}

.myProfile-title {
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-weight: bold;
	color: #000;
	margin: 10px;
}

.myProfile-text {
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
	color: #000;
	margin: 10px;
	word-wrap: break-word;
	padding: 3px;
}

.div-content-break-word {
	word-wrap: break-word;
}
</style>
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true" escape="false" />
		<table width="100%" border="0" cellspacing="0" cellpadding="0">
				<tr>
					<td colspan="2" valign="top" class="myProfile-title"><h:outputLabel rendered="profilePersonalizationBackingBean.managedBean.showRobExpiredDateMesej"></h:outputLabel>#{lbl['lbl.sm.rob.expire']}</td>
				</tr>
		</table>

	</ui:define>
</ui:composition>
