<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">	

	<!-- User Profile -->
	<p:panel header="#{lbl['lbl.pm.profiles.user.profile']}" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2">
			<p:outputPanel id="opUserProfileDet">
				<table class="ppTwoTable">
					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" id="itLoginId" maxlength="75"
								label="#{lbl['lbl.pm.profiles.userdetails.loginid']}"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.loginId}"
								disabled="true"/>
						</td>
						<!-- Profile Photo -->
						<td colspan="2" rowspan="9">
							<c:choose>
								<c:when test="#{!profilePersonalizationBackingBean.managedBean.deletePortrait}">
									<h:graphicImage id="giUserImage"
										value="#{profilePersonalizationBackingBean.userImagePath(profilePersonalizationBackingBean.managedBean.selectedUser.loginId)}"
										style="margin-left:25px;" width="140" height="160" />				
								</c:when>
								<c:otherwise>
									<h:graphicImage id="giUserImage"
										value="/css/images/design/user_male_portrait.png"
										style="margin-left:25px;" width="140" height="160" />							
								</c:otherwise>
							</c:choose>	
							<div align="left">
								<p:commandButton icon="ui-icon-image" value="#{lbl['lbl.pm.profiles.userdetails.changepic']}" 
									immediate="true" oncomplete="dlImageUpload.show();"  />
								<p:commandButton icon="ui-icon-delete" value="#{lbl['lbl.pm.profiles.userdetails.deletepic']}" 
									immediate="true" update="giUserImage" action="#{profilePersonalizationBackingBean.deletePortrait}" />
							</div>
						</td>
					</tr>
					
					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM" disabled="true"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.salutationCode.salutationId}">
								<f:selectItems value="#{profilePersonalizationBackingBean.salutationOptions()}" />
							</p:selectOneMenu>
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.username']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" disabled="true" maxlength="50"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.userName}"/>
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idtype']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM" disabled="#{!profilePersonalizationBackingBean.managedBean.selectedUser.brandNew}"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.identificationCode.parameterId}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
								<f:selectItems value="#{profilePersonalizationBackingBean.getIdentityTypeList()}"/>
							</p:selectOneMenu>
						</td>
						<th ></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" disabled="#{!profilePersonalizationBackingBean.managedBean.selectedUser.brandNew}"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.identificationNo}" maxlength="12">
								<p:ajax event="change" update="itLoginId" listener="#{profilePersonalizationBackingBean.updateLoginId()}"/>
							</p:inputText>
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.nationality']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM" disabled="true"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.pmCountry.countryId}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
								<f:selectItems
									value="#{profilePersonalizationBackingBean.getCountryList()}"
									var="countrylist" itemLabel="#{countrylist.countryName}"
									itemValue="#{countrylist.countryId}" />
							</p:selectOneMenu>
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.designation']}" />
						</th>
						<td>
							<p:inputText disabled="true" styleClass="ppDisplayTextM" maxlength="30"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.designation}" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.promanagement']}" />
						</th>
						<td>
							<p:selectOneRadio disabled="true" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.PMP}" >
								<f:selectItems value="#{profilePersonalizationBackingBean.getYesNoOptions()}" />
							</p:selectOneRadio>
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.grade']}" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" disabled="true" maxlength="10"
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.grade}"/>
						</td>
						<th></th>
						<td></td>
					</tr>
					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.status']}"/>
						</th>
						<td>
							<p:selectOneMenu value="#{profilePersonalizationBackingBean.managedBean.selectedUser.recordStatusFlg}" 
								disabled="true" styleClass="ppDropDownWidthM">
								<f:selectItems value="#{profilePersonalizationBackingBean.getStatusOptions()}" />
							</p:selectOneMenu>
						</td>
						<th></th>
						<td></td>
					</tr>
				</table>
			</p:outputPanel>
		</h:panelGrid> 
    </p:panel>	
    <br />	  
    
    <!-- Address & Contact -->
	<p:panel id="pUserContact" header="#{lbl['lbl.pm.profiles.address.contact']}" toggleable="true">  		             				    		   		     
		<table class="ppTwoTable">
			<tr>		    
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.country']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>	  
		        <td>
		        	<p:selectOneMenu value="#{profilePersonalizationBackingBean.managedBean.userAddress.pmCountry.countryId}" 
		        		styleClass="ppDropDownWidthM" id="somCountry" required="#{!empty param['disableValidation']}"
		        		label="#{lbl['lbl.pm.profiles.userdetails.country']}" >
	            	     <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 		             
						 <f:selectItems value="#{profilePersonalizationBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />  
						<p:ajax event="change" update="pUserContact" listener="#{profilePersonalizationBackingBean.updateAddress(0)}" />
                    </p:selectOneMenu>
                    <p:message id="somCountryMsg" for="somCountry" display="icon" />
                 </td>	  
                 <th></th>
                 <td></td>
            </tr>
            <tr>       
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressone']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>	  
			    <td>
			    	<p:inputText id="itUserAdd1" value="#{profilePersonalizationBackingBean.managedBean.userAddress.address1}" 
			    		styleClass="ppDisplayTextL" maxlength="35" required="#{!empty param['disableValidation']}"/>
			    	<p:message id="itUserAdd1Msg" for="itUserAdd1" display="icon" />	
	    		</td>	
			    <th></th>
                <td></td>                    
            </tr>
            <tr>       
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addresstwo']}" /></th>	  
			    <td><p:inputText value="#{profilePersonalizationBackingBean.managedBean.userAddress.address2}"
			     		styleClass="ppDisplayTextL" maxlength="35"/></td>	   
			    <th></th>
                <td></td>
			 </tr>
			 <tr>   
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressthree']}" /></th>	  
			    <td><p:inputText value="#{profilePersonalizationBackingBean.managedBean.userAddress.address3}" 
			   	 		styleClass="ppDisplayTextL" maxlength="35"/></td>	
			    <th></th>
                <td></td> 
		    </tr>
		    <tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressfour']}" /></th>	  
		    	<td><p:inputText value="#{profilePersonalizationBackingBean.managedBean.userAddress.address4}" 
		    			styleClass="ppDisplayTextL" maxlength="35"/></td>	 
		    	<th></th>
               	<td></td>	
		    </tr>
		    <tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.postcode']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>	 
		    	<td>
		    		<p:inputText id="itPostcode" required="#{!empty param['disableValidation']}" 
		    			value="#{profilePersonalizationBackingBean.managedBean.userAddress.postcode}" 
		    			styleClass="ppDisplayTextM"  maxlength="10" />
	    			<p:message id="itPostcodeMsg" for="itPostcode" display="icon" />
    			</td>	
		    	<th></th>
               	<td></td>
		    </tr>			
		    <tr>	
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.state']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>  
		        <td>
		        	<p:selectOneMenu id="somStateC" styleClass="ppDropDownWidthM" required="#{!empty param['disableValidation']}"
		        		disabled="#{profilePersonalizationBackingBean.managedBean.userAddress.pmCountry.countryId==null}"
		        		value="#{profilePersonalizationBackingBean.managedBean.userAddress.pmState.stateId}" 
		        		label="#{lbl['lbl.pm.profiles.userdetails.state']}">
					   	<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					   	<f:selectItems
						  value="#{profilePersonalizationBackingBean.getStateList(profilePersonalizationBackingBean.managedBean.userAddress.pmCountry.countryId)}" 
						  var="state" itemLabel="#{state.stateName}"
						  itemValue="#{state.stateId}"/>
					  	<p:ajax event="change" listener="#{profilePersonalizationBackingBean.updateDivisionFlag(
					  		profilePersonalizationBackingBean.managedBean.userAddress.pmState.stateId)}" 
					  		update="pUserContact" />
			       </p:selectOneMenu>
			       <p:message id="somStateCMsg" for="somStateC" display="icon" />
		       	</td>						
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.division']}" />
                	<p:outputLabel value="*" styleClass="mandatory" />
               	</th>  
		        <td>
		        	<p:selectOneMenu id="somDivisionC" disabled="#{!profilePersonalizationBackingBean.managedBean.divisionFlagC}"
		        		value="#{profilePersonalizationBackingBean.managedBean.userAddress.pmDivision.divisionId}" 
		        		required="#{!empty param['disableValidation'] and profileManagementBackingBean.managedBean.divisionFlagC}"
		        		label="#{lbl['lbl.pm.profiles.userdetails.division']}"
		        		styleClass="ppDropDownWidthM"> 
					 	<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
					 	<f:selectItems
						  value="#{profilePersonalizationBackingBean.getDivisionList(profilePersonalizationBackingBean.managedBean.userAddress.pmState.stateId)}" 
						  var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>
				    </p:selectOneMenu>
				    <p:message id="somDivisionCMsg" for="somDivisionC" display="icon" />
			    </td>
			</tr>    	
			<tr>
	            <th width="20%">
	            	<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.district']}" />
	            	<p:outputLabel value="*" styleClass="mandatory" />
            	</th> 
		        <td>
		        	<p:selectOneMenu id="somDistrictC" required="#{!empty param['disableValidation']}"
		        		disabled="#{profilePersonalizationBackingBean.managedBean.userAddress.pmState.stateId==null}"
		        		value="#{profilePersonalizationBackingBean.managedBean.userAddress.pmDistrict.districtId}"
		        		label="#{lbl['lbl.pm.profiles.userdetails.district']}"
		              	styleClass="ppDropDownWidthM"> 
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems 
							value="#{profilePersonalizationBackingBean.getDistrictList(profilePersonalizationBackingBean.managedBean.userAddress.pmState.stateId)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"/>
						<p:ajax event="change" listener="#{profilePersonalizationBackingBean.updateAddress(2)}" update="somCityC"/>     
				   </p:selectOneMenu>
				   <p:message id="somDistrictCMsg" for="somDistrictC" display="icon" />
			    </td>	
			    <td>
			    	<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.citytown']}" />
			    	<p:outputLabel value="*" styleClass="mandatory" />
		    	</td>
		        <td>
		        	<p:selectOneMenu id="somCityC" required="#{!empty param['disableValidation']}"
		        		disabled="#{profilePersonalizationBackingBean.managedBean.userAddress.pmState.stateId==null
		        			or profilePersonalizationBackingBean.managedBean.userAddress.pmDistrict.districtId==null}"
		        		value="#{profilePersonalizationBackingBean.managedBean.userAddress.pmCity.cityId}"
		        		label="#{lbl['lbl.pm.profiles.userdetails.citytown']}"
    					styleClass="ppDropDownWidthM"> 
				        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
				        <f:selectItems 
							value="#{profilePersonalizationBackingBean.getCityList(profilePersonalizationBackingBean.managedBean.userAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}"/>
				    </p:selectOneMenu>
				   	<p:message id="somCityCMsg" for="somCityC" display="icon" />
			    </td>	
			    <th></th>
      			<td></td>
 			</tr>	
			<tr> 
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.email']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>  
			    <td>
			    	<p:inputText id="itEmail" required="#{!empty param['disableValidation']}"
			    		value="#{profilePersonalizationBackingBean.managedBean.selectedUser.email}" 
			    		styleClass="ppDisplayTextM" maxlength="80">
			    		<f:validateRegex disabled="#{empty param['disableValidation']}"
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
		    		</p:inputText>
		    		&#160;&#160;   
	                <p:graphicImage id="giEmail" 
		                   value="/css/images/design/tooltips.png" />
					<p:tooltip for="giEmail" value="#{lbl['lbl.pm.profiles.userdetails.email.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itEmailMsg" for="itEmail" display="icon" />
		    	</td>
			    <th></th>
               	<td></td>
			</tr>    
			<tr>   
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.telno']}" /></th>  
			    <td>
			    	<p:inputText id="itTelNo" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.phoneNo}" 
			    		styleClass="ppDisplayTextM"  maxlength="12">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itTelNoMsg" for="itTelNo" display="icon" />
	    		</td> 	
			    <th></th>
               	<td></td>
			</tr>    		     			    		 			   
			<tr>    
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.faxno']}" /></th> 
			    <td>
			    	<p:inputText id="itFaxNo" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.faxNo}" 
			    		styleClass="ppDisplayTextM" maxlength="12">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itFaxNoMsg" for="itFaxNo" display="icon" />
	    		</td>
			    <th></th>
               	<td></td>
		    </tr>     
			<tr>    			    
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.mobileno']}" /></th>  
			    <td>
			    	<p:inputText id="itMobileNo" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.mobileNo}" 
			    		styleClass="ppDisplayTextM"  maxlength="12">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itMobileNoMsg" for="itMobileNo" display="icon" />
	    		</td>
			    <th></th>
               	<td></td>		    			    			    			    			    		    			    			                                          			                     		                                                 
            </tr>		    			                     
		</table>
	</p:panel>
	<!-- Upload Image Popup -->
	<ui:include src="/xhtml/pm/profilePersonalization/common/uploadPortrait.xhtml" />
</ui:composition>
