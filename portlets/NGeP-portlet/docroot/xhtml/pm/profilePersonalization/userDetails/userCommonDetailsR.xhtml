<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">


		<style>
a {
	text-decoration: none;
	color: #009ae5;
}

textarea {
	width: 205px;
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
	color: #000;
	line-height: 1.5em;
}

.myProfile-title {
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-weight: bold;
	color: #000;
	margin: 10px;
}

.myProfile-text {
	font-family: Arial, Helvetica, sans-serif;
	font-size: 12px;
	color: #000;
	margin: 10px;
	word-wrap: break-word;
	padding: 3px;
}

.div-content-break-word {
	word-wrap: break-word;
}
</style>
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true" escape="false" />

		<ui:param name="showExpSection"
			value="#{profilePersonalizationBackingBean.mofExpiryShown or profilePersonalizationBackingBean.virtualCertShown or
			profilePersonalizationBackingBean.softCertExpiryShown}" />

		<table width="100%" border="0" cellspacing="0" cellpadding="0">
			<tbody>
				<tr>
					<td width="20" valign="top" class="myProfile-text"><p:graphicImage
							value="/css/images/design/ico-organization.png" /></td>
					<td valign="top" class="myProfile-text"><c:choose>
							<c:when
								test="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode}">
								<h:outputText style="white-space:normal;"
									value="#{profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.companyName}" />
							</c:when>
							<c:when
								test="#{ParameterConst.orgTypeFactoring eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode}">
								<h:outputText style="white-space:normal;"
									value="#{profilePersonalizationBackingBean.managedBean.currentProfile.pmFinancialOrg.finOrgName}" />
							</c:when>
							<c:otherwise>
								<h:outputText style="white-space:normal;"
									value="#{profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgName}" />
							</c:otherwise>
						</c:choose></td>
				</tr>
				<tr>
					<td width="20" valign="top" class="myProfile-text"><p:graphicImage
							value="/css/images/design/ico-email.png" /></td>
					<td valign="top" class="myProfile-text"><div
							class="div-content-break-word">
							<h:outputText
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.email}" />
							&#160;
							<h:graphicImage value="/css/images/design/tick.png"
								rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}" />
						</div></td>
				</tr>
				<tr>
					<td width="20" valign="top" class="myProfile-text"><p:graphicImage
							value="/css/images/design/ico-sms.png" /></td>
					<td valign="top" class="myProfile-text"><div
							class="div-content-break-word">
							<h:outputText style="white-space:normal;"
								value="#{not empty profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull 
                  ? profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull : '-'}" />
							&#160;
							<h:graphicImage value="/css/images/design/tick.png"
								rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}" />
						</div></td>
				</tr>
				<tr>
					<td width="20" valign="top" class="myProfile-text"><p:graphicImage
							value="/css/images/design/ico-role.png" /></td>
					<td valign="top"><p:scrollPanel
							style="max-height: 100px; min-height:20px;max-width:205px;padding: 0px !important;margin-top: 2px !important;margin-left:5px;"
							mode="native">
							<ui:repeat var="role"
								value="#{profilePersonalizationBackingBean.managedBean.rolesList}"
								varStatus="status">
								<div class="#{status.odd ? 'role-odd' : 'role-even'}">
									<div class="div-content-break-word" style="background:white;">
										<h:outputText value="#{role}"
											style="color: #000;font-family: Arial, Helvetica, sans-serif;font-size: 12px;" />
									</div>
								</div>

							</ui:repeat>

						</p:scrollPanel></td>
				</tr>
				<tr>
					<td valign="top"></td>
					<td valign="top"></td>
				</tr>
				<c:if test="#{showExpSection}">
					<div id="opUserCommonDetSuppDiv">
						<c:if test="#{profilePersonalizationBackingBean.mofExpiryShown}">
							<tr>
								<td colspan="2" valign="top" class="myProfile-title">#{lbl['lbl.pm.ucd.mof.exp']}</td>
							</tr>
							<tr>
								<td colspan="2" valign="top" class="myProfile-text"><h:outputText
										value="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null ? '' : '-'}" />
									<h:outputText
										value="#{profilePersonalizationBackingBean.managedBean.mofExpDate}"
										rendered="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</h:outputText></td>
							</tr>
							<c:if
								test="#{profilePersonalizationBackingBean.virtualCertShown}">
								<tr>
									<td width="20" valign="top" class="myProfile-text"><p:graphicImage
											value="/css/images/design/icon-view.png" /></td>
									<td valign="top" class="myProfile-text"><p:commandLink
											action="#{supplierAlertBackingBean.navigateToViewVirtualCert}"
											value="#{lbl['lbl.pm.ucd.virtual.cert']}" /></td>
								</tr>
							</c:if>
							<tr>
								<td valign="top"></td>
								<td valign="top"></td>
							</tr>
						</c:if>
						<c:if
							test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
							<tr>
								<td colspan="2" valign="top" class="myProfile-title">#{lbl['lbl.pm.ucd.softcert.exp']}</td>
							</tr>
							<tr>
								<td colspan="2" valign="top" class="myProfile-text"><h:outputText
										value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null ? '' : '-'}" />
									<h:outputText
										value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate}"
										rendered="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</h:outputText></td>
							</tr>
							<c:if
								test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
								<tr>
									<td width="20" valign="top" class="myProfile-text"><p:graphicImage
											value="/css/images/design/icon-view.png" /></td>
									<td valign="top" class="myProfile-text"><p:commandLink
											action="#{softCertBackingBean.navigateToViewSoftCert}"
											value="#{lbl['lbl.pm.ucd.soft.cert']}" /></td>
								</tr>
							</c:if>
						</c:if>
					</div>
				</c:if>

			</tbody>
		</table>

	</ui:define>
</ui:composition>
