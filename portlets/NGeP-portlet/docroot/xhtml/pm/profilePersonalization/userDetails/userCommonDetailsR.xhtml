<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	    
		<style>
		 #opUserCommonMainDiv{
      		background-color: #f4f4f4;
      		border: 1px solid #d3d3d3;
      		border-radius: 5px;
      		padding:10px 15px;
      	}
		
	
	.role-odd {
		font-size: 14px;
		background: #ffffff;
	}
	
	.role-even {
		font-size: 14px;
		background: #F2F5F9;
	}
	
	.rTable {
		display: table;
		width: 100%;
	}
	
	.rTableRow {
		display: table-row;
		padding-bottom: 2px;
	}
	
	.rTableHeading {
		display: table-header-group;
	}
	
	.rTableBody {
		display: table-row-group;
	}
	
	.rTableFoot {
		display: table-footer-group;
	}
	
	.rTableCell,.rTableHead {
		display: table-cell;
		padding-right: 5px;
		padding-bottom: 5px;
	}
	</style>
		<c:if test="#{not profilePersonalizationBackingBean.tempSupplierRole}">
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="true" escape="false" />
			<ui:param name="orgName"
				value="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode ? 
         profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.companyName
         : profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgName}" />
			<ui:param name="showExpSection"
				value="#{profilePersonalizationBackingBean.mofExpiryShown or profilePersonalizationBackingBean.virtualCertShown or
			profilePersonalizationBackingBean.softCertExpiryShown}" />

			<div id="opUserCommonMainDiv" class="span12">
			<div id="opUserCommonDetDiv" class="span12">
				<div class="rTable">
					<div class="rTableRow">
						<div class="rTableCell" style="width:10%;max-width:35px;">
							<p:graphicImage value="/css/images/design/icon-organization.png"
								title="#{lbl['lbl.pm.access.app.org']}" />
						</div>
						<div class="rTableCell">
							<h:outputText style="white-space:normal;" value="#{orgName}" />
						</div>
					</div>

					<div class="rTableRow">
						<div class="rTableCell">
							<p:graphicImage value="/css/images/design/icon-email.png"
								title="#{lbl['lbl.pm.address.email']}" />
						</div>
						<div class="rTableCell">
							<h:outputText
								value="#{profilePersonalizationBackingBean.managedBean.selectedUser.email}" />
							&#160;
							<h:graphicImage value="/css/images/design/tick.png"
								rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}" />
						</div>
					</div>

					<div class="rTableRow">
						<div class="rTableCell">
							<p:graphicImage value="/css/images/design/icon-sms.png"
								title="#{lbl['lbl.pm.profiles.preferences.sms']}" />
						</div>
						<div class="rTableCell">
							<h:outputText style="white-space:normal;"
								value="#{not empty profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull 
                  ? profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull : '-'}" />
							&#160;
							<h:graphicImage value="/css/images/design/tick.png"
								rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}" />
						</div>
					</div>

					<div class="rTableRow">
						<div class="rTableCell">
							<p:graphicImage value="/css/images/design/icon-account-info.png"
								title="#{lbl['lbl.pm.profiles.authorisation.roles']}" />
						</div>
						<div class="rTableCell">
							<p:scrollPanel
								style="max-height: 60px; min-height:20px;max-width:210px;padding: 0px !important;margin-top: 0px !important;"
								mode="native">

								<ui:repeat var="role"
									value="#{profilePersonalizationBackingBean.managedBean.rolesList}"
									varStatus="status">
									<div class="#{status.odd ? 'role-odd' : 'role-even'}">
										<h:outputText value="#{role}" />
									</div>

								</ui:repeat>

							</p:scrollPanel>
						</div>
					</div>

				</div>

			</div>
			<c:if test="#{showExpSection}">
			<div class="span12" style="margin:10px 0px 5px 0px">

				<div class="rTable">
					<c:if test="#{profilePersonalizationBackingBean.mofExpiryShown}">
						<div class="rTableRow">
							<div class="rTableCell" style="font-weight:bold;">
								<h:outputText value="#{lbl['lbl.pm.ucd.mof.exp']}" />
								<h:outputText
									value="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null ? ' : ' : ' : - '}" />
								<h:outputText
									value="#{profilePersonalizationBackingBean.managedBean.mofExpDate}"
									rendered="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
							</div>
						</div>
					</c:if>
					<c:if test="#{profilePersonalizationBackingBean.virtualCertShown}">
						<div class="rTableRow">
							<div class="rTableCell">
								<p:graphicImage value="/css/images/design/icon-view.png" />&#160;
								<p:commandLink
									action="#{supplierAlertBackingBean.navigateToViewVirtualCert}"
									value="#{lbl['lbl.pm.ucd.virtual.cert']}" />
							</div>
						</div>
					</c:if>
					<c:if
						test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
						<div class="rTableRow">
							<div class="rTableCell" style="font-weight:bold;">
								<h:outputText value="#{lbl['lbl.pm.ucd.softcert.exp']}" />
								<h:outputText
									value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null ? ' : ' : ' : - '}" />
								<h:outputText
									value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate}"
									rendered="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null}">
									<f:convertDateTime
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
								</h:outputText>
							</div>
						</div>
					</c:if>
					<c:if
						test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
						<div class="rTableCell">
							<p:graphicImage value="/css/images/design/icon-view.png" />&#160;
							<p:commandLink
								action="#{softCertBackingBean.navigateToViewSoftCert}"
								value="#{lbl['lbl.pm.ucd.soft.cert']}" />
						</div>

					</c:if>
				</div>
			</div>
			</c:if>
			</div>
		</c:if>
	</ui:define>
</ui:composition>
