<ui:composition
   template="/WEB-INF/facelets/templates/basic_template.xhtml"
   xmlns="http://www.w3.org/1999/xhtml"
   xmlns:f="http://java.sun.com/jsf/core"
   xmlns:h="http://java.sun.com/jsf/html"
   xmlns:ui="http://java.sun.com/jsf/facelets"
   xmlns:p="http://primefaces.org/ui"
   xmlns:c="http://java.sun.com/jsp/jstl/core">
   <ui:define name="contentSection">
      <style>
      #opUserCommonDetDiv{
      		background-color: #f4f4f4;
      		border: 1px solid #d3d3d3;
      		border-radius: 5px;
      	}
      
         .ui-datatable-odd {
         	background: #ffffff;
         }
         .ui-datatable-even {
        	background: #F2F5F9;
         }
         .myTable thead {
         	display:none;
         }
         .myTable {
         	margin:0px !important;
         }
         
         .myTable > .ui-datatable-tablewrapper{
         	margin:0px !important;
         }
         
         .myTable > .ui-datatable-tablewrapper > table{
         	margin:0px !important;
         }
      </style>
      <p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="true" escape="false"/>
      <ui:param name="orgName" value="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode ? 
         profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.companyName
         : profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgName}" />
      <p:outputPanel id="opUserCommonDet" rendered="#{not profilePersonalizationBackingBean.tempSupplierRole}">
      	<div id="opUserCommonDetDiv">
         <table class="ppTwoTable" style="margin-left:15px">
            <tr>
               <td style="width:25px;vertical-align:top;">
                  <p:graphicImage value="/css/images/design/icon-organization.png" title="#{lbl['lbl.pm.access.app.org']}" />
               </td>
               <td style="width:400px;">
                  <h:outputText style="white-space:normal;" value="#{orgName}" />
               </td>
               <td rowspan="4" style="vertical-align:top;">
                  <table>
                     <c:if test="#{profilePersonalizationBackingBean.mofExpiryShown}">
                        <tr>
                           <td colspan="2" style="font-weight: bold;">
                              <h:outputText value="#{lbl['lbl.pm.ucd.mof.exp']}" />
                              <h:outputText value="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null ? ' : ' : ' : - '}" />
                              <h:outputText value="#{profilePersonalizationBackingBean.managedBean.mofExpDate}"
                                 rendered="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null}" >
                                 <f:convertDateTime 
                                    pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                              </h:outputText>
                           </td>
                        </tr>
                     </c:if>
                     <c:if test="#{profilePersonalizationBackingBean.virtualCertShown}">
                        <tr>
                           <td style="width:20px;">
                              <p:graphicImage value="/css/images/design/icon-view.png" title="#{lbl['lbl.pm.ucd.mof.exp']}" />
                           </td>
                           <td style="color: blue; font-weight: bold; text-align: left;">
                              <p:commandLink action="#{supplierAlertBackingBean.navigateToViewVirtualCert}" value="#{lbl['lbl.pm.ucd.virtual.cert']}" />
                           </td>
                        </tr>
                     </c:if>
                     <c:if test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
                        <tr>
                           <td colspan="2" style="font-weight: bold;">
                              <h:outputText  value="#{lbl['lbl.pm.ucd.softcert.exp']}" />
                              <h:outputText value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null ? ' : ' : ' : - '}"/>
                              <h:outputText value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate}" 
                                 rendered="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null}" >
                                 <f:convertDateTime
                                    pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
                              </h:outputText>
                           </td>
                        </tr>
                     </c:if>
                     <c:if test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
                        <tr>
                           <td style="width:20px;">
                              <h:graphicImage value="/css/images/design/icon-view.png" title="#{lbl['lbl.pm.ucd.softcert.exp']}"/>
                           </td>
                           <td style="color: blue; font-weight: bold; text-align: left;">
                              <p:commandLink action="#{softCertBackingBean.navigateToViewSoftCert}"  value="#{lbl['lbl.pm.ucd.soft.cert']}" />
                           </td>
                        </tr>
                     </c:if>
                  </table>
               </td>
            </tr>
            <tr>
               <td style="width:25px;vertical-align:top;">
                  <p:graphicImage value="/css/images/design/icon-email.png" title="#{lbl['lbl.pm.address.email']}"/>
               </td>
               <td style="width:400px;">
                  <h:outputText  value="#{profilePersonalizationBackingBean.managedBean.selectedUser.email}"/>&#160;
                  <h:graphicImage value="/css/images/design/tick.png" rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}"/>
               </td>
            </tr>
            <tr>
               <td style="width:25px;vertical-align:top;">
                  <p:graphicImage value="/css/images/design/icon-sms.png" title="#{lbl['lbl.pm.profiles.preferences.sms']}"/>
               </td>
               <td style="width:400px;">
                  <h:outputText style="white-space:normal;" value="#{not empty profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull 
                  ? profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull : '-'}" />&#160;
                  <h:graphicImage value="/css/images/design/tick.png" rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}"/>
               </td>
            </tr>
            <tr>
               <td style="width:25px;vertical-align:top;padding-top:3px;">
                  <p:graphicImage value="/css/images/design/icon-account-info.png" title="#{lbl['lbl.pm.profiles.authorisation.roles']}"/>
               </td>
               <td>
                  <table>
                     <tr>
                        <td style="width:345px;">
                        	<p:scrollPanel style="width:345px;height:#{profilePersonalizationBackingBean.managedBean.roleTableScrollHeight}px;padding: 0px !important;margin-top: 0px !important;" mode="native">
                        		<table style="width:100%;">
                        			<ui:repeat var="role" value="#{profilePersonalizationBackingBean.managedBean.rolesList}" varStatus="status">
										<tr>
											<td class="#{status.odd ? 'ui-datatable-odd' : 'ui-datatable-even'}">#{role}</td>
										</tr>
									</ui:repeat>
								</table>
                           </p:scrollPanel>
                        </td>
                     </tr>
                  </table>
               </td>
            </tr>
         </table>
         </div>
      </p:outputPanel>
   </ui:define>
</ui:composition>
