<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="true" escape="false"/>
		<ui:param name="orgName" value="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode ? 
					 			profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.companyName
					 			: profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgName}" />
		<ui:param name="mofExpDate" value="#{profilePersonalizationBackingBean.managedBean.mofExpDate}" />
		<ui:param name="softCertExpDate" value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate}" />					 			
		<p:outputPanel id="opUserCommonDet">
				<table class="ppTwoTable">				
				<tr>
					<td>
						<table>
							<tr>
								<td style="padding-left: 0px;width:5%;white-space:nowrap;vertical-align: top;">
									<h:outputText  value="#{lbl['lbl.pm.ucd.organization']}: " />  
								</td>
								<td>
									<h:outputText style="white-space:normal;" value="#{orgName}" /> 
								</td>
							</tr>
						</table>
					</td>
				</tr>
				
				<c:if test="#{profilePersonalizationBackingBean.mofExpiryShown}">	
					<tr>
						<td>
							<h:outputText value="#{lbl['lbl.pm.ucd.mof.exp']}: " />  
							<h:outputText value="#{not empty mofExpDate ? mofExpDate : '-'}">
								<f:convertDateTime rendered="#{not empty mofExpDate}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText>  
						</td>
					</tr>	
				</c:if>
				<c:if test="#{profilePersonalizationBackingBean.softCertExpiryShown}">
					<tr>
						<td>
							<h:outputText  value="#{lbl['lbl.pm.ucd.softcert.exp']}: " />
							<h:outputText value="#{not empty softCertExpDate ? softCertExpDate : '-'}" >
								<f:convertDateTime rendered="#{not empty softCertExpDate}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText>   
						</td>
					</tr>	
				</c:if>
				<tr>
				<td>
					<p:selectBooleanCheckbox id="itPreEmail" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}" 
						disabled="false" >
					<p:ajax event="change" update="@form"></p:ajax>		
					</p:selectBooleanCheckbox> 
					<h:outputText  value=" #{lbl['lbl.pm.ucd.email']}: "/>	
					<h:outputText  rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}"
					value="#{profilePersonalizationBackingBean.managedBean.selectedUser.email}"/>			
				</td>
			</tr>
			<tr>
				<td>
					<p:selectBooleanCheckbox id="itPreSms" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}" 
						disabled="false" >
					<p:ajax event="change" update="@form"></p:ajax>		
					</p:selectBooleanCheckbox>	
					<h:outputText   value=" #{lbl['lbl.pm.ucd.sms']}: "/>	
					<h:outputText	rendered="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}"
					value="#{profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull}"/>
				</td>				
			</tr>	
			<tr>
			    <td>
					<table>
							<tr>
								<td style="padding-left: 0px;width:5%;white-space:nowrap;vertical-align: top;"><h:outputText  value="#{lbl['lbl.pm.ucd.roles']}: " />  
								</td>
								<td><h:outputText style="white-space:normal;" escape="false" value="#{profilePersonalizationBackingBean.managedBean.roles}" /> 
								</td>
							</tr>
						</table>
					</td>
				</tr>			
				</table>
			</p:outputPanel>
	</ui:define>
</ui:composition>
