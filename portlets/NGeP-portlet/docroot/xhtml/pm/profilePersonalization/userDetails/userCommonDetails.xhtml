<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<ui:param name="orgName" value="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode ? 
					 			profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.companyName
					 			: profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgName}" />
		<p:panel header="#{lbl['lbl.pm.profiles.user.profile']}" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2">
			<p:outputPanel id="opUserCommonDet">
				<table class="ppTwoTable">
				<ui:remove>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.pm.profiles.navigation.org.code']}" />  
					</td>
					<td>
						<p:inputText id="itOrgCodeId" size="20"
							value="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode ? 
					 			profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.epNo
					 			: profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgCode}"
							disabled="true"/>
					</td>
				</tr>
				</ui:remove>
				<tr>
					<td width="20%">
						<p:outputLabel value="#{lbl['lbl.pm.ucd.organization']}" />  
					</td>
					<td>
						<p:inputTextarea id="itOrgNameId" 
							rows="#{profilePersonalizationBackingBean.numberOfLines(orgName, 20)}"
							cols="20"
							value="#{orgName}"
							disabled="true"/>
					 </td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.pm.ucd.roles']}" />  
					</td>
					<td>
						<p:inputTextarea id="itRolesId" 
							rows="#{profilePersonalizationBackingBean.numberOfLines(
								profilePersonalizationBackingBean.managedBean.roles, 20)}"
							cols="20"
							value="#{profilePersonalizationBackingBean.managedBean.roles}"
							disabled="true"/>
					</td>
				</tr>
				<c:if test="#{not empty profilePersonalizationBackingBean.managedBean.mofExpDate}">	
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.pm.ucd.mof.exp']}" />  
						</td>
						<td>
							<p:inputText id="itMofExpDate" size="20"
								value="#{profilePersonalizationBackingBean.managedBean.mofExpDate}"
								disabled="true">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText>
						</td>
					</tr>	
				</c:if>
				<c:if test="#{not empty profilePersonalizationBackingBean.managedBean.softCertExpDate}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.pm.ucd.softcert.exp']}" />  
						</td>
						<td>
							<p:inputText id="itSoftCertId" size="20"
								value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate}"
								disabled="true">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText>
						</td>
					</tr>	
				</c:if>
				
				<tr>
					<td colspan="2" style="float:left;">
						<p:outputLabel value="#{lbl['lbl.pm.ucd.notification']}" />  
					</td>
				</tr>	
				<tr>
				<th>
					<p:outputLabel value=" #{lbl['lbl.pm.ucd.email']}"/>				
				</th>
				<td>
					<p:selectBooleanCheckbox style="float:left" id="itPreEmail" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}" 
						disabled="true" /> 
					<p:inputText id="itEmail" disabled="true" size="20"
							value="#{profilePersonalizationBackingBean.managedBean.selectedUser.email}"/>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value=" #{lbl['lbl.pm.ucd.sms']}"/>	
				</th>
				<td>					
					<p:selectBooleanCheckbox style="float:left" id="itPreSms" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}" 
						disabled="true"/>					 
					<p:inputText id="itMobileNo" disabled="true" size="20"
							value="#{profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull}"/>
				</td>				
			</tr>				
				</table>
			</p:outputPanel>
		</h:panelGrid> 
    </p:panel>
	</ui:define>
</ui:composition>
