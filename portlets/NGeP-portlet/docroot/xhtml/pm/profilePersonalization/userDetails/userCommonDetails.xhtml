<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="true" escape="false"/>
		<ui:param name="orgName" value="#{ParameterConst.orgTypeSupplier eq profilePersonalizationBackingBean.managedBean.currentProfile.orgTypeCode.parameterCode ? 
					 			profilePersonalizationBackingBean.managedBean.currentProfile.smSupplier.companyName
					 			: profilePersonalizationBackingBean.managedBean.currentProfile.pmOrgValidity.orgName}" />	
		<p:outputPanel id="opUserCommonDet">
		     <table class="ppTwoTable">		
		     	<tr>
			   <td>		
				<table>
							<tr>
								<td style="padding-left: 0px;width:25px;">
									 <h:graphicImage value="/css/images/design/icon-organization.png" />
								</td>
								<td>
									<h:outputText style="white-space:normal;" value="#{orgName}" /> 
								</td>
							</tr>
						</table>
					</td>
		          </tr>
		     <c:if test="#{profilePersonalizationBackingBean.mofExpiryShown}">	
		         <tr>
		          <td>		
				  <table>
							<tr>
								<td style="padding-left: 0px;width:25px;">
									    <h:graphicImage value="/css/images/design/icon-account-info.png" />
								</td>
									<td style="padding-left: 0px;width:150px;">
									     <h:outputText value="#{lbl['lbl.pm.ucd.mof.exp']} " /> 
									</td>
								<td style="font-weight: bold;">
								       <h:outputText value=":" rendered="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null}"/>
								       <h:outputText value=": -" rendered="#{profilePersonalizationBackingBean.managedBean.mofExpDate == null}"/>
									 <h:outputText value="#{profilePersonalizationBackingBean.managedBean.mofExpDate}"
									    rendered="#{profilePersonalizationBackingBean.managedBean.mofExpDate != null}" >
						             <f:convertDateTime 
									     pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					                 </h:outputText>  
								</td>
							</tr>
						</table>
					</td>
		          </tr>
		       </c:if>
				<c:if test="#{profilePersonalizationBackingBean.softCertExpiryShown}">	
		          <tr>
		          <td>		
				  <table>
							<tr>
								<td style="padding-left: 0px;width:25px;">
									    <h:graphicImage value="/css/images/design/icon-account-info.png" />
								</td>
									<td style="padding-left: 0px;width:150px;">
									     <h:outputText  value="#{lbl['lbl.pm.ucd.softcert.exp']}" />
									</td>
								<td style="font-weight: bold;">
								       <h:outputText value=":" rendered="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null}"/>
								       <h:outputText value=": -" rendered="#{profilePersonalizationBackingBean.managedBean.softCertExpDate == null}"/>
									   <h:outputText value="#{profilePersonalizationBackingBean.managedBean.softCertExpDate}" 
									       rendered="#{profilePersonalizationBackingBean.managedBean.softCertExpDate != null}" >
						               <f:convertDateTime
									        pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					                 </h:outputText>   
								</td>
							</tr>
						</table>
					</td>
		          </tr>
		         </c:if>
		         <tr><td>  <hr style="border-top: 1px dotted black"/></td>
		         </tr>
		          <tr>
		          <td> <h:outputText value="#{lbl['lbl.pm.ucd.notification']}" style="font-weight: bold;"/> </td>
		          </tr>
		         
		            <tr>
		          <td>		
				  <table>
							<tr>
								<td style="padding-left: 0px;width:25px;">
									        <h:graphicImage value="/css/images/design/icon-sms.png" />
								</td>
									<td style="padding-left: 0px;width:265px;">
									        <h:outputText style="white-space:normal;" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.mobileFull}" /> 
									</td>
								    <td>
									       <p:selectBooleanCheckbox id="itPreSms" 
									          value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}" disabled="true" >							
					                      </p:selectBooleanCheckbox>	
								   </td>
							</tr>
						</table>
					</td>
		          </tr>
		          
		          <tr>
		          <td>		
				  <table>
							<tr>
								<td style="padding-left: 0px;width:25px;">
									           <h:graphicImage value="/css/images/design/icon-email.png" />
								</td>
									<td style="padding-left: 0px;width:265px;">
									    <h:outputText  value="#{profilePersonalizationBackingBean.managedBean.selectedUser.emailFull}"/>	
									</td>
								    <td>
									          <p:selectBooleanCheckbox id="itPreEmail" 
									               value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}"  disabled="true" >					
					</p:selectBooleanCheckbox> 
								   </td>
							</tr>
						</table>
					</td>
		          </tr>
		         <tr><td>  <hr style="border-top: 1px dotted black"/></td>
		         </tr>
		         <tr>
			    <td>
					<table>
							<tr>
								<td><h:outputText  value="#{lbl['lbl.pm.ucd.roles']}" style="font-weight: bold;height:10px;vertical-align:top;"/>  
						   </td>								  
							</tr>
							<tr>							
							<td><p:selectManyMenu label="#{lbl['lbl.pm.ucd.roles']}" 
										style="width: 302px;height:65px;color: dimgrey;" >										
										<f:selectItems  
											value="#{profilePersonalizationBackingBean.managedBean.rolesList}" >
										</f:selectItems>														
								</p:selectManyMenu></td>
							</tr>
						</table>
					</td>
				</tr>			
		         
		  </table>
		  </p:outputPanel>
	</ui:define>
</ui:composition>
