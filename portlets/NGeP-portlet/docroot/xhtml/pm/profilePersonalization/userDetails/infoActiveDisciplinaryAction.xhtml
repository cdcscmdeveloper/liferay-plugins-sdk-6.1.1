<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">

	<style>
		a {
			text-decoration: none;
			color: #009ae5;
		}
		
		textarea {
			width: 205px;
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			color: #000;
			line-height: 1.5em;
		}
		
		.myProfile-text {
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			color: #000;
			margin: 10px;
			word-wrap: break-word;
			padding: 3px;
		}
		
		.div-content-break-word {
			word-wrap: break-word;
		}
	</style>
	
		<p:blockUI block=":form" widgetVar="blockWidgetDA">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<table width="100%" border="0" cellspacing="0" cellpadding="0">
				<tr>
					<td colspan="2" valign="top" style="color:red; font-size:13px;">
						<h:outputText rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"
							value="#{profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"/>
						<!-- 38530 - START -->
						<h:form id="disciplinaryActionForm">
						<p:commandLink rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg and profilePersonalizationBackingBean.managedBean.smSupplier eq null}"			
							action="#{viewSuppProfileBackingBean.onViewDisciplinaryAction}" 
							update=":form" process="@this"
							onclick="blockWidgetDA.show()" onsuccess="blockWidgetDA.hide()">
								<h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" style="font-size:13px; text-decoration: underline; font-weight: bold; color:red;" />
						</p:commandLink>
						<p:commandLink rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg and profilePersonalizationBackingBean.managedBean.smSupplier ne null}"			
							action="#{viewSuppProfileBackingBean.onViewDisciplinaryActionSupp(profilePersonalizationBackingBean.managedBean.smSupplier)}" 
							update=":form" process="@this"
							onclick="blockWidgetDA.show()" onsuccess="blockWidgetDA.hide()">
								<h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" style="font-size:13px; text-decoration: underline; font-weight: bold; color:red;" />
						</p:commandLink>
						</h:form>
						<!-- 38530 - END -->
						<p:spacer width="2"/>
						
						<h:outputText rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"
							value="#{lbl['lbl.sm.supplier.to.view.disc.action.details']}"/>
						<ui:remove>26247 - start</ui:remove>
						<h:outputText rendered="#{not empty profilePersonalizationBackingBean.managedBean.qtDisciplinaryActionMsg}"
							value="#{profilePersonalizationBackingBean.managedBean.qtDisciplinaryActionMsg}" escape="false"/>
						<ui:remove>26247 - end</ui:remove>
					</td>
				</tr>
		</table>
		<!-- 30842 -->
		<ac:disciplinaryActionHistory voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}" 
		smSupplier="#{profilePersonalizationBackingBean.managedBean.smSupplier}" 
		mofView="#{viewSuppProfileBackingBean.managedBean.mofSupplier}"
		btnView="#{viewSuppProfileBackingBean.managedBean.disableDownloadButtonDAHistory}" />
		<!-- End 30842 -->
		
	</ui:define>
</ui:composition>
