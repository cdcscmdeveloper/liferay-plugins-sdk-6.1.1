<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">

	<style>
		a {
			text-decoration: none;
			color: #009ae5;
		}
		
		textarea {
			width: 205px;
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			color: #000;
			line-height: 1.5em;
		}
		
		.myProfile-title {
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			font-weight: bold;
			color: #000;
			margin: 10px;
		}
		
		.myProfile-text {
			font-family: Arial, Helvetica, sans-serif;
			font-size: 12px;
			color: #000;
			margin: 10px;
			word-wrap: break-word;
			padding: 3px;
		}
		
		.div-content-break-word {
			word-wrap: break-word;
		}
	</style>
	
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<table width="100%" border="0" cellspacing="0" cellpadding="0">
				<tr>
					<td colspan="2" valign="top" class="myProfile-title" style="color:red;">
						<h:outputText rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"
							value="#{profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"/>
						
						<p:commandLink rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"			
							action="#{viewSuppProfileBackingBean.onViewDisciplinaryAction}" 
							update=":form" process="@this"
							onclick="blockWidget.show()" onsuccess="blockWidget.hide()">
								<u><h:outputText value="#{lbl['lbl.sm.disciplinary.here']}" styleClass="warning" /></u>
						</p:commandLink><p:spacer width="2"/>
						
						<h:outputText rendered="#{not empty profilePersonalizationBackingBean.managedBean.disciplinaryActionMsg}"
							value="#{lbl['lbl.sm.supplier.to.view.disc.action.details']}"/>
					</td>
				</tr>
		</table>
		<ac:disciplinaryActionHistory voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}" mofView="#{viewSuppProfileBackingBean.managedBean.mofSupplier}"/>
		
	</ui:define>
</ui:composition>
