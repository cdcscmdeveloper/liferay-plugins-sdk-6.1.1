<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="pChangeChallengeQuestion" header="#{lbl['lbl.pm.profiles.ccq.changecq']}"  toggleable="true">
		<table class="ppTwoTable" style="width:90%">
			<tr>
				<td width="15%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.ccq.cp']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
			    <td width="35%">
			    	<p:password id="ccqCurrentPassword"  styleClass="ppDisplayTextM" 
						label="#{lbl['lbl.pm.profiles.ccq.cp']}" feedback="false" maxlength="20" style="margin-bottom: 10px;"
						value="#{profilePersonalizationBackingBean.managedBean.currentPassword}" >
					</p:password>
			    </td>
			    <td width="15%">
				</td>
			    <td width="35%">
			    </td>
			    </tr>
			<c:forEach items="#{profilePersonalizationBackingBean.managedBean.challengeQAList}" var="qa" varStatus="varStatus">
			<tr>
				<td width="15%">
					<p:outputLabel value="#{profilePersonalizationBackingBean.getChallengeQuestionsLabel(varStatus.index)}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td width="35%">	
			   		<p:selectOneMenu styleClass="ppDropDownWidthL" id="somChallengeQA#{varStatus.index}_name"
          				label="#{profilePersonalizationBackingBean.getChallengeQuestionsLabel(varStatus.index)}"
          				value="#{qa.question}">
          				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />  
	            		<f:selectItems value="#{profilePersonalizationBackingBean.managedBean.challengeQADDList}" />    
                  	</p:selectOneMenu>
			    </td>
			    <td width="15%">
					<p:outputLabel value="#{profilePersonalizationBackingBean.getChallengeAnswersLabel(varStatus.index)}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
			    <td width="35%">
			    	<p:inputText id="inputChallengeAnswer#{varStatus.index}_name" value="#{qa.answer}"  styleClass="ppDisplayTextM" >			    	
			    	</p:inputText>
			    </td>
			    </tr>
			</c:forEach>
			<tr>
				<td>					
				</td>
				<td>					
				</td>
				<td>
				</td>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.submit']}" update="pChangeChallengeQuestion"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
						action="#{profilePersonalizationBackingBean.changeChallengeQuestions}"
	    				/>
					&#160;
					<p:commandButton value="#{lbl['lbl.btn.clear']}" immediate="true" update="pChangeChallengeQuestion"
						action="#{profilePersonalizationBackingBean.clearChallengeQuestions}"
		    		 />
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
