<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="USER PREFERENCE">
	 <br/>
		<h:panelGrid columns="2">

		        <h:outputLabel value="#{lbl['lbl.pm.profiles.preferences.language']}"></h:outputLabel>
               <p:columnGroup> 		        
		          <p:selectOneMenu style="width:178px;margin-bottom:5px;">  
            		<f:selectItem itemLabel="English" itemValue="1" />  
            		<f:selectItem itemLabel="Bahasa Malaysia" itemValue="2" />  
                  </p:selectOneMenu>
                 <h:outputLink id="lang" value="#">&#160;&#160;   
                 <p:graphicImage library="ep/images/design" name="tooltips.png"
                   value="/resources/ep/images/design/tooltips.png" />
                 </h:outputLink>
				<p:tooltip for="lang" value="Fade effect is used by default" showEffect="fade" hideEffect="fade" />                                                   
               </p:columnGroup>                 	          
                 
                <h:outputLabel value="#{lbl['lbl.pm.profiles.preferences.notificationremoval']}" />
                <p:columnGroup>                
                 <p:inputText value="0" size="5" />&#160; 
                 <h:commandButton value="Days" style="width:62px" />
                 <h:outputLink id="fade" value="#">&#160;&#160;   
                 <p:graphicImage library="ep/images/design" name="tooltips.png"
                   value="/resources/ep/images/design/tooltips.png" /> 
                 </h:outputLink> 
				<p:tooltip for="fade" value="Fade effect is used by default" showEffect="fade" hideEffect="fade" />                                                                                 
			    </p:columnGroup>    	        
	     </h:panelGrid>  		
	</p:panel>
	<p:panel>
	 <br/>
	    <p:dataTable value="#{profilePersonalizationManagedBean.preferencelists}" var="PreferenceList" >

	    <p:column headerText="#{lbl['lbl.pm.profiles.preferences.preferred']}" > 
	      <p:selectBooleanCheckbox/> 
        </p:column> 		
	    <p:column headerText="#{lbl['lbl.pm.profiles.preferences.notificationmode']}" > 
          <h:outputText value="#{PreferenceList.noticeMode}" />
        </p:column>            
	</p:dataTable>
	       		
	</p:panel>
	
</ui:composition>
