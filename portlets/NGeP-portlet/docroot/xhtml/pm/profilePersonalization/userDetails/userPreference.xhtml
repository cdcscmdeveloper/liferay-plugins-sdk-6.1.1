<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!-- Preferred Language & Notification Days -->
	<p:panel header="#{lbl['lbl.pm.profiles.preferences']}" toggleable="true">
	 <br/>
		<table class="ppTwoTable" style="width:50%">
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.preferences.language']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>	        
          			<p:selectOneMenu styleClass="ppDropDownWidthM"  value="#{profilePersonalizationBackingBean.managedBean.selectedUser.pmUserPreference.preferredLanguage}">
          				<!-- <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> -->  
	            		<f:selectItems value="#{profilePersonalizationBackingBean.getLanguageList()}" 
	            			var="language" itemLabel="#{language.languageName}" itemValue="#{language.languageCode}" />    
                  	</p:selectOneMenu>
	              	&#160;&#160;   
	                <p:graphicImage id="giLang" library="ep/images/design" name="tooltips.png"
		                   value="/resources/ep/images/design/tooltips.png" />
					<p:tooltip for="giLang" value="#{lbl['lbl.pm.profiles.preferences.notification.tooltip']}" showEffect="fade" hideEffect="fade" />                                                        
				</td>
			</tr>
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.preferences.notificationremoval']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:inputText value="#{profilePersonalizationBackingBean.managedBean.selectedUser.pmUserPreference.notifyRemovalDay}" size="5" />&#160;
					<h:outputText value="#{lbl['lbl.pm.profiles.preferences.notification.day']}" />&#160;
                	<p:graphicImage id="giDay" library="ep/images/design" name="tooltips.png"
								value="/resources/ep/images/design/tooltips.png" />
					<p:tooltip for="giDay" value="#{lbl['lbl.pm.profiles.preferences.notificationremoval.tooltip']}" showEffect="fade" hideEffect="fade" />
				</td>
			</tr>
		</table>
	</p:panel>
	<!-- Notification List -->
	<p:panel>
		<br/>
    	<p:dataTable value="#{profilePersonalizationBackingBean.managedBean.selectedUser.pmUserNotifications}" var="preference" >
 			<p:column headerText="#{lbl['lbl.pm.profiles.preferences.preferred']}" > 
   				<p:selectBooleanCheckbox value="#{preference.preferred}" /> 
    		</p:column> 		
	    	<p:column headerText="#{lbl['lbl.pm.profiles.preferences.notificationmode']}" > 
          		#{profilePersonalizationBackingBean.getParameterDesc(ParameterTypeConst.notificationType, preference.notifyMode)}
        	</p:column>            
		</p:dataTable>
	</p:panel>
</ui:composition>
