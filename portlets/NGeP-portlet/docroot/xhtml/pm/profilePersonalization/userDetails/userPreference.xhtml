<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!-- Preferred Language & Notification Days -->
	<p:panel id="pUserPreference" header="#{lbl['lbl.pm.profiles.preferences']}" toggleable="true">	
		<table class="ppTwoTable" style="width:50%">
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.preferences.language']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>	        
          			<p:selectOneMenu styleClass="ppDropDownWidthM" required="#{!empty param['disableValidation']}" id="somPreLanguage"
          				label="#{lbl['lbl.pm.profiles.preferences.language']}" valueChangeListener="#{profilePersonalizationBackingBean.languageChangeListener}"
          				value="#{profilePersonalizationBackingBean.managedBean.selectedUser.preferredLanguage}">
          				<!-- <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> -->  
	            		<f:selectItems value="#{profilePersonalizationBackingBean.getLanguageList()}" 
	            			var="language" itemLabel="#{language.languageName}" itemValue="#{language.languageCode}" />    
                  	</p:selectOneMenu>
	              	&#160;&#160;   
	                <p:graphicImage id="giLang"
		                   value="/css/images/design/tooltips.png" />
					<p:tooltip for="giLang" value="#{lbl['lbl.pm.profiles.preferences.notification.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="somPreLanguageMsg" for="somPreLanguage" display="icon" />                                                                
				</td>
			</tr>	
			<tr>
				<th width="40%">
					<p:outputLabel value=" #{lbl['lbl.pm.profiles.preferred.notification']}"/>				
				</th>
				<td>
					<p:selectBooleanCheckbox style="float:left" id="itPreEmail" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}" valueChangeListener="#{profilePersonalizationBackingBean.notifyChangeListener}" /> 
					<p:outputLabel style="float:left;margin-left:10px;font-weight:normal;" value="#{lbl['lbl.pm.profiles.userdetails.email']}"/>						
					<p:graphicImage id="giPreEmail" value="/css/images/design/tooltips.png" /> 
					<p:tooltip for="giPreEmail" value="#{lbl['lbl.pm.profiles.preferences.nofificationemail.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itPreEmailMsg" for="itPreEmail" display="icon" />
				</td>
			</tr>
			<tr>
				<th width="40%">
									
				</th>
				<td>					
					<p:selectBooleanCheckbox style="float:left" id="itPreSms" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyBySms}" >
						 <p:ajax update="@this,itPreSmsMsg,messages" listener="#{profilePersonalizationBackingBean.notifySmsChangeListener}" />
					</p:selectBooleanCheckbox>
					<p:outputLabel style="float:left;margin-left:10px;font-weight:normal;" value="#{lbl['lbl.pm.profiles.preferences.sms']}"/> 
					<p:graphicImage id="giPreSms" value="/css/images/design/tooltips.png" /> 
					<p:tooltip for="giPreSms" value="#{lbl['lbl.pm.profiles.preferences.nofificationsms.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itPreSmsMsg" for="itPreSms" display="icon" />
				</td>				
			</tr>
			<tr>
			<td colspan="2">
				<h:outputText styleClass="instruction" value="#{lbl['lbl.pm.profiles.preferences.nofification.note']}" />
			</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
