<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!-- Preferred Language & Notification Days -->
	<p:panel header="#{lbl['lbl.pm.profiles.preferences']}" toggleable="true">
	 <br/>
		<table class="ppTwoTable" style="width:50%">
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.preferences.language']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>	        
          			<p:selectOneMenu styleClass="ppDropDownWidthM" required="#{!empty param['disableValidation']}" id="somPreLanguage"
          				label="#{lbl['lbl.pm.profiles.preferences.language']}"
          				value="#{profilePersonalizationBackingBean.managedBean.selectedUser.preferredLanguage}">
          				<!-- <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> -->  
	            		<f:selectItems value="#{profilePersonalizationBackingBean.getLanguageList()}" 
	            			var="language" itemLabel="#{language.languageName}" itemValue="#{language.languageCode}" />    
                  	</p:selectOneMenu>
	              	&#160;&#160;   
	                <p:graphicImage id="giLang"
		                   value="/css/images/design/tooltips.png" />
					<p:tooltip for="giLang" value="#{lbl['lbl.pm.profiles.preferences.notification.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="somPreLanguageMsg" for="somPreLanguage" display="icon" />                                                                
				</td>
			</tr>
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.preferences.notificationremoval']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:inputText id="itPreNotifyDay" required="#{!empty param['disableValidation']}"
						value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyRemovalDay}"
						label="#{lbl['lbl.pm.profiles.preferences.notificationremoval']}" 
						size="5" maxlength="2">
						<f:validateLongRange minimum="1"  disabled="#{empty param['disableValidation']}"/>
					</p:inputText>
					&#160;
					<h:outputText value="#{lbl['lbl.pm.profiles.preferences.notification.day']}" />&#160;
                	<p:graphicImage id="giDay" 
								value="/css/images/design/tooltips.png" />
					<p:tooltip for="giDay" value="#{lbl['lbl.pm.profiles.preferences.notificationremoval.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itPreNotifyDayMsg" for="itPreNotifyDay" display="icon" />
				</td>
			</tr>
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.preferences.preferred']} #{lbl['lbl.pm.profiles.userdetails.email']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectBooleanCheckbox id="itPreEmail" value="#{profilePersonalizationBackingBean.managedBean.selectedUser.notifyByEmail}" /> 
					<p:graphicImage id="giPreEmail" value="/css/images/design/tooltips.png" /> 
					<p:tooltip for="giPreEmail" value="#{lbl['lbl.pm.profiles.preferences.nofificationemail.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itPreEmailMsg" for="itPreEmail" display="icon" />
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
