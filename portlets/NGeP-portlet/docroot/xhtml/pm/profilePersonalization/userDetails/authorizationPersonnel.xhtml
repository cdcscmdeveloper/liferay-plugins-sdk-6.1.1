<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


    <p:panel id="pAdminResult" header="#{lbl['lbl.pm.user.result']}" toggleable="true">
    <table style="width:100%;"><tr><TD style="text-align:right;">
    <p:commandButton
				value="#{lbl['lbl.btn.reset']}"
				action="#{profilePersonalizationBackingBean.searchAdminProfile}"
				partialSubmit="true">
			</p:commandButton>
			</TD></tr></table>
	<p:dataTable id="dtAdminResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			rowIndexVar="rowIndex"  lazy="true" rows="10" var="adminProfile"
			value="#{profilePersonalizationBackingBean.managedBean.adminDetReceivedList}">
			<!--<ac:paginator for="dtAdminResult" />  -->
			<p:column headerText="#{lbl['lbl.pm.profiles.search.result.username']}" style="width :25%;white-space : normal">			
				<h:outputText value="#{adminProfile.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.idno']}" style="width :10%;white-space : normal">
			    <h:outputText value="#{adminProfile.identificationNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}" style="width :20%;white-space : normal">
			    <h:outputText value="#{adminProfile.email}" /> 
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.email']}" style="width :10%;white-space : normal">
				 <h:outputText value="#{adminProfile.role}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.telno']}" style="width :10%;white-space : normal">
				 <h:outputText value="#{adminProfile.phoneNo}" />
			</p:column>
			</p:dataTable>
			</p:panel>
</ui:composition>
