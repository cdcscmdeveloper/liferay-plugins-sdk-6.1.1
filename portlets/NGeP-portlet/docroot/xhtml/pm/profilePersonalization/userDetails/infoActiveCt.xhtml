<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<style>
	.notifyCtCss {
		font-family: Arial, Helvetica, sans-serif;
		font-size: 12px;
		font-weight: bold;
		color: #0000FF;
		vertical-align: middle;
		background-color: #CCE6FF;
		border: 1px solid #BADDFF;
		border-bottom-left-radius: 4px;
		border-bottom-right-radius: 4px;
		border-top-left-radius: 4px;
		border-top-right-radius: 4px;
		height: auto;
	}
	
	.notifyCtCssAlign {
		margin: 10px;
	}
	</style>

	<div class="notifyCtCss">
		<div class="notifyCtCssAlign">
			<h:outputText
				rendered="#{not empty profilePersonalizationBackingBean.managedBean.ctSupplierMsgNonDA}"
				value="#{profilePersonalizationBackingBean.managedBean.ctSupplierMsgNonDA}" />
		</div>
	</div>
</ui:composition>
