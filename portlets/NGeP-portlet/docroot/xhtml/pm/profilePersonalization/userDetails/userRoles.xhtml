<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="#{lbl['lbl.pm.profiles.authorisation.roles']}" toggleable="true">
		  	<p:dataTable id="dtRoles" var="role" styleClass="dtRoles"
		  		 emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
			     value="#{profilePersonalizationBackingBean.managedBean.userActiveRoles}"
			     rowIndexVar="index" rowKey="#{role}">   
			    <ac:paginator for="dtRoles"/>
			    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}" >
		          	#{profilePersonalizationBackingBean.getRoleDescByRoleCode(role.pmRole.roleCode)}
		        </p:column>
			</p:dataTable>   		
	    </p:panel>

</ui:composition>
