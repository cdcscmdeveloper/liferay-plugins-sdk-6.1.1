<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:dialog id="dlImageUpload" header="#{lbl['lbl.pm.profiles.userdetails.upload.image']}" 
		widgetVar="dlImageUpload" dynamic="true" width="500" height="300">
		<p:outputPanel id="opImageUpload">
			<p:fileUpload id="fuPortrait" 
							 	fileUploadListener="#{profilePersonalizationBackingBean.handleFileUpload}" mode="advance" 
            					sizeLimit="1000000" allowTypes="/(\.|\/)(png)$/" multiple="false"
            					invalidFileMessage="Only PNG file is accepted" 
            					fileLimit="1" dragDropSupport="false" uploadLabel="#{lbl['lbl.btn.confirm']}" label="#{lbl['lbl.btn.browse']}"/>
		
			
			<div style="height:200px; text-align:right;">
				<div style="bottom:0">
					<p:commandButton value="#{lbl['lbl.btn.ok']}" oncomplete="dlImageUpload.hide();" />	
					<p:commandButton value="#{lbl['lbl.btn.close']}" oncomplete="dlImageUpload.hide();" />		
				</div>
			</div>    
		</p:outputPanel>
	</p:dialog>
</ui:composition>
