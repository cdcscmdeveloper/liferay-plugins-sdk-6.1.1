<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="cityPanel" header="#{lbl['lbl.pm.city.search']}" toggleable="true" >

		<table class="ppTwoTable">
			<tr>
				<td width="16%"><p:outputLabel
						value="#{lbl['lbl.pm.city.state']}"></p:outputLabel></td>
				<td width="35%"><p:selectOneMenu
						label="#{lbl['lbl.pm.district.state']}" id="stateCode"
						value="#{cityBackingBean.managedBean.citySearchBean.stateCode}"
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems value="#{cityBackingBean.getListOfStates()}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{cityBackingBean.changeStateSelection()}"
							update="@form" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.city.division']}"></p:outputLabel></td>
				<td width="19%"><p:inputText id="divisionId" disabled="#{!cityBackingBean.managedBean.adoptDivision}"
						value="#{cityBackingBean.managedBean.citySearchBean.divisionName}"
						size="44" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
				
			</tr>			
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.city.district']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{cityBackingBean.managedBean.citySearchBean.districtName}"
						id="districtId" size="44" /></td>			
			</tr>
			<tr>	
				<td width="1%"><p:outputLabel value="#{lbl['lbl.pm.city.or.town']}"></p:outputLabel></td>
				<td width="17%"><p:inputText id="cityId"
						value="#{cityBackingBean.managedBean.citySearchBean.cityName}"
						size="44" /></td>			
				
			</tr>		
		
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{cityBackingBean.searchCity}"
							update=":form:cityResult" />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{cityBackingBean.resetCitySearchBean}"
							process="@this"
							update=":form:cityPanel, :form:cityResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
