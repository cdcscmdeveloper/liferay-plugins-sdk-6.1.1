<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="cityResult" header="#{lbl['lbl.pm.city.search']}"
		toggleable="true">
		<p:dataTable id="city"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{cityBackingBean.searchCity}" rows="10"
			var="cityList" rowIndexVar="index" lazy="true">
			<ac:paginator for="city" />
			
			<p:column headerText="#{lbl['lbl.pm.state.seq.no']}" style="width:5%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.city.stateName']}" style="width:10%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{cityList.pmDistrict.pmState.stateName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.city.districtName']}" style="width:30%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{cityList.pmDistrict.districtName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.pm.city.or.town.code']}" style="width:30%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{cityList.cityCode}" />				
			</p:column>
            <p:column headerText="#{lbl['lbl.pm.city.or.town.name']}" style="width:30%;white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{cityList.cityName}" />				
			</p:column>
		</p:dataTable>
	</p:panel>	
</ui:composition>
