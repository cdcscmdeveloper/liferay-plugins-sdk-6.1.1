<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:messages id="messages" showDetail="true" showSummary="false"
		autoUpdate="true" closable="true" severity="error,info"></p:messages>

	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<!-- 34445 start -->
					<p:commandButton value="#{lbl['lbl.btn.update']}" style="float:right;" oncomplete="if (!args.validationFailed) updateInfoDlg.show();" />
					<!-- 34445 end -->
				</div>
			</td>
		</tr>
	</table>

	<!-- 34445 start -->
	<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
		okAction="authorizedsignatoryBackingBean.saveCertSignatoryDetials"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.update.msg']}"
		update=":form"/>
	<!-- 34445 end -->
</ui:composition>
