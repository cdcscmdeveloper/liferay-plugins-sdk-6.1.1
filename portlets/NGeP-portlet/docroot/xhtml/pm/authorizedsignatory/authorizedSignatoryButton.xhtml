<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:messages id="messages" showDetail="true" showSummary="false"
		autoUpdate="true" closable="true" severity="error,info"></p:messages>

	<table style="width: 100%">
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.update']}" update="@form"
						action="#{authorizedsignatoryBackingBean.saveCertSignatoryDetials()}"
						style="float:right;" />
				</div>
			</td>
		</tr>
		<!-- # 2020/09/10 - 28740 - start -->	
		<tr>
			<td>
				<div align="right" style="width: 100%">
					<p:commandLink id="authSignatoryTrack" value="#{lbl['lbl.td.doc.trackingDiary']}"
						disabled="#{authorizedsignatoryBackingBean.managedBean.zone.zoneId==null}"
						style="float:right;"
						immediate="true"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.virtualCertificateParamCode, authorizedsignatoryBackingBean.managedBean.zone.zoneId)}"/>
				</div>
			</td>
		</tr>
		<!-- # 2020/09/10 - 28740 - End -->	
	</table>

</ui:composition>
