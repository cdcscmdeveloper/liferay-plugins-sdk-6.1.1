<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel>

		<h:panelGrid columns="2" >

			<h:outputLabel value="#{lbl['lbl.pm.profiles.search.name']}"></h:outputLabel>
			<p:inputText value="#{userprofilesBackingBean.managedBean.userNames}" size="30" />
	
	        <h:outputLabel value="#{lbl['lbl.pm.profiles.search.role']}"></h:outputLabel>
            <p:inputText value="#{userprofilesBackingBean.managedBean.userRole}" size="30" />
			
			<h:outputLabel value="#{lbl['lbl.pm.profiles.search.orgname']}"></h:outputLabel>
			<p:inputText value="#{userprofilesBackingBean.managedBean.userorganizationNames}" size="30" />
		
		    <h:outputLabel value="#{lbl['lbl.pm.profiles.search.status']}"></h:outputLabel>
		       <p:selectOneMenu style="width:203px">  
            	<f:selectItem itemLabel="Select One" itemValue="" />  
            	<f:selectItem itemLabel="Active" itemValue="1" /> 
            	<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              </p:selectOneMenu> 
			
		</h:panelGrid>
 </p:panel>
</ui:composition>
