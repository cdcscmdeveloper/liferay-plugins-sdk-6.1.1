<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.pm.profiles.cp.resetpass']}"  id="userChangePasswordPanel" toggleable="true">
		<table>
			<tr>
				<td>
					<h:outputText styleClass="instruction" value="#{lbl['lbl.pm.profiles.reset.pwd.msg']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:commandButton 
					disabled ="#{not profileManagementBackingBean.managedBean.activeUser}" 
					value="#{lbl['lbl.pm.profiles.resend.notification']}" immediate="true"
		    				action="#{profileManagementBackingBean.resendNotification}"/>		    		
				</td>
			</tr>
			<tr>
				<td>
					<p:spacer width="65px"/>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
