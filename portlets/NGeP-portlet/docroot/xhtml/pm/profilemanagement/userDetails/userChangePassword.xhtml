<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.pm.profiles.tab.name.cp']}"  toggleable="true">
		<table class="ppTwoTable" style="width:50%">
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.cp.oldpass']}" />
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" 
						value="#{profileManagementBackingBean.managedBean.selectedUser.oldPassword}"/>
				</td>
			</tr>
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.cp.newpass']}" />
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" 
						value="#{profileManagementBackingBean.managedBean.selectedUser.password}"/>
				</td>
			</tr>
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.cp.confpass']}" />
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" 
						value="#{profileManagementBackingBean.managedBean.selectedUser.confirmPassword}"/>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
