<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
        
	<p:panel id="pChangePwd" header="#{lbl['lbl.pm.profiles.tab.name.cp']}"  toggleable="true">
		<table class="ppTwoTable" style="width:50%">
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.cp.newpass']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:password id="pwdNew"  match="pwdConfirm" styleClass="ppDisplayTextM" 
						label="#{lbl['lbl.pm.profiles.cp.newpass']}" feedback="false" maxlength="20"
						value="#{profileManagementBackingBean.managedBean.selectedUser.password}" 
						validatorMessage="#{lbl['lbl.pm.profiles.cp.newpass']} - #{lbl['lbl.pm.profiles.invalidPassword']}">
						<f:validateLength minimum="8" maximum="20"/>
					</p:password>
				</td>
			</tr>
			<tr>
				<th width="40%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.cp.confpass']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:password  id="pwdConfirm" styleClass="ppDisplayTextM" 
						label="#{lbl['lbl.pm.profiles.cp.confpass']}" feedback="false" maxlength="20"
						value="#{profileManagementBackingBean.managedBean.selectedUser.confirmPassword}"/>
				</td>
			</tr>
			<tr>
				<th width="40%">
					
				</th>
				<td>
					<p:commandButton value="#{lbl['lbl.btn.submit']}" update="pChangePwd"
						onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
						action="#{profileManagementBackingBean.changePassword}"
	    				/>
					&#160;
					<p:commandButton value="#{lbl['lbl.btn.clear']}" immediate="true" update="pChangePwd"
						action="#{profileManagementBackingBean.clearPassword}"
		    		 />
				</td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.pm.profiles.cp.resetpass']}"  toggleable="true">
		<table>
			<tr>
				<td>
					<h:outputText styleClass="instruction" value="#{lbl['lbl.pm.profiles.reset.pwd.msg']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:commandButton value="#{lbl['lbl.pm.profiles.resend.notification']}" immediate="true"
		    				action="#{profileManagementBackingBean.resendNotification}"/>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
