<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="pRoleReceivingAddr" styleClass="receivingAddUpdate">
		<p:tabView widgetVar="tvRoleReceivingAddr" id="tvRoleReceivingAddr"
			dynamic="false" cache="false" orientation="top"
			activeIndex="#{profileManagementBackingBean.managedBean.roleTabActiveIndex}">
			<!-- Roles -->
			<p:tab title="#{lbl['lbl.pm.profiles.authorisation.roles']}"
				id="dtRoleTabId">
				<p:dataTable id="dtRoles" var="role" styleClass="dtRoles" rows="10"
					emptyMessage="#{lbl['lbl.pp.no.record.found']}"
					value="#{profileManagementBackingBean.managedBean.selectedUserOrg.pmUserRoles}"
					rowIndexVar="index" rowKey="#{role}">
					<ac:paginator for="dtRoles" />					
					
					<p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}"
						width="20%">
			          	#{profileManagementBackingBean.getRoleDescByRoleCode(role.pmRole.roleCode)}
			        </p:column>
					<p:column
						headerText="#{lbl['lbl.pm.profiles.authorisation.apprlimit']}"
						width="15%">
						<p:inputText id="itAppLimit" styleClass="ppDisplayTextS" style="text-align:right"
							value="#{role.approvalLimit}"
							required="#{!empty param['disableValidation']} and role.pmRole.limitRequired and role.recordStatusFlg eq 1}"
							label="#{lbl['lbl.pm.profiles.authorisation.apprlimit']}"
							disabled="#{!role.pmRole.limitRequired}" maxlength="17">	
							<f:validator validatorId="quantityDoubleRangeValidator" />
							<f:validateDoubleRange minimum="1" />
							<f:validateDoubleRange maximum="99999999999.99" />
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							<p:ajax event="blur" process="@this" update="@this" />
						</p:inputText>
						<p:message id="itAppLimitMsg" for="itAppLimit" display="icon" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.pm.profiles.authorisation.letterno']}"
						width="25%">

						<p:inputText id="auLetterNo" styleClass="ppDisplayTextS"
							value="#{role.letterNo}"
							required="#{role.pmRole.roleCode eq 'FL_APPROVER' and role.recordStatusFlg eq 1}"
							label="#{lbl['lbl.pm.profiles.authorisation.letterno']}"
							disabled="#{!(role.pmRole.roleCode eq 'FL_APPROVER')}"
							maxlength="50">
							<p:ajax event="change" process="@this" />
						</p:inputText>
						<p:message id="auLetterNoMsg" for="auLetterNo" display="icon" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.pm.profiles.authorisation.Status']}"
						width="8%">

						<p:selectOneMenu value="#{role.recordStatusFlg}"
							disabled="#{ProfileManagementConst.roleGovtSeller eq role.pmRole.roleCode or role.brandNew or profileManagementBackingBean.managedBean.selectedUserOrg.recordStatusFlg == 0 or profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg == 0 or isSupplierOrgType}">
							<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
							<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
							<p:ajax event="change" 
								listener="#{profileManagementBackingBean.userRoleStatusChange(role)}"
								process="@this"
								update=":form:tvRoleReceivingAddr" />
						</p:selectOneMenu>
					</p:column>
					<p:column style="width:5%;text-align:center;">
						<f:facet name="header">				
							<h:outputText value="#{lbl['lbl.pm.action']}" />
						</f:facet>
						<p:commandLink partialSubmit="true"
							process="@this"
							disabled="#{!(role.brandNew)}"
							action="#{profileManagementBackingBean.deleteUserRole(index)}"
							update=":form:tvRoleReceivingAddr">
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
						</p:commandLink>			
					</p:column>
				</p:dataTable>				
				<div class="ppRightBtn">
					<p:commandButton
						action="#{profileManagementBackingBean.getAvailbleUserRole}"
						immediate="true" value="#{lbl['lbl.btn.add']}"
						disabled="#{profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg == 0 or isSupplierOrgType}"
						oncomplete="dlRoleOptions.show();" update=":form:opRoleOptions" />
				</div>
			</p:tab>


			<!-- Receiving Address -->
			<p:tab
				title="#{lbl['lbl.pm.profiles.authorisation.receiving.address']}"
				id="tReceivingAddr"
				disabled="#{!profileManagementBackingBean.managedBean.receivingAddressFlag}">
				<p:dataTable id="dtReceiveAddr"
					value="#{profileManagementBackingBean.managedBean.selectedReceivingAddrTypes}"					
					emptyMessage="#{lbl['lbl.pp.no.record.found']}"
					var="receivAddrType" rowIndexVar="rAindex" rowKey="#{receivAddrType}">
					<ac:paginator for="dtReceiveAddr" />
					<p:column style="white-space: normal!important;width:80%"
						headerText="#{lbl['lbl.pm.profiles.authorisation.addname']}"> 
				    	#{profileManagementBackingBean.getFullAddress(receivAddrType.pmAddress)}
			        </p:column>
					<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.status']}" style="width:15%">

						<p:selectOneMenu value="#{receivAddrType.recordStatusFlg}"
							disabled="#{receivAddrType.brandNew or profileManagementBackingBean.managedBean.selectedUserOrg.recordStatusFlg == 0 or profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg == 0}">
							<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
							<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
							<p:ajax event="change"
								listener="#{profileManagementBackingBean.receivAddStatusChange(receivAddrType)}"
								partialSubmit="true" process="@this"
								update="@this, :form:pUserProfileHeader, :form:tvRoleReceivingAddr" />
						</p:selectOneMenu>
					</p:column>
					<p:column style="width:5%;text-align:center;">
						<f:facet name="header">				
							<h:outputText value="#{lbl['lbl.pm.action']}" />
						</f:facet>
						<p:commandLink partialSubmit="true"
							process="@this"
							disabled="#{!(receivAddrType.brandNew)}"
							action="#{profileManagementBackingBean.deleteUserReceivingAddr(rAindex)}"
							update=":form:tvRoleReceivingAddr">
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
						</p:commandLink>			
					</p:column>
					
				</p:dataTable>
				<div class="ppRightBtn">
					<div style="float: right">
						<!-- Receiving Address Selection Popup -->
						<ac:lov id="lovAddrType" lovId="PM_ADDRESS_TYPE"
							styleClass="ppDisplayCalS" readonly="true"
							disabled="#{profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg == 0 or (not profileManagementBackingBean.checkActiveReceivingOfficerExist())}"
							selectionMode="multiple" buttonLabel="#{lbl['lbl.btn.add']}"
							headerText="#{lbl['lbl.pm.profiles.authorisation.select.address']}"
							update=":form:tvRoleReceivingAddr:dtReceiveAddr"
							saveObject="profileManagementBackingBean.managedBean.selectedDeliveringAddrTypes"
							postUpdateListener="profileManagementBackingBean.updateReceivingAddr"
							conditionField="pmOrgProfile.orgTypeCode.parameterId^#{profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterId}|pmOrgProfile.orgProfileId^#{profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgProfileId}|addressType^D|recordStatus^1" />
					</div>

				</div>
				<br/>
				
			</p:tab>
		</p:tabView>
		<ac:lovPopup />
	</p:outputPanel>

	<!-- Role Selection Popup -->
	<ui:include src="/xhtml/pm/profilemanagement/common/rolePopUp.xhtml" />


</ui:composition>
