<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<table style="border:0; cellspacing:0; cellpadding:0; width:100%;">
		  <tr>
			<td width="20%" valign="top" class="sidemenutd">
				<p:tabMenu styleClass="sidemenu" id="tUserDetails"
					activeIndex="#{profileManagementBackingBean.managedBean.selectedTabIndex}">
					
					<!-- User Profile -->
                    <p:menuitem value="#{lbl['lbl.pm.profiles.tab.name.up']}" update="@form">
                    	<f:param name="disableValidation" value="" />     
						<f:setPropertyActionListener target="#{profileManagementBackingBean.managedBean.selectedTabIndex}" 
							value="#{profileManagementBackingBean.tabUserProfile}" />
					</p:menuitem>
					<!-- Authorization -->
					<p:menuitem value="#{lbl['lbl.pm.profiles.tab.name.au']}" update="@form">
						<f:param name="disableValidation" value="" />    
						<f:setPropertyActionListener target="#{profileManagementBackingBean.managedBean.selectedTabIndex}" 
							value="#{profileManagementBackingBean.tabAuthorization}" />
					</p:menuitem>
					<!-- Personalization -->	
					<p:menuitem value="#{lbl['lbl.pm.profiles.tab.name.pl']}" update="@form">
						<f:param name="disableValidation" value="" />   
						<f:setPropertyActionListener target="#{profileManagementBackingBean.managedBean.selectedTabIndex}" 
							value="#{profileManagementBackingBean.tabPersonalization}" />
					</p:menuitem>
					<!-- Change Password -->
					<p:menuitem value="#{lbl['lbl.pm.profiles.tab.name.cp']}" update="@form"
						rendered="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}">
						<f:param name="disableValidation" value="" />   
						<f:setPropertyActionListener target="#{profileManagementBackingBean.managedBean.selectedTabIndex}" 
							value="#{profileManagementBackingBean.tabChangePassword}" />
					</p:menuitem>
				</p:tabMenu>
			</td>
			<td width="80%">
				<!-- User Profile -->
				<p:outputPanel rendered="#{profileManagementBackingBean.managedBean.selectedTabIndex == profileManagementBackingBean.tabUserProfile}">
					<ui:include src="/xhtml/pm/profilemanagement/userDetails/userProfileDetails.xhtml" /> 
				</p:outputPanel>
				<!-- Authorization -->
				<p:outputPanel rendered="#{profileManagementBackingBean.managedBean.selectedTabIndex == profileManagementBackingBean.tabAuthorization}">
					<ui:include src="/xhtml/pm/profilemanagement/userDetails/userAuthorisation.xhtml" />
				</p:outputPanel>
				<!-- Personalization -->
				<p:outputPanel rendered="#{profileManagementBackingBean.managedBean.selectedTabIndex == profileManagementBackingBean.tabPersonalization}">
					<ui:include src="/xhtml/pm/profilemanagement/userDetails/userPreference.xhtml" />
				</p:outputPanel>
				<!-- Change Password -->	
				<p:outputPanel rendered="#{profileManagementBackingBean.managedBean.selectedTabIndex == profileManagementBackingBean.tabChangePassword
				  	and !profileManagementBackingBean.managedBean.selectedUser.brandNew}">
					<ui:include src="/xhtml/pm/profilemanagement/userDetails/userChangePassword.xhtml" />
				</p:outputPanel>
			</td>
		</tr>
	</table>
</ui:composition>
