<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="pResponsibleOrg" header="#{lbl['lbl.pm.profiles.authorisation.attachment']}" toggleable="true">
		<table class="ppOneTable">
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.authorisation.attachment']}" />
				</th>
				<td>
				  <p:fileUpload 
				  	fileUploadListener="#{profileManagementBackingBean.handleFileUpload}" 
				  	mode="advanced" sizeLimit="1000000" 
            		allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
					invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
	            	/> 
	            	
		
		
				</td>
			</tr>
		</table>	
	</p:panel>
</ui:composition>
