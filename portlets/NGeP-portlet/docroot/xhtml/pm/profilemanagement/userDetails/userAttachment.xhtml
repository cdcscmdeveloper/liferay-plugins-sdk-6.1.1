<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="pAttachment" header="#{lbl['lbl.pm.profiles.authorisation.attachment']}" toggleable="true"
		>
		<p:dataTable id="dtAttachment" var="attachment" rowKey="#{attachment}"
	  		 emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
		     value="#{profileManagementBackingBean.managedBean.selectedUser.pmUserAttachments}">   
		    <ac:paginator for="dtAttachment"/>
		    <p:column style="width:55%;text-align:left;white-space:normal;" headerText="#{lbl['lbl.pm.profiles.authorisation.filename']}" >
	          	#{attachment.fileName}
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pm.created.by']}" style="width:17%;text-align:center;white-space:normal;">
	          	#{profileManagementBackingBean.getUsername(attachment.createdBy)}
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pm.created.date']}" style="width:17%;text-align:center;" >
	        	<h:outputText value="#{attachment.createdDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>
	        <p:column style="text-align:center;width:8%;" headerText="#{lbl['lbl.pm.action']}" >
	          	<p:commandLink action="#{profileManagementBackingBean.downloadAttachment(attachment)}" 
	          		immediate="true" ajax="false" rendered="#{!attachment.brandNew}">
 					  <p:graphicImage value="/css/images/design/attach.png" />
 				</p:commandLink>
				<p:commandLink action="#{profileManagementBackingBean.deleteAttachment(attachment)}" 
	          		immediate="true" update="dtAttachment">
 					  <p:graphicImage value="/css/images/design/icon_trash.png" />
 				</p:commandLink>
	        </p:column>
	    </p:dataTable>
		<div align="right">
			<p:commandButton disabled="#{isSupplierOrgType}" onclick="dlAttachment.show();return false;" update="dtAttachment"
				value="#{lbl['lbl.pm.profiles.authorisation.attachment']}">
			</p:commandButton>
		</div>
		
		<p:dialog id="dlAttachment" widgetVar="dlAttachment" modal="true"
			resizable="false" width="700px" height="200" position="top" style="z-index:-1;"
			header="#{lbl['lbl.pm.profiles.authorisation.choose.file']}">	
			<p:fileUpload  update="dtAttachment"
				fileUploadListener="#{profileManagementBackingBean.handleFileUpload}" 
				mode="basic" sizeLimit="1000000" 
		        allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="#{lbl['lbl.pm.profiles.authorisation.invalid.filetype']}"
				invalidSizeMessage="#{lbl['lbl.pm.profiles.authorisation.invalid.filesize']}"
			    fileLimit="3" dragDropSupport="false" 
			    uploadLabel="#{lbl['lbl.btn.upload.all']}" 
		   		label="#{lbl['lbl.btn.choose']}" 
		   		cancelLabel="#{lbl['lbl.btn.remove.all']}"
		   		multiple="true"/>	            	
				
		</p:dialog>	
		
		
	</p:panel>
</ui:composition>
