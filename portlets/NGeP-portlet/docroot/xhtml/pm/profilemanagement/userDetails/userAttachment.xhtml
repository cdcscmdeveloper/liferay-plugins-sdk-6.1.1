<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="pAttachment" header="#{lbl['lbl.pm.profiles.authorisation.attachment']}" toggleable="true"
		>
		<p:dataTable id="dtAttachment" var="attachment" rowKey="#{attachment}"
	  		 emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
		     value="#{profileManagementBackingBean.managedBean.selectedUser.pmUserAttachments}"
			    >   
		    <ac:paginator for="dtAttachment"/>
		    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.filename']}" >
	          	#{attachment.fileName}
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pp.created.by']}" >
	          	#{profileManagementBackingBean.getUsername(attachment.createdBy)}
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pp.created.date']}" >
	        	<h:outputText value="#{attachment.createdDate}">
					<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
				</h:outputText>
			</p:column>
	        <p:column headerText="#{lbl['lbl.pp.action']}" >
	          	<p:commandLink action="#{profileManagementBackingBean.downloadAttachment(attachment)}" 
	          		immediate="true" ajax="false" disabled="#{attachment.brandNew}">
 					  <p:graphicImage library="ep/images/design" name="attach.png"
		                   value="/css/images/design/attach.png" />
 				</p:commandLink>
				<p:commandLink action="#{profileManagementBackingBean.deleteAttachment(attachment)}" 
	          		immediate="true" update="dtAttachment">
 					  <p:graphicImage library="ep/images/design" name="icon_trash.png"
		                   value="/css/images/design/icon_trash.png" />
 				</p:commandLink>
	        </p:column>
	    </p:dataTable>
		<div align="right">
			<p:commandButton onclick="dlAttachment.show();return false;" update="dtAttachment"
				value="#{lbl['lbl.pm.profiles.authorisation.attachment']}">
			</p:commandButton>
		</div>
		<p:dialog id="dlAttachment" widgetVar="dlAttachment" modal="true"
			resizable="false" width="700px" height="200" styleClass="pop_up_top"
			header="#{lbl['lbl.pm.profiles.authorisation.choose.file']}">		
			<p:outputPanel id="opAttachment">
				<table class="ppOneTable">
					<tr>
						<td>
						  <p:fileUpload oncomplete="dlAttachment.hide();" update="dtAttachment"
						  	fileUploadListener="#{profileManagementBackingBean.handleFileUpload}" 
						  	mode="advanced" sizeLimit="1000000" 
		            		allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
							invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			            	fileLimit="1" dragDropSupport="false" uploadLabel="#{lbl['lbl.btn.confirm']}" 
		   					label="#{lbl['lbl.btn.browse']}"/>	            	
						</td>
					</tr>
				</table>
			</p:outputPanel>
		</p:dialog>	
	</p:panel>
</ui:composition>
