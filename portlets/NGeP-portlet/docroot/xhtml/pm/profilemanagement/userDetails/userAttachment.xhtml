<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="ATTACHMENTS" toggleable="true">
    <h:panelGrid columns="2" >	
    
    <h:outputLabel value="#{lbl['lbl.pm.profiles.authorisation.attachment']}"></h:outputLabel>
    <p:fileUpload fileUploadListener="#{profileManagementBackingBean.handleFileUpload}" mode="advanced"   
            update="messages" sizeLimit="1000000" allowTypes="/(\.|\/)(gif|jpe?g|png)$/"/>  
 
    <p:growl id="messages" showDetail="true"/>
    
    
    </h:panelGrid>    

    		
	</p:panel>
</ui:composition>
