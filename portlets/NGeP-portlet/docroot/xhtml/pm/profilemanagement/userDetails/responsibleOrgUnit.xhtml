<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<p:panel id="pResponsibleOrg" header="#{lbl['lbl.pm.profiles.authorisation.responsible.org']}" toggleable="true">
		<br/>
	   	<p:dataTable id="dtOrgUnit" var="orgUnit" styleClass="dtOrgUnit" 
		     value="#{profileManagementBackingBean.managedBean.selectedUser.pmUserOrgs}"
		     selection="#{profileManagementBackingBean.managedBean.selectedUserOrg}" 
		     selectionMode="single"
		     rowIndexVar="index" rowKey="#{orgUnit}">   
			<p:ajax event="rowSelect" update=":form:tvRoleReceivingAddr" listener="#{profileManagementBackingBean.showReceivingAddress}" >
				<f:param name="disableValidation" value="" />     
			</p:ajax>
			<ac:paginator for="dtOrgUnit"/>
		    <p:column width="15%">
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			     	<h:outputText value="#{lbl['lbl.pm.profiles.resorg.table.orgtype']}" />
			    </f:facet>
		   
				<p:selectOneMenu value="#{orgUnit.pmOrgProfile.orgTypeCode.parameterId}" 
					disabled="#{!orgUnit.brandNew}" id="somOrgType"  required="#{!empty param['disableValidation']}" 
					label="#{lbl['lbl.pm.profiles.resorg.table.orgtype']}">  
					     
					<f:selectItems value="#{profileManagementBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.organisationTypes, profileManagementBackingBean.orgTypeSearchBean)}" />
			     	<p:ajax event="change" listener="#{profileManagementBackingBean.changeResOrgType(index)}" 
			     		update="lovResOrg:lovResOrg, :form:tvRoleReceivingAddr:lovAddrType:lovAddrType, dtOrgUnit, 
			     			:form:tvRoleReceivingAddr:dtRoles, :form:tvRoleReceivingAddr:dtReceiveAddr, opFfcOrgCode, 
			     			opOrgCode"/> 
	            </p:selectOneMenu>		 
	            <p:message id="somOrgTypeMsg" for="somOrgType" display="icon" />    
	        </p:column>	 
	        <p:column width="10%">
			    <f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			    	<h:outputText value="#{lbl['lbl.pm.profiles.resorg.table.code']}" />
			    </f:facet>
			    <p:outputPanel id="opFfcOrgCode" rendered="#{ParameterConst.orgTypeFactoring eq orgUnit.pmOrgProfile.orgTypeCode.parameterCode}">
				    <ac:lov id="lovFfcOrg" lovId="PM_ORG_PROFILE_FFC" size="12" 
				    	required="#{!empty param['disableValidation']}" 
		            	update="@form" readonly="true" disabled="#{!orgUnit.brandNew or orgUnit.pmOrgProfile.orgTypeCode.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{orgUnit.pmOrgProfile.pmFinancialOrg.bizRegNumber}" 
						postUpdateListener="profileManagementBackingBean.updateOrgCode
						(profileManagementBackingBean.managedBean.selectedUser.pmUserOrgs[#{index}].pmOrgProfile, #{index})"
						saveObject="profileManagementBackingBean.managedBean.selectedUser.pmUserOrgs[#{index}].pmOrgProfile"
						conditionField="#{profileManagementBackingBean.managedBean.additionalOrgFilter}" 
						/>
				</p:outputPanel>
				<p:outputPanel id="opOrgCode" rendered="#{ParameterConst.orgTypeFactoring ne orgUnit.pmOrgProfile.orgTypeCode.parameterCode}">
				    <ac:lov id="lovResOrg" lovId="PM_ORG_PROFILE" size="12" 
				    	required="#{!empty param['disableValidation']}" 
		            	update="@form" readonly="true" disabled="#{!orgUnit.brandNew or orgUnit.pmOrgProfile.orgTypeCode.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{orgUnit.pmOrgProfile.pmOrgValidity.orgCode}" 
						postUpdateListener="profileManagementBackingBean.updateOrgCode
						(profileManagementBackingBean.managedBean.selectedUser.pmUserOrgs[#{index}].pmOrgProfile, #{index})"
						saveObject="profileManagementBackingBean.managedBean.selectedUser.pmUserOrgs[#{index}].pmOrgProfile"
						conditionField="orgTypeCode.parameterId^#{orgUnit.pmOrgProfile.orgTypeCode.parameterId}|recordStatus^1#{profileManagementBackingBean.managedBean.additionalOrgFilter}" 
						/>
				</p:outputPanel>
				<p:message id="lovResOrgMsg" for="lovResOrg" display="icon" />   
		    </p:column>
	        <p:column style="white-space:normal; width:20%" headerText="#{lbl['lbl.pm.profiles.resorg.table.name']}" >
	        	#{ParameterConst.orgTypeFactoring eq orgUnit.pmOrgProfile.orgTypeCode.parameterCode ? orgUnit.pmOrgProfile.pmFinancialOrg.finOrgName : orgUnit.pmOrgProfile.pmOrgValidity.orgName}	
	        </p:column>
	        <p:column width="8%"> 
	        	<f:facet name="header">
			     	<h:outputText value="* " styleClass="mandatory" />
			    	<h:outputText value="#{lbl['lbl.pm.profiles.resorg.table.effdate']}" />
			    </f:facet>
			  	<p:calendar id="effDateId" value="#{orgUnit.effDateDisplay}" styleClass="ppDisplayCalXS" 
			  		disabled="#{!orgUnit.brandNew and !profileManagementBackingBean.editableOrg(orgUnit.effDate)}"
			  		required="#{!empty param['disableValidation']}" navigator="true" 
			  		mindate="#{profileManagementBackingBean.minDate}" 
			  		maxdate="#{ProfileManagementConst.maxDate}"
			  		label="#{lbl['lbl.pm.profiles.resorg.table.effdate']}" readonlyInput="true" yearRange="c-0:c+99"
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
				<p:message id="effDateIdMsg" for="effDateId" display="icon" />
	        </p:column>
	        <p:column width="8%" headerText="#{lbl['lbl.pm.profiles.resorg.table.expdate']}" > 
			  	<p:calendar id="expDateId" value="#{orgUnit.expDateDisplay}" styleClass="ppDisplayCalXS" navigator="true" 
			  		readonlyInput="true" yearRange="c-0:c+99" 
			  		disabled="#{!orgUnit.brandNew and !profileManagementBackingBean.editableOrg(orgUnit.expDate)}"
			  		mindate="#{profileManagementBackingBean.minDate}"
			  		maxdate="#{ProfileManagementConst.maxDate}" label="#{lbl['lbl.pm.profiles.resorg.table.expdate']}"
					showOn="button" pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" process="@this" />
				</p:calendar>
	        </p:column>
	        <!-- 
	        <p:column headerText="#{lbl['lbl.pm.profiles.userdetails.status']}" width="5%"> 
		       	<p:selectOneMenu value="#{orgUnit.recordStatusFlg}" styleClass="ppDropDownWidthXS">  
	            	<f:selectItems value="#{profileManagementBackingBean.getStatusOptions()}" />
	            	<p:ajax event="change" listener="#{profileManagementBackingBean.orgUnitStatusChange(index)}" 
			     		update=":form:tvRoleReceivingAddr:dtRoles"/>
	          	</p:selectOneMenu>         
	        </p:column>     
	         -->   
	         <p:column width="5%">
			<f:facet name="header">
					                #{lbl['lbl.pm.status']}
				                </f:facet>
			<p:selectOneMenu value="#{orgUnit.recordStatusFlg}"
				 style="width:40px;" disabled="#{orgUnit.brandNew or profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg == 0}">
				<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}" itemValue="0" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
				<p:ajax event="change" listener="#{profileManagementBackingBean.orgUnitStatusChange(index)}" partialSubmit="true" process="@this" 
			     		update="@this, :form:tvRoleReceivingAddr ,dtOrgUnit"/>
			</p:selectOneMenu>
		</p:column>
	        <p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">  
      		    <p:commandLink action="#{profileManagementBackingBean.deleteOrgUnit(orgUnit)}" disabled="#{!orgUnit.brandNew}"
      		    	immediate="true" update="dtOrgUnit">
					<p:graphicImage value="/css/images/design/delete.png"/>
				</p:commandLink>
	        </p:column>  
		</p:dataTable>
       	<br/>
		<div class="ppRightBtn">
		 	<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this" partialSubmit="true" immediate="true" 
		 	disabled="#{profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg == 0}"
		   	 	update="dtOrgUnit, :form:tvRoleReceivingAddr" action="#{profileManagementBackingBean.addOrgUnit()}" />
		</div>
    	<ac:lovPopup /> 		
	</p:panel>
</ui:composition>
