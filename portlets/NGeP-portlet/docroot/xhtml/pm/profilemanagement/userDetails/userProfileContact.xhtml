<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="pUserAddress" header="#{lbl['lbl.pm.profiles.address.contact']}" toggleable="true">		                		             				    		   		     
		<table class="ppTwoTable">
		  
			<tr> 
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.email']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>  
			    <td>
			    	<p:inputText id="itEmail" required="#{!empty param['disableValidation']}" maxlength="80"
			    		label="#{lbl['lbl.pm.profiles.userdetails.email']}"
			    		value="#{profileManagementBackingBean.managedBean.selectedUser.email}" styleClass="ppDisplayTextL"  
			    		validatorMessage="#{lbl['lbl.pm.profiles.invalidEmail']}">
						<f:validateRegex disabled="#{empty param['disableValidation']}"
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
					</p:inputText> 
			    		
			    	&#160;&#160;   
	                <p:graphicImage id="giEmail" value="/css/images/design/tooltips.png" />
					<p:tooltip for="giEmail" value="#{lbl['lbl.pm.profiles.userdetails.email.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itEmailMsg" for="itEmail" display="icon" />
			    </td>
			    <th></th>
               	<td></td>
			</tr>    
			<tr>   
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.telno']}" /></th>  
			    <td>
			    	<p:inputText id="itTelNo" value="#{profileManagementBackingBean.managedBean.selectedUser.phoneNo}"
			    		styleClass="ppDisplayTextL" maxlength="12" validatorMessage="#{lbl['lbl.pm.profiles.userdetails.telno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itTelNoMsg" for="itTelNo" display="icon" />
			    </td> 	
			    <th></th>
               	<td></td>
			</tr>    		     			    		 			   
			<tr>    
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.faxno']}" /></th> 
			    <td>
			    	<p:inputText id="itFaxNo" value="#{profileManagementBackingBean.managedBean.selectedUser.faxNo}" 
			    		styleClass="ppDisplayTextL" maxlength="12" validatorMessage="#{lbl['lbl.pm.profiles.userdetails.faxno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itFaxNoMsg" for="itFaxNo" display="icon" />
	    		</td>
			    <th></th>
               	<td></td>
		    </tr>     
			<tr>    			    
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.mobileno']}" /></th>  
			    <td>
			    	<p:inputText id="itMobileNo" value="#{profileManagementBackingBean.managedBean.selectedUser.mobileNo}"  maxlength="12"
			    		styleClass="ppDisplayTextL"  validatorMessage="#{lbl['lbl.pm.profiles.userdetails.mobileno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itMobileNoMsg" for="itMobileNo" display="icon" />
			    </td>
			    <th></th>
               	<td></td>		    			    			    			    			    		    			    			                                          			                     		                                                 
            </tr>		    			                     
		</table>
	</p:panel>
	</ui:composition>
