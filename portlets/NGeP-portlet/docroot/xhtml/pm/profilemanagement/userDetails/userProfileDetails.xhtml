<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">	

	<!-- User Profile -->
	<p:panel header="#{lbl['lbl.pm.profiles.user.profile']}" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2">
			<p:outputPanel id="opUserProfileDet">
				
				<table class="ppTwoTable">
					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" id="itLoginId" maxlength="75"
								label="#{lbl['lbl.pm.profiles.userdetails.loginid']}" 
								required="#{!empty param['disableValidation']}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.loginId}"/>
							<p:message id="itLoginIdMsg" for="itLoginId" display="icon" />

						</td>
						<!-- Profile Photo -->
						<td colspan="2" rowspan="9">
							<h:graphicImage id="giUserImage"
								value="#{profileManagementBackingBean.userImagePath(profileManagementBackingBean.managedBean.selectedUser.loginId)}"
								style="margin-left:25px;" width="140" height="160" />	
							<div align="left">
								<p:commandButton icon="ui-icon-image" value="#{lbl['lbl.pm.profiles.userdetails.changepic']}" 
									oncomplete="dlImageUpload.show();" immediate="true" />
								<p:commandButton icon="ui-icon-delete" value="#{lbl['lbl.pm.profiles.userdetails.deletepic']}"
									action="#{profileManagementBackingBean.deletePortrait}" immediate="true" update="giUserImage" />
							</div>
						</td>
					</tr>
				
					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM" id="somSalutation" 
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.salutation']}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.salutationCode.salutationId}">
								<f:selectItems value="#{profileManagementBackingBean.salutationOptions()}" />
							</p:selectOneMenu>
							<p:message id="somSalutationMsg" for="somSalutation" display="icon" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.username']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" id="itUserName" maxlength="50"
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.username']}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.userName}"/>
							<p:message id="itUserNameMsg" for="itUserName" display="icon" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idtype']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM" id="somIdType" 
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.idtype']}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.identificationCode.parameterId}">
								<f:selectItems value="#{profileManagementBackingBean.getIdentityTypeList()}"/>
								<p:ajax event="change" update="itIdentityNo"
									listener="#{profileManagementBackingBean.identityTypeChange}" />
							</p:selectOneMenu>
							<p:message id="somIdTypeMsg" for="somIdType" display="icon" />
						</td>
						<th ></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<c:choose>
								<c:when test="#{profileManagementBackingBean.managedBean.selectedUser.identificationCode.parameterCode == ProfileManagementConst.newIc}">
									<p:inputText id="itIdentityNo" styleClass="ppDisplayTextM"
										required="#{!empty param['disableValidation']}"
										label="#{lbl['lbl.pm.profiles.userdetails.idno']}"
										disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
										value="#{profileManagementBackingBean.managedBean.selectedUser.identificationNo}"
										size="30" maxlength="12" validatorMessage="#{lbl['lbl.pm.profiles.userdetails.idno']} #{lbl['lbl.pm.profiles.newicno']} - #{lbl['lbl.pm.profiles.invalidIcNo']}">
										<f:validateRegex pattern="[0-9]+" />
										<f:validateLength minimum="12"/>  							
									</p:inputText>
								</c:when>
								
								<c:otherwise>
									<p:inputText id="itIdentityNo" styleClass="ppDisplayTextM" 
										required="#{!empty param['disableValidation']}"
										label="#{lbl['lbl.pm.profiles.userdetails.idno']}"
										disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
										value="#{profileManagementBackingBean.managedBean.selectedUser.identificationNo}"
										size="30" maxlength="12">							
									</p:inputText>
								</c:otherwise>
							</c:choose>
							<p:message id="itIdentityNoMsg" for="itIdentityNo" display="icon" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.nationality']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" />
						</th>
						<td>
							<p:selectOneMenu styleClass="ppDropDownWidthM" id="somNationality" 
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.nationality']}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.pmCountry.countryId}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
								<f:selectItems
									value="#{profileManagementBackingBean.getCountryList()}"
									var="countrylist" itemLabel="#{countrylist.countryName}"
									itemValue="#{countrylist.countryId}" />
							</p:selectOneMenu>
							<p:message id="somNationalityMsg" for="somNationality" display="icon" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.designation']}" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" maxlength="30"
								value="#{profileManagementBackingBean.managedBean.selectedUser.designation}" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.promanagement']}" />
						</th>
						<td>
							<p:selectOneRadio value="#{profileManagementBackingBean.managedBean.selectedUser.PMP}" >
								<f:selectItems value="#{profileManagementBackingBean.getYesNoOptions()}" />
							</p:selectOneRadio>
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.grade']}" />
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" value="#{profileManagementBackingBean.managedBean.selectedUser.grade}"
								maxlength="10"/>
						</td>
						<th></th>
						<td></td>
					</tr>
					
					<tr>
						<th width="20%">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.status']}"/>
						</th>
						<td>
							<p:selectOneMenu value="#{profileManagementBackingBean.managedBean.selectedUser.recordStatusFlg}" styleClass="ppDropDownWidthM">
								<f:selectItems value="#{profileManagementBackingBean.getStatusOptions()}" />
							</p:selectOneMenu>
							&#160;&#160;   
			                <p:graphicImage id="giUserStatus" library="ep/images/design" name="tooltips.png"
				                   value="/css/images/design/tooltips.png" />
							<p:tooltip for="giUserStatus" value="#{lbl['lbl.pm.profiles.userdetails.status.tooltip']}" showEffect="fade" hideEffect="fade" />
						</td>
						<th></th>
						<td></td>
					</tr>
			
				</table>
			</p:outputPanel>
		</h:panelGrid> 
    </p:panel>	
    <br />	  
    
    <!-- Address & Contact -->
	<p:panel id="pUserAddress" header="#{lbl['lbl.pm.profiles.address.contact']}" toggleable="true">		                		             				    		   		     
		<table class="ppTwoTable">
			<tr>		    
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.country']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>	  
		        <td>
		        	<p:selectOneMenu value="#{profileManagementBackingBean.managedBean.userAddress.pmCountry.countryId}" 
		        		styleClass="ppDropDownWidthM" id="somCountry" required="#{!empty param['disableValidation']}"
		        		label="#{lbl['lbl.pm.profiles.userdetails.country']}">
	            	     <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 		             
						 <f:selectItems value="#{profileManagementBackingBean.getCountryList()}"
							var="country" itemLabel="#{country.countryName}" itemValue="#{country.countryId}" />  
						<p:ajax event="change" update="somStateC" />
                    </p:selectOneMenu>
                    <p:message id="somCountryMsg" for="somCountry" display="icon" />
                 </td>	  
                 <th></th>
                 <td></td>
            </tr>
            <tr>       
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressone']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>	  
			    <td>
			    	<p:inputText id="itUserAdd1" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.profiles.userdetails.addressone']}"
			    		value="#{profileManagementBackingBean.managedBean.userAddress.address1}" styleClass="ppDisplayTextL" maxlength="35" />
		    		<p:message id="itUserAdd1Msg" for="itUserAdd1" display="icon" />
		    	</td>	
			    <th></th>
                <td></td>                    
            </tr>
            <tr>       
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addresstwo']}" /></th>	  
			    <td>
			    	<p:inputText value="#{profileManagementBackingBean.managedBean.userAddress.address2}" 
			    		styleClass="ppDisplayTextL" maxlength="35" />
		    	</td>	   
			    <th></th>
                <td></td>
			 </tr>
			 <tr>   
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressthree']}" /></th>	  
			    <td>
			    	<p:inputText value="#{profileManagementBackingBean.managedBean.userAddress.address3}" 
			    		styleClass="ppDisplayTextL" maxlength="35"/>
		    	</td>	
			    <th></th>
                <td></td> 
		    </tr>
		    <tr>
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressfour']}" /></th>	  
		    	<td>
		    		<p:inputText value="#{profileManagementBackingBean.managedBean.userAddress.address4}" 
		    			styleClass="ppDisplayTextL" maxlength="35" />
	    		</td>	 
		    	<th></th>
               	<td></td>	
		    </tr>
		    <tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.postcode']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>	 
		    	<td>
		    		<p:inputText id="itPostcode" required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.profiles.userdetails.postcode']}"
		    			value="#{profileManagementBackingBean.managedBean.userAddress.postcode}" styleClass="ppDisplayTextM" maxlength="10">
	    				<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
	    			</p:inputText>
	    			<p:message id="itPostcodeMsg" for="itPostcode" display="icon" />
	    		</td>	
		    	<th></th>
               	<td></td>
		    </tr>			
		    <tr>	
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.state']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>  
		        <td>
		        	<p:selectOneMenu id="somStateC" styleClass="ppDropDownWidthM" required="#{!empty param['disableValidation']}"
		        		label="#{lbl['lbl.pm.profiles.userdetails.state']}"
		        		disabled="#{profileManagementBackingBean.managedBean.userAddress.pmCountry.countryId==null}"
		        		value="#{profileManagementBackingBean.managedBean.userAddress.pmState.stateId}" >
					   	<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
					   	<f:selectItems
						  value="#{profileManagementBackingBean.getStateList(profileManagementBackingBean.managedBean.userAddress.pmCountry.countryId)}" 
						  var="state" itemLabel="#{state.stateName}"
						  itemValue="#{state.stateId}"/>
					  	<p:ajax event="change" listener="#{profileManagementBackingBean.updateDivisionFlag(
					  		profileManagementBackingBean.managedBean.userAddress.pmState.stateId)}" 
					  		update="somDistrictC, somDivisionC" />
			       </p:selectOneMenu>
			       <p:message id="somStateCMsg" for="somStateC" display="icon" />
		       	</td>						
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.division']}" />
                	<p:outputLabel value="*" styleClass="mandatory" />
               	</th>  
		        <td>
		        	<p:selectOneMenu id="somDivisionC" disabled="#{!profileManagementBackingBean.managedBean.divisionFlagC}"
		        		value="#{profileManagementBackingBean.managedBean.userAddress.pmDivision.divisionId}"
		        		required="#{!empty param['disableValidation'] and profileManagementBackingBean.managedBean.divisionFlagC}" 
		        		label="#{lbl['lbl.pm.profiles.userdetails.division']}"
		        		styleClass="ppDropDownWidthM"> 
					 	<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
					 	<f:selectItems
						  value="#{profileManagementBackingBean.getDivisionList(profileManagementBackingBean.managedBean.userAddress.pmState.stateId)}" 
						  var="division" itemLabel="#{division.divisionName}" itemValue="#{division.divisionId}"/>     
				    </p:selectOneMenu>
				    <p:message id="somDivisionCMsg" for="somDivisionC" display="icon" />
			    </td>
			</tr>    	
			<tr>
	            <th width="20%">
	            	<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.district']}" />
	            	<p:outputLabel value="*" styleClass="mandatory" />
            	</th> 
		        <td>
		        	<p:selectOneMenu id="somDistrictC" required="#{!empty param['disableValidation']}" 
		        		label="#{lbl['lbl.pm.profiles.userdetails.district']}"
		        		disabled="#{profileManagementBackingBean.managedBean.userAddress.pmState.stateId==null}"
		        		value="#{profileManagementBackingBean.managedBean.userAddress.pmDistrict.districtId}"
		              	styleClass="ppDropDownWidthM"> 
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"/>
						<f:selectItems 
							value="#{profileManagementBackingBean.getDistrictList(profileManagementBackingBean.managedBean.userAddress.pmState.stateId)}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"/>
						<p:ajax event="change" update="somCityC"/>
				   </p:selectOneMenu>
				   <p:message id="somDistrictCMsg" for="somDistrictC" display="icon" />
			    </td>	
			    <td>
			    	<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.citytown']}" />
			    	<p:outputLabel value="*" styleClass="mandatory" />
		    	</td>
		        <td>
		        	<p:selectOneMenu id="somCityC" required="#{!empty param['disableValidation']}" 
		        		label="#{lbl['lbl.pm.profiles.userdetails.citytown']}"
		        		disabled="#{profileManagementBackingBean.managedBean.userAddress.pmDistrict.districtId==null}"
		        		value="#{profileManagementBackingBean.managedBean.userAddress.pmCity.cityId}"
    					styleClass="ppDropDownWidthM"> 
				        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
				        <f:selectItems 
							value="#{profileManagementBackingBean.getCityList(profileManagementBackingBean.managedBean.userAddress.pmDistrict.districtId)}"
							var="city" itemLabel="#{city.cityName}"
							itemValue="#{city.cityId}"/>
				    </p:selectOneMenu>
				    <p:message id="somCityCMsg" for="somCityC" display="icon" />
			    </td>	
			    <th></th>
      			<td></td>
 			</tr>	
			<tr> 
  				<th width="20%">
  					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.email']}" />
  					<p:outputLabel value="*" styleClass="mandatory" />
				</th>  
			    <td>
			    	<p:inputText id="itEmail" required="#{!empty param['disableValidation']}" maxlength="80"
			    		label="#{lbl['lbl.pm.profiles.userdetails.email']}"
			    		value="#{profileManagementBackingBean.managedBean.selectedUser.email}" styleClass="ppDisplayTextM"  
			    		validatorMessage="#{lbl['lbl.pm.profiles.invalidEmail']}">
						<f:validateRegex disabled="#{empty param['disableValidation']}"
							pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
					</p:inputText> 
			    		
			    	&#160;&#160;   
	                <p:graphicImage id="giEmail" library="ep/images/design" name="tooltips.png"
		                   value="/css/images/design/tooltips.png" />
					<p:tooltip for="giEmail" value="#{lbl['lbl.pm.profiles.userdetails.email.tooltip']}" showEffect="fade" hideEffect="fade" />
					<p:message id="itEmailMsg" for="itEmail" display="icon" />
			    </td>
			    <th></th>
               	<td></td>
			</tr>    
			<tr>   
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.telno']}" /></th>  
			    <td>
			    	<p:inputText id="itTelNo" value="#{profileManagementBackingBean.managedBean.selectedUser.phoneNo}"
			    		styleClass="ppDisplayTextM" maxlength="12">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itTelNoMsg" for="itTelNo" display="icon" />
			    </td> 	
			    <th></th>
               	<td></td>
			</tr>    		     			    		 			   
			<tr>    
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.faxno']}" /></th> 
			    <td>
			    	<p:inputText id="itFaxNo" value="#{profileManagementBackingBean.managedBean.selectedUser.faxNo}" 
			    		styleClass="ppDisplayTextM" maxlength="12">
						<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itFaxNoMsg" for="itFaxNo" display="icon" />
	    		</td>
			    <th></th>
               	<td></td>
		    </tr>     
			<tr>    			    
  				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.mobileno']}" /></th>  
			    <td>
			    	<p:inputText id="itMobileNo" value="#{profileManagementBackingBean.managedBean.selectedUser.mobileNo}"  maxlength="12"
			    		styleClass="ppDisplayTextM"  validatorMessage="#{lbl['lbl.pm.profiles.userdetails.mobileno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
			    		<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
		    		</p:inputText>
		    		<p:message id="itMobileNoMsg" for="itMobileNo" display="icon" />
			    </td>
			    <th></th>
               	<td></td>		    			    			    			    			    		    			    			                                          			                     		                                                 
            </tr>		    			                     
		</table>
	</p:panel>
	<!-- Upload Image Popup -->
	<ui:include src="/xhtml/pm/profilemanagement/common/uploadPortrait.xhtml" />
	
</ui:composition>
