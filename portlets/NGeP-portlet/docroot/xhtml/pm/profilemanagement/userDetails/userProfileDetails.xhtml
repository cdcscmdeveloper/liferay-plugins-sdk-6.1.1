<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- User Profile -->
	<p:panel header="#{lbl['lbl.pm.profiles.org.detail']}"
		toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2">
			<p:outputPanel id="orgProfileDet">

				<table class="ppTwoTable">
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.org.category']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:selectOneRadio
								value="#{profileManagementBackingBean.managedBean.searchOrgCategory}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUserOrg.brandNew}">
								<f:selectItem
									itemLabel="#{lbl['lbl.pm.org.federal.government']}"
									itemValue="#{profileManagementBackingBean.federalGovt}" />
								<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}"
									itemValue="#{profileManagementBackingBean.others}" />
								<p:ajax process="@this" event="change" partialSubmit="true"
									listener="#{profileManagementBackingBean.resetOrgTypeAndCode()}"
									update=":form:orgProfileDet" />
							</p:selectOneRadio></td>
						<th></th>
						<td></td>
					</tr>
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.organisation.orgType']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:selectOneMenu id="orgTypeFederalList"
								rendered="#{profileManagementBackingBean.managedBean.searchOrgCategory eq profileManagementBackingBean.federalGovt}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUserOrg.brandNew}"
								styleClass="ppDropDownWidthL" required="true"
								label="#{lbl['lbl.pm.organisation.orgType']}"
								style="margin-bottom: 5px;"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterId}">
								<f:selectItems
									value="#{profileManagementBackingBean.getOrgTypeDropdownValues()}" />
								<p:ajax event="change"
									listener="#{profileManagementBackingBean.changeResOrgType()}"
									update=":form:lovResOrg:lovResOrg, :form:tvRoleReceivingAddr:lovAddrType:lovAddrType, 
			     			:form:tvRoleReceivingAddr:dtRoles, :form:tvRoleReceivingAddr:dtReceiveAddr
			     			" />
							</p:selectOneMenu> <p:message id="orgTypeFederalListMsg" for="orgTypeFederalList"
								display="icon" /> <p:selectOneMenu id="orgTypeOthersList"
								rendered="#{profileManagementBackingBean.managedBean.searchOrgCategory eq profileManagementBackingBean.others}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUserOrg.brandNew}"
								styleClass="ppDropDownWidthL" required="true"
								label="#{lbl['lbl.pm.organisation.orgType']}"
								style="margin-bottom: 5px;"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterId}">
								<f:selectItems
									value="#{profileManagementBackingBean.getOrgTypeDropdownValues()}" />
								<p:ajax event="change"
									listener="#{profileManagementBackingBean.changeResOrgType()}"
									update=":form:lovResOrg:lovResOrg, :form:tvRoleReceivingAddr:lovAddrType:lovAddrType, 
			     			:form:tvRoleReceivingAddr:dtRoles, :form:tvRoleReceivingAddr:dtReceiveAddr
			     			" />
							</p:selectOneMenu> <p:message id="orgTypeOthersListMsg" for="orgTypeOthersList"
								display="icon" /></td>
						<td colspan="2"><div align="left"><ac:lov id="lovResOrg" lovId="PM_ORG_PROFILE" size="40"
								required="true" update=":form:lovResOrg:lovResOrg, :form:tvRoleReceivingAddr:lovAddrType:lovAddrType, 
			     			:form:tvRoleReceivingAddr:dtRoles, :form:tvRoleReceivingAddr:dtReceiveAddr" readonly="true"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUserOrg.brandNew or profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterId==null}"
								headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.pmOrgValidity.orgName}"
								saveObject="profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile"
								conditionField="orgTypeCode.parameterId^#{profileManagementBackingBean.managedBean.selectedUserOrg.pmOrgProfile.orgTypeCode.parameterId}|recordStatus^1#{profileManagementBackingBean.managedBean.additionalOrgFilter}" />
							<p:message id="lovResOrgMsg" for="lovResOrg" display="icon" /></div></td>

					</tr>
				</table>
			</p:outputPanel>
		</h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.pm.profiles.user.profile']}"
		toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2">
			<p:outputPanel id="opUserProfileDet">
				<table class="ppTwoTable">
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.idtype']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:selectOneMenu styleClass="ppDropDownWidthL"
								id="somIdType" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.idtype']}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.identificationCode.parameterCode}">
								<f:selectItems
									value="#{profileManagementBackingBean.getIdentityTypeList()}" />

								<p:ajax event="change"
									listener="#{profileManagementBackingBean.checkIdentificationNumber()}"
									partialSubmit="true" process="@this" update="@form" />
							</p:selectOneMenu> <p:message id="somIdTypeMsg" for="somIdType" display="icon" />
						</td>
						<!-- Profile Photo -->
						<td colspan="2" rowspan="9"><p:outputPanel id="opPortrait"
								rendered="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}">
								<h:graphicImage id="giUserImage"
									value="#{profileManagementBackingBean.userImagePathWithDefaultImage(profileManagementBackingBean.managedBean.selectedUser.loginId)}"
									style="margin-left:25px;" width="140" height="160" />
								<div align="center">
									<p:commandButton
										value="#{lbl['lbl.pm.profiles.userdetails.changepic']}"
										oncomplete="dlImageUpload.show();" immediate="true" />
									<p:commandButton
										value="#{lbl['lbl.pm.profiles.userdetails.deletepic']}"
										action="#{profileManagementBackingBean.deletePortrait}"
										immediate="true" update="giUserImage" />
								</div>
							</p:outputPanel></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><c:choose>
								<c:when
									test="#{profileManagementBackingBean.managedBean.selectedUser.identificationCode.parameterCode == ProfileManagementConst.newIc}">
									<p:inputText id="itIdentityNo" styleClass="ppDisplayTextL"
										required="#{!empty param['disableValidation']}"
										label="#{lbl['lbl.pm.profiles.userdetails.idno']}"
										disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
										value="#{profileManagementBackingBean.managedBean.selectedUser.identificationNo}"
										size="30" maxlength="12"
										validatorMessage="#{lbl['lbl.pm.profiles.userdetails.idno']} #{lbl['lbl.pm.profiles.newicno']} - #{lbl['lbl.pm.profiles.invalidIcNo']}">
										<f:validateRegex pattern="[0-9]+" />
										<f:validateLength minimum="12" />
										<p:ajax event="change"
											listener="#{profileManagementBackingBean.checkIdentificationNumber()}"
											partialSubmit="true" process="@this" update="@form" />
									</p:inputText>
								</c:when>

								<c:otherwise>
									<p:inputText id="itIdentityNo" styleClass="ppDisplayTextL"
										required="#{!empty param['disableValidation']}"
										label="#{lbl['lbl.pm.profiles.userdetails.idno']}"
										disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
										value="#{profileManagementBackingBean.managedBean.selectedUser.identificationNo}"
										size="30" maxlength="12">
										<p:ajax event="change"
											listener="#{profileManagementBackingBean.checkIdentificationNumber()}"
											partialSubmit="true" process="@this" update="@form" />
									</p:inputText>
								</c:otherwise>
							</c:choose> <p:message id="itIdentityNoMsg" for="itIdentityNo"
								display="icon" /></td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:inputText styleClass="ppDisplayTextL" id="itLoginId"
								maxlength="75"
								label="#{lbl['lbl.pm.profiles.userdetails.loginid']}"
								required="#{!empty param['disableValidation']}"
								disabled="#{!profileManagementBackingBean.managedBean.selectedUser.brandNew}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.loginId}"
								validatorMessage="#{lbl['lbl.pm.profiles.userdetails.loginid']} - #{lbl['lbl.pm.profiles.invalidLogin']}">
								<f:validateRegex pattern="^([a-zA-Z0-9._-]{8,40})?$" />
							</p:inputText> <p:message id="itLoginIdMsg" for="itLoginId" display="icon" />

						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:selectOneMenu styleClass="ppDropDownWidthL"
								id="somSalutation"
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.salutation']}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.salutationCode.salutationId}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems
									value="#{profileManagementBackingBean.salutationOptions()}"
									var="salutation" itemLabel="#{salutation.salutationName}"
									itemValue="#{salutation.salutationId}" />
							</p:selectOneMenu> <p:message id="somSalutationMsg" for="somSalutation"
								display="icon" /></td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.username']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:inputText styleClass="ppDisplayTextL" id="itUserName"
								maxlength="50" required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.username']}"
								validatorMessage="#{lbl['lbl.pm.profiles.userdetails.username']} #{lbl['lbl.pm.profiles.invalidString']}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.userName}">
								<f:validateRegex pattern="^([\S]+[\s\S]{1,80})?$" />
							</p:inputText>&#160;&#160;<p:graphicImage id="giUserUsername"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="giUserUsername"
								value="#{lbl['lbl.pm.profiles.userdetails.username.tooltip']}"
								showEffect="fade" hideEffect="fade" /> <p:message
								id="itUserNameMsg" for="itUserName" display="icon" /></td>
						<th></th>
						<td></td>
					</tr>


					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.nationality']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:selectOneMenu styleClass="ppDropDownWidthL"
								id="somNationality"
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.nationality']}"
								value="#{profileManagementBackingBean.managedBean.selectedUser.pmCountry.countryId}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems
									value="#{profileManagementBackingBean.getCountryList()}"
									var="countrylist" itemLabel="#{countrylist.countryName}"
									itemValue="#{countrylist.countryId}" />
							</p:selectOneMenu> <p:message id="somNationalityMsg" for="somNationality"
								display="icon" /></td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.designation']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:inputText styleClass="ppDisplayTextL" maxlength="30"
								id="itDesignation"
								required="#{!empty param['disableValidation']}"
								label="#{lbl['lbl.pm.profiles.userdetails.designation']}"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.designation}" />
							<p:message id="itDesignationMsg" for="itDesignation"
								display="icon" /></td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.promanagement']}" />
						</th>
						<td><p:selectOneRadio
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.PMP}">
								<f:selectItems
									value="#{profileManagementBackingBean.getYesNoOptions()}" />
							</p:selectOneRadio></td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.grade']}" /></th>
						<td><p:inputText styleClass="ppDisplayTextL"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.grade}"
								maxlength="10" /> &#160;&#160; <p:graphicImage id="giUserGrade"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="giUserGrade"
								value="#{lbl['lbl.pm.profiles.userdetails.grade.tooltip']}"
								showEffect="fade" hideEffect="fade" /></td>
						<th></th>
						<td></td>
					</tr>
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.email']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></th>
						<td><p:inputText id="itEmail"
								required="#{!empty param['disableValidation']}" maxlength="80"
								label="#{lbl['lbl.pm.profiles.userdetails.email']}"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.email}"
								styleClass="ppDisplayTextL"
								validatorMessage="#{lbl['lbl.pm.profiles.invalidEmail']}">
								<f:validateRegex disabled="#{empty param['disableValidation']}"
									pattern="^[_A-Za-z0-9-\+]+(\.[_A-Za-z0-9-]+)*@[A-Za-z0-9-]+(\.[A-Za-z0-9]+)*(\.[A-Za-z]{2,})$" />
							</p:inputText> &#160;&#160; <p:graphicImage id="giEmail"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="giEmail"
								value="#{lbl['lbl.pm.profiles.userdetails.email.tooltip']}"
								showEffect="fade" hideEffect="fade" /> <p:message
								id="itEmailMsg" for="itEmail" display="icon" /></td>
						<th></th>
						<td></td>
					</tr>
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.telno']}" /></th>
						<td><p:inputText id="itTelNo"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.phoneNo}"
								styleClass="ppDisplayTextL" maxlength="12"
								validatorMessage="#{lbl['lbl.pm.profiles.userdetails.telno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText> <p:message id="itTelNoMsg" for="itTelNo" display="icon" /></td>
						<th></th>
						<td></td>
					</tr>
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.faxno']}" /></th>
						<td><p:inputText id="itFaxNo"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.faxNo}"
								styleClass="ppDisplayTextL" maxlength="12"
								validatorMessage="#{lbl['lbl.pm.profiles.userdetails.faxno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText> <p:message id="itFaxNoMsg" for="itFaxNo" display="icon" /></td>
						<th></th>
						<td></td>
					</tr>
					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.mobileno']}" /></th>
						<td><p:inputText id="itMobileNo"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.mobileNo}"
								maxlength="12" styleClass="ppDisplayTextL"
								validatorMessage="#{lbl['lbl.pm.profiles.userdetails.mobileno']} - #{lbl['lbl.pm.profiles.invalidNo']}">
								<f:validateRegex pattern="^-?\d*(\.\d+)?$" />
							</p:inputText> <p:message id="itMobileNoMsg" for="itMobileNo" display="icon" />
						</td>
						<th></th>
						<td></td>
					</tr>

					<tr>
						<th width="20%"><p:outputLabel
								value="#{lbl['lbl.pm.profiles.userdetails.status']}" /></th>
						<td><p:selectOneMenu
								disabled="#{profileManagementBackingBean.managedBean.selectedUser.brandNew or (!profileManagementBackingBean.managedBean.selectedUser.brandNew and profileManagementBackingBean.managedBean.selectedUserOrg.brandNew)}"
								value="#{profileManagementBackingBean.managedBean.selectedUserOrg.recordStatusFlg}"
								styleClass="ppDropDownWidthL">
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								<f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />
								<p:ajax event="change"
									listener="#{profileManagementBackingBean.orgUnitStatusChange()}"
									partialSubmit="true" process="@this"
									update="@this, :form:pUserProfileHeader, :form:tvRoleReceivingAddr" />

							</p:selectOneMenu> &#160;&#160; <p:graphicImage id="giUserStatus"
								value="/css/images/design/tooltips.png" /> <p:tooltip
								for="giUserStatus"
								value="#{lbl['lbl.pm.profiles.userdetails.status.tooltip']}"
								showEffect="fade" hideEffect="fade" /></td>
						<th></th>
						<td></td>
					</tr>

				</table>
			</p:outputPanel>
		</h:panelGrid>
		<ac:lovPopup />
	</p:panel>

	<!-- Upload Image Popup -->
	<ui:include
		src="/xhtml/pm/profilemanagement/common/uploadPortrait.xhtml" />
</ui:composition>
