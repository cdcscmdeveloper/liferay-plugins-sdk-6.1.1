<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
<h:form id="f">	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="search" style="width:100%;">
	</h:panelGrid>
     
			<p:tabView>
				<p:tab id="definedSearch" title="Defined Search">
				   <ui:include src="/xhtml/pm/profilemanagement/userDefinedSearch.xhtml" />
		 		</p:tab>
	<!--			<p:tab id="advancedSearch" title="Advanced Search">
				   <ui:include src="/xhtml/pm/profilemanagement/userAdvancedSearch.xhtml" />					
				</p:tab> -->			
			</p:tabView>
				
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search" action="#{userprofilesBackingBean.retriveUserProfile}"
			update="searchProfile" />
            <p:commandButton value="Reset" type="reset" icon="ui-icon-reset" update="searchProfile" process="@this" 
            actionListener="#{userprofilesBackingBean.reset}">
            </p:commandButton>
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchProfile" value="#{userprofilesBackingBean.managedBean.users}" var="userprofile" editable="true">
 	<ac:paginator for="searchProfile" />
    
				
 
       <p:column headerText="#{lbl['lbl.pm.profiles.search.result.loginid']}"> 
        <h:outputText value="#{userprofile.loginId}" style="width:15%" /> 
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.profiles.search.result.username']}">
        <h:outputText value="#{userprofile.userName}" style="width:25%" />  
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.profiles.search.result.cityname']}">
        <h:outputText value="#{userprofile.pmAddressTypes[0].pmAddress.pmCity.cityName}" style="width:20%" />
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.profiles.search.result.statename']}">
        <h:outputText value="#{userprofile.pmAddressTypes[0].pmAddress.pmState.stateName}" style="width:20%" />  
       </p:column>
    
       <p:column headerText="#{lbl['lbl.pm.profiles.search.result.status']}" style="width:10%"> 
	    <p:selectOneMenu style="width:150px">  
       		<f:selectItem itemLabel="Active" itemValue="1" /> 
      		<f:selectItem itemLabel="Non-Active" itemValue="2" />  
         </p:selectOneMenu> 
       </p:column>
    <p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}" style="width:5%">
    <p:commandLink action="#{userprofilesBackingBean.goToMaintainceAction(userprofile)}">
     <p:graphicImage library="ep/images/design" name="edit.png"
      value="/resources/ep/images/design/edit.png" />
    </p:commandLink>
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="Create" style="float:right;" action="#{userprofilesBackingBean.createUserProfiles()}" ajax="false"
       	 icon="ui-icon-add" />
	 </h:panelGrid>	
	</p:panel>
</h:form>
</ui:composition>
