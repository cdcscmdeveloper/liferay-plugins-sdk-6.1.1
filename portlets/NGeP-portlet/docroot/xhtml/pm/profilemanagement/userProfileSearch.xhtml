<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
<h:form id="f">	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="search" style="width:100%;">
	</h:panelGrid>
     
			<p:tabView>
				<p:tab id="definedSearch" title="DEFINED SEARCH">
				   <ui:include src="/xhtml/pm/profilemanagement/userDefinedSearch.xhtml" />
				</p:tab>
				<p:tab id="advancedSearch" title="ADVANCED SEARCH">
				   <ui:include src="/xhtml/pm/profilemanagement/userAdvancedSearch.xhtml" />					
				</p:tab>			
			</p:tabView>
				
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search" action="#{userprofilesBackingBean.retriveUserProfile}"
			update="searchProfile" />
            <p:commandButton value="Reset" type="reset" icon="ui-icon-reset" update="searchProfile" process="@this" 
            actionListener="#{userprofilesBackingBean.reset}">
            </p:commandButton>
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchProfile" value="#{userprofilesBackingBean.managedBean.users}" var="userprofile" editable="true">
 	<ac:paginator for="searchProfile" />
    <p:ajax event="rowEdit" listener="#{userprofilesBackingBean.goToMaintainceAction}" />  
    <p:ajax event="rowEditCancel"/> 
				
 
       <p:column headerText="Login ID" > 
        <h:outputText value="#{userprofile.loginId}" />
       </p:column>
       
       <p:column headerText="User Name" >
        <h:outputText value="#{userprofile.userName}" />  
       </p:column>
       
       <p:column headerText="City Name" >
        <h:outputText /> 
       </p:column>
       
       <p:column headerText="State Name" >
        <h:outputText />    
       </p:column>
    
       <p:column headerText="Status"> 
        <h:outputText />
       </p:column>
    <p:column headerText="Action">
    <p:commandLink action="#{userprofilesBackingBean.goToMaintainceAction(profile)}">
     <p:graphicImage library="ep/images/design" name="edit.png"
      value="/resources/ep/images/design/edit.png" />
    </p:commandLink>
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="Create" style="float:right;" action="userProfileCreation.xhtml?faces-redirect=true" ajax="false"
       	 icon="ui-icon-add" />
	 </h:panelGrid>	
	</p:panel>
</h:form>
</ui:composition>
