<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="search" style="width:100%;">
	</h:panelGrid>
     
			<p:tabView>
				<p:tab id="definedSearch" title="DEFINED SEARCH">
				   <ui:include src="/xhtml/pm/profilemanagement/userDefinedSearch.xhtml" />
				</p:tab>
				<p:tab id="advancedSearch" title="ADVANCED SEARCH">
				   <ui:include src="/xhtml/pm/profilemanagement/userAdvancedSearch.xhtml" />					
				</p:tab>			
			</p:tabView>
				
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search"></p:commandButton>
            <p:commandButton value="Reset" icon="ui-icon-reset"></p:commandButton>
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchProfile"  value="" var="userprofile" editable="true">
 			<ac:paginator />
    <p:ajax event="rowEdit" />  
    <p:ajax event="rowEditCancel"/> 
				
 
       <p:column headerText="Login ID" > 
        <p:cellEditor>
         <f:facet name="output"> 
          <h:outputText value="10101010"/>
         </f:facet> 
         <f:facet name="input"> 
          <h:outputText value="10101010"/>
         </f:facet>
        </p:cellEditor>
       </p:column>
       
       <p:column headerText="User Name" >
        <p:cellEditor>
         <f:facet name="output">  
          <h:outputText value="PTJ 002"/>
         </f:facet> 
		 <f:facet name="input"> 
          <h:outputText value="PTJ 002"/>
         </f:facet>         
        </p:cellEditor>   
       </p:column>
       
       <p:column headerText="City Name" >
        <p:cellEditor> 
         <f:facet name="output"> 
          <h:outputText value="Kuala Lumpur"/> 
         </f:facet>
         <f:facet name="input"> 
          <h:outputText value="Kuala Lumpur"/>
         </f:facet>  
        </p:cellEditor> 
       </p:column>
       
     <p:column headerText="State Name" >
      <p:cellEditor> 
       <f:facet name="output"> 
         <h:outputText value="WP"/> 
       </f:facet> 
       <f:facet name="input"> 
          <h:outputText value="WP"/>
         </f:facet> 
      </p:cellEditor>    
    </p:column>
    
     <p:column headerText="Status"> 
        <h:outputText value="Active"/>
    </p:column>
    <p:column headerText="#{lbl['lbl.sc.committe.resulttable.action']}">
	<p:rowEditor />
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="Create" style="float:right;" action="userProfileCreation.xhtml?faces-redirect=true" ajax="false"
       	 icon="ui-icon-add" />
	 </h:panelGrid>	
	</p:panel>

</ui:composition>
