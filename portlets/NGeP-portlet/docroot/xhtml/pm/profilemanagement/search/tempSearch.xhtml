<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<ui:define name="contentSection">
	
		<!-- Validation Message -->
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<!-- Search User -->
		<p:outputPanel id="opDefinedSearch">
				<br/>
				<table class="ppTwoTable">
					<tr>
						<th width="20%">
							<p:outputLabel value="Login ID"/>
						</th>
						<td>
							<p:inputText styleClass="ppDisplayTextM" value="#{profileManagementBackingBean.managedBean.userNames}" maxlength="75"/>
						</td>
						<th>&#160;</th>
						<td>&#160;</td>
					</tr>
					<tr>
						<td colspan="4">
							<div class="ppRightBtn">
								<p:commandButton value="#{lbl['lbl.btn.search']}" 
									action="#{profileManagementBackingBean.tempSearchUserProfile()}"
									update="dtUserResult2" />
						  	</div>
						</td>
					</tr>
				</table>
				
				<br/>
			
				<!-- User Result -->
				<p:dataTable id="dtUserResult2" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						value="#{profileManagementBackingBean.managedBean.result}"
						var="result">
						<p:column headerText="PM" width="15%">
							#{result[0]}
						</p:column>
						<p:column headerText="LIFERAY" width="15%">
							#{result[1]}
						</p:column>
						<p:column headerText="LDAP" width="15%">
							#{result[2]}
						</p:column>
				</p:dataTable>
  
	 	</p:outputPanel>
	</ui:define>
</ui:composition>
