<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opDefinedSearch">
		<table class="ppTwoTable">
			
		    <tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.org.category']}" /><p:outputLabel
								value="*" styleClass="mandatory" /></th>
				<td><p:selectOneRadio id="sorOrgCategory" layout="custom" 
						value="#{profileManagementBackingBean.managedBean.searchOrgCategory}"
						label="#{lbl['lbl.pm.org.category']}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.federal.government']}" itemValue="#{profileManagementBackingBean.federalGovt}"/>
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}" itemValue="#{profileManagementBackingBean.others}"/>
						<p:ajax process="@this,orgCategoryPanelGrid" event="change" 
							onstart="blockWidget.show()" 
							oncomplete="blockWidget.hide()" 
							update=":form:opDefinedSearch, :form:dtUserResult" 
							listener ="#{profileManagementBackingBean.resetUserProfileSearchBean}"/>
					</p:selectOneRadio>
					<h:panelGrid id="orgCategoryPanelGrid" columns="4">
			            <p:radioButton id="sorFederalGovn" for="sorOrgCategory" itemIndex="0" />
			            <h:outputLabel styleClass="commonLabel" for="sorFederalGovn" value="#{lbl['lbl.pm.org.federal.government']}" />			       
			 
			            <p:radioButton id="sorOthers" for="sorOrgCategory" itemIndex="1" />
			            <h:outputLabel styleClass="commonLabel" for="sorOthers" value="#{lbl['lbl.pm.org.others']}" />			          
			            
		       	 	</h:panelGrid>
					</td>			
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /><p:outputLabel
								value="*" styleClass="mandatory" /></th>
				<td><p:outputPanel id="somType"><p:selectOneMenu id="somFederalOrgType" disabled="#{profileManagementBackingBean.managedBean.disabledOrgFields}"
						rendered="#{profileManagementBackingBean.managedBean.searchOrgCategory eq profileManagementBackingBean.federalGovt}" 
						styleClass="ppDropDownWidthL" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;width:225px"
						value="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{profileManagementBackingBean.managedBean.orgTypeList}" />
							<p:ajax event="change" listener="#{profileManagementBackingBean.clearOrgNameAndRoleLovSearchFields()}" 
				     			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"  update=":form:opDefinedSearch"/> 
					</p:selectOneMenu>
					<p:selectOneMenu id="somOtherOrgType" disabled="#{profileManagementBackingBean.managedBean.disabledOrgFields}"
							rendered="#{profileManagementBackingBean.managedBean.searchOrgCategory eq profileManagementBackingBean.others}" 
							styleClass="ppDropDownWidthL" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;width:225px"
							value="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{profileManagementBackingBean.managedBean.orgTypeList}" />
							<p:ajax event="change" listener="#{profileManagementBackingBean.clearOrgNameAndRoleLovSearchFields()}" 
				     			onstart="blockWidget.show()" oncomplete="blockWidget.hide()"  update=":form:opDefinedSearch"/> 
					</p:selectOneMenu>
					</p:outputPanel></td>
			
			</tr>
			<tr>
					
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.search.orgname']}"/></th>
			<td>
				<p:outputPanel id="opFfcOrgCode" rendered="#{ParameterConst.orgTypeFactoring eq profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <ac:lov id="lovFfcOrg" lovId="PM_ORG_PROFILE_FFC" size="60" 
		            	readonly="true" disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null or profileManagementBackingBean.managedBean.disabledOrgFields}"
						headerText="#{profileManagementBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, profileManagementBackingBean.managedBean.selectedOrgType.parameterCode)}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.finOrgName}" 
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForOrgName"
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}" 
						displayResultWhenFirstLoad="false" displayResultWhenReset="false"/>
						<p:message id="lovFfcOrgMsg" for="lovFfcOrg" display="icon" />
				</p:outputPanel>
				<p:outputPanel id="opSupOrgCode" rendered="#{ParameterConst.orgTypeSupplier eq profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <ac:lov id="lovSupOrg" lovId="PM_ORG_PROFILE_WITH_SUPPLIER" size="60"
		            	readonly="true" disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null or profileManagementBackingBean.managedBean.disabledOrgFields}"
						headerText="#{profileManagementBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, profileManagementBackingBean.managedBean.selectedOrgType.parameterCode)}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}" 
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForOrgName"
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}" 
						displayResultWhenFirstLoad="false" displayResultWhenReset="false"/>
						<p:message id="lovSupOrgMsg" for="lovSupOrg" display="icon" />
				</p:outputPanel>
				<p:outputPanel id="opPtjOrgCode" 
					rendered="#{ParameterConst.orgTypePtj eq profileManagementBackingBean.managedBean.selectedOrgType.parameterCode or 
					ParameterConst.orgTypePtjGroup eq profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <p:inputText 
						size="60"
						id="itSelectedPtj" 
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}" 
						readonly="true"
						/>
					&#160;	
					<p:commandLink id="ptjSearchCL" partialSubmit="true"
						disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null or profileManagementBackingBean.managedBean.disabledOrgFields}"
						process="@this" update=":form:orgProfileCcId:ptjPopup"
						action="#{organisationSearchBackingBean.initPtjPopup}"
						oncomplete="ptjPopup.show();" >
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
					</p:commandLink>
				</p:outputPanel>
				<p:outputPanel id="opOrgCode" 
					rendered="#{ParameterConst.orgTypeFactoring ne profileManagementBackingBean.managedBean.selectedOrgType.parameterCode 
							and ParameterConst.orgTypeSupplier ne profileManagementBackingBean.managedBean.selectedOrgType.parameterCode
							and ParameterConst.orgTypePtj ne profileManagementBackingBean.managedBean.selectedOrgType.parameterCode
							and ParameterConst.orgTypePtjGroup ne profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				   <ac:lov id="lovMinistry1" lovId="PM_ORG_PROFILE" size="60" 
			        	disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null or profileManagementBackingBean.managedBean.disabledOrgFields}"
		            	readonly="true"
						headerText="#{profileManagementBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, profileManagementBackingBean.managedBean.selectedOrgType.parameterCode)}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}" 
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForOrgName"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}"
						displayResultWhenFirstLoad="false" displayResultWhenReset="false"/>						
		         	<p:message id="lovMinistryMsg" for="lovMinistry1" display="icon" />
				</p:outputPanel>
				
			</td>
			</tr>
			<!-- 12852 Start -->
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextS"  size="38" maxlength="15" style="width:11%" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.identificationNo}"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<!-- 12852 End -->
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.name']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" size="38" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userName}" maxlength="80"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.role']}"/>
				</th>
				<td>
					<p:inputText 
						size="38"
						id="itSelectedRoleDesc" 
						value="#{not empty(profileManagementBackingBean.managedBean.selectedRoleDesc) ? profileManagementBackingBean.managedBean.selectedRoleDesc.roleName :''}" 
						readonly="true"
						/>
					&#160;	
					<p:commandLink id="roleSearchCL" partialSubmit="true"
						process="@this" update="roleSearchPanel,roleResultPanel"
						action="#{profileManagementBackingBean.resetRoleSearchAction}"
						disabled="#{profileManagementBackingBean.managedBean.selectedOrgType eq null or 
		            	profileManagementBackingBean.managedBean.selectedOrgType.parameterId eq null }"
						oncomplete="roleSearchPopUp.show();" >
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
					</p:commandLink>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.user.status']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" 
						style="width:225px;"
						value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userOrgStatus}">  
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.authorisation.role.status']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userRoleStatus}"
						style="width:225px;"
						disabled="#{profileManagementBackingBean.managedBean.selectedRoleDesc eq null}">
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" action="#{profileManagementBackingBean.searchUserProfile}"
							update=":form:dtUserResult" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
				        <p:commandButton value="#{lbl['lbl.btn.reset']}"  update=":form:opDefinedSearch, :form:dtUserResult" 
				           	action="#{profileManagementBackingBean.resetUserProfileSearchBean}" onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/>
				  	</div>
				</td>
			</tr>
		</table>
		  <ac:lovPopup />
		  <h:panelGroup rendered="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterCode eq ParameterConst.orgTypePtj
		  		or profileManagementBackingBean.managedBean.selectedOrgType.parameterCode eq ParameterConst.orgTypePtjGroup}">
			  <ac:ptjPopup 
			  	id="orgProfileCcId"
			  	orgTypeParamCode="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}"
			  	okAction="profileManagementBackingBean.selectPtjAction"
			  	update=":form:opDefinedSearch"  />
		  </h:panelGroup>
		  	<ui:include src="/xhtml/pm/profilemanagement/common/roleSearchPopUp.xhtml" />
 	</p:outputPanel>
</ui:composition>
