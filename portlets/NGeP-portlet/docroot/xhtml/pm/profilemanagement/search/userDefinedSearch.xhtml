<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opDefinedSearch">
		<br/>
		<table class="ppTwoTable">
			
		    <tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.org.category']}" /></th>
				<td><p:selectOneRadio value="#{profileManagementBackingBean.managedBean.searchOrgCategory}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.federal.government']}" itemValue="#{profileManagementBackingBean.federalGovt}"/>
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}" itemValue="#{profileManagementBackingBean.others}"/>
						<p:ajax process="@this" event="change" partialSubmit="true" update=":form:opDefinedSearch, :form:dtUserResult" listener ="#{profileManagementBackingBean.resetUserProfileSearchBean}"/>
					</p:selectOneRadio></td>
			
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /></th>
				<td><p:outputPanel id="somType"><p:selectOneMenu id="somFederalOrgType"
						rendered="#{profileManagementBackingBean.managedBean.searchOrgCategory eq profileManagementBackingBean.federalGovt}" 
						styleClass="ppDropDownWidthL" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;"
						value="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{profileManagementBackingBean.getOrgTypeDropdownValues()}" />
							<p:ajax event="change" listener="#{profileManagementBackingBean.clearOrgNameAndRoleLovSearchFields()}" 
				     		update=":form:opDefinedSearch"/> 
					</p:selectOneMenu>
					<p:selectOneMenu id="somOtherOrgType" 
							rendered="#{profileManagementBackingBean.managedBean.searchOrgCategory eq profileManagementBackingBean.others}" 
							styleClass="ppDropDownWidthL" label="#{lbl['lbl.pm.organisation.orgType']}" style="margin-bottom: 5px;"
							value="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{profileManagementBackingBean.getOrgTypeDropdownValues()}" />
							<p:ajax event="change" listener="#{profileManagementBackingBean.clearOrgNameAndRoleLovSearchFields()}" 
				     		update=":form:opDefinedSearch"/> 
					</p:selectOneMenu>
					</p:outputPanel></td>
			
			</tr>
			<tr>
					
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.search.orgname']}"/></th>
							
				<td>
				<p:outputPanel id="opFfcOrgCode" rendered="#{ParameterConst.orgTypeFactoring eq profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <ac:lov id="lovFfcOrg" lovId="PM_ORG_PROFILE_FFC" size="29" 
		            	update=":form:opDefinedSearch" 
		            	readonly="true" disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.finOrgName}" 
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForOrgName"
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}" />
						<p:message id="lovFfcOrgMsg" for="lovFfcOrg" display="icon" />
				</p:outputPanel>
				<p:outputPanel id="opSupOrgCode" rendered="#{ParameterConst.orgTypeSupplier eq profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				    <ac:lov id="lovSupOrg" lovId="PM_ORG_PROFILE_WITH_SUPPLIER" size="29"
		            	update=":form:opDefinedSearch" 
		            	readonly="true" disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}" 
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForOrgName"
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}" />
						<p:message id="lovSupOrgMsg" for="lovSupOrg" display="icon" />
				</p:outputPanel>
				<p:outputPanel id="opOrgCode" rendered="#{ParameterConst.orgTypeFactoring ne profileManagementBackingBean.managedBean.selectedOrgType.parameterCode and ParameterConst.orgTypeSupplier ne profileManagementBackingBean.managedBean.selectedOrgType.parameterCode}">
				   <ac:lov id="lovMinistry1" lovId="PM_ORG_PROFILE" size="29" 
			        	disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null}"
		            	update=":form:opDefinedSearch" readonly="true"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}" 
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForOrgName"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}"/>						
		         	<p:message id="lovMinistryMsg" for="lovMinistry1" display="icon" />
				</p:outputPanel>
				
			</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM"  maxlength="12" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.identificationNo}"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.name']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userName}" maxlength="100"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.role']}"/>
				</th>
				<td>
				<ac:lov id="lovRoleDesc" lovId="PM_ROLE_DESC" size="29" 
		            	update=":form:opDefinedSearch" readonly="true" 
		            	disabled="#{profileManagementBackingBean.managedBean.selectedOrgType eq null or 
		            	profileManagementBackingBean.managedBean.selectedOrgType.parameterId eq null }"
						headerText="#{lbl['lbl.pm.profiles.authorisation.role.opt']}"
						saveObject="profileManagementBackingBean.managedBean.selectedPmRoleDesc"
						value="#{profileManagementBackingBean.managedBean.selectedPmRoleDesc.roleName}" 
						postUpdateListener="profileManagementBackingBean.updateSearchCriteriaForRole"
						conditionField="recordStatus^1|pmRole.pmOrgRoles.orgType.parameterId^#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId}|#{profileManagementBackingBean.roleDecriptionFilter}" 
						/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.user.status']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" 
						value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userOrgStatus}">  
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.authorisation.role.status']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userRoleStatus}"
						disabled="#{profileManagementBackingBean.managedBean.selectedPmRoleDesc eq null or 
							profileManagementBackingBean.managedBean.selectedPmRoleDesc.roleName eq null}">
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" action="#{profileManagementBackingBean.searchUserProfile}"
							update=":form:dtUserResult" />
				        <p:commandButton value="#{lbl['lbl.btn.reset']}"  update=":form:opDefinedSearch, :form:dtUserResult" 
				           	action="#{profileManagementBackingBean.resetUserProfileSearchBean}"/>
				  	</div>
				</td>
			</tr>
		</table>
		  <ac:lovPopup />
 	</p:outputPanel>
</ui:composition>
