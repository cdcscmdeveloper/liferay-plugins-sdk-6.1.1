<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="opDefinedSearch">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.orgtype']}"/><p:outputLabel
								value="*" styleClass="mandatory" />
				</th>
				<td width="55%" style="white-space:nowrap;">
				
					<p:selectOneMenu value="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId}" required="true"
						styleClass="ppDropDownWidthM" id="somOrgType"   
						label="#{lbl['lbl.pm.ta.org.type.name']}">  
						<f:selectItems value="#{profileManagementBackingBean.getDropdownValuesBySearchBean(ParameterTypeConst.organisationTypes, profileManagementBackingBean.orgTypeSearchBean)}" />   
				     	<p:ajax event="change" listener="#{profileManagementBackingBean.clearOrgNameAndRoleLovSearchFields()}" 
				     		update=":form:opDefinedSearch"/> 
		            </p:selectOneMenu>	
	            <p:message id="somOrgTypeMsg" for="somOrgType" display="icon" />
						</td>
					
					</tr>
					<tr>
					
				<th width="20%"><p:outputLabel value="#{lbl['lbl.pm.profiles.search.orgname']}"/><p:outputLabel
								value="*" styleClass="mandatory" /></th>
							
				<td><ac:lov id="lovMinistry1" lovId="PM_ORG_PROFILE" size="29" required="true"
			        	disabled="#{profileManagementBackingBean.managedBean.selectedOrgType.parameterId==null}"
		            	update=":form:opDefinedSearch" readonly="true"
						headerText="#{lbl['lbl.pm.profiles.authorisation.org.lov']}"
						value="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}" 
						saveObject="profileManagementBackingBean.managedBean.selectedOrgProfile"
						postUpdateListener="#{profileManagementBackingBean.updateSearchCriteriaForOrgName()}"
						conditionField="#{profileManagementBackingBean.constructConditionFields()}"/>
						
		         	<p:message id="lovMinistryMsg" for="lovMinistry1" display="icon" />
			</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM"  maxlength="12" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.identificationNo}"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.name']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userName}" maxlength="100"/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.role']}"/>
				</th>
				<td>
				<ac:lov id="lovRoleDesc" lovId="PM_ROLE_DESC" size="29" 
		            	update=":form:opDefinedSearch" readonly="true" disabled="#{profileManagementBackingBean.managedBean.selectedOrgProfile.pmOrgValidity == null}"
						headerText="#{lbl['lbl.pm.profiles.authorisation.role.opt']}"
						saveObject="profileManagementBackingBean.managedBean.selectedPmRoleDesc"
						value="#{profileManagementBackingBean.managedBean.selectedPmRoleDesc.roleName}" 
						postUpdateListener="#{profileManagementBackingBean.updateSearchCriteriaForRole()}"
						conditionField="recordStatus^1|pmRole.pmOrgRoles.orgType.parameterId^#{profileManagementBackingBean.managedBean.selectedOrgProfile.orgTypeCode.parameterId}|#{profileManagementBackingBean.roleDecriptionFilter}" 
						/>
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.profiles.search.status']}"/>
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userOrgStatus}">  
		                        <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
		                        <f:selectItem itemLabel="#{lbl['lbl.pm.active']}" itemValue="1" />		   
								<f:selectItem itemLabel="#{lbl['lbl.pm.inactive']}"
									itemValue="0" />
								
				   
	              	</p:selectOneMenu> 
				</td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" action="#{profileManagementBackingBean.searchUserProfile}"
							update=":form:dtUserResult" />
				        <p:commandButton value="#{lbl['lbl.btn.reset']}"  update=":form:opDefinedSearch, :form:dtUserResult" 
				           	action="#{profileManagementBackingBean.resetUserProfileSearchBean}"/>
				  	</div>
				</td>
			</tr>
		</table>
		  <ac:lovPopup />
 	</p:outputPanel>
</ui:composition>
