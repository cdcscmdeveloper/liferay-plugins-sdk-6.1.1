<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	

	<p:panel id="pUserResult" header="#{lbl['lbl.pm.user.result']}" toggleable="true">
		<p:dataTable id="dtUserResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			rowIndexVar="rowIndex"  lazy="true" rows="10"
			value="#{profileManagementBackingBean.userOrgDataModel}"
			var="userProfileList">
			<ac:paginator for="dtUserResult" />
			
			<p:column headerText="#{lbl['lbl.pm.profiles.search.orgname']}" style="width :25%;white-space : normal">			
				#{userProfileList[8]}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.idno']}" style="width :10%;white-space : normal">
				#{userProfileList[1]}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.search.result.username']}" style="width :20%;white-space : normal">
				#{userProfileList[2]}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.userdetails.designation']}" style="width :10%;white-space : normal">
				#{userProfileList[3]}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.search.user.status']}" width="10%">
				#{(userProfileList[4]==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.created.date']}" style="width :10%;white-space : normal">
				<h:outputText value="#{userProfileList[5]}" style="float:left;">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.profiles.search.role']}" style="width:5%;text-align:center;">
				<p:commandLink  action="#{profileManagementBackingBean.getListOfAssignedRoles(userProfileList[7])}" oncomplete="dlRoleList.show();" update=":form:opRoleList" >
					<p:graphicImage value="/css/images/design/ico-user-role.png"/>
				</p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink  action="#{profileManagementBackingBean.redirectToMaintainUser(userProfileList[6], userProfileList[7])}" >
					<p:graphicImage value="/css/images/design/edit.png"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}" action="#{profileManagementBackingBean.redirectToMaintainUser(null,null)}" partialSubmit="true" process="@this"/>
	</div>
    <!-- Role list Popup -->
	<ui:include src="/xhtml/pm/profilemanagement/common/assignedRolesToPopUp.xhtml" />
</ui:composition>
