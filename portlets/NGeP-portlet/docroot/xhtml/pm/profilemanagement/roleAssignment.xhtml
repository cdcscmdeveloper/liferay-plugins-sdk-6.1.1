<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel styleClass="receivingAddUpdate">	
	<p:tabView>	
	  <p:tab title="ROLES">  
		<p:dataTable editable="true" style="width:100%">
		  	        	  
	    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}" >
          <h:outputText />
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.apprlimit']}" > 
          <h:outputText />  
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.Status']}" > 
		  <p:selectOneMenu style="width:100px">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Active" itemValue="1" /> 
            <f:selectItem itemLabel="Non-Active" itemValue="2" />  
          </p:selectOneMenu>            
        </p:column>

		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		<p:commandButton
		  value="#{lbl['lbl.so.addbtn']}" process="@this"
		  oncomplete="roleReceiving.show();"
		  icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       
		</div>	  
      </p:tab>  
      	
	  <p:tab title="RECEIVING ADDRESS">	
		<p:dataTable editable="true" style="width:100%" widgetVar="receivingAddService">	          
        
	    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.addname']}" > 
        </p:column>
        <p:column headerText="Status" > 
        </p:column>
		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
		     oncomplete="receivingAddress.show();" icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       </div>
      </p:tab> 	  	      
    </p:tabView>      		
	</p:panel>
</ui:composition>
