<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>	
	<p:tabView>	
	  <p:tab title="ROLES">
	    <p:dataTable id="roleAssignTable" value="#{userprofilesManagedBean.rolelists}" var="RoleList"  >
		<ac:paginator />
		<p:column>
	    <p:selectBooleanCheckbox/> 
	    </p:column>
	    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}" > 
          <h:outputText value="#{RoleList.roleName}" />
        </p:column>
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.apprplan']}" > 
          <h:outputText value="#{RoleList.roleTypes}" />   
        </p:column>
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.apprlimit']}" > 
          <h:outputText value="#{RoleList.apprLimit}" />  
        </p:column>
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.Status']}" > 
          <h:outputText value="#{RoleList.roleStatus}" />  
        </p:column>

		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" oncomplete="rolescreen.show();"  icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       
		</div>	  
      </p:tab>  
      	
	  <p:tab title="RECEIVING ADDRESS">	
	    <p:dataTable id="recAddTable" value="#{userprofilesManagedBean.addressListss}" var="AddressList"  >
		<ac:paginator />
		<p:column>
	    </p:column> 
	    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.addname']}" > 
          <h:outputText value="#{AddressList.addressName}" />
        </p:column>
        <p:column headerText="Status" > 
          <h:outputText value="#{lbl['lbl.pm.profiles.authorisation.Status']}" />   
        </p:column>
		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" oncomplete="receivingaddress.show();" icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       </div>
      </p:tab> 	  	      
    </p:tabView>      		
	</p:panel>
</ui:composition>
