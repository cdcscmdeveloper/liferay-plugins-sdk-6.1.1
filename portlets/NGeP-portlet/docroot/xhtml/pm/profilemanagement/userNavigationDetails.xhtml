<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="8">			
			<h:outputLabel value="#{lbl['lbl.pm.profiles.navigation.userid']}" />  
			<p:inputText value="#{userprofilesBackingBean.managedBean.user.userId}" disabled="true" size="20" />
		
            <h:outputLabel value="#{lbl['lbl.pm.profiles.navigation.username']}" />
             <p:columnGroup>
              <p:inputText value="Mrs" disabled="true" size="20" />&#160;&#160;
		      <p:inputText value="#{userprofilesBackingBean.managedBean.user.userName}" disabled="true" size="40" />                
             </p:columnGroup>
                
 			<h:outputLabel value="#{lbl['lbl.pm.profiles.navigation.designation']}" />  
			<p:inputText value="#{userprofilesBackingBean.managedBean.user.designation}" disabled="true" size="30" />
			    
			<h:outputLabel value="#{lbl['lbl.pm.profiles.navigation.grade']}" />  
	        <p:inputText value="#{userprofilesBackingBean.managedBean.user.grade}" disabled="true" size="10" />			                                
	    </h:panelGrid>	
	</p:panel>
</ui:composition>
