<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="RESPONSIBLE ORG. UNIT" toggleable="true">
	   <p:dataTable>   
		   
	    <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.orgtype']}" >
		   <p:selectOneMenu style="width:206px;margin-bottom:5px;"> 
	     
        </p:column>	 
           	
	    <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.code']}" > 
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.name']}" > 
           <h:outputText />   
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.effdate']}" > 
		  <p:calendar  
			showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.expdate']}" > 
		  <p:calendar 
			showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.userdetails.status']}" > 
		       <p:selectOneMenu style="width:100px">  
            	<f:selectItem itemLabel="Select One" itemValue="" />  
            	<f:selectItem itemLabel="Active" itemValue="1" /> 
            	<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              </p:selectOneMenu>         
        </p:column>        

		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       
		</div>
	</p:panel>
	
	<p:tabView>	
	  <p:tab title="ROLES">  
	    <p:dataTable>
		  
        <ac:paginator for="roleAssignTable"></ac:paginator>
		<p:column selectionMode="multiple" style="width:2%"></p:column>	 
		  
	    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}" > 
          <h:outputText />
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.apprlimit']}" > 
          <h:outputText />  
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.Status']}" > 
		  <p:selectOneMenu style="width:100px">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Active" itemValue="1" /> 
            <f:selectItem itemLabel="Non-Active" itemValue="2" />  
          </p:selectOneMenu>            
        </p:column>

		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       
		</div>	  
      </p:tab>  
      	
	  <p:tab title="RECEIVING ADDRESS">	
	    <p:dataTable>
		<ac:paginator />
		<p:column>
	    </p:column> 
	    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.addname']}" > 
          <h:outputText  />
        </p:column>
        <p:column headerText="Status" > 
          <h:outputText value="" />   
        </p:column>
		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       </div>
      </p:tab> 	  	      
    </p:tabView>      		
	</p:panel>
	
	<p:panel header="ATTACHMENTS" toggleable="true">
    <h:panelGrid columns="2" >	
    
    <h:outputLabel value="#{lbl['lbl.pm.profiles.authorisation.attachment']}"></h:outputLabel>
    <p:fileUpload fileUploadListener="#{userprofilesBackingBean.handleFileUpload}" mode="advanced"   
            update="messages" sizeLimit="1000000" allowTypes="/(\.|\/)(gif|jpe?g|png)$/"/>  
 
    <p:growl id="messages" showDetail="true"/>
    
    
    </h:panelGrid>    

    		
	</p:panel>		
</ui:composition>
