<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
<h:form id="f">	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="search" style="width:100%;">
	</h:panelGrid>
	<p:panel>

		<h:panelGrid columns="2" >

			<h:outputLabel value="criteria desc"></h:outputLabel>
			<p:inputText size="30" />
						
		</h:panelGrid>
 </p:panel>
			
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search" 
			update="searchCriteria" />
            <p:commandButton value="Reset" icon="ui-icon-reset">
            </p:commandButton>
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchCriteria" value="" 
	  var="criteriaList" editable="true">
 	<ac:paginator />
    
       
       <p:column headerText="criteria des ID">
        <h:outputText />  
       </p:column>
       
       <p:column headerText="criteria ID">
        <h:outputText />  
       </p:column>
       
       <p:column headerText="Language Code">
        <h:outputText />    
       </p:column>
    
       <p:column headerText="Criteria"> 
        <h:outputText />
       </p:column>
    <p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}">
    <p:commandLink>
     <p:graphicImage library="ep/images/design" name="edit.png"
      value="/resources/ep/images/design/edit.png" />
    </p:commandLink>
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="Create" icon="ui-icon-add" />
	 </h:panelGrid>	
	</p:panel>
</h:form>
</ui:composition>
