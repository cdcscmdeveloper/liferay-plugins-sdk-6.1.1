<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<p:panel header="RESPONSIBLE ORG. UNIT" toggleable="true">
	   <p:dataTable id="orgUnitId" var="orgUnitList" 
	     value="#{userprofilesBackingBean.managedBean.orgUnits}"
	     styleClass="orgUnitId" rowIndexVar="index">   
		   
	    <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.orgtype']}" >
		   <p:selectOneMenu  
		      style="width:206px;margin-bottom:5px;"> 
             <f:selectItem itemLabel="Select One" itemValue="" />  		       
		     <f:selectItems
			 	value="#{userprofilesBackingBean.retrieveParameterDescByType(ParameterTypeConst.organisationTypes)}"
				var="orgUnits" itemLabel="#{orgUnits.codeName}"
				itemValue="#{orgUnits.pmParameter.parameterCode}" />  
           </p:selectOneMenu>		     
        </p:column>	 
           	
	    <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.code']}" > 
			 <ac:lov id="orgLov" lovId="PM_ORG_PROFILE"
					headerText="Org Lov"
					saveObject="userprofilesBackingBean.managedBean.orgUnits[#{index}].pmOrgValidity"
					value="#{orgUnitList.pmOrgValidity.orgCode}">
             </ac:lov>  
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.name']}" > 
           <h:outputText value="#{orgUnitList.pmOrgValidity.orgName}" />   
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.effdate']}" > 
		  <p:calendar id="effDateId" value="#{orgUnitList.pmOrgValidity.effDate}"
			showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.expdate']}" > 
		  <p:calendar id="expDateId" value="#{orgUnitList.pmOrgValidity.expDate}"
			showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.userdetails.status']}" > 
		       <p:selectOneMenu style="width:100px">  
            	<f:selectItem itemLabel="Select One" itemValue="" />  
            	<f:selectItem itemLabel="Active" itemValue="1" /> 
            	<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              </p:selectOneMenu>         
        </p:column>        

		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" icon="ui-icon-add" process="@this" partialSubmit="true" 
		    update="orgUnitId" actionListener="#{userprofilesBackingBean.addNewOrgAction}" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       
		</div>
    <ac:lovPopup /> 		
	</p:panel>
</ui:composition>
