<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="RESPONSIBLE ORG. UNIT" toggleable="true">
	    <p:dataTable id="resOrgUnit" value="" var="orgunit" >
	    <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.orgtype']}" > 
		   <p:selectOneMenu style="width:206px;margin-bottom:5px;">  
		     <f:selectItems
			 	value="#{userprofilesBackingBean.retrieveParameterDescByType(ParameterTypeConst.organisationTypes)}"
				var="orgtypelist" itemLabel="#{orgtypelist.codeName}"
				itemValue="#{orgtypelist.pmParameter.parameterCode}" />  
           </p:selectOneMenu>
        </p:column>	 
           	
	    <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.code']}" > 
           <p:inputText value="0" size="5" />&#160;
             <p:columnGroup>                
               <p:commandButton value="..." oncomplete="resorg.show();" style="width:30px" />                                                                            
			 </p:columnGroup>    
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.name']}" > 
           <h:outputText value="Pusat Tanggungjawab KDN"/>   
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.effdate']}" > 
           <p:calendar showOn="button"></p:calendar>
        </p:column>
        
        <p:column headerText="#{lbl['lbl.pm.profiles.resorg.table.expdate']}" > 
           <p:calendar showOn="button"></p:calendar>
        </p:column>

		</p:dataTable>
       <p:spacer height="15"></p:spacer>
		
		<div align="right">
		 <p:commandButton value="Add" oncomplete="resorg.show();"  icon="ui-icon-add" />
        <p:commandButton value="Delete" icon="ui-icon-delete" />
       
		</div>
	</p:panel>
</ui:composition>
