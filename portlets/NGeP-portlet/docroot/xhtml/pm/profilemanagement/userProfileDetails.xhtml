<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">	

	<p:panel header="User Profile" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2">
        <h:panelGroup>		
        
        	
		<table style="width:55%">
	     <tr>
			<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.loginid']}" /></td> 
			<td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.loginId}" disabled="true" size="30" /></td>
		 </tr> 
		 <tr>     	    	        
		   	<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}" />
		   	    <p:outputLabel value="*" styleClass="mandatory" /></td>
		    <td><p:selectOneMenu value="#{userprofilesBackingBean.managedBean.pmUser.salutationCode.parameterCode}" 
		           style="width:180px;margin-bottom:5px;" >  
            	  <f:selectItem itemLabel="Select One" itemValue="" /> 				    		            
			      <f:selectItems
				    value="#{userprofilesBackingBean.retrieveParameterDescByType(ParameterTypeConst.salutations)}"
					var="salutationlist" itemLabel="#{salutationlist.codeName}"
					itemValue="#{salutationlist.pmParameter.parameterCode}" />            	     				    		             
                </p:selectOneMenu></td> 
         </tr>  
         
            <tr>
  			<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.username']}" />
  				<p:outputLabel value="*" styleClass="mandatory" /></td>    
			 <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.userName}" size="30" /></td>                                  
             </tr>    
             
             <tr>  
             <td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idtype']}" />
            	 <p:outputLabel value="*" styleClass="mandatory" /></td>
		     <td><p:selectOneMenu value="#{userprofilesBackingBean.managedBean.pmUser.identificationCode.parameterCode}"
		            style="width:180px;margin-bottom:5px;"> 
		           <f:selectItem itemLabel="Select One" itemValue="" />  	           
				   <f:selectItems
						value="#{userprofilesBackingBean.retrieveParameterDescByType(ParameterTypeConst.identificationTypes)}"
						var="idtypeslist" itemLabel="#{idtypeslist.codeName}"
						itemValue="#{idtypeslist.pmParameter.parameterCode}" />  
                   </p:selectOneMenu></td>
              </tr> 
              
              <tr> 
  			<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /> 
  				<p:outputLabel value="*" styleClass="mandatory" /></td>
			<td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.identificationNo}" size="30" /></td>			                    
              </tr>   
              
              <tr>                 	                   
              <td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.nationality']}" />
              	  <p:outputLabel value="*" styleClass="mandatory" /></td>
		       <td><p:selectOneMenu value="#{userprofilesBackingBean.managedBean.pmUser.pmCountry.countryId}"
		              style="width:180px;margin-bottom:5px;">
            	     <f:selectItem itemValue="#{null}" itemLabel="Select One"/> 		             
					 <f:selectItems
						value="#{userprofilesBackingBean.retrieveCountryList()}"
						var="countrylist" itemLabel="#{countrylist.countryName}"
						itemValue="#{countrylist.countryId}" />  
                   </p:selectOneMenu></td>                                                      
               </tr> 
               
               <tr>    				
  			<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.designation']}" /></td>  
			  <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.designation}" size="30" /></td>
			   </tr>     
			   
			   <tr>   			     			    
              <td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.promanagement']}" /></td>   
          		<td><p:selectOneRadio>  
           			 <f:selectItem itemLabel="Yes" itemValue="#{true}" />  
            		 <f:selectItem itemLabel="No" itemValue="#{false}" />  
       			  </p:selectOneRadio></td> 			    
			    </tr>
			    
			   <tr> 
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.grade']}" /></td>  
			 	<td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.grade}" size="30" /></td>
			   
          	 </tr>        	                  

			 <tr>			    
		        <td><h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.status']}"></h:outputLabel></td>
		        <td><p:selectOneMenu style="width:188px;margin-bottom:5px;">  
            		<f:selectItem itemLabel="Active" itemValue="1" /> 
            		<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              	  </p:selectOneMenu></td>			    
          	 </tr>         	                  
</table>
	   </h:panelGroup>

		<h:panelGroup>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%" columns="1"> 
			<h:graphicImage value="#{userprofilesBackingBean.userImagePath(userprofilesBackingBean.managedBean.pmUser.loginId)}"
			   style="margin-left:25px;" width="140" height="160" />
		</h:panelGrid> 	
         <div align="left">
			<p:commandButton icon="ui-icon-image" value="#{lbl['lbl.pm.profiles.userdetails.changepic']}" />
            <p:commandButton icon="ui-icon-delete" value="#{lbl['lbl.pm.profiles.userdetails.deletepic']}" />
	     </div>                                                 			
 
		</h:panelGroup>

	</h:panelGrid> 
		
    </p:panel>	
    <br />	  
	<p:panel header="ADDRESS AND CONTACT DETAIL" toggleable="true">		                		             				    		   		     
		<table style="width:46%">
			<tr>		    
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.country']}" />
  					<p:outputLabel value="*" styleClass="mandatory" /></td>	  
		        <td><p:selectOneMenu  
		              style="width:180px;margin-bottom:5px;">
            	     <f:selectItem itemValue="#{null}" itemLabel="Select One"/> 		             
					 <f:selectItems
						value="#{userprofileBackingBean.retrieveCountryList()}"
						var="countrylist" itemLabel="#{countrylist.countryName}"
						itemValue="#{countrylist.countryId}" />  
                   </p:selectOneMenu></td>	  
            </tr>
            <tr>       
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressone']}" />
  					<p:outputLabel value="*" styleClass="mandatory" /></td>	  
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.address1}" size="50" /></td>	                    
            </tr>
            <tr>       
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addresstwo']}" /></td>	  
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.address2}" size="50" /></td>	   
			 </tr>
			 <tr>   
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressthree']}" /></td>	  
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.address3}" size="50" /></td>	 
			    </tr>
			    
			    <tr>
  					<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressfour']}" /></td>	  
			    	<td><p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.address4}" size="50" /></td>	 	
			    </tr>
			    <tr>
  					<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.postcode']}" /> 
  						<p:outputLabel value="*" styleClass="mandatory" /></td>	 
			    	<td><p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.postcode}" size="30" /></td>	
			    </tr>			    		    			                     
		</table>
    
		<table style="width:100%">                  
  			<tr>	
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.state']}" />
  					<p:outputLabel value="*" styleClass="mandatory" /></td>  
		        <td><p:selectOneMenu value="#{userprofilesBackingBean.managedBean.stateId}"   
		              style="width:180px;margin-bottom:5px;">
				   <f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
				   <f:selectItems
					  value="#{userprofilesBackingBean.managedBean.stateList}"
					  var="state" itemLabel="#{state.stateName}"
					  itemValue="#{state.stateId}"></f:selectItems>
				   <p:ajax event="change" process="@this" partialSubmit="true"
				      update="districtId"
				      listener="#{userprofilesBackingBean.districtBystate}"></p:ajax>
			       </p:selectOneMenu></td>						
			
                <td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.division']}" />
                	<p:outputLabel value="*" styleClass="mandatory" /></td>  
		        <td><p:selectOneMenu 
		              style="width:180px;margin-bottom:5px;"> 
					 <f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>	          	  
				   </p:selectOneMenu></td>
			</tr>
			<tr>
	            <td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.district']}" />
	            	<p:outputLabel value="*" styleClass="mandatory" /></td> 
		        <td><p:selectOneMenu id="districtId" value="#{userprofilesBackingBean.managedBean.districtId}"
		              style="width:180px;margin-bottom:5px;"> 
					<f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
					<f:selectItems 
						value="#{userprofilesBackingBean.managedBean.districtList}"
						var="district" itemLabel="#{district.districtName}"
						itemValue="#{district.districtId}"></f:selectItems>
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{userprofilesBackingBean.districtCode}"></p:ajax>
				   </p:selectOneMenu></td>	
			
											    						    				              			    
			    <td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.citytown']}" />
			    	<p:outputLabel value="*" styleClass="mandatory" /></td>
		        <td><p:selectOneMenu   
		              style="width:180px;margin-bottom:5px;"> 
		             <f:selectItem itemLabel="Select One" itemValue="" /> 
				   </p:selectOneMenu></td>	
			 </tr>				               
        </table> 	 			   			   			   		    
		    
		 <table style="width:49%">
		 	<tr> 
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.email']}" /></td>  
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.email}" size="30" /></td>
			</tr>    
			<tr>   
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.telno']}" /></td>  
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.phoneNo}" size="30" /></td> 	
			</tr>    		     			    		 			   
			<tr>    
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.faxno']}" /></td> 
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.faxNo}" size="30" /></td>
		    </tr>     
			<tr>    			    
  				<td><p:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.mobileno']}" /></td>  
			    <td><p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.mobileNo}" size="30" /></td>		    			    			    			    			    		    			    			                                          			                     		                                                 
            </tr>
        </table>
	</p:panel>
</ui:composition>
