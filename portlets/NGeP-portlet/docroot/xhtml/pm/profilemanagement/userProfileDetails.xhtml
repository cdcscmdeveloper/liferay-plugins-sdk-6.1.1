<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="User Profile" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="4" columnClasses="columnWidth20">
			
				<h:outputLabel value="User ID" />  
			    <p:inputText  value="#{userprofilesBackingBean.managedBean.pmUser.userId}" disabled="true" size="30" />
		
                <h:outputLabel value="Login ID" />
                <p:inputText value="#{userprofilesBackingBean.managedBean.pmUser.loginId}" disabled="true" size="30" />
                
	    </h:panelGrid>	
	    
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20">	    	        
		        <h:outputLabel value="* Org.Type"></h:outputLabel>
		          <p:selectOneMenu style="width:178px">  
            		<f:selectItem itemLabel="Select One" itemValue="null" />  
            		<f:selectItem itemLabel="Kumpulan PTJ" itemValue="1" /> 
            		<f:selectItem itemLabel="Kumpulan .." itemValue="2" />  
                  </p:selectOneMenu>

		   		<h:outputLabel value="* Salutation"></h:outputLabel>
		           <p:selectOneMenu style="width:178px">  
            		<f:selectItem itemLabel="Select One" itemValue="null" />  
            		<f:selectItem itemLabel="Mr" itemValue="1" /> 
            		<f:selectItem itemLabel="Mrs" itemValue="2" />  
                   </p:selectOneMenu> 
                  
  				<h:outputLabel value="* User Name" />  
			    <p:inputText size="50" />                                 
                   
                <h:outputLabel value="* Identification Type "/>
		           <p:selectOneMenu style="width:178px">  
            		<f:selectItem itemLabel="Passport No" itemValue="null" />  
            		<f:selectItem itemLabel="IC No" itemValue="1" /> 
            		<f:selectItem itemLabel="License No" itemValue="2" />  
                   </p:selectOneMenu>   
                
  				<h:outputLabel value="* Identification No." />  
			    <p:inputText size="30" />
			                     
         </h:panelGrid>  
         
		 <h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="4" columnClasses="columnWidth20" >                          	                   
                <h:outputLabel value="* Nationality "/>
		           <p:selectOneMenu style="width:178px">  
            		<f:selectItem itemLabel="Malaysian" itemValue="null" />  
            		<f:selectItem itemLabel="Singaporean" itemValue="1" /> 
            		<f:selectItem itemLabel="Vietnamese" itemValue="2" />  
                   </p:selectOneMenu> 
                   
                <h:outputLabel value="Professional Mgt" />  
          		  <p:selectOneRadio>  
           			 <f:selectItem itemLabel="Yes" itemValue="1" />  
            		 <f:selectItem itemLabel="No" itemValue="2" />  
       			  </p:selectOneRadio>                               
                    				
  				<h:outputLabel value="Designation" />  
			    <p:inputText size="30" />  
			    
  				<h:outputLabel value="Grade" />  
			    <p:inputText size="30" /> 			    
			    
                <h:outputLabel value="* Country"/>
				<p:selectOneMenu size="178px"
					value="#{userProfilesBackingBean.managedBean.selectedCountry}">
					<f:selectItems
						value="#{userProfilesBackingBean.managedBean.countryName}"></f:selectItems>
				</p:selectOneMenu>
                   
               <h:outputLabel value="* City/Town"/> 
               <p:columnGroup>    
			    <p:inputText size="30" /> 
    			<p:commandButton value="..." size="5" oncomplete="citytownsearch.show();">
    			</p:commandButton>			    
               </p:columnGroup>
                    
  				<h:outputLabel value="* Address(Office)" />  
			    <p:inputText size="30" /> 
			    
  				<h:outputLabel value="District" />  
			    <p:inputText size="30" disabled="true" />
			    
  				<h:outputLabel />  
			    <p:inputText size="30" /> 			     
			    
  				<h:outputLabel value=" Division" />  
			    <p:inputText size="30" disabled="true" />
			    
  				<h:outputLabel />  
			    <p:inputText size="30" />			     
			    
  				<h:outputLabel value="State" />  
			    <p:inputText size="30" disabled="true" />
			    
  				<h:outputLabel />  
			    <p:inputText size="30" />			     
			    
  				<h:outputLabel value="* Postal Code" />  
			    <p:inputText size="30" /> 
        </h:panelGrid>			    
		 <h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"  columnClasses="columnWidth20"> 			    
  				<h:outputLabel value="Tel.No" />  
			    <p:inputText size="30" /> 	
			    
  				<h:outputLabel value="Mobile.No" />  
			    <p:inputText size="30" /> 
			    
  				<h:outputLabel value="Fax.No" />  
			    <p:inputText size="30" /> 
			    
  				<h:outputLabel value="Email" />  
			    <p:inputText size="50" /> 		    			    			    			    			    		    			    			                                          			                     		                                                 
          
        </h:panelGrid>
	</p:panel>
</ui:composition>
