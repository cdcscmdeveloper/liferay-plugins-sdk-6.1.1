<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="User Profile" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20">
			
				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.userid']}" />  
			    <p:inputText  value="#{userprofilesBackingBean.managedBean.user.userId}" disabled="true" size="30" />
		             	    	        
		   		<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.salutation']}"></h:outputLabel>
		           <p:selectOneMenu style="width:300px;margin-bottom:5px;"> 
				    		            
					 <f:selectItems
						value="#{userprofilesBackingBean.retrieveParameterDescByType(ParameterTypeConst.salutations)}"
						var="salutationlist" itemLabel="#{salutationlist.codeName}"
						itemValue="#{salutationlist.pmParameter.parameterCode}" />  
                   </p:selectOneMenu> 
                  
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.username']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.user.userName}" size="53" />                                 
                   
                <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idtype']}" />
		           <p:selectOneMenu style="width:206px;margin-bottom:5px;">  	           
					 <f:selectItems
						value="#{userprofilesBackingBean.retrieveParameterDescByType(ParameterTypeConst.identificationTypes)}"
						var="idtypeslist" itemLabel="#{idtypeslist.codeName}"
						itemValue="#{idtypeslist.pmParameter.parameterCode}" />  
                   </p:selectOneMenu> 
                
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.idno']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.user.identificationNo}" size="35" />			                    
                                  	                   
                <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.nationality']}" />
		           <p:selectOneMenu style="width:300px;margin-bottom:5px;">		             
					 <f:selectItems
						value="#{userprofilesBackingBean. retrieveCountryList()}"
						var="nationalitylist" itemLabel="#{nationalitylist.countryName}"
						itemValue="#{nationalitylist.countryName}" />  
                   </p:selectOneMenu>                                                
                    				
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.designation']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.user.designation}" size="53" />
			    
        </h:panelGrid>
 		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="4" columnClasses="columnWidth20">       			     
			    
                <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.promanagement']}" />  
          		  <p:selectOneRadio>  
           			 <f:selectItem itemLabel="Yes" itemValue="1" />  
            		 <f:selectItem itemLabel="No" itemValue="2" />  
       			  </p:selectOneRadio>  				    
			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.grade']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.user.grade}" size="30" />
			    
        </h:panelGrid>	
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20">
		        	
		        <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.status']}"></h:outputLabel>
		          <p:selectOneMenu style="width:206px;margin-bottom:5px;">  
            		<f:selectItem itemLabel="Select One" itemValue="" />  
            		<f:selectItem itemLabel="Active" itemValue="1" /> 
            		<f:selectItem itemLabel="Non-Active" itemValue="2" />  
              	  </p:selectOneMenu> 
                    
		</h:panelGrid> 
    </p:panel>	
    <br />	  
	<p:panel header="CONTACT DETAIL" toggleable="true">		                		             				    		   		     
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20">
					    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.country']}" />  
		           <p:selectOneMenu style="width:300px;margin-bottom:5px;">
					 <f:selectItems
						value="#{userprofilesBackingBean.retrieveCountryList()}"
						var="countrylist" itemLabel="#{countrylist.countryName}"
						itemValue="#{countrylist.countryName}" />  
                   </p:selectOneMenu> 
                   
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressone']}" />  
			    <p:inputText size="53" />                    
                   
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addresstwo']}" />  
			    <p:inputText size="53" />   
			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressthree']}" />  
			    <p:inputText size="53" /> 
			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.addressfour']}" />  
			    <p:inputText size="53" /> 	
			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.postcode']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.postcode}" size="35" />	
			    			    		    			                     
		</h:panelGrid>
    
		 <h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="4"  columnClasses="columnWidth20">                    
  				
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.state']}" />  
		           <p:selectOneMenu style="width:206px;margin-bottom:5px;">
					 <f:selectItems var="statelist"
						value="#{userprofilesBackingBean.managedBean.states}"
						itemLabel="#{statelist.stateName}" itemValue="#{statelist.stateId}" />
				   </p:selectOneMenu>							
				
                <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.division']}" />  
		           <p:selectOneMenu style="width:206px;margin-bottom:5px;"> 
					 <f:selectItems var="divisionlist"
						value="#{userprofilesBackingBean.managedBean.divisions}"
						itemLabel="#{divisionlist.divisionName}" itemValue="#{divisionlist.divisionId}" />
				   </p:selectOneMenu>
	
	            <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.district']}" /> 
		           <p:selectOneMenu style="width:206px;margin-bottom:5px;"> 
            	     <f:selectItems var="districtlist"
						value="#{userprofilesBackingBean.managedBean.districts}"
						itemLabel="#{districtlist.districtName}" itemValue="#{districtlist.districtId}" />						
				   </p:selectOneMenu>	
							    						    				              			    
			    <h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.citytown']}" />
		           <p:selectOneMenu style="width:206px;margin-bottom:5px;"> 
            	     <f:selectItems var="citylist"
						value="#{userprofilesBackingBean.managedBean.citys}"
						itemLabel="#{citylist.cityName}" itemValue="#{citylist.cityName}" />
				   </p:selectOneMenu>
							               
        </h:panelGrid>	 			   			   			   		    
		    
		 <h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"  columnClasses="columnWidth20"> 
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.email']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.email}" size="53" />
			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.telno']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.phoneNo}" size="35" /> 			     			    		 			   
			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.faxno']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.faxNo}" size="35" /> 
			    			    
  				<h:outputLabel value="#{lbl['lbl.pm.profiles.userdetails.mobileno']}" />  
			    <p:inputText value="#{userprofilesBackingBean.managedBean.pmAddress.mobileNo}" size="35" /> 			    			    			    			    			    		    			    			                                          			                     		                                                 
          
        </h:panelGrid>
	</p:panel>
</ui:composition>
