<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="right">
		  <p:commandButton value="Create" icon="ui-icon-add"/>	
		  <p:commandButton value="Delete" icon="ui-icon-delete"/>			  	
		  <p:commandButton value="Save" icon="ui-icon-save" />
		</div>
		<div align="left">
		  <p:commandButton value="Back" onclick="history.go(-1)" icon="ui-icon-back"/>		
		</div>
		<br/>
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="8" columnClasses="columnWidth20">
			
				<h:outputLabel value="User ID" />  
			    <p:inputText  value="30000" disabled="true" size="20" />
		
                <h:outputLabel value="Username" />
                <p:columnGroup>
                <p:inputText value="Salutation" disabled="true" size="20" />
				<p:inputText value="User Name" disabled="true" size="40" />                
                </p:columnGroup>
                
 				<h:outputLabel value="Designation" />  
			    <p:inputText  value="Timbalan Penolong Pengarah" disabled="true" size="30" />
			    
				<h:outputLabel value="Grade" />  
			    <p:inputText disabled="true" size="10" />			                   
                
	    </h:panelGrid>					
		
	</p:panel>
</ui:composition>
