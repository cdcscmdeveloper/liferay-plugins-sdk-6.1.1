<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="recRoleName" header="SELECT ROLE" widgetVar="roleReceiving" modal="true" width="1000" height="500">
	
		<p:panel toggleable="true" styleClass="roAddMember">
		
		<p:dataTable id="roleReceiving" var="rolelist"
		  rowKey="#{rolelist}" rowIndexVar="index"
		  value="#{userprofilesBackingBean.searchRoleNameList}"
		  selection="#{userprofilesBackingBean.managedBean.userRoleSelect}"		  
		  lazy="true">

		<ac:paginator for="roleReceiving"></ac:paginator>
		<p:column selectionMode="multiple"
		  style="width:2%;text-align:center;" />
		  						 	    		
	    <p:column headerText="Role Name"> 
          <h:outputText value="#{rolelist.roleName}" />
        </p:column>
        
		</p:dataTable>
       <p:spacer height="4"></p:spacer>    
         
	    <p:dataTable id="approverReceiving" var="approverList"
	       rowKey="#{approverList}" rowIndexVar="index"
		   value="#{userprofilesBackingBean.searchApproverTypeList}"
		   selection="#{userprofilesBackingBean.managedBean.userApproverSelect}"		  
		   lazy="true">
		<ac:paginator for="approverReceiving"></ac:paginator>
		<p:column selectionMode="multiple" style="width:2%;text-align:center;" />			   	          
         <p:column headerText="Approval Type" >
           <h:outputText value="#{approverList.roleName}" />       
        </p:column>      
		</p:dataTable>   
      <p:spacer height="15"></p:spacer>	
      	    
 		<div align="right">
		  <p:commandButton value="#{lbl['lbl.so.okbtn']}" icon="ui-icon-check" 
		  onclick="roleReceiving.hide();"
		  process="@this" />	
		  <p:commandButton value="Cancel" icon="ui-icon-cancel" onclick="roleReceiving.hide()" />		
		</div>      

		</p:panel>
	</p:dialog>
</ui:composition>
