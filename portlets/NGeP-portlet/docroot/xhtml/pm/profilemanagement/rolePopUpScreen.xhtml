<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="recRoleName" header="SELECT ROLE" widgetVar="roleReceiving" modal="true" width="600" height="200">
	
		<p:panel id="searRoleName" toggleable="true">
		
		<p:dataTable id="rolescreen" var="rolelist"
		  rowKey="#{rolelist}" rowIndexVar="index"
		  selection="#{userprofilesBackingBean.managedBean.userRoleSelect}"		  
		  lazy="true">

		<ac:paginator for="roleReceiving"></ac:paginator>
		<p:column selectionMode="multiple"
		  style="width:2%;text-align:center;" />
		  						 	    		
	    <p:column headerText="Role Name"> 
          <h:outputText />
        </p:column>
        
		</p:dataTable>
 
	    <p:dataTable> 	          
         <p:column headerText="Approval Type" >       
        </p:column>      
		</p:dataTable>   
      <p:spacer height="15"></p:spacer>	
      	    
 		<div align="right">
		  <p:commandButton value="Ok" icon="ui-icon-check" /> 		
		  <p:commandButton value="Cancel" icon="ui-icon-cancel" onclick="roleReceiving.hide()" />		
		</div>      

		</p:panel>
	</p:dialog>
</ui:composition>
