<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="RolePopUp" header="SELECT ROLE" widgetVar="rolescreen" modal="true">
		<p:panel toggleable="true">
	    <p:dataTable id="roleAssign" value="" var="roleassigns"  >
		<ac:paginator />
		<p:column selectionMode="multiple"></p:column>
	    <p:column headerText="Role Name" > 
          <h:outputText value="Approver"/>
        </p:column>
        <p:column headerText="Approval/Plan/Supplier PLan" > 
          <h:outputText value="Fulfilment"/>   
        </p:column>
		</p:dataTable>
       <p:spacer height="15"></p:spacer>
       
 		<div align="right">
		  <p:commandButton value="Ok" icon="ui-icon-check"/>		
		  <p:commandButton value="Cancel" icon="ui-icon-cancel" />		
		</div>      

		</p:panel>
	</p:dialog>
</ui:composition>
