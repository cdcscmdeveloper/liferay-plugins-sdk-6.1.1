<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="RolePopUp" header="SELECT ROLE" widgetVar="rolescreen" modal="true" width="600" height="200">
		<p:panel toggleable="true">
	    <p:dataTable id="roleAssign">
		<ac:paginator />
		<p:column>
		<p:selectBooleanCheckbox/>
		</p:column>
	    <p:column headerText="Role Name" > 
          <h:outputText />
        </p:column>
        <p:column headerText="Approval/Plan/Supplier PLan" > 
          <h:outputText />   
        </p:column>
		</p:dataTable>
       <p:spacer height="15"></p:spacer>
       
 		<div align="right">
		  <p:commandButton value="Ok" icon="ui-icon-check"/>		
		  <p:commandButton value="Cancel" icon="ui-icon-cancel" onclick="rolescreen.hide()" />		
		</div>      

		</p:panel>
	</p:dialog>
</ui:composition>
