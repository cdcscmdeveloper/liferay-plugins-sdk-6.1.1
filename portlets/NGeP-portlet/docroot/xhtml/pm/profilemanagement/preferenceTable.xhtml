<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
	 <br/>
	    <p:dataTable value="#{userprofilesManagedBean.preferencelists}" var="PreferenceList" >
		
	    <p:column headerText="Notification Mode" > 
          <h:outputText value="#{PreferenceList.noticeMode}" />
        </p:column>
	    <p:column headerText="Preferred" > 
	      <p:selectBooleanCheckbox/> 
        </p:column>        
        <p:column headerText="Mobile Phone NO." > 
          <h:outputText value="#{PreferenceList.mobileNo}" />   
        </p:column>
        <p:column headerText="Email Address" > 
          <h:outputText value="#{PreferenceList.emailAddress}" />   
        </p:column>        
	</p:dataTable>
     
       		
	</p:panel>
</ui:composition>
