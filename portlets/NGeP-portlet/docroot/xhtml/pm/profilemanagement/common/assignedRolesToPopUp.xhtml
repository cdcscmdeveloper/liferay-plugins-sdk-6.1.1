<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="dlRoleList" header="#{lbl['lbl.pm.profiles.authorisation.roles']}" 
		widgetVar="dlRoleList" dynamic="true" width="400" height="250">
		<p:outputPanel id="opRoleList">
			<p:dataTable id="dtRoleList" var="role" rows="10"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				value="#{profileManagementBackingBean.managedBean.activeUserRoleFor}">
				<ac:paginator for="dtRoleList"/>
				<p:columnGroup type="header">
					<p:row>
					 	<p:column>
						    <f:facet name="header">
						     	<h:outputText value="#{lbl['lbl.pm.profiles.authorisation.role.name']}" />
						    </f:facet>
					    </p:column>
				 	</p:row>
			 	</p:columnGroup>
			 	<p:columnGroup type="header">
					<p:row>
					 	<p:column>
						    <f:facet name="header">
						     	<h:outputText value="#{lbl['lbl.pm.profiles.authorisation.Status']}" />
						    </f:facet>
					    </p:column>
				 	</p:row>
			 	</p:columnGroup>
		        <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role']}"
						width="20%">
			          	#{profileManagementBackingBean.getRoleDescByRoleCode(role.pmRole.roleCode)}
			    </p:column>
			    
			    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.Status']}"
						width="20%">
						#{(role.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
			    </p:column>
			</p:dataTable>
			<br/> 
			<div class="ppRightBtn">
			  <p:commandButton value="#{lbl['lbl.btn.ok']}" immediate="true" oncomplete="dlRoleList.hide();" />		
		
			</div>    
		</p:outputPanel>
	</p:dialog>
</ui:composition>
