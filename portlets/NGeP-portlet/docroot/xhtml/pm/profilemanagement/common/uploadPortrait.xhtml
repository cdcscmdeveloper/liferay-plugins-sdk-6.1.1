<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<style>
		div[id$="fuPortrait"] button.start ,div[id$="fuPortrait"] button.cancel {
   		  display: none;
		}
		
	</style>
	
<!-- #34527 defect start - remove alert warning once cloce dialog-->
	<p:dialog id="dlImageUpload" widgetVar="dlImageUpload"
		modal="true" dynamic="true" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.pm.profiles.userdetails.upload.image']}" 
		onShow="singleUploadListener(uploadWV);">
		
			<p:ajax event="close" update=":form:dlImageUpload"/>
			<p:fileUpload id="fuPortrait" update=":form:giUserImage"
						widgetVar="uploadWV"
					 	fileUploadListener="#{profileManagementBackingBean.handlePortraitUpload}" mode="advance" 
	   					sizeLimit="200000" allowTypes="/(\.|\/)(png|jpe?g)$/" multiple="false"
	   					invalidFileMessage="#{lbl['lbl.pm.profiles.authorisation.invalid.pictype']}" 
	   					invalidSizeMessage="#{lbl['lbl.pm.profiles.authorisation.invalid.filesize']}"
	   					fileLimit="1" dragDropSupport="false"  
		   				label="#{lbl['lbl.btn.choose']}"
   						>
			</p:fileUpload>
	</p:dialog>
<!-- #34527 defect start - remove alert warning once cloce dialog -->
</ui:composition>
