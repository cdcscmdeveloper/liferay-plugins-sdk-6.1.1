<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<style>
		div[id$="fuPortrait"] button.start ,div[id$="fuPortrait"] button.cancel {
   		  display: none;
		}
		
	</style>
	<p:dialog id="dlImageUpload" header="#{lbl['lbl.pm.profiles.userdetails.upload.image']}" 
		widgetVar="dlImageUpload" dynamic="true" width="700px" height="200">
		<p:outputPanel id="opImageUpload">
			<p:fileUpload id="fuPortrait" update=":form:giUserImage"
					 	fileUploadListener="#{profileManagementBackingBean.handlePortraitUpload}" mode="advance" 
	   					sizeLimit="1000000" allowTypes="/(\.|\/)(png|jpe?g)$/" multiple="false"
	   					invalidFileMessage="#{lbl['lbl.pm.profiles.authorisation.invalid.pictype']}" 
	   					invalidSizeMessage="#{lbl['lbl.pm.profiles.authorisation.invalid.filesize']}"
	   					fileLimit="1" dragDropSupport="false" 
	   					uploadLabel="#{lbl['lbl.btn.upload.all']}" 
		   				label="#{lbl['lbl.btn.choose']}" 
		   				cancelLabel="#{lbl['lbl.btn.remove.all']}" 
		   				oncomplete="dlImageUpload.hide();">
			</p:fileUpload>
	
		</p:outputPanel>
	</p:dialog>
</ui:composition>
