<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="pUserProfileHeader">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<table style="width: 100%">
		<tr>
			<td>
				<div align="left" style="width: 100%">
			  <p:commandButton value="#{lbl['lbl.btn.back']}" action="#{profileManagementBackingBean.redirectToMainPage}" immediate="true"
			  	widgetVar="cbBackProfile" id="cbBackProfile" />
			 </div>
			 </td>
			 <td>
			 <div align="right" style="width: 100%">
				   <c:choose>
				  		<c:when test="#{profileManagementBackingBean.managedBean.isNewUser}">
				  			<p:commandButton value="#{lbl['lbl.btn.save']}" update="@form" 
				  				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				  				action="#{profileManagementBackingBean.saveUserProfile()}">
			  					<f:param name="disableValidation" value="true" />     
			  				</p:commandButton>
				  		</c:when>
				  		<c:otherwise>
				  			<p:commandButton value="#{lbl['lbl.btn.update']}" update="@form"
				  				onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
				  				action="#{profileManagementBackingBean.saveUserProfile()}">
				  				<f:param name="disableValidation" value="true" />     
			  				</p:commandButton>
				  		</c:otherwise>
					</c:choose>
			 			  			
			  <!-- <p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" style="float:right;"/> -->			  		  
		</div>
		</td>
		</tr>
		</table>
				
	</p:outputPanel>
</ui:composition>
