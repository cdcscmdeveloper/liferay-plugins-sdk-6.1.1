<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="pUserProfileHeader">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<table style="width: 100%">
			<tr>
				<td>
					<div align="left" style="width: 100%">
				  <p:commandButton value="#{lbl['lbl.btn.back']}" action="#{profileManagementBackingBean.redirectToMainPage}" immediate="true"
				  	widgetVar="cbBackProfile" id="cbBackProfile" />
				 </div>
				 </td>
				 <td>
				 	<div align="right" style="width: 100%">
					   <c:choose>
					  		<!-- 34445 start -->
					  		<c:when test="#{profileManagementBackingBean.managedBean.isNewUser}">
					  			<p:commandButton value="#{lbl['lbl.btn.save']}"
					  				disabled="#{profileManagementBackingBean.isUserRolesEmpty()}"
					  				oncomplete="if (!args.validationFailed) saveInfoDlg.show();">
				  					<f:param name="disableValidation" value="true" />
				  				</p:commandButton>
					  		</c:when>
					  		<c:otherwise>
				  				<ui:remove>#33867 - Start</ui:remove>
				  				<p:commandButton id="searchBtnId" widgetVar="searchBtnId"
									value="#{lbl['lbl.btn.update']}"
									actionListener="#{profileManagementBackingBean.validateStatusAndRole}"
									update=":form:attentionInfoDlg"/>
								<ui:remove>#33867 - End</ui:remove>
					  		</c:otherwise>
					  		<!-- 34445 end -->
						</c:choose>
					</div>
				</td>
			</tr>
		</table>
		<!-- 34445 start -->
		<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
			loadingWidget="blockWidget"
			okParam="#{profileManagementBackingBean.saveUserProfile()}"
			hasParam="true"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.save.msg']}"
			update=":form"/>
									
		<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
			loadingWidget="blockWidget"
			okAction="profileManagementBackingBean.saveUserProfile"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.update.msg']}"
			update=":form"/>
		<!-- 34445 end -->

		<ui:remove>#33867 - Start</ui:remove>
		<p:dialog id="attentionInfoDlg" header="#{lbl['lbl.btn.dialog.attention.header']}" modal="true" widgetVar="attentionInfoDlg"
			closable="false" width="500" resizable="false">
			<h:outputText value="#{profileManagementBackingBean.managedBean.attentionMsg}" escape="false"
				style="display:block;white-space:normal;word-break:break-word;overflow-wrap:anywhere;"/>
			<div align="right">
				<br/>
				<!-- Proceed button -->
				<p:commandButton value="#{lbl['lbl.btn.dialog.confirm.proceed']}" process="@this" update=":form"
					action="#{profileManagementBackingBean.saveUserProfile}" onclick="blockWidget.show();attentionInfoDlg.hide();"
					oncomplete="blockWidget.hide();" />
				<!-- Cancel button -->
				<p:commandButton value="#{lbl['lbl.btn.dialog.confirm.cancel']}" immediate="true"
					oncomplete="attentionInfoDlg.hide(); blockWidget.hide();" />
			</div>
		</p:dialog>
		<ui:remove>#33867 - End</ui:remove>
	</p:outputPanel>
</ui:composition>
