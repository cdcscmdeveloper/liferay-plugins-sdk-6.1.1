<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="pUserProfileHeader">
		<div class="button-wrapper">
			  <p:commandButton value="#{lbl['lbl.btn.back']}" action="#{profileManagementBackingBean.redirectToMainPage}" immediate="true"/>
			  <div class="rowBtnRight">
				   <c:choose>
				  		<c:when test="#{profileManagementBackingBean.managedBean.selectedUser.brandNew}">
				  			<p:commandButton value="#{lbl['lbl.btn.save']}" update="@form"
				  				action="#{profileManagementBackingBean.saveUserProfile()}"/>
				  		</c:when>
				  		<c:otherwise>
				  			<p:commandButton value="#{lbl['lbl.btn.update']}" update="@form"
				  				action="#{profileManagementBackingBean.saveUserProfile()}"/>
				  		</c:otherwise>
					</c:choose>
			  </div>			  			
			  <!-- <p:commandButton value="#{lbl['lbl.btn.delete']}" icon="ui-icon-delete" style="float:right;"/> -->			  		  
		</div>
		<br/>
		<br/>		
	</p:outputPanel>
</ui:composition>
