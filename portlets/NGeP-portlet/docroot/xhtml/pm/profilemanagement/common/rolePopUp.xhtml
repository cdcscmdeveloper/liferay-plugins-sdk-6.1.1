<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="dlRoleOptions" header="#{lbl['lbl.pm.profiles.authorisation.role.opt']}" 
		widgetVar="dlRoleOptions" modal="true"  dynamic="true" width="500" >
		<!-- Validation Message -->
		<p:messages id="messagesRole" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<p:outputPanel id="opRoleOptions">
			<p:dataTable id="dtRoleOptions" var="roleDesc" lazy="true" rows="10"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				value="#{profileManagementBackingBean.roleDataModel}"
				selection="#{profileManagementBackingBean.managedBean.selectedRole}"
			 	selectionMode="single">
			 	<p:ajax event="rowSelect" update="dtRoleOptions">
					<f:param name="disableValidation" value="" />     
				</p:ajax>
				<ac:paginator for="dtRoleOptions"/>
				<p:columnGroup type="header">
					<p:row>
					 	<p:column>
						    <f:facet name="header">
						     	<h:outputText value="#{lbl['lbl.pm.profiles.authorisation.role.name']}" />
						    </f:facet>
					    </p:column>
				 	</p:row>
			 	</p:columnGroup>
			    <p:column> 
		         	#{roleDesc.roleName}
		        </p:column>
			</p:dataTable>
					   
	 		<div class="ppRightBtn">
			  <p:commandButton value="#{lbl['lbl.btn.select']}" immediate="true"
			  	action="#{profileManagementBackingBean.confirmRoles()}"
			  	update="tvRoleReceivingAddr" />	
			  <p:commandButton value="#{lbl['lbl.btn.cancel']}" immediate="true" oncomplete="dlRoleOptions.hide();" />		
		
			</div>      
		</p:outputPanel>
	</p:dialog>
</ui:composition>
