<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="dlRoleOptions" header="#{lbl['lbl.pm.profiles.authorisation.role.opt']}" 
		widgetVar="dlRoleOptions" dynamic="true" width="1000" height="250">
		<p:outputPanel id="opRoleOptions">
			<p:dataTable id="dtRoleOptions" var="roleDesc" lazy="true"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				rowKey="#{roleDesc}" rowIndexVar="index"
				value="#{profileManagementBackingBean.roleDataModel}"
				selection="#{profileManagementBackingBean.managedBean.selectedRoles}">
				<p:ajax event="toggleSelect" update="@this" process="@this" />
				<p:ajax event="rowSelectCheckbox" update="@this" />
				<ac:paginator for="dtRoleOptions"/>
				<p:column selectionMode="multiple" width="2%"  />
			    <p:column headerText="#{lbl['lbl.pm.profiles.authorisation.role.name']}"> 
		         	#{roleDesc.roleName}
		       
		        </p:column>
			</p:dataTable>
			<br/>
			<br/>    
	 		<div class="ppRightBtn">
			  <p:commandButton value="#{lbl['lbl.btn.ok']}" oncomplete="dlRoleOptions.hide();" 
			  	action="#{profileManagementBackingBean.confirmRoles()}"
			  	update="tvRoleReceivingAddr:dtRoles" />	
			  <p:commandButton value="#{lbl['lbl.btn.cancel']}" oncomplete="dlRoleOptions.hide();" 
			    />		
			           <p:commandButton action="#{profileManagementBackingBean.test}"
					  	value="Check Role" />&#160;
			</div>      
		</p:outputPanel>
	</p:dialog>
</ui:composition>
