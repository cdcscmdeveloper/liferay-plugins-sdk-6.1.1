<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="dlRoleOptions" widgetVar="dlRoleOptions" modal="true" width="700" position="top">
		
		<f:facet name="header">
			<h:panelGroup id="lovTitle">#{lbl['lbl.lov.listing']} - #{lbl['lbl.pm.profiles.search.role']} </h:panelGroup>
		</f:facet>
		
		<!-- Validation Message -->
		<p:messages id="messagesRole" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<p:panel header="#{lbl['lbl.cm.search']}" toggleable="true">
		
		<h:panelGroup id="roleSearchPanel" style="width:100%;">

		<h:panelGrid columns="2" id="roleSearchCriteria" cellpadding="0" cellspacing="0">
		<p:selectOneMenu value="#{profileManagementBackingBean.managedBean.selectedRoleSearchOption}">
			<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
			<f:selectItem itemLabel="#{lbl['lbl.pm.profiles.authorisation.role.name']}" itemValue="1" />		
		</p:selectOneMenu>
		
		<p:inputText value="#{profileManagementBackingBean.managedBean.searchRoleName}" 
			style="margin-bottom: 5px;" onkeypress="if (event.keyCode == 13) { roleSearch.jq.click(); return false; }"/>

		</h:panelGrid>

		<table style="width:100%;"><tr><TD style="text-align:right;">
			<p:commandButton 
				value="#{lbl['lbl.btn.search']}"
				action="#{profileManagementBackingBean.searchAvailbleUserRole}"
				partialSubmit="true"
				process="roleSearchPanel"
				update="opRoleOptions"
				widgetVar="roleSearch">
			</p:commandButton>		
			<p:commandButton
				value="#{lbl['lbl.btn.reset']}"
				action="#{profileManagementBackingBean.resetAvailbleUserRole}"
				partialSubmit="true"
				process="roleSearchPanel"
				update="roleSearchPanel opRoleOptions">
			</p:commandButton>
		</TD></tr></table>

		</h:panelGroup>
		</p:panel>
		
		<p:panel header="#{lbl['lbl.fl.result']}" toggleable="true">
		<h:panelGroup id="opRoleOptions" style="width:100%;">
			<h:panelGroup>
			<p:dataTable id="dtRoleOptions" var="roleDesc" lazy="true" rows="10"
				emptyMessage="#{lbl['lbl.pp.no.record.found']}"
				value="#{profileManagementBackingBean.roleDataModel}"
				selection="#{profileManagementBackingBean.managedBean.selectedRole}"
			 	selectionMode="single">
			 	<p:ajax event="rowSelect" update="dtRoleOptions">
					<f:param name="disableValidation" value="" />     
				</p:ajax>
				<ac:paginator for="dtRoleOptions"/>
				<p:columnGroup type="header">
					<p:row>
					 	<p:column>
						    <f:facet name="header">
						     	<h:outputText value="#{lbl['lbl.pm.profiles.authorisation.role.name']}" />
						    </f:facet>
					    </p:column>
				 	</p:row>
			 	</p:columnGroup>
			    <p:column> 
		         	#{roleDesc.roleName}
		        </p:column>
			</p:dataTable>
			</h:panelGroup>
			<table style="width:100%;"><tr><TD style="text-align:right;">
				  <p:commandButton value="#{lbl['lbl.btn.select']}" immediate="true"
			  	action="#{profileManagementBackingBean.confirmRoles()}"
			  	update="tvRoleReceivingAddr,:form:pUserProfileHeader" styleClass="BtnSpacing"/>	
			  <p:commandButton value="#{lbl['lbl.btn.cancel']}" immediate="true" styleClass="BtnSpacing" oncomplete="dlRoleOptions.hide();" />	
			
			</TD>	
			</tr>
			</table>	   
	 		    
		</h:panelGroup>
		</p:panel>
	</p:dialog>
</ui:composition>
