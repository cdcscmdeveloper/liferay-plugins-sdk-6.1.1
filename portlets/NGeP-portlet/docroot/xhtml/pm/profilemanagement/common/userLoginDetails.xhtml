<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="opLoginDet">
		<div align="left" class="header-info">
			<table style="width:100%">
				<tr>
					<td width="6%">
						<p:outputLabel value="#{lbl['lbl.pm.profiles.navigation.loginid']}" />  
					</td>
					<td class="header-info-text" width="30%">
						#{profileManagementBackingBean.managedBean.selectedUser.loginId}
					</td>
					<td width="8%">
						<p:outputLabel value="#{lbl['lbl.pm.profiles.navigation.username']}" />
					</td>
					<td class="header-info-text" width="33%">
						#{profileManagementBackingBean.managedBean.selectedUser.userName}
					</td>
					<td width="5%">
						<p:outputLabel value="#{lbl['lbl.pm.profiles.navigation.status']}" />  
					</td>
					<td class="header-info-text" width="18%">
						#{(profileManagementBackingBean.managedBean.selectedUserOrg.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
					</td>
				</tr>
			</table>
		</div>	
	</p:outputPanel>

</ui:composition>
