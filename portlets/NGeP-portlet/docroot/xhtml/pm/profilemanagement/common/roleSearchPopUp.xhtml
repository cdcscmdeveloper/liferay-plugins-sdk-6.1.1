<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="roleSearchPopUp" widgetVar="roleSearchPopUp" modal="true" width="700" position="top">
	
		<f:facet name="header">
			<h:panelGroup id="lovTitle">#{lbl['lbl.lov.listing']} - #{lbl['lbl.pm.profiles.search.role']} </h:panelGroup>
		</f:facet>
		
		<p:messages id="roleSearchMessages" showDetail="true" autoUpdate="true" closable="true" showSummary="false"/>
		
		<p:panel header="#{lbl['lbl.cm.search']}" toggleable="true">
		
		<h:panelGroup id="roleSearchPanel" style="width:100%;">
		<h:panelGrid columns="2" id="roleSearchCriteria" cellpadding="0" cellspacing="0">
			<p:selectOneMenu value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.selectedRoleOptionSearch}">
				<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
				<f:selectItem itemLabel="#{lbl['lbl.pm.profiles.authorisation.role.name']}" itemValue="1" />
			</p:selectOneMenu>		
			<p:inputText value="#{profileManagementBackingBean.managedBean.userProfileSearchBean.userRoleNameSearch}" style="margin-bottom: 5px;" onkeypress="if (event.keyCode == 13) { lovSearch.jq.click(); return false; }"/>	
		</h:panelGrid>

		<table style="width:100%;"><tr><TD style="text-align:right;">
			<p:commandButton 
				value="#{lbl['lbl.btn.search']}"
				action="#{profileManagementBackingBean.searchRoleMatrix}"
				partialSubmit="true"
				process="roleSearchPanel"
				update="roleResultPanel"
				widgetVar="lovSearch">
			</p:commandButton>		
			<p:commandButton
				value="#{lbl['lbl.btn.reset']}"
				action="#{profileManagementBackingBean.resetRoleSearchAction}"
				partialSubmit="true"
				process="roleSearchPanel"
				update="roleSearchPanel roleResultPanel">
			</p:commandButton>
		</TD></tr></table>

		</h:panelGroup>
		</p:panel>
		<p:panel header="#{lbl['lbl.fl.result']}" toggleable="true">
		<h:panelGroup id="roleResultPanel" style="width:100%;">
			
			<h:panelGroup>
			<p:dataTable id="roleDescTb"
				var="roleDesc" 
				selection="#{profileManagementBackingBean.managedBean.selectedRoleDesc}"
				selectionMode="single"
				rowKey="#{roleDesc.roleDescId}"
				rowIndexVar="rowIndex"
				rows="10"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{profileManagementBackingBean.managedBean.roleDescResults}" >
				
				<ac:paginator for="roleDescTb" />
				
				<p:column>				
					<f:facet name="header">  
		                #{lbl['lbl.pm.profiles.authorisation.role.name']}
		            </f:facet>
						#{roleDesc.roleName}
				</p:column>
				
			</p:dataTable>
			</h:panelGroup>
		<table style="width:100%;"><tr><TD style="text-align:right;">
				<p:commandButton 
					id="roleSlbtn"
					value="#{lbl['lbl.btn.select']}"
					action="#{profileManagementBackingBean.populateToRoleSaveObject}"
					update="roleResultPanel,:form:opDefinedSearch"
					oncomplete="roleSearchPopUp.hide();"
					process="roleResultPanel roleSearchPanel"
					partialSubmit="true"  styleClass="BtnSpacing"/>	
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				partialSubmit="true" process="@this" update="@this"
				oncomplete="roleSearchPopUp.hide();" styleClass="BtnSpacing"/>
			</TD>
			</tr></table>
			
		</h:panelGroup>
		</p:panel>
	</p:dialog>
</ui:composition>
