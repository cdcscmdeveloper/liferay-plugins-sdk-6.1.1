<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="dlRestApTypeSection" header="#{lbl['lbl.pm.suppdoc.section']}"
		modal="true" widgetVar="dlRestApTypeSection" dynamic="true" width="400"
		height="160">
		<p:outputPanel id="opRestApTypePopUp">
			<table class="ppTwoTable">
				<tr>
					<td><p:selectBooleanCheckbox id="chkCompanyStep"
							value="#{supportDocBackingBean.managedBean.companyInfoChanged}" />
						<h:outputText value="#{lbl['lbl.sm.companyStepLbl']}" /></td>
				</tr>
				<tr>
					<td><p:selectBooleanCheckbox id="chkBranchStep"
							value="#{supportDocBackingBean.managedBean.asscProjChanged}" />
						<h:outputText value="#{lbl['lbl.sm.branchStepLbl']}" /></td>
				</tr>
				<tr>
					<td><p:selectBooleanCheckbox id="chkPersonStep"
							value="#{supportDocBackingBean.managedBean.personnelBranchChanged}" />
						<h:outputText value="#{lbl['lbl.sm.personStepLbl']}" /></td>
				</tr>
				<tr>
					<td><p:selectBooleanCheckbox id="chkCapitalStep"
							value="#{supportDocBackingBean.managedBean.capitalEquityChanged}" />
						<h:outputText value="#{lbl['lbl.sm.capitalStepLbl']}" /></td>
				</tr>
				<tr>
					<td><p:selectBooleanCheckbox id="chkBankStep"
							value="#{supportDocBackingBean.managedBean.bankChanged}" />
						<h:outputText value="#{lbl['lbl.sm.bankStepLbl']}" /></td>

				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					oncomplete="dlRestApTypeSection.hide()"
					action="#{supportDocBackingBean.okSectionAction()}"
					update=":form:tvDocRestriction:dtAppType" />

				<p:commandButton id="cbCancel" value="#{lbl['lbl.btn.cancel']}"
					oncomplete="dlRestApTypeSection.hide()" immediate="true" />
			</div>

		</p:outputPanel>
	</p:dialog>
</ui:composition>
