<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="certBodyOp"
		rendered="#{supportDocBackingBean.managedBean.selectedDocument.byCertBody}">
		<p:dataTable id="dtCertBody"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			rowKey="#{restrict}" rowIndexVar="rowIndex"
			value="#{supportDocBackingBean.managedBean.certBodyRestrictions}"
			var="restrict">
			<ac:paginator for="dtCertBody" />			
		<p:column headerText="#{lbl['lbl.pm.suppdoc.certified.body']}">  
	    	#{restrict.pmCertBody.bodyName}
        </p:column>
			
			<p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">
	          	<p:commandLink partialSubmit="true" 
					process="@this" 
					oncomplete="certBodyDeletePopUp.show();"
					update="@([id$=#{certBodyDeleteId}])"  >
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					<f:setPropertyActionListener target="#{supportDocBackingBean.managedBean.deleteRowIndex}" 
							value="#{rowIndex}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
						<!--  Popup Cert Body --> <ac:lov id="lovCertBody"
							lovId="PM_CERT_BODY" styleClass="ppDisplayCalS"
							readonly="true" selectionMode="multiple"
							buttonLabel="#{lbl['lbl.btn.add']}" 
							headerText="#{lbl['lbl.pm.suppdoc.certbody.lov.title']}"
							update=":form:tvDocRestriction:dtCertBody"
							saveObject="supportDocBackingBean.managedBean.selectedCertBodies"
							postUpdateListener="supportDocBackingBean.updateCertBody"
							conditionField="recordStatus^1|isCertifiedBody^1|isGlp^1" />					
			
		</div>
		
		<ac:confirmationPopup id="certBodyDeleteId"
				widget="certBodyDeletePopUp"
				okAction="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrCertbody)}"
				width="400" height="100"
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" 
				update=":#{p:component('dtCertBody')}" />
	</p:outputPanel>
</ui:composition>
