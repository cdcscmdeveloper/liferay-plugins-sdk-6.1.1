<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pSupportDocCheckListDet" header="#{lbl['lbl.pm.document.details']}" toggleable="true">	
		
		<!-- Document Detail -->
		<table class="ppTwoTable">
			<tr>
				<th><p:outputLabel value="#{lbl['lbl.pm.display.priority']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></th>
				<td><p:inputText id="itaDisplayPiror"
						value="#{supportDocBackingBean.managedBean.selectedDocument.displaySeq}"
						required="#{!empty param['disableValidation']}" label="#{lbl['lbl.pm.display.priority']}" maxlength="5"
						/> <ac:iconTooltip
						value="#{lbl['lbl.pm.tooltip.display.priority']}" /> <p:message
						id="itaDisplayPirorMsg" for="itaDisplayPiror" display="icon" /></td>
				<td></td>
				<td></td>
			</tr>
			
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td colspan="3">
					<p:inputTextarea value="#{supportDocBackingBean.managedBean.selectedDocument.docName}"
						label="#{lbl['lbl.pm.document.name']}" autoResize="false"
						disabled="#{!supportDocBackingBean.managedBean.selectedDocument.brandNew}"
				 		cols="50" rows="5" maxlength="350" required="#{!empty param['disableValidation']}" id="itaDocName" />
			 		<p:message id="itaDocNameMsg" for="itaDocName" display="icon" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.definition']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu  required="#{!empty param['disableValidation']}"
				     	disabled="#{!supportDocBackingBean.managedBean.selectedDocument.brandNew}"
						id="somDocDefinition" label="#{lbl['lbl.pm.document.definition']}" 
						value="#{supportDocBackingBean.managedBean.selectedDocument.docDefinitionTypeCode.parameterId}"	>
						<f:selectItems  value="#{supportDocBackingBean.managedBean.docDefinitionOptions}" />						
						 <p:ajax event="change" process="@this" partialSubmit="true" 
						 listener="#{supportDocBackingBean.getSupplierActionDetails(supportDocBackingBean.managedBean.selectedDocument.docDefinitionTypeCode.parameterId)}"
						 update="somSupplierAction" />
					</p:selectOneMenu>
					<p:message id="somDocDefinitionMsg" for="somDocDefinition" display="icon" />
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.action']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu required="#{!empty param['disableValidation']}"  id="somSupplierAction" 
				        disabled="#{!supportDocBackingBean.managedBean.selectedDocument.brandNew}"
						styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.action']}"
						value="#{supportDocBackingBean.managedBean.selectedDocument.checklistActionCode.parameterId}">
						<f:selectItems value="#{supportDocBackingBean.managedBean.supplierActionItems}" />
					</p:selectOneMenu>
					<p:message id="somSupplierActionMsg" for="somSupplierAction" display="icon" />					
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.scoring.required']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneRadio value="#{supportDocBackingBean.managedBean.selectedDocument.scoringReq}"
						label="#{lbl['lbl.pm.scoring.required']}" id="sorScoringReq" required="#{!empty param['disableValidation']}">
						<f:selectItems value="#{supportDocBackingBean.getYesNoOptions()}" />
					</p:selectOneRadio> 
					<p:message id="sorScoringReqMsg" for="sorScoringReq" display="icon" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.status']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" id="somDocStatus" required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.status']}"  disabled="#{supportDocBackingBean.managedBean.selectedDocument.brandNew}"
						value="#{supportDocBackingBean.managedBean.selectedDocument.recordStatusFlg}">
						<f:selectItems  value="#{supportDocBackingBean.getActiveAndInactiveStatusOptions()}"/>
					</p:selectOneMenu>
					<p:message id="somDocStatusMsg" for="somDocStatus" display="icon" />
				</td>
				<th>
					
				</th>
				<td>
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel id="pProcureRestrList" header="#{lbl['lbl.pm.document.restriction']}" toggleable="true">	
		
		<p:tabView widgetVar="tvProcureRestr" id="tvDocCheckListRestr" dynamic="false" cache="false" orientation="top">
			<!-- Application Type -->
			<p:tab id="tProcureCat" title="#{lbl['lbl.pm.procurement.category']}">  
				
				<p:dataTable id="dtProcureCat" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
					rowKey="#{restrict}" rowIndexVar="rowIndex"
			 		value="#{supportDocBackingBean.managedBean.checkListRestrictions}" var="restrict" >
		 			<ac:paginator for="dtProcureCat" />					
			        <p:column>
			          	<f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pm.procurement.category']}" />
					    </f:facet>
					    <h:outputText
							value="#{supportDocBackingBean.getParameterDesc(restrict.procurementCatCode)}"
							rendered="#{!restrict.brandNew}" />
				    	<p:selectOneMenu styleClass="ppDropDownWidthL" 
				    		id="somProcurementType" required="#{!empty param['disableValidation']}"
				    		label="#{lbl['lbl.pm.procurement.category']}"
							value="#{restrict.procurementCatCode.parameterId}"
							rendered= "#{restrict.brandNew}"> 
							<f:selectItems  value="#{supportDocBackingBean.procurementTypeOptions()}"/>
							<p:ajax event="change" listener="#{supportDocBackingBean.validateUniqueRestrType(
								supportDocBackingBean.checklist)}"/>
						</p:selectOneMenu>
						<p:message id="somProcurementTypeMsg" for="somProcurementType" display="icon" />
			        </p:column>  
			        <p:column style="width:10%;text-align:center;">  
			        	<f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pm.mandatory']}" />
					    </f:facet>
					    <p:selectBooleanCheckbox 
							value="#{restrict.mandatory}">
						</p:selectBooleanCheckbox> 
			        </p:column>  
			        <p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">
	          			 <p:commandLink partialSubmit="true" 
							process="@this" action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.checklist,rowIndex)}"
							update="dtProcureCat" >
							<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					</p:commandLink>
			</p:column>
			   	</p:dataTable>
			   
		   		<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.add']}"  update="dtProcureCat"
						action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.checklist)}"
						immediate="true"/>
				</div>
			</p:tab>
		</p:tabView>
	</p:panel>
</ui:composition>
