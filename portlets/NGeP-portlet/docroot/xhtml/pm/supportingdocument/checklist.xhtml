<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pSupportDocCheckListDet" header="#{lbl['lbl.pm.document.details']}" toggleable="true">	
		<br/>
		<!-- Document Detail -->
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td colspan="3">
					<p:inputTextarea value="#{supportDocBackingBean.managedBean.selectedDocument.docName}"
						label="#{lbl['lbl.pm.document.name']}" autoResize="false"
				 		cols="50" rows="5" maxlength="255" required="true" id="itaDocName" />
			 		<p:message id="itaDocNameMsg" for="itaDocName" display="icon" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.definition']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu disabled="true" styleClass="ppDropDownWidthM"  required="true"
						id="somDocDefinition" label="#{lbl['lbl.pm.document.definition']}"
						value="#{supportDocBackingBean.managedBean.selectedDocument.docDefinitionTypeCode.parameterId}"
					>
						<f:selectItems value="#{supportDocBackingBean.docDefinitionOptions()}" />
					</p:selectOneMenu>
					<p:message id="somDocDefinitionMsg" for="somDocDefinition" display="icon" />
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.display.sequence']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextS" required="true"
						label="#{lbl['lbl.pm.display.sequence']}" id="itDisplaySeq" maxlength="2"
						value="#{supportDocBackingBean.managedBean.selectedDocument.displaySeq}"/>
					<p:message id="itDisplaySeqMsg" for="itDisplaySeq" display="icon" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.action']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu  disabled="true" required="true" id="somSupplierAction"
						styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.action']}"
						value="#{supportDocBackingBean.managedBean.selectedDocument.checklistActionCode.parameterId}">
						<f:selectItems value="#{supportDocBackingBean.supplierActionOptions()}" />
					</p:selectOneMenu>
					<p:message id="somSupplierActionMsg" for="somSupplierAction" display="icon" />
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.scoring.required']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneRadio value="#{supportDocBackingBean.managedBean.selectedDocument.scoringReq}"
						label="#{lbl['lbl.pm.scoring.required']}" id="sorScoringReq" required="true">
						<f:selectItems value="#{supportDocBackingBean.getYesNoOptions()}" />
					</p:selectOneRadio> 
					<p:message id="sorScoringReqMsg" for="sorScoringReq" display="icon" />
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.status']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu styleClass="ppDropDownWidthM" id="somDocStatus" required="true"
						label="#{lbl['lbl.pm.status']}"
						value="#{supportDocBackingBean.managedBean.selectedDocument.recordStatusFlg}">
						<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
					</p:selectOneMenu>
					<p:message id="somDocStatusMsg" for="somDocStatus" display="icon" />
				</td>
				<th>
					
				</th>
				<td>
				</td>
			</tr>
		</table>
	</p:panel>
	<p:panel id="pProcureRestrList" header="#{lbl['lbl.pm.document.restriction']}" toggleable="true">	
		<br/>
		<p:tabView widgetVar="tvProcureRestr" id="tvDocCheckListRestr" dynamic="false" cache="false" orientation="top">
			<!-- Application Type -->
			<p:tab id="tAppType" title="#{lbl['lbl.pm.procurement.category']}">  
				<br/>
				<p:dataTable id="dtProcureCat" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
					selection="#{supportDocBackingBean.managedBean.deleteCheckListRestrictions}" rowKey="#{restrict}"
			 		value="#{supportDocBackingBean.managedBean.checkListRestrictions}" var="restrict" >
		 			<ac:paginator for="dtProcureCat" />
					<p:ajax event="toggleSelect" update="@this" process="@this" />
					<p:ajax event="rowSelectCheckbox" update="@this" />
					<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />
			        <p:column>
			          	<f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pm.procurement.category']}" />
					    </f:facet>
				    	<p:selectOneMenu styleClass="ppDropDownWidthL" 
				    		id="somProcurementType" required="true"
				    		label="#{lbl['lbl.pm.procurement.category']}"
							value="#{restrict.procurementCatCode.parameterId}"> 
							<f:selectItems  value="#{supportDocBackingBean.procurementTypeOptions()}"/>
							<p:ajax event="change" listener="#{supportDocBackingBean.validateUniqueRestrType(
								supportDocBackingBean.checklist)}"/>
						</p:selectOneMenu>
						<p:message id="somProcurementTypeMsg" for="somProcurementType" display="icon" />
			        </p:column>  
			        <p:column>  
			        	<f:facet name="header">
					     	<h:outputText value="#{lbl['lbl.pm.mandatory']}" />
					    </f:facet>
					    <p:selectBooleanCheckbox 
							value="#{restrict.mandatory}">
						</p:selectBooleanCheckbox> 
			        </p:column>   
			        <p:column>  
			        	<f:facet name="header">
					     	<h:outputText value="* " styleClass="mandatory" />
					     	<h:outputText value="#{lbl['lbl.pm.status']}" />
					    </f:facet>
			         	<p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
							<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
						</p:selectOneMenu>
			        </p:column>  
			   	</p:dataTable>
			   	<br/>
		   		<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.add']}"  update="dtProcureCat"
						action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.checklist)}"
						immediate="true"/>
					&#160;
					<p:commandButton id="cbAppDelete" value="#{lbl['lbl.btn.delete']}"  update="dtProcureCat"
						action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.checklist)}"
						immediate="true" 
						/> 
				</div>
			</p:tab>
		</p:tabView>
	</p:panel>
</ui:composition>
