<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	<p:outputPanel id="opRestriction">
		<p:panel id="pDocRestriction" header="#{lbl['lbl.pm.document.restriction']}" toggleable="true" 
		>
			<p:tabView widgetVar="tvDocRestriction" id="tvDocRestriction" dynamic="false" cache="false" orientation="top" 
				rendered="#{supportDocBackingBean.managedBean.selectedDocument.byAppType 
					or supportDocBackingBean.managedBean.selectedDocument.byCompType 
					or supportDocBackingBean.managedBean.selectedDocument.bySupplierType
					or supportDocBackingBean.managedBean.selectedDocument.byCategory}"> 
				<!-- Application Type -->
				<p:tab id="tAppType" title="#{lbl['lbl.pm.application.type']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byAppType}">  
					<br/>
					<p:dataTable id="dtAppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}" 
						 selection="#{supportDocBackingBean.managedBean.deleteAppTypeRestrictions}" rowKey="#{restrict}"
						 value="#{supportDocBackingBean.managedBean.appTypeRestrictions}" var="restrict" 
						>
						<ac:paginator for="dtAppType" />
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />
				        <p:column>
			        	    <f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.application.type']}" />
						    </f:facet>
					    	<p:selectOneMenu id="somAppType"  styleClass="ppDropDownWidthL"
								value="#{restrict.appTypeCode.parameterId}">
								<f:selectItems  value="#{supportDocBackingBean.applicationTypeOptions()}"/>
								<p:ajax event="change" update="somAppType"/>
							</p:selectOneMenu>
				        </p:column>  
				        <p:column>  
				        	<f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.status']}" />
						    </f:facet>
				         	<p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				   	</p:dataTable>
				   	<br/>
			   		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.add']}" update="dtAppType"
							action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrApp)}"
							immediate="true"/>
						&#160;
						<p:commandButton id="cbAppDelete" value="#{lbl['lbl.btn.delete']}" update="dtAppType"
							action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrApp)}"
							immediate="true" 
							/> 
					</div>
				</p:tab>
				<!-- Company Type -->
				<p:tab id="tComType" title="#{lbl['lbl.pm.company.type']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byCompType}">  
					<br/>
					<p:dataTable id="dtComType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						selection="#{supportDocBackingBean.managedBean.deleteComTypeRestrictions}" rowKey="#{restrict}"
						value="#{supportDocBackingBean.managedBean.comTypeRestrictions}" var="restrict" 
						>
						<ac:paginator for="dtComType" />
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />
				        <p:column>  
			        	 	<f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.company.type']}" />
						    </f:facet>
					    	<p:selectOneMenu id="somCompType" styleClass="ppDropDownWidthL"
								value="#{restrict.companyTypeCode.parameterId}">
								<f:selectItems  value="#{supportDocBackingBean.companyTypeOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				        <p:column>  
				        	<f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.status']}" />
						    </f:facet>
				            <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>
				   	</p:dataTable>
			   		<br/>
			   		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.add']}"  update="dtComType"
							action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrComp)}"
							immediate="true"/>
						&#160;
						<p:commandButton id="cbComDelete" value="#{lbl['lbl.btn.delete']}"  update="dtComType"
							action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrComp)}"
							immediate="true" /> 
					</div>
				</p:tab>
				<!-- Supplier Type -->
				<p:tab id="tSuppType" title="#{lbl['lbl.pm.supplier.type']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.bySupplierType}">  
					<br/>
					<p:dataTable id="dtSuppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						selection="#{supportDocBackingBean.managedBean.deleteSuppTypeRestrictions}" rowKey="#{restrict}"
						value="#{supportDocBackingBean.managedBean.suppTypeRestrictions}" var="restrict" 
						>
						<ac:paginator for="dtSuppType" />
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />

				        <p:column> 
				        	<f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.supplier.type']}" />
						    </f:facet> 
					    	<p:selectOneMenu id="somSuppType" styleClass="ppDropDownWidthL"
								value="#{restrict.supplierTypeCode.parameterId}">
								<f:selectItems  value="#{supportDocBackingBean.supplierTypeOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				        <p:column>  
				        	<f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.status']}" />
						    </f:facet>
					        <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				   	</p:dataTable>
				   	<br/>
			   		<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.add']}"   update="dtSuppType"
							action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrSupp)}"
							immediate="true"/>
						&#160;
						<p:commandButton id="cbSuppDelete" value="#{lbl['lbl.btn.delete']}"  update="dtSuppType"
							action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrSupp)}"
							immediate="true" />
					</div>
				</p:tab>
				<!-- Category -->
				<p:tab id="tCat" title="#{lbl['lbl.pm.category']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byCategory}">  
					<br/>
					<p:dataTable id="dtCat" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
						selection="#{supportDocBackingBean.managedBean.deleteCategoryRestrictions}" rowKey="#{restrict}"
						value="#{supportDocBackingBean.managedBean.categoryRestrictions}" var="restrict"
						>
						<ac:paginator for="dtCat" />
						<p:ajax event="toggleSelect" update="@this" process="@this" />
						<p:ajax event="rowSelectCheckbox" update="@this" />
						<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />
				        <p:column headerText="#{lbl['lbl.pm.category.l1']}">  
					    	#{restrict.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}
				        </p:column>  
				        <p:column headerText="#{lbl['lbl.pm.category.l2']}">  
					    	#{restrict.pmCategoryL3.pmCategoryL2.categoryName}
				        </p:column>  
				        <p:column headerText="#{lbl['lbl.pm.category.l3']}">  
					    	#{restrict.pmCategoryL3.categoryName}
				        </p:column>   
				        <p:column>  
				        	<f:facet name="header">
						     	<h:outputText value="* " styleClass="mandatory" />
						     	<h:outputText value="#{lbl['lbl.pm.status']}" />
						    </f:facet>
				      	   <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
								<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
							</p:selectOneMenu>
				        </p:column>  
				   	</p:dataTable>
				   	<br/>
			   		<div class="ppRightBtn">
			   			<table style="float:right;">
							<tr>
								<td>
									<!--  Popup Category Details -->
									<ac:lov id="lovCategory" lovId="PM_CATEGORY_L3" styleClass="ppDisplayCalS" 
						            	readonly="true" selectionMode="multiple" buttonLabel="#{lbl['lbl.btn.add']}"
										headerText="#{lbl['lbl.pm.search.category']}" update=":form:tvDocRestriction:dtCat"
										saveObject="supportDocBackingBean.managedBean.selectedCategoryL3s"
										postUpdateListener="supportDocBackingBean.updateCategoryL3(supportDocBackingBean.managedBean.selectedCategoryL3s)"
										conditionField="recordStatus^1" 
										/>
								</td>
								<td>
									<p:commandButton value="#{lbl['lbl.btn.delete']}"  update="dtCat"
										immediate="true"
										/> 
								</td>
							</tr>
						</table>
					</div>
				</p:tab>
			</p:tabView>
			<br/>
		</p:panel>
	</p:outputPanel>
</ui:composition>
