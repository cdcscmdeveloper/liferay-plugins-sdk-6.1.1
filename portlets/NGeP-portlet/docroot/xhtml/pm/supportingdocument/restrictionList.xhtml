<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	<p:outputPanel id="opRestriction">
		<p:panel id="pDocRestriction" header="#{lbl['lbl.pm.document.restriction.detail']}" toggleable="true" 
		>
			<p:tabView widgetVar="tvDocRestriction" id="tvDocRestriction" dynamic="false" cache="false" orientation="top"
					activeIndex="#{supportDocBackingBean.managedBean.selectedTabIndex}"
					rendered="#{supportDocBackingBean.managedBean.selectedDocument.docCategoryCode.parameterId>0}">
				<!-- Application Type -->
				<p:tab id="tAppType" title="#{lbl['lbl.pm.application.type']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byAppType}">  
					<ui:include src="/xhtml/pm/supportingdocument/restrAppType.xhtml" /> 
				</p:tab>
	
				<!-- Company Type -->
				<p:tab id="tComType" title="#{lbl['lbl.pm.company.type']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byCompType}">  
					<ui:include src="/xhtml/pm/supportingdocument/restrCompType.xhtml" /> 
				</p:tab>
				
				<!-- Supplier Type -->
				<p:tab id="tSuppType" title="#{lbl['lbl.pm.supplier.type']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.bySupplierType}">  
					<ui:include src="/xhtml/pm/supportingdocument/restrSuppType.xhtml" /> 
				</p:tab>
				
				<!-- Category -->	
				<p:tab id="tCatType" title="#{lbl['lbl.pm.category']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byCategory}">
					<ui:include src="/xhtml/pm/supportingdocument/restrCategory.xhtml" /> 
				</p:tab>
				
				<!-- Cert Body -->	
				<p:tab id="tCertBody" title="#{lbl['lbl.pm.suppdoc.certified.body']}" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.byCertBody}">
					<ui:include src="/xhtml/pm/supportingdocument/restrCertBody.xhtml" /> 
				</p:tab>
			</p:tabView>
	
		</p:panel>
	</p:outputPanel>
</ui:composition>
