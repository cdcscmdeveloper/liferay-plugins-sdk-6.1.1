<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel
		rendered="#{supportDocBackingBean.managedBean.selectedDocument.byAppType}">
		<p:dataTable id="dtAppType"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}" rowKey="#{restrict}"
			rowIndexVar="rowIndex"
			value="#{supportDocBackingBean.managedBean.appTypeRestrictions}"
			var="restrict">
			<ac:paginator for="dtAppType" />
			<p:column style="width:35%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.application.type']}" />
				</f:facet>
				<h:outputText
					value="#{supportDocBackingBean.getParameterDesc(restrict.appTypeCode)}"
					rendered="#{!restrict.brandNew}" />
				<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthL"
					required="true" label="#{lbl['lbl.pm.application.type']}"
					value="#{restrict.appTypeCode.parameterId}"
					rendered="#{restrict.brandNew}">
					<f:selectItems
						value="#{supportDocBackingBean.applicationTypeOptions()}" />
					<p:ajax event="change"
						listener="#{supportDocBackingBean.validateUniqueRestrType(
						supportDocBackingBean.restrApp)}" />
				</p:selectOneMenu>
				<p:message id="somAppTypeMsg" for="somAppType" display="icon" />
			</p:column>
			<p:column style="width:40%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.suppdoc.section']}" />
					<ac:iconTooltip value="#{lbl['lbl.pm.suppdoc.section.tooltip']}" />
				</f:facet>
				<div style="display: table; width: 100%;">
					<div style="display: table-cell; width: 94%;white-space:normal;">
						<h:outputText value="#{supportDocBackingBean.constructSectionString(restrict)}" />
					</div>
					<div style="display: table-cell; width: 6%; text-align: right;">
						<p:commandLink partialSubmit="true" 
						    process="@this"
						    action="#{supportDocBackingBean.showsSectionPopup()}"
							update=":form:tvDocRestriction:dlRestApTypeSection">
							<p:graphicImage title="#{lbl['lbl.pm.org.edit']}"
								value="/css/images/design/edit.png" />
							<f:setPropertyActionListener
								target="#{supportDocBackingBean.managedBean.selectedAppTypeRestr}"
								value="#{restrict}" />
						</p:commandLink>
					</div>
				</div>
			</p:column>
			<p:column style="width:10%;text-align:center;white-space:normal;">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.sm.facility.facilityType.home.office']}" />
					<ac:iconTooltip value="#{lbl['lbl.pm.suppdoc.homeoffice.tooltip']}" />
				</f:facet>
				<p:selectBooleanCheckbox id="chkHomeOffice"
					value="#{restrict.homeOffice}" />
			</p:column>
			<!-- #29857- Start -->
			<p:column style="width:12%;text-align:center;white-space:normal;">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.sm.facility.facilityType.business.office']}" />
					<ac:iconTooltip value="#{lbl['lbl.pm.suppdoc.businessoffice.tooltip']}" />
				</f:facet>
				<p:selectBooleanCheckbox id="chkBusinessOffice"
					value="#{restrict.businessOffice}" />
			</p:column>
			<!-- #29857 - End -->
			<p:column style="width:5%;text-align:center;"
				headerText="#{lbl['lbl.pm.action']}">
				<p:commandLink partialSubmit="true" process="@this"
					oncomplete="appTypeDeletePopUp.show();"
					update="@([id$=#{appTypeDeleteId}])">
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					<f:setPropertyActionListener
						target="#{supportDocBackingBean.managedBean.deleteRowIndex}"
						value="#{rowIndex}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" update="dtAppType"
				process="@this"
				action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrApp)}"
				immediate="true" />
		</div>
		<ac:confirmationPopup id="appTypeDeleteId" widget="appTypeDeletePopUp"
			okAction="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrApp)}"
			width="400" height="100"
			title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}"
			update=":#{p:component('dtAppType')}" />

		<ui:include src="/xhtml/pm/supportingdocument/restrAppTypePopUp.xhtml" />
	</p:outputPanel>
</ui:composition>
