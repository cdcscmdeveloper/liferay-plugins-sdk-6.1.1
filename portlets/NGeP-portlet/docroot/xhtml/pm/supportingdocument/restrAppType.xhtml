<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel
		rendered="#{supportDocBackingBean.managedBean.selectedDocument.byAppType}">
		<p:dataTable id="dtAppType"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"			
			rowKey="#{restrict}" rowIndexVar="rowIndex"
			value="#{supportDocBackingBean.managedBean.appTypeRestrictions}"
			var="restrict">
			<ac:paginator for="dtAppType" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.application.type']}" />
				</f:facet>
				<h:outputText
					value="#{supportDocBackingBean.getParameterDesc(restrict.appTypeCode)}"
					rendered="#{!restrict.brandNew}" />
				<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthL"
					required="true" label="#{lbl['lbl.pm.application.type']}"
					value="#{restrict.appTypeCode.parameterId}"
					rendered="#{restrict.brandNew}">
					<f:selectItems
						value="#{supportDocBackingBean.applicationTypeOptions()}" />
					<p:ajax event="change"
						listener="#{supportDocBackingBean.validateUniqueRestrType(
						supportDocBackingBean.restrApp)}" />
				</p:selectOneMenu>
				<p:message id="somAppTypeMsg" for="somAppType" display="icon" />
			</p:column>		
			<p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">
	           <p:commandLink partialSubmit="true" 
					process="@this" action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrApp,rowIndex)}"
					update="dtAppType" >
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" update="dtAppType" process="@this"
				action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrApp)}"
				immediate="true" />			
		</div>
	</p:outputPanel>
</ui:composition>
