<ui:composition

>

	<p:panel id="pSupportDocResult" header="#{lbl['lbl.pm.support.doc.result']}" toggleable="true">

			 >

	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pm.document.name']}">  
	            
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pm.company.restriction']}">  
	            
	        </p:column> 
	        <p:column headerText="#{lbl['lbl.pm.application.restriction']}">  
	            
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pm.category.restriction']}">  
	            
	        </p:column>
	        <p:column headerText="#{lbl['lbl.pm.status']}">  
	            
	        </p:column>  
	        <p:column headerText="#{lbl['lbl.pm.action']}">  
      		   <p:commandLink>
					<p:graphicImage value="/css/images/design/edit.png"/>

	        </p:column>

			<p:commandButton value="#{lbl['lbl.btn.create']}" icon="ui-icon-add"
