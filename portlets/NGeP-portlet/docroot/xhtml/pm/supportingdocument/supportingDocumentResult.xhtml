<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>

	<p:panel id="pSupportDocResult" header="#{lbl['lbl.pm.support.doc.result']}" toggleable="true">
		<p:dataTable id="dtSupportDocResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}" rows="10" lazy="true"
			 rowIndexVar="rowIndex" value="#{supportDocBackingBean.pmDocumentDataModel}" var="document" >
			<ac:paginator for="dtSupportDocResult" />
			<p:column headerText="#{lbl['lbl.pm.document.name']}"  style="width:50%; white-space:normal;">
	            #{document.docName}
	        </p:column> 
           <p:column style="width:10%;" headerText="#{lbl['lbl.pm.supplier.zone']}" > 
		    	<h:outputText value="#{document.pmZone.zoneName}" rendered="#{document.docCategoryCode.parameterCode == ParameterConst.documentCategorySupplierDocument and !empty document.pmZone}" />
		    	<h:outputText value="#{lbl['lbl.pm.supplier.zone.all']}" rendered="#{document.docCategoryCode.parameterCode == ParameterConst.documentCategorySupplierDocument and empty document.pmZone}" />
	        </p:column>  
	        <p:column style="width:10%;" headerText="#{lbl['lbl.pm.restriction']}">  
	            #{(document.byCompType or document.byAppType or document.byCategory or document.byProcureCat) ? lbl['lbl.btn.yes'] : lbl['lbl.btn.no'] }
	        </p:column> 
	        <p:column style="width:10%;" headerText="#{lbl['lbl.pm.status']}">  
	            #{(document.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	        </p:column>  
	        <p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">  
      		   <p:commandLink action="#{supportDocBackingBean.redirectToMaintainDoc(document.documentId)}" >
					<p:graphicImage value="/css/images/design/edit.png"/>
				</p:commandLink>
	        </p:column>  
	   	</p:dataTable>    
	</p:panel>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.create']}" 
				action="#{supportDocBackingBean.redirectToMaintainDoc(null)}"/>
		</div>
</ui:composition>
