<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<br/>
	<p:dataTable id="dtSuppType" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
		selection="#{supportDocBackingBean.managedBean.deleteSuppTypeRestrictions}" rowKey="#{restrict}"
		value="#{supportDocBackingBean.managedBean.suppTypeRestrictions}" var="restrict" 
		>
		<ac:paginator for="dtSuppType" />
		<p:ajax event="toggleSelect" update="@this" process="@this" />
		<p:ajax event="rowSelectCheckbox" update="@this" />
		<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />

        <p:column> 
        	<f:facet name="header">
		     	<h:outputText value="* " styleClass="mandatory" />
		     	<h:outputText value="#{lbl['lbl.pm.supplier.type']}" />
		    </f:facet> 
	    	<p:selectOneMenu id="somSuppType" styleClass="ppDropDownWidthL"
				value="#{restrict.supplierTypeCode.parameterId}">
				<f:selectItems  value="#{supportDocBackingBean.supplierTypeOptions()}"/>
				<p:ajax event="change" listener="#{supportDocBackingBean.validateUniqueRestrType(
					supportDocBackingBean.restrSupp)}"/>
			</p:selectOneMenu>
        </p:column>  
        <p:column>  
        	<f:facet name="header">
		     	<h:outputText value="* " styleClass="mandatory" />
		     	<h:outputText value="#{lbl['lbl.pm.status']}" />
		    </f:facet>
	        <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
				<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
			</p:selectOneMenu>
        </p:column>  
   	</p:dataTable>
   	<br/>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.add']}"   update="dtSuppType"
			action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrSupp)}"
			immediate="true"/>
		&#160;
		<p:commandButton id="cbSuppDelete" value="#{lbl['lbl.btn.delete']}"  update="dtSuppType"
			action="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrSupp)}"
			immediate="true" />
	</div>

</ui:composition>
