<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel
		rendered="#{supportDocBackingBean.managedBean.selectedDocument.byCompType}">
		<p:dataTable id="dtComType"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"			
			rowKey="#{restrict}" rowIndexVar="rowIndex"
			value="#{supportDocBackingBean.managedBean.comTypeRestrictions}"
			var="restrict">
			<ac:paginator for="dtComType" />
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.pm.company.type']}" />
				</f:facet>
				<h:outputText
					value="#{supportDocBackingBean.getParameterDesc(restrict.companyTypeCode)}"
					rendered="#{!restrict.brandNew}" />
				<p:selectOneMenu id="somCompType" styleClass="ppDropDownWidthL"
					required="true" label="#{lbl['lbl.pm.company.type']}"
					value="#{restrict.companyTypeCode.parameterId}"
					rendered="#{restrict.brandNew}">
					<f:selectItems
						value="#{supportDocBackingBean.companyTypeOptions()}" />
					<p:ajax event="change"
						listener="#{supportDocBackingBean.validateUniqueRestrType(
					supportDocBackingBean.restrComp)}" />
				</p:selectOneMenu>
				<p:message id="somCompTypeMsg" for="somCompType" display="icon" />
			</p:column>		
			<p:column style="width:5%;text-align:center;" headerText="#{lbl['lbl.pm.action']}">
	         	<p:commandLink partialSubmit="true" 
					process="@this" 
					oncomplete="compTypeDeletePopUp.show();"
					update="@([id$=#{compTypeDeleteId}])"  >
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					<f:setPropertyActionListener target="#{supportDocBackingBean.managedBean.deleteRowIndex}" 
							value="#{rowIndex}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" update="dtComType" process="@this"
				action="#{supportDocBackingBean.addRestriction(supportDocBackingBean.restrComp)}"
				immediate="true" />			
		</div>
		<ac:confirmationPopup id="compTypeDeleteId"
				widget="compTypeDeletePopUp"
				okAction="#{supportDocBackingBean.deleteRestrictions(supportDocBackingBean.restrComp)}"
				width="400" height="100"
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" 
				update=":#{p:component('dtComType')}" />
	</p:outputPanel>
</ui:composition>
