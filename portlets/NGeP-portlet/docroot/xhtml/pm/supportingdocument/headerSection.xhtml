<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:outputPanel id="pSupportDocHeader">

		<table style="width: 100%">
			<tr>
				<td>
					<div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
							action="#{supportDocBackingBean.redirectToSearchSupportDoc}" />
					</div>
				</td>
				<td>
					<div align="right" style="width: 100%">
						<!-- 34445 start -->
						<c:choose>
							<c:when test="#{supportDocBackingBean.managedBean.selectedDocument.brandNew}">
								<p:commandButton value="#{lbl['lbl.btn.save']}" oncomplete="if (!args.validationFailed) saveInfoDlg.show()">
									<f:param name="disableValidation" value="true" />
								</p:commandButton>
							</c:when>
							<c:otherwise>
								<p:commandButton value="#{lbl['lbl.btn.update']}" oncomplete="if (!args.validationFailed) updateInfoDlg.show()">
									<f:param name="disableValidation" value="true" />
								</p:commandButton>
							</c:otherwise>
						</c:choose>
						<!-- 34445 end -->
					</div>
				</td>
			</tr>
		</table>
		
		<!-- 34445 start -->
		<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
			okParam="#{supportDocBackingBean.saveSupportDoc()}"
			hasParam="true"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.save.msg']}"
			update=":form"/>
			
		<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
			okAction="supportDocBackingBean.saveSupportDoc()"
			width="400" height="100"
			title="#{lbl['lbl.btn.dialog.cofirm.header']}"
			content="#{lbl['lbl.pm.btn.update.msg']}"
			update=":form"/>
		<!-- 34445 end -->
	</p:outputPanel>
</ui:composition>
