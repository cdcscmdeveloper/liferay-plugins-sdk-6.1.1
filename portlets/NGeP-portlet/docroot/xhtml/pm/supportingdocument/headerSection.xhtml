<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:outputPanel id="pSupportDocHeader">

		<table style="width: 100%">
			<tr>
				<td>
					<div align="left" style="width: 100%">
						<p:commandButton value="#{lbl['lbl.btn.back']}" immediate="true"
							action="#{supportDocBackingBean.redirectToSearchSupportDoc}" />
					</div>
				</td>
				<td>
					<div align="right" style="width: 100%">
						<p:commandButton
							value="#{supportDocBackingBean.managedBean.selectedDocument.brandNew? lbl['lbl.btn.save'] : lbl['lbl.btn.update']}"
							action="#{supportDocBackingBean.saveSupportDoc()}" update="@form">
							<f:param name="disableValidation" value="true" />
						</p:commandButton>
					</div>
				</td>
			</tr>
		</table>
	</p:outputPanel>
</ui:composition>
