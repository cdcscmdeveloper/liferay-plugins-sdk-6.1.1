<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<!-- Search Category-->
	<p:panel id="pCatSearch" header="* #{lbl['lbl.pm.search.category']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthM">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthM">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="10"/>
				</td>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthS">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthM">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthM">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="10"/>
				</td>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthS">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthM">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:selectOneMenu  styleClass="ppDropDownWidthM">
						<f:selectItem  itemLabel="Select" itemValue="0" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="10"/>
				</td>
				<td>
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" icon="ui-icon-search" 
							process="pCatSearch"
							/>&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset"
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
	
	<!-- Category Result -->
	<p:panel id="pCatResult" header="* #{lbl['lbl.pm.category.result']}" toggleable="true">
		<br/>
		<p:dataTable id="dtCatResult" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			>
			<p:ajax event="toggleSelect" update="@this" process="@this" />
			<p:ajax event="rowSelectCheckbox" update="@this" />
			<p:column selectionMode="multiple" disabledSelection="#{!restrict.brandNew}" style="width:2%" />

	        <p:column headerText="* #{lbl['lbl.pm.sub.div.category']}">  
		    	<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM"
					value="#{restrict.restrType.parameterId}">
					<f:selectItems  value="#{supportDocBackingBean.supplierTypeOptions()}"/>
				</p:selectOneMenu>
	        </p:column>  
	        <p:column headerText="* #{lbl['lbl.pm.category.name']}">  
		        <p:selectOneMenu styleClass="ppDropDownWidthS" value="#{restrict.recordStatusFlg}">
					<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
				</p:selectOneMenu>
	        </p:column>  
	   	</p:dataTable>
   	 	<br/>
   		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}"   update="dtCatResult"
				immediate="true"/>
			&#160;
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" icon="ui-icon-cancel"  update="dtCatResult"
				immediate="true" oncomplete="dlCatDetModal.hide()"
				/> 
		</div>
	</p:panel>
</ui:composition>
