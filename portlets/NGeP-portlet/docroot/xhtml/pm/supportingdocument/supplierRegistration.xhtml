<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>

	<p:panel id="pSupportDocDet" header="#{lbl['lbl.pm.document.details']}" toggleable="true">	
	<br/>
	<!-- Document Detail -->
	<table class="ppTwoTable">
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
				<p:outputLabel value="*" styleClass="mandatory" />
			</th>
			<td>
				<p:inputTextarea value="#{supportDocBackingBean.managedBean.selectedDocument.docName}"
			 		cols="50" rows="5" maxlength="1000"/>
			</td>
			<th>
				<p:outputLabel value="#{lbl['lbl.pm.document.restriction']}"/>
			</th>
			<td colspan="3">
				<p:selectBooleanCheckbox id="chkAppType" value="#{supportDocBackingBean.managedBean.selectedDocument.byAppType}">
					<p:ajax event="change" update="pDocRestriction" 
						listener="#{supportDocBackingBean.defaultTab(supportDocBackingBean.managedBean.selectedDocument)}"/>
				</p:selectBooleanCheckbox>
			 	<h:outputText value="#{lbl['lbl.pm.by.application.type']}"/>
			 	<br/>
			 	
				<p:selectBooleanCheckbox id="chkComType" value="#{supportDocBackingBean.managedBean.selectedDocument.byCompType}">
					<p:ajax event="change" update="pDocRestriction" 
						listener="#{supportDocBackingBean.defaultTab(supportDocBackingBean.managedBean.selectedDocument)}"/>
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.pm.by.company.type']}"/>
				<br/>
				
				<p:selectBooleanCheckbox id="chkSuppType" value="#{supportDocBackingBean.managedBean.selectedDocument.bySupplierType}">
					<p:ajax event="change" update="pDocRestriction" 
						listener="#{supportDocBackingBean.defaultTab(supportDocBackingBean.managedBean.selectedDocument)}"/>
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.pm.by.supplier.type']}"/>
				<br/>
				
				<p:selectBooleanCheckbox id="chkCat" value="#{supportDocBackingBean.managedBean.selectedDocument.byCategory}">
					<p:ajax event="change" update="pDocRestriction" 
						listener="#{supportDocBackingBean.defaultTab(supportDocBackingBean.managedBean.selectedDocument)}"/>
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.pm.by.category']}"/>
				<br/>
				</td>
		</tr>
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}"/>
				<p:outputLabel value="*" styleClass="mandatory" />
			</th>
			<td>
				<p:selectOneMenu id="somSuppZone" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.zone']}"
					value="#{supportDocBackingBean.managedBean.selectedDocument.pmZone.zoneId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 		
					<f:selectItems  value="#{supportDocBackingBean.supplierZoneOptions()}" 
						var="zone" itemLabel="#{zone.zoneName}" itemValue="#{zone.zoneId}"/>
				</p:selectOneMenu>
			</td>
			<th>
				
			</th>
		
		</tr>
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pm.status']}"/>
			</th>
			<td>
				<p:selectOneMenu styleClass="ppDropDownWidthM" 
					value="#{supportDocBackingBean.managedBean.selectedDocument.recordStatusFlg}">
					<f:selectItems  value="#{supportDocBackingBean.getStatusOptions()}"/>
				</p:selectOneMenu>
			</td>
			<th>
				
			</th>
			
		</tr>
	</table>
	</p:panel>
	
	<br/>
	<!-- Document Restriction -->
	<ui:include src="restrictionList.xhtml"/>
	

</ui:composition>
