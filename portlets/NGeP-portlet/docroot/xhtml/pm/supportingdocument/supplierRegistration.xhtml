<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="pSupportDocDet" header="#{lbl['lbl.pm.document.details']}"
		toggleable="true">
		<p:outputPanel id="opSupportDocDet"
			rendered="#{supportDocBackingBean.managedBean.selectedDocument.docCategoryCode.parameterId>0}">

			<!-- Document Detail -->
			<table class="ppTwoTable">
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.display.priority']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></th>
					<td><p:inputText id="itaDisplayPiror"
							value="#{supportDocBackingBean.managedBean.selectedDocument.displaySeq}"
							required="true" label="#{lbl['lbl.pm.display.priority']}"
							maxlength="5" /> <ac:iconTooltip
							value="#{lbl['lbl.pm.tooltip.display.priority']}" /> <p:message
							id="itaDisplayPirorMsg" for="itaDisplayPiror" display="icon" />
					</td>
					<th colspan="2"><p:outputLabel style="float : left;"
							value="#{lbl['lbl.pm.document.restriction']}" /></th>
					<th></th>
					<td></td>
					<th></th>
					<td></td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.document.name']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></th>
					<td><p:inputTextarea id="itaDocName" disabled="#{!(supportDocBackingBean.managedBean.selectedDocument.brandNew)}"
							value="#{supportDocBackingBean.managedBean.selectedDocument.docName}"
							label="#{lbl['lbl.pm.document.name']}" autoResize="false"
							cols="50" rows="5" maxlength="1000"
							required="#{!empty param['disableValidation']}" /> <p:message
							id="itaDocNameMsg" for="itaDocName" display="icon" /></td>
			     	<th></th>
				    <td style="vertical-align: top;"><p:selectBooleanCheckbox id="chkAppType"
							value="#{supportDocBackingBean.managedBean.selectedDocument.byAppType}">
							<p:ajax event="change" process="@this" update="pDocRestriction"
								listener="#{supportDocBackingBean.checkDocumentRestrictions(supportDocBackingBean.restrApp)}" />
						</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.pm.by.application.type']}" /> 
						<br />
						<p:selectBooleanCheckbox id="chkCat"
							value="#{supportDocBackingBean.managedBean.selectedDocument.byCategory}">
							<p:ajax event="change" process="@this" update="pDocRestriction"
								listener="#{supportDocBackingBean.checkDocumentRestrictions(supportDocBackingBean.restrCategory)}" />
						</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.pm.by.category']}" /> 
						</td>
					<th></th>
					<td style="vertical-align: top;">
						<p:selectBooleanCheckbox id="chkComType"
							value="#{supportDocBackingBean.managedBean.selectedDocument.byCompType}">
							<p:ajax event="change" process="@this" update="pDocRestriction"
								listener="#{supportDocBackingBean.checkDocumentRestrictions(supportDocBackingBean.restrComp)}" />
						</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.pm.by.company.type']}" /> 
						<br />
                       <p:selectBooleanCheckbox
							id="chkCertBody"
							value="#{supportDocBackingBean.managedBean.selectedDocument.byCertBody}">
							<p:ajax event="change" process="@this" update="pDocRestriction"
								listener="#{supportDocBackingBean.checkDocumentRestrictions(supportDocBackingBean.restrCertbody)}" />
						</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.pm.suppdoc.certified.body']}" />
						</td>
						<th></th>
						<td style="vertical-align: top;">
						<p:selectBooleanCheckbox id="chkSuppType"
							value="#{supportDocBackingBean.managedBean.selectedDocument.bySupplierType}">
							<p:ajax event="change" process="@this" update="pDocRestriction"
								listener="#{supportDocBackingBean.checkDocumentRestrictions(supportDocBackingBean.restrSupp)}" />
						</p:selectBooleanCheckbox> <h:outputText value="#{lbl['lbl.pm.by.supplier.type']}" /> <br />						
						<br /></td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></th>
					<td><p:selectOneMenu id="somSuppZone"
							styleClass="ppDropDownWidthM"
							label="#{lbl['lbl.pm.supplier.zone']}"
							value="#{supportDocBackingBean.managedBean.selectedDocument.pmZone.zoneId}"
							disabled="#{!(supportDocBackingBean.managedBean.selectedDocument.brandNew)}"
							required1="#{!empty param['disableValidation']}">
							<c:if
								test="#{supportDocBackingBean.managedBean.selectedDocument.brandNew}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{0}" />
							</c:if>
							<f:selectItems
								value="#{supportDocBackingBean.supplierZoneOptions()}"
								var="zone" itemLabel="#{zone.zoneName}"
								itemValue="#{zone.zoneId}" />
						</p:selectOneMenu> <p:message id="somSuppZoneMsg" for="somSuppZone" display="icon" />
					</td>
					<th colspan="2"><p:outputLabel style="float : left;"
							value="#{lbl['lbl.pm.document.type']}" /></th>
					
					<th></th>
					<td></td>
					<th></th>
					<td></td>
				</tr>
				<tr>
					<th><p:outputLabel value="#{lbl['lbl.pm.status']}" /></th>
					<td><p:selectOneMenu styleClass="ppDropDownWidthM"
							id="somDocStatus" required="true" label="#{lbl['lbl.pm.status']}"
							disabled="#{supportDocBackingBean.managedBean.selectedDocument.brandNew}"
							value="#{supportDocBackingBean.managedBean.selectedDocument.recordStatusFlg}">
							<f:selectItems
								value="#{supportDocBackingBean.getActiveAndInactiveStatusOptions()}" />
						</p:selectOneMenu> <p:message id="somDocStatusMsg" for="somDocStatus" display="icon" />
					</td>
					<th></th>
					<td><p:selectBooleanCheckbox id="chkMandatory"
							value="#{supportDocBackingBean.managedBean.selectedDocument.mandatory}" />
							<h:outputText value="#{lbl['lbl.pm.mandatory']}" /></td>
					<th></th>
					<td><p:selectBooleanCheckbox id="chkLicense"
							value="#{supportDocBackingBean.managedBean.selectedDocument.licenseReq}" />
							 <h:outputText value="#{lbl['lbl.pm.license.required']}" /></td>
					<th></th>
					<td><p:selectBooleanCheckbox id="chkHardCopy"
							value="#{supportDocBackingBean.managedBean.selectedDocument.hardCopyReq}" />
							<h:outputText value="#{lbl['lbl.pm.hard.copy']}" /></td>
							
				</tr>
			</table>
		</p:outputPanel>
	</p:panel>


	<!-- Document Restriction -->
	<ui:include src="restrictionList.xhtml" />


</ui:composition>
