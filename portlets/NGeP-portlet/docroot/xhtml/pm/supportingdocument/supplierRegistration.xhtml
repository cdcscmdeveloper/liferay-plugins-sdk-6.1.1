<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>

	<p:panel id="pSupportDocDet" header="#{lbl['lbl.pm.document.details']}" toggleable="true">	
	<br/>
	<!-- Document Detail -->
	<table class="ppTwoTable">
		<tr>
			<th>
				<p:outputLabel value="* #{lbl['lbl.pm.document.name']}"/>
			</th>
			<td>
				<p:inputTextarea
			 		cols="50" rows="5" maxlength="255"/>
			</td>
			<th>
				<p:outputLabel value="#{lbl['lbl.pm.document.restriction']}"/>
			</th>
			<td colspan="3">
				<p:selectBooleanCheckbox id="chkAppType">
					<p:ajax event="change" />
				</p:selectBooleanCheckbox>
			 	<h:outputText value="#{lbl['lbl.pm.by.application.type']}"/>
			 	<br/>
			 	
				<p:selectBooleanCheckbox id="chkComType">
					<p:ajax event="change" />
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.pm.by.company.type']}"/>
				<br/>
				
				<p:selectBooleanCheckbox id="chkSuppType">
					<p:ajax event="change" />
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.pm.by.supplier.type']}"/>
				<br/>
				
				<p:selectBooleanCheckbox id="chkCat">
					<p:ajax event="change" />
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.pm.by.category']}"/>
				<br/>
				</td>
		</tr>
		<tr>
			<th>
				<p:outputLabel value="* #{lbl['lbl.pm.supplier.zone']}"/>
			</th>
			<td>
				<p:selectOneMenu id="somSuppZone" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.zone']}"
				>
					<f:selectItems  value="#{supportDocBackingBean.supplierZoneOptions()}"/>
				</p:selectOneMenu>
			</td>
			<th>
				
			</th>
		
		</tr>
		<tr>
			<th>
				<p:outputLabel value="#{lbl['lbl.pm.status']}"/>
			</th>
			<td>
				<p:selectOneMenu styleClass="ppDropDownWidthM" >
					<f:selectItems  value="#supportDocBackingBean.getStatusOptions()}"/>
				</p:selectOneMenu>
			</td>
			<th>
				
			</th>
			
		</tr>
	</table>
	</p:panel>
	
	<br/>
	<!-- Document Restriction -->
	<ui:include src="restrictionList.xhtml"/>
	

</ui:composition>
