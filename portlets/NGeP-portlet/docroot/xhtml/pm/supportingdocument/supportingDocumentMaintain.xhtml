<ui:composition
template="/WEB-INF/facelets/templates/basic_template.xhtml"
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<ui:define name="contentSection">
		<p:outputPanel id="opSupportDocMaintain">
			<!-- Validation Message -->
			<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
			
			<!-- Header -->
			<ui:include src="headerSection.xhtml"/>
			
			<table class="ppOneTable">
				<tr>
					<th>
						<p:outputLabel value="#{lbl['lbl.pm.document.category']}"/>
						<p:outputLabel value="*" styleClass="mandatory" />
					</th>
					<td>
						<p:selectOneMenu id="somDocCategory" disabled="#{!supportDocBackingBean.managedBean.selectedDocument.brandNew}"
							value="#{supportDocBackingBean.managedBean.selectedDocument.docCategoryCode.parameterId}"
							label="#{lbl['lbl.pm.document.category']}" styleClass="ppDropDownWidthM"  >
							<f:selectItems  value="#{supportDocBackingBean.documentCategoryOptions()}"/>
							<p:ajax event="change" update="opDocDetails" listener="#{supportDocBackingBean.docCategoryChange}"/>
						</p:selectOneMenu>
						<p:message id="somDocCategoryMsg" for="somDocCategory" display="icon" />
					</td>
				</tr>
			</table>
			<br/>
			<p:outputPanel id="opDocDetails">
				<c:choose>
					<c:when test="#{!supportDocBackingBean.managedBean.checkList}">
						<!-- Supplier Registration Details -->
						<ui:include src="supplierRegistration.xhtml"/>		
					</c:when>
					<c:otherwise>
						<!-- Checklist Details -->
						<ui:include src="checklist.xhtml"/>					
					</c:otherwise>
				</c:choose>
			</p:outputPanel>
		</p:outputPanel>
		<ac:lovPopup /> 
 	</ui:define>
</ui:composition>
