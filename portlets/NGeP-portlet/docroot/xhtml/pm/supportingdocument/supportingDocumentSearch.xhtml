<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pSupportDocSearch" header="#{lbl['lbl.pm.search.support.doc']}" toggleable="true">
		
		<table class="ppTwoTable">
			<tr>
				<th width="20%">
					<p:outputLabel value="#{lbl['lbl.pm.document.category']}"/>
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu id="somDocCate" label="#{lbl['lbl.pm.document.category']}" styleClass="ppDropDownWidthM"  
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docCategoryParamCode}">
						<f:selectItems  value="#{supportDocBackingBean.documentCategoryWithoutSupplierDoc(false)}"/>
						<p:ajax event="change" update="pSupportDocSearch" listener="#{supportDocBackingBean.docCategorySearchChange()}"/>
					</p:selectOneMenu>
				</td>
				<th width="20%">
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
				</th>
				<td>
					<p:inputTextarea id="itaDocName" value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docName}"
							label="#{lbl['lbl.pm.document.name']}" autoResize="false"
					 		cols="31" rows="4" maxlength="350" />
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.procurement.category']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somProcureCat" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.procurement.category']}"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.procureCatParam}">
							<f:selectItems  value="#{supportDocBackingBean.procurementTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.suppdoc.status']}" /></th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docStatus}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{supportDocBackingBean.getActiveAndInactiveStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							process="pSupportDocSearch"
							update="dtSupportDocResult" 
							action="#{supportDocBackingBean.searchDocument}"
							/>
						<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{supportDocBackingBean.resetSupportDocSearchBean}"
							update="pSupportDocSearch, dtSupportDocResult" 
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
