<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
>
	<p:panel id="pSupportDocSearch" header="#{lbl['lbl.pm.search.support.doc']}" toggleable="true">
		<br/>
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.category']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somDocCate" label="#{lbl['lbl.pm.document.category']}" styleClass="ppDropDownWidthM"  
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docCategoryParam.parameterId}">
						<f:selectItems  value="#{supportDocBackingBean.documentCategoryOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somSuppZone" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.zone']}"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.pmZone.zoneId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
						<f:selectItems  value="#{supportDocBackingBean.supplierZoneOptions()}"  
							var="zone" itemValue="#{zone.zoneId}" itemLabel="#{zone.zoneName}" />
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="1000" label="#{lbl['lbl.pm.document.name']}"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docName}"/>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somSuppType" styleClass="ppDropDownWidthM" 
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.suppTypeParam.parameterId}">
						<f:selectItems  value="#{supportDocBackingBean.supplierTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.application.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM" 
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.appTypeParam.parameterId}">
						<f:selectItems  value="#{supportDocBackingBean.applicationTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.company.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somComType" styleClass="ppDropDownWidthM"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.comTypeParam.parameterId}">
						<f:selectItems  value="#{supportDocBackingBean.companyTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.business.category']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="10" label="#{lbl['lbl.pm.business.category']}"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.businessCategory}" />
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							process="pSupportDocSearch"
							update="dtSupportDocResult" 
							action="#{supportDocBackingBean.searchDocument}"
							/>&#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{supportDocBackingBean.resetSupportDocSearchBean}"
							update="pSupportDocSearch" 
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
