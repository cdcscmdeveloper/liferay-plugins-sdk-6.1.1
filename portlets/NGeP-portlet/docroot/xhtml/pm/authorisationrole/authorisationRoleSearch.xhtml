<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="search" style="width:100%;">
	</h:panelGrid>
     
			<p:tabView>
				<p:tab id="definedSearch" title="DEFINED SEARCH">
				   <ui:include src="/xhtml/pm/authorisationrole/authorisationRoleDefinedSearch.xhtml" />
				</p:tab>
				<p:tab id="advancedSearch" title="ADVANCED SEARCH">
				   <ui:include src="/xhtml/pm/authorisationrole/authorisationRoleAdvancedSearch.xhtml" />					
				</p:tab>			
			</p:tabView>
				
      <div align="right">
			<p:commandButton value="Search" icon="ui-icon-search"></p:commandButton>
            <p:commandButton value="Reset" icon="ui-icon-reset"></p:commandButton>
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchProfile"  value="" var="userprofile" editable="true">
 			<ac:paginator />
    <p:ajax event="rowEdit" />  
    <p:ajax event="rowEditCancel"/> 
				
       <p:column headerText="Role Code" >
        <p:cellEditor>
         <f:facet name="output">  
          <h:outputText value="FL_Approver"/>
         </f:facet> 
		 <f:facet name="input"> 
          <h:outputText value="FL_Approver"/>
         </f:facet>         
        </p:cellEditor>   
       </p:column>
       
       <p:column headerText="Role Name" >
        <p:cellEditor> 
         <f:facet name="output"> 
          <h:outputText value="Fulfilment Approver"/> 
         </f:facet>
         <f:facet name="input"> 
          <h:outputText value="Fulfilment Approver"/>
         </f:facet>  
        </p:cellEditor> 
       </p:column>
       
     <p:column headerText="Role Group Name" >
      <p:cellEditor> 
       <f:facet name="output"> 
         <h:outputText value="Approver"/> 
       </f:facet> 
       <f:facet name="input"> 
          <h:outputText value="Approver"/>
         </f:facet> 
      </p:cellEditor>    
    </p:column>
    
     <p:column headerText="Approval Limit"> 
    </p:column>
    <p:column headerText="#{lbl['lbl.pm.action']}">
	<p:rowEditor />
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="Create" action="roleMaintenance.xhtml?faces-redirect=true" style="float:right;" ajax="false"
       	 icon="ui-icon-add" />
	 </h:panelGrid>	
	</p:panel>

</ui:composition>
