<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel>
	<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
   </p:panel>
	
   <p:panel header="ROLE INFORMATION" toggleable="true">
		
	<h:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">
	
	<h:outputLabel value="Role Code :"></h:outputLabel>
	<p:inputText size="30"></p:inputText>
	
	<h:outputLabel value="Role Name :"></h:outputLabel>
	<p:inputText size="50"></p:inputText>
	
	<h:outputLabel value="Role Group Code :"></h:outputLabel>
	<p:inputText size="30"></p:inputText>
	
	<h:outputLabel value="Group Role Name :"></h:outputLabel>
	<p:inputText size="50"></p:inputText>
	
	<h:outputLabel value="Approval Limit?"></h:outputLabel>
    <p:selectOneRadio>  
      <f:selectItem itemLabel="Yes" itemValue="1" />  
      <f:selectItem itemLabel="No" itemValue="2" />  
    </p:selectOneRadio>
    
	</h:panelGrid> 
	   
	<h:panelGrid columns="2">
	
	<h:outputLabel value="* Org.Type"></h:outputLabel>
	<p:columnGroup> 
	<p:graphicImage library="ep/images/design" name="edit.png"
       value="/resources/ep/images/design/edit.png" />   
	</p:columnGroup>	
	
	</h:panelGrid>	
					
   </p:panel>
</ui:composition>
