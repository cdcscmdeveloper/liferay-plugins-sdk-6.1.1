<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="projectPanel" header="#{lbl['lbl.pm.project.search.location']}" toggleable="true" >

		<table class="ppTwoTable">
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.vot.project.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{projectBackingBean.managedBean.projectSearchBean.votCode}"
						id="votCode" size="28" /></td>			
				
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.vot.project.desc']}"></p:outputLabel></td>
				<td width="17%"><p:inputText
						value="#{projectBackingBean.managedBean.projectSearchBean.votName}"
						size="50" /></td>
				<th>&#160;</th>
				<td>&#160;</td>				
			</tr>			
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.sub.setia.project.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{projectBackingBean.managedBean.projectSearchBean.projectCode}"
						id="projectCodeId" size="28" /></td>			
				
				<td width="1%"><p:outputLabel value="#{lbl['lbl.pm.sub.setia.project.desc']}"></p:outputLabel></td>
				<td width="17%"><p:inputText
						value="#{projectBackingBean.managedBean.projectSearchBean.projectDesc}"
						size="50" /></td>				
			</tr>						
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.project.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{projectBackingBean.managedBean.projectSearchBean.status}">
						<f:selectItems value="#{projectBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{projectBackingBean.searchProject}"
							update=":form:projectResult" />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{projectBackingBean.resetProjectSearchBean}"
							process="@this"
							update=":form:projectPanel, :form:projectResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
