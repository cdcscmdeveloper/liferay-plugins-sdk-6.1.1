<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="projectResult"
		header="#{lbl['lbl.pm.project.search.result']}" toggleable="true">
		<p:dataTable id="projectSR"
			emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			value="#{projectBackingBean.searchProject}" rows="10"
			var="projectList" rowIndexVar="index" lazy="true">
			<ac:paginator for="projectSR" />

			<p:column style="width:10%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.vot.project.code']}" />
				</f:facet>
				<ui:repeat var="pmVotFunds" value="#{projectList.pmVotFund}">
					<h:outputText value="#{(pmVotFunds.votFundCode)}" />
					<br />
				</ui:repeat>
			</p:column>

			<p:column style="width:30%;white-space: normal;word-wrap: break-word;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.pm.vot.project.desc']}" />
				</f:facet>
				<ui:repeat var="pmVotFunds" value="#{projectList.pmVotFund}">
					<h:outputText value="#{(pmVotFunds.description)}" />
					<br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.sub.setia.project.code']}"
				style="width:15%;">
				<h:outputText value="#{projectList.projectCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.sub.setia.project.desc']}"
				style="width:30%">
				<h:outputText value="#{projectList.description}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.sub.setia.setia.code']}"
				style="width:15%;">
				<h:outputText value="#{projectList.setiaCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.sub.setia.sub.setia.code']}"
				style="width:15%;">
				<h:outputText value="#{projectList.subSetiaCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.sub.setia.payment']}"
				style="width:20%;">
				<h:outputText
					value="#{projectBackingBean.getParameterDesc(projectList.financingType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.search.status']}"
				style="width:10%;white-space: normal;word-wrap: break-word;"> 
   	    #{(projectList.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}              
       </p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
