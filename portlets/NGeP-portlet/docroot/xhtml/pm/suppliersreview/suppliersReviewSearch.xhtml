<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="suppliersReviewPanel"
		header="#{lbl['lbl.pm.sr.search.location']}" toggleable="false">

		<table class="ppTwoTable">
			<tr>
				<td width="18%"><p:outputLabel value="#{lbl['lbl.pm.sr.paid.up.capital']}"></p:outputLabel></td>
				<td colspan="3"><p:inputText
						value="#{suppliersReviewBackingBean.managedBean.suppliersReviewSearchBean.paidUpCapitalAmtFrom}"
						size="15" /><p:outputLabel style="float:initial;width:3%;" value=" To "></p:outputLabel>				
				<p:inputText style="text-align:left;"
						value="#{suppliersReviewBackingBean.managedBean.suppliersReviewSearchBean.paidUpCapitalAmtTo}"
						size="15" /></td>
			</tr>
			<tr>
			<td width="18%"><p:outputLabel value=""></p:outputLabel></td>
				<td><h:selectBooleanCheckbox 
						label="#{lbl['lbl.pm.sr.all.states']}" styleClass="allStatesChkID"
						value="#{suppliersReviewBackingBean.managedBean.allStates}">
						<p:ajax event="change" 	listener="#{suppliersReviewBackingBean.selectAllStates}" 
						update="@(.ui-selectmanymenu[id$=stateListId])" process="@this" />
					</h:selectBooleanCheckbox> 
					<h:outputText value="#{lbl['lbl.pm.sr.all.states']}"></h:outputText>
				</td>
				
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.sr.state']}" for="stateListId"></p:outputLabel></th>

				<td>
				<p:selectManyMenu 						
						label="#{lbl['lbl.pm.sr.state']}" id="stateListId"
						value="#{suppliersReviewBackingBean.managedBean.suppliersReviewSearchBean.selectedStatesList}"
						style="width: 207px;margin-bottom: 5px;height:100px" showCheckbox="true" disabled="#{suppliersReviewBackingBean.managedBean.disabled}">
						
						<f:selectItems var="finState" 
							value="#{suppliersReviewBackingBean.managedBean.suppliersReviewSearchBean.statesList}"
							itemValue="#{finState.stateId}" itemLabel="#{finState.stateName}"> 
							</f:selectItems>
					</p:selectManyMenu></td>

				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
		</table>
	</p:panel>
	
	<script type="text/javascript">
	function selectAll() {
		$(document).ready(function() {
		        if($('.allStatesChkID').is(':checked')) { // check select status
		            $('.ui-chkbox-box').each(function() { //loop through each checkbox
		                this.checked = true;  //select all checkboxes with class "checkbox1"               
		            });
		        }else{
		            $('.ui-chkbox-box').each(function() { //loop through each checkbox
		                this.checked = false; //deselect all checkboxes with class "checkbox1"                       
		            });         
		        }
		    });
		    
		/* $(document).ready(function() {
				$(".ui-chkbox-box").click();
		}); */
	}
	</script>
</ui:composition>
