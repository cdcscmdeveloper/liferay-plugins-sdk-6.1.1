<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="votPanel" header="#{lbl['lbl.pm.vot.search.location']}" toggleable="true" >

		<table class="ppTwoTable">
			<tr>
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.vot.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{votBackingBean.managedBean.votSearchBean.votCode}"
						id="votCode" size="28" /></td>			
				
				<td width="16%"><p:outputLabel value="#{lbl['lbl.pm.vot.desc']}"></p:outputLabel></td>
				<td width="19%"><p:inputText
						value="#{votBackingBean.managedBean.votSearchBean.votName}"
						size="50" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
				
			</tr>			
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.pm.kumpulan.ptj.code']}"></p:outputLabel></td>
				<td width="35%"><p:inputText
						value="#{votBackingBean.managedBean.votSearchBean.kumpulanPtjCode}"
						id="ptjCode" size="28" /></td>			
				
				<td width="1%"><p:outputLabel value="#{lbl['lbl.pm.kumpulan.ptj.desc']}"></p:outputLabel></td>
				<td width="17%"><p:inputText
						value="#{votBackingBean.managedBean.votSearchBean.kumpulanPtjDesc}"
						size="50" /></td>			
				
			</tr>			
			<tr>
				<th width="20%"><h:outputLabel
						value="#{lbl['lbl.pm.vot.status']}"></h:outputLabel></th>
				<td><p:selectOneMenu style="width:205px"
						value="#{votBackingBean.managedBean.votSearchBean.status}">
						<f:selectItems value="#{votBackingBean.getStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td colspan="5" width="100%">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{votBackingBean.searchVot}"
							update=":form:votResult" />
                        &#160;
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{votBackingBean.resetVotSearchBean}"
							process="@this"
							update=":form:votPanel, :form:votResult" />
					</div>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
