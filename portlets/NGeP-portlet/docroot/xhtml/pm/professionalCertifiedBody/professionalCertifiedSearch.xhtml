<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="profPanel">

		<h:panelGrid columns="2">

			<h:outputLabel value="#{lbl['lbl.pm.search.profcert']}"></h:outputLabel>
		       <p:selectOneMenu style="width:205px;margin-bottom:5px;" value="#{profcertifiedbodyBackingBean.managedBean.certType}" >    
				  <f:selectItems value="#{profcertifiedbodyBackingBean.getBodyType()}" /> 
              </p:selectOneMenu> 
	
	        <h:outputLabel value="#{lbl['lbl.pm.search.codes']}"></h:outputLabel>
            <p:inputText value="#{profcertifiedbodyBackingBean.managedBean.bodyCode}" size="30"  />
			
			<h:outputLabel value="#{lbl['lbl.pm.search.name']}"></h:outputLabel>
			<p:inputText value="#{profcertifiedbodyBackingBean.managedBean.bodyName}" size="30" />
							
		    <h:outputLabel value="#{lbl['lbl.pm.search.status']}"></h:outputLabel>
		       <p:selectOneMenu style="width:205px;margin-bottom:5px;" value="#{profcertifiedbodyBackingBean.managedBean.status}" >    
				  <f:selectItems style="width:189px;" value="#{profcertifiedbodyBackingBean.getCertStatusList()}" />
              </p:selectOneMenu> 
	
		</h:panelGrid>
 </p:panel>
</ui:composition>
