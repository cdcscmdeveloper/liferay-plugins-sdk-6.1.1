<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="profPanel">

		<table style="width: 100%;">
			<tr>
				<td style="width: 14%;"><h:outputLabel
						value="#{lbl['lbl.pm.search.profcert']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu style="width:205px;margin-bottom:5px;"
						value="#{profcertifiedbodyBackingBean.managedBean.profCertifiedBodySearchBean.certType}">
						<f:selectItems
							value="#{profcertifiedbodyBackingBean.getBodyType()}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.search.codes']}"></h:outputLabel></td>
				<td><p:inputText
						value="#{profcertifiedbodyBackingBean.managedBean.profCertifiedBodySearchBean.bodyCode}"
						size="30" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.search.name']}"></h:outputLabel></td>
				<td><p:inputText
						value="#{profcertifiedbodyBackingBean.managedBean.profCertifiedBodySearchBean.bodyName}"
						size="30" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.pm.search.status']}"></h:outputLabel></td>
				<td><p:selectOneMenu style="width:205px;margin-bottom:5px;"
						value="#{profcertifiedbodyBackingBean.managedBean.profCertifiedBodySearchBean.status}"
						disabled="false">
						<f:selectItems style="width:189px;"
							value="#{profcertifiedbodyBackingBean.getCertStatusList()}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
