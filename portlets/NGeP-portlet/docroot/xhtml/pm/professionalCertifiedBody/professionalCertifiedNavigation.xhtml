<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table style="width: 100%">
		<tr>
			<td>
				<div align="left" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{profcertifiedbodyBackingBean.redirectProfSearch()}"
						style="float:left;" />
				</div>
			</td>
			<td>
				<div align="right" style="width: 100%">
					<!-- 34445 start -->
					<c:choose>
						<c:when test="#{profcertifiedbodyBackingBean.managedBean.certBody.brandNew}">
				  			<p:commandButton value="#{lbl['lbl.btn.save']}" style="float:right;" oncomplete="saveInfoDlg.show();"/>
				  		</c:when>
				  		<c:otherwise>
				  			<p:commandButton value="#{lbl['lbl.btn.update']}" style="float:right;" oncomplete="updateInfoDlg.show();"/>
				  		</c:otherwise>
				  	</c:choose>
					<!-- 34445 end -->
				</div>
			</td>
		</tr>
	</table>

	<!-- 34445 start -->
	<ac:confirmationPopupSM id="saveInfoDlg" widget="saveInfoDlg"
		okAction="profcertifiedbodyBackingBean.saveCertBodyDtls"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.save.msg']}"
		update="@([id$=Msg])"/>
								
	<ac:confirmationPopupSM id="updateInfoDlg" widget="updateInfoDlg"
		okAction="profcertifiedbodyBackingBean.saveCertBodyDtls"
		width="400" height="100"
		title="#{lbl['lbl.btn.dialog.cofirm.header']}"
		content="#{lbl['lbl.pm.btn.update.msg']}"
		update="@([id$=Msg])"/>
	<!-- 34445 end -->
</ui:composition>
