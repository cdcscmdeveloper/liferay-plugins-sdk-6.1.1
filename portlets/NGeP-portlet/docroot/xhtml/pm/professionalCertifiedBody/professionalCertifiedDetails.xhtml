<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
   <p:panel header="ASSOCIATION / CERTIFIED BODY" toggleable="true">
   <p:spacer height="10"></p:spacer>	
				
	<table style="width:100%;">
	  <tr>	  	
		<td style="width:10%;"><p:outputLabel value="#{lbl['lbl.pm.search.codes']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{profcertifiedbodyBackingBean.managedBean.certBody.bodyCode}" 
			  size="20" maxlength="12" />
		</td>
	  </tr>	
	  <tr>	
		<td><p:outputLabel value="#{lbl['lbl.pm.search.name']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText value="#{profcertifiedbodyBackingBean.managedBean.certBody.bodyName}" 
			size="40" maxlength="255" />
		</td>
	  </tr>
	  <tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.search.desc']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputTextarea row="40" cols="80" value="#{profcertifiedbodyBackingBean.managedBean.certBody.description}" 
			 maxlength="500" /></td>
	  </tr>  
	  <tr>
	    <td></td>
	  	<td style="padding: 5px 0px;"><p:selectBooleanCheckbox value="#{profcertifiedbodyBackingBean.managedBean.certBody.professionalBody}" /><h:outputText value="Professional Body" />&#160;&#160;&#160;
	  		<p:selectBooleanCheckbox value="#{profcertifiedbodyBackingBean.managedBean.certBody.certifiedBody}" /><h:outputText value="Certified Body" /></td>	  	
	  </tr>
	   <tr> 
		<td><p:outputLabel value="Status :" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;" value="#{profcertifiedbodyBackingBean.managedBean.certBody.recordStatusFlg}">   
			  <f:selectItems value="#{profcertifiedbodyBackingBean.getCertStatusList()}" /> 
    	    </p:selectOneMenu></td>				
	    </tr>
	</table>
   <p:spacer height="50"></p:spacer>	
   </p:panel>	
</ui:composition>
