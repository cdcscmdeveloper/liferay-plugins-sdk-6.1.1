<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
   <p:panel>
	<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
   </p:panel>
	
   <p:panel header="ASSOCIATION / CERTIFIED BODY" toggleable="true">
		
	<table>
	  <tr>	  	
		<td><p:outputLabel value="#{lbl['lbl.pm.search.codes']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText size="30" /></td>
	  </tr>	
	  <tr>	
		<td><p:outputLabel value="#{lbl['lbl.pm.search.name']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputText size="30" /></td>
	  </tr>
	  <tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.search.desc']}" />
			<p:outputLabel value="*" styleClass="mandatory" /></td>
		<td><p:inputTextarea row="40" cols="80" /></td>
	  </tr>
	  <tr>
	    <td></td>
	  	<td><p:selectBooleanCheckbox /><h:outputText value="Professional Body" />&#160;&#160;&#160;
	  		<p:selectBooleanCheckbox /><h:outputText value="Certified Body" /></td>	  	
	  </tr>
	   <tr> 
		<td><p:outputLabel value="Status :" /></td>
     	<td><p:selectOneMenu style="width:178px;margin-bottom:5px;">   
			  <f:selectItems value="#{profcertifiedbodyBackingBean.getStatusList()}" /> 
    	    </p:selectOneMenu></td>				
	    </tr>
	</table>
   </p:panel>	
</ui:composition>
