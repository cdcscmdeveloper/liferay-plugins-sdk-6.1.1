<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" id="professionalCertSearch" toggleable="true">
		
	<h:panelGrid style="width:100%;">
	</h:panelGrid>
	
	 <ui:include src="/xhtml/pm/professionalCertifiedBody/professionalCertifiedSearch.xhtml" />
			
      <div align="right">
			<p:commandButton value="#{lbl['lbl.btn.search']}" icon="ui-icon-search" 
				 update="searchProfCertResult" />
            <p:commandButton value="#{lbl['lbl.btn.reset']}" action="profcertifiedbodyBackingBean.resetSearch()" 
               type="reset" icon="ui-icon-reset" />
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="RESULT" id="professionalCertResult" toggleable="true">
	<p:dataTable id="searchProfCertResult" editable="true">
	<ac:paginator for="searchProfCertResult" />
       <p:column headerText="#{lbl['lbl.pm.pc.code']}"> 
        <h:outputText />       
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.pc.acname']}"> 
        <h:outputText />
       </p:column>       
     
       <p:column headerText="#{lbl['lbl.pm.pc.type']}"> 
                 
       </p:column >
        
    	<p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}">
   		 <p:commandLink >
     	<p:graphicImage library="ep/images/design" name="edit.png"
     	 value="/resources/ep/images/design/edit.png" />
    	 </p:commandLink>
   	 	</p:column>    
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="#{lbl['lbl.btn.create']}" action="#{profcertifiedbodyBackingBean.createProfCert(null)}" 
      	ajax="false" style="float:right;" icon="ui-icon-add" />
	
	 </h:panelGrid>	
	</p:panel>
</ui:composition>
