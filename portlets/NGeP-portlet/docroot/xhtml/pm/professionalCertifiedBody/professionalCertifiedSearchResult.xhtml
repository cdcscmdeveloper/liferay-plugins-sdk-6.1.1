<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="#{lbl['lbl.pm.search.search']}" id="professionalCertSearch" toggleable="true">
		
	<h:panelGrid style="width:100%;">
	</h:panelGrid>
	
	 <ui:include src="/xhtml/pm/professionalCertifiedBody/professionalCertifiedSearch.xhtml" />
			
      <div align="right">
			<p:commandButton value="#{lbl['lbl.btn.search']}" icon="ui-icon-search" 
				 update="searchProfCertResult" action="#{profcertifiedbodyBackingBean.searchProfessionalCertBody}" />
            <p:commandButton value="#{lbl['lbl.btn.reset']}" 
               type="reset" icon="ui-icon-reset" />
	  </div>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.pm.search.result']}" id="professionalCertResult" toggleable="true">
	<p:dataTable id="searchProfCertResult"  var="certBody" editable="true" value="#{profcertifiedbodyBackingBean.profCertBodyModel}" lazy="true">
	<ac:paginator for="searchProfCertResult" />
       <p:column headerText="#{lbl['lbl.pm.pc.code']}" style="width:10%"> 
        <h:outputText  value="#{certBody.bodyCode}"/>       
       </p:column>
       
       <p:column headerText="#{lbl['lbl.pm.pc.acname']}" style="width:50%"> 
        <h:outputText value="#{certBody.bodyName}" />
       </p:column>       
     
       <p:column headerText="#{lbl['lbl.pm.pc.type']}" style="width:35%"> 
        <h:outputText value="#{certBody.description}"></h:outputText>
       </p:column >
        
    	<p:column headerText="#{lbl['lbl.pm.profiles.search.result.action']}" style="width:5%">
   		 <p:commandLink action="#{profcertifiedbodyBackingBean.editCertDetials(certBody)}" style="margin-right:20px;" partialSubmit="true" process="@this">
     	<p:graphicImage library="ep/images/design" name="edit.png"
     	 value="/resources/ep/images/design/edit.png" />
    	 </p:commandLink>
   	 	</p:column>    
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="#{lbl['lbl.btn.create']}" action="#{profcertifiedbodyBackingBean.createProfCert}" 
      	ajax="false" style="float:right;" icon="ui-icon-add" />
	
	 </h:panelGrid>	
	</p:panel>
</ui:composition>
