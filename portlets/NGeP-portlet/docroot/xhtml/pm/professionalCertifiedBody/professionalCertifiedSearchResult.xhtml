<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:remove>
		<p:panel header="#{lbl['lbl.pm.search.search']}"
			id="professionalCertSearch" toggleable="true">
			<ui:include
				src="/xhtml/pm/professionalCertifiedBody/professionalCertifiedSearch.xhtml" />

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					update="searchProfCertResult"
					action="#{profcertifiedbodyBackingBean.searchProfessionalCertBody}" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{profcertifiedbodyBackingBean.reset}" process="@this"
					update="searchProfCertResult,:form:profPanel" />
			</div>
		</p:panel>
	</ui:remove>
	<p:panel header="#{lbl['lbl.pm.search.result']}"
		id="professionalCertResult" toggleable="true">
		<p:dataTable id="searchProfCertResult" var="certBody" editable="true"
			value="#{profcertifiedbodyBackingBean.profCertBodyModel}" rows="10"
			lazy="true">
			<ac:paginator for="searchProfCertResult" />
			<p:column headerText="#{lbl['lbl.pm.pc.code']}" style="width:10%">
				<h:outputText value="#{certBody.bodyCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.pc.acname']}" style="width:65%">
				<h:outputText value="#{certBody.bodyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.pm.status']}" style="width:20%">  
	            #{(certBody.recordStatusFlg==1)? lbl['lbl.pm.active'] : lbl['lbl.pm.inactive']}
	         </p:column>

			<p:column headerText="#{lbl['lbl.pm.action']}" style="width:5%;text-align:center;">
				<p:commandLink
					action="#{profcertifiedbodyBackingBean.editCertDetials(certBody)}"
					style="margin-right:20px;" partialSubmit="true" process="@this">
					<p:graphicImage title="#{lbl['lbl.pm.pc.edit']}"
						value="/css/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>

	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.create']}"
			action="#{profcertifiedbodyBackingBean.createProfCert}" ajax="false" />
	</div>

</ui:composition>
