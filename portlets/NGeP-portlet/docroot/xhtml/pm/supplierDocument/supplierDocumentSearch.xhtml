<ui:composition
xmlns="http://www.w3.org/1999/xhtml"
xmlns:f="http://java.sun.com/jsf/core"
xmlns:h="http://java.sun.com/jsf/html"
xmlns:ui="http://java.sun.com/jsf/facelets"
xmlns:p="http://primefaces.org/ui"
xmlns:c="http://java.sun.com/jsp/jstl/core"
xmlns:ac="http://ac.my/jsf/composite/cc"
>
	<p:panel id="pSupportDocSearch" header="#{lbl['lbl.pm.search.support.doc']}" toggleable="true">
		
		<table class="ppTwoTable">
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.document.name']}"/>
				</th>
				<td>
					<p:inputTextarea id="itaDocName" value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docName}"
							label="#{lbl['lbl.pm.document.name']}" autoResize="false"
					 		cols="31" rows="4" maxlength="350" />
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.zone']}"/>
						<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<p:selectOneMenu id="somSuppZone" styleClass="ppDropDownWidthM" label="#{lbl['lbl.pm.supplier.zone']}" required="true"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.pmZone}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" /> 
						<f:selectItems  value="#{supportDocBackingBean.supplierZoneOptions()}"  
							var="zone" itemValue="#{zone.zoneId}" itemLabel="#{zone.zoneName}" />
					</p:selectOneMenu>
				</td>
				<th>
					
				</th>
				<td>
					
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.supplier.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somSuppType" styleClass="ppDropDownWidthM"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.suppTypeParam}">
						<f:selectItems  value="#{supportDocBackingBean.supplierTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.application.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somAppType" styleClass="ppDropDownWidthM" 
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.appTypeParam}">
						<f:selectItems  value="#{supportDocBackingBean.applicationTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.company.type']}"/>
				</th>
				<td>
					<p:selectOneMenu id="somComType" styleClass="ppDropDownWidthM"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.comTypeParam}">
						<f:selectItems  value="#{supportDocBackingBean.companyTypeOptions()}"/>
					</p:selectOneMenu>
				</td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.business.category']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="255" label="#{lbl['lbl.pm.business.category']}"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.businessCategory}" />
				</td>
			</tr>
			<tr>
				<th width="20%"><p:outputLabel
						value="#{lbl['lbl.pm.suppdoc.status']}" /></th>
				<td><p:selectOneMenu styleClass="ppDropDownWidthM"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.docStatus}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{supportDocBackingBean.getActiveAndInactiveStatusOptions()}" />
					</p:selectOneMenu></td>
				<th>
					<p:outputLabel value="#{lbl['lbl.pm.suppdoc.certified.body']}"/>
				</th>
				<td>
					<p:inputText styleClass="ppDisplayTextM" maxlength="255" label="#{lbl['lbl.pm.suppdoc.certified.body']}"
						value="#{supportDocBackingBean.managedBean.supportDocSearchBean.certBodyName}" />
				</td>
			</tr>
			<tr>
				<td colspan="4">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}" 
							process="pSupportDocSearch"
							update="dtSupportDocResult" 
							action="#{supportDocBackingBean.searchDocumentForSup}"
							/>
						<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{supportDocBackingBean.resetSupportDocSearchBean}"
							update="pSupportDocSearch, dtSupportDocResult" 
							/> 
					</div>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
