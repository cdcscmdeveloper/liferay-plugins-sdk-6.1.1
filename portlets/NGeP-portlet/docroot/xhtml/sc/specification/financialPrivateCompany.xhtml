<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="FinancialPrivateCompany" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"></p:messages>

		<div>
			<p:commandButton value="Back" style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				actionListener="#{specificationBackingBean.acceptFinancePrivateCompanyPrivateScoring}" />



		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.stage.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{specificationBackingBean.managedBean.scQtChecklist.title}"
							disabled="true" rows="2" cols="150"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.spec.company.exp.fed.private']}"
			toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.company.exp.since.year']} "></p:outputLabel>
						<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><p:inputText maxlength="4"
							label="#{lbl['lbl.sc.spec.company.exp.since.year']}"
							required="true" id="finPrivateYears"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue.year}">
							<ac:validateNumber integerOnly="true" maxIntegerDigits="4"></ac:validateNumber>
							</p:inputText>
						<p:message id="finPrivateCmpnyYrs" for="finPrivateYears"
							display="icon"></p:message></td>
				</tr>
			</table>

			<p:dataTable id="experience" rowIndexVar="index" var="experience"
				rowKey="#{experience}">
				<ac:paginator for="experience"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.effective.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.exp.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.ramarks']}">
					<p:inputText></p:inputText>
				</p:column>
			</p:dataTable>


			<h:panelGrid columns="3">


				<h:outputText value="#{lbl['lbl.sc.spec.total.no.contracts']}" />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"></p:inputText>


				<h:outputText value="#{lbl['lbl.sc.spec.total.no.years']}" />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"></p:inputText>

				<h:outputText value="#{lbl['lbl.sc.spec.total.contract.amount']}" />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"></p:inputText>


			</h:panelGrid>

		</p:panel>






		<p:panel>
			<h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel>
				<p:selectOneMenu
					value="#{specificationBackingBean.managedBean.checklistScoreType}">
					<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
					<p:ajax event="change" update="finPrivateCompany"
						listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
				</p:selectOneMenu>
			</h:panelGrid>
		</p:panel>
		<h:panelGroup id="finPrivateCompany">
			<p:panel
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">


				<ui:param name="finContractGroupId" value="fincontractorGroupId" />
				<h:panelGroup id="contractAmountGroupId">
					<ui:param name="scoringList"
						value="#{specificationBackingBean.managedBean.nonFederalContractScore}" />
					<ui:param name="selectionList"
						value="#{specificationBackingBean.managedBean.finPrivateContractSelectList}" />
					<ui:param name="componentName" value="finContractAmount" />
					<ui:param name="scoringPnlId" value="fincontractAmountId" />
					<ui:param name="scoringPnlName"
						value="#{lbl['lbl.sc.spec.score.total.contract.amount']}"></ui:param>
					<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
							process="@this,#{scoringPnlId}" partialSubmit="true"
							oncomplete="scoreWidget.paginator.endLink.click();"
							actionListener="#{specificationBackingBean.addPrivateContratAmount}"
							update="#{scoringPnlId}" icon="ui-icon-add" />
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
							icon="ui-icon-delete"
							action="#{specificationBackingBean.deleteScoring}"
							update="#{scoringPnlId}" />

					</div>
				</h:panelGroup>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.spec.score.total.contract.amount']}"
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel></td>
						<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
						<td><p:inputText id="finprivateScore" required="true"
								label="#{lbl['lbl.sc.spec.max.score']}" maxlength="18"
								value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
								<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
							</p:inputText> <p:message id="finPrivateMaxScore" for="finprivateScore"
								display="icon"></p:message></td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>

	</ui:define>
</ui:composition>
