<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.financial.scoring']}"
		toggleable="true">
		<h:panelGrid columns="4">

		
			<h:outputText value="#{lbl['lbl.sc.spec.tech.weightage']}" />
			<p:spacer width="10"></p:spacer>
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.financialWeightage}">
				<f:selectItem itemLabel="Yes" itemValue="1" />
				<f:selectItem itemLabel="No" itemValue="2" />
				<p:ajax event="change" update="financialweightage"></p:ajax>
			</p:selectOneRadio>
		</h:panelGrid>

		<p:dataTable id="financialweightage" var="finance" rowKey="#{finance}"
			value="#{specificationBackingBean.managedBean.financialScoring}"
			style="width:100%" rowIndexVar="index">
			<ac:paginator for="financialweightage" />
			<!-- 	<p:column selectionMode="multiple" style="text-align:center;" /> -->

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:50%;">
				<h:outputText value="#{finance.title}" size="50" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.score']}"
				style="width:20%;">
				<ui:fragment rendered="#{finance.maxScore!='null'}">
					<h:outputText value="#{finance.maxScore}" />
				</ui:fragment>
				<ui:fragment rendered="#{finance.maxScore=='null'}">
					<p:inputText value="#{tech.maxScore}" />
				</ui:fragment>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.weight.weight']}"
				style="width:20%;">
				<p:inputText value="#{finance.weightage}"
					rendered="#{specificationBackingBean.managedBean.financialWeightage eq '1'}">
					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.finWeightageSum}"
						update=":form:businessSpecId:finaddpoints,:form:businessSpecId:offeredPrice" />
				</p:inputText>
			</p:column>

		</p:dataTable>

		<p:spacer height="15"></p:spacer>


	</p:panel>





	<p:panel>
		<h:panelGroup id="finaddpoints">
			<h:panelGrid columns="3">


				<h:outputText value="#{lbl['lbl.sc.spec.net.total.points']} " />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"
					value="#{specificationBackingBean.managedBean.finPoints}"></p:inputText>

				<h:outputText value="#{lbl['lbl.sc.spec.total.weightage']}" />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"
					value="#{specificationBackingBean.managedBean.financialWeightageScore}"></p:inputText>

			</h:panelGrid>
		</h:panelGroup>
	</p:panel>

<h:panelGroup id="offeredPrice">
	<p:panel header="Scoring For Offered Price">
		<p:panelGrid style="margin-top:5px;width:70%;">
			<f:facet name="header">

				<p:row>
					<p:column colspan="1">Offered Price</p:column>
					<p:column colspan="1">From Variance(%)</p:column>
					<p:column colspan="1">To Variance(%)</p:column>
					<p:column>Below Variance(Score)</p:column>
					<p:column>Within Variance(Score)</p:column>
					<p:column>Above Variance(Score)</p:column>
				</p:row>
			</f:facet>
			<p:row>
				<p:column style="font-weight: bold;">By package</p:column>
				<p:column style="font-weight: bold;">
					<p:inputText value="#{specificationBackingBean.managedBean.packageScoreSetting.fromVariance}"/>
				</p:column>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText value="#{specificationBackingBean.managedBean.packageScoreSetting.toVariance}"/>
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText  value="#{specificationBackingBean.managedBean.packageScoreSetting.belowScore}"/>
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<h:outputText value="#{specificationBackingBean.managedBean.scoreVarience}"/>
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText  value="#{specificationBackingBean.managedBean.packageScoreSetting.aboveScore}"/>
				</p:column>
			</p:row>
			<p:row>
				<p:column style="font-weight: bold;">By Item</p:column>
				<p:column style="font-weight: bold;">
					<p:inputText  value="#{specificationBackingBean.managedBean.itemScoreSetting.fromVariance}"/>
				</p:column>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText value="#{specificationBackingBean.managedBean.itemScoreSetting.toVariance}"/>
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText value="#{specificationBackingBean.managedBean.itemScoreSetting.belowScore}"/>
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<h:outputText value="#{specificationBackingBean.managedBean.scoreVarience}"/>
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText  value="#{specificationBackingBean.managedBean.itemScoreSetting.aboveScore}"/>
				</p:column>
			</p:row>

		</p:panelGrid>


	</p:panel>
	</h:panelGroup>
	
	
	<p:panel header="Passing Score">

		<h:panelGrid columns="4">
			<h:outputText value="Financial(%)" />
			<p:spacer width="10"></p:spacer>
			<p:inputText></p:inputText>
			<h:outputText value="/100 " />

		</h:panelGrid>

	</p:panel>
