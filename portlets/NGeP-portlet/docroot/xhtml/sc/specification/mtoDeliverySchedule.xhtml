<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<p:messages id="templateMaintenancemessages" showDetail="true"
		autoUpdate="true" closable="true" />
	<ui:define name="contentSection">
	
		<div>
		<p:commandButton value="Back"  style="float:left;"
				action="#{specificationBackingBean.backAction}"  />
				

		</div>
		<p:spacer height="25"></p:spacer>
	<!-- 	<ui:include src="/xhtml/sc/main/templateMaintenanceheader.xhtml"></ui:include> -->
		<p:panel header="Shipping Details" toggleable="true" style="width:1000px;">


	<table>
			<tr>
				<td><h:outputLabel value="Payment Term"></h:outputLabel>
				</td>
				<td><p:inputText size="50" readonly="true" disabled="true"/></td>
				<td><h:outputLabel value="Required Export License"></h:outputLabel>
				</td>
				<td><p:inputText size="50" readonly="true" disabled="true"/></td>
			</tr>
           <tr>
           <td ><h:outputLabel value="Country Of Origion" /></td>
					<td><p:inputText
							
							disabled="true" size="30" /></td>
           <td ><h:outputLabel value="Loading Port" /></td>
					<td><p:inputText disabled="true"
							size="30" /></td>
					
           </tr>
			<tr>

				<td><h:outputLabel value="Country Of Destination" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
				<td><h:outputLabel value="Discharge Port" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>
			<tr>

				<td><h:outputLabel value="Final Destination" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>

<tr>

				<td><h:outputLabel value="TransportMode" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>
			</table>



		</p:panel>


	<p:panel header="#{lbl['lbl.sc.item.details']}">
	<p:dataTable id="mtoDelivery" var="cateGory"
			  style="width:100%"
			rowIndexVar="index" 
			>
			<ac:paginator for="mtoDelivery" />
		
		
			<p:column headerText="Item"
				style="width:20%">
          
			</p:column>

			<p:column headerText="Packing Type"
				style="width:15%">
				<h:outputText id="main" value="Specification"></h:outputText>
			</p:column>
			<p:column headerText="Cargo Type"
				style="width:10%">
                <p:inputText></p:inputText>
			</p:column>

			<p:column headerText="Total Volume Quantity"
				style="width:13%">
				<h:outputText value="InProgress"></h:outputText>
			</p:column>

			<p:column headerText="Weight per Unit"
				style="width:10%">
              <p:inputText></p:inputText>
			</p:column>
			<p:column headerText="Weight Uom"
				style="width:10%">
				
			</p:column>
          <p:column headerText="Total Weight Quantity"
				style="width:10%">
				
			</p:column>
			
			 <p:column headerText="Total Dimension(m3)"
				style="width:10%">
				
			</p:column>
			 <p:column headerText="Action"
				style="width:2%">
				
			</p:column>
		</p:dataTable>
	</p:panel>



	</ui:define>


</ui:composition>
