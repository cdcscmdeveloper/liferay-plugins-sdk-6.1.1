<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sc.spec.finance.check.list']}"
		toggleable="true">

		<p:dataTable id="financeProposaltwo" var="stageTwofunctional"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2financeProposalList}"
			editable="true" style="width:100%" rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.s2FinSelect}"
			rowKey="#{stageTwofunctional}">
			<ac:paginator for="financeProposaltwo" />
			<p:column selectionMode="multiple" style="text-align:center;"
				disabledSelection="#{stageTwofunctional.enable ==true}" />
			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:30%">
				<!-- <ui:fragment rendered="#{stageTwofunctional.title !=null}">
						<h:outputText value="#{stageTwofunctional.title}" size="50"  />
					</ui:fragment>
					<ui:fragment rendered="#{stageTwofunctional.title ==null}">
						<p:inputText value="#{stageTwofunctional.title}" size="50"></p:inputText>
					</ui:fragment> -->
				<ui:fragment
					rendered="#{fn:contains(stageTwofunctional.title,'Company')}">
					<p:commandLink oncomplete="company.show();">
						<h:outputText value="#{stageTwofunctional.title}" size="50" />
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{fn:contains(stageTwofunctional.title,'Bank')}">
					<p:commandLink oncomplete="bankStatement.show();">
						<h:outputText value="#{stageTwofunctional.title}" size="50"></h:outputText>
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{fn:contains(stageTwofunctional.title,'Kemudahan')}">
					<p:commandLink oncomplete="creditFacility.show();">
						<h:outputText value="#{stageTwofunctional.title}" size="50"></h:outputText>
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{fn:contains(stageTwofunctional.title,'Tunai')}">
					<p:commandLink oncomplete="cash.show();">
						<h:outputText value="#{stageTwofunctional.title}" size="50"></h:outputText>
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{fn:contains(stageTwofunctional.title,'Asset')}">
					<p:commandLink oncomplete="asset.show();">
						<h:outputText value="#{stageTwofunctional.title}" size="50"></h:outputText>
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{fn:contains(stageTwofunctional.title,'Maklumat')}">
					<p:commandLink oncomplete="supplierInfo.show();">
						<h:outputText value="#{stageTwofunctional.title}" size="50"></h:outputText>
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{!fn:contains(stageTwofunctional.title,'Company') and !fn:contains(stageTwofunctional.title,'Bank') and !fn:contains(stageTwofunctional.title,'Maklumat') and !fn:contains(stageTwofunctional.title,'Asset') and !fn:contains(stageTwofunctional.title,'Tunai') and !fn:contains(stageTwofunctional.title,'Kemudahan')}">
					<h:outputText value="#{stageTwofunctional.title}" size="50"></h:outputText>
				</ui:fragment>
				<ui:fragment rendered="#{stageTwofunctional.title == null}">
					<p:inputText value="#{stageTwofunctional.title}" size="50"></p:inputText>
				</ui:fragment>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}"
				style="width:20%">
				<ui:fragment rendered="#{stageTwofunctional.checklistType eq 'SP'}">
					<h:outputText value="Specification"></h:outputText>
				</ui:fragment>
				<ui:fragment rendered="#{stageTwofunctional.checklistType eq 'SD'}">
					<h:outputText value="System Defined"></h:outputText>
				</ui:fragment>
				<ui:fragment rendered="#{stageTwofunctional.checklistType eq 'UP'}">
					<h:outputText value="Upload"></h:outputText>
				</ui:fragment>
				<ui:fragment rendered="#{stageTwofunctional.checklistType eq 'WF'}">
					<h:outputText value="Web Form"></h:outputText>
				</ui:fragment>
				<ui:fragment rendered="#{stageTwofunctional.checklistType eq 'TS'}">
					<h:outputText value="Template Spec"></h:outputText>
				</ui:fragment>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.supplier.action']}"
				style="width:10%">
				<p:selectOneMenu value="#{stageTwofunctional.manditory}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItem itemLabel="Yes" itemValue="1" />
					<f:selectItem itemLabel="No" itemValue="0" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.specification.status']}"
				style="width:10%">
				<h:outputText value="InProgress"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}"
				style="width:30%">
				<ui:include src="/xhtml/sc/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS1Fin.show();return false;"
					update="financeProposaltwo">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageTwofunctional}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageTwofunctional.scQtCheckListAttachment.fileName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
				style="width:10%">
				<p:commandLink>

					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>

			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton
				value="#{lbl['lbl.sc.spec.btn.standard.check.list']}"
				process="@this" partialSubmit="true"
				oncomplete="stageTwoFinance.show();"
				actionListener="#{specificationBackingBean.stageTwoFincompilenceList}"
				update="stageTwoFinPopup" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this,financeProposaltwo" partialSubmit="true"
				action="#{specificationBackingBean.stageTwoFiProposalAdd}"
				update="financeProposaltwo" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete"
				action="#{specificationBackingBean.deleteS2Fin}"
				update="financeProposaltwo" />
             
            


		</div>

	</p:panel>
</ui:composition>
