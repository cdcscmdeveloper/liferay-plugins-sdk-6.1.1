<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sc.spec.finance.check.list']}"
		toggleable="true">

		<p:dataTable id="financeProposaltwo" var="stageTwofunctional"
			widgetVar="financialChecklist"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2financeProposalList}"
			 rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.s2FinSelect}"
			rowKey="#{stageTwofunctional}">
			<ac:paginator for="financeProposaltwo" />
			<p:column selectionMode="multiple" style="text-align:left;"
				rendered="#{stageTwofunctional.manditory !=true}" />

			<p:column style="text-align:left;"
				rendered="#{stageTwofunctional.manditory ==true}" />
			<p:column style="width:30%;white-space: normal;">

				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.stage.title']}" />
				</f:facet>
				<ui:fragment rendered="#{stageTwofunctional.title !=null}">
					<h:outputText value="#{stageTwofunctional.title}" size="50" />
				</ui:fragment>
				<ui:fragment rendered="#{stageTwofunctional.title ==null}">
					<p:inputText value="#{stageTwofunctional.title}" size="50"
						maxlength="100" required="true" id="finChecklistTitle"
						label="#{lbl['lbl.sc.spec.stage.title']}"></p:inputText>
					<p:message id="finChecklistId" for="finChecklistTitle"
						display="icon"></p:message>
				</ui:fragment>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}"
				style="width:20%">


				<h:outputText value="Specification"
					rendered="#{stageTwofunctional.definationType.parameterId=='185'}"></h:outputText>


				<h:outputText value="System Defined"
					rendered="#{stageTwofunctionall.definationType.parameterId=='187'}"></h:outputText>


				<h:outputText value="Upload"
					rendered="#{stageTwofunctional.definationType.parameterId=='184'}"></h:outputText>


				<h:outputText value="Web Form"
					rendered="#{stageTwofunctional.definationType.parameterId=='188'}"></h:outputText>



			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.supplier.action']}"
				style="width:10%">

				<ui:fragment
					rendered="#{index eq specificationBackingBean.managedBean.scQtCheckSt2financeProposalList.size()-1 and stageTwofunctional.title ==null}">
					<p:selectOneMenu value="#{stageTwofunctional.action.parameterId}">
						<f:selectItem itemLabel="--Select One--" itemValue="#{null}" />
						<f:selectItem itemLabel="View" itemValue="688" />
						<f:selectItem itemLabel="Online Submission" itemValue="690" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="financeProposaltwo"></p:ajax>
					</p:selectOneMenu>
				</ui:fragment>
				<h:outputText value="Online Submission"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2financeProposalList.size()-1 and stageTwofunctional.action.parameterId eq '690'}" />

				<h:outputText value="View"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2financeProposalList.size()-1 and stageTwofunctional.action.parameterId eq '688'}" />


				<!-- <h:outputText value="Online Submit"
						rendered="#{stageTwofunctional.action.parameterId eq '9'}"></h:outputText>
					<h:outputText value="View"
						rendered="#{stageTwofunctional.action.parameterId eq '8'}"></h:outputText> -->

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.head']}"
				style="width:10%">
				<p:selectBooleanCheckbox value="#{stageTwofunctional.scoringReq}"
					disabled="true"
					rendered="#{stageTwofunctional.action.parameterId ne '690' }">

				</p:selectBooleanCheckbox>
				<p:selectBooleanCheckbox value="#{stageTwofunctional.scoringReq}"
					rendered="#{stageTwofunctional.action.parameterId eq '690'}">

				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.specification.status']}"
				style="width:10%">
				<h:outputText value="InProgress"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}"
				style="width:30%">
				<ui:include src="/xhtml/sc/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS1Fin.show();return false;"
					update="financeProposaltwo"
					rendered="#{stageTwofunctional.definationType.parameterId=='184'}">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageTwofunctional}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageTwofunctional.scQtCheckListAttachment.fileName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
				style="width:10%">
				<p:commandLink
					action="#{specificationBackingBean.financialChecklistEditAction(index,stageTwofunctional)}"
					rendered="#{stageTwofunctional.definationType.parameterId=='188' or stageTwofunctionall.definationType.parameterId=='187' or stageTwofunctional.definationType.parameterId=='185'}">

					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
					<f:setPropertyActionListener value="#{stageTwofunctional}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>

			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton
				value="#{lbl['lbl.sc.spec.btn.standard.check.list']}"
				process="@this" partialSubmit="true"
				oncomplete="stageTwoFinance.show();"
				actionListener="#{specificationBackingBean.stageTwoFincompilenceList}"
				update="stageTwoFinPopup" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this,financeProposaltwo" partialSubmit="true"
				oncomplete="financialChecklist.paginator.endLink.click();"
				action="#{specificationBackingBean.stageTwoFiProposalAdd}"
				update="@all,financeProposaltwo" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete"
				action="#{specificationBackingBean.deleteS2Fin}"
				update="financeProposaltwo" />




		</div>
		<ui:include src="stageTwoFinancial.xhtml" />
	</p:panel>
</ui:composition>
