<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!--  Supplier Details dialog -->
	<p:dialog id="popupSuppDtl" widgetVar="suppDetails" resizable="false"
		position="top" styleClass="pop_up_top"
		header="#{lbl['lbl.ct.menu.sup']}" width="500" height="800">
		<table style="width: 100%" >
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.ep.no']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.epNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.suppliername']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.companyName}"
						readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.reg.type']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.reg.no']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.regNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.mofno']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.smMofAccounts[0].mofNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.tax.no']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.est.date']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.establishDate}"
						size="30" readonly="true" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.type.company']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.businessType}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.mofexp']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{specificationBackingBean.managedBean.ctpanelSupplier.supplier.smMofAccounts[0].expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.displinary.rating']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.branch']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{specificationBackingBean.managedBean.supplierBranch}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.address']}" /></td>
				<td><p:inputTextarea rows="3" cols="32" readonly="true"
						value="#{specificationBackingBean.managedBean.supplierAddress.address1}"
						disabled="true" style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.contact.person']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.supplierContact}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.designation']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.personnel.designation}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.email']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.supplierEmail}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
		</table>

		<p:spacer height="5" />
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.eva.btn.close']}"
						icon="ui-icon-back" onclick="suppDetails.hide();" />
				</p:column>
			</p:row>
		</p:panelGrid>


	</p:dialog>

</ui:composition>
