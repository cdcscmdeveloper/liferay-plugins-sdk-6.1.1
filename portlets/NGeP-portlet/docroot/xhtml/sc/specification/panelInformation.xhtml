<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularno']}" />
			</h:column>
			<h:column>
				<p:inputText size="50"
					value="#{specificationBackingBean.managedBean.cirCularNo}"
					disabled="true" />
				<p:spacer width="5" />

				<p:commandLink value="#{lbl['lbl.so.cirattach']}"
					disabled="#{specificationBackingBean.managedBean.readOnly}"
					style="margin-right:20px;" ajax="false" process="@this"
					partialSubmit="true"
					actionListener="#{specificationBackingBean.downloadCircularDtls}">

				</p:commandLink>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularname']}" />
			</h:column>

			<h:column>
				<p:inputText size="100"
					value="#{specificationBackingBean.managedBean.circularName}"
					disabled="true" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularexp']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{specificationBackingBean.managedBean.circularExpDate}"
					readonly="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</h:column>


		</h:panelGrid>
	</p:panel>


	<p:panel header="#{lbl['lbl.sc.spec.circular.item.details']}"
		toggleable="true">


		<p:dataTable id="panelDataItemList" var="panelItem"
			rowIndexVar="index" 
			value="#{specificationBackingBean.managedBean.selectpanelItem}"
			rowKey="#{panelItem}">

			<ac:paginator for="panelDataItemList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
				style="width:20%">
				<h:outputText value="#{panelItem.itemName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
				style="width:15%">
				<h:outputText value="#{panelItem.specification}" />

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
				style="width:10%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
				style="width:5%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.uom']}"
				style="width:15%">
				<h:outputText value="#{panelItem.pmUom.uomId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
				style="width:15%">
				<h:outputText value="#{panelItem.minimumOrderQty}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
				style="width:20%">

			</p:column>


		</p:dataTable>

					<p:commandButton value="Senari"
				oncomplete="technicalEmployeeList.show();"/>

		</div> -->
		<ui:include src="/xhtml/sc/specification/panelItem.xhtml"></ui:include>
	</p:panel>
</ui:composition>
