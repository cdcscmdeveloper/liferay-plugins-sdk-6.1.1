<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="panelinfoid" header="Panel Information" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularno']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.ctCircular.latestCircularVer.circularNo}"
					disabled="true" />
				<p:spacer width="5" />
				<p:commandLink style="margin-right:20px;">
					<h:outputText value="#{lbl['lbl.so.cirattach']}" />
				</p:commandLink>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularname']}" />
			</h:column>

			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.ctCircular.latestCircularVer.name}"
					disabled="true" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularexp']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.ctCircular.latestCircularVer.endDate}"
					disabled="true" />
			</h:column>
		</h:panelGrid>
	</p:panel>
</ui:composition>
