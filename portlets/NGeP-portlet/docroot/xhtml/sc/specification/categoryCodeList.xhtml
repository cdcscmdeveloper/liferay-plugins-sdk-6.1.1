<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
       <p:commandLink value="CategoryCodeList"></p:commandLink>
		<p:dataTable id="#{criteriaPnlId}" var="cateGory"
			value="#{criteriaList}" editable="true" style="width:100%"
			rowIndexVar="index" rowKey="#{cateGory}"
			selection="#{criteriaselectList}">
			<ac:paginator for="#{qtCategory}" />
			<p:column selectionMode="multiple"></p:column>
			<p:column></p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText value="Specification"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="InProgress"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.mandatory']}"
				style="width:10%">
			</p:column>
          
			
		</p:dataTable>
		</p:panel>
</ui:composition>
