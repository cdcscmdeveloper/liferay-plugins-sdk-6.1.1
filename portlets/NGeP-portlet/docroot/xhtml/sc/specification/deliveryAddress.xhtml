<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>


		<ui:fragment
			rendered="#{specificationBackingBean.managedBean.scQt.zonal ne 'false'}">
			<p:accordionPanel id="panelNoaccordpnllist" dynamic="true"
				value="#{specificationBackingBean.managedBean.deliveryLocBean}"
				var="zonePnlList">



				<c:if
					test="#{specificationBackingBean.managedBean.scQt.panel ne 'false'}">
					<ui:param name="zoneName"
						value="#{zonePnlList.tplSpecZoneDtl.panelZone.name}"></ui:param>
				</c:if>
				<c:if
					test="#{specificationBackingBean.managedBean.scQt.panel eq 'false'}">
					<ui:param name="zoneName"
						value="#{zonePnlList.tplSpecZoneDtl.zoneName}"></ui:param>
				</c:if>

				<p:tab title="#{zoneName}">
					<ui:param name="deliveryList"
						value="#{zonePnlList.deliveryLocList}"></ui:param>
					<ui:param name="selectDeliveryList"
						value="#{specificationBackingBean.managedBean.selectDeliveryList}"></ui:param>
					<!-- 	<ui:param name="pjtDelivered" value="#{zonePnlList.zoneName}"></ui:param> -->
					<ui:include src="deliveryAddressinclude.xhtml"></ui:include>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
							process="@this" partialSubmit="true" icon="ui-icon-add"
							update=":form:searDelivery"
							actionListener="#{specificationBackingBean.deliveryList(zonePnlList.tplSpecZoneDtl)}"
							onclick="deliveryAddress.show();" />
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
							icon="ui-icon-delete" process="@this,pjtDelivered"
							partialSubmit="true" update="@form"
							actionListener="#{specificationBackingBean.deleteDeliveryZone(zoneName)}" />

					</div>
				</p:tab>
			</p:accordionPanel>
		</ui:fragment>

		<ui:fragment
			rendered="#{specificationBackingBean.managedBean.scQt.zonal eq 'false'}">
			<ui:param name="deliveryList"
				value="#{specificationBackingBean.managedBean.deliveryNonZoneList}"></ui:param>
			<ui:param name="selectDeliveryList"
				value="#{specificationBackingBean.managedBean.selectDeliveryList}"></ui:param>
			<ui:include src="deliveryAddressinclude.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this" partialSubmit="true" icon="ui-icon-add"
					update=":form:searDelivery" oncomplete="deliveryAddress.show();" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					update="@form" process="@this,pjtDelivered"
					partialSubmit="true" icon="ui-icon-delete"
					actionListener="#{specificationBackingBean.deleteDeliveryDtls}" />
			</div>
		</ui:fragment>




		<ui:include src="searchDeliveryAddress.xhtml"></ui:include>
	</p:panel>

</ui:composition>
