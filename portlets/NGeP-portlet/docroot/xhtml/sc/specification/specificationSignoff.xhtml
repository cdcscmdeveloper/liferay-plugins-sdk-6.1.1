<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.committee.endorse']}"
		toggleable="true">

		<p:dataTable id="scEndorsement" var="committeActivity"
			widgetVar="prepareCommittee"
			value="#{specificationBackingBean.managedBean.committeeActivities}">
			<ac:paginator for="scEndorsement" />

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.designation']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.email']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.grade']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.pp']}">
				<h:outputText
					value="#{lbl[committeActivity.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory"></h:outputText>
					<h:outputText value="#{lbl['lbl.sc.eva.committee.role']}"></h:outputText>
				</f:facet>

				<h:outputText value="#{committeActivity.scCommitteeMember.grade}" />


			</p:column>

			<p:column headerText="Action">


				<h:outputText
					value="#{lbl[committeActivity.signedOff ? 'lbl.btn.complete' : 'lbl.sc.pending' ]}" />


			</p:column>

		</p:dataTable>
		<p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.committee.btn.reminder']}"
				onclick="reminder.show();" icon="ui-icon-mail" />

		</div>
		<ui:include src="reminderpopup.xhtml" />
	</p:panel>
</ui:composition>
