<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.committee.endorsement.specification']}"
		toggleable="true">

		<p:dataTable id="#{specificationEndorsedSignOffId}"
			var="committeActivity" rows="10" rowIndexVar="index"
			widgetVar="prepareCommittee" value="#{committeeActivityList}">
			<ac:paginator for="#{specificationEndorsedSignOffId}" />

			<p:column style="width:30%;white-space: normal;"
				headerText="#{lbl['lbl.sc.name']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column style="width:5%;white-space: normal;"
				headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[committeActivity.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.role']}"
				style="width:10%;white-space: normal;">


				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(committeActivity.scCommitteeMember.memberRole)}" />


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;white-space: normal;">


				<h:outputText
					value="#{lbl[committeActivity.signedOff ? 'lbl.btn.complete' : 'lbl.sc.pending' ]}" />


			</p:column>

		</p:dataTable>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{specificationBackingBean.managedBean.specificationRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{specificationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										maxlength="1000"
										readonly="#{specificationBackingBean.managedBean.currentStatusId ne '60401'}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
