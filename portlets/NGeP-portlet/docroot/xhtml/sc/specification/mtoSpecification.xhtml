<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<p:messages id="templateMaintenancemessages" showDetail="true"
		autoUpdate="true" closable="true" />
	<ui:define name="contentSection">
	
		<div>
		<p:commandButton value="#{lbl['lbl.btn.back']}"  style="float:left;"
				action="#{specificationBackingBean.backAction}"  />
				<p:commandButton value="#{lbl['lbl.btn.complete']}" style="float:right;"
				action="#{specificationBackingBean.saveCompleteTemplateSpec}"  />
				<p:commandButton value="#{lbl['lbl.btn.save']}"
				style="float:right;" action="#{specificationBackingBean.saveTemplateSpec}" />
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" style="float:right;"></p:commandButton>
				

		</div>
		<p:spacer height="25"></p:spacer>
	<!-- 	<ui:include src="/xhtml/sc/main/templateMaintenanceheader.xhtml"></ui:include> -->
		<p:panel header="#{lbl['lbl.sc.spec.mto.specification']}" toggleable="true" style="width:1000px;">


	<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel>
				</td>
				<td><p:inputText size="50" value="#{specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.specName}"/></td>
			</tr>
           <tr>
           <td ><h:outputLabel value="#{lbl['lbl.sc.item.type']}" /></td>
					<td><p:inputText
							value=""
							disabled="true" size="30" /></td>
           <td ><h:outputLabel value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
					<td><p:inputText value="" disabled="true"
							size="30" /></td>
					
           </tr>
			<tr>

				<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>
			<tr>

				<td><h:outputLabel value="#{lbl['lbl.sc.spec.tier.price.req']}" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>

<tr>

				<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>
			</table>



		</p:panel>


		<ac:templateSpec
			templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}" />

		



	</ui:define>


</ui:composition>
