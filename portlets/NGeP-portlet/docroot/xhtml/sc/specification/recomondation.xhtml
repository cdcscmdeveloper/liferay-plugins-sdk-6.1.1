<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<h:panelGroup id="recommendationid">
<h:outputText value="manga"></h:outputText>
<p:panel rendered="#{((specificationBackingBean.managedBean.scQt.evaluationType eq '2' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'false') or (specificationBackingBean.managedBean.scQt.evaluationType eq '2' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'true') or (specificationBackingBean.managedBean.scQt.evaluationType eq '1' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'true'))}">
	<p:panel header="Recommendation(By Package)">
		<table>
			<tr>
				<td><h:outputLabel value="Technical(%)"></h:outputLabel></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="Financial(%)"></h:outputLabel></td>
				<td><p:inputText /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="Total"></h:outputLabel></td>
				<td><p:inputText /> <h:outputLabel value="/100%"></h:outputLabel>
				</td>
			</tr>
			<tr>
				<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
				<td><p:inputText /> <h:outputLabel value="/100%"></h:outputLabel>
				</td>
			</tr>
		</table>
	</p:panel>



	<p:panel header="Recommendation(By Item)">
		<p:panelGrid style="margin-top:5px;width:70%;">
			<f:facet name="header">

				<p:row>
					<p:column colspan="1"></p:column>
					<p:column colspan="1">Item</p:column>
					<p:column colspan="1">Others</p:column>
					<p:column>Score(%)</p:column>
				</p:row>
			</f:facet>
			<p:row>
				<p:column style="font-weight: bold;">Technical(%)</p:column>
				<p:column style="font-weight: bold;">
					<p:inputText />
				</p:column>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
			</p:row>
			<p:row>
				<p:column style="font-weight: bold;">Financial(%)</p:column>
				<p:column style="font-weight: bold;">
					<p:inputText />
				</p:column>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
			</p:row>

		</p:panelGrid>
		<table>
			<tr>
				<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
				<td><p:inputText /> <h:outputLabel value="/100%"></h:outputLabel>
				</td>
			</tr>
		</table>

	</p:panel>
	</p:panel>
	
	<p:panel rendered="#{specificationBackingBean.managedBean.scQt.evaluationType eq '1' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'false'}">
		<p:panel header="Recommendation(By Package)">
		<table>
		
			<tr>
				<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
				<td><p:inputText /> <h:outputLabel value="/100%"></h:outputLabel>
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Recommendation(By Item)">
		<p:panelGrid style="margin-top:5px;width:70%;">
			<f:facet name="header">

				<p:row>
					<p:column colspan="1"></p:column>
					<p:column colspan="1">Item</p:column>
					<p:column colspan="1">Others</p:column>
					<p:column>Score(%)</p:column>
				</p:row>
			</f:facet>
		
			<p:row>
				<p:column style="font-weight: bold;">Financial(%)</p:column>
				<p:column style="font-weight: bold;">
					<p:inputText />
				</p:column>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText />
				</p:column>
			</p:row>

		</p:panelGrid>
		<table>
			<tr>
				<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
				<td><p:inputText /> <h:outputLabel value="/100%"></h:outputLabel>
				</td>
			</tr>
		</table>

	</p:panel>
	</p:panel>
	</h:panelGroup>

</ui:composition>
