<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup id="recommendationid">

		<p:panel style="margin-left:5%"
			rendered="#{((specificationBackingBean.managedBean.scQt.evaluationType eq '2' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'false') or (specificationBackingBean.managedBean.scQt.evaluationType eq '2' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'true') or (specificationBackingBean.managedBean.scQt.evaluationType eq '1' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'true'))}">
			<p:panel id="package" header="By Package">
				<table>
					<tr>
						<td><h:outputLabel value="Technical(%)"></h:outputLabel></td>
						<td><p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.overallTechnical}">
								<p:ajax event="blur" update="totalrecommendation"
									process="@this,package" partialSubmit="true"
									listener="#{specificationBackingBean.calculateTotalPackage(specificationBackingBean.managedBean.recommendationPackageScore)}"></p:ajax>
							</p:inputText></td>
					</tr>
					<tr>
						<td><h:outputLabel value="Financial(%)"></h:outputLabel></td>
						<td><p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.overallFin}">
								<p:ajax event="blur" update="totalrecommendation"
									process="@this,package" partialSubmit="true"
									listener="#{specificationBackingBean.calculateTotalPackage(specificationBackingBean.managedBean.recommendationPackageScore)}"></p:ajax>
							</p:inputText></td>
					</tr>
					<tr>
						<td><h:outputLabel value="Total"></h:outputLabel></td>
						<td><p:inputText id="totalrecommendation"
								value="#{specificationBackingBean.managedBean.recommendationPackageTotal}"
								disabled="true" /><p:spacer width="5"/> <h:outputLabel value="/100%"></h:outputLabel>
						</td>
					</tr>
					<tr>
						<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
						<td><p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.passingScore}" /><p:spacer width="5"/>
							<h:outputLabel value="/100%"></h:outputLabel></td>
					</tr>
				</table>
			</p:panel>



			<p:panel id="item" header="By Item">
				<table>
					<tr>
						<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
						<td><p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.passingScore}" /><p:spacer width="5"/>
							<h:outputLabel value="/100%"></h:outputLabel></td>
					</tr>
				</table>
				<p:panelGrid style="margin-top:5px;width:100%;">
					<f:facet name="header">

						<p:row>
							<p:column colspan="1"></p:column>
							<p:column colspan="1">Item</p:column>
							<p:column colspan="1">Others</p:column>
							<p:column>Score(%)</p:column>
						</p:row>
					</f:facet>
					<p:row>
						<p:column style="font-weight: bold;">Technical(%)</p:column>
						<p:column style="font-weight: bold;">
							<p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallTechnical}">
								<p:ajax event="blur" update="technicalrecommendation"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendtechnicalScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>

						<p:column colspan="1" style="font-weight: bold;">
							<p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallOtherTechnical}">
								<p:ajax event="blur" update="technicalrecommendation"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendtechnicalScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>
						<p:column colspan="1" style="font-weight: bold;">
							<h:outputText id="technicalrecommendation"
								value="#{specificationBackingBean.managedBean.recommendTechnicalScore}" />
						</p:column>
					</p:row>
					<p:row>
						<p:column style="font-weight: bold;">Financial(%)</p:column>
						<p:column style="font-weight: bold;">
							<p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallFin}">
								<p:ajax event="blur" update="financialrecommendation"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendFinancialScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>

						<p:column colspan="1" style="font-weight: bold;">
							<p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallOtherFin}">
								<p:ajax event="blur" update="financialrecommendation"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendFinancialScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>
						<p:column colspan="1" style="font-weight: bold;">
							<h:outputText id="financialrecommendation"
								value="#{specificationBackingBean.managedBean.recommendfinancialScore}" />
						</p:column>
					</p:row>

				</p:panelGrid>


			</p:panel>
		</p:panel>

		<p:panel
			rendered="#{specificationBackingBean.managedBean.scQt.evaluationType eq '1' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'false'}">
			<p:panel id="recommendTechnicalItem" header="By Package">
				<table>

					<tr>
						<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
						<td><p:inputText
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.passingScore}"
								style="text-align:right" /><p:spacer width="5"/> <h:outputLabel value="/100%"></h:outputLabel>
						</td>
					</tr>
				</table>
			</p:panel>

			<p:panel header="By Item">
				<table>
					<tr>
						<td><h:outputLabel value="Passing Score(%)"></h:outputLabel></td>
						<td><p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.passingScore}" /><p:spacer width="5"/>
							<h:outputLabel value="/100%"></h:outputLabel></td>
					</tr>
				</table>
				<p:panelGrid style="margin-top:5px;width:100%;">
					<f:facet name="header">

						<p:row>
							<p:column colspan="1"></p:column>
							<p:column colspan="1">Item</p:column>
							<p:column colspan="1">Others</p:column>
							<p:column>Score(%)</p:column>
						</p:row>
					</f:facet>

					<p:row>
						<p:column style="font-weight: bold;">Financial(%)</p:column>
						<p:column style="font-weight: bold;">
							<p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallFin}">
								<p:ajax event="blur" update="financial"
									process="@this,recommendTechnicalItem" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendFinancialScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>

						<p:column colspan="1" style="font-weight: bold;">
							<p:inputText style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallOtherFin}">
								<p:ajax event="blur" update="financial"
									process="@this,recommendTechnicalItem" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendFinancialScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>
						<p:column colspan="1" style="font-weight: bold;">
							<h:outputText id="financial"
								value="#{specificationBackingBean.managedBean.recommendfinancialScore}" />
						</p:column>
					</p:row>

				</p:panelGrid>


			</p:panel>
		</p:panel>
	</h:panelGroup>

</ui:composition>
