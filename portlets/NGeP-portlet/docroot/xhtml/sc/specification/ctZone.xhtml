<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.spec.supplier.zone']}"
		widgetVar="ctZone" width="400" height="500" position="top"
		style="border:0px;">

		
		<p:panel id="ctZonedetails">

			<p:tree id="ctZones"
				value="#{specificationBackingBean.managedBean.ctZoneTrees}"
				var="ctZones"
				selection="#{specificationBackingBean.managedBean.ctZoneTreeSelectedNodes}"
				selectionMode="checkbox">
				<p:treeNode type="zone">
					<h:outputText value="#{ctZones.name}" />
				</p:treeNode>
				<p:treeNode type="state">
					<h:outputText value="#{ctZones.stateId.stateName}" />
				</p:treeNode>
				<p:treeNode type="district">
					<h:outputText value="#{ctZones.districtId.districtName}" />
				</p:treeNode>
			</p:tree>
		</p:panel>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
			style="float:right;" onclick="ctZone.hide();"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			update="ctZoneList"
			actionListener="#{specificationBackingBean.updateContractZoneLocation}"
			oncomplete="ctZone.hide();"></p:commandButton>


	</p:dialog>
</ui:composition>
