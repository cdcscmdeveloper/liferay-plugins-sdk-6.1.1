<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="ctZoneList"
		header="#{lbl['lbl.sc.spec.panel.location.details']}"
		toggleable="true">


		<p:dataTable id="ctSupplierZones"
			value="#{specificationBackingBean.managedBean.ctZoneSuppliers}"
			var="Zones" rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.panelZoneSelect}"
			dynamic="true">


			<p:column headerText="#{lbl['lbl.sc.spec.supplier.zone']}"
				style="width:90%">
				<p:tree value="#{Zones}" var="location" selectionMode="single">
					<p:ajax event="select" update=":form:paneltabView:totalSupplier"
						listener="#{specificationBackingBean.retriveZoneBySupplier}" />
					<p:treeNode type="zone">
						<h:outputText value="#{location.name}" />
					</p:treeNode>
					<p:treeNode type="state">
						<h:outputText value="#{location.stateId.stateName}" />
					</p:treeNode>
					<p:treeNode type="district">
						<h:outputText value="#{location.districtId.districtName}" />
					</p:treeNode>
				</p:tree>
			</p:column>
		</p:dataTable>


		<div align="right">
			<p:commandButton oncomplete="ctZone.show();" update="ctZonedetails"
				actionListener="#{specificationBackingBean.retriveZonesByCircularNo}"
				value="#{lbl['lbl.ct.ded.btn.add']}" process="@this"
				icon="ui-icon-add"></p:commandButton>
		</div>
	</p:panel>
	<!-- <ui:include src="/xhtml/sc/specification/supplierZoneSelect.xhtml"  -->
	<ui:include src="supplierlist.xhtml" />
</ui:composition>
