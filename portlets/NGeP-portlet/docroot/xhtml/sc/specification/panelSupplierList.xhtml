<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="ctZoneList" header="Zone" toggleable="true">

		<p:tree id="ctSupplierZones" style="border:none;"
			value="#{specificationBackingBean.managedBean.ctZoneSuppliers}"
			var="ctZones"  selectionMode="single" dynamic="true">
			  <p:ajax event="select" update=":form:businessSpecId:paneltabView:totalSupplier" listener="#{specificationBackingBean.retriveZoneBySupplier}" /> 
			<p:treeNode type="zone">
				<h:outputText value="#{ctZones.name}" />
			</p:treeNode>
			<p:treeNode type="state">
				<h:outputText value="#{ctZones.stateName}" />
			</p:treeNode>
		</p:tree>

	</p:panel>
	<!-- <ui:include src="/xhtml/sc/specification/supplierZoneSelect.xhtml"  -->
	<ui:include src="supplierlist.xhtml" />
</ui:composition>
