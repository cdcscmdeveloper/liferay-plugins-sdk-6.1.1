<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}" style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				actionListener="#{specificationBackingBean.acceptCompanyScoring}" />



		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputText value="#{specificationBackingBean.managedBean.scQtChecklist.title}" disabled="true"></p:inputText></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="Company Experience(For Federal Government)"
			toggleable="true">
			<h:panelGrid columns="2">
				<h:outputLabel
					value="* For company experience on the product/service which has participated since  year "></h:outputLabel>
				<p:inputText value="#{specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue.year}"></p:inputText>
			</h:panelGrid>
			<p:dataTable id="experience" rowIndexVar="index" var="experience"
				rowKey="#{experience}">
				<ac:paginator for="experience"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.effective.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.exp.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.ramarks']}">
					<p:inputText></p:inputText>
				</p:column>
			</p:dataTable>


			<h:panelGrid columns="3">


				<h:outputText value="#{lbl['lbl.sc.spec.total.no.contracts']}" />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"></p:inputText>


				<h:outputText value="#{lbl['lbl.sc.spec.total.no.years']}" />
				<p:spacer width="10"></p:spacer>
				<p:inputText readonly="true" disabled="true"></p:inputText>

				

			</h:panelGrid>

		</p:panel>



		<p:panel>
			<h:panelGrid columns="2">
				<p:outputLabel value="Score Type"></p:outputLabel>
				<p:selectOneMenu
					value="#{specificationBackingBean.managedBean.checklistScoreType}">
					<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
					<p:ajax event="change" update="companyContract"
						listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
				</p:selectOneMenu>
			</h:panelGrid>
		</p:panel>
		<h:panelGroup id="companyContract">
			<p:panel
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">
				<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
				<h:panelGroup id="contractorGroupId">
					<ui:param name="scoringList"
						value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
						value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
					<ui:param name="componentName" value="contractor" />
					<ui:param name="scoringPnlId" value="contractorListId" />
					<ui:param name="scoringPnlName"
						value="#{lbl['lbl.sc.spec.score.total.no.contracts']}"></ui:param>
					<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
							process="@this,#{scoringPnlId}" partialSubmit="true"
							actionListener="#{specificationBackingBean.addScoring}"
							update="#{scoringPnlId}" icon="ui-icon-add" />
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
							icon="ui-icon-delete"
							action="#{specificationBackingBean.deleteScoring}"
							update="#{scoringPnlId}" />

					</div>
				</h:panelGroup>
			</p:panel>
			<p:panel header="Scoring For Total No Of Contracts"
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
				<table>
					<tr>
						<td><p:outputLabel value="Max.Score"></p:outputLabel></td>
						<td><p:inputText
								value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}"></p:inputText>
						</td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>



		<p:panel>
			<h:panelGrid columns="2">
				<p:outputLabel value="Score Type"></p:outputLabel>
				<p:selectOneMenu
					value="#{specificationBackingBean.managedBean.companyScoreType}">
					<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
					<p:ajax event="change" update="companyGovScore"
						listener="#{specificationBackingBean.companyscoreTypeChange}"></p:ajax>
				</p:selectOneMenu>
			</h:panelGrid>
		</p:panel>
		<h:panelGroup id="companyGovScore">
			<p:panel
				rendered="#{specificationBackingBean.managedBean.companyScoreType eq '1'}">
				<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
				<h:panelGroup id="scoringofYearsGroupId">
					<ui:param name="scoringList"
						value="#{specificationBackingBean.managedBean.scoringForYears}" />
							<ui:param name="selectionList"
						value="#{specificationBackingBean.managedBean.scoringForSelectYears}" />
					<ui:param name="componentName" value="ScoringYear" />
					<ui:param name="scoringPnlId" value="scoringYearId" />
					<ui:param name="scoringPnlName"
						value="#{lbl['lbl.sc.spec.score.total.no.years']}"></ui:param>
					<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
							process="@this,#{scoringPnlId}" partialSubmit="true"
							actionListener="#{specificationBackingBean.addScoringyears}"
							update="#{scoringPnlId}" icon="ui-icon-add" />
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
							icon="ui-icon-delete"
							action="#{specificationBackingBean.deleteScoring}"
							update="#{scoringPnlId}" />

					</div>
				</h:panelGroup>
			</p:panel>

			<p:panel  header="Scoring For Total No Of Years"
				rendered="#{specificationBackingBean.managedBean.companyScoreType eq '2'}">
				<table>
					<tr>
						<td><p:outputLabel value="Max.Score"></p:outputLabel></td>
						<td><p:inputText
								value="#{specificationBackingBean.managedBean.scQtContractScore.score}"></p:inputText>
						</td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>




	</ui:define>
</ui:composition>
