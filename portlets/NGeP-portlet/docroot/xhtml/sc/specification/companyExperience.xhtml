<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog  widgetVar="company" modal="true"
		width="800" height="400">
		
		<p:panel header="#{lbl['lbl.sc.spec.company.exp']}"
			toggleable="true" collapsed="true">

			<p:dataTable id="experience" rowIndexVar="index"
			var="experience" rowKey="#{experience}" >
			<ac:paginator for="experience"></ac:paginator>
			<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
				<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.effective.date']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.exp.date']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.ramarks']}">
				<p:inputText ></p:inputText>
				</p:column>
			</p:dataTable>
			
		
	<h:panelGrid columns="3" >


		<h:outputText value="#{lbl['lbl.sc.spec.total.no.contracts']}" />
		<p:spacer width="10"></p:spacer>
		<p:inputText readonly="true" disabled="true"></p:inputText>
		

		<h:outputText value="#{lbl['lbl.sc.spec.total.no.years']}" />
		<p:spacer width="10"></p:spacer>
		<p:inputText readonly="true" disabled="true"></p:inputText>
		
		<h:outputText value="#{lbl['lbl.sc.spec.total.contract.amount']}" />
		<p:spacer width="10"></p:spacer>
		<p:inputText readonly="true" disabled="true"></p:inputText>
		

	</h:panelGrid>

</p:panel>
			
			
		
		
		
		
		<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
		<h:panelGroup id="contractorGroupId">
			<ui:param name="scoringList" value="#{specificationBackingBean.managedBean.checkListScore}" />
			<ui:param name="componentName" value="contractor"/>
			<ui:param name="scoringPnlId" value="contractorListId" />
			<ui:param name="scoringPnlName" value="#{lbl['lbl.sc.spec.score.total.no.contracts']}"></ui:param>
			<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{scoringPnlId}" partialSubmit="true" actionListener="#{specificationBackingBean.addScoring}" update="#{scoringPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" action="#{specificationBackingBean.deleteScoring}" update="#{scoringPnlId}"/>

			</div>
		</h:panelGroup>


<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
		<h:panelGroup id="scoringofYearsGroupId">
			<ui:param name="scoringList" value="#{specificationBackingBean.managedBean.scoringForYears}" />
			<ui:param name="componentName" value="ScoringYear"/>
			<ui:param name="scoringPnlId" value="scoringYearId" />
			<ui:param name="scoringPnlName" value="#{lbl['lbl.sc.spec.score.total.no.years']}"></ui:param>
			<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{scoringPnlId}" partialSubmit="true"
					actionListener="#{specificationBackingBean.addScoringyears}"
					update="#{scoringPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" action="#{specificationBackingBean.deleteScoring}" update="#{scoringPnlId}"/>

			</div>
		</h:panelGroup>



<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
		<h:panelGroup id="contractAmountGroupId">
			<ui:param name="scoringList" value="#{specificationBackingBean.managedBean.contractAmount}" />
			<ui:param name="componentName" value="ContractAmount"/>
			<ui:param name="scoringPnlId" value="contractAmountId" />
			<ui:param name="scoringPnlName" value="#{lbl['lbl.sc.spec.score.total.contract.amount']}"></ui:param>
			<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{scoringPnlId}" partialSubmit="true"
					actionListener="#{specificationBackingBean.addContratAmount}"
					update="#{scoringPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" action="#{specificationBackingBean.deleteScoring}" update="#{scoringPnlId}"/>

			</div>
		</h:panelGroup>


	</p:dialog>
</ui:composition>
