<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sc.spec.bo.financial.specification']}"
		toggleable="true">

		<p:dataTable id="financialSpecification" var="financialSpec"
			style="width:100%" rowIndexVar="index"
			value="#{specificationBackingBean.managedBean.financialSpecList}"
			rowKey="#{financialSpec}">
			<ac:paginator for="financialSpecification" />

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:50%">
				<h:outputText value="#{financialSpec.title}" size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.status']}" style="width:20%">
				<h:outputText
					value="#{specificationBackingBean.getStatusDescById(financialSpec.pmStatus.statusId)}"
					size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.by']}" style="width:20%">
				<h:outputText
					value="#{specificationBackingBean.retriveUserName(financialSpec.createdBy)}"
					size="50"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
				style="width:10%">
				<p:commandLink
					action="#{specificationBackingBean.financialSpecEditAction(index,financialSpec,'F')}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<!-- <div align="right">
			<p:commandButton value="Create Specification" process="@this"
				partialSubmit="true" oncomplete="create.show();" />


		</div> -->


	</p:panel>

</ui:composition>
