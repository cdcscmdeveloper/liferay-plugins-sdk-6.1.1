<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="financialCreditFacility" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"></p:messages>
		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				action="#{specificationBackingBean.acceptCompanyScoring}" >
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.criteriaType}"
					value="51" />
				
				</p:commandButton>



		</div>
		<p:spacer height="50"></p:spacer>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel>
					</td>
					<td><p:inputTextarea rows="2" cols="100" style="width: 100%;"
							value="#{specificationBackingBean.managedBean.scQtChecklist.title}"
							disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.spec.credit.facility']}"
			toggleable="true">
			<p:dataTable id="credit" rowIndexVar="index" var="experience"
				rowKey="#{experience}">
				<ac:paginator for="credit"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
					<p:inputText></p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.address']}">
					<p:inputText></p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.credit.type']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.amount']}">
					<p:inputText></p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.amt.paid']}">

					<p:inputText>

					</p:inputText>
				</p:column>
			</p:dataTable>

		</p:panel>

		<h:panelGrid columns="2">
			<h:outputLabel value="#{lbl['lbl.sc.spec.total.credit']}"></h:outputLabel>
			<p:inputText readonly="true" disabled="true"></p:inputText>
			<h:outputLabel value="#{lbl['lbl.sc.spec.total.credit.amount.paid']}"></h:outputLabel>
			<p:inputText readonly="true" disabled="true"></p:inputText>
			<h:outputLabel value="#{lbl['lbl.sc.spec.total.credit.percentage.paid']}"></h:outputLabel>
			<p:inputText readonly="true" disabled="true"></p:inputText>
		</h:panelGrid>

		<p:panel header="#{lbl['lbl.sc.spec.score.total.credit.facility']}" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
							<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
							<p:ajax event="change" update="creditFacility"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>
			</table>

			<h:panelGroup id="creditFacility">
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

					<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
					<h:panelGroup id="creditFacilityGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
						<ui:param name="componentName" value="creditFacility" />
						<ui:param name="scoringPnlId" value="creditFacilityId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.spec.score.total.credit.facility']}"></ui:param>
						<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								actionListener="#{specificationBackingBean.addScoring(51)}"
								update="#{scoringPnlId}" icon="ui-icon-add" />
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
								icon="ui-icon-delete" process="@this,#{scoringPnlId}" partialSubmit="true"
								action="#{specificationBackingBean.deleteScoring(null)}"
								update="#{scoringPnlId}" />

						</div>
					</h:panelGroup>

				</p:panel>
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
							</td>
							<td><p:inputText maxlength="18" id="creditFacilityScore"
									label="#{lbl['lbl.sc.spec.max.score']}" required="true"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
								</p:inputText> <p:message id="finCreditfacilityMaxScore"
									for="creditFacilityScore" display="icon"></p:message></td>
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>
		</p:panel>


	</ui:define>
</ui:composition>
