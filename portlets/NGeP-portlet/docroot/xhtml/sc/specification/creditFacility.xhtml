<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog  widgetVar="creditFacility" modal="true"
		width="800" height="400">
		<p:panel header="#{lbl['lbl.sc.spec.credit.facility']}" toggleable="true">
				<p:dataTable id="credit" rowIndexVar="index"
			var="experience" rowKey="#{experience}" >
			<ac:paginator for="credit"></ac:paginator>
			<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
				<p:inputText></p:inputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.spec.address']}">
				<p:inputText ></p:inputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.spec.credit.type']}">
				<p:inputText ></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.amount']}">
				<p:inputText ></p:inputText>
				</p:column>
			</p:dataTable>
		
		</p:panel>
		
		<h:panelGrid columns="2">
		<h:outputLabel value="#{lbl['lbl.sc.spec.total.credit']}"></h:outputLabel>
		<p:inputText></p:inputText>
		</h:panelGrid>
		
		<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
		<h:panelGroup id="creditFacilityGroupId">
			<ui:param name="scoringList" value="#{specificationBackingBean.managedBean.creditFacility}" />
			<ui:param name="componentName" value="creditFacility"/>
			<ui:param name="scoringPnlId" value="creditFacilityId" />
			<ui:param name="scoringPnlName" value="#{lbl['lbl.sc.spec.score.total.credit.facility']}"></ui:param>
			<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{scoringPnlId}" partialSubmit="true"
					actionListener="#{specificationBackingBean.creditFacilityScore}"
					update="#{scoringPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" action="#{specificationBackingBean.deleteScoring}" update="#{scoringPnlId}"/>

			</div>
		</h:panelGroup>

		<p:commandButton value="#{lbl['lbl.sc.spec.btn.tech.close']}"
			style="float:right;" onclick="creditFacility.hide();"
			icon="ui-icon-cancel"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.ok']}"
			style="float:right;" process="@all"  partialSubmit="true"
			oncomplete="creditFacility.hide();" icon="ui-icon-accept"></p:commandButton>


	</p:dialog>
</ui:composition>
