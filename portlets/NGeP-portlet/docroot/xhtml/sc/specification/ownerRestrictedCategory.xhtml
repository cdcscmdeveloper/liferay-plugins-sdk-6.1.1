<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	


	
	
	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
		<p:commandLink value="CategoryCodeList"></p:commandLink>
		<p:dataTable id="restrictedPnlId" var="cateGory"
			value="#{specificationBackingBean.managedBean.suppCriteriarestrictedList}"
			style="width:100%" rowIndexVar="index" >

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<ac:lov id="restrictedPtj" lovId="PM_CATEGORY_L3"
					headerText="Category Lov"
					saveObject="specificationBackingBean.managedBean.suppCriteriarestrictedList[#{index}].pmCategoryL3"
					value="#{cateGory.pmCategoryL3.categoryL3Code}" update=":form:businessSpecId:restrictedtabView:restrictedPnlId">

				</ac:lov>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryTypeCode.parameterId}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.mandatory']}"
				style="width:10%">
				 <p:selectBooleanCheckbox  value="#{cateGory.mandatory}">
					
				</p:selectBooleanCheckbox> 
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this" 
				update="restrictedPnlId" icon="ui-icon-add"
				actionListener="#{specificationBackingBean.addRestrictedCategoryAction}" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete"
				action="#{specificationBackingBean.deleteScoring}"
				update="restrictedPnlId" />

		</div>
	</p:panel>

</ui:composition>
