<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<p:panel header="#{scoringPnlName}"
			toggleable="true">

			<p:dataTable id="#{scoringPnlId}" rowIndexVar="index"
			value="#{scoringList}"
			var="checkListScoring" rowKey="#{checkListScoring}" >
			<ac:paginator for="#{scoringPnlId}"></ac:paginator>
			<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.from']}">
				<p:inputText value="#{checkListScoring.rangeFrom}"></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.to']}">
				<p:inputText value="#{checkListScoring.rangeTo}"></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.stage2.score']}">
				<p:inputText value="#{checkListScoring.score}"></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
		
	
</ui:composition>
