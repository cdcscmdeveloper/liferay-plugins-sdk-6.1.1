<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{scoringPnlName}" toggleable="true">

		<p:dataTable id="#{scoringPnlId}" rowIndexVar="index"
			widgetVar="scoreWidget" value="#{scoringList}"
			selection="#{selectionList}" var="checkListScoring"
			rowKey="#{checkListScoring}">
			<ac:paginator for="#{scoringPnlId}"></ac:paginator>
			<p:column selectionMode="multiple" style="width:2px;"></p:column>
			<p:column style="width:40%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.stage2.score.from']}" />
				</f:facet>
				<p:inputText id="#{scoringPnlId}_fromRange" style="text-align:right"
					label="#{lbl['lbl.sc.spec.stage2.score.from']}" required="true"
					value="#{checkListScoring.rangeFrom}" maxlength="18">
					<p:ajax event="blur" process="@this" partialSubmit="true" />
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
				</p:inputText>
				<p:message id="#{scoringPnlId}_rangeFrom"
					for="#{scoringPnlId}_fromRange" display="icon"></p:message>
			</p:column>
			<p:column style="width:30%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.stage2.score.to']}" />
				</f:facet>
				<p:inputText id="#{scoringPnlId}_toRange" required="true"
					style="text-align:right"
					label="#{lbl['lbl.sc.spec.stage2.score.to']}"
					value="#{checkListScoring.rangeTo}" maxlength="18">
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
					<p:ajax event="blur" process="@this" partialSubmit="true" />
				</p:inputText>
				<p:message id="#{scoringPnlId}_rangeTo"
					for="#{scoringPnlId}_toRange" display="icon"></p:message>
			</p:column>
			<p:column style="width:30%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.stage2.score']}" />
				</f:facet>
				<p:inputText id="#{scoringPnlId}_toScore" style="text-align:right"
					label="#{lbl['lbl.sc.spec.stage2.score']}" required="true"
					value="#{checkListScoring.score}" maxlength="18">
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
				</p:inputText>
				<p:message id="#{scoringPnlId}_Score" for="#{scoringPnlId}_toScore"
					display="icon"></p:message>
			</p:column>

		</p:dataTable>
	</p:panel>


</ui:composition>
