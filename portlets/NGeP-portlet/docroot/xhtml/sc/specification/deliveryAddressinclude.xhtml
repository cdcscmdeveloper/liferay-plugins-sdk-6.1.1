<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Delivery/Service Address" toggleable="true" styleClass="deliveryUpdate">

		<p:dataTable id="pjtDelivered" var="delivery" editable="true" style="width:100%"
			rowIndexVar="index" value="#{deliveryList}" selection="#{selectDeliveryList}" rowKey="#{delivery}">
               <ac:paginator for="pjtDelivered"></ac:paginator>
			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="PTJ" style="width:25%">

			</p:column>

			<p:column headerText="Delivery/Service Address" style="width:73%">
				<h:outputText  value="#{delivery.deliveryAddress}"></h:outputText>
			</p:column>
		</p:dataTable>
		
	</p:panel>
</ui:composition>
