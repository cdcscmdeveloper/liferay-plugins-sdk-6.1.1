<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.delivery.service.address']}"
		toggleable="true" styleClass="deliveryUpdate">

		<p:dataTable id="pjtDelivered" var="delivery" editable="true"
			style="width:100%" widgetVar="deliveryService" rowIndexVar="index"
			value="#{deliveryList}" selection="#{selectDeliveryList}"
			rowKey="#{delivery}">
			<ac:paginator for="pjtDelivered"></ac:paginator>
			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.delivery.ptj']}"
				style="width:25%;white-space: normal;">
				<h:outputText value="#{delivery.pmAddressType.pmOrgProfile.orgName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.delivery.service.address']}"
				style="width:73%;white-space: normal;">
				<h:outputText value="#{delivery.deliveryAddress}"></h:outputText>
			</p:column>
		</p:dataTable>

	</p:panel>
</ui:composition>
