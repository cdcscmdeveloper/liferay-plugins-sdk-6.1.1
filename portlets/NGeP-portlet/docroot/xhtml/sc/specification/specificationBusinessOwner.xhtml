<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.general']}" toggleable="true">

		<table style="width: 100%" border="1">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.panel ? 'Yes' : 'No'}"
						readonly="true" disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td colspan="4">
					<table style="width: 100%">
						<tr>
							<td style="width:17%"><h:outputLabel value="Quotation/Tender Type" /></td>
							<td><p:selectOneMenu value="#{specificationBackingBean.managedBean.scQt.qtType}" disabled="#{specificationBackingBean.managedBean.scQt.panel ne 'Yes'}" style="width:30%">
									<f:selectItems
										value="#{specificationBackingBean.retrieveParameterDescByType(ParameterTypeConst.quotationTenderType)}"
										var="parameter" itemLabel="#{parameter.codeName}" itemValue="#{parameter.pmParameter.parameterCode}" />
                                   <p:ajax event="change" update="suppQualSpec" listener="#{specificationBackingBean.onChangeQtType}"></p:ajax>
								</p:selectOneMenu></td>
                            <ui:fragment rendered="#{specificationBackingBean.managedBean.scQt.panel eq 'No'}">
							<td  style="width:7%"><h:outputLabel value="Open For" /></td>
							<td><p:selectOneRadio value="#{specificationBackingBean.managedBean.scQt.openFor}">

									<f:selectItem itemLabel="Bumiputra" itemValue="B" />
									<f:selectItem itemLabel="All" itemValue="A" />
								</p:selectOneRadio></td>
								</ui:fragment>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td><h:outputLabel
						value="* #{lbl['lbl.sc.spec.evaluation.type']}" /></td>
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.scQtSpec.evaluationType}">
						<f:selectItem itemLabel="One Tier" itemValue="1" />
						<f:selectItem itemLabel="Two Tier" itemValue="2" />
					</p:selectOneRadio></td>

				<td ><h:outputLabel value="#{lbl['lbl.sc.spec.item.type']}" /></td>
				<td><p:selectOneMenu
						value="#{specificationBackingBean.managedBean.scQt.itemType}"
						style="margin-bottom:5px;width:150px;">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.scItemType)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" /></td>
				<td><p:inputText value="#{specificationBackingBean.managedBean.scQt.qtAmount}"></p:inputText></td>

				<td><h:outputLabel value=" #{lbl['lbl.sc.spec.justification']}" /></td>
				<td><p:inputTextarea rows="3" cols="50"
						value="#{specificationBackingBean.managedBean.scQtSpec.justificationRemark}"></p:inputTextarea></td>

			</tr>
		</table>

	</p:panel>






</ui:composition>
