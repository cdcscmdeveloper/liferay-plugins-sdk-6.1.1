<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.general']}" toggleable="true">

		<table style="width: 100%" border="1">
			<tr>
				<td><h:outputLabel value="Title" /></td>
				<td colspan="3"><p:inputText readonly="true"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						disabled="true"></p:inputText></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.panel ? 'Yes' : 'No'}"
						readonly="true" disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td colspan="4">
					<table style="width: 100%">
						<tr>
							<td style="width: 17%"><h:outputLabel
									value="Quotation/Tender Type" /></td>
							<td><ui:fragment
									rendered="#{specificationBackingBean.managedBean.scQt.panel ne 'No'}">
									<p:selectOneMenu
										value="#{specificationBackingBean.managedBean.scQt.qtType}"
										disabled="true" style="width:30%">
										<f:selectItems
											value="#{specificationBackingBean.retrieveParameterDescByType(ParameterTypeConst.quotationTenderType)}"
											var="parameter" itemLabel="#{parameter.codeName}"
											itemValue="#{parameter.pmParameter.parameterCode}" />
										<p:ajax event="change" update="suppQualSpec"
											listener="#{specificationBackingBean.onChangeQtType}"></p:ajax>
									</p:selectOneMenu>
								</ui:fragment> <ui:fragment
									rendered="#{specificationBackingBean.managedBean.scQt.panel eq 'No'}">

									<p:selectOneRadio
										value="#{specificationBackingBean.managedBean.scQt.qtType}">

										<f:selectItems
											value="#{specificationBackingBean.retrieveParameterDescByType(ParameterTypeConst.quotationTenderType)}"
											var="parameter" itemLabel="#{parameter.codeName}"
											itemValue="#{parameter.pmParameter.parameterCode}" />
										<p:ajax event="change" update="suppQualSpec"
											listener="#{specificationBackingBean.onChangeQtType}"></p:ajax>
									</p:selectOneRadio>
								</ui:fragment></td>
							<ui:fragment
								rendered="#{specificationBackingBean.managedBean.scQt.panel eq 'No'}">
								<td style="width: 7%"><h:outputLabel value="Open For" /></td>
								<td><p:selectOneRadio
										value="#{specificationBackingBean.managedBean.scQt.openFor}">

										<f:selectItem itemLabel="Bumiputra" itemValue="B" />
										<f:selectItem itemLabel="All" itemValue="A" />
									</p:selectOneRadio></td>
							</ui:fragment>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td><h:outputLabel
						value="* #{lbl['lbl.sc.spec.evaluation.type']}" /></td>
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.scQt.evaluationType}">
						<f:selectItem itemLabel="One Tier" itemValue="1" />
						<f:selectItem itemLabel="Two Tier" itemValue="2" />
					</p:selectOneRadio></td>

				<td><h:outputLabel value="#{lbl['lbl.sc.spec.item.type']}" /></td>
				<td><p:selectOneMenu
						value="#{specificationBackingBean.managedBean.scQt.itemType}"
						style="margin-bottom:5px;width:150px;">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.scItemType)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.estimatedAmount}"></p:inputText></td>

				<td><h:outputLabel value=" #{lbl['lbl.sc.spec.justification']}" /></td>
				<td><p:inputTextarea rows="3" cols="50"
						value="#{specificationBackingBean.managedBean.scQt.justificationRemark}"></p:inputTextarea></td>

			</tr>
			<tr>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.scQt.panel eq 'No'}">
					<td><h:outputLabel value="Zone/Location" /></td>
					<td><p:selectOneRadio
							value="#{specificationBackingBean.managedBean.scQt.zonal}">

							<f:selectItem itemLabel="Yes" itemValue="true" />
							<f:selectItem itemLabel="No" itemValue="false" />
							<p:ajax event="change" partialSubmit="true"
								update="generalLocationList"
								process="@this"></p:ajax>
						</p:selectOneRadio></td>
				</ui:fragment>
			</tr>
		</table>

	</p:panel>

	<h:panelGroup id="generalLocationList">
		<p:panel header="Location List"
			rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locationLevels"
							value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel}"
							style="width: 178px;margin-bottom: 5px;">

							<f:selectItems
								value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
							<p:ajax event="change"
								listener="#{specificationBackingBean.selectLocation}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>
			</table>
		</p:panel>

		<p:panel
			rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}">
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneGeneralDataTable"
					value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
					var="zoneTree" style="width:65%" rowIndexVar="index">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location">

							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>

							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>




						</p:tree>
					</p:column>

					<p:column headerText="Action">
						<p:commandLink
							actionListener="#{specificationBackingBean.editBusinessOwnerZoneLocation(zoneTree,index)}"
							process="@this" update="@([id$=zonePopupGeneral])"
							oncomplete="ZoneGeneral.show();">
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />
						</p:commandLink>
					</p:column>

				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 65%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
					process="@this" update="@([id$=zonePopupGeneral])"
					oncomplete="ZoneGeneral.show();"
					actionListener="#{specificationBackingBean.showGeneralZoneLocationPopup}"
					icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" />
			</div>
		</p:panel>
	</h:panelGroup>
	<p:dialog header="" widgetVar="ZoneGeneral" modal="true" width="800"
		height="500">
		<p:panel id="zonePopupGeneral" header="ADD LOCATION">
			<table styleClass="noBorders tr,noBorders td">

				<TR>
					<TD width="20%" valign="top"><p:outputLabel value="Zone Name"></p:outputLabel></TD>
					<TD width="80%"><p:inputText
							value="#{specificationBackingBean.managedBean.zoneName}"></p:inputText>
					</TD>
				</TR>


				<TR>
					<TD width="20%" valign="top"><p:outputLabel
							value="Zone Location" /></TD>
					<TD width="80%"><p:panel></p:panel> <p:tree
							id="treeZoneGeneralPopup"
							value="#{specificationBackingBean.managedBean.rootZoanlTree}"
							var="location"
							selection="#{specificationBackingBean.managedBean.selectedGeneralTreeNodes}"
							selectionMode="checkbox">
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
							<p:treeNode type="city">
								<h:outputText value="#{pmCity.cityName}" />
							</p:treeNode>
						</p:tree></TD>
				</TR>

			</table>
		</p:panel>
		<p:commandButton value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
			style="float:right;" onclick="ZoneGeneral.hide();" process="@all"
			update="@this, zoneGeneralDataTable,zonePopupGeneral" icon="ui-icon-accept"
			action="#{specificationBackingBean.updateZoneGeneralLocation}">
		</p:commandButton>
				&#160;&#160;
		<p:commandButton
			value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
			style="float:right;" onclick="ZoneGeneral.hide();" icon="ui-icon-cancel"/>
	</p:dialog>


</ui:composition>
