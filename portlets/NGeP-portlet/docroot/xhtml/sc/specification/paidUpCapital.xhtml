<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->

		<p:messages id="financialPaidUpCapitalsScore" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"></p:messages>

		<div>
			<p:commandButton value="Back" style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				action="#{specificationBackingBean.acceptCompanyScoring}">
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.criteriaType}"
					value="70" />

			</p:commandButton>



		</div>
		<p:spacer height="50"></p:spacer>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" style="width: 100%;"
							value="#{specificationBackingBean.managedBean.scQtChecklist.title}"
							disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.spec.paid.up.capital']}"
			toggleable="true">
			<h:panelGrid columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.spec.paid.up.capital.ringgit']}"></h:outputLabel>
				<p:inputText disabled="true"></p:inputText>
			</h:panelGrid>
		</p:panel>
		<p:panel header="Scoring For Paid Up Capital" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel> <p:outputLabel
							value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><p:selectOneMenu required="true"
							label="#{lbl['lbl.sc.spec.asset.score.type']}"
							id="paidUpCapitalAutoScore"
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
							<p:ajax event="change" update="paidUpCapital"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu> <p:message id="paidUpCapitalAutoScoreId"
							for="paidUpCapitalAutoScore" display="icon"></p:message></td>
				</tr>
			</table>

			<h:panelGroup id="paidUpCapital">
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

					<ui:param name="scoringPnlGroupId" value="paidupCapitalId" />
					<h:panelGroup id="paidGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
						<ui:param name="componentName" value="Paid Up Capital" />
						<ui:param name="scoringPnlId" value="paidUpId" />
						<ui:param name="scoringPnlName"
							value="Scoring For Paid Up Capital"></ui:param>
						<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								update="#{scoringPnlId}" icon="ui-icon-add"
								actionListener="#{specificationBackingBean.addScoring(70)}" />
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
								process="@this" partialSubmit="true" icon="ui-icon-delete"
								action="#{specificationBackingBean.deleteSelectedRowsAction(scoringList)}"
								update="#{scoringPnlId}">
								<f:setPropertyActionListener
									target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
									value="#{false}" />
							</p:commandButton>

						</div>
					</h:panelGroup>

				</p:panel>
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
							</td>
							<td><p:inputText maxlength="18" required="true"
									label="#{lbl['lbl.sc.spec.max.score']}" id="finpaidUpScore"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
								</p:inputText> <p:message id="finpaidUpMaxScore" for="finpaidUpScore"
									display="icon"></p:message></td>
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>
		</p:panel>


	</ui:define>
</ui:composition>
