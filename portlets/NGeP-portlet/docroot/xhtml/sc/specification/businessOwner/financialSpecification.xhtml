<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sc.financial.specification']}"
		toggleable="true">

		<p:dataTable id="financialSpecification" var="financialSpec" rows="10"
			style="width:100%" rowIndexVar="index"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2financeProposalList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{financialSpec}">
			<ac:paginator for="financialSpecification" />

			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:50%;white-space: normal;">
				<h:outputText value="#{financialSpec.title}" size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:10%">
				<h:outputText
					value="#{specificationBackingBean.getStatusDescById(financialSpec.pmStatus.statusId)}"
					size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.by']}"
				style="width:30%;white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.retriveUserName(financialSpec.createdBy)}"
					size="50"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;text-align: center;">
				<p:commandLink
					action="#{specificationBackingBean.specEditAction(financialSpec,index,'F')}">
					<h:graphicImage value="/css/images/design/edit.png" />

				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<!-- <div align="right">
			<p:commandButton value="Create Specification" process="@this"
				partialSubmit="true" oncomplete="create.show();" />


		</div> -->


	</p:panel>

</ui:composition>
