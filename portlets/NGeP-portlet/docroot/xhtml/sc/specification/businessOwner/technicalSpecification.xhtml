<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sc.technical.specification']}"
		toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.specification.instruction']}"
			escape="false" />

		<p:dataTable id="templateTechSpecification" var="technicalSpec"
			style="width:100%" rowIndexVar="index" rows="10"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			rowKey="#{technicalSpec}">
			<ac:paginator for="templateTechSpecification" />

			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:50%;white-space: normal;">
				<h:outputText value="#{technicalSpec.title}" size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:10%">
				<h:outputText
					value="#{specificationBackingBean.getStatusDescById(technicalSpec.pmStatus.statusId)}"
					size="50"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.created.by']}"
				style="width:30%;white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.retriveUserName(technicalSpec.createdBy)}"
					size="50"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;text-align: center;">
				<p:commandLink ajax="false"
					action="#{specificationBackingBean.specEditAction(technicalSpec,index,'T')}">
					<h:graphicImage value="/css/images/design/edit.png" />

				</p:commandLink>
			</p:column>
		</p:dataTable>
		

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.create.specification']}"
				styleClass="BtnSpacing" process="@this"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval' or (specificationBackingBean.managedBean.panelItemCategory eq 'S' and specificationBackingBean.managedBean.scQt.panel)}"
				actionListener="#{specificationBackingBean.technicalSpecBoValidate}"
				partialSubmit="true" oncomplete="createOwnerSpec.show();"
				title="#{lbl['lbl.sc.spec.create.specification.tooltip']}" update="@([id$=bocreateSpec])"/>
		</div>

		<ui:include src="/xhtml/sc/boSctemplatespec/createTemplate.xhtml"></ui:include>
	</p:panel>

</ui:composition>
