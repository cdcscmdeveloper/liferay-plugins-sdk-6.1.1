<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	

	<p:panel header="#{lbl['lbl.sc.qt.approver.selection']}" toggleable="true">
		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.min.spec.secretary']}" /></td>
				<td><p:inputText size="75"
						value="#{specificationBackingBean.managedBean.scQt.ministrySpecSecrataryId.userName}" readonly="true" disabled="true"/></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{specificationBackingBean.managedBean.scQtRemarksList}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{specificationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}" maxlength="1000"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable>
			<p:column headerText="#{lbl['lbl.sc.approved.by']}">
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.date']}">
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
