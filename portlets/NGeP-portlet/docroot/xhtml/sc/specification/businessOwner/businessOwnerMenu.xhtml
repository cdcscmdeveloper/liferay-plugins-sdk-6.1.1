<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isQuotationThresHold"
		value="#{specificationBackingBean.managedBean.qt.procurementMode.parameterCode == ParameterConst.procurementModeQuotation}" />
	<ui:param name="isOneTierThresHold"
		value="#{specificationBackingBean.isOneTierThresHold(specificationBackingBean.managedBean.qt.estimatedAmount)}" />

	<ac:lovPopup />

	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" valign="top"><p:tabMenu
					id="businessSpecId"
					activeIndex="#{specificationBackingBean.managedBean.activeIndex}"
					styleClass="sidemenu">

					<p:menuitem value="#{lbl['lbl.sc.general.info']}" update="@form"
						action="#{specificationBackingBean.businessOwnerTabChange(0)}" />
					<p:menuitem value="#{lbl['lbl.sc.supplier.qulification.criteria']}"
						action="#{specificationBackingBean.businessOwnerTabChange(1)}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.technical.specification']}"
						actionListener="#{specificationBackingBean.businessOwnerTabChange(2)}"
						update="@form" />


					<p:menuitem value="#{lbl['lbl.sc.financial.specification']}"
						actionListener="#{specificationBackingBean.businessOwnerTabChange(3)}"
						update="@form" />

					<c:if
						test="#{((specificationBackingBean.managedBean.qt.specApprovalReq eq 'true' and specificationBackingBean.managedBean.taskName eq 'Specification Approval')  or (specificationBackingBean.managedBean.qt.specApprovalReq eq 'true' and specificationBackingBean.managedBean.ministryRemarksSize ge 1))}">

						<p:menuitem value="#{lbl['lbl.sc.approval']}"
							actionListener="#{specificationBackingBean.businessOwnerTabChange(4)}"
							update="@form" />
					</c:if>


				</p:tabMenu></td>
			<td width="80%;" valign="top"><c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '0'}">

					<ui:include src="/xhtml/sc/specification/businessOwner/businessOwnerGeneral.xhtml"></ui:include>

				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '1'}">

					<ui:include src="/xhtml/sc/specification/businessOwner/supplierQualificationCriteria.xhtml"></ui:include>
				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '2'}">
					<ui:include src="/xhtml/sc/specification/businessOwner/technicalSpecification.xhtml"></ui:include>

				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '3'}">
					<ui:include src="/xhtml/sc/specification/businessOwner/financialSpecification.xhtml"></ui:include>

				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '4'}">

					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.qt.specApprovalReq eq 'true'}">
						<ui:include src="/xhtml/sc/specification/businessOwner/approvalBusinessOwner.xhtml"></ui:include>

					</ui:fragment>

				</c:if></td>
		</tr>
	</table>

</ui:composition>
