<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.category.code.list.instruction']}"
			escape="false" />

		<p:dataTable id="openPnlId" var="cateGory" widgetVar="openCodes"
			value="#{specificationBackingBean.managedBean.suppCriteriaopenList}"
			rowIndexVar="index" rows="10"
			selection="#{specificationBackingBean.managedBean.suppCriteriaopenSelectList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" styleClass="td-check-box-spacing"></p:column>
			<p:column headerText="#{lbl['lbl.sc.category.code']}">
				#{cateGory.pmCategoryL1.categoryL1Code}#{cateGory.pmCategoryL2.categoryL2Code}#{cateGory.pmCategoryL3.categoryL3Code}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL1.categoryName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL2.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}"></h:outputText>
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				styleClass="BtnSpacing" process="@this,openPnlId"
				partialSubmit="true" update="@([id$=catCodePopup])"
				disabled="#{specificationBackingBean.managedBean.readOnly}"
				oncomplete="catCodePopup.show();"
				action="#{categoryCodeSearchBackingBean.renewSesionObject}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				styleClass="BtnSpacing" process="@this,openPnlId"
				partialSubmit="true"
				oncomplete="supplierOpencategoryDeletePopUp.show();"
				update="@([id$=#{supplierOpencategoryDeleteId}])"
				disabled="#{specificationBackingBean.managedBean.readOnly}" />

		</div>
		<ui:param name="supplierOpencategoryDeleteId"
			value="supplierOpencategoryDeleteId"></ui:param>
		<ac:confirmationPopup id="#{supplierOpencategoryDeleteId}"
			widget="supplierOpencategoryDeletePopUp"
			okAction="specificationBackingBean.deleteCategoryCodes" width="400"
			height="100" title="#{lbl['lbl.sc.category.code']}"
			content="#{lbl['lbl.sc.dialog.confirm.category.codes']}"
			update="@([id$=openPnlId])" />



		<ac:categoryCodePopup
			okAction="specificationBackingBean.addNewCategoryAction"
			update="@([id$=openPnlId])" />
	</p:panel>


	<p:panel
		rendered="#{((isQuotationThresHold and specificationBackingBean.managedBean.scQt.zonal =='false')  or (!isQuotationThresHold and specificationBackingBean.managedBean.scQt.zonal) or (!isQuotationThresHold and specificationBackingBean.managedBean.scQt.zonal =='false'))}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
		</f:facet>

		<table style="width: 100%">


			<h:panelGroup id="allstate" rendered="#{!isQuotationThresHold}">
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.all.states']}"
							style="width : 150px" /></td>
					<td><p:selectBooleanCheckbox
							disabled="#{specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.allStateCode.value() eq 'Peninsular' }"
							value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState}">
							<f:selectItem
								itemValue="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState}" />
							<p:ajax update="@form"
								listener="#{specificationBackingBean.stateChange}" />
						</p:selectBooleanCheckbox></td>
				</tr>
			</h:panelGroup>


			<p:outputPanel id="minPaidCapital">
				<ui:fragment
					rendered="#{!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState eq 'true'}">
					<tr>
						<td style="width: 199px"><p:outputLabel
								value="#{lbl['lbl.sc.paidup']}"
								rendered="#{!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState eq 'true'}" /></td>
						<td><p:inputText size="30" maxlength="18"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								rendered="#{!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState eq 'true'}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
				</ui:fragment>
			</p:outputPanel>
		</table>

	</p:panel>

	<h:panelGroup>
		<h:panelGroup id="supplierallStae">


			<h:panelGroup
				rendered="#{((isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal))}">
				<table style="width: 100%">
					<tr>
						<td style="width: 199px"><p:outputLabel
								value="#{lbl['lbl.sc.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								rendered="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'}"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locLevels"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								label="#{lbl['lbl.sc.location.level']}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width:250px;">

								<f:selectItems
									value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change" update="zoneLocationDataTable"
									process="@this" partialSubmit="true"
									listener="#{specificationBackingBean.selectSupplierLocation}" />
							</p:selectOneMenu> <p:message id="withOutzone" for="locLevels" display="icon"></p:message>
						</td>
					</tr>
				</table>
			</h:panelGroup>
			<p:spacer height="20"></p:spacer>
			<h:panelGroup
				rendered="#{((isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and !specificationBackingBean.managedBean.scQt.zonal) or (!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal))}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneLocationDataTable" rows="10"
						value="#{specificationBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						rowKey="#{zoneTree}">

						<ac:paginator for="zoneLocationDataTable" />

						<p:column style="width:90%">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{specificationBackingBean.selectLocationTreeNode}" />
								<p:ajax event="unselect"
									listener="#{specificationBackingBean.unSelectLocationTreeNode}" />
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.action']}"
							style="width:10%;text-align: center;">
							<p:commandLink
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								actionListener="#{specificationBackingBean.editSupplierLocations(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<h:graphicImage value="/css/images/design/edit.png" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
				</h:panelGrid>
				<div align="right">
					<p:selectBooleanCheckbox id="checkAll"
						style="float:left;margin-top: 13px;margin-right: -4px;">
						<p:ajax event="change" partialSubmit="true" process="@all"
							update="zoneLocationDataTable"
							listener="#{specificationBackingBean.checkAllConditions}" />
					</p:selectBooleanCheckbox>
					<p:spacer width="1" />
					<h:outputText value="#{lbl['lbl.sc.spec.check.all']}"
						style="float:left;margin-top: 12px;;margin-left: 10px;" />
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						styleClass="BtnSpacing" update="@([id$=zonePopupPanel])"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						actionListener="#{specificationBackingBean.showSupplierLocationPopup}" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						styleClass="BtnSpacing" process="@this,zoneLocationDataTable"
						partialSubmit="true"
						oncomplete="supplierNonZoneDeletePopUp.show();"
						update="@([id$=#{supplierNonZoneDeleteId}])"
						disabled="#{specificationBackingBean.managedBean.readOnly}" />
				</div>
				<ui:param name="supplierNonZoneDeleteId"
					value="supplierNonZoneDeleteId"></ui:param>
				<ac:confirmationPopup id="#{supplierNonZoneDeleteId}"
					widget="supplierNonZoneDeletePopUp"
					okAction="specificationBackingBean.deleteSupplierQualificationTreeNode"
					width="400" height="100"
					title="#{lbl['lbl.sc.location.list.paidup.capital']}"
					content="#{lbl['lbl.sc.dialog.confirm.supplier.locations']}"
					update="@([id$=zoneLocationDataTable])" />

			</h:panelGroup>


			<p:panel
				rendered="#{isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
				</f:facet>
				<table style="width: 100%">
					<tr>
						<td style="width: 199px"><p:outputLabel
								value="#{lbl['lbl.sc.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								rendered="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'}"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locZoneLevels"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width:250px;">
								<f:selectItems
									value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change" update="zoneyesDataTable" process="@this"
									partialSubmit="true"
									listener="#{specificationBackingBean.selectSupplierLocation}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>
			<p:spacer height="20"></p:spacer>

			<h:panelGroup
				rendered="#{isQuotationThresHold and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal}">

				<h:panelGrid width="100%">
					<p:dataTable id="zoneyesDataTable" rows="10"
						value="#{specificationBackingBean.managedBean.zoneTrees}"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						var="zoneTree" style="width:100%" rowIndexVar="index">

						<ac:paginator for="zoneyesDataTable" />

						<p:column style="width:90%;">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{specificationBackingBean.selectZoneTreeNode}" />
								<p:ajax event="unselect"
									listener="#{specificationBackingBean.unSelectZoneTreeNode}" />

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.action']}"
							style="width:10%;text-align: center;">
							<p:commandLink
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								actionListener="#{specificationBackingBean.editSupplierLocations(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<h:graphicImage value="/css/images/design/edit.png" />
							</p:commandLink>
						</p:column>

					</p:dataTable>

				</h:panelGrid>
				<div align="right" style="width: 100%">
					<p:selectBooleanCheckbox id="checkAllZones"
						style="float:left;margin-top: 13px;margin-right: -4px;">
						<p:ajax event="change" partialSubmit="true" process="@all"
							update="zoneyesDataTable"
							listener="#{specificationBackingBean.checkAllConditions}" />
					</p:selectBooleanCheckbox>
					<p:spacer width="1" />
					<h:outputLabel value="#{lbl['lbl.sc.spec.check.all']}"
						style="float:left;margin-top: 12px;;margin-left: 10px;" />
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						styleClass="BtnSpacing" update="@([id$=zonePopupPanel])"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						actionListener="#{specificationBackingBean.showSupplierLocationPopup}" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						styleClass="BtnSpacing"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						process="@this,zoneyesDataTable" partialSubmit="true"
						oncomplete="supplierZonalDeletePopUp.show();"
						update="@([id$=#{supplierZonalDeleteId}])" />


				</div>
				<ui:param name="supplierZonalDeleteId" value="supplierZonalDeleteId"></ui:param>
				<ac:confirmationPopup id="#{supplierZonalDeleteId}"
					widget="supplierZonalDeletePopUp"
					okAction="specificationBackingBean.deleteSupplierQualificationTreeNode"
					width="400" height="100"
					title="#{lbl['lbl.sc.location.list.paidup.capital']}"
					content="#{lbl['lbl.sc.dialog.confirm.supplier.locations']}"
					update="@([id$=zoneyesDataTable])" />
			</h:panelGroup>

			<p:dialog header="#{lbl['lbl.sc.add.location']}"
				widgetVar="ZoneLocation" modal="true" width="490" position="top"
				height="410">
				<h:panelGroup id="zonePopupPanel">
					<table border="0">
						<tr>
							<td>#{lbl['lbl.sc.location']}</td>
						</tr>
						<TR>
							<TD width="80%">
								<div style="height: 300px; overflow-y: scroll;">
									<p:tree id="treeZoneLocationPopup"
										value="#{specificationBackingBean.managedBean.rootLocationTree}"
										var="location"
										selection="#{specificationBackingBean.managedBean.selectedNodes}"
										selectionMode="checkbox">
										<p:treeNode type="state">
											<h:outputText value="#{location.pmState.stateName}" />
										</p:treeNode>
										<p:treeNode type="division">
											<h:outputText value="#{location.pmDivision.divisionName}" />
										</p:treeNode>
										<p:treeNode type="district">
											<h:outputText value="#{location.pmDistrict.districtName}" />
										</p:treeNode>
										<p:treeNode type="city">
											<h:outputText value="#{pmCity.cityName}" />
										</p:treeNode>
									</p:tree>
								</div>
							</TD>
						</TR>
						<tr>
							<td><p:spacer height="1" /></td>
						</tr>
						<tr>
							<td>
								<div class="ppRightBtn">
									<p:selectBooleanCheckbox id="popupCheckAlls"
										style="float:left;margin-top: 13px;margin-right: -4px;"
										value="#{specificationBackingBean.managedBean.checkAllList}">
										<p:ajax event="change" partialSubmit="true" process="@all"
											update=":form:treeZoneLocationPopup"
											listener="#{specificationBackingBean.checkAllPopUpConditions(specificationBackingBean.managedBean.checkAllList)}" />
									</p:selectBooleanCheckbox>
									<p:spacer width="1" />
									<h:outputText value="#{lbl['lbl.sc.spec.check.all']}"
										style="float:left;margin-top: 12px;;margin-left: 10px;" />
									<p:commandButton value="#{lbl['lbl.btn.ok']}"
										styleClass="BtnSpacing" onclick="ZoneLocation.hide();"
										process="@all"
										update="@this, zoneLocationDataTable, zonePopupPanel, zoneyesDataTable"
										action="#{specificationBackingBean.updateSupplierLocations}">
									</p:commandButton>
									<p:commandButton value="#{lbl['lbl.btn.cancel']}"
										styleClass="BtnSpacing" onclick="ZoneLocation.hide();" />
								</div>
							</td>
						</tr>
					</table>
				</h:panelGroup>
			</p:dialog>
		</h:panelGroup>
	</h:panelGroup>

	<table>
		<tr>
			<td style="width: 193px"><p:outputLabel
					value="#{lbl['lbl.sc.totalsup']}" /></td>
			<td><p:inputText id="businessOwnerTotalSuppliers"
					style="margin-right:5px;text-align:right;" disabled="true"
					value="#{specificationBackingBean.managedBean.totalSuppliers}"
					size="30" /> <p:commandButton value="#{lbl['lbl.btn.search']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="businessOwnerTotalSuppliers"
					action="#{specificationBackingBean.searchForSupplierCount}"
					disabled="#{specificationBackingBean.managedBean.readOnly}"
					partialSubmit="true" process="@this" /></td>
		</tr>
	</table>
	<!-- <p:panelGrid columns="1" style="width:50%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton value="#{lbl['lbl.btn.search']}"
			style="float:right;" partialSubmit="true" />
	</p:panelGrid> -->
</ui:composition>
