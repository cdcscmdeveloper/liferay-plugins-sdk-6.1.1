<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup>
	
		<table width="100%">
			<tr>
				<td align="right"><ui:fragment
						rendered="#{specificationBackingBean.managedBean.taskName ne 'Specification Approval' and specificationBackingBean.managedBean.readOnly eq 'false'}">
						<p:commandButton
							value="#{lbl['lbl.sc.spec.back.search.panel.Item']}"
							style="float:left;" immediate="true" process="@this"
							partialSubmit="true" update="@([id$=panelItemGroupList])"
							action="#{specificationBackingBean.businessOwnerBackAction}" />

					</ui:fragment> <ui:repeat var="bpmAction"
						value="#{specificationBackingBean.managedBean.outComes}">
						<ui:fragment rendered="#{bpmAction ne '~'}">

							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								styleClass="ui-button" style="float:right;"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{specificationBackingBean.updateBpmTask(bpmAction)}" />
						</ui:fragment>
					</ui:repeat> <c:if
						test="#{specificationBackingBean.managedBean.taskName ne 'Specification Approval'}">
						<p:commandButton value="#{lbl['lbl.btn.save']}" update="@all"
						rendered="#{!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.assignedState}"
							style="float:right;" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{specificationBackingBean.saveSpecificationDtls}">

						</p:commandButton>
					</c:if></td>
			</tr>
		</table>

		<p:dialog id="reviceApprovalDlgs" widgetVar="reviceApprovalDlgs"
			header="#{lbl['lbl.sc.dialog.confirm.header.revise']}"
			resizable="false" width="500" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.spec.dialog.yesbtn.message']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviceApprovalDlgs.hide();"
					action="#{specificationBackingBean.reviseMinistrySpecApproval}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviceApprovalDlgs.hide();" type="button" />
			</div>
		</p:dialog>
	</h:panelGroup>

</ui:composition>
