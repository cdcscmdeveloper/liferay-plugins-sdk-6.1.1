<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.general.info']}" toggleable="true">

		<table style="width: 100%" border="0">
			<tr>
				<td valign="top" style="width: 300px;"><h:outputLabel
						value="#{lbl['lbl.sc.title']}" /></td>
				<td colspan="3"><p:inputTextarea readonly="true" rows="3"
						cols="143" style="margin-bottom:5px;width: 95%;"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"></p:inputTextarea></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td><p:inputText size="32"
						style="width:292px;margin-bottom:5px;"
						value="#{lbl[specificationBackingBean.managedBean.scQt.panel ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
						readonly="true"></p:inputText></td>


			</tr>
			<tr>

				<td><p:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="32"
						style="text-align:right;width:292px;" id="estPrice"
						required="true"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						label="#{lbl['lbl.sc.spec.est.price']}" maxlength="18"
						value="#{specificationBackingBean.managedBean.scQt.estimatedAmount}"
						readonly="#{specificationBackingBean.managedBean.readOnly}">

						<p:ajax event="blur" process="@this" partialSubmit="true"
							update="@form"
							listener="#{specificationBackingBean.setProcurementMode(specificationBackingBean.managedBean.scQt)}"></p:ajax>
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							maxIntegerDigits="14"></ac:validateNumber>

					</p:inputText> <p:message id="priceMsg" for="estPrice" display="icon" /></td>

			</tr>
			<ui:fragment
				rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount ne null and specificationBackingBean.managedBean.scQt.estimatedAmount gt 0}">
				<tr>
					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.scQt.ppPlan ne null and specificationBackingBean.managedBean.scQt.ppPlan.planNo ne null}">
						<td><h:outputLabel value=" #{lbl['lbl.sc.justification']}" /></td>
						<td colspan="3"><p:inputTextarea rows="3" cols="143"
								style="margin-bottom:5px;width: 80%;"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								maxlength="200"
								value="#{specificationBackingBean.managedBean.scQt.justificationRemark}"
								readonly="#{specificationBackingBean.managedBean.readOnly}"></p:inputTextarea>
							<ac:iconTooltip value="#{lbl['lbl.sc.justification.tooltip']}" /></td>
					</ui:fragment>

				</tr>



				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qttentype']}" /> <ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQt.panel eq 'No'}">
							<p:outputLabel value="*" styleClass="mandatory" />
						</ui:fragment></td>
					<td><ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQt.panel ne 'No'}">
							<p:selectOneMenu style="width:300px;margin-bottom:5px;"
								value="#{specificationBackingBean.managedBean.scQt.qtType}"
								disabled="true">
								<f:selectItems
									value="#{specificationBackingBean.retrieveParameterDescByType(ParameterTypeConst.quotationTenderType)}"
									var="parameter" itemLabel="#{parameter.codeName}"
									itemValue="#{parameter.pmParameter.parameterCode}" />

							</p:selectOneMenu>
						</ui:fragment> <ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQt.panel eq 'No'}">

							<p:selectOneRadio required="true" id="tenderType"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								label="#{lbl['lbl.sc.qttentype']}"
								value="#{specificationBackingBean.managedBean.scQt.qtType}">

								<f:selectItems
									value="#{specificationBackingBean.getQuotationTendervalues(ParameterTypeConst.quotationTenderType)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"
									update="@form"
									listener="#{specificationBackingBean.onChangeQtType}"></p:ajax>
							</p:selectOneRadio>
							<p:message id="tenderMsg" for="tenderType" display="icon" />
						</ui:fragment></td>
				</tr>

				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.procurment.type.category']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="procTypeBoCategory" required="true"
							value="#{specificationBackingBean.managedBean.scQt.procurementTypeCatId.parameterId}"
							style="margin-bottom:5px;width:300px;"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							label="#{lbl['lbl.sc.procurment.type.category']}">
							<f:selectItems
								value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementTypeCategory)}" />
							<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
						</p:selectOneMenu> <p:message id="procuremnttitleMsg" for="procTypeBoCategory"
							display="icon" /></td>

				</tr>
				<tr>
					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.scQt.qtType eq 'O' and specificationBackingBean.managedBean.scQt.panel eq 'No'}">
						<td><p:outputLabel value="#{lbl['lbl.sc.open.for']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneRadio required="true" id="openFor"
								disabled="#{specificationBackingBean.managedBean.readOnly }"
								label="#{lbl['lbl.sc.open.for']}"
								value="#{specificationBackingBean.managedBean.scQt.openFor}">
								<f:selectItems
									value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.scOpenFor)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"
									update="@form"
									listener="#{specificationBackingBean.openForChange}"></p:ajax>
							</p:selectOneRadio> <p:message id="openMsg" for="openFor" display="icon" /></td>
					</ui:fragment>
				</tr>


				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.evaluation.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><ui:fragment rendered="#{isOneTierThresHold}">
							<p:selectOneRadio
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.scQt.evaluationType}">
								<f:selectItems
									value="#{specificationBackingBean.managedBean.evaluationTypeItem}" />
								<p:ajax event="change" process="@this" partialSubmit="true"
									update="@form"></p:ajax>
							</p:selectOneRadio>
						</ui:fragment> <ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount eq null or !isOneTierThresHold}">
							<table>
								<tr>
									<td><p:selectOneRadio required="true" id="evalType"
											disabled="#{specificationBackingBean.managedBean.readOnly}"
											label=" #{lbl['lbl.sc.evaluation.type']}"
											value="#{specificationBackingBean.managedBean.scQt.evaluationType}">
											<f:selectItems
												value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.scEvaluationType)}" />
											<p:ajax event="change" process="@this" partialSubmit="true"
												update="@form"
												listener="#{specificationBackingBean.evaluationTypeChange}"></p:ajax>

										</p:selectOneRadio></td>
									<td><p:message id="evalMsg" for="evalType" display="icon" /></td>
									<td style="margin-top: -3px"><ac:iconTooltip
											value="#{lbl['lbl.sc.evaluation.type.tooltip']}" /></td>
								</tr>
							</table>
						</ui:fragment></td>
				</tr>
				<tr>
					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.scQt.evaluationType eq '1'}">
						<td style="width: 270px;"><p:outputLabel
								value="#{lbl['lbl.sc.spec.requir.tech.eval']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>

						<td>
							<table>
								<tr>
									<td><p:selectOneRadio id="techEvaluation" required="true"
											disabled="#{specificationBackingBean.managedBean.readOnly}"
											label="#{lbl['lbl.sc.spec.requir.tech.eval']}"
											value="#{specificationBackingBean.managedBean.scQt.techEvaluationReq}">
											<f:selectItems
												value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
											<p:ajax event="change" process="@this" partialSubmit="true"
												listener="#{specificationBackingBean.techEvaluationReqChanged}"></p:ajax>
										</p:selectOneRadio> <p:message id="reqTechEval" for="techEvaluation"
											display="icon"></p:message></td>
									<td style="margin-top: -3px"><ac:iconTooltip
											value="#{lbl['lbl.sc.spec.requir.tech.eval.tooltip']}" /></td>
								</tr>
							</table>
						</td>
					</ui:fragment>
				</tr>
				<tr>
					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.scQt.qtType eq 'O'}">
						<td><h:outputLabel value="#{lbl['lbl.sc.qt.zone.location']}" /></td>
						<td>
							<table>
								<tr>
									<td><p:selectOneRadio
											disabled="#{specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.scQt.panel ne 'No'}"
											value="#{specificationBackingBean.managedBean.scQt.zonal}">
											<f:selectItems
												value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />

											<p:ajax event="change" partialSubmit="true"
												update="generalLocationList" process="@this"
												listener="#{specificationBackingBean.zoneRadioChange}"></p:ajax>
										</p:selectOneRadio></td>
									<td style="margin-top: -3px"><ac:iconTooltip
											value="#{lbl['lbl.sc.qt.zone.location.tooltip']}" /></td>
								</tr>
							</table>
						</td>
					</ui:fragment>
				</tr>
				<tr>
					<td style="white-space: nowrap;"><p:outputLabel
							value="#{lbl['lbl.sc.spec.complete.period']}" escape="false" />
						<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><p:inputMask id="contractBo" required="true" size="32"
							mask="9?99" placeHolder="" maxlength="3"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							label="#{lbl['lbl.sc.spec.complete.period']}"
							value="#{specificationBackingBean.managedBean.scQt.contractDuration}"
							style="text-align:right;margin-bottom:5px;width:292px;">
							<p:ajax event="change" process="@this" partialSubmit="true" />
						</p:inputMask> <p:message id="completionBo" for="contractBo" display="icon"></p:message></td>
				</tr>

				<tr>

					<td><p:outputLabel
							value="#{lbl['lbl.sc.procurement.category']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="procCategory" required="true"
										style="margin-bottom:5px;width:303px;"
										disabled="#{specificationBackingBean.managedBean.readOnly}"
										label="#{lbl['lbl.sc.procurement.category']}"
										value="#{specificationBackingBean.managedBean.scQt.pmProcurementCategory.parameterId}">
										<f:selectItems
											value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
										<p:ajax event="change"
											listener="#{specificationBackingBean.procurementChange}"></p:ajax>
									</p:selectOneMenu> <p:message id="titleMsg" for="procCategory" display="icon" />
								</td>
								<td style="margin-top: -3px"><ac:iconTooltip
										value="#{lbl['lbl.sc.procurement.category.tooltip']}" /></td>
							</tr>
						</table>
					</td>
				</tr>

				<tr>
					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.scQt.specApprovalReq}">
						<td><p:outputLabel
								value="#{lbl['lbl.sc.ministry.spec.secretary']}" /></td>
						<td><p:inputText size="32"
								style="margin-bottom:5px;width:292px;"
								value="#{lbl[specificationBackingBean.managedBean.scQt.specApprovalReq ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
								readonly="true"></p:inputText></td>
					</ui:fragment>
				</tr>

			</ui:fragment>
		</table>

	</p:panel>

	<h:panelGroup id="generalLocationList">
		<p:panel header="#{lbl['lbl.sc.qt.zone.location.info']}" toggleable="true"
			rendered="#{(specificationBackingBean.managedBean.scQt.qtType eq 'O' and specificationBackingBean.managedBean.scQt.panel eq 'No' and specificationBackingBean.managedBean.scQt.zonal !='false' and specificationBackingBean.managedBean.scQt.estimatedAmount ne null and specificationBackingBean.managedBean.scQt.estimatedAmount gt 0)}">
			<table style="width: 100%">
				<tr>
					<td style="width: 300px"><p:outputLabel
							value="#{lbl['lbl.sc.zone.location.level']}" /> <p:outputLabel
							value="*" styleClass="mandatory"></p:outputLabel></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="locationLevels" required="true"
										disabled="#{specificationBackingBean.managedBean.readOnly}"
										label="#{lbl['lbl.sc.zone.location.level']}"
										value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel.parameterId}"
										style="width: 303px;">

										<f:selectItems
											value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
										<p:ajax event="change" update="generalLocationList"
											listener="#{specificationBackingBean.selectZoneLocationLevel}"></p:ajax>
									</p:selectOneMenu> <p:message id="withzone" for="locationLevels" display="icon"></p:message>
								</td>
								<td style="margin-top: -3px"><ac:iconTooltip
										value="#{lbl['lbl.sc.zone.location.level.tooltip']}" /></td>
							</tr>
						</table>
					</td>

				</tr>
			</table>


			<h:panelGroup
				rendered="#{specificationBackingBean.managedBean.scQt.qtType eq 'O' and specificationBackingBean.managedBean.scQt.panel eq 'No' and specificationBackingBean.managedBean.scQt.zonal !='false' and specificationBackingBean.managedBean.scQt.estimatedAmount ne null and specificationBackingBean.managedBean.scQt.estimatedAmount gt 0}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneGeneralDataTable" rows="10"
						value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						rowKey="#{zoneTree}">

						<p:column style="width:250%;">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.zone.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{specificationBackingBean.selectZoneTreeNode}" />
								<p:ajax event="unselect"
									listener="#{specificationBackingBean.unSelectZoneTreeNode}" />

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
							</p:tree>
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.action']}"
							style="width:10%;text-align: center;">
							<p:commandLink
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								actionListener="#{specificationBackingBean.editZones(zoneTree,index)}"
								process="@this" update="@([id$=dlgId])"
								oncomplete="ZoneGeneral.show();">
								<h:graphicImage value="/css/images/design/edit.png" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
				<div align="right" style="width: 100%">
					<p:selectBooleanCheckbox id="checkAllZonesList"
						style="float:left;margin-top: 13px;margin-right: -4px;">
						<p:ajax event="change" partialSubmit="true" process="@all"
							update="zoneGeneralDataTable"
							listener="#{specificationBackingBean.checkAllZoneGeneral}" />
					</p:selectBooleanCheckbox>
					<p:spacer width="1" />
					<h:outputText value="#{lbl['lbl.sc.spec.check.all']}"
						style="float:left;margin-top: 12px;;margin-left: 10px;" />
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						styleClass="BtnSpacing" update="@([id$=zonePopupGeneral])"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						actionListener="#{specificationBackingBean.showGeneralZonesPopup}" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"
						styleClass="BtnSpacing" partialSubmit="true"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						oncomplete="zonesNonpanelDeletePopUp.show();"
						update="@([id$=#{zonesNonpanelDeleteId}])" />
				</div>
				<ui:param name="zonesNonpanelDeleteId" value="zonesNonpanelDeleteId"></ui:param>
				<ac:confirmationPopup id="#{zonesNonpanelDeleteId}"
					widget="zonesNonpanelDeletePopUp"
					okAction="specificationBackingBean.deleteTreeNode" width="400"
					height="100" title="#{lbl['lbl.sc.qt.zone.location.info']}"
					content="#{lbl['lbl.sc.dialog.confirm.zones.delete']}"
					update="@([id$=zoneGeneralDataTable])" />
			</h:panelGroup>
		</p:panel>
	</h:panelGroup>
	<p:dialog id="dlgId" header="#{lbl['lbl.sc.add.location']}"
		widgetVar="ZoneGeneral" modal="true" width="520" position="top"
		height="410">
		<p:messages id="specBusinessOwnerZonemessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<h:panelGroup id="zonePopupGeneral">
			<table styleClass="noBorders tr,noBorders td" border="0">
				<TR>
					<td style="width: 35%" valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.zone.name']}"></p:outputLabel> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td style="width: 65%">
						<table>
							<tr>
								<td><p:inputText size="50" id="zoneNameId"
										label="#{lbl['lbl.sc.zone.name']}" maxlength="50"
										required="#{specificationBackingBean.managedBean.zoneLocation}"
										value="#{specificationBackingBean.managedBean.zoneName}"></p:inputText></td>
								<td><p:message id="zoneNameMsg" for="zoneNameId"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</TR>
				<TR>
					<TD valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.location']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></TD>
					<TD>
						<div style="height: 300px; overflow-y: scroll;">
							<p:tree id="treeZoneGeneralPopup"
								value="#{specificationBackingBean.managedBean.rootZoanlTree}"
								var="location"
								selection="#{specificationBackingBean.managedBean.selectedGeneralTreeNodes}"
								selectionMode="checkbox">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
								<p:treeNode type="city">
									<h:outputText value="#{pmCity.cityName}" />
								</p:treeNode>
							</p:tree>
						</div>
					</TD>
				</TR>
				<TR>
					<TD></TD>
					<TD><p:selectBooleanCheckbox id="popupCheck"
							style="float:left;margin-top: 13px;margin-right: -4px;"
							value="#{specificationBackingBean.managedBean.checkAllList}">
							<p:ajax event="change" partialSubmit="true" process="@all"
								update=":form:treeZoneGeneralPopup"
								listener="#{specificationBackingBean.checkAllZoneGeneralPopUp(specificationBackingBean.managedBean.checkAllList)}" />
						</p:selectBooleanCheckbox> <p:spacer width="1" /> <h:outputText
							value="#{lbl['lbl.sc.spec.check.all']}"
							style="float:left;margin-top: 12px;;margin-left: 10px;" /> <p:commandButton
							value="#{lbl['lbl.btn.cancel']}" style="float:right;"
							styleClass="BtnSpacing" onclick="ZoneGeneral.hide();" />
						&#160;&#160; <p:commandButton value="#{lbl['lbl.btn.ok']}"
							style="float:right;" process="@all"
							update="@this, zoneGeneralDataTable,zonePopupGeneral"
							styleClass="BtnSpacing"
							action="#{specificationBackingBean.updateZoneGeneralLocation}">
						</p:commandButton></TD>
				</TR>
			</table>
		</h:panelGroup>

		<p:ajax event="close"
			listener="#{specificationBackingBean.closeListener}" />
	</p:dialog>


</ui:composition>
