<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="BankStatementScoring" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"></p:messages>

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				action="#{specificationBackingBean.acceptBankScore}">
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.criteriaType}"
					value="50" />

			</p:commandButton>




		</div>
		<p:spacer height="50"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea style="width: 100%;"
							value="#{specificationBackingBean.managedBean.scQtChecklist.title}"
							disabled="true" rows="2" cols="150"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.spec.bank.statement']}"
			toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value=" #{lbl['lbl.sc.spec.from.month']}"></p:outputLabel>
						<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><p:selectOneMenu
							value="#{specificationBackingBean.managedBean.fromMonth}">

							<f:selectItems value="#{specificationBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change"
								update="toDetailsUpdate,bankInfo,amountdetails"
								listener="#{specificationBackingBean.fromChange}"></p:ajax>
						</p:selectOneMenu> <p:selectOneMenu
							value="#{specificationBackingBean.managedBean.startYear}">

							<f:selectItem
								itemLabel="#{specificationBackingBean.managedBean.startYear}"
								itemValue="#{specificationBackingBean.managedBean.startYear}">
							</f:selectItem>
						</p:selectOneMenu></td>

					<td style="width: 40%"><p:outputLabel
							value="#{lbl['lbl.sc.spec.to.month']}"></p:outputLabel> <p:outputLabel
							value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><h:panelGroup id="toDetailsUpdate">

							<p:inputText readonly="true" 
								value="#{specificationBackingBean.managedBean.bankstmntTomonth}"></p:inputText>

							<p:inputText readonly="true"
								value="#{specificationBackingBean.managedBean.endYear}"></p:inputText>

						</h:panelGroup></td>
				</tr>
			</table>
			<h:panelGroup id="bankInfo">


			</h:panelGroup>
		</p:panel>

		<h:panelGroup id="amountdetails">
			<h:panelGrid columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.spec.total.amount']}"></h:outputLabel>
				<p:inputText disabled="true"
					value="#{specificationBackingBean.managedBean.totalAmount}"></p:inputText>
				<h:outputLabel value="#{lbl['lbl.sc.spec.avg.bank.statement']}"></h:outputLabel>
				<p:inputText disabled="true"
					value="#{specificationBackingBean.managedBean.totalAmountAvg}"></p:inputText>
			</h:panelGrid>
		</h:panelGroup>

		<p:panel header="#{lbl['lbl.sc.spec.score.avg.bank.statement']}"
			toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
							<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
							<p:ajax event="change" update="bankDetails"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>
			</table>

			<h:panelGroup id="bankDetails">
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

					<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
					<h:panelGroup id="bankGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
						<ui:param name="componentName" value="bankStatememt" />
						<ui:param name="scoringPnlId" value="bankStatememtId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.spec.score.avg.bank.statement']}"></ui:param>
						<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								oncomplete="scoreWidget.paginator.endLink.click();"
								actionListener="#{specificationBackingBean.addScoring(50)}"
								update="#{scoringPnlId}" icon="ui-icon-add" />
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
								icon="ui-icon-delete" process="@this,#{scoringPnlId}"
								partialSubmit="true"
								action="#{specificationBackingBean.deleteScoring(null)}"
								update="#{scoringPnlId}" />

						</div>
					</h:panelGroup>

				</p:panel>
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
							</td>
							<td><p:inputText id="bankStmtMaxScore" required="true"
									label="#{lbl['lbl.sc.spec.max.score']}" maxlength="18"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
								</p:inputText> <p:message id="bkStmtMaxScoreId" for="bankStmtMaxScore"
									display="icon"></p:message></td>
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>

		</p:panel>

	</ui:define>
</ui:composition>
