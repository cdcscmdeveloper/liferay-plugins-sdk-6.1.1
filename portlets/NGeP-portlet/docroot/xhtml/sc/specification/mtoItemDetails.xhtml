<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="#{lbl['lbl.sc.item.details']}" modal="true" width="800"
		height="400">
		<p:panel>

			<table>
				<tr>
					<td><h:outputLabel value="*Item" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
				<tr>
					<td><h:outputLabel value="*Packing Type" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
				<tr>
					<td><h:outputLabel value="*Cargo Type" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
				<tr>
					<td><h:outputLabel value="*IMO UN No" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
				<tr>
					<td><h:outputLabel value="*Volume Per Unit" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
				<tr>
					<td><h:outputLabel value="*Total Volume Quantity" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
				<tr>
					<td><h:outputLabel value="*Weight Per Unit" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
					<td><h:outputLabel value="*Weight Uom" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="*Total Weight Quantity" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="*Height(cm) Per Unit" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="*Length(cm) Per Unit" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="*Width(cm) Per Unit" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="*Dimension Per Unit(m3)" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="*Total Dimension(m3)" /></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
			</table>
		</p:panel>
		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			style="float:right;" onclick="stageTwoFinance.hide();"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			action="#{specificationBackingBean.addFinancialComplianceList}"
			oncomplete="stageTwoFinance.hide();" update="financeProposaltwo"></p:commandButton>


	</p:dialog>
</ui:composition>
