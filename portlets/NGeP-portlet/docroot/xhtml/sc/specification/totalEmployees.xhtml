<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="TotalEmployees" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true"></p:messages>
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				immediate="true"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				rendered="#{((specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION) or(!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
				style="float:right;"
				action="#{specificationBackingBean.saveCheckListScores}">
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.criteriaType}"
					value="21" />
			</p:commandButton>



		</div>
		
		<ui:include src="checklistHeader.xhtml" />
		
		<p:spacer height="20" />

		<p:panel header="#{lbl['lbl.sc.spec.total.num.employees']}">
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.spec.total.num.employees.instruction']}" escape="false" />
			
			<h:panelGrid columns="2">
				<p:selectOneRadio
					disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
					value="#{specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue.allEmployee}">
					<f:selectItem itemLabel="#{lbl['lbl.sc.spec.total.num.employees.for.this.project']}"
						itemValue="false"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.sc.spec.total.num.employees.for.all.employees']}" itemValue="true"></f:selectItem>
				</p:selectOneRadio>
				<ac:iconTooltip value="#{lbl['lbl.sc.spec.total.num.employees.tooltip']}" />
			</h:panelGrid>

			<!-- <p:spacer height="25"></p:spacer>

			<h:panelGrid columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.total.employees']}"></h:outputLabel>
				<p:inputText readonly="true"></p:inputText>
			</h:panelGrid> -->
		</p:panel>
		
		<p:panel id="technicalTotalEmployees"
			header="#{lbl['lbl.sc.scoring.tot.employees']}" toggleable="true"
			rendered="#{specificationBackingBean.managedBean.scQtChecklist.scoringReq}">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel> <ui:fragment
							rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
							<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
						</ui:fragment></td>
					<td><p:selectOneMenu required="true"
							disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
							label="#{lbl['lbl.sc.spec.asset.score.type']}"
							id="techTotalEmployeeAutoScore"
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
							<p:ajax event="change"
								update="totalEmployees,technicalTotalEmployees"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu> <p:message id="techTotalEmployeeAutoScoreMsg"
							for="techTotalEmployeeAutoScore" display="icon"></p:message></td>
					<td>
						<ac:iconTooltip value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
					</td>
				</tr>
			</table>
			<p:spacer height="5"></p:spacer>
			<h:panelGroup id="totalEmployees">
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">
					<ui:param name="scoringPnlGroupId" value="totalEmployeesId" />
					<h:panelGroup id="totalEmployeesGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
						<ui:param name="componentName" value="Employees" />
						<ui:param name="scoringPnlId" value="employessId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.scoring.tot.employees']}"></ui:param>
						<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.btn.add']}"
								disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								oncomplete="scoreWidget.paginator.endLink.click();"
								update="#{scoringPnlId}"
								actionListener="#{specificationBackingBean.addScoring(21)}" />
							<p:commandButton value="#{lbl['lbl.btn.delete']}"
								process="@this" partialSubmit="true"
								disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
								action="#{specificationBackingBean.markDeleteSelectedRowsAction(scoringList, specificationBackingBean.managedBean.toBeRemoveList)}"
								update="#{scoringPnlId}">
								<f:setPropertyActionListener
									target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
									value="#{false}" />
							</p:commandButton>
						</div>
					</h:panelGroup>
				</h:panelGroup>
				<p:spacer height="5"></p:spacer>
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<ui:fragment
									rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
									<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
								</ui:fragment></td>
							<td><p:inputText id="totalEmployeesScore" required="true"
									style="text-align:right;"
									disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
									label="#{lbl['lbl.sc.spec.max.score']}"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}"
									maxlength="18">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
								</p:inputText> <p:message id="techTotalEmployee" for="totalEmployeesScore"
									display="icon"></p:message></td>
						</tr>
					</table>
				</h:panelGroup>
			</h:panelGroup>
		</p:panel>

	</ui:define>
</ui:composition>
