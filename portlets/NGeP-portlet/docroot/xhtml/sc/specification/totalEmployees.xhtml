<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="Back" style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				actionListener="#{specificationBackingBean.acceptEmployeeScore}" />



		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="Title"></h:outputLabel></td>
					<td><p:inputTextarea value="#{specificationBackingBean.managedBean.scQtChecklist.title}" disabled="true" rows="2" cols="150"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="Total No Of Employees" toggleable="true">
			<h:panelGrid>
				<p:selectOneRadio value="#{specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue.allEmployee}">
					<f:selectItem itemLabel="Employees Involves In This Project"
						itemValue="0"></f:selectItem>
					<f:selectItem itemLabel="All Employees" itemValue="1"></f:selectItem>
				</p:selectOneRadio>
			</h:panelGrid>



			<h:panelGrid columns="2">
				<h:outputLabel value="Total Employees"></h:outputLabel>
				<p:inputText></p:inputText>
			</h:panelGrid>
		</p:panel>

		<p:panel>
			<h:panelGrid columns="2">
				<p:outputLabel value="Score Type"></p:outputLabel>
				<p:selectOneMenu
					value="#{specificationBackingBean.managedBean.checklistScoreType}">
					<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
					<p:ajax event="change" update="totalEmployees"
						listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
				</p:selectOneMenu>
			</h:panelGrid>
		</p:panel>
		<h:panelGroup id="totalEmployees">
			<p:panel
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">
				<ui:param name="scoringPnlGroupId" value="totalEmployeesId" />
				<h:panelGroup id="totalEmployeesGroupId">
					<ui:param name="scoringList"
						value="#{specificationBackingBean.managedBean.totalEmployeeScore}" />
						<ui:param name="selectionList"
						value="#{specificationBackingBean.managedBean.totalEmployeeSelectList}" />
					<ui:param name="componentName" value="Employees" />
					<ui:param name="scoringPnlId" value="employessId" />
					<ui:param name="scoringPnlName" value="Scoring For Total Employees"></ui:param>
					<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
							process="@this,#{scoringPnlId}" partialSubmit="true"
							oncomplete="scoreWidget.paginator.endLink.click();"
							update="#{scoringPnlId}" icon="ui-icon-add"
							actionListener="#{specificationBackingBean.addTotalEmployeeScoring}" />
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
							icon="ui-icon-delete"
							action="#{specificationBackingBean.deleteScoring}"
							update="#{scoringPnlId}" />
					</div>
				</h:panelGroup>
			</p:panel>
			<p:panel header="Scoring For Total Employees"
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
				<table>
					<tr>
						<td><p:outputLabel value="Max.Score"></p:outputLabel></td>
						<td><p:inputText
								value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}"></p:inputText>
						</td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>

	</ui:define>
</ui:composition>
