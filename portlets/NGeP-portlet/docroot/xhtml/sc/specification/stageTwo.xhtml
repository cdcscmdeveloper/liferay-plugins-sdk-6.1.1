	<p:panel header="#{lbl['lbl.sc.spec.stage2.details']}"

		<p:commandLink value="#{lbl['lbl.sc.spec.stage.proposal.checklist']}"></p:commandLink>
		<p:dataTable id="stageTwotechProposal" var="stageTwoTechnical"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			style="width:100%" rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.s2TechSelect}"
			rowKey="#{stageTwoTechnical}">
			<ac:paginator for="stageTwotechProposal" />
			<p:column selectionMode="multiple" style="text-align:center;" />
			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:30%">
				<ui:fragment rendered="#{stageTwoTechnical.title !=null}">
					<h:outputText value="#{stageTwoTechnical.title}" size="50" />
				</ui:fragment>
				<ui:fragment rendered="#{stageTwoTechnical.title ==null}">
					<p:inputText value="#{stageTwoTechnical.title}" size="50"></p:inputText>
				</ui:fragment>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}"
				style="width:20%">
				<h:outputText value="Specification"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.mandatory']}"
				style="width:10%">
				<p:selectOneMenu value="#{stageTwoTechnical.manditory}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItem itemLabel="Yes" itemValue="1" />
					<f:selectItem itemLabel="No" itemValue="0" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.weight.weight']}"
				style="width:10%">
				<p:selectOneMenu
					value="#{stageTwoTechnical.scQtWeightage.weightageTitle}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItems
						value="#{specificationBackingBean.managedBean.weightageTechnical}"
						var="weightage" itemValue="#{weightage.weightageTitle}"
						itemLabel="#{weightage.weightageTitle}" />
					<p:ajax event="change"
						listener="#{specificationBackingBean.handleS2TechChanged(stageTwoTechnical)}"
						partialSubmit="true" process="@this" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.score']}"
				style="width:10%">
				<ui:include src="/xhtml/sc/specification/scoring.xhtml" />
				<p:commandLink oncomplete="specScoring.show();return false;">
					<p:graphicImage library="ep/images/design" name="btn_add.png"
						value="/resources/ep/images/design/btn_add.png" />
					<f:setPropertyActionListener value="#{stageTwoTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}"
				style="width:10%">
				<p:inputText value="#{stageTwoTechnical.checklistSeq}"></p:inputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.temp.status']}"
				style="width:10%">
				<h:outputText value="InProgress"></h:outputText>

			</p:column>

					<f:selectItem itemLabel="Yes" itemValue="1" />

				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}"

				<p:commandLink oncomplete="uploadS2TechAdd.show();return false;"

			</p:column>

				style="width:5%">
				<p:inputText value="#{stageTwoTechnicalAdditional.checklistSeq}"></p:inputText>
			</p:column>
