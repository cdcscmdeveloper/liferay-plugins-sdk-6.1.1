<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<table style="border: 0px; width: 100%">
			<tr>
				<td width="100%"><p:messages id="speccreatemessages"
						showDetail="true" autoUpdate="true" closable="true" /> 
						<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
							style="float:left;" icon="ui-icon-back"
							update="@form"
							action="#{specificationBackingBean.businessOwnerBackAction}" />
						<div align="right">
						<p:commandButton
						value="#{lbl['lbl.btn.submit']}"
						icon="ui-icon-submit" action="#{specificationBackingBean.cancelQt}"/> 
						</div>
						<ui:include
						src="/xhtml/sc/presentationDemo/presentationDemoHeader.xhtml"></ui:include>
					<ui:include
						src="/xhtml/sc/specification/panelCentralContract.xhtml"></ui:include></td>

			</tr>

		</table>

	</ui:define>
</ui:composition>
