<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="stageTwoTech" modal="true" width="800"
		position="top"
		header="#{lbl['lbl.sc.spec.btn.standard.tech.check.list']} "
		height="500">
		<p:messages id="technicalChecklistPopup" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false" />
		<p:panel id="specCommitteeTechnicalChecklist">

			<p:dataTable id="compilencestageTwo" var="compilance" rows="10"
				value="#{specificationBackingBean.managedBean.stageTwoTechComplianceList}"
				editable="true"
				selection="#{specificationBackingBean.managedBean.stageTwoTechComplianceSelect}"
				rowKey="#{compilance.documentId}" rowIndexVar="index">
				<ac:paginator for="compilencestageTwo"></ac:paginator>
				<p:column selectionMode="multiple"
					style="width:2%;text-align:center;" />
				<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}">
					<h:outputText value="#{compilance.docName}"></h:outputText>
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
			style="float:right;" onclick="stageTwoTech.hide();"
			icon="ui-icon-cancel"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			oncomplete="technicalChecklist.paginator.endLink.click();"
			action="#{specificationBackingBean.stageTwoTechProposal}"
			update="stageTwotechProposal" icon="ui-icon-accept"></p:commandButton>


	</p:dialog>
</ui:composition>
