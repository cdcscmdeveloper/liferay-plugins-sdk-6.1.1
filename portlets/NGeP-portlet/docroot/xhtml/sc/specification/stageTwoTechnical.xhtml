<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="stageTwoTech" modal="true" width="800"
		position="top"
		header="#{lbl['lbl.sc.spec.btn.standard.check.list']} "
		height="500">
		<p:messages id="technicalChecklistPopup" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false" />
		<h:panelGroup id="specCommitteeTechnicalChecklist">

			<p:dataTable id="compilencestageTwo" var="compilance" rows="10"
				value="#{specificationBackingBean.managedBean.stageTwoTechComplianceList}"
				editable="true"
				selection="#{specificationBackingBean.managedBean.stageTwoTechComplianceSelect}"
				rowKey="#{compilance.documentId}" rowIndexVar="index">
				<ac:paginator for="compilencestageTwo"></ac:paginator>
				<p:column selectionMode="multiple"
					style="width:2%;text-align:center;" />
				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}">
					<h:outputText value="#{compilance.docName}"></h:outputText>
				</p:column>
			</p:dataTable>

		</h:panelGroup>
		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			style="float:right;" onclick="stageTwoTech.hide();"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			action="#{specificationBackingBean.addTechnicalComplianceList}"
			update="stageTwotechProposal"></p:commandButton>


	</p:dialog>
</ui:composition>
