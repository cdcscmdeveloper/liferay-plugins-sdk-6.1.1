<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="Back" style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />
		
			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" actionListener="#{specificationBackingBean.acceptWarrantyScore}"/>



		</div>
		
		<p:panel>
	<table>
	<tr>
	<td><h:outputLabel value="Title"></h:outputLabel>
	</td>
		<td><p:inputText disabled="true"></p:inputText>
	</td>
	</tr>
	</table>
	</p:panel>
		<p:panel header="Warranty" toggleable="true">
			<h:panelGrid columns="2">
				<h:outputLabel value="No Of Years Waranty"></h:outputLabel>
				<p:inputText></p:inputText>
			</h:panelGrid>
		</p:panel>
		<ui:param name="scoringPnlGroupId" value="employeesWarantyId" />
		<h:panelGroup id="warantyGroupId">
			<ui:param name="scoringList"
				value="#{specificationBackingBean.managedBean.warantyScore}" />
			<ui:param name="componentName" value="Waranty" />
			<ui:param name="scoringPnlId" value="warantyId" />
			<ui:param name="scoringPnlName" value="Scoring For Total Warranty"></ui:param>
			<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{scoringPnlId}" partialSubmit="true"
					update="#{scoringPnlId}" icon="ui-icon-add" actionListener="#{specificationBackingBean.addScoringWaranty}" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" update="#{scoringPnlId}" />

			</div>
		</h:panelGroup>


	</ui:define>
</ui:composition>
