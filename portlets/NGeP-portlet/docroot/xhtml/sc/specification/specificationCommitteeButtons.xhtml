<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		<ac:gpkiPopup
			textBeforeSign="#{specificationBackingBean.textBeforeSign}"
			postSignAction="#{specificationBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<ui:fragment
						rendered="#{((((!specificationBackingBean.managedBean.readOnly) and (specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION)) or (specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION)))}">
						<p:commandButton value="Save" update="@all"
							action="#{specificationBackingBean.saveSpecificationCommitteeDtls}">
							<f:setPropertyActionListener
								target="#{specificationBackingBean.managedBean.buttonOutCome}"
								value="save" />
						</p:commandButton>
					</ui:fragment>

					<ui:repeat var="bpmAction"
						value="#{specificationBackingBean.managedBean.outComes}">
						<ui:fragment rendered="#{bpmAction ne '~'}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								styleClass="ui-button" style="float:right;"
								action="#{specificationBackingBean.specCommitteBpmTask(bpmAction)}" />
						</ui:fragment>
					</ui:repeat>

				</p:column>
			</p:row>
		</p:panelGrid>

		<p:dialog id="reviceApprovalDlgs" widgetVar="reviceApprovalDlgs"
			header="Revice Confirmation" resizable="false" width="325"
			height="75" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="Are you sure to send for Revise?" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviceApprovalDlgs.hide();"
					action="#{specificationBackingBean.reviseSpecificationCommittee}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviceApprovalDlgs.hide();" type="button" />
			</div>
		</p:dialog>

	</p:panel>

</ui:composition>
