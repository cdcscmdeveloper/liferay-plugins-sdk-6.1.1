<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="Save" update="@all"
						action="#{specificationBackingBean.saveSpecificationCommitteeDtls}"
						icon="ui-icon-save">
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.buttonOutCome}"
							value="save" />
					</p:commandButton>


					<ui:repeat var="bpmAction"
						value="#{specificationBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
							styleClass="ui-button" style="float:right;"
							icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
							action="#{specificationBackingBean.updateSpecCommitteBpmTask(bpmAction)}" />
					</ui:repeat>

				</p:column>
			</p:row>
		</p:panelGrid>

	</p:panel>

</ui:composition>
