<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog widgetVar="zoneSelect" modal="true" width="500" height="500">
		<p:panel header="Zone">

			<p:tree id="supplierZoneSelect" var="location">
				<p:treeNode>
					<h:outputText value="#{location.locationName}" />
				</p:treeNode>
			</p:tree>

			<div align="right">
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
					style="float:right;" onclick="zoneSelect.hide();" process="@all"
					action="#{specificationBackingBean.updateSupplierLocations}">
				</p:commandButton>
				&#160;&#160;
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
					style="float:right;" onclick="zoneSelect.hide();" />

			</div>
		</p:panel>


	</p:dialog>
</ui:composition>
