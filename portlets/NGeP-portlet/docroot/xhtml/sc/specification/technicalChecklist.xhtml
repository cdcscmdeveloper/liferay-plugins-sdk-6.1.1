<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<p:panel id="techCommitteeChecklist"
		header="#{lbl['lbl.sc.spec.tech.check.list']}" toggleable="true">

		<p:dataTable id="stageTwotechProposal" var="stageTwoTechnical"
			widgetVar="technicalChecklist"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.s2TechSelect}"
			rowKey="#{stageTwoTechnical}">
			<ac:paginator for="stageTwotechProposal" />

			<p:column selectionMode="multiple" style="text-align:left;"
				rendered="#{stageTwoTechnical.manditory !='true'}" />
			<p:column style="text-align:left;"
				rendered="#{stageTwoTechnical.manditory =='true'}" />


			<p:column style="width:20%;white-space: normal;">

				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.stage.title']}" />
				</f:facet>
				<ui:fragment rendered="#{stageTwoTechnical.title == null}">
					<p:inputText required="true" id="techChecklistTitle"
						label="#{lbl['lbl.sc.spec.stage.title']}"
						value="#{stageTwoTechnical.title}" size="30" maxlength="100"></p:inputText>
					<p:message id="techChecklistId" for="techChecklistTitle"
						display="icon"></p:message>
				</ui:fragment>

				<ui:fragment rendered="#{stageTwoTechnical.title != null}">
					<h:outputText value="#{stageTwoTechnical.title}" size="30"></h:outputText>
				</ui:fragment>

			</p:column>


			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}"
				style="width:10%">
				<ui:fragment rendered="#{stageTwoTechnical.qtChecklistId ne null}">
					<h:outputText
						value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"></h:outputText>


				</ui:fragment>





				<ui:fragment rendered="#{stageTwoTechnical.qtChecklistId eq null}">
                
					<h:outputText
						value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"
						rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1}"></h:outputText>



				</ui:fragment>

				<ui:fragment
					rendered="#{index eq specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.title == null}">


					<p:selectOneMenu style="width:100px;"
						value="#{stageTwoTechnical.definationType.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.getTechnicalChecklIstDefValues(ParameterTypeConst.documentDefinitionType)}"></f:selectItems>
						<p:ajax event="change" process="@this" update="@(.sample#{index})"
							partialSubmit="true"
							listener="#{specificationBackingBean.typeChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
					</p:selectOneMenu>
				</ui:fragment>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.supplier.action']}"
				style="width:8%">
				<!--  <h:panelGroup id="supplier">  -->
				<ui:fragment
					rendered="#{index eq specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.title == null}">
					<p:selectOneMenu styleClass="sample#{index}" style="width:100px;"
						value="#{stageTwoTechnical.action.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.managedBean.technicalChecklistAction}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="stageTwotechProposal"
							listener="#{specificationBackingBean.checklistActionChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
					</p:selectOneMenu>
				</ui:fragment>

				<ui:fragment rendered="#{stageTwoTechnical.qtChecklistId eq null}">
					<h:outputText
						value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.action)}"
						rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 }"></h:outputText>

				</ui:fragment>


				<ui:fragment rendered="#{stageTwoTechnical.qtChecklistId ne null}">
					<h:outputText
						value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.action)}"></h:outputText>


				</ui:fragment>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.head']}"
				style="width:10%">
				<p:selectBooleanCheckbox styleClass="action#{index}"
					value="#{stageTwoTechnical.scoringReq}" disabled="true"
					rendered="#{stageTwoTechnical.action.parameterCode  ne 'O'}">

				</p:selectBooleanCheckbox>

				<p:selectBooleanCheckbox styleClass="action#{index}"
					value="#{stageTwoTechnical.scoringReq}"
					rendered="#{stageTwoTechnical.action.parameterCode eq 'O'}">

				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.specification.status']}"
				style="width:10%">
				<h:outputText
					value="#{specificationBackingBean.getStatusDescById(stageTwoTechnical.pmStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}"
				style="width:20%">

				<!-- <h:panelGroup id="document"> rendered="#{stageTwoTechnical.definationType.parameterId eq '184'}"-->
				<p:commandLink oncomplete="uploadDlg.show();return false;"
					styleClass="sample#{index}"
					rendered="#{stageTwoTechnical.definationType.parameterCode eq 'UP'}"
					update="stageTwotechProposal">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageTwoTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageTwoTechnical.scQtCheckListAttachment.fileName}"></h:outputText>
				<!-- 	</h:panelGroup> -->
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
				style="width:10%">

				<p:commandLink
					rendered="#{stageTwoTechnical.definationType.parameterCode eq 'TS' or stageTwoTechnical.definationType.parameterCode eq 'SD' or stageTwoTechnical.definationType.parameterCode eq 'WF'}"
					action="#{specificationBackingBean.technicalChecklistEditAction(index,stageTwoTechnical)}">

					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
					<f:setPropertyActionListener value="#{stageTwoTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />
				</p:commandLink>
				<!-- </h:panelGroup> -->
			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton
				value="#{lbl['lbl.sc.spec.btn.standard.check.list']}"
				process="@this" oncomplete="stageTwoTech.show();"
				actionListener="#{specificationBackingBean.stageTwoTechcompilenceList}"
				update="compilencestageTwo" />
			<p:commandButton value="Create Specification" process="@this"
				partialSubmit="true" oncomplete="createCommitteeSpec.show();"
				icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this,stageTwotechProposal"
				oncomplete="technicalChecklist.paginator.endLink.click();"
				action="#{specificationBackingBean.stageTwoTechnicalAddProposal}"
				update="@all,stageTwotechProposal" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete"
				action="#{specificationBackingBean.deleteS2Tech}"
				update="stageTwotechProposal" />

		</div>

		<ui:include src="stageTwoTechnical.xhtml" />
	</p:panel>

	<ui:include src="/xhtml/sc/main/createCommitteeTemplate.xhtml"></ui:include>

</ui:composition>
