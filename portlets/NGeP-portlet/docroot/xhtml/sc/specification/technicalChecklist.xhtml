<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<p:panel id="techCommitteeChecklist"
		header="#{lbl['lbl.sc.spec.tech.check.list']}" toggleable="true">

		<p:dataTable id="stageTwotechProposal" var="stageTwoTechnical" widgetVar="technicalChecklist"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			style="width:100%" rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.s2TechSelect}"
			rowKey="#{stageTwoTechnical}">
			<ac:paginator for="stageTwotechProposal" />

			<p:column selectionMode="multiple" style="text-align:left;"
				rendered="#{stageTwoTechnical.manditory !='true'}" />
			<p:column style="text-align:left;"
				rendered="#{stageTwoTechnical.manditory =='true'}" />


			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:30%">

				<ui:fragment rendered="#{stageTwoTechnical.title == null}">
					<p:inputText value="#{stageTwoTechnical.title}" size="50"></p:inputText>
				</ui:fragment>

				<ui:fragment rendered="#{stageTwoTechnical.title != null}">
					<h:outputText value="#{stageTwoTechnical.title}" size="50"></h:outputText>
				</ui:fragment>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}"
				style="width:20%">

				<h:outputText value="Specification"
					rendered="#{stageTwoTechnical.definationType.parameterId=='185'}"></h:outputText>


				<h:outputText value="System Defined"
					rendered="#{stageTwoTechnical.definationType.parameterId=='187'}"></h:outputText>


				<h:outputText value="Upload"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.definationType.parameterId=='184'}"></h:outputText>


				<h:outputText value="Web Form"
					rendered="#{stageTwoTechnical.definationType.parameterId=='188'}"></h:outputText>




				<h:outputText value="Sample"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.definationType.parameterId=='1'}"></h:outputText>


				<h:outputText value="Presentation/Demo"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.definationType.parameterId=='2'}"></h:outputText>


			
				<ui:fragment
					rendered="#{index eq specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.title == null}">
				
					<p:selectOneMenu
						value="#{stageTwoTechnical.definationType.parameterId}">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItem itemLabel="Sample" itemValue="1" />
						<f:selectItem itemLabel="Upload" itemValue="184" />
						<f:selectItem itemLabel="Presentation/Demo" itemValue="2" />
						<p:ajax event="change" process="@this" update="@(.sample#{index})"
							partialSubmit="true"
							listener="#{specificationBackingBean.typeChange}"></p:ajax>
					</p:selectOneMenu>
				</ui:fragment>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.supplier.action']}"
				style="width:10%">
				<!--  <h:panelGroup id="supplier">  -->
				<ui:fragment rendered="#{index eq specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.title == null}">
					<p:selectOneMenu styleClass="sample#{index}"
						value="#{stageTwoTechnical.action.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.managedBean.technicalChecklistAction}" />
						<p:ajax event="change" process="@this"
							update=":form:businessSpecId:stageTwotechProposal"
							listener="#{specificationBackingBean.checklistActionChange}"></p:ajax>
					</p:selectOneMenu>
				</ui:fragment>


				<h:outputText value="Manual"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.action.parameterId eq '5'}"></h:outputText>


				<h:outputText value="View"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.action.parameterId eq '8'}"></h:outputText>


				<h:outputText value="Online Submit"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.action.parameterId eq '9'}"></h:outputText>


				<h:outputText value="Presentation/Demo"
					rendered="#{index lt specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 and stageTwoTechnical.action.parameterId eq '7'}"></h:outputText>





			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.head']}" style="width:10%">
				<p:selectBooleanCheckbox styleClass="action#{index}"
					value="#{stageTwoTechnical.scoringReq}" disabled="true"
					rendered="#{stageTwoTechnical.action.parameterId  ne '9'}">

				</p:selectBooleanCheckbox>

				<p:selectBooleanCheckbox styleClass="action#{index}"
					value="#{stageTwoTechnical.scoringReq}"
					rendered="#{stageTwoTechnical.action.parameterId eq '9'}">

				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.specification.status']}"
				style="width:10%">
				<h:outputText value="InProgress"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}"
				style="width:30%">
				<ui:include src="/xhtml/sc/specification/upload.xhtml" />
				<!-- <h:panelGroup id="document"> rendered="#{stageTwoTechnical.definationType.parameterId eq '184'}"-->
				<p:commandLink oncomplete="uploadDlg.show();return false;" styleClass="sample#{index}"
					rendered="#{stageTwoTechnical.definationType.parameterId eq '184'}"
					update="stageTwotechProposal">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageTwoTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageTwoTechnical.scQtCheckListAttachment.fileName}"></h:outputText>
				<!-- 	</h:panelGroup> -->
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
				style="width:10%">
				
				<p:commandLink  rendered="#{stageTwoTechnical.definationType.parameterId eq '185' or stageTwoTechnical.definationType.parameterId eq '187' or stageTwoTechnical.definationType.parameterId eq '188'}"
					action="#{specificationBackingBean.technicalChecklistEditAction(index,stageTwoTechnical)}">

					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
					<f:setPropertyActionListener value="#{stageTwoTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />
				</p:commandLink>
				<!-- </h:panelGroup> -->
			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton
				value="#{lbl['lbl.sc.spec.btn.standard.check.list']}"
				process="@this" oncomplete="stageTwoTech.show();"
				actionListener="#{specificationBackingBean.stageTwoTechcompilenceList}"
				update="compilencestageTwo" />
			<p:commandButton value="Create Specification" process="@this"
				partialSubmit="true" oncomplete="createCommitteeSpec.show();"
				icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this,stageTwotechProposal" oncomplete="technicalChecklist.paginator.endLink.click();"
				action="#{specificationBackingBean.stageTwoTechnicalAddProposal}"
				update="stageTwotechProposal" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete"
				action="#{specificationBackingBean.deleteS2Tech}"
				update="stageTwotechProposal" />

		</div>


	</p:panel>



</ui:composition>
