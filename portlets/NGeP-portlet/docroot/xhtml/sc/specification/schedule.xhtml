<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup id="frequency">
		<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
			toggleable="true"
			rendered="#{specificationBackingBean.managedBean.scQtSpec.fulfilmentType eq '117'}">
			<!-- <h:outputText value="#{specificationBackingBean.managedBean.scQtSpec.fulfilmentType}"></h:outputText> -->

			<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
				<h:outputLabel value="#{lbl['lbl.sc.spec.total.frequency']}"></h:outputLabel>
				<p:inputText
					value="#{specificationBackingBean.managedBean.totalFrequency}">
					<p:ajax event="blur" update="frequencySchedule"
						partialSubmit="false"
						listener="#{specificationBackingBean.addScheduleDetails}" />
				</p:inputText>

			</h:panelGrid>


			<p:commandLink value="#{lbl['lbl.sc.spec.freq.schedule']}"></p:commandLink>


			<p:dataTable id="frequencySchedule" var="frequency"
				style="width:100%" rowKey="#{frequency}" rowIndexVar="index"
				value="#{specificationBackingBean.managedBean.scheduleList}">
				<ac:paginator for="frequencySchedule" />

				<p:column headerText="#{lbl['lbl.sc.spec.schedule.no']}"
					style="width:40%">
					<p:inputText value="#{frequency.scheduleNo}"></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.start.month']}"
					style="width:25%">
					<p:calendar value="#{frequency.fromDate}" showOn="button"
						pattern="MM/yyyy"></p:calendar>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.end.month']}"
					style="width:25%">
					<p:calendar value="#{frequency.toDate}" showOn="button"
						pattern="MM/yyyy"></p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
					style="width:10%">
					<p:commandLink>

						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />

					</p:commandLink>

				</p:column>
			</p:dataTable>

			<p:spacer height="20"></p:spacer>

			<div align="right">

				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete" update="frequencySchedule" />

			</div>

		</p:panel>
	</h:panelGroup>
	<h:panelGroup id="progressive">
		<c:if
			test="#{specificationBackingBean.managedBean.scQtSpec.fulfilmentType ne '116' and specificationBackingBean.managedBean.scQtSpec.fulfilmentType !=null}">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true">

				<p:commandLink value="#{lbl['lbl.sc.spec.progressive.payment']}"></p:commandLink>
				<p:dataTable id="progressivePayment" var="payment"
					style="width:100%" rowKey="#{payment}" rowIndexVar="index"
					value="#{specificationBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />

					<p:column headerText="#{lbl['lbl.sc.spec.phase']}"
						style="width:20%">
						<p:inputText value="#{payment.phase}"></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.description']}"
						style="width:30%">
						<p:inputText value="#{payment.phase}"></p:inputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.from']}"
						style="width:15%">
						<p:calendar value="#{payment.fromDate}" showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.to']}"
						style="width:15%">
						<p:calendar value="#{payment.toDate}" showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.weight.percent']}"
						style="width:10%">
						<p:inputText value="#{payment.percentage}"></p:inputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
						style="width:10%">
						<p:commandLink>

							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />

						</p:commandLink>

					</p:column>

				</p:dataTable>

				<p:spacer height="20"></p:spacer>

				<div align="right">
					<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
						process="@this,progressivePayment" partialSubmit="true"
						icon="ui-icon-add" update="progressivePayment"
						actionListener="#{specificationBackingBean.addProgressiveDetails}" />
					<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
						icon="ui-icon-delete" update="progressivePayment" />

				</div>

			</p:panel>
		</c:if>
	</h:panelGroup>


</ui:composition>
