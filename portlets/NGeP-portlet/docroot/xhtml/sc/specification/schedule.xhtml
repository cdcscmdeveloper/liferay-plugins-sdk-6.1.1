<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:panel header="Sechedule Details" toggleable="true" >
		<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
			<h:outputLabel value="Schedule Type"></h:outputLabel>
			<p:selectOneRadio style="padding-right: 30px;" value="#{specificationBackingBean.managedBean.scheduleType}">
				<f:selectItem itemLabel="Frequency Schedule" itemValue="F" />
				<f:selectItem itemLabel="Progressive Payment" itemValue="P" />
               <p:ajax event="change" process="@this" partialSubmit="true" update="schedule"></p:ajax>
			</p:selectOneRadio>
			<h:outputLabel value="Total Schedule"></h:outputLabel>
		<p:inputText></p:inputText>
		</h:panelGrid>
	</p:panel>	
		<h:panelGrid id="schedule"  style="width:100%">
		<h:panelGroup rendered="#{specificationBackingBean.managedBean.scheduleType eq 'F'}">
		<p:commandLink value="Frequency Schedule"></p:commandLink>
		
		
		<p:dataTable id="frequencySchedule" var="frequency"  style="width:100%"
			rowKey="#{frequency}" rowIndexVar="index" rendered="#{specificationBackingBean.managedBean.scheduleType eq 'F'}">
			<ac:paginator for="frequencySchedule" />

			<p:column headerText="Schedule No"
				style="width:40%">
				
			</p:column>
			<p:column headerText="Start Date"
				style="width:30%">
				
			</p:column>
			
				<p:column headerText="End Date"
				style="width:30%">
				
			</p:column>

		</p:dataTable> 
			
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,frequencySchedule" partialSubmit="true"
				  icon="ui-icon-add"  update="frequencySchedule" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"  icon="ui-icon-delete"  update="frequencySchedule"/>

		</div>
		</h:panelGroup>
		<h:panelGroup rendered="#{specificationBackingBean.managedBean.scheduleType eq 'P'}">
		
		<p:commandLink value="Progressive Payment" ></p:commandLink>
         <p:dataTable id="progressivePayment" var="payment" style="width:100%"
			rowKey="#{payment}" rowIndexVar="index" rendered="#{specificationBackingBean.managedBean.scheduleType eq 'P'}">
			<ac:paginator for="progressivePayment" />

			<p:column headerText="Phase"
				style="width:20%">
				
			</p:column>
			<p:column headerText="Description"
				style="width:30%">
				
			</p:column>
			
				<p:column headerText="From"
				style="width:15%">
				
			</p:column>
			<p:column headerText="To"
				style="width:15%">
				
			</p:column>
			<p:column headerText="Percentage"
				style="width:20%">
				
			</p:column>

		</p:dataTable> 
			
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,progressivePayment" partialSubmit="true"
				  icon="ui-icon-add"  update="progressivePayment" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"  icon="ui-icon-delete"  update="progressivePayment"/>

		</div>
		</h:panelGroup>
		</h:panelGrid>
	


</ui:composition>
