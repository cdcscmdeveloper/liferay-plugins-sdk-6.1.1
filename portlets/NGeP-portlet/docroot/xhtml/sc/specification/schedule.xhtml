<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="frequency">

		<table border="0" cellspacing="0" cellpadding="0">
			<tr>
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS'}">
					<td width="150px"><h:outputLabel
							value="#{lbl['lbl.sc.periodic.fullfillent.type']}" /></td>
					<td><p:selectOneRadio
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{specificationBackingBean.managedBean.scQt.scheduleType}">
							<f:selectItem itemLabel="Frequency Schedule" itemValue="F"></f:selectItem>
							<f:selectItem itemLabel="Progressive Payment" itemValue="P"></f:selectItem>
							<p:ajax event="change" update="progressive,schedule"
								listener="#{specificationBackingBean.scheduleTypeChange}"></p:ajax>
						</p:selectOneRadio></td>
					<td style="margin-top: -3px"><ac:iconTooltip
							value="#{lbl['lbl.sc.periodic.fullfillent.type.tooltip']}" /></td>
				</h:panelGroup>
			</tr>
		</table>

		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' and  specificationBackingBean.managedBean.scQt.scheduleType eq 'F'}">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.freq.schedule.instruction']}"
					escape="false" />
				<table>
					<tr>
						<h:panelGroup
							rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' and  specificationBackingBean.managedBean.scQt.scheduleType eq 'F'}">
							<td><h:outputLabel
									value="#{lbl['lbl.sc.spec.total.frequency']}"></h:outputLabel></td>
							<td><p:inputText style="text-align:right;"
									disabled="#{specificationBackingBean.managedBean.readOnly}"
									value="#{specificationBackingBean.managedBean.totalFrequency}">
									<p:ajax event="blur" update="frequencySchedule"
										partialSubmit="true" process="@this"
										listener="#{specificationBackingBean.addScheduleDetails}" />
								</p:inputText></td>
						</h:panelGroup>
					</tr>
				</table>





				<p:dataTable id="frequencySchedule" var="frequency" rows="10"
					rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' and  specificationBackingBean.managedBean.scQt.scheduleType eq 'F'}"
					rowIndexVar="index"
					value="#{specificationBackingBean.managedBean.scheduleList}">
					<ac:paginator for="frequencySchedule" />

					<p:column style="width:40%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.schedule.no']}" />
						</f:facet>
						<p:inputText value="#{frequency.scheduleNo}" required="true"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							maxlength="3" label="#{lbl['lbl.sc.spec.schedule.no']}" size="5"
							id="scheduleNum">
							<p:ajax process="@this" partialSubmit="true"
								update="@this,frequencySchedule" />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="freqScheduledid" for="scheduleNum" display="icon"></p:message>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.start.month']}"
						style="width:10%">
						<p:selectOneMenu style="width:100px;"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{frequency.startMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="scheduleDetails,scheduleendMonth"
								listener="#{specificationBackingBean.calculateStartMonth(frequency)}"></p:ajax>
						</p:selectOneMenu>
						<!-- <p:calendar value="#{frequency.fromDate}" showOn="button"
						pattern="MM/yyyy"></p:calendar> -->
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.start.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{frequency.startYear}"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="scheduleDetails"
								listener="#{specificationBackingBean.calculateStartMonth(frequency)}"></p:ajax>
						</p:selectOneMenu>


					</p:column>

					<p:column headerText="#{lbl['lbl.sc.end.month']}" style="width:25%">
						<p:selectOneMenu style="width:100px;" id="scheduleendMonth"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{frequency.endMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails" process="@this"
								partialSubmit="true"
								listener="#{specificationBackingBean.calculateSchedulePercentage(frequency)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}" style="width:15%">
						<p:selectOneMenu value="#{frequency.endYear}"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails" process="@this"
								partialSubmit="true"
								listener="#{specificationBackingBean.calculateSchedulePercentage(frequency)}"></p:ajax>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.total.months']}"
						style="width:10%">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}"></h:outputText>
						</h:panelGroup>
					</p:column>

					<p:column style="width:15%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.schedule.type']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.schedule.type.tooltip']}" />
						</f:facet>

						<p:selectOneMenu style="width:120px;" required="true"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							id="scheduledTypeId" label="#{lbl['lbl.sc.schedule.type']}"
							value="#{frequency.scheduleType.parameterId}">

							<f:selectItems
								value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.scheduleType)}" />
							<p:message id="freqScheduledTypeId" for="scheduledTypeId"
								display="icon"></p:message>

						</p:selectOneMenu>

					</p:column>

				</p:dataTable>

				<p:spacer height="20"></p:spacer>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>
	<h:panelGroup id="progressive">
		<c:if
			test="#{specificationBackingBean.managedBean.fulfilmentType eq 'PA' or specificationBackingBean.managedBean.scQt.scheduleType eq 'P'}">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.progressive.payment.instruction']}"
					escape="false" />

				<table>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.sc.spec.total.phase']}"></h:outputLabel>
						</td>
						<td><p:inputText style="text-align:right;"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.totalProgressivePayment}">
								<p:ajax event="blur" update="progressivePayment"
									partialSubmit="true" process="@this"
									listener="#{specificationBackingBean.addProgressiveDetails}" />
							</p:inputText></td>
					</tr>

				</table>


				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index" rows="10"
					value="#{specificationBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />

					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.phase']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseNo}" required="true"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							label="#{lbl['lbl.sc.spec.phase']}" id="progressivePhase"
							maxlength="3" size="5">

							<p:ajax process="@this" partialSubmit="true"
								update="@this,progressivePayment" />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="phaseNumId" for="progressivePhase" display="icon"></p:message>
					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							required="true" id="progressivePhasedesc" style="width:100px;"
							label="#{lbl['lbl.sc.description']}">
							<p:ajax process="@this" partialSubmit="true"
								update="@this,progressivePayment" />
						</p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.start.month']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{payment.startMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="paymentEndMonth"
								listener="#{specificationBackingBean.calculateProgressiveStartMonth(payment)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.start.year']}"
						style="width:15%">

						<p:selectOneMenu value="#{payment.startYear}"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{specificationBackingBean.calculateProgressiveStartMonth(payment)}"></p:ajax>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="
								#{lbl['lbl.sc.end.month']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;" id="paymentEndMonth"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{payment.endMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}">
							</f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{specificationBackingBean.calculateProgressivepayment}"></p:ajax>
						</p:selectOneMenu>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}" style="width:15%">
						<p:selectOneMenu value="#{payment.endYear}"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{specificationBackingBean.calculateProgressivepayment}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.percentage']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							id="progressivePercentage" style="width:100px;"
							label="#{lbl['lbl.sc.percentage']}" maxlength="18">
							<p:ajax process="@this" partialSubmit="true"
								update="@this,progressivePayment" />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>





				</p:dataTable>

				<p:spacer height="20"></p:spacer>



			</p:panel>
		</c:if>
	</h:panelGroup>


</ui:composition>
