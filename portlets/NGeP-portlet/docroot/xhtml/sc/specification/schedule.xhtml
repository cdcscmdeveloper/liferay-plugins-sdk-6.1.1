<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="frequency">

		<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50"
			rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS'}">
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.scQt.scheduleType}">
				<f:selectItem itemLabel="Frequency Schedule" itemValue="F"></f:selectItem>
				<f:selectItem itemLabel="Progressive Payment" itemValue="P"></f:selectItem>
				<p:ajax event="change" update="progressive,schedule"
					listener="#{specificationBackingBean.scheduleTypeChange}"></p:ajax>
			</p:selectOneRadio>

		</h:panelGrid>
		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' and  specificationBackingBean.managedBean.scQt.scheduleType eq 'F'}">


				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50"
					rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' and  specificationBackingBean.managedBean.scQt.scheduleType eq 'F'}">
					<h:outputLabel value="#{lbl['lbl.sc.spec.total.frequency']}"></h:outputLabel>
					<p:inputText
						value="#{specificationBackingBean.managedBean.totalFrequency}">
						<p:ajax event="blur" update="frequencySchedule"
							partialSubmit="true" process="@this"
							listener="#{specificationBackingBean.addScheduleDetails}" />
					</p:inputText>

				</h:panelGrid>





				<p:dataTable id="frequencySchedule" var="frequency"
					rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' and  specificationBackingBean.managedBean.scQt.scheduleType eq 'F'}"
					rowIndexVar="index"
					value="#{specificationBackingBean.managedBean.scheduleList}">
					<ac:paginator for="frequencySchedule" />

					<p:column style="width:40%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.schedule.no']}" />
						</f:facet>
						<p:inputText value="#{frequency.scheduleNo}" required="true"
							maxlength="3" label="#{lbl['lbl.sc.spec.schedule.no']}" size="5"
							id="scheduleNum">
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="freqScheduledid" for="scheduleNum" display="icon"></p:message>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.start.month']}"
						style="width:10%">
						<p:selectOneMenu style="width:100px;"
							value="#{frequency.startMonth}">

							<f:selectItems value="#{specificationBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change"
								listener="#{specificationBackingBean.calculateStartMonth}"></p:ajax>
						</p:selectOneMenu>
						<!-- <p:calendar value="#{frequency.fromDate}" showOn="button"
						pattern="MM/yyyy"></p:calendar> -->
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.spec.freq.schedule.start.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{frequency.startYear}"
							style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
						</p:selectOneMenu>


					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.end.month']}"
						style="width:25%">
						<p:selectOneMenu style="width:100px;"
							value="#{frequency.endMonth}">

							<f:selectItems value="#{specificationBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								listener="#{specificationBackingBean.calculateSchedulePercentage(frequency)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.freq.schedule.end.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{frequency.endYear}" style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
						</p:selectOneMenu>


					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.spec.freq.schedule.total.months']}"
						style="width:10%">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}"></h:outputText>
						</h:panelGroup>
					</p:column>

					<p:column style="width:15%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.ct.fulfilment.type']}" />
						</f:facet>

						<p:selectOneMenu style="width:120px;" required="true"
							id="scheduledTypeId" label="#{lbl['lbl.ct.fulfilment.type']}"
							value="#{frequency.scheduleType.parameterId}">

							<f:selectItems
								value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.scheduleType)}" />
							<p:message id="freqScheduledTypeId" for="scheduledTypeId"
								display="icon"></p:message>

						</p:selectOneMenu>

					</p:column>

				</p:dataTable>

				<p:spacer height="20"></p:spacer>


			</p:panel>
		</h:panelGroup>
	</h:panelGroup>
	<h:panelGroup id="progressive">
		<c:if
			test="#{specificationBackingBean.managedBean.fulfilmentType eq 'PA' or specificationBackingBean.managedBean.scQt.scheduleType eq 'P'}">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:outputLabel value="#{lbl['lbl.sc.spec.total.phase']}"></h:outputLabel>
					<p:inputText
						value="#{specificationBackingBean.managedBean.totalProgressivePayment}">
						<p:ajax event="blur" update="progressivePayment"
							partialSubmit="true" process="@this"
							listener="#{specificationBackingBean.addProgressiveDetails}" />
					</p:inputText>

				</h:panelGrid>


				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index"
					value="#{specificationBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />

					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.phase']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseNo}" required="true"
							label="#{lbl['lbl.sc.spec.phase']}" id="progressivePhase"
							maxlength="3" size="5">
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="phaseNumId" for="progressivePhase" display="icon"></p:message>
					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50"
							required="true" id="progressivePhasedesc" style="width:100px;"
							label="#{lbl['lbl.sc.spec.description']}"></p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.from']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;"
							value="#{payment.startMonth}">

							<f:selectItems value="#{specificationBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change"
								listener="#{specificationBackingBean.calculateProgressiveStartMonth}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.spec.freq.schedule.start.year']}"
						style="width:15%">

						<p:selectOneMenu value="#{payment.startYear}" style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.to']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;" value="#{payment.endMonth}">

							<f:selectItems value="#{specificationBackingBean.yearDetails}">
							</f:selectItems>
							<p:ajax event="change"
								listener="#{specificationBackingBean.calculateProgressivepayment}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.freq.schedule.end.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{payment.endYear}" style="width:100px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.weight.percent']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true"
							id="progressivePercentage" style="width:100px;"
							label="#{lbl['lbl.sc.spec.weight.percent']}" maxlength="18">
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>





				</p:dataTable>

				<p:spacer height="20"></p:spacer>



			</p:panel>
		</c:if>
	</h:panelGroup>


</ui:composition>
