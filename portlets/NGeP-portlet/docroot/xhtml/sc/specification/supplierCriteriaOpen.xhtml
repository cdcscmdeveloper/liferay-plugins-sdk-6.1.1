<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>

		<ui:param name="categoryPnlGroupId" value="categoryopenGroupId" />
		<h:panelGroup id="categoryopenGroupId">
			<ui:param name="criteriaList"
				value="#{specificationBackingBean.managedBean.suppCriteriaopenList}" />
			<ui:param name="criteriaselectList"
				value="#{specificationBackingBean.managedBean.suppCriteriaopenList}" />
			<ui:param name="componentName" value="openCategory" />
			<ui:param name="criteriaPnlId" value="openCriteriaListId" />

			<td><ui:include
					src="/xhtml/sc/specification/categoryCodeList.xhtml" /></td>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{criteriaPnlId}" partialSubmit="true"
					update="#{criteriaPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete"
					action="#{specificationBackingBean.deleteScoring}"
					update="#{criteriaPnlId}" />

			</div>
		</h:panelGroup>

	</p:panel>

	<p:panel>

		<table style="width: 100%">

			<tr>
				<td style="width: 100px"><h:panelGroup id="allstate">
						<h:panelGrid border="0" cellpadding="0" cellspacing="0"
							columns="2" columnClasses="columnWidth20"
							style="margin-left: 26px;">
							<h:outputLabel value="#{lbl['lbl.so.allstate']}"
								style="width : 46px" />
							<p:selectBooleanCheckbox>
								<p:ajax />
							</p:selectBooleanCheckbox>
						</h:panelGrid>
					</h:panelGroup></td>
				<td></td>
			</tr>

			<tr>
				<td style="width: 100px"><p:outputLabel
						value="#{lbl['lbl.so.mullocal']}" /></td>
				<td><p:selectOneRadio style="margin-bottom:5px;">
						<f:selectItem itemLabel="yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
					</p:selectOneRadio></td>
			</tr>

		</table>

	</p:panel>



	<p:panel>
		<p:panel header="Location List">
			<table style="width: 100%">
				<tr>
					<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locLevels"
							value="#{specificationBackingBean.managedBean.qtCriteria.supplierLocation}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
						</p:selectOneMenu></td>
				</tr>
			</table>
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneLocationDataTable"
					value="#{specificationBackingBean.managedBean.zoneTrees}"
					var="zoneTree" style="width:65%">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location">
							<p:treeNode>
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column headerText="Action">
						<p:commandLink
							actionListener="#{specificationBackingBean.editZoneLocation(zoneTree)}"
							process="@this" update="@([id$=zonePopupPanel])"
							oncomplete="ZoneLocation.show();">
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 65%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
					process="@this" update="@([id$=zonePopupPanel])"
					oncomplete="ZoneLocation.show();"
					actionListener="#{specificationBackingBean.showZoneLocationPopup}"
					icon="ui-icon-add" />
			</div>
		</p:panel>
		<p:dialog header="" widgetVar="ZoneLocation" modal="true" width="800"
			height="500">
			<p:panel id="zonePopupPanel" header="ADD LOCATION">
				<table styleClass="noBorders tr,noBorders td">
					<TR>
						<TD width="20%" valign="top"><p:outputLabel value="Zone Name"></p:outputLabel>
						</TD>
						<TD width="80%"><p:inputText
								value="#{specificationBackingBean.managedBean.zoneName}"></p:inputText>
						</TD>
					</TR>
					<TR>
						<TD width="20%" valign="top"><p:outputLabel
								value="Zone Location" /></TD>
						<TD width="80%"><p:panel></p:panel> <p:tree
								id="treeZoneLocationPopup"
								value="#{specificationBackingBean.managedBean.rootLocationTree}"
								var="location"
								selection="#{specificationBackingBean.managedBean.selectedNodes}"
								selectionMode="checkbox">
								<p:treeNode>
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
							</p:tree></TD>
					</TR>
				</table>
			</p:panel>
			<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
				style="float:right;" onclick="ZoneLocation.hide();" process="@all"
				update="@this, zoneLocationDataTable,zonePopupPanel"
				action="#{specificationBackingBean.updateZoneLocation}">
			</p:commandButton>
				&#160;&#160;
		<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
				style="float:right;" onclick="ZoneLocation.hide();" />
		</p:dialog>
	</p:panel>
	<table style="width: 100%">
		<tr>
			<td style="width: 108px"><p:outputLabel
					value="#{lbl['lbl.so.paidup']}" /></td>
			<td><p:inputText
					value="#{specificationBackingBean.managedBean.qtCriteria.paidUpCaptial}"
					style="margin-right:5px;"
					disabled="true" /> <h:inputText
					value="MYR" disabled="true" size="1" /></td>
		</tr>
		<tr>
			<td style="width: 108px"><p:outputLabel value="Total Supplierrs" /></td>
			<td><p:inputText style="margin-right:5px;" disabled="true" /></td>
		</tr>
	</table>
	<p:panelGrid columns="1" style="width:50%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			icon="ui-icon-search" style="float:right;" partialSubmit="true" />
	</p:panelGrid>
</ui:composition>
