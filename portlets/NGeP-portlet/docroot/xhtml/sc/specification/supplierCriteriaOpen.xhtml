<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.sc.spec.category.code']}" />
		</f:facet>

		<p:dataTable id="openPnlId" var="cateGory" widgetVar="categoryCodes"
			value="#{specificationBackingBean.managedBean.suppCriteriaopenList}"
			rowIndexVar="index" styleClass="openPnlId"
			selection="#{specificationBackingBean.managedBean.suppCriteriaopenSelectList}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<ac:lov id="openPtj" lovId="PM_CATEGORY_L3" disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
					headerText="Category Lov"
					saveObject="specificationBackingBean.managedBean.suppCriteriaopenList[#{index}].pmCategoryL3"
					value="#{cateGory.pmCategoryL3.categoryL3Code}"
					update=":form:openPnlId">

				</ac:lov>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%;white-space: normal;">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%;white-space: normal;">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.mandatory']}"
				style="width:10%">
				<p:selectBooleanCheckbox value="#{cateGory.mandatory}"
					disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}">

				</p:selectBooleanCheckbox>
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this" update="openPnlId" icon="ui-icon-add"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
				actionListener="#{specificationBackingBean.addNewCategoryAction}" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete" process="@this,openPnlId" partialSubmit="true"
				action="#{specificationBackingBean.deleteCategoryCodes}"
				update="openPnlId"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}" />

		</div>
	</p:panel>


	<p:panel>

		<table style="width: 100%">

			<tr>
				<td style="width: 100px"><h:panelGroup id="allstate">
						<h:panelGrid border="0" cellpadding="0" cellspacing="0"
							columns="2" columnClasses="columnWidth20"
							style="margin-left: 26px;"
							rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000'}">
							<h:outputLabel value="#{lbl['lbl.so.allstate']}"
								style="width : 80px" />
							<p:selectBooleanCheckbox
								disabled="#{specificationBackingBean.managedBean.allStateCode eq '3' or specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState}">
								<f:selectItem
									itemValue="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState}"></f:selectItem>
								<p:ajax update="supplierallStae,minPaidCapital"
									listener="#{specificationBackingBean.stateChange}" />
							</p:selectBooleanCheckbox>
						</h:panelGrid>
					</h:panelGroup></td>
				<td></td>
			</tr>
			<p:outputPanel id="minPaidCapital">
				<tr>
					<td style="width: 150px"><p:outputLabel
							value="#{lbl['lbl.so.paidup']}"
							rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState eq 'true'}" /></td>
					<td><p:inputText size="30" maxlength="18"
							disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
							rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState eq 'true'}"
							value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
							style="margin-right:5px;text-align:right;">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}">
							</f:convertNumber>
						</p:inputText></td>
				</tr>

			</p:outputPanel>
		</table>

	</p:panel>

	<p:panel>
		<h:panelGroup id="supplierallStae">


			<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}"
				rendered="#{((specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal))}">
				<table style="width: 100%">
					<tr>
						<td style="width: 150px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"></f:convertNumber>
							</p:inputText></td>
					</tr>
					<tr>
						<td style="width: 145px"><p:outputLabel
								value="#{lbl['lbl.sc.spec.zone.location.level']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locLevels" required="true"
								disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
								label="#{lbl['lbl.sc.spec.zone.location.level']}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width: 178px;">

								<f:selectItems
									value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change"
									listener="#{specificationBackingBean.selectLocation}"></p:ajax>
							</p:selectOneMenu> <p:message id="withOutzone" for="locLevels" display="icon"></p:message>
						</td>
					</tr>
				</table>
			</p:panel>

			<p:panel
				rendered="#{((specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and !specificationBackingBean.managedBean.scQt.zonal) or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal))}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneLocationDataTable"
						value="#{specificationBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index"
						rowKey="#{zoneTree}"
						selection="#{specificationBackingBean.managedBean.supplierSelectedTreeNode}"
						selectionMode="single">
						<p:column headerText="Location" style="width:90%">
							<p:tree value="#{zoneTree}" var="location">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</p:column>

						<p:column headerText="Action" style="width:10%">
							<p:commandLink
								disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
								actionListener="#{specificationBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<p:graphicImage library="ep/images/design" name="edit.png"
									value="/resources/ep/images/design/edit.png" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
				</h:panelGrid>
				<div align="right">
					<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
						process="@this" update="@([id$=zonePopupPanel])"
						oncomplete="ZoneLocation.show();"
						disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
						actionListener="#{specificationBackingBean.showZoneLocationPopup}"
						icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
						update="zoneLocationDataTable" icon="ui-icon-delete"
						disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
						action="#{specificationBackingBean.deleteSupplierQualificationTreeNode}" />
				</div>
			</p:panel>


			<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}"
				rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal}">
				<table style="width: 100%">
					<tr>
						<td style="width: 150px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
								value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"></f:convertNumber>
							</p:inputText></td>
					</tr>

					<tr>
						<td style="width: 94px"><p:outputLabel
								value="#{lbl['lbl.sc.spec.zone.location.level']}" /></td>
						<td><p:selectOneMenu id="locZoneLevels" disabled="true"
								value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel.parameterId}"
								style="width: 178px;">

								<f:selectItems
									value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change"
									listener="#{specificationBackingBean.selectLocation}"></p:ajax>
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>


			<p:panel
				rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneyesDataTable"
						value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column headerText="Location" style="width:90%">
							<p:tree value="#{zoneTree}" var="location">

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>




							</p:tree>
						</p:column>



					</p:dataTable>
				</h:panelGrid>

			</p:panel>


			<p:dialog widgetVar="ZoneLocation" modal="true" width="600"
				position="top" height="400">
				<p:panel id="zonePopupPanel"
					header="#{lbl['lbl.sc.spec.zone.add.location']}">
					<table styleClass="noBorders tr,noBorders td">
						<TR>

							<TD width="80%"><p:panel></p:panel>
								<div style="height: 300px; overflow-y: scroll;">
									<p:tree id="treeZoneLocationPopup"
										value="#{specificationBackingBean.managedBean.rootLocationTree}"
										var="location"
										selection="#{specificationBackingBean.managedBean.selectedNodes}"
										selectionMode="checkbox">
										<p:treeNode type="state">
											<h:outputText value="#{location.pmState.stateName}" />
										</p:treeNode>
										<p:treeNode type="division">
											<h:outputText value="#{location.pmDivision.divisionName}" />
										</p:treeNode>
										<p:treeNode type="district">
											<h:outputText value="#{location.pmDistrict.districtName}" />
										</p:treeNode>
										<p:treeNode type="city">
											<h:outputText value="#{pmCity.cityName}" />
										</p:treeNode>
									</p:tree>
								</div></TD>
						</TR>

					</table>
				</p:panel>
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
					style="float:right;" onclick="ZoneLocation.hide();"
					icon="ui-icon-cancel" />
					&#160;&#160;
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
					style="float:right;" onclick="ZoneLocation.hide();" process="@all"
					update="@this, zoneLocationDataTable,zonePopupPanel"
					action="#{specificationBackingBean.updateZoneLocation}"
					icon="ui-icon-accept">
				</p:commandButton>


			</p:dialog>
		</h:panelGroup>
	</p:panel>



	<p:panel
		header="#{lbl['lbl.sc.spec.supplier.criteria.qual.suppliers']}">
		<table>
			<tr>
				<td style="width: 150px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.criteria.tot.suppliers']}" /></td>
				<td><p:inputText style="margin-right:5px;" disabled="true" />
					<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
						disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
						icon="ui-icon-search" partialSubmit="true" /></td>
			</tr>
		</table>
	</p:panel>
	<!-- <p:panelGrid columns="1" style="width:50%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			icon="ui-icon-search" style="float:right;" partialSubmit="true" />
	</p:panelGrid> -->
</ui:composition>
