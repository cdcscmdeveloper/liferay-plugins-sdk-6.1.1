<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">

		<p:dataTable id="openPnlId" var="cateGory"
			value="#{specificationBackingBean.managedBean.suppCriteriaopenList}"
			style="width:100%" rowIndexVar="index" styleClass="openPnlId"
			selection="#{specificationBackingBean.managedBean.suppCriteriaopenSelectList}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<ac:lov id="openPtj" lovId="PM_CATEGORY_L3"
					headerText="Category Lov"
					saveObject="specificationBackingBean.managedBean.suppCriteriaopenList[#{index}].pmCategoryL3"
					value="#{cateGory.pmCategoryL3.categoryL3Code}"
					update=":form:businessSpecId:openPnlId">

				</ac:lov>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.mandatory']}"
				style="width:10%">
				<p:selectBooleanCheckbox value="#{cateGory.mandatory}">

				</p:selectBooleanCheckbox>
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
				process="@this" partialSubmit="true" update="openPnlId"
				icon="ui-icon-add"
				actionListener="#{specificationBackingBean.addNewCategoryAction}" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
				icon="ui-icon-delete"
				action="#{specificationBackingBean.deleteScoring}"
				update="openPnlId" />

		</div>
	</p:panel>


	<p:panel>

		<table style="width: 100%">

			<tr>
				<td style="width: 100px"><h:panelGroup id="allstate">
						<h:panelGrid border="0" cellpadding="0" cellspacing="0"
							columns="2" columnClasses="columnWidth20"
							style="margin-left: 26px;"
							rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000'}">
							<h:outputLabel value="#{lbl['lbl.so.allstate']}"
								style="width : 80px" />
							<p:selectBooleanCheckbox disabled="true"
								value="#{specificationBackingBean.managedBean.supplierCriteria.allState}">
								<f:selectItem
									itemValue="#{specificationBackingBean.managedBean.supplierCriteria.allState}"></f:selectItem>
								<p:ajax update="supplierallStae"
									listener="#{specificationBackingBean.stateChange}" />
							</p:selectBooleanCheckbox>
						</h:panelGrid>
					</h:panelGroup></td>
				<td></td>
			</tr>

			<!-- <tr>


				<td style="width: 80px"><p:outputLabel
						value="#{lbl['lbl.so.mullocal']}" /></td>
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.scQt.zonal}"
						style="margin-bottom:5px;">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" partialSubmit="true" update="allStae"
							process="@this"></p:ajax>
					</p:selectOneRadio></td>

			</tr> -->

		</table>

	</p:panel>

	<p:panel>
		<h:panelGroup id="supplierallStae">


			<p:panel header="Location List"
				rendered="#{((specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal !='false'))}">
				<table style="width: 100%">
					<tr>
						<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
						<td><p:selectOneMenu id="locLevels"
								value="#{specificationBackingBean.managedBean.supplierCriteria.locationLevel}"
								style="width: 178px;margin-bottom: 5px;">

								<f:selectItems
									value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
								<p:ajax event="change"
									listener="#{specificationBackingBean.selectLocation}"></p:ajax>
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>

			<p:panel
				rendered="#{((specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal !='false'))}">
				<h:panelGrid width="100%" style="margin-top:20px">
					<p:dataTable id="zoneLocationDataTable"
						value="#{specificationBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column headerText="Location" style="width:90%">
							<p:tree value="#{zoneTree}" var="location">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</p:column>

						<p:column headerText="Action" style="width:10%">
							<p:commandLink
								actionListener="#{specificationBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<p:graphicImage library="ep/images/design" name="edit.png"
									value="/resources/ep/images/design/edit.png" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
				</h:panelGrid>
				<div align="right">
					<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
						process="@this" update="@([id$=zonePopupPanel])"
						oncomplete="ZoneLocation.show();"
						actionListener="#{specificationBackingBean.showZoneLocationPopup}"
						icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
						icon="ui-icon-delete" />
				</div>
			</p:panel>


			<p:panel header="Location List"
				rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal !='false'}">
				<table style="width: 100%">
					<tr>
						<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
						<td><p:selectOneMenu id="locZoneLevels" disabled="true"
								value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel}"
								style="width: 178px;margin-bottom: 5px;">

								<f:selectItems
									value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
								<p:ajax event="change"
									listener="#{specificationBackingBean.selectLocation}"></p:ajax>
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>


			<p:panel
				rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.supplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal !='false'}">
				<h:panelGrid width="100%" style="margin-top:20px">
					<p:dataTable id="zoneyesDataTable"
						value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column headerText="Location" style="width:90%">
							<p:tree value="#{zoneTree}" var="location">

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>




							</p:tree>
						</p:column>



					</p:dataTable>
				</h:panelGrid>

			</p:panel>


			<p:dialog header="" widgetVar="ZoneLocation" modal="true" width="600" position="top"
				height="400">
				<p:panel id="zonePopupPanel" header="ADD LOCATION">
					<table styleClass="noBorders tr,noBorders td">
						<TR>

							<TD width="80%"><p:panel></p:panel>
								<div style="height: 300px; overflow-y: scroll;">
							 <p:tree
									id="treeZoneLocationPopup"
									value="#{specificationBackingBean.managedBean.rootLocationTree}"
									var="location"
									selection="#{specificationBackingBean.managedBean.selectedNodes}"
									selectionMode="checkbox">
									<p:treeNode type="state">
										<h:outputText value="#{location.pmState.stateName}" />
									</p:treeNode>
									<p:treeNode type="division">
										<h:outputText value="#{location.pmDivision.divisionName}" />
									</p:treeNode>
									<p:treeNode type="district">
										<h:outputText value="#{location.pmDistrict.districtName}" />
									</p:treeNode>
									<p:treeNode type="city">
										<h:outputText value="#{pmCity.cityName}" />
									</p:treeNode>
								</p:tree>
								</div>
								</TD>
						</TR>

					</table>
				</p:panel>
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
					style="float:right;" onclick="ZoneLocation.hide();"
					icon="ui-icon-cancel" />
					&#160;&#160;
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
					style="float:right;" onclick="ZoneLocation.hide();" process="@all"
					update="@this, zoneLocationDataTable,zonePopupPanel"
					action="#{specificationBackingBean.updateZoneLocation}"
					icon="ui-icon-accept">
				</p:commandButton>


			</p:dialog>
		</h:panelGroup>
	</p:panel>


	<table style="width: 100%">
		<tr>
			<td style="width: 150px"><p:outputLabel
					value="#{lbl['lbl.so.paidup']}" /></td>
			<td><p:inputText
					value="#{specificationBackingBean.managedBean.supplierCriteria.minPaidUpCapital}"
					style="margin-right:5px;" /></td>
		</tr>
	</table>
	<p:panel header="Qualified Supplier">
		<table>
			<tr>
				<td style="width: 150px"><p:outputLabel
						value="Total Supplierrs" /></td>
				<td><p:inputText style="margin-right:5px;" disabled="true" />
					<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
						icon="ui-icon-search" partialSubmit="true" /></td>
			</tr>
		</table>
	</p:panel>
	<!-- <p:panelGrid columns="1" style="width:50%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			icon="ui-icon-search" style="float:right;" partialSubmit="true" />
	</p:panelGrid> -->
</ui:composition>
