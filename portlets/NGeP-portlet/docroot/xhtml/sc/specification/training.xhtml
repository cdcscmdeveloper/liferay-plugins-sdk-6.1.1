<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				style="float:left;" 
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				style="float:right;"
				actionListener="#{specificationBackingBean.acceptTrainingScore}" />



		</div>
		
		<ui:include src="checklistHeader.xhtml" />
		
		<p:spacer height="20" />
		
		<p:panel header="#{lbl['lbl.sc.spec.training']}" toggleable="true">
			<h:panelGrid columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.spec.num.yrs.training']}"></h:outputLabel>
				<p:inputText></p:inputText>
			</h:panelGrid>
		</p:panel>

		<p:panel>
			<h:panelGrid columns="2">
				<p:outputLabel value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel>
				<p:selectOneMenu
					value="#{specificationBackingBean.managedBean.checklistScoreType}">
					<f:selectItem itemLabel="Auto" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="User" itemValue="2"></f:selectItem>
					<p:ajax event="change" update="trainingchage"
						listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
				</p:selectOneMenu>
			</h:panelGrid>
		</p:panel>
		<h:panelGroup id="trainingchage">
			<p:panel
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">
				<ui:param name="scoringPnlGroupId" value="employeesTrainingId" />
				<h:panelGroup id="trainingGroupId">
					<ui:param name="scoringList"
						value="#{specificationBackingBean.managedBean.trainingScore}" />
					<ui:param name="selectionList"
						value="#{specificationBackingBean.managedBean.trainingSelectList}" />

					<ui:param name="componentName" value="Training" />
					<ui:param name="scoringPnlId" value="trainingId" />
					<ui:param name="scoringPnlName"
						value="#{lbl['lbl.sc.spec.score.training']}"></ui:param>
					<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.add']}"
							process="@this,#{scoringPnlId}" partialSubmit="true"
							oncomplete="scoreWidget.paginator.endLink.click();"
							update="#{scoringPnlId}"
							action="#{specificationBackingBean.addTrainingScoring}" />
						<p:commandButton value="#{lbl['lbl.btn.delete']}"
							action="#{specificationBackingBean.deleteScoring}"
							update="#{scoringPnlId}" />
					</div>
				</h:panelGroup>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.spec.score.training']}"
				rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
						</td>
						<td><p:inputText
								value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}"></p:inputText>
						</td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>


	</ui:define>
</ui:composition>
