<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularno']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{specificationBackingBean.managedBean.cirCularNo}"
					disabled="true" />
				<p:spacer width="5" />


			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularname']}" />
			</h:column>

			<h:column>
				<p:inputText
					value="#{specificationBackingBean.managedBean.circularName}"
					disabled="true" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularexp']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{specificationBackingBean.managedBean.circularExpDate}"
					disabled="true">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</h:column>


		</h:panelGrid>
	</p:panel>


	<p:panel header="#{lbl['lbl.sc.spec.panel.item.list']}"
		toggleable="true">


		<p:dataTable id="panelDataItemList" var="panelItem"
			rowIndexVar="index"
			value="#{specificationBackingBean.managedBean.selectpanelItem}"
			rowKey="#{panelItem}">

			<ac:paginator for="panelDataItemList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
				style="width:20%">
				<h:outputText value="#{panelItem.itemName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
				style="width:15%">
				<h:outputText value="#{panelItem.specification}" />

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
				style="width:10%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
				style="width:5%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.uom']}"
				style="width:15%">
				<h:outputText value="#{panelItem.pmUom.uomId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
				style="width:15%">
				<h:outputText value="#{panelItem.minimumOrderQty}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
				style="width:20%">

			</p:column>
          


		</p:dataTable>

	</p:panel>
</ui:composition>
