<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:outputText value="#{specificationBackingBean.managedBean.title}"></h:outputText>

	<ui:include
		src="/xhtml/sc/presentationDemo/presentationDemoHeader.xhtml"></ui:include>
	<p:panel>
		<table>
			<tr>
				<td style="width: 100px;"><h:outputLabel value="Title" /></td>
				<td><p:inputTextarea readonly="true" rows="2" cols="100"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						disabled="true"></p:inputTextarea></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.scQt.panel}">

						<f:selectItems
							value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" update="panelupdate"></p:ajax>
					</p:selectOneRadio>
					</td>
			</tr>
		</table>

	</p:panel>
	<h:panelGroup id="panelupdate">
		<p:panel
			rendered="#{specificationBackingBean.managedBean.scQt.panel==true}">
			<!-- <div align="right" style="width: 40%;">

				<p:commandButton value="View Circular" process="@this"
					partialSubmit="true" icon="ui-icon-clone" />
			</div> -->

			<ui:include src="/xhtml/sc/specification/searchCircularPanel.xhtml"></ui:include>
		</p:panel>
	</h:panelGroup>

	<div align="right" style="width: 100%;">

		<p:commandButton value="Next" process="@this" partialSubmit="true"
			style="float-right;" icon="ui-icon-next"
			action="#{specificationBackingBean.newProceedAction}" />
	</div>



</ui:composition>
