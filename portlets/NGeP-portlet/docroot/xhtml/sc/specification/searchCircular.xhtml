<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	

	<ui:include
		src="/xhtml/sc/presentationDemo/presentationDemoHeader.xhtml"></ui:include>
	<p:panel>
		<table style="width: 60%">
			<tr>
				<td  valign="top" style="width: 40%"><p:outputLabel
						value="#{lbl['lbl.sc.spec.stage.title']}" /></td>
				<td ><p:inputTextarea readonly="true" rows="2" cols="100" 
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						disabled="true"></p:inputTextarea></td>
			</tr>
			<tr>
				<td ><p:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio required="true"
						label="#{lbl['lbl.sc.spec.panel']}" id="panelTitle"
						value="#{specificationBackingBean.managedBean.scQt.panel}">

						<f:selectItems
							value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" update="panelupdate"
							listener="#{specificationBackingBean.panelChangeValue}"
							process="@this" partialSubmit="true"></p:ajax>
					</p:selectOneRadio> <p:message id="selectPanelTitleId" for="panelTitle" display="icon"></p:message>
				</td>
			</tr>
		</table>

	</p:panel>
	<h:panelGroup id="panelupdate">
		<p:panel
			rendered="#{specificationBackingBean.managedBean.scQt.panel==true}">


			<ui:include src="/xhtml/sc/specification/searchCircularPanel.xhtml"></ui:include>
		</p:panel>
	</h:panelGroup>

	<div align="right" style="width: 100%;">

		<p:commandButton value="#{lbl['lbl.sm.next']} " process="@form"
			partialSubmit="true" style="float-right;" icon="ui-icon-next"
			action="#{specificationBackingBean.newProceedAction}" />
	</div>



</ui:composition>
