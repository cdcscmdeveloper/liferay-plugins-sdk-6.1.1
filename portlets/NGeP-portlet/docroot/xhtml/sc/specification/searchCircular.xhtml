<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<ui:include
		src="/xhtml/sc/presentationDemo/presentationDemoHeader.xhtml"></ui:include>

	<h:panelGroup id="searchpanelBoUpdate">
		<table>
			<tr>
				<td valign="top" style="width: 23%"><p:outputLabel
						value="#{lbl['lbl.sc.title']}" /></td>
				<td><p:inputTextarea readonly="true" rows="2" cols="100"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						disabled="true" style=" margin-bottom:5px; width: 100%; "></p:inputTextarea></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><table>
						<tr>
							<td><p:selectOneRadio id="panelTitle" required="true"
									label="#{lbl['lbl.sc.spec.panel']}"
									value="#{specificationBackingBean.managedBean.scQt.panel}">

									<f:selectItems
										value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
									<p:ajax event="change" update="panelupdate"
										listener="#{specificationBackingBean.panelConformation}"
										process="@this" partialSubmit="true"></p:ajax>
								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><p:message
									id="selectPanelTitleId" for="panelTitle" display="icon" /></td>
						</tr>
					</table></td>
			</tr>
		</table>
		<p:dialog id="revicepanelDlgs" widgetVar="panelApprovalDlgs"
			header="#{lbl['lbl.sc.dialog.confirm.header.panelNonPanel']}"  resizable="false" width="400"
			height="200" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" />
						<p:outputLabel 
							value="#{lbl['lbl.sc.dialog.confirm.business.owner.panelNonpanel']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="panelApprovalDlgs.hide();"
					update="searchpanelBoUpdate,panelupdate"
					action="#{specificationBackingBean.panelConformationDelete}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					actionListener="#{specificationBackingBean.panelNoConformation}"
					oncomplete="panelApprovalDlgs.hide();"
					update="searchpanelBoUpdate,panelupdate" />
			</div>
		</p:dialog>
	</h:panelGroup>
	<h:panelGroup id="panelupdate">
		<h:panelGroup
			rendered="#{specificationBackingBean.managedBean.scQt.panel==true}">


			<ui:include src="/xhtml/sc/specification/searchCircularPanel.xhtml"></ui:include>
		</h:panelGroup>
	</h:panelGroup>

	<div align="right" style="width: 100%;">

		<p:commandButton value="#{lbl['lbl.btn.next']} " process="@all"
			partialSubmit="true" style="float-right;"
			action="#{specificationBackingBean.businessOwnerNextAction}" />
	</div>



</ui:composition>
