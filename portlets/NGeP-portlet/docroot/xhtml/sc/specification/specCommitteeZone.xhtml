<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:fragment
		rendered="#{specificationBackingBean.managedBean.ctzones eq 'true'}">

		<p:panel id="ctZoneList"
			header="#{lbl['lbl.sc.spec.panel.location.details']}"
			toggleable="true">


			<p:dataTable id="ctSupplierZones"
				value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
				var="Zones" rowIndexVar="index"
				selection="#{specificationBackingBean.managedBean.panelZoneSelect}"
				dynamic="true">


				<p:column headerText="#{lbl['lbl.sc.spec.supplier.zone']}"
					style="width:90%">
					<p:tree value="#{Zones}" var="location" selectionMode="single">
						<p:ajax event="select" update="@([id$=totalSupplier])"
							process="@this" partialSubmit="true"
							listener="#{specificationBackingBean.retriveZoneBySupplier}" />


						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
			</p:dataTable>



		</p:panel>
	</ui:fragment>
	<ui:include src="supplierlist.xhtml" />
</ui:composition>
