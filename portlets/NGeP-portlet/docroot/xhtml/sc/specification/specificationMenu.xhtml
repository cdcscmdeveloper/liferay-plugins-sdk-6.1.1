<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<ac:lovPopup />
	
	<p:tabView dynamic="true"  orientation="left" activeIndex="#{specificationBackingBean.managedBean.activeIndex}"
		id="businessSpecId">
		<p:ajax event="tabChange"
			listener="#{specificationBackingBean.businessOwnerTabChange}" />

		<p:tab title="#{lbl['lbl.sc.spec.general']}">
			<ui:include src="specificationBusinessOwner.xhtml"></ui:include>

		</p:tab>

		<p:tab title="Supplier Qualification Criteria">
			<ui:include src="supplierQualificationCriteria.xhtml"></ui:include>
		</p:tab>

		<p:tab title="Technical Specification">
			<ui:include src="technicalSpecification.xhtml"></ui:include>
		</p:tab>

		<p:tab title="Financial Specification">
			<ui:include src="financialSpecification.xhtml"></ui:include>
		</p:tab>
		
		

		<p:tab title="Approval" rendered="#{specificationBackingBean.managedBean.scQt.specApprovalReq eq 'true'}">
			<ui:include src="approvalBusinessOwner.xhtml"></ui:include>
		</p:tab>





	</p:tabView>

</ui:composition>
