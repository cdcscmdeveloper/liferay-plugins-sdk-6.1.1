<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<ac:lovPopup />

	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" style="vertical-align: baseline;"><p:tabMenu
					id="businessSpecId"
					activeIndex="#{specificationBackingBean.managedBean.activeIndex}"
					styleClass="sidemenu" style="display : table-caption;">

					<p:menuitem value="#{lbl['lbl.sc.spec.general']}" update="@form"
						action="#{specificationBackingBean.retriveSpecdetails(null)}" />
					<p:menuitem value="#{lbl['lbl.sc.spec.supplier.qual.criteraia']}"
						action="#{specificationBackingBean.retriveBusinessOwnerQualificationCriteri}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.spec.tech.specification']}"
					actionListener="#{specificationBackingBean.retriveTechnicalSpecification}"
						update="@form" />


					<p:menuitem value="#{lbl['lbl.sc.spec.financial.specification']}"
					actionListener="#{specificationBackingBean.retriveFinancialSpecification}"
						update="@form" />
						
					<c:if
						test="#{specificationBackingBean.managedBean.scQt.specApprovalReq eq 'true'}">

					<p:menuitem value="#{lbl['lbl.sc.spec.approval']}" 
					actionListener="#{specificationBackingBean.retriveApprovalRemarks}"
					update="@form" />
					</c:if>


				</p:tabMenu></td>
			<td width="80%;">
			<div align="right">

					<p:commandButton value="Save" update="@all"
						action="#{specificationBackingBean.saveSpecificationDtls}"
						icon="ui-icon-save" />

				</div> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '0'}">

					<ui:include src="specificationBusinessOwner.xhtml"></ui:include>

				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '1'}">

					<ui:include src="supplierQualificationCriteria.xhtml"></ui:include>
				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '2'}">
					<ui:include src="technicalSpecification.xhtml"></ui:include>

				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '3'}">
					<ui:include src="financialSpecification.xhtml"></ui:include>

				</c:if> <c:if
					test="#{specificationBackingBean.managedBean.activeIndex eq '4'}">

						<ui:fragment
						rendered="#{specificationBackingBean.managedBean.scQt.specApprovalReq eq 'true'}">
						<ui:include src="approvalBusinessOwner.xhtml"></ui:include>

					</ui:fragment>

				</c:if></td>
		</tr>
	</table>

</ui:composition>
