<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.request.item.central.contract']}">
		<table>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.spec.circular.number']}" /></td>
				<td><p:inputText size="75"
						value="#{specificationBackingBean.managedBean.cirCularNo}"
						readonly="true" disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.circular.name']}" /></td>
				<td><p:inputText readonly="true" disabled="true" size="75"
						value="#{specificationBackingBean.managedBean.circularName}"></p:inputText></td>
			</tr>
			<tr>
				<td valign="top"><h:outputLabel
						value="#{lbl['lbl.sc.spec.request.proceed.central.contract']} " /></td>
				<td><p:inputTextarea rows="2" cols="100" maxlength="1000"
						value="#{specificationBackingBean.managedBean.contractremark.remark}"></p:inputTextarea></td>
			</tr>

		</table>

	</p:panel>





</ui:composition>
