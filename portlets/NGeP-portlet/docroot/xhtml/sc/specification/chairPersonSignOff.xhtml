<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.spec.reminder.sign.off']}"
		widgetVar="chairPerson" modal="true" width="600" height="250">


		<p:panel id="chairPersonSignOff">


			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">


				<h:outputLabel value="#{lbl['lbl.sc.spec.pin.no']}" />

				<p:inputText size="50"
					value="#{specificationBackingBean.managedBean.chairPersonPinNum}"></p:inputText>



			</h:panelGrid>


			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
					style="float:right;" onclick="chairPerson.hide();"
					icon="ui-icon-cancel"></p:commandButton>

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					process="@this,chairPersonSignOff" partialSubmit="true"
					style="float:right;" onclick="chairPerson.hide();"
					icon="ui-icon-mail"></p:commandButton>
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
