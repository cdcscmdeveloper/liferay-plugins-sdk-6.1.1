<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="totalSupplier">

		<h:panelGroup>




			<p:dataTable id="suppliersTbl" var="qtSupplier" rows="10"
				value="#{specificationBackingBean.managedBean.ctZoneSupplierList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" editable="true" rowKey="#{qtSupplier}">
				<ui:param name="mof"
					value="#{specificationBackingBean.retriveMofAccountBySupplier(qtSupplier.supplier)}" />
				<ac:paginator for="suppliersTbl" />

				<!-- 	<p:column selectionMode="multiple" style="width:5%" /> -->


				<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
					<p:commandLink oncomplete="suppDetails.show();"
						actionListener="#{specificationBackingBean.retriveSupplierDtls(qtSupplier)}"
						update=":form:paneltabView:popupSuppDtl">
						<h:outputText value="#{qtSupplier.supplier.companyName}" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.mofno']}">
					<h:outputText value="#{mof.mofNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.mofexp.date']}">
					<h:outputText value="#{mof.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.status']}">
					<!-- <h:outputText
						value="#{specificationBackingBean.retriveSupplierDescById(qtSupplier.supplier.supplierId)}" /> -->
					<h:outputText
						rendered="#{specificationBackingBean.supplierStatusDateComparision(mof.expDate) eq 'true'}"
						value="#{lbl['lbl.txt.active']}" />
					<h:outputText
						rendered="#{specificationBackingBean.supplierStatusDateComparision(mof.expDate) eq 'false'}"
						value="#{lbl['lbl.txt.expired']}"
						style="font-weight: bold;color:red;" />
				</p:column>
			</p:dataTable>



			<br />
			<h:outputText value="#{lbl['lbl.sc.totalsup']}" />
			<p:spacer width="5" />
			<p:inputText style="text-align:right;"
				value="#{specificationBackingBean.managedBean.totalSuppliers}"
				disabled="true" />
		</h:panelGroup>
	</h:panelGroup>
	<!-- <ui:include src="ctZone.xhtml"></ui:include> -->

	<ui:include src="supplierDetailsPopup.xhtml"></ui:include>
</ui:composition>
