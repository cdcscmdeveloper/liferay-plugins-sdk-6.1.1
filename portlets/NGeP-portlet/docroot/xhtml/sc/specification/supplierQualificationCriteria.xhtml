<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	

	<p:panel>
		<h:panelGroup id="suppQualSpec">
			<c:if
				test="#{specificationBackingBean.managedBean.scQt.qtType == PmCodeConst.quotationTenderTypeOpen and  specificationBackingBean.managedBean.scQt.panel == 'No'}">
				<ui:include src="/xhtml/sc/specification/supplierCriteriaOpen.xhtml" />
			</c:if>

			<c:if
				test="#{specificationBackingBean.managedBean.scQt.qtType == PmCodeConst.quotationTenderTypeRestrictedTender and specificationBackingBean.managedBean.scQt.panel == 'No' }">
				<ui:include
					src="/xhtml/sc/specification/supplierRestrictedtender.xhtml" />
			</c:if>
			<c:if
				test="#{ specificationBackingBean.managedBean.scQt.panel ne'No'}">
				<ui:include
					src="/xhtml/sc/specification/supplierCriteriaPanel.xhtml" />
			</c:if>


		</h:panelGroup>
	</p:panel>
</ui:composition>
