<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	
		<p:panel header="#{lbl['lbl.sc.spec.supplier.bank.info']}" toggleable="true" >
			<p:commandLink value="#{lbl['lbl.sc.spec.bank.act.details']}"></p:commandLink>
			<p:dataTable id="bankdetails" rowIndexVar="index" var="factory"
				rowKey="#{factory}">
				<ac:paginator for="bankdetails"></ac:paginator>
				<p:column  selectionMode="multiple" style="width:2px;"></p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.act.no']}">
					<p:inputText></p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.supplier.address']}">
					<p:inputText></p:inputText>
				</p:column>




			</p:dataTable>


			<p:commandLink value="#{lbl['lbl.sc.spec.cheque.sign.composition']}"></p:commandLink>
			<p:dataTable id="cheque" rowIndexVar="index" var="factory"
				rowKey="#{factory}">
				<ac:paginator for="cheque"></ac:paginator>
				<p:column  selectionMode="multiple" style="width:2px;"></p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.cheque.sign']}">
					<p:inputText></p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.passport.no']}">
					<p:inputText></p:inputText>
				</p:column>


				<p:column headerText="#{lbl['lbl.sc.spec.bumi.status']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.share.position']}">
					<p:inputText></p:inputText>
				</p:column>



			</p:dataTable>

		</p:panel>
	

</ui:composition>
