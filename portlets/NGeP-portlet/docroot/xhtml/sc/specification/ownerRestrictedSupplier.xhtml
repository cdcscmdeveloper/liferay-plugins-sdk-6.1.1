<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="totalSupplier">
		<h:outputText value="#{lbl['lbl.so.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText
			value="#{specificationBackingBean.managedBean.totalSuppliers}"
			disabled="true" />
		<p:panel id="supplierlist" header="Supplier List" toggleable="true">
			<c:if
				test="#{specificationBackingBeann.managedBean.qtCriteria.multiLocality 
					or specificationBackingBean.managedBean.scQt.qtType == PmCodeConst.quotationTenderTypePanel}">
				<p:treeTable id="suppliersTbl" var="supplierNode"
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppliersNode}">

					<p:column headerText="#{lbl['lbl.so.suppliername']}">
						<h:outputText value="#{supplierNode.object}"
							rendered="#{supplierNode.type == 'zone'}" />
						<h:outputText value="#{supplierNode.object.supplierName}"
							rendered="#{supplierNode.type == 'supplier'}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.mofno']}">
						<h:outputText
							value="#{supplierNode.object.smMofAccounts[0].mofNo}"
							rendered="#{supplierNode.type == 'supplier' and false}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.mofexp']}">
						<h:outputText
							value="#{supplierNode.object.smMofAccounts[0].expDate}"
							rendered="#{supplierNode.type == 'supplier' and false}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.status']}">
						<h:outputText value="Active"
							rendered="#{supplierNode.type == 'supplier'}" />
					</p:column>
				</p:treeTable>
			</c:if>
			<c:if
				test="#{!specificationBackingBean.managedBean.scQt.zonal 
					and specificationBackingBean.managedBean.scQt.qtType != PmCodeConst.quotationTenderTypePanel}">



				<p:dataTable id="suppliersTbl" var="qtSupplier" rows="10"
					value="#{specificationBackingBean.managedBean.ctZoneSupplierList}"
					rowIndexVar="index" editable="true" rowKey="#{qtSupplier}">

					<ac:paginator for="suppliersTbl" />

					<!-- 	<p:column selectionMode="multiple" style="width:5%" /> -->

					<p:column headerText="#{lbl['lbl.so.suppliername']}">
						<h:outputText value="#{qtSupplier.supplier.companyName}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.mofno']}">
						<h:outputText
							value="#{qtSupplier.supplier.smMofAccounts[0].mofNo}"
							 />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.mofexp']}">
						<h:outputText
							value="#{qtSupplier.supplier.smMofAccounts[0].expDate}"
							 />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.status']}">
						<h:outputText value="Active" />
					</p:column>
				</p:dataTable>
	
	</c:if>

	<br />


	<div align="right">
		<p:commandButton value="Search" oncomplete="ctZone.show();"
			update="ctZonedetails"
			actionListener="#{specificationBackingBean.retriveZonesByCircularNo}"></p:commandButton>
	</div>
	</p:panel>
	</h:panelGroup>
	<ui:include src="ctZone.xhtml"></ui:include>
</ui:composition>
