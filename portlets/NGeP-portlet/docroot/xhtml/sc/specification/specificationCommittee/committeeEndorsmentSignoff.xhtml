<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.committee.endorsement.specification']}"
		toggleable="true">

		<p:dataTable id="scEndorsement" var="committeActivity" rows="10"
			rowIndexVar="index" widgetVar="prepareCommittee"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{committeeActivityList}">
			<ac:paginator for="scEndorsement" />

			<p:column style="width:30%;white-space: normal;"
				headerText="#{lbl['lbl.sc.name']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column style="width:5%;white-space: normal;"
				headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="pnp#{index}sc"
						value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[committeActivity.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.role']}"
				style="width:10%;white-space: normal;">


				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(committeActivity.scCommitteeMember.memberRole)}" />


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;white-space: normal;">


				<h:outputText
					value="#{lbl[committeActivity.signedOff ? 'lbl.btn.complete' : 'lbl.sc.pending' ]}" />


			</p:column>

		</p:dataTable>
		<!--  commented by sagar for temporarly -->
		<!-- <p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.committee.btn.reminder']}"
				onclick="reminder.show();" />

		</div>
		<ui:include src="committeeEndorsmentReminderpopup.xhtml" /> -->
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true"
		rendered="#{specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_ENDORSEMENT or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_REVISION or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_SIGN_OFF or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_MSC_APPROVAL}">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{specificationBackingBean.managedBean.specificationRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{specificationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										maxlength="1000"
										readonly="#{specificationBackingBean.managedBean.currentStatusId ne QTStatusConst.QT_PENDING_CHECKLIST_SCORING_ENDORSEMENT and specificationBackingBean.managedBean.currentStatusId ne QTStatusConst.QT_PENDING_MSC_APPROVAL and specificationBackingBean.managedBean.currentStatusId ne QTStatusConst.QT_PENDING_CHECKLIST_SCORING_REVISION}"
										rendered="#{remarkVar.remarkId eq null and (specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_ENDORSEMENT or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_MSC_APPROVAL or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_REVISION)}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null and (specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_REVISION or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_SIGN_OFF or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_ENDORSEMENT or specificationBackingBean.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_MSC_APPROVAL)}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
