<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%;" class="sidemenutd" valign="top"><p:tabMenu
						id="specCommitteeId"
						activeIndex="#{specificationBackingBean.managedBean.activeIndex}"
						styleClass="sidemenu">

						<p:menuitem value="#{lbl['lbl.sc.general.info']}" update="@form"
							action="#{specificationBackingBean.qtChecklistTabChange(0)}" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
						<p:menuitem
							value="#{lbl['lbl.sc.supplier.qulification.criteria']}"
							action="#{specificationBackingBean.qtChecklistTabChange(1)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />




						<p:menuitem value="#{lbl['lbl.sc.spec.tech.check.list']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(2)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />



						<ui:remove><!-- //1873 - note 149 remove ChecklistTabChange(1) n populate using method directly--></ui:remove>
						<p:menuitem value="#{lbl['lbl.sc.spec.finance.check.list']}"
						    action="#{specificationBackingBean.qtChecklistTabChange(3)}"
							actionListener="#{specificationBackingBean.retriveSupplierQualificationCriteria('SC')}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />



						<p:menuitem value="#{lbl['lbl.sc.spec.tech.scoring']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(4)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />



						<p:menuitem value="#{lbl['lbl.sc.spec.financial.scoring']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(5)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />


						<p:menuitem value="#{lbl['lbl.sc.spec.recommendation']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(6)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />


						<p:menuitem value="#{lbl['lbl.sc.spec.delivery.service.address']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(7)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
							
						<ui:remove>#29474 - start</ui:remove>
						<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(8)}"
							update="@form" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
						<ui:remove>#29474 - end</ui:remove>
						
						<!-- #25726 START -->
						<!-- new #25726 remove non periodic to condition -->
						<c:if
							test="#{specificationBackingBean.managedBean.fulfilmentType eq null or specificationBackingBean.managedBean.fulfilmentType eq 'PS' or specificationBackingBean.managedBean.fulfilmentType eq 'PA' or specificationBackingBean.managedBean.fulfilmentType eq 'OF'}">
							<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}"
								disabled="#{specificationBackingBean.managedBean.fulfilmentType eq null or specificationBackingBean.managedBean.fulfilmentType eq 'PA' 
								 or specificationBackingBean.managedBean.fulfilmentType eq 'OF'}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(9)}"
								update="@form" 
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();" /><ui:remove>#29474</ui:remove>

						</c:if>
						<!-- #25726 END -->


						<p:menuitem
							value="#{lbl['lbl.sc.committee.endorsement.specification']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(10)}"
							update="@form"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"  /><ui:remove>#29474</ui:remove>


					</p:tabMenu></td>
				<td width="80%;" valign="top"><c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '0'}">
                        <ac:lovPopup/>
						<ui:include
							src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderGeneralDetails.xhtml"></ui:include>

					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '1'}">

						<ui:include
							src="/xhtml/sc/quatationtender/supplierQualificationCriteria/supplierQualificationCriteria.xhtml"></ui:include>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '2'}">

						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/technicalChecklistMain.xhtml"></ui:include>


					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '3'}">

						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/financialChecklistMain.xhtml"></ui:include>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '4'}">

						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/technicalScoring.xhtml" />


					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '5'}">

						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/financialScoring.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '6'}">

						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/recomondation.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '7'}">

						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/deliveryAddressMain.xhtml" />
					</c:if> 
					<ui:remove>#29474 - start</ui:remove><c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '8'}">
						<!-- #25726 START -->
						<ui:include
							src="/xhtml/sc/quatationtender/quotationTenderDetails/specQuotationTenderPaymentDeduction.xhtml" />
					</c:if>
					<ui:remove>#29474 - end</ui:remove>
					<!-- new #25726 remove non periodic to condition -->
					<c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '9'}"><ui:remove>#29474</ui:remove>

						<c:if
							test="#{specificationBackingBean.managedBean.fulfilmentType eq null or specificationBackingBean.managedBean.fulfilmentType eq 'PS' or specificationBackingBean.managedBean.fulfilmentType eq 'PA' or specificationBackingBean.managedBean.fulfilmentType eq 'OF'}">

							<ui:include
								src="/xhtml/sc/specification/specificationCommittee/fulfilmentSchedule.xhtml" />
						</c:if>
						<!-- #25726 END -->


					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '10'}"><ui:remove>#29474</ui:remove>
						<ui:param name="committeeActivityList"
							value="#{specificationBackingBean.managedBean.committeeActivities}"></ui:param>
						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/committeeEndorsmentSignoff.xhtml" />

					</c:if></td>
			</tr>
		</table>


	<ui:include
		src="/xhtml/sc/specification/specificationCommittee/upload.xhtml" />
	<ui:remove><!-- //1873 - note 149 add modal true--></ui:remove>
	<p:dialog id="technicalStandardDlgs"
		widgetVar="technicalStandardChecklistDlgs" modal="true"
		header="#{lbl['lbl.sc.spec.tech.check.list']}" resizable="false"
		width="400" height="75" closable="false">
		<table>
			<tr>
				<td align="center"><h:graphicImage
						value="/css/images/design/exclamation.png" /> <p:outputLabel
						value="#{lbl['lbl.sc.dialog.confirm.spec.checklist']}" /></td>
			</tr>
		</table>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"
				oncomplete="technicalStandardChecklistDlgs.hide();" update="@form"
				action="#{specificationBackingBean.checkListYesConfirmation('T')}" />
			<p:commandButton value="#{lbl['lbl.btn.no']}" update="@form"
				actionListener="#{specificationBackingBean.checkListNoConfirmation('T')}"
				oncomplete="technicalStandardChecklistDlgs.hide();" />
		</div>
	</p:dialog>

	<p:dialog id="financialStandardDlgs"
		widgetVar="financialStandardChecklistDlgs"
		header="#{lbl['lbl.sc.spec.finance.check.list']}" resizable="false"
		width="400" height="75" closable="false">
		<table>
			<tr>
				<td align="center"><h:graphicImage
						value="/css/images/design/exclamation.png" /> <p:outputLabel
						value="#{lbl['lbl.sc.dialog.confirm.spec.checklist']}" /></td>
			</tr>
		</table>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"
				oncomplete="financialStandardChecklistDlgs.hide();" update="@form"
				action="#{specificationBackingBean.checkListYesConfirmation('F')}" />
			<p:commandButton value="#{lbl['lbl.btn.no']}" update="@form"
				actionListener="#{specificationBackingBean.checkListNoConfirmation('F')}"
				oncomplete="financialStandardChecklistDlgs.hide();" />
		</div>
	</p:dialog>
<ui:include src="/xhtml/sc/specification/clone/cloneDetails.xhtml" />


	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="#{CommonUIConstant.imagePath}/ajax-loader.gif"/>
	</p:blockUI>
</ui:composition>
