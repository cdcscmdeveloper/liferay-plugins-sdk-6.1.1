<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel id="oneTierPrepareSpecificationChecklistHeader"
		header="#{lbl['lbl.sc.spec.prepare.specification']}" toggleable="true">

		<p:dataTable id="financialSpecification" var="financialSpec"
			style="width:100%" rowIndexVar="index" rows="10"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			rowKey="#{financialSpec}">
			<ac:paginator for="financialSpecification" />

			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:50%;white-space: normal;">
				<h:outputText value="#{financialSpec.title}" size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:10%">
				<h:outputText
					value="#{specificationBackingBean.getStatusDescById(financialSpec.pmStatus.statusId)}"
					size="50"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.by']}"
				style="width:30%;white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.retriveUserName(financialSpec.createdBy)}"
					size="50"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;text-align: center;">
				<p:commandLink process="@this" partialSubmit="true"
					action="#{specificationBackingBean.committeeSpecEditAction(index,financialSpec,'T')}">
					<ui:fragment
						rendered="#{specificationBackingBean.isQTStatusChecklistScoring() or 
						!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoringRevision()}">
						<h:graphicImage value="/css/images/design/edit.png" />
					</ui:fragment>
					<ui:fragment
						rendered="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}">
						<h:graphicImage value="/css/images/design/ico-view.png" />
					</ui:fragment>


				</p:commandLink>
			</p:column>
		</p:dataTable>


		<div align="right">

			<p:commandButton value="#{lbl['lbl.sc.spec.create.specification']}"
				styleClass="BtnSpacing"
				actionListener="#{specificationBackingBean.technicalSpecBoValidate}"
				disabled="#{((specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()) or (specificationBackingBean.managedBean.panelItemCategory eq 'S' and specificationBackingBean.managedBean.scQt.panel))}"
				process="@this" partialSubmit="true"
				oncomplete="createOwnerSpec.show();" update="@([id$=commiteeCreationSpec])"/>




		</div>

		<ui:include
			src="/xhtml/sc/boSctemplatespec/createCommitteeTemplate.xhtml"></ui:include>
	</p:panel>

</ui:composition>
