<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.general.info']}" toggleable="true">

		<table style="width: 100%">
			<tr>
				<td style="width:180px;"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td colspan="3"><p:inputTextarea label="#{lbl['lbl.sc.title']}"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						required="true" cols="130" rows="3" disabled="true"
						readonly="true" style=" margin-bottom:5px;width: 98%;"
						maxlength="100" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td colspan="3"><p:inputText
						value="#{lbl[specificationBackingBean.managedBean.scQt.panel ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
						readonly="true" disabled="true" size="25" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
				</td>
				<td><p:inputText readonly="true" style="text-align: right;"
						value="#{specificationBackingBean.managedBean.scQt.estimatedAmount}"
						disabled="true" size="25">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.scQt.ppPlan ne null and specificationBackingBean.managedBean.scQt.ppPlan.planNo ne null}">
					<td><h:outputLabel value=" #{lbl['lbl.sc.justification']}" /></td>
					<td colspan="3"><p:inputTextarea rows="3" cols="30"
							style="margin-bottom:5px;"
							value="#{specificationBackingBean.managedBean.scQt.justificationRemark}"
							readonly="true" disabled="true" /></td>
				</ui:fragment>
			</tr>
			<tr>
				<td ><h:outputLabel
						value="#{lbl['lbl.sc.qttentype']}" /></td>
				<td><p:inputText readonly="true" size="25"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.quotationTenderType, specificationBackingBean.managedBean.scQt.qtType)}"
						disabled="true" /></td>

			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurment.type.category']}" /> <ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly}">
						<!-- <p:outputLabel value="*" styleClass="mandatory" /> -->
					</ui:fragment></td>
				<td><p:selectOneMenu id="specCommitteeprocTypeCategory"
						label="#{lbl['lbl.sc.procurment.type.category']}"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						required="true"
						value="#{specificationBackingBean.managedBean.scQt.procurementTypeCatId.parameterId}"
						style="width: 213px;margin-bottom: 5px;">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementTypeCategory)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:selectOneMenu> <p:message id="procuremntypeCategorySpecCommittee"
						for="specCommitteeprocTypeCategory" display="icon" /></td>
				<td style="width: 205px;"><h:outputLabel
						value="#{lbl['lbl.sc.open.for']}" /></td>
				<td><p:inputText readonly="true" size="25"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, specificationBackingBean.managedBean.scQt.openFor)}"
						disabled="true" /></td>

			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.procurement.category']}" /></td>
				<td><p:selectOneMenu disabled="true"
						style="width: 213px;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.procurement.category']}"
						value="#{specificationBackingBean.managedBean.scQt.pmProcurementCategory.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
					</p:selectOneMenu></td>
				<td><h:outputLabel value="#{lbl['lbl.sc.qt.zone.location']}" /></td>
				<td><p:inputText readonly="true" disabled="true" size="25"
						value="#{lbl[specificationBackingBean.managedBean.scQt.zonal ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.evaluation.type']}" /></td>
				<td><p:inputText size="24"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.scEvaluationType, specificationBackingBean.managedBean.scQt.evaluationType)}"
						readonly="true" disabled="true" /></td>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.spec.requir.tech.eval']}" /></td>

				<td><p:inputText size="25"
						value="#{lbl[specificationBackingBean.managedBean.scQt.techEvaluationReq ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
						readonly="true" disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.max.proposal']}" /></td>
				<td><p:inputText id="proposalId" size="25" disabled="true"
						label="#{lbl['lbl.sc.max.proposal']}" maxlength="1"
						value="#{specificationBackingBean.managedBean.scQt.maxProposal}"
						style="text-align:right;margin-bottom: 5px;">
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value=" #{lbl['lbl.sc.fullfillent.type']}" />
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly}">
						<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
					</ui:fragment></td>
				<td>
					<table>
						<tr>
							<td><p:selectOneMenu
									required="#{!specificationBackingBean.managedBean.readOnly}"
									id="fulfilId" label="#{lbl['lbl.sc.fullfillent.type']}"
									disabled="#{specificationBackingBean.managedBean.readOnly}"
									value="#{specificationBackingBean.managedBean.scQt.fulfilmentType.parameterId}"
									style="width: 213px;margin-bottom: 5px;">

									<f:selectItems
										value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
									<p:ajax event="change" process="@this" partialSubmit="true"
										update="@form"
										listener="#{specificationBackingBean.fulfilmentChange}"></p:ajax>
								</p:selectOneMenu> <p:message id="fulfilType" for="fulfilId" display="icon" /></td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.fullfillent.type.tooltip']}" /></td>
						</tr>
					</table>
				</td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.spec.complete.period']}" escape="false" /> <ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly}">
					<!-- 	<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel> -->
					</ui:fragment></td>
				<td><p:inputMask id="contract"
						required="#{!specificationBackingBean.managedBean.readOnly}"
						size="25" mask="9?99" placeHolder="" maxlength="3"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						label="#{lbl['lbl.sc.spec.complete.period']}"
						value="#{specificationBackingBean.managedBean.scQt.contractDuration}"
						style="text-align:right;">
						<p:ajax process="@this" partialSubmit="true"
							update="@this,contract" />
					</p:inputMask> <p:message id="completion" for="contract" display="icon"></p:message></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.zone.location.info']}"
		rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false' and specificationBackingBean.managedBean.scQt.panel eq 'false'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 180px"><p:outputLabel
						value="#{lbl['lbl.sc.zone.location.level']}" /></td>
				<td><p:selectOneMenu id="locationLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel.parameterId}"
						style="width: 213px;">

						<f:selectItems
							value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />

					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<p:panel
		rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false' and specificationBackingBean.managedBean.scQt.panel eq 'false'}">
		<h:panelGrid width="100%">
			<p:dataTable id="zoneGeneralDataTable" rows="10"
				value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="#{lbl['lbl.sc.zone.location']}">
					<p:tree value="#{zoneTree}" var="location">

						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>

						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>

			</p:dataTable>
		</h:panelGrid>

	</p:panel>




</ui:composition>
