<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="committeePanlrYesCircularList">
		<table style="width: 100%;">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.circular.no']}" /></td>
				<td><p:inputText size="65"
						value="#{specificationBackingBean.managedBean.circularNo}"
						disabled="true" /> <p:spacer width="5" /> <h:commandLink
						value="#{lbl['lbl.sc.circular.attach']}"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						style="margin-right:20px;"
						process="@all,committeePanlrYesCircularList" partialSubmit="true"
						update="committeepanelItemList"
						action="#{specificationBackingBean.viewCircularAttachments('SC')}">

					</h:commandLink></td>
			</tr>
			<tr>

				<td><h:outputLabel value="#{lbl['lbl.sc.circular.name']}" /></td>

				<td><p:inputTextarea rows="3" cols="75"
						style="margin-bottom:5px;width:74%;"
						value="#{specificationBackingBean.managedBean.circularName}"
						disabled="true" /></td>
			</tr>
			<tr>

				<td><h:outputLabel value="#{lbl['lbl.sc.circular.exp.date']}" />
				</td>
				<td><p:inputText size="65"
						value="#{specificationBackingBean.managedBean.circularExpDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>






		<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true"
			id="committeepanelItemList">


			<p:dataTable id="panelDataItemList" var="panelItem"
				rowIndexVar="index" rows="10"
				value="#{specificationBackingBean.managedBean.selectpanelItem}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{panelItem}">

				<ac:paginator for="panelDataItemList"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
					style="width:20%;white-space: normal;">
					<h:outputText value="#{panelItem.itemName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.specification']}"
					style="width:15%;white-space: normal;">
					<h:outputText value="#{panelItem.specification}" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
					style="width:10%">
					<h:outputText
						value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
					style="width:5%">
					<h:outputText
						value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.uom']}"
					style="width:15%;white-space: normal;">
					<h:outputText value="#{panelItem.pmUom.uomName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
					style="width:15%">
					<h:outputText value="#{panelItem.minimumOrderQty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
					style="width:20%">
					<h:outputText value="#{panelItem.maxProcureAmt}">
					</h:outputText>
				</p:column>



			</p:dataTable>

		</p:panel>
	</h:panelGroup>
</ui:composition>
