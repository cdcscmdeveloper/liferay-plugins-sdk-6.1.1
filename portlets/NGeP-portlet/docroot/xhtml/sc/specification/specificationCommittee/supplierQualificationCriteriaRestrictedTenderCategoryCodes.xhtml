<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">

		<p:dataTable id="restrictedPnlId" var="cateGory" rows="10"
			value="#{specificationBackingBean.managedBean.suppCriteriaopenList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			style="width:100%" rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sc.category.code']}"
				style="width:10%">

				<h:outputText value="#{cateGory.pmCategoryL1.categoryL1Code}">

				</h:outputText>&#160;&#160;
				<h:outputText value="#{cateGory.pmCategoryL2.categoryL2Code}">

				</h:outputText>&#160;&#160;
				<h:outputText value="#{cateGory.pmCategoryL3.categoryL3Code}"
					disabled="true" size="1"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="width:32%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL1Name}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="width:26%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL2Name}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="width:22%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3Name}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}"
				style="width:5%;white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}"></h:outputText>
			</p:column>

		</p:dataTable>

	</p:panel>

</ui:composition>
