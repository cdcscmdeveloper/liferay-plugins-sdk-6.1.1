<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">

		<p:dataTable id="openPnlId" var="cateGory" rowIndexVar="index"
			styleClass="openPnlId" rows="10"
			value="#{specificationBackingBean.managedBean.suppCriteriaopenList}">


			<p:column headerText="#{lbl['lbl.sc.category.code']}"
				style="width:10%">

				<h:outputText value="#{cateGory.pmCategoryL1.categoryL1Code}">

				</h:outputText>&#160;&#160;
				<h:outputText value="#{cateGory.pmCategoryL2.categoryL2Code}">

				</h:outputText>&#160;&#160;
				<h:outputText value="#{cateGory.pmCategoryL3.categoryL3Code}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="width:32%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL1.categoryName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="width:26%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="width:22%;white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}"
				style="width:5%;white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

		</p:dataTable>

	</p:panel>


	<p:panel toggleable="true"
		rendered="#{isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.qt.zonal !='false'}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
		</f:facet>

		<table style="width: 100%">
			<tr>
				<td style="width: 185px;"><p:outputLabel
						value="#{lbl['lbl.sc.paidup']}" /></td>
				<td><p:inputText disabled="true" size="30" maxlength="18"
						value="#{specificationBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" /></td>
				<td><p:selectOneMenu id="locZoneLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
						style="width:215px;margin-bottom: 5px;">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel,specificationBackingBean.managedBean.qt)}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>


	<h:panelGroup
		rendered="#{isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.qt.zonal !='false'}">
		<h:panelGrid width="100%">
			<p:dataTable id="zoneyesDataTable" rows="10"
				value="#{specificationBackingBean.managedBean.zoneTrees}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="#{lbl['lbl.sc.location']}">
					<p:tree value="#{zoneTree}" var="location">
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
			</p:dataTable>
		</h:panelGrid>

	</h:panelGroup>




	<p:panel toggleable="true"
		rendered="#{((isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.qt.zonal !='false'))}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
		</f:facet>

		<table style="width: 100%">
			<tr>
				<td style="width: 200px"><p:outputLabel
						value="#{lbl['lbl.sc.all.states']}"
						rendered="#{!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState =='false'}" />
				</td>
				<td><p:inputText disabled="true" value="No" size="30"
						rendered="#{!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState =='false'}" />
				</td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.paidup']}" /></td>
				<td><p:inputText size="30" maxlength="18" disabled="true"
						value="#{specificationBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" /></td>
				<td><p:selectOneMenu id="locLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
						style="width: 250px;">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel,specificationBackingBean.managedBean.qt)}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<h:panelGroup
		rendered="#{((isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.qt.zonal !='false'))}">
		<h:panelGrid width="100%">

			<p:dataTable id="zoneLocationDataTable" rows="10"
				value="#{specificationBackingBean.managedBean.zoneTrees}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="#{lbl['lbl.sc.location']}">
					<p:tree value="#{zoneTree}" var="location">
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
			</p:dataTable>
		</h:panelGrid>


	</h:panelGroup>
	<p:panel toggleable="true"
		rendered="#{!isQuotationThresHold and specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState !='false'}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
		</f:facet>

		<table>
			<tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.all.states']}" /></td>
				<td><p:inputText size="30"
						value="#{lbl[specificationBackingBean.managedBean.qt.scQtSupplierCriteria.allState ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
						disabled="true" style="margin-right:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.paidup']}" /></td>
				<td><p:inputText maxlength="18" disabled="true" size="30"
						value="#{specificationBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>

	<table>
		<tr>
			<td style="width: 198px"><p:outputLabel
					value="#{lbl['lbl.sc.totalsup']}" /></td>
			<td><p:inputText id="specCommitteeTotalSuppliers"
					style="margin-right:5px;text-align:right;" disabled="true"
					value="#{specificationBackingBean.managedBean.totalSuppliers}"
					size="30" /> <p:commandButton value="#{lbl['lbl.btn.search']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="specCommitteeTotalSuppliers"
					action="#{specificationBackingBean.searchForSupplierCount}"
					partialSubmit="true" process="@this" /></td>
		</tr>
	</table>

</ui:composition>
