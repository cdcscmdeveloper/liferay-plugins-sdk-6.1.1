<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="TotalSuppliers" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info"></p:messages>

		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> <p:commandButton
						value="#{lbl['lbl.btn.print']}" type="button">
						<p:printer target="financialCheckListSuppInfo" />
					</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{((specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION) or(!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveCheckListScores}">
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.criteriaType}"
							value="30" />
					</p:commandButton></td>
			</tr>
		</table>

		<h:panelGroup id="financialCheckListSuppInfo">
			<ui:include
				src="/xhtml/sc/specification/specificationCommittee/financialCheckListSupplierInfoscore.xhtml" />
		</h:panelGroup>
		
	</ui:define>

</ui:composition>
