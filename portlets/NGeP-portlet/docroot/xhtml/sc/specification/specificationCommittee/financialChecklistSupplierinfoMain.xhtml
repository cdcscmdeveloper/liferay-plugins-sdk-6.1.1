<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="TotalSuppliers" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info"></p:messages>

		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> <p:commandButton
						value="#{lbl['lbl.btn.print']}" type="button">
						<p:printer target="financialChecklistSupplierInfoScoringUserIds" />
					</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{((specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.isQTStatusChecklistScoring()) or(!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.isQTStatusChecklistScoringRevision()))}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveCheckListScores}">
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.criteriaType}"
							value="30" />
					</p:commandButton></td>
			</tr>
		</table>

		<h:panelGroup id="financialChecklistSupplierInfoScoringUserIds">
			<!-- <ui:include
				src="/xhtml/sc/specification/specificationCommittee/financialCheckListSupplierInfoscore.xhtml" /> -->
				
				<ui:include src="/xhtml/sc/specification/specificationCommittee/checklistHeader.xhtml" />

		

		<p:panel header="#{lbl['lbl.sc.spec.total.score.suppliers']}" 
			toggleable="true" id="SpecCommitteefinancialChecklistSupplierInfoIds">
			<table>
				<tr>
					<td style="width: 117px;"><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu disabled="true" style="width: 180px;margin-bottom: 5px;"
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>

						</p:selectOneMenu></td>
					<td><ac:iconTooltip
							value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
					</td>
				</tr>
			</table>

			
				
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<ui:fragment
									rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
									<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
								</ui:fragment></td>
							<td><p:inputText id="totalSuppliersScore" required="true"
									style="text-align:right;"
									disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
									label="#{lbl['lbl.sc.spec.max.score']}"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}"
									maxlength="18">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
									<p:ajax event="change" process="@this" partialSubmit="true" update="SpecCommitteefinancialChecklistSupplierInfoIds"></p:ajax>
								</p:inputText> <p:message id="financialSuppliers" for="totalSuppliersScore"
									display="icon"></p:message></td>
						</tr>
					</table>
				</h:panelGroup>
			
		</p:panel>
		
		</h:panelGroup>
	</ui:define>

</ui:composition>
