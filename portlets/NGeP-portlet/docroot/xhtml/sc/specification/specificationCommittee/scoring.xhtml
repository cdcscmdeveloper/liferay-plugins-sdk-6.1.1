<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup>

		<p:dataTable id="#{scoringPnlId}" rowIndexVar="index" rows="50"
			widgetVar="scoreWidget" value="#{scoringList}"
			selection="#{selectionList}" var="checkListScoring"
			rowKey="#{checkListScoring}">
			<ac:paginator for="#{scoringPnlId}"></ac:paginator>
			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
						value="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="#{scoringPnlId}"
							listener="#{specificationBackingBean.selectAll(specificationBackingBean.managedBean.templateSpecBean.selectAll, scoringList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					value="#{checkListScoring.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="width:37%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.from']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.tpl.spec.content.scoring.scoring.title.tooltip']}" />
					<!-- <h:outputText value=" #{lbl['lbl.sc.spec.from.month']}"
						rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'BS'}" /> -->
				</f:facet>
				<p:inputText id="#{scoringPnlId}_fromRangeTN"
					style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'BS' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'AL' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'TG' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'TN' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'FG' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'FN'}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					label="#{lbl['lbl.sc.from']}" required="true"
					value="#{checkListScoring.rangeFrom}" maxlength="18">
					<p:ajax event="blur" process="@this" partialSubmit="true" />
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>

				</p:inputText>

				<p:inputText id="#{scoringPnlId}_fromRangeTG"
					style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'BS' or specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'AL'}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					label="#{lbl['lbl.sc.from']}" required="true"
					value="#{checkListScoring.rangeFrom}" maxlength="18">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,#{scoringPnlId}_fromRangeTG" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
					<f:attribute name="min" value="0"></f:attribute>
				</p:inputText>


				<p:inputText id="#{scoringPnlId}_fromRangeFG"
					style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'TG' or specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'TN' or specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'FG' or specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'FN'}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					label="#{lbl['lbl.sc.from']}" required="true"
					value="#{checkListScoring.rangeFrom}" maxlength="18">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,#{scoringPnlId}_fromRangeFG" />
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
					<f:attribute name="min" value="0"></f:attribute>
				</p:inputText>
				<!-- 	<p:message id="#{scoringPnlId}_rangeFrom"
					for="#{scoringPnlId}_fromRange" display="icon"></p:message> -->
			</p:column>
			<p:column style="width:30%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.to']}" />
					<!-- <h:outputText value=" #{lbl['lbl.sc.spec.to.month']}"
						rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'BS'}" /> -->
				</f:facet>
				<p:inputText id="#{scoringPnlId}_toRangeNE" style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'BS' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'AL'}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					required="#{index lt scoringList.size()-1}"
					label="#{lbl['lbl.sc.to']}" value="#{checkListScoring.rangeTo}"
					maxlength="18">
					<p:ajax event="blur" process="@this" partialSubmit="true" />
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
				</p:inputText>

				<p:inputText id="#{scoringPnlId}_toRangeBS" style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'BS' or specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey eq 'AL'}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					required="#{index lt scoringList.size()-1}"
					label="#{lbl['lbl.sc.to']}" value="#{checkListScoring.rangeTo}"
					maxlength="18">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						update="#{scoringPnlId}_toRangeBS" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
				</p:inputText>
				<!-- 	<p:message id="#{scoringPnlId}_rangeTo"
					for="#{scoringPnlId}_toRange" display="icon"></p:message> -->
			</p:column>
			<p:column style="width:30%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.score']}" />
				</f:facet>
				<p:inputText id="#{scoringPnlId}_toScore" style="text-align:right"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					label="#{lbl['lbl.sc.score']}" value="#{checkListScoring.score}"
					maxlength="18">
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
				</p:inputText>

			</p:column>

		</p:dataTable>
	</h:panelGroup>


</ui:composition>
