<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="supplierlist" header="Supplier List" toggleable="true">


		<p:dataTable id="suppliersTblCommitteeRestricted" rows="10"
			var="qtSupplier"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{specificationBackingBean.managedBean.restrictedSupplierList}">

			<ac:paginator for="suppliersTblCommitteeRestricted" />

			<p:column headerText="#{lbl['lbl.sc.supplier.name']}"
				style="white-space: normal;">
				<p:commandLink
					update=":form:paneltabViewComitteeRestricted:restrictedSupplierpopupSuppDtl"
					action="#{specificationBackingBean.showSupplierDetails(qtSupplier)}"
					oncomplete="restrictedsuppDetails.show();">
					<h:outputText value="#{qtSupplier.smSupplier.companyName}" />
				</p:commandLink>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofno']}"
				style="white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.retrieveSmMofAccount(qtSupplier, null).mofNo}">

				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}"
				style="white-space: normal;">
				<h:outputText
					value="#{specificationBackingBean.retrieveSmMofAccount(qtSupplier, null).expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}"
				style="white-space: normal;">
				<!-- <h:outputText value="Active" /> -->

				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, specificationBackingBean.retrieveSmMofAccount(qtSupplier, null).recordStatusFlg)}" />
			</p:column>
		</p:dataTable>
		<br />
		<h:outputText value="#{lbl['lbl.sc.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText style="text-align:right;"
			value="#{specificationBackingBean.managedBean.totalSuppliers}"
			disabled="true" />



	</p:panel>
	<ui:include src="restrictedTenderSuppliersPopUp.xhtml"></ui:include>
</ui:composition>
