<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<h:panelGroup id="specCommitteepaleYesSuppliers">

		<p:panel id="ctZoneList"
			header="#{lbl['lbl.sc.location.details']}/#{lbl['lbl.sc.supplier.list']}"
			toggleable="true">
			<ui:fragment
				rendered="#{specificationBackingBean.managedBean.ctzones eq 'true'}">




				<p:dataTable id="ctSupplierZones" rows="10"
					value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					var="Zones" rowIndexVar="index" dynamic="true">


					<p:column headerText="#{lbl['lbl.sc.zone']}" style="width:90%">
						<p:tree value="#{Zones}" var="location" selectionMode="single"
							selection="#{specificationBackingBean.managedBean.panelZoneSelect}">
							<p:ajax event="select"
								update="@([id$=specCommitteepaleYesSuppliers])"
								listener="#{specificationBackingBean.retriveSupplierByZonal}" />

							<p:ajax event="unselect"
								listener="#{specificationBackingBean.unSelectPanelYesTreenode}" />
							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
				</p:dataTable>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.tplSpecZoneDtl ne null and specificationBackingBean.managedBean.tplSpecZoneDtl.zoneName ne null}">
		#{specificationBackingBean.managedBean.tplSpecZoneDtl.zoneName}>#{lbl['lbl.sc.supplier.list']}
		</ui:fragment>
			</ui:fragment>

			<ui:include src="/xhtml/sc/specification/common/supplierlist.xhtml" />
		</p:panel>
	</h:panelGroup>
</ui:composition>
