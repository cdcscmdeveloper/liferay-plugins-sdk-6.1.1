<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="conpamyExpPrivate" showDetail="true" autoUpdate="true"
			showSummary="false" closable="true" severity="error, info">
		</p:messages>
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" immediate="true"
						style="float:left;" 
						action="#{specificationBackingBean.committeeBackAction}" /> 
						
				<p:commandButton 
						value="#{lbl['lbl.btn.print']}" process="@all" type="button">
						<p:printer target="techCheckListPrivateCompExp" />
					</p:commandButton>
					<p:commandButton
						value="#{lbl['lbl.btn.save']}" 
						rendered="#{((specificationBackingBean.isQTStatusChecklistScoring()) or(!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.isQTStatusChecklistScoringRevision()))}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveCheckListScores}">
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.criteriaType}"
							value="15" />
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.otherCriteriaType}"
							value="16" />

					</p:commandButton></td>
			</tr>
		</table>

	<h:panelGroup id="techCheckListPrivateCompExp">
					
		<ui:include
			src="/xhtml/sc/specification/specificationCommittee/checklistHeader.xhtml" />


		<p:panel toggleable="true" id="technicalPrivatespecCommitteeCompanyExp">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.spec.company.exp.fed.private']}" />
				<ac:iconTooltip
					value="#{lbl['lbl.sc.spec.company.exp.fed.private.tooltip']}" />
			</f:facet>
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.company.exp.since.year']} "></p:outputLabel>
						<ui:fragment
							rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
							<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
						</ui:fragment></td>
					<td><p:inputText required="true" id="techCompanyprivate"
							disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
							label="#{lbl['lbl.sc.spec.company.exp.since.year']}"
							style="text-align:right;"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue.year}"
							maxlength="4">
							<p:ajax event="blur" process="@this" partialSubmit="true" update="technicalPrivatespecCommitteeCompanyExp"
								listener="#{specificationBackingBean.compareChecklistValueCurrentYear(specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue)}"></p:ajax>
						</p:inputText> <p:message id="techPrivateYrs" for="techCompanyprivate"
							display="icon"></p:message></td>
				</tr>
			</table>

			<p:dataTable id="experience" rowIndexVar="index" var="experience"
				rowKey="#{experience}" style="width:1090px">
				<ac:paginator for="experience"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.effective.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.exp.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.remarks']}">
					<p:inputText></p:inputText>
				</p:column>
			</p:dataTable>


			<p:spacer height="10px"></p:spacer>
			<table>

				<tr>
					<td width="150px"><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.no.contracts']}" /></td>
					<td><p:inputText readonly="true" disabled="true"></p:inputText>
					</td>
				</tr>

				<tr>
					<td width="150px"><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.no.years']}" /></td>
					<td><p:inputText readonly="true" disabled="true"></p:inputText>
					</td>
				</tr>


			</table>

		</p:panel>

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.score.company.exp.intruction']}"
			escape="false" />


		<p:panel id="companyExpPrivateContracts" toggleable="true"
			
			rendered="#{specificationBackingBean.managedBean.scQtChecklist.scoringReq}">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.spec.score.total.no.contracts']}" />
				<ac:iconTooltip
					value="#{lbl['lbl.sc.spec.score.total.no.contracts.tooltip']}" />
			</f:facet>
			<table>
				<tr>
					<td width="150px"><ui:fragment
							rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
							<p:outputLabel value="*" styleClass="mandatory"
								style="float : left"></p:outputLabel>
						</ui:fragment> <p:outputLabel style="float : left"
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu style="width:180px;margin-bottom: 5px;"
							disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
							id="techPrivateNoOfAutoscore"
							label="#{lbl['lbl.sc.spec.asset.score.type']}"
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
							<p:ajax event="change"
								update="companytechnicalPrivate,companyExpPrivateContracts"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu> <p:message id="techPrivateNoOfAutoscoreMsg"
							for="techPrivateNoOfAutoscore" display="icon"></p:message></td>
					<td><ac:iconTooltip
							value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
					</td>
				</tr>
			</table>

			<h:panelGroup id="companytechnicalPrivate">
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">
					<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
					<h:panelGroup id="contractorGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />

						<ui:param name="componentName" value="contractor" />
						<ui:param name="scoringPnlId" value="contractorListId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.spec.score.total.no.contracts']}"></ui:param>
						<ui:include
							src="/xhtml/sc/specification/specificationCommittee/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.btn.add']}"
								styleClass="BtnSpacing"
								disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								oncomplete="scoreWidget.paginator.endLink.click();"
								actionListener="#{specificationBackingBean.addScoring(15)}"
								update="#{scoringPnlId}" />
							<p:commandButton value="#{lbl['lbl.btn.delete']}"
								styleClass="BtnSpacing"
								disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
								process="@this" partialSubmit="true"
								oncomplete="technicalNonGovCompanyExperienceNoOfContractsDeletePopUp.show();"
								update="@([id$=#{technicalNonGovCompanyExperienceNoOfContractsId}])">
								<f:setPropertyActionListener
									target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
									value="#{false}" />
							</p:commandButton>

						</div>
						<ui:param name="technicalNonGovCompanyExperienceNoOfContractsId"
							value="technicalNonGovCompanyExperienceNoOfContractsId"></ui:param>

						<ac:confirmationPopup
							id="#{technicalNonGovCompanyExperienceNoOfContractsId}"
							widget="technicalNonGovCompanyExperienceNoOfContractsDeletePopUp"
							width="450" height="100"
							okAction="specificationBackingBean.deleteCheckListScoreContrats"
							title="#{lbl['lbl.sc.spec.company.exp.fed.gov']}"
							content="#{lbl['lbl.sc.dialog.confirm.message']}"
							update="@([id$=#{scoringPnlId}])" />

					</h:panelGroup>
				</h:panelGroup>

				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td width="150px"><ui:fragment
									rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
									<p:outputLabel value="*" styleClass="mandatory"
										style="float : left"></p:outputLabel>
								</ui:fragment> <p:outputLabel style="float : left"
									value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel></td>
							<td><p:inputText id="techprivateContScore" required="true"
									style="text-align:right;"
									disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
									label="#{lbl['lbl.sc.spec.max.score']}" maxlength="18"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
									<p:ajax  event="change" process="@this" partialSubmit="true" update="companyExpPrivateContracts"></p:ajax>
								</p:inputText> <p:message id="techContractPrivateScore"
									for="techprivateContScore" display="icon"></p:message></td>
						</tr>
					</table>
				</h:panelGroup>
			</h:panelGroup>
		</p:panel>

		<p:panel id="techcompanyExpPrivateNumbersOfYears"
			
			header="#{lbl['lbl.sc.spec.score.total.no.years']}" toggleable="true"
			rendered="#{specificationBackingBean.managedBean.scQtChecklist.scoringReq}">
			<table>
				<tr>
					<td width="150px"><p:outputLabel style="float : left"
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
					<td><p:selectOneMenu style="width:180px;margin-bottom: 5px;"
							disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
							label="#{lbl['lbl.sc.spec.asset.score.type']}"
							id="techPrivateNoOfYearsAutoScore"
							value="#{specificationBackingBean.managedBean.companyScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
							<p:ajax event="change"
								update="companyprivateYears,techcompanyExpPrivateNumbersOfYears"
								listener="#{specificationBackingBean.companyscoreTypeChange}"></p:ajax>
						</p:selectOneMenu> <p:message id="techPrivateNoOfYearsAutoScoreMsg"
							for="techPrivateNoOfYearsAutoScore" display="icon"></p:message></td>
					<td><ac:iconTooltip
							value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
					</td>
				</tr>
			</table>

			<h:panelGroup id="companyprivateYears">
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.companyScoreType eq '1'}">
					<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
					<h:panelGroup id="scoringofYearsGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.scoringForYears}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.otherScoreSelected}" />
						<ui:param name="componentName" value="ScoringYear" />
						<ui:param name="scoringPnlId" value="scoringYearId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.spec.score.total.no.years']}"></ui:param>
						<!-- <ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include> -->
						<h:panelGroup>

							<p:dataTable id="#{scoringPnlId}" rowIndexVar="index" rows="50"
								widgetVar="scoreWidget" value="#{scoringList}"
								selection="#{selectionList}" var="checkListScoring"
								rowKey="#{checkListScoring}">
								<ac:paginator for="#{scoringPnlId}"></ac:paginator>
								<p:column style="width:3px;text-align:center;">
									<f:facet name="header">
										<p:selectBooleanCheckbox
											disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
											value="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}">
											<p:ajax partialSubmit="true" process="@this"
												update="#{scoringPnlId}"
												listener="#{specificationBackingBean.selectAll(specificationBackingBean.managedBean.templateSpecBean.selectAll, scoringList)}" />
										</p:selectBooleanCheckbox>
									</f:facet>
									<p:selectBooleanCheckbox
										disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
										value="#{checkListScoring.selected}">
										<p:ajax partialSubmit="true" process="@this" update="@this" />
									</p:selectBooleanCheckbox>
								</p:column>
								<p:column style="width:37%">
									<f:facet name="header">
										<ui:fragment
											rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
											<h:outputText value="* " styleClass="mandatory" />
										</ui:fragment>
										<h:outputText value="#{lbl['lbl.sc.from']}"
											rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'BS'}" />
										<ac:iconTooltip
											value="#{lbl['lbl.tpl.spec.content.scoring.scoring.title.tooltip']}"
											rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'BS'}" />

									</f:facet>


									<p:inputText id="#{scoringPnlId}_fromRangeTNyears"
										style="text-align:right"
										disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
										label="#{lbl['lbl.sc.from']}" required="true"
										value="#{checkListScoring.rangeFrom}" maxlength="18">
										<p:ajax process="@this" partialSubmit="true"
											update="@this,#{scoringPnlId}_fromRangeTNyears" />
										<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
										<f:attribute name="min" value="0"></f:attribute>
										<p:ajax  event="change" process="@this" partialSubmit="true" update="@this"></p:ajax>
									</p:inputText>


								</p:column>
								<p:column style="width:30%">
									<f:facet name="header">
										<ui:fragment
											rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
											<h:outputText value="* " styleClass="mandatory" />
										</ui:fragment>
										<h:outputText value="#{lbl['lbl.sc.to']}"
											rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'BS'}" />

									</f:facet>
									<p:inputText id="#{scoringPnlId}_toRangeTNYears"
										style="text-align:right"
										rendered="#{specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'BS' and specificationBackingBean.managedBean.scQtChecklist.pmDocument.docDefinitionKey ne 'AL'}"
										disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
										required="#{index lt scoringList.size()-1}"
										label="#{lbl['lbl.sc.to']}"
										value="#{checkListScoring.rangeTo}" maxlength="18">
										<p:ajax event="blur" process="@this" partialSubmit="true"
											update="@this,#{scoringPnlId}_toRangeTNYears" />
										<ac:validateNumber
											pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
											maxIntegerDigits="14" />
										<f:attribute name="min" value="0"></f:attribute>
									</p:inputText>


								</p:column>
								<p:column style="width:30%">
									<f:facet name="header">
										<ui:fragment
											rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
											<h:outputText value="* " styleClass="mandatory" />
										</ui:fragment>
										<h:outputText value="#{lbl['lbl.sc.score']}" />
									</f:facet>
									<p:inputText id="#{scoringPnlId}_toScore"
										style="text-align:right"
										disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
										label="#{lbl['lbl.sc.score']}" 
										value="#{checkListScoring.score}" maxlength="18">
										<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
										<p:ajax  event="change" process="@this" partialSubmit="true" update="@this"></p:ajax>
									</p:inputText>

								</p:column>

							</p:dataTable>
						</h:panelGroup>

						<div align="right">
							<p:commandButton value="#{lbl['lbl.btn.add']}"
								styleClass="BtnSpacing"
								disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								oncomplete="scoreWidget.paginator.endLink.click();"
								actionListener="#{specificationBackingBean.addScoringyears(16)}"
								update="#{scoringPnlId}" />
							<p:commandButton value="#{lbl['lbl.btn.delete']}"
								styleClass="BtnSpacing"
								disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
								process="@this" partialSubmit="true"
								oncomplete="technicalNonGovCompanyExperienceNoOfYearsDeletePopUp.show();"
								update="@([id$=#{technicaNonlGovCompanyExperienceNoOfYearsDeleteId}])">
								<f:setPropertyActionListener
									target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
									value="#{false}" />
							</p:commandButton>

						</div>
						<ui:param name="technicaNonlGovCompanyExperienceNoOfYearsDeleteId"
							value="technicalGovCompanyExperienceNoOfYearsDeleteId"></ui:param>

						<ac:confirmationPopup
							id="#{technicaNonlGovCompanyExperienceNoOfYearsDeleteId}"
							widget="technicalNonGovCompanyExperienceNoOfYearsDeletePopUp"
							width="450" height="100"
							okAction="specificationBackingBean.deleteCheckListScoreYears"
							title="#{lbl['lbl.sc.spec.company.exp.fed.gov']}"
							content="#{lbl['lbl.sc.dialog.confirm.message']}"
							update="@([id$=#{scoringPnlId}])" />
					</h:panelGroup>

				</h:panelGroup>

				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.companyScoreType eq '2'}">
					<table>
						<tr>
							<td width="150px"><ui:fragment
									rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
									<p:outputLabel value="*" styleClass="mandatory"
										style="float : left"></p:outputLabel>
								</ui:fragment> <p:outputLabel style="float : left"
									value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel></td>
							<td><p:inputText id="techPrivaeYrs"
									style="text-align:right;"
									disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
									label="#{lbl['lbl.sc.spec.max.score']}" required="true"
									maxlength="18"
									value="#{specificationBackingBean.managedBean.scQtContractScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
									<p:ajax  event="change" process="@this" partialSubmit="true" update="techcompanyExpPrivateNumbersOfYears"></p:ajax>
								</p:inputText> <p:message id="techYearsPrivateScore" for="techPrivaeYrs"
									display="icon"></p:message></td>

						</tr>
					</table>
				</h:panelGroup>
			</h:panelGroup>
		</p:panel>
		</h:panelGroup>
	</ui:define>
</ui:composition>
