<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="technicalChecklistSamplemain" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"
			severity="error, info"></p:messages>
			<ui:param name="isReadOnlyOrSpecMain"
			value="#{!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()}" /><!-- #11104 Reendorse -->
		<table style="width:100%;" class="BtnSpacing"><!-- #11104 Reendorse -->
			<tr>
				<td align="right"><p:commandButton process="@this" partialSubmit="true"
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> 
						 <p:commandButton
						value="#{lbl['lbl.btn.complete']}" process="@this"
						partialSubmit="true"
						rendered="#{((!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring()) or (!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.isQTStatusChecklistScoringRevision()) or isReadOnlyOrSpecMain)}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.completeSampleTemplateSpecDetails()}" /><!-- #11104 Reendorse -->
					</td>
			</tr>
		</table>
		<p:spacer height="5"></p:spacer>
		<ui:include src="technicalCheckListSampleHeader.xhtml"></ui:include>
		<p:spacer height="5"></p:spacer>
		<ui:include src="technicalChecklistSampleTemplateTable.xhtml"></ui:include>
	</ui:define>
</ui:composition>
