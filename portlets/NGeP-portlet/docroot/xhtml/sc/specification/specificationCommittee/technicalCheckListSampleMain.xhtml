<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="technicalChecklistSamplemain" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"
			severity="error, info"></p:messages>
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton process="@this" partialSubmit="true"
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> 
					</td>
			</tr>
		</table>
		<p:spacer height="5"></p:spacer>
		<ui:include src="technicalCheckListSampleHeader.xhtml"></ui:include>
		<p:spacer height="5"></p:spacer>
		<ui:include src="technicalChecklistSampleTemplateTable.xhtml"></ui:include>
	</ui:define>
</ui:composition>
