	<p:panel id="techCommitteeChecklist"

		<h:outputText styleClass="instruction"  rendered="#{!specificationBackingBean.managedBean.qt.panel}"
			value="#{lbl['lbl.sc.spec.tech.check.list.instruction']}"
			escape="false" />

			value="#{lbl['lbl.sc.spec.tech.check.list.panel.instruction']}"
			escape="false" />
			<ui:include src="/xhtml/tpl/spec/specGuideLineInstructions.xhtml"></ui:include>
			<h:outputText styleClass="instruction"  rendered="#{!specificationBackingBean.managedBean.qt.panel}"
			value="#{lbl['lbl.sc.spec.tech.check.list.instruction1']}"
			escape="false" />
			<ui:fragment rendered="#{!specificationBackingBean.managedBean.qt.panel}">

			</ui:fragment>
			</ui:fragment>
								
			<h:outputText styleClass="instruction" rendered="#{specificationBackingBean.managedBean.qt.panel}"
			value="#{lbl['lbl.sc.spec.tech.check.list.panel.instruction1']}"
			escape="false" />
			

		<p:dataTable id="stageTwotechProposal" var="stageTwoTechnical"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			rowIndexVar="index"
			selection="#{specificationBackingBean.managedBean.s2TechSelect}"
			first="#{specificationBackingBean.managedBean.technicalTableRow}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{stageTwoTechnical}">
			<!-- 	<ac:paginator for="stageTwotechProposal" /> -->

			<!-- 	<p:column selectionMode="multiple" style="text-align:left;"
				rendered="#{stageTwoTechnical.manditory !='true' and stageTwoTechnical.definationType.parameterCode ne 'TS'}" />

			<p:column style="text-align:left;" selectionMode="multiple"
				disabledSelection="true"
				rendered="#{stageTwoTechnical.manditory ==true and stageTwoTechnical.definationType.parameterCode ne 'TS' }" />
			<p:column style="text-align:left;" disabledSelection="true"
				selectionMode="multiple"
				rendered="#{stageTwoTechnical.manditory !=true and stageTwoTechnical.definationType.parameterCode eq 'TS'}" /> -->
	
			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox disabled="true"
						value="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" disabled="true"
							update="@([id$=stageTwotechProposal]),@([id$=deleteTechnicalChecklist])"
							listener="#{specificationBackingBean.selectAll(specificationBackingBean.managedBean.templateSpecBean.selectAll, specificationBackingBean.managedBean.scQtCheckSt2techProposal)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<!-- #28784 -->
				<ui:remove> #28784 include demo WIP </ui:remove>
				<p:selectBooleanCheckbox value="#{stageTwoTechnical.selected}"									
					disabled="#{(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypePresentationDemo and specificationBackingBean.managedBean.qt.demoRequired eq 'true' and specificationBackingBean.managedBean.newVersion) or (specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()) and !specificationBackingBean.managedBean.isChecklist()}"
					rendered="#{stageTwoTechnical.manditory !='true' and (stageTwoTechnical.definationType.parameterCode ne 'TS' and stageTwoTechnical.definationType.parameterCode ne 'SP')}"><!-- #15391 -->
					<p:ajax partialSubmit="true" process="@this" update="@this,@([id$=deleteTechnicalChecklist])"
						listener="#{specificationBackingBean.updateSelectedCheckListIndx(stageTwoTechnical,index)}" />
				</p:selectBooleanCheckbox>

				<p:selectBooleanCheckbox value="#{stageTwoTechnical.selected}"
					disabled="true"
					rendered="#{stageTwoTechnical.manditory ==true and stageTwoTechnical.definationType.parameterCode ne 'TS' }">
					<p:ajax partialSubmit="true" process="@this" update="@this,@([id$=deleteTechnicalChecklist])"
						listener="#{specificationBackingBean.updateSelectedCheckListIndx(stageTwoTechnical,index)}" />
				</p:selectBooleanCheckbox>

				<!-- 11104wip -start- -->
				<p:selectBooleanCheckbox value="#{stageTwoTechnical.selected}"
					disabled="true"
					rendered="#{stageTwoTechnical.manditory !=true and (stageTwoTechnical.definationType.parameterCode eq 
						ParameterConst.documentDefinitionTypeTemplateSpecification or 
						(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and 
						specificationBackingBean.managedBean.sampleShowHide))}">
					<!-- 11104wip -end- -->
					<p:ajax partialSubmit="true" process="@this"
						update="@this,@([id$=deleteTechnicalChecklist])"
						listener="#{specificationBackingBean.updateSelectedCheckListIndx(stageTwoTechnical,index)}" />
				</p:selectBooleanCheckbox>

				<!-- 11104wip -start- -->
				<p:selectBooleanCheckbox value="#{stageTwoTechnical.selected}"
					disabled="#{(specificationBackingBean.managedBean.readOnly or 
						specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()) and 
						!specificationBackingBean.managedBean.isChecklist()}"
					rendered="#{stageTwoTechnical.manditory !=true and 
						(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and 
						!specificationBackingBean.managedBean.sampleShowHide)}">
					<!-- 11104wip -end- -->
					<p:ajax partialSubmit="true" process="@this"
						update="@this,@([id$=deleteTechnicalChecklist])"
						listener="#{specificationBackingBean.updateSelectedCheckListIndx(stageTwoTechnical,index)}" />
				</p:selectBooleanCheckbox>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:24%;white-space: normal;">

 				<ui:remove><!-- #28784 --></ui:remove>
				<ui:fragment rendered="#{stageTwoTechnical.pmDocument eq null and stageTwoTechnical.qtChecklistId eq null}">
				<h:panelGroup id="technicalChecklistTitleHeader">
					<p:inputText required="true" id="techChecklistTitle"
						label="#{lbl['lbl.sc.spec.checklist.title']}" rendered="#{index eq specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1 or 
						stageTwoTechnical.title eq null}"
						value="#{stageTwoTechnical.title}" size="35" maxlength="1000"
						validator="#{specificationBackingBean.isContentExistUnicode}">
						<p:ajax event="change" process="@this,technicalChecklistTitleHeader" partialSubmit="true"
							update="technicalChecklisttypes"
							listener="#{specificationBackingBean.technicalCheckListTitleChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
					</p:inputText>
					<p:message id="techChecklistId" for="techChecklistTitle"
						display="icon"></p:message>
							<h:outputText value="#{stageTwoTechnical.title}" rendered="#{index ne specificationBackingBean.managedBean.scQtCheckSt2techProposal.size()-1}"></h:outputText>
						</h:panelGroup>
				</ui:fragment>

				<ui:fragment rendered="#{stageTwoTechnical.pmDocument ne null or stageTwoTechnical.qtChecklistId ne null}">
					<h:outputText value="#{stageTwoTechnical.title}"></h:outputText>
				</ui:fragment>

			</p:column>


			<p:column style="width:20%;white-space: normal;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.type']}" />
					<ac:iconTooltip id="technicalChecklistMechasine#{index}Sc"
						value="#{lbl['lbl.sc.type.technical.tooltip']}" />
				</f:facet>

				<h:panelGroup id="technicalChecklisttypes">

					<!-- #28784 -->
					<!-- 11104wip -start- -->
					<ui:fragment
						rendered="#{(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypePresentationDemo or 
							(stageTwoTechnical.pmDocument ne null and 
							(stageTwoTechnical.pmDocument.docDefinitionKey eq ParameterConst.documentDefinitionTypeTrustGate or 
							stageTwoTechnical.pmDocument.docDefinitionKey eq ParameterConst.documentDefinitionTypePlacehodler1 or 
							stageTwoTechnical.pmDocument.docDefinitionKey eq ParameterConst.documentDefinitionTypePlacehodler2 or 
							stageTwoTechnical.pmDocument.docDefinitionKey eq ParameterConst.documentDefinitionTypePlacehodler3)) or 
							(stageTwoTechnical.pmDocument eq null and 
							stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeTemplateSpecification or 
							(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and 
							specificationBackingBean.managedBean.sampleShowHide)))}">
						<!-- 11104wip -end- -->

						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"></h:outputText>
					</ui:fragment>


					<ui:fragment
						rendered="#{(stageTwoTechnical.pmDocument ne null and (stageTwoTechnical.pmDocument.docDefinitionKey eq 'UP' or stageTwoTechnical.pmDocument.docDefinitionKey eq 'KP' or stageTwoTechnical.pmDocument.docDefinitionKey  eq null))}">
						<c:if test="#{(specificationBackingBean.isQTStatusChecklistScoring() or (!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoringRevision())) or (!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.isChecklist())}"><!-- #15391 -->
						<p:selectOneMenu style="width:170px;" required="true"
							id="techChecklistTitlenullType" label="#{lbl['lbl.sc.type']}"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{stageTwoTechnical.definationType.parameterId}">
							<f:selectItems
								value="#{specificationBackingBean.getFinancialChecklistDefTypeValues(ParameterTypeConst.documentDefinitionType)}"></f:selectItems>
							<p:ajax event="change" process="@this"
								update="technicalChecklistsupplier,scoreView,uploadtech,technicalSpecificationStatus"
								partialSubmit="true"
								listener="#{specificationBackingBean.technicalCheckListTypeChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
						</p:selectOneMenu>
						<p:message id="techChecklistTitlenullType1"
							for="techChecklistTitlenullType" display="icon"></p:message>
							</c:if>
							<c:if test="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring() and !specificationBackingBean.managedBean.specMaintenance}">
							<h:outputText
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"></h:outputText>
							</c:if>
							<c:if test="#{specificationBackingBean.managedBean.specMaintenance and !specificationBackingBean.managedBean.isChecklist()}"><!-- #15391 -->
							<h:outputText
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"></h:outputText>
							</c:if>
					</ui:fragment>
					<!-- #28784 -->
					<!-- 11104wip -start- -->
					<ui:fragment
						rendered="#{stageTwoTechnical.definationType.parameterCode ne ParameterConst.documentDefinitionTypePresentationDemo and 
							stageTwoTechnical.pmDocument eq null and 
							(stageTwoTechnical.definationType.parameterCode ne ParameterConst.documentDefinitionTypeTemplateSpecification)}">
						<!-- 11104wip -end- -->
						<c:if
							test="#{specificationBackingBean.isQTStatusChecklistScoring() or (!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoringRevision())}">
							<p:selectOneMenu style="width:170px;" required="true"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								rendered="#{stageTwoTechnical.definationType.parameterCode ne ParameterConst.documentDefinitionTypeSample}"
								id="techChecklistTitletypenotnullType"
								label="#{lbl['lbl.sc.type']}"
								value="#{stageTwoTechnical.definationType.parameterId}">
								<!-- 11104wip -->
								<!--#21695 Farid Start -->
								<c:choose>
									<c:when
										test="#{specificationBackingBean.managedBean.qt.partial}">
										<f:selectItems
											value="#{specificationBackingBean.getTechnicalChecklistDefTypeValuesPartial(ParameterTypeConst.documentDefinitionType)}"></f:selectItems>
									</c:when>
									<c:otherwise>
										<f:selectItems
											value="#{specificationBackingBean.getTechnicalChecklistDefTypeValues(ParameterTypeConst.documentDefinitionType)}"></f:selectItems>
									</c:otherwise>
								</c:choose>
								<!--#21695 Farid End -->
								<p:ajax event="change" process="@this"
									update="technicalChecklistsupplier,scoreView,uploadtech,technicalSpecificationStatus"
									partialSubmit="true"
									listener="#{specificationBackingBean.technicalCheckListTypeChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
							</p:selectOneMenu>
							<p:message id="techChecklistTitletypenotnullType1"
								for="techChecklistTitletypenotnullType" display="icon"></p:message>
						</c:if>
						<c:if
							test="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring() and !specificationBackingBean.managedBean.specMaintenance}">
							<!-- 11104wip -->
							<ui:fragment
								rendered="#{stageTwoTechnical.definationType.parameterCode ne ParameterConst.documentDefinitionTypeSample}">
								<h:outputText
									rendered="#{stageTwoTechnical.definationType.parameterCode ne ParameterConst.documentDefinitionTypeSample}"
									value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"></h:outputText>
							</ui:fragment>
							<ui:fragment
								rendered="#{stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and !specificationBackingBean.managedBean.sampleShowHide}">
								<h:outputText
									rendered="#{stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and !specificationBackingBean.managedBean.sampleShowHide}"
									value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.definationType)}"></h:outputText>
							</ui:fragment>
							<!-- 11104wip -->
						</c:if>
						<!-- #31701 START -->
						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.specMaintenance and stageTwoTechnical.sampleWip!=true}">
							<!-- 11104wip -->
							<p:selectOneMenu style="width:170px;" required="true"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								id="techChecklistforSpecMaintenance"
								label="#{lbl['lbl.sc.type']}"
								rendered="#{stageTwoTechnical.sampleWip!=true}"
								value="#{stageTwoTechnical.definationType.parameterId}">
								<!-- 11104wip -->

								<f:selectItems
									value="#{specificationBackingBean.getTechnicalChecklistDefTypeValues(ParameterTypeConst.documentDefinitionType)}"></f:selectItems>

								<p:ajax event="change" process="@this"
									update="technicalChecklistsupplier,scoreView,uploadtech,technicalSpecificationStatus"
									partialSubmit="true"
									listener="#{specificationBackingBean.technicalCheckListTypeChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
							</p:selectOneMenu>

							<p:message id="techChecklistforSpecMaintenance1"
								for="techChecklistforSpecMaintenance" display="icon"></p:message>
						</ui:fragment>
						<!-- 11104wip -->
						<!-- #31701 END -->
					</ui:fragment>


				</h:panelGroup>
			</p:column>
			<p:column style="width:20%;white-space: normal;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.spec.supplier.action']}" />
					<ac:iconTooltip
						id="technicalChecklistSupplierActionMechasine#{index}Sc"
						value="#{lbl['lbl.sc.spec.supplier.action.tooltip']}" />
				</f:facet>

				<h:panelGroup id="technicalChecklistsupplier">

					<ui:fragment
						rendered="#{((stageTwoTechnical.pmDocument ne null and (stageTwoTechnical.pmDocument.docDefinitionKey eq 'TG' or stageTwoTechnical.pmDocument.docDefinitionKey eq 'TN' or stageTwoTechnical.pmDocument.docDefinitionKey eq 'TL' or stageTwoTechnical.pmDocument.docDefinitionKey eq 'NE')) or (stageTwoTechnical.pmDocument eq null and stageTwoTechnical.definationType.parameterCode eq 'TS'))}">

						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.action)}"></h:outputText>
					</ui:fragment>

					<ui:fragment
						rendered="#{((stageTwoTechnical.pmDocument ne null and (stageTwoTechnical.pmDocument.docDefinitionKey eq 'UP' or stageTwoTechnical.pmDocument.docDefinitionKey eq 'KP' or stageTwoTechnical.pmDocument.docDefinitionKey  eq null)) or(stageTwoTechnical.pmDocument eq null and stageTwoTechnical.definationType.parameterCode ne 'TS'))}">
						<c:if test="#{specificationBackingBean.isQTStatusChecklistScoring() or (!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoringRevision()) or (!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.isChecklist())}"><!-- #15391 -->
						<p:selectOneMenu styleClass="sample#{index}" style="width:170px;"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							rendered="#{stageTwoTechnical.definationType.parameterCode eq 'UP' and stageTwoTechnical.action.parameterCode eq null}"
							required="true" id="actionTitleActionnullType"
							label="#{lbl['lbl.sc.spec.supplier.action']}"
							value="#{stageTwoTechnical.action.parameterId}">
							<f:selectItems
								value="#{specificationBackingBean.managedBean.technicalChecklistAction}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="scoreView,uploadtech,technicalSpecificationStatus,technicalChecklistsupplier"
								listener="#{specificationBackingBean.technicalChecklistDropDownActionChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
						</p:selectOneMenu>
						<p:message id="actionTitleActionnullType1"
							for="actionTitleActionnullType" display="icon"></p:message>



						<p:selectOneMenu value="#{stageTwoTechnical.action.parameterId}"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							rendered="#{stageTwoTechnical.definationType.parameterCode eq 'UP' and stageTwoTechnical.action.parameterCode ne null}"
							required="true" id="actionActionTitlenotnullType"
							label="#{lbl['lbl.sc.spec.supplier.action']}"
							style="width:170px;">
							<f:selectItems
								value="#{specificationBackingBean.PTJUploadDropDownActionValues}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="scoreView,uploadtech,technicalSpecificationStatus,technicalChecklistsupplier"
								listener="#{specificationBackingBean.technicalChecklistDropDownActionChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
						</p:selectOneMenu>

						<p:message id="actionActionTitlenotnullType1"
							for="actionActionTitlenotnullType" display="icon"></p:message>
							</c:if>
							<ui:fragment rendered="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring() and stageTwoTechnical.definationType.parameterCode eq 'UP' and !specificationBackingBean.managedBean.specMaintenance}">
							<h:outputText
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.action)}"></h:outputText>
							</ui:fragment>
						<h:outputText
							rendered="#{stageTwoTechnical.definationType.parameterCode ne 'UP'}"
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.action)}"></h:outputText>
							
							<h:outputText rendered="#{(specificationBackingBean.managedBean.specMaintenance and stageTwoTechnical.definationType.parameterCode eq 'UP') and !specificationBackingBean.managedBean.isChecklist()}"
							value="#{specificationBackingBean.getParameterDesc(stageTwoTechnical.action)}"></h:outputText><!-- #15391 -->
							
					</ui:fragment>
				</h:panelGroup>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.scoring']}"
				style="width:5%;white-space: normal;text-align: center;">
				<h:panelGroup id="scoreView">
					<p:selectBooleanCheckbox value="#{stageTwoTechnical.scoringReq}"
						disabled="true"
						rendered="#{((stageTwoTechnical.definationType.parameterCode eq ParameterConst. documentDefinitionTypeUpload and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionView) or(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeTemplateSpecification and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionInput) or(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionManualSubmission and specificationBackingBean.managedBean.sampleShowHide) or stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypePresentationDemo)}"> <!-- #28784#11104wip -->
					</p:selectBooleanCheckbox>
				
					<p:selectBooleanCheckbox value="#{stageTwoTechnical.scoringReq}"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						rendered="#{(!(stageTwoTechnical.definationType.parameterCode eq ParameterConst. documentDefinitionTypeUpload and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionView) and !(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeTemplateSpecification and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionInput) and !(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionManualSubmission) and !(stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypePresentationDemo))}"> <!-- #28784#11104wip -->
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="technicalSpecificationStatus,technicalChecklistEditActionView"
							listener="#{specificationBackingBean.technicalCheckListScoreReqChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
					</p:selectBooleanCheckbox>
					<!-- #11104wip -->
					<p:selectBooleanCheckbox value="#{stageTwoTechnical.scoringReq}"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						rendered="#{stageTwoTechnical.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample and stageTwoTechnical.action.parameterCode  eq ParameterConst.checklistActionManualSubmission and !specificationBackingBean.managedBean.sampleShowHide}"> <!-- #11104 -->
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="technicalSpecificationStatus,technicalChecklistEditActionView"
							listener="#{specificationBackingBean.technicalCheckListScoreReqChange(index,specificationBackingBean.managedBean.scQtCheckSt2techProposal)}"></p:ajax>
					</p:selectBooleanCheckbox>
					<!-- #11104wip -->
				</h:panelGroup>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.specification.status']}"
				style="width:7%;white-space: normal;">
				<h:panelGroup id="technicalSpecificationStatus">
					<h:outputText
						value="#{specificationBackingBean.getStatusDescById(stageTwoTechnical.pmStatus.statusId)}"></h:outputText>
				</h:panelGroup>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.document']}"
				style="width:16%;white-space: normal;text-align: center;">

				<!-- <h:panelGroup id="document"> rendered="#{stageTwoTechnical.definationType.parameterId eq '184'}"-->
				<h:panelGroup id="uploadtech">

					<ui:fragment
						rendered="#{stageTwoTechnical.definationType.parameterCode eq 'UP'}">
						<ac:scSingleFileUploadButton id="sctcUploadBtn"
							popupWidgetVar="scChecklistUploadDlg"
							attachment="#{stageTwoTechnical.scQtCheckListAttachment}"
							readonly="#{specificationBackingBean.managedBean.readOnly}"
							deleteFileUploadListener="specificationBackingBean.deleteCheckListAttachmentFile"
							rowIndex="#{index}">
							<f:setPropertyActionListener for="actionEvent"
								value="#{stageTwoTechnical}"
								target="#{specificationBackingBean.managedBean.scQtChecklist}" />
						</ac:scSingleFileUploadButton>
					</ui:fragment>
				</h:panelGroup>
			</p:column>
			<p:column style="width:5%;text-align: center;">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring()}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.action']}" />
				</f:facet>
