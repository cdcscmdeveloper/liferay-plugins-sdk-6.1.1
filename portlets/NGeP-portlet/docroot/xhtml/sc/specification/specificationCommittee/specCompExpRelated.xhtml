
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup >

		<table class="ui-datatable ui-widget"
			style="width: 100%; border-collapse: collapse;">

			<thead class="ui-datatable-header">
				<tr class="ui-widget-header">
					<!-- #40786 -->
					<th style="width: 60%;" class="ui-state-default" ><h:outputText
							value="#{lbl['lbl.sc.fin.comp.exp.federal.gov']}"
							rendered="#{SourcingConstants.FINANCIAL_GOVERNMENT_COMPANY_EXPERIENCE eq docDefKey}" />

						<h:outputText
							value="#{lbl['lbl.sc.fin.comp.exp.non.federal.gov']}"
							rendered="#{SourcingConstants.FINANCIAL_NONGOVERNMENT_COMPANY_EXPERIENCE eq docDefKey}" />
					</th>
					<th style="width: 10%" class="ui-state-default" ><h:outputText
							value="#{lbl['lbl.sc.comp.exp.inactive']}" /></th>
					<th style="width: 10%" class="ui-state-default" ><h:outputText
							value="#{lbl['lbl.sc.comp.exp.effective']}" /></th>
					<th style="width: 10%" class="ui-state-default" ><h:outputText
							value="#{lbl['lbl.sc.comp.exp.expired']}" /></th>
					<th style="width: 10%" class="ui-state-default"><h:outputText
							value="#{lbl['lbl.sc.comp.exp.terminated']}" /></th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td style="width: 60%; padding: 5px;"><h:outputText
							value="#{lbl['lbl.sc.supplier.proposal.comp.exp.no.of.contract']}" /></td>
					<td colspan="4" rowspan="2"
						style="text-align: center; vertical-align: middle;"><h:outputText
							value="#{lbl['lbl.datatable.msg.no.records.found']}" /></td>
				</tr>
				<tr>
					<td style="padding: 5px;"><h:outputText
							value="#{lbl['lbl.sc.supplier.proposal.comp.exp.val.contract']}" /></td>
				</tr>
			</tbody>

		</table>

	</h:panelGroup>

	<p:spacer height="20px;"></p:spacer>
	<p:dataTable id="#{cmpExpPrcNonPrc}" rowIndexVar="index"
		var="experience"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		rowKey="#{experience}" style="width:100%">
		<ac:paginator for="#{cmpExpPrcNonPrc}"></ac:paginator>
		<p:column style="width:10%;white-space: normal;word-wrap: break-word;"
			headerText="#{lbl['lbl.sm.projDtls.clientName']}">
			<p:inputText></p:inputText>
		</p:column>
		<p:column style="width:20%;"
			headerText="#{lbl['lbl.sc.fin.prc.proj.cont.title']}">
			<h:outputText style="white-space: normal;word-wrap: break-word;" />
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.file.ref.no']}">
			<p:inputText></p:inputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.letter.accept.no']}">
			<p:inputText></p:inputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.eff.date']}">
			<p:inputText></p:inputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.exp.date']}">
			<p:inputText></p:inputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.value.amt']}">
			<p:inputText></p:inputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.cont.status']}" />
				<ac:iconTooltip value="#{lbl['lbl.sc.fin.cont.status.tooltip']}" />
			</f:facet>
		</p:column>
		<p:column style="width:10%;white-space: normal;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.letter.of.acceptance']}" />
				<ac:iconTooltip escape="false"
					value="#{lbl['lbl.sc.fin.letter.of.acceptance.tooltip']}" />
			</f:facet>
		</p:column>
	</p:dataTable>

	<p:spacer height="10px"></p:spacer>
	<table>
		<tr>
			<td style="width: 150px;"><p:outputLabel
					value="#{lbl['lbl.sc.fin.comp.exp.tot.no.of.contracts']}" /></td>
			<td><p:inputText readonly="true" disabled="true"></p:inputText>

			</td>
		</tr>
		<tr>
			<td style="width: 230px;"><p:outputLabel
					value="#{lbl['lbl.sc.spec.total.contract.amount']}" /></td>
			<td><p:inputText readonly="true" disabled="true"></p:inputText>

			</td>
		</tr>

	</table>

</ui:composition>
