<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalCheckListSampleItemSearchId"
		header="#{lbl['lbl.sc.qt.sampel.technical.panel.search.criteria']}"
		toggleable="true">

		<table>

			<tr>
				<td valign="top"><h:outputLabel
						value="#{lbl['lbl.sc.mr.item.name']}"></h:outputLabel></td>
				<td colspan="3"><p:inputText disabled="#{specificationBackingBean.managedBean.readOnly}"
						style="width:670px; margin-bottom:5px;" maxlength="100"
						value="#{specificationBackingBean.managedBean.sampleItemName}" >
					<p:ajax event="change" process="@this" update="@this"></p:ajax>	
						</p:inputText>
						</td>
			</tr>
		</table>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.search']}" partialSubmit="true"
			rendered="#{((!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring()) or (!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.isQTStatusChecklistScoringRevision()) or isReadOnlyOrSpecMain)}"
			action="#{specificationBackingBean.retriveSampleSpecmaster(specificationBackingBean.managedBean.sampleCheckList,specificationBackingBean.managedBean.sampleItemName)}"
				styleClass="BtnSpacing" process="@this,technicalCheckListSampleItemSearchId" update="technicalSampleTemplateQuestionsTableId" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}" 
			rendered="#{((!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring()) or (!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.isQTStatusChecklistScoringRevision()) or isReadOnlyOrSpecMain)}"
			action="#{specificationBackingBean.resetSampleItem}"
				styleClass="BtnSpacing" partialSubmit="true" update="technicalCheckListSampleItemSearchId"
				process="@this" />
		</div>




	</p:panel>
</ui:composition>
