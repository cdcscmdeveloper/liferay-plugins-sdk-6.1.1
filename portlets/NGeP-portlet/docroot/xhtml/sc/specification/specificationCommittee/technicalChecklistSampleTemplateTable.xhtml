<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalCheckListSampleTemplateTable"
		header="#{lbl['lbl.sc.qt.sampel.technical.panel.template.header']}"
		toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.spec.sample.spec.main.instruction']}"
			escape="false" />


		<p:dataTable var="technicalSampletemplate"
			id="technicalSampleTemplateTableId"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{specificationBackingBean.managedBean.sampleSpecCheckList}"
			rowIndexVar="index" style="width:100%"
			rowKey="#{technicalSampletemplate}">

			<ui:param name="samplerequired"
				value="#{specificationBackingBean.checkTemplateRequiredSample(technicalSampletemplate)}"></ui:param>

			<p:column headerText="#{lbl['lbl.sc.qt.sampel.technical.template']}"
				style="width:65%;white-space: normal;">
				<h:outputText value="#{technicalSampletemplate.title}"></h:outputText>
			</p:column>


			<p:column
				headerText="#{lbl['lbl.sc.qt.spec.sample.question.requird.sample']}"
				style="width:20%; white-space:normal;">
			        <div style="text-align: center;">
				<h:outputText
					value="#{lbl[samplerequired ? 'lbl.txt.yes' : 'lbl.txt.no']}"></h:outputText>
				 </div>
			</p:column>

			<p:column style="width:15%;text-align: center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />

				</f:facet>
				<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
					action="#{specificationBackingBean.sampleTemplateView(technicalSampletemplate)}"
					partialSubmit="true" />
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
