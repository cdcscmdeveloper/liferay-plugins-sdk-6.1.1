<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalCheckListSampleTemplateTable"
		header="#{lbl['lbl.sc.qt.sampel.technical.panel.template.header']}" 
		toggleable="true">
         <h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.spec.sample.spec.main.instruction']}" escape="false" /><!-- #11104 Reendorse -->

		<p:dataTable var="technicalSampletemplate"
			id="technicalSampleTemplateTableId"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{specificationBackingBean.managedBean.sampleSpecCheckList}"
			rowIndexVar="index" style="width:100%"
			rowKey="#{technicalSampletemplate}">
    
<ui:param name="samplerequired"
				value="#{specificationBackingBean.checkTemplateRequiredSample(technicalSampletemplate)}"></ui:param><!-- #11104 Reendorse -->
			<p:column headerText="#{lbl['lbl.sc.qt.sampel.technical.template']}"
				style="width:65%;white-space: normal;"><!-- #11104 Reendorse -->
				<h:outputText value="#{technicalSampletemplate.title}"></h:outputText>
			</p:column>
              <p:column 
						headerText="#{lbl['lbl.sc.qt.spec.sample.question.requird.sample']}"
						style="width:20%; white-space:normal;"><!-- #11104 Reendorse -->
						<div style="text-align: center;">
						<h:outputText  value="#{lbl[samplerequired ? 'lbl.txt.yes' : 'lbl.txt.no']}"></h:outputText>
						</div>
			</p:column><!-- #11104 Reendorse -->         
            <p:column style="width:15%;text-align: center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />

				</f:facet>
				<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this" 
				action="#{specificationBackingBean.sampleTemplateView(technicalSampletemplate)}"	partialSubmit="true" />
					</p:column>
					
		</p:dataTable>
	</p:panel>
</ui:composition>
