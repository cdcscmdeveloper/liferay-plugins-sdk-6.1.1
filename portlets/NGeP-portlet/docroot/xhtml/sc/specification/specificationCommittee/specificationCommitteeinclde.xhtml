<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="border: 0px; width: 100%">
		<tr>
			<td width="100%"><p:blockUI block=":form"
					widgetVar="blockWidget">
					<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
				</p:blockUI> <p:messages id="speccreatemessages" showDetail="true"
					showSummary="false"
					autoUpdate="#{specificationBackingBean.managedBean.autoUpdate}"
					closable="true" severity="error, info" /> <ui:include
					src="/xhtml/sc/specification/specificationCommittee/specificationCommitteeButtons.xhtml" />
				<ui:include src="/xhtml/sc/specification/common/commonHeader.xhtml" />
				<ui:remove>#10141 Start Vinod -- Added print button to print screen</ui:remove>
				<!-- <p:commandButton value="#{lbl['lbl.btn.print']}" rendered="#{specificationBackingBean.renderPtintButtonForSpecCommittee()}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					onclick="this.form.target='_blank'" process="@form"
					style="float:right;" action="#{specificationBackingBean.downloadScoreReport}" /> -->
				<p:commandButton value="#{lbl['lbl.btn.print']}" rendered="#{specificationBackingBean.renderPtintButtonForSpecCommittee()}"
					oncomplete="scoreDlg.show();"
					process="@this"
					style="float:right;" action="#{specificationBackingBean.getScoreReport}" />
				<ui:remove>#10141 End Vinod </ui:remove>
				<ui:include
					src="/xhtml/sc/specification/specificationCommittee/specificationCommitteeMenu.xhtml" />
			</td>
		</tr>
	</table>
<!-- #29732 Start - reOpen Fix -->
	<ac:qtCategoryChangeAlertPopup
		catCodeList="#{specificationBackingBean.managedBean.catCodeList}"
		widget="catCodeChangeAlert" />
<!-- #29732 End - reOpen Fix -->
	<p:dialog id="scoreDlgId" widgetVar="scoreDlg" modal="true"
		dynamic="true" resizable="false" width="1000px" closable="false"
		height="500px" styleClass="pop_up_top">
		<p:media value="#{specificationBackingBean.scoreReport}"
			width="100%" height="450px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.close']}" action="#{specificationBackingBean.closeScoreReport}"
						onclick="scoreDlg.hide()" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
