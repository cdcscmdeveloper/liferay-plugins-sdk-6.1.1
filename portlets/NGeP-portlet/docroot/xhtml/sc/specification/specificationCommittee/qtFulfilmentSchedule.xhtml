<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="frequency">
		<!-- new #25726 - remove Non Periodic Schedule to the rendered -->
		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{qTDetailBB.managedBean.fulfilmentType eq ParameterConst.fulfilmentTypeScheduled}">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction']}"
					escape="false" />
					<br/>
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction.delete']}"
					escape="false" />

				<p:dataTable id="frequencySchedule" var="frequency" rows="10"
					rendered="#{qTDetailBB.managedBean.fulfilmentType eq ParameterConst.fulfilmentTypeScheduled}"
					rowIndexVar="index" widgetVar="freqScheduleWidget"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{qTDetailBB.managedBean.scheduleList}">
					<ac:paginator for="frequencySchedule" />
					<p:column style="width:2%;">
						<f:facet name="header">
							<p:selectBooleanCheckbox
								value="#{qTDetailBB.managedBean.selectAll}">
								<p:ajax partialSubmit="true" process="@this"
									update=":form:frequencySchedule,:form:deleteButtonId"
									listener="#{qTDetailBB.selectAllSchedule}" />
							</p:selectBooleanCheckbox>
						</f:facet>

						<p:selectBooleanCheckbox
							value="#{frequency.selected}"
							styleClass="myCustomChekBox">
							<p:ajax event="change"
								update=":form:frequencySchedule,:form:deleteButtonId"
								listener="#{qTDetailBB.selectOneScheCheckboxSelect}"></p:ajax>
						</p:selectBooleanCheckbox>
					</p:column> 

					<p:column>

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.schedule.no']}" />
						</f:facet>
						<p:inputText value="#{frequency.scheduleNo}" required="true"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							style="text-align:right;" maxlength="3"
							label="#{lbl['lbl.sc.spec.schedule.no']}" size="3"
							id="scheduleNum">
							<p:ajax partialSubmit="true" update=":form:frequencySchedule, :form:addButtonId" process="@form" />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="freqScheduledid" for="scheduleNum" display="icon"></p:message>
					</p:column>
					<p:column style="width:20%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:140px;"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							value="#{frequency.startMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    partialSubmit="true"
								listener="#{qTDetailBB.calculateSchedulePercentage(frequency,'true')}"></p:ajax>
						</p:selectOneMenu>
						<!-- <p:calendar value="#{frequency.fromDate}" showOn="button"
						pattern="MM/yyyy"></p:calendar> -->
					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.year']}" />
						</f:facet>
						<p:selectOneMenu value="#{frequency.startYear}"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							style="width:110px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    partialSubmit="true"
								listener="#{qTDetailBB.calculateSchedulePercentage(frequency,'true')}"></p:ajax>
						</p:selectOneMenu>


					</p:column>

					<p:column style="width:20%">
					<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:140px;" id="scheduleendMonth"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							value="#{frequency.endMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    partialSubmit="true"
								listener="#{qTDetailBB.calculateSchedulePercentage(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:15%">
					<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.year']}" />
						</f:facet>
						<p:selectOneMenu value="#{frequency.endYear}"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							style="width:110px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    partialSubmit="true"
								listener="#{qTDetailBB.calculateSchedulePercentage(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.total.months']}"
						style="width:5%">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}"></h:outputText>
						</h:panelGroup>
					</p:column>

					<p:column style="width:20%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.schedule.type']}" />
							<ac:iconTooltip id="frequencyScheduleType#{index}Sc"
								value="#{lbl['lbl.sc.schedule.type.tooltip']}" />
						</f:facet>

						<h:outputText value="#{specificationBackingBean.getParameterDesc(frequency.scheduleType)}"/>
					</p:column>

				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton id="addButtonId" value="#{lbl['lbl.btn.add']}"
					disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
						partialSubmit="true" process="@this" update="frequencySchedule"
						action="#{qTDetailBB.addScheduleDetails}"
						oncomplete="freqScheduleWidget.paginator.endLink.click();">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton id="deleteButtonId"
						value="#{lbl['lbl.ct.delete']}" partialSubmit="true"
						disabled="#{qTDetailBB.deleteselectedList(qTDetailBB.managedBean.scheduleList) or qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
						process="@this" onsuccess="freqScheduleObj.show()">
					</p:commandButton>
				</div>
				<p:confirmDialog id="freqScheduleObj" widgetVar="freqScheduleObj"
					message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
					closable="true" appendToBody="true"
					header="#{lbl['lbl.msg.confirm.delete.header']}">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
							partialSubmit="true" oncomplete="freqScheduleObj.hide();"
							update=":form:frequencySchedule,:form:deleteButtonId"
							action="#{qTDetailBB.deleteFreqScheduleDetails}">
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.no']}"
							onclick="freqScheduleObj.hide();" type="button" />
					</div>
				</p:confirmDialog>

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.freq.schedule.loa.instruction']}"
					escape="false" />
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>
	<h:panelGroup id="progressive">
		<c:if
			test="#{qTDetailBB.managedBean.fulfilmentType eq ParameterConst.fulfilmentTypeAsAndWhen or qTDetailBB.managedBean.qt.scheduleType eq ParameterConst.periodicScheduleTypeProgressivePayment}">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction']}" escape="false" />
				<br />
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction.delete']}" escape="false" />

				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index" rows="10" widgetVar="progPaymentWidget"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{qTDetailBB.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />
					<p:column style="width:2%;">
						<f:facet name="header">
							<p:selectBooleanCheckbox
								value="#{qTDetailBB.managedBean.selectAll}">
								<p:ajax partialSubmit="true" process="@this"
									update=":form:progressivePayment,:form:progPayDeleteButtonId"
									listener="#{qTDetailBB.selectAllSchedule}" />
							</p:selectBooleanCheckbox>
						</f:facet>

						<p:selectBooleanCheckbox
							value="#{payment.selected}"
							styleClass="myCustomChekBox">
							<p:ajax event="change"
								update=":form:progressivePayment,:form:progPayDeleteButtonId"
								listener="#{qTDetailBB.selectOneScheCheckboxSelect}"></p:ajax>
						</p:selectBooleanCheckbox>
					</p:column>

					<p:column style="width:5%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.phase']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseNo}" required="true"
							style="text-align:right;"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							label="#{lbl['lbl.sc.spec.phase']}" id="progressivePhase"
							maxlength="3" size="3">

							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="phaseNumId" for="progressivePhase" display="icon"></p:message>
					</p:column>
					<p:column style="width:20%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							required="true" id="progressivePhasedesc" style="width:130px;"
							label="#{lbl['lbl.sc.description']}">
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
						</p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:130px;"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							value="#{payment.startMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}"></f:selectItems>
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{qTDetailBB.calculateProgressiveStartMonth(payment)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.year']}" />
						</f:facet>

						<p:selectOneMenu value="#{payment.startYear}"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							style="width:130px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{qTDetailBB.calculateProgressiveStartMonth(payment)}"></p:ajax>
						</p:selectOneMenu>


					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:130px;" id="paymentEndMonth"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							value="#{payment.endMonth}">

							<f:selectItems
								value="#{specificationBackingBean.monthDropDownValues}">
							</f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{qTDetailBB.calculateProgressivepayment(payment)}"></p:ajax>
						</p:selectOneMenu>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}" style="width:15%">
						<p:selectOneMenu value="#{payment.endYear}"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							style="width:130px;">
							<f:selectItems
								value="#{specificationBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{qTDetailBB.calculateProgressivepayment(payment)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.percentage']}" />
							<ac:iconTooltip id="progressivePercentage#{index}Sc"
								value="#{lbl['lbl.sc.spec.percentage.tooltip']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true"
							disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
							id="progressivePercentage" style="width:100px;text-align:right;"
							label="#{lbl['lbl.sc.percentage']}" maxlength="18">
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>

				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton id="progPayAddButtonId" value="#{lbl['lbl.btn.add']}"
					partialSubmit="true" process="@this"  disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
					update="progressivePayment" action="#{qTDetailBB.addProgressiveDetails}"
					 oncomplete="progPaymentWidget.paginator.endLink.click();">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton id="progPayDeleteButtonId" value="#{lbl['lbl.ct.delete']}" partialSubmit="true" 
					disabled="#{qTDetailBB.managedBean.readOnly or qTDetailBB.managedBean.genInfo}"
					process="@this"  onsuccess="progPayObj.show()">
					</p:commandButton>
				</div>
				<p:confirmDialog id="progPayObj" widgetVar="progPayObj" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                    <div class="ppRightBtn">
			               <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this" partialSubmit="true"  oncomplete="progPayObj.hide();"
			                   update=":form:progressivePayment,:form:deleteButtonId" action="#{qTDetailBB.deleteProgPaymentDetails}" >
			               </p:commandButton>
				           <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="progPayObj.hide();" type="button" />
		            </div>
               </p:confirmDialog>

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.progressive.payment.loa.instruction']}"
					escape="false" />



			</p:panel>
		</c:if>
	</h:panelGroup>


</ui:composition>
