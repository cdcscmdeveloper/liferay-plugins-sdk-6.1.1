<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:dialog id="financialChecklistPreviewId" widgetVar="financialChecklistPreview"
		resizable="false" position="top" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.spec.header.checklist.preview']}" width="650" height="550">
		
	<p:panel id="financialChecklistPreviewPanel1Id" header="#{lbl['lbl.sc.spec.financial.checklist.preview.printing']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.financial.checklist.preview.printing.instruction1']}" /><br />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.financial.checklist.preview.printing.instruction2']}" /><br />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.financial.checklist.preview.printing.instruction3']}" /><br />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.financial.checklist.preview.printing.instruction4']}" />
			
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.download']}" partialSubmit="true"
				action="#{specificationBackingBean.generateFinancialChecklistPreviewPdfFromVelocity(specificationBackingBean.managedBean.scQtCheckSt2financeProposalList)}"
				styleClass="BtnSpacing" process="@this"  />
		</div>
	</p:panel>
		
	<p:panel id="financialChecklistPreviewPanel2Id" header="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing']}" toggleable="true">
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing.instruction1']}" /><br />
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing.instruction2']}" /><br />
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing.instruction3']}" /><br />
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing.instruction4']}" /><br />
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing.instruction5']}" />
		
		<p:dataTable id="financialChecklistTitleListId"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{specificationBackingBean.managedBean.finChecklistSelect}"
			first="#{specificationBackingBean.managedBean.financialPreviewTableRow}"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2financeProposalList}"
			var="finChecklist" rowIndexVar="index" rowKey="#{finChecklist}" width="100%">
				
			<p:column style="width:10%;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox value="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}">
					
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{finChecklist.selected}">		
											
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}" style="width:90%;white-space: normal;">

				<h:outputText value="#{finChecklist.title}"></h:outputText>

			</p:column>
				
		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.download']}" partialSubmit="true"
				action="#"
				styleClass="BtnSpacing" process="@this"  />
		</div>
	</p:panel>
	
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.ok']}" partialSubmit="true"
			onclick="financialChecklistPreview.hide();"
			styleClass="BtnSpacing" process="@this"  />
	</div>
		
</p:dialog>
</ui:composition>
