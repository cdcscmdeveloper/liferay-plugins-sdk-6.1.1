<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="financialChecklistPreviewId"
		widgetVar="financialChecklistPreview" resizable="false" position="top"
		styleClass="pop_up_top"
		header="#{lbl['lbl.sc.spec.header.checklist.preview']}" width="650"
		height="650">
		<p:ajax event="close" oncomplete="blockWidget.hide()"
			update="@all"
			actionListener="#{specificationBackingBean.closeFinChecklistPreview()}" />

		<p:panel id="financialChecklistPreviewPanel1Id"
			header="#{lbl['lbl.sc.spec.financial.checklist.preview.printing']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.financial.checklist.preview.printing.instructions']}"
				escape="false" />

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.download']}"
					partialSubmit="true" ajax="false"
					action="#{specificationBackingBean.downloadFinancialChecklistSummaryReport()}"
					styleClass="BtnSpacing" process="@this" />
			</div>
		</p:panel>

		<p:panel id="financialChecklistPreviewPanel2Id"
			header="#{lbl['lbl.sc.spec.financial.checklist.element.details.preview.printing']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.technical.financial.checklist.element.details.preview.printing.instructions']}"
				escape="false" />

			<p:dataTable id="financialChecklistTitleListId"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selection="#{specificationBackingBean.managedBean.finChecklistSelect}"
				first="#{specificationBackingBean.managedBean.financialPreviewTableRow}"
				value="#{specificationBackingBean.managedBean.finChecklistPreview}"
				var="finChecklist" rowIndexVar="index" rowKey="#{finChecklist}"
				width="100%">

				<p:column style="width:10%;text-align:center;">
					<f:facet name="header">
						<p:selectBooleanCheckbox
							value="#{specificationBackingBean.managedBean.selectAllFinPreview}">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=financialChecklistTitleListId])"
								listener="#{specificationBackingBean.selectAll(specificationBackingBean.managedBean.selectAllFinPreview, specificationBackingBean.managedBean.finChecklistPreview)}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{finChecklist.selected}">
						<p:ajax partialSubmit="true" process="@this" update="@this"
							listener="#{specificationBackingBean.updateSelectedFinancialChecklistPreviewIndx(finChecklist,index)}" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
					style="width:90%;white-space: normal;">

					<h:outputText value="#{finChecklist.title}"></h:outputText>

				</p:column>

			</p:dataTable>
			<div align="right">
				<ui:remove> Hidden Download Button to call actual method to download </ui:remove>
				<p:commandButton style="display:none;" id="finDownloadButton"
					value="#{lbl['lbl.btn.download']}" ajax="false"
					binding="#{finButton}"
					action="#{specificationBackingBean.downloadFinancialChecklistDetailedReport(finButton)}" />
				<ui:remove> This method will check if atleast one checklist is selected </ui:remove>
				<p:commandButton value="#{lbl['lbl.btn.download']}" ajax="true"
					styleClass="BtnSpacing"
					action="#{specificationBackingBean.validateAtleastOneChecklistSelected(finButton.clientId,false)}"
					process="@this" update="@([id$=techDownloadButton])" />
			</div>
		</p:panel>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" partialSubmit="true"
				oncomplete="blockWidget.hide()" update="@([id$=financeProposaltwo])"
				actionListener="#{specificationBackingBean.closeFinChecklistPreview()}"
				onclick="financialChecklistPreview.hide();" styleClass="BtnSpacing"
				process="@this" />
		</div>

	</p:dialog>
</ui:composition>
