<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="financialCreditFacility" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"
			severity="error, info"></p:messages>
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> <p:commandButton
						value="#{lbl['lbl.btn.print']}" type="button">
						<p:printer target="financialCheckListCreditFecility" />
					</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{((specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.isQTStatusChecklistScoring()) or(!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.isQTStatusChecklistScoringRevision()))}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveCheckListScores}">
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.criteriaType}"
							value="51" />

					</p:commandButton></td>
			</tr>
		</table>
		<h:panelGroup id="financialCheckListCreditFecility">
			<ui:include
				src="/xhtml/sc/specification/specificationCommittee/checklistHeader.xhtml" />


			<p:panel header="#{lbl['lbl.sc.spec.credit.facility']}"
				toggleable="true">
				<p:dataTable id="credit" rowIndexVar="index" var="experience"
					rowKey="#{experience}">
					<ac:paginator for="credit"></ac:paginator>
					<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
					<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
						<p:inputText></p:inputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.address']}">
						<p:inputText></p:inputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.credit.type']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.amt.credit']}">
						<p:inputText></p:inputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.amt.paid']}">

						<p:inputText>

						</p:inputText>
					</p:column>
				</p:dataTable>

				<p:spacer height="10px"></p:spacer>
				<table>
					<tr>
						<td style="width: 157px;"><h:outputLabel
								value="#{lbl['lbl.sc.spec.total.credit']}"></h:outputLabel></td>
						<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
						<p:spacer height="10"></p:spacer>
					</tr>
					<tr>
						<td style="width: 157px;"><h:outputLabel
								value="#{lbl['lbl.sc.spec.total.credit.amount.paid']}"></h:outputLabel></td>
						<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
						<p:spacer height="10"></p:spacer>
					</tr>
					<tr>
						<td style="width: 157px;"><h:outputLabel
								value="#{lbl['lbl.sc.spec.total.credit.percentage.paid']}"></h:outputLabel></td>
						<td><p:inputText readonly="true" disabled="true"></p:inputText>
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.total.credit.percentage.paid.tooltip']}" />
						</td>
					</tr>
				</table>
			</p:panel>

			<p:panel id="financialCreditFacilityScores"
				header="#{lbl['lbl.sc.spec.score.total.credit.facility']}"
				toggleable="true"
				rendered="#{specificationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<table>
					<tr>
						<td style="width: 150px;"><ui:fragment
								rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
								<p:outputLabel value="*" styleClass="mandatory"
									style="float : left"></p:outputLabel>
							</ui:fragment> <p:outputLabel style="float : left"
								value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
						<td><p:selectOneMenu required="true"
								style="width: 180px;margin-bottom: 5px;"
								disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
								label="#{lbl['lbl.sc.spec.asset.score.type']}"
								id="fincreditFacilityAutoScore"
								value="#{specificationBackingBean.managedBean.checklistScoreType}">
								<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
								<p:ajax event="change"
									update="creditFacility,financialCreditFacilityScores"
									listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
							</p:selectOneMenu> <p:message id="fincreditFacilityAutoScoreId"
								for="fincreditFacilityAutoScore" display="icon"></p:message></td>
						<td><ac:iconTooltip
								value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
						</td>
					</tr>
				</table>

				<h:panelGroup id="creditFacility">
					<h:panelGroup
						rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

						<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
						<h:panelGroup id="creditFacilityGroupId">
							<ui:param name="scoringList"
								value="#{specificationBackingBean.managedBean.checkListScore}" />
							<ui:param name="selectionList"
								value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
							<ui:param name="componentName" value="creditFacility" />
							<ui:param name="scoringPnlId" value="creditFacilityId" />
							<ui:param name="scoringPnlName"
								value="#{lbl['lbl.sc.spec.score.total.credit.facility']}"></ui:param>
							<ui:include
								src="/xhtml/sc/specification/specificationCommittee/scoring.xhtml"></ui:include>
							<div align="right">
								<p:commandButton value="#{lbl['lbl.btn.add']}"
									styleClass="BtnSpacing"
									disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
									process="@this,#{scoringPnlId}" partialSubmit="true"
									actionListener="#{specificationBackingBean.addScoring(51)}"
									update="#{scoringPnlId}" />
								<p:commandButton value="#{lbl['lbl.btn.delete']}"
									styleClass="BtnSpacing"
									disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
									process="@this" partialSubmit="true"
									oncomplete="financialCreditFacilityDeletePopUp.show();"
									update="@([id$=#{financialCreditFacilityDeleteId}])">
									<f:setPropertyActionListener
										target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
										value="#{false}" />
								</p:commandButton>

							</div>
							<ui:param name="financialCreditFacilityDeleteId"
								value="financialCreditFacilityDeleteId"></ui:param>

							<ac:confirmationPopup id="#{financialCreditFacilityDeleteId}"
								widget="financialCreditFacilityDeletePopUp" width="450"
								height="100"
								okAction="specificationBackingBean.deleteCheckListScoreContrats"
								title="#{lbl['lbl.sc.spec.credit.facility']}"
								content="#{lbl['lbl.sc.dialog.confirm.message']}"
								update="@([id$=#{scoringPnlId}])" />
						</h:panelGroup>

					</h:panelGroup>

					<h:panelGroup
						rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
						<table>
							<tr>
								<td style="width: 150px;"><ui:fragment
										rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
										<p:outputLabel value="*" styleClass="mandatory"
											style="float : left"></p:outputLabel>
									</ui:fragment> <p:outputLabel style="float : left"
										value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel></td>
								<td><p:inputText maxlength="18" id="creditFacilityScore"
										style="text-align:right;"
										disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
										label="#{lbl['lbl.sc.spec.max.score']}" required="true"
										value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
										<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
										<p:ajax  event="change" process="@this" partialSubmit="true" update="financialCreditFacilityScores"></p:ajax>                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          						(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.62.11)(PORT=1521))(ADDRESS=(PROTOCOL=TCP)(HOST=192.168.62.11)(PORT=1521))
									</p:inputText> <p:message id="finCreditfacilityMaxScore"
										for="creditFacilityScore" display="icon"></p:message></td>
							</tr>
						</table>
					</h:panelGroup>
				</h:panelGroup>
			</p:panel>
		</h:panelGroup>
	</ui:define>
</ui:composition>
