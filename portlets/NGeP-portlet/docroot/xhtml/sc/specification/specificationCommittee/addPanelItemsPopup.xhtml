<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<h:panelGroup id="circularpanelItemsSelectionPopUp">
	<p:dialog widgetVar="addPanelItem" modal="true" width="950" id="panelItemDlgWindow"
		height="600" position="top"
		header="#{lbl['lbl.sc.spec.create.specification']}">

		<p:messages id="addPanelItemMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />


	
			
				<ui:include src="searchCircularPanel.xhtml"></ui:include>
			
		<p:ajax event="close"
			listener="#{specificationBackingBean.closeListener}" />
	</p:dialog>
	</h:panelGroup>
</ui:composition>
