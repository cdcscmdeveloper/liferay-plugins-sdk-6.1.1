<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.reminder']}" widgetVar="reminder"
		modal="true" width="600" height="250" position="top">
		<p:panel id="signOffreminder">
			<p:dataTable id="specificationReminder" var="reminderpopup" rows="10"
			   emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				editable="true">
				<ac:paginator for="specificationReminder" />
				<p:column headerText="#{lbl['lbl.sc.name']}"
					style="width:100%">
					<h:outputText value="readOnly"></h:outputText>
				</p:column>

			</p:dataTable>
			<p:spacer height="50"></p:spacer>
			<table>

				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.subject']}" /></td>

					<td><p:inputText size="75" maxlength="100"
							value="#{specificationBackingBean.managedBean.subject}"></p:inputText></td>
				</tr>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.message']}" /></td>

					<td><p:inputTextarea rows="5" cols="75" maxlength="1000"
							value="#{specificationBackingBean.managedBean.message}"></p:inputTextarea>
					</td>
				</tr>
			</table>




			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					style="float:right;" onclick="reminder.hide();"></p:commandButton>

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					partialSubmit="true" process="@this,signOffreminder"
					actionListener="#{specificationBackingBean.secretarySubmitTask}"></p:commandButton>
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
