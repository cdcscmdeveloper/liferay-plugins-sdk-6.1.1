<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup>
		<ui:fragment
			rendered="#{specificationBackingBean.managedBean.qt.zonal ne 'false'}">
			<p:accordionPanel id="panelNoaccordpnllist" dynamic="true"
				value="#{specificationBackingBean.managedBean.deliveryLocBean}"
				var="zonePnlList">
				<p:ajax event="tabChange"
					listener="#{specificationBackingBean.deliveryDetailsZonesTabChange}" />
				<c:if
					test="#{specificationBackingBean.managedBean.qt.panel ne 'false'}">
					<ui:param name="zoneName"
						value="#{zonePnlList.tplSpecZoneDtl.panelZone.name}" />
				</c:if>
				<c:if
					test="#{specificationBackingBean.managedBean.qt.panel eq 'false'}">
					<ui:param name="zoneName"
						value="#{zonePnlList.tplSpecZoneDtl.zoneName}" />
				</c:if>
				<p:tab title="#{zoneName}">
					<ui:param name="deliveryList"
						value="#{zonePnlList.deliveryLocList}" />
					<ui:param name="selectDeliveryList"
						value="#{specificationBackingBean.managedBean.selectDeliveryList}" />
					<ui:include src="deliveryAddressinclude.xhtml" />
				</p:tab>
			</p:accordionPanel>
		</ui:fragment>

		<ui:fragment
			rendered="#{specificationBackingBean.managedBean.qt.zonal eq 'false'}">
			<ui:param name="deliveryList"
				value="#{specificationBackingBean.managedBean.deliveryNonZoneList}" />
			<ui:param name="selectDeliveryList"
				value="#{specificationBackingBean.managedBean.selectDeliveryList}" />
			<ui:include src="deliveryAddressinclude.xhtml" />
		</ui:fragment>
		<ui:include src="deliveryAddressSearch.xhtml" />
	</h:panelGroup>
</ui:composition>
