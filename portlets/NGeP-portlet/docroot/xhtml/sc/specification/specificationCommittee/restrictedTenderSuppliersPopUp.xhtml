<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="restrictedSupplierpopupSuppDtl" widgetVar="restrictedsuppDetails"
		resizable="false" position="top" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.supplier.details']}" width="450" height="550">
		<table style="width: 100%">
			<tr>
				<td style="width: 180px;"><p:outputLabel
						value="#{lbl['lbl.sc.ep.no']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.smSupplier.epNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{specificationBackingBean.managedBean.smSupplier.companyName}"
						readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.registration.type']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.registration.no']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.smSupplier.regNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mofno']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.smMofAccount.mofNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.income.tax.ref.no']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.incomeTaxNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.establishment.date']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.smSupplier.establishDate}"
						size="30" readonly="true" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.type.of.company']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mofexp.date']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.smMofAccount.expDate}"
						size="30" readonly="true" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.disciplinary.rating']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.supplierBranch}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.address']}" /></td>
				<td><p:inputTextarea
						value="#{specificationBackingBean.getFullAddress(specificationBackingBean.managedBean.supplierAddress)}"
						rows="5" cols="32" readonly="true" disabled="true"
						style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.contact.person']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.supplierContact}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.designation']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.supplierEmail}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				onclick="restrictedsuppDetails.hide();" />
		</div>
	</p:dialog>
</ui:composition>
