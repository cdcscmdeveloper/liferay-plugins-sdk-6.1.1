<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="stageTwoFinance" modal="true" width="800"
		position="top" header="#{lbl['lbl.sc.spec.btn.standard.check.list']}"
		height="400">
		<p:messages id="technicalChecklistPopup" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false"
			severity="error, info" />
		<h:panelGroup id="financialChecklistPopup">

			<p:dataTable id="stageTwoFinPopup" var="compilance" rows="10"
				value="#{specificationBackingBean.managedBean.stageTwoFinComplianceList}"
				editable="true"
				selection="#{specificationBackingBean.managedBean.stageTwoFinComplianceSelect}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{compilance.documentId}" rowIndexVar="index">
				<ac:paginator for="stageTwoFinPopup"></ac:paginator>
				<p:column selectionMode="multiple"
					styleClass="td-check-box-spacing" />
				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}">
					<h:outputText value="#{compilance.docName}"></h:outputText>
				</p:column>
			</p:dataTable>

		</h:panelGroup>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				styleClass="BtnSpacing"
				actionListener="#{specificationBackingBean.cancelPopup}"
				style="float:right;" onclick="stageTwoFinance.hide();"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.ok']}" style="float:right;"
				process="@all" partialSubmit="true" styleClass="BtnSpacing"
				action="#{specificationBackingBean.addFinancialComplianceList}"
				update="financeProposaltwo"></p:commandButton>
		</div>
		<p:ajax event="close"
			listener="#{specificationBackingBean.closeListener}" />
	</p:dialog>
</ui:composition>
