<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="FinancialGovernmentCompany" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info"></p:messages>

		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> <p:commandButton
						value="#{lbl['lbl.btn.print']}" type="button">
						<p:printer target="financialCheckListGovtComp" />
					</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{((specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION) or(!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveCheckListScores}">
						<f:setPropertyActionListener
							target="#{specificationBackingBean.managedBean.criteriaType}"
							value="12" />
					</p:commandButton></td>
			</tr>
		</table>
		
		<h:panelGroup id="financialCheckListGovtComp">

			<ui:include
				src="/xhtml/sc/specification/specificationCommittee/checklistHeader.xhtml" />

			<p:panel toggleable="true">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.spec.company.exp.fed.gov']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.spec.company.exp.fed.gov.tooltip']}" />
				</f:facet>
				<table>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.spec.company.exp.since.year']} "></p:outputLabel>
							<ui:fragment
								rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
								<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
							</ui:fragment></td>
						<td><p:inputText id="finSpecGovCompany"
								disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
								label="#{lbl['lbl.sc.spec.company.exp.since.year']}"
								required="true" style="text-align:right;"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue.year}"
								maxlength="4">
								<p:ajax event="blur" process="@this" partialSubmit="true"
									listener="#{specificationBackingBean.compareChecklistValueCurrentYear(specificationBackingBean.managedBean.scQtChecklist.scQtCheckListValue)}"></p:ajax>
							</p:inputText> <p:message id="finGovCompanyYrs" for="finSpecGovCompany"
								display="icon"></p:message></td>
					</tr>
				</table>
				<p:dataTable id="experience" rowIndexVar="index" var="experience"
					rowKey="#{experience}">
					<ac:paginator for="experience"></ac:paginator>
					<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
					<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.effective.date']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.exp.date']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}">
						<p:inputText></p:inputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.remarks']}">
						<p:inputText></p:inputText>
					</p:column>
				</p:dataTable>

				<p:spacer height="10px"></p:spacer>
				<table>

					<tr>
						<td style="width: 230px;"><p:outputLabel
								value="#{lbl['lbl.sc.spec.total.contract.amount']}" /></td>
						<td><p:inputText readonly="true" disabled="true"></p:inputText>
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.total.contract.amount.tooltip']}" /></td>
					</tr>

				</table>

			</p:panel>

			<p:panel id="financialGovernmentContracts"
				header="#{lbl['lbl.sc.spec.score.total.contract.amount']}"
				toggleable="true"
				rendered="#{specificationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<table>
					<tr>
						<td style="width: 230px;"><ui:fragment
								rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
								<p:outputLabel value="*" styleClass="mandatory"
									style="float : left"></p:outputLabel>
							</ui:fragment> <p:outputLabel style="float : left"
								value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width: 180px;margin-bottom: 5px;"
								disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
								id="financialGovAutoScore"
								label="#{lbl['lbl.sc.spec.asset.score.type']}"
								value="#{specificationBackingBean.managedBean.checklistScoreType}">
								<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
								<p:ajax event="change"
									update="financialGovernment,financialGovernmentContracts"
									listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
							</p:selectOneMenu> <p:message id="financialGovAutoScoreMsg"
								for="financialGovAutoScore" display="icon"></p:message></td>
						<td><ac:iconTooltip
								value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
						</td>
					</tr>
				</table>

				<h:panelGroup id="financialGovernment">
					<h:panelGroup
						rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

						<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
						<h:panelGroup id="contractAmountGroupId">
							<ui:param name="scoringList"
								value="#{specificationBackingBean.managedBean.checkListScore}" />
							<ui:param name="selectionList"
								value="#{specificationBackingBean.managedBean.checkListSelectScore}" />

							<ui:param name="componentName" value="ContractAmount" />
							<ui:param name="scoringPnlId" value="contractAmountId" />
							<ui:param name="scoringPnlName"
								value="#{lbl['lbl.sc.spec.score.total.contract.amount']}"></ui:param>
							<ui:include
								src="/xhtml/sc/specification/specificationCommittee/scoring.xhtml"></ui:include>
							<div align="right">
								<p:commandButton value="#{lbl['lbl.btn.add']}"
									styleClass="BtnSpacing"
									disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
									process="@this,#{scoringPnlId}" partialSubmit="true"
									oncomplete="scoreWidget.paginator.endLink.click();"
									actionListener="#{specificationBackingBean.addScoring(12)}"
									update="#{scoringPnlId}" />
								<p:commandButton value="#{lbl['lbl.btn.delete']}"
									styleClass="BtnSpacing"
									disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
									process="@this" partialSubmit="true"
									oncomplete="financialGovCompanyExperienceDeletePopUp.show();"
									update="@([id$=#{financialGovCompanyExperienceNoOfContractsDeleteId}])">
									<f:setPropertyActionListener
										target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
										value="#{false}" />
								</p:commandButton>

							</div>
							<ui:param
								name="financialGovCompanyExperienceNoOfContractsDeleteId"
								value="financialGovCompanyExperienceNoOfContractsDeleteId"></ui:param>

							<ac:confirmationPopup
								id="#{financialGovCompanyExperienceNoOfContractsDeleteId}"
								widget="financialGovCompanyExperienceDeletePopUp" width="450"
								height="100"
								okAction="specificationBackingBean.deleteCheckListScoreContrats"
								title="#{lbl['lbl.sc.spec.company.exp.fed.gov']}"
								content="#{lbl['lbl.sc.dialog.confirm.message']}"
								update="@([id$=#{scoringPnlId}])" />
						</h:panelGroup>
					</h:panelGroup>

					<h:panelGroup
						rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
						<table>
							<tr>
								<td style="width: 230px;"><ui:fragment
										rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
										<p:outputLabel value="*" styleClass="mandatory"
											style="float : left"></p:outputLabel>
									</ui:fragment> <p:outputLabel style="float : left"
										value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel></td>
								<td><p:inputText id="finMaxScore" required="true"
										style="text-align:right;"
										disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
										maxlength="18" label="#{lbl['lbl.sc.spec.max.score']}"
										value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
										<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
									</p:inputText> <p:message id="finGovMaxSoring" for="finMaxScore"
										display="icon"></p:message></td>
							</tr>
						</table>
					</h:panelGroup>
				</h:panelGroup>
			</p:panel>
		</h:panelGroup>
	</ui:define>
</ui:composition>
