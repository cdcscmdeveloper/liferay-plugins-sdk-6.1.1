<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.delivery.service.address']}"
		toggleable="true" styleClass="deliveryUpdate">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.delivery.service.address.instruction']}"
			escape="false" />

		<p:dataTable id="pjtDelivered" var="delivery" editable="true"
			rows="10" style="width:100%" widgetVar="deliveryService"
			rowIndexVar="index" value="#{deliveryList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{selectDeliveryList}" rowKey="#{delivery}">
			<ac:paginator for="pjtDelivered" />

			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						value="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="pjtDelivered"
							listener="#{specificationBackingBean.selectAll(specificationBackingBean.managedBean.templateSpecBean.selectAll, deliveryList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{delivery.selected}"
					disabled="#{specificationBackingBean.managedBean.readOnly}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.ptj']}"
				style="width:25%;white-space: normal;">
				<ui:fragment
					rendered="#{delivery.pmAddressType.pmOrgProfile ne null}">
					<h:outputText
						value="#{delivery.pmAddressType.pmOrgProfile.orgName}" />
				</ui:fragment>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.delivery.service.address']}"
				style="width:72%;white-space: normal;">
				<h:outputText value="#{delivery.deliveryAddress}" />
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this"
			styleClass="BtnSpacing"
				partialSubmit="true" update="@([id$=deliveryAddrDlg])"
				disabled="#{specificationBackingBean.managedBean.readOnly}"
				action="#{specificationBackingBean.deliveryList(zonePnlList.tplSpecZoneDtl)}"
				oncomplete="deliveryAddress.show();" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
			styleClass="BtnSpacing"
				process="@this,pjtDelivered" partialSubmit="true"
				disabled="#{specificationBackingBean.managedBean.readOnly}"
				oncomplete="deliveryAddressDeletePopUp.show();"
				update="@([id$=#{deliveryAddressDeleteId}])">
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>
		</div>

		<ui:param name="deliveryAddressDeleteId"
			value="deliveryAddressDeleteId"></ui:param>

		<ac:confirmationPopup id="#{deliveryAddressDeleteId}"
			widget="deliveryAddressDeletePopUp" width="450" height="100"
			okAction="specificationBackingBean.deleteDeliveryZone"
			title="#{lbl['lbl.sc.spec.delivery.service.address']}"
			content="#{lbl['lbl.sc.dialog.confirm.message']}" update="@form" />
	</p:panel>
</ui:composition>
