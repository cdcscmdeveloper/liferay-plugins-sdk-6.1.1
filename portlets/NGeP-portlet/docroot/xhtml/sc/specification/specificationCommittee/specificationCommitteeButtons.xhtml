<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<ui:param name="isClone" value="#{specificationBackingBean.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING or specificationBackingBean.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_CHECKLIST_SCORING_REVISION}" />
	<h:panelGroup>
		<ac:gpkiPopup
			textBeforeSign="#{specificationBackingBean.textBeforeSign}"
			postSignAction="#{specificationBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{specificationBackingBean.enableAutoUpdate()}" />

		<table width="100%">
			<tr>
				<td align="right">
				<!-- 25692#95 - start -->
				<c:choose>
				<c:when test="#{specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance() and specificationBackingBean.managedBean.taskId eq null and empty specMaintenanceBB.managedBean.previousPage}">
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{specMaintenanceBB.gotoSpecMaintenanceSearchPage}" rendered="#{specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance() and specificationBackingBean.managedBean.taskId eq null and empty specMaintenanceBB.managedBean.previousPage}"
					partialSubmit="true"
					process="@this"
					update="@this" />
				</c:when>
				<c:when test="#{(not empty specMaintenanceBB.managedBean.previousPage)}" >
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{specMaintenanceBB.backToQtScreen()}" rendered="#{(not empty specMaintenanceBB.managedBean.previousPage)}"
					partialSubmit="true"
					process="@this"
					update="@this" 
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"/><ui:remove>//29464</ui:remove>
				</c:when>
				</c:choose>
				<!-- 25692#95 - end -->
				<!-- danial #25635 - rollback 22/11/2020 end -->
	 			<p:commandButton value="#{lbl['lbl.sc.clone.specification']}" style="float:right;" id="cloneButton"
											process="@this" partialSubmit="true" update="pnlid2" rendered="#{isClone and !specificationBackingBean.managedBean.readOnly}"
											action="#{qtSpecCloneBackingBean.cloneCommitteePopupAction()}"
											title="#{lbl['lbl.sc.qt.create.btn.clone.tooltip']}" />
		
				
			<ui:fragment rendered="#{specificationBackingBean.managedBean.specMaintenanceScreen ne specificationBackingBean.getSpecMaintenance()}">
				<ui:repeat var="bpmAction"
						value="#{specificationBackingBean.managedBean.outComes}">
						<ui:fragment rendered="#{bpmAction ne '~'}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<ui:param name="bpAction" value="SUBMIT" />	
							<p:commandButton value="#{lbl[buttonLabel]}"
								styleClass="ui-button"
								action="#{specificationBackingBean.submitAction(bpmAction)}"
								update="@([id$=#{submitConfirmId2}])" 
								rendered="#{isClone}" />

							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								styleClass="ui-button" style="float:right;" rendered="#{!isClone}"
								action="#{specificationBackingBean.submitAction(bpmAction)}" />
						</ui:fragment>
					</ui:repeat>
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly}">
						<p:commandButton value="#{lbl['lbl.btn.save']}" update="@all"
							style="float:right;" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();" rendered="#{specificationBackingBean.managedBean.assignedState}"
							action="#{specificationBackingBean.saveSpecificationCommitteeDtls}">
							<f:setPropertyActionListener
								target="#{specificationBackingBean.managedBean.buttonOutCome}"
								value="save" />
						</p:commandButton>
						
						
					</ui:fragment>
					</ui:fragment>
					<ui:fragment rendered="#{specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()}">
					<ui:param name="workflowStatus" value="#{specificationBackingBean.managedBean.specMaintenanceWorkFlowStatus}"></ui:param>
					
					<p:commandButton value="#{lbl['lbl.btn.submit']}" update="@all"
							style="float:right;" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();" rendered="#{(!specificationBackingBean.managedBean.readOnly and workflowStatus ==null) or (!specificationBackingBean.managedBean.readOnly and workflowStatus !=null and (workflowStatus.pmStatus.statusId == QTStatusConst.SE_PENDING_SUBMISSION or workflowStatus.pmStatus.statusId == QTStatusConst.SE_COMPLETED))}"
							action="#{specificationBackingBean.submitSpecMaintenanceDtls('Submit')}">
							</p:commandButton>
					
							
							<ui:repeat var="bpmAction"
						value="#{specificationBackingBean.managedBean.outComes}">
						<ui:fragment rendered="#{bpmAction ne '~'}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
                          
							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								styleClass="ui-button" style="float:right;"
								action="#{specificationBackingBean.specCommitteMaintenanceBpmTask(bpmAction)}" />
								
						</ui:fragment>
						</ui:repeat>
					</ui:fragment>
					
					</td>
					
			</tr>
		</table>

		<p:dialog id="submitConfirmId2" widgetVar="submitConfirmPopUp2"
			header="#{lbl['lbl.sc.approval.confirm']}" resizable="false"
			width="30%" height="100" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.sc.approval.dialog.confirm']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
				    onclick="blockWidget.show();"
					oncomplete="submitConfirmPopUp2.hide(); blockWidget.hide();"
					 partialSubmit="true" process="@form" update="@form" 
					action="#{specificationBackingBean.specCommitteBpmTask(bpAction)}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					onclick="submitConfirmPopUp2.hide();" type="button" partialSubmit="true"  process="@this"/>
			</div>
		</p:dialog>

		<p:dialog id="reviseSCDlgs" widgetVar="reviseSCDlgs"
			header="#{lbl['lbl.sc.dialog.confirm.header.revise']}"
			resizable="false" width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center">
						<h:graphicImage value="/css/images/design/exclamation.png" /> 
						<p:outputLabel value="#{lbl['lbl.sc.dialog.confirm.to.revise']}" />
					</td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviseSCDlgs.hide();"
					action="#{specificationBackingBean.reviseSC}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviseSCDlgs.hide();" type="button" />
			</div>
		</p:dialog>

		<p:dialog id="reviceApprovalDlgs" widgetVar="reviceApprovalDlgs"
			header="#{lbl['lbl.sc.dialog.confirm.header.revise']}"
			resizable="false" width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.revise']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviceApprovalDlgs.hide();"
					action="#{specificationBackingBean.reviseSpecificationCommittee}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviceApprovalDlgs.hide();" type="button" />
			</div>
		</p:dialog>

		<p:dialog id="technicalStandardDlgsSubmit"
			widgetVar="technicalStandardChecklistDlgsSubmit"
			header="#{lbl['lbl.sc.spec.tech.check.list']}" resizable="false"
			width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.spec.checklist']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="@form"
					action="#{specificationBackingBean.checkListYesConfirmationSubmit('T')}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" update="@form"
					actionListener="#{specificationBackingBean.checkListNoConfirmationSubmit('T')}"
					oncomplete="technicalStandardChecklistDlgsSubmit.hide();" />
			</div>
		</p:dialog>

		<p:dialog id="financialStandardDlgsSubmit"
			widgetVar="financialStandardChecklistDlgsSubmit"
			header="#{lbl['lbl.sc.spec.finance.check.list']}" resizable="false"
			width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.spec.checklist']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="@form"
					action="#{specificationBackingBean.checkListYesConfirmationSubmit('F')}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" update="@form"
					actionListener="#{specificationBackingBean.checkListNoConfirmationSubmit('F')}"
					oncomplete="financialStandardChecklistDlgsSubmit.hide();" />
			</div>
		</p:dialog>

		<p:dialog id="revicespecMaintenanceEndorsmentDlgs" widgetVar="revicespecMaintenanceEndorsmentDlgs"
			header="#{lbl['lbl.sc.dialog.confirm.header.revise']}"
			resizable="false" width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.revise']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="revicespecMaintenanceEndorsmentDlgs.hide();"
					action="#{specificationBackingBean.reviseSpecificationCommitteeEndorsmentMaintenance}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="revicespecMaintenanceEndorsmentDlgs.hide();" type="button" />
			</div>
		</p:dialog>

		<p:dialog id="alertFinancialTemplateIncompleteId" widgetVar="alertFinancialTemplateIncompletePopup"
			header="#{lbl['lbl.sc.confirmation']}"
			resizable="false" width="400" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.popup.technicalSpecUpdated']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" 
					action="#{specificationBackingBean.getMethodHandlerOnConfirmation()}"
					oncomplete="alertFinancialTemplateIncompletePopup.hide();"
					update="@form"/>
			</div>
		</p:dialog>
	</h:panelGroup>

</ui:composition>
