<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup>
		<ac:gpkiPopup
			textBeforeSign="#{specificationBackingBean.textBeforeSign}"
			postSignAction="#{specificationBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<table width="100%">
			<tr>
				<td align="right"><ui:repeat var="bpmAction"
						value="#{specificationBackingBean.managedBean.outComes}">
						<ui:fragment rendered="#{bpmAction ne '~'}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								styleClass="ui-button" style="float:right;"
								action="#{specificationBackingBean.specCommitteBpmTask(bpmAction)}" />
						</ui:fragment>
					</ui:repeat> <ui:fragment
						rendered="#{((((!specificationBackingBean.managedBean.readOnly) and (specificationBackingBean.isQTStatusChecklistScoring() or specificationBackingBean.isQTStatusChecklistScoringRevision())) or (specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring())))}">
						<p:commandButton value="#{lbl['lbl.btn.save']}" update="@all"
							style="float:right;" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();" rendered="#{specificationBackingBean.managedBean.assignedState}"
							action="#{specificationBackingBean.saveSpecificationCommitteeDtls}">
							<f:setPropertyActionListener
								target="#{specificationBackingBean.managedBean.buttonOutCome}"
								value="save" />
						</p:commandButton>
					</ui:fragment></td>
			</tr>
		</table>

		<p:dialog id="reviceApprovalDlgs" widgetVar="reviceApprovalDlgs"
			header="#{lbl['lbl.sc.dialog.confirm.header.revise']}"
			resizable="false" width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.spec.dialog.yesbtn.message']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviceApprovalDlgs.hide();"
					action="#{specificationBackingBean.reviseSpecificationCommittee}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviceApprovalDlgs.hide();" type="button" />
			</div>
		</p:dialog>


		<p:dialog id="technicalStandardDlgsSubmit"
			widgetVar="technicalStandardChecklistDlgsSubmit"
			header="#{lbl['lbl.sc.spec.tech.check.list']}" resizable="false"
			width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.spec.checklist']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="@form"
					action="#{specificationBackingBean.checkListYesConfirmationSubmit('T')}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" update="@form"
					actionListener="#{specificationBackingBean.checkListNoConfirmationSubmit('T')}"
					oncomplete="technicalStandardChecklistDlgsSubmit.hide();" />
			</div>
		</p:dialog>

		<p:dialog id="financialStandardDlgsSubmit"
			widgetVar="financialStandardChecklistDlgsSubmit"
			header="#{lbl['lbl.sc.spec.finance.check.list']}" resizable="false"
			width="400" height="75" closable="false">
			<table>
				<tr>
					<td align="center"><h:graphicImage
							value="/css/images/design/exclamation.png" /> <p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.spec.checklist']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="@form"
					action="#{specificationBackingBean.checkListYesConfirmationSubmit('F')}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" update="@form"
					actionListener="#{specificationBackingBean.checkListNoConfirmationSubmit('F')}"
					oncomplete="financialStandardChecklistDlgsSubmit.hide();" />
			</div>
		</p:dialog>

	</h:panelGroup>

</ui:composition>
