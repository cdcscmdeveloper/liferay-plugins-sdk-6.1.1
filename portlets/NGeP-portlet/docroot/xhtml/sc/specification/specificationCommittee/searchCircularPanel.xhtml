<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="circular" header="#{lbl['lbl.sc.spec.search.panel.item']}"
		toggleable="true">

		<table>
			
			<tr>
				<td style="width: 20%"><h:outputLabel
						value="#{lbl['lbl.sc.item.name']}"></h:outputLabel></td>
				<td><p:inputText maxlength="100" onkeypress="if (event.keyCode == 13) { specificationCommitteePanelCircularitemsSearch.jq.click(); return false; }"
						value="#{specificationBackingBean.managedBean.ctSearchBean.itemName}"
						size="100" /></td>
			</tr>

		</table>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				styleClass="BtnSpacing" widgetVar="specificationCommitteePanelCircularitemsSearch"
				action="#{specificationBackingBean.searchCircularList}"
				update="panelItemGroupList" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				styleClass="BtnSpacing"
				action="#{specificationBackingBean.resetCircular}"
				update="circular,panelItemGroupList" resetValues="true"
				partialSubmit="true" process="@this" />
		</div>
	</p:panel>




	<p:panel id="circularPanelItemListIds" header="#{lbl['lbl.sc.spec.circular.list']}" toggleable="true">


		


		<h:panelGroup id="panelItemGroupList">
			<ui:fragment
				rendered="#{specificationBackingBean.managedBean.circularType eq 'PQ'}">
			
         		#{specificationBackingBean.managedBean.ctCircularVer.circularNo}>#{lbl['lbl.sc.spec.circular.item.list']}
         		<ac:iconTooltip
					value="#{lbl['lbl.sc.spec.circular.item.list.tooltip']}" />

				<p:dataTable id="panelItemList" var="panelItem" rowIndexVar="index"
					style="width:100%" rows="10"
					value="#{specificationBackingBean.managedBean.searchPanelItemList}"
					selection="#{specificationBackingBean.managedBean.selectCtPanelItem}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowKey="#{panelItem}">

					<ac:paginator for="panelItemList"></ac:paginator>
					<p:ajax event="rowSelect" update="@([id$=specCommitteeTechnicalPanelItemListId])" />
			<p:ajax event="rowUnselect" update="@([id$=specCommitteeTechnicalPanelItemListId])" />
			<p:ajax event="rowSelectCheckbox" update="@([id$=specCommitteeTechnicalPanelItemListId])" />
			<p:ajax event="rowUnselectCheckbox" update="@([id$=specCommitteeTechnicalPanelItemListId])" />
			<p:ajax event="toggleSelect" update="@([id$=specCommitteeTechnicalPanelItemListId])" />
				
					<p:column selectionMode="multiple"
						styleClass="td-check-box-spacing">
						<!-- <p:ajax partialSubmit="true" process="@this" 
							
							listener="#{specificationBackingBean.panelItemSelect}" /> -->
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
						style="white-space: normal;">
						<h:outputText value="#{panelItem.itemName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.specification']}"
						style="white-space: normal;">
						<h:outputText value="#{panelItem.specification}" />

					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.spec.panel.item.category']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.panel.item.category.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
					</p:column>

					<p:column style="width:5%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.spec.panel.coverage']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.panel.coverage.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.uom']}" style="width:15%">
						<h:outputText value="#{panelItem.pmUom.uomName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
						style="width:10%; text-align:right;">
						<h:outputText value="#{panelItem.minimumOrderQty}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
						style="width:12%; white-space:normal; text-align:right;">
						<h:outputText value="#{panelItem.maxProcureAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>


				<!-- 	<p:column headerText="#{lbl['lbl.sc.selection']}"
						selectionMode="single" style="width:2%;text-align: center;" /> -->

				</p:dataTable>




			</ui:fragment>
			
			<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				styleClass="BtnSpacing"
				actionListener="#{specificationBackingBean.cancelPopup}"
				style="float:right;" onclick="addPanelItem.hide();"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.ok']}" style="float:right;" id="specCommitteeTechnicalPanelItemListId"
			disabled="#{empty specificationBackingBean.managedBean.selectCtPanelItem}"
				process="@all" partialSubmit="true" styleClass="BtnSpacing"
				action="#{specificationBackingBean.addPanelItemsToTemplateSpec}"></p:commandButton>
		</div>
		</h:panelGroup>
	</p:panel>

</ui:composition>
