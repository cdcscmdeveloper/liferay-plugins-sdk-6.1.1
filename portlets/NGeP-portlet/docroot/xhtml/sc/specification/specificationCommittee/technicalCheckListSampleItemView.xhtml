<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="technicalChecklistSampleItemmessages"
			showDetail="true" showSummary="false" autoUpdate="true"
			closable="true" severity="error, info" />
		<ui:param name="isReadOnlyOrSpecMain"
			value="#{!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()}" />

		<table style="width:100%;" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.sampleViewBackAction}" /> 

					<p:commandButton value="#{lbl['lbl.btn.save']}" process="@this"
						partialSubmit="true"
						rendered="#{((!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring()) or (!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.isQTStatusChecklistScoringRevision()) or isReadOnlyOrSpecMain)}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveSampleTemplateSpecDetails(false)}" />
				</td>
			</tr>
		</table>
		<p:spacer height="5"></p:spacer>
		<ui:include src="technicalChecklistSampleItemSearch.xhtml"></ui:include>
		<p:spacer height="5"></p:spacer>
		<ui:include src="technicalCheckListSampleQuestions.xhtml"></ui:include>


		<p:dialog id="samplescoringSetPopup"
			header="#{lbl['lbl.tpl.spec.content.scoring.settings.title']}"
			widgetVar="samplescoringSetPopup" modal="true" width="800"
			height="auto" closable="false" position="top">
			<h:panelGroup id="samplescoreSettPnl">
				<p:messages id="samplescorePopupMsg" showDetail="true"
					autoUpdate="true" closable="true" showSummary="false"
					severity="error, info" />
				<table style="width:100%;cellspacing:0;cellpadding:0;border:0;">
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.item']}" /></td>
						<td colspan="3"><h:inputTextarea id="sampleitemSpec"
								style="width:calc(100% - 50px);"
								value="#{specificationBackingBean.managedBean.sampleSpecQuestion.clItem}"
								disabled="true" autoResize="false"
								rows="#{templateSpecBackingBean.getNumOfRows(specificationBackingBean.managedBean.sampleSpecQuestion.clItem)}" />
						</td>
					</tr>
					<tr>
						<td width="21%"><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.scoring.settings.answer.type']}" /></td>
						<td width="26%"><p:inputText id="sampleanswerType"
								value="#{templateSpecBackingBean.getParameterDesc(specificationBackingBean.managedBean.sampleSpecQuestion.sampleScoreTypeCode)}"
								disabled="true" size="15" /></td>
						<td width="17%"><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type']}" />

						</td>
						<td width="36%"><p:inputText
								value="#{lbl['lbl.sc.checklist.user.score']}"
								disabled="true" size="15" /></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.scoring.settings.max.score']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:inputText id="maxScoresample"
								style="text-align:right;"
								onkeypress="if (event.keyCode == 46) { return false; }"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.sampleSpecQuestion.sampleScore}"
								size="15" maxlength="3" required="true"
								label="#{lbl['lbl.tpl.spec.content.scoring.settings.max.score']}">
								<ac:validateNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
									maxIntegerDigits="3" integerOnly="true" />
							</p:inputText> <p:message id="maxScoresampleMsg" for="maxScoresample"
								display="icon" /></td>
					</tr>
				</table>
			</h:panelGroup>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" partialSubmit="true"
				rendered="#{((!specificationBackingBean.managedBean.readOnly and specificationBackingBean.isQTStatusChecklistScoring()) or (!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.isQTStatusChecklistScoringRevision()) or isReadOnlyOrSpecMain)}"
					process="@this, samplescoreSettPnl,maxScoresample"
					action="#{specificationBackingBean.scoringPopUpAction(specificationBackingBean.managedBean.sampleSpecQuestion)}"
					update="samplescoreSettPnl,sampleTotalscoreId, @(.samplescoringBtn)">
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					partialSubmit="true" process="@this" update="@this"
					oncomplete="samplescoringSetPopup.hide()" />
			</div>
		</p:dialog>

		<p:dialog id="sampleZoneQtyPopup"
			header="#{lbl['lbl.tpl.spec.content.zone.quantity.title']}"
			widgetVar="sampleZoneQtyPopup" modal="true" width="500" height="auto"
			closable="false" position="top">
			<table style="width: 425px;">


				<tr>
					<td><p:dataTable id="sampleSpecZoneQtyTbl"
							var="tplSpecZoneQty" rowIndexVar="rowIndex" rows="10"
							value="#{specificationBackingBean.managedBean.sampleSpecQuestion.tplSpecZoneQties}"
							rowKey="#{tplSpecZoneQty}">

							<ac:paginator for="sampleSpecZoneQtyTbl" />

							<p:column
								headerText="#{lbl['lbl.tpl.spec.content.estimation.zone.name']}">
			#{tplSpecZoneQty.tplSpecZoneDtl.zoneName}
		</p:column>
							<p:column style="width:95px;">
								<f:facet name="header">

									<h:outputText value="#{lbl['lbl.tpl.spec.content.quantity']}" />
								</f:facet>
								<h:outputText value="#{tplSpecZoneQty.qty}"></h:outputText>

							</p:column>
						</p:dataTable></td>
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					partialSubmit="true" process="@this" update="@this"
					oncomplete="sampleZoneQtyPopup.hide()" />
			</div>

		</p:dialog>


		<p:dialog id="sampletierQtyPopup"
			header="#{lbl['lbl.tpl.spec.content.tier.title']}"
			widgetVar="sampletierWdgQtyPopup" modal="true" width="450"
			height="auto" closable="false">

			<table style="width: 425px;">


				<tr>
					<td><p:dataTable id="sampletierQtyTbl"
							widgetVar="sampleTierQtyWidget" var="tplSpecTierQty" rows="10"
							rowIndexVar="rowIndex"
							value="#{specificationBackingBean.managedBean.sampleSpecQuestion.tplSpecTierQties}"
							rowKey="#{tplSpecTierQty}">

							<ac:paginator for="sampletierQtyTbl" />
							<p:column>
								<f:facet name="header">
									<h:outputText
										value="#{lbl['lbl.tpl.spec.content.tier.from.qty']}" />
								</f:facet>
								<h:outputText value="#{tplSpecTierQty.fromQty}"></h:outputText>
							</p:column>
							<p:column>
								<f:facet name="header">
									<h:outputText
										value="#{lbl['lbl.tpl.spec.content.tier.to.qty']}" />
								</f:facet>
								<h:outputText value="#{tplSpecTierQty.toQty}"></h:outputText>
							</p:column>

						</p:dataTable></td>
				</tr>
			</table>


			<div class="ppRightBtn">

				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					partialSubmit="true" process="@this" update="@this"
					oncomplete="sampletierWdgQtyPopup.hide()" />
			</div>

		</p:dialog>

	</ui:define>

</ui:composition>
