<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup id="recommendationid">
			<p:panel id="package" toggleable="true">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.by.package']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.by.package.recommendation.tooltip']}" />
				</f:facet>

				<table>
					<tr>
						<td><h:outputText value="*" styleClass="mandatory" /> <h:outputLabel
								value="#{lbl['lbl.sc.spec.technical']}"></h:outputLabel></td>
						<td><p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.overallTechnical}">

								<p:ajax event="blur" update="@([id$=package])"
									process="@this,package"
									listener="#{specificationBackingBean.calculateTotalPackage(specificationBackingBean.managedBean.recommendationPackageScore)}"></p:ajax>
							</p:inputText></td>
					</tr>
					<tr>
						<td><h:outputText value="*" styleClass="mandatory" /> <h:outputLabel
								value="#{lbl['lbl.sc.spec.financial']}"></h:outputLabel></td>
						<td><p:inputText style="text-align:right" maxlength="5"
								readonly="true"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.overallFin}">

								<p:ajax event="blur" update="@([id$=package])"
									process="@this,package"
									listener="#{specificationBackingBean.calculateTotalPackage(specificationBackingBean.managedBean.recommendationPackageScore)}"></p:ajax>
							</p:inputText></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.sc.total.percentage']}"></h:outputLabel></td>
						<td><p:inputText id="totalrecommendation"
								style="text-align:right"
								value="#{specificationBackingBean.managedBean.recommendationPackageTotal}"
								disabled="true" /></td>
					</tr>
					<tr>
						<td><h:outputText value="*" styleClass="mandatory" /> <h:outputLabel
								value="#{lbl['lbl.sc.spec.passing.score.percentage']}"></h:outputLabel></td>
						<td><p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationPackageScore.passingScore}">

							</p:inputText> <ac:iconTooltip
								value="#{lbl['lbl.sc.spec.passing.score.percentage.tooltip']}" />
						</td>
					</tr>
				</table>
			</p:panel>



			<p:panel id="item" toggleable="true">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.by.item']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.by.item.recommendation.tooltip']}" />
				</f:facet>

				<p:panelGrid id="itemPanel" style="margin-top:5px;width:100%;"
					styleClass="panelGridBorders tr, panelGridBorders td">
					<f:facet name="header">
						<p:row>
							<p:column styleClass="panelGridHeaders" colspan="1"></p:column>
							<p:column styleClass="panelGridHeaders" colspan="1">
								#{lbl['lbl.sc.spec.item']}
								<ac:iconTooltip value="#{lbl['lbl.sc.spec.item.tooltip']}" />
							</p:column>
							<p:column styleClass="panelGridHeaders" colspan="1">
								#{lbl['lbl.sc.spec.others']}
								<ac:iconTooltip value="#{lbl['lbl.sc.spec.others.tooltip']}" />
							</p:column>
							<p:column styleClass="panelGridHeaders">#{lbl['lbl.sc.spec.score']}</p:column>
						</p:row>
					</f:facet>
					<p:row>
						<p:column style="font-weight: bold;">#{lbl['lbl.sc.spec.technical']}</p:column>
						<p:column>
							<p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallTechnical}">

								<p:ajax event="blur" update="@([id$=itemPanel])"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendtechnicalScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>

						<p:column colspan="1">
							<p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallOtherTechnical}">

								<p:ajax event="blur" update="@([id$=itemPanel])"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendtechnicalScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>
						<p:column colspan="1" style="text-align:right">
							<h:outputText id="technicalrecommendation"
								value="#{specificationBackingBean.managedBean.recommendTechnicalScore}" />
						</p:column>
					</p:row>
					<p:row>
						<p:column style="font-weight: bold;">#{lbl['lbl.sc.spec.financial']}</p:column>
						<p:column>
							<p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallFin}">

								<p:ajax event="blur" update="@([id$=itemPanel])"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendFinancialScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>

						<p:column colspan="1">
							<p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationScore.overallOtherFin}">

								<p:ajax event="blur" update="@([id$=itemPanel])"
									process="@this,item" partialSubmit="true"
									listener="#{specificationBackingBean.calculateRecommendFinancialScore(specificationBackingBean.managedBean.recommendationScore)}"></p:ajax>
							</p:inputText>
						</p:column>
						<p:column colspan="1" style="text-align:right">
							<h:outputText id="financialrecommendation"
								value="#{specificationBackingBean.managedBean.recommendfinancialScore}" />
						</p:column>
					</p:row>

					<p:row>
						<p:column colspan="3" style="text-align:right;font-weight: bold;">
							#{lbl['lbl.sc.total.score']}
						</p:column>
						<p:column colspan="1" style="text-align:right">
							<h:outputText
								value="#{specificationBackingBean.managedBean.totalScore}" />
						</p:column>
					</p:row>

				</p:panelGrid>
				<p:spacer height="3px;"></p:spacer>
				<table>
					<tr>
						<td><h:outputText value="*" styleClass="mandatory" /> <h:outputLabel
								value="#{lbl['lbl.sc.spec.passing.score.percentage']}"></h:outputLabel></td>
						<td><p:inputText style="text-align:right" maxlength="5"
								disabled="#{specificationBackingBean.managedBean.readOnly}"
								value="#{specificationBackingBean.managedBean.recommendationScore.passingScore}">

							</p:inputText> <ac:iconTooltip
								value="#{lbl['lbl.sc.spec.passing.score.percentage.tooltip']}" />
						</td>
					</tr>
				</table>


			</p:panel>
		
	</h:panelGroup>

</ui:composition>
