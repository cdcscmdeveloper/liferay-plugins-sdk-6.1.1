<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ac:scSingleFileUploadPopup widgetVar="scChecklistUploadDlg"
		fileUploadListener="specificationBackingBean.checkListFileUpload"
		readonly="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
		update="@([id$=uploadtech],[id$=technicalSpecificationStatus])" />


<ac:scSingleFileUploadPopup widgetVar="scFinancialChecklistUploadDlg"
		fileUploadListener="specificationBackingBean.checkListFileUpload"
		readonly="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
		update="@([id$=uploadFinance],[id$=financialChecklistSpecificationStatus])" />


	<ac:scSingleFileUploadPopup widgetVar="technicalUserScoringSchema"
		fileUploadListener="specificationBackingBean.technicalUserScoringSchemaFileUpload"
		readonly="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
		update="@([id$=sctechnicalScoringUserScoringSchemaIds])" />



	<ac:scSingleFileUploadPopup widgetVar="financialUserScoringSchema"
		fileUploadListener="specificationBackingBean.financialUserScoringSchemaFileUpload"
		readonly="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
		update="@([id$=financialAllUserScoringCheckistScUploadIds])" />

</ui:composition>
