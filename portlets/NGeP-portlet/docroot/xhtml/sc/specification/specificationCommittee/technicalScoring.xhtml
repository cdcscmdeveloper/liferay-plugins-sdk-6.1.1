<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.tech.score.setting']}"
		toggleable="true">

		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.weightage']}" />
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly}">
						<p:outputLabel value="*" styleClass="mandatory" />
					</ui:fragment></td>
				<td>
				<!-- #21695 FARID START DISABLE SCQT PARTIAL-->

							<p:selectOneRadio required="true"
								disabled="#{specificationBackingBean.managedBean.readOnly or 
								specificationBackingBean.managedBean.qt.partial ne null and specificationBackingBean.managedBean.qt.partial}"
								label="#{lbl['lbl.sc.spec.weightage']}" id="techWeightage"
								value="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq}">
								<f:selectItems
								value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"
								update="technicalWeigtage,addpoints"></p:ajax>
							</p:selectOneRadio>

						 <p:message id="techScoring" for="techWeightage" display="icon"></p:message>
				</td>
			</tr>

		</table>

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.max.score.instruction']}" escape="false" />

		
	</p:panel>
	<p:panel id="passingScoreForTechnicalAndDemoSpecCommittee"
		toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.by.package']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.passing.score.technical.tooltip']}" />
		</f:facet>
		<p:dataTable id="technicalWeigtage" var="tech"
			value="#{specificationBackingBean.managedBean.technicalScoring}"
			rowKey="#{tech}" editable="true" style="width:100%"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="index">
			<!-- <ac:paginator for="technicalWeigtage" /> -->
			<!-- <p:column selectionMode="multiple" style="text-align:center;" /> -->

			<p:column
				headerText="#{lbl['lbl.sc.spec.technical.financial.scoring.title']}"
				style="width:50%;white-space: normal;">
				<h:outputText value="#{tech.title}" size="50" />
			</p:column>

			<p:column style="width:20%;text-align:right;">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.max.score']}" />
					<ac:iconTooltip id="technicalScoringMaxScore#{index}SC"
						value="#{lbl['lbl.sc.spec.max.score.tooltip']}" />
				</f:facet>
				<h:outputText value="#{tech.qtScoreWeightage.score}"
					style="text-align:right"
					rendered="#{tech.definationType.parameterCode eq 'TS' or tech.definationType.parameterCode eq 'SD' or tech.definationType.parameterCode eq 'WF' or tech.definationType.parameterCode eq 'SP'  or tech.definationType.parameterCode eq ParameterConst.documentDefinitionTypePresentationDemo}" /> <!-- #28784 -->
				<p:inputText value="#{tech.qtScoreWeightage.score}"
					disabled="#{specificationBackingBean.managedBean.readOnly}"
					id="techScoreWeight" required="true" maxlength="14"
					label="#{lbl['lbl.sc.score']}" style="text-align:right"
					rendered="#{((tech.definationType.parameterCode eq 'UP' or tech.definationType.parameterCode eq 'NA') and tech.scoringReq)}"> <!-- #28784 -->
					<ac:validateNumber integerOnly="
					true" maxIntegerDigits="14">
					</ac:validateNumber>
					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techScoringCheckList(tech)}"
						update=":form:addpoints" />
				</p:inputText>
				<p:message id="techScoreId" for="techScoreWeight" display="icon"></p:message>
			</p:column>

			<p:column style="width:20%;text-align:right;"
				rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false' and !specificationBackingBean.managedBean.qt.partial and specificationBackingBean.managedBean.qt.partial ne null}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.spec.weight.weight']}" />
					<ac:iconTooltip id="technicalScoringWeightageScore#{index}SC"
						value="#{lbl['lbl.sc.spec.weight.weight.tooltip']}" />
				</f:facet>
				<p:inputText value="#{tech.qtScoreWeightage.weightage}"
					disabled="#{specificationBackingBean.managedBean.readOnly}"
					maxlength="3" style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">

					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techScoringCheckList(tech)}"
						update=":form:addpoints" />
				</p:inputText>

			</p:column>


		</p:dataTable>

		<p:spacer height="15"></p:spacer>

		<h:panelGroup id="addpoints">
			<table>
				<tr><!-- #28784 Start -->
					<td style="width: 260px;"><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.points']} " /></td>

					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{specificationBackingBean.managedBean.techPoints}" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.spec.total.points.tooltip']}" /></td>
				</tr>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false' and !specificationBackingBean.managedBean.qt.partial and specificationBackingBean.managedBean.qt.partial ne null}">

					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.spec.total.weightage']}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								style="text-align:right"
								value="#{specificationBackingBean.managedBean.technicalWeightageScore}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.total.weightage.tooltip']}" /></td>
					</tr>

				</ui:fragment>


			</table>

		</h:panelGroup>
		
		<table>
			<ui:fragment
				rendered="#{specificationBackingBean.managedBean.qt.demoRequired eq 'true'}">
				<tr><!-- #28784 Start -->
					<td style="width: 260px;"><p:outputLabel
							value=" #{lbl['lbl.sc.spec.qual.present.demo']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText style="text-align:right" maxlength="3"
							disabled="#{specificationBackingBean.managedBean.readOnly}"
							value="#{specificationBackingBean.managedBean.demoScoreSetting.passingScore}">
							<p:ajax event="blur" process="@all" partialSubmit="true"
								listener="#{specificationBackingBean.checkDemoPassingScore(specificationBackingBean.managedBean.demoScoreSetting)}" />
						</p:inputText> <ac:iconTooltip
							value="#{lbl['lbl.sc.spec.qual.present.demo.tooltip']}" /></td>
				</tr>
			</ui:fragment>

			<tr>
				<td style="width: 260px;">					
				<c:choose>
					<c:when	test="#{specificationBackingBean.managedBean.demoType eq 'true'}">
						<p:outputLabel value="#{lbl['lbl.sc.passing.score']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />					
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.sc.spec.technical']}" /> 
						<p:outputLabel value="*" styleClass="mandatory" />
					</c:otherwise>
				</c:choose>
				<!-- #28784 End -->
				</td>
				<td><p:inputText style="text-align:right" maxlength="3"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						value="#{specificationBackingBean.managedBean.technicalScoreSetting.passingScore}">
						<p:ajax event="blur" process="@all" partialSubmit="true"
							update="@([id$=passingScoreForTechnicalAndDemoSpecCommittee])"
							listener="#{specificationBackingBean.checkTechnicalPassingScore(specificationBackingBean.managedBean.technicalScoreSetting)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.spec.technical.tooltip']}" />
				</td>
			</tr>
		</table>

	</p:panel>
<!-- #21695 START FARID -->	
	<p:panel id="technicalScoringItemPanel"
		header="#{lbl['lbl.sc.by.item']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.passing.score.financial.instruction']}"
			escape="false" />


<!-- #21695 START FARID 7/4/2021 (at tooltip below lbl.sc.spec.others.tooltip)-->

		<p:panelGrid style="margin-top:5px;width:100%;">
			<f:facet name="header">
				<p:row>
					<p:column colspan="1">
						#{lbl['lbl.sc.spec.items.scoringTech']}
						<ac:iconTooltip value="#{lbl['lbl.sc.spec.item.tooltip']}" />
					</p:column>
					<p:column colspan="1">
						#{lbl['lbl.sc.spec.others']}
						<ac:iconTooltip value="#{lbl['lbl.sc.spec.others.tec.tooltip']}" />
					</p:column>
					<p:column colspan="1">#{lbl['lbl.sc.spec.score']}</p:column>
				</p:row>
			</f:facet>

			<p:row>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText style="text-align:right" maxlength="3"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						value="#{specificationBackingBean.managedBean.technicalItemScoreSetting.overallTechnical}">
						<!-- remove #21695 attribute -->
						<f:attribute name="min" value="0"></f:attribute>
						<p:ajax event="blur" update="technicalScoringItemScore"
							process="@this,technicalScoringItemPanel" partialSubmit="true"
							listener="#{specificationBackingBean.calculateTechnicalItemScore(specificationBackingBean.managedBean.technicalItemScoreSetting)}"></p:ajax>

					</p:inputText>
				</p:column>

				<p:column colspan="1" style="font-weight: bold;">
					<p:inputText style="text-align:right" maxlength="3"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						value="#{specificationBackingBean.managedBean.technicalItemScoreSetting.overallOtherTechnical}">
						<!-- remove #21695 attribute -->
						<f:attribute name="min" value="0"></f:attribute>
						<p:ajax event="blur" update="technicalScoringItemScore"
							process="@this,technicalScoringItemPanel" partialSubmit="true"
							listener="#{specificationBackingBean.calculateTechnicalItemScore(specificationBackingBean.managedBean.technicalItemScoreSetting)}"></p:ajax>

					</p:inputText>
				</p:column>
				<p:column colspan="1" style="text-align:right">
					<h:outputText id="technicalScoringItemScore"
						value="#{specificationBackingBean.managedBean.technicalItemScore}" />
				</p:column>
			</p:row>

		</p:panelGrid>
		

		<p:spacer height="15"></p:spacer>
		<table>
			<tr>
				<td style="width: 260px;"><p:outputLabel
						value="#{lbl['lbl.sc.passing.score']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="text-align:right" maxlength="3"
						disabled="#{specificationBackingBean.managedBean.readOnly}"
						value="#{specificationBackingBean.managedBean.technicalItemScoreSetting.passingScore}">
						<p:ajax event="change" process="@this" partialSubmit="true" 
							listener="#{specificationBackingBean.checkTechnicalItemPassingScore(specificationBackingBean.managedBean.technicalItemScoreSetting)}"/>
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="3" integerOnly="true" />
					</p:inputText> <p:spacer width="5"></p:spacer></td>
			</tr>
		</table>
<!-- #21695 END FARID -->
	</p:panel>

	<p:panel id="sctechnicalScoringUserScoringSchemaIds"
		header="#{lbl['lbl.sc.spec.technical.financial.user.scoring.schema']}"
		rendered="#{specificationBackingBean.managedBean.technicalUserScoringSchema}"
		toggleable="true">
		<h:outputText styleClass="instruction"  rendered="#{specificationBackingBean.managedBean.technicalUserScoringSchema}"
			value="#{lbl['lbl.sc.spec.technical.financial.user.scoring.schema.instructions']}"
			escape="false" />
			<br/>
		<table>
			<tr>


				<td style="width: 200px;" class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>
				<td class="TableFieldRight"><ac:scSingleFileUploadButton
						id="techUserScoreUploadBtn"
						popupWidgetVar="technicalUserScoringSchema"
						attachment="#{specificationBackingBean.managedBean.qt.technicalUserScoringSchemaAttachment}"
						readonly="#{specificationBackingBean.managedBean.readOnly}"
						update="@([id$=techUserScoreUploadBtn])" />


				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
