<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.tech.score.setting']}"
		toggleable="true">



		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.weightage']}" />
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
						<p:outputLabel value="*" styleClass="mandatory" />
					</ui:fragment></td>
				<td><p:selectOneRadio required="true"
						disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
						label="#{lbl['lbl.sc.spec.weightage']}" id="techWeightage"
						value="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq}">
						<f:selectItems
							value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="technicalWeigtage,addpoints"></p:ajax>
					</p:selectOneRadio> <p:message id="techScoring" for="techWeightage" display="icon"></p:message></td>
			</tr>

		</table>

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.max.score.instruction']}" escape="false" />

		<p:dataTable id="technicalWeigtage" var="tech"
			value="#{specificationBackingBean.managedBean.technicalScoring}"
			rowKey="#{tech}" editable="true" style="width:100%"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="index">
			<!-- <ac:paginator for="technicalWeigtage" /> -->
			<!-- <p:column selectionMode="multiple" style="text-align:center;" /> -->

			<p:column headerText="#{lbl['lbl.sc.spec.technical.financial.scoring.title']}"
				style="width:50%;white-space: normal;">
				<h:outputText value="#{tech.title}" size="50" />
			</p:column>

			<p:column style="width:20%;text-align:right;">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.isQTStatusChecklistScoring()}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.max.score']}" />
					<ac:iconTooltip id="technicalScoringMaxScore#{index}SC"
						value="#{lbl['lbl.sc.spec.max.score.tooltip']}" />
				</f:facet>
				<h:outputText value="#{tech.qtScoreWeightage.score}"
					style="text-align:right"
					rendered="#{tech.definationType.parameterCode eq 'TS' or tech.definationType.parameterCode eq 'SD' or tech.definationType.parameterCode eq 'WF'}" />
				<p:inputText value="#{tech.qtScoreWeightage.score}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					id="techScoreWeight" required="true" maxlength="18"
					label="#{lbl['lbl.sc.score']}" style="text-align:right"
					rendered="#{((tech.definationType.parameterCode eq 'UP' or tech.definationType.parameterCode eq 'SP' or tech.definationType.parameterCode eq 'PD' or tech.definationType.parameterCode eq 'NA') and tech.scoringReq)}">
					<ac:validateNumber integerOnly="
					true" maxIntegerDigits="14">
					</ac:validateNumber>
					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techScoringCheckList(tech)}"
						update=":form:addpoints" />
				</p:inputText>
				<p:message id="techScoreId" for="techScoreWeight" display="icon"></p:message>
			</p:column>

			<p:column style="width:20%;text-align:right;"
				rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.spec.weight.weight']}" />
					<ac:iconTooltip id="technicalScoringWeightageScore#{index}SC"
						value="#{lbl['lbl.sc.spec.weight.weight.tooltip']}" />
				</f:facet>
				<p:inputText value="#{tech.qtScoreWeightage.weightage}"
					disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
					maxlength="5" style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">

					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techScoringCheckList(tech)}"
						update=":form:addpoints" />
				</p:inputText>

			</p:column>


		</p:dataTable>

		<p:spacer height="15"></p:spacer>



		<h:panelGroup id="addpoints">
			<table>
				<tr>
					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.points']} " /></td>

					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{specificationBackingBean.managedBean.techPoints}" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.spec.total.points.tooltip']}" /></td>
				</tr>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">

					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.spec.total.weightage']}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								style="text-align:right"
								value="#{specificationBackingBean.managedBean.technicalWeightageScore}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.total.weightage.tooltip']}" /></td>
					</tr>

				</ui:fragment>


			</table>

		</h:panelGroup>
	</p:panel>
	<p:panel id="passingScoreForTechnicalAndDemoSpecCommittee"
		toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.passing.score']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.passing.score.technical.tooltip']}" />
		</f:facet>

		<table>
			<ui:fragment
				rendered="#{specificationBackingBean.managedBean.qt.demoRequired eq 'true'}">
				<tr>
					<td style="width: 200px;"><p:outputLabel
							value=" #{lbl['lbl.sc.spec.qual.present.demo']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText style="text-align:right" maxlength="5"
							disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
							value="#{specificationBackingBean.managedBean.demoScoreSetting.passingScore}">
							<p:ajax event="blur" process="@all" partialSubmit="true"
								listener="#{specificationBackingBean.checkDemoPassingScore(specificationBackingBean.managedBean.demoScoreSetting)}" />
						</p:inputText> <ac:iconTooltip
							value="#{lbl['lbl.sc.spec.qual.present.demo.tooltip']}" /></td>
				</tr>
			</ui:fragment>



			<tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.spec.technical']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="text-align:right" maxlength="5"
						disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
						value="#{specificationBackingBean.managedBean.technicalScoreSetting.passingScore}">
						<p:ajax event="blur" process="@all" partialSubmit="true"
							update="@([id$=passingScoreForTechnicalAndDemoSpecCommittee])"
							listener="#{specificationBackingBean.checkTechnicalPassingScore(specificationBackingBean.managedBean.technicalScoreSetting)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.spec.technical.tooltip']}" />
				</td>
			</tr>
		</table>





	</p:panel>

	<p:panel
		header="#{lbl['lbl.sc.spec.technical.financial.user.scoring.schema']}"
		rendered="#{specificationBackingBean.managedBean.technicalUserScoringSchema}"
		toggleable="true" id="technicalAllUserScoringCheckistScUploadIds">
		<table>
			<tr>


				<td style="width: 200px;" class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 500px;">
						<tr>
							<td colspan="2"><p:commandButton
									disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
									oncomplete="technicalUserScoringSchema.show();return false;"
									value="#{lbl['lbl.txt.attach.files']}" partialSubmit="true"
									process="@this">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attachedIdsDemo" var="attachFile"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									value="#{specificationBackingBean.managedBean.qt.technicalUserScoringSchemaAttachment}"
									rowIndexVar="attachFileIndex" columns="1" style="width:100%">
									<table>
										<tr>
											<!-- <td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage
													name="/css/images/design/#{specificationBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td> -->
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{specificationBackingBean.downloadFile(attachFile)}" />
												<p:commandLink
													disabled="#{specificationBackingBean.managedBean.readOnly and !specificationBackingBean.isQTStatusChecklistScoring()}"
													action="#{specificationBackingBean.deleteTechnicalFinacialUserScoringSchema('T')}"
													immediate="true" update="@form">
													<h:graphicImage styleClass="tasklist_title1"
														value="/css/images/design/trash.png" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
