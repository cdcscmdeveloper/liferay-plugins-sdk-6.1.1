<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="financialCashOnHandScore" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"></p:messages>

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				action="#{specificationBackingBean.acceptCompanyScoring}">
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.criteriaType}"
					value="52" />
			</p:commandButton>



		</div>
		<p:spacer height="50"></p:spacer>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.stage.title']}"></h:outputLabel>
					</td>
					<td><p:inputTextarea style="width: 100%;"
							value="#{specificationBackingBean.managedBean.scQtChecklist.title}"
							disabled="true" rows="2" cols="150"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.spec.cash.hand']}" toggleable="true">
			<p:dataTable id="cashHand" rowIndexVar="index" var="cash"
				rowKey="#{cash}">
				<ac:paginator for="cashHand"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.act.no']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.act.type']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.address']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.amount']}">
					<p:inputText></p:inputText>
				</p:column>

			</p:dataTable>

		</p:panel>

		<h:panelGrid columns="2">
			<h:outputLabel value="#{lbl['lbl.sc.spec.total.cash']}"></h:outputLabel>
			<p:inputText readonly="true" disabled="true"></p:inputText>
		</h:panelGrid>

		<p:panel header="#{lbl['lbl.sc.spec.score.total.cash']}"
			toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel> <p:outputLabel
							value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><p:selectOneMenu required="true"
							label="#{lbl['lbl.sc.spec.asset.score.type']}"
							id="cashOnHandAutoScore"
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
							<p:ajax event="change" update="totalcashOnhand"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu> <p:message id="cashOnHandAutoScoreId" for="cashOnHandAutoScore"
							display="icon"></p:message></td>
				</tr>
			</table>

			<h:panelGroup id="totalcashOnhand">
				<p:panel
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

					<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
					<h:panelGroup id="cashGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
						<ui:param name="componentName" value="CashOnHand" />
						<ui:param name="scoringPnlId" value="cashId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.spec.score.total.cash']}"></ui:param>
						<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								oncomplete="scoreWidget.paginator.endLink.click();"
								actionListener="#{specificationBackingBean.addScoring(52)}"
								update="#{scoringPnlId}" icon="ui-icon-add" />
							<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
								process="@this" partialSubmit="true" icon="ui-icon-delete"
								action="#{specificationBackingBean.deleteSelectedRowsAction(scoringList)}"
								update="#{scoringPnlId}">
								<f:setPropertyActionListener
									target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
									value="#{false}" />
							</p:commandButton>

						</div>
					</h:panelGroup>
				</p:panel>
				<p:panel 
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
							</td>
							<td><p:inputText id="finCashScore" maxlength="18"
									label="#{lbl['lbl.sc.spec.max.score']}" required="true"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
								</p:inputText> <p:message id="finCashMaxScore" for="finCashScore"
									display="icon"></p:message></td>
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>

		</p:panel>


	</ui:define>
</ui:composition>
