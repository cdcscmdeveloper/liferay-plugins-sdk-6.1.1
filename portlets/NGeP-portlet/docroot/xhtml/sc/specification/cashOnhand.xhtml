<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="cash" modal="true" width="800" height="400">
		<p:panel header="#{lbl['lbl.sc.spec.cash.hand']}" toggleable="true">
			<p:dataTable id="cashHand" rowIndexVar="index" var="cash"
				rowKey="#{cash}">
				<ac:paginator for="cashHand"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.act.no']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.act.type']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.address']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.amount']}">
					<p:inputText></p:inputText>
				</p:column>

			</p:dataTable>

		</p:panel>

		<h:panelGrid columns="2">
			<h:outputLabel value="#{lbl['lbl.sc.spec.total.cash']}"></h:outputLabel>
			<p:inputText></p:inputText>
		</h:panelGrid>

		<ui:param name="scoringPnlGroupId" value="contractorGroupId" />
		<h:panelGroup id="cashGroupId">
			<ui:param name="scoringList"
				value="#{specificationBackingBean.managedBean.scoringCash}" />
			<ui:param name="componentName" value="CashOnHand" />
			<ui:param name="scoringPnlId" value="cashId" />
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.spec.score.total.cash']}"></ui:param>
			<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
					process="@this,#{scoringPnlId}" partialSubmit="true"
					actionListener="#{specificationBackingBean.scoringCash}"
					update="#{scoringPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
					icon="ui-icon-delete"
					action="#{specificationBackingBean.deleteScoring}"
					update="#{scoringPnlId}" />

			</div>
		</h:panelGroup>

		<p:commandButton value="#{lbl['lbl.sc.spec.btn.tech.close']}"
			style="float:right;" onclick="cash.hide();" icon="ui-icon-cancel"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			oncomplete="cash.hide();" icon="ui-icon-accept"></p:commandButton>


	</p:dialog>
</ui:composition>
