<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="TechnicalEmployeeList" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"></p:messages>
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				immediate="true"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				rendered="#{((specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION) or(!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.scQtChecklist.scoringReq and specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
				style="float:right;"
				action="#{specificationBackingBean.saveCheckListScores}">
				<f:setPropertyActionListener
					target="#{specificationBackingBean.managedBean.criteriaType}"
					value="20" />
			</p:commandButton>



		</div>
		
		<ui:include src="checklistHeader.xhtml" />

		<p:spacer height="20"></p:spacer>
		<p:panel header="#{lbl['lbl.sc.spec.tech.staff.list']}"
			toggleable="true">

			<p:dataTable id="techEmployeeList" var="techEmployee"
				rowIndexVar="index">
				<ac:paginator for="techEmployeeList"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.qualification']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.no.of.yrs.exp']}">
					<h:outputText></h:outputText>
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:spacer height="20"></p:spacer>
		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.total.staff']}"></h:outputLabel>
				</td>
				<td><p:inputText readonly="true"></p:inputText></td>
			</tr>
		</table>
		<p:spacer height="20"></p:spacer>
		<p:panel id="technicalStaffListScoring"
			header="#{lbl['lbl.sc.spec.score.tot.tech.staff']}" toggleable="true"
			rendered="#{specificationBackingBean.managedBean.scQtChecklist.scoringReq}">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.asset.score.type']}"></p:outputLabel> <ui:fragment
							rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
							<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
						</ui:fragment></td>
					<td><p:selectOneMenu required="true"
							disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
							label="#{lbl['lbl.sc.spec.asset.score.type']}"
							id="techNoOfEmployeeAutoScore"
							value="#{specificationBackingBean.managedBean.checklistScoreType}">
							<f:selectItems value="#{specificationBackingBean.scoreDetails}"></f:selectItems>
							<p:ajax event="change"
								update="employeelist,technicalStaffListScoring"
								listener="#{specificationBackingBean.scoreTypeChange}"></p:ajax>
						</p:selectOneMenu> <p:message id="techNoOfEmployeeAutoScoreMsg"
							for="techNoOfEmployeeAutoScore" display="icon"></p:message></td>
					<td>
						<ac:iconTooltip value="#{lbl['lbl.tpl.spec.content.scoring.settings.score.type.tooltip']}" />
					</td>
				</tr>
			</table>
			<p:spacer height="5"></p:spacer>
			<h:panelGroup id="employeelist">
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '1'}">

					<ui:param name="scoringPnlGroupId" value="totalStaffId" />
					<h:panelGroup id="totalStaffGroupId">
						<ui:param name="scoringList"
							value="#{specificationBackingBean.managedBean.checkListScore}" />
						<ui:param name="selectionList"
							value="#{specificationBackingBean.managedBean.checkListSelectScore}" />
						<ui:param name="componentName" value="Staff" />
						<ui:param name="scoringPnlId" value="staffId" />
						<ui:param name="scoringPnlName"
							value="#{lbl['lbl.sc.spec.score.tot.tech.staff']}"></ui:param>
						<ui:include src="/xhtml/sc/specification/scoring.xhtml"></ui:include>
						<div align="right">
							<p:commandButton value="#{lbl['lbl.btn.add']}"
								disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
								process="@this,#{scoringPnlId}" partialSubmit="true"
								oncomplete="scoreWidget.paginator.endLink.click();"
								update="#{scoringPnlId}"
								actionListener="#{specificationBackingBean.addScoring(20)}" />
							<p:commandButton value="#{lbl['lbl.btn.delete']}"
								disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
								process="@this" partialSubmit="true"
								action="#{specificationBackingBean.markDeleteSelectedRowsAction(scoringList, specificationBackingBean.managedBean.toBeRemoveList)}"
								update="#{scoringPnlId}">
								<f:setPropertyActionListener
									target="#{specificationBackingBean.managedBean.templateSpecBean.selectAll}"
									value="#{false}" />
							</p:commandButton>
						</div>
					</h:panelGroup>
				</h:panelGroup>
				<p:spacer height="5"></p:spacer>
				<h:panelGroup
					rendered="#{specificationBackingBean.managedBean.checklistScoreType eq '2'}">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.spec.max.score']}"></p:outputLabel>
								<ui:fragment
									rendered="#{!specificationBackingBean.managedBean.readOnly or specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}">
									<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel>
								</ui:fragment></td>
							<td><p:inputText maxlength="18" required="true"
									style="text-align:right;"
									disabled="#{specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId != QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION}"
									label="#{lbl['lbl.sc.spec.max.score']}"
									id="techEmployeeListScore"
									value="#{specificationBackingBean.managedBean.scQtCheckListScore.score}">
									<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
								</p:inputText> <p:message id="employeeListId" for="techEmployeeListScore"
									display="icon"></p:message></td>
						</tr>
					</table>
				</h:panelGroup>
			</h:panelGroup>
		</p:panel>

	</ui:define>
</ui:composition>
