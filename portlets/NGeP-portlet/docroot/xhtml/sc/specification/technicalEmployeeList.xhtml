<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="technicalEmployeeList" modal="true" width="800"
		height="400">
		<p:panel header="#{lbl['lbl.sc.spec.tech.employee.list']}"
			toggleable="true" collapsed="true">

			<p:dataTable id="techEmployeeList" var="techEmployee"
				rowIndexVar="index">
				<ac:paginator for="techEmployeeList"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.spec.tech.name']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.tech.identification.no']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.designation']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.tech.qualification']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.tech.yrs.exp']}">
					<h:outputText></h:outputText>
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:commandButton value="#{lbl['lbl.sc.spec.btn.tech.close']}"
			style="float:right;" onclick="technicalEmployeeList.hide();"
			icon="ui-icon-cancel"></p:commandButton>



	</p:dialog>
</ui:composition>
