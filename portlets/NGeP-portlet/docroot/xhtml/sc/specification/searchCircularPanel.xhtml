<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="circular" header="Search">

		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.circular.no']}"></h:outputLabel></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.cirCularNo}"
						size="100" /></td>
			</tr>
			<tr>
				<td style="width: 40%"><h:outputLabel
						value="#{lbl['lbl.sc.spec.circular.name']}"></h:outputLabel></td>
				<td><h:inputText style="margin-bottom:5px;"
						value="#{specificationBackingBean.managedBean.circularName}" /></td>
			</tr>
			<tr>
				<td style="width: 40%"><h:outputLabel value="Item Name"></h:outputLabel></td>
				<td><h:inputText
						value="#{specificationBackingBean.managedBean.itemName}"
						size="100" /></td>
			</tr>

		</table>
	</p:panel>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sc.tpl.btn.search']}"
			action="#{specificationBackingBean.searchCircularList}"
			update="circularList" icon="ui-icon-search" />
		<p:commandButton value="#{lbl['lbl.sc.eva.btn.reset']}"
			action="#{specificationBackingBean.resetCircular}" update="circular"
			icon="ui-icon-reset" resetValues="true" partialSubmit="true"
			process="@this" />
	</div>



	<p:panel header="#{lbl['lbl.sc.spec.circular.list']}" toggleable="true">

		<h:panelGrid>
			<p:dataTable id="circularList" var="circular" style="width:100%"
				value="#{specificationBackingBean.searchCircular}"
				rowKey="#{circular}" rowIndexVar="index" lazy="true">
				<ac:paginator for="circularList"></ac:paginator>
				<p:ajax event="rowSelectRadio"
					listener="#{specificationBackingBean.circularListSelect}"
					update=":form:panelItemGroupList"></p:ajax>
				<p:columnGroup>
					<p:row>

						<p:column headerText="#{lbl['lbl.sc.spec.circular.no']}"
							style="width:15%">
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.spec.circular.name']}"
							style="width:20%">
						</p:column>

						<p:column headerText="Circular Type" style="width:15%">

						</p:column>



						<p:column headerText="Effective Date" style="width:15%">

						</p:column>

						<p:column headerText="Expiry Date" style="width:15%">

						</p:column>

						<p:column style="width:5%">

						</p:column>

					</p:row>
				</p:columnGroup>

				<p:column headerText="#{lbl['lbl.sc.spec.circular.no']}"
					style="width:15%">
					<h:outputText value="#{circular.circularNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.circular.name']}"
					style="width:20%">
					<h:outputText value="#{circular.name}"></h:outputText>
				</p:column>

				<p:column headerText="Circular Type" style="width:15%">
					<h:outputText value="#{circular.ctCircular.circularType}"></h:outputText>
				</p:column>


				<p:column headerText="Effective Date" style="width:15%">
					<h:outputText value="#{circular.startDate}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column headerText="Expiry Date" style="width:15%">
					<h:outputText value="#{circular.endDate}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
				<p:column headerText="Selection" selectionMode="single"
					style="width:5%"></p:column>
			</p:dataTable>
		</h:panelGrid>
	</p:panel>
	<h:panelGroup id="panelItemGroupList">
		<ui:fragment
			rendered="#{specificationBackingBean.managedBean.circularType eq 'PCR'}">
			<p:panel header="#{lbl['lbl.sc.spec.panel.item.list']}"
				toggleable="true">

				<h:panelGrid id="panel">
					<p:dataTable id="panelItemList" var="panelItem" rowIndexVar="index"
						lazy="true" style="width:100%"
						value="#{specificationBackingBean.managedBean.panelItemList}"
						rowKey="#{panelItem}">

						<ac:paginator for="panelItemList"></ac:paginator>
						<p:ajax event="rowSelectRadio"
							listener="#{specificationBackingBean.panelListSelect}"></p:ajax>
						<p:columnGroup>
							<p:row>


								<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
									style="width:20%">

								</p:column>

								<p:column headerText="Specification" style="width:15%">

								</p:column>
								<p:column headerText="Item Category" style="width:10%">

								</p:column>

								<p:column headerText="Panel Coverage" style="width:5%">

								</p:column>

								<p:column headerText="UOM" style="width:15%">

								</p:column>

								<p:column headerText="Min.Order Qty" style="width:15%">

								</p:column>

								<p:column headerText="Had Pembelian Luar Kontrak"
									style="width:18%">

								</p:column>

								<p:column>

								</p:column>

							</p:row>
						</p:columnGroup>




						<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
							style="width:20%">
							<h:outputText value="#{panelItem.itemName}" />
						</p:column>

						<p:column headerText="Specification" style="width:15%">
							<h:outputText value="#{panelItem.specification}" />

						</p:column>
						<p:column headerText="Item Category" style="width:10%">
							<h:outputText
								value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
						</p:column>

						<p:column headerText="Panel Coverage" style="width:5%">
							<h:outputText
								value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
						</p:column>

						<p:column headerText="UOM" style="width:15%">
							<h:outputText value="#{panelItem.pmUom.uomId}" />
						</p:column>

						<p:column headerText="Min.Order Qty" style="width:15%">
							<h:outputText value="#{panelItem.minimumOrderQty}" />
						</p:column>

						<p:column headerText="Had Pembelian Luar Kontrak"
							style="width:18%">

						</p:column>


						<p:column headerText="Selection" selectionMode="single"
							style="width:2%" />

					</p:dataTable>
				</h:panelGrid>

			</p:panel>

		</ui:fragment>
	</h:panelGroup>

</ui:composition>
