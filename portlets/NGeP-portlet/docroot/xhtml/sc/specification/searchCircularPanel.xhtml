<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="circular" header="#{lbl['lbl.cm.search']}">

		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.circular.no']}"></h:outputLabel></td>
				<td><p:inputText maxlength="50"
						value="#{specificationBackingBean.managedBean.ctSearchBean.cirCularNo}"
						size="75" /></td>
			</tr>
			<tr>
				<td style="width: 20%"><h:outputLabel
						value="#{lbl['lbl.sc.spec.circular.name']}"></h:outputLabel></td>
				<td><p:inputText style="margin-bottom:5px;" maxlength="200"
						size="100"
						value="#{specificationBackingBean.managedBean.ctSearchBean.circularName}" /></td>
			</tr>
			<tr>
				<td style="width: 20%"><h:outputLabel
						value="#{lbl['lbl.sc.spec.circular.bo.item.name']}"></h:outputLabel></td>
				<td><p:inputText maxlength="100"
						value="#{specificationBackingBean.managedBean.ctSearchBean.itemName}"
						size="100" /></td>
			</tr>

		</table>
	</p:panel>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sc.tpl.btn.search']}"
			action="#{specificationBackingBean.searchCircularList}"
			update="circularList,panelItemGroupList" icon="ui-icon-search" />
		<p:commandButton value="#{lbl['lbl.sc.eva.btn.reset']}"
			action="#{specificationBackingBean.resetCircular}"
			update="circular,panelItemGroupList" icon="ui-icon-reset"
			resetValues="true" partialSubmit="true" process="@this" />
	</div>



	<p:panel header="#{lbl['lbl.sc.spec.circular.list']}" toggleable="true">


		<p:dataTable id="circularList" var="circular" style="width:100%"
			value="#{specificationBackingBean.searchCircular}" rows="10"
			rowKey="#{circular.circularVerId}" rowIndexVar="index" lazy="true"
			selection="#{specificationBackingBean.managedBean.circularVer}">
			<ac:paginator for="circularList"></ac:paginator>
			<p:ajax event="rowSelectRadio" process="@this"
				listener="#{specificationBackingBean.circularListSelect}"
				update=":form:panelItemGroupList"></p:ajax>
			<p:columnGroup>
				<p:row>

					<p:column headerText="#{lbl['lbl.sc.spec.circular.no']}"
						style="width:15%">
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.circular.name']}"
						style="width:20%">
					</p:column>

					<p:column
						headerText="#{lbl['lbl.sc.spec.circular.bo.circular.type']}"
						style="width:15%">

					</p:column>



					<p:column
						headerText="#{lbl['lbl.sc.spec.circular.bo.effective.date']}"
						style="width:15%">

					</p:column>

					<p:column
						headerText="#{lbl['lbl.sc.spec.circular.bo.expiary.date']}"
						style="width:15%">

					</p:column>

					<p:column style="width:5%">

					</p:column>

				</p:row>
			</p:columnGroup>

			<p:column headerText="#{lbl['lbl.sc.spec.circular.no']}"
				style="width:15%">
				<h:outputText value="#{circular.circularNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.circular.name']}"
				style="width:20%">
				<h:outputText value="#{circular.name}"></h:outputText>
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.spec.circular.bo.circular.type']}"
				style="width:15%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, circular.docType)}"></h:outputText>
			</p:column>


			<p:column
				headerText="#{lbl['lbl.sc.spec.circular.bo.effective.date']}"
				style="width:15%">
				<h:outputText value="#{circular.startDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.circular.bo.expiary.date']}"
				style="width:15%">
				<h:outputText value="#{circular.endDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.circular.list.selection']}"
				selectionMode="single" style="width:5%"></p:column>
		</p:dataTable>

	</p:panel>
	<h:panelGroup id="panelItemGroupList">
		<ui:fragment
			rendered="#{specificationBackingBean.managedBean.circularType eq 'PQ'}">
			<p:panel header="#{lbl['lbl.sc.spec.panel.item.list']}"
				toggleable="true">


				<p:dataTable id="panelItemList" var="panelItem" rowIndexVar="index"
					style="width:100%" rows="10"
					value="#{specificationBackingBean.managedBean.panelItemList}"
					rowKey="#{panelItem}">

					<ac:paginator for="panelItemList"></ac:paginator>
					<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true"
						listener="#{specificationBackingBean.panelListSelect}"></p:ajax>
					<p:columnGroup>
						<p:row>


							<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
								style="width:20%">

							</p:column>

							<p:column
								headerText="#{lbl['lbl.tpl.spec.content.specification']}"
								style="width:15%">

							</p:column>
							<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
								style="width:10%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
								style="width:5%">

							</p:column>

							<p:column headerText="#{lbl['lbl.tpl.spec.content.uom']}"
								style="width:15%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
								style="width:15%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
								style="width:18%">

							</p:column>

							<p:column>

							</p:column>

						</p:row>
					</p:columnGroup>




					<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
						style="width:20%">
						<h:outputText value="#{panelItem.itemName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
						style="width:15%">
						<h:outputText value="#{panelItem.specification}" />

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
						style="width:10%">
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
						style="width:5%">
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.tpl.spec.content.uom']}"
						style="width:15%">
						<h:outputText value="#{panelItem.pmUom.uomId}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
						style="width:15%">
						<h:outputText value="#{panelItem.minimumOrderQty}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
						style="width:18%">

					</p:column>


					<p:column
						headerText="#{lbl['lbl.sc.spec.circular.list.selection']}"
						selectionMode="single" style="width:2%" />

				</p:dataTable>


			</p:panel>

		</ui:fragment>
	</h:panelGroup>

</ui:composition>
