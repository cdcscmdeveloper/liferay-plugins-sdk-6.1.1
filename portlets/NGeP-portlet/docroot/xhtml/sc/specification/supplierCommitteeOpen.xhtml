<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
		<p:commandLink value="CategoryCodeList"></p:commandLink>
		<p:dataTable id="openPnlId" var="cateGory" style="width:100%"
			rowIndexVar="index" styleClass="openPnlId">


			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<h:outputText></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryL2Code}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryL3Code}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryType}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.mandatory']}"
				style="width:10%">
				<h:outputText></h:outputText>
			</p:column>

		</p:dataTable>

	</p:panel>


	<p:panel>

		<table style="width: 100%">

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.so.allstate']}"
						style="width : 80px" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>

			</tr>

			<tr>


				<td style="width: 150px"><p:outputLabel
						value="#{lbl['lbl.so.mullocal']}" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>

			</tr>

		</table>

	</p:panel>



	<p:panel>

		<p:panel header="Location List">
			<table style="width: 100%">
				<tr>
					<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locLevels" disabled="true"
							style="width: 178px;margin-bottom: 5px;">

							<f:selectItems
								value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />

						</p:selectOneMenu></td>
				</tr>
			</table>
		</p:panel>
		<p:panel>
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneLocationDataTable"
					value="#{specificationBackingBean.managedBean.zoneTrees}"
					var="zoneTree" style="width:65%" rowIndexVar="index">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location">

							<p:treeNode type="zone">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							<p:treeNode type="city">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
						</p:tree>
					</p:column>

				</p:dataTable>
			</h:panelGrid>

		</p:panel>





	</p:panel>
	<table style="width: 100%">
		<tr>
			<td style="width: 150px"><p:outputLabel
					value="#{lbl['lbl.so.paidup']}" /></td>
			<td><p:inputText style="margin-right:5px;" disabled="true" /></td>
		</tr>
		<tr>
			<td style="width: 150px"><p:outputLabel value="Total Supplierrs" /></td>
			<td><p:inputText style="margin-right:5px;" disabled="true" /></td>
		</tr>
	</table>

	<!-- <p:panelGrid columns="1" style="width:50%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			icon="ui-icon-search" style="float:right;" partialSubmit="true" />
	</p:panelGrid> -->
</ui:composition>
