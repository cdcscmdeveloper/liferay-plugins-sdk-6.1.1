<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">

		<p:dataTable id="openPnlId" var="cateGory" rowIndexVar="index"
			styleClass="openPnlId"
			value="#{specificationBackingBean.managedBean.suppCriteriaopenList}">


			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryL3Code}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryL2Code}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryL3Code}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.mandatory']}"
				style="width:10%">

				<h:outputText
					value="#{lbl[cateGory.mandatory ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

		</p:dataTable>

	</p:panel>


	<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}"
		toggleable="true"
		rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal !='false'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 160px;"><p:outputLabel
						value="#{lbl['lbl.so.paidup']}" /></td>
				<td><p:inputText disabled="true" size="30" maxlength="18"
						value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td style="width: 94px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.zone.location.level']}" /></td>
				<td><p:selectOneMenu id="locZoneLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel.parameterId}"
						style="width: 178px;margin-bottom: 5px;">

						<f:selectItems
							value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
						<p:ajax event="change"
							listener="#{specificationBackingBean.selectLocation}"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>


	<p:panel
		rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal !='false'}">
		<h:panelGrid width="100%">
			<p:dataTable id="zoneyesDataTable"
				value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="Location">
					<p:tree value="#{zoneTree}" var="location">

						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>

						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>




					</p:tree>
				</p:column>



			</p:dataTable>

		</h:panelGrid>

	</p:panel>




	<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}"
		toggleable="true"
		rendered="#{((specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal !='false'))}">
		<table style="width: 100%">
			<tr>
				<td style="width: 94px"><p:outputLabel
						value="#{lbl['lbl.so.allstate']}"
						rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState =='false'}" />
				</td>
				<td><p:inputText disabled="true" 
						value="No"
						rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState =='false'}" />
				</td>

			</tr>
			<tr>
				<td style="width: 160px;"><p:outputLabel
						value="#{lbl['lbl.so.paidup']}" /></td>
				<td><p:inputText size="30" maxlength="18" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td style="width: 94px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.zone.location.level']}" /></td>
				<td><p:selectOneMenu id="locLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.locationLevel.parameterId}"
						style="width: 178px;">

						<f:selectItems
							value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
						<p:ajax event="change"
							listener="#{specificationBackingBean.selectLocation}"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<p:panel
		rendered="#{((specificationBackingBean.managedBean.scQt.estimatedAmount le '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false' and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal =='false') or (specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState=='false'  and specificationBackingBean.managedBean.scQt.zonal !='false'))}">
		<h:panelGrid width="100%">

			<p:dataTable id="zoneLocationDataTable"
				value="#{specificationBackingBean.managedBean.zoneTrees}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="Location">
					<p:tree value="#{zoneTree}" var="location">
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>

					</p:tree>
				</p:column>


			</p:dataTable>

		</h:panelGrid>


	</p:panel>
	<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}"
		toggleable="true"
		rendered="#{specificationBackingBean.managedBean.scQt.estimatedAmount gt '500000' and specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState !='false'}">
		<table>
			<tr>
				<td style="width: 160px;"><p:outputLabel
						value="#{lbl['lbl.so.allstate']}" /></td>
				<td><p:inputText
						value="#{lbl[specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.allState ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
						disabled="true" style="margin-right:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.paidup']}" /></td>
				<td><p:inputText maxlength="18" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>


	<p:panel toggleable="true"
		header=" #{lbl['lbl.sc.spec.supplier.criteria.qual.suppliers']}">
		<table>
			<tr>
				<td style="width: 150px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.supplier.criteria.tot.suppliers']}" /></td>
				<td><p:inputText style="margin-right:5px;" disabled="true" />
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
