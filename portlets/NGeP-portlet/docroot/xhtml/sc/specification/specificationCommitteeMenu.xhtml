<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:if
		test="${specificationBackingBean.managedBean.scQt.evaluationType eq '2' or(specificationBackingBean.managedBean.scQt.evaluationType eq '1' and specificationBackingBean.managedBean.scQt.techEvaluationReq eq 'true')}">

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%;" class="sidemenutd"
					style="vertical-align: baseline;"><p:tabMenu
						id="specCommitteeId"
						activeIndex="#{specificationBackingBean.managedBean.activeIndex}"
						styleClass="sidemenu" style="display : table-caption;">

						<p:menuitem value="#{lbl['lbl.sc.spec.general']}" update="@form"
							action="#{specificationBackingBean.qtChecklistTabChange(0)}" />
						<p:menuitem value="#{lbl['lbl.sc.spec.supplier.qual.criteraia']}"
							action="#{specificationBackingBean.qtChecklistTabChange(1)}"
							update="@form" />




						<p:menuitem value="#{lbl['lbl.sc.spec.tech.check.list']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(2)}"
							update="@form" />




						<p:menuitem value="#{lbl['lbl.sc.spec.finance.check.list']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(3)}"
							update="@form" />



						<p:menuitem value="#{lbl['lbl.sc.spec.tech.scoring']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(4)}"
							update="@form" />



						<p:menuitem value="#{lbl['lbl.sc.spec.financial.scoring']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(5)}"
							update="@form" />


						<p:menuitem value="#{lbl['lbl.sc.spec.recommendation']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(6)}"
							update="@form" />


						<p:menuitem value="#{lbl['lbl.sc.spec.delivery.service.address']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(7)}"
							update="@form" />

						<c:if
							test="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' or specificationBackingBean.managedBean.fulfilmentType eq 'PA'}">
							<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(8)}"
								update="@form" />
							<p:menuitem value="#{lbl['lbl.sc.spec.committee.endorse']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(9)}"
								update="@form" />
						</c:if>



						<c:if
							test="#{specificationBackingBean.managedBean.fulfilmentType eq null or specificationBackingBean.managedBean.fulfilmentType eq 'OF'}">
							<p:menuitem value="#{lbl['lbl.sc.spec.committee.endorse']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(8)}"
								update="@form" />
						</c:if>

					</p:tabMenu></td>
				<td width="80%;"><c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '0'}">

						<ui:include src="specificationDetails.xhtml"></ui:include>

					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '1'}">

						<ui:include src="SupplierCommitteeQualificationCriteria.xhtml"></ui:include>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '2'}">

						<ui:include src="technicalChecklist.xhtml"></ui:include>


					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '3'}">

						<ui:include src="financialChecklist.xhtml"></ui:include>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '4'}">

						<ui:include src="weightageGroup.xhtml" />


					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '5'}">

						<ui:include src="financialScoring.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '6'}">

						<ui:include src="recomondation.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '7'}">

						<ui:include src="deliveryAddress.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '8'}">

						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' or specificationBackingBean.managedBean.fulfilmentType eq 'PA'}">

							<ui:include src="schedule.xhtml" />
						</ui:fragment>

						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'OF'}">

							<ui:include src="specificationSignoff.xhtml" />
						</ui:fragment>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '9'}">

						<ui:include src="specificationSignoff.xhtml" />
					</c:if></td>
			</tr>
		</table>

	</c:if>



	<c:if
		test="${specificationBackingBean.managedBean.scQt.evaluationType eq '1' and specificationBackingBean.managedBean.scQt.techEvaluationReq ne 'true'}">

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%;" class="sidemenutd"
					style="vertical-align: baseline;"><p:tabMenu
						id="specCommitteeOneTierId"
						activeIndex="#{specificationBackingBean.managedBean.activeIndex}"
						styleClass="sidemenu" style="display : table-caption;">

						<p:menuitem value="#{lbl['lbl.sc.spec.general']}" update="@form"
							action="#{specificationBackingBean.qtChecklistTabChange(0)}" />
						<p:menuitem value="#{lbl['lbl.sc.spec.supplier.qual.criteraia']}"
							action="#{specificationBackingBean.qtChecklistTabChange(1)}"
							update="@form" />

						<c:if
							test="#{specificationBackingBean.managedBean.scQt.evaluationType eq '1'}">
							<p:menuitem value="#{lbl['lbl.sc.spec.prepare.specification']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(2)}"
								update="@form" />
						</c:if>





						<p:menuitem value="#{lbl['lbl.sc.spec.finance.check.list']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(3)}"
							update="@form" />





						<p:menuitem value="#{lbl['lbl.sc.spec.financial.scoring']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(4)}"
							update="@form" />


						<p:menuitem value="#{lbl['lbl.sc.spec.recommendation']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(5)}"
							update="@form" />


						<p:menuitem value="#{lbl['lbl.sc.spec.delivery.service.address']}"
							actionListener="#{specificationBackingBean.qtChecklistTabChange(6)}"
							update="@form" />

						<c:if
							test="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' or specificationBackingBean.managedBean.fulfilmentType eq 'PA'}">
							<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(7)}"
								update="@form" />

							<p:menuitem value="#{lbl['lbl.sc.spec.committee.endorse']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(8)}"
								update="@form" />
						</c:if>


						<c:if
							test="#{specificationBackingBean.managedBean.fulfilmentType eq null or specificationBackingBean.managedBean.fulfilmentType eq 'OF'}">
							<p:menuitem value="#{lbl['lbl.sc.spec.committee.endorse']}"
								actionListener="#{specificationBackingBean.qtChecklistTabChange(7)}"
								update="@form" />
						</c:if>



					</p:tabMenu></td>
				<td width="80%;"><c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '0'}">

						<ui:include src="specificationDetails.xhtml"></ui:include>

					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '1'}">

						<ui:include src="SupplierCommitteeQualificationCriteria.xhtml"></ui:include>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '2'}">
						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQt.evaluationType eq '1'}">
							<ui:include src="prepareSpecification.xhtml"></ui:include>
						</ui:fragment>

					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '3'}">

						<ui:include src="financialChecklist.xhtml"></ui:include>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '4'}">

						<ui:include src="financialScoring.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '5'}">

						<ui:include src="recomondation.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '6'}">

						<ui:include src="deliveryAddress.xhtml" />
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '7'}">

						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'PS' or specificationBackingBean.managedBean.fulfilmentType eq 'PA'}">

							<ui:include src="schedule.xhtml" />
						</ui:fragment>

						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.fulfilmentType eq 'OF'}">

							<ui:include src="specificationSignoff.xhtml" />
						</ui:fragment>
					</c:if> <c:if
						test="#{specificationBackingBean.managedBean.activeIndex eq '8'}">

						<ui:include src="specificationSignoff.xhtml" />
					</c:if></td>
			</tr>
		</table>




	</c:if>
	<ui:include src="/xhtml/sc/specification/upload.xhtml" />
</ui:composition>
