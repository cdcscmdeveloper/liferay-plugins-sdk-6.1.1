<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="specDetails" header="#{lbl['lbl.sc.spec.details']}"
		toggleable="true">

		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.title']}" /></td>
				<td colspan="3"><p:inputTextarea label="#{lbl['lbl.so.title']}"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						required="true" cols="130" rows="2" disabled="true"
						readonly="true" style=" margin-bottom:5px;" maxlength="100" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td colspan="3"><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.panel ? 'Yes' : 'No'}"
						readonly="true" disabled="true" size="30" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
				</td>
				<td><p:inputText readonly="true" style="text-align: right;"
						value="#{specificationBackingBean.managedBean.scQt.estimatedAmount}"
						disabled="true" size="30">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><h:outputLabel value=" #{lbl['lbl.sc.spec.justification']}" /></td>
				<td colspan="3"><p:inputTextarea rows="3" cols="30"
						style="margin-bottom:5px;"
						value="#{specificationBackingBean.managedBean.scQt.justificationRemark}"
						readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="Quotation/Tender Type" /></td>
				<td><p:inputText readonly="true" size="30"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.quotationTenderType, specificationBackingBean.managedBean.scQt.qtType)}"
						disabled="true" /></td>
				<td style="width: 200px;"><h:outputLabel value="Open For" /></td>
				<td><p:inputText readonly="true" size="30"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, specificationBackingBean.managedBean.scQt.openFor)}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.spec.peocure.category']}" /></td>
				<td><p:selectOneMenu disabled="true"
						style="width: 178px;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.spec.peocure.category']}"
						value="#{specificationBackingBean.managedBean.scQt.pmProcurementCategory.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
					</p:selectOneMenu></td>
				<td><h:outputLabel value="Zone/Location" /></td>
				<td><p:inputText readonly="true" disabled="true" size="30"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, specificationBackingBean.managedBean.scQt.zonal)}" />
				</td>
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.spec.evaluation.type']}" /></td>
				<td><p:inputText size="30"
						value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.scEvaluationType, specificationBackingBean.managedBean.scQt.evaluationType)}"
						readonly="true" disabled="true" /></td>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.spec.requir.tech.eval']}" /></td>
				<!-- update=":form:businessSpecId:recommendationid" -->
				<td><p:selectOneRadio id="techEvaluation" required="true"
						label="#{lbl['lbl.sc.spec.requir.tech.eval']}"
						value="#{specificationBackingBean.managedBean.scQt.techEvaluationReq}">
						<f:selectItems
							value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="specDetails"></p:ajax>
					</p:selectOneRadio> <p:message id="reqTechEval" for="techEvaluation" display="icon"></p:message>
				</td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.max.proposal']}" /></td>
				<td><p:inputText id="proposalId" required="true" size="30"
						label="#{lbl['lbl.sc.spec.max.proposal']}"
						value="#{specificationBackingBean.managedBean.scQt.maxProposal}"
						style="text-align:right;"></p:inputText> <p:message
						id="maxProposal" for="proposalId" display="icon"></p:message></td>
			</tr>
			<tr>
				<td><h:outputLabel value="* #{lbl['lbl.sc.spec.ful.type']}" /></td>
				<td><p:selectOneMenu required="true" id="fulfilId"
						label="#{lbl['lbl.sc.spec.ful.type']}"
						value="#{specificationBackingBean.managedBean.scQt.fulfilmentType.parameterId}"
						style="width: 178px;margin-bottom: 5px;">
						<!-- <f:selectItem itemLabel="One-Off" itemValue="1" />
				<f:selectItem itemLabel="Periodic(As and When Basis)" itemValue="2" />
				<f:selectItem itemLabel="Periodic(Schedule)" itemValue="3" /> -->
						<!-- update="progressive,frequency,businessSpecId" -->
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="progressive,frequency,businessSpecId"
							listener="#{specificationBackingBean.fulfilmentChange}"></p:ajax>
					</p:selectOneMenu> <p:message id="fulfilType" for="fulfilId" display="icon"></p:message>
				</td>
				<td><h:outputLabel
						value="*#{lbl['lbl.sc.spec.complete.period']}" escape="false" /></td>
				<td><p:inputText id="contract" required="true" size="30"
						label="#{lbl['lbl.sc.spec.complete.period']}"
						value="#{specificationBackingBean.managedBean.scQt.contractDuration}"
						style="text-align:right;" /> <h:outputText value="(Month)" /> <p:message
						id="completion" for="contract" display="icon"></p:message></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="Zone/Location Info"
		rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
				<td><p:selectOneMenu id="locationLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel.parameterId}"
						style="width: 178px;">

						<f:selectItems
							value="#{specificationBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
						<p:ajax event="change"
							listener="#{specificationBackingBean.selectLocation}"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<p:panel
		rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}">
		<h:panelGrid width="100%">
			<p:dataTable id="zoneGeneralDataTable"
				value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="Location">
					<p:tree value="#{zoneTree}" var="location">

						<p:treeNode type="zone">
							<h:outputText value="#{location.tplSpecZoneDtl.zoneName}" />
						</p:treeNode>

						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>

			</p:dataTable>
		</h:panelGrid>

	</p:panel>
