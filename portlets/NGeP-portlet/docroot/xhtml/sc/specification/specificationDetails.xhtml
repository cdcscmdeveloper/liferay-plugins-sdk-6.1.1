<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="specDetails" header="#{lbl['lbl.sc.spec.details']}"
		toggleable="true">

		<table style="width: 100%">

			<tr>
				<td><h:outputLabel value="Title" /></td>
				<td><p:inputText readonly="true"
						value="#{specificationBackingBean.managedBean.scQt.qtTitle}"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.panel ? 'Yes' : 'No'}"
						readonly="true" disabled="true"></p:inputText></td>
			</tr>

			<tr>
				<td><h:outputLabel value="Quotation/Tender Type" /></td>
				<td><p:inputText readonly="true"
						value="Open" rendered="#{specificationBackingBean.managedBean.scQt.qtType eq 'O'}"
						disabled="true"></p:inputText>
						<p:inputText readonly="true"
						value="Restricted" rendered="#{specificationBackingBean.managedBean.scQt.qtType eq 'R'}"
						disabled="true"></p:inputText>
						</td>
				<td><h:outputLabel value="Open For" /></td>
				<td><p:inputText readonly="true"
						value="Bumiputra" rendered="#{specificationBackingBean.managedBean.scQt.openFor eq 'B'}"
						disabled="true"></p:inputText>
						<p:inputText readonly="true"
						value="All" rendered="#{specificationBackingBean.managedBean.scQt.openFor eq 'A'}"
						disabled="true"></p:inputText>
						</td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.item.type']}" /></td>
				<td><p:inputText readonly="true"
						value="#{specificationBackingBean.managedBean.scQt.itemType}"
						disabled="true"></p:inputText></td>

				<td><h:outputLabel value="Zone/Location" /></td>
				<td><p:inputText readonly="true" value="Yes" disabled="true"
						rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}"></p:inputText>
					<p:inputText readonly="true" value="Yes" disabled="true"
						rendered="#{specificationBackingBean.managedBean.scQt.zonal =='false'}"></p:inputText>
				</td>
			</tr>

			<tr>
				<td><h:outputLabel
						value="* #{lbl['lbl.sc.spec.evaluation.type']}" /></td>
				<td><p:inputText
						value="One Tier" rendered="#{specificationBackingBean.managedBean.scQt.evaluationType eq '1'}"
						readonly="true" disabled="true"></p:inputText>
						<p:inputText
						value="Two Tier" rendered="#{specificationBackingBean.managedBean.scQt.evaluationType eq '2'}"
						readonly="true" disabled="true"></p:inputText>
						</td>
				<td><h:outputLabel value="Required Technical Evaluation" /></td>
				<!-- update=":form:businessSpecId:recommendationid" -->
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.scQt.techEvaluationReq}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="specDetails"></p:ajax>
					</p:selectOneRadio></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
				</td>
				<td><p:inputText readonly="true"
						value="#{specificationBackingBean.managedBean.scQt.estimatedAmount}"
						disabled="true"></p:inputText></td>


				<td><h:outputLabel value=" #{lbl['lbl.sc.spec.justification']}" /></td>
				<td><p:inputTextarea rows="3" cols="50"
						style="margin-bottom:5px;"
						value="#{specificationBackingBean.managedBean.scQt.justificationRemark}"
						readonly="true" disabled="true"></p:inputTextarea></td>
			</tr>
			<tr>

				<td><h:outputLabel
						value="*#{lbl['lbl.sc.spec.peocure.category']}" /></td>
				<td><p:selectOneMenu
						value="#{specificationBackingBean.managedBean.scQt.pmProcurementCategory.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
						<p:ajax event="change"
							listener="#{specificationBackingBean.procurementChange}"></p:ajax>
					</p:selectOneMenu></td>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.max.proposal']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.maxProposal}"></p:inputText></td>
			</tr>



			<tr>
				<td><h:outputLabel value="* #{lbl['lbl.sc.spec.ful.type']}" /></td>
				<td><p:selectOneMenu
						value="#{specificationBackingBean.managedBean.scQt.fulfilmentType}"
						style="margin-bottom:5px;">
						<!-- <f:selectItem itemLabel="One-Off" itemValue="1" />
				<f:selectItem itemLabel="Periodic(As and When Basis)" itemValue="2" />
				<f:selectItem itemLabel="Periodic(Schedule)" itemValue="3" /> -->
						<!-- update="progressive,frequency,businessSpecId" -->
						<f:selectItems
							value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.fulfilmentType)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="progressive,frequency,businessSpecId"
							listener="#{specificationBackingBean.fulfilmentChange}"></p:ajax>
					</p:selectOneMenu></td>






				<td><h:outputLabel
						value="*Contract Period/&lt;br /&gt;Completion Period(month)"
						escape="false" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQt.contractDuration}" /></td>

			</tr>



		</table>

	</p:panel>



	<p:panel header="Zone/Location Info"
		rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
				<td><p:selectOneMenu id="locationLevels" disabled="true"
						value="#{specificationBackingBean.managedBean.scQt.zoneLocationLevel}"
						style="width: 178px;margin-bottom: 5px;">

						<f:selectItems
							value="#{specificationBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
						<p:ajax event="change"
							listener="#{specificationBackingBean.selectLocation}"></p:ajax>
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<p:panel
		rendered="#{specificationBackingBean.managedBean.scQt.zonal !='false'}">
		<h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="zoneGeneralDataTable"
				value="#{specificationBackingBean.managedBean.zoneGeneralTrees}"
				var="zoneTree" style="width:65%" rowIndexVar="index">
				<p:column headerText="Location">
					<p:tree value="#{zoneTree}" var="location">

						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>

						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>




					</p:tree>
				</p:column>



			</p:dataTable>
		</h:panelGrid>

	</p:panel>
