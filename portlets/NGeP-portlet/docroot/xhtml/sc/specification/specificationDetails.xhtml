<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="specDetails" header="#{lbl['lbl.sc.spec.details']}"
		toggleable="true">

		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /></td>
				<td><p:inputText value="#{specificationBackingBean.managedBean.scQt.panel ? 'Yes' : 'No'}" readonly="true" disabled="true"></p:inputText></td>
			</tr>

			<tr>
				<td><h:outputLabel value="Quotation/Tender Type" /></td>
				<td><p:inputText readonly="true" value="#{specificationBackingBean.managedBean.scQt.qtType}" disabled="true"></p:inputText></td>
			</tr>

			<tr>
				<td><h:outputLabel
						value="* #{lbl['lbl.sc.spec.evaluation.type']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQtSpec.evaluationType}"
						readonly="true" disabled="true"></p:inputText></td>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.item.type']}" /></td>
				<td><p:inputText readonly="true" value="#{specificationBackingBean.managedBean.scQt.itemType}" disabled="true"></p:inputText></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
				</td>
				<td><p:inputText readonly="true" value="#{specificationBackingBean.managedBean.scQt.qtAmount}" disabled="true"></p:inputText></td>


				<td><h:outputLabel value=" #{lbl['lbl.sc.spec.justification']}" /></td>
				<td><p:inputTextarea rows="3" cols="50"
						value="#{specificationBackingBean.managedBean.scQtSpec.justificationRemark}" readonly="true" disabled="true"></p:inputTextarea>
				</td>
			</tr>
			<tr>
				<td><h:outputLabel
						value="*#{lbl['lbl.sc.spec.peocure.category']}" /></td>
				<td><p:selectOneMenu
						value="#{specificationBackingBean.managedBean.scQtSpec.pmProcurementCategory.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />

					</p:selectOneMenu></td>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.max.proposal']}" /></td>
				<td><p:inputText
						value="#{specificationBackingBean.managedBean.scQtSpec.maxProposal}"></p:inputText></td>
			</tr>



			<tr>
				<td><h:outputLabel value="* #{lbl['lbl.sc.spec.ful.type']}" /></td>
				<td><p:selectOneMenu
						value="#{specificationBackingBean.managedBean.scQtSpec.fulfilmentType}"
						style="margin-bottom:5px;">
						<!-- <f:selectItem itemLabel="One-Off" itemValue="1" />
				<f:selectItem itemLabel="Periodic(As and When Basis)" itemValue="2" />
				<f:selectItem itemLabel="Periodic(Schedule)" itemValue="3" /> -->
						<f:selectItems
							value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
						<p:ajax event="change" update="progressive,frequency"
							process="@this" partialSubmit="true"
							listener="#{specificationBackingBean.fulfilmentChange}"></p:ajax>
					</p:selectOneMenu></td>






				<td><h:outputLabel value="*#{lbl['lbl.sc.spec.contrat.type']}" /></td>
				<td><h:panelGroup>
						<table style="width: 50%">
							<tr>
								<td><h:inputText size="4"
										value="#{specificationBackingBean.managedBean.scQtSpec.contractDuration}" /></td>
								<td><h:outputLabel
										value="(#{lbl['lbl.sc.spec.contrat.year']})" /></td>
								<td><h:inputText size="2"
										value="#{specificationBackingBean.managedBean.scQtSpec.contractDuration}" /></td>
								<td><h:outputLabel
										value="(#{lbl['lbl.sc.spec.contrat.month']})" /></td>
							</tr>
						</table>

					</h:panelGroup></td>
			</tr>



		</table>

	</p:panel>
