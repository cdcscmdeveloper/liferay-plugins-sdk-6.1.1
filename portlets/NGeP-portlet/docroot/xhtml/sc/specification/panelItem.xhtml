<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog 
		widgetVar="panelItem" modal="true" width="500" height="500">

		



		

		<p:panel header="#{lbl['lbl.sc.spec.panel.item.list']}"
			toggleable="true" collapsed="true">

			<h:panelGrid id="panel" style="width:450px;">
				<p:dataTable id="panelItemSupplierList" var="panelItem" rowIndexVar="index"
					value="#{specificationBackingBean.managedBean.panelItemList}"
					selection="#{specificationBackingBean.managedBean.selectpanelItem}"
					rowKey="#{panelItem}">

					<ac:paginator for="panelItemSupplierList"></ac:paginator>
					<p:column selectionMode="multiple" style="width:2%" />
					<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
						style="width:400px;">
						<h:outputText value="#{panelItem.itemName}" />
					</p:column>



				</p:dataTable>
			</h:panelGrid>

		</p:panel>

		<div align="right">


			<p:commandButton value="#{lbl['lbl.sc.spec.btn.populate']}"
				process="@this" update="panelDataItemList"
				partialSubmit="true" oncomplete="panelItem.hide();"
				actionListener="#{specificationBackingBean.panelPopulate}" />

		</div>

	</p:dialog>
</ui:composition>
