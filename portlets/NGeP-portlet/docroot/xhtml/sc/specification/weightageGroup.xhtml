<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.tech.score.setting']}"
		toggleable="true">



		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.tech.weightage']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio required="true"
						label="#{lbl['lbl.sc.spec.tech.weightage']}" id="techWeightage"
						value="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq}">
						<f:selectItems
							value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" update="technicalWeigtage,addpoints"></p:ajax>
					</p:selectOneRadio> <p:message id="techScoring" for="techWeightage" display="icon"></p:message></td>
			</tr>

		</table>

		<p:dataTable id="technicalWeigtage" var="tech"
			value="#{specificationBackingBean.managedBean.technicalScoring}"
			rowKey="#{tech}" editable="true" style="width:100%"
			rowIndexVar="index">
			<ac:paginator for="technicalWeigtage" />
			<!-- <p:column selectionMode="multiple" style="text-align:center;" /> -->

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:50%;white-space: normal;">
				<h:outputText value="#{tech.title}" size="50" />
			</p:column>

			<p:column style="width:20%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.stage2.score']}" />
				</f:facet>
				<h:outputText value="#{tech.qtScoreWeightage.score}"
					rendered="#{tech.qtScoreWeightage.score!='0'}" />
				<p:inputText value="#{tech.qtScoreWeightage.score}"
					id="techScoreWeight" required="true" maxlength="18"
					label="#{lbl['lbl.sc.spec.stage2.score']}" style="text-align:right"
					rendered="#{tech.qtScoreWeightage.score=='0'}">
					<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techScoreSum}" update=":form:addpoints" />
				</p:inputText>
				<p:message id="techScoreId" for="techScoreWeight" display="icon"></p:message>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.weight.weight']}"
				style="width:20%;">
				<p:inputText value="#{tech.qtScoreWeightage.weightage}"
					maxlength="5" style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">

					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techWeightageSum}"
						update=":form:addpoints" />
				</p:inputText>
			</p:column>


		</p:dataTable>

		<p:spacer height="15"></p:spacer>



		<h:panelGroup id="addpoints">
			<table>
				<tr>
					<td style="width: 149px;"><h:outputText
							value="#{lbl['lbl.sc.spec.net.total.points']} " /></td>

					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{specificationBackingBean.managedBean.techPoints}"></p:inputText></td>
				</tr>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">

					<tr>
						<td><h:outputText
								value="#{lbl['lbl.sc.spec.total.weightage']}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								style="text-align:right"
								value="#{specificationBackingBean.managedBean.technicalWeightageScore}"></p:inputText></td>
					</tr>

				</ui:fragment>


			</table>

		</h:panelGroup>
	</p:panel>
	<p:panel header="Passing Score" toggleable="true">

		<table>
			<tr>
				<td><h:outputText
						value=" #{lbl['lbl.sc.spec.qual.present.demo']}" /></td>
				<td><p:inputText style="text-align:right" maxlength="5"
						value="#{specificationBackingBean.managedBean.demoScoreSetting.passingScore}">

					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText value="/100 " /></td>
			</tr>




			<tr>
				<td><h:outputText
						value="#{lbl['lbl.sc.spec.recommendation.technical']}" /></td>
				<td><p:inputText style="text-align:right" maxlength="5"
						value="#{specificationBackingBean.managedBean.technicalScoreSetting.passingScore}">

					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText value="/100 " /></td>
			</tr>
		</table>





	</p:panel>

</ui:composition>
