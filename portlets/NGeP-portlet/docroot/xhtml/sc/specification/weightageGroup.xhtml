	<p:panel header="#{lbl['lbl.sc.spec.tech.score.setting']}" toggleable="true">



		<h:panelGrid columns="4">


			<h:outputText value="#{lbl['lbl.sc.spec.tech.weightage']}" />
			<p:spacer width="10"></p:spacer>
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq}">
				<f:selectItem itemLabel="Yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
				<p:ajax event="change" update="technicalWeigtage"></p:ajax>
			</p:selectOneRadio>
			
		</h:panelGrid>

		<p:dataTable id="technicalWeigtage" var="tech"
			value="#{specificationBackingBean.managedBean.technicalScoring}"
			rowKey="#{tech}" editable="true" style="width:100%"
			rowIndexVar="index">
			<ac:paginator for="technicalWeigtage" />
			<!-- <p:column selectionMode="multiple" style="text-align:center;" /> -->

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:50%;">
				<h:outputText value="#{tech.title}" size="50" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.score']}"
				style="width:20%;">
				<h:outputText value="#{tech.qtScoreWeightage.score}"
					rendered="#{tech.qtScoreWeightage.score!='0'}" />
				<p:inputText value="#{tech.qtScoreWeightage.score}"
					style="text-align:right"
					rendered="#{tech.qtScoreWeightage.score=='0'}">
					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techScoreSum}"
						update=":form:businessSpecId:addpoints" />
				</p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.weight.weight']}"
				style="width:20%;">
				<p:inputText value="#{tech.qtScoreWeightage.weightage}"
					style="text-align:right"
					rendered="#{specificationBackingBean.managedBean.technicalScoreSetting.weightageReq ne 'false'}">
					<p:ajax event="blur" process="@this"
						listener="#{specificationBackingBean.techWeightageSum}"
						update=":form:businessSpecId:addpoints" />
				</p:inputText>
			</p:column>


		</p:dataTable>

		<p:spacer height="15"></p:spacer>


	</p:panel>
	<p:panel>
		<h:panelGroup id="addpoints">
			<table>
				<tr>
					<td style="width:149px;"><h:outputText
							value="#{lbl['lbl.sc.spec.net.total.points']} " /></td>

					<td><p:inputText readonly="true" disabled="true" style="text-align:right"
							value="#{specificationBackingBean.managedBean.techPoints}"></p:inputText></td>
				</tr>


				<tr>
					<td><h:outputText
							value="#{lbl['lbl.sc.spec.total.weightage']}" /></td>
					<td><p:inputText readonly="true" disabled="true" style="text-align:right"
							value="#{specificationBackingBean.managedBean.technicalWeightageScore}"></p:inputText></td>
				</tr>




			</table>

		</h:panelGroup>
	</p:panel>
	<p:panel header="Passing Score">

		<table>
			<tr>
				<td><h:outputText value=" #{lbl['lbl.sc.spec.qual.present.demo']}" /></td>
				<td><p:inputText style="text-align:right"
						value="#{specificationBackingBean.managedBean.demoScoreSetting.passingScore}"></p:inputText>
					<p:spacer width="5"></p:spacer> <h:outputText value="/100 " /></td>
			</tr>




			<tr>
				<td><h:outputText value="#{lbl['lbl.sc.spec.recommendation.technical']}" /></td>
				<td><p:inputText style="text-align:right"
						value="#{specificationBackingBean.managedBean.technicalScoreSetting.passingScore}"></p:inputText>
					<p:spacer width="5"></p:spacer> <h:outputText value="/100 " /></td>
			</tr>
		</table>





	</p:panel>

</ui:composition>
