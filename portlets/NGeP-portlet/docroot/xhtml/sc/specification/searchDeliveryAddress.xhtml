<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.spec.search.delivery.address']}"
		position="top" widgetVar="deliveryAddress" modal="true" width="800"
		height="500">
		<p:messages id="committeeDeliveryAddress" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false" />
		<p:panel id="searDelivery" header="Search " toggleable="true">
			<table>

				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.search.delivery.address.ministry']}" />
					</td>
					<td colspan="3"><p:selectOneMenu id="committeeMinistryId"
							style="width:500px;margin-bottom:5px;"
							value="#{specificationBackingBean.managedBean.ministryId}">
							<f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
							<f:selectItems
								value="#{specificationBackingBean.managedBean.ministryList}"
								var="orgProfile" itemLabel="#{orgProfile.orgName}"
								itemValue="#{orgProfile.orgProfileId}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="departMent"
								listener="#{specificationBackingBean.dePartMentByMinistry}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.search.delivery.address.jabatan']}" /></td>
					<td colspan="3"><p:selectOneMenu id="departMent"
							style="width:500px;margin-bottom:5px;"
							value="#{specificationBackingBean.managedBean.departmentId}">
							<f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
							<f:selectItems
								value="#{specificationBackingBean.managedBean.departmentList}"
								var="orgProfile" itemLabel="#{orgProfile.orgName}"
								itemValue="#{orgProfile.orgProfileId}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="ptj"
								listener="#{specificationBackingBean.ptjByDepartMent}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.delivery.ptj']}" /></td>
					<td colspan="3"><p:selectOneMenu id="ptj"
							style="width:500px;margin-bottom:5px;"
							value="#{specificationBackingBean.managedBean.ptjId}">
							<f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
							<f:selectItems
								value="#{specificationBackingBean.managedBean.ptjtList}"
								var="orgProfile" itemLabel="#{orgProfile.orgName}"
								itemValue="#{orgProfile.orgProfileId}"></f:selectItems>

						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.search.delivery.address.state']}" /></td>
					<td><p:selectOneMenu style="width:200px;margin-bottom:5px;"
							value="#{specificationBackingBean.managedBean.stateId}">
							<f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
							<f:selectItems
								value="#{specificationBackingBean.managedBean.stateList}"
								var="state" itemLabel="#{state.stateName}"
								itemValue="#{state.stateId}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="districtId"
								listener="#{specificationBackingBean.districtBystate}"></p:ajax>
						</p:selectOneMenu></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.search.delivery.address.district']}" /></td>
					<td><p:selectOneMenu id="districtId" style="width:200px;"
							value="#{specificationBackingBean.managedBean.districtId}">
							<f:selectItem itemLabel="--Select One--" itemValue="#{null}"></f:selectItem>
							<f:selectItems
								value="#{specificationBackingBean.managedBean.districtList}"
								var="district" itemLabel="#{district.districtName}"
								itemValue="#{district.districtId}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{specificationBackingBean.districtCode}"></p:ajax>
						</p:selectOneMenu></td>
				</tr>

			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.tpl.btn.search']}"
					action="#{specificationBackingBean.searchDeliveryAddress}"
					update="deliveryAddress" icon="ui-icon-search" />
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.reset']}"
					icon="ui-icon-reset" resetValues="true" partialSubmit="true"
					process="@this" update="searDelivery"
					action="#{specificationBackingBean.deliveryAddressReset}" />
			</div>
		</p:panel>
		<p:panel header="PTJ Delivery Address List">

			<p:dataTable id="deliveryAddress" var="deliveryLoc" rows="10"
				rowKey="#{deliveryLoc}" rowIndexVar="index"
				value="#{specificationBackingBean.searchDeliveryAddress}"
				selection="#{specificationBackingBean.managedBean.deliveryAddressSelect}"
				lazy="true">

				<ac:paginator for="deliveryAddress"></ac:paginator>
				<p:column selectionMode="multiple"
					style="width:2%;text-align:center;" />
				<p:column headerText="Delivery/Service Address">
					<h:outputText value="#{deliveryLoc.pmAddress.address1}" size="50"></h:outputText>,<h:outputText
						value="#{deliveryLoc.pmAddress.address2}" size="50"></h:outputText>,<h:outputText
						value="#{deliveryLoc.pmAddress.address3}" size="50"></h:outputText>,<h:outputText
						value="#{deliveryLoc.pmAddress.address4}" size="50"></h:outputText>
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
			style="float:right;" onclick="deliveryAddress.hide();"
			icon="ui-icon-cancel"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			onclick="deliveryAddress.hide();" icon="ui-icon-accept"
			update="@(.deliveryUpdate)"
			oncomplete="deliveryService.paginator.endLink.click();"
			actionListener="#{specificationBackingBean.deliveryAccept}"></p:commandButton>

		<p:ajax event="close"
			listener="#{specificationBackingBean.closeListener}" />
	</p:dialog>
</ui:composition>
