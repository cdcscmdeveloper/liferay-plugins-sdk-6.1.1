<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		
				<ui:param name="categoryPnlGroupId" value="restrictedGroupId" />
				<h:panelGroup id="restrictedGroupId">
					<ui:param name="criteriaList"
						value="#{specificationBackingBean.managedBean.suppCriteriarestrictedList}" />
						<ui:param name="criteriaselectList"
						value="#{specificationBackingBean.managedBean.suppCriteriarestrictedList}" />
					<ui:param name="componentName" value="restrictedCategory" />
					<ui:param name="criteriaPnlId" value="restrictedCriteriaListId" />

					<td><ui:include src="/xhtml/sc/specification/categoryCodeList.xhtml" /></td>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}"
							process="@this,#{criteriaPnlId}" partialSubmit="true"
							update="#{criteriaPnlId}" icon="ui-icon-add" />
						<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
							icon="ui-icon-delete"
							
							update="#{criteriaPnlId}" />

					</div>
					</h:panelGroup>
		
	</p:panel>
</ui:composition>
