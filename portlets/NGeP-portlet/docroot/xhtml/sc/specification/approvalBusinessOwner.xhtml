<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Approver Setting" toggleable="true">
		<table>
			<tr>
				<td><h:outputLabel value="Ministry Specification Secretary"/></td>
				<td><p:inputText /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Remark" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="Remark" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText />, <h:outputText id="remarkDate">
										<f:convertDateTime />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="History" toggleable="true">
		<p:dataTable>
			<p:column headerText="Approved By">
			</p:column>
			<p:column headerText="Status">
			</p:column>
			<p:column headerText="Date">
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
