<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">




	<h:panelGroup id="suppQualSpec">
		<c:if
			test="#{specificationBackingBean.managedBean.scQt.qtType == PmCodeConst.quotationTenderTypeOpen and  specificationBackingBean.managedBean.scQt.panel == 'No'}">
			<ui:include src="/xhtml/sc/specification/BusinessOwner/SupplierQualificationCriteria/NonPanel/supplierCriteriaOpen.xhtml" />
		</c:if>

		<c:if
			test="#{specificationBackingBean.managedBean.scQt.qtType == PmCodeConst.quotationTenderTypeRestrictedTender and specificationBackingBean.managedBean.scQt.panel == 'No' }">
			<ui:include
				src="/xhtml/sc/specification/BusinessOwner/SupplierQualificationCriteria/RestrictedTender/supplierRestrictedtender.xhtml" />
		</c:if>
		<c:if
			test="#{ specificationBackingBean.managedBean.scQt.panel ne'No'}">
			<ui:include src="/xhtml/sc/specification/BusinessOwner/SupplierQualificationCriteria/Panel/supplierCriteriaPanel.xhtml" />
		</c:if>


	</h:panelGroup>

</ui:composition>
