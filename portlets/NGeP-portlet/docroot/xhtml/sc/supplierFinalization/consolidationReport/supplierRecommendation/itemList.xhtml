<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.select.disagree.proposal.validity.period.extension.item']} " escape="false" />
		<ui:remove> #28777#29729 - Start </ui:remove>
		<c:if
			test="#{consolidationReportBackingBean.checkInstructionSupplierBranchDeleted(consolidationReportBackingBean.managedBean.scQt.qtId)}">
			<h:outputText styleClass="instruction" escape="false"
				value="#{lbl['lbl.sc.branch.related.deleted.instruction.four']}" />
		</c:if>
		<ui:remove> #28777#29729 - End </ui:remove>
		<ui:remove>#21692 - start</ui:remove>
		<c:forEach var="instruc" items="#{consolidationReportBackingBean.qualifiedSupplierInstructionList(consolidationReportBackingBean.managedBean.scQt.qtId)}">
			<h:outputText styleClass="instruction" escape="false" value="#{instruc}" />
		</c:forEach>
		<ui:remove>#21692 - end</ui:remove>
		<p:dataTable id="itemListTbl" var="item"
			value="#{consolidationReportBackingBean.managedBean.itemsList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" rowKey="#{item.qtRecommendId}" rowIndexVar="rowIndex" selectionMode="single">
			<ac:paginator for="itemListTbl" />

			<p:ajax event="rowSelect" listener="#{consolidationReportBackingBean.selectItemEvent}"
				update="@([id$=itemSupplierPanel])" 
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"></p:ajax>
				
			<p:column headerText="#{lbl['lbl.sc.item']}" style="width:20%; white-space:normal;">
				<h:outputText value="#{item.requestItem.itemName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.item.type']}" style="width:5%;">
				<h:outputText value="#{consolidationReportBackingBean.getParameterDesc(item.requestItem.itemType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.uom']}" style="width:5%;">
				<h:outputText value="#{item.requestItem.uom.uomName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.price.type']}" style="width:5%;">
				<h:outputText value="#{consolidationReportBackingBean.getParameterDesc(
											item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
			</p:column>
		</p:dataTable>
		
	</p:panel>
	
</ui:composition>
