<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.report.section']}" toggleable="true">
		
		<p:dataTable id="reportTbl" value="#{consolidationReportBackingBean.managedBean.finalizationReports}" 
			widgetVar="reportWidget" var="report" rows="10" rowKey="#{report}" 
			rowIndexVar="rowIndex" styleClass="documentslist"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{consolidationReportBackingBean.managedBean.selectedFinalizationReports}">
						
			<ac:paginator for="reportTbl" />
			
			<p:column selectionMode="multiple" style="width:2%" 
					  disabledSelection="#{!empty report.pmDocument or 
					  	report.docCategory eq ParameterConst.documentCategoryEndorsementReport}" />

			<p:column headerText="#{lbl['lbl.sc.content']}" style="width:68%; white-space:normal;">
				<h:inputText style="width:96%" value="#{report.title}" 
					rendered="#{empty report.pmDocument and 
								report.docCategory ne ParameterConst.documentCategoryEndorsementReport}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</h:inputText>
				<h:outputText value="#{report.title}" rendered="#{!empty report.pmDocument or 
								report.docCategory eq ParameterConst.documentCategoryEndorsementReport}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.action']}" style="width:30%; white-space:normal; text-align:center;">
				<ac:scSingleFileUploadButton id="briefingReportUploadBtn"
					popupWidgetVar="briefingReportAttWidget"
					attachment="#{report.scQtFinalizationReportAttachment}" 
					readonly="#{!empty report.pmDocument or 
					  				report.docCategory eq ParameterConst.documentCategoryEndorsementReport}" 
					rowIndex="#{rowIndex}">

					<f:setPropertyActionListener for="actionEvent" value="#{report}"
						target="#{consolidationReportBackingBean.managedBean.selectedFinalizationReport}" />

					<f:setPropertyActionListener for="actionEvent" value="KTR"
						target="#{consolidationReportBackingBean.managedBean.attachmentDocType}" />
				</ac:scSingleFileUploadButton>
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"	
				action="#{consolidationReportBackingBean.downloadAllReports}" />
				
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, reportTbl" partialSubmit="true"
				action="#{consolidationReportBackingBean.addFinalizationReportAction}"
				oncomplete="reportWidget.paginator.endLink.click();" 
				update="@([id$=reportTbl])"/>

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, reportTbl" partialSubmit="true"
				oncomplete="deleteReportPopup.show();"
				update="@([id$=#{deleteReportPopupId}])" />				
		</div>
		
		<ac:confirmationPopup id="deleteReportPopupId" title="#{lbl['lbl.msg.confirm.delete.header']}"
			width="400" height="100" widget="deleteReportPopup" 
			okAction="consolidationReportBackingBean.deleteFinalizationReportAction" 
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
					
	</p:panel>
	
</ui:composition>
