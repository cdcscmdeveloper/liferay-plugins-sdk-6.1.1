<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <!-- <ui:param name="scQt" value="#{sfBackingBean.managedBean.scQt}" />
    <ui:include src="/xhtml/sc/common/commonHeader.xhtml" /> -->
	<p:panel header="Meeting Details" toggleable="true">
	
			<p:dataTable id="meetingDtlId" var="meetingDtl"
				value="#{sfBackingBean.managedBean.meetingDetails}"
				rows="10"
				rowKey="#{meetingDtl}" rowIndexVar="rowIndex" >
				<ac:paginator for="meetingDtlId" />
			
				<p:column headerText="#{lbl['lbl.sc.sf.meeting.date']}" style="width:120px;">
				  <p:calendar
					value="#{meetingDtl.meetingDate}" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
					id="notdate" showOn="button"  />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.location']}"  style="width:100px;">
					<p:inputText value="#{meetingDtl.meetingLocation}"  size="70"/>
				</p:column>

			</p:dataTable>

		    <p:spacer height="10px"></p:spacer>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.sf.add']}"
				 process="@this,meetingDtlId" partialSubmit="true"
					action="#{sfBackingBean.addMeetingDetails}"
					update="meetingDtlId" icon="ui-icon-add"/>
				<p:commandButton value="#{lbl['lbl.sc.sf.delete']}"  icon="ui-icon-delete"/>
			</div>
			
	   </p:panel>

	  <p:panel header="Committe Member List" >
		<p:dataTable id="comMemberDtlId" var="comMemberDtl"
				value="#{sfBackingBean.managedBean.committeeMemberList}"
				rows="10"
				rowKey="#{comMemberDtl}" rowIndexVar="rowIndex">
				<ac:paginator for="comMemberDtlId" />

			<p:column headerText="#{lbl['lbl.sc.sf.name']}" style="width:100px;">
				<h:outputText value="#{comMemberDtl.scCommitteeMember.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sf.member.type']}" style="width:120px;">
				<h:outputText value="#{comMemberDtl.scCommitteeMember.memberType}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sf.role']}" style="width:120px;">
				<h:outputText value="#{comMemberDtl.scCommitteeMember.memberRole}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sf.attendance']}" style="width:120px;">
				<p:selectBooleanCheckbox value="#{comMemberDtl.attended}" />
			</p:column>

		</p:dataTable>

	</p:panel>
	
	<h:panelGroup>		
   </h:panelGroup>
</ui:composition>
