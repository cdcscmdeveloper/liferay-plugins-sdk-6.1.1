<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog header="#{lbl['lbl.sc.eva.reminder']}"
		widgetVar="reminder" position="top" width="600" height="400">
		<p:panel>
			<p:dataTable id="committeeReminder" var="reminderpopup" editable="true">
				<ac:paginator for="committeeReminder" />
				
				<p:column headerText="#{lbl['lbl.sc.name']}" style="width:100%">
					<h:outputText value="readOnly"></h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.reminder']}" toggleable="true">
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.subject']}" />
				<p:inputText size="50"></p:inputText>
				
				<h:outputLabel value="#{lbl['lbl.sc.message']}" />
				<p:inputTextarea rows="5" cols="50"></p:inputTextarea>
			</h:panelGrid>
		</p:panel>

		<div align="right">
			<p:commandButton 
				value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" 
				onclick="reminder.hide();"
				icon="ui-icon-cancel"/>
			<p:commandButton 
				value="#{lbl['lbl.btn.send']}"
				style="float:right;" 
				onclick="reminder.hide();"
				icon="ui-icon-mail"/>
		</div>
	</p:dialog>
	
</ui:composition>
