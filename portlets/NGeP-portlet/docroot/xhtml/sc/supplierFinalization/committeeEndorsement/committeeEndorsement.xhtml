<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.committee.endorsement']}" toggleable="true">
		
		<p:dataTable id="committeeEndorsement" var="endorsement"
			value="#{suppFinalizationBackingBean.managedBean.committeeEndorsementList}"
			rowKey="#{endorsement}" rowIndexVar="index" rows="10">
			<ac:paginator for="committeeEndorsement" />

			<p:column headerText="#{lbl['lbl.sc.name']}" style="width:20%">
				<h:outputText value="#{endorsement.scCommitteeMember.memberName}"></h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.id.no']}" style="width:20%">
				<h:outputText value="#{endorsement.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.role']}" style="width:20%">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(endorsement.scCommitteeMember.memberRole)}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.representative.type']}" style="width:20%">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(endorsement.scCommitteeMember.memberType)}"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:20%">
				<h:outputText value="#{lbl['lbl.sc.pending']}" rendered="#{!endorsement.signedOff}"></h:outputText>
				<h:outputText value="#{lbl['lbl.sc.endorse']}" rendered="#{endorsement.signedOff}"></h:outputText>
			</p:column>
		</p:dataTable>
		
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton 
				value="#{lbl['lbl.btn.send.reminder']}"
				action="#{suppFinalizationBackingBean.showReminder}"
				update=":form:reminderPopup"
				oncomplete="reminder.show();"
				icon="ui-icon-mail" />
		</div>
	</p:panel>
	
</ui:composition>
