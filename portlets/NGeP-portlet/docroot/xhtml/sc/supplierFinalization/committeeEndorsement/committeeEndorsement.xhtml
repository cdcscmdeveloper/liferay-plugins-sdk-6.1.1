<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.finalization.endorsement.status']}" toggleable="true">
		<p:dataTable id="committeeEndorsement" var="endorsement"
			value="#{suppFinalizationBackingBean.managedBean.committeeEndorsementList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{endorsement}" rowIndexVar="index" rows="10">
			<ui:param name="endorseStatus" value="#{suppFinalizationBackingBean.getEndorsementType(endorsement)}"></ui:param>
			<ac:paginator for="committeeEndorsement" />

			<p:column headerText="#{lbl['lbl.sc.name']}" style="width:20%">
				<h:outputText value="#{endorsement.scCommitteeMember.memberName}"></h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.identification.no']}" style="width:20%">
				<h:outputText value="#{endorsement.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.role']}" style="width:20%">
				<h:outputText value="#{suppFinalizationBackingBean.getFCMemberRole(
											endorsement.scCommitteeMember.memberRole)}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.representative.type']}" style="width:20%">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(
											endorsement.scCommitteeMember.representativeType)}"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:20%">
				<h:outputText value="#{lbl['lbl.sc.pending']}" 
							  rendered="#{!endorseStatus or isSupplierFinalization}" />
				<h:outputText value="#{lbl['lbl.btn.complete']}" 
							  rendered="#{endorseStatus and !isSupplierFinalization}" />
			</p:column>
		</p:dataTable>
		
	</p:panel>
	
</ui:composition>
