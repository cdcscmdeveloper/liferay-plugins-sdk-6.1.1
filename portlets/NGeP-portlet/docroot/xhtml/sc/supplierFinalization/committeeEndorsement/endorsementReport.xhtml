<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:remoteCommand name="updateEndorsementReport" partialSubmit="true" process="@form" 
					 update="@form" action="#{suppFinalizationBackingBean.navigateToEndorsementReportTab}" />
					 
	<ac:scRemarkAndAttachment remarkList="#{suppFinalizationBackingBean.managedBean.finalizationEndorsementRemarks}"
							  showAttachment="false" readonly="#{!suppFinalizationBackingBean.managedBean.secretaryUser}"
							  numberOfCols="80"/>	
							
	<ac:scRemarkAndAttachment remarkList="#{suppFinalizationBackingBean.managedBean.finalizationPengreysonremarks}"
							  showAttachment="false" header="#{lbl['lbl.sc.recommendation']}" readonly="#{!suppFinalizationBackingBean.managedBean.secretaryUser}"
							  numberOfCols="80"/>							  
							  			

	<p:commandButton value="#{lbl['lbl.sc.btn.update.recommendation']}" update="@([id$=endorsementReportContentId])" 
					 style="margin-left: 12%;" rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}" />							  
	<br/>
	<br/>
	
	<p:outputPanel id="endorsementReportContentId">
		<p:media value="#{suppFinalizationBackingBean.getSuppFinalizationEndorsementReportStreamContent()}"
				 width="100%" height="500px" player="pdf" styleClass="header-spacing">
		</p:media>
	</p:outputPanel>
</ui:composition>
