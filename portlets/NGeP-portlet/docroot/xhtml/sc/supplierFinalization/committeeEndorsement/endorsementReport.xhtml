<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="finalization"
		value="#{suppFinalizationBackingBean.managedBean.scQtFinalization}" />
	<ui:param name="readOnly"
		value="#{!suppFinalizationBackingBean.managedBean.secretaryUser or suppFinalizationBackingBean.managedBean.readOnly}" />

	<p:remoteCommand name="updateEndorsementReport" partialSubmit="true"
		process="@form" update="@form"
		action="#{suppFinalizationBackingBean.navigateToEndorsementReportTab}" />
	<p:panel>

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.endorsement.report.remarks.instructions']}"
			escape="false" />

		<p:panel id="panelConditionsId"
			header="#{lbl['lbl.sc.sf.conditions']}" toggleable="true">

			<table style="width: 100%;">
				<tr>
					<td style="float: left; width: 12%;"><p:outputLabel
							value="#{lbl['lbl.sc.sf.with.conditions']}" /></td>
					<td style="float: left;">
						<table>
							<tr>
								<td><p:selectOneRadio id="withConditionsId" required="true"
										label="#{lbl['lbl.sc.sf.with.conditions']}"
										value="#{finalization.withTerms}" disabled="#{readOnly}">
										<f:selectItems
											value="#{suppFinalizationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
										<p:ajax event="change" process="@this" partialSubmit="true"
											update="panelWithConditionsTxtId"
											listener="#{suppFinalizationBackingBean.setWithTermValue}"></p:ajax>
									</p:selectOneRadio> <p:message id="withConditionsMsgId" for="withConditionsId"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
			<h:panelGroup id="panelWithConditionsTxtId">
				<ui:fragment rendered="#{finalization.withTerms}">
					<table style="width: 100%;">
						<tr>
							<td style="float: left; margin-left: 55px;"><p:outputLabel
									value="#{lbl['lbl.sc.sf.with.conditions.as.below']}:"
									style="margin-bottom:5px;" /></td>
							<td></td>
						</tr>
						<tr>
							<td>
								<table>
									<tr>
										<td style="float: right; margin-left: 55px;"><p:inputTextarea
												id="withConditionTxtId" value="#{finalization.termsText}"
												cols="80" rows="3" onkeydown="limitTextArea(this,1000);" onmouseout="limitTextArea(this,1000);"
												required="#{!readOnly}" disabled="#{readOnly}"
												label="#{lbl['lbl.sc.sf.with.conditions.as.below']}" /> <p:message
												id="withConditionTxtMsgId" for="withConditionTxtId"
												display="icon" /></td>
									</tr>
								</table>
							</td>
							<td></td>
						</tr>
					</table>
				</ui:fragment>
			</h:panelGroup>
		</p:panel>

		<ac:scRemarkAndAttachment
			remarkList="#{suppFinalizationBackingBean.managedBean.finalizationPengreysonremarks}"
			showAttachment="false" header="#{lbl['lbl.sc.recommendation']}"
			readonly="#{readOnly}" numberOfCols="80" />


 <!--  #29705 remove --> 
		<p:panel id="panelJustificationId"
			header="#{lbl['lbl.sc.sf.justification']}" toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td style="width: 20%; margin-left: 55px;"><p:outputLabel
							value="#{lbl['lbl.sc.sf.justification.selection']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>

					<td style="margin-left: 55px;"><p:selectOneMenu
							id="justificationDDId"
							value="#{suppFinalizationBackingBean.managedBean.justification.reasonCode}"
							style="width: 300px;margin-bottom: 5px;"
							label="#{lbl['lbl.sc.sf.justification.selection']}"
							disabled="#{readOnly}">
							<f:selectItems
								value="#{suppFinalizationBackingBean.managedBean.justDropdown}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="panelWithJustificationTxtId"
								listener="#{suppFinalizationBackingBean.justificationChange}"
								disabled="#{readOnly}" />
						</p:selectOneMenu> <p:message id="justificationDDMsgId" for="justificationDDId"
							display="icon" /></td>
				</tr>
			</table>
			<h:panelGroup id="panelWithJustificationTxtId">
				<c:if
					test="#{suppFinalizationBackingBean.managedBean.renderjustificationTextbox}">
					<table>
						<tr>
							<td style="float: right; margin-left: 55px;"><p:inputTextarea
									id="justificationTxtId" required="#{!readOnly}"
									value="#{finalization.justificationText}" cols="80" rows="3"
									onkeydown="limitTextArea(this,1000);" onmouseout="limitTextArea(this,1000);"
									disabled="#{readOnly}"
									label="#{lbl['lbl.sc.sf.justification']}" /> <p:message
									id="justificationTxtMsgId" for="justificationTxtId"
									display="icon" /></td>
							<td></td>
						</tr>
					</table>
				</c:if>
			</h:panelGroup>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.committee.endorsement.report']}"
			toggleable="true" rendered="#{!readOnly}">

			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td class="TableFieldLeft" width="24%"><h:outputLabel
							value="#{lbl['lbl.txt.attachment']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td class="TableFieldRight"><ac:scSingleFileUploadButton
							id="endorseReportUploadBtnId"
							popupWidgetVar="endorseReportAttWidget"
							update="@([id$=endorseReportUploadBtnId],[id$=endorseReportTbl])"
							attachment="#{suppFinalizationBackingBean.managedBean.endorsementReport.scQtFinalizationReportAttachment}"
							readonly="#{readOnly}" /></td>
				</tr>
			</table>
		</p:panel>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.sf.up.edorse.rpt']}" toggleable="true">

		<p:dataTable id="endorseReportTbl" widgetVar="reportWidget"
			var="report"
			value="#{suppFinalizationBackingBean.managedBean.endorsementReports}"
			rows="10" styleClass="documentslist"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{report}" rowIndexVar="rowIndex">

			<ac:paginator for="endorseReportTbl" />

			<p:column headerText="#{lbl['lbl.sc.content']}" style="width:70%;">
				<h:outputText value="#{report.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.type']}"
				style="width:15%; white-space:normal;">
				<h:outputText
					value="#{suppFinalizationBackingBean.getParameterDesc(report.definationType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:15%; white-space:normal; text-align: center;">
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false" immediate="true"
					action="#{suppFinalizationBackingBean.downloadEndorseReport(report)}"
					rendered="#{report.scQtFinalizationReportAttachment ne null}" />

			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
