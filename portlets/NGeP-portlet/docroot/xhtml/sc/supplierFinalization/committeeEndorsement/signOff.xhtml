<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="signOffPopUp" header="#{lbl['lbl.sc.sign.off']}"
		widgetVar="chairPerson" width="600" height="250" position="top">

		<p:panel>
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.pin.no']}" />
				<p:inputText size="50" value="#{suppFinalizationBackingBean.managedBean.pinNo}"></p:inputText>
			</h:panelGrid>
		</p:panel>

		<div align="right">
			<p:commandButton 
				value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" 
				onclick="signOffPopUp.hide();" />

			<p:commandButton 
				value="#{lbl['lbl.btn.submit']}"
				style="float:right;" 
				action="#{suppFinalizationBackingBean.signOff}"
				oncomplete="signOffPopUp.hide();"/>
		</div>
	</p:dialog>

</ui:composition>
