<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!--  Supplier Details dialog -->
	<p:dialog id="popupSuppDtl" widgetVar="suppDetails" resizable="false"
		styleClass="pop_up_top" header="Supplier Details" width="750"
		height="350">
		<table style="width: 100%" border="1">
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.sf.supplier.code']}" /></td>
				<td><p:inputText size="30"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.supplierNo}"
						readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.supplier.name']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.reg.type']}" /></td>
				<td><p:inputText size="30" value="" readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.reg.no']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.regNo}"
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.mof.no']}" /></td>
				<td><p:inputText size="30"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].mofNo}"
						readonly="true" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.sf.income.tax.ref.no']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.incomeTaxNo}"
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.est.date']}" /></td>
				<td><p:inputText size="30"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.establishDate}"
						readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.type.of.company']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.businessType}"
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.mof.exp.date']}" /></td>
				<td><p:inputText size="30"
						value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].expDate}"
						readonly="true" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.sf.disciplinary.rating']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;" value=""
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.branch']}" /></td>
				<td><p:inputText size="30" value="" readonly="true" /></td>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.sf.address']}" /></td>
				<td><p:inputTextarea cols="30" value="-"
						style=" margin-bottom:5px;" readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.contact.person']}" /></td>
				<td><p:inputText size="30" value="" readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.designation']}" /></td>
				<td><p:inputText size="30" value="-" readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sf.email']}" /></td>
				<td><p:inputText size="30" value="" readonly="true" /></td>
				<td />
				<td />
			</tr>
		</table>

		<p:spacer height="20px" />
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="Cancel" icon="ui-icon-cancel"
						onclick="suppDetails.hide();" />
				</p:column>
			</p:row>
		</p:panelGrid>


	</p:dialog>

</ui:composition>
