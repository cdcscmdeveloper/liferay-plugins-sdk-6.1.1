<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="supplierFinalization" showDetail="true" showSummary="false" autoUpdate="true" closable="true" severity="error,info"/>
		
		<ac:gpkiPopup textBeforeSign="#{suppFinalizationBackingBean.textBeforeSign}"
		   postSignAction="#{suppFinalizationBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}" 
				process="@all"
				partialSubmit="true"
				update="@form"
				action="#{suppFinalizationBackingBean.saveSupplierFinalization}" 
				rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}"/>
					
			<ui:repeat var="bpmAction" value="#{suppFinalizationBackingBean.managedBean.outComes}">
				<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
								
				<p:commandButton value="#{lbl[buttonLabel]}"  
					styleClass="ui-button"
					action="#{suppFinalizationBackingBean.submitSuppFinalization(bpmAction)}"
					partialSubmit="true"
					process="@form"
					update="@form" />
			</ui:repeat>
		</div>	
		
		<ui:include src="/xhtml/sc/supplierFinalization/suppFinalizationHeader.xhtml"></ui:include>
		
		<p:tabMenu id="tab" activeIndex="#{suppFinalizationBackingBean.managedBean.activeIndex}" >
			<p:menuitem value="#{lbl['lbl.sc.preparation']}" actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(0)}" 
						process="@form" update="@form" partialSubmit="true" style="width:150px;">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.sc.briefing.paper']}" actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(1)}" 
						process="@form" update="@form" partialSubmit="true" style="width:150px;">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.sc.supplier.finalization']}" actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(2)}" 
						process="@form" update="@form" partialSubmit="true" style="width:150px;">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.sc.committee.endorsement']}" actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(3)}" 
						process="@form" update="@form" partialSubmit="true" style="width:150px;" >
			</p:menuitem>
		</p:tabMenu>

		<p:panel id="contentPanel">
			<c:if test="#{suppFinalizationBackingBean.managedBean.activeIndex eq '0'}">
				<ui:include src="/xhtml/sc/supplierFinalization/preparation/preparation.xhtml" />
			</c:if>
			<c:if test="#{suppFinalizationBackingBean.managedBean.activeIndex eq '1'}">
				<ui:include src="/xhtml/sc/supplierFinalization/briefingPaper/briefingPaperReport.xhtml" />
			</c:if>
			<c:if test="#{suppFinalizationBackingBean.managedBean.activeIndex eq '2'}">
				<ui:include src="/xhtml/sc/supplierFinalization/supplierFinalization/suppplierFinalization.xhtml" />
			</c:if>
			<c:if test="#{suppFinalizationBackingBean.managedBean.activeIndex eq '3'}">
				<ui:include src="/xhtml/sc/supplierFinalization/committeeEndorsement/committeeEndorsement.xhtml" />
			</c:if>
		</p:panel>
		
		<ui:include src="/xhtml/sc/supplierFinalization/supplierFinalization/supplierDetailsPopUp.xhtml" />
		<ui:include src="/xhtml/sc/supplierFinalization/committeeEndorsement/reminder.xhtml" />
		<ui:include src="/xhtml/sc/supplierFinalization/committeeEndorsement/signOff.xhtml" />
		
		<p:dialog id="attachmentPopup" widgetVar="attachmentPopupDlg" 
			modal="true" resizable="false" width="700px" height="200" styleClass="pop_up_top" 
			header="#{lbl['lbl.txt.choose.files']}">
			<p:ajax event="close" />
			
			<p:fileUpload style="display:inline;"
				fileUploadListener="#{suppFinalizationBackingBean.handleFileUpload}"
				mode="advanced" id="uploadattachment"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted" 
				update="contentPanel" oncomplete="attachmentPopupDlg.hide()">
			</p:fileUpload>
		</p:dialog>	
			
	</ui:define>
	
</ui:composition>
