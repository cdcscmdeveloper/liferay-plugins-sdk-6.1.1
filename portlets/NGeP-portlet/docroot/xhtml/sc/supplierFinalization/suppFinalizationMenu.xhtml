<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="#{CommonUIConstant.imagePath}/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<ui:param name="isQTStatusReFinalized"
			value="#{suppFinalizationBackingBean.managedBean.qtRefinalized}" />
		<ui:param name="isSupplierFinalization"
			value="#{suppFinalizationBackingBean.managedBean.currentStatusId 
															== QTStatusConst.SF_PENDING_SUPPLIER_FINALIZATION}" />
		<ui:param name="validityDaysExpiredQt"
			value="#{suppFinalizationBackingBean.checkProposalValidityDateReach(
		     				suppFinalizationBackingBean.managedBean.scQt.proposalValidityEndDate)}" />

		<p:messages id="supplierFinalization" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />

		<ac:gpkiPopup
			textBeforeSign="#{suppFinalizationBackingBean.textBeforeSign}"
			postSignAction="#{suppFinalizationBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<div align="right" class="BtnSpacing">
			<ui:decorate
				template="/WEB-INF/facelets/templates/claim_template.xhtml">
				<ui:define name="outComeSection">
					<p:commandButton value="#{lbl['lbl.btn.save']}" process="@all"
						partialSubmit="true" update="@form"
						action="#{suppFinalizationBackingBean.saveSupplierFinalization}"
						rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser or 
								suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />

					<ui:repeat var="bpmAction"
						value="#{suppFinalizationBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

						<p:commandButton value="#{lbl[buttonLabel]}"
							styleClass="ui-button"
							action="#{suppFinalizationBackingBean.submitSuppFinalization(bpmAction)}"
							partialSubmit="true" process="@form" update="@form"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							rendered="#{validityDaysExpiredQt}" />
					</ui:repeat>
				</ui:define>
			</ui:decorate>
		</div>

		<ui:include
			src="/xhtml/sc/supplierFinalization/suppFinalizationHeader.xhtml"></ui:include>

		<p:tabMenu id="tab"
			activeIndex="#{suppFinalizationBackingBean.managedBean.activeIndex}">
			<p:menuitem value="#{lbl['lbl.sc.preparation']}"
				actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(
									suppFinalizationBackingBean.managedBean.preparationTabIndex)}"
				process="@form" update="@form" partialSubmit="true" style="width:150px;"
				rendered="#{!suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK and 
								!suppFinalizationBackingBean.managedBean.readOnly}">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.sc.briefing.paper']}"
				actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(
									suppFinalizationBackingBean.managedBean.reportTabIndex)}"
				process="@form" update="@form" partialSubmit="true" style="width:150px;">
			</p:menuitem>
			<p:menuitem value="#{lbl['lbl.sc.supplier.finalization']}"
				actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(
									suppFinalizationBackingBean.managedBean.finalizationTabIndex)}"
				process="@form" update="@form" partialSubmit="true" style="width:225px;">
			</p:menuitem>
			<p:menuitem
				value="#{lbl['lbl.sc.committee.endorsement.finalization']}"
				actionListener="#{suppFinalizationBackingBean.onTabMenuChangeAction(
									suppFinalizationBackingBean.managedBean.commEndorsementTabIndex)}"
				process="@form" update="@form" partialSubmit="true" style="width:330px;"
				rendered="#{!suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK and
								!suppFinalizationBackingBean.managedBean.readOnly}">
			</p:menuitem>
		</p:tabMenu>

		<p:panel id="contentPanel">
			<c:if
				test="#{suppFinalizationBackingBean.managedBean.activeIndex eq 
							suppFinalizationBackingBean.managedBean.preparationTabIndex}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/preparation/preparation.xhtml" />
			</c:if>
			<c:if
				test="#{suppFinalizationBackingBean.managedBean.activeIndex eq 
							suppFinalizationBackingBean.managedBean.reportTabIndex}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/briefingPaper/briefingPaperReport.xhtml" />
			</c:if>
			<c:if
				test="#{suppFinalizationBackingBean.managedBean.activeIndex eq 
							suppFinalizationBackingBean.managedBean.finalizationTabIndex}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/supplierFinalization/suppplierFinalization.xhtml" />
			</c:if>
			<c:if
				test="#{suppFinalizationBackingBean.managedBean.activeIndex eq 
							suppFinalizationBackingBean.managedBean.commEndorsementTabIndex}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/committeeEndorsement/committeeEndorsement.xhtml" />
			</c:if>
		</p:panel>

		<ui:include
			src="/xhtml/sc/supplierFinalization/supplierFinalization/boardofDirectorsDetails.xhtml" />
		<ui:include
			src="/xhtml/sc/supplierFinalization/committeeEndorsement/signOff.xhtml" />

		<p:dialog id="attachmentPopup" widgetVar="attachmentPopupDlg"
			modal="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">

			<p:fileUpload style="display:inline;"
				fileUploadListener="#{suppFinalizationBackingBean.handleFileUpload}"
				mode="advanced" id="uploadattachment"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
				update="contentPanel" oncomplete="attachmentPopupDlg.hide()">
			</p:fileUpload>
		</p:dialog>

	</ui:define>

</ui:composition>
