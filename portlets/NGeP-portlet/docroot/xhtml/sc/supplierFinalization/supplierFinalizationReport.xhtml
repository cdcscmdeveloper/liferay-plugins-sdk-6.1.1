<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Report Contents" toggleable="true">
		<p:dataTable value="">
			<p:column headerText="#{lbl['lbl.sc.sf.contents']}">
				<h:outputText value="Cover" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sf.type']}" style="width : 25px">
				<h:outputText value="Body" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sf.action']}"
				style="width : 25px">
				<h:outputText value="Download" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:spacer height="10px" />
	<p:panel header="Final Report" toggleable="true" id="evaluationReport">
		<h:panelGrid columns="2">
			<p:outputLabel value="#{lbl['lbl.sc.eva.report.attachment']}"></p:outputLabel>
			<h:panelGroup>
				<p:commandButton value="#{lbl['lbl.sc.qt.upload']}"
					oncomplete="uploadDlg.show();return false;" partialSubmit="true"
					process="@this" icon="ui-icon-upload" update="evaluationReport" />
			</h:panelGroup>
		</h:panelGrid>
	</p:panel>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{sfBackingBean.handleFileUpload}"
			mode="advanced" id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="evaluationReport" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
