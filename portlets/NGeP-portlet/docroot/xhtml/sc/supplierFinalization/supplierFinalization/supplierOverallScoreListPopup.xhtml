<!-- #29729 Start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:remove>
		<!-- #38151 datatable value popup-->
		<!-- start -->
	</ui:remove>
	<p:dialog id="SuppDetailatestPopupId" widgetVar="SuppDetailatestPopup"
		position="center" modal="true" dynamic="true" styleClass="pop_up_top"
		width="950" resizable="false"
		header="#{lbl['lbl.sc.total.overall.score.percentage']}">

		<p:dataTable id="qualifiedSupplierlatest" var="qualifiedSupp"
			widgetVar="qualifiedSupplierDtls"
			value="#{suppFinalizationBackingBean.managedBean.weightageScoreBeans}"
			emptyMessage="#{lbl['lbl.sc.supplier.finalization.sorttable.msg.no.records.found']}"
			editable="true" lazy="true" rowIndexVar="index" rows="10"
			style="width:100%;" rowKey="#{qualifiedSupp}">
			<ac:paginator for="qualifiedSuppliers" />
			<p:columnGroup type="header">
				<p:row>
					<p:column colspan="2"
						headerText="#{lbl['lbl.sc.eval.score.popup']}" />
					<p:column colspan="2"
						headerText="#{lbl['lbl.sc.rec.weightage.overall.score.popup']}" />
					<p:column rowspan="2"
						headerText="#{lbl['lbl.sc.total.overall.score']}" />
				</p:row>
				<p:row>
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eval.tec.score.popup']}" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eval.fin.score.popup']}" />
					<p:column colspan="1">
						<f:facet name="header">
							<h:outputText
								value="#{lbl['lbl.sc.eval.tec.score.popup']}(#{suppFinalizationBackingBean.managedBean.overallTechnicalRecommendationPercent}%)" />
						</f:facet>
					</p:column>
					<p:column colspan="1">
						<f:facet name="header">
							<h:outputText
								value="#{lbl['lbl.sc.eval.fin.score.popup']}(#{suppFinalizationBackingBean.managedBean.overallFinancialRecommendationPercent}%)" />
						</f:facet>
					</p:column>
				</p:row>
			</p:columnGroup>
			<p:column style="text-align:center;">

				<h:outputText value="#{qualifiedSupp.technicalTotalScore}" />


			</p:column>
			<p:column style="text-align:center;">

				<h:outputText value="#{qualifiedSupp.financialTotalScore}" />


			</p:column>
			<p:column style="text-align:center;">

				<h:outputText value="#{qualifiedSupp.recommendationTechnicalScore}" />


			</p:column>
			<p:column style="text-align:center;">

				<h:outputText value="#{qualifiedSupp.recommendationFinancialScore}" />


			</p:column>
			<p:column style="text-align:center;">

				<h:outputText value="#{qualifiedSupp.recommendationTotalScore}" />


			</p:column>

		</p:dataTable>
	</p:dialog>
	<ui:remove>
		<!-- #38151 datatable value popup-->
		<!-- end -->
	</ui:remove>
</ui:composition>
<!-- #29729 End -->
