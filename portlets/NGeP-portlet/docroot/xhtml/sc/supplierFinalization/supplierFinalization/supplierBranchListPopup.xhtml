<!-- #28777#29729 - Start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<style type="text/css">
.colored {
	background-color: #d9edf7 !important;
}
</style>

	<!--  Supplier Branch List dialog -->
	<p:dialog id="suppBranchListPopupId" widgetVar="suppBranchListPopup"
		position="center" header="#{lbl['lbl.sc.branch.list']}" modal="true"
		dynamic="true" styleClass="pop_up_top" width="950" resizable="false">
		<div class="align-center">
			<p:dataTable var="branchList"
				value="#{suppFinalizationBackingBean.managedBean.supplierBranchList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rows="10">
				<ac:paginator for="branchList" />

				<p:column headerText="#{lbl['lbl.sc.branch.name']}"
					style="width:30%; white-space:normal;"
					styleClass="#{branchList.qtRelatedSupplierBranch eq true ? 'colored':null}">
					<h:outputText value="#{branchList.branchName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.branch.address']}"
					style="width:60%; white-space:normal;"
					styleClass="#{branchList.qtRelatedSupplierBranch eq true ? 'colored':null}">
					<h:outputText value="#{branchList.smAddress.address1}" />
					<p:spacer width="10" />
					<h:outputText value="#{branchList.smAddress.address2}" />
					<p:spacer width="10" />
					<h:outputText value="#{branchList.smAddress.address3}" />
					<p:spacer width="10" />
					<br />
					<h:outputText value="#{branchList.smAddress.postcode}" />
					<p:spacer width="10" />
					<h:outputText value="#{branchList.smAddress.pmCity.cityName}" />
					<p:spacer width="10" />
					<h:outputText value="#{branchList.smAddress.pmState.stateName}" />
					<p:spacer width="10" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.branch.status']}"
					style="width:10%; white-space:normal; text-align:center;"
					styleClass="#{branchList.qtRelatedSupplierBranch eq true ? 'colored':null}">
					<h:outputText
						value="#{lbl[branchList.recordStatusFlg eq DbValueConst.recordStatusActive ? 'lbl.txt.active' : 'lbl.txt.deleted']}" />

				</p:column>

			</p:dataTable>
		</div>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
				process="@this" immediate="true"
				onclick="suppBranchListPopup.hide()" />
		</div>

	</p:dialog>
</ui:composition>
<!-- #28777#29729 - End -->
