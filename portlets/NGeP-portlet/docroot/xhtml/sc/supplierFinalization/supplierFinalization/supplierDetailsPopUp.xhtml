<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:dialog id="suppDtlPopUp" widgetVar="suppDtlWidgetVar" resizable="false"
		styleClass="pop_up_top" header="#{lbl['lbl.sc.supplier.details']}" 
		width="400" height="350">
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth50">
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{suppFinalizationBackingBean.managedBean.smSupplier.epNo}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;"
					value="#{suppFinalizationBackingBean.managedBean.smSupplier.companyName}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.registration.type']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.registration.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;"
					value="#{suppFinalizationBackingBean.managedBean.smSupplier.regNo}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{suppFinalizationBackingBean.managedBean.smMofAccount.mofNo}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.income.tax.ref.no']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style="margin-bottom:5px;" 
					value="#{suppFinalizationBackingBean.managedBean.smCompanyBasic.incomeTaxNo}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.establishment.date']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{suppFinalizationBackingBean.managedBean.smSupplier.establishDate}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.type.of.company']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;"
					value="#{suppFinalizationBackingBean.managedBean.smSupplier.businessType}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.mof.expired.date']}" />
			</h:column>
			<h:column>
				<p:inputText size="30"
					value="#{suppFinalizationBackingBean.managedBean.smMofAccount.expDate}"
					readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.disciplinary.rating']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" style=" margin-bottom:5px;" value="" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{suppFinalizationBackingBean.managedBean.supplierBranch}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.address']}" />
			</h:column>
			<h:column>
				<p:inputTextarea cols="30" value="#{suppFinalizationBackingBean.managedBean.supplierAddress.address1}" 
					style=" margin-bottom:5px;" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{suppFinalizationBackingBean.managedBean.smPersonnel.name}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.designation']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{suppFinalizationBackingBean.managedBean.smPersonnel.designation}" readonly="true" />
			</h:column>
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.email']}" />
			</h:column>
			<h:column>
				<p:inputText size="30" value="#{suppFinalizationBackingBean.managedBean.smPersonnel.email}" readonly="true" />
			</h:column>
		</h:panelGrid>

		<p:spacer height="20px" />
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton 
						value="#{lbl['lbl.btn.cancel']}" 
						icon="ui-icon-cancel"
						onclick="suppDtlWidgetVar.hide();" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
	
</ui:composition>
