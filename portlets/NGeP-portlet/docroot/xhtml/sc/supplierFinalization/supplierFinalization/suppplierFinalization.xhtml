<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<style type="text/css">
		.checkbox .ui-chkbox {
			float: left;
			vertical-align: bottom;
		}
		
		.label .ui-outputlabel { 
			text-align: left; 
		}.
	</style>
	
	<p:panel header="#{lbl['lbl.sc.supplier.finalization']}" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20">
			
			<h:column>
				<p:outputLabel value="#{lbl['lbl.sc.decision']}" />
				<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
			</h:column>
			<h:column>
				<p:selectOneMenu id="decisionType" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.decision.parameterCode}">
					<f:selectItems value="#{suppFinalizationBackingBean.getDecisionDropDown()}" />
					<p:ajax event="change" 
						update="@([id$=recommendSupplierPanel],[id$=reEvaluatePanel],[id$=rePublishPanel],[id$=itemSupplierPanel],[id$=itemSupplierPanel])" 
						listener="#{suppFinalizationBackingBean.decisionEvent}" process="@this" />
	   			</p:selectOneMenu>
			</h:column>
		</h:panelGrid>
				
		<p:outputPanel id="recommendSupplierPanel">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
				columnClasses="columnWidth20"
				rendered="#{suppFinalizationBackingBean.managedBean.recommendSupplier}">
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.recomend.type']}" />
					<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
				</h:column>
				<h:column>
					<p:selectOneRadio id="recommendType" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode}">
						<f:selectItems value="#{suppFinalizationBackingBean.getRecommendTypeRadioBtn()}" />
						<p:ajax event="change" update="@([id$=itemSupplierPanel])" 
							listener="#{suppFinalizationBackingBean.recommendTypeEvent}" process="@this" />
		   			</p:selectOneRadio>
				</h:column>
			</h:panelGrid>
				
			<p:outputPanel id="onlineBiddingPanel">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
					columnClasses="columnWidth20"
					rendered="#{suppFinalizationBackingBean.managedBean.onlineBidding}">
					<h:column>
						<p:outputLabel value="#{lbl['lbl.sc.online.bidding.endorsement']}" />
						<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
					</h:column>
					<h:column>
						<p:selectOneRadio id="biddingEndorsement" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}">
							<f:selectItems value="#{suppFinalizationBackingBean.getBiddingEndorsementRadioBtn()}" />
			   			</p:selectOneRadio>
					</h:column>
				</h:panelGrid>
			</p:outputPanel>

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
				columnClasses="columnWidth20"
				rendered="#{suppFinalizationBackingBean.managedBean.recommendSupplier}">
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.loi.loa.prepared.by']}" />
					<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
				</h:column>
				<h:column>
					<p:selectOneRadio id="loiLoaPreparedBy" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.loiLoaBy}">
						<f:selectItems value="#{suppFinalizationBackingBean.getLoiLoaPreparedByRadioBtn()}" />
		   			</p:selectOneRadio>
				</h:column>

				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.forward.to.higher.authority']}" />
					<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
				</h:column>
				<h:column>
					<p:selectOneRadio id="fwdHigherAuthority" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.higherAuthReq}">
						<f:selectItems value="#{suppFinalizationBackingBean.getFwdHigherAuthorityRadioBtn()}" />
						<p:ajax event="change" update="@([id$=fwdHigherAuthorityPanel])" 
							listener="#{suppFinalizationBackingBean.fwdHigherAuthorityEvent}" process="@this" />
		   			</p:selectOneRadio>
				</h:column>
			</h:panelGrid>

			<p:outputPanel id="fwdHigherAuthorityPanel">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
					columnClasses="columnWidth20"
					rendered="#{suppFinalizationBackingBean.managedBean.scQtFinalization.higherAuthReq}">
					
					<h:column rendered="#{!suppFinalizationBackingBean.managedBean.forwardToBpk}">
						<p:outputLabel value="#{lbl['lbl.sc.finalization.committee']}" />
					</h:column>
					
					<h:column rendered="#{!suppFinalizationBackingBean.managedBean.forwardToBpk}">
						<p:selectOneMenu id="finalizationCommittee" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.higherCommitte.parameterId}">
							<f:selectItems value="#{suppFinalizationBackingBean.getFinalizationCommitteeDropDown()}" />
							<p:ajax event="change" update="@([id$=committeeSecretary])" 
								listener="#{suppFinalizationBackingBean.finalizationCommitteeEvent}" process="@this" />
			   			</p:selectOneMenu>
			   			<p:spacer width="5px" />
			   			<p:inputText id="committeeSecretary" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.userName}" disabled="true"/>
					</h:column>
					
					<h:column>
						<p:outputLabel value="#{lbl['lbl.sc.reason']}" rendered="#{!suppFinalizationBackingBean.managedBean.forwardToBpk}"/>
						<p:outputLabel value=" " rendered="#{suppFinalizationBackingBean.managedBean.forwardToBpk}"/>
					</h:column>
					<h:column>
						<p:selectOneRadio id="reason" layout="grid" columns="1"
							value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.reason.reasonId}" 
							rendered="#{!suppFinalizationBackingBean.managedBean.forwardToBpk}">
							<f:selectItems value="#{suppFinalizationBackingBean.getReasonRadioBtn()}" />
			   			</p:selectOneRadio>
			   			
			   			<h:outputText style="text-align: left;" value="#{lbl['lbl.sc.notes.forward.to.bpk']}" 
			   				rendered="#{suppFinalizationBackingBean.managedBean.forwardToBpk}"/>
					</h:column>
				</h:panelGrid>
			</p:outputPanel>
		</p:outputPanel>
				
		<p:outputPanel id="reEvaluatePanel">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
				columnClasses="columnWidth20"
				rendered="#{suppFinalizationBackingBean.managedBean.reEvaluate}">
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.reevaluate.by']}" />
				</h:column>
				<h:column>
					<p:selectOneRadio id="reEvaluateBy" value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.reEvaluateCommitte}">
						<f:selectItems value="#{suppFinalizationBackingBean.getReEvaluateByRadioBtn()}" />
		   			</p:selectOneRadio>
				</h:column>

				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.reevaluation.required.for']}" />
				</h:column>
				<h:column>
					<div class="label">
						<p:outputLabel value="#{lbl['lbl.sc.technical']}" />
					</div>
					
					<div class="checkbox">
						<p:selectBooleanCheckbox id="reEvaluateReqForTech" 
							value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.reEvaluateTechReq}"/>
					</div>
				</h:column>
				
				<h:column>
				</h:column>
				<h:column>
					<div class="label">
						<p:outputLabel value="#{lbl['lbl.sc.financial']}" />
					</div>
					<div class="checkbox">
						<p:selectBooleanCheckbox id="reEvaluateReqForFin" 
							value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.reEvaluateFinReq}" />
					</div>
				</h:column>
			</h:panelGrid>
		</p:outputPanel>
		
		<p:spacer height="1px" />
		<p:outputPanel id="rePublishPanel">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
				columnClasses="columnWidth20"
				rendered="#{suppFinalizationBackingBean.managedBean.rePublish}">
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.required.specification.changes']}" />
		   		</h:column>
		   		<h:column>
		   			<div class="checkbox">
						<p:selectBooleanCheckbox id="reqSpecChanges" 
							value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.specChangeReq}" />
					</div>
				</h:column>
			</h:panelGrid>
		</p:outputPanel>
		
	</p:panel>
	
	<p:spacer height="20px" />
	<p:outputPanel id="itemSupplierPanel">
		<h:panelGroup id="itemPanel" rendered="#{suppFinalizationBackingBean.managedBean.recommendSupplier and suppFinalizationBackingBean.managedBean.itemize}">
			<ui:include src="/xhtml/sc/supplierFinalization/supplierFinalization/itemList.xhtml" />
		</h:panelGroup>

		<h:panelGroup id="supplierPanel" rendered="#{suppFinalizationBackingBean.managedBean.recommendSupplier}">
			<ui:include src="/xhtml/sc/supplierFinalization/supplierFinalization/shortlistedSupplierList.xhtml" />
		</h:panelGroup>
	</p:outputPanel>
	
	<p:spacer height="20px" />
	<p:panel header="#{lbl['lbl.txt.remarks']}" toggleable="true">
		<table style="width: 100%" id="remarksList">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;">
					<p:outputLabel value="#{lbl['lbl.sc.remark']}" />
				</td>
				<td class="TableFieldRight">
					<p:dataGrid var="remarkVar"
						value="#{suppFinalizationBackingBean.managedBean.committeeRemarkList}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<h:graphicImage
										height="30"
										value="#{suppFinalizationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" />
								</td>
								<td width="5"></td>
								<td>
									<h:outputText value="#{remarkVar.createdUser.userName}" />, 
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText>
								</td>
							</tr>
							<tr>
								<td></td>
								<td>
									<p:inputTextarea cols="40"
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" /> 
									<h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
