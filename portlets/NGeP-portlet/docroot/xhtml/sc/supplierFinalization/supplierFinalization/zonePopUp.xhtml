<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!--  Zone Details dialog -->
	<p:dialog id="popZone" widgetVar="popZone" resizable="false"
		styleClass="pop_up_top" header="" width="600" height="500">

		<p:panel id="zoneListtblId" header="#{lbl['lbl.sc.zone.details']}">
			<table styleClass="noBorders tr,noBorders td">
				<tr>
					<td width="20%" valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.zone.name']}" /></td>
					<td width="80%"><p:inputText readonly="true"
							value="#{suppFinalizationBackingBean.managedBean.scQtZoneCriteria.zoneName}"
							size="30" /></td>
				</tr>
				<tr>
					<td width="20%" valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.location.name']}" /></td>
					<td width="80%"><p:panel></p:panel> <p:tree id="treeZoneLocPopup"
							value="#{suppFinalizationBackingBean.managedBean.rootLocationTree}"
							var="deliveryloc"
							selection="#{suppFinalizationBackingBean.managedBean.selectedNodes}"
							selectionMode="checkbox">
							<p:treeNode>
								<h:outputText value="#{deliveryloc.locationName}" />
							</p:treeNode>
						</p:tree></td>
				</tr>
			</table>
		</p:panel>

		<p:spacer height="25px" />
		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			style="float:right;" onclick="popZone.hide();">
		</p:commandButton>

	</p:dialog>
</ui:composition>
