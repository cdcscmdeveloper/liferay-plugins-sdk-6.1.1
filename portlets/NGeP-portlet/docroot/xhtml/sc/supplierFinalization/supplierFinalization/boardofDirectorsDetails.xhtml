<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:dialog id="bodDetails" widgetVar="bodDetailsDialog" resizable="false"
		styleClass="pop_up_top" header="#{lbl['lbl.sc.sf.board.of.directors']}" 
		width="750" height="250">
		
		<p:dataTable var="smPersonnel" value="#{suppFinalizationBackingBean.managedBean.boardofDirectors}"
		             emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
					 rows="10" >

			<p:column headerText="#{lbl['lbl.sc.mof.no']}"
					  style="width:20%; white-space:normal;">
				<h:outputText value="#{smPersonnel.smAppl.smSupplier.smMofAccount.mofNo}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.company.name']}"
					  style="width:40%; white-space:normal;">
				<h:outputText value="#{smPersonnel.smAppl.smSupplier.companyName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bod']}"
					  style="width:40%; white-space:normal;">
				<h:outputText value="#{smPersonnel.name}" />
			</p:column>
		</p:dataTable>		
		
		<p:spacer height="20px" />
		<div align="right" style="width:100%;">
			<p:commandButton value="#{lbl['lbl.btn.close']}" 
						onclick="bodDetailsDialog.hide();" />
		</div>	
	</p:dialog>
	
</ui:composition>
