<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="addHigherAuthorityid"
		header="#{lbl['lbl.sc.add']} #{suppFinalizationBackingBean.managedBean.tabTitle}"
		dynamic="true" modal="true" widgetVar="addHigherAuthority"
		styleClass="scAddMember" width="950" height="600" resizable="false"
		closable="true">
		<p:blockUI block=":form:haPopupPnlGrpId" widgetVar="blockWidgetPopup">
			<p:graphicImage value="#{CommonUIConstant.imagePath}/ajax-loader.gif" />
		</p:blockUI>
		<p:messages id="hamessages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		<h:panelGroup id="haPopupPnlGrpId">
			<p:panel id="fcUserSearchPnlid" header="#{lbl['lbl.sc.search']}"
				toggleable="true">

				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.finalization.committee.higher.authority']}" /></td>
						<td><p:selectOneRadio
								disabled="#{suppFinalizationBackingBean.managedBean.disableFinalizationCommittee}"
								value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.finalizationCommitteeTypeId}">
								<f:selectItems
									value="#{suppFinalizationBackingBean.getFinalizationCommitteeDropDown()}" />
								<p:ajax event="change" onstart="blockWidgetPopup.show()"
									oncomplete="blockWidgetPopup.hide()"
									update="@([id$=fcUserSearchPnlid], [id$=higherAuthoritysearchid])"
									listener="#{suppFinalizationBackingBean.finalizationCommitteeTypeChange}" />
							</p:selectOneRadio></td>
					</tr>
					<ui:fragment
						rendered="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.orgCat eq ParameterConst.orgCategoryPtj}">
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committee.add.member.search.ministry']}" /></td>
							<td><p:selectOneMenu id="fcMinistryDD"
									disabled="#{suppFinalizationBackingBean.managedBean.ministryNotNegeri}"
									value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.ministry}">
									<p:ajax onstart="blockWidget.show()"
										oncomplete="blockWidget.hide()"
										update="@([id$=fcPtjGroupDD], [id$=fcPtjDD])"
										listener="#{suppFinalizationBackingBean.onChangeDD(ParameterConst.orgTypeMinistry)}" />
									<f:selectItems
										value="#{suppFinalizationBackingBean.managedBean.ministryDDList}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committee.add.member.search.ptj.group']}" /></td>
							<td><p:selectOneMenu id="fcPtjGroupDD"
									value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.ptjGroup}">
									<p:ajax onstart="blockWidget.show()"
										oncomplete="blockWidget.hide()" update="@([id$=fcPtjDD])"
										listener="#{suppFinalizationBackingBean.onChangeDD(ParameterConst.orgTypePtjGroup)}" />
									<f:selectItems
										value="#{suppFinalizationBackingBean.managedBean.ptjGroupDDList}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committee.add.member.search.ptj']}" /></td>
							<td><p:selectOneMenu id="fcPtjDD"
									value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.ptj}">
									<f:selectItems
										value="#{suppFinalizationBackingBean.managedBean.ptjDDList}" />
								</p:selectOneMenu></td>
						</tr>
					</ui:fragment>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /></td>
						<td colspan="3"><p:inputText
								value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.name}"
								size="64" id="fcName" label="#{lbl['lbl.sc.name']}"
								onmouseout="limitTextArea(this,1000);">
								<p:ajax event="change" process="@this" update="@this" />
								<f:validateLength for="fcName" maximum="1000" />
							</p:inputText> <p:message id="fcNameMsg" for="fcName" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.id.type']}" /></td>
						<td colspan="3"><p:selectOneMenu
								value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.identificationType}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItems
									value="#{suppFinalizationBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" /></td>
						<td colspan="3"><p:inputText id="fcIdNo"
								value="#{suppFinalizationBackingBean.managedBean.committeeSearchBean.identificationNo}"
								size="30" onmouseout="limitTextArea(this,500);">
								<p:ajax event="change" process="@this" update="@this" />
								<f:validateLength for="fcIdNo" maximum="500" />
							</p:inputText> <p:message id="fcIdNoMsg" for="fcIdNo" display="icon" /></td>
					</tr>
				</table>

				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						onstart="blockWidgetPopup.show();"
						oncomplete="blockWidgetPopup.hide();"
						action="#{suppFinalizationBackingBean.searchHigherSecretaryUserAction}"
						update="@([id$=higherAuthoritysearchid])"
						process="@this, fcUserSearchPnlid" />
					<p:commandButton value="#{lbl['lbl.btn.reset']}"
						action="#{suppFinalizationBackingBean.resetHigherSecretarySearchCriteriaAction}"
						update="@([id$=fcUserSearchPnlid], [id$=higherAuthoritysearchid])"
						resetValues="true" partialSubmit="true" process="@this" />
				</div>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
				<p:dataTable id="higherAuthoritysearchid"
					value="#{suppFinalizationBackingBean.managedBean.userSearchHigherAuthoritySecretaryDataModel}"
					selection="#{suppFinalizationBackingBean.managedBean.selectedPmUser}"
					rowKey="#{higherAuthorityUser.userId}" var="higherAuthorityUser"
					lazy="true" style="width : 100%;" rows="10"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					styleClass="existingCommitteeResults" rowIndexVar="indexHA">

					<ac:paginator for="higherAuthoritysearchid" />

					<p:column style="width:3px;text-align:center;">
						<p:selectBooleanCheckbox value="#{higherAuthorityUser.selected}"
							disabled="#{!higherAuthorityUser.selected and suppFinalizationBackingBean.managedBean.selectedHigherSecretary ne null}">
							<p:ajax partialSubmit="true" process="@all"
								onstart="blockWidgetPopup.show();"
								oncomplete="blockWidgetPopup.hide();"
								listener="#{suppFinalizationBackingBean.selectedHigherSecretary(higherAuthorityUser)}"
								update="@([id$=higherAuthoritysearchid], [id$=addHigherAuthorityBtnId])" />
						</p:selectBooleanCheckbox>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.name']}">
						<h:outputText value="#{higherAuthorityUser.userName}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.identification.no']}">
						<h:outputText value="#{higherAuthorityUser.identificationNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.designation']}">
						<h:outputText value="#{higherAuthorityUser.designation}"
							style="white-space: normal;" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.committee.add.member.search.ministry']}">
						<h:outputText style="white-space: normal;"
							value="#{suppFinalizationBackingBean.getOrgDesc(higherAuthorityUser.pmUserOrgs,ParameterConst.orgTypeMinistry)}" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.committee.add.member.search.ptj.group']}">
						<h:outputText style="white-space: normal;"
							value="#{suppFinalizationBackingBean.getOrgDesc(higherAuthorityUser.pmUserOrgs,ParameterConst.orgTypePtjGroup)}" />
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.committee.add.member.search.ptj']}">
						<h:outputText style="white-space: normal;"
							value="#{suppFinalizationBackingBean.getOrgDesc(higherAuthorityUser.pmUserOrgs,ParameterConst.orgTypePtj)}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.email']}">
						<h:outputText value="#{higherAuthorityUser.email}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.grade']}">
						<h:outputText value="#{higherAuthorityUser.grade}" />
					</p:column>

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.pnp']}" />
							<p:graphicImage id="pnpTTImg#{indexHA}id"
								value="/css/images/design/ico-tooltips.png" />
							<p:tooltip id="pnpTT#{indexHA}id" for="pnpTTImg#{indexHA}id">
								<p:outputLabel escape="false"
									value="#{lbl['lbl.sc.pnp.tooltip']}" />
							</p:tooltip>
						</f:facet>
						<h:outputText
							value="#{lbl[higherAuthorityUser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.role']}">
						<h:outputText
							value="#{suppFinalizationBackingBean.getParameterDesc(suppFinalizationBackingBean.getParameterByTypeAndCode(ParameterTypeConst.committeeRole,
						ParameterConst.committeeRoleSecretary))}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					styleClass="BtnSpacing" id="addHigherAuthorityBtnId"
					action="#{suppFinalizationBackingBean.okHigherSecretaryAction}"
					process="@this" partialSubmit="true"
					onstart="blockWidgetPopup.show();"
					oncomplete="blockWidgetPopup.hide(); addHigherAuthority.hide();"
					disabled="#{empty suppFinalizationBackingBean.managedBean.selectedHigherSecretary}"
					update="@([id$=finalizationCommittee], [id$=addHigherAuthorityid])" />

				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					actionListener="#{suppFinalizationBackingBean.cancelHigherSecretaryAction}"
					onclick="addHigherAuthority.hide();" />
			</div>
		</h:panelGroup>
		<p:ajax event="close" update="@([id$=addHigherAuthorityid])"
			actionListener="#{suppFinalizationBackingBean.cancelHigherSecretaryAction}" />
	</p:dialog>
</ui:composition>
