<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:dialog id="haSecretaryDetailsId" width="600" height="150"
		header="#{lbl['lbl.sc.committee.add.member.search.header.user.info']}"
		widgetVar="haSecDetailsPopUp" resizable="false" closable="true"
		modal="true">

		<p:panelGrid style="margin-top:5px;width:100%;"
			rendered="#{not empty suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.userName}"
			styleClass="panelGridBorders tr, panelGridBorders td">
			<f:facet name="header">
				<p:row>
					<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.name']}
							</p:column>
					<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.committee.finalization.do.header.ministry.org']}
							</p:column>
					<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.committee.finalization.do.header.ptj.org.code']}
							</p:column>
					<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.committee.finalization.do.header.ptj.org.name']}
							</p:column>
				</p:row>
			</f:facet>
			<p:row>
				<p:column>
					<h:outputText
						value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.userName}" />
				</p:column>
				<p:column>
					<h:outputText
						value="#{suppFinalizationBackingBean.getOrgDesc(suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.pmUserOrgs,ParameterConst.orgTypeMinistry)}" />
				</p:column>
				<p:column>
					<h:outputText
						value="#{suppFinalizationBackingBean.getOrgDesc(suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.pmUserOrgs,ParameterConst.orgTypePtjGroup)}" />
				</p:column>
				<p:column>
					<h:outputText
						value="#{suppFinalizationBackingBean.getOrgDesc(suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.pmUserOrgs,ParameterConst.orgTypePtj)}" />
				</p:column>
			</p:row>
		</p:panelGrid>

		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}"
				onclick="haSecDetailsPopUp.hide();" />
		</div>
	</p:dialog>
</ui:composition>
