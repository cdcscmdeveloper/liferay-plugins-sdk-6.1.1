<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:spacer height="20px" />	
	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
	
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20"
			rendered="#{suppFinalizationBackingBean.managedBean.recommendSupplier 
						and !suppFinalizationBackingBean.managedBean.itemize}">
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.recommend.by']}" />
				<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
			</h:column>
			<h:column>
				<p:selectOneMenu id="recommendBy" label="#{lbl['lbl.sc.recommend.by']}"
					value="#{suppFinalizationBackingBean.managedBean.recommendBy}"
					disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
					<f:selectItems value="#{suppFinalizationBackingBean.getPackageRecommendByDropDown()}" />
					<p:ajax event="change" update="@([id$=recommendBy],[id$=onlineBiddingPanel],[id$=supplierListTblPanel])" 
						listener="#{suppFinalizationBackingBean.packageRecommendByEvent}" process="@this" />
	   			</p:selectOneMenu>
			</h:column>
		</h:panelGrid>
		
		<p:spacer height="20px" />
		<p:outputPanel id="supplierListTblPanel">
		
			<p:dataTable id="supplierListTblSingle"
				var="shortlistedSupp" 
				widgetVar="shortlistedSuppDtls"
				value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
				selection="#{suppFinalizationBackingBean.managedBean.recommendedSupplier}"
				editable="true" rowIndexVar="index" style="width:100%;" rowKey="#{shortlistedSupp}"
				rendered="#{suppFinalizationBackingBean.managedBean.selectionMode == 'single'}">
				<ac:paginator for="supplierListTblSingle" />
					
				<p:ajax event="rowSelect"
					listener="#{suppFinalizationBackingBean.selectSupplierEvent}"
					update="@([id$=supplierListTblSingle])" process="@this" partialSubmit="true"/>					
					
				<p:ajax event="rowEdit"
					listener="#{suppFinalizationBackingBean.selectSupplierEvent}"
					update="@([id$=supplierListTblSingle])" process="@this" partialSubmit="true"/>
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumi.status']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" />
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.supplier.status']}" style="text-align: center;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column>
					<p:commandLink update=":form:suppDtlPopUp" action="#{suppFinalizationBackingBean.showSupplierDetails(null, null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText style="width:180px; white-space:normal;" value="#{shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.scQtProposal.proposalAmount.proposalAmt}" rendered="#{shortlistedSupp.scQtProposal.proposalAmount ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evaluationResultDtls[0].totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
	
				<p:column>
					<h:outputText value="#{shortlistedSupp.evaluationResultDtls[0].evalRank}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
				
				<p:column rendered="#{shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].recordStatusFlg
								  	 								ne DbValueConst.recordStatusExpired}">
					<h:outputText value="#{suppFinalizationBackingBean
											.getMofAccountStatus(shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0])}"/>							  	 
				</p:column>
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].recordStatusFlg
								  	 								eq DbValueConst.recordStatusExpired}">
					<h:outputText value="#{suppFinalizationBackingBean
											.getMofAccountStatus(shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0])}"/>
				</p:column>				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							title="#{lbl['lbl.sc.sf.view.bod']}"/>
	         		</p:commandLink> 
				</p:column>
				
				<p:column style="text-align: center;" selectionMode="#{suppFinalizationBackingBean.managedBean.selectionMode}" 
					disabledSelection="#{!suppFinalizationBackingBean.managedBean.secretaryUser}"/> 
			</p:dataTable>
			
			<p:dataTable id="supplierListTblMultiple"
					var="shortlistedSupp" 
					widgetVar="shortlistedSuppDtls"
					value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
					selection="#{suppFinalizationBackingBean.managedBean.recommendedSupplierList}"
					editable="true" rowIndexVar="index" style="width:100%"
					rowKey="#{shortlistedSupp}"
					rendered="#{!suppFinalizationBackingBean.managedBean.itemize
								and suppFinalizationBackingBean.managedBean.selectionMode == 'multiple'}">
								
				<ac:paginator for="supplierListTblMultiple" />
				
				<p:ajax event="rowSelect"
					listener="#{suppFinalizationBackingBean.selectSupplierEvent}"
					update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" process="@this" partialSubmit="true"/>
				
				<p:ajax event="rowSelectCheckbox"
					listener="#{suppFinalizationBackingBean.selectSupplierEvent}"
					update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" process="@this"  partialSubmit="true"/>
					
				<p:ajax event="rowUnselect"
					listener="#{suppFinalizationBackingBean.unSelectSupplierEvent(shortlistedSupp)}"
					update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" process="@this"  partialSubmit="true"/>
					
				<p:ajax event="rowUnselectCheckbox"
					listener="#{suppFinalizationBackingBean.unSelectSupplierEvent(shortlistedSupp)}"
					update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" process="@this"  partialSubmit="true"/>
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumi.status']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" />
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.supplier.status']}" style="text-align: center;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column>
					<p:commandLink update=":form:suppDtlPopUp"
						action="#{suppFinalizationBackingBean.showSupplierDetails(null,null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText style="width:180px; white-space:normal;" value="#{shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.scQtProposal.proposalAmount.proposalAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evaluationResultDtls[0].totalScore}" rendered="#{shortlistedSupp.evaluationResultDtls ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
	
				<p:column>
					<h:outputText value="#{shortlistedSupp.evaluationResultDtls[0].evalRank}" rendered="#{shortlistedSupp.evaluationResultDtls ne null}"/>
				</p:column>
				
				<p:column rendered="#{shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].recordStatusFlg
								  	 								ne DbValueConst.recordStatusExpired}">
					<h:outputText value="#{suppFinalizationBackingBean
											.getMofAccountStatus(shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0])}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].recordStatusFlg
								  	 								eq DbValueConst.recordStatusExpired}">
					<h:outputText value="#{suppFinalizationBackingBean
											.getMofAccountStatus(shortlistedSupp.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0])}"/>
				</p:column>	
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							title="#{lbl['lbl.sc.sf.view.bod']}"/>
	         		</p:commandLink> 
				</p:column>
				
				<p:column style="text-align: center;" selectionMode="#{suppFinalizationBackingBean.managedBean.selectionMode}" 
						  disabledSelection="#{!suppFinalizationBackingBean.managedBean.secretaryUser}"/>  
			</p:dataTable>
			
			<p:dataTable id="itemSupplierListTblMultiple"
					var="shortlistedItemSupp" 
					widgetVar="shortlistedSuppDtls"
					value="#{suppFinalizationBackingBean.managedBean.shortlistedItemSupplierList}"
					selection="#{suppFinalizationBackingBean.managedBean.recommendedItemSupplierList}"
					editable="true" rowIndexVar="index" style="width:100%;"
					rowKey="#{shortlistedItemSupp}"
					rendered="#{suppFinalizationBackingBean.managedBean.itemize
									and suppFinalizationBackingBean.managedBean.selectionMode == 'multiple'}">
									
				<ac:paginator for="itemSupplierListTblMultiple" />
				
				<p:ajax event="rowSelect"
					listener="#{suppFinalizationBackingBean.selectSupplierEvent}"
					update="@([id$=itemListTbl],[id$=itemSupplierListTblMultiple])" process="@this" partialSubmit="true"/>
				
				<p:ajax event="rowSelectCheckbox"
					listener="#{suppFinalizationBackingBean.selectSupplierEvent}"
					update="@([id$=itemListTbl],[id$=itemSupplierListTblMultiple])" process="@this"  partialSubmit="true"/>
					
				<p:ajax event="rowUnselect"
					listener="#{suppFinalizationBackingBean.unSelectSupplierEvent(shortlistedSupp)}"
					update="@([id$=itemListTbl],[id$=itemSupplierListTblMultiple])" process="@this"  partialSubmit="true"/>
					
				<p:ajax event="rowUnselectCheckbox"
					listener="#{suppFinalizationBackingBean.unSelectSupplierEvent(shortlistedSupp)}"
					update="@([id$=itemListTbl],[id$=itemSupplierListTblMultiple])" process="@this"  partialSubmit="true"/>
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumi.status']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" />
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.supplier.status']}" style="text-align: center;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedItemSupp.qtEvaluationResult.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column>
					<p:commandLink update=":form:suppDtlPopUp"
						action="#{suppFinalizationBackingBean.showSupplierDetails(null,null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedItemSupp.qtEvaluationResult}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText style="width:180px; white-space:normal;" value="#{shortlistedItemSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
											fn:toUpperCase(shortlistedItemSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedItemSupp.qtEvaluationResult.offeredPrice}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedItemSupp.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
	
				<p:column>
					<h:outputText value="#{shortlistedItemSupp.evalRank}" />
				</p:column>
				
				<p:column rendered="#{shortlistedItemSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].recordStatusFlg
								  	 								ne DbValueConst.recordStatusExpired}">
					<h:outputText value="#{suppFinalizationBackingBean
											.getMofAccountStatus(shortlistedItemSupp.qtEvaluationResult
											.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0])}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{shortlistedItemSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].recordStatusFlg
								  	 								eq DbValueConst.recordStatusExpired}">
					<h:outputText value="#{suppFinalizationBackingBean
											.getMofAccountStatus(shortlistedItemSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0])}"/>
				</p:column>	
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedItemSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage library="ep/images/design" name="document.png"
							value="/resources/ep/images/design/document.png"
							title="#{lbl['lbl.sc.sf.view.bod']}"/>
	         		</p:commandLink> 
				</p:column>
				
				<p:column style="text-align: center;" selectionMode="#{suppFinalizationBackingBean.managedBean.selectionMode}"
					disabledSelection="#{!suppFinalizationBackingBean.managedBean.secretaryUser}"/>  
			</p:dataTable>			
		</p:outputPanel>
		<p:spacer height="20px" />
	</p:panel>

</ui:composition>
