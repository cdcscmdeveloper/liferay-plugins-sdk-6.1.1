<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:spacer height="20px" />	
	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
	
		<p:spacer height="20px"/>
		<p:outputPanel id="supplierListTblPanel">
			<ui:param name="showSelectionColumn" value="#{empty suppFinalizationBackingBean.managedBean.finalizationMethod or 
		               			  			 				!(suppFinalizationBackingBean.managedBean.finalizationMethod eq 
																ParameterConst.recommendByCancel)}" />
			<p:dataTable id="supplierListTblSingle"
				var="shortlistedSupp" widgetVar="shortlistedSuppDtls" 
				value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
				selection="#{suppFinalizationBackingBean.managedBean.recommendedSupplier}"
				editable="true" rowIndexVar="index" style="width:100%;" rowKey="#{shortlistedSupp}"
				rendered="#{suppFinalizationBackingBean.managedBean.selectionMode == 'single' and 
								!suppFinalizationBackingBean.managedBean.itemize}">
				<ac:paginator for="supplierListTblSingle" />
					
				<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
						update="@([id$=supplierListTblSingle])"/>
									
				<p:ajax event="rowSelect" update="@([id$=supplierListTblSingle])" 
						process="@this" partialSubmit="true"/>					
					
				<p:ajax event="rowEdit" update="@([id$=supplierListTblSingle])" 
						process="@this" partialSubmit="true"/>
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:5%; white-space:normal;"/>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" style="width:9%; white-space:normal; text-align:center;"/>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumiputra.status']}" style="width:5%; white-space:normal;" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" style="width:10%; white-space:normal;"/>
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.sf.additional.information']}" style="width:15%; text-align:center;" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" style="width:10%; white-space:normal;" 
		               			  rendered="#{showSelectionColumn}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" style="width:7%; white-space:normal;"/>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" style="width:7%; white-space:normal;"/>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" style="width:7%; white-space:normal;" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column style="white-space:normal;">
					<p:commandLink update=":form:suppDtlPopUp" action="#{suppFinalizationBackingBean.showSupplierDetails(null, null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
											fn:toUpperCase(shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.proposalAmount.proposalAmt}" rendered="#{shortlistedSupp.proposalAmount ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evalRank}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
				
				<p:column rendered="#{!empty shortlistedSupp.smMofAccount and shortlistedSupp.smMofAccount.recordStatusFlg
								  	 								eq DbValueConst.recordStatusActive}">
					<h:outputText value="#{lbl['lbl.pm.status.active']}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{empty shortlistedSupp.smMofAccount}">
					<h:outputText value="#{lbl['lbl.sm.status.expired']}"/>
				</p:column>
						
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" />
	         		</p:commandLink> 
				</p:column>
								
				<p:column style="text-align: center;" selectionMode="#{suppFinalizationBackingBean.managedBean.selectionMode}" 
					disabledSelection="#{!(suppFinalizationBackingBean.managedBean.secretaryUser or 
											suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK) or 
												shortlistedSupp.suppSelectionDisabled or 
													suppFinalizationBackingBean.managedBean.disableSupplierSelection}"
		            rendered="#{showSelectionColumn}" />
			</p:dataTable>
			
			<p:dataTable id="supplierListTblMultiple"
					var="shortlistedSupp" 
					widgetVar="shortlistedSuppDtls"
					value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
					editable="true" rowIndexVar="index" style="width:100%;"
					rowKey="#{shortlistedSupp}"
					rendered="#{suppFinalizationBackingBean.managedBean.selectionMode == 'multiple'
								 and !suppFinalizationBackingBean.managedBean.itemRecommendByAward}">
								
				<ac:paginator for="supplierListTblMultiple" />
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:5%; white-space:normal;"/>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" style="width:9%; white-space:normal; text-align:center;"/>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumiputra.status']}" style="width:5%; white-space:normal;" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" style="width:10%; white-space:normal;"/>
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.sf.additional.information']}" style="width:15%; text-align:center;" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" style="width:10%; white-space:normal;"
		               			  rendered="#{showSelectionColumn}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" style="width:7%; white-space:normal;"/>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" style="width:7%; white-space:normal;"/>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" style="width:7%; white-space:normal;" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column style="white-space:normal;">
					<p:commandLink update=":form:suppDtlPopUp"
						action="#{suppFinalizationBackingBean.showSupplierDetails(null,null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" 
									  target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
											fn:toUpperCase(shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.proposalAmount.proposalAmt}"
						rendered="#{!suppFinalizationBackingBean.managedBean.itemize and shortlistedSupp.proposalAmount ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.offeredPrice}"
						rendered="#{suppFinalizationBackingBean.managedBean.itemize}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evalRank}" />
				</p:column>
				
				<p:column rendered="#{!empty shortlistedSupp.smMofAccount and shortlistedSupp.smMofAccount.recordStatusFlg
								  	 								eq DbValueConst.recordStatusActive}">
					<h:outputText value="#{lbl['lbl.pm.status.active']}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{empty shortlistedSupp.smMofAccount}">
					<h:outputText value="#{lbl['lbl.sm.status.expired']}"/>
				</p:column>	
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" />
	         		</p:commandLink> 
				</p:column>
				
				<p:column style="text-align: center;" rendered="#{showSelectionColumn}">
					<p:selectBooleanCheckbox id="selectAwardSupplier" value="#{shortlistedSupp.awareded}" 
						disabled="#{!(suppFinalizationBackingBean.managedBean.secretaryUser or 
										suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK) or 
											shortlistedSupp.suppSelectionDisabled or 
												suppFinalizationBackingBean.managedBean.disableSupplierSelection}"
						rendered="#{suppFinalizationBackingBean.managedBean.finalizationMethod eq 
											ParameterConst.recommendByMultipleAward or 
												suppFinalizationBackingBean.managedBean.selectedItemAlreadyAwarded}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" 
								listener="#{suppFinalizationBackingBean.selectSupplierEvent(shortlistedSupp, true)}"/>
					</p:selectBooleanCheckbox>
					
					<p:selectBooleanCheckbox id="selectShortlistSupplier" value="#{shortlistedSupp.shortListed}" 
						disabled="#{!(suppFinalizationBackingBean.managedBean.secretaryUser or 
										suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK) or 
											shortlistedSupp.suppSelectionDisabled or 
												suppFinalizationBackingBean.managedBean.disableSupplierSelection}"
						rendered="#{(suppFinalizationBackingBean.managedBean.finalizationMethod == ParameterConst.recommendByOnlineBidding or 
										suppFinalizationBackingBean.managedBean.finalizationMethod == ParameterConst.recommendByMultipleLoi) and 
											!suppFinalizationBackingBean.managedBean.selectedItemAlreadyAwarded}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" 
								listener="#{suppFinalizationBackingBean.selectSupplierEvent(shortlistedSupp, false)}"/>
					</p:selectBooleanCheckbox>
				</p:column> 
			</p:dataTable>	
			
			
			<!-- Itemized Recommend by Award (or) Single Award -->
			<p:dataTable id="itemSupplierListTblSingle"
					var="shortlistedSupp" 
					widgetVar="shortlistedSuppDtls"
					value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
					selection="#{suppFinalizationBackingBean.managedBean.recommendedSupplierByItem}"
					editable="true" rowIndexVar="index" style="width:100%"
					rowKey="#{shortlistedSupp}"
					rendered="#{suppFinalizationBackingBean.managedBean.itemize and 
									suppFinalizationBackingBean.managedBean.itemRecommendByAward}">
								
				<ac:paginator for="itemSupplierListTblSingle" />
				
				<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
					update="@([id$=itemListTbl],[id$=itemSupplierListTblSingle])" 
					listener="#{suppFinalizationBackingBean.recommendItemSupplierByAwardEvent()}"/>				
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:5%; white-space:normal;"/>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" style="width:9%; white-space:normal; text-align:center;"/>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumiputra.status']}" style="width:5%; white-space:normal;" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" style="width:10%; text-align:right;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" style="width:10%; white-space:normal;"/>
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.sf.additional.information']}" style="width:15%; text-align:center;" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" style="width:10%; white-space:normal;"
		               			  rendered="#{showSelectionColumn}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" style="width:7%; white-space:normal;"/>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" style="width:7%; white-space:normal;"/>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" style="width:7%; white-space:normal;" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column style="white-space:normal;">
					<p:commandLink update=":form:suppDtlPopUp"
						action="#{suppFinalizationBackingBean.showSupplierDetails(null,null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
												fn:toUpperCase(shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.proposalAmount.proposalAmt}"
						rendered="#{!suppFinalizationBackingBean.managedBean.itemize and shortlistedSupp.proposalAmount ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.offeredPrice}"
						rendered="#{suppFinalizationBackingBean.managedBean.itemize}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evalRank}" />
				</p:column>
				
				<p:column rendered="#{!empty shortlistedSupp.smMofAccount and shortlistedSupp.smMofAccount.recordStatusFlg
								  	 								eq DbValueConst.recordStatusActive}">
					<h:outputText value="#{lbl['lbl.pm.status.active']}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{empty shortlistedSupp.smMofAccount}">
					<h:outputText value="#{lbl['lbl.sm.status.expired']}"/>
				</p:column>	
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" />
	         		</p:commandLink> 
				</p:column>
				
				<p:column style="text-align: center;" selectionMode="single" 
					disabledSelection="#{!(suppFinalizationBackingBean.managedBean.secretaryUser or 
											suppFinalizationBackingBean.managedBean.initialDecisionFwdToBPK) or 
												shortlistedSupp.suppSelectionDisabled or 
													suppFinalizationBackingBean.managedBean.disableSupplierSelection}" 
		            rendered="#{showSelectionColumn}" />														
																
			</p:dataTable>				
		</p:outputPanel>
		<p:spacer height="20px" />
	</p:panel>

</ui:composition>
