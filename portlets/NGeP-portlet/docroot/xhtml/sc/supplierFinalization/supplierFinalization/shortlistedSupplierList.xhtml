<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:spacer height="20px" />	
	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
	
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20"
			rendered="#{(suppFinalizationBackingBean.managedBean.recommendSupplier or
						 	suppFinalizationBackingBean.managedBean.forwardToHigherAuthority) and
								!suppFinalizationBackingBean.managedBean.itemize}">
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.recommend.by']}" />
				<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
			</h:column>
			<h:column>
				<table>
					<tr>
						<td>
							<p:selectOneMenu id="recommendBy" label="#{lbl['lbl.sc.recommend.by']}"
								value="#{suppFinalizationBackingBean.managedBean.recommendBy}"
								disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
								<f:selectItems value="#{suppFinalizationBackingBean.getPackageRecommendByDropDown()}" />
								<p:ajax event="change" update="@([id$=recommendBy],[id$=onlineBiddingPanel],[id$=supplierListTblPanel])" 
									listener="#{suppFinalizationBackingBean.packageRecommendByEvent}" process="@this" />
				   			</p:selectOneMenu>
						</td>
						<td style="margin-top: -3px">
							<ac:iconTooltip value="#{lbl['lbl.sc.recommend.by.package.tooltip']}" />
						</td>
					</tr>
				</table>
			</h:column>
		</h:panelGrid>
		
		<p:outputPanel id="onlineBiddingPanel">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
					columnClasses="columnWidth20"
					rendered="#{suppFinalizationBackingBean.managedBean.onlineBidding and 
									!suppFinalizationBackingBean.managedBean.itemize}">
					<h:column>
						<p:outputLabel value="#{lbl['lbl.sc.online.bidding.endorsement']}" />
						<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
					</h:column>
					<h:column>
						<table>
							<tr>
								<td>
									<p:selectOneRadio id="biddingEndorsement" required="true" label="#{lbl['lbl.sc.online.bidding.endorsement']}"
										value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}" 
										disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
										<f:selectItems value="#{suppFinalizationBackingBean.getBiddingEndorsementRadioBtn()}" />
										<p:ajax partialSubmit="true" process="@this" update="@this"/>
						   			</p:selectOneRadio>
								</td>
								<td style="margin-top: -3px">
									<ac:iconTooltip value="#{lbl['lbl.sc.online.bidding.endorsement.tooltip']}" />
								</td>
							</tr>
						</table>
					</h:column>
			</h:panelGrid>
		</p:outputPanel>
					
		<p:spacer height="20px" />
		<p:outputPanel id="supplierListTblPanel">
		
			<p:dataTable id="supplierListTblSingle"
				var="shortlistedSupp" 
				widgetVar="shortlistedSuppDtls"
				value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
				selection="#{suppFinalizationBackingBean.managedBean.recommendedSupplier}"
				editable="true" rowIndexVar="index" style="width:100%;" rowKey="#{shortlistedSupp}"
				rendered="#{suppFinalizationBackingBean.managedBean.selectionMode == 'single'}">
				<ac:paginator for="supplierListTblSingle" />
					
				<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
					update="@([id$=supplierListTblSingle])"/>
									
				<p:ajax event="rowSelect" 
					update="@([id$=supplierListTblSingle])" process="@this" partialSubmit="true"/>					
					
				<p:ajax event="rowEdit"
					update="@([id$=supplierListTblSingle])" process="@this" partialSubmit="true"/>
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumiputra.status']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" />
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.sf.additional.information']}" style="text-align: center;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column>
					<p:commandLink update=":form:suppDtlPopUp" action="#{suppFinalizationBackingBean.showSupplierDetails(null, null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText style="width:180px; white-space:normal;" value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.proposalAmount.proposalAmt}" rendered="#{shortlistedSupp.proposalAmount ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evalRank}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
				
				<p:column rendered="#{!empty shortlistedSupp.smMofAccount and shortlistedSupp.smMofAccount.recordStatusFlg
								  	 								eq DbValueConst.recordStatusActive}">
					<h:outputText value="#{lbl['lbl.pm.status.active']}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{empty shortlistedSupp.smMofAccount}">
					<h:outputText value="#{lbl['lbl.sm.status.expired']}"/>
				</p:column>
						
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage value="/css/images/design/document.png" />
	         		</p:commandLink> 
				</p:column>
								
				<p:column style="text-align: center;" selectionMode="#{suppFinalizationBackingBean.managedBean.selectionMode}" 
					disabledSelection="#{(!suppFinalizationBackingBean.managedBean.secretaryUser) or shortlistedSupp.suppSelectionDisabled}"/> 
			</p:dataTable>
			
			<p:dataTable id="supplierListTblMultiple"
					var="shortlistedSupp" 
					widgetVar="shortlistedSuppDtls"
					value="#{suppFinalizationBackingBean.managedBean.shortlistedSupplierList}"
					editable="true" rowIndexVar="index" style="width:100%"
					rowKey="#{shortlistedSupp}"
					rendered="#{suppFinalizationBackingBean.managedBean.selectionMode == 'multiple'}">
								
				<ac:paginator for="supplierListTblMultiple" />
				
				<p:columnGroup type="header">
		        	<p:row>
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumiputra.status']}" />
		           		<p:column rowspan="2" headerText="#{lbl['lbl.sc.offered.price']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.ranking']}" />
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.mof.status']}" />
		               	<p:column colspan="3" headerText="#{lbl['lbl.sc.sf.additional.information']}" style="text-align: center;"/>
		               	<p:column rowspan="2" headerText="#{lbl['lbl.sc.selection']}" />
		           	</p:row>
		           	<p:row>
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.discipline.action.taken']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.performance']}" />
		               <p:column colspan="1" headerText="#{lbl['lbl.sc.bod']}" />
		           	</p:row>
		       	</p:columnGroup>
				
				<p:column>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.supplierNo}" />
				</p:column>
				
				<p:column>
					<p:commandLink update=":form:suppDtlPopUp"
						action="#{suppFinalizationBackingBean.showSupplierDetails(null,null)}"
						oncomplete="suppDtlWidgetVar.show();">
						<f:setPropertyActionListener value="#{shortlistedSupp}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
						<h:outputText style="width:180px; white-space:normal;" value="#{shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}"/>
					</p:commandLink>
				</p:column>
	
				<p:column>
					<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
				</p:column>
				
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.proposalAmount.proposalAmt}"
						rendered="#{!suppFinalizationBackingBean.managedBean.itemize and shortlistedSupp.proposalAmount ne null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<h:outputText value="#{shortlistedSupp.qtEvaluationResult.offeredPrice}"
						rendered="#{suppFinalizationBackingBean.managedBean.itemize}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="text-align:right;">
					<h:outputText value="#{shortlistedSupp.evalRank}" />
				</p:column>
				
				<p:column rendered="#{!empty shortlistedSupp.smMofAccount and shortlistedSupp.smMofAccount.recordStatusFlg
								  	 								eq DbValueConst.recordStatusActive}">
					<h:outputText value="#{lbl['lbl.pm.status.active']}"/>							  	 
				</p:column>
				
				<p:column style="background-color:red; color:white; font-weight:bold;" 
						  rendered="#{empty shortlistedSupp.smMofAccount}">
					<h:outputText value="#{lbl['lbl.sm.status.expired']}"/>
				</p:column>	
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<h:outputText value="" />
				</p:column>
				
				<p:column>
					<p:commandLink action="#{suppFinalizationBackingBean.showBoardofDirectors(
											 shortlistedSupp.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier)}" 
		         		update="@([id$=bodDetails])" oncomplete="bodDetailsDialog.show();">
						<p:graphicImage value="/css/images/design/document.png" />
	         		</p:commandLink> 
				</p:column>
				
				<p:column style="text-align: center;">
					<p:selectBooleanCheckbox id="selectAwardSupplier" 
						value="#{shortlistedSupp.awareded}" 
						disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser or shortlistedSupp.suppSelectionDisabled}"
						rendered="#{suppFinalizationBackingBean.managedBean.recommendBy != ParameterConst.recommendByOnlineBidding and 
													suppFinalizationBackingBean.managedBean.recommendBy != ParameterConst.recommendByMultipleLoi}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" 
								listener="#{suppFinalizationBackingBean.selectSupplierEvent(shortlistedSupp, true)}"/>
					</p:selectBooleanCheckbox>
					
					<p:selectBooleanCheckbox id="selectShortlistSupplier" 
						value="#{shortlistedSupp.shortListed}" 
						disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser or shortlistedSupp.suppSelectionDisabled}"
						rendered="#{suppFinalizationBackingBean.managedBean.recommendBy == ParameterConst.recommendByOnlineBidding or 
													suppFinalizationBackingBean.managedBean.recommendBy == ParameterConst.recommendByMultipleLoi}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=supplierListTblMultiple])" 
								listener="#{suppFinalizationBackingBean.selectSupplierEvent(shortlistedSupp, false)}"/>
					</p:selectBooleanCheckbox>
				</p:column> 
			</p:dataTable>	
		</p:outputPanel>
		<p:spacer height="20px" />
	</p:panel>

</ui:composition>
