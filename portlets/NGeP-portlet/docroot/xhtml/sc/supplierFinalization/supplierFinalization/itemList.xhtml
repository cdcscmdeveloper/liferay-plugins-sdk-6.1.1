
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style type="text/css">
		.ui-datatable-data .ui-widget-content {
			border: 0px !important;
			border-bottom: 0px !important;
		}
	</style>

	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<p:outputPanel id="itemOnlineBiddingPanel">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
						columnClasses="columnWidth20"
						rendered="#{suppFinalizationBackingBean.managedBean.onlineBidding and suppFinalizationBackingBean.managedBean.itemize}">
						<h:column>
							<p:outputLabel value="#{lbl['lbl.sc.online.bidding.endorsement']}" />
							<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory"/>
						</h:column>
						<h:column>
							<table>
								<tr>
									<td>
										<p:selectOneRadio id="itemBiddingEndorsement" required="true" label="#{lbl['lbl.sc.online.bidding.endorsement']}"
											value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}" 
											disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
											<f:selectItems value="#{suppFinalizationBackingBean.getBiddingEndorsementRadioBtn()}" />
											<p:ajax partialSubmit="true" process="@this" update="@this"></p:ajax>
							   			</p:selectOneRadio>
									</td>
									<td style="margin-top: -3px">
										<ac:iconTooltip value="#{lbl['lbl.sc.online.bidding.endorsement.tooltip']}" />
									</td>
								</tr>
							</table>
						</h:column>
				</h:panelGrid>
				<p:spacer height="10px" rendered="#{suppFinalizationBackingBean.managedBean.onlineBidding}"/>
		</p:outputPanel>	
		
		<p:dataTable id="itemListTbl" var="item"
			value="#{suppFinalizationBackingBean.managedBean.itemList}"
			rows="10" rowKey="#{item.qtRecommendId}" rowIndexVar="rowIndex" selectionMode="single">
			<ac:paginator for="itemListTbl" />

			<p:ajax event="rowSelect" 
				listener="#{suppFinalizationBackingBean.selectItemEvent}"
				update="@([id$=itemListTbl],[id$=supplierPanel],[id$=awardSupplier],[id$=supplierListTblPanel])"></p:ajax>
				
			<p:ajax event="rowUnselect" 
				listener="#{suppFinalizationBackingBean.unselectItemEvent}"
				update="@([id$=itemListTbl],[id$=supplierPanel],[id$=awardSupplier],[id$=supplierListTblPanel])"></p:ajax>
				
			<p:column style="width:2%;" rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk" value="#{suppFinalizationBackingBean.managedBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=awardSupplier],[id$=supplierListTblPanel])"
								listener="#{suppFinalizationBackingBean.selectAllItems(suppFinalizationBackingBean.managedBean.selectAll)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox id="selectItem" value="#{item.selected}" disabled="#{item.awardedItem}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=awardSupplier],[id$=supplierListTblPanel])" 
							listener="#{suppFinalizationBackingBean.selectItemEvent(item)}"/>
				</p:selectBooleanCheckbox>
			</p:column>
 
			<p:column headerText="#{lbl['lbl.sc.item']}">
				<h:outputText value="#{item.requestItem.itemName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.item.type']}">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(item.requestItem.itemType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.uom']}">
				<h:outputText value="#{item.requestItem.uom.uomName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.price.type']}">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.recommend.by']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.recommend.by.item.tooltip']}" />
				</f:facet>
				<p:selectOneMenu id="recommendByItem" value="#{item.recommendByStr}" 
						required="false" label="#{lbl['lbl.sc.recommend.by']}" 
						disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser or item.disabled or item.awardedItem}">
						<f:selectItems value="#{suppFinalizationBackingBean.getItemRecommendByDropDown(
														item.requestItem.tplSpecQuestion.clPriceTypeCode, item)}" />
						<p:ajax event="change" update="@([id$=itemListTbl],[id$=supplierPanel],[id$=itemOnlineBiddingPanel])" 
								listener="#{suppFinalizationBackingBean.itemRecommendByEvent(item)}"
								process="@this" partialSubmit="true"/>
	   			</p:selectOneMenu>
			</p:column>
			
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.recommended.supplier']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.recommended.supplier.tooltip']}" />
				</f:facet>
				<p:outputPanel id="selectedSupplierListTbl" rendered="#{!empty item.recommendDtls}">
								
					<div class="datalist-noborder">
						<p:dataList var="recommendDetail" value="#{item.recommendDtls}" type="none">								   
							<p:column rendered="#{recommendDetail.recordStatusFlg == DbValueConst.recordStatusActive}">
								<p:commandLink update="@([id$=suppDtlPopUp])"
									action="#{suppFinalizationBackingBean.showSupplierDetails(item, recommendDetail)}"
									oncomplete="suppDtlWidgetVar.show();">
									<h:outputText value="#{recommendDetail.supplier.companyName}" />
								</p:commandLink>
								<br/>
							</p:column>
						</p:dataList>
					</div>
				</p:outputPanel>	
			</p:column>

			<p:column style="text-align: right;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.quantity']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.sf.awarded.quantity.tooltip']}" />
				</f:facet>
				<p:outputPanel id="quantityListTbl"  rendered="#{ (item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard or
										item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard) and 
										item.recommendByStr == ParameterConst.recommendByMultipleAward }">
					<h:outputText value="#{lbl['lbl.sc.max.quantity']}" style="text-align: right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.requestItem.uom.uomCode)}" />
					</h:outputText>[
					<h:outputText value="#{item.requestItem.quantity}" style="text-align: right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.requestItem.uom.uomCode)}" />
					</h:outputText>]									
					<div class="datalist-quantity">
						<p:dataList var="rdetail" value="#{item.recommendDtls}" type="none">						
							<p:column>
								<h:inputText value="#{rdetail.awardQty}" maxlength="13" size="10" required="true" 
											 style="text-align:right; width:120px;" label="#{lbl['lbl.sc.quantity']}" 
											 disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser or item.disabled or item.awardedItem}"
											 rendered="#{rdetail.recordStatusFlg == DbValueConst.recordStatusActive}">
									<p:ajax partialSubmit="true" process="@this" update="@this"/>
									<p:ajax event="blur" partialSubmit="true" process="@this" update="@([id$=supplierListTblMultiple])" 
											listener="#{suppFinalizationBackingBean.updateOfferedPrice(rdetail)}"/>
									<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, 
														item.requestItem.uom.uomCode)}" maxIntegerDigits="10" maxFractionDigits="3"/>								
								</h:inputText>
								<br/>
							</p:column>
						</p:dataList>
					</div>
				</p:outputPanel>
				
				<h:outputText value="#{item.requestItem.quantity}" style="text-align: right;"
					rendered="#{(item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard or
									item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard) and
										item.recommendByStr != ParameterConst.recommendByMultipleAward}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.requestItem.uom.uomCode)}" />		
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.req.higher.authority']}" 
					  rendered="#{suppFinalizationBackingBean.managedBean.forwardToHigherAuthority}">
				<p:selectBooleanCheckbox value="#{item.higherAuthReq}" disabled="#{item.disabled or item.awardedItem}">
					<p:ajax partialSubmit="true" process="@this" update="@this"/>
				</p:selectBooleanCheckbox>				
			</p:column>		
						
		</p:dataTable>
		
		<p:spacer height="5px"></p:spacer>
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20">
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.award.supplier']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu id="awardSupplier" value="#{suppFinalizationBackingBean.managedBean.awardSupplier}" 
					disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems value="#{suppFinalizationBackingBean.getAwardSupplierListDropDown()}" />
					<p:ajax event="change" listener="#{suppFinalizationBackingBean.selectSupplierDropDownEvent}" process="@this" update="@this"/>
	   			</p:selectOneMenu>
				
				<p:commandButton value="#{lbl['lbl.btn.apply.to.all']}" 
					process="@this"
					partialSubmit="true"
					action="#{suppFinalizationBackingBean.awardSupplierEvent}" 
					update="@([id$=itemListTbl],[id$=supplierListTblMultiple],[id$=awardSupplier])"
					rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}"/>
			</h:column>
			
		</h:panelGrid>
	</p:panel>

</ui:composition>
