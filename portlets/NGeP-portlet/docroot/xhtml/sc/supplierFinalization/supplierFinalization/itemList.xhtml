<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style type="text/css">
		.ui-datatable-data .ui-widget-content {
			border: 0px !important;
			border-bottom: 0px !important;
		}
	</style>
	<br/>
	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.select.item.instruction']} "
				escape="false" />
				
		<p:dataTable id="itemListTbl" var="item"
			value="#{suppFinalizationBackingBean.managedBean.itemList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" rowKey="#{item.qtRecommendId}" rowIndexVar="rowIndex" selectionMode="single">
			<ac:paginator for="itemListTbl" />

			<p:ajax event="rowSelect" listener="#{suppFinalizationBackingBean.selectItemEvent}" 
				update="@([id$=itemListTbl],[id$=supplierPanel],[id$=awardSupplier],[id$=supplierListTblPanel])" 
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"></p:ajax>
				
			<p:ajax event="rowUnselect" listener="#{suppFinalizationBackingBean.unselectItemEvent}" 
				update="@([id$=itemListTbl],[id$=supplierPanel],[id$=awardSupplier],[id$=supplierListTblPanel])"></p:ajax>
				
			<p:column styleClass="td-check-box-spacing" rendered="#{isSecretaryUser or 
													 				isBPKTaskAndClaimed}">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk" value="#{suppFinalizationBackingBean.managedBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=awardSupplier],[id$=supplierListTblPanel])"
								listener="#{suppFinalizationBackingBean.selectAllItems(suppFinalizationBackingBean.managedBean.selectAll)}" 
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox id="selectItem" value="#{item.selected}" 
							disabled="#{item.awardedItem or item.disabled or item.cancelled}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=itemListTbl],[id$=awardSupplier],[id$=supplierListTblPanel])" 
							listener="#{suppFinalizationBackingBean.selectItemEvent(item)}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				</p:selectBooleanCheckbox>
			</p:column>
 
			<p:column headerText="#{lbl['lbl.sc.item']}" style="width:20%; white-space:normal;">
				<h:outputText value="#{item.requestItem.itemName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.item.type']}" style="width:5%;">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(item.requestItem.itemType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.uom']}" style="width:5%;">
				<h:outputText value="#{item.requestItem.uom.uomName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.price.type']}" style="width:5%;">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
			</p:column>

			<p:column style="width:5%; white-space:normal;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.cancelled']}" />
				</f:facet>
				<h:selectOneMenu value="#{item.cancelled}" 
						required="true" label="#{lbl['lbl.sc.cancelled']}" 
						disabled="#{item.disabled or item.awardedItem or 
									!(isSecretaryUser or 
										isBPKTaskAndClaimed)}" 
						style="width:95%;">
						<f:selectItems value="#{suppFinalizationBackingBean.getItemCancellationDropDown(item)}" />
						<p:ajax event="change" update="@([id$=itemListTbl],[id$=supplierPanel])" 
								listener="#{suppFinalizationBackingBean.itemCancellationEvent(item)}"
								process="@this" partialSubmit="true"/>
	   			</h:selectOneMenu>
			</p:column>
			
			<p:column style="width:10%;white-space:normal;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.recommended.supplier']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.recommended.supplier.tooltip']}" />
				</f:facet>
				<p:outputPanel id="selectedSupplierListTbl" rendered="#{not empty item.selectedSuppliers}">
								
					<div class="datalist-noborder">
						<p:dataList var="supplierCode" value="#{suppFinalizationBackingBean.getSupplierCodes(item)}" type="none">								   
							<p:column>
								<p:commandLink oncomplete="suppDetailsPopup.show(); return false;" process="@this" 
							     			   update="@([id$=suppDetailsPopupId])">
								     <f:setPropertyActionListener value="#{item.selectedSuppliers.get(supplierCode)}" 
								      							  target="#{supplierDetailBackingBean.smSupplier}" />
								     <h:outputText value="#{supplierCode}" />
							    </p:commandLink>								
								<br/>
							</p:column>
						</p:dataList>
					</div>
				</p:outputPanel>	
			</p:column>

			<p:column style="text-align:right; width:7%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.quantity']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.sf.awarded.quantity.tooltip']}" />
				</f:facet>
				<h:outputText value="#{item.orderQty}" style="text-align: right;"
					rendered="#{ (item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard or
									item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard) and
										(finalizationMethod != ParameterConst.recommendByMultipleAward or 
											(item.awardedItem and item.activeSupplierCount lt 2)) }">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(
													CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.requestItem.uom.uomCode)}" />		
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.req.higher.authority']}" styleClass="td-check-box-spacing" 
					  rendered="#{suppFinalizationBackingBean.managedBean.forwardToHigherAuthority}">
				<p:selectBooleanCheckbox value="#{item.higherAuthReq}" disabled="#{!isSupplierFinalization or item.cancelled or 
					item.disabled or item.awardedItem or (item.higherAuthReq and 
					suppFinalizationBackingBean.managedBean.scQtFinalization.higherSecretary.userId eq 
						suppFinalizationBackingBean.managedBean.loggedInUserId)}">
					<p:ajax partialSubmit="true" process="@this" update="@this"/>
				</p:selectBooleanCheckbox>				
			</p:column>		
						
		</p:dataTable>
		
		<p:spacer height="5px"></p:spacer>
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="1"
			columnClasses="columnWidth20">
			<h:column>
				<p:commandButton value="#{lbl['lbl.btn.apply.to.all']}"
					process="@this" partialSubmit="true" 
					actionListener="#{suppFinalizationBackingBean.getShortlistedCommomSupplier}"
					oncomplete="commomSuppPopUp.show();" update="@([id$=commomSuppPopUpId])"  
					disabled="#{!(isSecretaryUser or isBPKTaskAndClaimed)}" style="float:right;"/>
			</h:column>

		</h:panelGrid>
		
	</p:panel>

</ui:composition>
