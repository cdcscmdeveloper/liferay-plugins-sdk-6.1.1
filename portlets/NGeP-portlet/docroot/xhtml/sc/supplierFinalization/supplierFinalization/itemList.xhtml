
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style type="text/css">
		.datalist-noborder .ui-widget-content {
			border: 0;
			background: none;
		}
		
		.datalist-quantity .ui-widget-content {
			border: 0;
			background: none;
			width:80px;
		}
	</style>

	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<p:dataTable id="itemListTbl" var="item"
			value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtRecommends}"
			rows="10"
			selection="#{suppFinalizationBackingBean.managedBean.selectedRecommendList}"
			rowKey="#{item.qtRecommendId}" rowIndexVar="rowIndex">
			<ac:paginator for="itemListTbl" />
			
			<p:ajax event="rowSelect" 
				listener="#{suppFinalizationBackingBean.selectItemEvent}"
				update="@([id$=supplierPanel])" />
				
			<p:ajax event="rowSelectCheckbox" 
				listener="#{suppFinalizationBackingBean.selectItemEvent}"
				update="@([id$=supplierPanel])" />
				
			<p:ajax event="rowUnselect"
				listener="#{suppFinalizationBackingBean.unselectItemEvent}"
				update="@([id$=supplierPanel])"></p:ajax>
				
			<p:ajax event="rowUnselectCheckbox"
				listener="#{suppFinalizationBackingBean.unselectItemEvent}"
				update="@([id$=supplierPanel])"></p:ajax>

			<p:column selectionMode="multiple" style="width:2%" /> 
			<p:column headerText="#{lbl['lbl.sc.item']}">
				<h:outputText value="#{item.requestItem.itemName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.item.type']}">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(item.requestItem.itemType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.uom']}">
				<h:outputText value="#{item.requestItem.uom.uomName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.price.type']}">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.recommend.by']}">
				<h:column>
					<p:selectOneMenu id="recommendByItem" value="#{item.recommendBy.parameterCode}">
						<f:selectItems value="#{suppFinalizationBackingBean.getItemRecommendByDropDown(item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
						<p:ajax event="change" 
							update="@([id$=itemListTbl],[id$=supplierPanel])"
							listener="#{suppFinalizationBackingBean.itemRecommendByEvent(item)}"
							process="@this" partialSubmit="true"/>
	   				</p:selectOneMenu>	
				</h:column>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.recommended.supplier']}">
				<p:outputPanel id="selectedSupplierListTbl" rendered="#{!empty item.awardSupplierList}">
								
					<div class="datalist-noborder">
						<p:dataList   
							var="supplier"
							value="#{item.awardSupplierList}" >
							
							<p:column>
								<p:commandLink update="@([id$=suppDtlPopUp])"
									action="#{suppFinalizationBackingBean.supplier}"
									oncomplete="suppDtlWidgetVar.show();">
									<f:setPropertyActionListener value="#{supplier}" target="#{suppFinalizationBackingBean.managedBean.shortlistedSupplier}" />
									<h:outputText value="#{supplier.scQtProposal.scQtSupplier.smSupplier.companyName}" />
								</p:commandLink>
							</p:column>
						</p:dataList>
					</div>
				</p:outputPanel>	
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.quantity']}">
				<p:outputPanel id="quantityListTbl"  rendered="#{item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard 
								and item.recommendBy.parameterCode == ParameterConst.recommendByMultipleAward}">
					<div class="datalist-quantity">
						<p:dataList 
							var="qty"
							value="#{item.awardSupplierList}">
							<p:column>
								<h:inputText value="#{qty.qtyAward}" maxlength="6" size="10"/>
							</p:column>
						</p:dataList>
					</div>
				</p:outputPanel>
				
				<h:outputText value="#{item.requestItem.quantity}" 
					rendered="#{item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard 
							and item.recommendBy.parameterCode != ParameterConst.recommendByMultipleAward}"/>
			</p:column>
		</p:dataTable>
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20">
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.award.supplier']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu id="awardSupplier" value="#{suppFinalizationBackingBean.managedBean.awardSupplier}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems value="#{suppFinalizationBackingBean.getAwardSupplierListDropDown()}" />
					<p:ajax event="change" listener="#{suppFinalizationBackingBean.selectSupplierDropDownEvent}" process="@this" />
	   			</p:selectOneMenu>
				
				<p:commandButton value="#{lbl['lbl.btn.apply']}" 
					process="@this"
					partialSubmit="true"
					action="#{suppFinalizationBackingBean.awardSupplierEvent}" 
					icon="ui-icon-check" 
					update="@([id$=itemListTbl],[id$=supplierListTblMultiple])"/>
			</h:column>
			
		</h:panelGrid>
	</p:panel>

</ui:composition>
