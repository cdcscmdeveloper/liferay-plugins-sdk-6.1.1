
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20" >
		<h:column>
			<p:outputLabel value="#{lbl['lbl.sc.recomend.type']}" />
		</h:column>
		<h:column>
			<h:outputText value="#{suppFinalBiddingBackingBean.getParameterDesc(suppFinalBiddingBackingBean.managedBean.scQtFinalization.recommendedTypeId)}"/>
		</h:column>
	</h:panelGrid>
	<p:spacer height="10"></p:spacer>

	<p:outputPanel id="itemPanel" 
		rendered="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode == 'I'}">
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemSummary.xhtml"></ui:include>
	</p:outputPanel>

	<p:outputPanel id="packagePanel" 
		rendered="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode == 'P'}">
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/packageSummary.xhtml"></ui:include>
	</p:outputPanel>
	
</ui:composition>
