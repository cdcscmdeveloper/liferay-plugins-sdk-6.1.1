
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style type="text/css">
		<c:if test="#{suppFinalBiddingBackingBean.managedBean.scQt.zonal}">
			.tdWidth: { 80%; }
		</c:if>
		<c:if test="#{!suppFinalBiddingBackingBean.managedBean.scQt.zonal}">
			.tdWidth: { 100%; }
		</c:if>		
	</style>	
	
	<ui:include src="/xhtml/sc/common/supplierDetailsPopup.xhtml" />
	
	<h:panelGrid border="0" cellpadding="0" cellspacing="0" style="width:100%;" styleClass="header-spacing">
		<h:column>
			<p:outputLabel value="#{lbl['lbl.sc.recomend.type']}" style="float:left; margin-left:15%;"/>
			<p:spacer width="4px"/>
			<h:outputText value="#{suppFinalBiddingBackingBean.getParameterDesc(
									suppFinalBiddingBackingBean.managedBean.scQtFinalization.recommendedTypeId)}"/>			
		</h:column>
	</h:panelGrid>
	
	<p:outputPanel id="itemSupplierPanel">
		<table style="border: 0px;width:100%;">
			<tr>
				<c:if test="#{suppFinalBiddingBackingBean.managedBean.scQt.zonal}">
					<td width="20%" class="sidemenutd" valign="top">
						<p:remoteCommand name="onZoneTabChangeAction" update="@([id$=zonalMenu],[id$=itemPanel],[id$=packagePanel])" 
										 partialSubmit="true" process="@this" action="#{suppFinalBiddingBackingBean.onZoneTabChangeAction}" />
						
						<p:tabMenu styleClass="sidemenu" id="zonalMenu" 
							activeIndex="#{suppFinalBiddingBackingBean.managedBean.zoneActiveIndex}"
							model="#{suppFinalBiddingBackingBean.managedBean.zoneMenuModel}">
							<!-- Menu items are dynamically populated from backing bean -->
						</p:tabMenu>						
					</td>
				</c:if>
				
				<td class="tdWidth" valign="top">
					<h:panelGroup id="itemPanel" 
						rendered="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode == 'I'}">
						<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemSummary.xhtml" />
					</h:panelGroup>
					<h:panelGroup id="packagePanel" 
						rendered="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode == 'P'}">
						<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/packageSummary.xhtml" />
					</h:panelGroup>
				</td>
			</tr>
		</table>	
	</p:outputPanel>	

</ui:composition>
