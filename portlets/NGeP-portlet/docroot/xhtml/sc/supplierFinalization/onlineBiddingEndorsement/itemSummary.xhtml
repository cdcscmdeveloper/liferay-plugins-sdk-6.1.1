
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.item.details']}" toggleable="true">
		<p:dataTable id="itemListTbl" var="item"
			value="#{suppFinalBiddingBackingBean.managedBean.biddingItemList}"
			rows="10"
			selection="#{suppFinalBiddingBackingBean.managedBean.selectedBiddingItem}"
			rowKey="#{item}" rowIndexVar="rowIndex" style="width:100%"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selectionMode="single">
			<ac:paginator for="itemListTbl" />

			<p:ajax event="rowSelect" listener="#{suppFinalBiddingBackingBean.selectBiddingItem}" update="@([id$=supplierItemTbl])" />

			<p:column headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText value="#{item.scRequestItem.itemName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.uom']}">
				<h:outputText value="#{item.scRequestItem.uom.uomName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.quantity']}">
				<h:outputText value="#{item.qty}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, 
													item.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bidding.schedule.status']}">
				<ui:param name="isCancelled" value="#{item.scBidSchedule.pmStatus.statusId 
															== BidStatusConst.bidCancelled}"/>
				
				<h:outputText value="#{suppFinalBiddingBackingBean.getStatusDescById(
												item.scBidSchedule.pmStatus.statusId)}" 
							  style="color: red;" rendered="#{isCancelled}" />
				<h:outputText value="#{suppFinalBiddingBackingBean.getStatusDescById(
												item.scBidSchedule.pmStatus.statusId)}" 
							  rendered="#{!isCancelled}" />	
			</p:column>	
					
		</p:dataTable>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true">
		<p:dataTable id="supplierItemTbl" var="itemSupplier"
			value="#{suppFinalBiddingBackingBean.managedBean.bidItemSuppliers}"
			rows="10" rowKey="#{itemSupplier}" rowIndexVar="rowIndex" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{suppFinalBiddingBackingBean.managedBean.selectedBidItemBean}">
			<ac:paginator for="supplierItemTbl" />
			
			<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
					update="@([id$=supplierItemTbl])" 
					listener="#{suppFinalBiddingBackingBean.awardSupplierEvent}"/>				
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<h:outputText value="#{itemSupplier.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
							   process="@this" update="@([id$=suppDetailsPopupId])" 
							   style="float:right;">
					<f:setPropertyActionListener value="#{itemSupplier.supplier}"
							target="#{supplierDetailBackingBean.smSupplier}" />
					<h:outputText value="#{itemSupplier.supplierCode}" />
				</p:commandLink>				
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText value="#{(itemSupplier.bumi) ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.starting.price']}">
				<h:outputText style="float: right;" value="#{suppFinalBiddingBackingBean.getCalculatedTotalAmount(itemSupplier.startingPrice)}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.last.bid.price']}">
				<div style="align: right">
					<h:outputText style="float: right;" rendered="#{!(itemSupplier.startingPrice eq itemSupplier.bidPrice)}"
						 value="#{suppFinalBiddingBackingBean.getCalculatedTotalAmount(itemSupplier.bidPrice)}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</div>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">
				<h:outputText style="float: right;" rendered="#{itemSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable 
																and (itemSupplier.startingPrice ne itemSupplier.bidPrice)}" 
					value="#{suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice - 
										suppFinalBiddingBackingBean.getCalculatedTotalAmount(itemSupplier.bidPrice)}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.cost.saving']}">
				<h:outputText style="float: right;" 
					value="#{suppFinalBiddingBackingBean.managedBean.selectedBiddingItem.estimatedCost - itemSupplier.bidPriceTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.selection']}" style="width:10%;" 
					  styleClass="td-check-box-spacing" selectionMode="single" 
					  rendered="#{!suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}" 
					  disabledSelection="#{(suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  							suppFinalBiddingBackingBean.managedBean.readOnly) or 
					  						 		(!suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  									!suppFinalBiddingBackingBean.managedBean.secretaryUser)}" />				
		</p:dataTable>
	</p:panel>

</ui:composition>
