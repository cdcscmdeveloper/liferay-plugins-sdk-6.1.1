
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.item.details']}" toggleable="true">
		<p:dataTable id="itemListTbl" var="item"
			value="#{suppFinalBiddingBackingBean.managedBean.biddingItemList}"
			rows="10"
			selection="#{suppFinalBiddingBackingBean.managedBean.selectedBiddingItem}"
			rowKey="#{item}" rowIndexVar="rowIndex" style="width:100%"
			emptyMessage="#{lbl['lbl.sc.supplier.finalization.sorttable.msg.no.records.found']}"
			selectionMode="single">
			<ac:paginator for="itemListTbl" />

			<p:ajax event="rowSelect" listener="#{suppFinalBiddingBackingBean.selectBiddingItem}" update="@([id$=supplierItemTbl])" />

			<p:column headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText value="#{item.scRequestItem.itemName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.uom']}">
				<h:outputText value="#{item.scRequestItem.uom.uomName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.quantity']}">
				<h:outputText value="#{item.qty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, 
													item.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bidding.schedule.status']}">
				<ui:param name="isCancelled" value="#{item.scBidSchedule.pmStatus.statusId 
															== BidStatusConst.BID_CANCELLED}"/>
				
				<h:outputText value="#{suppFinalBiddingBackingBean.getStatusDescById(
												item.scBidSchedule.pmStatus.statusId)}" 
							  style="color: red;" rendered="#{isCancelled}" />
				<h:outputText value="#{suppFinalBiddingBackingBean.getStatusDescById(
												item.scBidSchedule.pmStatus.statusId)}" 
							  rendered="#{!isCancelled}" />	
			</p:column>	
					
		</p:dataTable>
	</p:panel>
	
	<h:outputText styleClass="instruction" escape="false" rendered="#{suppFinalBiddingBackingBean.managedBean.displayReviseInstrn}"
			value="#{lbl['lbl.sc.sf.meeting.decision.instrn']}" />
			
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sf.finalization.supplier.selection.bumistatus.instruction']} "
			escape="false" />
		<h:outputText styleClass="instruction"
			value="#{suppFinalBiddingBackingBean.managedBean.scQt.closingDate}">
			<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
		</h:outputText>	
		<ui:remove>21692 - Start</ui:remove>
		<br/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.qt.pending.finalization.instruction']} " escape="false" />
		<ui:remove>21692 - End</ui:remove>
		<p:dataTable id="supplierItemTbl" var="itemSupplier"
			value="#{suppFinalBiddingBackingBean.managedBean.bidItemSuppliers}"
			rows="10" rowKey="#{itemSupplier}" rowIndexVar="rowIndex" 
			emptyMessage="#{lbl['lbl.sc.supplier.finalization.sorttable.msg.no.records.found']}"
			selection="#{suppFinalBiddingBackingBean.managedBean.selectedBidItemBean}">
			<ac:paginator for="supplierItemTbl" />
			
			<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
					update="@([id$=supplierItemTbl])" 
					listener="#{suppFinalBiddingBackingBean.awardSupplierEvent}"/>				
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}" style="text-align:center;">
				<h:outputText value="#{itemSupplier.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="text-align:center;">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
							   process="@this" update="@([id$=suppDetailsPopupId])">
					<f:setPropertyActionListener value="#{itemSupplier.scQtProposal}"
							   target="#{supplierDetailBackingBean.scQtProposal}" />
					<h:outputText value="#{itemSupplier.scQtProposal.supplierNo}" />
				</p:commandLink>				
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText value="#{(itemSupplier.bumi) ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			<ui:remove>26247 - start</ui:remove>
			<ui:param name="supplier" value="#{itemSupplier.supplier}" />
			<ui:param name="mofExpired"
				value="#{supplier.smMofAccount == null or supplier.smMofAccount.recordStatusFlg eq ParameterConst.getRecordStatusExpired()}" />
			<p:column styleClass="#{mofExpired ? 'red-background':''}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.mof.status']}" />
				</f:facet>
				<h:outputText
					value="#{suppFinalBiddingBackingBean.evaluateMOFStatus(supplier.smMofAccount)}" />
			</p:column>
			<p:column style="white-space:normal;width:18%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.discipline.action.taken']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" />
				</f:facet>
				<ac:disciplinaryActionYesNo
					supplier="#{supplier}" index="#{rowIndex}"/>
			</p:column>
			<ui:remove>26247 - end</ui:remove>

			<p:column headerText="#{lbl['lbl.sc.starting.price']}" style="text-align: right;">
				<h:outputText value="#{suppFinalBiddingBackingBean.getCalculatedTotalAmount(itemSupplier.startingPrice)}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.last.bid.price']}" style="text-align: right;">
					<h:outputText rendered="#{!(itemSupplier.startingPrice eq itemSupplier.bidPrice)}"
						 value="#{suppFinalBiddingBackingBean.getCalculatedTotalAmount(itemSupplier.bidPrice)}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}" style="text-align: right;">
				<h:outputText rendered="#{itemSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable 
																and (itemSupplier.startingPrice ne itemSupplier.bidPrice)}" 
					value="#{suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice - 
										suppFinalBiddingBackingBean.getCalculatedTotalAmount(itemSupplier.bidPrice)}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.cost.saving']}" style="text-align: right;">
				<h:outputText value="#{suppFinalBiddingBackingBean.managedBean.selectedBiddingItem.estimatedCost - itemSupplier.bidPriceTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<ui:remove>
				31101 - Added Disciplinary Action validation
			</ui:remove>
			<ui:remove>26247 - start</ui:remove>
			<ui:param name="isDisciplinaryAction" value="#{suppFinalBiddingBackingBean.disabledQTProcess(itemSupplier.supplier)}"/>
			
			<p:column headerText="#{lbl['lbl.sc.selection']}" style="width:10%;" 
					  styleClass="td-check-box-spacing" selectionMode="single" 
					  rendered="#{!suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}" 
					  disabledSelection="#{!isMofSelection and ((suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  							suppFinalBiddingBackingBean.managedBean.readOnly) or 
					  						 		(!suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  									!suppFinalBiddingBackingBean.managedBean.secretaryUser) or isDisciplinaryAction) or
					  									suppFinalBiddingBackingBean.supplierRejectEPV(itemSupplier.scQtProposal)}" />
			<ui:remove>21692</ui:remove>
			<ui:remove>26247 - end - add isDisciplinaryAction</ui:remove>							
		</p:dataTable>
	</p:panel>

</ui:composition>
