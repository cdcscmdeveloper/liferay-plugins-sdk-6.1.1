<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection"/>
	
	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
		
		<p:panel>
			<ui:include src="/xhtml/sc/supplierFinalization/suppFinalizationHeader.xhtml" />
			
			<p:tabView dynamic="true" cache="true" orientation="left">
				<p:ajax event="tabChange" listener="#{suppFinalizationBackingBean.onTabChangeAction}" immediate="true" />
	
				<p:tab title="#{lbl['lbl.sc.meeting.details']}" >
					<ui:include src="/xhtml/sc/supplierFinalization/preparation/meetingDtls.xhtml"></ui:include>
				</p:tab>
	
				<p:tab title="#{lbl['lbl.sc.committee.b']}" >
					<ui:include src="/xhtml/sc/supplierFinalization/preparation/committeeDtls.xhtml"></ui:include>
				</p:tab>
	
				<p:tab title="#{lbl['lbl.sc.join.in']}">
					<ui:include src="/xhtml/sc/supplierFinalization/preparation/meetingAttendanceDtls.xhtml"></ui:include>
				</p:tab>
	
			</p:tabView>
		</p:panel>
	</ui:define>
	
	<ui:define name="footerSection"/>
	
</ui:composition>
