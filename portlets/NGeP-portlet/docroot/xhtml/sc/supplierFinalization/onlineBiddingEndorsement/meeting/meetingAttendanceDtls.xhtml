<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.join.in']}" toggleable="true"
			 id="attendeesPanel">
		<p:dataTable id="meetingAttDtlTbl" var="meetingAttDtl"
			value="#{suppFinalBiddingBackingBean.managedBean.meetingAttendanceList}"
			rows="10" rowKey="#{meetingAttDtl}" rowIndexVar="rowIndex"
			selection="#{suppFinalBiddingBackingBean.managedBean.selectedMeetingAttList}">
			<ac:paginator for="meetingAttDtlTbl" />

			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{suppFinalBiddingBackingBean.managedBean.secretaryUser}"></p:column>

			<p:ajax event="toggleSelect"
				update="@([id$=meetingAttDtlTbl],[id$=attdDelBtn])" process="@this"
				partialSubmit="true" />
			<p:ajax event="rowSelect"
				update="@([id$=meetingAttDtlTbl],[id$=attdDelBtn])" process="@this"
				partialSubmit="true" />
			<p:ajax event="rowSelectCheckbox"
				update="@([id$=meetingAttDtlTbl],[id$=attdDelBtn])" process="@this"
				partialSubmit="true" />
			<p:ajax event="rowUnselect"
				update="@([id$=meetingAttDtlTbl],[id$=attdDelBtn])" process="@this"
				partialSubmit="true" />
			<p:ajax event="rowUnselectCheckbox"
				update="@([id$=meetingAttDtlTbl],[id$=attdDelBtn])" process="@this"
				partialSubmit="true" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<h:inputText value="#{meetingAttDtl.name}" maxlength="50" size="50"
					required="true" label="#{lbl['lbl.sc.name']}"
					disabled="#{!suppFinalBiddingBackingBean.managedBean.secretaryUser}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}">
				<h:inputText value="#{meetingAttDtl.icPassport}" maxlength="15"
					size="15" required="true"
					label="#{lbl['lbl.sc.identification.no']}"
					disabled="#{!suppFinalBiddingBackingBean.managedBean.secretaryUser}" />
			</p:column>
		</p:dataTable>

		<p:spacer height="10px"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,meetingAttDtlTbl" partialSubmit="true"
				action="#{suppFinalBiddingBackingBean.addMeetingAttendance}"
				update="@([id$=attendeesPanel])"
				rendered="#{suppFinalBiddingBackingBean.managedBean.secretaryUser}" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}" id="attdDelBtn"
				process="@this, meetingAttDtlTbl" partialSubmit="true"
				update="@([id$=meetingAttDtlTbl],[id$=attdDelBtn])"
				onsuccess="dlgPerformDel.show();"
				rendered="#{(suppFinalBiddingBackingBean.managedBean.meetingAttendanceList ne null) and
										(suppFinalBiddingBackingBean.managedBean.meetingAttendanceList.size() gt 0) and 
										suppFinalBiddingBackingBean.managedBean.secretaryUser}"
				disabled="#{(suppFinalBiddingBackingBean.managedBean.selectedMeetingAttList eq null) ||
										(suppFinalBiddingBackingBean.managedBean.selectedMeetingAttList.size() eq 0)}" />

		</div>

		<!-- Dialog to prompt the user before deleting attendance records -->
		<p:dialog id="dlgPerformDel" widgetVar="dlgPerformDel"
			styleClass="screen-title" resizable="false" modal="true" width="330">
			<h:panelGrid columns="3">
				<p:graphicImage
					value="#{CommonUIConstant.imagePathUptoDesign}/exclamation.png"
					styleClass="ui-icon-complain"></p:graphicImage>
				<p:spacer width="10" />
				<div class="confirmation-message-box" style="font-size: 11px;">#{lbl['lbl.sc.dialog.confirm.message']}</div>
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					update="attdDelBtn, meetingAttDtlTbl"
					process="@this, meetingAttDtlTbl"
					actionListener="#{suppFinalBiddingBackingBean.deleteMeetingAttendanceDetails()}"
					onclick="dlgPerformDel.hide();">
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="dlgPerformDel.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>

</ui:composition>
