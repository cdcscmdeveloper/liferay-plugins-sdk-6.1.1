<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<!-- 25037 -start- -->
	<style>
		.committeeBidDtlTblCl th, .committeeBidDtlTblCl td{
			width: auto;
			min-width: 50px;
            word-break: break-word !important;
            white-space: normal !important;
		}
		.committeeBidDtlTblCl th{
			text-align: center !important;
		}
		.committeeBidDtlTblCl tr td:last-child{
			width: auto;
			text-align: center !important;
		}
	
	</style>
	<!-- 25037 -end- -->
	<p:panel
		header="#{suppFinalBiddingBackingBean.managedBean.committeeTabLabel}"
		toggleable="true">
		<!-- 25037 -start- -->
		<p:dataTable id="committeeDtlTbl" var="committeeDtl"
			styleClass="committeeBidDtlTblCl"
			value="#{suppFinalBiddingBackingBean.managedBean.committeeList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" rows="10"
			rowKey="#{committeeDtl}" rowIndexVar="index" resizableColumns="false">
			<!-- 25037 -end- -->
			<ac:paginator for="committeeDtlTbl" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.designation}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<!-- 25037 -start- -->
			<p:column>
				<f:facet name="header" style="min-width: 50px !important;">
			<!-- 25037 -end- -->
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="pnpTT#{index}"
						value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{suppFinalBiddingBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
								fn:toUpperCase(committeeDtl.scCommitteeMember.PNP))}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.role']}">
				<h:outputText
					value="#{suppFinalBiddingBackingBean.getFCMemberRole(committeeDtl.scCommitteeMember.memberRole)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.representative.type']}">
				<h:outputText
					value="#{suppFinalBiddingBackingBean.getParameterDesc(committeeDtl.scCommitteeMember.representativeType)}" />
			</p:column>

			<!-- 25037 -start- -->
			<p:column style="min-width: 100px !important;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.lbl.attendandendorse']}" />
					<ac:iconTooltip id="attendanceTooltip"
						value="#{lbl['lbl.sc.tooltip.attendandendorse']}" />
				</f:facet>
				<!-- 25037 -end- -->
				<p:selectBooleanCheckbox value="#{committeeDtl.attended}"
					disabled="#{!suppFinalBiddingBackingBean.managedBean.secretaryUser}" />
			</p:column>
		</p:dataTable>
		<div align="right">
			<!-- 25037 -start- -->		
			<ui:param name="actionBtnLbl"
				value="#{suppFinalBiddingBackingBean.evaluateEndorseSignoffTask(suppFinalBiddingBackingBean.managedBean.taskName) ? lbl['lbl.sc.btn.view.committee']: lbl['lbl.sc.btn.update.committee']}" />
			<p:commandButton value="#{actionBtnLbl}" styleClass="BtnSpacing"
				onclick="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{suppFinalMeetingBackingBean.navigateToUpdateMember('update')}"
				rendered="#{suppFinalMeetingBackingBean.managedBean.validFor25037}" />
			<!-- 25037 -end- -->				
		</div>
	</p:panel>
	<!-- 25037 -start- -->	
	<p:panel header="#{lbl['lbl.sc.remarks']}" toggleable="true">
		<ac:scRemarkAndAttachment
			remarkList="#{suppFinalBiddingBackingBean.managedBean.committeeRemarkList}"
			showAttachment="false"
			readonly="#{!suppFinalBiddingBackingBean.managedBean.secretaryUser}"
			header="" />
	</p:panel>
	<!-- 25037 -end- -->
</ui:composition>
