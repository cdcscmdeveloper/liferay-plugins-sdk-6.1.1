<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth50" >
			<h:column>
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" 
					columnClasses="columnWidth20,columnWidth40" >
					<h:column>
						<p:outputLabel value="#{lbl['lbl.sc.remark']}" style="vertical-align:top;"/>
					</h:column>
					<h:column>
						<p:dataGrid var="remarkVar"
							value="#{suppFinalBiddingBackingBean.managedBean.remarks}"
							rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top">
										<h:graphicImage height="30"
											value="#{suppFinalBiddingBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											width="30" />
									</td>
									<td width="5"></td>
									<td>
										<h:outputText value="#{remarkVar.createdUser.userName}" />,
										<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
											<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
										</h:outputText>
									</td>
								</tr>
								<tr>
									<td></td>
									<td>
										<p:inputTextarea cols="40" value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId eq null}" /> 
										<h:outputText value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;" />
									</td>
								</tr>
							</table>
						</p:dataGrid>
					</h:column>
				</h:panelGrid>
			</h:column>
			
			<h:column>
				<h:panelGrid id="testId" border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" 
					columnClasses="columnWidth20,columnWidth40" >
					<h:column>
						<p:outputLabel value="#{lbl['lbl.sc.qt.supp.doc']}" style="vertical-align:top;"/>
					</h:column>
					<h:column>
						<table  border="0" cellspacing="0" cellpadding="0" width="100%" style="vertical-align:top;">
							<tr>
								<td class="TableFieldRight">
									<p:commandButton oncomplete="uploadDlg.show();return false;" 
										icon="iconAttachment" update="@([id$=testId])"
										partialSubmit="true" process="@this"  
										value="#{lbl['lbl.txt.attach.file']}">
										<f:setPropertyActionListener target="#{suppFinalBiddingBackingBean.managedBean.attachmentDocType}" value="#{ParameterConst.doctypeQuotation}" />
									</p:commandButton>
								</td>
							</tr>
							<tr>
								<td>
									<h:panelGroup >
										<table border="0" cellspacing="0" cellpadding="0" width="100%">
											<tr>
												<td width="5%" rowspan="2">
													<h:graphicImage library="ep/images/design"
														name="#{suppFinalBiddingBackingBean.determineIcon(suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment)}"
														height="30" width="30"
														rendered="#{!empty suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment}" />
												</td>
												<td width="5"></td>
												<td>
													<h:outputText value="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment.createdUser.userName}" />,
													<h:outputText value="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment.createdDate}">
														<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
													</h:outputText>
												</td>
											</tr>
											<tr>
												<td></td>
												<td>
													<h:commandLink value="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment.fileName}"
														styleClass="blue_font"
														action="#{suppFinalBiddingBackingBean.downloadFile(suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment)}" />
													<p:spacer width="5" />
													<p:commandLink
														immediate="true"
														rendered="#{!empty suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment}"
														update="@([id$=testId])">
														<h:graphicImage library="ep/images/design" name="icon_trash.png" styleClass="tasklist_title1" />
														<f:setPropertyActionListener target="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.scQtFinalizationEndorsementAttachment}" value="#{null}" />
													</p:commandLink>
												</td>
											</tr>
										</table>
									</h:panelGroup>
								</td>
							</tr>
						</table>
					</h:column>
				</h:panelGrid>
			</h:column>
		</h:panelGrid>
	</p:panel>
</ui:composition>
