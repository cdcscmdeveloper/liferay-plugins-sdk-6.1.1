<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true" id="uploadsfileids">
		
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;">
					<p:outputLabel value="#{lbl['lbl.sc.qt.remark']}" />
				</td>
				<td class="TableFieldRight">
					<p:dataGrid
						value="#{committeeApprovalRemarkList}" var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<h:graphicImage value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" />
								</td>
								<td width="5"></td>
								<td>
									<h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText>
								</td>
							</tr>
							
							<tr>
								<td></td>
								<td>
									<h:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkVar.remarkId eq null}" /> 
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>

				<td class="TableFieldLeft">
					<p:outputLabel value="#{lbl['lbl.sc.qt.supp.doc']}" />
				</td>
				
				<td class="TableFieldRight">
					<table style="width: 100%;">
						<tr>
							<td colspan="2">
								<p:commandButton oncomplete="committeeAttachDlg.show()" 
									icon="iconAttachment"
									update="@([id$=attachDlgids])" value="Attach Files">
									<f:setPropertyActionListener value="#{commiteApproverCategory}" target="#{approvalBackingBean.managedBean.scQtApproval}" />
								</p:commandButton>
							</td>
						</tr>
						
						<tr>
							<td />
							<td>
								<p:dataGrid id="attachFileIds"
									value="#{committeeApprovalAttachment}" var="attachFile"
									rowIndexVar="attachFileIndex" columns="1" style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage library="ep/images/design"
													name="#{approvalBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText value="#{attachFile.createdUser.userName}" />, 
												<h:outputText value="#{attachFile.createdDate}">
													<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td>
												<h:commandLink value="#{attachFile.fileName}" 
													styleClass="blue_font" immediate="true"
													action="#{approvalBackingBean.downloadFile(attachFile)}" />
												<p:commandLink action="#{approvalBackingBean.deleteFile}" immediate="true" update="@([id$=attachFileIds])">
													<h:graphicImage library="ep/images/design" name="icon_trash.png" styleClass="tasklist_title1" />
												</p:commandLink>
											</td>
										</tr>
									</table>
								</p:dataGrid>
							</td>
						</tr>

					</table>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
