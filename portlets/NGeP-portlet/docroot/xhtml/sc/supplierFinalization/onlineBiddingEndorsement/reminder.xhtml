<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="reminderPopup" header="#{lbl['lbl.sc.reminder']}"
		widgetVar="reminder" position="top" width="600" height="400">
		<p:panel>
			
			<p:dataTable id="committeeReminder" var="reminder"
				value="#{suppFinalBiddingBackingBean.managedBean.reminderList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{reminder}" rowIndexVar="index">
				<ac:paginator for="committeeReminder" />

				<p:column headerText="#{lbl['lbl.sc.name']}" style="width:100%">
					<h:outputText value="#{reminder.scCommitteeMember.memberName}"/>
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.reminder']}" toggleable="true">
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.subject']}" />
				<p:inputText size="50"  value="#{suppFinalBiddingBackingBean.managedBean.subject}"></p:inputText>
				
				<h:outputLabel value="#{lbl['lbl.sc.message']}" />
				<p:inputTextarea rows="5" cols="50"  value="#{suppFinalBiddingBackingBean.managedBean.message}"></p:inputTextarea>
			</h:panelGrid>
		</p:panel>

		<div align="right">
			<p:commandButton 
				value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" 
				onclick="reminder.hide();" />
			<p:commandButton 
				value="#{lbl['lbl.btn.submit']}"
				style="float:right;" 
				action="#{suppFinalBiddingBackingBean.sendReminder}"
				oncomplete="reminder.hide();"/>
		</div>
	</p:dialog>
	
</ui:composition>
