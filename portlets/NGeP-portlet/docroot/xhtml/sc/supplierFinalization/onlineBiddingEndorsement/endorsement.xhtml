<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">
	<style type="text/css">
		.sidemenu > .ui-tabmenu-nav {		
			padding-bottom: 100px !important;
			margin-bottom: -100px !important;
		}	
	</style>	
	
	<p:messages id="supplierFinalization" showDetail="true" autoUpdate="true" closable="true" severity="error,info" />
	 <ac:gpkiPopup textBeforeSign="#{suppFinalBiddingBackingBean.textBeforeSign}"
		   postSignAction="#{suppFinalBiddingBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}"
				rendered="#{!suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}"
				process="@all" partialSubmit="true"
				action="#{suppFinalBiddingBackingBean.saveOfflineEndorsement}"
				update="@form" />

			<ui:repeat var="bpmAction"
				value="#{suppFinalBiddingBackingBean.managedBean.outComes}">
				<ui:param name="buttonLabel"
					value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
				<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
					styleClass="ui-button"
					action="#{suppFinalBiddingBackingBean.submitBiddingEndorsement(bpmAction)}" />
			</ui:repeat>

		</div>

		<ui:include
			src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/suppFinalizationHeader.xhtml"></ui:include>

		<p:tabMenu
			activeIndex="#{suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex}">
			<p:menuitem value="#{lbl['lbl.sc.bidding.summary']}"
				action="#{suppFinalBiddingBackingBean.navigateToBiddingSummaryTab}"
				update="@form" />
			<p:menuitem
				rendered="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}"
				value="#{lbl['lbl.sc.endorsement']}"
				action="#{suppFinalBiddingBackingBean.retrieveOnlineEndorsement}"
				update="@form" />
			<p:menuitem
				rendered="#{!suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}"
				value="#{lbl['lbl.sc.escalation']}"
				action="#{suppFinalBiddingBackingBean.retrieveOfflineEndorsement}"
				update="@form" />
		</p:tabMenu>
		
		<p:panel id="contentPanel">
			<c:if test="#{suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex eq '0'}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/biddingSummary.xhtml"></ui:include>
			</c:if>
			<c:if test="#{suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse and
									suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex eq '1'}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/onlineEndorsement.xhtml"></ui:include>
			</c:if>
			<c:if test="#{!suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse and
									suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex eq '1'}">
				<ui:include
					src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/offlineEndorsement.xhtml"></ui:include>
			</c:if>
		</p:panel>
				
		<ui:include
			src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/uploads.xhtml" />

		<ui:include
			src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/reminder.xhtml" />
		<ui:include
			src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/signOff.xhtml" />
		<ui:include
			src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/supplierDetailsPopUp.xhtml" />
			
	</ui:define>

</ui:composition>
