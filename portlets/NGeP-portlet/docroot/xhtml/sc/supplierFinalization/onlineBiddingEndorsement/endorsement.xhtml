<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
	
		<p:messages id="supplierFinalization" showDetail="true" autoUpdate="true" closable="true" severity="error,info"/>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.submit']}" 
					process="@all"
					partialSubmit="true"
					action="#{suppFinalBiddingBackingBean.submitOnlineEndorsement}"
					icon="ui-icon-submit" />
		</div>	
		
		<ui:include src="/xhtml/sc/supplierFinalization/suppFinalizationHeader.xhtml"></ui:include>
		
		<table style="border: 0px;width:100%;">
			<tr>
				<td width="20%" style="vertical-align: baseline;">
					<p:tabMenu styleClass="sidemenu"
						activeIndex="#{suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex}"
						style="display : table-caption;">
						
						<p:menuitem value="#{lbl['lbl.sc.bidding.summary']}"
							action="#{suppFinalBiddingBackingBean.retrieveBiddingSummary}"
							update="@form" />
						<p:menuitem rendered="#{!suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}" 
							value="#{lbl['lbl.sc.endorsement']}"
							action="#{suppFinalBiddingBackingBean.retrieveOnlineEndorsement}"
							update="@form" />
						<p:menuitem rendered="#{!suppFinalBiddingBackingBean.managedBean.scQtFinalization.onlineBiddingEndorse}" 
							value="#{lbl['lbl.sc.escalation']}"
							action="#{suppFinalBiddingBackingBean.retrieveOfflineEndorsement}"
							update="@form" />
					</p:tabMenu>
				</td>
				
				<td width="80%">
					<c:if test="#{suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex eq '0'}">
						<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/biddingSummary.xhtml"></ui:include>
					</c:if> 
					<c:if test="#{suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex eq '1'}">
						<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/onlineEndorsement.xhtml"></ui:include>
					</c:if> 
					<c:if test="#{suppFinalBiddingBackingBean.managedBean.onlineBiddingActiveIndex eq '2'}">
						<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/offlineEndorsement.xhtml"></ui:include>
					</c:if>
				</td>
			</tr>
		</table>
		
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/reminder.xhtml" />
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/signOff.xhtml" />
		<ui:include src="/xhtml/sc/supplierFinalization/supplierFinalization/supplierDetailsPopUp.xhtml" />
	</ui:define>

</ui:composition>
