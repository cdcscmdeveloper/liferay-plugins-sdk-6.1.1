
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #29466 - START -->
	<ui:param name="manufacturercategoryCode"
		value="#{suppFinalBiddingBackingBean.checkManufacturerCategoryCodes(suppFinalBiddingBackingBean.managedBean.scQt)}"></ui:param>
	<!-- #29466 - END -->
	<h:outputText styleClass="instruction" escape="false" rendered="#{suppFinalBiddingBackingBean.managedBean.displayReviseInstrn}"
			value="#{lbl['lbl.sc.sf.meeting.decision.instrn']}" />
			
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true"> 
		
		<p:outputLabel value="#{lbl['lbl.sc.bidding.schedule.status']} : " 
					  rendered="#{suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}" 
					  styleClass="leftMargin"/>
		<h:outputText style="color:red;" value="#{lbl['lbl.sc.cancelled']}" 
					  rendered="#{suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}" 
					  styleClass="leftMargin"/>
		<br/>	
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sf.finalization.supplier.selection.bumistatus.instruction']} "
			escape="false" />
		<h:outputText styleClass="instruction"
			value="#{suppFinalBiddingBackingBean.managedBean.scQt.closingDate}">
			<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
		</h:outputText>		  
		<ui:remove>21692 - Start</ui:remove>
		<br/>
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.qt.pending.finalization.instruction']} " escape="false" />
		<ui:remove>21692 - End</ui:remove>
		<p:dataTable id="supplierPackageTbl" value="#{suppFinalBiddingBackingBean.managedBean.biddingPackagePriceList}" 
					 var="price" rowKey="#{price}" rowIndexVar="rowIndex" 
					 emptyMessage="#{lbl['lbl.sc.supplier.finalization.sorttable.msg.no.records.found']}"
					 selection="#{suppFinalBiddingBackingBean.managedBean.selectedPackageBean}">
			<ac:paginator for="supplierPackageTbl"/>
			
			<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
					update="@([id$=supplierPackageTbl])" 
					listener="#{suppFinalBiddingBackingBean.awardSupplierEvent}"/>				
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}" style="width:5%; text-align:center;">
				<p:outputLabel value="#{price.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:5%; text-align:center;">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
							   process="@this" update="@([id$=suppDetailsPopupId])">
					<f:setPropertyActionListener value="#{price.scQtProposal}"
							target="#{supplierDetailBackingBean.scQtProposal}" />
					<h:outputText value="#{price.scQtProposal.supplierNo}" />
				</p:commandLink>
			</p:column>			
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}" style="width:5%; white-space:normal;">
				<h:outputText value="#{(price.scBidSupplier.bumi)?lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<ui:remove>
				Bug 31101 - WIP Impact 
			</ui:remove>
			<p:column>
				<f:facet name="header">
									<h:outputText value="#{lbl['lbl.sc.discipline.action.taken']}" />
									<ac:iconTooltip
										value="#{lbl['lbl.sc.disciplinaryAction.tooltip']}" />
								</f:facet>
				<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" style="color:red; font-weight:bold;" 
					rendered="#{price.scBidSupplier.smSupplier.disciplinaryActions}"
					action="#{viewSuppProfileBackingBean.onViewDisciplinaryAction(price.scBidSupplier.smSupplier)}" 
					process="@this" partialSubmit="true" update=":form">
						<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.yes']}" styleClass="warning" />
				</p:commandLink><p:spacer width="2"/>
				
				<h:outputText rendered="#{!price.scBidSupplier.smSupplier.disciplinaryActions}"
				 value="#{lbl['lbl.cm.dialog.cofirm.no']}" />								
			</p:column>
			
			<ui:remove>
				Bug 31101 - END
			</ui:remove>
			
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}" style="width:10%; white-space:normal; text-align:right;">
				<h:outputText value="#{price.scBidSupplier.packageStartPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}" style="width:15%; white-space:normal; text-align:right;">
				<p:commandLink immediate="true" oncomplete="pricePop.show();"
					actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(price)}" 
					update="@([id$=itemPricePop])" title="Item Price Details" 
					rendered="#{!(price.scBidSupplier.packageStartPrice eq price.bidPriceTotal)}">
					<p:graphicImage
						value="#{CommonUIConstant.imagePathUptoDesign}/ico-price.png"
						style="vertical-align:middle"></p:graphicImage>
				</p:commandLink>
				<h:outputText value="#{price.bidPriceTotal}" 
							  rendered="#{!(price.scBidSupplier.packageStartPrice eq price.bidPriceTotal)}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}" style="width:10%; white-space:normal; text-align:right;">
				<h:outputText value="#{price.bidPriceTotal - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice}"
					rendered="#{price.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}" style="width:10%; white-space:normal;">
				<h:outputText style="float : right;" value="#{price.diffPercentage}"
					rendered="#{price.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<!-- #29466 - START -->
			<p:column
				headerText="#{lbl[manufacturercategoryCode ?'lbl.sc.pref.margin.manufacturer' : 'lbl.sc.pref.margin']}"
				style="width:5%; white-space:normal;">
				<!-- #29466 - END -->
				<h:outputText style="float : right;" value="#{price.prefMargin}" 
							  rendered="#{price.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}"  style="width:10%; white-space:normal; text-align:right;">
				<h:outputText value="#{suppFinalBiddingBackingBean.managedBean.estimatedCost - 
																					price.bidPriceTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>			
			<ui:remove>
				31101 - Added Disciplinary Action filter
			</ui:remove>
			<p:column headerText="#{lbl['lbl.sc.selection']}" style="width:10%;" 
					  styleClass="td-check-box-spacing" selectionMode="single" 
					  rendered="#{!suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}"
					  disabledSelection="#{!isMofSelection and ((suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  							suppFinalBiddingBackingBean.managedBean.readOnly) or 
					  						 		(!suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  									!suppFinalBiddingBackingBean.managedBean.secretaryUser) or price.scBidSupplier.smSupplier.disciplinaryActions) or
					  									suppFinalBiddingBackingBean.supplierRejectEPV(price.scQtProposal)}" /> <ui:remove>21692</ui:remove>		
		</p:dataTable>
	</p:panel>
	<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.item.price']}"
			  widgetVar="pricePop" showEffect="fade" hideEffect="fade" modal="true" id="itemPricePop">
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemPricePopup.xhtml"></ui:include>
	</p:dialog>
	
</ui:composition>
