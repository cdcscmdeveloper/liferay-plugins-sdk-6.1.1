
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isRendered"
		value="#{price.scBidSupplier.smSupplier.bumi and suppFinalBiddingBackingBean.managedBean.bumiSuppLowestOfferedPrice ne 0}" />	
	
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true">
		
		<p:dataTable id="supplierPackageTbl" value="#{suppFinalBiddingBackingBean.managedBean.biddingPackagePriceList}" var="price">
			<ac:paginator for="supplierItemTbl"></ac:paginator>
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<p:outputLabel value="#{price.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<p:commandLink value="#{price.scBidSupplier.smSupplier.supplierId}"
					oncomplete="pricePop.show();"
					actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(price)}"
					update="@([id$=itemPricePop])" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText value="#{(price.scBidSupplier.smSupplier.bumi)?lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}">
				<h:outputText style="float : right;" value="#{price.scBidSupplier.packageStartPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}">
				<h:outputText style="float : right;" value="#{price.bidPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">
					<h:outputText style="float : right;" 
						value="#{price.bidPrice - suppFinalBiddingBackingBean.managedBean.bumiSuppLowestOfferedPrice}"
						rendered="#{isRendered}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}">
					<h:outputText style="float : right;" 
						value="#{((price.bidPrice - suppFinalBiddingBackingBean.managedBean.bumiSuppLowestOfferedPrice) * 100) / 
						suppFinalBiddingBackingBean.managedBean.bumiSuppLowestOfferedPrice }" rendered="#{isRendered}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.pref.margin']}">
				<h:outputText style="float : right;" rendered="#{price.scBidSupplier.smSupplier.bumi}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}">
				<h:outputText style="float : right;" value="#{price.scBidSupplier.packageStartPrice - price.bidPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.item.price']}"
		 widgetVar="pricePop" showEffect="fade"
		hideEffect="fade" modal="true" id="itemPricePop">
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemPricePopup.xhtml"></ui:include>
	</p:dialog>
</ui:composition>
