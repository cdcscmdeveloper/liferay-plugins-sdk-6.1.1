
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isRendered"
		value="#{suppFinalBiddingBackingBean.managedBean.bumiAndNonBumiCombination and 
					(suppFinalBiddingBackingBean.managedBean.bumiSuppLowestOfferedPrice gt 
							suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice) }" />	
	
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true">
		
		<p:dataTable id="supplierPackageTbl" value="#{suppFinalBiddingBackingBean.managedBean.biddingPackagePriceList}" var="price">
			<ac:paginator for="supplierItemTbl"></ac:paginator>
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<p:outputLabel value="#{price.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}" style="white-space:normal;">
				<p:commandLink update="@([id$=suppDtlPopUp])"
					action="#{suppFinalBiddingBackingBean.showSupplierDetails(
										price.scBidSupplier.smSupplier.supplierId)}"
					oncomplete="suppDtlWidgetVar.show();">
					<h:outputText value="#{price.supplierName}" />
				</p:commandLink>
			</p:column>			
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText value="#{(price.scBidSupplier.smSupplier.bumi)?lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}">
				<h:outputText style="float : right;" value="#{price.scBidSupplier.packageStartPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}">
					<p:commandLink immediate="true"
						oncomplete="pricePop.show();"
						actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(price)}"
						update="@([id$=itemPricePop])" style="float: right;" title="Item Price Details">
						<p:graphicImage value="/css/images/design/ico-price.png" style="vertical-align:middle"></p:graphicImage>
					</p:commandLink>
					<h:outputText style="float: right; margin-right: 10px;" value="#{price.bidPriceTotal}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>										
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">
					<h:outputText style="float : right;" 
						value="#{price.bidPriceTotal - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice}"
						rendered="#{isRendered}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}">
					<h:outputText style="float : right;" 
						value="#{price.diffPercentage}" rendered="#{isRendered}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.pref.margin']}">
				<h:outputText style="float : right;" 
							  rendered="#{isRendered}" value="#{price.prefMargin}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}">
				<h:outputText style="float : right;" value="#{suppFinalBiddingBackingBean.managedBean.estimatedCost - 
																					price.bidPriceTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.item.price']}"
		 widgetVar="pricePop" showEffect="fade"
		hideEffect="fade" modal="true" id="itemPricePop">
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemPricePopup.xhtml"></ui:include>
	</p:dialog>
</ui:composition>
