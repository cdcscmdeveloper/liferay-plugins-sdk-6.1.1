
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true"> 
		
		<p:outputLabel value="#{lbl['lbl.sc.bidding.schedule.status']} : " 
					  rendered="#{suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}" 
					  styleClass="leftMargin"/>
		<h:outputText style="color:red;" value="#{lbl['lbl.sc.cancelled']}" 
					  rendered="#{suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}" 
					  styleClass="leftMargin"/>
		<br/>			  
		<p:dataTable id="supplierPackageTbl" value="#{suppFinalBiddingBackingBean.managedBean.biddingPackagePriceList}" 
					 var="price" rowKey="#{price}" rowIndexVar="rowIndex" 
					 selection="#{suppFinalBiddingBackingBean.managedBean.selectedPackageBean}">
			<ac:paginator for="supplierPackageTbl"/>
			
			<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true" 
					update="@([id$=supplierPackageTbl])" 
					listener="#{suppFinalBiddingBackingBean.awardSupplierEvent}"/>				
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}" style="width:5%;">
				<p:outputLabel value="#{price.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:10%;">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
							   process="@this" update="@([id$=suppDetailsPopupId])" 
							   style="float:right;">
					<f:setPropertyActionListener value="#{price.scBidSupplier.smSupplier}"
							target="#{supplierDetailBackingBean.smSupplier}" />
					<h:outputText value="#{price.supplierCode}" />
				</p:commandLink>
			</p:column>			
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}" style="width:5%; white-space:normal;">
				<h:outputText value="#{(price.scBidSupplier.smSupplier.bumi)?lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}" style="width:10%; white-space:normal;">
				<h:outputText style="float : right;" value="#{price.scBidSupplier.packageStartPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}" style="width:15%; white-space:normal;">
				<p:commandLink immediate="true" oncomplete="pricePop.show();"
					actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(price)}" 
					update="@([id$=itemPricePop])" style="float: right;" title="Item Price Details" 
					rendered="#{!(price.scBidSupplier.packageStartPrice eq price.bidPriceTotal)}">
					<p:graphicImage
						value="#{CommonUIConstant.imagePathUptoDesign}/ico-price.png"
						style="vertical-align:middle"></p:graphicImage>
				</p:commandLink>
				<h:outputText style="float: right; margin-right: 10px;" value="#{price.bidPriceTotal}" 
							  rendered="#{!(price.scBidSupplier.packageStartPrice eq price.bidPriceTotal)}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}" style="width:10%; white-space:normal;">
				<h:outputText style="float : right;"
					value="#{price.bidPriceTotal - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice}"
					rendered="#{price.scBidSupplier.smSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}" style="width:10%; white-space:normal;">
				<h:outputText style="float : right;" value="#{price.diffPercentage}"
					rendered="#{price.scBidSupplier.smSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.pref.margin']}" style="width:5%; white-space:normal;">
				<h:outputText style="float : right;" value="#{price.prefMargin}" 
							  rendered="#{price.scBidSupplier.smSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}"  style="width:10%; white-space:normal;">
				<h:outputText style="float : right;" value="#{suppFinalBiddingBackingBean.managedBean.estimatedCost - 
																					price.bidPriceTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.selection']}" style="width:10%;" 
					  styleClass="td-check-box-spacing" selectionMode="single" 
					  rendered="#{!suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}"
					  disabledSelection="#{(suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  							suppFinalBiddingBackingBean.managedBean.readOnly) or 
					  						 		(!suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  									!suppFinalBiddingBackingBean.managedBean.secretaryUser)}" />		
		</p:dataTable>
	</p:panel>
	<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.item.price']}"
			  widgetVar="pricePop" showEffect="fade" hideEffect="fade" modal="true" id="itemPricePop">
		<ui:include src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemPricePopup.xhtml"></ui:include>
	</p:dialog>
</ui:composition>
