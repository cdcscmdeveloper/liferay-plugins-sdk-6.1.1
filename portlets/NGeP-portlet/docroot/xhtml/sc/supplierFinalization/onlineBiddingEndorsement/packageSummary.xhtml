
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #29466 - START -->
	<ui:param name="manufacturercategoryCode"
		value="#{suppFinalBiddingBackingBean.checkManufacturerCategoryCodes(suppFinalBiddingBackingBean.managedBean.scQt)}"></ui:param>
	<!-- #29466 - END -->
	<h:outputText styleClass="instruction" escape="false"
		rendered="#{suppFinalBiddingBackingBean.managedBean.displayReviseInstrn}"
		value="#{lbl['lbl.sc.sf.meeting.decision.instrn']}" />

	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true">

		<p:outputLabel value="#{lbl['lbl.sc.bidding.schedule.status']} : "
			rendered="#{suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}"
			styleClass="leftMargin" />
		<h:outputText style="color:red;" value="#{lbl['lbl.sc.cancelled']}"
			rendered="#{suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}"
			styleClass="leftMargin" />
		<br />

		<ui:remove> #28777#29729 - Start </ui:remove>
		<c:if
			test="#{suppFinalBiddingBackingBean.checkInstructionSupplierBranchDeleted(suppFinalBiddingBackingBean.managedBean.scQt.qtId)}">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.branch.related.deleted.instruction']} "
				escape="false" />
		</c:if>
		<ui:remove> #28777#29729 - End </ui:remove>

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sf.finalization.supplier.selection.bumistatus.instruction']} "
			escape="false" />
		<h:outputText styleClass="instruction"
			value="#{suppFinalBiddingBackingBean.managedBean.scQt.closingDate}">
			<f:convertDateTime
				pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
		</h:outputText>
		<br />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.pending.finalization.instruction']} "
			escape="false" />
		<ui:remove>21692</ui:remove>

		<ui:remove> #28777#29729 - Start </ui:remove>
		<h:outputText escape="false"
			value="#{lbl['lbl.sc.list.qualified.supplier']}"
			style="font-weight:bold; font-size: 15px;"
			rendered="#{isDisqualified}" />
		<ui:remove> #28777#29729 - End </ui:remove>

		<p:dataTable id="supplierPackageTbl"
			value="#{suppFinalBiddingBackingBean.managedBean.biddingPackagePriceList}"
			var="price" rowKey="#{price}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.sc.supplier.finalization.sorttable.msg.no.records.found']}"
			selection="#{suppFinalBiddingBackingBean.managedBean.selectedPackageBean}">
			<ac:paginator for="supplierPackageTbl" />

			<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true"
				update="@([id$=supplierPackageTbl])"
				listener="#{suppFinalBiddingBackingBean.awardSupplierEvent}" />

			<p:column headerText="#{lbl['lbl.sc.ranking']}"
				style="width:5%; text-align:center;">
				<p:outputLabel value="#{price.ranking}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:5%; text-align:center;">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
					process="@this" update="@([id$=suppDetailsPopupId])">
					<f:setPropertyActionListener value="#{price.scQtProposal}"
						target="#{supplierDetailBackingBean.scQtProposal}" />
					<h:outputText value="#{price.scQtProposal.supplierNo}" />
				</p:commandLink>

				<ui:remove> #28777#29729 - Start </ui:remove>
				<p:spacer width="15" height="15" />
				<p:commandLink process="@this"
					action="#{suppFinalBiddingBackingBean.showSupplierBranchList(price.scBidSupplier.smSupplier.supplierId)}"
					update="@([id$=suppBranchListPopupId])"
					oncomplete="suppBranchListPopup.show();">
					<h:graphicImage value="/css/images/exclam-info.png" />
				</p:commandLink>
				<ui:remove> #28777#29729 - End </ui:remove>
			</p:column>

			<!-- #29466 - START Commented out by Nasim - Note-150-->
			<!-- 			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:5%; text-align:right;"> -->
			<!-- 				<h:outputText value="#{price.scBidSupplier.totalScore}"> -->
			<!-- 					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat( -->
			<!-- 												CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" /> -->
			<!-- 				</h:outputText> -->
			<!-- 			</p:column>		 -->
			<!-- #29466 - END -->

			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}"
				style="width:5%; white-space:normal;">
				<h:outputText
					value="#{(price.scBidSupplier.bumi)?lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>

			<ui:remove>26247 - start</ui:remove>
			<ui:param name="supplier"
				value="#{price.scBidSupplier.smSupplier}" />
			<ui:param name="mofExpired"
				value="#{supplier.smMofAccount == null or supplier.smMofAccount.recordStatusFlg eq ParameterConst.getRecordStatusExpired()}" />
			<p:column styleClass="#{mofExpired ? 'red-background':''}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.mof.status']}" />
				</f:facet>
				<h:outputText
					value="#{suppFinalBiddingBackingBean.evaluateMOFStatus(supplier.smMofAccount)}" />
			</p:column>			
			<p:column style="white-space:normal;width:18%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.discipline.action.taken']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" />
				</f:facet>
				<ac:disciplinaryActionYesNo
					supplier="#{supplier}" maxRow="5" index="#{rowIndex}"/>
			</p:column>
			<ui:remove>26247 - end</ui:remove>

			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}" style="width:10%; white-space:normal; text-align:right;">
				<h:outputText value="#{price.scBidSupplier.packageStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}"
				style="width:15%; white-space:normal; text-align:right;">
				<p:commandLink immediate="true" oncomplete="pricePop.show();"
					actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(price)}"
					update="@([id$=itemPricePop])" title="Item Price Details"
					rendered="#{!(price.scBidSupplier.packageStartPrice eq price.bidPriceTotal)}">
					<p:graphicImage
						value="#{CommonUIConstant.imagePathUptoDesign}/ico-price.png"
						style="vertical-align:middle"></p:graphicImage>
				</p:commandLink>
				<h:outputText value="#{price.bidPriceTotal}"
					rendered="#{!(price.scBidSupplier.packageStartPrice eq price.bidPriceTotal)}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.difference.rm']}"
				style="width:10%; white-space:normal; text-align:right;">
				<h:outputText
					value="#{price.bidPriceTotal - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice}"
					rendered="#{price.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.difference.perc']}"
				style="width:10%; white-space:normal;">
				<h:outputText style="float : right;" value="#{price.diffPercentage}"
					rendered="#{price.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<!-- #29466 - START -->
			<p:column
				headerText="#{lbl[manufacturercategoryCode ?'lbl.sc.pref.margin.manufacturer' : 'lbl.sc.pref.margin']}"
				style="width:5%; white-space:normal;">
				<h:outputText style="float : right;" value="#{price.prefMargin}"
					rendered="#{price.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			<!-- #29466 - END -->

			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}"
				style="width:10%; white-space:normal; text-align:right;">
				<h:outputText
					value="#{suppFinalBiddingBackingBean.managedBean.estimatedCost - 
																					price.bidPriceTotal}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<ui:remove>26247 - start</ui:remove>
			<ui:param name="isDisciplinaryAction" value="#{suppFinalBiddingBackingBean.disabledQTProcess(price.scBidSupplier.smSupplier)}"/>
			<p:column headerText="#{lbl['lbl.sc.selection']}" style="width:10%;"
				styleClass="td-check-box-spacing" selectionMode="single"
				rendered="#{!suppFinalBiddingBackingBean.managedBean.disableSupplierSelection}"
				disabledSelection="#{!isMofSelection and ((suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  							suppFinalBiddingBackingBean.managedBean.readOnly) or 
					  						 		(!suppFinalBiddingBackingBean.managedBean.onlineBiddingEscalation and 
					  									!suppFinalBiddingBackingBean.managedBean.secretaryUser) or isDisciplinaryAction) or 
					  									suppFinalBiddingBackingBean.supplierRejectEPV(price.scQtProposal)}" />
			<ui:remove> 21692 </ui:remove>
		</p:dataTable>

		<ui:remove> #28777#29729 - Start </ui:remove>
		<h:outputText escape="false"
			value="#{lbl['lbl.sc.list.disqualified.supplier']}"
			style="font-weight:bold; font-size: 15px;"
			rendered="#{isDisqualified}" />
		<p:dataTable id="supplierPackageTblDisqualified"
			value="#{suppFinalBiddingBackingBean.managedBean.biddingPackagePriceListDisqualified}"
			var="priceDis" rowKey="#{priceDis}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.sc.supplier.finalization.sorttable.msg.no.records.found']}"
			rendered="#{isDisqualified}">
			<ac:paginator for="supplierPackageTblDisqualified" />

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:5%; text-align:center;">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
					process="@this" update="@([id$=suppDetailsPopupId])">
					<f:setPropertyActionListener value="#{priceDis.scQtProposal}"
						target="#{supplierDetailBackingBean.scQtProposal}" />
					<h:outputText value="#{priceDis.scQtProposal.supplierNo}" />
				</p:commandLink>

				<p:spacer width="15" height="15" />
				<p:commandLink process="@this"
					action="#{suppFinalBiddingBackingBean.showSupplierBranchList(priceDis.scBidSupplier.smSupplier.supplierId)}"
					update="@([id$=suppBranchListPopupId])"
					oncomplete="suppBranchListPopup.show();">
					<h:graphicImage value="/css/images/exclam-info.png" />
				</p:commandLink>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}"
				style="width:5%; white-space:normal;">
				<h:outputText
					value="#{(priceDis.scBidSupplier.bumi)?lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
						
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}"
				style="width:10%; white-space:normal; text-align:right;">
				<h:outputText value="#{priceDis.scBidSupplier.packageStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}"
				style="width:15%; white-space:normal; text-align:right;">
				<p:commandLink immediate="true" oncomplete="pricePop.show();"
					actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(priceDis)}"
					update="@([id$=itemPricePop])" title="Item Price Details"
					rendered="#{!(priceDis.scBidSupplier.packageStartPrice eq priceDis.bidPriceTotal)}">
					<p:graphicImage
						value="#{CommonUIConstant.imagePathUptoDesign}/ico-price.png"
						style="vertical-align:middle"></p:graphicImage>
				</p:commandLink>
				<h:outputText value="#{priceDis.bidPriceTotal}"
					rendered="#{!(priceDis.scBidSupplier.packageStartPrice eq priceDis.bidPriceTotal)}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.difference.rm']}"
				style="width:10%; white-space:normal; text-align:right;">
				<h:outputText
					value="#{priceDis.bidPriceTotal - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice}"
					rendered="#{priceDis.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.difference.perc']}"
				style="width:10%; white-space:normal;">
				<h:outputText style="float : right;"
					value="#{priceDis.diffPercentage}"
					rendered="#{priceDis.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<!-- #29466 - START -->
			<p:column
				headerText="#{lbl[manufacturercategoryCode ?'lbl.sc.pref.margin.manufacturer' : 'lbl.sc.pref.margin']}"
				style="width:5%; white-space:normal;">
				<h:outputText style="float : right;" value="#{priceDis.prefMargin}"
					rendered="#{priceDis.scBidSupplier.bumi and suppFinalBiddingBackingBean.managedBean.nonBumiAvailable}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			<!-- #29466 - END -->

			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}"
				style="width:10%; white-space:normal; text-align:right;">
				<h:outputText
					value="#{suppFinalBiddingBackingBean.managedBean.estimatedCost - 
																					priceDis.bidPriceTotal}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
            <p:column headerText="#{lbl['lbl.sc.disqualified.reason']}"
				style="text-align:center;">
				<h:outputText
					value="#{lbl['lbl.sc.disqualified.reason.eligibility.criteria.status']}"
					rendered="#{priceDis.scQtProposal.scQtSupplier.recordStatusFlg eq SourcingConstants.recordStatusDisqualified or suppFinalBiddingBackingBean.managedBean.biddingZoneDetails.get(suppFinalBiddingBackingBean.managedBean.zoneActiveIndex).branchDeactivated or priceDis.supplierDeactivated}" />
			</p:column>
		</p:dataTable>
		<ui:remove> #28777#29729 - End </ui:remove>

	</p:panel>
	<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.item.price']}"
		widgetVar="pricePop" showEffect="fade" hideEffect="fade" modal="true"
		id="itemPricePop">
		<ui:include
			src="/xhtml/sc/supplierFinalization/onlineBiddingEndorsement/itemPricePopup.xhtml"></ui:include>
	</p:dialog>

</ui:composition>
