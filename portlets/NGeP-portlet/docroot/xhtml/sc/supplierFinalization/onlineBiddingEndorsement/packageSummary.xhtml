
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
	<p:panel header="#{lbl['lbl.sc.supplier.details']}" toggleable="true">
		
		<p:dataTable id="supplierPackageTbl" value="#{suppFinalBiddingBackingBean.managedBean.bidPackages}" var="price">
			<ac:paginator for="supplierItemTbl"></ac:paginator>
			
			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<p:outputLabel value="#{price.ranking}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<p:commandLink value="#{price.scBidSupplier.smSupplier.supplierId}"
					oncomplete="pricePop.show();"
					actionListener="#{suppFinalBiddingBackingBean.supplierItemPricePopupAction(item)}"
					update="@([id$=itemPricePop])" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bumiputera.status']}">
				<h:outputText value="#{(price.scBidSupplier.smSupplier.bumi)? 'Yes' : 'No' }" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}">
				<h:outputText style="float : right" value="#{price.scBidSupplier.packageStartPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}">
				<h:outputText style="float : right" value="#{price.bidPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">
				<c:if test="#{isRendered}">
					<h:outputText style="float : right" 
						value="#{price.bidPrice - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</c:if>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}">
				<c:if test="#{isRendered}">
					<h:outputText style="float : right" 
						value="#{((price.bidPrice - suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice)* 100)/suppFinalBiddingBackingBean.managedBean.lowestNonBumiOfferedPrice }">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</c:if>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.pref.margin']}">
				<h:outputText style="float : right" value="10" rendered="#{price.scBidSupplier.smSupplier.bumi}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}">
				<h:outputText style="float : right" value="100">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
