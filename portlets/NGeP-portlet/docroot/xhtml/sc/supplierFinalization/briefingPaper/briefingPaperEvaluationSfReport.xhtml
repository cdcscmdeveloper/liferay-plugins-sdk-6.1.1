<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:remove> 25651 - Start </ui:remove>
	<style type="text/css">
	
		.center-column {
		    text-align: center;
		    vertical-align: middle;
		}
 
        .arrow-img {
            width: 15px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
		.rotated {
		    transform: rotate(90deg);
		    transition: 0.3s ease;
		}
		
	    .ul-report-detail {
		    list-style: none;
		    margin: 0;
		    padding-left: 0;
		}

		.li-report-detail {
		    position: relative;
		    padding-left: 18px;
		    margin: 6px 0;
		}

		.li-report-detail::before {
		    position: absolute;
		    left: 0;
		}
        
	</style>
	
	<script type="text/javascript">
	function toggleRow(el) {
	    var row = el.closest("tr");
	    var content = row.querySelector(".content");

	    content.style.display =
	        content.style.display === "block" ? "none" : "block";

	    el.classList.toggle("rotated");
	}
    </script>
    <ui:remove> 25651 - End </ui:remove>

	<p:panel id="evaluationReportsFilesDownloadIds"
		header="#{lbl['lbl.sc.content']}" toggleable="true">
		<h:outputText styleClass="instruction" escape="false" value="#{lbl['lbl.sc.sf.briefing.paper.reports.instructions']}" />
		<p:dataTable var="scQtEvaluationReport" id="evaluationreport"
			widgetVar="documentWidget" style="width:100%;" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{suppFinalizationBackingBean.managedBean.newBriefingPaperReportList}"
			selection="#{suppFinalizationBackingBean.managedBean.selectedScQtEvaluationReports}"
			rowKey="#{scQtEvaluationReport}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="evaluationreport" />
			
			<p:column style="width:2%" >
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk" value="#{suppFinalizationBackingBean.managedBean.templateSpecBean.selectAll}" disabled="true">
						<p:ajax partialSubmit="true" process="@this" update="@this" listener="#{suppFinalizationBackingBean.selectAll(suppFinalizationBackingBean.managedBean.templateSpecBean.selectAll, suppFinalizationBackingBean.managedBean.newBriefingPaperReportList)}"/>
					</p:selectBooleanCheckbox>
				</f:facet>
				
				<p:selectBooleanCheckbox value="#{scQtEvaluationReport.selected}"
					disabled="true"
					rendered="#{scQtEvaluationReport.definationType.parameterCode ne 'UP'}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>

				<p:selectBooleanCheckbox value="#{scQtEvaluationReport.selected}"
				disabled="#{suppFinalizationBackingBean.managedBean.readOnly or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
					rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'UP'}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=evaluationReportsFilesDownloadIds])" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.content']}"
				style="width:58%;white-space: normal;">
				<h:inputText  value="#{scQtEvaluationReport.title}" required="true" style="width:500px;"
				disabled="#{suppFinalizationBackingBean.managedBean.readOnly or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}" label="#{lbl['lbl.sc.content']}"
					rendered="#{scQtEvaluationReport.definationType.parameterCode ne 'UI' and suppFinalizationBackingBean.managedBean.currentStatusId != QTStatusConst.SF_PENDING_ENDORSEMENT and suppFinalizationBackingBean.managedBean.currentStatusId != QTStatusConst.SF_PENDING_SIGN_OFF}" >
					<p:ajax event="change" process="@this" partialSubmit="true" update="@this"></p:ajax>
					</h:inputText>
				<h:outputText value="#{scQtEvaluationReport.title}" 
					rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'UI' or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}" />
					<p:outputLabel style="float: left;" value="*" styleClass="mandatory" />
			</p:column>

			<p:column style="width:20%;white-space: normal;"
				headerText="#{lbl['lbl.sc.type']}">
				#{suppFinalizationBackingBean.getParameterDesc(scQtEvaluationReport.definationType)}
			</p:column>

			<p:column style="width:20%;text-align: center;"
				headerText="#{lbl['lbl.sc.action']}">
					<ui:fragment
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'UI'}">
				<p:commandLink
					rendered="#{suppFinalizationBackingBean.managedBean.currentStatusId != QTStatusConst.SF_PENDING_ENDORSEMENT and suppFinalizationBackingBean.managedBean.currentStatusId != QTStatusConst.SF_PENDING_SIGN_OFF}"
					process="@this" update="@([id$=reportContentPopupDlgId])"
					oncomplete="reportContentPopupDlg.show(); return false;">
					<f:setPropertyActionListener value="#{scQtEvaluationReport}"
						target="#{suppFinalizationBackingBean.managedBean.selectedBriefingReport}" />
					<h:graphicImage value="/css/images/design/edit.png"
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'UI' and (suppFinalizationBackingBean.managedBean.currentStatusId != QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId != QTStatusConst.SF_PENDING_SIGN_OFF)}" />
				</p:commandLink>
				<p:commandLink
					rendered="#{suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
					process="@this" update="@([id$=reportContentPopupDlgId])"
					oncomplete="reportContentPopupDlg.show(); return false;">
					<f:setPropertyActionListener value="#{scQtEvaluationReport}"
						target="#{suppFinalizationBackingBean.managedBean.selectedBriefingReport}" />
					<h:graphicImage
						value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png"
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'UI' and (suppFinalizationBackingBean.managedBean.readOnly or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF)}" />
				</p:commandLink>
				</ui:fragment>
				<ui:fragment
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'UP'}">
						<ac:scSingleFileUploadButton id="evaluationReportUploadBtn" readonly="#{suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
							popupWidgetVar="evaluationManualReportUploadWidget"
							attachment="#{scQtEvaluationReport.scQtFinalizationReportAttachment}"
							deleteFileUploadListener="suppFinalizationBackingBean.deleteReportsUploadFile"
							rowIndex="#{rowIndex}"> <!-- Bug #34083 -->
							<f:setPropertyActionListener for="actionEvent"
								value="#{scQtEvaluationReport}"
								target="#{suppFinalizationBackingBean.managedBean.selectedBriefingReport}" />
						</ac:scSingleFileUploadButton>
				</ui:fragment>
			</p:column>
		</p:dataTable>
		
		<ui:remove> 25651 - Start </ui:remove>  
		<c:if test="#{empty suppFinalizationBackingBean.managedBean.scQtFinalizationReportDetail}"> 
		<ui:remove> 25651 - End </ui:remove> 
		
			<div class="ppRightBtn">
				<ui:remove>38523 - start </ui:remove>
				<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
				action="#{suppFinalizationBackingBean.downloadAllBriefingPaperReportDetails(false)}"
					styleClass="BtnSpacing" />
				<ui:remove>38523 - end</ui:remove>
				
				<p:commandButton value="#{lbl['lbl.btn.add']}"
				disabled="#{suppFinalizationBackingBean.managedBean.readOnly or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
					styleClass="BtnSpacing" process="@this, evaluationreport"
					partialSubmit="true" action="#{suppFinalizationBackingBean.addDocumentList(suppFinalizationBackingBean.managedBean.scQt)}"
					oncomplete="documentWidget.paginator.endLink.click();"
					update="@([id$=evaluationreport])" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					styleClass="BtnSpacing"
					disabled="#{suppFinalizationBackingBean.deleteselectedList(suppFinalizationBackingBean.managedBean.newBriefingPaperReportList) or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
					process="@this,evaluationReportsFilesDownloadIds" partialSubmit="true"
					oncomplete="evaluationReportsDeletePopUp.show();"
					update="@([id$=#{evaluationReportListDeleteId}])"/>
					
			</div>
		
		<ui:remove> 25651 - Start </ui:remove>  	 
		</c:if>
		<ui:remove> 25651 - End </ui:remove> 
		
	</p:panel>
	
	<ui:remove> 25651 - Start </ui:remove>
	<p:panel id="evaluationReportsDetailFilesDownloadIds"
		header="#{lbl['lbl.sc.report.section']}" toggleable="true">
	   	<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.sf.briefing.paper.reports.detail.instructions.two']}" escape="false" />
		<p:dataTable var="scQtFinalizationReportDetail" id="evaluationreportdetail"
			widgetVar="documentWidget" style="width:100%;" 
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{suppFinalizationBackingBean.managedBean.scQtFinalizationReportDetail}"
			rowKey="#{scQtFinalizationReportDetail}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="evaluationreportdetail" />
			
			<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk" value="#{suppFinalizationBackingBean.managedBean.templateSpecBean.selectAll}" disabled="true">
						<p:ajax partialSubmit="true" process="@this" update="@this" listener="#{suppFinalizationBackingBean.selectAll(suppFinalizationBackingBean.managedBean.templateSpecBean.selectAll, suppFinalizationBackingBean.managedBean.scQtFinalizationReportDetail)}"/>
					</p:selectBooleanCheckbox>
				</f:facet>
				
				<p:selectBooleanCheckbox value="#{scQtFinalizationReportDetail.selected}"
					disabled="true"
					rendered="#{scQtFinalizationReportDetail.definationType.parameterCode ne 'UP'}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
				
				<p:selectBooleanCheckbox value="#{scQtFinalizationReportDetail.selected}"
				disabled="#{suppFinalizationBackingBean.managedBean.readOnly}"
					rendered="#{scQtFinalizationReportDetail.definationType.parameterCode eq 'UP'}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=evaluationReportsDetailFilesDownloadIds])" />
				</p:selectBooleanCheckbox>
			</p:column>
			
			<p:column style="width:5%;white-space: normal;" styleClass="center-column">
			   <h:graphicImage value="/css/images/icon-expand.png" rendered="#{scQtFinalizationReportDetail.definationType.parameterCode eq 'SD' and scQtFinalizationReportDetail.pmDocument.docDefinitionKey ne 'KTU'}" styleClass="arrow-img" onclick="toggleRow(this)" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.report']}"
				style="width:58%;white-space: normal;">
				<h:inputText  value="#{scQtFinalizationReportDetail.title}" required="true" style="width:500px;"
				disabled="#{suppFinalizationBackingBean.managedBean.readOnly}" label="#{lbl['lbl.sc.content']}"
					rendered="#{empty scQtFinalizationReportDetail.pmDocument}" >
					<p:ajax event="change" process="@this" partialSubmit="true" update="@this"></p:ajax>
					</h:inputText>
				<h:outputText value="#{scQtFinalizationReportDetail.title}" rendered="#{!empty scQtFinalizationReportDetail.pmDocument}" />
					
			    <!-- Content -->
			    <div class="content" style="display:none;">
			   
					<ul class="ul-report-detail">
					   <ui:repeat value="#{suppFinalizationBackingBean.managedBean.reportDetail}" var="entry">
					        <ui:fragment rendered="#{entry.key eq scQtFinalizationReportDetail.pmDocument.docDefinitionKey and entry.value ne SourcingConstants.laporanKertasTaklimatPertimbangan}">
					            <li class="li-report-detail"> #{entry.value} </li>
					        </ui:fragment>
					   </ui:repeat>   
					</ul>
					
			    </div>
			    
			</p:column>

			<p:column style="width:20%;text-align: center;"
				headerText="#{lbl['lbl.sc.action']}">
					<ui:fragment
						rendered="#{scQtFinalizationReportDetail.definationType.parameterCode eq 'SD'}">
                     		
                     		<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{suppFinalizationBackingBean.downloadReport(scQtFinalizationReportDetail)}" />
		
				</ui:fragment>
				<ui:fragment
					rendered="#{scQtFinalizationReportDetail.definationType.parameterCode eq 'UP'}">
					<ac:scSingleFileUploadButton id="evaluationReportDetailUploadBtn"
						popupWidgetVar="evaluationManualReportDetailUploadWidget"
						attachment="#{scQtFinalizationReportDetail.scQtFinalizationReportDetailAttachment}"
						readonly="#{suppFinalizationBackingBean.managedBean.readOnly}"
						deleteFileUploadListener="suppFinalizationBackingBean.deleteReportDetailsUploadFile"
						rowIndex="#{rowIndex}">
						<f:setPropertyActionListener for="actionEvent"
							value="#{scQtFinalizationReportDetail}"
							target="#{suppFinalizationBackingBean.managedBean.selectedBriefingReportDetail}" />
					</ac:scSingleFileUploadButton>
				</ui:fragment>
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
		
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
			action="#{suppFinalizationBackingBean.downloadAllBriefingPaperReportDetails(false)}"
				styleClass="BtnSpacing" />
			
			<p:commandButton value="#{lbl['lbl.btn.add']}"
			disabled="#{suppFinalizationBackingBean.managedBean.readOnly or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
				styleClass="BtnSpacing" process="@this, evaluationreportdetail"
				partialSubmit="true" action="#{suppFinalizationBackingBean.addDocumentDetailList(suppFinalizationBackingBean.managedBean.scQt)}"
				oncomplete="documentWidget.paginator.endLink.click();"
				update="@([id$=evaluationreportdetail])" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				styleClass="BtnSpacing"
				disabled="#{suppFinalizationBackingBean.deleteselectedList(suppFinalizationBackingBean.managedBean.scQtFinalizationReportDetail) or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
				process="@this,evaluationReportsDetailFilesDownloadIds" partialSubmit="true"
				oncomplete="evaluationReportDetailsDeletePopUp.show();"
				update="@([id$=#{evaluationReportDetailListDeleteId}])"/>
				
		</div>
    </p:panel>
    <ui:remove> 25651 - End </ui:remove>
	
	<p:dialog id="reportContentPopupDlgId" widgetVar="reportContentPopupDlg" closable="false"
				  modal="true" resizable="false" width="875" height="400" styleClass="pop_up_top" 
				  header="#{suppFinalizationBackingBean.managedBean.selectedBriefingReport.title}">
	
			<table>
				<tr>
					<td align="center">
						<p:inputTextarea value="#{suppFinalizationBackingBean.managedBean.selectedBriefingReport.reportContent}" 
								 		 scrollHeight="0" rows="15" cols="130" autoResize="false" maxlength="2000"
								 		 disabled="#{suppFinalizationBackingBean.managedBean.readOnly or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT or suppFinalizationBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_SIGN_OFF}"
								 		 rendered="#{suppFinalizationBackingBean.managedBean.selectedBriefingReport ne null}">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputTextarea>					
					</td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.cm.save']}" style="width: 8%;" 
					action="#{suppFinalizationBackingBean.saveScQtFinalizationReport(suppFinalizationBackingBean.managedBean.selectedBriefingReport)}"
					process="@this" partialSubmit="true"
					disabled="#{!isSecretaryUser}"/>
					
				<p:commandButton value="#{lbl['lbl.btn.close']}" style="width: 8%;"
					action="#{suppFinalizationBackingBean.closeScQtFinalizationReport(suppFinalizationBackingBean.managedBean.selectedBriefingReport)}" 
					oncomplete="reportContentPopupDlg.hide();" process="@this" partialSubmit="true" />
			</div>			
		</p:dialog>
		
		<ui:remove> 25651 - Start </ui:remove>
		<ac:scSingleFileUploadPopup widgetVar="evaluationManualReportDetailUploadWidget"
		fileUploadListener="suppFinalizationBackingBean.reportDetailsUploadAttachment"
		autoUpdateValue="#{suppFinalizationBackingBean.managedBean.autoUpdate}" 
		readonly="#{suppFinalizationBackingBean.managedBean.readOnly}"
		update="@([id$=evaluationReportDetailUploadBtn])" />
		
		<ui:param name="evaluationReportDetailListDeleteId"
			value="evaluationReportDetailListDeleteId"></ui:param>
			<ac:confirmationPopup id="#{evaluationReportDetailListDeleteId}"
			widget="evaluationReportDetailsDeletePopUp" width="450" height="100"
			okAction="suppFinalizationBackingBean.deleteReportDetailsTabDtls"
			title="#{lbl['lbl.sc.content']}"
			content="#{lbl['lbl.sc.dialog.confirm.message']}"
			update="@([id$=evaluationReportsDetailFilesDownloadIds])" />
		<ui:remove> 25651 - End </ui:remove>
		
		<ac:scSingleFileUploadPopup widgetVar="evaluationManualReportUploadWidget"
		fileUploadListener="suppFinalizationBackingBean.reportsUploadAttachment"
		autoUpdateValue="#{suppFinalizationBackingBean.managedBean.autoUpdate}" 
		readonly="#{suppFinalizationBackingBean.managedBean.readOnly}"
		update="@([id$=evaluationReportUploadBtn])" />
		
		<ui:param name="evaluationReportListDeleteId"
			value="evaluationReportListDeleteId"></ui:param>
			<ac:confirmationPopup id="#{evaluationReportListDeleteId}"
			widget="evaluationReportsDeletePopUp" width="450" height="100"
			okAction="suppFinalizationBackingBean.deleteReportsTabDtls"
			title="#{lbl['lbl.sc.content']}"
			content="#{lbl['lbl.sc.dialog.confirm.message']}"
			update="@([id$=evaluationReportsFilesDownloadIds])" />
			
</ui:composition>
