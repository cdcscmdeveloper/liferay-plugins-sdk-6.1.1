<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.report.section']}" toggleable="true">
		
		<p:dataTable id="reportTbl" 
			widgetVar="reportWidget" var="report"
			value="#{suppFinalizationBackingBean.managedBean.documentList}" 
			rows="10" styleClass="documentslist"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{report}" rowIndexVar="rowIndex">
			
			<ac:paginator for="reportTbl" />

			<p:column headerText="#{lbl['lbl.sc.content']}" style="width:70%;">
				<h:outputText value="#{report.title}" />
			</p:column>			
			
			<p:column headerText="#{lbl['lbl.sc.type']}" style="width:15%; white-space:normal;">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(report.definationType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
					  style="width:15%; white-space:normal; text-align: center;">
				<ui:fragment rendered="#{report.pmDocument ne null and
										 	suppFinalizationBackingBean.managedBean.getDirectdownloaddocdefkeys()
										 		.contains(report.pmDocument.docDefinitionKey)}">
					<p:commandButton id="download" icon="ui-icon-download" 
						style="background-color:transparent !important; border:0px none;"
						ajax="false" immediate="true" action="#{suppFinalizationBackingBean.downloadReport(report)}" />
				</ui:fragment>
				<ui:fragment rendered="#{(report.pmDocument ne null and
											!suppFinalizationBackingBean.managedBean.getDirectdownloaddocdefkeys()
												.contains(report.pmDocument.docDefinitionKey)) or report.pmDocument eq null}">						
					<ac:scSingleFileUploadButton id="briefingReportUploadBtn"
						popupWidgetVar="briefingReportAttWidget"
						attachment="#{report.scQtFinalizationReportAttachment}"
						readonly="#{!(isSecretaryUser and report.selected)}"
						rowIndex="#{rowIndex}">
	
						<f:setPropertyActionListener for="actionEvent" value="#{report}"
							target="#{suppFinalizationBackingBean.managedBean.selectedFinalizationReport}" />
	
						<f:setPropertyActionListener for="actionEvent" value="KTR"
							target="#{suppFinalizationBackingBean.managedBean.attachmentDocType}" />
	
					</ac:scSingleFileUploadButton>
				</ui:fragment>				
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}"
				action="#{suppFinalizationBackingBean.downloadAllReports}" 
				ajax="false" immediate="true" rendered="#{!readOnlyTask}" />
		</div>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.briefing.paper']}" toggleable="true">
	
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td class="TableFieldLeft" width="24%">
					<h:outputLabel value="#{lbl['lbl.txt.attachment']}" />
				</td>
				<td class="TableFieldRight">
						
					<ac:scSingleFileUploadButton id="briefingPaperUploadBtnId" 
						popupWidgetVar="briefingPaperAttWidget"
						attachment="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment}"
						readonly="#{!(isSecretaryUser or isBPKTaskAndClaimed)}"/>								
																				
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
