<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.report.section']}" toggleable="true">
		
		<p:dataTable id="reportTbl" 
			widgetVar="reportWidget" var="report"
			value="#{suppFinalizationBackingBean.managedBean.documentList}" 
			rows="10" styleClass="documentslist"
			rowKey="#{report}" rowIndexVar="rowIndex">
			
			<ac:paginator for="reportTbl" />

			<p:column headerText="#{lbl['lbl.sc.content']}" style="width:70%;">
				<h:outputText value="#{report.title}" />
			</p:column>			
			
			<p:column headerText="#{lbl['lbl.sc.type']}" style="width:15%; white-space:normal;">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(report.definationType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}" style="width:15%; white-space:normal; text-align: center;">
				<p:commandButton id="download" 
					icon="ui-icon-download" 
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{suppFinalizationBackingBean.downloadReport(report)}"
					rendered="#{report.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload 
														? !empty report.scQtFinalizationReportAttachment.fileName : true}" />
														
				<ui:fragment rendered="#{report.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload}">
					<p:commandLink immediate="true" 
						rendered="#{isSecretaryUser and report.selected and 
										report.docCategory eq ParameterConst.documentCategoryEndorsementReport and 
											!empty report.scQtFinalizationReportAttachment.fileName}" update="reportTbl">
						<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/icon_trash.png"
							styleClass="tasklist_title1" />

						<f:setPropertyActionListener target="#{report.scQtFinalizationReportAttachment}" value="#{null}" />
					</p:commandLink>

					<p:commandButton oncomplete="reportAttachmentPopupDlg.show();"
						value="#{lbl['lbl.txt.attachment']}" partialSubmit="true" process="@this"
						rendered="#{empty report.scQtFinalizationReportAttachment.fileName}"
						update="@([id$=reportAttachmentPopup])">
						<f:setPropertyActionListener
							target="#{suppFinalizationBackingBean.managedBean.selectedFinalizationReport}"
							value="#{report}" />
						<f:setPropertyActionListener value="KTR"
							target="#{suppFinalizationBackingBean.managedBean.attachmentDocType}" />
					</p:commandButton>
				</ui:fragment>														
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton  value="#{lbl['lbl.btn.download.all']}"
				action="#{suppFinalizationBackingBean.downloadAllReports}" 
				ajax="false" rendered="#{!readOnlyTask}" />
		</div>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.briefing.paper']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td class="TableFieldLeft" width="24%">
				<h:outputLabel value="#{lbl['lbl.txt.attachment']}" />
			</td>
			<td class="TableFieldRight">
				<p:commandButton oncomplete="attachmentPopupDlg.show();return false;" 
					partialSubmit="true" process="@this" update="@([id$=attachmentPopup])" 
					value="#{lbl['lbl.txt.attach.file']}" 
					rendered="#{isSecretaryUser or 
									isBPKTaskAndClaimed}">
				</p:commandButton>
			</td>
		</tr>
		<tr>
			<td />
			<td>
				<h:panelGroup id="attachFilesPanel">
					<table border="0" cellspacing="0" cellpadding="0" width="100%">
					<tr>
						<td width="5%" rowspan="2">
							<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/#{suppFinalizationBackingBean.determineIcon(
									suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment)}"
								height="30" width="30"
								rendered="#{!empty suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment}" />
						</td>
						<td width="5"></td>
						<td>
							<h:outputText value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment.createdUser.userName}" />
							<c:if test="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment ne null}">
								, 
							</c:if>
							<h:outputText value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment.createdDate}">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</h:outputText>
						</td>
					</tr>
					<tr>
						<td></td>
						<td>
							<h:commandLink value="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment.fileName}"
								styleClass="blue_font"
								action="#{suppFinalizationBackingBean.downloadFile(suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment)}" />
							<p:spacer width="5px" />
							<p:commandLink
								immediate="true"
								rendered="#{!empty suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment and 
											isSecretaryUser}"
								update="attachFilesPanel">
								<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/icon_trash.png" styleClass="tasklist_title1" />
									
								<f:setPropertyActionListener target="#{suppFinalizationBackingBean.managedBean.scQtFinalization.scQtFinalizationAttachment}" value="#{null}" />
							</p:commandLink>
						</td>
					</tr>
					</table>
				</h:panelGroup>
			</td>
		</tr>
		</table>
	</p:panel>
	
</ui:composition>
