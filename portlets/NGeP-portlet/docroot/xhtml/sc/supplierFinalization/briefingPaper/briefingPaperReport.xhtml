<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.report.section']}" toggleable="true">
		<h:outputText styleClass="instruction" escape="false"
			value="#{lbl['lbl.sc.sf.briefing.paper.reports.instructions']}" />
			
		<!-- 37622 add briefingPaperDisplayFilter -->
		<ui:param name="finalizationReports" value="#{suppFinalizationBackingBean.managedBean.documentList}" />
		<p:dataTable id="reportTbl" value="#{consolidationReportBackingBean.briefingPaperDisplayFilter(finalizationReports)}" 
		 	widgetVar="reportWidget" var="report"
			rows="10" styleClass="documentslist"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{report}" rowIndexVar="rowIndex">

			<ac:paginator for="reportTbl" />

			<p:column headerText="#{lbl['lbl.sc.content']}" style="width:70%;">
				<h:outputText value="#{report.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.type']}"
				style="width:15%; white-space:normal;">
				<h:outputText
					value="#{suppFinalizationBackingBean.getParameterDesc(report.definationType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:15%; white-space:normal; text-align: center;">
				<ui:fragment
					rendered="#{report.pmDocument ne null and
										 	suppFinalizationBackingBean.managedBean.getDirectdownloaddocdefkeys()
										 		.contains(report.pmDocument.docDefinitionKey)}">
					<p:commandButton id="download" icon="ui-icon-download"
						style="background-color:transparent !important; border:0px none;"
						ajax="false" immediate="true"
						action="#{suppFinalizationBackingBean.downloadBriefingPaperReport(report)}" />
				</ui:fragment>
				
				<h:panelGroup id="uploadBP">
					<ui:fragment
						rendered="#{(report.pmDocument ne null and
												!suppFinalizationBackingBean.managedBean.getDirectdownloaddocdefkeys()
													.contains(report.pmDocument.docDefinitionKey)) or report.pmDocument eq null}">
						<ac:scSingleFileUploadButton id="sfBriefingReportUploadBtn"
							popupWidgetVar="sfBriefingReportAttWidget"
							attachment="#{report.scQtFinalizationReportAttachment}"
							readonly="#{!(isSecretaryUser and report.selected)}"
							rowIndex="#{rowIndex}">
	
							<f:setPropertyActionListener for="actionEvent" value="#{report}"
								target="#{suppFinalizationBackingBean.managedBean.selectedFinalizationReport}" />
	
							<f:setPropertyActionListener for="actionEvent" value="KTR"
								target="#{suppFinalizationBackingBean.managedBean.attachmentDocType}" />
	
						</ac:scSingleFileUploadButton>
					</ui:fragment>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
		
		<!-- <ui:fragment
					rendered="#{report.pmDocument ne null and 'KT' eq report.pmDocument.docDefinitionKey and report.kertasTaklimatUpload}">
					<ac:scSingleFileUploadButton id="kertasTakliUploadBtn"
						popupWidgetVar="kertasTaklimUploadAttWidget"
						attachment="#{report.tempReportAttachment}" rowIndex="#{rowIndex}"
						readonly="#{!(isSecretaryUser)}"
						deleteFileUploadListener="suppFinalizationBackingBean.deleteKertasAttachment">
						<f:setPropertyActionListener for="actionEvent" value="#{report}"
							target="#{suppFinalizationBackingBean.managedBean.selectedFinalizationReport}" />
						<f:setPropertyActionListener for="actionEvent" value="KTR"
							target="#{suppFinalizationBackingBean.managedBean.attachmentDocType}" />
					</ac:scSingleFileUploadButton>
				</ui:fragment> -->

		<ui:include src="/xhtml/sc/supplierFinalization/briefingPaper/briefingPaperEvaluationSfReport.xhtml" />
	</p:panel>

</ui:composition>
