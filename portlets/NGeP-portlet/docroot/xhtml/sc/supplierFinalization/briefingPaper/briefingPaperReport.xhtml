<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.briefing.paper']}" toggleable="true">
		
		<p:dataTable id="documentTbl" 
			var="document" 
			widgetVar="documentWidget"
			value="#{suppFinalizationBackingBean.managedBean.documentList}"
			styleClass="documentslist" 
			rowKey="#{document}" 
			rowIndexVar="rowIndex">

			<p:column headerText="#{lbl['lbl.sc.contents']}" style="width:78%">
				<h:outputText value="#{document.docName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.type']}" style="width:10%">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(document.docDefinitionTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%; text-align: center;">
				<h:commandLink action="#{suppFinalizationBackingBean.downloadDocFile(document)}">
					<p:graphicImage library="ep/images/design" name="download.png"
						value="/resources/ep/images/design/download.png"
						title="#{lbl['lbl.txt.file.download']}" />
				</h:commandLink>
			</p:column>
		</p:dataTable>
		
		<p:spacer height="20px" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" 
				action="#{suppFinalizationBackingBean.downloadAll}"
				ajax="false"
				icon="ui-icon-download" 
				title="#{lbl['lbl.txt.file.download.all']}"/>
		</div>
	</p:panel>
	
</ui:composition>
