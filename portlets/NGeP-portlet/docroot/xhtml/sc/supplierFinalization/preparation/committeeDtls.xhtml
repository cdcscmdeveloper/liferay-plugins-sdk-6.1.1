<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{suppFinalizationBackingBean.managedBean.committeeTabLabel}"
			 toggleable="true">
		<p:dataTable id="committeeDtlTbl" var="committeeDtl"
			value="#{suppFinalizationBackingBean.managedBean.committeeList}"
			rows="10" rowKey="#{committeeDtl}" rowIndexVar="index"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			resizableColumns="false">
			<ac:paginator for="committeeDtlTbl" />

			<p:column headerText="#{lbl['lbl.sc.name']}" style="width:20%; white-space:normal;">
				<h:outputText value="#{committeeDtl.scCommitteeMember.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}" style="width:5%;white-space:normal;">
				<h:outputText value="#{committeeDtl.scCommitteeMember.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.designation']}" style="width:15%; white-space:normal;">
				<h:outputText value="#{committeeDtl.scCommitteeMember.designation}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.email']}" style="width:20%;">
				<h:outputText value="#{committeeDtl.scCommitteeMember.email}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.grade']}" style="width:5%;white-space:normal;">
				<h:outputText value="#{committeeDtl.scCommitteeMember.grade}" />
			</p:column>

			<p:column style="width:5%;white-space:normal;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}"/>
					<ac:iconTooltip id="pnpTT#{index}" value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
											fn:toUpperCase(committeeDtl.scCommitteeMember.PNP))}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.role']}" style="width:10%;white-space:normal;">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(
								committeeDtl.scCommitteeMember.memberRole)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.representative.type']}" style="white-space:normal; width:10%;">
				<h:outputText value="#{suppFinalizationBackingBean.getParameterDesc(
									  	 committeeDtl.scCommitteeMember.representativeType)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.attendance']}"
					  styleClass="td-check-box-spacing" style="width:10%;text-align:center;">
				<p:selectBooleanCheckbox value="#{committeeDtl.attended}"
					disabled="#{!isSecretaryUser}" styleClass="td-check-box-spacing" />
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<ac:scRemarkAndAttachment
		remarkList="#{suppFinalizationBackingBean.managedBean.committeeRemarkList}"
		showAttachment="false" />

</ui:composition>
