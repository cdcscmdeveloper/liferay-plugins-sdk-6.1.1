<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="border: 0px;width:100%; align:center">
		<tr>
			<td width="100%" align="left" valign="top"> 
				<p:panel header="#{lbl['lbl.sc.meeting.details']}" toggleable="true">
					<p:dataTable id="meetingDtlTbl" var="meetingDtl" 
						value="#{suppFinalizationBackingBean.managedBean.meetingList}" 
						rows="10" rowKey="#{meetingDtl}" rowIndexVar="rowIndex" editable="true"
						selection="#{suppFinalizationBackingBean.managedBean.selectedMeetingList}">
						<ac:paginator for="meetingDtlTbl" />

						<p:column selectionMode="multiple" style="width:2%" 
							rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}"></p:column>
						
						<p:column style="width:18%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.meeting.date']}" />
							</f:facet>
							<p:calendar label="#{lbl['lbl.sc.meeting.date']}" required="true" showOn="button" 
								mindate="#{suppFinalizationBackingBean.managedBean.currentDate}"
								value="#{meetingDtl.meetingDate}" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
								disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}" 
								id="meetingDate">
								<p:ajax partialSubmit="true" process="@this" update="@this,mtgDate"/>
							</p:calendar>
							<p:message id="mtgDate" for="meetingDate" display="icon" showDetail="false"></p:message>
						</p:column>

						<p:column style="width:30%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.meeting.location']}" />
							</f:facet>
							<p:inputTextarea label="#{lbl['lbl.sc.meeting.location']}" required="true" rows="2" cols="50" maxlength="255"
								value="#{meetingDtl.meetingLocation}" id="meetingLocation" 
								disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
								<p:ajax partialSubmit="true" process="@this" update="@this,mtgLoc"/>
							</p:inputTextarea>
							<p:message id="mtgLoc" for="meetingLocation" display="icon" showDetail="false"></p:message>
						</p:column>
						
						<p:column style="width:20%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.status']}" />
							</f:facet>
							<p:selectOneMenu label="#{lbl['lbl.sc.status']}" required="false" value="#{meetingDtl.meetingStatusStr}" 
								disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
								<f:selectItems value="#{suppFinalizationBackingBean.getMeetingStatusDropDown()}"/>
								<p:ajax partialSubmit="true" process="@this" update="@this" listener="#{suppFinalizationBackingBean.changeMeetingStatus(meetingDtl)}"/>
							</p:selectOneMenu>
						</p:column>
						
						<p:column headerText="#{lbl['lbl.sc.remark']}" style="width:30%">
							<p:inputTextarea value="#{meetingDtl.remark}" rows="2" cols="30" 
								disabled="#{!suppFinalizationBackingBean.managedBean.secretaryUser}">
								<p:ajax partialSubmit="true" process="@this" update="@this"/>
							</p:inputTextarea>
						</p:column>
					</p:dataTable>
					
					<p:spacer height="10px"></p:spacer>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.add']}"
							process="@this,meetingDtlTbl" 
							partialSubmit="true"
							action="#{suppFinalizationBackingBean.addMeetingDtls}"
							update="meetingDtlTbl" 
							rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}"/>
							
						<p:commandButton value="#{lbl['lbl.btn.delete']}"
							process="@this, meetingDtlTbl" partialSubmit="true"
							action="#{suppFinalizationBackingBean.deleteMeetingDetails(suppFinalizationBackingBean.managedBean.selectedMeetingList)}"
							update="meetingDtlTbl" rendered="#{suppFinalizationBackingBean.managedBean.secretaryUser}"/>
	
					</div>
				</p:panel> 
			</td>
		</tr>
	</table>
</ui:composition>
