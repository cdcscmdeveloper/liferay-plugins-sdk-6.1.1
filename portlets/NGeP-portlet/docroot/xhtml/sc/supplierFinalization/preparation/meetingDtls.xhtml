<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="border: 0px;width:100%; align:center">
		<tr>
			<td width="100%" align="left" valign="top"> 
				<p:panel header="#{lbl['lbl.sc.meeting.details']}" toggleable="true">
					<p:dataTable id="meetingDtlTbl" var="meetingDtl" 
						value="#{suppFinalizationBackingBean.managedBean.meetingList}" rows="10"
						rowKey="#{meetingDtl}" rowIndexVar="rowIndex"
						selection="#{suppFinalizationBackingBean.managedBean.selectedMeetingList}">
						<ac:paginator for="meetingDtlTbl" />

						<p:column selectionMode="multiple" style="width:2%"></p:column>
						
						<p:column style="width:18%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.meeting.date']}" />
							</f:facet>
							<p:calendar label="#{lbl['lbl.sc.meeting.date']}" required="true" showOn="button" 
								value="#{meetingDtl.meetingDate}" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"/>
						</p:column>

						<p:column style="width:30%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.location']}" />
							</f:facet>
							<p:inputTextarea label="#{lbl['lbl.sc.location']}" required="true" rows="2" cols="50" 
								value="#{meetingDtl.meetingLocation}"/>
						</p:column>
						
						<p:column style="width:20%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.status']}" />
							</f:facet>
							<p:selectOneMenu label="#{lbl['lbl.sc.status']}" required="true" value="#{meetingDtl.meetingStatus.statusId}">
								<f:selectItems value="#{suppFinalizationBackingBean.getMeetingStatusDropDown()}"/>
							</p:selectOneMenu>
						</p:column>
						
						<p:column headerText="#{lbl['lbl.sc.remark']}" style="width:30%">
							<p:inputTextarea value="#{meetingDtl.remark}" rows="2" cols="30"/>
						</p:column>
					</p:dataTable>
					
					<p:spacer height="10px"></p:spacer>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.add']}"
							process="@this,meetingDtlTbl" 
							partialSubmit="true"
							action="#{suppFinalizationBackingBean.addMeetingDtls}"
							update="meetingDtlTbl" 
							icon="ui-icon-add" />
							
						<p:commandButton value="#{lbl['lbl.btn.delete']}"
							process="@this, meetingDtlTbl" partialSubmit="true"
							icon="ui-icon-delete"
							action="#{suppFinalizationBackingBean.deleteRowsAction(suppFinalizationBackingBean.managedBean.meetingList, suppFinalizationBackingBean.managedBean.selectedMeetingList)}"
							update="meetingDtlTbl" />
	
					</div>
				</p:panel> 
			</td>
		</tr>
	</table>
</ui:composition>
