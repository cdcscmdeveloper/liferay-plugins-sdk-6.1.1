<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="supplierFinalizationMeetingPreparationPnlId" header="#{lbl['lbl.sc.meeting.details']}" toggleable="true">
		<p:dataTable id="meetingDtlTbl" var="meetingDtl"
			value="#{suppFinalizationBackingBean.managedBean.meetingList}"
			rows="10" rowKey="#{meetingDtl}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			editable="true">

			<ac:paginator for="meetingDtlTbl" />

			<ui:remove> #19287 - start </ui:remove>
			<ui:param name="disableMeeting"
				      value="#{!isSecretaryUser or 
										meetingDtl.recordStatusFlg ne DbValueConst.recordStatusActive
										or suppFinalizationBackingBean.managedBean.readOnly}" />
			<p:column styleClass="td-check-box-spacing">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk"
						value="#{suppFinalizationBackingBean.managedBean.selectAllMeetings}"
						disabled="#{suppFinalizationBackingBean.managedBean.hasPreviousMeeting or suppFinalizationBackingBean.managedBean.readOnly}">
						<ui:remove> #19287 - end </ui:remove>

						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=supplierFinalizationMeetingPreparationPnlId])"
							listener="#{suppFinalizationBackingBean.selectAll(
															suppFinalizationBackingBean.managedBean.selectAllMeetings, 
															suppFinalizationBackingBean.managedBean.meetingList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox id="selectMeeting"
					value="#{meetingDtl.selected}" disabled="#{disableMeeting}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=supplierFinalizationMeetingPreparationPnlId])" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column style="width:18%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}"
						styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.meeting.date']}" />
				</f:facet>
				
				<ac:dateTime id="finalizationconfirmmeetingDate"
									required="true"
									label="#{lbl['lbl.sc.meeting.date']}"
									disabled="#{disableMeeting}" value="#{meetingDtl.meetingDate}"
									update="@([id$=finalizationconfirmmeetingDate])" rowIndex="#{rowIndex}">
								</ac:dateTime>
				<p:message id="mtgDate" for="finalizationconfirmmeetingDate" display="icon"
					showDetail="false"></p:message>
			</p:column>

			<p:column style="width:30%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}"
						styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.meeting.location']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.meeting.location.tooltip']}" />
				</f:facet>
				<p:inputTextarea label="#{lbl['lbl.sc.meeting.location']}"
					required="true" rows="2" cols="30" maxlength="255"
					onkeyup="limitTextArea(this,255);" onkeydown="limitTextArea(this,255);"
					onmouseout="limitTextArea(this,255);"
					value="#{meetingDtl.meetingLocation}" id="meetingLocation"
					disabled="#{disableMeeting}">
					<p:ajax partialSubmit="true" process="@this" update="@this,mtgLoc" />
				</p:inputTextarea>
				<p:message id="mtgLoc" for="meetingLocation" display="icon"
					showDetail="false"></p:message>
			</p:column>

			<p:column style="width:20%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}"
						styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.status']}" />
				</f:facet>
				<p:selectOneMenu label="#{lbl['lbl.sc.status']}" required="false"
					value="#{meetingDtl.meetingStatusStr}" disabled="#{disableMeeting}">
					<f:selectItems
						value="#{suppFinalizationBackingBean.getMeetingStatusDropDown()}" />
					<!-- ***28834 start -->
					<p:ajax partialSubmit="true" process="@this" update="@form"
						listener="#{suppFinalizationBackingBean.changeMeetingStatus(meetingDtl)}" />
					<!-- ***28834 ends-->
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remark']}" style="width:30%">
				<p:inputTextarea value="#{meetingDtl.remark}" rows="2" cols="30" maxlength="100"
				onkeyup="limitTextArea(this,100);" onkeydown="limitTextArea(this,100);"
				onmouseout="limitTextArea(this,100);"	disabled="#{disableMeeting}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:inputTextarea>
			</p:column>
		</p:dataTable>

		<div align="right" class="BtnSpacing">
			<ui:remove> #19287 - start </ui:remove>
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,meetingDtlTbl" partialSubmit="true"
				action="#{suppFinalizationBackingBean.addMeetingDtls}"
				update="meetingDtlTbl"
				rendered="#{isSecretaryUser}" 
				disabled="#{suppFinalizationBackingBean.managedBean.readOnly}"/>

			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this,meetingDtlTbl" partialSubmit="true"
				disabled="#{suppFinalizationBackingBean.deleteselectedList(suppFinalizationBackingBean.managedBean.meetingList) or suppFinalizationBackingBean.managedBean.readOnly}"
				oncomplete="dlgPerformDel.show();" update="@([id$=#{supplierFinalizationPreparationMeetingDeleteId}])"
				rendered="#{isSecretaryUser}" />
			<ui:remove> #19287 - end </ui:remove>	

		</div>
		
		<ui:param
							name="supplierFinalizationPreparationMeetingDeleteId"
							value="supplierFinalizationPreparationMeetingDeleteId"></ui:param>

						<ac:confirmationPopup
							id="#{supplierFinalizationPreparationMeetingDeleteId}"
							widget="dlgPerformDel" width="450" height="100"
							okAction="suppFinalizationBackingBean.deleteMeetingDetails"
							title="#{lbl['lbl.sc.meeting.details']}"
							content="#{lbl['lbl.sc.dialog.confirm.message']}"
							update="@([id$=supplierFinalizationMeetingPreparationPnlId])" />

		
	</p:panel>
	
</ui:composition>
