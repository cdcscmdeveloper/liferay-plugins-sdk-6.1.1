<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.meeting.details']}" toggleable="true">
		<p:dataTable id="meetingDtlTbl" var="meetingDtl"
			value="#{suppFinalizationBackingBean.managedBean.meetingList}"
			rows="10" rowKey="#{meetingDtl}" rowIndexVar="rowIndex"
			editable="true">

			<ac:paginator for="meetingDtlTbl" />

			<ui:param name="disableMeeting"
				      value="#{!isSecretaryUser or 
										meetingDtl.recordStatusFlg ne DbValueConst.recordStatusActive}" />
			<p:column styleClass="td-check-box-spacing">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk"
						value="#{suppFinalizationBackingBean.managedBean.selectAllMeetings}"
						disabled="#{suppFinalizationBackingBean.managedBean.hasPreviousMeeting}">

						<p:ajax partialSubmit="true" process="@this"
							update="meetingDtlTbl"
							listener="#{suppFinalizationBackingBean.selectAll(
															suppFinalizationBackingBean.managedBean.selectAllMeetings, 
															suppFinalizationBackingBean.managedBean.meetingList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox id="selectMeeting"
					value="#{meetingDtl.selected}" disabled="#{disableMeeting}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column style="width:18%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}"
						styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.meeting.date']}" />
				</f:facet>
				<p:calendar label="#{lbl['lbl.sc.meeting.date']}" required="true"
					showOn="button" mindate="#{CommonConstants.CURRENT_DATE}"
					value="#{meetingDtl.meetingDate}" readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"
					disabled="#{disableMeeting}" id="meetingDate">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this,mtgDate" />
				</p:calendar>
				<p:message id="mtgDate" for="meetingDate" display="icon"
					showDetail="false"></p:message>
			</p:column>

			<p:column style="width:30%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}"
						styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.meeting.location']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.meeting.location.tooltip']}" />
				</f:facet>
				<p:inputTextarea label="#{lbl['lbl.sc.meeting.location']}"
					required="true" rows="2" cols="30" maxlength="255"
					value="#{meetingDtl.meetingLocation}" id="meetingLocation"
					disabled="#{disableMeeting}">
					<p:ajax partialSubmit="true" process="@this" update="@this,mtgLoc" />
				</p:inputTextarea>
				<p:message id="mtgLoc" for="meetingLocation" display="icon"
					showDetail="false"></p:message>
			</p:column>

			<p:column style="width:20%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.txt.mandatory']}"
						styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.status']}" />
				</f:facet>
				<p:selectOneMenu label="#{lbl['lbl.sc.status']}" required="false"
					value="#{meetingDtl.meetingStatusStr}" disabled="#{disableMeeting}">
					<f:selectItems
						value="#{suppFinalizationBackingBean.getMeetingStatusDropDown()}" />
					<p:ajax partialSubmit="true" process="@this" update="@this"
						listener="#{suppFinalizationBackingBean.changeMeetingStatus(meetingDtl)}" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remark']}" style="width:30%">
				<p:inputTextarea value="#{meetingDtl.remark}" rows="2" cols="30"
					disabled="#{disableMeeting}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:inputTextarea>
			</p:column>
		</p:dataTable>

		<div align="right" class="BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,meetingDtlTbl" partialSubmit="true"
				action="#{suppFinalizationBackingBean.addMeetingDtls}"
				update="meetingDtlTbl"
				rendered="#{isSecretaryUser}" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				onsuccess="dlgPerformDel.show();" update="meetingDtlTbl"
				rendered="#{isSecretaryUser}" />

		</div>

		<!-- Dialog to prompt the user before deleting attendance records -->
		<p:dialog id="dlgPerformDel" widgetVar="dlgPerformDel"
			styleClass="screen-title" resizable="false" modal="true" width="330">
			<h:panelGrid columns="3">
				<p:graphicImage
					value="#{CommonUIConstant.imagePathUptoDesign}/exclamation.png"
					styleClass="ui-icon-complain"></p:graphicImage>
				<p:spacer width="10" />
				<div class="confirmation-message-box" style="font-size: 11px;">#{lbl['lbl.sc.dialog.confirm.message']}</div>
			</h:panelGrid>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					update="@this, meetingDtlTbl" process="@this, meetingDtlTbl"
					actionListener="#{suppFinalizationBackingBean.deleteMeetingDetails()}"
					onclick="dlgPerformDel.hide();">
				</p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="dlgPerformDel.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
	
</ui:composition>
