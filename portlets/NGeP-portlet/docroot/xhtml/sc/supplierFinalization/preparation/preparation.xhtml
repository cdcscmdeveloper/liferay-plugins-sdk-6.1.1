<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="border: 0px;width:100%;">
		<tr>
			<td width="20%" style="vertical-align: baseline;">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{suppFinalizationBackingBean.managedBean.prepareActiveIndex}"
					style="display : table-caption;">
					
					<p:menuitem value="#{lbl['lbl.sc.meeting.details']}"
						action="#{suppFinalizationBackingBean.retrieveMeetingDtls}"
						process="@form" update="@form" />
					<p:menuitem value="#{suppFinalizationBackingBean.managedBean.committeeTabLabel}"
						action="#{suppFinalizationBackingBean.retrieveCommitteeDtls}"
						process="@form" update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.join.in']}"
						action="#{suppFinalizationBackingBean.retrieveMeetingAttendanceDtls}"
						process="@form" update="@form" />
				</p:tabMenu>
			</td>
			
			<td width="80%">
				<c:if test="#{suppFinalizationBackingBean.managedBean.prepareActiveIndex eq '0'}">
					<ui:include src="/xhtml/sc/supplierFinalization/preparation/meetingDtls.xhtml"></ui:include>
				</c:if> 
				<c:if test="#{suppFinalizationBackingBean.managedBean.prepareActiveIndex eq '1'}">
					<ui:include src="/xhtml/sc/supplierFinalization/preparation/committeeDtls.xhtml"></ui:include>
				</c:if> 
				<c:if test="#{suppFinalizationBackingBean.managedBean.prepareActiveIndex eq '2'}">
					<ui:include src="/xhtml/sc/supplierFinalization/preparation/meetingAttendanceDtls.xhtml"></ui:include>
				</c:if> 
			</td>
		</tr>
	</table>

</ui:composition>
