<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="cloneDialogId" header="#{lbl['lbl.sc.clone.committee']}"
		widgetVar="cloneMemberWidgetVar" width="950" height="600" position="top"
		styleClass="cloneAddMember">

		<p:panel id="cloneSearchPanel" header="#{lbl['lbl.sc.search']}" toggleable="true">
			<table width="900px">
				<tr>
					<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
							style="width:650px;" maxlength="100" /></td>
				</tr>
				<tr>
					<td style="width: 165px;"><p:outputLabel
							value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td style="width: 285px;"><p:inputText
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
							style="width:210px;" maxlength="21" /></td>
					<td style="width: 165px;"><p:outputLabel
							value="#{lbl['lbl.sc.procurement.mode']}" /></td>
					<td style="width: 285px;"><p:selectOneMenu
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
							style="width: 210px;margin-bottom: 5px;">
							<f:selectItems
								value="#{suppFinalMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar id="datecreatedfrm" showOn="button"
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							size="29" readonlyInput="true" style="width:180px;">
							<p:ajax event="dateSelect" update="datecreatedto" />
						</p:calendar></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar id="datecreatedto" showOn="button"
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
							mindate="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							size="29" readonlyInput="true" style="width:180px;">
							<f:attribute name="startDate"
								value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
					<td><p:calendar
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}"
							id="pbdateFrom" showOn="button" size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<p:ajax event="dateSelect" update="pbdateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
					<td><p:calendar id="pbdateTo" showOn="button"
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toPublishDate}"
							mindate="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}"
							size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<f:attribute name="startDate"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
					<td><p:calendar
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}"
							id="cldateFrom" showOn="button" size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<p:ajax event="dateSelect" update="cldateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
					<td><p:calendar id="cldateTo" showOn="button"
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toClosingDate}"
							mindate="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}"
							size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<f:attribute name="startDate"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td>
						<p:selectOneMenu style="width: 178px;margin-bottom: 5px;"
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItem itemLabel="#{lbl['lbl.sc.active']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sc.sf.non.active']}" itemValue="2" />
						</p:selectOneMenu>
					</td>
					<td />
					<td />
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					style="float:right;"
					action="#{suppFinalMeetingBackingBean.cloneResetAction}"
					update="cloneSearchPanel" 
					resetValues="true"
					partialSubmit="true" 
					process="@this" />

				<p:commandButton value="#{lbl['lbl.btn.search']}"
					style="float:right;" 
					action="#{suppFinalMeetingBackingBean.cloneSearchAction}"
					update="cloneCommitteeSearchTbl" 
					partialSubmit="true"
					process="@parent" />
			</div>
			<br />
			<br />
		</p:panel>
		
		<p:spacer height="3" />
		<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
			<p:dataTable id="cloneCommitteeSearchTbl"
				value="#{suppFinalMeetingBackingBean.managedBean.cloneSearchQTDataModel}"
				rowKey="#{scQt}" selectionMode="single" var="scQt" lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				styleClass="cloneResults">

				<ac:paginator for="cloneCommitteeSearchTbl" />

				<p:ajax event="rowSelect" update=":form:cloneCommitteeTbl" 
					listener="#{suppFinalMeetingBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.qtn.no']}">
					<h:outputText value="#{scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
					<h:outputText
						value="#{suppFinalMeetingBackingBean.getParameterDesc(scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.created.date']}">
					<h:outputText value="#{scQt.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.published.date']}">
					<h:outputText value="#{scQt.publishDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.closing.date']}">
					<h:outputText value="#{scQt.closingDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.status']}">
					<h:outputText value="#{suppFinalMeetingBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel id="committeeDtlPanel"
			header="#{lbl['lbl.sc.committee.details']}" toggleable="true">

			<p:dataTable id="cloneCommitteeTbl" var="committeeMember"
				value="#{suppFinalMeetingBackingBean.managedBean.cloneCommitteMembers}"
				selection="#{suppFinalMeetingBackingBean.managedBean.cloneCommitteMembersSelect}"
				rowKey="#{committeeMember.committeeMemberId}">
				<ac:paginator for="cloneCommitteeTbl" />

				<p:column selectionMode="multiple" style="width:2%"></p:column>
				
				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{committeeMember.memberName}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText value="#{committeeMember.designation}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{committeeMember.email}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{committeeMember.grade}"></h:outputText>
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText value="#{committeeMember.PNP ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.role']}">
					<h:outputText value="#{suppFinalMeetingBackingBean.getRoleDesc(committeeMember.pmUser)}"></h:outputText>
				</p:column>
			</p:dataTable>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					style="float:right;" 
					onclick="cloneMemberWidgetVar.hide();" />
				
				<p:commandButton value="#{lbl['lbl.btn.ok']}" 
					style="float:right;"
					process="@this,committeeDtlPanel" 
					partialSubmit="true"
					actionListener="#{suppFinalMeetingBackingBean.cloneAction}"
					onclick="committeeMemberWidVar.hide();"
					oncomplete="committeeMemberWidVar.paginator.endLink.click();"
					update="memberListTbl" />
			</div>
		</p:panel>
	</p:dialog>
	
</ui:composition>
