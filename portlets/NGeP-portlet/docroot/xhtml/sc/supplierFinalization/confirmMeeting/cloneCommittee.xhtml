<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneDialogId" header="Clone Committee"
		widgetVar="cloneMemberWidgetVar" modal="true" width="800" height="800"
		position="top">

		<p:panel id="cloneSearchPanel" header="Search" toggleable="true">
			<table>
				<tr>
					<td valign="top">
						<p:outputLabel value="#{lbl['lbl.sc.title']}" />
					</td>
					<td colspan="3">
						<p:inputText
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
							size="92" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" />
					</td>
					<td>
						<p:inputText
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
							size="30" />
					</td>
					<td />
					<td />
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.committe.clone.procurementmode']}" />
					</td>
					<td>
						<p:selectOneMenu
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems value="#{suppFinalMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu>
					</td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.date.created']}" /></td>
					<td>
						<p:calendar
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="30" showOn="button" />
					</td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.date.created.to']}" /></td>
					<td>
						<p:calendar
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
							size="30" showOn="button" />
					</td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td>
						<p:selectOneMenu style="width: 178px;margin-bottom: 5px;"
							value="#{suppFinalMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Non-Active" itemValue="2" />
						</p:selectOneMenu>
					</td>
					<td />
					<td />
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					style="float:right;"
					action="#{suppFinalMeetingBackingBean.resetClone}"
					update="cloneSearchPanel" 
					icon="ui-icon-reset" 
					resetValues="true"
					partialSubmit="true" 
					process="@this" />

				<p:commandButton value="#{lbl['lbl.btn.search']}"
					style="float:right;" 
					icon="ui-icon-search"
					action="#{suppFinalMeetingBackingBean.cloneSearchCommitteAction}"
					update="cloneCommitteeSearchTbl" 
					partialSubmit="true"
					process="@parent" />
			</div>
			<br />
			<br />
		</p:panel>
		
		<p:spacer height="3" />
		<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
			<p:dataTable id="cloneCommitteeSearchTbl"
				value="#{suppFinalMeetingBackingBean.managedBean.cloneTenderList}"
				rowKey="#{scQt}" selectionMode="single" var="scQt"
				styleClass="cloneResults">

				<ac:paginator for="cloneCommitteeSearchTbl" />

				<p:ajax event="rowSelect" update=":form:cloneCommitteeTbl" 
					listener="#{suppFinalMeetingBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.qtn.no']}">
					<h:outputText value="#{scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
					<h:outputText
						value="#{suppFinalMeetingBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.created.date']}">
					<h:outputText value="#{scQt.createdDate}">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.status']}">
					<h:outputText value="#{scQt.qtStatus.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel id="committeeDtlPanel"
			header="#{lbl['lbl.sc.committee.details']}" toggleable="true">

			<p:dataTable id="cloneCommitteeTbl" var="committeeMember"
				value="#{suppFinalMeetingBackingBean.managedBean.cloneCommitteMemebers}"
				selection="#{suppFinalMeetingBackingBean.managedBean.cloneCommitteMemebersSelect}"
				rowKey="#{committeeMember.committeeMemberId}">
				<ac:paginator for="cloneCommitteeTbl" />

				<p:column selectionMode="multiple" style="width:2%"></p:column>
				
				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{committeeMember.memberName}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.id.no']}">
					<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText value="#{committeeMember.designation}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{committeeMember.email}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{committeeMember.grade}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.pnp']}">
					<h:outputText value="#{committeeMember.PNP}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.role']}">
					<h:outputText value="#{committeeMember.memberRole}"></h:outputText>
				</p:column>
			</p:dataTable>
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					style="float:right;" 
					icon="ui-icon-cancel"
					onclick="cloneMemberWidgetVar.hide();" />
				
				<p:commandButton value="#{lbl['lbl.btn.ok']}" 
					style="float:right;"
					process="@this,committeeDtlPanel" 
					partialSubmit="true"
					actionListener="#{suppFinalMeetingBackingBean.cloneCommitteeDtls}"
					onclick="cloneMemberWidgetVar.hide();"
					oncomplete="committeeMemberWidVar.paginator.endLink.click();"
					icon="ui-icon-check" 
					update="memberListTbl" />
			</div>
		</p:panel>
	</p:dialog>
	
</ui:composition>
