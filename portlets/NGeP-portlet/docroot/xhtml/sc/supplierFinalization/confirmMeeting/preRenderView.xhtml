<ui:composition template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<ui:define name="contentSection">
		<c:if test="#{suppFinalMeetingBackingBean.managedBean.hasErrors}">
			<p:messages showDetail="true" showSummary="false" 
						autoUpdate="true" closable="true" severity="error, info" />	
		</c:if>		
		<f:event listener="#{suppFinalMeetingBackingBean.preRenderView}" type="preRenderView" />
	</ui:define>
</ui:composition>
