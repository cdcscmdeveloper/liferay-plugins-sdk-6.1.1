<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newMemberDialogId" header="#{lbl['lbl.sc.new']} #{suppFinalMeetingBackingBean.managedBean.tabTitle}"
		widgetVar="newMemberWidgetVar" modal="true" position="top">

		<p:panel toggleable="true" styleClass="qtAddMember" id="addPanel">
			<p:messages id="addMessages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
			<h:panelGrid columns="3" styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
				<h:outputLabel value="#{lbl['lbl.sc.selection']}" />
				
				<p:selectOneRadio id="selection" value="#{suppFinalMeetingBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems value="#{suppFinalMeetingBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{suppFinalMeetingBackingBean.userSelectionAction}"
						update="newMemberPanel" process="@this">
					</p:ajax>
				</p:selectOneRadio>
			</h:panelGrid>

			<p:panel id="newMemberPanel" style="width:100%;margin-top:10px;">
				<c:if test="#{suppFinalMeetingBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true">
						<table>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.name']}" />
								</td>
								<td colspan="3">
									<p:inputText value="#{suppFinalMeetingBackingBean.managedBean.name}" size="64" />
								</td>
							</tr>
							<tr>
								<td style="width: 110px;">
									<p:outputLabel value="#{lbl['lbl.sc.id.type']}" />
								</td>
								<td>
									<p:selectOneMenu
										value="#{suppFinalMeetingBackingBean.managedBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems value="#{suppFinalMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu>
								</td>
								<td/>
								<td/>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.id.no']}" />
								</td>
								<td>
									<p:inputText
										value="#{suppFinalMeetingBackingBean.managedBean.identificationNo}"
										size="30" />
									</td>
								<td/>
								<td/>
							</tr>
						</table>
					</p:panel>
					
					<p:commandButton value="#{lbl['lbl.btn.reset']}" 
						style="float:right;"
						action="#{suppFinalMeetingBackingBean.committeeResetAction}"
						update="newMemberPanel" 
						icon="ui-icon-reset"
						resetValues="true" 
						partialSubmit="true" 
						process="@this" />

					<p:commandButton value="#{lbl['lbl.btn.search']}" 
						style="float:right;"
						icon="ui-icon-search"
						action="#{suppFinalMeetingBackingBean.committeeSearchAction}"
						update="@(.existingCommitteeResults)" 
						partialSubmit="true"
						process="@parent" />
					<br/><br/>
					
					<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
						<p:dataTable id="existingMemberTbl" 
							widgetVar="existingMemberWidVar"
							value="#{suppFinalMeetingBackingBean.managedBean.externalUsers}"
							selection="#{suppFinalMeetingBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existingMember.userId}" 
							var="existingMember"
							styleClass="existingCommitteeResults" 
							style="width : 900px;">
							<ac:paginator for="existingMemberTbl" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.sc.name']}">
								<h:outputText value="#{existingMember.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.id.no']}">
								<h:outputText value="#{existingMember.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.designation']}">
								<h:outputText value="#{existingMember.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.email']}">
								<h:outputText value="#{existingMember.email}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.grade']}">
								<h:outputText value="#{existingMember.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.pnp']}">
								<h:outputText value="#{existingMember.PMP ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.role']}">
								<h:outputText value="#{lbl['lbl.sc.chairperson']}" rendered="#{existingMember.PMP}"/>
								<p:selectOneMenu id="appaction" rendered="#{!existingMember.PMP}"
									value="#{existingMember.memberRole.parameterId}" style="width: 110px;margin-bottom: 5px;">
									<f:selectItems value="#{suppFinalMeetingBackingBean.getRoleTypeDropdownValues(ParameterTypeConst.committeeRole)}" />
								</p:selectOneMenu>
							</p:column>
						</p:dataTable>
					</p:panel>
				</c:if>
				
				<c:if test="#{suppFinalMeetingBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="#{lbl['lbl.sc.new.user']}" toggleable="true">
						<table>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.name']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td colspan="3">
									<p:inputText id="userName" required="true" size="30" 
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.memberName}"/>
									<p:message id="userId" for="userName" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td style="width: 125px;">
									<p:outputLabel value="#{lbl['lbl.sc.id.type']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:selectOneMenu id="identificationType" required="true"
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems value="#{suppFinalMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu>
									<p:message id="identificationTypeId" for="identificationType" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.id.no']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:inputText id="identificationNo" required="true" size="30" 
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.icPassport}" />
									<p:message id="identificationNoId" for="identificationNo" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.grade']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:inputText id="grade" required="true" size="30" 
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.grade}" />
									<p:message id="gradeId" for="grade" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.pnp']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:selectOneRadio id="pnp" required="true"
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
										<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
									</p:selectOneRadio>
									<p:message id="pnpId" for="pnp" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.designation']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:inputText id="designation" required="true" size="30" 
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.designation}"/>
									<p:message id="designationId" for="designation" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.email']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:inputText id="email" required="true" size="30" 
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.email}"/>
									<p:message id="emailId" for="email" display="icon"></p:message>
								</td>
							</tr>
							<tr>
								<td>
									<p:outputLabel value="#{lbl['lbl.sc.role']}" />
									<p:outputLabel value="#{lbl['lbl.txt.mandatory']}" styleClass="mandatory" />
								</td>
								<td>
									<p:selectOneMenu id="memberRole" required="true"
										value="#{suppFinalMeetingBackingBean.managedBean.committeMember.memberRole}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems value="#{suppFinalMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu>
									<p:message id="memberRoleId" for="memberRole" display="icon"></p:message>
								</td>
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					process="@this, newMemberPanel, addPanel"
					action="#{suppFinalMeetingBackingBean.committeeOkAction}"
					ajax="true" icon="ui-icon-check" 
					update="memberListTbl, addPanel" />
	
				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" 
					process="@this"
					oncomplete="newMemberWidgetVar.hide();" 
					icon="ui-icon-cancel" />
			</div>
		</p:panel>

	</p:dialog>
</ui:composition>
