<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
	  
		<table style="border: 0px;width:100%; align:center">
			<tr>
				<td> 
					<td width="100%" align="left" valign="top">
						<p:messages id="confirmMeeting" showDetail="true" showSummary="false" autoUpdate="true" closable="true" />
						
						<div align="right">
							<p:commandButton value="#{lbl['lbl.btn.save']}" 
								process="@all"
								partialSubmit="true"
								action="#{suppFinalMeetingBackingBean.saveAction}"
								update="@form"/>
							
							<ui:repeat var="bpmAction" value="#{suppFinalMeetingBackingBean.managedBean.outComes}">
								<ui:fragment rendered="#{bpmAction ne '~'}">
									<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
									<p:commandButton value="#{lbl[buttonLabel]}" 
										styleClass="ui-button"
										style="float:right;" 
										process="@all" 
										partialSubmit="true"
										action="#{suppFinalMeetingBackingBean.submitAction(bpmAction)}" />
								</ui:fragment>
							</ui:repeat>
						</div>
						<ui:include src="/xhtml/sc/supplierFinalization/confirmMeeting/suppFinalizationHeader.xhtml"></ui:include>

						<p:panel header="#{lbl['lbl.sc.meeting.details']}" id="meetingDetailPanel" toggleable="true">
							<p:dataTable id="meetingTbl"
								var="meeting" widgetVar="meetingDtls"
								rowKey="#{meeting}" rowIndexVar="rowIndex"
								editable="true" style="width:100%"
								value="#{suppFinalMeetingBackingBean.managedBean.scQtMeetings}">
								<ac:paginator for="meetingTbl" />
								
								<p:column style="width:20px;">
									<f:facet name="header">
										<p:selectBooleanCheckbox id="selAllChk" value="#{suppFinalMeetingBackingBean.managedBean.selectAll}">
											<p:ajax partialSubmit="true" process="@this" update="meetingTbl"  listener="#{suppFinalMeetingBackingBean.selectAll(suppFinalMeetingBackingBean.managedBean.selectAll, suppFinalMeetingBackingBean.managedBean.scQtMeetings)}" />
										</p:selectBooleanCheckbox>
									</f:facet>
									<p:selectBooleanCheckbox id="selectMeeting" value="#{meeting.selected}">
										<p:ajax partialSubmit="true" process="@this" update="@this"/>
									</p:selectBooleanCheckbox>
								</p:column>								
								
								<p:column headerText="#{lbl['lbl.sc.meeting.date']}"
									style="width:30%;" styleClass="mandatory">
									<p:calendar value="#{meeting.meetingDate}" id="meetingDate"
										showOn="button"
										mindate="#{suppFinalMeetingBackingBean.managedBean.currentDate}"
										pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" 
										label="#{lbl['lbl.sc.meeting.date']}" 
										required="true">
									   <p:ajax process="@this" partialSubmit="true"
												update="@this,mtgDate" />										
									</p:calendar>
									<p:message id="mtgDate" for="meetingDate" display="icon" showDetail="false"></p:message>									
								</p:column>
								
								<p:column headerText="#{lbl['lbl.sc.meeting.location']}">
									<p:inputTextarea value="#{meeting.meetingLocation}" id="meetingLocation" rows="2" cols="100" maxlength="255"
										label="#{lbl['lbl.sc.meeting.location']}" required="true">
										<p:ajax process="@this" partialSubmit="true"
												update="@this,mtgLoc" />
									</p:inputTextarea>
									<p:message id="mtgLoc" for="meetingLocation" display="icon" showDetail="false"></p:message>
								</p:column>
							</p:dataTable>
							
							<p:spacer height="10"></p:spacer>
							<div align="right">
								<p:commandButton value="#{lbl['lbl.btn.add']}"
									process="@this,meetingTbl" 
									partialSubmit="true"
									action="#{suppFinalMeetingBackingBean.meetingAddAction}"
									oncomplete="meetingDtls.paginator.endLink.click();"
									update="meetingTbl" />
									
								<p:commandButton value="#{lbl['lbl.btn.delete']}" 
									process="@this"
									partialSubmit="true"
									action="#{suppFinalMeetingBackingBean.meetingDeleteAction}"
									update="@([id$=meetingDetailPanel])"/>
							</div>
						</p:panel>

						<p:panel header="#{lbl['lbl.sc.committee.member.list']}" id="memberListPanel" toggleable="true">
							<h:outputText styleClass="instruction"
								value="#{lbl['lbl.sc.committee.member.list.instruction']}"
								escape="false" />
								
							<p:dataTable id="memberListTbl" 
								var="committeeMember"
								widgetVar="committeeMemberWidVar"
								value="#{suppFinalMeetingBackingBean.managedBean.committeeMembersList}"
								rowKey="#{committeeMember}" update="@this" selectionMode="single">
								<ac:paginator for="memberListTbl" />
								
								<p:ajax event="rowSelect" listener="#{suppFinalMeetingBackingBean.selectMemberEvent}" 
										update="@([id$=memberListTbl])"></p:ajax>								
					
								<p:column style="width:20px;">
									<f:facet name="header">
										<p:selectBooleanCheckbox id="selAllMemChk" value="#{suppFinalMeetingBackingBean.managedBean.selectAllMembers}"
											disabled="#{committeeMember.memberRole.parameterCode ne ParameterConst.committeeRoleMember}">
											<p:ajax partialSubmit="true" process="@this" update="memberListTbl"  
													listener="#{suppFinalMeetingBackingBean.selectAllMembers(
																	suppFinalMeetingBackingBean.managedBean.selectAllMembers)}" />
										</p:selectBooleanCheckbox>
									</f:facet>
									<p:selectBooleanCheckbox id="selectMember" value="#{committeeMember.selected}" 
									 		disabled="#{committeeMember.memberRole.parameterCode ne ParameterConst.committeeRoleMember}">
										<p:ajax partialSubmit="true" process="@this" update="@this" 
												listener="#{suppFinalMeetingBackingBean.selectMemberEvent(committeeMember)}"/>
									</p:selectBooleanCheckbox>
								</p:column>										
								
								<p:column headerText="#{lbl['lbl.sc.name']}" style="white-space:normal;">
									<h:outputText value="#{committeeMember.memberName}"></h:outputText>
								</p:column>
					
								<p:column headerText="#{lbl['lbl.sc.identification.no']}">
									<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
								</p:column>
					
								<p:column headerText="#{lbl['lbl.sc.designation']}" style="white-space:normal;">
									<h:outputText value="#{committeeMember.designation}"></h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.sc.email']}">
									<h:outputText value="#{committeeMember.email}"></h:outputText>
								</p:column>
					
								<p:column headerText="#{lbl['lbl.sc.grade']}">
									<h:outputText value="#{committeeMember.grade}"></h:outputText>
								</p:column>
					
								<p:column>
									<f:facet name="header">
										<h:outputText value="#{lbl['lbl.sc.pnp']}" />
										<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
									</f:facet>
									<h:outputText value="#{committeeMember.PNP ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"></h:outputText>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.sc.role']}">
									<h:outputText value="#{suppFinalMeetingBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, ParameterConst.committeeRoleChairperson)}" 
										rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleChairperson}" />
										
									<h:outputText value="#{suppFinalMeetingBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, ParameterConst.committeeRoleSecretary)}" 
										rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleSecretary}" />	
																	
									<p:selectOneMenu id="meetingRoleId" required="true" 
										rendered="#{(committeeMember.memberRole.parameterCode ne ParameterConst.committeeRoleChairperson and
														committeeMember.memberRole.parameterCode ne ParameterConst.committeeRoleSecretary)}"
										label="#{lbl['lbl.sc.role']}"
										value="#{committeeMember.memberRole.parameterCode}" style="width: 110px;margin-bottom: 5px;">
										<f:selectItems value="#{suppFinalMeetingBackingBean.getMemberRoleTypeDropdownValues()}" />
									</p:selectOneMenu>
									<p:message id="meetingRoleMsg" for="meetingRoleId" display="icon"></p:message>
								</p:column>
								
								<p:column headerText="#{lbl['lbl.sc.representative.type']}">
									<p:selectOneMenu value="#{committeeMember.representativeType.parameterCode}" 
										label="#{lbl['lbl.sc.representative.type']}"
										style="width: 100%;margin-bottom: 5px;" required="true" 
										rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleMember}">
										<f:selectItems value="#{suppFinalMeetingBackingBean.getRepresentativeTypeDropdownValues()}" />
										<p:ajax event="change" 
											listener="#{suppFinalMeetingBackingBean.representativeTypeEvent(committeeMember,committeeMember.representativeType.parameterCode)}" process="@this" />
									</p:selectOneMenu>
								</p:column>
							</p:dataTable>
					
							<p:spacer height="10"></p:spacer>
							<div align="right">
								<p:commandButton value="#{lbl['lbl.btn.clone']}"
									process="@this" 
									oncomplete="cloneMemberWidgetVar.show();"
									actionListener="#{suppFinalMeetingBackingBean.clonePopupAction}"
									update="form:cloneDialogId"  />
								
								<p:commandButton value="#{lbl['lbl.btn.add']}" 
									process="@this"
									actionListener="#{suppFinalMeetingBackingBean.addPopupAction}"
									update=":form:newMemberDialogId"
									oncomplete="newMemberWidgetVar.show();" />
								
								<p:commandButton value="#{lbl['lbl.btn.delete']}"
									action="#{suppFinalMeetingBackingBean.committeeDeleteAction}"
									update="memberListTbl" />
							</div>
						</p:panel>

						<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
							<table style="width: 100%" id="remarkslist">
								<tr>
									<td class="TableFieldLeft" style="width: 96px;">
										<p:outputLabel value="#{lbl['lbl.sc.remark']}" />
									</td>
									
									<td class="TableFieldRight">
										<p:dataGrid var="remarkVar"
											value="#{suppFinalMeetingBackingBean.managedBean.qtCommitteeRemarks}"
											rowIndexVar="remarkIndex" columns="1">
											<table>
												<tr>
													<td rowspan="2" valign="top">
														<h:graphicImage height="30"
															value="#{suppFinalMeetingBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
															width="30" />
													</td>
													<td width="5"></td>
													<td>
														<h:outputText value="#{remarkVar.createdUser.userName}" />,
														<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
															<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
														</h:outputText>
													</td>
												</tr>
												<tr>
													<td></td>
													<td>
														<p:inputTextarea cols="40" value="#{remarkVar.remark}"
															rendered="#{remarkVar.remarkId eq null}">
															<p:ajax partialSubmit="true" process="@this" update="@this" />
														</p:inputTextarea> 
														<h:outputText value="#{remarkVar.remark}"
															rendered="#{remarkVar.remarkId ne null}"
															style="display: inline-block; width:220px;word-wrap: break-word;" />
													</td>
												</tr>
											</table>
										</p:dataGrid>
									</td>
								</tr>
							</table>
						</p:panel>
						
						<ui:include src="addExistingCommittee.xhtml" />
						<ui:include src="cloneCommittee.xhtml" />
					</td>
				</td>
			</tr>
		</table>
		
	</ui:define>
</ui:composition>
