<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="#{CommonUIConstant.imagePath}/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="confirmMeeting" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info" />
		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				styleClass="BtnSpacing"
				action="#{suppFinalMeetingBackingBean.navigateToUpdateMember('back')}" />
		</div>
		<ui:include src="/xhtml/sc/supplierFinalization/confirmMeeting/suppFinalizationHeader.xhtml"></ui:include>
		<p:panel id="committeeHistoryId"
			header="#{lbl['lbl.sc.header.committeelist']}" toggleable="true">
			<ac:committeeHistoryPanel
				historyPaginator="#{suppFinalMeetingBackingBean.managedBean.historyPaginator}"
				selectedHistory="#{suppFinalMeetingBackingBean.managedBean.selectedCommitteeHistory}"
				memberHistoryPaginator="#{suppFinalMeetingBackingBean.managedBean.memberHistoryPaginator}"
				onSelectHistory="onSelectHistory"
				committeeName="#{suppFinalMeetingBackingBean.managedBean.currentCommitteeType}"
				backingBean="#{suppFinalMeetingBackingBean}" 
				isSFCommittee="true"/>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.committee.member.list']}"
			styleClass="header-spacing" id="memberListPanel" toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.committee.member.list.instruction']}"
				escape="false" />

			<p:dataTable id="memberListTbl" var="committeeMember"
				widgetVar="committeeMemberWidVar"
				value="#{suppFinalMeetingBackingBean.managedBean.committeeMembersList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{committeeMember}" update="@this" selectionMode="single"
				rowIndexVar="index">
				<ac:paginator for="memberListTbl" />

				<!-- 	<p:ajax event="rowSelect" listener="#{suppFinalMeetingBackingBean.selectMemberEvent}" 
										update="@([id$=memberListTbl])"></p:ajax>	 -->

				<p:column styleClass="td-check-box-spacing">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllMemChk"
							value="#{suppFinalMeetingBackingBean.managedBean.selectAllMembers}"
							disabled="true">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=memberListPanel])"
								listener="#{suppFinalMeetingBackingBean.selectAll(
																	suppFinalMeetingBackingBean.managedBean.selectAllMembers,suppFinalMeetingBackingBean.managedBean.committeeMembersList)}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox id="selectMember"
						value="#{committeeMember.selected}"
						disabled="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleSecretary}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=memberListPanel])" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.name']}"
					style="white-space:normal;">
					<h:outputText value="#{committeeMember.memberName}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}"
					style="white-space:normal;">
					<h:outputText value="#{committeeMember.designation}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{committeeMember.email}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{committeeMember.grade}"></h:outputText>
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}"
							value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{committeeMember.PNP ? lbl['lbl.txt.yes'] : lbl['lbl.txt.no']}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.role']}">
					<h:outputText
						value="#{suppFinalMeetingBackingBean.getFCMemberRole(committeeMember.memberRole)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.representative.type']}">
					<p:selectOneMenu value="#{committeeMember.representativeTypeId}"
						label="#{lbl['lbl.sc.representative.type']}"
						style="width: 100%; margin-bottom: 5px; white-space:normal"
						rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleMember}">
						<f:selectItems
							value="#{suppFinalMeetingBackingBean.getRepresentativeTypeDropdownValues(suppFinalMeetingBackingBean.managedBean.committeeType)}" />
						<p:ajax event="change"
							listener="#{suppFinalMeetingBackingBean.representiveTypeChangedListener(committeeMember)}"
							process="@this" />
					</p:selectOneMenu>
				</p:column>
			</p:dataTable>
			<div align="right" class="BtnSpacing">
				<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this"
					actionListener="#{suppFinalMeetingBackingBean.addPopupAction}"
					update="@([id$=memberDialogId])"
					oncomplete="memberWidgetVar.show();" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					oncomplete="dlgPerformDel.show();" process="@this,memberListTbl"
					partialSubmit="true"
					update="@([id$=#{supplierFinalizationConfirmmeetingCommitteemembersDeleteId}])"
					disabled="#{suppFinalMeetingBackingBean.deleteselectedList(suppFinalMeetingBackingBean.managedBean.committeeMembersList)}" />
			</div>
			<ui:param
				name="supplierFinalizationConfirmmeetingCommitteemembersDeleteId"
				value="supplierFinalizationConfirmmeetingCommitteemembersDeleteId"></ui:param>
			<ac:confirmationPopup
				id="#{supplierFinalizationConfirmmeetingCommitteemembersDeleteId}"
				widget="dlgPerformDel" width="450" height="100"
				okAction="suppFinalMeetingBackingBean.committeeDeleteAction"
				title="#{lbl['lbl.sc.committee.member.list']}"
				content="#{lbl['lbl.sc.dialog.confirm.message']}"
				update="@([id$=memberListPanel])" />
		</p:panel>
		<ac:scRemarkAndAttachment
						remarkList="#{suppFinalMeetingBackingBean.managedBean.qtCommitteeRemarks}"
						showAttachment="false" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.update']}" action="#{suppFinalMeetingBackingBean.navigateToUpdateMember('confirm')}" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" action="#{suppFinalMeetingBackingBean.navigateToUpdateMember('back')}" />
		</div>
		<ui:include src="addExistingCommittee.xhtml" />
		<ac:confirmationPopup rendered="#{suppFinalMeetingBackingBean.managedBean.finalBB != null}" id="confirmSubmitCommitteePopupId"
			widget="confirmSubmitCommitteePopup" width="490"
			height="100"
			okAction="suppFinalMeetingBackingBean.submitAction('SUBMIT')"
			title="#{lbl['lbl.sc.confirmation']}"
			content="#{lbl['lbl.sc.popup.sendproposalevalConfirm']}"/> 		
	</ui:define>
</ui:composition>
