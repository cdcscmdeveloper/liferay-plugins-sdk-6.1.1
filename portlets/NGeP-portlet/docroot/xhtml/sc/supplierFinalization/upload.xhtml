<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:remove>
		<ac:scSingleFileUploadPopup widgetVar="briefingReportAttWidget"
			fileUploadListener="suppFinalizationBackingBean.handleReportFileUpload"
			update="@([id$=reportTbl])" 
			readonly="#{!(isSecretaryUser or isBPKTaskAndClaimed)}" />
	</ui:remove>
	
	<ac:scSingleFileUploadPopup widgetVar="endorseReportAttWidget"
		fileUploadListener="suppFinalizationBackingBean.handleEndorseReportUpload"
		update="@([id$=endorseReportUploadBtnId],[id$=endorseReportTbl])"
		readonly="#{!(isSecretaryUser )}" />
	
	<ui:remove>	
		<ac:scSingleFileUploadPopup widgetVar="kertasTaklimUploadAttWidget"
				fileUploadListener="suppFinalizationBackingBean.handleKertasFileUpload"
				update="@([id$=reportTbl])" 
				fileType="#{CommonConstants.FILE_UPLOAD_DOC_TYPE}" 
				invalidFileMessage="#{lbl['lbl.txt.upload.doc.file']}" 
				readonly="#{!(isSecretaryUser or isBPKTaskAndClaimed)}" />
	</ui:remove>
			
	<ac:scSingleFileUploadPopup widgetVar="sfBriefingReportAttWidget"
		fileUploadListener="suppFinalizationBackingBean.handleFileUpload"
		update="@([id$=sfBriefingReportUploadBtn],[id$=uploadBP])" />


</ui:composition>
