<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:remove>
		Enhancement #21694
	</ui:remove>
	<p:panel id="fcReversalDetails" header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="fcareqdtlsid"
			value="#{qTDetailBB.managedBean.scQtReverse}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="reverseDetails" >
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{qTDetailBB.getParameterDesc(reverseDetails.typeOfRequest.parameterType,reverseDetails.typeOfRequest.parameterCode)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.from.value']}">
				
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.to.value']}">
				
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel id="fcappoint" header="#{lbl['lbl.sc.qt.approver.selection']}" toggleable="true">
	<p:dataTable id="finalizationsecretaryid"
			value="#{qTDetailBB.managedBean.scQtReverse}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="approverSettings">
			<p:column headerText="#{lbl['lbl.sc.finalization.committee']}" width="30%">
				<p:selectOneMenu id="fcApprovalId" disabled="#{qTDetailBB.managedBean.approvalEditableSection}"
							value="#{approverSettings.finalizationCommitte.parameterId}"
							style="width:75%;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="secretary"
								value="#{qTDetailBB.managedBean.finalizationSecratary}"/>
						<p:ajax event="change" update="commTypes" process="@this"
								listener="#{qTDetailBB.changeReversePbSecretaryCommType(approverSettings)}"
								partialSubmit="true" />
					</p:selectOneMenu>	
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.secretary.name']}" width="70%">
				<h:panelGroup id="commTypes">
					<p:selectOneMenu id="usersSecretaryId" disabled="#{qTDetailBB.managedBean.approvalEditableSection}"
								value="#{approverSettings.finalizationSecratery.userId}"
								style="width:90%;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems var="usersSecretary"
									value="#{qTDetailBB.retrievePmUserSecratryDtl(approverSettings.finalizationCommitte.parameterCode)}"
									itemLabel="#{usersSecretary.userName}"
									itemValue="#{usersSecretary.userId}" />
								<p:ajax event="change"
									listener="#{qTDetailBB.updateReverseUserIdToSettings}" process="@this"
									partialSubmit="true" update="@this" />
					</p:selectOneMenu>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
		<h:panelGrid columns="2" border="0" style="text-align: right;">
			<h:panelGroup><p:outputLabel value="#{lbl['lbl.ct.reverseMeeting']}" /></h:panelGroup>
			<h:panelGroup><p:selectOneRadio disabled="#{!qTDetailBB.managedBean.editable}"
						value="#{qTDetailBB.managedBean.scQtReverse.meeting}">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}"
							itemValue="true"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}"
							itemValue="false" ></f:selectItem>
					</p:selectOneRadio></h:panelGroup>
		</h:panelGrid>
		
	</p:panel>	
	<c:if test="#{!empty qTDetailBB.managedBean.scLoiForQt}">
		<ac:scRemarkAndAttachment
				remarkList="#{qTDetailBB.managedBean.scLoiReverseRemarks}"
				attachmentList="#{qTDetailBB.managedBean.scQtReverse.scLoiReverseAttachments}"
				readonly="#{!qTDetailBB.managedBean.editable}"
				fileUploadListener="qTDetailBB.handleFileUploadLoiReversal" />
	</c:if>
	<c:if test="#{!empty qTDetailBB.managedBean.scLoaForQt}">
		<ac:scRemarkAndAttachment
				remarkList="#{qTDetailBB.managedBean.scLoaReverseRemarks}"
				attachmentList="#{qTDetailBB.managedBean.scQtReverse.scLoaReverseAttachments}"
				readonly="#{!qTDetailBB.managedBean.editable}"
				fileUploadListener="qTDetailBB.handleFileUploadLoaReversal" />
	</c:if>
</ui:composition>
