<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table width="100%">
		<tr>
			<td align="right"><p:commandButton immediate="true"
					value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{qtCustomerServiceBB.navigateToCurrentPage}"
					partialSubmit="true" process="@this" /></td>
		</tr>
	</table>


	
	<p:panel
		header="#{lbl['lbl.sc.customer.service.quotation.tender.info']}"
		toggleable="true" id="dpCustomerServiceViewInfo">
		<table width="100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ministry']}" /></td>
				<td><p:inputText disabled="true" style="width:900px"
						value="#{qtCustomerServiceBB.managedBean.ministryName}"></p:inputText>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.kumpulan.ptj']}" /></td>
				<td><p:inputText disabled="true" style="width:900px"
						value="#{qtCustomerServiceBB.managedBean.kampulanPtjName}"></p:inputText>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ptj']}" /></td>
				<td><p:inputText disabled="true" style="width:65px"
						value="#{qtCustomerServiceBB.managedBean.ptjCode}"></p:inputText>
					<p:spacer width="3px;"></p:spacer> <p:inputText disabled="true"
						style="width:820px"
						value="#{qtCustomerServiceBB.managedBean.ptjName}"></p:inputText>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.document.no']}" /></td>
				<td><p:inputText disabled="true" style="width:150px"
						value="#{qtCustomerServiceBB.managedBean.customerScQt.qtNo}"></p:inputText>
				</td>
			</tr>


			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.document.title']}" />
				</td>
				<td><p:inputTextarea disabled="true" style="width:900px;margin-bottom:5px"
						rows="5" cols="150"
						value="#{qtCustomerServiceBB.managedBean.customerScQt.qtTitle}"></p:inputTextarea>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
				<td><p:inputText disabled="true" style="width:400px"
						value="#{qtCustomerServiceBB.getStatusDescById(qtCustomerServiceBB.managedBean.customerScQt.qtStatus.statusId)}"></p:inputText>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value=" #{lbl['lbl.sc.customer.service.officer.name']}" /></td>
				<td>
					<table style="width: 900px">
						<tr>
							<td><p:dataTable id="officerInfoName"
									var="customerServiceOfficers" rows="10"
									value="#{qtCustomerServiceBB.managedBean.customerServiceEntity}"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									widgetVar="tableOfficerWidgetofficer" rowIndexVar="index">
									<ac:paginator for="officerInfoName"></ac:paginator>
									<p:column style="width:2%" headerText="#{lbl['lbl.sc.no']}">
										<h:outputText value="#{index+1}" style="float:left;" />
									</p:column>
									
									
									<p:column style="width:40%;white-space:normal;"
										headerText="#{lbl['lbl.sc.customer.service.officer.name']}">
										<h:outputText
											value="#{lbl['lbl.sc.customer.service.supplier.name']}"
											rendered="#{customerServiceOfficers.status eq QTStatusConst.LOI_PENDING_SUPPLIER_ACKNOWLEDGEMENT or customerServiceOfficers.status eq QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT or customerServiceOfficers.status eq QTStatusConst.PCB_PENDING_SUPPLIER_ACCEPTANCE or customerServiceOfficers.status eq QTStatusConst.QT_PROPOSAL_PREPARATION}" />

										<h:outputText value="#{customerServiceOfficers.officerName}"
											rendered="#{customerServiceOfficers.status ne QTStatusConst.LOI_PENDING_SUPPLIER_ACKNOWLEDGEMENT and customerServiceOfficers.status ne QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT and customerServiceOfficers.status ne QTStatusConst.PCB_PENDING_SUPPLIER_ACCEPTANCE and customerServiceOfficers.status ne QTStatusConst.QT_PROPOSAL_PREPARATION}" />
									</p:column>

									<p:column style="width:18%;white-space:normal;"
										headerText="#{lbl['lbl.sc.document.type']}">
										<h:outputText value="#{customerServiceOfficers.documentType}" />
									</p:column>

									<p:column style="width:40%;white-space:normal;"
										headerText="#{lbl['lbl.sc.status']}">
										<h:outputText value="#{customerServiceOfficers.statusDesc}" />
									</p:column>


								</p:dataTable></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel
		header="#{lbl['lbl.sc.customer.service.schedule.information']}"
		toggleable="true" id="qtCustomerServiceBriefingdetailsId">
		<table>
			<tr>
				<td ><p:outputLabel
						value="#{lbl['lbl.sc.qt.customer.service.publish.date.time']}" />
				</td>
				<td><p:inputText id="publishDate"
						value="#{qtCustomerServiceBB.managedBean.customerScQt.publishDate}"
						disabled="true" style="width: 120px;margin-top:5px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></td>

			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.customer.service.close.date.time']}" /></td>
				<td><p:inputText
						value="#{qtCustomerServiceBB.managedBean.customerScQt.closingDate}"
						readonly="true" disabled="true"
						style="width: 120px;margin-top:5px">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></td>
			</tr>

			<tr>
				<td class="TableFieldLeft" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.qt.customer.service.brief.date.time']}" /></td>

				<td>
					<table style="width: 500px">
						<tr>
							<td><p:dataTable id="briefingdateId" var="briefingdtls" style="margin-bottom:5px;"
									value="#{qtCustomerServiceBB.managedBean.briefingDtlsList}"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									widgetVar="tableOfficerWidgetbrief" rowIndexVar="index">
									<p:column style="width:2%" headerText="#{lbl['lbl.sc.no']}">
										<h:outputText value="#{index+1}" style="float:left;" />
									</p:column>
									<p:column style="width:53%;white-space:normal;"
										headerText="#{lbl['lbl.sc.zone.location']}"
										rendered="#{qtCustomerServiceBB.managedBean.customerScQt.zonal}">
										<h:outputText
											value="#{briefingdtls.scQtBsv.tplSpecZoneDtl.zoneName}" />
									</p:column>
									<p:column style="width:53%;white-space:normal;"
										headerText="#{lbl['lbl.sc.date.time']}">
										<h:outputText value="#{briefingdtls.bsvDate}">
											<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText>
									</p:column>




								</p:dataTable></td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>


				<td class="TableFieldLeft" valign="top"><p:outputLabel
						value=" #{lbl['lbl.sc.qt.customer.service.sitevisit.date.time']}" />
				</td>
				<td>
					<table style="width: 500px">
						<tr>
							<td><p:dataTable id="siteVisitdateId" var="siteVisitDtls"
									value="#{qtCustomerServiceBB.managedBean.siteVisitDtlsList}"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									widgetVar="tableOfficerWidgetsitevisit" rowIndexVar="index">
									<p:column style="width:2%" headerText="#{lbl['lbl.sc.no']}">
										<h:outputText value="#{index+1}" style="float:left;" />
									</p:column>
									<p:column style="width:53%;white-space:normal;"
										headerText="#{lbl['lbl.sc.zone.location']}"
										rendered="#{qtCustomerServiceBB.managedBean.customerScQt.zonal}">
										<h:outputText
											value="#{siteVisitDtls.scQtBsv.tplSpecZoneDtl.zoneName}" />
									</p:column>
									<p:column style="width:53%;white-space:normal;"
										headerText="#{lbl['lbl.sc.date.time']}">
										<h:outputText value="#{siteVisitDtls.bsvDate}">
											<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText>
									</p:column>




								</p:dataTable></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.customer.service.total.proposals.submitted']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{qtCustomerServiceBB.managedBean.totalProposalSubmitCount}"
						style="width: 120px;margin-top:5px">
					</p:inputText></td>
			</tr>



		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.bidding.details']}" toggleable="true"
		id="qtCustomerServiceBiddingdetailsId">
		<table>

			<tr>


				<td class="TableFieldLeft"  valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.bidding.schedules']}" /></td>
				<td>
					<table style="width: 500px">
						<tr>
							<td><p:dataTable id="biddingCustomerServiceId"
									var="customerServiceBid"
									value="#{qtCustomerServiceBB.managedBean.bidScheduleList}"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									widgetVar="tableOfficerWidgetbidding" rowIndexVar="index">
									<p:column style="width:2%" headerText="#{lbl['lbl.sc.no']}">
										<h:outputText value="#{index+1}" style="float:left;" />
									</p:column>
									<p:column style="width:47%;white-space:normal;"
										headerText="#{lbl['lbl.sc.bidding.start.date.time']}">
										<h:outputText value="#{customerServiceBid.startDate}">
											<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText>
									</p:column>
									<p:column style="width:47%;white-space:normal;"
										headerText="#{lbl['lbl.sc.bidding.end.date.time']}">
										<h:outputText value="#{customerServiceBid.endDate}">
											<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText>
									</p:column>



								</p:dataTable></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.bidding.total.invited.suppliers']}" /></td>
				<td><p:inputText style="width: 120px;margin-top:5px;" readonly="true"
						value="#{qtCustomerServiceBB.totalBidSuppliersCount(qtCustomerServiceBB.managedBean.bidScheduleList)}"></p:inputText></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
