<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
		<h:panelGroup id="table-wrapper" style="width:100%;">
			<p:dataTable id="qtCustomerServiceSearchResult" value="#{qtCustomerServiceBB.qtCustomerServiceDataModel}"
				var="CustomerServiceQt"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" lazy="true" rows="10">

				<ac:paginator for="qtCustomerServiceSearchResult" />
				<p:column headerText="#{lbl['lbl.sc.no']}" style="width:4%;text-align:center">
					<h:outputText value="#{index+1}." />
				</p:column>

				

				<p:column headerText="#{lbl['lbl.sc.qtn.no']}"
					style="width:16%;">
					<h:outputText value="#{CustomerServiceQt.qtNo}"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.title']}"
					style="width:45%;white-space:normal;">
					<h:outputText value="#{CustomerServiceQt.qtTitle}"/>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.status']}" style="width:30%;white-space:normal;">
					<h:outputText value="#{qtCustomerServiceBB.getStatusDescById(CustomerServiceQt.qtStatus.statusId)}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.action']}"
					style="width:5%;text-align: center;">
					<p:commandLink id="qtcustomerserviceeditQTIcon" action="#{qtCustomerServiceBB.viewDoc(CustomerServiceQt,view.viewId,CustomerServiceQt.qtStatus.statusId)}"
						partialSubmit="true" process="@this">
						<h:graphicImage
							value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png"
							styleClass="tasklist_title1" />
					</p:commandLink>


				</p:column>
			</p:dataTable>
		</h:panelGroup>
	</p:panel>

</ui:composition>
