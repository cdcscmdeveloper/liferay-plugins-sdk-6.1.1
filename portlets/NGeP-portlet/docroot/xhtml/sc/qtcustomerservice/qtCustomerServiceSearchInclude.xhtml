<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<p:panel header="#{lbl['lbl.sc.customer.service.search']}" toggleable="true"
			id="qtCustomerServiceSearchPanel">
			<table width="1100px">
			
				<tr>
					<td>
						<p:outputLabel   value="#{lbl['lbl.sc.ptj.code']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td colspan="3">
						<ac:lov id="openPtj" lovId="PM_ORG_PROFILE_PTJ" update="@form"
						headerText="#{lbl['lbl.sc.ptj.code']}" required="true" 
						saveObject="qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.orgProfilePtjCode"
						value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.orgProfilePtjCode.orgCode}"
						size="20" readonly="true" postUpdateListener="qtCustomerServiceBB.setorgProfileData()" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel  id="searchPtjLbL" value="#{lbl['lbl.sc.ptj.name']}" />
					</td>
					<td colspan="3">
					
						<p:inputText readonly="true"  style="width:840px" value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.orgProfilePtjname.orgName}"></p:inputText>
						
						
					</td>
				</tr>
			
				<tr>
					<td style="width:165px"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.qtTitle}"
							 maxlength="100" style="width:840px" >
							 <p:ajax update="@this" process="@this"/>
							 </p:inputText>
							 </td>
				</tr>
				
				<tr>
					<td style="width: 165px;">
						  <h:outputLabel for="docNo" value="#{lbl['lbl.sc.qtn.no']}" />
					</td>
					<td style="width:385px">
						<p:inputText id="docNo"
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.qtNo}"
							maxlength="21" style="width:145px;">
							<p:ajax update="@this" process="@this"/>
							</p:inputText>
					</td>
							
					
				</tr>				
				<tr>
					<td><h:outputLabel id="crdateFromLbL" value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.createdFromDate}"
							id="crdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="crdateTo" />
						</p:calendar></td>
					<td><h:outputLabel id="crdateToLbL" value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar id="crdateTo" showOn="button"
							label="#{lbl['lbl.sc.created.date.to']}"
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.createdToDate}"
							mindate="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.createdFromDate}"
							readonlyInput="true" required="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.createdFromDate ne null or !qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.createdFromDate eq ''}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.createdFromDate}" />
								<p:ajax update="@this" process="@this"/>
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
					<td><p:calendar
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.publishFromDate}"
							id="pbdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="pbdateTo"/>
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
					<td><p:calendar id="pbdateTo" showOn="button"
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.publishToDate}"
							mindate="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.publishFromDate}"
							readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.publishFromDate}" />
							<f:validator validatorId="dateRangeValidator" />
							<p:ajax update="@this" process="@this"/>
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
					<td><p:calendar
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.closeFromDate}"
							id="cldateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="cldateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
					<td><p:calendar id="cldateTo" showOn="button"
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.closeToDate}"
							mindate="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.closeFromDate}"
							readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.closeFromDate}" />
							<f:validator validatorId="dateRangeValidator" />
							<p:ajax update="@this" process="@this"/>
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel   value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:selectOneMenu 
							value="#{qtCustomerServiceBB.managedBean.qtCustomerServiceSearchBean.qtStatus}"
							style="width: 297px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qtCustomerServiceBB.getStatusDropdownValues(ParameterConst.reqNoteMethodCode, ParameterConst.doctypeQuotation)}" />
								<p:ajax update="@this" process="@this"/>
						</p:selectOneMenu>
						</td>
				</tr>
			</table>
			
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}" update="@([id$=qtCustomerServiceSearchResult])"
					process="@this, qtCustomerServiceSearchPanel" action="#{qtCustomerServiceBB.searchQtCustomerService()}" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" action="#{qtCustomerServiceBB.qtCustomerServicereset()}"
					 update="@([id$=qtCustomerServiceSearchPanel],[id$=qtCustomerServiceSearchResult])"
					resetValues="true" partialSubmit="true"
					process="@this" />
			</div>
		</p:panel>
	
	</ui:composition>
