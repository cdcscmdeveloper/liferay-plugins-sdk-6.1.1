<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
	
		<ui:param name="isSubmitted"
			value="#{supplierProposalDetailBackingBean.isProposalSubmitted()}" />
	
		<div align="left" class="header-info">
			<table width="100%">
				<tr>
					<td width="8%"><h:outputLabel
							value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td class="header-info-text">
					
					<ui:remove>#25791 start </ui:remove>
						<p:commandLink process="@this" partialSubmit="true" styleClass="commandLink_link"
						action="#{ViewQtDetailsGeneralInfoBB.navigatetoViewQtDetailsGeneralInfo(view.viewId,supplierProposalDetailBackingBean.managedBean.qt,false)}"><ui:remove>bug #33090</ui:remove>
				<h:outputText value="#{supplierProposalDetailBackingBean.managedBean.qt.qtNo}" escape="false" />
				
				<ui:remove>#25791 end </ui:remove>
					</p:commandLink>
						
						</td>
					
					<td width="8%"><h:outputLabel value="#{lbl['lbl.sc.proposal.no']}" /></td>
					<td class="header-info-text">#{supplierProposalDetailBackingBean.managedBean.qtProposal.proposalNo}
					</td>
					
					<td width="8%"><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td class="header-info-text">#{isSubmitted ? lbl['lbl.sc.proposal.submitted.status'] : supplierProposalDetailBackingBean.getStatusDescById(supplierProposalDetailBackingBean.managedBean.qt.qtStatus.statusId)}
					</td>
					
					<td width="8%"><h:outputLabel value="#{lbl['lbl.sc.proposal.submitted.date']}" /></td>
					<td class="header-info-text"><h:outputText
							style="float : left;"
							value="#{supplierProposalDetailBackingBean.managedBean.qtProposal.lastSubmitDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText></td>
					
					<td width="8%"><h:outputLabel value="#{lbl['lbl.sc.closing.date']}" /></td>
					<td class="header-info-text"><h:outputText
							style="float : left;"
							value="#{supplierProposalDetailBackingBean.managedBean.qt.closingDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText></td>
					
					<td width="8%"><h:outputLabel value="#{lbl['lbl.sc.remaining.time']}" /></td>
					<td class="header-info-text; lastUpdated">
						<h:outputText value="#{supplierProposalDetailBackingBean.managedBean.closingTime}" id="remainTimeId" />  
						<p:poll interval="60" update="remainTimeId" listener="#{supplierProposalDetailBackingBean.showQtClosingTime}" /> </td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
