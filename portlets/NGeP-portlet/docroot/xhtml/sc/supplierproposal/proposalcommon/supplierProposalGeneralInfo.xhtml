<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.supplier.info']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mof.no']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="50"
						value="#{supplierProposalDetailBackingBean.managedBean.qtProposal.mofNo}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.company.name']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="50"
						value="#{supplierProposalDetailBackingBean.managedBean.smAppl.smCompanyBasic.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.tel.no']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="50"
						value="#{supplierProposalDetailBackingBean.managedBean.smAppl.smCompanyBasic.phoneFull}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="50"
						value="#{supplierProposalDetailBackingBean.managedBean.contactPerson.email}" /></td>
			</tr>

		</table>

	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.description']}" toggleable="true"
		collapsed="true">
		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td><h:inputTextarea disabled="true" readonly="true" rows="6"
						cols="125"
						value="#{supplierProposalDetailBackingBean.managedBean.qt.qtTitle}" />
				</td>
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.published.date']}" /></td>
				<td class="header-info-text"><p:inputText disabled="true" readonly="true"
						style="float : left;"
						value="#{supplierProposalDetailBackingBean.managedBean.qt.publishDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.closing.date']}" /></td>
				<td class="header-info-text"><p:inputText readonly="true"
						style="float : left;" disabled="true"
						value="#{supplierProposalDetailBackingBean.managedBean.qt.closingDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel id="ministryName"
						value="#{lbl['lbl.sc.ministry.name']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="125"
						value="#{supplierProposalDetailBackingBean.retrieveMinistryByOrgProfileId(supplierProposalDetailBackingBean.managedBean.qt.pmOrgProfile.orgProfileId)}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel id="ptjNameMain"
						value="#{lbl['lbl.sc.ptj']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="125"
						value="#{supplierProposalDetailBackingBean.retrievePTJByOrgProfileId(supplierProposalDetailBackingBean.managedBean.qt.pmOrgProfile.orgProfileId,supplierProposalDetailBackingBean.managedBean.qt.publishDate)}" /></td>
			</tr>

		</table>
	</p:panel>

</ui:composition>
