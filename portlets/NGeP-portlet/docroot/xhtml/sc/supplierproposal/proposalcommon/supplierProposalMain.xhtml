<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<style>
.hideToolbar .ui-editor-toolbar {
	display: none;
}
</style>
		<p:messages id="spMsg" showDetail="true" autoUpdate="#{supplierProposalDetailBackingBean.managedBean.autoUpdate}"
			closable="true" showSummary="false" severity="error, info" />

		<table style="border: 0px; width: 100%">
			<tr>
				<td><ui:include src="supplierProposalButtons.xhtml" /></td>
			</tr>
		</table>
		<table style="border: 0px; width: 100%">
			<tr>
				<td><ui:include src="supplierProposalHeader.xhtml" /></td>
			</tr>
		</table>

		<table style="border: 0px; width: 100%">
			<tr>
				<td valign="top"><ui:include src="supplierProposalMenu.xhtml" /></td>
			</tr>
		</table>

	</ui:define>
</ui:composition>
