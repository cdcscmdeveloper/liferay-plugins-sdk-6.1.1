<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.submit']}"
			styleClass="BtnSpacing" onstart="blockWidget.show()"
			oncomplete="blockWidget.hide()"
			action="#{supplierProposalDetailBackingBean.spkiSignAction}"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}"
			update="spkiOutputPanel" process="@form">
			<f:setPropertyActionListener value="false"
				target="#{supplierProposalDetailBackingBean.managedBean.autoUpdate}" />
		</p:commandButton>
	</div>

	<p:outputPanel id="spkiOutputPanel">
		<ac:spkiPopup id="spkiPopup"
			password="#{supplierProposalDetailBackingBean.managedBean.spkiBackingBean.password}"
			challengeAns1="#{supplierProposalDetailBackingBean.managedBean.spkiBackingBean.challengeAns1}"
			challengeQues1="#{supplierProposalDetailBackingBean.managedBean.spkiBackingBean.challengeQues1}"
			postSignAction="#{supplierProposalDetailBackingBean.submitSupplierProposal(spkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{supplierProposalDetailBackingBean.enableAutoUpdate()}" />
	</p:outputPanel>

</ui:composition>
