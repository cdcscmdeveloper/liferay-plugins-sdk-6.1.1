<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="docDefinationKey"
		value="#{supplierProposalDetailBackingBean.managedBean.docDefinitionKey}"></ui:param>
	<ui:param name="chkDefinationKey"
		value="#{supplierProposalDetailBackingBean.managedBean.checkListDefintionKey}"></ui:param>

	<c:if test="#{'TS' eq docDefinationKey}">
		<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
			action="#{supplierProposalDetailBackingBean.saveTechnicalSpecificationAction(false)}"
			process="@all" partialSubmit="true" update="@all" />

		<p:commandButton value="#{lbl['lbl.btn.complete']}"
			action="#{supplierProposalDetailBackingBean.saveTechnicalSpecificationAction(true)}"
			process="@all" partialSubmit="true" update="@all"
			icon="ui-icon-check" />
	</c:if>

	<c:if test="#{'WF' eq docDefinationKey}">
		<c:if test="#{'TN' eq chkDefinationKey}">
				<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				process="@all" partialSubmit="true" update="@all"
				action="#{supplierProposalDetailBackingBean.saveTechNonGovCompanyExpAction(false)}" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check"
				process="@all" partialSubmit="true" update="@all"
				action="#{supplierProposalDetailBackingBean.saveTechNonGovCompanyExpAction(true)}" />
				</c:if>
		<c:if test="#{'NE' eq chkDefinationKey}">
			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				process="@all" partialSubmit="true" update="@all"
				action="#{supplierProposalDetailBackingBean.saveTechEmployeesDtlAction(false)}"
				rendered="#{!supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee}" />
				
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check"
				process="@all" partialSubmit="true" update="@all"
				action="#{supplierProposalDetailBackingBean.saveTechEmployeesDtlAction(true)}"
				rendered="#{!supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee}" />
				</c:if>
		
			
	</c:if>

</ui:composition>
