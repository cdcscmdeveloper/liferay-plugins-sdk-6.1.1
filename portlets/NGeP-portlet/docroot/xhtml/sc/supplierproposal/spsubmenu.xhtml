<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" style="vertical-align: baseline;"><p:tabMenu
					activeIndex="#{supplierProposalDetailBackingBean.managedBean.prepareActiveIndex}"
					styleClass="sidemenu" style="display : table-caption;">
					<p:menuitem value="#{lbl['lbl.sc.technical.proposal']}"
						action="#{supplierProposalDetailBackingBean.retrieveTechnicalProposalList}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.financial.proposal']}"
						action="#{supplierProposalDetailBackingBean.retrieveFinancialProposalList}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.declaration']}"
						action="#{supplierProposalDetailBackingBean.retrieveDeclarationList}"
						update="@form" />
				</p:tabMenu></td>
			<td width="80%" style="vertical-align: top;"><h:panelGroup
					id="menuSPContent">
					<c:if
						test="#{supplierProposalDetailBackingBean.managedBean.prepareActiveIndex eq '0'}">
						<ui:include src="sptechdetails.xhtml" />
					</c:if>
					<c:if
						test="#{supplierProposalDetailBackingBean.managedBean.prepareActiveIndex eq '1'}">
						<ui:include src="spfinancedetails.xhtml" />
					</c:if>
					<c:if
						test="#{supplierProposalDetailBackingBean.managedBean.prepareActiveIndex eq '2'}">
						<ui:include src="spdeclaration.xhtml" />
					</c:if>
				</h:panelGroup></td>
		</tr>
	</table>
</ui:composition>
