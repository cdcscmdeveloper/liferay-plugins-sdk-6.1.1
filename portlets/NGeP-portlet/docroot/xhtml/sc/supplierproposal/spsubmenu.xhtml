<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabView dynamic="true" orientation="left">

		<p:tab title="Supplier Proposal - Technical">
			<ui:include src="/xhtml/sc/supplierproposal/sptechdetails.xhtml" />
		</p:tab>

		<p:tab title="Supplier Proposal - Financial">
			<ui:include src="/xhtml/sc/supplierproposal/spfinancedetails.xhtml" />
		</p:tab>
	</p:tabView>

	<p:dialog id="popupDetails" widgetVar="popupDetails" modal="true"
		dynamic="true" hideEffect="explode" resizable="false"
		header="SPECIFICATION CONTENT DETAILS" width="950" height="550">
		<p:ajax event="close" />
		<ui:include src="/xhtml/tpl/spec/specContent.xhtml" />
		<div>
			<p:button value="CLOSE" style="float:right;margin-right: 12px;" />
			<p:commandButton value="SAVE" style="float:right;margin-right: 12px;"
				action="#{templateSpecBackingBean.saveAction}" process="@all"
				oncomplete="popupDetails.hide()" icon="ui-icon-save"/>
			<br /> <br />
		</div>
	</p:dialog>

</ui:composition>
