<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					
					<p:commandButton value="#{lbl['lbl.btn.submit']}" process="@all"
						action="#{supplierProposalDetailBackingBean.saveSPDetailsAction}"
						icon="ui-icon-submit" />

					<c:forEach
						items="#{supplierProposalDetailBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						<c:if test="${action == 'REVISE'}">
							<ui:param name="iconVar" value="ui-icon-revise" />

						</c:if>
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<c:if test="${action == 'ACCEPT'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>

						<p:commandButton value="#{action}" process="@all"
							styleClass="ui-button"
							actionListener="#{supplierProposalDetailBackingBean.updateBpmTask(action)}"
							icon="#{iconVar}" />
					</c:forEach>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
</ui:composition>
