<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-back" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveTechEmployessDtlAction}" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check" />
		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.sp.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.scQtCheckList.title}"
							disabled="true" size="150" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.sp.technicalstafflist']}"
			toggleable="true">

			<p:dataTable id="techEmployeeList" var="techEmployee"
				rowIndexVar="index">
				<ac:paginator for="techEmployeeList"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.sp.name']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.identificationno']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.designation']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.qualification']}">
					<h:outputText></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.noofyrsexp']}">
					<h:outputText></h:outputText>
				</p:column>
			</p:dataTable>

			<p:spacer height="5" />
			<table style="width: 100%">
				<tr>
					<td style="width: 170px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.ttlnoofyrsexp']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							readonly="true" disabled="true" size="30">
						</p:inputText></td>
				</tr>
			</table>

		</p:panel>

	</ui:define>
</ui:composition>
