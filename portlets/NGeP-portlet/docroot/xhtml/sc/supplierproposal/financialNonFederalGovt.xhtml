<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.company.exp.fed.private']}" toggleable="true">
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.sp.btn.complete.instruction']}" escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}" />
		
		<table>
			<tr>
				<td>
					<p:outputLabel style="font-weight: bold;" value="#{supplierProposalDetailBackingBean.managedBean.year}" />
					<p:outputLabel value="#{lbl['lbl.sc.spec.company.exp.since.year']} " />
				</td>
			</tr>
		</table>
		<p:dataTable id="financenongovtid" var="financenongovt"
			value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPExperiences}"
			rowKey="#{financenongovt}" rowIndexVar="rowIndex">

			<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}"
				style="white-space : normal ; width : 15%;">
					#{financenongovt.clientName}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}"
				style="white-space : normal; width : 20%;">
					#{financenongovt.contractTitle}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}"
				style=" width : 10%;">
					#{financenongovt.contractNo}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.effective.date']}"
				style=" width : 10%;">
				<h:outputText value="#{financenongovt.effectiveDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.exp.date']}"
				style=" width : 10%;">
				<h:outputText value="#{financenongovt.expiryDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}"
				style=" width : 10%;">
				<h:outputText value="#{financenongovt.contractPeriod/12}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<p:column style=" width : 10%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.contarct.amount']}" />
				</f:facet>
				<p:inputText id="contractAmt" value="#{financenongovt.contractAmt}"
					size="15" style="text-align: right;" disabled="#{statusHide}"
					maxlength="19" required="true"
					label="#{lbl['lbl.sc.spec.contarct.amount']}">
					<f:validateLongRange minimum="1" maximum="99999999999" />
					<p:ajax event="blur" process="@this"
						listener="#{supplierProposalDetailBackingBean.totalContractAmount}"
						update="@this,contractAmtMsg, :form:totalcontractamt" />
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<p:message id="contractAmtMsg" for="contractAmt" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}"
				style="white-space : normal;  width : 15%;">
				<p:inputTextarea value="#{financenongovt.remark}" rows="3" cols="17"
					disabled="#{statusHide}" />
			</p:column>

		</p:dataTable>
		<p:spacer height="5" />
		<h:panelGroup id="totalcontractamt">
			<table style="width: 100%">
				<tr>
					<td style="width: 170px"><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.contract.amount']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.totalContractAmount}"
							readonly="true" disabled="true" size="15">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
					<td style="width: 80px;"><h:outputText
							value="#{lbl['lbl.tpl.spec.content.system.score']}"
							rendered="#{checklistScoreType eq '1'}" /> <ui:fragment
							rendered="#{checklistScoreType eq '2' and !pageDisable}">
							<h:outputText value="* " styleClass="mandatory" />


						</ui:fragment> <h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"
							rendered="#{ checklistScoreType eq '2'}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							value="#{noOfContracts.autoScore}" style="text-align:right"
							rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
							id="financialNonDederalGovernmenUserScoreId"
							label="#{lbl['lbl.tpl.spec.content.user.score']}"
							value="#{noOfContracts.userScore}" maxlength="18" required="true"
							disabled="#{pageDisable}" style="text-align:right"
							rendered="#{ checklistScoreType eq '2'}">

							<ac:validateNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
								maxIntegerDigits="14" integerOnly="true" />
							<f:attribute name="min" value="0" />
							<f:attribute name="max" value="#{contractUserScore}" />
						</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
							value="/#{contractUserScore}"
							rendered="#{ checklistScoreType eq '2'}" /> <p:message
							id="financialNonDederalGovernmentUserScoreMessage"
							for="financialNonDederalGovernmenUserScoreId" display="icon">
						</p:message></td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>


</ui:composition>
