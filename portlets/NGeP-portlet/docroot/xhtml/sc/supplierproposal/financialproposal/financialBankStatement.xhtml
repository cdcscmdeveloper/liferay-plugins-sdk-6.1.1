<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.bank.statement']}"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="1. #{lbl['lbl.sc.sp.btn.complete.instruction']}"
			escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}" />
		<br></br>
		<h:outputText styleClass="instruction"
			value="2. #{lbl['lbl.sc.spec.bank.statement.supplier.instruction']}"
			escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}" />

		<p:dataTable id="bankstatmentsid" var="bankstmt"
			value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPBankStmts}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{bankstmt}" rowIndexVar="rowIndex">

			<p:column headerText="#{lbl['lbl.sc.sp.month']}">
				<h:outputText value="#{bankstmt.month}" />

			</p:column>
			<p:column>
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.amount']}" />
				</f:facet>
				<p:inputText id="balanceAmt" value="#{bankstmt.balanceAmt}"
					disabled="#{statusHide}" size="30" style="text-align:right"
					maxlength="14" required="true"
					label="#{bankstmt.month} #{lbl['lbl.sc.amount']}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					<p:ajax event="blur" process="@this"
						listener="#{supplierProposalDetailBackingBean.totalAmountSum}"
						update="@this, :form:totalamount" />
				</p:inputText>
				<p:message id="balanceAmtMsg" for="balanceAmt" display="icon" />
			</p:column>

		</p:dataTable>
		<p:spacer height="5" />

		<h:panelGroup id="totalamount">

			<table style="width: 100%">
				<tr>
					<td style="width: 225px"><p:outputLabel style="float:left;"
							value="#{lbl['lbl.sc.total.amount']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.totalAmount}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sp.avgogbankst']}"
							style="float:left;" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.avgAmount}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.sp.avgogbankst.tooltip']}" />
					</td>
					<td style="width: 120px;"><p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.system.score']}"
							rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.user.score']}"
							rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
							rendered="#{checklistScoreType eq '2' and !pageDisable}">
							<p:outputLabel value="* " styleClass="mandatory" />


						</ui:fragment></td>
					<td><p:inputText readonly="true" disabled="true"
							value="#{noOfContracts.autoScore}" style="text-align:right"
							rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
							id="financialBankStatementsUserScoreId"
							label="#{lbl['lbl.tpl.spec.content.user.score']}"
							value="#{noOfContracts.userScore}" maxlength="18" required="true"
							disabled="#{pageDisable}" style="text-align:right"
							rendered="#{ checklistScoreType eq '2'}">
							<ac:validateNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
								maxIntegerDigits="14" integerOnly="true" />
							<f:attribute name="min" value="0" />
							<f:attribute name="max" value="#{contractUserScore}" />
						</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
							value="/#{contractUserScore}"
							rendered="#{ checklistScoreType eq '2'}" /> <p:message
							id="financialBankStatementsUserScoreMessage"
							for="financialBankStatementsUserScoreId" display="icon">
						</p:message></td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>

</ui:composition>
