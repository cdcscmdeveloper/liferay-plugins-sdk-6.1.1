<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"

	xmlns:p="http://primefaces.org/ui"

	xmlns:ac="http://ac.my/jsf/composite/cc">

	<style type="text/css">
.sidemenu>.ui-tabmenu-nav {
	padding-bottom: 310px !important;
	margin-bottom: -310px !important;
}
</style>			
	<table style="width: 100%">
		<tr>
			<TD width="16%"  class="sidemenutd"  valign="top" >
				<p:remoteCommand id="zoneRemote" name="zoneTabChange" update="@form" partialSubmit="true" process="@form" action="#{supplierProposalDetailBackingBean.zoneTabChange}" />

					id="zonalMenu"
					activeIndex="#{supplierProposalDetailBackingBean.managedBean.activeIndex}"

					model="#{supplierProposalDetailBackingBean.managedBean.proposalZonalMenuModel}">
				</p:tabMenu></TD>
			<td width="84%" valign="top"><p:outputPanel id="zoneSpecAnswers">
					<ac:templateSpec processValidationId="zoneRemote"
						templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}"
						title="#{lbl['lbl.sc.spec.financial.title']}" />
				</p:outputPanel></td>
		</tr>
	</table>
