<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<!-- #21695 Bug #31733 change process from form to THIS-->
	<table style="width: 100%">
		<tr>
			<td width="16%"  class="sidemenutd"  valign="top" >
				<!-- 20220907@syazani - Enhancement #3657 - specific error message - Start -->
				<p:remoteCommand id="zoneRemote" name="zoneTabChange" update="@form" partialSubmit="true" process="@this" action="#{supplierProposalDetailBackingBean.zoneTabChange}" />
				<!-- 20220907@syazani - Enhancement #3657 - specific error message - End -->
				<ac:zoneTabMenu tabList="#{supplierProposalDetailBackingBean.managedBean.zones}" 
							activeIndex="#{supplierProposalDetailBackingBean.managedBean.activeIndex}"
							remoteCommand="zoneTabChange" update="@this"  process="@form"/>
			</td>
			<td width="84%" valign="top"><p:outputPanel id="zoneSpecAnswers">
					<ac:templateSpec processValidationId="zoneRemote"
						templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}"
						editable="#{!supplierProposalDetailBackingBean.managedBean.readOnly 
							and !supplierProposalDetailBackingBean.managedBean.zones.get(supplierProposalDetailBackingBean.managedBean.activeIndex).branchDeactivated}"
						title="#{lbl['lbl.sc.spec.financial.title']}" />
				</p:outputPanel></td>
		</tr>
	</table>
</ui:composition>
