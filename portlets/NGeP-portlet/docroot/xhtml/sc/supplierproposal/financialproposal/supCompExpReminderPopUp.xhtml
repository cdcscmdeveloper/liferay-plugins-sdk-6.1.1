<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="chkDefinationKey"
		value="#{supplierProposalDetailBackingBean.managedBean.checkListDefintionKey}"></ui:param>

	<p:dialog id="cmpexpDlgId" widgetVar="compExpRemPopUp"
		header="#{lbl['lbl.sc.supplier.proposal.comp.exp.reminder.popup.header']}"
		resizable="false" width="auto" height="100" closable="false">
		<table>
			<tr>
				<td style="float: left;"><h:outputText escape="false"
						rendered="#{SourcingConstants.FINANCIAL_GOVERNMENT_COMPANY_EXPERIENCE eq chkDefinationKey}"
						value="#{lbl['lbl.sc.supplier.proposal.comp.exp.reminder.gov.popup.content']}" />
					<h:outputText escape="false"
						rendered="#{SourcingConstants.FINANCIAL_NONGOVERNMENT_COMPANY_EXPERIENCE eq chkDefinationKey}"
						value="#{lbl['lbl.sc.supplier.proposal.comp.exp.reminder.non.gov.popup.content']}" />
				</td>
			</tr>
		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}"
				actionListener="#{supplierProposalDetailBackingBean.closeCompanyExpReminderPopUp}"
				onclick="compExpRemPopUp.hide();stopPoller.stop();"
				partialSubmit="true" process="@this" />
		</div>
	</p:dialog>

</ui:composition>
