<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages id="techCLMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;" immediate="true"
				process="@this" partialSubmit="true" styleClass="BtnSpacing"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />
			<!--  Need to add all screen button into a single page and append here.. -->
			<ui:include src="financialchecklistbuttons.xhtml" />
		</div>
		<!-- Header file for all sub screens -->
		<ui:include src="/xhtml/sc/supplierproposal/proposalcommon/checklistHeader.xhtml" />
		<!-- inclueded page for respecitive checklist -->
		<ui:include
			src="#{supplierProposalDetailBackingBean.managedBean.pageUrl}" />
	</ui:define>
</ui:composition>
