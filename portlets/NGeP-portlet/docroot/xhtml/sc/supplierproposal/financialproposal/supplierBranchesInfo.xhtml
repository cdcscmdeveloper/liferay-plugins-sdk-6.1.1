<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.spec.company.branches']}"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.spec.supplier.branch.gst.info.instruction']}"
			escape="false" />
		<p:dataTable id="companyBranch" selectionMode="single" rows="10"
			value="#{smAppl.smSupplierBranches}" rowIndexVar="index"
			var="companyBranch"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{companyBranch}">
			<ac:paginator for="companyBranch"></ac:paginator>
			<p:ajax event="rowSelect"
				listener="#{supplierProposalDetailBackingBean.onBranchRowSelectionListener}"
				update="@([id$=branchGSTInfo])" />

			<p:column headerText="#{lbl['lbl.sc.spec.branch.name']}"
				style="width : 25%; white-space : normal;">
				<h:outputText style="float : left;"
					value="#{companyBranch.branchName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.address']}"
				style="white-space : normal; width : 25%;">
				<h:outputText style="float : left;"
					value="#{supplierProposalDetailBackingBean.getFullAddress(companyBranch.smAddress)}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.contact.person']}"
				style="width : 20%;">
				<h:outputText style="float : left;"
					value="#{companyBranch.smPersonnel.name}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.tel.no']}" style="width : 15%;">
				<h:outputText style="float : left;" value="#{companyBranch.phoneNo}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.fax.no']}" style="width : 15%;">
				<h:outputText style="float : left;" value="#{companyBranch.faxNo}"></h:outputText>
			</p:column>
		</p:dataTable>
		<h:panelGrid id="branchGSTInfo"
			rendered="#{supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch ne null}"
			style="width : 100%">
			<br />
			<ui:fragment
				rendered="#{supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch ne null}">
					#{supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch.branchName} > #{lbl['lbl.sc.gst.branch.info']}
				</ui:fragment>
			<h:panelGroup
				rendered="#{supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch ne null}">
				<table style="width: 100%">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.gstNo']}" /></td>
						<td><p:inputText disabled="true" readonly="true" size="30"
								value="#{(supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch ne null) ? supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch.gstRegNo : lbl['lbl.sm.no.available']}" /></td>
					</tr>
					<tr>
						<td style="width: 200px;"><p:outputLabel
								value="#{lbl['lbl.sm.gst.effdate']}" /></td>
						<td colspan="3"><p:inputText disabled="true" readonly="true"
								size="30"
								value="#{(supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch ne null) ? supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch.gstEffDate : lbl['lbl.sm.no.available']}" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sm.gst.eff.end.date']}" /></td>
						<td colspan="3"><p:inputText disabled="true" readonly="true"
								size="30"
								value="#{(supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch ne null) ? supplierProposalDetailBackingBean.managedBean.smGstSupplierBranch.gstEndDate : lbl['lbl.sm.no.available']}" /></td>
					</tr>
				</table>
			</h:panelGroup>
		</h:panelGrid>
	</p:panel>
</ui:composition>
