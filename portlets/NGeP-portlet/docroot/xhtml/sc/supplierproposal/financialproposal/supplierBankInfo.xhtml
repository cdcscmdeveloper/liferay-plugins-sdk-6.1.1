<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.bank.act.details']}"
		toggleable="true">
		<p:dataTable id="bankdetails" selectionMode="single" rows="10"
			value="#{smAppl.smSupplierBanks}" rowIndexVar="index" var="bankDtls"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{bankDtls}">
			<ac:paginator for="bankdetails" />
			<p:ajax event="rowSelect"
				listener="#{supplierProposalDetailBackingBean.onRowSelectionListener}"
				update="@([id$=cheque])" />

			<p:column headerText="#{lbl['lbl.sc.account.no']}"
				style="width : 30%;">
				<h:outputText style="float : right;" value="#{bankDtls.accountNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bank.name']}"
				style="width : 35%;">
				<h:outputText value="#{bankDtls.pmFinancialOrg.finOrgName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.address']}"
				style="white-space : normal; width : 35%;">
				<h:outputText style="float : left;"
					value="#{supplierProposalDetailBackingBean.getFullAddress(bankDtls.smAddress)}" />
			</p:column>
		</p:dataTable>

		<!-- <p:panel header="#{lbl['lbl.sc.spec.cheque.sign.composition']}"
		toggleable="true"> -->
		<br />
		<ui:fragment rendered="#{supplierProposalDetailBackingBean.managedBean.selectedBank ne null}">
					#{supplierProposalDetailBackingBean.managedBean.selectedBank.pmFinancialOrg.finOrgName} > #{lbl['lbl.sc.spec.cheque.sign.composition']}
				</ui:fragment>
		<h:panelGrid rendered="#{smAppl.smSupplierBanks ne null}"
			style="width : 100%">
			<p:dataTable id="cheque"
				value="#{supplierProposalDetailBackingBean.managedBean.smChequeSignatories}"
				rowIndexVar="index" var="cheque" rows="10"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{cheque}">
				<ac:paginator for="cheque"></ac:paginator>
				<p:column headerText="#{lbl['lbl.sc.spec.cheque.sign']}"
					style="width : 25%;">
					<!-- #30447 start -->
					<h:outputText value="#{cheque.smPersonnel.title.salutationName.concat(' ').concat(cheque.smPersonnel.name)}"></h:outputText>
					<!-- #30447 end -->
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.passport.no']}"
					style="width : 25%;">
					<h:outputText value="#{cheque.smPersonnel.identificationNo}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}"
					style="width : 25%;">
					<h:outputText 
						value="#{ cheque.smPersonnel.bumiFlg eq 1 ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.position']}"
					style="width : 25%;">
					<h:outputText value="#{cheque.smPersonnel.designation}"></h:outputText>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
	</p:panel>
</ui:composition>
