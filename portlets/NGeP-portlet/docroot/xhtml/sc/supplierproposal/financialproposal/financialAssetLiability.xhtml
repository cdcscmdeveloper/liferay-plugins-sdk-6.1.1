<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="assetsAndLiabilitiesPanel"
		header="#{lbl['lbl.sc.assest.liabilities']}" toggleable="true">
		<!-- CR Financial Checklist #26339 -->
		<h:outputText styleClass="instruction"  
			value="#{lbl['lbl.sc.sp.btn.complete.instruction2']}" escape="false"  rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}" />   
			
		<table>
			<tr>
				<td><LABEL><ui:fragment rendered="#{!statusHide}">
						<!--  <span class="mandatory">* </span> -->	   <!--  Span tag comment CR Financial Checklist #26339 -->
						</ui:fragment>#{lbl['lbl.sc.current.asset']}</LABEL></td>
						<!-- CR Financial Checklist #26339  Removed required="true" from below tag-->
				<td colspan="3"><p:inputText id="currentAsset"
						style="text-align:right;margin-bottom: 5px;" 
						label="#{lbl['lbl.sc.current.asset']}" disabled="#{statusHide or supplierProposalDetailBackingBean.managedBean.readOnly}"
						maxlength="14"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentAssets}"
						size="30">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalcurrentratio])" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><LABEL><ui:fragment rendered="#{!statusHide}">
							<!--   <span class="mandatory">* </span> -->       <!--  Span tag comment CR Financial Checklist #26339 -->
						</ui:fragment>#{lbl['lbl.sc.current.liability']}</LABEL></td>
						<!-- CR Financial Checklist #26339  Removed required="true" from below tag-->
				<td colspan="3"><p:inputText id="currentLiabilities"
						style="text-align:right;margin-bottom: 5px;" 
						disabled="#{statusHide or supplierProposalDetailBackingBean.managedBean.readOnly}"
						label="#{lbl['lbl.sc.current.liability']}" maxlength="14"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentLiabilities}"
						size="30">
						<f:validateLongRange minimum="0" maximum="9999999999999" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio],[id$=totalcurrentratio])" />
					</p:inputText></td>
			</tr>

			<tr>
				<td><LABEL><ui:fragment rendered="#{!statusHide}">
						<!--  	<span class="mandatory">* </span>   -->     <!--  Span tag comment CR Financial Checklist #26339 -->
						</ui:fragment>#{lbl['lbl.sc.total.cash.hand']}</LABEL></td>
						<!-- CR Financial Checklist #26339  Removed required="true" from below tag-->
				<td colspan="3"><p:inputText id="totalCashInHand"
						style="text-align:right;margin-bottom: 5px;" 
						label="#{lbl['lbl.sc.total.cash.hand']}" disabled="#{statusHide or supplierProposalDetailBackingBean.managedBean.readOnly}"
						maxlength="14"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.totalCashInHand}"
						size="30">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio])" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><ui:fragment rendered="#{!statusHide}">
					<!-- 	<h:outputText value="* " styleClass="mandatory" />  -->  <!--  Span tag comment CR Financial Checklist #26339 -->
					</ui:fragment> <h:outputLabel value="#{lbl['lbl.sc.total.account.receivable']}" /></td>
					<!-- CR Financial Checklist #26339  Removed required="true" from below tag-->
				<td colspan="3"><p:inputText id="totalAccountReceivable"
						style="text-align:right;margin-bottom: 5px;" 
						disabled="#{statusHide or supplierProposalDetailBackingBean.managedBean.readOnly}"
						label="#{lbl['lbl.sc.total.account.receivable']}" maxlength="14"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.totalAccountReceivable}"
						size="30">
						<f:validateLongRange minimum="0" maximum="9999999999999" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio])" />
					</p:inputText></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.acid.ratio']}" /></td>
				<td style="width: 350px;"><p:inputText
						style="text-align:right;margin-bottom: 5px;" id="totalacidratio"
						value="#{(supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.acidRatio eq null) ? '' : supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.acidRatio }"
						size="30" readonly="true" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip
                       value="#{lbl['lbl.sc.acid.ratio.tooltip']}" />
					</td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.system.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<p:outputLabel value="* " styleClass="mandatory" />


					</ui:fragment></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						id="financialAssetsAndLiabilityUserScoreId"
						label="#{lbl['lbl.tpl.spec.content.user.score']}"
						value="#{noOfContracts.userScore}" maxlength="18" required="true"
						disabled="#{pageDisable or evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '1'}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="financialAssetsAndLiabilityUserScoreMessage"
						for="financialAssetsAndLiabilityUserScoreId" display="icon">
					</p:message></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.current.ration']}" /></td>
				<td style="width: 350px;"><p:inputText style="text-align:right"
						id="totalcurrentratio"
						value="#{(supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentRatio eq null) ? '' : supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentRatio}"
						size="30" readonly="true" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.sc.current.ration.tooltip']}" />
					</td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.system.score']}"
						rendered="#{companyScoreType eq '1'}" /> <p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{companyScoreType eq '2'}" /> <ui:fragment
						rendered="#{companyScoreType eq '2' and !pageDisable}">
						<p:outputLabel value="* " styleClass="mandatory" />


					</ui:fragment></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfYears.autoScore}" style="text-align:right"
						rendered="#{companyScoreType eq '1'}"></p:inputText> <p:inputText
						id="financialAssetsLiabilityCurrentRatio" maxlength="18"
						style="text-align:right" required="true"
						label="#{lbl['lbl.tpl.spec.content.user.score']}"
						value="#{noOfYears.userScore}" disabled="#{pageDisable or evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '1'}"
						rendered="#{companyScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{yearsUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{yearsUserScore} " rendered="#{companyScoreType eq '2'}" />
					<p:message id="financialAssetsLiabilityCurrentRatioMessage"
						for="financialAssetsLiabilityCurrentRatio" display="icon"></p:message>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
