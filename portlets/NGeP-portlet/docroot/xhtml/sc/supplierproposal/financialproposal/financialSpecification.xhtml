	xmlns:ui="http://java.sun.com/jsf/facelets"

	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table>

			<TD><h:outputText styleClass="instruction"
					value="1. #{lbl['lbl.sc.spec.financial.title.instruction']}"

					rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}" />

		</tr>
		<tr>
			<TD><h:outputText styleClass="instruction"
					value="2. #{lbl['lbl.sc.sp.btn.complete.instruction']}"

					rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}" />
			</TD>
		</tr>

	<c:if test="#{supplierProposalDetailBackingBean.managedBean.qt.zonal}">
		<ui:include src="financialSpecificationDtlbyzone.xhtml" />
	</c:if>


	<c:if test="#{!supplierProposalDetailBackingBean.managedBean.qt.zonal}">
		<ac:templateSpec
			templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}"
