<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="" toggleable="true">
		<table>
			<tr>
				<td style="width: 170px"><p:outputLabel
						value="#{lbl['lbl.sc.max.proposal']}" /></td>
				<td><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.qt.maxProposal}"
						readonly="true" disabled="true" size="30" /></td>
				<td style="width: 200px"><p:outputLabel
						value="#{lbl['lbl.sc.sp.prepare.proposal']}" /></td>
				<td><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.prepareProposal}"
						size="30">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.displayProposalDtls}"
							update=":form:proposaldtls" />
					</p:inputText></td>
			</tr>
		</table>

		<h:panelGroup id="proposaldtls">
			<p:dataTable id="proposalid" var="proposalList"
				selection="#{supplierProposalDetailBackingBean.managedBean.selectMultipleProposalList}"
				value="#{supplierProposalDetailBackingBean.managedBean.qtProposalsList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{proposalList}" rowIndexVar="rowIndex">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sc.proposal.no']}">
					<h:outputText value="#{rowIndex+1}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.action']}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareMultileProposalAction(rowIndex)}"
						value="#{lbl['lbl.btn.prepare']}" />
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.delete']}" rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}"
					action="#{supplierProposalDetailBackingBean.deleteMultipleProposal}"
					update="proposalid" styleClass="BtnSpacing"
					process="@this,proposalid" partialSubmit="true" />

			</div>
		</h:panelGroup>

	</p:panel>

</ui:composition>
