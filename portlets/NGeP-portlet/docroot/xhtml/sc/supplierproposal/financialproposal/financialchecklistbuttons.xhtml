<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	<ui:param name="docDefinationKey"
		value="#{supplierProposalDetailBackingBean.managedBean.docDefinitionKey}"></ui:param>
	<ui:param name="chkDefinationKey"
		value="#{supplierProposalDetailBackingBean.managedBean.checkListDefintionKey}"></ui:param>

	<c:if test="#{!supplierProposalDetailBackingBean.managedBean.readOnly}">

		<!-- 20220204@syazani - Enhancement #3657 - specific error message - Start -->
		<c:if test="#{'TS' eq docDefinationKey}">
			<p:commandButton value="#{lbl['lbl.btn.save']}"
				styleClass="BtnSpacing"
				action="#{supplierProposalDetailBackingBean.saveFinancialSpecificationAction(false)}"
				process="@all" partialSubmit="true" update="@all"
				onclick="blockWidget.show()" oncomplete="blockWidget.hide()"
				disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
			<p:commandButton id="completeTS" value="#{lbl['lbl.btn.complete']}"
				styleClass="BtnSpacing" onclick="blockWidget.show()"
				oncomplete="blockWidget.hide()" 
				action="#{supplierProposalDetailBackingBean.saveFinancialSpecificationAction(true)}"
				process="@all" partialSubmit="true" update="@all"
				disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
		</c:if>
		<!-- 20220204@syazani - Enhancement #3657 - specific error message - End -->

		<c:if test="#{'WF' eq docDefinationKey}">
			<c:if test="#{'FN' eq chkDefinationKey}">
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					styleClass="BtnSpacing" process="@all" partialSubmit="true"
					update="@all" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveFinancialNonGovCompanyExpAction(false)}" 
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />

				<p:commandButton value="#{lbl['lbl.btn.complete']}"
					styleClass="BtnSpacing" process="@all" partialSubmit="true"
					update="@all" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveFinancialNonGovCompanyExpAction(true)}"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />

			</c:if>
			<c:if test="#{'CF' eq chkDefinationKey}">
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					styleClass="BtnSpacing" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveFinancialCreditFacilityAction(false)}"
					process="@all" partialSubmit="true" update="@all"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />

				<p:commandButton value="#{lbl['lbl.btn.complete']}"
					styleClass="BtnSpacing" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveFinancialCreditFacilityAction(true)}"
					process="@all" partialSubmit="true" update="@form"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
			</c:if>
			<c:if test="#{'CH' eq chkDefinationKey}">
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					styleClass="BtnSpacing" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveFinancialCashOnHandAction(false)}"
					process="@all" partialSubmit="true" update="@all"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />

				<p:commandButton value="#{lbl['lbl.btn.complete']}"
					styleClass="BtnSpacing" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveFinancialCashOnHandAction(true)}"
					process="@all" partialSubmit="true" update="@all"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
			</c:if>

			<c:if test="#{'AL' eq chkDefinationKey}">

				<p:commandButton value="#{lbl['lbl.btn.save']}" process="@all"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					partialSubmit="true" update="@all" styleClass="BtnSpacing"
					action="#{supplierProposalDetailBackingBean.saveAssetLiabilityAction(false)}"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />

				<p:commandButton value="#{lbl['lbl.btn.complete']}" process="@all"
					partialSubmit="true" update="@all" styleClass="BtnSpacing"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveAssetLiabilityAction(true)}"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
			</c:if>
			<c:if test="#{'BS' eq chkDefinationKey}">
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					styleClass="BtnSpacing" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveBankStatementAction(false)}"
					partialSubmit="true" process="@all" update="@all"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
				<p:commandButton value="#{lbl['lbl.btn.complete']}"
					styleClass="BtnSpacing" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{supplierProposalDetailBackingBean.saveBankStatementAction(true)}"
					partialSubmit="true" process="@all" update="@all"
					disabled="#{supplierProposalDetailBackingBean.managedBean.disableUpdateProposal}" />
			</c:if>
		</c:if>

	</c:if>

</ui:composition>
