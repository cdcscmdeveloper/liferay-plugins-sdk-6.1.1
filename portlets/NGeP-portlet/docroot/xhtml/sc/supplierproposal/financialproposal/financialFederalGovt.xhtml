<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.spec.company.exp.fed.gov']}"
		toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel style="font-weight: bold;" value="#{supplierProposalDetailBackingBean.managedBean.year}" />
					<p:outputLabel value="#{lbl['lbl.sc.spec.company.exp.since.year']} " /></td>
			</tr>
		</table>
		
		<p:dataTable id="financegovtid" var="suppExperience"
			value="#{supplierProposalDetailBackingBean.managedBean.supplierExperienceList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{suppExperience}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="financegovtid" />

			<p:column headerText="#{lbl['lbl.sm.projDtls.clientName']}" style="white-space : normal; ">
				<h:outputText value="#{suppExperience.clientName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.projTitle']}" style="white-space : normal; ">
				<h:outputText value="#{suppExperience.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.contrVal']}" style="white-space : normal; ">
				<ac:labelAmount value="#{suppExperience.contractValue}"	styleClass="outputLabel-view" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.procDate']}">
				<h:outputText value="#{suppExperience.procurementDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sm.projDtls.workProgress']}">
				<h:outputText value="#{lbl['lbl.sm.projDtls.inProgress']}" rendered="#{suppExperience.progressStatus eq 'P'}" />
				<h:outputText value="#{lbl['lbl.sm.projDtls.success']}" rendered="#{suppExperience.progressStatus eq 'S'}" />
				<h:outputText value="#{lbl['lbl.sm.projDtls.fail']}" rendered="#{suppExperience.progressStatus eq 'F'}" />
				<h:outputText value="#{lbl['lbl.sm.projDtls.kiv']}" rendered="#{suppExperience.progressStatus eq 'K'}" />
				<h:outputText value="#{lbl['lbl.sm.projDtls.repeal']}" rendered="#{suppExperience.progressStatus eq 'R'}" />
			</p:column>

		</p:dataTable>

		<p:spacer height="5" />
		<table style="width: 100%">
			<tr>
				<td style="width: 220px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.total.contract.amount']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.totalContractAmount}"
						readonly="true" disabled="true" size="15">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.system.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<p:outputLabel value="* " styleClass="mandatory" />


					</ui:fragment></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						id="financialGovernmentUserScoreId"
						label="#{lbl['lbl.tpl.spec.content.user.score']}"
						value="#{noOfContracts.userScore}" maxlength="18" required="true"
						disabled="#{pageDisable or rejectedSupplier}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="financialGovernmentUserScoreMessage"
						for="financialGovernmentUserScoreId" display="icon">
					</p:message></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
