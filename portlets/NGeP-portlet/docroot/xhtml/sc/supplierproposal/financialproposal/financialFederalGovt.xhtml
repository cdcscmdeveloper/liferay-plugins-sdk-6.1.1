<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.spec.company.exp.fed.gov']}"
		toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel style="font-weight: bold;"
						value="#{supplierProposalDetailBackingBean.managedBean.year}" />
					<p:outputLabel
						value="#{lbl['lbl.sc.spec.company.exp.since.year']} " /></td>
			</tr>
		</table>
		<p:dataTable id="financegovtid" var="financegovt"
			value="#{supplierProposalDetailBackingBean.managedBean.scLoaList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{financegovt}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="financegovtid" />

			<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}"
				style="white-space : normal; width : 20%; ">
				<h:outputText value="#{financegovt.scLoiLoa.pmOrgProfile.orgName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}"
				style="white-space : normal; width : 30%; ">
				<h:outputText value="#{financegovt.scLoiLoa.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}"
				style=" width : 10%; ">
				<h:outputText value="#{financegovt.loaNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.effective.date']}"
				style=" width : 10%; ">
				<h:outputText value="#{financegovt.contractEffDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.exp.date']}"
				style=" width : 10%; ">
				<h:outputText value="#{financegovt.contractExpDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}"
				style="width : 10%; ">
				<h:outputText style="float : right"
					value="#{financegovt.contractDuration.intValue()/12}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}"
				style="text-align:right; width : 10%;">
				<h:outputText value="#{financegovt.loaAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
		<p:spacer height="5" />
		<table style="width: 100%">
			<tr>
				<td style="width: 220px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.total.contract.amount']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.totalContractAmount}"
						readonly="true" disabled="true" size="15">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.system.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<p:outputLabel value="* " styleClass="mandatory" />


					</ui:fragment></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						id="financialGovernmentUserScoreId"
						label="#{lbl['lbl.tpl.spec.content.user.score']}"
						value="#{noOfContracts.userScore}" maxlength="18" required="true"
						disabled="#{pageDisable}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="financialGovernmentUserScoreMessage"
						for="financialGovernmentUserScoreId" display="icon">
					</p:message></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
