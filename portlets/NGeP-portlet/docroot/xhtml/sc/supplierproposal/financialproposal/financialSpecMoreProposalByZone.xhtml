<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="" toggleable="true">
		<table>
			<tr>
				<td style="width: 170px"><p:outputLabel
						value="#{lbl['lbl.sc.max.proposal']}" /></td>
				<td><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.qt.maxProposal}"
						readonly="true" disabled="true" size="30" /></td>
				<td style="width: 200px"><p:outputLabel
						value="#{lbl['lbl.sc.sp.prepare.proposal']}" /></td>
				<td><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.prepareProposal}"
						size="30">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.displayProposalDtls}"
							update=":form:zoneid:zoneproposaldtls" />
					</p:inputText></td>
			</tr>
		</table>

		<h:panelGroup id="zoneproposaldtls">
			<p:dataTable id="proposalid" var="proposalList"
				value="#{supplierProposalDetailBackingBean.managedBean.qtProposalsList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{proposalList}" rowIndexVar="rowIndex">
				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox
							value="#{supplierProposalDetailBackingBean.managedBean.selectedAll}">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=proposalid])"
								listener="#{supplierProposalDetailBackingBean.selectAllMultipleProposal}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox
						value="#{supplierProposalDetailBackingBean.managedBean.selected}">
						<p:ajax partialSubmit="true" process="@this" update="@this"
							listener="#{supplierProposalDetailBackingBean.selectedMultipleProposal(rowIndex)}" />
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.proposal.no']}">
					<h:outputText value="#{rowIndex+1}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.action']}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareMultileProposalAction(rowIndex+1)}"
						value="#{lbl['lbl.btn.prepare']}" />
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}"
					action="#{supplierProposalDetailBackingBean.deleteMultipleProposal}"
					update="@([id$=proposalid])" styleClass="BtnSpacing"
					process="@this" partialSubmit="true" />

			</div>
		</h:panelGroup>

	</p:panel>
</ui:composition>
