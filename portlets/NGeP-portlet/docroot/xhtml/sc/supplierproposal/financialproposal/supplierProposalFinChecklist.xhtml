<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	

	<p:panel header="#{lbl['lbl.sc.financial.proposal']}" toggleable="true">
		<ac:instructionText value="#{lbl['lbl.sc.sp.ubat.instruction']}"
			rendered="#{supplierProposalDetailBackingBean.managedBean.procCategoryMedicine}" />
			
	
		<p:dataTable id="financeDeailsId" var="financeList"
			value="#{supplierProposalDetailBackingBean.managedBean.financeCheckDetailsList}"
			selection="#{supplierProposalDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{financeList}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			first="#{supplierProposalDetailBackingBean.managedBean.financialTableRow}">

			<p:columnGroup type="header">
				<p:row>
					<p:column style="width:2%" />

					<p:column style="width:60%"
						headerText="#{lbl['lbl.sc.descriptions']}" />

					<p:column headerText="#{lbl['lbl.sc.instruction']}"
						style="width:28%" />

					<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%" />

				</p:row>
			</p:columnGroup>

			<p:column style="width:2%">
				<p:selectBooleanCheckbox id="allChk"
					value="#{financeList.submitted}" disabled="true"
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'TS' 
						or financeList.scQtCheckList.definationType.parameterCode eq 'WF'
						or (financeList.scQtCheckList.definationType.parameterCode eq 'UP' and financeList.scQtCheckList.action.parameterCode eq 'O')
						or financeList.scQtCheckList.definationType.parameterCode eq 'NA'}" />
			</p:column>

			<p:column style="white-space : normal">
				<h:outputText value="#{financeList.scQtCheckList.title}" />
			</p:column>

			<p:column style="white-space : normal">
				<!-- CR Financial Checklist #26339 -->
				 <!--  	DDKey:<h:outputText value="#{financeList.scQtCheckList.pmDocument.docDefinitionKey}" /> 
					PCode:<h:outputText value="#{financeList.scQtCheckList.action.parameterCode}" /> 	 
					DType:<h:outputText value="#{financeList.scQtCheckList.definationType.parameterCode}" /> 	 -->
					<h:outputText rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'NA' and fn:contains(financeList.scQtCheckList.title,'Pengesahan dari Institusi Kewangan untuk tiga bulan Penyata Bank')}" value="#{lbl['lbl.sc.attachment.upload.instruction']}" >
					</h:outputText>
					<h:outputText rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'NA' and fn:contains(financeList.scQtCheckList.title,'Kunci Kira-Kira Tahunan')}" value="#{lbl['lbl.sc.attachment.upload.instruction1']}" >
					</h:outputText>
				    <h:outputText rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'NA' and fn:contains(financeList.scQtCheckList.title,'Pengesahan dari Institusi Kewangan ke atas jumlah yang telah dibayar')}" value="#{lbl['lbl.sc.attachment.upload.instruction3']}" >
					</h:outputText>
				
				    <h:outputText
					rendered="#{(financeList.scQtCheckList.definationType.parameterCode eq 'UP' and financeList.scQtCheckList.action.parameterCode eq 'O')}"
					value="#{lbl['lbl.sc.attachment.upload.download.instruction']}" />

				<h:outputText
					rendered="#{financeList.scQtCheckList.action.parameterCode eq 'V' and financeList.scQtCheckList.definationType.parameterCode eq 'UP'}"
					value="#{lbl['lbl.sc.attachment.view.instruction']}" />
				<h:outputText
					rendered="#{(financeList.scQtCheckList.pmDocument.docDefinitionKey eq 'BS' ) and (financeList.scQtCheckList.action.parameterCode eq 'I' or financeList.scQtCheckList.definationType.parameterCode eq 'WF')}"
					value="#{lbl['lbl.sc.prepare.proposal.instruction']}" />	
				<h:outputText
					rendered="#{(financeList.scQtCheckList.pmDocument.docDefinitionKey eq null) and (financeList.scQtCheckList.action.parameterCode eq'I' or financeList.scQtCheckList.definationType.parameterCode eq 'TS' )}"
					value="#{lbl['lbl.sc.prepare.proposal.instruction']}" />
				
				<h:outputText
					rendered="#{(financeList.scQtCheckList.pmDocument.docDefinitionKey eq 'CF') and (financeList.scQtCheckList.action.parameterCode eq 'I' or financeList.scQtCheckList.definationType.parameterCode eq 'WF')}"
					value="#{lbl['lbl.sc.prepare.proposal.instruction1']}" />
				<h:outputText
					rendered="#{(financeList.scQtCheckList.pmDocument.docDefinitionKey eq 'AL') and (financeList.scQtCheckList.action.parameterCode eq 'I' or financeList.scQtCheckList.definationType.parameterCode eq 'WF')}"
					value="#{lbl['lbl.sc.prepare.proposal.instruction2']}" />	
				<h:outputText
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'SP' or financeList.scQtCheckList.definationType.parameterCode eq 'SD'}"
					value="#{lbl['lbl.sc.view.supplier.info.instruction']}" />
				<h:outputText rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'NA'
				and !fn:contains(financeList.scQtCheckList.title,'Pengesahan dari Institusi Kewangan untuk tiga bulan Penyata Bank')
				and !fn:contains(financeList.scQtCheckList.title,'Kunci Kira-Kira Tahunan')
				and !fn:contains(financeList.scQtCheckList.title,'Pengesahan dari Institusi Kewangan ke atas jumlah yang telah dibayar')}" 
				value="#{lbl['lbl.sc.attachment.upload.instruction']}" />	
			</p:column>

			<p:column style="white-space: normal; text-align: center;">
				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'TS' or financeList.scQtCheckList.definationType.parameterCode eq 'WF'}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareFinancialAction(financeList)}"
						value="#{supplierProposalDetailBackingBean.managedBean.readOnly ? lbl['lbl.btn.view']:lbl['lbl.btn.prepare']}" style="width:101px;" />
				</ui:fragment>
				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'SP' or financeList.scQtCheckList.definationType.parameterCode eq 'SD'}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareFinancialAction(financeList)}"
						value="#{lbl['lbl.txt.view']}" style="width:101px;" />
				</ui:fragment>
				<ui:fragment
					rendered="#{((financeList.scQtCheckList.definationType.parameterCode eq 'UP'  and financeList.scQtCheckList.action.parameterCode eq 'O') or (financeList.scQtCheckList.definationType.parameterCode eq 'NA'))}">
					<h:commandLink
						value="#{financeList.scQtCheckList.scQtCheckListAttachment.fileName}"
						styleClass="blue_font" immediate="true"
						action="#{supplierProposalDetailBackingBean.downloadFile(financeList.scQtCheckList.scQtCheckListAttachment)}"
						rendered="#{(!empty financeList.scQtCheckList.scQtCheckListAttachment) and (empty financeList.scQtProposalChecklistAttachment)}" />
					<br />
					<ac:scSingleFileUploadButton id="fcUploadBtn"
						popupWidgetVar="financialproposalchecklistUploadDlg"
						attachment="#{financeList.scQtProposalChecklistAttachment}"
						encrypted="true"
						encryptionKey="#{supplierProposalDetailBackingBean.encryptionKey}"
						readonly="#{supplierProposalDetailBackingBean.managedBean.readOnly or (financeList.submitted and financeList.scQtProposalChecklistAttachment eq null)}"
						rowIndex="#{rowIndex}"
						deleteFileUploadListener="supplierProposalDetailBackingBean.deleteProposalChecklistAttachmentFinancialAction">
						<f:setPropertyActionListener for="actionEvent"
							value="#{financeList}"
							target="#{supplierProposalDetailBackingBean.managedBean.financialQtProposalChecklist}" />
					</ac:scSingleFileUploadButton>
				</ui:fragment>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'UP' and financeList.scQtCheckList.action.parameterCode eq 'V'}">
					<h:commandLink
						value="#{financeList.scQtCheckList.scQtCheckListAttachment.fileName}"
						styleClass="blue_font" immediate="true"
						action="#{supplierProposalDetailBackingBean.downloadFile(financeList.scQtCheckList.scQtCheckListAttachment)}"
						rendered="#{!empty financeList.scQtCheckList.scQtCheckListAttachment}" />



				</ui:fragment>
			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
