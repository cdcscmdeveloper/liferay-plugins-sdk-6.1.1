<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width: 100%;">
		<tr>    
			<td><p:tabView id="supplierinfotabViewid" dynamic="true" 
			         activeIndex="#{supplierProposalDetailBackingBean.managedBean.supplierInfoActiveIndex}"> <!-- #25089@hatta - start -->
					<p:ajax event="tabChange" listener="#{supplierProposalDetailBackingBean.onTabChange}" /> <!-- #25089@hatta - end -->
					<ui:param name="smSupplier"
						value="#{supplierProposalDetailBackingBean.managedBean.smSupplier}" />
					<ui:param name="smAppl"
						value="#{supplierProposalDetailBackingBean.managedBean.smAppl}" />
					<ui:param name="qtProposal"
						value="#{supplierProposalDetailBackingBean.managedBean.qtProposal}" />

					<p:tab id="tab1" title="#{lbl['lbl.sc.spec.supplier.info']}">
						<ui:include
							src="/xhtml/sc/supplierproposal/financialproposal/supplierCompanyDetails.xhtml" />
					</p:tab>

					<p:tab id="tab2" title="#{lbl['lbl.sc.sp.branch']}">
						<ui:include
							src="/xhtml/sc/supplierproposal/financialproposal/supplierBranchesInfo.xhtml" />
					</p:tab>

					<p:tab id="tab3" title="#{lbl['lbl.sc.sp.capital.info']}">
						<ui:include
							src="/xhtml/sc/supplierproposal/financialproposal/supplierCapitalInfo.xhtml" />
					</p:tab>

					<p:tab id="tab4" title="#{lbl['lbl.sc.sp.personnel']}">
						<ui:include
							src="/xhtml/sc/supplierproposal/financialproposal/supplierPersonnelInfo.xhtml" />
					</p:tab>

					<p:tab id="tab5" title="#{lbl['lbl.sc.sp.bank.info']}">
						<ui:include
							src="/xhtml/sc/supplierproposal/financialproposal/supplierBankInfo.xhtml" />
					</p:tab>

					<p:tab id="tab6" title="#{lbl['lbl.sc.sp.categories.code']}"
						styleClass="noBorders tr,noBorders td">
						<ui:include
							src="/xhtml/sc/supplierproposal/financialproposal/supplierCategoryCodes.xhtml" />
					</p:tab>


					<p:tab rendered="#{statusHide}">
						<f:facet name="title">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.scores']} " />
						</f:facet>
						<p:spacer height="15"></p:spacer>
						<ui:include
							src="#{evaluationBackingBean.managedBean.evaluationPage}"></ui:include>
					</p:tab>

				</p:tabView></td>
		</tr>
	</table>
	<!-- #25089@hatta - start -->
	<c:if test="#{supplierProposalDetailBackingBean.managedBean.supplierInfoActiveIndex eq 0}">
            <p:poll interval="1" listener="#{supplierProposalDetailBackingBean.dafaultPopUpSupplierInfo}" widgetVar="stopPoller"/>
    </c:if> 
	<p:dialog id="popUpInfoDlg" widgetVar="popUpInfoDlg"
			header="#{lbl['lbl.sc.reminder']}" resizable="false"
			width="auto" height="100" closable="false">
			<table>
				<tr><td style="float: left;"><p:outputLabel value="#{lbl['lbl.sc.qt.dialog.popup.supplier.first']}" /></td></tr>
				<tr><td style="float: left;"><p:outputLabel value="#{lbl['lbl.sc.qt.dialog.popup.supplier.second']}" /></td></tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" 
					onclick="popUpInfoDlg.hide();stopPoller.stop();" type="button" partialSubmit="true" process="@this"/>
			</div>
	</p:dialog>
	<!-- #25089@hatta - end -->
</ui:composition>
