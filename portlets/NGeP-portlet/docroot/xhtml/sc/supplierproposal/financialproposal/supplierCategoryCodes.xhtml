<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">
		<p:dataTable id="supplierCategory" rowIndexVar="index" rows="10"
			rowKey="#{supplierCategory}" value="#{smAppl.smSupplierCategories}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="supplierCategory">
			<ac:paginator for="supplierCategory"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.category.code']}" style="width : 10%; ">
				<h:outputText
					value="#{supplierCategory.pmCategoryL1.categoryL1Code}"/><h:outputText
					value="#{supplierCategory.pmCategoryL2.categoryL2Code}"/><h:outputText
					value="#{supplierCategory.pmCategoryL3.categoryL3Code}"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}" style="white-space : normal; width : 40%; ">
				<h:outputText value="#{supplierCategory.pmCategoryL1Name}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.sub.category']}" style="white-space : normal; width : 20%; ">
				<h:outputText value="#{supplierCategory.pmCategoryL2Name}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}" style="white-space : normal; width : 20%; ">
				<h:outputText value="#{supplierCategory.pmCategoryL3Name}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.category.type']}" style="width : 10%; ">
				<h:outputText
					value="#{(supplierCategory.specialCategory) ? 'Special' : 'Normal'}"></h:outputText>
			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
