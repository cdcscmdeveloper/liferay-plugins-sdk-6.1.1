<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="finNonFedExp"
		header="#{lbl['lbl.sc.spec.company.exp.fed.private']}"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sp.btn.complete.instruction']}" escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}" />

		<table>
			<tr>
				<td><p:outputLabel style="font-weight: bold;"
						value="#{supplierProposalDetailBackingBean.managedBean.year}" />
					<p:outputLabel
						value="#{lbl['lbl.sc.spec.company.exp.since.year']} " /></td>
			</tr>
		</table>
		<p:dataTable id="financenongovtid" var="financenongovt"
			value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPExperiences}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{financenongovt}" rowIndexVar="rowIndex">

			<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}"
				style="white-space : normal ; width : 15%;">
					#{financenongovt.clientName}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}"
				style="white-space : normal; width : 20%;">
					#{financenongovt.contractTitle}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}"
				style=" width : 10%;">
					#{financenongovt.contractNo}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.effective.date']}"
				style=" width : 10%;">
				<h:outputText value="#{financenongovt.effectiveDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.exp.date']}"
				style=" width : 10%;">
				<h:outputText value="#{financenongovt.expiryDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}"
				style=" width : 10%;">
				<h:outputText value="#{financenongovt.contractPeriod}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column style=" width : 10%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.contarct.amount']}" />
				</f:facet>
				<p:inputText id="contractAmt" value="#{financenongovt.contractAmt}"
					size="15" style="text-align: right;" disabled="#{statusHide}"
					maxlength="14" required="true"
					label="#{lbl['lbl.sc.spec.contarct.amount']}">
					<f:validateLongRange minimum="1" maximum="99999999999999" />
					<p:ajax event="blur" process="@this"
						listener="#{supplierProposalDetailBackingBean.totalContractAmount}"
						update="@this,contractAmtMsg, :form:totalcontractamt" />
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<p:message id="contractAmtMsg" for="contractAmt" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}"
				style="white-space : normal;  width : 15%;">
				<p:inputTextarea value="#{financenongovt.remark}" rows="3" cols="17" maxlength="300"
				onkeyup="limitTextArea(this,300);" onkeydown="limitTextArea(this,300);"
					disabled="#{statusHide}" />
			</p:column>

		</p:dataTable>
		<p:spacer height="5" />
	</p:panel>


</ui:composition>
