
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dataTable id="#{cmpExpGovNGov}" rowIndexVar="index"
		var="cmpExpStatusValue"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{cmpContractStatus}" rowKey="#{cmpExpStatusValue}"
		style="width:100%">
		<ac:paginator for="#{cmpExpGovNGov}"></ac:paginator>
		<p:column style="width:60%;white-space: normal;">

			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.comp.exp.federal.gov']}"
					rendered="#{SourcingConstants.FINANCIAL_GOVERNMENT_COMPANY_EXPERIENCE eq chkDefinationKey}" />
				<h:outputText value="#{lbl['lbl.sc.fin.comp.exp.non.federal.gov']}"
					rendered="#{SourcingConstants.FINANCIAL_NONGOVERNMENT_COMPANY_EXPERIENCE eq chkDefinationKey}" />

			</f:facet>
			<h:outputText value="#{cmpExpStatusValue.numOfContractsValue}"></h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.comp.exp.inactive']}">
			<h:outputText rendered="#{cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.inEffectiveContractValue}">

				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat( CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
					maxIntegerDigits="14" />
			</h:outputText>

			<h:outputText rendered="#{!cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.inEffectiveContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT )}"
					maxIntegerDigits="14" />
			</h:outputText>

		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.comp.exp.effective']}">
			<h:outputText rendered="#{cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.effectiveContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER )}"
					maxIntegerDigits="14" />
			</h:outputText>
			<h:outputText rendered="#{!cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.effectiveContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT )}"
					maxIntegerDigits="14" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.comp.exp.expired']}">
			<h:outputText rendered="#{cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.expiredContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
					maxIntegerDigits="14" />
			</h:outputText>
			<h:outputText rendered="#{!cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.expiredContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT )}"
					maxIntegerDigits="14" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.comp.exp.terminated']}">
			<h:outputText rendered="#{cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.terminatedContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
					maxIntegerDigits="14" />
			</h:outputText>
			<h:outputText rendered="#{!cmpExpStatusValue.format}"
				value="#{cmpExpStatusValue.terminatedContractValue}">
				<ac:validateNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT )}"
					maxIntegerDigits="14" />
			</h:outputText>
		</p:column>
	</p:dataTable>

	<p:spacer height="20px;"></p:spacer>
	<p:dataTable id="#{cmpExpPrcNonPrc}" rowIndexVar="index" rows="10"
		var="experience" value="#{cmpExpProcNonProcList}"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		rowKey="#{experience}" style="width:100%;">
		<ac:paginator for="#{cmpExpPrcNonPrc}"></ac:paginator>
		<p:column style="width:10%;white-space: normal;word-wrap: break-word;"
			headerText="#{lbl['lbl.sm.projDtls.clientName']}">
			<h:outputText
				value="#{experience.pmOrgProfile.pmOrgValidity.orgName}"
				rendered="#{SourcingConstants.FINANCIAL_GOVERNMENT_COMPANY_EXPERIENCE eq chkDefinationKey}" />
			<h:outputText value="#{experience.clientName}"
				rendered="#{SourcingConstants.FINANCIAL_NONGOVERNMENT_COMPANY_EXPERIENCE eq chkDefinationKey}" />
		</p:column>
		<p:column style="width:20%;"
			headerText="#{lbl['lbl.sc.fin.prc.proj.cont.title']}">
			<h:outputText value="#{experience.contractTitle} "
				style="white-space: normal;word-wrap: break-word;" />
		</p:column>
		<p:column style="width:10%;white-space: normal;word-wrap: break-word;"
			headerText="#{lbl['lbl.sc.fin.file.ref.no']}">
			<h:outputText value="#{experience.fileRefrenceNo} " />
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.letter.accept.no']}">

			<h:outputText
				value="#{supplierProposalDetailBackingBean.getLabelContent(experience.loaNo)}" />

		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.eff.date']}">
			<h:outputText value="#{experience.effectiveDate}">
				<f:convertDateTime
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.exp.date']}">
			<h:outputText value="#{experience.expiryDate}">
				<f:convertDateTime
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.value.amt']}">
			<h:outputText value="#{experience.contractAmt}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.cont.status']}" />
				<ac:iconTooltip value="#{lbl['lbl.sc.fin.cont.status.tooltip']}" />
			</f:facet>
			<h:outputText
				value="#{supplierProposalDetailBackingBean.checkContractStatusLabel(experience.contractStatus)}"></h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.letter.of.acceptance']}" />
				<ac:iconTooltip escape="false"
					value="#{lbl['lbl.sc.fin.letter.of.acceptance.tooltip']}" />
			</f:facet>
			<p:commandButton icon="ui-icon-download"
				rendered="#{supplierProposalDetailBackingBean.loaReportCheck(experience)}"
				style="background-color:transparent !important; border:0px none;"
				action="#{supplierProposalDetailBackingBean.downloadCompExpLOAReports(experience)}"
				ajax="false" />

			<h:outputText
				value="#{supplierProposalDetailBackingBean.getLabelContent(' ')}"
				rendered="#{!supplierProposalDetailBackingBean.loaReportCheck(experience)}"></h:outputText>
		</p:column>
	</p:dataTable>



</ui:composition>
