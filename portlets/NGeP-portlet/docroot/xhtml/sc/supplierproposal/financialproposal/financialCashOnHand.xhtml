<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="cashOnHandPanel" header="#{lbl['lbl.sc.spec.cash.hand']}"
		toggleable="true">
		<p:dataTable id="cashonhandid" var="cashonhand"
			value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPCashOnHand}"
			rowKey="#{cashonhand}" rowIndexVar="rowIndex">
			<ac:paginator for="cashonhand" />
			<p:column style="width:2%" rendered="#{!statusHide}">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{supplierProposalDetailBackingBean.managedBean.selectedAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=cashonhandid])"
							listener="#{supplierProposalDetailBackingBean.selectAllCashOnHand}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					value="#{supplierProposalDetailBackingBean.managedBean.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this"
						listener="#{supplierProposalDetailBackingBean.selectedCashOnHand(rowIndex)}" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="white-space : normal; width : 21%; ">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.bank.name']}" />
				</f:facet>
				<h:outputText value="#{cashonhand.bankName}"
					rendered="#{cashonhand.brandNew eq false}" />
				<p:inputText id="bankName" value="#{cashonhand.bankName}" size="20"
					required="true" maxlength="100" style="width : 85%;"
					label="#{lbl['lbl.sc.bank.name']}"
					rendered="#{cashonhand.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,bankNameMsg" />
				</p:inputText>
				<p:message id="bankNameMsg" for="bankName" display="icon" />
			</p:column>
			<p:column style="width : 21%; ">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.account.no']}" />
				</f:facet>
				<h:outputText value="#{cashonhand.accountNum}"
					rendered="#{cashonhand.brandNew eq false}" />
				<p:inputText id="accountNum" value="#{cashonhand.accountNum}"
					size="20" required="true" maxlength="30" style="width : 85%"
					label="#{lbl['lbl.sc.account.no']}"
					rendered="#{cashonhand.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,accountNumMsg" />
				</p:inputText>
				<p:message id="accountNumMsg" for="accountNum" display="icon" />
			</p:column>

			<p:column style="width : 23%; ">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.account.type']}" />
				</f:facet>
				<p:outputLabel style="float : left"
					value="#{supplierProposalDetailBackingBean.getParameterDesc(cashonhand.accountType)}"
					rendered="#{cashonhand.brandNew eq false}" />
				<p:selectOneMenu id="accountType"
					value="#{cashonhand.accountType.parameterId}"
					style="width: 85%;margin-bottom: 5px;" required="true"
					label="#{lbl['lbl.sc.account.type']}"
					rendered="#{cashonhand.brandNew eq true}">
					<f:selectItems
						value="#{supplierProposalDetailBackingBean.getDropdownValues(ParameterTypeConst.accountType)}" />
					<p:ajax event="change" process="@this" partialSubmit="true"
						update="@this,accountTypeMsg"
						listener="#{supplierProposalDetailBackingBean.accountTypeChange(cashonhand)}" />
				</p:selectOneMenu>
				<p:message id="accountTypeMsg" for="accountType" display="icon" />
			</p:column>

			<p:column style="white-space : normal; width : 23%; ">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.address']}" />
				</f:facet>
				<h:outputText value="#{cashonhand.bankAddress}"
					rendered="#{cashonhand.brandNew eq false}" />
				<p:inputTextarea id="bankAddress" value="#{cashonhand.bankAddress}"
					cols="35" rows="2" required="true" maxlength="100"
					style="width : 85%;" label="#{lbl['lbl.sc.address']}"
					rendered="#{cashonhand.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,bankAddressMsg" />
				</p:inputTextarea>
				<p:message id="bankAddressMsg" for="bankAddress" display="icon" />
			</p:column>

			<p:column style="text-align:right ; width : 10%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.amount']}" />
				</f:facet>
				<h:outputText value="#{cashonhand.cashAmount}"
					rendered="#{cashonhand.brandNew eq false}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<p:inputText id="cashAmount" value="#{cashonhand.cashAmount}"
					size="20" style="text-align:right" required="true" maxlength="14"
					label="#{lbl['lbl.sc.amount']}" style="width : 85%"
					rendered="#{cashonhand.brandNew eq true}">
					<p:ajax event="blur" process="@this"
						listener="#{supplierProposalDetailBackingBean.totalCashOnHandSum}"
						update="@this,cashAmountMsg, :form:totalcashonhand" />
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<p:message id="cashAmountMsg" for="cashAmount" display="icon" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				rendered="#{!statusHide and !supplierProposalDetailBackingBean.managedBean.closed}"
				process="@all" partialSubmit="true" styleClass="BtnSpacing"
				action="#{supplierProposalDetailBackingBean.addCashOnHand}"
				update="@([id$=cashOnHandPanel])" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				rendered="#{!statusHide and !supplierProposalDetailBackingBean.managedBean.closed}"
				partialSubmit="true" process="@this" styleClass="BtnSpacing"
				update="@([id$=finCashOnHandDeleteId])"
				action="#{supplierProposalDetailBackingBean.deleteCashOnHand}" />

			<ui:param name="finCashOnHandDeleteId" value="finCashOnHandDeleteId"></ui:param>

			<ac:confirmationPopup id="#{finCashOnHandDeleteId}"
				widget="finCashOnHandDelete" width="400" height="200"
				okAction="supplierProposalDetailBackingBean.deleteCashOnHand"
				title="#{lbl['lbl.sc.spec.cash.hand']}"
				content="#{lbl['lbl.sc.dialog.confirm.message']}"
				update="@([id$=cashOnHandPanel])" />

		</div>

		<table style="width: 100%">
			<tr>
				<td style="width: 155px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.total.cash']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						id="totalcashonhand"
						value="#{supplierProposalDetailBackingBean.managedBean.totalcashHand}"
						readonly="true" disabled="true" size="30">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.system.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<p:outputLabel value="* " styleClass="mandatory" />


					</ui:fragment></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						id="financialCashOnHandUserScoreId"
						label="#{lbl['lbl.tpl.spec.content.user.score']}"
						value="#{noOfContracts.userScore}" maxlength="18" required="true"
						disabled="#{pageDisable}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="financialCashOnHandUserScoreMessage"
						for="financialCashOnHandUserScoreId" display="icon">
					</p:message></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
