<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-back" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveFinancialCreditFacilityAction}" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check" />
		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.sp.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.scQtCheckList.title}"
							disabled="true" size="150" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.sp.credit.facilities']}"
			toggleable="true">
			<p:dataTable id="creditfaciitiesid" var="creditfacilities"
				value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPCreditFacilities}"
				rowKey="#{creditfacilities}" rowIndexVar="rowIndex"
				selection="#{supplierProposalDetailBackingBean.managedBean.selectedPRPCreditFacilities}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="technongovtid" />

				<p:column headerText="#{lbl['lbl.sc.sp.bank.name']}">
					<h:outputText value="#{creditfacilities.bankName}"
						rendered="#{creditfacilities.brandNew eq false}" />
					<p:inputText value="#{creditfacilities.bankName}" size="30"
						rendered="#{creditfacilities.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.address']}">
					<h:outputText value="#{creditfacilities.bankAddress}"
						rendered="#{creditfacilities.brandNew eq false}" />
					<p:inputTextarea value="#{creditfacilities.bankAddress}" cols="30"
						rows="3" rendered="#{creditfacilities.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.credit.type']}">
					<h:outputText value="#{creditfacilities.creditType.parameterId}"
						rendered="#{creditfacilities.brandNew eq false}" />
					<p:selectOneMenu value="#{creditfacilities.creditType.parameterId}"
						style="width: 178px;margin-bottom: 5px;"
						rendered="#{creditfacilities.brandNew eq true}">
						<f:selectItems
							value="#{supplierProposalDetailBackingBean.getDropdownValues(ParameterTypeConst.creditType)}" />
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.amt.credit']}">
					<h:outputText value="#{creditfacilities.creditAmt}"
						rendered="#{creditfacilities.brandNew eq false}" />
					<p:inputText value="#{creditfacilities.creditAmt}" size="30"
						rendered="#{creditfacilities.brandNew eq true}">
						<p:ajax event="blur" process="@this" partialSubmit="true"
							listener="#{supplierProposalDetailBackingBean.totalCreditSum}"
							update=":form:totalcredit,:form:totalamtpaid,:form:percentagePaidID" />
					</p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.amt.paid']}">
					<h:outputText value="#{creditfacilities.amtPaid}"
						rendered="#{creditfacilities.brandNew eq false}" />
					<p:inputText value="#{creditfacilities.amtPaid}" size="30"
						rendered="#{creditfacilities.brandNew eq true}">
						<p:ajax event="blur" process="@this" partialSubmit="true"
							listener="#{supplierProposalDetailBackingBean.totalAmtPaidSum}"
							update=":form:totalcredit,:form:totalamtpaid,:form:percentagePaidID" />
					</p:inputText>
				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.addbtn']}"
					process="@this,creditfaciitiesid" partialSubmit="true"
					action="#{supplierProposalDetailBackingBean.addCreditFacilities}"
					update="creditfaciitiesid" icon="ui-icon-add" />

				<p:commandButton value="#{lbl['lbl.so.delete']}"
					icon="ui-icon-delete" update="creditfaciitiesid"
					action="#{supplierProposalDetailBackingBean.deleteCreditFacilities}"  />

			</div>
			

			<table style="width: 100%">
				<tr>
					<td style="width: 140px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.ttl.credit']} " /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							id="totalcredit"
							value="#{supplierProposalDetailBackingBean.managedBean.totalAmountCredit}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td style="width: 140px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.ttl.paid']} " /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							id="totalamtpaid"
							value="#{supplierProposalDetailBackingBean.managedBean.totalAmountPaid}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td style="width: 140px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.percentage.paid']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right" id="percentagePaidID"
							value="#{supplierProposalDetailBackingBean.managedBean.totalPercentagePaid}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
						</p:inputText></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
