<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				icon="ui-icon-back"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveTechNonGovCompanyExpAction}" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check" />
		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.sp.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.scQtCheckList.title}"
							disabled="true" size="150" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.sp.non.gov']}" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sp.note1']}" /></td>
				</tr>
			</table>
			<p:dataTable id="technongovtid" var="technongovt"
				value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPExperiences}"
				rowKey="#{technongovt}" rowIndexVar="rowIndex"
				selection="#{supplierProposalDetailBackingBean.managedBean.selectedPRPExperiences}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="technongovtid" />

				<p:column headerText="#{lbl['lbl.sc.sp.agencyname']}">
					<h:outputText value="#{technongovt.clientName}"
						rendered="#{technongovt.brandNew eq false}" />
					<p:inputText value="#{technongovt.clientName}" size="20"
						rendered="#{technongovt.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contracttitle']}">
					<h:outputText value="#{technongovt.contractTitle}"
						rendered="#{technongovt.brandNew eq false}" />
					<p:inputText value="#{technongovt.contractTitle}" size="20"
						rendered="#{technongovt.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contractno']}">
					<h:outputText value="#{technongovt.contractNo}"
						rendered="#{technongovt.brandNew eq false}" />
					<p:inputText value="#{technongovt.contractNo}" size="20"
						rendered="#{technongovt.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.effectivedt']}">
					<h:outputText value="#{technongovt.effectiveDate}"
						rendered="#{technongovt.brandNew eq false}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
					<p:calendar value="#{technongovt.effectiveDate}" showOn="button"
						size="20" rendered="#{technongovt.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.expirydt']}">
					<h:outputText value="#{technongovt.expiryDate}"
						rendered="#{technongovt.brandNew eq false}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
					<p:calendar value="#{technongovt.expiryDate}" showOn="button"
						size="20" rendered="#{technongovt.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contractperiod']}">
					<h:outputText value="#{technongovt.contractPeriod}"
						rendered="#{technongovt.brandNew eq false}" />
					<p:inputText value="#{technongovt.contractPeriod}" size="20"
						rendered="#{technongovt.brandNew eq true}">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalContractYears}"
							update=":form:totalcontractyrs" />
					</p:inputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.remarks']}">
					<h:outputText value="#{technongovt.remark}"
						rendered="#{technongovt.brandNew eq false}" />
					<p:inputTextarea value="#{technongovt.remark}"
						rendered="#{technongovt.brandNew eq true}" rows="3" cols="20" />
				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.addbtn']}"
					process="@this,technongovtid" partialSubmit="true"
					action="#{supplierProposalDetailBackingBean.addNonFederalGovtExperience}"
					update="technongovtid, totalcontractyrs" icon="ui-icon-add" />

				<p:commandButton value="#{lbl['lbl.so.delete']}"
					icon="ui-icon-delete" update="technongovtid, totalcontractyrs"
					action="#{supplierProposalDetailBackingBean.deleteNonFederalGovtExperience}" />
			</div>

			<h:panelGroup id="totalcontractyrs">
				<table style="width: 100%">
					<tr>
						<td style="width: 140px"><p:outputLabel
								value="#{lbl['lbl.sc.sp.ttlnoofcontracts']}" /></td>
						<td colspan="3"><p:inputText style="text-align:right"
								value="#{supplierProposalDetailBackingBean.managedBean.totalContracts}"
								readonly="true" disabled="true" size="30">
							</p:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.sp.ttlnoofyears']}" /></td>
						<td colspan="3"><p:inputText style="text-align:right"
								value="#{supplierProposalDetailBackingBean.managedBean.totalYears}"
								readonly="true" disabled="true" size="30" /></td>
					</tr>
				</table>
			</h:panelGroup>
		</p:panel>

	</ui:define>
</ui:composition>
