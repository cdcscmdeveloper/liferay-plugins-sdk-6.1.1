<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.sp.fed.gov']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sp.note1']}" /></td>
			</tr>
		</table>
		<p:dataTable id="techgovtid" var="techgovt"
			value="#{supplierProposalDetailBackingBean.managedBean.scLoaList}"
			rowKey="#{techgovt}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="techgovtid" />

			<p:column headerText="#{lbl['lbl.sc.sp.agencyname']}">
				<h:outputText value="#{techgovt.scLoiLoa.pmOrgProfile.orgName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contracttitle']}">
				<h:outputText value="#{techgovt.scLoiLoa.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contractno']}">
				<h:outputText value="#{techgovt.loaNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.effectivedt']}">
				<h:outputText value="#{techgovt.contractEffDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.expirydt']}">
				<h:outputText value="#{techgovt.contractExpDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contractperiod']}">
				<h:outputText style="float : right"
					value="#{techgovt.contractDuration.intValue()/12}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
		<p:spacer height="5" />
		<table style="width: 100%">
			<tr>
				<td style="width: 140px"><p:outputLabel
						value="#{lbl['lbl.sc.sp.ttlnoofcontracts']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.contractSize}"
						readonly="true" disabled="true" size="30" /></td>
				<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <h:outputText
						value="#{lbl['lbl.sc.eva.s1.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{checklistScoreType eq '1'}"></p:inputText> <p:inputText
						value="#{noOfContracts.userScore}" maxlength="18"
						style="text-align:right" rendered="#{ checklistScoreType eq '2'}"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sp.ttlnoofyears']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.noOfYears /12}"
						readonly="true" disabled="true" size="30">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</p:inputText></td>
				<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
						rendered="#{companyScoreType eq '1'}" /> <h:outputText
						value="#{lbl['lbl.sc.eva.s1.user.score']}"
						rendered="#{companyScoreType eq '2'}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfYears.autoScore}" style="text-align:right"
						rendered="#{companyScoreType eq '1'}"></p:inputText> <p:inputText
						maxlength="18" style="text-align:right"
						value="#{noOfYears.userScore}"
						rendered="#{companyScoreType eq '2'}"></p:inputText></td>
			</tr>
		</table>



	</p:panel>


</ui:composition>
