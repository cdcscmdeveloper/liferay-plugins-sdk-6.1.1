<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="techCLMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-back" />
		</div>
		
		<ui:include src="checklistHeader.xhtml" />

		<p:panel header="#{lbl['lbl.sc.sp.fed.gov']}" toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sp.note1']}" /></td>
				</tr>
			</table>
			<p:dataTable id="financegovtid" var="financegovt"
				value="#{supplierProposalDetailBackingBean.managedBean.scLoaList}"
				rowKey="#{financegovt}" rowIndexVar="rowIndex"
				rows="10">
				
				<ac:paginator for="financegovtid" />

				<p:column headerText="#{lbl['lbl.sc.sp.agencyname']}">
					<h:outputText value="#{financegovt.scLoiLoa.pmOrgProfile.orgName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contracttitle']}">
					<h:outputText value="#{financegovt.scLoiLoa.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contractno']}">
					<h:outputText value="#{financegovt.loaNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.effectivedt']}">
					<h:outputText value="#{financegovt.contractEffDate}">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.expirydt']}">
					<h:outputText value="#{financegovt.contractExpDate}">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contractperiod']}">
					<h:outputText style="float : right" value="#{financegovt.contractDuration.intValue()/12}">
						<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.contract.amt']}" style="text-align:right">
					<h:outputText value="#{financegovt.loaAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>
			<p:spacer height="5" />
			<table style="width: 100%">
				<tr>
					<td style="width: 170px"><p:outputLabel
							value="#{lbl['lbl.ss.sp.ttl.cotract.amt']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.totalContractAmount}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
