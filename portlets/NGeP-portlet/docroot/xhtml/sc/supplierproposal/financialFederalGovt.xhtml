<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.sp.fed.gov']}" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sp.note1']}" /></td>
				<td>#{supplierProposalDetailBackingBean.managedBean.year}</td>
			</tr>
		</table>
		<p:dataTable id="financegovtid" var="financegovt"
			value="#{supplierProposalDetailBackingBean.managedBean.scLoaList}"
			rowKey="#{financegovt}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="financegovtid" />

			<p:column headerText="#{lbl['lbl.sc.sp.agencyname']}"
				style="white-space : normal; width : 20%; ">
				<h:outputText value="#{financegovt.scLoiLoa.pmOrgProfile.orgName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contracttitle']}"
				style="white-space : normal; width : 30%; ">
				<h:outputText value="#{financegovt.scLoiLoa.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contractno']}"
				style=" width : 10%; ">
				<h:outputText value="#{financegovt.loaNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.effectivedt']}"
				style=" width : 10%; ">
				<h:outputText value="#{financegovt.contractEffDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.expirydt']}"
				style=" width : 10%; ">
				<h:outputText value="#{financegovt.contractExpDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contractperiod']}"
				style="width : 10%; ">
				<h:outputText style="float : right"
					value="#{financegovt.contractDuration.intValue()/12}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.contract.amt']}"
				style="text-align:right; width : 10%;">
				<h:outputText value="#{financegovt.loaAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
		<p:spacer height="5" />
		<table style="width: 100%">
			<tr>
				<td style="width: 170px"><p:outputLabel
						value="#{lbl['lbl.ss.sp.ttl.cotract.amt']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.totalContractAmount}"
						readonly="true" disabled="true" size="15">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td style="width: 80px;"><h:outputText
						value="#{lbl['lbl.sc.eva.auto.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<h:outputText value="* " styleClass="mandatory" />


					</ui:fragment> <h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						value="#{noOfContracts.userScore}" maxlength="18"
						disabled="#{pageDisable}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}"></p:inputText> <p:spacer
						width="5"></p:spacer> <h:outputText value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
