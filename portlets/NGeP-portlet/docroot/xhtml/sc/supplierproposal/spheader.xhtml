<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 245px"><h:outputLabel
							value="#{lbl['lbl.sc.sp.qtno']}" /></td>
					<td><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.qt.qtNo}"
							disabled="true" size="30" /></td>
					<td style="width: 210px"><h:outputLabel
							value="#{lbl['lbl.sc.sp.proposal.no']}" /></td>
					<td><p:inputText disabled="true" size="30" /></td>
					<td style="width: 210px"><h:outputLabel
							value="#{lbl['lbl.sc.sp.closing.date']}" /></td>
					<td><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.qt.closingDate}"
							disabled="true" size="30">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>
					<td style="width: 198px"><h:outputLabel
							value="#{lbl['lbl.sc.sp.remaining.day']}" /></td>
					<td><p:inputText disabled="true" size="30" /></td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
