<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table style="width: 100%">
				<tr>
					<td ><h:outputLabel
							value="#{lbl['lbl.sc.quotation.tender.no']}" /></td>
					<td class="header-info-text"> #{supplierProposalDetailBackingBean.managedBean.qt.qtNo}</td>
					<td ><h:outputLabel
							value="#{lbl['lbl.sc.proposal.no']}" /></td>
					<td class="header-info-text">#{supplierProposalDetailBackingBean.managedBean.qtProposal.proposalNo}
					</td>
					<td ><h:outputLabel
							value="#{lbl['lbl.sc.closing.date']}" /></td>
					<td class="header-info-text"><h:outputText style="float : left;"
							value="#{supplierProposalDetailBackingBean.managedBean.qt.closingDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText></td>
					<td ><h:outputLabel
							value="#{lbl['lbl.sc.remaining.day']}" /></td>
					<td class="header-info-text">#{supplierProposalDetailBackingBean.managedBean.days}</td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
