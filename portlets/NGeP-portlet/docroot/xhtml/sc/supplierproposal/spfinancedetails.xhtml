<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.financial.proposal']}"
		toggleable="true">
		<p:dataTable id="financeDeailsId" var="financeList"
			value="#{supplierProposalDetailBackingBean.managedBean.financeCheckDetailsList}"
			selection="#{supplierProposalDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{financeList}" rowIndexVar="rowIndex">

			<ac:paginator for="financeDeailsId" />

			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="" />

					<p:column headerText="#{lbl['lbl.sc.descriptions']}"
						style="width:68%; white-space: normal;" />

					<p:column headerText="#{lbl['lbl.sc.instruction']}"
						style="width:15%" />

					<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%" />

				</p:row>
			</p:columnGroup>

			<p:column style="width:2%">
				<p:selectBooleanCheckbox id="allChk"
					value="#{financeList.submitted}" disabled="true" />
			</p:column>

			<p:column>
				<h:outputText value="#{financeList.scQtCheckList.title}" />
			</p:column>

			<p:column />

			<p:column>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'TS' or financeList.scQtCheckList.definationType.parameterCode eq 'WF'}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareFinancialAction(financeList)}"
						value="Prepare" />
				</ui:fragment>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'SP' or financeList.scQtCheckList.definationType.parameterCode eq 'SD'}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareFinancialViewAction(financeList)}"
						value="View" icon="ui-icon-agree" />
				</ui:fragment>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'UP'}">
					<p:commandButton onclick="attachDlg1.show();return false;"
						icon="iconAttachment" update="financeDeailsId" value="Attachment">
						<f:setPropertyActionListener value="#{financeList}"
							target="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist}" />
					</p:commandButton>
				</ui:fragment>

			</p:column>

		</p:dataTable>
	</p:panel>

	<p:dialog id="attachDlg1id" widgetVar="attachDlg1" modal="true"
		resizable="false" width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{supplierProposalDetailBackingBean.handleFileUpload}"
			mode="advanced" id="uploads1"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="financeDeailsId" oncomplete="attachDlg1.hide()">
		</p:fileUpload>
	</p:dialog>

</ui:composition>
