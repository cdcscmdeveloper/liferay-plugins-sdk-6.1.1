<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.sp.header.finance.proposal']}"
		toggleable="true">
		<p:dataTable id="financeDeailsId" var="financeList"
			value="#{sPDetailBackingBean.managedBean.financeCheckDetailsList}"
			selection="#{sPDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{financeList}" rowIndexVar="rowIndex">

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.sp.desc']}" style="width:68%">
				<h:outputText value="#{financeList.scQtCheckList.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.instruction']}"
				style="width:15%">
			</p:column>

			<p:column headerText="Doc Definition Key" style="width:10%">
				<h:outputText
					value="#{financeList.scQtCheckList.scQtDoc.document.docDefinitionKey}" />
			</p:column>

			<p:column headerText="Doc Definition Type" style="width:10%">
				<h:outputText
					value="#{financeList.scQtCheckList.definationType.parameterCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.action']}" style="width:10%">
				<!-- <ui:fragment
					rendered="#{financeList.scQtCheckList.scQtDoc.document.docDefinitionKey == 'SD'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareSupplierDetailsAction(financeList)}"
						value="Prepare" process="@this" partialSubmit="true" ajax="false" />
				</ui:fragment>
				<ui:fragment
					rendered="#{financeList.scQtCheckList.scQtDoc.document.docDefinitionKey == 'CF'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareCreditFacilitiesAction(financeList)}"
						value="Prepare" />
				</ui:fragment>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.scQtDoc.document.docDefinitionKey == 'FG'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareCompanyExperienceGovtAction(financeList)}"
						value="View" />
				</ui:fragment> -->

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'TS' or financeList.scQtCheckList.definationType.parameterCode eq 'WF' or financeList.scQtCheckList.definationType.parameterCode eq 'SD'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareFinancialAction(financeList)}"
						value="Prepare" />
				</ui:fragment>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'SP' or financeList.scQtCheckList.definationType.parameterCode eq 'SD'}}">
					<p:commandButton value="View" icon="ui-icon-agree" />
				</ui:fragment>

				<ui:fragment
					rendered="#{financeList.scQtCheckList.definationType.parameterCode eq 'UP'}">
					<p:commandButton onclick="attachDlg1.show();return false;"
						icon="iconAttachment" value="Attachment">

					</p:commandButton>
				</ui:fragment>

			</p:column>

		</p:dataTable>
	</p:panel>

	<p:dialog id="attachDlg1id" widgetVar="attachDlg1" modal="true"
		resizable="false" width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
	</p:dialog>

</ui:composition>
