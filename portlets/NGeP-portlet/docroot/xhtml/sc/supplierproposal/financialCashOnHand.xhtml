<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="techCLMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	
		<div class="ppRightBtn">				
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				process="@this" partialSubmit="true"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-back" />
				
			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveFinancialCashOnHandAction(false)}"
				process="@all" partialSubmit="true" update="@all" />

			<p:commandButton value="#{lbl['lbl.btn.complete']}" 
				action="#{supplierProposalDetailBackingBean.saveFinancialCashOnHandAction(true)}"
				process="@all" partialSubmit="true" update="@all"
				icon="ui-icon-check" />
		</div>
		
		<ui:include src="checklistHeader.xhtml" />

		<p:panel header="#{lbl['lbl.sc.sp.cash.on.hand']}" toggleable="true">
			<p:dataTable id="cashonhandid" var="cashonhand"
				value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPCashOnHand}"
				rowKey="#{cashonhand}" rowIndexVar="rowIndex"
				selection="#{supplierProposalDetailBackingBean.managedBean.selectedPRPCashOnHand}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="cashonhand" />

				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.sp.bank.name']}"/>
					</f:facet>
					<h:outputText id="bankName" value="#{cashonhand.bankName}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputText value="#{cashonhand.bankName}" size="20"
						required="true" maxlength="100"
						label="#{lbl['lbl.sc.sp.bank.name']}"
						rendered="#{cashonhand.brandNew eq true}" />
					<p:message id="bankNameMsg" for="bankName" display="icon" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.sp.ac.no']}"/>
					</f:facet>
					<h:outputText id="accountNum" value="#{cashonhand.accountNum}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputText value="#{cashonhand.accountNum}" size="20"
						required="true" maxlength="30"
						label="#{lbl['lbl.sc.sp.ac.no']}"
						rendered="#{cashonhand.brandNew eq true}" />
					<p:message id="accountNumMsg" for="accountNum" display="icon" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.sp.ac.type']}"/>
					</f:facet>
					<h:outputText value="#{supplierProposalDetailBackingBean.getParameterDesc(cashonhand.accountType)}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:selectOneMenu id="accountType" value="#{cashonhand.accountType.parameterId}"
						style="width: 178px;margin-bottom: 5px;"
						required="true"
						label="#{lbl['lbl.sc.sp.ac.type']}"
						rendered="#{cashonhand.brandNew eq true}">
						<f:selectItems
							value="#{supplierProposalDetailBackingBean.getDropdownValues(ParameterTypeConst.accountType)}" />
						<p:ajax event="change" listener="#{supplierProposalDetailBackingBean.accountTypeChange(cashonhand)}" />
					</p:selectOneMenu>
					<p:message id="accountTypeMsg" for="accountType" display="icon" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.sp.address']}"/>
					</f:facet>
					<h:outputText value="#{cashonhand.bankAddress}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputTextarea id="bankAddress" value="#{cashonhand.bankAddress}" cols="35"
						rows="2" required="true" maxlength="100"
						label="#{lbl['lbl.sc.sp.address']}"
						rendered="#{cashonhand.brandNew eq true}" />
					<p:message id="bankAddressMsg" for="bankAddress" display="icon" />
				</p:column>

				<p:column style="text-align:right">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.sp.amount']}"/>
					</f:facet>
					<h:outputText value="#{cashonhand.cashAmount}"
						rendered="#{cashonhand.brandNew eq false}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<p:inputText id="cashAmount" value="#{cashonhand.cashAmount}" size="20"
						 style="text-align:right"
						required="true" maxlength="19"
						label="#{lbl['lbl.sc.sp.amount']}"
						rendered="#{cashonhand.brandNew eq true}">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalCashOnHandSum}"
							update="@this, :form:totalcashonhand" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					<p:message id="cashAmountMsg" for="cashAmount" display="icon" />
				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.addbtn']}"
					process="@this,cashonhandid" partialSubmit="true"
					action="#{supplierProposalDetailBackingBean.addCashOnHand}"
					update="cashonhandid" icon="ui-icon-add" />

				<p:commandButton value="#{lbl['lbl.so.delete']}"
					icon="ui-icon-delete" update="cashonhandid, totalcashonhand"
					action="#{supplierProposalDetailBackingBean.deleteCashOnHand}" />

			</div>

			<table style="width: 100%">
				<tr>
					<td style="width: 155px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.ttl.cash.on.hand']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							id="totalcashonhand"
							value="#{supplierProposalDetailBackingBean.managedBean.totalcashHand}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
