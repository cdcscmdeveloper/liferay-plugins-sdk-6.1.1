<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-back" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveFinancialCashOnHandAction}" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-check" />
		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.sp.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.scQtCheckList.title}"
							disabled="true" size="150" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.sp.cash.on.hand']}" toggleable="true">
			<p:dataTable id="cashonhandid" var="cashonhand"
				value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPCashOnHand}"
				rowKey="#{cashonhand}" rowIndexVar="rowIndex"
				selection="#{supplierProposalDetailBackingBean.managedBean.selectedPRPCashOnHand}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="cashonhand" />

				<p:column headerText="#{lbl['lbl.sc.sp.bank.name']}">
					<h:outputText value="#{cashonhand.bankName}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputText value="#{cashonhand.bankName}" size="20"
						rendered="#{cashonhand.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.ac.no']}">
					<h:outputText value="#{cashonhand.accountNum}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputText value="#{cashonhand.accountNum}" size="20"
						rendered="#{cashonhand.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.ac.type']}">
					<h:outputText value="#{cashonhand.accountType.parameterId}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:selectOneMenu value="#{cashonhand.accountType.parameterId}"
						style="width: 178px;margin-bottom: 5px;"
						rendered="#{cashonhand.brandNew eq true}">
						<f:selectItems
							value="#{supplierProposalDetailBackingBean.getDropdownValues(ParameterTypeConst.accountType)}" />
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.address']}">
					<h:outputText value="#{cashonhand.bankAddress}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputTextarea value="#{cashonhand.bankAddress}" cols="20"
						rows="2" rendered="#{cashonhand.brandNew eq true}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.amount']}">
					<h:outputText value="#{cashonhand.cashAmount}"
						rendered="#{cashonhand.brandNew eq false}" />
					<p:inputText value="#{cashonhand.cashAmount}" size="20"
						rendered="#{cashonhand.brandNew eq true}">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalCashOnHandSum}"
							update=":form:totalcashonhand" />
					</p:inputText>
				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.addbtn']}"
					process="@this,cashonhandid" partialSubmit="true"
					action="#{supplierProposalDetailBackingBean.addCashOnHand}"
					update="cashonhandid" icon="ui-icon-add" />

				<p:commandButton value="#{lbl['lbl.so.delete']}"
					icon="ui-icon-delete" update="cashonhandid"
					action="#{supplierProposalDetailBackingBean.deleteCashOnHand}" />

			</div>

			<table style="width: 100%">
				<tr>
					<td style="width: 155px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.ttl.cash.on.hand']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							id="totalcashonhand"
							value="#{supplierProposalDetailBackingBean.managedBean.totalcashHand}"
							readonly="true" disabled="true" size="30">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
