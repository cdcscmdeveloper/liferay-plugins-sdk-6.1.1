<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:tabView var="zones" orientation="left"
		value="#{supplierProposalDetailBackingBean.managedBean.zones}"
		activeIndex="#{supplierProposalDetailBackingBean.managedBean.activeIndex}">

		<p:ajax event="tabChange"
			listener="#{supplierProposalDetailBackingBean.zoneTabChange}"
			immediate="true" />
		<p:tab title="#{zones.zoneName}">
			<ac:templateSpec
				templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}" />
		</p:tab>

	</p:tabView>
</ui:composition>
