<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



		<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true" >
			<p:dataTable id="supplierCategory"  value="smAppl.smSupplierCategories"
				var="supplierCategory" >
				<ac:paginator for="supplierCategory"></ac:paginator>
				
				<p:column headerText="#{lbl['lbl.sc.spec.category.code']}">
					<p:outputLabel value="#{supplierCategory.pmCategoryL1.categoryL1Code}"></p:outputLabel>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.main.category']}">
					<p:outputLabel value="#{supplierCategory.pmCategoryL1.categoryName}"></p:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}">
					<p:outputLabel value="#{supplierCategory.pmCategoryL2.categoryName}"></p:outputLabel>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}">
					<p:outputLabel value="#{supplierCategory.pmCategoryL3.categoryName}"></p:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.category.type']}">
					<p:outputLabel value="#{(supplierCategory.specialCategory) ? 'Special' : 'Normal'}"></p:outputLabel>
				</p:column>
			</p:dataTable>

		</p:panel>


	

	

</ui:composition>
