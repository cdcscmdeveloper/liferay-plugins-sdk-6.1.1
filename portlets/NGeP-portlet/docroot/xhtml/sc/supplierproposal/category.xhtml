<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
		<p:dataTable id="supplierCategory" rowIndexVar="index"
			rowKey="#{supplierCategory}" value="#{smAppl.smSupplierCategories}"
			var="supplierCategory">
			<ac:paginator for="supplierCategory"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}">
				<h:outputText
					value="#{supplierCategory.pmCategoryL1.categoryL1Code}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}">
				<h:outputText value="#{supplierCategory.pmCategoryL1.categoryName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}">
				<h:outputText value="#{supplierCategory.pmCategoryL2.categoryName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}">
				<h:outputText value="#{supplierCategory.pmCategoryL3.categoryName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}">
				<h:outputText
					value="#{(supplierCategory.specialCategory) ? 'Special' : 'Normal'}"></h:outputText>
			</p:column>
		</p:dataTable>

	</p:panel>

</ui:composition>
