<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="techCLMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				icon="ui-icon-back" process="@this" partialSubmit="true"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />

		</div>

		<ui:include src="checklistHeader.xhtml" />
		
		<p:panel header="" toggleable="true">
			<table>
				<tr>
					<td style="width: 170px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.max']}" /></td>
					<td><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.qt.maxProposal}"
							readonly="true" disabled="true" size="30" /></td>
					<td style="width: 200px"><p:outputLabel
							value="#{lbl['lbl.sc.sp.prepare.proposal']}" /></td>
					<td><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.prepareProposal}"
							size="30">
							<p:ajax event="blur" process="@this"
								listener="#{supplierProposalDetailBackingBean.displayProposalDtls}"
								update=":form:proposaldtls" />
						</p:inputText></td>
				</tr>
			</table>

			<h:panelGroup id="proposaldtls">
				<p:dataTable id="proposalid" var="proposalList"
					value="#{supplierProposalDetailBackingBean.managedBean.qtProposalsList}"
					rowKey="#{proposalList}" rowIndexVar="rowIndex">

					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="#{lbl['lbl.sc.sp.proposal.no']}">
						<h:outputText value="#{rowIndex+1}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.sp.action']}">
						<p:commandButton
							action="#{supplierProposalDetailBackingBean.prepareMultileProposalAction}"
							value="Prepare" />
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.so.delete']}"
						icon="ui-icon-delete" update="proposalid" />

				</div>
			</h:panelGroup>

		</p:panel>
	</ui:define>
</ui:composition>
