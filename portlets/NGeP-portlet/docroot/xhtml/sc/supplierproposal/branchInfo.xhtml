<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	
	<p:panel header="#{lbl['lbl.sc.spec.company.branches']}" toggleable="true" >
			<p:dataTable id="companyBranch" rowIndexVar="index" var="companyBranch" value="#{smAppl.smSupplierBranches}"
				rowKey="#{companyBranch}">
				<ac:paginator for="companyBranch"></ac:paginator>
				
				<p:column headerText="#{lbl['lbl.sc.spec.branch.name']}">
					<p:outputLabel style="float : left;" value="#{companyBranch.branchName}"></p:outputLabel>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.supplier.address']}">
					<p:outputLabel style="float : left;" value="#{supplierProposalDetailBackingBean.getFullAddress(companyBranch.smAddress)}"></p:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contact.person']}">
					<p:outputLabel style="float : left;" value="#{companyBranch.smPersonnel.name}"></p:outputLabel>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.phn.no']}">
					<p:outputLabel  value="#{companyBranch.phoneNo}"></p:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.fax.no']}">
					<p:outputLabel  value="#{companyBranch.faxNo}"></p:outputLabel>
				</p:column>

			</p:dataTable>

		</p:panel>

</ui:composition>
