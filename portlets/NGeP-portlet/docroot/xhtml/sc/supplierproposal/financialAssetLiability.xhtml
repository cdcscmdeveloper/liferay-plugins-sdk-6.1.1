<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.sp.assest.liabilities']}"
		toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sp.current.asset']}" /></td>
				<td><p:inputText style="text-align:right"
						disabled="#{statusHide}"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentAssets}"
						size="30">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio])" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.sp.current.liability']}" /></td>
				<td><p:inputText style="text-align:right"
						disabled="#{statusHide}"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentLiabilities}"
						size="30">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio])" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sp.acid.ratio']}" /></td>
				<td><p:inputText style="text-align:right" id="totalacidratio"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.acidRatio}"
						size="30" readonly="true" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <h:outputText
						value="#{lbl['lbl.sc.eva.s1.user.score']}"
						rendered="#{checklistScoreType eq '2'}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						value="#{noOfContracts.userScore}" maxlength="18"
						style="text-align:right" rendered="#{ checklistScoreType eq '2'}"></p:inputText></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
