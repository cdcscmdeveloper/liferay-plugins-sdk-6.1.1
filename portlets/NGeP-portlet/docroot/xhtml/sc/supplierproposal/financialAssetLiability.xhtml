<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="assetsAndLiabilitiesPanel"
		header="#{lbl['lbl.sc.assest.liabilities']}" toggleable="true">
		
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.sp.btn.complete.instruction']}" escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}" />
			
		<table>
			<tr>
				<td><LABEL><ui:fragment rendered="#{!statusHide}">
							<span class="mandatory">* </span>
						</ui:fragment>#{lbl['lbl.sc.current.asset']}</LABEL></td>
				<td colspan="3"><p:inputText id="currentAsset"
						style="text-align:right" required="true"
						label="#{lbl['lbl.sc.current.asset']}" disabled="#{statusHide}"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentAssets}"
						size="30">
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio])" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment> <h:outputLabel value="#{lbl['lbl.sc.current.liability']}" /></td>
				<td colspan="3"><p:inputText id="currentLiabilities"
						style="text-align:right" required="true" disabled="#{statusHide}"
						label="#{lbl['lbl.sc.current.liability']}"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.currentLiabilities}"
						size="30">
						<f:validateLongRange minimum="1" maximum="99999999999" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur" process="@this"
							listener="#{supplierProposalDetailBackingBean.totalAcidRatio}"
							update="@this, @([id$=totalacidratio])" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.acid.ratio']}" /></td>
				<td style="width: 350px;"><p:inputText style="text-align:right"
						id="totalacidratio"
						value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPAssetLiability.acidRatio}"
						size="30" readonly="true" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td style="width: 70px;"><h:outputText
						value="#{lbl['lbl.sc.auto.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<h:outputText value="* " styleClass="mandatory" />


					</ui:fragment> <h:outputText value="#{lbl['lbl.sc.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						id="financialAssetsAndLiabilityUserScoreId"
						label="#{lbl['lbl.sc.user.score']}"
						value="#{noOfContracts.userScore}" maxlength="18" required="true"
						disabled="#{pageDisable}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="financialAssetsAndLiabilityUserScoreMessage"
						for="financialAssetsAndLiabilityUserScoreId" display="icon">
					</p:message></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
