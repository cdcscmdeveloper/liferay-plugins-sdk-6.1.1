<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.sp.header.tech.proposal']}"
		toggleable="true">
		<p:dataTable id="techDeailsId" var="techList"
			value="#{sPDetailBackingBean.managedBean.tecCheckDetailsList}"
			selection="#{sPDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{techList}" rowIndexVar="rowIndex">

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.sp.desc']}" style="width:68%">
				<h:outputText value="#{techList.scQtCheckList.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.instruction']}"
				style="width:15%">
			</p:column>

			<p:column headerText="Doc Definition Key" style="width:10%">
				<h:outputText
					value="#{techList.scQtCheckList.scQtDoc.document.docDefinitionKey}" />
			</p:column>

			<p:column headerText="Doc Definition Type" style="width:10%">
				<h:outputText
					value="#{techList.scQtCheckList.definationType.parameterCode}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.action']}" style="width:10%">
				<!-- <ui:fragment
					rendered="#{techList.scQtCheckList.scQtDoc.document.docDefinitionKey == 'TN'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareNonFederalGovtAction(techList)}"
						value="Prepare" />
				</ui:fragment>
				<ui:fragment
					rendered="#{techList.scQtCheckList.scQtDoc.document.docDefinitionKey == 'TG'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareFederalGovtAction(techList)}"
						value="Prepare" />
				</ui:fragment> -->

				<ui:fragment
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'TS' or techList.scQtCheckList.definationType.parameterCode eq 'WF'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareTechnicalAction(techList)}"
						value="Prepare" />
				</ui:fragment>

				<ui:fragment
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'SP' or techList.scQtCheckList.definationType.parameterCode eq 'SD'}">
					<p:commandButton
						action="#{sPDetailBackingBean.prepareTechnicalViewAction(techList)}"
						value="View" icon="ui-icon-agree" />
				</ui:fragment>

				<ui:fragment
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'UP'}">
					<p:commandButton value="Attachment" icon="iconAttachment" />
				</ui:fragment>

			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
