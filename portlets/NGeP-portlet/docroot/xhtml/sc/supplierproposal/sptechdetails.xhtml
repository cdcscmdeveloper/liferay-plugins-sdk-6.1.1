<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.technical.proposal']}"
		toggleable="true">
		<p:dataTable id="techDeailsId" var="techList"
			value="#{supplierProposalDetailBackingBean.managedBean.tecCheckDetailsList}"
			selection="#{supplierProposalDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{techList}" rowIndexVar="rowIndex"
			rows="10"
			first="#{supplierProposalDetailBackingBean.managedBean.technicalTableRow}">

			<ac:paginator for="techDeailsId" />

			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="" />

					<p:column headerText="#{lbl['lbl.sc.descriptions']}"
						style="width:68%; white-space: normal;" />

					<p:column headerText="#{lbl['lbl.sc.instruction']}"
						style="width:20%" />

					<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%" />

				</p:row>
			</p:columnGroup>

			<p:column style="width:2%">
				<p:selectBooleanCheckbox id="selAllChk"
					value="#{techList.submitted}" disabled="true" 
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'TS' 
						or (techList.scQtCheckList.definationType.parameterCode eq 'WF' and techList.scQtCheckList.pmDocument.docDefinitionKey ne 'NE')
						or (techList.scQtCheckList.definationType.parameterCode eq 'WF' and techList.scQtCheckList.pmDocument.docDefinitionKey eq 'NE' and !techList.scQtCheckList.scQtCheckListValue.allEmployee)
						or techList.scQtCheckList.definationType.parameterCode eq 'UP'}" />
			</p:column>

			<p:column>
				<h:outputText value="#{techList.scQtCheckList.title}" />
			</p:column>

			<p:column />

			<p:column>
				<ui:fragment
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'TS' 
						or (techList.scQtCheckList.definationType.parameterCode eq 'WF' and techList.scQtCheckList.pmDocument.docDefinitionKey ne 'NE')
						or (techList.scQtCheckList.definationType.parameterCode eq 'WF' and techList.scQtCheckList.pmDocument.docDefinitionKey eq 'NE' and !techList.scQtCheckList.scQtCheckListValue.allEmployee)}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareTechnicalAction(techList)}"
						value="Prepare" />
				</ui:fragment>

				<ui:fragment
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'SP' or techList.scQtCheckList.definationType.parameterCode eq 'SD' or
						(techList.scQtCheckList.definationType.parameterCode eq 'WF' and techList.scQtCheckList.pmDocument.docDefinitionKey eq 'NE' and techList.scQtCheckList.scQtCheckListValue.allEmployee)}">
					<p:commandButton
						action="#{supplierProposalDetailBackingBean.prepareTechnicalViewAction(techList)}"
						value="View" icon="ui-icon-agree" />
				</ui:fragment>

				<ui:fragment
					rendered="#{techList.scQtCheckList.definationType.parameterCode eq 'UP'}">
					<p:commandButton oncomplete="attachmentDlg.show();return false;"
						value="Attachment" icon="iconAttachment">
						<f:setPropertyActionListener value="#{techList}"
							target="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist}" />
					</p:commandButton>
					<h:commandLink 
						value="#{techList.scQtProposalChecklistAttachment.fileName}" 
						styleClass="blue_font" 
						immediate="true" 
						action="#{supplierProposalDetailBackingBean.downloadFile(techList.scQtProposalChecklistAttachment)}"
						rendered="#{!empty techList.scQtProposalChecklistAttachment}"/>

				</ui:fragment>

			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
