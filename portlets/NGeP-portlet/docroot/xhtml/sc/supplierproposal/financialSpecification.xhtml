<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<c:if test="#{supplierProposalDetailBackingBean.managedBean.qt.zonal}">
			<ui:include src="financialSpecificationDtlbyzone.xhtml" />
		</c:if>
		<c:if
			test="#{!supplierProposalDetailBackingBean.managedBean.qt.zonal}">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				icon="ui-icon-back" process="@this" partialSubmit="true"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />
			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				style="float:right;"
				action="#{supplierProposalDetailBackingBean.saveFinancialSpecificationAction(false)}"
				process="@all" partialSubmit="true" update="@all" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				style="float:right;"
				action="#{supplierProposalDetailBackingBean.saveFinancialSpecificationAction(true)}"
				process="@all" partialSubmit="true" update="@all"
				icon="ui-icon-check" />
			<p:spacer height="75"></p:spacer>
			<ac:templateSpec
				templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}" />
		</c:if>

	</ui:define>

</ui:composition>
