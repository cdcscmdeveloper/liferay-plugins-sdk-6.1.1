<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="techCLMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				icon="ui-icon-back" 
				process="@all" partialSubmit="true" update="@all"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveFinancialSpecificationAction}"
				process="@all" partialSubmit="true" update="@all" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}" 
				action="#{supplierProposalDetailBackingBean.completeFinancialSpecificationAction}"
				process="@all" partialSubmit="true" update="@all"
				icon="ui-icon-check" />
		</div>

		<ui:include src="checklistHeader.xhtml" />
		
		<c:if test="#{supplierProposalDetailBackingBean.managedBean.qt.zonal}">
			<ui:include src="financialSpecificationDtlbyzone.xhtml" />
		</c:if>
		<c:if test="#{!supplierProposalDetailBackingBean.managedBean.qt.zonal}">
			<ac:templateSpec
				templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}" />
		</c:if>
		
	</ui:define>

</ui:composition>
