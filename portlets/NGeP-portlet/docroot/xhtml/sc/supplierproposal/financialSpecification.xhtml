<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				icon="ui-icon-back" process="@this" partialSubmit="true"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveFinancialSpecificationAction}"
				process="@this" partialSubmit="true" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check" />
		</div>

		<p:panel>

			<table>
				<tr>
					<ui:fragment
						rendered="#{supplierProposalDetailBackingBean.managedBean.qt.maxProposal gt '1'}">
						<td><h:outputLabel value="#{lbl['lbl.sc.sp.pplno']}" /></td>
						<td><p:inputText
								value="#{supplierProposalDetailBackingBean.managedBean.proposalIndex}"
								disabled="true" size="30" /></td>
					</ui:fragment>
					<td style="width: 90px;"><h:outputLabel
							value="#{lbl['lbl.sc.sp.title']}" /></td>
					<td><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.scQtCheckList.title}"
							disabled="true" size="150" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel id="financespecificationid">
			<ac:templateSpec
				templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}" />
		</p:panel>
	</ui:define>

</ui:composition>
