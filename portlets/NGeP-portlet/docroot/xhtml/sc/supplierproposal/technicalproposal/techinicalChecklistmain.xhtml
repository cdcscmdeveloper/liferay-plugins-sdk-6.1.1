<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">
		<p:messages id="techCLMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				process="@this" partialSubmit="true"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}" />

			<ui:include src="technicalchecklistbuttons.xhtml"></ui:include>
		</div>
		<!-- 32112 START - added <div> and <br> -->
		<br></br>
		<div class="title">
		<p:spacer height="4"></p:spacer>
		<ui:param name="scQtCheckList"
					value="#{supplierProposalDetailBackingBean.managedBean.technicalQtChecklist}"></ui:param>
		<ui:remove> #28777#29729, 35592 - Start </ui:remove>	
		<c:if test="#{supplierProposalDetailBackingBean.managedBean.supplierBranchDeleted}">
			<div class="ui-messages ui-widget">
				<div class="ui-messages-warn ui-corner-all">
					<span class="ui-messages-warn-icon"></span>
					<ul>
						<li><span class="ui-messages-warn-detail">#{lbl['lbl.sc.branch.deactivated']}</span></li>
					</ul>
				</div>
			</div>
		</c:if>
		<ui:remove> #28777#29729, 35592 - End </ui:remove>	
		<ui:include src="/xhtml/sc/supplierproposal/proposalcommon/checklistHeader.xhtml" />
		<p:spacer height="4"></p:spacer>
		</div>
		<!-- 32112 END -->
		<ui:include
			src="#{supplierProposalDetailBackingBean.managedBean.pageUrl}" />

	</ui:define>
</ui:composition>
