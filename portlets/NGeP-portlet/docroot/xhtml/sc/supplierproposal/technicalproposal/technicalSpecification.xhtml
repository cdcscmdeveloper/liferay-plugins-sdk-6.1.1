<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<!-- #21695 farid START -->
<!-- #32125 fix bug related to #21695 START-->
	<h:panelGroup rendered="#{supplierProposalDetailBackingBean.managedBean.qt.zonal and supplierProposalDetailBackingBean.managedBean.qt.partial ne null and supplierProposalDetailBackingBean.managedBean.qt.partial 
	or !supplierProposalDetailBackingBean.managedBean.qt.zonal and supplierProposalDetailBackingBean.managedBean.qt.partial ne null and supplierProposalDetailBackingBean.managedBean.qt.partial}">
	<table>
		<tr>
			<td>
				<h:outputText value="#{lbl['lbl.sc.zone']}" style="width:50px;"
				rendered="#{supplierProposalDetailBackingBean.managedBean.qt.zonal and supplierProposalDetailBackingBean.managedBean.qt.partial ne null and supplierProposalDetailBackingBean.managedBean.qt.partial 
				or !supplierProposalDetailBackingBean.managedBean.qt.zonal and supplierProposalDetailBackingBean.managedBean.qt.partial ne null and supplierProposalDetailBackingBean.managedBean.qt.partial
				or !supplierProposalDetailBackingBean.managedBean.qt.partial}"/>
			</td>
			<td>
				<h:outputText value=":"/>
			</td>
			<td>	
				<h:outputText style="width:50px;" rendered="#{supplierProposalDetailBackingBean.managedBean.qt.zonal}" value="#{lbl['lbl.txt.yes']}"/>
				<h:outputText style="width:50px;" rendered="#{!supplierProposalDetailBackingBean.managedBean.qt.zonal}" value="#{lbl['lbl.txt.no']}"/>
			</td>
		</tr>
	</table>
		<h:panelGrid width="100%" rendered="#{supplierProposalDetailBackingBean.managedBean.qt.zonal}">
			<p:dataTable id="zoneLocationDataTable" rows="10"
				value="#{supplierProposalDetailBackingBean.managedBean.zoneGeneralTrees}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="zoneTree" style="width:100%" rowIndexVar="index">
				<p:column headerText="#{lbl['lbl.sc.location']}">
					<p:tree value="#{zoneTree}" var="location">
						<p:treeNode type="zone">
						    <h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
					</p:tree>
				</p:column>
			</p:dataTable>
		</h:panelGrid>

</h:panelGroup>
<!-- #32125 fix bug related to #21695 END-->
<!-- #21695 farid END -->

	<h:panelGroup id="techspecificationid">	

	 <br/>
	 <ui:include src="/xhtml/sc/common/specGuideLineInstructions.xhtml"></ui:include>
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.sp.btn.complete.instruction']}" escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}" /><br/>
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.sp.prop.instruction']}" escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.readOnly}" />	
		<ac:templateSpec
			templateSpecBean="#{supplierProposalDetailBackingBean.managedBean.templateSpecBean}" editable="#{!supplierProposalDetailBackingBean.managedBean.readOnly}"/>
	</h:panelGroup>
	<br />
	<br />
	<p:spacer height="30" />

	
</ui:composition>
