<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="nonFedExpPanel"
		header="#{lbl['lbl.sc.spec.company.exp.fed.private']}"
		toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sp.btn.complete.instruction']}" escape="false"
			rendered="#{!supplierProposalDetailBackingBean.managedBean.closed}" />

		<table>
			<tr>
				<td><p:outputLabel style="font-weight: bold;"
						value="#{supplierProposalDetailBackingBean.managedBean.year}" />
					<p:outputLabel
						value="#{lbl['lbl.sc.spec.company.exp.since.year']} " /></td>
			</tr>
		</table>
		<p:dataTable id="technongovtid" var="technongovt"
			value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPExperiences}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{technongovt}" rowIndexVar="rowIndex" rows="10">
			<ac:paginator for="technongovtid" />
			<p:column style="width:2% ;" rendered="#{!statusHide}">

				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{supplierProposalDetailBackingBean.managedBean.selectedAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=nonFedExpPanel])"
							listener="#{supplierProposalDetailBackingBean.selectAll(supplierProposalDetailBackingBean.managedBean.selectedAll,supplierProposalDetailBackingBean.managedBean.scQtPRPExperiences)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					value="#{technongovt.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=nonFedExpPanel])"/>
				</p:selectBooleanCheckbox>

			</p:column>
			<p:column id="clientNameColId"
				style="white-space : normal; width : 20%; ">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.customer.name']}" />
				</f:facet>
				<h:outputText value="#{technongovt.clientName}"
					rendered="#{technongovt.brandNew eq false}" />
				<p:inputTextarea id="clientName" value="#{technongovt.clientName}"
					style="width : 90%;" rows="3" cols="17" maxlength="50"
					onkeyup="limitTextArea(this,50);" onkeydown="limitTextArea(this,50);"
					required="true" label="#{lbl['lbl.sc.spec.customer.name']}"
					rendered="#{technongovt.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,clientNameMsg" />
				</p:inputTextarea>
				<p:message id="clientNameMsg" for="clientName" display="icon" />
			</p:column>

			<p:column style="white-space : normal; width : 20%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.contract.title']}" />
				</f:facet>
				<h:outputText value="#{technongovt.contractTitle}"
					rendered="#{technongovt.brandNew eq false}" />
				<p:inputTextarea id="contractTitle"
					value="#{technongovt.contractTitle}" rows="3" cols="22"
					style="width : 90%;" maxlength="1000" required="true"
					onkeyup="limitTextArea(this,1000);" onkeydown="limitTextArea(this,1000);"
					label="#{lbl['lbl.sc.spec.contract.title']}"
					rendered="#{technongovt.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,contractTitleMsg" />
				</p:inputTextarea>
				<p:message id="contractTitleMsg" for="contractTitle" display="icon" />
			</p:column>

			<p:column style="width : 10%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.spec.loa.no']}" />
				</f:facet>
				<h:outputText value="#{technongovt.contractNo}"
					rendered="#{technongovt.brandNew eq false}" />
				<p:inputText id="contractNo" value="#{technongovt.contractNo}"
					style="width : 90%;" size="17" maxlength="30" required="true"
					label="#{lbl['lbl.sc.spec.loa.no']}"
					rendered="#{technongovt.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true"
						update="@this,contractNoMsg" />
				</p:inputText>
				<p:message id="contractNoMsg" for="contractNo" display="icon" />
			</p:column>

			<p:column style="width : 10%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.effective.date']}" />
				</f:facet>
				<h:outputText value="#{technongovt.effectiveDate}"
					rendered="#{technongovt.brandNew eq false}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
				<p:calendar id="effectiveDate" value="#{technongovt.effectiveDate}"
					readonlyInput="true" showOn="button" navigator="true" size="7"
					style="width : 76%;"
					mindate="#{supplierProposalDetailBackingBean.managedBean.nonFedEffMinDate}"
					maxdate="#{supplierProposalDetailBackingBean.managedBean.nonFedEffMaxDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" required="true"
					label="#{lbl['lbl.sc.effective.date']}"
					rendered="#{technongovt.brandNew eq true}">
					<p:ajax event="dateSelect" process="@this" partialSubmit="true"
						update="@this,effectiveDateMsg,@([id$=expDatePanelGroupID])"
						listener="#{supplierProposalDetailBackingBean.effectiveDateSelectListener(technongovt)}" />
				</p:calendar>
				<p:message id="effectiveDateMsg" for="effectiveDate" display="icon"
					showSummary="true" showDetail="false" />
			</p:column>
			<p:column style="width : 10%;">
				<f:facet name="header">
					<ui:fragment rendered="#{!statusHide}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.exp.date']}" />
				</f:facet>
				<h:panelGroup id="expDatePanelGroupID">
					<h:outputText value="#{technongovt.expiryDate}"
						rendered="#{technongovt.brandNew eq false}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
					<p:calendar id="expiryDate" value="#{technongovt.expiryDate}"
						readonlyInput="true" showOn="button" navigator="true" size="7"
						style="width : 76%;"
						mindate="#{supplierProposalDetailBackingBean.managedBean.nonFedMinDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" required="true"
						label="#{lbl['lbl.sc.exp.date']}"
						rendered="#{technongovt.brandNew eq true}">
						<p:ajax event="dateSelect"
							listener="#{supplierProposalDetailBackingBean.expiryDateSelectListener(technongovt)}"
							update="@this,expiryDateMsg,@([id$=totalcontractyrs],[id$=contractPeriodPanelGropID])"
							process="@this" partialSubmit="true" />
					</p:calendar>
					<p:message id="expiryDateMsg" for="expiryDate" display="icon"
						showSummary="true" showDetail="false" />
				</h:panelGroup>
			</p:column>
			<p:column style="width : 10%;"
				headerText="#{lbl['lbl.sc.spec.contarct.period']}">

				<h:panelGroup id="contractPeriodPanelGropID">
					<h:outputText style="float:right"
						value="#{technongovt.contractPeriod}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</h:panelGroup>

			</p:column>

			<p:column style="width : 18%;white-space : normal;"
				headerText="#{lbl['lbl.sc.remarks']}">
				<h:outputText value="#{technongovt.remark}"
					rendered="#{technongovt.brandNew eq false}" />
				<p:inputTextarea value="#{technongovt.remark}" rows="3" cols="17"
					style="width : 96%;" maxlength="300"
					onkeyup="limitTextArea(this,300);" onkeydown="limitTextArea(this,300);"
					rendered="#{technongovt.brandNew eq true}">
					<p:ajax process="@this" partialSubmit="true" update="@this" />
				</p:inputTextarea>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" partialSubmit="true"
				process="@all" styleClass="BtnSpacing"
				rendered="#{!statusHide and !supplierProposalDetailBackingBean.managedBean.closed}"
				action="#{supplierProposalDetailBackingBean.addNonFederalGovtExperience}"
				update="@([id$=technongovtid])" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				partialSubmit="true" process="@this" styleClass="BtnSpacing"
				disabled="#{supplierProposalDetailBackingBean.deleteselectedList(supplierProposalDetailBackingBean.managedBean.scQtPRPExperiences)}"
				rendered="#{!statusHide and !supplierProposalDetailBackingBean.managedBean.closed}"
				oncomplete="techNonFedDelete.show();"
				update="@([id$=nonFedExpPanel])" >
				<f:setPropertyActionListener target="#{supplierProposalDetailBackingBean.managedBean.selectedAll}" value="#{false}"></f:setPropertyActionListener>
				
				</p:commandButton>

			<ui:param name="techNonFedDeleteId" value="techNonFedDeleteId"></ui:param>

			<ac:confirmationPopup id="#{techNonFedDeleteId}"
				widget="techNonFedDelete" width="400" height="200"
				okAction="supplierProposalDetailBackingBean.deleteNonFederalGovtExperience"
				title="#{lbl['lbl.sc.spec.company.exp.fed.private']}"
				content="#{lbl['lbl.sc.dialog.confirm.message']}"
				update="@([id$=nonFedExpPanel])" />

		</div>

		<p:spacer height="10"></p:spacer>
		<h:panelGroup id="totalcontractyrs">
			<table style="width: 100%">
				<tr>
					<td style="width: 150px"><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.no.contracts']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.totalContracts}"
							readonly="true" disabled="true" size="10">
						</p:inputText></td>
					<td style="width: 120px;"><p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.system.score']}"
							rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.user.score']}"
							rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
							rendered="#{checklistScoreType eq '2' and !pageDisable}">
							<p:outputLabel value="* " styleClass="mandatory" />


						</ui:fragment></td>
					<td><p:inputText readonly="true" disabled="true"
							value="#{noOfContracts.autoScore}" style="text-align:right"
							rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
							id="technicalNonGovernmentContractsUserScoreId"
							label="#{lbl['lbl.tpl.spec.content.user.score']}"
							value="#{noOfContracts.userScore}" required="true" maxlength="18"
							disabled="#{pageDisable or technicalorFinancialReEvaluateRequired}" style="text-align:right"
							rendered="#{checklistScoreType eq '2'}">
							<ac:validateNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
								maxIntegerDigits="14" integerOnly="true" />
							<f:attribute name="min" value="0" />
							<f:attribute name="max" value="#{contractUserScore}" />
						</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
							value="/#{contractUserScore}"
							rendered="#{ checklistScoreType eq '2'}" /> <p:message
							id="technicalNonGovernmentContractsUserScoreMessage"
							for="technicalNonGovernmentContractsUserScoreId" display="icon"></p:message>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.spec.total.no.years']}" /></td>
					<td colspan="3"><p:inputText style="text-align:right"
							value="#{supplierProposalDetailBackingBean.managedBean.totalYears/12}"
							readonly="true" disabled="true" size="10">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:inputText></td>
					<td style="width: 120px;"><p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.system.score']}"
							rendered="#{companyScoreType eq '1'}" /> <p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.user.score']}"
							rendered="#{companyScoreType eq '2'}" /> <ui:fragment
							rendered="#{companyScoreType eq '2' and !pageDisable}">
							<p:outputLabel value="* " styleClass="mandatory" />


						</ui:fragment></td>
					<td><p:inputText readonly="true" disabled="true"
							value="#{noOfYears.autoScore}" style="text-align:right"
							rendered="#{companyScoreType eq '1'}"></p:inputText> <p:inputText
							id="technicalNonGovernmentNoofYearsUserScoreId" maxlength="18"
							style="text-align:right" required="true"
							label="#{lbl['lbl.tpl.spec.content.user.score']}"
							value="#{noOfYears.userScore}" disabled="#{pageDisable or technicalorFinancialReEvaluateRequired}"
							rendered="#{companyScoreType eq '2'}">
							<ac:validateNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
								maxIntegerDigits="14" integerOnly="true" />
							<f:attribute name="min" value="0" />
							<f:attribute name="max" value="#{yearsUserScore}" />
						</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
							value="/#{yearsUserScore} " rendered="#{companyScoreType eq '2'}" />
						<p:message id="technicalNonGovernmentNoofYearsUserScoreMessage"
							for="technicalNonGovernmentNoofYearsUserScoreId" display="icon"></p:message>
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
</ui:composition>
