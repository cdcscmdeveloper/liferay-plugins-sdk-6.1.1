<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.spec.tech.staff.list']}"
		toggleable="true">

		<p:dataTable id="techEmployeeList" var="techEmployee"
			value="#{supplierProposalDetailBackingBean.managedBean.smPersonnelList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="index">
			<ac:paginator for="techEmployeeList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.name']}">
					#{techEmployee.smPersonnel.name}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					#{techEmployee.smPersonnel.identificationNo}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.designation']}">
					#{techEmployee.smPersonnel.designation}
				</p:column>

			<p:column headerText="#{lbl['lbl.sc.qualification']}">
				<ui:repeat var="smStaffAcademic"
					value="#{techEmployee.smStaffAcademics}">
						#{smStaffAcademic.codeName}
						<br />
				</ui:repeat>
			</p:column>
			<!-- value="#{supplierProposalDetailBackingBean.getParameterDesc('QL',techEmployee.getSmStaffAcademics().get(0).getQualificationLevelId)}" -->
			<p:column headerText="#{lbl['lbl.sc.spec.no.of.yrs.exp']}">
				<h:outputText style="float : right"
					value="#{techEmployee.smPersonnel.workExperienceYear}" />
			</p:column>
		</p:dataTable>

		<p:spacer height="5" />
		<table style="width: 100%">
			<tr>
				<td style="width: 180px"><p:outputLabel
						value="#{lbl['lbl.sc.spec.total.staff']}" /></td>
				<td colspan="3"><p:inputText style="text-align:right"
						value="#{supplierProposalDetailBackingBean.managedBean.totalNoOfYearsExperience}"
						readonly="true" disabled="true" size="30">
					</p:inputText></td>
				<td style="width: 120px;"><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.system.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /> <ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<p:outputLabel value="* " styleClass="mandatory" />


					</ui:fragment></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						id="technicalEmployeeListUserScoreId"
						label="#{lbl['lbl.tpl.spec.content.user.score']}"
						value="#{noOfContracts.userScore}" maxlength="18" required="true"
						disabled="#{pageDisable or technicalorFinancialReEvaluateRequired}"
						style="text-align:right" rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="technicalEmployeeListUserScoreMessage"
						for="technicalEmployeeListUserScoreId" display="icon">
					</p:message></td>
			</tr>
		</table>

	</p:panel>

</ui:composition>
