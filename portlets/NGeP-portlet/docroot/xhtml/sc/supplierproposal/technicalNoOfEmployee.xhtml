<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.sp.noofemployees']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td colspan="2"><p:selectOneRadio id="allEmployees"
						value="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee}"
						disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sp.employeesinvolve']}"
							itemValue="false" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sp.allemployees']}"
							itemValue="true" />
						<p:ajax event="change" process="@this,allEmployees"
							partialSubmit="true" update="@([id$=totalNoOfEmployeesInvolved])"></p:ajax>
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td width="8%"><h:outputText value="* " styleClass="mandatory"
						rendered="#{!supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee}" />
					<h:outputLabel value="#{lbl['lbl.sc.sp.ttlemployees']}" /></td>
				<td width="92%"><h:panelGroup id="totalNoOfEmployeesInvolved">
						<p:inputText id="totalEmployees" style="text-align:right"
							size="30" required="true" maxlength="6"
							label="#{lbl['lbl.sc.sp.ttlemployees']}"
							value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPEmployee.totalEmployees}"
							disabled="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee or statusHide}">
						</p:inputText>
						<p:message id="totalEmployeesMsg" for="totalEmployees"
							display="icon" />
					</h:panelGroup></td>
			</tr>
			<tr>
				<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
						rendered="#{checklistScoreType eq '1'}" /> <h:outputText
						value="#{lbl['lbl.sc.eva.s1.user.score']}"
						rendered="#{ checklistScoreType eq '2'}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{noOfContracts.autoScore}" style="text-align:right"
						rendered="#{ checklistScoreType eq '1'}"></p:inputText> <p:inputText
						value="#{noOfContracts.userScore}" maxlength="18"
						style="text-align:right" rendered="#{checklistScoreType eq '2'}"></p:inputText></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
