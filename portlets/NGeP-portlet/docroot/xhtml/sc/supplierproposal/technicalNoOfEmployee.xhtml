<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{supplierProposalDetailBackingBean.supplierProposalBackAction}"
				icon="ui-icon-back" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" icon="ui-icon-save"
				action="#{supplierProposalDetailBackingBean.saveTechEmployeesDtlAction}" />
			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				icon="ui-icon-check" />
		</div>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.sp.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"
							disabled="true" size="150" /></td>
				</tr>
			</table>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.sp.noofemployees']}" toggleable="true">
			<table>
				<tr>
					<td><p:selectOneRadio id="allEmployees"
							value="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee}">
							<f:selectItem itemLabel="#{lbl['lbl.sc.sp.employeesinvolve']}"
								itemValue="fasle" />
							<f:selectItem itemLabel="#{lbl['lbl.sc.sp.allemployees']}"
								itemValue="true" />
							<p:ajax event="change" process="@this,allEmployees"
								partialSubmit="true" update=":form:totalNoOfEmployeesInvolved"></p:ajax>
						</p:selectOneRadio></td>
				</tr>
			</table>

			<h:panelGrid id="totalNoOfEmployeesInvolved" columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.sp.ttlemployees']}" />
				<p:inputText style="text-align:right" size="30" disabled="true"
					rendered="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee eq 'true'}"
					value="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtPRPEmployee.totalEmployees}">
				</p:inputText>
				<p:inputText style="text-align:right" size="30"
					rendered="#{supplierProposalDetailBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.allEmployee eq 'false'}"
					value="#{supplierProposalDetailBackingBean.managedBean.scQtPRPEmployee.totalEmployees}">
				</p:inputText>
			</h:panelGrid>
		</p:panel>
	</ui:define>
</ui:composition>
