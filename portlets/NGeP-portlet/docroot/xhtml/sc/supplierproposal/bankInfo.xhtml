<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.bank.act.details']}"
		toggleable="true">
		<p:dataTable id="bankdetails" value="#{smAppl.smSupplierBanks}"
			rowIndexVar="index" var="bankDtls" rowKey="#{bankDtls}"
			selectionMode="single"
			selection="">

			<ac:paginator for="bankdetails" />

			<p:ajax event="rowSelect" update=":form:cheque"
				listener="#{qTBusinessOwnerBackingBean.onRowCloneAction}" />

			<p:column headerText="#{lbl['lbl.sc.spec.act.no']}">
				<h:outputText value="#{bankDtls.accountNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
				<h:outputText value="#{bankDtls.pmFinancialOrg.finOrgName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.supplier.address']}">
				<h:outputText value="#{bankDtls.smAddress.address1}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.spec.cheque.sign.composition']}"
		toggleable="true">
		<p:dataTable id="cheque"
			value="#{smAppl.smSupplierBanks.smChequeSignatories}"
			rowIndexVar="index" var="chequesignatories"
			rowKey="#{chequesignatories}">
			<ac:paginator for="cheque"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.spec.cheque.sign']}">
				<h:outputText />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.passport.no']}">
				<h:outputText
					value="#{chequesignatories.smPersonnel.identificationNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.bumi.status']}">
				<h:outputText />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.share.position']}">
				<h:outputText />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
