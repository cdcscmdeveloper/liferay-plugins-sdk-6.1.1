<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.bank.act.details']}"
		toggleable="true">
		<p:dataTable id="bankdetails" selectionMode="single"
			value="#{smAppl.smSupplierBanks}" rowIndexVar="index" var="bankDtls"
			rowKey="#{bankDtls}">
			<ac:paginator for="bankdetails" />
			<p:ajax event="rowSelect"
				listener="#{supplierProposalDetailBackingBean.onRowSelectionListener}"
				update="@([id$=cheque])" />

			<p:column headerText="#{lbl['lbl.sc.spec.act.no']}">
				<p:outputLabel value="#{bankDtls.accountNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
				<p:outputLabel value="#{bankDtls.pmFinancialOrg.finOrgName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.supplier.address']}">
				<p:outputLabel value="#{supplierProposalDetailBackingBean.getFullAddress(bankDtls.smAddress)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.spec.cheque.sign.composition']}"
		toggleable="true">
		<p:dataTable id="cheque"
			value="#{supplierProposalDetailBackingBean.managedBean.smChequeSignatories}"
			rowIndexVar="index" var="cheque"
			rowKey="#{chequesignatories}">
			<ac:paginator for="cheque"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.spec.cheque.sign']}">
				<p:outputLabel value="#{cheque.smPersonnel.name}"></p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.passport.no']}">
				<p:outputLabel value="#{cheque.smPersonnel.identificationNo}" ></p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.bumi.status']}">
				<p:outputLabel value="#{(cheque.smPersonnel.bumi) ? 'Yes' : 'No'}" ></p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.share.position']}">
				<p:outputLabel value="#{cheque.smPersonnel.designation}" ></p:outputLabel>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
