<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true" id="attRegPnl">
		<ac:lovPopup />
		<p:dataTable id="complisttbl" var="scQtBriefReg" style="width:100%"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{bsvAttendanceBackingBean.managedBean.briefingRegistrationList}"
			selection="#{bsvAttendanceBackingBean.managedBean.selectedbriefRegistration}"
			rowKey="#{scQtBriefReg}" selectionMode="single" rowIndexVar="index">
			<p:ajax event="rowSelect"
				listener="#{bsvAttendanceBackingBean.onRowSelect}"
				update="@([id$=attendanceDetailstbl],[id$=regDelteBtn],[id$=attendanceNavInfo])"
				process="@this" />

			<p:column headerText="#{lbl['lbl.sc.supplier.name']}"
				filterBy="#{scQtBriefReg.supplier.companyName}">

				<h:outputText value="#{scQtBriefReg.supplier.companyName}" />
			</p:column>

		</p:dataTable>

		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" width="90%"></td>
				<td class="TableFieldLeft"><ac:lov id="supplier"
						lovId="SM_SUPPLIER_MOFNO"
						postUpdateListener="bsvAttendanceBackingBean.bsvRegistationListner(bsvAttendanceBackingBean.managedBean.mofAccounts)"
						headerText="#{lbl['lbl.sc.supp.mof.no']}" buttonLabel="#{lbl['lbl.btn.add']}"
						selectionMode="multiple"
						saveObject="bsvAttendanceBackingBean.managedBean.mofAccounts"
						update="@form" /> <p:commandButton id="regDelteBtn"
						value="#{lbl['lbl.btn.delete']}"
						disabled="#{bsvAttendanceBackingBean.managedBean.maintanceFlow and !bsvAttendanceBackingBean.managedBean.selectedbriefRegistration.brandNew}"
						process="@this,complisttbl" partialSubmit="true"
						oncomplete="supplierListDeleteIdPopUp.show();"
						update="@([id$=#{supplierListDeleteId}])" /></td>
			</tr>
		</table>
		<ui:param name="supplierListDeleteId" value="supplierListDeleteId"></ui:param>

		<ac:confirmationPopup id="supplierListDeleteId"
			widget="supplierListDeleteIdPopUp" width="400" height="100"
			okAction="bsvAttendanceBackingBean.deleteSupplierDetails"
			title="#{lbl['lbl.sc.supplier.list']}"
			content="#{lbl['lbl.sc.dialog.confirm.supplier']}"
			update="@all" />


		<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0"
			width="100%">
			<p:column>
				<h:outputText id="attendanceNavInfo"
					value="#{bsvAttendanceBackingBean.slectedHeaderName}"
					styleClass="lblSubHeader" style="padding-left: 5px;">
				</h:outputText>

				<h:outputText value="#{lbl['lbl.sc.supplier.attendene.list']}"
					styleClass="lblSubHeader" style="padding-left: 5px;">
				</h:outputText>
			</p:column>
		</h:panelGrid>
		<p:spacer height="5px"></p:spacer>


	
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.supplier.attendene.list.instruction']}" escape="false" />
		
		<p:dataTable id="attendanceDetailstbl" var="scQtBriefAttendace"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{bsvAttendanceBackingBean.managedBean.selectedbriefRegistration.bsvAttendance}"
			rows="10" rowKey="#{scQtBriefAttendace}" rowIndexVar="rowIndex"
			selection="#{bsvAttendanceBackingBean.managedBean.scQtBriefingAttendance}"
			selectionMode="single" style="width:100%">

			<p:columnGroup type="header">
				<p:row>
					<p:column headerText="#{lbl['lbl.sc.name']}">

					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.bsv.attendance.authorizedperson']}">

					</p:column>

					<p:column
						headerText="#{lbl['lbl.sc.identification.no']}">

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.contact.no']}">

					</p:column>


					<p:column headerText="#{lbl['lbl.sc.email']}">

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.attendance']}">

					</p:column>
				</p:row>
			</p:columnGroup>
			<p:column style="width:22%;white-space: normal;">
				<h:outputText value="#{scQtBriefAttendace.name}"
					rendered="#{scQtBriefAttendace.authorized}" />
				<p:inputText value="#{scQtBriefAttendace.name}"
					rendered="#{!scQtBriefAttendace.authorized}">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						update="@this"></p:ajax>
				</p:inputText>
			</p:column>
			<p:column style="width:6%;white-space: normal;">
				<h:outputLabel
					value="#{scQtBriefAttendace.authorized ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />

			</p:column>
			<p:column style="width:22%;white-space: normal;">
				<h:outputText value="#{scQtBriefAttendace.icPassPort}"
					rendered="#{scQtBriefAttendace.authorized}" />
				<p:inputText value="#{scQtBriefAttendace.icPassPort}"
					rendered="#{!scQtBriefAttendace.authorized}">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						update="@this"></p:ajax>
				</p:inputText>

			</p:column>
			<p:column style="width:22%;white-space: normal;">
				<h:outputText value="#{scQtBriefAttendace.contactNo}"
					rendered="#{scQtBriefAttendace.authorized}" />
				<p:inputText value="#{scQtBriefAttendace.contactNo}"
					rendered="#{!scQtBriefAttendace.authorized}">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						update="@this"></p:ajax>
				</p:inputText>
			</p:column>
			<p:column style="width:22%;white-space: normal;">
				<h:outputText value="#{scQtBriefAttendace.email}"
					rendered="#{scQtBriefAttendace.authorized}" />
				<p:inputText value="#{scQtBriefAttendace.email}"
					rendered="#{!scQtBriefAttendace.authorized}">
					<p:ajax event="blur" process="@this" partialSubmit="true"
						update="@this"></p:ajax>
				</p:inputText>
			</p:column>
			<p:column style="width:6%;white-space: normal; text-align:center;">
				<p:selectBooleanCheckbox value="#{scQtBriefAttendace.attended}"
					disabled="#{(bsvAttendanceBackingBean.managedBean.maintanceFlow and !scQtBriefAttendace.brandNew ) or !scQtBriefAttendace.authorized}">
					<p:ajax event="change" process="@this" partialSubmit="true" update="@this" 
						 listener="#{bsvAttendanceBackingBean.updateBriefingAttendance(scQtBriefAttendace,bsvAttendanceBackingBean.managedBean.selectedbriefRegistration.bsvAttendance,scQtBriefAttendace.attended)}"></p:ajax>
				</p:selectBooleanCheckbox>
			</p:column>
		</p:dataTable>
			
	</p:panel>

</ui:composition>
