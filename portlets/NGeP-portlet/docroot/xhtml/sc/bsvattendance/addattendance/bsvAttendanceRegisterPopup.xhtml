
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">

		<p:messages id="bsvattanadance" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
			
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		
			<h:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="90%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.btn.back']}"
							action="#{bsvAttendanceBackingBean.backBtn}"
							style="float:left;" />
					</p:column>
					<p:column width="10%" style="text-align:right" >
					<p:commandButton value="#{lbl['lbl.btn.complete']}" process="@form" update="@form"
						action="#{bsvAttendanceBackingBean.saveBriefingRegAttendance('complete')}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						style="float:right;" />
						
					<p:commandButton value="#{lbl['lbl.btn.save']}" process="@form" update="@form"
						action="#{bsvAttendanceBackingBean.saveBriefingRegAttendance('save')}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						style="float:right;" />
				</p:column>
				</p:row>
				</h:panelGrid>
				
				<div align="left" class="header-info header-spacing">
					<table style="width: 100%">
						<tr>
							<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.sc.briefing']}:" /></td>
							<td style="width: 40%" class="header-info-text">
								#{bsvAttendanceBackingBean.managedBean.scQtBriefing.bsvDesc}</td>
							<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.sc.date.time']}:" /></td>
							<td style="width: 40%" class="header-info-text">
								<h:outputText value="#{bsvAttendanceBackingBean.managedBean.scQtBriefing.bsvDate}">
								<f:convertDateTime
									pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" /></h:outputText></td>

						</tr>
						<tr>
							<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.sc.bsv.qtn.no']}:" /></td>
							<td style="width: 40%" class="header-info-text">
							<h:outputText value="#{bsvAttendanceBackingBean.managedBean.scQt.qtNo}"/></td>
							<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.sc.title']}:" /></td>
							<td style="width: 40%" class="header-info-text">
							<h:outputText value="#{bsvAttendanceBackingBean.managedBean.scQt.qtTitle}"/></td>
						</tr>
					</table>
				</div>
		<div class="header-spacing">
			<h:outputLabel value="#{lbl['lbl.sc.bsv.registration.info']}" style="float:left;" />
			<br />
		</div>
		<ui:include src="/xhtml/sc/bsvattendance/addattendance/addRegistrationdetails.xhtml"></ui:include>
	</ui:define>

</ui:composition>
