

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		
		<ac:gpkiPopup textBeforeSign="#{qTScheduleDetailBackingBean.textBeforeSign}"
			postSignAction="#{qTScheduleDetailBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />

		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<ui:repeat var="bpmAction"
						value="#{qTScheduleDetailBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
							styleClass="ui-button" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{qTScheduleDetailBackingBean.updateBpmTask(bpmAction)}" />
					</ui:repeat>
				</p:column>
			</p:row>

		</p:panelGrid>

		<ui:include src="/xhtml/sc/quatationtender/Approver/requestPTJdetails.xhtml" />

		<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
			<p:dataTable id="publicrequestdtlid"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{qTScheduleDetailBackingBean.managedBean.scQtApprovalRequestList}"
				var="publicapproval" rowIndexVar="index" editable="true"
				rowKey="#{publicapproval}">
				<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
					<h:outputText
						value="#{qTScheduleDetailBackingBean.getParameterDesc(publicapproval.approvalType)}" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.brifing.sv.dtls']}" toggleable="true">
			<!-- <h:panelGroup rendered="#{!bsvDetails.briefingList.isEmpty()}">
				<h:outputText value="* #{lbl['lbl.sc.all.attendance.required.for.briefiing']}"
					rendered="#{qTScheduleDetailBackingBean.managedBean.qtBriefing.scQtBsv.allBriefingReq}"
					style="font-weight:bold;text-align: left;" />

				<h:outputText
					value="#{lbl['lbl.sc.qt.atleast']} #{qTScheduleDetailBackingBean.managedBean.qtBriefing.scQtBsv.minBriefingAttend} Attandence required for Briefing and SiteVisit"
					rendered="#{!qTScheduleDetailBackingBean.managedBean.qtBriefing.scQtBsv.allBriefingReq}"
					style="font-weight:bold;text-align: left;" />

			</h:panelGroup> -->

			<p:dataTable id="samebsvdtls" var="brfsitdtl"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{qTScheduleDetailBackingBean.managedBean.qtBriefing}"
				style="width:100%">

				<p:column headerText="#{lbl['lbl.sc.description']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{brfsitdtl.bsvDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.date.time']}"
					style="width:18%;white-space: normal;">
					<h:outputText value="#{brfsitdtl.bsvDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.location']}"
					style="width:20%;white-space: normal;">

					<h:outputText value="#{brfsitdtl.location}" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.coordinate.officer']}"
					style="width:18%;white-space: normal;">
					<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.max.attendence']}"
					style="width:5%;white-space: normal;">
					<h:outputLabel value="#{brfsitdtl.maxNoOfAttendance}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.status']}"
					style="width:9%;white-space: normal;">
					<h:outputText
						value="#{qTScheduleDetailBackingBean.getStatusDescById(brfsitdtl.bsvStatus.statusId)}" />
				</p:column>

			</p:dataTable>


		</p:panel>
		<p:panel header="#{lbl['lbl.sc.additionl.supp.list.brif.dtls']}"
			toggleable="true" id="attRegPnl">

			<p:dataTable id="complisttbl" var="scQtBriefReg" style="width:100%"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{qTScheduleDetailBackingBean.managedBean.briefingRegistrationList}">

				<p:column headerText="#{lbl['lbl.sc.supplier.name']}">

					<h:outputText value="#{scQtBriefReg.supplier.companyName}" />
				</p:column>



			</p:dataTable>
		</p:panel>
		
		<ac:scRemarkAndAttachment
			remarkList="#{qTScheduleDetailBackingBean.managedBean.scQtApproval.scQtApprovalRemarks}"
			showAttachment="false" />

	</ui:define>
</ui:composition>
