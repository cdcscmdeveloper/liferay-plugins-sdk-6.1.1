<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<div class="ppRightBtn">
			<h:panelGroup id="bsvattandanceBtns">


				<ui:repeat var="bpmAction"
					value="#{bsvAttendanceBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel"
						value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
					<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
						action="#{bsvAttendanceBackingBean.submitBsvDetails(bpmAction)}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				</ui:repeat>

			</h:panelGroup>
		</div>


		<div align="left" class="header-info">
			<table style="width: 100%">
				<tr>
					<td style="width: 15%"><h:outputLabel
							value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td class="header-info-text">
						#{bsvAttendanceBackingBean.managedBean.scQt.qtNo}</td>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.sc.ptj']}" /></td>
					<td class="header-info-text">
						#{bsvAttendanceBackingBean.managedBean.scQt.pmOrgProfile.orgCode}
						-
						#{bsvAttendanceBackingBean.managedBean.scQt.pmOrgProfile.orgName}
					</td>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>
					<td class="header-info-text">
						#{bsvAttendanceBackingBean.getStatusDescById(bsvAttendanceBackingBean.managedBean.scQt.qtStatus.statusId)}
					</td>
				</tr>
			</table>
		</div>
		<p:spacer height="10px" />
		<ui:include src="bsvattandencedtls.xhtml"></ui:include>
	</ui:define>
</ui:composition>
