<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
       <p:panel>
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.sc.notice.board.backbtn']}" icon="ui-icon-back"
							action="#{noticeBoardBackingBean.backBtn}" style="float:left;" />
					</p:column>
					<p:column width="100%" >
						<p:commandButton value="#{lbl['lbl.ss.save']}"  icon="ui-icon-save"
							action="#{noticeBoardBackingBean.backBtn}" style="float:left;" />
					
						<p:commandButton value="#{lbl['lbl.ss.submit']}" icon="ui-icon-submit"
							action="#{noticeBoardBackingBean.backBtn}" style="float:right;" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:panel>
		<ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" />
		<ui:include src="bsvattandencedtls.xhtml"></ui:include>
	</ui:define>
</ui:composition>
