<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">

		<p:panel>


			<h:panelGrid border="0" columns="1" cellpadding="0" cellspacing="0"
				width="100%">
				<p:column>
					<div style="float: right;">						
						<p:commandButton value="#{lbl['lbl.btn.submit']}"
							icon="ui-icon-submit" action="#{bsvAttendanceBackingBean.submitBsvDetails}" process="@this">
						</p:commandButton>
					</div>
				</p:column>
				<p:messages id="messages" showDetail="true" autoUpdate="true"
					closable="true" severity="error, info" />
			</h:panelGrid>

			<div align="left" class="header-info">
				<table style="width: 100%">
					<tr>
						<td style="width: 13%"><h:outputLabel
								value="#{lbl['lbl.sc.qtn.no']}" /></td>
						<td style="width: 15%" class="header-info-text">
							#{bsvAttendanceBackingBean.managedBean.scQt.qtNo}</td>
						<td style="width: 13%"><h:outputLabel
								value="#{lbl['lbl.sc.ptj']}" /></td>
						<td style="width: 25%" class="header-info-text">
							#{bsvAttendanceBackingBean.managedBean.scQt.pmOrgProfile.orgCode}
							-
							#{bsvAttendanceBackingBean.managedBean.scQt.pmOrgProfile.orgName}

						</td>
						<td style="width: 13%" class="header-info-text"><h:outputLabel
								value="#{lbl['lbl.sc.status']}" /></td>
						<td style="width: 21%"></td>
					</tr>
				</table>
			</div>
			<p:spacer height="10px"></p:spacer>
		</p:panel>
		<ui:include src="bsvattandencedtls.xhtml"></ui:include>
	</ui:define>
</ui:composition>
