<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" severity="error, info" />
		<p:panel>
			<h:panelGrid border="0" columns="1" cellpadding="0" cellspacing="0"
				width="100%">
				<p:column>
					<div style="float: right;">
						<p:commandButton value="#{lbl['lbl.ss.save']}" icon="ui-icon-save">
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.submit']}"
							icon="ui-icon-submit" process="@this">
						</p:commandButton>
					</div>
				</p:column>

			</h:panelGrid>
		</p:panel>
		<p:panel>
			<div align="left" class="header-info">
				<table>
					<tr>
						<td style="width: 245px"><h:outputLabel
								value="Quotation/Tender No" /></td>
						<td><p:inputText
								value="#{bsvAttendanceBackingBean.managedBean.scQt.qtNo}"
								disabled="true" size="25" /></td>

						<td style="width: 210px"><h:outputLabel value="PTJ Name" /></td>
						<td><p:inputText
								value="#{bsvAttendanceBackingBean.managedBean.scQt.pmOrgProfile.orgCode} - #{bsvAttendanceBackingBean.managedBean.scQt.pmOrgProfile.orgName}"
								disabled="true" size="25" /></td>
						<td style="width: 198px"><h:outputLabel value="Status" /></td>
						<td><p:inputText
								value="#{bsvAttendanceBackingBean.getStatusDescById(6001)}"
								disabled="true" size="30" /></td>
					</tr>
				</table>
			</div>
		</p:panel>
		<ui:include src="bsvattandencedtls.xhtml"></ui:include>
	</ui:define>
</ui:composition>
