<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<p:panel header="Selected Briefing Details">
			<p:dataTable id="selectedBriefDet" var="scQtBriefing"
				value="#{bsvAttendanceBackingBean.managedBean.selectedBriefingDetails}"
				rows="10" rowKey="#{scQtBriefing.qtBriefingId}"  rowIndexVar="rowIndex" >
				<ac:paginator for="selectedBriefDet" />
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.desc']}">
					<h:outputText value="#{scQtBriefing.briefingDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.date']}">
					<h:outputText value="14/11/2013" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.location']}">
				  <p:commandLink onclick="popupLoc.show();">
				    <h:outputText value="#{scQtBriefing.location}" rendered="true"/>
				  </p:commandLink>
				</p:column>

				<p:column
					headerText="#{lbl['lbl.sc.bsv.attendance.coordinating.officer']}">
					<h:outputText value="#{scQtBriefing.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.attendance']}">
					<h:outputText value="#{scQtBriefing.attendanceType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.zone.name']}">
					 <p:commandLink onclick="zonePopUp.show();">
					 <h:outputText value="EastMalaysia" />
					</p:commandLink>
				</p:column>

				<p:column
					headerText="#{lbl['lbl.sc.bsv.attendance.briefing.status']}">
					<h:outputText value="#" />
				</p:column>

			</p:dataTable>

		</p:panel>
		<br />
		<p:panel header="Selected Site Visit Details" toggleable="true">
			<p:dataTable id="selectedSiteDet" var="scQtsitevisit"
				value="#{bsvAttendanceBackingBean.managedBean.selectedSiteVisitDetails}"
				rows="10"  rowKey="#{scQtBriefing.qtBriefingId}"  rowIndexVar="rowIndex" >
				<ac:paginator for="selectedSiteDet" />
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.desc']}">
					<h:outputText value="#{scQtsitevisit.briefingDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.date']}">
					<h:outputText value="04/09/2013 04:44" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.location']}">
					<p:commandLink onclick="popupLoc.show();">
				      <h:outputText value="#{scQtsitevisit.location}" rendered="true"/>
				    </p:commandLink>
				</p:column>

				<p:column
					headerText="#{lbl['lbl.sc.bsv.attendance.coordinating.officer']}">
					<h:outputText value="#{scQtsitevisit.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.attendance']}">
					<h:outputText value="#{scQtsitevisit.attendanceType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.zone.name']}">
					<p:commandLink onclick="zonePopUp.show();">
					 <h:outputText value="EastMalaysia" />
				    </p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.Site.status']}">
					<h:outputText value="#" />
				</p:column>

			</p:dataTable>
		</p:panel>
		<br />
		<p:panel header="Registration" toggleable="true">
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">

				<h:column>
					<h:outputLabel value="#{lbl['lbl.sc.bsv.attendance.mof.regno']}"></h:outputLabel>
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{bsvAttendanceBackingBean.managedBean.scQtBriefingRegistration.smMofAccount.mofAccountId}"
						required="true">
            			<f:selectItem itemLabel="-Select One-" itemValue="0" />
            			<f:selectItems value="#{bsvAttendanceBackingBean.managedBean.smMofAccounts}"
            				var="smMof" itemLabel="#{smMof.mofNo}" itemValue="#{smMof.mofAccountId}" />
	            	</p:selectOneMenu>
				</h:column>

				<h:column>
					<h:outputLabel value="#{lbl['lbl.sc.bsv.attendance.supp.name']}"></h:outputLabel>
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{bsvAttendanceBackingBean.managedBean.scQtBriefingRegistration.smSupplier.supplierId}"
						required="true">
            			<f:selectItem itemLabel="-Select One-" itemValue="0" />
            			<f:selectItems value="#{bsvAttendanceBackingBean.managedBean.smSuppliers}"
            				var="smSup" itemLabel="#{smSup.supplierName}" itemValue="#{smSup.supplierId}" />
	            	</p:selectOneMenu>
				</h:column>

			</h:panelGrid>
		</p:panel>
		<br />

		<p:dataTable id="registrationId" var="ScQtBriefAttendace"
			value="#{bsvAttendanceBackingBean.managedBean.briefingAttendanceList}"
			rows="10" rowKey="#{ScQtBriefAttendace.qtBriefingAttendanceId}"
			rowIndexVar="rowIndex">

			<p:column headerText="#{lbl['lbl.sc.bsv.attendance.name']}">
				<p:inputText value="#{ScQtBriefAttendace.name}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.bsv.attendance.identification.type']}">
				<p:inputText value="#{ScQtBriefAttendace.icPassport}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.bsv.attendance.identification.no']}">
				<p:inputText value="#{ScQtBriefAttendace.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.bsv.attendance.contact.no']}">
				<p:inputText value="#{ScQtBriefAttendace.contactNo}" />
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.bsv.attendance.email']}">
				<p:inputText value="#{ScQtBriefAttendace.email}" />
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.bsv.attendance.action']}">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />
				</p:commandLink>

			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.bsv.attendance.add']}"
				process="@this,registrationId" partialSubmit="true"
				action="#{bsvAttendanceBackingBean.addRegistration}"
				update=":form:registrationId"  icon="ui-icon-add" />
		</div>


</ui:composition>
