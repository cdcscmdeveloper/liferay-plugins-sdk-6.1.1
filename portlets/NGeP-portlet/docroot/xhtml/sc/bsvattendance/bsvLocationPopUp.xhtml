<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="popupLoc" header="#{lbl['lbl.sc.location.details']}" widgetVar="popupLoc"
		modal="true" styleClass="locationpopup">
		<p:panel toggleable="true">
			<h:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="#{lbl['lbl.sc.location']}" />
				<p:inputText readonly="true" style="width:207px;"
					value="#{bsvAttendanceBackingBean.managedBean.location}" />

				<h:outputLabel value="#{lbl['lbl.sc.address']}" />
				<p:inputTextarea readonly="true" cols="30" rows="6"
					value="#{bsvAttendanceBackingBean.managedBean.address}" />
			</h:panelGrid>

		</p:panel>
	</p:dialog>
</ui:composition>
