
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">

		<p:messages id="bsvattanadance" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
			
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:panel>
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.btn.back']}"
							action="#{bsvAttendanceBackingBean.backBtn}"
							style="float:left;" />
					</p:column>
					<p:column width="100%" style="text-align:right" >
						<p:commandButton value="#{lbl['lbl.btn.save']}"
							process="@form" 
							action="#{bsvAttendanceBackingBean.saveBriefingRegAttendance('save')}" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"/>
						<p:commandButton value="#{lbl['lbl.btn.complete']}"
							process="@form" 
							action="#{bsvAttendanceBackingBean.saveBriefingRegAttendance('complete')}" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"/>
					</p:column>
					<!-- <p:column width="100%" style="text-align:right" rendered="#{!empty bsvAttendanceBackingBean.managedBean.outComes}">
					<ui:repeat var="bpmAction"
						value="#{bsvAttendanceBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}"
							styleClass="ui-button"
							action="#{qTDetailBB.updateBpmTask(bpmAction)}" />
					</ui:repeat>
					</p:column> -->
				</p:row>
				</p:panelGrid>
				
				<div align="left" class="header-info">
					<table style="width: 100%">
						<tr>
							<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.sc.briefing']}:" /></td>
							<td style="width: 40%" class="header-info-text">
								#{bsvAttendanceBackingBean.managedBean.scQtBriefing.bsvDesc}</td>
							<td style="width: 10%"><h:outputLabel value="#{lbl['lbl.sc.date.time']}:" /></td>
							<td style="width: 40%" class="header-info-text">
								<h:outputText value="#{bsvAttendanceBackingBean.managedBean.scQtBriefing.bsvDate}">
								<f:convertDateTime
									pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" /></h:outputText></td>

						</tr>
					</table>
				</div>
		</p:panel>
		<p:spacer height="10px"></p:spacer>
		<ui:include src="addRegistrationdetails.xhtml"></ui:include>
	</ui:define>

</ui:composition>
