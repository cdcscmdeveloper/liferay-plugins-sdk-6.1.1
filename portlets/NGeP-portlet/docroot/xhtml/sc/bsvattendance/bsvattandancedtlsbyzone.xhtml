<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:accordionPanel id="accordpnllist"
		value="#{bsvAttendanceBackingBean.managedBean.zoneBean}"
		var="zonePnlList"  activeIndex="#{bsvAttendanceBackingBean.managedBean.bsvZoneindx}">
		<p:ajax event="tabChange" update="accordpnllist"
			listener="#{bsvAttendanceBackingBean.onZoneTabChange}" />

		<p:tab id="bsvzonetabs" title="#{zonePnlList.tplSpecZoneDtl.zoneName}">
			<ui:param name="bsvDetails"
				value="#{bsvAttendanceBackingBean.managedBean.normalBsvBean}" />
			<ui:include src="bsvdtls.xhtml"></ui:include>

		</p:tab>
	</p:accordionPanel>
</ui:composition>
