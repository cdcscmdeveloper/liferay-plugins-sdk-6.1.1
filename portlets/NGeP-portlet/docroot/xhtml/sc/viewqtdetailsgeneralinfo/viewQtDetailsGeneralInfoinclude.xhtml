<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table width="100%">
		<tr>
			<td align="right">
			<p:commandButton
					value="#{lbl['lbl.btn.back']}" style="float:left;" action="#{ViewQtDetailsGeneralInfoBB.navigateToCurrentPage}"
					partialSubmit="true" process="@this" /></td>
		</tr>
	</table>
	<ui:param name="statusId"
		value="#{qTDetailBB.managedBean.qt.qtStatus.statusId}" />
	<ui:param name="isQTStatusScheduleDocAndAfter"
		value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
	<ui:param name="isQTStatusBtwScheduleDocAndPendingPublication"
		value="#{qTDetailBB.isQTStatusInBetween(statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT, QTStatusConst.QT_PENDING_RESCHEDULE_PUBLICATION)}" />
	<ui:param name="isMaintancePendingChklistStatus"
		value="#{qTDetailBB.isMaintancePendingChklistStatus()}" />
	<ui:param name="isQTStatusSCApprovalAndBefore"
		value="#{qTDetailBB.isQTStatusLessThanOrEquals(statusId, QTStatusConst.QT_PENDING_SC_COMMITTEE_APPROVAL)}" />

	<ui:include
		src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderGeneralDetails.xhtml" />
</ui:composition>
