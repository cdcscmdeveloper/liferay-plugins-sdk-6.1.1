<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isZonal" value="#{marketResearchBackingBean.managedBean.scLoa.scLoiLoa.zonal}" />
	<ui:param name="loa" value="#{marketResearchBackingBean.managedBean.scLoa}" />
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="30%">
				<h:outputLabel value="#{lbl['lbl.sc.award.type']}" />
			</td>
			<td width="70%" colspan="2">
				<p:inputText id="awardTypeIt"
					value="#{marketResearchBackingBean.getParameterDesc(marketResearchBackingBean.managedBean.scLoa.scLoiLoa.recommendTypeCode)}"
					disabled="true" size="30" readonly="true" />
			</td>
		</tr>
		
		<tr>
			<td width="30%">
				<h:outputLabel value="#{lbl['lbl.sc.recommend.by']}" />
			</td>
			
			<td width="65%">
				<p:inputText id="suppFinalMethodit" style="text-align:left;" 
					value="#{not empty marketResearchBackingBean.managedBean.marketResearchVO.suppFinalizationMethodCode ? marketResearchBackingBean.getParameterDesc(ParameterTypeConst.finalizationRecommendBy,marketResearchBackingBean.managedBean.marketResearchVO.suppFinalizationMethodCode) : lbl['lbl.txt.na']}"
					disabled="true" size="30" readonly="true" />
			</td>
			<td width="5%">
					<p:commandLink id="specificationCl"
						value="#{lbl['lbl.sc.specification']}"
						rendered="#{marketResearchBackingBean.managedBean.qt}"
						ajax="false"
						immediate="true"
						styleClass="blue_font"
						action="#{marketResearchBackingBean.generateSpecificationPdf()}"
						process="@this" />	
					
			</td>
		
		</tr>
		</table> 
		<p:dataTable id="itemtbl" var="scLoiLoaItem"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{marketResearchBackingBean.managedBean.scLoa.scLoiLoaItems}" rows="10" 
			width="100%"> <!-- Bug #35682 -->
			
			<ac:paginator for="itemtbl" />
			
			<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}" style="white-space:normal;"><!-- Bug #35682 -->
				<p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">					
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{scLoiLoaItem.tplSpecZoneDtl}" />
					<h:outputText value="#{scLoiLoaItem.tplSpecZoneDtl.zoneName}" style="white-space: normal;word-wrap: break-word;" /> <!-- Bug #35682 -->
				</p:commandLink>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.item']}" style="white-space:normal;"> <!-- Bug #35682 -->
				<h:outputText id ="itemNameOt" value="#{scLoiLoaItem.scRequestItem.itemName}" 
					rendered="#{marketResearchBackingBean.managedBean.qt}" 
					style="white-space: normal;word-wrap: break-word;" /> <!-- Bug #35682 -->
				<p:commandLink id="itemNameWithSpec"
					rendered="#{not marketResearchBackingBean.managedBean.qt}"
					oncomplete="specPopUp.show();"
					value="#{scLoiLoaItem.scRequestItem.itemName}" 
					partialSubmit="true" process="@this" update="@([id$=specPopUp])">					
					<f:setPropertyActionListener target="#{marketResearchBackingBean.managedBean.itemSpec}" 
						value="#{scLoiLoaItem.scRequestItem.itemDesc}" />
				</p:commandLink>
				
			</p:column>
			
			<p:column style="width:7%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:7%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
			</p:column>
			
			<p:column style="width:8%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
			</p:column>
			
			<p:column style="width:7%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.duration.month']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:8%; text-align:right;" headerText="#{lbl['lbl.sc.quantity']}">
				<h:panelGroup rendered="#{!empty scLoiLoaItem.tplSpecTierQty}">
					<h:outputText value="#{scLoiLoaItem.tplSpecTierQty.fromQty}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{empty scLoiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{!empty scLoiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value="#{scLoiLoaItem.tplSpecTierQty.toQty}" rendered="#{!empty scLoiLoaItem.tplSpecTierQty.toQty}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
				<h:outputText value="#{scLoiLoaItem.qty}" rendered="#{scLoiLoaItem.tplSpecTierQty eq null}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>

			<p:column style="width:12%;" headerText="#{lbl['lbl.sc.uom']}">
				#{scLoiLoaItem.scRequestItem.uom.uomName}
			</p:column>

			<p:column style="width:12%; text-align:right;" headerText="#{lbl['lbl.sc.unit.price']}">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.total']}" />
				</f:facet>	
				
				<h:outputText value="#{scLoiLoaItem.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:12%; text-align:right;" headerText="#{lbl['lbl.sc.sub.total']}">
				<f:facet name="footer">
					<h:outputText value="#{marketResearchBackingBean.managedBean.scLoa.loaAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
				
				<h:outputText value="#{marketResearchBackingBean.calcSubTotalPrice(scLoiLoaItem)}" rendered="#{scLoiLoaItem.tplSpecTierQty eq null}">>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<p:dialog id="specPopUp" 
		widgetVar="specPopUp" 
		header="#{lbl['lbl.sc.eva.item.specification']}" 
		modal="true" width="500" height="150">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="30%" valign="top">
				<p:outputLabel value="#{lbl['lbl.sc.eva.item.specification']}" />
			</td>
			<td width="80%">
				<p:inputTextarea id="itemSpecTaId" 
						rows="5"
						style="width:250px;"
						value="#{marketResearchBackingBean.managedBean.itemSpec}"
						disabled="true" />
			</td>
		</tr>
		
		</table>

	</p:dialog>
	
	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
