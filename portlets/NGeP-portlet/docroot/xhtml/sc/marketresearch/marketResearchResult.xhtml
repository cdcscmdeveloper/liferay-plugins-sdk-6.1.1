<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="marketResearchResult">
		<p:panel id="researchdetails"
			header="#{lbl['lbl.sc.mr.search.result']}" toggleable="true">
			<p:dataTable id="marketdetailsId"
				rowKey="#{scMarketData.createdDate}" rows="10" lazy="true"
				value="#{marketResearchBackingBean.searchMarketResearch}"
				width="100%" var="scMarketData">

				<ac:paginator for="marketdetailsId"></ac:paginator>

				<p:column>
					<f:facet name="header">
					#{lbl['lbl.sc.mr.loa.ack.date']}
				</f:facet>
					<h:outputText value="#{scMarketData[0]}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.sc.mr.loa.sup.tech']}    
				</f:facet>
					<h:commandLink style="text-decoration:underline;color:blue;"
						value="#{scMarketData[1]}" immediate="true" styleClass="blue_font" 
						action="#{marketResearchBackingBean.downloadReport(scMarketData[2])}"
						rendered="#{scMarketData[3] eq 1}" />
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.sc.mr.loa.sup.fin']} 
				</f:facet>
					<h:commandLink style="text-decoration:underline;color:blue;"
						value="#{scMarketData[1]}" immediate="true" styleClass="blue_font"
						action="#{marketResearchBackingBean.downloadReport(scMarketData[2])}"
						rendered="#{scMarketData[3] eq 2}" />
				</p:column>
				<p:column>
					<f:facet name="header">
					#{lbl['lbl.sc.mr.loa.action']} 
				</f:facet>
					<h:commandLink style="text-decoration:underline;color:blue;" styleClass="blue_font"
						value="#{lbl['lbl.sc.mr.view.report']}" immediate="true" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:outputPanel>

</ui:composition>
