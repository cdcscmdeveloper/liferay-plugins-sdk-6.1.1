<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:outputPanel id="marketResearchResult">
		<p:panel id="researchdetails"
			header="#{lbl['lbl.sc.mr.search.result']}" toggleable="true">
			<p:dataTable id="marketdetailsId"
				rows="10" lazy="true"
				value="#{marketResearchBackingBean.marketResearchDataModel}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				width="100%" var="scMarketData">

				<ac:paginator for="marketdetailsId"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.no']}">
					<h:outputText value="#{scMarketData[1]}"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.mr.procurement.title']}">
					<h:outputText value="#{scMarketData[2]}"/>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
					<h:outputText value="#{marketResearchBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode,scMarketData[3])}"/>
				</p:column>
				<p:column  headerText="#{lbl['lbl.sc.mr.loa.ack.date']}">
					<h:outputText  value="#{scMarketData[4]}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.pm.organisation.action']}"
					style="width :5%;text-align:center;">
					<p:commandLink 
						action="#{marketResearchBackingBean.redirectToMarketResearchMaintenance(scMarketData[0],scMarketData[1],scMarketData[3])}"
						update="@form">
						<p:graphicImage 
							title="#{lbl['lbl.btn.view']}"
							value="/css/images/design/ico-view.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:outputPanel>

</ui:composition>
