<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="marketResearchPanel"
		header="#{lbl['lbl.sc.market.research.search.location']}"
		toggleable="false">

		<table cellspacing="100%" style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.procurement.title']}" /></td>
				<td colspan="3"><p:inputText id="procuTitleId" maxlength="255" size="38"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.procurementTitle}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.item.name']}" /></td>
				<td colspan="3"><p:inputText id="itemNameId" maxlength="255" size="38"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.itemName}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.specification']}" /></td>
				<td colspan="3"><p:inputText id="specId" maxlength="255" size="38"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.spec}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.no']}" /></td>
				<td><p:inputText id="loaNoId" maxlength="255" size="38"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.loaNo}"/>
				</td>
				<td colspan="2"></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.loa.ack.date.from']}" /></td>
				<td><p:calendar  navigator="true" size="38"
					showOn="button" id="ackStartDate"
					label="#{lbl['lbl.sc.mr.loa.ack.date.from']}"
					readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.loaAckDateFrom}">
					<p:ajax event="dateSelect" update="@this"
						process="@this" />
				</p:calendar>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.loa.ack.date.to']}" /></td>
				<td><p:calendar  navigator="true" size="38"
					showOn="button" id="ackEndDate"
					label="#{lbl['lbl.sc.mr.loa.ack.date.to']}"
					readonlyInput="true"
					maxdate="#{DateUtils.getCurrentDateWithoutTime()}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.loaAckDateTo}">
					<p:ajax event="dateSelect" update="@this"
						process="@this" />
				</p:calendar>
				</td>
			</tr>
			<tr>
				<td colspan="4">&#160;</td>
			</tr>
		</table>
		<h:panelGroup>
			<div class="ppRightBtn" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.btn.search']}" process="@this, marketResearchPanel" partialSubmit="true"
					action="#{marketResearchBackingBean.searchMarketResearch}"
					update="marketResearchPanel,marketResearchResult"	/>
				<p:commandButton value="#{lbl['lbl.btn.reset']}" process="@this"
					action="#{marketResearchBackingBean.resetMarketResearch}"
					update="marketResearchPanel,marketResearchResult"	/>	
			</div>
   		</h:panelGroup>
	</p:panel>

</ui:composition>
