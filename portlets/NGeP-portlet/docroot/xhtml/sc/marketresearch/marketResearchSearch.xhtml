<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="marketResearchPanel"
		header="#{lbl['lbl.sc.market.research.search.location']}"
		toggleable="false">

		<table cellspacing="100%" style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.procurement.title']}" /></td>
				<td><p:inputText id="procuTitleId" maxlength="255"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.procurementTitle}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.item.name']}" /></td>
				<td><p:inputText id="itemNameId" maxlength="255"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.itemName}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.specification']}" /></td>
				<td><p:inputText id="specId" maxlength="255"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.spec}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
				<td><p:selectOneMenu
						requiredMessage="#{lbl['lbl.sc.mr.val.proc.type.msg']}"
						value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.selectedProcurementMethod}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{marketResearchBackingBean.getProcModeCategories()}"
							var="procMode" itemLabel="#{procMode.codeName}"
							itemValue="#{procMode.pmParameter.parameterCode}" />
					</p:selectOneMenu></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.no']}" /></td>
				<td><p:inputText id="loaNoId" maxlength="255"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.loaNo}"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.loa.ack.date']}" /></td>
				<td><p:calendar  navigator="true"
					showOn="button" id="ackStartDate"
					label="#{lbl['lbl.sc.mr.loa.ack.date']}"
					readonlyInput="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.loaAckDateFrom}">
					<p:ajax event="dateSelect" update="@this"
						process="@this" />
				</p:calendar>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mr.loa.ack.date']}" /></td>
				<td><p:calendar  navigator="true"
					showOn="button" id="ackEndDate"
					label="#{lbl['lbl.sc.mr.loa.ack.date']}"
					readonlyInput="true"
					maxdate="#{DateUtils.getCurrentDateWithoutTime()}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					value="#{marketResearchBackingBean.managedBean.marketResearchSearchBean.loaAckDateTo}">
					<p:ajax event="dateSelect" update="@this"
						process="@this" />
				</p:calendar>
				</td>
			</tr>
		</table>
		<h:panelGroup>
			<div class="ppRightBtn" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.btn.search']}" 
					action="#{marketResearchBackingBean.searchMarketResearch}"
					update="marketResearchPanel,marketResearchResult"	/>
			</div>
   		</h:panelGroup>
	</p:panel>

</ui:composition>
