<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	<table style="width: 100%;">
			<tr>
				<td><p:commandButton id="mrBackBttnId" value="#{lbl['lbl.btn.back']}" immediate="true"
						update=":form" process="@this"
						action="#{marketResearchBackingBean.backToSearch}"
						style="float:left;"/></td>
				<td>
				</td>
			</tr>
		</table>	
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
					styleClass="sidemenu"
					activeIndex="#{marketResearchBackingBean.managedBean.activeIndex}"	>
					<p:menuitem value="#{lbl['lbl.sc.qt.qtn.details']}"
						action="#{marketResearchBackingBean.marketResearchDetailsChange(0)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.sc.loiloa.award.details']}"
						action="#{marketResearchBackingBean.marketResearchDetailsChange(1)}" update="@form"
						process="@form" />
				</p:tabMenu></td>
			<td width="80%" valign="top"><h:panelGroup id="menuQTContent">
					<c:if test="#{marketResearchBackingBean.managedBean.activeIndex eq '0'}">
						<ui:include src="/xhtml/sc/marketresearch/marketResearchDetails.xhtml" />
					</c:if>
					<c:if test="#{marketResearchBackingBean.managedBean.activeIndex eq '1'}">
						<ui:include src="/xhtml/sc/marketresearch/loaAwardDetailsMenu.xhtml" />
					</c:if>
				</h:panelGroup></td>
		</tr>
	</table>
	</ui:define>
</ui:composition>
