<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.present.demo.approval']}"
		toggleable="true">
		<div align="left">
			<table>
				<tr>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.present.demo.letter']}"></p:outputLabel></td>
					<td><p:inputText></p:inputText></td>
					<td style="width: 210px"><p:outputLabel
							value="#{lbl['lbl.sc.present.demo.standard.document']}"></p:outputLabel></td>
					<td><h:panelGroup>



							<p:commandButton value="#{lbl['lbl.btn.upload']}"
								partialSubmit="true" process="@this">


							</p:commandButton>

							<p:outputPanel autoUpdate="true">
								<h:outputText styleClass="testClass"></h:outputText>
							</p:outputPanel>

						</h:panelGroup></td>
				</tr>

				<tr>
					<td style="width: 100px"><h:outputLabel
							value="#{lbl['lbl.sc.remarks']}" /></td>
					<td><p:inputTextarea value="" rows="3" cols="30"
							autoResize="false" /></td>
				</tr>
			</table>
		</div>
	</p:panel>


	<p:panel header="#{lbl['lbl.sc.present.demo.shortlist.supplier']}"
		toggleable="true">
		<p:dataTable id="presentationsuppliers" rowIndexVar="index"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			style="width:100%">
			<ac:paginator for="presentationsuppliers" />


			<p:column headerText="#{lbl['lbl.sc.supplier.name']}"
				style="width:20%">
			</p:column>
		</p:dataTable>
	</p:panel>


	<p:panel header="#{lbl['lbl.sc.present.demo.approver.head']}"
		toggleable="true">
		<div align="left">
			<table>
				<tr>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.present.demo.approver.name']}"></p:outputLabel></td>
					<td><p:inputText disabled="true"></p:inputText></td>
					<td style="width: 270px"><p:outputLabel
							value="#{lbl['lbl.sc.present.demo.approval.date']}"></p:outputLabel></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td style="width: 100px"><h:outputLabel
							value="#{lbl['lbl.sc.action']}" /></td>
					<td><p:selectOneMenu>
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}"></f:selectItem>
						</p:selectOneMenu></td>

					<td style="width: 270px"><h:outputLabel
							value="#{lbl['lbl.sc.remarks']}" /></td>
					<td><p:inputTextarea value="" rows="3" cols="30"
							autoResize="false" /></td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
