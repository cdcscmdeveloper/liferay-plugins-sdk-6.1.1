<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 11%"><h:outputLabel
						value="#{lbl['lbl.sc.head.present.qt.num']}" /></td>
				<td style="width: 15%" class="header-info-text">#{specificationBackingBean.managedBean.scQt.qtNo}</td>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.scQt.ppPlan.planNo ne null}">
					<td style="width: 5%"><h:outputLabel
							value="#{lbl['lbl.so.planno']}" /></td>
					<td style="width: 10%" class="header-info-text">#{specificationBackingBean.managedBean.scQt.ppPlan.planNo}</td>
				</ui:fragment>
				<td style="width: 7%"><h:outputLabel
						value="#{lbl['lbl.sc.head.present.ptj.name']}" /></td>
				<td style="width: 25%" class="header-info-text">#{specificationBackingBean.managedBean.scQt.pmOrgProfile.orgName}</td>
				<td style="width: 7%"><h:outputLabel
						value="#{lbl['lbl.sc.head.present.status']}" /></td>
				<td style="width: 20%" class="header-info-text">
					#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQt.qtStatus.statusId)}
				</td>
			</tr>
		</table>
	</div>
</ui:composition>
