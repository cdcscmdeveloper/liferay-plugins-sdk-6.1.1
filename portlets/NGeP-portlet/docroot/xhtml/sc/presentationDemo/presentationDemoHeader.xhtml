<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.head.present.qt.num']}" /></td>
				<td  class="header-info-text">#{specificationBackingBean.managedBean.scQt.qtNo}</td>
				<td style="width : 12px;"></td>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.scQt.ppPlan.planNo ne null}">
					<td><h:outputLabel
							value="#{lbl['lbl.so.planno']}" /></td>
					<td class="header-info-text">#{specificationBackingBean.managedBean.scQt.ppPlan.planNo}</td>
					<td style="width : 12px;"></td>
				</ui:fragment>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.head.present.ptj.name']}" /></td>
				<td class="header-info-text">#{specificationBackingBean.managedBean.scQt.pmOrgProfile.orgName}</td>
				<td style="width : 12px;"></td>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.head.present.status']}" /></td>
				<td class="header-info-text">
					#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.currentStatusId)}
				</td>
			</tr>
		</table>
	</div>
</ui:composition>
