<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="planInforDialog" widgetVar="procurePlanPopup"
		styleClass="planDailog" modal="true" width="500" height="350" header="#{lbl['lbl.pp.updatenotificcationdays']}">

		
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">
				<p:outputLabel value="#{lbl['lbl.pp.plan.number']}" />
				<p:inputText readonly="true"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.planNo}" />

				<p:outputLabel value="#{lbl['lbl.pp.plan.description']}" />
				<p:inputTextarea cols="20" rows="3"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.planDesc}"
					readonly="true" style="margin-bottom:5px" />


				<p:outputLabel value="#{lbl['lbl.pp.procurement.mode']}" />

				<p:inputText readonly="true"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.procurementModeParam.parameterCode}" />



				<p:outputLabel value="#{lbl['lbl.so.planamount']}" />

				<p:inputText readonly="true"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.actualAmt}" />

				<p:outputLabel value="#{lbl['lbl.pp.status']}" />
				<p:inputText readonly="true"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.pmStatus.pmStatusDescs.statusName}" />

				<p:outputLabel value="#{lbl['lbl.qt.pp.purchasereqstdate']}" />

				<p:inputText readonly="true"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.ppPlanActivities[0].planStartDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
				</p:inputText>
				<p:outputLabel value="Notification Date" />
				<p:calendar id="notificationDaysSelection" showOn="button" maxdate="#{procurementPlanBackingBean.managedBean.currentPlan.ppPlanActivities[0].planStartDate}"
					value="#{procurementPlanBackingBean.managedBean.notificationDate}" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" style="margin-bottom:3px">
					<p:ajax event="dateSelect" listener="#{procurementPlanBackingBean.handleDateSelect}" update="notificationDays" process="@this"/>  
					</p:calendar>

				<p:outputLabel value="#{lbl['lbl.qt.pp.notificationdays']}" />
				<p:inputText id="notificationDays"
					value="#{procurementPlanBackingBean.managedBean.currentPlan.notificationDays}" >
					<p:ajax event="blur" update="notificationDaysSelection" listener="#{procurementPlanBackingBean.handleNotificationDate}"/> 
					</p:inputText>
				<div align="right">
					<p:columnGroup>
						<p:commandButton process="@this" value="Ok"
							action="#{procurementPlanBackingBean.updatePlannedInfo}"
							oncomplete="procurePlanPopup.hide();" partialSubmit="true"
							icon="ui-icon-ok" update="dtPlanResult"/>
						<p:commandButton value="Cancel" onclick="procurePlanPopup.hide()"
							icon="ui-icon-close" />
					</p:columnGroup>
				</div>
			</h:panelGrid>
	
		
	</p:dialog>
</ui:composition>
