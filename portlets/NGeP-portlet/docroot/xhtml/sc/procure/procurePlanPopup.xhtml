<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="planInforDialog" widgetVar="procurePlanPopup"
		styleClass="planDailog" modal="true" style="width: 464px; height: 333px; left: 425.5px; top: 66.375px; "
		header="#{lbl['lbl.sc.pp.update.notificcation.days']}">


		<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">
			<p:outputLabel value="#{lbl['lbl.sc.pp.planed.number']}" />
			<p:inputText disabled="true"
				value="#{procurementPlanBackingBean.managedBean.currentPlan.planNo}" />

			<p:outputLabel value="#{lbl['lbl.pp.plan.description']}" />
			<p:inputTextarea cols="60" rows="3"
				value="#{procurementPlanBackingBean.managedBean.currentPlan.planDesc}"
				disabled="true" style="margin-bottom:5px" />


			<p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" />

			<p:inputText disabled="true"
				value="#{procurementPlanBackingBean.getParameterDesc(procurementPlanBackingBean.managedBean.currentPlan.procurementModeParam)}" />


			<p:outputLabel value="#{lbl['lbl.sc.planned.amount']}" />

			<p:inputText disabled="true"
				value="#{procurementPlanBackingBean.managedBean.currentPlan.actualAmt}" />

			<p:outputLabel value="#{lbl['lbl.sc.status']}" />
			<p:inputText disabled="true"
				value="#{procurementPlanBackingBean.managedBean.currentPlan.pmStatus.pmStatusDescs.statusName}" />

			<p:outputLabel value="#{lbl['lbl.sc.start.date']}" />

			<p:inputText disabled="true"
				value="#{procurementPlanBackingBean.managedBean.currentPlan.ppPlanActivities[0].planStartDate}">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			</p:inputText>
			<p:outputLabel value="#{lbl['lbl.sc.pp.notification.date']}" />
			<p:calendar id="notificationDaysSelection" showOn="button"
				maxdate="#{procurementPlanBackingBean.managedBean.currentPlan.ppPlanActivities[0].planStartDate}"
				value="#{procurementPlanBackingBean.managedBean.notificationDate}"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
				style="margin-bottom:3px">
				<p:ajax event="dateSelect"
					listener="#{procurementPlanBackingBean.handleDateSelect}"
					update="notificationDays" process="@this" />
			</p:calendar>

			<p:outputLabel value="#{lbl['lbl.sc.pp.notificationdays']}" />
			<p:inputText id="notificationDays"
				value="#{procurementPlanBackingBean.managedBean.currentPlan.notificationDays}">
				<p:ajax event="blur" update="notificationDaysSelection"
					listener="#{procurementPlanBackingBean.handleNotificationDate}" />
			</p:inputText>

		</h:panelGrid>
		<h:panelGrid border="0" columns="1" cellpadding="0" cellspacing="0"
			width="100%">
			<p:column>
				<div style="float: right;">
					<p:commandButton process="@this" value="#{lbl['lbl.btn.ok']}"
						action="#{procurementPlanBackingBean.updatePlannedInfo}"
						oncomplete="procurePlanPopup.hide();" partialSubmit="true"
						update="dtPlanResult" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" onclick="procurePlanPopup.hide()"/>
				</div>
			</p:column>
		</h:panelGrid>



	</p:dialog>
</ui:composition>
