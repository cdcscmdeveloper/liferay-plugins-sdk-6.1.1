<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<h:head>
		<h:outputStylesheet library="ep/css" name="ep.css" />
	</h:head>
<ui:define name="contentSection">
		<p:dataTable lazy="false" dynamic="true" width="100%" cellpadding="1"
			value="#{ssProcurementListBackingBean.managedBean.procurementPlanList}"
			var="procurementObj" id="procureList">
			
			<p:column headerText="Planned No." style="width:15%">
				<p:outputLabel value="#{procurementObj.planNo}"></p:outputLabel>
			</p:column>

			<p:column headerText="Plan Description" style="width:20%">
				<p:outputLabel value="#{procurementObj.planDesc}"></p:outputLabel>
			</p:column>

			<p:column headerText="Procurement Mode" style="width:17%">
				<p:outputLabel
					value="#{ssProcurementListBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, procurementObj.procurementModeParam.parameterCode)}"></p:outputLabel>
			</p:column>

			<p:column headerText="Planned Amount" style="width:15%">
				<p:outputLabel value="#{procurementObj.actualAmt}"></p:outputLabel>
			</p:column>

			<p:column headerText="Purchase Request Date" style="width:22%">
				<h:outputText value="#{procurementObj.createdDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
				</h:outputText>
			</p:column>
			<p:column headerText="Action" style="width:6%">
				<p:commandLink action="#{ssProcurementListBackingBean.initiateBPMTask(procurementObj)}" rendered="true" update="procureList" process="@this">
				<p:graphicImage url="/resources/ep/images/design/add.png"></p:graphicImage>
			</p:commandLink>
			</p:column>

		</p:dataTable>
</ui:define>
</ui:composition>
