<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Search Procurement" toggleable="true">
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:25%">
					<p:outputLabel value="Plan Number:"></p:outputLabel>
				</p:column>
				<p:column>
					<p:inputText value="#{procurementListBackingBean.managedBean.planSearchBean.planNo}"></p:inputText>
				</p:column>
			</p:row>
			<p:row>
				<p:column style="width:25%">
					<p:outputLabel value="Procurement Mode:"></p:outputLabel>
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{procurementListBackingBean.managedBean.planSearchBean.procurementMode}" style="width: auto; min-width: 150px;" required="false"
						disabled="false">
						<f:selectItems value="#{procurementListBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" var="selectItem" itemValue="#{selectItem.value}" itemLabel="#{selectItem.label}"/>
		
					</p:selectOneMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Plan Status:"></p:outputLabel>
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{procurementListBackingBean.managedBean.planSearchBean.status}" style="width: auto; min-width: 150px;" required="false"
						disabled="false">
						<f:selectItems value="#{procurementListBackingBean.getStatusDropdownValues(PPConst.module,PPConst.doctypePlan)}" var="selectItem" itemValue="#{selectItem.value}" itemLabel="#{selectItem.label}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column colspan="2">
					<p:commandButton value="#{lbl['lbl.so.searchbtn']}" style="float:right;" icon="search-icon" action="#{procurementListBackingBean.retriveProcuremntPlanDtls}"
						update="procurementPlanList"></p:commandButton>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
	<p:panel header="Results" toggleable="true" style="width:100%">
		<p:dataTable lazy="false" dynamic="true" paginator="true" paginatorPosition="bottom"
			paginatorAlwaysVisible="true" emptyMessage="No Records!" width="100%" cellpadding="1"
			value="#{procurementListBackingBean.managedBean.procurementPlanList}"
			var="procurementObj" id="procurementPlanList">
			<ac:paginator for="procurementPlanList"/>
			<p:column headerText="Planned No." style="width:15%">
				<h:outputText value="#{procurementObj.planNo}"></h:outputText>
			</p:column>

			<p:column headerText="Plan Description" style="width:20%">
				<h:outputText value="#{procurementObj.planDesc}"></h:outputText>
			</p:column>

			<p:column headerText="Procurement Mode" style="width:17%">
				<h:outputText
					value="#{procurementListBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, procurementObj.procurementModeParam.parameterCode)}"></h:outputText>
			</p:column>

			<p:column headerText="Planned Amount" style="width:15%">
				<h:outputText value="#{procurementObj.actualAmt}"></h:outputText>
			</p:column>

			<p:column headerText="Purchase Request Date" style="width:22%">
				<h:outputText value="#{procurementObj.createdDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
				</h:outputText>
			</p:column>


			<p:column headerText="Notification Days" style="width:15%">
				<h:outputText value="#{procurementObj.notificationDays}"></h:outputText>
			</p:column>

			<p:column headerText="Plan Status" style="width:15%">

			</p:column>

			<p:column headerText="Action" style="width:6%">
				<p:commandLink actionListener="#{procurementListBackingBean.editPlan(procurementObj)}" rendered="#{procurementObj.editable}" update="@([id$=planInforDialog])" oncomplete="procurePlanPopup.show();">
					<p:graphicImage value="/resources/ep/images/design/edit.png"></p:graphicImage>
				</p:commandLink>
				<p:commandLink action="#{procurementListBackingBean.initiateBPMTask(procurementObj)}"
					rendered="#{procurementObj.editable}" update="procurementPlanList" process="@this">
					<p:graphicImage url="/resources/ep/images/design/add.png"></p:graphicImage>
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
	<ui:include src="/xhtml/sc/procure/procurePlanPopup.xhtml"></ui:include>
</ui:composition>
