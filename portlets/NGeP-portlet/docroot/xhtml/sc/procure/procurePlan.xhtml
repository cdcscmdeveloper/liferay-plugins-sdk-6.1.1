<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true">
		<h:panelGrid id="planSearchDtls" border="0" cellpadding="0"
			cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20">

			<p:outputLabel value="#{lbl['lbl.sc.pp.plan.number']}" />

			<p:inputText
				value="#{procurementPlanBackingBean.managedBean.planNumber}" />


			<p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" />

			<p:selectOneMenu id="somProcureMode" styleClass="ppDropDownWidthM"
				value="#{procurementPlanBackingBean.managedBean.procurementMode}"
				style="margin-bottom:5px">

				<f:selectItems
					value="#{procurementPlanBackingBean.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
			</p:selectOneMenu>


			<p:outputLabel value="#{lbl['lbl.sc.status']}" />


			<p:selectOneMenu styleClass="ppDropDownWidthM"
				value="#{procurementPlanBackingBean.managedBean.planStatus}">
				<f:selectItems
					value="#{procurementPlanBackingBean.statusDropdownValues()}" />
			</p:selectOneMenu>


		</h:panelGrid>

		<h:panelGrid border="0" columns="1" cellpadding="0" cellspacing="0"
			width="100%">
			<p:column>
				<div style="float: right;">
					<p:commandButton value="#{lbl['lbl.btn.search']}" 
						update="dtPlanResult"
						action="#{procurementPlanBackingBean.retriveProcuremntPlanDtls}">
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.btn.reset']}" 
						update="dtPlanResult,planSearchDtls"
						action="#{procurementPlanBackingBean.resetPlanDetails}">
					</p:commandButton>
				</div>
			</p:column>

		</h:panelGrid>




	</p:panel>

	<!-- Result List -->
	<p:panel header="#{lbl['lbl.sc.result']}" toggleable="true">
		<p:dataTable id="dtPlanResult" styleClass="ppTableFull" var="ppPlan"
			value="#{procurementPlanBackingBean.planDataModel}"
			rowIndexVar="index" emptyMessage="#{lbl['lbl.pp.no.record.found']}"
			style="width:100%" lazy="true">
			<ac:paginator for="dtPlanResult" />

			<p:column headerText="#{lbl['lbl.sc.pp.planed.number']}">
				<h:outputText value="#{ppPlan.planNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.pp.plan.description']}">
				<h:outputText value="#{ppPlan.planDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
				<h:outputText
					value="#{procurementPlanBackingBean.getParameterDesc(ppPlan.procurementModeParam)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.planned.amount']}">
				<h:outputLabel value="#{ppPlan.actualAmt}"></h:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				<h:outputText
					value="#{procurementPlanBackingBean.getStatusDescById(ppPlan.pmStatus.statusId)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.start.date']}">
				<h:outputText value="#{ppPlan.ppPlanActivities[0].planStartDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.pp.notificationdays']}">
				<h:outputLabel value="#{ppPlan.notificationDays}"></h:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				<h:outputText
					value="#{procurementPlanBackingBean.getStatusDescById(ppPlan.pmStatus.statusId)}" />
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.action']}">
				<p:commandLink
					actionListener="#{procurementPlanBackingBean.editPlan(ppPlan,rowIndex)}"
					oncomplete="procurePlanPopup.show();" update="@(.planDailog)">
					<p:graphicImage value="/resources/ep/images/design/edit.png"></p:graphicImage>
				</p:commandLink>
				<p:commandLink
					action="#{procurementPlanBackingBean.initiateBPMTask(ppPlan)}"
					process="@this">
					<p:graphicImage url="/resources/ep/images/design/add.png"></p:graphicImage>
				</p:commandLink>
			</p:column>

		</p:dataTable>


	</p:panel>

</ui:composition>
