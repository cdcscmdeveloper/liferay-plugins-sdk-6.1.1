<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">
		<p:messages id="qtRetryMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
		<tr>
			<td style="text-align:right;">
				<p:commandButton id="submitRetryBtn"
					value="#{lbl['lbl.btn.submit']}"
					action="#{qtRetryBackingBean.submitQTRetryAction}"
					partialSubmit="true"
					process="@this"
					update="qtRetryTbl"
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();"
					disabled="#{empty qtRetryBackingBean.selectedRetryQTs}" /> 
				<p:commandButton id="addRetryBtn"
					value="#{lbl['lbl.btn.add']}"
					partialSubmit="true"
					process="@this"
					update="addDisruptionPopUp"
					oncomplete="addDisruptionPopUp.show();">
				</p:commandButton>
				<p:commandButton id="deleteRetryBtn"
					value="#{lbl['lbl.btn.delete']}"
					partialSubmit="true"
					process="@this"
					update="deleteDisruptionPopUp"
					oncomplete="deleteDisruptionPopUp.show();"
					disabled="#{empty qtRetryBackingBean.selectedRetryQTs}" />
				<p:commandButton
					value="#{lbl['lbl.sc.btn.refresh']}"
					action="#{qtRetryBackingBean.reloadRetryQTAction}"
					partialSubmit="true"
					process="@this"
					update="qtRetryTbl" />
			</td>
		</tr>
		</table>

		<p:dataTable id="qtRetryTbl" value="#{qtRetryBackingBean.retryQTDataModel}" 
			var="scQtDisruptionLog" rowIndexVar="index" 
			lazy="true" rows="10"
			selection="#{qtRetryBackingBean.selectedRetryQTs}">

			<ac:paginator for="qtRetryTbl" />
			
			<p:ajax event="rowSelect" update="@([id$=submitRetryBtn],[id$=deleteRetryBtn])" />
			<p:ajax event="rowUnselect" update="@([id$=submitRetryBtn],[id$=deleteRetryBtn])" />
			<p:ajax event="rowSelectCheckbox" update="@([id$=submitRetryBtn],[id$=deleteRetryBtn])" />
			<p:ajax event="rowUnselectCheckbox" update="@([id$=submitRetryBtn],[id$=deleteRetryBtn])" />
			<p:ajax event="toggleSelect" update="@([id$=submitRetryBtn],[id$=deleteRetryBtn])" />
			
			<p:column selectionMode="multiple" style="width:2%;text-align:center"/>

			<p:column headerText="#{lbl['lbl.sc.document.no']}" style="width:100px;">
				<h:outputText value="#{scQtDisruptionLog.docNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.document.title']}">
				<h:outputText value="#{scQtDisruptionLog.docTitle}"
					style="white-space: normal;word-wrap: break-word;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.start.date']}"
				style="width:80px;">
				<h:outputText value="#{scQtDisruptionLog.startDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.end.date']}"
				style="width:80px;">
				<h:outputText value="#{scQtDisruptionLog.endDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.disruption.stage']}" style="width:200px;">
				<p:commandLink 
					partialSubmit="true" process="@this" update="@([id$=errMsgPopUp])"
					oncomplete="errMsgPopUp.show()" >
					<f:setPropertyActionListener target="#{qtRetryBackingBean.selectedRetryQT}" value="#{scQtDisruptionLog}" />
					#{qtRetryBackingBean.getParameterDesc(ParameterTypeConst.qtDisruptionStage, scQtDisruptionLog.disruptionStage.toString())}	
				</p:commandLink>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.disruption.date']}" style="width:80px;">
				<h:outputText value="#{scQtDisruptionLog.changedDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		
		<p:dialog id="errMsgPopUp" widgetVar="errMsgPopUp"
			header="#{lbl['lbl.txt.error']}" styleClass="screen-title"
			resizable="false" modal="true" width="600" height="200">
			<h:outputText value="#{qtRetryBackingBean.selectedRetryQT.errorMsg}" escape="false" />
		</p:dialog>
		
		<p:dialog id="deleteDisruptionPopUp" widgetVar="deleteDisruptionPopUp"
			header="#{lbl['lbl.btn.dialog.cofirm.delete.msg']}" styleClass="screen-title"
			resizable="false" modal="true" width="600" height="200">
			<p:messages id="delErrMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
			
			<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<tr>
				<td>
					<h:outputText value="#{lbl['lbl.txt.remarks']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:inputTextarea id="reasonTxt" 
						required="#{param[p:component('delDisOkBtn')]!=null}" 
						rows="9" cols="50" 
						value="#{qtRetryBackingBean.reason}"
						label="#{lbl['lbl.txt.remarks']}" />
				</td>
			</tr>
			<tr>
				<td style="text-align:right;">
					<p:commandButton id="delDisOkBtn"
						value="#{lbl['lbl.btn.ok']}"
						action="#{qtRetryBackingBean.deleteScRetryAction}"
						partialSubmit="true"
						process="@this, reasonTxt"
						update="qtRetryTbl, @([id$=submitRetryBtn],[id$=deleteRetryBtn])"
						onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" /> 
					<p:commandButton id="delDisCancelBtn"
						value="#{lbl['lbl.btn.cancel']}"
						partialSubmit="true"
						process="@this"
						update="qtRetryTbl, @([id$=submitRetryBtn],[id$=deleteRetryBtn])"
						oncomplete="deleteDisruptionPopUp.hide();">
						<f:setPropertyActionListener value="#{null}" target="#{qtRetryBackingBean.reason}" />
						<f:setPropertyActionListener value="#{null}" target="#{qtRetryBackingBean.selectedRetryQTs}" />
					</p:commandButton> 
				</td>
			</tr>
			</table>
		</p:dialog>
		
		<p:dialog id="addDisruptionPopUp" widgetVar="addDisruptionPopUp"
			header="#{lbl['lbl.sc.add']}" styleClass="screen-title"
			resizable="false" modal="true" width="600" height="330">
			<p:messages id="addErrMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
			<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<tr>
				<td>
					<h:outputText value="#{lbl['lbl.sc.document.type']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:selectOneMenu id="docType"
						required="#{param[p:component('addDisOkBtn')]!=null}" 
						value="#{qtRetryBackingBean.docType}"
						style="width: 297px;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.document.type']}">
						<f:selectItems value="#{qtRetryBackingBean.getScRetryDocTypeDropdownValues()}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<h:outputText value="#{lbl['lbl.sc.document.no']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:inputText id="docNo"
						required="#{param[p:component('addDisOkBtn')]!=null}" 
						value="#{qtRetryBackingBean.docNo}"
						maxlength="21" style="width:288px;"
						label="#{lbl['lbl.sc.document.no']}" />
				</td>
			</tr>
			<tr>
				<td>
					<h:outputText value="#{lbl['lbl.sc.disruption.stage']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:selectOneMenu id="disruptionStage"
						required="#{param[p:component('addDisOkBtn')]!=null}" 
						value="#{qtRetryBackingBean.disruptionStage}"
						style="width: 297px;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.disruption.stage']}">
						<f:selectItems value="#{qtRetryBackingBean.getDropdownCodeValues(ParameterTypeConst.qtDisruptionStage)}" />
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<h:outputText value="#{lbl['lbl.txt.remarks']}" />
				</td>
			</tr>
			<tr>
				<td>
					<p:inputTextarea id="remarkTxt" 
						required="#{param[p:component('addDisOkBtn')]!=null}" 
						rows="9" cols="50" 
						value="#{qtRetryBackingBean.reason}"
						label="#{lbl['lbl.txt.remarks']}" />
				</td>
			</tr>
			<tr>
				<td style="text-align:right;">
					<p:commandButton id="addDisOkBtn"
						value="#{lbl['lbl.btn.ok']}"
						action="#{qtRetryBackingBean.addScRetryAction}"
						partialSubmit="true"
						process="@this, docType, docNo, disruptionStage, remarkTxt"
						update="qtRetryTbl"
						onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" /> 
					<p:commandButton id="addDisCancelBtn"
						value="#{lbl['lbl.btn.cancel']}"
						partialSubmit="true"
						process="@this"
						update="@this"
						oncomplete="addDisruptionPopUp.hide();">
					</p:commandButton>
				</td>
			</tr>
			</table>
		</p:dialog>
		
	</ui:define>
</ui:composition>
