<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="businessOwnerTechmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true" 
						action="#{specificationBackingBean.businessOwnerTemplateSpecBackAction}" />


					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						style="float:right;" onclick="createTechnicalDialog.show();"
						immediate="true" 
						disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"></p:commandButton>

					<p:commandButton value="#{lbl['lbl.btn.complete']}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" 
						disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
						action="#{specificationBackingBean.completeTemplateSpecDetails('BO',1)}" />

					<p:commandButton value="#{lbl['lbl.btn.save']}"
						style="float:right;" 
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
						action="#{specificationBackingBean.saveTemplateSpecDetails('BO',1)}"
						update="@all" /></td>
			</tr>
		</table>


		<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">


			<table>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
							style="margin-bottom:5px;width:83%;" maxlength="200"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" /></td>
				</tr>

				<tr>
					<td style="width: 10%"><p:outputLabel
							value="#{lbl['lbl.sc.item.type']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}" />
					</td>
					<td><h:outputLabel
							value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

				</tr>

				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
					<td><p:selectOneRadio
							disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode.parameterId}">
							<f:selectItems
								value="#{specificationBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
							<p:ajax event="change" partialSubmit="true" process="@this" />
						</p:selectOneRadio></td>
				</tr>

				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneRadio disabled="true"
										value="#{specificationBackingBean.managedBean.templateSpecBean.specMaster.weightageReq}">
										<f:selectItems
											value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.itemWeightage)}" />


										<p:ajax event="change" partialSubmit="true" process="@this"
											listener="#{templateSpecBackingBean.updateItemWeightageReq(specificationBackingBean.managedBean.templateSpecBean)}" />

									</p:selectOneRadio></td>
								<td style="margin-top: -3px"><ac:iconTooltip
										value="#{lbl['lbl.sc.spec.item.weightage.tooltip']}" /></td>
							</tr>
						</table>
					</td>
				</tr>

			</table>

			<p:dialog id="bocreateEditTechnicalDialog"
				widgetVar="createTechnicalDialog"
				header="#{lbl['lbl.sc.cancel.confirm']}" resizable="false"
				width="400" height="75" closable="false">
				<table>
					<tr>
						<td align="center"><h:graphicImage
								value="/css/images/design/exclamation.png" /> <p:outputLabel
								value="#{lbl['lbl.sc.dialog.confirm.cancel']}" /></td>
					</tr>
				</table>
				<p:spacer height="1" />
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.yes']}" immediate="true"
						oncomplete="createTechnicalDialog.hide();"
						action="#{specificationBackingBean.cancelSpecAction('BO')}" />
					<p:commandButton value="#{lbl['lbl.btn.no']}"
						onclick="createTechnicalDialog.hide();" type="button" />
				</div>
			</p:dialog>

		</p:panel>

		<ac:templateSpec
			newable="#{specificationBackingBean.managedBean.specNewable}"
			templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}"
			editable="#{specificationBackingBean.managedBean.taskName ne 'Specification Approval'}" />





	</ui:define>


</ui:composition>
