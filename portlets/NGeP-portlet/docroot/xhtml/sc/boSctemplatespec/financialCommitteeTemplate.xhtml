<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="committeeFinancialmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
			<ui:param name="isReadOnlyOrSpecMain"
			value="#{!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()}" />

		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right">
					<p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> 

					<p:commandButton
						value="#{lbl['lbl.btn.print']}" process="@all" type="button">
						<p:printer target="financialComitteeTemp" />
					</p:commandButton>

					<!-- 8979, 30917, 31151 -start- --><!-- 1873 note 74 -start- -->
					<!-- #36678 -start- -->
					<p:commandButton value="#{lbl['lbl.btn.complete']}"
						rendered="#{!specificationBackingBean.managedBean.readOnly 
							or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() 
							and specificationBackingBean.managedBean.readOnly)}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.completeTemplateSpecDetails('SC',2)}">
						<p:ajax event="click"
							listener="#{specificationBackingBean.setProcurementMode(scQt, 'Y')}">
						</p:ajax>
						<!-- #36678 add ajax -end- -->
					</p:commandButton>

					<p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{!specificationBackingBean.managedBean.readOnly 
							or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() 
							and specificationBackingBean.managedBean.readOnly)}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveTemplateSpecDetails('SC',2)}" />
					<!-- 1873 note 74 -end- --><!-- 8979, 30917, 31151 -end- -->

				</td>
			</tr>
		</table>

		<h:panelGroup id="financialComitteeTemp">
			<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">

				<table>
					<tr>
						<td valign="top"><h:outputLabel
								value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
						<td colspan="3"><p:inputTextarea rows="2" cols="95"
								disabled="true" style="margin-bottom:5px;width:85%;"
								maxlength="200"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" /></td>
					</tr>
					<tr>
						<td style="width: 10%"><h:outputLabel
								value="#{lbl['lbl.sc.item.type']}" /></td>
						<td><p:inputText
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}"
								disabled="true" size="30" /></td>
						<td><h:outputLabel
								value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

					</tr>
					<tr>

						<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode)}"></p:inputText></td>
					</tr>

					<tr>

						<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
						<!-- 	<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
					<td><p:inputText
							value="#{lbl[specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.weightageReq ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
							disabled="true" readonly="true">
						</p:inputText></td> -->
					</tr>
				</table>
			</p:panel>

			<!-- 8979, 30917, 31151 -start- --><!-- 1873 note 74 -start- -->
			<ac:templateSpec
				editable="#{!specificationBackingBean.managedBean.readOnly 
					or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() 
					and specificationBackingBean.managedBean.readOnly)}"
				templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}"
				title="#{lbl['lbl.sc.spec.financial.title']}" />
			<!-- 1873 note 74 -end- --><!-- 8979, 30917, 31151 -end- -->

		</h:panelGroup>

		<!-- Bug#36678 related to #35061 DISPLAY POP UP IF BELOW 50k -start- -->
		<p:confirmDialog id="proceedBelowQtValueId"
			widgetVar="proceedBelowQtValueDlgs"
			header="#{lbl['lbl.sc.confirmation']}"
			message="#{qTDetailBB.managedBean.msgConfirmBelowIndi}"
			resizable="false" closable="false">
			<div align="right">
				<p:commandButton id="conf20k" value="#{lbl['lbl.btn.yes']}"
					action="#{specificationBackingBean.redirectSpecComMainYes()}"
					oncomplete="proceedBelowQtValueDlgs.hide()" update="@form"
					process="@this" />
				<p:commandButton id="decline20k" value="#{lbl['lbl.btn.no']}"
					action="#{specificationBackingBean.redirectSpecComMainNo()}"
					oncomplete="proceedBelowQtValueDlgs.hide()" process="@this"
					update="@form" />
			</div>
		</p:confirmDialog>
		<!-- #36678 related to #35061 END -->
	</ui:define>
</ui:composition>
