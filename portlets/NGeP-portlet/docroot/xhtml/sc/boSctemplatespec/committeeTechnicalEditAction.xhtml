<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<script type="text/javascript">
			function test() {
				location.reload();
			}
		
			$(document).ready(function() {
			    $('.ui-fileupload.ui-widget .fileupload-content.ui-widget-content.ui-corner-bottom').removeClass('fileupload-content ui-widget-content ui-corner-bottom');
			});
			
			
			$(document).ready(function() {
			    $('table .files').removeClass('files');
			});
			
		</script>


		<style type="text/css">


.fileupload-buttonbar.ui-widget-header.ui-corner-top {
	padding: 0.2em 0.4em;
	border: 0px solid;
	background: transparent;
}

.ui-button-icon-left.ui-icon.ui-c.ui-icon-plusthick {
	width: 0px;
	height: 0px;
	display: inline;
	background: none;
}

label>span.ui-button-text {
	vertical-align: middle;
	padding-top: 8px !important;
	padding-left: 18px !important;
	padding-right: 16px !important;
}

label.ui-button>span.ui-button-text {
	display: block !important;
}

</style>



	</ui:define>

	<ui:define name="contentSection">


		<ui:include src="/xhtml/common/uompopinclude.xhtml"></ui:include>
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="committeeTechmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
	
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> <p:commandButton
						value="#{lbl['lbl.btn.print']}" process="@all" type="button">
						<p:printer target="committeeTechEdit" />
					</p:commandButton> 
					<ui:remove><!-- 1873 note 74,97 update rendered condition--></ui:remove>
					<ui:remove>#33837 - start</ui:remove>
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						rendered="#{((!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly)) and not empty specificationBackingBean.managedBean.taskName) or (specMaintenanceBB.specCommitteeSecretaryAndSpecCommMaintPortlet and specificationBackingBean.managedBean.isChecklist())}"
						style="float:right;" immediate="true"
						onclick="createTechnicalDialog.show();"></p:commandButton> 
					<ui:remove>#33837 - end</ui:remove>
					<ui:remove><!-- 1873 note 74 update rendered condition--></ui:remove>
					<p:commandButton
						value="#{lbl['lbl.btn.complete']}"
						rendered="#{!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly)}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.completeTemplateSpecDetails('SC',1)}"
						update="@all" /> 
					<ui:remove><!-- 1873 note 74 update rendered condition--></ui:remove>
					<p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly)}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveTemplateSpecDetails('SC',1)}" />

				</td>
			</tr>
		</table>

		<h:panelGroup id="committeeTechEdit">
			<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">
				<ui:include src="/xhtml/sc/common/specGuideLineInstructions.xhtml"></ui:include>
				<ui:include src="/xhtml/common/uominstruction.xhtml"></ui:include>

				<table>
					<tr>
						<td valign="top"><h:outputLabel
								value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
						<td colspan="3">
						<ui:remove><!-- 1873 note 74 update disabled condition--></ui:remove>
						<p:inputTextarea rows="2" cols="95"
								disabled="#{!(!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly))}"
								style="margin-bottom:5px;width:83%;" maxlength="200"
								onkeyup="limitTextArea(this,200);"
								onkeydown="limitTextArea(this,200);"
								onmouseout="limitTextArea(this,200);"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}"> <!-- 24112022@syazani - Bug #33249 - Start -->
								<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{specificationBackingBean.specTitleChange}" />
								</p:inputTextarea></td> <!-- 24112022@syazani - Bug #33249 - End -->
					</tr>

					<tr>
						<td style="width: 10%"><h:outputLabel
								value="#{lbl['lbl.sc.item.type']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}" /></td>
						<td><h:outputLabel
								value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

					</tr>

					<tr>

						<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
						<td>
						<ui:remove><!-- 1873 note 74 update disabled condition--></ui:remove>
						<p:selectOneRadio
								disabled="#{!(!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly))}"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode.parameterId}">
								<f:selectItems
									value="#{specificationBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
								<p:ajax event="change" partialSubmit="true" process="@this" />
							</p:selectOneRadio></td>
					</tr>

					<tr>

						<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
						<td><h:outputLabel
								value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
						<td>
							<table>
								<tr>
								<!-- #farid #21695 disable start -->
								<ui:remove><!-- 1873 note 74 update disabled condition--></ui:remove>
									<td><p:selectOneRadio 
									disabled="#{specificationBackingBean.managedBean.specItemWeightageRequired and specificationBackingBean.managedBean.readOnly or !(!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly))}"
											value="#{specificationBackingBean.managedBean.templateSpecBean.specMaster.weightageReq}">
											<f:selectItems
												value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.itemWeightage)}" />


											<p:ajax event="change" partialSubmit="true" process="@this"
												listener="#{templateSpecBackingBean.updateItemWeightageReq(specificationBackingBean.managedBean.templateSpecBean)}" />

										</p:selectOneRadio></td>	<!-- #farid #21695 disable end -->	
									<td style="margin-top: -3px"><ac:iconTooltip
											value="#{lbl['lbl.sc.spec.item.weightage.tooltip']}" /></td>
								</tr>
							</table>
						</td>
					</tr>

				</table>

				<p:dialog id="specCommitteeEditTechnicalDialog"
					widgetVar="createTechnicalDialog"
					header="#{lbl['lbl.sc.cancel.confirm']}" resizable="false"
					width="550" height="75" closable="false">
					<table>
						<tr>
							<td align="center"><h:graphicImage
									value="/css/images/design/exclamation.png" /> <p:outputLabel
									value="#{lbl['lbl.sc.dialog.confirm.template.spec.cancel']}" /></td>
						</tr>
					</table>
					<p:spacer height="1" />
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" immediate="true"
							oncomplete="createTechnicalDialog.hide();"
							action="#{specificationBackingBean.cancelSpecAction('SC')}" />
						<p:commandButton value="#{lbl['lbl.btn.no']}"
							onclick="createTechnicalDialog.hide();" type="button" />
					</div>
				</p:dialog>

				
			<ui:remove><!-- 1873 note 74 update editable condition--></ui:remove>
 			<ac:templateSpec
					updateSpec="#{specificationBackingBean.managedBean.updateSpec}"
					newable="#{specificationBackingBean.managedBean.specNewable}"
					removable="#{specificationBackingBean.managedBean.specNewable}"
					editable="#{!specificationBackingBean.managedBean.readOnly or (specificationBackingBean.isMemberChairpersonSpecPreparationTask() and specificationBackingBean.managedBean.readOnly)}"
					templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}" /> 	

			</p:panel>



		</h:panelGroup>
	</ui:define>

</ui:composition>
