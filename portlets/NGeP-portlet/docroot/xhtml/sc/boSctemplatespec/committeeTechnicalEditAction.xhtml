<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
	<ui:include src="/xhtml/common/uompopinclude.xhtml"></ui:include>
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="committeeTechmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{specificationBackingBean.committeeBackAction}" /> <p:commandButton
						value="#{lbl['lbl.btn.print']}" process="@all" type="button">
						<p:printer target="committeeTechEdit" />
					</p:commandButton>
					<!-- 30917, 31151 -start- -->
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						rendered="#{((specificationBackingBean.isQTStatusChecklistScoring()) or(specificationBackingBean.isQTStatusChecklistScoringRevision()))}"
						style="float:right;" immediate="true"
						onclick="createTechnicalDialog.show();">
					</p:commandButton> 
					<p:commandButton
						value="#{lbl['lbl.btn.complete']}"
						rendered="#{((specificationBackingBean.isQTStatusChecklistScoring()) 
							or(specificationBackingBean.isQTStatusChecklistScoringRevision()) 
							or(specificationBackingBean.isQTStatusChecklistScoringRevision()) 
							or(!specificationBackingBean.managedBean.readOnly 
							and specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()))}"
						style="float:right;" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.completeTemplateSpecDetails('SC',1)}"
						update="@all" /> 
					<p:commandButton value="#{lbl['lbl.btn.save']}"
						rendered="#{((specificationBackingBean.isQTStatusChecklistScoring()) 
							or(specificationBackingBean.isQTStatusChecklistScoringRevision()) 
							or(!specificationBackingBean.managedBean.readOnly 
							and specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance()))}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{specificationBackingBean.saveTemplateSpecDetails('SC',1)}" />
					<!-- 30917, 31151 -end- -->
				</td>
			</tr>
		</table>

		<h:panelGroup id="committeeTechEdit">
			<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">
			 <ui:include src="/xhtml/sc/common/specGuideLineInstructions.xhtml"></ui:include>
			  <ui:include src="/xhtml/common/uominstruction.xhtml"></ui:include>
			
				<table>
					<tr>
						<td valign="top"><h:outputLabel
								value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
						<td colspan="3">
							<!-- 30917, 31151 -start- -->
							<p:inputTextarea rows="2" cols="95"
								disabled="#{(!specificationBackingBean.isQTStatusChecklistScoringRevision() and !specificationBackingBean.isQTStatusChecklistScoring())}"
								style="margin-bottom:5px;width:83%;" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);"
								onmouseout="limitTextArea(this,200);"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" />
							<!-- 30917, 31151 -end- -->
						</td>
					</tr>

					<tr>
						<td style="width: 10%"><h:outputLabel
								value="#{lbl['lbl.sc.item.type']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}" /></td>
						<td><h:outputLabel
								value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

					</tr>

					<tr>

						<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
						<td>
							<!-- 30917, 31151 -start- -->
							<p:selectOneRadio
								disabled="#{(!specificationBackingBean.isQTStatusChecklistScoringRevision() and !specificationBackingBean.isQTStatusChecklistScoring())}"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode.parameterId}">
							<!-- 30917, 31151 -end- -->
								<f:selectItems
									value="#{specificationBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
								<p:ajax event="change" partialSubmit="true" process="@this" />
							</p:selectOneRadio></td>
					</tr>

					<tr>

						<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
						<td><p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
						<td><h:outputLabel
								value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
						<td>
							<table>
								<tr>
									<td><p:selectOneRadio disabled="true"
											value="#{specificationBackingBean.managedBean.templateSpecBean.specMaster.weightageReq}">
											<f:selectItems
												value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.itemWeightage)}" />


											<p:ajax event="change" partialSubmit="true" process="@this"
												listener="#{templateSpecBackingBean.updateItemWeightageReq(specificationBackingBean.managedBean.templateSpecBean)}" />

										</p:selectOneRadio></td>
									<td style="margin-top: -3px"><ac:iconTooltip
											value="#{lbl['lbl.sc.spec.item.weightage.tooltip']}" /></td>
								</tr>
							</table>
						</td>
					</tr>

				</table>

				<p:dialog id="specCommitteeEditTechnicalDialog"
					widgetVar="createTechnicalDialog"
					header="#{lbl['lbl.sc.cancel.confirm']}" resizable="false"
					width="550" height="75" closable="false">
					<table>
						<tr>
							<td align="center"><h:graphicImage
									value="/css/images/design/exclamation.png" /> <p:outputLabel
									value="#{lbl['lbl.sc.dialog.confirm.template.spec.cancel']}" /></td>
						</tr>
					</table>
					<p:spacer height="1" />
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" immediate="true"
							oncomplete="createTechnicalDialog.hide();"
							action="#{specificationBackingBean.cancelSpecAction('SC')}" />
						<p:commandButton value="#{lbl['lbl.btn.no']}"
							onclick="createTechnicalDialog.hide();" type="button" />
					</div>
				</p:dialog>

			</p:panel>

			<ui:remove>30917, 31151 remove '!specificationBackingBean.managedBean.readOnly and' -start-</ui:remove>
			<ac:templateSpec
			    updateSpec="#{specificationBackingBean.managedBean.updateSpec}"
				newable="#{specificationBackingBean.managedBean.specNewable}"
				removable="#{specificationBackingBean.managedBean.specNewable}"
				editable="#{((specificationBackingBean.isQTStatusChecklistScoring()) 
					or (specificationBackingBean.isQTStatusChecklistScoringRevision()) 
					or (specificationBackingBean.managedBean.specMaintenanceScreen eq specificationBackingBean.getSpecMaintenance() and !specificationBackingBean.managedBean.readOnly))}"
				templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}" />
			<ui:remove>30917, 31151 remove '!specificationBackingBean.managedBean.readOnly and' -end-</ui:remove>

		</h:panelGroup>
	</ui:define>

</ui:composition>
