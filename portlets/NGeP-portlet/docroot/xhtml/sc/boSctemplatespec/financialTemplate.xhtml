<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="boFinancialmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				immediate="true" styleClass="BtnSpacing"
				action="#{specificationBackingBean.businessOwnerTemplateSpecBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				styleClass="BtnSpacing" style="float:right;" update="@all"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
				action="#{specificationBackingBean.completeTemplateSpecDetails('BO',2)}" />


			<p:commandButton value="#{lbl['lbl.btn.save']}" style="float:right;"
				styleClass="BtnSpacing" update="@all" onstart="blockWidget.show();"
				oncomplete="blockWidget.hide();"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
				action="#{specificationBackingBean.saveTemplateSpecDetails('BO',2)}" />


		</div>


		<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">


			<table>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							disabled="true" maxlength="200"
							style="margin-bottom:5px;width:85%;"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" /></td>
				</tr>
				<tr>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.sc.item.type']}" /></td>
					<td><p:inputText
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}"
							disabled="true" size="30" /></td>
					<td><h:outputLabel
							value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

				</tr>
				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode)}"></p:inputText></td>
				</tr>


				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
					<!-- 	<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
					<td><p:inputText value="#{lbl[specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.weightageReq ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
							
							disabled="true" readonly="true">
						</p:inputText></td> -->
				</tr>
			</table>



		</p:panel>


		<ac:templateSpec
			editable="#{specificationBackingBean.managedBean.taskName ne 'Specification Approval'}"
			templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}"
			title="#{lbl['lbl.sc.spec.financial.title']}" />





	</ui:define>


</ui:composition>
