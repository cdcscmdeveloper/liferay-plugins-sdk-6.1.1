<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style>
      .dashboarTable {
             color: #000 !important;
             font-family: Arial,Helvetica,sans-serif;
              font-size: 12px;
              border-color: #ddd;
              border-width:1px;
              padding-left: 5px;
              border-style:solid;
      }
      
     .tableWidth80{
          width:80%;
     }
     
      .tableWidth20{
          width:20%;
          text-align: center;
     }
    
    
    </style>

	<table style="width: 100%">
	<tr>
			<td class="tableWidth80 dashboarTable"><p:outputLabel value="#{lbl['lbl.sc.quotation']}" style="float:left;"></p:outputLabel></td>
			<td class=" tableWidth20 dashboarTable"><h:outputText  value="#{pendingResponseDpQtBB.managedBean.quotationCount}"></h:outputText></td>
		</tr>
		<tr>
			<td class="tableWidth80 dashboarTable"><p:outputLabel value="#{lbl['lbl.sc.tender']}" style="float:left;"></p:outputLabel></td>
			<td class=" tableWidth20 dashboarTable"><h:outputText value="#{pendingResponseDpQtBB.managedBean.tenderCount}"></h:outputText></td>
		</tr>
		<tr>
			<td class="tableWidth80 dashboarTable"><p:outputLabel value="#{lbl['lbl.sc.qt.briefing.sv']}" style="float:left;"></p:outputLabel></td>
			<td class=" tableWidth20 dashboarTable"><h:outputText value="#{pendingResponseDpQtBB.managedBean.briefingSiteVisitCount}"></h:outputText></td>
		</tr>
		<tr>
			<td class="tableWidth80 dashboarTable"><p:outputLabel value="#{lbl['lbl.sc.bidding']}" style="float:left;"></p:outputLabel></td>
			<td class=" tableWidth20 dashboarTable"><h:outputText value="#{pendingResponseDpQtBB.managedBean.biddingCount}"></h:outputText></td>
		</tr>
		<tr>
			<td class="tableWidth80 dashboarTable"><p:outputLabel value="#{lbl['lbl.ss.simple.quote.pending.response.redirect.dp.qt']}" style="float:left;"></p:outputLabel></td>
			<td class=" tableWidth20 dashboarTable"><h:outputText value="#{pendingResponseDpQtBB.managedBean.simpleQuoteCount}"></h:outputText></td>
		</tr>
		<tr>
		<td colspan="3"
					style="text-align: right; padding-right: 6%;" class="dashboarTable">
					<p:commandLink value="#{lbl['lbl.sc.more.details']}"
						styleClass="blue_font" process="@this" update="@form"
						action="#{pendingResponseDpQtBB.navigatetoSupplierredirect()}">
					</p:commandLink>
				</td>
		</tr>
	</table>
</ui:composition>
