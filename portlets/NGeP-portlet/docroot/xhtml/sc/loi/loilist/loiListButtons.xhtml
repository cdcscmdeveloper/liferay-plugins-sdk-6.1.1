<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<div class="ppRightBtn">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:commandButton value="#{lbl['lbl.btn.save']}"
			action="#{lOIDetailBackingBean.savetLoiListAction}" process="@form" 
			partialSubmit="true"
			update="@form"
			onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();"
			rendered="#{lOIDetailBackingBean.managedBean.docType != ParameterConst.doctypeMultipleLoi}" />
		
		<p:commandButton value="#{lbl['lbl.btn.submit']}"
			action="#{lOIDetailBackingBean.submitLoiListAction}" process="@form"
			partialSubmit="true"
			update="@form"
			onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();"
			disabled="#{lOIDetailBackingBean.managedBean.loiRequired}"
			rendered="#{lOIDetailBackingBean.managedBean.docType != ParameterConst.doctypeMultipleLoi}" />
	</div>
</ui:composition>
