<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<div class="ppRightBtn">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		 <p:commandButton immediate="true" value="#{lbl['lbl.btn.back']}"
				rendered="#{!empty lOIDetailBackingBean.managedBean.backToPreviousPage}"
				style="float:left;" action="#{lOIDetailBackingBean.backToPrevious}" />
		
		<p:commandButton value="#{lbl['lbl.btn.save']}"
			action="#{lOIDetailBackingBean.savetLoiListAction}" process="@form" 
			partialSubmit="true"
			update="@form"
			onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();"
			rendered="#{!isMultipleLoi and !readOnly}" />
		
		<p:commandButton value="#{lbl['lbl.btn.submit']}"
			action="#{lOIDetailBackingBean.submitLoiListAction}" process="@form"
			partialSubmit="true"
			update="@form"
			onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();"
			rendered="#{!readOnly and (!isMultipleLoi and lOIDetailBackingBean.managedBean.loiRequired)}" />
	</div>
</ui:composition>
