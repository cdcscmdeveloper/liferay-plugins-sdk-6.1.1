<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="isZonal" value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.zonal}" />
	
	<p:dialog id="ItemDetailsPopup" widgetVar="ItemDetailsPopup" dynamic="true"
		modal="true" header="Item Details" width="690" height="300"
		resizable="true">
		<h:panelGroup>
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
					<td><p:inputText disabled="true" size="60"
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.smSupplier.companyName}" /></td>
				</tr>

			</table>
		</h:panelGroup>

		<h:panelGroup>
			<p:spacer height="15px" />
			<p:dataTable id="itemDtl" var="loiloaItem"
				value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
				rowKey="#{itemPrice}" rowIndexVar="index">

				<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}">
					<p:commandLink id="zoneName"
						oncomplete="zoneLocPopup.show();"
						partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
						
						<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{loiLoaItem.tplSpecZoneDtl}" />
						
						<h:outputText value="#{loiLoaItem.tplSpecZoneDtl.zoneName}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.item']}" style="width:10%">
					#{loiloaItem.scRequestItem.itemName}
				</p:column>
					
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
				</p:column>
	
				<p:column style="width:8%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
				</p:column>
	
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.duration.month']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.quantity']}" style="width:10%; text-align:right;">
					<h:outputText value="#{loiloaItem.qty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.uom']}"
					style="width:20%">
					#{loiloaItem.scRequestItem.uom.uomName}
				</p:column>

			</p:dataTable>
		</h:panelGroup>
		<p:spacer height="3px" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.sc.close']}"
				onclick="ItemDetailsPopup.hide()" />
		</div>
	</p:dialog>
</ui:composition>
