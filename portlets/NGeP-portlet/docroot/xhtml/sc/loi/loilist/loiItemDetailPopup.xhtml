<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="isZonal" value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.zonal}" />
	
	<p:dialog id="ItemDetailsPopup" widgetVar="ItemDetailsPopup" dynamic="true"
		modal="true" header="#{lbl['lbl.sc.item.details']}" width="690"
		resizable="true">
		<h:panelGroup>
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
					<td><p:inputText disabled="true" size="60"
							value="#{lOIDetailBackingBean.managedBean.selectedLoiLoaBean.supplierName}" /></td>
				</tr>
			</table>
		</h:panelGroup>

		<h:panelGroup>
			<p:dataTable id="itemDtl" var="loiLoaItem"  styleClass="BtnSpacing"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{lOIDetailBackingBean.managedBean.selectedLoiLoaBean.scLoiLoaItems}"
				rowKey="#{itemPrice}" rowIndexVar="index">

				<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}">
					#{loiLoaItem.tplSpecZoneDtl.zoneName}
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.item']}" style="width:10%">
					#{loiLoaItem.scRequestItem.itemName}
				</p:column>
					
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
	
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
				</p:column>
	
				<p:column style="width:8%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
				</p:column>
	
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.duration.month']}">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.quantity']}" style="width:10%; text-align:right;">
					<h:panelGroup rendered="#{!empty loiLoaItem.tplSpecTierQty}">
						<h:outputText value="#{loiLoaItem.tplSpecTierQty.fromQty}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
						</h:outputText>
						<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{empty loiLoaItem.tplSpecTierQty.toQty}" />
						<h:outputText value=" - " rendered="#{!empty loiLoaItem.tplSpecTierQty.toQty}" />
						<h:outputText value="#{loiLoaItem.tplSpecTierQty.toQty}" rendered="#{!empty loiLoaItem.tplSpecTierQty.toQty}">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
						</h:outputText>
					</h:panelGroup>
					<h:outputText value="#{loiLoaItem.qty}"
						rendered="#{loiLoaItem.tplSpecTierQty eq null}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
					</h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.uom']}"
					style="width:20%">
					#{loiLoaItem.scRequestItem.uom.uomName}
				</p:column>

			</p:dataTable>
		</h:panelGroup>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.sc.close']}"
				onclick="ItemDetailsPopup.hide()" />
		</div>
	</p:dialog>
</ui:composition>
