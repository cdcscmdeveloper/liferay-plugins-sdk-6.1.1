<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<p:messages id="loiMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<ui:include src="loiListButtons.xhtml" />

		<ui:include src="/xhtml/sc/loi/loiListHeader.xhtml" />

		<p:panel header="#{lbl['lbl.sc.loiloa.recom.supp.list']}"
			toggleable="true">
			<table>
				<tr>
					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.award.type']}" /></td>
					<td><p:inputText disabled="true"
							value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.recommendType,
					lOIDetailBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode)}" /></td>
				</tr>

				<tr>
					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.loi.rec.by']}" /></td>
					<td><p:inputText disabled="true"
							value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.documentTypes,
					lOIDetailBackingBean.managedBean.docType)}" /></td>
				</tr>
			</table>

			<p:spacer height="20px"></p:spacer>

			<p:dataTable id="loiLoaDtl" var="loiLoa" style="width:60%"
				value="#{lOIDetailBackingBean.managedBean.recSupplierList}"
				selection="#{lOIDetailBackingBean.managedBean.selectedLoiLoa}"
				selectionMode="single" rowKey="#{loiLoa}" rows="10"
				rowIndexVar="rowIndex">

				<p:ajax event="rowSelect"
					listener="#{lOIDetailBackingBean.onRowRecSupplierAction}"
					update=":form:loiLoaId" />

				<p:column headerText="#{lbl['lbl.sc.loiloa.supp.name']}"
					style="width:40%">
					<h:outputText value="#{loiLoa.smSupplier.companyName}" />
				</p:column>

	            <p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:20%">
					<p:commandButton icon="ui-icon-add" value="Create LOI" rendered="#{empty loiLoa.scLois}" 
						actionListener="#{lOIDetailBackingBean.createLOI(loiLoa)}" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="lOI/LOA LIST" toggleable="true">

			<p:dataTable id="loiLoaId" var="loiloaBean" style="width:70%"
				value="#{lOIDetailBackingBean.managedBean.loiLoaBeans}"
				rowIndexVar="rowIndex">

				<p:column headerText="lOI/LOA No" style="width:20%">
					<h:outputText value="#{loiloaBean.scLoi.loiNo}"
						rendered="#{loiloaBean.scLoi ne null}" />
					<h:outputText value="#{loiloaBean.scLoa.loaNo}"
						rendered="#{loiloaBean.scLoa ne null}" />
				</p:column>

				<p:column headerText="Type" style="width:10%">
					<h:outputText value="#{loiloaBean.loiLoaType}" />
				</p:column>

				<p:column headerText="Item" style="width:10%">
					<p:commandButton icon="ui-icon-evaluate" value="view"
						partialSubmit="true" process="@this"
						action="#{lOIDetailBackingBean.viewItemDetails(loiloaBean)}"
						update=":form:ItemDetailsPopup"
						oncomplete="ItemDetailsPopup.show();">
					</p:commandButton>
				</p:column>

				<p:column headerText="Status" style="width:15%">
					<h:outputText value="#{loiloaBean.loiLoaStatus}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:10%">
					<p:commandLink actionListener="#{lOIDetailBackingBean.editLOI(loiloaBean.scLoi)}">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>

		</p:panel>
		<ui:include src="loiItemDetailPopup.xhtml" />

	</ui:define>
</ui:composition>
