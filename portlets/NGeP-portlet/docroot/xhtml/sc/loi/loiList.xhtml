<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<p:messages id="loiMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<ui:include src="loiListButtons.xhtml" />
		
		<ui:include src="/xhtml/sc/loi/loiListHeader.xhtml" />

		<p:panel header="#{lbl['lbl.sc.loiloa.recom.supp.list']}"
			toggleable="true">
			<table>
				<tr>
					<td style="width: 250px;"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.award.type']}" /></td>
					<td><p:inputText disabled="true"
							value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.recommendType,
					lOIDetailBackingBean.managedBean.scQtFinalization.recommendedTypeId.parameterCode)}" /></td>
				</tr>

				<tr>
					<td style="width: 250px;"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.loi.rec.by']}" /></td>
					<td><p:inputText disabled="true"
							value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.recommendType,
					lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.recommendTypeCode.parameterCode)}" /></td>
				</tr>
			</table>

			<p:spacer height="20px"></p:spacer>

			<p:dataTable id="loiLoaDtl" var="loiLoa"
				value="#{lOIDetailBackingBean.managedBean.recSupplierList}"
				rows="10" rowIndexVar="rowIndex">

				<p:column headerText="#{lbl['lbl.sc.loiloa.supp.name']}"
					style="width:40%">
					<h:outputText value="#{loiLoa.smSupplier.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:20%">
					<p:commandButton icon="ui-icon-add" value="Create LOI"
						action="#{lOIDetailBackingBean.createLOI}" />
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:panel header="lOI/LOA LIST" toggleable="true">
			<c:set var="LoaLoi"
				value="#{lOIDetailBackingBean.managedBean.loiLoas.get(0)}"></c:set>
			<p:dataTable id="loiId" var="loi" value="#{LoaLoi.scLois}" rows="10"
				rowIndexVar="rowIndex">

				<p:column headerText="lOI/LOA No" style="width:40%">
					<h:outputText value="#{loi.loiNo}" />
				</p:column>

				<p:column headerText="Type" style="width:40%">
					<h:outputText value="#{loi.loiNo}" />
				</p:column>

				<p:column headerText="Item" style="width:40%">
					<p:commandLink partialSubmit="true" process="@this"
						action="#{lOIDetailBackingBean.viewItemDetails(loi)}"
						update=":form:ItemDetailsPopup"
						oncomplete="ItemDetailsPopup.show();">

						<p:graphicImage value="/resources/ep/images/design/document.png"
							height="15px" width="15px" />
					</p:commandLink>
				</p:column>

				<p:column headerText="Status" style="width:40%">
					<h:outputText value="#{loi.loiId}" />
				</p:column>


				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:20%">
					<p:commandButton icon="ui-icon-edit"
						style="background-color:transparent !important; border:0px none; width:10px; height:10px !important;" />
				</p:column>

			</p:dataTable>

		</p:panel>
		<ui:include src="loiItemDetailPopup.xhtml" />

	</ui:define>
</ui:composition>
