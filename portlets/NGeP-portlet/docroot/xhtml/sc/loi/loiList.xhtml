<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	 <p:messages id="loiMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
	 <ui:include src="/xhtml/sc/loi/loiButtons.xhtml" />
     <ui:include src="/xhtml/sc/loi/loiHeader.xhtml" />
     
	<p:panel header="#{lbl['lbl.sc.loiloa.recom.supp.list']}"
			toggleable="false">
	
	   	<table>
				<tr>
				<td colspan="2"><p:outputPanel id="ptjId">
					<table style="width:100%">
					 <tr>
	 				  <ui:fragment rendered="#{lOIDetailBackingBean.managedBean.selectedPtj.brandNew}">
	 				        <td style="width: 250px;">
							   <p:outputLabel value="PTJ Name" />
							    <p:outputLabel value="*" styleClass="mandatory" /></td>
							 <td> <p:selectOneMenu  label="#{lbl['lbl.sc.price.inquiry.ptj.name']}" id="ptjName" required="true"
							     value="#{lOIDetailBackingBean.managedBean.orgProfileId}"
							     styleClass="divisionclass" style="width: 250px;margin-bottom: 5px;">
							  <f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
							  <f:selectItems 
								   value="#{lOIDetailBackingBean.managedBean.ptjList}"
								   var="pmOrgProfile"
								   itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
								   itemValue="#{pmOrgProfile.orgProfileId}" />
								 <p:ajax event="change"   partialSubmit="true" update="@([id$=loiHeader])"
								     process="@this"  listener="#{lOIDetailBackingBean.ptjNameEvent}"/>
						</p:selectOneMenu></td>
						<td> <p:message id="ptjNameMsg" for="ptjName" display="icon" /> </td>
				    	</ui:fragment>
					</tr>
					</table>
				   </p:outputPanel></td>
				</tr>
				<tr>
					<td style="width: 250px;"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.award.type']}" /></td>
					<td><p:inputText disabled="true"
							value="M" /></td>
				</tr>
				<tr>
					<td style="width: 250px;"><p:outputLabel
							value="Recommended By" /></td>
					<td><p:inputText disabled="true"
							value="#{lOIDetailBackingBean.managedBean.recommend.recommendBy.parameterCode}" /></td>
				</tr>
	      </table>


			<p:spacer height="20px"></p:spacer>

			<p:dataTable id="recommendDtlId" var="recommendDtl"
				value="#{lOIDetailBackingBean.managedBean.scQtRecommendDtls}"
				rows="10" rowIndexVar="rowIndex">

				<p:column headerText="#{lbl['lbl.sc.loiloa.supp.name']}"
					style="width:40%">
					<h:outputText value="#{recommendDtl.supplier.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:20%">
					<p:commandButton icon="ui-icon-add" value="Create LOI" 
						action="#{lOIDetailBackingBean.createLOI}" />
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:panel header="lOI/LOA LIST" toggleable="false">
			<c:set var="LoaLoi"
				value="#{lOIDetailBackingBean.managedBean.loiLoas.get(0)}"></c:set>
			<p:dataTable id="loiId" var="loi" value="#{LoaLoi.scLois}" rows="10"
				rowIndexVar="rowIndex">

				<p:column headerText="lOI/LOA No" style="width:40%">
					<h:outputText value="#{loi.loiNo}" />
				</p:column>

				<p:column headerText="Type" style="width:40%">
					<h:outputText value="#{loi.loiNo}" />
				</p:column>

				<p:column headerText="Item" style="width:40%">
					<p:commandLink partialSubmit="true" process="@this" 
						update=":form:ItemDetailsPopup" 
						oncomplete="ItemDetailsPopup.show();">

						<p:graphicImage value="/resources/ep/images/design/document.png"
							height="15px" width="15px" />
					</p:commandLink>
				</p:column>

				<p:column headerText="Status" style="width:40%">
					<h:outputText value="#{loi.loiNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:20%">
					<p:commandButton icon="ui-icon-edit"
						style="background-color:transparent !important; border:0px none; width:10px; height:10px !important;" />
				</p:column>

			</p:dataTable>

		</p:panel>
          <ui:include src="loiItemDetailPopup.xhtml" />

	</ui:define>
</ui:composition>
