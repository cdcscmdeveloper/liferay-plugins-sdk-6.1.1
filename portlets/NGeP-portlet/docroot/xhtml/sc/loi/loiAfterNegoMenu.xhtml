<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:include src="loiNegotiationDetailsMenu.xhtml" />
	<p:panel header="#{lbl['lbl.sc.supporting.document']}" toggleable="false">
		<p:dataTable id="suppDocTbl" var="scLoiSuppDoc"  rows="10"
			widgetVar="suppDocTblWidget"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiSupportingDocs}"
			rows="10" rowKey="#{scLoiSuppDoc}"
			selection="#{lOIDetailBackingBean.managedBean.selectedScLoiSuppDoc}">
			
			<ac:paginator for="suppDocTbl" />

			<p:column selectionMode="multiple" style="width:2%"/>

			<p:column headerText="#{lbl['lbl.sc.title']}">
				<h:inputText style="width:96%" value="#{scLoiSuppDoc.title}"/>
			</p:column>


			<p:column style="width:15%;" headerText="#{lbl['lbl.sc.upload']}">
				<ui:fragment
					<h:outputText value="#{scLoiSuppDoc.scLoiSupportingDocAttachment.fileName}" />
					<p:commandButton oncomplete="loiAttachmentPopupDlg.show();"
						value="#{lbl['lbl.txt.attachment']}" icon="ui-icon-attachment"
						partialSubmit="true" process="@this"
						update="@([id$=loiAttachmentPopup])">
						<f:setPropertyActionListener
							target="#{lOIDetailBackingBean.managedBean.selectedScLoiSuppDoc}"
							value="#{scLoiSuppDoc}" />
					</p:commandButton>
				</ui:fragment>
			</p:column>
			
		</p:dataTable>
		
		<p:spacer height="2" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, suppDocTbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addLoiReportAction}"
				oncomplete="suppDocTblWidget.paginator.endLink.click();"
				update="reportContentsTbl" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, suppDocTbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.deleteRowsAction(lOIDetailBackingBean.managedBean.scLoi.scLoiSupportingDocs, lOIDetailBackingBean.managedBean.selectedScLoiSuppDoc)}"
				icon="ui-icon-delete" update="suppDocTbl" />
	</p:panel>
	
	
	<ui:include src="loiAwardDetailsMenu.xhtml" />
	

</ui:composition>
