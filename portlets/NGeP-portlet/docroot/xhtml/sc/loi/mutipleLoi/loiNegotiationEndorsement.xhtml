<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	
	<p:panel header="#{lbl['lbl.sc.recommendation']}" toggleable="true">
		<p:dataTable id="recommendTblPkg" var="supplierDtl"
			value="#{lOIDetailBackingBean.managedBean.recommendedSupplierList}"
			rows="10"
			selection="#{lOIDetailBackingBean.managedBean.selectedSupplier}"
			rowKey="#{supplierDtl}" rowIndexVar="rowIndex"
			rendered="#{!lOIDetailBackingBean.managedBean.itemized}">

			<p:ajax event="rowSelectRadio" partialSubmit="true" process="@this"
				update="@this" 
				listener="#{lOIDetailBackingBean.awardSelectedSupplierAction()}"/>
			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update="@this" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update="@this" />
			<p:ajax event="toggleSelect" partialSubmit="true" process="@this"
				update="@this" />

			<ac:paginator for="recommendTblPkg" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.recommended.supplier']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.recommended.supplier.tooltip']}" />
				</f:facet>
				<p:commandLink update="@([id$=suppDtlPopUp])"
					oncomplete="suppDtlWidgetVar.show();">
					<f:setPropertyActionListener value="#{supplierDtl.supplier}"
						target="#{suppFinalizationBackingBean.managedBean.smSupplier}" />
					<h:outputText
						value="#{supplierDtl.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.companyName}" 
						style="white-space:normal;"/>
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<h:outputText
					value="#{supplierDtl.qtEvaluationResult.scQtProposal.supplierNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText
					value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
										  		fn:toUpperCase(supplierDtl.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.offered.price']}"
				style="text-align: right;">
				<h:outputText value="#{supplierDtl.proposalAmount.proposalAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}"
				style="text-align: right;">
				<h:outputText value="#{supplierDtl.totalScore}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(
													CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.ranking']}"
				style="text-align: right;">
				<h:outputText value="#{supplierDtl.evalRank}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(
													CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mof.status']}">
				<h:outputText value="#{lbl['lbl.pm.status.active']}"
					rendered="#{!empty supplierDtl.smMofAccount and 
							supplierDtl.smMofAccount.recordStatusFlg eq DbValueConst.recordStatusActive}" />
			</p:column>

			<p:column selectionMode="single" style="width:2%" disabledSelection="true" />
		</p:dataTable>

		<p:dataTable id="recommendTbl" var="item"
			value="#{lOIDetailBackingBean.managedBean.recommendList}" rows="10"
			selection="#{lOIDetailBackingBean.managedBean.selectedRecommendList}"
			rowKey="#{item.qtRecommendId}" rowIndexVar="rowIndex"
			rendered="#{lOIDetailBackingBean.managedBean.itemized}">

			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update="@this, :form:awardSupplier" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update="@this, :form:awardSupplier" />
			<p:ajax event="rowSelectCheckbox" partialSubmit="true"
				process="@this" update="@this, :form:awardSupplier" />
			<p:ajax event="rowUnselectCheckbox" partialSubmit="true"
				process="@this" update="@this, :form:awardSupplier" />
			<p:ajax event="toggleSelect" partialSubmit="true" process="@this"
				update="@this, :form:awardSupplier" />

			<ac:paginator for="recommendTbl" />

			<p:column headerText="#{lbl['lbl.sc.item']}"
				style="white-space: normal;">
				<h:outputText value="#{item.requestItem.itemName}" />
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.recommended.supplier']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.recommended.supplier.tooltip']}" />
				</f:facet>
				<p:dataList var="scQtRecommendDtl" value="#{item.recommendDtls}"
					type="none">
					<p:column rendered="#{scQtRecommendDtl.recordStatusFlg eq DbValueConst.recordStatusActive}">
						<p:commandLink update="@([id$=suppDtlPopUp])"
							oncomplete="suppDtlWidgetVar.show();">
							<f:setPropertyActionListener value="#{scQtRecommendDtl.supplier}"
								target="#{suppFinalizationBackingBean.managedBean.smSupplier}" />
							<h:outputText value="#{scQtRecommendDtl.supplier.companyName}" 
								style="white-space:normal;"/>
						</p:commandLink>
						<br />
					</p:column>
				</p:dataList> 				
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<ui:repeat var="scQtRecommendDtl" value="#{item.recommendDtls}">
					<h:outputText
						value="#{scQtRecommendDtl.scQtProposalAmount.scQtProposal.supplierNo}" 
						rendered="#{scQtRecommendDtl.recordStatusFlg eq DbValueConst.recordStatusActive}" />
					<br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<ui:repeat var="scQtRecommendDtl" value="#{item.recommendDtls}">
					<h:outputText value="#{lOIDetailBackingBean.getParameterDesc(
						ParameterTypeConst.yesNoFlag, 
						fn:toUpperCase(scQtRecommendDtl.scQtProposalAmount.scQtProposal.scQtSupplier.smSupplier.bumi))}" 
						rendered="#{scQtRecommendDtl.recordStatusFlg eq DbValueConst.recordStatusActive}" />
					<br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.type']}">
				<h:outputText
					value="#{lOIDetailBackingBean.getParameterDesc(item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.offered.price']}"
				style="text-align: right;">
				<ui:repeat var="evaluationResultDtl"
					value="#{item.awardSupplierList}">
					<h:outputText
						value="#{evaluationResultDtl.qtEvaluationResult.offeredPrice}" 
						rendered="#{evaluationResultDtl.awareded}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}"
				style="text-align: right;">
				<ui:repeat var="evaluationResultDtl" value="#{item.awardSupplierList}">
					<h:outputText value="#{evaluationResultDtl.totalScore}" 
						rendered="#{evaluationResultDtl.awareded}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
					<br />
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.ranking']}"
				style="text-align: right;">
				<ui:repeat var="evaluationResultDtl" value="#{item.awardSupplierList}">
					<h:outputText value="#{evaluationResultDtl.evalRank}" rendered="#{evaluationResultDtl.awareded}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
					<br />
				</ui:repeat>
			</p:column>

			<p:column style="text-align: right;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.quantity']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.sf.awarded.quantity.tooltip']}" />
				</f:facet>
				<h:panelGroup id="qtyPG">
					<ui:repeat var="scQtRecommendDtl" value="#{item.recommendDtls}" 
						rendered="#{item.recommendByStr == ParameterConst.recommendByMultipleAward 
										and scQtRecommendDtl.recordStatusFlg eq DbValueConst.recordStatusActive}">
						<p:column>
							<h:outputText value="#{scQtRecommendDtl.awardQty}" />
							<br />
						</p:column>
					</ui:repeat>

					<h:outputText value="#{item.requestItem.quantity}"
						rendered="#{(item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard ||
										item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeZonalStandard) 
									and item.recommendByStr != ParameterConst.recommendByMultipleAward}" />
				</h:panelGroup>
			</p:column>
			
		</p:dataTable>
				
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;">
					<p:outputLabel value="#{lbl['lbl.sc.remark']}" />
				</td>
				
				<td class="TableFieldRight">
					<p:dataGrid var="remarkVar" value="#{lOIDetailBackingBean.managedBean.scQtCommittee.qtCommitteRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<h:graphicImage height="30"
										value="#{lOIDetailBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" />
								</td>
								<td width="5"></td>
								<td>
									<h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText>
								</td>
							</tr>
							<tr>
								<td></td>
								<td>
									<p:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}"/> 
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
