<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="suppDtlPopUp" widgetVar="suppDtlWidgetVar"
		rposition="center" header="#{lbl['lbl.sc.companyinfo']}" modal="true"
		dynamic="true" styleClass="pop_up_top" width="1000" height="300"
		resizable="false">

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="18%"><p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
				</td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smSupplier.epNo}"
						readonly="true" /></td>
				<td width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td width="18%"><p:inputText size="30"
						style=" margin-bottom:5px;"
						value="#{lOIDetailBackingBean.managedBean.smSupplier.companyName}"
						readonly="true" /></td>
			</tr>
			<tr>
				<td width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.registration.type']}" /></td>
				<td><p:inputText size="30" value="" readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.registration.no']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{lOIDetailBackingBean.managedBean.smSupplier.regNo}"
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mof.no']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smMofAccount.mofNo}"
						readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.income.tax.ref.no']}" /></td>
				<td><p:inputText size="30" style="margin-bottom:5px;"
						value="#{lOIDetailBackingBean.managedBean.smCompanyBasic.incomeTaxNo}"
						readonly="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.establishment.date']}" />
				</td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smSupplier.establishDate}"
						readonly="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>

				<td><p:outputLabel value="#{lbl['lbl.sc.type.of.company']}" />
				</td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{lOIDetailBackingBean.getParameterDesc(
				SupplierManagementConst.supplierBusinessType,lOIDetailBackingBean.managedBean.smSupplier.businessType)}"
						readonly="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mof.expired.date']}" />
				</td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smMofAccount.expDate}"
						readonly="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.disciplinary.rating']}" />
				</td>
				<td><p:inputText size="30" style=" margin-bottom:5px;" value=""
						readonly="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.supplierBranch}"
						readonly="true" /></td>
				<td  style="vertical-align: top;"><p:outputLabel value="#{lbl['lbl.sc.address']}" /></td>
				<td><p:inputTextarea cols="30"
						value="#{lOIDetailBackingBean.managedBean.supplierAddress.address1}"
						style="margin-bottom:5px;width: 240px;" readonly="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
				</td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smPersonnel.name}"
						readonly="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.designation']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smPersonnel.designation}"
						readonly="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smPersonnel.email}"
						readonly="true" /></td>
			</tr>
		</table>
		<div class="ppRightBtn BtnSpacing" style="width: 100%">
			<p:commandButton value="#{lbl['lbl.btn.close']}"
				onclick="suppDtlWidgetVar.hide();" />
		</div>

	</p:dialog>

</ui:composition>
