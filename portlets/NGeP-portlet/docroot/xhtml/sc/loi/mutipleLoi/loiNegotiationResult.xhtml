<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.supplier.list']}" />
		</f:facet>
		<p:dataTable id="negoSuppList" var="scLoi"
			value="#{lOIDetailBackingBean.managedBean.lois}"
			selection="#{lOIDetailBackingBean.managedBean.scLoi}"
			selectionMode="single" rowKey="#{scLoi}">
			
			<p:ajax event="rowSelect" update=":form:negoTermPG" />

			<ac:paginator for="negoSuppList" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.loi.no']}">
				#{scLoi.loiNo}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				#{scLoi.scLoiLoa.supplierName}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item']}">
				<p:commandLink
					actionListener="#{lOIDetailBackingBean.showMultipleLOIItemDetails(scLoi)}"
					oncomplete="ItemDetailsPopup.show()" update=":form:ItemDetailsPopup"
					process="@this">
					<p:graphicImage library="ep/images/design" name="document.png"
						title="Item Detail"
						value="/resources/ep/images/design/document.png"
						style="margin-right:2px;" />
				</p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				#{lOIDetailBackingBean.getStatusDescById(scLoi.scWorkFlowStatus.pmStatus.statusId)}
			</p:column>
		</p:dataTable>
		
		<br />
	
		<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.loiloa.loi.result.of.negotiation']}" />
			</f:facet>
			
			<h:panelGroup id="negoTermPG">
				<p:dataTable id="negoTermList" var="scLoiTerm"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoTerms}"
					selection="#{lOIDetailBackingBean.managedBean.selectedNegoTermsList}"
				    rowKey="#{scLoiTerm}" 
					widgetVar="negoTermListWidget">
		
					<ac:paginator for="negoTermList" />
		
					<p:column selectionMode="multiple" style="width:2%"  rendered="#{isPendingNegotiationStatus}"/>
					<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}">
						<p:inputTextarea value="#{scLoiTerm.termDesc}" rows="2"
							maxlength="500" 
							style=" margin-bottom:5px; width:92%"
							rendered="#{scLoiTerm.brandNew}" />
							
						<h:outputText value="#{scLoiTerm.termDesc}" rendered="#{!scLoiTerm.brandNew}" />
						
						
						
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.loiloa.nego.results']}">
						<p:inputTextarea value="#{scLoiTerm.negoResult}" rows="2"
							maxlength="500" rendered="#{isPendingNegotiationStatus}"
							style=" margin-bottom:5px; width:92%">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputTextarea>
						
						<h:outputText value="#{scLoiTerm.negoResult}" rendered="#{!isPendingNegotiationStatus}"></h:outputText>
					</p:column>
				</p:dataTable>
			
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						process="@this, negoTermList" partialSubmit="true"
						action="#{lOIDetailBackingBean.addNegotiationTerm}"
						oncomplete="negoTermListWidget.paginator.endLink.click();"
						update="negoTermList"
						rendered="#{!empty lOIDetailBackingBean.managedBean.scLoi and isPendingNegotiationStatus}" />
					
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this, negoTermList" partialSubmit="true"
						action="#{lOADetailBackingBean.deleteRowsAction(lOIDetailBackingBean.managedBean.scLoi.scNegoTerms, lOIDetailBackingBean.managedBean.selectedNegoTermsList)}"
						update="negoTermList"
						rendered="#{!empty lOIDetailBackingBean.managedBean.scLoi and isPendingNegotiationStatus}" />
				</div>
			
			</h:panelGroup>
		</p:panel>
	</p:panel>
	
	<ui:include src="/xhtml/sc/loi/mutipleLoi/multipleLoiItemDetPopup.xhtml"/> 
</ui:composition>
