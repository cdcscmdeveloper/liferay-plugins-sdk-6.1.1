<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.supplier.list']}" />
		</f:facet>
		<p:dataTable id="negoSuppList" var="scLoi"
			value="#{lOIDetailBackingBean.managedBean.lois}"
			selection="#{lOIDetailBackingBean.managedBean.scLoi}"
			selectionMode="single" rowKey="#{scLoi}">
			
			<p:ajax event="rowSelect" update=":form:ItemDetAndNegoTerm" listener="#{lOIDetailBackingBean.showMultiLOIItemDetails}"/>

			<ac:paginator for="negoSuppList" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.loi.no']}">
				#{scLoi.loiNo}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				#{scLoi.scLoiLoa.supplierName}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				#{lOIDetailBackingBean.getStatusDescById(scLoi.scWorkFlowStatus.pmStatus.statusId)}
			</p:column>
		</p:dataTable>
		
		<br />
       <h:panelGroup id="ItemDetAndNegoTerm">
			<p:panel header="Item Details" id="itemDetailsId" toggleable="true"
				rendered="#{lOIDetailBackingBean.managedBean.itemDetailsFlag}"> 

				<p:dataTable id="itemDtlID" var="loiloaItem"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
					rowKey="#{itemPrice}" rowIndexVar="index">

					<p:columnGroup type="header">
						<p:row>
							<p:column rowspan="3"
								headerText="#{lbl['lbl.sc.loiloa.loi.item']}" />
							<p:column rowspan="3"
								headerText="#{lbl['lbl.sc.loiloa.loi.qty']}" />
							<p:column rowspan="3"
								headerText="#{lbl['lbl.sc.loiloa.loi.uom']}" />
							<p:column colspan="2" headerText="#{lbl['lbl.sc.loiloa.loi.original.offer.price']}" rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}" />
							<p:column colspan="2" rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}"
								headerText="#{lbl['lbl.sc.loiloa.loi.after.nego.offer.price']}" />

						</p:row>
						<p:row rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}"> 
							<p:column headerText="#{lbl['lbl.sc.loiloa.loi.per.unit']}" />
							<p:column headerText="#{lbl['lbl.sc.loiloa.loi.total.price']}" />
							<p:column headerText="#{lbl['lbl.sc.loiloa.loi.per.unit']}" />
							<p:column headerText="#{lbl['lbl.sc.loiloa.loi.total.price']}" />
						</p:row>
					</p:columnGroup>

					<p:column>
                        #{loiloaItem.scRequestItem.itemName}
                   </p:column>
					<p:column>
						<h:outputText value="#{loiloaItem.qty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
						</h:outputText>
					</p:column>
					<p:column>
                       #{loiloaItem.scRequestItem.uom.uomCode}
                    </p:column>


					<p:column style="width:10%; text-align:right;"
						rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
						<h:outputText
							value="#{loiloaItem.scQtRecommendDtl.scQtProposalItem.offerPrice}" />
					</p:column>

					<p:column style="width:10%; text-align:right;"
						rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
						<h:outputText
							value="#{loiloaItem.qty * loiloaItem.scQtRecommendDtl.scQtProposalItem.offerPrice}" />
					</p:column>

					<p:column style="width:10%; text-align:right;"
						rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
						<h:outputText
							value="#{loiloaItem.scQtRecommendDtl.scQtProposalItem.finalPrice}" />
					</p:column>
					<p:column style="width:10%; text-align:right;"
						rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
						<h:outputText
							value="#{loiloaItem.qty * loiloaItem.scQtRecommendDtl.scQtProposalItem.finalPrice}" />
					</p:column>

				</p:dataTable>

			</p:panel>

			<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.loiloa.loi.result.of.negotiation']}" />
			</f:facet>
			
			
				<p:dataTable id="negoTermList" var="scLoiTerm"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoTerms}"
					selection="#{lOIDetailBackingBean.managedBean.selectedNegoTermsList}"
				    rowKey="#{scLoiTerm}" 
					widgetVar="negoTermListWidget">
		
					<ac:paginator for="negoTermList" />
		
					<p:column selectionMode="multiple" style="width:2%"  rendered="#{isPendingNegotiationStatus}"/>
					<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}">
						<p:inputTextarea value="#{scLoiTerm.termDesc}" rows="2"
							maxlength="500" 
							style=" margin-bottom:5px; width:92%"
							rendered="#{scLoiTerm.brandNew}" />
							
						<h:outputText value="#{scLoiTerm.termDesc}" rendered="#{!scLoiTerm.brandNew}" />
						
						
						
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.loiloa.nego.results']}">
						<p:inputTextarea value="#{scLoiTerm.negoResult}" rows="2"
							maxlength="500" rendered="#{isPendingNegotiationStatus}"
							style=" margin-bottom:5px; width:92%">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputTextarea>
						
						<h:outputText value="#{scLoiTerm.negoResult}" rendered="#{!isPendingNegotiationStatus}"></h:outputText>
					</p:column>
				</p:dataTable>
			
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						process="@this, negoTermList" partialSubmit="true"
						action="#{lOIDetailBackingBean.addNegotiationTerm}"
						oncomplete="negoTermListWidget.paginator.endLink.click();"
						update="negoTermList"
						rendered="#{!empty lOIDetailBackingBean.managedBean.scLoi and isPendingNegotiationStatus}" />
					
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this, negoTermList" partialSubmit="true"
						action="#{lOADetailBackingBean.deleteRowsAction(lOIDetailBackingBean.managedBean.scLoi.scNegoTerms, lOIDetailBackingBean.managedBean.selectedNegoTermsList)}"
						update="negoTermList"
						rendered="#{!empty lOIDetailBackingBean.managedBean.scLoi and isPendingNegotiationStatus}" />
				</div>
		</p:panel>
		</h:panelGroup>
	</p:panel>
	
</ui:composition>
