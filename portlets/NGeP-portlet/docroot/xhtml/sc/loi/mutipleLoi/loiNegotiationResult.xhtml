<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:param name="isZonal" value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.zonal}" />
	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.supplier.list']}" />
		</f:facet>
		<p:dataTable id="negoSuppList" var="scLoi"
			value="#{lOIDetailBackingBean.managedBean.lois}"
			selection="#{lOIDetailBackingBean.managedBean.scLoi}"
			selectionMode="single" rowKey="#{scLoi}">

			<p:ajax event="rowSelect" update=":form:ItemDetAndNegoTerm"
				listener="#{lOIDetailBackingBean.onSupplierSelectEvent()}" />

			<ac:paginator for="negoSuppList" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.loi.no']}">
				#{scLoi.loiNo}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				#{scLoi.scLoiLoa.supplierName}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				#{lOIDetailBackingBean.getStatusDescById(scLoi.scWorkFlowStatus.pmStatus.statusId)}
			</p:column>
		</p:dataTable>
	</p:panel>
	<br />
	<h:panelGroup id="ItemDetAndNegoTerm">
	 <ui:param name="isBiddingAward" value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.recommendBy.parameterCode eq ParameterConst.recommendByOnlineBidding}" />
		
		<p:panel header="#{lbl['lbl.sc.item.details']}" id="itemDetailsId" toggleable="true"
			rendered="#{lOIDetailBackingBean.managedBean.itemDetailsFlag}">
			<p:dataTable id="itemDtlID" var="loiLoaItem"
				value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
				rowKey="#{itemPrice}" rowIndexVar="index">

				<p:columnGroup type="header">
					<p:row>
					 <p:column  rowspan="3" style="width:8%;white-space:normal;"  rendered="#{isZonal}"
						headerText="#{lbl['lbl.sc.zone']}" />
						
						<p:column rowspan="3" style="width:15%;white-space:normal;"
							headerText="#{lbl['lbl.sc.item']}" />

						<p:column rowspan="3" style="white-space:normal;text-align:right;"
							headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" />

						<p:column rowspan="3" style="white-space:normal;text-align:right;"
							headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" />

						<p:column rowspan="3" style="white-space:normal;text-align:right;"
							headerText="#{lbl['lbl.tpl.spec.content.duration.month']}" />


						<p:column rowspan="3" style="white-space:normal;text-align:right;"
							headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" />

						<p:column rowspan="3" headerText="#{lbl['lbl.sc.quantity']}" />
						<p:column rowspan="3" headerText="#{lbl['lbl.sc.uom']}" />

						<p:column rowspan="3"
							headerText="#{lbl['lbl.sc.unit.price']}"
							rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}" />
						<p:column rowspan="3"
							headerText="#{lbl['lbl.sc.sub.total']}"
							rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}" />

						<p:column colspan="2" style="white-space:normal;text-align:left;"
							headerText="#{lbl['lbl.sc.loiloa.original.offer.price']}"
							rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}" />
						<p:column colspan="2" style="white-space:normal;text-align:left;"
							rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}"
							headerText="#{lbl['lbl.sc.loiloa.after.nego.offer.price']}" />
					</p:row>
					<p:row rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
						<p:column headerText="#{lbl['lbl.sc.loiloa.per.unit']}"
							style="white-space:normal;text-align:right;" />
						<p:column headerText="#{lbl['lbl.sc.loiloa.total.price']}"
							style="white-space:normal;text-align:right;" />
						<p:column headerText="#{lbl['lbl.sc.loiloa.per.unit']}"
							style="white-space:normal;text-align:right;" />
						<p:column headerText="#{lbl['lbl.sc.loiloa.total.price']}"
							style="white-space:normal;text-align:right;" />
					</p:row>
				</p:columnGroup>
				 <p:column style="width:15%;white-space:normal;"  rendered="#{isZonal}">
				       <p:commandLink id="zoneName"
						    oncomplete="zoneLocPopup.show();"
						    partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
				      <f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{loiLoaItem.tplSpecZoneDtl}" />
					  <h:outputText value="#{loiLoaItem.tplSpecZoneDtl.zoneName}" />
				    </p:commandLink>
			    </p:column>
				<p:column style="width:15%;white-space:normal;">
                   #{loiLoaItem.scRequestItem.itemName}
             </p:column>

				<p:column style="width:10%; text-align:right;">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>

				<p:column style="width:10%; text-align:right;">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
				</p:column>

				<p:column style="width:10%; text-align:right;">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
				</p:column>

				<p:column style="width:10%; text-align:right;">
					<h:outputText
						value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>

			<p:column style="width:10%; text-align:right;">
					<h:outputText value="#{loiLoaItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>

				<p:column>
               		#{loiLoaItem.scRequestItem.uom.uomName}
            	</p:column>

				<p:column style="width:10%;text-align:right;"
					rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<h:outputText value="#{loiLoaItem.scQtRecommendDtl.scQtProposalItem.offerPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<f:facet name="footer">
						<h:outputText value="#{lbl['lbl.sc.total']}" />
					</f:facet>
				</p:column>

				<p:column style="width:7%;text-align:right;"
					rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<h:outputText value="#{loiLoaItem.offeredPriceSubTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>

					<f:facet name="footer">
						<h:outputText
							value="#{lOIDetailBackingBean.managedBean.scLoi.offeredPriceTotal}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</f:facet>
				</p:column>


				<p:column style="width:10%; text-align:right;"
					rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<h:outputText
						value="#{loiLoaItem.scQtRecommendDtl.scQtProposalItem.offerPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />							
					</h:outputText>
					<f:facet name="footer">
						<h:outputText value="#{lbl['lbl.sc.total']}" />
					</f:facet>
				</p:column>

				<p:column style="width:10%; text-align:right;"
					rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<h:outputText value="#{loiLoaItem.offeredPriceSubTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>

					<f:facet name="footer">
						<h:outputText
							value="#{lOIDetailBackingBean.managedBean.scLoi.offeredPriceTotal}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</f:facet>
				</p:column>

				<p:column style="width:10%; text-align:right;"
					rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
					 <p:inputText size="4" value="#{loiLoaItem.scQtRecommendDtl.scQtProposalItem.finalPrice}" style="text-align:right;" 
					       disabled="true" rendered="#{isBiddingAward}">
					   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
					
					<p:inputText size="4" value="#{loiLoaItem.unitPrice}" style="text-align:right;" rendered="#{!isBiddingAward}" 
						disabled="true">
					   <p:ajax event="blur" partialSubmit="true" process="@form" update="@all" listener="#{lOIDetailBackingBean.priceKeyInEvent()}"/>
					   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>

				   <f:facet name="footer">
						<h:outputText value="#{lbl['lbl.sc.total']}" />
					</f:facet>
				</p:column>

				<p:column style="width:10%; text-align:right;"
					rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<h:outputText value="#{loiLoaItem.afterNegoSubTotal}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>

					<f:facet name="footer">
						<h:outputText
							value="#{lOIDetailBackingBean.managedBean.scLoi.afterNegoTotal}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</f:facet>
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText
					value="#{lbl['lbl.sc.negotiation.result']}" />
			</f:facet>

			<p:dataTable id="negoTermList" var="scLoiTerm"
				value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoTerms}"
				selection="#{lOIDetailBackingBean.managedBean.selectedNegoTermsList}"
				rowKey="#{scLoiTerm}" widgetVar="negoTermListWidget">

				<ac:paginator for="negoTermList" />

				<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}">
					<p:inputTextarea value="#{scLoiTerm.termDesc}" rows="2"
						maxlength="500" style=" margin-bottom:5px; width:92%"
						rendered="#{scLoiTerm.brandNew and !isPendingNegotiationStatus}" />

					<h:outputText value="#{scLoiTerm.termDesc}" rendered="#{!scLoiTerm.brandNew}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.loiloa.nego.results']}" />
					</f:facet>
					<h:outputText value="#{scLoiTerm.negoResult}" />
				</p:column>
			</p:dataTable>

		</p:panel>
	</h:panelGroup>
	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
