<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<ui:param name="isPendingNegotiationStatus"
			value="#{lOIDetailBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_MULTIPLE_LOI_RECOMMENDATION || lOIDetailBackingBean.managedBean.currentStatusId == QTStatusConst.MLI_PENDING_NEGOTIATION}" />

		<ui:param name="isPendingEndorsementStatus"
			value="#{lOIDetailBackingBean.managedBean.currentStatusId == QTStatusConst.SF_PENDING_ENDORSEMENT || lOIDetailBackingBean.managedBean.currentStatusId == QTStatusConst.MLI_PENDING_ENDORSEMENT}" />

		<ui:param name="isEditableStatus"
			value="#{isPendingNegotiationStatus and !empty lOIDetailBackingBean.managedBean.taskId}" />

		<ui:param name="isFulfilmentTypeScheduled"
			value="#{lOIDetailBackingBean.managedBean.scQt.fulfilmentType.parameterCode eq ParameterConst.fulfilmentTypeScheduled}" />

		<ui:param name="validityDaysExpiredQt"
			value="#{lOIDetailBackingBean.checkProposalValidityDateReach(
		     				lOIDetailBackingBean.managedBean.scQt.proposalValidityEndDate)}" />

		<p:messages id="suppFinalMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		<ac:gpkiPopup textBeforeSign="#{lOIDetailBackingBean.textBeforeSign}"
			postSignAction="#{lOIDetailBackingBean.gpkiSignMultiLoiAction(gpkiBackingBean.pmDigiSign)}" />

		<div class="ppRightBtn">
			<ui:decorate
				template="/WEB-INF/facelets/templates/claim_template.xhtml">
				<ui:define name="outComeSection">
					<p:commandButton value="#{lbl['lbl.btn.save']}" process="@all"
						partialSubmit="true" update="@form" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						rendered="#{isPendingNegotiationStatus}"
						action="#{lOIDetailBackingBean.saveMultipleLoiAction}" />

					<ui:repeat var="bpmAction"
						value="#{lOIDetailBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

						<p:commandButton value="#{lbl[buttonLabel]}"
							styleClass="ui-button"
							action="#{lOIDetailBackingBean.updateMultiLoiBpmTaskAction(bpmAction)}"
							partialSubmit="true" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();" process="@form" update="@form"
							rendered="#{validityDaysExpiredQt}" />
					</ui:repeat>
				</ui:define>
			</ui:decorate>

		</div>

		<ui:include src="/xhtml/sc/loi/loilist/loiListHeader.xhtml"></ui:include>

		<p:tabMenu
			activeIndex="#{lOIDetailBackingBean.managedBean.selectedTabIndex}">

			<p:menuitem value="#{lbl['lbl.sc.negotiation.result']}"
				process="@form" update="@form">
				<f:setPropertyActionListener
					target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
					value="0" />
			</p:menuitem>

			<p:menuitem value="#{lbl['lbl.sc.committee']}" process="@form"
				update="@form">
				<f:setPropertyActionListener
					target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
					value="1" />
			</p:menuitem>

			<p:menuitem value="#{lbl['lbl.sc.recommendation']}" process="@form"
				update="@form">
				<f:setPropertyActionListener
					target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
					value="2" />
			</p:menuitem>

			<p:menuitem value="#{lbl['lbl.sc.report']}" process="@form"
				update="@form">
				<f:setPropertyActionListener
					target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
					value="5" />
			</p:menuitem>

		</p:tabMenu>

		<p:panel id="contentPanel">
			<c:if
				test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '0'}">
				<ui:include
					src="/xhtml/sc/loi/mutipleLoi/loiNegotiationResult.xhtml" />
			</c:if>
			<c:if
				test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '1'}">
				<ui:include
					src="/xhtml/sc/loi/mutipleLoi/loiNegotiationCommittee.xhtml" />
			</c:if>
			<c:if
				test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '2'}">
				<ui:include
					src="/xhtml/sc/loi/mutipleLoi/loiNegotiationRecomendation.xhtml" />
			</c:if>
			<c:if
				test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '5'}">
				<ui:include
					src="/xhtml/sc/loi/mutipleLoi/loiNegotiationReport.xhtml" />
			</c:if>
		</p:panel>

		<p:dialog id="loiAttachmentPopupId" widgetVar="loiAttachmentPopupDlg"
			modal="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">

			<p:ajax event="close" />
			<p:fileUpload style="display:inline;"
				fileUploadListener="#{lOIDetailBackingBean.handleFileUpload}"
				mode="advanced" id="uploadattachment"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
				update="@form, contentPanel"
				oncomplete="loiAttachmentPopupDlg.hide()">
			</p:fileUpload>
		</p:dialog>

	</ui:define>
</ui:composition>
