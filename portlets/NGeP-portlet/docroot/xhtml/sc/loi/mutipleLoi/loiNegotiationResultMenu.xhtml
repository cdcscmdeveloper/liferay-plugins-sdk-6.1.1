<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<ui:param name="isPendingNegotiationStatus"
			value="#{lOIDetailBackingBean.managedBean.currentStatusId == QTStatusConst.MLI_PENDING_NEGOTIATION}" />
			
		<p:messages id="suppFinalMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
	   <ac:gpkiPopup textBeforeSign="#{lOIDetailBackingBean.textBeforeSign}"
		   postSignAction="#{lOIDetailBackingBean.gpkiSignMultiLoiAction(gpkiBackingBean.pmDigiSign)}" />
		
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.save']}" 
				process="@all"
				partialSubmit="true"
				update="@form"
				rendered="#{isPendingNegotiationStatus}"
				action="#{lOIDetailBackingBean.saveMultipleLoiAction}"
				icon="ui-icon-save" />
					
			<ui:repeat var="bpmAction" value="#{lOIDetailBackingBean.managedBean.outComes}">
				<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
								
				<p:commandButton value="#{lbl[buttonLabel]}"  
					styleClass="ui-button"
					icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
					action="#{lOIDetailBackingBean.updateMultiLoiBpmTaskAction(bpmAction)}"
					partialSubmit="true"
					process="@form"
					update="@form" />
			</ui:repeat>
		</div>	
		
		<ui:include src="/xhtml/sc/loi/loilist/loiListHeader.xhtml"></ui:include>
	
		<table style="border: 0px;width:100%;">
			<tr>
				<td width="20%" style="vertical-align: baseline;">
					<p:tabMenu styleClass="sidemenu"
						activeIndex="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
						style="display : table-caption;">
						
						<p:menuitem value="#{lbl['lbl.sc.result.of.negotation']}"
							process="@form" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>
							
						<p:menuitem value="#{lbl['lbl.sc.negotation.committee']}"
							process="@form" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>
							
						<p:menuitem value="#{lbl['lbl.sc.recommendation']}"
							process="@form" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>
							
						<p:menuitem value="#{lbl['lbl.sc.report']}"
							process="@form" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="3" />
						</p:menuitem>
					</p:tabMenu>
				</td>
				
				<td width="80%">
					<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '0'}">
						<ui:include src="/xhtml/sc/loi/mutipleLoi/loiNegotiationResult.xhtml"></ui:include>
					</c:if> 
					<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '1'}">
						<ui:include src="/xhtml/sc/loi/mutipleLoi/loiNegotiationCommittee.xhtml"></ui:include>
					</c:if> 
					<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '2'}">
						<ui:include src="/xhtml/sc/loi/mutipleLoi/loiNegotiationRecomendation.xhtml"></ui:include>
					</c:if> 
					<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '3'}">
						<ui:include src="/xhtml/sc/loi/mutipleLoi/loiNegotiationReport.xhtml"></ui:include>
					</c:if> 
				</td>
			</tr>
		</table>
		<ui:include src="/xhtml/sc/supplierFinalization/supplierFinalization/supplierDetailsPopUp.xhtml"/> 
		<p:dialog id="loiAttachmentPopupId" widgetVar="loiAttachmentPopupDlg" 
			modal="true" resizable="false" width="700px" height="200" styleClass="pop_up_top" 
			header="#{lbl['lbl.txt.choose.files']}">
			
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;"
				fileUploadListener="#{lOIDetailBackingBean.handleFileUpload}"
				mode="advanced" id="uploadattachment"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update="@form" oncomplete="loiAttachmentPopupDlg.hide()">
			</p:fileUpload>
		</p:dialog>
		
	</ui:define>
</ui:composition>
