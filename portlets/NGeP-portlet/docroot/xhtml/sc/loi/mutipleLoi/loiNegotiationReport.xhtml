<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.report.content.content']}"
		toggleable="true">
		<p:dataTable id="reportContentsTbl"
			widgetVar="reportContentsTblWidget" var="scLoiReport"
			value="#{lOIDetailBackingBean.managedBean.recommendedLoi.scLoiReports}"
			rows="10" rowKey="#{scLoiReport}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{lOIDetailBackingBean.managedBean.selectedScLoiReports}">

			<ac:paginator for="reportContentsTbl" />

			<p:column selectionMode="multiple" style="width:2%" rendered="#{isPendingNegotiationStatus}"
				disabledSelection="#{!empty scLoiReport.pmDocument}" />

			<p:column headerText="#{lbl['lbl.sc.content']}">
				<h:inputText label="#{lbl['lbl.sc.content']}" 
					style="width:96%" value="#{scLoiReport.title}" required="true"
					rendered="#{empty scLoiReport.pmDocument and 
											isPendingNegotiationStatus}">
					<p:ajax event="keyup" />
				</h:inputText>
				<h:outputText value="#{scLoiReport.title}"
					rendered="#{empty scLoiReport.pmDocument and 
										!isPendingNegotiationStatus}" />		
				<h:outputText value="#{scLoiReport.title}"
					rendered="#{!empty scLoiReport.pmDocument}" />
			</p:column>

			<p:column style="width:15%;" headerText="#{lbl['lbl.sc.upload']}">
				<ui:fragment
					rendered="#{scLoiReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload}">
					<h:commandLink value="#{scLoiReport.scLoiReportAttachment.fileName}" styleClass="blue_font"
					disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
								action="#{lOIDetailBackingBean.downloadFile(
											scLoiReport.scLoiReportAttachment)}" />
					<p:commandLink immediate="true" disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
						rendered="#{(!empty scLoiReport.scLoiReportAttachment.fileName) and 
											isPendingNegotiationStatus}" update="reportContentsTbl">
						<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/icon_trash.png"
							styleClass="tasklist_title1" />

						<f:setPropertyActionListener target="#{scLoiReport.scLoiReportAttachment}" value="#{null}" />
					</p:commandLink>

					<p:commandButton oncomplete="loiAttachmentPopupDlg.show();"
					disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
						value="#{lbl['lbl.txt.attachment']}"
						partialSubmit="true" process="@this"
						rendered="#{isPendingNegotiationStatus and empty scLoiReport.scLoiReportAttachment.fileName}"
						update="@([id$=loiAttachmentPopupId])">
						<f:setPropertyActionListener
							target="#{lOIDetailBackingBean.managedBean.selectedScLoiReport}"
							value="#{scLoiReport}" />
						<f:setPropertyActionListener
							target="#{lOIDetailBackingBean.managedBean.attachmentDocType}"
							value="LIR" />
					</p:commandButton>
				</ui:fragment>
			</p:column>

			<p:column style="width:10%;text-align: center;" headerText="#{lbl['lbl.sc.action']}">
				<p:commandButton id="download" icon="ui-icon-download"
				disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{lOIDetailBackingBean.downloadReport(scLoiReport)}"
					rendered="#{scLoiReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload 
									? !empty scLoiReport.scLoiReportAttachment.fileName : true}" />
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				rendered="#{isPendingNegotiationStatus}"
				action="#{lOIDetailBackingBean.downloadAllReports}" />

			<p:commandButton value="#{lbl['lbl.btn.add']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				process="@this, reportContentsTbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addLoiReportAction}"
				oncomplete="reportContentsTblWidget.paginator.endLink.click();"
				rendered="#{isPendingNegotiationStatus}" update="reportContentsTbl" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				rendered="#{isPendingNegotiationStatus}"
				process="@this, reportContentsTbl" partialSubmit="true"
				oncomplete="loiReportDeletePopUp.show();"
				update="@([id$=#{loiReportDeleteId}])" />
		</div>
		<ac:confirmationPopup id="loiReportDeleteId"
			widget="loiReportDeletePopUp"
			okAction="lOIDetailBackingBean.deleteLoiReport" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />

	</p:panel>
</ui:composition>
