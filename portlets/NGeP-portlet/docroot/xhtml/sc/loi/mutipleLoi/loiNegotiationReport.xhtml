<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.report.content.content']}" id="multipleLoiNegotationReportPanel"
		toggleable="true">
		<p:dataTable id="reportContentsTbl"
			widgetVar="reportContentsTblWidget" var="scLoiReport"
			value="#{lOIDetailBackingBean.managedBean.recommendedLoi.scLoiReports}"
			rows="10" rowKey="#{scLoiReport}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">

			<ac:paginator for="reportContentsTbl" />
				
				<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox disabled="true"
						value="#{lOIDetailBackingBean.flag}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=multipleloiNegotationReportDeleteBtnId])"
							listener="#{lOIDetailBackingBean.selectAll(lOIDetailBackingBean.flag,lOIDetailBackingBean.managedBean.recommendedLoi.scLoiReports)}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{scLoiReport.selected}"
					disabled="#{lOIDetailBackingBean.managedBean.readOnly}">
					<p:ajax partialSubmit="true" process="@this" 
							listener="#{lOIDetailBackingBean.selectReportEvent(scLoiReport)}"
							update="@([id$=multipleloiNegotationReportDeleteBtnId])" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.content']}">
				<h:inputText label="#{lbl['lbl.sc.content']}" 
					style="width:96%" value="#{scLoiReport.title}" required="#{!scLoiReport.selected}"
					rendered="#{empty scLoiReport.pmDocument and 
											isPendingNegotiationStatus}">
					<p:ajax event="change" process="@this" partialSubmit="true" />
				</h:inputText>
				<h:outputText value="#{scLoiReport.title}"
							  rendered="#{empty scLoiReport.pmDocument and 
												!isPendingNegotiationStatus}" />		
				<h:outputText value="#{scLoiReport.title}"
					rendered="#{!empty scLoiReport.pmDocument}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}" style="width:15%; white-space:normal; text-align: center;">
				<ui:fragment rendered="#{scLoiReport.definationType ne null and
											scLoiReport.definationType.parameterCode ne 'UP'}">
					<p:commandButton id="download" icon="ui-icon-download" 
						style="background-color:transparent !important; border:0px none;"
						ajax="true" action="#{lOIDetailBackingBean.downloadReport(scLoiReport)}" />
				</ui:fragment>
				<ui:fragment rendered="#{scLoiReport.definationType eq null or
											scLoiReport.definationType.parameterCode eq 'UP'}">						
					<ac:scSingleFileUploadButton id="scLoiReportUploadBtn"
						popupWidgetVar="loiReportAttWidget" 
						attachment="#{scLoiReport.scLoiReportAttachment}" 
						readonly="#{!isPendingNegotiationStatus or 
										lOIDetailBackingBean.managedBean.readOnly}" 
						rowIndex="#{rowIndex}">
	
						<f:setPropertyActionListener for="actionEvent" value="#{scLoiReport}"
								target="#{lOIDetailBackingBean.managedBean.selectedScLoiReport}" />
	
						<f:setPropertyActionListener for="actionEvent" value="LIR"
								target="#{lOIDetailBackingBean.managedBean.attachmentDocType}" />
	
					</ac:scSingleFileUploadButton>
				</ui:fragment>				
			</p:column>						

		</p:dataTable>
		
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				rendered="#{isPendingNegotiationStatus}"
				action="#{lOIDetailBackingBean.downloadAllReports}" />

			<p:commandButton value="#{lbl['lbl.btn.add']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				process="@this, reportContentsTbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addLoiReportAction}"
				oncomplete="reportContentsTblWidget.paginator.endLink.click();"
				rendered="#{isPendingNegotiationStatus}" update="reportContentsTbl" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}" id="multipleloiNegotationReportDeleteBtnId"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly or lOIDetailBackingBean.deleteselectedList(lOIDetailBackingBean.managedBean.recommendedLoi.scLoiReports)}"
				rendered="#{isPendingNegotiationStatus}"
				process="@this, reportContentsTbl" partialSubmit="true"
				oncomplete="loiReportDeletePopUp.show();"
				update="@([id$=#{loiReportDeleteId}])" >
				<f:setPropertyActionListener target="#{lOIDetailBackingBean.flag}" value="#{false}"></f:setPropertyActionListener>
				</p:commandButton>
		</div>
		<ac:confirmationPopup id="loiReportDeleteId"
			widget="loiReportDeletePopUp"
			okAction="lOIDetailBackingBean.deleteLoiReport" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />

	</p:panel>
</ui:composition>
