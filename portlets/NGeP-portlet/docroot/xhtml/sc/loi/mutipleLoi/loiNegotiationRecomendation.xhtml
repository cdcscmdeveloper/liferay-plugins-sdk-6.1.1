<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	
	<p:panel header="#{lbl['lbl.sc.recommendation']}" toggleable="true">
		
		<p:dataTable id="recommendTbl" var="item"
			value="#{lOIDetailBackingBean.managedBean.recommendList}"
			rows="10"
			selection="#{lOIDetailBackingBean.managedBean.selectedRecommendList}"
			rowKey="#{item.qtRecommendId}" rowIndexVar="rowIndex">
			
			<p:ajax event="rowSelect" partialSubmit="true" process="@this" update="@this, :form:awardSupplier" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this" update="@this, :form:awardSupplier" />
			<p:ajax event="rowSelectCheckbox" partialSubmit="true" process="@this" update="@this, :form:awardSupplier" />
			<p:ajax event="rowUnselectCheckbox" partialSubmit="true" process="@this" update="@this, :form:awardSupplier" />
			<p:ajax event="toggleSelect" partialSubmit="true" process="@this" update="@this, :form:awardSupplier" />
			
			<ac:paginator for="itemListTbl" />
			
			<p:column selectionMode="multiple" style="width:2%"  rendered="#{isPendingNegotiationStatus}"/> 
			<p:column headerText="#{lbl['lbl.sc.item']}" style="white-space: normal;">
				<h:outputText value="#{item.requestItem.itemName}" />
			</p:column>
			
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.recommended.supplier']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.recommended.supplier.tooltip']}" />
				</f:facet>
				<p:dataList var="scQtRecommendDtl" value="#{item.recommendDtls}" type="none">
					<p:column>
						<p:selectBooleanCheckbox value="#{scQtRecommendDtl.recordStatus}"  rendered="#{isPendingNegotiationStatus}">
							<p:ajax event="change" partialSubmit="true" process="@this" update="@this, @([id$=qtyPG])" 
								listener="#{lOIDetailBackingBean.recommendSupplierSelectedAction(scQtRecommendDtl)}" />
						</p:selectBooleanCheckbox>
						<p:commandLink update="@([id$=suppDtlPopUp])"
							oncomplete="suppDtlWidgetVar.show();">
							<f:setPropertyActionListener value="#{scQtRecommendDtl.supplier}"
								target="#{suppFinalizationBackingBean.managedBean.smSupplier}" />
							<h:outputText value="#{scQtRecommendDtl.supplier.companyName}" />
						</p:commandLink>
						<br />
					</p:column>
				</p:dataList>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<ui:repeat var="scQtRecommendDtl" value="#{item.recommendDtls}">
					<h:outputText
						value="#{scQtRecommendDtl.scQtProposalAmount.scQtProposal.supplierNo}" />
					<br />
				</ui:repeat>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<ui:repeat var="scQtRecommendDtl" value="#{item.recommendDtls}">
					<h:outputText
						value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(scQtRecommendDtl.scQtProposalAmount.scQtProposal.scQtSupplier.smSupplier.bumi))}" />
					<br />
				</ui:repeat>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.price.type']}">
				<h:outputText value="#{lOIDetailBackingBean.getParameterDesc(item.requestItem.tplSpecQuestion.clPriceTypeCode)}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.offered.price']}" style="text-align: right;">
				<ui:repeat var="evaluationResultDtl" value="#{item.awardSupplierList}">
					<h:outputText value="#{evaluationResultDtl.qtEvaluationResult.offeredPrice}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<br/>
				</ui:repeat>				
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="text-align: right;">
				<ui:repeat var="evaluationResultDtl" value="#{item.awardSupplierList}">
					<h:outputText value="#{evaluationResultDtl.totalScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
					<br/>
				</ui:repeat>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.ranking']}" style="text-align: right;">
				<ui:repeat var="evaluationResultDtl" value="#{item.awardSupplierList}">
					<h:outputText value="#{evaluationResultDtl.evalRank}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
					<br/>					
				</ui:repeat>
			</p:column>

			<p:column style="text-align: right;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.quantity']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.sf.awarded.quantity.tooltip']}" />
				</f:facet>
				<h:panelGroup id="qtyPG">
					<p:dataList var="scQtRecommendDtl" value="#{item.recommendDtls}" type="none" rendered="#{item.recommendByStr == ParameterConst.recommendByMultipleAward}">
						<p:column>
							<h:inputText id="awardQty" value="#{scQtRecommendDtl.awardQty}" maxlength="14" size="6"
							  rendered="#{isPendingNegotiationStatus}"
								style="text-align: right;" required="true"
								label="#{lbl['lbl.sc.quantity']}">
								<p:ajax partialSubmit="true" process="@this" update="@this, awardQtyMsg" />
								<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.requestItem.uom.uomCode)}" 
									maxIntegerDigits="10" max="#{item.requestItem.quantity}" />
							</h:inputText>
							<h:outputText value="#{scQtRecommendDtl.awardQty}" rendered="#{!isPendingNegotiationStatus}"/>
							<p:message id="awardQtyMsg" for="awardQty" display="icon" />
							<br />
						</p:column>
					</p:dataList>

					<h:outputText value="#{item.requestItem.quantity}"
						rendered="#{item.requestItem.tplSpecQuestion.clPriceTypeCode.parameterCode == ParameterConst.priceTypeStandard 
							and item.recommendByStr != ParameterConst.recommendByMultipleAward}" />
				</h:panelGroup>
			</p:column>
		</p:dataTable>
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2"
			columnClasses="columnWidth20"  rendered="#{isPendingNegotiationStatus}">
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.award.supplier']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu id="awardSupplier" value="#{lOIDetailBackingBean.managedBean.awardSupplierId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems value="#{lOIDetailBackingBean.getAwardSupplierListDropDown()}" />
					<p:ajax event="change" partialSubmit="true" process="@this" update="@this" />
	   			</p:selectOneMenu>
				
				<p:commandButton value="#{lbl['lbl.btn.apply.to.all']}" 
					process="@this"
					partialSubmit="true"
					action="#{lOIDetailBackingBean.awardSupplierEvent}" 
					update="recommendTbl"/>
			</h:column>
			
		</h:panelGrid>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;">
					<p:outputLabel value="#{lbl['lbl.sc.remark']}" />
				</td>
				
				<td class="TableFieldRight">
					<p:dataGrid var="remarkVar" value="#{lOIDetailBackingBean.managedBean.scQtCommittee.qtCommitteRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<h:graphicImage height="30"
										value="#{lOIDetailBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" />
								</td>
								<td width="5"></td>
								<td>
									<h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText>
								</td>
							</tr>
							<tr>
								<td></td>
								<td>
									<p:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}"/> 
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid>
				</td>
			</tr>
		</table>
	</p:panel>
	
</ui:composition>
