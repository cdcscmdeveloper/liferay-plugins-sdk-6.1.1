<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="scQtFinalization"
		value="#{lOIDetailBackingBean.managedBean.scQtFinalization}" />
	<ui:param name="finalizationQtCommittee"
		value="#{lOIDetailBackingBean.managedBean.finalizationQtCommittee}" />
	<ui:param name="finalizationCommittee"
		value="#{finalizationCommittee.scCommittee}" />
	<ui:param name="isFinalizationStage"
		value="#{lOIDetailBackingBean.isFinalizationStage()}" />

	<table style="border: 0px; width: 100%;">

		<tr>
			<td width="20%" class="sidemenutd" valign="top"><p:tabMenu
					styleClass="sidemenu"
					activeIndex="#{lOIDetailBackingBean.managedBean.meetingPreparationActiveIndex}">

					<p:menuitem value="#{lbl['lbl.sc.meeting.details']}"
						process="@form" update="@form">
						<f:setPropertyActionListener
							target="#{lOIDetailBackingBean.managedBean.meetingPreparationActiveIndex}"
							value="0" />
					</p:menuitem>
					<p:menuitem
						value="#{lOIDetailBackingBean.managedBean.finalizationCommitteeDesc}"
						process="@form" update="@form">
						<f:setPropertyActionListener
							target="#{lOIDetailBackingBean.managedBean.meetingPreparationActiveIndex}"
							value="1" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.join.in']}" process="@form"
						update="@form">
						<f:setPropertyActionListener
							target="#{lOIDetailBackingBean.managedBean.meetingPreparationActiveIndex}"
							value="2" />
					</p:menuitem>
				</p:tabMenu></td>
			<ui:param name="activeIndex"
				value="#{lOIDetailBackingBean.managedBean.meetingPreparationActiveIndex}" />
			<td style="width: 80%;" valign="top"><c:if
					test="#{activeIndex eq '0'}">
					<ui:include
						src="/xhtml/sc/loi/mutipleLoi/preparation/meetingDtls.xhtml"></ui:include>
				</c:if> <c:if test="#{activeIndex eq '1'}">
					<ui:include
						src="/xhtml/sc/loi/mutipleLoi/preparation/committeeDtls.xhtml"></ui:include>
				</c:if> <c:if test="#{activeIndex eq '2'}">
					<ui:include
						src="/xhtml/sc/loi/mutipleLoi/preparation/meetingAttendanceDtls.xhtml"></ui:include>
				</c:if></td>
		</tr>
	</table>

</ui:composition>
