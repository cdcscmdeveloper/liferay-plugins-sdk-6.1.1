<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<style>
	.committeeBidDtlTblCl th,.committeeBidDtlTblCl td {
		width: auto;
		min-width: 50px;
		word-break: break-word !important;
		white-space: normal !important;
	}
	
	.committeeBidDtlTblCl th {
		text-align: center !important;
	}
	
	.committeeBidDtlTblCl tr td:last-child {
		width: auto;
		text-align: center !important;
	}
	</style>
	<p:panel
		header="#{lOIDetailBackingBean.managedBean.finalizationCommitteeDesc}"
		toggleable="true">
		<ui:param name="committeeActivities"
			value="#{finalizationQtCommittee.committeeActivities}" />
		<ui:param name="isFinalizationStage"
			value="#{lOIDetailBackingBean.isFinalizationStage()}" />

		<p:dataTable id="committeeDtlTbl" var="committeeDtl"
			styleClass="committeeBidDtlTblCl" value="#{committeeActivities}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" rows="10"
			rowKey="#{committeeDtl}" rowIndexVar="index" resizableColumns="false">
			<ac:paginator for="committeeDtlTbl" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<p:commandLink
					actionListener="#{lOIDetailBackingBean.onClickMemberInfo(committeeDtl.scCommitteeMember.pmUser)}"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
					update="@form">
					<h:outputText value="#{committeeDtl.scCommitteeMember.memberName}"></h:outputText>
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.designation}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeeDtl.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header" style="min-width: 50px !important;">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="pnpTT#{index}"
						value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
								fn:toUpperCase(committeeDtl.scCommitteeMember.PNP))}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.role']}">
				<h:outputText
					value="#{lOIDetailBackingBean.getFCMemberRole(
											committeeDtl.scCommitteeMember.memberRole)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.representative.type']}">
				<h:outputText
					value="#{lOIDetailBackingBean.getParameterDesc(
											committeeDtl.scCommitteeMember.representativeType)}" />
			</p:column>

			<p:column style="min-width: 100px !important;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.lbl.attendandendorse']}" />
					<ac:iconTooltip id="attendanceTooltip"
						value="#{lbl['lbl.sc.tooltip.attendandendorse']}" />
				</f:facet>
				<p:selectBooleanCheckbox value="#{committeeDtl.attended}"
					disabled="#{!isFinalizationStage}" />
			</p:column>
		</p:dataTable>
		<ac:qtCommitteMemberInfoPopup bBean="#{lOIDetailBackingBean}"
			widget="memberInfoPopUp" />
		<div align="right">
			<ui:param name="actionBtnLbl"
				value="#{lOIDetailBackingBean.evaluateEndorseSignoffTask(lOIDetailBackingBean.managedBean.taskName) ? lbl['lbl.sc.btn.view.committee']: lbl['lbl.sc.btn.update.committee']}" />
			<p:commandButton value="#{actionBtnLbl}" styleClass="BtnSpacing"
				onclick="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{lOIDetailBackingBean.navigateToUpdateMember('update')}"
				rendered="#{lOIDetailBackingBean.managedBean.allowGlobalEndorseSignoff}" />
		</div>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.remarks']}" toggleable="true">
		<ac:scRemarkAndAttachment
			remarkList="#{lOIDetailBackingBean.managedBean.finalizationQtCommittee.qtCommitteRemarks}"
			showAttachment="false" readonly="#{!isFinalizationStage}" header="" />
	</p:panel>
</ui:composition>
