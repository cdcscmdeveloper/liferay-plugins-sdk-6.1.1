<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contents.content']}" toggleable="true">
		<p:dataTable id="contentsTbl" widgetVar="contentsTblWidget" var="scLoaReport"
			value="#{lOADetailBackingBean.managedBean.scLoa.scLoaReports}" rows="10"
			rowKey="#{scLoaReport}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{lOADetailBackingBean.managedBean.selectedScLoaReports}">
			
			<ac:paginator for="contentsTbl" />
			
			<p:column selectionMode="multiple" style="width:2%" disabledSelection="#{!empty scLoaReport.pmDocument}" />
			
			<p:column headerText="#{lbl['lbl.sc.content']}">
				<h:inputText style="width:96%" value="#{scLoaReport.title}" rendered="#{empty scLoaReport.pmDocument}" />
				<h:outputText value="#{scLoaReport.title}" rendered="#{!empty scLoaReport.pmDocument}" />
			</p:column>

			<p:column style="width:15%;" headerText="#{lbl['lbl.sc.upload']}">
				<ui:fragment rendered="#{scLoaReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload}">
					<h:outputText value="#{scLoaReport.scLoaReportAttachment.fileName}" />
					<p:commandButton oncomplete="attachmentPopupDlg.show();"
						value="#{lbl['lbl.txt.attachment']}" 
						partialSubmit="true" process="@this">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedScLoaReport}" value="#{scLoaReport}" />
					</p:commandButton>
				</ui:fragment>
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.sc.action']}">				
				<p:commandButton id="download" icon="ui-icon-download" style="background-color:transparent !important; border:0px none;"
					action="#{lOADetailBackingBean.downloadReport(scLoaReport)}"
					rendered="#{scLoaReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload ? !empty scLoaReport.scLoaReportAttachment.fileName : true}" />
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
			<p:commandButton  value="#{lbl['lbl.btn.download.all']}"	
				action="#{lOADetailBackingBean.downloadAllReports}" />
				
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, contentsTbl" partialSubmit="true"
				action="#{lOADetailBackingBean.addLoaContentAction}"
				oncomplete="contentsTblWidget.paginator.endLink.click();"
				update="contentsTbl"/>
				
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, contentsTbl" partialSubmit="true"
				action="#{templateSpecBackingBean.deleteRowsAction(lOADetailBackingBean.managedBean.scLoa.scLoaReports, lOADetailBackingBean.managedBean.selectedScLoaReports)}"
				update="contentsTbl" />
		</div>
	</p:panel>
</ui:composition>
