<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" id="branchids"
		toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.mofno']}" /></td>
				<td colspan="2"><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.smMofAccount.mofNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.supp.name']}" /></td>
				<td colspan="2"><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierContact}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.branch']}" /></td>
				<td colspan="2"><p:selectOneMenu
						value="#{lOIDetailBackingBean.managedBean.branchName}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{lOIDetailBackingBean.managedBean.branchsList}"
							var="brList" itemLabel="#{brList.branchName}"
							itemValue="#{brList.branchName}" />
						<p:ajax event="change"
							listener="#{lOIDetailBackingBean.handleBranchDetailsChanged}"
							partialSubmit="true" process="@this" update="branchids" />
					</p:selectOneMenu></td>
			</tr>
			<p:spacer height="5px" />
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.address']}" /></td>
				<td><p:inputTextarea id="delAddrText" cols="30"
						rows="5"
						value="test"
						style=" margin-bottom:5px;" disabled="true" /></td>
			
			</tr>
			
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.contact.person']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierContact}"
						disabled="true" /></td>
			
			</tr>
			<tr>
				<td><p:outputLabel value="Tel No" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierFaxNo}"
						disabled="true" /></td>
						
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.fax.no']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierFaxNo}"
						disabled="true" /></td>		
						
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.mobile.no']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierMobNo}"
						disabled="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.email']}" /></td>
				<td colspan="4"><p:inputText size="117"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierEmail}"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loi.details']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.title']}" /></td>
				<td><c:if
						test="#{lOIDetailBackingBean.managedBean.scLoi.brandNew}">
						<p:inputText
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.title}" size="69" />
					</c:if> 
					
					<c:if test="#{!lOIDetailBackingBean.managedBean.scLoi.brandNew}">
						<p:inputText size="69" readonly="true" disabled="true"  value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.title}"/>
					</c:if></td>
			</tr>
			<tr>
				<td style="width: 164px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.file.no']}" /></td>
				<td><p:inputText disabled="true" 
						value="#{lOIDetailBackingBean.managedBean.qt.fileNo}" size="30" /> 
						<p:spacer width="2px"></p:spacer>
					 <p:inputText disabled="true" size="4"  value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.fileNo}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loi.issue']}" /></td>
				<td><p:inputText size="30"
						value="#{lOIDetailBackingBean.managedBean.scLoi.issueDate}"
						disabled="true" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText>
						</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.res.due.date']}" /></td>
				<td><p:inputText
						size="14" disabled="true" value="#{lOIDetailBackingBean.managedBean.scLoi.issueDate}" /> <p:spacer
						width="10px" /> <p:inputText
						value="Days"
						disabled="true" size="8" readonly="true" /></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="CONTRACT SIGNER" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="Contract Signer" /></td>
				<td><p:selectOneMenu id="app"
						value="#{lOIDetailBackingBean.managedBean.reqApprove}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{lOIDetailBackingBean.managedBean.contractSigners}"
							var="contractSigner" itemLabel="#{contractSigner.userName}"
							itemValue="#{contractSigner.userId}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
