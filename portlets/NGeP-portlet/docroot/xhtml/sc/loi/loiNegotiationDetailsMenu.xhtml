<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.nego.loc']}" toggleable="true">
		<p:dataTable id="negotiationloctbl" var="locList"
			value="#{lOIDetailBackingBean.managedBean.negoLocationList}"
			selection="#{lOIDetailBackingBean.managedBean.selectedNegoLocationList}"
			rows="10" rowKey="#{locList}" rowIndexVar="rowIndex">

			<ac:paginator for="locId" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.location']}"
				style="width:40%">
				<p:inputText value="#{locList.negoLocation}" size="30" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.date']}"
				style="width:10%">
				<p:calendar id="date"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
					size="12" value="#{locList.negoDate}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.remarks']}"
				style="width:40%">
				<p:inputText value="2" size="30" />
			</p:column>

		</p:dataTable>
		<p:spacer height="10px" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
				process="@this,negotiationloctbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationLocation}"
				update="negotiationloctbl" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
				process="@this" partialSubmit="true" icon="ui-icon-delete" />
		</div>

	</p:panel>

	<p:panel id="negoTermId" header="#{lbl['lbl.sc.loiloa.nego.term']}"
		toggleable="true">
		<p:dataTable id="negotiationtermstbl" var="negoTerms"
			value="#{lOIDetailBackingBean.managedBean.negoTermsList}"
			selection="#{lOIDetailBackingBean.managedBean.selectedNegoTermsList}"
			rows="10" rowKey="#{negoTerms}" rowIndexVar="rowIndex">

			<ac:paginator for="termId" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}"
				style="width:80%">
				<p:inputTextarea id="negoterms" cols="140" rows="2"
					value="#{negoTerms.scTerm.scTermDescs[0].termDesc}"
					autoResize="false" />
			</p:column>

			<p:column headerText="Negotiate">
				<p:selectBooleanCheckbox value="true">
				</p:selectBooleanCheckbox>
			</p:column>


		</p:dataTable>
		<p:spacer height="10px" />

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
				process="@this, negotiationtermstbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationTerm}"
				update="negotiationtermstbl" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
				process="@this" partialSubmit="true" icon="ui-icon-delete" />
		</div>

	</p:panel>

	<p:dialog id="predefinedTerms" widgetVar="predefinedTerms" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="400px"
		height="200" styleClass="pop_up_top" header="Pre-Defined Terms">

		<p:dataTable id="predefinedtermsid" var="predefinedList"
			value="#{lOIDetailBackingBean.managedBean.scTermDescList}"
			selection="#{lOIDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{predefinedList.termDescId}" editable="true"
			rowIndexVar="index">
			<ac:paginator for="pretermId" />

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="Title">
				<h:outputText value="#{predefinedList.termDesc}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="20px" />
		<p:commandButton value="OK" style="float:right;" process="@all"
			action="#{lOIDetailBackingBean.addPredefinedTerms}"
			partialSubmit="true" oncomplete="predefinedTerms.hide();"
			icon="ui-icon-accept" update="negoTermId"></p:commandButton>
	</p:dialog>
</ui:composition>
