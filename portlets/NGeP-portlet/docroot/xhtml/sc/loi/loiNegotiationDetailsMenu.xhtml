<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.nego.loc']}" toggleable="true">
		<p:dataTable id="negoloctbl" var="negoloc"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoLocations}"
			selection="#{lOIDetailBackingBean.managedBean.selectedNegoLocationList}"
			rows="10" rowKey="#{negoloc}" rowIndexVar="rowIndex">
			<ac:paginator for="negoloctbl" />
			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.location']}"
				style="width:40%">
				<p:inputText value="#{negoloc.negoLocation}" size="30" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.date']}"
				style="width:10%">
				<p:calendar id="date"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
					size="12" value="#{negoloc.negoDate}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.remarks']}"
				style="width:40%">
				<p:inputText value="2" size="30" />
			</p:column>

		</p:dataTable>
		<p:spacer height="10px" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
				process="@this,negoloctbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationLocation}"
				update="negoloctbl" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
			    action="#{lOIDetailBackingBean.deleteNegoLocations}" 
			    update="negoloctbl"
				process="@this negoloctbl" partialSubmit="true" icon="ui-icon-delete" />
		</div>

	</p:panel>

	<p:panel id="negoTermId" header="#{lbl['lbl.sc.loiloa.nego.term']}"
		toggleable="true">
		<p:dataTable id="negoTermstbl" var="negoTerm"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoTerms}"
			selection="#{lOIDetailBackingBean.managedBean.selectedNegoTermsList}"
		    rowKey="#{negoTerm}" rowIndexVar="rowIndex">
		
			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{!negoTerm.brandNew}" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}"
				style="width:80%">
				<h:outputText
					value="#{negoTerm.pmTerm.termDesc}"
					rendered="#{!negoTerm.brandNew}" />

				<p:inputTextarea  cols="140" rows="2"
					value="#{negoTerm.pmTerm.termDesc}" autoResize="false"
					rendered="#{negoTerm.brandNew}" />

			</p:column>

			<p:column headerText="Negotiate">
				<p:selectBooleanCheckbox value="#{negoTerm.selected}" disabled="#{negoTerm.brandNew}">
						<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>


		</p:dataTable>
		<p:spacer height="10px" />

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
				process="@this negoTermstbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationTerm}"
				update="negoTermstbl" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
			   action="#{lOIDetailBackingBean.deleteNegoTerm}" update="negoTermstbl"
				process="@this negoTermstbl" partialSubmit="true" icon="ui-icon-delete" />
		</div>

	</p:panel>

	<p:dialog id="predefinedTerms" widgetVar="predefinedTerms" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="400px"
		height="200" styleClass="pop_up_top" header="Pre-Defined Terms">

		<p:dataTable id="predefinedtermsid" var="predefinedList"
			value="#{lOIDetailBackingBean.managedBean.scTermDescList}"
			selection="#{lOIDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{predefinedList.termDescId}" editable="true"
			rowIndexVar="index">
			<ac:paginator for="pretermId" />

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="Title">
				<h:outputText value="#{predefinedList.termDesc}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="20px" />
		<p:commandButton value="OK" style="float:right;" process="@all"
			action="#{lOIDetailBackingBean.addPredefinedTerms}"
			partialSubmit="true" oncomplete="predefinedTerms.hide();"
			icon="ui-icon-accept" update="negoTermId"></p:commandButton>
	</p:dialog>
</ui:composition>
