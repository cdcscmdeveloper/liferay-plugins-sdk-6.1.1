<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="loiNegotiationDetailsMenu.xhtml" />

	<p:panel header="#{lbl['lbl.sc.supporting.document']}"
		toggleable="true">
		<p:dataTable id="suppDocTbl" var="scLoiSuppDoc"
			widgetVar="suppDocTblWidget"
			rowIndexVar="rowIndex"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiSupportingDocs}"
			rows="10" rowKey="#{scLoiSuppDoc}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{lOIDetailBackingBean.managedBean.selectedScLoiSuppDocs}">

			<ac:paginator for="suppDocTbl" />
			<p:ajax event="rowSelect"
				update="@([id$=loiAfterNegotationDeleteBtnId])" />
			<p:ajax event="rowUnselect"
				update="@([id$=loiAfterNegotationDeleteBtnId])" />
			<p:ajax event="rowSelectCheckbox"
				update="@([id$=loiAfterNegotationDeleteBtnId])" />
			<p:ajax event="rowUnselectCheckbox"
				update="@([id$=loiAfterNegotationDeleteBtnId])" />
			<p:ajax event="toggleSelect"
				update="@([id$=loiAfterNegotationDeleteBtnId])" />
			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{isEditableStatus}" />

			<p:column headerText="#{lbl['lbl.sc.document.title']}"
				style="width:50%">
				<p:inputText style="width:85%" value="#{scLoiSuppDoc.title}"
					required="true" id="repoTitleId"
					label="#{lbl['lbl.sc.document.title']}"
					readonly="#{lOIDetailBackingBean.managedBean.readOnly or isCompleted}">
					<p:ajax event="keyup" />
				</p:inputText>
				<p:message id="repoTitleIdMsg" for="repoTitleId" display="icon" />
			</p:column>

			<p:column style="width:20%;text-align: center;"
				headerText="#{lbl['lbl.sc.upload']}">

				<ac:scSingleFileUploadButton id="supportDocUploadBtn"
					readonly="#{lOIDetailBackingBean.managedBean.readOnly}"
					popupWidgetVar="supportDocUploadDlg"
					attachment="#{scLoiSuppDoc.scLoiSupportingDocAttachment}"
					rowIndex="#{rowIndex}">
					<f:setPropertyActionListener for="actionEvent"
						target="#{lOIDetailBackingBean.managedBean.selectedScLoiSuppDoc}"
						value="#{scLoiSuppDoc}" />
				</ac:scSingleFileUploadButton>
			</p:column>

		</p:dataTable>

		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				process="@this, suppDocTbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addLoiSuppDocAction}"
				oncomplete="suppDocTblWidget.paginator.endLink.click();"
				update="suppDocTbl"
				rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				id="loiAfterNegotationDeleteBtnId"
				disabled="#{lOIDetailBackingBean.managedBean.readOnly or empty lOIDetailBackingBean.managedBean.selectedScLoiSuppDocs}"
				process="@this, suppDocTbl" partialSubmit="true"
				rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
				oncomplete="supporingDocDeletePopUp.show();"
				update="@([id$=#{supporingDocDeleteId}])" />

		</div>
		<ac:confirmationPopup id="supporingDocDeleteId"
			widget="supporingDocDeletePopUp"
			okAction="lOIDetailBackingBean.deleteSupporingDocs" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
	</p:panel>

	<ui:include src="loiAfterNegoAwardDetails.xhtml" />


</ui:composition>
