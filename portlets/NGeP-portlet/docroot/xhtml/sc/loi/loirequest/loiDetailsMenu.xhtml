<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="19%">
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</td>
			<td>
				<p:inputText size="40"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.mofNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</td>
			<td>
				<p:inputText size="40"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.supplierName}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}"/>
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<c:if test="#{isEditableStatus}">
					<table>
						<tr>
							<td>
								<p:selectOneMenu id="branch" disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
									value="#{lOIDetailBackingBean.managedBean.branchName}"
									style="width: 319px;margin-bottom: 5px;"
									label="#{lbl['lbl.sc.branch']}">
									<f:selectItem itemLabel="HQ" itemValue="#{null}" />
									<f:selectItems
										value="#{lOIDetailBackingBean.managedBean.branchsList}"
										var="smSupplierBranch" 
										itemValue="#{smSupplierBranch.branchName}" itemLabel="#{smSupplierBranch.branchName}" />
									<p:ajax event="change"
										listener="#{lOIDetailBackingBean.handleBranchDetailsChanged}"
										partialSubmit="true" process="@this" update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail" />
								</p:selectOneMenu>
								<p:message id="branchMsg" for="branch" display="icon" />
							</td>
							<td style="margin-top: -3px">
								<ac:iconTooltip value="#{lbl['lbl.sc.branch.tooltip']}" />
							</td>
						</tr>
					</table>
				</c:if>
				<c:if test="#{!isEditableStatus}">
					<p:inputText size="40"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierBranch}"
						disabled="true" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td rowspan="3" valign="top" width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.address']}" />
			</td>
			<td rowspan="3">
				<p:inputTextarea id="suppAddr"
					rows="5"
					value="#{lOIDetailBackingBean.getFullAddress(lOIDetailBackingBean.managedBean.scLoi.supplierAddress)}"
					style=" margin-bottom:5px; width: 310px;" disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.tel.no']}" />
			</td>
			<td>
				<p:inputText id="suppPhoneNo" size="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierPhoneNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.fax.no']}" />
			</td>
			<td>
				<p:inputText id="suppFaxNo" size="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierFaxNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" />
			</td>
			<td>
				<p:inputText id="suppMobNo" size="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierMobNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
			</td>
			<td>
				<p:inputText id="suppContact" size="40"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierContact}"
					disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.email']}" />
			</td>
			<td>
				<p:inputText id="suppEmail" size="30" style=" margin-bottom:5px;"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierEmail}"
					disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loi.details.section']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.title']}" /></td>
				<td><c:if
						test="#{lOIDetailBackingBean.managedBean.scLoi.brandNew}">
						<p:inputText readonly="#{lOIDetailBackingBean.managedBean.readOnly}"
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.title}"
							size="40" maxlength="100" />
					</c:if> <c:if test="#{!lOIDetailBackingBean.managedBean.scLoi.brandNew}">
						<p:inputText size="40" readonly="true" disabled="true"
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.title}" />
					</c:if></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.fileno']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.fileNo}" size="30" />
					<p:spacer width="2px"></p:spacer> <p:inputText disabled="true"
						size="4"
						value="#{lOIDetailBackingBean.managedBean.scLoi.fileExtnNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loi.issue']}" /></td>
				<td><p:inputText size="40"
						value="#{lOIDetailBackingBean.managedBean.scLoi.issueDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.res.due.date']}" /></td>
				<td><p:inputText size="30" disabled="true"
						value="#{lOIDetailBackingBean.managedBean.scLoi.ackDueDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="10px" /> <p:inputText styleClass="ppRightBtn"
						value="#{!empty lOIDetailBackingBean.managedBean.scLoi.ackDueDate ? DateUtils.getDaysDifference(DateUtils.getCurrentDateWithoutTime(), lOIDetailBackingBean.managedBean.scLoi.ackDueDate) : ''}"
						disabled="true" size="4" readonly="true" /> #{lbl['lbl.sc.days']}
					<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loi.res.due.date.tooltip']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.appr.req']}" />
						<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" /></td>
				<td><p:selectOneRadio  styleClass="commonLabel"
						disabled="#{!isPendingSubmissionStatus or lOIDetailBackingBean.managedBean.readOnly}"
						value="#{lOIDetailBackingBean.managedBean.scLoi.approvalReq}">
						<f:selectItems
							value="#{lOIDetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
							<p:ajax event="change" listener="#{lOIDetailBackingBean.approverRequiredEvent}"
						    partialSubmit="true" process="@this" />
					</p:selectOneRadio></td>
			</tr>
			
		</table>
	</p:panel>
</ui:composition>
