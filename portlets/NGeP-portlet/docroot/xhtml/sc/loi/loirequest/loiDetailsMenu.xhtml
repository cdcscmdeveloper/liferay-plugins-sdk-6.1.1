<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="19%">
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</td>
			<td>
				<p:inputText size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.mofNo}"
					disabled="true" />
			</td>
			<ui:remove> Bug #30600, #31033 Start </ui:remove>	
			<td>
				<p:outputLabel value="#{lbl['lbl.sm.disciplinary.action.headerLbl']}" />
			</td>
			<td>
			   <c:forEach var="actionDA" items="#{lOIDetailBackingBean.managedBean.recSupplierList}">
				  <c:if test="#{actionDA.smSupplier.supplierId eq lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.smSupplier.supplierId}">
				     <p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" style="color:red; font-weight:bold;" 
							rendered="#{actionDA.smSupplier.disciplinaryActions}"
							action="#{viewSuppProfileBackingBean.onViewActiveDisciplinaryAction(actionDA.smSupplier)}" 
							process="@this" partialSubmit="true" update=":form">
								<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.yes']}" styleClass="warning" />
					 </p:commandLink><p:spacer width="2"/>
					 <h:outputText rendered="#{!actionDA.smSupplier.disciplinaryActions}"
						 value="#{lbl['lbl.cm.dialog.cofirm.no']}" /><p:spacer width="2"/>
					 <ac:iconTooltip value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" /> 
			      </c:if>
				</c:forEach>
			</td> 
			<ui:remove> Bug #30600, #31033 End </ui:remove>	
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</td>
			<td>
				<p:inputText size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.supplierName}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}"/>
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<c:if test="#{isEditableStatus}">
					<table>
						<tr>
							<td>
								<p:selectOneMenu id="branch" disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
									value="#{lOIDetailBackingBean.managedBean.branchName}"
									style="width: 335px;margin-bottom: 5px;"
									label="#{lbl['lbl.sc.branch']}">
									<f:selectItem itemLabel="HQ" itemValue="#{null}" />
									<f:selectItems
										value="#{lOIDetailBackingBean.managedBean.branchsList}"
										var="smSupplierBranch" 
										itemValue="#{smSupplierBranch.branchName}" itemLabel="#{smSupplierBranch.branchName}" />
									<p:ajax event="change"
										listener="#{lOIDetailBackingBean.handleBranchDetailsChanged}"
										partialSubmit="true" process="@this" update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail" />
								</p:selectOneMenu>
								<p:message id="branchMsg" for="branch" display="icon" />
							</td>
							<td style="margin-top: -3px">
								<ac:iconTooltip value="#{lbl['lbl.sc.branch.tooltip']}" />
							</td>
						</tr>
					</table>
				</c:if>
				<c:if test="#{!isEditableStatus}">
					<p:inputText size="50"
						value="#{lOIDetailBackingBean.managedBean.scLoi.supplierBranch}"
						disabled="true" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td rowspan="3" valign="top" width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.address']}" />
			</td>
			<td rowspan="3">
				<p:inputTextarea id="suppAddr"
					rows="5"
					value="#{lOIDetailBackingBean.getFullAddress(lOIDetailBackingBean.managedBean.scLoi.scSupplierAddress)}"
					style=" margin-bottom:5px; width: 325px;" disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.tel.no']}" />
			</td>
			<td>
				<p:inputText id="suppPhoneNo" size="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scSupplierAddress.phoneFull}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.fax.no']}" />
			</td>
			<td>
				<p:inputText id="suppFaxNo" size="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scSupplierAddress.faxFull}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" />
			</td>
			<td>
				<p:inputText id="suppMobNo" size="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scSupplierAddress.contactMobileFull}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
			</td>
			<td>
				<p:inputText id="suppContact" size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scSupplierAddress.contactPerson}"
					disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.email']}" />
			</td>
			<td>
				<p:inputText id="suppEmail" size="30" style=" margin-bottom:5px;"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scSupplierAddress.contactEmail}"
					disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loi.details.section']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="21%" style="vertical-align: top;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.title']}" /></td>
				<td colspan="3"><c:if
						test="#{lOIDetailBackingBean.managedBean.scLoi.brandNew}">
						<p:inputTextarea id="title"
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.title}"
							maxlength="500" rows="3"
							readonly="#{lOIDetailBackingBean.managedBean.readOnly}"
							label="#{lbl['lbl.sc.loiloa.loi.title']}"
							style="width: 670px;margin-bottom: 5px;">
							<f:ajax></f:ajax>
						</p:inputTextarea>

					</c:if> <c:if test="#{!lOIDetailBackingBean.managedBean.scLoi.brandNew}">
						<p:inputTextarea id="title"
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.title}"
							maxlength="500" rows="3" disabled="true"
							label="#{lbl['lbl.sc.loiloa.loi.title']}" 
							style="width: 670px;margin-bottom: 5px;">
						</p:inputTextarea>
					</c:if></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.fileno']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.fileNo}" size="38" />
					<p:spacer width="3px"></p:spacer> <p:inputText disabled="true"
						size="5"
						value="#{lOIDetailBackingBean.managedBean.scLoi.fileExtnNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loi.issue']}" /></td>
				<td><p:inputText size="50"
						value="#{lOIDetailBackingBean.managedBean.scLoi.issueDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.res.due.date']}" /></td>
				<td>
				<c:if test="#{isPendingSubmissionStatus}">
					<p:selectOneMenu id="responseDate"
						value="#{lOIDetailBackingBean.managedBean.scLoi.loiResponseDate}"
						style="width: 100px;margin-bottom: 10px;"
						label="#{lbl['lbl.sc.days']}"
						disabled="#{!isEditableStatus or lOIDetailBackingBean.managedBean.readOnly}" >
						<f:selectItems 
							value="#{lOIDetailBackingBean.getDropdownCodeValues(ParameterTypeConst.loiResponsePeriod)}" />
						<p:ajax event="change"
							process="@this" partialSubmit="true" update="dueDate"
							listener="#{lOIDetailBackingBean.dueDateChange}" /> #{lbl['lbl.sc.days']}
					</p:selectOneMenu><ui:param name="days" value="#{lOIDetailBackingBean.retrivemessage(lOIDetailBackingBean.managedBean.scLoi.ackDueDate)}"></ui:param>
					<ac:iconTooltip value="#{days}" /><p:inputText id="dueDate" size="38" disabled="true"
						value="#{lOIDetailBackingBean.managedBean.scLoi.ackDueDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="10px" /> 
				</c:if>
				<c:if test="#{!isPendingSubmissionStatus or lOIDetailBackingBean.managedBean.readOnly}">
					<p:inputText styleClass="ppRightBtn"
						value="#{!empty lOIDetailBackingBean.managedBean.scLoi.ackDueDate ? DateUtils.getDaysDifference(lOIDetailBackingBean.managedBean.scLoi.issueDate, lOIDetailBackingBean.managedBean.scLoi.ackDueDate) : ''}"
						disabled="true" size="4" readonly="true" /> #{lbl['lbl.sc.days']}
					<ui:param name="days" value="#{lOIDetailBackingBean.retrivemessage(lOIDetailBackingBean.managedBean.scLoi.ackDueDate)}" />
					<ac:iconTooltip value="#{days}" /><p:inputText size="30" disabled="true"
						value="#{lOIDetailBackingBean.managedBean.scLoi.ackDueDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="10px" /> 
				</c:if>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.appr.req.field']}" />
						<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" /></td>
				<td>
				
				  <table>
					<tr>
						<td>
							    <p:selectOneRadio  styleClass="commonLabel"
									disabled="#{!isPendingSubmissionStatus or lOIDetailBackingBean.managedBean.readOnly}"
									value="#{lOIDetailBackingBean.managedBean.scLoi.approvalReq}">
									<f:selectItems
										value="#{lOIDetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
										<p:ajax event="change" listener="#{lOIDetailBackingBean.approverRequiredEvent}"
									    partialSubmit="true" process="@this" update="menuTab menuTabAnother" />
								</p:selectOneRadio>
					    </td>
						<td style="margin-top: -3px">
							<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.req.verification.approval.tooltip']}" />
						</td>
					</tr>
				</table>
					
				</td>
			</tr>
			
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loi.signer']}" id="loiSignerId"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="22%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.signer']}" /> <p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td>
					<c:if test="#{isEditableStatus and (isPendingSubmissionStatus or isPendingApprovalStatus or isPendingRevisionStatus)}">
						<p:selectOneMenu id="contractSigner" 
						disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
							value="#{lOIDetailBackingBean.managedBean.contractSignerUser.userId}"
							style="width: 276px;margin-bottom: 5px;"
							required="#{!lOIDetailBackingBean.managedBean.readOnly}"
							label="#{lbl['lbl.sc.loiloa.loi.signer']}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
							<f:selectItems value="#{lOIDetailBackingBean.managedBean.contractSigners}"
								var="contractUser" itemLabel="#{contractUser.userName}"
								itemValue="#{contractUser.userId}" />
								<p:ajax event="change" listener="#{lOIDetailBackingBean.contractSignerEvent}"
						    partialSubmit="true" process="@this" update="@this loiSignerId" />
						</p:selectOneMenu>
						<p:message id="contractSignerMsg" for="contractSigner" display="icon" />
					</c:if>
					<c:if test="#{!isEditableStatus or (!isPendingSubmissionStatus and !isPendingApprovalStatus and !isPendingRevisionStatus)}">
						<p:inputText size="34"
							value="#{lOIDetailBackingBean.managedBean.contractSignerUser.userName}"
							disabled="true" />
					</c:if>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loi.signer.desig']}" />
					<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:inputText id="loiSignerDesigId" disabled="#{!isEditableStatus or lOIDetailBackingBean.managedBean.readOnly}"
						value="#{lOIDetailBackingBean.managedBean.scLoi.loiSignerDesig}"
						size="34" maxlength="100" required="#{!lOIDetailBackingBean.managedBean.readOnly}" label="#{lbl['lbl.sc.loiloa.loi.signer.desig']}">
					</p:inputText><p:message id="loiSignerDesigIdMsg" for="loiSignerDesigId"
										display="icon" /></td>
			</tr>
		</table>
	</p:panel>
	
	<!-- 11134 -start- -->
	<p:outputPanel id="suppRemarksPanel">
		<ac:scRemarkAndAttachment
			remarkList="#{lOIDetailBackingBean.managedBean.supplierRemarks}"
			showAttachment="false" readonly="true"
			rendered="#{not empty lOIDetailBackingBean.managedBean.supplierRemarks}" />
	</p:outputPanel>
	<!-- 11134 -end- -->
	<!-- Bug #30600 , #31033, #32560, #26247 Start -->
	<ac:disciplinaryActionActiveQT voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}"  btnView="true" 
				startDate="#{viewSuppProfileBackingBean.managedBean.startDate}"
				endDate="#{viewSuppProfileBackingBean.managedBean.endDate}"
				isWarning="#{viewSuppProfileBackingBean.managedBean.warning}"/>
	<!-- Bug #30600 , #31033, #32560, #26247 End -->
</ui:composition>
