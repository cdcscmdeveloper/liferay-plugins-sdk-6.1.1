<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<div class="ppRightBtn">
		<p:commandButton immediate="true" value="#{lbl['lbl.btn.back']}" rendered="#{lOIDetailBackingBean.managedBean.editFlag}"
			style="float:left;"
			action="#{lOIDetailBackingBean.backToPervious}" />

		<p:commandButton value="Preview Letter" rendered="#{isPendingSubmissionStatus || isPendingNegotiation}"
			process="@form" update="@all" partialSubmit = "true"
			action="#{lOIDetailBackingBean.previewLetter}"/>
			
					
		<p:commandButton value="#{lbl['lbl.so.save']}"
			action="#{lOIDetailBackingBean.saveAction}"  rendered="#{isEditableStatus}"
			process="@form" update="@form" />
			
		<c:choose>
			<c:when test="#{isPendingSubmissionStatus}">
				<p:commandButton value="#{lbl['lbl.so.submit']}" 
					action="#{lOIDetailBackingBean.submitAction}" 
					process="@form" update="@form"  />
			</c:when>
			<c:when test="#{!empty lOIDetailBackingBean.managedBean.taskId}">
				<ui:repeat var="bpmAction" value="#{lOIDetailBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
					<ui:param name="isReject" value="#{bpmAction == 'REJECT'}" />
					
					<p:commandButton value="#{lbl[buttonLabel]}"  
						styleClass="ui-button"
						action="#{lOIDetailBackingBean.updateBpmTaskAction(bpmAction)}"
						partialSubmit="true"
						process="#{isReject ? '@this' : '@form'}"
						update="#{isReject ? '@this' : '@form'}" />
				</ui:repeat>
			</c:when>
		</c:choose>
	</div>
</ui:composition>
