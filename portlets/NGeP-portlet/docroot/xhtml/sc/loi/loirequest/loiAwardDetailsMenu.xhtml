<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isZonal"
		value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.zonal}" />

	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		id="awardTypeId" toggleable="true">
		<table>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.award.type']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.getParameterDesc(lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.recommendTypeCode)}"
						size="30" /></td>
			</tr>

			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.rec.by']}" /></td>
				<td><p:inputText disabled="true" rendered="#{lOIDetailBackingBean.managedBean.docType ne ParameterConst.directAward}"
						value="#{lOIDetailBackingBean.getParameterDesc(lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.recommendBy)}"
						size="30" />
						
					<p:inputText disabled="true" rendered="#{lOIDetailBackingBean.managedBean.docType eq ParameterConst.directAward}"
						value="#{lOIDetailBackingBean.getParameterDesc(ParameterTypeConst.documentTypes,
					lOIDetailBackingBean.managedBean.docType)}"
						size="30" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.item.list']}" toggleable="false">
		<p:dataTable id="loiItemListId" var="loiloaItem"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
			rowKey="#{itemPrice}" rowIndexVar="index">

			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="3" style="width:15%;white-space:normal;"
						headerText="#{lbl['lbl.sc.loiloa.loi.item']}" />

					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" />

					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" />

					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.duration.month']}" />


					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" />

					<p:column rowspan="3" headerText="#{lbl['lbl.sc.loiloa.loi.qty']}" />
					<p:column rowspan="3" headerText="#{lbl['lbl.sc.loiloa.loi.uom']}" />
					
					<p:column rowspan="3" headerText="#{lbl['lbl.sc.loiloa.loi.unit.price']}"  rendered="#{!isPendingNegotiation}"/>
					<p:column rowspan="3" headerText="#{lbl['lbl.sc.loiloa.loi.sub.total']}"  rendered="#{!isPendingNegotiation}"/>

					<p:column colspan="2" style="white-space:normal;text-align:left;"
						headerText="#{lbl['lbl.sc.loiloa.loi.original.offer.price']}"
						rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}" />
					<p:column colspan="2" style="white-space:normal;text-align:left;"
						rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}"
						headerText="#{lbl['lbl.sc.loiloa.loi.after.nego.offer.price']}" />
				</p:row>
				<p:row rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<p:column headerText="#{lbl['lbl.sc.loiloa.loi.per.unit']}"
						style="white-space:normal;text-align:right;" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.loi.total.price']}"
						style="white-space:normal;text-align:right;" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.loi.per.unit']}"
						style="white-space:normal;text-align:right;" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.loi.total.price']}"
						style="white-space:normal;text-align:right;" />
				</p:row>
			</p:columnGroup>

			<p:column style="width:15%;white-space:normal;">
                   #{loiloaItem.scRequestItem.itemName}
             </p:column>

			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column>
				<h:outputText value="#{loiloaItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column>
               #{loiloaItem.scRequestItem.uom.uomName}
            </p:column>
            
            
            <p:column  style="width:10%;text-align:right;" rendered="#{!isPendingNegotiation}">
				<h:outputText value="#{loiloaItem.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.loi.total']}" />
				</f:facet>	
			</p:column>

			<p:column style="width:7%;text-align:right;" rendered="#{!isPendingNegotiation}">
				<h:outputText value="#{loiloaItem.subTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				
				<f:facet name="footer">
					<h:outputText value="#{lOIDetailBackingBean.managedBean.scLoi.loiAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>
            

			<p:column style="width:10%; text-align:right;"
				rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<h:outputText value="#{loiloaItem.scQtRecommendDtl.scQtProposalItem.offerPrice}" />
					
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.loi.total']}" />
				</f:facet>
			</p:column>

			<p:column style="width:10%; text-align:right;"
				rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}">
				  <h:outputText value="#{loiloaItem.subTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>
				
				<f:facet name="footer">
					<h:outputText
						value="#{lOIDetailBackingBean.managedBean.scLoi.loiAmt}">
						 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>

			<p:column style="width:10%; text-align:right;"
				rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}">
				<p:inputText size="4" value="#{loiloaItem.unitPrice}" style="text-align:right;">
				 <p:ajax event="blur" partialSubmit="true" process="@form" update="@all" listener="#{lOIDetailBackingBean.priceKeyInEvent()}"/>
				 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.loi.total']}" />
				</f:facet>
			</p:column>
			
			<p:column style="width:10%; text-align:right;"
				rendered="#{isPendingNegotiation and lOIDetailBackingBean.managedBean.hideColumnFlag}">
				<h:outputText value="#{loiloaItem.afterNegoSubTotal}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>

				<f:facet name="footer">
					<h:outputText
						value="#{lOIDetailBackingBean.managedBean.scLoi.afterNegoTotal}">
						 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>
		</p:dataTable>

	</p:panel>

	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
