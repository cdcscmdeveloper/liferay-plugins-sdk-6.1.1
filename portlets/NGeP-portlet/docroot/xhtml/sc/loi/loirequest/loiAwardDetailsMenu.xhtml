<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isBiddingAward" value="#{lOIDetailBackingBean.managedBean.scLoi.recommendBy.parameterCode eq ParameterConst.recommendByOnlineBidding}" />
    <ui:param name="isRefinalizedBidding" value="#{lOIDetailBackingBean.managedBean.refinalizedBidding}" />
     
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		id="afterNegoAwardDetails" toggleable="true">
		<table>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.award.type']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.getParameterDesc(lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.recommendTypeCode)}"
						size="30" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.recommend.by']}" /></td>
				<td><p:inputText disabled="true" 
						value="#{lOIDetailBackingBean.getParameterDesc(lOIDetailBackingBean.managedBean.scLoi.recommendBy)}"
						size="30" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<p:dataTable id="afterNegoItemList" var="loiLoaItem"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{itemPrice}" rowIndexVar="index">
	       <ac:paginator for="afterNegoItemList" />
			
			<p:columnGroup type="header">
				<p:row>
				  <p:column style="width:10%;white-space:normal;"  rendered="#{isZonal}"
						headerText="#{lbl['lbl.sc.zone']}" />
				
					<p:column style="width:15%;white-space:normal;"
						headerText="#{lbl['lbl.sc.item']}" />

					<p:column style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" />

					<p:column style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" />

					<p:column style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.duration.month']}" />

					<p:column style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" />

					<p:column headerText="#{lbl['lbl.sc.quantity']}" />
					
					<p:column headerText="#{lbl['lbl.sc.uom']}" />
					
					<p:column  headerText="#{lbl['lbl.sc.unit.price']}"/>
					
					<p:column  headerText="#{lbl['lbl.sc.sub.total']}"/>
				</p:row>
			
			</p:columnGroup>
			
			<p:column style="width:15%;white-space:normal;" rendered="#{isZonal}">
                <p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{loiLoaItem.tplSpecZoneDtl}" />
					
					<h:outputText value="#{loiLoaItem.tplSpecZoneDtl.zoneName}" />
			 </p:commandLink>
           </p:column>

			<p:column style="width:15%;white-space:normal;">
                   #{loiLoaItem.scRequestItem.itemName}
             </p:column>

			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column  style="width:10%;text-align:right;">
				<h:panelGroup rendered="#{!empty loiLoaItem.tplSpecTierQty}">
					<h:outputText value="#{loiLoaItem.tplSpecTierQty.fromQty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{empty loiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{!empty loiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value="#{loiLoaItem.tplSpecTierQty.toQty}" rendered="#{!empty loiLoaItem.tplSpecTierQty.toQty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
					</h:outputText>
				</h:panelGroup>
				<h:outputText value="#{loiLoaItem.qty}" rendered="#{loiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
				</h:outputText>
			</p:column>
			
			<p:column>
                  #{loiLoaItem.scRequestItem.uom.uomName}
            </p:column>
            
            <p:column  style="width:10%;text-align:right;">
				<h:outputText value="#{loiLoaItem.scQtProposalItem.finalPrice}" rendered="#{isBiddingAward or isRefinalizedBidding}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				
				<h:outputText value="#{loiLoaItem.scQtProposalItem.offerPrice}" rendered="#{!isBiddingAward and !isRefinalizedBidding}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.total']}" />
				</f:facet>	
			</p:column>

			<p:column style="width:7%;text-align:right;">
			   <h:panelGroup rendered="#{isBiddingAward or isRefinalizedBidding}">  
			       <h:outputText value="#{loiLoaItem.bidFinalPriceSubTotal}" rendered="#{loiLoaItem.tplSpecTierQty eq null}">
					   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>
		       </h:panelGroup>
			  
			  <h:panelGroup rendered="#{!isBiddingAward and !isRefinalizedBidding}">  		
				<h:outputText value="#{loiLoaItem.offeredPriceSubTotal}" rendered="#{loiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				</h:panelGroup>
				<f:facet name="footer">
				      <h:outputText
						value="#{lOIDetailBackingBean.managedBean.scLoi.bidFinalPriceTotal}" rendered="#{isBiddingAward or isRefinalizedBidding}">
						 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					<h:outputText value="#{lOIDetailBackingBean.managedBean.scLoi.offeredPriceTotal}" rendered="#{!isBiddingAward and !isRefinalizedBidding}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>
            
		</p:dataTable>

	</p:panel>
</ui:composition>
