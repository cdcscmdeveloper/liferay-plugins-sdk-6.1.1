<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
		
	<ui:param name="isBiddingAward" value="#{lOIDetailBackingBean.managedBean.scLoi.recommendBy.parameterCode eq ParameterConst.recommendByOnlineBidding}" />
	<ui:param name="isAwardMultiple" value="#{lOIDetailBackingBean.managedBean.scLoi.recommendBy.parameterCode eq ParameterConst.recommendByMultipleAward}" />
	<ui:param name="isAwardSingle" value="#{lOIDetailBackingBean.managedBean.scLoi.recommendBy.parameterCode eq ParameterConst.recommendBySingleAward}" />
   	<ui:param name="isMultipleLOI" value="#{lOIDetailBackingBean.managedBean.scLoi.recommendBy.parameterCode eq ParameterConst.recommendByMultipleLoi}" />
   	<ui:param name="isAward" value="#{lOIDetailBackingBean.managedBean.scLoi.recommendBy.parameterCode eq ParameterConst.recommendByAward}" />
	<ui:param name="lblAfterNegoOrBidding" value="#{isBiddingAward ? 'lbl.sc.loiloa.loi.after.bidding.offer.price' : 'lbl.sc.loiloa.after.nego.offer.price'}" />
    <ui:param name="isRefinalizedBidding" value="#{lOIDetailBackingBean.managedBean.refinalizedBidding}" />
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		id="awardTypeId" toggleable="true">
		<table>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.award.type']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.getParameterDesc(lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.recommendTypeCode)}"
						size="30" /></td>
			</tr>

			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.recommend.by']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.getParameterDesc(lOIDetailBackingBean.managedBean.scLoi.recommendBy)}"
						size="30" /> </td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<p:dataTable id="loiItemListId" var="loiLoaItem"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
			rowKey="#{itemPrice}" rowIndexVar="index">
             <ac:paginator for="loiItemListId" />
			<p:columnGroup type="header">
				<p:row>
				 <p:column  rowspan="3" style="width:8%;white-space:normal;"  rendered="#{isZonal}"
						headerText="#{lbl['lbl.sc.zone']}" />
				
					<p:column rowspan="3" style="width:15%;white-space:normal;"
						headerText="#{lbl['lbl.sc.item']}" />

					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" />

					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" />

					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.duration.month']}" />


					<p:column rowspan="3" style="white-space:normal;text-align:right;"
						headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" />

					<p:column rowspan="3" headerText="#{lbl['lbl.sc.quantity']}" />
					<p:column rowspan="3" headerText="#{lbl['lbl.sc.uom']}" />
					
					<p:column rowspan="3" headerText="#{lbl['lbl.sc.unit.price']}"  rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}"/>
					<p:column rowspan="3" headerText="#{lbl['lbl.sc.sub.total']}"  rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}"/>

					<p:column colspan="2" style="white-space:normal;text-align:center;"
						headerText="#{lbl['lbl.sc.loiloa.original.offer.price']}"
						rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}" />
					<p:column colspan="2" style="white-space:normal;text-align:center;"
						rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}"
						headerText="#{lbl[lblAfterNegoOrBidding]}" />
				</p:row>
				<p:row rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
					<p:column headerText="#{lbl['lbl.sc.loiloa.per.unit']}"
						style="white-space:normal;text-align:right;" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.total.price']}"
						style="white-space:normal;text-align:right;" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.per.unit']}"
						style="white-space:normal;text-align:right;" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.total.price']}"
						style="white-space:normal;text-align:right;" />
				</p:row>
			</p:columnGroup>

            <p:column style="width:15%;white-space:normal;" rendered="#{isZonal}">
                <p:commandLink id="zoneName"
                disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{loiLoaItem.tplSpecZoneDtl}" />
					
					<h:outputText value="#{loiLoaItem.tplSpecZoneDtl.zoneName}" />
			 </p:commandLink>
           </p:column>
			<p:column style="width:15%;white-space:normal;">
                   #{loiLoaItem.scRequestItem.itemName}
             </p:column>

			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
			</p:column>
			
			<p:column style="width:10%; text-align:right;">
				<h:outputText
					value="#{loiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column  style="width:10%;text-align:right;">
				
				<h:panelGroup rendered="#{!empty loiLoaItem.tplSpecTierQty}">
					<h:outputText value="#{loiLoaItem.tplSpecTierQty.fromQty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{empty loiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{!empty loiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value="#{loiLoaItem.tplSpecTierQty.toQty}" rendered="#{!empty loiLoaItem.tplSpecTierQty.toQty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
					</h:outputText>
				</h:panelGroup>
				<h:outputText value="#{loiLoaItem.qty}" rendered="#{loiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, loiLoaItem.scRequestItem.uom)}" />
				</h:outputText>
				
			</p:column>
			
			<p:column>
               #{loiLoaItem.scRequestItem.uom.uomName}
            </p:column>
            
            <p:column  style="width:10%;text-align:right;" rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}">
				<h:outputText value="#{loiLoaItem.scQtProposalItem.finalPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.total']}" />
				</f:facet>	
			</p:column>

			<p:column style="width:7%;text-align:right;" rendered="#{!lOIDetailBackingBean.managedBean.hideColumnFlag}">
				<h:outputText value="#{loiLoaItem.afterNegoSubTotal}" rendered="#{loiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
				
				<f:facet name="footer">
					<h:outputText value="#{lOIDetailBackingBean.managedBean.scLoi.afterNegoTotal}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>
            

			<p:column style="width:10%; text-align:right;"
				rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
				   <h:outputText value="#{loiLoaItem.scQtProposalItem.finalPrice}" rendered="#{isRefinalizedBidding}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>
					
				
					<h:outputText value="#{loiLoaItem.scQtProposalItem.offerPrice}" rendered="#{!isRefinalizedBidding}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
					
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.total']}" />
				</f:facet>
			</p:column>

			<p:column style="width:10%; text-align:right;"
				rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
				   <h:outputText value="#{loiLoaItem.bidFinalPriceSubTotal}" rendered="#{isRefinalizedBidding}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>
				  
				 
				  <h:outputText value="#{loiLoaItem.offeredPriceSubTotal}" rendered="#{!isRefinalizedBidding and loiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>
				
				<f:facet name="footer">
				<h:outputText rendered="#{isRefinalizedBidding}"
						value="#{lOIDetailBackingBean.managedBean.scLoi.bidFinalPriceTotal}">
						 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				
					<h:outputText rendered="#{!isRefinalizedBidding}"
						value="#{lOIDetailBackingBean.managedBean.scLoi.offeredPriceTotal}">
						 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>
			
			<p:column style="width:10%; text-align:right;"
				rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
				<p:inputText size="10" value="#{loiLoaItem.scQtProposalItem.finalPrice}" style="text-align:right;" disabled="true" rendered="#{isBiddingAward}">
				   <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				
				<p:inputText size="10" value="#{loiLoaItem.unitPrice}" style="text-align:right;" disabled="#{lOIDetailBackingBean.managedBean.readOnly}" rendered="#{!isBiddingAward}">
				    <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				   <p:ajax event="blur" partialSubmit="true" process="@form" update="@all" listener="#{lOIDetailBackingBean.priceKeyInEvent()}"/>
				</p:inputText>
				
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.total']}" />
				</f:facet>
			</p:column>
			
			<p:column style="width:10%; text-align:right;"
				rendered="#{lOIDetailBackingBean.managedBean.hideColumnFlag}">
				<h:outputText value="#{loiLoaItem.afterNegoSubTotal}" rendered="#{loiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				  </h:outputText>

				<f:facet name="footer">
					<h:outputText
						value="#{lOIDetailBackingBean.managedBean.scLoi.afterNegoTotal}">
						 <f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
			</p:column>
		</p:dataTable>

	</p:panel>
</ui:composition>
