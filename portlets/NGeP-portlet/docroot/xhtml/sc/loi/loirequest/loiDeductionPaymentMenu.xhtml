<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.deduction.payment']}"  id="deductionPayid" toggleable="true">

		<p:dataTable id="deductTbl" widgetVar="deductTblWidget"
			var="scQtDeduction"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scQtDeductions}"
			selection="#{lOIDetailBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{scQtDeduction}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selectionMode="single">

			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update=":form:clausePnl" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update=":form:clausePnl" />

			<ac:paginator for="deductTbl" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{isEditableStatus}" />
					<h:outputText value="#{lbl['lbl.sc.deduction.type']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.deduction.type.tooltip']}" />
				</f:facet>

				<c:if test="#{isEditableStatus}">
					<p:selectOneMenu id="deductionType" label="#{lbl['lbl.sc.deduction.type']}"
						value="#{scQtDeduction.deductionType.parameterId}" required="true">
						<f:selectItems
							value="#{lOIDetailBackingBean.getDeductionItemTypeDropdownList()}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form:deductionPayid, deductionPayAmtId"
							oncomplete="deductTblWidget.unselectAllRows(); deductTblWidget.selectRow(#{rowIndex}, true);"
							listener="#{lOIDetailBackingBean.deductionTypeChange(scQtDeduction)}" />
					</p:selectOneMenu>
					<p:message id="deductionTypeMsg" for="deductionType" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus}">
					#{lOIDetailBackingBean.getParameterDesc(scQtDeduction.deductionType)}
				</c:if>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.deduction.amount']}">
				<h:panelGroup id="deductionPayAmtId">
					<p:inputText id="amtid" size="30" maxlength="18" required="true"
						label="#{lbl['lbl.sc.deduction.amount']}"
						value="#{scQtDeduction.deductionAmount}"
						disabled="#{!isPendingNegotiation}"
						style="margin-right:5px;text-align:right;"
						rendered="#{scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeFixed}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							maxIntegerDigits="14"></ac:validateNumber>
					</p:inputText>
					<p:message id="amtidMsg" for="amtid" display="icon" />
				</h:panelGroup>
			</p:column>

		</p:dataTable>

		<c:if test="#{isEditableStatus}">
			<div class="ppRightBtn BtnSpacing">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
					process="@this, deductTbl" partialSubmit="true"
					action="#{lOIDetailBackingBean.addDeductionPaymentAction}"
					oncomplete="deductTblWidget.paginator.endLink.click();"
					rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
					update="deductTbl" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					process="@this, deductTbl" partialSubmit="true"
					oncomplete="deductionPayDeletePopUp.show();"
					rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
					update="@([id$=#{deductionPayDeleteId}])" />
			</div>
			<ac:confirmationPopup id="deductionPayDeleteId"
				widget="deductionPayDeletePopUp"
				okAction="lOIDetailBackingBean.deleteDeductionPayment" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		</c:if>
		
		<h:outputText value="#{lbl['lbl.sc.deduction.payment']} >" />
		<h:outputText value="#{lbl['lbl.sc.deduction.clauses']} " />
		<h:outputText style="margin-left: 140px;" value="#{lOIDetailBackingBean.managedBean.clausesTitle}" />
		<h:panelGroup id="clausePnl">

			<p:dataTable id="deductClauseTbl" widgetVar="deductClauseTblWidget"
				var="scQtDeductionClause"
				value="#{lOIDetailBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
				selection="#{lOIDetailBackingBean.managedBean.selectedDeductionClauses}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{scQtDeductionClause}" rowIndexVar="rowIndex">

				<ac:paginator for="deductClauseTbl" />

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column style="white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory"
							rendered="#{isEditableStatus}" />
						<h:outputText value="#{lbl['lbl.sc.deduction.clause']}" />
					</f:facet>

					<h:panelGroup rendered="#{empty scQtDeductionClause.pmClause}">
						<p:inputTextarea value="#{scQtDeductionClause.clauseDesc}" 
						    required="true" id="clauseId"
						    label="#{lbl['lbl.sc.deduction.clause']}"
							rows="2" maxlength="500" style=" margin-bottom:5px; width:790px"
							rendered="#{isEditableStatus}">
							<p:ajax event="keyup" />
						</p:inputTextarea>
                      <p:message id="clauseIdMsg" for="clauseId" display="icon" />
                      
						<h:outputText value="#{scQtDeductionClause.clauseDesc}"
							rendered="#{!isEditableStatus}" />
					</h:panelGroup>

					<h:outputText escape="false"
						value="#{scQtDeductionClause.pmClause.clauseDesc}"
						rendered="#{!empty scQtDeductionClause.pmClause}" />

				</p:column>

			</p:dataTable>

			<div class="ppRightBtn BtnSpacing">
				<h:panelGroup
					rendered="#{!empty lOIDetailBackingBean.managedBean.selectedScQtDeduction and lOIDetailBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers and isEditableStatus}">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						process="@this, deductClauseTbl" partialSubmit="true"
						action="#{lOIDetailBackingBean.addDeductionClauseAction}"
						rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
						oncomplete="deductClauseTblWidget.paginator.endLink.click();"
						update="deductClauseTbl" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this, deductClauseTbl" partialSubmit="true"
						oncomplete="deductionClauseDeletePopUp.show();"
						rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
						update="@([id$=#{deductionClauseDeleteId}])" />

				</h:panelGroup>
			
			</div>
			<ac:confirmationPopup id="deductionClauseDeleteId"
				widget="deductionClauseDeletePopUp"
				okAction="lOIDetailBackingBean.deleteDeductionClause" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
			
	</h:panelGroup>
	</p:panel>
</ui:composition>
