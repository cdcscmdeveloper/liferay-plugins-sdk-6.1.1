<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="loiMaintMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<ui:param name="isPendingSubmissionStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scWorkFlowStatus.pmStatus.statusId == QTStatusConst.LOI_PENDING_SUBMISSION}" />
		<ui:param name="isPendingApprovalStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scWorkFlowStatus.pmStatus.statusId == QTStatusConst.LOI_PENDING_APPROVAL}" />
		<ui:param name="isPendingRevisionStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scWorkFlowStatus.pmStatus.statusId == QTStatusConst.LOI_PENDING_REVISION}" />
		
		
		<ui:param name="isPendingNegotiation"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scWorkFlowStatus.pmStatus.statusId == QTStatusConst.LOI_PENDING_NEGOTIATION}" />
		<ui:param name="isEditableStatus"
			value="#{isPendingSubmissionStatus || ((isPendingApprovalStatus|| isPendingRevisionStatus || isPendingNegotiation) and !empty lOIDetailBackingBean.managedBean.taskId)}" />
		<ui:param name="isSupplierAckStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scWorkFlowStatus.pmStatus.statusId == QTStatusConst.LOI_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		<ui:param name="afterNegotiation"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scWorkFlowStatus.pmStatus.statusId > QTStatusConst.LOI_PENDING_NEGOTIATION}" />
	     <ui:param name="isFulfillmentType"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeAsAndWhen}" />

		<ui:include src="loiButtons.xhtml" />

		<ui:include src="loiDetailsHeader.xhtml" />

	  <ac:gpkiPopup textBeforeSign="#{lOIDetailBackingBean.textBeforeSign}"
			postSignAction="#{lOIDetailBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%;" valign="top" class="sidemenutd">
				  <p:tabMenu
						activeIndex="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
						styleClass="sidemenu">
						<p:menuitem value="#{lbl['lbl.sc.loiloa.loi.details']}"
							update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.loiloa.award.details']}"
						   update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.loiloa.nego.details']}"
							rendered="#{!isPendingNegotiation}" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.approval.details']}"
							update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="#{!isPendingNegotiation ? 3 : 2}" />
						</p:menuitem>
						
						<p:menuitem value="#{lbl['lbl.sc.negotiation.result']}"
							update="@form" 	rendered="#{isPendingNegotiation}" >
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="3" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}"
							update="@form" 	rendered="#{isPendingNegotiation}" >
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="4" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}"
							update="@form" 	rendered="#{isPendingNegotiation and !isFulfillmentType}">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="5"  />
						</p:menuitem>
					</p:tabMenu>			
					</td>
				<td width="80%" valign="top"><h:panelGroup>
						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '0'}">
							<ui:include src="loiDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == '1' and not isPendingNegotiation}">
							<ui:include src="loiAwardDetailsMenu.xhtml" />
						</c:if>

                         <c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == '1' and isPendingNegotiation}">
							<ui:include src="loiAfterNegoAwardDetails.xhtml" />
						</c:if>
						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == '2' and not isPendingNegotiation}">
							<ui:include src="loiNegotiationDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == (isPendingNegotiation ? 2 : 3)}">
							<ui:include src="loiApprovalMenu.xhtml" />
						</c:if>
						
						<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 3 and isPendingNegotiation}">
							<ui:include src="loiAfterNegoMenu.xhtml"/>
						</c:if>
						
						<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 4 and isPendingNegotiation}">
							<ui:include src="loiDeductionPaymentMenu.xhtml" />
						</c:if>
						
						<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 5 and isPendingNegotiation and !isFulfillmentType}">
							<ui:include src="loiFulfilmentSchedule.xhtml" />
						</c:if>
					</h:panelGroup></td>
			</tr>
		</table>
		<p:dialog id="loiSuppAttmPopup" widgetVar="loiSuppAttmPopupDlg" 
			modal="true" resizable="false" width="700px" height="200" styleClass="pop_up_top" 
			header="#{lbl['lbl.txt.choose.files']}">
			
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;"
				fileUploadListener="#{lOIDetailBackingBean.handleSuppDocFileUpload}"
				mode="advanced" id="uploadattachment"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
				update="@form" oncomplete="loiSuppAttmPopupDlg.hide()">
			</p:fileUpload>
		</p:dialog>

		<ui:include src="loiPreviewLetterPopup.xhtml" />
	</ui:define>
</ui:composition>
