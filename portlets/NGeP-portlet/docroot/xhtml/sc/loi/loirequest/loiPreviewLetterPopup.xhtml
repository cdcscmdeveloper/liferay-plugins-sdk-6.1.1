<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="loiPrvLetterDlg" widgetVar="loiLetterDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="1000px"
		height="500px" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.loiloa.loi.letter']}">
		<p:media value="#{lOIDetailBackingBean.managedBean.streamedContent}"
			width="100%" height="450px" player="pdf" />

		<div class="ppRightBtn" style="width: 100%">
			<p:commandButton value="#{lbl['lbl.sc.close']}" process="@this"
				styleClass="BtnSpacing" onclick="loiLetterDlg.hide()" />
		</div>

	</p:dialog>
</ui:composition>
