<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.loiloa.nego.loc']}" />
			<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.nego.loc.tooltip']}" />
		</f:facet>
		<p:dataTable id="negoloctbl" var="negoloc"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoLocations}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" rowKey="#{negoloc}" rowIndexVar="rowIndex">
			<ac:paginator for="negoloctbl" />

			<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selectAllNegoLoc"
						value="#{lOIDetailBackingBean.flag}"
						rendered="#{isEditableStatus}">
						<p:ajax partialSubmit="true" process="@this" update="negoloctbl"
							listener="#{lOIDetailBackingBean.selectAllNegoLocations}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{negoloc.selected}">
						<p:ajax partialSubmit="true" process="@this" update="negoloctbl" />
				</p:selectBooleanCheckbox>
			</p:column>
			

			<p:column style="width:40%">
				<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.location']}"/>
				</f:facet>
				<p:inputText value="#{negoloc.negoLocation}" id="negLocId" label="#{lbl['lbl.sc.location']}" maxlength="255"
				size="30" disabled="#{!isEditableStatus or afterNegotiation or lOIDetailBackingBean.managedBean.readOnly}" required="#{!negoloc.selected}"/>
				<p:message id="negLocIdMsg" for="negLocId" display="icon" />
			</p:column>

			<p:column style="width:10%">
				<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.date']}"/>
				</f:facet>
				<p:calendar id="date" readonlyInput="true" disabled="#{!isEditableStatus or afterNegotiation or lOIDetailBackingBean.managedBean.readOnly}" required="#{!negoloc.selected}" label="#{lbl['lbl.sc.date']}"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" showOn="button"
					mindate="#{DateUtils.getCurrentDate()}"
					size="12" value="#{negoloc.negoDate}" />
					<p:message id="dateMsg" for="date" display="icon" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}"
				style="width:40%">
				<p:inputText id="remarksId" value="#{negoloc.remark}" label="#{lbl['lbl.sc.remarks']}"
				  size="30" maxlength="200" disabled="#{!isEditableStatus or afterNegotiation or lOIDetailBackingBean.managedBean.readOnly}"/>
				<p:message id="remarksIdMsg" for="remarksId" display="icon" />
			</p:column>

		</p:dataTable>
		<div align="right" class="BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				process="@this,negoloctbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationLocation}"
				update="negoloctbl"
				rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
				process="@this negoloctbl" partialSubmit="true"
				oncomplete="negoLocationDeletePopUp.show();"
				update="@([id$=#{negoLocationDeleteId}])" />
		</div>
		<ac:confirmationPopup id="negoLocationDeleteId"
			widget="negoLocationDeletePopUp"
			okAction="lOIDetailBackingBean.deleteNegoLocations" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />

	</p:panel>

	<p:panel id="negoTermId" header="#{lbl['lbl.sc.loiloa.nego.term']}"
		toggleable="true">
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.loiloa.nego.term.instruction']}" escape="false" />
			
		<p:dataTable id="negoTermstbl" var="negoTerm"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoTerms}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{negoTerm}" rowIndexVar="rowIndex">

			<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk"
						value="#{lOIDetailBackingBean.flag}"
						rendered="#{isEditableStatus}">
						<p:ajax partialSubmit="true" process="@this" update="negoTermstbl"
							listener="#{lOIDetailBackingBean.selectAll}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{negoTerm.selectedTerm}"
					disabled="#{!empty negoTerm.pmTerm}">
					<p:ajax partialSubmit="true" process="@this" update="@form"
						listener="#{lOIDetailBackingBean.negoTermPriceEvent()}" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}"
				style="width:#{isPendingNegotiation ? '45%' : '80%'}">
				<c:if test="#{!isEditableStatus or afterNegotiation}">
					<h:outputText value="#{negoTerm.termDesc}" />
				</c:if>

				<c:if test="#{isEditableStatus and !afterNegotiation}">
					<h:outputText value="#{negoTerm.termDesc}"
						rendered="#{!empty negoTerm.pmTerm}" />

					<p:inputTextarea cols="#{isPendingNegotiation ? '70' : '110'}"
					readonly="#{lOIDetailBackingBean.managedBean.readOnly}"
						rows="2" value="#{negoTerm.termDesc}" autoResize="false"
						maxlength="1000"
						rendered="#{empty negoTerm.pmTerm}" />
				</c:if>

			</p:column>

			<p:column style="width:45%" rendered="#{isPendingNegotiation}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{isEditableStatus and !afterNegotiation}" />
					<h:outputText value="#{lbl['lbl.sc.loiloa.nego.results']}" />
				</f:facet>
				<c:if test="#{!isEditableStatus or afterNegotiation}">
					<h:outputText value="#{negoTerm.negoResult}" />
				</c:if>

				<c:if test="#{isEditableStatus and !afterNegotiation}">
					<p:inputTextarea style="width:400px" rows="2" maxlength="255" value="#{negoTerm.negoResult}" 
						autoResize="false" readonly="#{lOIDetailBackingBean.managedBean.readOnly}">
						<p:ajax partialSubmit="true" process="@this" update="@this" />
					</p:inputTextarea>
				</c:if>
			</p:column>
			
			<p:column rendered="#{isPendingSubmissionStatus or isPendingRevisionStatus}" style="text-align: center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.selection']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.selection.loi.negotiate.tooltip']}" />
				</f:facet>
				<p:selectBooleanCheckbox value="#{negoTerm.selected}"
					disabled="#{empty negoTerm.pmTerm or lOIDetailBackingBean.managedBean.readOnly}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
		</p:dataTable>

		<div align="right" class="BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				process="@this negoTermstbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationTerm}"
				update="negoTermstbl"
				rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
			disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
				rendered="#{lOIDetailBackingBean.managedBean.buttonFlag}"
				process="@this negoTermstbl" partialSubmit="true"
				oncomplete="negoTermDeletePopUp.show();"
				update="@([id$=#{negoTermDeleteId}])" />
		</div>
		<ac:confirmationPopup id="negoTermDeleteId"
			widget="negoTermDeletePopUp"
			okAction="lOIDetailBackingBean.deleteNegoTerm" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />

	</p:panel>
</ui:composition>
