<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.nego.loc']}" toggleable="true" rendered="#{not isPendingNegotiation}">
		<p:dataTable id="negoloctbl" var="negoloc"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoLocations}"
			selection="#{lOIDetailBackingBean.managedBean.selectedNegoLocationList}"
			rows="10" rowKey="#{negoloc}" rowIndexVar="rowIndex">
			<ac:paginator for="negoloctbl" />
			<p:column selectionMode="multiple" style="width:2%" rendered="#{isEditableStatus}" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.location']}"
				style="width:40%">
				<p:inputText value="#{negoloc.negoLocation}" size="30" disabled="#{!isEditableStatus or afterNegotiation}"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.date']}"
				style="width:10%">
				<p:calendar id="date" disabled="#{!isEditableStatus or afterNegotiation}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
					size="12" value="#{negoloc.negoDate}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.remarks']}"
				style="width:40%">
				<p:inputText value="#{negoloc.remark}" size="30" disabled="#{!isEditableStatus or afterNegotiation}"/>
			</p:column>

		</p:dataTable>
		<p:spacer height="10px" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
				process="@this,negoloctbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationLocation}"
				update="negoloctbl" icon="ui-icon-add" 
				rendered="#{!afterNegotiation and isEditableStatus}"/>

			<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
			    action="#{lOIDetailBackingBean.deleteNegoLocations}" 
			    update="negoloctbl" rendered="#{!afterNegotiation and isEditableStatus}"
				process="@this negoloctbl" partialSubmit="true" icon="ui-icon-delete" />
		</div>

	</p:panel>

	<p:panel id="negoTermId" header="#{lbl['lbl.sc.loiloa.nego.term']}"
		toggleable="true">
		<p:dataTable id="negoTermstbl" var="negoTerm"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scNegoTerms}"
			selection="#{lOIDetailBackingBean.managedBean.selectedNegoTermsList}"
		    rowKey="#{negoTerm}" rowIndexVar="rowIndex">
		
			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{!empty negoTerm.pmTerm}"
				rendered="#{isEditableStatus}" />
            
			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.terms']}"
				style="width:#{isPendingNegotiation ? '45%' : '80%'}">
				<c:if test="#{!isEditableStatus or afterNegotiation}">
					<h:outputText value="#{negoTerm.termDesc}" />
				</c:if>

				<c:if test="#{isEditableStatus and !afterNegotiation}">
					<h:outputText value="#{negoTerm.termDesc}" rendered="#{!empty negoTerm.pmTerm}" />
					
					<p:inputTextarea  cols="#{isPendingNegotiation ? '70' : '140'}" rows="2"
						value="#{negoTerm.termDesc}" autoResize="false"
						rendered="#{empty negoTerm.pmTerm}" />
				</c:if>

			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.loiloa.nego.results']}"
				style="width:45%" rendered="#{isPendingNegotiation}">
				<c:if test="#{!isEditableStatus or afterNegotiation}">
					<h:outputText value="#{negoTerm.negoResult}" />
				</c:if>

				<c:if test="#{isEditableStatus and !afterNegotiation}">
					<p:inputTextarea  cols="70" rows="2"
						value="#{negoTerm.negoResult}" autoResize="false" >
						<p:ajax partialSubmit="true" process="@this" update="@this" />
					</p:inputTextarea>
				</c:if>
			</p:column>

			<p:column headerText="Negotiate" rendered="#{isPendingSubmissionStatus}">
				<p:selectBooleanCheckbox value="#{negoTerm.selected}" disabled="#{empty negoTerm.pmTerm}">
						<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>


		</p:dataTable>
		<p:spacer height="10px" />

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
				process="@this negoTermstbl" partialSubmit="true"
				action="#{lOIDetailBackingBean.addNegotiationTerm}"
				update="negoTermstbl" icon="ui-icon-add" rendered="#{!afterNegotiation and isEditableStatus}"/>

			<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}" rendered="#{!afterNegotiation and isEditableStatus}"
			   action="#{lOIDetailBackingBean.deleteNegoTerm}" update="negoTermstbl"
				process="@this negoTermstbl" partialSubmit="true" icon="ui-icon-delete" />
		</div>

	</p:panel>
</ui:composition>
