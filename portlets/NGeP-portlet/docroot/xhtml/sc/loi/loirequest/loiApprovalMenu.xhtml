<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.loi.signer']}" id="loiSignerId"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.signer']}" /> <p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td>
					<c:if test="#{isEditableStatus and (isPendingSubmissionStatus or isPendingApprovalStatus or isPendingRevisionStatus)}">
						<p:selectOneMenu id="contractSigner" 
						disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
							value="#{lOIDetailBackingBean.managedBean.contractSignerUser.userId}"
							style="width: 276px;margin-bottom: 5px;"
							required="true"
							label="#{lbl['lbl.sc.loiloa.loi.signer']}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
							<f:selectItems value="#{lOIDetailBackingBean.managedBean.contractSigners}"
								var="contractUser" itemLabel="#{contractUser.userName}"
								itemValue="#{contractUser.userId}" />
								<p:ajax event="change" listener="#{lOIDetailBackingBean.contractSignerEvent}"
						    partialSubmit="true" process="@this" update="@this loiSignerId" />
						</p:selectOneMenu>
						<p:message id="contractSignerMsg" for="contractSigner" display="icon" />
					</c:if>
					<c:if test="#{!isEditableStatus or (!isPendingSubmissionStatus and !isPendingApprovalStatus and !isPendingRevisionStatus)}">
						<p:inputText size="34"
							value="#{lOIDetailBackingBean.managedBean.contractSignerUser.userName}"
							disabled="true" />
					</c:if>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loi.signer.desig']}" />
					<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:inputText id="loiSignerDesigId" disabled="#{!isEditableStatus or lOIDetailBackingBean.managedBean.readOnly}"
						value="#{lOIDetailBackingBean.managedBean.scLoi.loiSignerDesig}"
						size="34" maxlength="100" required="true" label="#{lbl['lbl.sc.loiloa.loi.signer.desig']}">
					</p:inputText><p:message id="loiSignerDesigIdMsg" for="loiSignerDesigId"
										display="icon" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.request.for.approval']}" rendered="#{lOIDetailBackingBean.managedBean.scLoi.approvalReq}"
		id="approvalId" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td width="20%"><p:outputLabel value="#{lbl['lbl.sc.approver']}" /> 
				  <p:outputLabel value="*" styleClass="mandatory"/></td>
				<td><p:selectOneMenu id="loiApprover"
						value="#{lOIDetailBackingBean.managedBean.approverUser.userId}"
						disabled="#{!isPendingSubmissionStatus or lOIDetailBackingBean.managedBean.readOnly}"
						required="#{lOIDetailBackingBean.managedBean.scLoi.approvalReq}"
						label="#{lbl['lbl.sc.approver']}"
						style="width: 276px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{lOIDetailBackingBean.managedBean.approverNames}"
							var="appName" itemLabel="#{appName.userName}"
							itemValue="#{appName.userId}" />
					</p:selectOneMenu><p:message id="loiApproverMsg" for="loiApprover"
						display="icon" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" width="15%"></td>

				<td class="TableFieldRight"><p:dataGrid id="catatan"
						value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" style="vertical-align: top;" align="left">
									<h:graphicImage
										value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" />
								</td>
								<td width="6"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
									<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea style="width:350px;" maxlength="1000"
								readonly="#{lOIDetailBackingBean.managedBean.readOnly}"
										value="#{remarkVar.remark}" rendered="#{remarkIndex==0}"
										id="remark" /> <h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkIndex>0}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>

							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable id="apprHistTbl" var="scLoiApproval"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiApproval}">
			
			<ac:paginator for="apprHistTbl" />
			
			<p:column headerText="#{lbl['lbl.sc.approved.by']}" style="width:40%">
				#{scLoiApproval.approver.userName}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:35%">
				#{lOADetailBackingBean.getApprovalActionDisplayName(scLoiApproval.approverAction)}
		
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.date']}" style="width:25%">
				<h:outputText value="#{scLoiApproval.approverActionDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
