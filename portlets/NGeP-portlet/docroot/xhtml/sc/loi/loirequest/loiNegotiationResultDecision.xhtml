<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.negotiation.result']}" id="resultNegoId"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.loi.nego.result.instruction']}" escape="false" />
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.decision']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><c:choose>
						<c:when test="#{!isNotReachAgreement and !readOnlyTask}">
							<p:selectOneMenu id="decisionId"
								required="#{not empty param['skipsubmitvalidation']}"
								style="margin-bottom:5px;width:210px;"
								label="#{lbl['lbl.sc.decision']}"
								value="#{lOIDetailBackingBean.managedBean.decisionCode}">
								<f:selectItems
									value="#{createQtBB.getDropdownValues(ParameterTypeConst.loiNegoDecisionType)}" />
							</p:selectOneMenu>															
							<p:message id="decisionMsg" for="decisionId" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="decisionTxt"
								value="#{createQtBB.getParameterDesc(lOIDetailBackingBean.managedBean.decision)}"
								style="width:200px;" disabled="true" />
						</c:otherwise>
					</c:choose></td>
			</tr>

			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.justification']}" /></td>
				<td colspan="3"><p:inputTextarea id="justificationId"
						disabled="#{readOnlyTask or isNotReachAgreement}" label="#{lbl['lbl.sc.justification']}"
						required="#{not empty param['skipvalidation']}"
						value="#{lOIDetailBackingBean.managedBean.justification}"
						cols="110" rows="3" onkeyup="limitTextArea(this,1000);"
						onkeydown="limitTextArea(this,1000);"
						onmouseout="limitTextArea(this,1000);"
						style=" margin-bottom:5px; width: 714px;" maxlength="1000">
					</p:inputTextarea> <p:message id="justificationMsg" for="justificationId"
						display="icon" /></td>
			</tr>


		</table>

		<p:dialog id="submitNegoConfirmId" widgetVar="submitNegoConfirmPopUp"
			header="#{lbl['lbl.sc.confirmation']}" resizable="false" width="30%"
			height="100" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.sc.nego.result.decision']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					onclick="submitNegoConfirmPopUp.hide(); blockWidget.show();"
					oncomplete="blockWidget.hide();" partialSubmit="true"
					process="@form" update="@form"
					action="#{lOIDetailBackingBean.updateBpmTaskAction('SUBMIT')}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="submitNegoConfirmPopUp.hide();" type="button"
					partialSubmit="true" process="@this" />
			</div>
		</p:dialog>


	</p:panel>

</ui:composition>
