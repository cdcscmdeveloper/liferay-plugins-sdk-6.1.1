<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		toggleable="true">
		<table>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.award.type']}" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.managedBean.scQtFinalization.recommendedType}" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="Recommended By" /></td>
				<td><p:inputText disabled="true"
						value="#{lOIDetailBackingBean.managedBean.recommend.recommendBy.parameterCode}" /></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.item.list']}" toggleable="true">
		<p:dataTable id="itemtbl" var="itemList"  
			value="#{lOIDetailBackingBean.managedBean.scQtItemList}" rows="10"
			rowIndexVar="rowIndex">
			<ac:paginator for="itemtbl" />
			<p:column headerText="#{lbl['lbl.sc.loiloa.item.name']}">
				<h:outputText value="#{itemList.itemName}" />
			</p:column>

           	<p:column headerText="Qty">
				<h:outputText value="#{itemList.minqty}" />
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.loiloa.item.uom']}">
				<h:outputText value="#{itemList.pmUom.uomName}" />
			</p:column>

			<p:column headerText="Unit Price(RM)">
				<h:outputText value="#{itemList.quantitye}" />
			</p:column>

            <p:column headerText="Sub Total(RM)">
				<h:outputText value="#{itemList.quantitye}" />
			</p:column>
  
		</p:dataTable>
    <p:spacer height="5px"></p:spacer>
		<div class="ppRightBtn">
			<table>
				<tr>
					<td style="width: 100%;"><p:outputLabel value="Total" /></td>
					<td><p:inputText disabled="true" /></td>
				</tr>
			</table>
		</div>

	</p:panel>
	

</ui:composition>
