<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="loiPrvLetterDlg" widgetVar="loiLetterDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="1000px"
		height="500px" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.loiloa.loi.letter']}">
		<p:media value="#{lOIDetailBackingBean.loiLetterStreamContent}"
			width="100%" height="450px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.close']}"
						onclick="loiLetterDlg.hide()" icon="ui-icon-cancel" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
