<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="ItemDetailsPopup" widgetVar="ItemDetailsPopup" dynamic="true"
		modal="true" header="Item Details" width="690" height="300"
		resizable="true">
		<h:panelGroup>
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
					<td><p:inputText disabled="true" size="60"
							value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.smSupplier.companyName}" /></td>
				</tr>

			</table>
		</h:panelGroup>

		<h:panelGroup>
			<p:spacer height="15px" />
			<p:dataTable id="itemDtl" var="loiloaItem"
				value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoaItems}"
				rowKey="#{itemPrice}" rowIndexVar="index">

				<p:column headerText="#{lbl['lbl.sc.loiloa.loi.zone']}" style="width:30%">
					<p:inputText value="zone"
						disabled="true" style="text-align:right;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loi.item']}" style="width:10%">
					<p:inputText value="#{loiloaItem.scRequestItem.itemName}"
						style="text-align:right;" disabled="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loi.qty']}" style="width:10%">
					<p:inputText value="#{loiloaItem.scRequestItem.quantity}"
						style="text-align:right;" disabled="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loi.uom']}"
					style="width:20%">
					<p:inputText value="#{loiloaItem.scRequestItem.uom.uomCode}"
						style="text-align:right;" disabled="true" />
				</p:column>

			</p:dataTable>
		</h:panelGroup>
		<p:spacer height="4px" />
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.close']}"
						onclick="ItemDetailsPopup.hide()" icon="ui-icon-cancel" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
