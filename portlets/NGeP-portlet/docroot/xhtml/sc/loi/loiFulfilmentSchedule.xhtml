<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isDocTypeQuotation"
		value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.docType == ParameterConst.doctypeQuotation}" />
	<ui:param name="isDocTypePurchaseRequest"
		value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.docType == ParameterConst.doctypePurchaseRequest}" />
	<h:panelGroup id="frequency">
		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{isDocTypePurchaseRequest or (isDocTypeQuotation and lOIDetailBackingBean.managedBean.scQt.scheduleType == 'F')}">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:outputLabel value="#{lbl['lbl.sc.spec.total.frequency']}"></h:outputLabel>
					<p:inputText disabled="#{!isEditableStatus}"
						value="#{lOIDetailBackingBean.managedBean.totalFrequency}">
						<p:ajax event="blur" update="frequencySchedule"
							partialSubmit="true" process="@this"
							listener="#{lOIDetailBackingBean.addScheduleDetails}" />
					</p:inputText>
				</h:panelGrid>
				<p:dataTable id="frequencySchedule" var="frequency"
					rowIndexVar="index"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scQtSchedules}">
					<ac:paginator for="frequencySchedule" />

					<p:column headerText="#{lbl['lbl.sc.spec.schedule.no']}" style="width:25%">
						<h:outputText value="#{frequency.scheduleNo}"  id="scheduleNum">
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.start.month']}"
						style="width:10%">
						<p:selectOneMenu style="width:100px;" required="true" disabled="#{!isEditableStatus}"
							value="#{frequency.startMonth}">
							<f:selectItems value="#{lOIDetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"
								listener="#{lOIDetailBackingBean.calculateScheduleMonths(frequency)}" />
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.spec.freq.schedule.start.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{frequency.startYear}" disabled="#{!isEditableStatus}"
							style="width:100px;" required="true">
							<f:selectItems value="#{lOIDetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"
								listener="#{lOIDetailBackingBean.calculateScheduleMonths(frequency)}" />
						</p:selectOneMenu>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.end.month']}"
						style="width:25%">
						<p:selectOneMenu style="width:100px;" required="true" disabled="#{!isEditableStatus}"
							value="#{frequency.endMonth}">

							<f:selectItems value="#{lOIDetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								partialSubmit="true"
								listener="#{lOIDetailBackingBean.calculateScheduleMonths(frequency)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.freq.schedule.end.year']}" 
						style="width:15%">
						<p:selectOneMenu value="#{frequency.endYear}" style="width:100px;" disabled="#{!isEditableStatus}"
							required="true">
							<f:selectItems value="#{lOIDetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								partialSubmit="true"
								listener="#{lOIDetailBackingBean.calculateScheduleMonths(frequency)}"></p:ajax>
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.spec.freq.schedule.total.months']}"
						style="width:10%">
						<h:panelGroup id="scheduleDetails">
							<h:outputText style="text-align:right"
								value="#{frequency.totalMonths}"></h:outputText>
						</h:panelGroup>
					</p:column>

					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.ct.fulfilment.type']}" />
						</f:facet>

						<p:selectOneMenu style="width:120px;" required="true" disabled="#{!isEditableStatus}"
							id="scheduledTypeId" label="#{lbl['lbl.ct.fulfilment.type']}"
							value="#{frequency.scheduleType.parameterId}">

							<f:selectItems
								value="#{lOIDetailBackingBean.getDropdownValues(ParameterTypeConst.scheduleType)}" />
							<p:message id="freqScheduledTypeId" for="scheduledTypeId"
								display="icon"></p:message>
						</p:selectOneMenu>
					</p:column>
				</p:dataTable>
				<p:spacer height="20"></p:spacer>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>

	<h:panelGroup id="progressive">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true"
				rendered="#{isDocTypeQuotation and lOIDetailBackingBean.managedBean.scQt.scheduleType == 'P'}">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:outputLabel value="#{lbl['lbl.sc.spec.total.phase']}"></h:outputLabel>
					<p:inputText
						value="#{lOIDetailBackingBean.managedBean.totalProgressivePayment}">
						<p:ajax event="blur" update="progressivePayment"
							partialSubmit="true" process="@this"
							listener="#{lOIDetailBackingBean.addProgressiveDetails}" />
					</p:inputText>
				</h:panelGrid>
				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index"
					value="#{lOIDetailBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />

					<p:column style="width:10%" headerText="#{lbl['lbl.sc.spec.phase']}">		
						<h:outputText value="#{payment.phaseNo}"  id="progressivePhase">
						</h:outputText>
					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50"
							required="true" id="progressivePhasedesc" style="width:100px;">
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.from']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;"
							value="#{payment.startMonth}">
							<f:selectItems value="#{lOIDetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.spec.freq.schedule.start.year']}"
						style="width:15%">

						<p:selectOneMenu value="#{payment.startYear}" style="width:100px;">
							<f:selectItems
								value="#{lOIDetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.to']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;" value="#{payment.endMonth}">

							<f:selectItems value="#{lOIDetailBackingBean.yearDetails}">
							</f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.freq.schedule.end.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{payment.endYear}" style="width:100px;">
							<f:selectItems
								value="#{lOIDetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.weight.percent']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true"
							id="progressivePercentage" style="width:100px;"
							label="#{lbl['lbl.sc.spec.weight.percent']}" maxlength="18">
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>
				</p:dataTable>
				<p:spacer height="20"></p:spacer>
			</p:panel>
	</h:panelGroup>
</ui:composition>
