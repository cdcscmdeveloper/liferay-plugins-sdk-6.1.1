<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:messages id="loiMaintMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<ui:param name="isPendingSubmissionStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId == QTStatusConst.LOI_PENDING_SUBMISSION}" />
		<ui:param name="isEditableStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId == QTStatusConst.LOI_PENDING_SUBMISSION || lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId == QTStatusConst.LOI_PENDING_APPROVAL || lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId == QTStatusConst.LOI_PENDING_REVISION}" />
		<ui:param name="isSupplierAckStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId == QTStatusConst.LOI_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		<ui:param name="isAfterSupplierResponseStatus"
			value="#{lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId > QTStatusConst.LOI_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />

		<ui:include src="loiButtons.xhtml" />

		<ui:include src="loiDetailsHeader.xhtml" />



		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%;" class="sidemenutd"
					style="vertical-align: baseline;"><p:tabMenu
						activeIndex="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
						styleClass="sidemenu" style="display : table-caption;">
						<p:menuitem value="#{lbl['lbl.sc.loiloa.loi.details']}"
							update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.loiloa.award.details']}"
							rendered="#{!isSupplierAckStatus}" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.loiloa.nego.details']}"
							rendered="#{!isSupplierAckStatus}" update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.loiloa.approve.details']}"
							update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="#{!isSupplierAckStatus ? 3 : 1}" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}"
							update="@form" 	rendered="#{isSupplierAckStatus}" >
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="2" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}"
							update="@form" 	rendered="#{isSupplierAckStatus}">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="3"  />
						</p:menuitem>
					</p:tabMenu></td>
				<td width="80%"><h:panelGroup>
						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '0'}">
							<ui:include src="loiDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '1'}">
							<ui:include src="loiAwardDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '2'}">
							<ui:include src="loiNegotiationDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex eq '3'}">
							<ui:include src="loiApprovalMenu.xhtml" />
						</c:if>
						
						<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 2 and isSupplierAckStatus}">
							<ui:include src="loiDeductionPaymentMenu.xhtml" />
						</c:if>
						
						<c:if test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 3 and isSupplierAckStatus}">
							<ui:include src="loiFulfilmentSchedule.xhtml" />
						</c:if>
					</h:panelGroup></td>
			</tr>
		</table>

		<ui:include src="loiPreviewLetterPopup.xhtml" />
	</ui:define>
</ui:composition>
