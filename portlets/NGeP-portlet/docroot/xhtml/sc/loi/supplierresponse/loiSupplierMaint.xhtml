<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages id="loiMaintMsg" showDetail="true" autoUpdate="#{lOIDetailBackingBean.managedBean.autoUpdate}"
			closable="true" showSummary="false" severity="error, info" />
		<ui:param name="isSupplierAckStatus" value="#{lOIDetailBackingBean.managedBean.scLoi.pmStatus.statusId == QTStatusConst.LOI_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		
		<ui:include src="loiSupplierButtons.xhtml" />
		<ui:include src="loiSupplierHeader.xhtml" />

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						id="mainTabMenu"
						activeIndex="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
						styleClass="sidemenu">

						<p:menuitem value="#{lbl['lbl.sc.loiloa.loi.details']}"
							update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="0" />
						</p:menuitem>

						<p:menuitem value="#{lbl['lbl.sc.loiloa.letter.of.intent']}"
							update="@form">
							<f:setPropertyActionListener
								target="#{lOIDetailBackingBean.managedBean.selectedTabIndex}"
								value="1" />
						</p:menuitem>

					</p:tabMenu></td>
				<td width="80%">
					<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.loiloa.supplier.response.instruction']}" escape="false" />
					
						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="loiDetailsSupplierMenu.xhtml" />
						</c:if>
						<c:if
							test="#{lOIDetailBackingBean.managedBean.selectedTabIndex == 1}">
							<ui:include src="loiLetterOfAcceptanceView.xhtml" />
						</c:if>

					</td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
