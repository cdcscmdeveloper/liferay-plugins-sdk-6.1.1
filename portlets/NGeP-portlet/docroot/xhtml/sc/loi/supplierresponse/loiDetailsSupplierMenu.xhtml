<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<c:if test="#{!isDocTypeQuotation}">
		<tr>
			<td width="16%">
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
			</td>
			<td>
				<p:inputText size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.epNo}"
					disabled="true" />
			</td>
		</tr>
		</c:if>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</td>
			<td>
				<p:inputText size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.mofNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</td>
			<td>
				<p:inputText size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.supplierName}"
					disabled="true" />
				<p:spacer width="5" />
				<p:commandLink oncomplete="suppDetailsPopup.show();return false;" process="@this" 
				disabled="#{lOIDetailBackingBean.managedBean.readOnly}"
					update="@([id$=suppDetailsPopupId])">
					
					<p:graphicImage library="/css/images/design/evaluate.png" title="#{lbl['lbl.sc.view.companyinfo']}" style="vertical-align:middle" />
					
					<f:setPropertyActionListener value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiLoa.smSupplier}" 
						target="#{supplierDetailBackingBean.smSupplier}" />
				</p:commandLink>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}" />
			</td>
			<td>
				<p:inputText id="branch" size="50"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierBranch}"
					disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>
	<ui:include src="/xhtml/sc/common/supplierDetailsPopup.xhtml" />
	
</ui:composition>
