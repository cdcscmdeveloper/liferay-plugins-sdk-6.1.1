<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sc.loiloa.approve.details']}" 
		toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loi.appr.req']}" /></td>
				<td colspan="3"><p:selectOneRadio
						value="#{lOIDetailBackingBean.managedBean.scLoi.approvalReq}">
						<f:selectItems
							value="#{lOIDetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" update="approversId" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.approver']}" /></td>
				<td><p:selectOneMenu id="approversId" value="#{lOIDetailBackingBean.managedBean.reqApprove}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{lOIDetailBackingBean.managedBean.approverNames}"
							var="appName" itemLabel="#{appName.userName}"
							itemValue="#{appName.userId}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel label="REMARK" header="REMARK" toggleable="true" toggleSpeed="500">
	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="12%"></td>
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{lOIDetailBackingBean.managedBean.scLoi.scLoiRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{lOIDetailBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUser.userName}"/>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;" id="remarks" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}"  maxlength="1000"/>
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;"/>
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>
	</p:panel>

	<p:panel header="History" toggleable="true">
		<p:dataTable id="itemtbl" var="itemList"
			value="#{lOIDetailBackingBean.managedBean.scQtItemList}" rows="10"
			rowIndexVar="rowIndex">
			<p:column headerText="Approved By">
				<h:outputText value="#{itemList.itemName}" />
			</p:column>

			<p:column headerText="Status">
				<h:outputText value="#{itemList.minqty}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.loiloa.item.uom']}">
				<h:outputText value="#{itemList.pmUom.uomName}" />
			</p:column>

			<p:column headerText="Date">
				<h:outputText value="#{itemList.quantitye}" />
			</p:column>

		</p:dataTable>
	</p:panel>



</ui:composition>
