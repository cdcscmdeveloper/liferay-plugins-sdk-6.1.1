<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.business.owner']}"></ac:title> -->
		<p:messages id="businessOwnerTechmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.backAction}" />


			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
				style="float:right;" icon="ui-icon-cancel"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
				action="#{specificationBackingBean.cancelSpecAction('BO')}"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.sc.spec.btn.complete']}"
				style="float:right;" icon="ui-icon-check" update="@all"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
				action="#{specificationBackingBean.completeTemplateSpecDetails('BO',1)}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;"
				disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
				action="#{specificationBackingBean.saveTemplateSpecDetails('BO',1)}"
				icon="ui-icon-save" update="@all" />

		</div>
		<p:spacer height="75"></p:spacer>
		<!-- 	<ui:include src="/xhtml/sc/main/templateMaintenanceheader.xhtml"></ui:include> -->
		<p:panel header="#{lbl['lbl.sc.tpl.head.section']}" toggleable="true">


			<table>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.tpl.main.title']}"></h:outputLabel></td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
							style="margin-bottom:5px;" maxlength="200"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.tpl.search.item']}" />
						<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode.parameterCode eq '3'}">
							<p:selectOneMenu id="itemTypeSelectId" required="true"
								disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
								label="#{lbl['lbl.sc.tpl.search.item']}"
								value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode.parameterId}">
								<f:selectItems
									value="#{specificationBackingBean.getRoleTypeDropdownValues(ParameterTypeConst.scItemType)}"></f:selectItems>
							</p:selectOneMenu>
							<p:message id="itemTypeMessagespec" for="itemTypeSelectId"
								display="icon"></p:message>
						</ui:fragment> <ui:fragment
							rendered="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode.parameterCode ne '3'}">

							<p:inputText disabled="true" size="30"
								value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}" />
						</ui:fragment></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.search.spec']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

				</tr>

				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
					<td><p:selectOneRadio
							disabled="#{specificationBackingBean.managedBean.taskName eq 'Specification Approval'}"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode.parameterId}">
							<f:selectItems
								value="#{specificationBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
						</p:selectOneRadio></td>
				</tr>

				<tr>

					<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.template.status']}" /></td>
					<td><p:inputText disabled="true"
							value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
					<td><p:selectOneRadio
							value="#{specificationBackingBean.managedBean.templateSpecBean.specMaster.weightageReq}">
							<f:selectItems
								value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />


							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{templateSpecBackingBean.updateItemWeightageReq(specificationBackingBean.managedBean.templateSpecBean)}" />

						</p:selectOneRadio></td>
				</tr>

			</table>



		</p:panel>



		<ac:templateSpec
			templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}"
			editable="#{specificationBackingBean.managedBean.taskName ne 'Specification Approval'}" />






	</ui:define>


</ui:composition>
