<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<p:messages id="templateMaintenancemessages" showDetail="true"
		autoUpdate="true" closable="true" />
	<ui:define name="contentSection">

		<div>
			<p:commandButton value="Back" style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.backAction}" />
		
			
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
				style="float:right;" icon="ui-icon-cancel" action="#{specificationBackingBean.backAction}"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;"
				action="#{specificationBackingBean.saveTemplateSpec(null,'1')}"
				icon="ui-icon-save" />

		</div>
		<p:spacer height="40"></p:spacer>
		<!-- 	<ui:include src="/xhtml/sc/main/templateMaintenanceheader.xhtml"></ui:include> -->
		<p:panel header="#{lbl['lbl.sc.tpl.head.section']}" toggleable="true"
			style="width:100%;">


			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.main.title']}"></h:outputLabel>
					</td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							value="#{specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.specName}" /></td>
				</tr>

				<tr>
					<td><h:outputLabel value="Item Type" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.itemTypeCode)}" /></td>
					<td><h:outputLabel value="Specification Type" /></td>
					<td><p:inputText  disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.specTypeCode)}" /></td>

				</tr>

				<tr>

					<td><h:outputLabel value="Local Goods" /></td>
					<td><p:selectOneRadio id="estimated">
							<f:selectItem itemLabel="Yes" itemValue="true" />
							<f:selectItem itemLabel="No" itemValue="false" />

						</p:selectOneRadio></td>
				</tr>
				
				<tr>

					<td><h:outputLabel value="Status" /></td>
					<td><p:inputText disabled="true"
							value="#{specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.status.statusId}"></p:inputText></td>
				</tr>

			</table>



		</p:panel>


		





	</ui:define>


</ui:composition>
