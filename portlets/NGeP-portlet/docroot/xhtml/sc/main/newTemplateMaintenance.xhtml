<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<ac:title value="#{lbl['lbl.sc.spec.business.owner']}"></ac:title>
		<p:messages id="boTemplatespecCreate" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{specificationBackingBean.backAction}" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}"
				style="float:right;" icon="ui-icon-cancel"
				action="#{specificationBackingBean.backAction}"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.sc.spec.btn.complete']}"
				style="float:right;" icon="ui-icon-check"
				action="#{specificationBackingBean.completeTemplateSpec(null)}"
				update="@all" />
			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;"
				action="#{specificationBackingBean.saveTemplateSpec(null,'1',null)}"
				icon="ui-icon-save" update="@all" />

		</div>
		<div class="clear"></div>
		<p:spacer height="40"></p:spacer>
		<!-- 	<ui:include src="/xhtml/sc/main/templateMaintenanceheader.xhtml"></ui:include> -->
		<p:panel header="#{lbl['lbl.sc.tpl.head.section']}" toggleable="true"
			style="width:100%;">


			<table>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.tpl.main.title']}"></h:outputLabel></td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							style="margin-bottom:5px;" maxlength="200"
							value="#{specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.specName}" /></td>
				</tr>

				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.search.item']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.itemTypeCode)}" /></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.search.spec']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.specTypeCode)}" /></td>

				</tr>

				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
					<td><p:selectOneRadio id="estimated"
							value="#{specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.itemOriginCode.parameterId}">
							<f:selectItems
								value="#{specificationBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
						</p:selectOneRadio></td>
				</tr>

				<tr>

					<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.template.status']}" /></td>
					<td><p:inputText disabled="true"
							value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scqtDoc.tplSpecMaster.status.statusId)}"></p:inputText></td>
				</tr>

			</table>



		</p:panel>


		<ac:templateSpec
			templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}" />





	</ui:define>


</ui:composition>
