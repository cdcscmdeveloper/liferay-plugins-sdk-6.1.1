<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:dialog widgetVar="createOwnerSpec" modal="true" width="1000"
		id="bocreateSpec" height="500">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.business.owner']}"></ac:title> -->
		<p:messages id="bocreateTemplate" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:panel header="#{lbl['lbl.sc.tpl.search']}" id="searchBospec">

			<table>
				<tr>
					<td style="width: 175px;"><p:outputLabel
							value="#{lbl['lbl.sc.spec.template.spec.standard.template']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio required="true"
							label="#{lbl['lbl.sc.spec.template.spec.standard.template']}"
							id="tempSpecStandardTemplate"
							value="#{specificationBackingBean.managedBean.standardTemplate}">
							<f:selectItem itemLabel="Yes" itemValue="ST"></f:selectItem>
							<f:selectItem itemLabel="No" itemValue="SC"></f:selectItem>
							<p:ajax event="change"
								listener="#{specificationBackingBean.templateChange}"
								update="cretaeupdate,createList"></p:ajax>

						</p:selectOneRadio> <p:message id="strdTemplate" for="tempSpecStandardTemplate"
							display="icon"></p:message></td>
				</tr>
			</table>

			<h:panelGroup id="cretaeupdate">
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.standardTemplate eq 'ST'}">
					<table>
						<tr>
							<td style="width: 150px;"><p:outputLabel
									value="#{lbl['lbl.sc.tpl.search.item']}"></p:outputLabel> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu style="margin-bottom:5px;"
									required="#{specificationBackingBean.managedBean.required}"
									label="#{lbl['lbl.sc.tpl.search.item']}"
									id="templateSpecItemType"
									value="#{specificationBackingBean.managedBean.searchItemTypeId}">
									<f:selectItems
										value="#{specificationBackingBean.getRoleTypeDropdownValues(ParameterTypeConst.scItemType)}" />
									<p:ajax event="change"
										listener="#{specificationBackingBean.itemTypeChange}"
										update="searchBospec"></p:ajax>

								</p:selectOneMenu> <p:message id="boItemType" for="templateSpecItemType"
									display="icon"></p:message></td>
						</tr>
					</table>
				</ui:fragment>
				<ui:fragment
					rendered="#{specificationBackingBean.managedBean.standardTemplate eq 'SC'}">
					<table width="100%">
						<tr>
							<td style="width: 115px;"><p:outputLabel
									value="#{lbl['lbl.sc.tpl.search.item']}"></p:outputLabel> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu 
									required="#{specificationBackingBean.managedBean.required}"
									label="#{lbl['lbl.sc.tpl.search.item']}"
									id="sourcingSpecItemType"
									value="#{specificationBackingBean.managedBean.searchItemTypeId}" style="margin-bottom:5px;">
									<f:selectItems
										value="#{specificationBackingBean.getRoleTypeDropdownValues(ParameterTypeConst.scItemType)}" />

									<p:ajax event="change"
										listener="#{specificationBackingBean.itemTypeChange}"
										update="searchBospec"></p:ajax>
								</p:selectOneMenu> <p:message id="sourcingBoItemType" for="sourcingSpecItemType"
									display="icon"></p:message></td>
						</tr>
						
						<tr>
							<td style="width: 115px;"><h:outputLabel
									value="#{lbl['lbl.sc.tpl.search.title']}"></h:outputLabel></td>
							<td colspan="3"><p:inputText size="113" style="margin-bottom:5px;"
									maxlength="100"
									value="#{specificationBackingBean.managedBean.specName}" /></td>
						</tr>
						
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.so.title']}" /></td>
							<td colspan="3"><p:inputText
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.qtTitle}"
									size="113" maxlength="100" /></td>
						</tr>
						
						<tr>
							<td style="width: 115px;"><h:outputLabel
									value="#{lbl['lbl.sc.tpl.search.qtn.no']}"></h:outputLabel></td>
							<td><p:inputText style="margin-bottom:5px;" maxlength="21" size="29"
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.qtNo}" /></td>
									
							<td><h:outputLabel value="#{lbl['lbl.so.procmode']}" /></td>
							<td><p:selectOneMenu id="procurementid"
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.procurementMode}"
									style="width:210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{qTDetailBB.getProcurementModeDropdownValues()}" />
								</p:selectOneMenu></td>

						</tr>
						
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.so.creatdtfrom']}" /></td>
							<td><p:calendar
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate}"
									id="crdateFrom" showOn="button" size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<p:ajax event="dateSelect" update="crdateTo" />
								</p:calendar></td>
							<td><h:outputLabel value="#{lbl['lbl.so.creatdtto']}" /></td>
							<td><p:calendar id="crdateTo" showOn="button"
									label="#{lbl['lbl.so.creatdtto']}"
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.toCreatedDate}"
									mindate="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate}"
									size="29" readonlyInput="true"
									required="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate ne null or !specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate eq ''}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<f:attribute name="startDate"
										value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate}" />
								</p:calendar></td>
						</tr>
						
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.so.pbldtfrom']}" /></td>
							<td><p:calendar
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromPublishDate}"
									id="pbdateFrom" showOn="button" size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<p:ajax event="dateSelect" update="pbdateTo" />
								</p:calendar></td>
							<td><h:outputLabel value="#{lbl['lbl.so.pbldtto']}" /></td>
							<td><p:calendar id="pbdateTo" showOn="button"
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.toPublishDate}"
									mindate="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromPublishDate}"
									size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<f:attribute name="startDate"
										value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromPublishDate}" />
									<f:validator validatorId="dateRangeValidator" />
								</p:calendar></td>
						</tr>
						
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.so.clsdtfrom']}" /></td>
							<td><p:calendar
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromClosingDate}"
									id="cldateFrom" showOn="button" size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<p:ajax event="dateSelect" update="cldateTo" />
								</p:calendar></td>
							<td><h:outputLabel value="#{lbl['lbl.so.clsdtto']}" /></td>
							<td><p:calendar id="cldateTo" showOn="button"
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.toClosingDate}"
									mindate="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromClosingDate}"
									size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<f:attribute name="startDate"
										value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.fromClosingDate}" />
									<f:validator validatorId="dateRangeValidator" />
								</p:calendar></td>
						</tr>
						
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.so.status']}" /></td>
							<td><p:selectOneMenu
									value="#{specificationBackingBean.managedBean.qtnTendertemplateSearchBean.qtStatus}"
									style="width: 210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{specificationBackingBean.getStatusDropdownValues('SC', 'QT')}" />
								</p:selectOneMenu></td>
						</tr>
						
						<tr>
							<td><h:outputLabel
									value="#{lbl['lbl.sc.tpl.search.procure.category']}"></h:outputLabel></td>
							<td><p:selectOneMenu
									value="#{specificationBackingBean.managedBean.searchProcurementId}" style="width:210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{specificationBackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
								</p:selectOneMenu></td>
						</tr>

					</table>
				</ui:fragment>
			</h:panelGroup>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.tpl.btn.search']}"
					action="#{specificationBackingBean.searchTemplateSpecAction}"
					partialSubmit="true" process="@this,searchBospec"
					update="createList" />
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.reset']}"
					partialSubmit="true" update="searchBospec" process="@this"
					action="#{specificationBackingBean.resetTemplate}" />
			</div>

		</p:panel>

		<p:panel id="listUpdate" header="#{lbl['lbl.sc.tpl.list']}"
			toggleable="true">

			<h:panelGrid style="width:100%;">
				<p:dataTable id="createList" var="tplSpecMaster" rows="10"
					value="#{specificationBackingBean.templateSpecCreate}"
					rowKey="#{tplSpecMaster.specMasterId}" rowIndexVar="index"
					lazy="true">
					<!--   <p:column selectionMode="multiple"  style="text-align:center;"/> -->
					<ac:paginator for="createList"></ac:paginator>

					<p:column headerText="#{lbl['lbl.sc.tpl.search.qtn.no']}"
						style="width:10%;white-space: normal;"
						rendered="#{specificationBackingBean.managedBean.standardTemplate eq 'SC'}">

						<h:outputText value="#{tplSpecMaster.scQtDoc.scQt.qtNo}" />

					</p:column>
					<p:column headerText="#{lbl['lbl.so.title']}"
						style="width:15%;white-space: normal;"
						rendered="#{specificationBackingBean.managedBean.standardTemplate eq 'SC'}">

						<h:outputText value="#{tplSpecMaster.scQtDoc.scQt.qtTitle}" />

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.tpl.search.title']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{tplSpecMaster.specName}"></h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.tpl.search.spec']}"
						style="width:15%;white-space: normal;">
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(tplSpecMaster.specTypeCode)}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.tpl.search.item']}"
						style="width:10%;">
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(tplSpecMaster.itemTypeCode)}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.tpl.search.procure.category']}"
						style="width:20%;white-space: normal;">
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(tplSpecMaster.procurementCategory)}" />
					</p:column>



					<p:column headerText="#{lbl['lbl.sc.tpl.search.action']}"
						style="width:10%;">
						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.standardTemplate eq 'ST'}">
							<p:commandButton value="Create" process="@all"
								update=":form:searchBospec"
								action="#{specificationBackingBean.createTemplateSpec(tplSpecMaster,'BO')}"></p:commandButton>
						</ui:fragment>
						<ui:fragment
							rendered="#{specificationBackingBean.managedBean.standardTemplate eq 'SC'}">
							<p:commandButton value="#{lbl['lbl.sc.tpl.search.btn.clone']}"
								process="@all" update=":form:searchBospec"
								action="#{specificationBackingBean.createTemplateSpec(tplSpecMaster,'BO')}"></p:commandButton>
						</ui:fragment>
					</p:column>

				</p:dataTable>
			</h:panelGrid>


		</p:panel>
		<p:ajax event="close"
			listener="#{specificationBackingBean.closeListener}" />
	</p:dialog>
</ui:composition>
