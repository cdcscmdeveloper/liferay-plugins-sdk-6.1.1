<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<!-- <ac:title value="#{lbl['lbl.sc.spec.specification.committee']}"></ac:title> -->
		<p:messages id="committeeFinancialmessages" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				immediate="true"
				action="#{specificationBackingBean.committeeBackAction}" />

			<p:commandButton value="#{lbl['lbl.btn.complete']}"
				rendered="#{((specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION) or(!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
				style="float:right;" update="@all"
				action="#{specificationBackingBean.completeTemplateSpecDetails('SC',2)}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				rendered="#{((specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION) or(!specificationBackingBean.managedBean.readOnly and  specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
				style="float:right;" update="@all"
				action="#{specificationBackingBean.saveTemplateSpecDetails('SC',2)}" />


		</div>
		<p:spacer height="25" />
		<br />
		<br />
		<!-- 	<ui:include src="/xhtml/sc/main/templateMaintenanceheader.xhtml"></ui:include> -->
		<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">


			<table>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							disabled="true" style="margin-bottom:5px;" maxlength="200"
							value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" /></td>
				</tr>
				<tr>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.sc.item.type']}" /></td>
					<td><p:inputText
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}"
							disabled="true" size="30" /></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.specification.type']}" /></td>
					<td><p:inputText disabled="true" size="30"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

				</tr>
				<tr>

					<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
					<td><p:inputText disabled="true"
							value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode)}"></p:inputText></td>
				</tr>


				<tr>

					<td><h:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:inputText disabled="true"
							value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
					<!-- 	<td><h:outputLabel
							value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
					<td><p:inputText
							value="#{lbl[specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.weightageReq ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
							disabled="true" readonly="true">
						</p:inputText></td> -->
				</tr>
			</table>



		</p:panel>


		<ac:templateSpec
			editable="#{((specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_SUBMISSION ) or (!specificationBackingBean.managedBean.readOnly and specificationBackingBean.managedBean.currentStatusId == QTStatusConst.SPEC_COMMITTEE_PENDING_REVISION))}"
			templateSpecBean="#{specificationBackingBean.managedBean.templateSpecBean}" />





	</ui:define>


</ui:composition>
