
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Search Qtn/Tender" toggleable="true">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.ministry']} " />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.scQt.ministryOrgProfile.orgProfileId}"
					styleClass="minstryclass" style="width: 220px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.ministryList}"
						var="pmOrgProfile"
						itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}" />
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleMinistryProfileChanged}"
						partialSubmit="true" process="@this"
						update="@(.minstryclass, .deptclass, .divisionclass)" />
				</p:selectOneMenu>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.jabatan']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.scQt.departmentOrgProfile.orgProfileId}"
					styleClass="deptclass" style="width: 220px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.departmentList}"
						var="pmOrgProfile"
						itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}" />
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleDepartmentProfileChanged}"
						partialSubmit="true" process="@this"
						update="@(.deptclass, .divisionclass)" />
				</p:selectOneMenu>
			</h:column>


			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.ptj']} " />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgProfileId}"
					styleClass="divisionclass" style="width: 220px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.divisionList}"
						var="pmOrgProfile"
						itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@(.divisionclass)" />
				</p:selectOneMenu>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.title']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.publish.date']}" />
			</h:column>
			<h:column>
				<p:calendar
					value="#{noticeBoardBackingBean.managedBean.scQt.publishDate}"
					id="notdate" showOn="button" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.closing.date']}" />
			</h:column>
			<h:column>
				<p:calendar
					value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}"
					id="closedate" showOn="button" />
			</h:column>


			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.state']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.pmState.stateId}"
					styleClass="stateclass" style="width: 220px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems value="#{noticeBoardBackingBean.managedBean.states}"
						var="state" itemLabel="#{state.stateName}"
						itemValue="#{state.stateId}" />
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleStateChange}"
						partialSubmit="true" process="@this"
						update="@(.stateclass, .districtclass)" />
				</p:selectOneMenu>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.district']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.pmDistrict.districtId}"
					styleClass="districtclass" style="width: 220px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.districts}"
						var="district" itemLabel="#{district.districtName}"
						itemValue="#{district.districtCode}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@(.districtclass)" />
				</p:selectOneMenu>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.category.code']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.pmCategoryL1.categoryL1Id}"
					styleClass="catcode1class" style="width: 220px;">
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleL2CategoryChange}" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.categoryL1s}"
						var="catL1Opt" itemLabel="#{catL1Opt.categoryL1Code}"
						itemValue="#{catL1Opt.categoryL1Id}" />
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleL2CategoryChange}"
						partialSubmit="true" process="@this"
						update="@(.catcode1class, .catcode2class, .catcode3class)" />
				</p:selectOneMenu>
			</h:column> 
   
			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.categoryL2Id}"
					styleClass="catcode2class" style="width: 220px;">
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleL3CategoryChange}" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.categoryL2s}"
						var="catL2Opt" itemLabel="#{catL2Opt.categoryL2Code}"
						itemValue="#{catL2Opt.categoryL2Id}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@(.catcode2class, .catcode3class)" />
				</p:selectOneMenu>
			</h:column> 

			<h:column>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.categoryL3Id}"
					styleClass="catcode3class" style="width: 220px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL3s}"
						var="catL3Opt" itemLabel="#{catL3Opt.categoryL3Code}"
						itemValue="#{catL3Opt.categoryL3Id}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@(.catcode3class)" />
				</p:selectOneMenu>

			</h:column>

		</h:panelGrid>
        <p:spacer height="25px"/>

		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						style="float:right;"
						action="#{noticeBoardBackingBean.searchNoticeBoard}"
						update=":form:nbqtsummary"/>
				</p:column>
			</p:row>
		</p:panelGrid>
		
		<p:spacer height="25px"/>
		
		  <p:outputPanel id="nbqtsummary">
			<p:tabView id="tabViewInfo" var="qtntender" dynamic="true"
				activeIndex="#{noticeBoardBackingBean.managedBean.activeTabIndex}"
				cache="false" orientation="top"
				value="#{noticeBoardBackingBean.managedBean.tabList}">
				<p:ajax event="tabChange"
					listener="#{noticeBoardBackingBean.onTabChange}"
					update=":form:tabViewInfo" />

				 <p:tab title="#{qtntender.title}" id="tabs">
					 <ui:fragment rendered="#{qtntender.title eq 'Price Schedule'}">
					 <ui:include src="/xhtml/sc/notice/noticeboardPriceSchedule.xhtml" />
					 </ui:fragment>
					
                     <ui:fragment rendered="#{qtntender.title ne 'Price Schedule'}">
						<ui:include src="/xhtml/sc/notice/noticeboardQtnTenderSummary.xhtml" />
					 </ui:fragment>
					
				</p:tab>
			</p:tabView>
			</p:outputPanel>
	</p:panel>
</ui:composition>
