<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Schedule" toggleable="true">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
			columns="2" columnClasses="columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.publish.date']}"></h:outputLabel>
			</h:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.publishDate}" readonly="true" disabled="true"></p:inputText>
			</p:column>

			<h:column>
				<h:outputLabel
					value="#{lbl['lbl.sc.notice.board.brief.sameas.sv']}"></h:outputLabel>
			</h:column>

			<p:column>
				<p:inputText
					value="#{bsvAttendanceBackingBean.managedBean.briefSameAsSiteVisit}"
					readonly="true" disabled="true"></p:inputText>
			</p:column>

		</h:panelGrid>

		<p:spacer height="5" />

		<p:panel header="Briefing Details">
			<p:dataTable id="briefingDeails" var="scQtBriefing"
				value="#{bsvAttendanceBackingBean.managedBean.briefingDetailsList}"
				rows="10"
				selection="#{bsvAttendanceBackingBean.managedBean.selectedBriefingDetails}"
				rowKey="#{scQtBriefing.qtBriefingId}" rowIndexVar="rowIndex">
				<p:column selectionMode="multiple" style="width:2%" />
				<ac:paginator for="briefingDeails" />

				<p:column headerText="#{lbl['lbl.sc.description']}"
					style="width:100%">
					<h:outputText value="#{scQtBriefing.briefingDesc}"
						style="width:100%" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.date.time']}">
					<h:outputText value="14/11/2013" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.location']}">
					<h:outputText value="#{scQtBriefing.location}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.coordinate.officer']}">
					<h:outputText value="#{scQtBriefing.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.attendance']}">
					<h:outputText value="#{scQtBriefing.attendanceType}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.zone']}">
					<p:commandLink onclick="popQtn.show();">
						<h:outputText value="Zone Name" />
					</p:commandLink>
				</p:column>

			</p:dataTable>

		</p:panel>
		<p:spacer height="25" />
		<p:panel header="Site Visit Details"
			visible="#{!bsvAttendanceBackingBean.managedBean.scQt.sameBsv}">
			<p:dataTable id="sitevisitdetails" var="scQtsitevisit"
				value="#{bsvAttendanceBackingBean.managedBean.siteVisitDetailsList}"
				selection="#{bsvAttendanceBackingBean.managedBean.selectedSiteVisitDetails}"
				rowKey="#{scQtsitevisit.qtBriefingId}" rowIndexVar="rowIndex"
				rows="10">
				<ac:paginator for="sitevisitdetails" />
				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sc.description']}"
					style="width:100%">
					<h:outputText value="#{scQtsitevisit.briefingDesc}"
						style="width:100%" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.date.time']}">
					<h:outputText value="04/09/2013 04:44" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.location']}">
					<h:outputText value="#{scQtsitevisit.location}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.coordinate.officer']}">
					<h:outputText value="#{scQtsitevisit.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.attendance']}">
					<h:outputText value="#{scQtsitevisit.attendanceType}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.zone']}">
					<p:commandLink onclick="popQtn.show();">
						<h:outputText value="Zone Name" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
		</p:panel>

	    <p:outputPanel deferred="true">  
	    <h3> Proposal Preparation Sections:</h3>
	    </p:outputPanel>			

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">

			<p:column width="25">
				<p:outputLabel value="#{lbl['lbl.sc.notice.board.pps.date.time']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.proposalStartDate}" readonly="true" />
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.notice.board.el.issu.date']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.expectedLoaDate}" readonly="true" />
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.notice.board.close.date.time']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}" readonly="true" />
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.notice.board.es.delivery.date']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.expectedDeliveryDate}" readonly="true" />
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod}" readonly="true" />
			</p:column>

		</h:panelGrid>


       <p:outputPanel deferred="true">  
	    <h3>Contact Person:</h3>
	    </p:outputPanel>
		
		<h:panelGroup style="width:100%;">
			<p:dataTable value="" var="">

				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText readonly="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tel.no']}">
					<h:outputText readonly="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.fax.no']}">
					<h:outputText readonly="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText readonly="true" />
				</p:column>
			</p:dataTable>
		</h:panelGroup>
	</p:panel>

	<p:spacer height="20" />
</ui:composition>
