
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<h:panelGrid columns="2" style="width:70%;"
			styleClass="noBorders tr,noBorders td">

			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="60%" style="text-align:center">
						<h:panelGrid border="2" cellpadding="0" cellspacing="0"
							width="100%" columns="1"
							columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth20,columnWidth20 ">
							<h:column>
								<h:outputText
									value="#{lbl['lbl.sc.notice.board.view.notice.publish']}" />
							</h:column>
							<h:column>
								<p:commandLink value="#{lbl['lbl.sc.notice.board.today']} " 
								 actionListener="#{noticeBoardBackingBean.subFilter}"  />
								<p:spacer width="1" /> |
								<p:spacer width="1" />
								<h:commandLink value="#{lbl['lbl.sc.notice.board.yesterday']} " />
								<p:spacer width="1" /> |
								<p:spacer width="1" />
								<h:commandLink value="#{lbl['lbl.sc.notice.board.pass']}" />
								<p:spacer width="3" />
								<h:inputText size="1" />
								<p:spacer width="3" />
								<h:commandLink value="#{lbl['lbl.sc.notice.board.days']}" />
							</h:column>
						</h:panelGrid>
					</p:column>

					<p:column width="60%" style="text-align:center">
						<h:panelGrid border="2" cellpadding="0" cellspacing="0"
							width="100%" columns="1"
							columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth20,columnWidth20 ">
							<h:column>
								<h:outputText value="#{lbl['lbl.sc.notice.board.view.bsv']}" />
							</h:column>
							<h:column>
								<h:commandLink value="#{lbl['lbl.sc.notice.board.today']} " />
								<p:spacer width="1" />  | 
								<p:spacer width="1" />
								<h:commandLink value="#{lbl['lbl.sc.notice.board.yesterday']} " />
								<p:spacer width="1" />  |
								<p:spacer width="1" />
								<h:commandLink value="#{lbl['lbl.sc.notice.board.pass']}" />
								<p:spacer width="3" />
								<h:inputText size="1" />
								<p:spacer width="3" />
								<h:commandLink value="#{lbl['lbl.sc.notice.board.days']}" />
							</h:column>
						</h:panelGrid>
					</p:column>

				</p:row>
			</p:panelGrid>

		</h:panelGrid>
		<p:spacer height="20" />
		<p:panel header="Qtn/Tender Summary" id="summaryId">
			<p:dataTable id="nbsummaryID"
				value="#{noticeBoardBackingBean.managedBean.scQtSearchlist}"
				var="scqt" rowKey="#{scqt.qtId}" rowIndexVar="index"
				emptyMessage="No Records!" rows="10">
				<ac:paginator for="nbsummaryID"/>
			

			<p:column headerText="#{lbl['lbl.sc.title']}"
					style="width:15%">
					<p:commandLink action="#{noticeBoardBackingBean.qtnTenderDetails}">
						<f:setPropertyActionListener value="#{scqt}"
							target="#{noticeBoardBackingBean.managedBean.selectedScQt}" />
						<h:outputText value="#{scqt.qtTitle}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.publish.date']}">
					<h:outputText value="#{scqt.publishDate}" id="publdate"
						readonly="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.closing.date']}">
					<h:outputText value="#{scqt.closingDate}" id="closdate"
						readonly="true" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.notice.board.cdown']}"
					style="width:15%">
					<h:outputText value="21" readonly="true" />
				</p:column>

				<p:column
					headerText="#{lbl['lbl.sc.notice.board.bsv.if.yes.selfreg']}"
					style="width:30%">
					<p:commandLink
						action="tenderSelfRegistration.xhtml?faces-redirect=true">
						<h:outputText value="#{lbl['lbl.sc.notice.board.self.registration']}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.notice.board.view.det']}">
					<p:commandLink action="#{noticeBoardBackingBean.qtnTenderDocs}">
						<h:outputText
							value="#{lbl['lbl.sc.notice.board.view.qtn.tender.docs']}" />
					</p:commandLink>


				</p:column>
			</p:dataTable>
		</p:panel>



	</p:panel>
</ui:composition>
