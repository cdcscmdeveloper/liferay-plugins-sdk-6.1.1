<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	      <p:panel>
			<p:dataTable value="" >
		       <p:column headerText="#{lbl['lbl.sc.qtn.no']}">
					<h:outputText value="1232"  readonly="true" />
				</p:column>

			    <p:column headerText="#{lbl['lbl.sc.title']}">
						<h:outputText value="Title"  readonly="true"/>
				</p:column>

                <p:column headerText="#{lbl['lbl.sc.action']}">
					<p:commandLink onclick="popupPriceSchedule.show();">
						 <h:outputText value="Price Schedule" />
					</p:commandLink>
		      	</p:column>
		      	
			</p:dataTable>
	</p:panel>
		
     <!--  Price Schedule  dialog -->
	<p:dialog id="popupPriceSchedule" widgetVar="popupPriceSchedule"
		modal="false" resizable="false" header="Tender Schedule"   width="900" height="500" hideEffect="true">
		<p:ajax event="close" />
	    <ui:include src="noticeboardPriceSchedulePopUp.xhtml" /><br />
		  <p:panelGrid style="width:100%;"
			 styleClass="noBorders tr,noBorders td">
			  <p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="PRINT PDF" />
					<p:commandButton value="#{lbl['lbl.btn.close']}" onclick="popupPriceSchedule.hide()"/>
				</p:column>
			  </p:row>
		  </p:panelGrid>
	</p:dialog>
		
		
</ui:composition>
