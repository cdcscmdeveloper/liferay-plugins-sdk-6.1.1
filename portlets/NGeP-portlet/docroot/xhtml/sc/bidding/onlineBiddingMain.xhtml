<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<script src="#{resource['js/countdown.js']}" />
	</ui:define>

	<ui:define name="contentSection">

		<h:panelGroup id="pollPanelGroup"
			rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.pendingBidding or onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">

			<p:poll id="pollCOmponent" interval="#{onlineBiddingBB.interval}"
				listener="#{onlineBiddingBB.pollListener}"
				update="itemWiseBidListOB,packageRankingPanelOB,onlineBiddingNotification" />
		</h:panelGroup>

		<ui:include src="/xhtml/sc/bidding/onlineBiddingHeader.xhtml" />



		<p:panel id="onLineBiddingPanel" header="#{lbl['lbl.sc.bidding.bid.price.details']}"
			toggleable="true">
			<p:spacer height="5" />
			<ui:include src="/xhtml/sc/bidding/onlineBiddingTimers.xhtml" />
			<h:panelGrid rendered="#{onlineBiddingBB.scBidSchedule eq null}">
			<p:spacer height="5" />
			<h:outputText style="font-size : 25px;" styleClass="lastUpdated"
				value="#{lbl['lbl.sc.bid.bidding.notification']}"/>
				<p:spacer height="5" />
			</h:panelGrid>
			<p:spacer height="5" />
			<p:dataTable id="itemWiseBidListOB"
				style="word-wrap: break-word ; table-layout: fixed "
				value="#{onlineBiddingBB.bidPrices}" var="bidPriceItem">

				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" width="22%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.name']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
							width="7%" />

						<p:column rowspan="2" style="white-space : normal" width="4%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.min.decrement.block.supplier.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
							width="19%" style="text-align:center" />

						<p:column colspan="2" headerText="#{lbl['lbl.sc.last.bid']}"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}"
							width="19%" style=" text-align:center" />

						<p:column colspan="3" headerText="#{lbl['lbl.sc.new.bid']}"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}"
							width="19%" style=" text-align:center" />

						<p:column rowspan="2"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress and onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem}"
							headerText="#{lbl['lbl.sc.current.ranking']}"
							style="white-space : normal" width="4%" />
					</p:row>
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}" />

						<p:column width="7%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.decrement']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.decrement.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="8%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:commandLink id="itemNameOB" style="white-space : normal;"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
						action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
						update=":form:onlineBiddingItemDetails"
						oncomplete="onlineBiddingItemDetails.show()" />
				</p:column>
				<p:column>
					<h:outputText id="qtyOB" style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText id="decrementAmtOB" style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText id="itemStartPriceOB" style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText id="startPriceTotalOB" style="float : right"
						value="#{onlineBiddingBB.tplSpecHelper.calcTotalAmount(bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.tplSpecQuestion,bidPriceItem.scBidSupplierItem.itemStartPrice,bidPriceItem.scBidSupplierItem.scBidItem.qty)}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}">
					<h:outputText style="float : right" id="lastBidPrice"
						value="#{bidPriceItem.bidPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}">
					<h:panelGroup id="lastBidPriceSubTotal">
						<h:outputText id="lastBidPriceTotalOB" style="float : right"
							rendered="#{(bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty) ne 0}"
							value="#{onlineBiddingBB.tplSpecHelper.calcTotalAmount(bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.tplSpecQuestion,bidPriceItem.bidPrice,bidPriceItem.scBidSupplierItem.scBidItem.qty)}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">
					<p:spinner style="width : 88%" size="8"
						value="#{bidPriceItem.newPrice}"
						min="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}"
						id="spinner" label="New Bid Price"
						stepFactor="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{onlineBiddingBB.decrementAmountValueChangeListener(bidPriceItem)}"
							update="spinner,newPrice,newPriceSubTotal,@(.calcTotal)"></p:ajax>
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:spinner>
					<p:spacer width="5"></p:spacer>
					<p:commandLink id="submitBidOB"
						action="#{onlineBiddingBB.confirmAndSubmitBIdPrice(bidPriceItem)}"
						process="@this" partialSubmit="true"
						update="lastBidPrice,lastBidPriceSubTotal,newPrice,newPriceSubTotal,newRanking,:form:packageRankingPanelOB,@(.calcTotal)">
						<p:graphicImage library="ep/images/design" name="submit.png"
							value="/css/images/design/submit.png" />
					</p:commandLink>
					<p:tooltip id="submitBidOBToolTip" for="submitBidOB"
						value="Click to submit New Bid Price" />
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">
					<h:panelGroup id="newPrice">
						<h:outputText id="newBidPriceOB" style="float : right"
							rendered="#{bidPriceItem.newBidPrice != null}"
							value="#{bidPriceItem.newBidPrice.bidPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">

					<h:panelGroup id="newPriceSubTotal">
						<h:outputText id="newBidPriceTotalOB" style="float : right"
							rendered="#{(bidPriceItem.newBidPrice.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty) ne 0}"
							value="#{onlineBiddingBB.tplSpecHelper.calcTotalAmount(bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.tplSpecQuestion,bidPriceItem.newBidPrice.bidPrice,bidPriceItem.scBidSupplierItem.scBidItem.qty)}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem and onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">
					<h:panelGroup id="newRanking">
						<h:outputText value="#{bidPriceItem.ranking}" />
					</h:panelGroup>
				</p:column>


				<p:columnGroup type="footer">
					<p:row>
						<p:column colspan="4">
							<f:facet name="footer">
								<h:outputText id="totalLblOB" style="float : right"
									value="#{lbl['lbl.sc.total']}" />
							</f:facet>
						</p:column>
						<p:column>
							<f:facet name="footer">
								<h:outputText id="footerStartPriceTotalOB" style="float : right"
									value="#{onlineBiddingBB.itemStartPriceTotal}" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}">
							<f:facet name="footer">
								<h:outputText id="lastBidPriceTotalLblOB"
									value="#{lbl['lbl.sc.total']}" style="float : right" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne onlineBiddingBB.pendingBidding}">
							<f:facet name="footer">
								<h:outputText style="float : right" id="itemLastBidPriceTotal"
									styleClass="calcTotal"
									value="#{onlineBiddingBB.itemLastBidPriceTotal}" />
							</f:facet>
						</p:column>
						<p:column colspan="2"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">

							<f:facet name="footer">
								<h:outputText id="newBidPriceTotalLblOB"
									value="#{lbl['lbl.sc.total']}" style="float : right" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">
							<f:facet name="footer">
								<h:outputText style="float : right" id="itemNewBidPriceTotal"
									styleClass="calcTotal"
									value="#{onlineBiddingBB.itemNewBidPriceTotal}" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem and onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}" />
					</p:row>
				</p:columnGroup>

			</p:dataTable>
		</p:panel>

		<p:confirmDialog id="newBidPriceConfirm" width="300px"
			message="#{lbl['lbl.sc.bidding.confirm.message']}"
			widgetVar="newBidPriceConfirm">
			<div align="right">
				<p:commandButton id="confSubmit" value="#{lbl['lbl.btn.yes']}"
					partialSubmit="true"
					action="#{onlineBiddingBB.updateBidPriceAndCalculateRank(bidPriceItem)}"
					process="@this" oncomplete="newBidPriceConfirm.hide()" />
				<p:commandButton id="confNotSubmit" value="#{lbl['lbl.btn.no']}"
					process="@this" partialSubmit="true"
					onclick="newBidPriceConfirm.hide()" />
			</div>
		</p:confirmDialog>

		<!-- header="#{lbl['lbl.sc.new.bid']}"  -->

		<h:panelGroup id="packageRankingPanelOB" style="width : 100%">

			<h:panelGroup style="width : 100% ; align: right "
				rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypePackage and onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress}">

				<div style="align: right">
					<TABLE style="width: 100%">
						<TR>
							<TD style="width: 88%" />
							<TD style="width: 9%"><h:outputText
									value="#{lbl['lbl.sc.package.ranking']}" /></TD>
							<TD style="width: 3%"><p:inputText id="packageRankId"
									disabled="true" size="3"
									value="#{onlineBiddingBB.packageRanking}" /></TD>
						</TR>
					</TABLE>
				</div>
			</h:panelGroup>
		</h:panelGroup>

		<ui:include src="/xhtml/sc/bidding/onlineBiddingBottom.xhtml" />

	</ui:define>
</ui:composition>
