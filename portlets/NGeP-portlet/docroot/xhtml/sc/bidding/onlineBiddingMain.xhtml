<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
		<script src="#{resource['js/countdown.js']}" />
	</ui:define>

	<ui:define name="contentSection">

		<p:poll interval="30" listener="#{onlineBiddingBB.pollListener}"
			rendered="#{onlineBiddingBB.getStatusDescById(onlineBiddingBB.scBidSchedule.pmStatus.statusId) eq 'Pending Bidding' or onlineBiddingBB.getStatusDescById(onlineBiddingBB.scBidSchedule.pmStatus.statusId) eq 'In Progress' }"
			update="@form" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="onlineBidding" showDetail="true" autoUpdate="true"
			closable="true" />
		<ui:param name="isZonal"
			value="#{!onlineBiddingBB.scBidSchedule.tplSpecZoneDtl.zoneName eq null}" />
		<ui:param name="isPending"
			value="#{onlineBiddingBB.getStatusDescById(onlineBiddingBB.scBidSchedule.pmStatus.statusId) eq 'Pending Bidding'}" />
		<ui:param name="isInProgress"
			value="#{onlineBiddingBB.getStatusDescById(onlineBiddingBB.scBidSchedule.pmStatus.statusId) eq 'In Progress'}" />

		<div align="right" style="width: 100%">
			<TABLE>
				<TR>
					<TD><p:outputLabel value="#{lbl['lbl.sc.bidding.no']}" /></TD>

					<TD><p:selectOneMenu id="currentDayBidList"
							style="width : 160px">
							<f:selectItems var="bid"
								value="#{onlineBiddingBB.activeBidSchedules}"
								itemLabel="#{bid.bidNo}" itemValue="#{bid.bidScheduleId}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{onlineBiddingBB.selectedBidChangeListener(bid)}"
								update="@form"></p:ajax>

						</p:selectOneMenu></TD>
				</TR>
			</TABLE>

		</div>

		<p:panel header="#{lbl['lbl.sc.bid.details']}" id="bidDetailsPanel"
			toggleable="true">

			<div style="width: 100%">

				<table style="width: 60%; align: LEFT">

					<tr>
						<td style="width: 120px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.no']}" /></td>
						<td><p:inputText id="bidNo"
								value="#{onlineBiddingBB.scBidSchedule.bidNo}"
								disabled="true" size="20" /></td>
						<TD></TD>
						<TD></TD>
						<td rowspan="4"></td>
					</tr>

					<tr>
						<td style="width: 120px"><p:outputLabel
								value="#{lbl['lbl.sc.document.no']}" /></td>
						<td><p:inputText id="documentNo"
								value="#{onlineBiddingBB.scBidSchedule.scBid.docNo}"
								disabled="true" size="20" /></td>
						<TD></TD>
						<TD></TD>
					</tr>

					<tr>

						<td style="width: 120px"><p:outputLabel
								value="#{lbl['lbl.sc.document.title']}" /></td>
						<td colspan="3"><p:inputText id="documentTitle"
								value="#{onlineBiddingBB.scBidSchedule.scBid.docTitle}"
								disabled="true" size="90" /></td>

					</tr>

					<tr>

						<td style="width: 120px"><p:outputLabel
								value="#{lbl['lbl.sc.ptj.name']}" /></td>
						<td colspan="3"><p:inputText id="ptjName"
								value="#{onlineBiddingBB.scBidSchedule.scBid.pmOrgProfile.orgName}"
								disabled="true" size="90" /></td>

					</tr>

					<tr>

						<td style="width: 120px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.start']}" /></td>
						<td><p:inputText id="bidStart"
								value="#{onlineBiddingBB.scBidSchedule.startDate}"
								disabled="true" size="20">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
						<TD style="width: 120px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.end']}" /></TD>
						<TD><p:inputText id="bidEnd"
								value="#{onlineBiddingBB.scBidSchedule.endDate}"
								disabled="true" size="20">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></TD>

					</tr>

				</table>

			</div>

		</p:panel>

		<c:if test="#{isPending}">
			<ui:include src="onlineBiddingCountdown.xhtml"></ui:include>
		</c:if>
		<c:if test="#{isInProgress}">
			<ui:include src="supplierOnlineBidding.xhtml"></ui:include>
		</c:if>


		<p:dialog header="#{lbl['lbl.sc.item.details']}"
			widgetVar="onlineBiddingItemDetails" showEffect="fade"
			hideEffect="fade" modal="true" id="onlineBiddingItemDetails">
			<ui:include
				src="/xhtml/sc/bidding/onlineBiddingItemDetailsPopup.xhtml"></ui:include>
		</p:dialog>
		<p:dialog header="#{lbl['lbl.sc.notification']}" rendered="false"
			widgetVar="onlineBiddingNotification" showEffect="fade"
			hideEffect="fade" modal="true" id="onlineBiddingNotification">
			<ui:include
				src="/xhtml/sc/bidding/ onlineBiddingNotificationPopup.xhtml"></ui:include>
		</p:dialog>

	</ui:define>
</ui:composition>
