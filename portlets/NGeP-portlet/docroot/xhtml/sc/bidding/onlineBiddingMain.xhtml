<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<ui:define name="resourceSection">
		<script src="#{resource['js/countdown.js']}" />
	</ui:define>

	<ui:define name="contentSection">


		<ui:include src="/xhtml/sc/bidding/onlineBiddingHeader.xhtml" />

			<ui:fragment
				rendred="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_PENDING_BIDDING}">
				<ui:include src="/xhtml/sc/bidding/onlineBiddingCountdown.xhtml" />
			</ui:fragment>

			<ui:fragment
				rendred="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">

				<ui:include src="/xhtml/sc/bidding/supplierOnlineBidding.xhtml" />
			</ui:fragment>

			<ui:fragment
				rendred="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_COMPLETED or onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_PAUSED or onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_CANCELLED}">

				<ui:include src="/xhtml/sc/bidding/biddingCompleteOrPaused.xhtml" />
			</ui:fragment>

		<ui:include src="/xhtml/sc/bidding/onlineBiddingBottom.xhtml" />

	</ui:define>
</ui:composition>
