<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.item.details']}" toggleable="true">

		<p:dataTable id="biddingListBMBI" selectionMode="single"
			value="#{biddingBB.managedBean.scheduledBid.scBidItems}"
			var="bidItem" 
			rowKey="#{bidItem.bidItemId}">

			<p:ajax event="rowSelect" listener="#{biddingBB.rowSelectListener}"
				update="@form" />
			<ac:paginator for="biddingListBMBI"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText value="#{bidItem.scRequestItem.itemName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}">

				<h:outputText value="#{bidItem.scRequestItem.itemDesc}" />
			</p:column>
			<p:column style="width : 60px" headerText="#{lbl['lbl.sc.uom']}">

				<h:outputText value="#{bidItem.scRequestItem.uom.uomName}" />

			</p:column>
			<p:column style="width : 65px" headerText="#{lbl['lbl.sc.quantity']}">
				<h:outputText style="float : right" value="#{bidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="width : 125px"
				headerText="#{lbl['lbl.sc.min.decrement.block']}">
				<h:outputText style="float : right" value="#{bidItem.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>

	</p:panel>

	<p:spacer height="10"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.bid.summary']}" toggleable="true"
		id="itemPriceLineChartPanel">
		<p:spacer height="10"></p:spacer>

		<div align="center">

			<h5>
				<B> Bidding Statistic Graph</B>
			</h5>

		</div>

		<p:spacer height="10"></p:spacer>

		<div>

			<p:lineChart value="#{biddingBB.managedBean.itemPriceLinearModel}"
				legendPosition="e" style="height:300px;" />

		</div>
		
		
		<p:spacer height="10"></p:spacer>
		
		
		<p:spacer height="10"></p:spacer>

		<p:dataTable id="rankingList"
			value="#{biddingBB.managedBean.scBidPriceList}" var="bidPriceItem">
			<ac:paginator for="rankingList"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.ranking']}"
				style=" align : center; width : 14%">
				<h:outputText value="#{bidPriceItem.ranking}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="align : center; width : 14%">
				<h:outputText
					value="#{bidPriceItem.scBidSupplierItem.scBidSupplier.smSupplier.supplierId}" />
			</p:column>
			<p:column style="align : center; width : 14%"
				headerText="#{lbl['lbl.sc.bumiputera.status']}">
				<h:outputText
					value="#{(bidPriceItem.scBidSupplierItem.scBidSupplier.smSupplier.bumi) ? 'Yes' : 'No'}" />
			</p:column>
			<p:column style="align : center; width : 14%"
				headerText="#{lbl['lbl.sc.starting.price']}">
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style=" align : center; width : 14%"
				headerText="#{lbl['lbl.sc.last.bid.price']}">
				<div style="align: right">
					<p:commandLink value="#{bidPriceItem.bidPrice}"
						style="float : right" oncomplete="priceHistory.show();"
						action="#{biddingBB.historyPricePopupAction(bidPriceItem)}"
						update="@([id$=historyPricePopupPanel])">
						
					</p:commandLink>
				</div>

			</p:column>
			<p:column style=" align : center; width : 15%"
				headerText="#{lbl['lbl.sc.difference.rm']}">
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice - bidPriceItem.bidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column style=" align : center; width : 15%"
				headerText="#{lbl['lbl.sc.cost.saving']}">
				<h:outputText style="float : right" value="#{1000}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>

	</p:panel>

	<p:panel id="historyPricePopupPanel">
		<p:dialog rendered="#{biddingBB.managedBean.rendered}"
			header="#{lbl['lbl.sc.history.price']}" widgetVar="priceHistory"
			showEffect="fade" hideEffect="fade" modal="true" id="historyPrice">
			<ui:include src="/xhtml/sc/bidding/BMByItemHistoryPricePopup.xhtml"></ui:include>
		</p:dialog>
	</p:panel>


</ui:composition>
