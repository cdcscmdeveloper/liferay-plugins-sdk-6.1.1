<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.item.details']}" toggleable="true">

		<p:dataTable id="biddingListBMBI" selectionMode="single"
			value="#{biddingBB.managedBean.scheduledBid.scBidItems}"
			var="bidItem" selection="#{biddingBB.managedBean.selectedtem}"
			rowKey="#{bidItem.bidItemId}">

			<p:ajax event="rowSelect" listener="#{biddingBB.rowSelectListener}"
				update="@form" />


			<p:column headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText value="#{bidItem.scRequestItem.itemName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}">

				<h:outputText value="#{bidItem.scRequestItem.itemDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.uom']}">

				<h:outputText value="#{bidItem.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.quantity']}">
				<p:outputLabel value="#{bidItem.qty}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.min.decrement.block']}">
				<p:outputLabel value="#{bidItem.decrementAmt}" />
			</p:column>
		</p:dataTable>

	</p:panel>

	<p:spacer height="10"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.bid.summary']}" toggleable="true"
		id="itemPriceLineChartPanel">
		<p:spacer height="10"></p:spacer>

		<div align="center">

			<h1>
			<B>	Bidding Statistic Graph</B>
			</h1>

		</div>

		<p:spacer height="10"></p:spacer>

		<div>

			<p:lineChart value="#{biddingBB.managedBean.itemPriceLinearModel}"
				legendPosition="e" style="height:300px;" />

		</div>

		<p:spacer height="10"></p:spacer>

		<!-- count down timer -->

		<p:dataTable id="rankingList"
			value="#{biddingBB.managedBean.scBidPriceList}" var="bidPriceItem">

			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<p:outputLabel value="#{bidPriceItem.ranking}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<h:outputText
					value="#{bidPriceItem.scBidSupplierItem.scBidSupplier.smSupplier.supplierId}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bumiputera.status']}">
				<h:outputText
					value="#{(bidPriceItem.scBidSupplierItem.scBidSupplier.smSupplier.bumi) ? 'Yes' : 'No'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.starting.price']}">
				<p:outputLabel
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.last.bid.price']}">
				<p:commandLink value="#{bidPriceItem.bidPrice}"
					oncomplete="priceHistory.show();"
					actionListener="#{biddingBB.historyPricePopupAction(bidPriceItem)}"
					update="@([id$=historyPricePopupPanel])" />

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">
				<p:outputLabel
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice - bidPriceItem.bidPrice}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.cost.saving']}">
				<p:outputLabel value="#{1000}" />
			</p:column>

		</p:dataTable>

	</p:panel>

	<p:panel id="historyPricePopupPanel">
		<p:dialog rendered="#{biddingBB.managedBean.rendered}"
			header="#{lbl['lbl.sc.history.price']}" widgetVar="priceHistory"
			showEffect="fade" hideEffect="fade" modal="true" id="historyPrice">
			<ui:include src="/xhtml/sc/bidding/BMByItemHistoryPricePopup.xhtml"></ui:include>
		</p:dialog>
	</p:panel>


</ui:composition>
