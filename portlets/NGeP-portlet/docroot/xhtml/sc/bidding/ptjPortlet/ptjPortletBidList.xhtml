<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:messages id="bidListMessages" autoUpdate="true" showDetail="true"
		showSummary="false" closable="true" severity="error, info" />
		<table style="width: 30%; align: left;">

			<TR align="left">
				<td style="width: 10%"><p:outputLabel id="pickedStatusLbl"
						value="#{lbl['lbl.sc.status']}" /></td>
				<td style="width: 90%"><p:selectOneMenu id="pickedStatus"
						value="#{biddingListBB.managedBean.selectedStatusDesc}"
						style="width:60%;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.status']}">
						<f:selectItems value="#{biddingListBB.managedBean.statusDescs}"
							var="status" itemLabel="#{status.statusName}"
							itemValue="#{status.pmStatus.statusId}" />
						<p:ajax event="change" process="@this" update="activeBidList"
							partialSubmit="true"
							listener="#{biddingListBB.managedBean.searchForScheduledBids}" />
					</p:selectOneMenu></td>
			</TR>
		</table>
		<p:dataTable id="activeBidList" rowIndexVar="index"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{biddingListBB.managedBean.searchDataModel}" var="bid"
			lazy="true" rows="5">

			<ac:paginator for="activeBidList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.bidding.no']}">
				<div style="align: right">
					<p:commandLink id="bidNoBL" value="#{bid.bidNo}"
						action="#{biddingListBB.navigateToBidManagementAction(bid)}">
					</p:commandLink>
				</div>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document.no']}">
				<h:outputText id="docNoBL" value="#{bid.scBid.docNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document.title']}">
				<h:outputText style="white-space : normal;" id="docTitleBL"
					value="#{bid.scBid.docTitle}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bid.start']}">
				<h:outputText id="bidStartBL" value="#{bid.startDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bid.end']}">

				<h:outputText id="bidEndBL" value="#{bid.endDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}">

				<h:outputText id="bidStatusBL" style="float : left"
					value="#{biddingListBB.getStatusDescById(bid.pmStatus.statusId)}" />
			</p:column>

		</p:dataTable>
</ui:composition>
