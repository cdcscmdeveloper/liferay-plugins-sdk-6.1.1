<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

		<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
			toggleable="true">
			<p:dataTable id="contactPersonDT"
				value="#{onlineBiddingBB.bidContactPersons}" var="contact">

				<p:column headerText="#{lbl['lbl.sc.name']}" style="width : 70%">
					<h:outputText value="#{contact.contactName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tel.no']}" style="width : 30%">
					<h:outputText value="#{contact.phoneNo}" />
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:dialog header="#{lbl['lbl.sc.item.details']}"
			widgetVar="onlineBiddingItemDetails" showEffect="fade"
			hideEffect="fade" modal="true" id="onlineBiddingItemDetails">
			<ui:include
				src="/xhtml/sc/bidding/onlineBiddingItemDetailsPopup.xhtml"></ui:include>
		</p:dialog>
		<p:dialog header="#{lbl['lbl.sc.notification']}"  
			widgetVar="onlineBiddingNotification" showEffect="fade" 
			hideEffect="fade" modal="true" id="onlineBiddingNotification">
			<ui:include
				src="/xhtml/sc/bidding/ onlineBiddingNotificationPopup.xhtml"></ui:include>
		</p:dialog>
	
</ui:composition>
