<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table>
		<tr style="align: left;">
			<TD><p:outputLabel 
					value="#{lbl['lbl.sc.bidding.no']}" /></TD>
			<TD><p:inputText  size="20" disabled="true"
					value="#{onlineBidSearchBB.managedBean.scBidSchedule.bidNo}" /></TD>
			<TD><p:outputLabel 
					value="#{lbl['lbl.sc.document.no']}" /></TD>
			<TD><p:inputText  size="20" disabled="true"
					value="#{onlineBidSearchBB.managedBean.scBidSchedule.scBid.docNo}" /></TD>
		</tr>

		<tr>
			<TD colspan="4"><p:inputTextarea 
					cols="80" rows="10" style="white-space : normal; " disabled="true"
					value="#{onlineBidSearchBB.managedBean.scBidAction.remark}" /></TD>
		</tr>
	</table>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.ok']}" partialSubmit="true"
			action="#{onlineBidSearchBB.bidStatusNotificationAction}"
			process="@this" oncomplete="onlineBiddingNotificationView.hide();" />
	</div>

</ui:composition>
