<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		<p:panel id="onLineBiddingPanel"
			header="#{lbl['lbl.sc.bidding.bid.price.details']}" toggleable="true">

			<p:spacer height="5"></p:spacer>

			<p:panel id="remainingTimePanel">
				<div style="align: left">
					<table style="width: 100%;">
						<tr>
							<td style="width: 9%;"><p:outputLabel
									value="#{lbl['lbl.sc.remaining.time']}" /></td>

							<td style="width: 41%; align: left"><script
									type="application/javascript">
								
			var myCountdownBidding = new Countdown({time:"#{onlineBiddingBB.remainingBidTime}",hideLine: true,rangeHi: "hour",rangeLo: "second",width: 250,height: 70,
				labelText : {
	                ms     : "MS",
	                second : "#{lbl['lbl.sc.bidding.seconds']}",
	                minute : "#{lbl['lbl.sc.bidding.minutes']}",
	                hour   : "#{lbl['lbl.sc.bidding.hours']}",
	                day    : "#{lbl['lbl.sc.bidding.days']}",
	                month  : "MONTHS",
	                year   : "YEARS"
	            }
			});  
					
							</script></td>
							<TD style="width: 50%;"><h:outputLabel
									value="#{lbl['lbl.sc.notes']}" /></TD>
						</tr>
					</table>
				</div>
			</p:panel>
			<p:spacer height="5"></p:spacer>

			<p:dataTable id="itemWiseBidListOB"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				style="word-wrap: break-word ; table-layout: fixed"
				value="#{onlineBiddingBB.bidPrices}" var="bidPriceItem">

				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" width="22%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.name']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
							width="7%" />

						<p:column rowspan="2" style="white-space : normal" width="4%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.min.decrement.block.supplier.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
							width="19%" style="text-align:center" />

						<p:column colspan="2" headerText="#{lbl['lbl.sc.last.bid']}"
							width="19%" style=" text-align:center" />

						<p:column colspan="3" headerText="#{lbl['lbl.sc.new.bid']}"
							width="19%" style=" text-align:center" />

						<p:column rowspan="2"
							rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem}"
							headerText="#{lbl['lbl.sc.current.ranking']}"
							style="white-space : normal" width="4%" />
					</p:row>
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

						<p:column width="7%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.decrement']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.decrement.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="8%" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:commandLink
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
						action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
						oncomplete="onlineBiddingItemDetails.show()" />
				</p:column>
				<p:column>
					<h:outputText style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.itemStartPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText style="float : right" id="lastBidPrice"
						value="#{bidPriceItem.bidPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:panelGroup id="lastBidPriceSubTotal">
						<h:outputText style="float : right"
							rendered="#{(bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty) ne 0}"
							value="#{bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column>
					<p:spinner size="10" value="#{bidPriceItem.newPrice}" min="0"
						id="spinner"
						max="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt * 10}"
						stepFactor="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{onlineBiddingBB.decrementAmountValueChangeListener(bidPriceItem)}"
							 update="newPrice,newPriceSubTotal,@(.calcAmount)"></p:ajax>
					</p:spinner>
					<p:spacer width="5"></p:spacer>
					<p:commandLink
						action="#{onlineBiddingBB.updateBidPriceAndCalculateRank(bidPriceItem)}"
						process="@this" partialSubmit="true" oncomplete="refreshFooter();"
						update=":form:packageRankingPanelOB,newPrice,newPriceSubTotal,lastBidPrice,lastBidPriceSubTotal,@(.calcAmount)">
						<p:graphicImage library="css/images/design" name="submit.png"
							value="/css/images/design/submit.png" />
					</p:commandLink>
				</p:column>
				<p:column>
					<h:panelGroup id="newPrice" >
						<h:outputText style="float : right"
							rendered="#{bidPriceItem.newBidPrice != null}"
							value="#{bidPriceItem.newBidPrice.bidPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column>

					<h:panelGroup id="newPriceSubTotal">
						<h:outputText style="float : right"
							rendered="#{(bidPriceItem.newBidPrice.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty) ne 0}"
							value="#{bidPriceItem.newBidPrice.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem}">
					<h:panelGroup id="newRanking" >
						<h:outputText value="#{bidPriceItem.ranking}" />
					</h:panelGroup>
				</p:column>


				<p:columnGroup type="footer">
					<p:row>
						<p:column colspan="4">
							<f:facet name="footer">
								<h:outputText style="float : right"
									value="#{lbl['lbl.sc.total']}" />
							</f:facet>
						</p:column>
						<p:column>
							<f:facet name="footer">
								<h:outputText value="#{onlineBiddingBB.itemStartPriceTotal}" />
							</f:facet>
						</p:column>
						<p:column>
							<f:facet name="footer">
								<h:outputText value="#{lbl['lbl.sc.total']}"
									style="float : right" />
							</f:facet>
						</p:column>
						<p:column>
							<f:facet name="footer">
									<h:outputText id="itemLastBidPriceTotal" styleClass="calcAmount" 
										value="#{onlineBiddingBB.itemLastBidPriceTotal}" />
							</f:facet>
						</p:column>
						<p:column colspan="2">

							<f:facet name="footer">
								<h:outputText value="#{lbl['lbl.sc.total']}"
									style="float : right" />
							</f:facet>
						</p:column>
						<p:column>
							<f:facet name="footer">
									<h:outputText style="float : right" id="itemNewBidPriceTotal" styleClass="calcAmount" 
										value="#{onlineBiddingBB.itemNewBidPriceTotal}" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem}" />
					</p:row>
				</p:columnGroup>

			</p:dataTable>

		</p:panel>

		<p:panel id="packageRankingPanelOB" style="width : 100%">

			<p:panel style="width : 100% ; align: right "
				rendered="#{onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypePackage}">

				<div style="align: right">
					<TABLE style="width: 100%">
						<TR>
							<TD style="width: 90%" />
							<TD style="width: 7%"><h:outputText
									value="#{lbl['lbl.sc.package.ranking']}" /></TD>
							<TD style="width: 3%"><p:inputText disabled="true" size="3"
									value="#{onlineBiddingBB.packageRanking}" /></TD>
						</TR>
					</TABLE>
				</div>
			</p:panel>
		</p:panel>
</ui:composition>
