<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<script src="#{resource['js/countdown.js']}" />
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="obMessage" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		<h:panelGroup id="pollPanelGroup"
			rendered="#{(onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_PENDING_BIDDING) or (onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS)}">
			<p:poll id="pollCOmponent" interval="#{onlineBiddingBB.interval}"
				listener="#{onlineBiddingBB.pollListener}"
				update="itemWiseBidListOB,packageRankingPanelOB,onlineBiddingNotification" />
		</h:panelGroup>
		
		<p:commandButton value="#{lbl['lbl.btn.back']}"
			immediate="true" 
			action="#{onlineBiddingBB.backAction}"
			rendered="#{!empty onlineBiddingBB.previousPageUrl}" />

		<ui:include
			src="/xhtml/sc/bidding/onlineBidding/onlineBiddingHeader.xhtml" />
		<p:panel id="onLineBiddingPanel"
			header="#{lbl['lbl.sc.bidding.bid.price.details']}" toggleable="true">

			<ui:include
				src="/xhtml/sc/bidding/onlineBidding/onlineBiddingTimers.xhtml" />
			<h:panelGrid rendered="#{onlineBiddingBB.scBidSchedule eq null}">
				<h:outputText style="font-size : 25px;" styleClass="lastUpdated"
					value="#{lbl['lbl.sc.bid.bidding.notification']}" />

			</h:panelGrid>
			<p:dataTable id="itemWiseBidListOB"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				style="word-wrap: break-word ; table-layout: fixed "
				value="#{onlineBiddingBB.bidPrices}" var="bidPriceItem">

				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" width="20%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.name']}" />
								<ac:iconTooltip
									value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
							width="6%" />

						<p:column rowspan="2" style="white-space : normal" width="4%">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
								<ac:iconTooltip
									value="#{lbl['lbl.sc.min.decrement.block.supplier.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
							width="18%" style="text-align:center" />

						<p:column colspan="2" headerText="#{lbl['lbl.sc.last.bid']}"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}"
							width="18%" style=" text-align:center" />

						<p:column colspan="3" headerText="#{lbl['lbl.sc.new.bid']}"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}"
							width="30%" style=" text-align:center" />

						<p:column rowspan="2"
							rendered="#{(onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING) and (onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem)}"
							headerText="#{lbl['lbl.sc.current.ranking']}"
							style="white-space : normal" width="4%" />
					</p:row>
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="8%" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="8%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}" />

						<p:column width="14%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.decrement']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.decrement.tooltip']}" />
							</f:facet>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="7%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}" />

						<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="9%"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<p:commandLink id="itemNameOB" style="white-space : normal;"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
						action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
						update=":form:onlineBiddingItemDetails"
						oncomplete="onlineBiddingItemDetails.show()" />
				</p:column>
				<p:column>
					<h:outputText id="qtyOB" style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText id="decrementAmtOB" style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText id="itemStartPriceOB" style="float : right"
						value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<p:outputLabel id="startPriceTotalOB" style="float : right"
						value="#{onlineBiddingBB.startPriceTotal(bidPriceItem)}">
					</p:outputLabel>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}">
					<h:outputText style="float : right" id="lastBidPrice"
						value="#{bidPriceItem.bidPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}">
					<h:panelGroup id="lastBidPriceSubTotal">
						<p:outputLabel id="lastBidPriceTotalOB" style="float : right"
							value="#{onlineBiddingBB.lastBidPriceTotal(bidPriceItem)}">
						</p:outputLabel>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">
					<h:panelGroup id="spinnerPG">
						<ac:spinner style="width : 65%" maxlength="10"
							value="#{bidPriceItem.newPrice}" id="spinner"
							min="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}"
							max="#{bidPriceItem.bidPrice - bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}"
							label="#{lbl['lbl.sc.new.bid']}"
							stepFactor="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}"
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							update=":form:itemWiseBidListOB"
							postUpdateListener="onlineBiddingBB.decrementAmountValueChangeListener">
							<f:attribute name="scBidPrice" value="#{bidPriceItem}" />
						</ac:spinner>
					</h:panelGroup>
					<p:spacer width="3"></p:spacer>
					<h:panelGroup id="submitButton" style="width : 35%">
						<p:commandLink id="submitBidOB"
							disabled="#{(bidPriceItem.newPrice == null) or (bidPriceItem.newPrice lt bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt)}"
							action="#{onlineBiddingBB.confirmAndSubmitBIdPrice(bidPriceItem)}"
							process="@this"
							update="@this,spinnerPG,lastBidPrice,lastBidPriceSubTotal,newPrice,newPriceSubTotal,newRanking,:form:packageRankingPanelOB,:form:obMessage">
							<p:graphicImage
								value="#{CommonUIConstant.imagePathUptoDesign}/ico-submit.png" />
						</p:commandLink>
					</h:panelGroup>
				</p:column>

				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">
					<h:panelGroup id="newPrice">
						<h:outputText id="newBidPriceOB" style="float : right"
							rendered="#{(bidPriceItem.newPrice != null) and (bidPriceItem.newPrice ne 0) and !(bidPriceItem.newPrice lt 0)}"
							value="#{bidPriceItem.newBidPrice.bidPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">

					<h:panelGroup id="newPriceSubTotal">
						<p:outputLabel id="newBidPriceTotalOB" style="float : right"
							rendered="#{(bidPriceItem.newPrice != null) and (bidPriceItem.newPrice ne 0) and !(bidPriceItem.newPrice lt 0)}"
							value="#{onlineBiddingBB.itemNewPriceTotal(bidPriceItem)}">
						</p:outputLabel>
					</h:panelGroup>
				</p:column>
				<p:column
					rendered="#{(onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem) and (onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING)}">
					<h:panelGroup id="newRanking">
						<h:outputText value="#{bidPriceItem.ranking}" />
					</h:panelGroup>
				</p:column>
				<p:columnGroup type="footer">
					<p:row>
						<p:column colspan="4">
							<f:facet name="footer">
								<h:outputText id="totalLblOB" style="float : right"
									value="#{lbl['lbl.sc.total']}" />
							</f:facet>
						</p:column>
						<p:column>
							<f:facet name="footer">
								<h:outputText id="footerStartPriceTotalOB" style="float : right"
									value="#{onlineBiddingBB.itemStartPriceTotal}">
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</h:outputText>
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}">
							<f:facet name="footer">
								<h:outputText id="lastBidPriceTotalLblOB"
									value="#{lbl['lbl.sc.total']}" style="float : right" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING}">
							<f:facet name="footer">
								<h:outputText style="float : right" styleClass="calcTotal"
									value="#{onlineBiddingBB.itemLastBidPriceTotal}">
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</h:outputText>
							</f:facet>
						</p:column>
						<p:column colspan="2"
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">
							<f:facet name="footer">
								<h:outputText id="newBidPriceTotalLblOB"
									value="#{lbl['lbl.sc.total']}" style="float : right" />
							</f:facet>
						</p:column>
						<p:column
							rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq BidStatusConst.BID_IN_PROGRESS}">
							<f:facet name="footer">
								<h:outputText style="float : right" styleClass="calcTotal"
									value="#{onlineBiddingBB.itemNewBidPriceTotal}">
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</h:outputText>
							</f:facet>
						</p:column>
						<p:column
							rendered="#{(onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypeItem) and (onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING)}" />
					</p:row>
				</p:columnGroup>
			</p:dataTable>
			<p:remoteCommand name="rc" update="itemWiseBidListOB" />

		</p:panel>

		<p:confirmDialog id="newBidPriceConfirm" width="300px"
			message="#{lbl['lbl.sc.bidding.confirm.message']}"
			widgetVar="newBidPriceConfirm">
			<div align="right">
				<p:commandButton id="confSubmit" value="#{lbl['lbl.btn.yes']}"
					action="#{onlineBiddingBB.updateBidPriceAndCalculateRank}"
					process="@this" oncomplete="newBidPriceConfirm.hide()"
					update=":form:itemWiseBidListOB" />
				<p:commandButton id="confNotSubmit" value="#{lbl['lbl.btn.no']}"
					process="@this" onclick="newBidPriceConfirm.hide()"
					oncomplete="rc();" />
			</div>
		</p:confirmDialog>

		<h:panelGroup id="packageRankingPanelOB" style="width : 100%">

			<h:panelGroup style="width : 100% ; align: right;"
				rendered="#{(onlineBiddingBB.scBidSchedule.scBid.recommendedTypeId.parameterCode eq onlineBiddingBB.recommendTypePackage) and (onlineBiddingBB.scBidSchedule.pmStatus.statusId ne BidStatusConst.BID_PENDING_BIDDING)}">

				<div style="align: right">
					<TABLE style="width: 100%">
						<TR>
							<TD style="width: 88%" />
							<TD style="width: 9%"><h:outputText
									value="#{lbl['lbl.sc.package.ranking']}" /></TD>
							<TD style="width: 3%"><p:inputText id="packageRankId"
									disabled="true" size="3"
									value="#{onlineBiddingBB.packageRanking}" /></TD>
						</TR>
					</TABLE>
				</div>
			</h:panelGroup>
		</h:panelGroup>

		<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
			toggleable="true">
			<p:dataTable id="contactPersonDT"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{onlineBiddingBB.bidContactPersons}" var="contact">

				<p:column headerText="#{lbl['lbl.sc.name']}" style="width : 70%">
					<h:outputText value="#{contact.contactName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tel.no']}" style="width : 30%">
					<h:outputText value="#{contact.phoneNo}" />
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:dialog header="#{lbl['lbl.sc.item.details']}"
			widgetVar="onlineBiddingItemDetails" modal="true"
			id="onlineBiddingItemDetails">
			<ui:include
				src="/xhtml/sc/bidding/onlineBidding/onlineBiddingItemDetailsPopup.xhtml"></ui:include>
		</p:dialog>
		<p:dialog header="#{lbl['lbl.sc.notification']}"
			widgetVar="onlineBiddingNotification" showEffect="fade"
			hideEffect="fade" modal="true" id="onlineBiddingNotification">
			<ui:include
				src="/xhtml/sc/bidding/onlineBidding/biddingNotificationPopup.xhtml"></ui:include>
		</p:dialog>
	</ui:define>
</ui:composition>
