<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<h:panelGroup id="remainingTimePanel"
		rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.bidInProgress }">

		<div style="align: left">
			<table style="width: 100%;">
				<tr>
					<td style="width: 9%;"><p:outputLabel
							value="#{lbl['lbl.sc.remaining.time']}" /></td>

					<td style="width: 41%; align: left"><script
							type="application/javascript">
						
									
									
									
									
								
			var myCountdownBidding = new Countdown({time:"#{onlineBiddingBB.remainingBidTime}",hideLine: true,rangeHi: "hour",rangeLo: "second",width: 250,height: 70,
				labelText : {
	                ms     : "MS",
	                second : "#{lbl['lbl.sc.bidding.seconds']}",
	                minute : "#{lbl['lbl.sc.bidding.minutes']}",
	                hour   : "#{lbl['lbl.sc.bidding.hours']}",
	                day    : "#{lbl['lbl.sc.bidding.days']}",
	                month  : "MONTHS",
	                year   : "YEARS"
	            }
			}); 
					
								
								
								
								
					</script></td>
					<TD style="width: 50%;"></TD>
				</tr>
			</table>
		</div>
	</h:panelGroup>

	<h:panelGroup id="pendingBiddingCountDown"
		rendered="#{onlineBiddingBB.scBidSchedule.pmStatus.statusId eq onlineBiddingBB.pendingBidding}">

		<div style="align: left">
			<table style="width: 100%;">
				<tr>
					<td style="width: 9%;"><p:outputLabel
							value="#{lbl['lbl.sc.opening.time']}" /></td>
					<td style="width: 41%; align: left"><script
							type="application/javascript">
						
									
									
									
						
			var myCountdownPreBidding = new Countdown({time:"#{onlineBiddingBB.remainingBidTime}",hideLine: true,rangeHi: "day",rangeLo: "second",width: 250,height: 70,
				labelText : {
	                ms     : "MS",
	                second : "#{lbl['lbl.sc.bidding.seconds']}",
	                minute : "#{lbl['lbl.sc.bidding.minutes']}",
	                hour   : "#{lbl['lbl.sc.bidding.hours']}",
	                day    : "#{lbl['lbl.sc.bidding.days']}",
	                month  : "MONTHS",
	                year   : "YEARS"
	            }
			}); 
						
								
								
								
								
					</script></td>
					<TD></TD>
				</tr>
			</table>
		</div>

	</h:panelGroup>
</ui:composition>
