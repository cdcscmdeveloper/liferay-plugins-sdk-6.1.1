<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div align="right" style="width: 100%">
		<TABLE>
			<TR>
				<TD><p:outputLabel value="#{lbl['lbl.sc.bidding.no']}" /></TD>

				<TD><p:selectOneMenu id="currentDayBidList"
						style="width : 155px"
						value="#{onlineBiddingBB.selectedBidScheduleId}">
						<f:selectItems var="bid"
							value="#{onlineBiddingBB.activeBidSchedules}"
							itemLabel="#{bid.bidNo}" itemValue="#{bid.bidScheduleId}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{onlineBiddingBB.selectedBidChangeListener()}" />

					</p:selectOneMenu></TD>
				<td><ac:iconTooltip
						value="#{lbl['lbl.sc.online.bidding.tooltip']}" /></td>
			</TR>
		</TABLE>

	</div>

	<p:panel header="#{lbl['lbl.sc.bid.details']}" id="bidDetailsPanel"
		toggleable="true">

		<table style="width: 100%;">

			<tr>
				<td style="width: 55%;"><p:outputPanel>
						<table style="width: 100%;">
							<tr>
								<td style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.bidding.no']}" /></td>
								<td><p:inputText id="bidNo"
										value="#{onlineBiddingBB.scBidSchedule.bidNo}" disabled="true"
										size="20" /></td>
								<td style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.document.no']}" /></td>
								<td><p:inputText id="documentNo"
										value="#{onlineBiddingBB.scBidSchedule.scBid.docNo}"
										disabled="true" size="20" /></td>
							</tr>


							<tr>
								<td style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.document.title']}" /></td>
								<td colspan="3"><p:inputTextarea id="documentTitle"
										disabled="true" readonly="true" autoResize="true" cols="90"
										value="#{onlineBiddingBB.scBidSchedule.scBid.docTitle}"
										rows="3" /></td>
							</tr>

							<tr>
								<td style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.ptj']}" /></td>
								<td colspan="3"><ui:param name="date"
										value="#{onlineBiddingBB.retriveDatesforOrgProfile(onlineBiddingBB.scQt.publishDate,onlineBiddingBB.scQt.createdDate)}"></ui:param>
									<p:inputText id="ptjName"
										value="#{onlineBiddingBB.retrievePTJByOrgProfileId(onlineBiddingBB.scBidSchedule.scBid.pmOrgProfile.orgProfileId,date)}"
										disabled="true" size="88" /></td>
							</tr>
							<tr>
								<td style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.bidding.start']}" /></td>
								<td><p:inputText id="bidStart"
										value="#{onlineBiddingBB.scBidSchedule.startDate}"
										disabled="true" size="20">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</p:inputText></td>
								<TD style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.bidding.end']}" /></TD>
								<TD><p:inputText id="bidEnd"
										value="#{onlineBiddingBB.scBidSchedule.endDate}"
										disabled="true" size="20">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</p:inputText></TD>
							</tr>
							<tr>
								<TD style="width: 120px"><p:outputLabel
										value="#{lbl['lbl.sc.status']}" /></TD>
								<TD colspan="3"><p:inputText id="bidStatus"
										value="#{onlineBiddingBB.getStatusDescById(onlineBiddingBB.scBidSchedule.pmStatus.statusId)}"
										disabled="true" size="88" /></TD>
							</tr>
							<c:if
								test="#{onlineBiddingBB.scBidSchedule.tplSpecZoneDtl ne null}">
								<tr>
									<td style="width: 120px"><p:outputLabel id="zoneNameLbl"
											value="#{lbl['lbl.sc.zone.name']}" /></td>
									<td><p:inputText id="zoneNameLabel" disabled="true"
											size="15"
											value="#{onlineBiddingBB.scBidSchedule.tplSpecZoneDtl.zoneName}" />
										<p:commandLink id="zoneName" oncomplete="zoneLocPopup.show();"
											partialSubmit="true" process="@this"
											update="@([id$=zoneLocPopup])">
											<p:graphicImage id="zoneDtlId"
												title="#{lbl['lbl.sc.zone.details']}"
												value="#{CommonUIConstant.imagePathUptoDesign}/evaluate.png" />
											<f:setPropertyActionListener
												target="#{zoneLocationBackingBean.tplSpecZoneDtl}"
												value="#{onlineBiddingBB.scBidSchedule.tplSpecZoneDtl}" />
										</p:commandLink></td>
									<td></td>
									<td></td>
								</tr>
							</c:if>
						</table>
					</p:outputPanel></td>
				<td style="width: 45%;"><p:outputPanel>
						<table style="width: 100%;">
							<tr>
								<td>#{lbl['lbl.sc.notes']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.sc.bidding.clause1']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.sc.bidding.clause2']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.sc.bidding.clause3']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.sc.bidding.clause4']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.sc.bidding.clause5']}</td>
							</tr>
							<tr>
								<td>#{lbl['lbl.sc.bidding.clause6']}</td>
							</tr>
						</table>
					</p:outputPanel></td>
			</tr>
		</table>
	</p:panel>

	<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />

</ui:composition>
