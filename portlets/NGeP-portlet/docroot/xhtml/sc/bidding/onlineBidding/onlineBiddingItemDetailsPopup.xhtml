<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table>
		<tr>
			<TD><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></TD>
			<TD><p:inputText
					value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
					size="35" disabled="true" /></TD>
		</tr>
		<tr>
			<TD><p:outputLabel value="#{lbl['lbl.sc.item.description']}" /></TD>
			<TD><p:inputTextarea cols="80" rows="5"
					value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.itemDesc}"
					disabled="true" /></TD>
		</tr>
		<tr>
			<p:spacer height="4"></p:spacer>
			<TD><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></TD>
			<TD><p:inputText
					value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.uom.uomName}"
					size="20" disabled="true" /></TD>
		</tr>
		<h:panelGroup
			rendered="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.itemType.parameterCode eq onlineBiddingBB.servicetype}">
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" /></TD>
				<TD><p:inputText style="text-align : right;"
						value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.tplSpecQuestion.clUomFrequency}"
						size="20" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</p:inputText></TD>
			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" /></TD>
				<TD><p:inputText style="text-align : right;"
						value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.tplSpecQuestion.clUomPerDay}"
						size="20" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></TD>
			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" /></TD>
				<TD><p:inputText style="text-align : right;"
						value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.scRequestItem.tplSpecQuestion.clUomPerMonth}"
						size="20" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></TD>
			</tr>
		</h:panelGroup>
		<tr>
			<TD><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></TD>
			<TD><p:inputText style="text-align : right;"
					value="#{onlineBiddingBB.scBidPrice.scBidSupplierItem.scBidItem.qty}"
					size="20" disabled="true">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></TD>
		</tr>
	</table>
	<table>
	<tr>
	<td><p:commandButton value="#{lbl['lbl.btn.close']}" style="float : right" styleClass="BtnSpacing"
			onclick="itemDetails.hide();" />
	</td>
	</tr>
	</table>
</ui:composition>
