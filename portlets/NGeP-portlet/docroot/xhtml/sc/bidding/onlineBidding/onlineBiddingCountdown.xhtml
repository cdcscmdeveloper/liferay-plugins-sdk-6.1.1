<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
		<p:panel id="pendingBiddingPanel" header="#{lbl['lbl.sc.bidding.bid.price.details']}" toggleable="true">
			<p:spacer height="5"></p:spacer>
			<div style="align: left">
				<table style="width: 100%;">
					<tr>
						<td style="width: 9%;"><p:outputLabel
								value="#{lbl['lbl.sc.opening.time']}" /></td>
						<td style="width: 41%; align: left"><script
								type="application/javascript">
							
							
						
			var myCountdownPreBidding = new Countdown({time:"#{onlineBiddingBB.remainingBidTime}",hideLine: true,rangeHi: "day",rangeLo: "second",width: 250,height: 70,
				labelText : {
	                ms     : "MS",
	                second : "#{lbl['lbl.sc.bidding.seconds']}",
	                minute : "#{lbl['lbl.sc.bidding.minutes']}",
	                hour   : "#{lbl['lbl.sc.bidding.hours']}",
	                day    : "#{lbl['lbl.sc.bidding.days']}",
	                month  : "MONTHS",
	                year   : "YEARS"
	            }
			}); 
						
						
						
						</script></td>
						<TD><h:outputLabel value="#{lbl['lbl.sc.notes']}" /></TD>
					</tr>
				</table>
			</div>
			<p:spacer height="5"></p:spacer>

			<div style="width: 100%">

				<p:dataTable id="bidItemWisePriceListPB"
				    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{onlineBiddingBB.bidPrices}" var="bidPriceItem">

					<p:columnGroup type="header">
						<p:row>
							<p:column rowspan="2" style="width: 53%">
								<f:facet name="header">
									<h:outputText value="#{lbl['lbl.sc.item.name']}" />
									<ac:iconTooltip value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
								</f:facet>
							</p:column>
							<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
								style="width: 7%" />
							<p:column rowspan="2" style="width: 10%">
								<f:facet name="header">
									<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
									<ac:iconTooltip value="#{lbl['lbl.sc.min.decrement.block.supplier.tooltip']}" />
								</f:facet>
							</p:column>
							<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
								style="width: 30%;text-align:center" />
						</p:row>
						<p:row>
							<p:column headerText="#{lbl['lbl.sc.unit.price']}"
								style="width: 15%;text-align:center" />
							<p:column headerText="#{lbl['lbl.sc.sub.total']}"
								style="width: 15%;text-align:center" />

						</p:row>
					</p:columnGroup>
					<p:column>
						<p:commandLink
							value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
							action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
							oncomplete="onlineBiddingItemDetails.show" />
					</p:column>
					<p:column>
						<h:outputText style="float : right"
							value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.uom.uomCode)}" />
						</h:outputText>
					</p:column>
					<p:column>
						<h:outputText style="float : right"
							value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column>
						<h:outputText style="float : right"
							value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column>
						<h:outputText style="float : right"
							value="#{bidPriceItem.scBidSupplierItem.itemStartPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>

					<p:columnGroup type="footer">

						<p:row>
							<p:column colspan="4" footerText="#{lbl['lbl.sc.total']}" style="text-align:right" />
							<p:column id="itemStartPriceTotal" style="text-align:right"
								footerText="#{onlineBiddingBB.itemStartPriceTotal}">

							</p:column>
						</p:row>

					</p:columnGroup>
				</p:dataTable>
			</div>
		</p:panel>
</ui:composition>
