<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="contentSection">





		<p:messages id="onlineBidSearchMsg" autoUpdate="true"
			showDetail="true" showSummary="false" closable="true"
			severity="error, info" />



		<p:panel header="#{lbl['lbl.sc.search']}" id="onlineBidSearchPanel"
			toggleable="true">

			<div>
				<table style="width: 100%; align: left;">

					<tr>
						<td style="width: 20%"><p:outputLabel id="onlineBidSearchLbl"
								value="#{lbl['lbl.sc.bidding.no']}" /></td>
						<td style="width: 20%"><p:inputText
								id="onlineBidSearchBidNum"
								value="#{onlineBidSearchBB.managedBean.onlineBidSearch.searchBiddingNo}"
								size="20">
								<f:validateLength maximum="20" />

							</p:inputText></td>
						<td style="width: 20%"></td>
						<td style="width: 20%"></td>
						<td style="width: 20%"></td>

					</tr>

					<tr>
						<td style="width: 20%"><p:outputLabel
								id="onlineBidSearchDocNoLbl"
								value="#{lbl['lbl.sc.document.no']}" /></td>
						<td style="width: 20%"><p:inputText
								id="onlineBidSearchDocNum"
								value="#{onlineBidSearchBB.managedBean.onlineBidSearch.searchDocumentNo}"
								size="20">
								<f:validateLength maximum="17" />
							</p:inputText></td>
						<td style="width: 20%"></td>
						<td style="width: 20%"></td>
						<td style="width: 20%"></td>

					</tr>

					<tr>

						<td style="width: 20%"><p:outputLabel
								value="#{lbl['lbl.sc.document.title']}" /></td>
						<td style="width: 60%" colspan="3"><p:inputText
								id="onlineBidSearchDocTitle"
								value="#{onlineBidSearchBB.managedBean.onlineBidSearch.searchBidTitle}"
								size="110">
								<f:validateLength maximum="1000" />
							</p:inputText></td>
						<td style="width: 20%"></td>

					</tr>

					<tr>
						<td style="width: 20%"><p:outputLabel
								id="onlineBidSearchFromLbl"
								value="#{lbl['lbl.sc.bidding.date.from']}" /></td>
						<td style="width: 20%"><p:calendar size="20"
								value="#{onlineBidSearchBB.managedBean.onlineBidSearch.searchBiddingDateFrom}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
								id="onlineBidSearchFromDate" showOn="button">

								<p:ajax event="dateSelect"
									listener="#{onlineBidSearchBB.startDateSelectListener}"
									update="onlineBidSearchToDate" />
							</p:calendar></td>
						<td style="width: 20%"><p:outputLabel
								id="onlineBidSearchToDateLbl"
								value="#{lbl['lbl.sc.bidding.date.to']}" /></td>
						<td style="width: 20%"><p:calendar size="20"
								mindate="#{onlineBidSearchBB.managedBean.onlineBidSearch.searchBiddingDateToMinDate}"
								value="#{onlineBidSearchBB.managedBean.onlineBidSearch.searchBiddingDateTo}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
								id="onlineBidSearchToDate" showOn="button" /></td>
						<td style="width: 20%"></td>

					</tr>
					<TR>
						<td style="width: 20%"><p:outputLabel
								id="onlineBidSearchStatusLbl" value="#{lbl['lbl.sc.status']}" /></td>
						<td style="width: 20%"><p:selectOneMenu
								id="onlineBidSearchStatus"
								value="#{onlineBidSearchBB.managedBean.onlineBidSearch.selectedStatusDesc}"
								style="width:60%;margin-bottom: 5px;"
								label="#{lbl['lbl.sc.status']}">
								<f:selectItems
									value="#{onlineBidSearchBB.managedBean.onlineBidSearch.statusDescs}"
									var="status" itemLabel="#{status.statusName}"
									itemValue="#{status.pmStatus.statusId}" />
								<p:ajax event="change" process="@this" partialSubmit="true" />
							</p:selectOneMenu></td>

						<td style="width: 20%"></td>
						<td style="width: 20%"></td>
						<td style="width: 20%"></td>
					</TR>
				</table>

			</div>


			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					id="onlineBidSearchBtn" styleClass="BtnSpacing"
					process="@this,onlineBidSearchPanel" partialSubmit="true"
					action="#{onlineBidSearchBB.searchForScheduledBids}"
					update="onlineBiddingPnlList" />

				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					id="onlineBidResetBtn" styleClass="BtnSpacing"
					action="#{onlineBidSearchBB.resetOnlineBidSearchDtls}"
					process="@this" update="onlineBiddingPnlList,onlineBidSearchPanel"
					partialSubmit="true" />
			</div>

		</p:panel>

		<p:panel id="onlineBiddingPnlList"
			header="#{lbl['lbl.sc.bidding.list']}" toggleable="true">

			<p:dataTable id="onlineBidSeachList" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{onlineBidSearchBB.scheduleBidDataModel}" var="bid"
				lazy="true" rows="10">

				<ac:paginator for="onlineBidSeachList"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.bidding.no']}">
					<h:outputText id="scBidNoBS" value="#{bid.bidNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.document.no']}">
					<h:outputText id="scDocNoDTBS" value="#{bid.scBid.docNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.document.title']}">
					<h:outputText style="white-space : normal;" id="scDocTitleDTBS"
						value="#{bid.scBid.docTitle}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bid.start']}">
					<h:outputText id="scBidStartDTBS" value="#{bid.startDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bid.end']}">

					<h:outputText id="scBidEndDTBS" value="#{bid.endDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</h:outputText>
				</p:column>
				<!-- <p:column headerText="#{lbl['lbl.sc.created.by']}">

					<h:outputText id="scUserNameDTBS"
						value="#{bid.createdUser.userName}" />
				</p:column> -->
				<p:column headerText="#{lbl['lbl.sc.status']}">

					<h:outputText id="onlineBidStatusDTBS" style="float : left"
						value="#{onlineBidSearchBB.getStatusDescById(bid.pmStatus.statusId)}" />
				</p:column>
				<p:column style="width :10%; align: center">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.action']}" />

					</f:facet>


					<p:commandLink id="bidManagementNavigationBtn" size="5"
						action="#{onlineBidSearchBB.viewOnlineBiddingDtls(bid,view.viewId)}"
						process="@this">

						<p:graphicImage id="onlineViewBtnImage"
							value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png"
							title="#{lbl['lbl.txt.view']}" />
						<p:spacer width="5"></p:spacer>
					</p:commandLink>








				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>


</ui:composition>
