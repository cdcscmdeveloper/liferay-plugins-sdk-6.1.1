<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel id="BidCompletedPanel" header="#{lbl['lbl.sc.bidding.bid.price.details']}"
		toggleable="true">
			<div style="align: left">
				<table style="width: 40%;">
					<tr>
						<td style="width: 40%;"><p:outputLabel
								value="#{lbl['lbl.sc.remaining.time']}" /></td>
						<td style="width: 20%;"><p:inputText size="3" disabled="true"
								value="#{onlineBiddingBB.remainingHours}" /></td>
						<td style="width: 20%;"><p:inputText size="3" disabled="true"
								value="#{onlineBiddingBB.remainingMinutes}" /></td>
						<td style="width: 20%;"><p:inputText size="3" disabled="true"
								value="#{onlineBiddingBB.remainingSeconds}" /></td>
					</tr>

					<tr>
						<td style="width: 40%;"></td>
						<td style="width: 20%;"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.hours']}" /></td>
						<td style="width: 20%;"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.minutes']}" /></td>
						<td style="width: 20%;"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.seconds']}" /></td>
					</tr>
				</table>

			</div>
			<div style="align: right">
				<table style="width: 60%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.notes']}" /></td>
					</tr>
				</table>
			</div>
		
		<p:spacer height="5"></p:spacer>
		<p:dataTable id="itemWiseBidList"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			style="word-wrap: break-word ; table-layout: fixed"
			value="#{onlineBiddingBB.bidPrices}" var="bidPriceItem">

			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" width="22%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.item.name']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
						</f:facet>
					</p:column>

					<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
						width="7%" />

					<p:column rowspan="2" style="white-space : normal" width="4%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.min.decrement.block.supplier.tooltip']}" />
						</f:facet>
					</p:column>

					<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
						width="19%" style="text-align:center" />

					<p:column colspan="2" headerText="#{lbl['lbl.sc.last.bid']}"
						width="19%" style=" text-align:center" />

				</p:row>
				<p:row>
					<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

					<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

				</p:row>
			</p:columnGroup>
			<p:column>
				<p:commandLink
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
					action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
					oncomplete="onlineBiddingItemDetails.show()" />
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right" value="#{bidPriceItem.bidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>

				<h:panelGroup id="lastBidPriceSubTotal">
					<h:outputText style="float : right"
						rendered="#{(bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty) ne 0}"
						value="#{bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</h:panelGroup>
			</p:column>
			<p:columnGroup type="footer">
				<p:row>
					<p:column colspan="4" footerText="#{lbl['lbl.sc.total']}" style="text-align:right" />
					<p:column footerText="#{onlineBiddingBB.itemStartPriceTotal}" />
					<p:column footerText="#{lbl['lbl.sc.total']}" style="text-align:right" />
					<p:column footerText="#{onlineBiddingBB.itemLastBidPriceTotal}" />
				</p:row>
			</p:columnGroup>
		</p:dataTable>
	</p:panel>
</ui:composition>
