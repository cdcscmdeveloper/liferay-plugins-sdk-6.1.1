<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


<p:panel header="Bid" toggleable="true">
<p:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:commandButton id="addbidding" value="ADD BIDDING ROOM" onclick="adddlg.show();" style="float:right;"></p:commandButton>
			</p:panelGrid>
			
			</p:panel>
			<p:tabView id="tabView">  
  
    <p:tab id="tab1" title="Bidding Room 1">  
    	<ui:include src="/xhtml/sc/bidding/biddetail.xhtml" />
    
   
    </p:tab> 
     <p:tab id="tab2" title="Bidding Room 2">  
    	<ui:include src="/xhtml/sc/bidding/biddetail.xhtml" />
    
   
    </p:tab>   
      <p:tab id="tab3" title="Bidding Room 3">  
    	<ui:include src="/xhtml/sc/bidding/biddetail.xhtml" />
    
   
    </p:tab>  
    </p:tabView>
    <p:dialog widgetVar="adddlg" modal="true">
		<p:panel header="ADD BIDDING ROOMS" toggleable="true">
		
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			
		<h:outputText value="Document No." />
		
				<p:inputText id="docno" value="" />
				
		<h:outputText value="Bid No." />
		
				<p:inputText id="bidno" value=""   />
				
				</p:panelGrid>
				
				<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			style="float:right;">

		</p:commandButton>
				
				</p:panel>
				</p:dialog>

			</ui:composition>
