<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">

		<div align="left" class="header-info">

			<table style="width: 100%">

				<tr>
					<td style="width: 7%"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.no']}" /></td>
					<td style="width: 14%" class="header-info-text">
						#{biddingBB.managedBean.scheduledBid.bidNo}</td>
					<td style="width: 8%"><p:outputLabel
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td style="width: 14%" class="header-info-text">#{biddingBB.managedBean.scheduledBid.scBid.docNo}
					</td>

					<td style="width: 6%"><p:outputLabel
							value="#{lbl['lbl.sc.ptj.name']}" /></td>
					<td style="width: 36%" class="header-info-text">#{biddingBB.managedBean.scheduledBid.scBid.pmOrgProfile.orgName}
					</td>

					<td style="width: 5%"><p:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>

					<td style="width: 10%" class="header-info-text">#{biddingBB.getStatusDescById(biddingBB.managedBean.scheduledBid.pmStatus.statusId)}
					</td>

				</tr>

			</table>

		</div>

		<p:panel header="#{lbl['lbl.sc.bid.details']}"
			id="bidDetailsForBidManagement" toggleable="true">

			<div>
				<table style="width: 100%">

					<tr>
						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.start']}" /></td>
						<td><p:inputText id="bidStart"
								value="#{biddingBB.managedBean.scheduledBid.startDate}"
								size="20" disabled="true">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.end']}" /></td>
						<td><p:inputText id="bidEnd"
								value="#{biddingBB.managedBean.scheduledBid.endDate}" size="20"
								disabled="true">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
					</tr>

					<tr>
						<td style="width: 110px"><p:outputLabel
								value="#{lbl['lbl.sc.duration.hours']}" /></td>
						<td><p:inputText id="duration" size="20" disabled="true"
								value="#{biddingBB.managedBean.duration}" /></td>
						<td></td>
						<td></td>

					</tr>

					<tr>

						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.zone.name']}" /></td>
						<td colspan="3"><p:inputText id="zoneName" disabled="true"
								value="#{biddingBB.managedBean.scheduledBid.tplSpecZoneDtl.zoneName}" />
							<p:commandLink id="zoneList" size="5"
								oncomplete="zoneLocPopup.show();" partialSubmit="true"
								process="@this" update="@([id$=zoneLocPopup])">
								<p:graphicImage library="ep/images/design" name="evaluate.png"
									value="/resources/ep/images/design/evaluate.png" />
								<f:setPropertyActionListener
									target="#{zoneLocationBackingBean.tplSpecZoneDtl}"
									value="#{scLoiLoaItem.tplSpecZoneDtl}" />
							</p:commandLink></td>
						<td></td>
						<td></td>
					</tr>

					<tr>

						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.view.by']}" /></td>
						<td colspan="3"><p:selectOneMenu id="viewBy"
								value="#{biddingBB.managedBean.bidManagementViewBy}" size="20">

								<f:selectItem itemLabel="Package" itemValue="P"></f:selectItem>
								<f:selectItem itemLabel="Item" itemValue="I"></f:selectItem>
								<p:ajax event="change" process="@this" partialSubmit="true"
									listener="#{biddingBB.viewByChangeListener}"
									update="bidManagement"></p:ajax>

							</p:selectOneMenu></td>
						<td></td>
						<td></td>
					</tr>
				</table>
			</div>

		</p:panel>

		<h:panelGroup id="bidManagement">

			<ui:fragment
				rendered="#{biddingBB.managedBean.bidManagementViewBy eq 'P'}">
				<ui:include src="bidManagementByPackage.xhtml"></ui:include>
			</ui:fragment>

			<ui:fragment
				rendered="#{biddingBB.managedBean.bidManagementViewBy eq 'I'}">
				<ui:include src="bidManagementByItem.xhtml"></ui:include>
			</ui:fragment>

		</h:panelGroup>

		<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.zone.location']}" rendered="false"
			widgetVar="zoneLocPopup" showEffect="fade" hideEffect="fade"
			modal="true" id="zoneLocPopup">
			<ui:include src="/xhtml/sc/bidding/BMByItemZoneLocationPopup.xhtml"></ui:include>
		</p:dialog>
	</ui:define>
</ui:composition>
