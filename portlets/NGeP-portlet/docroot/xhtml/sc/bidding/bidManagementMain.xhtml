<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">

	</ui:define>

	<ui:define name="contentSection">
		<ui:param name="isZonal"
			value="#{!biddingBB.managedBean.scheduledBid.tplSpecZoneDtl.zoneName eq null}" />

		<ui:param name="isViewByPackage"
			value="#{biddingBB.managedBean.bidManagementViewBy eq 'P'}" />
		<ui:param name="isViewByItem"
			value="#{biddingBB.managedBean.bidManagementViewBy eq 'I'}" />



		<div align="left" class="header-info">

			<table style="width: 100%">

				<tr>
					<td ><p:outputLabel
							value="#{lbl['lbl.sc.bidding.no']}" /></td>
					<td  class="header-info-text">
						#{biddingBB.managedBean.scheduledBid.bidNo}</td>
					<td ><p:outputLabel
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td style="width: 14%" class="header-info-text">#{biddingBB.managedBean.scheduledBid.scBid.docNo}
					</td>

					<td ><p:outputLabel
							value="#{lbl['lbl.sc.ptj.name']}" /></td>
					<td  class="header-info-text">#{biddingBB.managedBean.scheduledBid.scBid.pmOrgProfile.orgName}
					</td>

					<td ><p:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>

					<td  class="header-info-text">#{biddingBB.getStatusDescById(biddingBB.managedBean.scheduledBid.pmStatus.statusId)}
					</td>

				</tr>

			</table>

		</div>

		<p:panel header="#{lbl['lbl.sc.bid.details']}"
			id="bidDetailsForBidManagement" toggleable="true">

			<div align="center">
				<table style="width: 60%">

					<tr>
						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.start']}" /></td>
						<td><p:inputText id="bidStart"
								value="#{biddingBB.managedBean.scheduledBid.startDate}"
								size="20" disabled="true">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.bidding.end']}" /></td>
						<td><p:inputText id="bidEnd"
								value="#{biddingBB.managedBean.scheduledBid.endDate}" size="20"
								disabled="true">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
					</tr>

					<tr>
						<td style="width: 110px"><p:outputLabel
								value="#{lbl['lbl.sc.duration.hours']}" /></td>
						<td><p:inputText id="duration" size="20" disabled="true"
								value="#{biddingBB.managedBean.duration}" /></td>
						<td></td>
						<td></td>

					</tr>
					<c:if test="#{isZonal}">
						<tr>
							<td style="width: 100px"><p:outputLabel
									value="#{lbl['lbl.sc.zone.name']}" /></td>
							<td><p:inputText id="zoneNameLabel" disabled="true"
									value="#{biddingBB.managedBean.scheduledBid.tplSpecZoneDtl.zoneName}" />
								<p:spacer width="5"></p:spacer> <p:commandLink id="zoneName"
									oncomplete="zoneLocPopup.show();" partialSubmit="true"
									process="@this" update="@([id$=zoneLocPopup])">
									<p:graphicImage library="ep/images/design" name="evaluate.png"
										value="/resources/ep/images/design/evaluate.png" />
									<f:setPropertyActionListener
										target="#{zoneLocationBackingBean.tplSpecZoneDtl}"
										value="#{biddingBB.managedBean.scheduledBid.tplSpecZoneDtl}" />
								</p:commandLink></td>
							<td></td>
							<td></td>
						</tr>
					</c:if>


					<tr>
						<td style="width: 100px"><p:outputLabel
								value="#{lbl['lbl.sc.view.by']}" /></td>
						<td><p:selectOneMenu id="viewBy"
								value="#{biddingBB.managedBean.bidManagementViewBy}"
								style="width : 138px">
								<f:selectItem itemLabel="#{lbl['lbl.sc.package']}" itemValue="P"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.sc.item']}" itemValue="I"></f:selectItem>
								<p:ajax process="@this" partialSubmit="true" event="change"
									listener="#{biddingBB.viewByChangeListener}" update="bidManagementPanel"></p:ajax>
							</p:selectOneMenu></td>
						<td></td>
						<td></td>
					</tr>
				</table>
			</div>

		</p:panel>
		<p:panel id="bidManagementPanel">
		<c:if test="#{isViewByPackage}">
			<ui:include src="bidManagementByPackage.xhtml"></ui:include>
		</c:if>
		<c:if test="#{isViewByItem}">
			<ui:include src="bidManagementByItem.xhtml"></ui:include>
		</c:if>
		</p:panel>

		<p:dialog id="zoneLocPopup" widgetVar="zoneLocPopup" rendered="false"
			header="#{lbl['lbl.tpl.spec.zone.details']}" modal="true" width="350"
			height="200">
			<ui:include src="/xhtml/sc/bidding/BMByItemZoneLocationPopup.xhtml" />
		</p:dialog>

	</ui:define>
</ui:composition>
