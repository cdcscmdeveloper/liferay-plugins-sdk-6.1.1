<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:messages id="ScheduleBidding" showDetail="true" autoUpdate="true"
		closable="true" />

	<div align="right">

		<p:commandButton value="#{lbl['lbl.sc.bidding.schedulebid.save']}"
			process="@all" partialSubmit="true" style="float:right;"
			icon="ui-icon-save"
			action="#{scheduleBiddingBB.saveScheduledBidAction}/>
	
		<p:commandButton value="
			#{lbl['lbl.sc.bidding.schedulebid.submit']}" process="@this"
			partialSubmit="true" style="float:right;" icon="ui-icon-submit"
			action="#{scheduleBiddingBB.saveScheduledBidAction}" />

	</div>

	<div align="left" class="header-info">

		<table>

			<tr>

				<td style="width: 200px"><h:outputText
						value="#{lbl['lbl.sc.bidding.schedulebid.docno']}" /></td>
				<td><p:inputText id="documentNo"
						value="#{scheduleBiddingBB.managedBean.docNo}" disabled="true" /></td>


				<td style="width: 200px"><h:outputText
						value="#{lbl['lbl.sc.bidding.schedulebid.ptjname']}" /></td>
				<td><p:intputText id="ptjName"
						value="#{scheduleBiddingBB.managedBean.ptjName}" disabled="true" /></td>

				<td style="width: 200px"><h:outputText
						value="#{lbl['lbl.sc.bidding.schedulebid.status']}" /></td>

				<td><p:inputText id="status"
						value="#{scheduleBiddingBB.managedBean.status}" disabled="true" /></td>

			</tr>

		</table>

	</div>

	<p:panel header="#{lbl['lbl.sc.bidding.schedulebid.bs']}"
		toggleable="true">

		<p:dataTable id="bidSchedule"
			value="#{scheduleBiddingBB.managedBean.bidScheduleList}"
			var="scheduleBid">

			<p:column selectionMode="multiple" style="width:2%"></p:column>

			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.itemname']}">
				<p:commandLink value="#{scheduleBid.itemName}"
					action="#{scheduleBiddingBB.participantListAction()}" onClick="" />
			</p:column>
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.itemdesc']}">
				<h:outputText value="#{scheduleBid.itemDescription}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.uom']}">
				<h:outputText value="#{scheduleBid.uom}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.qty']}">
				<h:outputText value="#{scheduleBid.quantity}" />
			</p:column>
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.bidstart']}">

				<p:calendar value="#{scheduleBid.bidStart}" showOn="button"
					mindate="#{DateUtils.getCurrentDateWithoutTime} + 1}"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />

			</p:column>
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.bidend']}">

				<p:calendar value="#{scheduleBid.bidEnd}" showOn="button" maxdate=""
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />

			</p:column>
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.duration']}">
				<h:outputText value="#{scheduleBid.bidDuration}" />
			</p:column>
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.bs.dt.decrement']}">

				<p:inputText value="#{scheduleBid.minDecrement}" />
			</p:column>

		</p:dataTable>

		<div align="left">

			<table style="width: 500px; align: center">

				<tr>

					<td><h:outputText
							value="#{lbl['lbl.sc.bidding.schedulebid.bs.bidstart']}" /></td>
					<td><p:calendar value="#{scheduleBid.bidStart}"
							showOn="button" mindate="#{DateUtils.getCurrentDateWithoutTime} + 1}"
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" /> <p:calendar></p:calendar></td>
					<td><h:outputText
							value="#{lbl['lbl.sc.bidding.schedulebid.bs.bidend']}" /></td>
					<td><p:calendar value="#{scheduleBid.bidEnd}" showOn="button"
							maxdate="" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</td>

				</tr>

			</table>

			<p:commandButton
				value="#{lbl['lbl.sc.bidding.schedulebid.bs.apply']}"
				 icon="ui-icon-apply" action="#{}" />

		</div>





	</p:panel>

	<p:panel header="#{lbl['lbl.sc.bidding.schedulebid.cpd']}"
		toggleable="true">

		<p:dataTable var="contact" id="contactPersonDetails"
			widgetVar="contactDtls"
			value="#{scheduleBiddingBB.managedBean.scBidContactPerson}"
			selection="#{scheduleBiddingBB.managedBean.multiSelectContact}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{meeting}">
			<!-- <ac:paginator for="contactPersonDetails"/> have to create this component if necessary -->
			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.schedulebid.cpd.name']}"
				style="width:30%">

				<p:inputText value="#{scheduleBid.contactName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.schedulebid.cpd.telno']}"
				style="width:30%">

				<p:inputText value="#{scheduleBid.contactNo}" />
			</p:column>

		</p:dataTable>

		<p:spacer height="10"></p:spacer>
		
		<div align="right">

			<p:commandButton value="#{lbl['lbl.sc.bidding.schedulebid.cpd.add']}"
				process="@this,contactPersonDetails" partialSubmit="true"
				action="#{scheduleBiddingBB.addContactAction}"
				oncomplete="contactDtls.paginator.endLink.click();"
				update="evaluationmeetingDetails" icon="ui-icon-add" />
			

			<p:commandButton
				value="#{lbl['lbl.sc.bidding.schedulebid.cpd.delete']}"
				icon="ui-icon-delete"
				action="#{scheduleBiddingBB.deleteContactDetails}"
				update="contactPersonDetails" />

		</div>
	</p:panel>
</ui:composition>
