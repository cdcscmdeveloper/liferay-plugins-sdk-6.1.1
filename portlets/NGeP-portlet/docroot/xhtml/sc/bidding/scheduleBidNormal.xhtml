<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="ScheduleBiddingNormalMessage" showDetail="true"
			autoUpdate="true" closable="true" />
		<div align="right" style="width: 100%">
			<p:commandButton value="
			#{lbl['lbl.btn.submit']}"
				icon="ui-icon-submit"
				action="#{scheduleBiddingBB.saveNonZoneBidsScheduledAction}" />
		</div>
		<div align="left" class="header-info" style="width: 100%">
			<table style="width: 100%">
				<tr>
					<td ><p:outputLabel
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td class="header-info-text">
						#{scheduleBiddingBB.managedBean.scQt.qtNo}</td>

					<td ><p:outputLabel
							value="#{lbl['lbl.sc.ptj.name']}" /></td>

					<td  class="header-info-text">
						#{scheduleBiddingBB.managedBean.scQt.pmOrgProfile.orgName}</td>

					<td ><p:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>

					<td class="header-info-text">#{scheduleBiddingBB.getStatusDescById(scheduleBiddingBB.managedBean.scQt.qtStatus.statusId)}
					</td>
				</tr>

			</table>

		</div>

		<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
			rendered="#{scheduleBiddingBB.managedBean.scQtFinalization.recommendedTypeId.parameterCode eq 'I'}"
			id="schedulePanel">

			<p:dataTable id="bidSchedule" var="bidItem"
				selection="#{scheduleBiddingBB.managedBean.selectedBidItemList}"
				rowKey="#{bidItem}" rowIndexVar="index"
				value="#{scheduleBiddingBB.managedBean.bidItemList}">

				<ac:paginator for="bidSchedule"></ac:paginator>

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sc.item.name']}">
					<p:commandLink value="#{bidItem.scRequestItem.itemName}"
						oncomplete="participants.show();"
						action="#{scheduleBiddingBB.retrieveParticipantsListAction(bidItem)}"
						size="30" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.item.description']}">
					<h:outputText value="#{bidItem.scRequestItem.itemDesc}" size="30" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.uom']}">
					<h:outputText value="#{bidItem.scRequestItem.uom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.quantity']}">
					<h:outputText style="float : right"
						value="#{bidItem.scRequestItem.quantity}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bidding.start']}">
					<p:calendar value="#{bidItem.scBidSchedule.startDate}"
						showOn="button" id="bidStartDate"
						mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">

						<p:ajax event="dateSelect" process="bidStartDate"
							partialSubmit="true"
							listener="#{scheduleBiddingBB.bidStartDateSelectListener}"
							update=":form:bidSchedule:bidEndDate" />

					</p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bidding.end']}">

					<p:calendar value="#{bidItem.scBidSchedule.endDate}"
						mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
						showOn="button" id="bidEndDate"
						maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">

						<p:ajax event="dateSelect" process="bidEndDate"
							partialSubmit="true"
							listener="#{scheduleBiddingBB.bidEndDateSelectListener}"
							update=":form:bidSchedule:bidDuration" />

					</p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.duration.hours']}">
					<p:outputLabel id="bidDuration"
						value="#{scheduleBiddingBB.managedBean.duration}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.min.decrement.block']}">
					<h:outputText style="float : right"
						value="#{bidItem.decrementAmt }" disabled="true">
						<f:convertNumber for="decrementAmt"
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>

			<div align="left">

				<table style="align: left">

					<tr>

						<td><p:outputLabel value="#{lbl['lbl.sc.bidding.start']}" /></td>

						<td><p:calendar showOn="button" id="multiSelectStartDate"
								value="#{scheduleBiddingBB.managedBean.bidStart}"
								mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
								<p:ajax event="dateSelect" process="multiSelectStartDate"
									partialSubmit="true"
									listener="#{scheduleBiddingBB.bidStartDateSelectListener}"
									update="multiSelectEndDate" />

							</p:calendar></td>



						<td><p:outputLabel value="#{lbl['lbl.sc.bidding.end']}" /></td>

						<td><p:calendar showOn="button" id="multiSelectEndDate"
								mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
								maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
								value="#{scheduleBiddingBB.managedBean.bidEnd}"
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
								<p:ajax event="dateSelect" process="multiSelectEndDate"
									partialSubmit="true"
									listener="#{scheduleBiddingBB.bidEndDateSelectListener}" />

							</p:calendar></td>



						<TD><p:commandButton value="#{lbl['lbl.btn.apply']}"
								partialSubmit="true" style="float:center;" icon="ui-icon-submit"
								action="#{scheduleBiddingBB.applyBidDates}"
								process="schedulePanel" update="bidSchedule" /></TD>

					</tr>

				</table>

			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
			rendered="#{scheduleBiddingBB.managedBean.scQtFinalization.recommendedTypeId.parameterCode eq 'P'}"
			id="scheduleBidPackageNonZonePanel">

			<div align="left">

				<table style="align: left">

					<tr>

						<td><p:outputLabel value="#{lbl['lbl.sc.bidding.start']}" /></td>

						<td><p:calendar showOn="button"
								id="scheduleBidPackageStartDate"
								value="#{scheduleBiddingBB.managedBean.bidStart}"
								mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
								<p:ajax event="dateSelect" process="scheduleBidPackageStartDate"
									partialSubmit="true"
									listener="#{scheduleBiddingBB.bidStartDateSelectListener}"
									update="scheduleBidPackageEndDate" />


							</p:calendar></td>



						<td><p:outputLabel value="#{lbl['lbl.sc.bidding.end']}" /></td>

						<td><p:calendar showOn="button"
								id="scheduleBidPackageEndDate"
								mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
								maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
								value="#{scheduleBiddingBB.managedBean.bidEnd}"
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
								<p:ajax event="dateSelect" process="scheduleBidPackageEndDate"
									partialSubmit="true"
									listener="#{scheduleBiddingBB.bidEndDateSelectListener}"
									update="bidSchedulePackageDuration" />
							</p:calendar></td>
						<td><p:outputLabel value="#{lbl['lbl.sc.duration.hours']}" /></td>

						<TD><p:inputText id="bidSchedulePackageDuration"
								disabled="true"
								value="#{scheduleBiddingBB.managedBean.duration}" /></TD>
					</tr>
				</table>
			</div>

			<p:dataTable id="bidScheduleByPackage" var="bidItem"
				value="#{scheduleBiddingBB.managedBean.scBid.scBidSchedules[0].scBidItems}">

				<ac:paginator for="bidScheduleByPackage"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.item.name']}">
					<p:commandLink value="#{bidItem.scRequestItem.itemName}"
						oncomplete="participants.show();"
						action="#{scheduleBiddingBB.retrieveParticipantsListAction(bidItem)}"
						size="30" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.item.description']}">
					<h:outputText value="#{bidItem.scRequestItem.itemDesc}" size="30" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.uom']}">
					<h:outputText value="#{bidItem.scRequestItem.uom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.quantity']}">
					<h:outputText style="float : right" value="#{bidItem.scRequestItem.quantity}" >
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
					
					</h:outputText>
					
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.min.decrement.block']}">
					<h:outputText style="float : right" value="#{bidItem.decrementAmt }" >
					<f:convertNumber for="decrementAmt"
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:dialog closeOnEscape="true"
			header="#{lbl['lbl.sc.participant.list']}" widgetVar="participants"
			resizable="true" showEffect="fade" hideEffect="fade" modal="true"
			id="participants">

			<ui:include src="/xhtml/sc/bidding/scheduleBidParticipantList.xhtml"></ui:include>
		</p:dialog>


		<p:spacer height="10"></p:spacer>

		<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
			id="contactDetailsPanel" toggleable="true">


			<p:dataTable var="contact" id="contactPersonDetails"
				widgetVar="contactDtls"
				value="#{scheduleBiddingBB.managedBean.scBidContactPersonList}"
				selection="#{scheduleBiddingBB.managedBean.multiSelectContact}"
				editable="true" rowIndexVar="index" style="width:100%"
				rowKey="#{contact}">
				<ac:paginator for="contactPersonDetails" />
				<p:column selectionMode="multiple" style="width:2%"></p:column>
				<p:column id="contactName" headerText="#{lbl['lbl.sc.name']}"
					style="width:68%">
					<p:inputText value="#{contact.contactName}" size="40">

						<p:message id="contactNameMsg" for="contactName" display="icon" />

					</p:inputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.telephone.no']}"
					style="width:30%">
					<p:inputText id="phoneNo" value="#{contact.phoneNo}" size="40">
						<p:message id="contactPhoneNoMsg" for="phoneNo" display="icon" />
					</p:inputText>
				</p:column>

			</p:dataTable>

			<p:spacer height="10"></p:spacer>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
					process="@this,contactPersonDetails" partialSubmit="true"
					action="#{scheduleBiddingBB.addContactAction}" icon="ui-icon-add"
					oncomplete="contactDtls.paginator.endLink.click();"
					update="contactPersonDetails" />

				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					icon="ui-icon-delete"
					action="#{scheduleBiddingBB.deleteContactDetails}"
					update="contactPersonDetails" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
