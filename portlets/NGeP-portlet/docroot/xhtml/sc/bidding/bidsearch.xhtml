<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true">

		<div>
			<table style="width: 100%">

				<tr>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.no']}" /></td>
					<td><p:inputText id="biddingNo"
							value="#{biddingBB.managedBean.searchBiddingNo}"
							size="20" /></td>
					<td></td>
					<td></td>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>
					<td> <p:selectManyMenu id="pickedStatus" showCheckbox="true"
							style="height:100px;width: 200px;"
							value="#{biddingBB.managedBean.selectedStatusDescList}" > <f:selectItems
							value="#{catalogueBackingBean.managedBean.statusDescList}"
							var="status" itemLabel="#{status.statusName}"
							itemValue="#{status.statusId}"></f:selectItems> </p:selectManyMenu> </td>
				</tr>

				<tr>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td><p:inputText id="docNo"
							value="#{biddingBB.managedBean.searchDocumentNo}"
							size="20" /></td>
					<td></td>
					<td></td>
					<td></td>
					<td></td>
				</tr>

				<tr>

					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText id="bidTitle"
							value="#{biddingBB.managedBean.searchBidTitle}"
							size="115" /></td>
					<td></td>
					<td></td>
				</tr>

				<tr>

					<td style="width: 150px"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.date.from']}" /></td>
					<td><p:calendar
							value="#{biddingBB.managedBean.searchBiddingDateFrom}"
							pattern="MM/dd/yyyy" id="bidFromDate" showOn="button" /></td>
					<td style="width: 150px"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.date.to']}" /></td>
					<td><p:calendar
							value="#{biddingBB.managedBean.searchBiddingDateTo}"
							pattern="MM/dd/yyyy" id="bidToDate" showOn="button" /></td>
					<td></td>
					<td></td>
				</tr>
			</table>

		</div>
		<p:spacer height="10"></p:spacer>

		<div align="right">

			<p:commandButton value="#{lbl['lbl.btn.search']}"
				icon="ui-icon-search" action="#{biddingBB.managedBean.searchForScheduledBids}"
				update="@([id$=biddingList])" />
				
				
			<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset" action="#{biddingBB.managedBean.resetSearchFormAction}" 
					update="@([id$=biddingList])" />
		</div>

	</p:panel>

	<p:spacer height="10"></p:spacer>

	<p:panel id="biddingListPanel" header="#{lbl['lbl.sc.bidding.list']}" toggleable="true">

		<p:dataTable id="biddingList"
			value="#{biddingBB.managedBean.searchDataModel}" var="bid"
			lazy="true">
			
			<ac:paginator for="biddingList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.bidding.no']}">
				<p:outputLabel value="#{bid.bidNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document.no']}">
				<p:outputLabel value="#{bid.scBid.docNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document.title']}">
				<p:outputLabel value="#{bid.scBid.docTitle}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bid.start']}">
				<p:outputLabel value="#{bid.startDate}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bid.end']}">

				<p:outputLabel value="#{bid.endDate}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.created.by']}">

				<p:outputLabel value="#{bid.createdUser.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">

				<p:outputLabel value="#{bid.pmStatus.pmStatusDescs}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}">

				<p:commandButton id="editButton" icon="ui-icon-edit" onclick="" 
					 size="5" />
				<p:commandButton id="pauseButton" icon="ui-icon-pause" action="#{biddingBB.bidPausePopUpAction(bid)}"
					onclick="bidPauseOrCancel.show();" size="5" /> 
				<p:commandButton id="cancelButton" icon="ui-icon-cancel" action="#{biddingBB.bidCancelPopUpAction(bid)}"
					onclick="bidPauseOrCancel.show();" size="5"  />
				<p:commandButton id="resumeButton" icon="ui-icon-resume" action="#{biddingBB.reScheduleOrReBidPopUpAction(bid)}"
					onclick="bidRescheduleOrResume.show();" 
					 size="5" />

			</p:column>

		</p:dataTable>

	</p:panel>

	<p:dialog  rendered="false"
		header="#{lbl['lbl.sc.pause.cancel.bid']}"
		widgetVar="bidPauseOrCancel" resizable="true" showEffect="fade"
		hideEffect="fade" modal="true" id="pauseOrCancelBid"  >
		<ui:include src="/xhtml/sc/bidding/bsPauseOrCancelBidPopup.xhtml"></ui:include>
	</p:dialog>
	<p:dialog  rendered="false"
		header="#{lbl['lbl.sc.re.schedule.bid']}"
		widgetVar="bidRescheduleOrResume" resizable="true" showEffect="fade"
		hideEffect="fade" modal="true" id="rescheduleOrResumeBid" >
		<ui:include src="/xhtml/sc/bidding/bsReScheduleOrResumeBidPopup.xhtml"></ui:include>
	</p:dialog>


</ui:composition>
