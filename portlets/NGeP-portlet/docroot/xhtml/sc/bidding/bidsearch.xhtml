<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:messages id="bidSearchMessages" showDetail="true" autoUpdate="true"
		closable="true" />
	<p:panel header="#{lbl['lbl.sc.search']}" id="bidSearchPanel"
		toggleable="true">

		<div>
			<table style="width: 100%">

				<tr>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.no']}" /></td>
					<td><p:inputText id="biddingNo"
							value="#{biddingBB.managedBean.searchBiddingNo}" size="20">
							<f:validateLength maximum="20" />

						</p:inputText></td>
					<td></td>
					<td></td>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>
					<td rowspan="3"><p:selectManyMenu id="pickedStatus"
							style="height:108px;width: 200px;"
							value="#{biddingBB.managedBean.selectedStatusDescList}">
							<f:selectItems value="#{biddingBB.managedBean.statusDescs}"
								var="status" itemLabel="#{status.statusName}"
								itemValue="#{status.pmStatus.statusId}" />
						</p:selectManyMenu></td>
				</tr>

				<tr>
					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td><p:inputText id="docNo"
							value="#{biddingBB.managedBean.searchDocumentNo}" size="20">
							<f:validateLength maximum="17" />
						</p:inputText></td>
					<td></td>
					<td></td>
					<td></td>

				</tr>

				<tr>

					<td style="width: 100px"><p:outputLabel
							value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText id="bidTitle"
							value="#{biddingBB.managedBean.searchBidTitle}" size="100">
							<f:validateLength maximum="1000" />
						</p:inputText></td>

				</tr>

				<tr>

					<td style="width: 130px"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.date.from']}" /></td>
					<td><p:calendar
							value="#{biddingBB.managedBean.searchBiddingDateFrom}"
							pattern="dd/MM/yyyy" id="bidFromDate" showOn="button">

							<p:ajax event="dateSelect"
								listener="#{biddingBB.startDateSelectListener}"
								update="bidToDate" />
						</p:calendar></td>
					<td style="width: 110px"><p:outputLabel
							value="#{lbl['lbl.sc.bidding.date.to']}" /></td>
					<td><p:calendar widgetVar="searchBiddingDateTo"
							mindate="#{biddingBB.managedBean.searchBiddingDateToMinDate}"
							value="#{biddingBB.managedBean.searchBiddingDateTo}"
							pattern="dd/MM/yyyy" id="bidToDate" showOn="button" /></td>
					<td></td>
					<td></td>
				</tr>
			</table>

		</div>

	</p:panel>
	<p:spacer height="10"></p:spacer>

	<div align="right">

		<p:commandButton value="#{lbl['lbl.btn.search']}"
			process="@this,biddingNo,pickedStatus,docNo,bidTitle,bidFromDate,bidToDate"
			icon="ui-icon-search" partialSubmit="true"
			action="#{biddingBB.managedBean.searchForScheduledBids}"
			update="@([id$=biddingListPanel])" />

		<p:commandButton value="#{lbl['lbl.btn.reset']}" icon="ui-icon-reset"
			type="reset" action="#{biddingBB.resetSearchFormAction}"
			partialSubmit="true" />
	</div>



	<p:spacer height="10"></p:spacer>

	<p:panel id="biddingListPanel" header="#{lbl['lbl.sc.bidding.list']}"
		toggleable="true">

		<p:dataTable id="biddingList"
			value="#{biddingBB.managedBean.searchDataModel}" var="bid"
			lazy="true">

			<ac:paginator for="biddingList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.bidding.no']}">
				<h:outputText value="#{bid.bidNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document.no']}">
				<h:outputText value="#{bid.scBid.docNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document.title']}">
				<h:outputText value="#{bid.scBid.docTitle}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bid.start']}">
				<h:outputText id="bidStart"  value="#{bid.startDate}" >
					<f:convertDateTime  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bid.end']}">

				<h:outputText id="bidEnd" value="#{bid.endDate}">
					<f:convertDateTime  pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"  />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.created.by']}">

				<h:outputText value="#{bid.createdUser.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">

				<p:outputLabel style="float : left"
					value="#{biddingBB.getStatusDescById(bid.pmStatus.statusId)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}">

				<p:commandLink id="bidManagementNavigationBtn" size="5"
					action="#{biddingBB.bidManagementAction(bid)}" process="@this">

					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/css/images/design/edit.png" />
						<p:spacer width="5" ></p:spacer>
				</p:commandLink>
				
				<p:commandLink id="pauseButton"
					rendered="#{biddingBB.getStatusDescById(bid.pmStatus.statusId) eq 'In Progress'}"
					process="@this" partialSubmit="true"
					actionListener="#{biddingBB.bidPausePopUpAction(bid)}"
					update="@([id$=pauseCancelPopUp])"
					oncomplete="bidPauseOrCancel.show();" size="5">
					<p:graphicImage library="ep/images/design" name="pause.png"
						value="/css/images/design/pause.png" />
						<p:spacer width="5" ></p:spacer>
				</p:commandLink>
				
				<p:commandLink id="cancelButton"
					rendered="#{biddingBB.getStatusDescById(bid.pmStatus.statusId) eq 'In Progress' or biddingBB.getStatusDescById(bid.pmStatus.statusId) eq 'Pending Bidding'}"
					process="@this" partialSubmit="true"
					actionListener="#{biddingBB.bidCancelPopUpAction(bid)}"
					update="@([id$=pauseCancelPopUp])"
					oncomplete="bidPauseOrCancel.show();" size="5">

					<p:graphicImage library="ep/images/design" name="cancel.png"
						value="/css/images/design/cancel.png" />
						<p:spacer width="5" ></p:spacer>
				</p:commandLink>
				
				
				<p:commandLink id="resumeButton"
					rendered="#{biddingBB.getStatusDescById(bid.pmStatus.statusId) eq 'Paused'}"
					process="@this" partialSubmit="true"
					actionListener="#{biddingBB.reScheduleOrReBidPopUpAction(bid)}"
					update="@([id$=rescheduleRebidPopUp])"
					oncomplete="bidRescheduleOrResume.show();" size="5">
					<p:graphicImage library="ep/images/design" name="play.png"
						value="/css/images/design/play.png" />
				</p:commandLink>


			</p:column>

		</p:dataTable>

	</p:panel>

	<p:panel id="pauseCancelPopUp">

		<p:dialog
			header="#{(biddingBB.managedBean.bidAction.actionType eq 'P') ? lbl['lbl.sc.pause.bid'] : lbl['lbl.sc.cancel.bid']}"
			widgetVar="bidPauseOrCancel" showEffect="fade" hideEffect="fade"
			modal="true" id="bidPauseOrCancel">
			<ui:include src="/xhtml/sc/bidding/bsPauseOrCancelBidPopup.xhtml"></ui:include>
		</p:dialog>

	</p:panel>
	<p:panel id="rescheduleRebidPopUp">


		<p:dialog header="#{lbl['lbl.sc.re.schedule.bid']}" width="630px" height="280px"
			widgetVar="bidRescheduleOrResume" showEffect="fade" hideEffect="fade"
			modal="true" id="rescheduleOrResumeBid">
			<ui:include
				src="/xhtml/sc/bidding/bsReScheduleOrResumeBidPopup.xhtml"></ui:include>
		</p:dialog>
	</p:panel>

</ui:composition>
