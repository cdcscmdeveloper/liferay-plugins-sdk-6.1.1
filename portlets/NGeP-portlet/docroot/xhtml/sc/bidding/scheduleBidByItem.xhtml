<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		
		<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
			id="schedulePanel">

			<p:dataTable id="bidSchedule" var="bidSchedule"
				selection="#{scheduleBiddingBB.managedBean.selectedBidBidScheduleList}"
				rowKey="#{bidSchedule}" rowIndexVar="index"
				value="#{scheduleBiddingBB.managedBean.bidScheduleList}">

				<ac:paginator for="bidSchedule"></ac:paginator>

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sc.item.name']}">
					<p:commandLink value="#{bidSchedule.scBidItems[0].scRequestItem.itemName}"
						oncomplete="participants.show();"
						action="#{scheduleBiddingBB.retrieveParticipantsListAction(bidSchedule)}"
						size="30" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.item.description']}">
					<h:outputText value="#{bidSchedule.scBidItems[0].scRequestItem.itemDesc}" size="30" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.uom']}">
					<h:outputText value="#{bidSchedule.scBidItems[0].scRequestItem.uom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.quantity']}">
					<h:outputText style="float : right"
						value="#{bidSchedule.scBidItems[0].scRequestItem.quantity}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidSchedule.scBidItems[0].scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bidding.start']}">
					<p:calendar value="#{bidSchedule.startDate}"
						showOn="button" id="bidStartDate"
						mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">

						<p:ajax event="dateSelect" process="bidStartDate"
							partialSubmit="true"
							listener="#{scheduleBiddingBB.bidStartDateSelectListener}"
							update="@([id$=bidEndDate])" />

					</p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bidding.end']}">

					<p:calendar value="#{bidSchedule.endDate}"
						mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
						showOn="button" id="bidEndDate"
						maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">

						<p:ajax event="dateSelect" process="bidEndDate"
							partialSubmit="true"
							listener="#{scheduleBiddingBB.bidEndDateSelectListener}"
							update="@([id$=bidDuration])" />

					</p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.duration.hours']}">
					<p:outputLabel id="bidDuration"
						value="#{scheduleBiddingBB.managedBean.duration}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.min.decrement.block']}">
					<h:outputText style="float : right"
						value="#{bidSchedule.scBidItems[0].decrementAmt }" disabled="true">
						<f:convertNumber for="decrementAmt"
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>

			<div align="left">

				<table style="align: left">

					<tr>

						<td><p:outputLabel value="#{lbl['lbl.sc.bidding.start']}" /></td>

						<td><p:calendar showOn="button" id="multiSelectStartDate"
								value="#{scheduleBiddingBB.managedBean.bidStart}"
								mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
								<p:ajax event="dateSelect" process="multiSelectStartDate"
									partialSubmit="true"
									listener="#{scheduleBiddingBB.bidStartDateSelectListener}"
									update="@([id$=multiSelectEndDate])" />

							</p:calendar></td>



						<td><p:outputLabel value="#{lbl['lbl.sc.bidding.end']}" /></td>

						<td><p:calendar showOn="button" id="multiSelectEndDate"
								mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
								maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
								value="#{scheduleBiddingBB.managedBean.bidEnd}"
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
								<p:ajax event="dateSelect" process="multiSelectEndDate"
									partialSubmit="true"
									listener="#{scheduleBiddingBB.bidEndDateSelectListener}" />

							</p:calendar></td>



						<TD><p:commandButton value="#{lbl['lbl.btn.apply']}"
								partialSubmit="true" style="float:center;" icon="ui-icon-submit"
								action="#{scheduleBiddingBB.applyBidDates}"
								process="schedulePanel" update="@([id$=bidSchedule])" /></TD>

					</tr>

				</table>

			</div>
		</p:panel>

	</ui:define>
</ui:composition>
