<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<div>

		<table>

			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.supplier.code']}" /></TD>
				<TD><p:inputText id="supplierCode"
						value="#{biddingBB.managedBean.supplierCode}" size="20"
						disabled="true" /></TD>
			</tr>

		</table>

	</div>

	<p:panel header="#{lbl['lbl.sc.item.price.list']}" toggleable="true">

		<div>

			<p:dataTable id="itemPriceList"
				value="#{biddingBB.managedBean.scBidPriceList}"
				var="itemPrice">

				<p:column headerText="#{lbl['lbl.sc.item.name']}">
					<h:outputText
						value="#{itemPrice.scBidSupplierItem.scBidItem.scRequestItem.itemName}" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.start.price']}">
					<p:outputLabel
						value="#{itemPrice.scBidSupplierItem.itemStartPrice}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.last.price']}">
					<p:outputLabel value="#{itemPrice.bidPrice}" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.cost.saving']}">
					<p:outputLabel
						value="#{itemPrice.scBidSupplierItem.itemStartPrice - itemPrice.bidPrice}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.ranking']}">
					<p:outputLabel value="#{itemPrice.ranking}" />
				</p:column>
			</p:dataTable>

		</div>
		<div align="right">

		<p:commandButton value="#{lbl['lbl.btn.close']}" icon="ui-icon-back" onclick="pricePop.hide();"/>
		
		</div>

	</p:panel>
</ui:composition>
