<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<div>
		<table>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.supplier.code']}" /></TD>
				<TD><p:inputText id="supplierCode"
						value="#{biddingBB.managedBean.supplierCode}" size="20"
						disabled="true" /></TD>
			</tr>
		</table>
	</div>

	<p:panel header="#{lbl['lbl.sc.item.price.list']}" toggleable="true">

		<div>

			<p:dataTable id="itemPriceList"
				value="#{biddingBB.managedBean.scBidPriceList}" var="itemPrice">
				<ac:paginator for="itemPriceList"></ac:paginator>
				<p:column headerText="#{lbl['lbl.sc.item.name']}">
					<h:outputText
						value="#{itemPrice.scBidSupplierItem.scBidItem.scRequestItem.itemName}" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.start.price']}">
					<h:outputText style="float : right"
						value="#{itemPrice.scBidSupplierItem.itemStartPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.last.price']}">
					<h:outputText style="float : right" value="#{itemPrice.bidPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.cost.saving']}">
					<h:outputText style="float : right"
						value="#{itemPrice.scBidSupplierItem.itemStartPrice - itemPrice.bidPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.ranking']}">
					<h:outputText style="float : right" value="#{itemPrice.ranking}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>

		</div>
		<div align="right">

			<p:commandButton value="#{lbl['lbl.btn.close']}" icon="ui-icon-back"
				onclick="pricePop.hide();" />

		</div>

	</p:panel>
</ui:composition>
