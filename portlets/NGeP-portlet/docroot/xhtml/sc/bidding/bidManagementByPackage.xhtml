<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.item.details']}"
		id="itemDetailsByPackage" toggleable="true">

		<p:dataTable id="scBidItemsList"
			value="#{biddingBB.managedBean.scheduledBid.scBidItems}" var="item">
			<ac:paginator for="scBidItemsList"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText value="#{item.scRequestItem.itemName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}">

				<h:outputText value="#{item.scRequestItem.itemDesc}" />
			</p:column>
			<p:column style="width : 60px" headerText="#{lbl['lbl.sc.uom']}">

				<h:outputText value="#{item.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column style="width : 65px" headerText="#{lbl['lbl.sc.quantity']}">
				<p:outputLabel style="textAllign : right" value="#{item.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 125px"
				headerText="#{lbl['lbl.sc.min.decrement.block']}">
				<p:outputLabel value="#{item.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:outputLabel>
			</p:column>

		</p:dataTable>

	</p:panel>

	<p:spacer height="10"></p:spacer>


	<p:panel header="#{lbl['lbl.sc.bid.summary']}" id="bidSummaryByPackage"
		toggleable="true">

		<p:spacer height="10"></p:spacer>

		<div align="center">

			<B> Bidding Statistic Graph</B>

		</div>
		<p:spacer height="10"></p:spacer>
		<div>
			<p:lineChart value="#{biddingBB.managedBean.bidPriceLinearModel}"
				legendPosition="e" style="height:300px;" />
		</div>
		<p:spacer height="10"></p:spacer>
		<p:dataTable id="bidPackagesListForBMBP"
			value="#{biddingBB.managedBean.bidPackages}" var="item">
			<ac:paginator for="bidPackagesListForBMBP"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<p:outputLabel value="#{item.ranking}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">

				<p:commandLink value="#{item.scBidSupplier.smSupplier.supplierId}"
					oncomplete="pricePop.show();"
					actionListener="#{biddingBB.supplierItemPricePopupAction(item)}"
					update="@([id$=itemPricePop])" />

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bumiputera.status']}">
				<h:outputText
					value="#{(item.scBidSupplier.smSupplier.bumi)? 'Yes' : 'No' }" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}">
				<p:outputLabel value="#{item.scBidSupplier.packageStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}">
				<p:outputLabel value="#{item.bidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">
				<p:outputLabel
					value="#{item.bidPrice - biddingBB.managedBean.lowestNonBumiOfferedPrice}"
					rendered="#{item.scBidSupplier.smSupplier.bumi and biddingBB.managedBean.lowestNonBumiOfferedPrice != 1}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}">

				<p:outputLabel
					rendered="#{item.scBidSupplier.smSupplier.bumi and biddingBB.managedBean.lowestNonBumiOfferedPrice !=1}"
					value="#{((item.bidPrice - biddingBB.managedBean.lowestNonBumiOfferedPrice)* 100)/biddingBB.managedBean.lowestNonBumiOfferedPrice }">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</p:outputLabel>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.pref.margin']}">
				<p:outputLabel value="10"
					rendered="#{item.scBidSupplier.smSupplier.bumi}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</p:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}">
				<p:outputLabel value="100">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel>
			<div style="align: left">
				<TABLE>
					<tr>
						<TD></TD>
						<TD></TD>
						<TD></TD>
						<TD>#{lbl['lbl.sc.bidding.bumiputera.price']}</TD>
						<p:spacer width="5%"></p:spacer>
						<TD><h:outputText value="-" /></TD>
						<p:spacer width="5%"></p:spacer>
						<TD>#{lbl['lbl.sc.bidding.lowest.non.bumiputera.price']}</TD>
						<TD></TD>
						<TD></TD>
					</tr>
					<tr>
						<TD>#{lbl['lbl.sc.note']}</TD>
						<p:spacer width="5%"></p:spacer>
						<TD>#{lbl['lbl.sc.difference.percentage']}</TD>
						<p:spacer width="5%"></p:spacer>
						<TD><h:outputText value="=" /></TD>
						<p:spacer width="2%"></p:spacer>
						<TD colspan="3"><h:outputText
								value="--------------------------------------------------------------------" /></TD>
						<p:spacer width="5%"></p:spacer>
						<TD><h:outputText value="X" /></TD>
						<p:spacer width="5%"></p:spacer>
						<TD><h:outputText value="100" /></TD>
					</tr>
					<tr>
						<TD></TD>
						<TD></TD>
						<TD></TD>

						<TD style="align: center" colspan="3">#{lbl['lbl.sc.bidding.lowest.non.bumiputera.price']}</TD>

						<TD></TD>
						<TD></TD>
					</tr>

				</TABLE>

			</div>

		</p:panel>
	<p:dialog closeOnEscape="true" header="#{lbl['lbl.sc.item.price']}"
		widgetVar="pricePop" showEffect="fade" hideEffect="fade" modal="true"
		id="itemPricePop">
		<ui:include src="/xhtml/sc/bidding/BMByZoneItemPricePopup.xhtml"></ui:include>
	</p:dialog>
</ui:composition>
