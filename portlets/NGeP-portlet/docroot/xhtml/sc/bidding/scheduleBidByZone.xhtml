<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
		
		<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true">

			<p:dataTable id="bidScheduleByZonal"
				value="#{scheduleBiddingBB.managedBean.bidScheduleList}"
				var="scheduleZoneBid">
				<ac:paginator for="bidScheduleByZonal"></ac:paginator>
				<p:ajax event="rowSelect" listener="#{scheduleBiddingBB.rowSelectListener}"
				update="@([id$=bidScheduleByZoneBidItems])" />

				<p:column headerText="#{lbl['lbl.sc.zone.name']}">
					<p:commandLink value="#{scheduleZoneBid.tplSpecZoneDtl.zoneName}"
						onclick="participants.show();"
						action="#{scheduleBiddingBB.getParticipantsListAction(scheduleZoneBid)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bidding.start']}">
					<p:calendar value="#{scheduleZoneBid.startDate}" showOn="button"  readonlyInput="true"
						id="zoneBidStartDate"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						mindate="#{scheduleBiddingBB.managedBean.minStartDate}">
						<p:ajax event="dateSelect" process="zoneBidStartDate"
							partialSubmit="true"
							listener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleZoneBid)}"
							update="@([id$=zoneBidEndDate])" />
					</p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bidding.end']}">

					<p:calendar value="#{scheduleZoneBid.endDate}" showOn="button"
						id="zoneBidEndDate"
						mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
						maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
						<p:ajax event="dateSelect" process="zoneBidEndDate"
							partialSubmit="true"
							listener="#{scheduleBiddingBB.bidEndDateSelectListener(scheduleZoneBid)}"
							update="@([id$=bidDuration])" />
					</p:calendar>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.duration.hours']}">
					<p:outputLabel id="bidDuration"
						value="#{scheduleZoneBid.duration}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">

			<p:dataTable id="bidScheduleByZoneBidItems"
				value="#{scheduleBiddingBB.managedBean.rowSelectedBid.scBidItems}"
				var="item">

				<ac:paginator for="bidScheduleByZoneBidItems"></ac:paginator>
				<p:column headerText="#{lbl['lbl.sc.item.name']}">
					<h:outputText value="#{item.scRequestItem.itemName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.item.description']}">
					<h:outputText value="#{item.scRequestItem.itemDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.uom']}">
					<h:outputText value="#{item.scRequestItem.uom.uomName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.quantity']}">
					<h:outputText style="float : right" value="#{item.scRequestItem.quantity}" >
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.scRequestItem.uom.uomCode)}" />
					
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.min.decrement.block']}">
					<h:outputText style="float : right" value="#{item.decrementAmt}" >
					<f:convertNumber for="decrementAmt"
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>
			
		

		</p:panel>
		
</ui:composition>
