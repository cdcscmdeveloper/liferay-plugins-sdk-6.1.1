<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<div>

		<table>

			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD><p:inputText id="bidPauseOrCancelRemainingTime"
						value="#{biddingBB.managedBean.bidAction.remainingTime}" size="20"
						disabled="true" /></TD>
				<TD><p:outputLabel value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD><p:inputTextarea id="bidPauseOrCancelsupplierNotes"
						value="#{biddingBB.managedBean.bidAction.remark}" size="200"
						maxlength="200" /></TD>
			</tr>

		</table>

	</div>
	<div>

		<p:commandButton value="#{lbl['lbl.btn.ok']}"
			action="#{biddingBB.pauseBidAction}" icon="ui-icon-ok"
			onclick="pauseOrCancelBid.close();" />

		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			action="#{biddingBB.cancelBidAction}" icon="ui-icon-cancel"
			onclick="pauseOrCancelBid.close();" />
	</div>

</ui:composition>
