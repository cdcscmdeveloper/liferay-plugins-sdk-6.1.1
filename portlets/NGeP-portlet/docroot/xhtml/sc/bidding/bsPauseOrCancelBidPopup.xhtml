<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<div>

		<table>

			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD><p:inputText id="bidPauseOrCancelRemainingTime"
						value="#{biddingBB.managedBean.duration}" size="20"
						disabled="true" /></TD>

			</tr>
			<tr>

				<TD><p:outputLabel value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD><p:inputTextarea id="bidPauseOrCancelsupplierNotes" required="true"
						value="#{biddingBB.managedBean.bidAction.remark}" cols="65" 
						maxLength="200" />
						</TD>
			</tr>

		</table>

	</div>

	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.ok']}" update="@form"
			actionListener="#{biddingBB.bidPauseOrCancelAction}"
			icon="ui-icon-submit" process="@this,bidPauseOrCancelsupplierNotes "
			partialSubmit="true" oncomplete="bidPauseOrCancel.hide();" />

		<p:commandButton value="#{lbl['lbl.btn.cancel']}" immediate="true"
			icon="ui-icon-cancel" onclick="bidPauseOrCancel.hide();" />

	</div>
</ui:composition>
