<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


<p:panel header="Bid Detail" toggleable="true">
	<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
						<div align="right">

							<p:commandButton id="submit" value="#{lbl['lbl.so.submit']}" ></p:commandButton>

						</div>
					</f:facet>
			</p:panelGrid>
	
	<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

				<h:outputText value="Title" />
				<p:inputText value="#{searchQtnTenderBB.managedBean.qtno}"
					size="100" />

			</p:panelGrid>
			
	<p:panelGrid columns="4" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				
				<h:outputText value="Bidding Start" />
	
			 <p:calendar value="#{searchQtnTenderBB.managedBean.tenderBean}" pattern="MM/dd/yyyy " id="biddingstart" />
				
				<h:outputText value="Bidding End" />
	
			 <p:calendar value="#{searchQtnTenderBB.managedBean.tenderBean}" pattern="MM/dd/yyyy" id="biddingend" />	
			</p:panelGrid>
			
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
			
			<h:outputText value="Min. Decrement Value" />
		
				<p:inputText id="Decrmentvalue" value="" readonly="true"/>  
				
				<h:outputText value="Bid No." />
		
				<p:inputText id="bidno" value="" readonly="true"/>  
				
				<h:outputText value="Award Type" />
		
				<p:inputText id="Awardtype" value="" readonly="true"/>  
				</p:panelGrid>
				
				<p:dataTable id="itemlist"  value="" style="width:100%;">
<p:column headerText="No" style="width:2%;" >
<h:outputText value="1"></h:outputText>

</p:column>	
<p:column headerText="Item1 Name" >
						<h:outputText value="Iphone"></h:outputText>
				</p:column>	
	<p:column headerText="Item1 Description" >
						<h:outputText value="Electronic"></h:outputText>
				</p:column>	
				
				<p:column headerText="Quantity" >
						<h:outputText value="1"></h:outputText>
				</p:column>	
				
				<p:column headerText="UOM" >
						<h:outputText value="number"></h:outputText>
				</p:column>	
				
				
				</p:dataTable>
			</p:panel>
			<p:panel header="Bid Price" toggleable="true">
			
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				
				<h:outputText value="Remaining Time" />
		
				<p:inputText id="remainingtime" value="HH:MM:SS" readonly="true"/> 
				
				<h:outputText value="Starting Price" />
		
				<p:inputText id="startingprice" value="" readonly="true"/> 
				
				<h:outputText value="Current Ranking" />
		
				<p:inputText id="currentranking" value="" readonly="true"/> 
				
				<h:outputText value="Last Bid (RM)" />
		
				<p:inputText id="lastbid" value="" readonly="true"/> 
				
				 <h:outputLabel for="spinnerBasic" value="Decrement Block" />  
            <p:spinner id="decrementBlock"   
                    value="#{biddingBB.managedBean.spinNumber1}"/>  
				
				<h:outputText value="New Last Bidding (RM)" />
		
				<p:inputText id="newlastbid" value="" /> 
				
				<h:outputText value="Total Difference (RM)" />
		
				<p:inputText id="totaldiff" value="" /> 
				</p:panelGrid>
				</p:panel>
				</ui:composition>
