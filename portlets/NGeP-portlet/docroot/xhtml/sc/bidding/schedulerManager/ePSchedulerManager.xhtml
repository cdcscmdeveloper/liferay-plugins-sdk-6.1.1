<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		
		<p:messages id="messages" showDetail="true" closable="true" showSummary="false" escape="false"/>
		
		<p:panel header="#{lbl['lbl.quartz.scheduled.jobs.list']}"
			toggleable="true" id="jobListPanelId">
			
			<h:outputText styleClass="instruction" value="#{lbl['lbl.quartz.instruction.one']}"/>&#160;
			<p:commandLink id="refreshId"
				partialSubmit="true" process="@this" action="#{schedulerManagerBB.initAllJobs}"
				update="@form" onstart="blockWidget.show()" oncomplete="blockWidget.hide()">
				<p:graphicImage value="/css/images/design/ico-refresh.png" title="#{lbl['lbl.quartz.refresh.job']}" />
			</p:commandLink>&#160;
			<h:outputText styleClass="instruction" value="#{lbl['lbl.quartz.instruction.two']}"/><br /><br />
			
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.quartz.filter.by.job.group']}" /></td>
					<td>
						<p:selectOneMenu style="width: 250px;margin-bottom: 5px;"
							id="jobGroupId" label="#{lbl['lbl.quartz.job.group']}"
							value="#{schedulerManagerBB.managedBean.jobGroup}">
							<f:selectItem itemLabel="#{lbl['lbl.quartz.select.job.all']}" itemValue="" />
							<f:selectItems value="#{schedulerManagerBB.managedBean.jobGroups}" />
							<p:ajax event="change" process="@this" 
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								listener="#{schedulerManagerBB.initAllJobs}"
								update="@form" />
						</p:selectOneMenu>
					</td>
				</tr>
			</table><br />
			
			<p:dataTable var="jobBean" id="jobBeanDt" widgetVar="jobBeanWidVar"
				value="#{schedulerManagerBB.managedBean.epSchedulerJobList}"
				rows="10" rowKey="#{jobBean}" rowIndexVar="index">

				<ac:paginator for="jobBeanDt" />
				
				<p:column style="width : 18% !important;"
					headerText="#{lbl['lbl.quartz.job.group']}">
					<h:outputText value="#{jobBean.jobKey.group}" style="white-space: normal;"/>
				</p:column>

				<p:column style="width : 18% !important;"
					headerText="#{lbl['lbl.quartz.job.name']}">
					<h:outputText value="#{jobBean.jobKey.name}" style="white-space: normal;"/>
				</p:column>

				<p:column style="width : 35% !important;"
					headerText="#{lbl['lbl.quartz.job.description']}">
					<h:outputText value="#{jobBean.description}" style="white-space: normal;"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.quartz.status']}">
					<h:outputText value="#{jobBean.status}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.quartz.health.state']}">
					<h:outputText value="#{lbl['lbl.quartz.health.state.none']}" rendered="#{empty jobBean.state}"/>
					<p:graphicImage value="/css/images/design/ico-submit.png" rendered="#{jobBean.state ne 'ERROR' and jobBean.state ne 'BLOCKED'}"
						title="#{lbl['lbl.quartz.state.normal.tooltips']}" />
					<p:graphicImage value="/css/images/design/icon_alert.png" rendered="#{jobBean.state eq 'BLOCKED'}"
						title="#{lbl['lbl.quartz.state.blocked.tooltips']}" />
					<p:graphicImage value="/css/images/design/icon_error.png" rendered="#{jobBean.state eq 'ERROR'}"
						title="#{lbl['lbl.quartz.state.error.tooltips']}" />
				</p:column>
				
				<ui:remove>
					<p:column headerText="Missfire Policy">
						<h:outputText value="#{jobBean.trigger.misfireInstruction}" />
					</p:column>
				</ui:remove>
				
				<p:column headerText="#{lbl['lbl.quartz.last.fired.time']}" style="width : 10% !important;">
					<h:outputText value="#{jobBean.trigger.previousFireTime}" rendered="#{not empty jobBean.trigger}"
						style="white-space: normal;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
					</h:outputText>
					<h:outputText value="#{lbl['lbl.txt.na']}" rendered="#{empty jobBean.trigger}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.quartz.next.fired.time']}" style="width : 10% !important;">
					<h:outputText value="#{jobBean.trigger.nextFireTime}" style="white-space: normal;"
						rendered="#{not empty jobBean.trigger and not empty jobBean.trigger.nextFireTime}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
					</h:outputText>
					<h:outputText value="#{lbl['lbl.txt.na']}" rendered="#{empty jobBean.trigger}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.quartz.action']}" style="white-space : normal;width : 10% !important;">
					<p:outputPanel rendered="#{not empty jobBean.trigger}">
						<p:outputPanel rendered="#{jobBean.action eq 'RESUME'}">
							<p:commandLink id="resumeActionId" partialSubmit="true"
								process="@this"
								action="#{schedulerManagerBB.pauseOrResumeJob(jobBean)}"
								update="@form" onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()">
								<p:graphicImage value="/css/images/design/ico-play.png" title="#{lbl['lbl.quartz.resume.job']}" />
							</p:commandLink>
						</p:outputPanel>
						<p:outputPanel rendered="#{jobBean.action eq 'PAUSE'}">
							<p:commandLink id="pauseActionId" partialSubmit="true"
								process="@this" 
								action="#{schedulerManagerBB.pauseOrResumeJob(jobBean)}"
								update="@form" onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()">
								<p:graphicImage value="/css/images/design/ico-suspend.png" title="#{lbl['lbl.quartz.pause.job']}" />
							</p:commandLink>
						</p:outputPanel>
						<p:outputPanel rendered="#{jobBean.status eq 'WAIT'}">
							&#160;
							<p:commandLink id="runNowActionId"
								partialSubmit="true"
								process="@this" action="#{schedulerManagerBB.runNowJob(jobBean)}"
								update="@form" onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()">
								<p:graphicImage value="/css/images/design/ico-action.png" title="#{lbl['lbl.quartz.execute.job']}" />
							</p:commandLink>
						</p:outputPanel>
						&#160;
						<p:commandLink id="updateActionId"
							partialSubmit="true"
							process="@this" action="#{schedulerManagerBB.onUpdateJob(jobBean)}"
							update=":#{p:component('addJobDialog')}" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
							<p:graphicImage value="/css/images/design/action.png" title="#{lbl['lbl.quartz.update.job']}" />
						</p:commandLink>
						&#160;
						<p:commandLink id="deleteActionId"
							partialSubmit="true"
							process="@this" action="#{schedulerManagerBB.onDeleteJob(jobBean)}"
							update="jobBeanDt,@([id$=Msg])" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()">
							<p:graphicImage value="/css/images/design/ico-termination.png" title="#{lbl['lbl.quartz.delete.job']}" />
						</p:commandLink>
						<ui:remove>
							<p:outputPanel rendered="#{jobBean.state eq 'BLOCKED'}">
								&#160;
								<p:commandLink id="recoveryActionId"
									partialSubmit="true"
									process="@this" action="#{schedulerManagerBB.recoverJob(jobBean)}"
									update="@form" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()">
									<p:graphicImage value="/css/images/design/ico-termination-history.png" title="#{lbl['lbl.quartz.recovery.block.job']}" />
								</p:commandLink>
							</p:outputPanel>
							<p:outputPanel rendered="#{jobBean.state eq 'COMPLETE'}">
								&#160;
								<p:commandLink id="rescheduleActionId"
									partialSubmit="true"
									process="@this" action="#{schedulerManagerBB.rescheduledJob(jobBean)}"
									update="@form" onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()">
									<p:graphicImage value="/css/images/design/ico-termination-history.png" title="#{lbl['lbl.quartz.reschedule.job']}" />
								</p:commandLink>
							</p:outputPanel>
						</ui:remove>
					</p:outputPanel>
					<p:outputPanel rendered="#{empty jobBean.trigger}">
						<h:outputText value="#{lbl['lbl.quartz.action.not.available']}" />
					</p:outputPanel>
				</p:column>

			</p:dataTable>
		</p:panel>
		
		<br />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sm.button.add']}"
				process="@this" partialSubmit="true" onstart="blockWidget.show()"
				oncomplete="blockWidget.hide()" 
				action="#{schedulerManagerBB.onAddJob()}"
				update="@form" />
		</div>
		<br />
					
		<p:panel id="biddingListPanel" header="#{lbl['lbl.sc.bidding.list']}"
			toggleable="true">

			<p:dataTable id="biddingList"
				value="#{schedulerManagerBB.managedBean.currentDayBids}" var="bid">

				<p:column headerText="#{lbl['lbl.sc.bidding.no']}">
					<h:outputText value="#{bid.bidNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.bid.start']}">
					<h:outputText id="bidStart" value="#{bid.startDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bid.end']}">

					<h:outputText id="bidEnd" value="#{bid.endDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.status']}">

					<p:outputLabel style="float : left"
						value="#{schedulerManagerBB.getStatusDescById(bid.pmStatus.statusId)}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		
		<p:dialog width="800px" height="300px"
			header="#{lbl['lbl.quartz.job.name']}" widgetVar="addJobDialog"
			resizable="false" showEffect="fade" closable="false" hideEffect="fade"
			modal="true" id="addJobDialog">
			
			<p:outputPanel id="addJobOutPanelId" layout="block">
				<p:messages id="addJobDialogMsg" showSummary="false"
					showDetail="true" autoUpdate="true" closable="true" />
		
				<table style="width: 100%">
					<tr>
						<td style="border-style: none !important;float: right !important;">
							<p:selectBooleanCheckbox value="#{schedulerManagerBB.managedBean.othersJobGroup}">
								<p:ajax event="change" partialSubmit="true" process="@this" 
									onstart="addJobOutPanelWidget.show();" oncomplete="addJobOutPanelWidget.hide()"
									update="addJobOutPanelId" />
							</p:selectBooleanCheckbox>
						</td>
						<td valign="top" style="border-style: none !important;">
							<p:outputLabel styleClass="outputLabel-view" value="#{lbl['lbl.quartz.tick.entered.new.job']}" />
						</td>
					</tr>
					<p:outputPanel rendered="#{!schedulerManagerBB.managedBean.othersJobGroup}">
						<tr>
							<td>
								<p:outputLabel value="#{lbl['lbl.quartz.job.group']}" /> 
								<p:outputLabel value="*" styleClass="mandatory"/>
							</td>
							<td><p:selectOneMenu
									required="true"
									label="#{lbl['lbl.quartz.job.group']}" id="jobKeyGroupId"
									value="#{schedulerManagerBB.managedBean.selectedJobVO.jobGroup}"
									style="width: 250px;margin-bottom: 5px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems value="#{schedulerManagerBB.managedBean.jobGroups}" />
									<p:ajax event="change" process="@this" update="@this" />
								</p:selectOneMenu>
								<p:message id="jobKeyGroupIdMsg" for="jobKeyGroupId"
									showSummary="true" showDetail="false" display="icon" /></td>
						</tr>
					</p:outputPanel>
					<p:outputPanel rendered="#{schedulerManagerBB.managedBean.othersJobGroup}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.quartz.job.group']}" />
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td><p:inputText maxlength="50"
									required="true"
									label="#{lbl['lbl.quartz.job.group']}" id="jobKeyGroup"
									value="#{schedulerManagerBB.managedBean.selectedJobVO.jobGroup}"
									size="35" >
									<p:ajax process="@this" update="@this,jobKeyGroupMsg" partialSubmit="true" event="blur" />
								</p:inputText> 
								<p:message id="jobKeyGroupMsg"
									for="jobKeyGroup" showSummary="true" showDetail="false"
									display="icon" />
							</td>
						</tr>
					</p:outputPanel>
					
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.quartz.job.name']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText maxlength="50"
								required="true"
								label="#{lbl['lbl.quartz.job.name']}" id="jobNameId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.jobName}"
								size="35">
								<p:ajax process="@this" update="@this,jobNameIdMsg" partialSubmit="true" event="blur" />
							</p:inputText> 
							<p:message id="jobNameIdMsg" for="jobNameId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.quartz.jobclass']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputText maxlength="50"
								required="true"
								label="#{lbl['lbl.quartz.jobclass']}" id="jobClassNameId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.jobClassName}"
								size="35">
								<p:ajax process="@this" update="@this,jobNameIdMsg" partialSubmit="true" event="blur" />
							</p:inputText> 
							<p:message id="jobClassNameIdMsg" for="jobClassNameId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.quartz.job.description']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:inputTextarea maxlength="200"
								required="true"
								label="#{lbl['lbl.quartz.job.description']}" id="jobDescId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.description}"
								validatorMessage="#{lbl['lbl.quartz.job.description']} - #{lbl['lbl.sm.banktnc.length.validMsg']}"
								cols="25">
								<p:ajax process="@this" partialSubmit="true" event="blur"/>
								<f:validateLength maximum="200" />
							</p:inputTextarea>
							<p:message id="jobDescIdMsg" for="jobDescId"
								showSummary="true" showDetail="false" display="icon" /></td>
					</tr>
					
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.quartz.cronexpression']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td>
							<h:outputText value="#{lbl['lbl.quartz.sec']}"/>
							<p:inputText maxlength="4"
								required="true"
								label="#{lbl['lbl.quartz.cronexpression']} - #{lbl['lbl.quartz.sec']}" id="secId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.cronSec}"
								size="4">
								<p:ajax process="@this" partialSubmit="true" event="blur" />
							</p:inputText>&#160;
							<h:outputText value="#{lbl['lbl.quartz.min']}" />
							<p:inputText maxlength="4"
								required="true"
								label="#{lbl['lbl.quartz.cronexpression']} - #{lbl['lbl.quartz.min']}" id="minId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.cronMin}"
								size="4">
								<p:ajax process="@this" partialSubmit="true" event="blur" />
							</p:inputText>&#160;
							<h:outputText value="#{lbl['lbl.quartz.hour']}" />
							<p:inputText maxlength="4"
								required="true"
								label="#{lbl['lbl.quartz.cronexpression']} - #{lbl['lbl.quartz.hour']}" id="hourId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.cronHr}"
								size="4">
								<p:ajax process="@this" partialSubmit="true" event="blur" />
							</p:inputText>&#160;
							<h:outputText value="#{lbl['lbl.quartz.day']}" />
							<p:inputText maxlength="4"
								required="true"
								label="#{lbl['lbl.quartz.cronexpression']} - #{lbl['lbl.quartz.day']}" id="dayId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.cronDay}"
								size="4">
								<p:ajax process="@this" partialSubmit="true" event="blur" />
							</p:inputText>&#160;
							<h:outputText value="#{lbl['lbl.quartz.month']}" />
							<p:inputText maxlength="4"
								required="true"
								label="#{lbl['lbl.quartz.cronexpression']} - #{lbl['lbl.quartz.month']}" id="monthId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.cronMonth}"
								size="4">
								<p:ajax process="@this" partialSubmit="true" event="blur" />
							</p:inputText>&#160;
							<h:outputText value="#{lbl['lbl.quartz.year']}" />
							<p:inputText maxlength="4"
								required="true"
								label="#{lbl['lbl.quartz.cronexpression']} - #{lbl['lbl.quartz.year']}" id="yearId"
								value="#{schedulerManagerBB.managedBean.selectedJobVO.cronYear}"
								size="4">
								<p:ajax process="@this" partialSubmit="true" event="blur" />
							</p:inputText>&#160;
						</td>
					</tr>
		
				</table>
			</p:outputPanel>
			
			<br />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sm.button.save']}"
					action="#{schedulerManagerBB.addOrUpdateJob}"
					partialSubmit="true" process="addJobDialog"
					onclick="addJobOutPanelWidget.show();" oncomplete="addJobOutPanelWidget.hide();"
					update=":form:jobBeanDt,@([id$=Msg]),:#{p:component('jobGroupId')}" />
				<p:commandButton value="#{lbl['lbl.sm.button.cancel']}" 
					partialSubmit="true" process="@this" update="addJobOutPanelId"
					oncomplete="addJobDialog.hide();" />
			</div>
			
			<p:blockUI block="addJobOutPanelId" widgetVar="addJobOutPanelWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			
		</p:dialog>
		
		<p:confirmDialog id="confirmDeleteDialog" closable="true"
			message="#{lbl['lbl.quartz.delete.confirm.msg']}"
			header="#{lbl['lbl.quartz.delete.confirm.header']}" severity="alert"
			widgetVar="confirmDeleteDialog">
			
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="confirmDeleteDialog.hide();" 
					action="#{schedulerManagerBB.deleteJob}" update="jobBeanDt,@([id$=Msg])" partialSubmit="true"
					onstart="blockWidget.show()" oncomplete="blockWidget.hide()" process="@this"/>
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="confirmDeleteDialog.hide();" />
			</div>
		</p:confirmDialog>
		
	</ui:define>

</ui:composition>
