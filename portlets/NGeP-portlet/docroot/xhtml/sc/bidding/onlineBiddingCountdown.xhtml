<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:messages id="onlineBidding" showDetail="true" autoUpdate="true"
		closable="true" />

	<div>
		<p:outputLabel value="#{lbl['lbl.sc.bidding.ob.cd.bidNo']}" />

		<p:selectOneMenu>

		</p:selectOneMenu>
	</div>

	<p:panel header="#{lbl['lbl.sc.bidding.ob.cd.bd']}" toggleable="true">



		<table style="width: 100%; align: LEFT">

			<tr>

				<td style="width: 100px"><p:outputLabel
						value="#{lbl['lbl.sc.bidding.ob.cd.bd.bidNo']}" /></td>
				<td><p:inputText id="bidNo"
						value="#{onlineBiddingBB.managedBean.bidNo}" disabled="true"
						size="20" /></td>
				<TD></TD>
				<TD></TD>

			</tr>

			<tr>

				<td style="width: 100px"><p:outputLabel
						value="#{lbl['lbl.sc.bidding.ob.cd.bd.docNo']}" /></td>
				<td><p:inputText id="documentNo"
						value="#{onlineBiddingBB.managedBean.documentNo}" disabled="true"
						size="20" /></td>
				<TD></TD>
				<TD></TD>

			</tr>

			<tr>

				<td><p:outputLabel
						value="#{lbl['lbl.sc.bidding.ob.cd.bd.docTitle']}" /></td>
				<td clospan="3"><p:inputText id="documentTitle"
						value="#{onlineBiddingBB.managedBean.documentTitle}"
						disabled="true" size="60" /></td>


			</tr>

			<tr>

				<td><p:outputLabel
						value="#{lbl['lbl.sc.bidding.ob.cd.bd.ptjName']}" /></td>
				<td clospan="3"><p:inputText id="ptjName"
						value="#{onlineBiddingBB.managedBean.ptjName}" disabled="true"
						size="60" /></td>

			</tr>

			<tr>

				<td><p:outputLabel
						value="#{lbl['lbl.sc.bidding.ob.cd.bd.bidStart']}" /></td>
				<td><p:inputText id="bidStart"
						value="#{onlineBiddingBB.managedBean.bidStart}" disabled="true"
						size="20" /></td>
				<TD><p:outputLabel
						value="#{lbl['lbl.sc.bidding.ob.cd.bd.bidEnd']}" /></TD>
				<TD><p:inputText id="bidEnd"
						value="#{onlineBiddingBB.managedBean.bidEnd}" disabled="true"
						size="20" /></TD>

			</tr>

		</table>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.bidding.ob.cd.bp']}" toggleable="true">

		<!-- count down timer here -->
		<div>

			<table>

				<tr>
					<TD></TD>
					<TD></TD>
					<TD></TD>
					<TD></TD>
				</tr>
				<tr>
					<TD></TD>
					<TD></TD>
					<TD></TD>
				</tr>

			</table>

		</div>


		<p:dataTable id="bidItemWisePriceList"
			value="#{onlineBiddingBB.managedBean.bidItemWisePriceList}"
			var="bidItem">

			<f:facet name="header">

				<p:row>
					<p:column rowspan="2">
						<h:outputText
							value="#{lbl['lbl.sc.bidding.ob.cd.bp.dt.itemName']}" />
					</p:column>
					<p:column rowspan="2">
						<h:outputText value="#{lbl['lbl.sc.bidding.ob.cd.bp.dt.qty']}" />
					</p:column>
					<p:column rowspan="2">
						<h:outputText
							value="#{lbl['lbl.sc.bidding.ob.cd.bp.dt.minDecrement']}" />
					</p:column>
					<p:column colspan="2">
						<h:outputText
							value="#{lbl['lbl.sc.bidding.ob.cd.bp.dt.starting']}" />
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<h:outputText
							value="#{lbl['lbl.sc.bidding.ob.cd.bp.dt.unitPrice']}" />
					</p:column>
					<p:column>
						<h:outputText
							value="#{lbl['lbl.sc.bidding.ob.cd.bp.dt.subTotal']}" />
					</p:column>

				</p:row>
			</f:facet>
			<p:row>
				<p:column>
					<h:outputText value="#{bidItem.itemName}" />

				</p:column>
				<p:column>
					<h:outputText value="#{bidItem.qty}" />
				</p:column>
				<p:column>
					<h:outputText value="#{bidItem.minDecrement}" />

				</p:column>
				<p:column>
					<p:outputLabel value="#{bidItem.unitPrice}" />
				</p:column>
				<p:column>
					<h:outputText value="#{bidItem.subTotal}" />
				</p:column>
			</p:row>
		</p:dataTable>

	</p:panel>

</ui:composition>
