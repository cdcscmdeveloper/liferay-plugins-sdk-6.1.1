<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:selectOneMenu>
	
	
	</p:selectOneMenu>

	<p:panel header="BIDDING DETAILS" toggleable="true">


		<table style="width: 500px; align: LEFT">

			<tr>

				<td><h:outputText value="Bidding No." /></td>
				<td><p:inputText id="biddingNo" value="#{}" /></td>
				<TD></TD>
				<TD></TD>

			</tr>

			<tr>

				<td><h:outputText value="Document No." /></td>
				<td><p:inputText id="documentNo" value="#{}" /></td>
				<TD></TD>
				<TD></TD>

			</tr>

			<tr>

				<td><h:outputText value="Document Title" /></td>
				<td clospan="3"><p:inputText id="documentTitle" value="#{}" /></td>
				

			</tr>

			<tr>

				<td><h:outputText value="PTJ Name" /></td>
				<td clospan="3"><p:inputText id="ptjName" value="#{}" /></td>

			</tr>
			
			<tr>

				<td><h:outputText value="Bidding Start" /></td>
				<td><p:inputText id="bidStart" value="#{}" /></td>
				<TD><h:outputText value="Bidding End" /></TD>
				<TD><p:inputText id="bidEnd" value="#{}" /></TD>

			</tr>

		</table>

	</p:panel>

	<p:panel header="BID PRICE" toggleable="true">
	
	<!-- count down timer here -->

		<p:dataTable id="bidEstimate"
			value="#{}" var="item">

			<p:column>
			<f:facet name="header">
					<h:outputText value="Item Name" />
				</f:facet>
				<h:outputText value="#{item.itemName}" />
			</p:column>
			
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Quantity" />
				</f:facet>
				<h:inputText value="#{item.quantity}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Min. Decement Block" />
				</f:facet>
				<h:outputText value="#{item.minDecrement}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="Unit Price (RM)" />
				</f:facet>
				<h:outputText value="#{item.unitPrice}" />
				<f:facet name="header">
					<h:outputText value="Total" />
				</f:facet>
			</p:column>
			
			<p:column>
				<f:facet name="header">
					<h:outputText value="Sub Total" />
				</f:facet>
				<h:outputText value="#{item.minDecrement}" />
				<f:facet name="header">
					<h:outputText value="" />
				</f:facet>
			</p:column>

		</p:dataTable>

	</p:panel>

</ui:composition>
