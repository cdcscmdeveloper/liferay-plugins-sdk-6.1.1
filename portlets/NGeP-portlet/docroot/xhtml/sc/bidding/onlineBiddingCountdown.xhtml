<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

   <p:panel header="#{lbl['lbl.sc.bid.price']}" toggleable="true">

	<div style="width: 100%">
	
		<p:dataTable id="bidItemWisePriceList"
			value="#{onlineBiddingBB.managedBean.bidPrices}" var="bidPriceItem">

			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="#{lbl['lbl.sc.item.name']}"  style="width: 53%" />
					<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}" style="width: 7%"/>
					<p:column rowspan="2"
						headerText="#{lbl['lbl.sc.min.decrement.block']}" style="width: 10%"/>
					<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}" style="width: 30%;text-align:center"/>
				</p:row>
				<p:row>
					<p:column headerText="#{lbl['lbl.sc.unit.price']}"  style="width: 15%;text-align:center"/>
					<p:column headerText="#{lbl['lbl.sc.sub.total']}" style="width: 15%;text-align:center"/>

				</p:row>
			</p:columnGroup>
				<p:column>
					<p:commandLink
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
						action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
						oncomplete="onlineBiddingItemDetails.show" />
				</p:column>
				<p:column>
					<p:outputLabel
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
					</p:outputLabel>
				</p:column>
				<p:column>
					<p:outputLabel
						value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}" >
						<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:outputLabel>
				</p:column>
				<p:column>
					<p:outputLabel
						value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}" >
						<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:outputLabel>
				</p:column>
				<p:column>
					<p:outputLabel
						value="#{bidPriceItem.scBidSupplierItem.itemStartPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}" >
						<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</p:outputLabel>
				</p:column>
			
			<p:columnGroup type="footer">

				<p:row>
					<p:column colspan="4" footerText="Total" style="text-align:right" />
					<p:column id="itemStartPriceTotal" style="text-align:right" footerText="#{onlineBiddingBB.managedBean.itemStartPriceTotal}">
					
					</p:column>
				</p:row>

			</p:columnGroup>
		</p:dataTable>
	</div>
	</p:panel>

</ui:composition>
