<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div>

		<p:dataTable id="participantList"
			value="#{scheduleBiddingBB.managedBean.bidParticipants}"
			var="bidParticipant">
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<h:outputText value="#{bidParticipant.supplier.companyName}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.offered.price']}">
				<p:outputLabel  value="#{bidParticipant.scQtProposalAmount.proposalAmt}"/>
			</p:column>
		</p:dataTable>

	</div>
	<br />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.close']}" icon="ui-icon-back"
			onclick="participants.hide();" />
	</div>
</ui:composition>
