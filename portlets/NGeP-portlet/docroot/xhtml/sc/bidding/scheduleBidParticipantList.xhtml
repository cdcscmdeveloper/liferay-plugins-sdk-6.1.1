<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div>
	
		<p:dataTable id="participantList"
			value="#{scheduleBiddingBB.managedBean.bidParticipantList}"
			var="bidParticipant">
		
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.pl.dt.supplierName']}">
				<p:outputLabel value="#{bidParticipant.supplierName}" />
				 				
			</p:column>
			<p:column
				headerText="#{lbl['lbl.sc.bidding.schedulebid.pl.dt.offerPrice']}">
				<p:outputLabel value="#{bidParticipant.offeredPrice}" />
			</p:column>
		</p:dataTable>
		
	</div>
		
		<p:commandButton value="#{lbl['lbl.sc.bidding.schedulebid.pl.close']}"
			 icon="ui-icon-close" />
		
</ui:composition>
