<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.bid.price']}" toggleable="true">

		<p:dataTable id="itemWiseBidList"
			value="#{onlineBiddingBB.managedBean.bidPrices}" var="bidPriceItem">

			<p:columnGroup type="header">

				<p:row>
					<p:column rowspan="2" headerText="#{lbl['lbl.sc.item.name']}"
						style="width : 22%" />

					<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
						style="width : 7%" />

					<p:column rowspan="2"
						headerText="#{lbl['lbl.sc.min.decrement.block']}"
						style="width : 4%" />

					<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
						style="width : 19%;text-align:center" />

					<p:column colspan="2" headerText="#{lbl['lbl.sc.last.bid']}"
						style=" width : 19%; text-align:center" />

					<p:column colspan="3" headerText="#{lbl['lbl.sc.new.bid']}"
						style="width : 18% ; text-align:center" />

					<p:column rowspan="2" headerText="#{lbl['lbl.sc.current.ranking']}"
						style="width : 4%" />


				</p:row>
				<p:row>
					<p:column headerText="#{lbl['lbl.sc.unit.price']}"
						style="width : 9%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}"
						style="width : 10%" />

					<p:column headerText="#{lbl['lbl.sc.unit.price']}"
						style="width : 9%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}"
						style="width : 10%" />

					<p:column headerText="#{lbl['lbl.sc.decrement']}"
						style="width : 7%" />

					<p:column headerText="#{lbl['lbl.sc.unit.price']}"
						style="width : 8%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}"
						style="width : 10%" />

				</p:row>
			</p:columnGroup>
			<p:column style="width : 22%">
				<p:commandLink
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
					action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
					oncomplete="onlineBiddingItemDetails.show()" />
			</p:column>
			<p:column style="width : 7%">
				<p:outputLabel
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 4%">
				<p:outputLabel
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 9%">
				<p:outputLabel
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 10%">
				<p:outputLabel
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 9%">
				<p:outputLabel value="#{bidPriceItem.bidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 10%">
				<p:outputLabel
					value="#{bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 7%">
				<p:spinner widgetVar="decrementSpinner" 
					value="#{onlineBiddingBB.managedBean.selectedDecrementAmt}"
					min="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}"
					max="#{bidPriceItem.bidPrice /10}"
					stepFactor="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{onlineBiddingBB.decrementAmountValueChangeListener}"></p:ajax>
				</p:spinner>
				<p:spacer width="5" ></p:spacer>
				<h:button rendered="#{onlineBiddingBB.managedBean.rendered}" icon="ui-icon-submit"/>
			</p:column>
			<p:column style="width : 8%">
				<p:outputLabel id="newPrice"
					value="#{onlineBiddingBB.managedBean.newBidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 10%">
				<p:outputLabel id="newPriceSubTotal"
					value="#{onlineBiddingBB.managedBean.newBidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:outputLabel>
			</p:column>
			<p:column style="width : 4%">
				<p:outputLabel id="newRanking" value="#{bidPriceItem.ranking}" />
			</p:column>

			<p:columnGroup type="footer">

				<p:row>
					<p:column colspan="4" footerText="Total" style="text-align:right" />
					<p:column>
					<p:outputLabel id="itemStartPriceTotal"
						value="#{onlineBiddingBB.managedBean.itemStartPriceTotal}">
					</p:outputLabel>
					</p:column>
					<p:column footerText="Total" style="text-align:right" />
					<p:column>
					<p:outputLabel id="itemLastBidPriceTotal"
						value="#{onlineBiddingBB.managedBean.itemLastBidPriceTotal}">
					</p:outputLabel>
					</p:column>
					<p:column colspan="2" footerText="Total" style="text-align:right" />
					<p:column>
					<p:outputLabel id="itemNewBidPriceTotal" value="#{onlineBiddingBB.managedBean.itemLastBidPriceTotal}">
					</p:outputLabel>
					</p:column>
				</p:row>

			</p:columnGroup>

		</p:dataTable>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
		toggleable="true">

		<p:dataTable id="contactPersonDT"
			value="#{onlineBiddingBB.managedBean.bidContactPersons}"
			var="contact">

			<p:column headerText="#{lbl['lbl.sc.name']}" style="width : 70%">
				<h:outputText value="#{contact.contactName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.tel.no']}" style="width : 30%">
				<p:outputLabel value="#{contact.phoneNo}" />
			</p:column>

		</p:dataTable>

	</p:panel>

</ui:composition>
