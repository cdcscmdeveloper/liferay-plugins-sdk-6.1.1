<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.bid.price']}" toggleable="true">
		<p:spacer height="5"></p:spacer>
		<script src="#{resource['countdown.js']}"></script>
		<!-- This is the one worked -->
		<div style="align: left">
			<table style="width: 50%;">
				<tr>
					<td style="width: 15%;">
							<p:outputLabel value="#{lbl['lbl.sc.remaining.time']}" />
						</td>
					<td style="width: 85%;align:left"><script type="application/javascript">
			var myCountdown = new Countdown({time:"#{onlineBiddingBB.managedBean.remainingBidTime}",hideLine: true,rangeHi: "hour",rangeLo: "second",width: 250,height: 70}); 
					</script></td>
				</tr>
			</table>
		</div>
		<p:spacer height="5"></p:spacer>
		<p:dataTable id="itemWiseBidList"
			style="word-wrap: break-word ; table-layout: fixed"
			value="#{onlineBiddingBB.managedBean.bidPrices}" var="bidPriceItem">

			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" headerText="#{lbl['lbl.sc.item.name']}"
						width="22%" />

					<p:column rowspan="2" headerText="#{lbl['lbl.sc.quantity']}"
						width="7%" />

					<p:column rowspan="2"
						headerText="#{lbl['lbl.sc.min.decrement.block']}" width="4%" />

					<p:column colspan="2" headerText="#{lbl['lbl.sc.starting']}"
						width="19%" style="text-align:center" />

					<p:column colspan="2" headerText="#{lbl['lbl.sc.last.bid']}"
						width="19%" style=" text-align:center" />

					<p:column colspan="3" headerText="#{lbl['lbl.sc.new.bid']}"
						width="19%" style=" text-align:center" />

					<p:column rowspan="2" headerText="#{lbl['lbl.sc.current.ranking']}"
						width="4%" />
				</p:row>
				<p:row>
					<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

					<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="9%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />

					<p:column headerText="#{lbl['lbl.sc.decrement']}" width="7%" />

					<p:column headerText="#{lbl['lbl.sc.unit.price']}" width="8%" />

					<p:column headerText="#{lbl['lbl.sc.sub.total']}" width="10%" />
				</p:row>
			</p:columnGroup>
			<p:column>
				<p:commandLink
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.scRequestItem.itemName}"
					action="#{onlineBiddingBB.itemDetialsPopupAction(bidPriceItem)}"
					oncomplete="onlineBiddingItemDetails.show()" />
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, question.clUom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.scBidSupplierItem.itemStartPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right" value="#{bidPriceItem.bidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText style="float : right"
					value="#{bidPriceItem.bidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<p:spinner widgetVar="decrementSpinner"  size="10"
					value="#{onlineBiddingBB.managedBean.selectedDecrementAmt}"
					min="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}"
					max="#{bidPriceItem.bidPrice /10}"
					stepFactor="#{bidPriceItem.scBidSupplierItem.scBidItem.decrementAmt}">
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{onlineBiddingBB.decrementAmountValueChangeListener(bidPriceItem)}"></p:ajax>
				</p:spinner>
				<p:spacer width="5"></p:spacer>
				<p:commandLink action="#{onlineBiddingBB.submitBidPrice()}">
					<p:graphicImage library="ep/images/design" name="submit.png"
						value="/resources/ep/images/design/submit.png" />
				</p:commandLink>

			</p:column>
			<p:column>
				<h:outputText id="newPrice" style="float : right"
					value="#{onlineBiddingBB.managedBean.newBidPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<h:outputText id="newPriceSubTotal" style="float : right"
					value="#{onlineBiddingBB.managedBean.newBidPrice * bidPriceItem.scBidSupplierItem.scBidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column>
				<p:outputLabel id="newRanking" value="#{bidPriceItem.ranking}" />
			</p:column>

			<p:columnGroup type="footer">
				<p:row>
					<p:column colspan="4" footerText="Total" style="text-align:right" />
					<p:column
						footerText="#{onlineBiddingBB.managedBean.itemStartPriceTotal}" />
					<p:column footerText="Total" style="text-align:right" />
					<p:column
						footerText="#{onlineBiddingBB.managedBean.itemLastBidPriceTotal}" />
					<p:column colspan="2" footerText="Total" style="text-align:right" />
					<p:column
						footerText="#{onlineBiddingBB.managedBean.itemLastBidPriceTotal}" />
					<p:column />
				</p:row>
			</p:columnGroup>
		</p:dataTable>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
		toggleable="true">

		<p:dataTable id="contactPersonDT"
			value="#{onlineBiddingBB.managedBean.bidContactPersons}"
			var="contact">

			<p:column headerText="#{lbl['lbl.sc.name']}" style="width : 70%">
				<h:outputText value="#{contact.contactName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.tel.no']}" style="width : 30%">
				<p:outputLabel value="#{contact.phoneNo}" />
			</p:column>
		</p:dataTable>

	</p:panel>
	<p:panel id="spinnerTestPanel">
	<table>
	<tr><p:spinner widgetVar="decrementSpinner1" size="5"
					value="#{onlineBiddingBB.managedBean.testDecrementAmt1}"
					min="#{onlineBiddingBB.managedBean.testminAmt1}"
					max="#{onlineBiddingBB.managedBean.testmaxAmt1}"
					stepFactor="#{onlineBiddingBB.managedBean.testDecrementAmt1}" ></p:spinner></tr>
					<tr><p:spinner widgetVar="decrementSpinner2" size="10"
					value="#{onlineBiddingBB.managedBean.testDecrementAmt2}"
					min="#{onlineBiddingBB.managedBean.testminAmt1}"
					max="#{onlineBiddingBB.managedBean.testmaxAmt1}"
					stepFactor="#{onlineBiddingBB.managedBean.testDecrementAmt2}"></p:spinner></tr>
					<tr><p:spinner widgetVar="decrementSpinner3" size="15"
					value="#{onlineBiddingBB.managedBean.testDecrementAmt3}"
					min="#{onlineBiddingBB.managedBean.testminAmt1}"
					max="#{onlineBiddingBB.managedBean.testmaxAmt1}"
					stepFactor="#{onlineBiddingBB.managedBean.testDecrementAmt3}"></p:spinner></tr>
	</table>
	</p:panel>

</ui:composition>
