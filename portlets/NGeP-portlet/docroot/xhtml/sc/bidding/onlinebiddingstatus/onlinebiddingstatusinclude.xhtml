<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style>
      .dashboarTable {
             color: #000 !important;
             font-family: Arial,Helvetica,sans-serif;
              font-size: 12px;
              border-color: #ddd;
              border-width:1px;
              padding-left: 5px;
              border-style:solid;
      }
      
     .tableWidth80{
          width:80%;
     }
     
      .tableWidth20{
          width:20%;
          text-align: center;
     }
    
    
    </style>

	<table style="width: 100%">
		<ui:repeat var="status"
			value="#{onlineBiddingStatusBB.managedBean.statusDescList}">
			<tr>
				<ui:fragment
					rendered="#{status.pmStatus.statusId eq onlineBiddingStatusBB.bidInProgress}">
					<td
						class="tableWidth80 dashboarTable"><p:outputLabel
							value="#{onlineBiddingStatusBB.getStatusDescById(status.pmStatus.statusId)}" style="float:left;text-align:left;"></p:outputLabel></td>
					<td
						class=" tableWidth20 dashboarTable"><h:outputText
							value="#{onlineBiddingStatusBB.searchAllStatusBiddingCount(onlineBiddingStatusBB.bidInProgress)}"></h:outputText></td>
				</ui:fragment>
			</tr>
			<tr>
				<ui:fragment
					rendered="#{status.pmStatus.statusId eq onlineBiddingStatusBB.bidPending}">
					<td
						class="tableWidth80 dashboarTable"><p:outputLabel
							value="#{onlineBiddingStatusBB.getStatusDescById(status.pmStatus.statusId)}" style="float:left;text-align:left;"></p:outputLabel></td>
					<td
						class=" tableWidth20 dashboarTable"><h:outputText
							value="#{onlineBiddingStatusBB.searchAllStatusBiddingCount(onlineBiddingStatusBB.bidPending)}"></h:outputText></td>
				</ui:fragment>
			</tr>
			<tr>
				<ui:fragment
					rendered="#{status.pmStatus.statusId eq onlineBiddingStatusBB.bidPause}">
					<td
						class="tableWidth80 dashboarTable"><p:outputLabel
							value="#{onlineBiddingStatusBB.getStatusDescById(status.pmStatus.statusId)}" style="float:left;text-align:left;"></p:outputLabel></td>
					<td
						class=" tableWidth20 dashboarTable"><h:outputText
							value="#{onlineBiddingStatusBB.searchAllStatusBiddingCount(onlineBiddingStatusBB.bidPause)}"></h:outputText></td>
				</ui:fragment>
			</tr>
			<tr>
				<ui:fragment
					rendered="#{status.pmStatus.statusId eq onlineBiddingStatusBB.bidReschedule}">
					<td
						class="tableWidth80 dashboarTable"><p:outputLabel
							value="#{onlineBiddingStatusBB.getStatusDescById(status.pmStatus.statusId)}" style="float:left;text-align:left;"></p:outputLabel></td>
					<td
						class=" tableWidth20 dashboarTable"><h:outputText
							value="#{onlineBiddingStatusBB.searchAllStatusBiddingCount(onlineBiddingStatusBB.bidReschedule)}"></h:outputText></td>
				</ui:fragment>
			</tr>
		</ui:repeat>
		<tr>
		<td colspan="3"
					style="text-align: right; padding-right: 6%;" class="dashboarTable">
					<p:commandLink value="#{lbl['lbl.sc.more.details']}"
						styleClass="blue_font" process="@this" update="@form"
						action="#{onlineBiddingStatusBB.navigatetoScheduleBidding()}">
					</p:commandLink>
				</td>
		</tr>
	</table>
</ui:composition>
