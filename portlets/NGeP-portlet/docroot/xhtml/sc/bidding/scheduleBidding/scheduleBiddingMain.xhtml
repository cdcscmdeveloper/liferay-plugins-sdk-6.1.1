<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="ScheduleBiddingMainnMessage" showDetail="true"
			showSummary="false" autoUpdate="true" closable="true"
			severity="error, info" />

		<ui:param name="isRecommendByPackage"
			value="#{!scheduleBiddingBB.managedBean.scQt.zonal and scheduleBiddingBB.managedBean.scQtFinalization.recommendedTypeId.parameterCode eq 'P'  }" />
		<ui:param name="isRecommendByItem"
			value="#{!scheduleBiddingBB.managedBean.scQt.zonal and scheduleBiddingBB.managedBean.scQtFinalization.recommendedTypeId.parameterCode eq 'I' }" />
		<ui:param name="isQtZonalAndRecommendTypeAny"
			value="#{scheduleBiddingBB.managedBean.scQt.zonal}" />
		<ui:param name="qtValidityDaysExpired"
			value="#{scheduleBiddingBB.checkProposalValidityDateReach(scheduleBiddingBB.managedBean.scQt.proposalValidityEndDate)}" />

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<div align="right" style="width: 100%">
			<ui:repeat var="bpmAction"
				value="#{scheduleBiddingBB.managedBean.outComes}">
				<ui:param name="buttonLabel"
					value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
				<p:commandButton id="submitBtn" value="#{lbl[buttonLabel]}"
					update="@form" styleClass="ui-button"
					rendered="#{qtValidityDaysExpired}" onstart="blockWidget.show()"
					oncomplete="blockWidget.hide()"
					action="#{scheduleBiddingBB.submitBiddingDetails(bpmAction)}" />
			</ui:repeat>
		</div>

		<div align="left" class="header-info" style="width: 100%">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel id="docNoMain"
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td class="header-info-text">
						#{scheduleBiddingBB.managedBean.scQt.qtNo}</td>

					<td><p:outputLabel id="ptjNameMain"
							value="#{lbl['lbl.sc.ptj']}" /></td>

					<td class="header-info-text">
						#{scheduleBiddingBB.managedBean.scQt.pmOrgProfile.orgName}</td>

					<td><p:outputLabel id="statusMain"
							value="#{lbl['lbl.sc.status']}" /></td>

					<td class="header-info-text">#{scheduleBiddingBB.getStatusDescById(scheduleBiddingBB.managedBean.currentStatusId)}
					</td>
				</tr>

			</table>

		</div>

		<c:if test="#{isRecommendByPackage}">
			<ui:include src="scheduleBiddingByPackage.xhtml"></ui:include>
		</c:if>
		<c:if test="#{isRecommendByItem}">
			<ui:include src="scheduleBidByItem.xhtml"></ui:include>
		</c:if>
		<c:if test="#{isQtZonalAndRecommendTypeAny}">
			<ui:include src="scheduleBidByZone.xhtml"></ui:include>
		</c:if>

		<p:panel id="qualifiedSupplierPanel" toggleable="true"
			header="#{lbl['lbl.sc.participant.list']}">

			<p:dataTable id="participantList" rows="10"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{scheduleBiddingBB.managedBean.bidParticipants}"
				var="bidParticipant">
				<ac:paginator for="participantList"></ac:paginator>
				<p:column headerText="#{lbl['lbl.sc.supplier.name']}"
					style="width : 65%">
					<h:outputText id="companyNamePopUp"
						value="#{bidParticipant.supplier.companyName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.offered.price']}"
					style="width : 35%">
					<h:outputText id="offerPricePopUp"
						value="#{bidParticipant.scQtProposalItem.offerPrice}"
						style="text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel id="contactDetailsPanelMain" toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.contact.person.details']}" />
				<ac:iconTooltip
					value="#{lbl['lbl.sc.contact.person.details.schedule.bidding.tooltip']}" />
			</f:facet>

			<p:dataTable var="contact" id="contactPersonDetails" Var="contact"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{scheduleBiddingBB.managedBean.scBidContactPersonList}"
				rowIndexVar="index" rows="10" rowKey="#{contact.bidContactPersonId}">
				<ac:paginator for="contactPersonDetails" />
				<p:column style="width:2% ;">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="multiSelectContactCB"
							value="#{scheduleBiddingBB.managedBean.selectedAllBidContacts}">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=contactPersonDetails])"
								listener="#{scheduleBiddingBB.selectAllBidContacts}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox id="selectCOntactCB"
						value="#{scheduleBiddingBB.managedBean.selectedBidContact}">
						<p:ajax partialSubmit="true" process="@this" update="@this"
							listener="#{scheduleBiddingBB.selectBidContact(index)}" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.name']}" style="width:68%">
					<p:inputText id="contactName" value="#{contact.contactName}"
						label="#{lbl['lbl.sc.name']}" required="true" size="40">
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@([id$=contactNameMsg])" />
					</p:inputText>
					<p:message id="contactNameMsg" for="contactName" showDetail="false"
						display="icon" />

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tel.no']}" style="width:30%">
					<p:inputText required="true" id="phoneNo"
						label="#{lbl['lbl.sc.tel.no']}" value="#{contact.phoneNo}"
						size="40">
						<f:validateLength minimum="7" maximum="16" />
						<f:validateLongRange minimum="1" maximum="9999999999999999" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@([id$=contactPhoneNoMsg])" />
					</p:inputText>
					<p:message id="contactPhoneNoMsg" showDetail="false" for="phoneNo"
						display="icon" />
				</p:column>

			</p:dataTable>

			<p:spacer height="10"></p:spacer>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.add']}" id="addContact"
					process="@this,contactPersonDetails" partialSubmit="true"
					action="#{scheduleBiddingBB.addContactAction}" immediate="true"
					update="@([id$=contactPersonDetails])" />

				<p:commandButton id="deleteContact" value="#{lbl['lbl.btn.delete']}"
					immediate="true" process="@this,contactPersonDetails"
					partialSubmit="true" oncomplete="contactPersonDelete.show();"
					update="@([id$=contactPersonDeleteId])" />

				<ui:param name="contactPersonDeleteId" value="contactPersonDeleteId"></ui:param>

				<ac:confirmationPopup id="#{contactPersonDeleteId}"
					widget="contactPersonDelete" width="400" height="200"
					okAction="scheduleBiddingBB.deleteContactDetails"
					title="#{lbl['lbl.sc.contact.person.details']}"
					content="#{lbl['lbl.sc.dialog.confirm.message']}"
					update="@([id$=contactPersonDetails])" />
			</div>
		</p:panel>
	</ui:define>
</ui:composition>
