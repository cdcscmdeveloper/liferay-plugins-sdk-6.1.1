<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="scheduleBidByZonePanel" toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.bidding.schedule']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.bidding.zone.name.supplier.tooltip']}" />
		</f:facet>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.bidding.schedule.by.zone.instruction']}"
			escape="false" />

		<p:dataTable id="bidScheduleByZonal" rows="10" selectionMode="single"
			value="#{scheduleBiddingBB.managedBean.bidScheduleList}"
			selection="#{scheduleBiddingBB.managedBean.rowSelectedBid}"
			var="scheduleZoneBid" rowIndexVar="index" rowKey="#{scheduleZoneBid}">
			<p:ajax event="rowSelect" process="@this" immediate="true" partialSubmit="true"
				update="@([id$=zoneBidItemsPanel])" />
			<ac:paginator for="bidScheduleByZonal"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.zone.name']}">
				<h:outputText id="zoneNameByZone"
					value="#{scheduleZoneBid.tplSpecZoneDtl.zoneName}" />
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.bidding.start']}" />
				</f:facet>
				<p:calendar value="#{scheduleZoneBid.startDate}" showOn="button"
					label="#{lbl['lbl.sc.bidding.start']}" readonlyInput="true"
					id="zoneBidStartDate" 
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
					mindate="#{scheduleBiddingBB.managedBean.minStartDate}">
					<p:ajax event="dateSelect" process="zoneBidStartDate"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleZoneBid)}"
						update="@([id$=zoneBidEndDate])" />
					<p:ajax event="change" process="zoneBidStartDate"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleZoneBid)}"
						update="@([id$=zoneBidEndDate])" />
				</p:calendar>
				<p:message id="startDateByZoneMsg" for="zoneBidStartDate"
					showDetail="false" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.bidding.end']}" />
				</f:facet>
				<p:calendar value="#{scheduleZoneBid.endDate}" showOn="button"
					 id="zoneBidEndDate" readonlyInput="true" 
					label="#{lbl['lbl.sc.bidding.end']}"
					mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
					maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
					<p:ajax event="dateSelect" process="zoneBidEndDate"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.bidEndDateSelectListener(scheduleZoneBid)}"
						update="@([id$=bidDurationByZone])" />
					<p:ajax event="change" process="zoneBidEndDate"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.bidEndDateSelectListener(scheduleZoneBid)}"
						update="@([id$=bidDurationByZone])" />
				</p:calendar>
				<p:message id="endDateByZoneMsg" for="zoneBidEndDate"
					showDetail="false" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.duration.hours']}">
				<p:outputLabel id="bidDurationByZone"
					value="#{scheduleZoneBid.duration}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel id="zoneBidItemsPanel" toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.item.list']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.bidding.zone.name.supplier.tooltip']}" />
		</f:facet>
		<p:dataTable id="bidScheduleByZoneBidItems" rows="10"
			selectionMode="single" 
			selection="#{scheduleBiddingBB.managedBean.selectedBidItem}"
			value="#{scheduleBiddingBB.managedBean.rowSelectedBid.scBidItems}"
			var="item" rowKey="#{item}" rowIndexVar="index">
			<p:ajax event="rowSelect" process="@this" immediate="true" partialSubmit="true"
				listener="#{scheduleBiddingBB.retrieveParticipantsListAction}"
				update="@([id$=participantList])" />

			<ac:paginator for="bidScheduleByZoneBidItems"></ac:paginator>

			<p:column style="width : 30%; white-space : normal;"
				headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText id="itemNameByZone"
					value="#{item.scRequestItem.itemName}" />
			</p:column>
			<p:column style="width : 35%; white-space : normal;"
				headerText="#{lbl['lbl.sc.item.description']}">
				<h:outputText id="itemDescByZone"
					value="#{item.scRequestItem.itemDesc}" />
			</p:column>
			<p:column style="width : 10%;" headerText="#{lbl['lbl.sc.uom']}">
				<h:outputText id="uomNameByZone"
					value="#{item.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column style="width : 10%;" headerText="#{lbl['lbl.sc.quantity']}">
				<h:outputText id="quantityByZone" style="float : right"
					value="#{item.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.scRequestItem.uom.uomCode)}" />

				</h:outputText>
			</p:column>
			<p:column style="width : 15%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.min.decrement.block.tooltip']}" />
				</f:facet>
				<p:inputText style="text-align : right" id="decrementAmtByZone" immediate="true"
					maxlength="19" value="#{item.decrementAmt}">
					<p:ajax event="change" process="@this" partialSubmit="true" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
				</p:inputText>
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
