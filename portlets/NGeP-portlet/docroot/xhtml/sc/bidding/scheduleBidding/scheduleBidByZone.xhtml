<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="scheduleBidByZonePanel" toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.bidding.schedule']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.bidding.zone.name.supplier.tooltip']}" />
		</f:facet>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.bidding.schedule.by.zone.instruction']}"
			escape="false" />

		<p:dataTable id="bidScheduleByZonal" rows="10" selectionMode="single"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
			value="#{scheduleBiddingBB.managedBean.bidScheduleList}" 
			selection="#{scheduleBiddingBB.managedBean.rowSelectedBid}"
			var="scheduleZoneBid" rowIndexVar="index" rowKey="#{scheduleZoneBid}">
			<p:ajax event="rowSelect" process="@this" partialSubmit="true" 
				listener="#{scheduleBiddingBB.zonalRowBidSelectListener}"
				 update="@([id$=zoneBidItemsPanel])" />
			<ac:paginator for="bidScheduleByZonal"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.zone.name']}">
				<h:outputText id="zoneNameByZone"
					value="#{scheduleZoneBid.tplSpecZoneDtl.zoneName}" />
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.bidding.start']}" />
				</f:facet>
				<ac:dateTime id="zoneBidStartDate"
					mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
					postUpdateListener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleZoneBid)}"
					 label="#{lbl['lbl.sc.bidding.start']}" 
					value="#{scheduleZoneBid.startDate}" rowIndex="#{index}"
					update="@([id$=bidScheduleByZonal])">
				</ac:dateTime>
				<p:message id="startDateByZoneMsg" showDetail="false"
					for="zoneBidStartDate" display="icon" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.bidding.end']}" />
				</f:facet>
				<p:inputText id="zoneBidEndDate" readonly="true"
					value="#{scheduleZoneBid.endDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.duration.hours']}" />
				</f:facet>
				<p:selectOneMenu id="bidDurationByZone"   
					value="#{scheduleZoneBid.duration}">  
					<f:selectItems value="#{scheduleBiddingBB.managedBean.selectItems}"
						var="selectItem" itemLabel="#{selectItem.label}"
						itemValue="#{selectItem.value}" />
					<p:ajax event="change" process="@this" partialSubmit="true"
						update="@([id$=bidScheduleByZonal])"
						listener="#{scheduleBiddingBB.durationSelectListener(scheduleZoneBid)}" />
				</p:selectOneMenu>
				<p:message id="bidDurationByZoneMsg" showDetail="false"
					for="bidDurationByZone" display="icon" />
			</p:column>
		</p:dataTable>

		<h:panelGrid id="zoneBidItemsPanel" style="width : 100%">
			<br />
			<ui:fragment
				rendered="#{scheduleBiddingBB.managedBean.rowSelectedBid ne null and scheduleBiddingBB.managedBean.rowSelectedBid.tplSpecZoneDtl ne null}">
					#{scheduleBiddingBB.managedBean.rowSelectedBid.tplSpecZoneDtl.zoneName} > #{lbl['lbl.sc.item.list']}
				</ui:fragment>
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}"
				escape="false" />
			<p:dataTable id="bidScheduleByZoneBidItems" rows="10"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selectionMode="single"
				selection="#{scheduleBiddingBB.managedBean.selectedBidItem}"
				value="#{scheduleBiddingBB.managedBean.rowSelectedBid.scBidItems}"
				var="item" rowKey="#{item}" rowIndexVar="index">
				<p:ajax event="rowSelect" process="@this" immediate="true"
					partialSubmit="true" 
					listener="#{scheduleBiddingBB.bidItemSelectionListner}"
					update="@([id$=qualifiedSupplierPanel])" />

				<ac:paginator for="bidScheduleByZoneBidItems"></ac:paginator>

				<p:column style="width : 30%; white-space : normal;"
					headerText="#{lbl['lbl.sc.item.name']}">
					<h:outputText id="itemNameByZone"
						value="#{item.scRequestItem.itemName}" />
				</p:column>
				<p:column style="width : 35%; white-space : normal;"
					headerText="#{lbl['lbl.sc.item.description']}">
					<h:outputText id="itemDescByZone"
						value="#{item.scRequestItem.itemDesc}" />
				</p:column>
				<p:column style="width : 10%;" headerText="#{lbl['lbl.sc.uom']}">
					<h:outputText id="uomNameByZone"
						value="#{item.scRequestItem.uom.uomName}" />
				</p:column>
				<p:column style="width : 10%;"
					headerText="#{lbl['lbl.sc.quantity']}">
					<h:outputText id="quantityByZone" style="float : right"
						value="#{item.qty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.scRequestItem.uom.uomCode)}" />

					</h:outputText>
				</p:column>
				<p:column style="width : 15%;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
						<ac:iconTooltip
							value="#{lbl['lbl.sc.min.decrement.block.tooltip']}" />
					</f:facet>
					<p:inputText style="text-align : right" id="decrementAmtByZone"
						immediate="true" maxlength="19" value="#{item.decrementAmt}">
						<p:ajax event="change" process="@this" partialSubmit="true" />
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							maxIntegerDigits="14" />
					</p:inputText>
				</p:column>
			</p:dataTable>
			<ui:include src="scheduleBidParticipantList.xhtml"></ui:include>
		</h:panelGrid>
	</p:panel>
</ui:composition>
