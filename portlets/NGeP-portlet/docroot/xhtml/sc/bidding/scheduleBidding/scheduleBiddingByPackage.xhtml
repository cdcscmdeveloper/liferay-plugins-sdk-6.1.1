<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
		rendered="#{scheduleBiddingBB.managedBean.scQtFinalization.recommendedTypeId.parameterCode eq 'P'}"
		id="scheduleBidPackageNonZonePanel">
		<div align="left">
			<table style="align: left;">
				<tr>
					<td><h:outputText value="* " styleClass="mandatory" /> <p:outputLabel
							id="startDateByPackage" value="#{lbl['lbl.sc.bidding.start']}" /></td>

					<td>
						<!-- 30451,17376 -start- -->
						<ac:dateTime id="scheduleBidPackageStartDate"
							mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
							postUpdateListener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleBiddingBB.managedBean.bidScheduleList[0])}"
							required="true" label="#{lbl['lbl.sc.bidding.start']}"
							value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].startDate}"
							update="@([id$=scheduleBidPackageEndDate],[id$=byPackageStartDateMsg])"
							disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
						<!-- 30451,17376 -end- -->
						</ac:dateTime> <p:message id="byPackageStartDateMsg" showDetail="false"
							for="scheduleBidPackageStartDate" display="icon" /></td>
					<td><p:spacer width="10"></p:spacer></td>
					<td><p:outputLabel id="endDateByPackage"
							value="#{lbl['lbl.sc.bidding.end']}" /></td>
					<td>
						<!-- 30451,17376 -start- -->
						<p:inputText id="scheduleBidPackageEndDate"
							readonly="true"
							value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].endDate}"
							disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
							<!-- 30451,17376 -end- -->
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText></td>
					<td><p:spacer width="5"></p:spacer></td>
					<td><h:outputText value="*" styleClass="mandatory" /> <p:outputLabel
							id="durationByPackage" value="#{lbl['lbl.sc.duration.hours']}" /></td>

					<td>
						<!-- 30451,17376 -start- -->
						<p:selectOneMenu id="bidSchedulePackageDuration"
							required="true"
							value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].duration}"
							disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
							<!-- 30451,17376 -end- -->
							<f:selectItems
								value="#{scheduleBiddingBB.managedBean.selectItems}"
								var="selectItem" itemLabel="#{selectItem.label}"
								itemValue="#{selectItem.value}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="scheduleBidPackageEndDate,byPackageDurationMsg"
								listener="#{scheduleBiddingBB.durationSelectListener(scheduleBiddingBB.managedBean.bidScheduleList[0])}" />
						</p:selectOneMenu> <p:message id="byPackageDurationMsg" showDetail="false"
							for="bidSchedulePackageDuration" display="icon" /></td>
				</tr>
			</table>
		</div>

		<p:dataTable id="bidScheduleByPackage" var="bidItem" rows="10"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selectionMode="single" rowKey="#{bidItem}" rowIndexVar="index"
			selection="#{scheduleBiddingBB.managedBean.selectedBidItem}"
			value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].scBidItems}">
			<p:ajax event="rowSelect"
				listener="#{scheduleBiddingBB.retrieveParticipantsListAction}"
				update="@([id$=qualifiedSupplierPanel])" />
			<ac:paginator for="bidScheduleByPackage"></ac:paginator>

			<p:column style="white-space : normal; width : 25%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.item.name']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.item.name.tooltip']}" />
				</f:facet>
				<p:commandLink id="itemNameByPackage"
					value="#{bidItem.scRequestItem.itemName}" process="@this"
					partialSubmit="true"
					action="#{scheduleBiddingBB.itemDetailsPopupAction(bidItem.scRequestItem,bidItem.qty)}"
					update=":form:scheduleBiddingItemDetails"
					oncomplete="scheduleBiddingItemDetails.show()" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}"
				style="white-space : pre-line; width : 30%;">
				<p:inputTextarea id="descriptionByPackage" 
					disabled="true" autoResize="false" 
					style="white-space : pre-line;width : 100%; height : 100%;" readonly="true"
					value="#{bidItem.scRequestItem.itemDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.uom']}" style="width : 15%;">
				<h:outputText id="uomNameByPackage"
					value="#{bidItem.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.quantity']}" style="width : 15%;">
				<h:outputText id="quantityByPackage" style="float : right"
					value="#{bidItem.qty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidItem.scRequestItem.uom.uomCode)}" />

				</h:outputText>

			</p:column>

			<p:column style="white-space : normal; width :15%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.min.decrement.block.tooltip']}" />
				</f:facet>
				<!-- 30451,17376 -start- -->
				<p:inputText id="decrementAmtByPackage" style="text-align : right"
					maxlength="19" value="#{bidItem.decrementAmt }"
					disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
					<!-- 30451,17376 -end- -->
					<p:ajax event="change" process="@this" partialSubmit="true" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
				</p:inputText>
			</p:column>
		</p:dataTable>
		<ui:include src="scheduleBidParticipantList.xhtml"></ui:include>
	</p:panel>

</ui:composition>
