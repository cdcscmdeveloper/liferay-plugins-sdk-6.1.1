<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
		rendered="#{scheduleBiddingBB.managedBean.scQtFinalization.recommendedTypeId.parameterCode eq 'P'}"
		id="scheduleBidPackageNonZonePanel">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.bidding.schedule.instruction']}" escape="false" />
		<div align="left">
			<table style="align: left">
				<tr>
					<td><h:outputText value="* " styleClass="mandatory" /> <p:outputLabel
							id="startDateByPackage" value="#{lbl['lbl.sc.bidding.start']}" /></td>

					<td><p:calendar showOn="button" readonlyInput="true"
							required="true" id="scheduleBidPackageStartDate"
							label="#{lbl['lbl.sc.bidding.start']}"
							value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].startDate}"
							mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
							<p:ajax event="dateSelect" process="scheduleBidPackageStartDate"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleBiddingBB.managedBean.bidScheduleList[0])}"
								update="scheduleBidPackageEndDate" />
							<p:ajax event="change" process="scheduleBidPackageStartDate"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.bidStartDateSelectListener(scheduleBiddingBB.managedBean.bidScheduleList[0])}"
								update="scheduleBidPackageEndDate,byPackageStartDateMsg" />
						</p:calendar> <p:message id="byPackageStartDateMsg" showDetail="false"
							for="scheduleBidPackageStartDate" display="icon" /></td>
					<TD><p:spacer width="10"></p:spacer></TD>

					<td><h:outputText value="* " styleClass="mandatory" /> <p:outputLabel
							id="endDateByPackage" value="#{lbl['lbl.sc.bidding.end']}" /></td>

					<td><p:calendar showOn="button" id="scheduleBidPackageEndDate"
							readonlyInput="true" required="true"  maxMinute="0"
							label="#{lbl['lbl.sc.bidding.end']}"
							mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
							maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
							value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].endDate}"
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
							<p:ajax event="dateSelect" process="scheduleBidPackageEndDate"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.bidEndDateSelectListener(scheduleBiddingBB.managedBean.bidScheduleList[0])}"
								update="bidSchedulePackageDuration" />
							<p:ajax event="change" process="scheduleBidPackageEndDate"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.bidEndDateSelectListener(scheduleBiddingBB.managedBean.bidScheduleList[0])}"
								update="bidSchedulePackageDuration,byPackageEndDateMsg" />
						</p:calendar> <p:message id="byPackageEndDateMsg" showDetail="false"
							for="scheduleBidPackageEndDate" display="icon" /></td>
					<TD><p:spacer width="10"></p:spacer></TD>
					<td><p:outputLabel id="durationByPackage"
							value="#{lbl['lbl.sc.duration.hours']}" /></td>

					<TD><p:inputText id="bidSchedulePackageDuration"
							disabled="true"
							value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].duration}" /></TD>
				</tr>
			</table>
		</div>

		<p:dataTable id="bidScheduleByPackage" var="bidItem" rows="10"
			selectionMode="single" rowKey="#{bidItem}" rowIndexVar="index"  
			selection="#{scheduleBiddingBB.managedBean.selectedBidItem}"
			value="#{scheduleBiddingBB.managedBean.bidScheduleList[0].scBidItems}">
			<p:ajax event="rowSelect" 
				listener="#{scheduleBiddingBB.retrieveParticipantsListAction}" 
				  update="@([id$=participantList])" />
			<ac:paginator for="bidScheduleByPackage"></ac:paginator>

			<p:column style="white-space : normal; width : 25%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.item.name']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.item.name.tooltip']}" />
				</f:facet>
				<h:outputText id="itemNameByPackage"
					value="#{bidItem.scRequestItem.itemName}" />

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}"
				style="white-space : normal; width : 30%;">
				<h:outputText id="descriptionByPackage"
					value="#{bidItem.scRequestItem.itemDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.uom']}" style="width : 15%;">
				<h:outputText id="uomNameByPackage"
					value="#{bidItem.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.quantity']}" style="width : 15%;">
				<h:outputText id="quantityByPackage" style="float : right"
					value="#{bidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidItem.scRequestItem.uom.uomCode)}" />

				</h:outputText>

			</p:column>

			<p:column style="white-space : normal; width :15%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.min.decrement.block.tooltip']}" />
				</f:facet>
				<p:inputText id="decrementAmtByPackage" style="text-align : right"
					maxlength="19"  value="#{bidItem.decrementAmt }">
					<p:ajax event="change" process="@this" partialSubmit="true" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
				</p:inputText>
			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
