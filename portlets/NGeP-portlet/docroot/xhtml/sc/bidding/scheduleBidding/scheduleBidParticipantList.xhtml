<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<h:panelGrid id="qualifiedSupplierPanel" style="width : 100%">
		<br />
		<ui:fragment
			rendered="#{scheduleBiddingBB.managedBean.selectedBidItem ne null}">
					#{scheduleBiddingBB.managedBean.selectedBidItem.scRequestItem.itemName} > #{lbl['lbl.sc.participant.list']}
				</ui:fragment>
		<p:dataTable id="participantList" rows="10"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{scheduleBiddingBB.managedBean.bidParticipants}"
			var="bidParticipant">
			<ac:paginator for="participantList"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}"
				style="width : 35%">
				<h:outputText id="companyNameId" style="white-space : normal;"
					value="#{bidParticipant.supplier.companyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.unit.price']}"
				style="width : 30%">
				<h:outputText id="unitPriceId"
					value="#{bidParticipant.scQtProposalItem.offerPrice}"
					style="text-align:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.sub.total']}"
				style="width : 35%">
				<h:outputText id="offerPricePopUp"
					value="#{scheduleBiddingBB.itemUnitPriceSubTotal(bidParticipant)}"
					style="text-align:right;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</h:panelGrid>
</ui:composition>
