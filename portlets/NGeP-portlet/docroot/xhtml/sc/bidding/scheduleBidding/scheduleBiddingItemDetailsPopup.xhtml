<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table>
		<tr>
			<TD><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></TD>
			<TD><p:inputText
					value="#{scheduleBiddingBB.managedBean.requestItem.itemName}"
					size="35" disabled="true" /></TD>
		</tr>
		<tr>
			<TD><p:outputLabel value="#{lbl['lbl.sc.item.description']}" /></TD>
			<TD><p:inputTextarea cols="80" rows="6" disabled="true" autoResize="false" scrollHeight="5" style="white-space : pre-line;"
					value="#{scheduleBiddingBB.managedBean.requestItem.itemDesc}"
					 /></TD>
		</tr>
		<tr>
			<p:spacer height="5"></p:spacer>
			<TD><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></TD>
			<TD><p:inputText
					value="#{scheduleBiddingBB.managedBean.requestItem.uom.uomName}"
					size="20" disabled="true" /></TD>
		</tr>
		<h:panelGroup
			rendered="#{scheduleBiddingBB.managedBean.requestItem.itemType.parameterCode eq scheduleBiddingBB.managedBean.itemTypeService}">
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" /></TD>
				<TD><p:inputText style="text-align : right;"
						value="#{scheduleBiddingBB.managedBean.requestItem.tplSpecQuestion.clUomFrequency}"
						size="20" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</p:inputText></TD>
			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" /></TD>
				<TD><p:inputText style="text-align : right;" disabled="true"
						value="#{scheduleBiddingBB.managedBean.requestItem.tplSpecQuestion.clUomPerDay}"
						size="20" readonly="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></TD>
			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" /></TD>
				<TD><p:inputText style="text-align : right;"
						value="#{scheduleBiddingBB.managedBean.requestItem.tplSpecQuestion.clUomPerMonth}"
						size="20" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></TD>
			</tr>
		</h:panelGroup>
		<tr>
			<TD><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></TD>
			<TD><p:inputText style="text-align : right;"
					value="#{scheduleBiddingBB.managedBean.awardedQuantity}"
					size="20" disabled="true">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText></TD>
		</tr>
	</table>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.close']}" style="float : right" process="@this" partialSubmit="true"
			styleClass="BtnSpacing" onclick="scheduleBiddingItemDetails.hide();" />
	</div>
</ui:composition>
