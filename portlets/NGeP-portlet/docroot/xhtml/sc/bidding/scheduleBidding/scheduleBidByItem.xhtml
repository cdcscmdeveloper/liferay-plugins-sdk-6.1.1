<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
		id="scheduleByItemPanel">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.bidding.schedule.instruction']}" escape="false" />

		<p:dataTable id="bidScheduleByItem" var="bidItem" rowKey="#{bidItem}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selectionMode="single" rows="10" rowIndexVar="index"
			selection="#{scheduleBiddingBB.managedBean.selectedBidItem}"
			value="#{scheduleBiddingBB.managedBean.bidItemList}">
			<p:ajax event="rowSelect"
				listener="#{scheduleBiddingBB.retrieveParticipantsListAction}"
				process="@this" partialSubmit="true"
				update="@([id$=qualifiedSupplierPanel])" />
			<ac:paginator for="bidScheduleByItem"></ac:paginator>

			<p:column style="width:2% ;">
				<f:facet name="header">
					<!-- 30451,17376 -start- -->
					<p:selectBooleanCheckbox id="selectAllItemsByItem"
						value="#{scheduleBiddingBB.managedBean.selectedAll}"
						disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
						<!-- 30451,17376 -end- -->
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=scheduleByItemPanel])"
							listener="#{scheduleBiddingBB.selectAll(scheduleBiddingBB.managedBean.selectedAll,scheduleBiddingBB.managedBean.bidItemList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<!-- 30451,17376 -start- -->
				<p:selectBooleanCheckbox id="selectItemByItem"
					value="#{bidItem.selected}"
					disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
					<!-- 30451,17376 -end- -->
					<p:ajax partialSubmit="true" process="@this"
						update="@([id$=scheduleByItemPanel])"
						listener="#{scheduleBiddingBB.selected(index)}" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="white-space : normal; width : 20%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.item.name']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
				</f:facet>
				
				<!-- 30451,17376 -start- -->
				<p:commandLink id="itemNameByItem" 
						value="#{bidItem.scRequestItem.itemName}" process="@this" partialSubmit="true"
						action="#{scheduleBiddingBB.itemDetailsPopupAction(bidItem.scRequestItem,bidItem.qty)}"
						update=":form:scheduleBiddingItemDetails"
						oncomplete="scheduleBiddingItemDetails.show()"
						disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}" />
				<!-- 30451,17376 -end- -->
				
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}"
				style="white-space : pre-line; width : 25%;">
				<p:inputTextarea id="itemDescByItem" 
					disabled="true" autoResize="false" 
					style="white-space : pre-line;width : 100%; height : 100%;" readonly="true"
					value="#{bidItem.scRequestItem.itemDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.uom']}" style="width : 8%;">
				<h:outputText id="uomNameByItem"
					value="#{bidItem.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.quantity']}" style="width : 7%;">
				<h:outputText id="quantityByItem" style="float : right"
					value="#{bidItem.qty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidItem.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="width : 10%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.bidding.start']}" />
				</f:facet>
				<!-- 30451,17376 -start- -->
				<ac:dateTime id="bidStartDateByItem" style="width:92%"
					mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
					postUpdateListener="#{scheduleBiddingBB.itemStartDateSelectListener(bidItem)}"
					label="#{lbl['lbl.sc.bidding.start']}"
					value="#{bidItem.scBidSchedule.startDate}" rowIndex="#{index}"
					update="@([id$=bidEndDateByItem],[id$=byItemStartDateMsg])"
					disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
					<!-- 30451,17376 -end- -->
				</ac:dateTime>
				<p:message id="byItemStartDateMsg" for="bidStartDateByItem"
					showDetail="false" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.end']}"
				style="width : 10%;">
				<!-- 30451,17376 -start- -->
				<p:inputText id="bidEndDateByItem" readonly="true" size="15"
					value="#{bidItem.scBidSchedule.endDate}"
					disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
					<!-- 30451,17376 -end- -->
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
				</p:inputText>
			</p:column>
			<p:column style="width : 8%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.duration.hours']}" />
				</f:facet>
				<!-- 30451,17376 -start- -->
				<p:selectOneMenu id="bidDurationByItem" 
					value="#{bidItem.scBidSchedule.duration}"
					disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
					<!-- 30451,17376 -end- -->
					<f:selectItems value="#{scheduleBiddingBB.managedBean.selectItems}"
						var="selectItem" itemLabel="#{selectItem.label}"
						itemValue="#{selectItem.value}" />
					<p:ajax event="change" process="@this" partialSubmit="true"
						update="@([id$=bidEndDateByItem],[id$=bidDurationByItemMsg])"
						listener="#{scheduleBiddingBB.itemDurationSelectListener(bidItem)}" />
				</p:selectOneMenu>
				<p:message id="bidDurationByItemMsg" showDetail="false"
					for="bidDurationByItem" display="icon" />
			</p:column>
			<p:column style="width : 10%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.min.decrement.block.tooltip']}" />
				</f:facet>
				<!-- 30451,17376 -start- -->
				<p:inputText style="text-align : right" id="decrementAmtByItem"
					maxlength="19" value="#{bidItem.decrementAmt }"
					disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
					<!-- 30451,17376 -end- -->
					<p:ajax event="change" process="@this" partialSubmit="true" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
				</p:inputText>
			</p:column>
		</p:dataTable>
		<div align="left">

			<table style="align: left">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.bidding.start']}" /></td>
					<td>
						<!-- 30451,17376 -start- -->
						<ac:dateTime id="multiSelectStartDateByItem"
							mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
							postUpdateListener="#{scheduleBiddingBB.multiSelectStartDateListener(scheduleBiddingBB.managedBean.rowSelectedBid)}"
							label="#{lbl['lbl.sc.bidding.start']}"
							value="#{scheduleBiddingBB.managedBean.rowSelectedBid.startDate}"
							update="@([id$=multiSelectEndDateByItem],[id$=ScheduleBiddingMainnMessage])"
							disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
						<!-- 30451,17376 -end- -->
						</ac:dateTime></td>
						<td><p:spacer width="5" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.bidding.end']}" /></td>
					<td>
						<!-- 30451,17376 -start- -->
						<p:inputText id="multiSelectEndDateByItem" readonly="true"
							size="15"
							value="#{scheduleBiddingBB.managedBean.rowSelectedBid.endDate}"
							disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
							<!-- 30451,17376 -end- -->
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText></td>
						<td><p:spacer width="5" /></td>
					<td><h:outputText value="#{lbl['lbl.sc.duration.hours']}" />
					</td>
					<td>
						<!-- 30451,17376 -start- -->
						<p:selectOneMenu id="bidDurationByItem" 
							value="#{scheduleBiddingBB.managedBean.rowSelectedBid.duration}"
							disabled="#{scheduleBiddingBB.managedBean.bdSfFlow}">
							<!-- 30451,17376 -end- -->
							<f:selectItems
								value="#{scheduleBiddingBB.managedBean.selectItems}"
								var="selectItem" itemLabel="#{selectItem.label}"
								itemValue="#{selectItem.value}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								update="@([id$=multiSelectEndDateByItem],[id$=ScheduleBiddingMainnMessage])"
								listener="#{scheduleBiddingBB.multiSelectDurationListener(scheduleBiddingBB.managedBean.rowSelectedBid)}" />
						</p:selectOneMenu></td>
						<td><p:spacer width="5" /></td>

						<TD>
							<!-- 30451,17376 -start- -->
							<p:commandButton
								value="#{lbl['lbl.btn.apply.to.all']}" id="applyDates"
								disabled="#{scheduleBiddingBB.deleteselectedList(scheduleBiddingBB.managedBean.bidItemList) or scheduleBiddingBB.managedBean.bdSfFlow}"
								process="@this,multiSelectStartDateByItem,multiSelectEndDateByItem"
								partialSubmit="true" style="float:center;"
								action="#{scheduleBiddingBB.applyBidDates}"
								update="@([id$=scheduleByItemPanel])"
								title="#{lbl['lbl.sc.bidding.item.btn.apply.to.all.tooltip']}" />
							<!-- 30451,17376 -end- -->
						</TD>

				</tr>

			</table>

		</div>
		<ui:include src="scheduleBidParticipantList.xhtml"></ui:include>
	</p:panel>
</ui:composition>
