<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.bidding.schedule']}" toggleable="true"
		id="scheduleByItemPanel">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.bidding.schedule.instruction']}" escape="false" />

		<p:dataTable id="bidScheduleByItem" var="bidItem" rowKey="#{bidItem}"
			selectionMode="single" rows="10" rowIndexVar="index"
			selection="#{scheduleBiddingBB.managedBean.selectedBidItem}"
			value="#{scheduleBiddingBB.managedBean.bidItemList}">
			<p:ajax event="rowSelect"
				listener="#{scheduleBiddingBB.retrieveParticipantsListAction}"
				process="@this" partialSubmit="true"
				update="@([id$=participantList])" />
			<ac:paginator for="bidScheduleByItem"></ac:paginator>

			<p:column style="width:2% ;">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selectAllItemsByItem"
						value="#{scheduleBiddingBB.managedBean.selectedAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=bidScheduleByItem])"
							listener="#{scheduleBiddingBB.selectAll}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox id="selectItemByItem"
					value="#{scheduleBiddingBB.managedBean.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this"
						listener="#{scheduleBiddingBB.selected(index)}" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="white-space : normal; width : 20%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.item.name']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.bidding.item.name.supplier.tooltip']}" />
				</f:facet>
				<h:outputText id="itemNameByItem"
					value="#{bidItem.scRequestItem.itemName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.item.description']}"
				style="white-space : normal; width : 25%;">
				<h:outputText id="itemDescByItem"
					value="#{bidItem.scRequestItem.itemDesc}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.uom']}" style="width : 8%;">
				<h:outputText id="uomNameByItem"
					value="#{bidItem.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.quantity']}" style="width : 7%;">
				<h:outputText id="quantityByItem" style="float : right"
					value="#{bidItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidItem.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.start']}"
				style="width : 10%;">
				<p:calendar value="#{bidItem.scBidSchedule.startDate}"
					showOn="button" style="width:92%" id="bidStartDateByItem"
					readonlyInput="true" label="#{lbl['lbl.sc.bidding.start']}"
					mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">

					<p:ajax event="dateSelect" process="bidStartDateByItem"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.itemStartDateSelectListener(bidItem)}"
						update="@([id$=bidEndDateByItem],[id$=byItemStartDateMsg])" />
					<p:ajax event="change" process="bidStartDateByItem"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.itemStartDateSelectListener(bidItem)}"
						update="@([id$=bidEndDateByItem],[id$=byItemStartDateMsg])" />
				</p:calendar>
				<p:message id="byItemStartDateMsg" for="bidStartDateByItem"
					showDetail="false" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bidding.end']}"
				style="width : 10%;">

				<p:calendar id="bidEndDateByItem"
					value="#{bidItem.scBidSchedule.endDate}" style="width:92%"
					mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
					label="#{lbl['lbl.sc.bidding.end']}" showOn="button"
					readonlyInput="true" maxMinute="0"
					maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">

					<p:ajax event="dateSelect" process="bidEndDateByItem"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.itemEndDateSelectListener(bidItem)}"
						update="@([id$=bidDurationByItem],[id$=byItemEndDateMsg])" />
					<p:ajax event="change" process="bidEndDateByItem"
						partialSubmit="true"
						listener="#{scheduleBiddingBB.itemEndDateSelectListener(bidItem)}"
						update="@([id$=bidDurationByItem],[id$=byItemEndDateMsg])" />
				</p:calendar>
				<p:message id="byItemEndDateMsg" for="bidEndDateByItem"
					showDetail="false" display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.duration.hours']}"
				style="width : 8%;">
				<p:outputLabel id="bidDurationByItem"
					value="#{bidItem.scBidSchedule.duration}" />
			</p:column>
			<p:column style="width : 10%;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.min.decrement.block']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.min.decrement.block.tooltip']}" />
				</f:facet>
				<p:inputText style="text-align : right" id="decrementAmtByItem"
					maxlength="19" value="#{bidItem.decrementAmt }">
					<p:ajax event="change" process="@this" partialSubmit="true" />
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
						maxIntegerDigits="14" />
				</p:inputText>
			</p:column>
		</p:dataTable>

		<p:spacer height="5"></p:spacer>
		<div align="left">

			<table style="align: left">

				<tr>

					<td><p:outputLabel value="#{lbl['lbl.sc.bidding.start']}" /></td>

					<td><p:calendar showOn="button"
							id="multiSelectStartDateByItem" readonlyInput="true"
							value="#{scheduleBiddingBB.managedBean.rowSelectedBid.startDate}"
							mindate="#{scheduleBiddingBB.managedBean.minStartDate}"
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
							<p:ajax event="dateSelect" process="multiSelectStartDateByItem"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.multiSelectStartDateListener(scheduleBiddingBB.managedBean.rowSelectedBid)}"
								update="@([id$=multiSelectEndDateByItem])" />
							<p:ajax event="change" process="multiSelectStartDateByItem"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.multiSelectStartDateListener(scheduleBiddingBB.managedBean.rowSelectedBid)}"
								update="@([id$=multiSelectEndDateByItem])" />

						</p:calendar></td>

					<td><p:outputLabel value="#{lbl['lbl.sc.bidding.end']}" /></td>

					<td><p:calendar showOn="button" id="multiSelectEndDateByItem"
							readonlyInput="true" maxMinute="0"
							mindate="#{scheduleBiddingBB.managedBean.minEndDate}"
							maxdate="#{scheduleBiddingBB.managedBean.maxEndDate}"
							value="#{scheduleBiddingBB.managedBean.rowSelectedBid.endDate}"
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
							<p:ajax event="dateSelect" process="multiSelectEndDateByItem"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.multiSelectEndDateListener(scheduleBiddingBB.managedBean.rowSelectedBid)}" />
							<p:ajax event="change" process="multiSelectEndDateByItem"
								partialSubmit="true"
								listener="#{scheduleBiddingBB.multiSelectEndDateListener(scheduleBiddingBB.managedBean.rowSelectedBid)}" />

						</p:calendar></td>

					<TD><p:commandButton value="#{lbl['lbl.btn.apply.to.all']}"
							id="applyDates"
							process="@this,multiSelectStartDateByItem,multiSelectEndDateByItem"
							partialSubmit="true" style="float:center;"
							action="#{scheduleBiddingBB.applyBidDates}"
							update="@([id$=bidScheduleByItem])"
							title="#{lbl['lbl.sc.bidding.item.btn.apply.to.all.tooltip']}" /></TD>

				</tr>

			</table>

		</div>

	</p:panel>
</ui:composition>
