<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.item.details']}" toggleable="true">

		<p:dataTable id="biddingListBMBI" selectionMode="single" rows="10"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{biddingBB.managedBean.scheduledBid.scBidItems}"
			var="bidItem" rowIndexVar="index" rowKey="#{bidItem.bidItemId}"
			selection="#{biddingBB.managedBean.selectedBidItem}">

			<p:ajax event="rowSelect" listener="#{biddingBB.rowSelectListener}"
				update="@([id$=itemPriceLineChartPanel],[id$=itemizedSupplierPricesPanel])" />
			<ac:paginator for="biddingListBMBI"></ac:paginator>
			
            <ui:remove> #25791 start </ui:remove>
			<p:column style="width : 400px;" headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText style="white-space : normal;word-wrap: break-word;"
					id="itemNameBMBI" escape="false"
					value="#{bidItem.scRequestItem.itemName}" />
				<ui:remove> #25791 end </ui:remove>
			</p:column>
			<ui:remove> #25791 start </ui:remove>
			<p:column style="width : 350px;" headerText="#{lbl['lbl.sc.item.description']}">
				<h:outputText style="white-space : normal;word-wrap: break-word;"
					id="itemDescBMBI" escape="false"
					value="#{bidItem.scRequestItem.itemDesc}" />
				<ui:remove> #25791 end </ui:remove>
			</p:column>
			<p:column style="width : 60px" headerText="#{lbl['lbl.sc.uom']}">

				<h:outputText id="uomNameBMBI"
					value="#{bidItem.scRequestItem.uom.uomName}" />

			</p:column>
			<p:column style="width : 65px" headerText="#{lbl['lbl.sc.quantity']}">
				<h:outputText id="qtyBMBI" style="float : right"
					value="#{bidItem.qty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, bidItem.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="width : 125px"
				headerText="#{lbl['lbl.sc.min.decrement.block']}">
				<h:outputText id="decrementAmtBMBI" style="float : right"
					value="#{bidItem.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
		<br />
		<ui:fragment
			rendered="#{biddingBB.managedBean.scheduledBid.scBidItems ne null}">
					#{biddingBB.managedBean.selectedBidItem.scRequestItem.itemName} > #{lbl['lbl.sc.bid.summary']}
				</ui:fragment>

		<h:panelGrid
			rendered="#{!empty biddingBB.managedBean.selectedBidItem}"
			style="width : 100%">
			<h:panelGroup id="itemPriceLineChartPanel">
				<div align="center">

					<h4>
						<B>#{lbl['lbl.sc.bidding.statistic.graph']}</B>
					</h4>

				</div>

				<div>

					<p:lineChart id="lineChartBMBI" animate="true"
						yaxisLabel="#{lbl['lbl.sc.bid.price']}"
						xaxisLabel="#{lbl['lbl.sc.bid.time']}"
						value="#{biddingBB.managedBean.itemPriceLinearModel}"
						legendPosition="e" style="height:300px;" />
				</div>
			</h:panelGroup>
			<c:if test="#{biddingBB.managedBean.remainingTimeForTimers ne 0}">
				<h:panelGrid style="align : left;">
					<ui:include src="bidManagementTimers.xhtml"></ui:include>
				</h:panelGrid>
			</c:if>

			<h:panelGroup id="itemizedSupplierPricesPanel">
				<p:dataTable id="rankingList" rowIndexVar="index" rows="10"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{biddingBB.managedBean.bidPriceItems}" var="bidPriceItem">
					<ac:paginator for="rankingList"></ac:paginator>
					<p:column headerText="#{lbl['lbl.sc.ranking']}"
						style=" align : center; width : 14%">
						<h:outputText id="itemRankVBI" value="#{bidPriceItem.ranking}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
						style="align : center; width : 14%">
						<h:outputText id="supplierCodeVBI"
							value="#{bidPriceItem.supplierNo}" />
					</p:column>
					<p:column style="align : center; width : 14%"
						headerText="#{lbl['lbl.sc.bumiputra.status']}">
						<h:outputText id="isBumiVBI"
							value="#{(bidPriceItem.bumi) ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
					</p:column>
					<p:column style="align : center; width : 14%"
						headerText="#{lbl['lbl.sc.starting.price']}">
						<h:outputText id="itemStartPriceVBI" style="float : right"
							value="#{biddingBB.itemizedStartPriceTotal(bidPriceItem)}">
						</h:outputText>
					</p:column>
					<p:column style=" align : center; width : 14%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.last.bid.price']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.last.bid.price.tooltip']}" />
						</f:facet>
						<div style="align: right">
							<p:commandLink id="bidPriceVBI"
								rendered="#{!((bidPriceItem.startingPrice - bidPriceItem.bidPrice) == 0)}"
								 style="float : right"
								oncomplete="priceHistory.show();"
								action="#{biddingBB.historyPricePopupAction(bidPriceItem)}"
								update="@([id$=historyPricePopupPanel])">
								<h:outputText value="#{bidPriceItem.bidPriceTotal}">
									<f:convertNumber
										pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
								</h:outputText>
							</p:commandLink>
						</div>

					</p:column>
					<p:column style=" align : center; width : 15%"
						headerText="#{lbl['lbl.sc.difference.rm']}">
						<h:outputText id="differenceVBI" style="float : right"
							rendered="#{bidPriceItem.bumi and biddingBB.managedBean.nonBumiAvail and (biddingBB.managedBean.lowestNonBumiOfferedPrice lt bidPriceItem.bidPriceTotal)}"
							value="#{biddingBB.managedBean.lowestNonBumiOfferedPrice - bidPriceItem.bidPriceTotal}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>
					<p:column style=" align : center; width : 15%"
						headerText="#{lbl['lbl.sc.cost.saving']}">
						<h:outputText id="savingVBI" style="float : right"
							value="#{biddingBB.managedBean.selectedBidItem.estimatedCost - bidPriceItem.bidPriceTotal}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>

				</p:dataTable>
			</h:panelGroup>
		</h:panelGrid>
	</p:panel>
	<h:panelGrid id="historyPricePopupPanel">
		<p:dialog rendered="#{biddingBB.managedBean.rendered}"
			header="#{lbl['lbl.sc.history.price']}" widgetVar="priceHistory"
			showEffect="fade" hideEffect="fade" modal="true" id="historyPrice">
			<ui:include
				src="/xhtml/sc/bidding/bidManagement/BMByItemHistoryPricePopup.xhtml"></ui:include>
		</p:dialog>
	</h:panelGrid>

</ui:composition>
