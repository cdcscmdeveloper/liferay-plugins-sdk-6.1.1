<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:messages id="bidRescheduleMessages"
		autoUpdate="#{!(biddingBB.managedBean.autoUpdate)}" showDetail="true"
		closable="true" showSummary="false" severity="error, info" />
	<p:panel id="reScheduleOrRebid">
		<table style="width: 100%">
			<tr>
				<TD style="width: 20%"><h:outputLabel
						value="#{lbl['lbl.sc.action']}" /></TD>
				<TD colspan="3" style="width: 80%">
					<table>
						<tr>
							<td><p:selectOneRadio id="bidAction"
									value="#{biddingBB.managedBean.bidAction.actionType}">
									<f:selectItems
										value="#{biddingBB.getBidActionTypeRadioButtonCodeValues(ParameterTypeConst.bidActionTypes)}" />

									<p:ajax event="change" process="@this,bidAction"
										partialSubmit="true"
										listener="#{biddingBB.bidActionTypeChangeListener}"
										update="@this,newBidStart,reScheduleOrRebid"></p:ajax>
								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.action.bidding.reschedule.tooltip']}" />
							</td>
						</tr>
					</table>
				</TD>

			</tr>

			<tr>
				<TD style="width: 20%"><h:outputLabel id="bidStartLblBRS"
						value="#{lbl['lbl.sc.original.bid.start']}" /></TD>
				<TD style="width: 40%"><p:inputText id="bidStartTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.startDate}"
						size="14" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></TD>
				<TD style="width: 20%"><h:outputLabel id="bidEndLblBRS"
						value="#{lbl['lbl.sc.original.bid.end']}" /></TD>
				<TD style="width: 20%"><p:inputText id="bidEndTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.endDate}"
						size="14" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></TD>
			</tr>
			<c:if
				test="#{biddingBB.managedBean.bidAction.actionType ne BiddingConst.BID_ACTION_TYPE_RESCHEDULE}">

				<tr>
					<TD style="width: 20%"><h:outputLabel id="pausedTimeLblBRS"
							value="#{lbl['lbl.sc.bid.paused.time']}" /></TD>
					<TD style="width: 40%"><p:inputText id="bidPausedTime"
							value="#{biddingBB.managedBean.lastBidAction.createdDate}"
							size="14" disabled="true">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText></TD>
					<TD style="width: 20%"><h:outputLabel id="remainingTimeBRS"
							value="#{lbl['lbl.sc.remaining.time']}" /></TD>
					<TD style="width: 20%"><p:inputText id="remainTime" size="14"
							disabled="true" value="#{biddingBB.managedBean.duration}" /></TD>
				</tr>
			</c:if>

			<tr>
				<TD style="width: 20%; text-align: right;"><h:outputText
						value="* " styleClass="mandatory" /> <h:outputLabel
						id="newBidStartDateLbl" value="#{lbl['lbl.sc.new.bidding.start']}" /></TD>
				<TD style="width: 40%"><ac:dateTime id="newBidStart"
						style="width:92%" mindate="#{biddingBB.managedBean.mindate}"
						postUpdateListener="#{biddingBB.resumeBidNewStartDateSelectListener()}"
						label="#{lbl['lbl.sc.bidding.start']}" modVal="1"
						binding="#{biddingBB.dateTimeInputUIComponent}"
						update="@([id$=newReBidEndDate],[id$=bidRescheduleMessages])"
						value="#{biddingBB.managedBean.bidAction.newStartDate}">
					</ac:dateTime></TD>
				<TD style="width: 20%; text-align: right;"><h:outputLabel
						id="newBidEndDateLbl" value="#{lbl['lbl.sc.new.bidding.end']}" /></TD>
				<TD style="width: 20%"><p:inputText id="newReBidEndDate"
						disabled="true" size="14"
						value="#{biddingBB.managedBean.bidAction.newEndDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></TD>
			</tr>

			<tr>
				<TD style="width: 20%; text-align: right;"><h:outputText
						value="* " styleClass="mandatory"
						rendered="#{!(biddingBB.managedBean.bidAction.actionType eq BiddingConst.BID_ACTION_TYPE_RESUME)}" />
					<h:outputLabel id="newBidDurationLbl"
						value="#{lbl['lbl.sc.new.bid.duration']}" /></TD>
				<TD style="width: 40%"><p:inputText id="newBidDuration"
						value="#{biddingBB.managedBean.newBidDuration}" size="14"
						disabled="true"
						rendered="#{biddingBB.managedBean.bidAction.actionType eq BiddingConst.BID_ACTION_TYPE_RESUME}" />
					<p:selectOneMenu id="bidDurationByItem" style="width : 120px;"
						rendered="#{!(biddingBB.managedBean.bidAction.actionType eq BiddingConst.BID_ACTION_TYPE_RESUME)}"
						value="#{biddingBB.managedBean.bidAction.rebidDuration}">
						<f:selectItems value="#{biddingBB.managedBean.selectItems}"
							var="selectItem" itemLabel="#{selectItem.label}"
							itemValue="#{selectItem.value}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@([id$=newReBidEndDate],[id$=bidRescheduleMessages])"
							listener="#{biddingBB.reBidDurationSelectListener(biddingBB.managedBean.bidAction)}" />
					</p:selectOneMenu></TD>
				<TD style="width: 20%"></TD>
				<TD style="width: 20%"></TD>
			</tr>

			<tr>
				<TD style="width: 20%; text-align: right;"><h:outputText
						value="* " styleClass="mandatory" /> <h:outputLabel
						id="suppNotesLbl" value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD style="width: 80%" colspan="3"><p:inputTextarea
						id="reBidOrResumeSupplierNotes" 
						value="#{biddingBB.managedBean.bidAction.remark}" rows="5"
						label="#{lbl['lbl.sc.notes.to.supplier']}" cols="80"
						onkeyup="limitTextArea(this,200);"
						onkeydown="limitTextArea(this,200);" maxLength="200">
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@this,bidRescheduleMessages" />
					</p:inputTextarea></TD>

			</tr>

		</table>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing"
				action="#{biddingBB.reScheduleOrReBidAction}" process="@this,reScheduleOrRebid"
				partialSubmit="true" update="@([id$=biddingListPanel],[id$=biddingList])" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				action="#{biddingBB.resetDateTimeComponent}" styleClass="BtnSpacing"
				update="@([id$=newBidStart])"
				oncomplete="bidRescheduleOrResume.hide();" immediate="true" />
		</div>
	</p:panel>
</ui:composition>
