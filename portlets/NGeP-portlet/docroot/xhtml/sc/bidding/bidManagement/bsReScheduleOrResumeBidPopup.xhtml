<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="reScheduleOrRebid">
		<table style="width: 100%">
			<tr>
				<TD style="width: 25%"><h:outputLabel
						value="#{lbl['lbl.sc.action']}" /></TD>
				<TD colspan="3" style="width: 75%">
					<table>
						<tr>
							<td><p:selectOneRadio id="bidAction"
									value="#{biddingBB.managedBean.bidAction.actionType}">
									<f:selectItems
										value="#{biddingBB.getRadioButtonCodeValues(ParameterTypeConst.bidActionTypes)}" />

									<p:ajax event="change" process="@this,bidAction"
										partialSubmit="true"
										listener="#{biddingBB.bidActionTypeChangeListener}"
										update="reScheduleOrRebid"></p:ajax>

								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.action.bidding.reschedule.tooltip']}" />
							</td>
						</tr>
					</table>
				</TD>

			</tr>

			<tr>
				<TD style="width: 25%"><h:outputLabel id="bidStartLblBRS"
						value="#{lbl['lbl.sc.original.bid.start']}" /></TD>
				<TD style="width: 25%"><p:inputText id="bidStartTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.startDate}"
						size="14" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></TD>
				<TD style="width: 25%"><h:outputLabel id="bidEndLblBRS"
						value="#{lbl['lbl.sc.original.bid.end']}" /></TD>
				<TD style="width: 25%"><p:inputText id="bidEndTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.endDate}"
						size="14" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></TD>
			</tr>
			<tr>
				<TD style="width: 25%"><h:outputLabel id="pausedTimeLblBRS"
						value="#{lbl['lbl.sc.bid.paused.time']}" /></TD>
				<TD style="width: 25%"><p:inputText id="bidPausedTime"
						value="#{biddingBB.managedBean.bidAction.createdDate}" size="14"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></TD>
				<TD style="width: 25%"><h:outputLabel id="remainingTimeBRS"
						value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD style="width: 25%"><p:inputText id="remainTime" size="14"
						disabled="true" value="#{biddingBB.managedBean.duration}" /></TD>
			</tr>

			<tr>
				<TD style="width: 25%; text-align: right;"><h:outputText
						value="* " styleClass="mandatory" /> <h:outputLabel
						id="newBidStartDateLbl" value="#{lbl['lbl.sc.new.bidding.start']}" /></TD>
				<TD style="width: 25%"><p:calendar id="newBidStart"
						required="true" size="14"
						value="#{biddingBB.managedBean.bidAction.newStartDate}"
						label="#{lbl['lbl.sc.new.bidding.start']}" showOn="button"
						mindate="#{biddingBB.managedBean.mindate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
						<p:ajax event="dateSelect" process="@this" partialSubmit="true"
							listener="#{biddingBB.resumeBidNewStartDateSelectListener}"
							update=":form:newResumeBidEndDate,:form:newBidDuration,:form:newReBidEndDate"></p:ajax>
					</p:calendar> <p:message id="newStartDateMsg" for="newBidStart"
						showDetail="false" display="icon" /></TD>
				<TD style="width: 25%; text-align: right;"><h:outputText
						value="* " styleClass="mandatory"
						rendered="#{biddingBB.managedBean.bidAction.actionType eq 'B'}" />
					<h:outputLabel id="newBidEndDateLbl"
						value="#{lbl['lbl.sc.new.bidding.end']}" /></TD>
				<TD style="width: 25%"><p:inputText id="newResumeBidEndDate"
						disabled="true" size="14"
						value="#{biddingBB.managedBean.bidAction.newEndDate}"
						rendered="#{biddingBB.managedBean.bidAction.actionType eq biddingBB.managedBean.resume}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText> <p:calendar id="newReBidEndDate" showOn="button" required="true"
						mindate="#{biddingBB.managedBean.mindate}"
						maxdate="#{biddingBB.managedBean.maxdate}"
						rendered="#{biddingBB.managedBean.bidAction.actionType eq biddingBB.managedBean.reBidding}"
						size="14" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						label="#{lbl['lbl.sc.new.bidding.end']}"
						value="#{biddingBB.managedBean.bidAction.newEndDate}">
						<p:ajax event="dateSelect" process="@this" partialSubmit="true"
							listener="#{biddingBB.reBidNewEndDateSelectListener}"
							update="newBidDuration" />
					</p:calendar> <p:message id="newReBidEndDateMsg" for="newReBidEndDate"
						showDetail="false" display="icon" /></TD>
			</tr>

			<tr>
				<TD style="width: 25%"><h:outputLabel id="newBidDurationLbl"
						value="#{lbl['lbl.sc.new.bid.duration']}" /></TD>
				<TD style="width: 25%"><p:inputText id="newBidDuration"
						value="#{biddingBB.managedBean.newBidDuration}" size="14"
						disabled="true" /></TD>
				<TD style="width: 25%"></TD>
				<TD style="width: 25%"></TD>
			</tr>

			<tr>
				<TD style="width: 25%; text-align: right;"><h:outputText
						value="* " styleClass="mandatory" /> <h:outputLabel
						id="suppNotesLbl" value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD style="width: 75%" colspan="3"><p:inputTextarea
						id="reBidOrResumeSupplierNotes" required="true"
						value="#{biddingBB.managedBean.bidAction.remark}" rows="5"
						label="#{lbl['lbl.sc.notes.to.supplier']}" cols="68"
						maxLength="200" /> <p:message id="reBidOrResumeSupplierNotesMsg"
						for="reBidOrResumeSupplierNotes" showDetail="false" display="icon" />
				</TD>

			</tr>

		</table>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing"
				actionListener="#{biddingBB.reScheduleOrReBidAction()}"
				process="@this,reBidOrResumeSupplierNotes,newBidStart,newResumeBidEndDate,newReBidEndDate "
				partialSubmit="true" oncomplete="bidRescheduleOrResume.hide();"
				update="@form" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				styleClass="BtnSpacing" onclick="bidRescheduleOrResume.hide();"
				immediate="true" />
		</div>
	</p:panel>
</ui:composition>
