<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div>
		<table>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></TD>
				<TD><p:inputText id="hPopupItemName"
						value="#{biddingBB.managedBean.selectedBidItem.scRequestItem.itemName}"
						size="20" disabled="true" /></TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></TD>
				<TD><p:inputText id="hPopupUOM"
						value="#{biddingBB.managedBean.selectedBidItem.scRequestItem.uom.uomName}"
						size="20" disabled="true" /></TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></TD>
				<TD>
					<div style="align: right">
						<p:inputText id="hPopupQty" style="float : right"
							value="#{biddingBB.managedBean.selectedBidItem.qty}" size="20"
							disabled="true">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, biddingBB.managedBean.historyPrice.scBidSupplierItem.scBidItem.scRequestItem.uom.uomCode)}" />
						</p:inputText>
					</div>
				</TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.supplier.code']}" /></TD>
				<TD><p:inputText id="hPopupSupplier"
						value="#{biddingBB.managedBean.historyPrice.scBidSupplierItem.scBidSupplier.smSupplier.supplierId}"
						size="20" disabled="true" /></TD>
			</tr>
		</table>

	</div>

	<p:panel header="#{lbl['lbl.sc.history.summary']}" toggleable="true">
		<div align="center">
			<h5>
				<B>#{lbl['lbl.sc.bidding.statistic.graph']}</B>
			</h5>
		</div>
		<div>
			<p:lineChart value="#{biddingBB.managedBean.historyPriceLinearModel}"
				animate="true" yaxisLabel="#{lbl['lbl.sc.bid.price']}"
				xaxisLabel="#{lbl['lbl.sc.bid.time']}" legendPosition="e"
				style="height:250px; width:750px" />
		</div>
		<div>
			<p:dataTable id="historySummary"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{biddingBB.managedBean.bidHistoryPriceList}" var="history">
				<ac:paginator for="historySummary"></ac:paginator>
				<p:column headerText="#{lbl['lbl.sc.submitted.time']}">
					<h:outputText value="#{history.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
						<!-- need to change the pattern value  -->
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bid.price']}">
					<h:outputText style="float : right" value="#{history.bidPrice}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</div>
	</p:panel>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.close']}"
			styleClass="BtnSpacing" onclick="priceHistory.hide();" />
	</div>

</ui:composition>
