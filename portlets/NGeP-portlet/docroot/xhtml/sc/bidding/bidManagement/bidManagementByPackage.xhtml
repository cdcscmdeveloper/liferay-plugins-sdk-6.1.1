<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #29466 - START -->
	<ui:param name="manufacturercategoryCode" value="#{biddingBB.checkManufacturerCategoryCodes(biddingBB.managedBean.scQt)}"></ui:param>
	<!-- #29466 - END -->

	<ui:remove> #28777#29729 - Start </ui:remove>
	<ui:param name="isDisqualified"
		value="#{biddingBB.managedBean.disqualified}"></ui:param>
	<ui:remove> #28777#29729 - End </ui:remove>

	<p:panel header="#{lbl['lbl.sc.item.details']}"
		id="itemDetailsByPackage" toggleable="true">

		<p:dataTable id="scBidItemsList" rows="10" var="item"
			rowIndexVar="index"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{biddingBB.managedBean.scheduledBid.scBidItems}">
			<ac:paginator for="scBidItemsList"></ac:paginator>

             <ui:remove> #25791 start </ui:remove>
			<p:column style="width : 400px;"  headerText="#{lbl['lbl.sc.item.name']}">
				<h:outputText id="itemNameVBP"
					style="white-space: normal;word-wrap: break-word;" escape="false"
					value="#{item.scRequestItem.itemName}" />
				<ui:remove> #25791 end </ui:remove>
			</p:column>
			<ui:remove> #25791 start </ui:remove>
			<p:column style="width : 350px;" headerText="#{lbl['lbl.sc.item.description']}">
				<h:outputText id="ItemDescriptionVBP"
					style="white-space: normal;word-wrap: break-word;" escape="false"
					value="#{item.scRequestItem.itemDesc}" />
				<ui:remove> #25791 end </ui:remove>
			</p:column>
			<p:column style="width : 60px" headerText="#{lbl['lbl.sc.uom']}">

				<h:outputText id="uomNameVBP"
					value="#{item.scRequestItem.uom.uomName}" />
			</p:column>
			<p:column style="width : 65px" headerText="#{lbl['lbl.sc.quantity']}">
				<h:outputText id="qtyVBP" style="float : right" value="#{item.qty}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, item.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>
			<p:column style="width : 125px"
				headerText="#{lbl['lbl.sc.min.decrement.block']}">
				<h:outputText id="decrementAmtVBP" style="float : right"
					value="#{item.decrementAmt}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.bid.summary']}" id="bidSummaryByPackage"
		toggleable="true">
		<div align="center">

			<h4>
				<B>#{lbl['lbl.sc.bidding.statistic.graph']}</B>
			</h4>

		</div>

		<div>
			<p:lineChart id="LineChartVBP" animate="true"
				yaxisLabel="#{lbl['lbl.sc.bid.price']}"
				xaxisLabel="#{lbl['lbl.sc.bid.time']}"
				value="#{biddingBB.managedBean.bidPriceLinearModel}"
				legendPosition="e" style="height:300px;" />
		</div>
		<h:panelGrid
			rendered="#{biddingBB.managedBean.remainingTimeForTimers ne 0}">
			<ui:include src="bidManagementTimers.xhtml"></ui:include>
		</h:panelGrid>

		<ui:remove> #28777#29729 - Start </ui:remove>
		<h:outputText escape="false"
			value="#{lbl['lbl.sc.list.qualified.supplier']}"
			style="font-weight:bold; font-size: 15px;"
			rendered="#{isDisqualified}" />
		<ui:remove> #28777#29729 - End </ui:remove>

		<p:dataTable id="bidPackagesListForBMBP"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{biddingBB.managedBean.bidPackages}" var="item" rowIndexVar="index"><ui:remove>26247 - added rowIndexVar attr</ui:remove>
			<ac:paginator for="bidPackagesListForBMBP"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.ranking']}">
				<p:outputLabel value="#{item.ranking}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">

				<p:commandLink value="#{item.scBidSupplier.supplierNo}"
					oncomplete="pricePop.show();"
					actionListener="#{biddingBB.supplierItemPricePopupAction(item)}"
					update="@([id$=itemPricePop])" />

			</p:column>
			<!-- #29466 - START Nasim removed (Notes-150)-->
<!-- 			<p:column headerText="#{lbl['lbl.sc.total.score']}"> -->
<!-- 				<h:outputText value="#{item.scBidSupplier.totalScore}" style="float : right"> -->
<!-- 					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat( -->
<!-- 												CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" /> -->
<!-- 				</h:outputText> -->
<!-- 			</p:column> -->
			<!-- #29466 - END -->
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText
					value="#{(item.scBidSupplier.bumi)? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			<ui:remove>26247 - start</ui:remove>
			<p:column style="white-space:normal;width:18%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.discipline.action.taken']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" />
				</f:facet>
				<ac:disciplinaryActionYesNo
					supplier="#{item.scBidSupplier.smSupplier}" maxRow="5" index="#{index}"/>
			</p:column>
			<ui:remove>26247 - end</ui:remove>
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}">
				<h:outputText style="float : right"
					value="#{item.scBidSupplier.packageStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}">
				<h:outputText
					rendered="#{item.scBidSupplier.packageStartPrice ne item.bidPriceTotal}"
					style="float : right" value="#{item.bidPriceTotal}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">

				<h:outputText style="float : right"
					rendered="#{item.scBidSupplier.bumi and biddingBB.managedBean.nonBumiAvail}"
					value="#{item.bidPriceTotal - biddingBB.managedBean.lowestNonBumiOfferedPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}">

				<h:outputText style="float : right"
					rendered="#{item.scBidSupplier.bumi and biddingBB.managedBean.nonBumiAvail}"
					value="#{item.diffPercentage}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>

			</p:column>
			<!-- #29466 - START -->
			<p:column headerText="#{lbl[manufacturercategoryCode ?'lbl.sc.pref.margin.manufacturer' : 'lbl.sc.pref.margin']}">
				<h:outputText style="float : right" value="#{item.prefMargin}"
					rendered="#{item.scBidSupplier.bumi}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			<!-- #29466 - END -->
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}">
				<h:outputText style="float : right"
					value="#{biddingBB.managedBean.scheduledBid.packageEstimateCost - item.bidPriceTotal}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>

		<ui:remove> #28777#29729 - Start </ui:remove>
		<h:outputText escape="false"
			value="#{lbl['lbl.sc.list.disqualified.supplier']}"
			style="font-weight:bold; font-size: 15px;"
			rendered="#{isDisqualified}" />
		<p:dataTable id="bidPackagesListForBMBPDisqualified"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{biddingBB.managedBean.bidPackagesDisqualified}" var="item"
			rendered="#{isDisqualified}">
			<ac:paginator for="bidPackagesListForBMBPDisqualified"></ac:paginator>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">

				<p:commandLink value="#{item.scBidSupplier.supplierNo}"
					oncomplete="pricePop.show();"
					actionListener="#{biddingBB.supplierItemPricePopupAction(item)}"
					update="@([id$=itemPricePop])" />

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}">
				<h:outputText
					value="#{(item.scBidSupplier.bumi)? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.total.starting.price']}">
				<h:outputText style="float : right"
					value="#{item.scBidSupplier.packageStartPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.total.last.bid.price']}">
				<h:outputText
					rendered="#{item.scBidSupplier.packageStartPrice ne item.bidPriceTotal}"
					style="float : right" value="#{item.bidPriceTotal}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.rm']}">

				<h:outputText style="float : right"
					rendered="#{item.scBidSupplier.bumi and biddingBB.managedBean.nonBumiAvail}"
					value="#{item.bidPriceTotal - biddingBB.managedBean.lowestNonBumiOfferedPrice}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.difference.perc']}">

				<h:outputText style="float : right"
					rendered="#{item.scBidSupplier.bumi and biddingBB.managedBean.nonBumiAvail}"
					value="#{item.diffPercentage}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>

			</p:column>
			<!-- #29466 - START -->
			<p:column
				headerText="#{lbl[manufacturercategoryCode ?'lbl.sc.pref.margin.manufacturer' : 'lbl.sc.pref.margin']}">
				<h:outputText style="float : right" value="#{item.prefMargin}"
					rendered="#{item.scBidSupplier.bumi}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputText>
			</p:column>
			<!-- #29466 - END -->
			<p:column headerText="#{lbl['lbl.sc.total.cost.saving']}">
				<h:outputText style="float : right"
					value="#{biddingBB.managedBean.scheduledBid.packageEstimateCost - item.bidPriceTotal}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.disqualified.reason']}"
				style="text-align:center;">
				   <c:choose>
					    <c:when test="#{biddingBB.managedBean.scheduledBid.tplSpecZoneDtl ne null}">	
				             <h:outputText rendered="#{biddingBB.checkZonesDisqualifiedSupplierBranchDeleted(biddingBB.managedBean.scQt.qtId, item.scBidSupplier.smSupplier.supplierId, biddingBB.managedBean.scheduledBid.tplSpecZoneDtl.specZoneId) or item.supplierDeactivated}"
					         value="#{lbl['lbl.sc.disqualified.reason.eligibility.criteria.status']}" />
				        </c:when>
				        <c:otherwise>
		                     <h:outputText rendered="#{biddingBB.checkDisqualifiedSupplierBranchDeleted(biddingBB.managedBean.scQt.qtId, item.scBidSupplier.smSupplier.supplierId) or item.supplierDeactivated}"
					         value="#{lbl['lbl.sc.disqualified.reason.eligibility.criteria.status']}" /> 
					    </c:otherwise>
				    </c:choose>
			</p:column>
		</p:dataTable>
		<ui:remove> #28777#29729 - End </ui:remove>

	</p:panel>
	<p:panel>
		<div style="align: left">
			<TABLE>
				<tr>
					<TD></TD>
					<TD></TD>
					<TD></TD>
					<TD><h:outputLabel
							value="#{lbl['lbl.sc.bidding.bumiputera.price']}">
							<p:spacer width="5"></p:spacer>
						</h:outputLabel></TD>

					<TD><h:outputText value="-">
							<p:spacer width="5"></p:spacer>
						</h:outputText></TD>

					<TD><h:outputLabel
							value="#{lbl['lbl.sc.bidding.lowest.non.bumiputera.price']}">
							<p:spacer width="5"></p:spacer>
						</h:outputLabel></TD>
					<TD></TD>
					<TD></TD>
				</tr>
				<tr>
					<TD><h:outputLabel value="#{lbl['lbl.sc.note']}">
							<p:spacer width="5"></p:spacer>
						</h:outputLabel></TD>

					<TD><h:outputLabel value="#{lbl['lbl.sc.difference.perc']}">
							<p:spacer width="5"></p:spacer>
						</h:outputLabel></TD>

					<TD><h:outputText value="=">
							<p:spacer width="5"></p:spacer>
						</h:outputText></TD>

					<TD colspan="3"><h:outputText
							value="-------------------------------------------------------------------------------">
							<p:spacer width="5"></p:spacer>
						</h:outputText></TD>

					<TD><h:outputText value="X">
							<p:spacer width="5"></p:spacer>
						</h:outputText></TD>

					<TD><h:outputText value="100" /></TD>
				</tr>
				<tr>
					<TD></TD>
					<TD></TD>
					<TD></TD>

					<TD colspan="3"><h:outputText style="float : center"
							value="#{lbl['lbl.sc.bidding.lowest.non.bumiputera.price']}" /></TD>

					<TD></TD>
					<TD></TD>
				</tr>

			</TABLE>

		</div>

	</p:panel>
	<p:dialog closeOnEscape="true"
		header="#{lbl['lbl.sc.item.price.section']}" widgetVar="pricePop"
		showEffect="fade" hideEffect="fade" modal="true" id="itemPricePop">
		<ui:include
			src="/xhtml/sc/bidding/bidManagement/BMByZoneItemPricePopup.xhtml"></ui:include>
	</p:dialog>
</ui:composition>
