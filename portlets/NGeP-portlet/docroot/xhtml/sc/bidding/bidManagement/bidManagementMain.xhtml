<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<script src="#{resource['js/countdown.js']}" />
	</ui:define>

	<ui:define name="contentSection">

		<table style="width: 100%">
			<!-- #25791 start -->
			<tr>
				<td><p:commandButton id="backButton" styleClass="BtnSpacing"
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						partialSubmit="true" process="@this" immediate="true"
						action="#{biddingBB.biddingMonitorBackAction}" /></td>
				<!-- #25791 start -->

				<td style="vertical-align: bottom;" align="right"><p:commandLink
						value="#{lbl['lbl.td.doc.trackingDiary']}" style="float:right;"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeQuotation, biddingBB.managedBean.scQt.qtId)}"
						immediate="true"
						rendered="#{!empty biddingBB.managedBean.previousPageUrl}" /></td>
				<!-- #25791 start -->

			</tr>
		</table>
		<ui:include src="bidManagementSupplemenatryPage.xhtml"></ui:include>
	</ui:define>
</ui:composition>
