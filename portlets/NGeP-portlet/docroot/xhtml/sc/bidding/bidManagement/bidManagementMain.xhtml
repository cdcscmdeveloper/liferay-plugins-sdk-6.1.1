<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">

	</ui:define>

	<ui:define name="contentSection">
		<ui:param name="isZonal"
			value="#{!empty biddingBB.managedBean.scheduledBid.tplSpecZoneDtl}" />
		<ui:param name="isViewByPackage"
			value="#{biddingBB.managedBean.bidManagementViewBy eq 'P'}" />
		<ui:param name="isViewByItem"
			value="#{biddingBB.managedBean.bidManagementViewBy eq 'I'}" />

		<table>
			<tr>
				<td><p:commandButton id="backButton" styleClass="BtnSpacing"
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						partialSubmit="true" process="@this"
						action="#{biddingBB.biddingMonitorBackAction}" /></td>
			</tr>
		</table>

		<div align="left" class="header-info">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel id="biddingNoLbl"
							value="#{lbl['lbl.sc.bidding.no']}" /></td>
					<td class="header-info-text">
						#{biddingBB.managedBean.scheduledBid.bidNo}</td>
					<td><p:outputLabel id="docNoLbl"
							value="#{lbl['lbl.sc.document.no']}" /></td>
					<td style="width: 14%" class="header-info-text">#{biddingBB.managedBean.scheduledBid.scBid.docNo}
					</td>

					<td><p:outputLabel id="ptjNameLbl"
							value="#{lbl['lbl.sc.ptj']}" /></td>
					<td class="header-info-text">#{biddingBB.managedBean.scheduledBid.scBid.pmOrgProfile.orgName}
					</td>

					<td><p:outputLabel id="bidStatusLbl"
							value="#{lbl['lbl.sc.status']}" /></td>

					<td class="header-info-text">#{biddingBB.getStatusDescById(biddingBB.managedBean.scheduledBid.pmStatus.statusId)}
					</td>

				</tr>

			</table>
		</div>

		<p:spacer height="5px"></p:spacer>

		<p:panel header="#{lbl['lbl.sc.bid.details']}"
			id="bidDetailsForBidManagement" toggleable="true">

			<div align="center">
				<table style="width: 60%">

					<tr>
						<td style="width: 15%"><p:outputLabel id="startDateLbl"
								value="#{lbl['lbl.sc.bidding.start']}" /></td>
						<td style="width: 15%"><p:inputText id="bidStart"
								value="#{biddingBB.managedBean.scheduledBid.startDate}"
								size="15" disabled="true">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
						<td style="width: 15%"><p:outputLabel id="endDateLbl"
								value="#{lbl['lbl.sc.bidding.end']}" /></td>
						<td style="width: 15%"><p:inputText id="bidEnd"
								value="#{biddingBB.managedBean.scheduledBid.endDate}" size="15"
								disabled="true">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
							</p:inputText></td>
					</tr>

					<tr>
						<td style="width: 15%"><p:outputLabel id="bidDurationlbl"
								value="#{lbl['lbl.sc.duration.hours']}" /></td>
						<td style="width: 15%"><p:inputText id="duration" size="15"
								disabled="true" value="#{biddingBB.managedBean.duration}" /></td>
						<td style="width: 15%"></td>
						<td style="width: 15%"></td>

					</tr>
					<c:if test="#{isZonal}"> 
						<tr>
							<td style="width: 15%"><p:outputLabel id="zoneNameLbl"
									value="#{lbl['lbl.sc.zone.name']}" /></td>
							<td style="width: 15%"><p:inputText id="zoneNameLabel"
									disabled="true" size="15"
									value="#{biddingBB.managedBean.scheduledBid.tplSpecZoneDtl.zoneName}" />
								 <p:commandLink id="zoneName"
									oncomplete="zoneLocPopup.show();" partialSubmit="true"
									process="@this" update="@([id$=zoneLocPopup])">
									<p:graphicImage id="zoneDtlId"  title="#{lbl['lbl.sc.zone.details']}"
										value="#{CommonUIConstant.imagePathUptoDesign}/evaluate.png" />
									<f:setPropertyActionListener
										target="#{zoneLocationBackingBean.tplSpecZoneDtl}"
										value="#{biddingBB.managedBean.scheduledBid.tplSpecZoneDtl}" />
								</p:commandLink></td>
							<td style="width: 15%"></td>
							<td style="width: 15%"></td>
						</tr>
					 </c:if> 


					<tr>
						<td style="width: 15%"><p:outputLabel id="viewBylbl"
								value="#{lbl['lbl.sc.view.by']}" /></td>
						<td style="width: 15%"><p:inputText id="recommendTYpeLbl"
								disabled="true" size="15"
								value="#{biddingBB.getParameterDesc(biddingBB.managedBean.scheduledBid.scBid.recommendedTypeId)}" />
						</td>
						<td style="width: 15%"></td>
						<td style="width: 15%"></td>
					</tr>
					</table>
			</div>

		</p:panel>

		<c:if test="#{isViewByPackage}">
			<ui:include src="bidManagementByPackage.xhtml"></ui:include>
		</c:if>
		<c:if test="#{isViewByItem}">
			<ui:include src="bidManagementByItem.xhtml"></ui:include>
		</c:if>


		<p:dialog id="zoneLocPopup" widgetVar="zoneLocPopup" rendered="true"
			header="#{lbl['lbl.sc.zone.details']}" modal="true" width="350"
			height="200">
			<ui:include
				src="/xhtml/sc/bidding/bidManagement/BMByItemZoneLocationPopup.xhtml" />
		</p:dialog>
	</ui:define>
</ui:composition>
