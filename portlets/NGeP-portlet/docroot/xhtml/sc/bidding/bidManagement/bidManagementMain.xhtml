<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
		<script src="#{resource['js/countdown.js']}" />
		<script type="text/javascript">
			function biddingExtender() {
				this.cfg.highlighter = {
					show : true,
					tooltipAxes : 'xy',
					useAxesFormatters : false,
					tooltipContentEditor : function(str, seriesIndex,
							pointIndex, plot) {
						// Accessing the data point [Time, Price]
						var data = plot.series[seriesIndex].data[pointIndex];

						// Running Number (1, 2, 3...)
						var runningNo = pointIndex + 1;

						// Supplier Number (Pulled from the Label we set in Java)
						var supplierNo = plot.series[seriesIndex].label;

						// Total Price
						var bidPrice = data[1];
						var bidTime = data[0];

						// Returns the format: (Running No, Supplier No, Price)
						return "(" + runningNo + ", " + supplierNo + ", "
								+ bidPrice + ")";
					}
				};

				this.cfg.axes.xaxis = {
					renderer : $.jqplot.CategoryAxisRenderer,
					tickOptions : {
						angle : -45
					}
				};
			}
		</script>
	</ui:define>

	<ui:define name="contentSection">

		<ui:remove> #25791 start </ui:remove>
		<table style="width: 100%">
			<ui:remove> #25791 end </ui:remove>
			<tr>
				<td>
				<ui:remove> #25791 start </ui:remove> 
					<p:commandButton
						id="backButton" styleClass="BtnSpacing"
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						partialSubmit="true" process="@this" immediate="true"
						action="#{biddingBB.biddingMonitorBackAction}" /> 
					<ui:remove> #25791 end </ui:remove>
				</td>
				<ui:remove> #25791 start </ui:remove>
				<td style="vertical-align: bottom;" align="right"><p:commandLink
						value="#{lbl['lbl.td.doc.trackingDiary']}" style="float:right;"
						action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeQuotation, biddingBB.managedBean.scQt.qtId)}"
						immediate="true"
						rendered="#{biddingBB.isQTMaintenanceScreen()}">
						<f:setPropertyActionListener
							target="#{pmTrackingDiaryBackingBean.managedBean.biddingUrl}"
							value="#{true}"></f:setPropertyActionListener><ui:remove> #25791 start </ui:remove>
					</p:commandLink></td>
				<ui:remove> #25791 end </ui:remove>
			</tr>
		</table>
		<ui:include src="bidManagementSupplemenatryPage.xhtml"></ui:include>
	</ui:define>
</ui:composition>
