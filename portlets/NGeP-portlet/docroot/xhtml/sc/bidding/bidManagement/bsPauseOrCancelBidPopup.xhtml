<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:messages id="bidPauseCancelMessages"
		autoUpdate="#{!(biddingBB.managedBean.autoUpdate)}" showDetail="true"
		closable="true" showSummary="false" severity="error, info"/>
    <p:panel id="pauseOrCancel">
	<div>
		<table>
			<tr>
				<TD><p:outputLabel id="remainingTimeLblBPC"
						value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD><p:inputText id="bidPauseOrCancelRemainingTime"
						value="#{biddingBB.managedBean.duration}" size="20"
						disabled="true" /></TD>
			</tr>
			<tr>
				<TD style="text-align: right;"><h:outputText value="* "
						styleClass="mandatory" /> <h:outputLabel id="supplierNotesLblBPC"
						value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD><p:inputTextarea id="bidPauseOrCancelsupplierNotes"
						label="#{lbl['lbl.sc.notes.to.supplier']}" rows="5"
						value="#{biddingBB.managedBean.bidAction.remark}" cols="65"
						onkeyup="limitTextArea(this,200);"
						onkeydown="limitTextArea(this,200);" onmouseout="limitTextArea(this,200);" maxLength="200">
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@this,bidPauseCancelMessages" />
					</p:inputTextarea></TD>
			</tr>
		</table>
	</div>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.ok']}" 
			styleClass="BtnSpacing" update="@([id$=biddingListPanel],[id$=biddingList])"
			action="#{biddingBB.bidPauseOrCancelAction}"
			process="@this,pauseOrCancel" partialSubmit="true" />

		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			styleClass="BtnSpacing" partialSubmit="true"
			action="#{biddingBB.closePopUpAction}"
			oncomplete="bidPauseOrCancel.hide();" immediate="true" />
	</div>
</p:panel>
</ui:composition>
