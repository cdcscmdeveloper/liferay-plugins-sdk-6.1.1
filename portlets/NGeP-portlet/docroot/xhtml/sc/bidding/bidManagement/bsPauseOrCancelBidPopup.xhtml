<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:messages id="bidPauseCancelMessages"  autoUpdate="#{!biddingBB.managedBean.autoUpdate}" showDetail="true"
		showSummary="false" closable="true" severity="error, info" />
	<div>
		<table>
			<tr>
				<TD><p:outputLabel id="remainingTimeLblBPC"
						value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD><p:inputText id="bidPauseOrCancelRemainingTime"
						value="#{biddingBB.managedBean.duration}" size="20"
						disabled="true" /></TD>
			</tr>
			<tr>
				<TD style="text-align: right;"><h:outputText value="* "
						styleClass="mandatory" /> <h:outputLabel id="supplierNotesLblBPC"
						value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD><p:inputTextarea id="bidPauseOrCancelsupplierNotes"
						required="true" label="#{lbl['lbl.sc.notes.to.supplier']}"
						value="#{biddingBB.managedBean.bidAction.remark}" cols="65"
						onkeyup="limitTextArea(this,200);"
						onkeydown="limitTextArea(this,200);" maxLength="200" /> <p:message
						id="supplierNotesMsg" for="bidPauseOrCancelsupplierNotes"
						showDetail="false" display="icon" /></TD>
			</tr>
		</table>
	</div>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.btn.ok']}" update="@form"
			styleClass="BtnSpacing"
			actionListener="#{biddingBB.bidPauseOrCancelAction}"
			process="@this,bidPauseOrCancelsupplierNotes " partialSubmit="true" />

		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			styleClass="BtnSpacing" partialSubmit="true"
			action="#{biddingBB.closePopUpAction}"
			oncomplete="bidPauseOrCancel.hide();" immediate="true" />
	</div>

</ui:composition>
