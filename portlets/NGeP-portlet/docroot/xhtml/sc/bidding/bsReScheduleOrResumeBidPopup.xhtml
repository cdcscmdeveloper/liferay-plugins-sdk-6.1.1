<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"

	<div>

		<table>

			<tr>

				<TD></TD>
				<TD></TD>
			</tr>

						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.originalBS']}" /></TD>

						value="#{biddingBB.managedBean.bidStartTime}" size="20"

				<TD><p:outputLabel
						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.originalBE']}" /></TD>
				<TD><p:inputText id="bidEndTime"
						value="#{biddingBB.managedBean.bidEndTime}" size="20" disabled="true"

			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.bidPT']}" /></TD>

						value="#{biddingBB.managedBean.bidPausedTime}" size="20" disabled="true"

						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.remainTime']}" /></TD>

						value="#{biddingBB.managedBean.remainingTime}" size="20" disabled="true"

			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.newBS']}" /></TD>
				<TD><p:inputText id="newBidStart"
						value="#{biddingBB.managedBean.newBidStart}" size="20"
						disabled="true" /></TD>
				<TD><p:outputLabel
						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.newBE']}" /></TD>
				<TD><p:inputText id="newBidEnd"

				<TD><p:inputTextArea id="newBidDuration"
						value="#{biddingBB.managedBean.newBidDuration}" size="20"
						disabled="true" /></TD>
				<TD></TD>
				<TD></TD>
			</tr>
			<tr>
				<TD><p:outputLabel
						value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.nTs']}" /></TD>
				<TD colspan="3"><p:inputTextArea id="supplierNotes"
						value="#{biddingBB.managedBean.supplierNotes}" size="200"
						maxLength="1000" /></TD>

	<div>

		<p:commandButton value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.ok']}"

		<p:commandButton value="#{lbl['lbl.sc.bidding.bm.bs.pop2.rsb.cancel']}"
			icon="ui-icon-cancel" />
