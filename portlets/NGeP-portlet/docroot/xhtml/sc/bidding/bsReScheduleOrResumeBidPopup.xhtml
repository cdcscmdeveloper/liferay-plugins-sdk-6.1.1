<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">




	<p:panel id="reScheduleOrRebid">
		<table style="width : 100%">

			<tr>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.action']}"  /></TD>
				<TD colspan="3" style="width : 75%" ><p:selectOneRadio id="bidAction"
						value="#{biddingBB.managedBean.bidAction.actionType}">
						<f:selectItem itemLabel="Resume Bid" itemValue="R"></f:selectItem>
						<f:selectItem itemLabel="Re-Bidding" itemValue="B"></f:selectItem>

						<p:ajax event="change" process="@this,bidAction" partialSubmit="true"
							listener="#{biddingBB.bidActionTypeChangeListener}"
							update="reScheduleOrRebid"></p:ajax>

					</p:selectOneRadio></TD>

			</tr>

			<tr>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.original.bid.start']}" /></TD>
				<TD style="width : 25%"><p:inputText id="bidStartTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.startDate}"
						size="16" disabled="true" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"  />
						</p:inputText>
						</TD>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.original.bid.end']}" /></TD>
				<TD style="width : 25%"><p:inputText id="bidEndTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.endDate}"
						size="20" disabled="true" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"  />
						</p:inputText></TD>
			</tr>
			<tr>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.bid.paused.time']}" /></TD>
				<TD style="width : 25%"><p:inputText id="bidPausedTime"
						value="#{biddingBB.managedBean.bidAction.createdDate}" size="16"
						disabled="true" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"  />
						</p:inputText></TD>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD style="width : 25%"><p:inputText id="remainTime" size="20" disabled="true"
						value="#{biddingBB.managedBean.duration}" /></TD>
			</tr>

			<tr>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.new.bidding.start']}" /></TD>
				<TD style="width : 25%"><p:calendar id="newBidStart" required="true" size="16"
						value="#{biddingBB.managedBean.bidAction.newStartDate}"
						showOn="button" mindate="#{biddingBB.managedBean.mindate}"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}">
						<p:ajax event="dateSelect" process="@this"
							partialSubmit="true"
							listener="#{biddingBB.resumeBidNewStartDateSelectListener}"
							update=":form:newResumeBidEndDate,:form:newBidDuration,:form:newReBidEndDate"></p:ajax>
					</p:calendar></TD>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.new.bidding.end']}" /></TD>
				<TD style="width : 25%"><p:inputText id="newResumeBidEndDate" 
						disabled="true" size="20"
						value="#{biddingBB.managedBean.bidAction.newEndDate}"
						rendered="#{biddingBB.managedBean.bidAction.actionType eq 'R'}" >
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"  />
						</p:inputText>
					<p:calendar id="newReBidEndDate" showOn="button" required="true" mindate="#{biddingBB.managedBean.mindate}" maxdate="#{biddingBB.managedBean.maxdate}"
						rendered="#{biddingBB.managedBean.bidAction.actionType eq 'B'}" size="16"
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						value="#{biddingBB.managedBean.bidAction.newEndDate}">
						<p:ajax event="dateSelect" process="@this"
							partialSubmit="true"
							listener="#{biddingBB.reBidNewEndDateSelectListener}"
							update="newBidDuration" />

					</p:calendar></TD>
			</tr>

			<tr>
				<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.new.bid.duration']}" /></TD>
				<TD style="width : 25%"><p:inputText id="newBidDuration"
						value="#{biddingBB.managedBean.newBidDuration}" size="16"
						disabled="true" /></TD>
				<TD style="width : 25%"></TD>
				<TD style="width : 25%"></TD>
			</tr>

		<tr>
			<TD style="width : 25%"><h:outputLabel value="#{lbl['lbl.sc.notes.to.supplier']}"
					required="true" /></TD>
			<TD style="width : 75%" colspan="3"><p:inputTextarea id="reBidOrResumeSupplierNotes"
					value="#{biddingBB.managedBean.bidAction.remark}" rows="5"
					cols="75" maxLength="200" /></TD>

		</tr>

	</table>

	<div align="right">

		<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-submit"
			actionListener="#{biddingBB.reScheduleOrReBidAction()}"
			process="@this,reBidOrResumeSupplierNotes,newBidStart,newResumeBidEndDate,newReBidEndDate "
			partialSubmit="true" oncomplete="bidRescheduleOrResume.hide();" update="@form"/>

		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			icon="ui-icon-cancel" onclick="bidRescheduleOrResume.hide();"
			immediate="true" />

	</div>
	</p:panel>
</ui:composition>
