<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<div>

		<table>

			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.action']}" /></TD>
				<TD colspan="3"><p:selectOneRadio id="bidAction"
						value="#{biddingBB.managedBean.bidAction.actionType}">

						<f:selectItem itemLabel="Resume Bid" itemValue="R"></f:selectItem>
						<f:selectItem itemLabel="Re-Bidding" itemValue="B"></f:selectItem>

					</p:selectOneRadio></TD>

			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.original.bid.start']}" /></TD>
				<TD><p:inputText id="bidStartTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.startDate}"
						size="20" disabled="true" /></TD>
				<TD><p:outputLabel value="#{lbl['lbl.sc.original.bid.end']}" /></TD>
				<TD><p:inputText id="bidEndTime"
						value="#{biddingBB.managedBean.bidAction.scBidSchedule.endDate}"
						size="20" disabled="true" /></TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.bid.paused.time']}" /></TD>
				<TD><p:inputText id="bidPausedTime"
						value="#{biddingBB.managedBean.bidAction.createdDate}" size="20"
						disabled="true" /></TD>
				<TD><p:outputLabel value="#{lbl['lbl.sc.remaining.time']}" /></TD>
				<TD><p:inputText id="remainTime"
						value="#{biddingBB.managedBean.bidAction.remainingTime}" size="20"
						disabled="true" /></TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.new.bidding.start']}" /></TD>
				<TD><p:inputText id="newBidStart"
						value="#{biddingBB.managedBean.bidAction.newStartDate}" size="20"
						disabled="true" /></TD>
				<TD><p:outputLabel value="#{lbl['lbl.sc.new.bidding.end']}" /></TD>
				<TD><p:inputText id="newBidEnd"
						value="#{biddingBB.managedBean.bidAction.newEndDate}" size="20"
						disabled="true" /></TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.new.bid.duration']}" /></TD>
				<TD><p:inputText id="newBidDuration"
						value="#{biddingBB.managedBean.bidAction.remainingTime}" size="20"
						disabled="true" /></TD>
				<TD></TD>
				<TD></TD>
			</tr>
			<tr>
				<TD><p:outputLabel value="#{lbl['lbl.sc.notes.to.supplier']}" /></TD>
				<TD colspan="3"><p:inputTextarea
						id="reBidOrResumeSupplierNotes"
						value="#{biddingBB.managedBean.bidAction.remark}" size="200"
						maxLength="1000" /></TD>

			</tr>

		</table>

	</div>
	<div>

		<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-ok"
			action="#{biddingBB.reScheduleOrReBidAction()}"
			onComplete="bidRescheduleOrResume.close();" />

		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			icon="ui-icon-cancel" onClick="bidRescheduleOrResume.close();" />
	</div>

</ui:composition>
