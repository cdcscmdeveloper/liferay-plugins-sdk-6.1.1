<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="specGuideLinePopupDlgId" widgetVar="specGuideLineDlgWidget" modal="true"
		dynamic="true"  resizable="false" width="1000px"
		height="500px" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.spec.items.guideline1.pdf']}">
			<p:media value="#{specGuideLineInstructionBB.getSpecGuideLineStreamContent()}"
			width="100%" height="450px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.close']}" process="@this" partialSubmit="true"
						onclick="specGuideLineDlgWidget.hide()" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
