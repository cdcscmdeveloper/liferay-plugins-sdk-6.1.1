<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!--  Supplier Details dialog -->
	<p:dialog id="suppDetailsPopupId" widgetVar="suppDetailsPopup"
		position="center" header="#{lbl['lbl.sc.companyinfo']}" modal="true"
		dynamic="true" styleClass="pop_up_top" width="950"
		resizable="false">

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.business.req.no']}" />
				</td>
				<td><p:inputText size="30"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.regNo}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
				</td>
				<td><p:inputText size="30"
						value="#{supplierDetailBackingBean.managedBean.mofNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ep.no']}" /></td>
				<td><p:inputText size="30"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.epNo}"
						disabled="true" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.gst.register.num']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{supplierDetailBackingBean.managedBean.smGstSupplier.gstRegNo}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.gst.register.num.tooltip']}" id="_supplierGstRegNo"/>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.comp.name']}" /></td>
				<td><p:inputText size="30"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.companyName}"
						disabled="true" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.gst.effective.date']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{supplierDetailBackingBean.managedBean.smGstSupplier.gstEffDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.effective.date.tooltip']}" id="_supplierGstEffDate"/></td>
			</tr>
			<tr>
				<td rowspan="4" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.comp.address']}" /></td>
				<td><p:inputText id="suppAddr1"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}"
						size="30" disabled="true" /></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.gst.declared.date']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{supplierDetailBackingBean.managedBean.smGstSupplier.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.gst.declared.date.tooltip']}" id="_supplierGstDecDate" />
				</td>
			</tr>
			<tr>
				<td><p:inputText id="suppAddr2"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}"
						size="30" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.post.code']}" /></td>
				<td><p:inputText id="suppPostcode"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"
						size="30" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:inputText id="suppAddr3"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}"
						size="30" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.state']}" /></td>
				<td><p:inputText id="suppState"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"
						size="30" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:inputText id="suppAddr4"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}"
						size="30" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.town']}" /></td>
				<td><p:inputText id="suppCity"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}"
						size="30" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.tel.no']}" /></td>
				<td><p:inputText id="suppPhoneNo" size="30"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.phoneFull}"
						disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.fax.no']}" /></td>
				<td><p:inputText id="suppFaxNo" size="30"
						value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.faxFull}"
						disabled="true" /></td>
			</tr>
		</table>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
				process="@this" immediate="true" onclick="suppDetailsPopup.hide()" />
		</div>

	</p:dialog>
</ui:composition>
