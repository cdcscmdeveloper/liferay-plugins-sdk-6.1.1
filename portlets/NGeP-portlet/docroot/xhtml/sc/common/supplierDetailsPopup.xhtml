<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<!--  Supplier Details dialog -->
	<p:dialog id="suppDetailsPopup" widgetVar="suppDetailsPopup" 
		header="#{lbl['lbl.sc.companyinfo']}" 
		styleClass="pop_up_top" width="720" height="260" resizable="false">
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.business.req.no']}"/>
			</td>
			<td colspan="3">
				<p:inputText size="30" value="#{supplierDetailBackingBean.managedBean.smSupplier.regNo}" disabled="true" />
			</td>
		</tr>
		<tr>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}"/></td>
			<td width="32">
				<p:inputText size="30" value="#{supplierDetailBackingBean.managedBean.smSupplier.epNo}"  disabled="true"/>
			</td>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}"/>
			</td>
			<td width="32">
				<p:inputText size="30" value=""  disabled="true"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.comp.name']}"/>
			</td>
			<td colspan="3">
				<p:inputText size="30" value="#{supplierDetailBackingBean.managedBean.smSupplier.companyName}" disabled="true" />
			</td>
		</tr>
		<tr>
			<td rowspan="4" valign="top">
				<p:outputLabel value="#{lbl['lbl.sc.comp.address']}" />
			</td>
			<td width="32%">
				<p:inputText id="suppAddr1" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}"
					size="30" disabled="true" />
			</td>
			</tr>
		<tr>
			<td>
				<p:inputText id="suppAddr2" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}"
					size="30" disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.post.code']}" />
			</td>
			<td>
				<p:inputText id="suppPostcode" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}"
					size="30" disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:inputText id="suppAddr3" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}"
					size="30" disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.state']}" />
			</td>
			<td>
				<p:inputText id="suppState" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}"
					size="30" disabled="true" />
			</td>
		</tr>		
		<tr>
			<td>
				<p:inputText id="suppAddr4" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address4}"
					size="30" disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.town']}" />
			</td>
			<td>
				<p:inputText id="suppCity" 
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}"
					size="30" disabled="true" />
			</td>
		</tr>		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.telephone.no']}" />
			</td>
			<td>
				<p:inputText id="suppPhoneNo" size="30"
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.phoneNo}"
					disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.fax.no']}" />
			</td>
			<td>
				<p:inputText id="suppFaxNo" size="30"
					value="#{supplierDetailBackingBean.managedBean.smSupplier.smAppl.smCompanyBasic.faxNo}"
					disabled="true" />
			</td>
		</tr>
		</table>
	
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.sc.close']}" immediate="true" onclick="suppDetailsPopup.hide()" icon="ui-icon-close" />
		</div>

	</p:dialog> 
</ui:composition>
