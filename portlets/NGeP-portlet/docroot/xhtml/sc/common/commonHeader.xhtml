<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Header" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="Qtn/Tender No." />
			</h:column>
			<h:column>
				<p:inputText value="#{scQt.qtNo}" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Ministry Code/Name" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{scQt.ministryOrgProfile.orgCode} - #{scQt.ministryOrgProfile.orgName}"
					disabled="true" size="35" />

			</h:column>
			<h:column>
				<h:outputLabel value="Status" />
			</h:column>
			<h:column>
				<p:inputText value="#{scQt.pmStatus}" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Department Code/Name" />
			</h:column>
			<h:column>


				<p:inputText
					value="#{scQt.departmentOrgProfile.orgCode} - #{scQt.departmentOrgProfile.orgName}"
					disabled="true" size="35" />

			</h:column>
			<h:column>
				<h:outputLabel value="Created Date" />
			</h:column>
			<h:column>
				<p:inputText value="#{scQt.createdDate}" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Divison Code/Name" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{scQt.pmOrgProfile.orgCode} - #{scQt.pmOrgProfile.orgName}"
					disabled="true" size="35" />

			</h:column>
			   
		</h:panelGrid>
	</p:panel>
</ui:composition>
