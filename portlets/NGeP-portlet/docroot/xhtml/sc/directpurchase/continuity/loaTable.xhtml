<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dataTable var="map" rowIndexVar="index"
		rendered="#{requestNoteBackingBean.managedBean.loaMapList.size() > 0}"
		value="#{requestNoteBackingBean.managedBean.loaMapList}" style="width:100%">
		<p:column headerText="#{lbl['lbl.sc.continuity.no']}" style="text-align:center;">
			<p:outputLabel value="#{index + 1}" style="text-align:center;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.letter.of.acceptance.no']}"
			style="text-align:center;">
			<p:commandLink
				value="#{map['loaNo']}"
				style="float:left;"
				action="#{requestNoteBackingBean.viewLoa(map['loaId'])}"
				immediate="true" />
		</p:column>
		<p:column headerText="#{lbl['lbl.td.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['loaStatus']}" style="float:left;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.contract.no']}"
			style="text-align:center;">
			<p:commandLink value="#{map['contractNo']}" style="float:left;"
				action="#{contractDetailsBackingBean.gotoViewPage(map['contractId'], map['contractVerId'])}"
				immediate="true" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.contract.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['contractStatus']}" style="float:left;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.fulfilment.details.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['fulfilmentStatus']}" style="float:left;" />			
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.agreement.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['agreementStatus']}" style="float:left;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.document.contract.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['docContractStatus']}" style="float:left;" />			
		</p:column>
	</p:dataTable>



</ui:composition>
