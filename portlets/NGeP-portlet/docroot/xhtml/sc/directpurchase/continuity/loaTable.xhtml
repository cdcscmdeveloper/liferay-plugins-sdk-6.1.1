<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <style>
        .aligned-text {
            vertical-align: middle;
        }
        .command-link {
            display: inline-block; /* Ensures the command link is treated like an inline element */
            float:left; /* Aligns the command link with other inline elements */
            color: #009ae5 !important; /* Ensures the link color is applied */
            text-decoration: none; /* Removes the underline */
            padding-top: 6px; /* Adjust top padding to move text down */
        }
        .command-link:hover {
            text-decoration: underline; /* Adds underline on hover */
        }
        .dataTableColumn {
            text-align: center; /* Centers text in columns */
        }
        .dataTableColumn p {
            margin: 0; /* Removes default margin */
        }
    </style>

	<p:dataTable var="map" rowIndexVar="index"
		rendered="#{requestNoteBackingBean.managedBean.loaMapList.size() > 0}"
		value="#{requestNoteBackingBean.managedBean.loaMapList}" style="width:100%" id="loaTableID" rows="10" preserveDataModel="true">
		<ac:paginator for="loaTableID"></ac:paginator>
		<p:column headerText="#{lbl['lbl.sc.continuity.no']}" style="text-align:center;">
			<div align="center"><h:outputText value="#{index + 1}" /></div>
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.letter.of.acceptance.no']}"
			style="text-align:center;">
			<p:commandLink
				value="#{map['loaNo']}"
			    styleClass="command-link"
				action="#{requestNoteBackingBean.viewLoa(map['loaId'])}"
				immediate="true" />
		</p:column>
		<p:column headerText="#{lbl['lbl.td.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['loaStatus']}" style="float:left;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.contract.no']}"
			style="text-align:center;">
			<p:commandLink value="#{map['contractNo']}" styleClass="command-link"
				action="#{contractDetailsBackingBean.gotoViewPage(map['contractId'], map['contractVerId'])}"
				immediate="true" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.contract.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['contractStatus']}" style="float:left;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.fulfilment.details.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['fulfilmentStatus']}" style="float:left;" />			
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.agreement.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['agreementStatus']}" style="float:left;" />
		</p:column>
		<p:column headerText="#{lbl['lbl.sc.document.contract.status']}"
			style="text-align:center;">
			<h:outputText value="#{map['docContractStatus']}" style="float:left;" />			
		</p:column>
	</p:dataTable>



</ui:composition>
