<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dataTable id="requestNoteInfo" value="" var="requestNoteInfo" style="width:75%">
		<p:column style="text-align:center;" headerText="#{lbl['lbl.sc.document.type']}">
			<h:outputText value="#{lbl['lbl.sc.request.note']}" style="float:left;" />						
		</p:column>
		<p:column style="text-align:center;"
			headerText="#{lbl['lbl.sc.document.no']}">
			<p:commandLink
				value="#{requestNoteBackingBean.managedBean.requestNote.requestNoteNo}"
				style="float:left;"
				action="#{requestNoteBackingBean.viewRequestNote(requestNoteBackingBean.managedBean.requestNote.requestNoteId)}"
				immediate="true" />
		</p:column>
		<p:column style="text-align:center;width:40%;white-space:normal;" headerText="#{lbl['lbl.sc.document.title']}">
	        <div style="text-align:left;">
	            <h:outputText value="#{requestNoteBackingBean.managedBean.requestNote.title}"  style="display:block; white-space: normal;"/>
	        </div>
    	</p:column>
		<p:column style="text-align:center;" headerText="#{lbl['lbl.td.status']}">
			<h:outputText value="#{requestNoteBackingBean.managedBean.docStatus}" style="float:left;" />
		</p:column>
	</p:dataTable>
</ui:composition>
