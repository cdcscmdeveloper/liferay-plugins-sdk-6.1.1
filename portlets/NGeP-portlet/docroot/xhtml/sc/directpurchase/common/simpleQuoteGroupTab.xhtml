<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<div align="right" id="div_globe_11">
			<p:commandButton value="#{lbl['lbl.sc.action.back']}" style="float:left;" icon="icon-back"/>
			<p:commandButton id="commond_button_save1" process="@all"
				value="#{lbl['lbl.ss.save']}"
				action="#{simpleQuoteBidBackingBean.saveQuoteBid('saveQuote')}" icon="icon-save"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.ss.submit']}" action="#{simpleQuoteBidBackingBean.submitQuoteBid('saveQuote')}" icon="icon-submit">
			</p:commandButton>
		</div>
		<c:if test="#{simpleQuoteBidBackingBean.managedBean.action eq SourcingConstants.createSimpleQuote}">
			<p:tabView id="dp" orientation="left" widgetVar="dp" dynamic="true" activeIndex="#{simpleQuoteBidBackingBean.managedBean.activeTabIndex}">
				<p:tab title="General" styleClass="noBorders tr,noBorders td">
					<ui:include src="/xhtml/sc/directpurchase/common/general.xhtml" />
				</p:tab>
				<p:tab title="Zone Price" styleClass="noBorders tr,noBorders td">
					<ui:include src="/xhtml/sc/directpurchase/common/zonePrice.xhtml" />
				</p:tab>
				<p:tab title="Supplier Criterial"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/sc/directpurchase/common/supplierCriteria.xhtml" />
				</p:tab>
			</p:tabView>
		</c:if>
		<c:if test="#{simpleQuoteBidBackingBean.managedBean.action eq SourcingConstants.createSimpleBid}">
			<p:tabView id="dp" dynamic="true" orientation="left" widgetVar="dp">
				<p:tab title="GENERAL" styleClass="noBorders tr,noBorders td">
					<ui:include src="/xhtml/sc/directpurchase/common/general.xhtml" />
				</p:tab>
				<p:tab title="SUPPLIER CRITERIA"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/sc/directpurchase/common/supplierCriteria.xhtml" />
				</p:tab>
			</p:tabView>
		</c:if>
	</ui:define>
</ui:composition>
