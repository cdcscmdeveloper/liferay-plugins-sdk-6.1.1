<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<!--  Supplier Details dialog -->
	<p:dialog id="popupSuppDtl" widgetVar="suppDetailsPopup" resizable="false"
		styleClass="pop_up_top" header="SUPPLIER DETAILS" width="720"
		height="320">
		<p:spacer height="5px"/>
		<table style="width: 100%">
			<tr>
				<td style="width: 180px;"><p:outputLabel
						value="#{lbl['lbl.sc.business.req.no']}"/></td>
				<td><p:inputText size="30" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.smSupplier.regNo}" disabled="true" /></td>
				<td></td><td></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.ep.no']}"/></td>
				<td><p:inputText size="30" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.smSupplier.epNo}"  disabled="true"/></td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.mof.no']}"/></td>
				<td><p:inputText size="30" value=""  disabled="true"/></td>
			</tr>
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.comp.name']}"/></td>
				<td><p:inputText size="30" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.smSupplier.companyName}" disabled="true" /></td>
				<td></td><td></td>
			</tr>
		  	<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.comp.address']}" /></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
				<td></td><td></td>
			</tr>
			<tr>
				<td style="width: 154px;"></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.post.code']}" /></td>
				<td><p:inputText size="30" value="" disabled="true"  /></td>
			</tr>
			<tr>
				<td style="width: 154px;"></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.state']}" /></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
			</tr>		
			<tr>
				<td style="width: 154px;"></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.town']}" /></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
			</tr>		
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.tel.no']}" /></td>
				<td><p:inputText size="30" value="" disabled="true"  /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.fax.no']}" /></td>
				<td><p:inputText size="30" value="" disabled="true" /></td>
			</tr>
	  </table>
	  <p:spacer height="15px"></p:spacer>
	  <p:panelGrid styleClass="noBorders tr,noBorders td">
		 <p:row>
			<p:column width="60%" style="text-align:right">
			 <p:commandButton value="#{lbl['lbl.sc.close']}"
					onclick="suppDetailsPopup.hide()"  />
		   </p:column>
		</p:row>
	</p:panelGrid>

	</p:dialog>
     
</ui:composition>
