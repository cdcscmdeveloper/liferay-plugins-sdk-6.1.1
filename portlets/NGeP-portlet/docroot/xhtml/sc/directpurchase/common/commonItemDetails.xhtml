<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:spacer height="10px" />
		<h:panelGrid border="0"  width="100%"
			columns="8" id="rnHearId">
			<h:outputLabel value="#{lbl['lbl.sc.request.note.req.note.no']}" />
			<p:inputText disabled="true" value="#{requestNoteBackingBean.managedBean.requestNote.requestNoteNo}"/>
																		
			<h:outputLabel value="#{lbl['lbl.sc.request.note.ptj.name']}" />
			 <p:inputText disabled="true" value="#{requestNoteBackingBean.managedBean.requestNote.pmOrgProfile.orgName}"  
			          style="width: 200px;"/>
			
			<h:outputLabel value="#{lbl['lbl.sc.request.note.method']}" />
			<p:inputText disabled="true" value="#{requestNoteBackingBean.managedBean.sourceMethod}"/>
	
			<h:outputLabel value="#{lbl['lbl.sc.request.note.status']}" />
			<p:inputText disabled="true" value="#{requestNoteBackingBean.managedBean.requestNoteStatus}" />
		</h:panelGrid>
		<p:spacer height="5px" />

	<p:panel id="ptjNameId">
		<table style="width: 70%">
			<tr>
				<c:if
					test="#{requestNoteBackingBean.managedBean.requestNote.pmOrgProfile.brandNew}">

					<td style="width: 180px;"><p:outputLabel
							value="#{lbl['lbl.sc.price.inquiry.ptj.name']}" /></td>
					<td><p:selectOneMenu
							value="#{requestNoteBackingBean.managedBean.orgProfileId}"
							styleClass="divisionclass"
							style="width: 250px;margin-bottom: 5px;">
							<f:selectItems
								value="#{requestNoteBackingBean.managedBean.userDivisionList}"
								var="pmOrgProfile"
								itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
								itemValue="#{pmOrgProfile.orgProfileId}" />
							<p:ajax event="change" update="rnHearId ,ptjNameId"
								process="@all" listener="#{requestNoteBackingBean.ptjNameEvent}" />
						</p:selectOneMenu></td>
				</c:if>
			</tr>
		</table>
	</p:panel>

	<p:panel id="glb_panel_request_list"
		header="#{lbl['lbl.sc.panel.title.item.detail']}" toggleable="true"
		toggleSpeed="500">
		<h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="requestListDataTable" var="requestNoteDtl"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtls}"
				rows="10"
				selection="#{requestNoteBackingBean.managedBean.selectedRequestNoteDtls}"
				rowKey="#{requestNoteDtl}" rowIndexVar="rowIndex">
				<p:column selectionMode="multiple" style="width:2%" /> 

				<p:column headerText="#{lbl['lbl.sc.request.note.item.name']}">
					<p:commandLink
						value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}"
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="itemDtlPopup.show();" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.proc.type']}">
						<ui:fragment rendered="#{requestNoteDtl.procurementType eq 'E'}">
						<p:commandLink value="Emergency"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />

					</ui:fragment>
					<ui:fragment rendered="#{requestNoteDtl.procurementType eq 'A'}">
						<p:commandLink value="Ad hoc"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />
					</ui:fragment>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.summary']}">
				    <p:commandLink actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="priceTablePopup.show();">
				       <p:graphicImage value="/resources/ep/images/design/document.png"  height="15px" width="15px"/>
				  </p:commandLink> 
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.rec.suppier']}">
					<p:commandLink
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="suppDetailsPopup.show();">
						<h:outputText value="supplier" />
					</p:commandLink>
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.price.offered']}">
					<p:commandLink actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="pricingPopup.show();">
				    <p:graphicImage
						value="/resources/ep/images/design/document.png" height="15px" width="15px"/>
				  </p:commandLink> 
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.fulfill.type']}">
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.reqNoteFulfillmentType ,requestNoteDtl.fulfillmentType)}" disabled="true" />
					
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.loa.prepare.by']}">
					<p:selectOneMenu value="#{requestNoteDtl.assignedUser.userId}">
					   <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>
			
			    <p:column headerText="#{lbl['lbl.sc.request.note.delivery.term']}">
					<p:inputText style="width:20px;" required="false"
						value="#{requestNoteDtl.deliverPeriod}" />
					<p:spacer width="2px;"></p:spacer>
					<p:selectOneMenu id="periodMode"
						value="#{requestNoteDtl.deliverPeriodType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
				</p:column>
		
			</p:dataTable>
		</h:panelGrid>
		<p:panelGrid styleClass="noBorders tr,noBorders td"  id="prepareBy">
			<p:row>
				<p:column>
					<h:outputText value="#{lbl['lbl.sc.request.note.fulfill.type']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.reqNoteFulfillmentType ,requestNoteBackingBean.managedBean.requestNoteDtl.fulfillmentType)}" disabled="true" />
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.prepare.by']}"></h:outputText>
					<p:spacer width="6px;"></p:spacer>
					<p:selectOneMenu 
						value="#{requestNoteBackingBean.managedBean.assignedToUserId}"
						style="width: auto; min-width: 120px;" required="false"
						disabled="false">
						 <f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
					
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText id="periodId" style="width:20px;" required="false"
						value="#{requestNoteBackingBean.managedBean.periodValue}" />
					<p:spacer width="4px;"/>
					<p:selectOneMenu id="periodMode" style="width: auto; min-width: 100px;" required="false"
						value="#{requestNoteBackingBean.managedBean.periodType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
					<p:spacer width="5px;"/>
					<p:commandButton value="#{lbl['lbl.sc.action.apply.btn']}"
						process="@all" icon="ui-icon-submit"
						action="#{requestNoteBackingBean.applyForRequestNote}"
						update="@([id$=requestListDataTable])" />
					
				   </p:column>
				   
				   <p:column width="100%" style="text-align:right">
				     	<p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
					       process="@this,requestListDataTable" partialSubmit="true"
						   action="#{requestNoteBackingBean.deleteRequestNoteDtl}"
						   update="requestListDataTable"
						   icon="ui-icon-delete"/> 
				   	</p:column>
				   
			</p:row>
		</p:panelGrid>
	</p:panel>
	
</ui:composition>
