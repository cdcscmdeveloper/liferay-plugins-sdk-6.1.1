<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <div class="header-info">
	<h:panelGrid border="0" width="100%"
		columns="8" id="rnHeaderId">
		<h:outputLabel value="#{lbl['lbl.sc.request.note.header.rn.no']}" />
		<p:inputText disabled="true"
			value="#{requestNoteBackingBean.managedBean.requestNote.requestNoteNo}" />

		<h:outputLabel value="#{lbl['lbl.sc.request.note.header.ptj.name']}" />
		<p:inputText disabled="true"
			value="#{requestNoteBackingBean.managedBean.requestNote.pmOrgProfile.orgName}" size="45"/>

		<h:outputLabel value="#{lbl['lbl.sc.request.note.header.method']}" />
		<p:inputText disabled="true"
			value="#{requestNoteBackingBean.managedBean.sourceMethod}" />

		<h:outputLabel value="#{lbl['lbl.sc.request.note.header.status']}" />
		<p:inputText disabled="true"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus}" />
	</h:panelGrid>
	</div>
	<p:panel id="glb_panel_request_list"
		header="#{lbl['lbl.sc.panel.title.item.detail']}" toggleable="true"
		toggleSpeed="500">
          <p:outputPanel>	
			<table style="width:0%">
				<tr>
					<ui:fragment
						rendered="#{requestNoteBackingBean.managedBean.orgProfile.brandNew}">
						<td style="width: 95px;"><p:outputLabel
								value="#{lbl['lbl.sc.request.note.ptj.name']}" /></td>
						<td><p:selectOneMenu required="true" id="ptjName"  label="#{lbl['lbl.sc.request.note.ptj.name']}"
								value="#{requestNoteBackingBean.managedBean.orgProfileId}"
								styleClass="divisionclass"
								style="width: 250px;margin-bottom: 5px;">
								<f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
								<f:selectItems
									value="#{requestNoteBackingBean.managedBean.userDivisionList}"
									var="pmOrgProfile"
									itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
									itemValue="#{pmOrgProfile.orgProfileId}" />
								<p:ajax event="change" update="rnHeaderId ,itemDtlId" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.ptjNameEvent}" />
							</p:selectOneMenu>
							</td>
								<td> <p:message id="ptjNameMsg" for="ptjName" display="icon" /> </td>
					</ui:fragment>
				</tr>
			</table>
			</p:outputPanel>
		
		<h:panelGrid width="100%" style="margin-top:10px" id="itemDtlId">
			<p:dataTable id="requestListDataTable" var="requestNoteDtl"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtls}"
				rows="10"
				selection="#{requestNoteBackingBean.managedBean.selectedRequestNoteDtls}"
				rowKey="#{requestNoteDtl}" rowIndexVar="rowIndex">
				<p:column selectionMode="multiple" style="width:2%" /> 

				<p:column headerText="#{lbl['lbl.sc.request.note.item.name']}" style="width:25%;white-space: normal;">
					<p:commandLink
						value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}"
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						update=":form:itemDtlPopup" partialSubmit="true" process="@this"
						oncomplete="itemDtlPopup.show();" />
					  <p:spacer width="2px;"/>
					<p:commandLink partialSubmit="true" 
						actionListener="#{requestNoteBackingBean.showPurchaseInDefault(requestNoteDtl)}"
						rendered="#{!empty requestNoteDtl.scRequestSupplierItem.requestNoteItem.purchaseInDefault}">
						<p:graphicImage value="/resources/ep/images/design/document.png" height="15px" width="15px" />
					</p:commandLink>
				</p:column>
				  
				<p:column headerText="#{lbl['lbl.sc.request.note.proc.type']}" style="width:10%">
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'E'}">
						<p:commandLink value="Emergency" partialSubmit="true"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />

					</ui:fragment>
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'A'}">
						<p:commandLink value="Ad hoc" partialSubmit="true"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />
					</ui:fragment>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.summary']}"  style="width:10%">
				    <p:commandLink partialSubmit="true">
				       <p:graphicImage value="/resources/ep/images/design/document.png"  height="15px" width="15px"/>
				  </p:commandLink> 
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.request.note.rec.suppier']}"  style="width:10%">
				   <p:selectOneMenu value="#{requestNoteDtl.scRequestSupplierItem.smSupplier.supplierId}" 
				        id="recSupplier" label="#{lbl['lbl.sc.request.note.rec.suppier']}"
				        style="width:120px;">  
					   <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteDtl.scRequestSupplierItem.requestNoteItem.supplierItems}" 
							var="supplierItem" itemLabel="#{supplierItem.smSupplier.companyName}"
							itemValue="#{supplierItem.smSupplier.supplierId}"></f:selectItems>
					</p:selectOneMenu>
					<p:message id="recSupplierMsg" for="recSupplier" display="icon" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.price.type']}"
					style="width:10%">
					<p:selectOneMenu id="priceType" style="margin-bottom: 5px;"  rendered="#{!requestNoteBackingBean.managedBean.sourceMethod eq 'Simple Quote'}"	
						required="true" label="#{lbl['lbl.sc.request.note.price.type']}"
						value="#{requestNoteDtl.priceType.parameterId}">
						 <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrices}"
							var="supplierItemPrice"
							itemLabel="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.priceType,supplierItemPrice.priceType.parameterCode)}"
							itemValue="#{supplierItemPrice.priceType.parameterId}" />
					</p:selectOneMenu>
					<p:message id="priceTypeMsg" for="priceType" display="icon" />
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(requestNoteDtl.priceType)}"  size="8" disabled="true" rendered="#{requestNoteBackingBean.managedBean.sourceMethod eq 'Simple Quote'}" />
					
				</p:column>
				
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.price.offered']}"  style="width:10%;text-align:right">
					<ui:fragment
						rendered="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode eq ParameterConst.priceTypeStandard}">
						<h:outputText
							value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.itemPrice}"
							disabled="true" >
					     <f:convertNumber
						        pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				    </h:outputText>
					
					</ui:fragment>
					<ui:fragment
						rendered="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode eq ParameterConst.priceTypePromotion}">
						<h:outputText
							value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.itemPrice}"
							disabled="true" />
					</ui:fragment>

					<ui:fragment
						rendered="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode ne ParameterConst.priceTypeStandard}}">
						<p:commandLink partialSubmit="true"
							update=":form:pricingPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="pricingPopup.show();">
							<p:graphicImage value="/resources/ep/images/design/document.png"
								height="15px" width="15px" />
						</p:commandLink>
					</ui:fragment>
					
					<ui:fragment
						rendered="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType ne ParameterConst.priceTypeStandard}}">
						<p:commandLink partialSubmit="true"
							update=":form:pricingPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="pricingPopup.show();">
							<p:graphicImage value="/resources/ep/images/design/document.png"
								height="15px" width="15px" />
						</p:commandLink>
					</ui:fragment>
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.fulfill.type']}"  style="width:10%">
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.reqNoteFulfillmentType ,requestNoteDtl.fulfillmentType.parameterCode)}" 
					   disabled="true" size="4" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.loa.prepare.by']}"  style="width:10%">
					<p:selectOneMenu value="#{requestNoteDtl.assignedUser.userId}" style="width:120px;" 
					   id="prepareBy" label="#{lbl['lbl.sc.request.note.loa.prepare.by']}" required="true">  
					   <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}" 
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
					   <p:message id="prepareByMsg" for="prepareBy" display="icon" />
				</p:column>
			
			    <p:column headerText="#{lbl['lbl.sc.request.note.delivery.term']}"  style="width:16%">
					<p:inputText style="width:20px;text-align:right;" required="true" 
					   label="#{lbl['lbl.sc.request.note.delivery.term']}"
					   size="2" maxlength="3"
					   id="deliveryTerm" value="#{requestNoteDtl.deliverTerm}"/>
					<p:selectOneMenu  style="width:75px;" rendered="#{!requestNoteBackingBean.managedBean.sourceMethod eq 'Simple Quote'}"
						value="#{requestNoteDtl.deliverTermType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.deliveryTerm,requestNoteDtl.deliverTermType)}" 
					    size="6" disabled="true" rendered="#{requestNoteBackingBean.managedBean.sourceMethod eq 'Simple Quote'}" />
					    <p:message id="deliveryTermByMsg" for="deliveryTerm" display="icon" />
				
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		
		<p:panelGrid styleClass="noBorders tr,noBorders td"  id="prepareBy">
			<p:row>
				<p:column>
					<h:outputText value="#{lbl['lbl.sc.request.note.fulfill.type']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.reqNoteFulfillmentType ,requestNoteBackingBean.managedBean.fulfillmentType)}" disabled="true" />
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.prepare.by']}"></h:outputText>
					<p:spacer width="6px;"></p:spacer>
					<p:selectOneMenu 
						value="#{requestNoteBackingBean.managedBean.assignedToUserId}"
					    disabled="false">
						 <f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
					
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText id="periodId" style="width:20px;" required="false"
						value="#{requestNoteBackingBean.managedBean.periodValue}" />
					<p:spacer width="4px;"/>
					<p:selectOneMenu id="periodMode" 
						value="#{requestNoteBackingBean.managedBean.periodType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
					<p:spacer width="5px;"/>
					<p:commandButton value="#{lbl['lbl.sc.action.apply.btn']}"
						process="@this" icon="ui-icon-submit" partialSubmit="true" immediate="true"
						actionListener="#{requestNoteBackingBean.applyForRequestNote}"
						update="@([id$=requestListDataTable])" />
					
				   </p:column>
				   
				   <p:column width="100%" style="text-align:right">
				     	<p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
					       process="@this,requestListDataTable" partialSubmit="true"
						   action="#{requestNoteBackingBean.deleteRequestNoteDtl}"
						   update="requestListDataTable"
						   icon="ui-icon-delete"/> 
				   	</p:column>
				   
			</p:row>
		</p:panelGrid>
	</p:panel>
	
</ui:composition>
