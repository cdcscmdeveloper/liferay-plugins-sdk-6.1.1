<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="requestNoteItemDetails" toggleable="true" toggleSpeed="500">
	<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.requestnote.instruction']}"/>
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.sc.panel.title.item.detail']}" />
		</f:facet>
        <ac:lovPopup />
	 
	 <h:panelGrid width="100%" style="margin-top:10px" id="itemDtlId">
			<p:dataTable id="requestListDataTable" var="requestNoteDtl" style="white-space: normal;"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtls}"
				rowKey="#{requestNoteDtl}" rowIndexVar="rowIndex">

				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{requestNoteBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@this" update="requestListDataTable"  listener="#{requestNoteBackingBean.selectAll}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{requestNoteDtl.selected}">
						<p:ajax partialSubmit="true" process="@this" update="@this" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.request.note.item.name']}" style="white-space: normal;">
					<p:commandLink
						value="#{requestNoteDtl.requestItem.itemName}"
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						update=":form:itemDtlPopup" partialSubmit="true" process="@this"
						oncomplete="itemDtlPopup.show();" />
					  <p:spacer width="2px;"/>
					<p:commandLink partialSubmit="true" process="@this"
						actionListener="#{requestNoteBackingBean.showPurchaseInDefault(requestNoteDtl)}"
						rendered="#{!empty requestNoteDtl.requestItem.purchaseInDefault}">
							<p:graphicImage value="/css/images/design/ico-view.png" style="vertical-align:middle"></p:graphicImage>
					</p:commandLink>
					  <p:spacer width="2px;"/>
			      <h:panelGroup rendered="#{requestNoteDtl.showPurchaseInquiry}">
					  <p:commandLink partialSubmit="true" process="@this"
						id="prInquiryResponse"
						actionListener="#{requestNoteBackingBean.showPurchaseInquiry(requestNoteDtl)}">
							<p:graphicImage value="/css/images/design/ico-view.png" style="vertical-align:middle"
								title="#{lbl['lbl.sc.pi.summary.tooltip']}" />
						</p:commandLink>
					</h:panelGroup>
					
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.request.note.proc.type']}" style="width:7%; white-space: normal;">
				  <ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'N'}">
						<h:outputText value="#{lbl['lbl.sc.request.note.proc.type.normal']}" />
					</ui:fragment>
					
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'E'}">
						<p:commandLink value="#{lbl['lbl.sc.justification.emergency']}" partialSubmit="true" process="@this"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />

					</ui:fragment>
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'A'}">
						<p:commandLink value="#{lbl['lbl.sc.justification.adhoc']}" partialSubmit="true" process="@this"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />
					</ui:fragment>
					
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'G'}">
					     <h:outputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.procurementType,requestNoteDtl.procurementType.parameterCode)}"/>	
					</ui:fragment>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.summary']}" style="width:6%; white-space: normal;">
				    <p:commandLink immediate="true" ajax="false" partialSubmit="true" process="@this" action="#{requestNoteBackingBean.viewMarketResearch(requestNoteDtl)}"
				    	id="marketSummaryIcon">
				      <p:graphicImage value="/css/images/design/ico-view.png" style="vertical-align:middle"
				      	title="#{lbl[requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SC' ? 'lbl.sc.summary.searchresult.tooltip' : 'lbl.sc.summary.simple.quote.tooltip']}" />
				  </p:commandLink> 
				    <p:spacer width="2px;"/>
				   <h:panelGroup rendered="#{requestNoteDtl.showPurchaseInquiry}">
				   <h:commandLink immediate="true" 
						action="#{requestNoteBackingBean.downloadPurchaseInqReport(requestNoteDtl)}"
						id="prInquirySummaryIcon">
							<p:graphicImage value="/css/images/design/ico-view.png" style="vertical-align:middle"
								title="#{lbl['lbl.sc.summary.item.tooltip']}" />
					</h:commandLink> 
					</h:panelGroup>
				</p:column>
                <p:column style="width:18%;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.rec.suppier']}"/>
					</f:facet>
					
				   <p:panelGrid styleClass="ppPanelGrid"  style="border:hidden;word-spacing: -1px;margin-top: 8px;" >	
					   <p:row>
			             <p:column  styleClass="ppPanelGrid" style="border:none !important;padding-left: 0px;padding-right: 0px;padding-bottom: 0px;width: 130px;">
			               	 <ac:lov id="beforeSave" lovId="V_SUPPLIER_ITEM" size="12"  headerText="#{lbl['lbl.sc.request.note.rec.suppier']}"  readonly="true"
									 postUpdateListener="requestNoteBackingBean.beforeSavePostListener(requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}])"
									 saveObject="requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}].vCmSupplierItem"
								     value="#{requestNoteDtl.vCmSupplierItem.companyName}"
									 update="@form"
									 rendered="#{requestNoteDtl.brandNew and !requestNoteDtl.reRecommend}"  
									 disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteDtl.requestItem.quote.multipleQuote eq 'true' 
									 	and requestNoteDtl.requestItem.quote.zonal eq 'false'
									 	or requestNoteBackingBean.managedBean.viewOnly}" 
									 conditionField="#{requestNoteDtl.conditionField}">					
							  </ac:lov>
							   <ac:lov id="afterSave" lovId="SC_REQUEST_SUPPLIER_ITEM" size="12"  headerText="#{lbl['lbl.sc.request.note.rec.suppier']}"  readonly="true"
									 postUpdateListener="requestNoteBackingBean.afterSavePostListener(requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}])"
									 saveObject="requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}].scRequestSupplierItem"
								     value="#{requestNoteDtl.scRequestSupplierItem.smSupplier.companyName}"
									 update="@form"
									 disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteDtl.requestItem.quote.multipleQuote eq 'true' 
									 	and requestNoteDtl.requestItem.quote.zonal eq 'false'
									 	or requestNoteBackingBean.managedBean.viewOnly}" 
									 conditionField="#{requestNoteDtl.conditionField}"
			                         rendered="#{!requestNoteDtl.brandNew or requestNoteDtl.reRecommend}">    
								</ac:lov>
			             </p:column>
			             <p:column  styleClass="ppPanelGrid" style="border:none !important; padding-left: 2px;padding-right: 0px;vertical-align: super">
						   <p:commandLink action="#{requestNoteBackingBean.supplierViewAction}" partialSubmit="true" process="@this" id="supplierViewId"
						      onstart="blockWidget.show();"
						      oncomplete="blockWidget.hide();"
						      rendered="#{requestNoteDtl.scRequestSupplierItem.smSupplier.supplierId ne null}"
						     update="@([id$=suppDetailsPopup])">
						   <p:graphicImage value="/css/images/design/ico-supplier-details-2.png" style="vertical-align:middle"
						   		title="#{lbl['lbl.sc.supplier.details']}"></p:graphicImage>
					        <f:setPropertyActionListener value="#{requestNoteDtl.scRequestSupplierItem.smSupplier}" target="#{supplierDetailBackingBean.smSupplier}" />
					     </p:commandLink>
					  </p:column>
			           </p:row>
			          </p:panelGrid>
			    </p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.price.offered']}"  style="width:7%;white-space: normal;">
			    <h:panelGroup id="offerPriceId">
						<h:panelGroup
							rendered="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode eq ParameterConst.priceTypeStandard or
						          requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode eq ParameterConst.priceTypePromotion}">
							<h:outputText
								value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.itemPrice}"
								disabled="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</h:outputText>
						</h:panelGroup>

						<h:panelGroup
							rendered="#{requestNoteBackingBean.checkPriceOffered(requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode)}">
							<p:commandLink partialSubmit="true" update=":form:pricingPopup"
								process="@this"
								actionListener="#{requestNoteBackingBean.showPricing(requestNoteDtl)}"
								oncomplete="pricingPopup.show();">
							    <p:graphicImage value="/css/images/design/ico-price.png" style="vertical-align:middle"></p:graphicImage>
							</p:commandLink>
						</h:panelGroup>
					</h:panelGroup>
				</p:column>
				<p:column style="width:12%; white-space: normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.loa.prepare.by']}" />
					</f:facet>
					<h:selectOneMenu value="#{requestNoteDtl.assignedUser.userId}" style="width:115px; margin-top: 8px;" 
					   id="prepareBy" label="#{requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.loa.prepare.by']}" 
					   disabled="#{requestNoteBackingBean.managedBean.viewOnly}"
					   required="#{!requestNoteDtl.selected}">  
					   <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}" 
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
								<p:ajax event="change" update="prepareBy" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.supplierListener(requestNoteDtl.scRequestSupplierItem.supplierId, requestNoteDtl.priceType.parameterId, requestNoteDtl, requestNoteDtl.assignedUser.userId, requestNoteDtl.procTypeCategoryId)}" />
					</h:selectOneMenu>
					   <p:message id="prepareByMsg" for="prepareBy" display="icon" />
				</p:column>
			
			    <p:column style="width: 9%; white-space: normal;">
			        <f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}" />
						<h:panelGroup rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SQ'}">
							<ac:iconTooltip value="#{lbl['lbl.sc.delivery.term.tooltip']}" />
						</h:panelGroup>
						
					</f:facet>
					<p:inputText style="width:15px;margin-top: 8px;margin-right: 1px;" 
					   label="#{requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.delivery.term']}"
					   size="6" maxlength="4"
					   disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteDtl.prodAndServiceFlag}"
					   id="deliveryTerm" value="#{requestNoteDtl.deliverTerm}" required="#{!requestNoteDtl.selected}">
					   	<p:ajax partialSubmit="true" process="@this" update="@this" />
					   </p:inputText>
					   	<p:inputText style="margin-top: 8px;" value="#{requestNoteBackingBean.getParameterDesc(requestNoteDtl.deliverTermType)}" 
					   disabled="true" size="2"  />
					
					  <p:message id="deliveryTermMsg" for="deliveryTerm" display="icon" />
				</p:column>
				
				<p:column style="width:6%; white-space: normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.procurment.type.category']}" />
					</f:facet>
					<h:selectOneMenu id="procTypeCategory"
						value="#{requestNoteDtl.procTypeCategoryId}"
						style="width:120px;margin-top: 8px;" required="true"
						label="#{lbl['lbl.sc.procurment.type.category']}">

						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.procTypeCategories}"
							var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
							itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
							<p:ajax event="change" update="prepareBy" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.supplierListener(requestNoteDtl.scRequestSupplierItem.supplierId, requestNoteDtl.priceType.parameterId, requestNoteDtl, requestNoteDtl.assignedUser.userId, requestNoteDtl.procTypeCategoryId)}" />
					</h:selectOneMenu>
					<p:message id="procTypeCategoryMsg" for="procTypeCategory"
						display="icon" />

				</p:column>
				<p:column style="width:10%; white-space: normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.direct.purchase.title']}" />
					</f:facet>
					 <p:inputTextarea id="procTypeCatTitle" rows="2" 
					    label="#{lbl['lbl.sc.direct.purchase.title']}"
					    cols="6" maxlength="100" 
					    scrollHeight="3" value="#{requestNoteDtl.procurementTitle}" 
					      autoResize="false" style="width:120px;">
					    <p:ajax event="keyup" partialSubmit="true" 
									process="@this"
									listener="#{requestNoteBackingBean.priceTypeChangeListener(requestNoteDtl.priceTypeId, requestNoteDtl)}" />
					 </p:inputTextarea>
					<p:message id="procTypeCatTitleMsg" for="procTypeCatTitle"
						display="icon" />
				</p:column>
				
			</p:dataTable>
		</h:panelGrid>
		
		<ui:param name="isSourcheMethodAsSC"
			value="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SC'}" />
			
		<p:panelGrid styleClass="noBorder" id="prepareBy" style="width:100%"
		    rendered="#{!requestNoteBackingBean.managedBean.viewOnly}">
			<p:row>
				<p:column>
					<h:outputText value="#{lbl['lbl.sc.request.note.loa.prepare.by']}"/>
					<p:spacer width="6px;"/>
					<h:selectOneMenu style="width:115px;" 
						value="#{requestNoteBackingBean.managedBean.assignedToUserId}"
					    disabled="false">
						 <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</h:selectOneMenu>
					
					<p:spacer width="10px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}"  rendered="#{isSourcheMethodAsSC}"/>
					<p:spacer width="6px;"/>
					<p:inputText id="periodId" style="width:20px;text-align:right;margin-top: 7px;"
					    rendered="#{isSourcheMethodAsSC}"
						value="#{requestNoteBackingBean.managedBean.periodValue}" />
					<p:spacer width="6px;"/>
					
					<h:outputText value="#{lbl['lbl.sc.procurment.type.category']}" rendered="#{isSourcheMethodAsSC}"/>
					<p:spacer width="4px;"/>
					<h:selectOneMenu id="procTypeCategoryId"
						value="#{requestNoteBackingBean.managedBean.procTypeCategoryId}"
						style="width:120px;"
						label="#{lbl['lbl.sc.procurment.type.category']}" rendered="#{isSourcheMethodAsSC}">

						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.procTypeCategories}"
							var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
							itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
					</h:selectOneMenu>
					<p:spacer width="6px;"/>
					
					<h:outputText value="#{lbl['lbl.sc.direct.purchase.title']}" rendered="#{isSourcheMethodAsSC}"/>
					<p:spacer width="4px;"/>
					<p:inputText id="procTitle"
					    rendered="#{isSourcheMethodAsSC}"
						value="#{requestNoteBackingBean.managedBean.procTitle}" />
					<p:spacer width="6px;"/>
					
					<p:commandButton value="#{lbl['lbl.btn.apply.to.all']}"
					    partialSubmit="true"  process="@this prepareBy"
						action="#{requestNoteBackingBean.applyForRequestNote}"
						update="@([id$=requestListDataTable])" />
              </p:column>
               
				<p:column width="100%" style="text-align:right">
				 <c:if test="#{isPendingSubmissionStatus or isPendingRevisionStatus}">
					<p:commandButton
						value="#{lbl['lbl.btn.delete']}"
						process="@this" partialSubmit="true" onsuccess="deleteConformDlg.show();"
						update="@([id$=requestListDataTable])" />
				</c:if>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>

	<p:dialog id="i" widgetVar="deleteConformDlg"
		header="#{lbl['lbl.msg.confirm.delete.header']}" resizable="false"
		width="400" height="100" closable="false" modal="true">
		<table>
			<tr>
				<td align="center"><h:graphicImage
						value="/css/images/design/exclamation.png" /> <p:outputLabel
						value="#{lbl['lbl.msg.confirm.delete']}" /></td>
			</tr>
		</table>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.yes']}"
				update="@([id$=requestListDataTable])"
				onsuccess="deleteConformDlg.hide();" partialSubmit="true"
				process="@this"
				actionListener="#{requestNoteBackingBean.deleteRequestNoteDtl}" />

			<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
				process="@this" onclick="deleteConformDlg.hide();" type="button" />
		</div>
	</p:dialog>

</ui:composition>
