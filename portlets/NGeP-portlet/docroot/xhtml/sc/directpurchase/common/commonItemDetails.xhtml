<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:spacer height="10px" />
		<h:panelGrid border="0"  width="100%"
			columns="8">
			<h:outputLabel value="#{lbl['lbl.ss.request.note.req.note.no']}" />
			<p:inputText disabled="true" />
																		
			<h:outputLabel value="#{lbl['lbl.ss.request.note.ptj.name']}" />
			<p:selectOneMenu
					 value="#{requestNoteBackingBean.managedBean.orgProfileId}"
					 styleClass="divisionclass" converter="longConverter"
					 style="width: 220px;">
				    <f:selectItems 
					   value="#{requestNoteBackingBean.managedBean.userDivisionList}"
					   var="pmOrgProfile"
						itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}" />
		    </p:selectOneMenu>
	
			<h:outputLabel value="#{lbl['lbl.ss.request.note.method']}" />
			<p:inputText disabled="true" value="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod}"/>
	
			<h:outputLabel value="#{lbl['lbl.ss.request.note.status']}" />
			<p:inputText disabled="true" value="#{requestNoteBackingBean.currentStatus}" />
		</h:panelGrid>
		
		<p:spacer height="10px" />
		<p:panel id="planId" header="PLANNED INFO." toggleable="true">
		 <p:spacer height="1px" />
			<h:panelGrid border="0"  width="100%"
				columns="4">
				<h:outputLabel value="#{lbl['lbl.ss.request.note.plan.no']}" />
				<p:inputText value="" disabled="true" />
	
				<h:outputLabel value="#{lbl['lbl.ss.request.note.est.amount']}" />
				<p:inputText value="" disabled="true" />
			</h:panelGrid>
		</p:panel>
	
	<p:panel id="glb_panel_request_list"
		header="#{lbl['lbl.sc.panel.title.item.detail']}" toggleable="true"
		toggleSpeed="500">
		<h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="requestListDataTable" var="requestNoteDtl"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtls}"
				rows="10"
				selection="#{requestNoteBackingBean.managedBean.selectedRequestNoteDtls}"
				rowKey="#{requestNoteDtl}" rowIndexVar="rowIndex">
				<p:column selectionMode="multiple" style="width:2%" /> 

				<p:column headerText="#{lbl['lbl.ss.item.detail.item.name']}">
					<p:commandLink
						value="#{requestNoteDtl.scRequestSupplierItem.pricing.cmSupplierItem.cmItem.itemName}"
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="itemDtlPopup.show();" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.purchase.procurement.type']}">
						<ui:fragment rendered="#{requestNoteDtl.procurementType eq 'E'}">
						<p:commandLink value="Emergency"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />

					</ui:fragment>
					<ui:fragment rendered="#{requestNoteDtl.procurementType eq 'A'}">
						<p:commandLink value="Ad hoc"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />
					</ui:fragment>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.ss.item.detail.summary']}">
				    <p:commandLink actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="priceTablePopup.show();">
				       <p:graphicImage value="/resources/ep/images/design/document.png"  height="15px" width="15px"/>
				  </p:commandLink> 
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.item.detail.recommend.supplier']}">
					<p:commandLink
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="suppDetailsPopup.show();">
						<h:outputText value="supplier" />
					</p:commandLink>
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.ss.item.detail.price.offered']}">
					<p:commandLink actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						oncomplete="pricingPopup.show();">
				    <p:graphicImage
						value="/resources/ep/images/design/document.png" height="15px" width="15px"/>
				  </p:commandLink> 
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.ss.item.detail.fulfillment.type']}">
					<p:selectOneMenu value="#{requestNoteDtl.fulfillmentType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.reqNoteFulfillmentType)}"/>
						<p:ajax event="change" update="requestListDataTable" listener="#{requestNoteBackingBean.fulfilmentTypeEvent(requestNoteDtl)}" />
					</p:selectOneMenu>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.ss.item.detail.prepare.by']}">
					<p:selectOneMenu value="#{requestNoteDtl.assignedUser.userId}"
						required="false" disabled="false">
					   <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>
			
			    <p:column headerText="#{lbl['lbl.sc.purchase.deliver.period']}">
					<p:inputText style="width:20px;" required="false"
						value="#{requestNoteDtl.deliverPeriod}" />
					<p:spacer width="2px;"></p:spacer>
					<p:selectOneMenu id="periodMode"
						value="#{requestNoteDtl.deliverPeriodType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
				</p:column>
		
			</p:dataTable>
		</h:panelGrid>
		<p:panelGrid styleClass="noBorders tr,noBorders td"  id="prepareBy">
			<p:row>
				<p:column>
					<h:outputText value="#{lbl['lbl.sc.purchase.fulfillment.type']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:selectOneMenu value="#{requestNoteBackingBean.managedBean.fulfillmentType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.reqNoteFulfillmentType)}"/>
						<p:ajax event="change" update="prepareBy" listener="#{requestNoteBackingBean.fulfilmentTypeEvent(requestNoteBackingBean.managedBean.requestNoteDtl)}" />
					</p:selectOneMenu>
					
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.purchase.prepare']}"></h:outputText>
					<p:spacer width="6px;"></p:spacer>
					<p:selectOneMenu 
						value="#{requestNoteBackingBean.managedBean.assignedToUserId}"
						style="width: auto; min-width: 120px;" required="false"
						disabled="false">
						 <f:selectItem itemLabel="- Select One -" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
					
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.purchase.deliver.period']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText id="periodId" style="width:20px;" required="false"
						value="#{requestNoteBackingBean.managedBean.periodValue}" />
					<p:spacer width="4px;"/>
					<p:selectOneMenu id="periodMode" style="width: auto; min-width: 100px;" required="false"
						value="#{requestNoteBackingBean.managedBean.periodType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
					<p:spacer width="5px;"/>
					<p:commandButton value="#{lbl['lbl.ss.action.apply']}"
						process="@all" icon="ui-icon-submit"
						action="#{requestNoteBackingBean.applyForRequestNote}"
						update="@([id$=requestListDataTable])" />
					
				   </p:column>
				   
				   <p:column width="100%" style="text-align:right">
				     	<p:commandButton process="@all" value="Delete" icon="ui-icon-delete" />
				   	</p:column>
				   
			</p:row>
		</p:panelGrid>
	</p:panel>
</ui:composition>
