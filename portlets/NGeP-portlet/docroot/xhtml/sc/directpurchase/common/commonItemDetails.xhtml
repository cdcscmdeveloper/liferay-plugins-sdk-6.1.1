<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="glb_panel_request_list" toggleable="true" toggleSpeed="500">
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.requestnote.instruction']}"/>
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.sc.panel.title.item.detail']}" />
		</f:facet>
        <ac:lovPopup />
		<h:panelGrid width="100%" style="margin-top:10px" id="itemDtlId">
			<p:dataTable id="requestListDataTable" var="requestNoteDtl" style="white-space: normal;"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtls}"
				rowKey="#{requestNoteDtl}" rowIndexVar="rowIndex">

				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{requestNoteBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@this" update="requestListDataTable"  listener="#{requestNoteBackingBean.selectAll}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{requestNoteDtl.selected}">
						<p:ajax partialSubmit="true" process="@this" update="@this" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.request.note.item.name']}" style="white-space: normal;">
					<p:commandLink
						value="#{requestNoteDtl.requestItem.itemName}"
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						update=":form:itemDtlPopup" partialSubmit="true" process="@this"
						oncomplete="itemDtlPopup.show();" />
					  <p:spacer width="2px;"/>
					<p:commandLink partialSubmit="true" process="@this"
						actionListener="#{requestNoteBackingBean.showPurchaseInDefault(requestNoteDtl)}"
						rendered="#{!empty requestNoteDtl.requestItem.purchaseInDefault}">
							<p:graphicImage library="ep/images/design" name="evaluate.png"
							style="vertical-align:middle" />
					</p:commandLink>
					  <p:spacer width="2px;"/>
			      <h:panelGroup rendered="#{requestNoteDtl.showPurchaseInquiry}">
					  <p:commandLink partialSubmit="true" process="@this"
						id="prInquiryResponse"
						actionListener="#{requestNoteBackingBean.showPurchaseInquiry(requestNoteDtl)}">
							<p:graphicImage library="ep/images/design" name="evaluate.png"
							style="vertical-align:middle" />
						<p:tooltip for="prInquiryResponse">
							<h:outputText value="#{lbl['lbl.sc.pi.summary.tooltip']}" escape="false" />
						</p:tooltip>
					   </p:commandLink>
					</h:panelGroup>
					
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.uom']}" style="width:6%; white-space: normal;">
					#{requestNoteDtl.requestItem.uom.uomName}
				</p:column>
				  
				<p:column headerText="#{lbl['lbl.sc.request.note.proc.type']}" style="width:7%; white-space: normal;">
				<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'N'}">
						<h:outputText value="#{lbl['lbl.sc.request.note.proc.type.normal']}" />
					</ui:fragment>
					
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'E'}">
						<p:commandLink value="#{lbl['lbl.sc.justification.emergency']}" partialSubmit="true" process="@this"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />

					</ui:fragment>
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'A'}">
						<p:commandLink value="#{lbl['lbl.sc.justification.adhoc']}" partialSubmit="true" process="@this"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />
					</ui:fragment>
					
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'G'}">
					     <h:outputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.procurementType,requestNoteDtl.procurementType.parameterCode)}"/>	
					</ui:fragment>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.request.note.summary']}" style="width:6%; white-space: normal;">
				    <h:commandLink immediate="true"  action="#{requestNoteBackingBean.viewMarketResearch(requestNoteDtl)}"
				    	id="marketSummaryIcon">
				      	<p:graphicImage library="ep/images/design" name="evaluate.png"
							style="vertical-align:middle" />
						<p:tooltip for="marketSummaryIcon">
							<h:outputText rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SC'}" 
							value="#{lbl['lbl.sc.summary.searchresult.tooltip']}" escape="false" />
							<h:outputText rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SQ'}" 
							value="#{lbl['lbl.sc.summary.simple.quote.tooltip']}" escape="false" />
						</p:tooltip>
				  </h:commandLink> 
				    <p:spacer width="2px;"/>
				   <h:panelGroup rendered="#{requestNoteDtl.showPurchaseInquiry}">
				   <h:commandLink immediate="true" 
						action="#{requestNoteBackingBean.downloadPurchaseInqReport(requestNoteDtl)}"
						id="prInquirySummaryIcon">
							<p:graphicImage library="ep/images/design" name="evaluate.png"
							style="vertical-align:middle" />
						<p:tooltip for="prInquirySummaryIcon">
							<h:outputText value="#{lbl['lbl.sc.summary.item.tooltip']}" escape="false" />
						</p:tooltip>
					</h:commandLink> 
					</h:panelGroup>
				</p:column>
                <p:column style="width:20%;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.rec.suppier']}"/>
					</f:facet>
					
				   <p:panelGrid styleClass="ppPanelGrid"  style="border:hidden;margin-right: -12px;">	
					   <p:row>
			             <p:column  styleClass="ppPanelGrid" style="border:none !important;width:10%;padding-left: 0px;">
			               	 <ac:lov id="beforeSave" lovId="V_SUPPLIER_ITEM" size="11"  headerText="#{lbl['lbl.sc.request.note.rec.suppier']}"  readonly="true"
									 postUpdateListener="requestNoteBackingBean.beforeSavePostListener(requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}])"
									 saveObject="requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}].vCmSupplierItem"
								     value="#{requestNoteDtl.vCmSupplierItem.companyName}"
									 update="@form"
									 rendered="#{requestNoteDtl.brandNew}"  
									 disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteDtl.requestItem.quote.multipleQuote eq 'true' or requestNoteBackingBean.managedBean.viewOnly}" 
									 conditionField="#{requestNoteDtl.conditionField}">					
							  </ac:lov>
							   <ac:lov id="afterSave" lovId="SC_REQUEST_SUPPLIER_ITEM" size="11"  headerText="#{lbl['lbl.sc.request.note.rec.suppier']}"  readonly="true"
									 postUpdateListener="requestNoteBackingBean.afterSavePostListener(requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}])"
									 saveObject="requestNoteBackingBean.managedBean.requestNoteDtls[#{rowIndex}].scRequestSupplierItem"
								     value="#{requestNoteDtl.scRequestSupplierItem.smSupplier.companyName}"
									 update="@form"
									 disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteDtl.requestItem.quote.multipleQuote eq 'true' or requestNoteBackingBean.managedBean.viewOnly}" 
									 conditionField="requestNoteItem.requestNoteItemId^#{requestNoteDtl.requestItem.requestNoteItemId}"
			                         rendered="#{!requestNoteDtl.brandNew}">    
								</ac:lov>
			             </p:column>
			                <p:column  styleClass="ppPanelGrid" style="vertical-align: top;padding-left: 4px;text-align: left; border:none !important;">
			                 <p:commandLink action="#{requestNoteBackingBean.supplierViewAction}" partialSubmit="true" process="@this" id="supplierViewId"
								    onstart="blockWidget.show();"
									oncomplete="blockWidget.hide();"
								    rendered="#{requestNoteDtl.vCmSupplierItem ne null}"
									update="@([id$=suppDetailsPopup])">
									<p:graphicImage library="ep/images/design" name="evaluate.png"
										style="vertical-align:middle" />
										<f:setPropertyActionListener value="#{requestNoteDtl.scRequestSupplierItem.smSupplier}" target="#{supplierDetailBackingBean.smSupplier}" />
								</p:commandLink>
			             </p:column>
			           </p:row>
			          </p:panelGrid>
			    </p:column>
			 
				<p:column style="width:11%;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.price.type']}" />
					</f:facet>
				
					<h:selectOneMenu id="priceType" style="width:100px;"
						required="#{!requestNoteDtl.selected}" 
						disabled="#{requestNoteBackingBean.managedBean.viewOnly}"
						label="#{requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.price.type']}"
						value="#{requestNoteDtl.priceType.parameterId}">
						 <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems 
							value="#{requestNoteBackingBean.getPriceTypeByPrice(requestNoteDtl.scRequestSupplierItem.supplierItemPrices)}"
							var="pmParameter"
							itemLabel="#{requestNoteBackingBean.getParameterDesc(pmParameter)}"
							itemValue="#{pmParameter.parameterId}" />
							
							<p:ajax event="change" update="offerPriceId" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.supplierListener(requestNoteDtl.scRequestSupplierItem.supplierId, requestNoteDtl.priceType.parameterId, requestNoteDtl, requestNoteDtl.assignedUser.userId ,requestNoteDtl.deliverTermTypeId)}" />
					</h:selectOneMenu>
					<p:message id="priceTypeMsg" for="priceType" display="icon" />
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.price.offered']}"  style="width:7%;white-space: normal;">
			    <h:panelGroup id="offerPriceId">
						<h:panelGroup
							rendered="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode eq ParameterConst.priceTypeStandard or
						          requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode eq ParameterConst.priceTypePromotion}">
							<h:outputText
								value="#{requestNoteDtl.scRequestSupplierItem.supplierItemPrice.itemPrice}"
								disabled="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</h:outputText>
						</h:panelGroup>

						<h:panelGroup
							rendered="#{requestNoteBackingBean.checkPriceOffered(requestNoteDtl.scRequestSupplierItem.supplierItemPrice.priceType.parameterCode)}">
							<p:commandLink partialSubmit="true" update=":form:pricingPopup"
								process="@this"
								actionListener="#{requestNoteBackingBean.showPricing(requestNoteDtl)}"
								oncomplete="pricingPopup.show();">
							   <p:graphicImage library="ep/images/design" name="evaluate.png"
							    style="vertical-align:middle" />
							</p:commandLink>
						</h:panelGroup>
					</h:panelGroup>
				</p:column>
				<p:column  style="width:6%; white-space: normal;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.request.note.fulfill.type']}"/>
						<ac:iconTooltip value="#{lbl['lbl.sc.fulfilment.tooltip']}" />
					</f:facet>
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.fulfilmentType ,requestNoteDtl.fulfilmentType.parameterCode)}" 
					   disabled="true" size="8" style="margin-top: 8px;"  />
				</p:column>
				
				<p:column style="width:12%; white-space: normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.loa.prepare.by']}" />
					</f:facet>
					<h:selectOneMenu value="#{requestNoteDtl.assignedUser.userId}" style="width:115px;" 
					   id="prepareBy" label="#{requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.loa.prepare.by']}" 
					   disabled="#{requestNoteBackingBean.managedBean.viewOnly}"
					   required="#{!requestNoteDtl.selected}">  
					   <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}" 
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
								<p:ajax event="change" update="prepareBy" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.supplierListener(requestNoteDtl.scRequestSupplierItem.supplierId, requestNoteDtl.priceType.parameterId, requestNoteDtl, requestNoteDtl.assignedUser.userId ,requestNoteDtl.deliverTermTypeId)}" />
					</h:selectOneMenu>
					   <p:message id="prepareByMsg" for="prepareBy" display="icon" />
				</p:column>
			
			    <p:column style="width:11%; white-space: normal;">
			        <f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}" />
						<h:panelGroup rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SQ'}">
							<ac:iconTooltip value="#{lbl['lbl.sc.delivery.term.tooltip']}" />
						</h:panelGroup>
						
					</f:facet>
					<p:inputText style="width:25px;text-align:right;margin-top: 8px;margin-right: 1px;" 
					   label="#{requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.delivery.term']}"
					   size="6" maxlength="4"
					   disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteBackingBean.checkServiceOrProduct(requestNoteDtl)}"
					   id="deliveryTerm" value="#{requestNoteDtl.deliverTerm}" required="#{!requestNoteDtl.selected}">
					   	<p:ajax partialSubmit="true" process="@this" update="@this" />
					   </p:inputText>
					<h:selectOneMenu  style="width:75px;margin-top: 8px;" required="#{!requestNoteDtl.selected}" id="deliveryType" 
					    label="#{requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.delivery.term.type']}"
					    disabled="#{requestNoteDtl.requestItem.quote ne null and requestNoteBackingBean.checkServiceOrProduct(requestNoteDtl)}"
						value="#{requestNoteDtl.deliverTermTypeId}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownValues(ParameterTypeConst.deliveryTerm)}"/>
						
						<p:ajax event="change" update="prepareBy" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.supplierListener(requestNoteDtl.scRequestSupplierItem.supplierId, requestNoteDtl.priceType.parameterId, requestNoteDtl, requestNoteDtl.assignedUser.userId ,requestNoteDtl.deliverTermTypeId)}" />
					</h:selectOneMenu>
					  <p:message id="deliveryTermMsg" for="deliveryTerm" display="icon" />
					  <p:message id="deliveryTypeMsg" for="deliveryType" display="icon" />
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		
		<p:panelGrid styleClass="noBorders tr,noBorders td"  id="prepareBy"  rendered="#{!requestNoteBackingBean.managedBean.viewOnly}">
			<p:row>
				<p:column>
					<h:outputText value="#{lbl['lbl.sc.request.note.loa.prepare.by']}"/>
					<p:spacer width="6px;"/>
					<h:selectOneMenu style="width:155px;" 
						value="#{requestNoteBackingBean.managedBean.assignedToUserId}"
					    disabled="false">
						 <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</h:selectOneMenu>
					
					<p:spacer width="10px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}"  rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SC'}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText id="periodId" style="width:20px;text-align:right;margin-top: 7px;" required="false"
					    rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SC'}"
						value="#{requestNoteBackingBean.managedBean.periodValue}" />
					<p:spacer width="4px;"/>
					<h:selectOneMenu id="periodMode" 
					    rendered="#{requestNoteBackingBean.managedBean.requestNote.sourceMethod eq 'SC'}"
						value="#{requestNoteBackingBean.managedBean.periodType}"
						style="width:120px;">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</h:selectOneMenu>
					<p:spacer width="5px;"/>
					<p:commandButton value="#{lbl['lbl.sc.action.apply.btn']}"
					    partialSubmit="true"  process="@this prepareBy"
						action="#{requestNoteBackingBean.applyForRequestNote}"
						update="@([id$=requestListDataTable])" />
              </p:column>
               
				<p:column width="100%" style="text-align:right">
				 <c:if test="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingSubmission or requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingRevision}">
					<p:commandButton
						value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
						process="@this" partialSubmit="true" onsuccess="sqConformDlg.show();"
						update="@([id$=requestListDataTable])" />
				</c:if>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
	
	<p:confirmDialog message="#{lbl['lbl.sc.request.note.delete.conform.msg']}"
			id="promptId" width="350px" height="50px" widgetVar="sqConformDlg"
			severity="alert" closable="false"
			header="#{lbl['lbl.sc.request.note.delete.conform.dlg.header']}">

			<p:blockUI block="conformDlgId" widgetVar="promptWidget"
				id="conformDlg">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>

			<p:panel id="conformDlgId">
				<p:panelGrid styleClass="noBorders tr,noBorders td">
					<p:row>
						<p:column width="100%" style="text-align:right">
							<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@([id$=requestListDataTable])" 
								onstart="promptWidget.show()" onsuccess="sqConformDlg.hide();" partialSubmit="true" process="@this"
								oncomplete="promptWidget.hide();"
								actionListener="#{requestNoteBackingBean.deleteRequestNoteDtl}" />
						 
						  <p:commandButton value="#{lbl['lbl.btn.no']}" 
								partialSubmit="true" process="@this"
								onclick="sqConformDlg.hide();" type="button" />
								
						</p:column>
					</p:row>
				</p:panelGrid>
			</p:panel>
		</p:confirmDialog>
	
</ui:composition>
