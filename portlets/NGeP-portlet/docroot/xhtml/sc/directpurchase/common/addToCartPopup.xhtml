<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:dialog id="addToCartPopup" widgetVar="addToCartPopup"
		header="ADD TO CART" width="520 " height="400" resizable="false" dynamic="true" modal="true">
		<p:spacer height="5px"/>
		<p:panel id="addToCartId">
		<table style="width: 500px">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="64"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
				<td><p:inputText disabled="true"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.extensionCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.itemName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea readonly="true" disabled="true" rows="3"
						cols="65" style="margin-bottom: 5px;"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.itemDesc}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td><p:inputText disabled="true"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.pmUom.uomName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.min.qty']}" /></td>
				<td><p:inputText disabled="true"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.minOrder}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.order.qty']}" /></td>
				<td><p:inputText disabled="true"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.quantity}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.price.type']}" /></td>
				<td><p:selectOneMenu  id="priceType" style="margin-bottom: 5px;" 
						value="#{requestNoteBackingBean.managedBean.priceTypeCode}">
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.priceTypes}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" /></td>
				<td><p:selectOneMenu style="margin-bottom: 5px;" id="procType"  
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.procurementType}">
						<f:selectItems
							value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.procurementType)}" />
							<p:ajax event="change" update="justLabelId, justValueId" 
							listener="#{requestNoteBackingBean.procurementTypeEvent}" process="@this" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td>
				   <h:panelGroup id="justLabelId">
				        <p:outputLabel value="#{lbl['lbl.sc.justification']}" rendered="#{requestNoteBackingBean.managedBean.procTypeOption}"/>
				   </h:panelGroup>
				</td>
				<td>
				  <h:panelGroup id="justValueId">
				     <p:selectOneMenu  rendered="#{requestNoteBackingBean.managedBean.procTypeOption}"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.justificationType}">
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.justDropdown}" />
						<p:ajax event="change" update="justValueId, otherId" 
							listener="#{requestNoteBackingBean.justificationTypeEvent}" process="@this" />
					</p:selectOneMenu> 
					    <p:spacer width="5px" />
					<p:inputText size="40" id="otherId" rendered="#{requestNoteBackingBean.managedBean.justTypeOption}"/>
				  </h:panelGroup>	
			   </td>
			</tr>

		 </table>
	  </p:panel>
        <p:spacer height="15px"/>
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="60%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.ok']}"
						action="#{requestNoteBackingBean.addToRequestNote(requestNoteBackingBean.managedBean.sourceMethod)}"
						oncomplete="addToCartPopup.hide();" icon="ui-icon-submit" />
					<p:commandButton value="#{lbl['lbl.sc.cancel']}"
						onclick="addToCartPopup.hide()" icon="ui-icon-cancel" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
