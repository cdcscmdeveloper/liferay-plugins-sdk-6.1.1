<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="addToCartPopup" widgetVar="addToCartPopup"
		header="#{lbl['lbl.sc.add.to.cart']}" width="580 " height="480" resizable="true"
		closable="false"
		 modal="true" dynamic="true">
		<p:panel id="addToCartId">
		<p:messages id="cartmessages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
					<td><p:inputText disabled="true" size="46"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.smSupplier.companyName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
					<td><p:inputText disabled="true" size="46"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.extensionCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
					<td><p:inputText disabled="true" size="46"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: top; text-align: left;"><p:outputLabel
							value="#{lbl['lbl.sc.desc']}" /></td>
					<td><p:inputTextarea readonly="true" disabled="true" rows="2"
							cols="35" style="margin-bottom: 5px; width: 300px;"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
					<td><p:inputText disabled="true" size="25"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.min.qty']}" /></td>
					<td><p:inputText disabled="true" size="25"
							styleClass="ppRightBtn"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.minOrder}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.minOrder)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.order.qty']}" /></td>
					<td><p:inputText size="25" styleClass="ppRightBtn"  label="#{lbl['lbl.sc.order.qty']}" maxlength="14" id="oderQtyId" 
					       validatorMessage="Order Qty : must be a decimal number between 0.0 and 9999999999.999"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.quantity}">
						</p:inputText><p:message id="oderQtyMsg" for="oderQtyId" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.price.type']}" /> 
					 <p:outputLabel value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="priceType"
										style="margin-bottom: 5px; width: 185px;"
										label="#{lbl['lbl.sc.price.type']}"
										required="#{requestNoteBackingBean.managedBean.required}"
										value="#{requestNoteBackingBean.managedBean.priceType}">
										<f:selectItems
											value="#{requestNoteBackingBean.managedBean.priceTypes}" />
									</p:selectOneMenu></td>
								<td><p:message id="priceTypeMsg" for="priceType"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}"  /> 
					   <p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio style="margin-bottom: 5px;"
							id="procType" label="#{lbl['lbl.sc.procurement.type']}"
							value="#{requestNoteBackingBean.managedBean.procurementType}"
							required="#{requestNoteBackingBean.managedBean.required}">
							<f:selectItems
								value="#{requestNoteBackingBean.managedBean.procurementTypes}" />
							<p:ajax event="change" update="justLabel ,justValue ,justRmksLabel,justRmksValue"
								listener="#{requestNoteBackingBean.procurementTypeEvent}"
								process="@this" />
						</p:selectOneRadio> <p:message id="procTypeMsg" for="procType" display="icon" /></td>
				</tr>
				
				<tr>
					<td><h:panelGroup id="justLabel"> <p:outputLabel value="#{lbl['lbl.sc.justification']}" rendered="#{requestNoteBackingBean.managedBean.procTypeOption}" /> </h:panelGroup></td>
					<td><h:panelGroup id="justValue"><p:selectOneMenu style="margin-bottom: 5px; width: 185px;" rendered="#{requestNoteBackingBean.managedBean.procTypeOption}"
							id="justificationId" label="#{lbl['lbl.sc.justification']}"
							required="#{requestNoteBackingBean.managedBean.justRequired}"
							value="#{requestNoteBackingBean.managedBean.justificationType}">
							<f:selectItems
								value="#{requestNoteBackingBean.managedBean.justDropdown}" />
						</p:selectOneMenu> <p:message id="justTypeMsg" for="justificationId" display="icon" /></h:panelGroup></td>
				</tr>
				<tr>
					<td style="vertical-align: top;padding-right: 1px;text-align: right;"><h:panelGroup id="justRmksLabel"><p:outputLabel value="#{lbl['lbl.sc.just.rmks']}" rendered="#{requestNoteBackingBean.managedBean.procTypeOption}" /></h:panelGroup></td>
					<td><h:panelGroup id="justRmksValue"><p:inputTextarea id="justificationRmk" rendered="#{requestNoteBackingBean.managedBean.procTypeOption}"
							label="#{lbl['lbl.sc.just.rmks']}" maxlength="100"
							required="#{requestNoteBackingBean.managedBean.justRequired}"
							value="#{requestNoteBackingBean.managedBean.justification}"
							rows="2" cols="65" style="margin-bottom: 5px; width: 300px;" /> <p:message
							id="justRmksMsg" for="justificationRmk" display="icon" /></h:panelGroup></td>
				</tr>
			</table>
			
	
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="60%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.common.proceed.btn']}" process="@this addToCartId ,addToCartPopup"
						action="#{requestNoteBackingBean.addToRequestNote(requestNoteBackingBean.managedBean.addToCartFlag)}" 
						 onstart="popupBlockWidget.show();" oncomplete="popupBlockWidget.hide();"
						icon="ui-icon-submit" update="addToCartId ,@([id$=supplierItemViewID])"/>
						
					<p:commandButton value="#{lbl['lbl.sc.cancel']}" process="@this"
						action="#{requestNoteBackingBean.closeListener}" icon="ui-icon-cancel" oncomplete="addToCartPopup.hide();"
						partialSubmit="true" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
		  <p:ajax event="close" listener="#{requestNoteBackingBean.closeListener}" update="addToCartId"/>
	   <p:blockUI block="addToCartId" widgetVar="popupBlockWidget">
		 <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	  </p:blockUI>
	
	</p:dialog>
</ui:composition>
