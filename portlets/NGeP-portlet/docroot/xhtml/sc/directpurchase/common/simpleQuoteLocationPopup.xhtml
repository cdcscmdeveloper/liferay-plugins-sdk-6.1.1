<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog header="ZoneLocation" widgetVar="locationPopup" modal="true"
		width="520" height="480">
		<p:panel id="locPopupPanel" header="DELIVERY LOCATION">
			<table styleClass="noBorders tr,noBorders td" >
				<TR>
					<TD width="80%">
					<div style="height: 300px; overflow-y: scroll;">
						<p:tree id="treeZoneLocationPopup"
							value="#{simpleQuoteBackingBean.managedBean.rootLocationTree}"
							var="location"
							selection="#{simpleQuoteBackingBean.managedBean.selectedLocNodes}"
							selectionMode="checkbox" >
							 <p:treeNode type="state">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
							
						</p:tree>
						</div>
					</TD>
				</TR>
			</table>
		</p:panel>
		<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
				style="float:right;" onclick="locationPopup.hide();" process="@all"
				update="@this, locationDataTable,locPopupPanel" partialSubmit="true"
				actionListener="#{simpleQuoteBackingBean.updateLocation}">
	   </p:commandButton>
				&#160;&#160;
		
		
		<p:commandButton value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}" style="float:right;"
			onclick="locationPopup.hide();"></p:commandButton>
	</p:dialog>
</ui:composition>
