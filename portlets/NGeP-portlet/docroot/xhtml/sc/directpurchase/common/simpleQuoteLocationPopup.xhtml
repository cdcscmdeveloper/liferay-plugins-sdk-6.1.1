<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog header="DELIVERY LOCATION" widgetVar="locationPopup" modal="true" resizable="false" 
		width="510" height="460">
		<p:panel id="locPopupPanel">
			<table styleClass="noBorders tr,noBorders td" >
				<TR>
					<TD width="80%">
					<div style="height: 300px; overflow-y: scroll;">
							<p:tree id="treeZoneLocationPopup"
								value="#{simpleQuoteBackingBean.managedBean.rootLocationTree}"
								var="location"
								selection="#{simpleQuoteBackingBean.managedBean.selectedLocNodes}"
								selectionMode="checkbox">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</div>
					</TD>
				</TR>
			</table>
		</p:panel>
		
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="60%" style="text-align:right">
					<p:commandButton
						value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"  onclick="locationPopup.hide();"
						process="@all" update="@this, locationDataTable,locPopupPanel"
						partialSubmit="true" icon="ui-icon-submit"
						actionListener="#{simpleQuoteBackingBean.updateLocation}" />
						<p:commandButton
							value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}" icon="ui-icon-cancel"
							onclick="locationPopup.hide();" />
							
					</p:column>
			</p:row>
		</p:panelGrid>
		
	</p:dialog>
</ui:composition>
