<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog header="#{lbl['lbl.sc.sq.supplier.locality']}"
		widgetVar="locationPopup" modal="true" resizable="false"
		closable="false" width="380" height="400">
		<p:messages id="LocMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		<p:panel id="locPopupPanel">
			<table styleClass="noBorders tr,noBorders td" width="100%">
				<TR>
					<TD width="15%"></TD>
					<TD width="85%">
						<div style="height: 300px; overflow-y: scroll; width: 322px;">
							<p:tree id="treeZoneLocationPopup"
								value="#{simpleQuoteBackingBean.managedBean.rootLocationTree}"
								var="location"
								selection="#{simpleQuoteBackingBean.managedBean.selectedLocNodes}"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{simpleQuoteBackingBean.selectLocationTreeNode}" />
								<p:ajax event="unselect"
									listener="#{simpleQuoteBackingBean.unSelectLocationTreeNode}" />
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</div>
					</TD>
				</TR>
			</table>
		</p:panel>

		<p:spacer height="3px" />
		<div class="ppRightBtn" style="width: 100%">
			<p:commandButton id="okBtn" value="#{lbl['lbl.btn.ok']}"
				process="@all" update="@form" partialSubmit="true"
				actionListener="#{simpleQuoteBackingBean.updateLocation}" />

			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				onclick="locationPopup.hide();" />
		</div>

		<p:defaultCommand target="okBtn"></p:defaultCommand>
	</p:dialog>
</ui:composition>
