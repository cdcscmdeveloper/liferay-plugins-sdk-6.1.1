<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<c:if test="#{requestNoteBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.request.note']}" />
		</c:if>
		<p:messages showDetail="true"
			autoUpdate="#{requestNoteBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" showSummary="false" />

		<ui:param name="isPendingSubmissionStatus"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingSubmission}" />
		<ui:param name="isPendingRevisionStatus"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingRevision}" />
		<ui:param name="isPendingApprovalStatus"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingApproval}" />

		<p:outputPanel id="requestNoteId">
			<ac:gpkiPopup
				textBeforeSign="#{requestNoteBackingBean.textBeforeSign}"
				postSignAction="#{requestNoteBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}"
				postCancelAction="#{requestNoteBackingBean.gpkiCancelAction}" />

			<ui:include
				src="/xhtml/sc/directpurchase/common/commonReqNoteButtons.xhtml" />
			<ui:include
				src="/xhtml/sc/directpurchase/common/commonRequestNoteHeader.xhtml" />
			<table style="border: 0px; align: center;" width="100%">
				<tr>
					<td>
					<td width="100%" align="left" valign="top"><ui:include
							src="/xhtml/sc/directpurchase/common/commonItemDetails.xhtml" />
						<ui:include
							src="/xhtml/sc/directpurchase/common/commonApprovalDetails.xhtml" />
						<ui:include
							src="/xhtml/sc/directpurchase/common/commonRemarks.xhtml" /></td>
					</td>
				</tr>
			</table>

			<!-- Item Details PopUp -->
			<ui:include
				src="/xhtml/sc/directpurchase/common/itemDetailPopup.xhtml" />
			<!-- Justification PopUp -->
			<ui:include
				src="/xhtml/sc/directpurchase/common/justificationPopup.xhtml" />
			<!-- Pricing PopUp -->
			<ui:include src="/xhtml/sc/directpurchase/common/pricingPopup.xhtml" />
			<!-- Supplier Details PopUp -->
			<ui:include src="/xhtml/sc/common/supplierDetailsPopup.xhtml" />
		</p:outputPanel>
	</ui:define>

</ui:composition>
