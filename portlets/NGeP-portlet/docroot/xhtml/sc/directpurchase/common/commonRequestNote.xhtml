<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	 <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" showSummary="false" />
	  <c:if test="#{requestNoteBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.request.note']}"/>
	  </c:if>
	<p:panel id="requestNoteId">
			 <ui:include
				src="/xhtml/sc/directpurchase/common/commonReqNoteButtons.xhtml" /> 
			 <ui:include
				src="/xhtml/sc/directpurchase/common/commonRequestNoteHeader.xhtml" /> 
			<table style="border: 0px; align: center;" width="100%">
				<tr>
					<td>
					<td width="100%" align="left" valign="top">
						<ui:include
							src="/xhtml/sc/directpurchase/common/commonItemDetails.xhtml" />
						<ui:include
							src="/xhtml/sc/directpurchase/common/commonApprovalDetails.xhtml" />
						<ui:include
							src="/xhtml/sc/directpurchase/common/commonRemarks.xhtml" /> 
					</td>
					</td>
				</tr>
			</table>

			<!-- Item Details PopUp -->
			<ui:include
				src="/xhtml/sc/directpurchase/common/itemDetailPopup.xhtml" />
			<!-- Justification PopUp -->
			<ui:include
				src="/xhtml/sc/directpurchase/common/justificationPopup.xhtml" />
			<!-- Pricing PopUp -->
			<ui:include src="/xhtml/sc/directpurchase/common/pricingPopup.xhtml" />
			<!-- Supplier Details PopUp -->
				<ui:include src="/xhtml/sc/common/supplierDetailsPopup.xhtml" />
		</p:panel>
	</ui:define>

</ui:composition>
