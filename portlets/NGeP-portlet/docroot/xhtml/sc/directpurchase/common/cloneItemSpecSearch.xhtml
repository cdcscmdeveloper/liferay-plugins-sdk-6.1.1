<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneItemSpec" widgetVar="cloneItemSpec"
		header="Clone Item Specification" width="550 " height="530" resizable="false" dynamic="true" modal="true">
		<p:spacer height="5px"/>
		
		<p:panel header="Search" id="cloneItemSpecId">
	     <table style="width: 900px;">
	     
	     <tr>
			<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.clone.item.spec.sq.no']}" /></td>
			<td style="width: 200px;"> <p:inputText  value="#{simpleQuoteBackingBean.managedBean.searchQuoteNo}"
						style="margin-bottom: 5px;" /></td>
		</tr>
	     
	     <tr>
			<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.clone.item.spec.title']}" /></td>
			<td style="width: 200px;" colspan="4"> <p:inputText size="100" value="#{simpleQuoteBackingBean.managedBean.searchTitle}"
						style="margin-bottom: 5px;" /></td>
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sc.sq.clone.item.spec.proc.type']}" /></td>
			<td><p:selectOneMenu style="margin-bottom: 5px;"  
			 	value="#{simpleQuoteBackingBean.managedBean.searchProcType}">
			   <f:selectItems
				  value="#{simpleQuoteBackingBean.getDropdownCodeValues(ParameterTypeConst.procurementType)}" />
						
			   </p:selectOneMenu></td>
		</tr>
		<tr>
			<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.clone.item.spec.created.date.from']}" /></td>
			<td><p:calendar showOn="button"  pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.searchFromCreatedDate}">
				<p:ajax event="dateSelect" update="toDate"/>
				</p:calendar>
			 </td>
			
			<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.clone.item.spec.created.date.to']}" /></td>
			<td><p:calendar showOn="button"  mindate="#{simpleQuoteBackingBean.managedBean.searchFromCreatedDate}" id="toDate"
			      pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.searchToCreatedDate}">
				</p:calendar>
			</td>
	    </tr>	
	     
	    </table>
      <br /> <br />
      
	   <p:commandButton value="#{lbl['lbl.sc.sq.clone.item.spec.reset']}" style="float:right;" action="#{simpleQuoteBackingBean.reset}" update="@([id$=cloneItemSpecId])"
		    icon="ui-icon-reset" resetValues="true" partialSubmit="true"
		    process="@this" />

	   <p:commandButton value="#{lbl['lbl.sc.sq.clone.item.spec.search']}" style="float:right;" action="#{simpleQuoteMB.searchCloneItemSpec}"
				update="scQuoteDataModel" icon="ui-icon-search" process="@this ,cloneItemSpecId"/>
				
	 
	</p:panel>
        <br /> <br />
		<p:panel header="RESULT" toggleable="true" id="citemId">
			<h:panelGroup id="table-wrapper" style="width:100%;">
				<p:dataTable id="scQuoteDataModel"
					value="#{simpleQuoteBackingBean.managedBean.scQuoteDataModel}" var="scQuote"
					selection="#{simpleQuoteBackingBean.managedBean.selectedQuote}"
					selectionMode="single"
					rowKey="#{scQuote}"
					rowIndexVar="index" lazy="true">
					<ac:paginator for="scQuoteDataModel" />
					<p:column ></p:column>

					<p:column headerText="#{lbl['lbl.sc.sq.clone.item.spec.sq.no']}">
						<h:outputText value="#{scQuote.quoteNo}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.sq.clone.item.spec.title']}">
						<h:outputText value="#{scQuote.title}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.sq.clone.item.spec.proc.type']}">
						<h:outputText value="#{requestNoteBackingBean.getParameterDesc(scQuote.procurementType)}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.sq.clone.item.spec.created.date']}">
						<h:outputText value="#{scQuote.createdDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.sq.clone.item.spec.created.by']}">
						<h:outputText value="#{simpleQuoteBackingBean.showCreatedBy(scQuote.createdBy)}" />
					</p:column>
				</p:dataTable>
				
			</h:panelGroup>
           <br /> <br />

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.sc.sq.clone.item.spec.ok']}" action="#{simpleQuoteBackingBean.addCloneItemSpec(simpleQuoteBackingBean.managedBean.productOrService)}"
					partialSubmit="true" process="@this citemId" update="@([id$=itemListMainId])" 
					icon="ui-icon-submit" oncomplete="cloneItemSpec.hide()" />

				<p:commandButton value="#{lbl['lbl.sc.sq.clone.item.spec.cancel']}" onclick="cloneItemSpec.hide()" icon="ui-icon-cancel"
					immediate="true" />
			</div>



		</p:panel>
		</p:dialog>
</ui:composition>
