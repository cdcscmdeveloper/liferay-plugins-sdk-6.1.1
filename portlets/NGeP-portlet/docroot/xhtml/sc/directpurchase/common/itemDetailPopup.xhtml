<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="itemDtlPopup" widgetVar="itemDtlPopup" header="ITEM DETAIL" modal="true" dynamic="true"
		resizable="false" styleClass="pop_up_top" width="570">
		<p:spacer height="5px"/>
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
				<td><p:inputText disabled="true" size="46"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.cmItem.extensionCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true"  size="46"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.itemName}" /></td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea disabled="true" rows="2" cols="55"
						style="margin-bottom: 5px; width: 300px;"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.itemDesc}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td valign="bottom"><p:inputText disabled="true" size="25"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.uom.uomName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.dtl.price.type']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.priceType,requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.priceType.parameterCode)}" />
			   </td>
			</tr>
	
			
					 <ui:fragment rendered="#{requestNoteBackingBean.managedBean.itemCheck}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.frequency.per.uom']}"/></td>
							<td><p:inputText styleClass="ppNumericAlign" disabled="true" size="25"  
							       value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomFrequency}"/>  
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.no.uom.per.day']}" /></td>
							<td><p:inputText styleClass="ppNumericAlign" disabled="true" size="25" 
							      value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomPerDay}"/>
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.frequency.per.uom']}" /></td>
							<td><p:inputText styleClass="ppNumericAlign" disabled="true" size="25" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomFrequency}"/>
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.no.uom.per.month']}" /></td>
							<td><p:inputText styleClass="ppNumericAlign" disabled="true" size="25" 
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomPerMonth}"/>
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.duration.month']}" /></td>
							<td><p:inputText styleClass="ppNumericAlign" disabled="true" size="25" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clDurationMonth}"/>
						   </td>
						</tr>
						 </ui:fragment>
					 
            <tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></td>
				<td>
					<p:inputText disabled="true" size="25" styleClass="ppNumericAlign"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.quantity}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.uom.uomName)}" maxIntegerDigits="10" />
					</p:inputText>
			   </td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ceiling.price']}" rendered="#{requestNoteBackingBean.managedBean.itemCheck}"/></td>
				<td><p:inputText styleClass="ppNumericAlign" disabled="true" size="25" rendered="#{requestNoteBackingBean.managedBean.itemCheck}"/>
			   </td>
			</tr>

		</table>
		
	      <p:spacer height="15px"></p:spacer>
	      <p:panelGrid styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="60%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true" process="@this"
							onclick="itemDtlPopup.hide()" icon="ui-icon-cancel" />
					</p:column>
				</p:row>
		 </p:panelGrid>

	</p:dialog>
</ui:composition>
