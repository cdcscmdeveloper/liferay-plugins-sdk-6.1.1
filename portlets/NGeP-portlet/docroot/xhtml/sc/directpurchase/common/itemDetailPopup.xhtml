<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog widgetVar="itemDtlPopup" header="ITEM DETAIL"
		resizable="false" styleClass="pop_up_top" width="570">
		<p:spacer height="5px"/>
		<table style="width: 550px">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.extensionCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true"  size="53"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}" /></td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea disabled="true" rows="3" cols="55"
						style="margin-bottom: 5px;"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td valign="bottom"><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.dtl.price.type']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.priceType,requestNoteBackingBean.managedBean.priceTypeCode)}" />
			   </td>
			</tr>
	
			<tr>
			  <td colspan="4">
					<table style="width: 60.5%">
					 <ui:fragment rendered="#{requestNoteBackingBean.managedBean.itemCheck}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.frequency.per.uom']}"/></td>
							<td><p:inputText disabled="true" size="33"  
							       value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomFrequency}"/>  
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.no.uom.per.day']}" /></td>
							<td><p:inputText disabled="true" size="33" 
							      value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomPerDay}"/>
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.frequency.per.uom']}" /></td>
							<td><p:inputText disabled="true" size="33" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomFrequency}"/>
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.no.uom.per.month']}" /></td>
							<td><p:inputText disabled="true" size="33" 
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clUomPerMonth}"/>
						   </td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.duration.month']}" /></td>
							<td><p:inputText disabled="true" size="33" value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.tplSpecQuestion.clDurationMonth}"/>
						   </td>
						</tr>
						 </ui:fragment>
					 </table>
					
				   </td>
			 </tr>
            <tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></td>
				<td><p:inputText disabled="true" size="33"
				value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.quantity}"/>
			   </td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ceiling.price']}" rendered="#{requestNoteBackingBean.managedBean.itemCheck}"/></td>
				<td><p:inputText disabled="true" size="33" rendered="#{requestNoteBackingBean.managedBean.itemCheck}"/>
			   </td>
			</tr>

		</table>
		
	      <p:spacer height="15px"></p:spacer>
	      <p:panelGrid styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="60%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.sc.close']}"
							onclick="itemDtlPopup.hide()" icon="ui-icon-close" />
					</p:column>
				</p:row>
		 </p:panelGrid>

	</p:dialog>
</ui:composition>
