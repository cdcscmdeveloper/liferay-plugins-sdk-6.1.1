<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:dialog id="itemDtlPopup" widgetVar="itemDtlPopup" header="ITEM DETAIL" modal="true" dynamic="true" closable="false"
		resizable="false" styleClass="pop_up_top" width="520">
		<p:panel id="itemDetailsId">
		<p:messages id="itemDetMsg" showDetail="true" autoUpdate="#{!requestNoteBackingBean.managedBean.autoUpdate}" closable="false" showSummary="false" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
				<td><p:inputText disabled="true" size="46"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.cmItem.extensionCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true"  size="46"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.itemName}" /></td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea disabled="true" rows="3" cols="58"
						style="margin-bottom: 5px; width: 305px;"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.itemDesc}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td valign="bottom"><p:inputText disabled="true" size="25"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.uom.uomName}" /></td>
			</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.item.dtl.price.type']}" /></td>
					<td><p:inputText disabled="true" size="25"
							value="#{requestNoteBackingBean.getParameterDesc(requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.priceType)}" />
					</td>
				</tr>

				<ui:fragment
					rendered="#{requestNoteBackingBean.managedBean.itemCheck}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomFrequency}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomPerDay}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomFrequency}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomPerMonth}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.duration.month']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clDurationMonth}" />
						</td>
					</tr>
				</ui:fragment>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></td>
					<td>
					  <table>
							<tr>
								<td><p:inputText size="25" styleClass="ppRightBtn"  disabled="#{requestNoteBackingBean.managedBean.viewOnly}"
								        required="true"
										id="qtyId" label="#{lbl['lbl.sc.quantity']}"
										value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.quantity}">
										<f:convertNumber
											pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.uom.uomCode)}" />
									</p:inputText></td>
								<td><p:message id="qtyIdMsg" for="qtyId" display="icon" /></td>
							</tr>
						</table>
				   </td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.ceiling.price']}"
							rendered="#{requestNoteBackingBean.managedBean.itemCheck}" /></td>
					<td><p:inputText styleClass="ppRightBtn" disabled="true"
							size="25"
							rendered="#{requestNoteBackingBean.managedBean.itemCheck}" /></td>
				</tr>
				
                <ui:param name="requestNoteDtl" value="#{requestNoteBackingBean.managedBean.requestNoteDtl}"></ui:param>				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.request.note.price.type']}"/> <p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><h:selectOneMenu id="priceType" style="width:90px;margin-top: 8px;"
						required="#{!requestNoteBackingBean.managedBean.requestNoteDtl.selected}" 
						disabled="#{requestNoteBackingBean.managedBean.viewOnly}"
						label="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.price.type']}"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.priceType.parameterId}">
						 <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems 
							value="#{requestNoteBackingBean.getPriceTypeByPrice(requestNoteDtl.scRequestSupplierItem.supplierItemPrices)}"
							var="pmParameter"
							itemLabel="#{requestNoteBackingBean.getParameterDesc(pmParameter)}"
							itemValue="#{pmParameter.parameterId}" />
							
							<p:ajax event="change" partialSubmit="true" 
									process="@this"
									listener="#{requestNoteBackingBean.supplierListener(requestNoteDtl.scRequestSupplierItem.supplierId, requestNoteDtl.priceType.parameterId, requestNoteDtl, requestNoteDtl.assignedUser.userId, requestNoteDtl.deliverTermTypeId)}" />
					</h:selectOneMenu>
					<p:message id="priceTypeMsg" for="priceType" display="icon" /> </td>
				</tr>
				
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.request.note.fulfill.type']}"/></td>
					<td>	<p:inputText value="#{requestNoteBackingBean.getParameterDesc(requestNoteBackingBean.managedBean.requestNoteDtl.fulfilmentType)}" 
					   disabled="true" size="8" style="margin-top: 8px;"/> <ac:iconTooltip value="#{lbl['lbl.sc.fulfilment.tooltip']}" /></td>
				</tr>

			</table>
			
		   <p:spacer height="2px"/>
			<div class="ppRightBtn">
				<p:commandButton id="okBtn"
					rendered="#{!requestNoteBackingBean.managedBean.viewOnly}"
					value="#{lbl['lbl.sc.ok']}" process="@this qtyId"
					update="@form" 	partialSubmit="true" 
					action="#{requestNoteBackingBean.editQuantity}"/>

				<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
					process="@this" update="@form"
					action="#{requestNoteBackingBean.cancelItemDetailPopup}" />
			</div>
		</p:panel>
    
    <p:defaultCommand target="okBtn"></p:defaultCommand>
	</p:dialog>
</ui:composition>
