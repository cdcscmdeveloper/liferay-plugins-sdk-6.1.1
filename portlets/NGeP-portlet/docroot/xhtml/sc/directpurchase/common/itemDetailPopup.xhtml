<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog  widgetVar="itemDtlPopup" 
		resizable="false" styleClass="pop_up_top"
		width="675" height="250">
          
	    <p:panel header=" Item Detail" toggleable="true">
		   <p:panelGrid styleClass="noBorders tr,noBorders td"  style="width:100%">
			<p:row >
				<p:column width="20%">
					<p:outputLabel value="#{lbl['lbl.ss.product.code']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.extensionCode}" />
				</p:column>
			</p:row>

			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.ss.item.name']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.itemName}" />
				</p:column>

			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.desc']}" />
				</p:column>
				<p:column colspan="3">
					<p:inputTextarea disabled="true" rows="2" cols="80" value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.itemDesc}" />
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.uom']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.pmUom.uomName}">
					</p:inputText>
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.price.type']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true" value="#{directPurchaseBackingBean.managedBean.priceType}" />
				</p:column>
			</p:row>
				</p:panelGrid>
			</p:panel>
	</p:dialog>
</ui:composition>
