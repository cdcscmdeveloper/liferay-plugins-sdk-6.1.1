<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
     <p:dialog  widgetVar="pricingPopup" modal="true" header="PRICING"
		width="670" height="350" resizable="false" >
		<p:spacer height="5px"/>
		<table style="width: 550px">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}" /></td>
			</tr>

			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea disabled="true" rows="3" cols="55" style="margin-bottom: 5px;"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.price.type']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.priceType,requestNoteBackingBean.managedBean.priceTypeCode)}" /></td>
			</tr>
		</table>

		<p:spacer height="15px" />
		<p:dataTable id="priceDtl" var="pricing"
			value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmPricings}"
			rowKey="#{pricing}" rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sc.zone']}" style="width:30%">
				<p:inputText value="zone" disabled="true"  style="text-align:right;"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.from.qty']}" style="width:10%"> 
				<p:inputText value="#{pricing.fromQty}"  style="text-align:right;" disabled="true"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.to.qty']}" style="width:10%">
				<p:inputText value="#{pricing.toQty}"  style="text-align:right;" disabled="true"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.offered']}" style="width:20%">
				<p:inputText value="#{pricing.price}"  style="text-align:right;" disabled="true"/>
			</p:column>

		</p:dataTable>
      <p:spacer height="15px"></p:spacer>
	  <p:panelGrid styleClass="noBorders tr,noBorders td">
		 <p:row>
			<p:column width="60%" style="text-align:right">
			 <p:commandButton value="#{lbl['lbl.sc.close']}"
					onclick="pricingPopup.hide()" icon="ui-icon-back" />
		   </p:column>
		</p:row>
	</p:panelGrid>
	</p:dialog>
</ui:composition>
