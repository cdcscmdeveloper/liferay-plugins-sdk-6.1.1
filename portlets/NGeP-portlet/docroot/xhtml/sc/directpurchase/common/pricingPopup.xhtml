<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
     <p:dialog  id="pricingPopup" widgetVar="pricingPopup" modal="true" header="#{lbl['lbl.sc.pricing']}"
		width="700" height="380" resizable="false" >
	   <h:panelGroup>
		<table style="width: 550px">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
				<td><p:inputText disabled="true" size="46"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true" size="46"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.itemName}" /></td>
			</tr>

			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea disabled="true" rows="2" cols="55" style="margin-bottom: 5px; width: 300px;"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.itemDesc}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.uom.uomName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.price.type']}" /></td>
				<td><p:inputText disabled="true" size="25"
						value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.priceType,requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.priceType.parameterCode)}" /></td>
			</tr>
		</table>
		</h:panelGroup>
		
      <h:panelGroup>
		<p:spacer height="15px" />
		<p:dataTable id="priceDtl" var="itemPrice"
			value="#{requestNoteBackingBean.managedBean.pricingList}"
			rowKey="#{itemPrice}" rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sc.zone']}" style="width:45%">
				#{itemPrice.tplSpecZone.zoneName}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.from.qty']}" style="width:15%; text-align:right;"> 
				<h:outputText value="#{itemPrice.fromQty}" /> 
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.to.qty']}" style="width:15%; text-align:right;">
				<h:outputText value="#{itemPrice.toQty}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.offered']}" style="width:25%; text-align:right;">
				<h:outputText value="#{itemPrice.itemPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
		</h:panelGroup>
	  <p:panelGrid styleClass="noBorders tr,noBorders td">
		 <p:row>
			<p:column width="100%" style="text-align:right">
			 <p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true" process="@this"
					onclick="pricingPopup.hide()" icon="ui-icon-cancel" />
		   </p:column>
		</p:row>
	</p:panelGrid>
	</p:dialog>
</ui:composition>
