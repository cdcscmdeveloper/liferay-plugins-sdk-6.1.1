<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="recentPrice" widgetVar="recentPricePopup" position="top"
		header="#{lbl['lbl.sc.view.recent.price.header']}" modal="true"
		width="500" height="100" >
		<table>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.view.recent.price.duration']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="duration"
						value="#{requestNoteBackingBean.managedBean.recentPriceDuration}">
						<f:selectItems
							value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.recentPriceDuration)}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton
						value="#{lbl['lbl.sc.view.recent.price.view.btn']}"
						icon="ui-icon-search"
						ajax="false">
						<p:fileDownload value="#{requestNoteBackingBean.viewRecentPrice()}" />
					</p:commandButton>

					<p:commandButton value="#{lbl['lbl.sc.cancel']}" process="@this"
						icon="ui-icon-cancel" oncomplete="recentPricePopup.hide();"
						partialSubmit="true" />
				</p:column>
			</p:row>
		</p:panelGrid>

	</p:dialog>
</ui:composition>
