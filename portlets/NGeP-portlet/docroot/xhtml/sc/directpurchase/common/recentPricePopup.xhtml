<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:dialog id="recentPrice" widgetVar="recentPricePopup" header="#{lbl['lbl.sc.view.recent.price.header']}"  resizable="false"
	      width="500" height="100"  closable="false" >
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.view.recent.price.duration']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu
						value="#{requestNoteBackingBean.managedBean.recentPriceDuration}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.recentPriceDuration)}"/>
					</p:selectOneMenu></td>
			</tr>
		</table>
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.view.recent.price.view.btn']}" process="@form" icon="ui-icon-search" 
					     action="#{requestNoteBackingBean.viewRecentPrice}"/> 

					<p:commandButton value="#{lbl['lbl.sc.cancel']}" process="@this"
						icon="ui-icon-cancel" oncomplete="recentPricePopup.hide();"
						partialSubmit="true" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
