<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
     <p:dialog  widgetVar="priceTablePopup" modal="true" header="SUMMARY"
		width="750" resizable="false" >
		<p:spacer height="5px"/>
		<table style="width: 500px">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.extensionCode}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}" /></td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td><p:inputTextarea readonly="true" disabled="true" rows="3"
						cols="55" style="margin-bottom: 5px;"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
				<td><p:inputText disabled="true" size="33"
						value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}" /></td>
			</tr>
		  
		</table>
		
        <p:spacer height="15px"/>

			<p:dataTable id="priceTblDtl" var="pricing"
				value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmPricings}"
				rowKey="#{pricing}" rowIndexVar="index">

	            <p:column headerText="#{lbl['lbl.sc.supp.name']}" style="width:20%">
					<h:outputText value="#{pricing.cmSupplierItem.smSupplier.companyName}" />
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.delivery.term']}" style="width:15%">
					<h:outputText value="#{pricing.cmSupplierItem.minOrder}" />
				</p:column>
					
               <p:column headerText="#{lbl['lbl.sc.min.qty']}" style="width:10%">
					<h:outputText value="#{pricing.cmSupplierItem.minOrder}" />
				</p:column>
				
               <p:column headerText="#{lbl['lbl.sc.additional.item.desc']}" style="width:20%">
					<h:outputText value="#{pricing.cmSupplierItem.itemDesc}" />
				</p:column>
				
				
			    <p:column headerText="#{lbl['lbl.sc.summary.price.type']}" style="width:10%">
					<h:outputText value="#{pricing.pricingType}" />
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.zone']}" style="width:10%">
					<h:outputText value="-" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.from.qty']}" style="width:10%">
					<h:outputText value="#{pricing.fromQty}" style="float:right"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.to.qty']}" style="width:10%">
					<h:outputText value="#{pricing.toQty}" style="float:right"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.unit.price]}" style="width:10%">
					<h:outputText value="#{pricing.price}" style="float:right"/>
				</p:column>

			</p:dataTable>

	</p:dialog>
</ui:composition>
