<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog widgetVar="justPopup" header="JUSTIFICATION" modal="true" width="550" height="180"
		resizable="false" >
		<p:spacer height="10px"/>
		<table style="width: 500px">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ss.procurement.type']}" /></td>
				<td><p:inputText disabled="true"
						value="#{requestNoteBackingBean.managedBean.requestNoteDtl.procurementType}" /></td>
	    	</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.ss.justification']}" /></td>
				<td><p:inputText disabled="true"  value="#{requestNoteBackingBean.managedBean.requestNoteDtl.justificationType}"/></td>
			 </tr>
			 <tr>
				<td></td>
				<td><p:inputTextarea disabled="true" rows="4" cols="70" rendered="#{requestNoteBackingBean.managedBean.justTypeOption}"/> </td>
			</tr>
		</table>

	</p:dialog>
</ui:composition>
