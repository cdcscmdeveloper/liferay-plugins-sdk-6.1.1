<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog id="justPopup" widgetVar="justPopup" header="#{lbl['lbl.sc.justification']}" 
	modal="true" 
		resizable="false" >
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" /></td>
				<td><p:inputText disabled="true" size="25"
					 value="#{requestNoteBackingBean.getParameterDesc(requestNoteBackingBean.managedBean.requestNoteDtl.procurementType)}" /></td>
	    	</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.reason']}" /></td>
				<td><p:inputText disabled="true" size="25"
				value="#{requestNoteBackingBean.getParameterDesc(requestNoteBackingBean.managedBean.requestNoteDtl.justificationType)}"/></td>
			 </tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel
						value="#{lbl['lbl.sc.justification']}"/></td>
				<td><p:inputTextarea value="#{requestNoteBackingBean.managedBean.requestNoteDtl.justification}"
						rows="4" cols="48" style="margin-bottom: 5px; width: 350px;" disabled="true" /></td>
			</tr>
		</table>
	    <p:spacer height="3px"/>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
				process="@this" onclick="justPopup.hide()" />
		</div>
	</p:dialog>
</ui:composition>
