<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel label="#{lbl['lbl.sc.approve.list']}"
		header="#{lbl['lbl.sc.approve.list']}" toggleable="true"
		toggleSpeed="500">
		<div style="width: 100%">
			<p:pickList id="appId"  value="#{requestNoteBackingBean.managedBean.approvalUsers}" var="approverUser"
				showTargetControls="true" itemLabel="#{approverUser.userName}"
				itemValue="#{approverUser}" converter="approverPickListConverter">
				<f:facet name="sourceCaption">Available Aprover</f:facet>
				<f:facet name="targetCaption">Aprover List Name</f:facet>
			</p:pickList>
		</div>
	</p:panel>
</ui:composition>
