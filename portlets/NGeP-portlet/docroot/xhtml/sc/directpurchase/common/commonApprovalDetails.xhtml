<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.approver.instuction']}"/>	
	
	<p:panel label="#{lbl['lbl.sc.approve.list']}" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			 <h:outputText value="* " styleClass="mandatory" />
			 <h:outputText value="#{lbl['lbl.sc.approve.list']}" />
		</f:facet>
		<table style="width: 100%">
			<tr>
				<td style="width: 250px;"><p:pickList id="approver"
						label="#{lbl['lbl.sc.approver']}" disabled="#{requestNoteBackingBean.managedBean.requestNoteStatus eq 'Pending Approval'}"
						value="#{requestNoteBackingBean.managedBean.approvalUsers}"
						var="approverUser" required="true" showTargetControls="true"
						itemLabel="#{approverUser.userName}" itemValue="#{approverUser}"
						converter="approverPickListConverter">
						<f:facet name="sourceCaption">#{lbl['lbl.sc.available.approver']}</f:facet>
						<f:facet name="targetCaption">#{lbl['lbl.sc.selected.approvers']}</f:facet>
					</p:pickList></td>
				<td
					style="vertical-align: top; padding-right: 1px; text-align: right;">
					<p:message id="approverMsg" for="approver" display="icon" />
				</td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
