<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel header="#{lbl['lbl.sc.approve.list']}"  toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			 <h:outputText value="* " styleClass="mandatory" />
			 <h:outputText value="#{lbl['lbl.sc.approve.list']}" />
		</f:facet>
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.approver.instuction']}"/>	
		
		<h:panelGrid columns="1">
			<h:panelGrid columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.ptj.approver.group']}"
					style="text-align: top" />
				<p:selectOneMenu style="width:350px; margin-bottom:5px;"
					disabled="#{isPendingApprovalStatus or requestNoteBackingBean.managedBean.viewOnly}"
					value="#{requestNoteBackingBean.managedBean.requestNote.pmUserGroup.userGroupId}">
					<p:ajax event="change" process="@this" update="approverDropdown"
						listener="#{requestNoteBackingBean.userGroupChangeListener()}" />
					<f:selectItems
						value="#{requestNoteBackingBean.getUserGroupDropdown()}" />
				</p:selectOneMenu>
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:outputLabel value="#{lbl['lbl.sc.approverName']}" />
				<p:selectOneMenu id="approverDropdown"
					disabled="#{isPendingApprovalStatus or requestNoteBackingBean.managedBean.viewOnly}"
					value="#{requestNoteBackingBean.managedBean.selectedApprover}"
					style="width:340px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="" />
					<f:selectItems
						value="#{requestNoteBackingBean.managedBean.approverList}" />
						<p:ajax event="change"/>
				</p:selectOneMenu>
			</h:panelGrid>
		</h:panelGrid>
	</p:panel>
</ui:composition>
