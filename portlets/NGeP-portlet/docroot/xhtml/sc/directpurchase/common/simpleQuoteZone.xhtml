<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="zonePanel" header="#{lbl['lbl.ss.simple.quote.delivery.location']}" toggleable="true">
	
	
	<h:outputText styleClass="instruction" 
		value="#{lbl['lbl.sc.sq.deliverylocation.instruction']}">
	</h:outputText>
	
	 <table style="width: 100%">
				<tr>
					<td style="width: 160px"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.criteria.location.level']}" /></td>
					<td><p:selectOneMenu id="locLevels"
							value="#{simpleQuoteBackingBean.managedBean.locationLevel}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems value="#{simpleQuoteBackingBean.locationLevelDropdown}" />
								<p:ajax event="change" update="zoneLocationDataTable" partialSubmit="true"
									process="@this"
									listener="#{simpleQuoteBackingBean.zoneLocLevelEvent}" />
					  </p:selectOneMenu></td>
					  <td>
					  	<ac:iconTooltip value="#{lbl['lbl.sc.locationlevel.tooltip']}" />
					  </td>
				</tr>
	    </table>
	    
	    <h:panelGroup rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panelItem eq null}">
	    <h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="zoneLocationDataTable" 
			        value="#{simpleQuoteBackingBean.managedBean.zoneTrees}" var="zoneTree"
			        rowIndexVar="index">
				 <p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.loc.name']}">
				 
					<p:tree value="#{zoneTree}" var="location" id="treeid"  
					   selectionMode="checkbox">
					   
					   <p:ajax event="select" listener="#{simpleQuoteBackingBean.selectZoneTreeNode}" />
					   <p:ajax event="unselect" listener="#{simpleQuoteBackingBean.unSelectZoneTreeNode}" />
					   
						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.sq.supp.criteria.action']}"/>
						<ac:iconTooltip value="#{lbl['lbl.sc.sq.location.action.tooltip']}" />
					</f:facet>
					<p:commandLink
						actionListener="#{simpleQuoteBackingBean.editZone(zoneTree,index)}"
						rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}"
						disabled="#{!simpleQuoteBackingBean.managedBean.panelItemBtnFlag}"
						process="@this" update="@([id$=zonePopupPanel])"
						oncomplete="ZoneLocation.show();">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
					
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 100%">
		 <c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">	
		    <p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.add.btn']}" process="@this,locLevels" 
		     update="@([id$=zonePopupPanel])" partialSubmit="true" 
			 oncomplete="ZoneLocation.show();" 
			 actionListener="#{simpleQuoteBackingBean.showZonePopup}" icon="ui-icon-add"/>
			 
		   <p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
		     process="@all, zoneLocationDataTable" partialSubmit="true"
		     action="#{simpleQuoteBackingBean.deleteZoneTreeNode()}"
		     update="@([id$=zoneLocationDataTable])" icon="ui-icon-delete"/> 	
			 			 
		 </c:if>
		</div>
		</h:panelGroup>

        <!-- panel item zone -->
		<h:panelGroup rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panelItem ne null}">
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="panelzoneDataTable"
					value="#{simpleQuoteBackingBean.managedBean.zoneTrees}"
					var="zoneTree"
					selection="#{simpleQuoteBackingBean.managedBean.selectedTreeNode}"
					rowIndexVar="index" selectionMode="single" rowKey="#{zoneTree}">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location">
							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column headerText="Action">
					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 100%">
				<c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">
					<p:commandButton
						value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
						process="@all,panelzoneDataTable" partialSubmit="true"
						action="#{simpleQuoteBackingBean.deletePanelItemZoneTreeNode()}"
						update="@([id$=panelzoneDataTable])" icon="ui-icon-delete" />

				</c:if>
			</div>
		</h:panelGroup>
	</p:panel>
	 <ui:include src="/xhtml/sc/directpurchase/common/SimpleQuoteZonePopup.xhtml" />
</ui:composition>
