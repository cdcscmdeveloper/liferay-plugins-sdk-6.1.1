<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog header="ZONE LOCATION" widgetVar="ZoneLocation" modal="true" 
		width="520" height="480">
		<p:panel id="zonePopupPanel">
			<table styleClass="noBorders tr,noBorders td" >
				<TR>
					<TD width="20%" valign="top"><p:outputLabel value="Zone Name"></p:outputLabel>
					</TD>
					<TD width="80%"><p:inputText id="zoneNameId" size="65"
							value="#{simpleQuoteBackingBean.managedBean.zoneName}" ></p:inputText>
					</TD>
				</TR>
				<TR>
					<TD width="20%" valign="top"><p:outputLabel value="Zone Location"></p:outputLabel>
					</TD>
					<TD width="80%">
						<div style="height: 300px; overflow-y: scroll;">
							<p:tree id="treeZoneLocationPopup"
								value="#{simpleQuoteBackingBean.managedBean.rootZoneTree}"
								var="location"
								selection="#{simpleQuoteBackingBean.managedBean.selectedNodes}"
								selectionMode="checkbox">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</div>
					</TD>
				</TR>
			</table>
		</p:panel>
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="60%" style="text-align:right">
					<p:commandButton
						value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
						icon="ui-icon-submit" onclick="ZoneLocation.hide();" process="@all"
						update="@this, zoneLocationDataTable,zonePopupPanel"
						partialSubmit="true"
						actionListener="#{simpleQuoteBackingBean.updateZone}" />

					<p:commandButton
						value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
						icon="ui-icon-cancel" onclick="ZoneLocation.hide();" />

				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
