<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="zonePanel" header="ZONE" toggleable="true">
		<h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="zoneLocationDataTable" value="#{simpleQuoteBidBackingBean.managedBean.zoneTrees}" var="zoneTree">
				<p:column headerText="Location">
					<p:tree value="#{zoneTree}" var="location">
							<p:treeNode>
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
						</p:tree>
				</p:column>
				<p:column headerText="Action">
					<p:commandLink actionListener="#{simpleQuoteBidBackingBean.editZoneLocation(zoneTree)}" process="@this" update="@([id$=zonePopupPanel])" oncomplete="ZoneLocation.show();">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 100%">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this" update="@([id$=zonePopupPanel])" oncomplete="ZoneLocation.show();" actionListener="#{simpleQuoteBidBackingBean.showZoneLocationPopup}" icon="ui-icon-add"/>
		</div>
	</p:panel>
	<ui:include src="/xhtml/sc/directpurchase/common/zonePricePopup.xhtml" />
</ui:composition>
