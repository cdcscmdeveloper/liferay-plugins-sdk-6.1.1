<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel>
	  <div align="right">
	    <c:if test="#{requestNoteBackingBean.managedBean.taskId eq null}">
	      
	           <p:commandButton value="#{lbl['lbl.sc.common.back']}"
					icon="ui-icon-back" style="float:left;" immediate="true"
					action="#{requestNoteBackingBean.backToPervious}" />

				<p:commandButton value="#{lbl['lbl.sc.common.save']}" icon="ui-icon-save"
				   	action="#{requestNoteBackingBean.saveAction}" />

				<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					icon="ui-icon-submit"  action="#{requestNoteBackingBean.submitAction}"/>

				<p:commandButton
					value="#{lbl['lbl.sc.common.cancel']}"
					icon="ui-icon-cancel" style="float:right;" />
	    </c:if>
	    
	      <table>
			<tr>
				<td align="right"><c:if
						test="#{requestNoteBackingBean.managedBean.processName eq 'Purchase Inquiry Creation'}">
						<c:forEach items="#{requestNoteBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						<c:if test="${action == 'REVISE'}">
							<ui:param name="iconVar" value="ui-icon-revise" />

						</c:if>
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<c:if test="${action == 'ACCEPT'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						
						<p:commandButton value="#{action}" process="@all"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{requestNoteBackingBean.submitAction}" />
						</c:forEach>

					</c:if></td>
			</tr>
		</table>
	    
	    <table>
			<tr>
				<td align="right"><c:if
						test="#{requestNoteBackingBean.managedBean.processName eq 'Purchase Review'}">
						<c:forEach items="#{requestNoteBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						<c:if test="${action == 'REVISE'}">
							<ui:param name="iconVar" value="ui-icon-revise" />

						</c:if>
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<c:if test="${action == 'ACCEPT'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						
						<p:commandButton value="#{action}" process="@all"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{requestNoteBackingBean.updateBpmTask(action)}" />
						</c:forEach>

					</c:if></td>
			</tr>
		</table>
	</div>
	
	</p:panel>
</ui:composition>
