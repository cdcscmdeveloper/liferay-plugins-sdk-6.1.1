<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	  <div class="ppRightBtn">
	   <c:if test="#{empty requestNoteBackingBean.managedBean.taskId}">
	           <p:commandButton value="#{lbl['lbl.sc.action.back.to.search.catalogue']}" style="float:left;" 
	           	   id="backButton"
	               icon="ui-icon-back" partialSubmit="true" process="@this"
				   immediate="true" action="#{requestNoteBackingBean.backToPervious}"  
				   rendered="#{requestNoteBackingBean.managedBean.sourceMethod eq 'Search Catalogue' and requestNoteBackingBean.managedBean.piRNChecker}"
				   title="#{lbl['lbl.sc.itemsearch.tooltip']}">
				</p:commandButton>
						
				<p:commandButton value="#{lbl['lbl.sc.common.save']}" icon="ui-icon-save" process="@this"
				   onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				   action="#{requestNoteBackingBean.saveAction('')}"/>

				<p:commandButton value="#{lbl['lbl.sc.common.submit']}" update="@([id$=requestNoteId])"
				    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					icon="ui-icon-submit"  
					action="#{requestNoteBackingBean.submitAction('')}" process="@all"/>
					
			    <p:commandButton value="#{lbl['lbl.sc.common.cancel']}"  action="#{requestNoteBackingBean.cancel}"
			      onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			      style="float:right;" 
			      icon="ui-icon-cancel" process="@this"  partialSubmit="true"/>
	    </c:if>
	    </div>
	   <div>
	   <c:if test="#{!empty requestNoteBackingBean.managedBean.taskId}">
				<table style="width:100%">
					<tr>
						<td align="right">
						      
						  <c:if test="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingSubmission}">
					           <p:commandButton value="#{lbl['lbl.sc.action.back.to.search.catalogue']}" icon="ui-icon-back" partialSubmit="true" 
						           style="float:left;"  immediate="true" 
						           action="#{requestNoteBackingBean.backToPervious}"   
						           rendered="#{requestNoteBackingBean.managedBean.sourceMethod eq 'Search Catalogue' and requestNoteBackingBean.managedBean.piRNChecker}"/>
						  </c:if>
						
						  <c:if test="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingApproval 
									  or requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingSubmission 
									  or requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingRevision}">
                              <p:commandButton value="#{lbl['lbl.sc.common.save']}" icon="ui-icon-save" action="#{requestNoteBackingBean.saveAction('Save')}"
                                   onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							        process="@this" />

					     </c:if>
					     
					      <ui:repeat var="bpmAction" value="#{requestNoteBackingBean.managedBean.outComes}">
					      <ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
	                  
						<!-- TODO later on should check base on the work flow status instead of check the Pr Inquiry -->
						    <p:commandButton value="#{lbl[buttonLabel]}" process="@form" partialSubmit="true"
								 rendered="#{!unspscCodeBackingBean.isRequisitioner()}"
								 styleClass="ui-button"
								 icon = "ui-icon-#{fn:toLowerCase(bpmAction)}"
								 onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								 actionListener="#{requestNoteBackingBean.approverAction(bpmAction)}" />

                            <ui:param name="isCancel" value="${bpmAction == 'CANCEL'}" />

						    <p:commandButton value="#{lbl[buttonLabel]}" 
								rendered="#{unspscCodeBackingBean.isRequisitioner()}"
								icon = "ui-icon-#{fn:toLowerCase(bpmAction)}"
							    partialSubmit="true"
							    styleClass="ui-button"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								process="#{isCancel ? '@this,  @([id$= remark])' : '@form'}"
								update="#{isCancel ? '@this,  @([id$= remark])' : '@form'}"
								actionListener="#{requestNoteBackingBean.submitAction(bpmAction)}" />
					</ui:repeat>
			 	
		  </td>
		 </tr>
	 </table>
	</c:if>
	</div>
</ui:composition>
