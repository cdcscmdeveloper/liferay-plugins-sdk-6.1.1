<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td">
		<p:row>
			<p:column width="100%" style="text-align:right">
				<p:commandButton value="#{lbl['lbl.sc.common.back']}"
					icon="ui-icon-back" style="float:left;" immediate="true"
					action="#{requestNoteBackingBean.backToPervious}" />

				<p:commandButton value="#{lbl['lbl.sc.common.save']}" icon="ui-icon-save"
				   	action="#{requestNoteBackingBean.saveAction}" />

				<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					icon="ui-icon-submit"  action="#{requestNoteBackingBean.submitAction}"/>

				<p:commandButton
					value="#{lbl['lbl.sc.common.cancel']}"
					icon="ui-icon-cancel" style="float:right;" />

			</p:column>
		</p:row>
	</p:panelGrid>
	<p:spacer height="10px" />
</ui:composition>
