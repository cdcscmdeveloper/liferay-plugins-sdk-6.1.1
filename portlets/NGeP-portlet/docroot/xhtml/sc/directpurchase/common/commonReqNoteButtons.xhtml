<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:panel>
	  <div align="right">
	    <c:if test="#{requestNoteBackingBean.managedBean.taskId eq null}">
				<p:commandButton value="#{lbl['lbl.sc.common.save']}" icon="ui-icon-save"
				   	action="#{requestNoteBackingBean.saveAction}" update="@form"/>

				<p:commandButton value="#{lbl['lbl.sc.common.submit']}" update="@form"
					icon="ui-icon-submit"  action="#{requestNoteBackingBean.submitAction('SUBMIT')}"/>
	    </c:if>
	    </div>
	    <div>
	    <c:if test="#{requestNoteBackingBean.managedBean.taskId ne null}">
				<table style="width:100%">
					<tr>
						<td align="right">
								<c:forEach items="#{requestNoteBackingBean.managedBean.outComes}" var="action">
								
								<c:if test="${action == 'SUBMIT'}">
									<ui:param name="iconVar" value="ui-icon-submit" />

								</c:if>

								<c:if test="${action == 'REJECT'}">
									<ui:param name="iconVar" value="ui-icon-reject" />

								</c:if>
								<c:if test="${action == 'REVISE'}">
									<ui:param name="iconVar" value="ui-icon-revise" />

								</c:if>
								<c:if test="${action == 'APPROVE'}">
									<ui:param name="iconVar" value="ui-icon-approve" />

								</c:if>
								<c:if test="${action == 'ACCEPT'}">
									<ui:param name="iconVar" value="ui-icon-approve" />

								</c:if>
								<!-- TODO later on should check base on the work flow status instead of check the Pr Inquiry -->
								<p:commandButton value="#{action}" process="@this" partialSubmit="true"
									rendered="#{!unspscCodeBackingBean.isRequisitioner()}"
									styleClass="ui-button" icon="#{iconVar}"
									actionListener="#{requestNoteBackingBean.updateBpmTask(action)}" />

								<p:commandButton value="#{action}" process="@all" update="@form"
									rendered="#{unspscCodeBackingBean.isRequisitioner()}"
									styleClass="ui-button" icon="#{iconVar}"
									actionListener="#{requestNoteBackingBean.submitAction(action)}" />
							</c:forEach></td>
					</tr>
				</table>
			</c:if>
	</div>
	</p:panel>
</ui:composition>
