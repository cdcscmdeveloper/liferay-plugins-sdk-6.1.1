<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:panel header="INVITATION CRITERIA" toggleable="true">

		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:100%">
					<p:selectBooleanCheckbox
						value="false" disabled="false" />
					<p:spacer width="2" />
					<h:outputText value="By Business Nature"></h:outputText>
				</p:column>
			</p:row>
		</p:panelGrid>
		<p:dataTable id="businessNatureTable" value="#{simpleQuoteBidBackingBean.managedBean.businessNatureCriterias}"
			selection="#{simpleQuoteBidBackingBean.managedBean.selectedBusinessNatureCriterias}" rowIndexVar="rowIndex"
			var="businessNatureCriteria" editable="true" rowKey="#{businessNatureCriteria.criteriaValue}">
			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="Code">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{businessNatureCriteria.criteriaValue}" />
					</f:facet>
					<f:facet name="input">
						<p:inputText value="#{businessNatureCriteria.criteriaValue}" style="width:100%" />
					</f:facet>
				</p:cellEditor>
			</p:column>
			<p:column headerText="Description">
			</p:column>
			<p:column style="width:6%">  
				<p:rowEditor />
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this" partialSubmit="true"  icon="ui-icon-add"
			  action="#{simpleQuoteBidBackingBean.addBusinessNature()}" update="businessNatureTable"/>
			  <p:commandButton value="#{lbl['lbl.sc.sf.delete']}" icon="ui-icon-delete"/>
		</div>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:100%">
					<p:selectBooleanCheckbox value="false" disabled="false"></p:selectBooleanCheckbox>
					<p:spacer width="2px;"></p:spacer>
					<h:outputText value="By Locality"></h:outputText>
				</p:column>
			</p:row>
		</p:panelGrid>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:60%">
					<p:selectBooleanCheckbox value="false" disabled="false"></p:selectBooleanCheckbox>
					<p:spacer width="2px;"></p:spacer>
					<h:outputText value="By Supplier"></h:outputText>
					<p:spacer width="4px;"></p:spacer>
					<p:selectOneMenu value="#{simpleQuoteBidBackingBean.managedBean.supplierFilterType}">
						<f:selectItem itemValue="MOF" itemLabel="MOF Reg. No."></f:selectItem>
						<f:selectItem itemValue="RN" itemLabel="Registration No."></f:selectItem>
					</p:selectOneMenu>
					<p:spacer width="2px;"></p:spacer>
					<p:inputText value="#{simpleQuoteBidBackingBean.managedBean.supplierFilterValue}"></p:inputText>
				</p:column>
				<p:column style="width:40%">
					<p:selectBooleanCheckbox value="false" disabled="false"></p:selectBooleanCheckbox>
					<p:spacer width="2px;"></p:spacer>
					<h:outputText value="By Product"></h:outputText>
				</p:column>
			</p:row>
		</p:panelGrid>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.action.search']}" icon="ui-icon-search" />
		</div>
	</p:panel>
	<p:panel header="SUPPLIER" toggleable="true">

		<p:dataTable var="quoteBidSupplier"
			value="#{simpleQuoteBidBackingBean.managedBean.quoteBidSuppliers}"
			rowKey="#{simpleQuote.seqNo}" rowIndexVar="index">

			<p:column
				headerText="#{lbl['lbl.sc.quote.bid.ep.no']}"
				style="width:15%">
				<h:outputText value="#{quoteBidSupplier.smSupplier.epNo}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.quote.bid.mof.no']}" style="width:15%">
				<h:outputText value="#{quoteBidSupplier.smSupplier.regNo}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.quote.bid.supplier.name']}" style="width:70%">
				<h:outputText value="#{quoteBidSupplier.smSupplier.supplierName}"></h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
