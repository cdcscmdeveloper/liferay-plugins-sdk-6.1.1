<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <ac:title value="#{lbl['lbl.sc.sq']}"/>
    <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
      <ui:include src="/xhtml/sc/directpurchase/simpleQuoteButtons.xhtml" />
     <ui:include src="/xhtml/sc/directpurchase/simpleQuoteHeader.xhtml" />
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" valign="top" class="sidemenutd">
				<p:tabMenu styleClass="sidemenu"  id="tabMainMenu"  
					activeIndex="#{simpleQuoteBackingBean.managedBean.selectedTabIndex}"
					style="display : table-caption;">
                      
					<p:menuitem value="#{lbl['lbl.sc.sq.tab.title.gen.info']}" update="menuId">
						<f:setPropertyActionListener target="#{simpleQuoteBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.sq.tab.title.zone']}" update="menuId" disabled="#{simpleQuoteBackingBean.managedBean.zoneFlag}">
						<f:setPropertyActionListener target="#{simpleQuoteBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.sq.tab.title.item.list']}" update="menuId">
						<f:setPropertyActionListener target="#{simpleQuoteBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.sq.tab.title.supp.criteria.list']}" id="suppCriteriaId" update="menuId" action="#{simpleQuoteBackingBean.tabEvent}">
						<f:setPropertyActionListener target="#{simpleQuoteBackingBean.managedBean.selectedTabIndex}" value="3" />
					</p:menuitem>
					
				</p:tabMenu>
			</td>
			<td width="80%">
			<p:panel id="menuId">
			
				<c:if test="#{simpleQuoteBackingBean.managedBean.selectedTabIndex == 0}">
				    <ui:include src="/xhtml/sc/directpurchase/simpleQuoteGenInfo.xhtml" />
				</c:if>
	
				<c:if test="#{simpleQuoteBackingBean.managedBean.selectedTabIndex == 1}">
					<ui:include src="/xhtml/sc/directpurchase/common/simpleQuoteZone.xhtml" />
				</c:if>
				
				<c:if test="#{simpleQuoteBackingBean.managedBean.selectedTabIndex == 2}">
					<ui:include src="/xhtml/sc/directpurchase/simpleQuoteItemList.xhtml" />
				</c:if>
				
				<c:if test="#{simpleQuoteBackingBean.managedBean.selectedTabIndex == 3}">
					<ui:include src="/xhtml/sc/directpurchase/simpleQuoteSuppCriteria.xhtml" />
				</c:if>
				</p:panel>
			</td>
		</tr>
		</table>
</ui:define>
</ui:composition>
