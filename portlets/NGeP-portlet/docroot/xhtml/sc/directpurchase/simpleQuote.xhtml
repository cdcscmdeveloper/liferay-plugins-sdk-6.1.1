<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <ac:title value="#{lbl['lbl.sc.sq']}"/>
    <p:panel id="mainSqId">
    <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
    <ui:include src="/xhtml/sc/directpurchase/simpleQuoteButtons.xhtml" />
    <ui:include src="/xhtml/sc/directpurchase/simpleQuoteHeader.xhtml" />
    
    <p:tabView orientation="left" id="tabViewId" >
      <p:ajax event="tabChange" update="@([id$=suppCriteria])" listener="#{simpleQuoteBackingBean.tabEvent}" partialSubmit="true" process="@this"/>  

		<p:tab title="General Information" >
			<ui:include src="/xhtml/sc/directpurchase/simpleQuoteGenInfo.xhtml" />
		</p:tab>
		
		<p:tab title="Zone" disabled="#{simpleQuoteBackingBean.managedBean.zoneFlag}">
			<ui:include src="/xhtml/sc/directpurchase/common/simpleQuoteZone.xhtml" />
		</p:tab>
		
		<p:tab title="Item List">
			<ui:include src="/xhtml/sc/directpurchase/simpleQuoteItemList.xhtml" />
		</p:tab>
		
		<p:tab title="Supplier Criteria &#38; List">
			<ui:include src="/xhtml/sc/directpurchase/simpleQuoteSuppCriteria.xhtml" />
		</p:tab>
	</p:tabView>
	</p:panel>
</ui:define>
</ui:composition>
