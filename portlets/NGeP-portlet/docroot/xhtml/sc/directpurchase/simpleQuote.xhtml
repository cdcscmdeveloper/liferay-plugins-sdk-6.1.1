<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <ac:title value="#{lbl['lbl.sc.sq']}"/>
    <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info"  showSummary="false"/>
      <ui:include src="/xhtml/sc/directpurchase/simpleQuoteButtons.xhtml" />
     <ui:include src="/xhtml/sc/directpurchase/simpleQuoteHeader.xhtml" />
    <p:panel id="sqMainId">
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
		   <td width="20%;" class="sidemenutd" style="vertical-align: baseline;">
		       <p:tabMenu id="mainTabMenu"
					activeIndex="#{simpleQuoteBackingBean.managedBean.activeIndex}"
					styleClass="sidemenu" style="display : table-caption;">
							<p:menuitem id="sqGeninfo"
								value="#{lbl['lbl.sc.sq.tab.title.gen.info']}" update="@form"
								action="#{simpleQuoteBackingBean.tabMenuListener('0')}" />
								
							<p:menuitem id="zoneId"
								value="#{lbl['lbl.sc.sq.tab.title.zone']}" update="@form"
								disabled="#{!simpleQuoteBackingBean.managedBean.scQuote.zonal}"
								action="#{simpleQuoteBackingBean.tabMenuListener('1')}" />
								
							<p:menuitem id="itemListId"
								value="#{lbl['lbl.sc.sq.tab.title.item.list']}" update="@form"
								action="#{simpleQuoteBackingBean.tabMenuListener('2')}" />
								
							<p:menuitem id="suppCriteriaId"
								value="#{lbl['lbl.sc.sq.tab.title.supp.criteria.list']}"
								update="@form"
								action="#{simpleQuoteBackingBean.tabMenuListener('3')}" />
						</p:tabMenu>
			</td>
			<td width="80%">
				<c:if test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '0'}">
				    <ui:include src="/xhtml/sc/directpurchase/simpleQuoteGenInfo.xhtml" />
				</c:if>
	
				<c:if test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '1'}">
					<ui:include src="/xhtml/sc/directpurchase/common/simpleQuoteZone.xhtml" />
				</c:if>
				
				<c:if test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '2'}">
					<ui:include src="/xhtml/sc/directpurchase/simpleQuoteItemList.xhtml" />
				</c:if>
				
				<c:if test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '3'}">
					<ui:include src="/xhtml/sc/directpurchase/simpleQuoteSuppCriteria.xhtml" />
				</c:if>
			</td>
		</tr>
		</table>
		</p:panel> 
</ui:define>
</ui:composition>
