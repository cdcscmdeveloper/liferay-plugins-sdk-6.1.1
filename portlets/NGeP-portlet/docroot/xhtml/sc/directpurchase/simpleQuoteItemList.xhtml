   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="prodListId" header="PRODUCT LIST" toggleable="true">
	 <p:spacer height="5px" />
		<p:dataTable id="prodlist" var="product"  rowKey="#{product}" rowIndexVar="index"
		    selection="#{simpleQuoteBackingBean.managedBean.productTpls}">
			<ac:paginator for="prodlist" />  	
		  <p:column selectionMode="multiple" style="width:2%" />

		  <p:column headerText="#{lbl['lbl.sc.sq.item']}">
				<h:outputText value="#{product.estCostReq}"/>
			</p:column>

		  <p:column headerText="#{lbl['lbl.sc.sq.specification']}">
				<h:outputText value="#{product.estCostReq}"/>
			</p:column>

		  <p:column headerText="#{lbl['lbl.sc.sq.uom']}">
			<h:outputText value="#{product.estCostReq}"/>
			</p:column>

		  <p:column headerText="#{lbl['lbl.sc.sq.qty']}">
				<h:outputText value="#{product.tierPrice}"/>
			</p:column>
			
	     <p:column headerText="#{lbl['lbl.sc.sq.delivery.term']}">
			<h:outputText value="#{product.estCostReq}"/>
			</p:column>
			
		  <p:column headerText="#{lbl['lbl.sc.sq.estimated.val']}">
				<h:outputText value="#{product.estCostReq}"/>
			</p:column>
			
		</p:dataTable>
	  
	  	<p:commandButton value="Clone" style="float:right;"
					 icon="ui-icon-clone"/>
	</p:panel>
	<p:spacer height="25px" />   
    <p:panel id="servlistId" header="SERVICE LIST" toggleable="true">
		<p:dataTable id="servListTbl" var="service"  rowKey="#{service}" rowIndexVar="index"
		    selection="#{simpleQuoteBackingBean.managedBean.serviceTpls}">
			<ac:paginator for="servListTbl" />  	
		  <p:column selectionMode="multiple" style="width:2%" />
		  <p:column headerText="#{lbl['lbl.sc.sq.item']}" style="width:10%">
				<h:outputText/>
			</p:column>
		   
		   <p:column headerText="#{lbl['lbl.sc.sq.specification']}"  style="width:10%">
				<h:outputText/>
			</p:column>

           <p:column headerText="#{lbl['lbl.sc.sq.fulfill.type']}" style="width:10%">
				<h:outputText/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.sq.uom']}" style="width:10%">
				<h:outputText/>
			</p:column>
			
		   <p:column headerText="#{lbl['lbl.sc.sq.frequency.per.uom']}" style="width:10%">
				<h:outputText/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.sq.no.uom.per.day']}" style="width:10%">
				<h:outputText/>
			</p:column> 

            <p:column headerText="#{lbl['lbl.sc.sq.no.uom.per.month']}" style="width:10%">
				<h:outputText/>
			</p:column> 

			<p:column headerText="#{lbl['lbl.sc.sq.duration.month']}" style="width:10%">
				<h:outputText value="#{service.durationMonth}"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.sq.qty']}" style="width:10%">
				<h:outputText value="#{service.estCostReq}"/>
			</p:column> 
			
		   <p:column headerText="#{lbl['lbl.sc.sq.estimated.val']}" style="width:10%">
				<h:outputText value="#{service.estCostReq}"/>
			</p:column>

		</p:dataTable>
		
		<p:commandButton value="Clone" style="float:right;"
					 icon="ui-icon-clone"/>
	
	</p:panel>
	
</ui:composition>
