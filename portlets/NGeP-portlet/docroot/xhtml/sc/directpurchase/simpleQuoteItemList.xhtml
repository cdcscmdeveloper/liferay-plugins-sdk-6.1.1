<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:spacer height="5px" />
	<p:panel id="itemListMainId">
	  <h:panelGroup style="width: 100%;">
		<ac:templateSpec 
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
			title="PRODUCT LIST" />
		<p:commandButton value="Clone" style="float:right;"
		   action="#{simpleQuoteBackingBean.cloneAction(ParameterConst.itemListProduct)}"
			icon="ui-icon-clone" process="@this"
			update="@([id$=cloneItemSpecId])" rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}"
			oncomplete="cloneItemSpec.show();return false;" partialSubmit="true">
		</p:commandButton>
    </h:panelGroup>

	  <p:spacer height="35px" />
	  <h:panelGroup style="width: 100%;">
		 <ac:templateSpec
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
			title="SERVICE LIST" />

		 <p:commandButton value="Clone" style="float:right;"
		     action="#{simpleQuoteBackingBean.cloneAction(ParameterConst.itemListService)}"
			icon="ui-icon-clone" process="@this"
			update="@([id$=cloneItemSpecId])" rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}"
			oncomplete="cloneItemSpec.show();return false;" partialSubmit="true">
		</p:commandButton>
      </h:panelGroup>
		<ui:include src="/xhtml/sc/directpurchase/common/cloneItemSpecSearch.xhtml" />

	</p:panel>

</ui:composition>
