   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="prodListId" header="PRODUCT LIST" toggleable="true">
	 <p:spacer height="5px" />
		<p:dataTable id="prodListTbl">

			<p:column headerText="Item" style="width:20%">
				<h:outputText/>
			</p:column>

			<p:column headerText="Specification" style="width:15%"> 
				<h:outputText/>
			</p:column>

			<p:column headerText="Fulfillment Type" style="width:10%">
				<h:outputText/>
			</p:column>

			<p:column headerText="UOM" style="width:10%">
				<h:outputText/>
			</p:column>
			
			<p:column headerText="Quantity/Tier" style="width:10%">
				<h:outputText/>
			</p:column>

			<p:column headerText="Delivery Term" style="width:10%">
				<h:outputText/>
			</p:column>
			
			<p:column headerText="Ceiling Value(RM)" style="width:10%">
				<h:outputText/>
			</p:column>

		</p:dataTable>
	  
	  	<p:commandButton value="Clone" style="float:right;"
					 icon="ui-icon-clone"/>
	</p:panel>
	<p:spacer height="25px" />   
    <p:panel id="servlistId" header="SERVICE LIST" toggleable="true">
		<p:dataTable id="servListTbl">

			<p:column headerText="Item" style="width:20%">
				<h:outputText/>
			</p:column>

			<p:column headerText="Specification" style="width:10%"> 
				<h:outputText/>
			</p:column>

			<p:column headerText="Fulfillment Type" style="width:10%">
				<h:outputText/>
			</p:column>

			<p:column headerText="UOM" style="width:10%">
				<h:outputText/>
			</p:column>
			
			<p:column headerText="Frequency per UOM" style="width:10%">
				<h:outputText/>
			</p:column>

			<p:column headerText="No.UOM per Day" style="width:10%">
				<h:outputText/>
			</p:column>
			
			<p:column headerText="No.UOM per Month" style="width:10%">
			    <h:outputText/>
			</p:column>
			
			<p:column headerText="Duration(Month)" style="width:10%">
				<h:outputText/>
			</p:column>
			<p:column headerText="Qty." style="width:10%">
				<h:outputText/>
			</p:column>

	        <p:column headerText="Ceiling Value(RM)" style="width:10%">
				<h:outputText/>
			</p:column>

		</p:dataTable>
		
		<p:commandButton value="Clone" style="float:right;"
					 icon="ui-icon-clone"/>
	
	</p:panel>
	
</ui:composition>
