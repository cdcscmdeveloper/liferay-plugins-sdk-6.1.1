<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:spacer height="5px" />
	<p:panel id="itemListMainId">
	  <h:panelGroup id="productListId" style="width: 100%;">
		<ac:templateSpec 
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
			editable ="#{simpleQuoteBackingBean.managedBean.editableFlag}"
			newable ="#{simpleQuoteBackingBean.managedBean.newableFlag}"
			title="#{lbl['lbl.ss.simple.quote.product.list']}" />
		
    </h:panelGroup>
		<p:commandButton value="#{lbl['lbl.sc.sq.clone']}" style="float:right;"
			action="#{simpleQuoteBackingBean.cloneAction(ParameterConst.itemListProduct)}"
			icon="ui-icon-clone" process="@this productListId"
			update="@([id$=cloneItemSpec])"
			rendered="#{simpleQuoteBackingBean.managedBean.editableFlag}"
			partialSubmit="true">
		</p:commandButton>

		<p:spacer height="35px" />
	  <h:panelGroup  id="serviceListId" style="width: 100%;">
		 <ac:templateSpec
		    editable ="#{simpleQuoteBackingBean.managedBean.editableFlag}"
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
			newable ="#{simpleQuoteBackingBean.managedBean.newableFlag}"
			title="#{lbl['lbl.ss.simple.quote.service.list']}" />
		
      </h:panelGroup>

		<p:commandButton value="#{lbl['lbl.sc.sq.clone']}" style="float:right;"
			action="#{simpleQuoteBackingBean.cloneAction(ParameterConst.itemListService)}"
			icon="ui-icon-clone" process="@this serviceListId"
			update="@([id$=cloneItemSpec])"
			rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag and simpleQuoteBackingBean.managedBean.panelItemFlag}"
			partialSubmit="true">
		</p:commandButton>

		<ui:include src="/xhtml/sc/directpurchase/common/cloneItemSpecSearch.xhtml" />

	</p:panel>

</ui:composition>
