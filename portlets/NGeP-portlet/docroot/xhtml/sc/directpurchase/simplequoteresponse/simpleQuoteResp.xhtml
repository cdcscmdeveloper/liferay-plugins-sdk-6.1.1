
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="suppViewDtl" header="#{lbl['lbl.sc.supplier.details']}"
		toggleable="true">
		<table style="width: 100%;">
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.supplier.ep.no']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.managedBean.scQuoteSupplier.smSupplier.epNo}" /></td>

				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.supplier']}" /></td>
				<td><p:inputText disabled="true" size="40"
						value="#{simpleQuoteBackingBean.managedBean.scQuoteSupplier.smSupplier.companyName}" /></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.mof.reg.no']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.managedBean.scQuoteSupplier.smSupplier.smMofAccounts[0].mofNo}" />

				</td>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.gst.register.num']}" /></td>
				<td><p:inputText disabled="true" size="40"
						value="#{simpleQuoteBackingBean.managedBean.smGstSupplier.gstRegNo}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.gst.register.num.tooltip']}" />
				</td>
			</tr>

			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.gst.effective.date']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.managedBean.smGstSupplier.gstEffDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.effective.date.tooltip']}" /></td>

				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.gst.declared.date']}" /></td>
				<td><p:inputText disabled="true" size="40"
						value="#{simpleQuoteBackingBean.managedBean.smGstSupplier.gstDeclaredDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.gst.declared.date.tooltip']}" />
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel id="tplSpecId" header="#{lbl['lbl.sc.simple.quote.details']}"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.submit.instruction']}" />

		<br /><br />
		<table style="width: 100%;">
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.panel']}" /></td>
				<td><p:selectOneRadio
						value="#{simpleQuoteBackingBean.managedBean.scQuote.panel}"
						disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.direct.purchase.title']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.title}" /></td>
			</tr>
			<tr>
				<td style="padding-right: 0px; text-align: right; width: 7%"><p:outputLabel
						value="#{lbl['lbl.sc.quote.scope.of.work.and.services']}" /></td>
				<td class="TableFieldRight"><p:commandButton
						oncomplete="uploadDlg.show();return false;" icon="iconAttachment"
						disabled="true"
						value="#{lbl['lbl.txt.choose.files']}" /></td>
			</tr>
			<tr>
				<td />
				<td><ui:param name="attachFile"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.scQuoteAttachment}" />

					<c:if test="#{!empty attachFile}">
						<table>
							<tr>
								<td rowspan="2" style="vertical-align: top;" align="left">
									<ui:param name="icon"
										value="#{simpleQuoteBackingBean.determineIcon(attachFile)}"></ui:param>
									<p:graphicImage value="/css/images/design/#{icon}" height="30"
										width="30">
									</p:graphicImage>
								</td>
								<td><h:outputText
										value="#{attachFile.createdUser.userName}" />, <h:outputText
										value="#{attachFile.createdDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td><h:commandLink value="#{attachFile.fileName}"
										styleClass="blue_font" immediate="true"
										action="#{simpleQuoteBackingBean.downloadFile(attachFile)}" />
									<p:commandLink
										action="#{simpleQuoteBackingBean.deleteUploadFile}"
										immediate="true" update="tplSpecId" disabled="true">
										<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
									</p:commandLink></td>
							</tr>
						</table>
					</c:if></td>
			</tr>



			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.zonal']}" /></td>
				<td>
					<table>
						<tr>
							<td><p:selectOneRadio
									value="#{simpleQuoteBackingBean.managedBean.scQuote.zonal}"
									disabled="true">
									<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}"
										itemValue="true" />
									<f:selectItem itemLabel="#{lbl['lbl.btn.no']}"
										itemValue="false" />
								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><h:panelGroup
									rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panel eq true}">
									<ac:iconTooltip
										value="#{lbl[simpleQuoteBackingBean.managedBean.scQuote.panel ? 'lbl.sc.sq.panel.zonal.tooltip' : 'lbl.sc.sq.normal.zonal.tooltip']}" />
								</h:panelGroup> <h:panelGroup
									rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panel eq false}">
									<ac:iconTooltip
										value="#{lbl[simpleQuoteBackingBean.managedBean.scQuote.zonal ? 'lbl.sc.sq.supplier.zonal.tooltip' : 'lbl.sc.sq.normal.zonal.tooltip']}" />
								</h:panelGroup></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.start.date']}" /></td>
				<td><p:calendar
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.end.date']}" /></td>
				<td><p:calendar
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.simple.quote.type']}" /></td>
				<td>
					<table>
						<tr>
							<td><p:selectOneRadio
									value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}"
									disabled="true">
									<f:selectItem itemLabel="#{lbl['lbl.sc.sq.single']}"
										itemValue="false" />
									<f:selectItem itemLabel="#{lbl['lbl.sc.sq.multiple']}"
										itemValue="true" />
								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.sq.supplier.quotetype.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<p:spacer height="5px" />
		<p:outputPanel autoUpdate="true" id="supplierview">
			<h:panelGroup style="width: 100%;"
				rendered="#{fn:length(simpleQuoteBackingBean.managedBean.productTemplateSpecBean.specAnswerList) ne '0'}">
				<ac:templateSpec
					templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
					title="#{lbl['lbl.sc.simple.quote.product.list']}" />
			</h:panelGroup>

			<h:panelGroup style="width: 100%;"
				rendered="#{fn:length(simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean.specAnswerList) ne '0'}">
				<p:spacer height="25px" />
				<ac:templateSpec
					templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
					title="#{lbl['lbl.sc.simple.quote.service.list']}" />
			</h:panelGroup>
		</p:outputPanel>
	</p:panel>

	<p:panel label="#{lbl['lbl.sc.simple.quote.remark']}"
		header="#{lbl['lbl.sc.simple.quote.remark']}" id="suppRmkId"
		toggleable="true" toggleSpeed="500">
		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" width="16%"></td>
				<td class="TableFieldRight"><p:dataGrid id="catatan"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.remarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" style="vertical-align: top;" align="left">
									<h:graphicImage
										value="#{simpleQuoteBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" />
								</td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
										<f:convertDateTime
											pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea style="width:350px;"
										value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> <h:outputText
										value="#{remarkVar.remark}" rendered="#{remarkIndex>0}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
