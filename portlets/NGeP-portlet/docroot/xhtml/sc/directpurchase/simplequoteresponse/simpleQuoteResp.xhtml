
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="suppViewDtl" header="#{lbl['lbl.sc.supplier.details']}"
		toggleable="true">
		<table style="width: 100%;">
			<tr>
				<td style="width: 22%;"><p:outputLabel
						value="#{lbl['lbl.sc.supplier.ep.no']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.managedBean.scQuoteSupplier.smSupplier.epNo}" /></td>

				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.supplier']}" /></td>
				<td><p:inputText disabled="true" size="40"
						value="#{simpleQuoteBackingBean.managedBean.scQuoteSupplier.supplierName}" /></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.mof.reg.no']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.getText(simpleQuoteBackingBean.managedBean.scQuoteSupplier.mofNumber)}" />

				</td>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.gst.register.num']}" /></td>
				<td><p:inputText disabled="true" size="40"
						value="#{simpleQuoteBackingBean.getText(simpleQuoteBackingBean.managedBean.smGstSupplier.gstRegNo)}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.gst.register.num.tooltip']}" />
				</td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.gst.effective.date']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{simpleQuoteBackingBean.getText(simpleQuoteBackingBean.managedBean.smGstSupplier.gstEffDate)}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.effective.date.tooltip']}" /></td>

				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.gst.declared.date']}" /></td>
				<td><p:inputText disabled="true" size="40"
						value="#{simpleQuoteBackingBean.getText(simpleQuoteBackingBean.managedBean.smGstSupplier.gstDeclaredDate)}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.gst.declared.date.tooltip']}" />
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel id="tplSpecId" header="#{lbl['lbl.sc.simple.quote.details']}"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.submit.instruction']}" />

		<table style="width: 100%;">
			<tr>
				<td style="width: 22%;"><p:outputLabel
						value="#{lbl['lbl.sc.panel']}" /></td>
				<td><p:selectOneRadio styleClass="commonLabel"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.panel}"
						disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="vertical-align: top;"><p:outputLabel
						value="#{lbl['lbl.sc.direct.purchase.title']}" /></td>
				<td colspan="4"><p:inputTextarea
						value="#{simpleQuoteBackingBean.managedBean.scQuote.title}"
						disabled="true" rows="3" autoResize="false" style="width: 800px;" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.quote.scope.of.work.and.services']}" /></td>
				<td colspan="3"><p:commandButton process="@this"
						icon="iconAttachment" disabled="true"
						value="#{lbl['lbl.txt.attachment']}" /> <ui:param
						name="attachFile"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.scQuoteAttachment}" />

					<h:commandLink value="#{attachFile.fileName}" id="attachmentId"
						styleClass="blue_font" immediate="true"
						action="#{simpleQuoteBackingBean.downloadFile(attachFile)}" /></td>
			</tr>

			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.zonal']}" /></td>
				<td>
					<table>
						<tr>
							<td><p:selectOneRadio styleClass="commonLabel"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.zonal}"
									disabled="true">
									<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}"
										itemValue="true" />
									<f:selectItem itemLabel="#{lbl['lbl.btn.no']}"
										itemValue="false" />
								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><h:panelGroup
									rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panel eq true}">
									<ac:iconTooltip
										value="#{lbl[simpleQuoteBackingBean.managedBean.scQuote.panel ? 'lbl.sc.sq.panel.zonal.tooltip' : 'lbl.sc.sq.normal.zonal.tooltip']}" />
								</h:panelGroup> <h:panelGroup
									rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panel eq false}">
									<ac:iconTooltip
										value="#{lbl[simpleQuoteBackingBean.managedBean.scQuote.zonal ? 'lbl.sc.sq.supplier.zonal.tooltip' : 'lbl.sc.sq.normal.zonal.tooltip']}" />
								</h:panelGroup></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.start.date']}" /></td>
				<td><p:calendar
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.end.date']}" /></td>
				<td><p:calendar
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 20%;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.simple.quote.type']}" /></td>
				<td>
					<table>
						<tr>
							<td><p:selectOneRadio styleClass="commonLabel"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}"
									disabled="true">
									<f:selectItem itemLabel="#{lbl['lbl.sc.sq.single']}"
										itemValue="false" />
									<f:selectItem itemLabel="#{lbl['lbl.sc.sq.multiple']}"
										itemValue="true" />
								</p:selectOneRadio></td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.sq.supplier.quotetype.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		
	<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sq.resp.disclaimer']}" />
	<BR />		
	<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sq.resp.price.offered.validity']}" />
		<p:spacer height="2px" />
		<p:outputPanel autoUpdate="true" id="supplierview">
			<h:panelGroup style="width: 100%;"
				rendered="#{fn:length(simpleQuoteBackingBean.managedBean.productTemplateSpecBean.specAnswerList) ne '0'}">
				<ac:templateSpec
					editable="#{simpleQuoteBackingBean.managedBean.submitButtonFlg}"
					templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
					title="#{lbl['lbl.sc.simple.quote.product.list']}" />
			</h:panelGroup>

			<h:panelGroup style="width: 100%;"
				rendered="#{fn:length(simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean.specAnswerList) ne '0'}">
				<p:spacer height="25px" />
				<ac:templateSpec
					editable="#{simpleQuoteBackingBean.managedBean.submitButtonFlg}"
					templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
					title="#{lbl['lbl.sc.simple.quote.service.list']}" />
			</h:panelGroup>
		</p:outputPanel>
	</p:panel>
	
	<ac:scRemarkAndAttachment
		remarkList="#{simpleQuoteBackingBean.managedBean.scQuote.remarks}"
		showAttachment="false" />

</ui:composition>
