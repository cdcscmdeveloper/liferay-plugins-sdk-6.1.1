<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages showDetail="true" autoUpdate="#{simpleQuoteBackingBean.managedBean.autoUpdate}" closable="true"
			severity="error, info" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:outputPanel id="spkiOutputPanel">
			<ac:spkiPopup id="spkiPopup"
				password="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.password}"
				challengeAns1="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.challengeAns1}"
				challengeQues1="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.challengeQues1}"
				postSignAction="#{simpleQuoteBackingBean.updateSupplierResponse(spkiBackingBean.pmDigiSign)}"
				enableAutoUpdate="#{simpleQuoteBackingBean.enableAutoUpdate()}" />		

			<ac:gpkiPopup
				textBeforeSign="#{simpleQuoteBackingBean.textBeforeSign}"
				postSignAction="#{simpleQuoteBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		</p:outputPanel>
		<div class="ppRightBtn">
			<p:outputPanel autoUpdate="true">
				<p:commandButton value="#{lbl['lbl.btn.save']}" process="@form"
					partialSubmit="true" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();"
					rendered="#{simpleQuoteBackingBean.managedBean.saveButtonFlg}"
					action="#{simpleQuoteBackingBean.supplierSave}" />

				<p:commandButton value="#{lbl['lbl.btn.submit']}" process="@form"
					partialSubmit="true"
					action="#{simpleQuoteBackingBean.supplierSubmit}"
					update="spkiOutputPanel" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();"
					rendered="#{simpleQuoteBackingBean.managedBean.submitButtonFlg}">
					<f:setPropertyActionListener value="false"
						target="#{simpleQuoteBackingBean.managedBean.autoUpdate}" />
				</p:commandButton>
			</p:outputPanel>
		</div>
		<ui:include src="/xhtml/sc/directpurchase/simplequoteresponse/simpleQuoteRespHeader.xhtml" />
		<ui:include src="/xhtml/sc/directpurchase/simplequoteresponse/simpleQuoteResp.xhtml" />
	</ui:define>
</ui:composition>
