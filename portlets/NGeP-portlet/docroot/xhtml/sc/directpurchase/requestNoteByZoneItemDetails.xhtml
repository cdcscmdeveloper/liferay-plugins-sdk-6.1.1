<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel id="itemDetailsID" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.sc.panel.title.item.detail']}" />
		</f:facet>

		<h:panelGrid width="100%" style="margin-top:10px" id="itemDtlId">
			<p:dataTable id="requestListDataTable" var="requestNoteDtl" style="white-space: normal;"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtls}"
				rows="10"
				selection="#{requestNoteBackingBean.managedBean.selectedRequestNoteDtls}"
				rowKey="#{requestNoteDtl}" rowIndexVar="rowIndex">
				
				<ui:include src="/xhtml/cc/rowSelectionEvent.xhtml" />
				
				<p:column selectionMode="multiple" style="width:2%" /> 

				<p:column headerText="#{lbl['lbl.sc.request.note.item.name']}" style="width:30%;white-space: normal;">
					<p:commandLink
						value="#{requestNoteDtl.requestItem.itemName}"
						actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
						update=":form:itemDtlPopup" partialSubmit="true" process="@this"
						oncomplete="itemDtlPopup.show();" />
					  <p:spacer width="2px;"/>
					<p:commandLink partialSubmit="true" 
						actionListener="#{requestNoteBackingBean.showPurchaseInDefault(requestNoteDtl)}"
						rendered="#{!empty requestNoteDtl.scRequestSupplierItem.requestNoteItem.purchaseInDefault}">
						<p:graphicImage value="/resources/ep/images/design/document.png" height="15px" width="15px" />
					</p:commandLink>
				</p:column>
				  
				<p:column headerText="#{lbl['lbl.sc.request.note.proc.type']}" style="width:12%;">
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'E'}">
						<p:commandLink value="Emergency" partialSubmit="true" process="@this"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />

					</ui:fragment>
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'A'}">
						<p:commandLink value="Ad hoc" partialSubmit="true" process="@this"
							update=":form:justPopup"
							actionListener="#{requestNoteBackingBean.showReqNotePopUps(requestNoteDtl)}"
							oncomplete="justPopup.show();" />
					</ui:fragment>
					
					<ui:fragment rendered="#{requestNoteDtl.procurementType.parameterCode eq 'G'}">
					     <h:outputText value="#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.procurementType,requestNoteDtl.procurementType.parameterCode)}"/>	
					</ui:fragment>
				</p:column>
				
				<p:column style="width:12%;">
					<f:facet name="header">
				    	<h:outputText value="#{lbl['lbl.sc.request.note.price.type']}" />
					</f:facet>
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(requestNoteDtl.priceType)}" 
					   disabled="true" style="margin-top: 8px;" size="15" />
				</p:column>
				
			    <p:column headerText="#{lbl['lbl.sc.request.note.fulfill.type']}"  style="width:10%;">
					<p:inputText value="#{requestNoteBackingBean.getParameterDesc(requestNoteDtl.fulfilmentType)}" 
					   disabled="true" size="6" style="margin-top: 8px;"  />
				</p:column>
				
				<p:column style="width:10%;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.request.note.loa.prepare.by']}" />
					</f:facet>
					<p:selectOneMenu value="#{requestNoteDtl.assignedUser.userId}" style="width:120px;" 
					   id="prepareBy" label="#{lbl['lbl.sc.request.note.loa.prepare.by']}" 
					   required="#{!requestNoteDtl.selected}">  
					   <f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
					   <f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}" 
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
								<p:ajax event="change" update="prepareBy" partialSubmit="true"
									process="@this"
									listener="#{requestNoteBackingBean.applyForSupplierRecs(requestNoteDtl, requestNoteDtl.assignedUser.userId)}" />
					</p:selectOneMenu>
					   <p:message id="prepareByMsg" for="prepareBy" display="icon" />
				</p:column>
			
			    <p:column style="width:10%;">
			          <f:facet name="header">
						 <h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}" />
					</f:facet>
					<p:inputText style="width:25px;text-align:right;margin-top: 8px;margin-right: 1px;" 
					   label="#{lbl['lbl.sc.request.note.delivery.term']}" disabled="true"
					   size="6" maxlength="4"
					   id="deliveryTerm" value="#{requestNoteDtl.deliverTerm}" required="#{!requestNoteDtl.selected}">
					   </p:inputText>
				
					  <p:inputText value="#{requestNoteBackingBean.getParameterDesc(requestNoteDtl.deliverTermType)}" 
					   disabled="true" style="margin-top: 8px;" size="8" />
					  
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		
		<p:panelGrid styleClass="noBorders tr,noBorders td"  id="prepareBy" >
			<p:row>
				<p:column>
					<h:outputText value="#{lbl['lbl.sc.request.note.prepare.by']}"></h:outputText>
					<p:spacer width="6px;"></p:spacer>
					<p:selectOneMenu 
						value="#{requestNoteBackingBean.managedBean.assignedToUserId}"
					    disabled="false">
						 <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.userList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"></f:selectItems>
					</p:selectOneMenu>
					
					<p:spacer width="6px;"/>
					<h:outputText value="#{lbl['lbl.sc.request.note.delivery.term']}"></h:outputText>
					<p:spacer width="6px;"/>
					<p:inputText id="periodId" style="width:20px;text-align:right;margin-top: 7px;" required="false"
						value="#{requestNoteBackingBean.managedBean.periodValue}" />
					<p:spacer width="4px;"/>
					<p:selectOneMenu id="periodMode" 
						value="#{requestNoteBackingBean.managedBean.periodType}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.deliveryTerm)}"/>
					</p:selectOneMenu>
					<p:spacer width="5px;"/>
					<p:commandButton value="#{lbl['lbl.sc.action.apply.btn']}"
					    partialSubmit="true" icon="ui-icon-submit" process="@this itemDetailsID"
						action="#{requestNoteBackingBean.applyForRequestNote}"
						update="@([id$=requestListDataTable])" />
              </p:column>
               
				<p:column width="100%" style="text-align:right">
				 <c:if test="#{requestNoteBackingBean.managedBean.requestNoteStatus eq 'Pending Submission'}">
					<p:commandButton
						value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
						process="@this,requestListDataTable" partialSubmit="true"
						action="#{requestNoteBackingBean.deleteRequestNoteDtl}"
						update="@([id$=requestListDataTable])" icon="ui-icon-delete" />
				</c:if>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
</ui:composition>
