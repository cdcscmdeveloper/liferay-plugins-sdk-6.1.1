<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="recentPrice" widgetVar="recentPricePopup" position="center"
		header="#{lbl['lbl.sc.recent.price']}" modal="true"
		width="500" height="100" >
		<table>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.duration.days']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="duration"
						value="#{requestNoteBackingBean.managedBean.recentPriceDuration}">
						<f:selectItems
							value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.recentPriceDuration)}" />
					</p:selectOneMenu></td>
			</tr>
		</table>

		<div class="ppRightBtn" style="width: 100%">
			<p:commandButton value="#{lbl['lbl.btn.view']}" ajax="false" styleClass="BtnSpacing">
				<p:fileDownload value="#{requestNoteBackingBean.viewRecentPrice()}" />
			</p:commandButton>

			<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
			    styleClass="BtnSpacing"
				oncomplete="recentPricePopup.hide();" partialSubmit="true" />
		</div>

	</p:dialog>
</ui:composition>
