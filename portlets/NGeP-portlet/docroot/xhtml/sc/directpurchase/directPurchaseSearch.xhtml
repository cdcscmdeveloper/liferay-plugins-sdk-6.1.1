<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		<ac:lovPopup />
		<p:panel id="searchPanel" header="#{lbl['lbl.sc.search']}"
			toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel id="searchMinistryLbL1"
							value="#{lbl['lbl.sc.ministry']}" rendered="#{directPurchaseBackingBean.showRoleType() and directPurchaseBackingBean.managedBean.showMinistryPtjField}"/></td>
					<td colspan="3"><ac:lov id="searchMinistry1" 
							lovId="PM_ORG_PROFILE_MINSTRY" size="118" readonly="true"
							headerText="#{lbl['lbl.sc.ministry']}"
							disabled="#{directPurchaseBackingBean.managedBean.disableMinistryPtjLov}"
							value="#{directPurchaseBackingBean.managedBean.searchMinistryProfile.orgName}"
							postUpdateListener="directPurchaseBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="directPurchaseBackingBean.managedBean.searchMinistryProfile" rendered="#{directPurchaseBackingBean.showRoleType() and directPurchaseBackingBean.managedBean.showMinistryPtjField}">
						</ac:lov></td>
				</tr>
				<tr>
					<td><p:outputLabel id="searchPtjGroupLbL1"
							value="#{lbl['lbl.sc.kumpulan.ptj']}" rendered="#{directPurchaseBackingBean.showRoleType() and directPurchaseBackingBean.managedBean.showMinistryPtjField}"/></td>
					<td colspan="3"><ac:lov id="searchPtjGroup1" 
							lovId="PM_ORG_PROFILE_PTJ_GROUP" size="118" readonly="true"
							headerText="#{lbl['lbl.sc.kumpulan.ptj']}"
							disabled="#{directPurchaseBackingBean.managedBean.disableMinistryPtjLov}"
							value="#{directPurchaseBackingBean.managedBean.searchPtjGroupProfile.orgName}"
							postUpdateListener="directPurchaseBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="directPurchaseBackingBean.managedBean.searchPtjGroupProfile"
							conditionField="#{directPurchaseBackingBean.getPTJGroupCondition()}" rendered="#{directPurchaseBackingBean.showRoleType() and directPurchaseBackingBean.managedBean.showMinistryPtjField}"></ac:lov></td>
				</tr>

				<tr>
					<td><p:outputLabel id="searchPtjLbL1"
							value="#{lbl['lbl.sc.ptj']}" rendered="#{directPurchaseBackingBean.showRoleType() and directPurchaseBackingBean.managedBean.showMinistryPtjField}"/></td>
					<td colspan="3"><ac:lov id="searchPtj1" 
							lovId="PM_ORG_PROFILE_PTJ" size="118" readonly="true"
							headerText="#{lbl['lbl.sc.ptj']}"
							disabled="#{directPurchaseBackingBean.managedBean.disableMinistryPtjLov}"
							value="#{directPurchaseBackingBean.managedBean.searchPtjProfile.orgName}"
							postUpdateListener="directPurchaseBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="directPurchaseBackingBean.managedBean.searchPtjProfile"
							conditionField="#{directPurchaseBackingBean.getPtjCondition()}" rendered="#{directPurchaseBackingBean.showRoleType() and directPurchaseBackingBean.managedBean.showMinistryPtjField}">
						</ac:lov></td>
				</tr>
				<!-- Redmine 25396: remove duplication option view by adding new drop down field -->  
				<tr>
					<td width="22%"><p:outputLabel
							value="#{lbl['lbl.sc.document.viewas']}"
							rendered="#{directPurchaseBackingBean.showFunctionType()}" />
						<p:outputLabel value="*" rendered="#{directPurchaseBackingBean.showFunctionType()}" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="viewAs" style="width: 250px;"
							value="#{directPurchaseBackingBean.managedBean.searchFunctionType}" 
							rendered="#{directPurchaseBackingBean.showFunctionType()}">
							<f:selectItems
								value="#{directPurchaseBackingBean.getFunctionType()}" />
							<p:ajax event="change" update="@form" listener="#{directPurchaseBackingBean.getDocTypesByViewAs}" />
						</p:selectOneMenu><ac:iconTooltip value="#{lbl['lbl.tooltip.directpurchase.search.view.as']}" rendered="#{directPurchaseBackingBean.showFunctionType()}" /></td>	
				</tr>
				<!-- end 25396: -->
				<tr>
					<td width="22%"><p:outputLabel
							value="#{lbl['lbl.sc.document.type']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu id="seldoctype" style="width: 250px;"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentType}">
							<f:selectItems
								value="#{directPurchaseBackingBean.managedBean.documentTypes}" />
							<p:ajax event="change" update=":form:selstatus"
								listener="#{directPurchaseBackingBean.searchStatusDesc}" />
						</p:selectOneMenu></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.document.title']}" /></td>
					<td colspan="3"><p:inputText size="148"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentTitle}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.document.no']}" /></td>
					<td><p:inputText size="35"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentNo}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar showOn="button" size="35"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentFromDuration}">
							<p:ajax event="dateSelect" update="toDate" />
						</p:calendar></td>

					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar showOn="button" size="20"
							mindate="#{directPurchaseBackingBean.managedBean.searchDocumentFromDuration}"
							id="toDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentToDuration}">
						</p:calendar></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:selectOneMenu id="selstatus" style="width: 250px;"
							value="#{directPurchaseBackingBean.managedBean.searchStatusId}">
							<f:selectItems
								value="#{directPurchaseBackingBean.searchStatusDesc()}" />
						</p:selectOneMenu></td>
				</tr>
			</table>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{directPurchaseBackingBean.search}" update="resultPanel" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{directPurchaseBackingBean.reset(false)}" update=":form" onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.sc.result']}"
			toggleable="true">

			<p:dataTable id="scDocumentTableID" lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{directPurchaseBackingBean.managedBean.dpDocumentDataModel}"
				var="Obj" width="100%" rows="10">

				<ac:paginator for="scDocumentTableID"></ac:paginator>


				<p:column style="width:10%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.ptj']}" />
					</f:facet>
					#{directPurchaseBackingBean.getOrgName(Obj[7])}
				</p:column>


				<p:column width="10%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.document.type']}" />
					</f:facet>
					#{directPurchaseBackingBean.managedBean.documentTypeDesc}
				</p:column>

				<p:column width="10%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.document.no']}" />
					</f:facet>
					#{Obj[1]}
				</p:column>

				<p:column width="40%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.document.title']}" />
					</f:facet>

					<h:outputText value="#{Obj[5]}"
						style="white-space: normal;word-wrap: break-word;" />
				</p:column>

				<p:column width="20%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.status']}" />
					</f:facet>
					
						<h:outputText value="#{directPurchaseBackingBean.getDocStatus(Obj)}"
							style="white-space: normal;word-wrap: break-word;" />						
				</p:column>
				
				<p:column width="10%" style="text-align: center;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.action']}" />
					</f:facet>

					<!-- Redmine 25396: remove duplication option view by adding new drop down field -->  
					<p:menuButton value="#{lbl['lbl.btn.option']}">			
					
						<p:menuitem id="viewBtnIconDualRole" value="#{lbl['lbl.btn.view']}"
							icon="ui-icon-view"
							action="#{directPurchaseBackingBean.performViewDoc(Obj)}" /> 

						<p:menuitem id="printBtnIcon" value="#{lbl['lbl.btn.print']}"
							ajax="false"
							rendered="#{!directPurchaseBackingBean.showFunctionType()}"
							icon="ui-icon-print"
							action="#{directPurchaseBackingBean.generateReport(Obj)}" />
							
						<p:menuitem id="printBtnIconDualRole" value="#{lbl['lbl.btn.print']}"
							ajax="false"
							rendered="#{directPurchaseBackingBean.showFunctionType() and directPurchaseBackingBean.managedBean.viewAsPTJ}"
							icon="ui-icon-print"
							action="#{directPurchaseBackingBean.generateReport(Obj)}" />

					</p:menuButton>
					<!-- end 25396: -->
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
