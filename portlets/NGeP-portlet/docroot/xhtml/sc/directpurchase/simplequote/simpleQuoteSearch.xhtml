<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:panel header="Search" id="sqSearchId" toggleable="true">
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				
				<tr>
					<td style="width: 20%;"><p:outputLabel value="#{lbl['lbl.sc.document.title']}" /></td>
					<td colspan="3"><p:inputText size="96"
							value="#{simpleQuoteBackingBean.managedBean.searchTitle}"
							style="margin-bottom: 5px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.sq.simple.quote.no']}" /></td>
					<td colspan="3"><p:inputText
							value="#{simpleQuoteBackingBean.managedBean.searchQuoteNo}"
							size="16" style="margin-bottom: 5px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" /></td>
					<td><p:selectOneMenu style="margin-bottom: 5px; width: 154px;"
							value="#{simpleQuoteBackingBean.managedBean.searchProcType}">
							<f:selectItems
								value="#{simpleQuoteBackingBean.getDropdownCodeValues(ParameterTypeConst.procurementType)}" />
						</p:selectOneMenu></td>
						
					<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:selectOneMenu style="width: 154px;"
							value="#{simpleQuoteBackingBean.managedBean.searchStatus}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems value="#{simpleQuoteBackingBean.statusDescList}"
								var="pmStatusDesc" itemLabel="#{pmStatusDesc.statusName}"
								itemValue="#{pmStatusDesc.pmStatus.statusId}">
							</f:selectItems>
						</p:selectOneMenu></td>	
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar showOn="button" size="25"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{simpleQuoteBackingBean.managedBean.searchFromCreatedDate}">
							<p:ajax event="dateSelect" update="toDate" />
						</p:calendar></td>

					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar showOn="button" size="25"
							mindate="#{simpleQuoteBackingBean.managedBean.searchFromCreatedDate}"
							id="toDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{simpleQuoteBackingBean.managedBean.searchToCreatedDate}">
						</p:calendar></td>
				</tr>
			</table>
			<div class="ppRightBtn BtnSpacing">
				<p:commandButton value="#{lbl['lbl.btn.search']}" 
					action="#{simpleQuoteMB.searchSimpleQuote}"
					update="scQuoteDataModel" process="@this sqSearchId" />

				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{simpleQuoteBackingBean.reset}"
					update="@([id$=sqSearchId])" resetValues="true"
					partialSubmit="true" process="@this" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
			<p:dataTable id="scQuoteDataModel"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{simpleQuoteBackingBean.managedBean.scQuoteDataModel}"
				var="scQuote" rows="10" rowIndexVar="index" lazy="true">
				<ac:paginator for="scQuoteDataModel" />

				<p:column style="width: 14%;"
					headerText="#{lbl['lbl.sc.sq.simple.quote.no']}">
					<h:outputText value="#{scQuote.quoteNo}" />
				</p:column>

				<p:column style="width:45%"
					headerText="#{lbl['lbl.sc.document.title']}">
					<h:outputText value="#{scQuote.title}" />
				</p:column>

				<p:column style="width: 10%;"
					headerText="#{lbl['lbl.sc.procurement.type']}">
					<h:outputText
						value="#{requestNoteBackingBean.getParameterDesc(scQuote.procurementType)}" />
				</p:column>

				<p:column style="width: 8%;"
					headerText="#{lbl['lbl.sc.created.date']}">
					<h:outputText value="#{scQuote.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column style="width: 22%;"
					headerText="#{lbl['lbl.sc.prepared.by']}">
					<h:outputText
						value="#{simpleQuoteBackingBean.showCreatedBy(scQuote.createdBy)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.status']}">
				    #{simpleQuoteBackingBean.getStatusDescById(scQuote.currentStatus.pmStatus.statusId)}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}"
					style="text-align: center;">
				<p:commandLink
					action="#{simpleQuoteBackingBean.viewQuote(scQuote.quoteId)}"
					partialSubmit="true" process="@this">
					<p:graphicImage value="/css/images/design/document.png" />
				</p:commandLink>
		   </p:column>
		 </p:dataTable>

		</p:panel>
	</ui:define>
</ui:composition>
