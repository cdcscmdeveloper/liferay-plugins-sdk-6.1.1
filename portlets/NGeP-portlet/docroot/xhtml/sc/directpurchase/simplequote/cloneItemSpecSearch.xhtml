<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneItemSpec" widgetVar="cloneItemSpec" width="800"
		header="#{lbl['lbl.sc.quote.clone.item.spec']}" resizable="false" dynamic="true" modal="true" closable="false">
		<p:panel header="#{lbl['lbl.sc.search']}" id="cloneItemSpecId" toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td style="width: 20%;"><p:outputLabel
							value="#{lbl['lbl.sc.sq.simple.quote.no']}" /></td>
					<td style="width: 19%;"><p:inputText size="20"
							value="#{simpleQuoteBackingBean.managedBean.searchQuoteNo}"
							style="margin-bottom: 5px;" /></td>
				</tr>
				<tr>
					<td style="width: 19%;"><p:outputLabel
							value="#{lbl['lbl.sc.document.title']}" /></td>
					<td style="width: 19%;" colspan="4"><p:inputText size="72"
							value="#{simpleQuoteBackingBean.managedBean.searchTitle}"
							style="margin-bottom: 5px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" /></td>
					<td><p:selectOneMenu style="margin-bottom: 5px; width: 155px;"
							value="#{simpleQuoteBackingBean.managedBean.searchProcType}">
							<f:selectItems
								value="#{simpleQuoteBackingBean.getDropdownCodeValues(ParameterTypeConst.procurementType)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="width: 19%;"><p:outputLabel
							value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{simpleQuoteBackingBean.managedBean.searchFromCreatedDate}">
							<p:ajax event="dateSelect" update="toDate" />
						</p:calendar></td>

					<td style="width: 22%;"><p:outputLabel
							value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar showOn="button"
							mindate="#{simpleQuoteBackingBean.managedBean.searchFromCreatedDate}"
							id="toDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{simpleQuoteBackingBean.managedBean.searchToCreatedDate}">
						</p:calendar></td>
				</tr>

			</table>
			
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
				    styleClass="BtnSpacing"
					action="#{simpleQuoteMB.searchCloneItemSpec}"
					id="cloneItemSearchBtn" update="scQuoteDataModel"
					process="@this ,cloneItemSpecId" />
					
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
				    styleClass="BtnSpacing"
					action="#{simpleQuoteBackingBean.reset}"
					update="@([id$=cloneItemSpecId])" resetValues="true"
					partialSubmit="true" process="@this" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.result']}" toggleable="true"
			id="citemId">
			<p:dataTable id="scQuoteDataModel"
				value="#{simpleQuoteBackingBean.managedBean.scQuoteDataModel}"
				var="scQuote"
				selection="#{simpleQuoteBackingBean.managedBean.selectedQuote}"
				selectionMode="single" rowKey="#{scQuote.quoteId}" rows="5"
				rowIndexVar="index" lazy="true">
				<ac:paginator for="scQuoteDataModel" />

				<p:column headerText="#{lbl['lbl.sc.sq.simple.quote.no']}">
					<h:outputText value="#{scQuote.quoteNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.document.title']}">
					<h:outputText value="#{scQuote.title}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.procurement.type']}">
					<h:outputText
						value="#{requestNoteBackingBean.getParameterDesc(scQuote.procurementType)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.created.date']}">
					<h:outputText value="#{scQuote.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.prepared.by']}">
					<h:outputText
						value="#{simpleQuoteBackingBean.showCreatedBy(scQuote.createdBy)}" />
				</p:column>
			</p:dataTable>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.proceed']}"
				    styleClass="BtnSpacing"
					action="#{simpleQuoteBackingBean.addCloneItemSpec(simpleQuoteBackingBean.managedBean.productOrService)}"
					partialSubmit="true" process="@this citemId"
					update="@([id$=itemListMainId])" oncomplete="cloneItemSpec.hide()" />

				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				    styleClass="BtnSpacing"
					onclick="cloneItemSpec.hide()" immediate="true" />
			</div>

		</p:panel>

		<p:defaultCommand target="cloneItemSearchBtn"></p:defaultCommand>
		</p:dialog>
</ui:composition>
