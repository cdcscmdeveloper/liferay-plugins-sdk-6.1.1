<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="itemListMainId">
	 <ui:include src="/xhtml/sc/common/specGuideLineInstructions.xhtml"></ui:include>
	  <ui:include src="/xhtml/common/uominstruction.xhtml"></ui:include>
	  <ui:include src="/xhtml/common/uompopinclude.xhtml"></ui:include>
	 <h:panelGroup id="productListId" style="width: 100%;">
		<ac:templateSpec 
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
			editable ="#{isEditable}"
			newable ="#{simpleQuoteBackingBean.managedBean.newableFlag}"
			removable ="#{simpleQuoteBackingBean.managedBean.removableFlag}"
			addNewSpec="#{simpleQuoteBackingBean.managedBean.addNewSpecFlag}"
			title="#{lbl['lbl.sc.simple.quote.product.list']}" />

			<div class="ppRightBtn" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.btn.clone']}"
					id="cloneButtonProduct"
					styleClass="BtnSpacing"
					action="#{simpleQuoteBackingBean.cloneAction(ParameterConst.itemListProduct)}"
					process="@this productListId" update="@([id$=cloneItemSpec])"
					rendered="#{isEditable and simpleQuoteBackingBean.managedBean.panelItemFlag}"
					partialSubmit="true"
					title="#{lbl['lbl.sc.sq.clonebtn.tooltip']}">

				</p:commandButton>
			</div>
	</h:panelGroup>
	<h:panelGroup  id="serviceListId" style="width: 100%;">
		 <ac:templateSpec
		    editable ="#{isEditable}"
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
			newable ="#{simpleQuoteBackingBean.managedBean.newableFlag}"
			removable ="#{simpleQuoteBackingBean.managedBean.removableFlag}"
			addNewSpec="#{simpleQuoteBackingBean.managedBean.addNewSpecFlag}"
			title="#{lbl['lbl.sc.simple.quote.service.list']}" />
			
		<div class="ppRightBtn" style="width: 100%">
		  <p:commandButton value="#{lbl['lbl.btn.clone']}"
			id="cloneButtonService"
			styleClass="BtnSpacing"
			action="#{simpleQuoteBackingBean.cloneAction(ParameterConst.itemListService)}"
		    process="@this serviceListId"
			update="@([id$=cloneItemSpec])"
			rendered="#{isEditable and simpleQuoteBackingBean.managedBean.panelItemFlag}"
			partialSubmit="true"
			title="#{lbl['lbl.sc.sq.clonebtn.tooltip']}">
		</p:commandButton>
	   </div>
     </h:panelGroup>

	<ui:include src="/xhtml/sc/directpurchase/simplequote/cloneItemSpecSearch.xhtml" />
	
		<p:dialog id="itemSpecificationDlg"
			widgetVar="itemSpecificationDlgVar"
			header="#{lbl['lbl.ct.item.specification.list']}" 
			styleClass="pop_up_top" modal="true"
			width="700" resizable="false">
			<h:panelGrid columns="1">
				<p:outputLabel
					value="#{lbl['lbl.ct.item.name']}: #{simpleQuoteBackingBean.managedBean.panelItems[0].itemName}" />
			</h:panelGrid>
			<p:dataTable id="itemSpecDescTbl"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="ctPanelItemSpec" rowIndexVar="index"
				value="#{simpleQuoteBackingBean.managedBean.panelItems[0].ctPanelItemSpecs}">
				<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
					style="width:45%; white-space:normal">
					<p:inputTextarea value="#{ctPanelItemSpec.specification}"
						maxlength="200" rows="3" style="width:98%;" autoResize="false" disabled="true" />
				</p:column>
				<p:column headerText="#{lbl['lbl.cm.description']}"
					style="width:45%; white-space:normal">
					<p:inputTextarea value="#{ctPanelItemSpec.description}" maxlength="200" rows="3" style="width:98%;" autoResize="false"
						disabled="true" />
				</p:column>
			</p:dataTable>
			<p:spacer height="2" />
			<div class="ppRightBtn"> 
				<p:commandButton value="#{lbl['lbl.btn.close']}"  onclick="itemSpecificationDlgVar.hide();" />
			</div>
		</p:dialog>
</p:panel>

</ui:composition>
