<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="zonePanel"
		header="#{lbl['lbl.sc.simple.quote.delivery.location']}"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.sq.deliverylocation.instruction']}">
		</h:outputText>

		<table style="width: 100%">
			<tr>
				<td style="width: 160px"><p:outputLabel
						value="#{lbl['lbl.sc.sq.delivery.coverage']}" /></td>
				<td style="width: 180px; margin-bottom: 5px;"><p:selectOneMenu
						id="locLevels"
						value="#{simpleQuoteBackingBean.managedBean.locationLevel}"
						disabled="#{!isEditable || simpleQuoteBackingBean.managedBean.scQuote.panel}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItems
							value="#{simpleQuoteBackingBean.locationLevelDropdown}" />
						<p:ajax event="change" update="zonePanel" partialSubmit="true"
							process="@this"
							listener="#{simpleQuoteBackingBean.zoneLocLevelEvent}" />
					</p:selectOneMenu></td>
				<td><ac:iconTooltip
						value="#{lbl['lbl.sc.locationlevel.tooltip']}" /></td>
			</tr>
		</table>

		<h:panelGroup
			rendered="#{!simpleQuoteBackingBean.managedBean.scQuote.panel}">
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneLocationDataTable"
					value="#{simpleQuoteBackingBean.managedBean.zoneTrees}"
					var="zoneTree" rowIndexVar="index">

					<p:column headerText="#{lbl['lbl.sc.location.name']}">

						<p:tree value="#{zoneTree}" var="location" id="treeid"
							selectionMode="checkbox">

							<p:ajax event="select"
								listener="#{simpleQuoteBackingBean.selectZoneTreeNode}" />
							<p:ajax event="unselect"
								listener="#{simpleQuoteBackingBean.unSelectZoneTreeNode}" />

							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column style="text-align: center;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.action']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.sq.location.action.tooltip']}" />
						</f:facet>
						<p:commandLink
							actionListener="#{simpleQuoteBackingBean.editZone(zoneTree,index)}"
							rendered="#{isEditable}"
							process="@this " update="@([id$=zonePopupPanel])"
							oncomplete="ZoneLocation.show();">
							<p:graphicImage value="/css/images/design/edit.png" />
						</p:commandLink>

					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 100%" class="BtnSpacing">
				<c:if test="#{isEditable}">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						process="@this,locLevels" update="@([id$=zonePopupPanel])"
						partialSubmit="true" oncomplete="ZoneLocation.show();"
						actionListener="#{simpleQuoteBackingBean.showZonePopup}" />

					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this, zoneLocationDataTable" partialSubmit="true"
						oncomplete="deliveryLocationDeletePopUp.show();"
						update="@([id$=#{deliveryLocationDeleteId}])" />
				</c:if>
			</div>
			<ac:confirmationPopup id="deliveryLocationDeleteId"
				widget="deliveryLocationDeletePopUp"
				okAction="simpleQuoteBackingBean.deleteZoneTreeNode" width="400" height="100" 
			    title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		</h:panelGroup>

		<!-- panel item zone -->
		<h:panelGroup
			rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panel}">
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="panelzoneDataTable"
					value="#{simpleQuoteBackingBean.managedBean.zoneTrees}"
					var="zoneTree" rowIndexVar="index">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location"
							selectionMode="checkbox">
							<p:ajax event="select"
								listener="#{simpleQuoteBackingBean.selectPanelItemZone}" />
							<p:ajax event="unselect"
								listener="#{simpleQuoteBackingBean.unSelectPanelItemZone}" />

							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>

				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 100%">
				<c:if test="#{isEditable}">
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
					    styleClass="BtnSpacing"
						process="@this, panelzoneDataTable" partialSubmit="true"
						oncomplete="deliveryZoneDeletePopUp.show();"
						update="@([id$=#{deliveryZoneDeleteId}])" />
				</c:if>
			</div>

			<ac:confirmationPopup id="deliveryZoneDeleteId"
				widget="deliveryZoneDeletePopUp"
				okAction="simpleQuoteBackingBean.deleteZoneTreeNode" 
				width="400" height="100" 
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		</h:panelGroup>
	</p:panel>
	<ui:include
		src="/xhtml/sc/directpurchase/simplequote/SimpleQuoteZonePopup.xhtml" />
</ui:composition>
