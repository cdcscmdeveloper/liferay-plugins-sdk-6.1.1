<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="sqinfoId" header="#{lbl['lbl.sc.simple.quote.information']}" toggleable="true">
	  <table style="width:100%;">
			<tr>
				<td style="width:20%"><p:outputLabel
						value="#{lbl['lbl.sc.panel']}" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td><p:selectOneRadio id="panel" required="true"
							        styleClass="commonLabel"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.panel}"
									label="#{lbl['lbl.sc.panel']}" disabled="true">
									<f:selectItems
										value="#{simpleQuoteBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								</p:selectOneRadio></td>

							<td style="margin-top: -3px"><p:message id="panelMsg" for="panel" display="icon" />
								<ac:iconTooltip value="#{lbl['lbl.sc.sq.panel.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.direct.purchase.title']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td><p:inputText size="84" id="title" required="true"
									maxlength="100" label="#{lbl['lbl.sc.direct.purchase.title']}"
									disabled="#{!isEditable}"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.title}"
									style="margin-bottom: 5px;" /></td>
							<td><p:message id="titleMsg" for="title" display="icon" /></td>
						</tr>
					</table>
				</td>
			</tr>
				<tr>
					<td style="padding-right: 0px; text-align: right; width: 7%"><p:outputLabel
							value="#{lbl['lbl.sc.quote.scope.of.work.and.services']}" /></td>
					<td class="TableFieldRight"><p:commandButton
							oncomplete="uploadDlg.show();return false;" icon="iconAttachment"
							update="sqinfoId" disabled="#{!isEditable}"
							value="#{lbl['lbl.txt.choose.files']}" /></td>
				</tr>
			<tr>
				<td />
				<td style="width: 23%"><ui:param name="attachFile"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.scQuoteAttachment}" />

					<c:if test="#{!empty attachFile}">
						<table style="width: 100%">
							<tr>
								<td rowspan="2" style="vertical-align: top;" align="left">
									<ui:param name="icon"
										value="#{simpleQuoteBackingBean.determineIcon(attachFile)}"></ui:param>
									<p:graphicImage value="/css/images/design/#{icon}" height="30"
										width="30">
									</p:graphicImage>
								</td>
								<td><h:outputText
										value="#{attachFile.createdUser.userName}" />, <h:outputText
										value="#{attachFile.createdDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td><h:commandLink value="#{attachFile.fileName}"
										styleClass="blue_font" immediate="true"
										action="#{simpleQuoteBackingBean.downloadFile(attachFile)}" />
									<p:commandLink
										action="#{simpleQuoteBackingBean.deleteUploadFile}"
										immediate="true" update="sqinfoId" disabled="#{!isEditable}">
										<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
									</p:commandLink></td>
							</tr>
						</table>
					</c:if></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurment.type.category']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td><p:selectOneMenu id="procTypeCategory"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.procurementTypeCategory.parameterId}"
									disabled="#{!isEditable}"
									style="width:220px;margin-bottom: 5px;margin-top: 5px;" required="true"
									label="#{lbl['lbl.sc.procurment.type.category']}">

									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
										itemValue="#{null}" />
									<f:selectItems
										value="#{simpleQuoteBackingBean.procTypeCategories}"
										var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
										itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
								</p:selectOneMenu> <p:message id="procTypeCategoryMsg" for="procTypeCategory"
									display="icon" /></td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td><p:selectOneRadio style="margin-bottom: 5px;"
							        styleClass="commonLabel"
									disabled="#{!isEditable}"
									id="procurementType" required="true"
									label="#{lbl['lbl.sc.procurement.type']}"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode}">
									<f:selectItems
										value="#{simpleQuoteBackingBean.managedBean.procurementTypes}" />
									<p:ajax event="change" update="@([id$=justId])"
										listener="#{simpleQuoteBackingBean.procurementTypeEvent}"
										process="@this" />
								</p:selectOneRadio></td>

							<td style="margin-top: -3px"><p:message id="procTypeMsg" for="procurementType"
									display="icon" /> <ac:iconTooltip
									value="#{lbl['lbl.sc.procurementtype.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
			<td colspan="4"><p:outputPanel id="justId">
				<table style="width: 100%">
				    <tr>
					   <ui:fragment rendered="#{simpleQuoteBackingBean.managedBean.procTypeOption}">
						 <td style="width: 20%">
						     <p:outputLabel value="#{lbl['lbl.sc.reason']}" />
						     <p:outputLabel value="*" styleClass="mandatory" />
						 </td>
						 <td style="width: 85%"> <p:selectOneMenu style="width: 220px;margin-bottom: 5px;" id="justificationId" label="#{lbl['lbl.sc.reason']}"
						       required="#{simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode eq 'A'}"
						         disabled="#{!isEditable}" 
								value="#{simpleQuoteBackingBean.managedBean.scQuote.justificationType.parameterCode}">
							   <f:selectItems
									value="#{simpleQuoteBackingBean.managedBean.justDropdown}" />
								<p:ajax event="change" update="justId" process="@this" />
							</p:selectOneMenu> 
								<p:message id="justTypeMsg" for="justificationId" display="icon" />
							</td>
			    	</ui:fragment>
				</tr>
				<tr>
				   <ui:fragment rendered="#{simpleQuoteBackingBean.managedBean.procTypeOption}">
					<td style="vertical-align:top; text-align:left;">
						<p:outputLabel value="#{lbl['lbl.sc.justification']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td colspan="4"><p:inputTextarea value="#{simpleQuoteBackingBean.managedBean.scQuote.justificationRemark}"
					          id="justificationRmk" label="#{lbl['lbl.sc.justification']}" maxlength="100"
					           disabled="#{!isEditable}"
					          required="#{simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode eq 'A'}"
							rows="3" cols="58" style="margin-bottom: 5px; width: 210px;" /> <p:message id="justRmksMsg" for="justificationRmk" display="icon" /></td>
				 </ui:fragment>
			    </tr>
				</table>
			   </p:outputPanel></td>
			</tr>
			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.sc.sq.zonal']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td><p:selectOneRadio id="zonal" required="true"
							        styleClass="commonLabel"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.zonal}"
									label="#{lbl['lbl.sc.sq.zonal']}"
									disabled="#{!isEditable or simpleQuoteBackingBean.managedBean.scQuote.panel eq 'true'}">
									<f:selectItems
										value="#{simpleQuoteBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
									<p:ajax event="change" update="@([id$=mainTabMenu])"
										process="@this" listener="#{simpleQuoteBackingBean.zoneEvent}" />
								</p:selectOneRadio></td>

							<td style="margin-top: -3px"><p:message id="zonalMsg" for="zonal" display="icon" />
								<ac:iconTooltip value="#{lbl['lbl.sc.sq.zonal.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>
			
			<tr>
				<td style="width: 15%;">
				<p:outputLabel value="#{lbl['lbl.sc.start.date']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td style="width: 30%;">
					<table><tr><td> 
							<p:calendar showOn="button" id="startDate"  
							        mindate="#{simpleQuoteBackingBean.managedBean.today}"
							        required="true"
							        disabled="#{!isEditable}"
									label="#{lbl['lbl.sc.start.date']}" 
									readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}">
									<p:ajax event="dateSelect" update="@([id$=endDate])" process="@this" partialSubmit="true"
										listener="#{simpleQuoteBackingBean.dateListener}" />
							</p:calendar></td>
							<td><p:message id="startDateMsg" for="startDate" display="icon" /></td>
						</tr>
					</table>
				  </td>
				   <td style="width: 20%;">
				     <p:outputLabel value="#{lbl['lbl.sc.end.date']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>

				    <td style="width: 40%;">
					      <table><tr><td><p:calendar showOn="button" id="endDate"
									label="#{lbl['lbl.sc.end.date']}"
									mindate="#{!empty simpleQuoteBackingBean.managedBean.scQuote.startDate ? simpleQuoteBackingBean.managedBean.scQuote.startDate : simpleQuoteBackingBean.managedBean.today}"
									readonlyInput="true" required="true"
									disabled="#{!isEditable}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}">
									<p:ajax event="dateSelect" update="durationId" process="@this"
										partialSubmit="true"
										listener="#{simpleQuoteBackingBean.dateListener}" />
								  </p:calendar></td>
							      <td><p:message id="endDateMsg" for="endDate" display="icon" /></td>
							 </tr>
							</table>
					  </td>
				     </tr>
					 <tr>
						<td><p:outputLabel
									value="#{lbl['lbl.sc.sq.duration']}" /></td>
						<td colspan="3"><p:outputPanel autoUpdate="true"
									id="durationId">
									<p:inputText size="26"
										label="#{lbl['lbl.sc.sq.duration']}" maxlength="5"
										value="#{simpleQuoteBackingBean.managedBean.duration}"
										disabled="true" style="text-align:right; margin-top: 4px">
										<f:convertNumber pattern="##0.0" />
									</p:inputText>

									<p:spacer width="5px" />
									<h:outputText value="#{lbl['lbl.sc.simple.quote.hours']}"></h:outputText>
								</p:outputPanel></td>
					</tr>

					<tr>
						<td><p:outputLabel
									value="#{lbl['lbl.sc.sq.simple.quote.type']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td colspan="3">
								<table>
									<tr>
										<td><p:selectOneRadio id="noOfQuote"
										        styleClass="commonLabel"
												label="#{lbl['lbl.sc.sq.simple.quote.type']}"
												required="true" disabled="#{!isEditable}"
												value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}">
												<f:selectItem
													itemLabel="#{lbl['lbl.sc.sq.single']}"
													itemValue="false" />
												<f:selectItem
													itemLabel="#{lbl['lbl.sc.sq.multiple']}"
													itemValue="true" />
												<p:ajax event="change" update="@([id$=mainTabMenu])"
													process="@this" partialSubmit="true"
													listener="#{simpleQuoteBackingBean.noOfQuoteEvent}" />
											</p:selectOneRadio></td>

										<td style="margin-top: -3px"><p:message id="noofquoteMsg"
												for="noOfQuote" display="icon" /> <ac:iconTooltip
												value="#{lbl['lbl.sc.sq.quotetype.tooltip']}" /></td>
									</tr>
								</table>
							</td>

						</tr>
					</table>
	  </p:panel>

	<p:panel header="#{lbl['lbl.sc.simple.quote.remark']}" toggleable="true">
		<ui:include src="simpleQuoteRemark.xhtml" />
	</p:panel>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" oncomplete="uploadDlg.hide()" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{simpleQuoteBackingBean.handleFileUpload}"
			mode="advanced" id="upload"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			update="@form" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>

</ui:composition>
