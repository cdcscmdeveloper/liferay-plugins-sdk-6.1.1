<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">

		<c:if test="#{simpleQuoteBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.sq']}" />
		</c:if>

		<p:messages showDetail="true"
			autoUpdate="#{simpleQuoteBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" showSummary="false" />
		<ui:param name="isEditable"
			value="#{simpleQuoteBackingBean.managedBean.editableFlag}" />

		<ui:param name="isPidExpired"
			value="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus.statusId eq DPStatusConstants.PID_EXPIRED}" />

		<ui:include
			src="/xhtml/sc/directpurchase/simplequote/simpleQuoteButtons.xhtml" />
		<ui:include
			src="/xhtml/sc/directpurchase/simplequote/simpleQuoteHeader.xhtml" />

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
						id="mainTabMenu"
						activeIndex="#{simpleQuoteBackingBean.managedBean.activeIndex}"
						styleClass="sidemenu">
						<p:menuitem id="sqGeninfo" value="#{lbl['lbl.sc.general.info']}"
							update="@form"
							action="#{simpleQuoteBackingBean.tabMenuListener('0')}" />

						<p:menuitem id="zoneId" value="#{lbl['lbl.sc.zone']}"
							update="@form"
							disabled="#{!simpleQuoteBackingBean.managedBean.scQuote.zonal}"
							action="#{simpleQuoteBackingBean.tabMenuListener('1')}" />

						<p:menuitem id="itemListId" value="#{lbl['lbl.sc.item.list']}"
							update="@form"
							action="#{simpleQuoteBackingBean.tabMenuListener('2')}" />

						<p:menuitem id="suppCriteriaId"
							value="#{lbl['lbl.sc.sq.criteria.supp.list']}" update="@form"
							action="#{simpleQuoteBackingBean.tabMenuListener('3')}" />
					</p:tabMenu></td>
				<td width="80%" valign="top"><c:if
						test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '0'}">
						<ui:include
							src="/xhtml/sc/directpurchase/simplequote/simpleQuoteGenInfo.xhtml" />
					</c:if> <c:if
						test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '1'}">
						<ui:include
							src="/xhtml/sc/directpurchase/simplequote/simpleQuoteZone.xhtml" />
					</c:if> <c:if
						test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '2'}">
						<ui:include
							src="/xhtml/sc/directpurchase/simplequote/simpleQuoteItemList.xhtml" />
					</c:if> <c:if
						test="#{simpleQuoteBackingBean.managedBean.activeIndex eq '3'}">
						<ui:include
							src="/xhtml/sc/directpurchase/simplequote/simpleQuoteSuppCriteria.xhtml" />
					</c:if></td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
