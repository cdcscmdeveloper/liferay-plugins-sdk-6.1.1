<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog header="#{lbl['lbl.sc.add.location']}"
		widgetVar="ZoneLocation" modal="true" closable="false" width="500"
		resizable="false">
		<p:panel id="zonePopupPanel">
			<p:messages id="zoneMsgId" showDetail="true"
				autoUpdate="#{!simpleQuoteBackingBean.managedBean.autoUpdate}"
				closable="true" showSummary="false" severity="error, info" />
			<table styleClass="noBorders tr,noBorders td">
				<TR>
					<TD align="top"><p:outputLabel
							value="#{lbl['lbl.sc.zone.name']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></TD>
					<TD><p:inputText id="zoneNameId" size="40" maxlength="50"
							label="#{lbl['lbl.sc.zone.name']}"
							value="#{simpleQuoteBackingBean.managedBean.zoneName}"
							required="#{simpleQuoteBackingBean.managedBean.required}">
						</p:inputText> <p:message id="zoneNameMsg" for="zoneNameId" display="icon" /></TD>
				</TR>
				<TR>
					<TD valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.location.name']}"></p:outputLabel></TD>
					<TD>
						<div style="height: 320px; overflow-y: scroll; width: 323px;">
							<p:tree id="treeZoneLocationPopup"
								value="#{simpleQuoteBackingBean.managedBean.rootZoneTree}"
								var="location"
								selection="#{simpleQuoteBackingBean.managedBean.selectedNodes}"
								selectionMode="checkbox">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
							</p:tree>
						</div>
					</TD>
				</TR>
			</table>
		</p:panel>
		<p:spacer height="3px" />
		<div class="ppRightBtn" style="width: 100%">
			<p:commandButton id="proceedBtn" styleClass="BtnSpacing"
				value="#{lbl['lbl.btn.proceed']}" process="@all"
				update="@this, zoneLocationDataTable" partialSubmit="true"
				actionListener="#{simpleQuoteBackingBean.updateZone}" />

			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				styleClass="BtnSpacing" partialSubmit="true" process="@this"
				action="#{simpleQuoteBackingBean.cancelZonePopUp}" />

		</div>
		<p:defaultCommand target="proceedBtn"></p:defaultCommand>
	</p:dialog>
</ui:composition>
