<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:spacer height="10px" />
	<h:panelGrid border="0" cellpadding="" cellspacing="4" width="100%"
		columns="8" style="background-color: #F2F2F2;">
		<h:outputLabel value="#{lbl['lbl.sc.purchase.in.default.pid.no']}" />
		<p:inputText value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.purchaseInDefaultNo}" disabled="true"/>

		<h:outputLabel value="#{lbl['lbl.sc.purchase.in.default.pkp.no']}" />
		<p:inputText value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctContractVer.ctContract.contractNo}" disabled="true" />

		<h:outputLabel value="#{lbl['lbl.sc.purchase.in.default.cat.type']}" />
		<p:inputText value="#{purchaseInDefaultBackingBean.getParameterDesc(purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctContractVer.ctContract.contractType)}" disabled="true" />

		<h:outputLabel value="#{lbl['lbl.sc.purchase.in.default.status']}" />
		<p:inputText disabled="true" value="#{purchaseInDefaultBackingBean.managedBean.pidStatus}"/>

	</h:panelGrid>
	<p:spacer height="10px" />
	<p:panel header="CONTRACT DETAIL" toggleable="true">
	<p:spacer height="4px" />
	 <table>
	        <tr>
			     <td colspan="4" style="width: 250px;"><p:outputPanel>
				 <table style="width: 100%">
				  <tr>
 				     <ui:fragment rendered="#{purchaseInDefaultBackingBean.managedBean.selectedPmOrgProfile.brandNew}">
 				     <td style="width: 250px;">
						    <p:outputLabel value="#{lbl['lbl.sc.price.inquiry.ptj.name']}" /></td>
					 <td> <p:selectOneMenu 
						     value="#{purchaseInDefaultBackingBean.managedBean.pmOrgProfile.orgProfileId}"
						     styleClass="divisionclass" style="width: 250px;margin-bottom: 5px;">
						     <f:selectItem itemLabel="- Select One -"> </f:selectItem>
						  <f:selectItems 
							   value="#{purchaseInDefaultBackingBean.managedBean.ptjDropdown}"
							   var="pmOrgProfile"
							   itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
							   itemValue="#{pmOrgProfile.orgProfileId}" />
					</p:selectOneMenu></td>
			    	</ui:fragment>
				</tr>
				</table>
			   </p:outputPanel></td>
			</tr>
	 
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.supp.name']}" /></td>
				<td><p:inputText disabled="true" 
				      value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctContractVer.ctContract.smSupplier.companyName}" size="46" /></td>
			</tr>
          	 <tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.prod.code']}" /></td>
				<td><p:inputText disabled="true"  
				      value="34"/></td>
				      
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.item.name']}" /></td>
				<td style="width: 250px;"><p:inputText disabled="true"  
				      value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.itemName}" size="40" /></td>      
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.min.qty']}" /></td>
				<td><p:inputText disabled="true"  style="text-align:right;"
				      value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.minimumOrderQty}" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.val.period']}" /></td>
				<td><p:inputText disabled="true" />
				    <p:spacer width="2px"/>
				    <p:inputText disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.max.proc.amt']}" /></td>
				<td><p:inputText disabled="true" style="text-align:right;"
				       value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.maxProcureAmt}"/></td>
			</tr>
      </table>
      </p:panel>
      
      <p:panel header="ITEM DETAIL" toggleable="true">
       <p:spacer height="10px"/>
      <p:dataTable id="respDtl" var="itemPrice"
			value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctItemPrices}"
			rowKey="#{itemPrice}" rowIndexVar="index">
      
			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.zone']}" style="width:25%">
					<h:outputText value="#{itemPrice.ctContractZone.zoneName}"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.from.qty']}" style="width:10%">
				<h:outputText value="#{itemPrice.fromQty}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.to.qty']}" style="width:10%">
				<h:outputText value="#{itemPrice.toQty}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.unit.price']}" style="width:15%">
				<p:inputText value="#{itemPrice.unitPrice}" style="text-align:right;" size="30" 
				     disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}"/>
			</p:column>

		</p:dataTable>

     </p:panel>
	<p:panel header="REQUEST DETAIL" toggleable="true" >
	   <p:spacer height="3px"/>
	      <h:panelGroup>
			<table style="width: 90%">
			<tr>
			   <td style="width: 250px;"><p:outputLabel
								value="#{lbl['lbl.sc.purchase.in.default.just']}" /></td>
				<td><p:selectOneMenu disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}"
					value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.reasonType}" style="margin-bottom: 5px;">
					<f:selectItems
							value="#{purchaseInDefaultBackingBean.managedBean.justifications}" />
					<p:ajax event="change" update="mainform"
						listener="#{purchaseInDefaultBackingBean.justificationTypeEvent}" process="@this" />
				</p:selectOneMenu>
				
			   <p:commandLink style="text-align:left">
			    <p:graphicImage 
							value="/resources/ep/images/design/document.png" height="18" width="18"/>
			    </p:commandLink> 
				 
			  </td>
		   </tr>
		</table>
	   </h:panelGroup>
	 <h:panelGroup id="mainform">
	  <h:panelGroup id="orderQty" rendered="#{purchaseInDefaultBackingBean.managedBean.visibleOrderQty}">
		 <table style="width: 90%">
			 <tr>
			  <td style="width: 250px;"><p:outputLabel
				  value="#{lbl['lbl.sc.purchase.in.default.order.qty']}" /></td>
			 <td><p:inputText id="ordqty" value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.quantity}" style="text-align:right;" size="42" disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}"/></td>
			</tr>
		</table>
	 </h:panelGroup>

	 <h:panelGroup id="rmkId" rendered="#{purchaseInDefaultBackingBean.managedBean.visibleRemarkAttach}">   
		   <table style="width: 90%">
			 <tr>
			    <td  width="23.4%" style="vertical-align: top;padding-right: 1px;text-align: right;"><h:outputLabel value="Remark"/></td>
				<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
			     <table>
				   <tr>
					  <td rowspan="2" style="vertical-align: top;" align="left">
						  <h:graphicImage value="#{purchaseInDefaultBackingBean.userImagePath(remarkVar.user.loginId)}" height="30" width="30" />
					 </td>
					 <td width="6"></td>
					 <td><h:outputText value="#{remarkVar.user.userName}"/>,
					     <h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
						 <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
						</h:outputText>
					</td>
				  </tr>
				   <tr><td></td>
					   <td><p:inputTextarea style="width:350px;" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" id="remark" 
					               disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}"/>
						   <h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
					  </td>
				  </tr>
			   </table>
			 </p:dataGrid>
			</td>
			</tr>
		</table>
	  </h:panelGroup>
	  
	 <h:panelGroup id="attachmentId" rendered="#{purchaseInDefaultBackingBean.managedBean.visibleRemarkAttach}">
	   <table style="width: 90%">
		<tr>
			<td width="24%" style="vertical-align: center;padding-right: 0px;text-align: right;">
			     <p:outputLabel value="#{lbl['lbl.sc.purchase.in.default.attachment']}"/></td>
			<td class="TableFieldRight">
			     <p:commandButton  oncomplete="uploadDlg.show();return false;" icon="iconAttachment"  update="attachmentId"
				 disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}" value="Attach file(s)" />
		  </td>
		</tr>
		 <tr><td/>
			<td><p:dataGrid id="attachId" value="#{purchaseInDefaultBackingBean.managedBean.attachments}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
			    <table>
				 <tr>
				    <td rowspan="2" style="vertical-align: top;" align="left">
					  <h:graphicImage library="ep/images/design" name="#{purchaseInDefaultBackingBean.determineIcon(attachFile)}" height="30" width="30" />
					  </td>
				   <td><h:outputText value="#{attachFile.user.userName}"/>, 
					 <h:outputText  value="#{attachFile.changedDate}">
					   <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					 </h:outputText></td>
				 </tr>
				 <tr>
					<td><h:commandLink value="#{attachFile.fileName}" styleClass="blue_font" />
						<p:commandLink action="#{purchaseInDefaultBackingBean.deleteUploadFile}" immediate="true"  update="attachId"  disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}">
			   			<h:graphicImage library="ep/images/design" name="trash.png" styleClass="tasklist_title1"/>
			 	 		</p:commandLink>
			 	  </td>
				</tr>
			  </table>
			 </p:dataGrid>
			</td>
		    </tr>
		  </table>
	  </h:panelGroup>

	</h:panelGroup>
   </p:panel>

	<p:panel label="#{lbl['lbl.sc.approve.list']}"
			header="#{lbl['lbl.sc.approve.list']}" toggleable="true"
			toggleSpeed="500">
		  <div style="width: 100%">
			<p:pickList  id="approver" disabled="#{purchaseInDefaultBackingBean.managedBean.approverFlag}"
					value="#{purchaseInDefaultBackingBean.managedBean.approvalUsers}"
					var="approverUser" showTargetControls="true"
					itemLabel="#{approverUser.userName}" itemValue="#{approverUser}"
					converter="approverConverter">
					<f:facet name="sourceCaption">Available Approver </f:facet>
					<f:facet name="targetCaption">Approver List Name</f:facet>
			</p:pickList>
		</div>
	  </p:panel>
			
	 <p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.purchase.in.default.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{purchaseInDefaultBackingBean.handleFileUpload}" mode="advanced"
			id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="attachmentId" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
