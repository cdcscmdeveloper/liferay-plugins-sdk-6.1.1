<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	 <p:spacer height="10px" />
	<h:panelGrid border="0" cellpadding="" cellspacing="4" width="100%"
		columns="8" style="background-color: #F2F2F2;">
		<h:outputLabel value="#{lbl['lbl.ss.purchase.in.default.pid.no']}" />
		<p:inputText value="" disabled="true"/>

		<h:outputLabel value="#{lbl['lbl.ss.purchase.in.default.pkp.no']}" />
		<p:inputText value="#{purchaseInDefaultBackingBean.managedBean.contract.contractId}" disabled="true" />

		<h:outputLabel value="#{lbl['lbl.ss.purchase.in.default.cat.type']}" />
		<p:inputText value="#{purchaseInDefaultBackingBean.getParameterDesc(purchaseInDefaultBackingBean.managedBean.contract.contractType)}" disabled="true" />

		<h:outputLabel value="#{lbl['lbl.ss.purchase.in.default.status']}" />
		<p:inputText disabled="true" value="#{purchaseInDefaultBackingBean.currentStatus}"/>

	</h:panelGrid>
	<p:spacer height="10px" />
	<p:panel header="CONTRACT DETAIL" toggleable="true">
	<p:spacer height="4px" />
	 <table style="width: 90%">
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.supp.name']}" /></td>
				<td><p:inputText disabled="true" 
				      value="#{purchaseInDefaultBackingBean.managedBean.scRequestSupplierItem.pricing.cmSupplierItem.smSupplier.companyName}" size="46" /></td>
			</tr>
          	 <tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.prod.code']}" /></td>
				<td><p:inputText disabled="true"  
				      value="#{purchaseInDefaultBackingBean.managedBean.scRequestSupplierItem.pricing.cmSupplierItem.cmItem.extensionCode}"/></td>
				      
				<td style="width:100px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.item.name']}" /></td>
				<td><p:inputText disabled="true"  
				      value="#{purchaseInDefaultBackingBean.managedBean.scRequestSupplierItem.pricing.cmSupplierItem.cmItem.itemName}" size="46" /></td>      
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.min.qty']}" /></td>
				<td><p:inputText disabled="true"  
				      value="#{purchaseInDefaultBackingBean.managedBean.scRequestSupplierItem.pricing.cmSupplierItem.minOrder}" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.price.per.uom']}" /></td>
				<td><p:inputText disabled="true" 
				      value="#{purchaseInDefaultBackingBean.managedBean.scRequestSupplierItem.pricing.cmSupplierItem.pmUom.uomName}" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.val.period']}" /></td>
				<td><p:inputText disabled="true" />
				    <p:spacer width="2px"/>
				    <p:inputText disabled="true" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.max.proc.amt']}" /></td>
				<td><p:inputText disabled="true" 
				       value="#{purchaseInDefaultBackingBean.managedBean.ctContractItem.maxProcureAmount}"/></td>
			</tr>
      </table>
     </p:panel>
	<p:panel header="JUSTIFICATION" toggleable="true" >
	   <p:spacer height="3px"/>
	      <h:panelGroup>
			<table style="width: 90%">
			<tr>
			   <td style="width: 250px;"><p:outputLabel
								value="#{lbl['lbl.ss.purchase.in.default.just']}" /></td>
				<td><p:selectOneMenu disabled="#{purchaseInDefaultBackingBean.managedBean.editFlag}"
					value="#{purchaseInDefaultBackingBean.managedBean.justificationType}" style="margin-bottom: 5px;">
					<f:selectItems
							value="#{purchaseInDefaultBackingBean.managedBean.justifications}" />
					<p:ajax event="change" update="mainform"
						listener="#{purchaseInDefaultBackingBean.justificationTypeEvent}" process="@this" />
				</p:selectOneMenu>
				
			   <p:commandLink style="text-align:left">
			    <p:graphicImage 
							value="/resources/ep/images/design/document.png" height="18" width="18"/>
			    </p:commandLink> 
				 
			  </td>
		   </tr>
		</table>
	   </h:panelGroup>
	 <h:panelGroup id="mainform">
	  <h:panelGroup id="orderQty" rendered="#{purchaseInDefaultBackingBean.managedBean.visibleOrderQty}">
		 <table style="width: 90%">
			 <tr>
			  <td style="width: 250px;"><p:outputLabel
				  value="#{lbl['lbl.ss.purchase.in.default.order.qty']}" /></td>
			 <td><p:inputText id="ordqty" disabled="#{purchaseInDefaultBackingBean.managedBean.editFlag}"/></td>
			</tr>
		</table>
	 </h:panelGroup>

	 <h:panelGroup id="rmkId" rendered="#{purchaseInDefaultBackingBean.managedBean.visibleRemarkAttach}">   
		   <table style="width: 90%">
			 <tr>
			    <td class="TableFieldLeft" width="24.3%"><h:outputLabel value="Remark"/></td>
				<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
			     <table>
				   <tr>
					  <td rowspan="2" style="vertical-align: top;" align="left">
						  <h:graphicImage value="#{purchaseInDefaultBackingBean.userImagePath(remarkVar.user.loginId)}" height="30" width="30" />
					 </td>
					 <td width="6"></td>
					 <td><h:outputText value="#{remarkVar.user.userName}"/>,
					     <h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
						 <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
						</h:outputText>
					</td>
				  </tr>
				   <tr><td></td>
					   <td><p:inputTextarea style="width:350px;" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" id="remark" 
					               disabled="#{purchaseInDefaultBackingBean.managedBean.editFlag}"/>
						   <h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
					  </td>
				  </tr>
			   </table>
			 </p:dataGrid>
			</td>
			</tr>
		</table>
	  </h:panelGroup>
	  
	 <h:panelGroup id="attachmentId" rendered="#{purchaseInDefaultBackingBean.managedBean.visibleRemarkAttach}">
	   <table style="width: 91%">
		<tr>
			<td class="TableFieldLeft" width="24%"><p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.attachment']}"/></td>
			<td class="TableFieldRight">
			     <p:commandButton  oncomplete="uploadDlg.show();return false;" icon="iconAttachment"  update="attachmentId"
				 disabled="#{purchaseInDefaultBackingBean.managedBean.editFlag}" value="Attach file(s)" />
		  </td>
		</tr>
		 <tr><td/>
			<td><p:dataGrid id="attachId" value="#{purchaseInDefaultBackingBean.managedBean.attachments}"
					var="attachFile" rowIndexVar="attachFileIndex" columns="1" style="width:100%">
			    <table>
				 <tr>
				    <td rowspan="2" style="vertical-align: top;" align="left">
					  <h:graphicImage library="ep/images/design" name="#{purchaseInDefaultBackingBean.determineIcon(attachFile)}" height="30" width="30"/>
					  </td>
				   <td><h:outputText value="#{attachFile.user.userName}"/>, 
					 <h:outputText  value="#{attachFile.changedDate}">
					   <f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					 </h:outputText></td>
				 </tr>
				 <tr>
					<td><h:commandLink value="#{attachFile.fileName}" styleClass="blue_font" />
						<p:commandLink action="#{purchaseInDefaultBackingBean.deleteUploadFile}" immediate="true"  update="attachId" >
			   			<h:graphicImage library="ep/images/design" name="icon_trash.png" styleClass="tasklist_title1"/>
			 	 		</p:commandLink>
			 	  </td>
				</tr>
			  </table>
			 </p:dataGrid>
			</td>
		    </tr>
		  </table>
	  </h:panelGroup>

	</h:panelGroup>
   </p:panel>

	<p:panel label="#{lbl['lbl.ss.panel.title.approve.list']}"
			header="#{lbl['lbl.ss.panel.title.approve.list']}" toggleable="true"
			toggleSpeed="500">
		  <div style="width: 100%">
			<p:pickList  id="approver"
					value="#{purchaseInDefaultBackingBean.managedBean.approvalUsers}"
					var="approverUser" showTargetControls="true"
					itemLabel="#{approverUser.userName}" itemValue="#{approverUser}"
					converter="approverConverter">
					<f:facet name="sourceCaption">Available Approver </f:facet>
					<f:facet name="targetCaption">Approver List Name</f:facet>
			</p:pickList>
		</div>
	  </p:panel>
			
	 <p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.ss.purchase.in.default.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{purchaseInDefaultBackingBean.handleFileUpload}" mode="advanced"
			id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="attachmentId" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
