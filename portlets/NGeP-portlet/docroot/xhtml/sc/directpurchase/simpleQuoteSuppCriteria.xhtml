   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="suppCriteria" header="#{lbl['lbl.sc.sq.supp.criteria']}" toggleable="true">
		<ac:lovPopup />
		
		<h:panelGroup
			rendered="#{simpleQuoteBackingBean.managedBean.locAndBusinessFlag}">
			<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">
				<p:selectBooleanCheckbox id="byLocId"
					value="#{simpleQuoteBackingBean.managedBean.byLocality}">
					<p:ajax event="change" update="suppCriteria"
						listener="#{simpleQuoteBackingBean.byLocAndBusinessEvent}"
						process="@this byLocId" />
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.sc.sq.supp.by.locality']}" />

				<p:selectBooleanCheckbox id="byBussNatureId"
					value="#{simpleQuoteBackingBean.managedBean.byBusinessNature}">
					<p:ajax event="change" update="@([id$=suppCriteriasId])"
						listener="#{simpleQuoteBackingBean.byLocAndBusinessEvent}"
						process="@this byBussNatureId" />
				</p:selectBooleanCheckbox>
				<h:outputText value="#{lbl['lbl.sc.sq.supp.by.busi.nature']}" />
			</h:panelGrid>
		</h:panelGroup>

		<p:panel id="suppCriteriasId">
			<p:tabView
				activeIndex="#{simpleQuoteBackingBean.managedBean.tabActiveIndex}">
                <p:ajax event="tabChange" listener="#{simpleQuoteBackingBean.onTabChange}"/>
				<!-- BY LOCATION -->
				<p:tab title="#{lbl['lbl.sc.sq.supp.tab.locality']}"
					rendered="#{simpleQuoteBackingBean.managedBean.byLocality}">
					<p:panel id="locPanel">
						<table style="width: 100%">
							<tr>
								<td style="width: 160px"><p:outputLabel
										value="#{lbl['lbl.sc.location.level']}" /></td>
								<td><p:selectOneMenu id="locLevels"
										value="#{simpleQuoteBackingBean.managedBean.locationLevel}"
										style="width: 140px;">
										<f:selectItems
											value="#{simpleQuoteBackingBean.locationLevelDropdown}" />
									</p:selectOneMenu></td>
							</tr>
						</table>
						<h:panelGrid width="100%" style="margin-top:20px">

							<p:dataTable id="locationDataTable"
								value="#{simpleQuoteBackingBean.managedBean.locationTrees}"
								var="locationTree" rowIndexVar="index">

								<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.loc.name']}">
									<p:tree value="#{locationTree}" var="location"
										selectionMode="checkbox">
										<p:ajax event="select"
											listener="#{simpleQuoteBackingBean.selectLocationTreeNode}" />
										<p:ajax event="unselect"
											listener="#{simpleQuoteBackingBean.unSelectLocationTreeNode}" />

										<p:treeNode type="state">
											<h:outputText value="#{location.pmState.stateName}" />
										</p:treeNode>
										<p:treeNode type="division">
											<h:outputText value="#{location.pmDivision.divisionName}" />
										</p:treeNode>
										<p:treeNode type="district">
											<h:outputText value="#{location.pmDistrict.districtName}" />
										</p:treeNode>

									</p:tree>
								</p:column>
								<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.action']}">
									<p:commandLink
										actionListener="#{simpleQuoteBackingBean.editLocation(locationTree,index)}"
										rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}"
										process="@this" update="@([id$=locPopupPanel])"
										oncomplete="locationPopup.show();">
										<p:graphicImage library="ep/images/design" name="edit.png"
											value="/resources/ep/images/design/edit.png" />
									</p:commandLink>

								</p:column>
							</p:dataTable>
						</h:panelGrid>
						<div align="right" style="width: 100%">
						 <c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">	
							<p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.add.btn']}"
								process="@this ,locLevels" update="@([id$=locPopupPanel])"
								partialSubmit="true" oncomplete="locationPopup.show();"
								actionListener="#{simpleQuoteBackingBean.showLocationPopup}"
								icon="ui-icon-add"/>

								<p:commandButton
									value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
									process="@all, locationDataTable" partialSubmit="true"
									action="#{simpleQuoteBackingBean.deleteLocationTreeNode()}"
									update="@([id$=locationDataTable])" icon="ui-icon-delete" />

							</c:if>
						</div>
					</p:panel>
					<ui:include
						src="/xhtml/sc/directpurchase/common/simpleQuoteLocationPopup.xhtml" />
				</p:tab>

				<!-- BY BUSINESS NATURE -->
				<p:tab title="#{lbl['lbl.sc.sq.supp.tab.busi.nature']}"
					rendered="#{simpleQuoteBackingBean.managedBean.byBusinessNature}">
                   <p:panel>
					<p:dataTable id="byBusNatureDtl" var="busiNatureCriteria"
						rowKey="#{busiNatureCriteria}" rowIndexVar="index"
						selection="#{simpleQuoteBackingBean.managedBean.selectedBusinessNature}"
						value="#{simpleQuoteBackingBean.managedBean.businessNatureCriterias}">
						<ac:paginator for="byBusNatureDtl" />
					     <p:column selectionMode="multiple" style="width:2%" />
						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.code']}"
							style="width:15%">
							<h:outputText
								value="#{busiNatureCriteria.pmBusinessNature.levelCode}" />
						</p:column>

						<p:column
							headerText="#{lbl['lbl.sc.sq.supp.criteria.bus.nature.desc']}"
							style="width:30%">
							<h:outputText
								value="#{busiNatureCriteria.pmBusinessNature.levelName}" />
						</p:column>

					</p:dataTable>

                 <div>
                  <c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">	
					<table style="width: 100%">
					  <tr><td class="TableFieldLeft" width="80%"></td>
						 <td>
						   <table><tr> 
							     <td class="TableFieldLeft">
								    <ac:lov id="busiNatureId" lovId="PM_BUSINESS_NATURE"
										postUpdateListener="simpleQuoteBackingBean.businessNatureListener(simpleQuoteBackingBean.managedBean.businessNatures)"
										headerText="Business Nature" buttonLabel="Add"
										buttonIcon="ui-icon-add" selectionMode="multiple"
										saveObject="simpleQuoteBackingBean.managedBean.businessNatures"
										conditionField="recordStatus^1|businessLevel^#{ParameterConst.businessNatureLevel}" update="@form"/>
								   </td>
									<td>
									  <p:commandButton
										value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
										process="@this,byBusNatureDtl" partialSubmit="true"
										action="#{simpleQuoteBackingBean.deleteBusinessNature}"
										update="@form" icon="ui-icon-delete"/>
									</td>
								</tr></table>
							</td>
						    </tr>
						</table>
						</c:if>
				     </div>
				     </p:panel>
				</p:tab>

				<!--  BY SUPPLIER   -->
				<p:tab title="#{lbl['lbl.sc.sq.supp.tab.supp.list']}"
					rendered="#{simpleQuoteBackingBean.managedBean.locAndBusinessFlag}">
					<p:panel>
					<p:dataTable id="supplierItemDt" var="quoteSupplier"
						rowKey="#{quoteSupplier}" rowIndexVar="index"
						selection="#{simpleQuoteBackingBean.managedBean.selectedSupplierList}"
						value="#{simpleQuoteBackingBean.managedBean.supplierList}">
						<ac:paginator for="supplierItemDt" />
						<p:column selectionMode="multiple" style="width:2%" />
						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.ep.no']}"
							style="width:10%">
							<h:outputText value="#{quoteSupplier.smSupplier.epNo}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.mof.no']}"
							style="width:10%">
							<h:outputText value="#{quoteSupplier.mofNumber}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.supp.name']}"
							style="width:30%">
							<h:outputText value="#{quoteSupplier.smSupplier.companyName}" />
						</p:column>
					</p:dataTable>

				 <div>
				   <c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">	
					<table style="width: 100%">
					  <tr><td class="TableFieldLeft" width="80%"></td>
						 <td>
						   <table><tr> 
							     <td class="TableFieldLeft">
								     <ac:lov id="supplier" lovId="SM_SUPPLIER"
									    postUpdateListener="simpleQuoteBackingBean.supplierListListener(simpleQuoteBackingBean.managedBean.smSuppliers, simpleQuoteBackingBean.managedBean.scQuote)"
										headerText="Supplier List" buttonLabel="Add"
										buttonIcon="ui-icon-add" selectionMode="multiple"
										update="@form"
										saveObject="simpleQuoteBackingBean.managedBean.smSuppliers"
										conditionField="#{simpleQuoteBackingBean.supplierListCriteria}"/>
								   </td>
									<td>
									    <p:commandButton
										value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
										process="@this,supplierItemDt" partialSubmit="true"
										action="#{simpleQuoteBackingBean.deleteSupplier}"
										update="supplierItemDt" icon="ui-icon-delete"/>
									</td>
								</tr></table>
							</td>
						    </tr>
						</table>
						</c:if>
						</div>
						</p:panel>
				 </p:tab>

				<!--  BY Government Seller   -->
				<p:tab title="#{lbl['lbl.sc.sq.supp.tab.govt.seller']}"
					rendered="#{simpleQuoteBackingBean.managedBean.g2GFlag}">
					<p:panel>
					<p:dataTable id="govtSellerId" var="data" rowKey="#{data}"
						rowIndexVar="index"
						selection="#{simpleQuoteBackingBean.managedBean.selectedGovtSellers}"
						value="#{simpleQuoteBackingBean.managedBean.govtSellers}">
						<ac:paginator for="govtSellerId" />
							<p:column selectionMode="multiple" style="width:2%" />
						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.ep.no']}"
							style="width:10%">
							<h:outputText value="#{data.smSupplier.epNo}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.org.type']}"
							style="width:10%">
							<h:outputText value="#{data.smSupplier.pmOrgProfile.orgTypeCode.parameterCode}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.supp.name']}"
							style="width:30%">
							<h:outputText value="#{data.smSupplier.companyName}" />
						</p:column>

					</p:dataTable>

                 <div>
                  <c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">	
					<table style="width: 100%">
					  <tr><td class="TableFieldLeft" width="80%"></td>
						 <td>
						   <table><tr> 
							     <td class="TableFieldLeft">
								    <ac:lov id="govtSeller" lovId="PM_ORG_PROFILE"
										postUpdateListener="simpleQuoteBackingBean.govtSellerListener(simpleQuoteBackingBean.managedBean.orgProfiles)"
										headerText="Government Seller" 
										buttonLabel="Add"
										buttonIcon="ui-icon-add" 
										selectionMode="multiple"
										saveObject="simpleQuoteBackingBean.managedBean.orgProfiles"
										conditionField="recordStatus^1" update="@form" />
								   </td>
									<td>
									  <p:commandButton
										value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
										process="@this,govtSellerId" partialSubmit="true"
										action="#{simpleQuoteBackingBean.deleteGovtSeller}"
										update="govtSellerId" icon="ui-icon-delete"/>
									</td>
								</tr></table>
							</td>
						    </tr>
						</table>
					</c:if>
					 </div>
               </p:panel>
				</p:tab>

				<!-- Panel Supplier   -->
				<p:tab title="#{lbl['lbl.sc.sq.supp.tab.panel.supplier']}"
					rendered="#{simpleQuoteBackingBean.managedBean.scQuote.panel}">
					<p:panel>
					<p:dataTable id="bypanelItemId" var="data" rowKey="#{data}"
						rowIndexVar="index"
						selection="#{simpleQuoteBackingBean.managedBean.selectedPanelSuppliers}"
						value="#{simpleQuoteBackingBean.managedBean.panelSuppliers}">
						
						<ac:paginator for="bypanelItemId" />
						<p:column selectionMode="multiple" style="width:2%" />

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.ep.no']}"
							style="width:10%">
							<h:outputText value="#{data.smSupplier.epNo}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.mof.no']}"
							style="width:10%">
							<h:outputText value="#{quoteSupplier.mofNumber}"/>

						</p:column>

						<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.supp.name']}"
							style="width:30%">
							<h:outputText value="#{data.smSupplier.companyName}" />
						</p:column>

					</p:dataTable>

                    <div>
                    <c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">	
					<table style="width: 100%">
					  <tr><td class="TableFieldLeft" width="100%"></td>
						 <td>
						   <table><tr> 
							     <td class="TableFieldLeft">
							      <!-- panel item for simple quote have to hide add button -->
							       <c:if test="#{simpleQuoteBackingBean.managedBean.panelItemBtnFlag}">	
								     <ac:lov id="panelSupplierId" lovId="CT_PANEL_SUPPLIER"
										postUpdateListener="simpleQuoteBackingBean.panelItemListener(simpleQuoteBackingBean.managedBean.ctPanelSuppliers, simpleQuoteBackingBean.managedBean.scQuote)"
										headerText="Panel Supplier" buttonLabel="#{lbl['lbl.sc.sq.supp.criteria.add.btn']}"
										buttonIcon="ui-icon-add" selectionMode="multiple"
										saveObject="simpleQuoteBackingBean.managedBean.ctPanelSuppliers"
										conditionField="recordStatus^1" update="@form" />
								    </c:if>
								   </td>
									<td>
									 <p:commandButton
										value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}"
										process="@this,bypanelItemId" partialSubmit="true"
										action="#{simpleQuoteBackingBean.deletePanelSupplier}"
										update="bypanelItemId" icon="ui-icon-delete" rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}"/>
									</td>
								</tr></table>
							</td>
						    </tr>
						</table></c:if>
					 </div>
					 </p:panel>
				</p:tab>

			</p:tabView>
		</p:panel>

	</p:panel>


</ui:composition>
