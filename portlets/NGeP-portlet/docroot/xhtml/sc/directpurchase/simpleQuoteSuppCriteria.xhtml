   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
    xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="suppCriteria" header="SUPPLIER CRITERIA" toggleable="true">
	 <p:spacer height="5px" />
	  <table style="width: 100%">
	 	<tr><td style="width: 2%;"></td>
			<td>
			  <p:selectManyCheckbox styleClass="float-left"
				   value="#{simpleQuoteBackingBean.managedBean.selectedCriteriaList}"
				   layout="pageDirection">
				   <f:selectItems value="#{simpleQuoteBackingBean.supplierCriteriaList}"/>
				   <p:ajax event="change" listener="#{simpleQuoteBackingBean.supplierCriteriaEvent}" update="suppCriteriasId"/>
				</p:selectManyCheckbox> 
			</td>
	   </tr>
	     </table>
     <ac:lovPopup />
    <p:spacer height="15px" />     
    <p:tabView id="suppCriteriasId" activeIndex="#{simpleQuoteBackingBean.managedBean.activeIndex}"
        value="#{simpleQuoteBackingBean.managedBean.criteriaTabs}" var="tab">
    <p:tab title="#{tab.titleName}">
   
	  <!-- BY LOCATION -->
	  <ui:fragment rendered="#{tab.titleName eq 'Locality'}">
		  <p:spacer height="10px"></p:spacer>
		  <p:panel id="locPanel">
		      <table style="width: 100%">
				<tr>
					<td style="width: 160px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locLevels"
							value="#{simpleQuoteBackingBean.managedBean.locationLevel}"
							style="width: 178px;">
							<f:selectItems value="#{simpleQuoteBackingBean.managedBean.locLevelDropdown}" />
					  </p:selectOneMenu></td>
				</tr>
	        </table>
		    <h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="locationDataTable" 
				        value="#{simpleQuoteBackingBean.managedBean.locationTrees}" var="locationTree"
				        rowIndexVar="index">
					 <p:column headerText="Location">
						<p:tree value="#{locationTree}" var="location"
						        selection="#{simpleQuoteBackingBean.managedBean.selectedLocNodes}"
						        selectionMode="checkbox">
							     <p:treeNode type="zone" >
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
								<p:treeNode type="state">
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
								<p:treeNode type="city">
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
					   </p:tree>
					</p:column>
					<p:column headerText="Action">
						<p:commandLink 
						     actionListener="#{simpleQuoteBackingBean.editLocation(locationTree,index)}"
						     process="@this" update="@([id$=locPopupPanel])" oncomplete="locationPopup.show();">
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
				<div align="right" style="width: 100%">
				 <p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this ,locLevels" 
				     update="@([id$=locPopupPanel])" partialSubmit="true" 
					 oncomplete="locationPopup.show();" 
					 actionListener="#{simpleQuoteBackingBean.showLocationPopup}" icon="ui-icon-add"/>
					 
		          <p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
				     process="@this,locationDataTable"
				     action="#{simpleQuoteBackingBean.deleteTreeNodes}"
				     update="locationDataTable" icon="ui-icon-delete"/> 			 
				</div> 
				</p:panel>
			    <ui:include src="/xhtml/sc/directpurchase/common/simpleQuoteLocationPopup.xhtml" />
		  </ui:fragment> 
		  
		 <!-- BY BUSINESS NATURE -->
		 <ui:fragment rendered="#{tab.titleName eq 'Business Nature'}">
		    <p:spacer height="10px"></p:spacer>
		     <p:dataTable id="byBusNatureDtl" var="busNatureCriteria"
		     	 selection="#{simpleQuoteBackingBean.managedBean.selectedBusinessNature}"
				 value="#{simpleQuoteBackingBean.managedBean.businessNatureCriterias}"
				 rows="10" rowKey="#{busNatureCriteria}" rowIndexVar="rowIndex">
				 <ac:paginator for="byBusNatureDtl" />
				<p:column selectionMode="multiple" style="width:2%" />
		
			  <p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.code']}" style="width:15%">
			    <ac:lov id="businessNatureId" lovId="PM_BUSINESS_NATURE"
			            headerText="Business Nature"
			            saveObject="simpleQuoteBackingBean.managedBean.businessNatureCriterias[#{rowIndex}].businessNature"
			            value="#{busNatureCriteria.businessNature.levelCode}"
			            conditionField="recordStatus^1" update="@form">
			     </ac:lov>
			   </p:column>
		
				<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.bus.nature.desc']}" style="width:30%"> 
				    <h:outputText value="#{busNatureCriteria.businessNature.levelName}" />
				</p:column>
			  </p:dataTable>
		        
		      <div align="right" style="width: 100%">
				 <p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.add.btn']}"
				   process="@this,byBusNatureDtl" partialSubmit="true"
				   action="#{simpleQuoteBackingBean.addBusinessNature}"
				   update="byBusNatureDtl" icon="ui-icon-add"  />
				<p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
			       process="@this,byBusNatureDtl" partialSubmit="true"
				   action="#{simpleQuoteBackingBean.deleteBusinessNature}"
				   update="byBusNatureDtl"
				   icon="ui-icon-delete"/> 
		
		     </div> 
		   </ui:fragment>
	    <!--  BY SUPPLIER   --> 
		  <ui:fragment rendered="#{tab.titleName eq 'Supplier'}">
		    <p:spacer height="10px"></p:spacer>
		    <p:dataTable id="supplierItemDt" var="data"  rowKey="#{data}" rowIndexVar="index"
		          selection="#{simpleQuoteBackingBean.managedBean.selectedSuppMofNoCriterias}"
				  value="#{simpleQuoteBackingBean.managedBean.supplierMofNoCriterias}">
				  <ac:paginator for="supplierItemDt" />  	
				  <p:column selectionMode="multiple" style="width:2%" />
				  
			    <p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.ep.no']}" style="width:10%">
					<ac:lov id="supplier" lovId="SM_SUPPLIER"
						headerText="Supplier Lov" 
						saveObject="simpleQuoteBackingBean.managedBean.supplierMofNoCriterias[#{index}].smSupplier"
						value="#{data.smSupplier.epNo}"
						conditionField="recordStatus^1" update="@form"/> 						
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.mof.no']}" style="width:10%">
					<h:outputText value="#{data.smSupplier.epNo}" />			
				</p:column>	
				
				 <p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.supp.name']}" style="width:30%">
					<h:outputText value="#{data.smSupplier.companyName}" />			
				</p:column>
			</p:dataTable>		
				
		    <div align="right" style="width: 100%">
			   <p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.add.btn']}"
				   process="@this,supplierItemDt" partialSubmit="true"
				   action="#{simpleQuoteBackingBean.addSupplier}"
				   update="supplierItemDt" icon="ui-icon-add"  />
				<p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
			       process="@this,supplierItemDt" partialSubmit="true"
				   action="#{simpleQuoteBackingBean.deleteSupplier}"
				   update="supplierItemDt"
				   icon="ui-icon-delete"/> 
		   </div>
		   </ui:fragment>
		   
		  <!--  BY Government Seller   --> 
		  <ui:fragment rendered="#{tab.titleName eq 'Government Seller'}">
		    <p:spacer height="10px"></p:spacer>
		    <p:dataTable id="govtSellerId" var="data"  rowKey="#{data}" rowIndexVar="index"
		          selection="#{simpleQuoteBackingBean.managedBean.selectedGovEPNoCriterias}"
				  value="#{simpleQuoteBackingBean.managedBean.govEPNoCriterias}">
				  <ac:paginator for="govtSellerId" />  	
				  <p:column selectionMode="multiple" style="width:2%" />
				  
			    <p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.ep.no']}" style="width:10%">
					<ac:lov id="supplier" lovId="SM_SUPPLIER"
						headerText="Supplier Lov" 
						saveObject="simpleQuoteBackingBean.managedBean.govEPNoCriterias[#{index}].smSupplier"
						value="#{data.smSupplier.epNo}"
						conditionField="recordStatus^1" update="@form"/> 						
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.org.type']}" style="width:10%">
					<h:outputText value="#{data.smSupplier.epNo}" />			
				</p:column>	
				
				 <p:column headerText="#{lbl['lbl.sc.sq.supp.criteria.supp.name']}" style="width:30%">
					<h:outputText value="#{data.smSupplier.companyName}" />			
				</p:column>
				
											
			</p:dataTable>		
				
		    <div align="right" style="width: 100%">
			   <p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.add.btn']}"
				   process="@this,govtSellerId" partialSubmit="true"
				   action="#{simpleQuoteBackingBean.addGovtSeller}"
				   update="govtSellerId" icon="ui-icon-add"  />
				<p:commandButton value="#{lbl['lbl.sc.sq.supp.criteria.delete.btn']}" 
			       process="@this,govtSellerId" partialSubmit="true"
				   action="#{simpleQuoteBackingBean.deleteGovtSeller}"
				   update="govtSellerId"
				   icon="ui-icon-delete"/> 
		   </div>
		   </ui:fragment>
		   
		</p:tab>  
	</p:tabView>
  </p:panel>
</ui:composition>
