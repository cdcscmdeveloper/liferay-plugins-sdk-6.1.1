<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="ctJustificationPopupId" widgetVar="ctJustificationPopup"
		modal="true" header="#{lbl['lbl.sc.purchase.in.default.just']}"
		dynamic="true" width="850" resizable="false" styleClass="pop_up_top"
		closable="true">
		<h:panelGroup>
			<p:dataTable id="ctReasonId" var="ctReason" style="width: 826px;"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{purchaseInDefaultBackingBean.managedBean.ctReasonList}"
				selection="#{purchaseInDefaultBackingBean.managedBean.ctReason}"
				selectionMode="single" rowKey="#{ctReason}" rowIndexVar="index">
				<p:ajax event="rowSelect" update="@([id$=selectButton1])" />
				<p:ajax event="rowUnselect" update="@([id$=selectButton1])" />

				<p:column headerText="#{lbl['lbl.sc.purchase.in.default.just']}"
					rendered="#{ctReason.pmReason.isRecordStatus()}" width="25%">
				    #{purchaseInDefaultBackingBean.getReasonDescByReasonId(ctReason.pmReason.reasonId).reasonDesc}
			</p:column>
				<p:column headerText="#{lbl['lbl.sc.reason.other.desc']}"
					rendered="#{ctReason.pmReason.isRecordStatus()}">
					<p:inputTextarea style="width:450px;" rows="5"
						rendered="#{!empty ctReason.reasonDesc}"
						value="#{ctReason.reasonDesc}" disabled="true" />
				</p:column>
			</p:dataTable>
		</h:panelGroup>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.select']}"
				disabled="#{purchaseInDefaultBackingBean.managedBean.ctReason eq null}"
				id="selectButton1"
				action="#{purchaseInDefaultBackingBean.justificationTypeEvent(purchaseInDefaultBackingBean.managedBean.ctReason.pmReason, purchaseInDefaultBackingBean.managedBean.ctReason.reasonDesc)}"
				partialSubmit="true" process="@this" update="@([id$=reqDtlId])"
				oncomplete="ctJustificationPopup.hide();" />

			<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
				process="@this" onclick="ctJustificationPopup.hide()" />
		</div>

	</p:dialog>

	<p:dialog id="panelJustificationPopupId"
		widgetVar="panelJustificationPopup" modal="true"
		header="#{lbl['lbl.sc.purchase.in.default.just']}" dynamic="true"
		width="850" resizable="false" styleClass="pop_up_top" closable="true">
		<h:panelGroup>
			<p:dataTable id="panelReasonId" var="panelReason"
				style="width: 826px;" selectionMode="single"
				selection="#{purchaseInDefaultBackingBean.managedBean.panelReason}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{purchaseInDefaultBackingBean.managedBean.panelReasonList}"
				rowKey="#{panelReason}" rowIndexVar="index">
				<p:ajax event="rowSelect" update="@([id$=selectButton2])" />
				<p:ajax event="rowUnselect" update="@([id$=selectButton2])" />

				<p:column headerText="#{lbl['lbl.sc.purchase.in.default.just']}"
					rendered="#{panelReason.pmReason.isRecordStatus()}" width="25%">
				    #{purchaseInDefaultBackingBean.getReasonDescByReasonId(panelReason.pmReason.reasonId).reasonDesc}
			</p:column>

				<p:column headerText="#{lbl['lbl.sc.reason.other.desc']}"
					rendered="#{panelReason.pmReason.isRecordStatus()}">
					<p:inputTextarea style="width:450px;" rows="5"
						rendered="#{!empty panelReason.reasonDesc}"
						value="#{panelReason.reasonDesc}" disabled="true" />
				</p:column>

			</p:dataTable>
		</h:panelGroup>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.select']}"
				disabled="#{purchaseInDefaultBackingBean.managedBean.panelReason eq null}"
				id="selectButton2"
				action="#{purchaseInDefaultBackingBean.justificationTypeEvent(purchaseInDefaultBackingBean.managedBean.panelReason.pmReason, purchaseInDefaultBackingBean.managedBean.panelReason.reasonDesc)}"
				partialSubmit="true" process="@this" update="@([id$=reqDtlId])"
				oncomplete="panelJustificationPopup.hide();" />

			<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
				process="@this" onclick="panelJustificationPopup.hide()" />
		</div>
	</p:dialog>
</ui:composition>
