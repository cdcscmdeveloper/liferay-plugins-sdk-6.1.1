<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="contentSection">
		<c:if test="#{purchaseInDefaultBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.purchase.in.default']}" />
		</c:if>
		<p:messages showDetail="true" id="messages"
			autoUpdate="#{purchaseInDefaultBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" showSummary="false" />

		<ui:param name="isPendingSubmissionStatus"
			value="#{purchaseInDefaultBackingBean.managedBean.pidStatus.statusId eq DPStatusConstants.pidPendingSubmission}" />
		<ui:param name="isPendingVerification"
			value="#{purchaseInDefaultBackingBean.managedBean.pidStatus.statusId eq DPStatusConstants.pidPendingVerification}" />
		<!-- #9133 - start -->
		<ui:param name="isPidPendingRevision"
			value="#{purchaseInDefaultBackingBean.managedBean.pidStatus.statusId eq DPStatusConstants.pidPendingRevision}" />
		<ui:param name="isPidGenerated" value="#{purchaseInDefaultBackingBean.isPidGenerated()}" />
		<!-- #9133 - end -->

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<!-- 20190417@asyrafhaziq_12095 - Start -->
		<ui:param name="reject" value="REJECT" />
		<ui:param name="rejectPID" value="rejectPID" />
		<!-- #9133 - start -->
		<ui:param name="draft" value="DRAFT" />
		<!-- #9133 - end -->
		<ui:remove>34449 - start</ui:remove>
		<ac:cancelRejectPopup id="#{rejectPID}" widget="rejectPID" width="30%"
			height="100"
			okAction="#{purchaseInDefaultBackingBean.approverAction(reject)}"
			title="#{lbl['lbl.sc.header.message.reject']}"
			content="#{lbl['lbl.reject.dialog.confirm.message']}" update="@this,@([id$=messages])" />
		<!-- 20190417@asyrafhaziq_12095 - End -->
		<ui:remove>34449 - end</ui:remove>

		<ac:gpkiPopup
			textBeforeSign="#{purchaseInDefaultBackingBean.textBeforeSign}"
			postSignAction="#{purchaseInDefaultBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" 
			enableAutoUpdate="#{purchaseInDefaultBackingBean.enableAutoUpdate()}" />
		<c:if
			test="#{purchaseInDefaultBackingBean.managedBean.taskId eq null}">
			<table style="width: 100%">
				<tr>
					<td align="right">
					  <p:commandButton immediate="true"
							partialSubmit="true" process="@this"
							value="#{lbl['lbl.btn.item.search']}"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"
							style="float:left;"
							action="#{purchaseInDefaultBackingBean.backToPrevious}" />
							
						 <p:commandLink
							value="#{lbl['lbl.td.doc.trackingDiary']}" style="float:right;"
							rendered="#{purchaseInDefaultBackingBean.managedBean.trackingDairyView}"
							action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypePurchaseInDefault, purchaseInDefaultBackingBean.managedBean.purchaseInDefault.purchaseInDefaultId)}"
							immediate="true" /> 
							
						<p:commandButton
							immediate="true" value="#{lbl['lbl.btn.back']}"
							partialSubmit="true" process="@this" style="float:left;"
							rendered="#{!purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"
							action="#{purchaseInDefaultBackingBean.backToPrevious}" /> 
						<!-- #9133 - start -->
						<p:commandButton value="#{lbl['lbl.btn.save']}"
							action="#{purchaseInDefaultBackingBean.submitPurchaseInDefault(draft)}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form" process="@form,@([id$=messages])" partialSubmit="true"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}" /> 
						<!-- #9133 - end --> 
						<!-- #28865 change submitPurchaseInDefault() to dialogMsgCheck()-->	
						<p:commandButton
							value="#{lbl['lbl.btn.submit']}"
							action="#{purchaseInDefaultBackingBean.dialogMsgCheck}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form" process="@all" partialSubmit="true"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}" />
						<!-- #9133 - start -->	
						<p:commandButton
							immediate="true" value="#{lbl['lbl.btn.cancel']}"
							update="@form,@([id$=messages])" style="float:right;" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag and !isPidGenerated}"
							action="#{purchaseInDefaultBackingBean.backToPrevious}" /> 	
						<!-- #9133 - end -->
					</td>
				</tr>
			</table>
		</c:if>
		<!-- #9133 - start -->
		<c:if
			test="#{purchaseInDefaultBackingBean.managedBean.taskId ne null and isPendingSubmissionStatus}">
			<table style="width: 100%">
				<tr>
					<td align="right">
						<!-- #9133 - start (hide button back on pending submission status)-->						
						<!-- <p:commandButton
							immediate="true" value="#{lbl['lbl.btn.back']}"
							partialSubmit="true" process="@this" style="float:left;"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"
							action="#{purchaseInDefaultBackingBean.backToPrevious}" /> -->
						<!-- #9133 - end (hide button back on pending submission status)-->	
						<p:commandButton value="#{lbl['lbl.btn.save']}"
							action="#{purchaseInDefaultBackingBean.submitPurchaseInDefault(draft)}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form" process="@form" partialSubmit="true"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}" />
						<p:commandButton
							value="#{lbl['lbl.btn.submit']}"
							action="#{purchaseInDefaultBackingBean.dialogMsgCheck}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form" process="@all" partialSubmit="true"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}" />
						<p:commandButton value="#{lbl['lbl.btn.cancel']}"
							action="#{purchaseInDefaultBackingBean.beforeCancelPid()}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form,@([id$=messages])"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag and isPidGenerated}" />
					</td>
				</tr>
			</table>
		</c:if>
		<!-- #9133 - end -->
		<c:if
			test="#{purchaseInDefaultBackingBean.managedBean.taskId ne null and !isPendingSubmissionStatus}"> <!-- #9133 - add condition not isPendingSubmissionStatus-->
			<table style="width: 100%">
				<tr>
					<td align="right">
					<!-- #9133 - start -->
					<p:commandButton value="#{lbl['lbl.btn.save']}"
							action="#{purchaseInDefaultBackingBean.updatePID()}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							update="@form,@([id$=messages])" process="@form" partialSubmit="true"
							rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}" />
					<!-- #9133 - end -->
					<ui:remove>34449 - start</ui:remove>
					<ui:repeat var="bpmAction"
							value="#{purchaseInDefaultBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

							<ui:param name="isReject" value="${bpmAction == 'REJECT'}" />

							<p:commandButton value="#{lbl[buttonLabel]}" process="@all"
							    onstart="#{isReject ? '' : 'blockWidget.show();'}" oncomplete="#{isReject ? '' : 'blockWidget.hide();'}" 
								styleClass="ui-button" update="#{isReject ? '@form' : ':form:pidConformDlgWrapper'},@([id$=messages])"
								partialSubmit="true"
								actionListener="#{purchaseInDefaultBackingBean.beforeApproverAction(bpmAction)}" />
						</ui:repeat>
						<ui:remove>34449 - end</ui:remove>
						</td>
				</tr>
			</table>
			<ui:remove> 34449 - Popup button from bpm</ui:remove>
			<p:outputPanel id="pidConformDlgWrapper">
				<ac:confirmationPopupSM id="pidConformDlgPid" widget="pidConformDlg"
					width="400" height="100"
					okAction="#{purchaseInDefaultBackingBean.approverAction(purchaseInDefaultBackingBean.managedBean.selectedAction)}"
					title="#{purchaseInDefaultBackingBean.managedBean.confirmationMessageTitle}"
					content="#{purchaseInDefaultBackingBean.managedBean.confirmationMessageContent}"
					update="@form" />
			</p:outputPanel>
			<ui:remove>34449 - end</ui:remove>					
		</c:if>
		<ui:remove> #28865, 34449 - start</ui:remove>
		<ac:confirmationPopupSM id="submitSuppDlgPid"
			widget="submitSuppDlg" width="400" height="100" hasParam="true"
			okParam="#{purchaseInDefaultBackingBean.submitPurchaseInDefault(null)}"
			title="#{lbl['lbl.sc.header.message.submit']}"
			content="#{lbl['lbl.ct.pid.confirm.msg']}"
			update="@this" loadingWidget="blockWidget" />
		<ui:remove> 28865, 34449 - end</ui:remove>
		<ui:remove> 9133, 34449 - start</ui:remove>
		<p:confirmDialog message="#{lbl['lbl.cancel.dialog.confirm.message']}"
			severity="alert" widgetVar="cancelDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.sc.header.message.cancel']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					actionListener="#{purchaseInDefaultBackingBean.updateBPMTasks('CANCEL')}"
					oncomplete="cancelDlg.hide();" partialSubmit="true" process="@this,@([id$=messages])"
					immediate="true" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					oncomplete="cancelDlg.hide();" />
			</div>
		</p:confirmDialog>
		<ui:remove> 9133, 34449 - end</ui:remove>
		<ui:remove>34449 - start</ui:remove>
		<ui:remove> Popup Submit Action </ui:remove>
		<ac:confirmationPopupSM id="submitConformDlgPid"
			widget="submitConformDlg" width="400" height="100"
			okAction="#{purchaseInDefaultBackingBean.submitPurchaseInDefault(null)}"
			title="#{lbl['lbl.sc.header.message.submit']}"
			content="#{lbl['lbl.sc.confirmation.message.submit']}"
			update="@form" />
		
		<ui:remove>34449 - end</ui:remove>
		<ui:include
			src="/xhtml/sc/directpurchase/purchaseindefault/purchaseInDefaultHeader.xhtml" />
		<ui:include src="/xhtml/sc/directpurchase/purchaseindefault/purchaseInDefault.xhtml" />
	</ui:define>
</ui:composition>
