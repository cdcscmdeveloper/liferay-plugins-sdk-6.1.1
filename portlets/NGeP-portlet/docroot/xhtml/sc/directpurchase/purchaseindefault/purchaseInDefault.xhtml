<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<!-- Contract Item  details -->
	<p:panel header="#{lbl['lbl.sc.purchase.in.default.contract.detail']}"
		toggleable="true"
		rendered="#{purchaseInDefaultBackingBean.managedBean.checkContractItem}">
		<table>
			<tr>
				<td style="width: 23%;"><p:outputLabel
						value="#{lbl['lbl.sc.direct.purchase.title']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:inputText size="46" id="ctitle"
						required="true" maxlength="100"
						label="#{lbl['lbl.sc.direct.purchase.title']}"
						disabled="#{!isPendingSubmissionStatus}"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.title}"
						style="margin-bottom: 5px;" /> <p:message id="ctitleMsg"
						for="ctitle" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.supp.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctContractVer.ctContract.smSupplier.companyName}"
						size="46" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.register.num']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.smGstSupplier.gstRegNo}"
						size="35" /> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.register.num.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.prod.code']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.scRequestItem.cmItem.extensionCode}"
						size="46" /></td>

				<td><p:outputLabel value="#{lbl['lbl.sc.gst.effective.date']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.smGstSupplier.gstEffDate}"
						size="35">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.effective.date.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.min.qty']}" /></td>
				<td><p:inputText disabled="true" style="text-align:right;"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.minimumOrderQty}"
						size="46">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.declared.date']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.smGstSupplier.gstDeclaredDate}"
						size="35">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.gst.declared.date.tooltip']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.val.period']}" /></td>
				<td><p:inputText disabled="true" size="19"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctContractVer.ctContractValue.effDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="2px" /> <p:inputText disabled="true" size="20"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctContractVer.ctContractValue.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>

				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.scRequestItem.itemName}"
						size="35" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.max.proc.amt']}" /></td>
				<td><p:inputText disabled="true" style="text-align:right;"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.maxProcureAmt}"
						size="46">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>

	<p:panel toggleable="true"
		rendered="#{purchaseInDefaultBackingBean.managedBean.checkContractItem}">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText
				value="#{lbl['lbl.sc.purchase.in.default.item.details']}" />
		</f:facet>
		<p:dataTable id="respDtl" var="itemPrice"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.contractedItem.ctItemPrices}"
			rowKey="#{itemPrice}" rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.zone']}"
				style="width:25%">
				<h:outputText value="#{itemPrice.ctContractZone.zoneName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.from.qty']}"
				style="width:10%">
				<h:outputText value="#{itemPrice.fromQty}" style="float:right" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.purchase.in.default.to.qty']}"
				style="width:10%">
				<h:outputText value="#{itemPrice.toQty}" style="float:right" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.unit.price']}" style="width:15%">
				<p:inputText value="#{itemPrice.unitPrice}"
					style="text-align:right;" size="30" required="true" maxlength="19"
					id="unitPrice" label="#{lbl['lbl.sc.unit.price']}" disabled="true">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
				<p:message id="unitPriceMsg" for="unitPrice" display="icon" />
			</p:column>
		</p:dataTable>
	</p:panel>


	<!-- Panel Item details -->
	<p:panel
		header="#{lbl['lbl.sc.purchase.in.default.panel.item.detail']}"
		toggleable="true"
		rendered="#{!purchaseInDefaultBackingBean.managedBean.checkContractItem}">
		<table>
			<tr>
				<td style="width: 23%;"><p:outputLabel
						value="#{lbl['lbl.sc.direct.purchase.title']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText size="46" id="ptitle" required="true"
						maxlength="100" label="#{lbl['lbl.sc.direct.purchase.title']}"
						disabled="#{!isPendingSubmissionStatus}"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.title}"
						style="margin-bottom: 5px;" /> <p:message id="ptitleMsg"
						for="ptitle" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.supp.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.ctPanelSuppliers[0].supplier.companyName}"
						size="46" /></td>

			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.prod.code']}" /></td>
				<td><p:inputText disabled="true" size="46"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.scRequestItem.cmItem.extensionCode}" /></td>


				<td style="width: 15%;"><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.scRequestItem.itemName}"
						size="40" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.min.qty']}" /></td>
				<td><p:inputText disabled="true" style="text-align:right;"
						size="46"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.minimumOrderQty}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>

			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.val.period']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.ctCircularVer.startDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="2px" /> <p:inputText disabled="true"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.ctCircularVer.endDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>

			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.purchase.in.default.max.proc.amt']}" /></td>
				<td><p:inputText disabled="true" style="text-align:right;"
						size="46"
						value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.maxProcureAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>

	<p:panel toggleable="true" header="#{lbl['lbl.sc.companyinfo']}"
		rendered="#{!purchaseInDefaultBackingBean.managedBean.checkContractItem}">
		<p:dataTable id="panelSuppId" var="panelSupplier"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.panelItem.ctPanelSuppliers}"
			rowKey="#{panelSupplier}" rowIndexVar="index">
			<ui:param name="smGstSupplier"
				value="#{purchaseInDefaultBackingBean.retrivePanelSupplierGstInfomation(panelSupplier.supplier)}"></ui:param>
			<ac:paginator for="panelSuppId" />
			<p:column
				headerText="#{lbl['lbl.sc.purchase.in.default.supplier.supp.name']}">
				<h:outputText value="#{panelSupplier.supplier.companyName}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.purchase.in.default.supplier.Reg.no']}"
				style="width:7%">
				<h:outputText value="#{panelSupplier.supplier.regNo}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.purchase.in.default.supplier.ep.no']}"
				style="width:8%">
				<h:outputText value="#{panelSupplier.supplier.epNo}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.purchase.in.default.supplier.mof.no']}"
				style="width:8%">
				<h:outputText
					value="#{panelSupplier.supplier.smMofAccounts[0].mofNo}" />
			</p:column>
			<p:column style="width:14%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.gst.register.num']}" />
					<ac:iconTooltip id="gstRegNo#{index}"
						value="#{lbl['lbl.sc.gst.register.num.tooltip']}" />
				</f:facet>
				<h:outputText value="#{smGstSupplier.gstRegNo}"></h:outputText>

			</p:column>

			<p:column style="width:14%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.gst.effective.date']}" />
					<ac:iconTooltip id="gstEffDate#{index}"
						value="#{lbl['lbl.sc.gst.effective.date.tooltip']}" />
				</f:facet>
				<h:outputText value="#{smGstSupplier.gstEffDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column style="width:14%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.gst.declared.date']}" />
					<ac:iconTooltip id="gstDecDate#{index}"
						value="#{lbl['lbl.sc.gst.declared.date.tooltip']}" />
				</f:facet>
				<h:outputText value="#{smGstSupplier.gstDeclaredDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel toggleable="true" id="reqDtlId">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText
				value="#{lbl['lbl.sc.purchase.in.default.req.details']}" />
		</f:facet>

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.pid.reason.instruction']}">
		</h:outputText>
		<h:panelGroup>
			<table style="width: 100%; margin-top: 8px;">
				<tr>
					<td style="width: 23%;"><p:outputLabel
							value="#{lbl['lbl.sc.purchase.in.default.valid.period']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="pidvalidDays" maxlength="3"
							required="true"
							label="#{lbl['lbl.sc.purchase.in.default.valid.period']}"
							value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.pidValidDays}"
							size="46" style="text-align:right;margin-right: 5px;"
							disabled="#{!(isPendingSubmissionStatus or isPendingVerification)}">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputText> <p:message id="pidvalidDaysMsg" for="pidvalidDays" display="icon" /></td>
				</tr>

				<tr>
					<td style="width: 23%;"><p:outputLabel
							value="#{lbl['lbl.sc.purchase.in.default.just']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="justId"
										label="#{lbl['lbl.sc.purchase.in.default.just']}"
										disabled="#{!isPendingSubmissionStatus}" required="true"
										value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.reasonType.reasonCode}"
										style="margin-bottom: 5px;width:346px;">
										<f:selectItems
											value="#{purchaseInDefaultBackingBean.managedBean.justifications}" />

										<p:ajax event="change" update="@([id$=reqDtlId])"
											partialSubmit="true" process="@this"
											listener="#{purchaseInDefaultBackingBean.justificationTypeEvent}" />
									</p:selectOneMenu> <p:commandLink style="text-align:left" ajax="false"
										partialSubmit="true" process="@this" immediate="true"
										action="#{purchaseInDefaultBackingBean.viewMarketResearch(purchaseInDefaultBackingBean.managedBean.purchaseInDefault)}">
										<p:spacer width="3px"></p:spacer>
										<p:graphicImage value="/css/images/design/ico-view.png"
											title="#{lbl['lbl.sc.summary.searchresult.tooltip']}"></p:graphicImage>
									</p:commandLink></td>
								<td><p:message id="justIdMsg" for="justId" display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
				
				<tr>
					<td style="width: 23%;"><p:outputLabel
							value="#{lbl['lbl.sc.request.note.header.method']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="methodId"
										label="#{lbl['lbl.sc.request.note.header.method']}"
										disabled="#{!isPendingSubmissionStatus}" required="true"
										value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.sourceMethod}"
										style="margin-bottom: 5px;width:346px;">
										<f:selectItems
											value="#{purchaseInDefaultBackingBean.managedBean.sourceMethods}" />

									</p:selectOneMenu> 
								</td>
								<td><p:message id="methodIdMsg" for="methodId" display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</h:panelGroup>

		<h:panelGroup id="orderQty"
			rendered="#{purchaseInDefaultBackingBean.managedBean.visibleOrderQty}">
			<table style="width: 100%">
				<tr>
					<td style="width: 23%;"><p:outputLabel
							value="#{lbl['lbl.sc.purchase.in.default.order.qty']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="ordqty" maxlength="14"
							required="#{purchaseInDefaultBackingBean.managedBean.visibleOrderQty}"
							validatorMessage="* Order Qty: must be a decimal number between 0.0 and 9999999999.999"
							label="#{lbl['lbl.sc.purchase.in.default.order.qty']}"
							value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.quantity}"
							style="text-align:right;" size="46"
							disabled="#{!isPendingSubmissionStatus}">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputText> <p:message id="ordqtyMsg" for="ordqty" display="icon" /></td>
				</tr>
			</table>
		</h:panelGroup>
		<h:panelGroup id="rmkId">
			<table style="width: 100%">
				<tr>
					<td width="23%"
						style="vertical-align: top; padding-right: 1px; text-align: right;"><h:outputLabel
							value="#{lbl['lbl.sc.purchase.in.default.remark']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td class="TableFieldRight"><p:dataGrid id="catatan"
							value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.remarks}"
							var="remarkVar" rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" style="vertical-align: top;" align="left">
										<h:graphicImage
											value="#{purchaseInDefaultBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											height="30" width="30" />
									</td>
									<td width="6"></td>
									<td><h:outputText
											value="#{remarkVar.createdUser.userName}" />, <h:outputText
											id="remarkDate" value="#{remarkVar.createdDate}">
											<f:convertDateTime
												pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea style="width:297px;"
											value="#{remarkVar.remark}" maxlength="1000" label="Remarks"
											rendered="#{remarkIndex==0}" id="remark"
											disabled="#{!purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"
											required="true" /> <h:outputText
											value="#{remarkVar.remark}" rendered="#{remarkIndex>0}"
											style="display: inline-block; width:220px;word-wrap: break-word;" />
									</td>
									<td
										style="vertical-align: top; padding-right: 1px; text-align: right;">
										<p:message id="remarkMsg" for="remark" display="icon" />
									</td>
								</tr>
							</table>
						</p:dataGrid></td>
				</tr>
			</table>
		</h:panelGroup>

		<h:panelGroup id="attachmentId">
			<ui:param name="attachFile"
				value="#{purchaseInDefaultBackingBean.managedBean.purchaseInDefault.scPurchaseInDefaultAttachment}" />

			<table style="width: 100%">
				<tr>
					<td width="23%" style="padding-right: 0px; text-align: right;">
						<p:outputLabel
							value="#{lbl['lbl.sc.purchase.in.default.attachment']}" /> <p:outputLabel
							value="*" styleClass="mandatory" />
					</td>
					<td class="TableFieldRight"><p:commandButton
							oncomplete="uploadDlg.show();return false;" icon="iconAttachment"
							update="attachmentId" disabled="#{!isPendingSubmissionStatus}"
							value="#{lbl['lbl.sc.purchase.in.default.choose.file']}" /> <c:if
							test="#{!empty attachFile}">
							<h:commandLink value="#{attachFile.fileName}"
								styleClass="blue_font" immediate="true"
								action="#{purchaseInDefaultBackingBean.downloadFile(attachFile)}" />
							<p:commandLink
								action="#{purchaseInDefaultBackingBean.deleteUploadFile}"
								immediate="true" update="attachmentId"
								disabled="#{!isPendingSubmissionStatus}">
								<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
							</p:commandLink>

						</c:if></td>
				</tr>
			</table>
		</h:panelGroup>
	</p:panel>
	<p:panel id="approversId" toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText
				value="#{lbl['lbl.sc.purchase.in.default.verified.by']}" />
		</f:facet>

		<table style="width: 100%">
			<tr>
				<td style="width: 23%"><h:outputLabel
						value="#{lbl['lbl.sc.ptj.approver.group']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="appGroupId"
				        style="width:300px; margin-bottom:5px;"
						disabled="#{!isPendingSubmissionStatus}" required="true"
						label="#{lbl['lbl.sc.ptj.approver.group']}"
						value="#{purchaseInDefaultBackingBean.managedBean.userGroupId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<p:ajax event="change" process="@this" update="approversId"
							listener="#{purchaseInDefaultBackingBean.userGroupChangeListener()}" />
						<f:selectItems
							value="#{purchaseInDefaultBackingBean.getUserGroupDropdown()}" />
					</p:selectOneMenu> <p:message id="appGroupIdMsg" for="appGroupId" display="icon" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.approverName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="approverDropdown" required="true"
						label="#{lbl['lbl.sc.approverName']}"
						disabled="#{!isPendingSubmissionStatus}"
						value="#{purchaseInDefaultBackingBean.managedBean.selectedApproverId}"
						style="width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{purchaseInDefaultBackingBean.managedBean.approverList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}" />
						<p:ajax event="change" update="approversId" />
					</p:selectOneMenu> <p:message id="approverDropdownMsg" for="approverDropdown" display="icon" /></td>
			</tr>
		</table>
	</p:panel>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.purchase.in.default.choose.file']}">
		<p:ajax event="close" oncomplete="uploadDlg.hide()" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{purchaseInDefaultBackingBean.handleFileUpload}"
			mode="advanced" id="upload"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" 
			cancelLabel="#{lbl['lbl.btn.cancel']}"
			update="@form" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
