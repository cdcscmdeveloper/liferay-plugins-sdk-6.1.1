
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	<c:if test="#{purchaseInDefaultBackingBean.managedBean.titleChecker}">
		 <ac:title value="#{lbl['lbl.sc.pid']}" />
	</c:if>
    <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info"  showSummary="false"/>
    
      <p:blockUI block=":form"  widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	 </p:blockUI>
    
    
   <p:panel id="mailPanel">
	  <div align="right">
	    <c:if test="#{purchaseInDefaultBackingBean.managedBean.taskId eq null}">
	        <p:commandButton  immediate="true" 
	          value="#{lbl['lbl.sc.action.back.to.search.catalogue']}" icon="ui-icon-back"
	          rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"
			  style="float:left;" action="#{purchaseInDefaultBackingBean.backToPervious}"  />
			 
			<p:commandButton immediate="true"  
			   value="#{lbl['lbl.sc.common.back']}" icon="ui-icon-back"
			   partialSubmit="true" process="@this" style="float:left;"
			   rendered="#{!purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"
			   action="#{purchaseInDefaultBackingBean.backToPervious}" />
					 
		    <p:commandButton value="#{lbl['lbl.sc.common.submit']}" action="#{purchaseInDefaultBackingBean.submitPurchaseInDefault()}"
		      onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			  icon="ui-icon-submit" update="mailPanel" process="@all" 
			  rendered="#{purchaseInDefaultBackingBean.managedBean.pidBtnFlag}"/>
	    </c:if>
	    
	     <table>
			<tr>
				<td align="right"><c:if
						test="#{purchaseInDefaultBackingBean.managedBean.taskId ne null}">
						<c:forEach items="#{purchaseInDefaultBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						<c:if test="${action == 'REVISE'}">
							<ui:param name="iconVar" value="ui-icon-revise" />

						</c:if>
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<c:if test="${action == 'ACCEPT'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<p:commandButton value="#{action}" process="@all"
						        onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{purchaseInDefaultBackingBean.approverAction(action)}" />
						</c:forEach>
					</c:if></td>
			</tr>
		</table>
     </div>
	   
	  <p:spacer height="5px" />
		<table style="border: 0px; align:center">
			<tr>
			  <td> <td width="100%" align="left" valign="top">
				   <ui:include src="/xhtml/sc/directpurchase/purchaseInDefault.xhtml" />
				</td></td>
			</tr>
		</table>
     </p:panel>	
   			
	</ui:define>
	</ui:composition>
