
<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
	<p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" />

       <p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td" >
			<p:row>
				<p:column width="100%" style="text-align:right">
				   <p:commandButton value="#{lbl['lbl.ss.submit']}" action="#{purchaseInDefaultBackingBean.submitPurchaseInDefault()}"

			</p:row>
	   </p:panelGrid>
	  <p:spacer height="10px" />
		<table style="border: 0px;width:1000 px; align:center">
			<tr>
				<td><td width="100%" align="left" valign="top" style="border: 0px;width:1000 px; 
				     align:center; padding-right: 10px; padding-bottom: 10px;padding-left: 10px; background-color: #F2F2F2;">
				      <ui:include src="/xhtml/sc/directpurchase/purchaseInDefault.xhtml" />
				</td></td>
			</tr>
		</table>
     </p:panel>	
   			
	</ui:define>
