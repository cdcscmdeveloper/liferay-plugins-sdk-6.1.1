<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="headerId">
	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.simple.quote.no']}" />
				</td>
				<td style="width: 10%" class="header-info-text">
					#{simpleQuoteBackingBean.managedBean.quoteNo}
				</td>
				
				<td style="width: 10%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.proc.type']}" />
				</td>
				<td style="width: 8%" class="header-info-text">
				  #{simpleQuoteBackingBean.getParameterDesc(ParameterTypeConst.procurementType,simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode)}
				</td>
				
				<td style="width: 6%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.ptn.name']}" />
				</td>
				<td style="width: 25%" class="header-info-text">
				   #{simpleQuoteBackingBean.managedBean.ptjName}
				</td>
				
				<td style="width: 6%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.status']}" />
				</td>
				<td style="width: 10%" class="header-info-text">
				 #{simpleQuoteBackingBean.managedBean.simpleQuoteStatus}
				</td>
				
			</tr>
		</table>
	</div>
	</p:panel>
</ui:composition>
