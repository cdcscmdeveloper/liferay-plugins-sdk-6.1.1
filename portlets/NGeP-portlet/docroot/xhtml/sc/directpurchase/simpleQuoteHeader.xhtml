<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <div class="header-info">
		<h:panelGrid border="0" width="100%" styleClass="header-info"
			columns="8" id="headerId">
			<h:outputLabel
				value="#{lbl['lbl.sc.sq.gen.info.header.simple.quote.no']}" />
			<p:inputText disabled="true"
				value="#{simpleQuoteBackingBean.managedBean.scQuote.quoteNo}" />

			<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.proc.type']}" />
			<p:inputText disabled="true"
				value="#{simpleQuoteBackingBean.getParameterDesc(ParameterTypeConst.procurementType,simpleQuoteBackingBean.managedBean.procurementType)}" />

			<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.ptn.name']}" />
			<p:inputText disabled="true" size="30"
				value="#{simpleQuoteBackingBean.managedBean.ptjName}" />

			<h:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.status']}" />
			<p:inputText disabled="true"
				value="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus}" />

		</h:panelGrid>
	</div>
</ui:composition>
