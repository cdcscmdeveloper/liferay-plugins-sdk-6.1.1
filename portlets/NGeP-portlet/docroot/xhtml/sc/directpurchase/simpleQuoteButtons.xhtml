<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="sqMain">
    <div align="right">
	    <c:if test="#{simpleQuoteBackingBean.managedBean.taskId eq null}">
			  <p:commandButton immediate="true" value="#{lbl['lbl.sc.common.back']}" icon="ui-icon-back" partialSubmit="true" process="@this"
				style="float:left;" action="#{simpleQuoteBackingBean.backToPervious}"/>
				
		      <p:commandButton value="#{lbl['lbl.sc.common.save']}" icon="ui-icon-save" 
					    action="#{simpleQuoteBackingBean.saveSimpleQuote}" update="@form" process="@all"/>
				
			 <p:commandButton value="#{lbl['lbl.sc.common.submit']}"  action="#{simpleQuoteBackingBean.submitSimpleQuote}"
			   style="float:right;" icon="ui-icon-submit" update="@form" process="@all"/>
	    </c:if>
	     <table>
			<tr>
				<td align="right"><c:if
						test="#{simpleQuoteBackingBean.managedBean.taskId ne null}">
						<c:forEach items="#{simpleQuoteBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						
						<p:commandButton value="#{action}" process="@all"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{simpleQuoteBackingBean.approverAction(action)}" />
								
						</c:forEach>

					</c:if></td>
			</tr>
		</table>
	</div>
</p:panel>
</ui:composition>
