<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<p:dialog id="quoteSubmitConform" widgetVar="sqConformDlg"
		header="#{lbl['lbl.sc.submit.confirmation']}" resizable="false"
		width="500" height="100" closable="false" modal="true">

		<table>
			<tr>
				<td><h:graphicImage value="/css/images/design/exclamation.png" />
					#{simpleQuoteBackingBean.managedBean.promptMessage}</td>
			</tr>
		</table>

		<p:spacer height="1" />
		<h:panelGroup id="conformDlgId">
			<div class="ppRightBtn" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form"
					rendered="#{simpleQuoteBackingBean.managedBean.conformDlgBtnFlag}"
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();sqConformDlg.hide();"
					actionListener="#{simpleQuoteBackingBean.submitSimpleQuote(simpleQuoteBackingBean.managedBean.selectedAction)}" />

				<p:commandButton value="#{lbl['lbl.btn.no']}"
					rendered="#{simpleQuoteBackingBean.managedBean.conformDlgBtnFlag}"
					partialSubmit="true" process="@this" onclick="sqConformDlg.hide();"
					type="button" />

				<p:commandButton value="#{lbl['lbl.sc.ok']}"
					rendered="#{!simpleQuoteBackingBean.managedBean.conformDlgBtnFlag}"
					partialSubmit="true" process="@this" onclick="sqConformDlg.hide();"
					type="button" />

			</div>
		</h:panelGroup>
	</p:dialog>
     <p:spacer height="2px" />
	<div class="ppLeftBtn">
		<p:commandButton immediate="true" id="backButton"
			value="#{lbl['lbl.btn.item.search']}" partialSubmit="true"
			process="@this" style="float:left;"
			rendered="#{isEditable}"
			action="#{simpleQuoteBackingBean.backToPrevious}"
			title="#{lbl['lbl.sc.itemsearch.tooltip']}">
		</p:commandButton>

		<p:commandButton immediate="true" value="#{lbl['lbl.btn.back']}"
			partialSubmit="true" process="@this" style="float:left;"
			rendered="#{!isEditable}"
			action="#{simpleQuoteBackingBean.backToPrevious}" />
	</div>

	<c:if test="#{simpleQuoteBackingBean.managedBean.taskId eq null}">
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.save']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{simpleQuoteBackingBean.saveSimpleQuote('')}"
				process="@all" update="@form"
				rendered="#{simpleQuoteBackingBean.managedBean.editableFlag}" />
			<p:commandButton value="#{lbl['lbl.btn.submit']}"
				actionListener="#{simpleQuoteBackingBean.submitPromptAction}"
				update="@form" process="@all"
				rendered="#{simpleQuoteBackingBean.managedBean.editableFlag}">

				<ui:param name="action" value=""></ui:param>
				<f:setPropertyActionListener
					target="#{simpleQuoteBackingBean.managedBean.selectedAction}"
					value="#{action}" />
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
				action="#{simpleQuoteBackingBean.cancel}" style="float:right;"
				process="@this" partialSubmit="true"
				rendered="#{simpleQuoteBackingBean.managedBean.editableFlag}" />
		</div>
	</c:if>

	<c:if test="#{simpleQuoteBackingBean.managedBean.taskId ne null}">
		<div class="ppRightBtn">
			<!-- to view simple Quote from the request note header  Icon    -->
			<c:if test="#{simpleQuoteBackingBean.managedBean.editableFlag}">
				<c:if
					test="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus.statusId eq DPStatusConstants.rnPendingApproval 
									  or isEditable}">
					<p:commandButton value="#{lbl['lbl.btn.save']}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						action="#{simpleQuoteBackingBean.saveSimpleQuote('Save')}"
						update="@form" process="@all" />
				</c:if>

				<ui:repeat var="bpmAction"
					value="#{simpleQuoteBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel"
						value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

					<h:panelGroup rendered="#{bpmAction eq 'SUBMIT'}">
						<p:commandButton value="#{lbl[buttonLabel]}"
							rendered="#{isEditable}" styleClass="ui-button"
							partialSubmit="true" process="@form"
							actionListener="#{simpleQuoteBackingBean.submitPromptAction}"
							update="@form">
							<f:setPropertyActionListener
								target="#{simpleQuoteBackingBean.managedBean.selectedAction}"
								value="#{bpmAction}" />
						</p:commandButton>
					</h:panelGroup>
					<h:panelGroup rendered="#{bpmAction eq 'CANCEL'}">
						<p:commandButton value="#{lbl[buttonLabel]}" process="@all"
							update="@form" rendered="#{isEditable}"
							styleClass="ui-button" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							actionListener="#{simpleQuoteBackingBean.submitSimpleQuote(bpmAction)}" />
					</h:panelGroup>
				</ui:repeat>

			</c:if>
		</div>
	</c:if>
</ui:composition>
