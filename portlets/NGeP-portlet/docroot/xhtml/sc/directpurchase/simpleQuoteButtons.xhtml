<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<p:panel>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<p:confirmDialog
			message="#{simpleQuoteBackingBean.managedBean.promptMessage}"
			id="promptId" width="450px" height="80px" widgetVar="sqConformDlg"
			severity="alert" closable="false"
			header="#{lbl['lbl.ss.simple.quote.submit.confirmation']}">

			<p:blockUI block="conformDlgId" widgetVar="promptWidget"
				id="conformDlg">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>

			<p:panel id="conformDlgId">
				<p:panelGrid styleClass="noBorders tr,noBorders td">
					<p:row>
						<p:column width="100%" style="text-align:right">
							<p:commandButton value="#{lbl['lbl.btn.yes']}" update="@form" rendered="#{simpleQuoteBackingBean.managedBean.conformDlgBtnFlag}"
								onstart="promptWidget.show()" oncomplete="promptWidget.hide();"
								icon="ui-icon-accept" onsuccess="sqConformDlg.hide()"
								actionListener="#{simpleQuoteBackingBean.submitSimpleQuote(simpleQuoteBackingBean.managedBean.selectedAction)}" />
						  <p:commandButton value="#{lbl['lbl.btn.no']}" rendered="#{simpleQuoteBackingBean.managedBean.conformDlgBtnFlag}"
								partialSubmit="true" process="@this" icon="ui-icon-reject"
								onclick="sqConformDlg.hide();" type="button" />
								
						   <p:commandButton value="#{lbl['lbl.sc.ok']}" rendered="#{!simpleQuoteBackingBean.managedBean.conformDlgBtnFlag}"
								partialSubmit="true" process="@this" icon="ui-icon-accept"
								onclick="sqConformDlg.hide();" type="button" />
								
						</p:column>
					</p:row>
				</p:panelGrid>
			</p:panel>
		</p:confirmDialog>

		<div class="ppRightBtn">
			<c:if test="#{simpleQuoteBackingBean.managedBean.taskId eq null}">
				<p:commandButton immediate="true"
					id="backButton"
					value="#{lbl['lbl.sc.action.back.to.search.catalogue']}"
					icon="ui-icon-back" partialSubmit="true" process="@this"
					style="float:left;"
					rendered="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending Submission'}"
					action="#{simpleQuoteBackingBean.backToPervious}" >
					<p:tooltip for="backButton">
						<h:outputText value="#{lbl['lbl.sc.itemsearch.tooltip']}" escape="false" />
					</p:tooltip>
					
				</p:commandButton>

				<p:commandButton immediate="true"
					value="#{lbl['lbl.sc.common.back']}" icon="ui-icon-back"
					partialSubmit="true" process="@this" style="float:left;"
					rendered="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending RN Creation'}"
					action="#{simpleQuoteBackingBean.backToPervious}" />

				<p:commandButton value="#{lbl['lbl.sc.common.save']}"
					icon="ui-icon-save" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();"
					action="#{simpleQuoteBackingBean.saveSimpleQuote('')}"
					process="@all" update="@form"
					rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}" />

				<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					actionListener="#{simpleQuoteBackingBean.submitPromptAction}"
					update="@form" process="@all" icon="ui-icon-submit"
					rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">

					<ui:param name="action" value=""></ui:param>
					<f:setPropertyActionListener
						target="#{simpleQuoteBackingBean.managedBean.selectedAction}"
						value="#{action}" />
				</p:commandButton>

				<p:commandButton value="#{lbl['lbl.sc.common.cancel']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					action="#{simpleQuoteBackingBean.cancel}" style="float:right;"
					icon="ui-icon-cancel" process="@this" partialSubmit="true"
					rendered="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}" />
			</c:if>
		</div>

		<div>
			<c:if test="#{simpleQuoteBackingBean.managedBean.taskId ne null}">
				<table style="width: 100%">
					<tr>
						<td align="right"><c:if
								test="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending Submission'}">
								<p:commandButton immediate="true"
									value="#{lbl['lbl.sc.action.back.to.search.catalogue']}"
									icon="ui-icon-back" partialSubmit="true" process="@this"
									style="float:left;"
									action="#{simpleQuoteBackingBean.backToPervious}" />
							</c:if> <!-- to view simple Quote from the request note header  Icon    -->
							<c:if test="#{simpleQuoteBackingBean.managedBean.rnToSQFlag}">
								<c:if
									test="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending Approval' 
									  or simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending Submission'}">
									<p:commandButton value="#{lbl['lbl.sc.common.save']}"
										icon="ui-icon-save" onstart="blockWidget.show();"
										oncomplete="blockWidget.hide();"
										action="#{simpleQuoteBackingBean.saveSimpleQuote('Save')}"
										update="@form" process="@all" />
								</c:if>

								<ui:repeat var="bpmAction"
									value="#{simpleQuoteBackingBean.managedBean.outComes}">
									<ui:param name="buttonLabel"
										value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

									<h:panelGroup rendered="#{bpmAction eq 'SUBMIT'}">
										<p:commandButton value="#{lbl[buttonLabel]}"
											rendered="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending Submission'}"
											styleClass="ui-button"
											partialSubmit="true" process="@form"
											icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
											actionListener="#{simpleQuoteBackingBean.submitPromptAction}"
											update="@form">
											<f:setPropertyActionListener target="#{simpleQuoteBackingBean.managedBean.selectedAction}"
												value="#{bpmAction}" />
										</p:commandButton>
									</h:panelGroup>
									<h:panelGroup rendered="#{bpmAction eq 'CANCEL'}">
										<p:commandButton value="#{lbl[buttonLabel]}" process="@all"
											update="@form"
											rendered="#{simpleQuoteBackingBean.managedBean.simpleQuoteStatus eq 'Pending Submission'}"
											styleClass="ui-button"
											icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
											onstart="blockWidget.show();"
											oncomplete="blockWidget.hide();"
											actionListener="#{simpleQuoteBackingBean.submitSimpleQuote(bpmAction)}" />
									</h:panelGroup>
								</ui:repeat>

							</c:if></td>
					</tr>
				</table>
			</c:if>
		</div>
	</p:panel>

</ui:composition>
