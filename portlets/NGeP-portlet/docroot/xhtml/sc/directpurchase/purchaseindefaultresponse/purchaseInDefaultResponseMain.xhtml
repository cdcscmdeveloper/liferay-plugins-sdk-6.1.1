<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="contentSection">
		<c:if test="#{purchaseInDefaultBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.purchase.in.default']}" />
		</c:if>
		<p:messages showDetail="true"
			autoUpdate="#{purchaseInDefaultBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" showSummary="false" />

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<ac:gpkiPopup
			textBeforeSign="#{purchaseInDefaultBackingBean.textBeforeSign}"
			postSignAction="#{purchaseInDefaultBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" 
			enableAutoUpdate="#{purchaseInDefaultBackingBean.enableAutoUpdate()}" />
			<ui:param name="reject" value="REJECT" />
			<ui:param name="accept" value="ACCEPT" />
			<table style="width: 100%">
				<tr>
				<td align="right"><h:panelGroup>
						<p:commandButton value="#{lbl['lbl.btn.save']}"
							action="#{purchaseInDefaultBackingBean.updatePID}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							process="@form" update="@form" />
						<p:commandButton value="#{lbl['lbl.btn.accept']}"
							onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							action="#{purchaseInDefaultBackingBean.supplierAction(accept)}"></p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.reject']}"
							onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()"
							action="#{purchaseInDefaultBackingBean.supplierAction(reject)}"></p:commandButton>

					</h:panelGroup></td>
			</tr>
			</table>
		<p:confirmDialog message="#{lbl['lbl.ct.pid.confirm.reject.msg']}"
			severity="alert" widgetVar="rejectDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.sc.dialog.confirm.header.reject']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					actionListener="#{purchaseInDefaultBackingBean.updateBPMTasks('REJECT')}"
					oncomplete="rejectDlg.hide();" 
					partialSubmit="true" process="@this" immediate="true" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" oncomplete="rejectDlg.hide();" />
			</div>
		</p:confirmDialog>
		<ui:include
			src="/xhtml/sc/directpurchase/purchaseindefault/purchaseInDefaultHeader.xhtml" />
		<ui:include src="/xhtml/sc/directpurchase/purchaseindefaultresponse/purchaseInDefaultResponse.xhtml" />
	</ui:define>
</ui:composition>
