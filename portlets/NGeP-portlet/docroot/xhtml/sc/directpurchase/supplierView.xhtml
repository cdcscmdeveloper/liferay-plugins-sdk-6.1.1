   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel id="suppViewId">
     <div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 13%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.simple.quote.no']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{simpleQuoteBackingBean.managedBean.scQuote.quoteNo}
				</td>
				<td style="width: 13%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.ptj.name']}" />
				</td>
				<td style="width: 30%" class="header-info-text">
				    #{simpleQuoteBackingBean.managedBean.scQuote.requestNotes[0].pmOrgProfile.orgName}
				</td>
				<td style="width: 13%">
					<h:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.req.date']}" />
				</td>
				<td style="width: 21%" class="header-info-text">
				  <p:calendar  pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.createdDate}" disabled="true"/>
				</td>
			</tr>
		</table>
	</div>
	
	<p:panel id="suppViewDtl" header="#{lbl['lbl.sc.supplier.details']}"
		toggleable="true">
		<p:spacer height="10px" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.criteria.ep.no']}" /></td>
				<td><p:inputText disabled="true" value="#{simpleQuoteBackingBean.managedBean.smSupplier.epNo}"/></td>

				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.supp.criteria.supp.name']}" /></td>
				<td><p:inputText disabled="true"  size="55" value="#{simpleQuoteBackingBean.managedBean.smSupplier.companyName}"/></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.mof.no']}" /></td>
				<td><p:inputText disabled="true" value="#{simpleQuoteBackingBean.managedBean.smSupplier.smMofAccounts[0].mofNo}"/> 
				
				</td>
			</tr>
	  </table>
	</p:panel>

	<p:panel id="tplSpecId" header="#{lbl['lbl.ss.simple.quote.details']}" toggleable="true">
		<p:spacer height="5px" />
		<table style="width: 100%;">
		   <tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.panel']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.panel}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}" itemValue="false" />
					</p:selectOneRadio></td>
		   </tr>
		
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td><p:inputText disabled="true" size="91"  value="#{simpleQuoteBackingBean.managedBean.scQuote.title}"/></td>
		   </tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.desc']}" /></td>
				<td colspan="3"><p:inputTextarea disabled="true" rows="3"
						cols="93" style="margin-bottom: 5px;" /></td>
			</tr>
			<tr>
				<td style="width: 200px;">
				<p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.zonal']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.zonal}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.btn.yes']}"
							itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.btn.no']}"
							itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.start.date']}" /></td>
			    <td><p:calendar  pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}" disabled="true"/></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.end.date']}" /></td>
				<td><p:calendar  pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}" disabled="true"/></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.no.of.quote']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.single']}" itemValue="false" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.multiple']}" itemValue="true" />
					</p:selectOneRadio></td>
			</tr>

		</table>
		<p:spacer height="5px" />
       
      <h:panelGroup style="width: 100%;" rendered="#{fn:length(simpleQuoteBackingBean.managedBean.productTemplateSpecBean.specAnswerList) ne '0'}">
		<ac:templateSpec
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
			title="#{lbl['lbl.ss.simple.quote.product.list']}" />
      </h:panelGroup>
      
	<p:spacer height="25px" />
	 <h:panelGroup style="width: 100%;" rendered="#{fn:length(simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean.specAnswerList) ne '0'}">
		<ac:templateSpec
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
			title="#{lbl['lbl.ss.simple.quote.service.list']}" />
       </h:panelGroup>
	</p:panel>
	
	<p:panel label="#{lbl['lbl.ss.simple.quote.remark']}" header="#{lbl['lbl.ss.simple.quote.remark']}" id="suppRmkId" toggleable="true" toggleSpeed="500">
	 <table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="12%"></td>
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{simpleQuoteBackingBean.managedBean.scQuote.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{simpleQuoteBackingBean.userImagePath(remarkVar.user.loginId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUser.userName}"/>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" />
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	  </table>
	</p:panel>
	</p:panel>
</ui:composition>
