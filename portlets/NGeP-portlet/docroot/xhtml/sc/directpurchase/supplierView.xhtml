   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="suppViewDtl" header="SUPPLIER DETAILS"
		toggleable="true">
		<p:spacer height="10px" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.ep.no']}" /></td>
				<td><p:inputText disabled="true" value="#{simpleQuoteBackingBean.managedBean.smSupplier.epNo}"/></td>

				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.supp.view.supp.name']}" /></td>
				<td><p:inputText disabled="true"  size="55" value="#{simpleQuoteBackingBean.managedBean.smSupplier.companyName}"/></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.mof.no']}" /></td>
				<td><p:inputText disabled="true" value="#{simpleQuoteBackingBean.managedBean.smSupplier.epNo}"/></td>
			</tr>
	  </table>
	</p:panel>

	<p:panel id="tplSpecId" header="ITEM SPECS" toggleable="true">
		<p:spacer height="5px" />
		<table style="width: 100%;">
		   <tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.supp.view.panel']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.panel}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.supp.view.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.supp.view.no']}" itemValue="false" />
					</p:selectOneRadio></td>
		   </tr>
		
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.title']}" /></td>
				<td><p:inputText disabled="true" size="91"  value="#{simpleQuoteBackingBean.managedBean.scQuote.title}"/></td>
		   </tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.desc']}" /></td>
				<td colspan="3"><p:inputTextarea disabled="true" rows="3"
						cols="93" style="margin-bottom: 5px;" /></td>
			</tr>
			<tr>
				<td style="width: 200px;">
				<p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.zonal']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.zonal}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.supp.view.yes']}"
							itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.supp.view.no']}"
							itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.start.date']}" /></td>
			    <td><p:calendar  pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}" disabled="true"/></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.end.date']}" /></td>
				<td><p:calendar  pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}" disabled="true"/></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.no.of.quote']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}" disabled="true">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.supp.view.single']}" itemValue="false" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.supp.view.multiple']}" itemValue="true" />
					</p:selectOneRadio></td>
			</tr>

		</table>
		<p:spacer height="5px" />
       
      <h:panelGroup style="width: 100%;" rendered="#{fn:length(simpleQuoteBackingBean.managedBean.productTemplateSpecBean.specMaster.specAnswerList) eq '0'}">
		<ac:templateSpec
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.productTemplateSpecBean}"
			title="PRODUCT LIST" />
      </h:panelGroup>
      
	<p:spacer height="25px" />
	 <h:panelGroup style="width: 100%;" rendered="#{fn:length(simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean.specAnswerList) eq '0'}">
		<ac:templateSpec
			templateSpecBean="#{simpleQuoteBackingBean.managedBean.serviceTemplateSpecBean}"
			title="SERVICE LIST" />
       </h:panelGroup>
	</p:panel>
	
	<p:panel label="REMARKs" header="REMARKS" id="suppRmkId" toggleable="true" toggleSpeed="500">
	 <table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="12%"></td>
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{simpleQuoteBackingBean.managedBean.scQuote.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{simpleQuoteBackingBean.userImagePath(remarkVar.user.loginId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUser.userName}"/>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" />
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	  </table>
	</p:panel>
	
</ui:composition>
