<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <ac:title value="#{lbl['lbl.sc.sq']}"/>
    
    <p:panelGrid styleClass="noBorders tr,noBorders td">
		<p:row>
			<p:column width="100%" style="text-align:right">
				<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					style="float:right;" icon="ui-icon-submit" />
			</p:column>
		</p:row>
	</p:panelGrid>
	
	 <div class="header-info">
			<h:panelGrid border="0" width="100%" columns="6" id="supplierViewId">
				<h:outputLabel
					value="#{lbl['lbl.sc.sq.supp.view.header.simple.quote.no']}" />
				<p:inputText disabled="true"
					value="#{simpleQuoteBackingBean.managedBean.scQuote.quoteNo}" />

				<h:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.ptj.name']}" />
				<p:inputText disabled="true" size="45"
					value="#{simpleQuoteBackingBean.managedBean.scQuote.quoteNo}" />

				<h:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.req.date']}" />
				<p:inputText disabled="true"
					value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}" />

			</h:panelGrid>
		</div>
	
	<ui:include src="/xhtml/sc/directpurchase/supplierView.xhtml" />
		
</ui:define>
</ui:composition>
