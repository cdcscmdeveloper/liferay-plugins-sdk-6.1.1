<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages showDetail="true" autoUpdate="true" closable="true"
			severity="error, info" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<ac:spkiPopup id="spkiPopup"
			password="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.password}"
			challengeAns1="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.challengeAns1}"
			challengeQues1="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.challengeQues1}"
			postSignAction="#{simpleQuoteBackingBean.supplierSubmit(spkiBackingBean.pmDigiSign)}" />

		<div class="ppRightBtn">

			<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
				action="#{simpleQuoteBackingBean.managedBean.spkiBackingBean.getChallengeQuestions}"
				update="spkiPopup" oncomplete="spki_dlg.show();"
				rendered="#{simpleQuoteBackingBean.managedBean.supplierViewBtn}" />

		</div>
		<ui:include src="/xhtml/sc/directpurchase/supplierView.xhtml" />
	</ui:define>
</ui:composition>
