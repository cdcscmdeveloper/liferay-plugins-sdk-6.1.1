<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
    <ui:define name="contentSection">
    <p:panelGrid styleClass="noBorders tr,noBorders td">
		<p:row>
			<p:column width="100%" style="text-align:right">
				<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					style="float:right;" icon="ui-icon-submit" />

			</p:column>
		</p:row>
	</p:panelGrid>
	<p:spacer height="5px" />
	
	 <p:panelGrid styleClass="noBorders tr,noBorders td,headerClass"
		style="background-color: #F2F2F2;" id="headerId">
		<p:row>
			<p:column>
				<p:outputLabel
					value="#{lbl['lbl.sc.sq.supp.view.header.simple.quote.no']}" />
			</p:column>
			<p:column width="25%">
				<p:inputText disabled="true"/>
			</p:column>
			
			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.ptj.name']}" />
			</p:column>

			<p:column width="25%" style="align : center;">
				<p:selectOneMenu disabled="#{purchaseInquiryBackingBean.managedBean.editFlag}"
					 value="#{purchaseInquiryBackingBean.managedBean.orgProfileId}"
					 styleClass="divisionclass" converter="longConverter"
					 style="width: 220px;">
				    <f:selectItems value="#{purchaseInquiryBackingBean.managedBean.userDivisionList}" var="pmOrgProfile"
						itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}" />
			    </p:selectOneMenu>
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.sq.supp.view.header.req.date']}" />
			</p:column>
			<p:column width="25%">
				<p:inputText disabled="true" />
			</p:column>
		</p:row>
	</p:panelGrid>
	
	<ui:include src="/xhtml/sc/directpurchase/supplierView.xhtml" />
		
</ui:define>
</ui:composition>
