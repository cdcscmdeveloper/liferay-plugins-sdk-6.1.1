<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="contentSection">
    <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
   <!--  <ac:title value="#{lbl['lbl.sc.sq.title']}"/> -->

		<div align="right">
			<c:if test="#{simpleQuoteBackingBean.managedBean.taskId eq null}">
				<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					update="@form" icon="ui-icon-submit"
					action="#{simpleQuoteBackingBean.supplierSubmit}" />
			</c:if>
		</div>
		<div align="right">
			<table>
				<tr>
					<td align="right"><c:if
							test="#{simpleQuoteBackingBean.managedBean.taskId ne null}">
							<c:forEach items="#{simpleQuoteBackingBean.managedBean.outComes}"
								var="action">

								<c:if test="${action == 'SUBMIT'}">
									<ui:param name="iconVar" value="ui-icon-submit" />

								</c:if>

								<c:if test="${action == 'REJECT'}">
									<ui:param name="iconVar" value="ui-icon-reject" />

								</c:if>
								<c:if test="${action == 'REVISE'}">
									<ui:param name="iconVar" value="ui-icon-revise" />

								</c:if>
								<c:if test="${action == 'APPROVE'}">
									<ui:param name="iconVar" value="ui-icon-approve" />

								</c:if>
								<c:if test="${action == 'ACCEPT'}">
									<ui:param name="iconVar" value="ui-icon-approve" />

								</c:if>
								<p:commandButton value="#{action}" process="@all"
									styleClass="ui-button" icon="#{iconVar}"
									actionListener="#{simpleQuoteBackingBean.supplierSubmit}" />
							</c:forEach>
						</c:if></td>
				</tr>
			</table>
		</div>

		<ui:include src="/xhtml/sc/directpurchase/supplierView.xhtml" />
		
</ui:define>
</ui:composition>
