<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="GroupItem" widgetVar="groupItem" modal="true"
		width="800" height="500">
		<p:panel>
			<p:panelGrid style="width:50%;"
				styleClass="noBorders tr,noBorders td">

				<p:row>
					<p:column>
						<h:outputLabel
							value="#{lbl['lbl.ss.simple.quote.purchase.group.group.name']}" />
					</p:column>
					<p:column>
						<p:inputText></p:inputText>
					</p:column>
				</p:row>
			</p:panelGrid>

			<p:pickList id="pickListGroupItem"
				value="#{directPurchaseBackingBean.managedBean.items}" converter="sourcingItemConverter"
				var="item" itemLabel="#{item.itemName}" itemValue="#{item}"
				style="width:70%;height:30%" />
			
			<p:separator style="width:100%;height:1%"></p:separator>
		</p:panel>
		<p:commandButton
			value="#{lbl['lbl.ss.simple.quote.purchase.group.btn.confirm']}"
			style="float:right;" onclick="groupItem.hide();"></p:commandButton>
				<p:commandButton
			value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
			style="float:right;" onclick="groupItem.hide();"></p:commandButton>

	</p:dialog>
</ui:composition>
