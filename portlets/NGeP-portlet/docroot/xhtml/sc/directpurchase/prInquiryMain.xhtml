<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <ui:define name="contentSection">
   <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" id="mainMsg"/>
   <ac:title value="#{lbl['lbl.sc.pr.inquiry']}"/>
   <p:panel id="mainPanel">
   <div align="right">
	    <c:if test="#{purchaseInquiryBackingBean.managedBean.taskId eq null}">
	            <p:commandButton  immediate="true" value="#{lbl['lbl.sc.common.back']}" icon="ui-icon-back"
					 style="float:left;" action="#{purchaseInquiryBackingBean.backToPervious}" />
				
				 <p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					action="#{purchaseInquiryBackingBean.submitPrInquiryDtl}" style="float:right;"
					icon="ui-icon-submit"  update="mainPanel"/>
	    </c:if>
	    <c:if test="#{purchaseInquiryBackingBean.managedBean.taskId ne null and unspscCodeBackingBean.requisitioner}">
	    	<p:commandButton  value="#{lbl['lbl.sc.common.cancel']}"
					icon="ui-icon-cancel" action="#{purchaseInquiryBackingBean.requisitionerAction('Cancel')}"/>
			<p:commandButton value="#{lbl['lbl.sc.common.proceed.btn']}" 
				    icon="ui-icon-submit" action="#{purchaseInquiryBackingBean.requisitionerAction('Processed')}"/>
	    </c:if>
	     <table>
			<tr>
				<td align="right"><c:if
						test="#{purchaseInquiryBackingBean.managedBean.processName eq 'Purchase Inquiry Creation'}">
						<c:forEach items="#{purchaseInquiryBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>
						
						<p:commandButton value="#{action}" process="@all" rendered="#{!unspscCodeBackingBean.requisitioner}"
								styleClass="ui-button" icon="#{iconVar}" update="mainPanel"
								actionListener="#{purchaseInquiryBackingBean.submitPrInquiryPrice(action)}" />
						</c:forEach>

					</c:if></td>
			</tr>
		</table>
	</div>
	   <table style="border: 0px;align:center;width:100%;">
			<tr>
				<td> <td width="100%" align="left" valign="top">
				   <ui:include src="/xhtml/sc/directpurchase/prInquiry.xhtml" />
				</td></td>
			</tr>
		</table>
	
	</p:panel>
  
	</ui:define>
	</ui:composition>
