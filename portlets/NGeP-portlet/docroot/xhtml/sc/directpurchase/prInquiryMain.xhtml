<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <ui:define name="contentSection">
   <p:messages showDetail="true" autoUpdate="true" closable="true" severity="error, info" />
  
   <p:panel id="mainPanel">
	  <div align="right">
	    <c:if test="#{requestNoteBackingBean.managedBean.taskId eq null}">
	            <p:commandButton  immediate="true" value="#{lbl['lbl.sc.common.back']}" icon="ui-icon-back"
					 style="float:left;" action="#{purchaseInquiryBackingBean.backToPervious}" />
					 
				<p:commandButton value="#{lbl['lbl.sc.common.proceed.btn']}" 
				    rendered="#{purchaseInquiryBackingBean.managedBean.requisitionerFlag}"
					icon="ui-icon-submit" action="#{requestNoteBackingBean.addToRequestNote(purchaseInquiryBackingBean.managedBean.method)}"/>

				<p:commandButton 
					value="#{lbl['lbl.sc.common.cancel']}" action="#{purchaseInquiryBackingBean.backToPervious}"
					icon="ui-icon-cancel" />
					 
				 <p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					action="#{purchaseInquiryBackingBean.submitPrEnquiryDtl}"
				    style="float:right;"
					icon="ui-icon-submit"  update="mainPanel"/>
	    </c:if>
	    <c:if test="#{requestNoteBackingBean.managedBean.taskId ne null and unspscCodeBackingBean.requisitioner}">
	    	<p:commandButton  value="#{lbl['lbl.sc.common.cancel']}"
					icon="ui-icon-cancel" action="#{purchaseInquiryBackingBean.requisitionerAction('Cancel')}"/>
			<p:commandButton value="#{lbl['lbl.sc.common.proceed.btn']}" 
				    icon="ui-icon-submit" action="#{purchaseInquiryBackingBean.requisitionerAction('Processed')}"/>
	    </c:if>
	     <table>
			<tr>
				<td align="right"><c:if
						test="#{purchaseInquiryBackingBean.managedBean.processName eq 'Purchase Inquiry Creation'}">
						<c:forEach items="#{purchaseInquiryBackingBean.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						
						<p:commandButton value="#{action}" process="@all" rendered="#{!unspscCodeBackingBean.requisitioner}"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{purchaseInquiryBackingBean.submitPrInquiryPrice(action)}" />
						</c:forEach>

					</c:if></td>
			</tr>
		</table>
	</div>
	  <p:spacer height="15px" />
	   <table style="border: 0px;width:1000 px; align:center;" >
			<tr>
				<td> <td width="100%" align="left" valign="top" style="border: 0.5px;width:100%; 
				     align:center; padding-right: 10px; padding-bottom: 10px;padding-left: 10px; background-color: #F2F2F2;">
				   <ui:include src="/xhtml/sc/directpurchase/prInquiry.xhtml" />
				</td></td>
			</tr>
		</table>
	
	</p:panel>
  
	</ui:define>
	</ui:composition>
