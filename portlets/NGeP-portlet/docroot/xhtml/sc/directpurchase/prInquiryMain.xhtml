<ui:composition xmlns="http://www.w3.org/1999/xhtml"
template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
   <ui:define name="contentSection">
	<c:if test="#{purchaseInquiryBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.pr.inquiry']}" />
	</c:if>

  <p:messages showDetail="true" autoUpdate="true" closable="true"  showSummary="false" severity="error, info" id="mainMsg"/>
  <p:panel id="mainPanel">
   <div align="right">
	    <c:if test="#{purchaseInquiryBackingBean.managedBean.taskId eq null}">
	    
	            <p:commandButton  immediate="true" value="#{lbl['lbl.sc.action.back.to.search.catalogue']}" icon="ui-icon-back"
					 style="float:left;" action="#{purchaseInquiryBackingBean.backToPervious}" />

					<p:commandButton value="#{lbl['lbl.sc.common.submit']}"
					action="#{purchaseInquiryBackingBean.submitPrInquiryDtl}" style="float:right;"
					icon="ui-icon-submit"  update="mainPanel"/>
	    </c:if>

	   <c:if test="#{purchaseInquiryBackingBean.managedBean.taskId ne null}">
	     <table style="width:100%">
			<tr>
				<td align="right">
				
					          <!-- 	view back button -->
				               <c:if
									test="#{purchaseInquiryBackingBean.managedBean.rnToPIFlag}">
									<p:commandButton immediate="true"
										value="#{lbl['lbl.sc.common.back']}"
										icon="ui-icon-back" style="float:left;"
										action="#{purchaseInquiryBackingBean.backToPervious}" />
								</c:if> 
								
								<c:forEach
											items="#{purchaseInquiryBackingBean.managedBean.outComes}"
											var="action">

											<c:if test="${action == 'SUBMIT'}">
												<ui:param name="iconVar" value="ui-icon-submit" />
											</c:if>
											<c:if test="${action == 'CANCEL'}">
												<ui:param name="iconVar" value="ui-icon-submit" />

												<c:if test="#{!purchaseInquiryBackingBean.managedBean.rnToPIFlag}">
													<p:commandButton
														value="#{lbl['lbl.sc.common.proceed.btn']}"
														icon="ui-icon-submit"
														action="#{purchaseInquiryBackingBean.requisitionerAction('Processed')}" />

													<p:commandButton value="#{lbl['lbl.sc.common.cancel']}"
														icon="ui-icon-cancel" style="float:right;"
														action="#{purchaseInquiryBackingBean.requisitionerAction(action)}" />

												</c:if>
											</c:if>

											<c:if
												test="#{purchaseInquiryBackingBean.managedBean.processName eq 'Purchase Inquiry Creation'}">
												<p:commandButton value="#{action}" process="@all"
													partialSubmit="true"
													rendered="#{!unspscCodeBackingBean.requisitioner}"
													styleClass="ui-button" icon="#{iconVar}" update="mainPanel"
													actionListener="#{purchaseInquiryBackingBean.submitPrInquiryPrice(action)}" />
											</c:if>

										</c:forEach>
									</td>
			</tr>
		</table>
		</c:if>
	</div>
	   <table style="border: 0px;align:center;width:100%;">
			<tr>
				<td> <td width="100%" align="left" valign="top">
				   <ui:include src="/xhtml/sc/directpurchase/prInquiry.xhtml" />
				</td></td>
			</tr>
		</table>
	
	</p:panel>
  
	</ui:define>
	</ui:composition>
