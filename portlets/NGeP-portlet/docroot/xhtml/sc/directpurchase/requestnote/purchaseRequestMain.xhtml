<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>

		<c:if test="#{requestNoteBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.request.note']}" />
		</c:if>
		<p:messages showDetail="true"
			autoUpdate="#{requestNoteBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error, info" showSummary="false" />

		<ui:param name="isPidExpired"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.PID_EXPIRED}" />
		<ui:param name="isPendingSubmissionStatus"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingSubmission}" />
		<ui:param name="isPendingRevisionStatus"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingRevision}" />
		<ui:param name="isPendingApprovalStatus"
			value="#{requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingApproval or requestNoteBackingBean.managedBean.requestNoteStatus.statusId eq DPStatusConstants.rnPendingRevisionApproval}" />
		<ui:param name="isViewOnly"
			value="#{requestNoteBackingBean.managedBean.viewOnly}" />
		<ui:param name="readOnlyTask" value="#{requestNoteBackingBean.managedBean.readOnly}" />
		
		<ui:param name="isPendingItemCodificationStatus" value="true" />

		<p:outputPanel id="requestNoteId">
			<ui:include
				src="/xhtml/sc/directpurchase/requestnote/purchseRequestButtons.xhtml" />
			<ui:include
				src="/xhtml/sc/directpurchase/requestnote/codification/requestNoteCodificationHeader.xhtml" />
			<table style="border: 0px; align: center;" width="100%">
				<tr>
					<td width="100%" align="left" valign="top"><ui:include
							src="/xhtml/sc/directpurchase/requestnote/codification/requestNoteCodificationItem.xhtml" />
					</td>
				</tr>
			</table>

			<!-- Specification PopUp -->
			<ui:include
				src="/xhtml/sc/directpurchase/requestnote/codification/specificationPopup.xhtml" />
		</p:outputPanel>
	</ui:define>

</ui:composition>
