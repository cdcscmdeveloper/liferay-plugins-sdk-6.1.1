<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<c:if test="#{requestNoteBackingBean.managedBean.proceedWithDPExceedThreshold}">
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
	<tr>
	<td colspan="3">
	<table style="margin-left:4%;">
	<tr>
	<td class="TableFieldLeft">
	<h:outputLabel value="#{lbl['lbl.sc.egpa.approval.doc']}" />
	<p:outputLabel value="*" styleClass="mandatory" />
	</td>
	<td>
	<ac:scSingleFileUploadButton id="scUploadApprovalDoc"
					popupWidgetVar="scDocUploadApprovalDlg" rendered="true"
					attachment="#{requestNoteBackingBean.managedBean.requestNote.scApprovalDocument}"
					readonly="#{requestNoteBackingBean.managedBean.bpkApprover}"
					deleteFileUploadListener="requestNoteBackingBean.deleteApprovalDocUpload">
				</ac:scSingleFileUploadButton>
				<ac:iconTooltip id="egpaApprovalDocTooltipId"
							value="#{lbl['lbl.sc.egpa.approval.doc.tootltip']}" />
	</td>
	</tr>
	</table>
	</td>
	</tr>
	<tr>
	<td colspan="3">
	<table style="margin-left:4%;">
	<tr>
	<td class="TableFieldLeft">
	<h:outputLabel value="#{lbl['lbl.sc.exceed.justification']}" />
	<p:outputLabel value="*" styleClass="mandatory" />
	</td>
	<td>
	<p:inputTextarea
				title="#{lbl['lbl.sc.exceed.justification.tooltip']}"
				cols="40" maxlength="1000"
				onkeyup="limitTextArea(this,1000);"
				onkeydown="limitTextArea(this,1000);"
				onmouseout="limitTextArea(this,1000);" value="#{requestNoteBackingBean.managedBean.requestNote.dpExceedJustification}"
				disabled="#{requestNoteBackingBean.managedBean.bpkApprover}">
				<p:ajax partialSubmit="true" process="@this" update="@this" />
			</p:inputTextarea>
			<ac:iconTooltip id="exceedJustificationTooltipId"
							value="#{lbl['lbl.sc.exceed.justification.tooltip']}" />
	</td>
	</tr>
	</table>
	</td>
	</tr>
	</table>
	</c:if>
</ui:composition>
