<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:dialog id="addToCartPopup" widgetVar="addToCartPopup"
		header="#{lbl['lbl.sc.add.to.cart']}" width="600" resizable="false"
		closable="false"
		 modal="true" dynamic="true">
		<p:panel id="addToCartId">
			<p:messages id="cartmessages" showDetail="true"
				autoUpdate="#{!requestNoteBackingBean.managedBean.autoUpdate}"
				closable="false" showSummary="false" />
			<ui:param name="uomCode"
				value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.uom.uomCode}" />
				
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.supp.name']}" /></td>
					<td><p:inputText disabled="true" size="54"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.smSupplier.companyName}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
					<td><p:inputText disabled="true" size="54"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.extensionCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
					<td><p:inputText disabled="true" size="54"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: top; text-align: left;"><p:outputLabel
							value="#{lbl['lbl.cm.basic.item.spec']}" /></td> <!-- #30457: change label -->
					<td><p:inputTextarea readonly="true" disabled="true" rows="2"
							cols="35" style="margin-bottom: 5px; width: 351px;"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
					<td><p:inputText disabled="true" size="31"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}" />
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.min.qty']}" /></td>
					<td><p:inputText disabled="true" size="31"
							styleClass="ppRightBtn"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.minOrder}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, requestNoteBackingBean.managedBean.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.minOrder)}" />
						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.order.qty']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:inputText size="31" styleClass="ppRightBtn"
					        required="#{requestNoteBackingBean.managedBean.required}"
							label="#{lbl['lbl.sc.order.qty']}" maxlength="14" id="oderQtyId"
							validatorMessage="Order Qty : must be a decimal number between 0.0 and 9999999999.999"
							value="#{requestNoteBackingBean.managedBean.requestSupplierItem.requestNoteItem.quantity}">
							<p:ajax partialSubmit="true" process="@this" 
								update="@this, addToCartId"
								listener="#{requestNoteBackingBean.onChangePriceType()}" />
							<ac:validateNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, uomCode)}"
								maxIntegerDigits="10" />
						</p:inputText>
						<p:message id="oderQtyMsg" for="oderQtyId" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.price.type']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="priceType"
										style="margin-bottom: 5px; width: 225px;"
										label="#{lbl['lbl.sc.price.type']}"
										required="#{requestNoteBackingBean.managedBean.required}"
										value="#{requestNoteBackingBean.managedBean.priceType}">
										<f:selectItems
											value="#{requestNoteBackingBean.managedBean.priceTypes}" />
										<p:ajax event="change" process="@this"
											update="@this, addToCartId"
											listener="#{requestNoteBackingBean.onChangePriceType()}" />
									</p:selectOneMenu> <p:message id="priceTypeMsg" for="priceType" display="icon" /></td>
								<td style="margin-top: -3px"><ac:iconTooltip
										value="#{lbl['lbl.sc.all.pricetype.tooltip']}" /></td><!-- #29557 change label  -->
								<td><p:outputPanel id="priceTypeInfoPanel">
										<p:inputText disabled="true" style="font-weight: bold;"
											value="#{requestNoteBackingBean.managedBean.normalAndTierPriceStr}"
											size="5"
											rendered="#{requestNoteBackingBean.managedBean.priceTypeStringFlag}">
										</p:inputText>
										<p:commandLink process="@this"
											update=":#{p:component('supplierPricingInfoDlg')}"
											oncomplete="supplierPricingInfoDlgVar.show();"
											rendered="#{requestNoteBackingBean.managedBean.priceTypeTableFlag}">
											<p:graphicImage value="/css/images/design/ico-price.png"
												id="zonePriceTblId" style="max-width: 16px;" />
										</p:commandLink>
									</p:outputPanel></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneRadio styleClass="commonLabel"
										style="margin-bottom: 5px;" id="procType"
										label="#{lbl['lbl.sc.procurement.type']}"
										value="#{requestNoteBackingBean.managedBean.procurementType}"
										required="#{requestNoteBackingBean.managedBean.required}">
										<f:selectItems
											value="#{requestNoteBackingBean.managedBean.procurementTypes}" />
										<p:ajax event="change" partialSubmit="true"
											update="justLabel, justValue, justRmksLabel, justRmksValue"
											listener="#{requestNoteBackingBean.procurementTypeEvent}"
											process="@this" />
									</p:selectOneRadio></td>
								<td style="margin-top: -3px"><p:message id="procTypeMsg"
										for="procType" display="icon" /> 
									<ac:iconTooltip value="#{requestNoteBackingBean.procurementTypeToolTip}" /></td>
							</tr>
						</table>
					</td>
				</tr>

				<tr>
					<td><h:panelGroup id="justLabel">
							<p:outputLabel value="#{lbl['lbl.sc.reason']}"
								rendered="#{requestNoteBackingBean.managedBean.procTypeOption}" />
							<p:outputLabel value="*" styleClass="mandatory"
								rendered="#{requestNoteBackingBean.managedBean.procTypeOption}" />
						</h:panelGroup></td>
					<td><h:panelGroup id="justValue">
							<p:selectOneMenu style="margin-bottom: 5px; width: 225px;"
							    panelStyle="overflow-y: scroll; width:400px; height:100px;"
								rendered="#{requestNoteBackingBean.managedBean.procTypeOption}"
								id="justificationId" label="#{lbl['lbl.sc.reason']}"
								required="#{requestNoteBackingBean.managedBean.justRequired}"
								value="#{requestNoteBackingBean.managedBean.justificationType}">
								<f:selectItems
									value="#{requestNoteBackingBean.managedBean.justDropdown}" />
							</p:selectOneMenu>
							<p:message id="justTypeMsg" for="justificationId" display="icon" />
						</h:panelGroup></td>
				</tr>
				<tr>
					<td style="vertical-align: top; padding-right: 1px; text-align: right;">
						<h:panelGroup id="justRmksLabel">
							<p:outputLabel value="#{lbl['lbl.sc.justification']}"
								rendered="#{requestNoteBackingBean.managedBean.procTypeOption}" />
							<p:outputLabel value="*" styleClass="mandatory"
								rendered="#{requestNoteBackingBean.managedBean.procTypeOption}" />
						</h:panelGroup>
					</td>
					<td><h:panelGroup id="justRmksValue">
							<p:inputTextarea id="justificationRmk"
								rendered="#{requestNoteBackingBean.managedBean.procTypeOption}"
								label="#{lbl['lbl.sc.justification']}" maxlength="100"
								required="#{requestNoteBackingBean.managedBean.justRequired}"
								value="#{requestNoteBackingBean.managedBean.justification}"
								rows="2" cols="65" style="margin-bottom: 5px; width: 351px;" 
								onkeyup="limitTextArea(this,100);" 
								onkeydown="limitTextArea(this,100);" 
								onmouseout="limitTextArea(this,100);"/> <ui:remove>38910</ui:remove> 
							<p:message id="justRmksMsg" for="justificationRmk" display="icon" />
						</h:panelGroup></td>
				</tr>
			</table>
			<div class="ppRightBtn BtnSpacing" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.btn.proceed']}" process="@form"
					partialSubmit="true" id="proceedBtn"
					action="#{requestNoteBackingBean.addToRequestNote(requestNoteBackingBean.managedBean.addToCartFlag)}"
					onstart="popupBlockWidget.show();"
					oncomplete="popupBlockWidget.hide();"
					update="addToCartId ,@([id$=btnId])" />

				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
					action="#{requestNoteBackingBean.closeListener}"
					oncomplete="addToCartPopup.hide();" partialSubmit="true" />
			</div>
		</p:panel>
		<p:blockUI block="addToCartId" widgetVar="popupBlockWidget">
		 <p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	  </p:blockUI>
	<p:defaultCommand target="proceedBtn"></p:defaultCommand>
	</p:dialog>
	
	<p:dialog id="supplierPricingInfoDlg"
		widgetVar="supplierPricingInfoDlgVar" styleClass="pop_up_top"
		modal="true" width="50%" resizable="false"
		header="#{lbl['lbl.tpl.spec.content.price']}" closable="true">

		<p:dataTable id="supplierPricingInfoTbl"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="priceItem" rowIndexVar="index" width="500"
			value="#{requestNoteBackingBean.managedBean.filteredCmPricingList}">
			<p:column headerText="#{lbl['lbl.rpt.zone']}">
				<h:outputText
					value="#{fn:toLowerCase(priceItem.cmSupplierZone.suppZoneName)}"
					style="text-transform: capitalize;" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.from.qty']}"
				rendered="#{requestNoteBackingBean.managedBean.fromAndToQuantityFlag}">
				<h:outputText value="#{priceItem.fromQty}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.fl.to.qty']}"
				rendered="#{requestNoteBackingBean.managedBean.fromAndToQuantityFlag}">
				<h:outputText value="#{priceItem.toQty}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.price.offered']}">
				<h:outputText value="#{priceItem.price}">
					<f:convertNumber groupingUsed="true" minFractionDigits="2"
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>

	</p:dialog>
</ui:composition>
