<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.approve.list']}" id="approverId" rendered="#{!isPendingApprovalStatus}"
		toggleable="true" toggleSpeed="500">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.sc.approve.list']}" />
		</f:facet>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.approver.instuction']}" />
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td style="width: 202px;">  <h:outputLabel
						value="#{lbl['lbl.sc.ptj.approver.group']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /> </td>
				<td><p:selectOneMenu style="width:360px; margin-bottom:5px;"
				        id="appGroupId"
				        label="#{lbl['lbl.sc.ptj.approver.group']}"
						disabled="#{isPendingApprovalStatus or requestNoteBackingBean.managedBean.viewOnly}"
						value="#{requestNoteBackingBean.managedBean.userGroupId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<p:ajax event="change" process="@this" update="approverId"
							listener="#{requestNoteBackingBean.userGroupChangeListener()}" />
						<f:selectItems
							value="#{requestNoteBackingBean.getUserGroupDropdown()}" />
					</p:selectOneMenu><p:message id="appGroupIdMsg" for="appGroupId" display="icon" /></td>
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.approverName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="approverNameId"
				        label="#{lbl['lbl.sc.approverName']}"
						disabled="#{isPendingApprovalStatus or requestNoteBackingBean.managedBean.viewOnly}"
						value="#{requestNoteBackingBean.managedBean.selectedApproverId}"
						style="width:360px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{requestNoteBackingBean.managedBean.approverList}"
							var="user" itemLabel="#{user.userName}"
							itemValue="#{user.userId}"/>
							<p:ajax event="change" update="approverId" />
					</p:selectOneMenu> <p:message id="approverNameIdMsg" for="approverNameId" display="icon" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
