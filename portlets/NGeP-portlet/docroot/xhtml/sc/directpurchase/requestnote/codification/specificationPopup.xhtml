<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:dialog id="specificationPopup" widgetVar="specificationPopup"
		header="#{lbl['lbl.tpl.spec.content.specification']}" modal="true" dynamic="true" closable="false"
		resizable="false" styleClass="pop_up_top">
		<ui:remove> #36950 start @zaim</ui:remove>
			<p:scrollPanel mode="native" style="width:550px;height:650px; border:none" >
		<ui:remove> #36950 end @zaim</ui:remove> 	
				<p:dataTable id="specificationListDataTable" var="specification"
					style="white-space: normal;"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{requestNoteBackingBean.managedBean.specificationList}"
					rowKey="#{specification}" rowIndexVar="rowIndex">

					<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
						style="white-space: normal;">
						<ui:remove> #36950 start @zaim</ui:remove>
						 <h:outputText value="#{requestNoteBackingBean.handleSpecialCharacterForView(specification.clSpecDetail)}" escape="false" />
						<ui:remove> #36950 end @zaim</ui:remove> 
						<p:spacer width="2px;" />
					</p:column>
				</p:dataTable>
		<ui:remove> #36950 start @zaim</ui:remove>		
			</p:scrollPanel>
		<ui:remove> #36950 end @zaim</ui:remove> 	
			<div class="ppRightBtn BtnSpacing">
				<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
					process="@this" onclick="specificationPopup.hide()" />
			</div>
	</p:dialog>
</ui:composition>
