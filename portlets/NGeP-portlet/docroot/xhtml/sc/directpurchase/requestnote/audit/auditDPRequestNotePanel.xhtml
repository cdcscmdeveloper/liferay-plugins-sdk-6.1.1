<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="resultPanel" header="#{lbl['lbl.dp.audit.view']}"
		toggleable="true">
		<p:dataTable id="searchDPId" var="obj" rows="10" width="100%"
			value="#{auditSearchDPRequestNoteBackingBean.searchDP}" lazy="true">
			<ac:paginator for="searchDPId"></ac:paginator>
			<p:column headerText="#{lbl['lbl.dp.audit.action.date']}"
				style="white-space: normal!important;" width="5%">
				<h:outputText value="#{obj.createdDate}">
					<f:convertDateTime pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />									   
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.action.type']}"
				style="white-space: normal!important;" width="5%">
				<h:outputText value="#{obj.actionType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.action.by']}"
				style="white-space: normal!important;" width="5%">
				<h:outputText value="#{obj.actionBy}" escape="false" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.org.name']}"
				style="white-space: normal!important;" width="10%">
				<h:outputText value="#{obj.orgName}" escape="false" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.role']}" style="width :5%">
				<h:outputText value="#{obj.roleName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.docType']}"
				style="width :5%">
				<h:outputText value="#{obj.docType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.docNo']}"
				style="width :10%">
				<h:outputText value="#{obj.docNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.subDocNo']}"
				style="white-space: pre-line;" width="40%">
				<h:outputText value="#{obj.subDocNo}" escape="false" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.fieldName']}"
				style="width :5%">
				<h:outputText value="#{obj.fieldName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.oldValue']}"
				style="width :5%">
				<h:outputText value="#{obj.oldValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.dp.audit.newValue']}"
				style="width :5%">
				<h:outputText value="#{obj.newValue}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
