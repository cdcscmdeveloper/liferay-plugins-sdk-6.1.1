<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="rnSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true">
	     	<table border="0" cellspacing="0" cellpadding="0" width="100%">
	     	<tr>
				<td class="TableFieldLeft" width="20%">
					<p:outputLabel value="#{lbl['lbl.sc.request.note.req.note.no']}" />
				</td>
				<td class="TableFieldRight">
					<p:inputText value="#{requestNoteBackingBean.managedBean.searchReqNoteNo}" size="25" />
				</td>
			</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.request.note.header.method']}" />
				</td>
				<td>
					<p:selectOneMenu style="width:215px;margin-bottom: 5px;" 
					  value="#{requestNoteBackingBean.managedBean.searchSrcMethod}">
						<f:selectItems value="#{requestNoteBackingBean.getDropdownCodeValues(ParameterTypeConst.sourceMethod)}" />
					</p:selectOneMenu>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.status']}" />
				</td>
				<td>
					<p:selectOneMenu id="rnStatus"
						style="width: 230px;"
						value="#{requestNoteBackingBean.managedBean.searchStatus}" > 
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{requestNoteBackingBean.statusDescList}"
							var="pmStatusDesc" itemLabel="#{pmStatusDesc.statusName}"
							itemValue="#{pmStatusDesc.pmStatus.statusId}">
						</f:selectItems>
					</p:selectOneMenu>
				</td>
			</tr>
			<tr>
				<td>
					<h:outputLabel value="#{lbl['lbl.sc.created.date.from']}" />
				</td>
				<td>
					<p:calendar
						value="#{requestNoteBackingBean.managedBean.searchCreatedDateFrom}"
						id="crdateFrom" showOn="button" size="25" readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect" update="crdateTo" />
					</p:calendar>
				</td>
				<td>
					<h:outputLabel value="#{lbl['lbl.sc.created.date.to']}" />
				</td>
				<td>
					<p:calendar id="crdateTo" showOn="button"
						value="#{requestNoteBackingBean.managedBean.searchCreatedDateTo}"
						mindate="#{requestNoteBackingBean.managedBean.searchCreatedDateFrom}"
						size="25" readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</td>
			</tr>
		    </table>
		    
		    <div class="ppRightBtn BtnSpacing">
				<p:commandButton value="#{lbl['lbl.btn.search']}" 
					action="#{requestNoteBackingBean.searchAction}"
					update="reqNoteTbl" />
					
				<p:commandButton value="#{lbl['lbl.btn.reset']}" 
					action="#{requestNoteBackingBean.resetAction}" update="@form"
				    resetValues="true" partialSubmit="true"
					process="@this" />					
			</div>
    	</p:panel>
        
		<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
			<p:dataTable id="reqNoteTbl" var="scRequestNote" rowIndexVar="index" 
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{requestNoteBackingBean.managedBean.reqNoteDataModel}" 
				lazy="true" rows="10">
			
				<ac:paginator for="reqNoteTbl" />
				
				<p:column style="width:20%" headerText="#{lbl['lbl.sc.request.note.req.note.no']}">
					#{scRequestNote.requestNoteNo}
				</p:column>
					
				<p:column style="width:15%" headerText="#{lbl['lbl.sc.request.note.header.method']}">
					#{requestNoteBackingBean.getParameterDesc(ParameterTypeConst.sourceMethod, scRequestNote.sourceMethod)}
				</p:column>
				
				<p:column style="width:20%" headerText="#{lbl['lbl.sc.status']}">
					#{requestNoteBackingBean.getStatusDescById(scRequestNote.pmStatus.statusId)}
				</p:column>
				
				<p:column style="width:20%" headerText="#{lbl['lbl.sc.created.by']}">
					#{scRequestNote.createdUser.userName}
				</p:column>
				
				<p:column style="width:15%" headerText="#{lbl['lbl.sc.created.date']}">
					<h:outputText value="#{scRequestNote.createdDate}">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				
				<p:column style="width:10%;text-align: center;" headerText="#{lbl['lbl.sc.action']}">
					<p:commandLink action="#{requestNoteBackingBean.viewRequestNote(scRequestNote.requestNoteId)}"
						partialSubmit="true" process="@this">
						<p:graphicImage value="/css/images/design/document.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
