<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<c:if test="#{isPendingItemCodificationStatus}">
		<ac:scRemarkAndAttachment
			remarkList="#{requestNoteBackingBean.managedBean.requestNote.remarks}"
			showAttachment="false" readonly="#{!requestNoteBackingBean.managedBean.cancel}"
			instruction="#{lbl['lbl.sc.requestnote.remarks.instruction']}" />
	</c:if>
	<c:if test="#{!isPendingItemCodificationStatus}">
		<ui:remove>#26059 - start</ui:remove>
		<c:choose>
			<c:when
				test="#{requestNoteBackingBean.managedBean.rnExceedThreshold}">
				<ac:scRemarkAndAttachment
					remarkList="#{requestNoteBackingBean.managedBean.requestNote.remarks}"
					attachmentList="#{requestNoteBackingBean.managedBean.requestNote.scRequestNoteAttachments}"
					showAttachment="true"
					disableUpload="true"
					documentHeader = "#{lbl['lbl.txt.attachment']}"
					uploadButtonLabel = "#{lbl['lbl.txt.attach.doc']}"
					recordsLabel = "#{lbl['lbl.sc.no.attachment.upload']}"		
					readonly="#{requestNoteBackingBean.managedBean.viewOnly}"
					showAttachments="#{requestNoteBackingBean.managedBean.showAttachments}"
					instruction="#{isPendingApprovalStatus ? lbl['lbl.sc.requestnote.remarks.instruction'] : ''}" />
			</c:when>
			<c:otherwise>
				<ac:scRemarkAndAttachment
					remarkList="#{requestNoteBackingBean.managedBean.requestNote.remarks}"
					showAttachment="false"
					readonly="#{requestNoteBackingBean.managedBean.viewOnly}"
					instruction="#{isPendingApprovalStatus ? lbl['lbl.sc.requestnote.remarks.instruction'] : ''}" />
			</c:otherwise>
		</c:choose>
		<ui:remove>#26059 - start</ui:remove>
	</c:if>
</ui:composition>
