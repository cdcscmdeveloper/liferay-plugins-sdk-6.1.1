<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel label="#{lbl['lbl.sc.remark']}" header="#{lbl['lbl.sc.remark']}" toggleable="true" toggleSpeed="500">
	
	<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.requestnote.remarks.instruction']}"/>
	
	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="15.5%"></td>
			<td class="TableFieldRight">
				<h:panelGroup id="remark">
				<p:dataGrid id="catatan" value="#{requestNoteBackingBean.managedBean.requestNote.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUser.userName}"/>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;" id="remarks" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}"  maxlength="1000">
									<p:ajax partialSubmit="true" process="@this" update="@this" />
								</p:inputTextarea>
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;"/>
							</td>
						</tr>
					</table>
				</p:dataGrid>
				</h:panelGroup>
			</td>
		</tr>
	</table>
	</p:panel>
</ui:composition>
