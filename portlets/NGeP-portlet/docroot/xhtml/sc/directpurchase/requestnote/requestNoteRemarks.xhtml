<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<c:if test="#{isPendingItemCodificationStatus}">
		<ac:scRemarkAndAttachment
			remarkList="#{requestNoteBackingBean.managedBean.requestNote.remarks}"
			showAttachment="false" readonly="#{!requestNoteBackingBean.managedBean.cancel}"
			instruction="#{lbl['lbl.sc.requestnote.remarks.instruction']}" />
	</c:if>
	<c:if test="#{!isPendingItemCodificationStatus}">
		<ac:scRemarkAndAttachment
			remarkList="#{requestNoteBackingBean.managedBean.requestNote.remarks}"
			showAttachment="false"
			readonly="#{requestNoteBackingBean.managedBean.viewOnly}"
			instruction="#{isPendingApprovalStatus ? lbl['lbl.sc.requestnote.remarks.instruction'] : ''}" />
	</c:if>
</ui:composition>
