<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:outputPanel>
			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					id="backPrevious" partialSubmit="true" process="@this"
					immediate="true" action="#{requestNoteBackingBean.loadContinuitySession}" />
			</div>
			<table style="border: 0px; align: center;" width="100%">
				<tr>
					<td width="100%" align="left" valign="top"><p:panel
							id="requestNoteContinuity">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.cm.search.result']}" />
							</f:facet>
							<br></br>
							<ui:include
								src="/xhtml/sc/directpurchase/continuity/requestNoteTable.xhtml"></ui:include>
							<c:if
								test="#{requestNoteBackingBean.managedBean.purchaseRequestMapList.size() > 0}">
								<br></br>
							</c:if>
							<ui:include
								src="/xhtml/sc/directpurchase/continuity/purchaseRequestTable.xhtml"></ui:include>
							<c:if
								test="#{requestNoteBackingBean.managedBean.loaMapList.size() > 0}">
								<br></br>
							</c:if>
							<ui:include
								src="/xhtml/sc/directpurchase/continuity/loaTable.xhtml"></ui:include>
						</p:panel></td>
				</tr>
			</table>
		</p:outputPanel>
	</ui:define>
</ui:composition>
