<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:dialog id="itemDtlPopup" widgetVar="itemDtlPopup"
		header="ITEM DETAIL" modal="true" dynamic="true" closable="false"
		resizable="false" styleClass="pop_up_top" width="555">
		<p:panel id="itemDetailsId">
			<p:messages id="itemDetMsg" showDetail="true"
				autoUpdate="#{!requestNoteBackingBean.managedBean.autoUpdate}"
				closable="false" showSummary="false" />
			<ui:param name="uomCode"
				value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.uom.uomCode}" />
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.product.code']}" /></td>
					<td><p:inputText disabled="true" size="46"
							value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.cmItem.extensionCode}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.item.name']}" /></td>
					<td><p:inputText disabled="true" size="46"
							value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.itemName}" /></td>
				</tr>
				<tr>
					<td style="vertical-align: top; text-align: left;"><p:outputLabel
							value="#{lbl['lbl.sc.desc']}" /></td>
					<td><p:inputTextarea disabled="true" rows="3" cols="58"
							style="margin-bottom: 5px; width: 351px;"
							value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.itemDesc}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.uom']}" /></td>
					<td valign="bottom"><p:inputText disabled="true" size="25"
							value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.uom.uomName}" /></td>
				</tr>
				<ui:fragment
					rendered="#{requestNoteBackingBean.managedBean.itemCheck}">
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomFrequency}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomPerDay}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomFrequency}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clUomPerMonth}" />
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.duration.month']}" /></td>
						<td><p:inputText styleClass="ppNumericAlign" disabled="true"
								size="25"
								value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.tplSpecQuestion.clDurationMonth}" />
						</td>
					</tr>
				</ui:fragment>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.quantity']}" /></td>
					<td>
						<table>
							<tr>
								<td><p:inputText size="25" styleClass="ppRightBtn"
										disabled="#{isViewOnly}"
										id="qtyId" label="#{lbl['lbl.sc.quantity']}"
										validatorMessage="Order Qty : must be a decimal number between 0.0 and 9999999999.999"
										value="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.quantity}">
										<p:ajax partialSubmit="true" process="@this" update="@this" />
										<ac:validateNumber
											pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, uomCode)}"
											maxIntegerDigits="10" />
									</p:inputText></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.ceiling.price']}"
							rendered="#{requestNoteBackingBean.managedBean.itemCheck}" /></td>
					<td><p:inputText styleClass="ppRightBtn" disabled="true"
							size="25"
							rendered="#{requestNoteBackingBean.managedBean.itemCheck}" /></td>
				</tr>

				<ui:param name="requestNoteDtl"
					value="#{requestNoteBackingBean.managedBean.requestNoteDtl}"></ui:param>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.request.note.price.type']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><h:selectOneMenu id="priceType" style="width:217px;"
							disabled="#{isViewOnly}"
							label="#{requestNoteBackingBean.managedBean.requestNoteDtl.requestItem.itemName} : #{lbl['lbl.sc.request.note.price.type']}"
							value="#{requestNoteBackingBean.managedBean.requestNoteDtl.priceTypeId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems
								value="#{requestNoteBackingBean.getPriceTypeByPrice(requestNoteDtl.scRequestSupplierItem.supplierItemPrices)}"
								var="pmParameter"
								itemLabel="#{requestNoteBackingBean.getParameterDesc(pmParameter)}"
								itemValue="#{pmParameter.parameterId}" />

							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{requestNoteBackingBean.priceTypeChangeListener(requestNoteDtl.priceTypeId, requestNoteDtl)}" />
						</h:selectOneMenu> <p:message id="priceTypeMsg" for="priceType" display="icon" /></td>
				</tr>

				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.request.note.fulfill.type']}" /></td>
					<td><p:inputText
							value="#{requestNoteBackingBean.getParameterDesc(requestNoteBackingBean.managedBean.requestNoteDtl.fulfilmentType)}"
							disabled="true" size="25" style="margin-top: 5px;" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.fulfilment.tooltip']}" /></td>
				</tr>
			</table>

			<div class="ppRightBtn BtnSpacing">
				<p:commandButton id="okBtn"
					rendered="#{!isViewOnly}"
					value="#{lbl['lbl.sc.ok']}" process="@this itemDetailsId"
					update="itemDetailsId, @([id$=requestNoteItemDetails])"
					partialSubmit="true"
					action="#{requestNoteBackingBean.editQuantity}" />

				<p:commandButton value="#{lbl['lbl.sc.close']}" partialSubmit="true"
					process="@this" update="@form"
					action="#{requestNoteBackingBean.cancelItemDetailPopup}" />
			</div>
		</p:panel>

		<p:defaultCommand target="okBtn"></p:defaultCommand>
	</p:dialog>
</ui:composition>
