<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
	<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
			<h:panelGroup id="table-wrapper" style="width:100%;">
				<p:dataTable id="dpCustomerServiceSearchResult" value="#{dpCustomerServiceBB.dpCustomerServiceSearchModel}"
					var="dpCustomerServiceList"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowIndexVar="index" lazy="true" rows="10">

					<ac:paginator for="dpCustomerServiceSearchResult" />
                  <ui:param name="statusId" value="#{dpCustomerServiceList[4]}"></ui:param>
				<p:column headerText="#{lbl['lbl.sc.no']}" style="text-align:center">
				<h:outputText value="#{index+1}." />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.document.no']}" style="text-align:center">
				<h:outputText value="#{dpCustomerServiceList[1]}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.title']}" style="text-align:center">
			<h:outputText value="#{dpCustomerServiceList[5]}" />
			
			</p:column>

					<p:column headerText="#{lbl['lbl.sc.status']}" style="width:200px;">
						<h:outputText
							value="#{dpCustomerServiceBB.getStatusDescById(statusId)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}"
						style="width:6%;text-align: center;">
						<p:commandLink id="dpcustomerserviceeditQTIcon" action="#{dpCustomerServiceBB.viewDoc(dpCustomerServiceList,view.viewId)}"
							partialSubmit="true" process="@this">
							<h:graphicImage
								value="#{CommonUIConstant.imagePathUptoDesign}/edit.png"
								styleClass="tasklist_title1"
								 />
						</p:commandLink>

					
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:panel>
	
	</ui:composition>
