<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.customer.service.search']}" toggleable="true"
			id="dpCustomerServiceSearchPanel">
			<table width="1100px">
				
				<tr>
					<td>
						<p:outputLabel   value="#{lbl['lbl.sc.ptj.code']}" />
						<p:outputLabel value="*" styleClass="mandatory" />
					</td>
					<td colspan="3">
						<ac:lov id="openPtj" lovId="PM_ORG_PROFILE_PTJ" update="@form"
						headerText="#{lbl['lbl.sc.ptj.code']}" required="true"
						saveObject="dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.orgProfilePtjCode"
						value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.orgProfilePtjCode.orgCode}"
						size="35" readonly="true" postUpdateListener="dpCustomerServiceBB.setorgProfileData()" />
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel  id="searchPtjLbL" value="#{lbl['lbl.sc.ptj.name']}" />
					</td>
					<td colspan="3">
					
						<p:inputText readonly="true"  style="width:840px" value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.orgProfilePtjname.orgName}"></p:inputText>
						
						
					</td>
				</tr>
				<tr>
					<td ><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.dpTitle}"
							 maxlength="100" style="width:840px">
							 <p:ajax event="change" update="@this"></p:ajax>
							 </p:inputText>
							 </td>
				</tr>
				<tr>
				<td>
					<h:outputLabel value="#{lbl['lbl.sc.document.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
					<td colspan="3"><p:selectOneMenu
							value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.documentType}"
							style="width:840px;margin-bottom: 5px;"
							label="#{lbl['lbl.sc.document.type']}">
							<f:selectItems
								value="#{dpCustomerServiceBB.getDocTypeDPCustomerServiceDropdownValues()}" />
								<p:ajax update="@([id$=dpcustomerServiceStatusId])" process="@this"/>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td>
						  <h:outputLabel for="docNo" value="#{lbl['lbl.sc.document.no']}" />
					</td>
					<td colspan="3">
						<p:inputText id="docNo"
							value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.documentNo}"
							maxlength="21" style="width:840px;">
							<p:ajax update="@this" process="@this"/>
							</p:inputText>
					</td>
							
					
				</tr>				
				<tr>
					<td><h:outputLabel id="crdateFromLbL" value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar
							value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.createdDateFrom}"
							id="crdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="crdateTo" />
						</p:calendar></td>
					<td><h:outputLabel id="crdateToLbL" value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar id="crdateTo" showOn="button"
							label="#{lbl['lbl.sc.created.date.to']}"
							value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.createdDateTo}"
							mindate="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.createdDateFrom}"
							readonlyInput="true" required="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.createdDateFrom ne null or !dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.createdDateFrom eq ''}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.createdDateFrom}" />
								<p:ajax event="dateSelect" update="@this" />
						</p:calendar></td>
				</tr>
				
				
				<tr>
					<td><h:outputLabel   value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:selectOneMenu id="dpcustomerServiceStatusId"
							value="#{dpCustomerServiceBB.managedBean.dpCustServiceSearchBean.dpStatus}"
							style="width: 297px;margin-bottom: 5px;">
							<f:selectItems
								value="#{dpCustomerServiceBB.searchStatusDesc()}" />
								<p:ajax update="@this" process="@this"/>
						</p:selectOneMenu>
						</td>
				</tr>
			</table>
			
			
			 <div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{dpCustomerServiceBB.dpCustomerServiceSearchAction}" update="@([id$=dpCustomerServiceSearchResult])"
					process="@this, dpCustomerServiceSearchPanel" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{dpCustomerServiceBB.dpCustomerServicereset}" update="@([id$=dpCustomerServiceSearchPanel],[id$=dpCustomerServiceSearchResult])"
					resetValues="true" partialSubmit="true"
					process="@this" />
			</div>
			</p:panel>
	
	</ui:composition>
