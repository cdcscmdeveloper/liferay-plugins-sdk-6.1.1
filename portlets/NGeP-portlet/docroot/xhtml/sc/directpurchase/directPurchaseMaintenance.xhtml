<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="true"></p:messages>
		<ac:lovPopup />
		<p:confirmDialog
			header="#{lbl['lbl.sc.message']}" 
			message="#{lbl['lbl.sc.loa.cancel.rnapprover.popup']}" 
			severity="alert" widgetVar="RnAppAlert">
			<div class="ppRightBtn">			
				<p:commandButton value="#{lbl['lbl.btn.ok']}" 
					oncomplete="RnAppAlert.hide();" />
			</div>
		</p:confirmDialog>
		<p:confirmDialog
			header="#{lbl['lbl.sc.message']}"
			message="#{lbl['lbl.sc.loa.cancel.do.popup']}" 
			severity="alert" widgetVar="DOAlert">
			<div class="ppRightBtn">			
				<p:commandButton value="#{lbl['lbl.btn.ok']}" 
					oncomplete="DOAlert.hide();" />
			</div>
		</p:confirmDialog>
		<p:panel id="searchPanel" header="#{lbl['lbl.sc.search']}"
			toggleable="true">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel id="searchMinistryLbL"
							value="#{lbl['lbl.sc.ministry']}" /></td>
					<td colspan="3"><ac:lov id="searchMinistry" disabled="true"
							lovId="PM_ORG_PROFILE_MINSTRY" size="148" readonly="true"
							headerText="#{lbl['lbl.sc.ministry']}"
							value="#{directPurchaseBackingBean.managedBean.searchMinistryProfile.orgName}"
							postUpdateListener="directPurchaseBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="directPurchaseBackingBean.managedBean.searchMinistryProfile">
						</ac:lov></td>
				</tr>
				<tr>
					<td><p:outputLabel id="searchPtjGroupLbL"
							value="#{lbl['lbl.sc.kumpulan.ptj']}" /></td>
					<td colspan="3"><ac:lov id="searchPtjGroup" disabled="true"
							lovId="PM_ORG_PROFILE_PTJ_GROUP" size="148" readonly="true"
							headerText="#{lbl['lbl.sc.kumpulan.ptj']}"
							value="#{directPurchaseBackingBean.managedBean.searchPtjGroupProfile.orgName}"
							postUpdateListener="directPurchaseBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="directPurchaseBackingBean.managedBean.searchPtjGroupProfile"
							conditionField="#{directPurchaseBackingBean.getPTJGroupCondition()}"></ac:lov></td>
				</tr>

				<tr>
					<td><p:outputLabel id="searchPtjLbL"
							value="#{lbl['lbl.sc.ptj']}" /></td>
					<td colspan="3"><ac:lov id="searchPtj" disabled="true"
							lovId="PM_ORG_PROFILE_PTJ" size="148" readonly="true"
							headerText="#{lbl['lbl.sc.ptj']}"
							value="#{directPurchaseBackingBean.managedBean.searchPtjProfile.orgName}"
							postUpdateListener="directPurchaseBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="directPurchaseBackingBean.managedBean.searchPtjProfile"
							conditionField="#{directPurchaseBackingBean.getPtjCondition()}">
						</ac:lov></td>
				</tr>
				<tr>
					<td width="22%"><p:outputLabel
							value="#{lbl['lbl.sc.document.type']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 250px;"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentType}">
							<f:selectItems
								value="#{directPurchaseBackingBean.managedBean.documentTypes}" />
							<p:ajax event="change" update="searchPanel"
								listener="#{directPurchaseBackingBean.searchStatusDesc}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.document.no']}" /></td>
					<td><p:inputText size="35"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentNo}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.document.title']}" /></td>
					<td colspan="3"><p:inputText size="148"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentTitle}"></p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.document.status']}" /></td>
					<td><p:selectOneMenu style="width: 250px;"
							value="#{directPurchaseBackingBean.managedBean.searchStatusId}">
							<f:selectItems
								value="#{directPurchaseBackingBean.searchStatusDesc()}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar showOn="button" size="35"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentFromDuration}">
							<p:ajax event="dateSelect" update="toDate" />
						</p:calendar></td>

					<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar showOn="button" size="20"
							mindate="#{directPurchaseBackingBean.managedBean.searchDocumentFromDuration}"
							id="toDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
							value="#{directPurchaseBackingBean.managedBean.searchDocumentToDuration}">
						</p:calendar></td>
				</tr>
			</table>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{directPurchaseBackingBean.searchDPM}" update="resultPanel"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{directPurchaseBackingBean.reset(true)}" update=":form"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
			</div>
		</p:panel>
		<p:panel id="resultPanel" header="#{lbl['lbl.sc.result']}"
			toggleable="true">

			<p:dataTable id="scDocumentTableID" lazy="true"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{directPurchaseBackingBean.managedBean.dpDocumentDataModel}"
				var="Obj" width="100%" rows="10">

				<ac:paginator for="scDocumentTableID"></ac:paginator>

				<p:column width="6%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.document.type']}" />
					</f:facet>
					#{directPurchaseBackingBean.managedBean.documentTypeDesc}
				</p:column>

				<p:column width="6%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.document.no']}" />
					</f:facet>
					#{Obj[1]}
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.document.title']}" />
					</f:facet>

					<h:outputText value="#{Obj[5]}"
						style="white-space: normal;word-wrap: break-word;" />
				</p:column>
				
				<p:column width="22%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.supplier.name']}" />
					</f:facet>

					<c:choose>
						<c:when
							test="#{directPurchaseBackingBean.managedBean.documentTypeDesc == ParameterConst.loaTitle}">
							<h:outputText value="#{Obj[8]}"
								style="white-space: normal;word-wrap: break-word;" />
						</c:when>
						<c:otherwise>
							<h:outputText value="#{Obj[3]}" rendered="#{Obj[4] eq DPStatusConstants.rnPendingItemCodification}"
								style="white-space: normal;word-wrap: break-word;" />
						</c:otherwise>						
					</c:choose>

				</p:column>

				<p:column width="12%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.status']}" />
					</f:facet>
					#{directPurchaseBackingBean.getDocStatus(Obj)}
				</p:column>

				<p:column width="5%" style="text-align: center;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.action']}" />
					</f:facet>

					<p:menuButton value="#{lbl['lbl.btn.option']}" rendered="#{Obj[4] eq DPStatusConstants.rnPendingItemCodification}">
						<p:menuitem id="cancelBtnIcon" value="#{lbl['lbl.btn.cancel']}"
							icon="ui-icon-cancel"
							action="#{directPurchaseBackingBean.viewMaintenance(Obj, true)}" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" /> <ui:remove>36119, add loading icon when click</ui:remove>
					</p:menuButton>
					
					<p:menuButton value="#{lbl['lbl.btn.option']}" rendered="#{Obj[4] eq DPStatusConstants.loaPendingSubmission
					or Obj[4] eq DPStatusConstants.loaPendingApproval
					or Obj[4] eq DPStatusConstants.loaPendingRevision
					or Obj[4] eq DPStatusConstants.loaPendingRevisionApproval}">
						<p:menuitem id="cancelLoaBtnIcon" value="#{lbl['lbl.btn.cancel']}"
								icon="ui-icon-termination"
								action="#{directPurchaseBackingBean.viewMaintenance(Obj, true)}" disabled="#{directPurchaseBackingBean.allowCancel(Obj)}"/>					
					</p:menuButton>	
					
					<p:menuButton value="#{lbl['lbl.btn.option']}" rendered="#{Obj[4] eq QTStatusConst.loaCancelled}">
						<p:menuitem id="viewCancelLoaDtl" value="#{lbl['lbl.btn.view']}"
							icon="ui-icon-view"
							action="#{directPurchaseBackingBean.performViewDoc(Obj)}" />
					</p:menuButton>
					
					<p:tooltip for="cancelLoaBtnIcon">
						<h:outputText value="#{lbl['lbl.sc.loa.cancel.btn.tooltip']}" escape="false" />
					</p:tooltip>				
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
