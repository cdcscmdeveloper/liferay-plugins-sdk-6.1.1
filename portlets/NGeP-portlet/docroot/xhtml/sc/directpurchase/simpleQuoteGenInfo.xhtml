   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="sqinfoId" header="SIMPLE QUOTE INFORMATION" toggleable="true">
	<p:spacer height="7px" />
	  <table style="width: 90%;">
	      <tr>
			<td colspan="4"><p:outputPanel>
				<table style="width: 100%">
				    <tr>
					    <c:if test ="#{simpleQuoteBackingBean.managedBean.pmOrgProfile.brandNew}">
						 <td style="width: 150px">
						    <p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.header.ptn.name']}" /></td>
						 <td> <p:selectOneMenu
						     value="#{simpleQuoteBackingBean.managedBean.orgProfileId}"
						     styleClass="divisionclass" style="width: 250px;">
						  <f:selectItems 
							   value="#{simpleQuoteBackingBean.managedBean.userDivisionList}"
							   var="pmOrgProfile"
							   itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
							   itemValue="#{pmOrgProfile.orgProfileId}" />
							 <p:ajax event="change"  update="@([id$=headerId])"
							     process="@all"  listener="#{simpleQuoteBackingBean.ptjNameEvent}"/>
					</p:selectOneMenu></td>
					</c:if>
				</tr>
				</table>
			   </p:outputPanel></td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.panel']}" /></td>
				<td><p:selectOneRadio id="panel" value="#{simpleQuoteBackingBean.managedBean.isPanel}" disabled="false">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.yes']}" itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.no']}" itemValue="0" />
					</p:selectOneRadio></td>

				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.created.by']}" /></td>
				<td><p:inputText disabled="true" size="20" value="#{simpleQuoteBackingBean.managedBean.createdBy}"/></td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.title']}" /></td>
				<td style="width: 150px;" colspan="4"> <p:inputText size="120" value="#{simpleQuoteBackingBean.managedBean.scQuote.title}"
						style="margin-bottom: 5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.proc.type']}" /></td>
				<td><p:selectOneRadio style="margin-bottom: 5px;" 
						value="#{simpleQuoteBackingBean.managedBean.procurementType}">
						<f:selectItems
							value="#{simpleQuoteBackingBean.getRadioButtonCodeValues(ParameterTypeConst.procurementType)}" />
							<p:ajax event="change" update="@([id$=tabViewId])" 
							listener="#{simpleQuoteBackingBean.procurementTypeEvent}" process="@this" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
			<td colspan="4"><p:outputPanel id="justId">
				<table style="width: 100%">
				    <tr>
					   <ui:fragment rendered="#{simpleQuoteBackingBean.managedBean.procTypeOption}">
						 <td style="width: 150px">
						     <p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.just']}" /></td>
						 <td> <p:selectOneMenu style="width: 120px;margin-bottom: 5px;"
								value="#{simpleQuoteBackingBean.managedBean.scQuote.justificationType}">
							   <f:selectItems
									value="#{simpleQuoteBackingBean.managedBean.justDropdown}" />
								<p:ajax event="change" update="justId" 
									listener="#{simpleQuoteBackingBean.justificationTypeEvent}" process="@this" />
							</p:selectOneMenu> 
							</td>
			    	</ui:fragment>
				</tr>
				<tr>
				   <ui:fragment rendered="#{simpleQuoteBackingBean.managedBean.procTypeOption}">
					<td style="vertical-align:top; text-align:left;"><p:outputLabel
							value="#{lbl['lbl.sc.just.rmks']}" /></td>
					<td colspan="4"><p:inputTextarea value="#{simpleQuoteBackingBean.managedBean.requestNoteDtl.justification}"
							rows="3" cols="122" style="margin-bottom: 5px;" /></td>
				 </ui:fragment>
			    </tr>
				</table>
			   </p:outputPanel></td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.zonal']}" /></td>
				<td><p:selectOneRadio
						value="#{simpleQuoteBackingBean.managedBean.isZonal}">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.yes']}"
							itemValue="1" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.no']}"
							itemValue="0" />
							<p:ajax event="change" update="@([id$=tabViewId])" process="@this" listener="#{simpleQuoteBackingBean.zoneEvent}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.duration']}" /></td>
				<td><p:inputText id="durationId" size="6" value="#{simpleQuoteBackingBean.managedBean.duration}" style="text-align:right;">
				 <p:ajax event="keyup" update="startDate ,endDate"  process="@this durationId"
					          listener="#{simpleQuoteBackingBean.calcDuration(simpleQuoteBackingBean.managedBean.duration)}" /> 	
				
				</p:inputText>
				
				 <p:spacer	width="5px" /> 
				 <h:outputText value="Hours"></h:outputText>
				</td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.start.date']}" /></td>
				<td><p:calendar showOn="button" id="startDate" binding="#{StartDate}" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}">
				      <p:ajax event="dateSelect" update="@([id$=messageId])" />
				       <f:validator validatorId="dateRangeValidator" />
				   </p:calendar>
				 </td>
			
				<td style="width: 150px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.end.date']}" /></td>
				<td><p:calendar showOn="button" id="endDate" pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}">
				      <f:attribute name="startDate" value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}" />
                      <f:validator validatorId="dateRangeValidator" />
                       <p:ajax event="dateSelect" update="@([id$=messageId])" />
				    </p:calendar>
				</td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.no.of.quote']}" /></td>
				<td><p:selectOneRadio value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.single']}"
							itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.multiple']}"
							itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
		</table>
	</p:panel>
	<p:panel label="REMARKs" header="REMARKS" id="rmkId" toggleable="true" toggleSpeed="500">
	<p:outputPanel>
	 <table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="12%"></td>
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{simpleQuoteBackingBean.managedBean.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{simpleQuoteBackingBean.userImagePath(remarkVar.user.loginId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.user.userName}"/>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" />
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	  </table>
	  </p:outputPanel>
	</p:panel>
	
</ui:composition>
