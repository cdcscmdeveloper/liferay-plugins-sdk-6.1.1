   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="sqinfoId" header="SIMPLE QUOTE INFORMATION" toggleable="true">
	<p:spacer height="5px" />
	  <table style="width:100%;">
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.panel']}" /></td>
				<td><p:selectOneRadio id="panel" required="true" 
				         value="#{simpleQuoteBackingBean.managedBean.scQuote.panel}" 
				         label="#{lbl['lbl.sc.sq.gen.info.panel']}" disabled="true">
						<f:selectItems
							value="#{simpleQuoteBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
					</p:selectOneRadio>
					<p:message id="panelMsg" for="panel" display="icon" /> </td>

				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.created.by']}" /></td>
				<td><p:inputText disabled="true" size="20" value="#{simpleQuoteBackingBean.managedBean.createdBy}"/></td>
			</tr>
			<tr>
				<td style="width: 150px;">
				<p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.title']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td style="width: 150px;" colspan="4">
					<table>
						<tr>
							<td><p:inputText size="110" id="title" required="true" maxlength="100"
									label="#{lbl['lbl.sc.sq.gen.info.title']}"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.title}"
									style="margin-bottom: 5px;" /></td>
							<td><p:message id="titleMsg" for="title" display="icon" /></td>
						</tr>
					</table></td>
			  </tr>
			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.proc.type']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio style="margin-bottom: 5px;"  
				        id="procurementType" required="true"
				        label="#{lbl['lbl.sc.sq.gen.info.proc.type']}"
						value="#{simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode}">
						<f:selectItems
							value="#{simpleQuoteBackingBean.getRadioButtonCodeValues(ParameterTypeConst.procurementType)}" />
							<p:ajax event="change" update="@([id$=justId])" 
							listener="#{simpleQuoteBackingBean.procurementTypeEvent}" process="@this" />
					</p:selectOneRadio>
					<p:message id="procTypeMsg" for="procurementType" display="icon" />
					</td>
			</tr>
			<tr>
			<td colspan="4"><p:outputPanel id="justId">
				<table style="width: 100%">
				    <tr>
					   <ui:fragment rendered="#{simpleQuoteBackingBean.managedBean.procTypeOption}">
						 <td style="width: 150px">
						     <p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.just']}" /></td>
						 <td> <p:selectOneMenu style="width: 120px;margin-bottom: 5px;" id="justificationId" label="#{lbl['lbl.sc.sq.gen.info.just']}"
						       required="#{simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode eq 'A' or 
						             simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode eq 'E'}"
								value="#{simpleQuoteBackingBean.managedBean.scQuote.justificationType.parameterCode}">
							   <f:selectItems
									value="#{simpleQuoteBackingBean.managedBean.justDropdown}" />
								<p:ajax event="change" update="justId" 
									listener="#{simpleQuoteBackingBean.justificationTypeEvent}" process="@this" />
							</p:selectOneMenu> 
								<p:message id="justTypeMsg" for="justificationId" display="icon" />
							</td>
			    	</ui:fragment>
				</tr>
				<tr>
				   <ui:fragment rendered="#{simpleQuoteBackingBean.managedBean.procTypeOption}">
					<td style="vertical-align:top; text-align:left;"><p:outputLabel
							value="#{lbl['lbl.sc.just.rmks']}" /></td>
					<td colspan="4"><p:inputTextarea value="#{simpleQuoteBackingBean.managedBean.scQuote.justificationRemark}"
					          id="justificationRmk" label="#{lbl['lbl.sc.just.rmks']}" maxlength="100"
					          required="#{simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode eq 'A' or 
						             simpleQuoteBackingBean.managedBean.scQuote.procurementType.parameterCode eq 'E'}"
							rows="3" cols="122" style="margin-bottom: 5px;" /> <p:message id="justRmksMsg" for="justificationRmk" display="icon" /></td>
				 </ui:fragment>
			    </tr>
				</table>
			   </p:outputPanel></td>
			</tr>
			<tr>
				<td style="width: 150px;">
				<p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.zonal']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<p:selectOneRadio id="zonal" required="true"
				         value="#{simpleQuoteBackingBean.managedBean.scQuote.zonal}" 
				         label="#{lbl['lbl.sc.sq.gen.info.zonal']}" disabled="false">
						<f:selectItems
							value="#{simpleQuoteBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax event="change" update="@([id$=mainTabMenu])" process="@this" listener="#{simpleQuoteBackingBean.zoneEvent}" />
					</p:selectOneRadio>
					<p:message id="zonalMsg" for="zonal" display="icon" /></td>
			</tr>
			
			<tr>
				<td style="width: 150px;">
				<p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.start.date']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
					<table>
						<tr>
						 <td> 
							<p:calendar showOn="button" id="startDate" 
							        mindate="#{simpleQuoteBackingBean.managedBean.today}"
							        required="true"
									label="#{lbl['lbl.sc.sq.gen.info.start.date']}" 
									readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"
									value="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}">
									<p:ajax event="dateSelect" update="@([id$=endDate])" process="@this" partialSubmit="true"
										listener="#{simpleQuoteBackingBean.dateListener}" />
							</p:calendar></td>
							<td><p:message id="startDateMsg" for="startDate" display="icon" /></td>
						</tr>
					</table>
				</td>
			
				<td style="width: 150px;">
				 <p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.end.date']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:calendar showOn="button" id="endDate" label="#{lbl['lbl.sc.sq.gen.info.end.date']}"
				       mindate="#{simpleQuoteBackingBean.managedBean.scQuote.startDate}"
				       readonlyInput="true"  required="true" 
				       pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" 
				       value="#{simpleQuoteBackingBean.managedBean.scQuote.endDate}">
				     <p:ajax event="dateSelect" update="durationId"  process="@this" partialSubmit="true" 
										listener="#{simpleQuoteBackingBean.dateListener}" />
				    </p:calendar>
				    </td>
			</tr>
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.sq.gen.info.duration']}" /></td>
				<td>
				 <p:outputPanel autoUpdate="true" id="durationId">
				   <p:inputText  size="6" label="#{lbl['lbl.sc.sq.gen.info.duration']}" maxlength="3"
				      value="#{simpleQuoteBackingBean.managedBean.duration}"  disabled="true"
				      style="text-align:right; margin-top: 4px">
				    
				</p:inputText>
				
				 <p:spacer	width="5px" /> 
				 <h:outputText value="Hours"></h:outputText>
				 </p:outputPanel>
				</td>
			</tr>
			
			
			<tr>
				<td style="width: 150px;">
				<p:outputLabel value="#{lbl['lbl.sc.sq.gen.info.no.of.quote']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:selectOneRadio id="noOfQuote" label="#{lbl['lbl.sc.sq.gen.info.no.of.quote']}" required="true"
				      value="#{simpleQuoteBackingBean.managedBean.scQuote.multipleQuote}">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.single']}"
							itemValue="false" />
						<f:selectItem itemLabel="#{lbl['lbl.sc.sq.gen.info.multiple']}"
							itemValue="true" />
					</p:selectOneRadio><p:message id="noofquoteMsg" for="noOfQuote" display="icon" /> </td>
			</tr>
		</table>
	</p:panel>
	<p:panel label="REMARKs" header="REMARKS" id="rmkId" toggleable="true" toggleSpeed="500">
	<p:outputPanel>
	 <table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="12%"></td>
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{simpleQuoteBackingBean.managedBean.scQuote.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{simpleQuoteBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUser.userName}"/>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;" id="remarks" label="Remarks" maxlength="1000" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}"/>
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}"  style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
							 <td style="vertical-align: top;padding-right: 1px;text-align: right;">  
							    <p:message id="remarksMsg" for="remarks" display="icon" /></td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	  </table>
	  </p:outputPanel>
	</p:panel>
	
</ui:composition>
