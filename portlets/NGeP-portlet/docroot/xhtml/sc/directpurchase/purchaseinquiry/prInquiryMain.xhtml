<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="contentSection">
		<c:if test="#{purchaseInquiryBackingBean.managedBean.titleChecker}">
			<ac:title value="#{lbl['lbl.sc.pr.inquiry']}" />
		</c:if>

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages showDetail="true" autoUpdate="#{purchaseInquiryBackingBean.managedBean.autoUpdate}" closable="true"
			showSummary="false" severity="error, info" id="mainMsg" />
			
		<ui:param name="isTrackingDairyView" value="#{purchaseInquiryBackingBean.managedBean.trackingDairyView}" />
		<ui:param name="isViewOnly" value="#{purchaseInquiryBackingBean.managedBean.viewOnly}" />
		<ui:param name="isShowButton" value="#{purchaseInquiryBackingBean.managedBean.showButton}" />
		<ui:param name="isPendingSubmissionStatus"
			value="#{purchaseInquiryBackingBean.managedBean.priStatus.statusId eq DPStatusConstants.priPendingSubmission}" />
		<ui:param name="isPendingSupplierRespStatus"
			value="#{purchaseInquiryBackingBean.managedBean.priStatus.statusId eq DPStatusConstants.priPendingSupplierResponse}" />
		<ui:param name="isPendingRnCreationStatus"
			value="#{purchaseInquiryBackingBean.managedBean.priStatus.statusId eq  DPStatusConstants.priPendingRnCreation}" />
			
			<ui:param name="readOnlyTask" value="#{purchaseInquiryBackingBean.managedBean.readOnly}" />
				<ui:decorate
					template="/WEB-INF/facelets/templates/claim_template.xhtml">
					<ui:define name="outComeSection">
						<ui:include src="/xhtml/sc/directpurchase/purchaseinquiry/prInquiryButtons.xhtml" />
					</ui:define>
				</ui:decorate>
		
		
		<ui:include src="/xhtml/sc/directpurchase/purchaseinquiry/prInquiryHeader.xhtml" />
		<ui:include src="/xhtml/sc/directpurchase/purchaseinquiry/prInquiry.xhtml" />

	</ui:define>
</ui:composition>
