<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceZonalPageID">
		<p:dataTable id="pricingZonalID" rowIndexVar="rowIndex" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInquiryBackingBean.managedBean.supplierItemZonalStandardPrices}"
			width="100%" var="price" rowKey="#{price}">

			<ac:paginator for="pricingZonalID"></ac:paginator>
			
			<p:column style="width:2%" rendered="#{isPendingSupplierRespStatus}" >
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{purchaseInquiryBackingBean.flagZonalStandard}">
							<p:ajax partialSubmit="true" process="@this"
								update="@form"
								listener="#{purchaseInquiryBackingBean.selectAllZonalStandardPrice}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{price.selected}">
						<p:ajax partialSubmit="true" process="@this"
							update="@form"
							listener="#{purchaseInquiryBackingBean.selectSingleRowZonalStandardPrice}" />
					</p:selectBooleanCheckbox>
			</p:column>
			<p:column sortBy="#{price.tplSpecZone.zoneName}">
				<f:facet name="header">
					#{lbl['lbl.pm.zone']}
				</f:facet>
				<p:selectOneMenu value="#{price.tplSpecZone.specZoneId}"
					disabled="#{!isPendingSupplierRespStatus}" style="width: 90%;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems
						value="#{purchaseInquiryBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.zoneName}"
						itemValue="#{zone.specZoneId}"></f:selectItems>
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.published.per.unit']}
				</f:facet>
				<h:outputText value="#{price.pricing.price}" size="10" readonly="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </h:outputText>
			</p:column>
			 <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.offered.per.unit']}
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus or rowIndex ne '0'}" value="#{price.itemPrice}" size="10" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </p:inputText>
			</p:column>


		</p:dataTable>
		<div class="ppRightBtn">					
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" id="zonalAddButtonId" value="#{lbl['lbl.btn.add']}"
						
						partialSubmit="true" process="@this" update="priceZonalPageID"
						action="#{purchaseInquiryBackingBean.addSupplierItemZonalStandardPrices}">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" value="#{lbl['lbl.btn.delete']}" process="@this"
						disabled="#{!isEnableZonalNormalDel}"
						id="scReqItmZonalDeleteBtnId"
						
						partialSubmit="true" onclick="deleteZonalStandardConfirmationDlg.show();"
						update="@([id$=#{deleteZonalStandardConfirmDlg}])">
					</p:commandButton>
		</div>
		<ui:param name="deleteZonalStandardConfirmDlg"
			value="deleteZonalStandardConfirmDlg"></ui:param>

		<ac:confirmationPopup id="#{deleteZonalStandardConfirmDlg}"
			widget="deleteZonalStandardConfirmationDlg" width="400" height="100"
			okAction="purchaseInquiryBackingBean.deleteSupplierItemZonalStandardPrices"
			title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.delete.message']}"
			update=":#{p:component('scReqItmZonalDeleteBtnId')}, @([id$=pricingZonalID])" />

		<div class="clear"></div>

	</p:outputPanel>
		

</ui:composition>
