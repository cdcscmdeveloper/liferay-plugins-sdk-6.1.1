<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceZonalPromotionPageID">
		<p:dataTable id="pricingZonalPromotionID" rowIndexVar="rowIndex" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInquiryBackingBean.managedBean.supplierItemZonalPromotionPrices}"
			width="100%" var="price" rowKey="#{price}">

			<ac:paginator for="pricingZonalPromotionID"></ac:paginator>
			
			<p:column style="width:2%" rendered="#{isPendingSupplierRespStatus}" >
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{purchaseInquiryBackingBean.flagZonalPromotion}">
							<p:ajax partialSubmit="true" process="@this"
								update="@form"
								listener="#{purchaseInquiryBackingBean.selectAllZonalPromotionPrice}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{price.selected}">
						<p:ajax partialSubmit="true" process="@this"
							update="@form"
							listener="#{purchaseInquiryBackingBean.selectSingleRowZonalPromotionPrice}" />
					</p:selectBooleanCheckbox>
			</p:column>
			<c:if test="#{isPendingSupplierRespStatus and isStockAvailable}">
				<p:column sortBy="#{price.tplSpecZone.zoneName}">
					<f:facet name="header">
						#{lbl['lbl.pm.zone']}
					</f:facet>
					<p:selectOneMenu value="#{price.tplSpecZone.specZoneId}"
						disabled="#{!isPendingSupplierRespStatus}" style="width: 128px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" itemDisabled="#{price.tplSpecZone.specZoneId != null}"/>
						<f:selectItems
							value="#{purchaseInquiryBackingBean.managedBean.supplierZoneList}"
							var="zone" itemLabel="#{zone.zoneName}"
							itemValue="#{zone.specZoneId}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>			
			</c:if>
			<c:if test="#{!isPendingSupplierRespStatus or !isStockAvailable}">
				<p:column sortBy="#{price.tplSpecZone.zoneName}">
					<f:facet name="header">
					#{lbl['lbl.pm.zone']}
					</f:facet>
						<h:outputText value="#{price.tplSpecZone.zoneName}" size="10" readonly="true" style="text-align:right"></h:outputText>
				</p:column>	
			</c:if>	
            <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.published.per.unit']}
				</f:facet>
				<h:outputText value="#{null != price.pricing.price ? price.pricing.price : lbl['lbl.sc.customer.service.supplier.name']}" size="10" readonly="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </h:outputText>
			</p:column>
			 <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.offered.per.unit']}
				</f:facet>
				<p:inputText requiredMessage="#{lbl['lbl.sc.price.inquiry.new.price.required']}" disabled="#{!isPendingSupplierRespStatus or !isStockAvailable}" id="itemPriceZonalPromo" value="#{price.itemPrice}" size="10" style="text-align:right">
				<p:ajax event="change" update="@([id$=itemPriceZonalPromo])" listener="#{purchaseInquiryBackingBean.onChangeNewPrice('06', price.itemPrice, price.pricing.price)}"/>
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </p:inputText>
			</p:column>


		</p:dataTable>
		<div class="ppRightBtn">
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" id="zonalPromotionAddButtonId" value="#{lbl['lbl.btn.add']}"
						disabled="#{!isStockAvailable}" 
						partialSubmit="true" process="@this" update="priceZonalPromotionPageID"
						action="#{purchaseInquiryBackingBean.addSupplierItemZonalPromotionPrices}">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" value="#{lbl['lbl.btn.delete']}" process="@this"
						disabled="#{!isEnableZonalPromoDel or !isStockAvailable}"
						id="scReqItmZonalPromotionDeleteBtnId"
						
						partialSubmit="true" onclick="deleteZonalPromotionConfirmationDlg.show();"
						update="@([id$=#{deleteZonalPromotionConfirmDlg}])">
					</p:commandButton>
		</div>
		<ui:param name="deleteZonalPromotionConfirmDlg"
			value="deleteZonalPromotionConfirmDlg"></ui:param>

		<ac:confirmationPopup id="#{deleteZonalPromotionConfirmDlg}"
			widget="deleteZonalPromotionConfirmationDlg" width="400" height="100"
			okAction="purchaseInquiryBackingBean.deleteSupplierItemZonalPromotionPrices"
			title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.delete.message']}"
			update=":#{p:component('scReqItmZonalPromotionDeleteBtnId')}, @([id$=pricingZonalPromotionID])" />

		<div class="clear"></div>

	</p:outputPanel>
		

</ui:composition>
