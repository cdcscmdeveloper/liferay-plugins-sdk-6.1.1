<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panelGrid styleClass="tablePanel" style="width:100%;">
		<f:facet name="header">
			<p:row>
				<p:column>
						#{lbl['lbl.sc.price.inquiry.price.published.per.unit']}
				</p:column>
				<p:column>
						#{lbl['lbl.sc.price.inquiry.price.offered.per.unit']}
				</p:column>
			</p:row>

		</f:facet>

		<p:row rendered="#{purchaseInquiryBackingBean.managedBean.supplierItemStandardPrice ne null}" >
			<p:column>
				<h:outputText value="#{purchaseInquiryBackingBean.managedBean.supplierItemStandardPrice.pricing.price}"
					style="float:right">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
				<p:column>
				<p:inputText style="text-align:right" disabled="#{!isPendingSupplierRespStatus}"
					value="#{purchaseInquiryBackingBean.managedBean.supplierItemStandardPrice.itemPrice}">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>
	
		</p:row>


	</p:panelGrid>







</ui:composition>
