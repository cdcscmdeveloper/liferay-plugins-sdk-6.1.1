<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceZonalTierPageID">
		<p:dataTable id="pricingZonalTierID" rowIndexVar="rowIndex" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInquiryBackingBean.managedBean.supplierItemZonalTierStandardPrices}"
			width="100%" var="price" rowKey="#{price}">

			<ac:paginator for="pricingZonalTierID"></ac:paginator>
			
			<p:column style="width:2%" rendered="#{isPendingSupplierRespStatus}" >
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{purchaseInquiryBackingBean.flagZonalTierStandard}">
							<p:ajax partialSubmit="true" process="@this"
								update="@form"
								listener="#{purchaseInquiryBackingBean.selectAllZonalTierStandardPrice}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{price.selected}">
						<p:ajax partialSubmit="true" process="@this"
							update="@form"
							listener="#{purchaseInquiryBackingBean.selectSingleRowZonalTierStandardPrice}" />
					</p:selectBooleanCheckbox>
			</p:column>
			<p:column sortBy="#{price.tplSpecZone.zoneName}">
				<f:facet name="header">
					#{lbl['lbl.pm.zone']}
				</f:facet>
				<p:selectOneMenu value="#{price.tplSpecZone.specZoneId}"
					disabled="#{!isPendingSupplierRespStatus}" style="width: 128px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" itemDisabled="#{price.tplSpecZone.specZoneId != null}"/>
					<f:selectItems
						value="#{purchaseInquiryBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.zoneName}"
						itemValue="#{zone.specZoneId}"></f:selectItems>
				</p:selectOneMenu>
			</p:column>
			<p:column sortBy="#{price.fromQty}">
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.from.qty']}
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus or rowIndex ne '0'}" id="fromQty" value="#{price.fromQty}" size="5" style="text-align:right">
                	<p:ajax event="change" update="@([id$=fromQty])" listener="#{purchaseInquiryBackingBean.onChangeFromQty('07')}"/>
                	<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
                </p:inputText>
			</p:column>
			<p:column sortBy="#{price.toQty}">
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.to.qty']}
					<ac:iconTooltip  value="#{lbl['lbl.sc.tier.pricetype.tooltip']}" />
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus}" id="toQty" value="#{price.toQty}" size="5" style="text-align:right">
					<p:ajax event="change" update="@([id$=fromQty],[id$=toQty])" listener="#{purchaseInquiryBackingBean.onChangeToQty('07')}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
            </p:column>				
            <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.published.per.unit']}
				</f:facet>
				<h:outputText value="#{price.pricing.price}" size="10" readonly="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </h:outputText>
			</p:column>
			 <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.offered.per.unit']}
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus}" id="newPrice" value="#{price.itemPrice}" size="10" style="text-align:right">
					<p:ajax event="change" update="@([id$=newPrice])" listener="#{purchaseInquiryBackingBean.onChangeNewPrice('07', price.itemPrice, price.pricing.price)}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </p:inputText>
			</p:column>


		</p:dataTable>
		<div class="ppRightBtn">
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" id="zonalTierAddButtonId" value="#{lbl['lbl.btn.add']}"
						title="#{lbl['lbl.sc.tier.add.tooltip']}"
						partialSubmit="true" process="@this" update="priceZonalTierPageID"
						action="#{purchaseInquiryBackingBean.addSupplierItemZonalTierStandardPrices}">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" value="#{lbl['lbl.btn.delete']}" process="@this"
						disabled="#{!isEnableZonalTierNormalDel}"
						id="scReqItmZonalTierDeleteBtnId"
						
						partialSubmit="true" onclick="deleteZonalTierStandardConfirmationDlg.show();"
						update="@([id$=#{deleteZonalTierStandardConfirmDlg}])">
					</p:commandButton>
		</div>
		<ui:param name="deleteZonalTierStandardConfirmDlg"
			value="deleteZonalTierStandardConfirmDlg"></ui:param>

		<ac:confirmationPopup id="#{deleteZonalTierStandardConfirmDlg}"
			widget="deleteZonalTierStandardConfirmationDlg" width="400" height="100"
			okAction="purchaseInquiryBackingBean.deleteSupplierItemZonalTierStandardPrices"
			title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.delete.message']}"
			update=":#{p:component('scReqItmZonalTierDeleteBtnId')}, @([id$=pricingZonalTierID])" />

		<div class="clear"></div>

	</p:outputPanel>
		

</ui:composition>
