<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceTierPromotionPageID">
		<p:dataTable id="pricingTierPromotionID" rowIndexVar="rowIndex" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInquiryBackingBean.managedBean.supplierItemTierPromotionPrices}"
			width="100%" var="price" rowKey="#{price}">

			<ac:paginator for="pricingTierPromotionID"></ac:paginator>
			
			<p:column style="width:2%" rendered="#{isPendingSupplierRespStatus}">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{purchaseInquiryBackingBean.flagTierPromotion}">
							<p:ajax partialSubmit="true" process="@this"
								update="@form"
								listener="#{purchaseInquiryBackingBean.selectAllTierPromotionPrice}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{price.selected}">
						<p:ajax partialSubmit="true" process="@this"
							update="@form"
							listener="#{purchaseInquiryBackingBean.selectSingleRowTierPromotionPrice}" />
					</p:selectBooleanCheckbox>
			</p:column>
			
			
			
			<p:column sortBy="#{price.fromQty}">
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.from.qty']}
				</f:facet>
				<p:inputText requiredMessage="#{lbl['lbl.sc.price.inquiry.from.qty.required']}" disabled="#{(!isPendingSupplierRespStatus or rowIndex ne '0') or !isStockAvailable or !purchaseInquiryBackingBean.isCurrentUser(price.createdBy)}" id="fromQty" value="#{price.fromQty}" size="5" style="text-align:right">
                	<p:ajax event="change" update="@([id$=fromQty])" listener="#{purchaseInquiryBackingBean.onChangeFromQty('04')}"/>
                	<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
                </p:inputText>

			</p:column>
			<p:column sortBy="#{price.toQty}">
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.to.qty']}
					<ac:iconTooltip  value="#{lbl['lbl.sc.tier.pricetype.tooltip']}" />
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus  or !isStockAvailable or !purchaseInquiryBackingBean.isCurrentUser(price.createdBy)}" id="toQty" value="#{price.toQty}" size="5" style="text-align:right">
					<p:ajax event="change" update="@([id$=fromQty],[id$=toQty])" listener="#{purchaseInquiryBackingBean.onChangeToQty('04')}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
            </p:column>
            <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.published.per.unit']}
				</f:facet>
				<h:outputText value="#{null != price.pricing.price ? price.pricing.price : lbl['lbl.sc.customer.service.supplier.name']}" size="10" readonly="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </h:outputText>
			</p:column>
			 <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.offered.per.unit']}
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus  or !isStockAvailable}" id="newPrice" value="#{price.itemPrice}" size="10" style="text-align:right">
					<p:ajax event="change" update="@([id$=newPrice])" listener="#{purchaseInquiryBackingBean.onChangeNewPrice('04', price.itemPrice, price.pricing.price)}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </p:inputText>
			</p:column>


		</p:dataTable>
		<div class="ppRightBtn">
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" id="tierPromotionAddButtonId" value="#{lbl['lbl.btn.add']}"
						disabled="#{!isStockAvailable}"
						title="#{lbl['lbl.sc.tier.add.tooltip']}"
						partialSubmit="true" process="@this" update="priceTierPromotionPageID"
						action="#{purchaseInquiryBackingBean.addSupplierItemTierPromotionPrices}">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" value="#{lbl['lbl.btn.delete']}" process="@this"
						disabled="#{!isEnableTierPromoDel  or !isStockAvailable}"
						id="scReqItmPromotionTierDeleteBtnId"
						
						partialSubmit="true" onclick="deleteTierPromotionConfirmationDlg.show();"
						update="@([id$=#{deleteTierPromotionConfirmDlg}])">
					</p:commandButton>
		</div>
		<ui:param name="deleteTierPromotionConfirmDlg"
			value="deleteTierPromotionConfirmDlg"></ui:param>

		<ac:confirmationPopup id="#{deleteTierPromotionConfirmDlg}"
			widget="deleteTierPromotionConfirmationDlg" width="400" height="100"
			okAction="purchaseInquiryBackingBean.deleteSupplierItemTierPromotionPrices"
			title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.delete.message']}"
			update=":#{p:component('scReqItmPromotionTierDeleteBtnId')}, @([id$=pricingTierPromotionID])" />

		<div class="clear"></div>

	</p:outputPanel>
		

</ui:composition>
