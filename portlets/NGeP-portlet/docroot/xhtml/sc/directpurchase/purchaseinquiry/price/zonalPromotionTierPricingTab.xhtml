<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceZonalTierPromotionPageID">
		<p:dataTable id="pricingZonalTierPromotionID" rowIndexVar="rowIndex" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{purchaseInquiryBackingBean.managedBean.supplierItemZonalTierPromotionPrices}"
			width="100%" var="price" rowKey="#{price}">

			<ac:paginator for="pricingZonalTierPromotionID"></ac:paginator>
			
			<p:column style="width:2%" rendered="#{isPendingSupplierRespStatus}" >
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selAllChk"
							value="#{purchaseInquiryBackingBean.flagZonalTierPromotion}">
							<p:ajax partialSubmit="true" process="@this"
								update="@form"
								listener="#{purchaseInquiryBackingBean.selectAllZonalTierPromotionPrice}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{price.selected}">
						<p:ajax partialSubmit="true" process="@this"
							update="@form"
							listener="#{purchaseInquiryBackingBean.selectSingleRowZonalTierPromotionPrice}" />
					</p:selectBooleanCheckbox>
			</p:column>
			<c:if test="#{!isPendingSubmissionStatus}">
				<p:column sortBy="#{price.tplSpecZone.zoneName}">
					<f:facet name="header">
						#{lbl['lbl.pm.zone']}
					</f:facet>
					<p:selectOneMenu value="#{price.tplSpecZone.specZoneId}"
						disabled="#{!isPendingSupplierRespStatus}" style="width: 128px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" itemDisabled="#{price.tplSpecZone.specZoneId != null}"/>
						<c:forEach items="#{purchaseInquiryBackingBean.managedBean.supplierZoneList}" var="zone" varStatus="varStatus">
							<f:selectItem itemLabel="#{zone.zoneName}" itemValue="#{zone.specZoneId}" itemDisabled="#{purchaseInquiryBackingBean.checkZoneLimitTwoRow(zone.specZoneId ,'08')}"/>
						</c:forEach>
						<p:ajax update="hideZonePromo,fromQty" listener="#{purchaseInquiryBackingBean.toDetermineToQty(price.tplSpecZone.specZoneId ,'08',price)}"/>
					</p:selectOneMenu>
					<p:inputText value="#{price.tplSpecZone.specZoneId}" id="hideZonePromo" type="hidden" />		
				</p:column>			
			</c:if>
			<c:if test="#{isPendingSubmissionStatus}">
				<p:column sortBy="#{price.tplSpecZone.zoneName}">
					<f:facet name="header">
					#{lbl['lbl.pm.zone']}
					</f:facet>
						<h:outputText value="#{price.tplSpecZone.zoneName}" size="10" readonly="true" style="text-align:right"></h:outputText>
				</p:column>	
			</c:if>
			<p:column sortBy="#{price.fromQty}">
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.from.qty']}
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus or price.fromQty ne '1'}" id="fromQty" value="#{price.fromQty}" size="5" style="text-align:right">
                	<p:ajax event="change" update="@([id$=fromQty])" listener="#{purchaseInquiryBackingBean.onChangeFromQty('08')}"/>
                	<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
                </p:inputText>
			</p:column>
			<p:column sortBy="#{price.toQty}">
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.to.qty']}
					<ac:iconTooltip  value="#{lbl['lbl.sc.tier.pricetype.tooltip']}" />
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus}" id="toQty" value="#{price.toQty}" size="5" style="text-align:right">
					<p:ajax event="change" update="@([id$=fromQty],[id$=toQty])" listener="#{purchaseInquiryBackingBean.onChangeToQty('08')}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText>
            </p:column>				
            <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.published.per.unit']}
				</f:facet>
				<h:outputText value="#{price.pricing.price}" size="10" readonly="true" style="text-align:right">
				<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </h:outputText>
			</p:column>
			 <p:column>
				<f:facet name="header">
					#{lbl['lbl.sc.price.inquiry.price.offered.per.unit']}
				</f:facet>
				<p:inputText disabled="#{!isPendingSupplierRespStatus}" id="newPrice" value="#{price.itemPrice}" size="10" style="text-align:right">
					<p:ajax event="change" update="@([id$=newPrice])" listener="#{purchaseInquiryBackingBean.onChangeNewPrice('08', price.itemPrice, price.pricing.price)}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
                </p:inputText>
			</p:column>


		</p:dataTable>
		<div class="ppRightBtn">
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" id="zonalPromotionAddButtonId" value="#{lbl['lbl.btn.add']}"
						title="#{lbl['lbl.sc.tier.add.tooltip']}"
						partialSubmit="true" process="@this" update="priceZonalTierPromotionPageID"
						action="#{purchaseInquiryBackingBean.addSupplierItemZonalTierPromotionPrices(purchaseInquiryBackingBean.managedBean.supplierItemZonalTierPromotionPrices)}">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton rendered="#{isPendingSupplierRespStatus}" value="#{lbl['lbl.btn.delete']}" process="@this"
						disabled="#{!isEnableZonalTierPromoDel}"
						id="scReqItmZonalTierPromotionDeleteBtnId"
						
						partialSubmit="true" onclick="deleteZonalTierPromotionConfirmationDlg.show();"
						update="@([id$=#{deleteZonalTierPromotionConfirmDlg}])">
					</p:commandButton>
		</div>
		<ui:param name="deleteZonalTierPromotionConfirmDlg"
			value="deleteZonalTierPromotionConfirmDlg"></ui:param>

		<ac:confirmationPopup id="#{deleteZonalTierPromotionConfirmDlg}"
			widget="deleteZonalTierPromotionConfirmationDlg" width="400" height="100"
			okAction="purchaseInquiryBackingBean.deleteSupplierItemZonalTierPromotionPrices"
			title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.delete.message']}"
			update=":#{p:component('scReqItmZonalTierPromotionDeleteBtnId')}, @([id$=pricingZonalTierPromotionID])" />

		<div class="clear"></div>

	</p:outputPanel>
		

</ui:composition>
