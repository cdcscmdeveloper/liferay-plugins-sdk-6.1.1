<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ac:gpkiPopup
		textBeforeSign="#{purchaseInquiryBackingBean.textBeforeSign}"
		postSignAction="#{purchaseInquiryBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}"
		enableAutoUpdate="#{purchaseInquiryBackingBean.enableAutoUpdate()}" />
		
		<!-- 20190417@asyrafhaziq_12095 - Start -->
	<ui:param name="cancelPI" value="cancelPI" />
	<ac:cancelRejectPopup id="#{cancelPI}" widget="cancelPI" width="30%"
		height="100"
		okAction="#{purchaseInquiryBackingBean.requisitionerAction('CANCEL')}"
		title="#{lbl['lbl.cancel.details']}"
		content="#{lbl['lbl.cancel.dialog.confirm.message']}" update="@this" />
		
     <!-- 20190417@asyrafhaziq_12095 - End -->
     
     <!-- 26129 - Start -->
     <ui:param name="cancelPiPendingSubmission" value="cancelPiPendingSubmission" />
	 <ac:cancelRejectPopup id="#{cancelPiPendingSubmission}" widget="cancelPiPendingSubmission" width="30%"
		height="100"
		okAction="#{purchaseInquiryBackingBean.requisitionerAction('CANCELPI')}"
		title="#{lbl['lbl.cancel.details']}"
		content="#{lbl['lbl.cancel.dialog.confirm.message']}" update="@this" />
     <!-- 26129 - End -->
		

	<div>
		<!-- view back button -->
		<p:commandButton immediate="true" process="@this" partialSubmit="true"
			value="#{lbl['lbl.btn.back']}" rendered="#{purchaseInquiryBackingBean.managedBean.showBackButton}"
			action="#{purchaseInquiryBackingBean.backToPrevious}" />

		<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
			style="float:right;"
			rendered="#{purchaseInquiryBackingBean.managedBean.trackingDairyView}"
			action="#{pmTrackingDiaryBackingBean.redirectToSupplierTrackingDiary(ParameterConst.doctypePurchaseInquiry, purchaseInquiryBackingBean.managedBean.scPrInquiry.prInquiryId, purchaseInquiryBackingBean.isSupplier())}"
			immediate="true" />

	</div>

	<h:panelGroup rendered="#{isShowButton}">
		<c:if test="#{isPendingSubmissionStatus}">
			<table border="0" cellpadding="0" cellspacing="0" width="100%">
				<tr>
					<!-- 29557 - Start -->
					<c:if test="#{empty purchaseInquiryBackingBean.managedBean.taskId}">
					<td>
						<p:commandButton immediate="true"
							value="#{lbl['lbl.btn.item.search']}" partialSubmit="true"
							process="@this"
							action="#{purchaseInquiryBackingBean.backToPrevious}" />
					</td>
					</c:if>
					<!-- 29557 - End -->
					<!-- 26129 - Start -->
					<c:if test="#{!empty purchaseInquiryBackingBean.managedBean.taskId}">
						<td style="float: right;">
							<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
								update="@this" styleClass="ui-button" onclick="cancelPiPendingSubmission.show();"/>
						</td>
					</c:if>
					<!-- 26129 - End -->
					<td style="float:right;">
						<p:commandButton
							value="#{lbl['lbl.btn.submit']}" partialSubmit="true"
							process="@form"
							action="#{purchaseInquiryBackingBean.submitPrInquiryDtl('SUBMIT')}"
							onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();" update="@form" />
					</td>
					<c:if test="#{purchaseInquiryBackingBean.managedBean.disProcTyp}" >
						<td style="float:right;">
							<p:commandButton
								value="#{lbl['lbl.btn.save']}" onclick="blockWidget.show();"
								oncomplete="blockWidget.hide();"
								action="#{purchaseInquiryBackingBean.submitPrInquiryDtl('')}"
								process="@all" update="@form" /> 
						</td>
					</c:if>
					<c:if test="#{!purchaseInquiryBackingBean.managedBean.disProcTyp}" >
						<td style="float:right;">

							<p:commandButton value="#{lbl['lbl.btn.save']}" partialSubmit="true"
								process="@form" onstart="blockWidget.show();" update="@form"
								oncomplete="blockWidget.hide(); if (args &amp;&amp; !args.validationFailed) cd.show();" />

							<p:confirmDialog
								message="#{lbl['lbl.sc.dialog.confirm.message.save']}"
								header="#{lbl['lbl.sc.dialog.confirm.header.save']}"
								severity="alert" widgetVar="cd">
								<div class="ppRightBtn">
									<p:commandButton value="#{lbl['lbl.btn.yes']}"
										actionListener="#{purchaseInquiryBackingBean.submitPrInquiryDtl('')}"
										onclick="cd.hide();" onstart="blockWidget.show();"
										oncomplete="blockWidget.hide();" id="saveId"
										partialSubmit="true" process="@all" immediate="true" update="@form"/>
									<p:commandButton value="#{lbl['lbl.btn.no']}"
										onclick="cd.hide();" />
								</div>
							</p:confirmDialog>
						</td>
					</c:if>
				</tr>
			</table>
		</c:if>

		<c:if test="#{!empty purchaseInquiryBackingBean.managedBean.taskId}">
			<div class="ppRightBtn">
				<c:if test="#{isPendingRnCreationStatus}">
					<p:commandButton value="#{lbl['lbl.btn.proceed']}"
						partialSubmit="true" process="@form" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{purchaseInquiryBackingBean.requisitionerAction('PROCESSED')}" />

					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						style="float:right;" partialSubmit="true" process="@form"
						onstart="cancelPI.show();"
						 />

				</c:if>
				<ui:repeat var="bpmAction"
					value="#{purchaseInquiryBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel"
						value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

					<c:if test="#{isPendingSupplierRespStatus}">

						<p:commandButton value="#{lbl['lbl.btn.save']}"
							action="#{purchaseInquiryBackingBean.supplierSave}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
							<!-- 29557 - remove process="@this"  -->
						<p:commandButton value="#{lbl[buttonLabel]}"
								styleClass="ui-button" update="@([id$=spkiOutputPanel])"
								action="#{purchaseInquiryBackingBean.supplierSubmit}"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();">
								<f:setPropertyActionListener value="#{bpmAction}"
									target="#{purchaseInquiryBackingBean.managedBean.action}" />
							</p:commandButton>

						</c:if></ui:repeat>
				<p:outputPanel id="spkiOutputPanel">
					<ac:spkiPopup id="spkiPopup"
						password="#{purchaseInquiryBackingBean.managedBean.spkiBackingBean.password}"
						challengeAns1="#{purchaseInquiryBackingBean.managedBean.spkiBackingBean.challengeAns1}"
						challengeQues1="#{purchaseInquiryBackingBean.managedBean.spkiBackingBean.challengeQues1}"
						postSignAction="#{purchaseInquiryBackingBean.updateSupplierResponse(spkiBackingBean.pmDigiSign)}"
						enableAutoUpdate="#{purchaseInquiryBackingBean.enableAutoUpdate()}" />
				</p:outputPanel>
			</div>
		</c:if>
		
	</h:panelGroup>
</ui:composition>
