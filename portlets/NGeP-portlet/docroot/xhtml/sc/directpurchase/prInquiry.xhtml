   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
   <p:spacer height="10px" />
	<p:panel id="prInqPanel">
 
	<p:panelGrid styleClass="noBorders tr,noBorders td,headerClass" 
		style="background-color: #F2F2F2;" width="100%">
		<p:row>
			<p:column>
				<p:outputLabel
					value="#{lbl['lbl.sc.price.inquiry.purchase.inquiry.no']}" />
			</p:column>
			<p:column width="25%">
				<p:inputText disabled="true"  value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.prInquiryNo}"/>
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.price.inquiry.ptj.name']}" />
			</p:column>

			<p:column width="25%" style="align : center;" size="42">
			<p:inputText disabled="true"  value="#{purchaseInquiryBackingBean.managedBean.pmOrgProfile.orgName}"/>
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.price.inquiry.status']}" />
			</p:column>
			<p:column width="25%">
				<p:inputText disabled="true" value="#{purchaseInquiryBackingBean.currentStatus}"  />
			</p:column>
		</p:row>
	</p:panelGrid>
	<p:spacer height="5px" />
	<p:panel header=" INQUIRY DETAIL" toggleable="true" id="addToCartId">
		<table>
			<tr>
			<td colspan="4" style="width: 250px;"><p:outputPanel id="ptjId">
				<table style="width: 100%">
				    <tr>
					   <ui:fragment rendered="#{purchaseInquiryBackingBean.managedBean.orgProfileId == null}">
						 <td style="width: 250px;">
						    <p:outputLabel value="#{lbl['lbl.sc.price.inquiry.ptj.name']}" /></td>
						 <td> <p:selectOneMenu 
						     value="#{purchaseInquiryBackingBean.managedBean.orgProfileId}"
						     styleClass="divisionclass" style="width: 250px;margin-bottom: 5px;">
						  <f:selectItems 
							   value="#{purchaseInquiryBackingBean.managedBean.userDivisionList}"
							   var="pmOrgProfile"
							   itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
							   itemValue="#{pmOrgProfile.orgProfileId}" />
							 <p:ajax event="change" update="@([id$=prInqPanel]) " 
							     process="@all"  listener="#{purchaseInquiryBackingBean.ptjNameEvent}"/>
					</p:selectOneMenu></td>
			    	</ui:fragment>
				</tr>
				</table>
			   </p:outputPanel></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.supp.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.smSupplier.companyName}"
						size="46" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.product.code']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.extensionCode}" /></td>

				<td style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}"
						size="46" /></td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.desc']}" /></td>
				<td colspan="4"><p:inputTextarea disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}"
						rows="4" cols="122" style="margin-bottom: 5px;" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.uom']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.min.qty']}" /></td>
				<td><p:inputText disabled="true" 
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.minOrder}" style="text-align:right;"/></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.order.qty']}" /></td>
				<td ><p:inputText  disabled="#{purchaseInquiryBackingBean.managedBean.editFlag}"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.requestNoteItem.quantity}" style="text-align:right;"/></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.price.type']}" /></td>
				<td>
				   <p:selectOneMenu required="true" id="priceType" style="margin-bottom: 5px;"
				        disabled="#{purchaseInquiryBackingBean.managedBean.editFlag}"
						value="#{purchaseInquiryBackingBean.managedBean.priceType}">
						<f:selectItems
							value="#{purchaseInquiryBackingBean.managedBean.priceTypes}" />
						<p:ajax event="change"
							listener="#{purchaseInquiryBackingBean.priceTypeChangeListener()}"
							update="respDtl" process="@this" />
					</p:selectOneMenu>
				   <p:commandLink >
				    <p:graphicImage
						value="/resources/ep/images/design/document.png" 
						height="15px"/>
				   </p:commandLink> </td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.delivery.term']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.maxOrder}" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.inquiry.date']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.day.to.resp']}" /></td>
						
				<td><p:inputText id="dayToResponse" size="2" maxlength="2" disabled="#{purchaseInquiryBackingBean.managedBean.editFlag}"
				        style="text-align:right;"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.dayToResponse}">
					 <p:ajax event="keyup" update="dayToRespId" 
					          listener="#{purchaseInquiryBackingBean.calcDayToResponse(purchaseInquiryBackingBean.managedBean.scPrInquiry)}" /> 	
		    	   </p:inputText>
				   <p:spacer width="5px" /> 
			       <p:inputText disabled="true" id="dayToRespId"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.dateToResponse}"> 
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				  </p:inputText> </td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" /></td>
				<td><p:selectOneRadio style="margin-bottom: 5px;"  id="procType" 
				        disabled="#{purchaseInquiryBackingBean.managedBean.editFlag}" 
						value="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.procurementType}">
						<f:selectItems
							value="#{purchaseInquiryBackingBean.procTypeDropdown}" />
							<p:ajax event="change" update="justiId" 
							listener="#{purchaseInquiryBackingBean.procurementTypeEvent}" process="@this" />
					</p:selectOneRadio></td>
			</tr>
		    <tr>
			  <td colspan="4">
			        <p:outputPanel id="justiId">
					<table style="width: 100%">
					    <tr>
						   <ui:fragment rendered="#{purchaseInquiryBackingBean.managedBean.procTypeOption}">
							 <td style="width: 250px">
							     <p:outputLabel value="#{lbl['lbl.sc.justification']}" /></td>
							 <td> <p:selectOneMenu style="width: 120px;margin-bottom: 5px;" 
									value="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.justificationType}">
								   <f:selectItems
										value="#{purchaseInquiryBackingBean.managedBean.justDropdown}" />
									<p:ajax event="change" update="justiId ,otherId" 
										listener="#{purchaseInquiryBackingBean.justificationTypeEvent}" process="@this" />
								</p:selectOneMenu> 
								    <p:spacer width="5px" />
								<p:inputText size="40" id="otherId" rendered="#{purchaseInquiryBackingBean.managedBean.justTypeOption}"/></td>
				    	 </ui:fragment>
					   </tr>
					 </table>
				    </p:outputPanel>
				   </td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.just.rmks']}" /></td>
				<td colspan="4"><p:inputTextarea value="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.justification}"
						rows="4" cols="122" style="margin-bottom: 5px;" /></td>
			</tr>
		</table>

	</p:panel>
	<p:panel header="RESPONSE DETAIL" toggleable="true">
		<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:60%">
			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.sc.price.inquiry.stock.avail']}" />
				</p:column>
				<p:column width="25%">
					<p:selectOneRadio  id="stockAvailable" disabled="#{purchaseInquiryBackingBean.managedBean.editFlag}"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.isStockAvailable}"
						rendered="true" required="true">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="0" />
					</p:selectOneRadio>
				</p:column>

			</p:row>
		</p:panelGrid>
		<p:spacer height="15px" />

		<p:dataTable id="respDtl" var="reqSupplerItem"
			value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.scRequestSupplierItems}"
			rowKey="#{pricing.pricingId}" rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.zone']}" style="width:25%">
					<h:outputText />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.from.qty']}" style="width:10%">
				<h:outputText value="#{reqSupplerItem.supplierItemPrice.pricing.fromQty}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.to.qty']}" style="width:10%">
				<h:outputText value="#{reqSupplerItem.supplierItemPrice.pricing.toQty}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.price.published']}" style="width:15%">
				<h:outputText value="#{reqSupplerItem.supplierItemPrice.pricing.price}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.price.offered']}" style="width:15%">
				<p:inputText value="100" style="text-align:right;" size="30" disabled="#{!purchaseInquiryBackingBean.managedBean.editFlag}" />
			</p:column>

		</p:dataTable>
	</p:panel>

	<p:panel header="Remarks" toggleable="true">

		<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="19%"></td>
			
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.user.loginId)}" height="30" width="30" />
							</td>
							<td width="6"></td>
							<td>
								<h:outputText value="#{remarkVar.user.userName}"></h:outputText>,
								<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;"  value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" id="remark" required="true"/>
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>
	</p:panel>
	</p:panel>
</ui:composition>
