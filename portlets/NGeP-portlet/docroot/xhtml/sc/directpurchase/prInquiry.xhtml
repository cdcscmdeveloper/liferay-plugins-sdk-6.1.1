   <ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="prInqPanel">
	    <div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 13%">
					<h:outputLabel value="#{lbl['lbl.sc.price.inquiry.purchase.inquiry.no']}" />
				</td>
				<td style="width: 15%" class="header-info-text">
					#{purchaseInquiryBackingBean.managedBean.scPrInquiry.prInquiryNo}
				</td>
				<td style="width: 13%">
					<h:outputLabel value="#{lbl['lbl.sc.price.inquiry.header.ptj.name']}" />
				</td>
				<td style="width: 30%" class="header-info-text">
				#{purchaseInquiryBackingBean.managedBean.pmOrgProfile.orgName}
				</td>
				<td style="width: 13%">
					<h:outputLabel value="#{lbl['lbl.sc.price.inquiry.status']}" />
				</td>
				<td style="width: 21%" class="header-info-text">
				#{purchaseInquiryBackingBean.managedBean.priStatus}
				</td>
			</tr>
		</table>
	</div>
	
	<p:panel header=" INQUIRY DETAIL" toggleable="true" id="addToCartId">
		<table>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.supp.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.smSupplier.companyName}"
						size="46" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.product.code']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.extensionCode}"
						size="46" /></td>

				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.item.name']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.cmItem.itemName}"
						size="46" /></td>
			</tr>
			<tr>
				<td style="vertical-align:top; text-align:left;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.desc']}" /></td>
				<td colspan="4"><p:inputTextarea disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.itemDesc}"
						rows="2" cols="122" style="margin-bottom: 5px; width: 300px;" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.uom']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.pmUom.uomName}"
						size="25" /></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.min.qty']}" /></td>
				<td><p:inputText disabled="true" 
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.minOrder}" style="text-align:right;"
						size="25">
						  <f:convertNumber  pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</p:inputText>
				 </td>
			</tr>
			<tr>
				<td style="width: 250px;">
				<p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.order.qty']}" /> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td ><p:inputText disabled="#{purchaseInquiryBackingBean.managedBean.requisitionerFlag}"  
				           label="#{lbl['lbl.sc.price.inquiry.order.qty']}" maxlength="14" id="oderQtyId"  required="true"
					       validatorMessage="Order Qty: must be a decimal number between 0.0 and 9999999999.999"
						   value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.requestNoteItem.quantity}" styleClass="ppRightBtn"
						   size="25">
						</p:inputText>
			     </td>
			     <td><p:message id="oderQtyIdMsg" for="oderQtyId"
										display="icon" /></td>
			</tr>
			<tr>
				<td style="width: 250px;">
				   <p:outputLabel value="#{lbl['lbl.sc.price.inquiry.price.type']}" /> 
				   <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td>
				   <table>
						   <tr>
								<td><p:selectOneMenu required="true" id="priceType"
										style="margin-bottom: 5px; width: 185px;"
										label="#{lbl['lbl.sc.price.inquiry.price.type']}"
										disabled="#{purchaseInquiryBackingBean.managedBean.requisitionerFlag}"
										value="#{purchaseInquiryBackingBean.managedBean.priceType}">
										<f:selectItems
											value="#{purchaseInquiryBackingBean.managedBean.priceTypes}" />
										<p:ajax event="change"
											listener="#{purchaseInquiryBackingBean.priceTypeChangeListener()}"
											update="respDtl" process="@this" />
									</p:selectOneMenu></td>
								<td>
								<p:spacer width="2px"></p:spacer>
								<p:commandLink>
								     <p:graphicImage library="ep/images/design" name="evaluate.png"
							                style="vertical-align:middle" />
									</p:commandLink></td>
								<td><p:message id="priceTypeMsg" for="priceType"
										display="icon" /></td>
							</tr>
					  </table>

					</td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.delivery.term']}" /></td>
				<td><p:inputText disabled="true"  style="text-align:right;"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrice.pricing.cmSupplierItem.leadTime}"
						size="25"> </p:inputText></td>
			</tr>
			<tr>
				<td style="width: 250px;"><p:outputLabel
						value="#{lbl['lbl.sc.price.inquiry.inquiry.date']}" /></td>
				<td><p:inputText disabled="true"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.createdDate}"
						size="25">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td style="width: 250px;">
				   <p:outputLabel value="#{lbl['lbl.sc.price.inquiry.day.to.resp']}" /> 
				   <p:outputLabel value="*" styleClass="mandatory" /></td>
						
				<td><p:inputText id="dayToResponse" size="2" maxlength="2" required="true" label="#{lbl['lbl.sc.price.inquiry.day.to.resp']}"
				         disabled="#{purchaseInquiryBackingBean.managedBean.requisitionerFlag}"
				        style="text-align:right;"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.dayToResponse}">
					 <p:ajax event="keyup" update="dayToRespId" 
					          listener="#{purchaseInquiryBackingBean.calcDayToResponse(purchaseInquiryBackingBean.managedBean.scPrInquiry)}" /> 	
		    	   </p:inputText>
				   <p:spacer width="6px" /> 
			       <p:inputText disabled="true" id="dayToRespId"
						value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.dateToResponse}"
						size="16"> 
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				  </p:inputText> </td>
				  <td><p:message id="dayToResponseMsg" for="dayToResponse" display="icon"/></td>
				  
			</tr>
		    <tr>
			    <td colspan="4">
			    <h:panelGroup rendered="#{!purchaseInquiryBackingBean.managedBean.requisitionerFlag}" id="justiId">
			    
					<table style="width: 100%">
					  <tr>
						 <td style="width: 250px">
						     <p:outputLabel value="#{lbl['lbl.sc.procurement.type']}" />  
						     <p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:selectOneRadio style="margin-bottom: 5px;"  
						        id="procType" required="true" label="#{lbl['lbl.sc.procurement.type']}"
								value="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.procurementType.parameterCode}">
								<f:selectItems 
									value="#{purchaseInquiryBackingBean.managedBean.procurementTypes}" />
									<p:ajax event="change" update="justiId" 
									listener="#{purchaseInquiryBackingBean.procurementTypeEvent}" process="@this" />
							</p:selectOneRadio></td>
						 <td><p:message id="procTypeMsg" for="procType" display="icon"/></td>	
					  </tr>
					    <tr>
						   <ui:fragment rendered="#{purchaseInquiryBackingBean.managedBean.procTypeOption}">
							 <td style="width: 250px">
							     <p:outputLabel value="#{lbl['lbl.sc.justification']}" /></td>
							 <td> <p:selectOneMenu style="width: 185px; margin-bottom: 5px;" id="justificationId" label="#{lbl['lbl.sc.justification']}"
							         required="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.procurementType.parameterCode eq 'A' or 
						              purchaseInquiryBackingBean.managedBean.requestNoteDtl.procurementType.parameterCode eq 'E'}"
									  value="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.justificationType.parameterCode}">
								   <f:selectItems
										value="#{purchaseInquiryBackingBean.managedBean.justDropdown}" />
									<p:ajax event="change" update="justiId" 
										listener="#{purchaseInquiryBackingBean.justificationTypeEvent}" process="@this" />
								</p:selectOneMenu> <p:message id="justTypeMsg" for="justificationId" display="icon" /></td>
								
				    	 </ui:fragment>
					   </tr>
					   <tr>
					    <ui:fragment rendered="#{purchaseInquiryBackingBean.managedBean.procTypeOption}">
						 <td style="vertical-align:top; text-align:left;"><p:outputLabel
								value="#{lbl['lbl.sc.price.inquiry.just.rmks']}" /></td>
						 <td colspan="4">
						    <p:inputTextarea value="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.justification}"
						        id="justificationRmk" label="#{lbl['lbl.sc.price.inquiry.just.rmks']}"
						        required="#{purchaseInquiryBackingBean.managedBean.requestNoteDtl.procurementType.parameterCode eq 'A' or 
						             purchaseInquiryBackingBean.managedBean.requestNoteDtl.procurementType.parameterCode eq 'E'}"   
								rows="2" cols="122" style="margin-bottom: 5px; width: 300px;" /><p:message id="justRmksMsg" for="justificationRmk" display="icon" /></td>
						</ui:fragment>
					   </tr>
					   
					  </table>
				  </h:panelGroup>
				 </td>
			</tr>
		</table>

	</p:panel>
	<p:panel header="RESPONSE DETAIL" toggleable="true">
		<table>
			<tr>
				<td style="width: 250px;">
					<p:outputLabel value="#{lbl['lbl.sc.price.inquiry.stock.avail']}" />
					<p:outputLabel value="*" styleClass="mandatory"  rendered="#{!purchaseInquiryBackingBean.managedBean.supplierFlag}"/>
				</td>
				<td>
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="1">
					<h:column>
						<p:selectOneRadio  id="stockAvailable"  label="#{lbl['lbl.sc.price.inquiry.stock.avail']}"
						    disabled="#{purchaseInquiryBackingBean.managedBean.supplierFlag}"
							value="#{purchaseInquiryBackingBean.managedBean.stockAvailable}"
						     required="#{!unspscCodeBackingBean.isRequisitioner()}">
							<f:selectItem itemLabel="#{lbl['lbl.sc.price.inquiry.yes']}" itemValue="1" />
							<f:selectItem itemLabel="#{lbl['lbl.sc.price.inquiry.no']}" itemValue="0" />
							 <p:ajax event="change" update="respDtl" process="@this" listener="#{purchaseInquiryBackingBean.stockAvailabilityEvent}"  partialSubmit="true"/>
						</p:selectOneRadio>
						<p:message id="stockAvailableMsg" for="stockAvailable" display="icon"/>
					</h:column>
				</h:panelGrid>
				</td>
			</tr>
		</table>
		<p:spacer height="15px" />
		<p:dataTable id="respDtl" var="supplierItemPrice"
			value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.requestSupplierItem.supplierItemPrices}"
			rowKey="#{supplierItemPrice.pricing.pricingId}" rowIndexVar="index">
			<p:column headerText="#{lbl['lbl.sc.price.inquiry.zone']}" style="width:25%">
					#{supplierItemPrice.tplSpecZone.zoneName}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.from.qty']}" style="width:10%">
				<h:outputText value="#{supplierItemPrice.fromQty}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.to.qty']}" style="width:10%">
				<h:outputText value="#{supplierItemPrice.toQty}" style="float:right"/>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.price.inquiry.price.published']}" style="width:15%">
				<h:outputText value="#{supplierItemPrice.pricing.price}" style="float:right" >
				 <f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"/>
				  </h:outputText>
			</p:column>

			<p:column style="width:15%">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory"  rendered="#{purchaseInquiryBackingBean.managedBean.stockAvailabilityFlag and !purchaseInquiryBackingBean.managedBean.supplierFlag}"/>
				<h:outputText value="#{lbl['lbl.sc.price.inquiry.price.offered']}" />
			</f:facet>
			
				<p:inputText value="#{supplierItemPrice.itemPrice}" style="text-align:right;" label="#{lbl['lbl.sc.price.inquiry.price.offered']}" maxlength="23" size="30"  id="itemPrice"
				  disabled="#{!purchaseInquiryBackingBean.managedBean.stockAvailabilityFlag or purchaseInquiryBackingBean.managedBean.supplierFlag}" required="#{purchaseInquiryBackingBean.managedBean.stockAvailabilityFlag}">
				    <f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"/>
				  </p:inputText>
				 <p:message id="itemPriceMsg" for="itemPrice" display="icon"/>
			</p:column>

		</p:dataTable>
	</p:panel>

	<p:panel header="Remarks" toggleable="true">

	<table style="width: 100%">
		<tr>
			<td class="TableFieldLeft" width="19%"></td>
			
			<td class="TableFieldRight">
				<p:dataGrid id="catatan" value="#{purchaseInquiryBackingBean.managedBean.scPrInquiry.remarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left">
								<h:graphicImage value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}" height="30" width="30" />
							</td>
							<td width="6"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
								<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
								    <f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea style="width:350px;"  maxlength="1000" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" id="remark" />
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}"  style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
							
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>
	</p:panel>
	</p:panel>
</ui:composition>
