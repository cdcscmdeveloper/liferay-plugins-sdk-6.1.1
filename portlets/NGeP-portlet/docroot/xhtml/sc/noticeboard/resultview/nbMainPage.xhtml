<ui:composition

	xmlns:h="http://java.sun.com/jsf/html"

		<table border="0" cellpadding="0" cellspacing="0" width="100%">
			<tr>
				<td width="18%" valign="top">
					<ui:include src="/xhtml/sc/noticeboard/resultview/nbSearch.xhtml" />
				</td>
				<td width="82%" align="left" valign="top">
					<ui:include src="/xhtml/sc/noticeboard/resultview/nbResultsView.xhtml" />
				</td>
			</tr>
		</table>
	</ui:define>
	
</ui:composition>
