<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="resourceSection">
		<meta name="viewport" content="width=565"/>
	</ui:define>

	<ui:define name="contentSection">
		<p:messages id="noticeBoardSearch" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<table border="0" cellpadding="0" cellspacing="0" width="100%">
			<tr>
				<td width="100%" valign="top"><ui:include
						src="/xhtml/sc/noticeboard/mobileview/nbSearch.xhtml" /></td>

			</tr>
			<tr>
				<td width="100%" align="left" valign="top"><ui:include
						src="/xhtml/sc/noticeboard/mobileview/nbResultsView.xhtml" /></td>
			</tr>
		</table>
	</ui:define>
	
</ui:composition>
