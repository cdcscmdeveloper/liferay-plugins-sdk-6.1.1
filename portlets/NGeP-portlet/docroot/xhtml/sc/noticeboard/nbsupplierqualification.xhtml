<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:messages id="supplierQualification" showDetail="true"
		showSummary="false" autoUpdate="true" closable="true" />
	<p:panel header="Check Supplier Qualification" toggleable="true">
<div class="clear"></div>
		<table style="margin:0 auto;">

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.mof.no']}"></h:outputLabel>
					</td>
				<td><p:inputText value="#{noticeBoardBackingBean.mofNo}"
						></p:inputText></td>
				<td><p:commandButton value="Check" icon="ui-icon-check"
						action="#{noticeBoardBackingBean.checkSupplierQulificationStatus}"
						update="table-wrapper">
					</p:commandButton></td>
			</tr>
		</table>

	</p:panel>

<h:panelGroup id="table-wrapper" >
	<p:panel id="qualificationCriteria" rendered="#{noticeBoardBackingBean.visible}"
		header="#{lbl['lbl.sc.spec.supplier.qual.criteraia']}"
		style="margin-bottom:5px;" toggleable="true">
		<p:dataTable id="supplierQulification"
			value="#{noticeBoardBackingBean.managedBean.qualificationBean}"
			var="qulificationBean" styleClass="test" rows="20">

			<p:column headerText="Criteria">
				<h:outputText value="#{qulificationBean.criteria}" />
			</p:column>
			<p:column headerText="Requirement" style="width:100px;">
				<h:outputText
					value="#{fn:replace(qulificationBean.qtRequirement,':','&lt;/br&gt;')}"
					size="50" escape="false"
					style="width:100px; height:100px !important;" />
			</p:column>
			
			<p:column headerText="Qualification Status" style="width:120px;">
				<h:outputText value="#{qulificationBean.supplierStatus}" />
			</p:column>

		</p:dataTable>


		<div style="text-align: center;">
			<h:outputText value="#{lbl['lbl.nb.supplier.criteria.qualify']}"
				style="font-size:18px;"
				rendered="#{noticeBoardBackingBean.managedBean.qualified}"></h:outputText>

			<h:outputText value="#{lbl['lbl.nb.supplier.criteria.disqualify']}"
				style="font-size:18px;"
				rendered="#{!noticeBoardBackingBean.managedBean.qualified}"></h:outputText>
		</div>
	</p:panel>
	</h:panelGroup>



</ui:composition>
