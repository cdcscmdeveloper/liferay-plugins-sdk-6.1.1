<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Check Supplier Qualification">
		<h:panelGrid columns="2">
		<h:outputLabel value="MOF No"></h:outputLabel>
		<ac:lov id="mofNumber" lovId="SM_MOFNO"
						headerText="Mof Number"
						saveObject="noticeBoardBackingBean.managedBean.smSupplier"					
						value="#{noticeBoardBackingBean.managedBean.mofAccount.mofNo}"
						>
					</ac:lov> <ac:lovPopup />
		</h:panelGrid>
		<h:panelGrid columnClasses="2">
		<p:commandButton value="Check" style="float:left;"
			icon="ui-icon-search"
			action="#{noticeBoardBackingBean.searchNoticeBoard}"
			update="supplierQulification">


		</p:commandButton>
		</h:panelGrid>
	</p:panel>

	<p:panel  header="Qualification Status">

		<p:dataTable id="supplierQulification"
				var="scqt" styleClass="test" rows="20">
				
			<p:column headerText="Criteria">
				<h:outputText value="Test" />
			</p:column>
			<p:column headerText="Requirement" style="width:100px;">
				<h:outputText value="011-525-45689" />
			</p:column>

			<p:column headerText="Qualification Status" style="width:120px;">
				<h:outputText value="123-234-4567" />
			</p:column>
			
		</p:dataTable>

	</p:panel>
	
	<p:panel header="Locality" >

		<p:dataTable 
				var="scqt" styleClass="test" rows="20">
				


			<p:column headerText="State">
				<h:outputText value="Test" />
			</p:column>
			<p:column headerText="District" style="width:100px;">
				<h:outputText value="011-525-45689" />
			</p:column>

			<p:column headerText="Qualification Status" style="width:120px;">
				<h:outputText value="123-234-4567" />
			</p:column>
			
		</p:dataTable>

	</p:panel>
	
	
	</ui:composition>
