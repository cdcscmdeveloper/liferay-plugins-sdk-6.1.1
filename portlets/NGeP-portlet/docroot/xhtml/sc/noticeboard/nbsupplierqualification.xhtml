<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:messages id="supplierQualification" showDetail="true"
		showSummary="false" autoUpdate="true" closable="true" />
	<p:blockUI block=":form" trigger="nbCheckSupplierQualification"
		widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	<p:panel header="Check Supplier Qualification" toggleable="true">
		<div class="clear"></div>
		<table style="margin: 0 auto;">

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.mof.no']}"></h:outputLabel>
				</td>
				<td><p:inputText value="#{noticeBoardBackingBean.mofNo}"></p:inputText></td>
				<td><p:commandButton value="Check"
						id="nbCheckSupplierQualification"
						action="#{noticeBoardBackingBean.checkSupplierQulificationStatus}"
						update="@form,table-wrapper" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();">
					</p:commandButton></td>
			</tr>
		</table>

	</p:panel>

	<h:panelGroup id="table-wrapper"
		rendered="#{noticeBoardBackingBean.visible}">
		<p:panel id="qualificationCriteria"
			header="#{lbl['lbl.sc.spec.supplier.qual.criteraia']}"
			style="margin-bottom:5px;" toggleable="true">
			<p:dataTable id="supplierQulification"
				value="#{noticeBoardBackingBean.managedBean.qualificationBean}"
				var="qulificationBean" styleClass="test" tyle="width:70%;">

				<p:column headerText="Criteria" style="width:30%;">
					<h:outputText value="#{qulificationBean.criteria}" />
				</p:column>
				<p:column headerText="Requirement" style="width:50%;">
					<h:outputText
						value="#{fn:replace(qulificationBean.qtRequirement,':','&lt;/br&gt;')}"
						size="50" escape="false" />
				</p:column>

				<p:column headerText="Qualification Status" style="width:20%;">
					<p:graphicImage library="ep/images/design" name="tick.png"
						value="/resources/ep/images/design/tick.png"
						rendered="#{qulificationBean.supplierStatus}"></p:graphicImage>

					<p:graphicImage library="ep/images/design" name="cancel.png"
						value="/resources/ep/images/design/cancel.png"
						rendered="#{!qulificationBean.supplierStatus}"></p:graphicImage>


				</p:column>

			</p:dataTable>

			<p:spacer height="20px"></p:spacer>
			<div style="text-align: center;">
				<h:outputText value="#{lbl['lbl.nb.supplier.criteria.qualify']}"
					style="font-size:18px;" escape="false"
					rendered="#{noticeBoardBackingBean.managedBean.qualified}"></h:outputText>

				<h:outputText value="#{lbl['lbl.nb.supplier.criteria.disqualify']}"
					style="font-size:18px;" escape="false"
					rendered="#{!noticeBoardBackingBean.managedBean.qualified}"></h:outputText>
			</div>
		</p:panel>
	</h:panelGroup>



</ui:composition>
