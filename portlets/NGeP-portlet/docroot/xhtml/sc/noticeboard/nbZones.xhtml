<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:tabView var="zones" dynamic="true" orientation="left"
		value="#{noticeBoardBackingBean.managedBean.zoneBean}">
		<p:ajax event="tabChange" listener="#{noticeBoardBackingBean.bsvZoneTabChange}"
			></p:ajax>
		<p:tab title="#{zones.tplSpecZoneDtl.zoneName}">
			<ui:param name="bsvDetails" value="#{noticeBoardBackingBean.managedBean.normalBsvBean}"></ui:param>
			<ui:include src="/xhtml/sc/noticeboard/qtlocationbriefingdtls.xhtml"></ui:include>
			<ui:include
				src="/xhtml/sc/noticeboard/noticeboardLocationPopUp.xhtml"></ui:include>
		</p:tab>


	</p:tabView>


</ui:composition>
