<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Supplier List" toggleable="true">
		<p:dataTable id="supplierPriceDtls"
			value="#{noticeBoardBackingBean.managedBean.proposalAmts}"
			var="proposalAmt" rowKey="#{proposalAmt}" rowIndexVar="index">
			<ac:paginator for="supplierPriceDtls"></ac:paginator>

			<p:column headerText="#{lbl['lbl.qt.nb.supplierno']}">
				<h:outputText
					value="#{proposalAmt.scQtProposal.scQtSupplier.qtSupplierId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.qt.nb.offeredprice']}">
				<h:outputText value="#{proposalAmt.proposalAmt}" />
			</p:column>



		</p:dataTable>

	</p:panel>
</ui:composition>
