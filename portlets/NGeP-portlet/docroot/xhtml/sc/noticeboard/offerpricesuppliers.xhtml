<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<p:dataTable id="supplierPriceDtls"
			value="#{noticeBoardBackingBean.managedBean.qualificationBean}"
			var="supplierBean" >
			<ac:paginator for="supplierPriceDtls"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}">
				<h:outputText
					value="#{supplierBean.supplierId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.offered.price']}">
				<h:outputText value="#{supplierBean.offeredPrice}" />
			</p:column>



		</p:dataTable>

	</p:panel>
</ui:composition>
