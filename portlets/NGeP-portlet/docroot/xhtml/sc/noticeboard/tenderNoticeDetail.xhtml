<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">
	
		<!-- <ac:title value="#{lbl['lbl.sc.notice.board.qtn.notice']}" /> -->
		<div class="clear"></div>
		<p:messages id="tenderDetails" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		<!-- <ui:include src="noticeboardLocationPopUp.xhtml"></ui:include> -->
		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				action="#{noticeBoardBackingBean.backBtn}" />
		</div>
		
		<p:panel
			header="#{lbl[noticeBoardBackingBean.managedBean.scQt.procurementMode == ParameterConst.procurementModeQuotation ? 'lbl.sc.notice.board.quotation.details' : 'lbl.sc.notice.board.tender.details']}"
			toggleable="true">

			<h:panelGrid border="0" width="100%" columns="4"
				columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth40">
				<h:outputLabel value="#{lbl['lbl.sc.title']}" />
				<h:outputText style="white-space: normal;word-wrap: break-word;"
					value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" />
				<h:outputText value="(#{lbl['lbl.sc.updated.on']} #{noticeBoardBackingBean.managedBean.changedDate})" styleClass="lastUpdated"
				 rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean.newTitle ne null ? 'true':'false'}"/>
				<h:outputLabel value="" 
				rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean.newTitle eq null ? 'true':'false'}"/>
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}" />
				<h:outputLabel value="" />
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.ministry']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.ministryName}" />
				<h:outputLabel value="" />
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.ptj']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}" />
				<h:outputLabel value="" />
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.publish.date']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.publishDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
				</h:outputText>
				<h:outputLabel value="" />
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.qt.publishing.period']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.publishPeriod}" />
				<h:outputText value="(#{lbl['lbl.sc.updated.on']} #{noticeBoardBackingBean.managedBean.changedDate})" styleClass="lastUpdated"
				 rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean ne null and noticeBoardBackingBean.managedBean.qtAmendMentBean.newPublishPeriodDays ne 0 ? 'true':'false'}"/>
				<h:outputLabel value="" 
				rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean eq null or noticeBoardBackingBean.managedBean.qtAmendMentBean.newPublishPeriodDays eq 0 ? 'true':'false'}"/>
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.closing.date']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
				</h:outputText>
				<h:outputText value="(#{lbl['lbl.sc.updated.on']} #{noticeBoardBackingBean.managedBean.changedDate})" styleClass="lastUpdated"
				 rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean ne null and noticeBoardBackingBean.managedBean.qtAmendMentBean.newPublishPeriodDays ne 0 ? 'true':'false'}"/>
				<h:outputLabel value="" 
				rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean eq null or noticeBoardBackingBean.managedBean.qtAmendMentBean.newPublishPeriodDays eq 0 ? 'true':'false'}"/>
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity']}" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod}" />
				<h:outputText value="'('#{lbl['lbl.sc.updated.on']} #{noticeBoardBackingBean.managedBean.changedDate}')'" styleClass="lastUpdated"
				 rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean ne null and noticeBoardBackingBean.managedBean.qtAmendMentBean.newValidityPeriodDays ne 0 ? 'true':'false'}"/>
				<h:outputLabel value="" 
				rendered="#{noticeBoardBackingBean.managedBean.qtAmendMentBean eq null or noticeBoardBackingBean.managedBean.qtAmendMentBean.newValidityPeriodDays eq 0? 'true':'false'}"/>
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.proposal.validity.until']}" />
				<h:outputText
					value="#{DateUtils.addDays(noticeBoardBackingBean.managedBean.scQt.closingDate,noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod)}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
				<h:outputLabel value="" />
				<h:outputLabel value="" />
				
				<h:outputLabel value="#{lbl['lbl.sc.evaluation.type']}" />
				<h:outputText value="One Tier"
					rendered="#{noticeBoardBackingBean.managedBean.scQt.evaluationType eq '1'}" />
				<h:outputText value="Two Tier"
					rendered="#{noticeBoardBackingBean.managedBean.scQt.evaluationType eq '2'}" />
				<h:outputLabel value="" />
			</h:panelGrid>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.supplier.qulification.criteria']}"
			toggleable="true">
			<h:panelGrid border="0" width="100%" columns="3"
				columnClasses="columnWidth20,columnWidth50,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.sc.supplier.status']}" />
				<h:outputText value="#{lbl['lbl.sc.supplier.status.open']}"
					rendered="#{noticeBoardBackingBean.managedBean.scQt.openFor eq 'A'}" />
				<h:outputText value="#{lbl['lbl.sc.supplier.status.bumiputra']}"
					rendered="#{noticeBoardBackingBean.managedBean.scQt.openFor eq 'B'}" />
				<h:outputLabel value="" />

				<c:if
					test="#{null ne noticeBoardBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}">
					<h:outputLabel value="#{lbl['lbl.sc.paidup']}" />
					<h:outputText
						value="#{noticeBoardBackingBean.managedBean.scQt.scQtSupplierCriteria.minPaidUpCapital}" />
					<h:outputLabel value="" />
				</c:if>

				<c:if
					test="#{noticeBoardBackingBean.managedBean.scQt.scQtSupplierCriteria.allState}">
					<h:outputLabel value="#{lbl['lbl.sc.location.level']}" />
					<h:outputText value="#{lbl['lbl.sc.all.states']}" />
					<h:outputLabel value="" />
				</c:if>
			</h:panelGrid>
			<p:spacer height="30px" />

			<h:outputText value="#{lbl['lbl.sc.category.code.list']}"
				style="font-weight:bold;text-align: left;font-size: 14px;" />
			<p:spacer height="30px" />

			<p:dataTable style="width:100%"
				value="#{noticeBoardBackingBean.managedBean.categoryList}"
				var="scQtCategory" id="restrcatcode">
				<ac:paginator for="restrcatcode" />

				<p:column headerText="#{lbl['lbl.sc.category.code']}"
					style="width:10%;white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL1.categoryL1Code}" />
					<h:outputText value="#{scQtCategory.pmCategoryL2.categoryL2Code}" />
					<h:outputText value="#{ scQtCategory.pmCategoryL3.categoryL3Code}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.main.category']}"
					style="width:30%;white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL1.categoryName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sub.category']}"
					style="width:30%;white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL2.categoryName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryName}" />
				</p:column>

			</p:dataTable>
			
			<c:if
				test="#{!noticeBoardBackingBean.managedBean.scQt.zonal}">
				<br/>
				<h:outputText value="#{lbl['lbl.sc.notice.board.locality']}"
					style="font-weight:bold;text-align: left;font-size:14px;" />
				<p:spacer height="10px"></p:spacer>

				<p:dataTable
					value="#{noticeBoardBackingBean.managedBean.locationNodes}"
					var="locTree" style="width:100%">
					<p:column headerText="#{lbl['lbl.sc.location']}">
						<p:tree value="#{locTree}" var="location">
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
							<p:treeNode type="city">
								<h:outputText value="#{location.pmCity.cityName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
				</p:dataTable>

			</c:if>
		</p:panel>

		<c:if
			test="#{!noticeBoardBackingBean.managedBean.scQt.zonal and noticeBoardBackingBean.managedBean.scQt.bsvRequired}">
			<ui:param name="bsvDetails"
				value="#{noticeBoardBackingBean.managedBean.normalBsvBean}" />
			<ui:include src="qtlocationbriefingdtls.xhtml" />
			<ui:include
				src="/xhtml/sc/noticeboard/noticeboardLocationPopUp.xhtml"></ui:include>
		</c:if>
		<c:if
			test="#{noticeBoardBackingBean.managedBean.scQt.zonal}">
			<ui:include src="nbZones.xhtml" />
		</c:if>


		<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
			toggleable="true">
			<p:dataTable var="contactPerson" style="width:100%"
				value="#{noticeBoardBackingBean.managedBean.contactPersons}"
				styleClass="test" rows="20">

				<p:column headerText="#{lbl['lbl.sc.name']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.name}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tel.no']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.phoneNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.fax.no']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.faxNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.email']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.email}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<ui:include src="/xhtml/sc/noticeboard/nbdocumentList.xhtml"></ui:include>

	</ui:define>
</ui:composition>
