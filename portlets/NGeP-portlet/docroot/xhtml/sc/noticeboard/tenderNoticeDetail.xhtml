<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">

		<p:panel>
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.sc.notice.board.backbtn']}" icon="ui-icon-back"
							action="#{noticeBoardBackingBean.backBtn}" style="float:left;" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.qt.qtdetails']}">
			<h:panelGrid columns="2" columnClasses="columnWidth20,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.qt.nb.title']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.so.qtnno']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.notice.board.ministry']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.parentOrgProfile.parentOrgProfile.orgTypeCode.parameterCode}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.notice.board.jabatan']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.parentOrgProfile.orgTypeCode.parameterCode}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.notice.board.ptj']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgTypeCode.parameterCode}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.notice.board.npdate']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.publishDate}">
				<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.notice.board.publish.period']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.publishPeriod}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.notice.board.clsdate']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}">
				<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>
				<h:outputLabel value="#{lbl['lbl.qt.nb.proposalValidity']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.qt.nb.proposalValidityUntil']}"></h:outputLabel>
				<h:outputText ></h:outputText>
				<h:outputLabel value="#{lbl['lbl.sc.spec.evaluation.type']}"></h:outputLabel>
				<h:outputText ></h:outputText>
				<h:outputLabel value="#{lbl['lbl.qt.nb.downloadDoc']}"></h:outputLabel>
				<h:outputText ></h:outputText>
			</h:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.qt.supplierqulificationcriteria']}">
			<h:panelGrid columns="2" columnClasses="columnWidth20,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.qt.nb.supplierStatus']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.multiLocality}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.qt.nb.allStates']}"></h:outputLabel>
				<h:outputText value="#{(noticeBoardBackingBean.managedBean.scQt.allState)?lbl['lbl.ct.dialong.cofirm.yes']:lbl['lbl.ct.dialong.cofirm.no']}"></h:outputText>
				<h:outputLabel value="#{lbl['lbl.qt.nb.minPaidUpCaptial']}"></h:outputLabel>
				<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.paidUpCaptial}"></h:outputText>
			</h:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.qt.nb.categoryCodeList']}">


		</p:panel>
		
		<ui:include src="noticeboardLocationPopUp.xhtml"></ui:include>
		<c:if test="#{!noticeBoardBackingBean.managedBean.scQt.multiLocality}">
			<ui:include src="qtlocationbriefingdtls.xhtml"></ui:include>
		</c:if>
		<c:if test="#{noticeBoardBackingBean.managedBean.scQt.multiLocality}">
			<ui:include src="nbZones.xhtml"></ui:include>
		</c:if>

	</ui:define>
</ui:composition>
