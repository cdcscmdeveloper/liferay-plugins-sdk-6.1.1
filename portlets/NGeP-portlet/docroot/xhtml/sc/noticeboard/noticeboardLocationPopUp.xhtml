<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="#{lbl['lbl.sc.spec.panel.location.details']}"
		widgetVar="popupLoc" modal="true" styleClass="locationdtls"
		dynamic="true">

		<h:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td" columnClasses="columnWidth20">
			<h:outputLabel value="Location" />
			<p:inputText style="font-size:large;" value="#{noticeBoardBackingBean.managedBean.location}"
				readonly="true" />

			<h:outputLabel value="Address" />
			<p:inputTextarea
				value="#{noticeBoardBackingBean.managedBean.address}"
				readonly="true" cols="50" rows="2" />
		</h:panelGrid>


	</p:dialog>
</ui:composition>
