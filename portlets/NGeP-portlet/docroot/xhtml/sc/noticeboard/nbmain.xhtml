<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.qt.nb.searchCriteria']}"
		style="width:350px;" id="nbpanel">

		<div style="height: 550px; overflow-y: scroll;">

			<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
				width="100%" columnClasses="columnWidth20,columnWidth30">
				<h:outputLabel value="Quatation/TenderNo"></h:outputLabel>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.qtNo}"></p:inputText>
				<h:outputLabel value="Title"></h:outputLabel>
				<p:inputTextarea value="#{noticeBoardBackingBean.managedBean.title}"
					size="46" rows="2" cols="20"></p:inputTextarea>
			</h:panelGrid>
			<h:panelGrid columns="3" border="0" cellpadding="0" cellspacing="0"
				width="100%" >
				<h:outputLabel value="CategoryCode"></h:outputLabel>
				<ac:lov id="openPtj" lovId="PM_CATEGORY_L3"
					headerText="Category Lov"
					saveObject="noticeBoardBackingBean.managedBean.categoryL3"
					value="#{noticeBoardBackingBean.managedBean.categoryL3.categoryName}">
				</ac:lov>
				<ac:lovPopup />
			</h:panelGrid>
			<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
				width="100%" columnClasses="columnWidth20,columnWidth30">
				<p:outputLabel value="Ministry"></p:outputLabel>
				<p:selectOneMenu
					value="#{noticeBoardBackingBean.managedBean.ministryProfile.orgProfileId}" style="width:170px;">
					<f:selectItem itemLabel="--SelectOne--" itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{noticeBoardBackingBean.retriveOrgProfilesForMinistryLevel()}"
						var="pmOrgProfile" itemLabel="#{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}"></f:selectItems>
					<p:ajax event="change"
						listener="#{noticeBoardBackingBean.handleMinistryProfileChanged}"
						update="ptjlist" process="@this" partialSubmit="true" />

				</p:selectOneMenu>
				<h:outputLabel value="PTJ"></h:outputLabel>
				<p:selectOneMenu id="ptjlist"
					value="#{noticeBoardBackingBean.managedBean.ptjProfile.orgProfileId}" style="width:170px;">
					<f:selectItem itemLabel="--SelectOne--" itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{noticeBoardBackingBean.managedBean.ptjList}"
						var="pmOrgProfile" itemLabel="#{pmOrgProfile.orgName}"
						itemValue="#{pmOrgProfile.orgProfileId}"></f:selectItems>
				</p:selectOneMenu>

			</h:panelGrid>

			<p:panel header="#{lbl['lbl.sc.notice.board.pdate']}" id="publishdtl"
				toggleable="true">

				<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0"
					width="100%" columnClasses="columnHeight20">
					<h:panelGroup id="publishDates">
						<p:column>

							<p:commandLink update="publishdtl"
								actionListener="#{noticeBoardBackingBean.hideFields('PUBLISHDETAILS','today')}"
								rendered="#{!noticeBoardBackingBean.managedBean.pubYesterday and ! noticeBoardBackingBean.managedBean.showPubDate }"
								process="@this">
								<h:outputText value="#{lbl['lbl.sc.notice.board.today']}"
									style="padding-right:15px;padding-bottom:10px; font-size:12px" />
							</p:commandLink>

							<p:commandLink update="publishdtl"
								actionListener="#{noticeBoardBackingBean.showFields('PUBLISHDETAILS','today')}"
								rendered="#{!noticeBoardBackingBean.managedBean.pubYesterday and noticeBoardBackingBean.managedBean.pubToday}">
								<p:graphicImage library="ep/images/design" name="reset.png"
									value="/resources/ep/images/design/reset.png" />
							</p:commandLink>

						</p:column>
					</h:panelGroup>
					<h:panelGroup id="publishYesterDates">
						<p:column>
							<p:commandLink update="publishdtl"
								actionListener="#{noticeBoardBackingBean.hideFields('PUBLISHDETAILS','null')}"
								rendered="#{!noticeBoardBackingBean.managedBean.pubToday and ! noticeBoardBackingBean.managedBean.showPubDate }">
								<h:outputText value="#{lbl['lbl.sc.notice.board.yesterday']}"
									style="padding-right:15px;padding-bottom:10px;font-size:12px" />
							</p:commandLink>

							<p:commandLink update="publishdtl"
								actionListener="#{noticeBoardBackingBean.showFields('PUBLISHDETAILS','null')}"
								rendered="#{!noticeBoardBackingBean.managedBean.pubToday and noticeBoardBackingBean.managedBean.pubYesterday}">
								<p:graphicImage library="ep/images/design" name="reset.png"
									value="/resources/ep/images/design/reset.png" />
							</p:commandLink>
						</p:column>
					</h:panelGroup>
				</h:panelGrid>

				<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
					width="100%"
					rendered="#{!noticeBoardBackingBean.managedBean.pubShow}">

					<h:outputText value="#{lbl['lbl.sc.notice.board.pass']}"
						style="padding-right:5px;">
					</h:outputText>


					<p:column>

						<p:inputText size="5"
							value="#{noticeBoardBackingBean.managedBean.publishSearchDataBean.passDays}">
							<p:ajax event="blur"
								listener="#{noticeBoardBackingBean.hideAndShowDates('PbDate')}"
								update="pbdate,publishDates,publishYesterDates" process="@this" />
						</p:inputText>

						<h:outputText value="#{lbl['lbl.sc.notice.board.days']}"
							style="padding-left:5px;"></h:outputText>
					</p:column>

					<h:outputText value="#{lbl['lbl.qt.nb.fromtodate']}"></h:outputText>
					<p:column>
						<h:panelGroup id="pbdate">
							<c:if test="#{! noticeBoardBackingBean.managedBean.showPubDate}">
								<p:calendar showOn="button"
									value="#{noticeBoardBackingBean.managedBean.publishSearchDataBean.fromDate}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="10">

								</p:calendar>

								<p:calendar showOn="button"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="10"
									value="#{noticeBoardBackingBean.managedBean.publishSearchDataBean.toDate}">

								</p:calendar>
							</c:if>
							<c:if test="#{noticeBoardBackingBean.managedBean.showPubDate}">
								<p:calendar showOn="button"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="10"
									readonly="true"></p:calendar>

								<p:calendar showOn="button"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="10"
									readonly="true"></p:calendar>
							</c:if>

						</h:panelGroup>
					</p:column>

				</h:panelGrid>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.bsv.attendance.location']}"
				toggleable="true" collapsed="true">
				<p:ajax event="toggle"
					listener="#{noticeBoardBackingBean.retriveLocationByStates}"
					update="locations"></p:ajax>
				<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0">
					<h:panelGroup id="resetBtn" styleClass="resetBtnCLS">
						<p:commandButton value="#{lbl['lbl.reset']}"
							style="float:right;width:25px"
							rendered="#{noticeBoardBackingBean.managedBean.locationSearchBean ne null}"
							icon="ui-icon-reset" update="locations,@(.resetBtnCLS)"
							actionListener="#{noticeBoardBackingBean.clearTreeNode('location')}">
						</p:commandButton>
					</h:panelGroup>
					<p:tree id="locations"
						value="#{noticeBoardBackingBean.managedBean.locationRootNode}"
						var="location" style="border:0;" selectionMode="single"
						dynamic="true"
						selection="#{noticeBoardBackingBean.managedBean.locationSelectedNode}">

						<p:ajax event="expand" update="locations"
							listener="#{noticeBoardBackingBean.onNodeExpand}" />
						<p:ajax event="collapse" update="locations"
							listener="#{noticeBoardBackingBean.onNodeCollapse}" />
						<p:ajax event="select" update="locations,@(.resetBtnCLS)"
							listener="#{noticeBoardBackingBean.onNodeSelect}" />
						<p:ajax event="unselect" update="locations"
							listener="#{noticeBoardBackingBean.onNodeUnselect}" />
						<p:treeNode type="state">
							<h:outputText
								value="#{location.stateCode} - #{location.stateName}" />
							<!--  <p:commandLink
						rendered="#{noticeBoardBackingBean.managedBean.locationSearchBean ne null}"
						style="padding-left:15px;" >
						<f:setPropertyActionListener target="#{noticeBoardBackingBean.managedBean.resetData}" value="test" />
						<p:graphicImage library="ep/images/design" name="reset.png"
							value="/resources/ep/images/design/reset.png" />
					</p:commandLink>  -->
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.districtName}" />
							<!--  <p:commandLink
						rendered="#{noticeBoardBackingBean.managedBean.locationSearchBean ne null}"
						style="padding-left:15px;">
						<f:setPropertyActionListener target="#{noticeBoardBackingBean.managedBean.resetData}" value="#{reset}" />
						<p:graphicImage library="ep/images/design" name="reset.png"
							value="/resources/ep/images/design/reset.png" />
					</p:commandLink> -->
						</p:treeNode>
						<p:treeNode type="city">
							<h:outputText value="#{location.cityCode} - #{location.cityName}" />
							<!-- 	 <p:commandLink
						rendered="#{noticeBoardBackingBean.managedBean.locationSearchBean ne null}"
						style="padding-left:15px;">
						<f:setPropertyActionListener target="#{noticeBoardBackingBean.managedBean.resetData}" value="#{reset}" />
						<p:graphicImage library="ep/images/design" name="reset.png"
							value="/resources/ep/images/design/reset.png" />
					</p:commandLink>  -->
						</p:treeNode>
					</p:tree>
				</h:panelGrid>
			</p:panel>





			<p:panel header="#{lbl['lbl.qt.nb.briefingDate']}" id="briefingdtls"
				toggleable="true">

				<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0"
					width="100%" columnClasses="columnHeight20">
					<p:column>
						<h:panelGroup id="brieftdateDtls">
							<p:commandLink update="briefingdtls"
								actionListener="#{noticeBoardBackingBean.hideFields('BRIEFINGDETAILS','today')}"
								rendered="#{!noticeBoardBackingBean.managedBean.breifYesterday and ! noticeBoardBackingBean.managedBean.showBriDate }">
								<h:outputText value="#{lbl['lbl.sc.notice.board.today']}"
									style="padding-right:15px;padding-bottom:10px;font-size:12px" />
							</p:commandLink>

							<p:commandLink update="briefingdtls"
								actionListener="#{noticeBoardBackingBean.showFields('BRIEFINGDETAILS','today')}"
								rendered="#{!noticeBoardBackingBean.managedBean.breifYesterday and noticeBoardBackingBean.managedBean.breifToday}">
								<p:graphicImage library="ep/images/design" name="reset.png"
									value="/resources/ep/images/design/reset.png" />
							</p:commandLink>
						</h:panelGroup>
					</p:column>

					<p:column>
						<h:panelGroup id="briefydateDtls">
							<p:commandLink update="briefingdtls"
								actionListener="#{noticeBoardBackingBean.hideFields('BRIEFINGDETAILS','null')}"
								rendered="#{!noticeBoardBackingBean.managedBean.breifToday and ! noticeBoardBackingBean.managedBean.showBriDate}">
								<h:outputText value="#{lbl['lbl.sc.notice.board.yesterday']}"
									style="padding-right:15px;padding-bottom:10px;font-size:12px" />
							</p:commandLink>

							<p:commandLink update="briefingdtls"
								actionListener="#{noticeBoardBackingBean.showFields('BRIEFINGDETAILS','null')}"
								rendered="#{!noticeBoardBackingBean.managedBean.breifToday and noticeBoardBackingBean.managedBean.breifYesterday}">
								<p:graphicImage library="ep/images/design" name="reset.png"
									value="/resources/ep/images/design/reset.png" />
							</p:commandLink>
						</h:panelGroup>
					</p:column>
				</h:panelGrid>

				<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
					width="100%"
					rendered="#{!noticeBoardBackingBean.managedBean.breifShow}">
					<h:outputText value="#{lbl['lbl.sc.notice.board.pass']}"
						style="padding-right:5px;">
					</h:outputText>
					<p:column>
						<p:inputText size="5"
							value="#{noticeBoardBackingBean.managedBean.briefSearchDataBean.passDays}">
							<p:ajax event="blur"
								listener="#{noticeBoardBackingBean.hideAndShowDates('Brief')}"
								update="brieftdateDtls,briefydateDtls" process="@this" />
						</p:inputText>
						<h:outputText value="#{lbl['lbl.sc.notice.board.days']}"
							style="padding-left:5px;"></h:outputText>
					</p:column>
				</h:panelGrid>


			</p:panel>

			<p:panel header="#{lbl['lbl.qt.nb.sitevisitdate']}"
				id="sitevisitdtls" toggleable="true">

				<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0"
					width="100%" columnClasses="columnHeight20">

					<p:column>
						<h:panelGroup id="sitevisittDtls">
							<p:commandLink update="sitevisitdtls"
								actionListener="#{noticeBoardBackingBean.hideFields('SITEVISITDETAILS','today')}"
								rendered="#{!noticeBoardBackingBean.managedBean.svYesterday and ! noticeBoardBackingBean.managedBean.showSiteDate}">
								<h:outputText value="#{lbl['lbl.sc.notice.board.today']}"
									style="padding-right:15px;margin-bottom:20px;font-size:12px" />
							</p:commandLink>

							<p:commandLink update="sitevisitdtls"
								actionListener="#{noticeBoardBackingBean.showFields('SITEVISITDETAILS','today')}"
								rendered="#{!noticeBoardBackingBean.managedBean.svYesterday and noticeBoardBackingBean.managedBean.svToday}">
								<p:graphicImage library="ep/images/design" name="reset.png"
									value="/resources/ep/images/design/reset.png" />
							</p:commandLink>
						</h:panelGroup>
					</p:column>


					<p:column>
						<h:panelGroup id="sitevisitydateDtls">
							<p:commandLink update="sitevisitdtls"
								actionListener="#{noticeBoardBackingBean.hideFields('SITEVISITDETAILS','null')}"
								rendered="#{!noticeBoardBackingBean.managedBean.svToday and ! noticeBoardBackingBean.managedBean.showSiteDate}">
								<h:outputText value="#{lbl['lbl.sc.notice.board.yesterday']}"
									style="padding-right:15px;padding-bottom:10px;font-size:12px" />
							</p:commandLink>

							<p:commandLink update="sitevisitdtls"
								actionListener="#{noticeBoardBackingBean.showFields('SITEVISITDETAILS','null')}"
								rendered="#{!noticeBoardBackingBean.managedBean.svToday and noticeBoardBackingBean.managedBean.svYesterday}">
								<p:graphicImage library="ep/images/design" name="reset.png"
									value="/resources/ep/images/design/reset.png" />
							</p:commandLink>
						</h:panelGroup>
					</p:column>

				</h:panelGrid>

				<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
					width="100%"
					rendered="#{!noticeBoardBackingBean.managedBean.svShow}">
					<h:outputText value="#{lbl['lbl.sc.notice.board.pass']}"
						style="padding-right:5px;">
					</h:outputText>
					<p:column>
						<p:inputText size="5"
							value="#{noticeBoardBackingBean.managedBean.siteVisitDataBean.passDays}">
							<p:ajax event="blur"
								listener="#{noticeBoardBackingBean.hideAndShowDates('SiteVisit')}"
								update="sitevisittDtls,sitevisitydateDtls" process="@this" />

						</p:inputText>
						<h:outputText value="#{lbl['lbl.sc.notice.board.days']}"
							style="padding-left:5px;"></h:outputText>
					</p:column>
				</h:panelGrid>



			</p:panel>

			<p:panel header="#{lbl['lbl.so.clsdt']}" toggleable="true">

				<h:panelGrid columns="2" width="100%">
					<h:outputText value="#{lbl['lbl.qt.nb.fromtodate']}"></h:outputText>
					<p:column>
						<p:calendar showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="10"></p:calendar>
						<p:calendar showOn="button"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" size="10"></p:calendar>
					</p:column>
				</h:panelGrid>


			</p:panel>
		</div>

		<h:panelGrid border="0" columns="1" cellpadding="0" cellspacing="0"
			width="100%">
			<p:column>
				<div style="float: right;">
					<p:commandButton value="#{lbl['lbl.search']}" icon="ui-icon-search"
						action="#{noticeBoardBackingBean.searchNoticeBoard}"
						update="@(.test)">
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.reset']}" icon="ui-icon-reset"
						update="nbpanel" process="@this"
						actionListener="#{noticeBoardBackingBean.reset}">
					</p:commandButton>
				</div>
			</p:column>

		</h:panelGrid>

	</p:panel>

</ui:composition>
