
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
	<!-- 	<ac:title value="#{lbl['lbl.sc.notice.board.self.registration']}" /> -->
		<div class="clear"></div>
		<p:messages id="supplierReg" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" />
		<h:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td" >
			<p:row>
				<p:column width="100%" style="text-align:left">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{noticeBoardBackingBean.backBtn}" style="float:left;"
						rendered="#{noticeBoardBackingBean.managedBean.navigateFromNoticeBoard}" />
				</p:column>
				<p:column width="100%" style="text-align:right">
				<h:panelGroup id="registerBtnId">
					<p:commandButton value="#{lbl['lbl.btn.register']}"
						disabled="#{!noticeBoardBackingBean.managedBean.validMofNo}"
						action="#{noticeBoardBackingBean.registerSupplierForBSV}"
						style="float:right;" process="@all" update="@all"
						rendered="#{noticeBoardBackingBean.managedBean.renderRegisterBtn}" />
				</h:panelGroup>
				</p:column>
			</p:row>
		</h:panelGrid>
		
		<h:outputText styleClass="instruction"
		value="#{lbl['lbl.sc.notice.board.regist.msg2']}" escape="false" style="margin-left:12px;" />	
		
		<p:panel  header="#{lbl['lbl.sc.notice.board.supplier.info']}" toggleable="true">
			<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
				width="100%" >
				<p:column>
					<h:outputLabel value="#{lbl['lbl.sc.mof.no']}" />

				</p:column>
				<p:column>
					<p:inputText id="regNumber"
						value="#{noticeBoardBackingBean.managedBean.mofNumber}"
						readonly="true" size="29"></p:inputText>

				</p:column>
				<p:column>
					<h:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
				</p:column>
				<p:column>
					<p:inputText id="companyName"
						value="#{noticeBoardBackingBean.managedBean.companyName}"
						readonly="true" size="29"></p:inputText>
				</p:column>
			</h:panelGrid>
		</p:panel>
		<div class="header-spacing">
		<h:outputLabel value="#{lbl['lbl.sc.bsv.registration.info']}" style="float:left;"/> <br/>
		</div>
		<c:if test="#{!noticeBoardBackingBean.managedBean.scQt.zonal}">
			<ui:param name="bsvDetails"
				value="#{noticeBoardBackingBean.managedBean.normalBsvBean}"></ui:param>
			<ui:include src="/xhtml/sc/noticeboard/bsvregistration/supplierRegistrationDtls.xhtml"></ui:include>
			<ui:include
				src="/xhtml/sc/noticeboard/share/nbLocationPopUp.xhtml"></ui:include>
		</c:if>

		<c:if test="#{noticeBoardBackingBean.managedBean.scQt.zonal}">
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td width="20%" valign="top" class="sidemenutd">
					<p:remoteCommand
							name="bsvZoneTabChangeAction" update="@form" partialSubmit="true"
							process="@this" action="#{noticeBoardBackingBean.bsvZoneTabChangeAction}" />
					<p:tabMenu styleClass="sidemenu"
							activeIndex="#{noticeBoardBackingBean.managedBean.selectedZoneTabIndex}"
							model="#{noticeBoardBackingBean.managedBean.zoneMenuModel}"/></td>
					<td width="80%"><ui:param name="bsvDetails"
							value="#{noticeBoardBackingBean.managedBean.normalBsvBean}" /> <ui:include
							src="/xhtml/sc/noticeboard/bsvregistration/supplierRegistrationDtls.xhtml" /></td>
				</tr>
			</table>
			<ui:include
				src="/xhtml/sc/noticeboard/share/nbLocationPopUp.xhtml" />
		</c:if>



	</ui:define>
</ui:composition>
