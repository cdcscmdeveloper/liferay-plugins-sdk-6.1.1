<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq ParameterConst.recommendTypeItem}">
			<h:panelGrid columns="2" width="100%" border = "0"  columnClasses="columnWidth20">
				<p:outputLabel value="#{lbl['lbl.sc.award.type']}" style="width:130px"></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.awardType}"></h:outputText>
			</h:panelGrid>
			<p:dataTable id="itemizedtbl" var="awardedItem" style="width:100%"
				value="#{noticeBoardBackingBean.managedBean.awardedItems}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index">
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" style="text-align:center; width : 3%" headerText="#{lbl['lbl.sc.no']}" />
						<p:column rowspan="2" style="text-align:center; width : 47%" headerText="#{lbl['lbl.sc.item']}" />
						<p:column rowspan="2" style="text-align:center; width : 25%" headerText="#{lbl['lbl.sc.supplier.name']}" />
						<p:column rowspan="2" style="text-align:center; width : 25%">
							<f:facet name="header" style="white-space:normal;">
								<h:outputText value="#{lbl['lbl.sc.offered.price']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.notice.board.offered.price.tooltip']}"/>
							</f:facet>
						</p:column>
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column>
					<h:outputText style="white-space : normal;" value="#{awardedItem.itemName}" />
				</p:column>
				<p:column>
					<h:outputText style="white-space : normal;" value="#{awardedItem.supplierName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.loaAmount}" style="float:center;">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				 </h:outputText>
				</p:column>

			</p:dataTable>

		</ui:fragment>

	<ui:fragment
		rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq ParameterConst.recommendTypePackage}">

		<h:panelGrid columns="2" width="100%" border="0"
			columnClasses="columnWidth20">
			<p:outputLabel value="#{lbl['lbl.sc.award.type']}"></p:outputLabel>
			<h:outputText value="#{noticeBoardBackingBean.managedBean.awardType}"></h:outputText>
		</h:panelGrid>
		<p:dataTable id="packagedtbl" var="awardedPackaged" style="width:75%"
			value="#{noticeBoardBackingBean.managedBean.scLoaList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="index">
			<p:columnGroup type="header">
				<p:row>
					<p:column rowspan="2" style="text-align:center; width : 4%"
						headerText="#{lbl['lbl.sc.no']}" />
					<p:column rowspan="2" style="text-align:center; width : 48%"
						headerText="#{lbl['lbl.sc.supplier.name']}" />
					<p:column rowspan="2" style="text-align:center; width : 48%">
						<f:facet name="header" style="white-space:normal;">
							<h:outputText value="#{lbl['lbl.sc.offered.price']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.notice.board.offered.price.tooltip']}" />
						</f:facet>
					</p:column>
				</p:row>
			</p:columnGroup>
			<p:column>
				<h:outputText value="#{index+1}" />
			</p:column>
			<p:column>
				<h:outputText style="white-space : normal;"
					value="#{awardedPackaged.scLoiLoa.supplierName}" />
			</p:column>
			<p:column>
				<h:outputText value="#{awardedPackaged.loaAmt}" style="float:center;">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
	</ui:fragment>

</ui:composition>
