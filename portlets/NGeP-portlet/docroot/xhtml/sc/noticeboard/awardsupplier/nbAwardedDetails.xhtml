<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq ParameterConst.recommendTypeItem}">
			<h:panelGrid columns="2" width="100%" border = "0"  columnClasses="columnWidth20">
				<p:outputLabel value="#{lbl['lbl.sc.award.type']}" style="width:130px"></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.awardType}"></h:outputText>
			</h:panelGrid>
			<p:dataTable id="itemizedtbl" var="awardedItem" style="width:100%"
				value="#{noticeBoardBackingBean.managedBean.awardedItems}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index">
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" headerText="#{lbl['lbl.sc.no']}" />
						<p:column rowspan="2" headerText="#{lbl['lbl.sc.item']}" />
						<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
						<p:column colspan="3" style="text-align:center" headerText="#{lbl['lbl.sc.offered.price']}" />
					</p:row>
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.notice.board.by.loa']}" />
						<p:column headerText="#{lbl['lbl.sc.notice.board.by.proposal']}" />
						<p:column headerText="#{lbl['lbl.sc.notice.board.by.bidding']}" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.itemName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.supplierName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.priceByLoa}" style="float:right;">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				 </h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.priceByProposal}" style="float:right;">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.priceByBidding}" style="float:right;">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>

		</ui:fragment>

		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq ParameterConst.recommendTypePackage}">
			
			<h:panelGrid columns="2" width="100%" border="0"  columnClasses="columnWidth20">
				<p:outputLabel value="#{lbl['lbl.sc.award.type']}" ></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.awardType}"></h:outputText>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" style="width:130px"></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.supplierName}"></h:outputText>
			</h:panelGrid>
		</ui:fragment>
	
</ui:composition>
