<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<!-- <ac:title value="Award Supplier" /> -->
		<p:messages id="awardSupplier" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
		
		<div class="clear"></div>

		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				action="#{noticeBoardBackingBean.backBtn}" />
		</div>

		<p:panel id="qtPanelId"  header="#{lbl['lbl.sc.notice.board.pricingheader']}" toggleable="true">
			<h:panelGrid columns="2" width="100%" border = "0" columnClasses="columnWidth20">

				<h:outputLabel value="#{lbl['lbl.sc.ministry']}" styleClass="outputLabel-view-label" ></h:outputLabel>
				
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.ministryName}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.department']}" styleClass="outputLabel-view-label" ></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.jabatan}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.ptj']}" styleClass="outputLabel-view-label" ></h:outputLabel>
				<ui:param name="date" value="#{noticeBoardBackingBean.retriveDatesforOrgProfile(noticeBoardBackingBean.managedBean.scQt.publishDate,noticeBoardBackingBean.managedBean.scQt.createdDate)}"></ui:param>
				<h:outputText
					value="#{noticeBoardBackingBean.retrievePTJByOrgProfileId(noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgProfileId,date)}"
					readonly="true" />


				<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}" styleClass="outputLabel-view-label" ></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.closing.date']}" styleClass="outputLabel-view-label" ></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}"
					readonly="true">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>

				<h:outputLabel value="#{lbl['lbl.sc.notice.board.openingdate']} " styleClass="outputLabel-view-label" />
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.openingDate}"
					readonly="true">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>

				<h:outputLabel value="#{lbl['lbl.sc.title']}" styleClass="outputLabel-view-label" />
				
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}"
					readonly="true" />

			</h:panelGrid>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.notice.board.awarded.list']}"
			toggleable="true" id="awardSuppPanlId">
			<c:if
				test="#{null ne noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId}">
				<c:if test="#{!noticeBoardBackingBean.managedBean.scQt.zonal}">
					<ui:include
						src="/xhtml/sc/noticeboard/awardsupplier/nbAwardedDetails.xhtml"></ui:include>
				</c:if>
				<c:if test="#{noticeBoardBackingBean.managedBean.scQt.zonal}">
					<p:tabView var="zones" dynamic="true" cache="true"
						orientation="left"
						value="#{noticeBoardBackingBean.managedBean.zones}">
						<p:ajax event="tabChange"
							listener="#{noticeBoardBackingBean.awardSupplierTabChange}"></p:ajax>
						<p:tab title="#{zones.zoneName}">

							<ui:include
								src="/xhtml/sc/noticeboard/awardsupplier/nbAwardedDetails.xhtml"></ui:include>

						</p:tab>


					</p:tabView>
				</c:if>
			</c:if>
		</p:panel>
	</ui:define>
</ui:composition>
