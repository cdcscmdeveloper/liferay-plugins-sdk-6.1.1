<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<ac:title value="Price Schedule" />
		<p:panel>
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.sc.notice.board.backbtn']}"
							icon="ui-icon-back" action="#{noticeBoardBackingBean.backBtn}"
							style="float:left;" />
					</p:column>

				</p:row>
			</p:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.qt.nb.pricingheader']}" toggleable="true">
			<h:panelGrid border="0" width="100%" columns="2"
				columnClasses="columnWidth20">

				<h:outputLabel value="#{lbl['lbl.qt.nb.ministry']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.qt.nb.jabatan']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.parentOrgProfile.orgName}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.qt.nb.ptj']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}"
					readonly="true" />


				<h:outputLabel value="#{lbl['lbl.qt.nb.qtNo']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.qt.nb.closingDate']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}"
					readonly="true">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>

				<h:outputLabel value="#{lbl['lbl.qt.nb.openingdate']} " />
				<h:outputText value="" readonly="true" />

				<h:outputLabel value="#{lbl['lbl.qt.nb.title']}">
				</h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}"
					readonly="true" />


			</h:panelGrid>


			<p:panel header="Supplier List" toggleable="true">
				<p:dataTable id="supplierPriceDtls"
					value="#{noticeBoardBackingBean.managedBean.categoryList}"
					var="catCode" rowKey="#{catCode.qtCategoryId}" rowIndexVar="index">
					<ac:paginator for="supplierPriceDtls"></ac:paginator>

					<p:column headerText="#{lbl['lbl.qt.nb.supplierno']}">
						<h:outputText value="" />
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.offeredprice']}">
						<h:outputText value="" />
					</p:column>



				</p:dataTable>

			</p:panel>
		</p:panel>

	</ui:define>
</ui:composition>
