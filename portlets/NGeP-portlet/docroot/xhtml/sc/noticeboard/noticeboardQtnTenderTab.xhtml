<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="Qtn / Tender Notice" toggleable="true">

		<h:panelGrid border="0" cellpadding="0" cellspacing="" width="100%"
			columns="2" columnClasses="columnWidth20,columnWidth80">
          
			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.title']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" readonly="true" size="117"/>
			</p:column>
		</h:panelGrid>

		<h:panelGrid styleClass="noBorders tr,noBorders td" >
			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.qtn.no']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText readonly="true" value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}"/>
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.ministry']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}" readonly="true" />
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.department']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText readonly="true" />
			</p:column>

			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.division']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText readonly="true" />
			</p:column>
			
			<p:column>
				<p:outputLabel value="#{lbl['lbl.sc.notice.board.pv.period']}"></p:outputLabel>
			</p:column>

			<p:column>
				<p:inputText value="#{noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod}"  readonly="true" size="6" />
			</p:column>
			
		</h:panelGrid>

		<p:spacer height="20" />

	<p:panel header="Supplier Qualification Criteria " toggleable="true">
			
	    <p:outputPanel deferred="true">
	      <h3>Category Code List:</h3>
		  <p:dataTable id="catcodelist"
			 value="#{noticeBoardBackingBean.managedBean.categoryList}"
			 var="catCode" rowKey="#{catCode.qtCategoryId}" rowIndexVar="index">
			 <ac:paginator for="catcodelist" />
		
				<p:column headerText="#{lbl['lbl.sc.category.code']}">
					<h:outputText value="#{catCode.qtCategoryId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.mandatory']}">
					<h:outputText value="#{catCode.pmCategoryL1 }" />
				</p:column>
			</p:dataTable>
			
           </p:outputPanel>
           
			<p:spacer height="10" />
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
				columns="2" columnClasses="columnWidth20,columnWidth30">

				<p:column>
					<p:outputLabel value="#{lbl['lbl.sc.notice.board.mlocality']}"></p:outputLabel>
				</p:column>

				<p:column>
					<p:inputText value="#{noticeBoardBackingBean.managedBean.multipleLocality}" readonly="true" />
				</p:column>


				<p:column>
					<p:outputLabel value="#{lbl['lbl.sc.all.states']}"></p:outputLabel>
				</p:column>

				<p:column>
					<p:inputText value="#{noticeBoardBackingBean.managedBean.allStates}" readonly="true" />
				</p:column>

			</h:panelGrid>

			<p:spacer height="20" />


		   <p:outputPanel deferred="true" rendered="#{noticeBoardBackingBean.managedBean.locVisible}">  
			  <h3>Location List:</h3>
			    
			<p:dataTable id="loclist"
			  value="#{noticeBoardBackingBean.managedBean.locationList}"
			  var="locCriteria" rowKey="#{locCriteria.qtLocCriteriaId}" rowIndexVar="index">
			  <ac:paginator for="loclist" />
			
				<p:column headerText="#{lbl['lbl.sc.zone.location']}">
					<p:commandLink onclick="popQtn.show();">
						<h:outputText value="#{locCriteria.scQtZoneCriteria.zoneName}" />
					</p:commandLink>
				</p:column>
			</p:dataTable>

         </p:outputPanel>

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
				columns="2" columnClasses="columnWidth20,columnWidth30">
				<p:column>
					<p:outputLabel value="#{lbl['lbl.sc.notice.board.paidup.capital']}"></p:outputLabel>
				</p:column>

				<p:column>
					<p:inputText value="#{noticeBoardBackingBean.managedBean.scQtCriteria.paidUpCaptial}" readonly="true" />
				</p:column>
			</h:panelGrid>
			
			 			
		</p:panel>

	</p:panel>

</ui:composition>
