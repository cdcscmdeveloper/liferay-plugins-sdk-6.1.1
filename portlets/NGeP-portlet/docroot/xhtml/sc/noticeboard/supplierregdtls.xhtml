
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<ui:fragment rendered="#{bsvDetails.scQtBsv.sameBsv}">

			<p:panel header="#{lbl['lbl.sc.notice.board.briefing.and.sv.dtls']}" toggleable="true">

				<p:dataTable var="brfsitdtl" value="#{bsvDetails.briefingList}"
					style="width:100%" rowKey="#{brfsitdtl.qtBsvDtlId}"
					selectionMode="single"
					selection="#{noticeBoardBackingBean.managedBean.briefingDtls}"
					styleClass="bsvDtls">
					<p:ajax event="rowSelect"
						listener="#{noticeBoardBackingBean.onRowSelect}" process="@this"
						update="@all" partialSubmit="true" />
					<!-- <p:column style="width:2%" selectionMode="multiple" /> -->
					<p:column headerText="#{lbl['lbl.sc.description']}"
						style="width:25%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.date.time']}"
						style="width:23%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							actionListener="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()" update="@(.locationdtls)">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.coordinate.officer']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.max.attendence']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.notice.board.toattend']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.toBeattand}" />
					</p:column>
				</p:dataTable>

			</p:panel>
		</ui:fragment>
		<ui:fragment rendered="#{!bsvDetails.scQtBsv.sameBsv}">

			<p:panel header="#{lbl['lbl.sc.briefing.dtls']}" toggleable="true">

				<p:dataTable var="brfsitdtl" value="#{bsvDetails.briefingList}"
					rowKey="#{brfsitdtl.qtBsvDtlId}" style="width:100%"
					selectionMode="single"
					selection="#{noticeBoardBackingBean.managedBean.briefingDtls}"
					styleClass="bsvDtls">
					<p:ajax event="rowSelect"
						listener="#{noticeBoardBackingBean.onRowSelect}" process="@this"
						update=":form:attendanceDetailstbl :form:attendanceNavInfo"  />
					<!-- <p:column style="width:2%" selectionMode="multiple" /> -->
					<p:column headerText="#{lbl['lbl.sc.description']}"
						style="width:25%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.date.time']}"
						style="width:23%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()" update="@(.locationdtls)">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.coordinate.officer']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.max.attendence']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.notice.board.toattend']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.toBeattand}" />
					</p:column>
				</p:dataTable>

			</p:panel>

			<p:panel header="#{lbl['lbl.sc.site.visit.dtls']}" toggleable="true">

				<p:dataTable var="sitevisitDtls" value="#{bsvDetails.sitevisitList}"
					rowKey="#{sitevisitDtls.qtBsvDtlId}" selectionMode="single"
					selection="#{noticeBoardBackingBean.managedBean.briefingDtls}"
					styleClass="bsvDtls">

					<!-- <p:column style="width:2%" selectionMode="multiple" /> -->
					<p:ajax event="rowSelect"
						listener="#{noticeBoardBackingBean.onRowSelect}" process="@this"
						update=":form:attendanceDetailstbl :form:attendanceNavInfo" />
					<p:column headerText="#{lbl['lbl.sc.description']}"
						style="width:25%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.date.time']}"
						style="width:23%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(sitevisitDtls)}"
							oncomplete="popupLoc.show()" update="@(.locationdtls)">
							<h:outputText value="#{sitevisitDtls.location}" />
						</p:commandLink>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.coordinate.officer']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.max.attendence']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.notice.board.toattend']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.toBeattand}" />
					</p:column>

				</p:dataTable>

			</p:panel>
		</ui:fragment>
			
			<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
				width="100%">
				<p:column>
					<h:outputLabel value="#{lbl['lbl.sc.mof.no']}" />

				</p:column>
				<p:column>
					<p:inputText id="regNumber"
						value="#{noticeBoardBackingBean.managedBean.mofNumber}"
						readonly="true" size="29"></p:inputText>

				</p:column>
				<p:column>
					<h:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
				</p:column>
				<p:column>
					<p:inputText id="companyName"
						value="#{noticeBoardBackingBean.managedBean.companyName}"
						readonly="true" size="29"></p:inputText>
				</p:column>
			</h:panelGrid>
		
		<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0"
			width="100%">
			<p:column>
				<h:outputText id="attendanceNavInfo" 
								value="#{noticeBoardBackingBean.slectedHeaderName}" styleClass="subHeader" style="padding-left: 5px;" escape="flase">
				</h:outputText>

				<h:outputText
					value="#{lbl['lbl.sc.notice.board.supplierregistration']}" styleClass="subHeader" style="padding-left: 5px;">
				</h:outputText>

			</p:column>
		</h:panelGrid>
		<p:spacer height="5px"></p:spacer>

		<p:dataTable id="attendanceDetailstbl" var="bsvAttandance"
				value="#{noticeBoardBackingBean.managedBean.briefingDtls.tempRegistration.bsvAttendance}"
				rows="10">

				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.name']}">

						</p:column>


						<p:column
							headerText="#{lbl['lbl.sc.identification.no']}">

						</p:column>

						<p:column headerText="#{lbl['lbl.sc.contact.no']}">

						</p:column>


						<p:column headerText="#{lbl['lbl.sc.email']}">

						</p:column>

						<p:column headerText="#{lbl['lbl.sc.attendance']}">

						</p:column>
					</p:row>
				</p:columnGroup>

				<p:column style="width:25%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.name}" />
				</p:column>

				<p:column style="width:20%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.icPassPort}" />
				</p:column>
				<p:column style="width:25%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.contactNo}" />
				</p:column>
				<p:column style="width:25%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.email}" />
				</p:column>

				<p:column style="width:5px;text-align:center">
					<p:selectBooleanCheckbox value="#{bsvAttandance.preRegisterd}" disabled="#{noticeBoardBackingBean.isAttandanceEditable(noticeBoardBackingBean.managedBean.briefingDtls)}">
						<p:ajax process="@this"
							listener="#{noticeBoardBackingBean.updateToBeAttandance}"
							update="@form" />
					</p:selectBooleanCheckbox>
				</p:column>


			</p:dataTable>
		

	</p:panel>

</ui:composition>
