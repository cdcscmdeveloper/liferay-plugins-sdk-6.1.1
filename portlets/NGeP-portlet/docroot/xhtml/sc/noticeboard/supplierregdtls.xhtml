
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<ui:fragment rendered="#{bsvDetails.scQtBsv.sameBsv}">

			<p:panel header="Briefing And Site Visit Details" toggleable="true">

				<p:dataTable var="brfsitdtl" value="#{bsvDetails.briefingList}"
					selection="#{bsvDetails.selectedBriefingDtls}" style="width:100%"
					rowKey="#{brfsitdtl}">

					<p:column style="width:2%" selectionMode="multiple" />
					<p:column headerText="#{lbl['lbl.qt.nb.description']}"
						style="width:25%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:23%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							actionListener="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.toattened']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
				</p:dataTable>

			</p:panel>
		</ui:fragment>
		<ui:fragment rendered="#{!bsvDetails.scQtBsv.sameBsv}">

			<p:panel header="#{lbl['lbl.qt.nb.briefDtl']}" toggleable="true">

				<p:dataTable var="brfsitdtl" value="#{bsvDetails.briefingList}"
					selection="#{bsvDetails.selectedBriefingDtls}"
					rowKey="#{brfsitdtl}" rowIndexVar="index" style="width:100%">

					<p:column style="width:2%" selectionMode="multiple" />
					<p:column headerText="#{lbl['lbl.qt.nb.description']}"
						style="width:25%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:23%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()" update="@(.qtCount)">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.toattened']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
				</p:dataTable>

			</p:panel>

			<p:panel header="#{lbl['lbl.qt.nb.siteDtl']}" toggleable="true">

				<p:dataTable var="sitevisitDtls" value="#{bsvDetails.sitevisitList}"
					selection="#{bsvDetails.selectedSiteVisitDtls}"
					rowKey="#{sitevisitDtls}" rowIndexVar="index">

					<p:column style="width:2%" selectionMode="multiple" />

					<p:column headerText="#{lbl['lbl.qt.nb.description']}"
						style="width:25%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:23%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(sitevisitDtls)}"
							oncomplete="popupLoc.show()" update="@(.qtCount)">
							<h:outputText value="#{sitevisitDtls.location}" />
						</p:commandLink>

					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}"
						style="width:20%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.toattened']}"
						style="width:5%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.maxNoOfAttendance}" />
					</p:column>

				</p:dataTable>

			</p:panel>
		</ui:fragment>

		<p:panel header="#{lbl['lbl.qt.nb.supplierregistration']}"
			toggleable="true">

			<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
				width="100%">
				<p:column>
					<h:outputLabel value="#{lbl['lbl.sc.bsv.attendance.mof.regno']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</p:column>
				<p:column>
					<p:selectOneMenu
						value="#{noticeBoardBackingBean.managedBean.mofNumber}"
						style="width:180px;margin-bottom:5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue=""></f:selectItem>
						<f:selectItems
							value="#{noticeBoardBackingBean.managedBean.mofAccounts}"
							var="mofAccount" itemLabel="#{mofAccount.mofNo}"
							itemValue="#{mofAccount.mofNo}">
						</f:selectItems>
						<p:ajax event="change"
							listener="#{noticeBoardBackingBean.mofNoOnchange}"
							update="companyName,attendanceDetailstbl"></p:ajax>
					</p:selectOneMenu>
				</p:column>
				<p:column>
					<h:outputLabel value="#{lbl['lbl.sc.bsv.attendance.supp.name']}" />
				</p:column>
				<p:column>
					<p:inputText id="companyName"
						value="#{noticeBoardBackingBean.managedBean.companyName}"
						readonly="true" size="29"></p:inputText>
				</p:column>
			</h:panelGrid>


			<p:dataTable id="attendanceDetailstbl" var="bsvAttandance"
				value="#{noticeBoardBackingBean.managedBean.attendanceList}"
				rows="10" rowKey="#{bsvAttandance}" rowIndexVar="rowIndex"
				selection="#{noticeBoardBackingBean.managedBean.selectedBsvAttandance}">

				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.bsv.attendance.name']}">

						</p:column>


						<p:column
							headerText="#{lbl['lbl.sc.bsv.attendance.identification.no']}">

						</p:column>

						<p:column headerText="#{lbl['lbl.sc.bsv.attendance.contact.no']}">

						</p:column>


						<p:column headerText="#{lbl['lbl.sc.bsv.attendance.email']}">

						</p:column>

						<p:column headerText="#{lbl['lbl.qt.bsc.attendance']}">

						</p:column>
					</p:row>
				</p:columnGroup>

				<p:column style="width:25%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.name}" />
				</p:column>

				<p:column style="width:20%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.icPassPort}" />
				</p:column>
				<p:column style="width:25%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.contactNo}" />
				</p:column>
				<p:column style="width:25%;white-space: normal;">
					<h:outputText value="#{bsvAttandance.email}" />
				</p:column>

				<p:column selectionMode="multiple"
					style="width:5px;text-align:center" />


			</p:dataTable>
		</p:panel>
	</p:panel>
</ui:composition>
