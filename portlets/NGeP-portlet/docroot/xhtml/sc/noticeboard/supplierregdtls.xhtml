
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
	<ui:param name="bsv" value="#{noticeBoardBackingBean.managedBean.bsv}"></ui:param>
	<c:if test="${bsv.sameBsv}">
			<p:panel header="Briefing And Site Visit Details" toggleable="true">

				<h:outputText
					value="All/At Least #{bsv.minBriefingAttend} Attandence required for Briefing"></h:outputText>
					
				<p:dataTable var="brfsitdtl"
					value="#{noticeBoardBackingBean.managedBean.briefingDtls}"
					selection="#{noticeBoardBackingBean.managedBean.selectedBriefingDtls}"
					rowKey="#{brfsitdtl.qtBsvDtlId}">

					<p:column selectionMode="multiple" style="width:2%" />
					<p:column headerText="#{lbl['lbl.qt.nb.description']}">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:100px;">
						<h:outputText value="#{brfsitdtl.bsvDate}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.location']}"
						style="width:120px;">
						<p:commandLink style="margin-right:20px;"
							actionListener="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}" style="width:120px;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:120px;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.toattened']}"
						style="width:120px;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
				</p:dataTable>

			</p:panel>
		</c:if>
		<c:if test="${!bsv.sameBsv}">

			<p:panel header="#{lbl['lbl.qt.nb.briefDtl']}" toggleable="true">

				<h:outputText
					value="All/At Least #{bsv.minBriefingAttend} Attandence required for Briefing"></h:outputText>
					
				<p:dataTable var="brfsitdtl"
					value="#{noticeBoardBackingBean.managedBean.briefingDtls}"
					selection="#{noticeBoardBackingBean.managedBean.selectedsiteVisitDtls}"
					rowKey="#{brfsitdtl.qtBsvDtlId}">

					<p:column selectionMode="multiple" style="width:2%" />
					<p:column headerText="#{lbl['lbl.qt.nb.description']}">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:100px;">
						<h:outputText value="#{brfsitdtl.bsvDate}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.location']}"
						style="width:120px;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()" update="@(.qtCount)">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}" style="width:120px;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:120px;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.toattened']}"
						style="width:120px;">
						<h:outputText value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
				</p:dataTable>

			</p:panel>

			<p:panel header="#{lbl['lbl.qt.nb.siteDtl']}" toggleable="true">
				<h:outputText
					value="All/At Least #{bsv.minSiteVisitAttend} Attandence required for Briefing"></h:outputText>

				<p:dataTable var="sitevisitDtls"
					value="#{noticeBoardBackingBean.managedBean.siteVisitDtls}"
					selection="#{noticeBoardBackingBean.managedBean.selectedsiteVisitDtls}"
					rowKey="#{sitevisitDtls.qtBsvDtlId}">

					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="#{lbl['lbl.qt.nb.description']}">
						<h:outputText value="#{sitevisitDtls.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:100px;">
						<h:outputText value="#{sitevisitDtls.bsvDate}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.qt.nb.location']}"
						style="width:120px;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(sitevisitDtls)}"
							oncomplete="popupLoc.show()" update="@(.qtCount)">
							<h:outputText value="#{sitevisitDtls.location}" />
						</p:commandLink>

					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}" style="width:120px;">
						<h:outputText value="#{sitevisitDtls.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:120px;">
						<h:outputText value="#{sitevisitDtls.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.toattened']}"
						style="width:120px;">
						<h:outputText value="#{sitevisitDtls.maxNoOfAttendance}" />
					</p:column>

				</p:dataTable>

			</p:panel>
		</c:if>

		<p:panel header="#{lbl['lbl.qt.nb.supplierregistration']}">

			<h:panelGrid columns="2" border="0" cellpadding="0" cellspacing="0"
				width="100%" columnClasses="columnWidth20,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.sc.bsv.attendance.mof.regno']}"/>
				<p:inputText value="" readonly="true"></p:inputText>
				<h:outputLabel value="#{lbl['lbl.sc.bsv.attendance.supp.name']}"/>
				<p:inputText value="" readonly="true"></p:inputText>
			</h:panelGrid>

			<p:dataTable var="sitevisitDtls"
				value="#{noticeBoardBackingBean.managedBean.siteVisitDtls}"
				selection="#{noticeBoardBackingBean.managedBean.selectedsiteVisitDtls}"
				rowKey="#{sitevisitDtls.qtBsvDtlId}" selectionMode="multiple">


				<p:column headerText="#{lbl['lbl.so.bo.name']}">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="#{lbl['lbl.fl.del.ord.contact.no']}">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="#{lbl['lbl.cm.email']}">
					<h:outputText value="" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.toattened']}">
				

				</p:column>



			</p:dataTable>
			
		</p:panel>
	</p:panel>
</ui:composition>
