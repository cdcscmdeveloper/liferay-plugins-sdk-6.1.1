<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<c:if test="#{noticeBoardBackingBean.managedBean.scQt.bsvRequired}">
		<c:if test="#{bsvDetails.scQtBsv.sameBsv}">
			<p:panel header="Briefing And Site Visit Details" toggleable="true">

				<h:panelGroup rendered="#{!bsvDetails.briefingList.isEmpty()}">
					<h:outputText value=" All Attandence required for Briefing"
						rendered="#{bsvDetails.scQtBsv.allBriefingReq}"
						style="font-weight:bold;text-align: left;" />

					<h:outputText
						value=" At Least #{bsvDetails.scQtBsv.minBriefingAttend} Attandence required for Briefing and SiteVisit"
						rendered="#{!bsvDetails.scQtBsv.allBriefingReq}"
						style="font-weight:bold;text-align: left;" />
				</h:panelGroup>


				<p:dataTable var="brfsitdtl" value="#{bsvDetails.briefingList}"
					style="width:100%">
					<ac:paginator for="brfsitdtl"></ac:paginator>
					<p:column headerText="#{lbl['lbl.qt.nb.description']}"
						style="width:30%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:18%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.so.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;;"
							actionListener="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()" update="@(.locationpopup)">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}"
						style="width:18%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:5%;white-space: normal;">
						<h:outputLabel value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.price.inquiry.status']}"
						style="width:9%;white-space: normal;">
						<h:outputText
							value="#{noticeBoardBackingBean.getStatusDescById(brfsitdtl.bsvStatus.statusId)}" />
					</p:column>

				</p:dataTable>

			</p:panel>
		</c:if>
		<c:if test="#{!bsvDetails.scQtBsv.sameBsv}">

			<p:panel header="#{lbl['lbl.qt.nb.briefDtl']}" toggleable="true">
				<h:panelGroup rendered="#{!bsvDetails.briefingList.isEmpty()}">
					<h:outputText value="All Attandence required for Briefing"
						rendered="#{bsvDetails.scQtBsv.allBriefingReq}"
						style="font-weight:bold;text-align: left;" />


					<h:outputText
						value="At Least #{bsvDetails.scQtBsv.minBriefingAttend} Attandence required for Briefing"
						rendered="#{!bsvDetails.scQtBsv.allBriefingReq}"
						style="font-weight:bold;text-align: left;" />

				</h:panelGroup>
				<p:dataTable var="brfsitdtl" value="#{bsvDetails.briefingList}"
					style="width:100%">
					<ac:paginator for="brfsitdtl"></ac:paginator>
					<p:column headerText="#{lbl['lbl.qt.nb.description']}"
						style="width:30%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:18%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.so.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;;"
							action="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
							oncomplete="popupLoc.show()" update="@(.locationdtls)">
							<h:outputText value="#{brfsitdtl.location}" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}"
						style="width:18%;white-space: normal;">
						<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:5%;white-space: normal;">
						<h:outputLabel value="#{brfsitdtl.maxNoOfAttendance}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.price.inquiry.status']}"
						style="width:9%;white-space: normal;">
						<h:outputText
							value="#{noticeBoardBackingBean.getStatusDescById(brfsitdtl.bsvStatus.statusId)}" />
					</p:column>

				</p:dataTable>

			</p:panel>

			<p:panel header="#{lbl['lbl.qt.nb.siteDtl']}" toggleable="true">

				<h:panelGroup rendered="#{!bsvDetails.sitevisitList.isEmpty()}">
					<h:outputText value="* All Attandence required for SiteVisit"
						rendered="#{bsvDetails.scQtBsv.allSiteVisitReq}"
						style="font-weight:bold;text-align: left;" />


					<h:outputText
						value="At Least #{bsvDetails.scQtBsv.minSiteVisitAttend} Attandence required for SiteVisit"
						rendered="#{!bsvDetails.scQtBsv.allSiteVisitReq}"
						style="font-weight:bold;text-align: left;" />

				</h:panelGroup>

				<p:dataTable var="sitevisitDtls" value="#{bsvDetails.sitevisitList}"
					style="width:100%">
					<ac:paginator for="sitevisitDtls"></ac:paginator>
					<p:column headerText="#{lbl['lbl.qt.nb.description']}"
						style="width:30%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.bsvDesc}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
						style="width:18%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.so.location']}"
						style="width:20%;white-space: normal;">
						<p:commandLink style="margin-right:20px;"
							action="#{noticeBoardBackingBean.showLocationDtls(sitevisitDtls)}"
							oncomplete="popupLoc.show()" update="@(.locationdtls)">
							<h:outputText value="#{sitevisitDtls.location}" />
						</p:commandLink>

					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.co']}"
						style="width:18%;white-space: normal;">
						<h:outputText value="#{sitevisitDtls.coordinatingOfficer}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
						style="width:5%;white-space: normal;">
						<h:outputLabel value="#{sitevisitDtls.maxNoOfAttendance}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.price.inquiry.status']}"
						style="width:9%;white-space: normal;">

						<h:outputText
							value="#{noticeBoardBackingBean.getStatusDescById(brfsitdtl.bsvStatus.statusId)}" />
					</p:column>

				</p:dataTable>

			</p:panel>
		</c:if>

	</c:if>
	

</ui:composition>
