<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.qt.nb.location']}">
	
	<p:dataTable
					value="#{noticeBoardBackingBean.managedBean.locationNodes}"
					var="locTree" style="width:65%">
					<p:column headerText="#{lbl['lbl.so.location']}">
						<p:tree value="#{locTree}" var="location">
							<p:treeNode type="state">
								<h:outputText value="#{location.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.districtName}" />
							</p:treeNode>
							<p:treeNode type="city">
								<h:outputText value="#{location.cityName}" />
							</p:treeNode>
						</p:tree>
						</p:column>
						</p:dataTable>
	</p:panel>


	<c:if test="#{noticeBoardBackingBean.managedBean.scQt.sameBsv}">
		<p:panel header="Briefing And Site Visit Details">

			<h:outputText value="All/At Least X Attandence required for Briefing"></h:outputText>
			<p:dataTable  var="brfsitdtl"
				value="#{noticeBoardBackingBean.managedBean.briefingDtls}">

				<p:column headerText="#{lbl['lbl.qt.nb.description']}">
					<h:outputText value="#{brfsitdtl.briefingDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
					style="width:100px;">
					<h:outputText value="#{brfsitdtl.briefingDate}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.qt.nb.location']}"
					style="width:120px;">
					<p:commandLink style="margin-right:20px;" actionListener="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
						 oncomplete="popupLoc.show()" update="@(.locationdtls)">
						<h:outputText value="#{brfsitdtl.location}" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.co']}" style="width:120px;">
					<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
					style="width:120px;">
					<h:outputText value="#{brfsitdtl.maxNoAttendance}" />
				</p:column>

			</p:dataTable>

		</p:panel>
	</c:if>
	<c:if test="#{!noticeBoardBackingBean.managedBean.scQt.sameBsv}">

		<p:panel header="#{lbl['lbl.qt.nb.briefDtl']}">

			<h:outputText value="All/At Least X Attandence required for Briefing"></h:outputText>
			<p:dataTable  var="brfsitdtl"
				value="#{noticeBoardBackingBean.managedBean.briefingDtls}">

				<p:column headerText="#{lbl['lbl.qt.nb.description']}">
					<h:outputText value="#{brfsitdtl.briefingDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
					style="width:100px;">
					<h:outputText value="#{brfsitdtl.briefingDate}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.qt.nb.location']}"
					style="width:120px;">
					<p:commandLink style="margin-right:20px;" action="#{noticeBoardBackingBean.showLocationDtls(brfsitdtl)}"
						 oncomplete="popupLoc.show()" update="@(.locationdtls)">
						<h:outputText value="#{brfsitdtl.location}" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.co']}" style="width:120px;">
					<h:outputText value="#{brfsitdtl.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
					style="width:120px;">
					<h:outputText value="#{brfsitdtl.maxNoAttendance}" />
				</p:column>

			</p:dataTable>

		</p:panel>

		<p:panel header="#{lbl['lbl.qt.nb.siteDtl']}">
			<h:outputText value="All/At Least X Attandence required for Briefing"></h:outputText>
			<p:dataTable  var="sitevisitDtls"
				value="#{noticeBoardBackingBean.managedBean.siteVisitDtls}">

				<p:column headerText="#{lbl['lbl.qt.nb.description']}">
					<h:outputText value="#{sitevisitDtls.briefingDesc}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.dateTime']}"
					style="width:100px;">
					<h:outputText value="#{sitevisitDtls.briefingDate}"/>
				</p:column>

				<p:column headerText="#{lbl['lbl.qt.nb.location']}"
					style="width:120px;">
					<p:commandLink style="margin-right:20px;" action="#{noticeBoardBackingBean.showLocationDtls(sitevisitDtls)}"
						 oncomplete="popupLoc.show()" update="@(.locationdtls)">
						<h:outputText value="#{sitevisitDtls.location}" />
					</p:commandLink>
					
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.co']}" style="width:120px;">
					<h:outputText value="#{sitevisitDtls.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.qt.nb.maxAttened']}"
					style="width:120px;">
					<h:outputText value="#{sitevisitDtls.maxNoAttendance}" />
				</p:column>

			</p:dataTable>

		</p:panel>
	</c:if>

	<p:panel header="#{lbl['lbl.qt.nb.contactPersonDtl']}">

		<p:dataTable var="contactPerson"
			value="#{noticeBoardBackingBean.managedBean.contactPersons}"
			styleClass="test" rows="20">
			
			<p:column headerText="#{lbl['lbl.qt.nb.name']}">
				<h:outputText value="#{contactPerson.name}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.qt.nb.telNo']}" style="width:100px;">
				<h:outputText value="#{contactPerson.phoneNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.qt.nb.faxNo']}" style="width:120px;">
				<h:outputText value="#{contactPerson.faxNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.qt.nb.email']}" style="width:120px;">
				<h:outputText value="#{contactPerson.email}" />
			</p:column>


		</p:dataTable>

	</p:panel>
	

</ui:composition>
