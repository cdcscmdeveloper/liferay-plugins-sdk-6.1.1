<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.qt.nb.awarded.list']}" toggleable="true">
	<p:spacer height="10px"/>
		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq 'I'}">
			<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td"
				border="1" width="20%">
				<p:outputLabel value="#{lbl['lbl.qt.nb.award.type']}"></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.awardType}"></h:outputText>
			</h:panelGrid>
			<p:spacer height="15px" />

			<p:dataTable id="itemizedtbl" var="awardedItem" style="width:100%"
				value="#{noticeBoardBackingBean.managedBean.awardedItems}"
				rowIndexVar="index">
				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="2" headerText="No" />
						<p:column rowspan="2" headerText="#{lbl['lbl.qt.nb.item.name']}" />
						<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.name']}" />
						<p:column colspan="3" style="text-align:center" headerText="#{lbl['lbl.qt.nb.offered.price']}" />
					</p:row>
					<p:row>
						<p:column headerText="By LOA" />
						<p:column headerText="By Proposal" />
						<p:column headerText="By Bidding" />
					</p:row>
				</p:columnGroup>
				<p:column>
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.itemName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.supplierName}" />
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.priceByLoa}" style="text-align:right">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				 </h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.priceByProposal}" style="text-align:right">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column>
					<h:outputText value="#{awardedItem.priceByBidding}" style="text-align:right">
					<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>

		</ui:fragment>

		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq 'P'}">
			<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td"
				cellpadding="5%">
				<p:outputLabel value="#{lbl['lbl.qt.nb.award.type']}"></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.awardType}"></h:outputText>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}"></p:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.supplierName}"></h:outputText>
			</h:panelGrid>
		</ui:fragment>
	</p:panel>
</ui:composition>
