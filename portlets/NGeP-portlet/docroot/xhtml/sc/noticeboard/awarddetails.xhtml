<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Award List" toggleable="true">
		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq 'I'}">
			<p:panelGrid columns="2" 
				styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="Award Type"></p:outputLabel>
				<h:outputText
					value="Itemized"></h:outputText>
				
			</p:panelGrid>
		</ui:fragment>
		<ui:fragment
			rendered="#{noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId.parameterCode eq 'P'}">
			<p:panelGrid columns="2" 
				styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="Award Type"></p:outputLabel>
				<h:outputText
					value="Package"></h:outputText>

				<p:outputLabel value="Supplier Name"></p:outputLabel>
				<h:outputText value=""></h:outputText>
			</p:panelGrid>
		</ui:fragment>
	</p:panel>
</ui:composition>
