<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<ac:title value="Award Supplier" />
		<p:messages id="awardSupplier" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
		
		<div class="clear"></div>

		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				action="#{noticeBoardBackingBean.backBtn}" />
		</div>

		<p:panel header="#{lbl['lbl.sc.notice.board.pricingheader']}" toggleable="true">
			<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td">

				<h:outputLabel value="#{lbl['lbl.sc.ministry']}"></h:outputLabel>
				
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.parentOrgProfile.orgName}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.department']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.parentOrgProfile.orgName}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.ptj']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}"
					readonly="true" />


				<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.closing.date']}"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}"
					readonly="true">
					<f:convertDateTime pattern="dd/MM/yyyy" />
				</h:outputText>

				<h:outputLabel value="#{lbl['lbl.sc.notice.board.openingdate']} " />
				<h:outputText value="" readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.title']}" />
				
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}"
					readonly="true" />

			</h:panelGrid>
			
			<c:if test="#{null ne noticeBoardBackingBean.managedBean.scQt.finalization.recommendedTypeId}">
				<ui:include src="/xhtml/sc/noticeboard/awarddetails.xhtml"></ui:include>
			</c:if>
			<c:if test="#{noticeBoardBackingBean.managedBean.scQt.zonal}">
				<p:tabView var="zones" dynamic="true" cache="true"
					orientation="left"
					value="#{noticeBoardBackingBean.managedBean.zones}">
					<p:ajax event="tabChange"
						listener="#{noticeBoardBackingBean.offeredPriceTabChange}"></p:ajax>
					<p:tab title="#{zones.zoneName}">
					
						<ui:include src="/xhtml/sc/noticeboard/awarddetails.xhtml"></ui:include>

					</p:tab>


				</p:tabView>
			</c:if>
		</p:panel>

	</ui:define>
</ui:composition>
