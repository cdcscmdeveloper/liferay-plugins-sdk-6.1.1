<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:messages id="supplierQualification" showDetail="true"
		showSummary="false" autoUpdate="true" closable="true" />
	<p:blockUI block=":form" trigger="nbCheckSupplierQualification"
		widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<div align="left" class="header-info header-spacing">
		<table style="width: 100%">
			<tr>
				<td style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td style="width: 40%" class="header-info-text"><h:outputText
						value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}">
					</h:outputText></td>
				<td style="width: 6%"><h:outputLabel
						value="#{lbl['lbl.sc.title']}" /></td>
				<td style="width: 44%" class="header-info-text"><h:outputText
						value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" /></td>
			</tr>
		</table>
	</div>
	<p:panel 
		header="#{noticeBoardBackingBean.managedBean.navigateFromNoticeBoard ? lbl['lbl.sc.notice.board.check.supplier.qualification'] : ''}">
		<div class="clear"></div>
		<table style="margin: 0 auto;">

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.mof.no']}" ></h:outputLabel>
				</td>
				<td><p:inputText value="#{noticeBoardBackingBean.managedBean.mofNo}" 
							readonly="#{noticeBoardBackingBean.managedBean.supplierMofNo ne null?'true':'false'}"></p:inputText></td>
				<td><p:commandButton value="#{lbl['lbl.btn.check']}"
						id="nbCheckSupplierQualification"
						action="#{noticeBoardBackingBean.checkSupplierQulificationStatus}"
						update="@form,table-wrapper" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();">
					</p:commandButton></td>
			</tr>
		</table>

	</p:panel>

	<h:panelGroup id="table-wrapper"
		rendered="#{noticeBoardBackingBean.visible}">
		<p:panel id="qualificationCriteria"
			header="#{lbl['lbl.sc.supplier.qulification.criteria']}"
			style="margin-bottom:5px;" toggleable="true">
			<p:dataTable id="supplierQulification"
				value="#{noticeBoardBackingBean.managedBean.qualificationBean}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="qulificationBean" styleClass="test" tyle="width:70%;">

				<p:column headerText="#{lbl['lbl.sc.notice.board.criteria']}" style="width:30%;">
					<ui:param name="criteriaLbL" value="lbl.sc.notice.board.criteria.#{qulificationBean.criteria}" />
					<h:outputText value="#{lbl[criteriaLbL]}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.notice.board.requirement']}" style="width:50%;">
					<h:outputText
						value="#{fn:replace(qulificationBean.qtRequirement,':','&lt;/br&gt;')}"
						escape="false"
						rendered="#{!qulificationBean.qtRequirementLabel}" />
						
					<ui:param name="requirementLbL" value="lbl.sc.notice.board.requirement.#{qulificationBean.qtRequirement}" />
					<h:outputText
						value="#{lbl[requirementLbL]}"
						rendered="#{qulificationBean.qtRequirementLabel}" />
				</p:column>
				
				
				<p:column headerText="#{lbl['lbl.sc.notice.board.qualification.status']}" style="width:20%;">
				<ui:fragment rendered="#{qulificationBean.categoryCodeStatus eq null}">
					<p:graphicImage 
						value="#{CommonUIConstant.imagePathUptoDesign}/tick.png"
						rendered="#{qulificationBean.supplierStatus}"></p:graphicImage>

					<p:graphicImage 
						value="#{CommonUIConstant.imagePathUptoDesign}/cancel.png"
						rendered="#{!qulificationBean.supplierStatus}"></p:graphicImage>
				</ui:fragment>
					<ui:repeat var="status" value="#{qulificationBean.categoryCodeStatus}">
					<ui:fragment rendered="#{status ne 'optional'}">
						<p:graphicImage 
							value="#{CommonUIConstant.imagePathUptoDesign}/tick.png"
							rendered="#{status}"></p:graphicImage>

						<p:graphicImage 
							value="#{CommonUIConstant.imagePathUptoDesign}/cancel.png"
							rendered="#{!status}"></p:graphicImage>
					</ui:fragment>
						<br/>
					</ui:repeat>

				</p:column>

			</p:dataTable>

			<p:spacer height="20px"></p:spacer>
			<div style="text-align: center;" title="#{lbl['lbl.sc.notice.board.supplier.criteria.tooltip']}">
				<h:outputText value="#{lbl['lbl.sc.notice.board.supplier.criteria.checking.date']} "
					style="font-size:18px;" />
					
				<h:outputText value="#{DateUtils.getCurrentDate()}"
					style="font-size:18px;">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME_WITH_SECONDS)}" />
				</h:outputText>
					
				<h:outputText value=", #{lbl['lbl.sc.notice.board.supplier.criteria.qualified']}"
					style="font-size:18px;" escape="false"
					rendered="#{noticeBoardBackingBean.managedBean.qualified}"></h:outputText>

				<h:outputText value=", #{lbl['lbl.sc.notice.board.supplier.criteria.disqualified']}"
					style="font-size:18px;" escape="false"
					rendered="#{!noticeBoardBackingBean.managedBean.qualified}"></h:outputText>
			</div>
			<p:spacer height="10px"/>
			<div style="text-align: center;">
			<h:outputLink value="#{noticeBoardBackingBean.managedBean.proposalURL}" 
			      rendered="#{noticeBoardBackingBean.managedBean.proposalURL ne null}">
				    <h:outputText value="#{lbl['lbl.sc.notice.board.proposal.url.name']}" 
				    style="font-size:14px;">	</h:outputText>			
			</h:outputLink>
			</div>
		</p:panel>
	</h:panelGroup>



</ui:composition>
