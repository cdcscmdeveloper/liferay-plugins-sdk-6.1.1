<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	
			<ac:title value="#{lbl['lbl.sc.notice.board.self.registration']}" />
		<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.sc.notice.board.backbtn']}" icon="ui-icon-back"
							action="#{noticeBoardBackingBean.backBtn}" style="float:left;" />
					</p:column>
					<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.qt.nb.register']}"
				style="float:right;" />
				</p:column>

				</p:row>
				
			</p:panelGrid>
			
			<c:if test="${!noticeBoardBackingBean.managedBean.scQt.zonal}">
			<ui:include src="/xhtml/sc/noticeboard/supplierregdtls.xhtml"></ui:include>
			<ui:include src="/xhtml/sc/noticeboard/noticeboardLocationPopUp.xhtml"></ui:include>
			</c:if>
			
			<c:if test="${noticeBoardBackingBean.managedBean.scQt.zonal}">
			<ui:include src="/xhtml/sc/noticeboard/nbsupplierregbyzone.xhtml"></ui:include>
			<ui:include src="/xhtml/sc/noticeboard/noticeboardLocationPopUp.xhtml"></ui:include>
			</c:if>
		</ui:define>
		</ui:composition>
