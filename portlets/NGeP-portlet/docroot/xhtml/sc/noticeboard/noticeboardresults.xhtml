<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:include
		src="/xhtml/sc/noticeboard/noticeboardPriceSchedulePopUp.xhtml"></ui:include>
	<p:tabView var="noticeboardresulttype" orientation="top"
		value="#{noticeBoardBackingBean.retrieveParameterDescByType('NBT')}"
		dynamic="true" cache="true">
		<p:ajax event="tabChange"
			listener="#{noticeBoardBackingBean.onTabChange}" update="@(.test)" />
		<p:tab id="nbresultTabs" title="#{noticeboardresulttype.codeName}">

			<ui:include src="/xhtml/sc/noticeboard/resultdetails.xhtml"/>
		</p:tab>
	</p:tabView>


</ui:composition>
