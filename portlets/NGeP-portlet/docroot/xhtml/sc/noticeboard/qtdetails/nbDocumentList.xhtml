<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.document.list']}" toggleable="true">
			<p:dataTable var="document" id="doctbl"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{noticeBoardBackingBean.managedBean.scQtDocReports}"
				styleClass="documentslist" rows="10">
				<ac:paginator for="doctbl" />

				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}">
					<h:outputText value="#{document.title}"
						rendered="#{document.brandNew eq false}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%;text-align:center;">
					<p:commandButton id="download" icon="ui-icon-download"
						style="background-color:transparent !important; border:0px none;"
						ajax="false"
						action="#{noticeBoardBackingBean.downloadReport(document)}" />
				</p:column>
			</p:dataTable>
			<div align="right">
				<p:commandButton ajax="false" value="#{lbl['lbl.btn.download.all']}" styleClass="BtnSpacing"
					rendered="#{noticeBoardBackingBean.managedBean.scQtDocReports ne null and noticeBoardBackingBean.managedBean.scQtDocReports.size()>0}"
					action="#{noticeBoardBackingBean.downloadAllQTDocuments()}" />
			</div>
		</p:panel>


</ui:composition>
