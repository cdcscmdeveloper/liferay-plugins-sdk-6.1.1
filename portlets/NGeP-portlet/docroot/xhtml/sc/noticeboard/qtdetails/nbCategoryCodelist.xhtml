<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:outputText value="#{lbl['lbl.sc.category.code.list']}"
		style="font-weight:bold;text-align: left;font-size: 14px;" />
	<p:spacer height="30px" />

			<p:dataTable style="width:100%"
				value="#{noticeBoardBackingBean.categoryCodesDataModel}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="scQtCategory" id="restrcatcode" lazy="true" rows="5">
				 <ac:paginator for="restrcatcode" />

				<p:column headerText="#{lbl['lbl.sc.category.code']}"
					style="width:10%;white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL1.categoryL1Code}" />
					<h:outputText value="#{scQtCategory.pmCategoryL2.categoryL2Code}" />
					<h:outputText value="#{ scQtCategory.pmCategoryL3.categoryL3Code}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.main.category']}"
					style="width:30%;white-space: normal;">
					<!-- #29732 - fix Reopen -->	
					<h:outputText value="#{scQtCategory.pmCategoryL1.categoryName}" />
					<!-- #29732 Start -->
					<p:spacer width="5" /> 
					<p:commandLink actionListener="#{noticeBoardBackingBean.onClickHistoryIcon(scQtCategory.pmCategoryL1.categoryL1Code,ParameterConst.categoryL1Code,scQtCategory.pmCategoryL1.categoryL1Id,cateGory.qtCategoryId)}"
						update="@form">
						<p:graphicImage id="mainHisIcon"
							value="/css/images/design/ico-view.png" />
						<p:tooltip for="mainHisIcon">
							<p:outputLabel escape="false"
								value="#{lbl['lbl.sc.main.category.icon.tooltip']}" />
						</p:tooltip>
					</p:commandLink>
					<p:outputPanel rendered="#{(noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusChanges) and
										(scQtCategory.pmCategoryL1.changedDate ne scQtCategory.pmCategoryL1.createdDate)}"
						style="color: red;font-weight:bold">
						<h:outputText
							value="&#60;br/&#62;&#40;#{lbl['lbl.sc.category.history.updated.on']}&#160;"
							escape="false" />
						<!-- #29732 - fix Reopen -->	
						<h:outputText value="#{noticeBoardBackingBean.toDate(scQtCategory.pmCategoryL1.changedDate)}&#41;">
						</h:outputText>
					</p:outputPanel>
					<!-- #29732 End -->
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sub.category']}"
					style="width:30%;white-space: normal;">
					<!-- #29732 - fix Reopen -->	
					<h:outputText value="#{scQtCategory.pmCategoryL2.categoryName}" />
					<!-- #29732 Start -->
					<p:spacer width="5" /> 
					<p:commandLink actionListener="#{noticeBoardBackingBean.onClickHistoryIcon(scQtCategory.pmCategoryL2.categoryL2Code,ParameterConst.categoryL2Code,scQtCategory.pmCategoryL2.categoryL2Id,cateGory.qtCategoryId)}"
						update="@form">
						<p:graphicImage id="subHisIcon"
							value="/css/images/design/ico-view.png" />
						<p:tooltip for="subHisIcon">
							<p:outputLabel escape="false"
								value="#{lbl['lbl.sc.sub.category.icon.tooltip']}" />
						</p:tooltip>
					</p:commandLink>
					<p:outputPanel rendered="#{(noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusChanges) and
										(scQtCategory.pmCategoryL2.changedDate ne scQtCategory.pmCategoryL2.createdDate)}"
						style="color: red;font-weight:bold">
						<h:outputText
							value="&#60;br/&#62;&#40;#{lbl['lbl.sc.category.history.updated.on']}&#160;"
							escape="false" />
						<!-- #29732 - fix Reopen -->	
						<h:outputText value="#{noticeBoardBackingBean.toDate(scQtCategory.pmCategoryL2.changedDate)}&#41;">
						</h:outputText>
					</p:outputPanel>
					<!-- #29732 End -->
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
					style="width:25%;white-space: normal;">
					<!-- #29732 - fix Reopen -->	
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryName}" />
					<!-- #29732 Start -->
					<p:spacer width="5" />
					<p:commandLink actionListener="#{noticeBoardBackingBean.onClickHistoryIcon(scQtCategory.pmCategoryL3.categoryL3Code,ParameterConst.categoryL3Code,scQtCategory.pmCategoryL3.categoryL3Id,cateGory.qtCategoryId)}"
						update="@form">
						<p:graphicImage id="subDivHisIcon"
							value="/css/images/design/ico-view.png" />
						<p:tooltip for="subDivHisIcon">
							<p:outputLabel escape="false"
								value="#{lbl['lbl.sc.sub.category.division.icon.tooltip']}" />
						</p:tooltip>
					</p:commandLink>
					<p:outputPanel rendered="#{(noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusChanges) and
										(scQtCategory.pmCategoryL3.changedDate ne scQtCategory.pmCategoryL3.createdDate)}"
						style="color: red;font-weight:bold">
						<h:outputText
							value="&#60;br/&#62;&#40;#{lbl['lbl.sc.category.history.updated.on']}&#160;"
							escape="false" />
						<!-- #29732 - fix Reopen -->	
						<h:outputText value="#{noticeBoardBackingBean.toDate(scQtCategory.pmCategoryL3.changedDate)}&#41;">
						</h:outputText>
					</p:outputPanel>
					<!-- #29732 End -->
				</p:column>

			</p:dataTable>
			<!-- #29732 Start -->
			<ac:qtCategoryHistoryPopup
				catCode="#{noticeBoardBackingBean.managedBean.hisCatCode}"
				historyList="#{noticeBoardBackingBean.managedBean.historyList}"
				widget="hisPopup" />
	<!-- #29732 End -->
			
			
			
	
</ui:composition>
