<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
<c:if test="#{bsvDetails.sampleAddress ne null}">
	<p:panel header="#{lbl['lbl.sc.qt.sample.submission']}"
		toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 82px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.address.one']}" /> </td>
				<td>
					<table>
						<tr>
							<td><p:inputText id="sampleaddress1" required="true"
									label="#{lbl['lbl.sc.qt.address.one']}" readonly="true"
									value="#{bsvDetails.sampleAddress.scAddress.address1}"
									style="margin-top:5px;" size="30" maxlength="255" /></td>
							<td></td>
						</tr>
					</table>
				</td>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.state']}" /> </td>
				<td>
					<table>
						<tr>
							<td><p:inputText id="samplestate" required="true"
									readonly="true"
									value="#{bsvDetails.sampleAddress.scAddress.pmState.stateName}"
									style="margin-top:5px;" size="30" maxlength="255" /></td>
							<td></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.two']}" /></td>
				<td><p:inputText readonly="true"
						value="#{bsvDetails.sampleAddress.scAddress.address2}" size="30"
						maxlength="255" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.division']}" /></td>
				<td>
					<table>
						<tr>
							<td><p:inputText id="sampledivision" readonly="true"
									value="#{bsvDetails.sampleAddress.scAddress.pmDivision.divisionName}"
									style="margin-top:5px;" size="30" maxlength="255" /></td>
							<td></td>
						</tr>
					</table>

				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.three']}" /></td>
				<td><p:inputText readonly="true"
						value="#{bsvDetails.sampleAddress.scAddress.address3}" size="30"
						maxlength="255" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.district']}" /> </td>
				<td>
					<table>
						<tr>
							<td><p:inputText id="sampledistrict" readonly="true"
									value="#{bsvDetails.sampleAddress.scAddress.pmDistrict.districtName}"
									style="margin-top:5px;" size="30" maxlength="255" /></td>
							<td></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.post.code']}" /> </td>
				<td>
					<table>
						<tr>
							<td><p:inputText id="samplepost1" required="true"
									readonly="true" label="#{lbl['lbl.sc.post.code']}"
									value="#{bsvDetails.sampleAddress.scAddress.postcode}" size="30"
									maxlength="10" /></td>
							<td></td>
						</tr>
					</table>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sc.town']}" /> </td>
				<td>
					<table>
						<tr>
							<td><p:inputText id="sampletown" readonly="true"
									value="#{bsvDetails.sampleAddress.scAddress.pmCity.cityName}"
									style="margin-top:5px;" size="30" maxlength="255" /></td>
							<td></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>
	</c:if>
</ui:composition>
