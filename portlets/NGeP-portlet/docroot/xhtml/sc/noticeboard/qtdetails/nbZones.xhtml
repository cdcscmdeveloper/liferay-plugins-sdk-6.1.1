<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:spacer height="10px" />
	<div align="left" style="padding-left:10px;">
		<h:outputText value="#{lbl['lbl.sc.zone.name']}"
			style="font-weight:bold;text-align: left;font-size: 14px;font-family: arial;" />
	</div>
	
	<p:tabView var="zones" dynamic="true" orientation="left"
		value="#{noticeBoardBackingBean.managedBean.zoneBean}">
		<p:ajax event="tabChange" listener="#{noticeBoardBackingBean.bsvZoneTabChange}"
			></p:ajax>
		<p:tab title="#{zones.tplSpecZoneDtl.zoneName}">
		<p:spacer height="10px"></p:spacer>
			<div align="right">
				<p:commandLink style="margin-right:10px;"
					oncomplete="popupZonedtl.show()" update="zonedtls">
					<h:outputText value="#{lbl['lbl.sc.notice.board.view.zone.details']}" />
				</p:commandLink>
			</div>
			<ui:param name="bsvDetails" value="#{noticeBoardBackingBean.managedBean.normalBsvBean}"></ui:param>
			<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbBSVDetails.xhtml"></ui:include>
			<ui:include
				src="/xhtml/sc/noticeboard/share/nbLocationPopUp.xhtml"></ui:include>
				<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbSampleAddress.xhtml"></ui:include>
		</p:tab>


	</p:tabView>


</ui:composition>
