<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width:100%" class="header-spacing">
		<tr>
			<td style="padding-left:5px;"><h:outputText value="#{lbl['lbl.sc.zone.name']}"
					style="font-weight:bold;text-align: left;font-size: 14px;font-family: arial;" />
			</td>
			<td style="text-align: right;"><p:commandLink style="margin-right:10px;"
					oncomplete="popupZonedtl.show()" update="zonedtls">
					<h:outputText
						value="#{lbl['lbl.sc.notice.board.view.zone.details']}" />
				</p:commandLink></td>
		</tr>
	</table>
	<p:tabView var="zones" dynamic="true" orientation="left"
		value="#{noticeBoardBackingBean.managedBean.zoneBean}">
		<p:ajax event="tabChange" listener="#{noticeBoardBackingBean.bsvZoneTabChange}"
			></p:ajax>
		<p:tab title="#{zones.tplSpecZoneDtl.zoneName}">
			<ui:param name="bsvDetails" value="#{noticeBoardBackingBean.managedBean.normalBsvBean}"></ui:param>
			<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbBSVDetails.xhtml"></ui:include>
			<ui:include
				src="/xhtml/sc/noticeboard/share/nbLocationPopUp.xhtml"></ui:include>
				<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbSampleAddress.xhtml"></ui:include>
		</p:tab>


	</p:tabView>

<p:dialog header="#{lbl['lbl.sc.zone.details']}"
		widgetVar="popupZonedtl" modal="true" id="zonedtls"
		dynamic="true" closeOnEscape="true">
		<h:panelGrid border="0" width="100%" columns="3"
				columnClasses="columnWidth20,columnWidth50,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.sc.zone']}" />
				<h:outputText style="white-space: normal;word-wrap: break-word;"
					value="#{zones.tplSpecZoneDtl.zoneName}" />
				<h:outputLabel value="" />
		</h:panelGrid>
			<p:dataTable
				value="#{noticeBoardBackingBean.managedBean.locationNodes}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="locTree" style="width:100%">
				<p:column headerText="#{lbl['lbl.sc.location']}">
					<p:tree value="#{locTree}" var="location">
						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
						<p:treeNode type="city">
							<h:outputText value="#{location.pmCity.cityName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
			</p:dataTable>
		<p:spacer height="7px"></p:spacer>
	</p:dialog>

</ui:composition>
