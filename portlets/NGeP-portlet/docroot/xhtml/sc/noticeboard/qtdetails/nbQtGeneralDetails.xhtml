<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="sampleClsDate"
		value="#{noticeBoardBackingBean.managedBean.scQt.sampleClosingDate}"></ui:param>
	<p:panel
		header="#{lbl[noticeBoardBackingBean.managedBean.scQt.procurementMode == ParameterConst.procurementModeQuotation ? 'lbl.sc.notice.board.quotation.details' : 'lbl.sc.notice.board.tender.details']}"
		toggleable="true">

		<h:panelGrid border="0" width="100%" columns="4" id="changedTabQTDtls"
			columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth40"
			rendered="#{isChangesTab}">
		   
			<h:outputLabel value="#{lbl['lbl.sc.title']}" styleClass="outputLabel-view-label"/>
			<h:outputText style="white-space: normal;word-wrap: break-word;"
				value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" />
			<ui:param name="qtTitleChangeDate" value="#{noticeBoardBackingBean.managedBean.amendmentDateMap[QTFieldConst.FILED_QT_TITLE]}" />
			<c:choose>
				<c:when test="#{!empty qtTitleChangeDate}">
					<h:panelGroup>
						<h:outputText value="(#{lbl['lbl.sc.updated.on']} " styleClass="lastUpdated" />
						<h:outputText value="#{qtTitleChangeDate}" styleClass="lastUpdated">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText>
						<h:outputText value=")" styleClass="lastUpdated" />
					</h:panelGroup>
				</c:when>
				<c:otherwise>
					<h:outputLabel value="" />
				</c:otherwise>
			</c:choose>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}" styleClass="outputLabel-view-label"/>
			<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}" />
			<h:outputLabel value="" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.ministry']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.ministryName}" />
			<h:outputLabel value="" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.ptj']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}" />
			<h:outputLabel value="" />
			<h:outputLabel value="" />
			<h:outputLabel value="#{lbl['lbl.sc.publish.date']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.publishDate}">
				<f:convertDateTime
					pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
			</h:outputText>
			<h:outputLabel value="" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.qt.publishing.period']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.publishPeriod}" />
			<ui:param name="publishPeriodChangeDate" value="#{noticeBoardBackingBean.managedBean.amendmentDateMap[QTFieldConst.FILED_QT_PUBLISH_PERIOD]}" />
			<c:choose>
				<c:when test="#{!empty publishPeriodChangeDate}">
					<h:panelGroup>
						<h:outputText value="(#{lbl['lbl.sc.updated.on']} " styleClass="lastUpdated" />
						<h:outputText value="#{publishPeriodChangeDate}" styleClass="lastUpdated">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText>
						<h:outputText value=")" styleClass="lastUpdated" />
					</h:panelGroup>
				</c:when>
				<c:otherwise>
					<h:outputLabel value="" />
				</c:otherwise>
			</c:choose>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.closing.date']}"  styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}">
				<f:convertDateTime
					pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
			</h:outputText>
			<c:choose>
				<c:when test="#{!empty publishPeriodChangeDate}">
					<h:panelGroup>
						<h:outputText value="(#{lbl['lbl.sc.updated.on']} " styleClass="lastUpdated" />
						<h:outputText value="#{publishPeriodChangeDate}" styleClass="lastUpdated">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText>
						<h:outputText value=")" styleClass="lastUpdated" />
					</h:panelGroup>
				</c:when>
				<c:otherwise>
					<h:outputLabel value="" />
				</c:otherwise>
			</c:choose>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.sample.closingdate']}"
				rendered="#{sampleClsDate ne null}" styleClass="outputLabel-view-label"/>
			<h:outputText value="#{sampleClsDate}"
				rendered="#{sampleClsDate ne null}">
				<f:convertDateTime
					pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
			</h:outputText>
			<h:outputLabel value="" rendered="#{sampleClsDate ne null}" />
			<h:outputLabel value="" rendered="#{sampleClsDate ne null}" />

			<h:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod}" />
			<ui:param name="validityPeriodChangeDate" value="#{noticeBoardBackingBean.managedBean.amendmentDateMap[QTFieldConst.FILED_QT_VALIDITY_PERIOD]}" />
			<c:choose>
				<c:when test="#{!empty validityPeriodChangeDate}">
					<h:panelGroup>
						<h:outputText value="(#{lbl['lbl.sc.updated.on']} " styleClass="lastUpdated" />
						<h:outputText value="#{validityPeriodChangeDate}" styleClass="lastUpdated">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText>
						<h:outputText value=")" styleClass="lastUpdated" />
					</h:panelGroup>
				</c:when>
				<c:otherwise>
					<h:outputLabel value="" />
				</c:otherwise>
			</c:choose>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.proposal.validity.until']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.proposalValidityEndDate}">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			</h:outputText>
			<c:choose>
				<c:when test="#{!empty validityPeriodChangeDate}">
					<h:panelGroup>
						<h:outputText value="(#{lbl['lbl.sc.updated.on']} " styleClass="lastUpdated" />
						<h:outputText value="#{validityPeriodChangeDate}" styleClass="lastUpdated">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText>
						<h:outputText value=")" styleClass="lastUpdated" />
					</h:panelGroup>
				</c:when>
				<c:otherwise>
					<h:outputLabel value="" />
				</c:otherwise>
			</c:choose>
			<h:outputLabel value="" />
			
			<h:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" styleClass="outputLabel-view-label" />
			<h:outputText
				value="#{noticeBoardBackingBean.getParameterDesc(noticeBoardBackingBean.managedBean.scQt.procurementMode)}">
			</h:outputText>
			<h:outputLabel value="" />
			<h:outputLabel value="" />
			
			<h:outputLabel value="#{lbl['lbl.sc.evaluation.type']}" styleClass="outputLabel-view-label"/>
			<h:outputText value="#{lbl['lbl.sc.notice.board.eval.one.tier']}"
				rendered="#{noticeBoardBackingBean.managedBean.scQt.evaluationType eq '1'}" />
			<h:outputText value="#{lbl['lbl.sc.notice.board.eval.two.tier']}"
				rendered="#{noticeBoardBackingBean.managedBean.scQt.evaluationType eq '2'}" />
			<h:outputLabel value="" />
		</h:panelGrid>

		<h:panelGrid border="0" width="100%" columns="3" id="publishTabQTDtls"
			columnClasses="columnWidth20,columnWidth100,columnWidth30"
			rendered="#{!isChangesTab}">
			<h:outputLabel value="#{lbl['lbl.sc.title']}" styleClass="outputLabel-view-label"/>
			<h:outputText style="white-space: normal;word-wrap: break-word;"
				value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}" styleClass="outputLabel-view-label"/>
			<h:outputText value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.ministry']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.ministryName}" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.ptj']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}" />
			<h:outputLabel value="" />
			
			<h:outputLabel value="#{lbl['lbl.sc.publish.date']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.publishDate}">
				<f:convertDateTime
					pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
			</h:outputText>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.qt.publishing.period']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.publishPeriod}" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.closing.date']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}">
				<f:convertDateTime
					pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
			</h:outputText>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.sample.closingdate']}"
				rendered="#{sampleClsDate ne null}" styleClass="outputLabel-view-label"/>
			<h:outputText value="#{sampleClsDate}"
				rendered="#{sampleClsDate ne null}">
				<f:convertDateTime
					pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
			</h:outputText>
			<h:outputLabel value="" rendered="#{sampleClsDate ne null}" />

			<h:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.qtValidityPeriod}" />
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.proposal.validity.until']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.managedBean.scQt.proposalValidityEndDate}">
				<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
			</h:outputText>
			<h:outputLabel value="" />

			<h:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" styleClass="outputLabel-view-label"/>
			<h:outputText
				value="#{noticeBoardBackingBean.getParameterDesc(noticeBoardBackingBean.managedBean.scQt.procurementMode)}">
			</h:outputText>
			<h:outputLabel value="" />
			
			<h:outputLabel value="#{lbl['lbl.sc.evaluation.type']}" styleClass="outputLabel-view-label" />
			<h:outputText value="#{lbl['lbl.sc.notice.board.eval.one.tier']}"
				rendered="#{noticeBoardBackingBean.managedBean.scQt.evaluationType eq '1'}" />
			<h:outputText value="#{lbl['lbl.sc.notice.board.eval.two.tier']}"
				rendered="#{noticeBoardBackingBean.managedBean.scQt.evaluationType eq '2'}" />
			<h:outputLabel value="" />
		</h:panelGrid>
	</p:panel>
</ui:composition>
