<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<style type="text/css">
   .ui-state-hover{
     background:none !important;
     border:none !important;
  	 background-color: none !important;
	 box-shadow: none !important;
   }
</style>

	<ui:define name="contentSection">
	
		<!-- <ac:title value="#{lbl['lbl.sc.notice.board.qtn.notice']}" /> -->
		<div class="clear"></div>
		<p:messages id="tenderDetails" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		<!-- <ui:include src="nblocationPopUp.xhtml"></ui:include> -->
		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				action="#{noticeBoardBackingBean.backBtn}" />
		</div>
		<!-- Quotation/Tender details -->
		<ui:param name="isChangesTab"
			value="#{noticeBoardBackingBean.managedBean.selectedTab == ParameterConst.noticeBoardStatusChanges}" />
		<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbQtGeneralDetails.xhtml" />
		<ui:param name="scQt" value="#{noticeBoardBackingBean.managedBean.scQt}"/>
		<ui:param name="isZonal" value="#{scQt.zonal}"/>
		<ui:param name="isBsvRequired" value="#{scQt.bsvRequired}"/>
		<ui:param name="isSampleReq" value="#{scQt.sampleReq}"/>
		
		<p:panel header="#{lbl['lbl.sc.supplier.qulification.criteria']}"
			toggleable="true">
			<h:panelGrid border="0" width="100%" columns="3"
				columnClasses="columnWidth20,columnWidth50,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.sc.supplier.status']}" styleClass="outputLabel-view-label" />
				<h:outputText value="#{lbl['lbl.sc.supplier.status.open']}"
					rendered="#{scQt.openFor eq 'A'}" />
				<h:outputText value="#{lbl['lbl.sc.supplier.status.bumiputra']}"
					rendered="#{scQt.openFor eq 'B'}" />
				<h:outputLabel value="" />

				<c:if
					test="#{null ne scQt.scQtSupplierCriteria.minPaidUpCapital}">
					<h:outputLabel value="#{lbl['lbl.sc.paidup']}" styleClass="outputLabel-view-label" style="white-space: nowrap"/>
					<h:outputText
						value="#{scQt.scQtSupplierCriteria.minPaidUpCapital}" />
					<h:outputLabel value="" />
				</c:if>

				<c:if
					test="#{scQt.scQtSupplierCriteria.allState}">
					<h:outputLabel value="#{lbl['lbl.sc.location.level']}" styleClass="outputLabel-view-label" style="white-space: nowrap"/>
					<h:outputText value="#{lbl['lbl.sc.all.states']}" />
					<h:outputLabel value="" />
				</c:if>
			</h:panelGrid>
			<p:spacer height="30px" />
			<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbCategoryCodelist.xhtml" />
			<c:if
				test="#{!isZonal and !noticeBoardBackingBean.managedBean.scQt.scQtSupplierCriteria.allState}">
				<br/>
				<h:outputText value="#{lbl['lbl.sc.notice.board.locality']}"
					style="font-weight:bold;text-align: left;font-size:14px;" />
				<p:spacer height="10px"></p:spacer>

				<p:dataTable
					value="#{noticeBoardBackingBean.managedBean.locationNodes}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					var="locTree" style="width:100%">
					<p:column headerText="#{lbl['lbl.sc.location']}">
						<p:tree value="#{locTree}" var="location">
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
							<p:treeNode type="city">
								<h:outputText value="#{location.pmCity.cityName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
				</p:dataTable>

			</c:if>
			<p:spacer height="30px" />
			<c:if
				test="#{isZonal and !(isBsvRequired or isSampleReq)}">
				<h:outputText value="#{lbl['lbl.sc.qt.zone.location.info']}"
					style="font-weight:bold;text-align: left;font-size:14px;" />
				<p:spacer height="10px"></p:spacer>
				<p:dataTable
					value="#{noticeBoardBackingBean.managedBean.zoneTree}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					var="zonTree" style="width:100%">
					<p:column headerText="#{lbl['lbl.sc.zone.name']}">

						<p:tree value="#{zonTree}" var="location">
							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>

							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
							<p:treeNode type="city">
								<h:outputText value="#{location.pmCity.cityName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
				</p:dataTable>
			</c:if>
		</p:panel>

		<c:if test="#{!isZonal}">
			<ui:param name="bsvDetails"
				value="#{noticeBoardBackingBean.managedBean.normalBsvBean}" />
			<c:if test="#{isBsvRequired}">
				<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbBSVDetails.xhtml" />
				<ui:include
					src="/xhtml/sc/noticeboard/share/nbLocationPopUp.xhtml"></ui:include>
			</c:if>
			<!-- Sample Submission Address -->
			<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbSampleAddress.xhtml"></ui:include>
		</c:if>

		<c:if
			test="#{isZonal and (isBsvRequired or isSampleReq)}">
			<ui:include src="nbZones.xhtml" />
		</c:if>


		<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
			toggleable="true">
			<p:dataTable var="contactPerson" style="width:100%"
				value="#{noticeBoardBackingBean.managedBean.contactPersons}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				styleClass="test" rows="20">

				<p:column headerText="#{lbl['lbl.sc.name']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.name}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tel.no']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.phoneNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.fax.no']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.faxNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.email']}"
					style="width:25%;white-space: normal;">
					<h:outputText value="#{contactPerson.email}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<ui:include src="/xhtml/sc/noticeboard/qtdetails/nbDocumentList.xhtml"></ui:include>

	</ui:define>
</ui:composition>
