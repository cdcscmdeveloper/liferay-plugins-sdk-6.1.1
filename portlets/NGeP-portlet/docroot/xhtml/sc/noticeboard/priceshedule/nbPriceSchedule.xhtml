<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<!-- <ac:title value="Offered Price" /> -->
		<p:messages id="offeredPrices" showDetail="true" autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
		
		<div class="clear"></div>

		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				action="#{noticeBoardBackingBean.backBtn}" />
		</div>
		
		<p:panel id="qtPricePanelId" header="#{lbl['lbl.sc.notice.board.pricingheader']}" toggleable="true">
			<h:panelGrid border="0" width="100%" columns="2"
				columnClasses="columnWidth20">

				<h:outputLabel value="#{lbl['lbl.sc.ministry']}" styleClass="outputLabel-view-label"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.ministryName}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.department']}" styleClass="outputLabel-view-label"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.jabatan}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.ptj']}" styleClass="outputLabel-view-label"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.pmOrgProfile.orgName}"
					readonly="true" />


				<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}" styleClass="outputLabel-view-label"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtNo}"
					readonly="true" />

				<h:outputLabel value="#{lbl['lbl.sc.closing.date']}" styleClass="outputLabel-view-label"></h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.closingDate}"
					readonly="true">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>

				<h:outputLabel value="#{lbl['lbl.sc.notice.board.openingdate']} " styleClass="outputLabel-view-label"/>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.openingDate}"
					readonly="true">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>

				<h:outputLabel value="#{lbl['lbl.sc.title']}" styleClass="outputLabel-view-label">
				</h:outputLabel>
				<h:outputText
					value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}"
					readonly="true" />

			</h:panelGrid>
		</p:panel>
			<!-- Committee Members table -->
			<p:panel header="#{noticeBoardBackingBean.managedBean.committeeName}" toggleable="true" 
			rendered="#{noticeBoardBackingBean.managedBean.committeeName ne null?'true':'false'}">
							
				<p:dataTable id="committeeId"
					value="#{noticeBoardBackingBean.managedBean.scCommitteeMembers}"
					var="specificationcommittee" rowIndexVar="index" editable="true"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowKey="#{specificationcommittee}">
					
					<p:column headerText="#{lbl['lbl.sc.name']}">
						<h:outputText value="#{specificationcommittee.memberName}"
							style="white-space: normal;" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.designation']}"
						style="widht: 15%">
						<h:outputText value="#{specificationcommittee.designation}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.role']}" style="width: 15%">
						<h:outputText
							value="#{noticeBoardBackingBean.getParameterDesc(specificationcommittee.memberRole)}" />
					</p:column>

				</p:dataTable>
			</p:panel>
			<!-- End of Committee members -->
		<p:panel id="offerPricePnlId" header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
			<c:if test="#{!noticeBoardBackingBean.managedBean.scQt.zonal}">
				<ui:include
					src="/xhtml/sc/noticeboard/priceshedule/nbOfferPriceSuppliers.xhtml"></ui:include>
			</c:if>
			<c:if test="#{noticeBoardBackingBean.managedBean.scQt.zonal}">
				<p:tabView var="zones" dynamic="true" cache="true"
					orientation="left"
					value="#{noticeBoardBackingBean.managedBean.zones}">
					<p:ajax event="tabChange"
						listener="#{noticeBoardBackingBean.offeredPriceTabChange}"></p:ajax>
					<p:tab title="#{zones.zoneName}">
						<ui:include
							src="/xhtml/sc/noticeboard/priceshedule/nbOfferPriceSuppliers.xhtml"></ui:include>
					</p:tab>
				</p:tabView>
			</c:if>
		</p:panel>

	</ui:define>
</ui:composition>
