<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
		<p:dataTable id="supplierPriceDtls"
			value="#{noticeBoardBackingBean.managedBean.qualificationBean}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="supplierBean" rows="10">
			<ac:paginator for="supplierPriceDtls"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.no']}">
				<h:outputText
					value="#{supplierBean.supplierId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.offered.price']}">
				<h:outputText value="#{supplierBean.offeredPrice}" style="float:right;">
				<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
		</p:dataTable>

</ui:composition>
