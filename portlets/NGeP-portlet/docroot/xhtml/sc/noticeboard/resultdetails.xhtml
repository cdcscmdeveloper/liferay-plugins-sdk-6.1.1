<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<p:panel >
		<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0"
				width="100%" >
			<p:dataTable id="noticeboardresults" value="#{noticeBoardBackingBean.managedBean.scQtSearchlist}" var="scqt" styleClass="test" rows="20">
	<ac:paginator for="noticeboardresults" ></ac:paginator>
				<p:column headerText="Title" style="width:100px;">
					<p:commandLink 
						style="margin-right:20px;" action="#{noticeBoardBackingBean.qtnTenderDetails(scqt)}">
						<h:outputText value="#{scqt.qtTitle}" />
					</p:commandLink>


				</p:column>

				<p:column headerText="Publish Date">
					<h:outputText value="#{scqt.publishDate}" />
				</p:column>
				<p:column headerText="Closing Date" style="width:100px;">
					<h:outputText value="#{scqt.closingDate}" />
				</p:column>

				<p:column headerText="Remaining" style="width:120px;">
					<h:outputText value="test" />
				</p:column>

				<p:column headerText="Briefing/Sitevisit" style="width:120px;">
					<h:outputText value="#{scqt.bsvRequired}" />
				</p:column>

				<p:column headerText="Action" style="width:120px;" >
					<h:outputText value="test" />
				</p:column>

			</p:dataTable>
			</h:panelGrid>
	</p:panel>
	</ui:composition>
