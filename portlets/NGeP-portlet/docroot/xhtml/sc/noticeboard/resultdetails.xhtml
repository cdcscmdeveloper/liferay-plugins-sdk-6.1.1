<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0">
			<p:dataTable id="nbsearchresults"
				value="#{noticeBoardBackingBean.managedBean.scQtSearchlist}"
				var="scqt" styleClass="test" rows="20" style="width:700px">
				<ac:paginator for="nbsearchresults"></ac:paginator>
				<p:column headerText="Title" style="width:250px">
					<p:commandLink style="margin-right:20px;"
						action="#{noticeBoardBackingBean.qtnTenderDetails(scqt)}">
						<h:outputText value="#{scqt.qtTitle}" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.notice.board.ptj']}"
					style="width:250px">
					<h:outputText value="#{scqt.pmOrgProfile.orgName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.notice.board.pdate']}"
					style="width:25px">
					<h:outputText value="#{scqt.publishDate}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.notice.board.clsdate']}"
					style="width:25px">
					<h:outputText value="#{scqt.closingDate}">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</h:outputText>
				</p:column>
					<p:column headerText="#{lbl['lbl.qt.nb.countdowndays']}"
						style="width:10px" rendered="#{noticeBoardBackingBean.managedBean.tabTitle eq 'Publish' or noticeBoardBackingBean.managedBean.tabTitle eq 'Changes'}">
						<h:outputText value="10" />
					</p:column>
				
					<p:column headerText="#{lbl['lbl.sc.notice.board.view.bsv']}"
						style="width:50px" rendered="#{noticeBoardBackingBean.managedBean.tabTitle eq 'Publish' or noticeBoardBackingBean.managedBean.tabTitle eq 'Changes' }">
						<h:outputText
							value="#{(scqt.bsvRequired eq '1')?lbl['lbl.ct.dialong.cofirm.no']:lbl['lbl.ct.dialong.cofirm.yes']}" />
						
							<p:commandLink
								action="#{noticeBoardBackingBean.gotoSupplierRegistration(scqt)}" rendered="#{scqt.bsvRequired}">
								<p:graphicImage library="ep/images/design" name="register.png"
									value="/resources/ep/images/design/register.png" />
							</p:commandLink>
						
					</p:column>
				
				<p:column headerText="#{lbl['lbl.ss.item.detail.action']}"
					style="width:50px">
					<c:if
						test="#{noticeBoardBackingBean.managedBean.tabTitle eq 'Publish' or noticeBoardBackingBean.managedBean.tabTitle eq 'Changes' }">
						<p:commandLink>
							<p:graphicImage library="ep/images/design" name="download.png"
								value="/resources/ep/images/design/download.png" />
						</p:commandLink>
						<p:commandLink
							action="#{noticeBoardBackingBean.gotoSupplierQualificationCriteria}">
							<p:graphicImage library="ep/images/design" name="register.png"
								value="/resources/ep/images/design/register.png" />
						</p:commandLink>
					</c:if>
					<c:if
						test="#{noticeBoardBackingBean.managedBean.tabTitle eq 'Close'}">
						<p:commandLink
							action="#{noticeBoardBackingBean.showPriceSchedules(scqt)}"
							oncomplete="popupPriceSchedule.show()" update="@(.priceschedule)">
							<h:outputText value="Price Schedule"></h:outputText>
						</p:commandLink>
					</c:if>
					<c:if
						test="#{noticeBoardBackingBean.managedBean.tabTitle eq 'Awared'}">
						<p:commandLink
							action="#{noticeBoardBackingBean.showPriceSchedules(scqt)}"
							oncomplete="popupPriceSchedule.show()" update="@(.priceschedule)">
							<h:outputText value="View Awarded List"></h:outputText>
						</p:commandLink>
					</c:if>
				</p:column>

			</p:dataTable>
		</h:panelGrid>
	</p:panel>
</ui:composition>
