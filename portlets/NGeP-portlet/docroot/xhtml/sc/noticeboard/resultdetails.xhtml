<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<ui:param name="isChangesTab" value="#{noticeBoardBackingBean.managedBean.selectedTab == ParameterConst.noticeBoardStatusChanges}" />
		
		<p:dataTable id="nbsearchresults"
			value="#{noticeBoardBackingBean.qtDataModel}" lazy="true"
			styleClass="nbsrhresultsStyleClass" style="width:100%" var="scqt"
			rows="20">

			<ac:paginator for="nbsearchresults" />

			<p:column headerText="Title" style="width:30%;white-space: normal;">
				<p:commandLink style="margin-right:20px;"
					action="#{noticeBoardBackingBean.retrieveQTDetails(scqt[0])}">
					<h:outputText value="#{scqt[1]}" />
				</p:commandLink>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.notice.board.ptj']}"
				style="width:30%;white-space: normal;">
				<h:outputText value="#{scqt[2]}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.notice.board.pdate']}"
				style="width:6%;white-space: normal;">
				<h:outputText value="#{scqt[3]}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.notice.board.clsdate']}"
				style="width:6%;white-space: normal;">
				<h:outputText value="#{scqt[4]}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
				
				<h:outputText value="&#60;br/&#62;&#60;br/&#62;#{lbl['lbl.sc.updated.on']} " styleClass="lastUpdated" escape="false" rendered="#{isChangesTab and !empty scqt[6]}" />
				<h:outputText value="#{scqt[6]}" styleClass="lastUpdated" rendered="#{isChangesTab and !empty scqt[6]}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.qt.nb.countdowndays']}"
				style="width:8%; white-space:normal; text-align:right;"
				rendered="#{noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusPublish or noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusChanges}">
						#{noticeBoardBackingBean.getClosingDays(scqt[4])}
					</p:column>

			<p:column headerText="#{lbl['lbl.sc.notice.board.view.bsv']}"
				style="width:7%; white-space:normal; text-align:right;"
				rendered="#{noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusPublish or noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusChanges }">
				<h:outputText
					value="#{(scqt[5] eq '1')?lbl['lbl.btn.no']:lbl['lbl.btn.yes']}" />
						&#160;
						<p:commandLink id="supRegIcon"
					action="#{noticeBoardBackingBean.gotoSupplierRegistration(scqt[0])}"
					rendered="#{scqt[5]}">
					<p:graphicImage library="ep/images/design" name="register.png"
						value="/resources/ep/images/design/register.png" />
				</p:commandLink>
				<p:tooltip for="supRegIcon"
					value="#{lbl['lbl.sc.notice.board.self.reg']}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.ss.item.detail.action']}"
				style="width:3%; white-space:normal; text-align:right;">
				<ui:fragment
					rendered="#{noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusPublish or noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusChanges }">
					<p:commandLink id="chkQualIcon"
						action="#{noticeBoardBackingBean.gotoSupplierQualificationCriteria(scqt[0])}">
						<p:graphicImage library="ep/images/design" name="tick.png"
							value="/resources/ep/images/design/tick.png" />
					</p:commandLink>
					<p:tooltip for="chkQualIcon"
						value="#{lbl['lbl.sc.notice.board.check.supplier.qualification']}" />
					<p:commandLink id="downloadIcon">
						<p:graphicImage library="ep/images/design" name="download.png"
							value="/resources/ep/images/design/download.png" />
					</p:commandLink>
					<p:tooltip for="downloadIcon"
						value="#{lbl['lbl.sc.notice.board.download.quotation.tender.documents']}" />
				</ui:fragment>
				<ui:fragment
					rendered="#{noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusClosed}">
					<p:commandLink
						action="#{noticeBoardBackingBean.showPriceSchedules(scqt[0])}">
						<h:outputText value="Price Schedule"></h:outputText>
					</p:commandLink>
				</ui:fragment>
				<ui:fragment
					rendered="#{noticeBoardBackingBean.managedBean.selectedTab eq ParameterConst.noticeBoardStatusAwarded}">
					<p:commandLink
						action="#{noticeBoardBackingBean.showAwardDetails(scqt[0])}">
						<h:outputText value="View Awarded List"></h:outputText>
					</p:commandLink>
				</ui:fragment>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
