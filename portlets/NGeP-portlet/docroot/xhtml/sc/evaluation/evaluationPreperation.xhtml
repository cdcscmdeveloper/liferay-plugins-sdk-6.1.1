<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table>
		<tr>
			<td style="width: 20%; vertical-align: baseline;"><p:tabMenu styleClass="sidemenu"
					activeIndex="#{evaluationBackingBean.managedBean.prepareActiveIndex}"
					style="display : table-caption;">

					<p:menuitem value="#{lbl['lbl.sc.meeting.details']}"
						action="#{evaluationBackingBean.retriveDetails}" update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.eva.opn.committee']}"
						action="#{evaluationBackingBean.retriveOpeningCommitteeDtls}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.join.in']}"
						action="#{evaluationBackingBean.retriveTurutHadirDtls}"
						update="@form" />


				</p:tabMenu></td>
			<td><c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '0'}">

					<ui:include src="meetingDetails.xhtml"></ui:include>

				</c:if>
				<c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '1'}">

					<ui:include src="committeeOpen.xhtml"></ui:include>

				</c:if>
				<c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '2'}">

					<ui:include src="committeeOpen.xhtml"></ui:include>

				</c:if>
				</td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>

			<td><div align="right" style="width: 99%">


					<p:commandButton value="#{lbl['lbl.btn.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('0','1')}"
						action="#{evaluationBackingBean.updateSmAppl}"
						iconPos="right" update=":form" />

				</div></td>
		</tr>
	</table>

</ui:composition>
