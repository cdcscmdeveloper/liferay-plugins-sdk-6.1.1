<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="sampleCompliance" showDetail="true" autoUpdate="true"
			closable="true" severity="error,info" showSummary="false" />
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				style="float:left;"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				disabled="#{evaluationBackingBean.managedBean.readOnly and evaluationBackingBean.managedBean.statusOnly}"
				style="float:right;" update="@all"
				action="#{evaluationBackingBean.saveComplianceSample}" />
		</div>
		<p:spacer height="25" />
		<br />
		<br />
		
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.supplier.code']}"></h:outputLabel></td>
					<td><p:inputText size="50"
							value="#{evaluationBackingBean.managedBean.scQtSampleLbl.scQtProposal.supplierNo}"
							disabled="true"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.label.no']}"></h:outputLabel></td>
					<td><p:inputText size="50"
							value="#{evaluationBackingBean.managedBean.scQtSampleLbl.lableNo}"
							disabled="true"></p:inputText></td>
				</tr>
			</table>
		


		<p:panel header="#{lbl['lbl.sc.item.list']}"
			toggleable="true">
			<p:dataTable var="sampleItem" id="sampleItemId" editable="true"
				rows="10"
				value="#{evaluationBackingBean.managedBean.complianceSampleItemList}"
				rowIndexVar="index" style="width:100%" rowKey="#{sampleItem}">
				<ac:paginator for="sampleItemId" />


				<p:column headerText="#{lbl['lbl.sc.item']}"
					style="width:35%">

					<h:outputText value="#{sampleItem.scRequestItem.itemName}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.sp.extensionno']}"
					style="width:10%">
					<h:outputText value="#{sampleItem.subLableNo}"></h:outputText>

				</p:column>



				<p:column style="width:20%">
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory"></h:outputText>
						<h:outputText value="#{lbl['lbl.sc.submission.status']}"></h:outputText>
					</f:facet>
					<p:selectOneMenu id="sampleSubmissionId"
						disabled="#{evaluationBackingBean.managedBean.readOnly and evaluationBackingBean.managedBean.statusOnly}"
						label="#{lbl['lbl.sc.submission.status']}" required="true"
						value="#{sampleItem. submissionStatus.parameterId}">

						<f:selectItems
							value="#{evaluationBackingBean.getDropdownValues(ParameterTypeConst.sampleSubmissionStatus)}"></f:selectItems>
					</p:selectOneMenu>
					<p:message id="sampleSubmissionMsg" for="sampleSubmissionId"
						display="icon"></p:message>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.remarks']}"
					style="width:35%">
					<p:inputTextarea rows="2" cols="40" maxlength="100"
						disabled="#{evaluationBackingBean.managedBean.readOnly and evaluationBackingBean.managedBean.statusOnly}"
						value="#{sampleItem.remark}"></p:inputTextarea>
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:panel header="#{lbl['lbl.sc.eva.item.specification']}"
			toggleable="true">
			<p:dataTable var="itemspec" id="itemSpecId" editable="true" rows="10"
				value="#{evaluationBackingBean.managedBean.complianceSampleItemList}"
				rowIndexVar="index" style="width:50%" rowKey="#{itemspec}">
				<ac:paginator for="itemSpecId" />


				<p:column headerText="#{lbl['lbl.sc.specification']}"
					style="width:50%">

					<h:outputText
						value="#{itemspec.scRequestItem.tplSpecQuestion.clSpecDetail}"></h:outputText>
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>
</ui:composition>
