<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back" action="#{evaluationBackingBean.evaluationBackaction}"/>

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" action="#{evaluationBackingBean.saveComplianceSample}"/>
		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td ><p:inputText size="50"
							value="#{evaluationBackingBean.managedBean.scQtSampleLbl.scQtProposal.supplierNo}"
							disabled="true"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.lbl.no']}"></h:outputLabel></td>
					<td><p:inputText size="50"
							value="#{evaluationBackingBean.managedBean.scQtSampleLbl.lableNo}"
							disabled="true"></p:inputText></td>
				</tr>
			</table>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.eva.smpl.item.list']}"
			toggleable="true">
			<p:dataTable var="sampleItem" id="sampleItemId" editable="true"
				value="#{evaluationBackingBean.managedBean.complianceSampleItemList}"
				rowIndexVar="index" style="width:100%" rowKey="#{sampleItem}">
				<ac:paginator for="sampleItemId" />


				<p:column headerText="#{lbl['lbl.sc.eva.samp.comp.item']}" style="width:35%">

					<h:outputText value="#{sampleItem.scRequestItem.itemName}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.samp.comp.lbl.ext.num']}" style="width:10%">
					<h:outputText value="#{sampleItem.subLableNo}"></h:outputText>

				</p:column>



				<p:column headerText="#{lbl['lbl.sc.eva.comp.sub.status']}" style="width:20%">
					<p:selectOneMenu
						value="#{sampleItem. submissionStatus.parameterId}">
						<f:selectItem itemLabel="Hantar dan Mematuhi" itemValue="1"></f:selectItem>
						<f:selectItem itemLabel="Hantar dan Tidak Mematuhi" itemValue="2"></f:selectItem>
						<f:selectItem itemLabel="Tidak Hantar" itemValue="3"></f:selectItem>
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}"
					style="width:35%">
					<p:inputTextarea rows="2" cols="40" value="#{sampleItem.remark}"></p:inputTextarea>
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:panel header="#{lbl['lbl.sc.eva.smpl.item.spec']}"
			toggleable="true">
			<p:dataTable var="itemspec" id="itemSpecId" editable="true"
				value="#{evaluationBackingBean.managedBean.complianceSampleItemList}"
				rowIndexVar="index" style="width:50%" rowKey="#{itemspec}">
				<ac:paginator for="itemSpecId" />


				<p:column headerText="#{lbl['lbl.sc.eva.tech.spec.specification']}" style="width:50%">

					<h:outputText value="#{itemspec.scRequestItem.tplSpecQuestion.clSpecDetail}"></h:outputText>
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>
</ui:composition>
