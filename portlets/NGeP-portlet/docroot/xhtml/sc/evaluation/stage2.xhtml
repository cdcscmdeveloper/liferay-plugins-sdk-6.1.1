<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<c:if
		test="#{evaluationBackingBean.managedBean.committeeType eq'EC' or evaluationBackingBean.managedBean.committeeType eq'TEC' }">

		<p:panel header="#{lbl['lbl.sc.eva.s2.tech.head']}" toggleable="true">
			<h:panelGrid columns="3">

				<h:outputLabel value="#{lbl['lbl.sc.eva.present.request.status']}"></h:outputLabel>

				<p:inputText value="" readonly="true" disabled="true"></p:inputText>

				<p:commandButton
					value="#{lbl['lbl.sc.eva.present.btn.request.demo']}"
					oncomplete="requestPresentation.show();" />

			</h:panelGrid>

			<p:dataTable id="technicalst2supplierList" var="s2techSupplier" rows="10"
				value="#{evaluationBackingBean.managedBean.s2TechSupplier}"
				selection="#{evaluationBackingBean.managedBean.s2techSingleSelect}"
				rowKey="#{s2techSupplier.evaluationResultId}" selectionMode="single"
				rowIndexVar="index">



				<p:ajax event="rowSelect"
					listener="#{evaluationBackingBean.onRowSelect}"
					update=":form:technicalst2checkList"></p:ajax>
				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
							style="width:30%">
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.status']}"
							style="width:35%">
						</p:column>
						<!-- <p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
						style="width:30%">
					</p:column> -->
					</p:row>
				</p:columnGroup>
				<p:column style="width:30%">
					<h:outputText value="#{s2techSupplier.scQtProposal.supplierNo}"></h:outputText>
				</p:column>

				<p:column style="width:35%">
					<h:outputText value="#{s2techSupplier.evaluationStatus.statusId}"></h:outputText>
				</p:column>


				<!-- <p:column style="width:30%">
				<h:outputText value="#{s2techSupplier.totalScore}"></h:outputText>
			</p:column> -->
			</p:dataTable>

		</p:panel>

		<p:panel header="#{lbl['lbl.sc.eva.s2.tech.list.head']}"
			toggleable="true">

			<p:dataTable id="technicalst2checkList" var="s2techlist" rows="10"
				value="#{evaluationBackingBean.managedBean.s2TechChecklist}"
				rowIndexVar="index">

				<ac:paginator for="technicalst2checkList" />

				<p:column headerText="#{lbl['lbl.sc.eva.s2.checklist']}"
					style="width:20%">
					<h:outputText value="#{s2techlist.scQtCheckList.title}"></h:outputText>
				</p:column>


				<!-- 
			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:25%">
				<h:outputText value="#{s2techlist.userScore}"></h:outputText>
			</p:column> -->

				<p:column headerText="#{lbl['lbl.sc.eva.s2.checklist.status']}"
					style="width:30%">
					<h:outputText value="#{s2techlist.scQtCheckList.pmStatus.statusId}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
					style="width:20%">
					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
						oncomplete="peringkat2.show();"
						action="#{evaluationBackingBean.evaluations2TechAction(s2techlist)}"
						icon="ui-icon-evaluate" update=":form:s2Techpopup"></p:commandButton>
				</p:column>


			</p:dataTable>

		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.present.demo.s2.head']}"
			toggleable="true">

			<p:dataTable id="stageTwoPresentation" var="s2techlist" rows="10"
				value="#{evaluationBackingBean.managedBean.s2TechChecklist}"
				rowIndexVar="index">

				<ac:paginator for="stageTwoPresentation" />

				<p:column headerText="#{lbl['lbl.sc.eva.present.result']}"
					style="width:20%">
					<h:outputText value="#{s2techlist.scQtCheckList.title}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.s2.checklist.status']}"
					style="width:30%">
					<h:outputText value="#{s2techlist.scQtCheckList.pmStatus.statusId}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
					style="width:20%">

					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
						oncomplete="evaluationPresentation.show();"
						icon="ui-icon-evaluate"></p:commandButton>
				</p:column>


			</p:dataTable>
		</p:panel>
	</c:if>


	<c:if
		test="#{evaluationBackingBean.managedBean.committeeType eq'EC' or evaluationBackingBean.managedBean.committeeType eq'FEC' }"> -->
	<p:panel header="#{lbl['lbl.sc.eva.s2.fin.head']}" toggleable="true">

			<p:dataTable id="finanicalst2supplierList" var="s2finsupplier" rows="10"
				value="#{evaluationBackingBean.managedBean.s2FinSupplier}"
				selection="#{evaluationBackingBean.managedBean.s2finSingleSelect}"
				rowKey="#{s2finsupplier}" rowIndexVar="index" selectionMode="single">
				<ac:paginator for="finanicalst2supplierList" />
				<p:ajax event="rowSelect"
					listener="#{evaluationBackingBean.onFinRowSelect}"
					update=":form:finanicalst2checkList"></p:ajax>
				<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
					style="width:30%">
					<h:outputText value="#{s2finsupplier.scQtProposal.supplierNo}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.status']}"
					style="width:35%">
					<h:outputText value="#{s2techSupplier.evaluationStatus.statusId}"></h:outputText>
				</p:column>


				<!-- <p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:30%">
				<h:outputText value="#{s2finsupplier.totalScore}"></h:outputText>
			</p:column> -->

			</p:dataTable>

		</p:panel>

		<p:panel header="#{lbl['lbl.sc.eva.s2.fin.list.head']}"
			toggleable="true">

			<p:dataTable id="finanicalst2checkList" var="s2finchecklist" rows="10"
				value="#{evaluationBackingBean.managedBean.s2FinChecklist}"
				rowIndexVar="index">

				<ac:paginator for="finanicalst2checkList" />

				<p:column headerText="#{lbl['lbl.sc.eva.s2.checklist']}"
					style="width:20%">
					<h:outputText value="#{s2finchecklist.scQtCheckList.title}"></h:outputText>
				</p:column>


				<!-- 
			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:25%">
				<h:outputText value="#{s2finchecklist.userScore}"></h:outputText>
			</p:column> -->

				<p:column headerText="#{lbl['lbl.sc.eva.s2.checklist.status']}"
					style="width:30%">
					<h:outputText
						value="#{s2finchecklist.scQtCheckList.pmStatus.statusId}"></h:outputText>
				</p:column>
> 
				 <p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
					style="width:20%">
					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
						oncomplete="peringkat2.show();"
						action="#{evaluationBackingBean.evaluations2FinAction(s2finchecklist)}"
						icon="ui-icon-evaluate" update=":form:s2Techpopup"></p:commandButton>
				</p:column>


			</p:dataTable>

		</p:panel>
	</c:if>
	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('2','1')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>

			<td><div align="right" style="width: 99%">
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq'OC'}">
						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{evaluationBackingBean.setTabValue('2','3')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-next" iconPos="right" update=":form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType ne'OC'}">
						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{evaluationBackingBean.setTabValue('2','4')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-next" iconPos="right" update=":form" />
					</c:if>
				</div></td>
		</tr>


	</table>

</ui:composition>
