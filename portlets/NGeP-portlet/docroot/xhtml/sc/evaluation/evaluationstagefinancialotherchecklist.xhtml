<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>
		<h:panelGroup>
			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{evaluationBackingBean.evaluationBackaction}" />

			</div>
		</h:panelGroup>
		<p:spacer height="25" />
		<br />
		<br />
		<ui:include src="evaluationHeader.xhtml" />
		<br/>		
		<p:panel header="#{lbl['lbl.sc.eva.financial.proposal.evaluation']}">
			<ui:include src="checklistHeader.xhtml" />
		</p:panel>
		<br />

		<h:panelGroup>
			<p:panel header="#{lbl['lbl.sc.supplier.list']}"
				toggleable="true">

				<p:dataTable var="othersFinList" id="othersFinListId"
					editable="true" rows="10"
					value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckList}"
					rowIndexVar="index" style="width:100%" rowKey="#{othersFinList}">
					<ac:paginator for="othersFinListId" />


					<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
						style="width:40%">

						<h:outputText value="#{othersFinList.scQtProposal.supplierNo}"></h:outputText>


					</p:column>


					<p:column headerText="#{lbl['lbl.sc.total.score']}"
						style="width:40%">
						<h:outputText value="#{othersFinList.totalScore}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
						style="width:15%">


						<h:outputText
							value="#{evaluationBackingBean.getStatusDescById(othersFinList.evaluationStatus.statusId)}"></h:outputText>

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}"
						style="width:20%">

						<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
							rendered="#{othersFinList.evaluationStatus.statusId eq '61600'}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.financialSupplierEvaluate(othersFinList,index,'F')}" />
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							rendered="#{othersFinList.evaluationStatus.statusId eq '61601'}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.financialSupplierEvaluate(othersFinList,index,'F')}" />
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>
</ui:composition>
