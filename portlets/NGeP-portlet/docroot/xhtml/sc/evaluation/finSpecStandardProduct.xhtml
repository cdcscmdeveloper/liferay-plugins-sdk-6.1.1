<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				action="#{evaluationBackingBean.saveComplianceSample}" />
		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText size="50" disabled="true"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}" toggleable="true">
			<p:dataTable var="finSpecComplianceList" id="finSpecStandardProduct"
				rowIndexVar="index" style="width:100%" rows="10"
				rowKey="#{finSpecComplianceList}">
				<ac:paginator for="finSpecStandardProduct" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">

				</p:column>

			</p:dataTable>

		</p:panel>

<p:panel header="#{lbl['lbl.sc.eva.fin.spec.item.list']}">
</p:panel>

		

	<p:panel header="#{lbl['lbl.sc.eva.score.offer.price']}">
			<p:panelGrid style="margin-top:5px;width:100%;">
				<f:facet name="header">

					<p:row>
						<p:column colspan="1">#{lbl['lbl.sc.eva.offer.price']}</p:column>
						<p:column colspan="1">#{lbl['lbl.sc.eva.from.varience']}</p:column>
						<p:column colspan="1">#{lbl['lbl.sc.eva.to.varience']}</p:column>
						<p:column>#{lbl['lbl.sc.eva.below.varience']}</p:column>
						<p:column>#{lbl['lbl.sc.eva.within.varience']}</p:column>
						<p:column>#{lbl['lbl.sc.eva.above.varience']}</p:column>
					</p:row>
				</f:facet>
				<p:row>
					<p:column style="font-weight: bold;">#{lbl['lbl.sc.eva.by.item']}</p:column>
					<p:column style="font-weight: bold;">

						<h:outputText></h:outputText>
					</p:column>

					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:panel>
		

		

	</ui:define>
</ui:composition>
