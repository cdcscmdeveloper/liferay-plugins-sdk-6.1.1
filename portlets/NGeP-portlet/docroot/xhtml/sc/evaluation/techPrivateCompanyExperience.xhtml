<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="technicalPrivateEvaluationmsgId" autoUpdate="true"
			closable="true" showDetail="true" showSummary="false"
			severity="error,info"></p:messages>

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" update="@all"
				action="#{evaluationBackingBean.saveProposalScoreDtls}" />
		</div>
		<p:spacer height="75"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText disabled="true"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true"
							style="width:90%"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}"
			toggleable="true">
			<p:dataTable var="techComplianceList" id="techGovCompanyId"
				value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
				rowIndexVar="index" style="width:100%"
				rowKey="#{techComplianceList}">
				<ac:paginator for="techGovCompanyId" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">
					<h:outputText value="#{techComplianceList.scQtCheckList.title}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
					<p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadDocuments(techComplianceList)}"
						process="@this" partialSubmit="true">
						<p:graphicImage library="ep/images/design"
							value="/resources/ep/images/design/icon_txt.png" />

					</p:commandLink>
				</p:column>

			</p:dataTable>

		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.cmpny.exp.private']}"
			toggleable="true">
			<h:panelGrid columns="2">
				<h:outputLabel
					value="*#{lbl['lbl.sc.eva.cmpny.exp.product.service.year']} "></h:outputLabel>
				<h:outputText
					value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.scQtCheckListValue.year}"></h:outputText>
			</h:panelGrid>
			<p:dataTable id="experience" rowIndexVar="index" var="experience"
				value="#{evaluationBackingBean.managedBean.prpCompanyExperienceList}"
				rowKey="#{experience}">
				<ac:paginator for="experience"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
					<h:outputText value="#{experience.clientName}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
					<h:outputText value="#{experience.contractTitle}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
					<h:outputText value="#{experience.contractNo}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.effective.date']}">
					<h:outputText value="#{experience.effectiveDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.exp.date']}">
					<h:outputText value="#{experience.expiryDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
					<h:outputText value="#{experience.contractPeriod}">
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.ramarks']}">
					<h:outputText value="#{experience.remark}">
					</h:outputText>
				</p:column>
			</p:dataTable>


			<table>
				<c:forEach
					items="#{evaluationBackingBean.managedBean.techGovProposalScore}"
					var="action">

					<c:if test="${action.criteriaType eq '15'}">
						<tr>


							<td><h:outputText
									value="#{lbl['lbl.sc.spec.total.no.contracts']}" /></td>
							<td style="width: 200px;"><p:inputText readonly="true"
									value="#{action.criteriaValue}" disabled="true"></p:inputText></td>
							<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
									rendered="#{action.criteriaType eq '15' and evaluationBackingBean.managedBean.checklistScoreType eq '1'}" />
								<h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}"
									rendered="#{action.criteriaType eq '15' and evaluationBackingBean.managedBean.checklistScoreType eq '2'}" /></td>
							<td><p:inputText readonly="true" disabled="true"
									value="#{action.autoScore}"
									rendered="#{action.criteriaType eq '15' and evaluationBackingBean.managedBean.checklistScoreType eq '1'}"></p:inputText>
								<p:inputText value="#{action.userScore}" maxlength="18"
									rendered="#{action.criteriaType eq '15' and evaluationBackingBean.managedBean.checklistScoreType eq '2'}"></p:inputText></td>
						</tr>
					</c:if>

					<c:if test="${action.criteriaType eq '16'}">

						<tr>
							<td><h:outputText
									value="#{lbl['lbl.sc.spec.total.no.years']}" /></td>
							<td style="width: 200px;"><p:inputText readonly="true"
									value="#{action.criteriaValue}" disabled="true"></p:inputText></td>
							<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
									rendered="#{action.criteriaType eq '16' and evaluationBackingBean.managedBean.companyScoreType eq '1'}" />
								<h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}"
									rendered="#{action.criteriaType eq '16' and evaluationBackingBean.managedBean.companyScoreType eq '2'}" /></td>
							<td><p:inputText readonly="true" disabled="true"
									value="#{action.autoScore}"
									rendered="#{action.criteriaType eq '16' and evaluationBackingBean.managedBean.companyScoreType eq '1'}"></p:inputText>
								<p:inputText value="#{action.userScore}" maxlength="18"
									rendered="#{action.criteriaType eq '16' and evaluationBackingBean.managedBean.companyScoreType eq '2'}"></p:inputText></td>
						</tr>
					</c:if>
				</c:forEach>
			</table>


		</p:panel>


		<h:panelGroup id="noOfPrivateContracts">
			<ui:param name="scoringPnlId" value="privateContractorListId" />
			<ui:param name="scoringList"
				value="#{evaluationBackingBean.managedBean.technicalGovNoOfContracts}"></ui:param>
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.spec.score.total.no.contracts']}"></ui:param>
			<p:panel header="#{scoringPnlName}" toggleable="true">

				<p:dataTable id="#{scoringPnlId}" rowIndexVar="index"
					value="#{scoringList}" var="checkListScoring"
					rowKey="#{checkListScoring}">
					<ac:paginator for="#{scoringPnlId}"></ac:paginator>
					<!-- 	<p:column selectionMode="multiple" style="width:2px;"></p:column> -->
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.from']}"
						style="width:40%"
						rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">
						<h:outputLabel value="#{checkListScoring.rangeFrom}"
							style="text-align:right"></h:outputLabel>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.to']}"
						style="width:30%"
						rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">
						<h:outputLabel value="#{checkListScoring.rangeTo}"
							style="text-align:right"></h:outputLabel>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score']}"
						style="width:30%">
						<h:outputLabel value="#{checkListScoring.score}"
							style="text-align:right"></h:outputLabel>
					</p:column>
					<!-- <p:column headerText="#{lbl['lbl.sc.spec.stage.action']}">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column> -->
				</p:dataTable>
			</p:panel>
		</h:panelGroup>


		<h:panelGroup id="noOfPrivateYears">
			<ui:param name="scoringPnlId" value="noOfPrivateyearsId" />
			<ui:param name="scoringList"
				value="#{evaluationBackingBean.managedBean.technicalGovNoOfYears}"></ui:param>
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.eva.cmp.tot.num.yrs']}"></ui:param>
			<p:panel header="#{scoringPnlName}" toggleable="true">
				<p:dataTable id="#{scoringPnlId}" rowIndexVar="index"
					value="#{scoringList}" var="checkListScoring"
					rowKey="#{checkListScoring}">
					<ac:paginator for="#{scoringPnlId}"></ac:paginator>
					<!-- 	<p:column selectionMode="multiple" style="width:2px;"></p:column> -->
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.from']}"
						style="width:40%"
						rendered="#{evaluationBackingBean.managedBean.companyScoreType eq '1'}">
						<h:outputLabel value="#{checkListScoring.rangeFrom}"
							style="text-align:right"></h:outputLabel>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score.to']}"
						style="width:30%"
						rendered="#{evaluationBackingBean.managedBean.companyScoreType eq '1'}">
						<h:outputLabel value="#{checkListScoring.rangeTo}"
							style="text-align:right"></h:outputLabel>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.spec.stage2.score']}"
						style="width:30%">
						<h:outputLabel value="#{checkListScoring.score}"
							style="text-align:right"></h:outputLabel>
					</p:column>
					<!-- <p:column headerText="#{lbl['lbl.sc.spec.stage.action']}">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column> -->
				</p:dataTable>
			</p:panel>
		</h:panelGroup>

	</ui:define>
</ui:composition>
