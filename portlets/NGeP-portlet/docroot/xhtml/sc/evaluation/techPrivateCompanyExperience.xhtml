<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save"
				action="#{evaluationBackingBean.saveComplianceSample}" />
		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText size="50" disabled="true"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}" toggleable="true">
			<p:dataTable var="techComplianceList" id="techGovCompanyId"
				rowIndexVar="index" style="width:100%"
				rowKey="#{techComplianceList}">
				<ac:paginator for="techGovCompanyId" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">

				</p:column>

			</p:dataTable>

		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.cmpny.exp.private']}"
			toggleable="true">
			<h:panelGrid columns="2">
				<h:outputLabel
					value="*#{lbl['lbl.sc.eva.cmpny.exp.product.service.year']} "></h:outputLabel>
				<h:outputText></h:outputText>
			</h:panelGrid>
			<p:dataTable id="experience" rowIndexVar="index" var="experience"
				rowKey="#{experience}">
				<ac:paginator for="experience"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.customer.name']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contract.title']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.loa.no']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.effective.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.exp.date']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.period']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.contarct.amount']}">
					<p:inputText></p:inputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.ramarks']}">
					<p:inputText></p:inputText>
				</p:column>
			</p:dataTable>


			<table>
				<tr>
					<td><h:outputText
							value="#{lbl['lbl.sc.spec.total.no.contracts']}" /></td>
					<td style="width: 200px;"><p:inputText readonly="true" disabled="true"></p:inputText></td>
					<td ><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}" /></td>
					<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputText value="#{lbl['lbl.sc.spec.total.no.years']}" /></td>
					<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
					<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}" /></td>
					<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
				</tr>
			</table>


		</p:panel>


		<h:panelGroup id="noOfPrivateContracts">
			<ui:param name="scoringPnlId" value="privateContractorListId" />
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.spec.score.total.no.contracts']}"></ui:param>
			<ui:include src="evaluationScoring.xhtml"></ui:include>
		</h:panelGroup>


		<h:panelGroup id="noOfPrivateYears">
			<ui:param name="scoringPnlId" value="noOfPrivateyearsId" />
			<ui:param name="scoringPnlName" value="#{lbl['lbl.sc.eva.cmp.tot.num.yrs']}"></ui:param>
			<ui:include src="evaluationScoring.xhtml"></ui:include>
		</h:panelGroup>

	</ui:define>
</ui:composition>
