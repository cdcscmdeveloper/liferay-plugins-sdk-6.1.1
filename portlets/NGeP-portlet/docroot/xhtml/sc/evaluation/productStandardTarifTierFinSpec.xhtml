<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>
			<p:messages id="financialSpecEvaluationmsgId" autoUpdate="true"
				closable="true" showDetail="true" showSummary="false"
				severity="error,info"></p:messages>

			<ui:include src="financialspecbuttons.xhtml"></ui:include>

			<ui:include src="financialspeccompliancelist.xhtml"></ui:include>



			<ac:templateSpec
				templateSpecBean="#{evaluationBackingBean.managedBean.templateSpecBean}" />

			<h:panelGroup>
				<p:panel
					header="#{lbl['lbl.sc.spec.scoring.offered.price.item']}"
					toggleable="true">



					<p:dataTable var="itemofferPricelist" id="itemOfferpriceId"
						rows="10"
						value="#{evaluationBackingBean.managedBean.specItemScoringList}"
						rowIndexVar="index" style="width:100%"
						rowKey="#{itemofferPricelist}">
						<ac:paginator for="itemOfferpriceId" />


						<p:column headerText="#{lbl['lbl.sc.item.name']}"
							style="width:30%;white-space: normal;">
							<h:outputText
								value="#{itemofferPricelist.tplSpecQuestion.clItem}"></h:outputText>
						</p:column>
						<p:column
							headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.from.variance']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.rangeFrom}"
								style="text-align:right"></h:outputLabel>
						</p:column>

						<p:column headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.to.variance']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.rangeTo}"
								style="text-align:right"></h:outputLabel>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.eva.from.varience.ringgit']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.fromVariance}"
								style="text-align:right">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</h:outputLabel>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.eva.to.varience.ringgit']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.toVariance}"
								style="text-align:right">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</h:outputLabel>
						</p:column>

						<p:column
							headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.below.score']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.belowScore}"
								style="text-align:right"></h:outputLabel>
						</p:column>

						<p:column
							headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.within.score']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.score}"
								style="text-align:right"></h:outputLabel>
						</p:column>
						<p:column
							headerText="#{lbl['lbl.tpl.spec.content.scoring.scoring.above.score']}"
							style="width:10%">
							<h:outputLabel value="#{itemofferPricelist.aboveScore}"
								style="text-align:right"></h:outputLabel>
						</p:column>


					</p:dataTable>
				</p:panel>
			</h:panelGroup>
		</h:panelGroup>
	</ui:define>
</ui:composition>
