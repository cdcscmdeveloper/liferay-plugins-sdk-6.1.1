<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="financialSpecEvaluationmsgId" autoUpdate="true"
			closable="true" showDetail="true" showSummary="false"
			severity="error,info"></p:messages>

		<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
			style="float:left;" icon="ui-icon-back"
			action="#{evaluationBackingBean.evaluationBackaction}" />

		<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
			style="float:right;" icon="ui-icon-save" update="@all"
			action="#{evaluationBackingBean.saveTempleateSpecDtls}" />

<p:spacer height="50"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText size="50" disabled="true"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true" style="width:70%"
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}"
			toggleable="true">
			<p:dataTable var="psComplianceList" id="pServiceListId"
				value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
				rowIndexVar="index" style="width:100%" rowKey="#{psComplianceList}">
				<ac:paginator for="pServiceListId" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">
					<h:outputText value="#{psComplianceList.scQtCheckList.title}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
					<p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadDocuments(psComplianceList)}"
						process="@this" partialSubmit="true">
						<p:graphicImage library="ep/images/design"
							value="/resources/ep/images/design/icon_txt.png" />

					</p:commandLink>
				</p:column>

			</p:dataTable>

		</p:panel>



		<ac:templateSpec
			templateSpecBean="#{evaluationBackingBean.managedBean.templateSpecBean}" />


		<p:panel header="Scoring Offered Price" toggleable="true">
			<p:panelGrid style="margin-top:5px;width:100%;">
				<f:facet name="header">

					<p:row>
						<p:column colspan="1">Offered Price</p:column>
						<p:column colspan="1">From Variance(%)</p:column>
						<p:column colspan="1">To Variance(%)</p:column>
						<p:column>Below Variance(Score)</p:column>
						<p:column>Within Variance(Score)</p:column>
						<p:column>Above Variance(Score)</p:column>
					</p:row>
				</f:facet>

				<p:row>
					<p:column style="font-weight: bold;">By Item</p:column>
					<p:column style="font-weight: bold;">
						<h:outputText style="text-align:right;"
							value="#{evaluationBackingBean.managedBean.offerPriceItem.fromVariance}" />
					</p:column>

					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText style="text-align:right;"
							value="#{evaluationBackingBean.managedBean.offerPriceItem.toVariance}" />
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText style="text-align:right;"
							value="#{evaluationBackingBean.managedBean.offerPriceItem.belowScore}" />
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText style="text-align:right;" />
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText style="text-align:right;"
							value="#{evaluationBackingBean.managedBean.offerPriceItem.aboveScore}" />
					</p:column>
				</p:row>
			</p:panelGrid>


		</p:panel>




	</ui:define>
</ui:composition>
