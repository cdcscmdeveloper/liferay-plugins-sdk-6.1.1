<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.save']}"
				action="#{evaluationBackingBean.saveMeetingDtls}"
				icon="ui-icon-save" />

		</div>
	</p:panel>
	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.eva.summary.view.by']}" /></td>
				<td><p:selectOneMenu
						value="#{evaluationBackingBean.managedBean.summaryViewBy}">
						<f:selectItem itemLabel="Select One" itemValue="#{null}"></f:selectItem>
						<f:selectItem itemLabel="Package" itemValue="P"></f:selectItem>
						<f:selectItem itemLabel="Item" itemValue="I"></f:selectItem>
						<f:selectItem itemLabel="Preference Margin" itemValue="M"></f:selectItem>
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{evaluationBackingBean.summaryChange}"
							update="@([id$=viewSummary])"></p:ajax>
					</p:selectOneMenu></td>
			</tr>

		</table>



		<h:panelGroup id="viewSummary">

			<ui:fragment
				rendered="#{evaluationBackingBean.managedBean.summaryViewBy eq 'P'}">
				<ui:include src="summaryPackage.xhtml"></ui:include>
			</ui:fragment>

			<ui:fragment
				rendered="#{evaluationBackingBean.managedBean.summaryViewBy eq 'I'}">
				<ui:include src="summaryItem.xhtml"></ui:include>
			</ui:fragment>

			<ui:fragment
				rendered="#{evaluationBackingBean.managedBean.summaryViewBy eq 'M'}">
				<ui:include src="summaryPrefernceMargin.xhtml"></ui:include>
			</ui:fragment>
		</h:panelGroup>

	</p:panel>

</ui:composition>
