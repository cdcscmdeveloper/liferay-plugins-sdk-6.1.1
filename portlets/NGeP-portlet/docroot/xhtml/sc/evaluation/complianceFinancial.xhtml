<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:spacer height="40"></p:spacer>
	<p:panel header="#{lbl['lbl.sc.eva.compliance.fin.proposal']}"
		toggleable="true">

		<p:dataTable var="complianceFinancial" rows="10"
			id="complianceFinancialProposal" editable="true" rowIndexVar="index"
			value="#{evaluationBackingBean.managedBean.compliancefinancialCheckList}"
			rowKey="#{complianceFinancial}">
			<ac:paginator for="complianceFinancialProposal" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.title']}"
				style="width:70%;white-space: normal;">

				<h:outputText value="#{complianceFinancial.title}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.type']}"
				style="width:20%">


				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(complianceFinancial.definationType)}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
				style="width:10%">

				<p:commandButton value="#{lbl['lbl.sc.eva.btn.compliance']}"
					rendered="#{complianceFinancial.definationType.parameterCode eq 'UP'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.technicalComplianceAction(complianceFinancial)}" />


			</p:column>

		</p:dataTable>


	</p:panel>



</ui:composition>
