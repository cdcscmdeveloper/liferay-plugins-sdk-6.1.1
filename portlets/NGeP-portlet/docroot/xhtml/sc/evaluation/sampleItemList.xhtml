<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<h:panelGroup>
		<h:panelGroup id="sampleItemList">
			<p:panel header="#{lbl['lbl.sc.eva.smpl.item.list']}"
				toggleable="true">
				<p:dataTable var="sampleItem" id="techSampleEvaluateId" rows="10"
					value="#{evaluationBackingBean.managedBean.sampleItemList}"
					editable="true" rowIndexVar="index" style="width:100%"
					rowKey="#{sampleItem}">
					<ac:paginator for="techSampleEvaluateId" />


					<p:column headerText="#{lbl['lbl.sc.eva.tech.spec.item.name']}"
						style="width:70%">
						<h:outputText
							value="#{sampleItem.scRequestItem.tplSpecQuestion.clItem}"></h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.eva.samp.comp.lbl.ext.num']}"
						style="width:30%">
						<h:outputText value="#{sampleItem.scQtSampleLable.lableNo}"></h:outputText>
					</p:column>

				</p:dataTable>
				<table>


					<tr>

						<td><h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}" /></td>
						<td><p:inputText
								disabled="#{evaluationBackingBean.managedBean.readOnly}"
								value="#{evaluationBackingBean.managedBean.noOfContractsProposalScore.userScore}"
								maxlength="18" style="text-align:right">
								<ac:validateNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
									maxIntegerDigits="14" integerOnly="true" />
								<f:attribute name="min" value="0" />
								<f:attribute name="max"
									value="#{evaluationBackingBean.managedBean.userScores}" />
							</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
								value="/#{evaluationBackingBean.managedBean.userScores}" /></td>
					</tr>



				</table>

			</p:panel>
		</h:panelGroup>


		<h:panelGroup id="samplespecLists">
			<p:panel header="#{lbl['lbl.sc.eva.smpl.item.spec']}"
				toggleable="true">
				<p:dataTable var="itemspec" id="techSampleSpecId" editable="true"
					rows="10"
					value="#{evaluationBackingBean.managedBean.sampleItemList}"
					rowIndexVar="index" style="width:50%" rowKey="#{itemspec}">
					<ac:paginator for="techSampleSpecId" />


					<p:column headerText="#{lbl['lbl.sc.eva.tech.spec.specification']}"
						style="width:50%">
						<h:outputText
							value="#{itemspec.scRequestItem.tplSpecQuestion.clSpecDetail}"></h:outputText>

					</p:column>

				</p:dataTable>

			</p:panel>
		</h:panelGroup>
	</h:panelGroup>

</ui:composition>
