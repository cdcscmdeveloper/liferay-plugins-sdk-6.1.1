<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="financialCompliance" showDetail="true"
			autoUpdate="true" closable="true" severity="error,info"
			showSummary="false" />
		<div>
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.btn.save']}" style="float:right;"
				update="@all"
				action="#{evaluationBackingBean.saveComplianceUploadCheckList}" />
		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.compliance.stage.document.instruction']}" escape="false" />

			<p:dataTable var="complianceFinancialSupplier" rows="10"
				value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckList}"
				id="complianceFinancialSupplier" editable="true" rowIndexVar="index"
				style="width:100%" rowKey="#{complianceFinancialSupplier}">
				<ac:paginator for="complianceFinancialSupplier" />


				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:20%">
					<h:outputText
						value="#{complianceFinancialSupplier.scQtProposal.supplierNo}"></h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
					<ui:fragment
						rendered="#{complianceFinancialSupplier.submitted eq 'true'}">
						<p:commandLink ajax="false"
							actionListener="#{evaluationBackingBean.downloadEncryptedFile(complianceFinancialSupplier.scQtProposalChecklistAttachment)}"
							process="@this" partialSubmit="true">
							<h:graphicImage value="/css/images/design/icon_txt.png" />

						</p:commandLink>
					</ui:fragment>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.submission.status']}"
					style="width:20%">
					<h:outputText
						value="#{complianceFinancialSupplier.submitted ? lbl['lbl.txt.submitted']:lbl['lbl.txt.not.submitted']}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.compliance.status']}"
					style="width:15%">
					<p:selectOneMenu value="#{complianceFinancialSupplier.compliance}">

						<f:selectItems
							value="#{evaluationBackingBean.getDropdownCodeValues(ParameterTypeConst.complianceStatus)}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:35%">
					<ui:fragment
						rendered="#{complianceFinancialSupplier.submitted eq 'true'}">
						<p:inputTextarea rows="2" cols="40" maxlength="200"
							value="#{complianceFinancialSupplier.remark}"></p:inputTextarea>
					</ui:fragment>
				</p:column>
			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
