<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="financialCompliance" showDetail="true"
			autoUpdate="true" closable="true" severity="error,info"
			showSummary="false" />
		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" update="@all"
				action="#{evaluationBackingBean.saveFinacialCompliance}" />
		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.eva.comp.sup.list']}" toggleable="true">

			<p:dataTable var="complianceFinancialSupplier"
				value="#{evaluationBackingBean.managedBean.complianceFinancialProposalCheckList}"
				id="complianceFinancialSupplier" editable="true" rowIndexVar="index"
				style="width:100%" rowKey="#{complianceFinancialSupplier}">
				<ac:paginator for="complianceFinancialSupplier" />


				<p:column headerText="#{lbl['lbl.sc.eva.comp.sup.code']}"
					style="width:20%">
					<h:outputText
						value="#{complianceFinancialSupplier.scQtProposal.supplierNo}"></h:outputText>

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
						<ui:fragment rendered="#{complianceFinancialSupplier.submitted eq 'true'}">
					<p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadDocuments(complianceTechnicalSupplier)}"
						process="@this" partialSubmit="true">
						<p:graphicImage library="ep/images/design"
							value="/resources/ep/images/design/icon_txt.png" />

					</p:commandLink>
					</ui:fragment>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.sub.status']}"
					style="width:20%">
					<h:outputText
						value="#{complianceFinancialSupplier.submitted ? 'Submitteed' : 'Not Submitted'}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.compliance.status']}"
					style="width:15%">
					<p:selectOneMenu value="#{complianceFinancialSupplier.compliance}">

						<f:selectItems
							value="#{evaluationBackingBean.getDropdownCodeValues(ParameterTypeConst.complianceStatus)}"></f:selectItems>
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}"
					style="width:35%">
					<ui:fragment rendered="#{complianceFinancialSupplier.submitted eq 'true'}">
					<p:inputTextarea rows="2" cols="40" maxlength="200"
						value="#{complianceFinancialSupplier.remark}"></p:inputTextarea>
						</ui:fragment>
				</p:column>
			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
