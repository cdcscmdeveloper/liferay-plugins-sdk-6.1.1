<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.content']}" toggleable="true">
		<p:dataTable var="scQtEvaluationReport" id="evaluationreport"
			widgetVar="documentWidget"
			value="#{evaluationBackingBean.managedBean.scQtEvaluationReportList}"
			selection="#{evaluationBackingBean.managedBean.selectedScQtEvaluationReports}"
			rowKey="#{scQtEvaluationReport}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="evaluationreport" />

			<p:column headerText="#{lbl['lbl.sc.content']}"
				style="width:58%;white-space: normal;">
				<h:outputText value="#{scQtEvaluationReport.title}" />
			</p:column>

			<p:column style="width:14%;white-space: normal;"
				headerText="#{lbl['lbl.sc.type']}">
				#{evaluationBackingBean.getParameterDesc(scQtEvaluationReport.definationType)}
			</p:column>

			<p:column style="width:10%;text-align: center;"
				headerText="#{lbl['lbl.sc.action']}">
				<p:commandLink
					rendered="#{!evaluationBackingBean.managedBean.readOnly}"
					action="#{evaluationBackingBean.showTemplateAction(scQtEvaluationReport)}">
					<h:graphicImage value="/css/images/design/edit.png"
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'TD'}" />
				</p:commandLink>
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{evaluationBackingBean.downloadReport(scQtEvaluationReport)}" />
			</p:column>

		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
				styleClass="BtnSpacing" style="float:right;"
				action="#{evaluationBackingBean.downloadAllReports}" />
		</div>
	</p:panel>





	<table style="width: 100%">
		<tr>
			<td><ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" update="@form" />
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.setTabValue('4','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" update="@form" />
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'OC'}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.setTabValue('4','1')}"
						action="#{evaluationBackingBean.updateSmAppl}" update="@form" />
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.setTabValue('4','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" update="@form" />
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and !evaluationBackingBean.managedBean.scQt.demoRequired}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" update="@form" />
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" update="@form" />
				</ui:fragment></td>
			<td><p:commandButton value="#{lbl['lbl.btn.next']}" ajax="false"
					style="float:right;" styleClass="BtnSpacing"
					actionListener="#{evaluationBackingBean.setTabValue('4','5')}"
					action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
					update="@form" /></td>
		</tr>
	</table>
</ui:composition>
