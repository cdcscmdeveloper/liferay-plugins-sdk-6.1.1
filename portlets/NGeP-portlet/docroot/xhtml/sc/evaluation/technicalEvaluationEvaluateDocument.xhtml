<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>
			<p:messages id="technicalEvaluationUploadDtlsId" autoUpdate="true"
				closable="true" showDetail="true" showSummary="false"
				severity="error,info"></p:messages>
			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{evaluationBackingBean.evaluationBackaction}" />

				<p:commandButton value="#{lbl['lbl.btn.save']}" style="float:right;"
					update="@all"
					action="#{evaluationBackingBean.saveEvalutionStageUploadDtls}" />
			</div>
			<p:spacer height="25" />
			<br />
			<br />

			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel></td>
					<td><p:inputTextarea style="width:100%"
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>



			<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
				<p:dataTable var="complianceTechnicalSupplier" rows="10"
					value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckList}"
					id="complianceTechnicalSupplier" editable="true"
					rowIndexVar="index" style="width:100%"
					rowKey="#{complianceTechnicalSupplier}">
					<ac:paginator for="complianceTechnicalSupplier" />


					<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
						style="width:20%">

						<h:outputText
							value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}"></h:outputText>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
						<ui:fragment
							rendered="#{complianceTechnicalSupplier.submitted eq 'true'}">
							<p:commandLink ajax="false"
								actionListener="#{evaluationBackingBean.downloadEncryptedFile(complianceTechnicalSupplier.scQtProposalChecklistAttachment)}"
								process="@this" partialSubmit="true">
								<h:graphicImage value="/css/images/design/icon_txt.png" />
							</p:commandLink>
						</ui:fragment>

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.submission.status']}"
						style="width:15%">
						<h:outputText
							value="#{complianceTechnicalSupplier.submitted ? lbl['lbl.txt.submitted']: lbl['lbl.txt.not.submitted']}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.compliance.status']}"
						style="width:15%">
						<h:outputText
							value="#{complianceTechnicalSupplier.compliance ? lbl['lbl.sc.compliance']:lbl['lbl.sc.not.compliance']}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.user.scoring']}"
						style="width:15%">
						<p:inputText value="#{complianceTechnicalSupplier.totalUserScore}"
							id="technicaluploadNoActionUserScoreId"
							label="#{lbl['lbl.sc.user.scoring']}" style="text-align:right;"
							size="40" maxlength="18" required="true"
							disabled="#{evaluationBackingBean.managedBean.readOnly}">
							<ac:validateNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
								maxIntegerDigits="14" integerOnly="true" />
							<f:attribute name="min" value="0" />
							<f:attribute name="max"
								value="#{evaluationBackingBean.managedBean.userScores}" />
						</p:inputText>
						<p:spacer width="5"></p:spacer>
						<h:outputText
							value="/#{evaluationBackingBean.managedBean.userScores}" />
						<p:message id="technicaluploadNoActionUserScoreMessage"
							for="technicaluploadNoActionUserScoreId" display="icon"></p:message>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:25%">
						<ui:fragment
							rendered="#{complianceTechnicalSupplier.submitted eq 'true'}">
							<p:inputTextarea rows="2" cols="40" maxlength="200"
								disabled="#{evaluationBackingBean.managedBean.readOnly}"
								value="#{complianceTechnicalSupplier.remark}"></p:inputTextarea>
						</ui:fragment>
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:panelGroup>
	</ui:define>
</ui:composition>
