<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<ui:define name="contentSection">
		<p:messages id="evaluateMessages" showDetail="true" autoUpdate="true"
			showSummary="false" closable="true" severity="error, info,warn" />
		<ac:gpkiPopup textBeforeSign="#{evaluationBackingBean.textBeforeSign}"
			postSignAction="#{evaluationBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />
		<ui:fragment
			rendered="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.tabActiveIndex eq 1 and !evaluationBackingBean.managedBean.readOnly and (evaluationBackingBean.managedBean.complianceActiveIndex eq '2' or evaluationBackingBean.managedBean.complianceActiveIndex eq '3')) or (evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.tabActiveIndex eq 0  and !evaluationBackingBean.managedBean.readOnly) or (evaluationBackingBean.managedBean.committeeType eq 'FEC' and evaluationBackingBean.managedBean.tabActiveIndex eq 0 and !evaluationBackingBean.managedBean.readOnly))}">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.generate']}"
				style="float:right;" update="@form"
				rendered="#{evaluationBackingBean.managedBean.generateEvaluationButton eq 'false'}"
				action="#{evaluationBackingBean.generateEvaluationStage}" />
		</ui:fragment>

		<ui:fragment
			rendered="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5}">
			<ui:repeat var="bpmAction"
				value="#{evaluationBackingBean.managedBean.outComes}">
				<ui:param name="buttonLabel"
					value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
					style="float:right;" process="@all" partialSubmit="true"
					action="#{evaluationBackingBean.submitPrepareEvaluationDetails(bpmAction)}" />
			</ui:repeat>
		</ui:fragment>
		<p:commandButton value="#{lbl['lbl.sc.eva.btn.save']}"
			disabled="#{evaluationBackingBean.managedBean.readOnly}"
			style="float:right;" process="@form" update="@form"
			action="#{evaluationBackingBean.saveMeetingDtls(true)}" />

		<p:dialog id="reviceApprovalDlgs" widgetVar="reviceApprovalDlgs"
			header="Revice Confirmation" resizable="false" width="325"
			height="75" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="Are you sure to send for Revise?" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviceApprovalDlgs.hide();"
					action="#{evaluationBackingBean.reviseProposalEvaluation}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviceApprovalDlgs.hide();" type="button" />
			</div>
		</p:dialog>
		<p:spacer height="25"></p:spacer>

		<ui:include src="evaluationstage1include.xhtml" />

		<ui:include src="evaluationHeader.xhtml" />



		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0}">
			<ui:include src="prepare.xhtml" />

		</c:if>
		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1}">


			<ui:include src="complianceStage.xhtml" />
		</c:if>

		<c:if
			test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 2 and evaluationBackingBean.managedBean.evaluationStageStatusHide}">

			<ui:include src="evaluationStage.xhtml" />
		</c:if>


		<c:if
			test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3 and evaluationBackingBean.managedBean.evaluationStageStatusHide}">

			<ui:include src="presentationDemoStage.xhtml" />
		</c:if>


		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 4}">
			<ui:include src="report.xhtml" />
		</c:if>
		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5}">
			<!-- 	<ui:param name="committeeActivityList"
				value="#{evaluationBackingBean.managedBean.endorscommitteeMemberList}"></ui:param>

			<ui:include src="/xhtml/sc/specification/specificationSignoff.xhtml" /> -->
			<ui:include src="signoff.xhtml" />

		</c:if>

		<ui:include src="uploadEvaluation.xhtml"></ui:include>
	</ui:define>

</ui:composition>
