<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<ui:define name="contentSection">

		<p:commandButton value="#{lbl['lbl.sc.eva.btn.generate']}"
			style="float:right;" icon="ui-icon-evaluate" update="@form"
			rendered="#{evaluationBackingBean.managedBean.generateEvaluationButton eq 'false'}"
			action="#{evaluationBackingBean.generateEvaluationStage}" />

		<ui:repeat var="bpmAction"
			value="#{evaluationBackingBean.managedBean.outComes}">
			<ui:param name="buttonLabel"
				value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
			<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
				style="float:right;" process="@all" partialSubmit="true"
				icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
				action="#{evaluationBackingBean.submitPrepareEvaluationDetails(bpmAction)}" />
		</ui:repeat>

		<p:commandButton value="#{lbl['lbl.sc.eva.btn.save']}"
			style="float:right;"
			action="#{evaluationBackingBean.saveMeetingDtls}" icon="ui-icon-save" />
		<p:spacer height="25"></p:spacer>
		<ui:include src="evaluationstage1include.xhtml" />

		<ui:include src="evaluationHeader.xhtml" />



		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0}">
			<ui:include src="prepare.xhtml" />

		</c:if>
		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1}">


			<ui:include src="complianceStage.xhtml" />
		</c:if>

		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 2}">

			<ui:include src="evaluationStage.xhtml" />
		</c:if>


		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3}">

			<ui:include src="presentationDemoStage.xhtml" />
		</c:if>


		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 4}">
			<ui:include src="report.xhtml" />
		</c:if>
		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5}">
			<ui:include src="signoff.xhtml" />
		</c:if>


	</ui:define>

</ui:composition>
