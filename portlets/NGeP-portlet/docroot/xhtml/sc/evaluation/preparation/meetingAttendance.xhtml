<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:panel id="evaluationPreparationMeetingAttendanceIds" header="#{lbl['lbl.sc.join.in']}" toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.join.in.instruction']}" escape="false" />

		<p:dataTable var="meetingAttendance" id="turuthadir" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			widgetVar="tirutWidget"
			value="#{evaluationBackingBean.managedBean.meetingAttendanceList}"
			selection="#{evaluationBackingBean.managedBean.meetingAttendanceSelectList}"
			editable="true" rowIndexVar="index" rowKey="#{meetingAttendance}">
			<ac:paginator for="turuthadir" />



			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=evaluationPreparationMeetingAttendanceIds])"
							listener="#{evaluationBackingBean.selectAll(evaluationBackingBean.managedBean.templateSpecBean.selectAll, evaluationBackingBean.managedBean.meetingAttendanceList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{meetingAttendance.selected}">
					<p:ajax partialSubmit="true" process="@this"  update="@([id$=evaluationPreparationMeetingAttendanceIds])" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="width:50%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly }">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.name']}" />
				</f:facet>
				<p:inputText size="55" value="#{meetingAttendance.name}"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					id="attendanceNameId" required="true" label="#{lbl['lbl.sc.name']}"
					maxlength="50">
					<p:ajax event="change" process="@this" partialSubmit="true" update="@this"></p:ajax>
					</p:inputText>
				<p:message id="attendanceNameMessageId" for="attendanceNameId"
					display="icon"></p:message>


			</p:column>
			<p:column style="width:47%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly }">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.identification.no']}" />
				</f:facet>

				<p:inputText size="55" value="#{meetingAttendance.icPassport}"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					id="attendacePassportId" required="true"
					label="#{lbl['lbl.sc.identification.no']}" maxlength="15">
					<p:ajax event="change" process="@this" partialSubmit="true" update="@this"></p:ajax>
					</p:inputText>
				<p:message id="attendancePassportMessageId"
					for="attendacePassportId" display="icon"></p:message>

			</p:column>



		</p:dataTable>

		<div align="right">
			<p:commandButton id="turutbutton" styleClass="BtnSpacing"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				value="#{lbl['lbl.btn.add']}" process="@this,turuthadir"
				partialSubmit="true" update="turuthadir"
				oncomplete="tirutWidget.paginator.endLink.click();"
				action="#{evaluationBackingBean.addTurutDetails}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				styleClass="BtnSpacing" id="evaluationpreparationMeetingAttendanceDeleteBtnId"
				disabled="#{evaluationBackingBean.managedBean.readOnly or evaluationBackingBean.deleteselectedList(evaluationBackingBean.managedBean.meetingAttendanceList)}"
				oncomplete="evaluationMeetingAttendanceDeletePopUp.show();"
				update="@([id$=#{evaluationmeetingAttendanceDeleteId}])"
				process="@this" partialSubmit="true">
				<f:setPropertyActionListener
					target="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>

		</div>
		<ui:param name="evaluationmeetingAttendanceDeleteId"
			value="evaluationmeetingAttendanceDeleteId"></ui:param>
		<ac:confirmationPopup id="#{evaluationmeetingAttendanceDeleteId}"
			widget="evaluationMeetingAttendanceDeletePopUp" width="490"
			height="100"
			okAction="evaluationBackingBean.deleteMeetingAttendanceDtls"
			title="#{lbl['lbl.sc.join.in']}"
			content="#{lbl['lbl.sc.dialog.confirm.meeting.attendance.dtls']}"
			update="@([id$=evaluationPreparationMeetingAttendanceIds])" />

	</p:panel>





</ui:composition>
