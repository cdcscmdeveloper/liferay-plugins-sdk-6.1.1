<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" class="sidemenutd" valign="top"><p:tabMenu
					styleClass="sidemenu"
					activeIndex="#{evaluationBackingBean.managedBean.prepareActiveIndex}">

					<p:menuitem value="#{lbl['lbl.sc.general.info']}"
						action="#{evaluationBackingBean.retrieveGeneralInfo}"
						update="@form" />

					<p:menuitem value="#{lbl['lbl.sc.meeting.details']}"
						action="#{evaluationBackingBean.retriveMeetingDtls(null,evaluationBackingBean.managedBean.committeeType,1)}"
						update="@form" />

					<p:menuitem
						value="#{evaluationBackingBean.getParameterDesc(ParameterTypeConst.scCommitteeType, 
											evaluationBackingBean.managedBean.committeeType)}"
						action="#{evaluationBackingBean.retriveOpeningCommitteeDtls(2)}"
						update="@form" />

					<p:menuitem value="#{lbl['lbl.sc.join.in']}"
						action="#{evaluationBackingBean.retriveTurutHadirDtls(3)}"
						update="@form" />
				</p:tabMenu></td>
			<td width="80%" valign="top"><c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '0'}">
					<ui:include src="generalInfo.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '1'}">

					<ui:include src="meetingDetails.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '2'}">

					<ui:include src="committeeActivityDetails.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '3'}">

					<ui:include src="meetingAttendance.xhtml"></ui:include>
				</c:if></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td></td>
			<td><ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' or evaluationBackingBean.managedBean.committeeType eq 'OC'}">
					<p:commandButton value="#{lbl['lbl.btn.next']}" iconPos="right"
						styleClass="BtnSpacing" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" style="float:right;"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex(0,1)}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</ui:fragment> <ui:fragment
					rendered="#{((evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.evaluationStageStatusHide) or (evaluationBackingBean.managedBean.committeeType eq 'FEC' and evaluationBackingBean.managedBean.evaluationStageStatusHide))}">
					<p:commandButton value="#{lbl['lbl.btn.next']}" iconPos="right"
						styleClass="BtnSpacing" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" style="float:right;"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex(0,2)}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</ui:fragment> <ui:fragment
					rendered="#{((evaluationBackingBean.managedBean.committeeType eq 'TEC' and !evaluationBackingBean.managedBean.evaluationStageStatusHide) or (evaluationBackingBean.managedBean.committeeType eq 'FEC' and !evaluationBackingBean.managedBean.evaluationStageStatusHide))}">
					<p:commandButton value="#{lbl['lbl.btn.next']}" iconPos="right"
						styleClass="BtnSpacing" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();" style="float:right;"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex(0,4)}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</ui:fragment></td>
		</tr>
	</table>

</ui:composition>
