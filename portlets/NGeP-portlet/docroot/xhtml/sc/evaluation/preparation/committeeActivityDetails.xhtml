<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.committee.member.list']}"
		toggleable="true">

		<p:dataTable id="evaluationpreparecommittee" var="committeeMember"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" rowKey="#{committeeMember.qtCommitteeActivityId}"
			value="#{evaluationBackingBean.managedBean.committeeMemberList}"
			selection="#{evaluationBackingBean.managedBean.committeeActivitymultiSelect}" rowIndexVar="index">
			<ac:paginator for="evaluationpreparecommittee" />

			<p:column style="width:18%;white-space: normal" headerText="#{lbl['lbl.sc.name']}">
				<h:outputText
					value="#{committeeMember.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal" headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText
					value="#{committeeMember.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>
			<p:column style="width:15%;white-space: normal" headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText
					value="#{committeeMember.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column style="width:17%;white-space: normal" headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeeMember.scCommitteeMember.email}"></h:outputText>
			</p:column>
			<p:column style="width:10%" headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeeMember.scCommitteeMember.grade}"></h:outputText>
			</p:column>
			<p:column style="width:8%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="pnp#{index}OC" value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[committeeMember.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column style="width:15%" headerText="#{lbl['lbl.sc.role']}">
				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(committeeMember.scCommitteeMember.memberRole)}"></h:outputText>
			</p:column>
			<p:column style="width:2%;text-align: center;" headerText="#{lbl['lbl.sc.attendance']}">
				<p:selectBooleanCheckbox
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					value="#{committeeMember.attended}" />
			</p:column>


		</p:dataTable>

	</p:panel>
	
	<ac:scRemarkAndAttachment
		remarkList="#{evaluationBackingBean.managedBean.qtCommitteeRemarks}"
		showAttachment="false" />

</ui:composition>
