<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	




	<p:panel header="#{lbl['lbl.sc.meeting.details']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.meeting.details.instruction']}" escape="false" />

		<p:dataTable var="meeting" id="evaluationmeetingDetails" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			widgetVar="evaluationMeeting"
			value="#{evaluationBackingBean.managedBean.scQtMeetings}"
			selection="#{evaluationBackingBean.managedBean.meetingMultiSelect}"
			editable="true" rowIndexVar="index" rowKey="#{meeting}">
			<ac:paginator for="evaluationmeetingDetails" />

			<!-- 	<p:column selectionMode="multiple" style="width:2%"></p:column> -->

			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						disabled="#{evaluationBackingBean.managedBean.readOnly}"
						value="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="evaluationmeetingDetails"
							listener="#{evaluationBackingBean.selectEvaluationMeetingAll(evaluationBackingBean.managedBean.templateSpecBean.selectAll, evaluationBackingBean.managedBean.scQtMeetings)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					value="#{meeting.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.meeting.date']}"
				style="width:20%">

				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.meeting.date']}" />
				</f:facet>
				<p:calendar value="#{meeting.meetingDate}" showOn="button"
					mindate="#{evaluationMeetingBackingBean.managedBean.today}"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					id="evaluationMeetingId" label="#{lbl['lbl.sc.meeting.date']}"
					required="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"></p:calendar>
				<p:message id="meetingEvaluationid" for="evaluationMeetingId"
					display="icon"></p:message>

			</p:column>
			<p:column style="width:33%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly }">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.meeting.location']}" />
					<ac:iconTooltip id="meetingDtls#{index}" value="#{lbl['lbl.sc.meeting.location.tooltip']}" />
				</f:facet>

				<p:inputTextarea value="#{meeting.meetingLocation}" rows="2"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					maxlength="255" cols="40" id="evaluationMeetingLocation"
					required="true" label="#{lbl['lbl.sc.meeting.location']}"></p:inputTextarea>
				<p:message id="meetingEvaluationLocationid"
					for="evaluationMeetingLocation" display="icon"></p:message>
			</p:column>


			<p:column style="width:10%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.status']}" />
				</f:facet>

				<p:selectOneMenu id="meetingstatus" required="true"
					style="width:100px;"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					label="#{lbl['lbl.sc.status']}"
					value="#{meeting.meetingStatusStr}">
					<f:selectItems
						value="#{evaluationMeetingBackingBean.getStatusDropdownValues('SC', 'MS')}" />
					<p:ajax partialSubmit="true" process="@this" update="@this" listener="#{suppFinalizationBackingBean.changeMeetingStatus(meeting)}"/>
				</p:selectOneMenu>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:34%">


				<p:inputTextarea value="#{meeting.remark}" rows="2" cols="40"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					maxlength="100" />

			</p:column>


		</p:dataTable>
		
		<div align="right">
			<p:commandButton id="meetingbutton" styleClass="BtnSpacing"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				value="#{lbl['lbl.btn.add']}"
				oncomplete="evaluationMeeting.paginator.endLink.click();"
				process="@this,evaluationmeetingDetails" partialSubmit="true"
				action="#{evaluationBackingBean.addMeetingAction}"
				update="evaluationmeetingDetails" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				process="@this" partialSubmit="true"
				oncomplete="evaluationMeetingDtlsDeletePopUp.show();"
				update="@([id$=#{evaluationmeetingdtlsDeleteId}])">
				<f:setPropertyActionListener
					target="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>

		</div>
		<ui:param name="evaluationmeetingdtlsDeleteId"
			value="evaluationmeetingdtlsDeleteId"></ui:param>
		<ac:confirmationPopup id="#{evaluationmeetingdtlsDeleteId}"
			widget="evaluationMeetingDtlsDeletePopUp" width="480" height="100"
			okAction="evaluationBackingBean.deleteMeetingDtls"
			title="#{lbl['lbl.sc.meeting.details']}"
			content="#{lbl['lbl.sc.dialog.confirm.meeting.dtls']}"
			update="@([id$=evaluationmeetingDetails])" />

	</p:panel>



</ui:composition>
