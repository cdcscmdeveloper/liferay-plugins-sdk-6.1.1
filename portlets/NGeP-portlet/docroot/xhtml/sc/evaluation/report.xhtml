<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	
<ui:include src="/xhtml/sc/evaluation/uploadEvaluation.xhtml" />

	<p:panel header="#{lbl['lbl.sc.eva.report.contents']}"
		toggleable="true">
		<p:dataTable id="evaluationreport" width="100%" cellpadding="1"
			rowIndexVar="rowIndex"
			value="#{evaluationBackingBean.managedBean.evaluationReportListItems}"
			var="item1">
			<ac:paginator for="evaluationreport" />
			<p:columnGroup type="header">
				<p:row>
					<p:column colspan="1" rendered="true"
						style="text-align:left; vertical-align:top;"
						headerText="#{lbl['lbl.sc.eva.report.content']}">
					</p:column>
					<p:column colspan="1" rendered="true"
						style="text-align:left; vertical-align:top;"
						headerText="#{lbl['lbl.sc.eva.report.type']}">
					</p:column>
					<p:column colspan="1" rendered="true"
						style="text-align:left; vertical-align:top;"
						headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}">
					</p:column>
				</p:row>
			</p:columnGroup>
			<p:subTable id="supplierItemTable1#{rowIndex}" var="supplierItem1"
				value="#{item1.supplierItems}">
				<!-- <f:facet name="header">
					<h:outputText value="#{item1.itemName}" /> :   
				            	
				            </f:facet> -->
				<p:column>  
				                #{supplierItem1.remarks}  
				            </p:column>
				<p:column>
					<h:outputText value="Appendix"></h:outputText>
				</p:column>
				<p:column>
					<p:commandLink ajax="false" process="@this" partialSubmit="true"
						value="#{lbl['lbl.sc.eva.report.download']}"
						actionListener="#{evaluationBackingBean.reportDownLoad}">

					</p:commandLink>
				</p:column>

			</p:subTable>
		</p:dataTable>
		<div align="right" style="width: 80%">
			<p:commandButton ajax="false"
				value="#{lbl['lbl.sc.eva.report.download.all']}"
				actionListener="#{evaluationBackingBean.reportDownLoadZipFile}" />

		</div>


	</p:panel>

	<p:panel header="#{lbl['lbl.sc.eva.report.eva.report']}">
		<h:panelGrid columns="2">

			<p:outputLabel value="#{lbl['lbl.sc.eva.report.attachment']}"></p:outputLabel>

			<h:panelGroup>

				
				<p:commandButton onclick="uploadDlg.show();return false;" ajax="false" process="@this" partialSubmit="true"
					icon="iconAttachment" update="reportMangaFile" 
					value="Attach file(s)" actionListener="#{evaluationBackingBean.reportUpload}"/>

			</h:panelGroup>
			
			
			<h:panelGrid columns="3" id="evaluationReport">

			<p:spacer width="40"></p:spacer>
			<p:outputLabel id="evauploadfile"
				value="#{evaluationBackingBean.managedBean.fileName}"></p:outputLabel>
			<p:commandLink actionListener="#{evaluationBackingBean.removeFile}"
				process="@this,evaluationReport" update="evaluationReport" partialSubmit="true"
				style="width:40%;">
				<p:graphicImage library="ep/images/design" name="delete.png"
					value="/resources/ep/images/design/delete.png" />

			</p:commandLink>

		</h:panelGrid>
		</h:panelGrid>



	</p:panel>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">



					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('4','5')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
				</div></td>
		</tr>
	</table>


</ui:composition>
