<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.eva.report.contents']}"
		toggleable="true">
		<p:dataTable var="scQtEvaluationReport" id="evaluationreport"
			widgetVar="documentWidget"
			value="#{evaluationBackingBean.managedBean.scQtEvaluationReportList}"
			selection="#{evaluationBackingBean.managedBean.selectedScQtEvaluationReports}"
			rowKey="#{scQtEvaluationReport}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="evaluationreport" />

			<p:column headerText="#{lbl['lbl.sc.eva.report.content']}"
				style="width:58%">
				<h:outputText value="#{scQtEvaluationReport.title}" />
			</p:column>

			<p:column style="width:10%;"
				headerText="#{lbl['lbl.sc.eva.report.type']}">
				#{evaluationBackingBean.getParameterDesc(scQtEvaluationReport.definationType)}
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.so.action']}">
				<p:commandLink
					action="#{evaluationBackingBean.showTemplateAction(scQtEvaluationReport)}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png"
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'TD'}" />
				</p:commandLink>
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{evaluationBackingBean.downloadReport(scQtEvaluationReport)}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton icon="ui-icon-download"
				value="#{lbl['lbl.btn.download.all']}" ajax="false"
				action="#{evaluationBackingBean.downloadAllReports}" />
		</div>
	</p:panel>


	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC'}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>

					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'OC'}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','1')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>

					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','3')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>
					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and !evaluationBackingBean.managedBean.scQt.demoRequired}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>
					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>
				</div></td>
			<td>
				<div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('4','5')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
				</div>
			</td>
		</tr>
	</table>
</ui:composition>
