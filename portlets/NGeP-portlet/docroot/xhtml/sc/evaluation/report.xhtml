<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.eva.report.contents']}"
		toggleable="true">
		<p:dataTable var="scQtEvaluationReport" id="evaluationreport"
			widgetVar="documentWidget"
			value="#{evaluationBackingBean.managedBean.scQtEvaluationReportList}"
			selection="#{evaluationBackingBean.managedBean.selectedScQtEvaluationReports}"
			rowKey="#{scQtEvaluationReport}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="evaluationreport" />

			<p:column headerText="#{lbl['lbl.sc.eva.report.content']}"
				style="width:58%">
				<h:outputText value="#{scQtEvaluationReport.title}" />
			</p:column>

			<p:column style="width:10%;"
				headerText="#{lbl['lbl.sc.eva.report.type']}">
				#{evaluationBackingBean.getParameterDesc(scQtEvaluationReport.definationType)}
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.so.action']}">
				<p:commandLink
					action="#{evaluationBackingBean.showTemplateAction(scQtEvaluationReport)}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png"
						rendered="#{scQtEvaluationReport.definationType.parameterCode eq 'TD'}" />
				</p:commandLink>
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{evaluationBackingBean.downloadReport(scQtEvaluationReport)}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton icon="ui-icon-download"
				value="#{lbl['lbl.btn.download.all']}" ajax="false"
				action="#{evaluationBackingBean.downloadAllReports}" />
		</div>
	</p:panel>

	<p:panel header="#{evaluationBackingBean.managedBean.reportHeader}"
		toggleable="true" id="evauploadfile">
		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" style="width: 100px;"><p:outputLabel
						value="#{lbl['lbl.sc.eva.report.attachment']}" /></td>
				<td class="TableFieldRight">
					<table>
						<tr>
							<td colspan="2"><p:commandButton onclick="uploadDlg.show();"
									value="#{lbl['lbl.txt.attach.files']}" icon="iconAttachment"
									partialSubmit="true" process="@this"
									update="@([id$=evauploadfile])">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attachedIds"
									value="#{evaluationBackingBean.managedBean.scQtEvaluationReport.scQtEvaluationReportAttachment}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage library="ep/images/design"
													name="#{evaluationBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{evaluationBackingBean.downloadFile(attachFile)}" />
												<p:commandLink
													action="#{evaluationBackingBean.deleteUploadFile}"
													immediate="true" update="attachedIds">
													<h:graphicImage library="ep/images/design" name="trash.png"
														styleClass="tasklist_title1" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="uploadDlgids" widgetVar="uploadDlg" modal="true"
		resizable="false" width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.txt.choose.files']}">

		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{evaluationBackingBean.handleFileUpload}"
			mode="advanced" id="dlgsuploadids"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="evauploadfile" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType ne 'TEC'}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>

					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
						<p:commandButton value="#{lbl['lbl.sm.prev']}"
							actionListener="#{evaluationBackingBean.setTabValue('4','3')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-prev" update=":form" />
					</ui:fragment>
				</div></td>
			<td>
				<div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('4','5')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
				</div>
			</td>
		</tr>
	</table>
</ui:composition>
