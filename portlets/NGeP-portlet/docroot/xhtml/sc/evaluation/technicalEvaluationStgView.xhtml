<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

		</div>
		<p:spacer height="75"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true" style="width:100%"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.eva.comp.sup.list']}" toggleable="true">

			<p:dataTable var="complianceTechnicalSupplier" rows="10"
				value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckList}"
				id="complianceTechnicalSupplier" editable="true" rowIndexVar="index"
				style="width:100%" rowKey="#{complianceTechnicalSupplier}">
				<ac:paginator for="complianceTechnicalSupplier" />


				<p:column headerText="#{lbl['lbl.sc.eva.comp.sup.code']}"
					style="width:20%">

					<h:outputText
						value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
					<h:outputText></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.sub.status']}"
					style="width:20%">
					<h:outputText
						value="#{evaluationBackingBean.getStatusDescById(complianceTechnicalSupplier.scQtCheckList.pmStatus.statusId)}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.compliance.status']}"
					style="width:15%">
					<h:outputText value="#{complianceTechnicalSupplier.compliance}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}"
					style="width:35%">
					<p:inputTextarea rows="2" cols="40"
						value="#{complianceTechnicalSupplier.remark}" disabled="true"></p:inputTextarea>
				</p:column>
			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
