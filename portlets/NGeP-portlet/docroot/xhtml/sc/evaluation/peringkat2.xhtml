<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="Peringkat2" widgetVar="peringkat2" modal="true"
		width="1000" height="600">
		<p:panel id="s2Techpopup" header="#{lbl['lbl.sc.eva.s2.peng.head']}" toggleable="true">

			<h:panelGrid columns="2">

				<h:outputLabel value="#{lbl['lbl.sc.eva.s1.manual.supplier']}"></h:outputLabel>

				<p:inputText value="#{evaluationBackingBean.managedBean.scQtEvaluationResult.scQtProposal.supplierNo}" readonly="true"></p:inputText>


				<p:outputLabel value="#{lbl['lbl.sc.eva.s1.tech.ovearall.score']}" />

				<p:inputText value="Readonly" readonly="true"></p:inputText>



			</h:panelGrid>
	
			<ac:templateSpec templateSpecBean="#{evaluationBackingBean.managedBean.templateSpecBean}" />
		</p:panel>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.cancel']}" style="float:right;"
				onclick="peringkat2.hide();" icon="ui-icon-cancel"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.save']}" style="float:right;" action="#{evaluationBackingBean.stageTwoSaveAction}" process="@all"
				oncomplete="peringkat2.hide()"
			 icon="ui-icon-save"></p:commandButton>


		</div>

	</p:dialog>
	
	
	
		
</ui:composition>
