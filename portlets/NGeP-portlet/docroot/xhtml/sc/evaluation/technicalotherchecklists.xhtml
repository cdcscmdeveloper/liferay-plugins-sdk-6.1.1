<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>
			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
			<p:messages id="technicalEvaluationmsgId" autoUpdate="true"
				closable="true" showDetail="true" showSummary="false" severity="error, info"></p:messages>
			<h:panelGroup>
				<div>
					<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
						update="@form" immediate="true"
						action="#{evaluationBackingBean.technicalBackaction}" />
					<ui:param name="checklistScoreType"
						value="#{evaluationBackingBean.managedBean.checklistScoreType}"></ui:param>
					<ui:param name="companyScoreType"
						value="#{evaluationBackingBean.managedBean.companyScoreType}"></ui:param>
					<ui:include src="financialotherchecklistbuttons.xhtml"></ui:include>

				</div>
			</h:panelGroup>
			<p:spacer height="25" />
			<br />
			<br />
			<ui:include src="evaluationHeader.xhtml" />
			<br />
			<p:panel header="#{lbl['lbl.sc.eva.technical.proposal.evaluation']}">
				<ui:include src="supplierChecklistHeader.xhtml" />
			</p:panel>
			<br />


			<p:panel header="#{lbl['lbl.sc.compliance.list']}" toggleable="true"
				collapsed="true">
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.eva.evaluation.stage.document.instruction']}"
					escape="false" />

				<p:dataTable var="cashHand" id="complianceTech" rows="10"
					value="#{evaluationBackingBean.managedBean.technicalComplinaceList}"
					rowIndexVar="index" style="width:100%" rowKey="#{cashHand}">
					<ac:paginator for="complianceTech" />


					<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
						style="width:90%">
						<h:outputText value="#{cashHand.scQtCheckList.title}"></h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
						<p:commandLink ajax="false"
							actionListener="#{evaluationBackingBean.downloadEncryptedFile(cashHand.scQtProposalChecklistAttachment)}"
							process="@this" partialSubmit="true">
							<h:graphicImage value="/css/images/design/icon_txt.png" />

						</p:commandLink>

					</p:column>

				</p:dataTable>

			</p:panel>
			<p:spacer height="25"></p:spacer>
			<h:panelGroup>
				<ui:param name="statusHide"
					value="#{evaluationBackingBean.managedBean.statusHide}"></ui:param>
				<ui:param name="checklistScoreType"
					value="#{evaluationBackingBean.managedBean.checklistScoreType}"></ui:param>
				<ui:param name="companyScoreType"
					value="#{evaluationBackingBean.managedBean.companyScoreType}"></ui:param>
				<ui:param name="noOfContracts"
					value="#{evaluationBackingBean.managedBean.noOfContractsProposalScore}"></ui:param>
				<ui:param name="noOfYears"
					value="#{evaluationBackingBean.managedBean.noOfyearsProposalScore}"></ui:param>
				<ui:param name="contractUserScore"
					value="#{evaluationBackingBean.managedBean.userScores}"></ui:param>
				<ui:param name="yearsUserScore"
					value="#{evaluationBackingBean.managedBean.contractScores}"></ui:param>
				<ui:param name="pageDisable"
					value="#{evaluationBackingBean.managedBean.readOnly}"></ui:param>
				<ui:include src="#{evaluationBackingBean.managedBean.proposalPage}"></ui:include>
				<p:spacer height="25"></p:spacer>
				<ui:include
					src="#{evaluationBackingBean.managedBean.evaluationPage}"></ui:include>
			</h:panelGroup>
		</h:panelGroup>
	</ui:define>
</ui:composition>
