<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:spacer height="40"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.eva.prepare.turut.hadir']}"
		toggleable="true">

		<p:dataTable var="meetingAttendance" id="turuthadir" rows="10"
			widgetVar="tirutWidget"
			value="#{evaluationBackingBean.managedBean.meetingAttendanceList}"
			selection="#{evaluationBackingBean.managedBean.meetingAttendanceSelectList}"
			editable="true" rowIndexVar="index" rowKey="#{meetingAttendance}">
			<ac:paginator for="turuthadir" />

			<!-- 	<p:column selectionMode="multiple" style="width:2%"></p:column> -->

			<p:column style="width:2px;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="turuthadir"
							listener="#{evaluationBackingBean.selectAll(evaluationBackingBean.managedBean.templateSpecBean.selectAll, evaluationBackingBean.managedBean.meetingAttendanceList)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{meetingAttendance.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="width:50%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly and !evaluationBackingBean.managedBean.statusOnly}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}" />
				</f:facet>
				<p:inputText size="55" value="#{meetingAttendance.name}"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					id="attendanceNameId" required="true"
					label="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}" maxlength="50"></p:inputText>
				<p:message id="attendanceNameMessageId" for="attendanceNameId"
					display="icon"></p:message>


			</p:column>
			<p:column style="width:48%">
				<f:facet name="header">
					<ui:fragment
						rendered="#{!evaluationBackingBean.managedBean.readOnly and !evaluationBackingBean.managedBean.statusOnly}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment>
					<h:outputText value="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}" />
				</f:facet>

				<p:inputText size="55" value="#{meetingAttendance.icPassport}"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					id="attendacePassportId" required="true"
					label="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}" maxlength="15"></p:inputText>
				<p:message id="attendancePassportMessageId"
					for="attendacePassportId" display="icon"></p:message>

			</p:column>



		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton id="turutbutton"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				value="#{lbl['lbl.sc.eva.btn.add']}" process="@this,turuthadir"
				partialSubmit="true" update="turuthadir"
				oncomplete="tirutWidget.paginator.endLink.click();"
				icon="ui-icon-add" action="#{evaluationBackingBean.addTurutDetails}" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				process="@this" partialSubmit="true" icon="ui-icon-delete"
				update="turuthadir"
				action="#{evaluationBackingBean.markDeleteSelectedRowsAction(evaluationBackingBean.managedBean.meetingAttendanceList,evaluationBackingBean.managedBean.meetingAttendanceRemoveList)}">
				<f:setPropertyActionListener
					target="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>

		</div>

	</p:panel>





</ui:composition>
