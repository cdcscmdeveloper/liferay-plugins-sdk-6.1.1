<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:spacer height="40"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.eva.prepare.turut.hadir']}"
		toggleable="true">

		<p:dataTable var="meetingAttendance" id="turuthadir" rows="10"
			widgetVar="tirutWidget"
			value="#{evaluationBackingBean.managedBean.meetingAttendanceList}"
			selection="#{evaluationBackingBean.managedBean.meetingAttendanceSelectList}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{meetingAttendance}">
			<ac:paginator for="turuthadir" />

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column style="width:50%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}" />
				</f:facet>
				<p:inputText size="70" value="#{meetingAttendance.name}"
					id="attendanceNameId" required="true"
					label="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}" maxlength="50"></p:inputText>
				<p:message id="attendanceNameMessageId" for="attendanceNameId"
					display="icon"></p:message>


			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}" />
				</f:facet>

				<p:inputText size="70" value="#{meetingAttendance.icPassport}"
					id="attendacePassportId" required="true"
					label="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}" maxlength="15"></p:inputText>
				<p:message id="attendancePassportMessageId"
					for="attendacePassportId" display="icon"></p:message>

			</p:column>



		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton id="turutbutton"
				value="#{lbl['lbl.sc.eva.btn.add']}" process="@this,turuthadir"
				partialSubmit="true" update="turuthadir"
				oncomplete="tirutWidget.paginator.endLink.click();"
				icon="ui-icon-add" 
				action="#{evaluationBackingBean.addTurutDetails}" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				process="@this,turuthadir" partialSubmit="true"
				icon="ui-icon-delete" update="turuthadir" 
				actionListener="#{evaluationBackingBean.deleteTurutHadirDetails}" />

		</div>

	</p:panel>





</ui:composition>
