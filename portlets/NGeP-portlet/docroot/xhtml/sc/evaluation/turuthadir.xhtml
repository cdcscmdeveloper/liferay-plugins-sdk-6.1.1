<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.eva.prepare.turut.hadir']}"
		toggleable="true">

		<p:dataTable var="meetingAttendance" id="turuthadir" widgetVar="tirutWidget"
			value="#{evaluationBackingBean.managedBean.meetingAttendanceList}"
			selection="#{evaluationBackingBean.managedBean.meetingAttendanceSelectList}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{meetingAttendance}">
			<ac:paginator for="turuthadir" />

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}"
				style="width:30%">

				<p:inputText size="70" value="#{meetingAttendance.name}"></p:inputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}">


				<p:inputText size="70" value="#{meetingAttendance.icPassport}"></p:inputText>

			</p:column>



		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.add']}"
				process="@this,turuthadir" partialSubmit="true" update="turuthadir"
				icon="ui-icon-add"   oncomplete="tirutWidget.paginator.endLink.click();"
				actionListener="#{evaluationBackingBean.addTurutDetails}" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				process="@this,turuthadir" partialSubmit="true"
				icon="ui-icon-delete" update="turuthadir"
				actionListener="#{evaluationBackingBean.deleteTurutHadirDetails}" />

		</div>

	</p:panel>



</ui:composition>
