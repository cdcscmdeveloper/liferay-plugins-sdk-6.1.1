<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.reminder']}"
		widgetVar="evaluationreminder" position="top" width="600" height="400">
		<p:panel>
			<p:dataTable id="evaluationcommitteereminder" var="reminderpopup"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				editable="true">
				<ac:paginator for="evaluationcommitteereminder" />
				<p:column headerText="#{lbl['lbl.sc.name']}"
					style="width:100%">
					<h:outputText value="readOnly"></h:outputText>
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:panel id="evaluationRemainderId"
			header="#{lbl['lbl.sc.reminder.dtls']}" toggleable="true">
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">


				<h:outputLabel value="#{lbl['lbl.sc.subject']}" />

				<p:inputText size="75" maxlength="100"
					value="#{evaluationBackingBean.managedBean.subject}"></p:inputText>

				<h:outputLabel value="#{lbl['lbl.sc.message']}" />

				<p:inputTextarea rows="5" cols="75" maxlength="1000"
					value="#{evaluationBackingBean.managedBean.message}"></p:inputTextarea>

			</h:panelGrid>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					style="float:right;" oncomplete="evaluationreminder.hide();"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.send']}"
					style="float:right;" oncomplete="evaluationreminder.hide();"
					process="@this,evaluationRemainderId" partialSubmit="true"
					actionListener="#{evaluationBackingBean.secretarySubmitTask}"></p:commandButton>


			</div>
		</p:panel>

	</p:dialog>
</ui:composition>
