<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.sign.off']}" widgetVar="chairPerson" 
		width="600" height="250" position="top">



		<p:panel>


			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">


				<h:outputLabel value="#{lbl['lbl.sc.pin.no']}" />

				<p:inputText size="50"></p:inputText>



			</h:panelGrid>
		</p:panel>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" onclick="reminder.hide();"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.btn.submit']}"
				style="float:right;" onclick="reminder.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
