<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:panel header="#{lbl['lbl.sc.committee.endorsement.evaluation']}"
		toggleable="true">

		<p:dataTable id="evaluationSignOff" var="committeActivity" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.endorscommitteeMemberList}"
			rowKey="#{committeActivity}" rowIndexVar="index">

			<ac:paginator for="evaluationSignOff" />

			<p:column style="width:30%;white-space: normal;"
				headerText="#{lbl['lbl.sc.name']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column style="width:5%;white-space: normal;"
				headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="signOff#{row}"
						value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[committeActivity.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column style="width:10%;white-space: normal;">
				<f:facet name="header">

					<h:outputText value="#{lbl['lbl.sc.role']}"></h:outputText>
				</f:facet>

				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(committeActivity.scCommitteeMember.memberRole)}" />


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;white-space: normal;">


				<h:outputText
					value="#{lbl[committeActivity.signedOff ? 'lbl.btn.complete' : 'lbl.sc.pending' ]}" />


			</p:column>

		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<!-- <div align="right">
			<p:commandButton value="#{lbl['lbl.btn.send.reminder']}"
				onclick="evaluationreminder.show();" />

		</div> -->
		<ui:include src="evaluationreminderpopup.xhtml" />
		<ui:include src="chairPersonSignOff.xhtml" />
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">

		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC'}">

						<p:dataGrid var="remarkVar"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{evaluationBackingBean.managedBean.scQt.scQtEvaluationCommitteeRemarks}"
							rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage height="30"
											value="#{evaluationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											width="30" /></td>
									<td width="5"></td>
									<td><h:outputText
											value="#{remarkVar.createdUser.userName}" />, <h:outputText
											id="remarkDate" value="#{remarkVar.changedDate}">
											<f:convertDateTime
												pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
											style="width:75%;" maxlength="1000"
											rendered="#{remarkVar.remarkId eq null}">
											<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
										</p:inputTextarea> <h:outputText value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;" />
									</td>
								</tr>
							</table>
						</p:dataGrid>
					</ui:fragment> <ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'OC'}">
						<p:dataGrid var="remarkVar"
						    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{evaluationBackingBean.managedBean.scQt.scQtOpeningCommitteeRemarks}"
							rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage height="30"
											value="#{evaluationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											width="30" /></td>
									<td width="5"></td>
									<td><h:outputText
											value="#{remarkVar.createdUser.userName}" />, <h:outputText
											id="remarkDate" value="#{remarkVar.changedDate}">
											<f:convertDateTime
												pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
											style="width:75%;" maxlength="1000"
											rendered="#{remarkVar.remarkId eq null}">
											<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
										</p:inputTextarea> <h:outputText value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;" />
									</td>
								</tr>
							</table>
						</p:dataGrid>
					</ui:fragment> <ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
						<p:dataGrid var="remarkVar"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{evaluationBackingBean.managedBean.scQt.scQtTechnicalCommitteeRemarks}"
							rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage height="30"
											value="#{evaluationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											width="30" /></td>
									<td width="5"></td>
									<td><h:outputText
											value="#{remarkVar.createdUser.userName}" />, <h:outputText
											id="remarkDate" value="#{remarkVar.changedDate}">
											<f:convertDateTime
												pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
											style="width:75%;" maxlength="1000"
											rendered="#{remarkVar.remarkId eq null}">
											<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
										</p:inputTextarea> <h:outputText value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;" />
									</td>
								</tr>
							</table>
						</p:dataGrid>
					</ui:fragment> <ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
						<p:dataGrid var="remarkVar"
						    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{evaluationBackingBean.managedBean.scQt.scQtFinancialCommitteeRemarks}"
							rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage height="30"
											value="#{evaluationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											width="30" /></td>
									<td width="5"></td>
									<td><h:outputText
											value="#{remarkVar.createdUser.userName}" />, <h:outputText
											id="remarkDate" value="#{remarkVar.changedDate}">
											<f:convertDateTime
												pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
											style="width:75%;" maxlength="1000"
											rendered="#{remarkVar.remarkId eq null}">
											<p:ajax event="change" partialSubmit="true" process="@this"></p:ajax>
										</p:inputTextarea> <h:outputText value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;" />
									</td>
								</tr>
							</table>
						</p:dataGrid>
					</ui:fragment></td>
			</tr>
		</table>
	</p:panel>
	<table style="width: 100%">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.prev']}"
					style="float:left;" styleClass="BtnSpacing"
					actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('5','4')}"
					action="#{evaluationBackingBean.updateSmAppl}" update=":form" /></td>

		</tr>
	</table>
</ui:composition>
