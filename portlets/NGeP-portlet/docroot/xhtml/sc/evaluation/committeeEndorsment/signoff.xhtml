<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:panel header="#{lbl['lbl.sc.committee.endorsement.evaluation']}"
		toggleable="true">

		<p:dataTable id="evaluationSignOff" var="committeActivity" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.endorscommitteeMemberList}"
			rowKey="#{committeActivity}" rowIndexVar="index">

			<ac:paginator for="evaluationSignOff" />

			<p:column style="width:30%;white-space: normal;"
				headerText="#{lbl['lbl.sc.name']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText
					value="#{committeActivity.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column style="width:5%;white-space: normal;"
				headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeActivity.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="signOff#{row}"
						value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[committeActivity.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column style="width:10%;white-space: normal;">
				<f:facet name="header">

					<h:outputText value="#{lbl['lbl.sc.role']}"></h:outputText>
				</f:facet>

				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(committeActivity.scCommitteeMember.memberRole)}" />


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;white-space: normal;">


				<h:outputText
					value="#{lbl[committeActivity.signedOff ? 'lbl.btn.complete' : 'lbl.sc.pending' ]}" />


			</p:column>

		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<!-- <div align="right">
			<p:commandButton value="#{lbl['lbl.btn.send.reminder']}"
				onclick="evaluationreminder.show();" />

		</div> -->
		<ui:include src="evaluationreminderpopup.xhtml" />
		<ui:include src="chairPersonSignOff.xhtml" />
	</p:panel>
	
	<c:choose>
		<c:when test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeOpeningCommittee}">
			<ui:param name="committeeRemarkList" value="#{evaluationBackingBean.managedBean.scQt.scQtOpeningCommitteeRemarks}" />
		</c:when>
		<c:when test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeTechnicalEvaluationCommittee}">
			<ui:param name="committeeRemarkList" value="#{evaluationBackingBean.managedBean.scQt.scQtTechnicalCommitteeRemarks}" />
		</c:when>
		<c:when test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeFinancialEvaluationCommittee}">
			<ui:param name="committeeRemarkList" value="#{evaluationBackingBean.managedBean.scQt.scQtFinancialCommitteeRemarks}" />
		</c:when>
		<c:otherwise>
			<ui:param name="committeeRemarkList" value="#{evaluationBackingBean.managedBean.scQt.scQtEvaluationCommitteeRemarks}" />
		</c:otherwise>
	</c:choose>
	
	<ac:scRemarkAndAttachment
		remarkList="#{committeeRemarkList}"
		showAttachment="false" />

	<table style="width: 100%">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.prev']}"
					style="float:left;" styleClass="BtnSpacing"
					actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('5','4')}"
					action="#{evaluationBackingBean.updateSmAppl}" update=":form" /></td>

		</tr>
	</table>
</ui:composition>
