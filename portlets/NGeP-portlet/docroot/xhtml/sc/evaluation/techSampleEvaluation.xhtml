<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
	<p:messages id="sampleEvaluationmsgId" autoUpdate="true"
			closable="true" showDetail="true" showSummary="false"
			severity="error,info"></p:messages>

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" update="@all"
				action="#{evaluationBackingBean.saveProposalScoreDtls}" />
		</div>
<p:spacer height="50"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText size="50" disabled="true"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.lbl.no']}"></h:outputLabel></td>
					<td><p:inputText size="50" disabled="true" style="width:70%"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"></p:inputText></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}"
			toggleable="true">
			<p:dataTable var="techComplianceList" id="sampleComplianceListId"
				value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
				rowIndexVar="index" style="width:100%"
				rowKey="#{techComplianceList}">
				<ac:paginator for="sampleComplianceListId" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">
					<h:outputText value="#{techComplianceList.scQtCheckList.title}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
                  <p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadDocuments(techComplianceList)}"
						process="@this" partialSubmit="true">
						<p:graphicImage library="ep/images/design"
							value="/resources/ep/images/design/icon_txt.png" />

					</p:commandLink>
				</p:column>

			</p:dataTable>



		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.smpl.item.list']}"
			toggleable="true">
			<p:dataTable var="sampleItem" id="techSampleEvaluateId"
				value="#{evaluationBackingBean.managedBean.sampleItemList}"
				editable="true" rowIndexVar="index" style="width:100%"
				rowKey="#{sampleItem}">
				<ac:paginator for="techSampleEvaluateId" />


				<p:column headerText="#{lbl['lbl.sc.eva.tech.spec.item.name']}"
					style="width:70%">
					<h:outputText
						value="#{sampleItem.scRequestItem.tplSpecQuestion.clItem}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.samp.comp.lbl.ext.num']}"
					style="width:30%">
					<h:outputText value="#{sampleItem.scQtSampleLable.lableNo}"></h:outputText>
				</p:column>

			</p:dataTable>
			<table>
				<c:forEach
					items="#{evaluationBackingBean.managedBean.techGovProposalScore}"
					var="action">

					<tr>

						<td><h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}" /></td>
						<td><p:inputText value="#{action.userScore}" maxlength="18"></p:inputText></td>
					</tr>

					
				</c:forEach>
			</table>

		</p:panel>

		<p:panel header="#{lbl['lbl.sc.eva.smpl.item.spec']}"
			toggleable="true">
			<p:dataTable var="itemspec" id="techSampleSpecId" editable="true"
				value="#{evaluationBackingBean.managedBean.sampleItemList}"
				rowIndexVar="index" style="width:50%" rowKey="#{itemspec}">
				<ac:paginator for="techSampleSpecId" />


				<p:column headerText="#{lbl['lbl.sc.eva.tech.spec.specification']}"
					style="width:50%">
					<h:outputText
						value="#{itemspec.scRequestItem.tplSpecQuestion.clSpecDetail}"></h:outputText>

				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>
</ui:composition>
