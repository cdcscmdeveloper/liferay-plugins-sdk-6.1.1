<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.eva.comp.sup.list']}" toggleable="true">

			<p:dataTable var="finSpec" id="finSpecId" editable="true"
				rowIndexVar="index" style="width:100%" rowKey="#{finSpec}">
				<ac:paginator for="finSpecId" />


				<p:column headerText="#{lbl['lbl.sc.eva.comp.sup.code']}"
					style="width:20%">

					<h:outputText></h:outputText>


				</p:column>
				<p:column headerText="Total Amount&lt;br /&gt;(Package)(RM)"
					style="width:25%">
					<h:outputText></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.diff.varience']}" style="width:20%">

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.fin.spec.tot.score']}" style="width:20%">

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
					style="width:15%">

					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}" process="@this"
						partialSubmit="true" />
				</p:column>
			</p:dataTable>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.score.offer.price']}">
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.eva.est.price']}"></h:outputLabel></td>
					<td><p:inputText disabled="true"></p:inputText></td>
				</tr>
			</table>
			<p:panelGrid style="margin-top:5px;width:100%;">
				<f:facet name="header">

					<p:row>
						<p:column colspan="1">#{lbl['lbl.sc.eva.offer.price']}</p:column>
						<p:column colspan="1">#{lbl['lbl.sc.eva.from.varience']}</p:column>
						<p:column colspan="1">#{lbl['lbl.sc.eva.to.varience']}</p:column>
						<p:column>#{lbl['lbl.sc.eva.below.varience']}</p:column>
						<p:column>#{lbl['lbl.sc.eva.within.varience']}</p:column>
						<p:column>#{lbl['lbl.sc.eva.above.varience']}</p:column>
					</p:row>
				</f:facet>
				<p:row>
					<p:column style="font-weight: bold;">#{lbl['lbl.sc.eva.by.package']}</p:column>
					<p:column style="font-weight: bold;">

						<h:outputText></h:outputText>
					</p:column>

					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
					<p:column colspan="1" style="font-weight: bold;">
						<h:outputText></h:outputText>
					</p:column>
				</p:row>


			</p:panelGrid>


		</p:panel>

	</ui:define>
</ui:composition>
