<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">


		<h:panelGroup>
			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{evaluationBackingBean.evaluationBackaction}" />

			</div>
		</h:panelGroup>
		<p:spacer height="25" />
		<br />
		<br />
		<ui:include src="evaluationHeader.xhtml" />
		<br/>		
		<p:panel header="#{lbl['lbl.sc.eva.financial.proposal.evaluation']}">
			<ui:include src="checklistHeader.xhtml" />
		</p:panel>
		<br />
		
		<h:panelGroup>
			<table style="width: 100%">
				<tr>
					<td style="width: 16%" valign="top"><p:remoteCommand
							name="specTabChange" update="@form" partialSubmit="true"
							process="@this" action="#{evaluationBackingBean.specTabChange}" />

						<p:tabMenu styleClass="sidemenu" id="zonalMenu"
							activeIndex="#{evaluationBackingBean.managedBean.specZoneTabIndex}"
							style="display : table-caption;"
							model="#{evaluationBackingBean.managedBean.evaluationSpecZonalMenuModel}">
						</p:tabMenu></td>
					<td style="width: 84%"><h:panelGroup id="zoneSpecAnswers">
							<ui:param name="finSpecsupplierList"
								value="#{evaluationBackingBean.managedBean.finSpecSupplierList}"></ui:param>
							<ui:param name="finSpecofferPrice"
								value="#{evaluationBackingBean.managedBean.offerPricePackage}"></ui:param>



							<ui:include
								src="/xhtml/sc/evaluation/finSpecSupplierOfferPriceList.xhtml"></ui:include>
						</h:panelGroup></td>
				</tr>
			</table>
		</h:panelGroup>



	</ui:define>
</ui:composition>
