<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="financialCreditfacilityEvaluationmsgId"
			autoUpdate="true" closable="true" showDetail="true"
			showSummary="false" severity="error,info"></p:messages>

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" update="@all"
				action="#{evaluationBackingBean.saveProposalScoreDtls}" />
		</div>

		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText size="50" disabled="true"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true"
							style="width:90%"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}"
			toggleable="true">
			<p:dataTable var="creditFacility" id="facilityId" rowIndexVar="index"
				value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
				style="width:100%" rowKey="#{creditFacility}">
				<ac:paginator for="facilityId" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">
					<h:outputText value="#{creditFacility.scQtCheckList.title}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
					<p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadDocuments(creditFacility)}"
						process="@this" partialSubmit="true">
						<p:graphicImage library="ep/images/design"
							value="/resources/ep/images/design/icon_txt.png" />

					</p:commandLink>
				</p:column>

			</p:dataTable>

		</p:panel>



		<p:panel header="#{lbl['lbl.sc.spec.credit.facility']}"
			toggleable="true">
			<p:dataTable id="credit" rowIndexVar="index" var="creditFacility"
				value="#{evaluationBackingBean.managedBean.creditFacilityList}"
				rowKey="#{experience}">
				<ac:paginator for="credit"></ac:paginator>
				<!-- <p:column  selectionMode="multiple" style="width:2px;"></p:column> -->
				<p:column headerText="#{lbl['lbl.sc.spec.bank.name']}">
					<h:outputText value="#{creditFacility.bankName}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.address']}">
					<h:outputText value="#{creditFacility.bankAddress}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.credit.type']}">
					<h:outputText
						value="#{evaluationBackingBean.getParameterDesc(creditFacility.creditType)}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.amount']}">
					<h:outputText value="#{creditFacility.creditAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.sp.amt.paid']}">

					<h:outputText value="#{creditFacility.amtPaid}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</p:column>

			</p:dataTable>





			<table>
				<c:forEach
					items="#{evaluationBackingBean.managedBean.techGovProposalScore}"
					var="action">
					<tr>
						<td><h:outputText value="#{lbl['lbl.sc.spec.total.credit']}" /></td>
						<td style="width: 200px;"><p:inputText readonly="true"
								value="#{action.criteriaValue}" disabled="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
						<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								value="#{action.autoScore}"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}"></p:inputText></td>
						<td><h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '2'}" /></td>
						<td><p:inputText value="#{action.userScore}" maxlength="18"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '2'}"></p:inputText></td>
					</tr>

				</c:forEach>
			</table>


		</p:panel>


		<h:panelGroup id="creditFacilityAmount">
			<ui:param name="scoringPnlId" value="creditFacilityAmountId" />
			<ui:param name="scoringList"
				value="#{evaluationBackingBean.managedBean.technicalGovNoOfContracts}"></ui:param>
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.eva.score.tot.credit.facilities']}"></ui:param>
			<ui:include src="evaluationScoring.xhtml"></ui:include>
		</h:panelGroup>




	</ui:define>
</ui:composition>
