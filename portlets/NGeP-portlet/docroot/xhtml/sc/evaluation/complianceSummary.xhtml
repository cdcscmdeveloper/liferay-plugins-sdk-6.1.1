<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:spacer height="40"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.qul.sup']}"
		toggleable="true">

		<p:dataTable var="qualifiedSupplier" id="complianceQualifiedSupplier"
			rows="10" editable="true" rowIndexVar="index" style="width: 1000px;"
			value="#{evaluationBackingBean.managedBean.complianceSummaryQualSuppliers}"
			rowKey="#{qualifiedSupplier}">
			<ac:paginator for="complianceQualifiedSupplier" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}">

				<h:outputText value="#{qualifiedSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{evaluationBackingBean.managedBean.complianceQualifiedSuppliers}"></p:inputText></td>
			</tr>

		</table>
	</p:panel>



	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.dis.qul.sup']}"
		toggleable="true">

		<p:dataTable var="disQualifiedSupplier"
			value="#{evaluationBackingBean.managedBean.complianceSummaryDisQualSuppliers}"
			id="complianceDisQualifiedSupplier" editable="true" rows="10"
			rowIndexVar="index" style="width: 1000px;"
			rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="complianceDisQualifiedSupplier" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}">

				<h:outputText
					value="#{disQualifiedSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{evaluationBackingBean.managedBean.complianceDisQualifiedSuppliers}"></p:inputText></td>
			</tr>

		</table>
	</p:panel>


</ui:composition>
