<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="stageTwoTech" modal="true" width="800"
		position="top"
		header="#{lbl['lbl.sc.spec.btn.standard.check.list']} "
		height="500">
		<p:panel>

			

		</p:panel>
		<p:commandButton value="#{lbl['lbl.btn.cancel']}"
			style="float:right;" onclick="stageTwoTech.hide();"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.btn.ok']}"
			style="float:right;" process="@all" partialSubmit="true"
			oncomplete="technicalChecklist.paginator.endLink.click();"
			action="#{specificationBackingBean.stageTwoTechProposal}"
			onclick="stageTwoTech.hide();" update="stageTwotechProposal"></p:commandButton>


	</p:dialog>
