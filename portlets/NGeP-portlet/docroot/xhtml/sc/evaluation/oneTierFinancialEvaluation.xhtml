<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" valign="top"><p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.oneTierFinancialActiveIndex}"
					styleClass="sidemenu">

					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
						<p:menuitem value="#{lbl['lbl.sc.financial']}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStage}"
							update="@form" />
					</c:if>

					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.summary']}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveOneTierFinancialSupplierSummary}"
							update="@form" />
					</c:if>

					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">


						<p:menuitem value="#{lbl['lbl.sc.eva.recommendation.summary']}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveOneTierRecommendationSupplierSummary}"
							update="@form" />
					</c:if>

				</p:tabMenu></td>
			<td width="80%;" valign="top"><ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
					<c:if
						test="#{evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '0'}">

						<ui:include src="financialEvaluation.xhtml"></ui:include>

					</c:if>
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
					<c:if
						test="#{evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '1'}">

						<ui:include src="financialEvaluationRecommendationSummary.xhtml" />

					</c:if>
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
					<c:if
						test="#{evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '2'}">



						<ui:include src="FinancialEvaluationCommitteeSummary.xhtml" />


					</c:if>
				</ui:fragment></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.btn.prev']}"
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}"
						actionListener="#{evaluationBackingBean.setTabValue('3','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">


					<p:commandButton value="#{lbl['lbl.btn.next']}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}"
						actionListener="#{evaluationBackingBean.setTabValue('3','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />

				</div></td>
		</tr>
	</table>


</ui:composition>
