<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:messages id="financialAssetLiabilityEvaluationmsgId"
			autoUpdate="true" closable="true" showDetail="true"
			showSummary="false" severity="error,info"></p:messages>

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.save']}"
				style="float:right;" icon="ui-icon-save" update="@all"
				action="#{evaluationBackingBean.saveProposalScoreDtls}" />
		</div>
		<p:spacer height="75"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"></h:outputLabel></td>
					<td><p:inputText disabled="true"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true"
							style="width:90%"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}"
			toggleable="true">
			<p:dataTable var="assetLiability" id="evaluateAssetsId"
				value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
				rowIndexVar="index" style="width:100%" rowKey="#{creditFacility}">
				<ac:paginator for="evaluateAssetsId" />


				<p:column headerText="#{lbl['lbl.sc.spec.asset.title']}"
					style="width:90%">
					<h:outputText value="#{assetLiability.scQtCheckList.title}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
					style="width:10%">
					<p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadDocuments(assetLiability)}"
						process="@this" partialSubmit="true">
						<p:graphicImage library="ep/images/design"
							value="/resources/ep/images/design/icon_txt.png" />

					</p:commandLink>
				</p:column>

			</p:dataTable>

		</p:panel>



		<p:panel header="#{lbl['lbl.sc.sp.assest.liabilities']}"
			toggleable="true">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sp.current.asset']}" /></td>
					<td><p:inputText style="text-align:right" disabled="true" 
							value="#{evaluationBackingBean.managedBean.scQtPRPAssetLiability.currentAssets}">

						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.sp.current.liability']}" /></td>
					<td><p:inputText style="text-align:right" disabled="true" 
							value="#{evaluationBackingBean.managedBean.scQtPRPAssetLiability.currentLiabilities}">

						</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sp.acid.ratio']}" /></td>
					<td><p:inputText style="text-align:right" id="totalacidratio"
							disabled="true" 
							value="#{evaluationBackingBean.managedBean.scQtPRPAssetLiability.acidRatio}">

						</p:inputText></td>
				</tr>
			</table>
		</p:panel>







		<p:panel header="#{lbl['lbl.sc.spec.asset.summary']}"
			toggleable="true">


			<table>
				<c:forEach
					items="#{evaluationBackingBean.managedBean.techGovProposalScore}"
					var="action">
					<tr>
						<td><h:outputText value="#{lbl['lbl.sc.eva.auto.score']}"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								value="#{action.autoScore}" style="text-align:right"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}"></p:inputText></td>
						<td><h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '2'}" /></td>
						<td><p:inputText value="#{action.userScore}" maxlength="18" style="text-align:right"
								rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '2'}"></p:inputText></td>
					</tr>
				</c:forEach>
			</table>

		</p:panel>




		<h:panelGroup id="assetLiabilityAmount">
			<ui:param name="scoringPnlId" value="evaassetLiabilityAmountId" />
			<ui:param name="scoringList"
				value="#{evaluationBackingBean.managedBean.technicalGovNoOfContracts}"></ui:param>
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.eva.score.net.tot.amount']}"></ui:param>
			<ui:include src="evaluationScoring.xhtml"></ui:include>
		</h:panelGroup>




	</ui:define>
</ui:composition>
