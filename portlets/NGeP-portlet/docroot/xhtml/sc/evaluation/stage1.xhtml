<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


 <!-- <ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" /> --> 
<div align="right">
	
		<p:commandButton value="#{lbl['lbl.sc.eva.btn.generate']}"  action="#{evaluationBackingBean.generateStageTwoEvaluationAction}"  icon="ui-icon-evaluate" />
		
	</div>

<c:if test="#{evaluationBackingBean.managedBean.manualList gt 0 and evaluationBackingBean.managedBean.committeeType eq'OC'}">
	<p:panel header="#{lbl['lbl.sc.eva.s1.manual.head']}" toggleable="true">
		<p:dataTable id="evManual" var="manuals1Evaluation" rows="10"
			value="#{evaluationBackingBean.managedBean.manuals1SupplierList}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{manuals1Evaluation}">
			<ac:paginator for="evManual" />
			
			
			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
				style="width:20%">
				<h:outputText value="#{manuals1Evaluation.scQtProposal.supplierNo}"></h:outputText>

			</p:column>
			
				<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.status']}"
				style="width:30%">
				<h:outputText value="#{manuals1Evaluation.evaluationStatus.statusId}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.result']}"
				style="width:30%">
				
				<h:outputText value="Failed"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
				style="width:20%">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
					oncomplete="manual.show();" action="#{evaluationBackingBean.evaluations1ManualAction(manuals1Evaluation)}" icon="ui-icon-evaluate" update=":form:s1Manualpopup"></p:commandButton>
			</p:column>

	</p:dataTable>
	</p:panel>
</c:if>
 	<c:if
							test="#{evaluationBackingBean.managedBean.committeeType eq'EC' or evaluationBackingBean.managedBean.committeeType eq'TEC' }"> 

	<p:panel header="#{lbl['lbl.sc.eva.s1.tech.head']}" toggleable="true">

		<p:dataTable id="evaluationst1Technical" var="evaluations1Tech"
			rowIndexVar="index" rows="10"
			value="#{evaluationBackingBean.managedBean.s1TechEvalList}">

			<ac:paginator for="evaluationst1Technical" />

			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
				style="width:20%">
				<h:outputText value="#{evaluations1Tech.scQtProposal.supplierNo}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.status']}"
				style="width:30%">
				<h:outputText value="#{evaluations1Tech.evaluationStatus.statusId}"></h:outputText>
			</p:column>


			<!-- <p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:15%">
				<h:outputText value="#{evaluations1Tech.totalScore}"></h:outputText>
			</p:column> -->

			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.result']}"
				style="width:15%">
				<h:outputText value="Failed"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
				style="width:20%">
				<c:if test="#{evaluationBackingBean.managedBean.committeeType eq 'OC'}">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
					oncomplete="evaluation.show();" action="#{evaluationBackingBean.evaluations1TechAction(evaluations1Tech)}" icon="ui-icon-evaluate" update=":form:s1popup"></p:commandButton>
					</c:if>
			</p:column>


		</p:dataTable>

	</p:panel>
 </c:if> 

 <c:if
							test="#{evaluationBackingBean.managedBean.committeeType eq'EC' or evaluationBackingBean.managedBean.committeeType eq'FEC' }"> -->
	<p:panel header="#{lbl['lbl.sc.eva.s1.fin.head']}" toggleable="true">

		<p:dataTable id="evaluationst1Financial" var="s1evalFin" rows="10"
		value="#{evaluationBackingBean.managedBean.s1FinEvalList}"
		rowKey="#{s1evalFin}"
			rowIndexVar="index">
			<ac:paginator for="evaluationst1Financial" />


			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
				style="width:20%">
				<h:outputText value="#{s1evalFin.scQtProposal.supplierNo}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.status']}"
				style="width:30%">
				<h:outputText value="#{manuals1Evaluation.evaluationStatus.statusId}"></h:outputText>
			</p:column>


		<!-- 	<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:15%">
				<h:outputText value="#{s1evalFin.totalScore}"></h:outputText>
			</p:column> -->

			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.result']}"
				style="width:15%">
				<h:outputText value="Failed"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
				style="width:20%">
					<c:if
							test="#{evaluationBackingBean.managedBean.committeeType eq'OC'}">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
					oncomplete="evaluation.show();"  action="#{evaluationBackingBean.evaluations1FinAction(s1evalFin)}" icon="ui-icon-evaluate"  update=":form:s1popup"></p:commandButton>
					</c:if>
			</p:column>


		</p:dataTable>

	</p:panel>
	 </c:if> 
	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','0')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">
			 <c:if test="#{evaluationBackingBean.managedBean.committeeType eq'OC'}">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
						</c:if>
						
						<c:if test="#{evaluationBackingBean.managedBean.committeeType ne'OC'}">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
						</c:if>
				</div></td>
		</tr>
	</table>

</ui:composition>
