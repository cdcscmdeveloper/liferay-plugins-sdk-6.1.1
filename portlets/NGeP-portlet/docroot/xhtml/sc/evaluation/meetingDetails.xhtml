<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- <ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" /> -->

	<div align="right">

		

		<p:commandButton value="#{lbl['lbl.sc.eva.btn.save']}"
			style="float:right;" immediate="true"
			action="#{evaluationBackingBean.saveMeetingDtls}" icon="ui-icon-save" />
	</div>

	<p:spacer height="40"></p:spacer>
	<p:panel header="#{lbl['lbl.sc.eva.prepare.meeting']}"
		toggleable="true">

		<p:dataTable var="meeting" id="evaluationmeetingDetails"
			widgetVar="evaluationMeeting"
			value="#{evaluationBackingBean.managedBean.scQtMeetings}"
			selection="#{evaluationBackingBean.managedBean.meetingMultiSelect}"
			editable="true" rowIndexVar="index" rowKey="#{meeting}">
			<ac:paginator for="evaluationmeetingDetails" />

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.date']}"
				style="width:30%">


				<p:calendar value="#{meeting.meetingDate}" showOn="button"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"></p:calendar>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.loc']}">


				<p:inputTextarea value="#{meeting.meetingLocation}" rows="2"
					cols="50"></p:inputTextarea>

			</p:column>


			<p:column headerText="#{lbl['lbl.sc.eva.mtng.status']}">


				<p:selectOneMenu>
					<f:selectItem itemLabel="Done" itemValue="2"></f:selectItem>
					<f:selectItem itemLabel="Pending" itemValue="5"></f:selectItem>
					<f:selectItem itemLabel="Cancel" itemValue="6"></f:selectItem>
				</p:selectOneMenu>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}">


				<p:inputTextarea value="#{meeting.remark}" rows="2" cols="50"></p:inputTextarea>

			</p:column>

			<!-- <p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}">
			
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
			</p:column> -->
		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton id="meetingbutton" value="#{lbl['lbl.sc.eva.btn.add']}"
				oncomplete="evaluationMeeting.paginator.endLink.click();"
				process="@this,evaluationmeetingDetails" partialSubmit="true"
				action="#{evaluationBackingBean.addMeetingAction}"
				update="evaluationmeetingDetails" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				icon="ui-icon-delete"
				action="#{evaluationBackingBean.deleteMeetingDetails}"
				update="evaluationmeetingDetails" />

		</div>

	</p:panel>



</ui:composition>
