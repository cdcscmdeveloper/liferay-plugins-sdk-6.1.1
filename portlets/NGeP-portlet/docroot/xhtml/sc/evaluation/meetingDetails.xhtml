<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- <ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" /> -->




	<p:panel header="#{lbl['lbl.sc.eva.prepare.meeting']}"
		toggleable="true">

		<p:dataTable var="meeting" id="evaluationmeetingDetails" rows="10"
			widgetVar="evaluationMeeting"
			value="#{evaluationBackingBean.managedBean.scQtMeetings}"
			selection="#{evaluationBackingBean.managedBean.meetingMultiSelect}"
			editable="true" rowIndexVar="index" rowKey="#{meeting}">
			<ac:paginator for="evaluationmeetingDetails" />

			<!-- 	<p:column selectionMode="multiple" style="width:2%"></p:column> -->

			<p:column style="width:2px;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						disabled="#{evaluationBackingBean.managedBean.readOnly}"
						value="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="evaluationmeetingDetails"
							listener="#{evaluationBackingBean.selectAll(evaluationBackingBean.managedBean.templateSpecBean.selectAll, evaluationBackingBean.managedBean.scQtMeetings)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					value="#{meeting.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.date']}"
				style="width:30%">

				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.prepare.meeting.date']}" />
				</f:facet>
				<p:calendar value="#{meeting.meetingDate}" showOn="button"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					id="evaluationMeetingId"
					label="#{lbl['lbl.sc.eva.prepare.meeting.date']}" required="true"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"></p:calendar>
				<p:message id="meetingEvaluationid" for="evaluationMeetingId"
					display="icon"></p:message>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.prepare.meeting.loc']}" />
				</f:facet>

				<p:inputTextarea value="#{meeting.meetingLocation}" rows="2"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					maxlength="50" cols="30" id="evaluationMeetingLocation"
					required="true" label="#{lbl['lbl.sc.eva.prepare.meeting.loc']}"></p:inputTextarea>
				<p:message id="meetingEvaluationLocationid"
					for="evaluationMeetingLocation" display="icon"></p:message>
			</p:column>


			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.mtng.status']}" />
				</f:facet>

				<p:selectOneMenu id="meetingstatus" required="true"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					label="#{lbl['lbl.sc.eva.mtng.status']}"
					value="#{meeting.meetingStatus.statusId}">
					<f:selectItems
						value="#{evaluationMeetingBackingBean.getStatusDropdownValues('SC', 'MS')}" />
				</p:selectOneMenu>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}">


				<p:inputTextarea value="#{meeting.remark}" rows="2" cols="30"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					maxlength="100" />

			</p:column>

			<!-- <p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}">
			
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
			</p:column> -->
		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton id="meetingbutton"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				value="#{lbl['lbl.sc.eva.btn.add']}"
				oncomplete="evaluationMeeting.paginator.endLink.click();"
				process="@this,evaluationmeetingDetails" partialSubmit="true"
				action="#{evaluationBackingBean.addMeetingAction}"
				update="evaluationmeetingDetails" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				disabled="#{evaluationBackingBean.managedBean.readOnly}"
				icon="ui-icon-delete" process="@this" partialSubmit="true"
				action="#{evaluationBackingBean.deleteSelectedRowsAction(evaluationBackingBean.managedBean.scQtMeetings)}"
				update="evaluationmeetingDetails">
				<f:setPropertyActionListener
					target="#{evaluationBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>

		</div>

	</p:panel>



</ui:composition>
