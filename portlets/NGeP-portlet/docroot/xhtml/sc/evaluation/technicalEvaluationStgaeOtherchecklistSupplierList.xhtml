<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />

		<p:dataTable var="othersList" id="othersTechListId" editable="true"
			lazy="true"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}"
			rows="10">
			<ac:paginator for="othersTechListId" />


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:40%">

				<h:outputText value="#{othersList.scQtProposal.supplierNo}"></h:outputText>


			</p:column>


			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:40%">
				<h:outputText value="#{othersList.totalScore}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
				style="width:15%">


				<h:outputText
					value="#{evaluationBackingBean.getStatusDescById(othersList.evaluationStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column style="width:20%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
					<ac:iconTooltip id="action#{row}TECOTH"
						value="#{lbl['lbl.sc.action.evaluation.tooltip']}" />
				</f:facet>

				<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
					rendered="#{othersList.evaluationStatus.statusId eq '61600'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(othersList,'T')}" />

				<p:commandButton value="#{lbl['lbl.btn.view']}"
					rendered="#{othersList.evaluationStatus.statusId eq '61601'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(othersList,'T')}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
