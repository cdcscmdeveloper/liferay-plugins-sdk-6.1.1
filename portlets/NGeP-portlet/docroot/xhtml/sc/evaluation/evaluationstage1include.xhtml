<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<p:messages id="evaluateMessages" showDetail="true" autoUpdate="true"
		closable="true" severity="error, info" />



	<table style="width: 100%">
		<tr>
			<td><div class="navDiv" id="menuDiv" align="center">
					<ul class="menu-text" style="float: center">
						<li>
							<!-- <h:outputText value="Preparation"
								rendered="#{evaluationBackingBean.managedBean.tempTab eq 0}" /> -->
							<p:commandLink value="#{lbl['lbl.sc.eva.main.menu.prepare']}"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'0')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 0}"
								styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0 ? 'currentStep' : ''}" />
						</li>

						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType eq 'OC' or evaluationBackingBean.managedBean.committeeType eq 'EC'}">
							<li><h:outputText
									value="#{lbl['lbl.sc.eva.main.menu.comp.stg']}"
									rendered="#{evaluationBackingBean.managedBean.tempTab lt 1}" />
								<p:commandLink value="#{lbl['lbl.sc.eva.main.menu.comp.stg']}"
									actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'1')}"
									action="#{evaluationBackingBean.updateSmAppl}" update=":form"
									rendered="#{evaluationBackingBean.managedBean.tempTab ge 1}"
									styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1 ? 'currentStep' : ''}" /></li>

						</ui:fragment>
						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType ne 'OC'}">
							<li><h:outputText
									value="#{lbl['lbl.sc.eva.main.menu.eva.stg']} "
									rendered="#{evaluationBackingBean.managedBean.tempTab lt 2}" />
								<p:commandLink value="#{lbl['lbl.sc.eva.main.menu.eva.stg']}"
									actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'2')}"
									action="#{evaluationBackingBean.updateSmAppl}" update=":form"
									rendered="#{evaluationBackingBean.managedBean.tempTab ge 2}"
									styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 2 ? 'currentStep' : ''}" /></li>
						</ui:fragment>

						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true'}">
							<li><h:outputText
									value="#{lbl['lbl.sc.eva.present.demo.head']} "
									rendered="#{evaluationBackingBean.managedBean.tempTab lt 3}" />
								<p:commandLink value="#{lbl['lbl.sc.eva.present.demo.head']}"
									actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'3')}"
									action="#{evaluationBackingBean.updateSmAppl}" update=":form"
									rendered="#{evaluationBackingBean.managedBean.tempTab ge 3}"
									styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3 ? 'currentStep' : ''}" /></li>

						</ui:fragment>


						<li><h:outputText
								value="#{lbl['lbl.sc.eva.main.menu.report.stg']}"
								rendered="#{evaluationBackingBean.managedBean.tempTab lt 4}" />
							<p:commandLink value="#{lbl['lbl.sc.eva.main.menu.report.stg']}"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'4')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 4}"
								styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 4 ? 'currentStep' : ''}" /></li>



						<li><h:outputText
								value="#{lbl['lbl.sc.eva.main.menu.endors.stg']}"
								rendered="#{evaluationBackingBean.managedBean.tempTab lt 5}" />
							<p:commandLink value="#{lbl['lbl.sc.eva.main.menu.endors.stg']}"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'5')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 5}"
								styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5 ? 'currentStep' : ''}" />
						</li>

					</ul>
					<ul id="tripMeter" class="menu-line">



						<li
							class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0 ? 'space red-dot' : 'space green-dot'}" />
						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType eq 'OC' or evaluationBackingBean.managedBean.committeeType eq 'EC'}">

							<li
								class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 1 ? 'space green-dot':'space black-dot')}" />
						</ui:fragment>



						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType ne 'OC'}">

							<li
								class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 2 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 2 ? 'space green-dot':'space black-dot')}" />
						</ui:fragment>

						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true'}">
							<li
								class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 3 ? 'space green-dot':'space black-dot')}" />
						</ui:fragment>

						<li
							class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 4 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 4 ? 'space green-dot':'space black-dot')}" />


						<li
							class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5 ? 'red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 5 ? 'green-dot':'black-dot')}" />

					</ul>
				</div></td>
			<td></td>
		</tr>
	</table>

</ui:composition>
