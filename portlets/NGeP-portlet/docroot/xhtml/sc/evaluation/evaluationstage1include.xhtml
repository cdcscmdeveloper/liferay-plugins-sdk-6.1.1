<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
<!--  <p:messages id="evaluateMessages" showDetail="true" autoUpdate="true"
				closable="true" />  -->
	<ui:include src="/xhtml/sc/evaluation/evaluationButtons.xhtml" />
	  <ui:include src="/xhtml/sc/evaluation/uploadEvaluation.xhtml" />

	<table style="width: 100%">
		<tr>
			<td><div class="navDiv" id="menuDiv" align="center">
					<ul class="menu-text" style="float: center">
						<li><!-- <h:outputText value="Preparation"
								rendered="#{evaluationBackingBean.managedBean.tempTab eq 0}" /> -->
							<p:commandLink value="Preparation"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'0')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 0}" 
								styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0 ? 'currentStep' : ''}"/></li>

						<li><h:outputText value="Stage1"
								rendered="#{evaluationBackingBean.managedBean.tempTab lt 1}" />
							<p:commandLink value="Stage1"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'1')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 1}" 
								styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1 ? 'currentStep' : ''}"/></li>
					
					
							<li><h:outputText value="Summary "
									rendered="#{evaluationBackingBean.managedBean.tempTab lt 3}" />
								<p:commandLink value="Summary"
									actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'3')}"
									action="#{evaluationBackingBean.updateSmAppl}" update=":form"
									rendered="#{evaluationBackingBean.managedBean.tempTab ge 3}" 
									styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3 ? 'currentStep' : ''}"/></li>
					
						

						<li><h:outputText value="Report"
								rendered="#{evaluationBackingBean.managedBean.tempTab lt 5}" />
							<p:commandLink value="Report"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'5')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 5}" 
								styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5 ? 'currentStep' : ''}"/></li>

						<li>
						<h:outputText value="Sign-Off"
								rendered="#{evaluationBackingBean.managedBean.tempTab lt 6}" />
							<p:commandLink value="Sign-Off"
								actionListener="#{evaluationBackingBean.setTabValue(evaluationBackingBean.managedBean.tabActiveIndex,'6')}"
								action="#{evaluationBackingBean.updateSmAppl}" update=":form"
								rendered="#{evaluationBackingBean.managedBean.tempTab ge 6}" 
									styleClass="#{evaluationBackingBean.managedBean.tabActiveIndex eq 6 ? 'currentStep' : ''}" />
						</li>


					</ul>
					<ul id="tripMeter" class="menu-line">
					
						
						
						<li
									class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0 ? 'space red-dot' : 'space green-dot'}" />
								<li
									class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 1 ? 'space green-dot':'space black-dot')}" />
								
								
								<li
									class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 3 ? 'space green-dot':'space black-dot')}" />
								
								<li
									class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5 ? 'space red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 5 ? 'space green-dot':'space black-dot')}" />
								
								<li
									class="#{evaluationBackingBean.managedBean.tabActiveIndex eq 6 ? 'red-dot' :  (evaluationBackingBean.managedBean.tempTab ge 6 ? 'green-dot':'black-dot')}" />
					</ul>
				</div></td>
			<td></td>
		</tr>
	</table>
 <ui:param name="scQt" value="#{specificationBackingBean.managedBean.qt}" />
            <ui:include src="/xhtml/sc/common/commonHeader.xhtml" />

	<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 0}">
		<ui:include src="/xhtml/sc/evaluation/prepare.xhtml" />
		<!--  <ui:include src="/xhtml/sc/evaluation/sendEmail.xhtml" /> -->
	</c:if>
	<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 1}">
		<ui:include src="/xhtml/sc/evaluation/stage1.xhtml" />
		<ui:include src="/xhtml/sc/evaluation/manualsubmission.xhtml" />
		<ui:include src="/xhtml/sc/evaluation/evaluationpopup.xhtml" />
	</c:if>
	
		<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 3}">
			<ui:include src="/xhtml/sc/evaluation/summary.xhtml" />
		</c:if>
		
	
	<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 5}">
		<ui:include src="/xhtml/sc/evaluation/report.xhtml" />
	</c:if>
	<c:if test="#{evaluationBackingBean.managedBean.tabActiveIndex eq 6}">
		<ui:include src="/xhtml/sc/evaluation/signoff.xhtml" />
	</c:if>

</ui:composition>
