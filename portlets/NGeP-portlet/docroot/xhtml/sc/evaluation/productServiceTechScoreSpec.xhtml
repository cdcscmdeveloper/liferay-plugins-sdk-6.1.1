					</td>
				</tr>
			</table>
		</p:panel>



		<p:panel header="#{lbl['lbl.sc.eva.compliance.list']}"
			toggleable="true">
			<p:dataTable var="psComplianceList" id="pServiceListId" value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
