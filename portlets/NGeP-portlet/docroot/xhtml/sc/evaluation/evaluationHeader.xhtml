<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 15%"><h:outputLabel
						value="#{lbl['lbl.sc.head.present.qt.num']}" /></td>
				<td style="width: 15%" class="header-info-text">#{evaluationBackingBean.managedBean.scQt.qtNo}</td>

				<td style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.head.present.ptj.name']}" /></td>
				<td style="width: 30%" class="header-info-text">#{evaluationBackingBean.managedBean.scQt.pmOrgProfile.orgName}</td>
				<td style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.head.present.status']}" /></td>
				<td style="width: 20%" class="header-info-text">
					#{evaluationBackingBean.getStatusDescById(evaluationBackingBean.managedBean.scQt.qtStatus.statusId)}
				</td>
			</tr>
		</table>
	</div>

</ui:composition>
