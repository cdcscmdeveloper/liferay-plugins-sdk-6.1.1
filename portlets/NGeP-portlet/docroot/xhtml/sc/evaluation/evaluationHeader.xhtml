<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div align="left" class="header-info">
		<table style="width: 100%">
			<tr>
				<td style="width: 13%"><h:outputLabel
						value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td style="width: 27%" class="header-info-text">#{evaluationBackingBean.managedBean.scQt.qtNo}</td>
				<td style="width: 8%"><h:outputLabel
						value="#{lbl['lbl.sc.ptj']}" /></td>
				<td style="width: 29%" class="header-info-text">#{evaluationBackingBean.managedBean.scQt.pmOrgProfile.orgName}</td>
				<td style="width: 3%"><h:outputLabel
						value="#{lbl['lbl.sc.status']}" /></td>
				<td style="width: 20%" class="header-info-text">
					#{evaluationBackingBean.getStatusDescById(evaluationBackingBean.managedBean.currentStatusId)}
				</td>
			</tr>
			<tr>
				<td style="width: 13%"><h:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td style="width: 87%" class="header-info-text" colspan="5">#{evaluationBackingBean.managedBean.scQt.qtTitle}</td>
			</tr>			
		</table>
	</div>
	<p:spacer height="10px" />
</ui:composition>
