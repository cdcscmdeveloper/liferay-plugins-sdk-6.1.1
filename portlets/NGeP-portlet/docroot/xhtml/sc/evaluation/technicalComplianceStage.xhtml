<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>

			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
			<p:messages id="technicalCompliance" showDetail="true"
				autoUpdate="true" closable="true" severity="error,info"
				showSummary="false" />

			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					immediate="true"
					action="#{evaluationBackingBean.evaluationBackaction}" />

				<p:commandButton value="#{lbl['lbl.btn.save']}"
					disabled="#{evaluationBackingBean.managedBean.readOnly and evaluationBackingBean.managedBean.statusOnly}"
					style="float:right;" update="@all" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();"
					action="#{evaluationBackingBean.saveComplianceUploadCheckList}" />
			</div>
			<p:spacer height="30" />
			<br />
			<br />
			<ui:include src="evaluationHeader.xhtml" />
			<br />
			<p:panel header="#{lbl['lbl.sc.eva.technical.proposal.compliance']}">
				<ui:include src="checklistHeader.xhtml" />
			</p:panel>
			<p:spacer height="15" />
			<br />
			<br />
			<h:panelGroup>
				<ui:include src="technicalComplianceSupplierList.xhtml" />
			</h:panelGroup>
		</h:panelGroup>
	</ui:define>
</ui:composition>
