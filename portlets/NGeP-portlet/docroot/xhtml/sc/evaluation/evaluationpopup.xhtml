<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.evaluation']}" widgetVar="evaluation" modal="true"
		width="800" height="500">
		<p:panel id="s1popup" header="#{lbl['lbl.sc.eva.stage1.compliance.checklst']}"
			toggleable="true">

			<h:panelGrid columns="2">

				<h:outputLabel value="#{lbl['lbl.sc.supplier.code']}"></h:outputLabel>

				<p:inputText value="#{evaluationBackingBean.managedBean.scQtEvaluationResult.scQtProposal.supplierNo}" readonly="true"></p:inputText>

				<h:outputLabel value="#{lbl['lbl.sc.eva.ovearall.result']}" />


				<p:inputText id="stageOneResult" value="#{evaluationBackingBean.managedBean.stageOneoverAllResult}" readonly="true"></p:inputText>


			</h:panelGrid>


			<p:dataTable id="evaluationresults" var="evaluations1"
				rowKey="#{evaluations1}" rowIndexVar="index"
				  value="#{evaluationBackingBean.managedBean.complianceList}">
              
				<ac:paginator for="evaluationresults" />

				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
					style="width:35%">
					<h:outputText value="#{evaluations1.scQtCheckList.title}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.system.score']}"
					style="width:20%">
					<h:outputText value="#{evaluations1.autoScore}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.user.score']}"
					style="width:20%">
					<p:selectOneMenu value="#{evaluations1.userScore}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="M" itemValue="M" />
						<f:selectItem itemLabel="TL" itemValue="TL" />
						<f:selectItem itemLabel="TM" itemValue="TM" />
						<f:selectItem itemLabel="TH" itemValue="TH" />
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.remarks']}"
					style="width:25%">
					<p:inputTextarea value="#{evaluations1.remark}"></p:inputTextarea>
				</p:column>

			</p:dataTable>
			<p:spacer height="15"></p:spacer>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.show']}" update="stageOneResult" action="#{evaluationBackingBean.stageOneShowResult}"></p:commandButton>
			</div>


		

		</p:panel>

		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" onclick="evaluation.hide();"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				style="float:right;" onclick="evaluation.hide();"
				action="#{evaluationBackingBean.complianceSaveAction}"></p:commandButton>


		</div>
	</p:dialog>
	
	
	
</ui:composition>
