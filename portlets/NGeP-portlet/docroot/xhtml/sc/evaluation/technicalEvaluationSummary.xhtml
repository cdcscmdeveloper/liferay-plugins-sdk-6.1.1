<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.qul.sup']}"
		toggleable="true">

		<p:dataTable var="qualifiedSupplier" id="complianceQualifiedSupplier"
			editable="true" rowIndexVar="index" style="width:100%" rows="10"
			rowKey="#{qualifiedSupplier}">
			<ac:paginator for="complianceQualifiedSupplier" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
				style="width:30%">

				<p:inputText size="70"></p:inputText>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table style="width: 50%">

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
			</tr>

		</table>
	</p:panel>



	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.dis.qul.sup']}"
		toggleable="true">

		<p:dataTable var="disQualifiedSupplier"
			id="complianceDisQualifiedSupplier" editable="true"
			rowIndexVar="index" style="width:100%"
			rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="complianceDisQualifiedSupplier" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
				style="width:30%">

				<p:inputText size="70"></p:inputText>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table style="width: 50%">

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
			</tr>

		</table>
	</p:panel>


</ui:composition>
