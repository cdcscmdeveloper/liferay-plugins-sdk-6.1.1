<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:spacer height="40"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.eva.mtng.opn.committee']}"
		toggleable="true">

		<p:dataTable id="evaluationpreparecommittee" var="committeeMember" rows="10"
			rowKey="#{committeeMember.qtCommitteeActivityId}" style="width:100%"
			value="#{evaluationBackingBean.managedBean.committeeMemberList}"
			selection="#{evaluationBackingBean.managedBean.committeeActivitymultiSelect}">
			<ac:paginator for="evaluationpreparecommittee" />
			<p:columnGroup type="header">
				<p:row>

					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}"
						style="width:18%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}"
						style="width:15%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.designation']}"
						style="width:15%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.email']}"
						style="width:17%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.grade']}"
						style="width:10%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.pp']}" style="width:8%" />

					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.committee.role']}" style="width:15%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.committee.attendance']}"
						style="width:2%" />

				</p:row>

			</p:columnGroup>


			<p:column>
				<h:outputText
					value="#{committeeMember.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column>
				<h:outputText
					value="#{committeeMember.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>
			<p:column>
				<h:outputText
					value="#{committeeMember.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column>
				<h:outputText value="#{committeeMember.scCommitteeMember.email}"></h:outputText>
			</p:column>
			<p:column>
				<h:outputText value="#{committeeMember.scCommitteeMember.grade}"></h:outputText>
			</p:column>
			<p:column>
				<h:outputText
					value="#{lbl[committeeMember.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column>
				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(committeeMember.scCommitteeMember.memberRole)}"></h:outputText>
			</p:column>
			<p:column>
				<p:selectBooleanCheckbox value="#{committeeMember.attended}" />
			</p:column>


		</p:dataTable>

	</p:panel>
	<p:panel header="#{lbl['lbl.sc.spec.approval.remark']}"
		toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="Remark" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{evaluationBackingBean.managedBean.qtCommitteeRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{evaluationBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
