<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.eva.smpl.item.list']}" toggleable="true">

		<p:dataTable var="summaryItem" id="evaluationSummaryItem"
			editable="true" value="#{itemList}" rows="10"
			selection="#{evaluationBackingBean.managedBean.singlesummaryItemList}"
			selectionMode="single" rowIndexVar="index" rowKey="#{summaryItem}">

			<ac:paginator for="evaluationSummaryItem" />

			<p:ajax event="rowSelect" process="@this" partialSubmit="true"
				update="@form"
				listener="#{evaluationBackingBean.summaryItemSelect}"></p:ajax>
			<p:column headerText="#{lbl['lbl.sc.eva.summary.item']}"
				style="width:35%">

				<h:outputText value="#{summaryItem.tplSpecQuestion.clItem}"></h:outputText>

			</p:column>
		</p:dataTable>
	</p:panel>


	<h:panelGroup id="summaryItemQualified">

		<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.qul.sup']}"
			toggleable="true">

			<p:dataTable var="summaryqualSup"
				id="evaluationSummaryItemQualifiedSuppliers" rows="10"
				value="#{evaluationBackingBean.managedBean.itemSummaryQualSuppliers}"
				editable="true" rowIndexVar="index" rowKey="#{summaryqualSup}">


				<ac:paginator for="evaluationSummaryItemQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.eva.summary.ranking']}">

					<h:outputText
						value="#{summaryqualSup.evaluationResultDtls[0].evalRank}"></h:outputText>
				</p:column>


				<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
					style="width:30%">

					<h:outputText value="#{summaryqualSup.scQtProposal.supplierNo}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.eva.fin.spec.tot.score']}">
					<h:outputText
						value="#{summaryqualSup.evaluationResultDtls[0].totalScore}"></h:outputText>
				</p:column>

			</p:dataTable>


		</p:panel>

		<p:panel>
			<table>

				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							value="#{evaluationBackingBean.managedBean.itemTotQualSuppliers}"></p:inputText></td>
				</tr>

			</table>
		</p:panel>
	</h:panelGroup>

	<h:panelGroup id="summaryItemDisQualified">
		<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.dis.qul.sup']}"
			toggleable="true">

			<p:dataTable var="disQualifiedSupplier"
				id="evaluationSummaryItemDisQualifiedSuppliers" rows="10"
				value="#{evaluationBackingBean.managedBean.itemSummaryDisQualSuppliers}"
				editable="true" rowIndexVar="index" rowKey="#{disQualifiedSupplier}">

				<ac:paginator for="evaluationSummaryItemDisQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
					style="width:30%">

					<h:outputText
						value="#{disQualifiedSupplier.scQtProposal.supplierNo}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.fin.spec.tot.score']}">
					<h:outputText
						value="#{disQualifiedSupplier.evaluationResultDtls[0].totalScore}"></h:outputText>
				</p:column>


			</p:dataTable>


		</p:panel>

		<p:panel>
			<table>

				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							value="#{evaluationBackingBean.managedBean.itemTotDisQualSuppliers}"></p:inputText></td>
				</tr>

			</table>
		</p:panel>
	</h:panelGroup>
</ui:composition>
