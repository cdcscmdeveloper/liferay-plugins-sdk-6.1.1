<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">

		<p:dataTable var="summaryItem" id="evaluationSummaryItem"
			editable="true" value="#{itemList}" rows="10"
			selection="#{evaluationBackingBean.managedBean.singlesummaryItemList}"
			selectionMode="single" rowIndexVar="index" rowKey="#{summaryItem}">

			<ac:paginator for="evaluationSummaryItem" />

			<p:ajax event="rowSelect" process="@this" partialSubmit="true"
				update="@form" listener="#{evaluationBackingBean.recommendationSummaryItemSelect}"></p:ajax>
			<p:column headerText="#{lbl['lbl.sc.item']}"
				style="width:35%">

				<h:outputText value="#{summaryItem.tplSpecQuestion.clItem}"></h:outputText>

			</p:column>
		</p:dataTable>
	</p:panel>


	<h:panelGroup id="summaryItemQualified">

		<p:panel header="#{lbl['lbl.sc.eva.qualified.supplier.list']}"
			toggleable="true">

			<p:dataTable var="summaryqualSup"
				id="evaluationSummaryItemQualifiedSuppliers" rows="10"
				value="#{evaluationBackingBean.managedBean.itemSummaryQualSuppliers}"
				editable="true" rowIndexVar="index" rowKey="#{summaryqualSup}">


				<ac:paginator for="evaluationSummaryItemQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.ranking']}">

					<h:outputLabel value="#{summaryqualSup.evalRank}"
						style="text-align:right"></h:outputLabel>
				</p:column>


				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:30%">

					<h:outputText
						value="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.total.score']}">
					<h:outputLabel value="#{summaryqualSup.totalScore}"
						style="text-align:right"></h:outputLabel>
				</p:column>

			</p:dataTable>


		</p:panel>


		<table>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.passing.score']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{passingScore}"></p:inputText></td>
			</tr>
			
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.total']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.itemTotQualSuppliers}"></p:inputText></td>
			</tr>

		</table>

	</h:panelGroup>

	<h:panelGroup id="summaryItemDisQualified">
		<p:panel header="#{lbl['lbl.sc.eva.disqualified.supplier.list']}"
			toggleable="true">

			<p:dataTable var="disQualifiedSupplier"
				id="evaluationSummaryItemDisQualifiedSuppliers" rows="10"
				value="#{evaluationBackingBean.managedBean.itemSummaryDisQualSuppliers}"
				editable="true" rowIndexVar="index" rowKey="#{disQualifiedSupplier}">

				<ac:paginator for="evaluationSummaryItemDisQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:30%">

					<h:outputText
						value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.total.score']}">
					<h:outputLabel value="#{disQualifiedSupplier.totalScore}"
						style="text-align:right"></h:outputLabel>
				</p:column>


			</p:dataTable>


		</p:panel>


		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.total']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.itemTotDisQualSuppliers}"></p:inputText></td>
			</tr>

		</table>

	</h:panelGroup>
</ui:composition>
