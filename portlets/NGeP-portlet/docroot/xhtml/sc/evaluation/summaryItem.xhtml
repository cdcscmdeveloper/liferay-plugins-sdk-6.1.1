<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.eva.smpl.item.list']}" toggleable="true">
		<p:dataTable var="summaryItem" id="summaryItemId" editable="true"
			rowIndexVar="index"  rowKey="#{summaryItem}">
			<ac:paginator for="summaryItemId" />


			<p:column headerText="#{lbl['lbl.sc.eva.summary.item']}" style="width:35%">



			</p:column>
		</p:dataTable>
	</p:panel>




	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.qul.sup']}"
		toggleable="true">

		<p:dataTable var="summaryqualSup" id="summaryItemQualified"
			editable="true" rowIndexVar="index" 
			rowKey="#{summaryqualSup}">
			<ac:paginator for="summaryItemQualified" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
				style="width:30%">

				<p:inputText size="70"></p:inputText>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
			</tr>

		</table>
	</p:panel>



	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.dis.qul.sup']}"
		toggleable="true">

		<p:dataTable var="disQualifiedSupplier" id="summaryItemDisQual"
			editable="true" rowIndexVar="index" 
			rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="summaryItemDisQual" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
				style="width:30%">

				<p:inputText size="70"></p:inputText>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"></p:inputText></td>
			</tr>

		</table>
	</p:panel>


</ui:composition>
