<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup id="govtotalContractAmount">
		<ui:param name="scoringPnlId" value="govcontractorAmountId" />
		<ui:param name="scoringList"
			value="#{evaluationBackingBean.managedBean.technicalGovNoOfContracts}"></ui:param>
		<ui:param name="scoringPnlName"
			value="#{lbl['lbl.sc.eva.cmpny.score.tot.contract.amount']}"></ui:param>

		<table style="width: 30%">
			<tr>
				<td><h:outputText value="#{lbl['lbl.sc.eva.s1.user.score']}"
						rendered="#{checklistScoreType eq '2'}" /></td>
				<td><p:inputText value="#{noOfContracts.userScore}"
						maxlength="18" disabled="#{pageDisable}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}"></p:inputText></td>
			</tr>
		</table>

		<ui:include src="evaluationScoring.xhtml"></ui:include>
	</h:panelGroup>


</ui:composition>
