
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup>
		<p:panel header="#{lbl['lbl.sc.compliance.list']}" toggleable="true"
			collapsed="true">
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.evaluation.stage.document.instruction']}" escape="false" />
			
			<p:dataTable var="techComplianceList" id="sampleComplianceListId"
				rows="10"
				value="#{evaluationBackingBean.managedBean.technicalComplinaceList}"
				rowIndexVar="index" style="width:100%"
				rowKey="#{techComplianceList}">
				<ac:paginator for="sampleComplianceListId" />


				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}" style="width:90%">
					<h:outputText value="#{techComplianceList.scQtCheckList.title}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
					<p:commandLink ajax="false"
						actionListener="#{evaluationBackingBean.downloadEncryptedFile(techComplianceList.scQtProposalChecklistAttachment)}"
						process="@this" partialSubmit="true">
						<h:graphicImage value="/css/images/design/icon_txt.png" />

					</p:commandLink>
				</p:column>

			</p:dataTable>



		</p:panel>
	</h:panelGroup>

</ui:composition>
