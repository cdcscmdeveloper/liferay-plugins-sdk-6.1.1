<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.qul.sup']}"
		toggleable="true">

		<p:dataTable var="finEvaluationqualifiedSupplier" rows="10"
			id="qualifiedListId"
			value="#{evaluationBackingBean.managedBean.evaluationSummaryQualSuppliers}"
			editable="true" rowIndexVar="index" rowKey="#{qualifiedSupplier}">
			<ac:paginator for="qualifiedListId" />


			<p:column headerText="#{lbl['lbl.sc.eva.summary.ranking']}">

				<h:outputText
					value="#{finEvaluationqualifiedSupplier.evaluationResultDtls[0].evalRank}"></h:outputText>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
				style="width:30%">

				<h:outputText
					value="#{finEvaluationqualifiedSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.fin.spec.tot.score']}">
				<h:outputText
					value="#{finEvaluationqualifiedSupplier.evaluationResultDtls[0].totalScore}"></h:outputText>
			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{evaluationBackingBean.managedBean.evaTotQualifiedSuppliers}"></p:inputText></td>
			</tr>

		</table>
	</p:panel>



	<p:panel header="#{lbl['lbl.sc.eva.compliance.sum.dis.qul.sup']}"
		toggleable="true">

		<p:dataTable var="disQualifiedSupplier" rows="10"
			id="disQualifiedListId" editable="true"
			value="#{evaluationBackingBean.managedBean.evaluationSummaryDisQualSuppliers}"
			rowIndexVar="index" rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="disQualifiedListId" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.sum.sup.code']}"
				style="width:30%">

				<h:outputText
					value="#{disQualifiedSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.fin.spec.tot.score']}">
				<h:outputText
					value="#{disQualifiedSupplier.evaluationResultDtls[0].totalScore}"></h:outputText>
			</p:column>


		</p:dataTable>


	</p:panel>

	<p:panel>
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.eva.compliance.sum.total.sup']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						value="#{evaluationBackingBean.managedBean.evaTotDisQualifiedSuppliers}"></p:inputText></td>
			</tr>

		</table>
	</p:panel>


</ui:composition>
