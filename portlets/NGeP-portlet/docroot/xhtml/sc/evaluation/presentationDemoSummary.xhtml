<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.eva.qualified.supplier.list']}"
		toggleable="true">

		<p:dataTable var="finEvaluationqualifiedSupplier" rows="10"
			id="qualifiedListId"
			value="#{evaluationBackingBean.managedBean.evaluationSummaryQualSuppliers}"
			editable="true" rowIndexVar="index" rowKey="#{qualifiedSupplier}">
			<ac:paginator for="qualifiedListId" />


			<p:column headerText="#{lbl['lbl.sc.ranking']}">

				<h:outputLabel value="#{finEvaluationqualifiedSupplier.evalRank}"
					style="text-align:right"></h:outputLabel>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:30%">

				<h:outputText
					value="#{finEvaluationqualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}">
				<h:outputLabel value="#{finEvaluationqualifiedSupplier.totalScore}" style="text-align:right"></h:outputLabel>
			</p:column>


		</p:dataTable>


	</p:panel>

	
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.total']}" /></td>
				<td><p:inputText readonly="true" disabled="true" style="text-align:right"
						value="#{evaluationBackingBean.managedBean.evaTotQualifiedSuppliers}"></p:inputText></td>
			</tr>

		</table>
	



	<p:panel header="#{lbl['lbl.sc.eva.disqualified.supplier.list']}"
		toggleable="true">

		<p:dataTable var="disQualifiedSupplier" rows="10"
			id="disQualifiedListId" editable="true"
			value="#{evaluationBackingBean.managedBean.evaluationSummaryDisQualSuppliers}"
			rowIndexVar="index" rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="disQualifiedListId" />


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:30%">

				<h:outputText
					value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}">
				<h:outputLabel value="#{disQualifiedSupplier.totalScore}" style="text-align:right"></h:outputLabel>
			</p:column>


		</p:dataTable>


	</p:panel>

	
		<table>

			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.total']}" /></td>
				<td><p:inputText readonly="true" disabled="true" style="text-align:right"
						value="#{evaluationBackingBean.managedBean.evaTotDisQualifiedSuppliers}"></p:inputText></td>
			</tr>

		</table>
	


</ui:composition>
