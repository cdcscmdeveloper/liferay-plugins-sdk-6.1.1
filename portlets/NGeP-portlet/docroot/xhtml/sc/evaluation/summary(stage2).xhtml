<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


 <!-- <ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" />  -->

	<p:panel header="#{lbl['lbl.sc.eva.summary.head']}" toggleable="true" >
		<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50" >
			<h:outputLabel value="#{lbl['lbl.sc.eva.summary.view.by']}"></h:outputLabel>
			<p:selectOneRadio style="padding-right: 20px;" value="#{evaluationBackingBean.managedBean.viewBy}">
				<f:selectItem itemLabel="Package" itemValue="P" />
				<f:selectItem itemLabel="Item" itemValue="I" />
               <p:ajax event="change" process="@this" partialSubmit="true" update="evaluationsummarystage2supplier,evaluationsummarystage2Item" listener="#{evaluationBackingBean.changedView}" ></p:ajax>
			</p:selectOneRadio>
		</h:panelGrid>
		<p:commandLink value="#{lbl['lbl.sc.eva.summary.list']}"></p:commandLink>
		<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth20" >
			<h:outputLabel value="#{lbl['lbl.sc.eva.summary.multile']}"></h:outputLabel>
			<p:inputText value="#{evaluationBackingBean.managedBean.scqt.scQtCriterias.multiLocality ? 'Yes' : 'No'}" readonly="true" disabled="true"></p:inputText>
		</h:panelGrid>
	<ui:fragment rendered="#{evaluationBackingBean.managedBean.scqt.scQtCriterias.multiLocality eq 'Yes'}">
		<p:dataTable id="evaluationsummarystage2Location" var="zones" rows="10"
			rowKey="#{zones}" rowIndexVar="index"
			value="#{evaluationBackingBean.managedBean.locationList}" >
			<ac:paginator for="evaluationsummarystage2Location" />

			<p:column headerText="#{lbl['lbl.sc.eva.summary.loc']}"
				style="width:20%">
				<p:commandLink>
				<h:outputText value="#{zones.zoneName}"></h:outputText>
				</p:commandLink>
			</p:column>

		</p:dataTable> 	
		</ui:fragment>
		<p:spacer height="20" />
		<p:commandLink value="#{lbl['lbl.sc.eva.summary.item.list']}"></p:commandLink>

		<p:dataTable id="evaluationsummarystage2Item" var="item" rows="10"
			rowKey="#{item}" rowIndexVar="index"
			value="#{evaluationBackingBean.managedBean.scQtItemList}">
			<ac:paginator for="evaluationsummarystage2Item" />

			<p:column headerText="#{lbl['lbl.sc.eva.summary.item']}"
				style="width:20%">
				<ui:fragment rendered="#{evaluationBackingBean.managedBean.viewBy eq 'P'}">
				<h:outputText value="#{item.itemName}"></h:outputText>
				</ui:fragment>
				<ui:fragment rendered="#{evaluationBackingBean.managedBean.viewBy eq 'I'}">
				<p:commandLink>
				<h:outputText value="#{item.itemName}"></h:outputText>
				</p:commandLink>
				</ui:fragment>
			</p:column>

		</p:dataTable>
		<p:spacer height="20" />
		<p:commandLink value="#{lbl['lbl.sc.eva.summary.qualified']}"></p:commandLink>
	
		<p:dataTable id="evaluationsummarystage2supplier" var="qualified" rows="10"
		value="#{evaluationBackingBean.managedBean.qualifiedList}"
			rowKey="#{qualified}" rowIndexVar="index">
			<ac:paginator for="evaluationsummarystage2supplier" />

			<p:column headerText="#{lbl['lbl.sc.eva.summary.ranking']}"
				style="width:10%">
			<h:outputText value="#{qualified.evaluationResultDtls.get(0).autoRank}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
				style="width:20%">
				<h:outputText value="#{qualified.scQtProposal.supplierNo}"></h:outputText>
			</p:column>



			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:10%">
			<h:outputText value="#{qualified.evaluationResultDtls.get(0).totalScore}"></h:outputText>
			</p:column>


              <p:column headerText="#{lbl['lbl.sc.eva.s1.manual.remarks']}" 
				style="width:25%" >
				
				<p:inputTextarea rows="2" rendered="#{evaluationBackingBean.managedBean.viewBy eq 'I'}"></p:inputTextarea>
				
			</p:column>
        
		</p:dataTable>

		<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth20">


			<h:outputLabel value="#{lbl['lbl.sc.eva.summary.total']}"></h:outputLabel>
			<p:inputText></p:inputText>



		</h:panelGrid>
		<p:spacer height="20" />
		<p:commandLink value="#{lbl['lbl.sc.eva.summary.disqualified']}"></p:commandLink>

		<p:dataTable id="evaluationsummarystage2disqualified" var="disqualified" rows="10"
		value="#{evaluationBackingBean.managedBean.disQualifiedList}"
			rowKey="#{qualified}" rowIndexVar="index">
			<ac:paginator for="evaluationsummarystage2disqualified" />
			<p:column headerText="#{lbl['lbl.sc.eva.summary.ranking']}"
				style="width:35%">
			<h:outputText value="#{disqualified.evaluationResultDtls.get(0).autoRank}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
				style="width:30%">
				<h:outputText value="#{disqualified.scQtProposal.supplierNo}"></h:outputText>
			</p:column>



			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.score']}"
				style="width:35%">
		<h:outputText value="#{disqualified.evaluationResultDtls.get(0).totalScore}"></h:outputText>
			</p:column>
			
			

<!--  <p:panel styleClass="mystyleClass111"  rendered="#{evaluationBackingBean.managedBean.viewBy eq 'I'}">
			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.remarks']}" 
				style="width:25%" >
				<p:inputTextarea rows="2" ></p:inputTextarea>
			</p:column>
</p:panel>
 -->
		</p:dataTable>

		<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth20">


			<h:outputLabel value="Total"></h:outputLabel>
			<p:inputText></p:inputText>



		</h:panelGrid>
	</p:panel>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('4','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('4','5')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
				</div></td>
		</tr>
	</table>

</ui:composition>
