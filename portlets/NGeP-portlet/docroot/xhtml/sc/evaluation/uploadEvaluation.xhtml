<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:dialog id="supportAttachDlgids" widgetVar="supportAttachDlg"
		modal="true" dynamic="true" hideEffect="explode" resizable="false"
		width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{evaluationBackingBean.reportFileUpload}"
			mode="advanced" id="dlgsuploadids"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" 
			cancelLabel="#{lbl['lbl.btn.cancel']}"
			update="@form" oncomplete="supportAttachDlg.hide()">
		</p:fileUpload>
	</p:dialog>

	
	
		<ac:scSingleFileUploadPopup widgetVar="demoSupplierListUpload"
		fileUploadListener="evaluationBackingBean.preSentationDemoFileUpload"
		readonly="#{evaluationBackingBean.managedBean.readOnly}"
		update="@([id$=evaluationPresentationDemoTechnicalQualifiedSupplierListDatatableIds])" />

	

<ac:scSingleFileUploadPopup widgetVar="demoChecklistAttachDlg"
		fileUploadListener="evaluationBackingBean.demoChecklistUpload"
		readonly="#{evaluationBackingBean.managedBean.readOnly}"
		update="@([id$=demoremarksupdtls])" />
</ui:composition>
