<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="Manual" widgetVar="manual" modal="true"
		width="800" height="500">
		<p:panel id="s1Manualpopup" header="Stage1-Manual Submission"
			toggleable="true">

			<h:panelGrid columns="2">

				<h:outputLabel value="#{lbl['lbl.sc.supplier.code']}"></h:outputLabel>

				<p:inputText value="#{evaluationBackingBean.managedBean.scQtEvaluationResult.scQtProposal.supplierNo}" readonly="true"></p:inputText>

				<h:outputLabel value="#{lbl['lbl.sc.eva.ovearall.result']}" />


				<p:inputText id="overAllResult" value="#{evaluationBackingBean.managedBean.overAllResult}" readonly="true"></p:inputText>


			</h:panelGrid>


			<p:dataTable id="manualpopupresults" var="manuals1evaluation"
				rowKey="#{manuals1evaluation}" rowIndexVar="index"
				 value="#{evaluationBackingBean.managedBean.manualEvaluateList}"
				  	selection="#{evaluationBackingBean.managedBean.manualMultiSelect}">
              
				<ac:paginator for="manualpopupresults" />
					<p:ajax event="rowSelectCheckbox" listener="#{evaluationBackingBean.onManualRowSelect}"></p:ajax>
						<p:ajax event="rowUnselectCheckbox" listener="#{evaluationBackingBean.onManualRowUnSelect}"></p:ajax>
                 <p:column selectionMode="multiple" style="width:2%;text-align:center;" />
				<p:column headerText="#{lbl['lbl.sc.label.no']}"
					style="width:35%">
					<p:selectOneMenu  value="#{manuals1evaluation.proposalLabel.proposalLabelId}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems value="#{evaluationBackingBean.managedBean.manualProposalLabel}" var="label" 
                       itemValue="#{label.proposalLabelId}" 
                       itemLabel="#{label.labelNumber}" />
					</p:selectOneMenu>
				</p:column>

				

				<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
					style="width:20%">
					<p:selectOneMenu value="#{manuals1evaluation.userScore}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="M" itemValue="M" />
						<f:selectItem itemLabel="TL" itemValue="TL" />
						<f:selectItem itemLabel="TM" itemValue="TM" />
						<f:selectItem itemLabel="TH" itemValue="TH" />
					</p:selectOneMenu>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.remarks']}"
					style="width:25%">
					<p:inputTextarea value="#{manuals1evaluation.remark}"></p:inputTextarea>
				</p:column>
				

			</p:dataTable>
			<p:spacer height="10"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this,manualpopupresults" partialSubmit="true"
				action="#{evaluationBackingBean.adds1ManualAction}"
				update="manualpopupresults"/>
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
			action="#{evaluationBackingBean.deleteManualSubmission}" update="manualpopupresults"/>
            
		</div>
			<p:spacer height="15"></p:spacer>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.show']}" update="overAllResult" action="#{evaluationBackingBean.manualShowResult}"></p:commandButton>
			</div>


		

		</p:panel>

		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" oncomplete="manual.hide();"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.btn.save']}"
				style="float:right;" oncomplete="manual.hide();"
				 action="#{evaluationBackingBean.manualSaveAction}"></p:commandButton>


		</div>
	</p:dialog>
	
	
	
	
</ui:composition>
