	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.eva.prepare.meeting']}"
		toggleable="true">

		<p:dataTable var="meeting" id="evaluationmeetingDetails" rows="10"
			value="#{evaluationBackingBean.managedBean.scQtMeetings}"
			selection="#{evaluationBackingBean.managedBean.meetingMultiSelect}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{meeting}">
			<ac:paginator for="evaluationmeetingDetails" />

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.date']}"
				style="width:30%">


				<p:calendar value="#{meeting.meetingDate}" showOn="button"></p:calendar>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.loc']}">


				<p:inputText value="#{meeting.meetingLocation}" size="70"></p:inputText>

			</p:column>

		
		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.add']}"
				process="@this,evaluationmeetingDetails" partialSubmit="true"
				action="#{evaluationBackingBean.addMeetingAction}"
				update="evaluationmeetingDetails" icon="ui-icon-add"/>
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}" icon="ui-icon-delete" />

		</div>

	</p:panel>


	<p:panel header="#{lbl['lbl.sc.eva.committee.details']}"
		toggleable="true">

		<p:dataTable id="evaluationpreparecommittee" var="committeeMember" rows="10"
			rowKey="#{committeeMember.qtCommitteeActivityId}" 
			value="#{evaluationBackingBean.managedBean.committeeMemberList}" 
				selection="#{evaluationBackingBean.managedBean.committeeActivitymultiSelect}">
			<ac:paginator for="evaluationpreparecommittee"   />
			<p:columnGroup type="header">
				<p:row>

					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.committee.name']}" style="width:48%" />

					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.committee.role']}" style="width:25%" />
					<p:column colspan="1"
						headerText="#{lbl['lbl.sc.eva.committee.attendance']}"
						style="width:2%" />

				</p:row>

			</p:columnGroup>


			<p:column>
				<h:outputText value="#{committeeMember.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column>
				<h:outputText value="#{committeeMember.scCommitteeMember.memberRole}"></h:outputText>
			</p:column>
			<p:column selectionMode="multiple"  />


		</p:dataTable>

	</p:panel>
	<table style="width: 100%">
		<tr>
			<td></td>
			<td>
				<div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}" icon="ui-icon-next"
						iconPos="right" actionListener="#{evaluationBackingBean.setTabValue(0,1)}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</div>
			</td>
		</tr>
	</table>

</ui:composition>
