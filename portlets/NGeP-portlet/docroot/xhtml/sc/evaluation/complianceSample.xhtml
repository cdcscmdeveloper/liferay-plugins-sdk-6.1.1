<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">







	<ui:fragment
		rendered="#{evaluationBackingBean.managedBean.countDays ge 0}">
		<p:panel style="margin-top:20px;">
			<table style="width: 50%">

				<tr>
					<td><h:outputLabel style="width:122px;"
							value="#{lbl['lbl.sc.eva.compliance.smpl.opn.date']}" /></td>
					<td><p:inputText
							value="#{evaluationBackingBean.managedBean.scQt.sampleClosingDate}"
							readonly="true" disabled="true">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.eva.compliance.smpl.count.down']}" /></td>
					<td><p:inputText
							value="#{evaluationBackingBean.managedBean.countDays}"
							readonly="true" disabled="true"></p:inputText></td>
				</tr>
			</table>
		</p:panel>
	</ui:fragment>

	<p:spacer height="40"></p:spacer>
	<ui:fragment
		rendered="#{evaluationBackingBean.managedBean.countDays lt 0}">
		<p:panel header="#{lbl['lbl.sc.eva.compliance.smpl.sup.list']}"
			toggleable="true">

			<p:dataTable var="complianceSample" id="complianceSample" rows="10"
				rowIndexVar="index" style="width:100%"
				value="#{evaluationBackingBean.managedBean.complianceSampleLblsupplier}"
				first="#{evaluationBackingBean.managedBean.evaluationsampleTableRow}"
				rowKey="#{complianceSample}">
				<ac:paginator for="complianceSample" />


				<p:column headerText="#{lbl['lbl.sc.eva.compliance.smpl.sup.code']}"
					style="width:60%">

					<h:outputText value="#{complianceSample.scQtProposal.supplierNo}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.compliance.smpl.lbl.no']}"
					style="width:30%">


					<h:outputText value="#{complianceSample.lableNo}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
					style="width:10%">

					<p:commandButton value="#{lbl['lbl.sc.eva.btn.compliance']}"
						process="@this" partialSubmit="true"
						action="#{evaluationBackingBean.sampleCompliance(complianceSample)}" />


				</p:column>

			</p:dataTable>


		</p:panel>

	</ui:fragment>

</ui:composition>
