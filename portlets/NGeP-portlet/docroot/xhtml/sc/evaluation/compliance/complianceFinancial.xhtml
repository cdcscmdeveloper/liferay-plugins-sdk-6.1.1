<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">






	<p:panel id="financialComplianceChecklistmainPageProposalspecCommitteeIds" header="#{lbl['lbl.sc.financial.proposal']}"
		toggleable="true">
		
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.compliance.stage.instruction']}" escape="false" />

		<p:dataTable var="complianceFinancial"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			id="complianceFinancialProposal" editable="true" rowIndexVar="index"
			value="#{evaluationBackingBean.managedBean.compliancefinancialCheckList}"
			first="#{evaluationBackingBean.managedBean.evaluationfinancialTableRow}"
			rowKey="#{complianceFinancial}">
			<!-- 	<ac:paginator for="complianceFinancialProposal" /> -->


			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:55%;white-space: normal;">

				<h:outputText value="#{complianceFinancial.title}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.type']}"
				style="width:20%">


				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(complianceFinancial.definationType)}"></h:outputText>

			</p:column>


			<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
				style="width:15%;white-space: normal;">


				<h:outputText
					value="#{evaluationBackingBean.getStatusDescById(complianceFinancial.pmEvalStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;text-align: center;">

				<p:commandButton value="#{lbl['lbl.sc.btn.compliance']}"
					rendered="#{complianceFinancial.definationType.parameterCode eq 'UP' or complianceFinancial.definationType.parameterCode eq 'NA'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.complianceUploadCheckList(complianceFinancial,index,'F')}" />


			</p:column>

		</p:dataTable>


	</p:panel>



</ui:composition>
