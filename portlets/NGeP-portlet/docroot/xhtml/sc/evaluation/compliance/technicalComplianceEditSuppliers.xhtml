<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>

			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
		<ui:remove>#10098 Start Vinod 21092026</ui:remove>
		<p:blockUI block=":form" widgetVar="blockWidgetAutoSave">
			<div
				style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
				<h:panelGrid columns="1">
					<h:graphicImage value="/css/images/ajax-loader-autosave.gif" />
				</h:panelGrid>
				<h:panelGrid columns="1">
					<h:outputText escape="false" style="font-weight: bold;"
						value="#{lbl['lbl.tpl.autosave.loading.msg']}" />
				</h:panelGrid>
			</div>
		</p:blockUI>
		<ui:remove>#10098 End Vinod 21092026</ui:remove>
			<p:messages id="technicalCompliance" showDetail="true"
				autoUpdate="true" closable="true" severity="error,info"
				showSummary="false" />

			<table width="100%" class="BtnSpacing">
				<tr>
					<td align="right"><p:commandButton
							value="#{lbl['lbl.btn.back']}" style="float:left;"
							immediate="true" 
							action="#{evaluationBackingBean.evaluationBackaction}" />
					<ui:remove>#10098 Start Vinod 21092026 updated blockWidget</ui:remove>
					<p:commandButton
							value="#{lbl['lbl.btn.save']}"
							disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
							style="float:right;" update="@all" onstart="blockWidgetAutoSave.show();"
							oncomplete="blockWidgetAutoSave.hide();" 
							action="#{evaluationBackingBean.saveComplianceUploadCheckList}" />
					<ui:remove>#10098 End Vinod 21092026</ui:remove>
					<ui:remove>#10098 Start Vinod 21092026</ui:remove>
					<p:poll interval="900" id="autoSaveComplianceId"
						rendered="#{!(evaluationBackingBean.managedBean.statusOnly 
						or evaluationBackingBean.managedBean.complianceReEvaluateRequired)}"
						listener="#{evaluationBackingBean.autoSaveComplianceChecklist}"
						onstart="blockWidgetAutoSave.show();"
						oncomplete="blockWidgetAutoSave.hide();"
						update="@all" />
					<ui:remove>#10098 End Vinod 21092026</ui:remove>
					</td>
				</tr>
			</table>
			<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />
			
			<p:panel id="technicalComplianceSupplierHeaderIds" header="#{lbl['lbl.sc.eva.technical.proposal.compliance']}" toggleable="true">
				<ui:include src="/xhtml/sc/evaluation/complianceChecklistHeader.xhtml" />
			</p:panel>
			
			<h:panelGroup>
				<ui:include src="technicalComplianceSupplierList.xhtml" />
			</h:panelGroup>
		</h:panelGroup>
	</ui:define>
</ui:composition>
