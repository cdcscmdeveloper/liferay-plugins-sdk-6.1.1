<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.compliance.stage.document.instruction']}"
			escape="false" />

		<p:dataTable var="complianceTechnicalSupplier" rows="10" lazy="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			id="complianceTechnicalSupplier" editable="true" rowIndexVar="index"
			style="width:100%" rowKey="#{complianceTechnicalSupplier}">
			<ac:paginator for="complianceTechnicalSupplier" />

			<p:ajax event="page"
				listener="#{evaluationBackingBean.complianceProposalSubmitSuppliers}"
				update="complianceTechnicalSupplier" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:20%">

				<h:outputText
					value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.scQtProposal.submitted eq 'true'}">
					<h:commandLink immediate="true"
						disabled="#{evaluationBackingBean.managedBean.readOnly and evaluationBackingBean.managedBean.statusOnly}"
						action="#{evaluationBackingBean.downloadEncryptedFile(complianceTechnicalSupplier.scQtProposalChecklistAttachment)}" >
						<h:graphicImage value="/css/images/design/icon_txt.png" />
					</h:commandLink>
				</ui:fragment>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.submission.status']}"
				style="width:20%">
				<h:outputText
					value="#{complianceTechnicalSupplier.scQtProposal.submitted ? lbl['lbl.txt.submitted']:lbl['lbl.txt.not.submitted']}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.compliance.status']}"
				style="width:15%">
				<p:selectOneMenu
					disabled="#{complianceTechnicalSupplier.scQtProposal.submitted eq 'false' or  evaluationBackingBean.managedBean.statusOnly or  evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
					value="#{complianceTechnicalSupplier.compliance}">

					<f:selectItems
						value="#{evaluationBackingBean.getDropdownCodeValues(ParameterTypeConst.complianceStatus)}"></f:selectItems>
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}"
				style="width:35%;white-space: normal;">
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.scQtProposal.submitted eq 'true'}">
					<p:inputTextarea rows="2" cols="40" maxlength="200"
						disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
						id="complianceRemarksid"
						value="#{complianceTechnicalSupplier.remark}">
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:inputTextarea>
					<p:message id="complianceRemarksidEvaluation"
						for="complianceRemarksid" display="icon"></p:message>


				</ui:fragment>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
