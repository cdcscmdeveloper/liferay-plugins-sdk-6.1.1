<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">







	<ui:fragment
		rendered="#{evaluationBackingBean.managedBean.countDays gt 0 or(evaluationBackingBean.managedBean.countDays eq 0 and evaluationBackingBean.managedBean.currentTime lt 12)}">
		<h:panelGroup>
			<table style="width: 50%">

				<tr>
					<td><h:outputLabel style="width:140px;"
							value="#{lbl['lbl.sc.eva.smpl.open.date']}" /></td>
					<td><p:inputText
							value="#{evaluationBackingBean.managedBean.scQt.sampleClosingDate}"
							readonly="true" disabled="true">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.remaining.day']}" /></td>
					<td><p:inputText
							value="#{evaluationBackingBean.managedBean.countDays}"
							readonly="true" disabled="true"></p:inputText></td>
				</tr>
			</table>
		</h:panelGroup>
	</ui:fragment>


	<ui:fragment
		rendered="#{evaluationBackingBean.managedBean.countDays lt 0 or(evaluationBackingBean.managedBean.countDays eq 0 and evaluationBackingBean.managedBean.currentTime ge 12)}">
		<p:panel
			id="sampletechnicalChecklistComplianceChecklistmainPageProposalspecCommitteeIds"
			header="#{lbl['lbl.sc.eva.sample.proposal.compliance']}"
			toggleable="true">

			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.eva.compliance.stage.instruction']}"
				escape="false" />

			<p:dataTable var="complianceSample" id="complianceSample" rows="10"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" style="width:100%" lazy="true"
				value="#{evaluationBackingBean.managedBean.complianceSampleLblsupplierDM}"
				first="#{evaluationBackingBean.managedBean.evaluationsampleTableRow}"
				rowKey="#{complianceSample}">
				<ac:paginator for="complianceSample" />


				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:60%">

					<h:outputText value="#{complianceSample.scQtProposal.supplierNo}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.label.no']}" style="width:30%">


					<h:outputText value="#{complianceSample.lableNo}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.action']}"
					style="width:10%;text-align: center;">

					<p:commandButton value="#{lbl['lbl.sc.btn.compliance']}"
						process="@this" partialSubmit="true"
						action="#{evaluationBackingBean.complianceSampleItems(complianceSample)}" />


				</p:column>

			</p:dataTable>


		</p:panel>

	</ui:fragment>

</ui:composition>
