<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="financialComplianceSuppliersListingComplianceStageIds" header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.compliance.stage.supplier.listing.instruction']}"
			escape="false" />

		<p:dataTable var="complianceTechnicalSupplier" rows="10" lazy="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			id="complianceTechnicalSupplier" editable="true" rowIndexVar="index"
			style="width:100%" rowKey="#{complianceTechnicalSupplier}">
			<ac:paginator for="complianceTechnicalSupplier" />

			<p:ajax event="page"
				listener="#{evaluationBackingBean.complianceProposalSubmitSuppliers}"
				update="complianceTechnicalSupplier" />
			<ui:param name="isRejected" value="#{not empty complianceTechnicalSupplier.scQtProposal.supplierRejectionRemark}"/> <ui:remove><!-- 6906 --></ui:remove>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:20%; text-align:center;">
				<ui:remove><!-- 6906 - start --></ui:remove>
				<table style="table-layout: fixed; margin:auto !important; max-width:90px !important">
					<tr>
						<td style="text-align:center; border: 0 !important"/>
						<td style="text-align:center; border: 0 !important">
							<h:outputText value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align:center; border: 0 !important">
							<ac:iconRejectRemarkBox show="#{isRejected}" id="remarkId"
							remark="#{complianceTechnicalSupplier.scQtProposal.supplierRejectionRemark.remark}"
							supplierCode="#{complianceTechnicalSupplier.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
				<ui:remove><!-- 6906 - end --></ui:remove>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
				style="width:70%;text-align: center;">
				
				<h:outputText 
					value="#{lbl['lbl.sc.eva.compliance.stage.completed']}" rendered="#{complianceTechnicalSupplier.scQtProposalChecklistAttachment ne null and complianceTechnicalSupplier.compliance ne null and complianceTechnicalSupplier.compliance ne 2}"/>
				
				<h:outputText
					value="#{lbl['lbl.sc.eva.compliance.stage.pending']}" rendered="#{complianceTechnicalSupplier.scQtProposalChecklistAttachment ne null and (complianceTechnicalSupplier.compliance eq null or complianceTechnicalSupplier.compliance eq 2)}"/>
					
				<h:outputText 
					value="#{lbl['lbl.sc.eva.compliance.stage.completed']}" rendered="#{complianceTechnicalSupplier.scQtProposalChecklistAttachment eq null}"/>
				
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;text-align: center;">
				
				<p:commandButton value="#{lbl['lbl.sc.btn.compliance']}"
					rendered="#{complianceTechnicalSupplier.scQtProposalChecklistAttachment ne null and (complianceTechnicalSupplier.compliance eq null or complianceTechnicalSupplier.compliance eq 2)}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.complianceUploadBasedOnSupp(complianceTechnicalSupplier,'F')}" />
					
						<p:commandButton value="#{lbl['lbl.btn.view']}"
					rendered="#{(complianceTechnicalSupplier.scQtProposalChecklistAttachment ne null and complianceTechnicalSupplier.compliance ne null and complianceTechnicalSupplier.compliance ne 2) or complianceTechnicalSupplier.scQtProposalChecklistAttachment eq null}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.complianceUploadBasedOnSupp(complianceTechnicalSupplier,'F')}" />
					
<!-- 				<p:commandButton value="#{lbl['lbl.btn.view']}" -->
<!-- 					rendered="#{complianceTechnicalSupplier.scQtProposalChecklistAttachment eq null}" -->
<!-- 					process="@this" partialSubmit="true" -->
<!-- 					action="#{evaluationBackingBean.complianceUploadBasedOnSupp(complianceTechnicalSupplier,'F')}" /> -->
					
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
