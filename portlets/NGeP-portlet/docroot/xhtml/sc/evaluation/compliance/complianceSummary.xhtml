<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">







	<p:panel id="complianceUploadedViewChecklIstSupplierSummaryIdsQualified"
		header="#{lbl['lbl.sc.eva.qualified.supplier.list.compliance.stage']}"
		toggleable="true">

		<p:dataTable var="qualifiedSupplier" id="complianceQualifiedSupplier"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" editable="true" rowIndexVar="index"
			value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"
			lazy="true" rowKey="#{qualifiedSupplier}">
			<ac:paginator for="complianceQualifiedSupplier" />
			
			<ui:param name="isRejected"
				value="#{not empty qualifiedSupplier.qtEvaluationResult.scQtProposal.supplierRejectionRemark}" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:20%; text-align:center;">
				<table
					style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
					<tr>
						<td style="text-align: center; border: 0 !important" />
						<td style="text-align: center; border: 0 !important"><h:outputText
								value="#{qualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
								show="#{isRejected}" id="summaryRemarkId"
								remark="#{qualifiedSupplier.qtEvaluationResult.scQtProposal.supplierRejectionRemark.remark}"
								supplierCode="#{qualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
			</p:column>
		</p:dataTable>
		<p:spacer height="10px" />
		<table>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
			</tr>

		</table>

	</p:panel>






	<p:panel id="complianceUploadedViewChecklIstSupplierSummaryIdsdisQualified"
		header="#{lbl['lbl.sc.eva.disqualified.supplier.list.compliance.stage']}"
		toggleable="true">

		<p:dataTable var="disQualifiedSupplier"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"
			lazy="true" id="complianceDisQualifiedSupplier" editable="true"
			rows="10" rowIndexVar="index" rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="complianceDisQualifiedSupplier" />

			<ui:param name="isRejectedDisqualified" value="#{not empty disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierRejectionRemark}"/>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
				<table style="table-layout: fixed; margin:auto !important; max-width:90px !important">
					<tr>
						<td style="text-align:center; border: 0 !important"/>
						<td style="text-align:center; border: 0 !important">
							<h:outputText value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align:center; border: 0 !important">
							<ac:iconRejectRemarkBox show="#{isRejectedDisqualified}" id="summaryRemarkId"
							remark="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierRejectionRemark.remark}"
							supplierCode="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
			</p:column>
		</p:dataTable>
		<p:spacer height="10px" />
		<table>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM.rowCount}"></p:inputText></td>
			</tr>

		</table>

	</p:panel>





</ui:composition>
