<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="sampleCompliance" showDetail="true" autoUpdate="true"
			closable="true" severity="error,info" showSummary="false" />
		<table width="100%" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{evaluationBackingBean.evaluationBackaction}" /> <p:commandButton
						value="#{lbl['lbl.btn.save']}"
						disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
						style="float:right;" update="@all" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						action="#{evaluationBackingBean.saveComplianceSample}" /></td>
			</tr>
		</table>
		<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />

		<p:spacer height="10px;"></p:spacer>
		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.supplier.code']}"></h:outputLabel></td>
				<td><p:inputText size="50"
						value="#{evaluationBackingBean.managedBean.scQtSampleLbl.scQtProposal.supplierNo}"
						disabled="true"></p:inputText></td>
			</tr>
			<tr>
				<td style="width: 100px;"><h:outputLabel
						value="#{lbl['lbl.sc.label.no']}"></h:outputLabel></td>
				<td><p:inputText size="50"
						value="#{evaluationBackingBean.managedBean.scQtSampleLbl.lableNo}"
						disabled="true"></p:inputText></td>
			</tr>
		</table>



		<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">

			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.eva.sample.proposal.item.instruction']}"
				escape="false" />

			<p:dataTable var="sampleItem" id="sampleItemId" editable="true"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rows="10" selectionMode="single" lazy="true"
				selection="#{evaluationBackingBean.managedBean.sampleItemSelection}"
				value="#{evaluationBackingBean.managedBean.complianceSampleItemListDM}"
				rowIndexVar="index" style="width:100%" rowKey="#{sampleItem}">
				<ac:paginator for="sampleItemId" />
				<p:ajax event="page"
					listener="#{evaluationBackingBean.saveComplianceSampleItemsDM}"
					update="sampleItemId" />

				<p:ajax event="rowSelect" process="@this" partialSubmit="true"
					update="@([id$=itemListSpecification])"
					listener="#{evaluationBackingBean.retriveSpecificationsByItem}"></p:ajax>


				<p:column headerText="#{lbl['lbl.sc.item']}" style="width:35%;white-space: normal;">

					<h:outputText value="#{sampleItem.scRequestItem.itemName}"></h:outputText>


				</p:column>
				<ui:remove> #11104 - start </ui:remove>
				<p:column headerText="#{lbl['lbl.sc.spec.local.goods']}" style="width:10%;">
					<h:outputText
						value="#{lbl['lbl.sc.qt.sample.type.of.goods.local']}"
						rendered="#{sampleItem.scRequestItem.tplSpecQuestion.tplSpecMaster.itemOriginCode.parameterCode eq ParameterConst.LOCAL_GOODS}"></h:outputText>
					<h:outputText
						value="#{lbl['lbl.sc.qt.sample.type.of.goods.import']}"
						rendered="#{sampleItem.scRequestItem.tplSpecQuestion.tplSpecMaster.itemOriginCode.parameterCode eq ParameterConst.IMPORTED_GOODS}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sp.extensionno']}" style="width:15%">
					#{evaluationBackingBean.managedBean.scQtSampleLbl.lableNo} - #{sampleItem.subLableNo}
				<ui:remove> #11104 - end </ui:remove>
				</p:column>



				<p:column style="width:20%">
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory"></h:outputText>
						<h:outputText value="#{lbl['lbl.sc.submission.status']}"></h:outputText>
					</f:facet>
					<p:selectOneMenu id="sampleSubmissionId"
						disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
						label="#{lbl['lbl.sc.submission.status']}"
						value="#{sampleItem. submissionStatus.parameterId}">
						<ui:remove> #11104 - start </ui:remove>
						<f:selectItems
							value="#{evaluationBackingBean.getSampleSubmissionDropDownValues(ParameterTypeConst.sampleSubmissionStatus)}"></f:selectItems>
						<ui:remove> #11104 - end </ui:remove>

						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{evaluationBackingBean.changeSampleStatus(sampleItem,evaluationBackingBean.managedBean.complianceSampleItemListDM)}"></p:ajax>
					</p:selectOneMenu>

				</p:column>

				<ui:remove> #11104 - start </ui:remove>
				<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:20%">
				<ui:remove> #11104 - end </ui:remove>
					<p:inputTextarea rows="2" cols="40" maxlength="100" onkeyup="limitTextArea(this,100);" onkeydown="limitTextArea(this,100);"
						onmouseout="limitTextArea(this,100);"
						disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
						value="#{sampleItem.remark}">
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:inputTextarea>
				</p:column>
			</p:dataTable>

			<p:spacer height="20"></p:spacer>
			<h:panelGroup id="itemListSpecification">
				<ui:fragment
					rendered="#{evaluationBackingBean.managedBean.itemName ne null}">
			#{evaluationBackingBean.managedBean.itemName}>#{lbl['lbl.sc.eva.item.specification']}
			</ui:fragment>
				<p:dataTable var="itemspec" id="itemSpecId" editable="true"
				    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rows="10"
					value="#{evaluationBackingBean.managedBean.sampleItemSpecifications}"
					rowIndexVar="index" style="width:50%" rowKey="#{itemspec}">
					<ac:paginator for="itemSpecId" />


					<p:column headerText="#{lbl['lbl.sc.specification']}"
						style="width:50%;white-space: normal;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.specification']}" />
							<ac:iconTooltip id="sampleSpec#{index}"
								value="#{lbl['lbl.sc.eva.sample.proposal.item.specification.tooltip']}" />
						</f:facet>
						<h:outputText value="#{itemspec.clSpecDetail}"></h:outputText>
					</p:column>

				</p:dataTable>
			</h:panelGroup>
		</p:panel>

	</ui:define>
</ui:composition>
