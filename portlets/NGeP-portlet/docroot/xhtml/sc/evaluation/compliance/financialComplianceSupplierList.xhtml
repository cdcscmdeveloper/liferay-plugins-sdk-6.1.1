<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<!-- #28786 - start - and template="/WEB-INF/facelets/templates/basic_template.xhtml" up there-->
	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>
		
			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
			<p:messages id="financialCompliance" showDetail="true"
				autoUpdate="true" closable="true" severity="error,info"
				showSummary="false" />
			<table width="100%" class="BtnSpacing">
				<tr>
					<td align="right"><p:commandButton
							value="#{lbl['lbl.btn.back']}" style="float:left;"
							immediate="true"
							action="#{evaluationBackingBean.complianceFinancialBackaction}" /> <p:commandButton
							value="#{lbl['lbl.btn.save']}"
							disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired}"
							style="float:right;" update="@all" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.saveComplianceUploadCheckList}" />
					</td>
				</tr>
			</table>
			<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />
			
			<p:panel id="financialComplianceSupplierHeaderIds" header="#{lbl['lbl.sc.eva.financial.proposal.compliance']}"
				toggleable="true">
				<ui:include src="/xhtml/sc/evaluation/complianceChecklistHeader.xhtml" />
			</p:panel>

	<p:panel id="financialComplianceSuppliersComplianceStageIds" header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.compliance.stage.document.instruction']}"
			escape="false" />

		<p:dataTable var="complianceTechnicalSupplier" rows="10" lazy="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.qtProposalChecklist}"
			id="complianceTechnicalSupplier" editable="true" rowIndexVar="index"
			style="width:100%" rowKey="#{complianceTechnicalSupplier}">
			<ui:remove><!-- 6906 - start --></ui:remove>
			<ui:param name="isRejected" value="#{not empty complianceTechnicalSupplier.scQtProposal.supplierRejectionRemark}"/>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;"> 
				<table style="table-layout: fixed; margin:auto !important; max-width:90px !important">
					<tr>
						<td style="text-align:center; border: 0 !important"/>
						<td style="text-align:center; border: 0 !important">
							<h:outputText value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align:center; border: 0 !important">
							<ac:iconRejectRemarkBox show="#{isRejected}" id="remarkComplianceSuppListId"
							remark="#{complianceTechnicalSupplier.scQtProposal.supplierRejectionRemark.remark}"
							supplierCode="#{complianceTechnicalSupplier.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
			</p:column>
			<ui:remove><!-- 6906 - end --></ui:remove>
			
			<p:column headerText="#{lbl['lbl.sc.registration.type']}"
				style="width:20%; text-align:center;">
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.A']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'A'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.B']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'B'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.C']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'C'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.D']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'D'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.E']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'E'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.F']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'F'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.G']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'G'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.H']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'H'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.I']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'I'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.J']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'J'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.K']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'K'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.L']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'L'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.M']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'M'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.O']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'O'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.P']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'P'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.R']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'R'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.Q']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'Q'}"/>
				
				<h:outputText value="#{lbl['lbl.sc.eva.compliance.stage.business.type.T']}" 
					rendered="#{complianceTechnicalSupplier.scQtProposal.scQtSupplier.smSupplier.businessType eq 'T'}"/>

			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.scQtProposal.submitted eq 'true'}">
					<h:commandLink immediate="true" rendered="#{complianceTechnicalSupplier.scQtProposalChecklistAttachment ne null}"
						action="#{evaluationBackingBean.downloadEncryptedFile(complianceTechnicalSupplier.scQtProposalChecklistAttachment)}" >
						<h:graphicImage value="/css/images/design/icon_txt.png" />
					</h:commandLink>
				</ui:fragment>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.submission.status']}"
				style="width:20%">
				<h:outputText
					value="#{complianceTechnicalSupplier.scQtProposal.submitted ? lbl['lbl.txt.submitted']:lbl['lbl.txt.not.submitted']}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.compliance.status']}"
				style="width:15%">
				<!-- 26339 and 25138 Removed from disabled attribute  'or evaluationBackingBean.managedBean.FP_Compliance' and 'or evaluationBackingBean.managedBean.readOnly'-->
				<ui:remove><!-- 6906 - add disabled isRejected, add style --></ui:remove>
				<p:selectOneMenu style="max-width: 225px !important; width:100% !important" disabled="#{evaluationBackingBean.isComplianceStatusDisabled(complianceTechnicalSupplier) or isRejected or (complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod ne null and (complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected
				or complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified))}"
					value="#{complianceTechnicalSupplier.compliance}"><ui:remove>#21692</ui:remove>
                  <!-- 26339 End-->
					<f:selectItems
						value="#{evaluationBackingBean.statusDropdownCodeValues(ParameterTypeConst.complianceStatus,complianceTechnicalSupplier.scQtProposalChecklistAttachment)}"></f:selectItems>
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}"
				style="width:35%;white-space: normal;">
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.scQtProposal.submitted eq 'true'
					and !(complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod ne null
					and (complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected or complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified))}"><ui:remove>#21692</ui:remove>
					<!-- 26339  Venkat Removed from disabled attribute  'or evaluationBackingBean.managedBean.FP_Compliance'-->
					<p:inputTextarea rows="2" cols="40" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);"
						onmouseout="limitTextArea(this,200);"
						disabled="#{evaluationBackingBean.managedBean.statusOnly or evaluationBackingBean.managedBean.complianceReEvaluateRequired }"
						id="complianceRemarksid"
						value="#{complianceTechnicalSupplier.remark}">
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:inputTextarea>
					<p:message id="complianceRemarksidEvaluation"
						for="complianceRemarksid" display="icon"></p:message>


				</ui:fragment>
				<ui:remove>#21692 - start</ui:remove>
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.scQtProposal.submitted eq 'true'
					and (complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected
					or complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}">
					<p:inputTextarea rows="2" cols="40" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);"
						onmouseout="limitTextArea(this,200);"
						disabled="true"
						value="#{lbl['lbl.sc.qt.proposal.evaluation.remark']}">
					</p:inputTextarea>


				</ui:fragment>
				<ui:remove>#21692 - end</ui:remove>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<h:panelGroup>
				<ui:include src="#{evaluationBackingBean.managedBean.proposalPage}" />
			</h:panelGroup>
	
		</h:panelGroup>
	</ui:define>
	<!-- #28786 - end -->
</ui:composition>
