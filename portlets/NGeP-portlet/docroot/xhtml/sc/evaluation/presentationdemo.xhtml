<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>







	<p:spacer height="25"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.eva.comp.sup.list']}" toggleable="true">

		<p:dataTable var="demoSupplier" id="demoSupplierId" editable="true"
			rows="10"
			value="#{evaluationBackingBean.managedBean.presentationDemoSupplierList}"
			rowIndexVar="index" rowKey="#{demoSupplier}">
			<ac:paginator for="demoSupplierId" />


			<p:column headerText="#{lbl['lbl.sc.eva.comp.sup.code']}"
				style="width:30%">

				<h:outputText value="#{demoSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
				style="width:15%">
				<p:commandLink onclick="uploadDlg.show();return false;" update="demoSupplierId">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{demoSupplier}"
						target="#{evaluationBackingBean.managedBean.qtProposalChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{demoSupplier.scQtProposalChecklistAttachment.fileName}"></h:outputText>

			</p:column>



			<p:column headerText="#{lbl['lbl.sc.eva.user.scores']}"
				style="width:15%">
				<p:inputText value="#{demoSupplier.totalScore}"></p:inputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}"
				style="width:40%">
				<p:inputTextarea rows="2" cols="40" value="#{demoSupplier.remark}"></p:inputTextarea>
			</p:column>
		</p:dataTable>
	</p:panel>



	<p:panel header="#{lbl['lbl.sc.eva.report.eva.report']}">
		<h:panelGrid columns="2">

			<p:outputLabel value="#{lbl['lbl.sc.eva.report.attachment']}"></p:outputLabel>

			<h:panelGroup>


				<p:commandButton onclick="presntDemoDlg.show();return false;"
					ajax="false" process="@this" partialSubmit="true"
					icon="iconAttachment" update="presentDemoFile"
					value="Attach file(s)"
					actionListener="#{evaluationBackingBean.reportUpload}" />

			</h:panelGroup>


			<h:panelGrid columns="3" id="presentDemoRemove">

				<p:spacer width="40"></p:spacer>
				<p:outputLabel id="presefile"></p:outputLabel>
				<p:commandLink process="@this,presentDemoRemove"
					update="presentDemoRemove" partialSubmit="true" style="width:40%;">
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>

			</h:panelGrid>
		</h:panelGrid>

		<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
			dynamic="true" hideEffect="explode" resizable="false" width="700px"
			height="200" styleClass="pop_up_top"
			header="#{lbl['lbl.bpm.choose.file']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;"
				fileUploadListener="#{evaluationBackingBean.preSentationDemoFileUpload}"
				mode="advanced" id="upload"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update="demoSupplierId" oncomplete="uploadDlg.hide()">
			</p:fileUpload>
		</p:dialog>

	</p:panel>

</ui:composition>
