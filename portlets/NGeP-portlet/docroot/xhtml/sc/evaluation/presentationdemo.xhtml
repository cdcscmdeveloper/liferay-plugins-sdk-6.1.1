<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>







	<p:spacer height="25"></p:spacer>

	<p:panel header="#{lbl['lbl.sc.eva.comp.sup.list']}" toggleable="true">

		<p:dataTable var="demoSupplier" id="demoSupplierId" editable="true"
			rows="10"
			value="#{evaluationBackingBean.managedBean.presentationDemoSupplierList}"
			rowIndexVar="index" rowKey="#{demoSupplier}">
			<ac:paginator for="demoSupplierId" />


			<p:column headerText="#{lbl['lbl.sc.eva.comp.sup.code']}"
				style="width:30%">

				<h:outputText value="#{demoSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.comp.document']}"
				style="width:15%">
				<p:commandLink onclick="uploadDlg.show();return false;"
					update="demoSupplierId">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />


					<f:setPropertyActionListener value="#{demoSupplier}"
						target="#{evaluationBackingBean.managedBean.qtProposalChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{demoSupplier.scQtProposalChecklistAttachment.fileName}"></h:outputText>

			</p:column>



			<p:column headerText="#{lbl['lbl.sc.eva.user.scores']}"
				style="width:15%">
				<p:inputText value="#{demoSupplier.totalScore}"></p:inputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.comp.remark']}"
				style="width:40%">
				<p:inputTextarea rows="2" cols="40" value="#{demoSupplier.remark}"></p:inputTextarea>
			</p:column>
		</p:dataTable>
	</p:panel>





	<p:panel header="#{lbl['lbl.sc.eva.present.demo.report']}"
		toggleable="true" id="demoremarksupdtls">
		<table id="demoremarksupDtlslist">
			<tr>


				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.eva.report.attachment']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="demoAttachDlg.show();"
									value="#{lbl['lbl.txt.attach.files']}" icon="iconAttachment"
									partialSubmit="true" process="@this"
									update="@([id$=demoremarksupdtls])">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attachedIdsDemo"
									value="#{evaluationBackingBean.managedBean.scQtChecklist.scQtCheckListAttachment}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage library="ep/images/design"
													name="#{evaluationBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{evaluationBackingBean.downloadFile(attachFile)}" />
												<p:commandLink
													action="#{evaluationBackingBean.deleteDemoUploadFile}"
													immediate="true" update="attachedIdsDemo">
													<h:graphicImage library="ep/images/design" name="trash.png"
														styleClass="tasklist_title1" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>



</ui:composition>
