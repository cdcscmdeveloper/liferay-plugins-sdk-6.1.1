<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div>
		<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
			action="#{evaluationBackingBean.evaluationBackaction}" />

		<p:commandButton value="#{lbl['lbl.btn.save']}" style="float:right;"
			update="@all" action="#{evaluationBackingBean.saveProposalScoreDtls}" />
	</div>
	<p:spacer height="25" />
	<br />
	<br />
	<ui:include src="evaluationHeader.xhtml" />
	<br />
	<p:panel>
		<table>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.supplier.code']}"></h:outputLabel></td>
				<td><p:inputText disabled="true"
						value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
				<td style="width: 100px;"><h:outputLabel
						value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel></td>
				<td><p:inputTextarea rows="2" cols="100" disabled="true"
						style="width:90%"
						value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"></p:inputTextarea></td>
			</tr>
		</table>
	</p:panel>



	<p:panel header="#{lbl['lbl.sc.compliance.list']}" toggleable="true">
		<p:dataTable var="techComplianceList" id="sampleComplianceListId"
			rows="10"
			value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
			rowIndexVar="index" style="width:100%" rowKey="#{techComplianceList}">
			<ac:paginator for="sampleComplianceListId" />


			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}" style="width:90%">
				<h:outputText value="#{techComplianceList.scQtCheckList.title}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
				<p:commandLink ajax="false"
					actionListener="#{evaluationBackingBean.downloadEncryptedFile(techComplianceList.scQtProposalChecklistAttachment)}"
					process="@this" partialSubmit="true">
					<h:graphicImage value="/css/images/design/icon_txt.png" />

				</p:commandLink>
			</p:column>

		</p:dataTable>



	</p:panel>

</ui:composition>
