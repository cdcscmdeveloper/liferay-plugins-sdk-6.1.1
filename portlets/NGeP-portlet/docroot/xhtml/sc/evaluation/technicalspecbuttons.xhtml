<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<h:panelGroup>
		<h:panelGroup>

			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					immediate="true"
					action="#{evaluationBackingBean.technicalSpecBackaction}" />

				<p:commandButton value="#{lbl['lbl.btn.save']}"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					style="float:right;" update="@all"
					action="#{evaluationBackingBean.saveTempleateSpecDtls}" />
			</div>
		</h:panelGroup>
		<p:spacer height="25" />
		<br />
		<br />
		<ui:include src="evaluationHeader.xhtml" />
		<br />
		<h:panelGroup>
			<table>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.supplier.code']}"></h:outputLabel></td>
					<td><p:inputText disabled="true"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}"></p:inputText></td>
					<td style="width: 100px;"><h:outputLabel
							value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel></td>
					<td><p:inputTextarea rows="2" cols="100" disabled="true"
							style="width:90%"
							value="#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}"></p:inputTextarea></td>
				</tr>
			</table>
		</h:panelGroup>
	</h:panelGroup>

</ui:composition>
