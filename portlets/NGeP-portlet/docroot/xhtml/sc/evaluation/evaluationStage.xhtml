<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:tabView dynamic="true" orientation="left" id="complianceId">


		<p:tab title="#{lbl['lbl.sc.eva.compliance.stg.tech']}">
			<ui:include src="technicalEvaluation.xhtml"></ui:include>

		</p:tab>


		<p:tab title="#{lbl['lbl.sc.eva.compliance.stg.fin']}">
		<ui:include src="financialEvaluation.xhtml"></ui:include>

		</p:tab>

		<p:tab title="#{lbl['lbl.sc.eva.compliance.stg.summary']}">
		<ui:include src="FinancialEvaluationCommitteeSummary.xhtml"></ui:include>

		</p:tab>





	</p:tabView>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('2','1')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">
					
				
						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{evaluationBackingBean.setTabValue('2','4')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-next" iconPos="right" update=":form" />
					
				</div></td>
		</tr>
	</table>

</ui:composition>
