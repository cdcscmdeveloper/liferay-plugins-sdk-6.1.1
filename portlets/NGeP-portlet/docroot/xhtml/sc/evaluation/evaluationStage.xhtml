<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" style="vertical-align: baseline;"><p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex}"
					styleClass="sidemenu" style="display : table-caption;">
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' or evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
						<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.tech']}"
							action="#{evaluationBackingBean.retriveTechnicalEvaluationStage}"
							update="@form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' or evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
						<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.fin']}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStage}"
							update="@form" />
					</c:if>
					<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.summary']}"
						action="#{evaluationBackingBean.retriveSummaryEvaluationStage}"
						update="@form" />


				</p:tabMenu></td>
			<td width="80%;"><ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' or evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'}">

						<ui:include src="technicalEvaluation.xhtml"></ui:include>

					</c:if>
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC'}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}">

						<ui:include src="financialEvaluation.xhtml"></ui:include>
					</c:if>
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'}">

						<ui:include src="financialEvaluation.xhtml"></ui:include>
					</c:if>
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC'}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2'}">

						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType ne 'TEC'}">
							<ui:include src="FinancialEvaluationCommitteeSummary.xhtml" />

						</ui:fragment>
					</c:if>
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}">
						<ui:fragment
							rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
							<ui:include src="TECSummary.xhtml" />
						</ui:fragment>
					</c:if>


					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
						<c:if
							test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}">

							<ui:fragment
								rendered="#{evaluationBackingBean.managedBean.committeeType ne 'TEC'}">
								<ui:include src="FinancialEvaluationCommitteeSummary.xhtml" />

							</ui:fragment>
						</c:if>
					</ui:fragment>
				</ui:fragment></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('2','1')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td>
				<div align="right" style="width: 99%">
					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true'}">



						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{evaluationBackingBean.setTabValue('2','3')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-next" iconPos="right" update=":form" />


					</ui:fragment>
					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired eq 'flase'}">



						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{evaluationBackingBean.setTabValue('2','4')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-next" iconPos="right" update=":form" />


					</ui:fragment>

					<ui:fragment
						rendered="#{evaluationBackingBean.managedBean.committeeType ne 'TEC' }">



						<p:commandButton value="#{lbl['lbl.sm.next']}"
							actionListener="#{evaluationBackingBean.setTabValue('2','4')}"
							action="#{evaluationBackingBean.updateSmAppl}"
							icon="ui-icon-next" iconPos="right" update=":form" />


					</ui:fragment>
				</div>
			</td>
		</tr>
	</table>

</ui:composition>
