<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" valign="top"><p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.presentationDemoActiveIndex}"
					styleClass="sidemenu">

					<p:menuitem value="#{lbl['lbl.sc.present.demo']}"
						action="#{evaluationBackingBean.retrivePresentationDemo}"
						update="@form" />

					<p:menuitem value="#{lbl['lbl.sc.summary']}"
						action="#{evaluationBackingBean.retrivePresentationDemoSummary}"
						update="@form" />


				</p:tabMenu></td>
			<td width="80%;" valign="top"><c:if
					test="#{evaluationBackingBean.managedBean.presentationDemoActiveIndex eq '0'}">

					<ui:include src="presentationdemo.xhtml"></ui:include>

				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.presentationDemoActiveIndex eq '1'}">

					<ui:include src="presentationDemoPackageSummary.xhtml"></ui:include><!-- #28784 -->
				</c:if></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.prev']}"
					style="float:left;" styleClass="BtnSpacing"
					actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('3','2')}"
					action="#{evaluationBackingBean.updateSmAppl}" update=":form" /></td>
			<td><p:commandButton value="#{lbl['lbl.btn.next']}"
					style="float:right;" styleClass="BtnSpacing"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('3','4')}"
					action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
					update=":form" /></td>
		</tr>
	</table>

</ui:composition>
