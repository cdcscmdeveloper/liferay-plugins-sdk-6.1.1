<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		
			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
			<p:messages id="financialCompliance" showDetail="true"
				autoUpdate="true" closable="true" severity="error,info"
				showSummary="false" />
			<table width="100%" class="BtnSpacing">
				<tr>
					<td align="right"><p:commandButton
							value="#{lbl['lbl.btn.back']}" style="float:left;"
							immediate="true"
							action="#{evaluationBackingBean.presentationDemoBackaction}" /> <p:commandButton
							value="#{lbl['lbl.btn.save']}"
							style="float:right;" update="@all" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.saveDemoAllItemScoring}" 
							rendered="#{!evaluationBackingBean.managedBean.readOnly}"/>
					</td>
				</tr>
			</table>
			
			<p:panel id="presentationDemoSupplierHeaderIds" header="#{lbl['lbl.sc.eva.technical.presentation.demo.presentation.demo.item']}"
				toggleable="true">
				<p:dataTable var="demoSupplier" id="demoSupplierId" editable="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" lazy="true"
			value="#{evaluationBackingBean.managedBean.qtProposalChecklist}"
			rowIndexVar="index" rowKey="#{demoSupplier}">
			<ui:remove> <!-- 6906 - start --> </ui:remove>
			<ui:param name="isRejected" value="#{not empty demoSupplier.scQtProposal.supplierRejectionRemark}" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
				<table
					style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
					<tr>
						<td style="text-align: center; border: 0 !important" />
						<td style="text-align: center; border: 0 !important"><h:outputText
								value="#{demoSupplier.scQtProposal.supplierNo}" /></td>
						<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
								show="#{isRejected}" id="remarkId"
								remark="#{demoSupplier.scQtProposal.supplierRejectionRemark.remark}"
								supplierCode="#{demoSupplier.scQtProposal.supplierNo}" /></td>
					</tr>
				</table>
			</p:column> 
			<ui:remove> <!-- 6906 - end --> </ui:remove>
			<p:column headerText="#{lbl['lbl.sc.score']}"
				style="width:15%; text-align:center;">
				<p:inputText value="#{demoSupplier.totalUserScore}"
					style="text-align:right" maxlength="18" disabled="#{evaluationBackingBean.managedBean.readOnly or isRejected}"><ui:remove> <!-- 6906 - end --> </ui:remove>
				</p:inputText>
				<p:spacer width="5"></p:spacer>
				<h:outputText
					value="/#{evaluationBackingBean.managedBean.userScores}" />
			</p:column>
		</p:dataTable>
		
		<p:spacer height="20px" />
		<table>

			<tr>
				<td style="width: 230px;"><h:outputLabel
						value="#{lbl['lbl.sc.total.score']}" /></td>
				<td>
				<p:inputText value="#{evaluationBackingBean.managedBean.qtProposalChecklist.totalUserScore}/#{evaluationBackingBean.managedBean.userScores}"
					style="text-align:right" maxlength="18"
					disabled="true">
				</p:inputText></td>
			</tr>

		</table>
		
			</p:panel>
	
	</ui:define>
</ui:composition>
