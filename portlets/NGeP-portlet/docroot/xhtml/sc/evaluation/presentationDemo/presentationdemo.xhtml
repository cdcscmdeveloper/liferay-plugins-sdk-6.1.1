<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>

	<p:panel
		id="evaluationPresentationDemoTechnicalQualifiedSupplierListDatatableIds"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">

		<p:dataTable var="demoSupplier" id="demoSupplierId" editable="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" lazy="true"
			value="#{evaluationBackingBean.managedBean.presentationDemoSupplierListDM}"
			rowIndexVar="index" rowKey="#{demoSupplier}">
			<ac:paginator for="demoSupplierId" />

			<p:ajax event="page"
				listener="#{evaluationBackingBean.savePresentationDemoDtls}"
				update="demoSupplierId" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:15%; text-align:center;">

				<h:outputText value="#{demoSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>


			<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
				style="width:25%">
				<p:inputText value="#{demoSupplier.totalUserScore}"
					style="text-align:right" maxlength="18"
					disabled="#{evaluationBackingBean.managedBean.readOnly}">
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
						maxIntegerDigits="14" integerOnly="true" />
					<f:attribute name="min" value="0" />
					<f:attribute name="max"
						value="#{evaluationBackingBean.managedBean.userScores}" />
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:inputText>
				<p:spacer width="5"></p:spacer>
				<h:outputText
					value="/#{evaluationBackingBean.managedBean.userScores}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:30%">
				<p:inputTextarea rows="2" cols="40" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);" value="#{demoSupplier.remark}">
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:inputTextarea>
			</p:column>
		</p:dataTable>
	</p:panel>





	<p:panel header="#{lbl['lbl.sc.eva.present.demo.report']}"
		toggleable="true" id="demoremarksupdtls">
		<table id="demoremarksupDtlslist">
			<tr>


				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.txt.attachment']}" /></td>
				<td class="TableFieldRight">
				<ac:scSingleFileUploadButton
						id="attachedIdsDemo"
						popupWidgetVar="demoChecklistAttachDlg"
						attachment="#{evaluationBackingBean.managedBean.scQtChecklist.scQtCheckListAttachment}"
						deleteFileUploadListener="evaluationBackingBean.deleteDemoUploadFile"
						readonly="#{evaluationBackingBean.managedBean.readOnly}" />
			
				</td>
			</tr>
		</table>
	</p:panel>



</ui:composition>
