<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>
	<!-- #28784 - start -->
	<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.technical.presentation.demo.presentation.demo.instruction']}" escape="false" />
	<p:spacer height="15px" />
	
	<p:panel
		id="evaluationPresentationDemoTechnicalQualifiedSupplierListDatatableIds"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">

		<p:dataTable var="demoSupplier" id="demoSupplierId" editable="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" lazy="true"
			value="#{evaluationBackingBean.managedBean.presentationDemoSupplierListDM}"
			rowIndexVar="index" rowKey="#{demoSupplier}">
			<ac:paginator for="demoSupplierId" />

			<p:ajax event="page"
				listener="#{evaluationBackingBean.savePresentationDemoDtls}"
				update="demoSupplierId" />
			<ui:remove> <!-- 6906 - start --> </ui:remove>
			<ui:param name="isRejected" value="#{not empty demoSupplier.scQtProposal.supplierRejectionRemark}" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
				<table
					style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
					<tr>
						<td style="text-align: center; border: 0 !important" />
						<td style="text-align: center; border: 0 !important"><h:outputText
								value="#{demoSupplier.scQtProposal.supplierNo}" /></td>
						<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
								show="#{isRejected}" id="remarkId"
								remark="#{demoSupplier.scQtProposal.supplierRejectionRemark.remark}"
								supplierCode="#{demoSupplier.scQtProposal.supplierNo}" /></td>
					</tr>
				</table>
				<h:outputText value="#{evaluationBackingBean.retrieveDemoSupplierNo(demoSupplier.scQtProposal.supplierNo)}"></h:outputText>
			</p:column> 
			<ui:remove> <!-- 6906 - end --> </ui:remove>
			<p:column headerText="#{lbl['lbl.sc.total.score']}"
				style="width:30%; text-align:center;">
				<p:inputText value="#{demoSupplier.totalUserScore}"
					style="text-align:right" maxlength="18"
					disabled="#{true or isRejected}"><ui:remove><!-- 6906 --></ui:remove>
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
						maxIntegerDigits="14" integerOnly="true" />
					<f:attribute name="min" value="0" />
					<f:attribute name="max"
						value="#{evaluationBackingBean.managedBean.userScores}" />
				</p:inputText>
				<p:spacer width="5"></p:spacer>
				<h:outputText
					value="/#{evaluationBackingBean.managedBean.userScores}" />
			</p:column>

			<ui:remove>
			<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:25%; text-align:center;">
				<p:inputTextarea rows="2" cols="40" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);" onmouseout="limitTextArea(this,200);" 
				value="#{demoSupplier.remark}" disabled="#{evaluationBackingBean.managedBean.readOnly}">
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:inputTextarea>
			</p:column>
			</ui:remove>

			<p:column
				headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.file.attachment']}"
				style="width:35%; text-align:center;">
				<h:panelGroup id="demoSupplierAttach">
					<ac:scSingleFileUploadButton id="attachedIdsDemoDtl"
						popupWidgetVar="demoSupplierAttachDlg"
						attachment="#{evaluationBackingBean.retrieveDemoSupplierAttachment(demoSupplier.scQtProposal.supplierNo)}"
						deleteFileUploadListener="evaluationBackingBean.deleteProposalDemoUploadFile"
						readonly="#{evaluationBackingBean.managedBean.readOnly}">
						<f:setPropertyActionListener for="actionEvent"
								value="#{evaluationBackingBean.retrieveDemoSupplier(demoSupplier.scQtProposal.supplierNo)}"
								target="#{evaluationBackingBean.managedBean.scQtDemoSupplier}" />
						</ac:scSingleFileUploadButton>
				</h:panelGroup>
			</p:column>

			<p:column headerText="#{lbl['lbl.txt.action']}" style="width:25%; text-align:center;">
				<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
					rendered="#{demoSupplier.totalUserScore == null and !evaluationBackingBean.managedBean.readOnly}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.presentationDemoScoring(demoSupplier.scQtProposal.supplierNo, demoSupplier)}" />
					
						<p:commandButton value="#{lbl['lbl.btn.view']}"
					rendered="#{demoSupplier.totalUserScore != null or evaluationBackingBean.managedBean.readOnly}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.presentationDemoScoring(demoSupplier.scQtProposal.supplierNo, demoSupplier)}" />
			</p:column>
		</p:dataTable>
	</p:panel>





	<p:panel header="#{lbl['lbl.sc.eva.present.demo.report']}"
		toggleable="true" id="demoremarksupdtls">
		<table id="demoremarksupDtlslist">
			<tr>


				<td class="TableFieldLeft">
				<h:outputText value="* " styleClass="mandatory" /><p:outputLabel
						value="#{lbl['lbl.sc.eva.technical.presentation.demo.attached.file']}" /></td>
				<td class="TableFieldRight"><!-- #28784 - end -->
				<ac:scSingleFileUploadButton
						id="attachedIdsDemo"
						popupWidgetVar="demoChecklistAttachDlg"
						attachment="#{evaluationBackingBean.managedBean.scQtChecklist.scQtCheckListAttachment}"
						deleteFileUploadListener="evaluationBackingBean.deleteDemoUploadFile"
						readonly="#{evaluationBackingBean.managedBean.readOnly}" />
			
				</td>
			</tr>
		</table>
	</p:panel>



</ui:composition>
