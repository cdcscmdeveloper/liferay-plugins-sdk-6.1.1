<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:define name="resourceSection">
	</ui:define>

	<p:panel
		id="evaluationPresentationDemoTechnicalQualifiedSupplierListDatatableIds"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">

		<p:dataTable var="demoSupplier" id="demoSupplierId" editable="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" lazy="true"
			value="#{evaluationBackingBean.managedBean.presentationDemoSupplierListDM}"
			rowIndexVar="index" rowKey="#{demoSupplier}">
			<ac:paginator for="demoSupplierId" />

			<p:ajax event="page"
				listener="#{evaluationBackingBean.savePresentationDemoDtls}"
				update="demoSupplierId" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:30%">

				<h:outputText value="#{demoSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document']}"
				style="width:15%;text-align: center;">

				<p:commandLink oncomplete="uploadDlg.show();return false;"
					disabled="#{evaluationBackingBean.managedBean.readOnly}"
					update="demoSupplierId">
					<h:graphicImage value="/css/images/design/upload.png" />
					<f:setPropertyActionListener value="#{demoSupplier}"
						target="#{evaluationBackingBean.managedBean.qtProposalChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{demoSupplier.scQtProposalChecklistAttachment.fileName}"></h:outputText>

			</p:column>



			<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
				style="width:15%">
				<p:inputText value="#{demoSupplier.totalUserScore}"
					style="text-align:right" maxlength="18"
					disabled="#{evaluationBackingBean.managedBean.readOnly}">
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
						maxIntegerDigits="14" integerOnly="true" />
					<f:attribute name="min" value="0" />
					<f:attribute name="max"
						value="#{evaluationBackingBean.managedBean.userScores}" />
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:inputText>
				<p:spacer width="5"></p:spacer>
				<h:outputText
					value="/#{evaluationBackingBean.managedBean.userScores}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:40%">
				<p:inputTextarea rows="2" cols="40" value="#{demoSupplier.remark}">
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:inputTextarea>
			</p:column>
		</p:dataTable>
	</p:panel>





	<p:panel header="#{lbl['lbl.sc.eva.present.demo.report']}"
		toggleable="true" id="demoremarksupdtls">
		<table id="demoremarksupDtlslist">
			<tr>


				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.txt.attachment']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td colspan="2"><p:commandButton
									disabled="#{evaluationBackingBean.managedBean.readOnly}"
									oncomplete="demoAttachDlg.show();"
									value="#{lbl['lbl.txt.attach.files']}" partialSubmit="true"
									process="@this" update="@([id$=demoremarksupdtls])">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attachedIdsDemo" var="attachFile"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									value="#{evaluationBackingBean.managedBean.scQtChecklist.scQtCheckListAttachment}"
									rowIndexVar="attachFileIndex" columns="1" style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage
													name="/css/images/design/#{evaluationBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{evaluationBackingBean.downloadFile(attachFile)}" />
												<p:commandLink
													disabled="#{evaluationBackingBean.managedBean.readOnly}"
													action="#{evaluationBackingBean.deleteDemoUploadFile}"
													immediate="true" update="@form">
													<h:graphicImage styleClass="tasklist_title1"
														value="/css/images/design/trash.png" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>



</ui:composition>
