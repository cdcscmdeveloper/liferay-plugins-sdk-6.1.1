	xmlns:h="http://java.sun.com/jsf/html"

	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"

	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
       <h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.summary.item.instruction']}"
			escape="false" />
		<p:dataTable var="summaryItem" id="evaluationTechnicalSummaryItem"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			editable="true" value="#{itemList}" rows="10"
			selection="#{evaluationBackingBean.managedBean.singlesummaryItemList}"
			selectionMode="single" rowIndexVar="index" rowKey="#{summaryItem}">

			<ac:paginator for="evaluationTechnicalSummaryItem" />

			<p:ajax event="rowSelect" process="@this" partialSubmit="true"
				update="@form"
				listener="#{evaluationBackingBean.technicalSummaryItemSelect}"></p:ajax>
			<p:column headerText="#{lbl['lbl.sc.item']}" style="width:35%;white-space: normal;">

				<h:outputText value="#{summaryItem.tplSpecQuestion.clItem}"></h:outputText>

			</p:column>
		</p:dataTable>
	</p:panel>
	
	
	
	<h:panelGroup id="TechnicalOrEvaluationCommitteesummaryItemQualified">

			<f:facet name="header">
			<h:outputText

		</f:facet>

			<p:dataTable var="summaryqualSup"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"

				value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"
				lazy="true" editable="true" rowIndexVar="index"
				rowKey="#{summaryqualSup}">


				<ac:paginator for="TechnicalevaluationCommitteeSummaryItemQualifiedSuppliers"></ac:paginator>

				<p:columnGroup type="header">
					<p:row>
						<p:column rowspan="3" headerText="#{lbl['lbl.sc.ranking']}"
							style="text-align:right" width="10%">
						</p:column>

						<p:column rowspan="3" headerText="#{lbl['lbl.sc.supplier.code']}"
							style="text-align:center;" width="20%">
						</p:column>

						<p:column rowspan="2" colspan="2" width="22%"
							headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.header.technical']}"
							style="text-align:center">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.eva.technical.presentation.demo.score.header.technical']}" />
								<ac:iconTooltip
									value="#{lbl['lbl.demo.item.ts.score.tooltips']} #{evaluationBackingBean.managedBean.maxItemTsPercentage}" />
							</f:facet>
						</p:column>

						<p:column rowspan="1" colspan="3"
							style="text-align:center">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.eva.technical.presentation.demo.score.header.others']}" />
								<br></br>
								<h:outputText value="#{lbl['lbl.sc.eva.technical.presentation.demo.score.header.others2']}" />
								<ac:iconTooltip
									value="#{lbl['lbl.demo.item.all.other.score.tooltips']} #{evaluationBackingBean.managedBean.maxItemAllOtherElementsPercentage}" />
							</f:facet>
						</p:column>


						<p:column rowspan="3" style="text-align:right">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.demo.overall.score']}" />
								<ac:iconTooltip
									value="#{lbl['lbl.demo.item.overall.score.tooltips']}" />
							</f:facet>
						</p:column>
						<p:column rowspan="3"
							style="white-space: normal;text-align:center;"
							rendered="#{!evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.rating']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.tec.rating.tooltip']}" />
							</f:facet>
						</p:column>
					</p:row>
					<p:row>

							headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.other.elements']} (#{evaluationBackingBean.otherChecklistOverallScore()})"
							style="text-align:center">
						</p:column>
						<p:column rowspan="2"
							headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.other.demo.percentage']} (#{evaluationBackingBean.managedBean.maxItemAllOtherElementsPercentage}%)"
							style="text-align:center">
						</p:column>
					</p:row>
					<p:row>
						<p:column
							headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.technical']} (#{evaluationBackingBean.maxTsItemScore()})"

						<p:column

					</p:row>
				</p:columnGroup>

				<p:column headerText="#{lbl['lbl.sc.ranking']}"

				<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="text-align:center;">

							<td style="text-align:center; border: 0 !important"/>

								<h:outputText value="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierNo}" />
							</td>
							<td style="text-align:center; border: 0 !important">
								<ac:iconRejectRemarkBox show="#{isRejected}" id="summaryRemarkId"
								remark="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierRejectionRemark.remark}"
								supplierCode="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierNo}" />
							</td>
						</tr>
					</table>
				</p:column> 
				<ui:remove><!-- 6906 - end note 212 --></ui:remove>
				
				<p:column headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.technical']}"
				style="text-align:right">
				<h:outputText value="#{evaluationBackingBean.retrieveTotalTechnicalItemScore(summaryqualSup)}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.technical.percentage']}"
				style="text-align:right">
				<h:outputText value="#{evaluationBackingBean.managedBean.itemTsPercentage}"></h:outputText>
				</p:column>
			
				<p:column headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.other']}"

					<h:outputText value="#{evaluationBackingBean.managedBean.otherchecklistScore}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.demo']}"
					style="text-align:right">
					<h:outputText value="#{evaluationBackingBean.managedBean.demoScore}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.eva.technical.presentation.demo.score.total.other.demo.percentage']}"
					style="text-align:right">
					<h:outputText value="#{evaluationBackingBean.managedBean.itemAllOtherElementsPercentage}"></h:outputText>
				</p:column>


				<p:column style="width:25%;text-align:right">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.demo.overall.score']}" />
						<ac:iconTooltip value="#{lbl['lbl.demo.overall.score.tooltips']}" />
					</f:facet>
					<h:outputText value="#{summaryqualSup.totalScore}"></h:outputText>
				</p:column>
			<ui:remove>28784 - note 122 - add column rating - start</ui:remove>				
				<p:column style="width:15%;white-space: normal;text-align:center;" rendered="#{!evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.rating']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.tec.rating.tooltip']}" />
					</f:facet>
					<h:outputText
					value="#{empty summaryqualSup.totalRating? 0: summaryqualSup.totalRating}" />
				</p:column>
			<ui:remove>28784 - note 122 - add column rating - end</ui:remove>
				

			</p:dataTable>
			<p:spacer height="10px" />
			<table>
				<tr>
					<td style="width: 230px;"><h:outputLabel
							value="#{lbl['lbl.sc.passing.score']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right" value="#{passingScore}"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
				</tr>

			</table>

		</p:panel>




	</h:panelGroup>
