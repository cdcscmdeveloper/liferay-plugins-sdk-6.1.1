<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />


	<p:panel header="#{lbl['lbl.sc.eva.s1.manual.head']}" toggleable="true">
		<p:dataTable id="evManual" var="manuals1Evaluation" rows="10"
			value="#{evaluationBackingBean.managedBean.manuals1EvaluationList}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{manuals1Evaluation}">
			<ac:paginator for="evManual" />

			<p:column selectionMode="multiple" style="width:2%;text-align:center;" />


			<p:column headerText="#{lbl['lbl.sc.eva.s1.manual.supplier']}"
				style="width:20%">
				<p:inputText value="#{manuals1Evaluation.scQtProposal.supplierNo}"></p:inputText>

			</p:column>
			
				<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.status']}"
				style="width:30%">
				<h:outputText value="Pending"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.s1.tech.result']}"
				style="width:15%">
				<h:outputText value="Failed/Success"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
				style="width:20%">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
					onclick="manual.show();" action="#{evaluationBackingBean.evaluations1ManualAction(manuals1Evaluation)}" icon="ui-icon-evaluate" update=":form:manualpopupresults"></p:commandButton>
			</p:column>

		</p:dataTable>
		
	</p:panel>
	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','0')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
				</div></td>
		</tr>
	</table>
	</ui:composition>
