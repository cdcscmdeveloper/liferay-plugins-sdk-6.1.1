<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- Bug #33178 adding noSupplierPackageExist-->
<!-- #34588 start cater WIP -->
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" valign="top"><p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.oneTierFinancialActiveIndex}"
					styleClass="sidemenu">

					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
						<c:choose>
						<c:when test="#{evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.itemized']}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStage}"
							update="@form" />
						</c:when>
						<c:otherwise>
							<p:menuitem value="#{lbl['lbl.sc.financial']}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStage}"
							update="@form" />
						</c:otherwise>
						</c:choose>
					</c:if>
					<!-- Bug #33178 adding noSupplierPackageExist-->
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq
						and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.package']}"  disabled="#{evaluationBackingBean.managedBean.singleSpecQuestion or evaluationBackingBean.managedBean.noSupplierPackageExist ne null and evaluationBackingBean.managedBean.noSupplierPackageExist}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStagePackage}"
							update="@form" />
					</c:if>
<!-- #34588 end cater WIP -->
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.summary']}" process="@this" partialSubmit="true" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveOneTierFinancialSupplierSummary}"
							update="@form" />
					</c:if>

					<!-- <c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">


						<p:menuitem value="#{lbl['lbl.sc.eva.recommendation.summary']}" process="@this" partialSubmit="true" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveOneTierRecommendationSupplierSummary}"
							update="@form" />
					</c:if> -->

				</p:tabMenu></td>
			<td width="80%;" valign="top"><c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq and evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '0'}">
					<ui:include
						src="/xhtml/sc/evaluation/evaluationStage/financial/financialEvaluation.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq and evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '1'}">
					<!-- #34588 start cater WIP -->
					<c:choose>
						<c:when
							test="#{evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
							<ui:include
								src="/xhtml/sc/evaluation/evaluationStage/financial/financialEvaluationPackage.xhtml"></ui:include>
						</c:when>
						<c:otherwise>
							<ui:include src="financialEvaluationRecommendationSummary.xhtml" />
						</c:otherwise>
					</c:choose>
					<!-- #34588 end cater WIP -->
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq and evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '2'}">
					<ui:include src="financialEvaluationRecommendationSummary.xhtml" />
				</c:if> 
				<c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq and evaluationBackingBean.managedBean.oneTierFinancialActiveIndex eq '3'}">
					<ui:include src="FinancialEvaluationCommitteeSummary.xhtml" />
				</c:if>
				</td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><p:commandButton value="#{lbl['lbl.btn.prev']}"
					style="float:left;" styleClass="BtnSpacing"
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}"
					actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('3','2')}"
					action="#{evaluationBackingBean.updateSmAppl}" update=":form" /></td>
			<td><ui:fragment rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq 
						and evaluationBackingBean.managedBean.tabFinancialIndex eq '1'}">

					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('3','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />
				</ui:fragment>
				<ui:fragment rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq 
						and evaluationBackingBean.managedBean.tabFinancialIndex eq '2'}">

					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('3','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />
				</ui:fragment>
				<ui:fragment rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq 
						and evaluationBackingBean.managedBean.tabFinancialIndex eq '3'}">

					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('3','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />
				</ui:fragment>
			</td>

		</tr>
	</table>
<!-- #34588 end cater WIP -->


</ui:composition>
