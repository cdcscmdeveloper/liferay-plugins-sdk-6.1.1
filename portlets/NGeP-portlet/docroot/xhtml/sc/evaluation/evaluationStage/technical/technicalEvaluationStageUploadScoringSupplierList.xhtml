<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.supplier.list']}"
		id="technicalEvaluationCommitteeEvaluationStageUploadNoActionsScoringSuppliersIds"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="1. #{lbl['lbl.sc.eva.evaluation.stage.document.instruction']}"
			escape="false" />
		<br />
		<h:outputText styleClass="instruction"
			value="2. #{lbl['lbl.sc.eva.evaluation.stage.document.score.instruction']}"
			escape="false" />

		<p:dataTable var="complianceTechnicalSupplier" rows="10" lazy="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			id="complianceTechnicalSupplier" editable="true" rowIndexVar="index"
			style="width:100%" rowKey="#{complianceTechnicalSupplier}">
			<ac:paginator for="complianceTechnicalSupplier" />
			<p:ajax event="page"
				listener="#{evaluationBackingBean.SaveUploadCheckListSuppliersDM}"
				update="complianceTechnicalSupplier" />

				<ui:remove><!-- 6906 - start --></ui:remove>
				<ui:param name="isRejected" value="#{not empty complianceTechnicalSupplier.scQtProposal.supplierRejectionRemark}" />
				<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
					<table
						style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
						<tr>
							<td style="text-align: center; border: 0 !important" />
							<td style="text-align: center; border: 0 !important"><h:outputText
									value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}" /></td>
							<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
									show="#{isRejected}" id="remarkId"
									remark="#{complianceTechnicalSupplier.scQtProposal.supplierRejectionRemark.remark}"
									supplierCode="#{complianceTechnicalSupplier.scQtProposal.supplierNo}" /></td>
						</tr>
					</table>
				</p:column>
				<ui:remove> <!-- 6906 - end --> </ui:remove>
			<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.submitted eq 'true'}">
					<h:commandLink immediate="true"
						action="#{evaluationBackingBean.downloadEncryptedFile(complianceTechnicalSupplier.scQtProposalChecklistAttachment)}">
						<h:graphicImage value="/css/images/design/icon_txt.png" />
					</h:commandLink>
				</ui:fragment>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.submission.status']}"
				style="width:15%">
				<h:outputText
					value="#{complianceTechnicalSupplier.submitted ? lbl['lbl.txt.submitted']: lbl['lbl.txt.not.submitted']}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.compliance.status']}"
				style="width:15%">
				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(ParameterTypeConst.complianceStatus,complianceTechnicalSupplier.compliance)}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
				style="width:5%;">
				<p:inputText value="#{complianceTechnicalSupplier.totalUserScore}"
					id="technicaluploadNoActionUserScoreId"
					label="#{lbl['lbl.tpl.spec.content.user.score']}"
					style="text-align:right;"  maxlength="18" required="true"
					disabled="#{evaluationBackingBean.managedBean.readOnly or evaluationBackingBean.managedBean.technicalOrFinancialReEvaluateRequired or
					evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1' or isRejected or
					(complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected or
					complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}"><ui:remove><!-- 6906 --></ui:remove>
					<ac:validateNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
						maxIntegerDigits="14" integerOnly="true" />
					<f:attribute name="min" value="0" />
					<f:attribute name="max"
						value="#{evaluationBackingBean.managedBean.userScores}" />
					<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
				</p:inputText>
				<p:spacer width="2"></p:spacer>
				<h:outputText style="text-align:left;"
					value="/#{evaluationBackingBean.managedBean.userScores}" />
				<p:message id="technicaluploadNoActionUserScoreMessage"
					for="technicaluploadNoActionUserScoreId" display="icon"></p:message>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:35%">
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.submitted eq 'true'
					and (complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod ne SourcingConstants.extendProposalValidityPeriodRejected
					and complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod ne SourcingConstants.extendProposalValidityPeriodNotQualified)}">
					<p:inputTextarea rows="2" cols="55" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);" onmouseout="limitTextArea(this,200);"
						disabled="#{evaluationBackingBean.managedBean.readOnly or evaluationBackingBean.managedBean.technicalOrFinancialReEvaluateRequired}"
						value="#{complianceTechnicalSupplier.remark}">
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:inputTextarea>
				</ui:fragment>
				<ui:fragment
					rendered="#{complianceTechnicalSupplier.submitted eq 'true'
					and (complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodRejected or complianceTechnicalSupplier.scQtProposal.isAgreeQtExtendPeriod eq SourcingConstants.extendProposalValidityPeriodNotQualified)}">
					<p:inputTextarea rows="2" cols="55" maxlength="200" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);" onmouseout="limitTextArea(this,200);"
						disabled="true"
						value="#{lbl['lbl.sc.qt.proposal.evaluation.remark']}">
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:inputTextarea>
				</ui:fragment>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
