<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.eva.technical.user.scoring.schema']}"
		rendered="#{evaluationBackingBean.managedBean.scQt.technicalUserScoringSchemaAttachment ne null and(technicalNoofContractsCheckListScoreType eq '2' or technicalNoofYearsCheckListScoreType eq '2')}"
		toggleable="true"
		id="technicalevaluationAllChecklistUserScoringSchemasIds">


		<table border="0" cellspacing="0" cellpadding="0">
			<tr>

				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 500px;">

						<tr>

							<td><p:dataGrid
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									id="technicalSpecComitteeUserScoreUploadattachedIdsDemo"
									var="attachFile"
									value="#{evaluationBackingBean.managedBean.scQt.technicalUserScoringSchemaAttachment}"
									rowIndexVar="attachFileIndex" columns="1" style="width:100%">
									<table>
										<tr>

											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{evaluationBackingBean.downloadFile(attachFile)}" />
											</td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>

	</p:panel>

</ui:composition>
