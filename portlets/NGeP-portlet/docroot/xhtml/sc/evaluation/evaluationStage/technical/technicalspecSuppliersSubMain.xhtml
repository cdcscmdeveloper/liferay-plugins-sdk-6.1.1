<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<table width="100%" class="BtnSpacing">
		<tr>
			<td align="right"><p:commandButton
					value="#{lbl['lbl.btn.back']}" style="float:left;" immediate="true"
					action="#{evaluationBackingBean.evaluationBackaction}" /></td>
		</tr>
	</table>

	<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />

	<p:panel header="#{lbl['lbl.sc.eva.technical.proposal.evaluation']}" id="technicalSpecSupplierSubMainEvaluationProposalId"
		toggleable="true">
		<ui:include src="/xhtml/sc/evaluation/checklistHeader.xhtml" />
	</p:panel>
	<!-- #25138-ahmaa-start -->
	<c:if test="#{evaluationBackingBean.managedBean.evaluationTechnicalFinancialType eq 'ET' and evaluationBackingBean.managedBean.scQt.techEvaluationReq and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'}">
		<ui:include src="technicalSpecEvaluationStageSupplierList.xhtml" />
	</c:if> 
	
	<c:if test="#{evaluationBackingBean.managedBean.evaluationTechnicalFinancialType eq 'ET' and evaluationBackingBean.managedBean.scQt.techEvaluationReq and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}">
		<ui:include src="technicalSpecEvaluationStageSupplierListPackage.xhtml" />
