<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalEvaluationSpecSuppliersTechnicalTemplateSpecSuppliers" header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />


		<p:dataTable var="templateSpec" id="templateSpecId" editable="true"
			rows="10" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDMPackage}"
			rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}">
			<ac:paginator for="templateSpecIdPackage" />
			
			<p:columnGroup type="header">  
			        <p:row>  
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:10%; text-align:center;"/>    
			            <p:column colspan="2" headerText="#{lbl['lbl.sc.total.score.package']}" style="width:60%;text-align:center;"/>
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" style="width:20%;text-align:center;"/>   
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.action']}" style="width:20%;text-align:center;"/>
			        </p:row>  
			  
			        <p:row>  
			            <p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}" style="width:35%;text-align:center;"/>  
			            <p:column style="width:35%;text-align:center;">
				            <f:facet name="header">
								<h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"/>
							</f:facet>
			            </p:column>  
			        </p:row>  
			 </p:columnGroup>
			 
			 <p:column>  
		        <h:outputText value="#{templateSpec[2]}"/>  
		    </p:column>   
			 <p:column>  
		        <h:outputText
		        value="#{templateSpec[4]}"></h:outputText> 
		    </p:column>
		    <!-- Bug #32380 Farid Start related to #21695-->
			 <p:column>  
		        <h:outputText
		        value="#{templateSpec[5] ne null ? templateSpec[5] : 0}"></h:outputText>
		    </p:column>    
		    <!-- Bug #32380 Farid end related to #21695-->
		    <p:column>  
		        <h:outputText value="#{templateSpec[3]}"></h:outputText> 
		    </p:column>
			
			<p:column style="width:15%;text-align: center;">
					
				<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
					partialSubmit="true"
					action="#{evaluationBackingBean.technicalSupplierEvaluatePackage(templateSpec[0],templateSpec[2],'T')}" />
				
			</p:column>
		</p:dataTable>
	</p:panel>
	
	
</ui:composition>
