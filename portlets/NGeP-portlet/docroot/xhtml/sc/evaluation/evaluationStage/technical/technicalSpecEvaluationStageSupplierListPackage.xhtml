<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalEvaluationSpecSuppliersTechnicalTemplateSpecSuppliers" header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />


		<ui:remove><!-- 6906 reassign to diff var name, conflicting var--></ui:remove>
		<p:dataTable var="tecTemplateSpec" id="templateSpecId" editable="true"
			rows="10" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDMPackage}"
			rowIndexVar="index" style="width:100%" rowKey="#{tecTemplateSpec}"><ui:remove><!-- 6906 conflicting var on otherview--></ui:remove>
			<ac:paginator for="templateSpecIdPackage" />
			<ui:param name="templateSpec" value="#{tecTemplateSpec}"></ui:param><ui:remove><!-- 6906 conflicting var on otherview--></ui:remove>
			<p:columnGroup type="header">  
			        <p:row>  
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:10%; text-align:center;"/>    
			            <p:column colspan="2" headerText="#{lbl['lbl.sc.total.score.package']}" style="width:60%;text-align:center;"/>
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.total.score']}" style="width:20%;text-align:center;"/>   
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.action']}" style="width:20%;text-align:center;"/>
			        </p:row>  
			  
			        <p:row>  
			            <p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}" style="width:35%;text-align:center;"/>  
			            <p:column style="width:35%;text-align:center;">
				            <f:facet name="header">
								<h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"/>
							</f:facet>
			            </p:column>  
			        </p:row>  
			 </p:columnGroup>
			<ui:remove><!-- 6906 - start --></ui:remove>
			<ui:param name="isRejected" value="#{not empty templateSpec[9]}" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:20%; text-align:center;">
				<table
					style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
					<tr>
						<td style="text-align: center; border: 0 !important" />
			 			<td style="text-align: center; border: 0 !important"><h:outputText
								value="#{templateSpec[2]}" /> 
						</td>
						<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
								show="#{isRejected}" id="remarkId"
								remark="#{templateSpec[9]}"
								supplierCode="#{templateSpec[2]}" />
						</td>
					</tr>
				</table>
			</p:column>
			<ui:remove><!-- 6906 - end --></ui:remove>
			
			 <p:column>  
		        <h:outputText
		        value="#{templateSpec[4]}"></h:outputText> 
		    </p:column>
		    <!-- Bug #32380 Farid Start related to #21695-->
			 <p:column>  
		        <h:outputText
		        value="#{templateSpec[5] ne null ? templateSpec[5] : 0}"></h:outputText>
		    </p:column>    
		    <!-- Bug #32380 Farid end related to #21695-->
		    <p:column>  
		        <h:outputText value="#{templateSpec[3]}"></h:outputText> 
		    </p:column>
			
			<p:column style="width:15%;text-align: center;">
					
				<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
					partialSubmit="true"
					action="#{evaluationBackingBean.technicalSupplierEvaluatePackage(templateSpec[0],templateSpec[2],'T')}" 
					disabled="#{isRejected}"/><ui:remove><!-- 6906 --></ui:remove>
				
			</p:column>
		</p:dataTable>
	</p:panel>
	
	
</ui:composition>
