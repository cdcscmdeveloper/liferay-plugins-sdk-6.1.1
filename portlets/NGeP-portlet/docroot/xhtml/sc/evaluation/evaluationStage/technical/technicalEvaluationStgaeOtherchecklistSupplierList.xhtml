<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.supplier.list']}"
		id="technicalOtherCheckListNofoEmployessTechnicalStaffGovNonGovSampleSupplierList"
		toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />

		<p:dataTable var="othersList" id="othersTechListId" editable="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			lazy="true"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}"
			rows="10">
			<ac:paginator for="othersTechListId" />


			<ui:remove><!-- 6906 - start --></ui:remove>
			<ui:param name="isRejected" value="#{not empty othersList.scQtProposal.supplierRejectionRemark}"/>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
				<table style="table-layout: fixed; margin:auto !important; max-width:90px !important">
					<tr>
						<td style="text-align:center; border: 0 !important"/>
						<td style="text-align:center; border: 0 !important">
							<h:outputText value="#{othersList.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align:center; border: 0 !important">
							<ac:iconRejectRemarkBox show="#{isRejected}" id="remarkId"
							remark="#{othersList.scQtProposal.supplierRejectionRemark.remark}"
							supplierCode="#{othersList.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
			</p:column>
			<ui:remove><!-- 6906 - end --></ui:remove>


			<p:column headerText="#{lbl['lbl.sc.total.score']}" rendered="#{evaluationBackingBean.managedBean.isScoringReq}"
				style="width:20%;text-align:right;">
				<h:outputText value="#{othersList.totalScore}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.evalvation.status']}" rendered="#{evaluationBackingBean.managedBean.isScoringReq}"
				style="width:25%">


				<h:outputText
					value="#{evaluationBackingBean.getStatusDescById(othersList.evaluationStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column style="width:30%;text-align: center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
				
				</f:facet>
				<ui:param name="supplierRejectedSample" value="#{isRejected and othersList.scQtCheckList.definationType.parameterCode eq ParameterConst.documentDefinitionTypeSample}"></ui:param> <ui:remove><!-- 6906 --></ui:remove>
				<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
					rendered="#{othersList.evaluationStatus.statusId eq '61600'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(othersList,'T')}" 
					disabled="#{supplierRejectedSample}"/><ui:remove><!-- 6906 --></ui:remove>

				<p:commandButton value="#{lbl['lbl.btn.view']}"
					rendered="#{othersList.evaluationStatus.statusId eq '61601'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(othersList,'T')}"
					disabled="#{supplierRejectedSample}"/><ui:remove><!-- 6906 --></ui:remove>

			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
