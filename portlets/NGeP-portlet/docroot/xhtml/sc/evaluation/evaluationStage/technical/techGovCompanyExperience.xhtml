<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<h:panelGroup id="noOfContracts">
			<ui:param name="scoringPnlId" value="contractorListId" />
			<ui:param name="scoringList"
				value="#{evaluationBackingBean.managedBean.technicalGovNoOfContracts}"></ui:param>
			<ui:param name="scoringPnlName"
				value="#{lbl['lbl.sc.spec.score.total.no.contracts']}"></ui:param>
			<p:panel header="#{scoringPnlName}" toggleable="true"
				id="technicalSupplierNoofContractsEvaluationAutoScoringId"
				rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">

				<p:dataTable id="#{scoringPnlId}" rowIndexVar="index" rows="10"
				    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{scoringList}" var="checkListScoring"
					rowKey="#{checkListScoring}">
					<ac:paginator for="#{scoringPnlId}"></ac:paginator>
					<!-- 	<p:column selectionMode="multiple" style="width:2px;"></p:column> -->
					<p:column headerText="#{lbl['lbl.sc.from']}"
						style="width:40%;text-align:right;"
						rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">
						<h:outputText value="#{checkListScoring.rangeFrom}"></h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.to']}"
						style="width:30%;text-align:right;"
						rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">
						<h:outputText value="#{checkListScoring.rangeTo}"></h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.score']}"
						style="width:30%;text-align:right;">
						<h:outputText value="#{checkListScoring.score}"></h:outputText>
					</p:column>

				</p:dataTable>
			</p:panel>
		</h:panelGroup>

		<p:spacer height="25"></p:spacer>
	
		<ui:param name="technicalNoofContractsCheckListScoreType" value="#{evaluationBackingBean.managedBean.checklistScoreType}"></ui:param>
	<ui:param name="technicalNoofYearsCheckListScoreType" value="#{evaluationBackingBean.managedBean.companyScoreType}"></ui:param>
	
<ui:include
			src="technicalUserScoringSchema.xhtml" />
	</h:panelGroup>
</ui:composition>
