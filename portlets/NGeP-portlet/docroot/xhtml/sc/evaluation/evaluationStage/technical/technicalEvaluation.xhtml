<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<p:panel id="evaluationStageTechnicalChecklistMainPageIds" header="#{lbl['lbl.sc.technical.proposal']}"
			toggleable="true">
			
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.evaluation.stage.instruction']}" escape="false" />
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.proposal.evaluation.supplier.instruction.technical']}" escape="false" /><ui:remove>21692</ui:remove>

			<p:dataTable var="technicalEvaluate" id="technicalEvaluation"
				editable="true" rowIndexVar="index"
				first="#{evaluationBackingBean.managedBean.evaluationtechnicalTableRow}"
				rowKey="#{technicalEvaluate}"
				value="#{evaluationBackingBean.managedBean.evaluationStgTechnicalCheckList}">
				<!-- 	<ac:paginator for="technicalEvaluation" /> -->


				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
					style="width:55%;white-space: normal;">

					<h:outputText value="#{technicalEvaluate.title}"></h:outputText>


				</p:column>
				<p:column style="width:20%;white-space: normal;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.type']}" />
						<ac:iconTooltip id="type#{row}TEC" value="#{lbl['lbl.sc.type.technical.tooltip']}" />
					</f:facet>

					<h:outputText
						value="#{evaluationBackingBean.getParameterDesc(technicalEvaluate.definationType)}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
					style="width:15%;white-space: normal;">


					<h:outputText
						value="#{evaluationBackingBean.getStatusDescById(technicalEvaluate.pmEvalStatus.statusId)}"></h:outputText>

				</p:column>

				<p:column 
					style="width:10%;text-align: center;">
					
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
					<ac:iconTooltip id="technicalEvaluationChecklistaction#{index}TSSOTSP"
						value="#{lbl['lbl.sc.action.evaluation.tooltip']}" />
				</f:facet>

					<ui:fragment rendered="#{technicalEvaluate.scoringReq eq 'false'}">
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.viewTechnicalEvaluation(technicalEvaluate,index,'ET')}" />
					</ui:fragment>
					<ui:fragment rendered="#{technicalEvaluate.scoringReq ne 'false' and  (null ne technicalEvaluate.pmEvalStatus and technicalEvaluate.pmEvalStatus.statusId eq '60450')}">
						<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
							action="#{evaluationBackingBean.evaluateTechnicalEvaluation(technicalEvaluate,index,'ET')}"
							process="@this" partialSubmit="true" />
					</ui:fragment>
					
					<ui:fragment rendered="#{technicalEvaluate.scoringReq ne 'false' and  (null ne technicalEvaluate.pmEvalStatus and technicalEvaluate.pmEvalStatus.statusId eq '60451')}">
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							action="#{evaluationBackingBean.evaluateTechnicalEvaluation(technicalEvaluate,index,'ET')}"
							process="@this" partialSubmit="true" />
					</ui:fragment>

				</p:column>

			</p:dataTable>


		</p:panel>
		<p:spacer height="15"></p:spacer>
		<!-- #34588 start(wip doesnt need to show below)-->
		<c:if test="#{evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
			<p:panel id="technicalComplianceChecklistmainPageProposalIds"
				header="#{lbl['lbl.sc.eva.non.scoring.compliance']}"
				toggleable="true">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.eva.compliance.stage.instruction']}"
					escape="false" />

				<p:dataTable var="complianceTech" id="complianceTechnicalProposal"
					editable="true" rowIndexVar="index"
					value="#{evaluationBackingBean.managedBean.complianceTechnicalCheckList}"
					first="#{evaluationBackingBean.managedBean.evaluationtechnicalTableRow}"
					rowKey="#{complianceTech}">
					<!-- 	<ac:paginator for="complianceTechnicalProposal" /> -->


					<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
						style="width:55%;white-space: normal;">

						<h:outputText value="#{complianceTech.title}"></h:outputText>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.type']}" style="width:20%">


						<h:outputText
							value="#{evaluationBackingBean.getParameterDesc(complianceTech.definationType)}"></h:outputText>

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
						style="width:15%;white-space: normal;">


						<h:outputText
							value="#{evaluationBackingBean.getStatusDescById(complianceTech.pmEvalStatus.statusId)}"></h:outputText>

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}"
						style="width:10%;text-align: center;">

						<p:commandButton value="#{lbl['lbl.btn.view']}"
							rendered="#{(complianceTech.definationType.parameterCode eq 'UP' or complianceTech.definationType.parameterCode eq 'NA') and (null ne complianceTech.pmEvalStatus and complianceTech.pmEvalStatus.statusId eq '60451')}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.complianceUploadCheckListNonScoring(complianceTech,index,'T')}" />

						<p:commandButton value="#{lbl['lbl.btn.view']}"
							rendered="#{(complianceTech.definationType.parameterCode ne 'UP' and complianceTech.definationType.parameterCode ne 'NA') and complianceTech.scoringReq eq 'false' and  (null ne complianceTech.pmEvalStatus and complianceTech.pmEvalStatus.statusId eq '60451')}"
							action="#{evaluationBackingBean.evaluateTechnicalEvaluation(complianceTech,index,'ET')}"
							process="@this" partialSubmit="true" />



					</p:column>

				</p:dataTable>


			</p:panel>
		</c:if>
		<!-- #34588 end-->
	
	</h:panelGroup>

</ui:composition>
