<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<p:panel id="evaluationStageTechnicalChecklistMainPageIds" header="#{lbl['lbl.sc.technical.proposal']}"
			toggleable="true">
			
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.evaluation.stage.instruction']}" escape="false" />

			<p:dataTable var="technicalEvaluate" id="technicalEvaluation"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				editable="true" rowIndexVar="index"
				first="#{evaluationBackingBean.managedBean.evaluationtechnicalTableRow}"
				rowKey="#{technicalEvaluate}"
				value="#{evaluationBackingBean.managedBean.evaluationStgTechnicalCheckList}">
				<!-- 	<ac:paginator for="technicalEvaluation" /> -->


				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
					style="width:55%;white-space: normal;">

					<h:outputText value="#{technicalEvaluate.title}"></h:outputText>


				</p:column>
				<p:column style="width:20%;white-space: normal;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.type']}" />
						<ac:iconTooltip id="type#{row}TEC" value="#{lbl['lbl.sc.type.technical.tooltip']}" />
					</f:facet>

					<h:outputText
						value="#{evaluationBackingBean.getParameterDesc(technicalEvaluate.definationType)}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
					style="width:15%;white-space: normal;">


					<h:outputText
						value="#{evaluationBackingBean.getStatusDescById(technicalEvaluate.pmEvalStatus.statusId)}"></h:outputText>

				</p:column>

				<p:column 
					style="width:10%;text-align: center;">
					
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
					<ac:iconTooltip id="technicalEvaluationChecklistaction#{index}TSSOTSP"
						value="#{lbl['lbl.sc.action.evaluation.tooltip']}" />
				</f:facet>

					<ui:fragment rendered="#{technicalEvaluate.scoringReq eq 'false'}">
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.viewTechnicalEvaluation(technicalEvaluate,index,'ET')}" />
					</ui:fragment>
					<ui:fragment rendered="#{technicalEvaluate.scoringReq ne 'false' and  (null ne technicalEvaluate.pmEvalStatus and technicalEvaluate.pmEvalStatus.statusId eq '60450')}">
						<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
							action="#{evaluationBackingBean.evaluateTechnicalEvaluation(technicalEvaluate,index,'ET')}"
							process="@this" partialSubmit="true" />
					</ui:fragment>
					
					<ui:fragment rendered="#{technicalEvaluate.scoringReq ne 'false' and  (null ne technicalEvaluate.pmEvalStatus and technicalEvaluate.pmEvalStatus.statusId eq '60451')}">
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							action="#{evaluationBackingBean.evaluateTechnicalEvaluation(technicalEvaluate,index,'ET')}"
							process="@this" partialSubmit="true" />
					</ui:fragment>

				</p:column>

			</p:dataTable>


		</p:panel>

	</h:panelGroup>

</ui:composition>
