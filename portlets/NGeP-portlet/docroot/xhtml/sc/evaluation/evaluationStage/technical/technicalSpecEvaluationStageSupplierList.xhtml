<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalEvaluationSpecSuppliersTechnicalTemplateSpecSuppliers" header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />

		<p:dataTable var="templateSpec" id="templateSpecId" editable="true"
			rows="10" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}">
			<ac:paginator for="templateSpecId" />

			<ui:remove><!-- 6906 - start --></ui:remove>
			<ui:param name="isRejected" value="#{not empty templateSpec.scQtProposal.supplierRejectionRemark}"/>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
				<table style="table-layout: fixed; margin:auto !important; max-width:90px !important">
					<tr>
						<td style="text-align:center; border: 0 !important"/>
						<td style="text-align:center; border: 0 !important">
							<h:outputText value="#{templateSpec.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align:center; border: 0 !important">
							<ac:iconRejectRemarkBox show="#{isRejected}" id="remarkId"
							remark="#{templateSpec.scQtProposal.supplierRejectionRemark.remark}"
							supplierCode="#{templateSpec.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
				<ui:remove><!-- 6906 - end --></ui:remove>
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}"
				style="width:20%;text-align:right;"
				rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<h:outputText value="#{templateSpec.totalAutoScore}"></h:outputText>

			</p:column>
<!-- Bug #32380 Farid Start related to #21695-->
			<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
				style="width:20%;text-align:right;"
				rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<h:outputText value="#{templateSpec.totalUserScore ne null ? templateSpec.totalUserScore : 0}"></h:outputText>
			</p:column>
<!-- Bug #32380 Farid End related to #21695-->
			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:20%;text-align:right;"
				rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<h:outputText value="#{templateSpec.totalScore}"></h:outputText>
			</p:column>


			<p:column style="width:15%;text-align: center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
					
				</f:facet>

				<p:commandButton value="#{lbl['lbl.btn.evaluate']}" process="@this"
					partialSubmit="true"
					rendered="#{templateSpec.evaluationStatus.statusId eq '61600' and evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(templateSpec,'T')}" 
					disabled="#{isRejected}"/><ui:remove><!-- 6906 --></ui:remove>

				<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
					partialSubmit="true"
					rendered="#{templateSpec.evaluationStatus.statusId eq '61601' and evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(templateSpec,'T')}" 
					disabled="#{isRejected}"/><ui:remove><!-- 6906 --></ui:remove>

				<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
					partialSubmit="true"
					rendered="#{((templateSpec.evaluationStatus.statusId eq '61600' and !evaluationBackingBean.managedBean.scQtChecklist.scoringReq) or (templateSpec.evaluationStatus.statusId eq '61601' and !evaluationBackingBean.managedBean.scQtChecklist.scoringReq))}"
					action="#{evaluationBackingBean.technicalSupplierEvaluate(templateSpec,'T')}" 
					disabled="#{isRejected}"/><ui:remove><!-- 6906 --></ui:remove>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
