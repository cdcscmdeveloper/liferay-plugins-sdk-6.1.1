<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<h:panelGroup>
		<h:panelGroup>

			<table width="100%" class="BtnSpacing">
				<tr>
					<td align="right"><p:commandButton
							value="#{lbl['lbl.btn.back']}" style="float:left;"
							immediate="true"
							action="#{evaluationBackingBean.technicalSpecBackaction}" /> <p:commandButton
							value="#{lbl['lbl.btn.save']}"
							disabled="#{evaluationBackingBean.managedBean.readOnly or evaluationBackingBean.managedBean.technicalOrFinancialReEvaluateRequired
							or evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}"
							style="float:right;" update="@all" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.saveTempleateSpecDtls}" /></td>
				</tr>
			</table>


		</h:panelGroup>

		<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />

		<p:panel id="technicalSpecSupplierScoringOtherProposalheader"
			toggleable="true"
			header="#{lbl['lbl.sc.eva.technical.proposal.evaluation']}">
			<ui:include
				src="/xhtml/sc/evaluation/evaluationStage/supplierChecklistHeader.xhtml" />
		</p:panel>

	</h:panelGroup>

</ui:composition>
