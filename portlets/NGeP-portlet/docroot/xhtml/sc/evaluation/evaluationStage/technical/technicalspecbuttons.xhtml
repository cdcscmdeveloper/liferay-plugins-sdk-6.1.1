<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<h:panelGroup>
		<h:panelGroup>

			<table width="100%" class="BtnSpacing">
				<tr>
					<td align="right"><p:commandButton
							value="#{lbl['lbl.btn.back']}" style="float:left;"
							immediate="true"
							action="#{evaluationBackingBean.technicalSpecBackaction}" /> 
							<ui:remove>#29187 Start Moved update to backingbean for note #582 Vinod
							Added hidden button to update data note #721
							</ui:remove>
							<p:commandButton
							value="#{lbl['lbl.btn.save']}" style="display:none;" id="hidSaveButton" binding="#{hidSaveButton}"
							disabled="#{evaluationBackingBean.managedBean.readOnly or evaluationBackingBean.managedBean.technicalOrFinancialReEvaluateRequired
							or evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}"
							update="@all" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.saveTempleateSpecDtls}" />
							<p:commandButton 
							value="#{lbl['lbl.btn.save']}" style="float:right;"
							disabled="#{evaluationBackingBean.managedBean.readOnly or evaluationBackingBean.managedBean.technicalOrFinancialReEvaluateRequired
							or evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}"
							action="#{evaluationBackingBean.validateSaveTemplateForMandatorySpec(hidSaveButton.clientId)}" /></td>
							<ui:remove>#29187 End Vinod</ui:remove>
				</tr>
			</table>


		</h:panelGroup>

		<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />

		<p:panel id="technicalSpecSupplierScoringOtherProposalheader"
			toggleable="true"
			header="#{lbl['lbl.sc.eva.technical.proposal.evaluation']}">
			<ui:include
				src="/xhtml/sc/evaluation/evaluationStage/supplierChecklistHeader.xhtml" />
		</p:panel>

	</h:panelGroup>
	<ui:remove>#29187 Start Vinod</ui:remove>
	<p:dialog id="complianceConfirmId" widgetVar="complianceConfirmPopUp"
			header="#{lbl['lbl.msg.confirm.cancel.header']}" resizable="false"
			width="35%" height="100" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.tpl.spec.content.scoring.compliance.confirmation']}" /></td>
				</tr>
			</table>
			
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" onclick="blockWidget.show();"
					oncomplete="complianceConfirmPopUp.hide(); blockWidget.hide();"
					action="#{evaluationBackingBean.validateSaveTemplateForMandatorySpec(hidSaveButton.clientId)}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" onclick="blockWidget.show();"
					oncomplete="complianceConfirmPopUp.hide(); blockWidget.hide();"
					action="#{evaluationBackingBean.resetComplianceConfirmationFlag}"
					partialSubmit="true" process="@this"/>
			</div>
	</p:dialog>
	<ui:remove>#29187 End Vinod</ui:remove>
</ui:composition>
