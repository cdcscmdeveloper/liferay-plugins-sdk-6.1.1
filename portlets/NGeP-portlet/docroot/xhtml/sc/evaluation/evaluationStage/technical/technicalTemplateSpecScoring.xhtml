<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="technicalEvaluationmsgId" autoUpdate="true"
			closable="true" showDetail="true" showSummary="false"
			severity="error,info"></p:messages>

		<ui:include src="technicalspecbuttons.xhtml"></ui:include>

		<ui:include src="technicalspeccompliancelist.xhtml"></ui:include>
		
		<c:if test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'}">
			<ac:templateSpec
				templateSpecBean="#{evaluationBackingBean.managedBean.templateSpecBean}" />	
		</c:if> 
		
		<c:if test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}">
			<ui:include src="technicalItemSupplierList.xhtml"></ui:include> 
		</c:if>
		 
		<ui:param name="technicalNoofContractsCheckListScoreType"
			value="#{evaluationBackingBean.managedBean.userScoreSchemaType}"></ui:param>
		<ui:param name="technicalNoofYearsCheckListScoreType"
			value="#{evaluationBackingBean.managedBean.dummyScoreType}"></ui:param>

		<ui:include src="technicalUserScoringSchema.xhtml" />


	</ui:define>
</ui:composition>
