<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="technicalEvaluationSpecSuppliersTechnicalTemplateSpecSuppliers" header="#{lbl['lbl.sc.specification']}" toggleable="true">
		<!-- <h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" /> -->

		<p:dataTable var="templateSpec" id="templateSpecId" editable="true"
			rows="10" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.evaluationStgPkgPropCheckList}"
			rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}">
			<!-- <ac:paginator for="templateSpecId" /> -->


			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:25%; text-align:left;">

				<h:outputText value="#{templateSpec.scQtCheckList.title}"></h:outputText>


			</p:column>

		 	<p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}"
				style="width:20%;text-align:left;">
				<h:outputText value="#{templateSpec.totalAutoScore}"></h:outputText>

			</p:column>
<!-- Bug #32380 Farid Start related to #21695-->
			<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
				style="width:20%;text-align:left;">
				<h:outputText value="#{templateSpec.totalUserScore ne null ? templateSpec.totalUserScore : 0}"></h:outputText>
			</p:column>
<!-- Bug #32380 Farid end related to #21695-->
			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:20%;text-align:left;">
				<h:outputText value="#{templateSpec.totalScore}"></h:outputText>
			</p:column>  

		</p:dataTable>
		
		<p:spacer height="15" />
		<table style="width:100%">
			<tr>
				<td class="TableFieldLeft" width="8%">
					<p:outputLabel value="#{lbl['lbl.sc.total.score']}" />
				</td>
				<td class="TableFieldRight" width="92%">
					<p:inputText style="text-align:right;" styleClass="calcScore" size="8"
						value="#{evaluationBackingBean.managedBean.totalScore} / #{evaluationBackingBean.managedBean.totalMaxScore} "
						disabled="true" readonly="true"/>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
