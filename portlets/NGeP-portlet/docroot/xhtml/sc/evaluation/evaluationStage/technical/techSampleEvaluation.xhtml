<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup>
			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
			<p:messages id="sampleEvaluationmsgId" autoUpdate="true"
				closable="true" showDetail="true" showSummary="false"
				severity="error,info"></p:messages>
			<ui:include src="samplebuttons.xhtml"></ui:include>

			<h:panelGroup id="sampleComplianceid">
				<p:panel header="#{lbl['lbl.sc.compliance.list']}"
					id="EvaluationStageTechnicalsampleComplianceChecklistHeeaderNameIds"
					toggleable="true" collapsed="true">
					<h:outputText styleClass="instruction"
						value="#{lbl['lbl.sc.eva.evaluation.stage.document.instruction']}"
						escape="false" />

					<p:dataTable var="techComplianceList" id="sampleComplianceListId"
					    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						rows="10"
						value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
						rowIndexVar="index" style="width:100%"
						rowKey="#{techComplianceList}">
						<ac:paginator for="sampleComplianceListId" />


						<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
							style="width:90%">
							<h:outputText value="#{techComplianceList.scQtCheckList.title}"></h:outputText>
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
							<h:commandLink immediate="true"
								action="#{evaluationBackingBean.downloadEncryptedFile(techComplianceList.scQtProposalChecklistAttachment)}">
								<h:graphicImage value="/css/images/design/icon_txt.png" />
							</h:commandLink>
						</p:column>

					</p:dataTable>



				</p:panel>

			</h:panelGroup>
			<h:panelGroup id="sampleTeplateSpecItemList">
				<ui:include src="sampleItemList.xhtml"></ui:include>

			</h:panelGroup>
			<ui:param name="technicalNoofContractsCheckListScoreType"
				value="#{evaluationBackingBean.managedBean.userScoreSchemaType}"></ui:param>
			<ui:param name="technicalNoofYearsCheckListScoreType"
				value="#{evaluationBackingBean.managedBean.dummyScoreType}"></ui:param>

			<ui:include src="technicalUserScoringSchema.xhtml" />
		</h:panelGroup>
	</ui:define>
</ui:composition>
