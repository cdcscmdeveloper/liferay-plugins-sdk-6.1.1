<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{qualifiedSupplierListHeader}" />
			<ac:iconTooltip value="#{qualifiedSupplierListTooltip}" />
		</f:facet>

		<p:dataTable var="finEvaluationqualifiedSupplier" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			id="summaryQualifiedpackage" value="#{qualifiedList}" editable="true"
			rowIndexVar="index" rowKey="#{qualifiedSupplier}">
			<ac:paginator for="summaryQualifiedpackage" />


			<p:column headerText="#{lbl['lbl.sc.ranking']}">

				<h:outputLabel value="#{finEvaluationqualifiedSupplier.evalRank}"
					style="text-align:right"></h:outputLabel>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:30%">

				<h:outputText
					value="#{finEvaluationqualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}">
				<h:outputLabel value="#{finEvaluationqualifiedSupplier.totalScore}"
					style="text-align:right"></h:outputLabel>
			</p:column>


		</p:dataTable>


	</p:panel>


	<table>

		<tr>
			<td style="width: 220px;"><h:outputLabel
					value="#{lbl['lbl.sc.passing.score']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					style="text-align:right"
					value="#{passingScore}"></p:inputText></td>
		</tr>
		<tr>
			<td><h:outputLabel
					value="#{lbl['lbl.sc.total']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					style="text-align:right"
					value="#{(!empty qualifiedList) ? qualifiedList.size() :0}"></p:inputText></td>
		</tr>

	</table>




	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{disQualifiedSupplierListHeader}" />
			<ac:iconTooltip value="#{disQualifiedSupplierListTooltip}" />
		</f:facet>

		<p:dataTable var="disQualifiedSupplier" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			id="summaryDisqualifiedQualifiedpackage" editable="true"
			value="#{disQualifiedList}" rowIndexVar="index"
			rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="summaryDisqualifiedQualifiedpackage" />


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:30%">

				<h:outputText
					value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}">
				<h:outputLabel value="#{disQualifiedSupplier.totalScore}"
					style="text-align:right"></h:outputLabel>
			</p:column>


		</p:dataTable>


	</p:panel>


	<table>

		<tr>
			<td style="width: 220px;"><h:outputLabel
					value="#{lbl['lbl.sc.total']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					style="text-align:right"
					value="#{(!empty disQualifiedSupplier) ? disQualifiedList.size():0}"></p:inputText></td>
		</tr>

	</table>



</ui:composition>
