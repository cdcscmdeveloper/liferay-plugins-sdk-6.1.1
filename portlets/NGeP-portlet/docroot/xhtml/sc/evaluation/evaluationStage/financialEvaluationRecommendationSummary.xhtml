<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="qualifiedSupplierListHeader"
		value="#{lbl['lbl.sc.eva.qualified.supplier.list.fec.evaluation.stage']}" />
	<ui:param name="qualifiedSupplierListTooltip"
		value="#{lbl['lbl.sc.eva.qualified.supplier.list.fec.evaluation.stage.tooltip']}" />
	<ui:param name="disQualifiedSupplierListHeader"
		value="#{lbl['lbl.sc.eva.disqualified.supplier.list.fec.evaluation.stage']}" />
	<ui:param name="disQualifiedSupplierListTooltip"
		value="#{lbl['lbl.sc.eva.disqualified.supplier.list.fec.evaluation.stage.tooltip']}" />

	<table>
		<tr>
			<td><h:outputLabel value="#{lbl['lbl.sc.view.by']}" /></td>
			<td><p:selectOneMenu
					value="#{evaluationBackingBean.managedBean.financialSummaryView}">
					<f:selectItems value="#{evaluationBackingBean.finanialSummaryDropDownValues()}"></f:selectItems>
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{evaluationBackingBean.financialsummaryChange}"
						update="@([id$=financialviewSummary])"></p:ajax>
				</p:selectOneMenu></td>
		</tr>

	</table>



	<h:panelGroup id="financialviewSummary">
		<c:if
			test="#{evaluationBackingBean.managedBean.financialSummaryView eq 'FI'}">
			<c:if
				test="#{evaluationBackingBean.managedBean.scQt.zonal ne 'false'}">
				<p:accordionPanel dynamic="true"
					value="#{evaluationBackingBean.managedBean.evaluationStageZonesSummary}"
					var="zonePnlList">
					<p:ajax event="tabChange"
						listener="#{evaluationBackingBean.evaluationZonesFinancialsummaryTabChange}"
						update="@(.evaluationstagesummaryrecommendationItemtab)" />
					<p:tab title="#{zonePnlList.zoneName}">
						<h:panelGroup
							styleClass="evaluationstagesummaryrecommendationItemtab">
							<c:if test="#{zonePnlList.zoneName ne null}">
								<ui:param name="recommendationitemListId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="recommendationitemSelectQualifiedId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="recommendationitemSelectDisQualifiedId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="recommendationqualifiedSupplierItemId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="recommendationdisQualifiedSupplierItemId"
									value="#{zonePnlList.zoneName}"></ui:param>



							</c:if>

							<c:if test="#{zonePnlList.zoneName eq null}">
								<ui:param name="recommendationitemListId" value="itemLst1"></ui:param>
								<ui:param name="recommendationitemSelectDisQualifiedId"
									value="supplierItemsdisSelected"></ui:param>
								<ui:param name="recommendationqualifiedSupplierItemId"
									value="qualifiedSuppliersZone"></ui:param>
								<ui:param name="recommendationdisQualifiedSupplierItemId"
									value="disQualifiedSupplierszone"></ui:param>
								<ui:param name="recommendationitemSelectQualifiedId"
									value="supplierItemsSelected"></ui:param>

							</c:if>

							<ui:param name="passingScore"
								value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
							<ui:param name="itemList"
								value="#{evaluationBackingBean.managedBean.summaryItemList}"></ui:param>

							<ui:include src="summaryItem.xhtml"></ui:include>
						</h:panelGroup>
					</p:tab>
				</p:accordionPanel>
			</c:if>
			<c:if
				test="#{evaluationBackingBean.managedBean.scQt.zonal eq 'false'}">
				<ui:param name="recommendationitemListId" value="itemLstwithoutzone"></ui:param>
				<ui:param name="recommendationitemSelectQualifiedId"
					value="itemSupplierQualifiedoutzoneId"></ui:param>
				<ui:param name="recommendationitemSelectDisQualifiedId"
					value="itemSupplierDisQualifiedoutzoneId"></ui:param>
				<ui:param name="recommendationqualifiedSupplierItemId"
					value="qualifiedSupplierswithOutZone"></ui:param>
				<ui:param name="recommendationdisQualifiedSupplierItemId"
					value="disQualifiedSupplierswithOutzone"></ui:param>
				<ui:param name="itemList"
					value="#{evaluationBackingBean.managedBean.summaryItemList}"></ui:param>
				<ui:param name="passingScore"
					value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
				<ui:include src="summaryItem.xhtml"></ui:include>
			</c:if>
		</c:if>

		<c:if
			test="#{evaluationBackingBean.managedBean.financialSummaryView eq 'FPM'}">

			<c:if
				test="#{evaluationBackingBean.managedBean.scQt.zonal ne 'false'}">
				<p:accordionPanel dynamic="true"
					value="#{evaluationBackingBean.managedBean.evaluationStageZonesSummary}"
					var="zonePnlList">
					<p:ajax event="tabChange"
						listener="#{evaluationBackingBean.evaluationZonesFinancialsummaryTabChange}"
						update="@(.evaluationstagesummaryrecommendationPreferenceMargintab)" />
					<p:tab title="#{zonePnlList.zoneName}">
						<h:panelGroup
							styleClass="evaluationstagesummaryrecommendationPreferenceMargintab">
							<c:if test="#{zonePnlList.zoneName ne null}">
								<ui:param name="recommendationqualifiedPreferenceListId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="recommendationdisQualifiedPreferenceListId"
									value="#{zonePnlList.zoneName}"></ui:param>
							</c:if>

							<c:if test="#{zonePnlList.zoneName eq null}">
								<ui:param name="recommendationqualifiedPreferenceListId"
									value="preference1"></ui:param>
								<ui:param name="recommendationdisQualifiedPreferenceListId"
									value="preference2"></ui:param>
							</c:if>

							<ui:param name="qualifiedPreferenceList"
								value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"></ui:param>
							<ui:param name="disQualifiedPreferenceList"
								value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"></ui:param>
							<ui:param name="passingScore"
								value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
							<ui:include src="summaryPrefernceMargin.xhtml"></ui:include>
						</h:panelGroup>
					</p:tab>
				</p:accordionPanel>
			</c:if>

			<c:if
				test="#{evaluationBackingBean.managedBean.scQt.zonal eq 'false'}">
				<ui:param name="recommendationqualifiedPreferenceListId"
					value="QualifiedPreferenceMarginListId"></ui:param>
				<ui:param name="recommendationdisQualifiedPreferenceListId"
					value="disQualifiedPreferenceMarginListId"></ui:param>
				<ui:param name="qualifiedPreferenceList"
					value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"></ui:param>
				<ui:param name="disQualifiedPreferenceList"
					value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"></ui:param>
				<ui:param name="passingScore"
					value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
				<ui:include src="summaryPrefernceMargin.xhtml"></ui:include>
			</c:if>
		</c:if>
	</h:panelGroup>



</ui:composition>
