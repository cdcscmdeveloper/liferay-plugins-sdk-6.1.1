<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{scoringPnlName}" toggleable="true" id="evaluationAllSupplierAutoScoringpanelIds"
		rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">

		<p:dataTable id="#{scoringPnlId}" rowIndexVar="index"
			value="#{scoringList}" rows="10" var="checkListScoring"
			rowKey="#{checkListScoring}">
			<ac:paginator for="#{scoringPnlId}"></ac:paginator>
			<!-- 	<p:column selectionMode="multiple" style="width:2px;"></p:column> -->
			<p:column headerText="#{lbl['lbl.sc.from']}" style="width:40%"
				rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">
				<h:outputLabel value="#{checkListScoring.rangeFrom}"
					style="text-align:right"></h:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.to']}" style="width:30%"
				rendered="#{evaluationBackingBean.managedBean.checklistScoreType eq '1'}">
				<h:outputLabel value="#{checkListScoring.rangeTo}"
					style="text-align:right"></h:outputLabel>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.score']}" style="width:30%">
				<h:outputLabel value="#{checkListScoring.score}"
					style="text-align:right"></h:outputLabel>
			</p:column>

		</p:dataTable>
	</p:panel>


</ui:composition>
