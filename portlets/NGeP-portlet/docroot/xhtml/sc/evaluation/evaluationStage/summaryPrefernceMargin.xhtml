<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{qualifiedSupplierListHeader}" />
			<ac:iconTooltip value="#{qualifiedSupplierListTooltip}" />
		</f:facet>

		<p:dataTable var="prefQualSupplier"
			id="evaluationSummaryPreferencemarginQualifiedSuppliers"
			value="#{qualifiedPreferenceList}" rows="10" editable="true"
			lazy="true" rowIndexVar="index" rowKey="#{qualifiedPreferenceListId}">
			<ac:paginator
				for="evaluationSummaryPreferencemarginQualifiedSuppliers" />




			<p:column headerText="#{lbl['lbl.sc.ranking']}" style="width:10%">

				<h:outputLabel value="#{prefQualSupplier.evalRank}"
					style="text-align:right"></h:outputLabel>
			</p:column>




			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:10%">

				<h:outputText
					value="#{prefQualSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:10%">
				<h:outputLabel value="#{prefQualSupplier.totalScore}"
					style="text-align:right"></h:outputLabel>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}"
				style="width:15%">

				<h:outputText
					value="#{prefQualSupplier.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi ? 'Bumi' : 'Non Bumi'}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.offered.price']}"
				style="width:15%">
				<h:outputLabel
					value="#{prefQualSupplier.qtEvaluationResult.scQtProposal.proposalAmount.proposalAmt}"
					style="text-align:right">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputLabel>

			</p:column>

			<p:column style="width:15%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.difference.rm']}" />
					<ac:iconTooltip id="summaryPrefMargin#{row}"
						value="#{lbl['lbl.sc.difference.rm.tooltip']}" />
				</f:facet>
				<h:outputLabel value="#{prefQualSupplier.priceDifference}"
					style="text-align:right">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputLabel>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.difference.perc']}"
				style="width:15%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.difference.perc']}" />
					<ac:iconTooltip id="summaryPriceDiff#{row}"
						value="#{lbl['lbl.sc.difference.perc.tooltip']}" />
				</f:facet>
				<h:outputLabel value="#{prefQualSupplier.percentageDifference}"
					style="text-align:right">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputLabel>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.pref.margin']}" style="width:25%">

				<h:outputLabel
					rendered="#{prefQualSupplier.qtEvaluationResult.scQtProposal.proposalAmount.preferenceMargin gt 0}"
					value="#{prefQualSupplier.preferenceMargin}"
					style="text-align:right">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
				</h:outputLabel>


			</p:column>


		</p:dataTable>


	</p:panel>

	<p:spacer height="10px" />
	<table>
		<tr>
			<td style="width: 220px;"><h:outputLabel
					value="#{lbl['lbl.sc.passing.score']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					style="text-align:right" value="#{passingScore}">
				</p:inputText></td>
		</tr>
		<tr>
			<td><h:outputLabel value="#{lbl['lbl.sc.total']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					style="text-align:right"
					value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
		</tr>

	</table>




	<p:panel toggleable="true">
		<f:facet name="header">
			<h:outputText value="#{disQualifiedSupplierListHeader}" />
			<ac:iconTooltip value="#{disQualifiedSupplierListTooltip}" />
		</f:facet>

		<p:dataTable var="disQualifiedSupplier"
			id="evaluationSummaryPreferencemarginDisQualifiedSuppliers"
			value="#{disQualifiedPreferenceList}" rows="10" editable="true"
			lazy="true" rowIndexVar="index" rowKey="#{disQualifiedSupplier}">
			<ac:paginator
				for="evaluationSummaryPreferencemarginDisQualifiedSuppliers" />


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:15%">

				<h:outputText
					value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:10%">
				<h:outputLabel value="#{disQualifiedSupplier.totalScore}"
					style="text-align:right"></h:outputLabel>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.bumiputra.status']}"
				style="width:25%">

				<h:outputText
					value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.bumi ? 'Bumi' : 'Non Bumi'}"></h:outputText>


			</p:column>


		</p:dataTable>


	</p:panel>
	<p:spacer height="10px" />

	<table>

		<tr>
			<td style="width: 220px;"><h:outputLabel
					value="#{lbl['lbl.sc.total']}" /></td>
			<td><p:inputText readonly="true" disabled="true"
					style="text-align:right"
					value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM.rowCount}"></p:inputText></td>
		</tr>

	</table>



</ui:composition>
