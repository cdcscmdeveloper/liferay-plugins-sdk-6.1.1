<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:panel id="onerTierTechnicalOrTecSummarySuppliersQualifiedIdsEvaluation" toggleable="true">
		<f:facet name="header">
			<h:outputText
				value="#{lbl['lbl.sc.eva.technical.presentation.demo.supplier.qualified.list']}" />
		</f:facet>

		<p:dataTable var="qualifiedSupplier" id="oneTierQualifiedSupplier"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10" editable="true" rowIndexVar="index"
			value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"
			lazy="true" rowKey="#{qualifiedSupplier}">
			<ac:paginator for="oneTierQualifiedSupplier" />

			<p:column headerText="#{lbl['lbl.sc.ranking']}"
				style="width:25%;white-space: normal;text-align:right;">

				<h:outputText value="#{qualifiedSupplier.evalRank}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:25%;white-space: normal; text-align:center;">

				<h:outputText
					value="#{qualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}"
				style="width:30%;white-space: normal;text-align:right;">
				<h:outputText value="#{qualifiedSupplier.totalScore}"></h:outputText>
			</p:column>



		</p:dataTable>
		<p:spacer height="10px" />
		<table>
			<tr>
				<td style="width: 230px;"><h:outputLabel
						value="#{lbl['lbl.sc.passing.score']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right" value="#{evaluationBackingBean.managedBean.passingScore}"></p:inputText></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
			</tr>

		</table>

	</p:panel>






	<p:panel id="onerTierTechnicalOrTecSummarySuppliersDisQualifiedIdsEvaluation" toggleable="true">
		<f:facet name="header">
			<h:outputText
				value="#{lbl['lbl.sc.eva.technical.presentation.demo.supplier.not.qualified.list']}" />
		</f:facet>

		<p:dataTable var="disQualifiedSupplier" rows="10"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"
			lazy="true" id="oneTierDisQualifiedSupplier" editable="true"
			rowIndexVar="index" rowKey="#{disQualifiedSupplier}">
			<ac:paginator for="oneTierDisQualifiedSupplier" />

			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:30%;white-space: normal; text-align:center;">

				<h:outputText
					value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}"
				style="width:50%;white-space: normal;text-align:right;">
				<h:outputText value="#{disQualifiedSupplier.totalScore}"></h:outputText>

			</p:column>


		</p:dataTable>

		<p:spacer height="10px" />
		<table>

			<tr>
				<td style="width: 230px;"><h:outputLabel
						value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM.rowCount}"></p:inputText></td>
			</tr>

		</table>


	</p:panel>
<c:if test ="#{evaluationBackingBean.managedBean.scQt.partial ne null and evaluationBackingBean.managedBean.scQt.partial ne 'false'}">	
	<h:panelGroup id="TechnicalOrEvaluationCommitteesummaryNotOfferSuplier">
		<p:panel toggleable="true">
			<f:facet name="header">
			<h:outputText
				value="#{lbl['lbl.sc.eva.not.offer.supplier.list.tec.evaluation.package.stage']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.eva.not.offer.supplier.list.tec.evaluation.package.stage.tooltip']}" />
		   </f:facet>
           <c:if test ="#{evaluationBackingBean.managedBean.scQt.zonal ne 'false'}">
				<p:accordionPanel dynamic="true"
					value="#{evaluationBackingBean.managedBean.evaluationStageZonesSummary}"
					var="zonePnlList">
					<p:ajax event="tabChange"
						listener="#{evaluationBackingBean.evaluationNotOfferSupplierZoneSummaryTabChange}"
						update="@(.evaluationStageSummaryItemtab)" />
					<p:tab title="#{zonePnlList.zoneName}">
						<h:panelGroup styleClass="evaluationStageSummaryItemtab">
							<ui:include src="notOfferSupplierSummary.xhtml"></ui:include>
						</h:panelGroup>
					</p:tab>
				</p:accordionPanel>
			</c:if>
			<c:if test 	="#{evaluationBackingBean.managedBean.scQt.zonal eq 'false'}">				
				<ui:include src="notOfferSupplierSummary.xhtml"></ui:include>
			</c:if>    
		</p:panel>
	</h:panelGroup>
</c:if>
</ui:composition>
