<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<p:panel id="presentationOrDemoItemListPageIds" header="#{lbl['lbl.sc.eva.technical.presentation.demo.item.list']}"
			toggleable="true">
			
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.evaluation.stage.instruction']}" escape="false" />

			<p:dataTable var="technicalEvaluate" id="technicalEvaluation"
				editable="true" rowIndexVar="index"
				first="#{evaluationBackingBean.managedBean.evaluationtechnicalTableRow}"
				rowKey="#{technicalEvaluate}"
				value="#{evaluationBackingBean.managedBean.evaluationStgTechnicalCheckList}">
				<!-- 	<ac:paginator for="technicalEvaluation" /> -->


				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
					style="width:55%;white-space: normal;">

					<h:outputText value="#{technicalEvaluate.title}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
					style="width:15%;white-space: normal;">


					<h:outputText
						value="#{evaluationBackingBean.getStatusDescById(technicalEvaluate.pmStatus.statusId)}"></h:outputText>
						

				</p:column>

				<p:column 
					style="width:10%;text-align: center;">
					
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
				</f:facet>

					<h:panelGroup id="technicalChecklistEditActionView">
						<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
							styleClass="BtnSpacing"
							action="#{evaluationBackingBean.demoSpectechnicalChecklist(index,technicalEvaluate,'T')}"/>
					</h:panelGroup>

				</p:column>

			</p:dataTable>


		</p:panel>	
	</h:panelGroup>
</ui:composition>
