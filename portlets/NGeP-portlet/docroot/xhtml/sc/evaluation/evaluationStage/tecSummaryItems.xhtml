<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.summary.item.instruction']}" escape="false" />
		<p:dataTable var="summaryItem" id="evaluationTechnicalSummaryItem"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			editable="true" value="#{itemList}" rows="10"
			selection="#{evaluationBackingBean.managedBean.singlesummaryItemList}"
			selectionMode="single" rowIndexVar="index" rowKey="#{summaryItem}">

			<ac:paginator for="evaluationTechnicalSummaryItem" />

			<p:ajax event="rowSelect" process="@this" partialSubmit="true"
				update="@form"
				listener="#{evaluationBackingBean.technicalSummaryItemSelect}"></p:ajax>
			<p:column headerText="#{lbl['lbl.sc.item']}"
				style="width:35%;white-space: normal;">

				<h:outputText value="#{summaryItem.tplSpecQuestion.clItem}"></h:outputText>

			</p:column>
		</p:dataTable>
	</p:panel>

	<h:panelGroup id="TechnicalOrEvaluationCommitteesummaryItemQualified">

		<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText
					value="#{lbl['lbl.sc.eva.qualified.supplier.list.tec.evaluation.stage']}" />
				<ac:iconTooltip
					value="#{lbl['lbl.sc.eva.qualified.supplier.list.tec.evaluation.stage.tooltip']}" />
			</f:facet>

			<p:dataTable var="summaryqualSup"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="TechnicalevaluationCommitteeSummaryItemQualifiedSuppliers"
				rows="10"
				value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"
				lazy="true" editable="true" rowIndexVar="index"
				rowKey="#{summaryqualSup}">

				<ac:paginator
					for="TechnicalevaluationCommitteeSummaryItemQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.ranking']}"
					style="text-align:right">

					<h:outputText value="#{summaryqualSup.evalRank}"></h:outputText>
				</p:column>

				<ui:remove><!-- 6906 - start --></ui:remove>
				<ui:param name="isRejected" value="#{not empty summaryqualSup.qtEvaluationResult.scQtProposal.supplierRejectionRemark}" />
				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:20%; text-align:center;">
					<table
						style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
						<tr>
							<td style="text-align: center; border: 0 !important" />
							<td style="text-align: center; border: 0 !important"><h:outputText
									value="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierNo}" />
							</td>
							<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
									show="#{isRejected}" id="remarkId"
									remark="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierRejectionRemark.remark}"
									supplierCode="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierNo}" />
							</td>
						</tr>
					</table>
				<ui:remove><!-- 6906 - end --></ui:remove>
				</p:column>


				<p:column headerText="#{lbl['lbl.sc.total.score']}"
					style="text-align:right">
					<h:outputText value="#{summaryqualSup.totalScore}"></h:outputText>
				</p:column>

				<p:column style="width:25%;white-space: normal;text-align:center;" rendered="#{!evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.rating']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.tec.rating.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{empty summaryqualSup.totalRating? 0: summaryqualSup.totalRating}" />
				</p:column>

			</p:dataTable>
			<p:spacer height="10px" />
			<table>
				<tr>
					<td style="width: 230px;"><h:outputLabel
							value="#{lbl['lbl.sc.passing.score']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right" value="#{passingScore}"></p:inputText></td>
				</tr>

				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
				</tr>

			</table>

		</p:panel>
	</h:panelGroup>

	<h:panelGroup
		id="TechnicalOrEvaluationCommitteesummaryItemDisQualified">
		<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText
					value="#{lbl['lbl.sc.eva.disqualified.supplier.list.tec.evaluation.stage']}" />
				<ac:iconTooltip
					value="#{lbl['lbl.sc.eva.disqualified.supplier.list.tec.evaluation.stage.tooltip']}" />
			</f:facet>

			<p:dataTable var="disQualifiedSupplier"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="TechnicalevaluationCommitteeSummaryItemDisQualifiedSuppliers"
				rows="10"
				value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"
				lazy="true" editable="true" rowIndexVar="index"
				rowKey="#{disQualifiedSupplier}">

				<ac:paginator
					for="TechnicalevaluationCommitteeSummaryItemDisQualifiedSuppliers"></ac:paginator>

				<ui:remove><!-- 6906 - start --></ui:remove>
				<ui:param name="isRejectedDisqualified" value="#{not empty disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierRejectionRemark}"/>
				<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
					<table
						style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
						<tr>
							<td style="text-align: center; border: 0 !important" />
							<td style="text-align: center; border: 0 !important"><h:outputText
									value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}" />
							</td>
							<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
									show="#{isRejectedDisqualified}" id="remarkId"
									remark="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierRejectionRemark.remark}"
									supplierCode="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}" />
							</td>
						</tr>
					</table>
				<ui:remove><!-- 6906 - end --></ui:remove>
				</p:column>

				<ui:remove>#29187 Added width Vinod</ui:remove>
				<p:column headerText="#{lbl['lbl.sc.total.score']}"
					style="width:25%;white-space: normal;text-align:right">
				<ui:remove>#29187 Added width Vinod</ui:remove>
					<h:outputText value="#{disQualifiedSupplier.totalScore}"></h:outputText>
				</p:column>

				<p:column style="width:25%;white-space: normal;text-align:center;" rendered="#{!evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.rating']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.tec.rating.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{empty disQualifiedSupplier.totalRating? 0: disQualifiedSupplier.totalRating}" />
				</p:column>
				<ui:remove>#29187 Start Vinod</ui:remove>	
				<p:column style="width:30%;white-space: normal;text-align:center;" rendered="#{isDisqualified}">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.eva.disqualified.supplier.disqualified']}" />
					</f:facet>
					<h:outputText value="#{evaluationBackingBean.isDisqialifiedByCompliance(disQualifiedSupplier) ? lbl['lbl.sc.eva.disqualified.supplier.disqualified.message'] : ''}"/>
				</p:column>
				<ui:remove>#29187 End Vinod</ui:remove>

			</p:dataTable>
			<p:spacer height="10px" />
			<table>

				<tr>
					<td style="width: 230px;"><h:outputLabel
							value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM.rowCount}"></p:inputText></td>
				</tr>

			</table>

		</p:panel>

	</h:panelGroup>
	<!--#21695 Start FARID -->
	<c:if
		test="#{evaluationBackingBean.managedBean.scQt.partial ne null and evaluationBackingBean.managedBean.scQt.partial ne 'false'}">
		<h:panelGroup
			id="TechnicalOrEvaluationCommitteesummaryNotOfferSuplier">
			<p:panel toggleable="true">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.sc.eva.not.offer.supplier.list.tec.evaluation.item.stage']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.eva.not.offer.supplier.list.tec.evaluation.item.stage.tooltip']}" />
				</f:facet>
				<!-- #32297 related to #21695 COMMAND START-->
				<c:if
					test="#{evaluationBackingBean.managedBean.scQt.zonal ne 'false'}">
					<!-- #32297 related to #21695 COMMAND END-->
					<h:panelGroup styleClass="evaluationStageSummaryItemtab">
						<ui:include src="notOfferSupplierSummary.xhtml"></ui:include>
					</h:panelGroup>
				</c:if>
				<c:if
					test="#{evaluationBackingBean.managedBean.scQt.zonal eq 'null'}">
					<ui:include src="notOfferSupplierSummary.xhtml"></ui:include>
				</c:if>
			</p:panel>
		</h:panelGroup>
	</c:if>
	<!--#21695 End FARID -->
</ui:composition>
