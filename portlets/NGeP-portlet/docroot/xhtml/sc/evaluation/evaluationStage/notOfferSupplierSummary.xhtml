<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

		
				<p:dataTable var="notOfferSupplierTec"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="evaluationCommitteeSummaryNotOfferSupplierTechPackage" rows="10"
				value="#{evaluationBackingBean.managedBean.notOfferSupplierDM}"
				lazy="true" editable="true" rowIndexVar="index"
				rowKey="#{notOfferSupplierTec}">

				<ac:paginator for="evaluationCommitteeSummaryNotOfferSupplierTechPackage"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.eva.not.offer.supplier.number']}"
					style="width:30%; text-align:center;">
					<h:outputText
						value="#{index + 1}"></h:outputText>

				</p:column>
				<ui:remove><!-- 6906 - start, last index reserved for supp reject remark --></ui:remove>
				<ui:param name="lastIndex" value ="#{fn:length(notOfferSupplierTec)-1}" />
				<ui:param name="isRejected" value="#{not empty notOfferSupplierTec[lastIndex]}" />
				<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
					<table
						style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
						<tr>
							<td style="text-align: center; border: 0 !important" />
				 			<td style="text-align: center; border: 0 !important"><h:outputText
									value="#{notOfferSupplierTec[1]}" /> 
							</td>
							<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
									show="#{isRejected}" id="remarkId"
									remark="#{notOfferSupplierTec[lastIndex]}"
									supplierCode="#{notOfferSupplierTec[1]}" />
							</td>
						</tr>
					</table>
				</p:column> 
				<ui:remove><!-- 6906 - end --></ui:remove>
				<ui:remove>//31644 for 29021 - start</ui:remove>
				<p:column style="width:25%;white-space: normal;text-align:center;" rendered="#{evaluationBackingBean.managedBean.financialSummaryView ne 'FI' and !evaluationBackingBean.evaluateWIP(evaluationBackingBean.managedBean.scQt)}"><ui:remove>//32351 for 29021</ui:remove>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.rating']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.tec.rating.tooltip']}" />
					</f:facet>
					<h:outputText value="#{empty notOfferSupplierTec[2] ? 0: notOfferSupplierTec[2]}"/>
				</p:column>
				<ui:remove>//31644 for 29021 - end</ui:remove>
			
			</p:dataTable>
			<p:spacer height="10px" />
			<table>

				<tr>
					<td style="width: 230px;"><h:outputLabel
							value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
					<td><p:inputText readonly="true" disabled="true"
							style="text-align:right"
							value="#{evaluationBackingBean.managedBean.notOfferSupplierDM.rowCount}"></p:inputText></td>
				</tr>

			</table>

		
</ui:composition>
