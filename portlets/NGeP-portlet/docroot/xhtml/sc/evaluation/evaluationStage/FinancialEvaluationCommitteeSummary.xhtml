<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="qualifiedSupplierListHeader" value="#{lbl['lbl.sc.eva.qualified.supplier.list.evaluation.stage']}" />
	<ui:param name="qualifiedSupplierListTooltip" value="#{lbl['lbl.sc.eva.qualified.supplier.list.evaluation.stage.tooltip']}" />
	<ui:param name="disQualifiedSupplierListHeader" value="#{lbl['lbl.sc.eva.disqualified.supplier.list.evaluation.stage']}" />
	<ui:param name="disQualifiedSupplierListTooltip" value="#{lbl['lbl.sc.eva.disqualified.supplier.list.evaluation.stage.tooltip']}" />

	<table>
		<tr>
			<td><h:outputLabel value="#{lbl['lbl.sc.view.by']}" /></td>
			<td><p:selectOneMenu
					value="#{evaluationBackingBean.managedBean.summaryViewBy}">
					<f:selectItems value="#{evaluationBackingBean.recommendationSummaryDropDownValues()}"></f:selectItems>
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{evaluationBackingBean.recommendationsummaryChange}"
						update="@([id$=recommendationviewSummary])"></p:ajax>
				</p:selectOneMenu></td>
		</tr>

	</table>



	<h:panelGroup id="recommendationviewSummary">
		<c:if test	="#{evaluationBackingBean.managedBean.summaryViewBy eq 'RI'}">
			<c:if test ="#{evaluationBackingBean.managedBean.scQt.zonal ne 'false'}">
				<p:accordionPanel dynamic="true"
					value="#{evaluationBackingBean.managedBean.evaluationStageZonesSummary}"
					var="zonePnlList">
					<p:ajax event="tabChange"
						listener="#{evaluationBackingBean.evaluationRecommendationZonessummaryTabChange}"
						update="@(.evaluationstagesummaryItemtab)" />
					<p:tab title="#{zonePnlList.zoneName}">
						<h:panelGroup styleClass="evaluationstagesummaryItemtab">
							<c:if test="#{zonePnlList.zoneName ne null}">
								<ui:param name="itemListId" value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="itemSelectQualifiedId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="itemSelectDisQualifiedId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="qualifiedSupplierItemId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="disQualifiedSupplierItemId"
									value="#{zonePnlList.zoneName}"></ui:param>



							</c:if>

							<c:if test="#{zonePnlList.zoneName eq null}">
								<ui:param name="itemListId" value="itemLst1"></ui:param>
								<ui:param name="itemSelectDisQualifiedId"
									value="supplierItemsdisSelected"></ui:param>
								<ui:param name="qualifiedSupplierItemId"
									value="qualifiedSuppliersZone"></ui:param>
								<ui:param name="disQualifiedSupplierItemId"
									value="disQualifiedSupplierszone"></ui:param>
								<ui:param name="itemSelectQualifiedId"
									value="supplierItemsSelected"></ui:param>

							</c:if>
							<ui:param name="passingScore"
								value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
							<ui:param name="itemList"
								value="#{evaluationBackingBean.managedBean.summaryItemList}"></ui:param>

							<ui:include src="summaryItem.xhtml"></ui:include>
						</h:panelGroup>
					</p:tab>
				</p:accordionPanel>
			</c:if>
			<c:if test 	="#{evaluationBackingBean.managedBean.scQt.zonal eq 'false'}">
				<ui:param name="itemListId" value="itemLstwithoutzone"></ui:param>
				<ui:param name="itemSelectQualifiedId"
					value="itemSupplierQualifiedoutzoneId"></ui:param>
				<ui:param name="itemSelectDisQualifiedId"
					value="itemSupplierDisQualifiedoutzoneId"></ui:param>
				<ui:param name="qualifiedSupplierItemId"
					value="qualifiedSupplierswithOutZone"></ui:param>
				<ui:param name="disQualifiedSupplierItemId"
					value="disQualifiedSupplierswithOutzone"></ui:param>
				<ui:param name="itemList"
					value="#{evaluationBackingBean.managedBean.summaryItemList}"></ui:param>
				<ui:param name="passingScore"
					value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>					
				<ui:include src="summaryItem.xhtml"></ui:include>
			</c:if>
		</c:if>

		<c:if
			test="#{evaluationBackingBean.managedBean.summaryViewBy eq 'RPM'}">

			<c:if 
				test="#{evaluationBackingBean.managedBean.scQt.zonal ne 'false'}">
				<p:accordionPanel dynamic="true"
					value="#{evaluationBackingBean.managedBean.evaluationStageZonesSummary}"
					var="zonePnlList">
					<p:ajax event="tabChange"
						listener="#{evaluationBackingBean.evaluationRecommendationZonessummaryTabChange}"
						update="@(.evaluationstagesummaryPreferenceMargintab)" />
					<p:tab title="#{zonePnlList.zoneName}">
						<h:panelGroup
							styleClass="evaluationstagesummaryPreferenceMargintab">
							<c:if test="#{zonePnlList.zoneName ne null}">
								<ui:param name="qualifiedPreferenceListId"
									value="#{zonePnlList.zoneName}"></ui:param>
								<ui:param name="disQualifiedPreferenceListId"
									value="#{zonePnlList.zoneName}"></ui:param>
							</c:if>

							<c:if test="#{zonePnlList.zoneName eq null}">
								<ui:param name="qualifiedPreferenceListId" value="preference1"></ui:param>
								<ui:param name="disQualifiedPreferenceListId"
									value="preference2"></ui:param>
							</c:if>

							<ui:param name="qualifiedPreferenceList"
								value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"></ui:param>
							<ui:param name="disQualifiedPreferenceList"
								value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"></ui:param>
							<ui:param name="passingScore"
								value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>								
							<ui:include src="summaryPrefernceMargin.xhtml"></ui:include>
						</h:panelGroup>
					</p:tab>
				</p:accordionPanel>
			</c:if>

			<c:if test="#{evaluationBackingBean.managedBean.scQt.zonal eq 'false'}">
				<ui:param name="qualifiedPreferenceListId"
					value="QualifiedPreferenceMarginListId"></ui:param>
				<ui:param name="disQualifiedPreferenceListId"
					value="disQualifiedPreferenceMarginListId"></ui:param>
				<ui:param name="qualifiedPreferenceList"
					value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"></ui:param>
				<ui:param name="disQualifiedPreferenceList"
					value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"></ui:param>
				<ui:param name="passingScore"
					value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>					
				<ui:include src="summaryPrefernceMargin.xhtml"></ui:include>
			</c:if>
		</c:if>
	</h:panelGroup>



</ui:composition>
