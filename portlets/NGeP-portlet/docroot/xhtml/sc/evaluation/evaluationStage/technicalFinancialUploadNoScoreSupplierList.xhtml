<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.supplier.list']}"
		id="technicalFinancialUploadNoActionChecklistNoScoringSupplierListIds"
		toggleable="true">
		<p:dataTable var="complianceTechnicalSupplier" rows="10" lazy="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			id="complianceTechnicalSupplier" editable="true" rowIndexVar="index"
			style="width:100%" rowKey="#{complianceTechnicalSupplier}">
			<ac:paginator for="complianceTechnicalSupplier" />


			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:20%">

				<h:outputText
					value="#{complianceTechnicalSupplier.scQtProposal.supplierNo}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
				<h:outputText></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.submission.status']}"
				style="width:20%">
				<h:outputText
					value="#{evaluationBackingBean.getStatusDescById(complianceTechnicalSupplier.scQtCheckList.pmStatus.statusId)}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.compliance.status']}"
				style="width:15%">
				<h:outputText value="#{complianceTechnicalSupplier.compliance}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.remarks']}" style="width:35%">
				<p:inputTextarea rows="2" cols="40"
					value="#{complianceTechnicalSupplier.remark}" disabled="true"></p:inputTextarea>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
