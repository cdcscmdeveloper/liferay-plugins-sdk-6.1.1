<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:panel header="#{lbl['lbl.sc.item.list']}" toggleable="true"
		>

		<p:dataTable var="summaryItem" id="evaluationSummaryItem"
			editable="true" value="#{itemList}" rows="10"
			selection="#{evaluationBackingBean.managedBean.singlesummaryItemList}"
			selectionMode="single" rowIndexVar="index" rowKey="#{summaryItem}">

			<ac:paginator for="evaluationSummaryItem" />

			<p:ajax event="rowSelect" process="@this" partialSubmit="true"
				update="@form"
				listener="#{evaluationBackingBean.recommendationSummaryItemSelect}"></p:ajax>
			<p:column headerText="#{lbl['lbl.sc.item']}" style="width:35%">

				<h:outputText value="#{summaryItem.tplSpecQuestion.clItem}"></h:outputText>

			</p:column>
		</p:dataTable>
	</p:panel>


	<h:panelGroup id="summaryItemQualified">

		<p:panel toggleable="true" >
			<f:facet name="header">
				<h:outputText value="#{qualifiedSupplierListHeader}" />
				<ac:iconTooltip id="summIteQualify"
					value="#{qualifiedSupplierListTooltip}" />
			</f:facet>

			<p:dataTable var="summaryqualSup"
				id="evaluationSummaryItemQualifiedSuppliers" rows="10"
				value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"
				lazy="true" editable="true" rowIndexVar="index"
				rowKey="#{summaryqualSup}">


				<ac:paginator for="evaluationSummaryItemQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.ranking']}">

					<h:outputLabel value="#{summaryqualSup.evalRank}"
						style="text-align:right"></h:outputLabel>
				</p:column>


				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:30%">

					<h:outputText
						value="#{summaryqualSup.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.total.score']}">
					<h:outputLabel value="#{summaryqualSup.totalScore}"
						style="text-align:right"></h:outputLabel>
				</p:column>

			</p:dataTable>


		</p:panel>


		<p:spacer height="10px" />
		<table>
			<tr>
				<td style="width: 220px;"><h:outputLabel
						value="#{lbl['lbl.sc.passing.score']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right" value="#{passingScore}"></p:inputText></td>
			</tr>

			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.total']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
			</tr>

		</table>

	</h:panelGroup>

	<h:panelGroup id="summaryItemDisQualified">
		<p:panel toggleable="true">
			<f:facet name="header">
				<h:outputText value="#{disQualifiedSupplierListHeader}" />
				<ac:iconTooltip id="summIteDisQualify"
					value="#{disQualifiedSupplierListTooltip}" />
			</f:facet>

			<p:dataTable var="disQualifiedSupplier"
				id="evaluationSummaryItemDisQualifiedSuppliers" rows="10"
				value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"
				lazy="true" editable="true" rowIndexVar="index"
				rowKey="#{disQualifiedSupplier}">

				<ac:paginator for="evaluationSummaryItemDisQualifiedSuppliers"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:30%">

					<h:outputText
						value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.total.score']}">
					<h:outputLabel value="#{disQualifiedSupplier.totalScore}"
						style="text-align:right"></h:outputLabel>
				</p:column>


			</p:dataTable>


		</p:panel>

		<p:spacer height="10px" />
		<table>

			<tr>
				<td style="width: 220px;"><h:outputLabel
						value="#{lbl['lbl.sc.total']}" /></td>
				<td><p:inputText readonly="true" disabled="true"
						style="text-align:right"
						value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM.rowCount}"></p:inputText></td>
			</tr>

		</table>

	</h:panelGroup>
</ui:composition>
