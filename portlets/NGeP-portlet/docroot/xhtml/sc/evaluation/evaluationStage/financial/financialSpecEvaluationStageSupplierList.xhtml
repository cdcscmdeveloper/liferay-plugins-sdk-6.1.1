<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:remove>
		<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
	</ui:remove>
	<p:panel
		id="technicalEvaluationSpecSuppliersTechnicalTemplateSpecSuppliers"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />
			<ui:remove>
				<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
			</ui:remove>
	<c:choose>
	<c:when test="#{evaluationBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}">
						<p:dataTable var="finSpec" editable="true" lazy="true"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="financialSpecEvaluationStage" rows="10"
				value="#{finSpecsupplierList}" rowIndexVar="index"
				style="width:100%" rowKey="#{finSpec}">

				<ac:paginator for="financialSpecEvaluationStage"></ac:paginator>

				<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
					style="width:10%; text-align:center;">

					<h:outputText value="#{finSpec.scQtProposal.supplierNo}"></h:outputText>


				</p:column>
				
			  <p:column headerText="#{lbl['lbl.sc.bumiputra.status']}"
					style="width:10%">
					<h:outputText value="#{evaluationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
																	  		fn:toUpperCase(finSpec.scQtProposal.bumi))}" />
				</p:column> 
				<p:column headerText="#{lbl['lbl.sc.eva.package.offered.price']}"
					style="width:15%;text-align:right;">
					<h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.proposalAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.package.score']}"
					style="width:10%;text-align:right;">
					<h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.totalScore}"></h:outputText>
				</p:column>

				<p:column style="width:15%;text-align:right;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.difference.rm']}" />
						<ac:iconTooltip id="priceDiff#{index}FECSS"
							value="#{lbl['lbl.sc.difference.rm.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.priceDifference}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>

				</p:column>

				<p:column style="width:15%;text-align:right;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.difference.perc']}" />
						<ac:iconTooltip id="prefMargin#{index}FEC"
							value="#{lbl['lbl.sc.difference.perc.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.percentageDifference}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.pref.margin']}"
					style="width:10%;text-align:right;">

					<h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.preferenceMargin}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText>


				</p:column>



				<p:column style="width:15%;text-align: center;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.action']}" />
						
					</f:facet>

					<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
						rendered="#{finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus eq null or finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus.statusId eq '61600'}"
						process="@this"
						action="#{evaluationBackingBean.financialSupplierEvaluate(finSpec,'F')}"
						partialSubmit="true" />
					<p:commandButton value="#{lbl['lbl.btn.view']}"
						rendered="#{finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus ne null and finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus.statusId eq '61601'}"
						process="@this"
						action="#{evaluationBackingBean.financialSupplierEvaluate(finSpec,'F')}"
						partialSubmit="true" />
				</p:column>
			</p:dataTable>
	</c:when>
	<c:otherwise>
	<p:dataTable var="finSpec" editable="true" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			id="financialSpecEvaluationStage" rows="10"
			value="#{finSpecsupplierList}" rowIndexVar="index" style="width:100%"
			rowKey="#{finSpec}">

			<ac:paginator for="financialSpecEvaluationStage"></ac:paginator>
			<ui:remove><!-- 6906 - start --></ui:remove>
			<ui:param name="isRejected" value="#{not empty finSpec.scQtProposal.supplierRejectionRemark}"/>
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}" style="width:20%; text-align:center;">
				<table style="table-layout: fixed; margin:auto !important; max-width:90px !important">
					<tr>
						<td style="text-align:center; border: 0 !important"/>
						<td style="text-align:center; border: 0 !important">
							<h:outputText value="#{finSpec.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align:center; border: 0 !important"> 
							<ac:iconRejectRemarkBox show="#{isRejected}" id="remarkId"
							remark="#{finSpec.scQtProposal.supplierRejectionRemark.remark}" 
							supplierCode="#{finSpec.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
			<ui:remove><!-- 6906 - end --></ui:remove>
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}"
				style="width:20%;text-align:right;"
				rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<h:outputText value="#{finSpec.specAutoScore}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.user.score']}"
				style="width:20%;text-align:right;"
				rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<h:outputText value="#{finSpec.specUserScore}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.total.score']}" style="width:20%;text-align:right;"
				rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}">
				<h:outputText value="#{finSpec.specTotalScore}"></h:outputText>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.action']}" style="width:20%;text-align:center;">  
			        <p:commandButton value="#{lbl['lbl.btn.evaluate']}"
						rendered="#{finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus eq null or finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus.statusId eq '61600'}"
						process="@this"
						action="#{evaluationBackingBean.financialSupplierEvaluate(finSpec,'F')}"
						partialSubmit="true" 
						disabled="#{isRejected}"/> <ui:remove><!-- 6906 --></ui:remove>
					<p:commandButton value="#{lbl['lbl.btn.view']}"
						rendered="#{finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus ne null and finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus.statusId eq '61601'}"
						process="@this"
						action="#{evaluationBackingBean.financialSupplierEvaluate(finSpec,'F')}"
						partialSubmit="true" 
						disabled="#{isRejected}"/>  <ui:remove><!-- 6906 --></ui:remove>
				</p:column>
		</p:dataTable>
	</c:otherwise>
	</c:choose>
<ui:remove>
	<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
</ui:remove>		
	</p:panel>
</ui:composition>
