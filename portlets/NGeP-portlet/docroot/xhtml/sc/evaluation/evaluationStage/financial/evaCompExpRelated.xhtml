
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dataTable id="#{cmpExpPrcNonPrc}" rowIndexVar="index" lazy="true"
		var="experience" value="#{cmpExpProcNonProcList}" rows="10"
		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		rowKey="#{experience}" style="width:100%">

		<ac:paginator for="#{cmpExpPrcNonPrc}"></ac:paginator>

		<p:column style="width:10%;white-space: normal;word-wrap: break-word;"
			headerText="#{lbl['lbl.sm.projDtls.clientName']}">


			<h:outputText
				value="#{experience.pmOrgProfile.pmOrgValidity.orgName}"
				rendered="#{SourcingConstants.FINANCIAL_GOVERNMENT_COMPANY_EXPERIENCE eq docDefinationKey}" />
			<h:outputText value="#{experience.clientName}"
				rendered="#{SourcingConstants.FINANCIAL_NONGOVERNMENT_COMPANY_EXPERIENCE eq docDefinationKey}" />
		</p:column>
		<p:column style="width:20%;"
			headerText="#{lbl['lbl.sc.fin.prc.proj.cont.title']}">
			<h:outputText value="#{experience.contractTitle} "
				style="white-space: normal;word-wrap: break-word;" />
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.file.ref.no']}">
			<h:outputText value="#{experience.fileRefrenceNo} " />
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.letter.accept.no']}">

			<p:commandLink process="@this" styleClass="commandLink_link"
				action="#{evaluationBackingBean.viewLOADetailsPage(experience, view.viewId)}"
				rendered="#{experience.loaNo ne null and isTerminated}"
				partialSubmit="true">
				<h:outputText escape="false"
					value="#{evaluationBackingBean.getLabelContent(experience.loaNo)}" />
			</p:commandLink>
			<h:outputText escape="false"
				rendered="#{experience.loaNo ne null and !isTerminated}"
				value="#{evaluationBackingBean.getLabelContent(experience.loaNo)}" />
			<h:outputText rendered="#{experience.loaNo eq null}"
				value="#{evaluationBackingBean.getLabelContent(experience.loaNo)}" />

		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.eff.date']}">
			<h:outputText value="#{experience.effectiveDate}">
				<f:convertDateTime
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.exp.date']}">
			<h:outputText value="#{experience.expiryDate}">
				<f:convertDateTime
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
			</h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;"
			headerText="#{lbl['lbl.sc.fin.cont.value.amt']}">
			<h:outputText value="#{experience.contractAmt}">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</h:outputText>


		</p:column>
		<p:column style="width:10%;white-space: normal;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.cont.status']}" />
				<ac:iconTooltip value="#{lbl['lbl.sc.fin.cont.status.tooltip']}" />
			</f:facet>
			<ui:param name="contractStatusType"
				value="#{evaluationBackingBean.checkContractStatusType(experience.contractStatus,isTerminated)}"></ui:param>
			<p:commandLink id="#{cmpExpPrcNonPrc}Terminate" process="@this"
				styleClass="commandLink_link" partialSubmit="true"
				update="@([id$=contractTermPnlGrpId])"
				oncomplete="contractTerminationPopUp.show();return false;"
				rendered="#{contractStatusType}">
				<f:setPropertyActionListener
					target="#{evaluationBackingBean.managedBean.ctContractVer}"
					value="#{evaluationBackingBean.retrieveContractVerTerminationDtls(experience.loaNo)}">
				</f:setPropertyActionListener>
				<h:outputText
					value="#{evaluationBackingBean.checkContractStatusLabel(experience.contractStatus)}"
					escape="false"></h:outputText>
				<p:tooltip for="#{cmpExpPrcNonPrc}Terminate">
					<p:outputLabel escape="false"
						value="#{lbl['lbl.sc.comp.exp.eva.terminated.mouse.over.tooltip']}" />
				</p:tooltip>
			</p:commandLink>
			<h:outputText
				value="#{evaluationBackingBean.checkContractStatusLabel(experience.contractStatus)}"
				rendered="#{!contractStatusType}"></h:outputText>
		</p:column>
		<p:column style="width:10%;white-space: normal;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.fin.letter.of.acceptance']}" />
				<ac:iconTooltip escape="false"
					value="#{lbl['lbl.sc.fin.letter.of.acceptance.tooltip']}" />
			</f:facet>
			<p:commandButton icon="ui-icon-download"
				rendered="#{evaluationBackingBean.loaReportCheck(experience)}"
				ajax="false"
				style="background-color:transparent !important; border:0px none;"
				action="#{evaluationBackingBean.downloadCompExpLOAReports(experience)}">
			</p:commandButton>

			<h:outputText value="#{evaluationBackingBean.getLabelContent(' ')}"
				rendered="#{!evaluationBackingBean.loaReportCheck(experience)}"></h:outputText>


		</p:column>
	</p:dataTable>
</ui:composition>
