<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<p:panel id="evaluationStageFinancialChecklistMainPage" header="#{lbl['lbl.sc.financial.proposal']}"
			toggleable="true">
			
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.evaluation.stage.instruction']}" escape="false" />

			<p:dataTable var="financialEval" id="financialEvaluation"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				first="#{evaluationBackingBean.managedBean.evaluationfinancialTableRow}"
				value="#{evaluationBackingBean.managedBean.evaluationStgfinancialCheckList}"
				editable="true" rowIndexVar="index" rowKey="#{financialEval}">
				


				<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
					style="width:55%;white-space: normal;">

					<h:outputText value="#{financialEval.title}"></h:outputText>


				</p:column>
				<p:column style="width:20%;white-space: normal;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.type']}" />
						<ac:iconTooltip  id="type#{index}FEC" value="#{lbl['lbl.sc.type.financial.tooltip']}" />
					</f:facet>

					<h:outputText
						value="#{evaluationBackingBean.getParameterDesc(financialEval.definationType)}"></h:outputText>


				</p:column>

				<p:column headerText="#{lbl['lbl.sc.evalvation.status']}"
					style="width:15%;white-space: normal;">


					<h:outputText
						value="#{evaluationBackingBean.getStatusDescById(financialEval.pmEvalStatus.statusId)}"></h:outputText>

				</p:column>
				<p:column 
					style="width:10%;text-align: center;">
					<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
					<ac:iconTooltip id="actionfinancialEvaluatio#{index}FECSSLOT"
							value="#{lbl['lbl.sc.action.evaluation.tooltip']}" />
				</f:facet>
					<ui:fragment rendered="#{financialEval.scoringReq eq 'false'}">
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.viewfinacialEvaluation(financialEval,index,'EF')}" />
					</ui:fragment>
					<ui:fragment rendered="#{financialEval.scoringReq ne 'false' and  (null ne financialEval.pmEvalStatus and financialEval.pmEvalStatus.statusId eq '60450')}">
						<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.evaluatefinancialEvaluation(financialEval,index,'EF')}" />
					</ui:fragment>
					
					<ui:fragment rendered="#{financialEval.scoringReq ne 'false' and  (null ne financialEval.pmEvalStatus and financialEval.pmEvalStatus.statusId eq '60451')}">
						<p:commandButton value="#{lbl['lbl.btn.view']}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.evaluatefinancialEvaluation(financialEval,index,'EF')}" />
					</ui:fragment>


				</p:column>

			</p:dataTable>


		</p:panel>
	</h:panelGroup>


</ui:composition>
