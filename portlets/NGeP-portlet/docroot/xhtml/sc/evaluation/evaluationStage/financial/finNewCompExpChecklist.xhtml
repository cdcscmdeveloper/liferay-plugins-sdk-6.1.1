<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
		<h:panelGroup id="newCompExpMainPnlGrop">

			<p:blockUI block=":form" widgetVar="blockWidget">
				<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
			</p:blockUI>
			<p:messages id="finNewCompExpMsgId" autoUpdate="true" closable="true"
				showDetail="true" showSummary="false" severity="error, info"></p:messages>
			<h:panelGroup id="newCompExpBtnPnlGrop">
				<table width="100%" class="BtnSpacing">
					<tr>
						<td align="right"><p:commandButton
								value="#{lbl['lbl.btn.back']}" style="float:left;"
								immediate="true"
								action="#{evaluationBackingBean.financialBackaction}" /> <ui:param
								name="checklistScoreType"
								value="#{evaluationBackingBean.managedBean.checklistScoreType}"></ui:param>
							<ui:param name="technicalorFinancialReEvaluateRequired"
								value="#{ evaluationBackingBean.managedBean.technicalOrFinancialReEvaluateRequired}"></ui:param>
							<p:commandButton value="#{lbl['lbl.btn.save']}"
								rendered="#{SourcingConstants.USER_SCORE  eq checklistScoreType
		                        and empty evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierRejectionRemark}"
								disabled="#{evaluationBackingBean.managedBean.readOnly or technicalorFinancialReEvaluateRequired}"
								style="float:right;" update="@all" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();"
								action="#{evaluationBackingBean.saveProposalScoreDtls}" /></td>
					</tr>
				</table>
			</h:panelGroup>

			<ui:include src="/xhtml/sc/evaluation/evaluationHeader.xhtml" />

			<h:panelGroup id="newSuppCompExpHdrGroup">
				<p:panel id="newCompExpSuppHdrPnl" toggleable="true"
					header="#{lbl['lbl.sc.eva.financial.proposal.evaluation']}">
					<ui:include
						src="/xhtml/sc/evaluation/evaluationStage/supplierChecklistHeader.xhtml" />
				</p:panel>
			</h:panelGroup>

			<h:panelGroup id="compPlnGroupId">
				<p:panel header="#{lbl['lbl.sc.compliance.list']}" toggleable="true"
					id="newCompExpCompListPnl" collapsed="true">
					<h:outputText styleClass="instruction"
						value="#{lbl['lbl.sc.eva.evaluation.stage.document.instruction']}"
						escape="false" />

					<p:dataTable var="compList" id="newCompExpCompDtlId" rows="10"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{evaluationBackingBean.managedBean.evaluationComplianceList}"
						rowIndexVar="index" style="width:100%" rowKey="#{compList}">
						<ac:paginator for="newCompExpCompDtlId" />


						<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
							style="width:90%;white-space: normal;">
							<h:outputText value="#{compList.scQtCheckList.title}"></h:outputText>
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.document']}" style="width:10%">
							<h:commandLink immediate="true"
								rendered="#{compList.scQtProposalChecklistAttachment ne null}"
								action="#{evaluationBackingBean.downloadEncryptedFile(compList.scQtProposalChecklistAttachment)}">
								<h:graphicImage value="/css/images/design/icon_txt.png" />
							</h:commandLink>

						</p:column>

					</p:dataTable>

				</p:panel>
			</h:panelGroup>

			<h:panelGroup id="compExpPageIncldgrop">
				<ui:param name="statusHide"
					value="#{evaluationBackingBean.managedBean.statusHide}"></ui:param>
				<ui:param name="profileHide"
					value="#{evaluationBackingBean.managedBean.profileHide}"></ui:param>
				<ui:param name="checklistScoreType"
					value="#{evaluationBackingBean.managedBean.checklistScoreType}"></ui:param>
				<ui:param name="noOfContracts"
					value="#{evaluationBackingBean.managedBean.noOfContractsProposalScore}"></ui:param>

				<ui:param name="docDefinationKey"
					value="#{evaluationBackingBean.managedBean.docDefinitionKey}"></ui:param>
				<ui:param name="contractUserScore"
					value="#{evaluationBackingBean.managedBean.userScores}"></ui:param>

				<ui:include
					src="#{evaluationBackingBean.managedBean.evaluationPage}"></ui:include>

				
			</h:panelGroup>

		</h:panelGroup>
	</ui:define>
</ui:composition>
