<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>





	<h:panelGroup>
		<p:panel header="#{lbl['lbl.sc.supplier.list']}"
			id="evaluationStageFinancialSpecsFinancialSupplierListsDatatableIds#{evaluationBackingBean.managedBean.specZoneTabIndex}"
			toggleable="true">
			<!-- <h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
				escape="false" /> -->
				
				<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.eva.evaluation.financial.spec.offer.price.supplier.list']}"
				escape="false" />

			<p:dataTable var="finSpec" editable="true" lazy="true"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="financialSpecEvaluationStage" rows="10"
				value="#{finSpecsupplierList}" rowIndexVar="index"
				style="width:100%" rowKey="#{finSpec}">

				<ac:paginator for="financialSpecEvaluationStage"></ac:paginator>
				<!-- ahmaa-#25138 - start -->
				 <p:columnGroup type="header">  
			        <p:row>  
			            <p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:10%; text-align:center;"/>
			           	<p:column rowspan="2" headerText="#{lbl['lbl.sc.bumiputra.status']}" style="width:10%"/>
			           	<p:column rowspan="2" headerText="#{lbl['lbl.sc.eva.package.offered.price']}" style="width:15%;text-align:center;"/>    
			            <p:column colspan="2" headerText="#{lbl['lbl.sc.eva.package.score']}" style="width:10%;text-align:center;"/>  
			       		<p:column rowspan="2" style="width:15%; text-align:right;">
			       			<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.difference.rm']}" />
								<ac:iconTooltip id="priceDiff#{index}FECSS"
									value="#{lbl['lbl.sc.difference.rm.tooltip']}" />
							</f:facet>
			       		</p:column>
			       		<p:column rowspan="2" style="width:15%;text-align:right;">
				       		<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.difference.perc']}" />
								<ac:iconTooltip id="prefMargin#{index}FEC"
									value="#{lbl['lbl.sc.difference.perc.tooltip']}" />
							</f:facet>
			       		</p:column>
			       		<p:column rowspan="2" headerText="#{lbl['lbl.sc.pref.margin']}" style="width:10%;text-align:right;"/>
			       		<p:column rowspan="2" headerText="#{lbl['lbl.sc.action']}" style="width:10%;text-align:center;">
			       		</p:column>  
			        </p:row>  
			  
			        <p:row>  
			            <p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}" style="width:50%;text-align:center;"
						rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"/>  
			            <p:column style="width:50%;text-align:center;">
				            <f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"/>
							</f:facet>
			            </p:column>  
			        </p:row>  
			  
			    </p:columnGroup>  
				
				<p:column>  
			        <h:outputText value="#{finSpec.scQtProposal.supplierNo}"/>  
			    </p:column>
			    
			    <p:column>  
			        <h:outputText value="#{evaluationBackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, 
						fn:toUpperCase(finSpec.scQtProposal.bumi))}"/>  
			    </p:column>
			    
			    <p:column>  
			        <h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.proposalAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText> 
			    </p:column>
			    
			    <p:column>  
			        <h:outputText rendered="#{evaluationBackingBean.managedBean.offerScoreType eq '1'}" 
			        type="hidden" value="#{finSpec.totalAutoScore}"></h:outputText> 
			    </p:column>
			    
			    <p:column>
			        <p:inputText rendered="#{evaluationBackingBean.managedBean.offerScoreType eq '2'}" 
			        	readonly="true" disabled="true" id="userScore" 
			        	style="text-align:right;" maxlength="16" size="2" required="true"
			        	value="#{finSpec.totalUserScore}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
			        </p:inputText>
			        <h:outputText rendered="#{evaluationBackingBean.managedBean.offerScoreType eq '2'}"
			        	style="text-align:left;"
						value="/ #{evaluationBackingBean.managedBean.withInVarieance}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText> 	
			    </p:column>
			    
			    <p:column>  
			        <h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.priceDifference}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText> 
			    </p:column>
			    
			    <p:column>  
			        <h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.percentageDifference}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText> 
			    </p:column>     
				
				<p:column>  
			        <h:outputText
						value="#{finSpec.scQtProposal.proposalAmount.preferenceMargin}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_PERCENTAGE)}" />
					</h:outputText> 
			    </p:column>
			    
			    <p:column>  
			        <p:commandButton value="#{lbl['lbl.btn.evaluate']}"
						rendered="#{finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus eq null or finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus.statusId eq '61600'}"
						process="@this"
						action="#{evaluationBackingBean.financialSupplierEvaluate(finSpec,'F')}"
						partialSubmit="true" />
					<p:commandButton value="#{lbl['lbl.btn.view']}"
						rendered="#{finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus ne null and finSpec.scQtProposal.proposalAmount.pmSpecEvalStatus.statusId eq '61601'}"
						process="@this"
						action="#{evaluationBackingBean.financialSupplierEvaluate(finSpec,'F')}"
						partialSubmit="true" />
				</p:column><!-- ahmaa-#25138 - end -->
			</p:dataTable>
		</p:panel>
	</h:panelGroup>




</ui:composition>
