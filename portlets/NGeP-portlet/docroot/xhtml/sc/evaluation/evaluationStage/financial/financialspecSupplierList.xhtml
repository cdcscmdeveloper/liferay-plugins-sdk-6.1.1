<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="resourceSection">
	</ui:define>





	<h:panelGroup>
		<p:panel header="#{lbl['lbl.sc.supplier.list']}"
			id="evaluationStageFinancialSpecsFinancialSupplierListsDatatableIds#{evaluationBackingBean.managedBean.specZoneTabIndex}"
			toggleable="true">
			<!-- <h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
				escape="false" /> -->
				
				<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.eva.evaluation.financial.spec.offer.price.supplier.list']}"
				escape="false" />

			<p:dataTable var="finSpec" editable="true" lazy="true"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				id="financialSpecEvaluationStage"
				value="#{evaluationBackingBean.managedBean.financialPackagePaginator.model}"
				style="width:100%; margin-bottom: -1px;">

				<!-- ahmaa-#25138 - start -->
				 <p:columnGroup type="header">  
			        <p:row>  
						<ui:remove><!-- 6906 - start --></ui:remove> 
						<p:column rowspan="2" headerText="#{lbl['lbl.sc.supplier.code']}" style="width:10%; text-align:center;"/><ui:remove>6906</ui:remove>
						<ui:remove><!-- 6906 - end --></ui:remove>		           	
			           	<p:column rowspan="2" headerText="#{lbl['lbl.sc.eva.package.offered.price']}" style="width:15%;text-align:center;"/>    
			            <p:column colspan="2" headerText="#{lbl['lbl.sc.eva.package.score']}" style="width:10%;text-align:center;"/>  
			       		
			        </p:row>  
			  
			        <p:row>  
			            <p:column headerText="#{lbl['lbl.tpl.spec.content.system.score']}" style="width:20%;text-align:center;"
						rendered="#{evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"/>  
			            <p:column style="width:20%;text-align:center;">
				            <f:facet name="header">
								<h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"/>
							</f:facet>
			            </p:column>  
			        </p:row>  
			  
			    </p:columnGroup>  
				
				<ui:remove><!-- 6906 - start --></ui:remove>
				<ui:param name="isRejected" value="#{not empty finSpec.supplierRejectionRemark}"/>
				<p:column style="width:20%; text-align:center;">
					<table
						style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
						<tr>
							<td style="text-align: center; border: 0 !important" />
							<td style="text-align: center; border: 0 !important"><h:outputText
									value="#{finSpec.scQtProposal.supplierNo}" /></td>
							<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
									show="#{isRejected}" id="remarkId"
									remark="#{finSpec.supplierRejectionRemark.remark}"
									supplierCode="#{finSpec.scQtProposal.supplierNo}" /></td>
						</tr>
					</table>
					<ui:remove><!-- 6906 - end --></ui:remove>
				</p:column>
			    
			    <p:column>  
			        <h:outputText
						value="#{finSpec.proposalAmt}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText> 
			    </p:column>
			    
			    <p:column>  
			        <h:outputText partialSubmit="true" rendered="#{evaluationBackingBean.managedBean.offerScoreType eq '1'}" style="text-align:centre;"
			         value="#{finSpec.totalScore}"></h:outputText> 
			    </p:column>
			    
			    <p:column>
			    	<ui:remove>
						Bug #28312
						ADDED : disabled="#{evaluationBackingBean.managedBean.readOnly}
					</ui:remove>
					<ui:remove><!-- 6906 - add disabled if isRejected --></ui:remove>
			        <p:inputText partialSubmit="true" disabled="#{evaluationBackingBean.managedBean.readOnly or isRejected}" rendered="#{evaluationBackingBean.managedBean.offerScoreType eq '2'}" 
			        	id="userScore" label="#{lbl['lbl.tpl.spec.content.user.score']}" style="text-align:right;" maxlength="16" size="2"
			        	value="#{finSpec.totalScore}">
			        	<ui:remove><!-- #34835 remove required --></ui:remove>
						<ac:validateNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" maxIntegerDigits="14" integerOnly="true" /><!-- -#32458 - start -->
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{(evaluationBackingBean.managedBean.withInVarieance*1).toString()}" /><!-- -#32458 - start -->
						<p:ajax event="change" partialSubmit="true" process="@this"  update="@this,@([id$=finacialpackageuserScoreMsg])"/><!-- -#32458 - start -->											
			        </p:inputText>
			        <h:outputText rendered="#{evaluationBackingBean.managedBean.offerScoreType eq '2'}"
			        	style="text-align:left; "
						value="/ #{evaluationBackingBean.managedBean.withInVarieance}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>	
					<p:message id="finacialpackageuserScoreMsg" for="userScore" display="icon" /><!-- -#32458 - start -->
			    </p:column>
			    
			</p:dataTable>
			<ac:detachablePaginator loopId="financialSpecEvaluationStage" paginatorObject="#{evaluationBackingBean.managedBean.financialPackagePaginator}" />
		</p:panel>
	</h:panelGroup>




</ui:composition>
