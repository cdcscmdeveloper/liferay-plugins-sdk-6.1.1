<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup id="govtotalContractAmount">
		<ui:param name="scoringPnlId" value="govcontractorAmountId" />
		<ui:param name="scoringList"
			value="#{evaluationBackingBean.managedBean.technicalGovNoOfContracts}"></ui:param>
		<ui:param name="scoringPnlName"
			value="#{lbl['lbl.sc.eva.cmpny.score.tot.supplier.financial.information']}"></ui:param>

		<table style="width: 30%">
			<tr>
				<td style="width: 90px;"><ui:fragment
						rendered="#{checklistScoreType eq '2' and !pageDisable}">
						<h:outputText value="* " styleClass="mandatory" />
					</ui:fragment> <h:outputText value="#{lbl['lbl.tpl.spec.content.user.score']}"
						rendered="#{checklistScoreType eq '2'}" /></td>
				<td><p:inputText value="#{noOfContracts.userScore}"
						id="financialSupplierInfoUserScoreId"
						label="#{lbl['lbl.tpl.spec.content.user.score']}" required="true"
						maxlength="18" disabled="#{pageDisable}" style="text-align:right"
						rendered="#{ checklistScoreType eq '2'}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}"
							maxIntegerDigits="14" integerOnly="true" />
						<f:attribute name="min" value="0" />
						<f:attribute name="max" value="#{contractUserScore}" />
					</p:inputText> <p:spacer width="5"></p:spacer> <h:outputText
						value="/#{contractUserScore}"
						rendered="#{ checklistScoreType eq '2'}" /> <p:message
						id="financialSupplierInfoUserScoreMessage"
						for="financialSupplierInfoUserScoreId" display="icon"></p:message>
				</td>
			</tr>
		</table>

		<ui:include src="/xhtml/sc/evaluation/evaluationStage/evaluationScoring.xhtml"></ui:include>
	</h:panelGroup>


</ui:composition>
