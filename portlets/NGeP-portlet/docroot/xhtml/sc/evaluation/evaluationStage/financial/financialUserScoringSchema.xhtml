<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel
		header="#{lbl['lbl.sc.spec.technical.financial.user.scoring.schema']}"
		rendered="#{evaluationBackingBean.managedBean.scQt.financialUserScoringSchemaAttachment ne null and evaluationBackingBean.managedBean.financialUserScoringSchema}"
		toggleable="true"
		id="financialevaluationAllChecklistUserScoringSchemasIds">
		<table border="0" cellspacing="0" cellpadding="0">
			<tr>
			<td><p:outputLabel
						value="#{lbl['lbl.txt.file.download']}" /></td>
				<td><h:commandLink
						value="#{evaluationBackingBean.managedBean.scQt.financialUserScoringSchemaAttachment.fileName}"
						styleClass="blue_font" immediate="true"
						action="#{evaluationBackingBean.downloadFile(evaluationBackingBean.managedBean.scQt.financialUserScoringSchemaAttachment)}" />

				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
