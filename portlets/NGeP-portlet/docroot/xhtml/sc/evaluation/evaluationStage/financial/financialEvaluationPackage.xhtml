<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<p:panel id="evaluationStageFinancialChecklistMainPage" header="#{lbl['lbl.sc.financial.proposal']}"
			toggleable="true">
			
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.eva.evaluation.stage.instruction']}" escape="false" />
			
 			<p:panelGrid style="margin-bottom: 0 !important; width: 100% !important;" id="panelGridId">
				<f:facet name="header">
					<p:row>
						<p:column style="width:55%;white-space: normal;font-family: Arial;font-weight: bold !important;">#{lbl['lbl.sc.spec.checklist.title']}</p:column>
						<p:column style="width:20%;white-space: normal;font-family: Arial;font-weight: bold !important;">#{lbl['lbl.sc.type']}
							<ac:iconTooltip id="type#{row}TEC" value="#{lbl['lbl.sc.type.technical.tooltip']}" />
						</p:column>
						<p:column style="width:15%;white-space: normal;font-family: Arial;font-weight: bold !important;">#{lbl['lbl.sc.evalvation.status']}</p:column>
						<p:column style="width:10%;text-align: center;font-family: Arial;font-weight: bold !important;">#{lbl['lbl.sc.action']}
							<ac:iconTooltip id="technicalEvaluationChecklistaction#{index}TSSOTSP"
								value="#{lbl['lbl.sc.action.evaluation.view.tooltip']}" />
						</p:column>	
					</p:row>
				</f:facet>
				<c:forEach var="reasonGroup" items="#{evaluationBackingBean.managedBean.getDetachedPaginator().getModel()}">
					<c:forEach var="financialEval" items="#{reasonGroup}" varStatus="st">
						<p:row rendered="#{st.index lt reasonGroup.size()}">
							<p:column style="width:55%;white-space: normal;">
								<h:outputText value="#{financialEval.title}"></h:outputText>
							</p:column>
							<p:column style="width:20%;white-space: normal;">
								<h:outputText value="#{evaluationBackingBean.getParameterDesc(financialEval.definationType)}">
								</h:outputText>
							</p:column>
							<p:column style="width:15%;white-space: normal;">
								<h:outputText value="#{evaluationBackingBean.getStatusDescById(evaluationBackingBean.managedBean.evalStatus)}"></h:outputText>
							</p:column>
							<p:column style="width:10%;text-align: center;"
								rowspan="#{reasonGroup.size()}" rendered="#{st.index==0}">		
								<ui:fragment rendered="#{financialEval.scoringReq ne false and  (evaluationBackingBean.managedBean.evalStatus ne null and evaluationBackingBean.managedBean.evalStatus eq '60451')}"
								align="center">
									<p:commandButton value="#{lbl['lbl.btn.view']}"
										process="@this" partialSubmit="true"
										action="#{evaluationBackingBean.evaluatefinancialEvaluationPackage(financialEval,index,'EF')}" />
								</ui:fragment>
								<ui:fragment rendered="#{(financialEval.scoringReq ne false and evaluationBackingBean.managedBean.offerScoreType eq '2') and (evaluationBackingBean.managedBean.evalStatus eq null or evaluationBackingBean.managedBean.evalStatus ne '60451')}"
								align="center">
									<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
										process="@this" partialSubmit="true"
										action="#{evaluationBackingBean.evaluatefinancialEvaluationPackage(financialEval,index,'EF')}" />
								</ui:fragment>
								
							</p:column>
						</p:row>
					</c:forEach>
					<c:forEach var="financialEvaluate" items="#{evaluationBackingBean.managedBean.getDetachedPaginatorTest().getModel()}" rowIndexVar="index">
						<p:row>
							<p:column style="width:55%;white-space: normal;">
								<h:outputText value="#{financialEvaluate.title}"></h:outputText>
							</p:column>
							<p:column style="width:20%;white-space: normal;">
								<h:outputText value="#{evaluationBackingBean.getParameterDesc(financialEvaluate.definationType)}">
								</h:outputText>
							</p:column>
							<p:column style="width:15%;white-space: normal;">
								<h:outputText value="#{evaluationBackingBean.getStatusDescById(financialEvaluate.pmEvalStatus.statusId)}"></h:outputText>
							</p:column>
							<p:column style="width:10%;text-align: center;" >		
								<ui:fragment>
									<p:commandButton value="#{lbl['lbl.btn.view']}"
										process="@this" partialSubmit="true"
										action="#{evaluationBackingBean.evaluatefinancialEvaluation(financialEvaluate,index,'EF')}" />
								</ui:fragment>
								
							</p:column>
						</p:row>
					</c:forEach>				
				</c:forEach>
			</p:panelGrid>
			
		</p:panel>
	</h:panelGroup> 


</ui:composition>
