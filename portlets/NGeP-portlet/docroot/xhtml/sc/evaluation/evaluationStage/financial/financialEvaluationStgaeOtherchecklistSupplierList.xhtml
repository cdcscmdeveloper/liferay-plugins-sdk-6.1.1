<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel
		id="evaluationStageAllOtherCheckListLikeSupplierInfopaidupCapitalAssetsLiabilitysCompanyPrivateGovSuppliersListDataTableids"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.eva.evaluation.supplier.list.instruction']}"
			escape="false" />

		<p:dataTable var="othersFinList" id="othersFinListId" editable="true"
			rows="10" lazy="true"
			value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckListDM}"
			rowIndexVar="index" style="width:100%" rowKey="#{othersFinList}">
			<ac:paginator for="othersFinListId" />
			<ui:remove><!-- 6906 - start --></ui:remove>
			<ui:param name="isRejected" value="#{not empty othersFinList.scQtProposal.supplierRejectionRemark}" />
			<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
				style="width:20%; text-align:center;">
				<table
					style="table-layout: fixed; margin: auto !important; max-width: 90px !important">
					<tr>
						<td style="text-align: center; border: 0 !important" />
						<td style="text-align: center; border: 0 !important"><h:outputText
								value="#{othersFinList.scQtProposal.supplierNo}" />
						</td>
						<td style="text-align: center; border: 0 !important"><ac:iconRejectRemarkBox
								show="#{isRejected}" id="remarkId"
								remark="#{othersFinList.scQtProposal.supplierRejectionRemark.remark}"
								supplierCode="#{othersFinList.scQtProposal.supplierNo}" />
						</td>
					</tr>
				</table>
			</p:column>
			<ui:remove><!-- 6906 - end --></ui:remove>
			<p:column headerText="#{lbl['lbl.sc.total.score']}" rendered="#{evaluationBackingBean.managedBean.isScoringReq}"
				style="width:25%;text-align:right;">
				<h:outputText value="#{othersFinList.totalScore}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.evalvation.status']}" rendered="#{evaluationBackingBean.managedBean.isScoringReq}"
				style="width:25%">


				<h:outputText
					value="#{evaluationBackingBean.getStatusDescById(othersFinList.evaluationStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column style="width:30%;text-align: center;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.action']}" />
					
				</f:facet>

				<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
					rendered="#{othersFinList.evaluationStatus.statusId eq '61600'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.financialSupplierEvaluate(othersFinList,'F')}"/>
				<p:commandButton value="#{lbl['lbl.btn.view']}"
					rendered="#{othersFinList.evaluationStatus.statusId eq '61601'}"
					process="@this" partialSubmit="true"
					action="#{evaluationBackingBean.financialSupplierEvaluate(othersFinList,'F')}"/>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
