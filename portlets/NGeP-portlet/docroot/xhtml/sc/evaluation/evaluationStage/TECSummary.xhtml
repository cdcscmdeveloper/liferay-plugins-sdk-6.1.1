<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #33178 start -->
	<!-- #33174 start enable dropdown-->
	<table>
		<tr>
			<td><h:outputLabel value="#{lbl['lbl.sc.view.by']}" /></td>	
			<td><p:selectOneMenu
					value="#{evaluationBackingBean.managedBean.technicalSummaryView}">
					<f:selectItems value="#{evaluationBackingBean.technicalSummaryDropDownValues()}"></f:selectItems>
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{evaluationBackingBean.technicalsummaryChange}"
						update="@([id$=technicalviewSummary])"></p:ajax>
				</p:selectOneMenu></td>
				<ui:remove>	
	<!--  		<td><p:selectOneMenu
					value="#{evaluationBackingBean.managedBean.technicalSummaryView}" rendered="#{evaluationBackingBean.managedBean.noSupplierPackageExist}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"/>
					<f:selectItem itemLabel="#{lbl['lbl.sc.evaluation.view.by.item.preference.margin']}" itemValue="#{evaluationBackingBean.technicalSummaryDropDownValues().get(2).getValue()}"/>
					<p:ajax event="change" process="@this" partialSubmit="true"
						listener="#{evaluationBackingBean.technicalsummaryChange}"
						update="@([id$=technicalviewSummary])"></p:ajax>
				</p:selectOneMenu></td>
	-->	
				</ui:remove>
		</tr>

	</table>
	<!-- #33178 end -->
	<!-- #33174 start enable dropdown end-->
<h:panelGroup id="technicalviewSummary">
		<ui:param name="isDisqualified" value="#{evaluationBackingBean.renderDisqialified() ? true : false}" /><!-- #29187 Added Vinod -->
		<c:if
			test="#{evaluationBackingBean.managedBean.technicalSummaryView eq 'TPM'}">
				<ui:param name="passingScore"
								value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
								<ui:include src="technicalPackageSummary.xhtml"></ui:include>
			</c:if>
			
			<c:if
			test="#{evaluationBackingBean.managedBean.technicalSummaryView eq 'TI'}">
				<ui:param name="itemList"
					value="#{evaluationBackingBean.managedBean.summaryItemList}"></ui:param>
				<ui:param name="passingScore"
					value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
								<ui:include src="tecSummaryItems.xhtml"></ui:include>
			</c:if>
		
			</h:panelGroup>


	


</ui:composition>
