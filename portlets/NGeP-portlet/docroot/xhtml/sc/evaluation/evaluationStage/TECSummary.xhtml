<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- #34588 start(wip doesnt need to show dropdown)-->
	<c:choose>
		<c:when test="#{evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.view.by']}" /></td>
					<td><p:selectOneMenu
							value="#{evaluationBackingBean.managedBean.technicalSummaryView}">
							<f:selectItems
								value="#{evaluationBackingBean.technicalSummaryDropDownValues()}"></f:selectItems>
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{evaluationBackingBean.technicalsummaryChange}"
								update="@([id$=technicalviewSummary])"></p:ajax>
						</p:selectOneMenu>
					</td>
				</tr>
			</table>

			<h:panelGroup id="technicalviewSummary">
				<ui:remove>#29187 Start Vinod</ui:remove>
				<ui:param name="isDisqualified" value="#{evaluationBackingBean.renderDisqialified()}" />
				<ui:remove>#29187 End Vinod</ui:remove>
				<c:if
					test="#{evaluationBackingBean.managedBean.technicalSummaryView eq 'TPM'}">
					<ui:param name="passingScore"
						value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
					<ui:include src="technicalPackageSummary.xhtml"></ui:include>
				</c:if>

				<c:if
					test="#{evaluationBackingBean.managedBean.technicalSummaryView eq 'TI'}">
					<ui:param name="itemList"
						value="#{evaluationBackingBean.managedBean.summaryItemList}"></ui:param>
					<ui:param name="passingScore"
						value="#{evaluationBackingBean.managedBean.passingScore}"></ui:param>
					<ui:include src="tecSummaryItems.xhtml"></ui:include>
				</c:if>

			</h:panelGroup>
		</c:when>
		
		<c:otherwise>
			<p:panel
				id="onerTierTechnicalOrTecSummarySuppliersQualifiedIdsEvaluation"
				toggleable="true">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.sc.eva.qualified.supplier.list.tec.evaluation.stage']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.eva.qualified.supplier.list.tec.evaluation.stage.tooltip']}" />
				</f:facet>

				<p:dataTable var="qualifiedSupplier" id="oneTierQualifiedSupplier"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rows="10" editable="true" rowIndexVar="index"
					value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM}"
					lazy="true" rowKey="#{qualifiedSupplier}">
					<ac:paginator for="oneTierQualifiedSupplier" />

					<p:column headerText="#{lbl['lbl.sc.ranking']}"
						style="width:25%;white-space: normal;text-align:right;">

						<h:outputText value="#{qualifiedSupplier.evalRank}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
						style="width:25%;white-space: normal; text-align:center;">
						<h:outputText
							value="#{qualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.total.score']}"
						style="width:30%;white-space: normal;text-align:right;">
						<h:outputText value="#{qualifiedSupplier.totalScore}"></h:outputText>
					</p:column>					
				</p:dataTable>
				<p:spacer height="10px" />
				<table>
				<ui:remove>
						<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
				</ui:remove>
					<tr>
						<td style="width: 230px;"><h:outputLabel
								value="#{lbl['lbl.sc.passing.score']}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								style="text-align:right" value="#{evaluationBackingBean.managedBean.passingScore}"></p:inputText></td>
					</tr>
					<tr>
						<td><h:outputLabel
								value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								style="text-align:right"
								value="#{evaluationBackingBean.managedBean.qualifiedSuppliersDM.rowCount}"></p:inputText></td>
					</tr>
				</table>
			</p:panel>

			<p:panel
				id="onerTierTechnicalOrTecSummarySuppliersDisQualifiedIdsEvaluation"
				toggleable="true">
				<f:facet name="header">
					<h:outputText
						value="#{lbl['lbl.sc.eva.disqualified.supplier.list.tec.evaluation.stage']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.eva.disqualified.supplier.list.tec.evaluation.stage.tooltip']}" />
				</f:facet>

				<p:dataTable var="disQualifiedSupplier" rows="10"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM}"
					lazy="true" id="oneTierDisQualifiedSupplier" editable="true"
					rowIndexVar="index" rowKey="#{disQualifiedSupplier}">
					<ac:paginator for="oneTierDisQualifiedSupplier" />

					<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
						style="width:30%;white-space: normal; text-align:center;">
						<h:outputText
							value="#{disQualifiedSupplier.qtEvaluationResult.scQtProposal.supplierNo}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.total.score']}"
						style="width:50%;white-space: normal;text-align:right;">
						<h:outputText value="#{disQualifiedSupplier.totalScore}"></h:outputText>
					</p:column>
				</p:dataTable>

				<p:spacer height="10px" />
				<table>
					<tr>
						<td style="width: 230px;"><h:outputLabel
								value="#{lbl['lbl.sc.evaluation.total.suppliers']}" /></td>
						<td><p:inputText readonly="true" disabled="true"
								style="text-align:right"
								value="#{evaluationBackingBean.managedBean.disqualifiedSuppliersDM.rowCount}"></p:inputText></td>
					</tr>
				</table>
			</p:panel>
		</c:otherwise>
	</c:choose>
<!-- #34588 end(wip doesnt need to show dropdown)-->
</ui:composition>
