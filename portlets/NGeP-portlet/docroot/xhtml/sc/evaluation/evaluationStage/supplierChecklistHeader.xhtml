<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div align="left" class="header-info header-spacing">
		<table border="0" cellspacing="0" cellpadding="0">
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.supplier.code']}" /></td>
				<!-- 25138,34876 -start- -->
				<c:choose>
					<c:when
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex == 1
					and evaluationBackingBean.managedBean.evaluationCheckListType == ParameterConst.documentDefinitionTypeTemplateSpecification}">
						<td style="font-size: 12px;">:
							#{evaluationBackingBean.managedBean.supplierNo}</td>
					</c:when>
					<c:otherwise>
						<td style="font-size: 12px;">:
							#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtProposal.supplierNo}</td>
					</c:otherwise>
				</c:choose>
				<!-- 25138,34876 -end- -->
			</tr>
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.spec.checklist.title']}" /></td>
				<!-- 25138,34876 -start- -->
				<c:choose>
					<c:when
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex == 1
					and evaluationBackingBean.managedBean.evaluationCheckListType == ParameterConst.documentDefinitionTypeTemplateSpecification}">
						<td style="font-size: 12px;">:
							#{lbl['lbl.sc.eva.all.template']}</td>
					</c:when>
					<c:otherwise>
						<td style="font-size: 12px;">:
							#{evaluationBackingBean.managedBean.qtProposalChecklist.scQtCheckList.title}</td>
					</c:otherwise>
				</c:choose>
				<!-- 25138,34876 -end- -->
			</tr>
			<ui:remove>#29187 Start Vinod</ui:remove>
			<c:if test="#{!empty evaluationBackingBean.managedBean.tplSpecZoneDtl.zoneName}">
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.zone']}" /></td>
				<td style="font-size: 12px;">:
				<p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{evaluationBackingBean.managedBean.tplSpecZoneDtl}" />
					<h:outputText value="#{evaluationBackingBean.managedBean.tplSpecZoneDtl.zoneName}" />
				</p:commandLink>
				</td>
			</tr>
			</c:if>
			<ui:remove>#29187 End Vinod</ui:remove>
		</table>
	</div>

</ui:composition>
