<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" valign="top"><p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex}"
					styleClass="sidemenu">
					<!-- Bug #34452 hide for wip, adding condition-->
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore or evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
						<p:menuitem value="#{lbl['lbl.sc.eva.technical.item']}"
							action="#{evaluationBackingBean.retriveTechnicalEvaluationStage}"
							update="@form" />
					</c:if>
					<!-- Technical package tab -->
					<!-- Bug #33178 adding noSupplierPackageExist-->
					<!-- #34588 start cater below -->
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore 
						or evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}">
						<p:menuitem value="#{lbl['lbl.sc.eva.technical.package']}" disabled="#{evaluationBackingBean.managedBean.scQt.evaluateBy eq SourcingConstants.EVALUATE_BY__ITEM or evaluationBackingBean.managedBean.noSupplierPackageExist}"
							action="#{evaluationBackingBean.retriveTechnicalEvaluationStagePackage}"
							update="@form" /><!-- 32453 -->
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent 
						or evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}">
						<p:menuitem value="#{lbl['lbl.sc.technical']}"
							action="#{evaluationBackingBean.retriveTechnicalEvaluationStage}"
							update="@form" />
					</c:if>
					<!-- 34588 wip below -->
					<!-- Financial item tab -->
					<!-- Bug #33178 adding noSupplierPackageExist-->
					<c:if
						test="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq) or (evaluationBackingBean.managedBean.committeeType eq 'FEC'))}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.itemized']}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStage}"
							update="@form" rendered="#{evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore}"/>
						<p:menuitem value="#{lbl['lbl.sc.financial']}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStage}"
							update="@form" rendered="#{evaluationBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}"/>
					</c:if>
					<!-- Bug #33178 adding noSupplierPackageExist-->
					<ui:remove>
					<!-- #25138(wip 4serangkai) bug -Start 8/6/2023 -->
					</ui:remove>
					<c:if
						test="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq)
						and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore
						or (evaluationBackingBean.managedBean.committeeType eq 'FEC' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore))}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.package']}" disabled="#{evaluationBackingBean.managedBean.singleSpecQuestion or evaluationBackingBean.managedBean.noSupplierPackageExist}"
							action="#{evaluationBackingBean.retriveFinancialEvaluationStagePackage}"
							update="@form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
						<p:menuitem value="#{lbl['lbl.sc.eva.financial.summary']}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveOneTierWithoutTechnicalFinancialSupplierSummary}"
							update="@form" />


						<p:menuitem value="#{lbl['lbl.sc.eva.recommendation.summary']}"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveSummaryEvaluationStage}"
							update="@form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq}">
						<p:menuitem value="#{lbl['lbl.sc.summary']}" process="@this" partialSubmit="true" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveSummaryEvaluationStage}"
							update="@form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
						<p:menuitem value="#{lbl['lbl.sc.summary']}" process="@this" partialSubmit="true" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveSummaryEvaluationStage}"
							update="@form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq 'TEC'}">
						<p:menuitem value="#{lbl['lbl.sc.summary']}" process="@this" partialSubmit="true" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retriveSummaryEvaluationStage}"
							update="@form" />
					</c:if>
					<c:if
						test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeTechnicalEvaluationCommittee and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true' and evaluationBackingBean.managedBean.demoWip eq 'false'}"><ui:remove>#28784 WIP @idham</ui:remove>
						<p:menuitem value="#{lbl['lbl.sc.eva.technical.presentation.demo']}" process="@this" partialSubmit="true" 
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{evaluationBackingBean.retrivePresentationOrDemoEvaluationStage}"
							update="@form" />
					</c:if>

				</p:tabMenu></td>
			<td width="80%;" valign="top"><c:if
					test="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0') 
					or (evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'))}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'}">

						<ui:include
							src="/xhtml/sc/evaluation/evaluationStage/technical/technicalEvaluation.xhtml"></ui:include>

					</c:if>
				</c:if> <c:if
					test="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1') 
					or (evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'))}">
					<c:if
						test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1'}">
<!-- #34588 start cater WIP -->
						<c:choose>

				         <c:when test = "#{evaluationBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}">
				            					<ui:include src="TECSummary.xhtml" />

				         </c:when>
				         <c:otherwise>
							<ui:include src="/xhtml/sc/evaluation/evaluationStage/technical/technicalEvaluationPackage.xhtml"></ui:include>
				         </c:otherwise>
      					</c:choose>
<!-- #34588 end cater WIP -->
					</c:if>
				</c:if> <c:if
					test="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq 
					and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1') 
					or (evaluationBackingBean.managedBean.committeeType eq 'FEC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '0'))}">


					<ui:include
						src="/xhtml/sc/evaluation/evaluationStage/financial/financialEvaluation.xhtml"></ui:include>

				</c:if> 
				<ui:remove>
					<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
				</ui:remove>
					<c:if
					test="#{((evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq 
					and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore) 
					or (evaluationBackingBean.managedBean.committeeType eq 'FEC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1' and evaluationBackingBean.managedBean.wipStatusMax gt ParameterConst.flagWipStatus3serangkaiBefore))}">


					<ui:include
						src="/xhtml/sc/evaluation/evaluationStage/financial/financialEvaluationPackage.xhtml"></ui:include>

				</c:if><c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq 
					and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2'}">


					<ui:include src="financialEvaluationRecommendationSummary.xhtml" />

				</c:if><c:if
					test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2' and evaluationBackingBean.managedBean.committeeType eq 'FEC'}">


					<ui:include src="financialEvaluationRecommendationSummary.xhtml" />

				</c:if><!-- 2tier -->
				<ui:remove>
						<!-- //#25138(wip 4serangkai) bug -Start 8/6/2023 -->
				</ui:remove>
				<c:if
					test="#{evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '1' 
					and evaluationBackingBean.managedBean.committeeType eq 'FEC'
					and evaluationBackingBean.managedBean.wipStatusMax lt ParameterConst.flagWipStatus3serangkaiCurrent}">


					<ui:include src="financialEvaluationRecommendationSummary.xhtml" />

				</c:if>   <c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq 
					and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '3'}">


					<ui:include src="FinancialEvaluationCommitteeSummary.xhtml" />


				</c:if><c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'FEC' and !evaluationBackingBean.managedBean.scQt.techEvaluationReq 
					and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '3'}">


					<ui:include src="FinancialEvaluationCommitteeSummary.xhtml" />


				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2'
					and evaluationBackingBean.managedBean.scQt.demoRequired eq 'false'}">

					
					<ui:include src="TECSummary.xhtml" />

				</c:if><c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq eq 'true' 
					and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2'}">

					
					<ui:include src="TECSummary.xhtml" />

				</c:if>
				<ui:remove>#28784 WIP @idham - Start</ui:remove>
				<c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeTechnicalEvaluationCommittee and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2' 
					and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true' and !evaluationBackingBean.managedBean.demoWip}">

					
					<ui:include src="TECSummaryPresentationDemo.xhtml" />

				</c:if><c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeTechnicalEvaluationCommittee and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '2' 
					and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true' and evaluationBackingBean.managedBean.demoWip}">

					
					<ui:include src="TECSummary.xhtml" />

				</c:if>
				<ui:remove>#28784 WIP @idham - End</ui:remove>
				<c:if
					test="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeTechnicalEvaluationCommittee and evaluationBackingBean.managedBean.evaluatioStageActiveIndex eq '3'
					and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true'}">

					
					<ui:include src="presentationOrDemoTech.xhtml" />

				</c:if></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC'}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','1')}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' or evaluationBackingBean.managedBean.committeeType eq 'FEC'}">
					<p:commandButton value="#{lbl['lbl.btn.prev']}" style="float:left;"
						styleClass="BtnSpacing"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','0')}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</ui:fragment></td>
			<td><ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true'
					and (evaluationBackingBean.managedBean.tabTechnicalIndex eq '1' or evaluationBackingBean.managedBean.tabTechnicalIndex eq '2'
					or evaluationBackingBean.managedBean.tabTechnicalIndex eq '3')}">



					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />


				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq ParameterConst.committeeTypeTechnicalEvaluationCommittee 
					and evaluationBackingBean.managedBean.scQt.demoRequired eq 'true'
					and evaluationBackingBean.managedBean.tabTechnicalIndex eq '4'}">

					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						disabled="#{!evaluationBackingBean.managedBean.afterDemoInv}"
						update=":form" />


				</ui:fragment>

<ui:remove> 2tier </ui:remove>
					<ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'TEC' and evaluationBackingBean.managedBean.scQt.demoRequired eq 'false'}">



					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />


				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq eq 'true'}">



					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />


				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'EC' and evaluationBackingBean.managedBean.scQt.techEvaluationReq eq 'false'}">



					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />


				</ui:fragment> <ui:fragment
					rendered="#{evaluationBackingBean.managedBean.committeeType eq 'FEC' }">



					<p:commandButton value="#{lbl['lbl.btn.next']}"
						style="float:right;" styleClass="BtnSpacing"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						actionListener="#{evaluationBackingBean.evaluationMaintainPreviousNextTabIndex('2','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" iconPos="right"
						update=":form" />


				</ui:fragment></td>
		</tr>
	</table>

</ui:composition>
