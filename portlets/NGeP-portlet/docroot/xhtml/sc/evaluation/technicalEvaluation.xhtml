<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.eva.compliance.tech.proposal']}"
		toggleable="true">

		<p:dataTable var="technicalEvaluate" id="technicalEvaluation"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{technicalEvaluate}">
			<ac:paginator for="technicalEvaluation" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.title']}"
				style="width:55%">

				<h:outputText></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.type']}"
				style="width:20%">


				<h:outputText></h:outputText>

			</p:column>


			<p:column headerText="#{lbl['lbl.sc.eva.evaluation.status']}"
				style="width:15%">


				<h:outputText></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
				style="width:10%">

				<p:commandButton value="#{lbl['lbl.sc.eva.btn.compliance']}"
					process="@this" partialSubmit="true" />


			</p:column>

		</p:dataTable>


	</p:panel>



</ui:composition>
