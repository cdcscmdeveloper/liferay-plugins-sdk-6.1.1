<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>

		<p:panel header="#{lbl['lbl.sc.eva.compliance.tech.proposal']}"
			toggleable="true">

			<p:dataTable var="technicalEvaluate" id="technicalEvaluation"
				editable="true" rowIndexVar="index"
				first="#{evaluationBackingBean.managedBean.evaluationtechnicalTableRow}"
				rowKey="#{technicalEvaluate}"
				value="#{evaluationBackingBean.managedBean.evaluationStgTechnicalCheckList}">
				<!-- 	<ac:paginator for="technicalEvaluation" /> -->


				<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.title']}"
					style="width:55%;white-space: normal;">

					<h:outputText value="#{technicalEvaluate.title}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.type']}"
					style="width:20%;white-space: normal;">


					<h:outputText
						value="#{evaluationBackingBean.getParameterDesc(technicalEvaluate.definationType)}"></h:outputText>


				</p:column>


				<p:column headerText="#{lbl['lbl.sc.eva.evaluation.status']}"
					style="width:15%;white-space: normal;">


					<h:outputText
						value="#{evaluationBackingBean.getStatusDescById(technicalEvaluate.pmEvalStatus.statusId)}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
					style="width:10%">

					<ui:fragment rendered="#{technicalEvaluate.scoringReq eq 'false'}">
						<p:commandButton value="#{lbl['lbl.sc.eva.btn.view']}"
							process="@this" partialSubmit="true"
							action="#{evaluationBackingBean.viewTechnicalEvaluation(technicalEvaluate,index,'ET')}" />
					</ui:fragment>
					<ui:fragment rendered="#{technicalEvaluate.scoringReq ne 'false'}">
						<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
							action="#{evaluationBackingBean.evaluateTechnicalEvaluation(technicalEvaluate,index,'ET')}"
							process="@this" partialSubmit="true" />
					</ui:fragment>

				</p:column>

			</p:dataTable>


		</p:panel>

	</h:panelGroup>

</ui:composition>
