<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




<p:spacer height="40"></p:spacer>
	<p:panel header="#{lbl['lbl.sc.eva.compliance.tech.proposal']}"
		toggleable="true">

		<p:dataTable var="technicalEvaluate" id="technicalEvaluation" rows="10"
			editable="true" rowIndexVar="index" style="white-space: normal;"
			first="#{evaluationBackingBean.managedBean.evaluationtechnicalTableRow}"
			rowKey="#{technicalEvaluate}" value="#{evaluationBackingBean.managedBean.evaluationStgTechnicalCheckList}">
			<ac:paginator for="technicalEvaluation" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.title']}"
				style="width:55%">

				<h:outputText value="#{technicalEvaluate.title}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.type']}"
				style="width:20%">


			<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(technicalEvaluate.definationType)}"></h:outputText>


			</p:column>


			<p:column headerText="#{lbl['lbl.sc.eva.evaluation.status']}"
				style="width:15%">


				<h:outputText value="#{evaluationBackingBean.getStatusDescById(technicalEvaluate.pmStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
				style="width:10%">
           
				<ui:fragment rendered="#{technicalEvaluate.scoringReq eq 'false'}">
				<p:commandButton value="#{lbl['lbl.sc.eva.btn.view']}"
					process="@this" partialSubmit="true" action="#{evaluationBackingBean.viewTechnicalEvaluation(technicalEvaluate)}"/>
					</ui:fragment>
					<ui:fragment rendered="#{technicalEvaluate.scoringReq ne 'false'}">
					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}" action="#{evaluationBackingBean.evaluateTechnicalEvaluation(technicalEvaluate)}"
					process="@this" partialSubmit="true" />
					</ui:fragment>

			</p:column>

		</p:dataTable>


	</p:panel>



</ui:composition>
