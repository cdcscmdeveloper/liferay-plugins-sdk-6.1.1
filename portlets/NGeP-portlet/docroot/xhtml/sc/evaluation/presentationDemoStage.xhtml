<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" style="vertical-align: baseline;"><p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.presentationDemoActiveIndex}"
					styleClass="sidemenu" style="display : table-caption;">

					<p:menuitem value="#{lbl['lbl.sc.eva.present.demo.head']}"
						action="#{evaluationBackingBean.retrivePresentationDemo}"
						update="@form" />

					<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.summary']}"
						action="#{evaluationBackingBean.retrivePresentationDemoSummary}"
						update="@form" />


				</p:tabMenu></td>
			<td width="80%;"><c:if
					test="#{evaluationBackingBean.managedBean.presentationDemoActiveIndex eq '0'}">
					
					<ui:include src="presentationdemo.xhtml"></ui:include>

				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.presentationDemoActiveIndex eq '1'}">

					<ui:include src="presentationDemoSummary.xhtml"></ui:include>
				</c:if></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('3','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">


					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('3','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />

				</div></td>
		</tr>
	</table>

</ui:composition>
