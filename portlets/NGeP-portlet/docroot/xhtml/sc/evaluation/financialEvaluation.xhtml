<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">




	<p:spacer height="40"></p:spacer>
	<p:panel header="#{lbl['lbl.sc.eva.compliance.fin.proposal']}"
		toggleable="true">

		<p:dataTable var="financialEval" id="financialEvaluation"
			style="white-space: normal;" 
			value="#{evaluationBackingBean.managedBean.evaluationStgfinancialCheckList}"
			rows="10" editable="true" rowIndexVar="index"
			rowKey="#{financialEval}">
			<ac:paginator for="financialEvaluation" />


			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.title']}"
				style="width:70%">

				<h:outputText value="#{financialEval.title}"></h:outputText>


			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.type']}"
				style="width:20%">


				<h:outputText
					value="#{evaluationBackingBean.getParameterDesc(financialEval.definationType)}"></h:outputText>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
				style="width:10%">
				<ui:fragment rendered="#{financialEval.scoringReq eq 'false'}">
					<p:commandButton value="#{lbl['lbl.sc.eva.btn.view']}"
						process="@this" partialSubmit="true"
						action="#{evaluationBackingBean.viewfinacialEvaluation(financialEval)}" />
				</ui:fragment>
				<ui:fragment rendered="#{financialEval.scoringReq ne 'false'}">
					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
						process="@this" partialSubmit="true"
						action="#{evaluationBackingBean.evaluatefinancialEvaluation(financialEval)}" />
				</ui:fragment>


			</p:column>

		</p:dataTable>


	</p:panel>



</ui:composition>
