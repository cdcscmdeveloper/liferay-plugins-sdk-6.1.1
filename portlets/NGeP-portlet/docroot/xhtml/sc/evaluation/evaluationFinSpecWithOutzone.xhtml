<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<h:panelGroup>
			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{evaluationBackingBean.evaluationBackaction}" />

			</div>
		</h:panelGroup>
		<p:spacer height="25" />
		<br />
		<br />
		<h:panelGroup>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel></td>
					<td><p:inputTextarea style="width:100%"
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true"></p:inputTextarea></td>
				</tr>
			</table>
		</h:panelGroup>


		<h:panelGroup>

			<ui:param name="finSpecsupplierList"
				value="#{evaluationBackingBean.managedBean.finSpecSupplierList}"></ui:param>
			<ui:param name="finSpecofferPrice"
				value="#{evaluationBackingBean.managedBean.offerPricePackage}"></ui:param>
			<ui:param name="finSpecSupplierId" value="finSpecSupplierWithOutzone"></ui:param>
			<h:panelGroup>
				<ui:include
					src="/xhtml/sc/evaluation/finSpecSupplierOfferPriceList.xhtml"></ui:include>
			</h:panelGroup>

		</h:panelGroup>



	</ui:define>
</ui:composition>
