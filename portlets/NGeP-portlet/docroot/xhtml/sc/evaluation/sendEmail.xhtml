<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="#{lbl['lbl.sc.send.email']}" widgetVar="sendEmail" modal="true"
		width="800" height="400">
		<p:panel header="#{lbl['lbl.sc.meeting.details']}"
			toggleable="true">

			<p:dataTable id="evaluationemail" var="simpleQuote5"
				
				rowKey="#{simpleQuote5.seqNo}" rowIndexVar="index">
				<ac:paginator for="evaluationemail" />

				<p:column selectionMode="multiple" style="width:5%" />

				<p:column headerText="#{lbl['lbl.sc.name']}"
					style="width:95%">
					<h:outputText value="committee#{index+1}"></h:outputText>
				</p:column>



			</p:dataTable>

		</p:panel>


		<p:panel id="emailpopup" header="#{lbl['lbl.sc.eva.report']}">
			<h:panelGrid columns="2">

				<h:outputLabel value="#{lbl['lbl.sc.meeting.location']}"></h:outputLabel>


				<p:inputText value="#{evaluationBackingBean.managedBean.meeting.meetingLocation}"></p:inputText>


				<h:outputLabel value="#{lbl['lbl.sc.meeting.date']}"></h:outputLabel>


				<p:calendar value="#{evaluationBackingBean.managedBean.meeting.meetingDate}" showOn="button"></p:calendar>


				<h:outputLabel value="#{lbl['lbl.sc.message']}"></h:outputLabel>


				<p:inputTextarea rows="3" cols="50" value="#{evaluationBackingBean.managedBean.meeting.meetingDate}"></p:inputTextarea>




			</h:panelGrid>

		</p:panel>
		<div align="right">

			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				style="float:right;" onclick="sendEmail.hide();"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.btn.ok']}"
				style="float:right;" onclick="sendEmail.hide();"
				oncomplete="simpleQuoteBid.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
