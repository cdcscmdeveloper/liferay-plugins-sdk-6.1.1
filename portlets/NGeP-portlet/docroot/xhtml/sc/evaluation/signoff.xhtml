<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- <ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" />  -->


	<p:panel header="#{lbl['lbl.sc.eva.main.menu.endors.stg']}"
		toggleable="true">
		
		<p:dataTable id="evaluationSignOff" var="signOffMember" rows="10"
			value="#{evaluationBackingBean.managedBean.endorscommitteeMemberList}"
			rowKey="#{signOffMember}" rowIndexVar="index">

			<ac:paginator for="evaluationSignOff" />

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}"
				style="width:35%">
				<h:outputText value="#{signOffMember.memberName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}"
				style="width:35%">
				<h:outputText value="#{signOffMember.icPassport}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.committee.role']}"
				style="width:20%">
				<h:outputText
					value="#{signOffMember.memberRole.parameterId}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.status']}"
				style="width:10%">
              <h:outputText
					value="#{evaluationBackingBean.getStatusDescById(signOffMember.scCommittee.committeStatus.statusId)}"></h:outputText>
			</p:column>

		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.reminder']}"
				onclick="evaluationreminder.show();" icon="ui-icon-mail" />

		</div>
		<ui:include src="/xhtml/sc/evaluation/evaluationreminderpopup.xhtml" />
		<ui:include src="/xhtml/sc/evaluation/chairPersonSignOff.xhtml" />
	</p:panel>
	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('5','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>

		</tr>
	</table>
</ui:composition>
