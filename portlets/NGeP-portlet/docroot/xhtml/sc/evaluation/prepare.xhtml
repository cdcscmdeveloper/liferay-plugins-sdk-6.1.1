<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" class="sidemenutd" style="vertical-align: baseline;">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{evaluationBackingBean.managedBean.prepareActiveIndex}"
					style="display : table-caption;">

					<p:menuitem value="#{lbl['lbl.sc.eva.prepare.mtng.dtls']}"
						action="#{evaluationBackingBean.retriveMeetingDtls(null,'QT',0)}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.eva.mtng.opn.committee']}"
						action="#{evaluationBackingBean.retriveOpeningCommitteeDtls(1)}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.eva.prepare.turut.hadir']}"
						action="#{evaluationBackingBean.retriveTurutHadirDtls(2)}"
						update="@form" />
				</p:tabMenu>
			</td>
			<td width="80%"><c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '0'}">

					<ui:include src="meetingDetails.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '1'}">

					<ui:include src="openCommittee.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.prepareActiveIndex eq '2'}">

					<ui:include src="turuthadir.xhtml"></ui:include>
				</c:if></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td></td>
			<td>
				<div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}" icon="ui-icon-next"
						iconPos="right"
						actionListener="#{evaluationBackingBean.setTabValue(0,1)}"
						action="#{evaluationBackingBean.updateSmAppl}" update=":form" />
				</div>
			</td>
		</tr>
	</table>

</ui:composition>
