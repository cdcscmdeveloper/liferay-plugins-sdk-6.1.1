<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">

		<div>
			<p:commandButton value="#{lbl['lbl.sc.spec.back']}"
				style="float:left;" icon="ui-icon-back"
				action="#{evaluationBackingBean.evaluationBackaction}" />

		</div>
		<p:spacer height="75"></p:spacer>
		<p:panel>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.asset.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true" style="width:100%"></p:inputTextarea></td>
				</tr>
			</table>
		</p:panel>


		<p:panel header="#{lbl['lbl.sc.eva.comp.sup.list']}" toggleable="true">

			<p:dataTable var="templateSpec" id="templateSpecId" editable="true" rows="10"
				value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckList}"
				rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}">
				<ac:paginator for="templateSpecId" />


				<p:column headerText="#{lbl['lbl.sc.eva.comp.sup.code']}"
					style="width:25%">

					<h:outputText value="#{templateSpec.scQtProposal.supplierNo}"></h:outputText>


				</p:column>
				<p:column headerText="#{lbl['lbl.sc.eva.auto.score']}"
					style="width:20%">
					<h:outputText value="#{templateSpec.totalAutoScore}"></h:outputText>

				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.manual.score']}"
					style="width:20%">
					<h:outputText value="#{templateSpec.totalUserScore}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.fin.spec.tot.score']}"
					style="width:20%">
					<h:outputText value="#{templateSpec.totalScore}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.eva.compliance.fin.action']}"
					style="width:15%">

					<p:commandButton value="#{lbl['lbl.sc.eva.btn.evaluate']}"
						process="@this" partialSubmit="true"
						action="#{evaluationBackingBean.othersTechnicalEvaluate(templateSpec)}" />
				</p:column>
			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
