<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%;" class="sidemenutd" style="vertical-align: baseline;">

				<p:tabMenu
					activeIndex="#{evaluationBackingBean.managedBean.complianceActiveIndex}"
					styleClass="sidemenu" style="display : table-caption;">

					<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.tech']}"
						action="#{evaluationBackingBean.retriveComplianceTechnical}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.sample']}"
						action="#{evaluationBackingBean.retriveComplianceSample}"
						update="@form" />
					<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.fin']}"
						action="#{evaluationBackingBean.retriveComplianceFinancial}"
						update="@form" />

					<c:if
						test="#{evaluationBackingBean.managedBean.complianceActiveIndex eq '2' or evaluationBackingBean.managedBean.complianceActiveIndex eq '3'}">
						<p:menuitem value="#{lbl['lbl.sc.eva.compliance.stg.summary']}"
							action="#{evaluationBackingBean.retriveComplianceSummary}"
							update="@form">
							
						</p:menuitem>
					</c:if>
				</p:tabMenu>
			</td>
			<td width="80%"><c:if
					test="#{evaluationBackingBean.managedBean.complianceActiveIndex eq '0'}">

					<ui:include src="complianceTechnical.xhtml"></ui:include>

				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.complianceActiveIndex eq '1'}">

					<ui:include src="complianceSample.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.complianceActiveIndex eq '2'}">

					<ui:include src="complianceFinancial.xhtml"></ui:include>
				</c:if> <c:if
					test="#{evaluationBackingBean.managedBean.complianceActiveIndex eq '3'}">

					<ui:include src="complianceSummary.xhtml"></ui:include>
				</c:if></td>
		</tr>
	</table>

	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','0')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			<td><div align="right" style="width: 99%">


					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('1','2')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />

				</div></td>
		</tr>
	</table>

</ui:composition>
