<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup>
		<h:panelGroup>
			<div>
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{evaluationBackingBean.evaluationBackaction}" />

			</div>
		</h:panelGroup>
		<p:spacer height="25" />
		<br />
		<br />
		<h:panelGroup>
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.checklist.title']}"></h:outputLabel></td>
					<td><p:inputTextarea
							value="#{evaluationBackingBean.managedBean.scQtChecklist.title}"
							rows="2" cols="150" disabled="true" style="width:100%"></p:inputTextarea></td>
				</tr>
			</table>
		</h:panelGroup>

		<h:panelGroup>
			<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">

				<p:dataTable var="templateSpec" id="templateSpecId" editable="true"
					rows="10"
					value="#{evaluationBackingBean.managedBean.complianceTechnicalProposalCheckList}"
					rowIndexVar="index" style="width:100%" rowKey="#{templateSpec}">
					<ac:paginator for="templateSpecId" />


					<p:column headerText="#{lbl['lbl.sc.supplier.code']}"
						style="width:25%">

						<h:outputText value="#{templateSpec.scQtProposal.supplierNo}"></h:outputText>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.auto.score']}"
						style="width:20%">
						<h:outputText value="#{templateSpec.totalAutoScore}"></h:outputText>

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.eva.manual.score']}"
						style="width:20%">
						<h:outputText value="#{templateSpec.totalUserScore}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.total.score']}"
						style="width:20%">
						<h:outputText value="#{templateSpec.totalScore}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}" style="width:15%">

						<p:commandButton value="#{lbl['lbl.btn.evaluate']}"
							process="@this" partialSubmit="true"
							rendered="#{templateSpec.evaluationStatus.statusId eq '61600' and evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"
							action="#{evaluationBackingBean.technicalSupplierEvaluate(templateSpec,index,'T')}" />

						<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
							partialSubmit="true"
							rendered="#{templateSpec.evaluationStatus.statusId eq '61601' and evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"
							action="#{evaluationBackingBean.technicalSupplierEvaluate(templateSpec,index,'T')}" />

						<p:commandButton value="#{lbl['lbl.btn.view']}" process="@this"
							partialSubmit="true"
							rendered="#{templateSpec.evaluationStatus.statusId eq '61600' and !evaluationBackingBean.managedBean.scQtChecklist.scoringReq}"
							action="#{evaluationBackingBean.technicalSupplierEvaluate(templateSpec,index,'T')}" />
					</p:column>
				</p:dataTable>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>
</ui:composition>
