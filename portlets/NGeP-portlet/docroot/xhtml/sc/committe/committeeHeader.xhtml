<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div align="left" class="header-info header-spacing">
		<table style="width: 100%">
			<tr>
				<td style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td style="width: 10%" class="header-info-text">
				<!-- 28780 start -->
					<p:commandLink process="@this" partialSubmit="true"
						action="#{qTDetailBB.editQuationTenderDetails(committeBackingBean.managedBean.qtCommittee.scQt, false, true, view.viewId)}">
					<h:outputText value="#{committeBackingBean.managedBean.qtCommittee.scQt.qtNo}" escape="false" />
					</p:commandLink>
				<!-- 28780 end -->
					</td>
				<td style="width: 5%"><h:outputLabel
						value="#{lbl['lbl.sc.ptj']}" /></td>
				<td style="width: 30%" class="header-info-text">
					<ui:param name="date" value="#{committeBackingBean.retriveDatesforOrgProfile(committeBackingBean.managedBean.qtCommittee.scQt.publishDate,committeBackingBean.managedBean.qtCommittee.scQt.createdDate)}"></ui:param>
					#{committeBackingBean.retrievePTJByOrgProfileId(committeBackingBean.managedBean.qtCommittee.scQt.ownerOrgProfileId,date)}

					
					</td>
				<td style="width: 5%"><h:outputLabel
						value="#{lbl['lbl.sc.status']}" /></td>
				<!-- 25037 -start- -->
				<td style="width: 12%" class="header-info-text">
					#{committeBackingBean.isCommitteeRecordStatusActive(committeBackingBean.managedBean.scCommittee)
					? lbl['lbl.txt.active'] : lbl['lbl.txt.inactive']}</td>
				<!-- 25037 -end- -->
			</tr>
		</table>
	</div>
</ui:composition>
