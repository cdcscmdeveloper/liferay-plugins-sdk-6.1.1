<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true"
			id="qtsearchid">
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.committee.search.instruction']}" escape="false" />
			<table style="width: 100%;">
				<tr>
					<td style="width: 220px" valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputTextarea
							value="#{committeBackingBean.managedBean.qtnTenderSearchBean.qtTitle}"
							cols="115" rows="3" style=" margin-bottom:5px;width: 98%;"
							maxlength="100" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td><p:inputText
							value="#{committeBackingBean.managedBean.qtnTenderSearchBean.qtNo}"
							size="35" maxlength="21" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.created.date']}" /></td>
					<td><p:calendar
							value="#{committeBackingBean.managedBean.qtnTenderSearchBean.fromCreatedDate}"
							id="crdateFrm" showOn="button" size="30" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.recordstatus']}" /></td>
					<td><p:selectOneMenu style="width: 285px;margin-bottom: 5px;"
							value="#{committeBackingBean.managedBean.qtnTenderSearchBean.recordStatus}">
							<f:selectItems
								value="#{committeBackingBean.getRecordStatusDropdownValues()}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.committe.type']}" /></td>
					<td><p:selectOneMenu
							value="#{committeBackingBean.managedBean.qtnTenderSearchBean.committeeType}"
							style="width: 285px;margin-bottom: 5px;">
							<f:selectItems
								value="#{committeBackingBean.getFCCommitteesDropDown()}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}" styleClass="BtnSpacing"
					action="#{committeBackingBean.searchQTAction}" update="searchQTs"
					process="@this, qtsearchid" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" styleClass="BtnSpacing"
					action="#{committeBackingBean.resetSearchDetails}"
					update="qtsearchid" resetValues="true" partialSubmit="true"
					process="@this" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
			<p:dataTable id="searchQTs"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{committeBackingBean.managedBean.searchQTDataModel}"
				var="scqtcommittee" rowIndexVar="index" lazy="true" rows="10">

				<ac:paginator for="searchQTs" />

				<p:column headerText="#{lbl['lbl.sc.qtn.no']}" style="width:100px;">
					<h:outputText value="#{scqtcommittee.scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.title']}">
					<h:outputText value="#{scqtcommittee.scQt.qtTitle}"
						style="white-space: normal;word-wrap: break-word;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.type']}"
					style="width:20%">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(scqtcommittee.scCommittee.committeeType)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.created.date']}"
					style="width:80px;">
					<h:outputText value="#{scqtcommittee.scQt.createdDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.recordstatus']}"
					style="width:10%"> 
   	    		#{(scqtcommittee.scCommittee.recordStatusFlg==1)? lbl['lbl.txt.active'] : lbl['lbl.txt.inactive']}              
      		</p:column>

				<p:column headerText="#{lbl['lbl.sc.action']}"
					style="width:6%;text-align: center;">
					<ui:param name="isFCCommitteeType"
						value="#{scqtcommittee.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeQuotationCommitteeB or 
			scqtcommittee.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeQuotationCommitteeA or
			scqtcommittee.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeProcurementBoardB or 
			scqtcommittee.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeProcurementBoardA or
			scqtcommittee.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeFederalProcurementBoardSbh or 
			scqtcommittee.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeFederalProcurementBoardSwk}" />
					<p:commandLink
						action="#{committeBackingBean.editAction(scqtcommittee)}"
						partialSubmit="true" process="@this"
						rendered="#{(isFCCommitteeType and scqtcommittee.scCommittee.recordStatus) or (!isFCCommitteeType and scqtcommittee.scCommittee.committeStatus.statusId ne QTStatusConst.CMT_COMPLETED)}">
						<h:graphicImage
							value="#{CommonUIConstant.imagePathUptoDesign}/edit.png"
							styleClass="tasklist_title1" />
					</p:commandLink>
					<p:commandLink
						action="#{committeBackingBean.editAction(scqtcommittee)}"
						partialSubmit="true" process="@this"
						rendered="#{(isFCCommitteeType and !scqtcommittee.scCommittee.recordStatus) or (!isFCCommitteeType and scqtcommittee.scCommittee.committeStatus.statusId eq QTStatusConst.CMT_COMPLETED)}">
						<h:graphicImage
							value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png"
							styleClass="tasklist_title1" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
