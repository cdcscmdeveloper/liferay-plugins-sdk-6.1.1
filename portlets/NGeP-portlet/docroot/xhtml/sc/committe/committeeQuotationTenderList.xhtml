<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
		<p:dataTable id="qtDetailsId"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{committeBackingBean.managedBean.committeeQTDataModel}"
			var="scQtCommittees" rowIndexVar="index" lazy="true" rows="10">

			<ac:paginator for="qtDetailsId" />

			<p:column headerText="#{lbl['lbl.sc.qtn.no']}" style="width:15%">
				#{scQtCommittees.scQt.qtNo}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.title']}" style="width:10px;">
				#{scQtCommittees.scQt.qtTitle}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.procurement.mode']}"
				style="width:10%">
				#{committeBackingBean.getParameterDesc(scQtCommittees.scQt.procurementMode)}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.date']}"
				style="width:10%">
				<h:outputText value="#{scQtCommittees.scQt.createdDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:10%">
				#{committeBackingBean.getStatusDescById(scQtCommittees.scQt.qtStatus.statusId)}
			</p:column>

		</p:dataTable>
		<br />
		<table style="width: 100%">
			<tr>
				<td style="width: 2px"><p:outputLabel
						value="#{lbl['lbl.sc.total']}" /></td>
				<td colspan="3"><p:inputText
						value="#{committeBackingBean.managedBean.committeeQTDataModel.rowCount}"
						readonly="true" style="text-align: right;" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
