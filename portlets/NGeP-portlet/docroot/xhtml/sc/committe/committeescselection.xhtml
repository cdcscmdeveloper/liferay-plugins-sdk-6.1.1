<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.committee.details']}" toggleable="true">
		<h:panelGrid columns="4"  cellpadding="3"
			id="committecheckbox" 
			rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '4'
    	         or committeBackingBean.managedBean.scCommittee.committeeType eq '5'}">
    	         <h:outputLabel value="#{lbl['lbl.sc.change.to.ec']}" />  
 <p:selectBooleanCheckbox value="#{committeBackingBean.managedBean.ecType}" disabled="#{!committeBackingBean.managedBean.editable}" /> 

		</h:panelGrid>
		<h:panelGrid columns="4" cellpadding="3" 
			 
			rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '3' }">
			<h:outputLabel value="#{lbl['lbl.sc.change.tec.fec']}" />  
			<p:selectBooleanCheckbox value="#{committeBackingBean.managedBean.tecType}" disabled="#{!committeBackingBean.managedBean.editable}" /> 
		</h:panelGrid>
		<br />

	
			<p:dataTable id="committeMember"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{committeBackingBean.managedBean.committemembers}"
				var="committemember" rowIndexVar="index" editable="true">
				 <ac:paginator for="committeMember" />
				 <p:ajax event="rowEdit" listener="#{committeBackingBean.onRowEditAction}" oncomplete="screen3.show();"  update="@(.qtAddMember)"/>  
                 <p:ajax event="rowEditCancel" listener="#{committeBackingBean.onRowCancel}" update="committeMember"/> 
				

				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{committemember.memberName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{committemember.icPassport}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.role']}">
					<h:outputText value="#{committemember.memberRole}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.access']}">
					<h:outputText value="#{committemember.accessRight}" />
				</p:column>
				<p:column style="width:6%" disabled="#{!committeBackingBean.managedBean.editable}">  
            <p:rowEditor disabled="#{!committeBackingBean.managedBean.editable}" />  
        </p:column> 
			
			</p:dataTable>
		

		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				action="#{committeBackingBean.addCommitteMember}"
				 process="@this" oncomplete="screen3.show();" update="@(.qtAddMember)"
				 disabled="#{!committeBackingBean.managedBean.editable}"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.btn.clone']}" onclick="screen2.show();" process="@this"
			disabled="#{!committeBackingBean.managedBean.editable}"></p:commandButton>
		</div>
		<br />
	</p:panel>


	<p:panel header="#{lbl['lbl.sc.approval.details']}" toggleable="true"
		id="approvaldetails"
		rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '2' or committeBackingBean.managedBean.scCommittee.committeeType eq '3' 
    or committeBackingBean.managedBean.scCommittee.committeeType eq '4' or committeBackingBean.managedBean.scCommittee.committeeType eq '4' 
    or committeBackingBean.managedBean.scCommittee.committeeType eq '5' or committeBackingBean.managedBean.scCommittee.committeeType eq '7'}">
		<br />

		<h:panelGrid columns="4" style="margin-bottom:10px;width:100%;"
			cellpadding="3">
			<h:outputLabel style="bold" value="#{lbl['lbl.sc.approver']}:" />
			<p:selectOneMenu style="width:150px"
				value="#{committeBackingBean.managedBean.scCommittee.pmUser.userId}"
				disabled="#{!committeBackingBean.managedBean.editable}">
				<f:selectItems value="#{committeBackingBean.managedBean.approvers}" var="approver" itemLabel="#{approver.userName}" itemValue="#{approver.userId}"></f:selectItems>
			</p:selectOneMenu>

			<h:outputLabel style="bold" value="#{lbl['lbl.sc.approver.date']}:" />
			<p:calendar value="#{committeBackingBean.managedBean.scCommittee.approvalDate}" disabled="#{!committeBackingBean.managedBean.editable}" showOn="button"></p:calendar>
			

			<h:outputLabel style="bold" value="#{lbl['lbl.sc.approver.action']}:" />
			<p:selectOneMenu  style="width:150px"
							value="#{committeBackingBean.managedBean.scCommittee.approvalStatus}"
							disabled="#{!committeBackingBean.managedBean.editable}">
							<f:selectItem itemLabel="SelectOne" itemValue="0" />
							<f:selectItem itemLabel="Approve" itemValue="2" />
							<f:selectItem itemLabel="Reject" itemValue="3" />
						</p:selectOneMenu>

			<h:outputLabel style="bold" value="#{lbl['lbl.sc.approver.remarks']}:" />
			<p:inputText id="appRemark"
				value="#{committeBackingBean.managedBean.scCommittee.approvalRemark}"
				disabled="#{!committeBackingBean.managedBean.editable}" />

		</h:panelGrid>
	</p:panel>

</ui:composition>
