<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="committenavbutton.xhtml" />

	<ui:include src="committeeaddscreen.xhtml" />

	<ui:include src="clonecommitteescreen.xhtml" />
	<ui:include src="committeeaddscreentwo.xhtml" />

	<ui:fragment
		rendered="#{committeBackingBean.managedBean.headerTitle eq 'OC' or committeBackingBean.managedBean.headerTitle eq 'EC' or committeBackingBean.managedBean.headerTitle eq 'TEC' or committeBackingBean.managedBean.headerTitle eq 'FEC'}">
		<ui:include src="/xhtml/sc/committe/committeeheader.xhtml" />

		<ui:param name="committeeMembersList"
			value="#{committeBackingBean.managedBean.qtCommittee.scCommittee}" />

		<ui:param name="selectedMembersList"
			value="#{committeBackingBean.managedBean.selectedCommitteMemebers}" />

		<ui:include src="committeeqcselection.xhtml" />

	</ui:fragment>

	<ui:fragment
		rendered="#{committeBackingBean.managedBean.headerTitle eq 'QCB'}">
		<ui:include src="quotationcommitteeheader.xhtml" />

		<ui:include src="committeefcselection.xhtml" />
	</ui:fragment>

</ui:composition>
