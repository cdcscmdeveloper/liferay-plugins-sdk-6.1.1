<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div class="ppRightBtn">
			<c:if test="#{committeBackingBean.managedBean.taskId eq null}">
				<p:commandButton value="#{lbl['lbl.so.save']}"
					action="#{committeBackingBean.saveCommitteDetails}" process="@all"
					icon="ui-icon-save" />
				<p:commandButton value="#{lbl['lbl.so.submit']}"
					action="#{committeBackingBean.submitCommitteDetails}"
					process="@all" icon="ui-icon-submit" />
				<!-- <p:button value="#{lbl['lbl.so.cancelbtn']}" style="float:right;margin-right: 12px;" icon="ui-icon-cancel"  /> -->
			</c:if>
		</div>
	</p:panel>
</ui:composition>
