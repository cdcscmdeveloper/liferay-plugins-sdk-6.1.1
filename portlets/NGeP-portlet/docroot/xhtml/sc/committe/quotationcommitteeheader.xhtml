<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 130px"><h:outputLabel
							value="#{lbl['lbl.so.ptj.name']}" /></td>
					<td><p:inputText
							value="#{committeBackingBean.managedBean.qt.pmOrgProfile.orgName}"
							disabled="true" size="30" /></td>
					<td style="width: 210px"><h:outputLabel
							value="#{lbl['lbl.so.crtdt']}" /></td>
					<td><p:inputText
							value="#{committeBackingBean.managedBean.qt.createdDate}"
							disabled="true" size="30">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText></td>
					<td style="width: 198px"><h:outputLabel
							value="#{lbl['lbl.so.status']}" /></td>
					<td><p:inputText
							value="#{committeBackingBean.getStatusDescById(committeBackingBean.managedBean.qt.qtStatus.statusId)}"
							disabled="true" size="30" /></td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
