<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="Add2" position="top" resizable="false"
		header="#{lbl['lbl.sc.add']} #{committeBackingBean.managedBean.headerTitle}"
		width="1060" height="600" widgetVar="screen3" modal="true"
		styleClass="addQCMember">
		<p:messages id="committeemessagesid" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false"
			severity="error, info" />
		<h:panelGroup id="newProfile" style="width:100%;margin-top:10px;">
			<c:if
				test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'E' }">
				<p:panel id="userTblid" header="#{lbl['lbl.btn.search']}"
					toggleable="true">
					<table style="width: 100%;">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /></td>
							<td colspan="3"><p:inputText
									value="#{committeBackingBean.managedBean.userQCSearchBean.name}"
									size="64" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.id.type']}" /></td>
							<td colspan="3"><p:selectOneMenu
									value="#{committeBackingBean.managedBean.userQCSearchBean.identificationType}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.identification.no']}" /></td>
							<td colspan="3"><p:inputText
									value="#{committeBackingBean.managedBean.userQCSearchBean.identificationNo}"
									size="30" /></td>
						</tr>
					</table>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							styleClass="BtnSpacing"
							action="#{committeBackingBean.searchUserAction}"
							update="userexistid" process="@parent, userTblid" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							styleClass="BtnSpacing" action="#{committeBackingBean.reset}"
							update="userTblid" resetValues="true" partialSubmit="true"
							process="@this" />
					</div>
				</p:panel>
				<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
					<p:dataTable id="userexistid"
					    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{committeBackingBean.managedBean.userSearchQCDataModel}"
						selection="#{committeBackingBean.managedBean.selectedPmUser}"
						rowKey="#{existcommitteeuser.userId}" var="existcommitteeuser"
						lazy="true" styleClass="committeeResults" style="width : 100%;"
						rows="10">

						<ac:paginator for="userexistid" />

						<p:column selectionMode="multiple" style="width:2%"
							disabledSelection="#{committeeMember.memberRole.parameterCode eq 
														ParameterConst.committeeRoleSecretary}" />

						<p:column headerText="#{lbl['lbl.sc.name']}">
							<h:outputText value="#{existcommitteeuser.userName}"
								style="white-space: normal;" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.identification.no']}">
							<h:outputText value="#{existcommitteeuser.identificationNo}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.designation']}">
							<h:outputText value="#{existcommitteeuser.designation}"
								style="white-space: normal;" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.email']}">
							<h:outputText value="#{existcommitteeuser.email}"
								style="white-space: normal;" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.grade']}">
							<h:outputText value="#{existcommitteeuser.grade}" />
						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.pnp']}" />
								<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
							</f:facet>
							<h:outputText
								value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.role']}">
							#{committeBackingBean.getRoleDesc(existcommitteeuser)}
						</p:column>
					</p:dataTable>
				</p:panel>
			</c:if>
			<c:if
				test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'N' }">
				<p:panel header="New #{committeBackingBean.managedBean.headerTitle}"
					toggleable="true">
					<table>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td colspan="3"><p:inputText id="name" required="true"
									label="#{lbl['lbl.sc.name']}"
									value="#{committeBackingBean.managedBean.committeMember.memberName}"
									size="30" maxlength="50" /> <p:message id="nameMsg" for="name"
									display="icon" /></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.id.type']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneMenu id="idtype" required="true"
									label="#{lbl['lbl.sc.id.type']}"
									value="#{committeBackingBean.managedBean.committeMember.idType}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
								</p:selectOneMenu> <p:message id="idtypeMsg" for="idtype" display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td style="width: 140px;"><p:outputLabel
									value="#{lbl['lbl.sc.identification.no']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="idno" required="true"
									label="#{lbl['lbl.sc.identification.no']}"
									value="#{committeBackingBean.managedBean.committeMember.icPassport}"
									size="30" maxlength="15" /> <p:message id="idnoMsg" for="idno"
									display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.grade']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="gradeid" required="true"
									label="#{lbl['lbl.sc.grade']}"
									value="#{committeBackingBean.managedBean.committeMember.grade}"
									size="30" maxlength="10" /> <p:message id="gradeidMsg"
									for="gradeid" display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.pnp']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:selectOneRadio id="pnpid" required="true"
									label="#{lbl['lbl.sc.pnp']}"
									value="#{committeBackingBean.managedBean.committeMember.PNP}">
									<f:selectItem itemLabel="Yes" itemValue="true" />
									<f:selectItem itemLabel="No" itemValue="false" />
								</p:selectOneRadio> <p:message id="pnpidMsg" for="pnpid" display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.designation']}" />
								<p:outputLabel value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="designationid" required="true"
									label="#{lbl['lbl.sc.designation']}"
									value="#{committeBackingBean.managedBean.committeMember.designation}"
									size="30" maxlength="50" /> <p:message id="designationidMsg"
									for="designationid" display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="emailid" required="true"
									label="#{lbl['lbl.sc.email']}"
									value="#{committeBackingBean.managedBean.committeMember.email}"
									size="30" maxlength="80" /> <p:message id="emailidMsg"
									for="emailid" display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.role']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td colspan="3"><p:selectOneMenu id="role" required="true"
									label="#{lbl['lbl.sc.role']}"
									value="#{committeBackingBean.managedBean.committeMember.memberRole.parameterId}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{committeBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
								</p:selectOneMenu> <p:message id="roleMsg" for="role" display="icon" /></td>
						</tr>
					</table>
				</p:panel>
			</c:if>
		</h:panelGroup>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing"
				process="@this, newProfile" update="@(.committeMemberDtls)"
				actionListener="#{committeBackingBean.okQCCommitteeAction}" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
				oncomplete="screen3.hide();" styleClass="BtnSpacing"/>
		</div>
	</p:dialog>
</ui:composition>
