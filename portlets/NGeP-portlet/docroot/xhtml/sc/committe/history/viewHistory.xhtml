<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<!-- 25037 start -->
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
				action="#{committeBackingBean.viewHistoryBackAction}" />
		</div>
		<!-- 25037 end -->
		<ui:include src="../quotationcommitteeheader.xhtml" />
				<!-- 25037 start -->
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="#{CommonUIConstant.imagePath}/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="viewHistoryMsg" showDetail="true" showSummary="false"
			autoUpdate="true" closable="true" severity="error, info" />
		<ac:committeeHistoryPanel
			historyPaginator="#{committeBackingBean.managedBean.historyPaginator}"
			selectedHistory="#{committeBackingBean.managedBean.selectedCommitteeHistory}"
			memberHistoryPaginator="#{committeBackingBean.managedBean.memberHistoryPaginator}"
			onSelectHistory="onSelectHistory"
			committeeName="#{committeBackingBean.managedBean.currentCommitteeType}"
			backingBean="#{committeBackingBean}" isSFCommittee="true"
			isLegacy="true" />
		<!-- 25037 end -->
	</ui:define>
</ui:composition>
