<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.btn.search']}" toggleable="true"
		id="qtsearchid">
		<table>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.committe.title']}" /></td>
				<td colspan="3"><p:inputTextarea
						value="#{committeBackingBean.managedBean.qtnTenderSearchBean.qtTitle}"
						cols="120" rows="2" style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.committe.qtntenderno']}" /></td>
				<td><p:inputText
						value="#{committeBackingBean.managedBean.qtnTenderSearchBean.qtNo}"
						size="30" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.committe.datecreated']}" /></td>
				<td><p:calendar
						value="#{committeBackingBean.managedBean.qtnTenderSearchBean.fromCreatedDate}"
						id="crdateFrm" showOn="button" size="30" readonlyInput="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.committe.recordstatus']}" /></td>
				<td><p:selectOneMenu
						value="#{committeBackingBean.managedBean.qtnTenderSearchBean.qtStatus}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItem itemLabel="Active" itemValue="1" />
						<f:selectItem itemLabel="Non-Active" itemValue="2" />
					</p:selectOneMenu></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.committe.comtyep']}" /></td>
				<td><p:selectOneMenu
						value="#{committeBackingBean.managedBean.qtnTenderSearchBean.committeeType}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItems
							value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.scCommitteeType)}" />
					</p:selectOneMenu></td>
				<td />
				<td />
			</tr>
		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
				action="#{committeBackingBean.searchQTAction}" update="searchQTs"
				icon="ui-icon-search" process="@this, qtsearchid" />
			<p:commandButton value="#{lbl['lbl.so.reset']}"
				action="#{committeBackingBean.resetSearchDetails}"
				update="qtsearchid" icon="ui-icon-reset" resetValues="true"
				partialSubmit="true" process="@this" />
		</div>
	</p:panel>

	<p:panel header="#{lbl['lbl.so.qtlist']}" toggleable="true">
		<p:dataTable id="searchQTs"
			value="#{committeBackingBean.managedBean.searchQTDataModel}"
			var="scqtcommittee" rowIndexVar="index" lazy="true">

			<ac:paginator for="searchQTs" />

			<p:column
				headerText="#{lbl['lbl.sc.committe.resulttable.qtntenderno']}"
				style="width:15%;">
				<h:outputText value="#{scqtcommittee.scQt.qtNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.resulttable.title']}">
				<h:outputText value="#{scqtcommittee.scQt.qtTitle}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.resulttable.comtype']}"
				style="width:15%;">
				<h:outputText
					value="#{scqtcommittee.scCommittee.committeeType.parameterCode}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.resulttable.datecreated']}"
				style="width:10%;">
				<h:outputText value="#{scqtcommittee.scQt.createdDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.resulttable.recstatus']}"
				style="width:10%">
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.resulttable.action']}"
				style="width:6%">
				<p:commandLink
					action="#{committeBackingBean.editAction(scqtcommittee)}"
					style="margin-right:20px;" partialSubmit="true" process="@this">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
