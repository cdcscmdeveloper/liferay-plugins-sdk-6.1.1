<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"	
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Committee Details" toggleable="true">

		<h:panelGroup style="width:100%;">
			<p:dataTable id="committeSecretary"
				value="#{CommitteBackingBean.managedBean.committemembers}"
				var="committesecretary" resizableColumns="true" editable="true">
 		        <ac:paginator for="committeSecretary" /> 
				<p:ajax event="rowEdit" />
				<p:ajax event="rowEditCancel" />

				<p:column headerText="#{lbl['lbl.sc.committe.fctable.detailssecname']}">
					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="#{lbl['lbl.sc.committe.fctable.detailscomtype']}" />
						</f:facet>
						<f:facet name="input">
							<p:selectOneMenu value="#{committeBackingBean.managedBean.qtno}">
								<f:selectItem itemLabel="Select One" itemValue="" />
								<f:selectItem itemLabel="Existing record" itemValue="1" />
								<f:selectItem itemLabel="New record" itemValue="2" />
							</p:selectOneMenu>
						</f:facet>
					</p:cellEditor>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.fctable.detailscomtype']}">
					<p:selectOneMenu value="#{committesecretary.number}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItem itemLabel="QC" itemValue="1" />
						<f:selectItem itemLabel="PBB" itemValue="2" />
						<f:selectItem itemLabel="PBA" itemValue="3" />
						<f:selectItem itemLabel="FBP Sabah" itemValue="4" />
						<f:selectItem itemLabel="FBP Sarawak" itemValue="5" />
					</p:selectOneMenu>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.committe.fctable.detailsorgtype']}">
					<h:outputText  />

				</p:column>				
			</p:dataTable>
		</h:panelGroup>

	</p:panel>
</ui:composition>
