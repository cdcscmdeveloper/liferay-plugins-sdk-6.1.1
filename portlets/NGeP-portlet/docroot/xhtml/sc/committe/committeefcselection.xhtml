<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{committeBackingBean.managedBean.headerTitle}"
		toggleable="true" styleClass="committeMemberDtls">
		<div align="right">
			<p:commandButton value="View History"
				action="#{committeBackingBean.viewHistoryAction(committeBackingBean.managedBean.qtCommittee)}" />
		</div>
		<p:dataTable id="fcMembers" rowKey="#{committeemember}"
			value="#{committeBackingBean.managedBean.qtCommittee.scCommittee.scCommitteeMembers}"
			var="committeemember" rowIndexVar="index" editable="true"
			selection="#{committeBackingBean.managedBean.selectedCommitteMemebers}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="fcMembers" />

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsname']}">
				<h:outputText value="#{committeemember.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsicno']}"
				style="width: 10%">
				<h:outputText value="#{committeemember.icPassport}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.sctable.details.desidnation']}"
				style="width: 30%">
				<h:outputText value="#{committeemember.designation}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.sctable.details.email']}"
				style="width: 15%">
				<h:outputText value="#{committeemember.email}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.sctable.details.grade']}"
				style="width: 8%">
				<h:outputText value="#{committeemember.grade}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.details.pp']}"
				style="width: 5%">
				<h:outputText
					value="#{lbl[committeemember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsrole']}"
				style="width: 10%">

				<h:outputText
					value="#{committeBackingBean.getParameterDesc(committeemember.memberRole)}" />

			</p:column>


			<p:column style="width: 15%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.committe.sctable.rep.type']}" />
				</f:facet>
				<ui:fragment
					rendered="#{committeemember.memberRole.parameterCode eq 'M'}">
					<p:selectOneMenu required="true" id="representativeType"
						value="#{committeemember.representativeType.parameterId}"
						label="#{lbl['lbl.sc.committe.representive']}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItems
							value="#{committeBackingBean.managedBean.representativesTypeslist}" />
						<p:ajax event="change"
							listener="#{committeBackingBean.representiveTypeChange(committeemember)}"
							partialSubmit="true" process="@this"></p:ajax>
					</p:selectOneMenu>
					<p:message id="representiveMsg" for="representativeType"
						display="icon"></p:message>

				</ui:fragment>

			</p:column>
		</p:dataTable>
		<h:panelGroup>
			<div class="ppRightBtn">
				<p:commandButton id="quotationcommitteeadd"
					value="#{lbl['lbl.so.addbtn']}" process="@this"
					action="#{committeBackingBean.addCommitteMember(committeBackingBean.managedBean.headerTitle)}"
					oncomplete="screen3.show();" update="@(.addQCMember)" />

				<p:commandButton value="#{lbl['lbl.so.delete']}"
					process="@this, fcMembers"
					action="#{committeBackingBean.deleteCommitteeAction}"
					update="fcMembers" />
			</div>
		</h:panelGroup>
	</p:panel>
	<ui:include src="/xhtml/sc/committe/committeetenderscreen.xhtml" />
</ui:composition>
