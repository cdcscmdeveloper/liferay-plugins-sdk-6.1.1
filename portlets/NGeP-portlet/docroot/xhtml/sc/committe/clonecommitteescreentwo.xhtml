<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Clone2" header="Clone XXXX" widgetVar="screen4" modal="true" appendToBody="true">
		<p:panel header="Search Qtn/Tender" toggleable="true">

			<p:panelGrid columns="4" style="width:245%;" styleClass="noBorders tr,noBorders td">
				
				<h:outputText value="Title"></h:outputText>
            	 <p:inputText size="80"/>
            	 
            </p:panelGrid>
    
     <p:panelGrid columns="4"  style="width:100%;"  styleClass="noBorders tr,noBorders td">
     
				<h:outputText value="Qtn/Tender No" ></h:outputText>
            	 <p:inputText />
            	 
				<h:outputText value="Qtn/Tender Type"></h:outputText>
					<p:selectOneMenu value="#{CommitteBackingBean.managedBean.qttype}">  
    	             <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />  
                     <f:selectItem itemLabel="Active" itemValue="1" /> 
                     <f:selectItem itemLabel="Non-Active" itemValue="1" />  
    			    </p:selectOneMenu>             	 

				 <h:outputText value="Created Date (From)" />
				  <p:calendar value="#{CommitteBackingBean.managedBean.dateCreatedF}" 
					showOn="button" />

				<h:outputText value="Created Date (To)" />
				  <p:calendar value="#{CommitteBackingBean.managedBean.dateCreatedT}" showOn="button" />                
			           
			</p:panelGrid>

		<p:commandButton value="SEARCH"
			styleClass="apply_button" style="float:right;">

		</p:commandButton>
		
		<br/>

		</p:panel>
<br/>

		<p:panel header="Search Committee" toggleable="true">
		   <h:panelGroup  style="width:100%;">
				<p:dataTable value="#{CommitteBackingBean.managedBean.supplierItemList}" 
				   emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				   var="committesearch" editable="true">
				
				  <p:ajax event="rowEdit" />  
                  <p:ajax event="rowEditCancel" /> 

					<p:column headerText="No" style="width:5px">
					  <p:outputLabel value="#{committesearch.qtNo}" />
					</p:column>

					<p:column headerText="Title" style="width:15px;">
				      <p:cellEditor>  
                       <f:facet name="output">  
                        <h:outputText value="#{committesearch.qtTitle}" />
                     </f:facet>  
                      <f:facet name="input">  
                       <p:inputText value=""/>  
                     </f:facet>  
                    </p:cellEditor>   
					</p:column>

					<p:column headerText="Date Created" style="width:5px">  
                        <h:outputText value="#{committesearch.dateCreated}" />  
                    </p:column>
                    
					<p:column headerText="Action" style="width:2px">  
                       <p:commandButton id="selectButton" update=":form:display" value ="#{lbl['lbl.btn.clone']}" title="View" />   
                    </p:column>                    
                                                           
		       </p:dataTable>	
			</h:panelGroup>	
		</p:panel>
		<br/>
		
		<p:panel header="Clone Committee Result" toggleable="true">
		   <h:panelGroup style="width:100%;">
				<p:dataTable value="#{CommitteBackingBean.managedBean.supplierItemList}"
				    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" 
				    var="committeresult" editable="true" >

					<p:column selectionMode="multiple">
					   <p:selectBooleanCheckbox />
					</p:column>

					<p:column headerText="Name">
					   <h:outputText value="#{committeclonetwo.memberName}" />
					</p:column>

					 <p:column headerText="Ministry" >  
                        <h:outputText value="#{committeclonetwo.ministry}" />  
                     </p:column>  
                      
                    <p:column headerText="Division" >  
                       <h:outputText value="#{committeclonetwo.division}" />  
                    </p:column>  
                    
                    <p:column headerText="Designation" >  
                       <h:outputText value="#{committeclonetwo.designation}" />  
                    </p:column>  
                    
                    <p:column headerText="Role" >  
                       <h:outputText value="#{committeclonetwo.role}" />  
                    </p:column>                                          
            
		       </p:dataTable>	
				<p:commandButton value="CANCEL"  style="float:right;" onclick="screen4.hide();"></p:commandButton>		       		       				
				<p:commandButton value="CLONE"  style="float:right;" onclick="screen4.hide();"></p:commandButton>
			</h:panelGroup>
		</p:panel>		
	</p:dialog>
</ui:composition>
