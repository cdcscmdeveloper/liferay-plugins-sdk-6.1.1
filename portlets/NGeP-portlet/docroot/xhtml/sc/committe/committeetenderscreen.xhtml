<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="Search Qtn/Tender" widgetVar="screen5" modal="true"  styleClass="qtCount"> 
<p:panel>
<h:panelGroup  style="width:100%;">
				<p:dataTable value="#{committeBackingBean.managedBean.scQt}" var="qt" >
								 

					<p:column headerText="Qtn/Tender No" style="width:2px">
					  <p:outputLabel value="#{qt.qtNo}" />
					</p:column>

					<p:column headerText="Title" style="width:10px;">
				     
                        <h:outputText value="#{qt.qtTitle}" />
                      
					</p:column>

					<p:column headerText="Procurement Mode" style="width:5px">  
                        <h:outputText value="#{qt.procurementMode}" />  
                    </p:column>
                    
					<p:column headerText="Date Created" style="width:5px">  
                        <h:outputText value="#{qt.createdDate}" />  
                    </p:column>                       
                      
		            
            
		       </p:dataTable>	
			</h:panelGroup>	
		<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="Total: " />
                <p:inputText value="#{committeBackingBean.managedBean.scQt.size()}" readonly="true"></p:inputText>

		</p:panelGrid>	
		<p:commandButton value="CANCEL"  style="float:right;" onclick="screen5.hide();"></p:commandButton>
		</p:panel>
	</p:dialog>
</ui:composition>
