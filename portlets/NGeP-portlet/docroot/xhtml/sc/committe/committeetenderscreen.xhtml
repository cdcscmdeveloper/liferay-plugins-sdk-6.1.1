<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
		<p:dataTable
			value="#{committeBackingBean.managedBean.scCommittee.scQtCommittees}"
			var="qt">

			<p:column headerText="#{lbl['lbl.sc.qtn.no']}" style="width:15%">
				<h:outputText value="#{qt.scQt.qtNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.title']}" style="width:10px;">

				<h:outputText value="#{qt.scQt.qtTitle}" />

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.procurement.mode']}" style="width:10%">
				<h:outputText
					value="#{committeBackingBean.getParameterDesc(qt.scQt.procurementMode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.date']}" style="width:10%">
				<h:outputText value="#{qt.scQt.createdDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:10%">
				<h:outputText
					value="#{committeBackingBean.getStatusDescById(qt.scQt.qtStatus.statusId)}" />
			</p:column>

		</p:dataTable>
		<table style="width: 100%">
			<tr>
				<td style="width: 2px"><p:outputLabel value="#{lbl['lbl.sc.total']}" /></td>
				<td colspan="3"><p:inputText
						value="#{committeBackingBean.managedBean.scCommittee.scQtCommittees.size()}"
						readonly="true" style="text-align: right;" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
