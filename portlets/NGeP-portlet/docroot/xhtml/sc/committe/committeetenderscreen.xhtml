<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.so.qtlist']}" toggleable="true">
		<p:dataTable value="#{committeBackingBean.managedBean.scQt}" var="qt">

			<p:column headerText="#{lbl['lbl.so.qtnno']}" style="width:15%">
				<h:outputText value="#{qt.qtNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.title']}" style="width:10px;">

				<h:outputText value="#{qt.qtTitle}" />

			</p:column>

			<p:column headerText="#{lbl['lbl.so.procmode']}" style="width:10%">
				<h:outputText
					value="#{committeBackingBean.getParameterDesc(qt.procurementMode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.crtdt']}" style="width:10%">
				<h:outputText value="#{qt.createdDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.so.status']}" style="width:10%">
				<h:outputText
					value="#{committeBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" />
			</p:column>

		</p:dataTable>
		<p:spacer height="3" />
		<table style="width: 100%">
			<tr>
				<td style="width: 2px"><p:outputLabel value="Total" /></td>
				<td colspan="3"><p:inputText
						value="#{committeBackingBean.managedBean.scQt.size()}"
						readonly="true" /></td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
