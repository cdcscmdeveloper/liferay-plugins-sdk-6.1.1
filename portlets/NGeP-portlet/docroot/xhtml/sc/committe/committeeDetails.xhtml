<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="isCommitteeRecordStatusActive" value="#{committeBackingBean.isCommitteeRecordStatusActive(committeBackingBean.managedBean.scCommittee)}" />

	<c:if
		test="#{committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeOpeningCommittee or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeEvaluationCommittee or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeTechnicalEvaluationCommittee or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeFinancialEvaluationCommittee}">
		
		<ui:fragment rendered="#{committeBackingBean.managedBean.scCommittee.committeStatus.statusId eq QTStatusConst.CMT_COMPLETED}">
			<ui:include src="committeeButtons.xhtml" />
		</ui:fragment>
		<ui:include src="committeeHeader.xhtml" />
		<ui:include src="committeeqcselection.xhtml" />
		<ui:include src="committeeaddscreen.xhtml" />
	</c:if>

	<ui:remove>#35320 - Start</ui:remove>
	<c:if
		test="#{committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeQuotationCommitteeB or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeQuotationCommitteeA or
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeProcurementBoardB or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeProcurementBoardA or
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeProcurementBoard or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeFederalProcurementBoardSbh or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeFederalProcurementBoardSwk or
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeQuotationCommittee}">
	<ui:remove>#35320 - End</ui:remove>
		<ui:include src="committeeButtons.xhtml" />
	
		<ui:include src="committeeHeader.xhtml" />
		<ui:include src="committeeFCselection.xhtml" />
		<ui:include src="committeeFcAddScreen.xhtml"/>
	</c:if>

	<c:if
		test="#{committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeBusinessOwner or 
			committeBackingBean.managedBean.scCommittee.committeeType.parameterCode eq ParameterConst.committeeTypeSpecificationCommittee}">
		<ui:include src="/xhtml/sc/committe/committeeScreen.xhtml" />
		<ui:include src="committeeaddscreen.xhtml" />
	</c:if>

</ui:composition>
