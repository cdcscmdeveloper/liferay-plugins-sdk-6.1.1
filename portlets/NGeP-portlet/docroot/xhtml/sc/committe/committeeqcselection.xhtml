<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{committeBackingBean.managedBean.headerTitle}"
		toggleable="true" styleClass="committeMemberDtl">
		<p:dataTable id="committeMembersListId"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{committeBackingBean.managedBean.qtCommittee.scCommittee.scCommitteeMembers}"
			var="committeemember" rowIndexVar="index" rowKey="#{committeemember}"
			selection="#{committeBackingBean.managedBean.selectedCommitteMemebers}">

			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq QTStatusConst.CMT_COMPLETED}" />

			<ac:paginator for="committeMembersListId" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<h:outputText value="#{committeemember.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}"
				style="width: 10%">
				<h:outputText value="#{committeemember.icPassport}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.designation']}"
				style="width: 30%">
				<h:outputText value="#{committeemember.designation}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.email']}"
				style="width: 15%">
				<h:outputText value="#{committeemember.email}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.grade']}"
				style="width: 8%">
				<h:outputText value="#{committeemember.grade}" />
			</p:column>

			<p:column style="width: 5%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip id="pnpTT#{index}" value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText value="#{lbl[committeemember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

			<c:if
				test="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId ne QTStatusConst.CMT_COMPLETED}">

				<p:column headerText="#{lbl['lbl.sc.role']}"
					style="width: 10%">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(committeemember.memberRole)}" />
				</p:column>
			</c:if>
			<c:if
				test="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq QTStatusConst.CMT_COMPLETED}">
				<p:column headerText="#{lbl['lbl.sc.role']}"
					style="width: 10%">
					<p:selectOneMenu value="#{committeemember.memberRoleId}"
						style="width: 110px;margin-bottom: 5px;">
						<f:selectItems
							value="#{committeBackingBean.getRoleTypeDropdownValuesBasedOnPTJ(committeemember.PNP,committeBackingBean.managedBean.qtCommittee.scQt,committeemember.pmUser)}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{committeBackingBean.roleChangedListener(committeemember)}" />
					</p:selectOneMenu>
				</p:column>
			</c:if>
		</p:dataTable>
		<h:panelGroup
			rendered="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq QTStatusConst.CMT_COMPLETED}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.clone']}"
					action="#{committeBackingBean.cloneCommitteMembersAcition(committeBackingBean.managedBean.headerTitle)}"
					oncomplete="clonecommittee.show();" process="@this"
					update="@(.cloneMember)" />
				<p:commandButton id="committeeadd" value="#{lbl['lbl.btn.add']}"
					process="@this"
					action="#{committeBackingBean.addCommitteMember(committeBackingBean.managedBean.headerTitle)}"
					oncomplete="newcommittees.show();" update="@(.addCommitteeMember)" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					process="@this, committeMembersListId"
					action="#{committeBackingBean.deleteCommitteeAction}"
					update="committeMembersListId" />
			</div>
		</h:panelGroup>
	</p:panel>
	
	<c:if test="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq QTStatusConst.CMT_COMPLETED}">
		<ac:scRemarkAndAttachment
			remarkList="#{committeBackingBean.managedBean.scCommitteeRemarksList}"
			showAttachment="false" />
	</c:if>

</ui:composition>
