<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{committeBackingBean.managedBean.headerTitle}"
		toggleable="true" styleClass="committeMemberDtl">
		<p:dataTable id="committeMembersListId"
			value="#{committeBackingBean.managedBean.qtCommittee.scCommittee.scCommitteeMembers}"
			var="committeemember" rowIndexVar="index" rowKey="#{committeemember}"
			selection="#{committeBackingBean.managedBean.selectedCommitteMemebers}">

			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq '60202'}" />

			<ac:paginator for="committeMembersListId" />

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsname']}">
				<h:outputText value="#{committeemember.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsicno']}"
				style="width: 10%">
				<h:outputText value="#{committeemember.icPassport}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.sctable.details.desidnation']}"
				style="width: 30%">
				<h:outputText value="#{committeemember.designation}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.sctable.details.email']}"
				style="width: 15%">
				<h:outputText value="#{committeemember.email}" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.committe.sctable.details.grade']}"
				style="width: 8%">
				<h:outputText value="#{committeemember.grade}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.sctable.details.pp']}"
				style="width: 5%">
				<h:outputText value="#{committeemember.PNP ? 'Yes' : 'No'}" />
			</p:column>

			<c:if
				test="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId.intValue() ne 60202}">

				<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsrole']}"
					style="width: 10%">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(committeemember.memberRole)}" />
				</p:column>
			</c:if>
			<c:if
				test="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId.intValue() eq 60202}">
				<p:column headerText="#{lbl['lbl.sc.committe.sctable.detailsrole']}"
					style="width: 10%">
					<ui:fragment rendered="#{committeemember.PNP}">
						<h:outputText value="Chairperson"
							rendered="#{committeemember.memberRole.parameterCode eq 'C'}" />
					</ui:fragment>
					<ui:fragment rendered="#{!committeemember.PNP}">
						<p:selectOneMenu value="#{committeemember.memberRole.parameterId}"
							style="width: 110px;margin-bottom: 5px;">
							<f:selectItems
								value="#{committeBackingBean.managedBean.roleTypes}" />
						</p:selectOneMenu>
					</ui:fragment>
				</p:column>
			</c:if>
		</p:dataTable>
		<h:panelGroup
			rendered="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq '60202'}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.clonebtn']}"
					action="#{committeBackingBean.cloneCommitteMembersAcition(committeBackingBean.managedBean.headerTitle)}"
					oncomplete="clonecommittee.show();" process="@this"
					icon="ui-icon-clone" update="@(.cloneMember)" />
				<p:commandButton id="committeeadd" value="#{lbl['lbl.so.addbtn']}"
					process="@this" icon="ui-icon-add"
					action="#{committeBackingBean.addCommitteMember(committeBackingBean.managedBean.headerTitle)}"
					oncomplete="newcommittees.show();" update="@(.addCommitteeMember)" />
				<p:commandButton value="#{lbl['lbl.so.delete']}"
					icon="ui-icon-delete" process="@this, committeMembersListId"
					action="#{committeBackingBean.deleteCommitteeAction}"
					update="committeMembersListId" />
			</div>
		</h:panelGroup>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.qt.remark']}" toggleable="true"
		rendered="#{committeBackingBean.managedBean.qtCommittee.scCommittee.committeStatus.statusId eq '60202'}">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid
						value="#{committeBackingBean.managedBean.scCommitteeRemarksList}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{committeBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
