<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newcommitteeseids" position="top" resizable="false"
		header="New #{committeBackingBean.managedBean.headerTitle}"
		width="970" widgetVar="newcommittees" modal="true"
		styleClass="addCommitteeMember">
		<p:panel>
			<p:messages id="committeemessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<h:panelGrid columns="3" styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="*" styleClass="mandatory" />
				<h:outputLabel value="#{lbl['lbl.sc.committe.addscreen.selection']}" />
				<p:selectOneRadio id="selectionradio"
					value="#{committeBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{committeBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{committeBackingBean.userSelcetionAction}"
						update="newCommitteeProfile" />
				</p:selectOneRadio>
				<p:message id="selectionradioMsg" for="selectionradio"
					display="icon" />
			</h:panelGrid>
			<p:panel id="newCommitteeProfile" style="width:100%;margin-top:10px;">
				<c:if
					test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel id="userPnlid" header="#{lbl['lbl.so.searchbtn']}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{committeBackingBean.managedBean.userQCSearchBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td style="width: 110px;"><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{committeBackingBean.managedBean.userQCSearchBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td colspan="3"><p:inputText
										value="#{committeBackingBean.managedBean.userQCSearchBean.identificationNo}"
										size="30" /></td>
							</tr>
						</table>
					</p:panel>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
							action="#{committeBackingBean.existingCommitteeSearchAction}"
							update="existingsearchid" icon="ui-icon-search"
							process="@parent, userPnlid" />
						<p:commandButton value="#{lbl['lbl.so.reset']}"
							action="#{committeBackingBean.reset}" update="userPnlid"
							icon="ui-icon-reset" resetValues="true" partialSubmit="true"
							process="@this" />
					</div>
					<p:spacer height="5" />
					<p:panel header="#{lbl['lbl.so.result']}" toggleable="true">
						<p:dataTable id="existingsearchid"
							value="#{committeBackingBean.managedBean.userSearchQCDataModel}"
							selection="#{committeBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existcommitteeuser}" var="existcommitteeuser"
							lazy="true" styleClass="existingCommitteeResults"
							style="width : 933px;">

							<ac:paginator for="existingsearchid" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.so.bo.name']}">
								<h:outputText value="#{existcommitteeuser.userName}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
								<h:outputText value="#{existcommitteeuser.identificationNo}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.so.bo.designation']}">
								<h:outputText value="#{existcommitteeuser.designation}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.so.bo.email']}">
								<h:outputText
									value="#{existcommitteeuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.so.bo.grade']}">
								<h:outputText value="#{existcommitteeuser.grade}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.so.bo.pp']}">
								<h:outputText
									value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
							</p:column>
							<p:column headerText="#{lbl['lbl.so.role']}">
								<ui:fragment rendered="#{existcommitteeuser.PMP == true}">
									<h:outputText value="Chairperson" />
								</ui:fragment>
								<ui:fragment rendered="#{existcommitteeuser.PMP == false}">
									<p:selectOneMenu id="appaction"
										value="#{existcommitteeuser.memberRole.parameterId}"
										style="width: 110px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.managedBean.roleTypes}" />
									</p:selectOneMenu>
								</ui:fragment>
							</p:column>
						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel
						header="New #{committeBackingBean.managedBean.headerTitle}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.name']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="names" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.name']}"
										value="#{committeBackingBean.managedBean.committeMember.memberName}"
										size="30" maxlength="50" /> <p:message id="namesMsg"
										for="names" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneMenu id="idtypes" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.idtype']}"
										value="#{committeBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu> <p:message id="idtypesMsg" for="idtypes" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td style="width: 140px;"><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idno']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="idNos" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.idno']}"
										value="#{committeBackingBean.managedBean.committeMember.icPassport}"
										size="30" maxlength="15" /> <p:message id="idNosMsg"
										for="idNos" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.grade']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="gradesid" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.grade']}"
										value="#{committeBackingBean.managedBean.committeMember.grade}"
										size="30" maxlength="10" /> <p:message id="gradesidMsg"
										for="gradesid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.pp']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneRadio id="pnpsid" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.pp']}"
										value="#{committeBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio> <p:message id="pnpsidMsg" for="pnpsid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.designation']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="designationsid" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.designation']}"
										value="#{committeBackingBean.managedBean.committeMember.designation}"
										size="30" maxlength="50" /> <p:message id="designationsidMsg"
										for="designationsid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.email']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="emailsid" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.email']}"
										value="#{committeBackingBean.managedBean.committeMember.email}"
										size="30" maxlength="80" /> <p:message id="emailsidMsg"
										for="emailsid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.role']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:selectOneMenu id="roles" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.role']}"
										value="#{committeBackingBean.managedBean.committeMember.memberRole.parameterId}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu> <p:message id="rolesMsg" for="roles" display="icon" /></td>
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					onclick="newcommittees.hide();" update="@(.committeMemberDtl)"
					process="@this, newCommitteeProfile" icon="ui-icon-check"
					actionListener="#{committeBackingBean.okCommitteeAction}" />

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" process="@this"
					oncomplete="newcommittees.hide();" icon="ui-icon-cancel" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
