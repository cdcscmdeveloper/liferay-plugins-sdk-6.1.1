<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newcommitteeseids"
		header="New #{committeBackingBean.managedBean.headerTitle}"
		widgetVar="newcommittees" modal="true" position="top">
		<p:panel styleClass="addCommitteeMember">
			<p:messages id="committeemessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" />
			<h:panelGrid columns="3" styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="*" styleClass="mandatory" />
				<h:outputLabel value="#{lbl['lbl.sc.committe.addscreen.selection']}" />
				<p:selectOneRadio id="selectionradio"
					value="#{committeBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{committeBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{committeBackingBean.userSelcetionAction}"
						update="newCommitteeProfile" />
				</p:selectOneRadio>
				<p:message id="selectionradioMsg" for="selectionradio"
					display="icon" />
			</h:panelGrid>

			<p:panel id="newCommitteeProfile" style="width:100%;margin-top:10px;">
				<c:if
					test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel header="#{lbl['lbl.so.searchbtn']}" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{committeBackingBean.managedBean.name}" size="64" /></td>
							</tr>
							<tr>
								<td style="width: 110px;"><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{committeBackingBean.managedBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td colspan="3"><p:inputText
										value="#{committeBackingBean.managedBean.identificationNo}"
										size="30" /></td>
							</tr>
						</table>
					</p:panel>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
							icon="ui-icon-search"
							action="#{committeBackingBean.existingCommitteeSearchAction}"
							update="@(.existingCommitteeResults)" partialSubmit="true"
							process="@parent" />
						<p:commandButton value="#{lbl['lbl.so.reset']}"
							action="#{committeBackingBean.reset}"
							update="newCommitteeProfile" icon="ui-icon-reset"
							resetValues="true" partialSubmit="true" process="@this" />
					</div>
					<p:spacer height="5" />
					<p:panel header="#{lbl['lbl.so.result']}" toggleable="true">
						<p:dataTable id="existingsearchid"
							value="#{committeBackingBean.managedBean.externalUsers}"
							selection="#{committeBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existcommitteeuser}" var="existcommitteeuser"
							styleClass="existingCommitteeResults" style="width : 900px;">

							<ac:paginator for="existingsearchid" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.so.bo.name']}">
								<h:outputText value="#{existcommitteeuser.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
								<h:outputText value="#{existcommitteeuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.designation']}">
								<h:outputText value="#{existcommitteeuser.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.email']}">
								<h:outputText
									value="#{existcommitteeuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.grade']}">
								<h:outputText value="#{existcommitteeuser.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.pp']}">
								<h:outputText value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.role']}">
								<ui:fragment rendered="#{existcommitteeuser.PMP == true}">
									<h:outputText value="Chairperson" />
								</ui:fragment>
								<ui:fragment rendered="#{existcommitteeuser.PMP == false}">
									<p:selectOneMenu id="appaction"
										value="#{existcommitteeuser.memberRole.parameterId}"
										style="width: 110px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.managedBean.roleTypes}" />
									</p:selectOneMenu>
								</ui:fragment>
							</p:column>

						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<table>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.name']}" /></td>
							<td colspan="3"><p:inputText
									value="#{committeBackingBean.managedBean.committeMember.memberName}"
									size="30" /></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /></td>
							<td><p:selectOneMenu id="apptypeaction"
									value="#{committeBackingBean.managedBean.committeMember.idType}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
								</p:selectOneMenu></td>
							<td />
							<td />
						</tr>
						<tr>
							<td style="width: 130px;"><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.idno']}" /></td>
							<td><p:inputText id="idNos"
									value="#{committeBackingBean.managedBean.committeMember.icPassport}"
									size="30" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.grade']}" /></td>
							<td><p:inputText
									value="#{committeBackingBean.managedBean.committeMember.grade}"
									size="30" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.pp']}" /></td>
							<td><p:selectOneRadio
									value="#{committeBackingBean.managedBean.committeMember.PNP}">
									<f:selectItem itemLabel="Yes" itemValue="true" />
									<f:selectItem itemLabel="No" itemValue="false" />
								</p:selectOneRadio></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.designation']}" /></td>
							<td><p:inputText
									value="#{committeBackingBean.managedBean.committeMember.designation}"
									size="30" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.email']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td><p:inputText id="email" required="true"
									label="#{lbl['lbl.sc.committe.addscreen.email']}"
									value="#{committeBackingBean.managedBean.committeMember.email}"
									size="30" maxlength="80" /> <p:message id="emailMsg"
									for="email" display="icon" /></td>
							<td />
							<td />
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.committe.addscreen.role']}" /></td>
							<td><p:selectOneMenu
									value="#{committeBackingBean.managedBean.committeMember.memberRole}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.committeeRole)}" />
								</p:selectOneMenu></td>
							<td />
							<td />
						</tr>

					</table>
				</c:if>
			</p:panel>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					onclick="newcommittees.hide();" update="@(.committeMemberDtl)"
					process="@this, newCommitteeProfile" icon="ui-icon-check"
					actionListener="#{committeBackingBean.okCommitteeAction}" />

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" process="@this"
					oncomplete="newcommittees.hide();" icon="ui-icon-cancel" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
