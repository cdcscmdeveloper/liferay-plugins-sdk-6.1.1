<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newcommitteeseids" position="top" resizable="false"
		header="#{lbl['lbl.sc.add']} #{committeBackingBean.managedBean.headerTitle}"
		width="970" widgetVar="newcommittees" modal="true"
		styleClass="addCommitteeMember">
		<p:panel>
			<p:messages id="committeemessages" showDetail="true"
				autoUpdate="true" closable="true" showSummary="false" severity="error, info" />
			<p:panel id="newCommitteeProfile" style="width:100%;margin-top:10px;">
				<c:if
					test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel id="userPnlid" header="#{lbl['lbl.sc.search']}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{committeBackingBean.managedBean.userQCSearchBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td style="width: 110px;"><p:outputLabel
										value="#{lbl['lbl.sc.id.type']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{committeBackingBean.managedBean.userQCSearchBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" /></td>
								<td colspan="3"><p:inputText
										value="#{committeBackingBean.managedBean.userQCSearchBean.identificationNo}"
										size="30" /></td>
							</tr>
						</table>
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.btn.search']}"
								action="#{committeBackingBean.searchUserAction}"
								update="existingsearchid" 
								process="@this, userPnlid" />
							<p:commandButton value="#{lbl['lbl.btn.reset']}"
								action="#{committeBackingBean.reset}" update="userPnlid"
								resetValues="true" partialSubmit="true"
								process="@this" />
						</div>
					</p:panel>
					<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
						<p:dataTable id="existingsearchid"
							value="#{committeBackingBean.managedBean.userSearchQCDataModel}"
							selection="#{committeBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existcommitteeuser.userId}" var="existcommitteeuser"
							lazy="true" styleClass="existingCommitteeResults"
							sstyle="width : 100%;" rows="10">

							<ac:paginator for="existingsearchid" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.sc.name']}">
								<h:outputText value="#{existcommitteeuser.userName}"
									style="white-space: normal;" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.identification.no']}">
								<h:outputText value="#{existcommitteeuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.designation']}">
								<h:outputText value="#{existcommitteeuser.designation}"
									style="white-space: normal;" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.email']}">
								<h:outputText value="#{existcommitteeuser.email}"
									style="white-space: normal;" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.grade']}">
								<h:outputText value="#{existcommitteeuser.grade}" />
							</p:column>

							<p:column>
								<f:facet name="header">
									<h:outputText value="#{lbl['lbl.sc.pnp']}" />
									<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
								</f:facet>
								<h:outputText
									value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.role']}">
								<p:selectOneMenu id="appaction"
									value="#{existcommitteeuser.memberRole.parameterId}"
									style="width: 110px;margin-bottom: 5px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
										itemValue="#{null}" />
									<f:selectItems var="role"
										value="#{qTCommitteBackingBean.getRoleTypeDropdownValuesBasedOnPTJ(existcommitteeuser.PMP,committeBackingBean.managedBean.qtCommittee.scQt,existcommitteeuser)}"
										itemLabel="#{role.codeName}"
										itemValue="#{role.pmParameter.parameterId}" />

									<p:ajax event="change" partialSubmit="true" />
								</p:selectOneMenu>
							</p:column>
						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{committeBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel
						header="New #{committeBackingBean.managedBean.headerTitle}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.name']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="names" required="true"
										label="#{lbl['lbl.sc.name']}"
										value="#{committeBackingBean.managedBean.committeMember.memberName}"
										size="30" maxlength="50" /> <p:message id="namesMsg"
										for="names" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.id.type']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneMenu id="idtypes" required="true"
										label="#{lbl['lbl.sc.id.type']}"
										value="#{committeBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu> <p:message id="idtypesMsg" for="idtypes" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td style="width: 140px;"><p:outputLabel
										value="#{lbl['lbl.sc.identification.no']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="idNos" required="true"
										label="#{lbl['lbl.sc.identification.no']}"
										value="#{committeBackingBean.managedBean.committeMember.icPassport}"
										size="30" maxlength="15" /> <p:message id="idNosMsg"
										for="idNos" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.grade']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="gradesid" required="true"
										label="#{lbl['lbl.sc.grade']}"
										value="#{committeBackingBean.managedBean.committeMember.grade}"
										size="30" maxlength="10" /> <p:message id="gradesidMsg"
										for="gradesid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.pnp']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneRadio id="pnpsid" required="true"
										label="#{lbl['lbl.sc.pnp']}"
										value="#{committeBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio> <p:message id="pnpsidMsg" for="pnpsid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.designation']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="designationsid" required="true"
										label="#{lbl['lbl.sc.designation']}"
										value="#{committeBackingBean.managedBean.committeMember.designation}"
										size="30" maxlength="50" /> <p:message id="designationsidMsg"
										for="designationsid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.email']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="emailsid" required="true"
										label="#{lbl['lbl.sc.email']}"
										value="#{committeBackingBean.managedBean.committeMember.email}"
										size="30" maxlength="80" /> <p:message id="emailsidMsg"
										for="emailsid" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.role']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:selectOneMenu id="roles" required="true"
										label="#{lbl['lbl.sc.role']}"
										value="#{committeBackingBean.managedBean.committeMember.memberRole.parameterId}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{committeBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu> <p:message id="rolesMsg" for="roles" display="icon" /></td>
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					onclick="newcommittees.hide();" update="@(.committeMemberDtl)"
					process="@this, newCommitteeProfile"
					actionListener="#{committeBackingBean.okCommitteeAction}" />

				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
					oncomplete="newcommittees.hide();"/>
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
