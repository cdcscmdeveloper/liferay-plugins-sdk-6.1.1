<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table width="100%">
		<tr>
			<td align="right">
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{committeBackingBean.viewSearchBackAction}" partialSubmit="true"
					process="@this" update="@this"
					rendered="#{empty qTDetailBB.managedBean.taskId}" />
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					action="#{committeBackingBean.updateCommitteDetails(null)}"
					process="@all" rendered="#{isCommitteeRecordStatusActive}" />
				<ui:repeat var="bpmAction" value="#{committeBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
							process="@all" partialSubmit="true" update="@all"
							action="#{committeBackingBean.updateCommitteDetails(bpmAction)}" />
				</ui:repeat>
			</td>
		</tr>
	</table>
	<!-- <p:button value="#{lbl['lbl.btn.cancel']}" style="float:right;margin-right: 12px;" /> -->

</ui:composition>
