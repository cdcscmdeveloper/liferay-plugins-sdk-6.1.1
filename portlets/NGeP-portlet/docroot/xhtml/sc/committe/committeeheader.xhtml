<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 130px"><h:outputLabel
							value="#{lbl['lbl.so.qtnno']}" /></td>
					<td style="width: 15%" class="header-info-text">
						#{committeBackingBean.managedBean.qt.qtNo}</td>
					<td style="width: 150px"><h:outputLabel
							value="#{lbl['lbl.so.ptj.name']}" /></td>
					<td style="width: 15%" class="header-info-text">
						#{committeBackingBean.managedBean.qt.pmOrgProfile.orgName}</td>
					<td style="width: 190px"><h:outputLabel
							value="#{lbl['lbl.so.status']}" /></td>
					<td style="width: 15%" class="header-info-text">
						#{committeBackingBean.getStatusDescById(committeBackingBean.managedBean.qt.qtStatus.statusId)}
					</td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
