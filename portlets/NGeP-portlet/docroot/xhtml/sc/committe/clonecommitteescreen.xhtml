<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="Clone"
		header="#{lbl['lbl.sc.clone']} #{committeBackingBean.managedBean.headerTitle}"
		widgetVar="clonecommittee" width="950" height="600" position="top"
		styleClass="cloneMember">
		<p:panel id="clonesearchpnlid" header="#{lbl['lbl.sc.search']}"
			toggleable="true">
			<table>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
							size="92" maxlength="100" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td><p:inputText
							value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
							size="30" maxlength="21" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.procurement.mode']}" /></td>
					<td><p:selectOneMenu
							value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar id="datecreatedfrm" showOn="button"
							value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="30" readonlyInput="true">
							<p:ajax event="dateSelect" update="datecreatedto" />
						</p:calendar></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar id="datecreatedto" showOn="button"
							value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
							mindate="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="30" readonlyInput="true">
							<f:attribute name="startDate"
								value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}" />
						</p:calendar></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:selectOneMenu style="width: 178px;margin-bottom: 5px;"
							value="#{committeBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
							<f:selectItems
								value="#{committeBackingBean.getStatusDropdownValues('SC', 'QT')}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{committeBackingBean.cloneSearchQtAction}"
					update="clonesearchCommitteid" process="@this, clonesearchpnlid" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{committeBackingBean.resetClone}"
					update="clonesearchpnlid" resetValues="true"
					partialSubmit="true" process="@this" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
			<p:dataTable id="clonesearchCommitteid"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{committeBackingBean.managedBean.cloneSearchQTDataModel}"
				selection="#{committeBackingBean.managedBean.selectedCloneTender}"
				rowKey="#{scQt}" selectionMode="single" var="scQt" lazy="true"
				styleClass="cloneResults">

				<ac:paginator for="clonesearchCommitteid" />

				<p:ajax event="rowSelect" update=":form:committeelistid"
					listener="#{committeBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.qtn.no']}">
					<h:outputText value="#{scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.created.date']}">
					<h:outputText value="#{scQt.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.status']}">
					<h:outputText
						value="#{committeBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel id="cloneCommitteMembers"
			header="#{committeBackingBean.managedBean.commTypeTitle}"
			toggleable="true">
			<p:dataTable id="committeelistid"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{committeBackingBean.managedBean.cloneCommitteMemebers}"
				var="member" rowKey="#{member.committeeMemberId}"
				selection="#{committeBackingBean.managedBean.selectedCloneCommitteMemebers}"
				styleClass="cloneResults,cloneCommitteMembers"
				rowIndexVar="index">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{member.memberName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{member.icPassport}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText value="#{member.designation}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText
						value="#{member.pmUser.email}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{member.grade}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}" value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText value="#{member.PNP ? 'Yes' : 'No'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.role']}">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(member.memberRole)}" />
				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					action="#{committeBackingBean.okCloneCommitteeMembersAction}"
					oncomplete="clonecommittee.hide();" update="@(.committeMemberDtl)"/>
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				   onclick="clonecommittee.hide();" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
