<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Clone" header="Clone Committe" widgetVar="screen2"
		modal="true">
		<p:panel>
			<p:panelGrid id="search" columns="4" styleClass="noBorders tr,noBorders td">


				<h:outputLabel value="#{lbl['lbl.sc.committe.clone.comno']}" ></h:outputLabel>

				<p:inputText value="#{committeBackingBean.managedBean.committeNo}" size="28"></p:inputText>

				<h:outputLabel value="#{lbl['lbl.sc.committe.clone.qtntender']}"></h:outputLabel>
				<p:inputText value="#{committeBackingBean.managedBean.qtNo}" size="28"></p:inputText>

				<h:outputLabel value="#{lbl['lbl.sc.committe.clone.comtype']}"></h:outputLabel>

				<p:selectOneMenu size="28"
					value="#{committeBackingBean.managedBean.selectedCommitte}">
					<f:selectItems
						value="#{committeBackingBean.managedBean.committeType}"></f:selectItems>
				</p:selectOneMenu>

				<h:outputLabel value="#{lbl['lbl.sc.committe.clone.datecreated']}"></h:outputLabel>
				<p:calendar value="#{committeBackingBean.managedBean.createdDt}" size="28"
					showOn="button" />

				<h:outputLabel value="#{lbl['lbl.sc.committe.clone.comstatus']}" ></h:outputLabel>

				<p:selectOneMenu style="width:192px"
					value="#{committeBackingBean.managedBean.status}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Active" itemValue="1" />
					<f:selectItem itemLabel="Non-Active" itemValue="2" />
				</p:selectOneMenu>

			</p:panelGrid>
			<p:commandButton value="Search" style="float:right;" icon="ui-icon-search"
				action="#{committeBackingBean.cloneSearchCommitteAction}"
				update="@(.cloneResults)" partialSubmit="true" process="@parent"/>
			<br />
			<br />
		</p:panel>

		<p:panel header="Results" toggleable="true">
			<p:dataTable id="clonesearchCommitte"
				value="#{committeBackingBean.managedBean.cloneSearchCommittes}"
				var="committe" styleClass="cloneResults">


				<p:column headerText="#{lbl['lbl.sc.committe.result.comtype']}">
					<h:outputLabel value="#{committe.scCommittee.committeeType}"></h:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">

					<h:outputLabel value="#{committe.scQt.qtNo}"></h:outputLabel>

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.committe.result.datecreated']}">
					<h:outputLabel value="#{committe.scCommittee.createdDate}"></h:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.committe.result.appstatus']}">
					<h:outputLabel value="#{committe.scCommittee.approvalStatus}"></h:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.committe.result.recstatus']}">
					<h:outputLabel value="#{committe.scCommittee.recordStatus}"></h:outputLabel>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.committe.result.action']}">
					<p:commandButton value="ClONE" style="float:right;" 
						action="#{committeBackingBean.cloneCommitteMembersAcition(committe.scCommittee.committeeId)}" partialSubmit="true" process="@this" update="@(.cloneCommitteMembers)"
						 />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel id="cloneCommitteMembers" header="Clone Committee Result" toggleable="true">
			
				<p:dataTable 
					value="#{committeBackingBean.managedBean.cloneCommitteMemebers}"
					var="member" rowKey="#{member.committeeMemberId}"
					selection="#{committeBackingBean.managedBean.selectedCommitteMemebers}" styleClass="cloneResults,cloneCommitteMembers">
					
					<p:column selectionMode="multiple"></p:column>

					<p:column headerText="#{lbl['lbl.sc.committe.clonetable.name']}">
						<h:outputLabel value="#{member.memberName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.committe.clonetable.ministry']}">
						<!--  <h:outputLabel value="#{member.pmOrgProfile.ministry}" />   -->
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.committe.clonetable.division']}">
						<!-- <h:outputLabel value="#{member.pmOrgProfile.division}" />  -->
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.committe.clonetable.designation']}">
						<!-- <h:outputLabel value="#{member.pmOrgProfile.designation}" />   -->
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
						<h:outputLabel value="#{memberR.memberRole}" />
					</p:column>


				</p:dataTable>
				<p:commandButton value="Cancel" style="float:right;" icon="ui-icon-cancel"
					onclick="screen2.hide();"></p:commandButton>
				<p:commandButton value="Clone" style="float:right;"
					action="#{committeBackingBean.addCloneCommitteeMembersAction}"
					oncomplete="screen2.hide();" update="committeMember" icon="ui-icon-clone"></p:commandButton>
			
		</p:panel>
	</p:dialog>
</ui:composition>
