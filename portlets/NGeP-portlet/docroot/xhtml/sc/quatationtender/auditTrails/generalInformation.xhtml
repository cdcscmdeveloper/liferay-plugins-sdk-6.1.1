<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.general.info']}" toggleable="true">
		<p:dataTable id="searchQtTbl" var="obj" rows="10" width="100%"
			value=""
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="index" lazy="true">
			
			<ac:paginator for="searchQtTbl"></ac:paginator>

			<p:column headerText="#{lbl['lbl.audit.header.action.date']}"
				style="white-space: normal!important;" width="70%">
				<h:outputText value="#{obj.createdDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.action.type']}" style="width:70%;">
				<h:outputText value="#{result.actionType}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.action.by']}" style="width:70%;">
				<h:outputText value="#{result.actionBy}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.org.name']}" style="width:70%;">
				<h:outputText value="#{result.organization}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.role']}" style="width:70%;">
				<h:outputText value="#{result.role}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.docType']}" style="width:70%;">
				<h:outputText value="#{result.documentType}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.docNo']}" style="width:70%;">
				<h:outputText value="#{result.documentNo}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.document.status']}" style="width:70%;">
				<h:outputText value="#{result.documentStatus}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.fieldName']}" style="width:70%;">
				<h:outputText value="#{result.fieldName}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.oldValue']}" style="width:70%;">
				<h:outputText value="#{result.oldValue}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.audit.header.newValue']}" style="width:70%;">
				<h:outputText value="#{result.newValue}" />
			</p:column>
			
			
		</p:dataTable>	
	</p:panel>
</ui:composition>
