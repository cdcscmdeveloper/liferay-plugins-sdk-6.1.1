<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.sc.qt.req.ptj']}" toggleable="true" id="qtScQtReqPtjId">
			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.ministry']}" /></td>
					<td colspan="3"><p:inputText
							value="#{approvalBackingBean.retrieveMinistryByOrgProfileId(scQt.pmOrgProfile.orgProfileId)}"
							disabled="true" readonly="true" style="width:866px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.prepare.ptj']}" /></td>
					<td colspan="3"><p:inputText
							value="#{approvalBackingBean.retrievePTJByOrgProfileId(scQt.ownerOrgProfile.orgProfileId,approvalBackingBean.isQTStatusPublished(approvalBackingBean.managedBean.currentStatusId)?scQt.publishDate : scQt.createdDate)}"
							disabled="true" readonly="true" style="width:866px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.prepare.for.ptj']}" />
					</td>
					<td colspan="3"><p:inputText
							value="#{approvalBackingBean.retrievePTJByOrgProfileId(scQt.pmOrgProfile.orgProfileId,approvalBackingBean.isQTStatusPublished(approvalBackingBean.managedBean.currentStatusId)?scQt.publishDate : scQt.createdDate)}"
							disabled="true" readonly="true" style="width:866px;" /></td>
				</tr>
				<tr>
					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.sc.requestor']}" /></td>
					<td style="width: 450px;"><p:inputText
							value="#{approvalBackingBean.retriveUserName(doaRequest.createdBy)}"
							disabled="true" readonly="true" style="width:350px;" /></td>

					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.sc.request.date']}" /></td>
					<td><p:inputText value="#{doaRequest.createdDate}" disabled="true" readonly="true" style="width:212px;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td><p:inputText value="#{scQt.qtNo}" disabled="true"
							readonly="true" style="width:350px;" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" />
					</td>
					<td><p:inputText
							value="#{approvalBackingBean.getParameterDesc(scQt.procurementMode)}"
							disabled="true" readonly="true" style="width:212px;" /></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.title']}" />
					</td>
					<td colspan="3"><p:inputTextarea value="#{scQt.qtTitle}"
							cols="170" rows="3" style=" margin-bottom:5px; width:866px;"
							disabled="true" /></td>
				</tr>
			</table>
		</p:panel>
</ui:composition>
