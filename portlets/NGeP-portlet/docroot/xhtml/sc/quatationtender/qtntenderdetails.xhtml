<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Details" toggleable="true">
		<table style="width: 100%" border="1">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.qttentype']}" /></td>
				<td><c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
						<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.qtType}"
							style="width: 178px;margin-bottom: 5px;"
							disabled="#{qTDetailBB.managedBean.panelItem eq 'Yes'}">
							<f:selectItems
								value="#{qTDetailBB.retrieveParameterDescByType(ParameterTypeConst.quotationTenderType)}"
								var="parameter" itemLabel="#{parameter.codeName}"
								itemValue="#{parameter.pmParameter.parameterCode}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								update="testPanel, suppQualPG"
								listener="#{qTDetailBB.onChangeAction}" />
						</p:selectOneMenu>
					</c:if> <c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
						<p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.quotationTenderType, qTDetailBB.managedBean.qt.qtType)}"
							disabled="true" size="30" />
					</c:if></td>
				<td></td>
				<td></td>
			</tr>
			<tr>
				<td colspan="4"><p:outputPanel id="testPanel">
						<table style="width: 100%">
							<tr>
								<td style="width: 215px"><p:outputLabel value="* Panel"
										rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" /></td>
								<td><p:inputText
										value="#{qTDetailBB.managedBean.panelItem}" readonly="true"
										size="30" disabled="true"
										rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" /></td>
								<ui:fragment
									rendered="#{qTDetailBB.managedBean.panelItem ne 'Yes'}">
									<td style="width: 70px"><p:outputLabel value="* Open For"
											rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" /></td>
									<td><p:selectOneRadio
											value="#{qTDetailBB.managedBean.qt.openFor}"
											rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}">
											<f:selectItem itemLabel="Bumiputra" itemValue="true" />
											<f:selectItem itemLabel="All" itemValue="false" />
										</p:selectOneRadio></td>
								</ui:fragment>
							</tr>
						</table>
					</p:outputPanel></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.publishing.period']}" /></td>
				<td><p:inputText
						value="#{qTDetailBB.managedBean.publishingPeriod}" readonly="true"
						size="30" /></td>
				<td><p:outputLabel value="#{lbl['lbl.so.proposal.validity']}" /></td>
				<td><p:inputText
						value="#{qTDetailBB.managedBean.qt.qtValidityPeriod}"
						readonly="true" size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.rfp']}"
						rendered="#{qTDetailBB.managedBean.qt.qtNo != null}" /></td>
				<td><p:inputText id="rfpType" value="" disabled="true"
						size="30" rendered="#{qTDetailBB.managedBean.qt.qtNo != null}" /></td>
				<td></td>
				<td></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.asqttype']}"
						rendered="#{qTDetailBB.managedBean.qt.qtNo != null}" /></td>
				<td><p:inputText id="AsnTenderNo"
						value="#{qTDetailBB.managedBean.qt.qtNo}" disabled="true"
						rendered="#{qTDetailBB.managedBean.qt.qtNo != null}" size="30" /></td>
				<td></td>
				<td></td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
