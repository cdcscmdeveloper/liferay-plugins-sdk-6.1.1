<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="qtdetailsid" header="#{lbl['lbl.sc.qt.details']}"
		toggleable="true">
		<table>
			<tr>
				<td style="width: 190px;"><p:outputLabel
						value="#{lbl['lbl.sc.qttentype']}" /></td>
				<td colspan="3"><c:if
						test="#{qTDetailBB.managedBean.qt.brandNew}">
						<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.qtType}"
							style="width: 178px;margin-bottom: 5px;"
							disabled="#{qTDetailBB.managedBean.qt.panel eq true}">
							<f:selectItems
								value="#{qTDetailBB.retrieveParameterDescByType(ParameterTypeConst.quotationTenderType)}"
								var="parameter" itemLabel="#{parameter.codeName}"
								itemValue="#{parameter.pmParameter.parameterCode}" />
							<p:ajax event="change" partialSubmit="true" process="@this"
								update="testPanel, suppQualPG"
								listener="#{qTDetailBB.onChangeAction}" />
						</p:selectOneMenu>
					</c:if> <c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
						<p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.quotationTenderType, qTDetailBB.managedBean.qt.qtType)}"
							disabled="true" size="30" style="width: 195px;" />
					</c:if></td>
			</tr>
			<tr>
				<td colspan="4"><p:outputPanel id="testPanel">
						<table style="width: 100%">
							<tr>
								<td style="width: 190px;"><p:outputLabel
										value="#{lbl['lbl.sc.qt.panel']}"
										rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" /></td>
								<td><p:inputText
										value="#{lbl[qTDetailBB.managedBean.qt.panel ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
										readonly="true" size="30" disabled="true" style="width: 195px;"
										rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" /></td>
								<ui:fragment
									rendered="#{qTDetailBB.managedBean.qt.panel eq 'No'}">
									<td style="width: 215px"><p:outputLabel
											value="#{lbl['lbl.sc.open.for']}"
											rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" /></td>
									<td><p:inputText
											value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scOpenFor, qTDetailBB.managedBean.qt.openFor)}"
											disabled="true" size="30" style="width: 192px;"
											rendered="#{qTDetailBB.managedBean.qt.qtType ne 'R' and qTDetailBB.managedBean.qt.qtType ne 'I'}" />
									</td>
								</ui:fragment>
							</tr>
						</table>
					</p:outputPanel></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.existing.contract.no']}" /></td>
				<td colspan="3"><ac:lov id="contractLovId" lovId="CT_CONTRACT"
						headerText="Contract Lov" update=":form:qtdetailsid"
						saveObject="qTDetailBB.managedBean.ctContract"
						value="#{qTDetailBB.managedBean.ctContract.contractNo}" size="30"
						conditionField="#{qTDetailBB.constuctConditionFields()}" style="width: 195px;">
					</ac:lov> <ac:lovPopup /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.publishing.period']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><table>
						<tr>
							<td><p:inputMask id="publishperiod" mask="9?99"
									maxlength="3" placeHolder=""
									label="#{lbl['lbl.sc.qt.publishing.period']}" required="true"
									value="#{qTDetailBB.managedBean.qt.publishPeriod}"
									disabled="#{qTDetailBB.enableFieldByStatus(QTFieldConst.FILED_QT_PUBLISH_PERIOD)}"
									valueChangeListener="#{qTDetailBB.publishPeriodDaysChanged}"
									size="30" style="text-align:right; width: 195px;">
									<p:ajax event="blur" process="@this" partialSubmit="true"
										listener="#{qTScheduleDetailBackingBean.handlePublishClosingDate}" />
								</p:inputMask></td>
							<td><p:message id="publishperiodMsg" for="publishperiod"
									display="icon" /></td>
							<td colspan="2"><ac:iconTooltip
									value="#{lbl['lbl.sc.qt.publishing.period.tooltip']}" /></td>
						</tr>
					</table></td>
				<td style="width: 215px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.proposal.validity']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><table>
						<tr>
							<td><p:inputMask id="proposalvalidity" mask="9?9999"
									maxlength="5" placeHolder=""
									label="#{lbl['lbl.sc.qt.publishing.period']}" required="true"
									value="#{qTDetailBB.managedBean.qt.qtValidityPeriod}" size="30"
									disabled="#{qTDetailBB.enableFieldByStatus(QTFieldConst.FILED_QT_VALIDITY_PERIOD)}"
									valueChangeListener="#{qTDetailBB.proposalValidityChanged}"
									style="text-align:right; width: 192px;">
									<f:ajax></f:ajax>
								</p:inputMask></td>
							<td><p:message id="proposalvalidityMsg"
									for="proposalvalidity" display="icon" /></td>
							<td colspan="2"><ac:iconTooltip
									value="#{lbl['lbl.sc.qt.proposal.validity.tooltip']}" /></td>
						</tr>
					</table></td>
			</tr>
			<ui:fragment rendered="#{qTDetailBB.managedBean.qt.panel eq 'No'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.zone.location']}" /></td>
					<td><p:inputText
							value="#{lbl[qTDetailBB.managedBean.qt.zonal ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"
							disabled="true" size="30" style="width: 195px;" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.qt.zone.location.tooltip']}" /></td>
					<td />
					<td />
				</tr>
			</ui:fragment>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.zone.location.info']}"
		toggleable="true"
		rendered="#{qTDetailBB.managedBean.qt.zonal and qTDetailBB.managedBean.qt.panel eq 'false'}">
		<table style="width: 100%">
			<tr>
				<td style="width: 190px"><p:outputLabel
						value="#{lbl['lbl.sc.zone.location.level']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTDetailBB.getParameterDesc(qTDetailBB.managedBean.qt.zoneLocationLevel)}"
						disabled="true" size="30" readonly="true" /> <ac:iconTooltip
						value="#{lbl['lbl.sc.zone.location.level.tooltip']}" /></td>
			</tr>
		</table>
		<p:dataTable id="zoneGeneralDataTable"
			value="#{qTDetailBB.managedBean.zoneGeneralTrees}" var="zoneTree"
			style="width:100%" rowIndexVar="index">
			<p:column headerText="#{lbl['lbl.sc.zone.location']}">
				<p:tree value="#{zoneTree}" var="location">
					<p:treeNode type="zone">
						<h:outputText value="#{location.zoneName}" />
					</p:treeNode>

					<p:treeNode type="state">
						<h:outputText value="#{location.pmState.stateName}" />
					</p:treeNode>
					<p:treeNode type="division">
						<h:outputText value="#{location.pmDivision.divisionName}" />
					</p:treeNode>
					<p:treeNode type="district">
						<h:outputText value="#{location.pmDistrict.districtName}" />
					</p:treeNode>
				</p:tree>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
