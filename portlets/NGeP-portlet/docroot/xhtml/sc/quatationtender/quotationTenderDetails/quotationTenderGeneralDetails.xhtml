<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:param name="scQt" value="#{specificationBackingBean.managedBean.qt!= null?specificationBackingBean.managedBean.qt : qTDetailBB.managedBean.qt}" />
	<ui:param name="isRequire" value="#{!qTDetailBB.isAuditor()}"></ui:param>
	<ui:param name="readOnly" value="#{qTDetailBB.managedBean.editable}" />
	<ui:param name="qtStatusAfterChecklistScoring" value="#{createQtBB.isQTStatusGreaterThan(scQt.qtStatus.statusId, QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />
	<ui:param name="qtStatusScheduleDocAndAfter" value="#{createQtBB.isQTStatusGreaterThanOrEquals(scQt.qtStatus.statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
	<ui:param name="zoneCoverageReadonly" value="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_ZONE_COVERAGE)}" />

	<p:panel id="qtdetailsid" header="#{lbl['lbl.sc.general.info']}"
		toggleable="true">

		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.panel']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<c:choose>
						<c:when test="#{!qtStatusAfterChecklistScoring}">
							<p:selectOneRadio id="panelTitle" required="true"
								label="#{lbl['lbl.sc.spec.panel']}" value="#{scQt.panel}">
								<f:selectItems
									value="#{qTDetailBB.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								<p:ajax event="change"
									listener="#{createQtBB.panelConformation(scQt)}" process="@this"
									partialSubmit="true" update="@form"></p:ajax>
							</p:selectOneRadio>
							<p:message id="selectPanelTitleId" for="panelTitle" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="isPanelTxt" value="#{createQtBB.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(scQt.panel))}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td></td>
				<td></td>
			</tr>

			<h:panelGroup id="panelInfoId">
				<ui:fragment rendered="#{scQt.panel}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.circular.no']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>

						<td>
							<c:choose>
								<c:when test="#{!qtStatusAfterChecklistScoring}">
									<ac:lov id="ctCircularPanel" lovId="CT_CIRCULAR_PANEL"
										headerText="#{lbl['lbl.sc.spec.circular.list']}"
										update=":form:panelItemId"
										saveObject="qTDetailBB.managedBean.qt.circularVer"
										value="#{scQt.circularVer.circularNo}"
										size="24" readonly="true"
										conditionField="#{createQtBB.constrcutFieldsForPanel()}"
										postUpdateListener="createQtBB.circularListSelect(qTDetailBB.managedBean.qt.circularVer)"
										disabled="#{!scQt.panel}" />
								</c:when>
								<c:otherwise>
									<p:inputText id="cirPanelTxt" value="#{scQt.circularVer.circularNo}" size="29" disabled="true" />
								</c:otherwise>
							</c:choose>
						</td>
						<td><p:outputLabel value="#{lbl['lbl.sc.spec.group.item']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>

						<td>
							<c:choose>
								<c:when test="#{!qtStatusAfterChecklistScoring}">
									<p:selectOneMenu id="panelItemId" required="#{isRequire}"
										label="#{lbl['lbl.sc.spec.group.item']}"
										value="#{scQt.itemGroup.panelItemGroupId}"
										style="width: 210px;margin-bottom: 5px;">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="#{null}" />
										<f:selectItems value="#{createQtBB.panelGroupItems}"
											var="panelItem" itemLabel="#{panelItem.groupName}"
											itemValue="#{panelItem.panelItemGroupId}" />
		
										<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
									</p:selectOneMenu>
									<p:message id="panelIteMsgId" for="panelItemId" display="icon" />
								</c:when>
								<c:otherwise>
									<p:inputText id="groupItemTxt" value="#{scQt.itemGroup.groupName}" size="30" disabled="true" />
								</c:otherwise>
							</c:choose>
						</td>

					</tr>
				</ui:fragment>
			</h:panelGroup>

			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.title']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td colspan="3"><p:inputTextarea id="title1"
						disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_TITLE)}"
						label="#{lbl['lbl.sc.title']}" required="#{isRequire}"
						value="#{scQt.qtTitle}" cols="110" rows="3"
						valueChangeListener="#{qTDetailBB.qtMaiantanceValueChangeListner}"
						style=" margin-bottom:5px; width: 675px;" maxlength="1000">
						<f:ajax></f:ajax>
					</p:inputTextarea> <p:message id="title1Msg" for="title1" display="icon" /></td>
			</tr>
			<c:if test="#{scQt.brandNew}">
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.ptj']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td colspan="3"><ac:lov id="ptjProfAuthId"
						lovId="PM_ORG_PROFILE_AUTH_TYPE" headerText="#{lbl['lbl.sc.ptj']}"
						saveObject="scQt.pmOrgProfile"
						value="#{scQt.pmOrgProfile.orgName}"
						size="102" readonly="true" 
						conditionField="recordStatus^1" /> <p:message
						id="ptjMsg" for="ptjProfAuthId" display="icon" /></td>
			</tr>
			</c:if>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.qt.zone.location']}" /></td>
				<td>
					<table>
						<tr>
							<td>
								<c:choose>
									<c:when test="#{!zoneCoverageReadonly}">
										<p:selectOneRadio value="#{scQt.zonal}" >
											<f:selectItems
												value="#{createQtBB.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
											<p:ajax event="change" partialSubmit="true"
												update="generalLocationList" process="@this"
												listener="#{createQtBB.zoneRadioChange(scQt)}"></p:ajax>
										</p:selectOneRadio>
									</c:when>
									<c:otherwise>
										<p:inputText id="zoneTxt" value="#{createQtBB.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(scQt.zonal))}" size="29" disabled="true" />
									</c:otherwise>
								</c:choose>
							</td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.qt.zone.location.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td style="width: 270px;"><p:outputLabel value="#{lbl['lbl.sc.qt.fileno']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td style="width: 250px;"><table>
						<tr>
							<td><p:inputText id="fileno"
									label="#{lbl['lbl.sc.qt.fileno']}" required="#{isRequire}"
									value="#{scQt.fileNo}" size="29" maxlength="50"
									disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_FILE_NO)}">
									<p:ajax event="blur" partialSubmit="true" update="@this"
										listener="#{createQtBB.setFileNo(scQt)}"></p:ajax>
								</p:inputText></td>
							<td><p:message id="filenoMsg" for="fileno" display="icon" />
							</td>
						</tr>
					</table></td>
				<td style="width: 260px;"><p:outputLabel
						value="#{lbl['lbl.sc.created.date']}" /></td>
				<td><p:inputText value="#{scQt.createdDate}" disabled="true"
						size="30">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			
			<c:choose>
				<c:when test="#{scQt.qtStatus.statusId == QTStatusConst.QT_PENDING_QT_SUBMISSION}">
					<tr>
						<td>
							<p:outputLabel value="#{lbl['lbl.sc.spec.expected.intended.price']}" />
							<p:outputLabel value="*" styleClass="mandatory" />
						</td>
						<td><p:inputText id="expIntendedPrice" style="text-align:right;"
								value="#{scQt.tmpExpectedIntendedPrice}" size="29"
								required="true"
								label="#{lbl['lbl.sc.spec.expected.intended.price']}">
								<p:ajax event="blur" partialSubmit="true" update="@form"
									listener="#{createQtBB.setProcurementMode(scQt, scQt.tmpExpectedIntendedPrice)}">
								</p:ajax>
								
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
							<p:message id="expIntendedPriceMsg" for="expIntendedPrice" display="icon" />
						</td>
						<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
						<td><p:inputText
								value="#{createQtBB.getParameterDesc(scQt.procurementMode)}"
								disabled="true" size="30" readonly="true" /></td>
					</tr>
				</c:when>
				<c:otherwise>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" /></td>
						<td>
							<p:inputText id="estprice" style="text-align:right;"
								value="#{scQt.estimatedAmount}" size="29"
								disabled="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
						</td>
						<td><p:outputLabel value="#{lbl['lbl.sc.spec.expected.intended.price']}" /></td>
						<td><p:inputText id="expIntendedPrice" style="text-align:right;"
								value="#{scQt.tmpExpectedIntendedPrice}" size="30"
								disabled="true">
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText>
						</td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
						<td colspan="3"><p:inputText
								value="#{createQtBB.getParameterDesc(scQt.procurementMode)}"
								disabled="true" size="29" readonly="true" /></td>
					</tr>
				</c:otherwise>
			</c:choose>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qttentype']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>

				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_QT_TYPE)}">
							<table>
								<tr>
									<td>
										<p:selectOneRadio required="#{isRequire}" id="tenderType"
											label="#{lbl['lbl.sc.qttentype']}" value="#{scQt.qtType}">
											<f:selectItems
												value="#{createQtBB.getQuotationTendervalues(ParameterTypeConst.quotationTenderType,scQt)}" />
											<p:ajax event="change" process="@this" partialSubmit="true"
												update="@form" listener="#{createQtBB.onChangeQtType}"></p:ajax>
										</p:selectOneRadio>
									</td>
									<td><p:message id="tenderMsg" for="tenderType" display="icon" /></td>
								</tr>
							</table>
						</c:when>
						<c:otherwise>
							<p:inputText id="qtTypeTxt" value="#{createQtBB.getParameterDesc(ParameterTypeConst.quotationTenderType, scQt.qtType)}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sc.open.for']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_OPEN_FOR)}">
							<table>
								<tr>
									<td>
										<p:selectOneRadio required="#{isRequire}" id="openFor"
											label="#{lbl['lbl.sc.open.for']}" value="#{scQt.openFor}">
											<f:selectItems
												value="#{createQtBB.getRadioButtonCodeValues(ParameterTypeConst.scOpenFor)}" />
											<p:ajax event="change" process="@this" partialSubmit="true"
												update="@form" listener="#{createQtBB.openForChange}"></p:ajax>
										</p:selectOneRadio> 
									</td>
									<td><p:message id="openMsg" for="openFor" display="icon" /></td>
								</tr>
							</table>
						</c:when>
						<c:otherwise>
							<p:inputText id="openForTxt" value="#{createQtBB.getParameterDesc(ParameterTypeConst.scOpenFor, scQt.openFor)}" size="30" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurment.type.category']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_PROCUREMENT_TYPE_CAT_ID)}">
							<p:selectOneMenu id="qtmaintainprocTypeBoCategory"
								required="#{isRequire}"
								label="#{lbl['lbl.sc.procurment.type.category']}"
								value="#{scQt.procurementTypeCatId.parameterId}"
								style="width: 205px;margin-bottom: 5px;">
								<f:selectItems
									value="#{createQtBB.getDropdownValues(ParameterTypeConst.procurementTypeCategory)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
							</p:selectOneMenu> 
							<p:message id="procuremntypeCategoryquotationTender" for="qtmaintainprocTypeBoCategory" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="procTypeCatTxt" value="#{createQtBB.getParameterDesc(scQt.procurementTypeCatId)}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurement.category']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_PROCUREMENT_CATEGORY)}">
							<p:selectOneMenu id="procCategory" required="#{isRequire}"
								style="margin-bottom:5px;width:210px;"
								label="#{lbl['lbl.sc.procurement.category']}"
								value="#{scQt.pmProcurementCategory.parameterId}">
								<f:selectItems
									value="#{createQtBB.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
							</p:selectOneMenu>
							<p:message id="titleMsg" for="procCategory" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="procCatTxt" value="#{createQtBB.getParameterDesc(scQt.pmProcurementCategory)}" size="30" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>

			</tr>

			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.evaluation.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" rendered="#{scQt.qtStatus.statusId != QTStatusConst.QT_PENDING_QT_SUBMISSION}" />
				</td>
				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_EVALUATION_TYPE)}">
							<table>
								<tr>
									<td><p:selectOneRadio id="evalType"
											label=" #{lbl['lbl.sc.evaluation.type']}"
											value="#{scQt.evaluationType}"
											required="#{scQt.qtStatus.statusId != QTStatusConst.QT_PENDING_QT_SUBMISSION}">
											<f:selectItems
												value="#{createQtBB.getRadioButtonCodeValues(ParameterTypeConst.scEvaluationType)}" />
										</p:selectOneRadio></td>
									<td><p:message id="evalMsg" for="evalType" display="icon" /></td>
									<td style="margin-top: -3px"><ac:iconTooltip value="#{lbl['lbl.sc.evaluation.type.tooltip']}" /></td>
								</tr>
							</table>
						</c:when>
						<c:otherwise>
							<p:inputText id="evalTypeTxt" value="#{createQtBB.getParameterDesc(ParameterTypeConst.scEvaluationType, scQt.evaluationType)}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td><h:outputLabel value="#{lbl['lbl.sc.max.proposal']}" /></td>
				<td><p:inputText id="proposalId" size="30"
						label="#{lbl['lbl.sc.max.proposal']}" maxlength="1"
						value="#{scQt.maxProposal}"
						style="text-align:right;margin-bottom: 5px;"
						disabled="true">
					</p:inputText>
				</td>
			</tr>
			
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.cont.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_CONTRACT_TYPE)}">
							<p:selectOneMenu id="contractType"
								value="#{scQt.contractType.parameterId}"
								style="width: 205px;margin-bottom: 5px;"
								label="#{lbl['lbl.sc.loiloa.loa.cont.type']}"
								required="true">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems value="#{createQtBB.contractTypes}"
									var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
									itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
								<p:ajax event="change"
									listener="#{createQtBB.contractTypeSelection}"
									partialSubmit="true" process="@this" />
							</p:selectOneMenu>
							<p:message id="contractTypeMsg" for="contractType" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="contractTypeTxt" value="#{createQtBB.getParameterDesc(scQt.contractType)}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.existing.contract.no']}" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_EXISTING_CONTRACT)}">
							<ac:lov id="contractLovId" lovId="CT_CONTRACT"
								headerText="#{lbl['lbl.sc.qt.existing.contract.no.search']}"
								update=":form:qtdetailsid"
								saveObject="qTDetailBB.managedBean.ctContract"
								value="#{qTDetailBB.managedBean.ctContract.contractNo}" size="25"
								conditionField="#{qTDetailBB.constuctConditionFields()}" /> 
							<ac:lovPopup />
						</c:when>
						<c:otherwise>
							<p:inputText id="extContractTxt" value="#{scQt.existingContractNo}" size="30" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value=" #{lbl['lbl.sc.fullfillent.type']}" />
					<p:outputLabel value="*" styleClass="mandatory"></p:outputLabel></td>
				<td>
					<c:choose>
						<c:when test="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_FULFILMENT_TYPE)}">
							<p:selectOneMenu required="#{isRequire}" id="fulfilId"
								label="#{lbl['lbl.sc.fullfillent.type']}"
								value="#{scQt.fulfilmentType.parameterId}"
								style="width: 205px;margin-bottom: 5px;">
								<f:selectItems
									value="#{createQtBB.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"
									listener="#{createQtBB.fulfilmentChange}"></p:ajax>
							</p:selectOneMenu>
							<p:message id="fulfilType" for="fulfilId" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="fulfilTypeTxt" value="#{createQtBB.getParameterDesc(scQt.fulfilmentType)}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td style="white-space: nowrap;">
					<p:outputLabel value="#{lbl['lbl.sc.spec.complete.period']}" escape="false" />
					<p:outputLabel value="*" styleClass="mandatory" rendered="#{scQt.qtStatus.statusId != QTStatusConst.QT_PENDING_QT_SUBMISSION}" />
				</td>
				<td><p:inputText id="contractBo" size="30" maxlength="3"
						label="#{lbl['lbl.sc.spec.complete.period']}"
						value="#{scQt.contractDuration}"
						style="text-align:right;margin-bottom:5px;"
						required="#{scQt.qtStatus.statusId != QTStatusConst.QT_PENDING_QT_SUBMISSION}"
						disabled="#{qtStatusAfterChecklistScoring}">
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@this" />
					</p:inputText> <p:message id="completionBo" for="contractBo" display="icon"></p:message></td>
			</tr>
			<c:if test="#{qtStatusScheduleDocAndAfter}">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<table>
						<tr>
							<td>
								<p:inputMask id="publishperiod" mask="9?99"
									maxlength="3" placeHolder=""
									label="#{lbl['lbl.sc.qt.publishing.period']}" required="#{isRequire}"
									value="#{scQt.publishPeriod}"
									disabled="#{qTDetailBB.enableFieldByStatus(QTFieldConst.FILED_QT_PUBLISH_PERIOD)}"
									valueChangeListener="#{qTDetailBB.publishPeriodDaysChanged}"
									size="29" style="text-align:right;">
									<p:ajax event="blur" process="@this" partialSubmit="true"
										listener="#{qTScheduleDetailBackingBean.handlePublishClosingDate}" />
								</p:inputMask></td>
							<td>
								<p:message id="publishperiodMsg" for="publishperiod" display="icon" />
							</td>
							<td colspan="2">
								<ac:iconTooltip value="#{lbl['lbl.sc.qt.publishing.period.tooltip']}" />
							</td>
						</tr>
					</table>
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<table>
						<tr>
							<td>
								<p:inputMask id="proposalvalidity" mask="9?9999"
									maxlength="5" placeHolder=""
									label="#{lbl['lbl.sc.qt.publishing.period']}" required="#{isRequire}"
									value="#{scQt.qtValidityPeriod}" size="30"
									disabled="#{qTDetailBB.enableFieldByStatus(QTFieldConst.FILED_QT_VALIDITY_PERIOD)}"
									valueChangeListener="#{qTDetailBB.proposalValidityChanged}"
									style="text-align:right;">
									<f:ajax></f:ajax>
								</p:inputMask>
							</td>
							<td>
								<p:message id="proposalvalidityMsg" for="proposalvalidity" display="icon" />
							</td>
							<td colspan="2">
								<ac:iconTooltip value="#{lbl['lbl.sc.qt.proposal.validity.tooltip']}" />
							</td>
						</tr>
					</table>
				</td>
			</tr>
			</c:if>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.req.approval.specification']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<c:choose>
						<c:when test="#{!qtStatusAfterChecklistScoring}">
							<p:selectOneRadio required="#{isRequire}"
								value="#{scQt.specApprovalReq}" 
								label="#{lbl['lbl.sc.qt.req.approval.specification']}">
								<f:selectItems
									value="#{createQtBB.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								<p:ajax event="change" 
									partialSubmit="true" process="@this" update="@this,approvalSpeclbl,approvalSpecTxt" 
									listener="#{createQtBB.ministrySpecSecretaryRequiredChanged(scQt)}" />
							</p:selectOneRadio>
						</c:when>
						<c:otherwise>
							<p:inputText id="specAppReqTxt" value="#{createQtBB.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(scQt.specApprovalReq))}" size="29" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td>
					<h:panelGroup id="approvalSpeclbl">
						<h:panelGroup rendered="#{scQt.specApprovalReq ne null and scQt.specApprovalReq ne '0'}">
							<p:outputLabel value="#{lbl['lbl.sc.ministry.spec.secretary']}" /> 
							<p:outputLabel value="*" styleClass="mandatory" valign="top" />
						</h:panelGroup>
					</h:panelGroup>
				</td>
				<td>
					<c:choose>
						<c:when test="#{!qtStatusAfterChecklistScoring}">
							<h:panelGroup id="approvalSpecTxt">
								<h:panelGroup rendered="#{scQt.specApprovalReq ne null and scQt.specApprovalReq ne '0'}">
									<table>
										<tr>
											<td><p:selectOneMenu id="ministryspec" 
													required="#{isRequire}"
													label="#{lbl['lbl.sc.ministry.spec.secretary']}"
													value="#{scQt.ministrySpecSecrataryId.userId}"
													style="width: 210px;margin-bottom: 5px;">
													<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
														itemValue="#{null}" />
													<f:selectItems
														value="#{createQtBB.ministrySpecApprovers}"
														var="appName" itemLabel="#{appName.userName}"
														itemValue="#{appName.userId}" />
												</p:selectOneMenu></td>
											<td><p:message id="ministryspecMsg" for="ministryspec"
													display="icon" /></td>
										</tr>
									</table>
								</h:panelGroup>
							</h:panelGroup>
						</c:when>
						<c:otherwise>
							<p:inputText id="specAppUserTxt" value="#{scQt.ministrySpecSecrataryId.userName}" size="30" disabled="true"
								rendered="#{scQt.specApprovalReq ne null and scQt.specApprovalReq ne '0'}" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
		</table>
	</p:panel>

	<h:panelGroup id="generalLocationList">
		<ui:include
			src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderZones.xhtml" />
	</h:panelGroup>

</ui:composition>
