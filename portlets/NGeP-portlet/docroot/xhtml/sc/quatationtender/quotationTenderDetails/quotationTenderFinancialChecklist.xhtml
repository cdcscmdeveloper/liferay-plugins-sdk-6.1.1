<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="#{lbl['lbl.sc.financial.specification']}" style="width: 100%"
		toggleable="true">
		<p:dataTable id="financialSpecification" var="financialSpec"
			style="width:100%" rowIndexVar="index"
			value="#{qTDetailBB.managedBean.financialSpecList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{financialSpec}">
			<ac:paginator for="financialSpecification" />

			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}"
				style="width:50%">
				<h:outputText value="#{financialSpec.title}" size="50" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:20%">
				<h:outputText
					value="#{qTDetailBB.getStatusDescById(financialSpec.pmStatus.statusId)}"
					size="50" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.by']}" style="width:20%">
				<h:outputText
					value="#{qTDetailBB.retriveUserName(financialSpec.createdBy)}"
					size="50" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:10%;text-align: center;">
				<p:commandLink
					action="#{qTDetailBB.financialSpecEditAction(financialSpec)}">
					<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/edit.png" styleClass="tasklist_title1" rendered="#{!qTDetailBB.isAuditor()}"/>
					<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" styleClass="tasklist_title1" rendered="#{qTDetailBB.isAuditor()}"
					title="click view icon"/>
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
