<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog widgetVar="viewCircularPanelItems" modal="true" width="800"
		height="400" position="top" header="#{lbl['lbl.sc.spec.panel.item']}">

		<p:messages id="addPanelCircularItemsIds" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false"
			severity="error, info" />


		<h:panelGroup id="circularGroupItemPopupId">




			<p:panel header="#{lbl['lbl.sc.spec.panel.item']}" toggleable="true">




				<p:dataTable id="viewCircularItemsGroupIds" rowIndexVar="index"
					var="panelItem" style="width:100%" rows="10"
					value="#{createQtBB.managedBean.searchDataModelPanelItem}"
					rowKey="#{panelItem.panelItemId}" lazy="true">

					<ac:paginator for="viewCircularItemsGroupIds"></ac:paginator>




					<p:column headerText="#{lbl['lbl.sc.circular.name']}"
						style="white-space: normal;width:40%;">
						<h:outputText value="#{panelItem.ctCircularVer.name}"></h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.group.item']}"
						style="white-space: normal;width:20%;">

						<h:outputText value="#{panelItem.ctPanelItemGroup.groupName}" rendered="#{panelItem.ctPanelItemGroup ne null}"></h:outputText>
					</p:column>



					<p:column headerText="#{lbl['lbl.sc.item']}"
						style="white-space: normal;width:20%;">
						<h:outputText value="#{panelItem.itemName}"></h:outputText>
					</p:column>








				</p:dataTable>






				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.close']}"
						styleClass="BtnSpacing" process="@this" partialSubmit="true"
						style="float:right;" onclick="viewCircularPanelItems.hide();"></p:commandButton>

				</div>

			</p:panel>
		</h:panelGroup>

	</p:dialog>
</ui:composition>
