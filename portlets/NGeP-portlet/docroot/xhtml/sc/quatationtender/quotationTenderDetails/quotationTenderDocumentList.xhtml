<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.document.list']}" toggleable="true">
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.document.list.instruction']}" escape="false" />
		<ui:param name="isRendered"
			value="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_DOCUMENTS)}"></ui:param>

		<p:dataTable var="scQtDocReport" id="doctbl" widgetVar="documentWidget"
			value="#{qTDocumentsBackingBean.managedBean.scQtDocReportList}"
			selection="#{qTDocumentsBackingBean.managedBean.selectedScQtDocReports}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{scQtDocReport}" rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="doctbl" />
			
			<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk" value="#{qTDocumentsBackingBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="doctbl" listener="#{qTDocumentsBackingBean.selectAll(qTDocumentsBackingBean.selectAll, qTDocumentsBackingBean.managedBean.scQtDocReportList)}"/>
					</p:selectBooleanCheckbox>
				</f:facet>
				
				<p:selectBooleanCheckbox value="#{scQtDocReport.selected}"
					disabled="true"
					rendered="#{scQtDocReport.definationType.parameterCode eq 'TD'  or scQtDocReport.definationType.parameterCode eq 'SD' }">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>

				<p:selectBooleanCheckbox value="#{scQtDocReport.selected}"
					rendered="#{scQtDocReport.definationType.parameterCode eq 'UP'}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.checklist.title']}" style="width:58%">
				<h:inputText size="50" value="#{scQtDocReport.title}"
					rendered="#{empty scQtDocReport.pmDocument}" />
				<h:outputText value="#{scQtDocReport.title}"
					rendered="#{!empty scQtDocReport.pmDocument}" />
			</p:column>

			<!-- commented type column as part of Enchancement 
			<p:column style="width:10%;" headerText="#{lbl['lbl.sc.type']}">
				#{qTDocumentsBackingBean.getParameterDesc(scQtDocReport.definationType)}
			</p:column> 
			
			<p:column style="width:20%;" headerText="#{lbl['lbl.txt.attachment']}">
				<ui:fragment rendered="#{scQtDocReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload}">
					<h:outputText value="#{scQtDocReport.scQtDocReportAttachment.fileName}" />
					<p:commandButton oncomplete="attachDlg1.show();"
						value="#{lbl['lbl.txt.attachment']}" icon="iconAttachment"
						partialSubmit="true" process="doctbl" update="@([id$=attach])">
						<f:setPropertyActionListener target="#{qTDocumentsBackingBean.managedBean.selectedScQtDocReport}" value="#{scQtDocReport}" />
					</p:commandButton>
				</ui:fragment>
			</p:column>
			-->
			<p:column style="width:10%;text-align: center;" headerText="#{lbl['lbl.sc.action']}">
				<p:commandLink
					action="#{qTDocumentsBackingBean.showTemplateAction(rowIndex,scQtDocReport)}">
					<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/edit.png" rendered="#{scQtDocReport.definationType.parameterCode eq 'TD' and isRendered}"/>
					<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" rendered="#{scQtDocReport.definationType.parameterCode eq 'TD' and !isRendered}"/>
					<f:setPropertyActionListener target="#{qTDocumentsBackingBean.readOnly}" value="#{!isRendered}" />
				</p:commandLink>			
				<p:commandButton id="download" style="background-color:transparent !important; border:0px none;"
					ajax="false" icon="ui-icon-download"
					action="#{qTDocumentsBackingBean.downloadReport(scQtDocReport)}"
					rendered="#{scQtDocReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload ? false : true}" />
					
				<ui:fragment rendered="#{scQtDocReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload}">
					<p:commandButton oncomplete="attachDlg1.show();"
						value="#{lbl['lbl.txt.attachment']}" icon="iconAttachment"
						partialSubmit="true" process="doctbl" update="@([id$=attach])">
						<f:setPropertyActionListener target="#{qTDocumentsBackingBean.managedBean.selectedScQtDocReport}" value="#{scQtDocReport}" />
					</p:commandButton> <br/>
					<p:commandLink ajax="false" style="margin-left:10px;"
						value="#{scQtDocReport.scQtDocReportAttachment.fileName}"
						action="#{qTDocumentsBackingBean.downloadReport(scQtDocReport)}"
						rendered="#{scQtDocReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload ? !empty scQtDocReport.scQtDocReportAttachment.fileName :false}">
					</p:commandLink>
				</ui:fragment>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false" styleClass="BtnSpacing"
				action="#{qTDocumentsBackingBean.downloadAllReports}" />
			<p:commandButton value="#{lbl['lbl.btn.clone']}"
				actionListener="#{qTDocumentsBackingBean.cloneDocumentPopupAction}"
				oncomplete="screen2.show();" process="@this"
				update="@(.clonedocument)" styleClass="BtnSpacing"
				rendered="#{isRendered}" />
			<p:commandButton value="#{lbl['lbl.btn.add']}" styleClass="BtnSpacing"
				process="@this, doctbl" partialSubmit="true"
				action="#{qTDocumentsBackingBean.addDocumentList}"
				rendered="#{isRendered}"
				oncomplete="documentWidget.paginator.endLink.click();"
				update="doctbl" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
				process="@this, doctbl" partialSubmit="true"
				update="@([id$=#{documentDeleteId}])"
				oncomplete="documentDeletePopUp.show();"
				rendered="#{isRendered}">
				<f:setPropertyActionListener
					target="#{qTDocumentsBackingBean.selectAll}" value="#{false}" />
			</p:commandButton>
		</div>
		<ac:confirmationPopup id="documentDeleteId"
				widget="documentDeletePopUp"
				okAction="qTDocumentsBackingBean.markDeleteSelectedRowsAction(qTDocumentsBackingBean.managedBean.scQtDocReportList, qTDocumentsBackingBean.managedBean.markDeletedScQtDocReportList)" width="33%"
				height="100" title="#{lbl['lbl.sc.document.list']}"
				content="#{lbl['lbl.sc.dialog.confirm.document.dtls']}" update="@form" />
	</p:panel>
</ui:composition>
