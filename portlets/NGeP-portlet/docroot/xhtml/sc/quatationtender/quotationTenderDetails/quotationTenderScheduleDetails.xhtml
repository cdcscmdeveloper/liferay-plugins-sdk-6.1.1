<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isRequire" value="#{!qTDetailBB.isAuditor()}"></ui:param>
	<p:panel header="#{lbl['lbl.sc.qt.schedule']}" toggleable="true"
		id="scheduleDetalsPublishingClosing">
		<table style="width: 100%">
			<tr>
				<td style="width: 235px;"><p:outputLabel
						value="#{lbl['lbl.sc.publish.date']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td><h:panelGroup id="publishId">
						<table>
							<tr>
								<td><p:calendar label="#{lbl['lbl.sc.publish.date']}"
										mindate="#{qTScheduleDetailBackingBean.managedBean.today}"
										value="#{qTScheduleDetailBackingBean.managedBean.qt.publishDate}"
										id="noticePublish" 
										readonlyInput="true"
										pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
										showOn="button"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_PUBLISH_DATE)}"
										maxdate="#{qTScheduleDetailBackingBean.handleMaximumDate()}">
										<p:ajax event="dateSelect" process="@this"
											listener="#{qTScheduleDetailBackingBean.handlePublishedDate()}"
											update="proposalvalidityid, closingDate, publishId,scheduleDetalsPublishingClosing,publishTime, closingTime" />
									</p:calendar> 
									<p:inputText id="publishTime" value="#{qTScheduleDetailBackingBean.managedBean.qt.publishDate}" disabled="true" size="4"
										style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
										<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
									</p:inputText>
								</td>
								<td>
									<p:message id="noticePublishMsg" for="noticePublish"
										display="icon" />
								</td>
							</tr>
						</table>
					</h:panelGroup></td>
			</tr>
			<c:if
				test="#{qTScheduleDetailBackingBean.managedBean.qt.bsvRequired eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.bsv.date']}" /></td>
					<td><p:inputText id="bsvDate"
							value="#{qTScheduleDetailBackingBean.managedBean.bsvDate}"
							readonly="true" disabled="true"
							style="width: 111px;margin-top:5px">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</p:inputText></td>
				</tr>
			</c:if>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.publishing.period']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.qt.publishPeriod}"
						readonly="true" id="publishingperiod" disabled="true"
						style="width: 111px;margin-top:5px; text-align:right" /> <ac:iconTooltip
						value="#{lbl['lbl.sc.qt.publishing.period.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.closing.date']}" /></td>
				<td><p:inputText id="closingDate"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}"
						readonly="true" disabled="true"
						style="width: 111px;margin-top:5px">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;
					<p:inputText id="closingTime" value="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}" 
						disabled="true" size="4"
						style="width: 65px;margin-top: 5px;margin-bottom: 0px;">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
					</p:inputText> 
					<ac:iconTooltip value="#{lbl['lbl.sc.closing.date.tooltip']}" />
				</td>
			</tr>

			<c:if
				test="#{qTScheduleDetailBackingBean.managedBean.qt.sampleReq eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sample.closingdate']}" />
						<!-- <p:outputLabel value="*" styleClass="mandatory" /> --></td>
					<td>
						<table>
							<tr>
								<td><p:inputText
										label="#{lbl['lbl.sc.sample.closingdate']}"
										value="#{qTScheduleDetailBackingBean.managedBean.qt.sampleClosingDate}"
										id="sampleclsdate" readonly="true" disabled="true"
										style="width: 111px;margin-top:5px">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
									</p:inputText>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; 
									<p:inputText id="sampleClosingTime" value="#{qTScheduleDetailBackingBean.managedBean.qt.sampleClosingDate}" 
										disabled="true" size="4"
										style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
										<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
									</p:inputText>
								</td>
								<td><p:message id="sampledate" for="sampleclsdate"
										display="icon" /></td>
								<td><ac:iconTooltip
										value="#{lbl['lbl.sc.sample.closingdate.tooltip']}" /></td>
							</tr>
						</table>
					</td>
				</tr>

			</c:if>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.proposal.validity']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.qt.qtValidityPeriod}"
						readonly="true" disabled="true"
						style="width: 111px;margin-top:5px;text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.proposal.validity.until']}" /></td>
				<td><p:inputText id="proposalvalidityid"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.proposalValidityEndDate}"
						readonly="true" disabled="true"
						style="width: 111px;margin-top:5px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<!-- <tr>
				<td style="width: 204px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.expected.loa.date']}" /></td>
				<td><p:calendar id="loaDate"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.expectedLoaDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
						mindate="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}"
						readonlyInput="true" showOn="button"
						disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" /></td>
			</tr> -->
		</table>
	</p:panel>
	<c:if
		test="#{qTScheduleDetailBackingBean.managedBean.qt.sampleReq eq 'true'}">
		<p:panel id="samplezoneid"
			header="#{lbl['lbl.sc.qt.sample.submission']}" toggleable="true"
			rendered="#{qTScheduleDetailBackingBean.managedBean.qt.zonal eq 'true'}"
			styleClass="sampleSubmitionUpdate">
			<p:dataTable id="sampleid" var="samplesubmissiondtl" editable="true"
				rowIndexVar="rowIndex" rowKey="#{samplesubmissiondtl}"
				value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmissionList}"
				selection="#{qTScheduleDetailBackingBean.managedBean.selectedSubmissionList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				styleClass="submissionlist">

				<p:column selectionMode="multiple" style="width:2%"
					disabledSelection="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />

				<p:column headerText="#{lbl['lbl.sc.qt.zone.location']}">
					<h:outputText
						value="#{samplesubmissiondtl.tplSpecZoneDtl.zoneName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.address']}">
					<h:outputText value="#{samplesubmissiondtl.address.address1}" />
					<h:outputText value="#{samplesubmissiondtl.address.address2}" />,
					<h:outputText value="#{samplesubmissiondtl.address.address3}" />,
					<h:outputText value="#{samplesubmissiondtl.address.address4}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%">
					<p:commandLink
						action="#{qTScheduleDetailBackingBean.editAddress(samplesubmissiondtl,rowIndex)}"
						style="margin-right:20px;" partialSubmit="true" process="@this"
						update="@(.sampleSubmitionAddrUpdate)">
						<h:graphicImage
							value="#{CommonUIConstant.imagePathUptoDesign}/edit.png"
							styleClass="tasklist_title1" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton id="samplesubaddId" styleClass="BtnSpacing"
					value="#{lbl['lbl.sc.qt.btn.same.address']}"
					rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
					process="@this,sampleid"
					action="#{qTScheduleDetailBackingBean.applyAddessToSelectedZonesAction}"
					update="@(.sampleSubmitionAddrUpdate)" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.qt.sample.submission']}"
			toggleable="true"
			rendered="#{qTScheduleDetailBackingBean.managedBean.qt.zonal ne 'true'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 120px;"><p:outputLabel
							value="#{lbl['lbl.sc.qt.address.one']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:inputText id="sampleaddress1"
										required="#{isRequire}"
										label="#{lbl['lbl.sc.qt.address.one']}"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
										value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address1}"
										style="margin-top:5px;" size="30" maxlength="255" /></td>
								<td><p:message id="sampleaddress1Msg" for="sampleaddress1"
										display="icon" /></td>
							</tr>
						</table>
					</td>
					<td style="width: 170px;"><p:outputLabel
							value="#{lbl['lbl.sc.state']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu id="samplestate1"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
										label="#{lbl['lbl.sc.state']}" required="#{isRequire}"
										value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmState.stateId}"
										style="width: 249px;margin-bottom: 5px;">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="state"
											value="#{qTScheduleDetailBackingBean.managedBean.states}"
											itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
										<p:ajax event="change"
											listener="#{qTScheduleDetailBackingBean.retrievePmDivisions}"
											update="sampleDivison1, sampledistrict1, samplecity1, samplepost1" />
									</p:selectOneMenu></td>
								<td><p:message id="samplestate1Msg" for="samplestate1"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.two']}" /></td>
					<td><p:inputText
							disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address2}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.division']}" /></td>
					<td><p:selectOneMenu id="sampleDivison1"
							value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmDivision.divisionId}"
							style="width: 249px;margin-bottom: 5px;"
							disabled="#{!qTScheduleDetailBackingBean.managedBean.stateCode or qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="divisionList"
								value="#{qTScheduleDetailBackingBean.managedBean.divisionList}"
								itemValue="#{divisionList.divisionId}"
								itemLabel="#{divisionList.divisionName}" />
							<p:ajax event="change"
								listener="#{qTScheduleDetailBackingBean.retrievePmDistrictList}"
								update="sampledistrict1" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.three']}" /></td>
					<td><p:inputText
							disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address3}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu styleClass="samplestate"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
										style="width: 249px;margin-bottom: 5px;" id="sampledistrict1"
										required="#{isRequire}" label="#{lbl['lbl.sc.district']}"
										value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmDistrict.districtId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="district"
											value="#{qTScheduleDetailBackingBean.managedBean.districts}"
											itemValue="#{district.districtId}"
											itemLabel="#{district.districtName}" />
										<p:ajax event="change"
											listener="#{qTScheduleDetailBackingBean.retrievePmCityList}"
											update="@(.sampledistrictCity)" partialSubmit="true" />
									</p:selectOneMenu></td>
								<td><p:message id="sampledistrict1Msg"
										for="sampledistrict1" display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.four']}" /></td>
					<td><p:inputText
							disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address4}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.town']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:selectOneMenu styleClass="sampledistrictCity"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
										style="width: 249px;margin-bottom: 5px;" id="samplecity1"
										required="#{isRequire}" label="#{lbl['lbl.sc.town']}"
										value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmCity.cityId}">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="" />
										<f:selectItems var="city"
											value="#{qTScheduleDetailBackingBean.managedBean.citys}"
											itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
									</p:selectOneMenu></td>
								<td><p:message id="samplecity1Msg" for="samplecity1"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td />
					<td />
					<td><p:outputLabel value="#{lbl['lbl.sc.post.code']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:inputText id="samplepost1" required="#{isRequire}"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
										label="#{lbl['lbl.sc.post.code']}"
										value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.postcode}"
										size="30" maxlength="10">
										<p:ajax event="blur" partialSubmit="true" process="@this"
											listener="#{qTScheduleDetailBackingBean.validatePostcode}" />
									</p:inputText></td>
								<td><p:message id="samplepostpost1Msg" for="samplepost1"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</p:panel>
	</c:if>
	<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
		toggleable="true">
		<p:dataTable var="contactpersondetails" id="cpersondetailsid"
			value="#{qTScheduleDetailBackingBean.managedBean.scQtContactPersons}"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedContactPersons}"
			styleClass="contactdetails" rowKey="#{contactpersondetails}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="rowIndex" rows="10">

			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />

			<ac:paginator for="cpersondetailsid" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<h:inputText value="#{contactpersondetails.name}"
					style="width: 200px;"
					readonly="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.tel.no']}">
				<h:inputText value="#{contactpersondetails.phoneNo}"
					style="width: 120px;"
					readonly="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.fax.no']}">
				<h:inputText value="#{contactpersondetails.faxNo}"
					style="width: 120px;"
					readonly="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.email']}">
				<h:inputText value="#{contactpersondetails.email}"
					readonly="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />
			</p:column>
		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				styleClass="BtnSpacing"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
				process="@this, cpersondetailsid" partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.addContactPerson}"
				update="cpersondetailsid" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				styleClass="BtnSpacing" process="@this, cpersondetailsid"
				partialSubmit="true" oncomplete="contactPersonDeletePopUp.show();"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
				update="@([id$=#{contactPersonDeleteId}])" />
		</div>
		<ui:param name="contactPersonDeleteId" value="contactPersonDeleteId" />
		<ac:confirmationPopup id="#{contactPersonDeleteId}"
			widget="contactPersonDeletePopUp"
			okAction="qTScheduleDetailBackingBean.deleteContactPerson"
			width="35%" height="100"
			title="#{lbl['lbl.sc.contact.person.details']}"
			content="#{lbl['lbl.sc.dialog.confirm.contact.person.dtls']}"
			update="@([id$=cpersondetailsid])" />
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.desk.officer.admin']}"
		toggleable="true">
		<p:dataTable id="doaaid" var="deskofficeradmin"
			value="#{qTScheduleDetailBackingBean.managedBean.pmuserContactpersonList}"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedpmuserContactpersonList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{deskofficeradmin}" rowIndexVar="rowIndex" rows="10">

			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />

			<ac:paginator for="doaaid" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<p:selectOneMenu value="#{deskofficeradmin.user.userId}"
					id="doaaUserId"
					readonly="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{qTScheduleDetailBackingBean.managedBean.deskOfficerAdmin}"
						var="appName" itemLabel="#{appName.userName}"
						itemValue="#{appName.userId}" />
					<p:ajax event="change" process="doaaUserId" update="doaaUserId"
						listener="#{qTScheduleDetailBackingBean.retrievePmuserName(deskofficeradmin,rowIndex)}" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				styleClass="BtnSpacing"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}"
				process="@this, doaaid" partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.addDeskOfficerAdminAssistant}"
				update="doaaid" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				styleClass="BtnSpacing" process="@this, doaaid" partialSubmit="true"
				oncomplete="doaaDeletePopUp.show()"
				update="@([id$=#{doaaDeleteId}])"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SCHDETAILS)}" />
		</div>
		<ui:param name="doaaDeleteId" value="doaaDeleteId" />
		<ac:confirmationPopup id="#{doaaDeleteId}" widget="doaaDeletePopUp"
			okAction="qTScheduleDetailBackingBean.deleteDeskOfficerAdminAssistant"
			width="40%" height="100"
			title="#{lbl['lbl.sc.qt.desk.officer.admin']}"
			content="#{lbl['lbl.sc.dialog.confirm.doaa.dtls']}"
			update="@([id$=doaaid])" />
	</p:panel>
</ui:composition>
