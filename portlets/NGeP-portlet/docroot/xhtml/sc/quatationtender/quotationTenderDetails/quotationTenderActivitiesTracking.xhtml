<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.activity.tracking']}"
		style="width: 100%" toggleable="true">
		<p:dataTable id="activitiestrackingidid" var="qtActivityBean"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{qTDetailBB.managedBean.qtActivityBeans}">

			<p:column headerText="#{lbl['lbl.sc.activities']}">
				#{qtActivityBean.activityCode.codeName}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.assigned.to']}">
				#{qtActivityBean.assignedTo}
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				#{qTDetailBB.getStatusDescById(qtActivityBean.statusId)}
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
