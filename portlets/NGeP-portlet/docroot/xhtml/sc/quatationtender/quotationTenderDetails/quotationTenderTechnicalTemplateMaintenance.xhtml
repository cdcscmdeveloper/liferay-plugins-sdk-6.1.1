<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<table width="100%">
			<tr>
				<td align="right">
					<p:commandButton value="#{lbl['lbl.btn.back']}"
						style="float:left;"
						action="#{qTDetailBB.technicalSpecBackAction}" />
				</td>
			</tr>
		</table>
		<p:panel header="#{lbl['lbl.sc.template.spec']}" toggleable="true">
			<table width="100%">
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.document.title']}" /></td>
					<td colspan="3"><p:inputTextarea rows="2" cols="95"
							style="margin-bottom:5px;width:98%;" maxlength="200" disabled="true"
							value="#{qTDetailBB.managedBean.qtDoc.tplSpecMaster.specName}" /></td>
				</tr>
				<tr>
					<td style="width:150px;"><h:outputLabel value="#{lbl['lbl.sc.item.type']}" /></td>
					<td style="width:135px;"><p:inputText disabled="true" size="50"
							value="#{qTDetailBB.getParameterDesc(qTDetailBB.managedBean.qtDoc.tplSpecMaster.itemTypeCode)}" /></td>
					<td style="width:155px;"><h:outputLabel value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{qTDetailBB.getParameterDesc(qTDetailBB.managedBean.qtDoc.tplSpecMaster.specTypeCode)}" /></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{qTDetailBB.getParameterDesc(qTDetailBB.managedBean.qtDoc.tplSpecMaster.itemOriginCode)}" /></td>
				</tr>
				<tr>
					<td><h:outputLabel
							value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:inputText disabled="true" size="50"
							value="#{qTDetailBB.getStatusDescById(qTDetailBB.managedBean.qtCheckList.pmStatus.statusId)}" /></td>
				</tr>
			</table>
		</p:panel>

		<ac:templateSpec
			templateSpecBean="#{qTDetailBB.managedBean.templateSpecBean}"
			editable="false" />

	</ui:define>
</ui:composition>
