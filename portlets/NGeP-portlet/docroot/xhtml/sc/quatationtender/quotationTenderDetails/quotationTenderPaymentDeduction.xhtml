<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.deduction.payment']}" id="deductionPayid" toggleable="true">
		<p:dataTable id="deductPaymentTblId" widgetVar="deductPaymentTblWidget" 
			var="scQtDeduction"
			value="#{qTDeductionPaymentBackingBean.managedBean.scQtDeductionList}"
			selection="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{scQtDeduction}" rowIndexVar="rowIndex" rows="10"
			selectionMode="single">

			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update=":form:deductionPayid" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update=":form:deductionPayid" />

			<ac:paginator for="deductPaymentTblId" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.deduction.type']}"/>
					<ac:iconTooltip id="dedType#{rowIndex}" value="#{lbl['lbl.sc.deduction.type.tooltip']}" />
				</f:facet>
				<h:selectOneMenu id="deductionType"
					value="#{scQtDeduction.deductionType.parameterId}" disabled="#{qTDetailBB.isAuditor()}">
					<f:selectItems
						value="#{qTDeductionPaymentBackingBean.getDeductionTypes()}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update=":form:deductionPayid, deductionamountid"
						oncomplete="deductPaymentTblWidget.unselectAllRows(); deductPaymentTblWidget.selectRow(#{rowIndex}, true);"
						listener="#{qTDeductionPaymentBackingBean.deductionTypeChange(rowIndex,scQtDeduction)}" />
				</h:selectOneMenu>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.deduction.amount']}">
				<h:panelGroup id="deductionamountid">
					<p:inputText id="amtid" size="30" maxlength="18" required="true"
						label="#{lbl['lbl.sc.deduction.amount']}"
						value="#{scQtDeduction.deductionAmount}"
						style="margin-right:5px;text-align:right;"
						rendered="#{scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeFixed}" disabled="#{qTDetailBB.isAuditor()}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							maxIntegerDigits="14"></ac:validateNumber>
					</p:inputText>
					<p:message id="amtidMsg" for="amtid" display="icon" />
				</h:panelGroup>
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" styleClass="BtnSpacing"
				process="@this, deductPaymentTblId" partialSubmit="true"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_DEDUCTIONPAYMENT)}"
				action="#{qTDeductionPaymentBackingBean.addDeductionPaymentAction}"
				oncomplete="deductPaymentTblWidget.paginator.endLink.click();"
				update="deductPaymentTblId" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_DEDUCTIONPAYMENT)}"
				process="@this, deductPaymentTblId" partialSubmit="true"
				oncomplete="deductionPayDeletePopUp.show();"
				update="@([id$=#{deductionPayDeleteId}])"/>
		</div>
		<ac:confirmationPopup id="deductionPayDeleteId"
				widget="deductionPayDeletePopUp"
				okAction="qTDeductionPaymentBackingBean.deleteDeductionPaymentAction" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		
		<h:outputText value="#{lbl['lbl.sc.deduction.payment']} > " /> 
	    <h:outputText value="#{lbl['lbl.sc.deduction.clauses']} " />
	    <h:outputText style="margin-left: 140px;" value="#{qTDeductionPaymentBackingBean.managedBean.clausesTitle}" />
	    <h:panelGroup id="clausePnl">
			<p:dataTable id="deductClauseTbl" widgetVar="deductClauseTblWidget"
				var="scQtDeductionClause"
				value="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
				rows="10" rowKey="#{scQtDeductionClause}" rowIndexVar="rowIndex">
				
				<ac:paginator for="deductClauseTbl" />
				
				<p:column style="width:2%" disabledSelection="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_DEDUCTIONPAYMENT)}">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selectAllDeductionClauseId"
							value="#{qTDeductionPaymentBackingBean.flag}">
							<p:ajax partialSubmit="true" process="@form" update="deductClauseTbl"
								listener="#{qTDeductionPaymentBackingBean.selectAllDeductionClause}"/>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{scQtDeductionClause.selected}">
							<p:ajax partialSubmit="true" process="@this" update="deductClauseTbl" />
					</p:selectBooleanCheckbox>
				</p:column>		
				
				<p:column style="white-space:normal">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.deduction.clause']}" />
					</f:facet>
					<ui:fragment
						rendered="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers}">
						<p:inputTextarea id="otherClause" value="#{scQtDeductionClause.clauseDesc}"
							label="#{lbl['lbl.sc.deduction.clause']}" required="true"
							cols="140" rows="2" maxlength="500" style=" margin-bottom:5px;width :95%;" >
							<p:ajax event="keyup" />
						</p:inputTextarea>
						<p:message id="otherClauseMsg" for="otherClause" display="icon" />
					</ui:fragment>
					<ui:fragment
						rendered="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode ne ParameterConst.deductionTypeOthers}">
						<h:outputText escape="false" value="#{scQtDeductionClause.pmClause.clauseDesc}" rendered="#{!empty scQtDeductionClause.pmClause}" />
					</ui:fragment>
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn">
				<h:panelGroup
					rendered="#{!empty qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction and qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers}">
					<p:commandButton value="#{lbl['lbl.btn.add']}" styleClass="BtnSpacing"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_DEDUCTIONPAYMENT)}"
						process="@this, deductClauseTbl" partialSubmit="true"
						action="#{qTDeductionPaymentBackingBean.addDeductionClauseAction}"
						oncomplete="deductClauseTblWidget.paginator.endLink.click();"
						update="deductClauseTbl" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_DEDUCTIONPAYMENT)}"
						process="@this, deductClauseTbl" partialSubmit="true"
						oncomplete="deductionClauseDeletePopUp.show();"
						update="@([id$=#{deductionClauseDeleteId}])" />
				</h:panelGroup>
			</div>
			<ac:confirmationPopup id="deductionClauseDeleteId"
				widget="deductionClauseDeletePopUp"
				okAction="qTDeductionPaymentBackingBean.deleteDeductionClause" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
	    </h:panelGroup>
	</p:panel>
</ui:composition>
