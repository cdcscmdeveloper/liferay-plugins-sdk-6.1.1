<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.circular.list']}" toggleable="true">

		<p:dataTable id="circularList" var="circular" style="width:100%"
			value="#{specificationBackingBean.searchCircular}" rows="10"
			rowKey="#{circular.circularVerId}" rowIndexVar="index" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{specificationBackingBean.managedBean.circularVer}">
			<ac:paginator for="circularList"></ac:paginator>
			<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true"
				listener="#{specificationBackingBean.circularListSelect(specificationBackingBean.managedBean.circularVer)}"
				update=":form:panelItemGroupList"></p:ajax>
			<p:columnGroup>
				<p:row>

					<p:column headerText="#{lbl['lbl.sc.circular.no']}"
						style="width:15%;white-space: normal;">
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.circular.name']}"
						style="width:30%;white-space: normal;">
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.circular.type']}"
						style="width:10%">

					</p:column>



					<p:column headerText="#{lbl['lbl.sc.effective.date']}"
						style="width:10%">

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.exp.date']}" style="width:15%">

					</p:column>

					<p:column style="width:5%;text-align: center;">

					</p:column>

				</p:row>
			</p:columnGroup>

			<p:column headerText="#{lbl['lbl.sc.circular.no']}"
				style="width:15%;white-space: normal;">
				<h:outputText value="#{circular.circularNo}"
					style="text-align:right;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.circular.name']}"
				style="width:30%;white-space: normal;">
				<h:outputText value="#{circular.name}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.circular.type']}"
				style="width:15%">
				<h:outputText
					value="#{specificationBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, circular.docType)}"></h:outputText>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.effective.date']}"
				style="width:10%">
				<h:outputText value="#{circular.startDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.exp.date']}" style="width:10%">
				<h:outputText value="#{circular.endDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.selection']}"
				selectionMode="single" style="width:5%;text-align: center;"
				disabledSelection="#{specificationBackingBean.circularDateComparision(circular.endDate)}"></p:column>
		</p:dataTable>


		<h:panelGroup id="panelItemGroupList">
			<ui:fragment
				rendered="#{specificationBackingBean.managedBean.circularType eq 'PQ'}">
			
         		#{specificationBackingBean.managedBean.ctCircularVer.circularNo}>#{lbl['lbl.sc.spec.circular.item.list']}
         		<ac:iconTooltip
					value="#{lbl['lbl.sc.spec.circular.item.list.tooltip']}" />

				<p:dataTable id="panelItemList" var="panelItem" rowIndexVar="index"
					style="width:100%" rows="10"
					value="#{specificationBackingBean.managedBean.panelItemList}"
					selection="#{specificationBackingBean.managedBean.selectCtPanelItem}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowKey="#{panelItem}">

					<ac:paginator for="panelItemList"></ac:paginator>
					<p:ajax event="rowSelectRadio" process="@this" partialSubmit="true"
						listener="#{specificationBackingBean.panelItemSelect}"></p:ajax>
					<p:columnGroup>
						<p:row>


							<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
								style="width:20%;white-space: normal;">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.specification']}"
								style="width:15%;white-space: normal;">

							</p:column>
							<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
								style="width:10%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
								style="width:5%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.uom']}" style="width:15%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
								style="width:15%">

							</p:column>

							<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
								style="width:18%">

							</p:column>

							<p:column>

							</p:column>

						</p:row>
					</p:columnGroup>

					<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
						style="white-space: normal;">
						<h:outputText value="#{panelItem.itemName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.specification']}"
						style="white-space: normal;">
						<h:outputText value="#{panelItem.specification}" />

					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.spec.panel.item.category']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.panel.item.category.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
					</p:column>

					<p:column style="width:5%">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.spec.panel.coverage']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.spec.panel.coverage.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{specificationBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.uom']}" style="width:15%">
						<h:outputText value="#{panelItem.pmUom.uomName}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
						style="width:10%; text-align:right;">
						<h:outputText value="#{panelItem.minimumOrderQty}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
						style="width:10%; white-space:normal; text-align:right;">
						<h:outputText value="#{panelItem.maxProcureAmt}">
							<f:convertNumber
								pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						</h:outputText>
					</p:column>

				</p:dataTable>


			</ui:fragment>
		</h:panelGroup>
	</p:panel>

</ui:composition>
