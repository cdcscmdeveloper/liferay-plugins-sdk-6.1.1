<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isFCEditable" value="#{qTCommitteBackingBean.isFCEditable() or qTDetailBB.approvalScreen}" />
	<ui:param name="qtStatusAfterPendingRecommendation"
		value="#{createQtBB.isQTStatusGreaterThan(scQt.qtStatus.statusId, QTStatusConst.qtConsolidationReport)
				and qTDetailBB.managedBean.maintanceFlow}" /><ui:remove>21692</ui:remove>
	<ui:param name="isDisable"
		value="#{qTDetailBB.approvalScreen or (qtStatusAfterPendingRecommendation and !qTDetailBB.managedBean.userAbleToChangePBSecretary)}" />

	<p:panel>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.finalization.secretary.instruction']}" escape="false" />
		<BR />
		<ui:remove>#37809 Start Vinod</ui:remove>
		<ui:remove>Removed old dropdown fields and added table changes</ui:remove>
		<ui:param name="isFCSecEmpty" value="#{empty qTDetailBB.managedBean.qt.finalizationSecratery.userName}" />
		<p:panelGrid style="margin-top:5px;width:100%;"
			id="finalizationsecretaryid"
			styleClass="panelGridBorders tr, panelGridBorders td">
			<f:facet name="header">
				<p:row>
					<p:column>
						<p:selectBooleanCheckbox disabled="#{(isFCEditable and isDisable) or !isFCEditable or isFCSecEmpty}"
							value="#{qTDetailBB.managedBean.fcSecretarySelected}">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=finalizationsecretaryButtonsId], [id$=finalizationsecretaryid])" />
						</p:selectBooleanCheckbox>
					</p:column>
					<p:column>
						<h:outputText value="#{lbl['lbl.sc.name']}" />
					</p:column>
					<p:column>
						<h:outputText
							value="#{lbl['lbl.sc.committee.finalization.do.header.ministry.org']}" />
					</p:column>
					<p:column>
						<h:outputText
							value="#{lbl['lbl.sc.committee.finalization.do.header.ptj.org.code']}" />
					</p:column>
					<p:column>
						<h:outputText
							value="#{lbl['lbl.sc.committee.finalization.do.header.ptj.org.name']}" />
					</p:column>
					<p:column>
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.role']}" />
					</p:column>
				</p:row>
			</f:facet>
			<c:if
				test="#{!isFCSecEmpty}">
				<p:row>
					<p:column>
						<p:selectBooleanCheckbox disabled="#{(isFCEditable and isDisable) or !isFCEditable}"
							value="#{qTDetailBB.managedBean.fcSecretarySelected}">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=finalizationsecretaryButtonsId], [id$=finalizationsecretaryid])" />
						</p:selectBooleanCheckbox>
					</p:column>
					<p:column>
						<p:commandLink id="secName"
							value="#{qTDetailBB.managedBean.qt.finalizationSecratery.userName}"
							onclick="fcSecDetailsPopUp.show();" />
					</p:column>
					<p:column>
						<h:outputText value="#{suppFinalizationBackingBean.getOrgDesc(qTDetailBB.managedBean.qt.finalizationSecratery.pmUserOrgs,ParameterConst.orgTypeMinistry)}" />
					</p:column>
					<p:column>
						<h:outputText value="#{qTCommitteBackingBean.getOrgDesc(qTDetailBB.managedBean.qt.finalizationSecratery.pmUserOrgs,ParameterConst.orgTypePtjGroup)}" />
					</p:column>
					<p:column>
						<h:outputText value="#{qTCommitteBackingBean.getOrgDesc(qTDetailBB.managedBean.qt.finalizationSecratery.pmUserOrgs,ParameterConst.orgTypePtj)}" />
					</p:column>
					<p:column>
						<h:outputText
							value="#{suppFinalizationBackingBean.getParameterDesc(suppFinalizationBackingBean.getParameterByTypeAndCode(ParameterTypeConst.committeeRole,
							ParameterConst.committeeRoleSecretary))}" />
					</p:column>
				</p:row>
			</c:if>
			<c:if
				test="#{isFCSecEmpty}">
				<p:row>
					<p:column colspan="6">
						<h:outputText value="#{lbl['lbl.datatable.msg.no.records.found']}" />
					</p:column>
				</p:row>
			</c:if>
		</p:panelGrid>
		<h:panelGroup id="finalizationsecretaryButtonsId">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
					styleClass="BtnSpacing"
					update="@([id$=addFCSecretaryid])"
					disabled="#{(isFCEditable and isDisable) or !isFCEditable or !isFCSecEmpty}"
					oncomplete="addFCSecretary.show();"
					process="@all" action="#{qTCommitteBackingBean.addFinalizationSecretaryAction}" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					styleClass="BtnSpacing" 
					disabled="#{(isFCEditable and isDisable) or !isFCEditable or !qTDetailBB.managedBean.fcSecretarySelected}"
					process="@this" partialSubmit="true"
					onclick="fcSecretaryDeletePopUp.show();"
					update="@([id$=finalizationsecretaryid])" />
			</div>
		</h:panelGroup>
		<c:if test="#{!isFCSecEmpty}">
			<p:dialog id="fcSecretaryDetailsId" width="600" height="150"
				header="#{lbl['lbl.sc.committee.add.member.search.header.user.info']}"
				widgetVar="fcSecDetailsPopUp" resizable="false"
				closable="true" modal="true">

				<p:panelGrid style="margin-top:5px;width:100%;"
					styleClass="panelGridBorders tr, panelGridBorders td">
					<f:facet name="header">
						<p:row>
							<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.name']}
							</p:column>
							<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.identification.no']}
							</p:column>
							<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.designation']}
							</p:column>
							<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.email']}
							</p:column>
							<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.grade']}
							</p:column>
							<p:column styleClass="panelGridHeaders">
								#{lbl['lbl.sc.pnp']}
								<ac:iconTooltip id="fcSecretaryDetailsPnpId" 
								value="#{lbl['lbl.sc.pnp.tooltip']}" />
							</p:column>
						</p:row>
					</f:facet>
					<p:row>
						<p:column>
							<h:outputText
								value="#{qTDetailBB.managedBean.qt.finalizationSecratery.userName}" />
						</p:column>
						<p:column>
							<h:outputText
								value="#{qTDetailBB.managedBean.qt.finalizationSecratery.identificationNo}" />
						</p:column>
						<p:column>
							<h:outputText
								value="#{qTDetailBB.managedBean.qt.finalizationSecratery.designation}" />
						</p:column>
						<p:column>
							<h:outputText
								value="#{qTDetailBB.managedBean.qt.finalizationSecratery.email}" />
						</p:column>
						<p:column>
							<h:outputText
								value="#{qTDetailBB.managedBean.qt.finalizationSecratery.grade}" />
						</p:column>
						<p:column>
							<h:outputText
								value="#{lbl[qTDetailBB.managedBean.qt.finalizationSecratery.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
						</p:column>
					</p:row>
				</p:panelGrid>

				<p:spacer height="1" />
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						onclick="fcSecDetailsPopUp.hide();" />
				</div>
			</p:dialog>

			<ac:confirmationPopup id="fcSecretaryDeleteid"
				widget="fcSecretaryDeletePopUp" width="450" height="100"
				okAction="qTCommitteBackingBean.deleteFinalizationSecretary()"
				title="#{lbl['lbl.txt.delete']}"
				content="#{lbl['lbl.msg.confirm.delete']}"
				process="@this" partialSubmit="true"
				update="@([id$=committeTabMenu], [id$=finalizationsecretaryid], [id$=finalizationsecretaryButtonsId])" />
		</c:if>
		<ui:remove>#37809 End Vinod</ui:remove>
	</p:panel>
</ui:composition>
