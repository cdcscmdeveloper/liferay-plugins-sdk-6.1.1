<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="isFCEditable" value="#{qTCommitteBackingBean.isFCEditable() or qTDetailBB.approvalScreen}" />

	<p:panel>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.finalization.secretary.instruction']}" escape="false" />
		<BR />
		
		<p:dataTable id="finalizationsecretaryid"
			value="#{qTDetailBB.managedBean.qt}" var="scQt"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowIndexVar="index" editable="true" rowKey="#{scQt}">
			<p:column headerText="#{lbl['lbl.sc.finalization.committee']}">
				<c:choose>
					<c:when test="#{isFCEditable}">
						<p:selectOneMenu id="finalizationCommittesId"
							value="#{scQt.finalizationCommitte.parameterId}"
							disabled="#{qTDetailBB.approvalScreen}"
							style="width: 200px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="secretary"
								value="#{qTDetailBB.retrieveFinalizationCommitteeType()}"/>
							<p:ajax event="change" update="@([id$=commType])"
								listener="#{qTDetailBB.changeSecretaryCommType}" />
						</p:selectOneMenu>
					</c:when>
					<c:otherwise>
						#{qTDetailBB.getParameterDesc(scQt.finalizationCommitte,null)}
					</c:otherwise>
				</c:choose>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.secretary.name']}">
				<h:panelGroup id="commType">
					<c:choose>
						<c:when test="#{isFCEditable}">
							<p:selectOneMenu id="secretaryId" 
								value="#{scQt.finalizationSecratery.userId}"
								disabled="#{qTDetailBB.approvalScreen}"
								style="width: 220px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems var="usersSecretary"
									value="#{qTDetailBB.retrievePmUserSecratryDtl(scQt.finalizationCommitte.parameterCode)}"
									itemLabel="#{usersSecretary.userName}"
									itemValue="#{usersSecretary.userId}" />
								<p:ajax event="change" partialSubmit="true" process="@this" update="@this,@(.amendButton)"
									listener="#{qTDetailBB.changeFCSecretaryUser}" />
							</p:selectOneMenu>
						</c:when>
						<c:otherwise>
							#{scQt.finalizationSecratery.userName}
						</c:otherwise>
					</c:choose>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
