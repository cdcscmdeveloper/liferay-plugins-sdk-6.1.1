<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:spacer height="3" />
	<p:panel>
		<p:dataTable id="finalizationsecretaryid"
			value="#{qTDetailBB.managedBean.qt}" var="finalizationcommittee"
			rowIndexVar="index" editable="true" rowKey="#{finalizationcommittee}">
			<p:column headerText="#{lbl['lbl.so.finalization.committee']}">
				<p:selectOneMenu id="finalizationCommitte"
					value="#{finalizationcommittee.finalizationCommitte.parameterId}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="secretary"
						value="#{qTDetailBB.managedBean.finalizationSecratary}"
						itemLabel="#{secretary.parameterCode}"
						itemValue="#{secretary.parameterId}" />
					<p:ajax event="change" update="commType, finalizationsecretaryid"
						listener="#{qTDetailBB.retrieveSecretaryNameByCommType}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.so.secretary.name']}">
				<h:panelGroup id="commType">
					<ui:fragment rendered="#{finalizationcommittee.finalizationCommitte.parameterCode eq 'PBB' or finalizationcommittee.finalizationCommitte.parameterCode eq 'PBA'}">
						<h:outputText
							value="#{finalizationcommittee.finalizationSecratery.userId}" />
					</ui:fragment>
					<ui:fragment rendered="#{finalizationcommittee.finalizationCommitte.parameterCode eq 'QCB' or finalizationcommittee.finalizationCommitte.parameterCode eq 'QCA'}">
						<h:outputText
							value="QCA" />
					</ui:fragment>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
