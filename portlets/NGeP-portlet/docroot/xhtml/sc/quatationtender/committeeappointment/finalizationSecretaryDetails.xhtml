<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:spacer height="3" />
	<p:panel>
		<p:dataTable id="finalizationsecretaryid"
			value="#{qTDetailBB.managedBean.qt}" var="qtfinalizationcommittee"
			rowIndexVar="index" editable="true"
			rowKey="#{qtfinalizationcommittee}">
			<p:column headerText="#{lbl['lbl.so.finalization.committee']}">
				<p:selectOneMenu id="finalizationCommittes"
					value="#{qtfinalizationcommittee.finalizationCommitte.parameterId}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="secretary"
						value="#{qTDetailBB.managedBean.finalizationSecratary}"
						itemLabel="#{secretary.parameterCode}"
						itemValue="#{secretary.parameterId}" />
					<p:ajax event="change" update="commType"
						listener="#{qTDetailBB.retrieveSecretaryNameByCommType}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.so.secretary.name']}">
				<h:panelGroup id="commType">
					<ui:fragment
						rendered="#{qtfinalizationcommittee.finalizationCommitte.parameterCode eq 'PBB' or qtfinalizationcommittee.finalizationCommitte.parameterCode eq 'PBA'}">
						<h:outputText
							value="#{qtfinalizationcommittee.finalizationSecratery.userName}" />
					</ui:fragment>
					<ui:fragment
						rendered="#{qtfinalizationcommittee.finalizationCommitte.parameterCode eq 'QCB' or qtfinalizationcommittee.finalizationCommitte.parameterCode eq 'QCA'}">
						<p:selectOneMenu id="usersSecretaryId"
							value="#{qtfinalizationcommittee.finalizationSecratery.userId}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="usersSecretary"
								value="#{qTDetailBB.managedBean.pmUsersSecretaryList}"
								itemLabel="#{usersSecretary.userName}"
								itemValue="#{usersSecretary.userId}" />
						</p:selectOneMenu>
					</ui:fragment>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
