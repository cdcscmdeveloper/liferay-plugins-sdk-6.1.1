<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:spacer height="3" />
	<p:panel>
		<p:dataTable id="finalizationsecretaryid" value="#{membersList}"
			var="finalizationcommittee" rowIndexVar="index" editable="true"
			rowKey="#{specificationcommittee}" style="width : 50%;">
			<p:column headerText="#{lbl['lbl.so.finalization.committee']}">
				<!-- <h:outputText
					value="#{finalizationcommittee.scCommittee.committeeType}" /> -->
				<p:selectOneMenu
					value="#{finalizationcommittee.scCommittee.committeeType}"
					style="width: 110px;margin-bottom: 5px;">
					<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
					<f:selectItems value="#{qTDetailBB.managedBean.finalizeComm}" />

				</p:selectOneMenu>
			</p:column>

			<p:column headerText="#{lbl['lbl.so.secretary.name']}">
				<h:outputText value="#{finalizationcommittee.memberName}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
