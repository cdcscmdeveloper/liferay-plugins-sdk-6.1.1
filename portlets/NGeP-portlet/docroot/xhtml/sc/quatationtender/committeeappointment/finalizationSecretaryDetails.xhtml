<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<p:dataTable id="finalizationsecretaryid"
			value="#{qTDetailBB.managedBean.qt}" var="finalizationSecretary"
			rowIndexVar="index" editable="true" rowKey="#{finalizationSecretary}">
			<p:column headerText="#{lbl['lbl.sc.finalization.committee']}">
				<p:selectOneMenu id="finalizationCommittesId"
					value="#{finalizationSecretary.finalizationCommitte.parameterId}"
					style="width: 200px;margin-bottom: 5px;"
					disabled="#{qTCommitteBackingBean.isFCEditable()}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="secretary"
						value="#{qTDetailBB.managedBean.finalizationSecratary}"
						itemLabel="#{secretary.parameterCode}"
						itemValue="#{secretary.parameterId}" />
					<p:ajax event="change" update="@([id$=commType])"
						listener="#{qTDetailBB.changeSecretaryCommType}" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.secretary.name']}">
				<h:panelGroup id="commType">
					<p:selectOneMenu id="secretaryId" 
						value="#{finalizationSecretary.finalizationSecratery.userId}"
						style="width: 220px;margin-bottom: 5px;" disabled="#{qTCommitteBackingBean.isFCEditable()}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems var="usersSecretary"
							value="#{qTDetailBB.retrievePmUserSecratryDtl(finalizationSecretary.finalizationCommitte.parameterCode)}"
							itemLabel="#{usersSecretary.userName}"
							itemValue="#{usersSecretary.userId}" />
					</p:selectOneMenu>

				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
