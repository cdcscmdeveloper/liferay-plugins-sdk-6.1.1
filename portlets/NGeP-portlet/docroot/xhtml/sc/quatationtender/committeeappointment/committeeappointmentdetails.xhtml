<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isQTStatusChecklistAndAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />
    <ui:param name="statusId" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId}" />
	<ui:param name="isQtScheduleAndDocAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(statusId,QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}"/>
	<ui:param name="evaluationType" value="#{qTDetailBB.managedBean.qt.evaluationType}"/>
	<ui:param name="committe" value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee.scCommittee}" />
	<ui:param name="isCommitteeInfoEditable"
			value="#{!qTCommitteBackingBean.isCommitteInfoEditable(committe.committeStatus.statusId,committe.committeeType.parameterCode)}" />
	<ui:param name="isEnablChkBoxes" value="#{qTCommitteBackingBean.isEnableCheckboxes(committe.committeStatus.statusId,committe.committeeType.parameterCode)}" />	
	<p:panel header="#{lbl['lbl.sc.qt.committee.appointment']}" toggleable="true">
	
		<c:if test="#{isQTStatusChecklistAndAfter}">
			<table style="width: 100%">
				<tr>
					<td style="width: 130px"><p:outputLabel
							value="#{lbl['lbl.sc.evaluation.type']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scEvaluationType, qTDetailBB.managedBean.qt.evaluationType)}"
							style="margin-right:5px;" disabled="true" size="30"
							readonly="true" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.evaluation.type.tooltip']}" /></td>
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.clone']}"
					rendered="#{isCommitteeInfoEditable and qTDetailBB.managedBean.selectedTabBean.tabType ne SourcingConstants.committeTypeFinalization}"
					action="#{qTCommitteBackingBean.cloneCommitteePopupAction}"
					update="@all"
					title="#{lbl['lbl.sc.qt.committee.btn.clone.tooltip']}" />
			</div>
			<ui:include src="clonecommitteeappointment.xhtml" />
		</c:if>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.committee.appointment.sc.instruction']}" escape="false" />
		<BR />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.committee.appointment.instruction']}" escape="false" rendered="#{isQTStatusChecklistAndAfter}" />
			
		<p:tabMenu id="committeTabMenu"
			activeIndex="#{qTDetailBB.managedBean.selectedTabIndex}">
			<c:forEach var="tabBean" varStatus="status"
				items="#{qTDetailBB.managedBean.scCommitteeMemberTabList}">
				<p:menuitem value="#{tabBean.titleName}"
					action="#{qTDetailBB.committeTabChangeAction(status.index)}" 
					partialSubmit="true"
					update="@form"
					process="@form">
					<c:if test="#{!empty tabBean.icon}">
						<f:attribute name="icon" value="#{tabBean.icon}" />
					</c:if>
				</p:menuitem>
			</c:forEach>
		</p:tabMenu>
			
		<ui:include src="committeeappointmenttabList.xhtml" />
		
	</p:panel>
	<c:if test="#{qTDetailBB.managedBean.committeeAppointmentRemark}">
		<ac:scRemarkAndAttachment
			remarkList="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalRemarks}"
			attachmentList="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalAttachments}"
			fileUploadListener="approvalBackingBean.handleFileUpload" />
	</c:if>
</ui:composition>
