<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Committee Appointment" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 108px"><p:outputLabel
						value="#{lbl['lbl.qt.evaluation.type']}" /></td>
				<td><p:inputText
						value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scEvaluationType, qTDetailBB.managedBean.qt.evaluationType)}"
						style="margin-right:5px;" disabled="true" size="30"
						readonly="true" /></td>
			</tr>
		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.clonebtn']}"
				actionListener="#{qTCommitteBackingBean.cloneCommitteePopupAction}"
				oncomplete="screen2.show();" process="@this" icon="ui-icon-clone"
				update="@(.cloneCommitteMember)" />
		</div>
		<p:tabMenu activeIndex="#{qTDetailBB.managedBean.selectedTabIndex}" 
			model="#{qTDetailBB.managedBean.menuModel}"  >
			
			</p:tabMenu>		
		
		<ui:include src="committeeappointmenttabList.xhtml" />
	</p:panel>
</ui:composition>
