<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isQTStatusChecklistAndAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />
    <ui:param name="statusId" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId}" />
	<ui:param name="isQtScheduleAndDocAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(statusId,QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}"/>
	<ui:param name="evaluationType" value="#{qTDetailBB.managedBean.qt.evaluationType}"/>
	<ui:param name="committe" value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee.scCommittee}" />
	<ui:param name="isCommitteeCloneable" value="#{qTCommitteBackingBean.isCommitteeCloneable()}" />
	<ui:param name="isCommitteeInfoEditable"
			value="#{qTCommitteBackingBean.isCommitteeInfoEditable(committe.committeStatus.statusId,committe.committeeType.parameterCode)}" />
	
	<ui:remove>//29464-start</ui:remove>
	<ui:param name="isCommitteeAppointmentMenuTab" value="#{qTDetailBB.managedBean.committeeAppointmentMenuTab}" />	
	<ui:param name="isEnablChkBoxes" value="#{qTCommitteBackingBean.isEnableCheckboxes(committe.committeStatus.statusId,committe.committeeType.parameterCode) and isCommitteeAppointmentMenuTab}" />	
	<ui:remove>//29464-end</ui:remove>
	
	<p:panel header="#{lbl['lbl.sc.qt.committee.appointment']}" toggleable="true">
	
		<c:if test="#{isQTStatusChecklistAndAfter}">
			<table style="width: 100%">
				<tr>
					<td style="width: 130px"><p:outputLabel
							value="#{lbl['lbl.sc.evaluation.type']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scEvaluationType, qTDetailBB.managedBean.qt.evaluationType)}"
							style="margin-right:5px;" disabled="true" size="30"
							readonly="true" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.evaluation.type.tooltip']}" /></td>
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.clone']}"
					rendered="#{isCommitteeInfoEditable and qTDetailBB.managedBean.selectedTabBean.tabType ne SourcingConstants.committeTypeFinalization and isCommitteeCloneable}"
					action="#{qTCommitteBackingBean.cloneCommitteePopupAction}"
					update="@all"
					title="#{lbl['lbl.sc.qt.committee.btn.clone.tooltip']}" />
			</div>
			<ui:include src="clonecommitteeappointment.xhtml" />
		</c:if>
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.committee.appointment.sc.instruction']}" escape="false" />
		<BR />
		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.qt.committee.appointment.instruction']}" escape="false" rendered="#{isQTStatusChecklistAndAfter}" />
		<ui:remove><!-- Bugs: 32277 start--></ui:remove>	
		<c:choose>
			<c:when test="#{qTDetailBB.managedBean.taskName eq 'Approve Committee'}">
				<c:set var="tabBeans" value="#{qTDetailBB.managedBean.readOnlyCommitteeTabBean}"/>
				<c:set var="committeeReadOnly" value="true"/>
			</c:when>
			<c:otherwise>
				<c:set var="tabBeans" value="#{qTDetailBB.managedBean.scCommitteeMemberTabList}"/>
				<c:set var="committeeReadOnly" value="false"/>
			</c:otherwise>
		</c:choose>
		<ui:remove><!-- Bugs: 32277 end--></ui:remove>	
		<p:tabMenu id="committeTabMenu"
			activeIndex="#{qTDetailBB.managedBean.selectedTabIndex}">
			<ui:remove><!-- Bugs: 32277 change to tabBeans--></ui:remove>	
			<c:forEach var="tabBean" varStatus="status"
				items="#{tabBeans}">
				<ui:remove><!-- Bugs: 32277 add new arg committeTabChangeAction--></ui:remove>	
				<p:menuitem value="#{tabBean.titleName}"
					action="#{qTDetailBB.committeTabChangeAction(status.index, committeeReadOnly)}" 
					partialSubmit="true"
					update="@form, committeeTabListId"
					process="@form"
					disabled="#{tabBean.disabled}">
					<c:if test="#{!empty tabBean.icon}">
						<f:attribute name="icon" value="#{tabBean.icon}" />
					</c:if>
				</p:menuitem>
			</c:forEach>
		</p:tabMenu>
			
		<ui:fragment id="committeeTabListId">
			<ui:include src="committeeappointmenttabList.xhtml" />
		</ui:fragment>
		
	</p:panel>
	<c:if test="#{qTDetailBB.managedBean.committeeAppointmentRemark and isCommitteeAppointmentMenuTab}"><ui:remove>//29464</ui:remove>
		<ac:scRemarkAndAttachment
			remarkList="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalRemarks}"
			attachmentList="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalAttachments}"
			fileUploadListener="approvalBackingBean.handleFileUpload" />
	</c:if>
</ui:composition>
