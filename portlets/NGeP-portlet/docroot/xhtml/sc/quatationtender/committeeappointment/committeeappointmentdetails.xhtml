<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isQTStatusChecklistAndAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />

	<p:panel header="#{lbl['lbl.sc.qt.committee.appointment']}" toggleable="true">
		<c:if test="#{isQTStatusChecklistAndAfter}">
			<table style="width: 100%">
				<tr>
					<td style="width: 130px"><p:outputLabel
							value="#{lbl['lbl.sc.evaluation.type']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scEvaluationType, qTDetailBB.managedBean.qt.evaluationType)}"
							style="margin-right:5px;" disabled="true" size="30"
							readonly="true" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.evaluation.type.tooltip']}" /></td>
				</tr>
			</table>

			<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.qt.committee.appointment.instruction']}" escape="false" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.clone']}" rendered="#{!qTCommitteBackingBean.isEnableCloneButton()}"
					action="#{qTCommitteBackingBean.cloneCommitteePopupAction}"
					update="@all"
					title="#{lbl['lbl.sc.qt.committee.btn.clone.tooltip']}" />
			</div>
			<ui:include src="clonecommitteeappointment.xhtml" />
		</c:if>
		
		<p:remoteCommand name="committeTabChangeAction" update="@form" partialSubmit="true" process="@form" action="#{qTDetailBB.committeTabChangeAction}" />
		
		<p:tabMenu id="committeTabMenu"
			activeIndex="#{qTDetailBB.managedBean.selectedTabIndex}"
			model="#{qTDetailBB.managedBean.menuModel}" />
			
		<ui:include src="committeeappointmenttabList.xhtml" />
		
		
	</p:panel>
	<c:if test="#{qTDetailBB.managedBean.committeeAppointmentRemark}">
		<ac:scRemarkAndAttachment
			remarkList="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalRemarks}"
			attachmentList="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalAttachments}"
			fileUploadListener="approvalBackingBean.handleFileUpload" />
	</c:if>
</ui:composition>
