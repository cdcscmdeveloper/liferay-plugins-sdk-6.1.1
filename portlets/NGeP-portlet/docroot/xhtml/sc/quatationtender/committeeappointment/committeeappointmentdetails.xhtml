<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isQTStatusChecklistAndAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />

	<p:panel header="#{lbl['lbl.sc.qt.committee.appointment']}" toggleable="true">
		<c:if test="#{isQTStatusChecklistAndAfter}">
			<table style="width: 100%">
				<tr>
					<td style="width: 130px"><p:outputLabel
							value="#{lbl['lbl.sc.evaluation.type']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scEvaluationType, qTDetailBB.managedBean.qt.evaluationType)}"
							style="margin-right:5px;" disabled="true" size="30"
							readonly="true" /> <ac:iconTooltip
							value="#{lbl['lbl.sc.evaluation.type.tooltip']}" /></td>
				</tr>
			</table>

			<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.qt.committee.appointment.instruction']}" escape="false" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.clone']}" rendered="#{!qTCommitteBackingBean.isEnableCloneButton()}"
					action="#{qTCommitteBackingBean.cloneCommitteePopupAction}"
					update="@all"
					title="#{lbl['lbl.sc.qt.committee.btn.clone.tooltip']}" />
			</div>
			<ui:include src="clonecommitteeappointment.xhtml" />
		</c:if>
		
		<p:remoteCommand name="committeTabChangeAction" update="@form" partialSubmit="true" process="@form" action="#{qTDetailBB.committeTabChangeAction}" />
		
		<p:tabMenu id="committeTabMenu"
			activeIndex="#{qTDetailBB.managedBean.selectedTabIndex}"
			model="#{qTDetailBB.managedBean.menuModel}" />
			
		<ui:include src="committeeappointmenttabList.xhtml" />
		
		<h:panelGroup rendered="#{qTDetailBB.managedBean.taskName eq 'Revise Committee'}">
		<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true"
		id="committeeremarksupDtls">
		<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.approval.remarks.instruction']}"
				rendered="#{approvalBackingBean.isReviceOrReject()}"></h:outputText>
	
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										maxlength="1000" rendered="#{remarkVar.remarkId eq null}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 200px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="commitAttchDlg.show();return false;"
									icon="iconAttachment" update="committeeremarksupDtls"
									value="#{lbl['lbl.btn.attach.files']}">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attaIds"
									value="#{qTDetailBB.managedBean.scQtApproval.scQtApprovalAttachments}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage
													value="/css/images/design/#{approvalBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{approvalBackingBean.downloadFile(attachFile)}" />
											</td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="commitAttchDlg"
		widgetVar="commitAttchDlg" modal="true" dynamic="true"
		resizable="false" width="700px" height="200"
		styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{qTDetailBB.handleFileUpload}"
			mode="advanced" id="dlgsuploadsids"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			update="committeeremarksupDtls"
			oncomplete="commitAttchDlg.hide()">
		</p:fileUpload>
	</p:dialog>
	</h:panelGroup>
	</p:panel>
</ui:composition>
