<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel styleClass="scMemberDtl" id="scmemberInfoDtls">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
				<td><p:inputText
						value="#{qTCommitteBackingBean.getStatusDescById(committe.committeStatus.statusId)}"
						size="30" readonly="true" disabled="true" /></td>
				<td style="width: 20px"><p:selectBooleanCheckbox
						value="#{committe.approvalReq}"
						disabled="#{qTDetailBB.managedBean.selectedTabBean.tabType eq ParameterConst.committeeTypeSpecificationCommittee or !isCommitteeInfoEditable}">
						<p:ajax update="@(.scMemberDtl)"
							listener="#{qTCommitteBackingBean.checkCommitteFormedOrNot()}" />
					</p:selectBooleanCheckbox></td>
				<td style="width: 100px"><p:outputLabel
						value="#{lbl['lbl.sc.qt.send.for.approval']}"
						style="word-wrap: break-word;" /></td>
			</tr>
		</table>

		<p:dataTable id="specificationcommitteeid" styleClass="clonetecid"
			value="#{committe.scCommitteeMembers}" var="specificationcommittee"
			rowIndexVar="index" rowKey="#{specificationcommittee}"
			selection="#{selectedCommittee}">

			<p:column selectionMode="multiple" style="width:2%"
				rendered="#{isCommitteeInfoEditable}" />

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<h:outputText value="#{specificationcommittee.memberName}"
					style="white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.identification.no']}"
				style="width: 10%">
				<h:outputText value="#{specificationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText value="#{specificationcommittee.designation}"
					style="white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{specificationcommittee.email}"
					style="white-space: normal;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
				<h:outputText value="#{specificationcommittee.grade}" />
			</p:column>

			<p:column style="width: 6%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[specificationcommittee.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

			<p:column style="width: 13%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.role']}" />
				</f:facet>

				<c:choose>
					<c:when test="#{isCommitteeInfoEditable}">
						<p:selectOneMenu id="roleid" label="#{lbl['lbl.sc.role']}"
							value="#{specificationcommittee.memberRole.parameterId}"
							style="width: 130px;margin-bottom: 5px;">
							<p:ajax event="change" partialSubmit="true" process="@this"
								listener="#{qTCommitteBackingBean.roleChangeListner(specificationcommittee)}" />
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="role"
								value="#{qTCommitteBackingBean.getRoleTypeDropdownValues(specificationcommittee.PNP)}"
								itemLabel="#{role.codeName}"
								itemValue="#{role.pmParameter.parameterId}" />
						</p:selectOneMenu>
						<p:message id="roleidMsg" for="roleid" display="icon" />
					</c:when>
					<c:otherwise>
						<h:outputText value="#{qTCommitteBackingBean.getParameterDesc(specificationcommittee.memberRole)}" />
					</c:otherwise>
				</c:choose>
				
				<!-- </ui:fragment> -->
			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
