<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel styleClass="scMemberDtl">
		<p:spacer height="2" />
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.status']}" /></td>
				<td><p:inputText
						value="#{qTCommitteBackingBean.getStatusDescById(committe.committeStatus.statusId)}"
						size="30" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox value="#{committe.approvalReq}"
						disabled="#{committe.approvalReq}" /></td>
				<td style="width: 110px"><p:outputLabel
						value="#{lbl['lbl.so.send.for.approval']}" /></td>
			</tr>
		</table>
		<p:spacer height="2" />
		<p:dataTable id="specificationcommitteeid" styleClass="clonetecid"
			value="#{committe.scCommitteeMembers}" var="specificationcommittee"
			rowIndexVar="index" rowKey="#{specificationcommittee}"
			selection="#{selectedCommittee}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="specificationcommitteeid" />

			<p:column headerText="#{lbl['lbl.so.bo.name']}">
				<h:outputText value="#{specificationcommittee.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.identification.no']}"
				style="width: 10%">
				<h:outputText value="#{specificationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.designation']}">
				<h:outputText value="#{specificationcommittee.designation}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.email']}">
				<h:outputText value="#{specificationcommittee.email}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.grade']}" style="width: 10%">
				<h:outputText value="#{specificationcommittee.grade}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="width: 5%">
				<h:outputText
					value="#{lbl[specificationcommittee.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

			<p:column style="width: 15%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.so.role']}" />
				</f:facet>

				<ui:fragment rendered="#{specificationcommittee.PNP}">
					<h:outputText value="Chairperson"
						rendered="#{specificationcommittee.memberRole.parameterCode eq 'C'}"
						disabled="#{committe.committeStatus.statusId eq 60202}" />
				</ui:fragment>
				<ui:fragment rendered="#{!specificationcommittee.PNP}">
					<p:selectOneMenu id="roleid" label="#{lbl['lbl.so.role']}"
						value="#{specificationcommittee.memberRole.parameterId}"
						style="width: 110px;margin-bottom: 5px;"
						disabled="#{committe.committeStatus.statusId eq 60202}">
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{qTCommitteBackingBean.roleChangeListner(specificationcommittee)}" />
						<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItems var="role"
							value="#{qTCommitteBackingBean.managedBean.roleTypes}"
							itemLabel="#{role.codeName}"
							itemValue="#{role.pmParameter.parameterId}" />
					</p:selectOneMenu>
					<p:message id="roleidMsg" for="roleid" display="icon" />
				</ui:fragment>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
