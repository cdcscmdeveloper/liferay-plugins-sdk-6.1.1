<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel styleClass="scMemberDtl">
		<p:spacer height="2" />
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.status']}" /></td>
				<td><p:inputText
						value="#{qTCommitteBackingBean.managedBean.title}"
						style="margin-right:5px;" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{qTCommitteBackingBean.managedBean.ecType}" /></td>
				<td style="width: 110px"><p:outputLabel
						value="#{lbl['lbl.so.send.for.approval']}" /></td>
			</tr>
		</table>
		<p:spacer height="2" />
		<p:dataTable id="specificationcommitteeid" value="#{membersList}"
			var="specificationcommittee" rowIndexVar="index" editable="true"
			rowKey="#{specificationcommittee}" selection="#{selectedMembersList}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="specificationcommitteeid" />

			<p:column headerText="#{lbl['lbl.so.bo.name']}">
				<h:outputText value="#{specificationcommittee.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.identification.no']}" style="width: 10%">
				<h:outputText value="#{specificationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.designation']}">
				<h:outputText value="#{specificationcommittee.designation}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.email']}">
				<h:outputText value="#{specificationcommittee.email}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.grade']}" style="width: 10%">
				<h:outputText value="#{specificationcommittee.grade}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="width: 5%">
				<h:outputText value="#{specificationcommittee.PNP ? 'Yes' : 'No'}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}"
				style="width: 15%">
				<ui:fragment rendered="#{specificationcommittee.PNP}">
					<h:outputText value="Chairperson"
						rendered="#{specificationcommittee.memberRole eq 'C'}" />
				</ui:fragment>
				<ui:fragment rendered="#{!specificationcommittee.PNP}">
					<p:selectOneMenu value="#{specificationcommittee.memberRole}"
						style="width: 110px;margin-bottom: 5px;">
						<f:selectItems
							value="#{qTCommitteBackingBean.managedBean.roleTypes}" />
					</p:selectOneMenu>
				</ui:fragment>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
