<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Specification Committee" toggleable="true">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText
						value="#{committeBackingBean.managedBean.title}"
						style="margin-right:5px;" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{committeBackingBean.managedBean.ecType}" /></td>
				<td style="width: 101px"><p:outputLabel
						value=" Send For Approval" /></td>
			</tr>
		</table>
		<p:dataTable id="specificationcommitteeid"
			value="#{committeBackingBean.managedBean.specificationCommitteList}"
			var="specificationcommittee" rowIndexVar="index" editable="true"
			rowKey="#{specificationcommittee}"
			selection="#{committeBackingBean.managedBean.selectSpecificationCommitteeList}">

			<p:column selectionMode="multiple" style="width:5%" />

			<ac:paginator for="specificationcommitteeid" />

			<p:column headerText="Name">
				<h:outputText value="#{specificationcommittee.memberName}" />
			</p:column>

			<p:column headerText="Identification No">
				<h:outputText value="#{specificationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="Designation">
				<h:outputText value="#{specificationcommittee.designation}" />
			</p:column>

			<p:column headerText="Grade">
				<h:outputText value="#{specificationcommittee.grade}" />
			</p:column>

			<p:column headerText="P&amp;P">
				<h:outputText value="#{specificationcommittee.pnp}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
				<h:outputText
					value="#{committeBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, specificationcommittee.memberRole)}" />
			</p:column>

			<p:column headerText="Action">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton id="specificationcommitteeadd"
				value="#{lbl['lbl.so.addbtn']}" process="@this"
				action="#{committeBackingBean.addCommitteMember}"
				oncomplete="newspecificationcommittee.show();"
				update="@(.scAddMember)" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{committeBackingBean.deleteSpecificationCommittee}"
				update="specificationcommitteeid" />

			<p:commandButton value="Clone To TEC" />
		</div>
	</p:panel>
</ui:composition>
