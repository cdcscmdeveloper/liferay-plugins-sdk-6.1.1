<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel styleClass="scMemberDtl">
		<p:spacer height="2" />
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText
						value="#{qTCommitteBackingBean.managedBean.title}"
						style="margin-right:5px;" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{qTCommitteBackingBean.managedBean.ecType}" /></td>
				<td style="width: 110px"><p:outputLabel
						value=" Send For Approval" /></td>
			</tr>
		</table>
		<p:spacer height="2" />
		<p:dataTable id="specificationcommitteeid" value="#{membersList}"
			var="specificationcommittee" rowIndexVar="index" editable="true"
			rowKey="#{specificationcommittee}" selection="#{selectedMembersList}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="specificationcommitteeid" />

			<p:column headerText="Name">
				<h:outputText value="#{specificationcommittee.memberName}" />
			</p:column>

			<p:column headerText="Identification No">
				<h:outputText value="#{specificationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="Designation">
				<h:outputText value="#{specificationcommittee.designation}" />
			</p:column>

			<p:column headerText="Email">
				<h:outputText value="#{specificationcommittee.email}" />
			</p:column>

			<p:column headerText="Grade">
				<h:outputText value="#{specificationcommittee.grade}" />
			</p:column>

			<p:column headerText="P&amp;P">
				<h:outputText value="#{specificationcommittee.PNP}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
				<h:outputText
					value="#{qTCommitteBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, specificationcommittee.memberRole)}" />
			</p:column>

		</p:dataTable>

	</p:panel>
</ui:composition>
