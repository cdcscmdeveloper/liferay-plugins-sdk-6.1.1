<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel styleClass="scMemberDtl" id="scmemberInfoDtls">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
				<td><p:inputText
						value="#{qTCommitteBackingBean.getStatusDescById(committe.committeStatus.statusId)}"
						size="50" readonly="true" disabled="true" /></td>
				<td style="width: 20px">
					<!-- 25037 -start- --> 
					<p:selectBooleanCheckbox
						value="#{committe.approvalReq}"
						disabled="#{!isCommitteeInfoEditable 
							or qTCommitteBackingBean.isDisabledSendForApproval(qTCommitteBackingBean.managedBean.selectedTabBean.tabType, committe.committeStatus.statusId )}">
						<!-- 25037 -end- -->
						<p:ajax update="@(.scMemberDtl,.amendButton)"
							listener="#{qTCommitteBackingBean.checkCommitteFormedOrNot()}" />
					</p:selectBooleanCheckbox>
				</td>
				<td style="width: 102px"><p:outputLabel
						value="#{lbl['lbl.sc.qt.send.for.approval']}"
						style="word-wrap: break-word;width:100px;text-align:left;" /></td>
			</tr>
		</table>

		<!-- 25037 -start- -->
		<ui:fragment rendered="#{!showHistory}">
			<!-- 25037 -end- -->
			<p:dataTable id="specificationcommitteeid" styleClass="clonetecid"
				value="#{committe.scCommitteeMembers}" var="specificationcommittee"
				rowIndexVar="index" rowKey="#{specificationcommittee}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selection="#{selectedCommittee}">

				<p:column style="width:3px;text-align:center;"
					rendered="#{isEnablChkBoxes}">
					<f:facet name="header">
						<!-- 25037 -start- -->
						<p:selectBooleanCheckbox
							disabled="#{!qTCommitteBackingBean.isCommitteeRoleEditable(qTCommitteBackingBean.getParameterByTypeAndCode('CR','S')) or !isCommitteeInfoEditable}"
							value="#{qTCommitteBackingBean.managedBean.templateSpecBean.selectAll}">
							<!-- 25037 -end- -->
							<p:ajax partialSubmit="true" process="@this" update="@form"
								listener="#{qTCommitteBackingBean.selectAll(qTCommitteBackingBean.managedBean.templateSpecBean.selectAll, committe.scCommitteeMembers)}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<!-- 25037 -start- -->
					<p:selectBooleanCheckbox
						disabled="#{!qTCommitteBackingBean.isCommitteeRoleEditable(specificationcommittee.memberRole) or !isCommitteeInfoEditable}"
						value="#{specificationcommittee.selected}">
						<!-- 25037 -end- -->
						<p:ajax partialSubmit="true" process="@this" update="@form" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{specificationcommittee.memberName}"
						style="white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}"
					style="width: 10%">
					<h:outputText value="#{specificationcommittee.icPassport}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText value="#{specificationcommittee.designation}"
						style="white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{specificationcommittee.email}"
						style="white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
					<h:outputText value="#{specificationcommittee.grade}" />
				</p:column>

				<p:column style="width: 6%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}"
							value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{lbl[specificationcommittee.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>

				<p:column style="width: 13%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.role']}" />
					</f:facet>
					<!-- 25037 -start- -->
					<ui:param name="filteredRoles"
						value="#{approvalBackingBean.managedBean.roleFilterList}" />
					<ui:fragment
						rendered="#{(isCommitteeInfoEditable and qTCommitteBackingBean.isCommitteeRoleEditable(specificationcommittee.memberRole))}">
						<!-- 25037 -end- -->
						<p:selectOneMenu id="roleid" label="#{lbl['lbl.sc.role']}"
							value="#{specificationcommittee.memberRoleId}"
							style="width: 130px;margin-bottom: 5px;">
							<p:ajax event="change" partialSubmit="true" process="@this" update="@this, @(.amendButton)"
								listener="#{qTCommitteBackingBean.roleChangedListener(specificationcommittee)}" />
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<!-- 25037 -start- -->
							<f:selectItems var="role" itemDisabled="#{!role.selectable}"
								value="#{qTCommitteBackingBean.getRoleTypeDropdownValuesBasedOnPTJ(specificationcommittee.PNP,qTDetailBB.managedBean.qt,specificationcommittee.pmUser, filteredRoles)}"
								itemLabel="#{role.codeName}"
								itemValue="#{role.pmParameter.parameterId}" />
							<!-- 25037 -end- -->
						</p:selectOneMenu>
						<p:message id="roleidMsg" for="roleid" display="icon" />
						<!-- 25037 -start- -->
					</ui:fragment>
					<ui:fragment
						rendered="#{!(isCommitteeInfoEditable and qTCommitteBackingBean.isCommitteeRoleEditable(specificationcommittee.memberRole))}">
						<h:outputText
							value="#{qTCommitteBackingBean.getParameterDesc(specificationcommittee.memberRole)}" />
					</ui:fragment>
					<!-- 25037 -end- -->
				</p:column>
			</p:dataTable>
			<!-- 25037 -start- -->
		</ui:fragment>
		<ui:fragment rendered="#{showHistory}">
			<ui:include src="committeeHistory.xhtml" />
		</ui:fragment>
		<!-- 25037 -end- -->
	</p:panel>

</ui:composition>
