<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		<p:spacer height="2" />
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.status']}" /></td>
				<td><p:inputText
						value="#{qTCommitteBackingBean.getStatusDescById(committe.committeStatus.statusId)}"
						size="30" disabled="true" readonly="true" /></td>
				<td />
				<td />
			</tr>
		</table>
		<p:spacer height="2" />
		<p:dataTable id="businessownercommitteeId"
			value="#{committe.scCommitteeMembers}" var="specificationcommittee"
			rowIndexVar="index" editable="true"
			rowKey="#{specificationcommittee}" selection="#{selectedMembersList}">

			<ac:paginator for="businessownercommitteeId" />

			<p:column headerText="#{lbl['lbl.so.bo.name']}">
				<h:outputText value="#{specificationcommittee.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.identification.no']}"
				style="widht: 15%">
				<h:outputText value="#{specificationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.designation']}"
				style="widht: 15%">
				<h:outputText value="#{specificationcommittee.designation}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.email']}" style="widht: 10%">
				<h:outputText value="#{specificationcommittee.email}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.grade']}" style="widht: 5%">
				<h:outputText value="#{specificationcommittee.grade}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="widht: 1%">
				<h:outputText
					value="#{lbl[specificationcommittee.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.consolidate']}"
				style="widht: 10%">
				<h:outputText
					value="#{lbl[specificationcommittee.consolidateValue ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

		</p:dataTable>
		<p:spacer height="5px" />
		<br />
	</p:panel>
	<p:spacer height="5px" />
	<p:panel header="#{lbl['lbl.so.specification.approval']}"
		toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="2"
			columnClasses="columnWidth10" style="margin-left: 26px;">
			<p:selectBooleanCheckbox
				value="#{qTBusinessOwnerBackingBean.managedBean.qt.specApprovalReq}"
				disabled="true">
				<p:ajax update="approvalSpec"
					listener="#{qTBusinessOwnerBackingBean.processChecked}" />
			</p:selectBooleanCheckbox>
			<h:outputLabel value="#{lbl['lbl.so.req.approval.specification']}" />
		</h:panelGrid>
		<p:spacer height="5px" />

		<h:panelGroup id="approvalSpec">
			<p:panel
				rendered="#{qTBusinessOwnerBackingBean.managedBean.qt.specApprovalReq ne '0'}">
				<table>
					<tr>
						<td><h:outputLabel
								value="#{lbl['lbl.so.ministry.spec.secretary']}" /></td>
						<td><p:inputText
								value="#{qTBusinessOwnerBackingBean.managedBean.qt.ministrySpecSecrataryId.userName}"
								disabled="true" /></td>
					</tr>
				</table>
			</p:panel>
		</h:panelGroup>
	</p:panel>
</ui:composition>
