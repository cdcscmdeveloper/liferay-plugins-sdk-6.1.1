<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style>
		.firstCol {
			width: 25%;
			height: 240px;
		}
		.firstCol div, .secondCol div{
			min-height: 100%;
		}
		.secondCol {
			width: 75%;
			height: 240px;
		}
		.gridContainer{
		    width: 100%;
		}
	</style>
	<h:panelGrid columns="2" styleClass="gridContainer" columnClasses="firstCol, secondCol">
		<p:panel id="historyPanelId" header="#{lbl['lbl.sc.history']}">
			<p:dataTable id="historyTableId" styleClass=""
				value="#{qTDetailBB.managedBean.committeeHistories.getModel()}" var="history" 
				rowKey="#{history}" rowIndexVar="index" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selectionMode="single" selection="#{qTDetailBB.managedBean.selectedCommitteeHistory}">
			<p:ajax event="rowSelect" listener="#{qTDetailBB.onSelectHistory()}" update="@([id$=historyMemberTableId])" />
			<p:column headerText="#{lbl['lbl.sm.no']}">
				<h:outputText value="#{index+1}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.created.date']}">
				<h:outputText value="#{history.createdDate}">
				<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			</p:dataTable>
			<ac:detachablePaginator loopId="historyTableId" paginatorObject="#{qTDetailBB.managedBean.committeeHistories}"/>
		</p:panel>
		<p:panel id="historyMemberPanelId" header="#{qTDetailBB.managedBean.currentCommitteeDesc}">
			<p:dataTable id="historyMemberTableId" styleClass=""
				value="#{qTDetailBB.managedBean.selectedHistoryMember.getModel()}" var="member"
				rowIndexVar="index"  emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" >
				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{member.memberName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{member.identificationNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.designation']}" style="white-space: normal;" >
					<h:outputText value="#{member.designation}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{member.email}" style="white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
					<h:outputText value="#{member.grade}" />
				</p:column>
				<p:column style="width: 6%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}" value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText value="#{lbl[ member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>
				<p:column style="width: 13%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.role']}" />
					</f:facet>
					<h:outputText value="#{qTDetailBB.getParameterDesc('CR', member.memberRole)}" />
				</p:column>
			</p:dataTable>
			<ac:detachablePaginator loopId="historyMemberTableId" paginatorObject="#{qTDetailBB.managedBean.selectedHistoryMember}"/>
		</p:panel>
	</h:panelGrid>
</ui:composition>
