<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<style>
		.firstCol {
			width: 10%;
			min-width: 200px;
			vertical-align: top;
			height: auto;
		}
		.secondCol {
			width: 90%;
			vertical-align: top;
			height: auto;
		}
		.gridContainer{
		    width: 100%;
		}
		.sp-centered{
			text-align:center; 
			display: block;
		}
		.history-member-table span > img{
			margin-top: -4px;
		}
	</style>
	<h:panelGrid columns="2" styleClass="gridContainer" columnClasses="firstCol, secondCol">
		<p:panel id="historyPanelId" header="#{lbl['lbl.sc.history']}">
			<ui:param name="historyPaginator" value="#{qTDetailBB.managedBean.committeeHistories}"/>
			<p:dataTable id="historyTableId" styleClass=""
				value="#{historyPaginator.model}" var="history" 
				rowKey="#{history}" rowIndexVar="index" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				selectionMode="single" selection="#{qTDetailBB.managedBean.selectedCommitteeHistory}">
			<p:ajax event="rowSelect" listener="#{qTDetailBB.onSelectHistory()}" update="@([id$=historyMemberPanelId])" />
			<p:column>
				<f:facet name="header" >
      				<h:outputText value="#{lbl['lbl.sm.no']}" styleClass="sp-centered"/>
   				</f:facet>
				<h:outputText value="#{((historyPaginator.pageIndex-1)*5)+(index+1)}" styleClass="sp-centered"/>
			</p:column>
			<p:column>
			   	<f:facet name="header">
      				<h:outputText value="#{lbl['lbl.sc.created.date']}" styleClass="sp-centered"/>
   				</f:facet>
				<h:outputText value="#{history.createdDate}" styleClass="sp-centered">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			</p:dataTable>
			<ac:detachablePaginator minimal="true" loopId="historyPanelId" paginatorObject="#{qTDetailBB.managedBean.committeeHistories}"/>
		</p:panel>
		<p:panel id="historyMemberPanelId" header="#{qTDetailBB.managedBean.currentCommitteeDesc}">
			<p:dataTable id="historyMemberTableId" styleClass="history-member-table"
				value="#{qTDetailBB.managedBean.selectedHistoryMember.model}" var="member"
				rowIndexVar="index"  emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" >
				<p:column headerText="#{lbl['lbl.sc.name']}" style="white-space: normal;">
					<h:outputText value="#{member.memberName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{member.identificationNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.designation']}" style="white-space: normal;" >
					<h:outputText value="#{member.designation}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{member.email}" style="white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{member.grade}" />
				</p:column>
				<p:column style="min-width:60px;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}" value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText value="#{lbl[ member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.role']}" />
					</f:facet>
					<h:outputText value="#{qTDetailBB.getParameterDesc('CR', member.memberRole)}" />
				</p:column>
			</p:dataTable>
			<ac:detachablePaginator loopId="historyMemberTableId" paginatorObject="#{qTDetailBB.managedBean.selectedHistoryMember}"/>
		</p:panel>
	</h:panelGrid>
</ui:composition>
