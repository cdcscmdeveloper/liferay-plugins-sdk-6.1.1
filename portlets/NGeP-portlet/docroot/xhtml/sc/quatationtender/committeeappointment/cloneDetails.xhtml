<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneid" header="#{lbl['lbl.sc.clone.committee']}"
		widgetVar="screen2" width="970" height="600" position="top"
		styleClass="cloneCommitteMember">
		<h:panelGroup id="pnlid">
			<p:messages id="clonemessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" severity="error, info" />
			<p:panel id="clonesearchpnlid" header="#{lbl['lbl.btn.search']}"
				toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td valign="top"><p:outputLabel
								value="#{lbl['lbl.sc.title']}" /></td>
						<td colspan="3"><p:inputText
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
								style="width:98%;" maxlength="100" /></td>
					</tr>

					<tr>
						<td style="width: 165px;"><p:outputLabel
								value="#{lbl['lbl.sc.qtn.no']}" /></td>
						<td style="width: 285px;"><p:inputText
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
								size="35" maxlength="21" /></td>
						<td style="width: 165px;"><p:outputLabel
								value="#{lbl['lbl.sc.procurement.mode']}" /></td>
						<td style="width: 285px;"><p:selectOneMenu
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
								style="width: 283px;margin-bottom: 5px;">
								<f:selectItems
									value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
							</p:selectOneMenu></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
						<td><p:calendar id="datecreatedfrm" showOn="button"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								size="29" readonlyInput="true" style="width:180px;">
								<p:ajax event="dateSelect" update="datecreatedto" />
							</p:calendar></td>
						<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
						<td><p:calendar id="datecreatedto" showOn="button"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
								mindate="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								size="29" readonlyInput="true" style="width:180px;">
								<f:attribute name="startDate"
									value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}" />
							</p:calendar></td>
					</tr>

					<tr>
						<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
						<td><p:calendar
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}"
								id="pbdateFrom" showOn="button" size="29" readonlyInput="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								style="width:180px;">
								<p:ajax event="dateSelect" update="pbdateTo" />
							</p:calendar></td>
						<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
						<td><p:calendar id="pbdateTo" showOn="button"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.toPublishDate}"
								mindate="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}"
								size="29" readonlyInput="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								style="width:180px;">
								<f:attribute name="startDate"
									value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}" />
								<f:validator validatorId="dateRangeValidator" />
							</p:calendar></td>
					</tr>
					<tr>
						<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
						<td><p:calendar
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}"
								id="cldateFrom" showOn="button" size="29" readonlyInput="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								style="width:180px;">
								<p:ajax event="dateSelect" update="cldateTo" />
							</p:calendar></td>
						<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
						<td><p:calendar id="cldateTo" showOn="button"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.toClosingDate}"
								mindate="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}"
								size="29" readonlyInput="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								style="width:180px;">
								<f:attribute name="startDate"
									value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}" />
								<f:validator validatorId="dateRangeValidator" />
							</p:calendar></td>
					</tr>

					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
						<td><p:selectOneMenu style="width: 283px;margin-bottom: 5px;"
								value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
								<f:selectItems
									value="#{qTDetailBB.getStatusDropdownValues('SC', 'QT')}" />
							</p:selectOneMenu></td>
						<td />
						<td />
					</tr>
				</table>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}" styleClass="BtnSpacing"
						action="#{qTCommitteBackingBean.cloneSearchQtAction}"
						update="pnlid" process="@parent" />
					<p:commandButton value="#{lbl['lbl.btn.reset']}" styleClass="BtnSpacing"
						action="#{qTCommitteBackingBean.resetClone}" update="pnlid"
						resetValues="true" partialSubmit="true" process="@this" />
				</div>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
				<p:dataTable id="clonesearchCommitteid"
					value="#{qTCommitteBackingBean.managedBean.cloneSearchQTDataModel}"
					selection="#{qTCommitteBackingBean.managedBean.selectedCloneTender}"
					rowKey="#{scQt}" selectionMode="single" var="scQt" lazy="true"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					styleClass="cloneResults" rows="10">

					<ac:paginator for="clonesearchCommitteid" />

					<p:ajax event="rowSelect" update=":form:pnlid"
						listener="#{qTCommitteBackingBean.onRowCloneCommitteeApprovalsAction}" />

					<p:column headerText="#{lbl['lbl.sc.qtn.no']}">
						<h:outputText value="#{scQt.qtNo}" style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.title']}">
						<h:outputText value="#{scQt.qtTitle}" style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
						<h:outputText
							value="#{qTCommitteBackingBean.getParameterDesc(scQt.procurementMode)}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.created.date']}">
						<h:outputText value="#{scQt.createdDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.published.date']}">
						<h:outputText value="#{scQt.publishDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.closing.date']}">
						<h:outputText value="#{scQt.closingDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.status']}">
						<h:outputText
							value="#{qTCommitteBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" style="white-space: normal;"/>
					</p:column>
				</p:dataTable>
				<br />
				<ui:fragment
					rendered="#{qTCommitteBackingBean.managedBean.cloneCommitteeSelectQt ne null}">
					#{qTCommitteBackingBean.managedBean.cloneCommitteeSelectQt.qtNo} > #{lbl['lbl.sc.committee.details']}
				</ui:fragment>
				<p:dataTable id="committeeListId"
					value="#{qTCommitteBackingBean.managedBean.cloneCommitteMemebers}"
					var="committeeMember" rowKey="#{committeeMember}"
					selection="#{qTCommitteBackingBean.managedBean.selectedCommitteMemebers}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					styleClass="cloneResults">
					
					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="#{lbl['lbl.sc.name']}">
						<h:outputText value="#{committeeMember.memberName}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.identification.no']}" style="width : 15%; white-space: normal;">
						<h:outputText value="#{committeeMember.icPassport}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.designation']}">
						<h:outputText value="#{committeeMember.designation}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.email']}">
						<h:outputText
							value="#{committeeMember.email}"
							style="white-space: normal; word-wrap:break-word;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.grade']}">
						<h:outputText value="#{committeeMember.grade}" />
					</p:column>

					<p:column style="width : 7%;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.pnp']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{lbl[committeeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.role']}">
						<h:outputText
							value="#{qTCommitteBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, committeeMember.memberRole.parameterCode)}"
							/>
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing"
						action="#{qTCommitteBackingBean.addCloneCommitteeMembersApprovalsAction}"
						update="@(.scMemberDtl)" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" styleClass="BtnSpacing"
						onclick="screen2.hide();" update="@(.scMemberDtl)" />
				</div>
			</p:panel>
		</h:panelGroup>
	</p:dialog>
</ui:composition>
