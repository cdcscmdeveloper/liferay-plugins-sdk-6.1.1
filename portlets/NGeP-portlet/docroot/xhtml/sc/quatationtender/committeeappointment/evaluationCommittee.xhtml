<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Evaluation Committee" toggleable="true">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText
						value="#{committeBackingBean.managedBean.title}"
						style="margin-right:5px;" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{committeBackingBean.managedBean.ecType}" /></td>
				<td style="width: 101px"><p:outputLabel
						value=" Send For Approval" /></td>
			</tr>
		</table>
		<p:dataTable id="evaluationcommitteeid"
			value="#{committeBackingBean.managedBean.evaluationCommitteList}"
			var="evaluationcommittee" rowIndexVar="index" editable="true"
			rowKey="#{evaluationcommittee}"
			selection="#{committeBackingBean.managedBean.selectEvaluationCommitteeList}">

			<p:column selectionMode="multiple" style="width:5%" />

			<ac:paginator for="evaluationcommitteeid" />

			<p:column headerText="Name">
				<h:outputText value="#{evaluationcommittee.memberName}" />
			</p:column>

			<p:column headerText="Identification No">
				<h:outputText value="#{evaluationcommittee.icPassport}" />
			</p:column>

			<p:column headerText="Designation">
				<h:outputText value="#{evaluationcommittee.designation}" />
			</p:column>

			<p:column headerText="Grade">
				<h:outputText value="#{evaluationcommittee.grade}" />
			</p:column>

			<p:column headerText="P&amp;P">
				<h:outputText value="#{evaluationcommittee.pnp}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
				<h:outputText
					value="#{committeBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, evaluationcommittee.memberRole)}" />
			</p:column>

			<p:column headerText="Action">
				<h:outputLabel value="" />
			</p:column>

		</p:dataTable>
		<p:spacer height="5px" />
		<div align="right">
			<p:commandButton id="evaluationcommitteeadd"
				value="#{lbl['lbl.so.addbtn']}" process="@this"
				action="#{committeBackingBean.addCommitteMember}"
				oncomplete="newevaluationcommittee.show();" update="@(.scAddMember)"
				icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{committeBackingBean.deleteEvaluationCommittee}"
				update="evaluationcommitteeid" />
		</div>
	</p:panel>
</ui:composition>
