
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

 	<c:choose>
 		<c:when test="#{qTDetailBB.managedBean.selectedTabBean.tabType eq SourcingConstants.committeTypeFinalization}">
 			<ui:include src="finalizationSecretaryDetails.xhtml" />
 		</c:when>
 		<c:when test="#{qTDetailBB.managedBean.selectedTabBean.tabType eq SourcingConstants.committeTypeMinistryFinance}">
 			<ui:include src="ministryOfFinance.xhtml" />
 		</c:when>
 		<c:otherwise>
 			<ui:param name="committe" value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee.scCommittee}" />
 			<ui:param name="qtCommitte" value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee}" />
			<ui:param name="selectedCommittee" value="#{qTDetailBB.managedBean.committemembers}" />
			<ui:param name="showHistory" value="#{qTDetailBB.managedBean.showHistory}" />
	
			<ui:include src="specificationCommitteeDetails.xhtml" />
			<h:panelGrid id="buttons" columns="2" style="width: 100% !important;" cellpadding = "0">
				<h:panelGroup layout="block">
					<p:commandButton value="#{!showHistory ? lbl['lbl.btn.view.history'] : lbl['lbl.btn.back']}"
						action="#{qTDetailBB.navigateToViewHistory(qtCommitte, !showHistory)}"
						update="scmemberInfoDtls, buttons"/>
				</h:panelGroup>
				<h:panelGroup layout="block" styleClass="ppRightBtn">
				<ui:fragment rendered="#{!showHistory}">
				<c:if test="#{!isQTStatusChecklistAndAfter}">
					<p:commandButton value="#{lbl['lbl.btn.clone']}"
						styleClass="BtnSpacing"
						rendered="#{isCommitteeInfoEditable and isCommitteeCloneable}"
						actionListener="#{qTCommitteBackingBean.committeeclonePopupAction(qTDetailBB.managedBean.selectedTabBean.scQtCommittee)}"
						oncomplete="screen2.show();" process="@this"
						update="@([id$=cloneid])" />
					<ui:include src="cloneDetails.xhtml" />
				</c:if>
			
				<p:commandButton id="specificationcommitteeadd"
					value="#{lbl['lbl.btn.add']}" process="@this" styleClass="BtnSpacing"
					rendered="#{isCommitteeInfoEditable and isCommitteeAppointmentMenuTab}"
					actionListener="#{qTCommitteBackingBean.addCommitteMember(qTDetailBB.managedBean.selectedTabBean.scQtCommittee, qTDetailBB.managedBean.selectedTabBean.titleName, qTDetailBB.managedBean.taskName)}"
					oncomplete="newspecificationcommittee.show();"
					update="@(.scAddMember)" /><ui:remove>//29464-add new rendered flag[isCommitteeAppointmentMenuTab] </ui:remove>
	
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
				disabled="#{qTDetailBB.deleteselectedList(committe.scCommitteeMembers)}"
				actionListener="#{qTDetailBB.deleteCommitteemembersData(committe.scCommitteeMembers)}"
					process="@this, specificationcommitteeid" partialSubmit="true" styleClass="BtnSpacing"
					oncomplete="committeeAppointmentDeletePopUp.show();"
					update="@([id$=#{committeeAppointmentDeleteId}])"
					rendered="#{isCommitteeInfoEditable and isCommitteeAppointmentMenuTab}" ><ui:remove>//29464</ui:remove>
					<f:setPropertyActionListener target="#{qTCommitteBackingBean.managedBean.extraDeleteComitteeSelection}" value="#{qTDetailBB.managedBean.committemembers}"></f:setPropertyActionListener>
						<f:setPropertyActionListener target="#{qTDetailBB.managedBean.committemembers}" value="#{null}"></f:setPropertyActionListener>
					</p:commandButton>
				
				<c:if test="#{isQTStatusChecklistAndAfter and qTDetailBB.managedBean.selectedTabBean.tabType eq ParameterConst.committeeTypeSpecificationCommittee and qTCommitteBackingBean.renderECOrTECButton(statusId,committe.committeeType.parameterCode)}">
					<c:if test="#{qTDetailBB.managedBean.qt.evaluationType eq ParameterConst.evaluationTypesTwoTier}">
						<p:commandButton value="#{lbl['lbl.sc.qt.clone.to.tec']}" styleClass="BtnSpacing"
							process="@this, specificationcommitteeid"
							update="@(.clonetecid),@([id$=committeTabMenu]),@([id$=committeMenus])"
							actionListener="#{qTCommitteBackingBean.addCloneToTecDtl}"
							title="#{lbl['lbl.sc.qt.clone.to.tec.tooltip']}" 
							disabled="#{empty qTDetailBB.managedBean.committemembers}"/>
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.qt.evaluationType eq ParameterConst.evaluationTypesOneTier}">
						<p:commandButton value="#{lbl['lbl.sc.qt.clone.to.ec']}" styleClass="BtnSpacing"
							process="@this, specificationcommitteeid"
							update="@(.clonetecid),@([id$=committeTabMenu]),@([id$=committeMenus])"
							actionListener="#{qTCommitteBackingBean.addCloneToEcDtl}"
							title="#{lbl['lbl.sc.qt.clone.to.ec.tooltip']}" 
							disabled="#{empty qTDetailBB.managedBean.committemembers}"/>
					</c:if>
				</c:if>
				</ui:fragment>
				</h:panelGroup>
			</h:panelGrid>
			<ui:param name="committeeAppointmentDeleteId"
				value="committeeAppointmentDeleteId" />
			<ac:confirmationPopup id="#{committeeAppointmentDeleteId}"
				widget="committeeAppointmentDeletePopUp"
				okAction="qTCommitteBackingBean.deleteSpecificationCommittee"
				loadingWidget="blockWidget" 
				title="#{lbl['lbl.sc.qt.committee.appointment']}"
				content="#{lbl['lbl.sc.dialog.confirm.committee.members.dtls']}"
				update="@form" />
 		</c:otherwise>
 	</c:choose>
</ui:composition>
