<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel>


		<ui:fragment
			rendered="#{qTDetailBB.managedBean.selectedTabBean.titleName eq 'Business Owner'}">

			<ui:param name="committe"
				value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee.scCommittee}" />

			<ui:include src="businessOwnerCommittee.xhtml" />

		</ui:fragment>

		<ui:fragment
			rendered="#{qTDetailBB.managedBean.selectedTabBean.titleName ne 'Finalization Secretary' and qTDetailBB.managedBean.selectedTabBean.titleName ne 'Business Owner'}">
			<ui:param name="committe"
				value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee.scCommittee}" />
			<ui:param name="selectedCommittee"
				value="#{qTDetailBB.managedBean.toBeDelCommitteMemebers}" />

			<ui:include src="specificationCommitteeDetails.xhtml" />

			<div class="ppRightBtn">
				<p:commandButton id="specificationcommitteeadd"
					value="#{lbl['lbl.so.addbtn']}" process="@this"
					rendered="#{!qTDetailBB.managedBean.selectedTabBean.editable and qTDetailBB.managedBean.selectedTabBean.titleName ne 'Finalization Secretary'}"
					actionListener="#{qTCommitteBackingBean.addCommitteMember(qTDetailBB.managedBean.selectedTabBean.scQtCommittee, committeeApproval.titleName)}"
					oncomplete="newspecificationcommittee.show();" update="@(.scAddMember)"/>

				<p:commandButton value="#{lbl['lbl.so.delete']}"
					process="@this, specificationcommitteeid"
					actionListener="#{qTCommitteBackingBean.deleteSpecificationCommittee}"
					update="@(.scMemberDtl)" 
					rendered="#{!qTDetailBB.managedBean.selectedTabBean.editable and qTDetailBB.managedBean.selectedTabBean.titleName ne 'Finalization Secretary'}" />

				<p:commandButton value="#{lbl['lbl.so.clone.to.tec']}"
					process="@this, specificationcommitteeid"
					update="@(.clonetecid),@([id$=committeTabMenu]),@([id$=committeMenus])"
					rendered="#{qTDetailBB.managedBean.selectedTabBean.titleName eq 'Specification Committee' and qTDetailBB.managedBean.qt.evaluationType eq 2}"
					actionListener="#{qTCommitteBackingBean.addCloneToTecDtl}" />
			</div>
		</ui:fragment>

		<ui:fragment
			rendered="#{qTDetailBB.managedBean.selectedTabBean.titleName eq 'Finalization Secretary'}">
			<ui:include src="finalizationSecretaryDetails.xhtml" />
		</ui:fragment>

	</p:panel>

</ui:composition>
