<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>

		<ui:include src="addspecificationcommittee.xhtml" />

		<p:tabView id="tabView" orientation="top" var="committeeApproval"
			activeIndex="#{qTCommitteBackingBean.managedBean.subTabIndex}"
			value="#{qTCommitteBackingBean.managedBean.scCommitteeMemberTabList}">

			<p:tab title="#{committeeApproval.titleName}">

				<ui:fragment
					rendered="#{committeeApproval.titleName eq 'Business Owner'}">

					<ui:param name="committe"
						value="#{committeeApproval.scCommittee}" />

					<ui:include src="businessOwnerCommittee.xhtml" />

				</ui:fragment>

				<ui:fragment
					rendered="#{committeeApproval.titleName ne 'Finalization Secretary' and committeeApproval.titleName ne 'Business Owner'}">

					<ui:param name="committe"
						value="#{committeeApproval.scCommittee}" />

					<ui:param name="selectedMembersList"
						value="#{qTCommitteBackingBean.managedBean.selectedCommitteMemebers}" />

					<ui:include src="specificationCommitteeDetails.xhtml" />

					<div class="ppRightBtn">
						<p:commandButton id="specificationcommitteeadd"
							value="#{lbl['lbl.so.addbtn']}" process="@this"
							action="#{qTCommitteBackingBean.addCommitteMember(committeeApproval.scCommittee, committeeApproval.titleName)}"
							oncomplete="newspecificationcommittee.show();"
							update="@(.scAddMember)" icon="ui-icon-add" />

						<p:commandButton value="#{lbl['lbl.so.delete']}"
							icon="ui-icon-delete"
							action="#{qTCommitteBackingBean.deleteSpecificationCommittee}"
							update="specificationcommitteeid" />

						<p:commandButton value="#{lbl['lbl.so.clone.to.tec']}"
							process="@this"
							rendered="#{committeeApproval.titleName eq 'Specification Committee'}"
							action="#{qTCommitteBackingBean.addCloneToTecDtl(committeeApproval.scCommittee)}" />
					</div>
				</ui:fragment>

				<ui:fragment
					rendered="#{committeeApproval.titleName eq 'Finalization Secretary'}">

					<ui:include src="finalizationSecretaryDetails.xhtml" />
				</ui:fragment>

			</p:tab>

		</p:tabView>
	</p:panel>
</ui:composition>
