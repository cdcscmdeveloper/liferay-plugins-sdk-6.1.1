<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>

		<p:tabView id="committeeappointmenttabView" dynamic="true">

			<p:tab id="tab1" title="Specification Committee"
				styleClass="noBorders tr,noBorders td">
				<ui:include
					src="/xhtml/sc/quatationtender/committeeappointment/specificationCommitteeDetails.xhtml" />
				<ui:include src="/xhtml/sc/committe/committeeaddscreen.xhtml" />
			</p:tab>

			<c:if test="#{qTDetailBB.managedBean.scQtSpec.evaluationType eq '2'}">
				<p:tab id="tab2" title="Opening Committee"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/sc/quatationtender/committeeappointment/openingCommitteeDetails.xhtml" />
				</p:tab>

				<p:tab id="tab3" title="Technical Evaluation Committee"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/sc/quatationtender/committeeappointment/technicalEvaluationCommitteeDetails.xhtml" />
				</p:tab>

				<p:tab id="tab4" title="Financial Evaluation Committee"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/sc/quatationtender/committeeappointment/financialEvaluationCommitteeDetails.xhtml" />
				</p:tab>
			</c:if>

			<c:if test="#{qTDetailBB.managedBean.scQtSpec.evaluationType eq '1'}">
				<p:tab id="tab5" title="Evaluation Committee"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/sc/quatationtender/committeeappointment/evaluationCommittee.xhtml" />
					<ui:include
						src="/xhtml/sc/quatationtender/committeeappointment/addevaluationcommittee.xhtml" />
				</p:tab>
			</c:if>

			<p:tab id="tab6" title="Finalization Secretary"
				styleClass="noBorders tr,noBorders td">
				<ui:include
					src="/xhtml/sc/quatationtender/committeeappointment/finalizationSecretaryDetails.xhtml" />
			</p:tab>

		</p:tabView>
	</p:panel>
</ui:composition>
