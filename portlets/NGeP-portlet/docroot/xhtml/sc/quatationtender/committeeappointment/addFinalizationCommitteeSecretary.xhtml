<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="addFCSecretaryid"
		header="#{lbl['lbl.sc.add']} #{qTCommitteBackingBean.managedBean.tabTitle}"
		dynamic="true" modal="true" widgetVar="addFCSecretary"
		styleClass="scAddMember" width="950" height="600" resizable="false"
		closable="true">
		<p:messages id="fcmessages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		<p:panel id="fcUserSearchPnlid" header="#{lbl['lbl.sc.search']}"
			toggleable="true">

			<table style="width: 100%;">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.finalization.committee']}" /></td>
					<td><p:selectOneRadio
							disabled="#{qTCommitteBackingBean.managedBean.disableFinalizationCommittee}"
							value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.finalizationCommitteeTypeId}">
							<f:selectItems
								value="#{qTDetailBB.retrieveFinalizationCommitteeType()}" />
							<p:ajax event="change" onstart="blockWidget.show()"
								oncomplete="blockWidget.hide()"
								update="@([id$=fcUserSearchPnlid], [id$=existingFinalizationsecretarysearchid])"
								listener="#{qTCommitteBackingBean.finalizationCommitteeTypeChange}" />
						</p:selectOneRadio></td>
				</tr>
				<c:if
					test="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.orgCat eq ParameterConst.orgCategoryPtj}">
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.committee.add.member.search.ministry']}" /></td>
						<td><p:selectOneMenu id="fcMinistryDD"
								disabled="#{qTCommitteBackingBean.managedBean.ministryNotNegeri}"
								value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.ministry}">
								<p:ajax onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()"
									update="@([id$=fcPtjGroupDD], [id$=fcPtjDD])"
									listener="#{qTCommitteBackingBean.onChangeDD(ParameterConst.orgTypeMinistry)}" />
								<f:selectItems
									value="#{qTCommitteBackingBean.managedBean.ministryDDList}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.committee.add.member.search.ptj.group']}" /></td>
						<td><p:selectOneMenu id="fcPtjGroupDD"
								value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.ptjGroup}">
								<p:ajax onstart="blockWidget.show()"
									oncomplete="blockWidget.hide()" update="@([id$=fcPtjDD])"
									listener="#{qTCommitteBackingBean.onChangeDD(ParameterConst.orgTypePtjGroup)}" />
								<f:selectItems
									value="#{qTCommitteBackingBean.managedBean.ptjGroupDDList}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.committee.add.member.search.ptj']}" /></td>
						<td><p:selectOneMenu id="fcPtjDD"
								value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.ptj}">
								<f:selectItems
									value="#{qTCommitteBackingBean.managedBean.ptjDDList}" />
							</p:selectOneMenu></td>
					</tr>
				</c:if>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /></td>
					<td colspan="3"><p:inputText
							onkeypress="if (event.keyCode == 13) { quotationTndrCommitteeAppointmentAddSearch.jq.click(); return false; }"
							value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.name}"
							size="64"
							required="#{qTCommitteBackingBean.managedBean.nameRequired}"
							id="fcName" label="#{lbl['lbl.sc.name']}"
							onmouseout="limitTextArea(this,1000);"
							styleClass="fcNameClass">
							<f:validateLength for="fcName" maximum="1000" />
						</p:inputText> <p:message id="fcNameMsg"
							for="fcName" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.id.type']}" /></td>
					<td colspan="3"><p:selectOneMenu
							value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.identificationType}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" /></td>
					<td colspan="3"><p:inputText
							onkeypress="if (event.keyCode == 13) { quotationTndrCommitteeAppointmentAddSearch.jq.click(); return false; }"
							value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.identificationNo}"
							id="fcIdNo" onmouseout="limitTextArea(this,500);"
							size="30">
							<f:validateLength for="fcIdNo" maximum="500" />
						</p:inputText> <p:message id="fcIdNoMsg" for="fcIdNo" display="icon" /></td>
				</tr>
			</table>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					widgetVar="quotationTndrCommitteeAppointmentAddSearch"
					action="#{qTCommitteBackingBean.searchFcUserAction}"
					update="@([id$=existingFinalizationsecretarysearchid])"
					process="@this, fcUserSearchPnlid" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{qTCommitteBackingBean.reset}"
					update="@([id$=fcUserSearchPnlid], [id$=existingFinalizationsecretarysearchid])"
					resetValues="true" partialSubmit="true" process="@this" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
			<p:dataTable id="existingFinalizationsecretarysearchid"
				value="#{qTCommitteBackingBean.managedBean.userSearchFcSecretaryDataModel}"
				selection="#{qTCommitteBackingBean.managedBean.selectedPmUser}"
				rowKey="#{existcommitteeuser.userId}" var="existcommitteeuser"
				lazy="true" style="width : 100%;" rows="10"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				styleClass="existingCommitteeResults" rowIndexVar="indexFC">

				<ac:paginator for="existingFinalizationsecretarysearchid" />

				<p:column style="width:3px;text-align:center;">
					<p:selectBooleanCheckbox value="#{existcommitteeuser.selected}"
						disabled="#{!existcommitteeuser.selected and qTCommitteBackingBean.managedBean.selectedFcSecretaryUser ne null}">
						<p:ajax partialSubmit="true" process="@all"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							listener="#{qTCommitteBackingBean.selectedFinalizationSec(existcommitteeuser)}"
							update="@([id$=existingFinalizationsecretarysearchid], [id$=addFinalizationsecretaryBtnId])" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{existcommitteeuser.userName}"
						style="white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{existcommitteeuser.identificationNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText value="#{existcommitteeuser.designation}"
						style="white-space: normal;" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.committee.add.member.search.ministry']}">
					<h:outputText style="white-space: normal;"
						value="#{qTCommitteBackingBean.getOrgDesc(existcommitteeuser.pmUserOrgs,ParameterConst.orgTypeMinistry)}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.committee.add.member.search.ptj.group']}">
					<h:outputText style="white-space: normal;"
						value="#{qTCommitteBackingBean.getOrgDesc(existcommitteeuser.pmUserOrgs,ParameterConst.orgTypePtjGroup)}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.committee.add.member.search.ptj']}">
					<h:outputText style="white-space: normal;"
						value="#{qTCommitteBackingBean.getOrgDesc(existcommitteeuser.pmUserOrgs,ParameterConst.orgTypePtj)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{existcommitteeuser.email}"
						style="white-space: normal;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{existcommitteeuser.grade}" />
				</p:column>

				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<p:graphicImage id="pnpTTImg#{indexFC}id"
							value="/css/images/design/ico-tooltips.png" />
						<p:tooltip id="pnpTT#{indexFC}id" for="pnpTTImg#{indexFC}id">
							<p:outputLabel escape="false"
								value="#{lbl['lbl.sc.pnp.tooltip']}" />
						</p:tooltip>
					</f:facet>
					<h:outputText
						value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.role']}">
					<h:outputText
						value="#{qTDetailBB.getParameterDesc(qTDetailBB.getParameterByTypeAndCode(ParameterTypeConst.committeeRole,
						ParameterConst.committeeRoleSecretary))}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing"
				id="addFinalizationsecretaryBtnId"
				action="#{qTCommitteBackingBean.okFCSecretaryAction}"
				process="@this" partialSubmit="true" onstart="blockWidget.show();"
				oncomplete="addFinalizationSec.hide(); blockWidget.hide();"
				disabled="#{empty qTCommitteBackingBean.managedBean.selectedFcSecretaryUser}"
				update="@([id$=finalizationsecretaryid], [id$=addFCSecretaryid], [id$=committeTabMenu])" />

			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				actionListener="#{qTCommitteBackingBean.cancelFCSecretaryAction}"
				onclick="addFinalizationSec.hide();" />
		</div>
		<p:ajax event="close" update="@([id$=addFCSecretaryid])"
			actionListener="#{qTCommitteBackingBean.cancelFCSecretaryAction}" />
	</p:dialog>
</ui:composition>
