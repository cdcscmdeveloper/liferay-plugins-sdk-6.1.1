<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Technical Evaluation Committee" toggleable="true">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText
						value="#{committeBackingBean.managedBean.title}"
						style="margin-right:5px;" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{committeBackingBean.managedBean.ecType}" /></td>
				<td style="width: 100px"><p:outputLabel
						value=" Send For Approval" /></td>
			</tr>
		</table>
		<p:dataTable id="technicalcommitteeid"
			value="#{committeBackingBean.managedBean.techEvaluationCommitteList}"
			var="technicalcommittee" rowIndexVar="index" editable="true"
			rowKey="#{technicalcommittee}"
			selection="#{committeBackingBean.managedBean.selectTechEvaluationCommitteeList}">

			<p:column headerText="Name">
				<h:outputText value="#{technicalcommittee.memberName}" />
			</p:column>

			<p:column headerText="Identification No">
				<h:outputText value="#{technicalcommittee.icPassport}" />
			</p:column>

			<p:column headerText="Designation">
				<h:outputText value="#{technicalcommittee.designation}" />
			</p:column>

			<p:column headerText="Grade">
				<h:outputText value="#{technicalcommittee.grade}" />
			</p:column>

			<p:column headerText="P&amp;P">
				<h:outputText value="#{technicalcommittee.pnp}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
				<h:outputText value="#{technicalcommittee.memberRole}" />
			</p:column>

			<p:column headerText="Action">
				<h:outputLabel value="" />
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton id="tecaddid" value="#{lbl['lbl.so.addbtn']}"
				process="@this" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" />
		</div>
	</p:panel>
</ui:composition>
