<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newspecificationcommitteeid" position="top"
		header="New #{qTCommitteBackingBean.managedBean.tabTitle}"
		dynamic="true" widgetVar="newspecificationcommittee" modal="true"
		styleClass="scAddMember">
		<p:panel id="scPanel">
			<p:messages id="scmessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<h:panelGrid columns="3" styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="*" styleClass="mandatory" />
				<h:outputLabel value="#{lbl['lbl.sc.committe.addscreen.selection']}" />
				<p:selectOneRadio
					value="#{qTCommitteBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{qTCommitteBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{qTCommitteBackingBean.userSelcetionAction}"
						update="newCommitteeProfile" process="@this" />
				</p:selectOneRadio>
			</h:panelGrid>
			<p:panel id="newCommitteeProfile" style="width:100%;margin-top:10px;">
				<c:if
					test="#{qTCommitteBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel id="usersearchpnlid" header="#{lbl['lbl.so.searchbtn']}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td style="width: 110px;"><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.identificationNo}"
										size="30" /></td>
							</tr>
						</table>
						<div class="ppRightBtn">
							<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
								action="#{qTCommitteBackingBean.searchUserAction}"
								update="existingcommitteesearchid" icon="ui-icon-search"
								process="@this, usersearchpnlid" />
							<p:commandButton value="#{lbl['lbl.so.reset']}"
								action="#{qTCommitteBackingBean.reset}" update="usersearchpnlid"
								icon="ui-icon-reset" resetValues="true" partialSubmit="true"
								process="@this" />
						</div>
					</p:panel>
					<p:panel header="#{lbl['lbl.so.result']}" toggleable="true">
						<p:dataTable id="existingcommitteesearchid"
							value="#{qTCommitteBackingBean.managedBean.userSearchCommitteeDataModel}"
							selection="#{qTCommitteBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existcommitteeuser.userId}" var="existcommitteeuser"
							lazy="true" style="width : 900px;"
							styleClass="existingCommitteeResults">

							<ac:paginator for="existingcommitteesearchid" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.so.bo.name']}">
								<h:outputText value="#{existcommitteeuser.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
								<h:outputText value="#{existcommitteeuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.designation']}">
								<h:outputText value="#{existcommitteeuser.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.email']}">
								<h:outputText
									value="#{existcommitteeuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.grade']}">
								<h:outputText value="#{existcommitteeuser.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.pp']}">
								<h:outputText value="#{existcommitteeuser.PMP ? 'Yes' : 'No'}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.role']}">
								<ui:fragment rendered="#{existcommitteeuser.PMP == true}">
									<h:outputText value="Chairperson" />
								</ui:fragment>
								<ui:fragment rendered="#{existcommitteeuser.PMP == false}">
									<p:selectOneMenu id="appaction"
										value="#{existcommitteeuser.memberRole.parameterId}"
										style="width: 110px;margin-bottom: 5px;">
										<f:selectItem itemLabel="-Select One-" itemValue="#{null}"></f:selectItem>

										<f:selectItems var="role"
											value="#{qTCommitteBackingBean.managedBean.roleTypes}"
											itemLabel="#{role.codeName}"
											itemValue="#{role.pmParameter.parameterId}" />

										<p:ajax event="change" partialSubmit="true">
										</p:ajax>
									</p:selectOneMenu>
								</ui:fragment>
							</p:column>
						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{qTCommitteBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="#{lbl['lbl.so.new.user']}" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.name']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="name1" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.name']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.memberName}"
										size="30" maxlength="50" /> <p:message id="name1Msg"
										for="name1" display="icon" /></td>
							</tr>
							<tr>
								<td style="width: 125px;"><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:selectOneMenu id="idtype1"
										required="true"
										label="#{lbl['lbl.sc.committe.addscreen.idtype']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu> <p:message id="idtype1Msg" for="idtype1" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idno']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="idNos1" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.idno']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.icPassport}"
										size="30" maxlength="15" /> <p:message id="idNos1Msg"
										for="idNos1" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.grade']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="grade1" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.grade']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.grade}"
										size="30" maxlength="10" /> <p:message id="grade1Msg"
										for="grade1" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.pp']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:selectOneRadio id="pnp1" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.pp']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio> <p:message id="pnp1Msg" for="pnp1" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.designation']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="designation1"
										required="true"
										label="#{lbl['lbl.sc.committe.addscreen.designation']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.designation}"
										size="30" maxlength="50" /> <p:message id="designation1Msg"
										for="designation1" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.email']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="email1" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.email']}"
										validatorMessage="#{qTCommitteBackingBean.managedBean.committeMember.email} is not valid"
										value="#{qTCommitteBackingBean.managedBean.committeMember.email}"
										size="30" maxlength="80">
										<f:validateRegex
											pattern="[\w\.-]*[a-zA-Z0-9_]@[\w\.-]*[a-zA-Z0-9]\.[a-zA-Z][a-zA-Z\.]*[a-zA-Z]" />
									</p:inputText> <p:message id="email1Msg" for="email1" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.role']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:selectOneMenu id="role" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.role']}"
										value="#{qTCommitteBackingBean.managedBean.committeMember.memberRole.parameterId}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu> <p:message id="roleMsg" for="role" display="icon" /></td>
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					process="@this, newCommitteeProfile, scPanel"
					action="#{qTCommitteBackingBean.okCommitteeAction}" ajax="true"
					icon="ui-icon-check" update="@(.scMemberDtl, scPanel)" />

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					styleClass="apply_button" process="@this"
					oncomplete="newspecificationcommittee.hide();"
					icon="ui-icon-cancel" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
