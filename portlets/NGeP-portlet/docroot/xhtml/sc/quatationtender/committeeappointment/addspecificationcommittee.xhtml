<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newspecificationcommitteeid" position="top"
		header="#{lbl['lbl.sc.add']} #{qTCommitteBackingBean.managedBean.tabTitle}"
		dynamic="true" widgetVar="newspecificationcommittee" modal="true"
		styleClass="scAddMember" width="950" height="600">
		<p:messages id="scmessages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		<c:if
			test="#{qTCommitteBackingBean.managedBean.committeMember.userSelection eq 'E' }">
			<p:panel id="usersearchpnlid" header="#{lbl['lbl.sc.search']}"
				toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.name']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:inputText  onkeypress="if (event.keyCode == 13) { quotationTndrCommitteeAppointmentAddSearch.jq.click(); return false; }"
								value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.name}"
								size="64" required="#{qTCommitteBackingBean.managedBean.nameRequired}" id="name2" 
								label="#{lbl['lbl.sc.name']}" styleClass="name2Class"/>
								<p:message id="name2Msg" for="name2" display="icon" />
								</td>
					</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.id.type']}" /></td>
						<td colspan="3"><p:selectOneMenu
								value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.identificationType}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItems
									value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" /></td>
						<td colspan="3"><p:inputText onkeypress="if (event.keyCode == 13) { quotationTndrCommitteeAppointmentAddSearch.jq.click(); return false; }"
								value="#{qTCommitteBackingBean.managedBean.userCommitteeSearchBean.identificationNo}"
								size="30" /></td>
					</tr>
				</table>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
					widgetVar="quotationTndrCommitteeAppointmentAddSearch"
						action="#{qTCommitteBackingBean.searchUserAction}"
						update="existingcommitteesearchid"
						process="@this, usersearchpnlid" />
					<p:commandButton value="#{lbl['lbl.btn.reset']}"
						action="#{qTCommitteBackingBean.reset}" update="usersearchpnlid"
						resetValues="true" partialSubmit="true" process="@this" />
				</div>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.search.result']}" toggleable="true">
				<p:dataTable id="existingcommitteesearchid"
					value="#{qTCommitteBackingBean.managedBean.userSearchCommitteeDataModel}"
					selection="#{qTCommitteBackingBean.managedBean.selectedPmUser}"
					rowKey="#{existcommitteeuser.userId}" var="existcommitteeuser"
					lazy="true" style="width : 100%;" rows="10"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					styleClass="existingCommitteeResults"
					rowIndexVar="index">

					<ac:paginator for="existingcommitteesearchid" />
                   <p:ajax event="page"
				listener="#{qTCommitteBackingBean.addNewCommiteteUsers(qTCommitteBackingBean.managedBean.userSearchCommitteeDataModel)}"
				update="@([id$=existingcommitteesearchid])" />
					
					<p:column style="width:3px;text-align:center;" >
				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{qTCommitteBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this" update="@([id$=committeeAppointmentAddSpecificationBtnId],[id$=existingcommitteesearchid])"
							listener="#{qTCommitteBackingBean.selectNewCommittee(qTCommitteBackingBean.managedBean.templateSpecBean.selectAll, qTCommitteBackingBean.managedBean.userSearchCommitteeDataModel)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{existcommitteeuser.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@([id$=committeeAppointmentAddSpecificationBtnId])" />
				</p:selectBooleanCheckbox>
			</p:column>

					<p:column headerText="#{lbl['lbl.sc.name']}">
						<h:outputText value="#{existcommitteeuser.userName}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.identification.no']}">
						<h:outputText value="#{existcommitteeuser.identificationNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.designation']}">
						<h:outputText value="#{existcommitteeuser.designation}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.email']}">
						<h:outputText value="#{existcommitteeuser.email}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.grade']}">
						<h:outputText value="#{existcommitteeuser.grade}" />
					</p:column>

					<p:column>
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.pnp']}" />
							<!-- Temporary fix for duplicate id using ac:iconTooltip -->
							&#160;
							<p:graphicImage id="pnpImg" value="/css/images/design/ico-tooltips.png" />
							<p:tooltip id="pnptt" for="pnpImg">
								<p:outputLabel escape="false" value="#{lbl['lbl.sc.pnp.tooltip']}"  />
							</p:tooltip>
						</f:facet>
						<h:outputText
							value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.role']}">
						<ui:param name="filteredRoles" value="#{qTCommitteBackingBean.managedBean.roleFilterList}"/>
						<p:selectOneMenu id="appaction"
							value="#{existcommitteeuser.memberRoleId}"
							style="width: 110px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="role" itemDisabled="#{!role.selectable}"
								value="#{qTCommitteBackingBean.getRoleTypeDropdownValuesBasedOnPTJ(existcommitteeuser.PMP,qTDetailBB.managedBean.qt,existcommitteeuser, filteredRoles)}"
								itemLabel="#{role.codeName}"
								itemValue="#{role.pmParameter.parameterId}" />
							<p:ajax event="change" partialSubmit="true"/>
						</p:selectOneMenu>
					</p:column>
				</p:dataTable>
			</p:panel>
		</c:if>
		<c:if
			test="#{qTCommitteBackingBean.managedBean.committeMember.userSelection eq 'N'}">
			<p:panel header="#{lbl['lbl.sc.new.user']}" toggleable="true">
				<table>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:inputText id="name1" required="true"
								label="#{lbl['lbl.sc.name']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.memberName}"
								size="30" maxlength="50" /> <p:message id="name1Msg"
								for="name1" display="icon" /></td>
					</tr>
					<tr>
						<td style="width: 155px;"><p:outputLabel
								value="#{lbl['lbl.sc.id.type']}" /> <p:outputLabel value="*"
								styleClass="mandatory" /></td>
						<td colspan="3"><p:selectOneMenu id="idtype1" required="true"
								label="#{lbl['lbl.sc.id.type']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.idType}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItems
									value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
							</p:selectOneMenu> <p:message id="idtype1Msg" for="idtype1" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:inputText id="idNos1" required="true"
								label="#{lbl['lbl.sc.identification.no']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.icPassport}"
								size="30" maxlength="15" /> <p:message id="idNos1Msg"
								for="idNos1" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.grade']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:inputText id="grade1" required="true"
								label="#{lbl['lbl.sc.grade']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.grade}"
								size="30" maxlength="10" /> <p:message id="grade1Msg"
								for="grade1" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.pnp']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:selectOneRadio id="pnp1" required="true"
								label="#{lbl['lbl.sc.pnp']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.PNP}">
								<f:selectItem itemLabel="Yes" itemValue="true" />
								<f:selectItem itemLabel="No" itemValue="false" />
							</p:selectOneRadio> <p:message id="pnp1Msg" for="pnp1" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.designation']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:inputText id="designation1"
								required="true" label="#{lbl['lbl.sc.designation']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.designation}"
								size="30" maxlength="50" /> <p:message id="designation1Msg"
								for="designation1" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:inputText id="email1" required="true"
								label="#{lbl['lbl.sc.email']}"
								validatorMessage="#{qTCommitteBackingBean.managedBean.committeMember.email} is not valid"
								value="#{qTCommitteBackingBean.managedBean.committeMember.email}"
								size="30" maxlength="80">
								<f:validateRegex
									pattern="[\w\.-]*[a-zA-Z0-9_]@[\w\.-]*[a-zA-Z0-9]\.[a-zA-Z][a-zA-Z\.]*[a-zA-Z]" />
							</p:inputText> <p:message id="email1Msg" for="email1" display="icon" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.role']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td colspan="3"><p:selectOneMenu id="role" required="true"
								label="#{lbl['lbl.sc.role']}"
								value="#{qTCommitteBackingBean.managedBean.committeMember.memberRole.parameterId}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItems
									value="#{qTCommitteBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
							</p:selectOneMenu> <p:message id="roleMsg" for="role" display="icon" /></td>
					</tr>
				</table>
			</p:panel>
		</c:if>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing" id="committeeAppointmentAddSpecificationBtnId"
			disabled="#{qTCommitteBackingBean.enableSelectedNewCommitteeList(qTCommitteBackingBean.managedBean.userSearchCommitteeDataModel)}"
			actionListener="#{qTCommitteBackingBean.addNewCommiteteUsers(qTCommitteBackingBean.managedBean.userSearchCommitteeDataModel)}"
				action="#{qTCommitteBackingBean.okCommitteeAction}"
				update="@(.scMemberDtl,.amendButton)" />

			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				styleClass="BtnSpacing" process="@this" partialSubmit="true"
				oncomplete="newspecificationcommittee.hide();"
				update="@(.scMemberDtl,name2Class)">
				<f:setPropertyActionListener value="false"
					target="#{qTCommitteBackingBean.managedBean.nameRequired}" />
			</p:commandButton>
		</div>
		<p:ajax event="close" update="@([id$=name2])" listener="#{qTCommitteBackingBean.nameRequired}">
		</p:ajax>
	</p:dialog>
</ui:composition>
