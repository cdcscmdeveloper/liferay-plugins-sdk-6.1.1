<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="cloneid" header="" widgetVar="screen2" modal="true">
		<p:panel header="Search Committe">
			<table>
				<tr>
					<td><p:outputLabel value="Title" /></td>
					<td colspan="3"><p:inputText
							value="#{committeBackingBean.managedBean.title}" size="92" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.qtntender']}" /></td>
					<td><p:inputText
							value="#{committeBackingBean.managedBean.qtNo}" size="28" /></td>
					<td><p:outputLabel value="Procurement Mode" /></td>
					<td><p:selectOneMenu
							value="#{committeBackingBean.managedBean.procurementMode}"
							style="width: 192px;margin-bottom: 5px;">
							<f:selectItems
								value="#{committeBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu></td>

				</tr>
				<tr>
					<td><p:outputLabel value="Created Date (From)" /></td>
					<td><p:calendar
							value="#{committeBackingBean.managedBean.createdDtFrom}"
							size="28" showOn="button" /></td>
					<td><p:outputLabel value="Created Date (To)" /></td>
					<td><p:calendar
							value="#{committeBackingBean.managedBean.createdDtTo}" size="28"
							showOn="button" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.comstatus']}" /></td>
					<td><p:selectOneMenu style="width:192px"
							value="#{committeBackingBean.managedBean.status}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Non-Active" itemValue="2" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="Search" style="float:right;"
					icon="ui-icon-search"
					action="#{committeBackingBean.cloneSearchCommitteAction}"
					update="@(.cloneResults)" partialSubmit="true" process="@parent" />
			</div>
			<br />
			<br />
		</p:panel>
		<p:panel header="Quotation/Tender List" toggleable="true">
			<p:dataTable id="clonesearchCommitteid"
				value="#{committeBackingBean.managedBean.cloneSearchCommittes}"
				selection="#{committeBackingBean.managedBean.selectedCloneCommittee}"
				rowKey="#{committe}" selectionMode="single" var="committe"
				styleClass="cloneResults">

				<p:ajax event="rowSelect" update=":form:qtsubId:committeeTbl"
					listener="#{committeBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">
					<h:outputText value="#{committe.scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.title']}">
					<h:outputText value="#{committe.scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.procmode']}">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, committe.scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.crtdt']}">
					<h:outputText value="#{committe.scCommittee.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.status']}">
					<h:outputText
						value="#{committe.scQt.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel id="cloneCommitteMembersid" header="Committee List"
			toggleable="true">
			<p:treeTable id="committeeTbl" var="committeeNode"
				value="#{committeBackingBean.managedBean.searchcommitteeNode}">

				<p:column headerText="#{lbl['lbl.so.bo.name']}">
					<p:selectBooleanCheckbox value="#{committeeNode.selected}"
						rendered="#{committeeNode.type == 'committee'}" />
					<h:outputText value="#{committeeNode.object.committeeType}"
						rendered="#{committeeNode.type == 'committee'}" />
					<p:selectBooleanCheckbox value="#{committeeNode.selected}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
					<h:outputText value="#{committeeNode.object.memberName}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
					<h:outputText value="#{committeeNode.object.icPassport}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.designation']}">
					<h:outputText value="#{committeeNode.object.designation}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.grade']}">
					<h:outputText value="#{committeeNode.object.grade}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.pp']}">
					<h:outputText value="#{committeeNode.object.pnp}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="Email">
					<h:outputText value="#{committeeNode.object.memberName}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
					<h:outputText
						value="#{committeBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, committeeNode.object.memberRole)}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

			</p:treeTable>
			<p:commandButton value="Cancel" style="float:right;"
				icon="ui-icon-cancel" onclick="screen2.hide();" />
			<p:commandButton value="Clone" style="float:right;"
				action="#{committeBackingBean.addCloneCommitteeMembersAction}"
				oncomplete="screen2.hide();" update="businessownerId"
				icon="ui-icon-check" />
		</p:panel>
	</p:dialog>
</ui:composition>
