<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneid" header="Clone Committee" widgetVar="screen2"
		modal="true">
		<p:panel header="Search">
			<table>
				<tr>
					<td><p:outputLabel value="Title" /></td>
					<td colspan="3"><p:inputText
							value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}" size="92" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.qtntender']}" /></td>
					<td><p:inputText
							value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}" size="30" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="Procurement Mode" /></td>
					<td><p:selectOneMenu
							value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="Created Date (From)" /></td>
					<td><p:calendar
							value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="30" showOn="button" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="Created Date (To)" /></td>
					<td><p:calendar
							value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
							size="30" showOn="button" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.comstatus']}" /></td>
					<td><p:selectOneMenu style="width: 178px;margin-bottom: 5px;"
							value="#{qTCommitteBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Non-Active" itemValue="2" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.reset']}" style="float:right;"
					action="#{qTCommitteBackingBean.resetClone}" update="searchpnlid"
					icon="ui-icon-reset" resetValues="true" partialSubmit="true"
					process="@this" />
				<p:commandButton value="Search" style="float:right;"
					icon="ui-icon-search"
					action="#{qTCommitteBackingBean.cloneSearchCommitteAction}"
					update="@(.cloneResults)" partialSubmit="true" process="@parent" />
			</div>
			<br />
			<br />
		</p:panel>
		<p:spacer height="3" />
		<p:panel header="Quotation/Tender List" toggleable="true">
			<p:dataTable id="clonesearchCommitteid"
				value="#{qTCommitteBackingBean.managedBean.cloneTenderList}"
				selection="#{qTCommitteBackingBean.managedBean.selectedCloneTender}"
				rowKey="#{scQt}" selectionMode="single" var="scQt"
				styleClass="cloneResults">
				
				<ac:paginator for="clonesearchCommitteid" />

				<p:ajax event="rowSelect" update=":form:qtsubId:committeeTbl"
					listener="#{qTCommitteBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">
					<h:outputText value="#{scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.procmode']}">
					<h:outputText
						value="#{qTCommitteBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.crtdt']}">
					<h:outputText value="#{scQt.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.status']}">
					<h:outputText
						value="#{scQt.qtStatus.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:spacer height="3" />
		<p:panel id="cloneCommitteMembersid" header="Committee List"
			toggleable="true">
			<p:treeTable id="committeeTbl" var="committeeNode"
				value="#{qTCommitteBackingBean.managedBean.searchcommitteeNode}">

				<p:column headerText="#{lbl['lbl.so.bo.name']}">
					<p:selectBooleanCheckbox value="#{committeeNode.selected}"
						rendered="#{committeeNode.type == 'committee'}" />
					<h:outputText value="#{committeeNode.object.committeeType}"
						rendered="#{committeeNode.type == 'committee'}" />
					<p:selectBooleanCheckbox value="#{committeeNode.selected}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
					<h:outputText value="#{committeeNode.object.memberName}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
					<h:outputText value="#{committeeNode.object.icPassport}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.designation']}">
					<h:outputText value="#{committeeNode.object.designation}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.grade']}">
					<h:outputText value="#{committeeNode.object.grade}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.pp']}">
					<h:outputText value="#{committeeNode.object.PNP}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="Email">
					<h:outputText value="#{committeeNode.object.memberName}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
					<h:outputText
						value="#{qTCommitteBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, committeeNode.object.memberRole)}"
						rendered="#{committeeNode.type == 'scCommitteeMember'}" />
				</p:column>

			</p:treeTable>
			<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
				style="float:right;" icon="ui-icon-cancel" onclick="screen2.hide();" />
			<p:commandButton value="#{lbl['lbl.so.okbtn']}" style="float:right;"
				actionListener="#{qTCommitteBackingBean.addCloneDtlToTabs}"
				oncomplete="screen2.hide();" icon="ui-icon-check"
				update="@(.scClone), @(.tecClone)" />
		</p:panel>
	</p:dialog>
</ui:composition>
