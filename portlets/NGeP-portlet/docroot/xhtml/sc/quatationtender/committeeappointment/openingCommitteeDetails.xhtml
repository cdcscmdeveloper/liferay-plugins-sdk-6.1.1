<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Opening Committee" toggleable="true">
		<table style="width: 50%">
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td><p:inputText
						value="#{committeBackingBean.managedBean.title}"
						style="margin-right:5px;" disabled="true" readonly="true" /></td>
				<td><p:selectBooleanCheckbox
						value="#{committeBackingBean.managedBean.ecType}" /></td>
				<td style="width: 100px"><p:outputLabel
						value=" Send For Approval" /></td>
			</tr>
		</table>
		<p:dataTable id="openingcommitteeid"
			value="#{committeBackingBean.managedBean.openingCommitteList}"
			var="openingcommittee" rowIndexVar="index" editable="true"
			rowKey="#{openingcommittee}"
			selection="#{committeBackingBean.managedBean.selectOpeningCommitteeList}">

			<p:column selectionMode="multiple" style="width:5%" />

			<ac:paginator for="openingcommitteeid" />

			<p:column headerText="Name">
				<h:outputText value="#{openingcommittee.memberName}" />
			</p:column>

			<p:column headerText="Identification No">
				<h:outputText value="#{openingcommittee.icPassport}" />
			</p:column>

			<p:column headerText="Designation">
				<h:outputText value="#{openingcommittee.designation}" />
			</p:column>

			<p:column headerText="Grade">
				<h:outputText value="#{openingcommittee.grade}" />
			</p:column>

			<p:column headerText="P&amp;P">
				<h:outputText value="#{openingcommittee.pnp}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.committe.clonetable.role']}">
				<ui:fragment rendered="#{openingcommittee.memberRole eq 'C'}">
					<h:outputText value="Chair Person" />
				</ui:fragment>
				<ui:fragment rendered="#{openingcommittee.memberRole eq 'S'}">
					<h:outputText value="Secretary" />
				</ui:fragment>
				<ui:fragment rendered="#{openingcommittee.memberRole eq 'M'}">
					<h:outputText value="Member" />
				</ui:fragment>
			</p:column>

			<p:column headerText="Action">
				<h:outputLabel value="" />
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton id="ocaddid" value="#{lbl['lbl.so.addbtn']}"
				process="@this" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{committeBackingBean.deleteOpeningCommittee}"
				update="openingcommitteeid" />
		</div>
	</p:panel>
</ui:composition>
