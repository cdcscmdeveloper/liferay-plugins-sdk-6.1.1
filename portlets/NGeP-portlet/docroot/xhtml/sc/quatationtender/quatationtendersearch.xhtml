<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:define name="contentSection">
		<p:messages id="qtSearchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />
		
		<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true"
			id="qtsearchid">
			<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.search.instruction']}" escape="false" />
			<table width="1100px">
				<tr>
					<td>
						<p:outputLabel id="searchMinistryLbL" value="#{lbl['lbl.sc.ministry']}" />
					</td>
					<td colspan="3">
						<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ministry']}" 
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.ministryProfile.orgName}"
							postUpdateListener="qTDetailBB.postUpdateOrgProfileListener"
							update="@form"
							saveObject="qTDetailBB.managedBean.qtnTenderSearchBean.ministryProfile">
						</ac:lov>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel id="searchPtjGroupLbL" value="#{lbl['lbl.sc.ptj.group']}" />
					</td>
					<td colspan="3">
						<ac:lov id="searchPtjGroup" lovId="PM_ORG_PROFILE_PTJ_GROUP" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj.group']}" 
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.ptjGroupProfile.orgName}"
							postUpdateListener="qTDetailBB.postUpdateOrgProfileListener"
							update="@form"
							saveObject="qTDetailBB.managedBean.qtnTenderSearchBean.ptjGroupProfile"
							conditionField="#{qTDetailBB.getPTJGroupCondition()}"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel id="searchPtjLbL" value="#{lbl['lbl.sc.ptj']}" />
					</td>
					<td colspan="3">
						<ac:lov id="searchPtjAuth" lovId="PM_ORG_PROFILE_AUTH_TYPE"
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj']}" 
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.ptjProfile.orgName}"
							postUpdateListener="qTDetailBB.postUpdateOrgProfileListener"
							update="@form"
							saveObject="qTDetailBB.managedBean.qtnTenderSearchBean.ptjProfile"
							conditionField="#{qTDetailBB.getPTJCondition()}" />
						<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj']}"
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.ptjProfile.orgName}"
							postUpdateListener="qTDetailBB.postUpdateOrgProfileListener"
							update="@form"
							saveObject="qTDetailBB.managedBean.qtnTenderSearchBean.ptjProfile"
							conditionField="#{qTDetailBB.getPTJCondition()}" >
						</ac:lov>
					</td>
				</tr>
				<tr>
					<td style="width:165px"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.qtTitle}"
							 maxlength="100" style="width:840px"/></td>
				</tr>
				<tr>
				<td>
					<h:outputLabel value="#{lbl['lbl.sc.document.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
					<td><p:selectOneMenu
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.docType}"
							style="width: 297px;margin-bottom: 5px;"
							label="#{lbl['lbl.sc.document.type']}" required="true">
							<f:selectItems
								value="#{qTDetailBB.getDocTypeQtLOADropdownValues()}" />
								<p:ajax update="qtsearchid" process="@this"/>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="width: 165px;">
						  <h:outputLabel for="docNo" value="#{lbl['lbl.sc.document.no']}" />
					</td>
					<td style="width:385px">
						<p:inputText id="docNo"
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.docNo}"
							maxlength="21" style="width:288px;" />
					</td>
							
					<td style="width:165px"><h:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
					<td style="width:385px"><p:selectOneMenu id="procurementid"
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.procurementMode}"
							style="width:297px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTDetailBB.getProcurementModeDropdownValues()}" />
						</p:selectOneMenu></td>
				</tr>				
				<tr>
					<td><h:outputLabel id="crdateFromLbL" value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}"
							id="crdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="crdateTo" />
						</p:calendar></td>
					<td><h:outputLabel id="crdateToLbL" value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar id="crdateTo" showOn="button"
							label="#{lbl['lbl.sc.created.date.to']}"
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toCreatedDate}"
							mindate="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}"
							readonlyInput="true" required="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate ne null or !qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate eq ''}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
					<td><p:calendar
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}"
							id="pbdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="pbdateTo"/>
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
					<td><p:calendar id="pbdateTo" showOn="button"
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toPublishDate}"
							mindate="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}"
							readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
					<td><p:calendar
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}"
							id="cldateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="cldateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
					<td><p:calendar id="cldateTo" showOn="button"
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toClosingDate}"
							mindate="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}"
							readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:selectOneMenu
							value="#{qTDetailBB.managedBean.qtnTenderSearchBean.qtStatus}"
							style="width: 297px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTDetailBB.getStatusDropdownValues(ParameterConst.reqNoteMethodCode, ParameterConst.doctypeQuotation)}" />
						</p:selectOneMenu></td>
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					action="#{qTDetailBB.searchQTAction}" update="searchQTs"
					process="@this, qtsearchid" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{qTDetailBB.reset}" update="qtsearchid"
					resetValues="true" partialSubmit="true"
					process="@this" />
			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
			<h:panelGroup id="table-wrapper" style="width:100%;">
				<p:dataTable id="searchQTs"
					value="#{qTDetailBB.searchQTDataModel}" var="scQt"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowIndexVar="index" lazy="true" rows="10">

					<ac:paginator for="searchQTs" />

					<p:column headerText="#{lbl['lbl.sc.qtn.no']}" style="width:100px;">
						<h:outputText value="#{scQt.qtNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.title']}">
						<h:outputText value="#{scQt.qtTitle}" 
							style="white-space: normal;word-wrap: break-word;"/>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.procurement.mode']}"
						style="width:100px;">
						<h:outputText
							value="#{qTDetailBB.getParameterDesc(scQt.procurementMode)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.created.date']}" style="width:80px;">
						<h:outputText value="#{scQt.createdDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.published.date']}" style="width:80px;">
						<h:outputText value="#{scQt.publishDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.closing.date']}" style="width:80px;">
						<h:outputText value="#{scQt.closingDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.status']}" style="width:200px;">
						<h:outputText value="#{qTDetailBB.getStatusDescById(scQt.qtStatus.statusId)}"/>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}" style="width:6%;text-align: center;">
						<p:commandLink id="editQTIcon" action="#{qTDetailBB.editQuationTenderDetails(scQt, true)}"
							style="margin-right:20px;" partialSubmit="true" process="@this">
							<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/edit.png" styleClass="tasklist_title1"
								title="#{lbl['lbl.sc.qt.search.edit.tooltip']}" />
						</p:commandLink>
						<p:commandLink id="viewQTIcon" action="#{qTDetailBB.editQuationTenderDetails(scQt, false)}"
							style="margin-right:20px;" partialSubmit="true" process="@this">
							<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" styleClass="tasklist_title1"
								title="#{lbl['lbl.sc.qt.search.view.tooltip']}" />
						</p:commandLink>
						<p:commandLink id="viewSupplierQTIcon" action="#{qTDetailBB.viewSupplierProposalDetails(scQt, view.viewId)}"
							style="margin-right:20px;" partialSubmit="true" process="@this"
							rendered="#{qTDetailBB.managedBean.qtnTenderSearchBean.resultDocType != ParameterConst.doctypeBidding}">
							<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" styleClass="tasklist_title1"
								title="#{lbl['lbl.sc.qt.search.view.tooltip']}" />
						</p:commandLink>
						<p:commandLink id="viewSupplierBidIcon" action="#{qTDetailBB.viewSupplierProposalDetails(scQt, view.viewId)}"
							style="margin-right:20px;" partialSubmit="true" process="@this"
							rendered="#{qTDetailBB.managedBean.qtnTenderSearchBean.resultDocType == ParameterConst.doctypeBidding}">
							<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-view.png" styleClass="tasklist_title1"
								title="#{lbl['lbl.sc.qt.search.view.tooltip']}" />
							<f:param name="bidScheduleId" value="#{qTDetailBB.findDocIdByDocType(scQt.qtId)}"  />
							<f:param name="previousPageUrl" value="#{view.viewId}" />
						</p:commandLink>
						<p:commandLink id="publishQTIcon" action="#{qTDetailBB.publishQT(scQt)}"
							style="margin-right:20px;" partialSubmit="true" process="@this"
							rendered="#{qTDetailBB.isAllowQTPublishBtn(scQt)}">
							<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-play.png" styleClass="tasklist_title1"
								title="Click here to Publish QT" />
						</p:commandLink>
						<p:commandLink id="closeQTIcon" action="#{qTDetailBB.closeProposal(scQt)}"
							style="margin-right:20px;" partialSubmit="true" process="@this"
							rendered="#{qTDetailBB.isAllowQTClosedBtn(scQt)}">
							<p:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/ico-termination.png" styleClass="tasklist_title1"
								title="Click here to Close QT" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:panel>
		<ac:lovPopup />
	</ui:define>
</ui:composition>
