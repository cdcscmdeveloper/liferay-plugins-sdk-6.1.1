<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<p:messages id="cancelMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />


		<div class="ppRightBtn">
			<h:panelGroup id="cancelBtns">

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{qTDetailBB.submitQtCancelDetails}" process="@form"
					update="@all" 
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />


			</h:panelGroup>
		</div>

		<c:choose>
			<c:when test="#{qTDetailBB.isQTStatusPublished(qTDetailBB.managedBean.currentStatusId)}">

				<p:panel id="cancelQt" header="#{qTDetailBB.getParameterDesc(ParameterTypeConst.approvalCategory, ParameterConst.approvalCategoryFinalizationCommittee)}"
					toggleable="true">
					<ui:param name="fcaApprovalTab"
						value="#{qTDetailBB.managedBean.selectedApprovalTabBean}" />
					<ui:param name="fcaApprovalRemarkList"
						value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
					<ui:include
						src="/xhtml/sc/quatationtender/approval/approvalDetailsFinalizationCommittee.xhtml" />
	
					<ui:include
						src="/xhtml/sc/quatationtender/approval/approvalhistory.xhtml" />
				</p:panel>
			</c:when>
	
			<c:otherwise>
				<ac:scRemarkAndAttachment
					remarkList="#{qTDetailBB.managedBean.qt.scQtRemarks}"
					showAttachment="false"
					header="#{lbl['lbl.sc.cancel.quatation.tender']}" />
			</c:otherwise>
		</c:choose>
	</ui:define>

</ui:composition>
