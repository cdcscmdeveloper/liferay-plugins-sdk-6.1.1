<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<p:messages id="cancelMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />


		<div class="ppRightBtn">
			<h:panelGroup id="cancelBtns">

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{qTDetailBB.submitQtCancelDetails}" process="@form"
					update="@all" 
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />


			</h:panelGroup>
		</div>

		<c:choose>
			<c:when test="#{qTDetailBB.isQTStatusPublished(qTDetailBB.managedBean.currentStatusId)}">

				<p:panel id="cancelQt" header="#{qTDetailBB.getParameterDesc(ParameterTypeConst.approvalCategory, ParameterConst.approvalCategoryFinalizationCommittee)}"
					toggleable="true">
					<ui:param name="fcaApprovalTab"
						value="#{qTDetailBB.managedBean.selectedApprovalTabBean}" />
					<ui:param name="fcaApprovalRemarkList"
						value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
					<ui:include
						src="/xhtml/sc/quatationtender/approval/approvalDetailsFinalizationCommittee.xhtml" />
	
					<ui:include
						src="/xhtml/sc/quatationtender/approval/approvalhistory.xhtml" />
				</p:panel>
			</c:when>
	
			<c:otherwise>
				<p:panel id="beforePublished" header="#{lbl['lbl.sc.cancel.quatation.tender']}"
					toggleable="true">
					
					<table style="width: 100%" id="remarkslist">
				<tr>
					<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
							value="#{lbl['lbl.sc.remark']}" /></td>
					<td class="TableFieldRight"><p:dataGrid id="cancelRemarks"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							value="#{qTDetailBB.managedBean.qt.scQtRemarks}" var="remarkVar"
							rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage
											value="#{qTDetailBB.userImagePath(remarkVar.createdUser.loginId)}"
											height="30" width="30" /></td>
									<td width="5"></td>
									<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
										<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
											<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId eq null}"
											/>
										<h:outputText value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;"
											/></td>
								</tr>
							</table>
						</p:dataGrid></td>
						</tr>
						</table>
				</p:panel>
			</c:otherwise>
		</c:choose>
	</ui:define>

</ui:composition>
