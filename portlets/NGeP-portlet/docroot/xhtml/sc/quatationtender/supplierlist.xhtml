<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="supplierlist" header="#{lbl['lbl.sc.supplier.list']}"
		toggleable="true">
		
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.restricted.tender.instruction']}" escape="false" rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeRestrictedTender and qTSupplierQulCriteriaBackingBean.managedBean.qt.panel == 'No'}" />
		
		<p:dataTable id="suppliersTbl" var="qtSupplier" rows="10"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtSupplierList}"
			rowIndexVar="index" editable="true" rowKey="#{qtSupplier}"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedQtSupplierList}">

			<ac:paginator for="suppliersTbl" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<p:commandLink update=":form:popupSuppDtl"
					action="#{qTSupplierQulCriteriaBackingBean.showSupplierDetails(qtSupplier)}"
					oncomplete="suppDetails.show();">
					<h:outputText value="#{qtSupplier.smSupplier.companyName}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofno']}" style="width : 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).mofNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}" style="width : 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width : 10%;">
				<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).recordStatusFlg)}" />
			</p:column>

		</p:dataTable>
		<br />
		<h:outputText value="#{lbl['lbl.sc.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSupplier}"
			disabled="true" />
	</p:panel>
</ui:composition>
