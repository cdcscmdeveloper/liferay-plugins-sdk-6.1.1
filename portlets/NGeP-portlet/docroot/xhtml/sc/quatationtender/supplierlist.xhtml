<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="supplierlist" header="#{lbl['lbl.sc.supplier.list']}"
		toggleable="true">
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal 
					or qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypePanel}">
			<p:treeTable id="suppliersTbl" var="supplierNode"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppliersNode}">

				<p:column headerText="#{lbl['lbl.so.suppliername']}">
					<h:outputText value="#{supplierNode.object}"
						rendered="#{supplierNode.type == 'zone'}" />
					<h:outputText value="#{supplierNode.object.supplierName}"
						rendered="#{supplierNode.type == 'supplier'}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mofno']}">
					<h:outputText value="#{supplierNode.object.smMofAccounts[0].mofNo}"
						rendered="#{supplierNode.type == 'supplier' and false}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mofexp']}">
					<h:outputText
						value="#{supplierNode.object.smMofAccounts[0].expDate}"
						rendered="#{supplierNode.type == 'supplier' and false}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.status']}">
					<h:outputText value="Active"
						rendered="#{supplierNode.type == 'supplier'}" />
				</p:column>
			</p:treeTable>
		</c:if>
		<c:if
			test="#{!qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal 
					and qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType != PmCodeConst.quotationTenderTypePanel}">
			<p:dataTable id="suppliersTbl" var="qtSupplier"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtSupplierList}"
				rowIndexVar="index" editable="true" rowKey="#{qtSupplier}"
				selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedQtSupplierList}">

				<ac:paginator for="suppliersTbl" />

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.so.suppliername']}">
					<p:commandLink update=":form:popupSuppDtl"
						action="#{qTSupplierQulCriteriaBackingBean.showSupplierDetails}"
						oncomplete="suppDetails.show();">
						<f:setPropertyActionListener value="#{qtSupplier}"
							target="#{qTSupplierQulCriteriaBackingBean.managedBean.scQtSupplier}" />
						<h:outputText value="#{qtSupplier.smSupplier.companyName}" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mofno']}">
					<h:outputText
						value="#{qtSupplier.smSupplier.smMofAccounts[0].mofNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mofexp']}">
					<h:outputText
						value="#{qtSupplier.smSupplier.smMofAccounts[0].expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.so.status']}">
					<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getStatusDescById(smSupplier.pmStatus.statusId)}" />
				</p:column>
			</p:dataTable>
		</c:if>
		<br />
		<h:outputText value="#{lbl['lbl.so.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSupplier}"
			disabled="true" />
	</p:panel>
</ui:composition>
