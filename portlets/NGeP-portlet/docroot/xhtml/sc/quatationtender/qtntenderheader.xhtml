<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 275px"><h:outputLabel
							value="#{lbl['lbl.so.qtnno']}" /></td>
					<td><p:inputText value="#{qTDetailBB.managedBean.qt.qtNo}"
							disabled="true" size="21" /></td>
					<td style="width: 350px"><h:outputLabel
							value="#{lbl['lbl.so.planno']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.qt.ppPlan.planNo}"
							disabled="true" size="21" /></td>
					<td style="width: 400px"><h:outputLabel
							value="#{lbl['lbl.so.ptj.name']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.qt.pmOrgProfile.orgName}"
							disabled="true" size="60" /></td>
					<td style="width: 200px"><h:outputLabel
							value="#{lbl['lbl.so.status']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.getStatusDescById(qTDetailBB.managedBean.qt.qtStatus.statusId)}"
							disabled="true" size="40" /></td>
				</tr>
			</table>
		</div>
	</p:panel>
</ui:composition>
