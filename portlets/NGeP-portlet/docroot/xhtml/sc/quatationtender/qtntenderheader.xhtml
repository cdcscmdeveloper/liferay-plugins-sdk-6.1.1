<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 275px">
						<h:outputLabel value="#{lbl['lbl.so.qtnno']}" />
					</td>
					<td style="width: 15%" class="header-info-text">
						#{qTDetailBB.managedBean.qt.qtNo}
					</td>
					<ui:fragment rendered="#{qTDetailBB.managedBean.qt.ppPlan.planNo ne null}">
						<td style="width: 350px">
							<h:outputLabel value="#{lbl['lbl.so.planno']}" />
						</td>
						<td style="width: 10%" class="header-info-text">
							#{qTDetailBB.managedBean.qt.ppPlan.planNo}</td>
					</ui:fragment>
					<td style="width: 400px">
						<h:outputLabel value="#{lbl['lbl.so.ptj.name']}" />
					</td>
					<td style="width: 30%" class="header-info-text">
						#{qTDetailBB.managedBean.qt.pmOrgProfile.orgName}</td>
					<td style="width: 200px">
						<h:outputLabel value="#{lbl['lbl.so.status']}" />
					</td>
					<td style="width: 15%" class="header-info-text">
						#{qTDetailBB.getStatusDescById(qTDetailBB.managedBean.qt.qtStatus.statusId)}
					</td>
				</tr>
			</table>
		</div>
	</p:panel>
</ui:composition>
