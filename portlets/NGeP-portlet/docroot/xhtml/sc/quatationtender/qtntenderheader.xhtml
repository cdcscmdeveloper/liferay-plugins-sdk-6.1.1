<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table>
				<tr>
					<td style="width: 245px"><h:outputLabel
							value="Quotation/Tender No" /></td>
					<td><p:inputText value="#{qTDetailBB.managedBean.qt.qtNo}"
							disabled="true" size="30" /></td>
					<td style="width: 210px"><h:outputLabel value="Plan No" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.qt.ppPlan.planNo}"
							disabled="true" size="30" /></td>
					<td style="width: 210px"><h:outputLabel value="PTJ Name" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.qt.pmOrgProfile.orgCode} - #{qTDetailBB.managedBean.qt.pmOrgProfile.orgName}"
							disabled="true" size="30" /></td>
					<td style="width: 198px"><h:outputLabel value="Status" /></td>
					<td><p:inputText
							value="#{qTDetailBB.getStatusDescById(qTDetailBB.managedBean.qt.qtStatus.pmStatus.statusId)}"
							disabled="true" size="30" /></td>
				</tr>
			</table>
		</div>
	</p:panel>
</ui:composition>
