<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel styleClass="scmemberdtls">
		<p:spacer height="2" />

		<p:dataTable id="committeeapprovalId"
			value="#{membersList.scCommitteeMembers}" var="committeeapprover"
			rowIndexVar="index" editable="true" rowKey="#{committeeapprover}"
			selection="#{selectedMembersList}">

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.so.bo.name']}">
				<h:outputText value="#{committeeapprover.memberName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.identification.no']}"
				style="width: 10%">
				<h:outputText value="#{committeeapprover.icPassport}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.designation']}">
				<h:outputText value="#{committeeapprover.designation}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.email']}">
				<h:outputText value="#{committeeapprover.email}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.grade']}" style="width: 10%">
				<h:outputText value="#{committeeapprover.grade}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="width: 5%">
				<h:outputText
					value="#{lbl[committeeapprover.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>

			<p:column style="width: 15%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.so.role']}" />
				</f:facet>

				<ui:fragment rendered="#{committeeapprover.PNP}">
					<h:outputText value="Chairperson"
						rendered="#{committeeapprover.memberRole.parameterCode eq 'C'}"
						disabled="#{committe.committeStatus.statusId eq 60202}" />
				</ui:fragment>
				<ui:fragment rendered="#{!committeeapprover.PNP}">
					<p:selectOneMenu id="roleid" label="#{lbl['lbl.so.role']}"
						value="#{committeeapprover.memberRole.parameterId}"
						style="width: 110px;margin-bottom: 5px;"
						disabled="#{committe.committeStatus.statusId eq 60202}">
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{approvalBackingBean.roleChangeListner(committeeapprover)}" />
						<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItems var="role"
							value="#{approvalBackingBean.managedBean.roleTypes}"
							itemLabel="#{role.codeName}"
							itemValue="#{role.pmParameter.parameterId}" />
					</p:selectOneMenu>
					<p:message id="roleidMsg" for="roleid" display="icon" />
				</ui:fragment>
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
