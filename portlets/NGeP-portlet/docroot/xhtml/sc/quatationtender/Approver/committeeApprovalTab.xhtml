<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel >

		

		<p:tabView id="committeeTabView" orientation="top"
			var="committeeApproval"
			activeIndex="#{approvalBackingBean.managedBean.subTabIndex}"
			value="#{approvalBackingBean.managedBean.scCommitteeMemberTabList}">

			<p:tab title="#{committeeApproval.titleName}">

				<ui:param name="membersList"
					value="#{committeeApproval.scCommittee.scCommitteeMembers}" />

				<ui:param name="selectedMembersList"
					value="#{qTCommitteBackingBean.managedBean.selectedCommitteMemebers}" />

				<ui:include src="committeeApproval.xhtml" />

				<div class="ppRightBtn">
					<p:commandButton id="committeeapproveradd"
						value="#{lbl['lbl.so.addbtn']}" process="@this"
						action="#{qTCommitteBackingBean.addCommitteMember(committeeApproval.scCommittee, committeeApproval.titleName)}"
						oncomplete="newcommitteeapprover.show();"
						update="@(.commiteeapprovermember)" icon="ui-icon-add" />

					<p:commandButton value="#{lbl['lbl.so.delete']}"
						icon="ui-icon-delete"
						action="#{qTCommitteBackingBean.deleteSpecificationCommittee}"
						update="committeeapprovalId" />

				</div>
			</p:tab>

		</p:tabView>
	</p:panel>
</ui:composition>
