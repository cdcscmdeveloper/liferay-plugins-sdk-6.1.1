<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<ui:param name="membersList"
			value="#{qTDetailBB.managedBean.selectedTabBean.scQtCommittee.scCommittee}" />
		<ui:param name="selectedMembersList"
			value="#{qTDetailBB.managedBean.toBeDelCommitteMemebers}" />

		<ui:include src="committeeApproval.xhtml" />

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.clone']}"
				actionListener="#{qTCommitteBackingBean.committeeclonePopupAction(qTDetailBB.managedBean.selectedTabBean.scQtCommittee)}"
				oncomplete="screen2.show();" process="@this"
				update="@([id$=cloneid])" />
			<p:commandButton id="committeeapproveradd"
				value="#{lbl['lbl.btn.add']}" process="@this"
				actionListener="#{qTCommitteBackingBean.addCommitteMember(qTDetailBB.managedBean.selectedTabBean.scQtCommittee, qTDetailBB.managedBean.selectedTabBean.titleName)}"
				oncomplete="newspecificationcommittee.show();"
				update="@([id$=cloneid])" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, committeeapprovalId"
				actionListener="#{qTCommitteBackingBean.deleteSpecificationCommittee}"
				update="committeeapprovalId" />
		</div>
		<ui:include src="addCommitteeApproval.xhtml" />
		<ui:include src="cloneDetails.xhtml" />
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.remark']}"
		toggleable="true" id="committeeremarksupDtls">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										maxlength="1000" rendered="#{remarkVar.remarkId eq null}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 200px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="committeeApproverAttachDlg.show();return false;"
									icon="iconAttachment" update="committeeremarksupDtls"
									value="#{lbl['lbl.btn.attach.files']}">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attaIds"
									value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalAttachments}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage value="/css/images/design/#{approvalBackingBean.determineIcon(attachFile)}" height="30" width="30"/>
											</td>
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{approvalBackingBean.downloadFile(attachFile)}" />
											</td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>
	<p:dialog id="committeeApproverAttachDlgids" widgetVar="committeeApproverAttachDlg"
		modal="true" dynamic="true" hideEffect="explode" resizable="false"
		width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleFileUpload}"
			mode="advanced" id="dlgsuploadsids"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			update="committeeremarksupDtls" oncomplete="committeeApproverAttachDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
