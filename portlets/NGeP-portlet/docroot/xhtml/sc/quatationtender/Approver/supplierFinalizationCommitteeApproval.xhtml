<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true"
		id="requestDetailsId">
		<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse;">
			
		</table>
		<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse;">
			<c:if test="#{approvalBackingBean.managedBean.taskName eq ParameterConst.supplierAcceptQtChange || approvalBackingBean.managedBean.taskName eq ParameterConst.fcApproveQTChange}" >
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.new.validity.days']}" />
					</td>
					<td>
						<p:inputText value="#{approvalBackingBean.getNewValidityPeriod()}" style="width:200px;" disabled="true" />
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.new.validity.date']}" />
					</td>
					<td>
						<p:inputText value="#{qTDetailBB.getNewValidityDueDate(scQt, approvalBackingBean.getNewValidityPeriod())}" style="width:200px;" disabled="true" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText>
					</td>
				</tr>
			</c:if>
			<c:if test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryFinalizationCommittee}">
				<c:if test="#{approvalBackingBean.managedBean.taskName eq ParameterConst.fcApproveQTChange}" >
					<tr>
						<td style="width: 235px;">
							<span class="noWrap">
							<p:outputLabel> 
							<b style='color:red'>* </b>#{lbl['lbl.sc.qt.proposal.approval.date.chairperson.finalization']} </p:outputLabel>
							</span>
						</td>
						<td>
							<p:calendar label="#{lbl['lbl.sc.qt.proposal.approval.date.chairperson.finalization']}"
								disabled="#{approvalBackingBean.managedBean.readOnly}"
								value="#{approvalBackingBean.managedBean.qt.chmnFinalizationDate}"
								id="approvalDateChairperson"
								maxdate="#{qTScheduleDetailBackingBean.handleMaximumDate()}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
								readonlyInput="true"
								size="15">
								<p:ajax event="dateSelect" process="@this"
									listener="#{qTScheduleDetailBackingBean.handleChmnFinalizationDate(validityDaysExpiredQt)}"
									update="qtScQtReqPtjId,requestDetailsId" />
							</p:calendar>
							<p:inputText id="approvalDateChairpersonTime" value="#{approvalBackingBean.managedBean.qt.chmnFinalizationDate}" disabled="true" size="4"
								style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
								<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
							</p:inputText>
						</td>
						<c:if test="#{approvalBackingBean.managedBean.qt.approvalPBM eq true
										and approvalBackingBean.managedBean.chmnFinalizationRejectEPV eq false}"> 
							<td style="width: 235px;">
								<span class="noWrap">
								<p:outputLabel> 
								<b style='color:red'>* </b>#{lbl['lbl.sc.qt.proposal.approval.date.mof']} </p:outputLabel>
								</span>
							</td>
							<td>
								<p:calendar label="#{lbl['lbl.sc.qt.proposal.approval.date.mof']}"
									disabled="#{approvalBackingBean.managedBean.readOnly}"
									value="#{approvalBackingBean.managedBean.qt.mofDate}"
									id="approvalDateMof"
									maxdate="#{qTScheduleDetailBackingBean.handleMaximumDate()}"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
									readonlyInput="true"
									size="15">
									<p:ajax event="dateSelect" process="@this"
										listener="#{qTScheduleDetailBackingBean.handleMofDate}"
										update="qtScQtReqPtjId,requestDetailsId" />
								</p:calendar>
								<p:inputText id="approvalDateMofTime" value="#{approvalBackingBean.managedBean.qt.mofDate}" disabled="true" size="4"
									style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
								</p:inputText>
							</td>
						</c:if>
					</tr>
				</c:if>
			</c:if>
			</table>
			<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse; margin-top: 1em;">
			<tr
				style="background-color: #F0EFEF; text-align: left; font-size: 12px; text-indent: 0.5em;">
				<th
					style="width: 28%; padding: 8px; font-weight: bold; border: 1px solid #dddddd;">
					<h:outputText value="#{lbl['lbl.sc.qt.type.reqdtls']}" />
				</th>
				<th
					style="width: 11%; padding: 8px; font-weight: bold; border: 1px solid #dddddd;">
					<h:outputText value="#{lbl['lbl.sc.from.value']}" />
				</th>
				<th
					style="width: 11%; padding: 8px; font-weight: bold; border: 1px solid #dddddd;">
					<h:outputText value="#{lbl['lbl.sc.to.value']}" />
				</th>
				<th
					style="width: 20%; padding: 8px; font-weight: bold; border: 1px solid #dddddd;">
					<h:outputText value="* " styleClass="mandatory" /> <h:outputText
						value="#{lbl['lbl.sc.decision']}" />
				</th>
				<th
					style="width: 30%; padding: 8px; font-weight: bold; border: 1px solid #dddddd;">
					<h:outputText value="* " styleClass="mandatory" /> <h:outputText
						value="#{lbl['lbl.fl.attach.files']}" />
				</th>
			</tr>
			<c:if
				test="#{approvalBackingBean.managedBean.scQtApprovalRequestList.size() == 0}">
				<tr style="text-align: left; font-size: 12px; text-indent: 0.5em; border: 1px solid #dddddd;">
					<td style="padding: 5px;"><h:outputText
							value="#{lbl['lbl.datatable.msg.no.records.found']}" /></td>
				</tr>
			</c:if>
			<c:if
				test="#{approvalBackingBean.managedBean.scQtApprovalRequestList.size() > 0 }">
				<c:if test="#{approvalBackingBean.managedBean.qt.chmnFinalizationDate eq null}">
				<tr style="text-align: left; font-size: 12px; text-indent: 0.5em; border: 1px solid #dddddd;">
					<td style="padding: 5px;"><h:outputText
							value="#{lbl['lbl.datatable.msg.no.records.found']}" /></td>
				</tr>
				</c:if>
				<c:if test="#{approvalBackingBean.managedBean.qt.chmnFinalizationDate ne null}">
					<c:forEach
					items="#{approvalBackingBean.managedBean.scQtApprovalRequestList}"
					var="requestdetails">
					<c:if
						test="#{approvalBackingBean.managedBean.qt.approvalPBM ne true}">
						<tr style="text-align: left; font-size: 12px; text-indent: 0.1em;">
							<td style="padding: 5px; border: 1px solid #dddddd;"><h:outputText
									value="#{approvalBackingBean.getParameterDesc(ParameterConst.epvTypeRequest1, ParameterConst.approvalRequestExtendProposalValidityPeriod)}" />
							</td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><c:if
									test="#{requestdetails.originalValue eq ParameterConst.openForBumi or requestdetails.originalValue eq ParameterConst.openForAll}">
									<h:outputText
										value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, requestdetails.originalValue)}" />
								</c:if> <c:if
									test="#{requestdetails.originalValue ne ParameterConst.openForBumi and requestdetails.originalValue ne ParameterConst.openForAll}">
									<h:outputText value="#{requestdetails.originalValue}" />
								</c:if></td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><c:if
									test="#{requestdetails.changedValue eq ParameterConst.openForBumi or requestdetails.changedValue eq ParameterConst.openForAll}">
									<h:outputText
										value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, requestdetails.changedValue)}" />
								</c:if> <c:if
									test="#{requestdetails.changedValue ne ParameterConst.openForBumi and requestdetails.changedValue ne ParameterConst.openForAll}">
									<h:outputText value="#{requestdetails.changedValue}" />
								</c:if></td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><p:selectOneMenu
									id="decisiontypeid"
									value="#{requestdetails.decessionType.parameterId}"
									label="#{lbl['lbl.sc.decision']}"
									disabled="#{approvalBackingBean.managedBean.readOnly}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{approvalBackingBean.getDropdownValues(ParameterTypeConst.approvalDecisionTypeRequest1)}" />
									<p:ajax event="change"
										listener="#{approvalBackingBean.updateDecisionType(requestdetails)}" />
								</p:selectOneMenu> <p:message id="decisiontypeidhMsg" for="decisiontypeid"
									display="icon" /></td>
							<td style="padding: 5px; border: 1px solid #dddddd;">
								<h:panelGroup id="epvAttachmentEV1">
									<ac:scSingleFileUploadButton id="epvAttachmentEV1Id"
										popupWidgetVar="epvAttachmentEV1UploadDlg"
										attachment="#{requestdetails.epvApprovalReqAttachmentR1}"
										deleteFileUploadListener="approvalBackingBean.deleteEpvUploadFile"
										readonly="#{approvalBackingBean.managedBean.readOnly}">
											<f:setPropertyActionListener for="actionEvent"
												value="#{approvalBackingBean.assignValueForEpvAttachment(ParameterConst.epvTypeRequest1)}"
												target="#{approvalBackingBean.managedBean.epvAttachmentValue}" />
									</ac:scSingleFileUploadButton>
								</h:panelGroup>
							</td>
						</tr>
					</c:if>
					<c:if
						test="#{approvalBackingBean.managedBean.qt.approvalPBM eq true}">
						<tr style="text-align: left; font-size: 12px; text-indent: 0.1em;">
							<td style="padding: 5px; border: 1px solid #dddddd;"><h:outputText
									value="#{approvalBackingBean.getParameterDesc(ParameterConst.epvTypeRequest2, ParameterConst.approvalRequestExtendProposalValidityPeriod)}" />
							</td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><c:if
									test="#{requestdetails.originalValue eq ParameterConst.openForBumi or requestdetails.originalValue eq ParameterConst.openForAll}">
									<h:outputText
										value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, requestdetails.originalValue)}" />
								</c:if> <c:if
									test="#{requestdetails.originalValue ne ParameterConst.openForBumi and requestdetails.originalValue ne ParameterConst.openForAll}">
									<h:outputText value="#{requestdetails.originalValue}" />
								</c:if></td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><c:if
									test="#{requestdetails.changedValue eq ParameterConst.openForBumi or requestdetails.changedValue eq ParameterConst.openForAll}">
									<h:outputText
										value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, requestdetails.changedValue)}" />
								</c:if> <c:if
									test="#{requestdetails.changedValue ne ParameterConst.openForBumi and requestdetails.changedValue ne ParameterConst.openForAll}">
									<h:outputText value="#{requestdetails.changedValue}" />
								</c:if></td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><p:selectOneMenu
									id="decisiontypeidRq2"
									value="#{requestdetails.decisionCertPBM.parameterId}"
									label="#{lbl['lbl.sc.decision']}"
									disabled="#{approvalBackingBean.managedBean.readOnly}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{approvalBackingBean.getDropdownValues(ParameterTypeConst.approvalDecisionTypeRequest2)}" />
									<p:ajax event="change"
										listener="#{approvalBackingBean.updateDecisionCertPBM(requestdetails)}" 
										update="requestDetailsId"/>
								</p:selectOneMenu> <p:message id="decisiontypeidhMsgRq2" for="decisiontypeidRq2"
									display="icon" /></td>
							<td style="padding: 5px; border: 1px solid #dddddd;">
								<h:panelGroup id="epvAttachmentEV2">
									<ac:scSingleFileUploadButton id="epvAttachmentEV2Id"
										popupWidgetVar="epvAttachmentEV2UploadDlg"
										attachment="#{requestdetails.epvApprovalReqAttachmentR2}"
										deleteFileUploadListener="approvalBackingBean.deleteEpvUploadFile"
										readonly="#{approvalBackingBean.managedBean.readOnly}">
											<f:setPropertyActionListener for="actionEvent"
												value="#{approvalBackingBean.assignValueForEpvAttachment(ParameterConst.epvTypeRequest2)}"
												target="#{approvalBackingBean.managedBean.epvAttachmentValue}" />
									</ac:scSingleFileUploadButton>
								</h:panelGroup>
							</td>
						</tr>
						<c:if test="#{requestdetails.decisionCertPBM != null and requestdetails.decisionCertPBM.parameterCode == ParameterConst.tr2Acknowledge}">
						<tr
							style="background-color: #F3F3F3; text-align: left; font-size: 12px; text-indent: 0.1em;">
							<td style="padding: 5px; border: 1px solid #dddddd;"><h:outputText
									value="#{approvalBackingBean.getParameterDesc(ParameterConst.epvTypeRequest3, ParameterConst.approvalRequestExtendProposalValidityPeriod)}" />
							</td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><c:if
									test="#{requestdetails.originalValue eq ParameterConst.openForBumi or requestdetails.originalValue eq ParameterConst.openForAll}">
									<h:outputText
										value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, requestdetails.originalValue)}" />
								</c:if> <c:if
									test="#{requestdetails.originalValue ne ParameterConst.openForBumi and requestdetails.originalValue ne ParameterConst.openForAll}">
									<h:outputText value="#{requestdetails.originalValue}" />
								</c:if></td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><c:if
									test="#{requestdetails.changedValue eq ParameterConst.openForBumi or requestdetails.changedValue eq ParameterConst.openForAll}">
									<h:outputText
										value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scOpenFor, requestdetails.changedValue)}" />
								</c:if> <c:if
									test="#{requestdetails.changedValue ne ParameterConst.openForBumi and requestdetails.changedValue ne ParameterConst.openForAll}">
									<h:outputText value="#{requestdetails.changedValue}" />
								</c:if></td>
							<td style="padding: 5px; border: 1px solid #dddddd;"><p:selectOneMenu
									id="decisiontypeidRq3"
									value="#{requestdetails.decessionType.parameterId}"
									label="#{lbl['lbl.sc.decision']}"
									disabled="#{approvalBackingBean.managedBean.readOnly}"
									style="width: 178px;margin-bottom: 5px;">
									<f:selectItems
										value="#{approvalBackingBean.getDropdownValues(ParameterTypeConst.approvalDecisionTypeRequest3)}" />
									<p:ajax event="change"
										listener="#{approvalBackingBean.updateDecisionType(requestdetails)}" />
								</p:selectOneMenu> <p:message id="decisiontypeidhMsgRq3" for="decisiontypeidRq3"
									display="icon" /></td>
							<td style="padding: 5px; border: 1px solid #dddddd;">
								<h:panelGroup id="epvAttachmentEV3">
									<ac:scSingleFileUploadButton id="epvAttachmentEV3Id"
										popupWidgetVar="epvAttachmentEV3UploadDlg"
										attachment="#{requestdetails.epvApprovalReqAttachmentR3}"
										deleteFileUploadListener="approvalBackingBean.deleteEpvUploadFile"
										readonly="#{approvalBackingBean.managedBean.readOnly}">
											<f:setPropertyActionListener for="actionEvent"
												value="#{approvalBackingBean.assignValueForEpvAttachment(ParameterConst.epvTypeRequest3)}"
												target="#{approvalBackingBean.managedBean.epvAttachmentValue}" />
									</ac:scSingleFileUploadButton>
								</h:panelGroup>
							</td>
						</tr>
						</c:if>
					</c:if>
				</c:forEach>
				</c:if>
			</c:if>
			</table>
			<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse;">
			<tr>
			<td style="padding: 10px;">
			</td>
			</tr>
			</table>
			<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse;">
			<c:if test="#{approvalBackingBean.managedBean.taskName eq ParameterConst.supplierAcceptQtChange || approvalBackingBean.managedBean.taskName eq ParameterConst.fcApproveQTChange}" >
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.supplier.response.period']}" />
					</td>
					<td>
						<p:inputText value="#{approvalBackingBean.managedBean.scQtApprovalRequestList.get(0).responsePeriod}" style="width:200px;" disabled="#{approvalBackingBean.managedBean.readOnly}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.qt.response.period.tooltip5']}#{lbl['lbl.sc.qt.response.period.tooltip2']} #{qTDetailBB.retrieveResponsePeriod(ParameterConst.fromValue)} #{lbl['lbl.sc.qt.response.period.tooltip3']} #{qTDetailBB.retrieveResponsePeriod(ParameterConst.toValue)} #{lbl['lbl.sc.qt.response.period.tooltip4']}"/>
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity.extension.response.due.date']}" />
					</td>
					<td>
					<c:if test="#{qTDetailBB.getExtensionResponseDueDate(scQt.qtId, scQt.responsePeriod) != null}">
						<p:inputText value="#{qTDetailBB.getExtensionResponseDueDate(scQt.qtId, scQt.responsePeriod)}" style="width:200px;" disabled="true" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText>
					</c:if>
					<c:if test="#{qTDetailBB.getExtensionResponseDueDate(scQt.qtId, scQt.responsePeriod) == null}">
							<p:inputText value="#{lbl['lbl.sc.no.available']}" style="width:200px;" disabled="true" >
							</p:inputText>
					</c:if>
					</td>
				</tr>
			</c:if>
		</table>
	</p:panel>
</ui:composition>
