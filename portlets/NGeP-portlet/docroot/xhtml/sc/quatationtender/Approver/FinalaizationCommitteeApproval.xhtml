<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="fcRequestPnlid"
			value="#{approvalBackingBean.managedBean.scQtApprovalRequestList}"
			var="fcRequestDtls" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{fcRequestDtls}">

			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(fcRequestDtls.approvalType)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.from.value']}">
				<h:outputText value="#{fcRequestDtls.originalValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.to.value']}">
				<h:outputText value="#{fcRequestDtls.changedValue}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true"
		rendered="#{approvalBackingBean.managedBean.qt.qtType eq 'R'}">
		<p:dataTable id="supplierlistid" var="qtSupplier" rows="10"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtSupplierList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{qtSupplier}">
			
			<ac:paginator for="supplierlistid" />
			
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<h:outputText value="#{qtSupplier.smSupplier.companyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofno']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).mofNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}">
				<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).recordStatusFlg)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
