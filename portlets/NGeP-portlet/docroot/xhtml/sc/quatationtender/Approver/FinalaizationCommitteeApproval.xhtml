<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="fcRequestPnlid"
			value="#{approvalBackingBean.managedBean.scQtApprovalRequestList}"
			var="fcRequestDtls" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{fcRequestDtls}">

			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(fcRequestDtls.approvalType)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.from.value']}">
				<h:outputText value="#{fcRequestDtls.originalValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.to.value']}">
				<h:outputText value="#{fcRequestDtls.changedValue}" />
			</p:column>
		</p:dataTable>
		<ui:remove>#21692 - start</ui:remove>
		<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse;">
			<tr>
			<td style="padding: 10px;">
			</td>
			</tr>
		</table>
		<table
			style="width: 100%; font-family: arial, sans-serif; border-collapse: collapse;">
			<c:if test="#{approvalBackingBean.managedBean.taskName eq ParameterConst.supplierAcceptQtChange and scQt.responsePeriod != null}" ><ui:remove>#21692 WIP</ui:remove>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.new.validity.days']}" />
					</td>
					<td>
						<p:inputText value="#{approvalBackingBean.getNewValidityPeriod()}" style="width:200px;" disabled="true" />
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.new.validity.date']}" />
					</td>
					<td>
						<p:inputText value="#{qTDetailBB.getNewValidityDueDate(scQt, approvalBackingBean.getNewValidityPeriod())}" style="width:200px;" disabled="true" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.supplier.accept.response.period']}" />
					</td>
					<td>
						<p:inputText value="#{scQt.responsePeriod}" style="width:200px;" disabled="true" />
						<ac:iconTooltip value="#{lbl['lbl.sc.qt.supplier.accept.resp.period.tooltips']}"/>
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity.extension.response.due.date']}" />
					</td>
					<td>
					<c:if test="#{qTDetailBB.getExtensionResponseDueDate(scQt.qtId, scQt.responsePeriod) != null}">
						<p:inputText value="#{qTDetailBB.getExtensionResponseDueDate(scQt.qtId, scQt.responsePeriod)}" style="width:200px;" disabled="true" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText>
					</c:if>
					<c:if test="#{qTDetailBB.getExtensionResponseDueDate(scQt.qtId, scQt.responsePeriod) == null}">
							<p:inputText value="#{lbl['lbl.sc.no.available']}" style="width:200px;" disabled="true" >
							</p:inputText>
					</c:if>
					</td>
				</tr>
			</c:if>
		</table>
		<ui:remove>#21692 - end</ui:remove>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.supplier.list']}" toggleable="true"
		rendered="#{approvalBackingBean.managedBean.qt.qtType eq 'R'}">
		<p:dataTable id="supplierlistid" var="qtSupplier" rows="10"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtSupplierList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{qtSupplier}">
			
			<ac:paginator for="supplierlistid" />
			
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<h:outputText value="#{qtSupplier.smSupplier.companyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofno']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).mofNo}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}">
				<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).recordStatusFlg)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
