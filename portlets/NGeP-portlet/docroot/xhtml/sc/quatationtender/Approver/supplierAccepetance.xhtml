<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif" />
		</p:blockUI>
		<p:messages id="supplieacceptance" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />


		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<ui:repeat var="bpmAction"
						value="#{approvalBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel"
							value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
							styleClass="ui-button" onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();"
							action="#{approvalBackingBean.supplierAcceptance(bpmAction)}" />
					</ui:repeat>
				</p:column>
			</p:row>
		</p:panelGrid>



		<ui:include src="requestPTJdetails.xhtml" />
		<ui:include src="FinalaizationCommitteeApproval.xhtml" />
		<ui:include src="approveremarksdetails.xhtml" />


	</ui:define>
</ui:composition>
