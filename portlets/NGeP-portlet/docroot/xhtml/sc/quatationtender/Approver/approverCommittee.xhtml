<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<c:if
		test="#{approvalBackingBean.managedBean.qt.scQtGosodoBudgets ne null and approvalBackingBean.managedBean.qt.scQtGosodoBudgets.size() > 0}">
		<p:panel header="#{lbl['lbl.sc.qt.goso.list']}" toggleable="true">
			<p:dataTable id="gosoList"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{approvalBackingBean.managedBean.qt.scQtGosodoBudgets}"
				var="goso" style="width : 100%">

				<ac:paginator for="gosoList" />

				<p:column headerText="#{lbl['lbl.sc.qt.gocode']}">
					<h:inputText value="#{goso.pmGo.goCode}" disabled="true" size="30" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.qt.socode']}">
					<h:inputText value="#{goso.pmSo.soCode}" disabled="true" size="30" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.qt.goso.amount']}">
					<h:inputText value="#{goso.budgetAmt}" disabled="true" size="30" />
				</p:column>

			</p:dataTable>
		</p:panel>
	</c:if>
	
	<p:panel header="#{lbl['lbl.sc.lbl.prevCommittee']}" rendered="#{approvalBackingBean.managedBean.committeeUpdateFlow}" toggleable="true" id="prevCommitteeId">
		<p:tabMenu activeIndex="#{approvalBackingBean.managedBean.selectedCommitteeTabIndex}">
			<c:forEach var="tabBean" varStatus="status"
				items="#{approvalBackingBean.managedBean.scCommitteeMemberTabList}">
				<p:menuitem value="#{tabBean.titleName}"
					action="#{qTDetailBB.committeTabChangeAction(status.index)}" 
					partialSubmit="true"
					update="@form"
					process="@form" />
			</c:forEach>
		</p:tabMenu>
		<p:panel>
			<p:dataTable id="historyMemberTableId" styleClass=""
				value="#{approvalBackingBean.managedBean.memberHistoryList}"
				var="member" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{member.memberName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{member.identificationNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.designation']}"
					style="white-space: normal;">
					<h:outputText value="#{member.designation}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{member.email}" style="white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
					<h:outputText value="#{member.grade}" />
				</p:column>
				<p:column style="width: 6%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}"
							value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{lbl[ member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>
				<p:column style="width: 13%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.role']}" />
					</f:facet>
					<h:outputText
						value="#{qTDetailBB.getParameterDesc('CR', member.memberRole)}" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
	<c:choose>
		<c:when test="#{approvalBackingBean.managedBean.committeeUpdateFlow}">
			<p:panel header="#{lbl['lbl.sc.lbl.newCommittee']}" toggleable="true" id="newCommitteeId">
			<p:tabMenu activeIndex="#{approvalBackingBean.managedBean.selectedCommitteeTabIndex}">
			<c:forEach var="tabBean" varStatus="status"
				items="#{approvalBackingBean.managedBean.scCommitteeMemberTabList}">
				<p:menuitem value="#{tabBean.titleName}"
					action="#{qTDetailBB.committeTabChangeAction(status.index)}" 
					partialSubmit="true"
					update="@form"
					process="@form" />
				</c:forEach>
				</p:tabMenu>
				<ui:include src="committeeApprovalTab.xhtml" />
			</p:panel>
		</c:when>
		<c:otherwise>
			<p:tabMenu activeIndex="#{approvalBackingBean.managedBean.selectedCommitteeTabIndex}">
			<c:forEach var="tabBean" varStatus="status"
				items="#{approvalBackingBean.managedBean.scCommitteeMemberTabList}">
				<p:menuitem value="#{tabBean.titleName}"
					action="#{qTDetailBB.committeTabChangeAction(status.index)}" 
					partialSubmit="true"
					update="@form"
					process="@form" />
			</c:forEach>
			</p:tabMenu>
			<ui:include src="committeeApprovalTab.xhtml" />
		</c:otherwise>
	</c:choose>	
</ui:composition>
