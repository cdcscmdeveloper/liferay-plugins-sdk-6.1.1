<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="publicrequestdtlid"
			value="#{approvalBackingBean.managedBean.scQtApprovalRequestList}"
			var="publicapproval" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{publicapproval}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(publicapproval.approvalType)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.schedule.dtls']}" toggleable="true" id="publicationApprovalScheduleDetailsId">
		<ui:param name="isStatusPendingPublicationApproval" value="#{approvalBackingBean.managedBean.currentStatusId == QTStatusConst.QT_PENDING_PUBLICATION_APPROVAL or
								approvalBackingBean.managedBean.currentStatusId == QTStatusConst.QT_PENDING_PUBLICATION_REVISION_APPROVAL}" />
		<table style="width: 100%">
			<tr>
				<td style="width: 235px;">
					<p:outputLabel value="#{lbl['lbl.sc.publish.date']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" rendered="#{isStatusPendingPublicationApproval}" /></td>
				<td>
					<c:choose>
						<c:when test="#{isStatusPendingPublicationApproval}">
							<p:calendar label="#{lbl['lbl.sc.publish.date']}"
								disabled="#{approvalBackingBean.managedBean.readOnly and not approvalBackingBean.inApprovalEditableSection}"
								mindate="#{approvalBackingBean.handlePublishDate()}"
								value="#{approvalBackingBean.managedBean.qt.newPublishDate}"
								id="noticePublish" required="true"
								maxdate="#{qTScheduleDetailBackingBean.handleMaximumDate()}"
								pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
								size="15">
								<p:ajax event="dateSelect" process="@this"
									listener="#{qTScheduleDetailBackingBean.handlePublishedDate}"
									update="publicationApprovalScheduleDetailsId" />
							</p:calendar>
							<p:inputText id="publishTime" value="#{approvalBackingBean.managedBean.qt.publishDate}" disabled="true" size="4"
								style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
								<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
							</p:inputText>
							
							<p:inputText id="pday" value="#{approvalBackingBean.managedBean.qt.publishDate}" style="width: 65px; text-align: center;" disabled="true">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_DAY_ONLY}" /> 
							</p:inputText>
							
							<p:message id="noticePublishMsg" for="noticePublish" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="publishDate" 
								value="#{approvalBackingBean.managedBean.qt.publishDate}"
								disabled="true" style="width: 120px;margin-top:5px;">
								<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</p:inputText>
							<p:inputText id="publishTime" value="#{approvalBackingBean.managedBean.qt.publishDate}" disabled="true" size="4"
								style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
								<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
							</p:inputText>
							
							<p:inputText id="pday2" value="#{approvalBackingBean.managedBean.qt.publishDate}" style="width: 65px; text-align: center;" disabled="true">
									<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_DAY_ONLY}" /> 
							</p:inputText>
							
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<c:if
				test="#{approvalBackingBean.managedBean.qt.bsvRequired eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.bsv.date']}" /></td>
					<td>
						<p:inputText id="bsvDate" 
							value="#{approvalBackingBean.managedBean.qt.proposalStartDate}"
							disabled="true" style="width: 120px;margin-top:5px;">
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<p:inputText id="bsvTime" value="#{approvalBackingBean.managedBean.qt.proposalStartDate}" disabled="true" size="4"
							style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
						</p:inputText>
						<p:inputText id="pday3" value="#{approvalBackingBean.managedBean.qt.proposalStartDate}" style="width: 65px; text-align: center;" disabled="true">
								<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_DAY_ONLY}" /> 
						</p:inputText>
					</td>
				</tr>
			</c:if>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.publishing.period']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.publishPeriod}"
						readonly="true" id="publishingperiod" disabled="true"
						style="width: 120px;margin-top:5px; text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.closing.date']}" /></td>
				<td>
					<p:inputText id="closingDate"
						value="#{approvalBackingBean.managedBean.qt.closingDate}"
						readonly="true" disabled="true"
						style="width: 120px;margin-top:5px">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					<p:inputText id="closingTime" value="#{approvalBackingBean.managedBean.qt.closingDate}" 
						disabled="true" size="4"
						style="width: 65px;margin-top: 5px;margin-bottom: 0px;">
						<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
					</p:inputText>
					
					<p:inputText id="pday4" value="#{approvalBackingBean.managedBean.qt.closingDate}" style="width: 65px; text-align: center;" disabled="true">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_DAY_ONLY}" /> 
					</p:inputText>
					
				</td>
			</tr>
			
			<c:if
				test="#{approvalBackingBean.managedBean.qt.sampleReq eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sample.closingdate']}" />
						<!-- <p:outputLabel value="*" styleClass="mandatory" /> --></td>
					<td><p:inputText
							label="#{lbl['lbl.sc.sample.closingdate']}"
							value="#{approvalBackingBean.managedBean.qt.sampleClosingDate}"
							id="sampleClosingDate" readonly="true" disabled="true"
							style="width: 120px;margin-top:5px">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</p:inputText>
						<p:inputText id="sampleClosingTime" value="#{approvalBackingBean.managedBean.qt.sampleClosingDate}" 
							disabled="true" size="4"
							style="width: 65px;margin-top: 1px;margin-bottom: 0px;">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_12HR_TIME_FORMAT}" />
						</p:inputText>
						
						<p:inputText id="pday5" value="#{approvalBackingBean.managedBean.qt.sampleClosingDate}" style="width: 65px; text-align: center;" disabled="true">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_DAY_ONLY}" /> 
						</p:inputText>
						
					</td>
				</tr>
			</c:if>
		

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.qt.proposal.validity']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.qtValidityPeriod}"
						readonly="true" disabled="true"
						style="width: 120px;margin-top:5px; text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.proposal.validity.until']}" /></td>
				<td><p:inputText id="proposalvalidityid"
						value="#{approvalBackingBean.managedBean.qt.proposalValidityEndDate}"
						readonly="true" disabled="true"
						style="width: 120px;margin-top:5px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>
					
					<p:inputText id="pday6" value="#{approvalBackingBean.managedBean.qt.proposalValidityEndDate}" style="width: 65px; text-align: center;" disabled="true">
							<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_DAY_ONLY}" /> 
					</p:inputText>
					
					</td>
			</tr>
			<!-- <tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.expected.loa.date']}" /></td>
				<td><p:calendar id="publicationLoaDate"
						value="#{approvalBackingBean.managedBean.qt.expectedLoaDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonly="true"
						readonlyInput="true" showOn="button" /></td>
			</tr> -->
		</table>
	</p:panel>
	
	<c:if test="#{approvalBackingBean.managedBean.qt.bsvRequired}">
		<ui:include src="/xhtml/sc/quatationtender/briefingsitevisit/briefingsitevisitdetails.xhtml" />
	</c:if>
	
	<ac:scRemarkAndAttachment
		remarkList="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalRemarks}"
		showAttachment="false"
		readonly="#{approvalBackingBean.managedBean.readOnly and !approvalBackingBean.managedBean.approvalEditableSection}"
		instruction="#{approvalBackingBean.isReviceOrReject() ? lbl['lbl.sc.approval.remarks.instruction'] : ''}"
		autoUpdateValue="#{approvalBackingBean.managedBean.autoUpdate}" />
		
</ui:composition>
