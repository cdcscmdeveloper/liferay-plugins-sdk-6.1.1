<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="publicrequestdtlid"
			value="#{approvalBackingBean.managedBean.scQtApprovalRequestList}"
			var="publicapproval" rowIndexVar="index" editable="true"
			rowKey="#{publicapproval}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(publicapproval.approvalType)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.schedule.dtls']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.publish.date']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:calendar label="#{lbl['lbl.sc.publish.date']}"
						mindate="#{approvalBackingBean.managedBean.today}"
						value="#{approvalBackingBean.managedBean.qt.publishDate}"
						id="noticePublish" required="true"
						maxdate="#{qTScheduleDetailBackingBean.handleMaximumDate()}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button">
						<p:ajax event="dateSelect" process="@this"
							listener="#{qTScheduleDetailBackingBean.handlePublishClosingDate}"
							update="proposalvalidityid, publishClosingDate" />
					</p:calendar> <h:inputText value="12:00 PM" disabled="true" size="4"
						style="width: 52px;margin-top: 1px;margin-bottom: 0px;" /> <p:message
						id="noticePublishMsg" for="noticePublish" display="icon" /></td>
			</tr>
			<c:if
				test="#{approvalBackingBean.managedBean.qt.bsvRequired eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.bsv.date']}" /></td>
					<td><p:inputText id="publishBsvDate"
						value="#{approvalBackingBean.managedBean.qt.latestBsvDate}"
						readonly="true" disabled="true" style="margin-top:5px" size="14">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				</tr>
			</c:if>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.publishPeriod}"
						readonly="true" id="publishingperiod" disabled="true" size="30"
						style="margin-top:5px; text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.closing.date']}" /></td>
				<td><p:inputText id="publishClosingDate"
						value="#{approvalBackingBean.managedBean.qt.closingDate}"
						readonly="true" disabled="true" style="margin-top:5px;" size="15">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; <h:inputText
						value="12:00 PM" disabled="true" size="4"
						style="width: 52px;margin-top: 5px;margin-bottom: 0px;" /></td>
			</tr>
			<c:if
				test="#{approvalBackingBean.managedBean.qt.sampleReq eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.sample.closingdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><p:calendar label="#{lbl['lbl.sc.sample.closingdate']}"
							value="#{approvalBackingBean.managedBean.qt.sampleClosingDate}"
							id="proposalPreparation" required="true"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button" />
						<h:inputText value="12:00 PM" disabled="true" size="4"
							style="width: 52px" />
						<p:message id="proposalPreparationMsg" for="proposalPreparation"
							display="icon" /></td>
				</tr>
			</c:if>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.proposal.validity']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.qtValidityPeriod}"
						readonly="true" disabled="true" size="30"
						style="margin-top:5px;text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.proposal.validity.until']}" /></td>
				<td><p:inputText id="proposalvalidityid"
						value="#{approvalBackingBean.managedBean.proposalValidityUntil}"
						readonly="true" disabled="true" style="margin-top:5px;" size="30">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<!-- <tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.expected.loa.date']}" /></td>
				<td><p:calendar id="publicationLoaDate"
						value="#{approvalBackingBean.managedBean.qt.expectedLoaDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" readonly="true"
						readonlyInput="true" showOn="button" /></td>
			</tr> -->
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="publicremark">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid id="publicremarklist"
						value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td width="5"></td>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="publicremarkDates"
										value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										maxlength="1000" rendered="#{remarkVar.remarkId eq null}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
