<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newcommitteeapproverid" position="top"
		header="New #{qTCommitteBackingBean.managedBean.tabTitle}"
		dynamic="true" widgetVar="newcommitteeapprover" modal="true"
		styleClass="commiteeapprovermember">
		<p:panel>
			<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="#{lbl['lbl.sc.committe.addscreen.selection']}" />
				<p:selectOneRadio
					value="#{qTCommitteBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{qTCommitteBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{qTCommitteBackingBean.userSelcetionAction}"
						update="newCommitteeApproverProfile" process="@this"></p:ajax>
				</p:selectOneRadio>
			</h:panelGrid>
			<p:panel id="newCommitteeApproverProfile"
				style="width:100%;margin-top:10px;">
				<c:if
					test="#{qTCommitteBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel header="#{lbl['lbl.so.searchbtn']}" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.name}" size="64" /></td>
							</tr>
							<tr>
								<td style="width: 110px;"><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{qTCommitteBackingBean.managedBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.identificationNo}"
										size="30" /></td>
							</tr>
						</table>
					</p:panel>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
							icon="ui-icon-search"
							action="#{qTCommitteBackingBean.existingCommitteeSearchAction}"
							update="@(.existingCommitteeResults)" partialSubmit="true"
							process="@parent" />
						<p:commandButton value="#{lbl['lbl.so.reset']}"
							action="#{qTCommitteBackingBean.reset}"
							update="newCommitteeApproverProfile" icon="ui-icon-reset"
							resetValues="true" partialSubmit="true" process="@this" />
					</div>
					<p:spacer height="5" />
					<p:panel header="#{lbl['lbl.so.result']}" toggleable="true">
						<p:dataTable id="existingcommitteeapproversearchid"
							value="#{qTCommitteBackingBean.managedBean.externalUsers}"
							selection="#{qTCommitteBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existcommitteeuser}" var="existcommitteeuser"
							styleClass="existingCommitteeResults" style="width : 900px;">

							<ac:paginator for="existingcommitteeapproversearchid" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.so.bo.name']}">
								<h:outputText value="#{existcommitteeuser.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
								<h:outputText value="#{existcommitteeuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.designation']}">
								<h:outputText value="#{existcommitteeuser.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.email']}">
								<h:outputText
									value="#{existcommitteeuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.grade']}">
								<h:outputText value="#{existcommitteeuser.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.pp']}">
								<h:outputText value="#{existcommitteeuser.PMP ? 'Yes' : 'No'}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.role']}">
								<ui:fragment rendered="#{existcommitteeuser.PMP == true}">
									<h:outputText value="Chairperson" />
								</ui:fragment>
								<ui:fragment rendered="#{existcommitteeuser.PMP == false}">
									<p:selectOneMenu id="appaction"
										value="#{existcommitteeuser.memberRole}"
										style="width: 110px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.managedBean.roleTypes}" />
									</p:selectOneMenu>
								</ui:fragment>
							</p:column>
						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{qTCommitteBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="#{lbl['lbl.so.new.user']}" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.committeMember.memberName}"
										size="30" /></td>
							</tr>
							<tr>
								<td style="width: 125px;"><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{qTCommitteBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idno']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.committeMember.icPassport}"
										size="30" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.grade']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.committeMember.grade}"
										size="30" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.pp']}" /></td>
								<td colspan="3"><p:selectOneRadio
										value="#{qTCommitteBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.designation']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.committeMember.designation}"
										size="30" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.email']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTCommitteBackingBean.managedBean.committeMember.email}"
										size="30" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.role']}" /></td>
								<td colspan="3"><p:selectOneMenu
										value="#{qTCommitteBackingBean.managedBean.committeMember.memberRole}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTCommitteBackingBean.getDropdownCodeValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu></td>
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					onclick="newcommitteeapprover.hide();" update="@(.scmemberdtls)"
					process="@this, newCommitteeApproverProfile" icon="ui-icon-check"
					actionListener="#{qTCommitteBackingBean.okCommitteeAction}" />

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					styleClass="apply_button" process="@this"
					oncomplete="newcommitteeapprover.hide();" icon="ui-icon-cancel" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
