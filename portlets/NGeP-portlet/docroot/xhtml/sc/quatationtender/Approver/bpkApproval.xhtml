<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="requestdtlid"
			value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalDtls}"
			var="requestdetails" rowIndexVar="index" editable="true"
			rowKey="#{requestdetails}">

			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(requestdetails.approvalType)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.from']}">
				<h:outputText value="#{requestdetails.originalValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.to']}">
				<h:outputText value="#{requestdetails.changedValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.decision']}">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.decision']}" />
				</f:facet>
				
				<p:selectOneMenu id="decisiontypeid" value="#{requestdetails.decessionType.parameterId}"
					style="width: 178px;margin-bottom: 5px;" rendered="#{requestdetails.approvalType.parameterCode ne 'RT'}">
					<f:selectItems value="#{approvalBackingBean.getDropdownValues(ParameterTypeConst.approvalDecisionType)}" />
					<p:ajax event="change" listener="#{approvalBackingBean.updatePmParameter(requestdetails)}" />
				</p:selectOneMenu>
				
				<p:selectOneMenu id="decisiontypeids" value="#{requestdetails.decessionType.parameterId}"
					style="width: 178px;margin-bottom: 5px;" rendered="#{requestdetails.approvalType.parameterCode eq 'RT'}">
					<f:selectItems value="#{approvalBackingBean.getDropdownValues(ParameterTypeConst.approvalDecisionType)}" />
					<p:ajax event="change" listener="#{approvalBackingBean.updatePmParameter(requestdetails)}" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="Supplier List" toggleable="true"
		rendered="#{approvalBackingBean.managedBean.qt.qtType eq 'R'}">
		<p:dataTable id="supplierlistid">
			<p:column headerText="#{lbl['lbl.so.suppliername']}"></p:column>
			<p:column headerText="#{lbl['lbl.so.mofno']}"></p:column>
			<p:column headerText="#{lbl['lbl.so.mofexp']}"></p:column>
			<p:column headerText="#{lbl['lbl.so.status']}"></p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
