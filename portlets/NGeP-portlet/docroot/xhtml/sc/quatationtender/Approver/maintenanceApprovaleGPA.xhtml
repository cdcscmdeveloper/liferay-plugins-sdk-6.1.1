<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">
		<ui:param name="scQt" value="#{approvalBackingBean.managedBean.qt}" />
		<ui:param name="approvalRequest"
			value="#{qTDetailBB.managedBean.scQtApprovalRequest}" />

		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<table width="100%" class="BtnSpacing">
			<tr>
				<td><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						action="#{qTDetailBB.maintenanceDetailsBackAction}" /></td>
			</tr>
		</table>

		<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true"
			id="qtScQtReqeGPAId">
			<table>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.cm.rpt.request.type']}"
						style="padding-left: 70px;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{approvalBackingBean.getParameterDesc(approvalRequest.approvalType)}"
							style="padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period.request.decision']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{approvalBackingBean.getParameterDesc(approvalRequest.approverAction)}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.decision.date']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{qTDetailBB.convertDayDateToMonthDate(approvalRequest.approverActionDate)}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period.egpa.maintenance.details.decision.ref']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{approvalRequest.fileReferenceNo}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.customer.service.officer.name']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{approvalRequest.approverName}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period.egpa.maintenance.details.off.des']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{approvalRequest.designation}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.remarks']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{qTDetailBB.retrieveeGPAApproverRemark(approvalRequest.qtApprovalRequestId)}"
							style="margin-top: 0.5em; display: inline-block;white-space: normal;padding-right: 70px;padding-left: 20px;"/></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qt.publishing.period.egpa.maintenance.details.off.approved.period']}"
						style="padding-left: 70px;margin-top: 0.5em;"/></td>
					<td><p:outputLabel value=":"
						style="margin-top: 0.5em;"/></td>
					<td><h:outputText
							value="#{approvalRequest.responsePeriod}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"
							rendered="#{approvalRequest.responsePeriod ne null}"/>
						<h:outputText
							value="#{lbl['lbl.txt.na']}"
							style="margin-top: 0.5em; display: inline-block;padding-left: 20px;"
							rendered="#{approvalRequest.responsePeriod eq null}"/></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
