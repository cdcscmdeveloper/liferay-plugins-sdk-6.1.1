<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qt.req.ptj']}" style="width: 100%" toggleable="true">
		<table>
			<tr>
				<td style="width: 150px;"><p:outputLabel
						value="#{lbl['lbl.qt.nb.ministry']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.pmOrgProfile.parentOrgProfile.parentOrgProfile.orgName}"
						disabled="true" readonly="true" size="80" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.qt.nb.jabatan']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.pmOrgProfile.parentOrgProfile.orgName}"
						disabled="true" readonly="true" size="80" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.qt.nb.ptj']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.pmOrgProfile.orgName}"
						disabled="true" readonly="true" size="80" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.qt.bsv.requestor']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.createdBy}"
						disabled="true" readonly="true" size="80" /></td>
				<td style="width: 250px;"><p:outputLabel value="Request Date" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.createdDate}"
						disabled="true" readonly="true" size="30">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.qtnno']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.qtNo}" disabled="true"
						readonly="true" size="30" /></td>
				<td><p:outputLabel value="Procurement Mode" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.getParameterDesc(approvalBackingBean.managedBean.qt.procurementMode)}"
						disabled="true" readonly="true" size="30" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.so.title']}" /></td>
				<td colspan="3"><p:inputTextarea
						value="#{approvalBackingBean.managedBean.qt.qtTitle}" cols="170"
						rows="2" style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
