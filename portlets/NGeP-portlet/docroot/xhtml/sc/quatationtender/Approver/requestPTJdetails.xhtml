<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Requesting PTJ" style="width: 100%" toggleable="true">
		<table>
			<tr>
				<td style="width: 140px;"><p:outputLabel value="#{lbl['lbl.qt.nb.ministry']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.ministryOrgProfile.orgCode} - #{approvalBackingBean.managedBean.qt.ministryOrgProfile.orgName}"
						disabled="true" readonly="true" size="35" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.qt.nb.jabatan']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.departmentOrgProfile.orgCode} - #{approvalBackingBean.managedBean.qt.departmentOrgProfile.orgName}"
						disabled="true" readonly="true" size="35" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.qt.nb.ptj']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.pmOrgProfile.orgCode} - #{approvalBackingBean.managedBean.qt.pmOrgProfile.orgName}"
						disabled="true" readonly="true" size="30" /></td>
				<td />
				<td />
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.qt.bsv.requestor']}" /></td>
				<td><p:inputText disabled="true" readonly="true" size="30" /></td>
				<td style="width: 190px;"><p:outputLabel value="Request Date" /></td>
				<td><p:inputText disabled="true" readonly="true" size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.qtnno']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.qtNo}" disabled="true"
						readonly="true" size="30" /></td>
				<td><p:outputLabel value="Procurement Mode" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, approvalBackingBean.managedBean.qt.procurementMode)}"
						disabled="true" readonly="true" size="30" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.so.title']}" /></td>
				<td colspan="3"><p:inputTextarea
						value="#{approvalBackingBean.managedBean.qt.qtTitle}" cols="113"
						rows="2" style=" margin-bottom:5px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
