<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qt.req.ptj']}" toggleable="true">
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.ministry']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrieveMinistryByOrgProfileId(approvalBackingBean.managedBean.qt.pmOrgProfile.orgProfileId)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<!-- <tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.department']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.pmOrgProfile.parentOrgProfile.orgName}"
						disabled="true" readonly="true" size="80" /></td>
				<td />
				<td />
			</tr> -->
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ptj']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.managedBean.qt.pmOrgProfile.orgName}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.requestor']}" /></td>
				<td style="width: 450px;"><p:inputText
						value="#{approvalBackingBean.retriveUserName(approvalBackingBean.managedBean.qt.createdBy)}"
						disabled="true" readonly="true" style="width:350px;" /></td>
				
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.request.date']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.scQtApproval.requestDate}"
						disabled="true" readonly="true" style="width:212px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.managedBean.qt.qtNo}" disabled="true"
						readonly="true" style="width:350px;" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.getParameterDesc(approvalBackingBean.managedBean.qt.procurementMode)}"
						disabled="true" readonly="true" style="width:212px;" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td colspan="3"><p:inputTextarea
						value="#{approvalBackingBean.managedBean.qt.qtTitle}" cols="170"
						rows="3" style=" margin-bottom:5px; width:866px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
