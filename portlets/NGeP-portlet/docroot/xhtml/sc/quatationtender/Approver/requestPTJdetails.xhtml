<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<style>
		.blue-instruction{
			float: left !important; 
			color: #0054a6 !important; 
			font-size: 12px !important; 
			font-family: Arial, helvetica, sans-serif !important; 
			font-weight: normal !important; 
			font-style: italic !important; 
		}
	</style>
	<p:panel header="#{lbl['lbl.sc.qt.req.ptj']}" toggleable="true" id="qtScQtReqPtjId">
		<c:if test="#{approvalBackingBean.managedBean.taskName eq ParameterConst.supplierAcceptQtChange and approvalBackingBean.managedBean.qt.responsePeriod != null}" >
			<ui:remove>#21692 - start</ui:remove>
			<h:outputText styleClass="blue-instruction"
				value="#{lbl['lbl.sc.qt.supplier.accept.change.instruction']}"  />
			<br/><br/>
		</c:if>
		<c:if test="#{approvalBackingBean.managedBean.taskName eq ParameterConst.fcApproveQTChange and approvalBackingBean.managedBean.qt.responsePeriod != null}" ><ui:remove>#21692 WIP</ui:remove>
			<p:outputLabel styleClass="blue-instruction"
				value="#{lbl['lbl.sc.proposal.validity.extension.instruction']}"/>
			<ui:remove>#21692 - end</ui:remove>
			<br/><br/>
		</c:if>
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.ministry']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrieveMinistryByOrgProfileId(scQt.pmOrgProfile.orgProfileId)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<!-- <tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.department']}" /></td>
				<td><p:inputText
						value="#{scQt.pmOrgProfile.parentOrgProfile.orgName}"
						disabled="true" readonly="true" size="80" /></td>
				<td />
				<td />
			</tr> -->
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.prepare.ptj']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrievePTJByOrgProfileId(scQt.ownerOrgProfile.orgProfileId,approvalBackingBean.isQTStatusPublished(approvalBackingBean.managedBean.currentStatusId)?scQt.publishDate : scQt.createdDate)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.prepare.for.ptj']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrievePTJByOrgProfileId(scQt.pmOrgProfile.orgProfileId,approvalBackingBean.isQTStatusPublished(approvalBackingBean.managedBean.currentStatusId)?scQt.publishDate : scQt.createdDate)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.requestor']}" /></td>
				<td style="width: 450px;"><p:inputText
						value="#{approvalBackingBean.retriveUserName(scQt.createdBy)}"
						disabled="true" readonly="true" style="width:350px;" /></td>
				
				<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.request.date']}" /></td>
				<td><p:inputText
						value="#{scQtApproval.requestDate}"
						disabled="true" readonly="true" style="width:212px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td><p:inputText
						value="#{scQt.qtNo}" disabled="true"
						readonly="true" style="width:350px;" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.getParameterDesc(scQt.procurementMode)}"
						disabled="true" readonly="true" style="width:212px;" /></td>
			</tr>

			<ui:remove>#21692 - start</ui:remove>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td colspan="3"><p:inputTextarea
						value="#{scQt.qtTitle}" cols="170"
						rows="3" style=" margin-bottom:5px; width:866px;" disabled="true" /></td>
			</tr>
			<c:if test="#{(approvalBackingBean.managedBean.taskName eq ParameterConst.supplierAcceptQtChange || approvalBackingBean.managedBean.taskName eq ParameterConst.fcApproveQTChange)
							and approvalBackingBean.managedBean.qt.responsePeriod != null}" ><ui:remove>#21692 WIP</ui:remove>
				<tr>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.qt.old.validity.days']}" /> 
					</td>
					<td>
						<p:inputText id="responsePeriod" value="#{scQt.qtValidityPeriod}" style="width:200px;" disabled="true" />
					</td>
					<td>
						<p:outputLabel value="#{lbl['lbl.sc.proposal.validity.until']}" />
					</td>
					<td>
						<p:inputText value="#{scQt.proposalValidityEndDate}" style="width:200px;" disabled="true" >
							<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
						</p:inputText>
					</td>
				</tr>
				<ui:remove>#21692 - end</ui:remove>
			</c:if>
		</table>
	</p:panel>
</ui:composition>
