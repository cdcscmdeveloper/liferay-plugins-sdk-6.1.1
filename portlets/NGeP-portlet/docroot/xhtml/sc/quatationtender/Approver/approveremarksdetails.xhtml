<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Remark and Supporting Document" toggleable="true"
		id="bpkremarksupDtls">
		<table style="width: 100%" id="bpkremarksupDtlslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid id="bpkremarklist"
						value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top">
									<!-- <h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /> -->
								</td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.qt.supp.doc']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td />
							<td><p:dataGrid id="attachedIds"
									value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalAttachment}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage library="ep/images/design"
													name="#{approvalBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText
													value="#{attachFile.createdUser.userName}" />, <h:outputText
													value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{approvalBackingBean.downloadFile(attachFile)}" />
											</td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>

</ui:composition>
