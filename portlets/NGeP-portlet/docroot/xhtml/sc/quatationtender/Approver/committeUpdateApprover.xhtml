<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<style>
		.blue-instruction {
			float: left !important;
			color: #0054a6 !important;
			font-size: 12px !important;
			font-family: Arial, helvetica, sans-serif !important;
			font-weight: normal !important;
			font-style: italic !important;
		}
	</style>
	<p:panel header="#{lbl['lbl.sc.qt.req.ptj']}" toggleable="true"
		id="reqDetailId">
		<table style="width: 100%;">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.ministry']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrieveMinistryByOrgProfileId(scQt.pmOrgProfile.orgProfileId)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.prepare.ptj']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrievePTJByOrgProfileId(scQt.ownerOrgProfile.orgProfileId,approvalBackingBean.isQTStatusPublished(approvalBackingBean.managedBean.currentStatusId) 
							? scQt.publishDate : scQt.createdDate)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.prepare.for.ptj']}" /></td>
				<td colspan="3"><p:inputText
						value="#{approvalBackingBean.retrievePTJByOrgProfileId(scQt.pmOrgProfile.orgProfileId,approvalBackingBean.isQTStatusPublished(approvalBackingBean.managedBean.currentStatusId) 
							? scQt.publishDate : scQt.createdDate)}"
						disabled="true" readonly="true" style="width:866px;" /></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.requestor']}" /></td>
				<td style="width: 450px;"><p:inputText
						value="#{approvalBackingBean.retriveUserName(approvalRequest.createdBy)}"
						disabled="true" readonly="true" style="width:350px;" /></td>

				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.request.date']}" /></td>
				<td><p:inputText value="#{approvalRequest.createdDate}"
						disabled="true" readonly="true" style="width:212px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td><p:inputText value="#{scQt.qtNo}" disabled="true"
						readonly="true" style="width:350px;" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
				<td><p:inputText
						value="#{approvalBackingBean.getParameterDesc(scQt.procurementMode)}"
						disabled="true" readonly="true" style="width:212px;" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.title']}" /></td>
				<td colspan="3"><p:inputTextarea value="#{scQt.qtTitle}"
						cols="170" rows="3" style=" margin-bottom:5px; width:866px;"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.lbl.prevCommittee']}" toggleable="true"
		id="prevCommitteeId">
		<p:tabMenu activeIndex="0">
			<p:menuitem
				value="#{approvalBackingBean.managedBean.currentCommitteeDesc}" />
		</p:tabMenu>
		<p:panel styleClass="scMemberDtl">
			<p:dataTable id="historyMemberTableId" styleClass=""
				value="#{approvalBackingBean.managedBean.memberHistoryList}"
				var="member" rowIndexVar="index"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
				<p:column headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{member.memberName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{member.identificationNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.designation']}"
					style="white-space: normal;">
					<h:outputText value="#{member.designation}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{member.email}" style="white-space: normal;" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.grade']}" style="width: 10%">
					<h:outputText value="#{member.grade}" />
				</p:column>
				<p:column style="width: 6%">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}"
							value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{lbl[ member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>
				<p:column style="width: 13%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.role']}" />
					</f:facet>
					<h:outputText
						value="#{qTDetailBB.getParameterDesc('CR', member.memberRole)}" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.lbl.newCommittee']}" toggleable="true"
		id="newCommitteeId">
		<ui:include src="approverCommittee.xhtml" />
	</p:panel>
	<ui:include src="approveremarksdetails.xhtml" />
</ui:composition>
