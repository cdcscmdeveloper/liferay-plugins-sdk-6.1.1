<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel>
			<table>
				<tr>
					<td align="right"><c:forEach
							items="#{approvalBackingBean.managedBean.outComes}" var="action">

							<c:if test="${action == 'SUBMIT'}">
								<ui:param name="iconVar" value="ui-icon-submit" />

							</c:if>

							<c:if test="${action == 'REJECT'}">
								<ui:param name="iconVar" value="ui-icon-reject" />

							</c:if>
							<c:if test="${action == 'REVISE'}">
								<ui:param name="iconVar" value="ui-icon-revise" />

							</c:if>
							<c:if test="${action == 'APPROVE'}">
								<ui:param name="iconVar" value="ui-icon-approve" />

							</c:if>
							<c:if test="${action == 'ACCEPT'}">
								<ui:param name="iconVar" value="ui-icon-approve" />

							</c:if>
							<p:commandButton value="#{action}" process="@all"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{approvalBackingBean.updateBpmTask(action)}" />
						</c:forEach></td>
				</tr>
			</table>

			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'Budget Approval'}">
				<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="approveremarksdetails.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'BPK Approval'}">

				<ui:include src="bpkApproval.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'PTJ Approval'}">
				<ui:include src="ptjApprovalTab.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'Committee Appointment Approval'}">
			<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="committeeApprovalTab.xhtml" />
			</c:if>
		</p:panel>
	</ui:define>
</ui:composition>
