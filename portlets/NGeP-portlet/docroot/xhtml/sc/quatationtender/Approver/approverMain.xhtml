<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">
		<p:panel>
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:right">
						<ui:repeat
							var="bpmAction"
							value="#{approvalBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<p:commandButton value="#{lbl[buttonLabel]}" update="@form" 
								styleClass="ui-button"
								icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
								action="#{approvalBackingBean.updateBpmTask(bpmAction)}" />
						</ui:repeat>
					</p:column>
				</p:row>
			</p:panelGrid>

			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'Budget Approval'}">
				<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="approveremarksdetails.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'BPK Approval'}">
				<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="bpkApproval.xhtml" />
				<ui:include src="approveremarksdetails.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'PTJ Approval'}">
				<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="ptjApprovalTab.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'Committee Appointment Approval'}">
				<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="committeeApprovalTab.xhtml" />
			</c:if>
			<c:if
				test="${approvalBackingBean.managedBean.approvalType == 'Publication Approval'}">
				<ui:include src="requestPTJdetails.xhtml" />
				<ui:include src="publicApproval.xhtml"/>
			</c:if>
		</p:panel>
	</ui:define>
</ui:composition>
