<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<p:messages id="specApprovalMessages" showDetail="true"
			autoUpdate="#{approvalBackingBean.managedBean.autoUpdate}"
			closable="true" showSummary="false" severity="error, info" />

		<ac:gpkiPopup textBeforeSign="#{approvalBackingBean.textBeforeSign}"
			postSignAction="#{approvalBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" />

		<div class="ppRightBtn">
			<h:panelGroup id="approverBtns">
<ui:param name="readOnlyTask" value="#{approvalBackingBean.managedBean.readOnly}" />
				<ui:decorate
					template="/WEB-INF/facelets/templates/claim_template.xhtml">
					<ui:define name="outComeSection">
						<ui:repeat var="bpmAction"
							value="#{approvalBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

							<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
								styleClass="ui-button" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();"
								action="#{approvalBackingBean.approvalBpmTask(bpmAction)}" />
						</ui:repeat>
					</ui:define>
				</ui:decorate>



			</h:panelGroup>
		</div>
		<c:if
			test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryBudget}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="approveremarksdetails.xhtml" />
		</c:if>
		<c:if
			test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryBpk}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="bpkApproval.xhtml" />
			<ui:include src="approveremarksdetails.xhtml" />
		</c:if>
		<c:if
			test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryPtj}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="ptjApprovalextendcls.xhtml" />
		</c:if>
		<c:if
			test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryCommitteeeApointment}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="approverCommittee.xhtml" />
		</c:if>
		<c:if
			test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalRequestPublicationApproval}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="publicApproval.xhtml" />
		</c:if>

		<c:if
			test="${approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryFinalizationCommittee or
				approvalBackingBean.managedBean.approvalType == ParameterConst.approvalCategoryProcurementBoard}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="FinalaizationCommitteeApproval.xhtml" />
			<ui:include src="approveremarksdetails.xhtml" />
		</c:if>

		<p:dialog id="reviceApprovalDlg" widgetVar="reviceApprovalDlg"
			header="#{lbl['lbl.sc.dialog.confirm.header.revise']}"
			resizable="false" width="325" height="90" modal="true">

			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.sc.spec.dialog.yesbtn.message']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					oncomplete="reviceApprovalDlg.hide();"
					action="#{approvalBackingBean.updateReviceBpmTask}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					onclick="reviceApprovalDlg.hide();" type="button" />
			</div>
		</p:dialog>
	</ui:define>
</ui:composition>
