<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<table>
			<tr>
				<td align="right"><c:forEach
						items="#{approvalBackingBean.managedBean.outComes}" var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						<c:if test="${action == 'REVISE'}">
							<ui:param name="iconVar" value="ui-icon-revise" />

						</c:if>
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<c:if test="${action == 'ACCEPT'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<p:commandButton value="#{action}" process="@all"
							styleClass="ui-button" icon="#{iconVar}"
							actionListener="#{approvalBackingBean.updateBpmTask(action)}" />
					</c:forEach></td>
			</tr>
		</table>
		
	
		<ui:fragment
			rendered="#{approvalBackingBean.managedBean.approvalType eq 'Budget Approval'}">
			<ui:include src="requestPTJdetails.xhtml" />
			<ui:include src="approveremarksdetails.xhtml" />
		</ui:fragment>
		<ui:fragment
			rendered="#{approvalBackingBean.managedBean.approvalType eq 'BPK Approval'}">

			<ui:include src="bpkApproval.xhtml" />
		</ui:fragment>
		<ui:fragment
			rendered="#{approvalBackingBean.managedBean.approvalType eq 'PTJ Approval'}">
			<ui:include src="ptjApprovalTab.xhtml" />
		</ui:fragment>
		<ui:fragment
			rendered="#{'Committee Appointment Approval' == approvalBackingBean.managedBean.approvalType}">
			<ui:include src="committeeApprovalTab.xhtml" />
		</ui:fragment>
	</ui:define>
</ui:composition>
