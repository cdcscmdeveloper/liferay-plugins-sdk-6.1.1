<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
    xmlns:ac="http://ac.my/jsf/composite/cc"
	>
	 
	 <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>  -->
	 <p:panel header="Audit Panel" toggleable="true" toggleSpeed="500" widgetVar="auditPanel"
         style="margin-bottom:10px;" >
	 	<!-- Print & Download buttons -->
            <div style="text-align: right; margin-bottom: 10px;">
                <p:commandLink value="#{lbl['lbl.btn.print']}" ajax="false">
						<p:fileDownload
							value="#{auditQTBackingBean.generateReport(auditQTBackingBean.managedBean.qtId)}" />
					</p:commandLink>
					&#160;
					<p:commandLink value="#{lbl['lbl.btn.download']}" ajax="false">
						<p:fileDownload
							value="#{auditQTBackingBean.getAuditTrailDetailsForExlRpt(auditQTBackingBean.managedBean.qtId, auditQTBackingBean.managedBean.groupSectionId)}" />
					</p:commandLink>
					&#160;
            </div> 
	 
	 	<!-- Tab menu -->
		<h:panelGroup id="searchViewId">
			<p:tabMenu id="tab"
				activeIndex="#{auditQTBackingBean.managedBean.activeIndex}"
				styleClass="equal-width-tabs">
				<p:menuitem value="#{lbl['lbl.audit.tab.general.information']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(0)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.brief.site.visit']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(1)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.tab.supplier.list']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(2)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.desk.officer.assistant']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(3)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.tab.desk.officer']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(4)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.spec.committee.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(5)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.eval.committee.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(6)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.tech.committee.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(7)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem
					value="#{lbl['lbl.audit.tab.finance.committee.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(8)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.opening.committee.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(9)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.quot.committee.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(10)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
				<p:menuitem value="#{lbl['lbl.audit.procurement.board.appoint']}"
					actionListener="#{auditQTBackingBean.onTabMenuChangeAction(11)}"
					process="@form" update="@form" partialSubmit="true">
				</p:menuitem>
			</p:tabMenu>

			<!-- Data table for Quotation/Tender -->
			<p:dataTable id="searchQtTblId" var="obj" rows="10"
				value="#{auditQTBackingBean.searchQT}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" lazy="true">

				<ac:paginator for="searchQtTblId"></ac:paginator>

				<p:column headerText="#{lbl['lbl.audit.header.action.date']}"
					style="white-space: normal!important;" width="5%">
					<h:outputText value="#{obj.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.getDefault12hrDatetimesecondFormat()}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.action.type']}"
					style="white-space: normal!important;" width="5%">
					<h:outputText
						value="#{empty obj.actionType ? lbl['lbl.audit.no.available']:obj.actionType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.action.by']}"
					style="white-space: normal!important;" width="5%">
					<h:outputText value="#{obj.actionBy}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.org.name']}"
					style="white-space: normal!important;" width="10%">
					<h:outputText value="#{obj.orgName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.role']}"
					style="white-space: normal!important;" width="5%">
					<h:outputText value="#{obj.roleName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.docType']}"
					style="white-space: normal!important;" width="5%">
					<h:outputText value="#{obj.docType}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.docNo']}"
					style="white-space: normal!important;" width="10%">
					<h:outputText value="#{obj.docNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.document.status']}"
					style="white-space: normal!important;" width="10%">
					<h:outputText value="#{obj.docStatus}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.fieldName']}"
					style="white-space: normal!important;" width="5%">
					<h:outputText
						value="#{empty obj.fieldName ? lbl['lbl.audit.no.available']:obj.fieldName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.oldValue']}"
					style="white-space: normal!important;" width="20%">
					<h:outputText value="#{obj.oldValue}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.audit.header.newValue']}"
					style="white-space: normal!important;" width="20%">
					<h:outputText value="#{obj.newValue}" />
				</p:column>

			</p:dataTable>
		</h:panelGroup>

	</p:panel>	
</ui:composition>
