<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<table style="width: 100%">
			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'BPK Approval'}">
				<tr>
					<td style="width: 138px;" valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.qt.typofappreq']}"></p:outputLabel></td>
					<td style="width: 195px; padding-top: 5px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="Restricted Tender" itemValue="RT" />
							<f:selectItem itemLabel="Direct Negotiation" itemValue="DN" />
							<f:selectItem itemLabel="Qtn/Tender Type Approval"
								itemValue="QTT" />
							<f:selectItem itemLabel="Reduce Proposal Validity Period"
								itemValue="RPP" />
							<f:selectItem itemLabel="Reduce Publishing Period"
								itemValue="RPVP" />
						</p:selectManyCheckbox></td>
				</tr>
			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'Procurement Board'}">
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="#{lbl['lbl.sc.qt.typofappreq']}"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection" style="margin-right:5px;">
							<f:selectItem itemLabel="CancellationQtn/Tender"
								itemValue="Publication" />
							<f:selectItem itemLabel="ExtendedProposalValidityPeriod"
								itemValue="startDate" />
							<f:selectItem itemLabel="ExtendPerformenceBondPeriod"
								itemValue="ModificationQT" />
						</p:selectManyCheckbox></td>
				</tr>
			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'MITI Approval'}">
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="#{lbl['lbl.sc.qt.typofappreq']}"></p:outputLabel></td>
					<td style="width: 100px; padding-top: 5px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							disabled="#{!qTDetailBB.managedBean.editable}"
							layout="pageDirection" style="margin-right:5px;">
							<f:selectItem itemLabel="Imported Goods"
								itemValue="Imported Goods" />
						</p:selectManyCheckbox></td>
				</tr>
			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'Budget Approval'}">
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="#{lbl['lbl.sc.qt.typofappreq']}"></p:outputLabel></td>
					<td style="width: 100px; padding-top: 5px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							disabled="#{!qTDetailBB.managedBean.editable}"
							layout="pageDirection" style="margin-top:1px; ">
							<f:selectItem itemLabel="Budget" itemValue="BUD" />
						</p:selectManyCheckbox></td>
				</tr>
			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'ICT Approval'}">
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="#{lbl['lbl.sc.qt.typofappreq']}"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection" style="margin-right:5px;">
							<f:selectItem itemLabel="ICT Project" itemValue="ICT Project" />
						</p:selectManyCheckbox></td>
				</tr>
			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'PTJ Approval'}">
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="#{lbl['lbl.sc.qt.typofappreq']}"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="Publication" itemValue="Publication" />
							<f:selectItem itemLabel="ExtendedProposalPreparationStartDate"
								itemValue="startDate" />
							<f:selectItem itemLabel="ModificationQT"
								itemValue="ModificationQT" />
						</p:selectManyCheckbox></td>
				</tr>
			</ui:fragment>
			<p:spacer height="10px" />
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.status']}"></p:outputLabel></td>
				<td><p:inputText
						value="#{approvalBackingBean.getStatusDescById(approvalCategory.scQtApproval.pmStatus.statusId)}"
						disabled="#{!qTDetailBB.managedBean.editable}" readonly="true"></p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.letterno']}"></p:outputLabel></td>
				<td><p:inputText
						value="#{approvalCategory.scQtApproval.approvalLetterNo}"
						disabled="#{!qTDetailBB.managedBean.editable}"></p:inputText></td>
				<td style="width: 110px; padding-left: 127px"><p:outputLabel
						value="#{lbl['lbl.sc.qt.standarddoc']}"></p:outputLabel></td>
				<td><h:panelGroup>
						<p:commandButton value="#{lbl['lbl.sc.qt.upload']}"
							oncomplete="approvalUpload.show();return false;"
							partialSubmit="true" process="@this" 
							rendered="#{qTDetailBB.managedBean.editable}">
							<!-- <p:graphicImage library="ep/images/design" name="upload.png"
								value="/resources/ep/images/design/upload.png" /> -->
							<f:setPropertyActionListener
								value="#{approvalCategory.scQtApproval}"
								target="#{approvalBackingBean.managedBean.scQtApproval}" />
							<f:setPropertyActionListener value="@(.testClass)"
								target="#{approvalBackingBean.managedBean.uploadUpdateId}" />
						</p:commandButton>

						<p:outputPanel autoUpdate="true">
							<h:outputText styleClass="testClass"
								value="#{scQtApproval.scQtApprovalAttachment.fileName}"></h:outputText>
						</p:outputPanel>

					</h:panelGroup></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Proposal/Working Paper" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 127px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.proworkpaper']}"></p:outputLabel></td>
				<td><h:panelGroup>
						<p:commandButton value="Upload" style="float:left;"
							rendered="#{qTDetailBB.managedBean.editable}" />
					</h:panelGroup></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.qt.remarks']}" /></td>
				<td><p:inputTextarea rows="3" cols="50" autoResize="false"
						value="#{approvalCategory.scQtApproval.requesterRemark}"
						disabled="#{!qTDetailBB.managedBean.editable}" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
