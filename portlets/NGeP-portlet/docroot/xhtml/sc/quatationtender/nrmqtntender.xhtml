<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="suppQualCriOpenPnl"
		header="Supplier Qualification Criteria" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20AlignTop">
			<h:column>
				<ui:include src="categoryList.xhtml" />
			</h:column>
		</h:panelGrid>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.allstate']}" /></td>
				<td><p:selectBooleanCheckbox
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState}"
						disabled="#{!qTDetailBB.managedBean.editable}">
						<p:ajax event="change"
							listener="#{qTSupplierQulCriteriaBackingBean.processChecked}" />
					</p:selectBooleanCheckbox></td>
			</tr>
			<tr>
				<td style="width: 100px"><p:outputLabel
						value="#{lbl['lbl.so.mullocal']}" /></td>
				<td><p:selectOneRadio
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality}"
						style="margin-bottom:5px;"
						disabled="#{!qTDetailBB.managedBean.editable}">
						<f:selectItem itemLabel="yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change"
							listener="#{qTSupplierQulCriteriaBackingBean.multiLocationChange}"
							partialSubmit="true" process="@this" update="multiloc"></p:ajax>
					</p:selectOneRadio></td>
			</tr>
		</table>
	</p:panel>

	<p:outputPanel id="multiloc">
		<p:panel id="zonePanel" header="Location List"
			rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState == true and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality == true}">

			<table style="width: 100%">
				<tr>
					<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locLevels"
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.supplierLocation}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
						</p:selectOneMenu></td>
				</tr>
			</table>

			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneLocationDataTable"
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
					var="zoneTree" style="width:65%">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location">
							<p:treeNode>
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column headerText="Action">
						<p:commandLink
							actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree)}"
							process="@this" update="@([id$=zonePopupPanel])"
							oncomplete="ZoneLocation.show();">
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 65%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
					process="@this" update="@([id$=zonePopupPanel])"
					oncomplete="ZoneLocation.show();"
					actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}"
					icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.so.delete']}"
					icon="ui-icon-delete" />
			</div>

		</p:panel>

		<p:panel id="locationPanel" header="Location List"
			rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState == true and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality == false}">

			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneLocationDataTableId" var="zones"
					style="width:65%">
					<p:column headerText="Location">
					</p:column>
					<p:column headerText="Action">
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</p:panel>

		<p:dialog header="" widgetVar="ZoneLocation" modal="true" width="800"
			height="500">
			<p:panel id="zonePopupPanel" header="ADD LOCATION">
				<table styleClass="noBorders tr,noBorders td">
					<TR>
						<TD width="20%" valign="top"><p:outputLabel value="Zone Name"></p:outputLabel>
						</TD>
						<TD width="80%"><p:inputText
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneName}"></p:inputText>
						</TD>
					</TR>
					<TR>
						<TD width="20%" valign="top"><p:outputLabel
								value="Zone Location" /></TD>
						<TD width="80%"><p:panel></p:panel> <p:tree
								id="treeZoneLocationPopup"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTree}"
								var="location"
								selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
								selectionMode="checkbox">
								<p:treeNode>
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
							</p:tree></TD>
					</TR>
				</table>
			</p:panel>
			<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
				style="float:right;" onclick="ZoneLocation.hide();" process="@all"
				update="@this, zoneLocationDataTable,zonePopupPanel"
				action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocation}">
			</p:commandButton>
				&#160;&#160;
		<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
				style="float:right;" onclick="ZoneLocation.hide();" />
		</p:dialog>
	</p:outputPanel>

	<table style="width: 100%">
		<tr>
			<td style="width: 145px"><p:outputLabel
					value="#{lbl['lbl.so.paidup']}" /></td>
			<td><p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"
					style="margin-right:5pxallstate;"
					disabled="#{!qTDetailBB.managedBean.editable}" /></td>
			<td />
			<td />
		</tr>
		<tr>
			<td style="width: 145px"><p:outputLabel
					value="#{lbl['lbl.so.totalsup']}" /></td>
			<td><p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"
					style="margin-right:5px;"
					disabled="#{!qTDetailBB.managedBean.editable}" /></td>
			<td><p:commandButton value="#{lbl['lbl.so.searchbtn']}"
					icon="ui-icon-search" /></td>
			<td />
		</tr>
	</table>

</ui:composition>
