<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">

		<p:dataTable id="openPnlId" var="cateGory" widgetVar="categoryCodes"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
			rowIndexVar="index" styleClass="openPnlId" rows="10"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" style="width:1%" />

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:20%">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.category.code']}" />
				</f:facet>
				#{cateGory.pmCategoryL1.categoryL1Code}#{cateGory.pmCategoryL2.categoryL2Code}#{cateGory.pmCategoryL3.categoryL3Code}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="width:28%; white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="width:26%; white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="width:25%; white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mandatory']}"
				style="text-align: center;">
				<p:selectBooleanCheckbox value="#{cateGory.mandatory}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, openPnlId" partialSubmit="true" update="@([id$=catCodePopup])"
				oncomplete="catCodePopup.show();"
				action="#{categoryCodeSearchBackingBean.renewSesionObject}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, openPnlId" partialSubmit="true"
				action="#{qTSupplierQulCriteriaBackingBean.deleteCategoryCodes}"
				update="openPnlId" />
		</div>
		
		<ac:categoryCodePopup 
			okAction="#{qTSupplierQulCriteriaBackingBean.addNewCategoryAction}"
			update="@([id$=openPnlId])" />
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}"
		toggleable="true"
		rendered="#{((qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false')  or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal) or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false'))}">
		<table style="width: 100%">
			<tr>
				<td style="width: 100px"><h:panelGroup id="allstate">
						<h:panelGrid border="0" cellpadding="0" cellspacing="0"
							columns="2" columnClasses="columnWidth20"
							style="margin-left: 26px;"
							rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000'}">
							<h:outputLabel value="#{lbl['lbl.so.allstate']}"
								style="width : 80px" />
							<p:selectBooleanCheckbox
								disabled="#{qTSupplierQulCriteriaBackingBean.managedBean.allStateCode eq '3' }"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}">
								<f:selectItem
									itemValue="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}" />
								<p:ajax update="@form"
									listener="#{qTSupplierQulCriteriaBackingBean.stateChange}" />
							</p:selectBooleanCheckbox>
						</h:panelGrid>
					</h:panelGroup></td>
				<td></td>
			</tr>
			<p:outputPanel id="minPaidCapital">
				<ui:fragment
					rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState eq 'true'}">
					<tr>
						<td style="width: 187px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState eq 'true'}" /></td>
						<td><p:inputText size="30" maxlength="18"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState eq 'true'}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
				</ui:fragment>
			</p:outputPanel>
		</table>
	</p:panel>
	<p:panel>
		<h:panelGroup id="supplierallStae">
			<p:panel
				rendered="#{((qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal))}">
				<table style="width: 100%">
					<tr>
						<td style="width: 187px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
					<tr>
						<td style="width: 145px"><p:outputLabel
								value="#{lbl['lbl.sc.spec.zone.location.level']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locLevels"
								label="#{lbl['lbl.sc.spec.zone.location.level']}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width: 178px;">

								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change" update="zoneLocationDataTable"
									listener="#{qTSupplierQulCriteriaBackingBean.selectSupplierLocation}" />
							</p:selectOneMenu> <p:message id="withOutzone" for="locLevels" display="icon" /></td>
					</tr>
				</table>
			</p:panel>
			<p:panel
				rendered="#{((qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and !qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal) or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal))}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneLocationDataTable" rows="10"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column style="width:90%">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.so.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{qTSupplierQulCriteriaBackingBean.selectLocationTreeNode}" />
								<p:ajax event="unselect"
									listener="#{qTSupplierQulCriteriaBackingBean.unSelectLocationTreeNode}" />
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%">
							<p:commandLink
								actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<p:graphicImage library="ep/images/design" name="edit.png"
									value="/resources/ep/images/design/edit.png" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
				</h:panelGrid>
				<div align="right">
					<p:selectBooleanCheckbox id="checkAll" style="float:left;margin-top: 13px;margin-right: -4px;">
						<p:ajax event="change" partialSubmit="true" process="@all" update="zoneLocationDataTable" listener="#{qTSupplierQulCriteriaBackingBean.checkAllConditions}" />
					</p:selectBooleanCheckbox>
					<p:spacer width="1" />
					<h:outputLabel value="#{lbl['lbl.sc.spec.check.all']}" style="float:left;margin-top: 12px;;margin-left: 10px;" />
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						update="@([id$=zonePopupPanel])"
						actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						update="zoneLocationDataTable"
						action="#{qTSupplierQulCriteriaBackingBean.deleteSupplierQualificationTreeNode}" />
				</div>
			</p:panel>

			<p:panel header="#{lbl['lbl.sc.spec.location.list.paidup.capital']}" toggleable="true"
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal}">
				<table style="width: 100%">
					<tr>
						<td style="width: 187px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>

					<tr>
						<td style="width: 94px"><p:outputLabel
								value="#{lbl['lbl.sc.spec.zone.location.level']}" /> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locZoneLevels"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width: 178px;">

								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change" update="zoneyesDataTable"
									listener="#{qTSupplierQulCriteriaBackingBean.selectSupplierLocation}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>

			<p:panel
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneyesDataTable" rows="10"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column style="width:90%">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.so.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{specificationBackingBean.selectZoneTreeNode}" />
								<p:ajax event="unselect"
									listener="#{specificationBackingBean.unSelectZoneTreeNode}" />

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
							</p:tree>
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
							style="width:10%">
							<p:commandLink
								actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<p:graphicImage library="ep/images/design" name="edit.png"
									value="/resources/ep/images/design/edit.png" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						update="@([id$=zonePopupPanel])"
						actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}" />
					<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
						action="#{qTSupplierQulCriteriaBackingBean.deleteSupplierQualificationTreeNode}"
						update="zoneyesDataTable" />
				</div>
			</p:panel>

			<p:dialog header="#{lbl['lbl.sc.spec.zone.add.location']}"
				widgetVar="ZoneLocation" modal="true" width="35%" position="top"
				height="65%">
				<p:panel id="zonePopupPanel">
					<table border="0">
						<TR>
							<TD width="80%">
								<div style="height: 300px; overflow-y: scroll;">
									<p:tree id="treeZoneLocationPopup"
										value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTree}"
										var="location"
										selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
										selectionMode="checkbox">
										<p:treeNode type="state">
											<h:outputText value="#{location.pmState.stateName}" />
										</p:treeNode>
										<p:treeNode type="division">
											<h:outputText value="#{location.pmDivision.divisionName}" />
										</p:treeNode>
										<p:treeNode type="district">
											<h:outputText value="#{location.pmDistrict.districtName}" />
										</p:treeNode>
										<p:treeNode type="city">
											<h:outputText value="#{pmCity.cityName}" />
										</p:treeNode>
									</p:tree>
								</div>
							</TD>
						</TR>
						<tr>
							<td><p:spacer height="2" /></td>
						</tr>
						<tr>
							<td>
								<div class="ppRightBtn">
									<p:commandButton value="#{lbl['lbl.btn.ok']}"
										onclick="ZoneLocation.hide();" process="@all"
										update="@this, zoneLocationDataTable, zonePopupPanel, zoneyesDataTable"
										action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocation}">
									</p:commandButton>
									<p:commandButton value="#{lbl['lbl.btn.cancel']}"
										onclick="ZoneLocation.hide();" />
								</div>
							</td>
						</tr>
					</table>
				</p:panel>
			</p:dialog>
		</h:panelGroup>
	</p:panel>
	<p:panel id="totalSuppliersId"
		header="#{lbl['lbl.sc.spec.supplier.criteria.qual.suppliers']}"
		toggleable="true">
		<table>
			<tr>
				<td style="width: 125px"><p:outputLabel
						value="#{lbl['lbl.so.totalsup']}" /></td>
				<td style="width: 150px"><p:inputText style="margin-right:5px;"
						disabled="true"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSuppliers}" /></td>
				<td><p:commandButton value="#{lbl['lbl.btn.search']}"
						update="totalSuppliersId"
						action="#{qTSupplierQulCriteriaBackingBean.searchForSupplierCount}"
						partialSubmit="true" process="@this" /></td>
				<td />
			</tr>
		</table>
	</p:panel>
</ui:composition>
