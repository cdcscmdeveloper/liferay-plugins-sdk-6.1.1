<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%">
		<tr>
			<td style="width: 110px;" valign="top"><p:outputLabel
					value="Category Code List" /></td>
			<td><ui:include src="categoryList.xhtml" /></td>
		</tr>
		<tr>
			<td style="width: 100px"><p:outputLabel
					value="#{lbl['lbl.so.mullocal']}" /></td>
			<td><p:selectOneRadio
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality}"
					style="margin-bottom:5px;"
					disabled="#{!qTDetailBB.managedBean.editable}">
					<f:selectItem itemLabel="yes" itemValue="true" />
					<f:selectItem itemLabel="No" itemValue="false" />
					<p:ajax event="change"
						listener="#{qTSupplierQulCriteriaBackingBean.multiLocationChange}"
						partialSubmit="true" process="@this"
						update="allstate, supplierlist,stateAll"></p:ajax>
				</p:selectOneRadio></td>
		</tr>
		<tr>
			<td style="width: 100px"><h:panelGroup id="allstate">
					<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="2"
						columnClasses="columnWidth20" style="margin-left: 26px;"
						rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality}">
						<h:outputLabel value="#{lbl['lbl.so.allstate']}"
							style="width : 46px" />
						<p:selectBooleanCheckbox
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState}"
							disabled="#{!qTDetailBB.managedBean.editable}">
							<p:ajax update="stateAll"
								listener="#{qTSupplierQulCriteriaBackingBean.processChecked}" />
						</p:selectBooleanCheckbox>
					</h:panelGrid>
				</h:panelGroup></td>
			<td></td>
		</tr>
	</table>
	<p:panel id="stateAll">
		<p:panel id="zonePanel" header="Location List"
			rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState eq '0' and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality eq true}">
			<table style="width: 100%">
				<tr>
					<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
					<td><p:selectOneMenu id="locLevels"
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.supplierLocation}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
						</p:selectOneMenu></td>
				</tr>
			</table>
			<h:panelGrid width="100%" style="margin-top:20px">
				<p:dataTable id="zoneLocationDataTable"
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
					var="zoneTree" style="width:65%">
					<p:column headerText="Location">
						<p:tree value="#{zoneTree}" var="location">
							<p:treeNode>
								<h:outputText value="#{location.locationName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
					<p:column headerText="Action">
						<p:commandLink
							actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree)}"
							process="@this" update="@([id$=zonePopupPanel])"
							oncomplete="ZoneLocation.show();">
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
			<div align="right" style="width: 65%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
					process="@this" update="@([id$=zonePopupPanel])"
					oncomplete="ZoneLocation.show();"
					actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}"
					icon="ui-icon-add" />
			</div>
		</p:panel>
		<p:dialog header="" widgetVar="ZoneLocation" modal="true" width="800"
			height="500">
			<p:panel id="zonePopupPanel" header="ADD LOCATION">
				<table styleClass="noBorders tr,noBorders td">
					<TR>
						<TD width="20%" valign="top"><p:outputLabel value="Zone Name"></p:outputLabel>
						</TD>
						<TD width="80%"><p:inputText
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneName}"></p:inputText>
						</TD>
					</TR>
					<TR>
						<TD width="20%" valign="top"><p:outputLabel
								value="Zone Location" /></TD>
						<TD width="80%"><p:panel></p:panel> <p:tree
								id="treeZoneLocationPopup"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTree}"
								var="location"
								selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
								selectionMode="checkbox">
								<p:treeNode>
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
							</p:tree></TD>
					</TR>
				</table>
			</p:panel>
			<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
				style="float:right;" onclick="ZoneLocation.hide();" process="@all"
				update="@this, zoneLocationDataTable,zonePopupPanel"
				action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocation}">
			</p:commandButton>
				&#160;&#160;
		<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
				style="float:right;" onclick="ZoneLocation.hide();" />
		</p:dialog>
	</p:panel>
	<table style="width: 100%">
		<tr>
			<td style="width: 108px"><p:outputLabel
					value="#{lbl['lbl.so.paidup']}" /></td>
			<td><p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"
					style="margin-right:5px;"
					disabled="#{!qTDetailBB.managedBean.editable}" /> <h:inputText
					value="MYR" disabled="true" size="1" /></td>
		</tr>
	</table>
	<p:panelGrid columns="1" style="width:100%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			rendered="#{qTDetailBB.managedBean.editable}" icon="ui-icon-search"
			style="float:right;" partialSubmit="true" process="suppQualPnl"
			update="supplierlist"
			action="#{qTSupplierQulCriteriaBackingBean.searchNormalSupplierAction}" />
	</p:panelGrid>

	<br />

	<ui:include src="supplierlist.xhtml" />

	<p:panel header="Delivery Location Details" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 85px"><p:outputLabel value="Required Zone" /></td>
				<td colspan="3"><p:selectOneRadio
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.deliveryReqZone}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
			<p:spacer height="5px" />
			<tr>
				<td style="width: 85px"><p:outputLabel value="Location Type" /></td>
				<td colspan="3"><p:selectOneRadio
						value="#{qTScheduleDetailBackingBean.managedBean.qtCriteria.deliveryLocationType}"
						disabled="#{!qTDetailBB.managedBean.editable}">
						<f:selectItem itemLabel="By Location" itemValue="L" />
						<f:selectItem itemLabel="By Delivery Address" itemValue="D" />
						<p:ajax update="byLoc" />
					</p:selectOneRadio></td>
			</tr>
			<p:spacer height="5px" />
			<tr>
				<td style="width: 85px" valign="top"><p:outputLabel
						value="Location Level" /></td>
				<td valign="baseline"><p:selectOneMenu id="locLevel"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.deliveryLocation}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItems
							value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>
	<p:outputPanel id="byLoc">
		<p:panel id="deliveryLocPanel" header="Delivery Location List "
			rendered="#{qTScheduleDetailBackingBean.managedBean.qtCriteria.deliveryLocationType eq 'L'}">
			<p:dataTable id="deliveryLocDataTable"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTreeList}"
				var="deliveryLocList" style="width:65%">
				<p:column headerText="Location">
					<p:tree value="#{deliveryLocList}" var="loc">
						<p:treeNode>
							<h:outputText value="#{loc.locationName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
				<p:column headerText="Action">
					<p:commandLink
						actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(deliveryLocList)}"
						process="@this" update="@([id$=deliverLocListPopupPanel])"
						oncomplete="deliverLocList.show();">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<div align="right" style="width: 65%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
					process="@this" update="@([id$=deliverLocListPopupPanel])"
					action="#{qTSupplierQulCriteriaBackingBean.showZoneLocationListPopup}"
					partialSubmit="true" icon="ui-icon-add"
					oncomplete="deliverLocList.show();return false;" />
			</div>
		</p:panel>
		<p:panel id="deliveryAddrPanel" header="Delivery Address List "
			rendered="#{qTScheduleDetailBackingBean.managedBean.qtCriteria.deliveryLocationType eq 'D'}">
			<p:dataTable id="deliveryAddrDataTable"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTreeAddrList}"
				var="deliveryAddrList" style="width:65%">
				<p:column headerText="Location">
					<p:tree value="#{deliveryAddrList}" var="addr">
						<p:treeNode>
							<h:outputText value="#{addr.locationName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
				<p:column headerText="Action">
				</p:column>
			</p:dataTable>
			<div align="right" style="width: 65%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
					process="@this" update="@([id$=deliverAddrListPopupPanel])"
					action="#{qTSupplierQulCriteriaBackingBean.showZoneDeliveryAddressListPopup}"
					partialSubmit="true" icon="ui-icon-add"
					oncomplete="deliverAddrList.show();return false;" />
			</div>
		</p:panel>

		<p:dialog id="deliverAddrList" header="" widgetVar="deliverAddrList"
			modal="true" width="800" height="600">
			<p:panel id="deliverAddrListPopupPanel"
				header="ADD DELIVERY LOCATION">
				<table styleClass="noBorders tr,noBorders td">
					<tr>
						<td width="20%" valign="top"><p:outputLabel value="Zone Name" /></td>
						<td width="80%"><p:selectOneMenu id="appAddr"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneAddrName}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality eq true}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select --" itemValue="#{null}" />
								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
									var="zoneName" itemLabel="#{zoneName}" itemValue="#{zoneName}" />
							</p:selectOneMenu> <p:inputText
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneAddrName}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality eq false}" />
						</td>
					</tr>
					<tr>
						<td width="20%" valign="top"><p:outputLabel
								value="Zone Location" /></td>
						<td width="80%"><p:panel></p:panel> <p:tree
								id="treeZoneAddrPopup"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootAddressLocationTreeList}"
								var="deliveryAddr"
								selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedAddrNodes}"
								selectionMode="checkbox">
								<p:treeNode>
									<h:outputText value="#{deliveryAddr.locationName}" />
								</p:treeNode>
							</p:tree></td>
					</tr>
				</table>
			</p:panel>
		</p:dialog>

		<p:dialog id="deliverLocList" header="" widgetVar="deliverLocList"
			modal="true" width="800" height="600">
			<p:panel id="deliverLocListPopupPanel" header="ADD LOCATION">
				<table styleClass="noBorders tr,noBorders td">
					<tr>
						<td width="20%" valign="top"><p:outputLabel value="Zone Name" /></td>
						<td width="80%"><p:selectOneMenu id="app"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneName1}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality eq true}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItem itemLabel="-- Select --" itemValue="#{null}" />
								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
									var="zoneName" itemLabel="#{zoneName}" itemValue="#{zoneName}" />
							</p:selectOneMenu> <p:inputText
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneName1}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality eq false}" />
						</td>
					</tr>
					<tr>
						<td width="20%" valign="top"><p:outputLabel
								value="Zone Location" /></td>
						<td width="80%"><p:panel></p:panel> <p:tree
								id="treeZoneLocPopup"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTreeList}"
								var="deliveryloc"
								selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedLocNodes}"
								selectionMode="checkbox">
								<p:treeNode>
									<h:outputText value="#{deliveryloc.locationName}" />
								</p:treeNode>
							</p:tree></td>
					</tr>
				</table>
			</p:panel>
			<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
				style="float:right;" onclick="deliverLocList.hide();" process="@all"
				update="@this, deliveryLocDataTable,deliverLocListPopupPanel"
				action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocationList}">
			</p:commandButton>
				&#160;&#160;
		<p:commandButton
				value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
				style="float:right;" onclick="deliverLocList.hide();"></p:commandButton>
		</p:dialog>
	</p:outputPanel>
</ui:composition>
