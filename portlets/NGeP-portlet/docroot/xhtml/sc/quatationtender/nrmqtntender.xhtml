<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">
		<p:dataTable id="openPnlId" var="cateGory"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
			style="width:100%" rowIndexVar="index" styleClass="openPnlId"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" style="width:2%"></p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<ac:lov id="openPtj" lovId="PM_CATEGORY_L3"
					headerText="Category Lov"
					saveObject="qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList[#{index}].pmCategoryL3"
					value="#{cateGory.pmCategoryL3.categoryL3Code}"
					update=":form:qtsubId:openPnlId">
				</ac:lov>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mandatory']}">
				<p:selectBooleanCheckbox value="#{cateGory.mandatory}"
					disabled="#{!qTDetailBB.managedBean.editable}" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				partialSubmit="true" update="openPnlId" icon="ui-icon-add"
				actionListener="#{qTSupplierQulCriteriaBackingBean.addNewCategoryAction}" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="openPnlId" />
		</div>
		<ac:lovPopup />
	</p:panel>
	<p:spacer height="1" />

	<p:panel>
		<table style="width: 100%">
			<tr>
				<td style="width: 100px"><h:panelGroup id="allstate">
						<h:panelGrid border="0" cellpadding="0" cellspacing="0"
							columns="2" columnClasses="columnWidth20"
							style="margin-left: 26px;"
							rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000'}">
							<h:outputLabel value="#{lbl['lbl.so.allstate']}"
								style="width: 80px" />

							<p:selectBooleanCheckbox disabled="true"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState}">
								<f:selectItem
									itemValue="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState}" />
								<p:ajax update="supplierallStae"
									listener="#{qTSupplierQulCriteriaBackingBean.stateChange}" />
							</p:selectBooleanCheckbox>
						</h:panelGrid>
					</h:panelGroup></td>
				<td></td>
			</tr>
		</table>
	</p:panel>

	<p:panel>
		<h:panelGroup id="supplierallStae">
			<p:panel
				header="#{lbl['lbl.so.location.list']} / #{lbl['lbl.so.paidup.capital']}"
				rendered="#{((qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal !='false'))}">
				<table style="width: 100%">
					<tr>
						<td style="width: 160px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}" /></td>
						<td><p:inputText
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;" size="30" /></td>
					</tr>
					<tr>
						<td style="width: 94px"><p:outputLabel
								value="#{lbl['lbl.so.location.level']}" /></td>
						<td><p:selectOneMenu id="locLevels"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.locationLevel}"
								style="width: 178px;">
								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
								<p:ajax event="change"
									listener="#{qTSupplierQulCriteriaBackingBean.selectLocation}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>
			<p:panel
				rendered="#{((qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount gt '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal !='false'))}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneLocationDataTable"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column headerText="Location">
							<p:tree value="#{zoneTree}" var="location">
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
							</p:tree>
						</p:column>
						<p:column headerText="Action">
							<p:commandLink
								actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<p:graphicImage library="ep/images/design" name="edit.png"
									value="/resources/ep/images/design/edit.png" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}"
						process="@this" update="@([id$=zonePopupPanel])"
						oncomplete="ZoneLocation.show();"
						actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}"
						icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"
						icon="ui-icon-delete" />
				</div>
			</p:panel>

			<p:panel
				header="#{lbl['lbl.so.location.list']} / #{lbl['lbl.so.paidup.capital']}"
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal !='false'}">
				<table style="width: 100%">
					<tr>
						<td style="width: 160px"><p:outputLabel
								value="#{lbl['lbl.so.paidup']}" /></td>
						<td><p:inputText
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;" size="30" /></td>
					</tr>
					<tr>
						<td style="width: 94px"><p:outputLabel
								value="#{lbl['lbl.so.location.level']}" /></td>
						<td><p:selectOneMenu id="locZoneLevels" disabled="true"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.zoneLocationLevel}"
								style="width: 178px;">

								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
								<p:ajax event="change"
									listener="#{qTSupplierQulCriteriaBackingBean.selectLocation}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>
			<p:panel
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.estimatedAmount le '500000' and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal !='false'}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneyesDataTable"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneGeneralTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">
						<p:column headerText="Location">
							<p:tree value="#{zoneTree}" var="location">

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
							</p:tree>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
			</p:panel>

			<p:dialog header="" widgetVar="ZoneLocation" modal="true" width="800"
				position="top" height="500">
				<p:panel id="zonePopupPanel" header="ADD LOCATION">
					<table styleClass="noBorders tr,noBorders td">
						<tr>
							<td width="80%"><p:panel></p:panel> <p:tree
									id="treeZoneLocationPopup"
									value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTree}"
									var="location"
									selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
									selectionMode="checkbox">
									<p:treeNode type="state">
										<h:outputText value="#{location.pmState.stateName}" />
									</p:treeNode>
									<p:treeNode type="division">
										<h:outputText value="#{location.pmDivision.divisionName}" />
									</p:treeNode>
									<p:treeNode type="district">
										<h:outputText value="#{location.pmDistrict.districtName}" />
									</p:treeNode>
									<p:treeNode type="city">
										<h:outputText value="#{pmCity.cityName}" />
									</p:treeNode>
								</p:tree></td>
						</tr>
					</table>
				</p:panel>
				<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}"
					style="float:right;" onclick="ZoneLocation.hide();" process="@all"
					update="@this, zoneLocationDataTable,zonePopupPanel"
					action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocation}">
				</p:commandButton>
				&#160;&#160;
		<p:commandButton
					value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}"
					style="float:right;" onclick="ZoneLocation.hide();" />
			</p:dialog>
		</h:panelGroup>
	</p:panel>
	<p:panel header="Qualified Supplier" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 117px"><p:outputLabel
						value="#{lbl['lbl.so.totalsup']}" /></td>
				<td style="width: 150px"><p:inputText style="margin-right:5px;"
						disabled="true" /></td>
				<td><p:commandButton value="#{lbl['lbl.so.searchbtn']}"
						icon="ui-icon-search" partialSubmit="true" /></td>
				<td />
			</tr>
		</table>
	</p:panel>
</ui:composition>
