<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
		<p:commandLink value="CategoryCodeList" />
		<p:dataTable id="openPnlId" var="cateGory"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
			style="width:100%" rowIndexVar="index" styleClass="openPnlId">

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<ac:lov id="openPtj" lovId="PM_CATEGORY_L3"
					headerText="Category Lov"
					saveObject="qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList[#{index}].pmCategoryL3"
					value="#{cateGory.pmCategoryL3.categoryL3Code}"
					update=":form:qtsubId:openPnlId">
				</ac:lov>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryL1Code}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryL2Code}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryL3Code}" />
			</p:column>

			<!-- <p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryType}" />
			</p:column> -->

			<p:column headerText="#{lbl['lbl.so.mandatory']}">
				<p:selectBooleanCheckbox value="#{cateGory.mandatory}"
					disabled="#{!qTDetailBB.managedBean.editable}" />
			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				partialSubmit="true" update="openPnlId" icon="ui-icon-add"
				actionListener="#{qTSupplierQulCriteriaBackingBean.addNewCategoryAction}" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="openPnlId" />
		</div>
		<ac:lovPopup />
	</p:panel>

	<p:panel>
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.allstate']}" /></td>
				<td><p:selectBooleanCheckbox
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState}"
						disabled="#{!qTDetailBB.managedBean.editable}">
						<p:ajax event="change"
							listener="#{qTSupplierQulCriteriaBackingBean.processChecked}" />
					</p:selectBooleanCheckbox></td>
			</tr>
			<tr>
				<td style="width: 100px"><p:outputLabel
						value="#{lbl['lbl.so.mullocal']}" /></td>
				<td><p:selectOneRadio
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality}"
						style="margin-bottom:5px;"
						disabled="#{!qTDetailBB.managedBean.editable}">
						<f:selectItem itemLabel="yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update="multiloc" />
					</p:selectOneRadio></td>
			</tr>
		</table>
	</p:panel>

	<p:panel>
		<h:panelGroup id="multiloc">
			<p:panel header="Location List"
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState == true and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality !='No'}">
				<table style="width: 100%">
					<tr>
						<td style="width: 94px"><p:outputLabel value="Location Level" /></td>
						<td><p:selectOneMenu id="locLevels"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.supplierLocation}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(ParameterTypeConst.zoneLocationLevel)}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>

			<p:panel
				rendered="#{((qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState=='true' and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality !='No') or (qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.allState=='true'  and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality =='No'))}">
				<h:panelGrid width="100%" style="margin-top:20px">
					<p:dataTable id="zoneLocationDataTable"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:65%">
						<p:column headerText="Location">
							<p:tree value="#{zoneTree}" var="location">
								<p:treeNode>
									<h:outputText value="#{location.locationName}" />
								</p:treeNode>
							</p:tree>
						</p:column>
						<p:column headerText="Action">
							<p:commandLink
								actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<p:graphicImage library="ep/images/design" name="edit.png"
									value="/resources/ep/images/design/edit.png" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
			</p:panel>
		</h:panelGroup>
	</p:panel>

	<table style="width: 100%">
		<tr>
			<td style="width: 160px"><p:outputLabel
					value="#{lbl['lbl.so.paidup']}" /></td>
			<td><p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"
					style="margin-right:5pxallstate;"
					disabled="#{!qTDetailBB.managedBean.editable}" /></td>
			<td />
			<td />
		</tr>
		<tr>
			<td style="width: 145px"><p:outputLabel
					value="#{lbl['lbl.so.totalsup']}" /></td>
			<td><p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"
					style="margin-right:5px;"
					disabled="#{!qTDetailBB.managedBean.editable}" /></td>
			<td><p:commandButton value="#{lbl['lbl.so.searchbtn']}"
					icon="ui-icon-search" /></td>
			<td />
		</tr>
	</table>
</ui:composition>
