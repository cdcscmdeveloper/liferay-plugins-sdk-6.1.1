<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="sitevisitdlg2Id" widgetVar="dlg2" position="top"
		dynamic="true" resizable="false" width="700px" height="300"
		styleClass="pop_up_top" header="Site/Visit Details">
		<p:panel toggleable="true" styleClass="qtSiteBriefDetails">
			<p:messages id="sitemessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<table style="width: 100%" border="0">
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.so.sitevisitdesc']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.bsvDesc}"
							style="margin-top:5px;" size="95" maxlength="50" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.sitevisitdate']}" /></td>
					<td colspan="3"><p:calendar
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.bsvDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.location']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.location}"
							style="margin-top:5px;" size="30" maxlength="450" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add1']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.address1}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 218px;margin-bottom: 5px;"
							id="sitestate"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.state']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.pmState.stateId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="state"
								value="#{qTBriefingSiteVisitBackingBean.managedBean.states}"
								itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
							<p:ajax event="change"
								listener="#{qTBriefingSiteVisitBackingBean.retrievePmDistrictList}"
								update="@(.sitestate)" />
						</p:selectOneMenu> <p:message id="sitestateMsg" for="sitestate" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add2']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.address2}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu styleClass="sitestate"
							style="width: 218px;margin-bottom: 5px;" id="sitedistrict"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.district']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.pmDistrict.districtId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="district"
								value="#{qTBriefingSiteVisitBackingBean.managedBean.districts}"
								itemValue="#{district.districtId}"
								itemLabel="#{district.districtName}" />
							<p:ajax event="change"
								listener="#{qTBriefingSiteVisitBackingBean.retrievePmCityList}"
								update="@(.sitedistrictCity)" />
						</p:selectOneMenu> <p:message id="sitedistrictMsg" for="sitedistrict" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add3']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.address3}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu styleClass="sitedistrictCity"
							style="width: 218px;margin-bottom: 5px;" id="sitecity"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.city']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.pmCity.cityId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="city"
								value="#{qTBriefingSiteVisitBackingBean.managedBean.citys}"
								itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
						</p:selectOneMenu> <p:message id="sitecityMsg" for="sitecity" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add4']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.address4}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="sitepost"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.postcode']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.address.postcode}"
							size="38" maxlength="10" /> <p:message id="sitepostMsg"
							for="sitepost" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.coordinateofficer']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.coordinatingOfficer}"
							size="95" maxlength="50" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.maxattendance']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtSiteBriefing.maxNoOfAttendance}"
							size="30" maxlength="2" /></td>
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					styleClass="apply_button" update="sitevisitdtlid"
					process="@(.qtSiteBriefDetails)" oncomplete="dlg2.hide()"
					icon="ui-icon-check"
					action="#{qTBriefingSiteVisitBackingBean.addToSiteBriefingList}" />
				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					styleClass="apply_button" oncomplete="dlg1.hide()"
					icon="ui-icon-cancel" process="@this" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
