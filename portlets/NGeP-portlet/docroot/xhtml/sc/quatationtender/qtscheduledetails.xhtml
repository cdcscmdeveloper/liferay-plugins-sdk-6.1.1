<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<h:body>

	<!-- <ui:include src="/xhtml/sc/quatationtender/qtntenderheader.xhtml" /> -->
	<p:panel header="Schedule" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20, columnWidth30">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.noticepublish']}" />
			</h:column>
			<h:column>
				<p:calendar
					value="#{qTScheduleDetailBackingBean.managedBean.qt.publishDate}"
					id="noticePublish" showOn="button"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					disabled="#{!qTDetailBB.managedBean.editable}" />
				<h:inputText value="12:00PM" disabled="true" size="06" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.closingdate']}" />
			</h:column>

			<h:column>
				<p:calendar
					value="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}"
					id="closingDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					disabled="#{!qTDetailBB.managedBean.editable}" readonly="true"
					showOn="button" />
				<h:inputText value="12:00PM" disabled="true" size="06" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.publsihperiod']}" escape="false" />
			</h:column>

			<h:column>
				<p:inputText
					value="#{qTScheduleDetailBackingBean.managedBean.qt.qtValidityPeriod}"
					readonly="true" id="publishingperiod" disabled="true"
					style="margin-top:5px;" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.sampleclosingdate']}" />
			</h:column>

			<h:column>
				<p:calendar
					value="#{qTScheduleDetailBackingBean.managedBean.qt.proposalStartDate}"
					id="proposalPreparation" 
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					disabled="#{!qTDetailBB.managedBean.editable}" showOn="button" />
				<h:inputText value="12:00PM" disabled="true" size="06" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.expectloadate']}" />
			</h:column>

			<h:column>
				<p:calendar
					value="#{qTScheduleDetailBackingBean.managedBean.qt.expectedLoaDate}"
					id="loaDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
					disabled="#{!qTDetailBB.managedBean.editable}" showOn="button" />
			</h:column>

		</h:panelGrid>
	</p:panel>
</h:body>
</html>
