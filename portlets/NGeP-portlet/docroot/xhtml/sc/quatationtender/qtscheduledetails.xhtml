<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="Schedule" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.so.noticepublish']}" /></td>
				<td><p:calendar label="#{lbl['lbl.so.noticepublish']}" required="true"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.publishDate}"
						id="noticePublish"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button" />
					<h:inputText value="12:00PM" disabled="true" size="06" />
					<p:message id="noticePublishMsg" for="noticePublish" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.publsihperiod']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.qt.publishPeriod}"
						readonly="true" id="publishingperiod" disabled="true" size="30"
						style="margin-top:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.closingdate']}" /></td>
				<td><p:calendar
						value="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}"
						id="closingDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
						disabled="#{!qTDetailBB.managedBean.editable}" readonly="true"
						showOn="button" /> <h:inputText value="12:00PM" disabled="true"
						size="06" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="* #{lbl['lbl.so.sampleclosingdate']}" /></td>
				<td><p:calendar label="#{lbl['lbl.so.sampleclosingdate']}" required="true"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.proposalStartDate}"
						id="proposalPreparation"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
						disabled="#{!qTDetailBB.managedBean.editable}" showOn="button" />
					<h:inputText value="12:00PM" disabled="true" size="06" />
					<p:message id="proposalPreparationMsg" for="proposalPreparation" display="icon" /></td>
			</tr>
			<tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.so.expectloadate']}" /></td>
				<td><p:calendar
						value="#{qTScheduleDetailBackingBean.managedBean.qt.expectedLoaDate}"
						id="loaDate" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
						disabled="#{!qTDetailBB.managedBean.editable}" showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.proposal.validity']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.qt.qtValidityPeriod}"
						readonly="true" disabled="true" style="margin-top:5px;" size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.so.proposal.validity.until']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.proposalValidityUntil}"
						readonly="true" disabled="true" style="margin-top:5px;" size="30">
						<!-- <f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" /> -->
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>
	<p:spacer height="3" />
	<p:panel id="samplezoneid" header="Sample Submission" toggleable="true"
		rendered="#{qTScheduleDetailBackingBean.managedBean.qt.zonal eq 'true'}">
		<p:dataTable id="sampleid" var="samplesubmissiondtl"
			style="width : 100%" editable="true" rowIndexVar="rowIndex"
			value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmissionList}"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedSubmissionList}"
			styleClass="submissionlist" rowKey="#{samplesubmissiondtl}">

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="Zone/Location">
				<h:outputText value="#{samplesubmissiondtl.tplSpecZoneDtl.zoneName}" />
			</p:column>
			<p:column headerText="Address">
				<h:outputText value="#{samplesubmissiondtl.address.address1}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<div align="right" style="width: 100%;">
			<p:commandButton value="Apply" process="@this" partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.applySampleSubmission}"
				update="samplePopup" icon="ui-icon-add"
				oncomplete="sampledlg.show();" />

		</div>
	</p:panel>
	<p:panel header="Sample Submission" toggleable="true"
		rendered="#{qTScheduleDetailBackingBean.managedBean.qt.zonal ne 'true'}">
		<ui:include
			src="/xhtml/sc/quatationtender/briefingsitevisit/samplesubmission.xhtml" />
	</p:panel>
	<p:spacer height="3" />
	<p:panel header="Contact Person Details" toggleable="true">
		<p:dataTable var="contactpersondetails" id="cpersondetailsid"
			value="#{qTScheduleDetailBackingBean.managedBean.scQtContactPersons}"
			editable="true"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedContactPersons}"
			styleClass="contactdetails" rowKey="#{contactpersondetails}"
			rowIndexVar="rowIndex" rows="10">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="cpersondetailsid" />

			<p:column headerText="#{lbl['lbl.so.name']}">
				<h:outputText value="#{contactpersondetails.name}"
					rendered="#{contactpersondetails.brandNew eq false}" />
				<h:inputText value="#{contactpersondetails.name}" size="50"
					disabled="#{!qTDetailBB.managedBean.editable}"
					rendered="#{contactpersondetails.brandNew eq true}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.phone']}" style="width:15%">
				<h:outputText value="#{contactpersondetails.phoneNo}"
					rendered="#{contactpersondetails.brandNew eq false}" />
				<h:inputText value="#{contactpersondetails.phoneNo}" size="10"
					disabled="#{!qTDetailBB.managedBean.editable}"
					rendered="#{contactpersondetails.brandNew eq true}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.fax']}" style="width:15%">
				<h:outputText value="#{contactpersondetails.faxNo}"
					rendered="#{contactpersondetails.brandNew eq false}" />
				<h:inputText value="#{contactpersondetails.faxNo}" size="10"
					disabled="#{!qTDetailBB.managedBean.editable}"
					rendered="#{contactpersondetails.brandNew eq true}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mail']}" style="width:15%">
				<h:outputText value="#{contactpersondetails.email}"
					rendered="#{contactpersondetails.brandNew eq false}" />
				<h:inputText value="#{contactpersondetails.email}"
					disabled="#{!qTDetailBB.managedBean.editable}"
					rendered="#{contactpersondetails.brandNew eq true}" />
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,cpersondetailsid" partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.addContactPerson}"
				update="cpersondetailsid" icon="ui-icon-add"
				rendered="#{qTDetailBB.managedBean.editable}" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{qTScheduleDetailBackingBean.deleteContactPerson}"
				update="cpersondetailsid"
				rendered="#{qTDetailBB.managedBean.editable}" />
		</div>
	</p:panel>
	<p:spacer height="3" />
	<p:panel header="Desk Officer Admin Assistant" toggleable="true">

		<p:dataTable id="doaaid" var="deskofficeradmin"
			value="#{qTScheduleDetailBackingBean.managedBean.pmuserContactpersonList}"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedpmuserContactpersonList}"
			rowKey="#{deskofficeradmin}" rowIndexVar="rowIndex"
			style="width : 100%;">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="doaaid" />

			<p:column headerText="Name">
				<ui:fragment rendered="#{deskofficeradmin.user.userName !='null'}">
					<h:outputText value="#{deskofficeradmin.user.userName}" />
				</ui:fragment>
				<ui:fragment rendered="#{deskofficeradmin.user.userName =='null'}">
					<p:selectOneMenu value="#{deskofficeradmin.user.userName}">
						<f:selectItem itemLabel="-- Select --" itemValue="#{null}" />
						<f:selectItems
							value="#{qTScheduleDetailBackingBean.managedBean.deskOfficerAdmin}"
							var="appName" itemLabel="#{appName.userName}"
							itemValue="#{appName.userName}" />
					</p:selectOneMenu>
				</ui:fragment>

			</p:column>

		</p:dataTable>
		<div align="right" style="width: 100%;">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.addDeskOfficerAdminAssistant}"
				update="doaaid" icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="doaaid"
				action="#{qTScheduleDetailBackingBean.deleteDeskOfficerAdminAssistant}" />
		</div>
	</p:panel>

	<p:dialog id="samplePopup" header="Sample Submission"
		widgetVar="sampledlg" width="680" height="240">
		<ui:include
			src="/xhtml/sc/quatationtender/briefingsitevisit/samplesubmission.xhtml" />

		<br />
		<div>
			<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
				icon="ui-icon-cancel" style="float:right;"
				oncomplete="sampledlg.hide()" />

			<p:commandButton value="#{lbl['lbl.so.okbtn']}" update="sampleid"
				process="@this, @(.sampleDetails)" style="float:right;"
				partialSubmit="true" oncomplete="sampledlg.hide()"
				icon="ui-icon-check"
				action="#{qTScheduleDetailBackingBean.okSubmission}">
			</p:commandButton>

		</div>
	</p:dialog>
</ui:composition>
