<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.so.schedule']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.noticepublish']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
				<h:panelGroup id="publishId">
					<table>
						<tr>
							<td><p:calendar label="#{lbl['lbl.so.noticepublish']}"
									mindate="#{qTScheduleDetailBackingBean.managedBean.today}"
									value="#{qTScheduleDetailBackingBean.managedBean.qt.publishDate}"
									id="noticePublish" required="true" readonlyInput="true"
									pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
									showOn="button"
									maxdate="#{qTScheduleDetailBackingBean.handleMaximumDate()}">
									<p:ajax event="dateSelect" process="@this"
										listener="#{qTScheduleDetailBackingBean.handlePublishClosingDate()}"
										update="proposalvalidityid, closingDate, publishId" />
								</p:calendar> <h:inputText value="12:00 PM" disabled="true" size="4"
									style="width: 52px;margin-top: 1px;margin-bottom: 0px;" /></td>
							<td><p:message id="noticePublishMsg" for="noticePublish"
									display="icon" /></td>
						</tr>
					</table>
					</h:panelGroup>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.publsihperiod']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.qt.publishPeriod}"
						readonly="true" id="publishingperiod" disabled="true" size="14"
						style="margin-top:5px; text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.closingdate']}" /></td>
				<td><p:inputText id="closingDate"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}"
						readonly="true" disabled="true" style="margin-top:5px" size="14">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText>&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160; <h:inputText value="12:00 PM" disabled="true" size="4"
						style="width: 52px;margin-top: 5px;margin-bottom: 0px;" /></td>
			</tr>
			<c:if
				test="#{qTScheduleDetailBackingBean.managedBean.qt.sampleReq eq 'true'}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.sampleclosingdate']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td>
						<table>
							<tr>
								<td><p:calendar label="#{lbl['lbl.so.sampleclosingdate']}"
										value="#{qTScheduleDetailBackingBean.managedBean.qt.sampleClosingDate}"
										id="sampleclsdate" required="true"
										pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"
										showOn="button" /> <h:inputText value="12:00 PM"
										disabled="true" size="4" style="width: 50px" /></td>
								<td><p:message id="sampledate" for="sampleclsdate"
										display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
			</c:if>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.proposal.validity']}" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.qt.qtValidityPeriod}"
						readonly="true" disabled="true" size="14"
						style="margin-top:5px;text-align:right" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.so.proposal.validity.until']}" /></td>
				<td><p:inputText id="proposalvalidityid"
						value="#{qTScheduleDetailBackingBean.managedBean.proposalValidityUntil}"
						readonly="true" disabled="true" style="margin-top:5px;" size="14">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td style="width: 204px;"><p:outputLabel
						value="#{lbl['lbl.so.expectloadate']}" /></td>
				<td><p:calendar id="loaDate"
						value="#{qTScheduleDetailBackingBean.managedBean.qt.expectedLoaDate}"
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" 
						mindate="#{qTScheduleDetailBackingBean.managedBean.qt.closingDate}"
						readonlyInput="true" showOn="button" /></td>
			</tr>
		</table>
	</p:panel>
	<p:spacer height="2" />
	<c:if
		test="#{qTScheduleDetailBackingBean.managedBean.qt.sampleReq eq 'true'}">
		<p:panel id="samplezoneid" header="#{lbl['lbl.so.sample.submission']}"
			toggleable="true"
			rendered="#{qTScheduleDetailBackingBean.managedBean.qt.zonal eq 'true'}">
			<p:dataTable id="sampleid" var="samplesubmissiondtl" editable="true"
				rowIndexVar="rowIndex" rowKey="#{samplesubmissiondtl}"
				value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmissionList}"
				selection="#{qTScheduleDetailBackingBean.managedBean.selectedSubmissionList}"
				styleClass="submissionlist">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="Zone/Location">
					<h:outputText
						value="#{samplesubmissiondtl.tplSpecZoneDtl.zoneName}" />
				</p:column>
				<p:column headerText="Address">
					<h:outputText value="#{samplesubmissiondtl.address.address1}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.action']}" style="width:10%">
					<p:commandLink
						action="#{qTScheduleDetailBackingBean.editAddress(samplesubmissiondtl,rowIndex)}"
						style="margin-right:20px;" partialSubmit="true" process="@this">
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="Apply" process="@this,sampleid"
					action="#{qTScheduleDetailBackingBean.applyAddessToSelectedZonesAction}"
					update="sampledlg" icon="ui-icon-add"
					oncomplete="sampledlg.show();" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.so.sample.submission']}" toggleable="true"
			rendered="#{qTScheduleDetailBackingBean.managedBean.qt.zonal ne 'true'}">
			<table style="width: 100%">
				<tr>
					<td style="width: 82px;"><p:outputLabel
							value="#{lbl['lbl.so.add1']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:inputText id="sampleaddress1"
							required="#{qTScheduleDetailBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.add1']}"
							value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address1}"
							size="30" maxlength="255" /> <p:message id="sampleaddress1Msg"
							for="sampleaddress1" display="icon" /></td>
					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.so.state']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 218px;margin-bottom: 5px;"
							id="samplestate1"
							required="#{qTScheduleDetailBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.state']}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.pmState.stateId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="state"
								value="#{qTScheduleDetailBackingBean.managedBean.states}"
								itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
							<p:ajax event="change"
								listener="#{qTScheduleDetailBackingBean.retrievePmDistrictList}"
								update="@(.stateDistrict)" />
						</p:selectOneMenu> <p:message id="samplestate1Msg" for="samplestate1" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add2']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address2}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu styleClass="stateDistrict"
							style="width: 218px;margin-bottom: 5px;" id="sampledistrict1"
							required="#{qTScheduleDetailBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.district']}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.pmDistrict.districtId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="district"
								value="#{qTScheduleDetailBackingBean.managedBean.districts}"
								itemValue="#{district.districtId}"
								itemLabel="#{district.districtName}" />
							<p:ajax event="change"
								listener="#{qTScheduleDetailBackingBean.retrievePmCityList}"
								update="@(.districtCity)" />
						</p:selectOneMenu> <p:message id="sampledistrict1Msg" for="sampledistrict1"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add3']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address3}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu styleClass="districtCity"
							style="width: 218px;margin-bottom: 5px;" id="samplecity1"
							required="#{qTScheduleDetailBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.city']}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.pmCity.cityId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="city"
								value="#{qTScheduleDetailBackingBean.managedBean.citys}"
								itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
						</p:selectOneMenu> <p:message id="samplecity1Msg" for="samplecity1" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add4']}" /></td>
					<td><p:inputText
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address4}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="samplepost1"
							required="#{qTScheduleDetailBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.postcode']}"
							value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.postcode}"
							size="38" maxlength="10" /> <p:message id="samplepostpost1Msg"
							for="samplepost1" display="icon" /></td>
				</tr>
			</table>
		</p:panel>
	</c:if>
	<p:spacer height="2" />
	<p:panel header="#{lbl['lbl.so.contact.person']}" toggleable="true">
		<p:dataTable var="contactpersondetails" id="cpersondetailsid"
			value="#{qTScheduleDetailBackingBean.managedBean.scQtContactPersons}"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedContactPersons}"
			styleClass="contactdetails" rowKey="#{contactpersondetails}"
			rowIndexVar="rowIndex" rows="10">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="cpersondetailsid" />

			<p:column headerText="#{lbl['lbl.so.name']}">
				<h:inputText value="#{contactpersondetails.name}"
					style="width: 200px;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.phone']}">
				<h:inputText value="#{contactpersondetails.phoneNo}"
					style="width: 120px;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.fax']}">
				<h:inputText value="#{contactpersondetails.faxNo}"
					style="width: 120px;" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mail']}">
				<h:inputText value="#{contactpersondetails.email}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,cpersondetailsid" partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.addContactPerson}"
				update="cpersondetailsid" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{qTScheduleDetailBackingBean.deleteContactPerson}"
				update="cpersondetailsid" />
		</div>
	</p:panel>
	<p:spacer height="2" />
	<p:panel header="#{lbl['lbl.so.desk.officer.admin']}" toggleable="true">
		<p:dataTable id="doaaid" var="deskofficeradmin"
			value="#{qTScheduleDetailBackingBean.managedBean.pmuserContactpersonList}"
			selection="#{qTScheduleDetailBackingBean.managedBean.selectedpmuserContactpersonList}"
			rowKey="#{deskofficeradmin}" rowIndexVar="rowIndex" rows="10">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="doaaid" />

			<p:column headerText="Name">
				<p:selectOneMenu value="#{deskofficeradmin.user.userId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItems
						value="#{qTScheduleDetailBackingBean.managedBean.deskOfficerAdmin}"
						var="appName" itemLabel="#{appName.userName}"
						itemValue="#{appName.userId}" />
					<p:ajax event="change" update="doaaid"
						listener="#{qTScheduleDetailBackingBean.retrievePmuserName(deskofficeradmin)}" />
				</p:selectOneMenu>
			</p:column>
		</p:dataTable>
		<p:spacer height="1" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this, doaaid" partialSubmit="true"
				action="#{qTScheduleDetailBackingBean.addDeskOfficerAdminAssistant}"
				update="doaaid" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="doaaid"
				action="#{qTScheduleDetailBackingBean.deleteDeskOfficerAdminAssistant}" />
		</div>
	</p:panel>
</ui:composition>
