
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="supplierlist.xhtml" />

	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.search']}"
			icon="ui-icon-search" partialSubmit="true" process="@this"
			action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierPopupAction}"
			update="suppPopup" oncomplete="suppdlg.show();"
			rendered="#{qTDetailBB.managedBean.editable}" />

		<p:commandButton value="#{lbl['lbl.btn.delete']}"
			icon="ui-icon-delete"
			action="#{qTSupplierQulCriteriaBackingBean.deleteRestrictedSupplierList}"
			update="supplierlist" />
	</div>


	<p:dialog id="suppPopup" header="Search Supplier" widgetVar="suppdlg"
		modal="true" width="800" height="600" position="top">
		<ui:include src="restrictedSupplierSearch.xhtml" />

		<br />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" icon="ui-icon-accept"
				action="#{qTSupplierQulCriteriaBackingBean.addRestrictedToSupplierListAction}"
				update="supplierlist" oncomplete="suppdlg.hide()" />

			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				icon="ui-icon-cancel" oncomplete="suppdlg.hide()" />
		</div>
	</p:dialog>
</ui:composition>
