
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20AlignTop">
			<h:column>
				<h:outputLabel value="Category Code List" />
			</h:column>
			<h:column>
				<ui:include src="categoryList.xhtml" />
			</h:column>
		</h:panelGrid>
		
		<br />
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.paidup']}" />
			</h:column>
			<h:column>  
            	<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}" style="margin-right:5px;" disabled="#{!qTDetailBB.managedBean.editable}"/> 
            	<h:inputText value="MYR" disabled="true" size="1" />
          	</h:column>
        </h:panelGrid>
			
		<p:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:commandButton value="#{lbl['lbl.so.searchbtn']}" style="float:right;" icon="ui-icon-search"
				partialSubmit="true"
				process="suppQualPnl"
				update="suppPopup"
				action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierPopupAction}"
				oncomplete="suppdlg.show();" 
				rendered="#{qTDetailBB.managedBean.editable}" />	
		</p:panelGrid>
		
		<br/>
	
	<ui:include src="supplierlist.xhtml" />		

	<p:dialog id="suppPopup" header="Search Supplier" widgetVar="suppdlg" modal="true"  width="800" height="400">
		<ui:include src="restrictedSupplierSearch.xhtml" />

		<br />
		
		<div>
			<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" icon="ui-icon-cancel"  style="float:right;" oncomplete="suppdlg.hide()" />
			<p:commandButton value="#{lbl['lbl.so.okbtn']}" icon="ui-icon-accept"   style="float:right;"
				update="supplierlist"
				action="#{qTSupplierQulCriteriaBackingBean.addRestrictedToSupplierListAction}"  
				oncomplete="suppdlg.hide()" />
		</div>
	</p:dialog>	
</ui:composition>
