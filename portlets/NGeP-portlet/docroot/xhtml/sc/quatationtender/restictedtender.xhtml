
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="supplierlist.xhtml" />
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.search']}"
			partialSubmit="true" process="@this"
			action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierPopupAction}"
			update="suppPopup" oncomplete="suppdlg.show();" />
		<p:commandButton value="#{lbl['lbl.btn.delete']}"
			process="@this, supplierlist" partialSubmit="true"
			oncomplete="restrictedSupplierDeletePopUp.show();"
			update="@([id$=#{restrictedSupplierDeleteId}])" />
	</div>
	<ui:param name="restrictedSupplierDeleteId" value="restrictedSupplierDeleteId" />
	<ac:confirmationPopup id="#{restrictedSupplierDeleteId}"
		widget="restrictedSupplierDeletePopUp"
		okAction="qTSupplierQulCriteriaBackingBean.deleteRestrictedSupplierList"
		width="450" height="200"
		title="#{lbl['lbl.sc.supplier.list']}"
		content="#{lbl['lbl.sc.dialog.confirm.restricted.supplier.dtls']}"
		update="@([id$=supplierlist])" />


	<p:dialog id="suppPopup" header="#{lbl['lbl.sc.qt.search.supplier']}" widgetVar="suppdlg"
		modal="true" width="800" height="450" position="top">
		<p:messages id="supplierSearchMessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" severity="error, info" />
		<ui:include src="restrictedSupplierSearch.xhtml" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" 
				action="#{qTSupplierQulCriteriaBackingBean.addRestrictedToSupplierListAction}"
				update="supplierlist" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}"
				 oncomplete="suppdlg.hide()" />
		</div>
	</p:dialog>
</ui:composition>
