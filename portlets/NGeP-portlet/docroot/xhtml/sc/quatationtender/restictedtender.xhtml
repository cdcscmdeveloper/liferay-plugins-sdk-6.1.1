
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="supplierlist.xhtml" />

	<div align="right">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			icon="ui-icon-search" partialSubmit="true"
			process="@this" update="suppPopup"
			action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierPopupAction}"
			oncomplete="suppdlg.show();"
			rendered="#{qTDetailBB.managedBean.editable}" />

		<p:commandButton value="#{lbl['lbl.so.delete']}" style="float:right;"
			icon="ui-icon-delete"
			action="#{qTSupplierQulCriteriaBackingBean.deleteRestrictedSupplierList}"
			update="supplierlist" />
	</div>


	<p:dialog id="suppPopup" header="Search Supplier" widgetVar="suppdlg"
		modal="true" width="800" height="400">
		<ui:include src="restrictedSupplierSearch.xhtml" />

		<br />

		<div>
			<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
				icon="ui-icon-cancel" style="float:right;"
				oncomplete="suppdlg.hide()" />
			<p:commandButton value="#{lbl['lbl.so.okbtn']}" icon="ui-icon-accept"
				style="float:right;" update="supplierlist"
				action="#{qTSupplierQulCriteriaBackingBean.addRestrictedToSupplierListAction}"
				oncomplete="suppdlg.hide()" />
		</div>
	</p:dialog>
</ui:composition>
