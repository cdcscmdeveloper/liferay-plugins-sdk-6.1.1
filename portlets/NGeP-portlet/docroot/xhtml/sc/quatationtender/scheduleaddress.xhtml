<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="sampledlg" header="Sample Submission123" modal="true"
		dynamic="true" position="top"
		styleClass="pop_up_top sampleSubmitionAddrUpdate"
		style="width:646px;height:218px;" widgetVar="sampledlg"
		resizable="false">
		<c:if test="#{qTScheduleDetailBackingBean.managedBean.qt.zonal}">
			<c:if
				test="#{!empty qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission}">
				<p:panel id="sampleAddressId" toggleable="true">
					<p:messages id="sampleaddressmsg" showDetail="true"
						autoUpdate="true" closable="true" showSummary="false" />
					<table>
						<tr>
							<td style="width: 80px;"><p:outputLabel
									value="#{lbl['lbl.sc.qt.address.one']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td>
								<table>
									<tr>
										<td><p:inputText id="sampleaddress"
												label="#{lbl['lbl.sc.qt.address.one']}"
												required="#{qTScheduleDetailBackingBean.managedBean.required}"
												value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address1}"
												style="margin-top:5px;" size="30" maxlength="255" /></td>
										<td><p:message id="sampleaddressMsg" for="sampleaddress"
												display="icon" /></td>
									</tr>
								</table>
							</td>
							<td style="width: 200px;"><p:outputLabel
									value="#{lbl['lbl.sc.state']}" /> <p:outputLabel value="*"
									styleClass="mandatory" /></td>
							<td>
								<table>
									<tr>
										<td><p:selectOneMenu id="samplestate"
												label="#{lbl['lbl.sc.state']}"
												required="#{qTScheduleDetailBackingBean.managedBean.required}"
												value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmState.stateId}"
												style="width: 218px;margin-bottom: 5px;">
												<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
													itemValue="" />
												<f:selectItems var="state"
													value="#{qTScheduleDetailBackingBean.managedBean.states}"
													itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
												<p:ajax event="change"
													listener="#{qTScheduleDetailBackingBean.retrievePmDivisions}"
													update="sampleDivison, sampledistrict, samplecity, samplepost" />
											</p:selectOneMenu></td>
										<td><p:message id="samplestateMsg" for="samplestate"
												display="icon" /></td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.two']}" /></td>
							<td><p:inputText
									value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address2}"
									size="30" maxlength="255" /></td>
							<td><p:outputLabel value="#{lbl['lbl.sc.division']}" /></td>
							<td><p:selectOneMenu id="sampleDivison"
									value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmDivision.divisionId}"
									style="width: 218px;margin-bottom: 5px;"
									disabled="#{!qTScheduleDetailBackingBean.managedBean.stateCode}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
									<f:selectItems var="divisionList"
										value="#{qTScheduleDetailBackingBean.managedBean.divisionList}"
										itemValue="#{divisionList.divisionId}"
										itemLabel="#{divisionList.divisionName}" />
									<p:ajax event="change"
										listener="#{qTScheduleDetailBackingBean.retrievePmDistrictList}"
										update="sampledistrict" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.three']}" /></td>
							<td><p:inputText
									value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address3}"
									size="30" maxlength="255" /></td>
							<td><p:outputLabel value="#{lbl['lbl.sc.district']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td>
								<table>
									<tr>
										<td><p:selectOneMenu styleClass="samplestateDistrict"
												style="width: 218px;margin-bottom: 5px;" id="sampledistrict"
												required="#{qTScheduleDetailBackingBean.managedBean.required}"
												label="#{lbl['lbl.sc.district']}"
												value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmDistrict.districtId}">
												<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
													itemValue="" />
												<f:selectItems var="district"
													value="#{qTScheduleDetailBackingBean.managedBean.districts}"
													itemValue="#{district.districtId}"
													itemLabel="#{district.districtName}" />
												<p:ajax event="change"
													listener="#{qTScheduleDetailBackingBean.retrievePmCityList}"
													update="@(.districtCity)" />
											</p:selectOneMenu></td>
										<td><p:message id="sampledistrictMsg"
												for="sampledistrict" display="icon" /></td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.qt.address.four']}" /></td>
							<td><p:inputText
									value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.address4}"
									size="30" maxlength="255" /></td>
							<td><p:outputLabel value="#{lbl['lbl.sc.town']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td>
								<table>
									<tr>
										<td><p:selectOneMenu styleClass="districtCity"
												style="width: 218px;margin-bottom: 5px;" id="samplecity"
												required="#{qTScheduleDetailBackingBean.managedBean.required}"
												label="#{lbl['lbl.sc.town']}"
												value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmCity.cityId}">
												<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
													itemValue="" />
												<f:selectItems var="city"
													value="#{qTScheduleDetailBackingBean.managedBean.citys}"
													itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
											</p:selectOneMenu></td>
										<td><p:message id="samplecityMsg" for="samplecity"
												display="icon" /></td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td />
							<td />
							<td><p:outputLabel value="#{lbl['lbl.sc.post.code']}" /> <p:outputLabel
									value="*" styleClass="mandatory" /></td>
							<td>
								<table>
									<tr>
										<td><p:inputText id="samplepost" required="true"
												label="#{lbl['lbl.sc.post.code']}"
												value="#{qTDetailBB.managedBean.scQtSampleSubmission.address.postcode}"
												size="30" maxlength="10" /></td>
										<td><p:message id="samplepostpostMsg" for="samplepost"
												display="icon" /></td>
									</tr>
								</table>
							</td>
						</tr>
					</table>

					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.ok']}"
							process="@this, sampleAddressId"
							action="#{qTScheduleDetailBackingBean.okSubmission}"
							update="@(.sampleSubmitionUpdate)" />
						<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
							action="#{qTScheduleDetailBackingBean.closeSampleAddressPopUp}"
							partialSubmit="true" />

					</div>

				</p:panel>
			</c:if>
		</c:if>
	</p:dialog>
</ui:composition>
