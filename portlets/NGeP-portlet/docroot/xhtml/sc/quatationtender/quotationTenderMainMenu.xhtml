
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<c:choose>
	<c:when test="#{qTDetailBB.managedBean.committeeAppointment}">
		<ui:include src="/xhtml/sc/quatationtender/committeeappointment/qtcommitteeappointment.xhtml" />
	</c:when>
	<c:otherwise>
	<ui:param name="statusId" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId}" />
	<ui:param name="isQTStatusScheduleDocAndAfter" value="#{qTDetailBB.isQTStatusGreaterThanOrEquals(statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
	<ui:param name="isQTStatusBtwScheduleDocAndPendingPublication" value="#{qTDetailBB.isQTStatusInBetween(statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT, QTStatusConst.QT_PENDING_RESCHEDULE_PUBLICATION)}" />
	<ui:param name="isMaintancePendingChklistStatus" value="#{qTDetailBB.isMaintancePendingChklistStatus()}" />
	<ui:param name="isQTStatusSCApprovalAndBefore" value="#{qTDetailBB.isQTStatusLessThanOrEquals(statusId, QTStatusConst.QT_PENDING_SC_COMMITTEE_APPROVAL)}" />
	
	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" valign="top" class="sidemenutd"><p:tabMenu
					styleClass="sidemenu"
					activeIndex="#{qTDetailBB.managedBean.activeIndex}"	>
					<p:menuitem value="#{lbl['lbl.sc.qt.qtn.details']}"
						action="#{qTDetailBB.qtDetailsTabChange(0)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.sc.supplier.qulification.criteria']}"
						action="#{qTDetailBB.qtDetailsTabChange(1)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.sc.qt.committee.appointment']}"
						action="#{qTDetailBB.qtDetailsTabChange(2)}" update="@form"
						process="@form" />	
					<p:menuitem value="#{lbl['lbl.sc.approval']}"
						action="#{qTDetailBB.qtDetailsTabChange(3)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.sc.activities']}"
						action="#{qTDetailBB.qtDetailsTabChange(4)}" update="@form"
						process="@form"
						rendered="#{isQTStatusSCApprovalAndBefore}" />
						
					<p:menuitem value="#{lbl['lbl.sc.qt.briefing.sv']}"
						action="#{qTDetailBB.qtDetailsTabChange(4)}" update="@form"
						process="@form"
						rendered="#{isQTStatusScheduleDocAndAfter}" />
					<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}"
						action="#{qTDetailBB.qtDetailsTabChange(4)}" update="@form"
						process="@form"
						rendered="#{isMaintancePendingChklistStatus}" />
						
					<p:menuitem value="#{lbl['lbl.sc.qt.schedule.contact']}"
						action="#{qTDetailBB.qtDetailsTabChange(5)}" update="@form"
						style="white-space: normal;" process="@form"
						rendered="#{isQTStatusScheduleDocAndAfter}" />
					<p:menuitem value="#{lbl['lbl.sc.qt.documents']}"
						action="#{qTDetailBB.qtDetailsTabChange(5)}" update="@form"
						style="white-space: normal;" process="@form"
						rendered="#{isMaintancePendingChklistStatus}" />
						
					<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}"
						action="#{qTDetailBB.qtDetailsTabChange(6)}" update="@form"
						process="@form"
						rendered="#{isQTStatusScheduleDocAndAfter}" />
					<p:menuitem value="#{lbl['lbl.sc.activities']}"
						action="#{qTDetailBB.qtDetailsTabChange(6)}" update="@form"
						process="@form"
						rendered="#{isMaintancePendingChklistStatus}" />
						
					<p:menuitem value="#{lbl['lbl.sc.qt.documents']}"
						action="#{qTDetailBB.qtDetailsTabChange(7)}" update="@form"
						process="@form"
						rendered="#{isQTStatusScheduleDocAndAfter}" />
					<p:menuitem value="#{lbl['lbl.sc.activities']}"
						action="#{qTDetailBB.qtDetailsTabChange(8)}" update="@form"
						process="@form"
						rendered="#{isQTStatusScheduleDocAndAfter}" />
					<p:menuitem value="#{lbl['lbl.sc.qt.public.approval']}"
						action="#{qTDetailBB.qtDetailsTabChange(9)}" update="@form"
						process="@form"
						rendered="#{isQTStatusBtwScheduleDocAndPendingPublication}" />
				</p:tabMenu></td>
			<td width="80%" valign="top"><h:panelGroup id="menuQTContent">
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '0'}">
						<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderGeneralDetails.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '1'}">
						<ui:include src="/xhtml/sc/quatationtender/supplierQualificationCriteria/supplierQualificationCriteria.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '2'}">
						<ui:include
							src="/xhtml/sc/quatationtender/committeeappointment/qtcommitteeappointment.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '3'}">
						<ui:include src="/xhtml/sc/quatationtender/approval/approvalCheckBox.xhtml" />
					</c:if>
					<c:if test="#{isQTStatusScheduleDocAndAfter}">
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '4'}">
							<ui:include
								src="/xhtml/sc/quatationtender/briefingsitevisit/qtbriefingsitevisitdetails.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '5'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderPublishingDetails.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '6'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderPaymentDeduction.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '7'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderDocuments.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '8'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderActivitiesTracking.xhtml" />
						</c:if>
						<c:if test="#{isQTStatusBtwScheduleDocAndPendingPublication}">
							<c:if test="#{qTDetailBB.managedBean.activeIndex eq '9'}">
								<ui:include
									src="/xhtml/sc/quatationtender/approval/qtpublicationapproval.xhtml" />
							</c:if>
						</c:if>
					</c:if>
					<c:if test="#{isQTStatusSCApprovalAndBefore}">
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '4'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderActivitiesTracking.xhtml" />
					</c:if>
				 </c:if>
				 
				 <c:if test="#{isMaintancePendingChklistStatus}">
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '4'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderPaymentDeduction.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '5'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderDocuments.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '6'}">
							<ui:include src="/xhtml/sc/quatationtender/quotationTenderDetails/quotationTenderActivitiesTracking.xhtml" />
					</c:if>
				 </c:if>
				</h:panelGroup></td>
		</tr>
	</table>
	<ui:include src="/xhtml/sc/quatationtender/uploadPopup.xhtml" />
		
	</c:otherwise>
	</c:choose>
</ui:composition>
