<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="panelCriPG">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			
			<h:column>
				<h:outputLabel  value="#{lbl['lbl.sc.circular.no']}" />
			</h:column>
			<h:column>
				<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.circularNo}"/>
			</h:column>
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.circular.name']}" />
			</h:column>
			<h:column>
				<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.circularName}"/>
			</h:column>
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.item.name']}" />
			</h:column>
			<h:column>
				<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.itemName}"/>
			</h:column>
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.spec.panel.coverage']}"/>
			</h:column>
			<h:column>
				<p:selectOneMenu value="#{qTSupplierQulCriteriaBackingBean.managedBean.circularCoverage}">
					<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.getDropdownCodeValues(PmCodeCatConst.coverage)}" />
		        </p:selectOneMenu>  
			</h:column>
			
			<h:column />
			<h:column>
				<p:commandButton  value="#{lbl['lbl.btn.add']}" 
					styleClass="apply_button" />
			</h:column>
		</h:panelGrid>
	</h:panelGroup>
		
	<p:panelGrid columns="1" style="width:100%;"
		styleClass="noBorders tr,noBorders td">
		<p:commandButton  value="#{lbl['lbl.btn.search']}"
			styleClass="apply_button" 
			style="float:right;"
			update="panelSuppPnl"
			action="#{qTSupplierQulCriteriaBackingBean.searchPanelSupplierAction}" 
			id="panelsupplier" />
	</p:panelGrid>
	
	<p:panel id="panelSuppPnl" header="Supplier List Results" toggleable="true">
		<p:treeTable id="panelSuppTbl" 
			var="supplierNode"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchPanelSuppliersNode}">
            
			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<p:selectBooleanCheckbox value="#{supplierNode.selected}" rendered="#{supplierNode.type == 'zone'}" />
				<h:outputText value="#{supplierNode.object.name}" rendered="#{supplierNode.type == 'zone'}" />
				<h:outputText value="#{supplierNode.object.supplier.supplierName}" rendered="#{supplierNode.type == 'supplier'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofno']}">
				<h:outputText value="#{supplierNode.object.supplier.smMofAccounts[0].mofNo}" rendered="#{supplierNode.type == 'supplier' and false}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}">
				<h:outputText value="#{supplierNode.object.supplier.smMofAccounts[0].expDate}" rendered="#{supplierNode.type == 'supplier'} and false" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				<h:outputText value="Active" rendered="#{supplierNode.type == 'supplier'}" />
			</p:column>
		</p:treeTable>
	
		<br />
		<h:outputText value="#{lbl['lbl.sc.totalsup']}"/>
		<p:spacer width="5" />  
		<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSearchSupplier}" disabled="true"/>
	</p:panel> 
</ui:composition>
