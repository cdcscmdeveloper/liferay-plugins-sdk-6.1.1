<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneBusinessOwner" header="#{lbl['lbl.sc.qt.clone.business.owner']}"
		widgetVar="cloneBusinessOwner" width="950" height="600" position="top"
		styleClass="cloneAddMember">
		<p:panel id="clonepnlid">
			<p:messages id="boclonemessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<p:panel header="#{lbl['lbl.btn.search']}" toggleable="true"
				id="searchpnlid">
				<table width="900px">
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.title']}" /></td>
						<td colspan="3"><p:inputText
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.qtTitle}"
								style="width:650px;" maxlength="100" /></td>
					</tr>
					
					<tr>
						<td style="width:165px;"><p:outputLabel
								value="#{lbl['lbl.sc.qtn.no']}" /></td>
						<td style="width:285px;"><p:inputText style="width:210px;" maxlength="21"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.qtNo}" /></td>
								<td style="width:165px;"><p:outputLabel
								value="#{lbl['lbl.sc.procurement.mode']}" /></td>
						<td style="width:285px;"><p:selectOneMenu style="width: 210px;margin-bottom: 5px;"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.procurementMode}">
								<f:selectItems
									value="#{qTBusinessOwnerBackingBean.getProcurementModeDropdownValues()}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
						<td><p:calendar id="crdateFrm" showOn="button"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromCreatedDate}"
								size="29" readonlyInput="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
								<p:ajax event="dateSelect" update="createdtTo" />
							</p:calendar></td>
							<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
						<td><p:calendar id="createdtTo" showOn="button"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.toCreatedDate}"
								mindate="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromCreatedDate}"
								size="29" readonlyInput="true"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
								<f:attribute name="startDate"
									value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromCreatedDate}" />
								<f:validator validatorId="dateRangeValidator" />
							</p:calendar></td>
					</tr>
					<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
					<td><p:calendar
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromPublishDate}"
							id="pbdateFrom" showOn="button" size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<p:ajax event="dateSelect" update="pbdateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
					<td><p:calendar id="pbdateTo" showOn="button"
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.toPublishDate}"
							mindate="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromPublishDate}"
							size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<f:attribute name="startDate"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromPublishDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
					<td><p:calendar
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromClosingDate}"
							id="cldateFrom" showOn="button" size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<p:ajax event="dateSelect" update="cldateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
					<td><p:calendar id="cldateTo" showOn="button"
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.toClosingDate}"
							mindate="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromClosingDate}"
							size="29" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" style="width:180px;">
							<f:attribute name="startDate"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.fromClosingDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
					<tr>
						<td><p:outputLabel
								value="#{lbl['lbl.sc.status']}" /></td>
						<td><p:selectOneMenu style="width: 210px;margin-bottom: 5px;"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerSearchBean.qtStatus}">
								<f:selectItems
									value="#{qTBusinessOwnerBackingBean.getStatusDropdownValues('SC', 'QT')}" />
							</p:selectOneMenu></td>
						<td />
						<td />
					</tr>
				</table>
				
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						action="#{qTBusinessOwnerBackingBean.cloneSearchBOAction}"
						update="clonesearchboid" process="@parent, searchpnlid" />
					<p:commandButton value="#{lbl['lbl.btn.reset']}"
						action="#{qTBusinessOwnerBackingBean.resetClone}"
						update="searchpnlid" resetValues="true"
						partialSubmit="true" process="@this" />
				</div>
			</p:panel>
			<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
				<p:dataTable id="clonesearchboid"
					value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessOwnerDataModel}"
					selection="#{qTBusinessOwnerBackingBean.managedBean.selectedCloneBusinessTender}"
					rowKey="#{scQt}" selectionMode="single" var="scQt" lazy="true"
					styleClass="cloneResults" rows="10">

					<ac:paginator for="clonesearchboid" />

					<p:ajax event="rowSelect" update=":form:businessownerlistid"
						listener="#{qTBusinessOwnerBackingBean.onRowCloneAction}" />

					<p:column headerText="#{lbl['lbl.sc.qtn.no']}">
						<h:outputText value="#{scQt.qtNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.title']}">
						<h:outputText value="#{scQt.qtTitle}" style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
						<h:outputText
							value="#{qTBusinessOwnerBackingBean.getParameterDesc(scQt.procurementMode)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.created.date']}">
						<h:outputText value="#{scQt.createdDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.published.date']}" style="width:80px;">
						<h:outputText value="#{scQt.publishDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.closing.date']}" style="width:80px;">
						<h:outputText value="#{scQt.closingDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.status']}">
						<h:outputText
							value="#{qTBusinessOwnerBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" />
					</p:column>
				</p:dataTable>
			</p:panel>
			<p:spacer height="3" />
			<p:panel id="cloneCommitteMembers"
				header="#{lbl['lbl.sc.qt.business.owner']}" toggleable="true">
				<p:dataTable id="businessownerlistid"
					value="#{qTBusinessOwnerBackingBean.managedBean.cloneCommitteMemebers}"
					var="member" rowKey="#{member}"
					selection="#{qTBusinessOwnerBackingBean.managedBean.selectedCommitteMemebers}"
					styleClass="cloneResults,cloneCommitteMembers">

					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="#{lbl['lbl.sc.name']}">
						<h:outputText value="#{member.memberName}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.identification.no']}" style="width : 15%; white-space: normal;">
						<h:outputText value="#{member.icPassport}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.designation']}">
						<h:outputText value="#{member.designation}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.email']}">
						<h:outputText
							value="#{member.pmUser.pmAddressTypes[0].pmAddress.email}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.grade']}">
						<h:outputText value="#{member.grade}" />
					</p:column>

					<p:column style="width : 6%;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.pnp']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{lbl[member.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.consolidate']}">
						<h:outputText
							value="#{lbl[member.consolidateValue ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>

				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						action="#{qTBusinessOwnerBackingBean.addCloneCommitteeMembersAction}"
						update="businessownerId" />
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					    onclick="cloneBusinessOwner.hide()" />
				</div>
			</p:panel>
		</p:panel>
	</p:dialog>
</ui:composition>
