<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneBusinessOwner" header="Clone Business Owner"
		widgetVar="cloneBusinessOwner" width="950" height="600" position="top"
		styleClass="cloneAddMember">
		<p:panel header="#{lbl['lbl.so.searchbtn']}" toggleable="true"
			id="searchpnlid">
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.title']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
							size="92" maxlength="100" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.qtntender']}" /></td>
					<td><p:inputText
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
							size="30" maxlength="21" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.procurementmode']}" /></td>
					<td><p:selectOneMenu
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.creatdtfrom']}" /></td>
					<td><p:calendar id="crdateFrm" showOn="button"
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="30" readonlyInput="true">
							<p:ajax event="dateSelect" update="createdtTo" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.creatdtto']}" /></td>
					<td><p:calendar id="createdtTo" showOn="button"
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
							mindate="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="30" readonlyInput="true">
							<f:attribute name="startDate"
								value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.comstatus']}" /></td>
					<td><p:selectOneMenu style="width: 178px;margin-bottom: 5px;"
							value="#{qTBusinessOwnerBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Non-Active" itemValue="2" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					icon="ui-icon-search"
					action="#{qTBusinessOwnerBackingBean.cloneSearchCommitteAction}"
					update="@(.cloneResults)" partialSubmit="true" process="@parent" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{qTBusinessOwnerBackingBean.resetClone}"
					update="searchpnlid" icon="ui-icon-reset" resetValues="true"
					partialSubmit="true" process="@this" />
			</div>
		</p:panel>
		<p:spacer height="3" />
		<p:panel header="#{lbl['lbl.so.qtlist']}" toggleable="true">
			<p:dataTable id="clonesearchCommitte"
				value="#{qTBusinessOwnerBackingBean.managedBean.cloneBusinessTenderList}"
				selection="#{qTBusinessOwnerBackingBean.managedBean.selectedCloneBusinessTender}"
				rowKey="#{scQt}" selectionMode="single" var="scQt"
				styleClass="cloneResults">

				<ac:paginator for="clonesearchCommitte" />

				<p:ajax event="rowSelect" update=":form:businessownerlistid"
					listener="#{qTBusinessOwnerBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">
					<h:outputText value="#{scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.procmode']}">
					<h:outputText
						value="#{qTBusinessOwnerBackingBean.getParameterDesc(scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.crtdt']}">
					<h:outputText value="#{scQt.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.status']}">
					<h:outputText
						value="#{scQt.qtStatus.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:spacer height="3" />
		<p:panel id="cloneCommitteMembers"
			header="#{lbl['lbl.so.business.owner']}" toggleable="true">
			<p:dataTable id="businessownerlistid"
				value="#{qTBusinessOwnerBackingBean.managedBean.cloneCommitteMemebers}"
				var="member" rowKey="#{member.committeeMemberId}"
				selection="#{qTBusinessOwnerBackingBean.managedBean.selectedCommitteMemebers}"
				styleClass="cloneResults,cloneCommitteMembers">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.so.bo.name']}">
					<h:outputText value="#{member.memberName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
					<h:outputText value="#{member.icPassport}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.designation']}">
					<h:outputText value="#{member.designation}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.email']}">
					<h:outputText
						value="#{member.pmUser.pmAddressTypes[0].pmAddress.email}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.grade']}">
					<h:outputText value="#{member.grade}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.pp']}">
					<h:outputText value="#{member.PNP ? 'Yes' : 'No'}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.consolidate']}">
					<h:outputText value="#{member.consolidateValue ? 'Yes' : 'No'}" />
				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					action="#{qTBusinessOwnerBackingBean.addCloneCommitteeMembersAction}"
					oncomplete="cloneBusinessOwner.hide();" update="businessownerId"
					icon="ui-icon-check" />
				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					icon="ui-icon-cancel" onclick="cloneBusinessOwner.hide()" />
			</div>
		</p:panel>

	</p:dialog>
</ui:composition>
