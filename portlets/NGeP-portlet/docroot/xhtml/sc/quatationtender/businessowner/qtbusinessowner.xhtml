<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.so.general.info']}" toggleable="true">
		<table>
			<tr>
				<td style="width: 154px;" valign="top"><p:outputLabel
						value="#{lbl['lbl.so.title']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td colspan="4">
					<table>
						<tr>
							<td><p:inputTextarea id="title" maxlength="1000"
									label="#{lbl['lbl.so.title']}" required="true"
									value="#{qTDetailBB.managedBean.qt.qtTitle}" cols="115"
									rows="2" style=" margin-bottom:5px; width: 100%; " /></td>
							<td><p:message id="titleMsg" for="title" display="icon" /></td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.so.crtdt']}" /></td>
				<td><p:inputText size="30"
						value="#{qTDetailBB.managedBean.qt.createdDate}" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>

	<ui:include src="businessownerdetails.xhtml" />

</ui:composition>
