<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.general.info']}" toggleable="true">
		<ui:param name="readOnly" value="#{qTDetailBB.managedBean.editable}" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 154px;" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.title']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td colspan="4">
					<table>
						<tr>
							<td><p:inputTextarea id="title" maxlength="1000" required="true"
									disabled="#{readOnly}" label="#{lbl['lbl.sc.title']}"
									value="#{qTDetailBB.managedBean.qt.qtTitle}" cols="115"
									rows="3" style="margin-bottom:5px; width: 100%;" /></td>
							<td><p:message id="titleMsg" for="title" display="icon" /></td>
						</tr>
					</table>
				</td>
			</tr>
			<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
			<tr>
				<td style="width: 154px;" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.ptj']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
					<td colspan="4">
						<table>
							<tr>
								<td><ac:lov id="ptjProfAuthId"
										lovId="PM_ORG_PROFILE_AUTH_TYPE"
										headerText="#{lbl['lbl.sc.ptj']}"
										saveObject="qTDetailBB.managedBean.qt.pmOrgProfile"
										value="#{qTDetailBB.managedBean.qt.pmOrgProfile.orgName}"
										size="115" readonly="true" conditionField="recordStatus^1" />
										<ac:lovPopup />
								</td>
								<td><p:message id="ptjselectMsg" for="ptjProfAuthId" display="icon" /></td>
							</tr>
						</table>
					</td>
				</tr>
			</c:if>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.created.date']}" /></td>
				<td><p:inputText size="30"
						value="#{qTDetailBB.managedBean.qt.createdDate}" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>

	<ui:include src="businessownerdetails.xhtml" />

</ui:composition>
