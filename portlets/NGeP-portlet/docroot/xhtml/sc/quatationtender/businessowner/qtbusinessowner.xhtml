<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.general.info']}" toggleable="true">
		<ui:param name="readOnly" value="#{qTDetailBB.managedBean.editable}" />
		<table style="width: 100%;">
			<tr>
				<td style="width: 154px;" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.title']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td colspan="4">
					<table>
						<tr>
							<td><p:inputTextarea id="title" maxlength="1000"
									disabled="#{readOnly}" label="#{lbl['lbl.sc.title']}"
									value="#{qTDetailBB.managedBean.qt.qtTitle}" cols="115"
									rows="2" style="margin-bottom:5px; width: 100%;" /></td>
							<td><p:message id="titleMsg" for="title" display="icon" /></td>
						</tr>
					</table>
				</td>
			</tr>
			<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
			<tr>
				<td style="width: 154px;" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.ptj']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td colspan="4">
					<table>
						<tr>
							<td><p:selectOneMenu id="ptjselect" required="true"
									label="#{lbl['lbl.sc.ptj']}"
									value="#{qTDetailBB.managedBean.qt.pmOrgProfile.orgProfileId}"
									style="width: 400px;margin-bottom: 5px;">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
										itemValue="" />
									<f:selectItems value="#{qTDetailBB.handlePTJName()}"
										var="pmOrgProfile"
										itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
										itemValue="#{pmOrgProfile.orgProfileId}" />
									<p:ajax event="change" partialSubmit="true" process="@this"
										update="orgName"
										listener="#{qTDetailBB.handlePTJNameChanged}" />
								</p:selectOneMenu></td>
							<td><p:message id="ptjselectMsg" for="ptjselect"
									display="icon" /></td>
						</tr>
					</table>
				</td>
			</tr>
			</c:if>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.created.date']}" /></td>
				<td><p:inputText size="30"
						value="#{qTDetailBB.managedBean.qt.createdDate}" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
		</table>
	</p:panel>

	<ui:include src="businessownerdetails.xhtml" />

</ui:composition>
