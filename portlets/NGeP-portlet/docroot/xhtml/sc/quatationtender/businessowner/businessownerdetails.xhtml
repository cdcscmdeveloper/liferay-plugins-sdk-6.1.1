<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.qt.business.owner']}" toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.sc.qt.business.owner']}" />
			<ac:iconTooltip value="#{lbl['lbl.sc.qt.business.owner.tooltip']}" />
		</f:facet>
		<p:dataTable id="businessownerId"
			value="#{qTDetailBB.managedBean.scCommitteeMemberList}"
			var="businessowner" rowIndexVar="index" rowKey="#{businessowner}"
			selection="#{qTDetailBB.managedBean.selectScCommitteMember}">

			<p:ajax event="rowSelectRadio"
				listener="#{qTBusinessOwnerBackingBean.consolidateRowSelectRadio}" />



			<p:column style="width:2%" rendered="#{!readOnly}">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk"
						value="#{qTBusinessOwnerBackingBean.flag}">
						<p:ajax update="businessownerId"
							listener="#{qTBusinessOwnerBackingBean.selectAll}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{businessowner.selected}">
					<p:ajax update="businessownerId"
						listener="#{qTBusinessOwnerBackingBean.getConsolidateSelectAll}" />
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.name']}">
				<h:outputText value="#{businessowner.memberName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.identification.no']}"
				style="width : 15%; white-space: normal;">
				<h:outputText value="#{businessowner.icPassport}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.designation']}"
				style="width : 15%">
				<h:outputText value="#{businessowner.designation}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.email']}" style="width : 15%">
				<h:outputText value="#{businessowner.email}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.grade']}" style="width : 5%">
				<h:outputText value="#{businessowner.grade}" />
			</p:column>
			<p:column style="width : 6%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[businessowner.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.consolidate']}" style="width:10%"
				selectionMode="single">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.consolidate']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.qt.consolidate.tooltip']}" />
				</f:facet>
			</p:column>
		</p:dataTable>
		<div align="right">
			<c:if test="#{!readOnly}">
				<p:commandButton value="#{lbl['lbl.btn.clone']}"
					actionListener="#{qTBusinessOwnerBackingBean.cloneBusinessOwnerPopupAction}"
					oncomplete="cloneBusinessOwner.show();" process="@this"
					update="@(.cloneAddMember)"
					rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}" />

				<p:commandButton id="businessowneradd" value="#{lbl['lbl.btn.add']}"
					process="@this"
					action="#{qTBusinessOwnerBackingBean.addBusinessOwner}"
					oncomplete="newbusinessowner.show();" update="@(.qtAddMember)"
					rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}" />

				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					process="@this, businessownerId" partialSubmit="true"
					oncomplete="businessOwnerDeletePopUp.show();"
					update="@([id$=#{businessOwnerDeleteId}])"
					rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}" />
			</c:if>
		</div>
		<ui:param name="businessOwnerDeleteId" value="businessOwnerDeleteId" />
		<ac:confirmationPopup id="#{businessOwnerDeleteId}"
			widget="businessOwnerDeletePopUp"
			okAction="qTBusinessOwnerBackingBean.deleteBusinessOwner" width="450"
			height="200" title="#{lbl['lbl.sc.qt.business.owner']}"
			content="#{lbl['lbl.sc.dialog.confirm.business.owner.dtls']}"
			update="@([id$=businessownerId])" />
	</p:panel>
	<p:panel toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="3"
			columnClasses="columnWidth10" style="margin-left: 26px;">
			<p:outputLabel value="*" styleClass="mandatory" />
			<h:outputLabel value="#{lbl['lbl.sc.qt.req.approval.specification']}" />

			<p:selectOneRadio required="true"
				value="#{qTDetailBB.managedBean.qt.specApprovalReq}"
				disabled="#{readOnly}"
				label="#{lbl['lbl.sc.qt.req.approval.specification']}">
				<f:selectItems
					value="#{qTBusinessOwnerBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />

				<p:ajax event="change" process="@this" update="@this,approvalSpec" />

			</p:selectOneRadio>


		</h:panelGrid>

		<h:panelGroup id="approvalSpec">
			<h:panelGrid
				rendered="#{qTDetailBB.managedBean.qt.specApprovalReq ne null and qTDetailBB.managedBean.qt.specApprovalReq ne '0'}"
				border="0" cellpadding="0" cellspacing="0" columns="3"
				 >
				<p:outputLabel value="*" styleClass="mandatory" style="width:191px;" valign="top"/>
				<p:outputLabel value="#{lbl['lbl.sc.ministry.spec.secretary']}" />
				<p:selectOneMenu id="ministryspec" disabled="#{readOnly}"
					label="#{lbl['lbl.sc.ministry.spec.secretary']}" required="true"
					value="#{qTDetailBB.managedBean.qt.ministrySpecSecrataryId.userId}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems
						value="#{qTBusinessOwnerBackingBean.managedBean.comitteeUserName}"
						var="appName" itemLabel="#{appName.userName}"
						itemValue="#{appName.userId}" />
				</p:selectOneMenu>

			</h:panelGrid>
		</h:panelGroup>
	</p:panel>
</ui:composition>
