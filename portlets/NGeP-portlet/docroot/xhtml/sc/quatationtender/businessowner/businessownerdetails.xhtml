<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.so.business.owner']}" toggleable="true">
		<p:dataTable id="businessownerId"
			value="#{qTBusinessOwnerBackingBean.managedBean.scCommitteeMemberList}"
			var="businessowner" rowIndexVar="index" editable="true"
			rowKey="#{businessowner}"
			selection="#{qTBusinessOwnerBackingBean.managedBean.selectScCommitteMember}">

			<ac:paginator for="businessownerId" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.so.bo.name']}">
				<h:outputText value="#{businessowner.memberName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.identification.no']}"
				style="width : 15%">
				<h:outputText value="#{businessowner.icPassport}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.designation']}"
				style="width : 15%">
				<h:outputText value="#{businessowner.designation}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.email']}" style="width : 15%">
				<h:outputText value="#{businessowner.email}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.grade']}" style="width : 5%">
				<h:outputText value="#{businessowner.grade}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="width : 6%">
				<h:outputText value="#{businessowner.PNP ? 'Yes' : 'No'}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.consolidate']}"
				style="width : 10%">
				<p:selectOneRadio value="#{businessowner.consolidateValue}">
					<f:selectItem itemValue="true" itemLabel="" />
				</p:selectOneRadio>
			</p:column>

		</p:dataTable>
		<p:spacer height="5px" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.clonebtn']}"
				onclick="cloneBusinessOwner.show();" process="@this"
				icon="ui-icon-clone" />

			<p:commandButton id="businessowneradd"
				value="#{lbl['lbl.so.addbtn']}" process="@this"
				action="#{qTBusinessOwnerBackingBean.addBusinessOwner}"
				oncomplete="newbusinessowner.show();" update="@(.qtAddMember)"
				icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{qTBusinessOwnerBackingBean.deleteBusinessOwner}"
				update="businessownerId" />
		</div>
		<br />
	</p:panel>
	<p:spacer height="5px" />
	<p:panel header="Specification Approval" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="2"
			columnClasses="columnWidth20" style="margin-left: 26px;">
			<p:selectBooleanCheckbox
				value="#{qTBusinessOwnerBackingBean.managedBean.qt.specApprovalReq}">
				<p:ajax update="approvalSpec"
					listener="#{qTBusinessOwnerBackingBean.processChecked}" />
			</p:selectBooleanCheckbox>
			<h:outputLabel value="#{lbl['lbl.so.req.approval.specification']}" />
		</h:panelGrid>
		<p:spacer height="5px" />

		<h:panelGroup id="approvalSpec">
			<p:panel
				rendered="#{qTBusinessOwnerBackingBean.managedBean.qt.specApprovalReq ne '0'}">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="2"
					columnClasses="columnWidth20">
					<h:column>
						<h:outputLabel value="#{lbl['lbl.so.ministry.spec.secretary']}" />
					</h:column>
					<h:column>
						<p:selectOneMenu
							value="#{qTBusinessOwnerBackingBean.managedBean.qt.ministrySpecSecrataryId.userId}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItem itemLabel="-- Select --" itemValue="#{null}" />
							<f:selectItems
								value="#{qTBusinessOwnerBackingBean.managedBean.comitteeUserName}"
								var="appName" itemLabel="#{appName.userName}"
								itemValue="#{appName.userId}" />
						</p:selectOneMenu>
					</h:column>
				</h:panelGrid>
			</p:panel>
		</h:panelGroup>
	</p:panel>
</ui:composition>
