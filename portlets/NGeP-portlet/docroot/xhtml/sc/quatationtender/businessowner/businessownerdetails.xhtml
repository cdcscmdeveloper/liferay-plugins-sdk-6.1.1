<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.so.business.owner']}" toggleable="true">
		<f:facet name="header">
			<h:outputText value="* " styleClass="mandatory" />
			<h:outputText value="#{lbl['lbl.so.business.owner']}" />
		</f:facet>
		<p:dataTable id="businessownerId"
			value="#{qTDetailBB.managedBean.scCommitteeMemberList}"
			var="businessowner" rowIndexVar="index" rowKey="#{businessowner}"
			selection="#{qTDetailBB.managedBean.selectScCommitteMember}">

			<p:ajax event="rowSelectRadio"
				listener="#{qTBusinessOwnerBackingBean.consolidateRowSelectRadio}" />

			<ac:paginator for="businessownerId" />

			<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selAllChk"
						value="#{qTBusinessOwnerBackingBean.flag}">
						<p:ajax  update="businessownerId" listener="#{qTBusinessOwnerBackingBean.selectAll}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{businessowner.selected}">
					<p:ajax update="businessownerId" listener="#{qTBusinessOwnerBackingBean.getConsolidateSelectAll}"/>
				</p:selectBooleanCheckbox>
			</p:column>

			<p:column headerText="#{lbl['lbl.so.bo.name']}">
				<h:outputText value="#{businessowner.memberName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.identification.no']}"
				style="width : 15%">
				<h:outputText value="#{businessowner.icPassport}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.designation']}"
				style="width : 15%">
				<h:outputText value="#{businessowner.designation}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.email']}" style="width : 15%">
				<h:outputText value="#{businessowner.email}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.grade']}" style="width : 5%">
				<h:outputText value="#{businessowner.grade}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="width : 6%">
				<h:outputText value="#{lbl[businessowner.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.bo.consolidate']}"
				style="width:10%" selectionMode="single">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.so.bo.consolidate']}" />
				</f:facet>
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.clone']}"
				actionListener="#{qTBusinessOwnerBackingBean.cloneBusinessOwnerPopupAction}"
				oncomplete="cloneBusinessOwner.show();" process="@this"
				icon="ui-icon-clone" update="@(.cloneAddMember)"
				rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}" />

			<p:commandButton id="businessowneradd"
				value="#{lbl['lbl.btn.add']}" process="@this"
				action="#{qTBusinessOwnerBackingBean.addBusinessOwner}"
				oncomplete="newbusinessowner.show();" update="@(.qtAddMember)"
				icon="ui-icon-add"
				rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}" />

			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				icon="ui-icon-delete"
				action="#{qTBusinessOwnerBackingBean.deleteBusinessOwner}"
				update="businessownerId"
				rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}" />
		</div>
	</p:panel>
	<p:panel header="Specification Approval" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="2"
			columnClasses="columnWidth10" style="margin-left: 26px;">
			<p:selectBooleanCheckbox
				value="#{qTDetailBB.managedBean.qt.specApprovalReq}">
				<p:ajax update="approvalSpec"
					listener="#{qTBusinessOwnerBackingBean.processChecked}" />
			</p:selectBooleanCheckbox>
			<h:outputLabel value="#{lbl['lbl.so.req.approval.specification']}" />
		</h:panelGrid>

		<h:panelGroup id="approvalSpec">
			<p:panel
				rendered="#{qTDetailBB.managedBean.qt.specApprovalReq ne '0'}">
				<h:panelGrid columns="3" styleClass="noBorders tr,noBorders td">
					<p:outputLabel value="*" styleClass="mandatory" />
					<h:outputLabel value="#{lbl['lbl.so.ministry.spec.secretary']}" />

					<p:selectOneMenu id="ministryspec"
						label="#{lbl['lbl.so.ministry.spec.secretary']}" required="true"
						value="#{qTDetailBB.managedBean.qt.ministrySpecSecrataryId.userId}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{qTBusinessOwnerBackingBean.managedBean.comitteeUserName}"
							var="appName" itemLabel="#{appName.userName}"
							itemValue="#{appName.userId}" />
					</p:selectOneMenu>
					<p:message id="ministryspecMsg" for="ministryspec" display="icon" />
				</h:panelGrid>
			</p:panel>
		</h:panelGroup>
	</p:panel>
</ui:composition>
