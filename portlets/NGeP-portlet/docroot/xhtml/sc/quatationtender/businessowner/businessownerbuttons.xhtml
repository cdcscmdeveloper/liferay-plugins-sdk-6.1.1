<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>


		<div align="right">
			<p:commandButton immediate="true" value="#{lbl['lbl.sc.notice.board.backbtn']}"
				icon="ui-icon-back"
				action="#{qTBusinessOwnerBackingBean.gotoQtSearchPage}"
				style="float:left;" />
			<c:if
				test="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}">
				<p:commandButton value="#{lbl['lbl.so.save']}"
					action="#{qTBusinessOwnerBackingBean.saveBusinessOwnerAction}"
					process="@all" icon="ui-icon-save" update="@all" />
				
				<p:commandButton value="#{lbl['lbl.so.submit']}"
					action="#{qTBusinessOwnerBackingBean.submitBusinessOwnerAction}"
					rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_APPOINT_BO}"
					process="@all" icon="ui-icon-submit" update="@all" />

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					action="#{qTBusinessOwnerBackingBean.cancelQTDetails}"
					process="@all" style="float:right;margin-right: 12px;"
					icon="ui-icon-cancel" update="@form"
					rendered="#{!qTDetailBB.managedBean.qt.brandNew}" />
			</c:if>

		</div>

	</p:panel>
</ui:composition>
