<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table style="width:100%">
	<tr>
		<td style="vertical-align: bottom;" align="right"><p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
					style="float:right;"
					action="#{dpTrackingDiaryBackingBean.goToTrackingDiarySearch(qTDetailBB.managedBean.scTdObj)}"
					immediate="true" rendered="#{qTDetailBB.managedBean.maintanceFlow and qTDetailBB.managedBean.viewQtDetails}"/></td>
		</tr>
	<tr>
		<td align="right">
			<p:commandButton immediate="true"
				value="#{lbl['lbl.btn.back']}"
				action="#{qTDetailBB.gotoQtSearchPage}" 
				partialSubmit="true"
				process="@this"
				update="@this"
				style="float:left;"
				rendered="#{!qTDetailBB.managedBean.qt.brandNew}" />
			<c:if
				test="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}">
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					action="#{qTBusinessOwnerBackingBean.saveBusinessOwnerAction}"
					process="@form" update="@form" 
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{qTBusinessOwnerBackingBean.submitBusinessOwnerAction}"
					rendered="#{qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_APPOINT_BO}"
					process="@form" update="@form" 
					onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />

				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@all"
					style="float:right;margin-right: 12px;" 
					rendered="#{!qTDetailBB.managedBean.qt.brandNew}"
					onclick="cancelBODlg.show()" />
				
				</c:if>
				<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
						style="float:right;"
						action="#{dpTrackingDiaryBackingBean.goToTrackingDiarySearch(qTDetailBB.managedBean.scTdObj)}"
						immediate="true"
						rendered="#{qTDetailBB.managedBean.maintanceFlow and !qTDetailBB.managedBean.viewQtDetails}" />
		</td>
	</tr>
	</table>
	
		<p:dialog id="cancelBODlg" widgetVar="cancelBODlg"
			header="#{lbl['lbl.sc.cancel.confirm']}" resizable="false" width="30%"
			height="100" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.sc.dialog.cancel.message']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					oncomplete="cancelBODlg.hide();"
					action="#{qTBusinessOwnerBackingBean.cancelQTDetails}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					onclick="cancelBODlg.hide();" type="button" />
			</div>
		</p:dialog>
</ui:composition>
