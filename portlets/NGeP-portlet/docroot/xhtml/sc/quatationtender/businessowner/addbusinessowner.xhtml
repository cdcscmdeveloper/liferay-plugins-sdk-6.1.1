<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newbusinessownerid"
		header="#{lbl['lbl.sc.qt.new.bussiness.owner']}" width="950"
		height="600" widgetVar="newbusinessowner" modal="true" position="top">
		<h:panelGroup id="bopanel" styleClass="qtAddMember">
			<p:messages id="bomessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" severity="error, info" />
			<p:panel id="usersearchpnlids" header="#{lbl['lbl.sc.search']}"
				toggleable="true">
				<table style="width: 100%;">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /></td>
						<td colspan="3"><p:inputText
								value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.name}"
								size="64" /></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.id.type']}" /></td>
						<td colspan="3"><p:selectOneMenu id="appaction"
								value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.identificationType}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItems
									value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
							</p:selectOneMenu></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" /></td>
						<td colspan="3"><p:inputText id="Idno"
								value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.identificationNo}"
								size="30" /></td>
					</tr>
				</table>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						action="#{qTBusinessOwnerBackingBean.searchUserAction}"
						update="existingsearch" process="@this, usersearchpnlids" />
					<p:commandButton value="#{lbl['lbl.btn.reset']}"
						action="#{qTBusinessOwnerBackingBean.reset}"
						update="@([id$=usersearchpnlids])" resetValues="true"
						partialSubmit="true" process="@this" />
				</div>
			</p:panel>
			<p:panel id="resultId" header="#{lbl['lbl.sc.search.result']}"
				toggleable="true">
				<p:dataTable id="existingsearch"
					value="#{qTBusinessOwnerBackingBean.managedBean.userSearchBusinessOwnerDataModel}"
					selection="#{qTBusinessOwnerBackingBean.managedBean.selectedPmUser}"
					rowKey="#{existuser.userId}" var="existuser" lazy="true"
					styleClass="existingResults" style="width : 100%;" rows="10">

					<ac:paginator for="existingsearch" />

					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="#{lbl['lbl.sc.name']}" style="width : 20%">
						<h:outputText value="#{existuser.userName}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.identification.no']}"
						style="width : 15%; white-space: normal;">
						<h:outputText value="#{existuser.identificationNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.designation']}"
						style="width : 15%">
						<h:outputText value="#{existuser.designation}"
							style="white-space: normal;" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.grade']}" style="width : 5%">
						<h:outputText value="#{existuser.grade}" />
					</p:column>

					<p:column style="width : 6%;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.pnp']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
						</f:facet>
						<h:outputText
							value="#{lbl[existuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.email']}" style="width : 15%">
						<h:outputText value="#{existuser.email}"
							style="white-space: normal;" />
					</p:column>

				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						styleClass="BtnSpacing" partialSubmit="true"
						process="@this, bopanel"
						action="#{qTBusinessOwnerBackingBean.okBusinessOwnerAction}"
						update="businessownerId, bopanel" />

					<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
						oncomplete="newbusinessowner.hide();" styleClass="BtnSpacing" />
				</div>
			</p:panel>
		</h:panelGroup>
	</p:dialog>
</ui:composition>
