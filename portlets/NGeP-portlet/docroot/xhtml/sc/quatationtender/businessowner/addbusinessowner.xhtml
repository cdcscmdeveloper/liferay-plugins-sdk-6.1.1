<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newbusinessownerid" header="#{lbl['lbl.sc.qt.new.bussiness.owner']}"
		width="950" height="600" widgetVar="newbusinessowner" modal="true"
		position="top">
		<p:panel toggleable="true" styleClass="qtAddMember" id="bopanel">
			<p:messages id="bomessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			
			<p:panel id="newProfile">
				<c:if
					test="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel id="usersearchpnlids" header="#{lbl['lbl.sc.search']}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.id.type']}" /></td>
								<td><p:selectOneMenu id="appaction"
										value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" /></td>
								<td><p:inputText id="Idno"
										value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.identificationNo}"
										size="30" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							action="#{qTBusinessOwnerBackingBean.searchUserAction}"
							update="existingsearch"
							process="@this, usersearchpnlids" />
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							action="#{qTBusinessOwnerBackingBean.reset}"
							update="usersearchpnlids"  resetValues="true"
							partialSubmit="true" process="@this" />
					</div>

					<p:panel header="#{lbl['lbl.sc.search.result']}"
						toggleable="true">
						<p:dataTable id="existingsearch"
							value="#{qTBusinessOwnerBackingBean.managedBean.userSearchBusinessOwnerDataModel}"
							selection="#{qTBusinessOwnerBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existuser.userId}" var="existuser" lazy="true"
							styleClass="existingResults" style="width : 100%;" rows="10">

							<ac:paginator for="existingsearch" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.sc.name']}"
								style="width : 20%">
								<h:outputText value="#{existuser.userName}" style="white-space: normal;" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.identification.no']}"
								style="width : 15%; white-space: normal;">
								<h:outputText value="#{existuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.designation']}"
								style="width : 15%">
								<h:outputText value="#{existuser.designation}" style="white-space: normal;" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.grade']}"
								style="width : 5%">
								<h:outputText value="#{existuser.grade}" />
							</p:column>

							<p:column style="width : 6%;">
								<f:facet name="header">
									<h:outputText value="#{lbl['lbl.sc.pnp']}" />
									<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
								</f:facet>
								<h:outputText
									value="#{lbl[existuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.email']}"
								style="width : 15%">
								<h:outputText
									value="#{existuser.email}" style="white-space: normal;" />
							</p:column>

						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="New user" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.name']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="name" required="true"
										label="#{lbl['lbl.sc.name']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.memberName}"
										size="30" maxlength="50" /> <p:message id="nameMsg"
										for="name" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.id.type']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneMenu id="idtype" required="true"
										label="#{lbl['lbl.sc.id.type']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu> <p:message id="idtypeMsg" for="idtype" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td style="width: 142px;"><p:outputLabel
										value="#{lbl['lbl.sc.identification.no']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="idNos" required="true"
										label="#{lbl['lbl.sc.identification.no']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.icPassport}"
										size="30" maxlength="15" /> <p:message id="idNosMsg"
										for="idNos" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.grade']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="grade" required="true"
										label="#{lbl['lbl.sc.grade']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.grade}"
										size="30" maxlength="10" /> <p:message id="gradeMsg"
										for="grade" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.pnp']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneRadio id="pnp" required="true"
										label="#{lbl['lbl.sc.pnp']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio> <p:message id="pnpMsg" for="pnp" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.designation']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="designation" required="true"
										label="#{lbl['lbl.sc.designation']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.designation}"
										size="30" maxlength="50" /> <p:message id="designationMsg"
										for="designation" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.email']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="email" required="true"
										label="#{lbl['lbl.sc.email']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.email}"
										size="30" maxlength="80" /> <p:message id="emailMsg"
										for="email" display="icon" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					process="@this, newProfile, bopanel"
					action="#{qTBusinessOwnerBackingBean.okBusinessOwnerAction}"
					ajax="true" update="businessownerId, bopanel" />

				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
					oncomplete="newbusinessowner.hide();" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
