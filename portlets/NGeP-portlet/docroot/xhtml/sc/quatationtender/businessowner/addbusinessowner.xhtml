<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newbusinessownerid" header="#{lbl['lbl.so.bo.new']}"
		widgetVar="newbusinessowner" modal="true" position="top">
		<p:panel toggleable="true" styleClass="qtAddMember">
			<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="#{lbl['lbl.sc.committe.addscreen.selection']}" />
				<p:selectOneRadio
					value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{qTBusinessOwnerBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{qTBusinessOwnerBackingBean.userSelcetionAction}"
						update="newProfile"></p:ajax>
				</p:selectOneRadio>
			</h:panelGrid>
			<p:spacer height="5" />

			<p:panel id="newProfile" style="width:100%;margin-top:10px;">
				<c:if
					test="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel header="Search" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td><p:selectOneMenu id="appaction"
										value="#{qTBusinessOwnerBackingBean.managedBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td><p:inputText id="Idno"
										value="#{qTBusinessOwnerBackingBean.managedBean.identificationNo}"
										size="30" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
					<p:commandButton value="#{lbl['lbl.so.reset']}"
						style="float:right;" action="#{qTBusinessOwnerBackingBean.reset}"
						update="newProfile" icon="ui-icon-reset" resetValues="true"
						partialSubmit="true" process="@this" />

					<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
						style="float:right;" icon="ui-icon-search"
						action="#{qTBusinessOwnerBackingBean.existingBusinessOwnerAction}"
						update="@(.existingResults)" partialSubmit="true"
						process="@parent" />

					<br />
					<br />
					<p:spacer height="5" />
					<p:panel header="#{lbl['lbl.so.bo.search.result']}"
						toggleable="true">
						<p:dataTable id="existingsearch"
							value="#{qTBusinessOwnerBackingBean.managedBean.externalUsers}"
							selection="#{qTBusinessOwnerBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existuser}" var="existuser"
							styleClass="existingResults" style="width : 800px;">

							<ac:paginator for="existingsearch" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.so.bo.name']}">
								<h:outputText value="#{existuser.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.identification.no']}">
								<h:outputText value="#{existuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.designation']}">
								<h:outputText value="#{existuser.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.grade']}">
								<h:outputText value="#{existuser.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.pp']}">
								<h:outputText value="#{existuser.PMP}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.email']}">
								<h:outputText
									value="#{existuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>

						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="New user" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.memberName}"
										size="30" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /></td>
								<td><p:selectOneMenu id="apptypeaction"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>
							<tr>
								<td style="width: 130px;"><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idno']}" /></td>
								<td><p:inputText id="idNos"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.icPassport}"
										size="30" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.grade']}" /></td>
								<td><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.grade}"
										size="30" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.pp']}" /></td>
								<td><p:selectOneRadio
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.designation']}" /></td>
								<td><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.designation}"
										size="30" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.email']}" /></td>
								<td><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.email}"
										size="30" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
				style="float:right;"
				action="#{qTBusinessOwnerBackingBean.cancelCommitteAction}"
				oncomplete="newbusinessowner.hide();" update="businessownerId"
				icon="ui-icon-cancel" />
			<p:commandButton value="#{lbl['lbl.so.okbtn']}" style="float:right;"
				onclick="newbusinessowner.hide();" update="businessownerId"
				process="@this, newProfile" icon="ui-icon-check"
				actionListener="#{qTBusinessOwnerBackingBean.okBusinessOwnerAction}" />
		</p:panel>
	</p:dialog>
</ui:composition>
