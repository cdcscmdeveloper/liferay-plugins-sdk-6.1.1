<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="newbusinessownerid" header="#{lbl['lbl.so.bo.new']}"
		width="900" widgetVar="newbusinessowner" modal="true" position="top">
		<p:panel toggleable="true" styleClass="qtAddMember" id="bopanel">
			<p:messages id="bomessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<h:panelGrid columns="3" styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="*" styleClass="mandatory" />
				<h:outputLabel value="#{lbl['lbl.sc.committe.addscreen.selection']}" />
				<p:selectOneRadio id="selection"
					value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{qTBusinessOwnerBackingBean.managedBean.selections}" />
					<p:ajax event="click"
						listener="#{qTBusinessOwnerBackingBean.userSelcetionAction}"
						update="newProfile"></p:ajax>
				</p:selectOneRadio>
				<p:message id="selectionMsg" for="selection" display="icon" />
			</h:panelGrid>

			<p:panel id="newProfile">
				<c:if
					test="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel id="usersearchpnlids" header="#{lbl['lbl.so.searchbtn']}"
						toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText
										value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td><p:selectOneMenu id="appaction"
										value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td><p:inputText id="Idno"
										value="#{qTBusinessOwnerBackingBean.managedBean.userBusineeOwnerSearchBean.identificationNo}"
										size="30" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
							action="#{qTBusinessOwnerBackingBean.searchUserAction}"
							update="existingsearch" icon="ui-icon-search"
							process="@this, usersearchpnlids" />
						<p:commandButton value="#{lbl['lbl.so.reset']}"
							action="#{qTBusinessOwnerBackingBean.reset}"
							update="usersearchpnlids" icon="ui-icon-reset" resetValues="true"
							partialSubmit="true" process="@this" />
					</div>

					<p:panel header="#{lbl['lbl.so.bo.search.result']}"
						toggleable="true">
						<p:dataTable id="existingsearch"
							value="#{qTBusinessOwnerBackingBean.managedBean.userSearchBusinessOwnerDataModel}"
							selection="#{qTBusinessOwnerBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existuser.userId}" var="existuser" lazy="true"
							styleClass="existingResults" style="width : 100%;">

							<ac:paginator for="existingsearch" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.so.bo.name']}"
								style="width : 20%">
								<h:outputText value="#{existuser.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.identification.no']}"
								style="width : 15%">
								<h:outputText value="#{existuser.identificationNo}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.designation']}"
								style="width : 15%">
								<h:outputText value="#{existuser.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.grade']}"
								style="width : 5%">
								<h:outputText value="#{existuser.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.pp']}" style="width : 6%">
								<h:outputText
									value="#{lbl[existuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.so.bo.email']}"
								style="width : 15%">
								<h:outputText
									value="#{existuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>

						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{qTBusinessOwnerBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="New user" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.name']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td colspan="3"><p:inputText id="name" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.name']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.memberName}"
										size="30" maxlength="50" /> <p:message id="nameMsg"
										for="name" display="icon" /></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneMenu id="idtype" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.idtype']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{qTBusinessOwnerBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu> <p:message id="idtypeMsg" for="idtype" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td style="width: 130px;"><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idno']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="idNos" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.idno']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.icPassport}"
										size="30" maxlength="15" /> <p:message id="idNosMsg"
										for="idNos" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.grade']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="grade" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.grade']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.grade}"
										size="30" maxlength="10" /> <p:message id="gradeMsg"
										for="grade" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.pp']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:selectOneRadio id="pnp" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.pp']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.PNP}">
										<f:selectItem itemLabel="Yes" itemValue="true" />
										<f:selectItem itemLabel="No" itemValue="false" />
									</p:selectOneRadio> <p:message id="pnpMsg" for="pnp" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.designation']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="designation" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.designation']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.designation}"
										size="30" maxlength="50" /> <p:message id="designationMsg"
										for="designation" display="icon" /></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.email']}" /> <p:outputLabel
										value="*" styleClass="mandatory" /></td>
								<td><p:inputText id="email" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.email']}"
										value="#{qTBusinessOwnerBackingBean.managedBean.committeMember.email}"
										size="30" maxlength="80" /> <p:message id="emailMsg"
										for="email" display="icon" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					process="@this, newProfile, bopanel"
					action="#{qTBusinessOwnerBackingBean.okBusinessOwnerAction}"
					ajax="true" icon="ui-icon-check" update="businessownerId, bopanel" />

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" process="@this"
					oncomplete="newbusinessowner.hide();" icon="ui-icon-cancel" />
			</div>
		</p:panel>
	</p:dialog>
</ui:composition>
