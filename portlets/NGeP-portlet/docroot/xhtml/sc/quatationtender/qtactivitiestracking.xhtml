<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Activities Tracking" style="width: 100%"
		toggleable="true">
		<p:dataTable id="activitiestrackingidid"
			var="qtActivityBean"
			value="#{qTDetailBB.managedBean.qtActivityBeans}">
			
			<p:column headerText="Activities">
				#{qtActivityBean.activityCode.codeName}
			</p:column>
			<p:column headerText="Assigned To">
				#{qtActivityBean.assignedTo}
			</p:column>
			<p:column headerText="Status">
				#{qTDetailBB.getStatusDescById(qtActivityBean.statusId)}
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
