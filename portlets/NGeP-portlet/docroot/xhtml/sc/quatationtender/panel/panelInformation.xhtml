<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="panelinfoid" header="Panel Information" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularno']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.ctPanelItem.ctCircularVer.circularNo}"
					disabled="true" size="30" />
				<p:spacer width="5" />
				<p:commandLink style="margin-right:20px;">
					<h:outputText value="#{lbl['lbl.so.cirattach']}" />
				</p:commandLink>
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularname']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.ctPanelItem.ctCircularVer.name}"
					disabled="true" size="30" />
			</h:column>

			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.circularexp']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.ctPanelItem.ctCircularVer.endDate}"
					disabled="true" size="30">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>
			</h:column>
		</h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.so.item.details']}" toggleable="true">
		<p:dataTable id="itemdtlid" var="panelItem" rowIndexVar="index"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.selectpanelItem}"
			rowKey="#{panelItem}">

			<ac:paginator for="panelDataItemList"></ac:paginator>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
				style="width:15%;">
				<h:outputText value="#{panelItem.itemName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
				style="width:10%;">
				<h:outputText value="#{panelItem.specification}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
				style="width:10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
				style="width:10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.tpl.spec.content.uom']}"
				style="width:10%;">
				<h:outputText value="#{panelItem.pmUom.uomId}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
				style="width:10%;">
				<h:outputText value="#{panelItem.minimumOrderQty}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
				style="width:10%;">
			</p:column>

		</p:dataTable>

	</p:panel>
</ui:composition>
