<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:fragment
		rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.ctzones eq 'true'}">
		<p:panel id="ctZonepnlid" header="Location Details" toggleable="true">
			<p:dataTable id="ctSupplierTreeZones"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneGeneralTrees}"
				var="ctZones" rowIndexVar="index" dynamic="true">

				<p:column headerText="#{lbl['lbl.sc.spec.supplier.zone']}"
					style="width:90%">
					<p:tree value="#{ctZones}" var="location" selectionMode="single">
						<p:ajax event="select" update=":form:paneltabView:totalSupplierid"
							listener="#{qTSupplierQulCriteriaBackingBean.retriveZoneBySupplier}" />
						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
			</p:dataTable>
		</p:panel>
	</ui:fragment>
	<br />
	<ui:include src="supplierlist.xhtml" />

</ui:composition>
