<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Zone" toggleable="true">
		<p:dataTable id="zoneid" rowIndexVar="rowIndex" style="width:50%">
			<p:column headerText="Zone" />
		</p:dataTable>

		<br />
		<h:outputText value="#{lbl['lbl.so.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSupplier}"
			disabled="true" />
	</p:panel>

	<ui:include src="/xhtml/sc/quatationtender/panel/supplierlist.xhtml" />

	<div align="right">
		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			icon="ui-icon-search" partialSubmit="true" process="@this"
			action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierPopupAction}"
			oncomplete="suppdlg.show();"
			rendered="#{qTDetailBB.managedBean.editable}" />

	</div>
</ui:composition>
