<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="totalSupplierid">
		<p:panel id="panlesupplierlist"
			header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
			<p:dataTable id="panelsuppliersTbl" var="qtSupplier"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctZoneSupplierList}"
				rowIndexVar="index" editable="true" rowKey="#{qtSupplier}">

				<ac:paginator for="suppliersTbl" />

				<p:column headerText="#{lbl['lbl.so.suppliername']}">
					<p:commandLink oncomplete="suppDetails.show();"
						actionListener="#{qTSupplierQulCriteriaBackingBean.retriveSupplierDtls(qtSupplier)}"
						update=":form:paneltabView:panelpopupSuppDtl" >
						<h:outputText value="#{qtSupplier.supplier.companyName}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.mofno']}">
					<h:outputText value="#{qtSupplier.supplier.smMofAccounts[0].mofNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mofexp']}">
					<h:outputText
						value="#{qtSupplier.supplier.smMofAccounts[0].expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.status']}">
					<h:outputText
						rendered="#{qTSupplierQulCriteriaBackingBean.supplierStatusDateComparision(qtSupplier.supplier.smMofAccounts[0].expDate) eq 'true'}"
						value="Active" />
					<h:outputText
						rendered="#{qTSupplierQulCriteriaBackingBean.supplierStatusDateComparision(qtSupplier.supplier.smMofAccounts[0].expDate) eq 'false'}"
						value="Expired" style="font-weight: bold;color:red;" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<h:outputText value="#{lbl['lbl.so.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSupplier}"
			disabled="true" />
	</h:panelGroup>
	<ui:include src="/xhtml/sc/quatationtender/panel/supplierDetailsPopup.xhtml"/>
</ui:composition>
