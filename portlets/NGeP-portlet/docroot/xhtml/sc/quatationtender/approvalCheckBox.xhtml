<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.qt.arroval']}" toggleable="true" id="approvalWorkFlow">
		<table style="width: 100%">
			<tr>
				<td width="20%" valign="top">
					<p:outputLabel value="#{lbl['lbl.sc.qt.appcategory']}" />
				</td>
				<td width="80%">
					<h:panelGrid border="0" cellpadding="0"
						cellspacing="0" columns="3" styleClass="noBorders tr,noBorders td"
						columnClasses="columnWidth70">
						<c:forEach var="approvalCategory" items="#{approvalBackingBean.approvalCategories}">
							<p:selectManyCheckbox value="#{approvalBackingBean.appCatList}" layout="lineDirection" disabled="true">
								<f:selectItem value="#{approvalCategory}" />
							</p:selectManyCheckbox>
						</c:forEach>
					</h:panelGrid>
				</td>
			</tr>
		</table>
		<p:spacer height="10" />

		<p:tabMenu activeIndex="#{qTDetailBB.managedBean.selectedApprovalTabIndex}" 
			model="#{qTDetailBB.managedBean.approvalMenuModel}" 
			rendered="#{qTDetailBB.managedBean.approvalMenuModel != null}"/>

		<ui:fragment rendered="#{qTDetailBB.managedBean.selectedApprovalTabBean.titleName eq 'Budget Approval'}">
			<ui:param name="budgetList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.budgetApprovalUsers}" />
			<ui:param name="budgetApprovalRemarkList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
			<ui:include src="approvalDetailSection.xhtml" />
		</ui:fragment>
		
		<ui:fragment rendered="#{qTDetailBB.managedBean.selectedApprovalTabBean.titleName eq 'BPK Approval'}">
			<ui:param name="bpkApproverCategory" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval}" />
			<ui:param name="approvalDtlsList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval}" />
			<ui:param name="bpkApprovalRemarkList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
			<ui:include src="/xhtml/sc/quatationtender/approval/approvalDetailsBPK.xhtml" />
		</ui:fragment>
		
		<ui:fragment rendered="#{qTDetailBB.managedBean.selectedApprovalTabBean.titleName eq 'Committee Appointment Approval'}">
			<ui:param name="committeeApprovalDtlsList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalDtls}" />
			<ui:param name="commiteList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.budgetApprovalUsers}" />
			<ui:param name="commiteApproverCategory" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval}" />
			<ui:param name="committeeApprovalRemarkList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
			<ui:param name="committeeApprovalAttachment" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalAttachment}" />
			<ui:include src="/xhtml/sc/quatationtender/approval/approvalDetailsCommittee.xhtml" />
		</ui:fragment>
		
		<ui:fragment rendered="#{qTDetailBB.managedBean.selectedApprovalTabBean.titleName eq 'PTJ Approval'}">
			<ui:param name="ptjApprovalDtlsList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalDtls}" />
			<ui:param name="ptjList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.budgetApprovalUsers}" />
			<ui:param name="ptjApprovalRemarkList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
			<ui:include src="/xhtml/sc/quatationtender/approvalDetailsPTJ.xhtml" />
		</ui:fragment>
		
		<ui:fragment rendered="#{qTDetailBB.managedBean.selectedApprovalTabBean.titleName eq 'Finalization Committee Approval'}">
			<ui:param name="fcaApprovalDtlsList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalDtls}" />
			<ui:param name="fcaApprovalRemarkList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />
			<ui:include src="/xhtml/sc/quatationtender/approval/approvalDetailsProcurement.xhtml" />
		</ui:fragment>
		
		<ui:fragment rendered="#{qTDetailBB.managedBean.selectedApprovalTabBean.titleName eq 'Others Approval'}">
			<ui:param name="othersApprovalDtlsList" value="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval}" />
			<ui:include src="/xhtml/sc/quatationtender/approval/approvalDetailsOthers.xhtml" />
		</ui:fragment>

	</p:panel>
</ui:composition>
