<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="qtSearchMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:panel header="#{lbl['lbl.so.searchbtn']}" toggleable="true"
			id="qtsearchid">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="4"
				columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">

				<h:outputLabel for="qtnno" value="#{lbl['lbl.so.qtnno']}" />
				<p:inputText id="qtnno"
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.qtNo}"
					size="29" maxlength="21" />

				<h:outputLabel value="#{lbl['lbl.so.procmode']}" />
				<p:selectOneMenu id="procurementid"
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.procurementMode}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItems
						value="#{qTDetailBB.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
				</p:selectOneMenu>

				<h:outputLabel value="#{lbl['lbl.so.creatdtfrom']}" />
				<p:calendar
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}"
					id="crdateFrom" showOn="button" size="29" readonlyInput="true">
					<p:ajax event="dateSelect" update="crdateTo" />
				</p:calendar>

				<h:outputLabel value="#{lbl['lbl.so.creatdtto']}" />
				<p:calendar id="crdateTo" showOn="button"
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toCreatedDate}"
					mindate="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}"
					size="29" readonlyInput="true">
					<f:attribute name="startDate"
						value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}" />
					<f:validator validatorId="dateRangeValidator" />
				</p:calendar>

				<h:outputLabel value="#{lbl['lbl.so.pbldtfrom']}" />
				<p:calendar
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}"
					id="pbdateFrom" showOn="button" size="29" readonlyInput="true">
					<p:ajax event="dateSelect" update="pbdateTo" />
				</p:calendar>

				<h:outputLabel value="#{lbl['lbl.so.pbldtto']}" />
				<p:calendar id="pbdateTo" showOn="button"
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toPublishDate}"
					mindate="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}"
					size="29" readonlyInput="true">
					<f:attribute name="startDate"
						value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}" />
					<f:validator validatorId="dateRangeValidator" />
				</p:calendar>

				<h:outputLabel value="#{lbl['lbl.so.clsdtfrom']}" />
				<p:calendar
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}"
					id="cldateFrom" showOn="button" size="29" readonlyInput="true">
					<p:ajax event="dateSelect" update="cldateTo" />
				</p:calendar>

				<h:outputLabel value="#{lbl['lbl.so.clsdtto']}" />
				<p:calendar id="cldateTo" showOn="button"
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toClosingDate}"
					mindate="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}"
					size="29" readonlyInput="true">
					<f:attribute name="startDate"
						value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}" />
					<f:validator validatorId="dateRangeValidator" />
				</p:calendar>

				<h:outputLabel value="#{lbl['lbl.so.status']}" />
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.qtnTenderSearchBean.qtStatus}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItems
						value="#{qTDetailBB.getStatusDropdownValues('SC', 'QT')}" />
				</p:selectOneMenu>
			</h:panelGrid>

			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
					action="#{qTDetailBB.searchQTAction}" update="searchQTs"
					icon="ui-icon-search" process="@this, qtsearchid" />
				<p:commandButton value="#{lbl['lbl.so.reset']}"
					action="#{qTDetailBB.reset}" update="qtsearchid"
					icon="ui-icon-reset" resetValues="true" partialSubmit="true"
					process="@this" />
			</div>
		</p:panel>

		<p:panel header="#{lbl['lbl.so.qtlist']}" toggleable="true">
			<h:panelGroup id="table-wrapper" style="width:100%;">
				<p:dataTable id="searchQTs"
					value="#{qTDetailBB.managedBean.searchQTDataModel}" var="scQt"
					rowIndexVar="index" lazy="true">

					<ac:paginator for="searchQTs" />

					<p:column headerText="#{lbl['lbl.so.qtnno']}" style="width:100px;">
						<h:outputText value="#{scQt.qtNo}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.so.title']}">
						<h:outputText value="#{scQt.qtTitle}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.procmode']}"
						style="width:100px;">
						<h:outputText
							value="#{qTDetailBB.getParameterDesc(scQt.procurementMode)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.so.crtdt']}" style="width:120px;">
						<h:outputText value="#{scQt.createdDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.so.pbdt']}" style="width:120px;">
						<h:outputText value="#{scQt.publishDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.so.clsdt']}" style="width:120px;">
						<h:outputText value="#{scQt.closingDate}">
							<f:convertDateTime
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.so.action']}" style="width:10%">
						<p:commandLink action="#{qTDetailBB.editAction(scQt)}"
							style="margin-right:20px;" partialSubmit="true" process="@this">
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />
						</p:commandLink>
					</p:column>

				</p:dataTable>
			</h:panelGroup>
			<br />
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td width="100%"><h:outputLabel
							value="#{lbl['lbl.sc.select.ptj']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td class="ppRightBtn" style="white-space: nowrap;"><p:selectOneMenu
							id="ptjselect" required="true"
							label="#{lbl['lbl.sc.select.ptj']}"
							value="#{qTDetailBB.managedBean.qt.pmOrgProfile.orgProfileId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems value="#{qTDetailBB.managedBean.userDivisionList}"
								var="pmOrgProfile"
								itemLabel="#{pmOrgProfile.orgCode} - #{pmOrgProfile.orgName}"
								itemValue="#{pmOrgProfile.orgProfileId}" />
							<p:ajax event="change"
								listener="#{qTDetailBB.handlePTJNameChanged(qTDetailBB.managedBean.qt.pmOrgProfile)}" />
						</p:selectOneMenu> <p:commandButton value="#{lbl['lbl.so.qtmscreen']}"
							action="#{qTBusinessOwnerBackingBean.createBusinessOwner}"
							icon="ui-icon-add"
							rendered="#{qTDetailBB.managedBean.qt.pmOrgProfile.orgProfileId != 'null'}" />
					</td>
				</tr>
			</table>
			<br />
			<br />
		</p:panel>
	</ui:define>
</ui:composition>
