<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:panelGroup id="suppQualPG">
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeOpen 
						or qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeBumiputra}">
			<ui:include src="nrmqtntender.xhtml" />
		</c:if>
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType != ParameterTypeConst.quotationTenderTypeOpen and qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType != ParameterTypeConst.quotationTenderTypeRestrictedTender and qTSupplierQulCriteriaBackingBean.managedBean.panelItem eq 'Yes'}">
			<ui:include src="panel/panelDetails.xhtml" />
		</c:if>
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeRestrictedTender}">
			<ui:include src="restrictedtender/restrictedTenderDetails.xhtml" />
		</c:if>
	</h:panelGroup>
</ui:composition>
