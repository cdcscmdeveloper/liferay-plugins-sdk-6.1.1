<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="contentSection">
		<ui:remove> #25791 start </ui:remove>
		<style>
.commandLink_font {
	color: #009ae5 !important;
}
</style>
		<ui:remove> #25791 end </ui:remove>
		<table style="width: 100%;" class="BtnSpacing">
			<tr>
				<td align="right"><p:commandButton
						value="#{lbl['lbl.btn.back']}" style="float:left;"
						immediate="true"
						action="#{qTDetailBB.backToPreviousQtAuditORMaintenance()}"
						partialSubmit="true" process="@this" update="@this" /></td>
			</tr>
		</table>
		
		<p:panel header="#{lbl['lbl.sc.qt.loa.search.results']}" style="width:100% !important;"
			toggleable="true" id="laCtpId">
			
			<p:dataTable id="laCtdId" var="qtLoaTrack" style="width:100%;"
				value="#{qTDetailBB.managedBean.loaContractTrackingDtls}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" rowKey="#{qtLoaTrack}">
				<ui:param name="scQt" value="#{qtLoaTrack.scLoiLoa.scQt}" />
				<ui:param name="isQtDirectNego"
					value="#{qtLoaTrack.scLoiLoa.scQt.getProcurementMode().getParameterCode() == ParameterConst.procurementModeDirectNego}" />


				<p:columnGroup type="header">
					<p:row>
						<p:column headerText="#{lbl['lbl.sc.document.type']}"
							style="width:15%; text-align: center">
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.qt.view.loiloa.loa.no']}"
							style="width:10%;white-space: normal;">
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.qtn.no']}"
							style="width:10%;white-space: normal;">
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.title']}"
							style="width:40%;text-align: center;white-space:normal;">
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.status']}"
							style="width:25%;white-space: normal;">
						</p:column>
					</p:row>
				</p:columnGroup>

				<p:column style="width:15%;text-align: left;">
					<h:outputText
						value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.documentTypes,ParameterConst.doctypeLetterOfAward)}"></h:outputText>
				</p:column>

				<p:column style="width:10%;white-space: normal;">
					<p:commandLink process="@this" partialSubmit="true" styleClass="commandLink_font"
						action="#{qTDetailBB.viewSupplierProposalDetailsGen(qtLoaTrack, view.viewId)}"
						rendered="#{!isQtDirectNego}">
						<h:outputText value="#{qtLoaTrack.docNo}" escape="false" />
					</p:commandLink>
					<p:commandLink process="@this" partialSubmit="true"
						rendered="#{isQtDirectNego}" styleClass="commandLink_font"
						action="#{qTDetailBB.viewDirectLOADetails(scQt, view.viewId)}">
						<h:outputText value="#{qtLoaTrack.docNo}" escape="false" />
					</p:commandLink>
				</p:column>

				<p:column style="width:10%;white-space: normal;">
					<p:commandLink process="@this" partialSubmit="true"
						rendered="#{!isQtDirectNego}" styleClass="commandLink_font"
						action="#{qTDetailBB.editQuationTenderDetails(scQt, false, true, view.viewId)}">
						<h:outputText value="#{scQt.qtNo}" escape="false" />
					</p:commandLink>
					<h:outputText value="#{scQt.qtNo}" escape="false"
						rendered="#{isQtDirectNego}" />
				</p:column>

				<p:column
					style="width:40%;text-align: left;white-space: normal;word-wrap: break-word;">
					<h:outputText value="#{scQt.qtTitle}"
						style="white-space: normal;word-wrap: break-word;" />
				</p:column>

				<p:column style="width:25%;white-space: normal;">
					<h:outputText
						value="#{qTDetailBB.getStatusDescById(qTDetailBB.getLoaStatusIdToDisplay(qtLoaTrack.scLoaWorkFlowStatuses))}" />

				</p:column>

			</p:dataTable>

			<br />

			<p:dataTable id="laCtdvd" var="loaContractTracking" rows="10"
				lazy="true"
				value="#{qTDetailBB.managedBean.viewLoaContractDataModel}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="rowIndex" rowKey="#{loaContractTracking}">
				<ac:paginator for="laCtdvd" />

				<p:column style="width:5%;text-align:center;"
					headerText="#{lbl['lbl.sc.qt.loa.seq.number']}">
				#{rowIndex+1}
                </p:column>


				<p:column headerText="#{lbl['lbl.ct.contract.no']}"
					style="width:15%;" styleClass="column-align-center">
					<p:commandLink process="@this" partialSubmit="true" styleClass="commandLink_font"
						action="#{qTDetailBB.viewLoaContractDetailsPage(loaContractTracking,view.viewId)}">
						<h:outputText value="#{loaContractTracking.contractNo}"
							escape="false" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.contract.status']}"
					style="width:15%; white-space:normal;">
					<h:outputText
						value="#{qTDetailBB.getContractStatusDesc(loaContractTracking.contractStatus)}"
						style="text-align:left; float:left;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.fulfilment.details.status']}"
					style="width:20%; white-space:normal;">
					<h:outputText
						value="#{qTDetailBB.chkContractStatusType(loaContractTracking.contractNo,loaContractTracking.fdStatus)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.ct.agreement.status']}"
					style="width:20%; white-space:normal;">
					<h:outputText
						value="#{qTDetailBB.chkContractStatusType(loaContractTracking.contractNo,loaContractTracking.agStatus)}" />
				</p:column>

				<p:column style="width:25%; white-space:normal;"
					headerText="#{lbl['lbl.ct.doc.contract.status']}">
					<h:outputText
						value="#{qTDetailBB.chkContractStatusType(loaContractTracking.contractNo,loaContractTracking.status)}" />
				</p:column>

			</p:dataTable>

		</p:panel>

	</ui:define>

</ui:composition>
