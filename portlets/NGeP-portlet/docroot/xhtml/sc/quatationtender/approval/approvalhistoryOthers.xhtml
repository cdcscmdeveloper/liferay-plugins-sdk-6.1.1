<!-- #25077 Start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
    <ui:param name="isMandatoryDocument" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_REVISION_PUBLICATION or qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_BPK_APPROVAL}" />  
	
	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable
		    value="#{approvalDtlsList.historyApprovalRequests}" 
		    var="historyOthersDtls" style="width:100%" rowIndexVar="indexHistory" editable="true"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{historyOthersDtls}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyOthersDtls.approvalType)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.approval.history.approved.by']}">
				<h:outputText value="#{historyOthersDtls.approverId.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyOthersDtls.approverAction)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.date']}">
				<h:outputText value="#{historyOthersDtls.approverActionDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			     <c:if test="#{not empty approvalDtlsList.historyApprovalRequests}">
	                <c:choose>
					    <c:when test="#{qTDetailBB.managedBean.maintanceFlow}">	
				              <p:column headerText="#{lbl['lbl.sc.document']}" style="text-align: center;white-space: normal;width: 50%;"><!-- #34014 -->
				                  <c:if test="#{qTDetailBB.isApprovalScreen() and qTDetailBB.userTaskIsCommitteeAppointmentApproval}">
										<ui:include src="downloadOthersFile.xhtml" />
				                  </c:if>
				                  <c:if test="#{qTDetailBB.isApprovalScreen() and qTDetailBB.userTaskIsBPKApproval}">
				                        <ui:include src="downloadOthersFile.xhtml" /> 
				                  </c:if>
				                  <c:if test="#{qTDetailBB.isApprovalScreen() and qTDetailBB.userTaskIsCommitteeAppointmentApprovalEcOcTecFec}">
				                        <ui:include src="downloadOthersFile.xhtml" /> 
				                  </c:if>
				                  <c:if test="#{qTDetailBB.isApprovalScreen() and qTDetailBB.userTaskIsPublicationApproval}">
				                        <ui:include src="downloadOthersFile.xhtml" /> 
				                  </c:if>
				                  <c:if test="#{!qTDetailBB.isApprovalScreen()}">
								        <ui:include src="downloadOthersFile.xhtml" />
				                  </c:if>
							  </p:column>  
				        </c:when>
				        <c:otherwise>
		                       <p:column style="text-align: center;white-space: normal;width: 50%;"><!-- #34014 -->
							      <f:facet name="header">
							            <c:if test="#{isMandatoryDocument}">
							               <h:outputText value="* " styleClass="mandatory" />
							            </c:if>
										<h:outputText value="#{lbl['lbl.sc.document']}" />
								  </f:facet>
								  
						          <ac:scSingleFileUploadButton id="historyOtheruploadIdICT"
										popupWidgetVar="otherHistoryApprUploadDlgICT"
										attachment="#{historyOthersDtls.approvalRequestAttachement}"
										rendered="#{historyOthersDtls.approvalType.parameterCode eq ParameterConst.approvalRequestIctProjects}"
										deleteFileUploadListener="approvalBackingBean.deleteHistoryOthersApprovalFileICT"
										rowIndex="#{indexHistory}">
										<f:setPropertyActionListener for="actionEvent"
											value="#{historyOthersDtls}"
											target="#{approvalBackingBean.managedBean.historyApprovalRequests}" />
							      </ac:scSingleFileUploadButton>
							      
							      <ac:scSingleFileUploadButton id="historyOtheruploadIdMITI"
										popupWidgetVar="otherHistoryApprUploadDlgMITI"
										attachment="#{historyOthersDtls.approvalRequestAttachement}"
										rendered="#{historyOthersDtls.approvalType.parameterCode eq ParameterConst.approvalRequestImportedGoods}"
										deleteFileUploadListener="approvalBackingBean.deleteHistoryOthersApprovalFileMITI"
										rowIndex="#{indexHistory}">
										<f:setPropertyActionListener for="actionEvent"
											value="#{historyOthersDtls}"
											target="#{approvalBackingBean.managedBean.historyApprovalRequests}" />
							      </ac:scSingleFileUploadButton>
							      
					          </p:column> 
					    </c:otherwise>
				    </c:choose>
			     </c:if>	
		</p:dataTable>
	</p:panel>
</ui:composition>
<!-- #25077 End -->
