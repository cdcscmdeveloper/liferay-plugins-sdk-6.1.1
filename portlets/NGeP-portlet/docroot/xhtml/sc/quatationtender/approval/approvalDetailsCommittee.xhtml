<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Request Details" toggleable="true">
		<p:dataTable style="width:50%">
			<p:column headerText="Type of Approval Request" />
		</p:dataTable>
	</p:panel>

	<p:panel header="  Committee Approver Setting" toggleable="true">
		<p:spacer height="3" />
		<div style="width: 100%">
			<p:pickList id="committeeapproverid"
				value="#{approvalBackingBean.managedBean.committeeApprovalUsers}"
				var="approverUser" showTargetControls="true"
				itemLabel="#{approverUser.userName}" itemValue="#{approverUser}"
				converter="approverConverter">
				<f:facet name="sourceCaption">Available </f:facet>
				<f:facet name="targetCaption">Selected</f:facet>
			</p:pickList>
		</div>
	</p:panel>

	<p:panel header="Remark" toggleable="true" id="uploadsids">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="Remark" /></td>
				<td class="TableFieldRight"><p:dataGrid
						value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUsername)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUsername}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40"
										value="#{approvalBackingBean.managedBean.scQtApproval.approverRemark}" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
				<td class="TableFieldLeft"><p:outputLabel
						value="Supporting Document" /></td>
				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="attachDlg.show();return false;"
									icon="iconAttachment" update="uploadsids" value="Attach Files">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attachIds"
									value="#{approvalBackingBean.managedBean.attachments}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage library="ep/images/design"
													name="#{approvalBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText value="#{attachFile.user.userName}" />,
												<h:outputText value="#{attachFile.changedDate}">
													<f:convertDateTime
														pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" /> <p:commandLink
													action="#{approvalBackingBean.deleteUploadFile}"
													immediate="true" update="attachIds">
													<h:graphicImage library="ep/images/design"
														name="icon_trash.png" styleClass="tasklist_title1" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>

					</table>
				</td>
			</tr>
		</table>
	</p:panel>

	<!-- <ui:include src="/xhtml/sc/quatationtender/approvalDetailSection.xhtml" /> -->
	<p:panel header="History" toggleable="true">
		<p:dataTable>
			<p:column headerText="Type of Approval Request">
			</p:column>
			<p:column headerText="Approved By">
			</p:column>
			<p:column headerText="Status">
			</p:column>
			<p:column headerText="Date">
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:dialog id="attachDlgids" widgetVar="attachDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleFileUpload}"
			mode="advanced" id="dialoguploadids"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="uploadsids" oncomplete="attachDlg.hide()">
		</p:fileUpload>
	</p:dialog>

</ui:composition>
