<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:spacer height="5" />
	<p:panel>
		<p:dataTable id="otherreqdtlsid" value="#{othersApprovalDtlsList}"
			var="otherrequestdetails" rowIndexVar="index" editable="true"
			rowKey="#{otherrequestdetails}">

			<p:column headerText="#{lbl['lbl.sc.qt.appcategory']}">
				<h:outputText value="#{otherrequestdetails.approvalType}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.status']}">
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.document']}">
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.remark']}">
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
