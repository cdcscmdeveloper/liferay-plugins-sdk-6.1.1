<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isOtherApprovalDtlsEditable" value="#{!qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />
	<!-- #25077 Start -->
    <ui:param name="isMandatoryStatusAndDocument" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT}" />
	<!-- #25077 End -->
	
	<p:panel>
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.approval.oth.instruction']}" escape="false" />
		<!-- #25077 Start -->
	    <br /><h:outputText styleClass="instruction" value="#{lbl['lbl.sc.qt.approval.oth.supporting.document.instruction']}" escape="false" />
	    <!-- #25077 End -->
		<p:dataTable id="otherreqdtlsid"
			value="#{othersApprovalDtlsList.scQtApprovalDtls}"
			var="otherrequestdetails" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{otherrequestdetails}">

			<p:column headerText="#{lbl['lbl.sc.qt.appcategory']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.approvalRequestTypes ,otherrequestdetails.approvalType.parameterCode)}" />
			</p:column>
			<p:column>
				<f:facet name="header">
				    <!-- #25077 Start -->
				    <c:if test="#{isMandatoryStatusAndDocument}"> 
				    <!-- #25077 End -->
				        <h:outputText value="* " styleClass="mandatory" />
				    <!-- #25077 Start -->
				    </c:if>  
				    <!-- #25077 End -->
					<h:outputText value="#{lbl['lbl.sc.status']}" />
				</f:facet>
				
				<ui:remove> #19287 - start </ui:remove>
				<p:selectOneMenu id="decisiontypeid"
					value="#{otherrequestdetails.approverAction.parameterId}"
					style="width: 178px;margin-bottom: 5px;" disabled="#{createQtBB.managedBean.readOnly}">
					<ui:remove> #19287 - end </ui:remove>
					<!-- #25077 Start -->
				    <c:choose>
					    <c:when test="#{qTDetailBB.isQTStatusLessThan(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}">	
					         <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					    </c:when>
					    <c:otherwise>
					         <f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" noSelectionOption="true" itemDisabled="true"/>
					    </c:otherwise>
			        </c:choose>
					<!-- #25077 End -->
					<f:selectItems var="app"
						value="#{approvalBackingBean.getStatusDropdownValues()}"
						itemLabel="#{app.codeName}"
						itemValue="#{app.pmParameter.parameterId}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
					listener="#{createQtBB.otherApprovalStatus(otherrequestdetails)}"/>
				</p:selectOneMenu>
				<p:message id="decisiontypeidMsg" for="decisiontypeid"
					display="icon" />
			</p:column>
			<!-- #25077 Start -->
			<c:choose>
				<c:when test="#{createQtBB.managedBean.maintanceFlow}">
					<!-- #34014, #25077 -start- -->
					<p:column headerText="#{lbl['lbl.sc.document']}" style="text-align: center;white-space: normal;width: 50%;">
						<!-- #34014, #25077 -end- -->
						<c:if
							test="#{qTDetailBB.isApprovalScreen() and qTDetailBB.userTaskIsCommitteeAppointmentApproval}">
							<ui:include src="downloadDetailsOthersFile.xhtml" />
						</c:if>
						<c:if test="#{!qTDetailBB.isApprovalScreen()}">
							<ui:include src="downloadDetailsOthersFile.xhtml" />
						</c:if>
					</p:column>
				</c:when>
				<c:otherwise>
				        <!-- #34014, #25077 -start- -->
		                <p:column style="text-align: center;white-space: normal;width: 50%;">
				        <!-- #34014, #25077 -end- -->
						<f:facet name="header">
							<c:if test="#{isMandatoryStatusAndDocument}">
								<h:outputText value="* " styleClass="mandatory" />
							</c:if>
							<h:outputText value="#{lbl['lbl.sc.document']}" />
							<ac:iconTooltip
								value="#{lbl['lbl.sc.qt.approval.oth.supporting.document.tooltip']}" />
						</f:facet>

						<ac:scSingleFileUploadButton id="otheruploadIdICT"
							popupWidgetVar="otherApprUploadDlgICT"
							attachment="#{otherrequestdetails.approvalRequestAttachement}"
							rendered="#{otherrequestdetails.approvalType.parameterCode eq ParameterConst.approvalRequestIctProjects}"
							readonly="#{createQtBB.managedBean.readOnly}"
							deleteFileUploadListener="approvalBackingBean.deleteOthersApprovalFileICT"
							rowIndex="#{index}">
							<f:setPropertyActionListener for="actionEvent"
								value="#{otherrequestdetails}"
								target="#{approvalBackingBean.managedBean.scQtApprovalDtls}" />
						</ac:scSingleFileUploadButton>

						<ac:scSingleFileUploadButton id="otheruploadIdMITI"
							popupWidgetVar="otherApprUploadDlgMITI"
							attachment="#{otherrequestdetails.approvalRequestAttachement}"
							rendered="#{otherrequestdetails.approvalType.parameterCode eq ParameterConst.approvalRequestImportedGoods}"
							readonly="#{createQtBB.managedBean.readOnly}"
							deleteFileUploadListener="approvalBackingBean.deleteOthersApprovalFileMITI"
							rowIndex="#{index}">
							<f:setPropertyActionListener for="actionEvent"
								value="#{otherrequestdetails}"
								target="#{approvalBackingBean.managedBean.scQtApprovalDtls}" />
						</ac:scSingleFileUploadButton>
					</p:column>
				</c:otherwise>
			</c:choose>
			<!-- #25077 End -->
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.remark']}" />
				</f:facet>
				<!-- bug #30435,34694,25077 -start- -->
				<p:inputTextarea id="remarkIctId" maxlength="1000"
					disabled="#{createQtBB.managedBean.readOnly}"
					onkeyup="limitTextArea(this,1000);"
					valueChangeListener="#{createQtBB.otherAppValueChangedICT}"
					onkeydown="limitTextArea(this,1000);"
					onmouseout="limitTextArea(this,100);"
					value="#{otherrequestdetails.appRequestRemark.remark}" cols="30"
					rows="3"
					rendered="#{otherrequestdetails.approvalType.parameterCode eq ParameterConst.approvalRequestIctProjects}">
					<f:ajax></f:ajax>
				</p:inputTextarea>
				<p:message id="remarkIctIdMsg" for="remarkIctId" display="icon" />

				<p:inputTextarea id="remarkMitiId" maxlength="1000"
					disabled="#{createQtBB.managedBean.readOnly}"
					onkeyup="limitTextArea(this,1000);"
					valueChangeListener="#{createQtBB.otherAppValueChangedMITI}"
					onkeydown="limitTextArea(this,1000);"
					onmouseout="limitTextArea(this,100);"
					value="#{otherrequestdetails.appRequestRemark.remark}" cols="30"
					rows="3"
					rendered="#{otherrequestdetails.approvalType.parameterCode eq ParameterConst.approvalRequestImportedGoods}">
					<f:ajax></f:ajax>
				</p:inputTextarea>
				<p:message id="remarkMitiIdMsg" for="remarkMitiId" display="icon" />
				<!-- bug #30435,34694,25077 -end- -->
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
