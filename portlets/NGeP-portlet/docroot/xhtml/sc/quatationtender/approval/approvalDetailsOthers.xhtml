<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

    <ui:param name="isOtherApprovalDtlsEditable" value="#{!qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" /> 
	<!-- #25077 Start -->
	<ui:param name="isOthersApprovalForInstruction" value="#{qTDetailBB.isOthersApprovalForInstruction()}" />
	<ui:param name="isOthersApprovalMandatoryForAttachment" value="#{qTDetailBB.isOthersApprovalMandatoryForAttachment()}" />
	<!-- #25077 End -->
	
	<p:panel>
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.approval.oth.instruction']}" escape="false" />
		<!-- #25077 Start -->
		<c:if test="#{isOthersApprovalForInstruction}">
	    <br /><h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.approval.oth.supporting.document.instruction']}" escape="false" />
	    </c:if> 
	    <!-- #25077 End -->
		<p:dataTable id="otherreqdtlsid"
			value="#{othersApprovalDtlsList.scQtApprovalDtls}"
			var="otherrequestdetails" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{otherrequestdetails}">

			<p:column headerText="#{lbl['lbl.sc.qt.appcategory']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(ParameterTypeConst.approvalRequestTypes ,otherrequestdetails.approvalType.parameterCode)}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.status']}" />
				</f:facet>
				<p:selectOneMenu id="decisiontypeid"
					value="#{otherrequestdetails.approverAction.parameterId}"
					style="width: 178px;margin-bottom: 5px;" disabled="#{createQtBB.managedBean.readOnly}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" noSelectionOption="true" itemDisabled="true"/>
					<f:selectItems var="app"
						value="#{approvalBackingBean.getStatusDropdownValues()}"
						itemLabel="#{app.codeName}"
						itemValue="#{app.pmParameter.parameterId}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
					listener="#{createQtBB.otherApprovalStatus(otherrequestdetails)}"/>
				</p:selectOneMenu>
				<p:message id="decisiontypeidMsg" for="decisiontypeid"
					display="icon" />
			</p:column>
			<!-- #25077 Start -->
				<c:choose>
				    <c:when test="#{createQtBB.managedBean.maintanceFlow}">	
				        <p:column headerText="#{lbl['lbl.sc.document']}">
                                <h:outputText style="font-weight: bold;" value="#{otherrequestdetails.approvalRequestAttachement.fileName}" />
							    <p:commandButton id="downloadOthers" icon="ui-icon-download"
									style="background-color:transparent !important; border:0px none;"
									ajax="false" immediate="true"
									action="#{qTDetailBB.downloadOthersApprovalFile(otherrequestdetails)}"
									rendered="#{otherrequestdetails.approvalRequestAttachement ne null}" disabled="#{createQtBB.managedBean.readOnly}"/>
								<h:outputText value="#{lbl['lbl.datatable.msg.no.records.found']}" rendered="#{otherrequestdetails.approvalRequestAttachement eq null}" />	
						</p:column>	
				    </c:when>
				    <c:otherwise> 
		                <p:column>
					        <f:facet name="header">
					            <c:if test="#{not empty othersApprovalDtlsList.scQtApprovalDtls and isOthersApprovalMandatoryForAttachment}">
						        <h:outputText value="* " styleClass="mandatory" />
						      </c:if> 
								<h:outputText value="#{lbl['lbl.sc.document']}" />
							   <c:if test="#{(not empty othersApprovalDtlsList.scQtApprovalDtls and isOthersApprovalMandatoryForAttachment) or (qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_QT_SUBMISSION)}">
			                    <ac:iconTooltip value="#{lbl['lbl.sc.qt.approval.oth.supporting.document.tooltip']}" />
			                   </c:if> 
							</f:facet>
								<ac:scSingleFileUploadButton id="otheruploadId"
									popupWidgetVar="otherApprUploadDlg"
									attachment="#{otherrequestdetails.approvalRequestAttachement}"
									readonly="#{createQtBB.managedBean.readOnly}"
									deleteFileUploadListener="approvalBackingBean.deleteOthersApprovalFile"
									rowIndex="#{index}">
									<f:setPropertyActionListener for="actionEvent"
										value="#{otherrequestdetails}"
										target="#{approvalBackingBean.managedBean.scQtApprovalDtls}" />
								</ac:scSingleFileUploadButton>
					    </p:column>	
				    </c:otherwise>
				</c:choose>
				<!-- #25077 End -->
			<p:column>
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.remark']}" />
				</f:facet>
				<p:inputTextarea id="remarkid" maxlength="1000" disabled="#{createQtBB.managedBean.readOnly}"
				onkeyup="limitTextArea(this,1000);" valueChangeListener="#{createQtBB.otherAppValueChanged}" onkeydown="limitTextArea(this,1000);" onmouseout="limitTextArea(this,100);"
					value="#{otherrequestdetails.appRequestRemark.remark}" cols="30"
					rows="3" ><f:ajax></f:ajax></p:inputTextarea><!-- bug #30435 -->
				<p:message id="remarkidMsg" for="remarkid" display="icon" />
			</p:column>
		</p:dataTable>
	</p:panel>
		
</ui:composition>
