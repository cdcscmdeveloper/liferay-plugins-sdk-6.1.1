<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
	<p:panel>
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.approval.oth.instruction']}" escape="false" />
	
		<p:dataTable id="otherreqdtlsid"
			value="#{othersApprovalDtlsList.scQtApprovalDtls}"
			var="otherrequestdetails" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{otherrequestdetails}">

			<p:column headerText="#{lbl['lbl.sc.qt.appcategory']}">
				<h:outputText
					value="#{otherrequestdetails.approvalType.parameterCode}" />
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.status']}" />
				</f:facet>
				<p:selectOneMenu id="decisiontypeid"
					value="#{otherrequestdetails.approverAction.parameterId}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
					<f:selectItems var="app"
						value="#{approvalBackingBean.getStatusDropdownValues()}"
						itemLabel="#{app.codeName}"
						itemValue="#{app.pmParameter.parameterId}" />
					<p:ajax event="change" partialSubmit="true" />
				</p:selectOneMenu>
				<p:message id="decisiontypeidMsg" for="decisiontypeid"
					display="icon" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.document']}">
				<p:commandButton oncomplete="otherApprovalAttachDlg.show();"
					value="#{lbl['lbl.btn.attach.files']}" 
					partialSubmit="true" process="otherreqdtlsid"
					disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}"
					update="otherreqdtlsid">
					<f:setPropertyActionListener
						value="#{otherrequestdetails}"
						target="#{approvalBackingBean.managedBean.scQtApprovalDtls}" />
				</p:commandButton>
				<h:panelGroup id="otheruploadId">
					<table>
						<tr>
							<td style="border: none !important;"><h:commandLink
									value="#{otherrequestdetails.approvalRequestAttachement.fileName}"
									styleClass="blue_font" immediate="true"
									action="#{approvalBackingBean.downloadFile(otherrequestdetails.approvalRequestAttachement)}"
									disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />
								<p:commandLink
									rendered="#{otherrequestdetails.approvalRequestAttachement ne null}"
									action="#{approvalBackingBean.deleteOthersApprovalFile}"
									immediate="true" update="otheruploadId"
									disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}">
									<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/trash.png" styleClass="tasklist_title1" />
								</p:commandLink></td>
						</tr>
					</table>
				</h:panelGroup>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.remark']}" />
				</f:facet>
				<p:inputTextarea id="remarkid"
					value="#{otherrequestdetails.appRequestRemark.remark}" cols="30"
					rows="3" />
				<p:message id="remarkidMsg" for="remarkid" display="icon" />
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:dialog id="otherApproval" widgetVar="otherApprovalAttachDlg"
		modal="true" resizable="false" width="700px" height="200"
		styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">

		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleOtherFileUpload}"
			mode="advanced" id="approvalsupload1"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" 
			cancelLabel="#{lbl['lbl.btn.cancel']}"
			update="otherreqdtlsid" oncomplete="otherApprovalAttachDlg.hide()">
		</p:fileUpload>
	</p:dialog>

</ui:composition>
