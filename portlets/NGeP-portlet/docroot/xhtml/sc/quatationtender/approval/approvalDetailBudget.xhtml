<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="isBudApprovalDtlsEditable" value="#{!qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />

	<p:panel id="budgetapprovalid" header="#{lbl['lbl.sc.qt.approver.selection']}"
		toggleable="true">
		
		<div style="width: 100%">
			<p:pickList id="budgetapprover" value="#{budgetList}"
				var="approverUser" showTargetControls="true"
				itemLabel="#{approverUser.pmUser.userName}" itemValue="#{approverUser}"
				converter="approverPickListConverter"
				disabled="#{!isBudApprovalDtlsEditable}">
				<f:facet name="sourceCaption">#{lbl['lbl.sc.available']} </f:facet>
				<f:facet name="targetCaption">#{lbl['lbl.sc.selected']}</f:facet>
			</p:pickList>
		</div>
	</p:panel>

	<ac:scRemarkAndAttachment
		remarkList="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}"
		attachmentList="#{qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalAttachments}"
		readonly="#{!isBudApprovalDtlsEditable}"
		fileUploadListener="approvalBackingBean.handleFileUpload" />

</ui:composition>
