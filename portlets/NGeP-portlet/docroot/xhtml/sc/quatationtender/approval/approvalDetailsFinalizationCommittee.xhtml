<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="fcareqdtlsid"
			value="#{fcaApprovalTab.scQtApproval.scQtApprovalDtls}"
			var="fcrequestdetails" rowIndexVar="index" editable="true"
			rowKey="#{fcrequestdetails}">

			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(fcrequestdetails.approvalType)}" />
			</p:column>
		</p:dataTable>
	</p:panel>


	<p:panel id="fcappoint" header="#{lbl['lbl.sc.qt.finalize.appoint']}"
		toggleable="true">
		<p:dataTable id="finalizationsecretaryid"
			value="#{fcaApprovalTab.scQtApproval.approverSettings}"
			var="approverSettings">
			<p:column headerText="#{lbl['lbl.so.finalization.committee']}">
				<p:selectOneMenu id="fcApprovalId"
					value="#{approverSettings.committeType}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems var="secretary"
						value="#{fcaApprovalTab.approverCommittes}"
						itemLabel="#{secretary.parameterCode}"
						itemValue="#{secretary.parameterCode}" />
					<p:ajax event="change" update="commTypes" process="@this"
						listener="#{qTDetailBB.retrieveFinalizationCommitteeSecretaryName}"
						partialSubmit="true" />
				</p:selectOneMenu>

			</p:column>
			<p:column headerText="#{lbl['lbl.so.secretary.name']}">
				<h:panelGroup id="commTypes">
					<ui:fragment
						rendered="#{approverSettings.committeType eq 'QCA' or approverSettings.committeType eq 'QCB'}">
						<p:selectOneMenu id="usersSecretaryId"
							value="#{approverSettings.approver.userId}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="usersSecretary"
								value="#{qTDetailBB.retrievePmUserSecratryDtl(approverSettings.committeType)}"
								itemLabel="#{usersSecretary.userName}"
								itemValue="#{usersSecretary.userId}" />
							<p:ajax event="change"
								listener="#{qTDetailBB.updateUserIdToSettings}" process="@this"
								partialSubmit="true" update="@this" />
						</p:selectOneMenu>
					</ui:fragment>
					<ui:fragment
						rendered="#{approverSettings.committeType eq 'PBA' or approverSettings.committeType eq 'PBB'}">
						<h:outputText value="#{approverSettings.approver.userName}" />
					</ui:fragment>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.qt.remark']}" toggleable="true"
		id="fcuploads">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid
						value="#{fcaApprovalRemarkList}" var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" /></td>
							</tr>
						</table>
					</p:dataGrid></td>

				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.qt.supp.doc']}" /></td>

				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="fcAttachDlg.show();return false;"
									icon="iconAttachment" update="fcuploads" value="Attach Files">
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="fcAttachId"
									value="#{approvalBackingBean.managedBean.attachments}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage library="ep/images/design"
													name="#{approvalBackingBean.determineIcon(attachFile)}"
													height="30" width="30" />
											</td>
											<td><h:outputText value="#{attachFile.user.userName}" />,
												<h:outputText value="#{attachFile.changedDate}">
													<f:convertDateTime
														pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" /> <p:commandLink
													action="#{approvalBackingBean.deleteUploadFile}"
													immediate="true" update="fcAttachId">
													<h:graphicImage library="ep/images/design"
														name="icon_trash.png" styleClass="tasklist_title1" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>



	<p:dialog id="fcAttachedDlgids" widgetVar="fcAttachDlg" modal="true"
		dynamic="true" resizable="false" width="700px" height="200"
		styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleFileUpload}"
			mode="advanced" id="fcdialogsuploadids"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="fcuploads" oncomplete="fcAttachDlg.hide()">
		</p:fileUpload>
	</p:dialog>


</ui:composition>
