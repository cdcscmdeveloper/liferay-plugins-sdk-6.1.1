<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel id="fcreqDetails" header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="fcareqdtlsid"
			value="#{fcaApprovalTab.scQtApproval.scQtApprovalDtls}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="fcrequestdetails" >

			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(fcrequestdetails.approvalType)}" />
			</p:column>
		</p:dataTable>
	</p:panel>


	<p:panel id="fcappoint" header="#{lbl['lbl.sc.qt.approver.selection']}"
		toggleable="true">
		<p:dataTable id="finalizationsecretaryid"
			value="#{fcaApprovalTab.scQtApproval.approverSettings}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			var="approverSettings">
			<p:column headerText="#{lbl['lbl.sc.finalization.committee']}">
				<c:choose>
					<c:when test="#{!empty fcaApprovalTab.scQtApproval.scQtApprovalDtls and empty fcaApprovalTab.scQtApproval.scQtApprovalDtls[0].submissionDate and 
							qTDetailBB.managedBean.selectedApprovalTabBean.tabType != ParameterConst.approvalCategoryProcurementBoard}">
						<p:selectOneMenu id="fcApprovalId"
							value="#{approverSettings.committeeType.parameterId}"
							style="width: 178px;margin-bottom: 5px;">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems var="secretary"
								value="#{fcaApprovalTab.approverCommittes}"
								itemLabel="#{secretary.parameterCode}"
								itemValue="#{secretary.parameterId}" />
							<p:ajax event="change" update="commTypes" process="@this"
								listener="#{qTDetailBB.changePbSecretaryCommType(approverSettings)}"
								partialSubmit="true" />
						</p:selectOneMenu>
					</c:when>
					<c:otherwise>
						#{approverSettings.committeeType.parameterCode}
					</c:otherwise>
				</c:choose>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.secretary.name']}">
				<h:panelGroup id="commTypes">
					<c:choose>
						<c:when test="#{!empty fcaApprovalTab.scQtApproval.scQtApprovalDtls and empty fcaApprovalTab.scQtApproval.scQtApprovalDtls[0].submissionDate}">
							<p:selectOneMenu id="usersSecretaryId"
								value="#{approverSettings.pmUser.userId}"
								style="width: 178px;margin-bottom: 5px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems var="usersSecretary"
									value="#{qTDetailBB.retrievePmUserSecratryDtl(approverSettings.committeeType.parameterCode)}"
									itemLabel="#{usersSecretary.userName}"
									itemValue="#{usersSecretary.userId}" />
								<p:ajax event="change"
									listener="#{qTDetailBB.updateUserIdToSettings}" process="@this"
									partialSubmit="true" update="@this" />
							</p:selectOneMenu>
						</c:when>
						<c:otherwise>
							#{approverSettings.pmUser.userName}
						</c:otherwise>
					</c:choose>
				</h:panelGroup>
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel  id="fcuploads" header="#{lbl['lbl.sc.remark']}" toggleable="true"
		>
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid id="cancelRemarks"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{fcaApprovalRemarkList}" var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}"
										disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;"
										disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" /></td>
							</tr>
						</table>
					</p:dataGrid></td>

				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>

				<td class="TableFieldRight">
					<table style="width: 100%;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="fcAttachDlg.show();return false;"
									update="fcuploads" value="#{lbl['lbl.btn.attach.files']}" disabled="#{qTDetailBB.approvalDtlsEditable(fcaApprovalTab.scQtApproval)}" >
									<f:setPropertyActionListener value="#{fcaApprovalTab.scQtApproval}"
										target="#{approvalBackingBean.managedBean.scQtApproval}" />
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="fcAttachId"
									emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
									value="#{fcaApprovalTab.scQtApproval.scQtApprovalAttachments}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage value="/css/images/design/#{approvalBackingBean.determineIcon(attachFile)}" height="30" width="30"/>
											</td>
											<td><h:outputText value="#{attachFile.createdUser.userName}" />,
												<h:outputText value="#{attachFile.createdDate}">
													<f:convertDateTime
														pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font" immediate="true"
													action="#{approvalBackingBean.downloadFile(attachFile)}"
													disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />
												<p:commandLink
													action="#{approvalBackingBean.deleteFile(attachFile)}"
													immediate="true" update="@([id$=fcAttachId])"
													disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}">
													<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/icon_trash.png" styleClass="tasklist_title1" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>

	<p:dialog id="fcAttachedDlgids" widgetVar="fcAttachDlg" modal="true"
		dynamic="true" resizable="false" width="700px" height="200"
		styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleFileUpload}"
			mode="advanced" id="fcdialogsuploadids"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" 
			cancelLabel="#{lbl['lbl.btn.cancel']}"
			update="fcuploads" oncomplete="fcAttachDlg.hide()">
		</p:fileUpload>
	</p:dialog>


</ui:composition>
