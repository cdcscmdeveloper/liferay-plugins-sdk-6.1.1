<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable var="historyDtls" style="width:100%"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{approvalDtlsList.historyApprovalRequests}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
			<ui:remove>#21692 epv history - Start</ui:remove>
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approvalType)}" 
					rendered="#{!qTDetailBB.isApprovalTypeEpv(historyDtls.approvalType)}"/>
				<p:commandLink process="@this" partialSubmit="true" 
				action="#{qTDetailBB.getEpvApprovalDtl(historyDtls)}" value="#{approvalBackingBean.getParameterDesc(historyDtls.approvalType)}"
				rendered="#{qTDetailBB.isApprovalTypeEpv(historyDtls.approvalType)}"/>
			<ui:remove>#21692 epv history - End</ui:remove>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.approved.by']}">
				<h:outputText value="#{historyDtls.approverId.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.status']}">
			<ui:remove>21692 - Start</ui:remove>
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approverAction)}"
					rendered="#{historyDtls.decessionType eq null}"/>
				<h:outputText
					value="#{approvalBackingBean.retrieveApproverAction(historyDtls)}"
					rendered="#{historyDtls.decessionType ne null}"/>
			<ui:remove>21692 - End</ui:remove>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.date']}">
				<h:outputText value="#{historyDtls.approverActionDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
