<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:spacer height="5" />
	<p:panel header="history" toggleable="true">
		<p:dataTable var="historyDtls" style="width:100%"
			value="#{approvalDtlsList.historyApprovalRequests}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approvalType)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.appby']}">
				<h:outputText value="#{historyDtls.approverId.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.status']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approverAction)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.date']}">
				<h:outputText value="#{historyDtls.approverActionDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>




</ui:composition>
