<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="publicationapprovalTbl"
		header="#{lbl['lbl.sc.qt.approver.selection']}"
		toggleable="true">
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.public.approval.instruction']}" escape="false" />
		
		<p:spacer height="3" />
		<div style="width: 100%">
			<p:pickList id="publicationapproverid"
				disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.publicationApproval)}"
				value="#{qTDetailBB.managedBean.publicationApprovals}"
				var="publicationUser" showTargetControls="true"
				itemLabel="#{publicationUser.pmUser.userName}"
				itemValue="#{publicationUser}" converter="approverPickListConverter">
				<f:facet name="sourceCaption">#{lbl['lbl.sc.available']} </f:facet>
				<f:facet name="targetCaption">#{lbl['lbl.sc.selected']}</f:facet>
			</p:pickList>
		</div>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{qTDetailBB.managedBean.publicationApproval.scQtApprovalRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{qTDetailBB.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}"
										disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.publicationApproval)}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;"
										disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.publicationApproval)}" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>


</ui:composition>
