<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel id="publicationapprovalTbl"
		header="#{lbl['lbl.sc.publication.approval.setting']}"
		toggleable="true">
		<p:spacer height="3" />
		<div style="width: 100%">
			<p:pickList id="publicationapproverid"
				value="#{qTDetailBB.managedBean.publicationApprovals}"
				var="publicationUser" showTargetControls="true"
				itemLabel="#{publicationUser.approver.userName}"
				itemValue="#{publicationUser}" converter="approverPickListConverter">
				<f:facet name="sourceCaption">Available </f:facet>
				<f:facet name="targetCaption">Selected</f:facet>
			</p:pickList>
		</div>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="Remark" /></td>
				<td class="TableFieldRight"><p:dataGrid
						value="#{qTDetailBB.managedBean.publicationApproval.scQtApprovalRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{qTDetailBB.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.qt.history']}" toggleable="true">
		<p:dataTable>
			<p:column headerText="#{lbl['lbl.sc.qt.appby']}">
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.status']}">
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.date']}">
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
