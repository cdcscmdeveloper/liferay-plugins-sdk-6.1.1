<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:param name="isPubApprovalDtlsEditable" value="#{!qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.publicationApproval)}" />

	<p:panel id="publicationapprovalTbl"
		header="#{lbl['lbl.sc.qt.approver.selection']}"
		toggleable="true">
		<h:outputText  styleClass="instruction" value="#{lbl['lbl.sc.qt.public.approval.instruction']}" escape="false" />
		
		<p:spacer height="3" />
		<div style="width: 100%">
			<p:pickList id="publicationapproverid"
				disabled="#{!isPubApprovalDtlsEditable}"
				value="#{qTDetailBB.managedBean.publicationApprovals}"
				var="publicationUser" showTargetControls="true"
				itemLabel="#{publicationUser.pmUser.userName}"
				itemValue="#{publicationUser}" converter="approverPickListConverter">
				<f:facet name="sourceCaption">#{lbl['lbl.sc.available']} </f:facet>
				<f:facet name="targetCaption">#{lbl['lbl.sc.selected']}</f:facet>
			</p:pickList>
		</div>
	</p:panel>
	
	<ac:scRemarkAndAttachment
		remarkList="#{qTDetailBB.managedBean.publicationApproval.scQtApprovalRemarks}"
		showAttachment="false"
		readonly="#{!isPubApprovalDtlsEditable}" />
		
</ui:composition>
