<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<p:dataTable id="ptjreqdtlsid" var="ptjrequestdetails"
			value="#{ptjApprovalDtlsList}" rowIndexVar="index" editable="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{ptjrequestdetails}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(ptjrequestdetails.approvalType)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.from.value']}">
				<h:outputText value="#{ptjrequestdetails.originalValue}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.to.value']}">
				<h:outputText value="#{ptjrequestdetails.changedValue}" />
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.qt.approver.selection']}" toggleable="true">
		
		<div style="width: 100%">
			<p:pickList id="ptjapproverid" value="#{ptjList}"
				disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}"
				var="ptjapproverUser" showTargetControls="true"
				itemLabel="#{ptjapproverUser.pmUser.userName}"
				itemValue="#{ptjapproverUser}" converter="approverPickListConverter">
				<f:facet name="sourceCaption">#{lbl['lbl.sc.available']} </f:facet>
				<f:facet name="targetCaption">#{lbl['lbl.sc.selected']}</f:facet>
			</p:pickList>
		</div>
	</p:panel>


	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true"
		id="uploadfileid">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{ptjApprovalRemarkList}" var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}"
										disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;"
										disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" /></td>
							</tr>
						</table>
					</p:dataGrid></td>

				<td class="TableFieldLeft"><p:outputLabel
						value="#{lbl['lbl.sc.supporting.document']}" /></td>
				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="attachDlg.show();return false;"
									update="uploadfileid"
									value="#{lbl['lbl.btn.attach.files']}" disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" >
								</p:commandButton></td>
						</tr>
						<tr>
							<td />
							<td><p:dataGrid id="attachmentId"
									value="#{approvalBackingBean.managedBean.attachments}"
									var="attachFile" rowIndexVar="attachFileIndex" columns="1"
									style="width:100%">
									<table>
										<tr>
											<td rowspan="2" style="vertical-align: top;" align="left">
												<h:graphicImage value="/css/images/design/#{approvalBackingBean.determineIcon(attachFile)}" height="30" width="30"/>
											</td>
											<td><h:outputText value="#{attachFile.user.userName}" />,
												<h:outputText value="#{attachFile.changedDate}">
													<f:convertDateTime
														pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
												</h:outputText></td>
										</tr>
										<tr>
											<td><h:commandLink value="#{attachFile.fileName}"
													styleClass="blue_font"
													disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}" />
												<p:commandLink
													action="#{approvalBackingBean.deleteUploadFile}"
													immediate="true" update="attachmentId"
													disabled="#{qTDetailBB.approvalDtlsEditable(qTDetailBB.managedBean.selectedApprovalTabBean.scQtApproval)}">
													<h:graphicImage value="#{CommonUIConstant.imagePathUptoDesign}/icon_trash.png" styleClass="tasklist_title1" />
												</p:commandLink></td>
										</tr>
									</table>
								</p:dataGrid></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>

	

	<p:dialog id="attachfileDlgids" widgetVar="attachDlg" modal="true"
		dynamic="true" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.txt.choose.files']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleFileUpload}"
			mode="advanced" id="uploadfilesids"
			sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
			allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
			invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
			label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" 
			cancelLabel="#{lbl['lbl.btn.cancel']}"
			update="uploadfileid" oncomplete="attachDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
