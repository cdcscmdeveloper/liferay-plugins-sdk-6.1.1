<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	
	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable var="historyDtls" style="width:100%"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{approvalDtlsList.historyApprovalRequests}">
			<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approvalType)}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.approved.by']}">
				<h:outputText value="#{historyDtls.approverName}" />
			</p:column>
			<p:column>
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.qt.publishing.period.request.decision']}" />
				<ac:iconTooltip
					value="#{lbl['lbl.sc.qt.publishing.period.tooltip1']}#{lbl['lbl.sc.qt.publishing.period.tooltip2']}#{lbl['lbl.sc.qt.publishing.period.tooltip3']}
						#{lbl['lbl.sc.qt.publishing.period.tooltip4']}#{lbl['lbl.sc.qt.publishing.period.tooltip5']}" />
			</f:facet>
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approverAction)}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.decision.date']}">
				<h:outputText value="#{historyDtls.approverActionDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.txt.action']}">
				<p:commandLink
					action="#{qTDetailBB.geteGPAApprovalDtl(historyDtls)}">
					<ui:fragment>
						<h:graphicImage value="/css/images/design/ico-view.png" />
					</ui:fragment>
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
