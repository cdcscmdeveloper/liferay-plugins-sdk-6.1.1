<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	
	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable var="historyDtls" style="width:100%"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{approvalDtlsList.historyApprovalRequests}">
			<p:column headerText="#{lbl['lbl.sc.qt.publishing.period.request.type']}">
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approvalType)}" 
					rendered="#{!qTDetailBB.isApprovalTypeEpv(historyDtls.approvalType)}"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.publishing.period.approved.by']}">
				<h:outputText value="#{historyDtls.approverId.userName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.publishing.period.request.decision']}">
			<ui:remove>21692 - Start</ui:remove>
				<h:outputText
					value="#{approvalBackingBean.getParameterDesc(historyDtls.approverAction)}"
					rendered="#{historyDtls.decisionType eq null}"/>
				<h:outputText
					value="#{approvalBackingBean.retrieveApproverAction(historyDtls)}"
					rendered="#{historyDtls.decisionType ne null}"/>
			<ui:remove>21692 - End</ui:remove>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.publishing.period.decision.date']}">
				<h:outputText value="#{historyDtls.approverActionDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
				</h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.qt.publishing.period.action']}">
				<h:graphicImage value="/css/images/design/ico-view.png" />
				<!--<p:commandLink
					action="#{specificationBackingBean.technicalChecklistEditAction(index,stageTwoTechnical,SourcingConstants.TECHNICAL_TEMPLATE)}">
					<ui:fragment>
						<h:graphicImage value="/css/images/design/ico-view.png" />
					</ui:fragment>
					<f:setPropertyActionListener value="#{stageTwoTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />
				</p:commandLink>-->
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
