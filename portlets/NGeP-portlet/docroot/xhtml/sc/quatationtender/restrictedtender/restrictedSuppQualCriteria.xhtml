<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">

		<p:dataTable id="restrictedPnlId" var="restrcitedCateGory"
			widgetVar="restrictedCategoryCodes"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList}"
			rowIndexVar="index" styleClass="restrictedPnlId" rows="10"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedRestrictedCategoryList}"
			rowKey="#{restrcitedCateGory}">

			<p:column selectionMode="multiple" style="width:1%" />

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:20%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.spec.category.code']}" />
				</f:facet>
				<p:inputText
					value="#{restrcitedCateGory.pmCategoryL1.categoryL1Code}"
					maxlength="2" size="1" style="margin-right: 3px !important;">
					<p:ajax event="blur"
						update=":form:restrictedtendertabView:restrictedPnlId"
						partialSubmit="true" process="@this"
						listener="#{qTSupplierQulCriteriaBackingBean.updatedQtCategoryL1Code(restrcitedCateGory)}" />
				</p:inputText>

				<p:inputText
					value="#{restrcitedCateGory.pmCategoryL2.categoryL2Code}" size="1">
					<p:ajax event="blur"
						update=":form:restrictedtendertabView:restrictedPnlId"
						partialSubmit="true" maxlength="2" process="@this"
						listener="#{qTSupplierQulCriteriaBackingBean.updatedQtCategoryL2Code(restrcitedCateGory)}" />
				</p:inputText>

				<ac:lov id="restrictedPtj" lovId="PM_CATEGORY_L3" size="1"
					headerText="Category Lov"
					saveObject="qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList[#{index}].pmCategoryL3"
					postUpdateListener="qTSupplierQulCriteriaBackingBean.restrictedCategoryCodesUpdate(#{index},qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList, qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList[#{index}].pmCategoryL3)"
					value="#{restrcitedCateGory.pmCategoryL3.categoryL3Code}"
					update=":form:restrictedtendertabView:restrictedPnlId">
				</ac:lov>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:28%; white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:28%; white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:28%; white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(restrcitedCateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mandatory']}"
				style="text-align: center;">
				<p:selectBooleanCheckbox value="#{restrcitedCateGory.mandatory}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, restrictedPnlId" partialSubmit="true"
				update="restrictedPnlId" icon="ui-icon-add"
				actionListener="#{qTSupplierQulCriteriaBackingBean.addNewRestrictedCategoryAction}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, restrictedPnlId" icon="ui-icon-delete"
				action="#{qTSupplierQulCriteriaBackingBean.deleteRestrictedCategoryAction}"
				update="restrictedPnlId" />
		</div>
		<ac:lovPopup />
	</p:panel>
</ui:composition>
