<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">
		<p:dataTable id="restrictedPnlId" var="cateGory"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
			style="width:100%" rowIndexVar="index" styleClass="restrictedPnlId">

			<p:column headerText="#{lbl['lbl.sc.spec.category.code']}"
				style="width:15%">
				<ac:lov id="restrictedPtj" lovId="PM_CATEGORY_L3"
					headerText="Category Lov"
					saveObject="qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList[#{index}].pmCategoryL3"
					value="#{cateGory.pmCategoryL3.categoryL3Code}"
					update=":form:qtsubId:restrictedtendertabView:restrictedPnlId">
				</ac:lov>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
				style="width:15%">
				<h:outputText
					value="#{cateGory.pmCategoryL3.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
				style="width:20%">
				<h:outputText value="#{cateGory.pmCategoryL3.catType}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mandatory']}">
				<p:selectBooleanCheckbox value="#{cateGory.mandatory}"
					disabled="#{!qTDetailBB.managedBean.editable}" />
			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
				partialSubmit="true" update="restrictedPnlId" icon="ui-icon-add"
				actionListener="#{qTSupplierQulCriteriaBackingBean.addNewCategoryAction}" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" update="restrictedPnlId" />
		</div>
		<ac:lovPopup />

	</p:panel>
</ui:composition>
