<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel>
		<ui:param name="categoryPnlsGroupIds" value="categoryopenGroupsIds" />
		<h:panelGroup id="categoryopenGroupsIds">
			<ui:param name="criteriaList"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}" />
			<ui:param name="criteriaselectList"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}" />
			<ui:param name="criteriaPnlId" value="openCriteriaListId" />
			<ui:include src="/xhtml/sc/quatationtender/categoryList.xhtml" />

			<div align="right">
				<p:commandButton value="#{lbl['lbl.so.addbtn']}"
					rendered="#{qTDetailBB.managedBean.editable}"
					actionListener="#{qTSupplierQulCriteriaBackingBean.addNewCategoryAction}"
					update="#{criteriaPnlId}" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.so.delete']}"
					rendered="#{qTDetailBB.managedBean.editable}" icon="ui-icon-delete" />
			</div>
		</h:panelGroup>
	</p:panel>
</ui:composition>
