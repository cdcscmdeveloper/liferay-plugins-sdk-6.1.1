<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code.list']}"
		toggleable="true">

		<p:dataTable id="restrictedPnlId" var="restrcitedCateGory"
			widgetVar="restrictedCategoryCodes"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList}"
			rowIndexVar="index" styleClass="restrictedPnlId" rows="10"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedRestrictedCategoryList}"
			rowKey="#{restrcitedCateGory}">

			<p:column selectionMode="multiple" style="width:1%" />

			<p:column headerText="#{lbl['lbl.sc.category.code']}"
				style="width:20%">
				#{restrcitedCateGory.pmCategoryL1.categoryL1Code}#{restrcitedCateGory.pmCategoryL2.categoryL2Code}#{restrcitedCateGory.pmCategoryL3.categoryL3Code}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="width:28%; white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="width:28%; white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="width:28%; white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(restrcitedCateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mandatory']}"
				style="text-align: center;">
				<p:selectBooleanCheckbox value="#{restrcitedCateGory.mandatory}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, restrictedPnlId" partialSubmit="true" update="@([id$=catCodePopup])"
				oncomplete="catCodePopup.show();"
				action="#{categoryCodeSearchBackingBean.renewSesionObject}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, restrictedPnlId" 
				action="#{qTSupplierQulCriteriaBackingBean.deleteRestrictedCategoryAction}"
				update="restrictedPnlId" />
		</div>
		
		<ac:categoryCodePopup 
			okAction="qTSupplierQulCriteriaBackingBean.addNewRestrictedCategoryAction"
			update="@([id$=restrictedPnlId])" />
	</p:panel>
</ui:composition>
