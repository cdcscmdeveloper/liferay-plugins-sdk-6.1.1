<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="supplierlists" header="Supplier List" toggleable="true">
		<p:dataTable id="suppliersTbls" var="qtSupplier"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtSupplierList}">

			<ac:paginator for="suppliersTbls" />

			<p:column headerText="#{lbl['lbl.so.suppliername']}">
				<h:outputText
					value="#{qtSupplier.smSupplier.smAppl.smCompanyBasic.companyName}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText
					value="#{qtSupplier.smSupplier.smMofAccounts[0].mofNo}"
					rendered="#{false}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText
					value="#{qtSupplier.smSupplier.smMofAccounts[0].expDate}"
					rendered="#{false}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText value="Active" />
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton id="suppliersearchid"
				value="#{lbl['lbl.so.searchbtn']}" process="@this"
				action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierAction}"
				oncomplete="searchsupplierdialog.show();"
				update="@(.restrictSearchSupp)" style="float:right;"/>

			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />
		</div>
		<br />
		<h:outputText value="#{lbl['lbl.so.totalsup']}" />
		<p:spacer width="5" />
		<p:inputText
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSupplier}"
			disabled="true" />
		<p:spacer height="5" />
	</p:panel>
</ui:composition>
