<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.circular.no']}" />
			</h:column>
			<h:column>  
	           	<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.ctCircular.latestCircularVer.circularNo}" disabled="true"/>
	           	<p:spacer width="5" />
	           	<p:commandLink  style="margin-right:20px;">
	           		<h:outputText value="#{lbl['lbl.sc.circular.attach']}" />  
	    		</p:commandLink>
	           </h:column>
	           
	        <h:column>
				<h:outputLabel value="#{lbl['lbl.sc.circular.exp.date']}" />  
			</h:column>
			<h:column>  
	           	<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.ctCircular.latestCircularVer.endDate}" disabled="true"/>
	        </h:column>
	   	</h:panelGrid>
		<p:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:commandButton value="#{lbl['lbl.btn.search']}" style="float:right;"
				partialSubmit="true"
				process="@this"
				update="suppPopup"
				action="#{qTSupplierQulCriteriaBackingBean.searchPanelSupplierPopupAction}"
				oncomplete="suppdlg.show();" 
				rendered="#{!qTDetailBB.managedBean.readOnly}" />
		</p:panelGrid>
	
	<ui:include src="supplierlist.xhtml" />	
	
	<p:dialog id="suppPopup" header="#{lbl['lbl.sc.qt.search.supplier']}" widgetVar="suppdlg" modal="false" appendToBody="false" width="800" height="400">
		<ui:include src="panelSupplierSearch.xhtml" />
		<div>           
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" style="float:right;" oncomplete="suppdlg.hide()" />
			<p:commandButton value="#{lbl['lbl.btn.ok']}" 
				style="float:right;" 
				update="suppQualPnl, supplierlist"
				action="#{qTSupplierQulCriteriaBackingBean.addPanelToSupplierListAction}"  
				oncomplete="suppdlg.hide()"  />
		</div>
	</p:dialog>
</ui:composition>
