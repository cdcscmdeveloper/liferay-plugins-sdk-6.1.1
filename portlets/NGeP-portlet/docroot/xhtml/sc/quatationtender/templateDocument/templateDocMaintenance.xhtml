<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<p:messages id="templateDocmessages" showDetail="true"
		autoUpdate="true" closable="true" />
	<ui:define name="contentSection">
		<div>
			<p:commandButton value="Back" style="float:left;" icon="ui-icon-back"
				action="#{qTDocumentsBackingBean.documentBackAction}" />
		</div>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.save']}"
				action="#{qTDocumentsBackingBean.saveAction}" icon="ui-icon-save" />
		</div>
		<p:spacer height="2" />
		<p:panel>
			<table>
				<tr>
					<td style="width: 120px;"><h:outputLabel value="Report Section" /></td>
					<td colspan="3"><p:inputText value="#{qTDocumentsBackingBean.managedBean.scQtDocReport.title}" disabled="true" size="90" /></td>
				</tr>
			</table>
		</p:panel>
		<p:spacer height="3" />
		<p:panel>
			<ui:include src="/xhtml/tpl/doc/templateDocMaintSection.xhtml" />
		</p:panel>
	</ui:define>
</ui:composition>
