<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isQTStatusPendingQtSubmission" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_PENDING_QT_SUBMISSION}" />
	<ui:param name="isQTStatusPendingScheduleAndBefore" value="#{qTDetailBB.isQTStatusLessThanOrEquals(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
	<!-- 26095@hatta - start -->
	<ui:param name="isQTClosePermanently" value="#{qTDetailBB.managedBean.qt.qtStatus.statusId eq QTStatusConst.QT_CLOSE_PERMANENTLY}" />
	<ui:param name="iscloseQTIfValidityPeriodExpiredAndStatusRelated" value="#{qTDetailBB.closeQTIfValidityPeriodExpiredAndStatusRelated()}" />
	<!-- 26095@hatta - end -->
				
		<table width="100%">
		<tr>
		<td style="vertical-align: bottom;" align="right">
			<!-- 25692 -start- -->
			<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
					style="float:right;"
					action="#{pmTrackingDiaryBackingBean.redirectToTrackingDiary(ParameterConst.doctypeQuotation, qTDetailBB.managedBean.qt.qtId)}"
					immediate="true" rendered="#{qTDetailBB.managedBean.maintanceFlow and !qTDetailBB.approvalScreen}"/>
			<!-- 25692 -end- -->
		</td>
		</tr>
		<tr>
		<td align="right">
			<c:if test="#{qTDetailBB.managedBean.taskId eq null and qTDetailBB.managedBean.maintanceFlow}">
				<p:commandButton value="#{lbl['lbl.btn.back']}" style="float:left;"
					action="#{qTDetailBB.gotoQtSearchPage}"
					partialSubmit="true"
					process="@this"
					update="@this" />
			</c:if>

			<ui:remove> ***25692 - start </ui:remove> 
			<c:if test="#{qTDetailBB.approvalScreen and qTDetailBB.managedBean.readOnly}">

					<div class="ppRightBtn">
						<ui:remove>#13344 Start</ui:remove>
						<p:commandButton value="#{lbl['lbl.btn.save']}"
							action="#{qTDetailBB.saveQtCAApproval}" process="@form"
							partialSubmit="true" onclick="blockWidget.show();"
							oncomplete="blockWidget.hide();" update="@form"
							rendered="#{isCommitteeApprovalTask}"
							disabled="#{!qTDetailBB.managedBean.ptjPresent}" />
						<ui:remove>#13344 End</ui:remove>

						<h:panelGroup id="approverBtns">
							<ui:param name="readOnlyTask" value="#{approvalBackingBean.managedBean.readOnly}" />
							<!-- 28932,25692 -start- -->
							<ui:decorate template="/WEB-INF/facelets/templates/claim_template_true.xhtml">
								<!-- 28932,25692 -end- -->
								<ui:define name="outComeSection">
									<ui:repeat var="bpmAction"
										value="#{approvalBackingBean.managedBean.outComes}">
										<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />

										<p:commandButton value="#{lbl[buttonLabel]}" update="@form"
											styleClass="ui-button" onstart="blockWidget.show();"
											oncomplete="blockWidget.hide();"
											action="#{approvalBackingBean.approvalBpmTask(bpmAction)}" />
									</ui:repeat>
								</ui:define>
							</ui:decorate>
						</h:panelGroup>
					</div>
				</c:if> 
				<ui:remove> ***25692 - end </ui:remove> 
				
			<c:if test="#{!qTDetailBB.managedBean.readOnly}">
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					action="#{qTDetailBB.saveQtDetailsAction}" process="@form" partialSubmit="true"
					onclick="blockWidget.show();"
					oncomplete="blockWidget.hide();"
					update="@form"
					rendered="#{isQTStatusPendingScheduleAndBefore or !qTDetailBB.managedBean.maintanceFlow}" 
					disabled="#{!qTDetailBB.managedBean.ptjPresent}"/>

				<c:choose>
					<c:when test="#{qTDetailBB.managedBean.taskId ne null}">
						<ui:repeat var="bpmAction"
							value="#{qTDetailBB.managedBean.outComes}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<p:commandButton value="#{lbl[buttonLabel]}"
								styleClass="ui-button"
								onclick="blockWidget.show();"
								oncomplete="blockWidget.hide();"
								action="#{qTDetailBB.updateBpmTask(bpmAction)}" />
						</ui:repeat>
					</c:when>
					<c:when test="#{qTDetailBB.managedBean.createQt or isQTStatusPendingQtSubmission}">
						<p:commandButton value="#{lbl['lbl.btn.submit']}"
							action="#{qTDetailBB.submitQTDetailsAction}" process="@form"
							update="@all"
							onclick="blockWidget.show();"
							oncomplete="blockWidget.hide();" disabled="#{!qTDetailBB.managedBean.ptjPresent}"/>
					</c:when>
					<c:otherwise>
							<p:commandButton value="#{lbl['lbl.btn.submit']}"
								styleClass="amendButton"
								action="#{qTDetailBB.submitQtDetailsFormMaintanace}"
								process="@form" update="@all" onclick="blockWidget.show();"
								oncomplete="blockWidget.hide();"
								rendered="#{qTDetailBB.isQTStatusInBetween(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_PB_APPROVAL, QTStatusConst.QT_PENDING_LOA)}"
								disabled="#{qTDetailBB.isQTStatusPublished(qTDetailBB.managedBean.qt.qtStatus.statusId) and 
								(empty qTDetailBB.managedBean.amendMentBean or !qTDetailBB.managedBean.amendMentBean.brandNew) and !qTDetailBB.managedBean.changesOnQTMaintenance}" />
						</c:otherwise>
				</c:choose>

				<!-- 26095@hatta - start -->
				<c:if test="#{iscloseQTIfValidityPeriodExpiredAndStatusRelated}">
					<p:commandButton value="#{lbl['lbl.sc.qt.close']}" process="@this" style="float:right;"
			  	       action="#{qTDetailBB.closeQTDialogPopUp}" disabled="#{isQTClosePermanently}" />	
			  	</c:if>		
				<c:if test="#{qTDetailBB.isQTStatusInBetween(qTDetailBB.managedBean.qt.qtStatus.statusId, QTStatusConst.QT_PENDING_QT_SUBMISSION, QTStatusConst.QT_PENDING_LOA)}">
					<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
						style="float:right;" 
						action="#{qTDetailBB.checkIsQTAllowCancel}" disabled="#{qTDetailBB.managedBean.qt.brandNew}"/>
				</c:if>
			  	<!-- 26095@hatta - end -->
			</c:if>
					
			</td>
		</tr>
		</table>
			
		<p:dialog id="cancelQTDlg" widgetVar="cancelQTDlg"
			header="#{lbl['lbl.sc.cancel.confirm']}" resizable="false"
			width="30%" height="100" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.sc.dialog.confirm.cancel']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					oncomplete="cancelQTDlg.hide();" partialSubmit="true" process="@this"
					action="#{qTDetailBB.cancelQtDetails}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					onclick="cancelQTDlg.hide();" type="button" partialSubmit="true"  process="@this"/>
			</div>
		</p:dialog>
		<!-- 26095@hatta - start -->
		<p:dialog id="closeQTDlg" widgetVar="closeQTDlg"
			header="#{lbl['lbl.sc.qt.close.confirmation']}" resizable="false"
			width="auto" height="100" closable="false">
			<table>
				<tr><td style="float:left;"><p:outputLabel value="#{lbl['lbl.sc.qt.close.dialog.confirmation.first']}" /></td></tr>
				<tr><td style="float:left;"><p:outputLabel value="#{lbl['lbl.sc.qt.close.dialog.confirmation.second']}" /></td></tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
					oncomplete="closeQTDlg.hide();" partialSubmit="true" process="@this"
					action="#{qTDetailBB.closeQtDetails}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
					onclick="closeQTDlg.hide();" type="button" partialSubmit="true"  process="@this"/>
			</div>
		</p:dialog>
		<!-- 26095@hatta - end -->

		<!-- 15391 Start -->
		<p:dialog id="specCommAlertdialog" widgetVar="specCommAlert"
			header="#{lbl['lbl.sc.confirmation']}" resizable="false"
			width="30%" height="100" closable="false">
			<table>
				<tr>
					<td style="float: left;">
						<p:outputLabel
							value="#{lbl['lbl.sc.popup.checkBeforePublish2']}" />
					</td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="OK" onclick="specCommAlert.hide();" partialSubmit="true" process="@this" />
			</div>
		</p:dialog>
		<!-- 15391 End  -->
</ui:composition>
