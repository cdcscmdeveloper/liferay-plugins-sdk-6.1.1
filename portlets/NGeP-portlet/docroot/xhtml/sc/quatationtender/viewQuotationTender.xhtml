<!-- 26095@hatta - start -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
			          <p:panel id="closeQTViewOnly" header="#{lbl['lbl.sc.qt.close.panel']}" toggleable="true">	
			                      <table style="width: 100%">
			                            <tr>
										     <td>
												<table style="width: 100%">
													<tr>
														<td class="TableFieldLeft" width="28%"><p:outputLabel value="#{lbl['lbl.sc.sf.justification']}" /></td>
														<td class="TableFieldRight">
														     <p:dataGrid value="#{qTDetailBB.managedBean.qt.scCloseQTRemark}" 
															    var="remarkVar" rowIndexVar="remarkIndex" columns="1"
															    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" >
															        <table>
																		<tr>
																			<td rowspan="2" valign="top"><h:graphicImage
																					value="#{qTDetailBB.userImagePath(qTDetailBB.getUserLoginId())}"
																					height="30" width="30" /></td>
																			<td width="5"></td>
																			<td><h:outputText value="#{qTDetailBB.getUsername()}" />,
																				<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
																					<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
																				</h:outputText></td>
																		</tr>
																		<tr>
																			<td></td>
																			<td><p:inputTextarea cols="40" value="#{remarkVar.remark}" disabled="true"/></td>
																		</tr>
																	</table>
															</p:dataGrid>
													   </td>
													</tr>
												</table>    					
										      </td>
										 </tr>
										 <tr>
										      <td>
									            <table style="width: 100%">
													<tr>
														<td class="TableFieldLeft" width="28%"><p:outputLabel value="#{lbl['lbl.sc.supporting.document']}" /> </td>
														<td class="TableFieldRight">
															  <p:dataGrid
															 		emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
																	var="attachFile"
																	value="#{qTDetailBB.managedBean.qt.scCloseQTAttachment}"
																	rowIndexVar="attachFileIndex" columns="1" style="width:100%">
																	<table>
																		<tr>
																			<td>
																			     <h:commandLink value="#{attachFile.fileName}"
																					styleClass="blue_font" immediate="true"
																					action="#{qTDetailBB.downloadFile(attachFile)}" />
																			</td>
																		</tr>
																	</table>
																</p:dataGrid>
														</td>
													</tr>
												</table>
									        </td>
										</tr>
									</table>
			          </p:panel>  
</ui:composition>
<!-- 26095@hatta - end -->
