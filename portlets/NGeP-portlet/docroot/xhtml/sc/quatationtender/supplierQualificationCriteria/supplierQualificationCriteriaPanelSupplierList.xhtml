<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="totalSuppliersPanleyes">
		<p:panel id="ctZoneList"
			header="#{lbl['lbl.sc.location.details']}/#{lbl['lbl.sc.supplier.list']}"
			toggleable="true">
			<ui:fragment
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.ctzones eq 'true'}">
				<p:dataTable id="ctSupplierTreeZones" rows="10"
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneGeneralTrees}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					var="ctZones" rowIndexVar="index" dynamic="true">
					<p:column headerText="#{lbl['lbl.sc.zone']}" style="width:90%">
						<p:tree value="#{ctZones}" var="location" selectionMode="single">
							<p:ajax event="select" update="@([id$=totalSuppliersPanleyes])"
								listener="#{qTSupplierQulCriteriaBackingBean.retriveZoneBySupplier}" />

							<p:ajax event="unselect"
								listener="#{qTSupplierQulCriteriaBackingBean.unSelectPanelYesTreenode}" />
							<p:treeNode type="zone">
								<h:outputText value="#{location.zoneName}" />
							</p:treeNode>
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>
						</p:tree>
					</p:column>
				</p:dataTable>
				<br/>
				<ui:fragment
					rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.tplSpecZoneDtl ne null and qTSupplierQulCriteriaBackingBean.managedBean.tplSpecZoneDtl.zoneName ne null}">
					#{qTSupplierQulCriteriaBackingBean.managedBean.tplSpecZoneDtl.zoneName}>#{lbl['lbl.sc.supplier.list']}
				</ui:fragment>
			</ui:fragment>
			<ui:include
				src="supplierQualificationCriteriaPanelSupplierListDtls.xhtml" />
		</p:panel>
	</h:panelGroup>

</ui:composition>
