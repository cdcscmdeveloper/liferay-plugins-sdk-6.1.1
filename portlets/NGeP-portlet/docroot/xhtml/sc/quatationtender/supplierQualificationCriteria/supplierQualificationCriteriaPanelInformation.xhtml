<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<h:panelGroup id="yesmainpanel">
		<h:panelGroup>
			<table style="width: 100%;">
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.circular.no']}" /></td>
					<td><p:inputText size="66"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.circularNo}"
						disabled="true"  />
						<p:spacer width="5" />
						<p:commandLink value="#{lbl['lbl.sc.circular.attach']}" 
						style="margin-right:20px;" process="@form,yesmainpanel"
						partialSubmit="true" update="circularItemDetails"
						action="#{qTSupplierQulCriteriaBackingBean.viewCircularAttachments}" /></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.circular.name']}" /></td>
					<td colspan="3"><p:inputTextarea rows="3" cols="75" style="margin-bottom:5px;width :73%;"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.circularName}"
						disabled="true" /></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.circular.exp.date']}" /></td>
					<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.circularExpDate}"
						disabled="true" size="66">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				</tr>
			</table>
			
		</h:panelGroup>

		<p:panel id="circularItemDetails"
			header="#{lbl['lbl.sc.qt.circular.item.details']}" toggleable="true">

			<p:dataTable id="itemdtlid" var="panelItem" rowIndexVar="index"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedpanelItems}"
				rowKey="#{panelItem}" rows="10">

				<ac:paginator for="itemdtlid" />

				<p:column headerText="#{lbl['lbl.sc.spec.panel.item']}"
					style="width:20%;white-space: normal;">
					<h:outputText value="#{panelItem.itemName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.specification']}"
					style="width:15%;white-space: normal;">
					<h:outputText value="#{panelItem.specification}" style="white-space: normal;word-wrap: break-word;" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.panel.item.category']}"
					style="width:10%">
					<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(panelItem.itemCategoryId)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.panel.coverage']}"
					style="width:5%">
					<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(panelItem.panelCoverageId)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.uom']}"
					style="width:15%">
					<h:outputText value="#{panelItem.pmUom.uomName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.min.order.quantity']}"
					style="width:15%">
					<h:outputText value="#{panelItem.minimumOrderQty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.luar.contract']}"
					style="width:20%">
					<h:outputText value="#{panelItem.maxProcureAmt}" />
				</p:column>
			</p:dataTable>
		</p:panel>
	</h:panelGroup>
</ui:composition>
