<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="panelpopupSuppDtl" widgetVar="suppDetails"
		resizable="false" position="top" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.supplier.details']}" width="500" height="500">
		<table style="width: 100%">
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.ep.no']}" /></td>
				<td><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctpanelSupplier.supplier.epNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td><p:inputText size="30" style=" margin-bottom:5px;"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctpanelSupplier.supplier.companyName}"
						readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.registration.type']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.registration.no']}" /></td>
				<td><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctpanelSupplier.supplier.regNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mofno']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.smMofAccount.mofNo}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.income.tax.ref.no']}" /></td>
				<td><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctpanelSupplier.supplier.smAppl.smCompanyBasic.incomeTaxNo}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.est.date']}" /></td>
				<td><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctpanelSupplier.supplier.establishDate}"
						size="30" readonly="true" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.type.of.company']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctpanelSupplier.supplier.businessType}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mofexp.date']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.smMofAccount.expDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.disciplinary.rating']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.branch']}" /></td>
				<td><p:inputText size="30" readonly="true" disabled="true"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierBranch}" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.address']}" /></td>
				<td><p:inputTextarea rows="3" cols="32" readonly="true"
						rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierAddress ne null}"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierAddress.address1}"
						disabled="true" style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.contact.person']}" /></td>
				<td><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierContact}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.designation']}" /></td>
				<td><p:inputText
						rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.personnel ne null}"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.personnel.designation}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierEmail}"
						size="30" readonly="true" disabled="true" /></td>
			</tr>
		</table>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.close']}"
				onclick="suppDetails.hide();" />
		</div>
	</p:dialog>
</ui:composition>
