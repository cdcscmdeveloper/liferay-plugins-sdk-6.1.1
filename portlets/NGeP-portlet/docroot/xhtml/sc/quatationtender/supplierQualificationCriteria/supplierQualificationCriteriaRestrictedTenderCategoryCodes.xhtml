<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.category.code.list']}"
		toggleable="true">
		
		<h:outputText styleClass="instruction" value="#{lbl['lbl.sc.category.code.list.instruction']}" escape="false" />

		<p:dataTable id="restrictedPnlId" var="restrcitedCateGory"
			widgetVar="restrictedCategoryCodes"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList}"
			rowIndexVar="index" rows="10"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedRestrictedCategoryList}"
			rowKey="#{restrcitedCateGory}">

			<p:column selectionMode="multiple" style="width:1%" />

			<p:column headerText="#{lbl['lbl.sc.category.code']}">
				#{restrcitedCateGory.pmCategoryL1.categoryL1Code}#{restrcitedCateGory.pmCategoryL2.categoryL2Code}#{restrcitedCateGory.pmCategoryL3.categoryL3Code}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="white-space: normal;">
				<h:outputText
					value="#{restrcitedCateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(restrcitedCateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" styleClass="BtnSpacing"
				process="@this, restrictedPnlId" partialSubmit="true" update="@([id$=catCodePopup])"
				oncomplete="catCodePopup.show();"
				action="#{categoryCodeSearchBackingBean.renewSesionObject}" 
				rendered1="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
				process="@this, restrictedPnlId" partialSubmit="true"
				oncomplete="supplierRestrictedCategoryDeletePopUp.show();"
				update="@([id$=#{supplierRestrictedCategoryDeleteId}])"
				rendered1="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}" />
		</div>
		<ui:param name="supplierRestrictedCategoryDeleteId" value="supplierRestrictedCategoryDeleteId" />
		<ac:confirmationPopup id="#{supplierRestrictedCategoryDeleteId}"
			widget="supplierRestrictedCategoryDeletePopUp"
			okAction="qTSupplierQulCriteriaBackingBean.deleteRestrictedCategoryAction" width="33%"
			height="100" title="#{lbl['lbl.sc.category.code']}"
			content="#{lbl['lbl.sc.dialog.confirm.category.codes']}"
			update="@([id$=restrictedPnlId])" />
			
		<ac:categoryCodePopup 
			okAction="qTSupplierQulCriteriaBackingBean.addNewRestrictedCategoryAction"
			update="@([id$=restrictedPnlId])" />
	</p:panel>
</ui:composition>
