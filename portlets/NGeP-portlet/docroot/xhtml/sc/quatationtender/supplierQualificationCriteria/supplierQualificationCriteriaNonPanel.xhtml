<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="openCategoryCodesPanel" header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.category.code.list.instruction']}"
			escape="false" />

		<p:dataTable id="openPnlId" var="cateGory" widgetVar="openCodes"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
			rowIndexVar="index" rows="10"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rowKey="#{cateGory}">
			  <ac:paginator for="openPnlId" />
	<p:ajax event="rowSelect" update="@([id$=supplierQualificationCriteriaNonpanelDeleteCategoryBtnId])" />
			<p:ajax event="rowUnselect" update="@([id$=supplierQualificationCriteriaNonpanelDeleteCategoryBtnId])" />
			<p:ajax event="rowSelectCheckbox" update="@([id$=supplierQualificationCriteriaNonpanelDeleteCategoryBtnId])" />
			<p:ajax event="rowUnselectCheckbox" update="@([id$=supplierQualificationCriteriaNonpanelDeleteCategoryBtnId])" />
			<p:ajax event="toggleSelect" update="@([id$=supplierQualificationCriteriaNonpanelDeleteCategoryBtnId])" />
			<p:column selectionMode="multiple" style="width:1%"
				rendered="#{!categoryCodeReadonly}" />

			<p:column headerText="#{lbl['lbl.sc.category.code']}">
				#{cateGory.pmCategoryL1.categoryL1Code}#{cateGory.pmCategoryL2.categoryL2Code}#{cateGory.pmCategoryL3.categoryL3Code}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL1Name}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL2Name}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3Name}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

		</p:dataTable>
		
		<table width="100%">
		  <tr>
		     <td>  
					<p:outputPanel rendered="#{not empty qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}">
					
					  <table  style="margin-top:10px !important;">
					     <tr>
						     <td>
				                <p:outputLabel value="#{lbl['lbl.sc.open.for']}" /><p:outputLabel
									value="*" styleClass="mandatory" rendered="#{!scQt.panel}" />               
				             </td>
				              <td>
						     	<c:choose>
					     				<!-- 29464 -start- -->
	                                   <c:when test="#{qTDetailBB.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_BPK_APPROVAL or 
	                                                   qTDetailBB.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_PUBLICATION_APPROVAL or 
	                                                   qTDetailBB.managedBean.currentStatusId eq QTStatusConst.QT_REVISION_PUBLICATION or
	                                                   qTDetailBB.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_PUBLICATION or
	                                                   qTDetailBB.managedBean.currentStatusId eq QTStatusConst.QT_PENDING_SPECIFICATION_COMMITTEE_APPOINTMENT}" >
					     				<!-- 29464 -end- -->
					                       <p:selectOneRadio label="#{lbl['lbl.sc.open.for']}" value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.openFor}" disabled="true" >
												 <f:selectItems value="#{createQtBB.getRadioButtonCodeValues(ParameterTypeConst.scOpenFor)}" />
												 <p:ajax event="change" process="@this" partialSubmit="true" update="@form" listener="#{createQtBB.openForChange}"></p:ajax>				
								           </p:selectOneRadio>	
							           </c:when>
							           <c:otherwise>  
										    <p:selectOneRadio required="true" label="#{lbl['lbl.sc.open.for']}" value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.openFor}" disabled="#{qTDetailBB.managedBean.readOnly}">
											 <f:selectItems value="#{createQtBB.getRadioButtonCodeValues(ParameterTypeConst.scOpenFor)}" />
												<p:ajax event="change" process="@this" partialSubmit="true" update="@form" listener="#{createQtBB.openForChange}"></p:ajax>				
										    </p:selectOneRadio>	
									  </c:otherwise> 
								 </c:choose>    	    
							  </td>
						  </tr>
					 </table>
					 
				    </p:outputPanel>
				    
			</td>
		    <td>  
		          <table width="100%">
			         <tr>
				       <td> 
			    
							<c:if test="#{!categoryCodeReadonly and !specCommitteeReadOnly}">
								<div class="ppRightBtn">
									<p:commandButton value="#{lbl['lbl.btn.add']}"
										styleClass="BtnSpacing" process="@this, openPnlId"
										partialSubmit="true" update="@([id$=catCodePopup])"
										oncomplete="catCodePopup.show();"
										action="#{categoryCodeSearchBackingBean.renewSesionObject}" />
									<p:commandButton value="#{lbl['lbl.btn.delete']}" id="supplierQualificationCriteriaNonpanelDeleteCategoryBtnId"
										styleClass="BtnSpacing" process="@this, openPnlId"
										partialSubmit="true" disabled="#{empty qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}"
										oncomplete="supplierOpencategoryDeletePopUp.show();"
										update="@([id$=#{supplierOpencategoryDeleteId}])" />
								</div>
								<ui:param name="supplierOpencategoryDeleteId"
									value="supplierOpencategoryDeleteId" />
								<ac:confirmationPopup id="#{supplierOpencategoryDeleteId}"
									widget="supplierOpencategoryDeletePopUp"
									okAction="qTSupplierQulCriteriaBackingBean.deleteCategoryCodes"
									width="33%" height="100" title="#{lbl['lbl.sc.category.code']}"
									content="#{lbl['lbl.sc.dialog.confirm.category.codes']}"
									update="@([id$=openCategoryCodesPanel])" />
								<ac:categoryCodePopup
									okAction="qTSupplierQulCriteriaBackingBean.addNewCategoryAction"
									update="@form" />
							</c:if>
							
					    </td>
				  </tr>
			    </table>
		   </td>
		  </tr>
		</table>							
							
	</p:panel>

	<ui:param name="isQuotationThresHold"
		value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.procurementMode.parameterCode == ParameterConst.procurementModeQuotation}" />

	<p:panel toggleable="true" id="supplierQualificationCriterialocationPaidUpcapitalPanel">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
		</f:facet>

		<table style="width: 100%">
			<c:if test="#{!isQuotationThresHold}">
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.all.states']}"/></td>
					<td>
						<!-- 17376 -start- -->
						<p:selectBooleanCheckbox
							disabled="#{qTSupplierQulCriteriaBackingBean.managedBean.allStateCode.value() eq 'Peninsular' or qTDetailBB.managedBean.readOnly}"
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}">
						<!-- 17376 -end- -->
							<f:selectItem
								itemValue="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}" />
							<p:ajax update="@form"
								listener="#{qTSupplierQulCriteriaBackingBean.stateChange}" />
						</p:selectBooleanCheckbox></td>
				</tr>
			</c:if>
			<tr>
				<td style="width: 210px"><p:outputLabel
						value="#{lbl['lbl.sc.paidup']}" /></td>
				<td>
					<!-- 17376 -start- -->
					<p:inputText maxlength="18"
						disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FIELD_QT_MINIMUM_PAID_UP_CAPITAL) or qTDetailBB.managedBean.readOnly}"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
						style="margin-right:5px;text-align:right; width:210px;">
					<!-- 17376 -end- -->
						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{qTSupplierQulCriteriaBackingBean.validatePaidupcapital}" />
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<c:if
				test="#{!qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" />
						<p:outputLabel value="*" styleClass="mandatory"
							rendered="#{!locCoverageReadonly}" /></td>
					<td><c:choose>
							<c:when test="#{!locCoverageReadonly and !qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal}">
								<!-- 17376 -start- -->
								<p:selectOneMenu id="locLevels"
									label="#{lbl['lbl.sc.location.level']}"
									value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
									style="width: 220px;" 
									disabled="#{qTDetailBB.managedBean.readOnly}">
								<!-- 17376 -end- -->
									<f:selectItems
										value="#{qTSupplierQulCriteriaBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
									<p:ajax event="change" update="zoneLocationDataTable"
										listener="#{qTSupplierQulCriteriaBackingBean.selectSupplierLocation}" />
								</p:selectOneMenu>
								<p:message id="locLevelsMsg" for="locLevels" display="icon" />
							</c:when>
							<c:otherwise>
								<p:inputText id="locLevelsTxt"
									value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel)}"
									style="width:210px;" disabled="true" />
							</c:otherwise>
						</c:choose></td>
				</tr>
			</c:if>
		</table>

		<c:if test="#{!qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}">
			<c:choose>
				<c:when test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal and isQuotationThresHold}">
					<h:panelGrid width="100%">
						<p:dataTable id="zoneLocationDataTable" rows="10"
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneSuppQualTrees}"
							var="zoneTree" style="width:100%" rowIndexVar="index"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							rowKey="#{zoneTree}">
		
							<p:column style="width:250%;">
								<f:facet name="header">
									<h:outputText value="#{lbl['lbl.sc.zone.location']}" />
								</f:facet>
								<p:tree value="#{zoneTree}"  var="location" style="width:500px;">		
									<p:treeNode type="zone">
										<h:outputText value="#{location.zoneName}" />
									</p:treeNode>
		
									<p:treeNode type="state">
										<h:outputText value="#{location.pmState.stateName}" />
									</p:treeNode>
									<p:treeNode type="division">
										<h:outputText value="#{location.pmDivision.divisionName}" />
									</p:treeNode>
									<p:treeNode type="district">
										<h:outputText value="#{location.pmDistrict.districtName}" />
									</p:treeNode>
								</p:tree>
							</p:column>
							<p:column headerText="#{lbl['lbl.sc.action']}"
								style="width:10%;text-align: center;"
								rendered="#{!locCoverageReadonly}">
								<p:commandLink
									actionListener="#{createQtBB.editZones(zoneTree,index,true)}"
									process="@this" update="@([id$=zoneLocationId])"
									oncomplete="zoneLocation.show();">
									<h:graphicImage value="/css/images/design/edit.png" />
								</p:commandLink>
							</p:column>
						</p:dataTable>
					</h:panelGrid>
					<c:if test="#{!locCoverageReadonly}">
						<p:dialog id="zoneLocationId" header="#{lbl['lbl.sc.add.location']}"
							widgetVar="zoneLocation" modal="true" position="top" height="65%">
							<p:messages id="zonPopupMsg" showDetail="true"
								showSummary="false" autoUpdate="true" closable="true"
								severity="error, info" />
							<h:panelGroup id="editZonePopup">
								<h:panelGroup rendered="#{!empty qTSupplierQulCriteriaBackingBean.managedBean.rootZoanlTree}">
								<table styleClass="noBorders tr,noBorders td" border="0">
									<TR>
										<TD valign="top"><p:outputLabel
												value="#{lbl['lbl.sc.location']}" /> <p:outputLabel value="*"
												styleClass="mandatory" /></TD>
										<TD>
											<div style="height: 300px; overflow-y: scroll;">
												<p:tree id="treeZoneGeneralPopup"
													value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootZoanlTree}"
													var="location"
													selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
													selectionMode="checkbox"
													showUnselectableCheckbox="true">
													<p:treeNode type="state">
														<h:outputText value="#{location.pmState.stateName}" />
													</p:treeNode>
													<p:treeNode type="division">
														<h:outputText value="#{location.pmDivision.divisionName}" />
													</p:treeNode>
													<p:treeNode type="district">
														<h:outputText value="#{location.pmDistrict.districtName}" />
													</p:treeNode>
													<p:treeNode type="city">
														<h:outputText value="#{pmCity.cityName}" />
													</p:treeNode>
												</p:tree>
											</div>
										</TD>
									</TR>
									<TR>
										<TD></TD>
										<TD>
											<p:commandButton
												value="#{lbl['lbl.btn.cancel']}" style="float:right;"
												styleClass="BtnSpacing" onclick="zoneLocation.hide();" process="@this">
												<f:setPropertyActionListener target="#{qTSupplierQulCriteriaBackingBean.managedBean.autoUpdate}" value="true" />
											</p:commandButton>
											&#160;&#160; 
											<p:commandButton value="#{lbl['lbl.btn.ok']}"
												style="float:right;" process="@all"
												update="@this, zoneLocationDataTable,editZonePopup"
												styleClass="BtnSpacing"
												action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocation}">
											</p:commandButton>
										</TD>
									</TR>
								</table>
								</h:panelGroup>
							</h:panelGroup>
						</p:dialog>
					</c:if>
				</c:when>
				<c:otherwise>
					<h:panelGrid width="100%">
						<p:dataTable id="zoneLocationDataTable" rows="10"
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
							emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
							var="zoneTree" style="width:100%" rowIndexVar="index">
		
							<ac:paginator for="zoneLocationDataTable" />
		
							<p:column style="width:90%">
								<f:facet name="header">
									<h:outputText value="* " styleClass="mandatory" />
									<h:outputText value="#{lbl['lbl.sc.location']}" />
								</f:facet>
								<p:tree value="#{zoneTree}" var="location" 
									selectionMode="#{!locCoverageReadonly ? 'checkbox' : ' '}"  style="width:500px;">
									<p:ajax event="select" update="@([id$=supplierQualificationcriteriaNonpanelDelBtnId])"
										listener="#{qTSupplierQulCriteriaBackingBean.selectLocationTreeNode}" />
									<p:ajax event="unselect" update="@([id$=supplierQualificationcriteriaNonpanelDelBtnId])"
										listener="#{qTSupplierQulCriteriaBackingBean.unSelectLocationTreeNode}" />
									<p:treeNode type="state">
										<h:outputText value="#{location.pmState.stateName}" />
									</p:treeNode>
									<p:treeNode type="division">
										<h:outputText value="#{location.pmDivision.divisionName}" />
									</p:treeNode>
									<p:treeNode type="district">
										<h:outputText value="#{location.pmDistrict.districtName}" />
									</p:treeNode>
		
								</p:tree>
							</p:column>
						</p:dataTable>
					</h:panelGrid>
		
					<c:if test="#{!locCoverageReadonly}">
						<div align="right">
							<!-- 17376 -start- -->
							<p:selectBooleanCheckbox id="checkAll"
								style="float:left;margin-top: 13px;margin-right: -4px;" disabled="#{qTDetailBB.managedBean.readOnly}">
							<!-- 17376 -end- -->		
								<p:ajax event="change" partialSubmit="true" process="@all"
									update="zoneLocationDataTable"
									listener="#{qTSupplierQulCriteriaBackingBean.checkAllConditions}" />
							</p:selectBooleanCheckbox>
							<p:spacer width="1" />
							<h:outputLabel value="#{lbl['lbl.sc.spec.check.all']}"
								style="float:left;margin-top: 12px;;margin-left: 10px;" />
							<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
								update="@([id$=zonePopupPanel])"
								actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}" />
								
							<p:commandButton value="#{lbl['lbl.btn.edit']}" id="locEditBtnId"
								action="#{qTSupplierQulCriteriaBackingBean.editZoneLocation}"
								process="@all" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();"
								disabled="#{empty qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}">
							</p:commandButton>
							
							<p:commandButton value="#{lbl['lbl.btn.delete']}" id="supplierQualificationcriteriaNonpanelDelBtnId"
							disabled="#{qTSupplierQulCriteriaBackingBean.checkLocationDeleteButtonDisable()}"
								process="@this,zoneLocationDataTable" partialSubmit="true"
								oncomplete="supplierNonZoneDeletePopUp.show();"
								update="@([id$=#{supplierNonZoneDeleteId}])" />
						</div>
						<ui:param name="supplierNonZoneDeleteId"
							value="supplierNonZoneDeleteId" />
						<ac:confirmationPopup id="#{supplierNonZoneDeleteId}"
							widget="supplierNonZoneDeletePopUp"
							okAction="qTSupplierQulCriteriaBackingBean.deleteSupplierQualificationTreeNode"
							width="400" height="100"
							title="#{lbl['lbl.sc.location.list.paidup.capital']}"
							content="#{lbl['lbl.sc.dialog.confirm.supplier.locations']}"
							update="@([id$=supplierQualificationCriterialocationPaidUpcapitalPanel])" />
		
						<p:dialog header="#{lbl['lbl.sc.add.location']}"
							widgetVar="ZoneLocation" modal="true" position="top" height="65%">
							<p:panel id="zonePopupPanel">
								<table border="0">
									<tr>
										<td>#{lbl['lbl.sc.location']}</td>
									</tr>
									<TR>
										<TD width="80%">
											<div style="height: 300px; overflow-y: scroll;">
												<p:tree id="treeZoneLocationPopup"
													value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTree}"
													var="location"
													selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
													selectionMode="checkbox">
													<p:treeNode type="state">
														<h:outputText value="#{location.pmState.stateName}" />
													</p:treeNode>
													<p:treeNode type="division">
														<h:outputText value="#{location.pmDivision.divisionName}" />
													</p:treeNode>
													<p:treeNode type="district">
														<h:outputText value="#{location.pmDistrict.districtName}" />
													</p:treeNode>
													<p:treeNode type="city">
														<h:outputText value="#{pmCity.cityName}" />
													</p:treeNode>
												</p:tree>
											</div>
										</TD>
									</TR>
									<tr>
										<td><p:spacer height="1" /></td>
									</tr>
									<tr>
										<td>
											<div class="ppRightBtn">
												<c:if test="#{!locCoverageReadonly}">
													<!-- 17376 -start- -->
													<p:selectBooleanCheckbox id="popupCheckAll"
														style="float:left;margin-top: 13px;margin-right: -4px;" disabled="#{qTDetailBB.managedBean.readOnly}">
													<!-- 17376 -end- -->
														<p:ajax event="change" partialSubmit="true" process="@all"
															update=":form:treeZoneLocationPopup"
															listener="#{qTSupplierQulCriteriaBackingBean.checkAllPopUpConditions}" />
													</p:selectBooleanCheckbox>
													<p:spacer width="1" />
													<h:outputLabel value="#{lbl['lbl.sc.spec.check.all']}"
														style="float:left;margin-top: 12px;;margin-left: 10px;" />
													<p:commandButton value="#{lbl['lbl.btn.ok']}"
														onclick="ZoneLocation.hide();" process="@all"
														update="@this, zoneLocationDataTable, zonePopupPanel, locEditBtnId"
														action="#{qTSupplierQulCriteriaBackingBean.updateLocation}">
													</p:commandButton>
													<p:commandButton value="#{lbl['lbl.btn.cancel']}"
														onclick="ZoneLocation.hide();" />
												</c:if>
											</div>
										</td>
									</tr>
								</table>
							</p:panel>
						</p:dialog>
					</c:if>
				</c:otherwise>
			</c:choose>
		</c:if>
	</p:panel>

	<table width="100%">
		<tr>
			<td style="width: 210px"><p:outputLabel
					value="#{lbl['lbl.sc.totalsup']}" /></td>
			<td><p:inputText id="totalSuppliersId"
					style="margin-right:5px; width:210px; text-align:right;"
					disabled="true"
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSuppliers}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</p:inputText> <c:if test="#{!suppQualificationReadonly}">
					<p:commandButton value="#{lbl['lbl.btn.search']}"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
						update="totalSuppliersId"
						action="#{qTSupplierQulCriteriaBackingBean.searchForSupplierCount}"
						partialSubmit="true" process="@this" />
				</c:if></td> 
		</tr>
	</table>
</ui:composition>
