<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.category.code.list.instruction']}"
			escape="false" />

		<p:dataTable id="openPnlId" var="cateGory" widgetVar="openCodes"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
			rowIndexVar="index" rows="10"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}"
			rowKey="#{cateGory}">

			<p:column selectionMode="multiple" style="width:1%"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_CATEGORY_CODE)}" />

			<p:column headerText="#{lbl['lbl.sc.category.code']}">
				#{cateGory.pmCategoryL1.categoryL1Code}#{cateGory.pmCategoryL2.categoryL2Code}#{cateGory.pmCategoryL3.categoryL3Code}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.main.category']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL1.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL2.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}"
				style="white-space: normal;">
				<h:outputText value="#{cateGory.pmCategoryL3.categoryName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.category.type']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(cateGory.pmCategoryL3.categoryTypeCode)}" />
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}" styleClass="BtnSpacing"
				process="@this, openPnlId" partialSubmit="true"
				update="@([id$=catCodePopup])" oncomplete="catCodePopup.show();"
				action="#{categoryCodeSearchBackingBean.renewSesionObject}"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_CATEGORY_CODE)}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
				process="@this, openPnlId" partialSubmit="true"
				oncomplete="supplierOpencategoryDeletePopUp.show();"
				update="@([id$=#{supplierOpencategoryDeleteId}])"
				rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_CATEGORY_CODE)}" />
		</div>
		<ui:param name="supplierOpencategoryDeleteId"
			value="supplierOpencategoryDeleteId" />
		<ac:confirmationPopup id="#{supplierOpencategoryDeleteId}"
			widget="supplierOpencategoryDeletePopUp"
			okAction="qTSupplierQulCriteriaBackingBean.deleteCategoryCodes"
			width="33%" height="100" title="#{lbl['lbl.sc.category.code']}"
			content="#{lbl['lbl.sc.dialog.confirm.category.codes']}"
			update="@([id$=openPnlId])" />
		<ac:categoryCodePopup
			okAction="qTSupplierQulCriteriaBackingBean.addNewCategoryAction"
			update="@([id$=openPnlId])" />
	</p:panel>

	<ui:param name="isQuotationThresHold"
		value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.procurementMode.parameterCode == ParameterConst.procurementModeQuotation}" />

	<p:panel toggleable="true"
		rendered="#{((isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false')  or (!isQuotationThresHold  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal) or (!isQuotationThresHold  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false'))}">
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
		</f:facet>

		<table style="width: 100%">
			<h:panelGroup id="allstate" rendered="#{!isQuotationThresHold}">
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.all.states']}"
							style="width : 80px" /></td>
					<td><p:selectBooleanCheckbox
							disabled="#{qTSupplierQulCriteriaBackingBean.managedBean.allStateCode.value() eq 'Peninsular' }"
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}">
							<f:selectItem
								itemValue="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState}" />
							<p:ajax update="@form"
								listener="#{qTSupplierQulCriteriaBackingBean.stateChange}" />
						</p:selectBooleanCheckbox></td>
				</tr>
			</h:panelGroup>
			<p:outputPanel id="minPaidCapital">
				<ui:fragment
					rendered="#{!isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState eq 'true'}">
					<tr>
						<td style="width: 210px"><p:outputLabel
								value="#{lbl['lbl.sc.paidup']}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState eq 'true'}" /></td>
						<td><p:inputText size="30" maxlength="18"
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_MINIMUM_PAID_UP_CAPITAL)}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState eq 'true'}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="blur" partialSubmit="true" process="@this"
									listener="#{qTSupplierQulCriteriaBackingBean.validatePaidupcapital}" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
				</ui:fragment>
			</p:outputPanel>
		</table>
	</p:panel>
	<h:panelGroup>
		<h:panelGroup id="supplierallStae">
			<h:panelGroup
				rendered="#{((isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal))}">
				<table style="width: 100%">
					<tr>
						<td style="width: 210px"><p:outputLabel
								value="#{lbl['lbl.sc.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_MINIMUM_PAID_UP_CAPITAL)}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locLevels"
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_LOCATION_COVERAGE)}"
								label="#{lbl['lbl.sc.location.level']}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width: 236px;">
								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change" update="zoneLocationDataTable"
									listener="#{qTSupplierQulCriteriaBackingBean.selectSupplierLocation}" />
							</p:selectOneMenu> <p:message id="withOutzone" for="locLevels" display="icon" /></td>
					</tr>
				</table>
			</h:panelGroup>
			<h:panelGroup
				rendered="#{((isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and !qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal) or (!isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal =='false') or (!isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'  and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal))}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneLocationDataTable" rows="10"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">

						<ac:paginator for="zoneLocationDataTable" />

						<p:column style="width:90%">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{qTSupplierQulCriteriaBackingBean.selectLocationTreeNode}" />
								<p:ajax event="unselect"
									listener="#{qTSupplierQulCriteriaBackingBean.unSelectLocationTreeNode}" />
								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>

							</p:tree>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%">
							<p:commandLink
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
								actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<h:graphicImage
									value="#{CommonUIConstant.imagePathUptoDesign}/edit.png"
									styleClass="tasklist_title1" />
							</p:commandLink>
						</p:column>

					</p:dataTable>
				</h:panelGrid>
				<div align="right">
					<p:selectBooleanCheckbox id="checkAll"
						style="float:left;margin-top: 13px;margin-right: -4px;"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}">
						<p:ajax event="change" partialSubmit="true" process="@all"
							update="zoneLocationDataTable"
							listener="#{qTSupplierQulCriteriaBackingBean.checkAllConditions}" />
					</p:selectBooleanCheckbox>
					<p:spacer width="1" />
					<h:outputLabel value="#{lbl['lbl.sc.spec.check.all']}"
						style="float:left;margin-top: 12px;;margin-left: 10px;"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}" />
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						update="@([id$=zonePopupPanel])"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
						actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this,zoneLocationDataTable" partialSubmit="true"
						oncomplete="supplierNonZoneDeletePopUp.show();"
						update="@([id$=#{supplierNonZoneDeleteId}])"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}" />
				</div>
				<ui:param name="supplierNonZoneDeleteId"
					value="supplierNonZoneDeleteId" />
				<ac:confirmationPopup id="#{supplierNonZoneDeleteId}"
					widget="supplierNonZoneDeletePopUp"
					okAction="qTSupplierQulCriteriaBackingBean.deleteSupplierQualificationTreeNode"
					width="400" height="100"
					title="#{lbl['lbl.sc.location.list.paidup.capital']}"
					content="#{lbl['lbl.sc.dialog.confirm.supplier.locations']}"
					update="@([id$=zoneLocationDataTable])" />
			</h:panelGroup>
			<p:panel toggleable="true"
				rendered="#{isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal}">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.location.list.paidup.capital']}" />
					<ac:iconTooltip
						value="#{lbl['lbl.sc.location.list.paidup.capital.tooltip']}" />
				</f:facet>

				<table style="width: 100%">
					<tr>
						<td style="width: 210px"><p:outputLabel
								value="#{lbl['lbl.sc.paidup']}" /></td>
						<td><p:inputText size="30" maxlength="18"
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
								rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.allState=='false'}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.minPaidUpCapital}"
								style="margin-right:5px;text-align:right;">
								<p:ajax event="change" process="@this" partialSubmit="true" />
								<f:convertNumber
									pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
							</p:inputText></td>
					</tr>
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.sc.location.level']}" />
							<p:outputLabel value="*" styleClass="mandatory" /></td>
						<td><p:selectOneMenu id="locZoneLevels"
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
								value="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.scQtSupplierCriteria.locationLevel.parameterId}"
								style="width: 236px;">
								<f:selectItems
									value="#{qTSupplierQulCriteriaBackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
								<p:ajax event="change" update="zoneyesDataTable"
									listener="#{qTSupplierQulCriteriaBackingBean.selectSupplierLocation}" />
							</p:selectOneMenu></td>
					</tr>
				</table>
			</p:panel>
			<h:panelGroup
				rendered="#{isQuotationThresHold and qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.allState=='false' and qTSupplierQulCriteriaBackingBean.managedBean.qt.zonal}">
				<h:panelGrid width="100%">
					<p:dataTable id="zoneyesDataTable" rows="10"
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.zoneTrees}"
						var="zoneTree" style="width:100%" rowIndexVar="index">

						<ac:paginator for="zoneyesDataTable" />

						<p:column style="width:90%">
							<f:facet name="header">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.sc.location']}" />
							</f:facet>
							<p:tree value="#{zoneTree}" var="location"
								selectionMode="checkbox">
								<p:ajax event="select"
									listener="#{qTSupplierQulCriteriaBackingBean.selectZoneTreeNode}" />
								<p:ajax event="unselect"
									listener="#{qTSupplierQulCriteriaBackingBean.unSelectZoneTreeNode}" />

								<p:treeNode type="zone">
									<h:outputText value="#{location.zoneName}" />
								</p:treeNode>

								<p:treeNode type="state">
									<h:outputText value="#{location.pmState.stateName}" />
								</p:treeNode>
								<p:treeNode type="division">
									<h:outputText value="#{location.pmDivision.divisionName}" />
								</p:treeNode>
								<p:treeNode type="district">
									<h:outputText value="#{location.pmDistrict.districtName}" />
								</p:treeNode>
							</p:tree>
						</p:column>
						<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%">
							<p:commandLink
								disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
								actionListener="#{qTSupplierQulCriteriaBackingBean.editZoneLocation(zoneTree,index)}"
								process="@this" update="@([id$=zonePopupPanel])"
								oncomplete="ZoneLocation.show();">
								<h:graphicImage
									value="#{CommonUIConstant.imagePathUptoDesign}/edit.png"
									styleClass="tasklist_title1" />
							</p:commandLink>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
				<div align="right" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_LOCATION_COVERAGE)}"
						update="@([id$=zonePopupPanel])"
						actionListener="#{qTSupplierQulCriteriaBackingBean.showZoneLocationPopup}" />

					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_LOCATION_COVERAGE)}"
						process="@this,zoneyesDataTable" partialSubmit="true"
						oncomplete="supplierZonalDeletePopUp.show();"
						update="@([id$=#{supplierZonalDeleteId}])" />
				</div>
				<ui:param name="supplierZonalDeleteId" value="supplierZonalDeleteId" />
				<ac:confirmationPopup id="#{supplierZonalDeleteId}"
					widget="supplierZonalDeletePopUp"
					okAction="qTSupplierQulCriteriaBackingBean.deleteSupplierQualificationTreeNode"
					width="400" height="100"
					title="#{lbl['lbl.sc.location.list.paidup.capital']}"
					content="#{lbl['lbl.sc.dialog.confirm.supplier.locations']}"
					update="@([id$=zoneyesDataTable])" />
			</h:panelGroup>

			<p:dialog header="#{lbl['lbl.sc.add.location']}"
				widgetVar="ZoneLocation" modal="true" position="top" height="65%">
				<p:panel id="zonePopupPanel">
					<table border="0">
						<tr>
							<td>#{lbl['lbl.sc.location']}</td>
						</tr>
						<TR>
							<TD width="80%">
								<div style="height: 300px; overflow-y: scroll;">
									<p:tree id="treeZoneLocationPopup"
										value="#{qTSupplierQulCriteriaBackingBean.managedBean.rootLocationTree}"
										var="location"
										selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedNodes}"
										selectionMode="checkbox">
										<p:treeNode type="state">
											<h:outputText value="#{location.pmState.stateName}" />
										</p:treeNode>
										<p:treeNode type="division">
											<h:outputText value="#{location.pmDivision.divisionName}" />
										</p:treeNode>
										<p:treeNode type="district">
											<h:outputText value="#{location.pmDistrict.districtName}" />
										</p:treeNode>
										<p:treeNode type="city">
											<h:outputText value="#{pmCity.cityName}" />
										</p:treeNode>
									</p:tree>
								</div>
							</TD>
						</TR>
						<tr>
							<td><p:spacer height="1" /></td>
						</tr>
						<tr>
							<td>
								<div class="ppRightBtn">
									<p:selectBooleanCheckbox id="popupCheckAll"
										style="float:left;margin-top: 13px;margin-right: -4px;">
										<p:ajax event="change" partialSubmit="true" process="@all"
											update=":form:treeZoneLocationPopup"
											listener="#{qTSupplierQulCriteriaBackingBean.checkAllPopUpConditions}" />
									</p:selectBooleanCheckbox>
									<p:spacer width="1" />
									<h:outputLabel value="#{lbl['lbl.sc.spec.check.all']}"
										style="float:left;margin-top: 12px;;margin-left: 10px;" />
									<p:commandButton value="#{lbl['lbl.btn.ok']}"
										rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
										onclick="ZoneLocation.hide();" process="@all"
										update="@this, zoneLocationDataTable, zonePopupPanel, zoneyesDataTable"
										action="#{qTSupplierQulCriteriaBackingBean.updateZoneLocation}">
									</p:commandButton>
									<p:commandButton value="#{lbl['lbl.btn.cancel']}"
										rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
										onclick="ZoneLocation.hide();" />
								</div>
							</td>
						</tr>
					</table>
				</p:panel>
			</p:dialog>
		</h:panelGroup>
	</h:panelGroup>
	<table>
		<tr>
			<td style="width: 210px"><p:outputLabel
					value="#{lbl['lbl.sc.totalsup']}" /></td>
			<td><p:inputText id="totalSuppliersId" style="margin-right:5px;"
					disabled="true" size="30"
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSuppliers}" /></td>
			<td><p:commandButton value="#{lbl['lbl.btn.search']}"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					update="totalSuppliersId"
					rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}"
					action="#{qTSupplierQulCriteriaBackingBean.searchForSupplierCount}"
					partialSubmit="true" process="@this" /></td>
			<td />
		</tr>
	</table>
</ui:composition>
