<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:messages id="supplierSearchMessages" showDetail="true"
		autoUpdate="true" closable="true" showSummary="false"
		severity="error, info" />
		
	<p:panel id="searchrestrictedsupp" header="#{lbl['lbl.btn.search']}"
		toggleable="true">

		<table style="width: 100%;">
			<tr>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.supplierName}"
						size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mofno']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.mofAccountNo}"
						size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.paidup']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.minPaidUpCapital}"
						size="30" /></td>
			</tr>
		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				styleClass="apply_button" id="restrictSupplier"
				action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierAction}"
				update="restrictedsupplierPnl" process="@this, searchrestrictedsupp" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				action="#{qTSupplierQulCriteriaBackingBean.reset}"
				update="searchrestrictedsupp" resetValues="true"
				partialSubmit="true" process="@this" />
		</div>
	</p:panel>
	<p:panel id="restrictedsupplierPnl"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<p:dataTable var="smSupplier" id="ressupplier"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchSupplierDataModel}"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedSupplierList}"
			rowKey="#{smSupplier.supplierId}" lazy="true" style="width : 100%;"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			rows="10">
			<ui:param name="mof" value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccountFromSmSupplier(smSupplier)}" />
			<ac:paginator for="ressupplier" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<h:outputText value="#{smSupplier.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofno']}" style="width: 10%;">
				<h:outputText
					value="#{mof.mofNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}"
				style="width: 10%;">
				<h:outputText
					value="#{mof.expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.status.bumiputra']}"
				style="width: 10%;">
				<h:outputText
					value="#{smSupplier.bumi ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.status']}" style="width: 10%;">
				<h:outputText rendered="#{qTSupplierQulCriteriaBackingBean.supplierStatusDateComparision(mof.expDate) eq 'true'}" value="#{lbl['lbl.txt.active']}" />
				<h:outputText rendered="#{qTSupplierQulCriteriaBackingBean.supplierStatusDateComparision(mof.expDate) eq 'false'}" value="#{lbl['lbl.txt.expired']}" style="font-weight: bold;color:red;" />
			</p:column>
		</p:dataTable>
		
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.ok']}" styleClass="BtnSpacing"
				action="#{qTSupplierQulCriteriaBackingBean.addRestrictedToSupplierListAction}"
				update="supplierlist" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" styleClass="BtnSpacing"
				oncomplete="suppdlg.hide()" />
		</div>
	</p:panel>
	
</ui:composition>
