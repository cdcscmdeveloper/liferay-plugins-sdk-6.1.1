<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="totalSupplierid">
		<h:panelGroup>
			<p:dataTable id="panelsuppliersTbl" var="qtSupplier"
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctZoneSupplierList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowIndexVar="index" editable="true" rowKey="#{qtSupplier}">

				<ui:param name="mof" value="#{qTSupplierQulCriteriaBackingBean.retriveMofAccountBySupplier(qtSupplier.supplier)}" />

				<ac:paginator for="suppliersTbl" />

				<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
					<p:commandLink oncomplete="suppDetails.show();"
						actionListener="#{qTSupplierQulCriteriaBackingBean.retriveSupplierDtls(qtSupplier)}"
						update=":form:paneltabView:panelpopupSuppDtl">
						<h:outputText value="#{qtSupplier.supplier.companyName}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.mofno']}">
					<h:outputText value="#{mof.mofNo}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.mofexp.date']}">
					<h:outputText value="#{mof.expDate}">
						<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.status']}">
					<h:outputText rendered="#{qTSupplierQulCriteriaBackingBean.supplierStatusDateComparision(mof.expDate) eq 'true'}" value="#{lbl['lbl.txt.active']}" />
					<h:outputText rendered="#{qTSupplierQulCriteriaBackingBean.supplierStatusDateComparision(mof.expDate) eq 'false'}" value="#{lbl['lbl.txt.expired']}" style="font-weight: bold;color:red;" />
				</p:column>
			</p:dataTable>

			<table>
				<tr>
					<td style="width: 210px"><p:outputLabel
							value="#{lbl['lbl.sc.totalsup']}" /></td>
					<td>
						<p:inputText
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSuppliers}"
							disabled="true"
							style="text-align:right;">
							<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
						</p:inputText>
					</td>
				</tr>
			</table>
		</h:panelGroup>
	</h:panelGroup>
	<ui:include
		src="supplierQualificationCriteriaPanelSupplierDetailsPopup.xhtml" />
</ui:composition>
