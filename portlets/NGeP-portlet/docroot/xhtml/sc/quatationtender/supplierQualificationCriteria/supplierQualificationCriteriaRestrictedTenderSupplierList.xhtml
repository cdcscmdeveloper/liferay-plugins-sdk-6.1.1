
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="supplierlist" header="#{lbl['lbl.sc.supplier.list']}"
		toggleable="true">

		<h:outputFormat styleClass="instruction"
			value="#{lbl['lbl.sc.qt.restricted.tender.instruction']}"
			escape="false"
			rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeRestrictedTender and qTSupplierQulCriteriaBackingBean.managedBean.qt.panel == 'No'}">
			<f:param value="#{qTSupplierQulCriteriaBackingBean.noOfSupplierForRestrictedTender}" />
		</h:outputFormat>

		<p:dataTable id="suppliersTbl" var="qtSupplier" rows="10"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtSupplierList}"
			rowIndexVar="index" editable="true" rowKey="#{qtSupplier}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedQtSupplierList}">

			<ac:paginator for="suppliersTbl" />
  <p:ajax event="rowSelect" update="@([id$=RestrictedTndrSuppliersDeleteBtnId])" />
			<p:ajax event="rowUnselect" update="@([id$=RestrictedTndrSuppliersDeleteBtnId])" />
			<p:ajax event="rowSelectCheckbox" update="@([id$=RestrictedTndrSuppliersDeleteBtnId])" />
			<p:ajax event="rowUnselectCheckbox" update="@([id$=RestrictedTndrSuppliersDeleteBtnId])" />
			<p:ajax event="toggleSelect" update="@([id$=RestrictedTndrSuppliersDeleteBtnId])" />
			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<p:commandLink oncomplete="suppDetailsPopup.show(); return false;"
					process="@this" update="@([id$=suppDetailsPopup])">
					<f:setPropertyActionListener value="#{qtSupplier.smSupplier}"
						target="#{supplierDetailBackingBean.smSupplier}" />
					<h:outputText value="#{qtSupplier.supplierName}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofno']}" style="width : 10%;">
				<h:outputText value="#{qtSupplier.supplierMofNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}"
				style="width : 10%;">
				<h:outputText value="#{qtSupplier.mofAccountExpDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(
											      CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.supplier.status.bumiputra']}"
				style="width: 10%;">
				<h:outputText value="#{qtSupplier.bumi ? lbl['lbl.txt.yes']:lbl['lbl.txt.no']}" />
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.status']}" style="width : 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, 
							 qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(qtSupplier, null).recordStatusFlg)}" />
			</p:column>

		</p:dataTable>
		<table width="100%">
			<tr>
				<td style="width: 210px">
					<p:outputLabel value="#{lbl['lbl.sc.totalsup']}" style="float:left;"/>
				</td>
				<td>
					<p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.totalSuppliers}"
						disabled="true" style="text-align: right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</p:inputText>
				</td>
				<td style="text-align: right;">
					<p:commandButton value="#{lbl['lbl.btn.search']}" partialSubmit="true"
						process="@this" styleClass="BtnSpacing"
						action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierPopupAction}"
						update="suppPopup" oncomplete="suppdlg.show();" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}" styleClass="BtnSpacing"
					id="RestrictedTndrSuppliersDeleteBtnId"
					disabled="#{empty qTSupplierQulCriteriaBackingBean.managedBean.selectedQtSupplierList}"
						process="@this, supplierlist" partialSubmit="true"
						oncomplete="restrictedSupplierDeletePopUp.show();"
						update="@([id$=#{restrictedSupplierDeleteId}])" />
				</td>
			</tr>
		</table>
		<ui:param name="restrictedSupplierDeleteId"
			value="restrictedSupplierDeleteId" />
		<ac:confirmationPopup id="#{restrictedSupplierDeleteId}"
			widget="restrictedSupplierDeletePopUp"
			okAction="qTSupplierQulCriteriaBackingBean.deleteRestrictedSupplierList"
			width="40%" height="100" title="#{lbl['lbl.sc.supplier.list']}"
			content="#{lbl['lbl.sc.dialog.confirm.restricted.supplier.dtls']}"
			update="@([id$=supplierlist])" />

	</p:panel>

	<p:dialog id="suppPopup" header="#{lbl['lbl.sc.qt.search.supplier']}"
		widgetVar="suppdlg" modal="true" width="800" height="450"
		position="top">
		
		<ui:include
			src="supplierQualificationCriteriaRestrictedTenderSupplierSearch.xhtml" />
		
	</p:dialog>
</ui:composition>
