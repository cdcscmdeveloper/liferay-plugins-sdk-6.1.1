<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:param name="suppQualificationReadonly" value="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_SUPPQUALIFICATION)}" />
	<ui:param name="locCoverageReadonly" value="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_LOCATION_COVERAGE)}" />
	<ui:param name="categoryCodeReadonly" value="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_CATEGORY_CODE)}" />
	
	<h:panelGroup id="suppQualPG">
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeOpen 
						and qTSupplierQulCriteriaBackingBean.managedBean.qt.panel == 'No'}">
			<ui:include src="supplierQualificationCriteriaNonPanel.xhtml" />
		</c:if>
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.panel ne 'No'}">
			<ui:include src="supplierQualificationCriteriaPanel.xhtml" />
		</c:if>
		<c:if
			test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == ParameterTypeConst.quotationTenderTypeRestrictedTender and qTSupplierQulCriteriaBackingBean.managedBean.qt.panel == 'No'}">
			<ui:include src="supplierQualificationCriteriaRestrictedTender.xhtml" />
		</c:if>
	</h:panelGroup>
</ui:composition>
