<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Document List" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="text-align: right;"><p:commandLink value="Sample Salinan Kontrak" /></td>
			</tr>
		</table>

		<p:dataTable var="scQtDocReport" id="doctbl" widgetVar="documentWidget"
			value="#{qTDocumentsBackingBean.managedBean.scQtDocReportList}"
			selection="#{qTDocumentsBackingBean.managedBean.selectedScQtDocReports}"
			rowKey="#{scQtDocReport}" rowIndexVar="rowIndex">

			<ac:paginator for="doctbl" />

			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{!empty scQtDocReport.pmDocument}" />

			<p:column headerText="#{lbl['lbl.so.title']}" style="width:58%">
				<h:inputText size="50" value="#{scQtDocReport.title}"
					rendered="#{empty scQtDocReport.pmDocument}" />
				<h:outputText value="#{scQtDocReport.title}"
					rendered="#{!empty scQtDocReport.pmDocument}" />
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.sc.type']}">
				#{qTDocumentsBackingBean.getParameterDesc(scQtDocReport.definationType)}
			</p:column>
			
			<p:column style="width:20%;" headerText="#{lbl['lbl.so.attachment']}">
				<ui:fragment rendered="#{scQtDocReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload}">
					<h:outputText value="#{scQtDocReport.scQtDocReportAttachment.fileName}" />
					<p:commandButton oncomplete="attachDlg1.show();"
						value="#{lbl['lbl.txt.attachment']}" icon="ui-icon-attachment"
						partialSubmit="true" process="@this" update="@([id$=attach])">
						<f:setPropertyActionListener target="#{qTDocumentsBackingBean.managedBean.selectedScQtDocReport}" value="#{scQtDocReport}" />
					</p:commandButton>
				</ui:fragment>
			</p:column>
			
			<p:column style="width:10%;" headerText="#{lbl['lbl.so.action']}">
				<p:commandLink
					action="#{qTDocumentsBackingBean.showTemplateAction(scQtDocReport)}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png"
						rendered="#{scQtDocReport.definationType.parameterCode eq 'TD'}" />
				</p:commandLink>			
				<p:commandButton id="download" icon="ui-icon-download" style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{qTDocumentsBackingBean.downloadReport(scQtDocReport)}"
					rendered="#{scQtDocReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload ? !empty scQtDocReport.scQtDocReportAttachment.fileName : true}" />
			</p:column>
		</p:dataTable>
		<p:spacer height="2"/>
		<div class="ppRightBtn">
			<p:commandButton icon="ui-icon-download" value="#{lbl['lbl.btn.download.all']}" ajax="false" action="#{qTDocumentsBackingBean.downloadAllReports}" />
			<p:commandButton value="#{lbl['lbl.so.clonebtn']}" actionListener="#{qTDocumentsBackingBean.cloneDocumentPopupAction}" oncomplete="screen2.show();" process="@this" icon="ui-icon-clone" update="@(.clonedocument)"/>
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this, doctbl" partialSubmit="true" action="#{qTDocumentsBackingBean.addDocumentList}"
				oncomplete="documentWidget.paginator.endLink.click();" update="doctbl" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this, doctbl" partialSubmit="true" icon="ui-icon-delete"
				action="#{qTDocumentsBackingBean.deleteRowsAction(qTDocumentsBackingBean.managedBean.scQtDocReportList, qTDocumentsBackingBean.managedBean.selectedScQtDocReports)}" update="doctbl" />
		</div>
	</p:panel>
</ui:composition>
