<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Document List" toggleable="true">
		<p:dataTable var="document" id="doctbl"
			value="#{qTDocumentsBackingBean.managedBean.scQtChecklists}"
			editable="true"
			selection="#{qTDocumentsBackingBean.managedBean.selectedCheckLists}"
			styleClass="documentslist" rowKey="#{document}"
			rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="doctbl" />

			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{document.checkStatus == true}" />

			<p:column headerText="#{lbl['lbl.so.title']}">

				<h:outputText value="#{document.title}"
					rendered="#{document.brandNew eq false}" />

				<p:inputText value="#{document.title}"
					rendered="#{document.brandNew eq true}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.type']}" style="width:10%">
				<h:outputText value="#{document.checklistType}"
					rendered="#{document.brandNew eq false}" />
				<p:selectOneMenu value="#{document.checklistType}"
					rendered="#{document.brandNew eq true}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItem itemLabel="UP" itemValue="UP" />
					<f:selectItem itemLabel="TD" itemValue="TD" />
				</p:selectOneMenu>
			</p:column>

			<!-- <p:column headerText="#{lbl['lbl.so.document']}" style="width:25%">
				<h:outputText value="#{document.scQtCheckListAttachment.fileName}"
					rendered="#{!empty document.scQtCheckListAttachment}" />
				<p:commandLink oncomplete="attachDlg.show();return false;"
					update="doctbl">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{document}"
						target="#{qTDocumentsBackingBean.managedBean.qtCheckList}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.so.order']}" style="width:10%">
				<h:outputText value="#{document.checklistSeq}" size="3" />
				<p:inputText value="#{document.checklistSeq}" size="3"
					rendered="#{document.brandNew eq true}" />
			</p:column> -->

			<!-- <p:column headerText="#{lbl['lbl.so.temp.status']}" style="width:20%">
				<h:outputText value="" size="2"
					rendered="#{document.checklistType eq 'UP'}" />
				<h:outputText
					value="#{document.scQtDoc.tplDocMaster.templateStatus}" size="2"
					rendered="#{document.checklistType eq 'TD'}" />
			</p:column> -->

			<p:column headerText="#{lbl['lbl.so.attachment']}" style="width:20%">
				<h:outputText value="#{document.scQtCheckListAttachment.fileName}"
					rendered="#{!empty document.scQtCheckListAttachment}" />

				<p:commandButton oncomplete="attachDlg1.show();return false;"
					icon="iconAttachment" update="doctbl" value="Attach Files">
					<f:setPropertyActionListener value="#{document}"
						target="#{qTDocumentsBackingBean.managedBean.qtCheckList}" />
				</p:commandButton>

			</p:column>

			<p:column headerText="#{lbl['lbl.so.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="20px" />
		<div align="right">
			<p:commandButton value="#{lbl['lbl.so.clonebtn']}"
				onclick="screen2.show();" process="@this" icon="ui-icon-clone" />

			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				process="@this,doctbl" partialSubmit="true"
				action="#{qTDocumentsBackingBean.addDocumentList}" update="doctbl"
				icon="ui-icon-add" />

			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete"
				action="#{qTDocumentsBackingBean.deleteDocument}" update="doctbl" />
		</div>

	</p:panel>

	<p:dialog id="attachDlg" widgetVar="attachDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{qTDocumentsBackingBean.handleFileAttachment}"
			mode="advanced" id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="attachmentId" oncomplete="attachDlg.hide()">
		</p:fileUpload>
	</p:dialog>
	
	<p:dialog id="attachDlg1" widgetVar="attachDlg1" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{qTDocumentsBackingBean.handleFileAttachment}"
			mode="advanced" id="upload1"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="doctbl" oncomplete="attachDlg.hide()">
		</p:fileUpload>
	</p:dialog>
	

</ui:composition>
