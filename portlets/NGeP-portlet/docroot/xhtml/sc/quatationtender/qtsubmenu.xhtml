
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td class="sidemenutd" width="20%" style="vertical-align: baseline;"><p:tabMenu
					styleClass="sidemenu"
					activeIndex="#{qTDetailBB.managedBean.activeIndex}"
					style="display : table-caption;">
					<p:menuitem value="#{lbl['lbl.qt.qtdetails']}"
						action="#{qTDetailBB.qtDetailsTabChange(0)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.so.committee.appointment']}"
						action="#{qTDetailBB.qtDetailsTabChange(1)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.qt.supplierqulificationcriteria']}"
						action="#{qTDetailBB.qtDetailsTabChange(2)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.qt.approval']}"
						action="#{qTDetailBB.qtDetailsTabChange(3)}" update="@form"
						process="@form" />
					<p:menuitem value="#{lbl['lbl.qt.tecnical.spec']}"
						action="#{qTDetailBB.qtDetailsTabChange(4)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_QT_SUBMISSION) or (qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />
					<p:menuitem value="#{lbl['lbl.qt.finanial.spec']}"
						action="#{qTDetailBB.qtDetailsTabChange(5)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_QT_SUBMISSION) or (qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />
					<p:menuitem value="#{lbl['lbl.qt.activities']}"
						action="#{qTDetailBB.qtDetailsTabChange(6)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_QT_SUBMISSION) or (qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}" />

					<p:menuitem value="#{lbl['lbl.qt.bsv.sample']}"
						action="#{qTDetailBB.qtDetailsTabChange(4)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
					<p:menuitem value="#{lbl['lbl.qt.schedule.contact']}"
						action="#{qTDetailBB.qtDetailsTabChange(5)}" update="@form"
						style="white-space: normal;" process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
					<p:menuitem value="#{lbl['lbl.qt.deduction.payment']}"
						action="#{qTDetailBB.qtDetailsTabChange(6)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
					<p:menuitem value="#{lbl['lbl.qt.documents']}"
						action="#{qTDetailBB.qtDetailsTabChange(7)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
					<p:menuitem value="#{lbl['lbl.qt.activities']}"
						action="#{qTDetailBB.qtDetailsTabChange(8)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />
					<p:menuitem value="#{lbl['lbl.qt.public.approval']}"
						action="#{qTDetailBB.qtDetailsTabChange(9)}" update="@form"
						process="@form"
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}" />

				</p:tabMenu></td>
			<td width="80%" style="vertical-align: top;"><h:panelGroup
					id="menuQTContent">
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '0'}">
						<ui:include src="qtdetails.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '1'}">
						<ui:include
							src="/xhtml/sc/quatationtender/committeeappointment/qtcommitteeappointment.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '2'}">
						<ui:include src="qtsupplierqualfcriteria.xhtml" />
					</c:if>
					<c:if test="#{qTDetailBB.managedBean.activeIndex eq '3'}">
						<ui:include src="approvalWorkFlowMain.xhtml" />
					</c:if>
					<ui:fragment
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_QT_SUBMISSION) or (qTDetailBB.managedBean.qt.qtStatus.statusId le QTStatusConst.QT_PENDING_APPROVALS_CHECKLIST_SCORING)}">
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '4'}">
							<ui:include src="qttechnicalchecklist.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '5'}">
							<ui:include src="qtfinancialchecklist.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '6'}">
							<ui:include src="qtactivitiestracking.xhtml" />
						</c:if>
					</ui:fragment>
					<ui:fragment
						rendered="#{(qTDetailBB.managedBean.qt.qtStatus.statusId ge QTStatusConst.QT_PENDING_SCHEDULE_DOCUMENT)}">

						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '4'}">
							<ui:include
								src="/xhtml/sc/quatationtender/briefingsitevisit/qtbriefingsitevisitdetails.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '5'}">
							<ui:include src="qtschedule.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '6'}">
							<ui:include src="deduction.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '7'}">
							<ui:include src="documents.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '8'}">
							<ui:include src="qtactivitiestracking.xhtml" />
						</c:if>
						<c:if test="#{qTDetailBB.managedBean.activeIndex eq '9'}">
							<ui:include
								src="/xhtml/sc/quatationtender/approval/qtpublicationapproval.xhtml" />
						</c:if>

					</ui:fragment>
				</h:panelGroup></td>
		</tr>
	</table>

	<p:dialog id="attach" widgetVar="attachDlg1" modal="true"
		resizable="false" width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.txt.choose.files']}">

		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{qTDocumentsBackingBean.handleFileAttachment}"
			mode="advanced" id="uploadattachmentid"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="menuQTContent" oncomplete="attachDlg1.hide()">
		</p:fileUpload>
	</p:dialog>

	<ui:include src="/xhtml/sc/quatationtender/approval/uploads.xhtml" />
</ui:composition>
