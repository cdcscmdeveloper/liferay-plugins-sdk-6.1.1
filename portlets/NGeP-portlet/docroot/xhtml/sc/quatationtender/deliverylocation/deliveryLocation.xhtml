<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="DELIVERY ADDRESS" toggleable="true">

		<p:dataTable id="deliveryaddid">
			<p:column headerText="PTJ" />
			<p:column headerText="Delivery Address" />
		</p:dataTable>
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.so.addbtn']}" icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.so.delete']}"
						icon="ui-icon-delete" />
				</div>
			</f:facet>
		</p:panelGrid>
	</p:panel>
</ui:composition>
