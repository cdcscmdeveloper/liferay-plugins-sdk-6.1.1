<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<c:if
			test="#{qTDetailBB.managedBean.qt.qtStatus.statusId ne QTStatusConst.QT_CANCELLED}">
			<div align="right">
				<!-- <table>
					<tr>
						<td align="right"> -->
						<ui:fragment
							rendered="#{qTDetailBB.managedBean.taskName eq null}">
							<p:commandButton value="#{lbl['lbl.btn.back']}"
								style="float:left;" icon="ui-icon-back"
								action="#{qTDetailBB.gotoQtSearchPage}" />
	
						</ui:fragment>
				
						<p:commandButton
								value="#{lbl['lbl.so.save']}"
								action="#{qTDetailBB.saveQtDetailsAction}" process="@form"
								icon="ui-icon-save" update="@form" /> <p:commandButton
								value="#{lbl['lbl.so.submit']}"
								action="#{qTDetailBB.submitQtDetailsForApproval}" process="@form"
								icon="ui-icon-submit" update="@form"
								rendered="#{qTDetailBB.managedBean.currentStatusId ge QTStatusConst.QT_PENDING_QT_SUBMISSION and qTDetailBB.managedBean.outComes eq null}" />


							<c:if test="#{qTDetailBB.managedBean.taskId ne null}">
								<ui:repeat var="bpmAction"
									value="#{qTDetailBB.managedBean.outComes}">
									<ui:param name="buttonLabel"
										value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
									<p:commandButton value="#{lbl[buttonLabel]}" 
										styleClass="ui-button"
										icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
										action="#{qTDetailBB.updateBpmTask(bpmAction)}" />
								</ui:repeat>
							</c:if> <p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
								process="@all" style="float:right;margin-right: 12px;"
								icon="ui-icon-cancel" onclick="cancelQTDlg.show()" />
							<!-- </td>
					</tr>
				</table> -->
			</div>
		</c:if>
		<p:dialog id="cancelQTDlg" widgetVar="cancelQTDlg"
			header="#{lbl['lbl.sc.cancel.confirm']}" resizable="false" width="325"
			height="77" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="All data will be Cancel, are you sure to Cancel?" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" icon="ui-icon-accept"
					oncomplete="cancelQTDlg.hide();"
					action="#{qTDetailBB.cancelQtDetails}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" icon="ui-icon-reject"
					onclick="cancelQTDlg.hide();" type="button" />
			</div>
		</p:dialog>
	</p:panel>
</ui:composition>
