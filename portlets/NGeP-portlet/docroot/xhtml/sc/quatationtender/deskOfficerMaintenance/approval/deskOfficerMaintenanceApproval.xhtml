<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ui:define name="contentSection">
	<style>
		.approvalTable tr td:first-child{
			width: 25%;
			min-width: 100px;
		}
		.approvalTable tr td:last-child{
			width: 75%;
		}
		.approvalTable tr td:last-child input{
			width: 100%;
			max-width: 75%;
		}
	</style>
	<ui:param name="currentApprovalRequest" value="#{DOMaintenanceBackingBean.managedBean.currentApprovalRequest}"/>
	<ui:param name="currentApproval" value="#{DOMaintenanceBackingBean.managedBean.currentApproval}"/>
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
	</p:blockUI>
	<p:messages id="DOChangepprovalMessages" showDetail="true"
		autoUpdate="#{DOMaintenanceBackingBean.managedBean.autoUpdate}"
		closable="true" showSummary="false" severity="error, info" />
	<!-- 36466 -->	
	<ac:gpkiPopup textBeforeSign="#{DOMaintenanceBackingBean.textBeforeSign}"
				postSignAction="#{DOMaintenanceBackingBean.postGPKISignAction(gpkiBackingBean.pmDigiSign)}"
				enableAutoUpdate="#{DOMaintenanceBackingBean.enableAutoUpdate()}" />
				
	<div class="ppRightBtn">
		<h:panelGroup id="approverBtns">
			<ui:decorate template="/WEB-INF/facelets/templates/claim_template.xhtml">
				<ui:define name="outComeSection">
					<ui:repeat var="bpmAction" value="#{DOMaintenanceBackingBean.managedBean.outComes}">
						<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							action="#{DOMaintenanceBackingBean.signGPKI(bpmAction)}" />
					</ui:repeat>
				</ui:define>
			</ui:decorate>
		</h:panelGroup>
	</div>	
	<p:panel header="#{lbl['lbl.sc.general.info']}" toggleable="true" id="qtsearchid">		
		<table class="approvalTable">
				<tr>
					<td>
						<p:outputLabel id="searchMinistryLbL" value="#{lbl['lbl.sc.ministry']}" />
					</td>
					<td>
						<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ministry']}" 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ministryProfile.orgName}"
							postUpdateListener="DOMaintenanceBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ministryProfile"
							disabled="true"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel id="searchPtjGroupLbL" value="#{lbl['lbl.sc.lbl.kumpulanPTJ']}" />
					</td>
					<td>
						<ac:lov id="searchPtjGroup" lovId="PM_ORG_PROFILE_PTJ_GROUP" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj.group']}" 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjGroupProfile.orgName}"
							postUpdateListener="DOMaintenanceBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjGroupProfile"
							conditionField="#{DOMaintenanceBackingBean.getPTJGroupCondition()}"
							disabled="true"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel id="searchPtjLbLDO" value="#{lbl['lbl.sc.ptj']}" />
					</td>
					<td>
						<ac:lov id="searchPtjAuth" lovId="PM_ORG_PROFILE_AUTH_TYPE"
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj']}" 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjProfile.orgName}"
							postUpdateListener="DOMaintenanceBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjProfile"
							conditionField="recordStatus^1" 
							disabled="true"/>
					</td>
				</tr>
				<tr>
					<td style="width:165px"><p:outputLabel value="#{lbl['lbl.sc.quotation.tender.deskofficermaintenance.originalDO']}" /></td>
					<td>
						<ac:lov id="lovOriginalDO" lovId="PM_USER_ID" size="135"
							update="@form"
							headerText="#{lbl['lbl.pm.ta.user.lov']}"
							selectionMode="single"
							disabled="true"
							value="#{DOMaintenanceBackingBean.managedBean.originalDeskOfficer.userName}"
							saveObject="DOMaintenanceBackingBean.managedBean.originalDeskOfficer"
							conditionField="pmUserOrgs.pmUserRoles.pmRole.roleCode^DESK_OFFICER|pmUserOrgs.pmOrgProfile.orgProfileId^#{currentApproval.scQt.pmOrgProfile.orgProfileId}"/>
					</td>				
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.quotation.tender.deskofficermaintenance.newDO']}" /></td>
					<td>
						<ac:lov id="lovUser" lovId="PM_USER_ID" size="135"
							update="@form"
							headerText="#{lbl['lbl.pm.ta.user.lov']}"
							selectionMode="single"
							value="#{DOMaintenanceBackingBean.managedBean.newDeskOfficer.userName}"
							saveObject="DOMaintenanceBackingBean.managedBean.newDeskOfficer"								
							conditionField="#{DOMaintenanceBackingBean.constructConditionForUserSearch()}"/>
					</td>
				</tr>
			</table>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.qt.req.dtls']}" toggleable="true">
		<h:panelGroup layout="block" styleClass="ui-datatable ui-widget">	
			<table>
				<thead>
					<tr>
						<th class="ui-state-default" role="columnHeader">
							<h:outputText value="#{lbl['lbl.sc.qt.type.reqdtls']}"/>
						</th>
						<th class="ui-state-default" role="columnHeader">
							<h:outputText value="#{lbl['lbl.sc.quotation.tender']}"/>
						</th>
				</tr>
				</thead>
				<tbody>
					<tr>
						<td>
							<h:outputText value="#{DOMaintenanceBackingBean.requestTypeDescription(currentApprovalRequest.approvalType.parameterId)}"/>
						</td>
						<td>
							<p:commandLink process="@this" partialSubmit="true"
								action="#{qTDetailBB.editQuationTenderDetails(currentApproval.scQt, false, true, view.viewId)}">
								<h:outputText value="#{currentApproval.scQt.qtNo}" />
							</p:commandLink>
						</td>
					</tr>
				</tbody>
			</table>
		</h:panelGroup>
	</p:panel>
	
	<ac:scRemarkAndAttachment
		remarkList="#{currentApproval.scQtApprovalRemarks}"
		attachmentList="#{currentApproval.scQtApprovalAttachments}"
		fileUploadListener="DOMaintenanceBackingBean.handleFileUpload"/>	
	<ac:lovPopup />
	</ui:define>
</ui:composition>
