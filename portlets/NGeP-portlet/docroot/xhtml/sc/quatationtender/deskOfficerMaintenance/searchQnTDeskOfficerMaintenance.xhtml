<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


		
			<table width="1100px">
				<tr>
					<td>
						<p:outputLabel id="searchMinistryLbL" value="#{lbl['lbl.sc.ministry']}" />
					</td>
					<td colspan="3">
						<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ministry']}" 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ministryProfile.orgName}"
							postUpdateListener="DOMaintenanceBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ministryProfile"
							disabled="true">
						</ac:lov>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel id="searchPtjGroupLbL" value="#{lbl['lbl.sc.lbl.kumpulanPTJ']}" />
					</td>
					<td colspan="3">
						<ac:lov id="searchPtjGroup" lovId="PM_ORG_PROFILE_PTJ_GROUP" 
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj.group']}" 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjGroupProfile.orgName}"
							postUpdateListener="DOMaintenanceBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjGroupProfile"
							conditionField="#{DOMaintenanceBackingBean.getPTJGroupCondition()}"
							disabled="true"/>
					</td>
				</tr>
				<tr>
					<td>
						<p:outputLabel id="searchPtjLbLDO" value="#{lbl['lbl.sc.ptj']}" />
					</td>
					<td colspan="3">
						<ac:lov id="searchPtjAuth" lovId="PM_ORG_PROFILE_AUTH_TYPE"
							size="135" readonly="true"
							headerText="#{lbl['lbl.sc.ptj']}" 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjProfile.orgName}"
							postUpdateListener="DOMaintenanceBackingBean.postUpdateOrgProfileListener"
							update="@form"
							saveObject="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.ptjProfile"
							conditionField="recordStatus^1" 
							disabled="true"/>
					</td>
				</tr>
				<tr>
					<td style="width:165px"><p:outputLabel value="#{lbl['lbl.sc.quotation.tender.deskofficermaintenance.originalDO']}" /></td>
					<td colspan="3">
						<ac:lov id="lovOriginalDO" lovId="PM_USER_DO_SEARCH" size="135"
							update="@form"
							headerText="#{lbl['lbl.pm.ta.user.lov']}"
							selectionMode="single"
							disabled="#{!DOMaintenanceBackingBean.isCommitteeApprover() and DOMaintenanceBackingBean.isDeskOfficer()}"
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.originalDeskOfficer}"
							saveObject="DOMaintenanceBackingBean.managedBean.originalDeskOfficer"
							conditionField="#{DOMaintenanceBackingBean.constructConditionForUserSearch()}"
							postUpdateListener="DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.setOriginalDeskOfficer(DOMaintenanceBackingBean.retrieveUsername())"			
							readOnly="true"/>
					</td>
				</tr>
				<tr>
				<td>
					<h:outputLabel value="#{lbl['lbl.sc.document.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
					<td><p:selectOneMenu
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.docType}"
							style="width: 297px;margin-bottom: 5px;"
							label="#{lbl['lbl.sc.document.type']}" required="true">
							<f:selectItems
								value="#{DOMaintenanceBackingBean.getDocTypeQtLOADropdownValues()}" />
								<p:ajax update="@form" process="@this"/>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td style="width: 165px;">
						  <h:outputLabel for="docNo" value="#{lbl['lbl.sc.document.no']}" />
					</td>
					<td style="width:385px">
						<p:inputText id="docNo"
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.docNo}"
							maxlength="21" style="width:288px;" />
					</td>
							
					<td style="width:165px"><h:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
					<td style="width:385px"><p:selectOneMenu id="procurementid"
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.procurementMode}"
							style="width:297px;margin-bottom: 5px;">
							<f:selectItems
								value="#{DOMaintenanceBackingBean.getProcurementModeDropdownValues()}" />
						</p:selectOneMenu></td>
				</tr>				
				<tr>
					<td><h:outputLabel id="crdateFromLbL" value="#{lbl['lbl.sc.created.date.from']}" /></td>
					<td><p:calendar
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromCreatedDate}"
							id="crdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="crdateTo" />
						</p:calendar></td>
					<td><h:outputLabel id="crdateToLbL" value="#{lbl['lbl.sc.created.date.to']}" /></td>
					<td><p:calendar id="crdateTo" showOn="button"
							label="#{lbl['lbl.sc.created.date.to']}"
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.toCreatedDate}"
							mindate="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromCreatedDate}"
							readonlyInput="true" required="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromCreatedDate ne null or !DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromCreatedDate eq ''}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromCreatedDate}" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
					<td><p:calendar
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromPublishDate}"
							id="pbdateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="pbdateTo"/>
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
					<td><p:calendar id="pbdateTo" showOn="button"
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.toPublishDate}"
							mindate="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromPublishDate}"
							readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromPublishDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
					<td><p:calendar
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromClosingDate}"
							id="cldateFrom" showOn="button" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<p:ajax event="dateSelect" update="cldateTo" />
						</p:calendar></td>
					<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
					<td><p:calendar id="cldateTo" showOn="button"
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.toClosingDate}"
							mindate="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromClosingDate}"
							readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" >
							<f:attribute name="startDate"
								value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.fromClosingDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><h:outputLabel   value="#{lbl['lbl.sc.status']}" /></td>
					<td>
						<ui:param name="loaStatusSelectItems" value="#{DOMaintenanceBackingBean.getQTStatusDropdownValues(ParameterConst.reqNoteMethodCode, ParameterConst.doctypeLetterOfAward,screenName)}"/>
						<ui:param name="loiStatusSelectItems" value="#{DOMaintenanceBackingBean.getQTStatusDropdownValues(ParameterConst.reqNoteMethodCode, ParameterConst.doctypeLetterOfIntent,screenName)}" />
						<ui:param name="qtStatusSelectItems" value="#{DOMaintenanceBackingBean.getQTStatusDropdownValues(ParameterConst.reqNoteMethodCode, ParameterConst.doctypeQuotation,screenName)}" />
						<ui:param name="sfStatusSelectItems" value="#{DOMaintenanceBackingBean.getQTStatusDropdownValues(ParameterConst.reqNoteMethodCode, ParameterConst.doctypeSupplierFinalization,screenName)}" />
						<c:choose>
							<c:when test="#{DOMaintenanceBackingBean.managedSearchBeanDocumentTypeIsLOA}">
								<c:set var="statusList" value="#{loaStatusSelectItems}" scope="view" />
							</c:when>
							<c:when test="#{DOMaintenanceBackingBean.managedSearchBeanDocumentTypeIsLOI}">
								<c:set var="statusList" value="#{loiStatusSelectItems}" scope="view" />
							</c:when>
							<c:when test="#{DOMaintenanceBackingBean.managedSearchBeanDocumentTypeIsSuppFinal}">
								<c:set var="statusList" value="#{sfStatusSelectItems}" scope="view" />
							</c:when>
							<c:otherwise>
								<c:set var="statusList" value="#{qtStatusSelectItems}" scope="view" />
							</c:otherwise>
						</c:choose>	
						
						<p:selectOneMenu 
							value="#{DOMaintenanceBackingBean.managedBean.doMaintenanceSearchBean.qtStatus}"
							style="width: 297px;margin-bottom: 5px;">
							<f:selectItems
								value="#{statusList}" />
						</p:selectOneMenu>
					</td>
				</tr>
			</table>
			
		
	
	</ui:composition>
