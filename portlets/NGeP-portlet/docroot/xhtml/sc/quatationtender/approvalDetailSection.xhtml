<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Approval Details Section" toggleable="true">
		<table>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.appname']}" /></td>
				<td><p:selectOneMenu
						value="#{approvalCategory.scQtApproval.approverId}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItem itemLabel="ROSLAN" itemValue="1" />
						<f:selectItem itemLabel="KHAIR" itemValue="2" />
					</p:selectOneMenu></td>
				<td style="width: 206px;"><p:outputLabel
						value="#{lbl['lbl.sc.qt.appdate']}" /></td>
				<td><p:calendar
						value="#{approvalCategory.scQtApproval.approverActionDate}"
						disabled="#{!qTDetailBB.managedBean.editable}" showOn="button" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Status" /></td>
				<td colspan="3"><p:selectOneMenu
						value="#{approvalCategory.scQtApproval.approverAction}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItem itemLabel="Approve" itemValue="a" />
						<f:selectItem itemLabel="Reject" itemValue="r" />
						<f:selectItem itemLabel="Revice" itemValue="re" />
					</p:selectOneMenu></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="Remark" toggleable="true">
		<table style="width: 50%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" width="24%"><p:outputLabel
						value="Remark" /></td>
				<td class="TableFieldRight"><p:dataGrid
						value="#{approvalBackingBean.managedBean.scQtRemarks}" var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{approvalBackingBean.userImagePath(remarkVar.createdUsername)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUsername}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea cols="40"
										value="#{approvalCategory.scQtApproval.approverRemark}" /></td>
							</tr>
						</table>
					</p:dataGrid></td>

				<td class="TableFieldLeft" width="24%"><p:outputLabel
						value="Supporting Document" /></td>

				<td class="TableFieldRight">
					<table style="width: 150px;">
						<tr>
							<td colspan="2"><p:commandButton
									oncomplete="approvalUpload.show();return false;"
									icon="iconAttachment" value="Attach Files">
									<f:setPropertyActionListener
										value="#{approvalCategory.scQtApproval}"
										target="#{approvalBackingBean.managedBean.scQtApproval}" />
								</p:commandButton></td>
						</tr>
						<tr>
							<td rowspan="2" style="vertical-align: top;" align="left"><h:graphicImage
									library="ep/images/design" height="30" width="30" /></td>
							<td><h:outputText
									value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalAttachment.user.userName}" />,
								<h:outputText
									value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalAttachment.changedDate}">
									<f:convertDateTime
										pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
								</h:outputText></td>
						</tr>

						<tr>
							<td><h:outputText
									value="#{approvalBackingBean.managedBean.scQtApproval.scQtApprovalAttachment.fileName}" />
								<p:spacer width="1px" /> <p:commandButton process="@all"
									icon="ui-icon-delete" /></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>


</ui:composition>
