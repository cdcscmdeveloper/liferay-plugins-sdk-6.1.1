<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog id="cloneQTPopup" widgetVar="clonedlg" modal="true" appendToBody="true" header="#{lbl['lbl.sc.qtn.search']}" 
		width="800" height="400">


		<p:panel toggleable="true">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" columnClasses="columnWidth20">

				<h:outputLabel value="#{lbl['lbl.sc.title']}"/>
				<p:inputText value="#{qTDetailBB.managedBean.cloneQtnTenderSearchBean.qtTitle}" size="100" />

			</h:panelGrid>

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">

				<h:outputLabel value="#{lbl['lbl.sc.qtn.no']}" />
				<p:inputText id="clnqtnno" value="#{qTDetailBB.managedBean.cloneQtnTenderSearchBean.qtNo}" />


				<h:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" />
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.cloneQtnTenderSearchBean.procurementMode}">
					<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
				</p:selectOneMenu>


				<h:outputLabel value="#{lbl['lbl.sc.created.date.from']}" />
				<p:calendar value="#{qTDetailBB.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
					id="clncrdateFrm" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button" />

				<h:outputLabel value="#{lbl['lbl.sc.created.date.to']}" />
				<p:calendar value="#{qTDetailBB.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
					id="clncrdateTo" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button" />


				<h:outputLabel value="#{lbl['lbl.sc.status']}" />
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.cloneQtnTenderSearchBean.qtStatus}"  style="margin-top:5px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItem itemLabel="Option 1" itemValue="" />
					<f:selectItem itemLabel="Option 2" itemValue="" />
					<f:selectItem itemLabel="Option 3" itemValue="" />
				</p:selectOneMenu>

			</h:panelGrid>
			
			<p:commandButton value="#{lbl['lbl.btn.search']}" 
				style="float:right;" action="#{qTDetailBB.cloneSearchQtAction}"
				update="cloneQtsearch">
			</p:commandButton>

			<br />
            <br />
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.search.qtn.result']}" toggleable="true">
			<h:panelGroup style="width:100%;">
				<p:dataTable value="#{qTDetailBB.managedBean.cloneSearchQTDataModel}"
					id="cloneQtsearch" var="tenders"
					rowKey="#{tenders}" rowIndexVar="rowIndex" 
					selection="#{qTDetailBB.managedBean.selectedCloneTenderList}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					lazy="true">
				<p:column selectionMode="single" style="width:2%" />
				<ac:paginator for="cloneQtsearch" />


					
					<p:column headerText="#{lbl['lbl.sc.qtn.no']}">

						<h:outputText value="#{tenders.qtNo}" />



					</p:column>

					<p:column headerText="#{lbl['lbl.sc.title']}">
						<h:outputText value="#{tenders.qtTitle}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.procurement.mode']}">
						<h:outputText value="#{tenders.procurementMode}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.created.date']}">
						<h:outputText value="#{tenders.createdDate}" />
					</p:column>

				</p:dataTable>

			</h:panelGroup>



		</p:panel>

		<p:panel header="#{lbl['lbl.sc.clone.qtn.sections']}" toggleable="true">
			<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">


			<p:dataTable id="clonesection" var="clone"
				value="#{qTDetailBB.managedBean.cloneAllData}" 
				selection="#{qTDetailBB.managedBean.selectedCloneAllList}"
				rowKey="#{clone}" rowIndexVar="rowIndex"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rows="10">
				<p:column selectionMode="multiple" style="width:2%" />
				
					 
					<p:column headerText="#{lbl['lbl.sc.clone.all']}" style="width:25%">
						<h:outputText value="#{clone.displayName}"></h:outputText>
					</p:column>
				</p:dataTable>

			</h:panelGrid>

			<p:commandButton value="#{lbl['lbl.btn.cancel']}" styleClass="apply_button" 
				style="float:right;" oncomplete="clonebtn.hide()">

			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.btn.clone']}"   style="float:right;"
				oncomplete="clonebtn.hide();"></p:commandButton>
		</p:panel>
	</p:dialog>
 
</ui:composition>
