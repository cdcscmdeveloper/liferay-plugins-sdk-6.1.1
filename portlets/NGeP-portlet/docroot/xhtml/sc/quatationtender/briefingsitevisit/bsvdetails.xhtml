<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.briefing.dtls']}" toggleable="true" styleClass="briefingList">
		<table style="width: 100%" border="0">
			<tr>
				<td style="width: 150px;white-space:nowrap;"><p:outputLabel
						value="#{lbl['lbl.sc.briefing.sameas.sv']}" /></td>
				<td><p:selectOneRadio value="#{bsvdtlbean.scQtBsv.sameBsv}"
						disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="true" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="false" />
						<p:ajax update="sameasbsvrequired, addtositebutton"
							listener="#{qTBriefingSiteVisitBackingBean.processChecked}" />
					</p:selectOneRadio></td>
			</tr>
		</table>
		<p:dataTable id="briefingdtlid" var="briefingdtls"
			value="#{bsvdtlbean.briefingList}" rowKey="#{briefingdtls}"
			rowIndexVar="index" styleClass="briefDetails"
			selection="#{bsvdtlbean.selectedBriefingDtls}">

			<ac:paginator for="briefingdtlid" />
			<p:column selectionMode="multiple" style="width:2%"
				disabledSelection="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}" />
			<p:column headerText="#{lbl['lbl.sc.description']}"
				style="white-space: normal;word-wrap: break-word;">
				<h:panelGroup
					rendered="#{QTStatusConst.QT_PROPOSAL_PREPARATION eq qTBriefingSiteVisitBackingBean.managedBean.currentStatusId}">
					<p:commandLink
						action="#{qTBriefingSiteVisitBackingBean.gotoAttandanceDtl(briefingdtls)}"
						partialSubmit="true" process="@this" update="@([id$=briefdlgId])">
						<h:outputText value="#{briefingdtls.bsvDesc}" />
					</p:commandLink>
				</h:panelGroup>
				<h:panelGroup
					rendered="#{QTStatusConst.QT_PROPOSAL_PREPARATION ne qTBriefingSiteVisitBackingBean.managedBean.currentStatusId}">
					<h:outputText value="#{briefingdtls.bsvDesc}" />
				</h:panelGroup>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.date.time']}"
				style="white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{briefingdtls.bsvDate}">
					<f:convertDateTime
						pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.location']}"
				style="white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{briefingdtls.location}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.coordinate.officer']}"
				style="white-space: normal;word-wrap: break-word;">
				<h:outputText value="#{briefingdtls.coordinatingOfficer}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.qt.max.attendance']}"
				style="width:14%;text-align: center;">
				<h:outputText value="#{briefingdtls.maxNoOfAttendance}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}"
				style="white-space: normal;word-wrap: break-word;">
				<h:outputText
					value="#{qTBriefingSiteVisitBackingBean.getStatusDescById(briefingdtls.bsvStatus.statusId)}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.action']}"
				style="width:5%;white-space: normal;text-align: center;">
				<p:commandLink
					rendered="#{QTStatusConst.BSV_COMPLETED ne briefingdtls.bsvStatus.statusId}"
					action="#{qTBriefingSiteVisitBackingBean.editAction(briefingdtls,index,'B')}"
					partialSubmit="true" process="@this" update="@([id$=briefdlgId])">
					<h:graphicImage value="/css/images/design/edit.png" styleClass="tasklist_title1" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
				<div class="ppRightBtn">
					<h:panelGroup id="addtositebutton">
						<p:commandButton id="addtositevisitid"
							update="@([id$=sitevisitdtlid])"
							value="#{lbl['lbl.sc.qt.addtositevisit']}"
							process="@this,briefingdtlid" partialSubmit="true"
							actionListener="#{qTBriefingSiteVisitBackingBean.addToSiteVisitDtl(bsvdtlbean)}"
							rendered="#{bsvdtlbean.scQtBsv.sameBsv eq 'fasle' and !qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}" />
					</h:panelGroup>
					<p:commandButton id="briefingaddid" value="#{lbl['lbl.btn.add']}"
						process="@this"
						disabled="#{bsvdtlbean.briefingList.size() eq 1}"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}"
						action="#{qTBriefingSiteVisitBackingBean.addBsvDetails('B')}"
						oncomplete="addbsvdtls.show();" update="@(.qtBriefDetails)" />

					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this,briefingdtlid" partialSubmit="true"
						rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}"
						oncomplete="briefingDetailsDeletePopUp.show();"
						update="@([id$=#{briefingDetailsDeleteId}])" />
				</div>
				<ui:param name="briefingDetailsDeleteId" value="briefingDetailsDeleteId" />
				<ac:confirmationPopup id="#{briefingDetailsDeleteId}"
					widget="briefingDetailsDeletePopUp"
					okAction="qTBriefingSiteVisitBackingBean.deleteBsvDetails('B')"
					width="450" height="200"
					title="#{lbl['lbl.sc.briefing.dtls']}"
					content="#{lbl['lbl.sc.dialog.confirm.briefing.details.dtls']}"
					update="@form" />
			</f:facet>
		</p:panelGrid>
	</p:panel>

	<h:panelGroup id="sameasbsvrequired">
		<h:panelGroup rendered="#{bsvdtlbean.scQtBsv.sameBsv eq 'fasle'}">

			<p:panel header="#{lbl['lbl.sc.site.visit.dtls']}" toggleable="true" styleClass="briefingList">
				<p:dataTable id="sitevisitdtlid" var="sitevisitdtls"
					value="#{bsvdtlbean.sitevisitList}" styleClass="briefDetails"
					selection="#{bsvdtlbean.selectedSiteVisitDtls}"
					rowKey="#{sitevisitdtls}" rowIndexVar="rowIndex" editable="true">

					<ac:paginator for="sitevisitdtlid" />
					<p:column selectionMode="multiple" style="width:2%"
						disabledSelection="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}" />

					<p:column headerText="#{lbl['lbl.sc.description']}"
						style="white-space: normal;word-wrap: break-word;">
						<h:panelGroup
							rendered="#{QTStatusConst.QT_PROPOSAL_PREPARATION eq qTBriefingSiteVisitBackingBean.managedBean.currentStatusId}">
							<p:commandLink
								action="#{qTBriefingSiteVisitBackingBean.gotoAttandanceDtl(sitevisitdtls)}"
								partialSubmit="true" process="@this" update="@([id$=briefdlgId])">
								<h:outputText value="#{sitevisitdtls.bsvDesc}" />
							</p:commandLink>
						</h:panelGroup>
						<h:panelGroup
							rendered="#{QTStatusConst.QT_PROPOSAL_PREPARATION ne qTBriefingSiteVisitBackingBean.managedBean.currentStatusId}">
							<h:outputText value="#{sitevisitdtls.bsvDesc}" />
						</h:panelGroup>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.date.time']}"
						style="white-space: normal;word-wrap: break-word;">
						<h:outputText value="#{sitevisitdtls.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
						</h:outputText>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.location']}"
						style="white-space: normal;word-wrap: break-word;">
						<h:outputText value="#{sitevisitdtls.location}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.coordinate.officer']}"
						style="white-space: normal;word-wrap: break-word;">
						<h:outputText value="#{sitevisitdtls.coordinatingOfficer}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.qt.max.attendance']}"
						style="width:14%;text-align: center;">
						<h:outputText value="#{sitevisitdtls.maxNoOfAttendance}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.status']}"
						style="white-space: normal;word-wrap: break-word;">
						<h:outputText
							value="#{qTBriefingSiteVisitBackingBean.getStatusDescById(sitevisitdtls.bsvStatus.statusId)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}"
						style="width:5%;white-space: normal;text-align: center;">
						<p:commandLink
							rendered="#{QTStatusConst.BSV_COMPLETED ne sitevisitdtls.bsvStatus.statusId}"
							action="#{qTBriefingSiteVisitBackingBean.editAction(sitevisitdtls,rowIndex,'S')}"
							partialSubmit="true" process="@this" update="@([id$=briefdlgId])">
							<h:graphicImage value="/css/images/design/edit.png" styleClass="tasklist_title1" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
				<p:panelGrid columns="2" style="width:100%;"
					styleClass="noBorders tr,noBorders td">
					<f:facet name="footer">
						<div class="ppRightBtn">
							<p:commandButton id="addsitevisitid"
								rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}"
								value="#{lbl['lbl.btn.add']}" process="@this"
								action="#{qTBriefingSiteVisitBackingBean.addBsvDetails('S')}"
								oncomplete="addbsvdtls.show();" update="@(.qtBriefDetails)" />

							<p:commandButton value="#{lbl['lbl.btn.delete']}"
								rendered="#{!qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}"
								process="@this, sitevisitdtlid" partialSubmit="true"
								oncomplete="sitevisitDetailsDeletePopUp.show();"
								update="@([id$=#{sitevistDetailsDeleteId}])" />
						</div>
						<ui:param name="sitevistDetailsDeleteId" value="sitevistDetailsDeleteId" />
						<ac:confirmationPopup id="#{sitevistDetailsDeleteId}"
							widget="sitevisitDetailsDeletePopUp"
							okAction="qTBriefingSiteVisitBackingBean.deleteBsvDetails('S')"
							width="450" height="200"
							title="#{lbl['lbl.sc.briefing.dtls']}"
							content="#{lbl['lbl.sc.dialog.confirm.sitevisit.details.dtls']}"
							update="@form" />
					</f:facet>
				</p:panelGrid>
				<h:panelGroup rendered="#{bsvdtlbean.sitevisitList.size() eq 1}">
					<table style="width: 100%" border="0">
						<tr>
							<td style="width: 140px;"><p:outputLabel
									value="#{lbl['lbl.sc.qt.attendance.site']}" /></td>
							<td style="width: 130px;white-space:nowrap;"><p:selectOneRadio
									disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}"
									value="#{bsvdtlbean.scQtBsv.allSiteVisitReq}">
									<f:selectItem itemLabel="#{lbl['lbl.sc.qt.all']}" itemValue="true" />
									<f:selectItem itemLabel="#{lbl['lbl.sc.qt.atleast']}" itemValue="false" />
									<p:ajax event="click"
										listener="#{qTBriefingSiteVisitBackingBean.siteVisitClickEvent}"
										update="@([id$=minSiteVisitAtt])" />
								</p:selectOneRadio></td>
							<td style="width: 60px;"><h:panelGroup id="minSiteVisitAtt">
									<ui:fragment rendered="#{!bsvdtlbean.scQtBsv.allSiteVisitReq}">
										<p:inputText id="minSiteVisitAttss" size="5" style="width: 30px;"
											value="#{bsvdtlbean.scQtBsv.minSiteVisitAttend}"
											readonly="#{bsvdtlbean.scQtBsv.allSiteVisitReq}" />
									</ui:fragment>
								</h:panelGroup></td>
							<td>
								<ac:iconTooltip value="#{lbl['lbl.sc.qt.attendance.tooltip']}" />
							</td>
						</tr>
					</table>
				</h:panelGroup>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>

	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslists">
			<tr>
				<td class="TableFieldLeft" style="width: 60px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid
						value="#{bsvdtlbean.scQtBsv.bsvRemarks}" var="remarkVar"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage
										value="#{qTBriefingSiteVisitBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDates" value="#{remarkVar.changedDate}">
										<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
										disabled="#{qTDetailBB.enableFieldByStatusNFiledName(QTFieldConst.FILED_QT_BSVDETAILS)}"
										rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" /></td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
