<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog id="briefdlgId" widgetVar="addbsvdtls" position="top"
		dynamic="true" resizable="false" style="width:692px;height:335px;" modal="true"
		styleClass="pop_up_top" header="Briefing/SiteVisit Details">
	<c:if test="#{!empty qTBriefingSiteVisitBackingBean.managedBean.qtBriefing}">
		<p:panel id="bsvdetailsdlg" toggleable="true" styleClass="qtBriefDetails">
			<p:messages id="briefmessages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />

			<table style="width: 100%" border="0">
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.so.briefdesc']}" /> <p:outputLabel value="*"
							styleClass="mandatory" /></td>
					<td colspan="3"><p:inputText id="briefdesc"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.briefdesc']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.bsvDesc}"
							style="margin-top:5px;" size="95" maxlength="50" />
						<p:message id="briefdescMsg" for="briefdesc" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.briefdate']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td colspan="3"><p:calendar id="briefdate"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.briefdate']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.bsvDate}"
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button" />
						<p:message id="briefdateMsg" for="briefdate" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.location']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td colspan="3"><p:inputText id="brieflocation"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.location']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.location}"
							style="margin-top:5px;" size="30" maxlength="450" /> <p:message
							id="brieflocationMsg" for="brieflocation" display="icon" /></td>

				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add1']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.address1}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.state']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu style="width: 218px;margin-bottom: 5px;"
							id="briefstate"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.state']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.pmState.stateId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="state"
								value="#{qTBriefingSiteVisitBackingBean.managedBean.states}"
								itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
							<p:ajax event="change"
								listener="#{qTBriefingSiteVisitBackingBean.retrievePmDistrictList}"
								update="@(.brieftstate)" partialSubmit="true"/>
						</p:selectOneMenu> <p:message id="briefstateMsg" for="briefstate" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add2']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.address2}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.district']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu styleClass="brieftstate"
							style="width: 218px;margin-bottom: 5px;" id="briefdistrict"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.district']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.pmDistrict.districtId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="district"
								value="#{qTBriefingSiteVisitBackingBean.managedBean.districts}"
								itemValue="#{district.districtId}"
								itemLabel="#{district.districtName}" />
							<p:ajax event="change"
								listener="#{qTBriefingSiteVisitBackingBean.retrievePmCityList}"
								update="@(.briefdistrictCity)" partialSubmit="true"/>
						</p:selectOneMenu> <p:message id="briefdistrictMsg" for="briefdistrict"
							display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add3']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.address3}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.city']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu styleClass="briefdistrictCity"
							style="width: 218px;margin-bottom: 5px;" id="briefcity"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.city']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.pmCity.cityId}">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems var="city"
								value="#{qTBriefingSiteVisitBackingBean.managedBean.citys}"
								itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />								
						</p:selectOneMenu> <p:message id="briefcityMsg" for="briefcity" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.add4']}" /></td>
					<td><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.address4}"
							size="30" maxlength="255" /></td>
					<td><p:outputLabel value="#{lbl['lbl.so.postcode']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:inputText id="briefpost"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.postcode']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.address.postcode}"
							size="38" maxlength="10" /> <p:message id="briefpostMsg"
							for="briefpost" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.coordinateofficer']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td colspan="3"><p:inputText id="briefofficer"
							required="#{qTBriefingSiteVisitBackingBean.managedBean.required}"
							label="#{lbl['lbl.so.coordinateofficer']}"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.coordinatingOfficer}"
							size="95" maxlength="50" /> <p:message id="briefofficerMsg"
							for="briefofficer" display="icon" /></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.maxattendance']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTBriefingSiteVisitBackingBean.managedBean.qtBriefing.maxNoOfAttendance}"
							size="30" maxlength="2" /></td>
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					styleClass="apply_button" 
					update="@([id$=briefingdtlid]),@([id$=sitevisitdtls]), @([id$=bsvdetailsdlg])" 
					process="@(.qtBriefDetails)" 
					icon="ui-icon-check" partialSubmit="true"
					action="#{qTBriefingSiteVisitBackingBean.addToBriefingList}" >					
					</p:commandButton>

				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" process="@this"
					styleClass="apply_button" action="#{qTBriefingSiteVisitBackingBean.cancelBriefingList}" 
					icon="ui-icon-cancel" />

			</div>
		</p:panel>
		</c:if>
	</p:dialog>
</ui:composition>
