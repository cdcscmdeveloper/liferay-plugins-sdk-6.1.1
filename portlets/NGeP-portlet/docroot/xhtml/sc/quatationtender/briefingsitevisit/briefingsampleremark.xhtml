<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<p:spacer height="5" />
		<p:panel header="Remark" toggleable="true">
			<table style="width: 100%" id="remarkslists">
				<tr>
					<td class="TableFieldLeft" style="width: 60px;"><p:outputLabel
							value="Remark" /></td>
					<td class="TableFieldRight"><p:dataGrid
							value="#{qTScheduleDetailBackingBean.managedBean.qtBriefing.scQt.scQtBriefingRemarks}"
							var="remarkVar" rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage
											value="#{qTScheduleDetailBackingBean.userImagePath(remarkVar.createdUsername)}"
											height="30" width="30" /></td>
									<td width="5"></td>
									<td><h:outputText value="#{remarkVar.createdUsername}" />,
										<h:outputText id="remarkDates"
											value="#{remarkVar.changedDate}">
											<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><p:inputTextarea cols="40"
											value="#{qTScheduleDetailBackingBean.managedBean.qtBriefing.approverRemark}" /></td>
								</tr>
							</table>
						</p:dataGrid></td>
				</tr>
			</table>
		</p:panel>
	</p:panel>
</ui:composition>
