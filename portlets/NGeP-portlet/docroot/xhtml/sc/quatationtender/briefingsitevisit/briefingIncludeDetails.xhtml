<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<p:panel id="qtBriefDetails" header="Briefing Details"
			toggleable="true">
			<p:spacer height="3px" />
			<table style="width: 100%" border="0">
				<tr>
					<td style="width: 160px;"><p:outputLabel
							value="#{lbl['lbl.so.briefsamevisit']}" /></td>
					<td><p:selectOneRadio
							value="#{zonePnlList.scQtBsv.sameBsv}">
							<f:selectItem itemLabel="Yes" itemValue="true" />
							<f:selectItem itemLabel="No" itemValue="false" />
							<p:ajax update="samebsvrequireid, addtositebuttonid"
								listener="#{qTBriefingSiteVisitBackingBean.processChecked}" />
						</p:selectOneRadio></td>
				</tr>
			</table>
			<p:spacer height="3px" />
			<p:dataTable id="zonebriefdtlsid" var="zonebriefdtls"
				value="#{briefingList}" rowKey="#{zonebriefdtls}"
				rowIndexVar="index" editable="true"
				selection="#{selectedbriefingList}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="zonebriefdtlsid" />

				<p:column headerText="#{lbl['lbl.so.desc']}">
					<h:outputText value="#{zonebriefdtls.bsvDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.date']}" style="width :5%;">
					<h:outputText value="#{zonebriefdtls.bsvDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.location']}">
					<h:outputText value="#{zonebriefdtls.location}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.coordinateofficer']}"
					style="width :17%;">
					<h:outputText value="#{zonebriefdtls.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.maxattendance']}"
					style="width :5%;">
					<h:outputText value="#{zonebriefdtls.maxNoOfAttendance}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.briefstatus']}"
					style="width :8%;">
					<h:outputText
						value="#{qTBriefingSiteVisitBackingBean.getStatusDescById(zonebriefdtls.bsvStatus.statusId)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.action']}" style="width :6%;">
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
</ui:composition>
