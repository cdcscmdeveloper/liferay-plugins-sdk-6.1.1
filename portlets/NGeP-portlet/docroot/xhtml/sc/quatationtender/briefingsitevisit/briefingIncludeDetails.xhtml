<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<p:panel id="qtBriefDetails" header="Briefing Details"
			toggleable="true">
			<p:spacer height="3px" />
			<table style="width: 100%" border="1">
				<tr>
					<td style="width: 160px;"><p:outputLabel
							value="#{lbl['lbl.so.briefsamevisit']}" /></td>
					<td></td>
				</tr>
			</table>
			<p:spacer height="3px" />

			<p:dataTable value="#{briefingList}" id="briefdetaillistid"
				var="briefdetails" rowKey="#{briefdetails}" rowIndexVar="index"
				editable="true" selection="#{selectedbriefingList}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="briefdetaillistid" />

				<p:column headerText="#{lbl['lbl.so.desc']}">
					<p:commandLink
						action="#{qTScheduleDetailBackingBean.editAction(briefdetails)}"
						style="margin-right:20px;" partialSubmit="true" process="@this">
						<h:outputText value="#{briefdetails.briefingDesc}" />
					</p:commandLink>

				</p:column>

				<p:column headerText="#{lbl['lbl.so.date']}" style="width :5%;">
					<h:outputText value="#{briefdetails.briefingDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.location']}">
					<h:outputText value="#{briefdetails.location}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.coordinateofficer']}"
					style="width :17%;">
					<h:outputText value="#{briefdetails.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.maxattendance']}"
					style="width :5%;">
					<h:outputText value="#{briefdetails.maxNoAttendance}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.briefstatus']}"
					style="width :8%;">
					<h:outputText
						value="#{qTScheduleDetailBackingBean.getStatusDescById(briefdetails.pmStatus.statusId)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.action']}" style="width :6%;">
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
</ui:composition>
