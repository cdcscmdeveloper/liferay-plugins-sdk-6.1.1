<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:spacer height="5px" />

	<c:if test="#{qTBriefingSiteVisitBackingBean.managedBean.qt.zonal}">
		<ui:include src="briefingsitevisitdtlbyzone.xhtml" />

	</c:if>

	<c:if test="#{!qTBriefingSiteVisitBackingBean.managedBean.qt.zonal}">

		<p:panel header="#{lbl['lbl.qt.nb.briefDtl']}" toggleable="true">
			<p:spacer height="3px" />
			<table style="width: 100%" border="0">
				<tr>
					<td style="width: 160px;"><p:outputLabel
							value="#{lbl['lbl.so.briefsamevisit']}" /></td>
					<td><p:selectOneRadio
							value="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.sameBsv}">
							<f:selectItem itemLabel="Yes" itemValue="true" />
							<f:selectItem itemLabel="No" itemValue="false" />
							<p:ajax update="sameasbsvrequired, addtositebutton"
								listener="#{qTBriefingSiteVisitBackingBean.processChecked}" />
						</p:selectOneRadio></td>
				</tr>
			</table>
			<p:spacer height="3px" />
			<p:dataTable id="briefingdtlid" var="briefingdtls"
				value="#{qTBriefingSiteVisitBackingBean.managedBean.briefings}"
				rowKey="#{briefingdtls}" rowIndexVar="index" editable="true"
				selection="#{qTBriefingSiteVisitBackingBean.managedBean.selectedBriefingDetails}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="briefingdtlid" />

				<p:column headerText="#{lbl['lbl.so.desc']}">
					<p:commandLink
						action="#{qTBriefingSiteVisitBackingBean.editAction(briefingdtls)}"
						style="margin-right:20px;" partialSubmit="true" process="@this">
						<h:outputText value="#{briefingdtls.bsvDesc}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.date']}">
					<h:outputText value="#{briefingdtls.bsvDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.location']}">
					<h:outputText value="#{briefingdtls.location}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.coordinateofficer']}">
					<h:outputText value="#{briefingdtls.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.maxattendance']}">
					<h:outputText value="#{briefingdtls.maxNoOfAttendance}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.briefstatus']}">
					<h:outputText
						value="#{qTBriefingSiteVisitBackingBean.getStatusDescById(briefingdtls.bsvStatus.statusId)}" />
				</p:column>

			</p:dataTable>
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<f:facet name="footer">
					<div align="right">
						<h:panelGroup id="addtositebutton">
							<p:commandButton id="addtositevisitid" update="sitevisitdtlid"
								value="#{lbl['lbl.so.addtositevisit']}" icon="ui-icon-add"
								process="@this, briefingdtlid" partialSubmit="true"
								actionListener="#{qTBriefingSiteVisitBackingBean.addToSiteVisitDtl}"
								rendered="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.sameBsv eq 'fasle'}" />
						</h:panelGroup>
						<p:commandButton id="briefingaddid"
							value="#{lbl['lbl.so.addbtn']}" process="@this"
							action="#{qTBriefingSiteVisitBackingBean.addBriefingDetails}"
							oncomplete="dlg1.show();" update="@(.qtBriefDetails)"
							icon="ui-icon-add" />

						<p:commandButton value="#{lbl['lbl.so.delete']}"
							icon="ui-icon-delete"
							action="#{qTBriefingSiteVisitBackingBean.deleteBriefingDetails}"
							update="briefingdtlid" />
					</div>
				</f:facet>
			</p:panelGrid>
			<table style="width: 100%" border="0">
				<tr>
					<td style="width: 160px;"><p:outputLabel
							value="#{lbl['lbl.so.attendance.brief']}" /></td>
					<td style="width: 130px;"><p:selectOneRadio
							value="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.allBriefingReq}">
							<f:selectItem itemLabel="All" itemValue="true" />
							<f:selectItem itemLabel="At Least" itemValue="false" />
						</p:selectOneRadio></td>
					<td><p:inputText size="5"
							value="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.minBriefingAttend}" /></td>
					<td />
				</tr>
			</table>
		</p:panel>

		<h:panelGroup id="sameasbsvrequired">
			<h:panelGroup
				rendered="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.sameBsv eq 'fasle'}">

				<p:panel header="#{lbl['lbl.qt.nb.siteDtl']}" toggleable="true">
					<p:dataTable id="sitevisitdtlid" var="sitevisitdtls"
						value="#{qTBriefingSiteVisitBackingBean.managedBean.siteBriefings}"
						selection="#{qTBriefingSiteVisitBackingBean.managedBean.selectedSiteVisitDetails}"
						rowKey="#{sitevisitdtls}" rowIndexVar="rowIndex" editable="true">

						<ac:paginator for="sitevisitdtlid" />

						<p:column selectionMode="multiple" style="width:2%" />

						<p:column headerText="#{lbl['lbl.so.desc']}">
							<p:commandLink
								action="#{qTBriefingSiteVisitBackingBean.editAction(sitevisitdtls)}"
								style="margin-right:20px;" partialSubmit="true" process="@this">
								<h:outputText value="#{sitevisitdtls.bsvDesc}" />
							</p:commandLink>
						</p:column>

						<p:column headerText="#{lbl['lbl.so.date']}">
							<h:outputText value="#{sitevisitdtls.bsvDate}">
								<f:convertDateTime
									pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
							</h:outputText>
						</p:column>

						<p:column headerText="#{lbl['lbl.so.location']}">
							<h:outputText value="#{sitevisitdtls.location}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.so.coordinateofficer']}">
							<h:outputText value="#{sitevisitdtls.coordinatingOfficer}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.so.maxattendance']}">
							<h:outputText value="#{sitevisitdtls.maxNoOfAttendance}" />
						</p:column>

						<p:column headerText="#{lbl['lbl.so.briefstatus']}">
							<h:outputText
								value="#{qTBriefingSiteVisitBackingBean.getStatusDescById(sitevisitdtls.bsvStatus.statusId)}" />
						</p:column>

					</p:dataTable>
					<p:panelGrid columns="2" style="width:100%;"
						styleClass="noBorders tr,noBorders td">
						<f:facet name="footer">
							<div align="right">

								<p:commandButton id="addsitevisitid"
									value="#{lbl['lbl.so.addbtn']}" process="@this"
									action="#{qTBriefingSiteVisitBackingBean.addSiteDetails}"
									oncomplete="dlg2.show();" update="@(.qtSiteBriefDetails)"
									icon="ui-icon-add" />

								<p:commandButton value="#{lbl['lbl.so.delete']}"
									icon="ui-icon-delete"
									action="#{qTBriefingSiteVisitBackingBean.deleteSitevisitDetails}"
									update="sitevisitdtlid" />

							</div>
						</f:facet>
					</p:panelGrid>
					<table style="width: 100%" border="0">
						<tr>
							<td style="width: 160px;"><p:outputLabel
									value="#{lbl['lbl.so.attendance.site']}" /></td>
							<td style="width: 130px;"><p:selectOneRadio
									value="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.allSiteVisitReq}">
									<f:selectItem itemLabel="All" itemValue="true" />
									<f:selectItem itemLabel="At Least" itemValue="false" />
								</p:selectOneRadio></td>
							<td><p:inputText size="5"
									value="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.minSiteVisitAttend}" /></td>
							<td />
						</tr>
					</table>
				</p:panel>
			</h:panelGroup>
		</h:panelGroup>

		<p:panel header="Remark" toggleable="true">
			<table style="width: 100%" id="remarkslists">
				<tr>
					<td class="TableFieldLeft" style="width: 60px;"><p:outputLabel
							value="Remark" /></td>
					<td class="TableFieldRight"><p:dataGrid
							value="#{qTBriefingSiteVisitBackingBean.managedBean.scQtBsv.bsvRemarks}"
							var="remarkVar" rowIndexVar="remarkIndex" columns="1">
							<table>
								<tr>
									<td rowspan="2" valign="top"><h:graphicImage
											value="#{qTBriefingSiteVisitBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
											height="30" width="30" /></td>
									<td width="5"></td>
									<td><h:outputText
											value="#{remarkVar.createdUser.userName}" />, <h:outputText
											id="remarkDates" value="#{remarkVar.changedDate}">
											<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
										</h:outputText></td>
								</tr>
								<tr>
									<td></td>
									<td><h:inputTextarea cols="40" value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId eq null}" /> <h:outputText
											value="#{remarkVar.remark}"
											rendered="#{remarkVar.remarkId ne null}"
											style="display: inline-block; width:220px;word-wrap: break-word;" /></td>
								</tr>
							</table>
						</p:dataGrid></td>
				</tr>
			</table>
		</p:panel>
	</c:if>

</ui:composition>
