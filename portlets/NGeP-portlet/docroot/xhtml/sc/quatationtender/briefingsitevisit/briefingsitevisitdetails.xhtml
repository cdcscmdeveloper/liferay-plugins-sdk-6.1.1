<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Briefing/Site Visit Schedule" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="62%"
			columns="2" columnClasses="columnWidth30,columnWidth70">

			<h:outputLabel value="#{lbl['lbl.so.briefsitereq']}" />
			<p:selectOneRadio
				value="#{qTScheduleDetailBackingBean.managedBean.qt.bsvRequired}"
				disabled="#{!qTDetailBB.managedBean.editable}">
				<f:selectItem itemLabel="Yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
				<p:ajax update="bsvrequireid"
					listener="#{qTSupplierQulCriteriaBackingBean.processChecked}" />
			</p:selectOneRadio>

		</h:panelGrid>
	</p:panel>



	<h:panelGroup id="bsvrequireid"
		rendered="#{qTScheduleDetailBackingBean.managedBean.qt.bsvRequired eq 'true' and qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality eq true}">

		<p:dataTable id="zoneLocationDataTables"
			value="#{qTScheduleDetailBackingBean.managedBean.treeNodesList}"
			var="zoneTree" style="width:65%">
			<p:column headerText="Location">
				<p:tree value="#{zoneTree}" var="location">
					<p:treeNode>
						<h:outputText value="#{location.locationName}" />
					</p:treeNode>
				</p:tree>
			</p:column>
		</p:dataTable>


		<p:panel header="Briefing Details" toggleable="true">
			<p:dataTable
				value="#{qTScheduleDetailBackingBean.managedBean.briefings}"
				scrollable="true" scrollWidth="796" id="briefdetaillistid"
				var="briefdetails"
				selection="#{qTScheduleDetailBackingBean.managedBean.selectedBriefingDetails}"
				rowKey="#{briefdetails}" rowIndexVar="rowIndex" rows="10">

				<p:column selectionMode="multiple" style="width:5%" />

				<ac:paginator for="briefdetaillistid" />

				<p:column headerText="#{lbl['lbl.so.desc']}">
					<p:commandLink>
						<h:outputText value="#{briefdetails.briefingDesc}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.date']}">
					<h:outputText value="#{briefdetails.briefingDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.location']}">
					<p:commandLink>
						<h:outputText value="#{briefdetails.location}" />
					</p:commandLink>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.coordinateofficer']}">
					<h:outputText value="#{briefdetails.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.briefstatus']}">
					<h:outputText
						value="#{qTScheduleDetailBackingBean.getStatusDescById(briefdetails.pmStatus.statusId)}" />
				</p:column>
			</p:dataTable>

		</p:panel>

	</h:panelGroup>

</ui:composition>
