<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="titleSection">
	</ui:define>

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<p:messages id="bsvattanadance" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:left">
						<p:commandButton value="#{lbl['lbl.btn.back']}"
							style="float:left;"
							action="#{qTBriefingSiteVisitBackingBean.briefingBackAction}" />
					</p:column>

					<p:column width="100%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.btn.submit']}"
							process="@form"
							action="#{bsvAttendanceBackingBean.saveBsvRegistarionFromMaintanceFlow}"
							onstart="blockWidget.show();"
							oncomplete="blockWidget.hide();" />
					</p:column>
				</p:row>
			</p:panelGrid>
		
		
			<table style="width: 100%">
				<tr>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.sc.briefing']}:" /></td>
					<td style="width: 40%" class="header-info-text">
						#{bsvAttendanceBackingBean.managedBean.scQtBriefing.bsvDesc}</td>
					<td style="width: 10%"><h:outputLabel
							value="#{lbl['lbl.sc.date.time']}:" /></td>
					<td style="width: 40%" class="header-info-text"><h:outputText
							value="#{bsvAttendanceBackingBean.managedBean.scQtBriefing.bsvDate}">
							<f:convertDateTime
								pattern="#{CommonConstants.DEFAULT_12HR_DATETIME_FORMAT}" />
						</h:outputText></td>

				</tr>

			</table>
		

		<ui:include src="/xhtml/sc/bsvattendance/addattendance/addRegistrationdetails.xhtml"></ui:include>

	</ui:define>
</ui:composition>
