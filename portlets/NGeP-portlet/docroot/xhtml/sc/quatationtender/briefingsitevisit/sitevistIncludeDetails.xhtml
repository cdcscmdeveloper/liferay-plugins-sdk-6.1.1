<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel>
		<p:panel id="qtSitevisitDetails" header="Site Visit Details"
			toggleable="true">
			<p:spacer height="3px" />

			<p:dataTable value="#{sitevisitList}" id="sitevisitdetaillistid"
				var="sitevisitdtls" rowKey="#{sitevisitdtls}" rowIndexVar="index"
				editable="true" selection="#{selectedSitevisitList}">

				<p:column selectionMode="multiple" style="width:2%" />

				<ac:paginator for="sitevisitdetaillistid" />

				<p:column headerText="#{lbl['lbl.so.desc']}">
					<h:outputText value="#{sitevisitdtls.bsvDesc}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.date']}" style="width :5%;">
					<h:outputText value="#{sitevisitdtls.bsvDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.location']}">
					<h:outputText value="#{sitevisitdtls.location}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.coordinateofficer']}"
					style="width :17%;">
					<h:outputText value="#{sitevisitdtls.coordinatingOfficer}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.maxattendance']}"
					style="width :5%;">
					<h:outputText value="#{sitevisitdtls.maxNoOfAttendance}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.briefstatus']}"
					style="width :8%;">

				</p:column>
				<p:column headerText="#{lbl['lbl.so.action']}" style="width :6%;">
				</p:column>
			</p:dataTable>
		</p:panel>
	</p:panel>
</ui:composition>
