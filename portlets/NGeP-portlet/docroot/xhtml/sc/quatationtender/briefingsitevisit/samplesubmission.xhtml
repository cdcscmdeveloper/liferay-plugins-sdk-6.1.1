<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel styleClass="sampleDetails">
		<table>
			<tr>
				<td style="width: 80px;"><p:outputLabel value="Address 1" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address1}"
						size="30" /></td>
				<td style="width: 200px;"><p:outputLabel value="* State" /></td>
				<td><p:selectOneMenu
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmState.stateId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="state"
							value="#{qTScheduleDetailBackingBean.managedBean.states}"
							itemLabel="#{state.stateName}" itemValue="#{state.stateId}" />
						<p:ajax event="change"
							listener="#{qTScheduleDetailBackingBean.retrievePmDistrictList}"
							update="@(.stateDistrict)" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address 2" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address2}"
						size="30" /></td>
				<td><p:outputLabel value="District" /></td>
				<td><p:selectOneMenu styleClass="stateDistrict"
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmDistrict.districtId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="district"
							value="#{qTScheduleDetailBackingBean.managedBean.districts}"
							itemValue="#{district.districtId}"
							itemLabel="#{district.districtName}" />
						<p:ajax event="change"
							listener="#{qTScheduleDetailBackingBean.retrievePmCityList}"
							update="@(.districtCity)" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address 3" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address3}"
						size="30" /></td>
				<td><p:outputLabel value="* City/Town" /></td>
				<td><p:selectOneMenu styleClass="districtCity"
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.pmCity.cityId}">
						<f:selectItem itemLabel="-- Select -- " itemValue="" />
						<f:selectItems var="city"
							value="#{qTScheduleDetailBackingBean.managedBean.citys}"
							itemValue="#{city.cityId}" itemLabel="#{city.cityName}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="Address 4" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.address4}"
						size="30" /></td>
				<td><p:outputLabel value="* Postalcode" /></td>
				<td><p:inputText
						value="#{qTScheduleDetailBackingBean.managedBean.scQtSampleSubmission.address.postcode}"
						size="30" /></td>
			</tr>
		</table>

	</p:panel>
</ui:composition>
