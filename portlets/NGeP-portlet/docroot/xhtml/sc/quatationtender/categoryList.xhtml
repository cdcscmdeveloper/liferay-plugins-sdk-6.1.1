<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.category.code.list']}" toggleable="true">
		<p:dataTable id="#{criteriaPnlId}" var="scQtCategory"
			value="#{criteriaList}" editable="true" style="width:100%"
			rowIndexVar="index" rowKey="#{scQtCategory}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selection="#{criteriaselectList}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="#{criteriaPnlId}" />

			<p:column headerText="#{lbl['lbl.sc.category.code']}" />

			<p:column headerText="#{lbl['lbl.sc.main.category']}" />
			<p:column headerText="#{lbl['lbl.sc.sub.category']}" />
			<p:column headerText="#{lbl['lbl.sc.sub.category.division']}" />
			<p:column headerText="#{lbl['lbl.sc.category.type']}" />

		</p:dataTable>
	</p:panel>
</ui:composition>
