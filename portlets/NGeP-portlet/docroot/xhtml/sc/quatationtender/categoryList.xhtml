<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dataTable
		value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
		var="scQtCategory" id="catcode"
		selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedCategoryList}"
		rowKey="#{scQtCategory}" rowIndexVar="rowIndex">

		<p:column selectionMode="multiple" style="width:2%" />

		<ac:paginator for="catcode" />

		<p:column headerText="#{lbl['lbl.so.category']}">
			<p:inputText value="#{scQtCategory.pmCategoryL1.categoryL1Code}"
				rendered="#{rowIndex lt qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList.size()-1 or !scQtCategory.brandNew}"
				disabled="true" />
			<p:selectOneMenu value="#{scQtCategory.pmCategoryL1.categoryL1Id}"
				rendered="#{rowIndex eq qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList.size()-1 and scQtCategory.brandNew}">
				<f:selectItem itemLabel="Select One" itemValue="#{null}" />
				<f:selectItems
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL1s}"
					var="catL1Opt" itemLabel="#{catL1Opt.categoryL1Code}"
					itemValue="#{catL1Opt.categoryL1Id}" />
				<p:ajax event="change"
					listener="#{qTSupplierQulCriteriaBackingBean.handleL1CategoryChange(scQtCategory)}"
					partialSubmit="true" process="@this"
					update="categoryL2s, categoryL3s" />
			</p:selectOneMenu>

			<p:inputText value="#{scQtCategory.pmCategoryL2.categoryL2Code}"
				rendered="#{rowIndex lt qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList.size()-1 or !scQtCategory.brandNew}"
				disabled="true" />
			<p:selectOneMenu id="categoryL2s"
				value="#{scQtCategory.pmCategoryL2.categoryL2Id}"
				rendered="#{rowIndex eq qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList.size()-1 and scQtCategory.brandNew}">
				<f:selectItem itemLabel="Select One" itemValue="#{null}" />
				<f:selectItems
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL2s}"
					var="catL2Opt" itemLabel="#{catL2Opt.categoryL2Code}"
					itemValue="#{catL2Opt.categoryL2Id}" />
				<p:ajax event="change"
					listener="#{qTSupplierQulCriteriaBackingBean.handleL2CategoryChange(scQtCategory)}"
					partialSubmit="true" process="@this" update="categoryL3s" />
			</p:selectOneMenu>

			<p:inputText value="#{scQtCategory.pmCategoryL3.categoryL3Code}"
				rendered="#{rowIndex lt qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList.size()-1 or !scQtCategory.brandNew}"
				disabled="true" />
			<p:selectOneMenu id="categoryL3s"
				value="#{scQtCategory.pmCategoryL3.categoryL3Id}"
				rendered="#{rowIndex eq qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList.size()-1 and scQtCategory.brandNew}">
				<f:selectItem itemLabel="Select One" itemValue="#{null}" />
				<f:selectItems
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL3s}"
					var="catL3Opt" itemLabel="#{catL3Opt.categoryL3Code}"
					itemValue="#{catL3Opt.categoryL3Id}" />
				<p:ajax event="change"
					listener="#{qTSupplierQulCriteriaBackingBean.handleL3CategoryChange(scQtCategory)}"
					partialSubmit="true" process="@this" update="@this" />
			</p:selectOneMenu>
		</p:column>
		<p:column headerText="Main-Category">
		</p:column>
		<p:column headerText="Sub-Category">
		</p:column>
		<p:column headerText="Sub-Category Division">
		</p:column>
		<p:column headerText="Category Type">
		</p:column>
		<p:column headerText="#{lbl['lbl.so.mandatory']}">
			<p:selectBooleanCheckbox value="#{scQtCategory.mandatory}"
				disabled="#{!qTDetailBB.managedBean.editable}" />
		</p:column>
	</p:dataTable>

	<p:spacer height="15" />

	<div align="right">
		<p:commandButton value="#{lbl['lbl.so.addbtn']}"
			rendered="#{qTDetailBB.managedBean.editable}"
			actionListener="#{qTSupplierQulCriteriaBackingBean.addNewCategoryAction}"
			update="catcode" icon="ui-icon-add" />
		<p:commandButton value="#{lbl['lbl.so.delete']}"
			rendered="#{qTDetailBB.managedBean.editable}" icon="ui-icon-delete" />
	</div>
</ui:composition>
