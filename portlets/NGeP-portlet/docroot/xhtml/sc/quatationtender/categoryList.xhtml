<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.category.code']}" toggleable="true">
		<p:dataTable id="#{criteriaPnlId}" var="scQtCategory"
			value="#{criteriaList}" editable="true" style="width:100%"
			rowIndexVar="index" rowKey="#{scQtCategory}"
			selection="#{criteriaselectList}">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="#{criteriaPnlId}" />

			<p:column headerText="#{lbl['lbl.so.category']}" />

			<p:column headerText="Main-Category" />
			<p:column headerText="Sub-Category" />
			<p:column headerText="Sub-Category Division" />
			<p:column headerText="Category Type" />
			<p:column headerText="#{lbl['lbl.so.mandatory']}">
				<p:selectBooleanCheckbox value="#{scQtCategory.mandatory}"
					disabled="#{!qTDetailBB.managedBean.editable}" />
			</p:column>

		</p:dataTable>
	</p:panel>
</ui:composition>
