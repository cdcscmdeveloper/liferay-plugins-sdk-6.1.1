<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.deduction.payment']}" toggleable="true">

		<p:dataTable id="deductPaymentTblId"
			widgetVar="deductPaymentTblWidget" var="scQtDeduction"
			value="#{qTDeductionPaymentBackingBean.managedBean.scQtDeductionList}"
			selection="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{scQtDeduction}" rowIndexVar="rowIndex"
			selectionMode="single">

			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				listener="#{qTDeductionPaymentBackingBean.retrieveDeductionCluses}"
				update="@([id$=clausePnl])" />

			<p:ajax event="rowUnselect" partialSubmit="true"
				process="@this,:form:clausePnl" update="@([id$=clausePnl])"
				listener="#{qTDeductionPaymentBackingBean.rowUnselectEvent}" />
			<p:ajax event="rowUnselect" partialSubmit="true"
				process="@this,:form:clausePnl" update=":form:clausePnl" />

			<ac:paginator for="deductPaymentTblId" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.deduction.type']}" />
				</f:facet>

				<p:selectOneMenu id="deductionType"
					value="#{scQtDeduction.deductionType.parameterId}" required="true">
					<f:selectItems
						value="#{qTDeductionPaymentBackingBean.getDeductionTypes()}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update=":form:clausePnl, deductionamountid"
						listener="#{qTDeductionPaymentBackingBean.deductionTypeChange(scQtDeduction)}" />
				</p:selectOneMenu>
				<p:message id="deductionTypeMsg" for="deductionType" display="icon" />
			</p:column>

			<p:column headerText="Deduction Amount">
				<h:panelGroup id="deductionamountid">
					<p:inputText size="30" maxlength="18"
						value="#{scQtDeduction.deductionAmount}"
						style="margin-right:5px;text-align:right;"
						rendered="#{scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeFixed}">
					</p:inputText>
				</h:panelGroup>
			</p:column>

		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
				process="@this, deductPaymentTblId" partialSubmit="true"
				action="#{qTDeductionPaymentBackingBean.addDeductionPaymentAction}"
				oncomplete="deductPaymentTblWidget.paginator.endLink.click();"
				update="deductPaymentTblId" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}"
				process="@this, deductPaymentTblId" partialSubmit="true"
				icon="ui-icon-delete"
				action="#{qTDeductionPaymentBackingBean.deleteDeductionPaymentAction}"
				update="deductPaymentTblId" />
		</div>

		<p:panel id="clausePnl" header="#{lbl['lbl.sc.deduction.clauses']}"
			toggleable="true">
			<p:dataTable id="deductClauseTblId" widgetVar="deductClauseTblWidget"
				var="scQtDeductionClause"
				value="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
				selection="#{qTDeductionPaymentBackingBean.managedBean.selectedDeductionClauses}"
				rowKey="#{scQtDeductionClause}" rowIndexVar="rowIndex">

				<ac:paginator for="deductClauseTblId" />


				<p:column selectionMode="multiple" style="width:2%" />


				<p:column style="white-space:normal">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.deduction.clause']}" />
					</f:facet>
					<ui:fragment
						rendered="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers}">

						<p:inputTextarea value="#{scQtDeductionClause.clauseDesc}"
							cols="170" rows="2" maxlength="500" style=" margin-bottom:5px;" />
					</ui:fragment>
					<ui:fragment
						rendered="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode ne ParameterConst.deductionTypeOthers}">

						<h:outputText value="#{scQtDeductionClause.pmClause.clauseDesc}" />


					</ui:fragment>

				</p:column>

			</p:dataTable>
			<div class="ppRightBtn">
				<h:panelGroup
					rendered="#{!empty qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction and qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers}">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						process="@this, deductClauseTblId" partialSubmit="true"
						action="#{qTDeductionPaymentBackingBean.addDeductionClauseAction}"
						oncomplete="deductClauseTblWidget.paginator.endLink.click();"
						update="deductClauseTblId" icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this, deductClauseTblId" partialSubmit="true"
						icon="ui-icon-delete"
						action="#{qTDeductionPaymentBackingBean.deleteRowsAction}"
						update="deductClauseTblId" />
				</h:panelGroup>
			</div>
		</p:panel>
	</p:panel>
</ui:composition>
