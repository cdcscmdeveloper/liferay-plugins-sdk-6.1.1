<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Deduction Payment" toggleable="true">

		<p:dataTable id="deductPaymentId" var="deductpayment"
			value="#{qTDeductionPaymentBackingBean.managedBean.scQtDeductionList}"
			selection="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{deductpayment}" rowIndexVar="rowIndex">

			<ac:paginator for="deductPaymentId" />

			<p:column headerText="Deduction Type">
				<p:selectOneMenu value="#{deductpayment.deductionType.parameterId}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems
						value="#{qTDeductionPaymentBackingBean.retrieveDeductionType(ParameterTypeConst.deductionType)}"
						var="app" itemLabel="#{app.codeName}"
						itemValue="#{app.pmParameter.parameterId}" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@form"
						listener="#{qTDeductionPaymentBackingBean.deductionPaymentEvent(deductpayment)}" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="Deduction Amount"
				rendered="#{qTDeductionPaymentBackingBean.managedBean.qtDeduction.deductionType.parameterId eq '108'}">
				<p:inputText size="30" maxlength="18"
					value="#{deductpayment.deductionAmount}"
					style="margin-right:5px;text-align:right;" />
			</p:column>

		</p:dataTable>
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.so.addbtn']}"
						process="@this, deductPaymentId" partialSubmit="true"
						action="#{qTDeductionPaymentBackingBean.addDedcutionPayment}"
						update="deductPaymentId" icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.so.delete']}"
						icon="ui-icon-delete"
						action="#{qTDeductionPaymentBackingBean.deleteDedcutionPayment}"
						update="deductPaymentId" />
				</div>
			</f:facet>
		</p:panelGrid>
	</p:panel>
	<p:panel header="Clauses" toggleable="true">
		<h:panelGroup id="clausePnlId">

			<p:dataTable id="deductionclauseid" var="deductionclause"
				value="#{qTDeductionPaymentBackingBean.managedBean.scQtDeductionClauses}"
				selection="#{qTDeductionPaymentBackingBean.managedBean.selectedDeductionClauses}"
				rowKey="#{deductionclause}" rowIndexVar="rowIndex">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="Clause">
					<p:inputTextarea value="#{deductionclause.clauseDesc}" cols="120"
						rows="2" style=" margin-bottom:5px;" />
				</p:column>

			</p:dataTable>
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td"
				rendered="#{qTDeductionPaymentBackingBean.managedBean.qtDeduction.deductionType.parameterId eq '110'}">
				<f:facet name="footer">
					<div align="right">
						<p:commandButton value="#{lbl['lbl.so.addbtn']}" process="@this"
							partialSubmit="true" icon="ui-icon-add"
							action="#{qTDeductionPaymentBackingBean.addDeductionClause}"
							update="clausePnlId" />
						<p:commandButton value="#{lbl['lbl.so.delete']}"
							icon="ui-icon-delete" />
					</div>
				</f:facet>
			</p:panelGrid>

		</h:panelGroup>

	</p:panel>
</ui:composition>
