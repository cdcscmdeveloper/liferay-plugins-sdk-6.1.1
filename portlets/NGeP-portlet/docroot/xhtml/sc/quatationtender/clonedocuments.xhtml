<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="documentcloneid" header="Clone Document"
		widgetVar="screen2" width="950" height="600">
		<p:panel header="Search Document" id="clonedocid" toggleable="true">
			<table style="width: 100%">
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.title']}" /></td>
					<td colspan="3"><p:inputTextarea cols="100" rows="2"
							value="#{qTDocumentsBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
							style=" margin-bottom:5px;" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.qtntender']}" /></td>
					<td colspan="3"><p:inputText
							value="#{qTDocumentsBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
							size="32" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.procurementmode']}" /></td>
					<td><p:selectOneMenu
							value="#{qTDocumentsBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
							style="width: 192px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTDocumentsBackingBean.getDropdownCodeValues(ParameterTypeConst.scProcurementMode)}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.datecreated']}" /></td>
					<td><p:calendar
							value="#{qTDocumentsBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
							size="32" showOn="button" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.datecreated.to']}" /></td>
					<td><p:calendar
							value="#{qTDocumentsBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
							size="32" showOn="button" /></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.comstatus']}" /></td>
					<td><p:selectOneMenu style="width: 192px;margin-bottom: 5px;"
							value="#{qTDocumentsBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Non-Active" itemValue="2" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.so.reset']}" style="float:right;"
					action="#{qTDocumentsBackingBean.resetClone}" update="clonedocid"
					icon="ui-icon-reset" resetValues="true" partialSubmit="true"
					process="@this" />
				<p:commandButton value="#{lbl['lbl.so.searchbtn']}" icon="ui-icon-search"
					style="float:right;" update="@(.cloneResults)" partialSubmit="true"
					process="@parent"
					action="#{qTDocumentsBackingBean.documentCloneSearchAction}" />
			</div>
			<br />
			<br />
		</p:panel>
		<p:spacer height="3" />

		<p:panel header="Quotation/Tender List" toggleable="true">
			<p:dataTable id="clonesearchCommitteId"
				value="#{qTDocumentsBackingBean.managedBean.documentCloneTenderList}"
				selection="#{qTDocumentsBackingBean.managedBean.selectedDocumentCloneTender}"
				rowKey="#{documentclone}" selectionMode="single" var="documentclone"
				styleClass="cloneResults">

				<ac:paginator for="clonesearchCommitteId" />

				<p:ajax event="rowSelect" update=":form:qtsubId:documentlistid"
					listener="#{qTDocumentsBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">
					<h:outputText value="#{documentclone.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.result.title']}">
					<h:outputText value="#{documentclone.qtTitle}" />
				</p:column>

				<p:column
					headerText="#{lbl['lbl.sc.committe.result.procurementmode']}">
					<h:outputText
						value="#{qTDocumentsBackingBean.getParameterDesc(ParameterTypeConst.scProcurementMode, documentclone.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.result.datecreated']}">
					<h:outputText value="#{documentclone.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.committe.result.status']}">
					<h:outputText
						value="#{documentclone.qtStatus.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:spacer height="3" />
		<p:panel id="cloneDocumentList" header="Document List"
			toggleable="true">
			<p:dataTable id="documentlistid"
				value="#{qTDocumentsBackingBean.managedBean.qtCheckLists}"
				var="doclist" rowKey="#{doclist.qtChecklistId}"
				selection="#{qTDocumentsBackingBean.managedBean.selectedQtCheckLists}"
				styleClass="cloneResults,cloneDocumentList">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="Document">
					<h:outputText value="#{doclist.title}" />
				</p:column>
			</p:dataTable>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					style="float:right;" icon="ui-icon-cancel"
					onclick="screen2.hide();" />
				<p:commandButton value="#{lbl['lbl.so.okbtn']}" style="float:right;"
					action="#{qTDocumentsBackingBean.addDocumentCloneAction}"
					oncomplete="screen2.hide();" update="doctbl" icon="ui-icon-check" />

			</div>
		</p:panel>


	</p:dialog>
</ui:composition>
