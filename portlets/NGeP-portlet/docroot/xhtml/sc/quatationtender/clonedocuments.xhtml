<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="documentcloneid" header="Clone Document"
		widgetVar="screen2" width="950" height="600" position="top"
		styleClass="clonedocument">
		<p:panel header="#{lbl['lbl.so.searchbtn']}" toggleable="true"
			id="clonedocid">
			<table>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.title']}" /></td>
					<td colspan="3"><p:inputTextarea cols="100" rows="2"
							maxlength="100" style=" margin-bottom:5px; width : 100%"
							value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.qtTitle}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.qtntender']}" /></td>
					<td><p:inputText size="32" maxlength="21"
							value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.qtNo}" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.procurementmode']}" /></td>
					<td><p:selectOneMenu style="width: 192px;margin-bottom: 5px;"
							value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.procurementMode}">
							<f:selectItems
								value="#{qTDocumentsBackingBean.getProcurementModeDropdownValues()}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.creatdtfrom']}" /></td>
					<td><p:calendar id="crdateFrm" showOn="button"
							value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.fromCreatedDate}"
							size="30" readonlyInput="true"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
							<p:ajax event="dateSelect" update="createdtTo" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.so.creatdtto']}" /></td>
					<td><p:calendar id="createdtTo" showOn="button"
							value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.toCreatedDate}"
							mindate="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.fromCreatedDate}"
							size="30" readonlyInput="true" 
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
							<f:attribute name="startDate"
								value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.fromCreatedDate}" />
							<f:validator validatorId="dateRangeValidator" />
						</p:calendar></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.comstatus']}" /></td>
					<td><p:selectOneMenu style="width: 192px;margin-bottom: 5px;"
							value="#{qTDocumentsBackingBean.managedBean.cloneDocumentSearchBean.qtStatus}">
							<f:selectItems
								value="#{qTDocumentsBackingBean.getStatusDropdownValues('SC', 'QT')}" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					icon="ui-icon-search"
					action="#{qTDocumentsBackingBean.cloneSearchDocumentAction}"
					update="clonesearchdocid" process="@parent, clonedocid" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
					action="#{qTDocumentsBackingBean.resetClone}" update="clonedocid"
					icon="ui-icon-reset" resetValues="true" partialSubmit="true"
					process="@this" />
			</div>
		</p:panel>
		<p:panel header="#{lbl['lbl.so.qtlist']}" toggleable="true">
			<p:dataTable id="clonesearchdocid"
				value="#{qTDocumentsBackingBean.managedBean.cloneDocumentDataModel}"
				selection="#{qTDocumentsBackingBean.managedBean.selectedDocumentCloneTender}"
				rowKey="#{scQt}" selectionMode="single" var="scQt" lazy="true"
				styleClass="cloneResults">

				<ac:paginator for="clonesearchdocid" />

				<p:ajax event="rowSelect" update=":form:documentlistid"
					listener="#{qTDocumentsBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">
					<h:outputText value="#{scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.procmode']}">
					<h:outputText
						value="#{qTDocumentsBackingBean.getParameterDesc(scQt.procurementMode)}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.crtdt']}">
					<h:outputText value="#{scQt.createdDate}">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.so.bo.status']}">
					<h:outputText
						value="#{qTDocumentsBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" />
				</p:column>
			</p:dataTable>
		</p:panel>
		<p:spacer height="3" />
		<p:panel id="cloneDocumentList" header="Document List"
			toggleable="true">
			<p:dataTable id="documentlistid"
				value="#{qTDocumentsBackingBean.managedBean.cloneScQtDocReports}"
				var="doclist" rowKey="#{doclist}"
				selection="#{qTDocumentsBackingBean.managedBean.selectedCloneScQtDocReports}"
				styleClass="cloneResults,cloneDocumentList">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="Document">
					<h:outputText value="#{doclist.title}" />
				</p:column>
			</p:dataTable>
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.so.okbtn']}"
					action="#{qTDocumentsBackingBean.addDocumentCloneAction}"
					onclick="screen2.hide();"
					oncomplete="documentWidget.paginator.endLink.click();"
					update="doctbl" icon="ui-icon-check" />
					
				<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
					icon="ui-icon-cancel" onclick="screen2.hide();" />
			</div>
		</p:panel>


	</p:dialog>
</ui:composition>
