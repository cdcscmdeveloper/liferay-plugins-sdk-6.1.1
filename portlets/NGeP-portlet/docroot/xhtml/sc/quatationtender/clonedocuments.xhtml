<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog id="cloneID" header="" widgetVar="screen2" modal="true">
		<p:panel header="Search Document">
			<table>
				<tr>
					<td><p:outputLabel value="Title" /></td>
					<td colspan="3"><p:inputText
							value="#{qTDocumentsBackingBean.managedBean.title}" size="92" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.qtntender']}" /></td>
					<td><p:inputText
							value="#{qTDocumentsBackingBean.managedBean.qtNo}" size="28" /></td>
					<td><p:outputLabel value="Procurement Mode" /></td>
					<td><p:selectOneMenu
							value="#{qTDocumentsBackingBean.managedBean.procurementMode}"
							style="width: 192px;margin-bottom: 5px;">
							<f:selectItems
								value="#{qTDocumentsBackingBean.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><p:outputLabel value="Created Date (From)" /></td>
					<td><p:calendar
							value="#{qTDocumentsBackingBean.managedBean.createdDtFrom}"
							size="28" showOn="button" /></td>
					<td><p:outputLabel value="Created Date (To)" /></td>
					<td><p:calendar
							value="#{qTDocumentsBackingBean.managedBean.createdDtTo}"
							size="28" showOn="button" /></td>
				</tr>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.clone.comstatus']}" /></td>
					<td><p:selectOneMenu style="width:192px"
							value="#{qTDocumentsBackingBean.managedBean.status}">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Non-Active" itemValue="2" />
						</p:selectOneMenu></td>
					<td />
					<td />
				</tr>
			</table>
			<div align="right">
				<p:commandButton value="Search" style="float:right;"
					icon="ui-icon-search"
					action="#{qTDocumentsBackingBean.cloneSearchCommitteAction}"
					update="@(.cloneResults)" partialSubmit="true" process="@parent" />
			</div>
			<br />
			<br />
		</p:panel>

		<p:panel header="Quotation/Tender List" toggleable="true">
			<p:dataTable id="clonesearchCommitteId"
				value="#{qTDocumentsBackingBean.managedBean.cloneSearchCommittes}"
				selection="#{qTDocumentsBackingBean.managedBean.selectedCloneCommittee}"
				rowKey="#{committe}" selectionMode="single" var="committe"
				styleClass="cloneResults">

				<ac:paginator for="clonesearchCommitteId" />

				<p:ajax event="rowSelect" update=":form:qtsubId:documentlistid"
					listener="#{qTDocumentsBackingBean.onRowCloneAction}" />

				<p:column headerText="#{lbl['lbl.sc.committe.result.qtntender']}">
					<h:outputText value="#{committe.scQt.qtNo}" />
				</p:column>

				<p:column headerText="Title">
					<h:outputText value="#{committe.scQt.qtTitle}" />
				</p:column>

				<p:column headerText="Procurement Mode">
					<h:outputText value="#{committe.scQt.procurementMode}" />
				</p:column>

				<p:column headerText="Created Date">
					<h:outputText value="#{committe.scCommittee.createdDate}" />
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:panel id="cloneCommitteDocument" header="Document List"
			toggleable="true">
			<p:dataTable id="documentlistid"
				value="#{qTBusinessOwnerBackingBean.managedBean.cloneCommitteMemebers}"
				var="member" rowKey="#{member.committeeMemberId}"
				selection="#{qTBusinessOwnerBackingBean.managedBean.selectedCommitteMemebers}"
				styleClass="cloneResults,cloneCommitteMembers">
			</p:dataTable>
		</p:panel>


	</p:dialog>
</ui:composition>
