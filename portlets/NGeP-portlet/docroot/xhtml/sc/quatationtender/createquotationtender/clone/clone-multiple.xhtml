<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog widgetVar="kklik" >
				  <h:panelGroup id="displayk">
						<p:panel id="clonesearchpnlid2" header="#{lbl['lbl.sc.clone.qt']}" toggleable="true">
							<table style="width: 100%;">
								<tr>
									<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.quotation.tender.noClone']}" /></td>
									<td><p:inputText
								onkeypress="if (event.keyCode == 13) { quotationTndrCommitteeAppointmentMainCloneSearch.jq.click(); return false; }"
								value="#{qtMultipleCloneBackingBean.totalClone}"
								maxlength="21" size="35" />
								<h:inputHidden value="#{qtMultipleCloneBackingBean.selectedScqt.qtId}" />
								</td>
								</tr>
					
							</table>
				        </p:panel>
				        <p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
				<br />

				<p:tree value="#{qtMultipleCloneBackingBean.root}" var="node"
                        selection="#{qtMultipleCloneBackingBean.selectedNodes}"
					selectionMode="checkbox">
					<p:treeNode>
						<h:outputText value="#{node.label}"/>
					</p:treeNode>
					
				</p:tree>


				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						styleClass="BtnSpacing" id="cloneCommitteeTreeBtnOnId2" update="@all"
						action="#{qtMultipleCloneBackingBean.addToClone()}">
					 <f:param name="skipvalidation" value="1" />
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						styleClass="BtnSpacing" onclick="kklik.hide();"
					 ><f:param name="skipvalidation" value="1" />
					 </p:commandButton>
				</div>
			</p:panel>
					</h:panelGroup>
				</p:dialog>
</ui:composition>
