<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog widgetVar="kklik" >
				  <h:panelGroup id="displayk">
				  <p:blockUI block="clonesearchpnlid2" widgetVar="blockWidgetClone">
					<p:graphicImage value="/css/images/ajax-loader.gif" />
				</p:blockUI>
				  
				  <p:messages id="qtCloneMsg" showDetail="true" autoUpdate="true"
			          closable="true" showSummary="false" severity="error, info" />
						<p:panel id="clonesearchpnlid2" header="#{lbl['lbl.sc.clone.qt']}" toggleable="true">
							<table style="width: 100%;">
								<tr>
									<td valign="top"><p:outputLabel value="#{lbl['lbl.sc.quotation.tender.noClone']}" />
									   <p:outputLabel value="*" styleClass="mandatory" />
									</td>
									<td><p:inputText id="clonemultipleTextIdvalue"
									required="true" label="#{lbl['lbl.sc.quotation.tender.noClone']}"  
								onkeypress="if (event.keyCode == 13) { quotationTndrCommitteeAppointmentMainCloneSearch.jq.click(); return false; }"
								value="#{qtMultipleCloneBackingBean.totalClone}"
								maxlength="2" size="35" >
								<p:ajax event="change" process="@this" partialSubmit="true" listener="#{qtMultipleCloneBackingBean.validateQuotationTender}" update="clonemultipleTextIdvalue"></p:ajax>
								</p:inputText>
								<h:inputHidden value="#{qtMultipleCloneBackingBean.selectedScqt.qtId}" />
								</td>
								</tr>
					
							</table>
				        </p:panel>
				        <p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true">
				<br />

				<p:tree value="#{qtMultipleCloneBackingBean.root}" var="node"
                        selection="#{qtMultipleCloneBackingBean.selectedNodes}"
					selectionMode="checkbox">
					<p:treeNode>
						<h:outputText value="#{node.label}"/>
					</p:treeNode>
					
				</p:tree>
				

				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.ok']}" onstart="blockWidgetClone.show()" oncomplete="blockWidgetClone.hide()"
						styleClass="BtnSpacing" id="cloneCommitteeTreeBtnOnId2" update="@all, qtList, qtsearchid"
						action="#{qtMultipleCloneBackingBean.addToClone()}">
					 <f:param name="skipvalidation" value="1" />
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.btn.close']}"
						styleClass="BtnSpacing" onclick="kklik.hide();"
					 ><f:param name="skipvalidation" value="1" />
					 </p:commandButton>
				</div>
			</p:panel>
					</h:panelGroup>
					
				</p:dialog>
</ui:composition>
