<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="Technical Specification" style="width: 100%"
		toggleable="true">
		<p:dataTable id="templateTechSpecification" var="technicalSpec"
			style="width:100%" rowIndexVar="index"
			value="#{qTDetailBB.managedBean.technicalSpecList}"
			rowKey="#{technicalSpec}">

			<ac:paginator for="templateTechSpecification" />

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}"
				style="width:50%">
				<h:outputText value="#{technicalSpec.title}" size="50" />
			</p:column>

			<p:column headerText="Status" style="width:20%">
				<h:outputText
					value="#{qTDetailBB.getStatusDescById(technicalSpec.pmStatus.statusId)}"
					size="50" />
			</p:column>
			<p:column headerText="Created By" style="width:20%">
				<h:outputText
					value="#{qTDetailBB.retriveUserName(technicalSpec.createdBy)}"
					size="50" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}"
				style="width:10%">
				<p:commandLink ajax="false"
					action="#{qTDetailBB.technicalSpecEditAction(technicalSpec)}">
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
