<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.so.general.info']}" toggleable="true">
		<table>
			<tr>
				<td style="width: 155px;" valign="top"><p:outputLabel
						value="#{lbl['lbl.so.title']}" /></td>
				<td colspan="3"><p:inputTextarea
						value="#{qTDetailBB.managedBean.qt.qtTitle}" cols="110" rows="2"
						disabled="#{!qTDetailBB.managedBean.editable}"
						style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.fileno']}" /></td>
				<td><p:inputText id="fileno"
						value="#{qTDetailBB.managedBean.qt.fileNo}"
						disabled="#{!qTDetailBB.managedBean.editable}" size="30" /></td>
				<td style="width: 200px;"><p:outputLabel
						value="#{lbl['lbl.so.crtdt']}" /></td>
				<td><p:inputText
						value="#{qTDetailBB.managedBean.qt.createdDate}" disabled="true"
						size="30">
						<f:convertDateTime
							pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.procmode']}" /></td>
				<td>
					<!-- <c:if test="#{qTDetailBB.managedBean.qt.brandNew}"> --> <p:selectOneMenu
						value="#{qTDetailBB.managedBean.qt.procurementMode}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItems
							value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update="approvalWorkFlow" listener="#{qTDetailBB.onChangeAction}" />
					</p:selectOneMenu> <!-- </c:if> <c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
						<p:inputText
							value="#{qTDetailBB.getParameterDesc(ParameterTypeConst.scProcurementMode, qTDetailBB.managedBean.qt.procurementMode)}"
							disabled="true" size="30" />
					</c:if> -->
				</td>
				<td><p:outputLabel value="#{lbl['lbl.so.estimated']}" /></td>
				<td><p:inputText id="estprice"
						value="#{qTDetailBB.managedBean.qt.estimatedAmount}" size="30"
						disabled="true" readonly="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:spacer height="5" />
	<p:panel header="#{lbl['lbl.so.goso.list']}" toggleable="true"
		rendered="#{!qTDetailBB.managedBean.qt.planned}">
		<p:dataTable id="gosodoList"
			value="#{qTDetailBB.managedBean.qt.scQtGosodoBudgets}" var="gosodo"
			selection="#{qTDetailBB.managedBean.selectedGosodoBudgets}"
			rowKey="#{gosodo}" rowIndexVar="rowIndex" style="width : 100%">

			<p:column selectionMode="multiple" style="width:2%" />

			<ac:paginator for="gosodoList" />

			<p:column headerText="#{lbl['lbl.so.gocode']}">
				<h:outputText value="#{gosodo.pmGo.goCode}"
					rendered="#{rowIndex lt qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}" />
				<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
					<p:selectOneMenu value="#{gosodo.pmGo.goId}"
						rendered="#{rowIndex eq qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItems value="#{qTDetailBB.goList}" var="go"
							itemLabel="#{go.goCode}" itemValue="#{go.goId}" />
						<p:ajax event="change"
							listener="#{qTDetailBB.handleGoChanged(gosodo)}"
							partialSubmit="true" process="@this" update="solist" />
					</p:selectOneMenu>
				</c:if>
				<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
					<p:inputText value="#{gosodo.pmGo.goId}" disabled="true" />
				</c:if>
			</p:column>
			<p:column headerText="#{lbl['lbl.so.socode']}">
				<h:outputText value="#{gosodo.pmSo.soCode}"
					rendered="#{rowIndex lt qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}" />
				<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
					<p:selectOneMenu id="solist" value="#{gosodo.pmSo.soId}"
						rendered="#{rowIndex eq qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItems value="#{qTDetailBB.managedBean.soList}" var="so"
							itemLabel="#{so.soCode}" itemValue="#{so.soId}" />
						<p:ajax event="change"
							listener="#{qTDetailBB.handleSoChanged(gosodo)}"
							partialSubmit="true" process="@this" />
					</p:selectOneMenu>
				</c:if>
				<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
					<p:inputText value="#{gosodo.pmSo.soCode}" disabled="true" />
				</c:if>
			</p:column>
			<p:column headerText="#{lbl['lbl.so.goso.amount']}">
				<h:outputText value="#{gosodo.budgetAmt}"
					rendered="#{rowIndex lt qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}" />
				<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
					<p:inputText value="#{gosodo.budgetAmt}" />
				</c:if>
				<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
					<p:inputText value="#{gosodo.budgetAmt}" disabled="true" />
				</c:if>

			</p:column>
		</p:dataTable>
		<p:spacer height="10" />
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.so.addbtn']}"
				actionListener="#{qTDetailBB.addGoSoDoAction}" update="gosodoList"
				icon="ui-icon-add" rendered="#{qTDetailBB.managedBean.editable}">
			</p:commandButton>
			<p:commandButton value="#{lbl['lbl.so.delete']}"
				icon="ui-icon-delete" rendered="#{qTDetailBB.managedBean.editable}" />
		</div>
	</p:panel>
</ui:composition>
