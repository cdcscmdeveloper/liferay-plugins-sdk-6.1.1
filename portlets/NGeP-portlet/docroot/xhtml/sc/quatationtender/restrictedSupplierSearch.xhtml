<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="searchrestrictedsupp" header="Search" toggleable="true">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20AlignTop">

			<p:dataTable
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategoryList}"
				var="scQtCategory" id="restrcatcode">

				<ac:paginator for="restrcatcode" />

				<p:column headerText="#{lbl['lbl.so.category']}">
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryL3Code}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.main.category']}">
					<h:outputText
						value="#{scQtCategory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}">
					<h:outputText
						value="#{scQtCategory.pmCategoryL3.pmCategoryL2.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}">
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column headerText="Category Type">
					<h:outputText value="#{scQtCategory.pmCategoryL3.catType}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mandatory']}"
					style="width: 150px;">
					<h:outputText value="#{scQtCategory.mandatory ? 'Yes' : 'No'}"/>
				</p:column>
			</p:dataTable>
		</h:panelGrid>

		<br />
		<br />

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20,columnWidth50">

			<h:column>
				<h:outputLabel value="Supplier Name" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierName}" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.mofno']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.mofAccountNo}" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.paidup']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierCriteria.minPaidUpCapital}" />
			</h:column>
		</h:panelGrid>
	</p:panel>
	<p:commandButton value="#{lbl['lbl.so.reset']}" style="float:right;"
		action="#{qTSupplierQulCriteriaBackingBean.reset}"
		update="searchrestrictedsupp" icon="ui-icon-reset" resetValues="true"
		partialSubmit="true" process="@this" />

	<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
		styleClass="apply_button" style="float:right;" id="restrictSupplier"
		icon="ui-icon-search"
		action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierAction}"
		update="restrictedsupplierPnl" />

	<br />
	<br />

	<p:panel id="restrictedsupplierPnl" header="Supplier List"
		toggleable="true">
		<p:dataTable
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchSupplierList}"
			var="smSupplier" id="ressupplier"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedSupplierList}"
			rowKey="#{smSupplier.supplierId}">

			<ac:paginator for="ressupplier" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.so.suppliername']}">
				<h:outputText value="#{smSupplier.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText value="#{smSupplier.smMofAccounts[0].mofNo}"
					rendered="false" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText value="#{smSupplier.smMofAccounts[0].expDate}"
					rendered="false" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText value="Active" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
