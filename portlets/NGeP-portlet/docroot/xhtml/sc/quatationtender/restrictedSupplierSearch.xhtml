<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="searchrestrictedsupp" header="#{lbl['lbl.btn.search']}"
		toggleable="true">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20AlignTop">
			<p:dataTable
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList}"
				var="scQtCategory" id="restrcatcode">

				<ac:paginator for="restrcatcode" />

				<p:column headerText="#{lbl['lbl.so.category']}" style="width:10%">
					<h:outputText value="#{scQtCategory.pmCategoryL1.categoryL1Code}" />&#160;&#160;
					<h:outputText value="#{scQtCategory.pmCategoryL2.categoryL2Code}" />&#160;&#160;
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryL3Code}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
					style="width:20%; white-space: normal;">
					<h:outputText
						value="#{scQtCategory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
					style="width:40%; white-space: normal;">
					<h:outputText
						value="#{scQtCategory.pmCategoryL3.pmCategoryL2.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
					style="width:45%; white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
					style="width:25%">
					<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(scQtCategory.pmCategoryL3.categoryTypeCode)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mandatory']}"
					style="width: 150px;">
					<h:outputText
						value="#{lbl[scQtCategory.mandatory ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<p:spacer height="2" />

		<table style="width: 100%;">
			<tr>
				<td style="width: 160px;"><p:outputLabel value="#{lbl['lbl.so.suppliername']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.supplierName}"
						size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.mofno']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.mofAccountNo}"
						size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.so.paidup']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.minPaidUpCapital}"
						size="30" /></td>
			</tr>
		</table>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.search']}"
			styleClass="apply_button" id="restrictSupplier" icon="ui-icon-search"
			action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierAction}"
			update="restrictedsupplierPnl" process="@this, searchrestrictedsupp" />
		<p:commandButton value="#{lbl['lbl.btn.reset']}"
			action="#{qTSupplierQulCriteriaBackingBean.reset}"
			update="searchrestrictedsupp" icon="ui-icon-reset" resetValues="true"
			partialSubmit="true" process="@this" />
	</div>

	<p:spacer height="3" />
	<p:panel id="restrictedsupplierPnl"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		
		<p:dataTable var="smSupplier" id="ressupplier"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchSupplierDataModel}"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedSupplierList}"
			rowKey="#{smSupplier.supplierId}" lazy="true" style="width : 100%;" rows="10">

			<ac:paginator for="ressupplier" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.so.suppliername']}">
				<h:outputText value="#{smSupplier.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mofno']}" style="width: 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(null, smSupplier).mofNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mofexp']}" style="width: 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(null, smSupplier).expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.so.status']}" style="width: 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(null, smSupplier).recordStatusFlg}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
