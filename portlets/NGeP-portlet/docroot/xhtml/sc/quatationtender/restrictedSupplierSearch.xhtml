<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="searchrestrictedsupp" header="#{lbl['lbl.btn.search']}"
		toggleable="true">

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20AlignTop">

			<p:dataTable
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.suppCriteriarestrictedList}"
				var="scQtCategory" id="restrcatcode">

				<ac:paginator for="restrcatcode" />

				<p:column headerText="#{lbl['lbl.so.category']}" style="width:10%">
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryL3Code}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.main.category']}"
					style="width:15%; white-space: normal;">
					<h:outputText
						value="#{scQtCategory.pmCategoryL3.pmCategoryL2.pmCategoryL1.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.sub.category']}"
					style="width:15%; white-space: normal;">
					<h:outputText
						value="#{scQtCategory.pmCategoryL3.pmCategoryL2.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.sub.category.division']}"
					style="width:20%; white-space: normal;">
					<h:outputText value="#{scQtCategory.pmCategoryL3.categoryName}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.spec.category.type']}"
					style="width:20%">
					<h:outputText
						value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(scQtCategory.pmCategoryL3.categoryTypeCode)}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.mandatory']}"
					style="width: 150px;">
					<h:outputText
						value="#{lbl[scQtCategory.mandatory ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
				</p:column>
			</p:dataTable>
		</h:panelGrid>

		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20,columnWidth50">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.suppliername']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierName}" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.mofno']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.mofAccountNo}" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.paidup']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{qTSupplierQulCriteriaBackingBean.managedBean.minPaidUpCapital}" />
			</h:column>
		</h:panelGrid>
	</p:panel>
	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.btn.search']}"
			styleClass="apply_button" id="restrictSupplier" icon="ui-icon-search"
			action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierAction}"
			update="restrictedsupplierPnl" />
		<p:commandButton value="#{lbl['lbl.btn.reset']}"
			action="#{qTSupplierQulCriteriaBackingBean.reset}"
			update="searchrestrictedsupp" icon="ui-icon-reset" resetValues="true"
			partialSubmit="true" process="@this" />
	</div>
	<p:spacer height="5" />
	<p:panel id="restrictedsupplierPnl"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<p:dataTable var="smSupplier" id="ressupplier"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchSupplierList}"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedSupplierList}"
			rowKey="#{smSupplier.supplierId}" rows="10">

			<ac:paginator for="ressupplier" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.so.suppliername']}">
				<h:outputText value="#{smSupplier.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText value="#{smSupplier.smMofAccounts[0].mofNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText value="#{smSupplier.smMofAccounts[0].expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getStatusDescById(smSupplier.pmStatus.statusId)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
