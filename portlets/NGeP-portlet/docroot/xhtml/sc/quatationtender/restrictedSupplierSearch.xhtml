<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="searchrestrictedsupp" header="#{lbl['lbl.btn.search']}"
		toggleable="true">

		<table style="width: 100%;">
			<tr>
				<td style="width: 180px;"><p:outputLabel
						value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.supplierName}"
						size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mofno']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.mofAccountNo}"
						size="30" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.paidup']}" /></td>
				<td colspan="3"><p:inputText
						value="#{qTSupplierQulCriteriaBackingBean.managedBean.supplierSearchBean.minPaidUpCapital}"
						size="30" /></td>
			</tr>
		</table>
		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.search']}"
				styleClass="apply_button" id="restrictSupplier"
				action="#{qTSupplierQulCriteriaBackingBean.searchRestrictedSupplierAction}"
				update="restrictedsupplierPnl" process="@this, searchrestrictedsupp" />
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				action="#{qTSupplierQulCriteriaBackingBean.reset}"
				update="searchrestrictedsupp" resetValues="true"
				partialSubmit="true" process="@this" />
		</div>
	</p:panel>
	<p:panel id="restrictedsupplierPnl"
		header="#{lbl['lbl.sc.supplier.list']}" toggleable="true">
		<p:dataTable var="smSupplier" id="ressupplier"
			value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchSupplierDataModel}"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedSupplierList}"
			rowKey="#{smSupplier.supplierId}" lazy="true" style="width : 100%;"
			rows="10">

			<ac:paginator for="ressupplier" />

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
				<h:outputText value="#{smSupplier.companyName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofno']}" style="width: 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(null, smSupplier).mofNo}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.mofexp.date']}"
				style="width: 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(null, smSupplier).expDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width: 10%;">
				<h:outputText
					value="#{qTSupplierQulCriteriaBackingBean.getParameterDesc(ParameterTypeConst.recordStatus, qTSupplierQulCriteriaBackingBean.retrieveSmMofAccount(null, smSupplier).recordStatusFlg)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
</ui:composition>
