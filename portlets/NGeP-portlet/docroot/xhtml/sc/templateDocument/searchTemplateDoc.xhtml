<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.tpl.doc.search']}" toggleable="true" 	style="width:1000px;">
		<p:commandLink value="#{lbl['lbl.sc.tpl.doc.search.temp']}"></p:commandLink>

		<table style="width: 80%">
			<tr>
				<td class="TableFieldLeft" style="width: 10%"><h:outputLabel
						value="Template Title"></h:outputLabel></td>
				<td class="TableFieldRight"><h:inputText size="70" style="margin-bottom:5px;" value="#{sourcingTemplateDBB.managedBean.docTitle}" />
				</td>
			</tr>

			<tr>
				<td class="TableFieldLeft" style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.doc.qtn.no']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:inputText value="#{sourcingTemplateDBB.managedBean.scQtDoc.scQt.qtNo}"/></td>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.procure.category']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu value="#{sourcingTemplateDBB.managedBean.procurementId}">
						<f:selectItems
							value="#{sourcingTemplateDBB.getDropdownValues(PmCodeCatConst.procurementCategory)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.status']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu value="#{sourcingTemplateDBB.managedBean.statusId}">
						<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItem itemLabel="Pending" itemValue="P" />
						<f:selectItem itemLabel="Complete" itemValue="C" />
					</p:selectOneMenu></td>

				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.record.status']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu value="#{sourcingTemplateDBB.managedBean.recordStatus}">
						<f:selectItem itemLabel="-Select One-" itemValue="#{null}" />
						<f:selectItem itemLabel="Active" itemValue="1" />
						<f:selectItem itemLabel="Inactive" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>
		</table>

		<div align="right" style="width:80%">
			<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.search']}"
				action="#{sourcingTemplateDBB.searchDocAction}" update="searchDoc"
				icon="ui-icon-search" />
		</div>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.tpl.doc.list']}" style="width:1000px;">
		<h:panelGrid style="width:1000px;">
			<p:dataTable id="searchDoc" var="documentScQtDoc"
				value="#{sourcingTemplateDBB.templateDocument}" 
				rowKey="#{documentScQtDoc.qtDocId}" rowIndexVar="index" lazy="true">
				<!--   <p:column selectionMode="multiple"  style="text-align:center;"/> -->


             <ac:paginator for="searchDoc"/>
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.title']}">
					<h:outputText value="#{documentScQtDoc.tplDocMaster.docTitle}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.procure.category']}">
					<h:outputText
						value="#{scQtDoc.scQt.procurementMode}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.qtn.no']}">
					<h:outputText value="#{documentScQtDoc.scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tpl.doc.status']}">
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tpl.doc.record.status']}">
					<h:outputText value="#{documentScQtDoc.recordStatus}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.action']}">
					
					<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.clone']}"
						 process="@this"	action="#{sourcingTemplateDBB.cloneTemplateAction(documentScQtDoc)}"
							icon="ui-icon-clone" />
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<p:spacer height="15"></p:spacer>
<div align="right" style="width: 950px;">
			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.create']}" action="#{sourcingTemplateDBB.sourcingTemplateAction}" icon="ui-icon-add"/>

		</div>
	</p:panel>

</ui:composition>
