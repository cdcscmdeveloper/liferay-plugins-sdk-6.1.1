<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
		</p:blockUI>
		<p:messages id="evaluationMeeting" showDetail="true"
			autoUpdate="#{evaluationMeetingBackingBean.managedBean.autoUpdate}"
			closable="true" severity="error,info" showSummary="false" />
		<div align="left">
			<p:commandButton value="#{lbl['lbl.btn.back']}"
				styleClass="BtnSpacing"
				action="#{evaluationMeetingBackingBean.navigateToUpdateMember('back')}" />
		</div>
		<ui:include src="evaluationMeetingHeader.xhtml"></ui:include>
		<ui:param name="taskName" value="#{evaluationMeetingBackingBean.managedBean.taskName}"/>
		<ui:param name="isCommitteeUpdatable" value="#{evaluationMeetingBackingBean.isCommitteeEditable(taskName)}"/>
		<p:panel id="committeeHistoryId" header="#{lbl['lbl.sc.header.committeelist']}" toggleable="true">
			<ac:committeeHistoryPanel
				historyPaginator="#{evaluationMeetingBackingBean.managedBean.historyPaginator}"
				selectedHistory="#{evaluationMeetingBackingBean.managedBean.selectedCommitteeHistory}"
				memberHistoryPaginator="#{evaluationMeetingBackingBean.managedBean.memberHistoryPaginator}"
				onSelectHistory="onSelectHistory" 
				committeeName="#{evaluationMeetingBackingBean.managedBean.currentCommitteeType}"
				backingBean="#{evaluationMeetingBackingBean}"/>
		</p:panel>
		<p:panel id="evaluationConfirmMeetingCommitteemembersListPanel"
			header="#{lbl['lbl.sc.header.update.committee']}" toggleable="true">
			<p:dataTable id="evaluationpreparecommittee" var="committeeMember"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				widgetVar="prepareCommittee" rows="10" rowIndexVar="index"
				value="#{evaluationMeetingBackingBean.managedBean.committeeMemberActivity}"
				rowKey="#{committeeMember}">
				<ac:paginator for="evaluationpreparecommittee" />
				<p:column style="width:3px;text-align:center;" rendered="#{isCommitteeUpdatable}">
					<f:facet name="header">
						<p:selectBooleanCheckbox disabled="true"
							value="#{evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll}">
							<p:ajax partialSubmit="true" process="@this" update="@form"
								listener="#{evaluationMeetingBackingBean.selectAll(evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll, evaluationMeetingBackingBean.managedBean.committeeMemberActivity)}" />
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox value="#{committeeMember.selected}"
						disabled="true"
						rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleSecretary}">
					</p:selectBooleanCheckbox>
					<p:selectBooleanCheckbox value="#{committeeMember.selected}"
						rendered="#{committeeMember.memberRole.parameterCode ne ParameterConst.committeeRoleSecretary}">
						<p:ajax partialSubmit="true" process="@this" update="@form" />
					</p:selectBooleanCheckbox>
				</p:column>
				<p:column style="width:29%;white-space: normal;"
					headerText="#{lbl['lbl.sc.name']}">
					<h:outputText value="#{committeeMember.memberName}"></h:outputText>
				</p:column>
				<p:column style="width:15%;white-space: normal;"
					headerText="#{lbl['lbl.sc.identification.no']}">
					<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
				</p:column>
				<p:column style="width:15%;white-space: normal;"
					headerText="#{lbl['lbl.sc.designation']}">
					<h:outputText value="#{committeeMember.designation}"></h:outputText>
				</p:column>
				<p:column style="width:15%;white-space: normal;"
					headerText="#{lbl['lbl.sc.email']}">
					<h:outputText value="#{committeeMember.email}"></h:outputText>
				</p:column>
				<p:column style="width:7%;white-space: normal;"
					headerText="#{lbl['lbl.sc.grade']}">
					<h:outputText value="#{committeeMember.grade}"></h:outputText>
				</p:column>
				<p:column style="width:6%;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.pnp']}" />
						<ac:iconTooltip id="pnpTT#{index}"
							value="#{lbl['lbl.sc.pnp.tooltip']}" />
					</f:facet>
					<h:outputText
						value="#{lbl[committeeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
				</p:column>
				<p:column style="width:10%;">
					<f:facet name="header">
						<h:outputText value="*" styleClass="mandatory"></h:outputText>
						<p:spacer width="5"></p:spacer>
						<h:outputText value="#{lbl['lbl.sc.role']}"></h:outputText>
					</f:facet>
					<ui:fragment
						rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleSecretary}">
						<h:outputText
							value="#{evaluationMeetingBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, ParameterConst.committeeRoleSecretary)}"
							rendered="#{committeeMember.memberRole.parameterCode eq ParameterConst.committeeRoleSecretary}" />
					</ui:fragment>
					<ui:fragment
						rendered="#{committeeMember.memberRole.parameterCode ne ParameterConst.committeeRoleSecretary}">
						<p:selectOneMenu id="meetingRoleId" required="true"
							label="#{lbl['lbl.sc.role']}"
							value="#{committeeMember.memberRoleId}"
							style="width: 110px;margin-bottom: 5px;"
							disabled="#{!isCommitteeUpdatable}">
							<f:selectItems
								value="#{evaluationMeetingBackingBean.getRoleTypeDropdownValues(committeeMember.PNP,evaluationMeetingBackingBean.managedBean.qt,committeeMember.pmUser)}" />
							<p:ajax event="change" process="@this" partialSubmit="true"
								listener="#{evaluationMeetingBackingBean.chnageMemberRole(index,evaluationMeetingBackingBean.managedBean.committeeMemberActivity)}"></p:ajax>
						</p:selectOneMenu>
						<p:message id="meetingRoleMsg" for="meetingRoleId" display="icon"></p:message>
					</ui:fragment>
				</p:column>
			</p:dataTable>
			<ui:fragment rendered="#{isCommitteeUpdatable}">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this"
						styleClass="BtnSpacing" partialSubmit="true"
						actionListener="#{evaluationMeetingBackingBean.addCommitteeDetails}"
						update="@([id$=newspecificationcommitteeid])"
						oncomplete="newspecificationcommittee.show();" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"
						disabled="#{evaluationMeetingBackingBean.deleteselectedList(evaluationMeetingBackingBean.managedBean.committeeMemberActivity)}"
						styleClass="BtnSpacing" partialSubmit="true"
						oncomplete="confirmMeetingCommitteemembersDeletePopUp.show();"
						update="@([id$=#{confirmmeetingCommitteemembersDeleteId}])">
						<f:setPropertyActionListener
							target="#{evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll}"
							value="#{false}" />
					</p:commandButton>
				</div>
			</ui:fragment>
			<ui:param name="confirmmeetingCommitteemembersDeleteId"
				value="confirmmeetingCommitteemembersDeleteId"></ui:param>
			<ac:confirmationPopup id="#{confirmmeetingCommitteemembersDeleteId}"
				widget="confirmMeetingCommitteemembersDeletePopUp" width="490"
				height="100"
				okAction="evaluationMeetingBackingBean.deleteCommitteemembersDtls"
				title="#{lbl['lbl.sc.committee.member.list']}"
				content="#{lbl['lbl.sc.dialog.confirm.committee.members.dtls']}"
				update="@([id$=evaluationConfirmMeetingCommitteemembersListPanel])" />
		</p:panel>
		<ac:scRemarkAndAttachment
			remarkList="#{evaluationMeetingBackingBean.managedBean.scQtApprovalRemarks}"
			instruction="#{approvalBackingBean.isReviceOrReject() ? lbl['lbl.sc.approval.remarks.instruction'] : ''}" 
			showAttachment="false" readonly="#{!isCommitteeUpdatable}"
			/>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.update']}" disabled="#{!isCommitteeUpdatable}" action="#{evaluationMeetingBackingBean.validateCommitteeChanges()}" />
			<p:commandButton value="#{lbl['lbl.btn.cancel']}" disabled="#{!isCommitteeUpdatable}" action="#{evaluationMeetingBackingBean.navigateToUpdateMember('back')}" />
		</div>
		<ui:include src="addexistingcommittee.xhtml" />
		<ac:confirmationPopup id="confirmChangeMemberListId"
			widget="confirmChangeMemberListPopup" width="490" height="100"
			title="#{lbl['lbl.sc.confirmation']}"
			okAction= "evaluationMeetingBackingBean.navigateToUpdateMember('confirm')"
			content="#{lbl['lbl.sc.popup.needcommitteeapprover']}" />
	</ui:define>
</ui:composition>
