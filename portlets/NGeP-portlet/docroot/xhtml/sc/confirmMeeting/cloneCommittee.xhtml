<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="cloneid">

		<p:dialog
			header="#{lbl['lbl.sc.clone']}  #{evaluationMeetingBackingBean.getParameterDesc(ParameterTypeConst.scCommitteeType, 
											evaluationMeetingBackingBean.managedBean.committeeType)}"
			widgetVar="screen2" modal="true" width="950" height="600"
			position="top">
			<p:messages id="cloneallCommitteeid" autoUpdate="true"
				showDetail="true" showSummary="false" closable="true"
				severity="error, info"></p:messages>
			<h:panelGroup id="clonesearchpnlid">
				<p:panel header="#{lbl['lbl.sc.search']}" toggleable="true">
					<table width="900px">
						<tr>
							<td valign="top"><p:outputLabel
									value="#{lbl['lbl.sc.title']}" /></td>
							<td colspan="3"><p:inputText
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtTitle}"
									style="width:680px;" maxlength="100" /></td>
						</tr>
						<tr>
							<td style="width: 165px;"><p:outputLabel
									value="#{lbl['lbl.sc.qtn.no']}" /></td>
							<td style="width: 285px;"><p:inputText
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtNo}"
									style="width:232px;" maxlength="21" /></td>
							<td style="width: 165px;"><p:outputLabel
									value="#{lbl['lbl.sc.procurement.mode']}" /></td>
							<td style="width: 285px;"><p:selectOneMenu
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.procurementMode}"
									style="width: 240px;margin-bottom: 5px;">
									<f:selectItems
										value="#{evaluationMeetingBackingBean.procurementModeDropdownValues}" />
								</p:selectOneMenu></td>
						</tr>
						<tr>
							<td><p:outputLabel
									value="#{lbl['lbl.sc.created.date.from']}" /></td>
							<td><p:calendar id="datecreatedfrm" showOn="button"
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									size="29" readonlyInput="true" style="width:210px;">
									<p:ajax event="dateSelect" update="datecreatedto" />
								</p:calendar></td>
							<td><p:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
							<td><p:calendar id="datecreatedto" showOn="button"
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toCreatedDate}"
									mindate="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									size="29" readonlyInput="true" style="width:210px;">
									<f:attribute name="startDate"
										value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromCreatedDate}" />
								</p:calendar></td>
						</tr>
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.sc.pbldtfrom']}" /></td>
							<td><p:calendar
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}"
									id="pbdateFrom" showOn="button" size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									style="width:210px;">
									<p:ajax event="dateSelect" update="pbdateTo" />
								</p:calendar></td>
							<td><h:outputLabel value="#{lbl['lbl.sc.pbldtto']}" /></td>
							<td><p:calendar id="pbdateTo" showOn="button"
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toPublishDate}"
									mindate="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}"
									size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									style="width:210px;">
									<f:attribute name="startDate"
										value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromPublishDate}" />
									<f:validator validatorId="dateRangeValidator" />
								</p:calendar></td>
						</tr>
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.sc.clsdtfrom']}" /></td>
							<td><p:calendar
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}"
									id="cldateFrom" showOn="button" size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									style="width:210px;">
									<p:ajax event="dateSelect" update="cldateTo" />
								</p:calendar></td>
							<td><h:outputLabel value="#{lbl['lbl.sc.clsdtto']}" /></td>
							<td><p:calendar id="cldateTo" showOn="button"
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.toClosingDate}"
									mindate="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}"
									size="29" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
									style="width:210px;">
									<f:attribute name="startDate"
										value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.fromClosingDate}" />
									<f:validator validatorId="dateRangeValidator" />
								</p:calendar></td>
						</tr>

						<tr>
							<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
							<td><p:selectOneMenu
									style="width: 240px;margin-bottom: 5px;"
									value="#{evaluationMeetingBackingBean.managedBean.cloneQtnTenderSearchBean.qtStatus}">
									<f:selectItems
										value="#{evaluationMeetingBackingBean.getStatusDropdownValues('SC', 'QT')}"></f:selectItems>
								</p:selectOneMenu></td>
							<td />
							<td />
						</tr>
					</table>
					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.reset']}"
							styleClass="BtnSpacing" style="float:right;"
							action="#{evaluationMeetingBackingBean.resetClone}"
							update="clonesearchpnlid" resetValues="true" partialSubmit="true"
							process="@this" />
						<p:commandButton value="#{lbl['lbl.btn.search']}"
							styleClass="BtnSpacing" style="float:right;"
							action="#{evaluationMeetingBackingBean.cloneSearchCommitteAction}"
							update="clonesearchpnlid" partialSubmit="true" process="@parent" />
					</div>
					<br />
					<br />
				</p:panel>
				<p:spacer height="3" />
				<p:panel header="#{lbl['lbl.sc.qtn.list']}" toggleable="true" id="evaluationCloneCommitteeMeetingIds">
					<p:dataTable id="clonesearchCommitteid" rows="10"
					    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{evaluationMeetingBackingBean.searchQuotatioTender}"
						rowKey="#{scQt}" selectionMode="single" var="scQt" lazy="true"
						styleClass="cloneResults">

						<ac:paginator for="clonesearchCommitteid" />

						<p:ajax event="rowSelect" update=":form:clonesearchpnlid"
							listener="#{evaluationMeetingBackingBean.onRowCloneAction}" />

						<p:column style="width:17%;white-space: normal;"
							headerText="#{lbl['lbl.sc.qtn.no']}">
							<h:outputText value="#{scQt.qtNo}" />
						</p:column>

						<p:column style="width:43%;white-space: normal;"
							headerText="#{lbl['lbl.sc.title']}">
							<h:outputText value="#{scQt.qtTitle}" />
						</p:column>

						<p:column style="width:10%;white-space: normal;"
							headerText="#{lbl['lbl.sc.procurement.mode']}">
							<h:outputText
								value="#{evaluationMeetingBackingBean.getParameterDesc(scQt.procurementMode)}" />
						</p:column>

						<p:column style="width:10%;white-space: normal;"
							headerText="#{lbl['lbl.sc.created.date']}">
							<h:outputText value="#{scQt.createdDate}">
								<f:convertDateTime
									pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
							</h:outputText>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.published.date']}">
							<h:outputText value="#{scQt.publishDate}">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText>
						</p:column>

						<p:column headerText="#{lbl['lbl.sc.closing.date']}">
							<h:outputText value="#{scQt.closingDate}">
								<f:convertDateTime
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
							</h:outputText>
						</p:column>

						<p:column style="width:20%;white-space: normal;"
							headerText="#{lbl['lbl.sc.status']}">
							<h:outputText
								value="#{evaluationMeetingBackingBean.getStatusDescById(scQt.qtStatus.statusId)}" />
						</p:column>
					</p:dataTable>
					<p:spacer height="15px" />

					<ui:fragment
						rendered="#{evaluationMeetingBackingBean.managedBean.cloneSelectQt ne null}">
				#{evaluationMeetingBackingBean.managedBean.cloneSelectQt.qtNo}>#{lbl['lbl.sc.committee.details']}
				</ui:fragment>

					<p:dataTable id="cloneCommittee" var="committeeMember" rows="10" rowIndexVar="index"
					    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{evaluationMeetingBackingBean.managedBean.cloneCommitteMemebers}"
						selection="#{evaluationMeetingBackingBean.managedBean.cloneCommitteMemebersSelect}"
						rowKey="#{committeeMember.committeeMemberId}">
						<ac:paginator for="cloneCommittee" />


						<p:column selectionMode="multiple"
							styleClass="td-check-box-spacing"></p:column>
						<p:column style="width:25%;white-space: normal;"
							headerText="#{lbl['lbl.sc.name']}">
							<h:outputText value="#{committeeMember.memberName}"></h:outputText>
						</p:column>

						<p:column style="width:13%;white-space: normal;"
							headerText="#{lbl['lbl.sc.identification.no']}">
							<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
						</p:column>

						<p:column style="width:19%;white-space: normal;"
							headerText="#{lbl['lbl.sc.designation']}">
							<h:outputText value="#{committeeMember.designation}"></h:outputText>
						</p:column>
						<p:column style="width:20%;white-space: normal;"
							headerText="#{lbl['lbl.sc.email']}">
							<h:outputText value="#{committeeMember.email}"></h:outputText>
						</p:column>

						<p:column style="width:5%;white-space: normal;"
							headerText="#{lbl['lbl.sc.grade']}">
							<h:outputText value="#{committeeMember.grade}"></h:outputText>
						</p:column>

						<p:column style="width:5%;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.pnp']}" />
								<ac:iconTooltip id="pnpTT#{index}" value="#{lbl['lbl.sc.pnp.tooltip']}" />
							</f:facet>
							<h:outputText
								value="#{lbl[committeeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
						</p:column>
						<p:column style="width:10%;white-space: normal;"
							headerText="#{lbl['lbl.sc.role']}">
							
								<h:outputText
									value="#{evaluationMeetingBackingBean.getParameterDesc(committeeMember.memberRole)}"></h:outputText>
							


						</p:column>

					</p:dataTable>

					<div align="right">
						<p:commandButton value="#{lbl['lbl.btn.cancel']}"
							styleClass="BtnSpacing"
							actionListener="#{evaluationMeetingBackingBean.closeListener}"
							style="float:right;" onclick="screen2.hide();" />
						<p:commandButton value="#{lbl['lbl.btn.ok']}" process="@this,evaluationCloneCommitteeMeetingIds"
							styleClass="BtnSpacing" partialSubmit="true"
							actionListener="#{evaluationMeetingBackingBean.cloneCommitteeDtls}"
							oncomplete="prepareCommittee.paginator.endLink.click();"
							update="evaluationpreparecommittee" />

					</div>
				</p:panel>
			</h:panelGroup>
			<p:ajax event="close"
				listener="#{evaluationMeetingBackingBean.closeListener}" />
		</p:dialog>
	</h:panelGroup>
</ui:composition>
