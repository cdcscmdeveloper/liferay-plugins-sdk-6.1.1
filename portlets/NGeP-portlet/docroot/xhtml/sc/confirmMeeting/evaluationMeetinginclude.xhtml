<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">


	<p:blockUI block=":form" widgetVar="blockWidget">
		<h:graphicImage value="/css/images/ajax-loader.gif"></h:graphicImage>
	</p:blockUI>
	<p:messages id="evaluationMeeting" showDetail="true"
		autoUpdate="#{evaluationMeetingBackingBean.managedBean.autoUpdate}"
		closable="true" severity="error,info" showSummary="false" />
	
	<div align="right">

		<p:commandButton value="#{lbl['lbl.btn.save']}" process="@all"
			action="#{evaluationMeetingBackingBean.saveCommitteeAction}"
			update="@all" onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();" />

		<ui:repeat var="bpmAction"
			value="#{evaluationMeetingBackingBean.managedBean.outComes}">
			<ui:fragment rendered="#{bpmAction ne '~'}">
				<ui:param name="buttonLabel"
					value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
					style="float:right;" process="@all" partialSubmit="true"
					action="#{evaluationMeetingBackingBean.submitMettingDetails(bpmAction)}"
					title="#{lbl['lbl.sc.eva.btn.submit.meeting.tooltip']}" />
			</ui:fragment>
		</ui:repeat>
	</div>
	<ui:include src="evaluationMeetingHeader.xhtml"></ui:include>

	<p:panel header="#{lbl['lbl.sc.meeting.details']}" toggleable="true">

		<p:dataTable var="meeting" id="evaluationmeetingDetails"
			widgetVar="meetingDtls" rows="10"
			value="#{evaluationMeetingBackingBean.managedBean.scQtMeetings}"
			selection="#{evaluationMeetingBackingBean.managedBean.meetingMultiSelect}"
			editable="true" rowIndexVar="index" rowKey="#{meeting}">
			<ac:paginator for="evaluationmeetingDetails" />

			<!-- <p:column selectionMode="multiple" style="width:2%"></p:column> -->
			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox
						value="#{evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="evaluationmeetingDetails"
							listener="#{evaluationMeetingBackingBean.selectAll(evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll, evaluationMeetingBackingBean.managedBean.scQtMeetings)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{meeting.selected}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="width:25%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.meeting.date']}" />
				</f:facet>

				<p:calendar value="#{meeting.meetingDate}" showOn="button"
					mindate="#{evaluationMeetingBackingBean.managedBean.today}"
					style="width:200px;" id="meetingDate"
					label="#{lbl['lbl.sc.meeting.date']}" required="true"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}"></p:calendar>
				<p:message id="confirmMeetingId" for="meetingDate" display="icon"></p:message>

			</p:column>
			<p:column style="width:72%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.meeting.location']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.meeting.location.tooltip']}" />
				</f:facet>

				<p:inputTextarea value="#{meeting.meetingLocation}" rows="2"
					style="width:75%;" maxlength="255"
					label="#{lbl['lbl.sc.meeting.location']}" id="locationId"
					required="true" cols="140"></p:inputTextarea>
				<p:message id="meetingLocationId" for="locationId" display="icon"></p:message>
			</p:column>

		</p:dataTable>
		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.add']}"
			styleClass="BtnSpacing"
				process="@this,evaluationmeetingDetails" partialSubmit="true"
				action="#{evaluationMeetingBackingBean.addMeetingAction}"
				oncomplete="meetingDtls.paginator.endLink.click();"
				update="evaluationmeetingDetails" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"
			styleClass="BtnSpacing"
				partialSubmit="true"
				oncomplete="confirmMeetingDtlsDeletePopUp.show();"
				update="@([id$=#{confirmmeetingdtlsDeleteId}])">
				<f:setPropertyActionListener
					target="#{evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>

		</div>
		<ui:param name="confirmmeetingdtlsDeleteId"
			value="confirmmeetingdtlsDeleteId"></ui:param>
		<ac:confirmationPopup id="#{confirmmeetingdtlsDeleteId}"
			widget="confirmMeetingDtlsDeletePopUp" width="480" height="100"
			okAction="evaluationMeetingBackingBean.deleteMeetingDtls"
			title="#{lbl['lbl.sc.meeting.details']}"
			content="#{lbl['lbl.sc.dialog.confirm.meeting.dtls']}"
			update="@([id$=evaluationmeetingDetails])" />

	</p:panel>


	<p:panel header="#{lbl['lbl.sc.committee.member.list']}"
		toggleable="true">

		<h:outputText styleClass="instruction"
			value="#{lbl['lbl.sc.committee.member.list.instruction']}"
			escape="false" />

		<p:dataTable id="evaluationpreparecommittee" var="committeeMember"
			widgetVar="prepareCommittee" rows="10" rowIndexVar="index"
			value="#{evaluationMeetingBackingBean.managedBean.committeeMemberActivity}"
			rowKey="#{committeeMember}">
			<ac:paginator for="evaluationpreparecommittee" />



			<p:column style="width:3px;text-align:center;">
				<f:facet name="header">
					<p:selectBooleanCheckbox disabled="true"
						value="#{evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll}">
						<p:ajax partialSubmit="true" process="@this"
							update="evaluationpreparecommittee"
							listener="#{evaluationMeetingBackingBean.selectAll(evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll, evaluationMeetingBackingBean.managedBean.committeeMemberActivity)}" />
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{committeeMember.selected}"
					disabled="true"
					rendered="#{committeeMember.memberRole.parameterCode eq 'S'}">

				</p:selectBooleanCheckbox>

				<p:selectBooleanCheckbox value="#{committeeMember.selected}"
					rendered="#{committeeMember.memberRole.parameterCode ne 'S'}">
					<p:ajax partialSubmit="true" process="@this" update="@this" />
				</p:selectBooleanCheckbox>
			</p:column>
			<p:column style="width:29%;white-space: normal;"
				headerText="#{lbl['lbl.sc.name']}">
				<h:outputText value="#{committeeMember.memberName}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.identification.no']}">
				<h:outputText value="#{committeeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.designation']}">
				<h:outputText value="#{committeeMember.designation}"></h:outputText>
			</p:column>
			<p:column style="width:15%;white-space: normal;"
				headerText="#{lbl['lbl.sc.email']}">
				<h:outputText value="#{committeeMember.email}"></h:outputText>
			</p:column>

			<p:column style="width:7%;white-space: normal;"
				headerText="#{lbl['lbl.sc.grade']}">
				<h:outputText value="#{committeeMember.grade}"></h:outputText>
			</p:column>

			<p:column style="width:6%;">
				<f:facet name="header">
					<h:outputText value="#{lbl['lbl.sc.pnp']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.pnp.tooltip']}" />
				</f:facet>
				<h:outputText
					value="#{lbl[committeeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column style="width:10%;">
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory"></h:outputText>
					<p:spacer width="5"></p:spacer>
					<h:outputText value="#{lbl['lbl.sc.role']}"></h:outputText>
				</f:facet>
				<ui:fragment
					rendered="#{committeeMember.memberRole.parameterCode eq 'S'}">
					<h:outputText
						value="#{evaluationMeetingBackingBean.getParameterDesc(ParameterTypeConst.committeeRole, ParameterConst.committeeRoleSecretary)}"
						rendered="#{committeeMember.memberRole.parameterCode eq 'S'}" />
				</ui:fragment>
				<ui:fragment
					rendered="#{committeeMember.memberRole.parameterCode ne 'S'}">

					<p:selectOneMenu id="meetingRoleId" required="true"
						label="#{lbl['lbl.sc.role']}"
						value="#{committeeMember.memberRole.parameterId}"
						style="width: 110px;margin-bottom: 5px;">
						<f:selectItems
							value="#{evaluationMeetingBackingBean.getRoleTypeDropdownValues(committeeMember.PNP,evaluationMeetingBackingBean.managedBean.qt,committeeMember.pmUser)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							listener="#{evaluationMeetingBackingBean.chnageMemberRole(index,evaluationMeetingBackingBean.managedBean.committeeMemberActivity)}"></p:ajax>
					</p:selectOneMenu>
					<p:message id="meetingRoleMsg" for="meetingRoleId" display="icon"></p:message>
				</ui:fragment>
			</p:column>


		</p:dataTable>

		
		<div align="right">
			<p:commandButton value="#{lbl['lbl.btn.clone']}" process="@this"
			styleClass="BtnSpacing"
				partialSubmit="true" oncomplete="screen2.show();"
				actionListener="#{evaluationMeetingBackingBean.addCloneCommittee}"
				update="@([id$=#{cloneid}])" />
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@this"
			styleClass="BtnSpacing"
				partialSubmit="true"
				actionListener="#{evaluationMeetingBackingBean.addCommitteeDetails}"
				update="@([id$=#{newspecificationcommitteeid}])"
				oncomplete="newspecificationcommittee.show();" />


			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this"
			styleClass="BtnSpacing"
				partialSubmit="true"
				oncomplete="confirmMeetingCommitteemembersDeletePopUp.show();"
				update="@([id$=#{confirmmeetingCommitteemembersDeleteId}])">
				<f:setPropertyActionListener
					target="#{evaluationMeetingBackingBean.managedBean.templateSpecBean.selectAll}"
					value="#{false}" />
			</p:commandButton>

		</div>
		<ui:param name="confirmmeetingCommitteemembersDeleteId"
			value="confirmmeetingCommitteemembersDeleteId"></ui:param>
		<ac:confirmationPopup id="#{confirmmeetingCommitteemembersDeleteId}"
			widget="confirmMeetingCommitteemembersDeletePopUp" width="490"
			height="100"
			okAction="evaluationMeetingBackingBean.deleteCommitteemembersDtls"
			title="#{lbl['lbl.sc.committee.member.list']}"
			content="#{lbl['lbl.sc.dialog.confirm.committee.members.dtls']}"
			update="@([id$=evaluationpreparecommittee])" />


	</p:panel>


	<p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="#{lbl['lbl.sc.remark']}" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{evaluationMeetingBackingBean.managedBean.qtCommitteeRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{evaluationMeetingBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea rows="2" cols="100" style="width:75%;"
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" maxlength="1000" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
	<ui:include src="addexistingcommittee.xhtml" />
	<ui:include src="cloneCommittee.xhtml" />

</ui:composition>
