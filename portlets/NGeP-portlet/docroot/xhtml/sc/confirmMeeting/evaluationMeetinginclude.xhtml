<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:messages id="evaluationMeeting" showDetail="true" autoUpdate="true"
		closable="true" />
	<!-- <ac:title value="#{lbl['lbl.sc.eva.evaluation.Meeting']}"></ac:title> -->
	<div align="right">

		<p:commandButton value="#{lbl['lbl.sc.eva.btn.save']}" process="@all"
			partialSubmit="true"
			action="#{evaluationMeetingBackingBean.saveCommitteeAction}"
			icon="ui-icon-save" />

		<ui:repeat var="bpmAction"
			value="#{evaluationMeetingBackingBean.managedBean.outComes}">
			<ui:fragment rendered="#{bpmAction ne '~'}">
				<ui:param name="buttonLabel"
					value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
					style="float:right;" process="@all" partialSubmit="true"
					icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
					action="#{evaluationMeetingBackingBean.submitMettingDetails(bpmAction)}" />
			</ui:fragment>
		</ui:repeat>
	</div>
	<ui:include src="evaluationMeetingHeader.xhtml"></ui:include>

	<p:panel header="#{lbl['lbl.sc.eva.prepare.meeting']}"
		toggleable="true">

		<p:dataTable var="meeting" id="evaluationmeetingDetails"
			widgetVar="meetingDtls"
			value="#{evaluationMeetingBackingBean.managedBean.scQtMeetings}"
			selection="#{evaluationMeetingBackingBean.managedBean.meetingMultiSelect}"
			editable="true" rowIndexVar="index" style="width:100%"
			rowKey="#{meeting}">
			<ac:paginator for="evaluationmeetingDetails" />

			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column style="width:30%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.prepare.meeting.date']}" />
				</f:facet>

				<p:calendar value="#{meeting.meetingDate}" showOn="button"
					id="meetingDate" label="#{lbl['lbl.sc.eva.prepare.meeting.date']}"
					required="true"
					pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}"></p:calendar>
				<p:message id="confirmMeetingId" for="meetingDate" display="icon"></p:message>

			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.sc.eva.prepare.meeting.loc']}" />
				</f:facet>

				<p:inputTextarea value="#{meeting.meetingLocation}" rows="2"
					maxlength="50" label="#{lbl['lbl.sc.eva.prepare.meeting.loc']}"
					id="locationId" required="true" cols="100"></p:inputTextarea>
				<p:message id="meetingLocationId" for="locationId" display="icon"></p:message>
			</p:column>

			<!-- <p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}">
			
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
			</p:column> -->
		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.add']}"
				process="@this,evaluationmeetingDetails" partialSubmit="true"
				action="#{evaluationMeetingBackingBean.addMeetingAction}"
				oncomplete="meetingDtls.paginator.endLink.click();"
				update="evaluationmeetingDetails" icon="ui-icon-add" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				icon="ui-icon-delete" process="@this,evaluationmeetingDetails"
				partialSubmit="true"
				action="#{evaluationMeetingBackingBean.deleteMeetingDetails}"
				update="evaluationmeetingDetails" />

		</div>

	</p:panel>


	<p:panel header="#{lbl['lbl.sc.eva.cmt.member.list']}"
		toggleable="true">

		<p:dataTable id="evaluationpreparecommittee" var="committeeMember"
			widgetVar="prepareCommittee"
			value="#{evaluationMeetingBackingBean.managedBean.committeeMemberActivity}"
			selection="#{evaluationMeetingBackingBean.managedBean.committeeActivitySelect}"
			rowKey="#{committeeMember}">
			<ac:paginator for="evaluationpreparecommittee" />


			<p:column selectionMode="multiple" style="width:2%"></p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}">
				<h:outputText
					value="#{committeeMember.scCommitteeMember.memberName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}">
				<h:outputText
					value="#{committeeMember.scCommitteeMember.icPassport}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.designation']}">
				<h:outputText
					value="#{committeeMember.scCommitteeMember.designation}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.email']}">
				<h:outputText value="#{committeeMember.scCommitteeMember.email}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.grade']}">
				<h:outputText value="#{committeeMember.scCommitteeMember.grade}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.pp']}">
				<h:outputText
					value="#{lbl[committeeMember.scCommitteeMember.PNP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}"></h:outputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					<h:outputText value="*" styleClass="mandatory"></h:outputText>
					<h:outputText value="#{lbl['lbl.sc.eva.committee.role']}"></h:outputText>
				</f:facet>
				<ui:fragment rendered="#{committeeMember.scCommitteeMember.PNP}">
					<h:outputText
						value="#{evaluationMeetingBackingBean.getParameterDesc(committeeMember.scCommitteeMember.memberRole)}" />
				</ui:fragment>
				<ui:fragment rendered="#{!committeeMember.scCommitteeMember.PNP}">
					<p:selectOneMenu id="meetingRoleId" required="true"
						label="#{lbl['lbl.sc.eva.committee.role']}"
						value="#{evaluationMeetingBackingBean.getParameterDesc(committeeMember.scCommitteeMember.memberRole)}"
						style="width: 110px;margin-bottom: 5px;">
						<f:selectItems
							value="#{evaluationMeetingBackingBean.getRoleTypeDropdownValues(ParameterTypeConst.committeeRole)}" />
					</p:selectOneMenu>
					<p:message id="meetingRoleMsg" for="meetingRoleId" display="icon"></p:message>
				</ui:fragment>

			</p:column>


		</p:dataTable>

		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.clone']}"
				process="@this" partialSubmit="true" oncomplete="screen2.show();"
				actionListener="#{evaluationMeetingBackingBean.addCloneCommittee}"
				update="form:cloneid" icon="ui-icon-clone" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.add']}" process="@this"
				partialSubmit="true"
				actionListener="#{evaluationMeetingBackingBean.addCommitteeDetails}"
				icon="ui-icon-add" update=":form:newspecificationcommitteeid"
				oncomplete="newspecificationcommittee.show();" />
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.delete']}"
				icon="ui-icon-delete" process="@this,evaluationpreparecommittee"
				partialSubmit="true"
				action="#{evaluationMeetingBackingBean.deleteCommitteeMembers}"
				update="evaluationpreparecommittee" />

		</div>

	</p:panel>


	<p:panel header="#{lbl['lbl.sc.spec.approval.remark']}"
		toggleable="true">
		<table style="width: 100%" id="remarkslist">
			<tr>
				<td class="TableFieldLeft" style="width: 96px;"><p:outputLabel
						value="Remark" /></td>
				<td class="TableFieldRight"><p:dataGrid var="remarkVar"
						value="#{evaluationMeetingBackingBean.managedBean.qtCommitteeRemarks}"
						rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" valign="top"><h:graphicImage height="30"
										value="#{evaluationMeetingBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										width="30" /></td>
								<td width="5"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}" />,
									<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea rows="2" cols="100"
										value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId eq null}" maxlength="1000" />
									<h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkVar.remarkId ne null}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>
							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
	<ui:include src="addexistingcommittee.xhtml" />
	<ui:include src="cloneCommittee.xhtml" />

</ui:composition>
