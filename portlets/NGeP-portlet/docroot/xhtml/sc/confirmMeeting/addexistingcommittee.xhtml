<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog id="newspecificationcommitteeid" position="top"
		header="New #{evaluationMeetingBackingBean.managedBean.committeeTypeDesc}"
		dynamic="true" widgetVar="newspecificationcommittee" modal="true"
		styleClass="scAddMember">

		<p:panel id="addexistingNewId">
			<p:messages id="existingNewid" autoUpdate="true" showDetail="true"
				showSummary="false" closable="true"></p:messages>
			<table>
				<tr>
					<td><p:outputLabel
							value="#{lbl['lbl.sc.committe.addscreen.selection']}" /> <p:outputLabel
							value="*" styleClass="mandatory"></p:outputLabel></td>
					<td><p:selectOneRadio
							label="#{lbl['lbl.sc.committe.addscreen.selection']}"
							id="meetingUserSelect"
							value="#{evaluationMeetingBackingBean.managedBean.committeMember.userSelection}">
							<f:selectItems
								value="#{evaluationMeetingBackingBean.managedBean.selections}" />
							<p:ajax event="click"
								listener="#{evaluationMeetingBackingBean.userSelcetionAction}"
								update="newCommitteeProfile" process="@this"></p:ajax>
						</p:selectOneRadio> <p:message id="userSelectId" for="meetingUserSelect"
							display="icon"></p:message></td>
				</tr>
			</table>

			<p:panel id="newCommitteeProfile" style="width:100%;margin-top:10px;">
				<c:if
					test="#{evaluationMeetingBackingBean.managedBean.committeMember.userSelection eq 'E' }">
					<p:panel header="Search" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.name']}" /></td>
								<td colspan="3"><p:inputText maxlength="50"
										value="#{evaluationMeetingBackingBean.managedBean.name}"
										size="64" /></td>
							</tr>
							<tr>
								<td style="width: 110px;"><p:outputLabel
										value="#{lbl['lbl.sc.addscreen.idtype']}" /></td>
								<td><p:selectOneMenu
										value="#{evaluationMeetingBackingBean.managedBean.identificationType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{evaluationMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu></td>
								<td />
								<td />
							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.addscreen.idno']}" /></td>
								<td><p:inputText maxlength="20"
										value="#{evaluationMeetingBackingBean.managedBean.identificationNo}"
										size="30" /></td>
								<td />
								<td />
							</tr>
						</table>
					</p:panel>
					<p:commandButton value="#{lbl['lbl.so.reset']}"
						style="float:right;"
						action="#{evaluationMeetingBackingBean.reset}"
						update="newCommitteeProfile" icon="ui-icon-reset"
						resetValues="true" partialSubmit="true" process="@this" />

					<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
						style="float:right;" icon="ui-icon-search"
						action="#{evaluationMeetingBackingBean.existingCommitteeSearchAction}"
						update="@(.existingCommitteeResults)" partialSubmit="true"
						process="@parent" />
					<p:spacer height="40" />
					<p:panel header="Search Result" toggleable="true">
						<p:dataTable id="existingcommitteesearch"
							widgetVar="existingCommittee" lazy="true"
							value="#{evaluationMeetingBackingBean.searchExistingUser}"
							selection="#{evaluationMeetingBackingBean.managedBean.selectedPmUser}"
							rowKey="#{existcommitteeuser.userId}" var="existcommitteeuser"
							styleClass="existingCommitteeResults" style="width : 900px;">

							<ac:paginator for="existingcommitteesearch" />

							<p:column selectionMode="multiple" style="width:2%" />

							<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.name']}">
								<h:outputText value="#{existcommitteeuser.userName}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.idn.no']}">
								<h:outputText value="#{existcommitteeuser.identificationNo}" />
							</p:column>

							<p:column
								headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.designation']}">
								<h:outputText value="#{existcommitteeuser.designation}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.email']}">
								<h:outputText
									value="#{existcommitteeuser.pmAddressTypes[0].pmAddress.email}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.grade']}">
								<h:outputText value="#{existcommitteeuser.grade}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.eva.mtng.opn.cmt.pp']}">
								<h:outputText
									value="#{lbl[existcommitteeuser.PMP ? 'lbl.btn.yes' : 'lbl.btn.no' ]}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.sc.eva.committee.role']}">
								<ui:fragment rendered="#{existcommitteeuser.PMP == true}">
									<h:outputText value="Chairperson" />
								</ui:fragment>
								<ui:fragment rendered="#{!existcommitteeuser.PMP}">
									<p:selectOneMenu id="appaction"
										value="#{existcommitteeuser.memberRole.parameterId}"
										style="width: 110px;margin-bottom: 5px;">
										<f:selectItems
											value="#{evaluationMeetingBackingBean.getRoleTypeDropdownValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu>
								</ui:fragment>

							</p:column>
						</p:dataTable>
					</p:panel>
				</c:if>
				<c:if
					test="#{evaluationMeetingBackingBean.managedBean.committeMember.userSelection eq 'N'}">
					<p:panel header="New user" toggleable="true">
						<table>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.name']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td colspan="3"><p:inputText maxlength="50"
										id="newUserName"
										label="#{lbl['lbl.sc.committe.addscreen.name']}"
										required="true"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.memberName}"
										size="30" /> <p:message id="newUserId" for="newUserName"
										display="icon"></p:message></td>
							</tr>
							<tr>
								<td style="width: 125px;"><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idtype']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:selectOneMenu id="identification"
										label="#{lbl['lbl.sc.committe.addscreen.idtype']}"
										required="true"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.idType}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{evaluationMeetingBackingBean.getDropdownCodeValues(ParameterTypeConst.identificationTypes)}" />
									</p:selectOneMenu> <p:message id="identificationId" for="identification"
										display="icon"></p:message></td>
							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.idno']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:inputText maxlength="15" id="identificationNum"
										label="#{lbl['lbl.sc.committe.addscreen.idno']}"
										required="true"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.icPassport}"
										size="30" /> <p:message id="identificationNumId"
										for="identificationNum" display="icon"></p:message></td>

							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.grade']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:inputText maxlength="10" id="grade"
										label="#{lbl['lbl.sc.committe.addscreen.grade']}"
										required="true"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.grade}"
										size="30" /> <p:message id="gradeId" for="grade"
										display="icon"></p:message></td>

							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.pnp']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:selectOneRadio id="newP"
										label="#{lbl['lbl.sc.pnp']}" required="true"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.PNP}">
										<f:selectItems
											value="#{evaluationMeetingBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />

									</p:selectOneRadio> <p:message id="newPPId" for="newP" display="icon"></p:message>
								</td>

							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.designation']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:inputText maxlength="50" id="designation"
										required="true"
										label="#{lbl['lbl.sc.committe.addscreen.designation']}"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.designation}"
										size="30" /> <p:message id="designationId" for="designation"
										display="icon"></p:message></td>

							</tr>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:inputText maxlength="80" id="emailValid"
										required="true" label="#{lbl['lbl.sc.email']}"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.email}"
										size="30">
										<f:validateRegex
											pattern="[\w\.-]*[a-zA-Z0-9_]@[\w\.-]*[a-zA-Z0-9]\.[a-zA-Z][a-zA-Z\.]*[a-zA-Z]" />
									</p:inputText> <p:message id="emailId" for="emailValid" display="icon"></p:message></td>

							</tr>
							<tr>
								<td><p:outputLabel
										value="#{lbl['lbl.sc.committe.addscreen.role']}" /> <p:outputLabel
										value="*" styleClass="mandatory"></p:outputLabel></td>
								<td><p:selectOneMenu id="memberRole" required="true"
										label="#{lbl['lbl.sc.committe.addscreen.role']}"
										value="#{evaluationMeetingBackingBean.managedBean.committeMember.memberRole.parameterId}"
										style="width: 178px;margin-bottom: 5px;">
										<f:selectItems
											value="#{evaluationMeetingBackingBean.getDropdownValues(ParameterTypeConst.committeeRole)}" />
									</p:selectOneMenu> <p:message id="newMemberRoleId" for="memberRole"
										display="icon"></p:message></td>

							</tr>
						</table>
					</p:panel>
				</c:if>
			</p:panel>
			<p:commandButton value="#{lbl['lbl.so.cancelbtn']}"
				styleClass="apply_button" style="float:right;" process="@this"
				oncomplete="newspecificationcommittee.hide();" icon="ui-icon-cancel" />

			<p:commandButton value="Ok" style="float:right;"
				oncomplete="prepareCommittee.paginator.endLink.click();"
				update="evaluationpreparecommittee,addexistingNewId"
				process="@this, newCommitteeProfile,addexistingNewId"
				icon="ui-icon-check"
				actionListener="#{evaluationMeetingBackingBean.okCommitteeAction}" />

		</p:panel>

	</p:dialog>
</ui:composition>
