<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel>
		
    <h:panelGrid  columns="2" style="width:100%;">
    <table style="width: 100%; margin-top:-70px;" border="1">
	 <tr>
	  <td><h:graphicImage value="/xhtml/sc/userprofiles/images/aida.jpg" width="100" height="100"/></td>
    </tr>
	</table>
	</h:panelGrid>
	
	
	<h:panelGrid  columns="2" style="width:100%;align:center;" styleClass="noBorders tr,noBorders td">   
	<h:outputLabel value="Login ID: "></h:outputLabel>
	<h:outputLabel value="#{userprofileBackingBean.managedBean.pmUser.loginId}"></h:outputLabel>
	
	<h:outputLabel value="Name: "></h:outputLabel>
	<h:outputLabel value="#{userprofileBackingBean.managedBean.pmUser.userName}"></h:outputLabel>
		
	<h:outputLabel value="Designation: "></h:outputLabel>
	<h:outputLabel value="#{userprofileBackingBean.managedBean.pmUser.designation}"></h:outputLabel>
				
	<h:outputLabel value="Email: "></h:outputLabel>
	<h:outputLabel value="#{userprofileBackingBean.managedBean.pmAddress.email}"></h:outputLabel>
	
	<h:outputLabel value="Mobile No.: "></h:outputLabel>
	<h:outputLabel value="#{userprofileBackingBean.managedBean.pmAddress.mobileNo}"></h:outputLabel>	
	
	
     	 
    </h:panelGrid>
	<p:commandButton value="More" style="float:center;"/>
	</p:panel>
</ui:composition>
