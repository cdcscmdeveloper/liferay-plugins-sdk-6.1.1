<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.deduction.payment']}"
		id="deductionPayId" toggleable="true">

		<p:dataTable id="deductTbl" widgetVar="deductTblWidget"
			var="scQtDeduction"
			value="#{directLOABackingBean.managedBean.scLoa.scQtDeductions}"
			selection="#{directLOABackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{scQtDeduction}" rowIndexVar="rowIndex"
			selectionMode="single">

			<p:ajax event="rowSelect" update=":form:deductionPayId" />
			<p:ajax event="rowUnselect" update=":form:deductionPayId" />

			<ac:paginator for="deductTbl" />

			<p:column width="60%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{isEditableStatus}" />
					<h:outputText value="#{lbl['lbl.sc.deduction.type']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.deduction.type.tooltip']}" />
				</f:facet>

				<c:if test="#{isEditableStatus}">
					<p:selectOneMenu id="deductionType"
					disabled="#{directLOABackingBean.managedBean.readOnly}"
					    style="width: 250px;"
						label="#{lbl['lbl.sc.deduction.type']}"
						value="#{scQtDeduction.deductionType.parameterId}">
						<f:selectItems
							value="#{directLOABackingBean.getDeductionItemTypeDropdownList()}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form:deductionPayId, deductionPayAmtId "
							oncomplete="deductTblWidget.unselectAllRows(); deductTblWidget.selectRow(#{rowIndex}, true);"
							listener="#{directLOABackingBean.deductionTypeChange(scQtDeduction)}" />
					</p:selectOneMenu>
					<p:message id="deductionTypeMsg" for="deductionType" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus}">
					#{directLOABackingBean.getParameterDesc(scQtDeduction.deductionType)}
				</c:if>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.deduction.amount']}" width="40%">
				<h:panelGroup id="deductionPayAmtId">
					<p:inputText id="amtid" size="30" maxlength="18" required="true"
						label="#{lbl['lbl.sc.deduction.amount']}"
						value="#{scQtDeduction.deductionAmount}"
						disabled="#{!(isPendingSubmissionStatus or isPendingRevisionStatus) or directLOABackingBean.managedBean.readOnly}"
						style="margin-right:5px;text-align:right;"
						rendered="#{scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeFixed}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							maxIntegerDigits="14"></ac:validateNumber>
					</p:inputText>
					<p:message id="amtidMsg" for="amtid" display="icon" />
				</h:panelGroup>
			</p:column>
		</p:dataTable>

		<c:if test="#{isEditableStatus}">
			<div class="ppRightBtn BtnSpacing">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
				disabled="#{directLOABackingBean.managedBean.readOnly}"
					process="@this, deductTbl"
					action="#{directLOABackingBean.addDeductionPaymentAction}"
					oncomplete="deductTblWidget.paginator.endLink.click();"
					update="deductTbl" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
				disabled="#{directLOABackingBean.managedBean.readOnly}"
					process="@this, deductTbl"
					oncomplete="deductionPayDeletePopUp.show();"
					update="@([id$=#{deductionPayDeleteId}])" />
			</div>
			<ac:confirmationPopup id="deductionPayDeleteId"
				widget="deductionPayDeletePopUp"
				okAction="directLOABackingBean.deleteDeductionPaymentAction"
				width="400" height="100"
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		</c:if>
		
		<h:panelGroup id="clausePnl">
			<h:outputText value="#{lbl['lbl.sc.deduction.payment']} (" />
			<h:outputText
				value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.selectedScQtDeduction.deductionType)} )>" />
			<h:outputText value="#{lbl['lbl.sc.deduction.clauses']} " />

			<p:dataTable id="deductClauseTbl" widgetVar="deductClauseTblWidget"
				var="scQtDeductionClause"
				value="#{directLOABackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
				selection="#{directLOABackingBean.managedBean.selectedDeductionClauses}"
				rowKey="#{scQtDeductionClause}" rowIndexVar="rowIndex">

				<ac:paginator for="deductClauseTbl" />

				<p:column selectionMode="multiple" style="width:2%"
					rendered="#{isEditableStatus}" />

				<p:column style="white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory"
							rendered="#{isEditableStatus}" />
						<h:outputText value="#{lbl['lbl.sc.deduction.clause']}" />
					</f:facet>

					<h:panelGroup rendered="#{empty scQtDeductionClause.pmClause}">
						<p:inputTextarea value="#{scQtDeductionClause.clauseDesc}"
						disabled="#{directLOABackingBean.managedBean.readOnly}"
							id="clauseId" label="#{lbl['lbl.sc.deduction.clause']}" rows="2"
							maxlength="500" style=" margin-bottom:5px; width:790px"
							rendered="#{isEditableStatus}">
							<p:ajax event="keyup" />
						</p:inputTextarea>
						<p:message id="clauseIdMsg" for="clauseId" display="icon" />
						<h:outputText value="#{scQtDeductionClause.clauseDesc}"
							rendered="#{!isEditableStatus}" />
					</h:panelGroup>

					<h:outputText escape="false"
						value="#{scQtDeductionClause.pmClause.clauseDesc}"
						rendered="#{!empty scQtDeductionClause.pmClause}" />

				</p:column>

			</p:dataTable>

			<div class="ppRightBtn BtnSpacing">
				<h:panelGroup
					rendered="#{!empty directLOABackingBean.managedBean.selectedScQtDeduction and directLOABackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers and isEditableStatus}">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
					disabled="#{directLOABackingBean.managedBean.readOnly}"
						process="@this, deductClauseTbl" partialSubmit="true"
						action="#{directLOABackingBean.addDeductionClauseAction}"
						oncomplete="deductClauseTblWidget.paginator.endLink.click();"
						update="deductClauseTbl" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
					disabled="#{directLOABackingBean.managedBean.readOnly}"
						process="@this, deductClauseTbl" partialSubmit="true"
						oncomplete="deductionClauseDeletePopUp.show();"
						update="@([id$=#{deductionClauseDeleteId}])" />

				</h:panelGroup>
			</div>
			<ac:confirmationPopup id="deductionClauseDeleteId"
				widget="deductionClauseDeletePopUp"
				okAction="directLOABackingBean.deleteDeductionClause" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />

		</h:panelGroup>
	</p:panel>
</ui:composition>
