<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="contentSection">
		<p:messages id="loaMaintMsg" showDetail="true" autoUpdate="#{directLOABackingBean.managedBean.autoUpdate}"
			closable="true" showSummary="false" escape="false"/>

		<ui:param name="isPendingSubmissionStatus"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_SUBMISSION}" />
		<ui:param name="isPendingApprovalStatus"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_APPROVAL}" />
		<ui:param name="isPendingRevisionStatus"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_REVISION}" />
		<ui:param name="isPendingRevApprovalStatus"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_REVISION_APPROVAL}" />
		<ui:param name="isEditableStatus"
			value="#{(isPendingSubmissionStatus || ((isPendingApprovalStatus|| isPendingRevisionStatus || isPendingRevApprovalStatus) and !empty directLOABackingBean.managedBean.taskId))}" />
		<ui:param name="isAfterSupplierResponseStatus"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId > QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		<ui:param name="isPendingVerification"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_VERIFICATION}" />

		<ui:param name="isSupplierAckStatus"
			value="#{directLOABackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		<ui:param name="isTrackingDairyView" value="#{directLOABackingBean.managedBean.trackingDairyView}" />

		<ui:include src="/xhtml/sc/loa/directnego/directLoaButtons.xhtml" />
		<ui:include src="/xhtml/sc/loa/directnego/directLoaHeader.xhtml" />
		<!-- 20190405@asyrafhaziq - CR(25062)- Start -->
		<ui:param name="bpmAction" value="APPROVE" />
		<ui:param name="committeeApprovalConsentSigner"
			value="committeeApprovalConsentSigner" />
		<ac:approvePopup id="#{committeeApprovalConsentSigner}"
			widget="loaApprovalPopUp"
			okAction="#{directLOABackingBean.updateBpmTaskAction(bpmAction)}"
			width="50%" height="100"
			title="#{lbl['lbl.sc.dialog.confirm.loa.approve.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.loa.approve.dtls']}"
			update="@form" />
		<!-- 20190405@asyrafhaziq - CR(25062)- End -->
		<ac:gpkiPopup textBeforeSign="#{directLOABackingBean.textBeforeSign}"
			postSignAction="#{directLOABackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" 
			enableAutoUpdate="#{directLOABackingBean.enableAutoUpdate()}" />

		<h:outputText styleClass="instruction" rendered="#{isPendingVerification}"
			value="#{lbl['lbl.sc.loiloa.loa.verify.instruction']}">
		</h:outputText>
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="20%" valign="top" class="sidemenutd"><h:panelGroup
						id="menuItems">
						<p:tabMenu id="menuTab" styleClass="sidemenu"
							activeIndex="#{directLOABackingBean.managedBean.selectedTabIndex}">

							<ui:remove>#29468 Vinod Start Added Action for all menu items to validate unit price and quantity</ui:remove>
							<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.details']}"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(0)}"
								update="@form" />
							<!-- #29661 start -->
							<p:menuitem value="#{lbl['lbl.sc.sr.cat.code']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(1)}"
								rendered="#{directLOABackingBean.managedBean.showCategoryCode}" /><!-- #29661 #40096 adli  -->
							<!-- #29661 end -->
							<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.contents']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(2)}" />
							<p:menuitem value="#{lbl['lbl.sc.loiloa.award.details']}"
								actionListener="#{directLOABackingBean.searchSupplierItemByName}" update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(3)}" /><ui:remove>#29007 Added actionListener Vinod</ui:remove>
							<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(4)}" />
							<p:menuitem value="#{lbl['lbl.sc.loiloa.payment.details']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(5)}" />
							<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(6)}"
								disabled="#{!(directLOABackingBean.managedBean.scQt.fulfilmentType.parameterCode eq ParameterConst.fulfilmentTypeScheduled )}" /><!-- new #25726 remove non periodic to condition -->
							<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.perform.bond']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(7)}"
								disabled="#{!directLOABackingBean.managedBean.scLoa.bondReq}" />
							<p:menuitem value="#{lbl['lbl.sc.approval.details']}"
								update="@form"
								action="#{directLOABackingBean.tabChangeActionDirectLOA(8)}"
								disabled="#{!directLOABackingBean.managedBean.scLoa.approvalReq}" />
							<ui:remove>#29468 Vinod End</ui:remove>
						</p:tabMenu>
					</h:panelGroup></td>
				<td width="80%" valign="top"><h:panelGroup id="menuContent">
						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex == 0}">
							<ui:include src="directLoaDetailsMenu.xhtml" />
						</c:if>
						
						<!-- #29661 start -->
						<c:if
							test="#{directLOABackingBean.managedBean.showCategoryCode and directLOABackingBean.managedBean.selectedTabIndex == 1}"> <!-- #40974  -->
							<ui:include src="directLOACategoryCodeSelection.xhtml" />
						</c:if>
						<!-- #29661 end -->
						
						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(2)}"> <!-- #40974  -->
							<ui:include src="directawardloaLetterOfAcceptance.xhtml" />
						</c:if>

						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(3)}"> <!-- #40974  -->
							<ui:include src="directLoaAwardDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(4)}"> <!-- #40974  -->
							<ui:include src="directawardloaDeductionPaymentMenu.xhtml" />
						</c:if>

						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(5)}"> <!-- #40974  -->
							<ui:include src="directawardloaPaymentDetailsMenu.xhtml" />
						</c:if>

						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(6)}"> <!-- #40974  -->
							<ui:include src="directawardloaFulfilmentSchedule.xhtml" />
						</c:if>

						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(7)}"> <!-- #40974  -->
							<ui:include src="directawardloaPerformanceBondMenu.xhtml" />
						</c:if>

						<c:if
							test="#{directLOABackingBean.managedBean.selectedTabIndex ==  directLOABackingBean.newTabIndexDirectLOA(8)}"> <!-- #40974  -->
							<ui:include src="directawardloaApprovalMenu.xhtml" />
						</c:if>
					</h:panelGroup></td>
			</tr>
		</table>

		<ac:scSingleFileUploadPopup widgetVar="scDocDnUploadDlg"
			fileUploadListener="directLOABackingBean.handleFileUpload"
			readonly="#{directLOABackingBean.managedBean.readOnly}"
			update="@([id$=scDocUploadBtn])" 
			fileType="#{directLOABackingBean.managedBean.fileTypePdf}"
			invalidFileMessage="#{lbl['lbl.txt.upload.pdf.file']}"
			autoUpdateValue="#{directLOABackingBean.managedBean.autoUpdate}"/>
			
		<ac:scSingleFileUploadPopup widgetVar="supportDocUploadDlg"
			fileUploadListener="directLOABackingBean.handleSuppDocFileUpload"
			readonly="#{directLOABackingBean.managedBean.readOnly}"
			update="@([id$=supportDocUploadBtn])" 
			autoUpdateValue="#{directLOABackingBean.managedBean.autoUpdate}"/>
		
		<p:confirmDialog widgetVar="gstSignerConfirmPopupWin"
			id="gstSignerConfirmPopup" width="500px"
			message="#{lbl['lbl.sc.gst.signers.alert.msg']}">
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					oncomplete="gstSignerConfirmPopupWin.hide()" process="@this"></p:commandButton>
			</div>

		</p:confirmDialog>
		<p:confirmDialog widgetVar="sstSignerConfirmPopupWin"
			id="sstSignerConfirmPopup" width="500px"
			message="#{lbl['lbl.sc.sst.signers.alert.msg']}">
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					oncomplete="sstSignerConfirmPopupWin.hide()" process="@this">
				</p:commandButton>
			</div>
		</p:confirmDialog>
		
		<!-- #25726 - start -->
		
		<p:dialog id="approvalLetterAlert" widgetVar="approvalLetterAlertDlg"
		header="#{lbl['lbl.txt.alert']}" resizable="false" width="500"
		modal="true">
			<p:panel>				
				<table>
					<tr>
						<td>
							<h:graphicImage value="/css/images/design/exclamation.png" style="margin-top: 3px" />
							<p:spacer width="10"></p:spacer>
							<ui:fragment>
								<h:outputText value="#{lbl['lbl.sc.approval.letter.alert']}" style="margin-top: 3px" escape="false"/>								
								<br />
								<br />
							</ui:fragment> 							
						</td>
					</tr>
				</table>			
				
				<p:spacer height="1px" />
				<div class="ppRightBtn" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						id="approvalLetterAlertButton"
						onclick ="approvalLetterAlertDlg.hide();"/>
				</div>				
			</p:panel>	
		</p:dialog>
		
		<p:dialog id="bondChangesAlert" widgetVar="bondChangesAlertDlg"
		header="#{lbl['lbl.txt.alert']}" resizable="false" width="500"
		modal="true">
			<p:panel>				
				<table>
					<tr>
						<td>
							<h:graphicImage value="/css/images/design/exclamation.png" style="margin-top: 3px" />
							<p:spacer width="10"></p:spacer>
							<ui:fragment>
								<h:outputText value="#{lbl['lbl.sc.bond.changes']}" style="margin-top: 3px" escape="false"/>								
								<br />
								<br />
							</ui:fragment> 							
						</td>
					</tr>
				</table>			
				
				<p:spacer height="1px" />
				<div class="ppRightBtn" style="width: 100%">
					<p:commandButton value="#{lbl['lbl.btn.ok']}"
						id="bondChangesAlertButton"
						onclick ="bondChangesAlertDlg.hide();"/>
				</div>				
			</p:panel>	
		</p:dialog>
		
		<!-- #25726 - end -->
	</ui:define>
</ui:composition>
