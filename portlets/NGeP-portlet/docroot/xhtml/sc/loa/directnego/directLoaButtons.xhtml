<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="#{CommonUIConstant.imagePath}/ajax-loader.gif" />
	</p:blockUI>
	
	<p:commandButton immediate="true"
		value="#{lbl['lbl.btn.back']}"
		action="#{directLOABackingBean.backToPrevious}"
		style="float:left;" 
		rendered="#{!empty directLOABackingBean.managedBean.backToPreviousPage}" />

	<div class="ppRightBtn">
		<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
			action="#{pmTrackingDiaryBackingBean.redirectToSupplierTrackingDiary(ParameterConst.doctypeLetterOfAward, directLOABackingBean.managedBean.scLoa.loaId, directLOABackingBean.isSupplier())}"
			immediate="true" 
			rendered="#{!empty directLOABackingBean.managedBean.backToPreviousPage}" />
					
		<ui:param name="readOnlyTask" value="#{directLOABackingBean.managedBean.readOnly}" />
		<ui:decorate
			template="/WEB-INF/facelets/templates/claim_template.xhtml">
			<ui:define name="outComeSection">
				<h:panelGroup id="loaButtonsId">
					<p:commandButton value="#{lbl['lbl.btn.save']}"
						action="#{directLOABackingBean.saveAction(false)}" process="@form"
						update="@form" onstart="blockWidget.show();"
						oncomplete="blockWidget.hide();"
						rendered="#{!directLOABackingBean.managedBean.readOnly}" />


					<c:choose>
						<c:when
							test="#{isEditableStatus and empty directLOABackingBean.managedBean.taskId and !directLOABackingBean.managedBean.readOnly}">
							<p:commandButton value="#{lbl['lbl.btn.submit']}"
								action="#{directLOABackingBean.submitAction}"
								process="@form" update="@form" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" />
						</c:when>

						<c:when test="#{!empty directLOABackingBean.managedBean.taskId}">
							<ui:repeat var="bpmAction"
								value="#{directLOABackingBean.managedBean.outComes}">
								<ui:param name="buttonLabel"
									value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
									
								<ui:param name="isReject" value="#{bpmAction == 'REJECT'}" />
								<ui:param name="isCancel" value="#{bpmAction == 'CANCEL'}" />
								<ui:param name="isCancelNReject" value="#{isReject || isCancel}" />

								<!-- 20190405@asyrafhaziq - CR(25062)- Start -->
								<!-- changes the calling action   -->
								<p:commandButton value="#{lbl[buttonLabel]}"
									styleClass="ui-button" onstart="blockWidget.show();"
									rendered="#{!isPendingVerification}"
									oncomplete="blockWidget.hide();"
									action="#{directLOABackingBean.approveBeforeupdateBpmTaskAction(bpmAction)}"
									partialSubmit="true" process="#{isCancelNReject ? '@this' : '@form'}"
									update="#{isCancelNReject ? '@this' : '@form'}" />

								<p:commandButton value="#{lbl[buttonLabel]}"
									styleClass="ui-button" onstart="blockWidget.show();"
									rendered="#{isPendingVerification}"
									oncomplete="blockWidget.hide();"
									disabled="#{directLOABackingBean.managedBean.verifyBtnFlag}"
									action="#{directLOABackingBean.approveBeforeupdateBpmTaskAction(bpmAction)}"
									partialSubmit="true" process="#{isReject ? '@this' : '@form'}"
									update="#{isReject ? '@this' : '@form'}" />
								<!-- 20190405@asyrafhaziq - CR(25062)- End -->
							</ui:repeat>
						</c:when>
					</c:choose>
				</h:panelGroup>
			</ui:define>
		</ui:decorate>

	</div>
	<ui:remove> #29007 Start Vinod </ui:remove>
	<p:dialog id="verifyConfirmId" widgetVar="verifyConfirmPopUp"
			header="#{lbl['lbl.sc.loiloa.supplier.specification.approval.confirm']}" resizable="false"
			width="35%" height="100" closable="false">
			<table>
				<tr>
					<td align="center"><p:outputLabel
							value="#{lbl['lbl.sc.proposal.specification.download.alert']}" /></td>
				</tr>
			</table>
			<p:spacer height="1" />
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" 
				    onclick="blockWidget.show();"
					oncomplete="verifyConfirmPopUp.hide(); blockWidget.hide();"
					 partialSubmit="true" process="@form" update="@form" 
					action="#{directLOABackingBean.approveBeforeupdateBpmTaskAction(directLOABackingBean.managedBean.loaBpmVerify)}" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" 
				    onclick="blockWidget.hide();"
					oncomplete="verifyConfirmPopUp.hide(); blockWidget.hide();"
					 partialSubmit="true" process="@form" update="@form" 
					action="#{directLOABackingBean.resetLoaBpmVerify()}" />
			</div>
	</p:dialog>
	<ui:remove> #29007 End Vinod </ui:remove>
</ui:composition>
