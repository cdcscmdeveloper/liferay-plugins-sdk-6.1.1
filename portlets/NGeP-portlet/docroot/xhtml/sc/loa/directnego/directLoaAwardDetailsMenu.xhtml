<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		toggleable="true">
		<table>
			<tr>
				<td valign="top"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.main.title']}"></h:outputLabel></td>
				<td colspan="3"><p:inputTextarea rows="2" cols="95"
						style="margin-bottom:5px;" maxlength="200"
						value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specName}" /></td>
			</tr>

			<tr>
				<td style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.item']}" /></td>
				<td><p:inputText  size="30"
						value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemTypeCode)}" /></td>
				<td><h:outputLabel value="#{lbl['lbl.sc.tpl.search.spec']}" /></td>
				<td><p:inputText disabled="true" size="30"
						value="#{specificationBackingBean.getParameterDesc(specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.specTypeCode)}" /></td>

			</tr>

			<tr>

				<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.scQtChecklist.scQtDoc.tplSpecMaster.itemOriginCode.parameterId}">
						<f:selectItems
							value="#{specificationBackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
                <td><h:outputLabel
						value="#{lbl['lbl.sc.spec.template.status']}" /></td>
				<td><p:inputText disabled="true"
						value="#{specificationBackingBean.getStatusDescById(specificationBackingBean.managedBean.scQtChecklist.pmStatus.statusId)}"></p:inputText></td>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.item.weightage']}" /></td>
				<td><p:selectOneRadio
						value="#{specificationBackingBean.managedBean.templateSpecBean.specMaster.weightageReq}">
						<f:selectItems
							value="#{specificationBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />

						<p:ajax event="change" partialSubmit="true" process="@this"
							listener="#{templateSpecBackingBean.updateItemWeightageReq(specificationBackingBean.managedBean.templateSpecBean)}" />

					</p:selectOneRadio></td>
			</tr>

		</table>
	</p:panel>

	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
