<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		toggleable="false">
		<table>
			<tr>
				<td valign="top" width="18%"><h:outputLabel
						value="#{lbl['lbl.sc.document.title']}"></h:outputLabel></td>
				<td colspan="3"><p:inputText size="95"
						style="margin-bottom:5px;" 
						value="#{lOADetailBackingBean.managedBean.tplSpecMaster.specName}" /></td>
			</tr>
			<tr>
				<td style="width: 10%">
				<h:outputLabel
						value="#{lbl['lbl.sc.item.type']}" /> 
				<p:outputLabel value="*" styleClass="mandatory"  /></td>
				<td><p:selectOneMenu id="itemType"
						value="#{lOADetailBackingBean.managedBean.itemTypeId}"
						style="width: 178px;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.loiloa.loa.cont.type']}">
						<f:selectItems
							value="#{lOADetailBackingBean.itemTypeValues}" />
						<p:ajax event="change" partialSubmit="true" process="@this"  update="productAndServiceId"/>
					</p:selectOneMenu>
				</td>
					
				<td width="16%"><h:outputLabel value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
				<td><p:inputText disabled="true" size="30" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
				<td><p:selectOneRadio
						value="#{lOADetailBackingBean.managedBean.tplSpecMaster.weightageReq}">
						<f:selectItems
							value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
                <td><h:outputLabel
						value="#{lbl['lbl.sc.status']}" /></td>
				<td><p:inputText disabled="true"></p:inputText></td>
			</tr>

		</table>
	</p:panel>

	<p:panel header="Specification Content" toggleable="true" id="productAndServiceId">
		<h:panelGroup id="productListId" style="width: 100%;" rendered="#{lOADetailBackingBean.managedBean.itemTypeId eq ParameterConst.itemTypeProduct}">
			<ac:templateSpec
				templateSpecBean="#{lOADetailBackingBean.managedBean.productTemplateSpecBean}"
				title="#{lbl['lbl.txt.product']}" />

		</h:panelGroup>
		<h:panelGroup id="serviceListId" style="width: 100%;" rendered="#{lOADetailBackingBean.managedBean.itemTypeId eq ParameterConst.itemTypeService}">
			<ac:templateSpec
				templateSpecBean="#{lOADetailBackingBean.managedBean.serviceTemplateSpecBean}"
				title="#{lbl['lbl.txt.service']}" />

		</h:panelGroup>

	</p:panel>

	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
