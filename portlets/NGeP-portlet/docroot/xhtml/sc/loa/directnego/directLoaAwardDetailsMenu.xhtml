<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	
	<ui:include src="../shared/loaInstructionHeader.xhtml" />
	
	<ui:include src="/xhtml/sc/common/specGuideLineInstructions.xhtml"></ui:include>
	<ui:include src="/xhtml/common/uominstruction.xhtml"></ui:include> <br/>
	<h:outputText styleClass="instruction" value="#{lbl['lbl.pm.uom.instruction.view.progressive.payment.option']}" escape="false" />
	<ui:include src="/xhtml/common/uompopinclude.xhtml"></ui:include>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}" toggleable="true">
	<ui:remove>  #29007 Start Vinod </ui:remove> 
	<p:outputPanel id="supplierUpdateInstructionPanel"
			rendered="#{directLOABackingBean.managedBean.iconForDL}">
			<h:outputText styleClass="instruction" 
				value="#{lbl['lbl.sc.loiloa.loa.zone.instruction']}" />
				<p:graphicImage value="/css/images/design/ico-viewnedit.png"
				id="supplierUpdateInstructionIconQT" 
				style="max-width: 16px; padding-right: 7px; padding-left: 7px;" />
			<p:spacer height="10" />
			<p:panel id="supplierSearchCriteriaQT" 
				header="#{lbl['lbl.sc.qt.sampel.technical.panel.search.criteria']}" toggleable="true">
				<table border="0" cellspacing="0" cellpadding="0" width="100%">
					<tr>
						<td width="10%"><h:outputLabel
								value="#{lbl['lbl.sc.price.inquiry.item.name']}" /></td>
						<td width="90%"><p:inputText id="itemNameSearchInputQT"
								value="#{directLOABackingBean.itemNameSearchCriteria}"
								style="width:310px;">
								<p:ajax partialSubmit="true" process="@this" update="@this" />
							</p:inputText></td>
					</tr>
				</table>
				<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.search']}" partialSubmit="true" update="productAndServiceId"
								 action="#{directLOABackingBean.searchSupplierItemByName}"
								 styleClass="BtnSpacing" process="@this,itemNameSearchInputQT" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}"
								 action="#{directLOABackingBean.onResetSupplierCriteria()}"
								 update="supplierUpdateInstructionPanel" />
				</div>
			</p:panel>
		</p:outputPanel>
		<br />
		<ui:remove>  #29007 End Vinod </ui:remove> 		
		<h:outputText styleClass="instruction" rendered="#{isSupplierAckStatus}"
			value="#{lbl['lbl.sc.item.codification.instruction']}" />
		<table width="100%">
			<tr>
				<td valign="top" width="20%"><h:outputLabel
						value="#{lbl['lbl.tpl.spec.specification.type']}" /></td>
				<td colspan="3"><p:inputText required="true" 
						value="#{directLOABackingBean.getParameterDesc(ParameterTypeConst.specificationType,ParameterConst.specificationTypeTechnical)}"
						style="margin-bottom:5px;" disabled="true" size="30" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.spec.local.goods']}" /></td>
				<td>
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneRadio id="itemOrigin" styleClass="commonLabel"
								value="#{directLOABackingBean.managedBean.prodscQtDoc.tplSpecMaster.itemOriginCode.parameterId}">
								<f:selectItems
									value="#{directLOABackingBean.getLocalGoodsRadioValues(ParameterTypeConst.itemOrigin)}" />
								<p:ajax event="change" partialSubmit="true" process="@this" />
							</p:selectOneRadio>
						</c:when>
						<c:otherwise>
							<p:inputText id="itemOriginTxt"
								value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.prodscQtDoc.tplSpecMaster.itemOriginCode)}"
								size="30" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td valign="top" width="18%"><h:outputLabel
						value="#{lbl['lbl.sc.qt.zone.location']}" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneRadio id="zoneLocFlg" styleClass="commonLabel"
								value="#{directLOABackingBean.managedBean.scQt.zonal}">
								<f:selectItems
									value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
		
								<p:ajax event="change" partialSubmit="true" process="@this"
									update="@this,generalLocationList,productAndServiceId"
									listener="#{directLOABackingBean.zoneRadioChange}"></p:ajax>
							</p:selectOneRadio>
						</c:when>
						<c:otherwise>
							<p:inputText id="zoneLocFlgTxt"
								value="#{directLOABackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(directLOABackingBean.managedBean.scQt.zonal))}"
								size="30" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
		</table>
	</p:panel>

	<h:panelGroup id="generalLocationList">

		<ui:fragment rendered="#{directLOABackingBean.managedBean.scQt.zonal}">
			<ui:include src="zonelocdetails.xhtml"></ui:include>
		</ui:fragment>

	</h:panelGroup>

	<h:panelGroup id="productAndServiceId">
		<ui:remove> ***19287#63 - start </ui:remove>
		<ui:param name="editable" value="#{isPendingSubmissionStatus or isSupplierAckStatus or isPendingRevisionStatus}" />
		<c:if test="#{directLOABackingBean.managedBean.readOnly}">
			<ui:param name="editable" value="#{false}" />
		</c:if>
		<ui:remove> ***19287#63 - end </ui:remove>
		<ac:templateSpec
			first="#{directLOABackingBean.managedBean.prodFirst}"
		    editable ="#{editable}" 
			templateSpecBean="#{directLOABackingBean.managedBean.prodTemplateSpecBean}"
			title="#{lbl['lbl.txt.product']}"
			isWorkflowStatus="#{isSupplierAckStatus}"
			newable="#{!(isPendingApprovalStatus or isPendingVerification) and !directLOABackingBean.managedBean.readOnly}" />

		<ac:templateSpec
			first="#{directLOABackingBean.managedBean.servFirst}"
		    editable ="#{editable}" 
			templateSpecBean="#{directLOABackingBean.managedBean.specTemplateSpecBean}"
			title="#{lbl['lbl.txt.service']}"
			isWorkflowStatus="#{isSupplierAckStatus}"
			newable="#{!(isPendingApprovalStatus or isPendingVerification) and !directLOABackingBean.managedBean.readOnly}" />

	</h:panelGroup>

</ui:composition>
