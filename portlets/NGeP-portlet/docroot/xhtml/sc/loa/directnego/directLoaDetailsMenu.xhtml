<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ac:lovPopup />
	
	<ui:param name="isContractTypeAsMinistry"
		value="#{directLOABackingBean.managedBean.scLoa.contractType.parameterCode == ParameterConst.contractTypeMinistry}" />
	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}"

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="21%"><p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.mofNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td colspan="3"><ac:lov id="supplierId" lovId="SM_SUPPLIER" label="#{lbl['lbl.sc.supplier.name']}"

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.register.num']}" />
				</td>
				<td colspan="3"><p:inputText size="35"

						value="#{lbl['lbl.sc.gst.registartion.number.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.effective.date']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.gstEffDate eq null ? lbl['lbl.txt.na']:directLOABackingBean.managedBean.scLoa.gstEffDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lb.sc.gst.effective.date.tooltip']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.declared.date']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.gstDeclaredDate eq null ? lbl['lbl.txt.na']:directLOABackingBean.managedBean.scLoa.gstDeclaredDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.declartive.date.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch']}" /> <p:outputLabel

				<td colspan="3"><c:if test="#{isEditableStatus}">
						<table>
							<tr>
								<td><p:selectOneMenu id="branch"
								disabled="#{directLOABackingBean.managedBean.readOnly}"
										value="#{directLOABackingBean.managedBean.selectedSupplierBranchName}"
										style="width: 246px;margin-bottom: 5px;"
										label="#{lbl['lbl.sc.branch']}">
										<f:selectItem itemLabel="HQ" itemValue="#{null}" />
										<f:selectItems
											value="#{directLOABackingBean.managedBean.branchsList}"
											var="smSupplierBranch"
											itemValue="#{smSupplierBranch.branchName}"
											itemLabel="#{smSupplierBranch.branchName}" />
										<p:ajax event="change"
											listener="#{directLOABackingBean.handleBranchDetailsChanged}"
											partialSubmit="true" process="@this"
											update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail" />
									</p:selectOneMenu> <p:message id="branchMsg" for="branch" display="icon" /></td>
								<td style="margin-top: -3px"><ac:iconTooltip
										value="#{lbl['lbl.sc.branch.tooltip']}" /></td>
							</tr>
						</table>

						<p:inputText size="35"
							value="#{directLOABackingBean.managedBean.scLoa.supplierBranch}"
							disabled="true" />
					</c:if></td>
			</tr>
			<tr>
				<td rowspan="3" valign="top" width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.address']}" /></td>
				<td rowspan="3">
					<p:inputTextarea id="suppAddr" label="#{lbl['lbl.sc.address']}" 
						cols="36" disabled="true" rows="5" style=" margin-bottom:5px; width: 236px" maxlength="200" 
						value="#{directLOABackingBean.getFullAddress(directLOABackingBean.managedBean.scLoa.supplierAddress)}"
						required="true" /></td>

				<td width="140px"><p:outputLabel value="#{lbl['lbl.sc.tel.no']}" />
				</td>
				<td><p:inputText id="suppPhoneNo" size="28" disabled="true" 
								 value="#{directLOABackingBean.managedBean.scLoa.supplierPhoneNo}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.fax.no']}" /></td>
				<td><p:inputText id="suppFaxNo" size="28" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.supplierFaxNo}" />
				</td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" /></td>
				<td><p:inputText id="suppMobNo" size="28" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.supplierMobNo}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
				</td>
				<td><p:inputText id="suppContact" size="35" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.supplierContact}" />
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td><p:inputText id="suppEmail" size="28"
						style=" margin-bottom:5px;" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.supplierEmail}" />
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.details.section']}"
		toggleable="true">
		<table width="100%">
			<tr>
				<td width="21%"><h:outputLabel
						value="#{lbl['lbl.sc.ministry']}" /></td>
				<td colspan="3"><p:inputText disabled="#{!isEditableStatus}"
						readonly="true"
						value="#{directLOABackingBean.managedBean.scQt.ministryOrgProfile.orgName}"
						size="106" maxlength="100" /></td>
			</tr>
			<tr>

				<td><p:outputLabel value="#{lbl['lbl.sc.ptj']}" /></td>
				<td colspan="3"><ac:lov id="ptjProfile" lovId="PM_ORG_PROFILE"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" headerText="#{lbl['lbl.sc.ptj']}"
						selectionMode="single"
						saveObject="directLOABackingBean.managedBean.scQt.pmOrgProfile"
						readonly="true" size="106"
						value="#{directLOABackingBean.managedBean.scQt.pmOrgProfile.orgName}"
						update="@form"
						conditionField="#{directLOABackingBean.constuctConditionFields()}" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td colspan="3"><ac:lov id="directLoaQT" lovId="DIRECT_LOA_QT"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" headerText="#{lbl['lbl.sc.quotation.tender']}"

						saveObject="directLOABackingBean.managedBean.scQt"
						readonly="true" size="35"
						value="#{directLOABackingBean.managedBean.scQt.qtNo}"

						postUpdateListener="directLOABackingBean.onQTSelected(directLOABackingBean.managedBean.scQt)"
						conditionField="#{directLOABackingBean.constuctQTConditionFields()}" /></td>
			</tr>
			
			<tr>
				<td width="18%" valign="top"><p:outputLabel value="#{lbl['lbl.sc.title']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:inputTextarea
						id="title"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						label="#{lbl['lbl.sc.title']}" required="true" size="110"
						value="#{directLOABackingBean.managedBean.scLoa.scQt.qtTitle}"
						cols="110" rows="3" style=" margin-bottom:5px;width: 655px;" maxlength="500">
						<p:ajax event="blur" process="title" update="title" />
					</p:inputTextarea><p:message id="titleMsg" for="title" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurment.type.category']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:selectOneMenu id="procTypeBoCategory" required="true"
						disabled="#{isPendingApprovalStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.scLoa.procurementTypeCatId.parameterId}"
						style="margin-bottom:5px;width:246px;"
						label="#{lbl['lbl.sc.procurment.type.category']}">
						<f:selectItems
							value="#{directLOABackingBean.getDropdownValues(ParameterTypeConst.procurementTypeCategory)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:selectOneMenu> <p:message id="procuremnttitleMsg" for="procTypeBoCategory"
						display="icon" /></td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.fileno']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
				     <p:inputText disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						required="true" id="fileNoId"
						value="#{directLOABackingBean.managedBean.scLoa.scQt.fileNo}"
						label="#{lbl['lbl.sc.qt.fileno']}" size="28" >
						<p:ajax event="blur" process="fileNoId" update="fileNoId"/>
						</p:inputText>
						 <p:spacer width="1px" />
						
					<p:inputText required="true"
						id="fileExtNo" styleClass="ppNumericAlign"
						value="#{directLOABackingBean.managedBean.scLoa.fileExtNo}"
						size="1" label="#{lbl['lbl.sc.loiloa.file.extension.no']}"
						maxlength="3" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" >
						<p:ajax event="blur" process="fileExtNo" update="fileExtNo"/>
						</p:inputText>
						 <p:message
						id="fileExtNoMsg" for="fileExtNo" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.res.due.date']}" /></td>
				<td><p:inputText
						value="#{directLOABackingBean.managedBean.scLoa.ackDueDate}"
						size="15" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="8px" /> <p:inputText styleClass="ppNumericAlign"
						disabled="true"
						value="#{!empty directLOABackingBean.managedBean.scLoa.ackDueDate ? DateUtils.getDaysDifference(DateUtils.getCurrentDateWithoutTime(), directLOABackingBean.managedBean.scLoa.ackDueDate) : ''}"
						size="8" /> #{lbl['lbl.sc.days']}</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
				</td>
				<td><p:inputText style="text-align: right;"
						disabled="#{!isEditableStatus}"
						value="#{directLOABackingBean.managedBean.scLoa.scQt.estimatedAmount}"
						size="35">
						<p:ajax event="blur" process="@this" update="@this"></p:ajax>
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>

			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.off.price']}">
					</p:outputLabel> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td><p:inputText style="text-align: right;" required="true" id="loaAmtId"
						value="#{directLOABackingBean.managedBean.scLoa.loaAmt}" size="35"
						label="#{lbl['lbl.sc.loiloa.loa.off.price']}"
						disabled="#{isPendingApprovalStatus or directLOABackingBean.managedBean.readOnly}">
						<p:ajax event="blur"
							listener="#{directLOABackingBean.setOverallCtAmount(directLOABackingBean.managedBean.scLoa.loaAmt)}"
							update="@form"></p:ajax>
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>  <p:message id="loaAmtIdMsg" for="loaAmtId" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.fullfillent.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:selectOneMenu id="fulfilId"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" required="true"
						label="#{lbl['lbl.sc.fullfillent.type']}"
						value="#{directLOABackingBean.managedBean.scLoa.scQt.fulfilmentType.parameterId}"
						style="width: 246px;margin-bottom: 5px;">

						<f:selectItems
							value="#{directLOABackingBean.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"
							update="@this, menuItems,agreementReq"
							listener="#{directLOABackingBean.fulfilmentChange}"></p:ajax>
					</p:selectOneMenu> <p:message id="fulfilType" for="fulfilId" display="icon" /></td>
				<!-- <td style="margin-top: -3px"><ac:iconTooltip
						value="#{lbl['lbl.sc.fullfillent.type.tooltip']}" /></td> -->
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.amount']}" /></td>
				<td><p:inputText style="text-align: right;"
						value="#{directLOABackingBean.managedBean.scLoa.gstAmt}"
						disabled="#{directLOABackingBean.isGSTRegActive() or isPendingApprovalStatus or directLOABackingBean.managedBean.readOnly}"
						size="35">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur"
							listener="#{directLOABackingBean.calculateOverallAmount(directLOABackingBean.managedBean.scLoa.gstAmt)}"
							update="@this,ContractAmtId"></p:ajax>
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.gst.overall.contract.amount']}" /></td>
				<td><p:inputText style="text-align: right;"
						value="#{directLOABackingBean.managedBean.overallContractAmt}"
						size="35" id="ContractAmtId" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:selectOneRadio id="insWarranty" styleClass="commonLabel"
						value="#{directLOABackingBean.managedBean.scLoa.insWarrantyReq}"
						required="true" label="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}"
						disabled="#{!isEditableStatus}">
						<f:selectItems
							value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
					</p:selectOneRadio> <p:message id="insWarrantyMsg" for="insWarranty" display="icon" />
				</td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:selectOneRadio id="bondReq" styleClass="commonLabel"
						value="#{directLOABackingBean.managedBean.scLoa.bondReq}"
						required="true"
						label="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}"
						disabled="#{directLOABackingBean.isPerformanceBondRequired(directLOABackingBean.managedBean.scLoa.loaAmt) or directLOABackingBean.managedBean.readOnly}">

						<f:selectItems
							value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
						<p:ajax partialSubmit="true" process="@this" update="menuTab" />
					</p:selectOneRadio> <p:message id="bondReqMsg" for="bondReq" display="icon" /><ac:iconTooltip
						value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond.tooltip']}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.appr.req']}" />
					<p:outputLabel value="*" styleClass="mandatory"
						rendered="#{isEditableStatus}" /></td>
				<td><p:selectOneRadio id="approvalReq" styleClass="commonLabel"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.scLoa.approvalReq}"
						required="true" label="#{lbl['lbl.sc.loiloa.loa.appr.req']}">
						<f:selectItems
							value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
					</p:selectOneRadio> <p:message id="approvalReqMsg" for="approvalReq" display="icon" />
				</td>
			</tr>
		</table>
	</p:panel>

		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.cont.type']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:selectOneMenu id="contractType"
						required="true" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"

						label="#{lbl['lbl.sc.loiloa.loa.cont.type']}">

							value="#{directLOABackingBean.contractTypes}"
							var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
							itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
						<p:ajax event="change"
							listener="#{directLOABackingBean.contractTypeChanged()}"
							partialSubmit="true" process="@this"
							update="contractDetailsId" />
					</p:selectOneMenu> <p:message id="contractTypeMsg" for="contractType" display="icon" />

			</tr>

							postUpdateListener="directLOABackingBean.contractAgencyChanged()"
							headerText="#{lbl['lbl.sc.loiloa.loa.agency']}" selectionMode="single"
							readonly="true" size="106"
							saveObject="directLOABackingBean.managedBean.scLoa.contractAgency"
							value="#{directLOABackingBean.managedBean.scLoa.contractAgency.orgName}"
							required="true"
							update="@form" />
					</h:panelGroup>
					<p:inputText id="contractAgency" disabled="true" size="106" style="margin-bottom:5px;"
									 value="#{directLOABackingBean.managedBean.scLoa.contractAgency.orgName}" 
									 rendered="#{!isContractTypeAsMinistry}" />	
					</td>
			</tr>

			<tr>
				<td style="width: 10%;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.cont.admin']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="contractAdmin"
						required="true"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.scLoa.contractAdmin.userId}"
						style="width: 246px;margin-bottom: 5px;"
						label="#{lbl['lbl.sc.loiloa.loa.cont.admin']}">

						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{directLOABackingBean.managedBean.contractAdminList}"
							var="pmuser" itemLabel="#{pmuser.userName}"
							itemValue="#{pmuser.userId}" />
						<p:ajax event="change"
							listener="#{directLOABackingBean.contractAdminChanged()}"
							partialSubmit="true" process="@this" update="@this" />
					</p:selectOneMenu> <p:message id="contractAdminMsg" for="contractAdmin"
						display="icon" /></td>
			</tr>

				<td>

						value="#{lbl[lblContractDuration]}" />
				 <p:outputLabel value="*" styleClass="mandatory"/>

				<td><p:inputText style="text-align: right;" required="true" label="#{lbl[lblContractDuration]}"

						<p:ajax event="blur" update="effdate,expdate"
							listener="#{directLOABackingBean.resetContractDates()}"></p:ajax>
					</p:inputText>  <p:message id="contractDurationMsg" for="contractDuration" display="icon" /></td>
			</tr>
			<ui:param name="lbleffDate"
				value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.eff.date' : 'lbl.sc.loiloa.loa.cont.eff.date'}" />
			<ui:param name="lblexpDate"
				value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.exp.date' : 'lbl.sc.loiloa.loa.cont.exp.date'}" />
			<tr>
				<td><p:outputLabel value="#{lbl[lbleffDate]}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:calendar id="effdate" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						showOn="button" required="true"
						readonlyInput="true"
						value="#{directLOABackingBean.managedBean.scLoa.contractEffDate}"
						mindate="#{DateUtils.getCurrentDateWithoutTime()}"
						label="#{lbl[lbleffDate]}" size="28">
						<p:ajax event="dateSelect" process="@this contractDuration"
							partialSubmit="true"
							listener="#{directLOABackingBean.contractEffDateChanged()}"
							update="expdate" />
					</p:calendar> <p:message id="effdateMsg" for="effdate" display="icon" /></td>
				<td><p:outputLabel value="#{lbl[lblexpDate]}" /></td>
				<td><p:calendar id="expdate" disabled="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						showOn="button" required="true"
						value="#{directLOABackingBean.managedBean.scLoa.contractExpDate}"
						mindate="#{directLOABackingBean.managedBean.scLoa.contractEffDate}"
						label="#{lbl[lblexpDate]}" size="28" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.req.agree']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<table>
						<tr>
							<td><p:selectOneRadio id="agreementReq" styleClass="commonLabel"
									disabled="#{directLOABackingBean.checkAgreementMandatory() or directLOABackingBean.managedBean.readOnly}"
									value="#{directLOABackingBean.managedBean.scLoa.agreementReq}"
									label="#{lbl['lbl.sc.loiloa.loa.req.agree']}">
									<f:selectItems
										value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								</p:selectOneRadio> <p:message id="agreementReqMsg" for="agreementReq"
									display="icon" /></td>
							<td style="margin-top: -3px"><ac:iconTooltip
									value="#{lbl['lbl.sc.loiloa.loa.req.agree.tooltip']}" /></td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>

		<h:outputText value="Reminder 2 :" style="font-weight:bold;"

		<h:outputText styleClass="instruction"
