<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">
	<ac:lovPopup />
	
	<ui:param name="isContractTypeAsMinistry"
		value="#{directLOABackingBean.managedBean.scLoa.contractType.parameterCode == ParameterConst.contractTypeMinistry}" />
	<ui:param name="isContractTypeAsCentral"
		value="#{directLOABackingBean.managedBean.scLoa.contractType.parameterCode == ParameterConst.contractTypeCentral}" />
	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		   <tr>
			    <td><p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" /></td>
				<td colspan="3"><ac:lov id="supplierId" lovId="SM_SUPPLIER" label="#{lbl['lbl.sc.supplier.name']}" 
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						postUpdateListener="directLOABackingBean.supplierListener(directLOABackingBean.managedBean.scLoa.scLoiLoa.smSupplier)"
						headerText="#{lbl['lbl.sc.supp.name']}" selectionMode="single"
						saveObject="directLOABackingBean.managedBean.scLoa.scLoiLoa.smSupplier"
						conditionField="recordStatus^1|smMofAccounts.recordStatus^1" readonly="true" size="106"
						value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.supplierName}"
						update="@form" required="true" /></td>
			</tr>
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.mofNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.register.num']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.gstRegNo eq null ? lbl['lbl.txt.na']:directLOABackingBean.managedBean.scLoa.gstRegNo}"
						disabled="true" /> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.registartion.number.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.effective.date']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.gstEffDate eq null ? lbl['lbl.txt.na']:directLOABackingBean.managedBean.scLoa.gstEffDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lb.sc.gst.effective.date.tooltip']}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.declared.date']}" />
				</td>
				<td colspan="3"><p:inputText size="35"
						value="#{directLOABackingBean.managedBean.scLoa.gstDeclaredDate eq null ? lbl['lbl.txt.na']:directLOABackingBean.managedBean.scLoa.gstDeclaredDate}"
						disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip
						value="#{lbl['lbl.sc.gst.declartive.date.tooltip']}" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td>
								<c:choose>
									<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
										<p:selectOneMenu id="branch"
											value="#{directLOABackingBean.managedBean.selectedSupplierBranchName}"
											style="width: 246px;margin-bottom: 5px;"
											label="#{lbl['lbl.sc.branch']}">
											<f:selectItem itemLabel="HQ" itemValue="#{null}" />
											<f:selectItems
												value="#{directLOABackingBean.managedBean.branchsList}"
												var="smSupplierBranch"
												itemValue="#{smSupplierBranch.branchName}"
												itemLabel="#{smSupplierBranch.branchName}" />
											<p:ajax event="change"
												listener="#{directLOABackingBean.handleBranchDetailsChanged}"
												partialSubmit="true" process="@this"
												update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail" />
										</p:selectOneMenu> 
										<p:message id="branchMsg" for="branch" display="icon" />
									</c:when>
									<c:otherwise>
										<p:inputText size="35"
											value="#{directLOABackingBean.managedBean.scLoa.supplierBranch}"
											disabled="true" />
									</c:otherwise>
								</c:choose>
							</td>
							<td style="margin-top: -3px"><ac:iconTooltip
										value="#{lbl['lbl.sc.branch.tooltip']}" />
							</td>
						</tr>
					</table>
				</td>
			</tr>
			<tr>
				<td rowspan="3" valign="top" width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.address']}" /></td>
				<td rowspan="3">
					<p:inputTextarea id="suppAddr" label="#{lbl['lbl.sc.address']}" 
					onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);"
						cols="36" disabled="true" rows="5" style=" margin-bottom:5px; width: 236px" maxlength="200" 
						value="#{directLOABackingBean.getFullAddress(directLOABackingBean.managedBean.scLoa.scSupplierAddress)}"
						required="true" /></td>

				<td width="160px"><p:outputLabel value="#{lbl['lbl.sc.tel.no']}" />
				</td>
				<td><p:inputText id="suppPhoneNo" size="28" disabled="true" 
								 value="#{directLOABackingBean.managedBean.scLoa.scSupplierAddress.phoneFull}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.fax.no']}" /></td>
				<td><p:inputText id="suppFaxNo" size="28" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.scSupplierAddress.faxFull}" />
				</td>

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" /></td>
				<td><p:inputText id="suppMobNo" size="28" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.scSupplierAddress.contactMobileFull}" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
				</td>
				<td><p:inputText id="suppContact" size="35" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.scSupplierAddress.contactPerson}" />
				</td>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td><p:inputText id="suppEmail" size="28"
						style=" margin-bottom:5px;" disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.scSupplierAddress.contactEmail}" />
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.details.section']}"
		toggleable="true">
		<table width="100%">
			<tr>
				<td><h:outputLabel
						value="#{lbl['lbl.sc.ministry']}" /></td>
				<td colspan="3"><p:inputText disabled="#{!isEditableStatus}"
						readonly="true"
						value="#{directLOABackingBean.managedBean.scQt.ministryOrgProfile.orgName}"
						size="106" maxlength="100" /></td>
			</tr>
			<tr>

				<td><p:outputLabel value="#{lbl['lbl.sc.ptj']}" /></td>
				<td colspan="3"><ac:lov id="ptjProfile" lovId="PM_ORG_PROFILE"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" headerText="#{lbl['lbl.sc.ptj']}"
						selectionMode="single"
						saveObject="directLOABackingBean.managedBean.scQt.pmOrgProfile"
						readonly="true" size="106"
						value="#{directLOABackingBean.managedBean.scQt.pmOrgProfile.orgName}"
						update="@form"
						conditionField="#{directLOABackingBean.constuctConditionFields()}" /></td>
			</tr>

			<h:panelGroup
				rendered="#{isPendingSubmissionStatus}">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.qtn.no']}" /></td>
					<td colspan="3"><ac:lov id="directLoaQT" lovId="DIRECT_LOA_QT"
							disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
							headerText="#{lbl['lbl.sc.quotation.tender']}"
							selectionMode="single"
							saveObject="directLOABackingBean.managedBean.scQt"
							readonly="true" size="35"
							value="#{directLOABackingBean.managedBean.scQt.qtNo}"
							update="@form"
							postUpdateListener="directLOABackingBean.onQTSelected(directLOABackingBean.managedBean.scQt)"
							conditionField="#{directLOABackingBean.constuctQTConditionFields()}" /></td>
				</tr>

				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.loa.title']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td colspan="3"><p:inputTextarea id="title"
							onkeyup="limitTextArea(this,500);"
							onkeydown="limitTextArea(this,500);"
							disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
							label="#{lbl['lbl.sc.loiloa.loa.title']}" required="true"
							size="110"
							value="#{directLOABackingBean.managedBean.scLoa.scQt.qtTitle}"
							cols="110" rows="3" style="margin-bottom:5px;width: 670px;"
							maxlength="500">
							<p:ajax event="blur" process="title" update="@form" />
						</p:inputTextarea>
						<p:message id="titleMsg" for="title" display="icon" /></td>
				</tr>
			</h:panelGroup>
			<tr>
				<td width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.procurement.mode']}" /> 
					<p:outputLabel
						value="*" styleClass="mandatory" />
				</td>
				<td>
					<c:choose>
						<c:when test="#{!isPendingApprovalStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneMenu id="procMode" required="true"
								value="#{directLOABackingBean.managedBean.scLoa.procurementMode.parameterId}"
								style="margin-bottom:5px;width:246px;"
								label="#{lbl['lbl.sc.procurement.mode']}">
								<f:selectItems value="#{directLOABackingBean.getProcurementModeDropdownValues()}" />
								<p:ajax event="change" 
									process="@this" partialSubmit="true" update="qtType"
									listener="#{directLOABackingBean.procurementModeChanged}" />
							</p:selectOneMenu>
							<p:message id="procModeMsg" for="procMode" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="procModeTxt"
								value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.scLoa.procurementMode)}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td width="160px">
					<p:outputLabel value="#{lbl['lbl.sc.qttentype']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<c:choose>
						<c:when test="#{!isPendingApprovalStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneMenu id="qtType" required="true"
								value="#{directLOABackingBean.managedBean.scLoa.qtType.parameterId}"
								style="margin-bottom:5px;width:206px;"
								label="#{lbl['lbl.sc.qttentype']}">
								<f:selectItems value="#{directLOABackingBean.getQTTypesDropdownValues()}" />
								<p:ajax event="change" 
									process="@this" partialSubmit="true" 
									listener="#{directLOABackingBean.qtTypeChanged}" />
							</p:selectOneMenu>
							<p:message id="qtTypeMsg" for="qtType" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="qtTypeTxt"
								value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.scLoa.qtType)}"
								size="28" disabled="true" />
						</c:otherwise>
					</c:choose>
					
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurment.type.category']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{!isPendingApprovalStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneMenu id="procTypeBoCategory" required="true"
								value="#{directLOABackingBean.managedBean.scLoa.procurementTypeCatId.parameterId}"
								style="margin-bottom:5px;width:246px;"
								label="#{lbl['lbl.sc.procurment.type.category']}">
								<f:selectItems
									value="#{directLOABackingBean.getDropdownValues(ParameterTypeConst.procurementTypeCategory)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
							</p:selectOneMenu>
							<p:message id="procTypeBoCategoryMsg" for="procTypeBoCategory"
								display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="procTypeCatTxt"
								value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.scLoa.procurementTypeCatId)}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
					
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.qt.fileno']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
				     <p:inputText disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						required="true" id="fileNoId"
						value="#{directLOABackingBean.managedBean.scLoa.scQt.fileNo}"
						label="#{lbl['lbl.sc.qt.fileno']}" size="28" >
						<p:ajax event="blur" process="fileNoId" update="fileNoId"/>
						</p:inputText>
						 <p:spacer width="1px" />
						
					<p:inputText required="true"
						id="fileExtNo" styleClass="ppNumericAlign"
						value="#{directLOABackingBean.managedBean.scLoa.fileExtNo}"
						size="1" label="#{lbl['lbl.sc.loiloa.file.extension.no']}"
						maxlength="3" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" >
						<p:ajax event="blur" process="fileExtNo" update="fileExtNo"/>
						</p:inputText>
						 <p:message
						id="fileExtNoMsg" for="fileExtNo" display="icon" /></td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.res.due.date']}" /></td>
				<td colspan="3"><p:inputText
						value="#{directLOABackingBean.managedBean.scLoa.ackDueDate}"
						size="15" disabled="true">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <p:spacer width="8px" /> <p:inputText styleClass="ppNumericAlign"
						disabled="true"
						value="#{!empty directLOABackingBean.managedBean.scLoa.ackDueDate ? DateUtils.getDaysDifference(DateUtils.getCurrentDateWithoutTime(), directLOABackingBean.managedBean.scLoa.ackDueDate) : ''}"
						size="8" /> #{lbl['lbl.sc.days']}</td>
			</tr>
			<tr>
				<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.gov.sign.date']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td>
					<p:calendar id="govSignDate"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
						showOn="button"
						value="#{directLOABackingBean.managedBean.scLoa.govtSignDate}"
						mindate="#{DateUtils.getCurrentDateWithoutTime()}"
						required="true"
						readonlyInput="true"
						label="#{lbl['lbl.sc.loiloa.loa.gov.sign.date']}"
						size="31"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">
						<p:ajax event="dateSelect" />
					</p:calendar>
					<p:message id="govSignDateMsg" for="govSignDate" display="icon" />
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.spec.est.price']}" />
				</td>
				<td colspan="3"><p:inputText style="text-align: right;"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.scLoa.scQt.estimatedAmount}"
						size="35">
						<p:ajax event="blur" process="@this" update="@this"></p:ajax>
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>

			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.off.price']}">
					</p:outputLabel> <p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:inputText style="text-align: right;" required="true" id="loaAmtId"
						value="#{directLOABackingBean.managedBean.scLoa.loaAmt}" size="35"
						label="#{lbl['lbl.sc.loiloa.loa.off.price']}"
						disabled="#{isPendingApprovalStatus or directLOABackingBean.managedBean.readOnly}">
						<p:ajax event="blur"
							listener="#{directLOABackingBean.setOverallCtAmount(directLOABackingBean.managedBean.scLoa.loaAmt)}"
							update="@form"></p:ajax>
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>  <p:message id="loaAmtIdMsg" for="loaAmtId" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.fullfillent.type']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly and !isContractTypeAsCentral}">
							<p:selectOneMenu id="fulfilId"
								required="true"
								label="#{lbl['lbl.sc.fullfillent.type']}"
								value="#{directLOABackingBean.managedBean.scLoa.scQt.fulfilmentType.parameterId}"
								style="width: 246px;margin-bottom: 5px;">
		
								<f:selectItems
									value="#{directLOABackingBean.getDropdownValues(ParameterTypeConst.fulfilmentType)}" />
								<p:ajax event="change" process="@this" partialSubmit="true"
									update="@this, menuItems,agreementReqPG"
									listener="#{directLOABackingBean.fulfilmentChange}"></p:ajax>
							</p:selectOneMenu>
							<p:message id="fulfilType" for="fulfilId" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="fulfilTypeTxt"
								value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.scLoa.scQt.fulfilmentType)}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.amount']}" /></td>
				<td colspan="3"><p:inputText style="text-align: right;"
						value="#{directLOABackingBean.managedBean.scLoa.gstAmt}"
						disabled="#{directLOABackingBean.isGSTRegActive() or isPendingApprovalStatus or directLOABackingBean.managedBean.readOnly}"
						size="35">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur"
							listener="#{directLOABackingBean.calculateOverallAmount(directLOABackingBean.managedBean.scLoa.gstAmt)}"
							update="@this,ContractAmtId"></p:ajax>
					</p:inputText></td>
			</tr>

			<tr>
				<td></td>
				<td colspan="3">
					<h:outputText styleClass="instruction"
						value=" #{lbl['lbl.sc.gst.remainder.one.instruction']}"
						escape="false" /> <br />
					<h:outputText styleClass="instruction"
						value="#{lbl['lbl.sc.gst.remainder.two.instruction']}"
						escape="false"
						rendered="#{directLOABackingBean.managedBean.renderRemainder}" />
				</td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.gst.overall.contract.amount']}" /></td>
				<td colspan="3"><p:inputText style="text-align: right;"
						value="#{directLOABackingBean.managedBean.overallContractAmt}"
						size="35" id="ContractAmtId" disabled="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td>
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneRadio id="insWarranty" styleClass="commonLabel"
								value="#{directLOABackingBean.managedBean.scLoa.insWarrantyReq}"
								required="true" label="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}">
								<f:selectItems
									value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
							</p:selectOneRadio>
							<p:message id="insWarrantyMsg" for="insWarranty" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="insWarrantyTxt"
								value="#{directLOABackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(directLOABackingBean.managedBean.scLoa.insWarrantyReq))}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td>
					<table>
						<tr>
							<td>
								<c:choose>
									<c:when test="#{!directLOABackingBean.isPerformanceBondRequired(directLOABackingBean.managedBean.scLoa.loaAmt, null) and !directLOABackingBean.managedBean.readOnly}">
										<p:selectOneRadio id="bondReq" styleClass="commonLabel"
											value="#{directLOABackingBean.managedBean.scLoa.bondReq}"
											required="true"
											label="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}">
					
											<f:selectItems
												value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
											<p:ajax partialSubmit="true" process="@this" update="menuTab" />
										</p:selectOneRadio>
										<p:message id="bondReqMsg" for="bondReq" display="icon" />
									</c:when>
									<c:otherwise>
										<p:inputText id="bondReqTxt"
											value="#{directLOABackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(directLOABackingBean.managedBean.scLoa.bondReq))}"
											size="28" disabled="true" />
									</c:otherwise>
								</c:choose>
							</td>
							<td style="margin-top: -3px">
								<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond.tooltip']}" />
							</td>
						</tr>
					</table>
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.appr.req']}" />
					<p:outputLabel value="*" styleClass="mandatory"
						rendered="#{isEditableStatus}" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneRadio id="approvalReq" styleClass="commonLabel"
								value="#{directLOABackingBean.managedBean.scLoa.approvalReq}"
								required="true" label="#{lbl['lbl.sc.loiloa.loa.appr.req']}">
								<f:selectItems
									value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
							</p:selectOneRadio>
							<p:message id="approvalReqMsg" for="approvalReq" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="approvalReqTxt"
								value="#{directLOABackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(directLOABackingBean.managedBean.scLoa.approvalReq))}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contract.details']}"  id="contractDetailsId"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.cont.type']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneMenu id="contractType"
								required="true" 
								value="#{directLOABackingBean.managedBean.scLoa.contractType.parameterId}"
								style="width: 246px;margin-bottom: 5px;"
								label="#{lbl['lbl.sc.loiloa.loa.cont.type']}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
								<f:selectItems
									value="#{directLOABackingBean.getContractTypes(ParameterConst.procurementModeDirectNego)}"
									var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
									itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
								<p:ajax event="change"
									listener="#{directLOABackingBean.contractTypeChanged()}"
									partialSubmit="true" process="@this"
									update="@form" />
							</p:selectOneMenu>
							<p:message id="contractTypeMsg" for="contractType" display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="contractTypeTxt"
								value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.scLoa.contractType)}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.agency']}" /></td>
				<td colspan="3">
					<p:inputText id="contractAgency" disabled="true" size="106"
						value="#{directLOABackingBean.managedBean.scLoa.contractAgency.orgName}" />	
				</td>
			</tr>

			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.cont.admin']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<c:choose>
						<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneMenu id="contractAdmin"
								required="true"
								value="#{directLOABackingBean.managedBean.scLoa.contractAdmin.userId}"
								style="width: 246px;margin-bottom: 5px;"
								label="#{lbl['lbl.sc.loiloa.loa.cont.admin']}">
		
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems
									value="#{directLOABackingBean.managedBean.contractAdminList}"
									var="pmuser" itemLabel="#{pmuser.userName}"
									itemValue="#{pmuser.userId}" />
								<p:ajax event="change"
									listener="#{directLOABackingBean.contractAdminChanged()}"
									partialSubmit="true" process="@this" update="@this" />
							</p:selectOneMenu> 
							<p:message id="contractAdminMsg" for="contractAdmin"
								display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="contractAdminTxt"
								value="#{directLOABackingBean.managedBean.scLoa.contractAdmin.userName}"
								size="35" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td>
				<ui:param name="lblContractDuration"
				    value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.period' : 'lbl.sc.loiloa.loa.cont.period'}" />
				<p:outputLabel
						value="#{lbl[lblContractDuration]}" />
				 <p:outputLabel value="*" styleClass="mandatory"/>
				</td>
				<td colspan="3"><p:inputText style="text-align: right;" required="true" label="#{lbl[lblContractDuration]}"
						id="contractDuration" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.scLoa.contractDuration}"
						size="35">
						<p:ajax event="blur" update="effdate,expdate"
							listener="#{directLOABackingBean.resetContractDates()}"></p:ajax>
					</p:inputText>  <p:message id="contractDurationMsg" for="contractDuration" display="icon" /></td>
			</tr>
			<ui:param name="lbleffDate"
				value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.eff.date' : 'lbl.sc.loiloa.loa.cont.eff.date'}" />
			<ui:param name="lblexpDate"
				value="#{directLOABackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.exp.date' : 'lbl.sc.loiloa.loa.cont.exp.date'}" />
			<tr>
				<td width="21%"><p:outputLabel value="#{lbl[lbleffDate]}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:calendar id="effdate" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						showOn="button" required="true"
						readonlyInput="true"
						value="#{directLOABackingBean.managedBean.scLoa.contractEffDate}"
						mindate="#{DateUtils.getCurrentDateWithoutTime()}"
						label="#{lbl[lbleffDate]}" size="28">
						<p:ajax event="dateSelect" process="@this contractDuration"
							partialSubmit="true"
							listener="#{directLOABackingBean.contractEffDateChanged()}"
							update="expdate" />
					</p:calendar> <p:message id="effdateMsg" for="effdate" display="icon" /></td>
				<td width="160px"><p:outputLabel value="#{lbl[lblexpDate]}" /></td>
				<td><p:calendar id="expdate" disabled="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						showOn="button" required="true"
						value="#{directLOABackingBean.managedBean.scLoa.contractExpDate}"
						mindate="#{directLOABackingBean.managedBean.scLoa.contractEffDate}"
						label="#{lbl[lblexpDate]}" size="28" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.req.agree']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td colspan="3">
					<table>
						<tr>
							<td>
								<h:panelGroup id="agreementReqPG">
								<c:choose>
									<c:when test="#{!directLOABackingBean.checkAgreementMandatory() and !directLOABackingBean.managedBean.readOnly}">
										<p:selectOneRadio id="agreementReq" styleClass="commonLabel"
											value="#{directLOABackingBean.managedBean.scLoa.agreementReq}"
											label="#{lbl['lbl.sc.loiloa.loa.req.agree']}">
											<f:selectItems
												value="#{directLOABackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
										</p:selectOneRadio> 
										<p:message id="agreementReqMsg" for="agreementReq"
											display="icon" />
									</c:when>
									<c:otherwise>
										<p:inputText id="agreementReqTxt"
											value="#{directLOABackingBean.getParameterDesc(ParameterTypeConst.yesNoFlag, fn:toUpperCase(directLOABackingBean.managedBean.scLoa.agreementReq))}"
											size="35" disabled="true" />
									</c:otherwise>
								</c:choose>
								</h:panelGroup>
							</td>
							<td style="margin-top: -3px">
								<ac:iconTooltip
									value="#{lbl['lbl.sc.loiloa.loa.req.agree.tooltip']}" />
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
