 <!-- * @author vinod #29468 -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:dialog widgetVar="cloneLoaSpec" modal="true" width="950"
		height="600" position="top"
		header="#{lbl['lbl.sc.dl.spec.clone.specification']}">
		<p:messages id="specLoaCloneTemplate" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false"
			severity="error, info" />

		<p:panel id="loaCloneSpec" header="#{lbl['lbl.sc.search']}"
			toggleable="true">

			<table>
				<tr>
					<td style="width: 180px;"><p:outputLabel
							value="#{lbl['lbl.sc.dl.standard.template']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneRadio 
							required="#{directLOABackingBean.managedBean.required}"
							label="#{lbl['lbl.sc.standard.template']}"
							id="loaCloneSpecStandardTemplate"
							value="#{directLOABackingBean.managedBean.standardTemplate}">
							<f:selectItems
								value="#{directLOABackingBean.getCloneTemplateRadioBtn()}" />
							<p:ajax event="change"
								listener="#{directLOABackingBean.templateChange}"
								update="cloneupdate,createList"></p:ajax>
						</p:selectOneRadio> <p:message id="cloneLoaTemplate"
							for="loaCloneSpecStandardTemplate" display="icon">
						</p:message></td>
							<td style="padding-left: 0px;"><p:message id="specMsg" for="loaCloneSpecStandardTemplate" display="icon" />
								<ac:iconTooltip value="#{lbl['lbl.sc.loa.template.tooltip']}" /></td>
				</tr>
			</table>

			<h:panelGroup id="cloneupdate">
				
				<ui:fragment>
					<table>
					
						<tr>
							<td><h:outputLabel
									value="#{lbl['lbl.sc.procurement.category']}"></h:outputLabel></td>
							<td><p:selectOneMenu disabled="true"
									value="#{directLOABackingBean.managedBean.searchProcurementId}"
									style="width:210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{directLOABackingBean.getDropdownValues(ParameterTypeConst.procurementCategory)}" />
								</p:selectOneMenu></td>
						</tr> 
						<tr>
							<td style="width: 180px;"><p:outputLabel
									value="#{lbl['lbl.sc.item.type']}"></p:outputLabel></td>
							<td><p:inputText style="width:210px; margin-bottom:5px;" maxlength="15" disabled="true"
									value="#{directLOABackingBean.managedBean.searchItemTypeName}" /></td>
						</tr>

						<tr>
							<td style="width: 180px;"><p:outputLabel
									value="#{lbl['lbl.sc.category.code']}"></p:outputLabel></td>
							<td colspan="3">
								<p:tree id="treeCatCode" style="height: 150px;width: 670px;"
								value="#{directLOABackingBean.managedBean.rootCategoryTree}"  
								var="catgCode"  
								selectionMode="checkbox">
								<p:ajax event="select" listener="#{directLOABackingBean.selectCategoryTreeNode}" />
								<p:ajax event="unselect" listener="#{directLOABackingBean.unSelectCategoryTreeNode}" />
								<p:treeNode type="catCode">
									<h:outputText value="#{catgCode}"/>
								</p:treeNode>
								<p:treeNode type="catDes1">
									<h:outputText value="#{catgCode}"/>
								</p:treeNode>
								<p:treeNode type="catDes2">
									<h:outputText value="#{catgCode}"/>
								</p:treeNode>
								<p:treeNode type="catDes3">
									<h:outputText value="#{catgCode}"/>
								</p:treeNode>
								</p:tree>
        					</td>
						</tr>

						<c:if test="#{directLOABackingBean.managedBean.standardTemplate eq ParameterConst.tplDocProcessTypeSourcing}">
						<tr>
							<td valign="top"><h:outputLabel
									value="#{lbl['lbl.tpl.spec.title']}"></h:outputLabel></td>
							<td colspan="3"><p:inputText onkeypress="if (event.keyCode == 13) { loaCloneTemplateSpecSearch.jq.click(); return false; }"
									style="width:670px; margin-bottom:5px;" maxlength="100"
									value="#{directLOABackingBean.managedBean.specName}" /></td>
						</tr>
						</c:if>

						<tr>
							<td valign="top"><p:outputLabel
									value="#{lbl['lbl.sc.title']}" /></td>
							<td colspan="3"><p:inputText onkeypress="if (event.keyCode == 13) { loaCloneTemplateSpecSearch.jq.click(); return false; }"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.qtTitle}"
									style="width:670px;" maxlength="100" /></td>
						</tr>
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.sc.qtn.no']}"></h:outputLabel></td>
							<td><p:inputText style="width:210px; margin-bottom:5px;"
									maxlength="21" onkeypress="if (event.keyCode == 13) { loaCloneTemplateSpecSearch.jq.click(); return false; }"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.qtNo}" /></td>

							<td><h:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /></td>
							<td><p:selectOneMenu id="procurementid"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.procurementMode}"
									style="width:210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{qTDetailBB.getProcurementModeDropdownValues()}" />
								</p:selectOneMenu></td>

						</tr>
						
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.sc.loa.no']}"></h:outputLabel></td>
							<td><p:inputText style="width:210px; margin-bottom:5px;"
									maxlength="21" onkeypress="if (event.keyCode == 13) { loaCloneTemplateSpecSearch.jq.click(); return false; }"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.loaNo}" /></td>
						</tr>
						
						<tr>
							<td><h:outputLabel value="#{lbl['lbl.sc.created.date.from']}" /></td>
							<td><p:calendar onkeypress="if (event.keyCode == 13) { loaCloneTemplateSpecSearch.jq.click(); return false; }"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate}"
									id="crdateFrom" showOn="button" readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<p:ajax event="dateSelect" update="crdateTo" />
								</p:calendar></td>
							<td><h:outputLabel value="#{lbl['lbl.sc.created.date.to']}" /></td>
							<td><p:calendar id="crdateTo" showOn="button" onkeypress="if (event.keyCode == 13) { loaCloneTemplateSpecSearch.jq.click(); return false; }"
									label="#{lbl['lbl.sc.created.date.to']}"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.toCreatedDate}"
									mindate="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate}"
									readonlyInput="true"
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<f:attribute name="startDate"
										value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.fromCreatedDate}" />
								</p:calendar></td>
						</tr>

						<tr>
							<td><h:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
							<td><p:selectOneMenu rendered="#{directLOABackingBean.managedBean.standardTemplate eq ParameterConst.tplDocProcessTypeSourcing}"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.qtStatus}"
									style="width: 210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{directLOABackingBean.getStatusDropdownValues(ParameterConst.committeeTypeSpecificationCommittee, ParameterConst.doctypeQuotation)}" />
								</p:selectOneMenu>
								<p:selectOneMenu rendered="#{directLOABackingBean.managedBean.standardTemplate ne ParameterConst.tplDocProcessTypeSourcing}"
									value="#{directLOABackingBean.managedBean.qtnTendertemplateSearchBean.qtStatus}"
									style="width: 210px;margin-bottom: 5px;">
									<f:selectItems
										value="#{directLOABackingBean.getStatusDropdownValues(ParameterConst.committeeTypeSpecificationCommittee, ParameterConst.doctypeLetterOfAward)}" />
								</p:selectOneMenu></td>
						</tr>

					</table>
				</ui:fragment>
			</h:panelGroup>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.btn.search']}"
					widgetVar="loaCloneTemplateSpecSearch"
					styleClass="BtnSpacing"
					partialSubmit="true"
					action="#{directLOABackingBean.searchTemplateSpecAction}"
					process="@this loaCloneSpec"
					update="createList" />
				<p:commandButton value="#{lbl['lbl.btn.reset']}" resetValues="true"
					styleClass="BtnSpacing" partialSubmit="true"
					update="loaCloneSpec" process="@this"
					action="#{directLOABackingBean.resetTemplate}" />
			</div>

		</p:panel>

		<p:panel id="listUpdate" header="#{lbl['lbl.sc.tpl.list']}"
			toggleable="true">

			<h:panelGrid style="width:100%;">
				<p:dataTable id="createList" var="tplSpecMaster" rows="10"
				    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{directLOABackingBean.searchCloneTempletSpec}"
					rowKey="#{tplSpecMaster.specMasterId}" rowIndexVar="index"
					lazy="true">
					<!--   <p:column selectionMode="multiple"  style="text-align:center;"/> -->
					<ac:paginator for="createList"></ac:paginator>

					<p:column headerText="#{lbl['lbl.sc.qtn.no']}"
						style="width:10%;white-space: normal;">
						<h:outputText value="#{tplSpecMaster.scQtDoc.scQt.qtNo}" />

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.title']}"
						style="width:15%;white-space: normal;">
						<h:outputText value="#{tplSpecMaster.scQtDoc.scQt.qtTitle}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.tpl.spec.title']}"
						style="width:20%;white-space: normal;"
						rendered="#{directLOABackingBean.managedBean.standardTemplate eq ParameterConst.tplDocProcessTypeSourcing}">
						<h:outputText value="#{tplSpecMaster.specName}"></h:outputText>
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.procurement.category']}"
						style="width:15%;white-space: normal;">
						<h:outputText
							value="#{directLOABackingBean.getParameterDesc(tplSpecMaster.procurementCategory)}" />
					</p:column>
					
					
					<p:column headerText="#{lbl['lbl.sc.item.type']}"
						style="width:10%;">
						<h:outputText
							value="#{directLOABackingBean.getParameterDesc(tplSpecMaster.itemTypeCode)}" />
					</p:column>
	
					<p:column headerText="#{lbl['lbl.sc.action']}"
						style="width:10%;text-align: center;">
								<p:commandButton value="#{lbl['lbl.btn.clone']}" process="@all"
								update="@([id$=productAndServiceId])"
								action="#{directLOABackingBean.createTemplateSpec(tplSpecMaster,'SC')}"></p:commandButton>
							
					</p:column>

				</p:dataTable>
			</h:panelGrid>


		</p:panel>
		<p:ajax event="close"
			listener="#{directLOABackingBean.closeListener}" />
	</p:dialog>
</ui:composition>
