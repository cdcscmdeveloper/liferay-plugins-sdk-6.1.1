<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.payment.details']}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="18%"><h:outputLabel
						value="#{lbl['lbl.sc.account.no']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td width="82%"><p:inputText
						value="#{directLOABackingBean.managedBean.scLoa.bankAccNo}"
						disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.bank.name']}" /></td>
				<td><p:inputText id="bankName"
						value="#{directLOABackingBean.managedBean.scLoa.bankName}"
						disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td><h:outputLabel value="#{lbl['lbl.sc.bank.branch']}" /></td>
				<td><p:inputText id="bankBranch"
						value="#{directLOABackingBean.managedBean.scLoa.bankBranch}"
						disabled="true" size="50" /></td>
			</tr>
			<tr>
				<td valign="top"><h:outputLabel
						value="#{lbl['lbl.sc.bank.address']}" /></td>
				<td><p:inputTextarea id="bankAddress" cols="50" rows="5"
						value="#{directLOABackingBean.getFullAddress(directLOABackingBean.managedBean.scLoa.bankAddress)}"
						style=" margin-bottom:5px; width: 325px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
</ui:composition>
