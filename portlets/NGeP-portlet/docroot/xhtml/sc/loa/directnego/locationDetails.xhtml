

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="Location Details" toggleable="true">

		<h:panelGroup>
			<h:panelGrid width="100%">
				<p:dataTable id="locationDataTable" rows="10"
				    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{directLOABackingBean.managedBean.locationTreeNodes}"
					var="locationTree" style="width:100%" rowIndexVar="index"
					rowKey="#{locationTree}">

					<ac:paginator for="locationDataTable" />

					<p:column style="width:90%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.location']}" />
						</f:facet>
						<p:tree value="#{locationTree}" var="location"
							selectionMode="checkbox">
							<p:ajax event="select"
								listener="#{directLOABackingBean.selectLocationTreeNode}" />
							<p:ajax event="unselect"
								listener="#{directLOABackingBean.unSelectLocationTreeNode}" />
							<p:treeNode type="state">
								<h:outputText value="#{location.pmState.stateName}" />
							</p:treeNode>
							<p:treeNode type="division">
								<h:outputText value="#{location.pmDivision.divisionName}" />
							</p:treeNode>
							<p:treeNode type="district">
								<h:outputText value="#{location.pmDistrict.districtName}" />
							</p:treeNode>

						</p:tree>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.action']}" style="width:10%;">
						<p:commandLink
							
							actionListener="#{directLOABackingBean.editSupplierLocations(locationTree,index)}"
							process="@this" update="@([id$=zonePopupPanel])"
							oncomplete="ZoneLocation.show();">
							<h:graphicImage value="/css/images/design/edit.png" />
						</p:commandLink>
					</p:column>

				</p:dataTable>
			</h:panelGrid>
			<div align="right">

				<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
					update="@([id$=zonePopupPanel])"
					actionListener="#{directLOABackingBean.showSupplierLocationPopup}" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					process="@this,locationDataTable" partialSubmit="true"
					oncomplete="supplierNonZoneDeletePopUp.show();"
					update="@([id$=#{supplierNonZoneDeleteId}])" />
			</div>
			<ui:param name="supplierNonZoneDeleteId"
				value="supplierNonZoneDeleteId"></ui:param>
			<ac:confirmationPopup id="#{supplierNonZoneDeleteId}"
				widget="supplierNonZoneDeletePopUp"
				okAction="directLOABackingBean.deleteSupplierQualificationTreeNode"
				width="400" height="200"
				title="#{lbl['lbl.sc.location.list.paidup.capital']}"
				content="#{lbl['lbl.sc.dialog.confirm.supplier.locations']}"
				update="@([id$=locationDataTable])" />

		</h:panelGroup>




		<p:dialog header="#{lbl['lbl.sc.add.location']}"
			widgetVar="ZoneLocation" modal="true" width="490" position="top"
			height="410">
			<h:panelGroup id="zonePopupPanel">
				<table border="0">
					<tr>
						<td>#{lbl['lbl.sc.location']}</td>
					</tr>
					<TR>
						<TD width="80%">
							<div style="height: 300px; overflow-y: scroll;">
								<p:tree id="treeZoneLocationPopup"
									value="#{directLOABackingBean.managedBean.rootLocationTree}"
									var="location"
									selection="#{directLOABackingBean.managedBean.selectedNodes}"
									selectionMode="checkbox">
									<p:treeNode type="state">
										<h:outputText value="#{location.pmState.stateName}" />
									</p:treeNode>
									<p:treeNode type="division">
										<h:outputText value="#{location.pmDivision.divisionName}" />
									</p:treeNode>
									<p:treeNode type="district">
										<h:outputText value="#{location.pmDistrict.districtName}" />
									</p:treeNode>
									<p:treeNode type="city">
										<h:outputText value="#{pmCity.cityName}" />
									</p:treeNode>
								</p:tree>
							</div>
						</TD>
					</TR>
					<tr>
						<td><p:spacer height="1" /></td>
					</tr>
					<tr>
						<td>
							<div class="ppRightBtn">


								<p:commandButton value="#{lbl['lbl.btn.ok']}"
									onclick="ZoneLocation.hide();" process="@all"
									update="@this, locationDataTable, zonePopupPanel"
									action="#{directLOABackingBean.updateSupplierLocations}">
								</p:commandButton>
								<p:commandButton value="#{lbl['lbl.btn.cancel']}"
									onclick="ZoneLocation.hide();" />
							</div>
						</td>
					</tr>
				</table>
			</h:panelGroup>
		</p:dialog>


	</p:panel>

</ui:composition>
