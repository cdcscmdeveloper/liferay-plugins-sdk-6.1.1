<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel id="loaSignerId" toggleable="true">

		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.loiloa.loa.contract.signer.dtl']}" />
			<ac:iconTooltip
				value="#{lbl['lbl.sc.loiloa.loa.contract.signer.dtl.tooltip']}" />
		</f:facet>

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="23%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.contract.signer']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td>
					<c:choose>
						<c:when test="#{!isPendingApprovalStatus and !directLOABackingBean.managedBean.readOnly}">
							<p:selectOneMenu id="contractSigner" disabled="#{isPendingApprovalStatus or directLOABackingBean.managedBean.readOnly}"
								value="#{directLOABackingBean.managedBean.scLoa.contractSigner.userId}"
								style="width: 276px;margin-bottom: 5px; " required="true"
								label="#{lbl['lbl.sc.loiloa.loa.contract.signer']}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}" />
								<f:selectItems
									value="#{directLOABackingBean.managedBean.contractSignerList}"
									var="contractUser" itemLabel="#{contractUser.userName}"
									itemValue="#{contractUser.userId}" />
		
								<p:ajax event="change"
									listener="#{directLOABackingBean.contractSignerEvent}"
									partialSubmit="true" process="@this" update="@this loaSignerId" />
							</p:selectOneMenu>
							<p:message id="contractSignerMsg" for="contractSigner"
								display="icon" />
						</c:when>
						<c:otherwise>
							<p:inputText id="contractSignerTxt"
								value="#{directLOABackingBean.managedBean.scLoa.contractSigner.userName}"
								size="40" disabled="true" />
						</c:otherwise>
					</c:choose>
				</td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.signer.desig']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:inputText id="loaSignerDesigId" disabled="#{directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.scLoa.loaSignerDesig}"
						label="#{lbl['lbl.sc.loiloa.loa.signer.desig']}" required="true"
						size="40">
					</p:inputText> <p:message id="loaSignerDesigIdIdMsg" for="loaSignerDesigId"
						display="icon" /></td>
			</tr>

		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.request.for.approval']}"
		rendered="#{directLOABackingBean.managedBean.scLoa.approvalReq}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="23%"><p:outputLabel
						value="#{lbl['lbl.sc.approver']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td><p:selectOneMenu id="loaApprover"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.approverUser.userId}"
						required="#{directLOABackingBean.managedBean.scLoa.approvalReq}"
						label="#{lbl['lbl.sc.approver']}"
						style="width: 276px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{directLOABackingBean.managedBean.approverList}"
							var="pmUser" itemLabel="#{pmUser.userName}"
							itemValue="#{pmUser.userId}" />
						<p:ajax event="change"
							listener="#{directLOABackingBean.approverChanged()}"
							partialSubmit="true" process="@this" update="@this" />
					</p:selectOneMenu> <p:message id="loaApproverMsg" for="loaApprover" display="icon" />
				</td>
			</tr>
		</table>
	</p:panel>
	
	<ac:scRemarkAndAttachment
		remarkList="#{directLOABackingBean.managedBean.scLoa.scLoaRemarks}"
		showAttachment="false"
		readonly="#{directLOABackingBean.managedBean.readOnly}" />

	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable id="apprHistTbl" var="scLoaApproval"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{directLOABackingBean.managedBean.scLoaApproval}">

			<ac:paginator for="apprHistTbl" />

			<p:column headerText="#{lbl['lbl.sc.approved.by']}" style="width:40%">
				#{scLoaApproval.approver.userName}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:35%">
				#{directLOABackingBean.getApprovalActionDisplayName(scLoaApproval.approverAction)}
		
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.date']}" style="width:25%">
				<h:outputText value="#{scLoaApproval.approverActionDate}">
					<f:convertDateTime
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>

</ui:composition>
