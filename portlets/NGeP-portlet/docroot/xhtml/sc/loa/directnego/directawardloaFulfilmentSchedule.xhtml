<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:include src="../shared/loaInstructionHeader.xhtml" />
	
	<h:panelGroup id="frequency">
	<!-- Enhancement #25659 remove the Radio button options selection between Frequency Payment/progressive Payment  -->
	<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{directLOABackingBean.managedBean.scQt.fulfilmentType.parameterCode eq (ParameterConst.fulfilmentTypeScheduled)}">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction']}"
					escape="false" />
					<br/>
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction.delete']}"
					escape="false" />
			
				<p:dataTable id="frequencySchedule" var="frequency" rows="10"
					rowIndexVar="index" widgetVar="freqScheduleWidget"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{directLOABackingBean.managedBean.scLoa.scQtSchedules}">
					<ac:paginator for="frequencySchedule" />
					 <p:column style="width:2%;">
						<f:facet name="header">
							<p:selectBooleanCheckbox
								value="#{directLOABackingBean.managedBean.selectAll}">
								<p:ajax partialSubmit="true" process="@this"
									update=":form:frequencySchedule,:form:deleteButtonId"
									listener="#{directLOABackingBean.selectAllSchedule}" />
							</p:selectBooleanCheckbox>
						</f:facet>

						<p:selectBooleanCheckbox
							value="#{frequency.selected}"
							styleClass="myCustomChekBox">
							<p:ajax event="change"
								update=":form:frequencySchedule,:form:deleteButtonId"
								listener="#{directLOABackingBean.selectOneScheCheckboxSelect}"></p:ajax>
						</p:selectBooleanCheckbox>
					</p:column> 

					<p:column style="width:8%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.schedule.no']}" />
						</f:facet>
						<p:inputText value="#{frequency.scheduleNo}" required="true" styleClass="ppRightBtn"
							maxlength="3" label="#{lbl['lbl.sc.spec.schedule.no']}" size="5"
							id="scheduleNum" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">
							<p:ajax partialSubmit="true" update=":form:frequencySchedule, :form:addButtonId" process="@form"  />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
						<p:message id="freqScheduledid" for="scheduleNum" display="icon"></p:message>
					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:100px;" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
							value="#{frequency.startMonth}">

							<f:selectItems value="#{directLOABackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    partialSubmit="true"
								listener="#{directLOABackingBean.calculateScheduleMonths(frequency,'true')}"></p:ajax>
						</p:selectOneMenu>
						<!-- <p:calendar value="#{frequency.fromDate}" showOn="button"
						pattern="MM/yyyy"></p:calendar> -->
					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.year']}" />
						</f:facet>
						<p:selectOneMenu value="#{frequency.startYear}" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
							style="width:100px;">
							<f:selectItems value="#{directLOABackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    partialSubmit="true"
								listener="#{directLOABackingBean.calculateScheduleMonths(frequency,'true')}"></p:ajax>
						</p:selectOneMenu>


					</p:column>

					<p:column style="width:15%">
					<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:100px;" id="scheduleendMonth" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
							value="#{frequency.endMonth}">

							<f:selectItems value="#{directLOABackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{directLOABackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:10%">
					<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.year']}" />
						</f:facet>
						<p:selectOneMenu value="#{frequency.endYear}"  disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}" style="width:100px;">
							<f:selectItems value="#{directLOABackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update=":form:frequencySchedule, :form:addButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{directLOABackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.total.months']}"
						style="width:10%;text-align: right;white-space: normal;">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}"></h:outputText>
						</h:panelGroup>
					</p:column>

					<p:column style="width:25%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.schedule.type']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.schedule.type.tooltip']}" />
						</f:facet>

						<h:outputText value="#{directLOABackingBean.getParameterDesc(frequency.scheduleType)}"/>
					</p:column>

				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton id="addButtonId" value="#{lbl['lbl.btn.add']}"
					disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						partialSubmit="true" process="@this" update="frequencySchedule"
						action="#{directLOABackingBean.addScheduleDetails}"
						oncomplete="freqScheduleWidget.paginator.endLink.click();">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton id="deleteButtonId"
						value="#{lbl['lbl.ct.delete']}" partialSubmit="true"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						process="@this" onsuccess="freqScheduleObj.show()">
					</p:commandButton>
				</div>
				<p:confirmDialog id="freqScheduleObj" widgetVar="freqScheduleObj"
					message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
					closable="true" appendToBody="true"
					header="#{lbl['lbl.msg.confirm.delete.header']}">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
							partialSubmit="true" oncomplete="freqScheduleObj.hide();"
							update=":form:frequencySchedule,:form:deleteButtonId"
							action="#{directLOABackingBean.deleteFreqScheduleDetails}">
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.no']}"
							onclick="freqScheduleObj.hide();" type="button" />
					</div>
				</p:confirmDialog>
				<h:outputText styleClass="instruction"
							value="#{lbl['lbl.sc.spec.freq.schedule.loa.instruction']}"
							escape="false" />
			</p:panel>
		</h:panelGroup>

	</h:panelGroup>


	<h:panelGroup id="progressive">
		<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
			toggleable="true"
			rendered="#{directLOABackingBean.managedBean.scQt.scheduleType eq ParameterConst.periodicScheduleTypeProgressivePayment}">

			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.instruction']}" escape="false" />
				<br/>
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.instruction.delete']}" escape="false" />

			<p:dataTable id="progressivePayment" var="payment"
				rowIndexVar="index" rows="10" widgetVar="progPaymentWidget"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{directLOABackingBean.managedBean.scLoa.scQtProgPayments}">
				<ac:paginator for="progressivePayment" />
				<p:column style="width:2%;">
						<f:facet name="header">
						<p:selectBooleanCheckbox required="true"
							value="#{directLOABackingBean.managedBean.selectAll}"
							disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">
							<p:ajax partialSubmit="true" process="@this"
								update=":form:progressivePayment,:form:progPayDeleteButtonId"
								listener="#{directLOABackingBean.selectAllSchedule}" />
						</p:selectBooleanCheckbox>
					</f:facet>

					<p:selectBooleanCheckbox required="true"
						disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{payment.selected}" styleClass="myCustomChekBox">
						<p:ajax event="change"
							update=":form:progressivePayment,:form:progPayDeleteButtonId"
							listener="#{directLOABackingBean.selectOneScheCheckboxSelect}"></p:ajax>
					</p:selectBooleanCheckbox>
				</p:column> 

				<p:column style="width:10%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.spec.phase']}" />
					</f:facet>
					<p:inputText value="#{payment.phaseNo}" required="true"
						label="#{lbl['lbl.sc.spec.phase']}" id="progressivePhase"
						maxlength="3" size="5" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">

						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
						<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.sc.spec.phase.tooltip']}" />
					<p:message id="phaseNumId" for="progressivePhase" display="icon"></p:message>
				</p:column>
				<p:column style="width:10%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.description']}" />
					</f:facet>
					<p:inputText value="#{payment.phaseDesc}" maxlength="50"
						required="true" id="progressivePhasedesc" style="width:100px;"
						label="#{lbl['lbl.sc.description']}" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">
						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					</p:inputText>
					<p:message id="phaseDescId" for="progressivePhasedesc"
						display="icon"></p:message>
				</p:column>

				<p:column style="width:15%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.start.month']}" />
					</f:facet>
					<p:selectOneMenu style="width:100px;" value="#{payment.startMonth}" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">

						<f:selectItems value="#{directLOABackingBean.yearDetails}"></f:selectItems>
						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							listener="#{directLOABackingBean.calculateProgressiveStartMonth(payment)}"></p:ajax>
					</p:selectOneMenu>

				</p:column>
				<p:column style="width:15%">
				<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.start.year']}" />
					</f:facet>

					<p:selectOneMenu value="#{payment.startYear}" style="width:100px;" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">
						<f:selectItems value="#{directLOABackingBean.yearsDisplayDtls}"></f:selectItems>
						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							listener="#{directLOABackingBean.calculateProgressiveStartMonth(payment)}"></p:ajax>
					</p:selectOneMenu>


				</p:column>
				<p:column style="width:15%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.end.month']}" />
					</f:facet>
					<p:selectOneMenu style="width:100px;" id="paymentEndMonth" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						value="#{payment.endMonth}">

						<f:selectItems value="#{directLOABackingBean.yearDetails}">
						</f:selectItems>
						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							listener="#{directLOABackingBean.calculateProgressivepayment(payment)}"></p:ajax>
					</p:selectOneMenu>
				</p:column>
				<p:column style="width:15%">
				<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.end.year']}" />
					</f:facet>
					<p:selectOneMenu value="#{payment.endYear}" style="width:100px;" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">
						<f:selectItems value="#{directLOABackingBean.yearsDisplayDtls}"></f:selectItems>
						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							listener="#{directLOABackingBean.calculateProgressivepayment(payment)}"></p:ajax>
					</p:selectOneMenu>

				</p:column>
				<p:column style="width:10%;text-align: right;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.percentage']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.spec.percentage.tooltip']}" />
					</f:facet>
					<p:inputText value="#{payment.percentage}" required="true" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}"
						id="progressivePercentage" style="width:100px;"
						label="#{lbl['lbl.sc.percentage']}" maxlength="18">
						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
						<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
					</p:inputText>
					<p:message id="pahsePercentage" for="progressivePercentage"
						display="icon"></p:message>
				</p:column>
			</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton id="progPayAddButtonId" value="#{lbl['lbl.btn.add']}"
					partialSubmit="true" process="@this"  
					update="progressivePayment" action="#{directLOABackingBean.addProgressiveDetails}"
					 oncomplete="progPaymentWidget.paginator.endLink.click();">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton id="progPayDeleteButtonId" value="#{lbl['lbl.ct.delete']}" partialSubmit="true" 
					disable= "#{directLOABackingBean.managedBean.buttonHideSchActive}"
					process="@this"  onsuccess="progPayObj.show()">
					</p:commandButton>
				</div>
				<p:confirmDialog id="progPayObj" widgetVar="progPayObj" message="#{lbl['lbl.msg.confirm.delete']}" 	
                           severity="alert"  closable="true" appendToBody="true" header="#{lbl['lbl.msg.confirm.delete.header']}">
                    <div class="ppRightBtn">
			               <p:commandButton value="#{lbl['lbl.btn.yes']}"  process="@this" partialSubmit="true"  oncomplete="progPayObj.hide();"
			                   update=":form:progressivePayment,:form:deleteButtonId" action="#{directLOABackingBean.deleteProgPaymentDetails}" >
			               </p:commandButton>
				           <p:commandButton value="#{lbl['lbl.btn.no']}" onclick="progPayObj.hide();" type="button" />
		            </div>
               </p:confirmDialog>
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.progressive.payment.loa.instruction']}"
				escape="false" />
		</p:panel>

	</h:panelGroup>


</ui:composition>
