<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.zone.details']}" id="directLoaZoneLocationsPanel" toggleable="true">
		<table width="100%">
			<tr>
				<td width="20%"><p:outputLabel
						value="#{lbl['lbl.sc.zone.location.level']}" /> <p:outputLabel
						value="*" styleClass="mandatory"></p:outputLabel></td>
				<td>
					<table>
						<tr>
							<td>
								<c:choose>
									<c:when test="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
										<p:selectOneMenu id="locationLevels" styleClass="commonLabel"
											required="true"
											label="#{lbl['lbl.sc.zone.location.level']}"
											value="#{directLOABackingBean.managedBean.scQt.zoneLocationLevel.parameterId}"
											style="width: 209px;">
					
											<f:selectItems
												value="#{directLOABackingBean.getDropdownLocationValues(ParameterTypeConst.locationLevel)}" />
											<p:ajax event="change" update="generalLocationList"
												listener="#{directLOABackingBean.selectZoneLocationLevel}"></p:ajax>
										</p:selectOneMenu> 
										<p:message id="withzone" for="locationLevels" display="icon"></p:message>
									</c:when>
									<c:otherwise>
										<p:inputText id="locationLevelsTxt"
											value="#{directLOABackingBean.getParameterDesc(directLOABackingBean.managedBean.scQt.zoneLocationLevel)}"
											size="30" disabled="true" />
									</c:otherwise>
								</c:choose>
							</td>
							<td style="margin-top: -3px">
								<ac:iconTooltip value="#{lbl['lbl.sc.zone.location.level.tooltip']}" />
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		<p:spacer height="5px"></p:spacer>
		<h:panelGrid width="100%">
			<p:dataTable id="zoneGeneralDataTable" rows="10"
			    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{directLOABackingBean.managedBean.zoneTrees}" var="zoneTree"
				style="width:100%" rowIndexVar="index" rowKey="#{zoneTree}">

				<p:column>
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.zone.location']}" />
					</f:facet>
					<p:tree value="#{zoneTree}" var="location" selectionMode="#{(isEditableStatus and !directLOABackingBean.managedBean.readOnly) ? 'checkbox' : 'null'}"
						style="width:85%;">
						<p:ajax event="select" update="@([id$=directLoaZoneLocationDeleteBtnId])"
							listener="#{directLOABackingBean.selectZoneTreeNode}" />
						<p:ajax event="unselect" update="@([id$=directLoaZoneLocationDeleteBtnId])"
							listener="#{directLOABackingBean.unSelectZoneTreeNode}" />

						<p:treeNode type="zone">
							<h:outputText value="#{location.zoneName}" />
						</p:treeNode>

						<p:treeNode type="state">
							<h:outputText value="#{location.pmState.stateName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{location.pmDivision.divisionName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{location.pmDistrict.districtName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.action']}" style="width:15%;text-align: center;"
					rendered="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}">
					<p:commandLink
						actionListener="#{directLOABackingBean.editZones(zoneTree,index)}"
						process="@this" update="@([id$=dlgId])"
						oncomplete="ZoneGeneral.show();">
						<h:graphicImage value="/css/images/design/edit.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div class="ppRightBtn BtnSpacing" style="width: 100%">
			<p:commandButton value="#{lbl['lbl.btn.add']}" process="@all"
				rendered="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}" update="@([id$=zonePopupGeneral])"
				actionListener="#{directLOABackingBean.showGeneralZonesPopup}" />
			<p:commandButton value="#{lbl['lbl.btn.delete']}" process="@this" id="directLoaZoneLocationDeleteBtnId"
				disabled="#{directLOABackingBean.zoneLocationDeleteBtnDisable()}"
				partialSubmit="true" oncomplete="zonesNonpanelDeletePopUp.show();"
				update="@([id$=#{zonesNonpanelDeleteId}])"
				rendered="#{isEditableStatus and !directLOABackingBean.managedBean.readOnly}" />
		</div>
		<ui:param name="zonesNonpanelDeleteId" value="zonesNonpanelDeleteId"></ui:param>
		<ac:confirmationPopup id="#{zonesNonpanelDeleteId}"
			widget="zonesNonpanelDeletePopUp"
			okAction="directLOABackingBean.deleteTreeNode" width="400"
			height="200" title="#{lbl['lbl.sc.qt.zone.location.info']}"
			content="#{lbl['lbl.sc.dialog.confirm.zones.delete']}"
			update="@([id$=zoneGeneralDataTable],[id$=#{productAndServiceId}],[id$=directLoaZoneLocationsPanel])" />

		<p:dialog id="dlgId" header="#{lbl['lbl.sc.add.location']}"
			widgetVar="ZoneGeneral" modal="true" width="520" closable="false"
			resizable="false">
			<p:messages id="directAwardZonemessages" showDetail="true"
				showSummary="false" autoUpdate="true" closable="true"
				severity="error, info" />
			<h:panelGroup id="zonePopupGeneral">
				<table styleClass="noBorders tr,noBorders td" border="0">
					<TR>
						<TD width="30%" valign="top"><p:outputLabel
								value="#{lbl['lbl.sc.zone.name']}"></p:outputLabel> <p:outputLabel
								value="*" styleClass="mandatory" /></TD>
						<td width="70%">
							<table>
								<tr>
									<td><p:inputText size="50" id="zoneNameId"
											label="#{lbl['lbl.sc.zone.name']}" maxlength="50"
											required="#{directLOABackingBean.managedBean.zoneLocation}"
											value="#{directLOABackingBean.managedBean.zoneName}"></p:inputText></td>
									<td><p:message id="zoneNameMsg" for="zoneNameId"
											display="icon" /></td>
								</tr>
							</table>
						</td>
					</TR>
					<TR>
						<TD valign="top"><p:outputLabel
								value="#{lbl['lbl.sc.location']}" /> <p:outputLabel value="*"
								styleClass="mandatory" /></TD>
						<TD>
							<div style="height: 300px; overflow-y: scroll;">
								<p:tree id="treeZoneGeneralPopup"
									value="#{directLOABackingBean.managedBean.rootZoanlTree}"
									var="location"
									selection="#{directLOABackingBean.managedBean.selectedGeneralTreeNodes}"
									selectionMode="checkbox">
									<p:treeNode type="state">
										<h:outputText value="#{location.pmState.stateName}" />
									</p:treeNode>
									<p:treeNode type="division">
										<h:outputText value="#{location.pmDivision.divisionName}" />
									</p:treeNode>
									<p:treeNode type="district">
										<h:outputText value="#{location.pmDistrict.districtName}" />
									</p:treeNode>
									<p:treeNode type="city">
										<h:outputText value="#{pmCity.cityName}" />
									</p:treeNode>
								</p:tree>
							</div>
						</TD>
					</TR>
				</table>
			</h:panelGroup>

			<div class="ppRightBtn BtnSpacing" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					process="@all"
					update="@this, zoneGeneralDataTable,zonePopupGeneral"
					action="#{directLOABackingBean.updateZoneGeneralLocation}">
				</p:commandButton>
				
				<p:commandButton value="#{lbl['lbl.btn.cancel']}" process="@this"
					style="float:right;" action="#{directLOABackingBean.cancelZonePopUp}" />
			</div>

		</p:dialog>

	</p:panel>
</ui:composition>
