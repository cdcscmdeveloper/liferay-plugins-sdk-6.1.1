<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<c:if test="#{!isDocTypeQuotation}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
			</td>
			<td colspan="3">
				<p:inputText size="50"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.epNo}"
					disabled="true" />
			</td>
		</tr>
		</c:if>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</td>
			<td colspan="3">
				<p:inputText size="50"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.mofNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</td>
			<td colspan="3">
				<p:inputText size="50"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.supplierName}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.branch']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td colspan="3">
				<p:selectOneMenu id="branch"
					value="#{lOADetailBackingBean.managedBean.selectedSupplierBranchName}"
					style="width: 280px;margin-bottom: 5px;"
					required1="true"
					label="#{lbl['lbl.sc.loiloa.branch']}">
					<f:selectItem itemLabel="HQ" itemValue="#{null}" />
					<f:selectItems
						value="#{lOADetailBackingBean.managedBean.branchsList}"
						var="smSupplierBranch" 
						itemValue="#{smSupplierBranch.branchName}" itemLabel="#{smSupplierBranch.branchName}" />
					<p:ajax event="change"
						listener="#{lOADetailBackingBean.handleBranchDetailsChanged}"
						partialSubmit="true" process="@this" update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail" />
				</p:selectOneMenu>
				<p:message id="branchMsg" for="branch" display="icon" />
			</td>
		</tr>
		<tr>
			<td rowspan="3" valign="top" width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.address']}" />
			</td>
			<td rowspan="3" width="32%">
				<p:inputTextarea id="suppAddr" cols="50"
					rows="5"
					value="#{lOADetailBackingBean.getSupplierAddress(lOADetailBackingBean.managedBean.scLoa.supplierAddress)}"
					style=" margin-bottom:5px;" disabled="true" />
			</td>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.tel.no']}" />
			</td>
			<td width="32%">
				<p:inputText id="suppPhoneNo" size="30"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierPhoneNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.fax.no']}" />
			</td>
			<td>
				<p:inputText id="suppFaxNo" size="30"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierFaxNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.mobile.no']}" />
			</td>
			<td>
				<p:inputText id="suppMobNo" size="30"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierMobNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.contact.person']}" />
			</td>
			<td>
				<p:inputText id="suppContact" size="50"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierContact}"
					disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.email']}" />
			</td>
			<td>
				<p:inputText id="suppEmail" size="30" style=" margin-bottom:5px;"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierEmail}"
					disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.title']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td colspan="3">
				<p:inputText id="title" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.title}" size="125"
					required1="true"
					label="#{lbl['lbl.sc.loiloa.loa.title']}"
					disabled="#{!lOADetailBackingBean.managedBean.scLoa.brandNew}"
					maxlength="100" />
				<p:message id="titleMsg" for="title" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.file.no']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td colspan="3">
				<p:inputText disabled="#{isDocTypeQuotation}"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fileNo}" size="42" />
				<p:inputText id="fileExtNo" styleClass="ppNumericAlign"
					value="#{lOADetailBackingBean.managedBean.scLoa.fileExtNo}" size="1"
					required1="true"
					label="#{lbl['lbl.sc.loiloa.file.extension.no']}"
					maxlength="3" />
				<p:message id="fileExtNoMsg" for="fileExtNo" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.res.due.date']}" />
			</td>
			<td colspan="3">
				<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.ackDueDate}" size="14" disabled="true">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>	
				<p:spacer width="8px" />
				<p:inputText styleClass="ppNumericAlign"
					value1="#{lOADetailBackingBean.managedBean.scLoa.loaDuration}"
					disabled="true" size="8" />
				#{lbl['lbl.sc.days']}
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.off.price']}" />
			</td>
			<td colspan="3">
				<p:inputText styleClass="ppNumericAlign"
					value="#{lOADetailBackingBean.managedBean.scLoa.loaAmt}"
					disabled="true" size="30">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</td>
		</tr>
		<c:if test="#{isDocTypeQuotation}">
		<tr>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td width="32%">
				<p:selectOneRadio id="insWarranty"
					value="#{lOADetailBackingBean.managedBean.scLoa.insWarrantyReq}"
					required1="true"
					label="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}">
					<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
				</p:selectOneRadio>
				<p:message id="insWarrantyMsg" for="insWarranty" display="icon" />
			</td>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td width="32%">
				<p:selectOneRadio id="bondReq"
					value="#{lOADetailBackingBean.managedBean.scLoa.bondReq}"
					required1="true"
					label="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}">
					<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
				</p:selectOneRadio>
				<p:message id="bondReqMsg" for="bondReq" display="icon" />
			</td>
		</tr>
		</c:if>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contract.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.cont.type']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td colspan="3">
				<c:if test="#{lOADetailBackingBean.managedBean.scLoa.brandNew and isDocTypeQuotation}">
					<p:selectOneMenu id="contractType"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterId}"
						style="width: 178px;margin-bottom: 5px;"
						required1="true"
						label="#{lbl['lbl.sc.loiloa.loa.cont.type']}">
						<f:selectItems
							value="#{lOADetailBackingBean.getDropdownValues(ParameterTypeConst.contractType)}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.contractTypeChanged()}"
							partialSubmit="true" process="@this"
							update="contractAgencyPG" />
					</p:selectOneMenu>
					<p:message id="contractTypeMsg" for="contractType" display="icon" />
				</c:if>
				<c:if test="#{!lOADetailBackingBean.managedBean.scLoa.brandNew or !isDocTypeQuotation}">
					<p:inputText 
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.contractType)}"
						disabled="true" size="30" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.agency']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td width="32%">
				<c:if test="#{lOADetailBackingBean.managedBean.scLoa.brandNew}">
					<h:panelGroup id="contractAgencyPG">
					<p:selectOneMenu id="contractAgencyProf"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractAgency.orgProfileId}"
						style="width: 280px;margin-bottom: 5px;"
						required1="true"
						label="#{lbl['lbl.sc.loiloa.loa.agency']}"
						rendered="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterCode == ParameterConst.contractTypeMinistry}">
						
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.agencyProfileList}"
							var="pmOrgProfile" itemLabel="#{pmOrgProfile.orgName}"
							itemValue="#{pmOrgProfile.orgProfileId}" />
						<p:ajax event="change" 
							listener="#{lOADetailBackingBean.contractAdminChanged()}"
							partialSubmit="true" process="@this"
							update="contractAdmin" />
					</p:selectOneMenu>
					<p:message id="contractAgencyProfMsg" for="contractAgencyProf" display="icon" />
					
					<p:selectOneMenu id="contractAgency"
						value="#{lOADetailBackingBean.managedBean.selectedContractAgency}"
						style="width: 280px;margin-bottom: 5px;"
						required1="true"
						label="#{lbl['lbl.sc.loiloa.loa.agency']}"
						rendered="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterCode != ParameterConst.contractTypeMinistry}">
						
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.agencyList}"
							var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
							itemValue="#{pmParameterDesc.pmParameter.parameterCode}" />
						<p:ajax event="change" 
							listener="#{lOADetailBackingBean.contractAdminChanged()}"
							partialSubmit="true" process="@this"
							update="contractAdmin" />
					</p:selectOneMenu>
					<p:message id="contractAgencyMsg" for="contractAgency" display="icon" />
					</h:panelGroup>
				</c:if>
				<c:if test="#{!lOADetailBackingBean.managedBean.scLoa.brandNew}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.contractAgency.orgName}"
						disabled="true" size="30" />
				</c:if>
			</td>
			<td width="18%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.cont.admin']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td width="32%">
				<c:if test="#{lOADetailBackingBean.managedBean.scLoa.brandNew}">
					<p:selectOneMenu id="contractAdmin"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractAdmin.userId}"
						style="width: 280px;margin-bottom: 5px;"
						required1="true"
						label="#{lbl['lbl.sc.loiloa.loa.cont.admin']}">
						
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.contractAdminList}"
							var="pmuser" itemLabel="#{pmuser.userName}"
							itemValue="#{pmuser.userId}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.handleContractPTJ}"
							partialSubmit="true" process="@this" update="@this" />
					</p:selectOneMenu>
					<p:message id="contractAdminMsg" for="contractAdmin" display="icon" />
				</c:if>
				<c:if test="#{!lOADetailBackingBean.managedBean.scLoa.brandNew}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.contractAdmin.userName}"
						disabled="true" size="30" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl[lOADetailBackingBean.managedBean.scQtFinalization.scQt.fulfilmentType.parameterCode == ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.period' : 'lbl.sc.loiloa.loa.cont.period']}" />
			</td>
			<td colspan="3">
				<p:inputText
					value="#{lOADetailBackingBean.managedBean.scQtFinalization.scQt.contractDuration}"
					disabled="true" size="30" />
			</td>
		</tr>
		<ui:param name="lbleffDate" value="#{lOADetailBackingBean.managedBean.scQtFinalization.scQt.fulfilmentType.parameterCode == ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.eff.date' : 'lbl.sc.loiloa.loa.cont.eff.date'}" />
		<ui:param name="lblexpDate" value="#{lOADetailBackingBean.managedBean.scQtFinalization.scQt.fulfilmentType.parameterCode == ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.exp.date' : 'lbl.sc.loiloa.loa.cont.exp.date'}" />
		<tr>
			<td>
				<p:outputLabel value="#{lbl[lbleffDate]}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:calendar id="effdate"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
					showOn="button"
					value="#{lOADetailBackingBean.managedBean.scLoa.contractEffDate}"
					required1="true"
					label="#{lbl[lbleffDate]}"
					size="25">
					<p:ajax event="dateSelect" update="expdate" />
				</p:calendar>
				<p:message id="effdateMsg" for="effdate" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl[lblexpDate]}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:calendar id="expdate"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
					showOn="button"
					value="#{lOADetailBackingBean.managedBean.scLoa.contractExpDate}"
					mindate="#{lOADetailBackingBean.managedBean.scLoa.contractEffDate}"
					required1="true"
					label="#{lbl[lblexpDate]}"
					size="25" />
				<p:message id="expdateMsg" for="expdate" display="icon" />
			</td>
		</tr>
		<c:if test="#{isDocTypeQuotation}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.agree']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:selectOneRadio id="agreementReq"
					value="#{lOADetailBackingBean.managedBean.scLoa.agreementReq}"
					required1="true"
					label="#{lbl['lbl.sc.loiloa.loa.req.agree']}">
					<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
				</p:selectOneRadio>
				<p:message id="agreementReqMsg" for="agreementReq" display="icon" />
			</td>
		</tr>
		</c:if>
		</table>
	</p:panel>
	
	<p:panel rendered="false">
		<table>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.ack.date']}" />
			</td>
			<td colspan="3">
				<p:inputText disabled="true"
					value1="#{lOADetailBackingBean.managedBean.scLoa.ackDate}"
					size="30" />
			</td>
		</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.prop.off.price']}" /></td>
				<td><p:inputText value="" disabled="true" size="30"
						/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.bidding.amt']}" /></td>
				<td><p:inputText
						value1="#{lOADetailBackingBean.managedBean.scLoa.biddingAmount}"
						size="30" disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.currency']}" /></td>
				<td><p:inputText size="30"
						value1="#{lOADetailBackingBean.managedBean.qt.scQtSpec.pmCurrency.currencyName}"
						disabled="true" /></td>
				<td rowspan="3" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.remark']}" /></td>
				<td rowspan="3"><p:inputTextarea id="remarkText" cols="30"
						rows="5" value1="#{lOADetailBackingBean.managedBean.scLoa.remark}"
						style=" margin-bottom:5px;" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.a1.res.due.date']}" /></td>

				<td><p:inputText
						value1="#{lOADetailBackingBean.managedBean.scLoa.mtoDueDate}"
						size="14" disabled="true" /> <p:spacer
						width="10px" /> <p:inputText
						value1="#{lOADetailBackingBean.managedBean.scLoa.mtoDuration} Days"
						disabled="true" size="8" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.mto.req']}"
						rendered1="#{lOADetailBackingBean.managedBean.scLoa.loaType eq 'Standard'}" /></td>
				<td><p:selectOneRadio
						rendered1="#{lOADetailBackingBean.managedBean.scLoa.loaType eq 'Standard'}"
						value1="#{lOADetailBackingBean.managedBean.scLoa.mtoReq}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
					</p:selectOneRadio></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loi.off.detail']}" toggleable="true" rendered="false">
		<table style="width: 100%" border="1">
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.off.name']}" /></td>
				<td style="width: 128px;"><p:inputText disabled="true"
						value1="#{lOADetailBackingBean.managedBean.scLoa.officierName}"
						size="30" /></td>
				<td style="width: 207px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.off.designation']}" /></td>
				<td><p:inputText disabled="true" 
						value1="#{lOADetailBackingBean.managedBean.scLoa.officerDesignation}"
						size="30" /></td>
			</tr>
			<tr>
				<td rowspan="3" valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.address']}" /></td>
				<td rowspan="3"><p:inputTextarea id="offaddr" cols="30"
						rows="5"
						value1="#{lOADetailBackingBean.managedBean.scLoa.officerAddress}"
						style=" margin-bottom:5px;" disabled="true" /></td>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.tel.no']}" /></td>
				<td><p:inputText size="30"
						value1="#{lOADetailBackingBean.managedBean.scLoa.officerPhoneNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.fax.no']}" /></td>
				<td><p:inputText size="30"
						value1="#{lOADetailBackingBean.managedBean.scLoa.officerFaxNo}"
						disabled="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.email']}" /></td>
				<td><p:inputText size="30"
						value1="#{lOADetailBackingBean.managedBean.scLoa.officerEmail}"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contract.signer.dtl']}"
		toggleable="true">

	<p:panel header="#{lbl['lbl.sc.loiloa.approve.details']}" toggleable="true" rendered="false">
		<table style="width: 100%" border="1">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.appr.req']}" /></td>
				<td colspan="3"><p:selectOneRadio
						value1="#{lOADetailBackingBean.managedBean.scLoa.reqApproval}">
						<f:selectItem itemLabel="Yes" itemValue="true" />
						<f:selectItem itemLabel="No" itemValue="false" />
						<p:ajax event="change" update="app, appDate, appaction, appremark" />
					</p:selectOneRadio></td>
			</tr>
			<tr>
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.approver']}" /></td>
				<td><p:selectOneMenu id="app"
						value1="#{lOADetailBackingBean.managedBean.scLoa.approverUser.userId}"
						disabled1="#{lOADetailBackingBean.managedBean.scLoa.reqApproval ne 'true'}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select --" itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.approverName}"
							var="appName" itemLabel="#{appName.userName}"
							itemValue="#{appName.userId}" />
					</p:selectOneMenu></td>
					
				<td style="width: 154px;"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.approval.date']}" /></td>
				<td><p:inputText id="appDate" 
						disabled1="#{lOADetailBackingBean.managedBean.scLoa.reqApproval ne 'true'}"
						value1="#{lOADetailBackingBean.managedBean.scLoa.approverActionDate}"
						size="30"></p:inputText></td>
			</tr>
			<tr>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.approval.action']}" /></td>
				<td valign="top"><p:selectOneMenu id="appaction"
						value1="#{lOADetailBackingBean.managedBean.scLoa.approverAction}"
						disabled1="#{lOADetailBackingBean.managedBean.scLoa.reqApproval ne 'true'}"
						style="width: 178px;margin-bottom: 5px;">
						<f:selectItem itemLabel="-- Select -- " itemValue="#{null}" />
						<f:selectItem itemLabel="Approver" itemValue="1" />
						<f:selectItem itemLabel="Revise" itemValue="2" />
					</p:selectOneMenu></td>
				<td valign="top"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loi.approval.remarks']}" /></td>
				<td><p:inputTextarea id="appremark" rows="3" cols="30"
						value1="#{lOADetailBackingBean.managedBean.scLoa.approverRemark}"
						autoResize="false"
						disabled1="#{lOADetailBackingBean.managedBean.scLoa.reqApproval ne 'true'}"></p:inputTextarea></td>
			</tr>
