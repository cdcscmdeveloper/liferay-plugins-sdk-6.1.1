<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="isZonal" value="#{lOADetailBackingBean.managedBean.scQtFinalization.scQt.zonal}" />

	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="17%">
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.award.type']}" />
			</td>
			<td width="83%">
				<p:inputText
					value="#{lOADetailBackingBean.managedBean.scQtFinalization.recommendedType}"
					disabled="true" size="30" readonly="true" />
			</td>
		</tr>
		</table>
		
		<p:dataTable id="itemtbl" var="scQtRecommendDtl"
			value="#{lOADetailBackingBean.managedBean.scQtRecommendDtls}" rows="10">
			
			<ac:paginator for="itemtbl" />
			
			<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}">
				<p:commandLink id="zoneName"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{scQtRecommendDtl.scQtRecommend.tplSpecZoneDtl}" />
					
					<h:outputText value="#{scQtRecommendDtl.scQtRecommend.tplSpecZoneDtl.zoneName}" />
				</p:commandLink>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.loiloa.item.name']}">
				#{scQtRecommendDtl.scQtRecommend.requestItem.itemName}
			</p:column>
			
			<p:column style="width:10%; text-align:right;" headerText="#{lbl['lbl.sc.loiloa.item.quantity']}">
				<h:outputText value="#{scQtRecommendDtl.awardQty}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column style="width:15%;" headerText="#{lbl['lbl.sc.loiloa.item.uom']}">
				#{scQtRecommendDtl.scQtRecommend.requestItem.pmUom.uomName}
			</p:column>

			<p:column style="width:20%; text-align:right;" headerText="#{lbl['lbl.sc.loiloa.item.unit.price']}">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.loiloa.item.total']}" />
				</f:facet>	
				
				<h:outputText value="">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:20%; text-align:right;" headerText="#{lbl['lbl.sc.loiloa.item.sub.total']}">
				<f:facet name="footer">
					
				</f:facet>
				
				<h:outputText value="">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

		</p:dataTable>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.location.list']}" toggleable="true" rendered="false">
		<p:dataTable id="zoneId" var="zone"
			value="#{lOADetailBackingBean.managedBean.zonelist}" rows="10"
			rowIndexVar="rowIndex" style="width:35%">
			<ac:paginator for="zoneId" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.location']}">
				<p:commandLink onclick="zonePopUp.show();">
					<h:outputText value="#{zone.zoneName}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
