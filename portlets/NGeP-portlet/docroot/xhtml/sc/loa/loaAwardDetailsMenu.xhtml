<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
		toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.award.type']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOADetailBackingBean.managedBean.qt.awardType}"
					disabled="true" size="30" readonly="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.multiple.locality']}" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOADetailBackingBean.managedBean.qt.scQtCriterias.multiLocality ? 'Yes' : 'No'}"
					readonly="true" disabled="true" size="30" />
			</h:column>
			<h:column />
			<h:column />
		</h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.loiloa.location.list']}"
		toggleable="true">
		<p:dataTable id="zoneId" var="zone"
			value="#{lOADetailBackingBean.managedBean.zonelist}" rows="10"
			rowIndexVar="rowIndex" style="width:35%">
			<ac:paginator for="zoneId" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.location']}">
				<p:commandLink onclick="zonePopUp.show();">
					<h:outputText value="#{zone.zoneName}" />
				</p:commandLink>
			</p:column>
		</p:dataTable>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.loiloa.item.list']}" toggleable="true">
		<p:dataTable id="itemtbl" var="itemList"
			value="#{lOADetailBackingBean.managedBean.scQtItemList}" rows="10"
			rowIndexVar="rowIndex">
			<ac:paginator for="itemId" />
			<p:column headerText="#{lbl['lbl.sc.loiloa.item']}">
				<h:outputText value="#{itemList.itemName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.uom']}">
				<h:outputText value="#{itemList.pmUom.uomName}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.item.award.by']}">
				<h:outputText value="item" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.value']}">
				<h:outputText value="1234" />
			</p:column>

		</p:dataTable>
	</p:panel>
	<p:dialog id="zonePopUpId" widgetVar="zonePopUp" modal="true">
		<p:panel toggleable="true">
			<h:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="Zone Name" />
				<p:inputText readonly="true" />
			</h:panelGrid>
			<h:panelGroup style="width:100%;">
				<p:dataTable value="" var="">
					<p:column headerText="Location Name" />
				</p:dataTable>
			</h:panelGroup>

			<p:commandButton value="CANCEL" style="float:right;"
				icon="ui-icon-cancel" onclick="popQtn.hide();"></p:commandButton>
		</p:panel>
	</p:dialog>
</ui:composition>
