<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<div class="ppRightBtn">
	
	<p:commandButton value="#{lbl['lbl.btn.save']}" process="@form"
			partialSubmit="true" onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();" />
	
		<p:commandButton value="#{lbl['lbl.btn.accept']}" process="@form"
			partialSubmit="true" onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();" />


		<p:commandButton value="#{lbl['lbl.btn.reject']}" process="@form"
			partialSubmit="true" onstart="blockWidget.show();"
			oncomplete="blockWidget.hide();" />

	</div>
</ui:composition>
