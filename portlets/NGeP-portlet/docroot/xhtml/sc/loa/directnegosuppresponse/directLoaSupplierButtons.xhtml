<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<table style="width: 100%">
		<tr>
			<td>
				<div class="ppRightBtn">
					<ui:param name="readOnlyTask"
						value="#{directLOABackingBean.managedBean.readOnly}" />
					<ui:decorate
						template="/WEB-INF/facelets/templates/claim_template.xhtml">
						<ui:define name="outComeSection">
						<p:commandButton value="#{lbl['lbl.btn.view.loa']}" process="@this" ajax="false" immediate="true"
									 action="#{directLOABackingBean.downloadViewLoa}"/>
									 
							<p:commandButton value="#{lbl['lbl.btn.save']}" process="@all"
								partialSubmit="true" update="@form"
								onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								action="#{directLOABackingBean.saveAction(true)}" />

							<c:choose>
								<c:when test="#{!empty directLOABackingBean.managedBean.taskId}">
									<ui:repeat var="bpmAction"
										value="#{directLOABackingBean.managedBean.outComes}">
										<ui:param name="buttonLabel"
											value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
										<!-- Enhancement #21573 -->
										<h:panelGroup rendered="#{bpmAction == 'ACCEPT'}">
											<p:commandButton value="#{lbl[buttonLabel]}"
												styleClass="ui-button" update="@form"
												partialSubmit="true" process="@all"
												action="#{directLOABackingBean.updateBpmTaskActionSupplier(bpmAction)}"
												onstart="blockWidget.show();"
												oncomplete="blockWidget.hide();">
												<f:setPropertyActionListener value="#{bpmAction}"
													target="#{directLOABackingBean.managedBean.action}" />
												<f:setPropertyActionListener
													target="#{directLOABackingBean.managedBean.autoUpdate}"
													value="false" />
											</p:commandButton>
										</h:panelGroup>

										<h:panelGroup rendered="#{bpmAction == 'REJECT'}">
											<p:commandButton value="#{lbl[buttonLabel]}"
												styleClass="ui-button" onstart="blockWidget.show();"
												oncomplete="blockWidget.hide();"
												action="#{directLOABackingBean.updateBpmTaskActionSupplier(bpmAction)}"
												partialSubmit="true" process="@all" update="@form" />
										</h:panelGroup>
									</ui:repeat>
								</c:when>
							</c:choose>

							<p:outputPanel id="spkiOutputPanel">
								<ac:spkiPopup id="spkiPopup"
									password="#{directLOABackingBean.managedBean.spkiBackingBean.password}"
									challengeAns1="#{directLOABackingBean.managedBean.spkiBackingBean.challengeAns1}"
									challengeQues1="#{directLOABackingBean.managedBean.spkiBackingBean.challengeQues1}"
									postSignAction="#{directLOABackingBean.spkiSignAction(spkiBackingBean.pmDigiSign)}"
									enableAutoUpdate="#{directLOABackingBean.enableAutoUpdate}" />
							</p:outputPanel>
							
							<p:dialog id="confirmAccept" widgetVar="confmAcceptDlg"
								header="#{lbl['lbl.sc.confirmation']}" resizable="false" 
								closable="false" modal="true">
						
								<p:panel id="confirmAccDlgId">
									<table>
										<tr>
											<td>
												<h:graphicImage value="/css/images/design/exclamation.png" />
													<h:outputText value="#{directLOABackingBean.managedBean.suppConfirmMsgAccept}" />
													<br />
													<br />
											</td>
										</tr>
									</table>
						
									<p:spacer height="1px" />
									<div align="right">
									<!-- #30425 - Start  -->
										<p:commandButton id="yesBtnConfmA" value="#{lbl['lbl.btn.yes']}" update="loaMaintMsg"
											onclick="confmAcceptDlg.hide()" onstart="blockWidget.show()" oncomplete="blockWidget.hide()" 
											action="#{directLOABackingBean.confirmSupplierAccept}"/>
									<!-- #30425 - End  -->
										<p:commandButton id="noBtnConfmA" value="#{lbl['lbl.btn.no']}"
											onclick="confmAcceptDlg.hide()" type="button" />
									</div>
								</p:panel>
							</p:dialog>
							<p:dialog id="confirmReject" widgetVar="confmRejectDlg"
								header="#{lbl['lbl.sc.confirmation']}" resizable="false" 
								closable="false" modal="true">
						
								<p:panel id="confirmRejDlgId">
									<table>
										<tr>
											<td>
												<h:graphicImage value="/css/images/design/exclamation.png" />
													<h:outputText value="#{directLOABackingBean.managedBean.suppConfirmMsgReject}" />
													<br />
													<br />
											</td>
										</tr>
									</table>
						
									<p:spacer height="1px" />
									<div align="right">
										<!-- 11134 -start- -->
										<p:commandButton id="yesBtnConfmR"
											value="#{lbl['lbl.btn.yes']}" onclick="confmRejectDlg.hide()"
											onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
											update="@form"
											action="#{directLOABackingBean.confirmSupplierReject}" />
										<!-- 11134 -end- -->
										<p:commandButton id="noBtnConfmR" value="#{lbl['lbl.btn.no']}"
											onclick="confmRejectDlg.hide()" type="button" />
									</div>
								</p:panel>
							</p:dialog>
						<!-- end Enhancement #21573 -->
						</ui:define>
					</ui:decorate>

				</div>
			</td>
		</tr>
	</table>
</ui:composition>
