			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch.information']}" />

	<ui:include

	<p:panel id="supplierContractSignerPanel" header="#{lbl['lbl.sc.loiloa.contract.signer.detail']}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.signer.full.name']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isSupplierAckStatus}" />
				</td>
				<td colspan="3"><c:if test="#{isSupplierAckStatus}">
						<p:selectOneMenu id="supplierContractSigner"
							value="#{directLOABackingBean.managedBean.scLoa.ackBy.userId}"
							style="width: 277px;margin-bottom:5px;"
							disabled="#{directLOABackingBean.managedBean.readOnly}"
							required="false" label="#{lbl['lbl.sc.loiloa.signer.full.name']}">

							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
							<f:selectItems
								value="#{directLOABackingBean.managedBean.supplierContractSignerList}"
								var="pmuser" itemLabel="#{pmuser.userName}"
								itemValue="#{pmuser.userId}" />
							<p:ajax event="change"
								listener="#{directLOABackingBean.supplierContractSignerEvent()}"
								partialSubmit="true" process="@this" update="@this supplierContractSignerPanel " />
						</p:selectOneMenu>
						<p:message id="supplierContractSignerMsg" for="supplierContractSigner"
							display="icon" />
					</c:if> <c:if test="#{!isSupplierAckStatus}">
						<p:inputText
							value="#{ldirectLOABackingBean.managedBean.scLoa.ackBy.userName}"
							disabled="true" size="35" />
					</c:if></td>
			</tr>
			<tr>
				<td width="18%"><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:inputText id="supplierContractSignerIdentificationNo" size="40"
						disabled="true"
						value="#{directLOABackingBean.managedBean.scLoa.ackBy.identificationNo}"
						required="false" label="#{lbl['lbl.sc.identification.no']}"
						maxlength="15" /> <p:message id="supplierContractSignerIdentificationNoMsg"
						for="supplierContractSignerIdentificationNo" display="icon" /></td>
			</tr>
			<tr>
				<td rowspan="3" valign="top" width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.address']}" /></td>
				<td colspan="3" rowspan="3"><p:inputTextarea id="supplierContractSignerAddr" rows="6"
						value="#{directLOABackingBean.getFullAddress(directLOABackingBean.managedBean.scLoa.scSupplierAddress)}"
						style=" margin-bottom:5px;width: 236px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.supplier.witness.detail']}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">

						id="identificationNoMsg" for="identificationNo" display="icon" />

			</tr>

						id="designationMsg" for="designation" display="icon" /></td>

			<tr>

				disabled="#{directLOABackingBean.managedBean.readOnly}"
						required="false" rows="5" onkeyup="limitTextArea(this,200);" onkeydown="limitTextArea(this,200);"

				<td width="32%"><p:inputText id="phoneNo" size="25"
				disabled="#{directLOABackingBean.managedBean.readOnly}"
						required="false"
						value="#{directLOABackingBean.managedBean.loaSupplierWitness.phoneNo}"

						for="phoneNo" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.fax.no']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:inputText id="faxNo" size="25" required="false"
				disabled="#{directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.loaSupplierWitness.faxNo}"
						maxlength="20" validator="#{webappBean.checkFaxNumber}"
						label="#{lbl['lbl.sc.fax.no']}" /> <ac:iconTooltip
						value="#{lbl['lbl.sc.fax.no.tooltip']}" /> <p:message id="faxNoMsg"
						for="faxNo" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" /></td>
				<td><p:inputText id="mobileNo" size="25"
				disabled="#{directLOABackingBean.managedBean.readOnly}"
						value="#{directLOABackingBean.managedBean.loaSupplierWitness.mobileNo}"
						maxlength="20" validator="#{webappBean.checkPhoneNumber}"
						label="#{lbl['lbl.sc.mobile.no']}" /> <ac:iconTooltip
						value="#{lbl['lbl.sc.mobile.no.tooltip']}" /><p:message id="mobileNoMsg"
						for="mobileNo" display="icon" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.email']}" /></td>
				<td colspan="3"><p:inputText id="email" size="40"
				disabled="#{directLOABackingBean.managedBean.readOnly}"
						style=" margin-bottom:5px;"
						value="#{directLOABackingBean.managedBean.loaSupplierWitness.email}"
						maxlength="80" validator="#{webappBean.checkEmail}"
						label="#{lbl['lbl.sc.email']}" /> <p:message id="emailMsg"
						for="email" display="icon" /></td>
			</tr>
		</table>
