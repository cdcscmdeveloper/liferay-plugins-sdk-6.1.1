<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<div align="left" class="header-info header-spacing">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="12%"><h:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.no']}" /></td>
				<td class="header-info-text" width="11%">
					#{directLOABackingBean.managedBean.scLoa.loaNo}</td>
				<td width="12%"><h:outputLabel value="#{lbl['lbl.sc.ptj']}" />
				</td>
				<td class="header-info-text" width="35%">
					#{directLOABackingBean.managedBean.scQt.pmOrgProfile.orgName}</td>
				<td width="15%"><h:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.issue']}" /></td>
				<td class="header-info-text" width="15%"><h:outputText
						value="#{directLOABackingBean.managedBean.scLoa.issueDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText></td>
			</tr>
			<tr>
				<td width="10%"><h:outputLabel
						value="#{lbl['lbl.sc.qtn.no']}" /></td>
				<td class="header-info-text">
					#{directLOABackingBean.managedBean.scQt.qtNo}</td>
				<td width="10%"><h:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.title']}" /></td>
				<td class="header-info-text" colspan="3">
					#{directLOABackingBean.managedBean.scLoa.scQt.qtTitle}</td>
			</tr>

		</table>
	</div>
</ui:composition>
