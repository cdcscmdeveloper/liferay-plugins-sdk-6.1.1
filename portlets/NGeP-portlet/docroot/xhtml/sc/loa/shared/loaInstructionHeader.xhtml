<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel rendered="#{isPendingSubmissionStatus or isPendingRevisionStatus}">
		<h:outputText styleClass="instruction"
			escape="false"
			value="#{lbl['lbl.sc.loiloa.loa.attachment.instruction1']}" />

		<p:commandLink styleClass="instruction"
			style="padding-left: 4px;padding-right: 4px;font-size: 13px;"
			ajax="false" immediate="true"
			value="#{lbl['lbl.sc.loiloa.loa.attachment.instruction2']}"
			action="#{lOADetailBackingBean.downloadGuidelinePdf}" />

		<h:outputText styleClass="instruction"
			escape="false"
			value="#{lbl['lbl.sc.loiloa.loa.attachment.instruction3']}" />

		<br />
		<h:outputText styleClass="instruction"
			escape="false"
			value="#{lbl['lbl.sc.loiloa.loa.attachment.agency.instruction']}" />
			
		<h:outputText styleClass="instruction"
			escape="false"
			value="#{lbl['lbl.sc.loiloa.loa.attachment.agency.instruction2']}" />
	</p:panel>
	
	<p:panel rendered="#{isSupplierAckStatus}">
		<h:outputText styleClass="instruction"
			escape="false"
			value="#{lbl['lbl.sc.loiloa.loa.attachment.supplier.instruction']}" />
	</p:panel>
</ui:composition>
