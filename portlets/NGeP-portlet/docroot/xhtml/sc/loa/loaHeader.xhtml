<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<div align="left" class="header-info">

			<td>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.no']}" />
			</td>
			<td>
				<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.loaNo}"

			</td>
			<td>
				<h:outputLabel value="#{lbl['lbl.sc.ptj']}" />
			</td>
			<td>
				<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.pmOrgProfile.orgName}"

			</td>
			<td>
				<h:outputLabel value="#{lbl['lbl.sc.status']}" />
			</td>
			<td>
				<p:inputText value1="#{lOADetailBackingBean.getStatusDescById(lOADetailBackingBean.managedBean.scLoa.workFlowStatuses[0].statusId)}" disabled="true" size="30" />

		</tr>
		</table>

</ui:composition>
