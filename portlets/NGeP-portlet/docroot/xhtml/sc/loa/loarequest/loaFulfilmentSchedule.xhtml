<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isDocTypeQuotation"
		value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypeQuotation}" />
	<ui:param name="isDocTypePurchaseRequest"
		value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypePurchaseRequest}" />
	<h:panelGroup id="frequency">
		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.loiloa.freq.schedule']} "
				toggleable="true"
				rendered="#{isDocTypePurchaseRequest or (isDocTypeQuotation and lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeScheduled)}">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:outputLabel value="#{lbl['lbl.sc.loiloa.total.frequency']}"></h:outputLabel>
					<p:inputText disabled="#{!isEditableStatus}" 
						label ="#{lbl['lbl.sc.spec.total.frequency']}"
						value="#{lOADetailBackingBean.managedBean.totalFrequency}"
						styleClass="ppNumericAlign">
						<p:ajax event="blur" update="frequencySchedule"
							partialSubmit="true" process="@this"
							listener="#{lOADetailBackingBean.addScheduleDetails}" />
					</p:inputText>
				</h:panelGrid>
				<p:dataTable id="frequencySchedule" var="frequency"
					rowIndexVar="index"
					value="#{lOADetailBackingBean.managedBean.scLoa.scQtSchedules}">
					<ac:paginator for="frequencySchedule" />

					<p:column headerText="#{lbl['lbl.sc.loiloa.schedule.no']}" style="width:10%; text-align: right;">
						#{frequency.scheduleNo}
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.start.month']}"
						style="width:15%">
						<p:selectOneMenu id="startMonth" style="width:100px;"  disabled="#{!isEditableStatus}"
							value="#{frequency.startMonth}" label="#{lbl['lbl.sc.start.month']}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true" update="frequencySchedule" 
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'true')}" />						
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.start.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{frequency.startYear}" disabled="#{!isEditableStatus}"
							style="width:100px;"  label="#{lbl['lbl.sc.start.year']}">
							<f:selectItems value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true" update="frequencySchedule"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'true')}" />
						</p:selectOneMenu>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.end.month']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;"  disabled="#{!isEditableStatus}"
							value="#{frequency.endMonth}" label="#{lbl['lbl.sc.end.month']}">

							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								partialSubmit="true"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}" 
						style="width:15%">
						<p:selectOneMenu value="#{frequency.endYear}" style="width:100px;" disabled="#{!isEditableStatus}"
							 label="#{lbl['lbl.sc.end.year']}">
							<f:selectItems value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								partialSubmit="true"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.total.months']}"
						style="width:15%; text-align: right;">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}" />
						</h:panelGroup>
					</p:column>

					<p:column style="width:30%" headerText="#{lbl['lbl.sc.schedule.type']}">
						#{lOADetailBackingBean.getParameterDesc(frequency.scheduleType)}
					</p:column>
				</p:dataTable>
				<p:spacer height="20"></p:spacer>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>

	<h:panelGroup id="progressive">
			<p:panel header="#{lbl['lbl.sc.loiloa.progressive.payment']}"
				toggleable="true"
				rendered="#{isDocTypeQuotation and lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeAsAndWhen}">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:outputLabel value="#{lbl['lbl.sc.spec.total.phase']}"></h:outputLabel>
					<p:inputText styleClass="ppNumericAlign"
						value="#{lOADetailBackingBean.managedBean.totalProgressivePayment}"
						disabled="#{!isEditableStatus}">
						<p:ajax event="blur" update="progressivePayment"
							partialSubmit="true" process="@this"
							listener="#{lOADetailBackingBean.addProgressiveDetails}" />
					</p:inputText>
				</h:panelGrid>
				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index"
					value="#{lOADetailBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />

					<p:column style="width:6%; text-align: right;" headerText="#{lbl['lbl.sc.spec.phase']}">		
						#{payment.phaseNo}
					</p:column>
					<p:column>
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50"
							required="true" id="progressivePhasedesc" size="50">
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.from']}"
						style="width:12%">
						<p:selectOneMenu style="width:100px;"
							value="#{payment.startMonth}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.start.year']}"
						style="width:12%">

						<p:selectOneMenu value="#{payment.startYear}" style="width:100px;">
							<f:selectItems
								value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.to']}"
						style="width:12%">
						<p:selectOneMenu style="width:100px;" value="#{payment.endMonth}">

							<f:selectItems value="#{lOADetailBackingBean.yearDetails}">
							</f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}"
						style="width:12%">
						<p:selectOneMenu value="#{payment.endYear}" style="width:100px;">
							<f:selectItems
								value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:10%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.percentage']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true"
							id="progressivePercentage" styleClass="ppNumericAlign"
							label="#{lbl['lbl.sc.percentage']}" maxlength="18">
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>
				</p:dataTable>
				<p:spacer height="20"></p:spacer>
			</p:panel>
	</h:panelGroup>
</ui:composition>
