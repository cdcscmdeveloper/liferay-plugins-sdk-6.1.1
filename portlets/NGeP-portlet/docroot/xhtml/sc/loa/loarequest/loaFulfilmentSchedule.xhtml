<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="../shared/loaInstructionHeader.xhtml" />
	
	<ui:param name="isDocTypeQuotation"
		value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypeQuotation}" />
	<ui:param name="isDocTypePurchaseRequest"
		value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypePurchaseRequest}" />
		
	<h:panelGroup id="frequency">
		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{isDocTypePurchaseRequest or (isDocTypeQuotation and lOADetailBackingBean.managedBean.scQt.scheduleType == ParameterConst.periodicScheduleTypeFrequencySchedule)}">

				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction']}" escape="false" />
				<br />
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.spec.instruction.delete']}" escape="false" />
			<p:dataTable id="frequencySchedule" var="frequency" 
					rowIndexVar="index" widgetVar="freqScheduleWidget"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{lOADetailBackingBean.managedBean.scLoa.scQtSchedules}">
					<ac:paginator for="frequencySchedule" />
					<p:column style="width:2%;">
						<f:facet name="header">
							<p:selectBooleanCheckbox
								value="#{lOADetailBackingBean.managedBean.selectAll}" required="true"
								disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
								<p:ajax partialSubmit="true" process="@this"
									update=":form:frequencySchedule,:form:deleteButtonId"
									listener="#{lOADetailBackingBean.selectAllSchedule}" />
							</p:selectBooleanCheckbox>
						</f:facet>

						<p:selectBooleanCheckbox value="#{frequency.selected}"
							required="true"
							disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							styleClass="myCustomChekBox">
							<p:ajax event="change"
								update=":form:frequencySchedule,:form:deleteButtonId"
								listener="#{lOADetailBackingBean.selectOneScheCheckboxSelect}"></p:ajax>
						</p:selectBooleanCheckbox>
					</p:column> 

					<p:column style="width:8%">

						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.spec.schedule.no']}" />
						</f:facet>
						<p:inputText value="#{frequency.scheduleNo}" required="true"
							styleClass="ppRightBtn"
							disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							maxlength="3" label="#{lbl['lbl.sc.spec.schedule.no']}" size="5"
							id="scheduleNum">
							<p:ajax process="@form" partialSubmit="true"
								update=":form:frequencySchedule, :form:addButtonId" />
							<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
						</p:inputText>
					</p:column>
					
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.month']}" />
						</f:facet>
						
						<p:selectOneMenu id="startMonth" style="width:100px;" 
						    disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							value="#{frequency.startMonth}" label="#{lbl['lbl.sc.start.month']}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@form" event="change" partialSubmit="true" update=":form:frequencySchedule, :form:addButtonId"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'true')}" />						
						</p:selectOneMenu>
					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.start.year']}" />
						</f:facet>
						<p:selectOneMenu value="#{frequency.startYear}" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						    
							style="width:100px;" label="#{lbl['lbl.sc.start.year']}">
							<f:selectItems value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax process="@form" event="change" partialSubmit="true" update=":form:frequencySchedule, :form:addButtonId"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'true')}" />
						</p:selectOneMenu>
					</p:column>

					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.month']}" />
						</f:facet>
						<p:selectOneMenu style="width:100px;" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							value="#{frequency.endMonth}" label="#{lbl['lbl.sc.end.month']}">

							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@form" event="change" partialSubmit="true" update=":form:frequencySchedule, :form:addButtonId"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:15%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.end.year']}" />
						</f:facet>
						<p:selectOneMenu value="#{frequency.endYear}" 
						     style="width:100px;" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							 label="#{lbl['lbl.sc.end.year']}">
							<f:selectItems value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax process="@form" event="change" partialSubmit="true" update=":form:frequencySchedule, :form:addButtonId"
							onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.total.months']}"
						style="width:15%; text-align: right;">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}" />
						</h:panelGroup>
					</p:column>

					<p:column style="width:30%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.schedule.type']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.schedule.type.tooltip']}" />
						</f:facet>
						<ui:remove>
						<p:selectOneMenu style="width:180px;" required="true"
							id="scheduledTypeId" label="#{lbl['lbl.sc.schedule.type']}"
							value="#{frequency.scheduleType.parameterId}" disabled="#{!isEditableStatus or directLOABackingBean.managedBean.readOnly}">

							<f:selectItems
								value="#{lOADetailBackingBean.getDropdownValues(ParameterTypeConst.scheduleType)}" />
							<p:message id="freqScheduledTypeId" for="scheduledTypeId"
								display="icon"></p:message>

						</p:selectOneMenu>
						</ui:remove>
						 <h:outputText value="#{lOADetailBackingBean.getParameterDesc(frequency.scheduleType)}"/>
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
					<p:commandButton id="addButtonId" value="#{lbl['lbl.btn.add']}"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						partialSubmit="true" process="@this" update="frequencySchedule"
						action="#{lOADetailBackingBean.addScheduleDetails}"
						oncomplete="freqScheduleWidget.paginator.endLink.click();">
					</p:commandButton>
					<p:spacer width="2" />
					<p:commandButton id="deleteButtonId"
					 disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						value="#{lbl['lbl.ct.delete']}" partialSubmit="true"
						disable="#{lOADetailBackingBean.managedBean.buttonHideSchActive}"
						process="@this" onsuccess="freqScheduleObj.show()">
					</p:commandButton>
				</div>
				<p:confirmDialog id="freqScheduleObj" widgetVar="freqScheduleObj"
					message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
					closable="true" appendToBody="true"
					header="#{lbl['lbl.msg.confirm.delete.header']}">
					<div class="ppRightBtn">
						<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
							partialSubmit="true" oncomplete="freqScheduleObj.hide();"
							update=":form:frequencySchedule,:form:deleteButtonId"
							action="#{lOADetailBackingBean.deleteFreqScheduleDetails}">
						</p:commandButton>
						<p:commandButton value="#{lbl['lbl.btn.no']}"
							onclick="freqScheduleObj.hide();" type="button" />
					</div>
				</p:confirmDialog>
				<p:spacer height="20"></p:spacer>
								
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>

<ui:remove>  
<h:panelGroup id="progressive">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true"
				rendered="#{isDocTypeQuotation and lOADetailBackingBean.managedBean.scQt.scheduleType == ParameterConst.periodicScheduleTypeProgressivePayment}">

			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.instruction']}" escape="false" />
			<br />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.spec.instruction.delete']}" escape="false" />
				
				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index" rows="10" widgetVar="progPaymentWidget"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{lOADetailBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />
					<p:column style="width:2%;">
						<f:facet name="header">
						<p:selectBooleanCheckbox required="true"
							disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							value="#{lOADetailBackingBean.managedBean.selectAll}">
							<p:ajax partialSubmit="true" process="@this"
								update=":form:progressivePayment,:form:progPayDeleteButtonId"
								listener="#{lOADetailBackingBean.selectAllSchedule}" />
						</p:selectBooleanCheckbox>
					</f:facet>

					<p:selectBooleanCheckbox required="true"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						value="#{payment.selected}" styleClass="myCustomChekBox">
						<p:ajax event="change"
							update=":form:progressivePayment,:form:progPayDeleteButtonId"
							listener="#{lOADetailBackingBean.selectOneScheCheckboxSelect}"></p:ajax>
					</p:selectBooleanCheckbox>
				</p:column> 

					<p:column style="width:10%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.spec.phase']}" />
					</f:facet>
					<p:inputText value="#{payment.phaseNo}" required="true"
						label="#{lbl['lbl.sc.spec.phase']}" id="progressivePhase"
						maxlength="3" size="5" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">

						<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
						<ac:validateNumber integerOnly="true" maxIntegerDigits="3"></ac:validateNumber>
					</p:inputText>
					<ac:iconTooltip value="#{lbl['lbl.sc.spec.phase.tooltip']}" />
					<p:message id="phaseNumId" for="progressivePhase" display="icon"></p:message>
				</p:column>
					<p:column style="width:10%;">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						    label="#{lbl['lbl.sc.description']}"
							required="true" id="progressivePhasedesc" style="width:160px;"> 
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
						</p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column style="width:12%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.from']}" />
					</f:facet>
					<p:selectOneMenu style="width:100px;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						    required="true" label="#{lbl['lbl.sc.from']}"
							value="#{payment.startMonth}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
			                    listener="#{lOADetailBackingBean.calculateProgressiveStartMonth(payment)}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:12%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.start.year']}" />
					</f:facet>

					<p:selectOneMenu value="#{payment.startYear}" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						    required="true" label="#{lbl['lbl.sc.start.year']}"
						    style="width:100px;">
							<f:selectItems
								value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"
							listener="#{lOADetailBackingBean.calculateProgressiveStartMonth(payment)}"></p:ajax>
						</p:selectOneMenu>


					</p:column>
					<p:column style="width:12%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.to']}" />
					</f:facet>
					<p:selectOneMenu style="width:100px;"  required="true" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						  label="#{lbl['lbl.sc.to']}" value="#{payment.endMonth}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}">
							</f:selectItems>
							<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:12%">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory" />
						<h:outputText value="#{lbl['lbl.sc.end.year']}" />
					</f:facet>
					<p:selectOneMenu value="#{payment.endYear}" required="true" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						  label="#{lbl['lbl.sc.end.year']}" style="width:100px;">
							<f:selectItems
								value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax event="change" update=":form:progressivePayment, :form:progPayAddButtonId" process="@form" 
			                    onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:5%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.percentage']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.spec.percentage.tooltip']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true" style="width:80px; text-align:right;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
							id="progressivePercentage" 
							label="#{lbl['lbl.sc.percentage']}" maxlength="18" >
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>
				</p:dataTable>
				<div class="ppRightBtn">
				<p:commandButton id="progPayAddButtonId"
					value="#{lbl['lbl.btn.add']}" partialSubmit="true" process="@this"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
					update="progressivePayment"
					action="#{lOADetailBackingBean.addProgressiveDetails}"
					oncomplete="progPaymentWidget.paginator.endLink.click();">
				</p:commandButton>
				<p:spacer width="2" />
				<p:commandButton id="progPayDeleteButtonId"
					value="#{lbl['lbl.ct.delete']}"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
					partialSubmit="true"
					disable="#{lOADetailBackingBean.managedBean.buttonHideSchActive}"
					process="@this" onsuccess="progPayObj.show()">
				</p:commandButton>
			</div>
			<p:confirmDialog id="progPayObj" widgetVar="progPayObj"
				message="#{lbl['lbl.msg.confirm.delete']}" severity="alert"
				closable="true" appendToBody="true"
				header="#{lbl['lbl.msg.confirm.delete.header']}">
				<div class="ppRightBtn">
					<p:commandButton value="#{lbl['lbl.btn.yes']}" process="@this"
						partialSubmit="true" oncomplete="progPayObj.hide();"
						update=":form:progressivePayment,:form:deleteButtonId"
						action="#{lOADetailBackingBean.deleteProgPaymentDetails}">
					</p:commandButton>
					<p:commandButton value="#{lbl['lbl.btn.no']}"
						onclick="progPayObj.hide();" type="button" />
				</div>
			</p:confirmDialog>
			<p:spacer height="20"></p:spacer>
			</p:panel>
	</h:panelGroup> 
	</ui:remove>
</ui:composition>
