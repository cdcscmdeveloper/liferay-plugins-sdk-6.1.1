<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="isDocTypeQuotation"
		value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypeQuotation}" />
	<ui:param name="isDocTypePurchaseRequest"
		value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypePurchaseRequest}" />
		
	<h:panelGroup id="frequency">
		<h:panelGroup id="schedule">
			<p:panel header="#{lbl['lbl.sc.spec.freq.schedule']} "
				toggleable="true"
				rendered="#{isDocTypePurchaseRequest or (isDocTypeQuotation and lOADetailBackingBean.managedBean.scQt.scheduleType == ParameterConst.periodicScheduleTypeFrequencySchedule)}">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:column>
						<h:outputLabel value="#{lbl['lbl.sc.spec.total.frequency']}"></h:outputLabel>
					</h:column>
					<h:column>
						<p:inputText disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}" 
							label ="#{lbl['lbl.sc.spec.total.frequency']}"
							maxlength="3"
							value="#{lOADetailBackingBean.managedBean.totalFrequency}"
							style="text-align:right;">
							<p:ajax event="blur" update="frequencySchedule"
								partialSubmit="true" process="@this"
								listener="#{lOADetailBackingBean.addScheduleDetails}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.sc.spec.total.frequency.tooltip']}" />
					</h:column>
				</h:panelGrid>
				<p:dataTable id="frequencySchedule" var="frequency"
					rowIndexVar="index"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{lOADetailBackingBean.managedBean.scLoa.scQtSchedules}">
					<ac:paginator for="frequencySchedule" />

					<p:column headerText="#{lbl['lbl.sc.spec.schedule.no']}" style="width:10%; text-align: right;">
						#{frequency.scheduleNo}
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.start.month']}"
						style="width:15%">
						<p:selectOneMenu id="startMonth" style="width:100px;" 
						    required="true" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							value="#{frequency.startMonth}" label="#{lbl['lbl.sc.start.month']}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true" update="frequencySchedule" 
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'true')}" />						
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.start.year']}"
						style="width:15%">
						<p:selectOneMenu value="#{frequency.startYear}" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						    required="true"
							style="width:100px;" label="#{lbl['lbl.sc.start.year']}">
							<f:selectItems value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true" update="frequencySchedule"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'true')}" />
						</p:selectOneMenu>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.end.month']}"
						style="width:15%">
						<p:selectOneMenu style="width:100px;" required="true" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							value="#{frequency.endMonth}" label="#{lbl['lbl.sc.end.month']}">

							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								partialSubmit="true"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}" 
						style="width:15%">
						<p:selectOneMenu value="#{frequency.endYear}" 
						     required="true" style="width:100px;" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
							 label="#{lbl['lbl.sc.end.year']}">
							<f:selectItems value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
							<p:ajax event="change" update="scheduleDetails"
								partialSubmit="true"
								listener="#{lOADetailBackingBean.calculateScheduleMonths(frequency,'false')}"></p:ajax>
						</p:selectOneMenu>
					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.total.months']}"
						style="width:15%; text-align: right;">
						<h:panelGroup id="scheduleDetails">
							<h:outputText value="#{frequency.totalMonths}" />
						</h:panelGroup>
					</p:column>

					<p:column style="width:30%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.schedule.type']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.schedule.type.tooltip']}" />
						</f:facet>
						#{lOADetailBackingBean.getParameterDesc(frequency.scheduleType)}
					</p:column>
				</p:dataTable>
				<p:spacer height="20"></p:spacer>
			</p:panel>
		</h:panelGroup>
	</h:panelGroup>

	<h:panelGroup id="progressive">
			<p:panel header="#{lbl['lbl.sc.spec.progressive.payment']}"
				toggleable="true"
				rendered="#{isDocTypeQuotation and lOADetailBackingBean.managedBean.scQt.scheduleType == ParameterConst.periodicScheduleTypeProgressivePayment}">

				<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
					<h:column>
						<h:outputLabel value="#{lbl['lbl.sc.spec.total.phase']}"></h:outputLabel>
					</h:column>
					<h:column>
						<p:inputText 
							value="#{lOADetailBackingBean.managedBean.totalProgressivePayment}"
							disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}" style="text-align:right;">
							<p:ajax event="blur" update="progressivePayment"
								partialSubmit="true" process="@this"
								listener="#{lOADetailBackingBean.addProgressiveDetails}" />
						</p:inputText>
						<ac:iconTooltip value="#{lbl['lbl.sc.spec.total.phase.tooltip']}" />
					</h:column>
				</h:panelGrid>
				<p:dataTable id="progressivePayment" var="payment"
					rowIndexVar="index"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					value="#{lOADetailBackingBean.managedBean.progressivePaymentList}">
					<ac:paginator for="progressivePayment" />

					<p:column style="width:6%; text-align: right;" headerText="#{lbl['lbl.sc.spec.phase']}">		
						#{payment.phaseNo}
					</p:column>
					<p:column style="width:10%;">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.description']}" />
						</f:facet>
						<p:inputText value="#{payment.phaseDesc}" maxlength="50" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						    label="#{lbl['lbl.sc.description']}"
							required="true" id="progressivePhasedesc" style="width:160px;"> 
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="phaseDescId" for="progressivePhasedesc"
							display="icon"></p:message>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.from']}"
						style="width:12%">
						<p:selectOneMenu style="width:100px;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						    required="true" label="#{lbl['lbl.sc.from']}"
							value="#{payment.startMonth}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}"></f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column
						headerText="#{lbl['lbl.sc.start.year']}"
						style="width:12%">

						<p:selectOneMenu value="#{payment.startYear}" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						    required="true" label="#{lbl['lbl.sc.start.year']}"
						    style="width:100px;">
							<f:selectItems
								value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>


					</p:column>
					<p:column headerText="#{lbl['lbl.sc.to']}"
						style="width:12%">
						<p:selectOneMenu style="width:100px;"  required="true" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						  label="#{lbl['lbl.sc.to']}" value="#{payment.endMonth}">
							<f:selectItems value="#{lOADetailBackingBean.yearDetails}">
							</f:selectItems>
							<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column headerText="#{lbl['lbl.sc.end.year']}"
						style="width:12%">
						<p:selectOneMenu value="#{payment.endYear}" required="true" 
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						  label="#{lbl['lbl.sc.end.year']}" style="width:100px;">
							<f:selectItems
								value="#{lOADetailBackingBean.yearsDisplayDtls}"></f:selectItems>
								<p:ajax process="@this" event="change" partialSubmit="true"/>
						</p:selectOneMenu>

					</p:column>
					<p:column style="width:5%">
						<f:facet name="header">
							<h:outputText value="* " styleClass="mandatory" />
							<h:outputText value="#{lbl['lbl.sc.percentage']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.spec.percentage.tooltip']}" />
						</f:facet>
						<p:inputText value="#{payment.percentage}" required="true" style="width:80px; text-align:right;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
							id="progressivePercentage" 
							label="#{lbl['lbl.sc.percentage']}" maxlength="18" >
							<ac:validateNumber integerOnly="true" maxIntegerDigits="14"></ac:validateNumber>
							<p:ajax event="blur" partialSubmit="true" process="@this" />
						</p:inputText>
						<p:message id="pahsePercentage" for="progressivePercentage"
							display="icon"></p:message>
					</p:column>
				</p:dataTable>
				<p:spacer height="20"></p:spacer>
			</p:panel>
	</h:panelGroup>
</ui:composition>
