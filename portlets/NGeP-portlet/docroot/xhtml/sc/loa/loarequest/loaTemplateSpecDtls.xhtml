<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="specMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		<table border="0" cellpadding="0" cellspacing="0" width="100%">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.btn.back']}"
						action="#{lOADetailBackingBean.backToPrevious(1)}"
						partialSubmit="true" process="@this" immediate="true" /></td>
				<td class="ppRightBtn"><p:commandButton
						value="#{lbl['lbl.btn.save']}"
						action="#{lOADetailBackingBean.saveTemplateSpec(lOADetailBackingBean.managedBean.templateSpecBean)}"
						update="@form" onstart="blockWidget.show();" oncomplete="blockWidget.hide();"/></td>
			</tr>
		</table>
		<h:panelGroup id="spg">
			<ac:templateSpec
				templateSpecBean="#{lOADetailBackingBean.managedBean.templateSpecBean}"
				title="#{lbl['lbl.sc.specification']}"
				editable="false"  />
		</h:panelGroup>
	</ui:define>
	
</ui:composition>
