
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<c:if test="#{lOADetailBackingBean.managedBean.isLoaTitle()}">
			<ac:title value="#{lbl['lbl.sc.loiloa.loa.header.title']}" />
		</c:if>

		<p:messages id="loaMaintMsg" showDetail="true" autoUpdate="#{lOADetailBackingBean.managedBean.autoUpdate}" closable="true" showSummary="false" />
		
		<ui:param name="isTrackingDairyView" value="#{lOADetailBackingBean.managedBean.trackingDairyView}" />
		<ui:param name="isDocTypeQuotation" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypeQuotation}" />
		<ui:param name="isDocTypeDirectNego" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypeDirectNego}" />
		<ui:remove>START - #33639</ui:remove>
		<ui:param name="isDocTypePurchaseRequest" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypePurchaseRequest}" />
		<ui:remove>END - #33639</ui:remove>
		<ui:param name="isPendingSubmissionStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_SUBMISSION}" />
		<ui:param name="isPendingApprovalStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_APPROVAL}" />
		<ui:param name="isPendingRevApprovalStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_REVISION_APPROVAL}" />
		<ui:param name="isPendingRevisionStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_REVISION}" />
		<ui:param name="isEditableStatus" value="#{(isPendingSubmissionStatus || ((isPendingApprovalStatus|| isPendingRevisionStatus || isPendingRevApprovalStatus) and !empty lOADetailBackingBean.managedBean.taskId)) and !isTrackingDairyView}" />
		<ui:param name="isSupplierAckStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		<ui:param name="isAfterSupplierResponseStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId > QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		<ui:param name="isPendingVerification" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_VERIFICATION}" />
		<ui:param name="isFulfilmentTypeScheduled"
			value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeScheduled}" />
		<ui:param name="isSqStillValid" value="#{lOADetailBackingBean.isSqStillValid()}" />
		<ui:param name="isSaveHideSqExpired" value="#{!lOADetailBackingBean.managedBean.scLoa.brandNew and !isSqStillValid}" />
		<ui:param name="isLOACancelByApprover" value="#{lOADetailBackingBean.isLOACancelByApprover()}" />	
		<ui:param name="isLoaGenerated" value="#{lOADetailBackingBean.isLoaGenerated()}" />	
		<ui:include src="loaButtons.xhtml" />
		<ui:include src="loaHeader.xhtml" />
		
			<!-- 20190405@asyrafhaziq - CR(25062)- Start -->
		<ui:param name="bpmAction" value="APPROVE" />
		<ui:param name="committeeApprovalConsentSigner"
			value="committeeApprovalConsentSigner" />
		<ac:approvePopup id="#{committeeApprovalConsentSigner}"
			widget="loaApprovalPopUp"
			okAction="#{lOADetailBackingBean.updateBpmTaskAction(bpmAction)}"
			width="50%" height="100"
			title="#{lbl['lbl.sc.dialog.confirm.loa.approve.header']}"
			content="#{lbl['lbl.sc.dialog.confirm.loa.approve.dtls']}"
			update="@form" />
		<!-- 20190405@asyrafhaziq - CR(25062)- End -->

		<ac:gpkiPopup textBeforeSign="#{lOADetailBackingBean.textBeforeSign}"
			postSignAction="#{lOADetailBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}"
			enableAutoUpdate="#{lOADetailBackingBean.enableAutoUpdate()}" />
		
		<h:outputText styleClass="instruction" rendered="#{isPendingVerification}"
			value="#{lbl['lbl.sc.loiloa.loa.verify.instruction']}">
		</h:outputText>
		<br />
		<!-- #22211 Start -->
		<!-- Bug_30923 Start -->
		<h:outputText styleClass="instruction" rendered="#{isPendingVerification and isSqStillValid and !isTrackingDairyView and !isDocTypeQuotation}"
			value="#{lbl['lbl.sc.loa.supplier.reviseDocument.instruction']}">
		</h:outputText>
		<!-- Bug_30923 End -->
		<!-- #22211 End -->
		
	    <table border="0" cellspacing="0" cellpadding="0" width="100%">
		  <tr>
			<td width="20%" valign="top" class="sidemenutd">
				<p:tabMenu id="menuTab" styleClass="sidemenu"
					activeIndex="#{lOADetailBackingBean.managedBean.selectedTabIndex}">

					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.details']}" update="@form">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.contents']}" update="@form">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<ui:remove>#29007 Added actionListener Vinod start</ui:remove>
					<p:menuitem value="#{lbl['lbl.sc.loiloa.award.details']}"
							actionListener="#{lOADetailBackingBean.searchSupplierItemByName}"
							update="@form">
							<ui:remove>#29007 Added actionListener Vinod end</ui:remove>
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}" update="@form">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="3" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.loiloa.payment.details']}" update="@form">	
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="4" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}" update="@form" 
					  disabled="#{!isFulfilmentTypeScheduled}">	
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="5" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.perform.bond']}" update="@form" rendered="#{isDocTypeQuotation}" disabled="#{!lOADetailBackingBean.managedBean.scLoa.bondReq}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="6" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.approval.details']}" update="@form" disabled="#{!lOADetailBackingBean.managedBean.scLoa.approvalReq}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="#{isDocTypeQuotation ? 7 : 6}" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.approval']}" update="@form"  disabled="#{!isLOACancelByApprover}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="8" />
					</p:menuitem>				
				</p:tabMenu>
			</td>
			<td width="80%" valign="top">
				<h:panelGroup id="menuContent">
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="loaDetailsMenu.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="loaLetterOfAcceptance.xhtml" />
					</c:if>
		
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="loaAwardDetailsMenu.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="loaDeductionPaymentMenu.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 4}">
						<ui:include src="loaPaymentDetailsMenu.xhtml" />	
					</c:if>
				
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 5}">
						<ui:include src="loaFulfilmentSchedule.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 6 and isDocTypeQuotation}">
						<ui:include src="loaPerformanceBondMenu.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == (isDocTypeQuotation ? 7 : 6)}">
						<ui:include src="loaApprovalMenu.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 8 and !isDocTypeQuotation}">
						<ui:include src="loaCancelMain.xhtml" />
					</c:if>
				</h:panelGroup>
			</td>
		</tr>
		</table>
		
		<ac:scSingleFileUploadPopup widgetVar="scDocUploadDlg"
			fileUploadListener="lOADetailBackingBean.handleFileUpload"
			readonly="#{lOADetailBackingBean.managedBean.readOnly}"
			update="@([id$=scDocUploadBtn])" 
			fileType="#{lOADetailBackingBean.managedBean.fileTypePdf}"
			invalidFileMessage="#{lbl['lbl.txt.upload.pdf.file']}"
			autoUpdateValue="#{lOADetailBackingBean.managedBean.autoUpdate}"/>
		
		<p:confirmDialog widgetVar="gstSignerConfirmPopupWin"
			id="gstSignerConfirmPopup" width="500px"
			message="#{lbl['lbl.sc.gst.signers.alert.msg']}">
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					oncomplete="gstSignerConfirmPopupWin.hide()" process="@this"></p:commandButton>
			</div>

		</p:confirmDialog>		
		<p:confirmDialog widgetVar="sstSignerConfirmPopupWin"
			id="sstSignerConfirmPopup" width="500px"
			message="#{lbl['lbl.sc.sst.signers.alert.msg']}">
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.ok']}"
					oncomplete="sstSignerConfirmPopupWin.hide()" process="@this">
				</p:commandButton>
			</div>
		</p:confirmDialog>

	</ui:define>
</ui:composition>
