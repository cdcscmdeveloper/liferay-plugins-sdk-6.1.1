<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"

	<ui:include src="../shared/loaInstructionHeader.xhtml"/>

	<ac:lovPopup />
	<ui:param name="isContractTypeAsMinistry"
		value="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterCode == ParameterConst.contractTypeMinistry}" />
	<ui:param name="isContractTypeCentral"

	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" toggleable="true">

			<td style="width:21%;">
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</td>
			<td colspan="3">
				<p:inputText size="106"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.supplierName}"
					disabled="true" />
			</td>
		</tr>
		<c:if test="#{!isDocTypeQuotation}">
		<tr>
			<td style="width:21%;">
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
			</td>
			<td>
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.epNo}"
					disabled="true" />
			</td>
		</tr>
		</c:if>
		<tr>

				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />

					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.mofNo}"

			</td>
		</tr>

		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.register.num']}" />
			</td>
			<td colspan="3">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.gstRegNo eq null ? lbl['lbl.txt.na']:lOADetailBackingBean.managedBean.scLoa.gstRegNo}"

			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.effective.date']}" />
			</td>
		<td colspan="3">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.gstEffDate eq null ? lbl['lbl.txt.na']:lOADetailBackingBean.managedBean.scLoa.gstEffDate}"

					</p:inputText> <ac:iconTooltip value="#{lbl['lb.sc.gst.effective.date.tooltip']}"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.declared.date']}" />
			</td>
		<td colspan="3">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.gstDeclaredDate eq null ? lbl['lbl.txt.na'] : lOADetailBackingBean.managedBean.scLoa.gstDeclaredDate}"
					disabled="true" id="gstDeclaredDateId">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.gst.declartive.date.tooltip']}"/>
			</td>
		</tr>

		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}"/>
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
		<td colspan="3">
				<c:if test="#{isEditableStatus}">
					<table>
						<tr>
								<td><p:selectOneMenu id="branch"
										disabled="#{lOADetailBackingBean.managedBean.readOnly or lOADetailBackingBean.managedBean.scLoa.loiCreated}"
										value="#{lOADetailBackingBean.managedBean.scLoa.supplierBranchCode}"
										style="width: 250px;margin-bottom: 5px;"
										label="#{lbl['lbl.sc.branch']}">

										<f:selectItem itemLabel="HQ" itemValue="#{null}" />
										<f:selectItems
											value="#{lOADetailBackingBean.managedBean.branchsList}"
											var="smSupplierBranch"
											itemValue="#{smSupplierBranch.branchCode}"
											itemLabel="#{smSupplierBranch.branchName}" />

										<p:ajax event="change"
											listener="#{lOADetailBackingBean.handleBranchDetailsChanged(true)}"
											partialSubmit="true" process="@this"
											update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail, gstDeclaredDateId, gstEffDateId, gstRegNoId , sstAmtId, ContractAmtId" />
									</p:selectOneMenu> <p:message id="branchMsg" for="branch" display="icon" /></td>
								<td style="margin-top: -3px">
								<ac:iconTooltip value="#{lbl['lbl.sc.branch.tooltip']}" />
							</td>
						</tr>
					</table>
				</c:if>
				<c:if test="#{!isEditableStatus}">
					<p:inputText size="35"
						value="#{lOADetailBackingBean.managedBean.scLoa.supplierBranch}"
						disabled="true" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td rowspan="3" valign="top">
				<p:outputLabel value="#{lbl['lbl.sc.address']}" />
			</td>
			<td rowspan="3">
				<p:inputTextarea id="suppAddr"
					rows="6"
					value="#{lOADetailBackingBean.getFullAddress(lOADetailBackingBean.managedBean.scLoa.scSupplierAddress)}"
					style=" margin-bottom:5px;width: 236px;" disabled="true" />
			</td>
			<td style="width: 155px;">
				<p:outputLabel value="#{lbl['lbl.sc.tel.no']}" />
			</td>
			<td>
				<p:inputText id="suppPhoneNo" size="28"
					value="#{lOADetailBackingBean.managedBean.scLoa.scSupplierAddress.phoneFull}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.fax.no']}" />
			</td>
			<td>
				<p:inputText id="suppFaxNo" size="28"
					value="#{lOADetailBackingBean.managedBean.scLoa.scSupplierAddress.faxFull}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" />
			</td>
			<td>

					disabled="true" />

			<td>
				<p:outputLabel value="#{lbl['lbl.sc.email']}" />
			</td>
			<td>
				<p:inputText id="suppEmail" size="28" style=" margin-bottom:5px;"
					value="#{lOADetailBackingBean.managedBean.scLoa.scSupplierAddress.contactEmail}"
					disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>

		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<h:panelGroup rendered="#{isPendingSubmissionStatus}">
			<tr>
				<td style="width:21%;"><p:outputLabel value="#{lbl['lbl.sc.document.no']}" /></td>

				<td colspan="3"><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.scQt.qtNo}"
						size="35" disabled="true" rendered="#{isDocTypeQuotation}" /> <p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.scQuote.quoteNo}"
						size="35" disabled="true" rendered="#{!isDocTypeQuotation}" /></td>
			</tr>

			<tr>
				<td style="vertical-align: top;">
					<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.title']}" />
					<p:outputLabel value="*" styleClass="mandatory"
						rendered="#{isEditableStatus}" /></td>
				<td colspan="3">
					<p:inputTextarea id="sqTitle"
						value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.title}"
						required="true" maxlength="500" rows="3"
						label="#{lbl['lbl.sc.loiloa.loa.title']}"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}" 
						style="margin-bottom: 5px; width: 670px;">
						<p:ajax event="blur" update="@form" />
					</p:inputTextarea>
					<p:message id="sqTitleMsg" for="sqTitle" display="icon" />
					</td>
			</tr>
			</h:panelGroup>
			<tr>
				<td style="width:21%;">
					<p:outputLabel value="#{lbl['lbl.sc.procurement.mode']}" /> 
				</td>
				<td>
					<p:inputText id="procModeTxt"
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.procurementMode)}"
						size="35" disabled="true" />
				</td>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.qttentype']}" rendered="#{isDocTypeQuotation}" />
				</td>
				<td>
					<p:inputText id="qtTypeTxt"
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.qtType)}"
						size="28" disabled="true"
						rendered="#{isDocTypeQuotation}" />
				</td>
			</tr>

			<tr>
				<td width="21%">
					<p:outputLabel value="#{lbl['lbl.sc.procurment.type.category']}" />
				</td>
				<td colspan="3"><p:inputText id="procurmentTypeCatId"
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.procurementTypeCatId)}"
						size="35" label="#{lbl['lbl.sc.procurment.type.category']}"
						disabled="true" /></td>
			</tr>
			<tr>
			 <td>
				<p:outputLabel value="#{lbl['lbl.sc.qt.fileno']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			 </td>
			<td colspan="3">
				<p:inputText disabled="#{isDocTypeQuotation || !isEditableStatus || lOADetailBackingBean.managedBean.readOnly}"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fileNo}" size="29" maxlength="50"/>
				<p:inputText id="fileExtNo"  style="margin-left: 2px;width: 28px; text-align:right;"
					value="#{lOADetailBackingBean.managedBean.scLoa.fileExtNo}" size="6"
					required="true"
					label="#{lbl['lbl.sc.qt.fileno']}"
					maxlength="3"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}" />
				<p:message id="fileExtNoMsg" for="fileExtNo" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.proposal.off.price']}" />
			</td>
			<td>
				<c:if test="#{!isZonalWithPaOrPs}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.loaAmt}"
						disabled="true" size="35" style="text-align:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</c:if>
				<c:if test="#{isZonalWithPaOrPs}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.totalZonePrice}"
						disabled="true" size="35" style="text-align:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</c:if>
			</td>
		</tr>
		<!-- Enhncement #24259 #24269 Workaround CJCP (LOA) - QT, DIRECT, DP -->
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.sst.rm']}" />
			</td>
			<td>
				<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.sstAmt}"
						size="35" id="sstAmtId" style="text-align:right;" 
						disabled="#{(!(isPendingSubmissionStatus or isPendingRevisionStatus)) or lOADetailBackingBean.managedBean.readOnly}" > 
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur"
						listener="#{lOADetailBackingBean.calculateOverallAmount(lOADetailBackingBean.managedBean.scLoa.sstAmt)}"
							update="ContractAmtId,agreementReq,@([id$=bondReq]),menuTab"></p:ajax>
					</p:inputText>
				</td>
		</tr>

		<tr>
			<td></td>
			<td colspan="3">
				<h:outputText styleClass="instruction"
					value=" #{lbl['lbl.sc.sst.offer.price.reminder']}"
					escape="false" /> <BR />
					<!-- rendered = "#{directLOABackingBean.getGstRate() == 0}" /> 
				<h:outputText styleClass="instruction"
					value=" #{lbl['lbl.sc.gst.remainder.one.instruction']}"
					escape="false"
					rendered = "#{directLOABackingBean.getGstRate() == 6}" />
				<h:outputText styleClass="instruction"
					value=" #{lbl['lbl.sc.gst.remainder.one.instruction.0']}"
					escape="false"
					rendered = "#{directLOABackingBean.getGstRate() == 0}" /> <br /> 
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.gst.remainder.two.instruction']}"
					escape="false"
					rendered="#{lOADetailBackingBean.managedBean.renderRemainder}" /> -->
			</td>
		</tr>
		<!-- end Enhncement #24259 #24269 -->
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.overall.contract.amount']}" />
			</td>
			<td>
				<p:inputText 
					value="#{lOADetailBackingBean.managedBean.overallContractAmt}"
					 size="35" id="ContractAmtId" style="text-align:right;" disabled="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</td>
		</tr>
		<c:if test="#{isDocTypeQuotation}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<p:selectOneRadio id="insWarranty" styleClass="commonLabel"
					value="#{lOADetailBackingBean.managedBean.scLoa.insWarrantyReq}"
					required="true"
					label="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
					<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
					<p:ajax process="@this" partialSubmit="true" update="@this" />
				</p:selectOneRadio>
				<p:message id="insWarrantyMsg" for="insWarranty" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<table>
					<tr>
						<td>
							<p:selectOneRadio id="bondReq" styleClass="commonLabel"
								value="#{lOADetailBackingBean.managedBean.scLoa.bondReq}"
								required="true"
								label="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}"
								disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.performanceBondMandatory or lOADetailBackingBean.managedBean.readOnly}">
								<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								<p:ajax partialSubmit="true" process="@this" update="menuTab" />
							</p:selectOneRadio>
							<p:message id="bondReqMsg" for="bondReq" display="icon" />
						</td>
						<td style="margin-top: -3px">
							<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond.tooltip']}" />
						</td>
					</tr>
				</table>
			</td>
		</tr>
		</c:if>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.appr.req.field']}" />
					<p:outputLabel value="*" styleClass="mandatory"
						rendered="#{isEditableStatus}" /></td>
			<td>
			  <table>
			     <tr>
				   <td>
						<p:selectOneRadio id="approvalReq" styleClass="commonLabel"
							value="#{lOADetailBackingBean.managedBean.scLoa.approvalReq}"
							required="true" label="#{lbl['lbl.sc.loiloa.loa.appr.req.field']}"
							disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
							<f:selectItems
								value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
							<p:ajax process="@this" partialSubmit="true" update="menuTab" />
						</p:selectOneRadio>
						<p:message id="approvalReqMsg" for="approvalReq" display="icon" />
						
				    </td>
					<td style="margin-top: -3px">
						   <ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.req.verification.approval.tooltip']}" />
					</td>
				 </tr>
			  </table>
			</td>
			<td>
				<ui:remove> #26770 - start </ui:remove>
				<p:outputLabel style="width:87%; text-align:left;" value="#{lbl['lbl.sc.loiloa.loa.req.sl1m']}" />
				<p:outputLabel style="width:91% ;text-align:left; margin-top: -40px;" value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				<ui:remove> #26770 - end </ui:remove>
			</td>
			<td>
				<ui:remove> #26770 - start </ui:remove>
				<table border="0" cellspacing="0" cellpadding="0" width="100%" style="margin-right:20px;">
				<ui:remove> #26770 - end </ui:remove>
					<tr>
						<td>
							<p:selectOneRadio id="sl1mReq" styleClass="commonLabel"
								value="#{lOADetailBackingBean.managedBean.scLoa.sl1mReq}"
								required="true"
								label="#{lbl['lbl.sc.loiloa.loa.req.sl1m']}"
								disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
								<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								<p:ajax partialSubmit="true" process="@this" update="menuTab" />
							</p:selectOneRadio>
							<p:message id="sl1mReqMsg" for="sl1mReq" display="icon" />
						</td>
						<ui:remove> #26770 - start </ui:remove>
						<td style="padding-right: 80px; margin-bottom: 20px;">
							<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.req.sl1m.tooltip']}" />
						</td>
						<ui:remove> #26770 - end </ui:remove>
					</tr>
				</table>
			</td>
		</tr>
		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contract.details']}" toggleable="true" 
	    id="contractDetailsId">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.cont.type']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td colspan="3">
			<ui:param name="procurementMode" value="#{isDocTypeQuotation ? ParameterConst.procurementModeQuotation : ParameterConst.procurementModeDirectPurchase}" />
				<c:if test="#{isEditableStatus and !isDocTypeQuotation}">
					<p:selectOneMenu id="contractType"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterId}"
						style="width: 250px;margin-bottom: 5px;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						required="true"
						label="#{lbl['lbl.sc.loiloa.loa.cont.type']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.getContractTypes(procurementMode)}"
							var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
							itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.contractTypeChanged()}"
							partialSubmit="true" process="@this"
							update="contractDetailsId" />
					</p:selectOneMenu>
					<p:message id="contractTypeMsg" for="contractType" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus or isDocTypeQuotation}">
					<!-- 17376 -start -->
					<p:inputText 
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.contractType)}"
						disabled="true" style="min-width:235px" size="35" />
					<!-- 17376 -end -->
				</c:if>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.agency']}" />
			</td>

				<ui:remove> #19336 - start </ui:remove>
				<p:inputText id="contractAgency" disabled="true" size="106"
					value="#{lOADetailBackingBean.managedBeanLoaContractAgencyOrgName}"
					rendered="#{!isEditableStatus}"/>
					<ui:remove> #19336 - end </ui:remove>

				<c:if test="#{isEditableStatus}">
