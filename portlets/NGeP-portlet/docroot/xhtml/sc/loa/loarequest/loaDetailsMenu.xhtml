<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ac:lovPopup />
	<ui:param name="isContractTypeAsMinistry"
		value="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterCode == ParameterConst.contractTypeMinistry}" />
	<ui:param name="isContractTypeCentral"
		value="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterCode eq ParameterConst.contractTypeCentral}" />		
   
	<p:panel header="#{lbl['lbl.sc.loiloa.supp.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<c:if test="#{!isDocTypeQuotation}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.ep.no']}" />
			</td>
			<td width="35%">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.epNo}"
					disabled="true" />
			</td>
		</tr>
		</c:if>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mof.no']}" />
			</td>
		   <td width="35%">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.mofNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.supplier.name']}" />
			</td>
			<td>
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.supplierName}"
					disabled="true" />
			</td>
		</tr>
	
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.register.num']}" />
			</td>
			<td colspan="3">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.gstRegNo eq null ? lbl['lbl.txt.na']:lOADetailBackingBean.managedBean.scLoa.gstRegNo}"
					disabled="true" id="gstRegNoId"/> <ac:iconTooltip value="#{lbl['lbl.sc.gst.registartion.number.tooltip']}"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.effective.date']}" />
			</td>
		<td colspan="3">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.gstEffDate eq null ? lbl['lbl.txt.na']:lOADetailBackingBean.managedBean.scLoa.gstEffDate}"
					disabled="true" id="gstEffDateId">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lb.sc.gst.effective.date.tooltip']}"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.declared.date']}" />
			</td>
		<td colspan="3">
				<p:inputText size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.gstDeclaredDate eq null ? lbl['lbl.txt.na'] : lOADetailBackingBean.managedBean.scLoa.gstDeclaredDate}"
					disabled="true" id="gstDeclaredDateId">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText> <ac:iconTooltip value="#{lbl['lbl.sc.gst.declartive.date.tooltip']}"/>
			</td>
		</tr>
	
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.branch']}"/>
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
		<td colspan="3">
				<c:if test="#{isEditableStatus}">
					<table>
						<tr>
							<td>
								<p:selectOneMenu id="branch"
								disabled="#{lOADetailBackingBean.managedBean.readOnly}"
									value="#{lOADetailBackingBean.managedBean.scLoa.supplierBranch}"
									style="width: 282px;margin-bottom: 5px;"
									label="#{lbl['lbl.sc.branch']}">
									
									<f:selectItems
										value="#{lOADetailBackingBean.supplierBranches}" />
									<p:ajax event="change"
										listener="#{lOADetailBackingBean.handleBranchDetailsChanged}"
										partialSubmit="true" process="@this" update="suppAddr, suppPhoneNo, suppFaxNo, suppMobNo, suppContact, suppEmail, gstDeclaredDateId, gstEffDateId, gstRegNoId , gstAmtId, ContractAmtId" />
								</p:selectOneMenu>
								<p:message id="branchMsg" for="branch" display="icon" />
							</td>
							<td style="margin-top: -3px">
								<ac:iconTooltip value="#{lbl['lbl.sc.branch.tooltip']}" />
							</td>
						</tr>
					</table>
				</c:if>
				<c:if test="#{!isEditableStatus}">
					<p:inputText size="35"
						value="#{lOADetailBackingBean.managedBean.scLoa.supplierBranch}"
						disabled="true" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td rowspan="3" valign="top" width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.address']}" />
			</td>
			<td rowspan="3">
				<p:inputTextarea id="suppAddr"
					rows="5"
					value="#{lOADetailBackingBean.getFullAddress(lOADetailBackingBean.managedBean.scLoa.supplierAddress)}"
					style=" margin-bottom:5px;width: 274px;" disabled="true" />
			</td>
			<td style="width: 18%;">
				<p:outputLabel value="#{lbl['lbl.sc.tel.no']}" />
			</td>
			<td>
				<p:inputText id="suppPhoneNo" size="25"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierPhoneNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.fax.no']}" />
			</td>
			<td>
				<p:inputText id="suppFaxNo" size="25"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierFaxNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.mobile.no']}" />
			</td>
			<td>
				<p:inputText id="suppMobNo" size="25"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierMobNo}"
					disabled="true" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.contact.person']}" />
			</td>
			<td>
				<p:inputText id="suppContact" size="35"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierContact}"
					disabled="true" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.email']}" />
			</td>
			<td>
				<p:inputText id="suppEmail" size="25" style=" margin-bottom:5px;"
					value="#{lOADetailBackingBean.managedBean.scLoa.supplierEmail}"
					disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.details.section']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<c:if test="#{!isDocTypeQuotation}">
		<tr>
			<td width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.title']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td colspan="3">
				<p:inputText id="title" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.title}" size="35"
					required="true"
					label="#{lbl['lbl.sc.title']}"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
					maxlength="100" />
				<p:message id="titleMsg" for="title" display="icon" />
			</td>
		</tr>
		</c:if>
		
		<tr>
			<td width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.procurment.type.category']}" rendered="#{!isDocTypeQuotation}"/>
			</td>
				<td colspan="3"><p:inputText id="procurmentTypeCatId"
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.procurementTypeCatId)}"
						size="35" label="#{lbl['lbl.sc.procurment.type.category']}"
						disabled="true" rendered="#{!isDocTypeQuotation}"/></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.procurment.type.category']}"
						rendered="#{isDocTypeQuotation}" /> <p:outputLabel value="*"
						styleClass="mandatory"
						rendered="#{isDocTypeQuotation and isEditableStatus}" /></td>
				<td colspan="3"><p:selectOneMenu id="procTypeBoCategory" required="true"
						value="#{lOADetailBackingBean.managedBean.scLoa.procurementTypeCatId.parameterId}"
						style="margin-bottom:5px;width:282px;"
						label="#{lbl['lbl.sc.procurment.type.category']}"
						rendered="#{isDocTypeQuotation}" disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
						<f:selectItems
							value="#{lOADetailBackingBean.getDropdownValues(ParameterTypeConst.procurementTypeCategory)}" />
						<p:ajax event="change" process="@this" partialSubmit="true"></p:ajax>
					</p:selectOneMenu> <p:message id="procuremnttitleMsg" for="procTypeBoCategory"
						display="icon" /></td>
			</tr>
			<tr>
			 <td>
				<p:outputLabel value="#{lbl['lbl.sc.qt.fileno']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			 </td>
			<td colspan="3">
				<p:inputText disabled="#{isDocTypeQuotation || !isEditableStatus || lOADetailBackingBean.managedBean.readOnly}"
					value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fileNo}" size="29" maxlength="50"/>
				<p:inputText id="fileExtNo"  style="margin-left: 2px;width: 28px; text-align:right;"
					value="#{lOADetailBackingBean.managedBean.scLoa.fileExtNo}" size="6"
					required="true"
					label="#{lbl['lbl.sc.qt.fileno']}"
					maxlength="3"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}" />
				<p:message id="fileExtNoMsg" for="fileExtNo" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.res.due.date']}" />
			</td>
			<td>
				<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.ackDueDate}" size="17" disabled="true">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</p:inputText>	
				<p:spacer width="8px" />
				<p:inputText 
					value="#{!empty lOADetailBackingBean.managedBean.scLoa.ackDueDate ? DateUtils.getDaysDifference(DateUtils.getCurrentDateWithoutTime(), lOADetailBackingBean.managedBean.scLoa.ackDueDate) : ''}"
					disabled="true" size="6" style="text-align:right;"/>
				#{lbl['lbl.sc.days']}
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.off.price']}" />
			</td>
			<td>
				<p:inputText 
					value="#{lOADetailBackingBean.managedBean.scLoa.loaAmt}"
					disabled="true" size="35" style="text-align:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.amount']}" />
			</td>
			<td>
				<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.gstAmt}"
						disabled="#{!lOADetailBackingBean.isGSTRegActive() or !isPendingSubmissionStatus or lOADetailBackingBean.managedBean.readOnly}" size="35" id="gstAmtId" style="text-align:right;">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
						<p:ajax event="blur"
							listener="#{lOADetailBackingBean.calculateOverallAmount(lOADetailBackingBean.managedBean.scLoa.gstAmt)}"
							update="ContractAmtId,agreementReq,@([id$=bondReq]),@this"></p:ajax>
					</p:inputText>
				</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.overall.contract.amount']}" />
			</td>
			<td>
				<p:inputText 
					value="#{lOADetailBackingBean.managedBean.overallContractAmt}"
					 size="35" id="ContractAmtId" style="text-align:right;" disabled="true">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</td>
		</tr>
		<c:if test="#{isDocTypeQuotation}">
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<p:selectOneRadio id="insWarranty" styleClass="commonLabel"
					value="#{lOADetailBackingBean.managedBean.scLoa.insWarrantyReq}"
					required="true"
					label="#{lbl['lbl.sc.loiloa.loa.req.ins.war']}"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
					<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
				</p:selectOneRadio>
				<p:message id="insWarrantyMsg" for="insWarranty" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td width="27%">
				<table>
					<tr>
						<td>
							<p:selectOneRadio id="bondReq" styleClass="commonLabel"
								value="#{lOADetailBackingBean.managedBean.scLoa.bondReq}"
								required="true"
								label="#{lbl['lbl.sc.loiloa.loa.req.perform.bond']}"
								disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.performanceBondMandatory or lOADetailBackingBean.managedBean.readOnly}">
								<f:selectItems value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
								<p:ajax partialSubmit="true" process="@this" update="menuTab" />
							</p:selectOneRadio>
							<p:message id="bondReqMsg" for="bondReq" display="icon" />
						</td>
						<td style="margin-top: -3px">
							<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.req.perform.bond.tooltip']}" />
						</td>
					</tr>
				</table>
			</td>
		</tr>
		</c:if>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.appr.req']}" />
					<p:outputLabel value="*" styleClass="mandatory"
						rendered="#{isEditableStatus}" /></td>
			<td><p:selectOneRadio id="approvalReq" styleClass="commonLabel"
						value="#{lOADetailBackingBean.managedBean.scLoa.approvalReq}"
						required="true" label="#{lbl['lbl.sc.loiloa.loa.appr.req']}"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
						<f:selectItems
							value="#{lOADetailBackingBean.getRadioButtonCodeValues(ParameterTypeConst.yesNoFlag)}" />
					</p:selectOneRadio> <p:message id="approvalReqMsg" for="approvalReq" display="icon" />
			</td>
		</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contract.details']}" toggleable="true" 
	    id="contractDetailsId">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="21%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.cont.type']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td colspan="3">
				<c:if test="#{isEditableStatus and !isDocTypeQuotation}">
					<p:selectOneMenu id="contractType"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractType.parameterId}"
						style="width: 282px;margin-bottom: 5px;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						required="true"
						label="#{lbl['lbl.sc.loiloa.loa.cont.type']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.contractTypes}"
							var="pmParameterDesc" itemLabel="#{pmParameterDesc.codeName}"
							itemValue="#{pmParameterDesc.pmParameter.parameterId}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.contractTypeChanged()}"
							partialSubmit="true" process="@this"
							update="contractDetailsId" />	
					</p:selectOneMenu>
					<p:message id="contractTypeMsg" for="contractType" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus or isDocTypeQuotation}">
					<p:inputText 
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.contractType)}"
						disabled="true" size="35" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.agency']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<c:if test="#{isEditableStatus}">
					<h:panelGroup id="contractAgencyLov" rendered="#{isContractTypeAsMinistry}">
					 <ac:lov 
							disabled="#{lOADetailBackingBean.managedBean.readOnly}" lovId="PM_ORG_PROFILE"
							postUpdateListener="lOADetailBackingBean.contractAgencyChanged()"
							headerText="Contract Agency" selectionMode="single"
							readonly="true" size="35"
							saveObject="lOADetailBackingBean.managedBean.scLoa.contractAgency"
							value="#{lOADetailBackingBean.managedBean.scLoa.contractAgency.orgName}"
							required="true"
							update="@form" />
						</h:panelGroup>
											
						<p:inputText id="contractAgency" disabled="true" style="margin-bottom:5px;" size="35"
									 value="#{lOADetailBackingBean.managedBean.scLoa.contractAgency.orgName}" 
									 rendered="#{isContractTypeCentral}" />
				</c:if>
			</td>
			<td style="width: 10%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.cont.admin']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td style="width: 30%">
				<c:if test="#{isEditableStatus}">
					<p:selectOneMenu id="contractAdmin"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractAdmin.userId}"
						style="width: 215px;"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						required="true"
						label="#{lbl['lbl.sc.loiloa.loa.cont.admin']}">
						
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems value="#{lOADetailBackingBean.managedBean.contractAdminList}"
							var="pmuser" itemLabel="#{pmuser.userName}" itemValue="#{pmuser.userId}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.contractAdminChanged()}"
							partialSubmit="true" process="@this" update="@this" />
					</p:selectOneMenu>
					<p:message id="contractAdminMsg" for="contractAdmin" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.contractAdmin.userName}"
						disabled="true" size="25" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl[lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.period' : 'lbl.sc.loiloa.loa.cont.period']}" />
			</td>
			<td>
				<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.contractDuration}"
							 disabled="true" size="35" style="text-align:right;"/>
			</td>
		</tr>
		<ui:param name="lbleffDate" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.eff.date' : 'lbl.sc.loiloa.loa.cont.eff.date'}" />
		<ui:param name="lblexpDate" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode == ParameterConst.fulfilmentTypeOneOff ? 'lbl.sc.loiloa.loa.comp.exp.date' : 'lbl.sc.loiloa.loa.cont.exp.date'}" />
		<ui:param name="lblexpDateTooltip" value="#{lblexpDate}.tooltip" />
		<tr>
			<td>
				<p:outputLabel value="#{lbl[lbleffDate]}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<p:calendar id="effdate"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
					showOn="button"
					value="#{lOADetailBackingBean.managedBean.scLoa.contractEffDate}"
					mindate="#{DateUtils.getCurrentDateWithoutTime()}"
					required="true"
					readonlyInput="true"
					label="#{lbl[lbleffDate]}"
					style="width: 234px;"
					disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
					<p:ajax event="dateSelect" listener="#{lOADetailBackingBean.contractEffDateChanged()}" update="expdate" />
