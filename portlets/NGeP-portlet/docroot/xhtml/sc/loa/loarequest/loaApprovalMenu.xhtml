<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel id="loaSignerId"
		toggleable="true">
		
		<f:facet name="header">
			<h:outputText value="#{lbl['lbl.sc.loiloa.loa.contract.signer.dtl']}" />
			<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.contract.signer.dtl.tooltip']}" />
		</f:facet>
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="23%">
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.contract.signer']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
			</td>
			<td>
				<c:if test="#{isEditableStatus}">
					<p:selectOneMenu id="contractSigner" 
					disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						value="#{lOADetailBackingBean.managedBean.contractSignerUser.userId}"
						style="width: 276px;margin-bottom: 5px;"
						required="true"
						label="#{lbl['lbl.sc.loiloa.loa.contract.signer']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItems value="#{lOADetailBackingBean.managedBean.contractSignerList}"
							var="contractUser" itemLabel="#{contractUser.userName}"
							itemValue="#{contractUser.userId}" />
							
						<p:ajax event="change" listener="#{lOADetailBackingBean.contractSignerEvent}"
						    partialSubmit="true" process="@this" update="@this loaSignerId" />
					</p:selectOneMenu>
					<p:message id="contractSignerMsg" for="contractSigner" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus}">
					<p:inputText size="34"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractSigner.userName}"
						disabled="true" />
				</c:if>
			</td>
		</tr>
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.signer.desig']}" />
					<p:outputLabel value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:inputText id="loaSignerDesigId"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						maxlength="100"
						value="#{lOADetailBackingBean.managedBean.scLoa.loaSignerDesig}"
						label="#{lbl['lbl.sc.loiloa.loa.signer.desig']}" required="true"
						size="34">
					</p:inputText>
					<p:message id="loaSignerDesigIdIdMsg" for="loaSignerDesigId"
						display="icon" /></td>
			</tr>

		</table>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.request.for.approval']}" rendered="#{lOADetailBackingBean.managedBean.scLoa.approvalReq}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="23%"><p:outputLabel value="#{lbl['lbl.sc.approver']}" />
				<p:outputLabel value="*" styleClass="mandatory"/>
				</td>
				<td><p:selectOneMenu id="loaApprover"
						value="#{lOADetailBackingBean.managedBean.approverUser.userId}"
						disabled="#{!isPendingSubmissionStatus or lOADetailBackingBean.managedBean.readOnly}"
						required="#{lOADetailBackingBean.managedBean.scLoa.approvalReq}"
						label="#{lbl['lbl.sc.approver']}"
						style="width: 276px;margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.approverList}"
							var="pmUser" itemLabel="#{pmUser.userName}"
							itemValue="#{pmUser.userId}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.approverChanged()}"
							partialSubmit="true" process="@this" update="@this" />
					</p:selectOneMenu><p:message id="loaApproverMsg" for="loaApprover"
						display="icon" /> </td>
			</tr>
		</table>
	</p:panel>

     <p:panel header="#{lbl['lbl.sc.remark']}" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" width="18%"></td>

				<td class="TableFieldRight"><p:dataGrid id="catatan"
						emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
						value="#{lOADetailBackingBean.managedBean.scLoa.scLoaRemarks}"
						var="remarkVar" rowIndexVar="remarkIndex" columns="1">
						<table>
							<tr>
								<td rowspan="2" style="vertical-align: top;" align="left">
									<h:graphicImage
										value="#{ctBackingBean.userImagePath(remarkVar.createdUser.loginId)}"
										height="30" width="30" />
								</td>
								<td width="6"></td>
								<td><h:outputText value="#{remarkVar.createdUser.userName}"></h:outputText>,
									<h:outputText id="remarkDate" value="#{remarkVar.createdDate}">
										<f:convertDateTime
											pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
									</h:outputText></td>
							</tr>
							<tr>
								<td></td>
								<td><p:inputTextarea style="width:350px;" maxlength="1000"
								disabled="#{lOADetailBackingBean.managedBean.readOnly}"
										value="#{remarkVar.remark}" rendered="#{remarkIndex==0}"
										id="remark" /> <h:outputText value="#{remarkVar.remark}"
										rendered="#{remarkIndex>0}"
										style="display: inline-block; width:220px;word-wrap: break-word;" />
								</td>

							</tr>
						</table>
					</p:dataGrid></td>
			</tr>
		</table>
	</p:panel>
	
	<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
		<p:dataTable id="apprHistTbl" var="scLoaApproval"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{lOADetailBackingBean.managedBean.scLoaApproval}">
			
			<ac:paginator for="apprHistTbl" />
			
			<p:column headerText="#{lbl['lbl.sc.approved.by']}" style="width:40%">
				#{scLoaApproval.approver.userName}
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.status']}" style="width:35%">
				#{lOADetailBackingBean.getApprovalActionDisplayName(scLoaApproval.approverAction)}
		
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.date']}" style="width:25%">
				<h:outputText value="#{scLoaApproval.approverActionDate}">
					<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
				</h:outputText>
			</p:column>
		</p:dataTable>
	</p:panel>
	
</ui:composition>
