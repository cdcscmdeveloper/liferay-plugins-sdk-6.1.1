<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.perform.bond']}"
		toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.loiloa.bond.letter']}"
			process="@this" style="float:left;" styleClass="blue_font"
			action="#{lOADetailBackingBean.getBondLetterStreamContent}"
			oncomplete="bdLetterDlg.show();">
		</p:commandLink>
		<table style="width: 100%">
			<tr>
				<td style="width: 20%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.bond.res.due.date']}" /></td>
				<td colspan="3" style="width: 80%;"><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.bondResDueDate}"
						size="14" disabled="true" readonly="true">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:inputText> <p:spacer width="10px" /> <p:inputText
						styleClass="ppNumericAlign"
						value="#{!empty lOADetailBackingBean.managedBean.scLoa.bondResDueDate ? DateUtils.getDaysDifference(DateUtils.getCurrentDateWithoutTime(), lOADetailBackingBean.managedBean.scLoa.bondResDueDate) : ''}"
						disabled="true" size="8" /></td>

			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.cont.period']}" /></td>
				<td><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.contractDuration} months"
						disabled="true" size="8" readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.cont.amt']}" /></td>
				<td><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.loaAmt}"
						disabled="true" size="8" readonly="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.bond.percentage']}" /></td>
				<td><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.bondPercentage}"
						disabled="true" size="30" readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bond.amt']}" /></td>
				<td><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.bondAmt}"
						disabled="true" size="30" readonly="true">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText> <p:spacer width="10px" /></td>
			</tr>
			<tr>
				<td></td>
				<td><p:inputTextarea
						value="#{lOADetailBackingBean.managedBean.bondAmountWord}"
						cols="50" rows="3" maxlength="500" style=" margin-bottom:5px;"
						disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dataTable id="performancebondtbl" var="bondList"
		value="#{lOADetailBackingBean.managedBean.scLoa.performanceBonds}"
		rows="10" rowIndexVar="rowIndex">
		<ac:paginator for="performancebondtbl" />
		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.bond.ref.no']}"
			style="width:20%">
			#{bondList.bondRefNo}
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.finan.inst']}"
			style="width:20%">
			#{bondList.financialOrg.finOrgName}
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.amt']}"
			style="width:10%">
			#{bondList.bondAmount}
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.eff.date']}"
			style="width:15%">
			<h:outputText value="#{bondList.bondEffDate}">
				<f:convertDateTime pattern="dd/MM/yyyy" />
			</h:outputText>
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.exp.date']}"
			style="width:15%">
			<h:outputText value="#{bondList.bondExpDate}">
				<f:convertDateTime pattern="dd/MM/yyyy" />
			</h:outputText>
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.att']}"
			style="width:15%">
			<h:outputText value="#{bondList.fileName}" />
		</p:column>
	</p:dataTable>

					value="/resources/ep/images/design/edit.png" />
			</p:commandLink>

	</p:dataTable>
	<p:spacer height="20px" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
			process="@this,performancebondtbl" partialSubmit="true"
			update="performancebondtbl" icon="ui-icon-add" />

		<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
			process="@this" partialSubmit="true" icon="ui-icon-delete" />
	</div>

	<p:dialog id="sampleBondLetterDlg" widgetVar="bdLetterDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="1000px"
		height="500px" styleClass="pop_up_top"
		header="#{lbl['lbl.sc.loiloa.bond.letter']}">
		<p:media value="#{lOADetailBackingBean.bondLetterStreamContent}"
			width="100%" height="450px" player="pdf" />
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.close']}"
						onclick="bdLetterDlg.hide()" icon="ui-icon-cancel" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:dialog>
</ui:composition>
