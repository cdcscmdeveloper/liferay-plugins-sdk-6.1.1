<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<div class="ppRightBtn">
		<p:commandButton value="#{lbl['lbl.so.save']}" icon="ui-icon-save" 
			action="#{lOADetailBackingBean.saveAction}" 
			process="@form" update="@form" />
			
		<c:choose>
			<c:when test="#{isPendingSubmissionStatus}">
				<p:commandButton value="#{lbl['lbl.so.submit']}" icon="ui-icon-submit" 
					action="#{lOADetailBackingBean.submitAction}" 
					process="@form" update="@form"  />
			</c:when>
			<c:when test="#{!empty lOADetailBackingBean.managedBean.taskId}">
				<ui:repeat var="bpmAction" value="#{lOADetailBackingBean.managedBean.outComes}">
					<ui:param name="buttonLabel" value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
					<ui:param name="isReject" value="#{bpmAction == 'REJECT'}" />
					
					<p:commandButton value="#{lbl[buttonLabel]}"  
						styleClass="ui-button"
						icon="ui-icon-#{fn:toLowerCase(bpmAction)}"
						action="#{lOADetailBackingBean.updateBpmTaskAction(bpmAction)}"
						partialSubmit="true"
						process="#{isReject ? '@this' : '@form'}"
						update="#{isReject ? '@this' : '@form'}" />
				</ui:repeat>
			</c:when>
		</c:choose>
	</div>
</ui:composition>
