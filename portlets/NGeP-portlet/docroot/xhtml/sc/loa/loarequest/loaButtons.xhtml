<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<ui:param name="validityDaysExpiredQt"
		value="#{lOADetailBackingBean.checkProposalValidityDateReachByQt(lOADetailBackingBean.managedBean.scQt)}" />

	<h:panelGroup rendered="#{isTrackingDairyView}">
		<table style="width: 100%">
			<tr>
				<td><p:commandButton immediate="true"
						value="#{lbl['lbl.btn.back']}"
						action="#{lOADetailBackingBean.backToPrevious}" /></td>

				<td style="vertical-align: bottom;"><p:commandLink
						value="#{lbl['lbl.td.doc.trackingDiary']}" style="float:right;"
						action="#{pmTrackingDiaryBackingBean.redirectToSupplierTrackingDiary(ParameterConst.doctypeLetterOfAward, lOADetailBackingBean.managedBean.scLoa.loaId, lOADetailBackingBean.isSupplier())}"
						immediate="true" /></td>
			</tr>
		</table>
	</h:panelGroup>

	<div class="ppRightBtn">
		<h:panelGroup rendered="#{!isTrackingDairyView}">
			<c:if test="#{empty lOADetailBackingBean.managedBean.taskId}">

				<p:commandButton immediate="true" value="#{lbl['lbl.btn.back']}"
					rendered="#{lOADetailBackingBean.managedBean.editFlag}"
					style="float:left;" action="#{lOADetailBackingBean.backToPrevious}" />
				<ui:remove>
					Enhancement #21694 START
				</ui:remove>
				<h:panelGroup rendered="#{!lOADetailBackingBean.managedBean.scLoa.brandNew}">
					<p:commandButton value="#{lbl['lbl.btn.reverse']}" id="btnReverse" action="#{lOADetailBackingBean.reverseAction()}"
						rendered="#{isEditableStatus and !isSaveHideSqExpired}" process="@form" update="@form"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();">
						<p:tooltip id="toolTipFade" for="btnReverse" value="#{lbl['lbl.btn.reverse.tooltip']}" position="top"/>
					</p:commandButton>
				</h:panelGroup>				
				<ui:remove>
					Enhancement #21694 END
				</ui:remove>
				<p:commandButton value="#{lbl['lbl.btn.save']}"
					action="#{lOADetailBackingBean.saveAction(false)}"
					rendered="#{isEditableStatus and !isSaveHideSqExpired}" process="@form" update="@form"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />

				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					rendered="#{isPendingSubmissionStatus and validityDaysExpiredQt and isSqStillValid}"
					action="#{lOADetailBackingBean.submitAction}" process="@form"
					update="@form" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				
				<p:commandButton value="#{lbl['lbl.btn.cancel']}"
					rendered="#{!lOADetailBackingBean.managedBean.scLoa.brandNew and isPendingSubmissionStatus and !isSqStillValid}"
					action="#{lOADetailBackingBean.cancelPrepareLoaAction}" process="@form"
					update="@form" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />
			</c:if>

			<c:if test="#{!empty lOADetailBackingBean.managedBean.taskId}">
			<ui:param name="readOnlyTask" value="#{lOADetailBackingBean.managedBean.readOnly}" />
			
			   <p:commandButton value="#{lbl['lbl.btn.save']}"
					action="#{lOADetailBackingBean.saveAction(false)}"
					rendered="#{(isPendingApprovalStatus or isPendingRevApprovalStatus or isPendingRevisionStatus) and !isTrackingDairyView
								 and isSqStillValid}"
				    process="@form" update="@form"
					onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />
					
				<ui:decorate
					template="/WEB-INF/facelets/templates/claim_template.xhtml">
					<ui:define name="outComeSection">
						<ui:repeat var="bpmAction"
							value="#{lOADetailBackingBean.managedBean.outComes}">
							<ui:param name="buttonLabel"
								value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
							<ui:param name="isReject" value="#{bpmAction == 'REJECT'}" />
							<ui:remove>
							Enhancement #21694 START
							</ui:remove>
							<h:panelGroup rendered="#{bpmAction == 'REVISE'}">
								<p:commandButton value="#{lbl['lbl.btn.supplierAction']}"
									rendered="#{isPendingVerification and isSqStillValid}"
									onstart="blockWidget.show();cd.show();"
									oncomplete="blockWidget.hide();" />
								<p:confirmDialog
									message="#{lbl['lbl.sc.loa.supplier.reviseDocument']}"
									header="#{lbl['lbl.sc.dialog.cofirm.header']}"
									severity="alert" widgetVar="cd">
									<div class="ppRightBtn">
										<p:commandButton value="#{lbl['lbl.btn.yes']}"
											process="@form"
											update="@all"
											actionListener="#{lOADetailBackingBean.approveBeforeupdateBpmTaskAction(bpmAction)}"
											onclick="blockWidget.show();"
											oncomplete="cd.hide();blockWidget.hide();" id="submitReviseLOA"
											partialSubmit="true" immediate="true" />
										<p:commandButton value="#{lbl['lbl.btn.no']}"
											oncomplete="cd.hide();" />
									</div>
								</p:confirmDialog>
							</h:panelGroup>
							<ui:remove>
							Enhancement #21694 END
							</ui:remove>
							<h:panelGroup rendered="#{(bpmAction != 'CANCEL') and (bpmAction !='REVISE')}">
	                            <!-- 20190405@asyrafhaziq - CR(25062)- Start -->
								<!-- changes the calling action   -->
								<p:commandButton value="#{lbl[buttonLabel]}"
									styleClass="ui-button" onstart="blockWidget.show();"
									rendered="#{!isPendingVerification and isSqStillValid}"
									oncomplete="blockWidget.hide();"
									action="#{lOADetailBackingBean.approveBeforeupdateBpmTaskAction(bpmAction)}"
									partialSubmit="true" process="#{isReject ? '@this' : '@form'}"
									update="#{isReject ? '@this' : '@form'}" />
	
								<p:commandButton value="#{lbl[buttonLabel]}"
									styleClass="ui-button" onstart="blockWidget.show();"
									rendered="#{isPendingVerification and isSqStillValid}"
									oncomplete="blockWidget.hide();"
									disabled="#{lOADetailBackingBean.managedBean.verifyBtnFlag}"
									action="#{lOADetailBackingBean.approveBeforeupdateBpmTaskAction(bpmAction)}"
									partialSubmit="true" process="#{isReject ? '@this' : '@form'}"
									update="#{isReject ? '@this' : '@form'}" />
								 <!-- 20190405@asyrafhaziq - CR(25062)- End -->
							</h:panelGroup>	
							
							<h:panelGroup rendered="#{bpmAction == 'REJECT'}">
								<p:commandButton value="#{lbl['lbl.btn.reject']}"
								rendered="#{!isSqStillValid}"
								action="#{lOADetailBackingBean.approveBeforeupdateBpmTaskAction(bpmAction)}" process="@form"
								update="@form" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" />
							</h:panelGroup>
							
							<h:panelGroup rendered="#{bpmAction == 'CANCEL'}">
								<p:commandButton value="#{lbl['lbl.btn.cancel']}"
								rendered="#{!isSqStillValid}"
								action="#{lOADetailBackingBean.cancelLoa(bpmAction)}" process="@form"
								update="@form" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" />
							</h:panelGroup>
							<ui:remove>
							Enhancement #22211 START
							</ui:remove>							
							<h:panelGroup rendered="#{bpmAction == 'CANCEL'}">
								<p:commandButton value="#{lbl['lbl.btn.cancel']}" id="cancelLoaBtn"
								rendered="#{isLoaGenerated}"
								action="#{LOACancelDetailBackingBean.cancelationLOA(lOADetailBackingBean.managedBean.scLoa.loaId)}" process="@form"
								update="@form" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" />
							</h:panelGroup>
							<p:tooltip for="cancelLoaBtn">
								<h:outputText value="#{lbl['lbl.sc.loa.cancel.btn.tooltip']}"
									escape="false" />
							</p:tooltip>				
							<ui:remove>
							Enhancement #22211 END
							</ui:remove>
						</ui:repeat>
					</ui:define>
				</ui:decorate>
			</c:if>
		</h:panelGroup>

	</div>
</ui:composition>
