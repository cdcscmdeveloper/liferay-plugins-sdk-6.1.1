<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<ui:param name="validityDaysExpiredQt"
		value="#{lOADetailBackingBean.checkProposalValidityDateReach(lOADetailBackingBean.managedBean.scQt.proposalValidityEndDate)}" />

	<div class="ppRightBtn">
		<p:commandButton immediate="true" value="#{lbl['lbl.btn.back']}"
			rendered="#{lOADetailBackingBean.managedBean.editFlag or isTrackingDairyView}"
			style="float:left;" action="#{lOADetailBackingBean.backToPrevious}" />
		<ui:decorate
			template="/WEB-INF/facelets/templates/claim_template.xhtml">
			<ui:define name="outComeSection">

				<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
					style="float:right;" rendered="#{isTrackingDairyView}"
					action="#{dpTrackingDiaryBackingBean.goToTrackingDiarySearch(lOADetailBackingBean.managedBean.dpObj)}"
					immediate="true" />

				<h:panelGroup id="loaButtonsId" rendered="#{!isTrackingDairyView}">

					<p:commandButton value="#{lbl['lbl.btn.save']}"
						action="#{lOADetailBackingBean.saveAction}"
						rendered="#{isEditableStatus}" process="@form" update="@form"
						onstart="blockWidget.show();" oncomplete="blockWidget.hide();" />

					<c:choose>
						<c:when test="#{isPendingSubmissionStatus}">
							<p:commandButton value="#{lbl['lbl.btn.submit']}"
								action="#{lOADetailBackingBean.submitAction}" process="@form"
								update="@form" onstart="blockWidget.show();"
								oncomplete="blockWidget.hide();" />
						</c:when>
						<c:when test="#{!empty lOADetailBackingBean.managedBean.taskId}">
							<ui:repeat var="bpmAction"
								value="#{lOADetailBackingBean.managedBean.outComes}">
								<ui:param name="buttonLabel"
									value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
								<ui:param name="isReject" value="#{bpmAction == 'REJECT'}" />

								<p:commandButton value="#{lbl[buttonLabel]}"
									styleClass="ui-button" onstart="blockWidget.show();"
									rendered="#{!isPendingVerification and validityDaysExpiredQt}"
									oncomplete="blockWidget.hide();"
									action="#{lOADetailBackingBean.updateBpmTaskAction(bpmAction)}"
									partialSubmit="true" process="#{isReject ? '@this' : '@form'}"
									update="#{isReject ? '@this' : '@form'}" />


								<p:commandButton value="#{lbl['lbl.btn.verify']}"
									styleClass="ui-button" onstart="blockWidget.show();"
									rendered="#{isPendingVerification and validityDaysExpiredQt}"
									oncomplete="blockWidget.hide();"
									disabled="#{lOADetailBackingBean.managedBean.verifyBtnFlag}"
									action="#{lOADetailBackingBean.updateBpmTaskAction(bpmAction)}"
									partialSubmit="true" process="#{isReject ? '@this' : '@form'}"
									update="#{isReject ? '@this' : '@form'}" />

							</ui:repeat>
						</c:when>
					</c:choose>

				</h:panelGroup>
			</ui:define>
		</ui:decorate>
	</div>
</ui:composition>
