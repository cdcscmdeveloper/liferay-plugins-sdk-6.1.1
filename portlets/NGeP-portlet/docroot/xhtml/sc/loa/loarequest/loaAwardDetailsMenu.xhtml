<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:include src="../shared/loaInstructionHeader.xhtml" />
	
	<ui:param name="isZonal" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.zonal}" />
	<ui:param name="loa" value="#{lOADetailBackingBean.managedBean.scLoa}" />
	<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}" toggleable="true">
		<h:outputText styleClass="instruction" rendered="#{isSupplierAckStatus}"
			value="#{lbl['lbl.sc.item.codification.instruction']}" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="17%">
				<h:outputLabel value="#{lbl['lbl.sc.award.type']}" />
			</td>
			<td width="83%">
				<p:inputText
					value="#{dpLOABackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.scLoiLoa.recommendTypeCode)}"
					disabled="true" size="30" readonly="true" />
			</td>
		</tr>
		</table> 
		<p:dataTable id="itemtbl" var="scLoiLoaItem"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoaItems}" rows="10">
			
			<ac:paginator for="itemtbl" />
			
			<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}">
				<p:commandLink id="zoneName"
				disabled="#{lOADetailBackingBean.managedBean.readOnly}"
					oncomplete="zoneLocPopup.show();"
					partialSubmit="true" process="@this" update="@([id$=zoneLocPopup])">
					
					<f:setPropertyActionListener target="#{zoneLocationBackingBean.tplSpecZoneDtl}" value="#{scLoiLoaItem.tplSpecZoneDtl}" />
					
					<h:outputText value="#{scLoiLoaItem.tplSpecZoneDtl.zoneName}" />
				</p:commandLink>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.item']}">
				#{scLoiLoaItem.scRequestItem.itemName} <br /><br />
				<h:outputText value="#{scLoiLoaItem.scRequestItem.cmItem.extensionCode}" rendered="#{scLoiLoaItem.scRequestItem.cmItem != null}" />
			</p:column>
			
			<p:column style="width:7%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:7%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
			</p:column>
			
			<p:column style="width:8%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
			</p:column>
			
			<p:column style="width:7%;white-space:normal;text-align:right;" headerText="#{lbl['lbl.tpl.spec.content.duration.month']}">
				<h:outputText value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:8%; text-align:right;" headerText="#{lbl['lbl.sc.quantity']}">
				<h:panelGroup rendered="#{!empty scLoiLoaItem.tplSpecTierQty}">
					<h:outputText value="#{scLoiLoaItem.tplSpecTierQty.fromQty}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{empty scLoiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{!empty scLoiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value="#{scLoiLoaItem.tplSpecTierQty.toQty}" rendered="#{!empty scLoiLoaItem.tplSpecTierQty.toQty}">
						<f:converter converterId="dynamicNumberConverter" />
						<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom.uomCode)}" />
					</h:outputText>
				</h:panelGroup>
				<h:outputText value="#{scLoiLoaItem.qty}" rendered="#{scLoiLoaItem.tplSpecTierQty eq null}">
					<f:converter converterId="dynamicNumberConverter" />
					<f:attribute name="pattern" value="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom.uomCode)}" />
				</h:outputText>
			</p:column>

			<p:column style="width:12%;" headerText="#{lbl['lbl.sc.uom']}">
				#{scLoiLoaItem.scRequestItem.uom.uomName}
			</p:column>

			<p:column style="width:12%; text-align:right;" headerText="#{lbl['lbl.sc.unit.price']}">
				<f:facet name="footer">
					<h:outputText value="#{lbl['lbl.sc.total']}" />
				</f:facet>	
				
				<h:outputText value="#{scLoiLoaItem.unitPrice}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>
			
			<p:column style="width:12%; text-align:right;" headerText="#{lbl['lbl.sc.sub.total']}">
				<f:facet name="footer">
					<h:outputText value="#{lOADetailBackingBean.managedBean.scLoa.loaAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</h:outputText>
				</f:facet>
				
				<h:outputText value="#{lOADetailBackingBean.calcSubTotalPrice(scLoiLoaItem)}" rendered="#{scLoiLoaItem.tplSpecTierQty eq null}">>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</h:outputText>
			</p:column>

			<p:column rendered="#{isSupplierAckStatus}">
				<f:facet name="header">
					#{lbl['lbl.sc.action']}
				</f:facet>
				<p:commandButton value="#{lbl['lbl.btn.assign']}" 
					disabled="#{lOADetailBackingBean.managedBean.readOnly}"
					action="#{lOADetailBackingBean.assignProductCode(scLoiLoaItem)}" />
			</p:column>
		</p:dataTable>
	</p:panel>
	
	<c:if test="#{isZonal}">
		<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
	</c:if>
</ui:composition>
