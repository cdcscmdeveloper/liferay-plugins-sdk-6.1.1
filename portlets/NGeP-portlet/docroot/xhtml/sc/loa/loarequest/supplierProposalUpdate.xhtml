<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
			
	<ui:define name="contentSection">

		<p:messages id="suppProposalUpdateMsg" showDetail="true"
			autoUpdate="#{lOADetailBackingBean.managedBean.autoUpdate}"
			closable="true" showSummary="false" severity="error, info" />

		<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
			toggleable="true">
			<p:outputPanel id="suppProposalUpdate">
				<div style="width: 100%">
					<table width="100%">
						<tr>
							<td>
								<div style="text-align: left !important">
									<p:commandButton value="#{lbl['lbl.cm.back']}" immediate="true"
										action="#{lOADetailBackingBean.onBackToZoneItemDetailsTab}" />
								</div>
							</td>
							<td>
								<div style="text-align: right !important">
									<p:commandButton value="#{lbl['lbl.sm.button.save']}"
										action="#{lOADetailBackingBean.onSaveSupplierOffer('SAVE')}"
										rendered="#{!isTrackingDairyView}" />
									<p:commandButton value="#{lbl['lbl.btn.complete']}"
										action="#{lOADetailBackingBean.onClickSupplierProposalUpdateCompleteButton()}"
										rendered="#{!isTrackingDairyView}" />
								</div>
							</td>
						</tr>
					</table>
				</div>
			</p:outputPanel>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.update.supplier.offer.tooltip']}"
			toggleable="true">

			<h:outputText styleClass="instruction" escape="false"
				value="#{lbl['lbl.sc.supplier.offer.screen.instruction']}" />
			<p:graphicImage value="/css/images/design/ico-refresh.png"
				id="supplierUpdateInstructionIcon"
				style="max-width: 16px; padding-right: 7px; padding-left: 7px;" />
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.supplier.offer.screen.instruction.end']}" />
			<br />
			<br />
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr valign= "top" >
					<td width="15%"><h:outputLabel style="float:left;"
							value="#{lbl['lbl.sc.price.inquiry.item.name']}" /></td>
					<td><h:outputLabel value=":" /></td>
					<td width="85%"><h:outputText id="itemName"
							value="#{lOADetailBackingBean.selectedScLoiLoaItem.scRequestItem.itemName}"
							style="width:310px;">
						</h:outputText></td>
				</tr>
				<tr valign= "top" >
					<td width="15%"><h:outputLabel style="float:left;"
							value="#{lbl['lbl.sc.supplier.offer']}" /></td>
					<td><h:outputLabel value=":" /></td>
					<td width="85%"><h:outputText id="supplierOffer" rendered="#{!isMultipleSuppOffer}"
							value="#{empty lOADetailBackingBean.selectedSupplierOffer ? lOADetailBackingBean.notAvailabilityStr : lOADetailBackingBean.selectedSupplierOffer}"
							style="display:block;width:310px;">
						</h:outputText>
						<h:outputText id="supplierOfferMultiple" rendered="#{isMultipleSuppOffer}" escape="false"
							value="#{empty lOADetailBackingBean.selectedSupplierOffer ? lOADetailBackingBean.notAvailabilityStr : lOADetailBackingBean.selectedSupplierOffer}"
							style="display:block;width:310px;float:left;">
						</h:outputText>
						</td>
				</tr>
				<tr>
					<td width="15%"> <p:outputLabel style="float:left;"
						value="*" styleClass="mandatory" /><h:outputLabel style="float:left;"
							value="#{lbl['lbl.sc.new.supplier.offered']}" /></td>
					<td><h:outputLabel value=":" /></td>
					<td width="85%"><p:inputText id="newSupplierOfferedInput"
							value="#{lOADetailBackingBean.managedBean.newSupplierOffered}"
							style="width:310px;" maxlength="1000" 
							disabled="#{isTrackingDairyView}">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputText> <p:spacer width="10" />
						<c:if test="#{!isTrackingDairyView}">
						<p:commandLink
							id="newSupplierOfferedReset" update="newSupplierOfferedInput"
							action="#{lOADetailBackingBean.onResetNewSupplierOffered}" >
							<p:graphicImage value="/css/images/design/ico-refresh.png" />
						</p:commandLink>
						</c:if></td>
				</tr>
				<tr>
					<td width="15%"> <p:outputLabel style="float:left;"
						value="*" styleClass="mandatory" /><h:outputLabel style="float:left;"
							value="#{lbl['lbl.sc.justification']}" /></td>
					<td><h:outputLabel value=":" /></td>
					<td width="85%"><p:inputText
							id="supplierUpdateProposalJustification"
							value="#{lOADetailBackingBean.managedBean.newSupplierJustification}"
							style="width:310px;" maxlength="200" disabled="#{isTrackingDairyView}">
							<p:ajax partialSubmit="true" process="@this" update="@this" />
						</p:inputText> <ac:iconTooltip
							value="#{lbl['lbl.sc.justification.is.mandatory']}" /></td>
				</tr>
			</table>
			<br />
			<p:dataTable id="itemSpecDescTable"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="itemSpec" rowIndexVar="index"
				value="#{lOADetailBackingBean.managedBean.scLoiLoaItemSpecsList}"
				style="width:40%;">
				<p:column headerText="#{lbl['lbl.tpl.spec.content.specification']}"
					style="width:45%; white-space:normal; text-align: center;">
					<p:inputTextarea value="#{itemSpec}" maxlength="200" rows="3"
						style="width:98%;" autoResize="false" disabled="true" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<c:if test="#{isZonal}">
			<ui:include src="/xhtml/tpl/spec/zoneLocPopup.xhtml" />
		</c:if>
	</ui:define>
</ui:composition>
