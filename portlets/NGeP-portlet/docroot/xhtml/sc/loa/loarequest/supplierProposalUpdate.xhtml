<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<p:messages id="suppProposalUpdateMsg" showDetail="true"
			autoUpdate="true" closable="true" showSummary="false"
			escape = "false"
			severity="error, info" />

		<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
			toggleable="true">
			<p:outputPanel id="suppProposalUpdate">
				<div style="width: 100%">
					<table style="width: 100%;">
						<tr>

							<td colspan="4" style="text-align: left"><p:commandButton
									value="#{lbl['lbl.btn.back']}" immediate="true"
									action="#{lOADetailBackingBean.onBackToZoneItemDetailsTab}">
								</p:commandButton></td>
							<td colspan="4" style="text-align: right"><p:commandButton id="resetBtn"
									value="#{lbl['lbl.btn.reset.all']}"
									action="#{lOADetailBackingBean.onResetAll}"
									disabled="#{isTrackingDairyView}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									title="#{lbl['lbl.sc.supplier.proposal.reset.all.button.tooltip']}">
								</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.save']}"
									disabled="#{isTrackingDairyView}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									action="#{lOADetailBackingBean.onSaveSupplierOffer('SAVE')}">
								</p:commandButton> <p:commandButton value="#{lbl['lbl.btn.complete']}"
									disabled="#{isTrackingDairyView}"
									onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
									action="#{lOADetailBackingBean.onClickSupplierProposalUpdateCompleteButton()}">
								</p:commandButton></td>
						</tr>
					</table>
				</div>
			</p:outputPanel>
		</p:panel>

		<p:panel id="suppliersProposalSpecificationUpdateId"
			header="#{lbl['lbl.sc.update.supplier.offer.tooltip']}"
			toggleable="true">
			<h:outputText styleClass="instruction"
				value="#{lbl['lbl.sc.supplier.offer.screen.instruction']}" />
			<table>
				<tr>
					<br />
					<br />
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.price.inquiry.item.name']}"></h:outputLabel></td>
					<td colspan="3"><h:outputText
							style="width:24%;white-space: normal;"
							value="#{lOADetailBackingBean.managedBean.itemNamePopup}" /></td>
				</tr>
				<tr>
					<td valign="top"><h:outputLabel
							value="#{lbl['lbl.sc.justification']}"></h:outputLabel> <p:outputLabel
							value="* " styleClass="mandatory" /></td>
					<td colspan="3"><p:inputTextarea
							label="#{lbl['lbl.sc.justification']}" id="justification"
							disabled="#{isTrackingDairyView}"
							value="#{lOADetailBackingBean.managedBean.newSupplierJustification}"
							style="width:800px; margin-bottom:5px;" maxlength="1000" rows="5"
							validatorMessage="#{lbl['lbl.sc.validate.onethousand.charLimit']}"
							onkeyup="limitTextArea(this,1000);"
							onkeydown="limitTextArea(this,1000);"
							onmouseout="limitTextArea(this,1000);"
							autoResize="false">
							<p:ajax event="change" process="@this" update="@this" />
							<f:validateLength for="justification" maximum="1000" />
						</p:inputTextarea> <ac:iconTooltip value="#{lbl['lbl.sc.supplier.proposal.justification.tooltip']}" />
						<p:message id="justificationMsg" for="justification"
							display="icon" /></td>
				</tr>
			</table>
			<table
				style="border: 1px solid #e8e8e8; width: 100%; border-collapse: collapse;">
				<tr bgcolor="#2c576e"
					style="border: 1px solid #e8e8e8; border-collapse: collapse;">
					<th
						style="width: 30%; border: 1px solid #e8e8e8; border-collapse: collapse;">
						<table style="width: 100%;">
							<tr>
								<td>
									<div>
										<p style="font-size: 12px; font-weight: bold; font-family: Arial; color: white; text-align: center;">#{lbl['lbl.sc.specification']}</p>
									</div>
								</td>
							</tr>
						</table>
					</th>
					<th
						style="width: 30%; border: 1px solid #e8e8e8; border-collapse: collapse;">
						<table	style="width: 100%;">
							<tr>
								<td>
									<div>
										<p id="supplierOffer"
											style="font-size: 12px; font-weight: bold; font-family: Arial; color: white; text-align: center;">
											#{lbl['lbl.sc.supplier.offer']}<ac:iconTooltip 
											value="#{lbl['lbl.sc.supplier.offer.tooltip']}" /></p>
									</div>
								</td>
							</tr>
						</table>
					</th>
					<th
						style="width: 40%; border: 1px solid #e8e8e8; border-collapse: collapse;">
						<table style="width: 100%;">
							<tr>
								<td style="width: 35%; text-align: right;"><div>
										<p style="color: red;">*</p>
									</div></td>
								<td>
									<div>
										<p id="newSupplierOffer"
											style="font-size: 12px; font-weight: bold; font-family: Arial; color: white; text-align: left;">#{lbl['lbl.sc.new.supplier.offer']}  <ac:iconTooltip
											value="#{lbl['lbl.sc.new.supplier.offer.specification.tooltip']}" /></p>
										
									</div>
								</td>
							</tr>
						</table>
					</th>
				</tr>

				<c:forEach id="itemSpecDescTable"
					items="#{lOADetailBackingBean.managedBean.scLoiLoaItemSpecsList}"
					var="itemSpec" varStatus="varStatus"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">

					<tr style="border: 1px solid #e8e8e8;">
						<c:choose>
							<c:when test="#{varStatus.index % 2 != '0'}">
								<td
									style="vertical-align: top;padding-left: 5px;background-color: #e8e8e8; border: 1px solid #e8e8e8; border-collapse: collapse; text-align: left; word-break:break-word;">
									<h:outputText value="#{itemSpec}" escape="false"/></td> <!-- //36103 @zaim -->
							</c:when>
							<c:otherwise>
								<td
									style="vertical-align: top;padding-left: 5px;border: 1px solid #e8e8e8; border-collapse: collapse; text-align: left; word-break:break-word;">
									<h:outputText value="#{itemSpec}" escape="false"/></td> <!-- //36103 @zaim -->
							</c:otherwise>
						</c:choose>
						<c:if test="#{varStatus.index == '0'}">
							<!-- //36103 - start @zaim add word-break:break-word; -->
							<td
								rowspan="#{lOADetailBackingBean.managedBean.scLoiLoaItemSpecsList.size()}"
								style="vertical-align: top;padding-left: 5px;border: 1px solid #e8e8e8; border-collapse: collapse; text-align: left; word-break:break-word;"><h:outputText
									id="supplierOffered" rendered="#{!isMultipleSuppOffer}"
									value="#{empty lOADetailBackingBean.managedBean.selectedSupplierOffer  ? lOADetailBackingBean.notAvailabilityStr : lOADetailBackingBean.managedBean.selectedSupplierOffer}"
									style="display:block;width:100%; white-space: pre-wrap;"> <ui:remove>#36634 - add white-space: pre-wrap;</ui:remove>
								</h:outputText> <h:outputText id="supplierOfferMultiple"
									rendered="#{isMultipleSuppOffer}" escape="false"
									value="#{empty lOADetailBackingBean.managedBean.selectedSupplierOffer ? lOADetailBackingBean.notAvailabilityStr : lOADetailBackingBean.managedBean.selectedSupplierOffer}"
									style="display:block;width:100%;float:left; word-break:break-word;">
								</h:outputText></td>
								<!-- //36103 - end @zaim add word-break:break-word; -->
							<td
								rowspan="#{lOADetailBackingBean.managedBean.scLoiLoaItemSpecsList.size()}"
								style="vertical-align: top;border: 1px solid #e8e8e8; border-collapse: collapse; text-align: right;">
								<p:inputTextarea id="newSupplierOfferedInput"
									style="resize: vertical;width:calc(100% - 15px); height: 10em; top: 0;"
									value="#{lOADetailBackingBean.managedBean.newSupplierOffered}"
									disabled="#{isTrackingDairyView}" maxlength="1000"
									onkeyup="limitTextArea(this,1000);"
									validatorMessage="#{lbl['lbl.sc.validate.onethousand.charLimit']}"
									onkeydown="limitTextArea(this,1000);"
									onmouseout="limitTextArea(this,1000);">
									<p:ajax event="change" process="@this" update="@this" />
									<f:validateLength for="newSupplierOfferedInput" maximum="1000" />
								</p:inputTextarea>
							</td>
						</c:if>
					</tr>
				</c:forEach>
			</table>
		</p:panel>
		<p:confirmDialog
			message="#{lbl['lbl.sc.supplier.proposal.reset.all.confirmation.text.dialog']}"
			severity="alert" widgetVar="resetConfirmDlg" closable="true"
			appendToBody="true" header="#{lbl['lbl.sc.supplier.proposal.reset.all.confirmation.title.dialog']}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}" partialSubmit="true"
					process="@this" update="suppliersProposalSpecificationUpdateId"
					action="#{lOADetailBackingBean.onResetAllAction}"
					onstart="resetConfirmDlg.hide();blockWidget.show();"
					oncomplete="blockWidget.hide();" />
				<p:commandButton value="#{lbl['lbl.btn.no']}" partialSubmit="true"
					onclick="resetConfirmDlg.hide();" />
			</div>
		</p:confirmDialog>
	</ui:define>
</ui:composition>
