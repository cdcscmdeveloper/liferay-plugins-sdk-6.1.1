<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ac:lovPopup />
	
	<ui:include src="../shared/loaInstructionHeader.xhtml"/>

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contract.signer']}"
		id="loaletterOfAcceptancePanelIds" toggleable="true">
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%" style="margin-top: 25px !important; margin-bottom: 25px !important;">
			<tr>
				<td width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.gov.sign.date']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td><p:calendar id="govSignDate"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
						showOn="button"
						value="#{lOADetailBackingBean.managedBean.scLoa.govtSignDate}"
						required="true"
						readonlyInput="true"
						label="#{lbl['lbl.sc.loiloa.loa.gov.sign.date']}" size="31"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}">
						<p:ajax event="dateSelect" />
					</p:calendar> <ac:iconTooltip
						value="#{lbl['lbl.sc.loiloa.loa.government.sign.date.tooltip']}" />
					<p:message id="govSignDateMsg" for="govSignDate" display="icon" />
				</td>
			</tr>
			<!-- 20230111@Haziq - #12487&29693 -start  -->
			<tr>
				<td width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.contract.signer']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td colspan="3">
				
					<p:inputText id="contractSigner" disabled="true" size="106"
						value="#{lOADetailBackingBean.managedBean.scLoa.contractSigner.salutationCode.salutationName.concat(' ').concat(lOADetailBackingBean.managedBean.scLoa.contractSigner.userName)}"
						rendered="#{!isEditableStatus}" />
						
					<c:if test="#{isEditableStatus}">

						<p:outputPanel id="opPtjOrgCode" >
							<p:inputText 
								size="106"
								id="itSelectedUserPtj" 
								value="#{lOADetailBackingBean.managedBean.scLoa.contractSigner.salutationCode.salutationName.concat(' ').concat(lOADetailBackingBean.managedBean.scLoa.contractSigner.userName)}"
								readonly="true"
								/>
							&#160;
							<p:commandLink id="ptjSearchCL" partialSubmit="true"
								disabled="#{lOADetailBackingBean.managedBean.selectedOrgType.parameterId==null}"
								process="@this" update=":form:userPtjOrg:userPtjPopup"
								action="#{userOrganisationSearchBackingBean.initPtjPopupDefaultMinistry(lOADetailBackingBean.managedBean.ministryOrgProfile.orgProfileId)}"
								oncomplete="userPtjPopup.show();" >
								<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
							</p:commandLink>
						</p:outputPanel>

						<h:panelGroup rendered="#{lOADetailBackingBean.managedBean.selectedOrgType.parameterCode eq ParameterConst.orgTypePtj
							or lOADetailBackingBean.managedBean.selectedOrgType.parameterCode eq ParameterConst.orgTypePtjGroup}">
							<ac:userPtjPopup 
								id="userPtjOrg"
								orgTypeParamCode="#{lOADetailBackingBean.managedBean.selectedOrgType.parameterCode}"
								okAction="lOADetailBackingBean.userPtjListener" update=":form:opPtjOrgCode,:form:itSelectedUserPtj,:form:loaSignerDesigId"
								includeUser="true" 
								includePegawaiPengawal="false" />
						</h:panelGroup>
					</c:if>
				</td>
				
			</tr>
			<!-- 20230111@Haziq - #12487&29693 - end  -->
			<tr>
				<td width="21%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.signer.desig']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isEditableStatus}" />
				</td>
				<td>
				
				   <p:inputText id="loaSignerDesigId"
						disabled="#{!isEditableStatus or lOADetailBackingBean.managedBean.readOnly}"
						maxlength="100"
						value="#{lOADetailBackingBean.managedBean.scLoa.loaSignerDesig}"
						label="#{lbl['lbl.sc.loiloa.loa.signer.desig']}" required="true"
						size="40">
					</p:inputText>
					<p:message id="loaSignerDesigIdIdMsg" for="loaSignerDesigId"
						display="icon" />
				
				</td>
				
			</tr>
			
		</table>
		
		<p:dataTable id="contentsTbl" widgetVar="contentsTblWidget"
			var="scLoaReport"
			rowIndexVar="rowIndex"
			value="#{lOADetailBackingBean.managedBean.scLoa.scLoaReports}"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}" rows="10"
			rowKey="#{scLoaReport}">
			<ac:paginator for="contentsTbl" />

			<p:column style="width:2%">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selectAllNegoLoc" disabled="true"
						value="#{lOIDetailBackingBean.flag}"
						rendered="#{isEditableStatus}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=loaletterOfAcceptancePanelIds])"
							listener="#{lOADetailBackingBean.selectAllDocuments}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{scLoaReport.selected}"
					disabled="#{!empty scLoaReport.pmDocument or lOADetailBackingBean.managedBean.readOnly}">
					<p:ajax partialSubmit="true" process="@this"
						update="@([id$=loaletterOfAcceptancePanelIds])" />
				</p:selectBooleanCheckbox>
			</p:column>


			<p:column headerText="#{lbl['lbl.sc.content']}">
				<h:inputText style="width:60%" value="#{scLoaReport.title}"
				    label="#{lbl['lbl.sc.content']}"
				    id="contendId"
				    required="true" 
					disabled="#{lOADetailBackingBean.managedBean.readOnly}"
					rendered="#{empty scLoaReport.pmDocument}">
					<p:ajax event="keyup" />
				</h:inputText>
				<!-- #25025 - start -->
				<h:outputText value="#{lOADetailBackingBean.setValueLowercase(scLoaReport.title,21)}"
					rendered="#{!empty scLoaReport.pmDocument}" />
				<!-- #25025-end -->	
				<h:panelGroup id="SuratSetujuTerimaQtLoaId"
					rendered="#{(scLoaReport.pmDocument.docDefinitionTypeCode.parameterCode eq 'UD' or scLoaReport.pmDocument.docDefinitionTypeCode.parameterCode eq 'UP') and isPendingSubmissionStatus}">
					<span style="color: red;">*</span>
				</h:panelGroup>
				<p:message id="contendIdMsg" for="contendId" display="icon" />
			</p:column>

			<p:column style="text-align: center;"
				headerText="#{lbl['lbl.sc.action']}">
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false" process="@form" update="@form" partialSubmit="true"
					action="#{lOADetailBackingBean.downloadReport(scLoaReport)}"
					rendered="#{scLoaReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload ? !empty scLoaReport.scLoaReportAttachment.fileName : true or
					scLoaReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUploadAndDownload}" />
				<ac:scSingleFileUploadButton id="scDocUploadBtn"
					popupWidgetVar="scDocUploadDlg"
					rendered="#{(isEditableStatus and !lOADetailBackingBean.managedBean.readOnly) and (scLoaReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUpload or 
						scLoaReport.definationType.parameterCode eq ParameterConst.documentDefinitionTypeUploadAndDownload)}"
					attachment="#{scLoaReport.scLoaReportAttachment}"
					update=":#{p:component('contentsTbl')}"
					readonly="#{lOADetailBackingBean.managedBean.readOnly}"
					rowIndex="#{rowIndex}">
					<f:setPropertyActionListener for="actionEvent"
						target="#{lOADetailBackingBean.managedBean.selectedScLoaReport}"
						value="#{scLoaReport}" />
					<f:setPropertyActionListener for="actionEvent"
						target="#{lOADetailBackingBean.managedBean.attachmentDocType}"
						value="LAR" />
				</ac:scSingleFileUploadButton>
			</p:column>
		</p:dataTable>

		<div class="ppRightBtn BtnSpacing">
			<p:commandButton rendered="#{!isPendingVerification}"
				value="#{lbl['lbl.btn.download.all']}" ajax="false"
				styleClass="ui-button"
				action="#{lOADetailBackingBean.downloadAllReports}" />

			<p:commandButton
				value="#{lbl['lbl.sc.loiloa.download.all.and.print']}"
				styleClass="ui-button" update="@form" onclick="printBtn.jq.click();"
				actionListener="#{lOADetailBackingBean.showVerifyButton()}"
				rendered="#{isPendingVerification}" />

			<p:commandButton
				value="#{lbl['lbl.sc.loiloa.download.all.and.print']}" ajax="false"
				partialSubmit="true" process="@form" styleClass="ui-button"
				widgetVar="printBtn" style="display:none;"
				actionListener="#{lOADetailBackingBean.downloadAllReports}" />

			<c:if test="#{isEditableStatus}">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
					disabled="#{lOADetailBackingBean.managedBean.readOnly}"
					process="@this, contentsTbl" partialSubmit="true"
					action="#{lOADetailBackingBean.addLoaContentAction}"
					oncomplete="contentsTblWidget.paginator.endLink.click();"
					update="contentsTbl" />

				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					disabled="#{lOADetailBackingBean.managedBean.readOnly or lOADetailBackingBean.deleteselectedList(lOADetailBackingBean.managedBean.scLoa.scLoaReports)}"
					process="@this, contentsTbl" partialSubmit="true"
					oncomplete="loaReportDeletePopUp.show();"
					update="@([id$=#{loaReportDeleteId}])" />
			</c:if>

		</div>
		<ac:confirmationPopup id="loaReportDeleteId"
			widget="loaReportDeletePopUp"
			okAction="lOADetailBackingBean.deleteLoaDocument" width="400"
			height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
			content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
	</p:panel>
</ui:composition>
