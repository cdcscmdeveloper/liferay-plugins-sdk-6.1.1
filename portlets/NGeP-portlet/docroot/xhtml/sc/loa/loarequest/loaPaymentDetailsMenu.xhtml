<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<c:if test="#{!isSupplierAckStatus}">
		<ui:include src="../shared/loaInstructionHeader.xhtml"/>
	</c:if>
		
	<p:panel header="#{lbl['lbl.sc.loiloa.payment.details']}" toggleable="true">
		<h:outputText styleClass="instruction"
			rendered="#{isPendingSubmissionStatus or isPendingRevisionStatus}"
			escape="false" value="#{lbl['lbl.sc.loiloa.bank.detail.instruction']}" />
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="18%">
				<h:outputLabel value="#{lbl['lbl.sc.account.no']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isSupplierAckStatus}" />
			</td>
			<td>
				<c:if test="#{isSupplierAckStatus}">
					<p:selectOneMenu id="accountNoId"
					disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						value="#{lOADetailBackingBean.managedBean.scLoa.bankAccNo}"
						style="width: 277px;margin-bottom: 5px;"
						required="false"
						label="#{lbl['lbl.sc.account.no']}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.bankList}"
							var="smSupplierBank" 
							itemValue="#{smSupplierBank.accountNo}" itemLabel="#{smSupplierBank.accountNo}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.handleBankDetailsChanged}"
							partialSubmit="true" process="@this" update="bankName, bankBranch, bankAddress" />
					</p:selectOneMenu> <p:message id="accountNoIdMsg" for="accountNoId" display="icon" />
				</c:if>
				<c:if test="#{!isSupplierAckStatus}">
					<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.bankAccNo}" disabled="true" size="40" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sc.bank.name']}" />
			</td>
			<td>
				<p:inputText id="bankName" value="#{lOADetailBackingBean.managedBean.scLoa.bankName}" disabled="true" size="40" />
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sc.bank.branch']}" />
			</td>
			<td>
				<p:inputText id="bankBranch" value="#{lOADetailBackingBean.managedBean.scLoa.bankBranch}" disabled="true" size="40" />
			</td>
		</tr>
		<tr>
			<td valign="top">
				<h:outputLabel value="#{lbl['lbl.sc.bank.address']}" />
			</td>
			<td>
				<p:inputTextarea id="bankAddress" rows="5" 
					value="#{lOADetailBackingBean.getFullAddress(lOADetailBackingBean.managedBean.scLoa.scBankAddress)}"
					style=" margin-bottom:5px; width: 266px;" disabled="true" />
			</td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.procurment.type.category']}" />
			</td>
				<td><p:inputText 
						value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.scLoa.procurementTypeCatId)}"
						size="40" label="#{lbl['lbl.sc.procurment.type.category']}"
						disabled="true" /></td>
			</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.loiloa.proposal.off.price']}" />
			</td>
			<td>
				<c:if test="#{!isZonalWithPaOrPs}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.scLoa.loaAmt}"
						disabled="true" size="35" style="text-align:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</c:if>
				<c:if test="#{isZonalWithPaOrPs}">
					<p:inputText 
						value="#{lOADetailBackingBean.managedBean.totalZonePrice}"
						disabled="true" size="35" style="text-align:right;">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					</p:inputText>
				</c:if>
			</td>
		</tr>
		<!-- Enhncement #24259 #24269 Workaround CJCP (LOA) - QT, DIRECT, DP -->
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.sc.sst.rm']}" /></td>
			<td>
				<p:inputText disabled="true" size="40" style="text-align:right;" 
						value="#{lOADetailBackingBean.managedBean.scLoa.sstAmt}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td></td>
			<td colspan="3">
				<h:outputText styleClass="instruction"
					value=" #{lbl['lbl.sc.sst.offer.price.reminder']}"
					escape="false" /> <BR />
				<!-- <h:outputText styleClass="instruction"
					value=" #{lbl['lbl.sc.gst.remainder.one.instruction']}"
					escape="false"
					rendered = "#{directLOABackingBean.getGstRate() == 6}" />
				<h:outputText styleClass="instruction"
					value=" #{lbl['lbl.sc.gst.remainder.one.instruction.0']}"
					escape="false"
					rendered = "#{directLOABackingBean.getGstRate() == 0}" /> <br /> 
				<h:outputText styleClass="instruction"
					value="#{lbl['lbl.sc.gst.remainder.two.instruction']}"
					escape="false"
					rendered="#{lOADetailBackingBean.managedBean.renderRemainder}" />  -->
			</td>
		</tr>
		<!-- end Enhncement #24259 #24269 -->		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.gst.overall.contract.amount']}" />
			</td>
			<td>
				<p:inputText 
					value="#{lOADetailBackingBean.managedBean.overallContractAmt}"
					 size="40" disabled="true" style="text-align:right;">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</td>
		</tr>
		
		</table>
	</p:panel>
</ui:composition>
