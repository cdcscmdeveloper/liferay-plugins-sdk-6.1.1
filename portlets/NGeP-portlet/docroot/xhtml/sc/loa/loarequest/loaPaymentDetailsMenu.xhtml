<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.payment.details']}" toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="18%">
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.acc.no']}" />
				<p:outputLabel value="*" styleClass="mandatory" rendered="#{isSupplierAckStatus}" />
			</td>
			<td width="82%">
				<c:if test="#{isSupplierAckStatus}">
					<p:selectOneMenu
						value="#{lOADetailBackingBean.managedBean.selectedBankId}"
						style="width: 280px;margin-bottom: 5px;"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
						<f:selectItems
							value="#{lOADetailBackingBean.managedBean.bankList}"
							var="smSupplierBank" 
							itemValue="#{smSupplierBank.supplierBankId}" itemLabel="#{smSupplierBank.accountNo}" />
						<p:ajax event="change"
							listener="#{lOADetailBackingBean.handleBankDetailsChanged}"
							partialSubmit="true" process="@this" update="bankName, bankBranch, bankAddress" />
					</p:selectOneMenu>
				</c:if>
				<c:if test="#{!isSupplierAckStatus}">
					<p:inputText value="#{lOADetailBackingBean.managedBean.scLoa.bankAccNo}" disabled="true" size="50" />
				</c:if>
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.name']}" />
			</td>
			<td>
				<p:inputText id="bankName" value="#{lOADetailBackingBean.managedBean.scLoa.bankName}" disabled="true" size="50" />
			</td>
		</tr>
		<tr>
			<td>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.branch']}" />
			</td>
			<td>
				<p:inputText id="bankBranch" value="#{lOADetailBackingBean.managedBean.scLoa.bankBranch}" disabled="true" size="50" />
			</td>
		</tr>
		<tr>
			<td valign="top">
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.addr']}" />
			</td>
			<td>
				<p:inputTextarea id="bankAddress" cols="50" rows="5" 
					value="#{lOADetailBackingBean.getFullAddress(lOADetailBackingBean.managedBean.scLoa.bankAddress)}"
					style=" margin-bottom:5px;" disabled="true" />
			</td>
		</tr>
		</table>
	</p:panel>
</ui:composition>
