<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.deduction.payment']}" id="deductionPayId" toggleable="true">

		<p:dataTable id="deductTbl" widgetVar="deductTblWidget"
			var="scQtDeduction"
			value="#{lOADetailBackingBean.managedBean.scLoa.scQtDeductions}"
			selection="#{lOADetailBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{scQtDeduction}" rowIndexVar="rowIndex"
			selectionMode="single">

			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update=":form:clausePnl" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update=":form:clausePnl" />

			<ac:paginator for="deductTbl" />

			<p:column>
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{isEditableStatus}" />
					<h:outputText value="#{lbl['lbl.sc.deduction.type']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.deduction.type.tooltip']}" />
				</f:facet>

				<c:if test="#{isEditableStatus}">
					<p:selectOneMenu id="deductionType" label="#{lbl['lbl.sc.deduction.type']}"
						value="#{scQtDeduction.deductionType.parameterId}" required="true">
						<f:selectItems
							value="#{lOADetailBackingBean.getDeductionItemTypeDropdownList()}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form:deductionPayId"
							oncomplete="deductTblWidget.unselectAllRows(); deductTblWidget.selectRow(#{rowIndex}, true);"
							listener="#{lOADetailBackingBean.deductionTypeChange(scQtDeduction)}" />
					</p:selectOneMenu>
					<p:message id="deductionTypeMsg" for="deductionType" display="icon" />
				</c:if>
				<c:if test="#{!isEditableStatus}">
					#{lOADetailBackingBean.getParameterDesc(scQtDeduction.deductionType)}
				</c:if>
			</p:column>

		</p:dataTable>

		<c:if test="#{isEditableStatus}">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
					process="@this, deductTbl" partialSubmit="true"
					action="#{lOADetailBackingBean.addDeductionPaymentAction}"
					oncomplete="deductTblWidget.paginator.endLink.click();"
					update="deductTbl" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					process="@this, deductTbl" partialSubmit="true"
					oncomplete="deductionPayDeletePopUp.show();"
					update="@([id$=#{deductionPayDeleteId}])" />
			</div>
			<ac:confirmationPopup id="deductionPayDeleteId"
				widget="deductionPayDeletePopUp"
				okAction="lOADetailBackingBean.deleteDeductionPaymentAction"
				width="400" height="100"
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		</c:if>

		<br />
		<br />
		<h:outputText value="#{lbl['lbl.sc.deduction.payment']} >" />
		<h:outputText value="#{lbl['lbl.sc.deduction.clauses']} " />
		<h:outputText style="margin-left: 140px;"
			value="#{lOADetailBackingBean.managedBean.clausesTitle}" />
		<h:panelGroup id="clausePnl">
			<p:dataTable id="deductClauseTbl" widgetVar="deductClauseTblWidget"
				var="scQtDeductionClause"
				value="#{lOADetailBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
				selection="#{lOADetailBackingBean.managedBean.selectedDeductionClauses}"
				rowKey="#{scQtDeductionClause}" rowIndexVar="rowIndex">

				<ac:paginator for="deductClauseTbl" />

				<p:column selectionMode="multiple" style="width:2%"
					rendered="#{isEditableStatus}" />

				<p:column style="white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory"
							rendered="#{isEditableStatus}" />
						<h:outputText value="#{lbl['lbl.sc.deduction.clause']}" />
					</f:facet>

					<h:panelGroup rendered="#{empty scQtDeductionClause.pmClause}">
						<p:inputTextarea value="#{scQtDeductionClause.clauseDesc}"
							cols="129" rows="2" maxlength="500" style=" margin-bottom:5px;"
							rendered="#{isEditableStatus}">
							<p:ajax event="keyup" />
						</p:inputTextarea>

						<h:outputText value="#{scQtDeductionClause.clauseDesc}"
							rendered="#{!isEditableStatus}" />
					</h:panelGroup>

					<h:outputText escape="false"
						value="#{scQtDeductionClause.pmClause.clauseDesc}"
						rendered="#{!empty scQtDeductionClause.pmClause}" />

				</p:column>

			</p:dataTable>

			<div class="ppRightBtn">
				<h:panelGroup
					rendered="#{!empty lOADetailBackingBean.managedBean.selectedScQtDeduction and lOADetailBackingBean.managedBean.selectedScQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers and isEditableStatus}">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						process="@this, deductClauseTbl" partialSubmit="true"
						action="#{lOADetailBackingBean.addDeductionClauseAction}"
						oncomplete="deductClauseTblWidget.paginator.endLink.click();"
						update="deductClauseTbl" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						process="@this, deductClauseTbl" partialSubmit="true"
						oncomplete="deductionClauseDeletePopUp.show();"
						update="@([id$=#{deductionClauseDeleteId}])" />
				
				</h:panelGroup>	
			</div>
			<ac:confirmationPopup id="deductionClauseDeleteId"
				widget="deductionClauseDeletePopUp"
				okAction="lOADetailBackingBean.deleteDeductionClause" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
			
		</h:panelGroup>
	</p:panel>
</ui:composition>
