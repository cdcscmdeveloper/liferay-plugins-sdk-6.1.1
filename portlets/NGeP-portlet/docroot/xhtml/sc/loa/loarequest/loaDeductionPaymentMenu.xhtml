<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.deduction.payment']}"
		id="deductionPayId" toggleable="true">

		<p:dataTable id="deductTbl" widgetVar="deductTblWidget"
			var="scQtDeduction"
			value="#{lOADetailBackingBean.managedBean.scLoa.scQtDeductions}"
			selection="#{lOADetailBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{scQtDeduction}" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			selectionMode="single">

			<p:ajax event="rowSelect" partialSubmit="true" process="@this"
				update=":form:deductionPayId" />
			<p:ajax event="rowUnselect" partialSubmit="true" process="@this"
				update=":form:deductionPayId" />

			<ac:paginator for="deductTbl" />

			<p:column style="width:650px;">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory"
						rendered="#{isEditableStatus}" />
					<h:outputText value="#{lbl['lbl.sc.deduction.type']}" />
					<ac:iconTooltip value="#{lbl['lbl.sc.deduction.type.tooltip']}" />
				</f:facet>

				<c:if test="#{isEditableStatus}">
					<h:selectOneMenu id="deductionType" style="width:170px;float: left;"
						label="#{lbl['lbl.sc.deduction.type']}"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						value="#{scQtDeduction.deductionType.parameterId}">
						<f:selectItems
							value="#{lOADetailBackingBean.getDeductionItemTypeDropdownList()}" />
						<p:ajax event="change" partialSubmit="true" process="@this"
							update=":form:deductionPayId, deductionPayAmtId "
							oncomplete="deductTblWidget.unselectAllRows(); deductTblWidget.selectRow(#{rowIndex}, true);"
							listener="#{lOADetailBackingBean.deductionTypeChange(scQtDeduction)}" />
					</h:selectOneMenu>
					<p:message id="deductionTypeMsg" for="deductionType" display="icon" />
					<p:spacer width="5px" />
					<p:inputText value="#{scQtDeduction.deductionDesc}"
						style="width:450px;float:left;" maxlength="255"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						rendered="#{scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeFixed
						or scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeOthers}" >
						<f:ajax></f:ajax>
					</p:inputText>
				</c:if>
				<c:if test="#{!isEditableStatus}">
					#{lOADetailBackingBean.getParameterDesc(scQtDeduction.deductionType)}
				</c:if>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.deduction.amount']}" style="width:150px;">
				<h:panelGroup id="deductionPayAmtId">
					<p:inputText id="amtid" size="30" maxlength="18" required="true"
						label="#{lbl['lbl.sc.deduction.amount']}"
						value="#{scQtDeduction.deductionAmount}"
						disabled="#{!(isPendingSubmissionStatus or isPendingRevisionStatus)}"
						style="margin-right:5px;text-align:right;"
						rendered="#{scQtDeduction.deductionType.parameterCode eq ParameterConst.deductionTypeFixed}">
						<ac:validateNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}"
							maxIntegerDigits="14"></ac:validateNumber>
					</p:inputText>
					<p:message id="amtidMsg" for="amtid" display="icon" />
				</h:panelGroup>
			</p:column>
		</p:dataTable>

		<c:if test="#{isEditableStatus}">
			<div class="ppRightBtn BtnSpacing">
				<p:commandButton value="#{lbl['lbl.btn.add']}"
					disabled="#{lOADetailBackingBean.managedBean.readOnly}"
					process="@this, deductTbl" partialSubmit="true"
					action="#{lOADetailBackingBean.addDeductionPaymentAction}"
					oncomplete="deductTblWidget.paginator.endLink.click();"
					update="deductTbl,deductionPayId" />
				<p:commandButton value="#{lbl['lbl.btn.delete']}"
					disabled="#{lOADetailBackingBean.managedBean.readOnly or null eq lOADetailBackingBean.managedBean.selectedScQtDeduction}"
					process="@this, deductTbl" partialSubmit="true"
					oncomplete="deductionPayDeletePopUp.show();"
					update="@([id$=#{deductionPayDeleteId}])" />
			</div>
			<ac:confirmationPopup id="deductionPayDeleteId"
				widget="deductionPayDeletePopUp"
				okAction="lOADetailBackingBean.deleteDeductionPaymentAction"
				width="400" height="100"
				title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />
		</c:if>

		<h:panelGroup id="clausePnl">
			<h:outputText value="#{lbl['lbl.sc.deduction.payment']} (" />
			<h:outputText
				value="#{lOADetailBackingBean.getParameterDesc(lOADetailBackingBean.managedBean.selectedScQtDeduction.deductionType)} )>" />
			<h:outputText value="#{lbl['lbl.sc.deduction.clauses']} " />

			<p:dataTable id="deductClauseTbl" widgetVar="deductClauseTblWidget"
				var="scQtDeductionClause"
				value="#{lOADetailBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{scQtDeductionClause}" rowIndexVar="rowIndex">

				<ac:paginator for="deductClauseTbl" />

				<p:column style="width:2%">
					<f:facet name="header">
						<p:selectBooleanCheckbox id="selectAllClauses"
							disabled="#{!(isPendingSubmissionStatus or isPendingRevisionStatus)}"
							value="#{lOIDetailBackingBean.flag}"
							rendered="#{isPendingSubmissionStatus or isPendingRevisionStatus}">
							<p:ajax partialSubmit="true" process="@this"
								update="@([id$=clausePnl])"
								listener="#{lOADetailBackingBean.selectAllClauses}"></p:ajax>
						</p:selectBooleanCheckbox>
					</f:facet>
					<p:selectBooleanCheckbox
						rendered="#{empty scQtDeductionClause.pmClause}"
						value="#{scQtDeductionClause.selected}"
						disabled="#{!(isPendingSubmissionStatus or isPendingRevisionStatus)}">
						<p:ajax partialSubmit="true" process="@this"
							update="@([id$=clausePnl])" />
					</p:selectBooleanCheckbox>
				</p:column>

				<p:column style="white-space:normal;">
					<f:facet name="header">
						<h:outputText value="* " styleClass="mandatory"
							rendered="#{isEditableStatus}" />
						<h:outputText value="#{lbl['lbl.sc.deduction.clause']}" />
					</f:facet>

					<h:panelGroup rendered="#{empty scQtDeductionClause.pmClause}">
						<p:inputTextarea value="#{scQtDeductionClause.clauseDesc}"
							disabled="#{!(isPendingSubmissionStatus or isPendingRevisionStatus)}"
							required="true" id="clauseId" onkeyup="limitTextArea(this,500);" onkeydown="limitTextArea(this,500);"
							label="#{lbl['lbl.sc.deduction.clause']}" rows="3"
							autoResize="false" maxlength="500"
							style=" margin-bottom:5px; width:825px">
							<p:ajax event="keyup" />
						</p:inputTextarea>
						<p:message id="clauseIdMsg" for="clauseId" display="icon" />
					</h:panelGroup>

					<h:outputText escape="false"
						value="#{scQtDeductionClause.pmClause.clauseDesc}"
						rendered="#{!empty scQtDeductionClause.pmClause}" />

				</p:column>

			</p:dataTable>

			<div class="ppRightBtn BtnSpacing">
				<h:panelGroup
					rendered="#{!empty lOADetailBackingBean.managedBean.selectedScQtDeduction and isEditableStatus}">
					<p:commandButton value="#{lbl['lbl.btn.add']}"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}"
						process="@this, deductClauseTbl" partialSubmit="true"
						action="#{lOADetailBackingBean.addDeductionClauseAction}"
						oncomplete="deductClauseTblWidget.paginator.endLink.click();"
						update="deductClauseTbl" />
					<p:commandButton value="#{lbl['lbl.btn.delete']}"
						disabled="#{lOADetailBackingBean.managedBean.readOnly or lOADetailBackingBean.deleteselectedList(lOADetailBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses)}"
						process="@this" partialSubmit="true"
						oncomplete="deductionClauseDeletePopUp.show();"
						update="@([id$=#{deductionClauseDeleteId}])" />

				</h:panelGroup>
			</div>
			<ac:confirmationPopup id="deductionClauseDeleteId"
				widget="deductionClauseDeletePopUp"
				okAction="lOADetailBackingBean.deleteDeductionClause" width="400"
				height="100" title="#{lbl['lbl.msg.confirm.delete.header']}"
				content="#{lbl['lbl.msg.confirm.delete']}" update="@form" />

		</h:panelGroup>
	</p:panel>
</ui:composition>
