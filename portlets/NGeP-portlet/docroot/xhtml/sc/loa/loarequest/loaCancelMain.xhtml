<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:include src="../shared/loaInstructionHeader.xhtml" />
	<ui:define name="contentSection">
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />

		<p:panel id="fcReversalDetails" header="#{lbl['lbl.sc.qt.req.dtls']}"
			toggleable="true">
			<p:dataTable id="fcareqdtlsid"
				value="#lOADetailBackingBean.managedBean.scLoa}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				var="reverseDetails">
				<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
					<h:outputText value="Letter of Acceptance Cancellation" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.from.value']}">

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.to.value']}">

				</p:column>
			</p:dataTable>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.approve.list']}" id="approverId"
			toggleable="true" toggleSpeed="500">
			<f:facet name="header">

				<h:outputText value="#{lbl['lbl.sc.approve.list']}" />
			</f:facet>

			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.approverName']}" /></td>
					<td><p:selectOneMenu id="approverNameId"
							label="#{lbl['lbl.sc.approverName']}"
							value="#{lOADetailBackingBean.managedBean.loacancelapproverUser.userId}"
							style="width:360px;" disabled="true" readonly="true">
							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
							<f:selectItems
								value="#{lOADetailBackingBean.managedBean.loacancelapproverList}"
								var="user" itemLabel="#{user.userName}"
								itemValue="#{user.userId}" />
							<p:ajax event="change" update="approverId" />
						</p:selectOneMenu> <p:message id="approverNameIdMsg" for="approverNameId"
							display="icon" /></td>
				</tr>
			</table>
		</p:panel>
		<ac:scRemarkAndAttachment
			remarkList="#{lOADetailBackingBean.managedBean.scLoa.scLoaRemarks}"
			attachmentList="#{lOADetailBackingBean.managedBean.scLoa.scLoaCancelAttachments}"
			showAttachment="true" readonly="true" />

		<p:panel header="#{lbl['lbl.sc.history']}" toggleable="true">
			<p:dataTable id="apprHistTbl" var="scLoaApproval"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{lOADetailBackingBean.managedBean.scLoaApproval}">

				<ac:paginator for="apprHistTbl" />

				<p:column headerText="#{lbl['lbl.sc.approved.by']}"
					style="width:40%">
					<h:outputText value="#{scLoaApproval.approver.userName}"
						rendered="#{scLoaApproval.approverActionDate != null}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.status']}" style="width:35%">
				#{lOADetailBackingBean.getApprovalActionDisplayName(scLoaApproval.approverAction)}
			</p:column>

				<p:column headerText="#{lbl['lbl.sc.date']}" style="width:25%">
					<h:outputText value="#{scLoaApproval.approverActionDate}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText>
				</p:column>
			</p:dataTable>
		</p:panel>

	</ui:define>
</ui:composition>
