<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<div class="ppRightBtn">
		<ui:repeat var="bpmAction"
			value="#{dpLOABackingBean.managedBean.outComes}">
			<ui:param name="buttonLabel"
				value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
						
			<h:panelGroup rendered="#{bpmAction == 'REQUOTE'}">
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
					action="#{dpLOABackingBean.updateBpmTaskAction(bpmAction)}"
					rendered="#{dpLOABackingBean.managedBean.showBPMButtons}"
					partialSubmit="true" process="@form"
					update="@form" />
			</h:panelGroup>
			
			<h:panelGroup rendered="#{bpmAction == 'RERECOMMEND'}">
				<p:commandButton value="#{lbl[buttonLabel]}" styleClass="ui-button"
					action="#{dpLOABackingBean.updateBpmTaskAction(bpmAction)}"
					rendered="#{dpLOABackingBean.managedBean.showBPMButtons and
								dpLOABackingBean.isSqStillValid(dpLOABackingBean.managedBean.currentStatusId)}"
					partialSubmit="true" process="@form"
					update="@form" />
			</h:panelGroup>				
			
		</ui:repeat>
	</div>
</ui:composition>
