<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.perform.bond']}"
		toggleable="true">
		<table style="width: 100%">
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.bond.res.due.date']}" /></td>
				<td colspan="3" style="width: 128px;"><p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.bondDueDate}"
						size="14" disabled="true" readonly="true" /> <p:spacer
						width="10px" /> <p:inputText
						value="#{lOADetailBackingBean.managedBean.scLoa.bondDuration} Days"
						disabled="true" size="8" readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bond.amt']}" /></td>
				<td colspan="3" style="width: 128px;"><p:inputText
						value="#{lOADetailBackingBean.managedBean.bondAmount}"
						disabled="true" size="30" readonly="true" /> <p:spacer
						width="10px" /> <p:inputText value="" disabled="true" size="30"
						readonly="true" /></td>
			</tr>
			<tr>
				<td><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.loa.bond.percentage']}" /></td>
				<td colspan="3" style="width: 128px;"><p:inputText
						value="#{lOADetailBackingBean.managedBean.bondPercentage}"
						disabled="true" size="30" readonly="true" /></td>
			</tr>
		</table>
	</p:panel>
	<p:dataTable id="performancebondtbl" var="bondList"
		value="#{lOADetailBackingBean.managedBean.scBondDtlList}"
		selection="#{lOADetailBackingBean.managedBean.selectScBondDtlList}"
		rows="10" rowKey="#{bondList}" rowIndexVar="rowIndex">

		<ac:paginator for="performId" />

		<p:column selectionMode="multiple" style="width:2%" />

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.bond.ref.no']}"
			style="width:5%">
			<p:inputText value="#{bondList.bondRefNo}" style="width:95%" />
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.finan.inst']}"
			style="width:5%">
			<p:inputText value="#{bondList.institutionName}" style="width:95%" />
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.amt']}"
			style="width:5%">
			<p:inputText value="#{bondList.bondAmount}" style="width:95%" />
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.eff.date']}"
			style="width:5%">
			<!-- <h:outputText value="#{bondList.bondEffDate}" style="width:85%" /> -->
			<p:calendar id="bondeffdate" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
				value="#{bondList.bondEffDate}" />
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.exp.date']}"
			style="width:5%">
			<!-- <h:outputText value="#{bondList.bondExpDate}" style="width:85%" /> -->
			<p:calendar id="bondexpdate" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" showOn="button"
				value="#{bondList.bondExpDate}" />
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.loa.att']}"
			style="width:5%">
			<h:outputText value="#{bondList.scBondDtlAttachment.fileName}"
				rendered="#{!empty bondList.scBondDtlAttachment}" />
		</p:column>

		<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
			style="width:15%">
			<p:commandLink oncomplete="attachDlg.show();return false;"
				update="performancebondtbl">
				<p:graphicImage library="ep/images/design" name="upload.png"
					value="/resources/ep/images/design/upload.png" />
				<f:setPropertyActionListener value="#{bondList}"
					target="#{lOADetailBackingBean.managedBean.scBondDtl}" />
			</p:commandLink>
			<p:spacer width="10" height="5" />
			<p:commandLink>
				<p:graphicImage library="ep/images/design" name="edit.png"
					value="/resources/ep/images/design/edit.png" />
			</p:commandLink>
		</p:column>

		<!-- <p:column headerText="#{lbl['lbl.sc.loiloa.action']}" style="width:5%">
			<p:commandLink>
				<p:graphicImage library="ep/images/design" name="edit.png"
					value="/resources/ep/images/design/edit.png" />
			</p:commandLink>

		</p:column> -->

	</p:dataTable>
	<p:spacer height="20px" />
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
			process="@this,performancebondtbl" partialSubmit="true"
			action="#{lOADetailBackingBean.addPerformanceBond}"
			update="performancebondtbl" icon="ui-icon-add" />

		<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
			process="@this" partialSubmit="true" icon="ui-icon-delete" />
	</div>

	<p:dialog id="attachDlg" widgetVar="attachDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{lOADetailBackingBean.handleFileAttachment}"
			mode="advanced" id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="performancebondtbl" oncomplete="attachDlg.hide()">
		</p:fileUpload>
	</p:dialog>
</ui:composition>
