<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<p:messages id="loaMaintMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		
		<ui:param name="isSupplierAckStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
		
		<ui:include src="/xhtml/sc/loa/loarequest/loaButtons.xhtml" />
		
		<ui:include src="loaSupplierHeader.xhtml" />
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" valign="top">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{lOADetailBackingBean.managedBean.selectedTabIndex}"
					style="display : table-caption;">

					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.details']}" update="@form">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.loiloa.letter.of.acceptance']}" update="@form">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					<p:menuitem value="#{lbl['lbl.sc.loiloa.declaration']}" update="@form">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
				</p:tabMenu>
			</td>
			<td width="80%">
				<h:panelGroup id="menuContent">
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="loaDetailsSupplierMenu.xhtml" />
					</c:if>
		
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="loaLetterOfAcceptanceView.xhtml" />
					</c:if>
					
					<h:panelGroup rendered="#{lOADetailBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="loaDeclarationMenu.xhtml" />
					</h:panelGroup>
				</h:panelGroup>
			</td>
		</tr>
		</table>
	</ui:define>
</ui:composition>
