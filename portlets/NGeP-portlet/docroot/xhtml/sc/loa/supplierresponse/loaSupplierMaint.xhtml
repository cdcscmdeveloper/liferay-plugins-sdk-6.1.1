<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="loaMaintMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />
		<ui:param name="isEditableStatus" value="false" />
		<ui:param name="isSupplierAckStatus" value="#{lOADetailBackingBean.managedBean.scLoa.pmStatus.statusId == QTStatusConst.LOA_PENDING_SUPPLIER_ACKNOWLEDGEMENT}" />
	    <ui:param name="isDocTypeQuotation" value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.docType == ParameterConst.doctypeQuotation}" />
	    <ui:param name="isBondReq" value="#{lOADetailBackingBean.managedBean.scLoa.bondReq}" />
	
	
		<ui:param name="isFulfilmentTypeScheduled"
			value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.fulfilmentTypeCode.parameterCode eq ParameterConst.fulfilmentTypeScheduled}" />
		
		<ui:include src="loaSupplierButtons.xhtml" />
		
		<ui:include src="loaSupplierHeader.xhtml" />
		
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%" valign="top" class="sidemenutd">
				<p:tabMenu styleClass="sidemenu"
					activeIndex="#{lOADetailBackingBean.managedBean.selectedTabIndex}">

					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.details']}" update="@form" actionListener="#{lOADetailBackingBean.tabChangeAction(0)}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="0" />
					</p:menuitem>
					
					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.contents']}" update="@form" actionListener="#{lOADetailBackingBean.tabChangeAction(1)}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="1" />
					</p:menuitem>
					
					<p:menuitem value="#{lbl['lbl.sc.deduction.payment']}" update="@form" actionListener="#{lOADetailBackingBean.tabChangeAction(2)}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="2" />
					</p:menuitem>
					
					<p:menuitem value="#{lbl['lbl.sc.spec.ful.schedule']}" update="@form" disabled="#{!isFulfilmentTypeScheduled}" actionListener="#{lOADetailBackingBean.tabChangeAction(3)}">	
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="3" />
					</p:menuitem>
					
					<p:menuitem value="#{lbl['lbl.sc.loiloa.loa.perform.bond']}" update="@form" disabled="#{!(isDocTypeQuotation and isBondReq)}" actionListener="#{lOADetailBackingBean.tabChangeAction(4)}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="4" />
					</p:menuitem>
					
					<p:menuitem value="#{lbl['lbl.sc.loiloa.letter.of.acceptance']}" update="@form" actionListener="#{lOADetailBackingBean.tabChangeAction(5)}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="5" />
					</p:menuitem>
					
					<p:menuitem value="#{lbl['lbl.sc.declaration']}" update="@form" actionListener="#{lOADetailBackingBean.tabChangeAction(6)}">
						<f:setPropertyActionListener target="#{lOADetailBackingBean.managedBean.selectedTabIndex}" value="6" />
					</p:menuitem>
					
				</p:tabMenu>
			</td>
			<td width="80%" valign="top">
				<h:panelGroup id="menuContent">
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 0}">
						<ui:include src="loaDetailsSupplierMenu.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 1}">
						<ui:include src="/xhtml/sc/loa/loarequest/loaLetterOfAcceptance.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 2}">
						<ui:include src="/xhtml/sc/loa/loarequest/loaDeductionPaymentMenu.xhtml" />
					</c:if>
				
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 3}">
						<ui:include src="/xhtml/sc/loa/loarequest/loaFulfilmentSchedule.xhtml" />
					</c:if>
					
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 4}">
						<ui:include src="/xhtml/sc/loa/loarequest/loaPerformanceBondMenu.xhtml" />
					</c:if>
		
					<c:if test="#{lOADetailBackingBean.managedBean.selectedTabIndex == 5}">
						<ui:include src="loaLetterOfAcceptanceView.xhtml" />
					</c:if>
					</h:panelGroup>
					<h:panelGroup rendered="#{lOADetailBackingBean.managedBean.selectedTabIndex == 6}">
						<ui:include src="loaIntegrityPactMenu.xhtml" />
					</h:panelGroup>
			</td>
		</tr>
		</table>

		<p:dialog id="attachmentPopup" widgetVar="attachmentPopupDlg"
			modal="true" resizable="false" width="700px" height="200"
			styleClass="pop_up_top" header="#{lbl['lbl.txt.choose.files']}">
			<p:ajax event="close" />
			<p:fileUpload style="display:inline;"
				fileUploadListener="#{lOADetailBackingBean.uploadBranchInfo}"
				mode="advanced" id="uploadattachment"
				sizeLimit="#{CommonConstants.FILE_UPLOAD_SIZE_LIMIT}"
				allowTypes="#{CommonConstants.FILE_UPLOAD_ALLOW_TYPES}"
				invalidFileMessage="#{lbl['lbl.txt.upload.invalid.file']}"
				label="#{lbl['lbl.btn.choose']}" uploadLabel="#{lbl['lbl.btn.upload']}" 
				cancelLabel="#{lbl['lbl.btn.cancel']}"
				update="menuContent" oncomplete="attachmentPopupDlg.hide()">
			</p:fileUpload>
		</p:dialog>

		<p:confirmDialog widgetVar="gstConfirmPopupWid" id="gstConfirmPopup"
			width="500px" message="#{lbl['lbl.sc.gst.nonreg.supplier.alert.msg']}" >
			<div align="center">
				<p:commandButton value="#{lbl['lbl.btn.ok']}" oncomplete="gstConfirmPopupWid.hide()"
					process="@this"></p:commandButton>
			</div>
			
		</p:confirmDialog>


	</ui:define>
</ui:composition>
