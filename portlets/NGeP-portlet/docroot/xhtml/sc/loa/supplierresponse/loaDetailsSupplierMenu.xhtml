						<f:convertDateTime

					<ac:iconTooltip value="#{lbl['lb.sc.gst.effective.date.tooltip']}" />
				</td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.gst.declared.date']}" />
				</td>
				<td><p:inputText size="40"

			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch']}" /></td>
				<td><p:inputText id="branch" size="40"

			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sc.branch.information']}" />

				<td><ui:param name="branchInfoReport"

				<ac:iconTooltip
						value="#{lbl['lbl.sc.gst.branch.attachment.tooltip']}" />
				</td>
			</tr>
			<!-- 20230111@Haziq - #12487&29693 - start  -->
			<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.sc.resp.period']}" />
			</td>
			<td><table>
					<tr>
						<td>
							<p:inputText id="ContractAmtId2"
								value="#{lOADetailBackingBean.managedBean.scLoa.loaResponsePeriod eq null ? lbl['lbl.txt.na']:lOADetailBackingBean.managedBean.scLoa.loaResponsePeriod}"
								style="text-align:right;" partialSubmit="true" size="2"
								disabled="true" >
							</p:inputText> 	
				
						 </td>
						 <td>
				               <p:outputLabel value="#{lbl['lbl.sc.resp.days']}" />
			             </td>
						 <td style="margin-top: -5px">
							<ac:iconTooltip value="#{lbl['lbl.sc.resp.period.tooltip']}" />
						 </td>
			              <td>
			              
				           <p:outputPanel
									id="ContractAmtId3">
								<p:inputText
									value="#{lOADetailBackingBean.retrieveDueDate()}"
									style="text-align:right;" disabled="true" partialSubmit="true" >
									<f:convertDateTime pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATETIME)}" />
								</p:inputText>
		  
				           </p:outputPanel>   
			             </td>
			             <td style="margin-top: -5px">
							<ac:iconTooltip value="#{lbl['lbl.sc.resp.due.date.tooltip']}" />
						</td>
			             
					</tr>
				</table></td>
			</tr>
				<!-- 20230111@Haziq - #12487&29693 - end  -->
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.supplier.sign.date']}" />

				</td>
				<td>
					<p:calendar id="supplierSignDate"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" 
						showOn="button"
						value="#{lOADetailBackingBean.managedBean.scLoa.supplierSignDate}"
						mindate="#{lOADetailBackingBean.managedBean.scLoa.govtSignDate}"
						required="false"
						readonlyInput="true"
						label="#{lbl['lbl.sc.loiloa.loa.supplier.sign.date']}"
						size="40"
						disabled="#{lOADetailBackingBean.managedBean.readOnly}">
						<p:ajax event="dateSelect" />
					</p:calendar>
					<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.loa.supplier.sign.date.tooltip']}" />
					<p:message id="supplierSignDateMsg" for="supplierSignDate" display="icon" />
				</td>
			</tr>
		</table>
	</p:panel>

	<ui:include src="/xhtml/sc/loa/loarequest/loaPaymentDetailsMenu.xhtml" />
	<p:panel id="supplierContractSignerPanel" header="#{lbl['lbl.sc.loiloa.contract.signer.detail']}"
		toggleable="true">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
			<tr>
				<td width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.loiloa.signer.full.name']}" /> <p:outputLabel
						value="*" styleClass="mandatory" rendered="#{isSupplierAckStatus}" />
				</td>
				<td colspan="3"><c:if test="#{isSupplierAckStatus}">
						<p:selectOneMenu id="supplierContractSigner"
							value="#{lOADetailBackingBean.managedBean.scLoa.ackBy.userId}"
							style="width: 277px;margin-bottom:5px;"
							disabled="#{lOADetailBackingBean.managedBean.readOnly}"
							required="false" label="#{lbl['lbl.sc.loiloa.signer.full.name']}">

							<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
								itemValue="#{null}" />
								<!-- #30449 - start added #{pmuser.salutationCode.salutationName}-->
							<f:selectItems
								value="#{lOADetailBackingBean.managedBean.supplierContractSignerList}" 
								var="pmuser" itemLabel="#{pmuser.salutationCode.salutationName} #{pmuser.userName}"
								itemValue="#{pmuser.userId}"/>
								<!-- #30449 - end -->
							<p:ajax event="change"
								listener="#{lOADetailBackingBean.supplierContractSignerEvent()}"
								partialSubmit="true" process="@this" update="@this supplierContractSignerPanel " />
						</p:selectOneMenu>
						<p:message id="supplierContractSignerMsg" for="supplierContractSigner"
							display="icon" />
					</c:if> <c:if test="#{!isSupplierAckStatus}">
					<!-- #30449 - start -->
						<p:inputText
							value="#{lOADetailBackingBean.managedBean.scLoa.ackBy.salutationCode.salutationName} #{lOADetailBackingBean.managedBean.scLoa.ackBy.userName}"
							disabled="true" size="35" /> 
					<!-- #30449 - end -->
					</c:if></td>
			</tr>
			<tr>
				<td width="18%"><p:outputLabel value="#{lbl['lbl.sc.identification.no']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td colspan="3"><p:inputText id="supplierContractSignerIdentificationNo" size="40"
						disabled="true"
						value="#{lOADetailBackingBean.managedBean.scLoa.ackBy.identificationNo}"
						required="false" label="#{lbl['lbl.sc.identification.no']}"
						maxlength="15" /> <p:message id="supplierContractSignerIdentificationNoMsg"
						for="supplierContractSignerIdentificationNo" display="icon" /></td>
			</tr>
			<tr>
				<td rowspan="3" valign="top" width="18%"><p:outputLabel
						value="#{lbl['lbl.sc.address']}" /></td>
				<td colspan="3" rowspan="3"><p:inputTextarea id="supplierContractSignerAddr" rows="6"
						value="#{lOADetailBackingBean.getFullAddress(lOADetailBackingBean.managedBean.scLoa.scSupplierAddress)}"
						style=" margin-bottom:5px;width: 236px;" disabled="true" /></td>
			</tr>
		</table>
	</p:panel>
