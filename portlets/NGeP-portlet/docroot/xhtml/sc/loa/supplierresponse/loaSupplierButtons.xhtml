<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<ui:param name="isMultipleLOI"
		value="#{lOADetailBackingBean.managedBean.scLoa.finalizationMethod eq ParameterConst.recommendByMultipleLoi}" />
	<ui:param name="validityDaysExpiredQt"
		value="#{lOADetailBackingBean.checkProposalValidityDateReachByQt(lOADetailBackingBean.managedBean.scQt)}" />

	<ac:gpkiPopup textBeforeSign="#{lOADetailBackingBean.textBeforeSign}"
		postSignAction="#{lOADetailBackingBean.gpkiSignAction(gpkiBackingBean.pmDigiSign)}" 
		enableAutoUpdate="#{lOADetailBackingBean.enableAutoUpdate()}" />

	<table style="width: 100%">
	<tr>
		<td>
			<div align="left" style="width: 100%">
			    <p:commandButton immediate="true"
					value="#{lbl['lbl.btn.back']}"
					action="#{lOADetailBackingBean.backToPrevious}"
					style="float:left;" 
					rendered="#{!empty lOADetailBackingBean.managedBean.backToPreviousPage}" />
			 </div>
			 </td>
			 <td>
			 <div align="right" style="width: 100%">
				<p:commandLink value="#{lbl['lbl.td.doc.trackingDiary']}"
					action="#{pmTrackingDiaryBackingBean.redirectToSupplierTrackingDiary(ParameterConst.doctypeLetterOfAward, lOADetailBackingBean.managedBean.scLoa.loaId, true)}"
					immediate="true" 
					rendered="#{!empty lOADetailBackingBean.managedBean.backToPreviousPage}" />
								
				<ui:param name="readOnlyTask" value="#{lOADetailBackingBean.managedBean.readOnly}" />
				<ui:decorate
					template="/WEB-INF/facelets/templates/claim_template.xhtml">
					<ui:define name="outComeSection">
						<c:choose>
							<c:when test="#{!empty lOADetailBackingBean.managedBean.taskId}">
								<p:commandButton value="#{lbl['lbl.btn.save']}" process="@all"
									partialSubmit="true" update="@form" onstart="blockWidget.show();"
									oncomplete="blockWidget.hide();"
									action="#{lOADetailBackingBean.saveAction}" />
									
								<ui:repeat var="bpmAction"
									value="#{lOADetailBackingBean.managedBean.outComes}">
									<ui:param name="buttonLabel"
										value="lbl.btn.#{fn:toLowerCase(bpmAction)}" />
		
									<h:panelGroup rendered="#{bpmAction == 'ACCEPT'}">
										<p:commandButton value="#{lbl[buttonLabel]}"
											rendered="#{validityDaysExpiredQt and !lOADetailBackingBean.managedBean.qtCancelRequested}"
											disabled="#{!lOADetailBackingBean.managedBean.agreeWithTermsConditions}"
											styleClass="ui-button" update="@form"
											partialSubmit="true" process="@form"
											action="#{lOADetailBackingBean.updateBpmTaskAction(bpmAction)}"
											onstart="blockWidget.show();" oncomplete="blockWidget.hide();">
											<f:setPropertyActionListener value="#{bpmAction}"
												target="#{lOADetailBackingBean.managedBean.action}" />
											<f:setPropertyActionListener value="false"
												target="#{lOADetailBackingBean.managedBean.autoUpdate}" />										
										</p:commandButton>
									</h:panelGroup>
		
									<h:panelGroup rendered="#{bpmAction == 'REJECT'}">
										<p:commandButton value="#{lbl[buttonLabel]}"
											rendered="#{!isMultipleLOI and validityDaysExpiredQt}"
											styleClass="ui-button" onstart="blockWidget.show();"
											oncomplete="blockWidget.hide();"
											action="#{lOADetailBackingBean.updateBpmTaskAction(bpmAction)}"
											partialSubmit="true" process="@this" update="@this" />
									</h:panelGroup>
								</ui:repeat>
								
								<ac:spkiPopup id="spkiPopup"
									password="#{lOADetailBackingBean.managedBean.spkiBackingBean.password}"
									challengeAns1="#{lOADetailBackingBean.managedBean.spkiBackingBean.challengeAns1}"
									challengeQues1="#{lOADetailBackingBean.managedBean.spkiBackingBean.challengeQues1}"
									postSignAction="#{lOADetailBackingBean.spkiSignAction(spkiBackingBean.pmDigiSign)}" 
									enableAutoUpdate="#{lOADetailBackingBean.enableAutoUpdate()}" />
							</c:when>
						</c:choose>
					</ui:define>
				</ui:decorate>
			 </div>
		</td>
	</tr>
	</table>
</ui:composition>
