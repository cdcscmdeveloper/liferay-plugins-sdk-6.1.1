<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:outputPanel id="loaId">
			<ui:include
				src="/xhtml/sc/loa/cancellation/cancelLoaApprovalButtons.xhtml" />
			<table style="border: 0px; align: center;" width="100%"></table>
		</p:outputPanel>
		<p:panel header="#{lbl['lbl.sc.qt.req.ptj']}" toggleable="true"
			toggleSpeed="500" id="qtScQtReqPtjId">

			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.ministry']}" /></td>
					<td colspan="3"><p:inputText
							value="#{lOACancelDetailBackingBean.retrieveMinistryByOrgProfileId(lOACancelDetailBackingBean.managedBean.scLoa.scLoiLoa.pmOrgProfile.orgProfileId)}"
							disabled="true" readonly="true" style="width:866px;" /></td>
				</tr>

				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.prepare.ptj']}" /></td>
					<td colspan="3">
							<c:if test="#{lOACancelDetailBackingBean.managedBean.scLoa.isBrandNew()}">
								<p:inputText
								value="#{lOACancelDetailBackingBean.managedBean.scLoa.scLoiLoa.pmOrgProfile.orgName}"
								disabled="true" readonly="true" style="width:866px;" />
				     		</c:if>
				     		<c:if test="#{!lOACancelDetailBackingBean.managedBean.scLoa.isBrandNew()}">
				     			<p:inputText
								value="#{lOACancelDetailBackingBean.retrievePTJByOrgProfileId(lOACancelDetailBackingBean.managedBean.scLoa.scLoiLoa.pmOrgProfile.orgProfileId, lOACancelDetailBackingBean.managedBean.scLoa.scQt.createdDate)}"
								disabled="true" readonly="true" style="width:866px;" />								
				     		</c:if></td>
				</tr>

				<tr>
					<td style="width: 200px;"><p:outputLabel
							value="#{lbl['lbl.sc.requestor']}" /></td>
					<td style="width: 450px;"><p:inputText
							value="#{lOACancelDetailBackingBean.showPreparedBy(lOACancelDetailBackingBean.managedBean.scLoa.createdBy)}"
							disabled="true" readonly="true" style="width:350px;" /></td>

					<td style="width: 200px;"><p:outputLabel value="#{lbl['lbl.sc.request.date']}" /></td>
					<td><p:inputText						
						disabled="true" readonly="true" style="width:212px;">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</p:inputText></td>
				</tr>
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.sc.loiloa.loa.no']}" /></td>
					<td><p:inputText
							value="#{lOACancelDetailBackingBean.managedBean.scLoa.loaNo}"
							disabled="true" readonly="true" style="width:350px;" /></td>
					<td><p:outputLabel value="#{lbl['lbl.sc.status']}" /></td>
					<td><p:inputText
							value="#{lOACancelDetailBackingBean.getStatusDescById(lOACancelDetailBackingBean.managedBean.scLoa.pmStatus.statusId)}"
							disabled="true" readonly="true" style="width:227px;" /></td>
				</tr>
				<tr>
					<td valign="top"><p:outputLabel
							value="#{lbl['lbl.sc.loiloa.loa.title']}" /></td>
					<td colspan="3"><p:inputTextarea
							value="#{lOADetailBackingBean.managedBean.scLoa.scLoiLoa.title}"
							cols="170" rows="3" style=" margin-bottom:5px; width:866px;"
							disabled="true" /></td>
				</tr>


			</table>
		</p:panel>
		<ui:include src="/xhtml/sc/loa/cancellation/cancelLoaReqDetail.xhtml" />
		<ac:scRemarkAndAttachment
			remarkList="#{lOACancelDetailBackingBean.managedBean.scLoa.scLoaRemarks}"
			attachmentList="#{lOACancelDetailBackingBean.managedBean.scLoa.scLoaCancelAttachments}"
			readonly="false" 
			fileUploadListener="lOACancelDetailBackingBean.handleFileUpload"/>
	</ui:define>
</ui:composition>
