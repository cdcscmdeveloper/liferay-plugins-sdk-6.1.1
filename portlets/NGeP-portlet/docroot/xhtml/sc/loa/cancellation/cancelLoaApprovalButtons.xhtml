<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<div>
		<p:commandButton value="#{lbl['lbl.btn.reject']}" onclick="rj.show()"
			style="float:right;" />
		<p:commandButton value="#{lbl['lbl.btn.approve']}" onclick="ap.show()"
			style="float:right;" />

		<p:confirmDialog
			message="#{lbl['lbl.sc.loa.cancel.dialog.confirm.message']}"
			header="#{lbl['lbl.btn.reject']}" severity="alert" widgetVar="rj">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					actionListener="#{lOACancelDetailBackingBean.backToPrevious}"
					oncomplete="rj.hide();" id="cancelPendingItemCodification"
					partialSubmit="true" process="@this" immediate="true" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					oncomplete="rj.hide();" />
			</div>
		</p:confirmDialog>

		<p:confirmDialog
			message="#{lbl['lbl.sc.loa.cancel.dialog.confirm.approval.message']}"
			header="#{lbl['lbl.btn.approve']}" severity="alert" widgetVar="ap">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					actionListener="#{lOACancelDetailBackingBean.backToPrevious}"
					oncomplete="ap.hide();" id="cancelPendingItemCodification"
					partialSubmit="true" process="@this" immediate="true" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					oncomplete="ap.hide();" />
			</div>
		</p:confirmDialog>
	</div>
</ui:composition>
