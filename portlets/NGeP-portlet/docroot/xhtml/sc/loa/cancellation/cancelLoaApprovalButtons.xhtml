<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<ui:param name="bpmActionApprove" value="APPROVE" />
	<ui:param name="bpmActionReject" value="REJECT" />

	<ui:remove> 34449 - start</ui:remove>
	<style type="text/css">
	    .leftMsgConfirmDlg .ui-confirm-dialog-severity {
	        display: none !important;
	    }
	    .leftMsgConfirmDlg .ui-dialog-content p {
	        text-align: left !important;
	        margin-left: 0 !important;
	        padding-left: 0 !important;
	    }
	</style>
	<ui:remove> 34449 - end</ui:remove>
	
	<div>
		<p:commandButton value="#{lbl['lbl.btn.reject']}" onclick="rj.show()"
			style="float:right;" />
		<p:commandButton value="#{lbl['lbl.btn.approve']}" onclick="ap.show()"
			style="float:right;" />

		<ui:remove> 34449 - start</ui:remove>
		<p:confirmDialog
			message="#{lbl['lbl.sc.loa.cancel.dialog.confirm.reject.message']}"
			header="#{lbl['lbl.sc.header.message.reject']}" severity="alert"
			styleClass="leftMsgConfirmDlg"
			widgetVar="rj">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					actionListener="#{lOACancelDetailBackingBean.updateBpmTaskAction(bpmActionReject)}"
					oncomplete="rj.hide();" partialSubmit="true" process="@this"
					immediate="true" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					oncomplete="rj.hide();" />
			</div>
		</p:confirmDialog>

		<p:confirmDialog
			message="#{lbl['lbl.sc.loa.cancel.dialog.confirm.approval.message']}"
			header="#{lbl['lbl.sc.header.message.approve']}" severity="alert"
			styleClass="leftMsgConfirmDlg"
			widgetVar="ap">
			<div class="ppRightBtn">
				<p:commandButton value="#{lbl['lbl.btn.yes']}"
					actionListener="#{lOACancelDetailBackingBean.updateBpmTaskAction(bpmActionApprove)}"
					oncomplete="ap.hide();" partialSubmit="true" process="@this"
					immediate="true" />
				<p:commandButton value="#{lbl['lbl.btn.no']}"
					oncomplete="ap.hide();" />
			</div>
		</p:confirmDialog>
		<ui:remove> 34449 - end</ui:remove>
	</div>
</ui:composition>
