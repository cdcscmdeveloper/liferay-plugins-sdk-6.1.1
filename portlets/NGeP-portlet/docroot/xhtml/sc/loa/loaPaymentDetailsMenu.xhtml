<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.supp.pay.info']}"
		toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.acc.no']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{lOADetailBackingBean.managedBean.scQtSpec.approverName}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="-- Select -- " itemValue="" />
					<f:selectItem itemLabel="" itemValue="1" />
				</p:selectOneMenu>
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.name']}" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" size="30" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.branch']}" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" size="30" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.addr']}" />
			</h:column>
			<h:column>
				<p:inputTextarea id="bondAddrText" cols="30" rows="5" value=""
					style=" margin-bottom:5px;" disabled="true" />
			</h:column>
		</h:panelGrid>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.loiloa.deduction.payment']}" toggleable="true"
		id="deductID">

		<p:commandLink value="#{lbl['lbl.sc.loiloa.deduction.payment']}"></p:commandLink>


		<p:dataTable id="deducttbl" var="deductList"
			value="#{lOADetailBackingBean.managedBean.scQtDeductionList}"
			selection="#{lOADetailBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{deductList}" selectionMode="single">

			<p:ajax event="rowSelect" update=":form:tt:deductclause" />

			<ac:paginator for="deductpayments" />

			<p:column headerText="#{lbl['lbl.sc.loiloa.deduction.type']}">
				<h:outputText value="#{deductList.deductionType.code}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.deduction.description']}">
				<h:outputText value="Purchase Request" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.deduction.percentage']}">
				<h:outputText value="Percentage" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.loa.amt']}">
				<h:outputText value="#{deductList.deductionAmount}" />
			</p:column>

		</p:dataTable>
		<p:spacer height="30px" />
		<p:commandLink value="#{lbl['lbl.sc.loiloa.deduction.clause']}" />
		<p:dataTable
			value="#{lOADetailBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
			id="deductclause" var="dclauseList" rowKey="#{dclauseList}"
			rowIndexVar="rowIndex" rows="10">

			<ac:paginator for="deductId" />
			
			<p:column selectionMode="multiple" style="width:2%" />
			
			<!-- <p:column headerText="#{lbl['lbl.sc.loiloa.deduction.clause']}">
				<h:outputText value="" />
			</p:column> -->

			<p:column headerText="#{lbl['lbl.sc.loiloa.deduction.description']}">
				<h:outputText value="Percentage" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.action']}">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}"
						process="@this" partialSubmit="true" icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
						process="@this" partialSubmit="true" icon="ui-icon-delete" />
				</div>
			</f:facet>
		</p:panelGrid>

	</p:panel>
</ui:composition>
