<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="left" class="header-info">
			<table border="0" cellspacing="0" cellpadding="0" width="100%">
				<tr>
					<td width="10%">
						<h:outputLabel value="#{lbl['lbl.sc.request.note.req.note.no']}" />
					</td>
					<td class="header-info-text" width="15%">
						#{qtLOABackingBean.managedBean.qt.qtNo}
					</td>
					<td width="10%">
						<h:outputLabel value="#{lbl['lbl.sc.ptj']}" /></td>
					<td class="header-info-text" width="35%">
						#{qtLOABackingBean.managedBean.qt.pmOrgProfile.orgName}
					</td>
					<td width="10%">
						<h:outputLabel value="#{lbl['lbl.sc.status']}" />
					</td>
					<td class="header-info-text" width="20%">
						#{qtLOABackingBean.getStatusDescById(qtLOABackingBean.managedBean.currentStatusId)}
					</td>
				</tr>
			</table>
		</div>
	</p:panel>
</ui:composition>
