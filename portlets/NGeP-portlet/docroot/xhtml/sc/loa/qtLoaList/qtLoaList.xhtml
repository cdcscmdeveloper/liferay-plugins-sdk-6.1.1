<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
		<p:messages id="qtloaMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<ui:include src="qtLoaListButton.xhtml" />
		<ui:include src="qtLoaListHeader.xhtml" />
		<p:panel id="suppListPanel" toggleable="true" toggleSpeed="500">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.sc.loiloa.recom.supp.list']}" />
			</f:facet>
			<h:panelGrid columns="2" columnClasses="columnWidth50,columnWidth50">
				<h:outputLabel value="#{lbl['lbl.sc.award.type']}"></h:outputLabel>
				<p:inputText id="awardType"
					value="#{qtLOABackingBean.getParameterDesc(qtLOABackingBean.managedBean.selectedLoiLoa.recommendTypeCode)}"
					disabled="true" size="30" readonly="true" />
			</h:panelGrid>
			<p:dataTable id="qtLoaTbl" var="scLoiLoa"
				value="#{qtLOABackingBean.managedBean.scLoiLoaList}" rows="10"
				selection="#{qtLOABackingBean.managedBean.selectedLoiLoa}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{scLoiLoa}" rowIndexVar="rowIndex" selectionMode="single">
				<ac:paginator for="qtLoaTbl" />
				<p:ajax event="rowSelect"
					listener="#{qtLOABackingBean.onRowRecSupplierAction}"
					process="@this" update=":form:suppListPanel" />

				<p:column headerText="#{lbl['lbl.sc.supplier.name']}">
					#{scLoiLoa.supplierName}
				</p:column>
				<p:column style="text-align: center;">
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.sc.discipline.action.taken']}" />
						<ac:iconTooltip value="#{lbl['lbl.sc.discipline.action.taken.tooltip']}" />
					</f:facet>
					
					<!-- #31033 start -->
					<p:commandLink onstart="blockWidget.show()" oncomplete="blockWidget.hide()" style="color:red; font-weight:bold;" 
						rendered="#{scLoiLoa.smSupplier.disciplinaryActions}"
						action="#{viewSuppProfileBackingBean.onViewActiveDisciplinaryAction(scLoiLoa.smSupplier)}" 
						process="@this" partialSubmit="true" update=":form">
							<h:outputText value="#{lbl['lbl.cm.dialog.cofirm.yes']}" styleClass="warning" />
					</p:commandLink><p:spacer width="2"/>
					<!-- #31033 End -->
					
					<h:outputText rendered="#{!scLoiLoa.smSupplier.disciplinaryActions}"
					 value="#{lbl['lbl.cm.dialog.cofirm.no']}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.action']}" style="text-align: center;">
				  <!-- #29729 Start  -->
				  <ui:param name="isBranchSupplierListDeleted" 
				  value="#{qtLOABackingBean.displaySupplierBranchListDeletedForLOA(scLoiLoa.smSupplier.supplierId)}" />
				        <p:commandButton value="#{lbl['lbl.sc.loiloa.create.loa']}"
											rendered="#{!scLoiLoa.loaCreated and isBranchSupplierListDeleted}"
											action="#{qtLOABackingBean.infoBranchSupplierListDeletedForLOA()}" />
				  <!-- #29729 End -->
				         <p:commandButton value="#{lbl['lbl.sc.loiloa.create.loa']}"
											rendered="#{!scLoiLoa.loaCreated and !isBranchSupplierListDeleted}"
											action="#{lOADetailBackingBean.createQtLOAAction(scLoiLoa)}" />
				</p:column>
			</p:dataTable>

			<br />

			<h:outputText value="#{lbl['lbl.sc.loiloa.recom.supp.list']} >" />
			<h:outputText value="#{lbl['lbl.sc.loiloa.loiloalist']} " />
			<h:outputText style="margin-left: 140px;"
				value="#{qtLOABackingBean.managedBean.loiLoaListTitle}" />
			<h:panelGroup id="supploaloalistPnl">
				<p:dataTable id="qtLoiLoaList" var="loiloa" rows="10"
					value="#{qtLOABackingBean.managedBean.suppLoiLoaList}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					rowIndexVar="rowIndex">
					<ac:paginator for="qtLoiLoaList" />
					<p:column headerText="#{lbl['lbl.sc.loiloa.loiloano']}">
					#{loiloa.loiLoaNo}
				</p:column>
					<p:column headerText="#{lbl['lbl.sc.loiloa.loa.type']}">
					#{loiloa.type}
				</p:column>
					<p:column style="text-align: center;">
						<f:facet name="header">
							<h:outputText value="#{lbl['lbl.sc.item']}" />
							<ac:iconTooltip value="#{lbl['lbl.sc.loiloa.item.view.tooltip']}" />
						</f:facet>
						<p:commandLink
							actionListener="#{qtLOABackingBean.showItemDetailsPopUps(loiloa)}"
							oncomplete="qtItemDtlDlg.show()" update=":form:qtItemDtlDialog"
							process="@this">
							<p:graphicImage title="Item Detail"
								value="/css/images/design/document.png"
								style="margin-right:2px;" />
						</p:commandLink>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.status']}">
					#{qtLOABackingBean.getStatusDescById(loiloa.status.statusId)}
				</p:column>
					<p:column headerText="#{lbl['lbl.sc.action']}"
						style="text-align: center;">

						<h:panelGroup rendered="#{loiloa.type eq 'LOI'}">

							<p:commandButton title="edit" icon="ui-icon-edit"
								rendered="#{loiloa.status.statusId eq QTStatusConst.LOI_PENDING_SUBMISSION}"
								style="background-color:transparent !important; border:0px none; width:10px; height:10px !important;"
								action="#{lOIDetailBackingBean.editLOI(loiloa.scLoi,true)}" />

							<p:commandLink
								rendered="#{loiloa.status.statusId ne QTStatusConst.LOI_PENDING_SUBMISSION}"
								action="#{lOIDetailBackingBean.editLOI(loiloa.scLoi,false)}"
								process="@this">

								<p:graphicImage value="/css/images/design/document.png" />
								<p:spacer width="5"></p:spacer>
							</p:commandLink>

						</h:panelGroup>

						<h:panelGroup rendered="#{loiloa.type eq 'LOA'}">
							<p:commandButton title="edit" icon="ui-icon-edit"
								rendered="#{loiloa.status.statusId eq QTStatusConst.LOA_PENDING_SUBMISSION}"
								style="background-color:transparent !important; border:0px none; width:10px; height:10px !important;"
								action="#{lOADetailBackingBean.goQtEditLoaAction(loiloa)}" />

							<p:commandLink
								rendered="#{loiloa.status.statusId ne QTStatusConst.LOA_PENDING_SUBMISSION}"
								action="#{lOADetailBackingBean.goQtEditLoaAction(loiloa)}"
								process="@this">
								<f:setPropertyActionListener value="true"
									target="#{lOADetailBackingBean.managedBean.readOnly}" />
								<p:graphicImage value="/css/images/design/document.png" />
								<p:spacer width="5"></p:spacer>
							</p:commandLink>
						</h:panelGroup>

					</p:column>
				</p:dataTable>
			</h:panelGroup>
		</p:panel>
		<ui:include src="qtItemDetailPopUp.xhtml" />
		<!-- Bug #31033 #32560 Start -->
		<ac:disciplinaryActionActiveQT voList="#{viewSuppProfileBackingBean.managedBean.disciplineVOs}"  btnView="true" 
				startDate="#{viewSuppProfileBackingBean.managedBean.startDate}"
				endDate="#{viewSuppProfileBackingBean.managedBean.endDate}"
				isWarning="#{viewSuppProfileBackingBean.managedBean.warning}"/>
		<!-- Bug #31033 #32560 End -->
	</ui:define>
</ui:composition>
