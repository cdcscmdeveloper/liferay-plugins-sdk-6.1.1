<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="isZonal"
		value="#{qtLOABackingBean.managedBean.selectedSuppLoiLoaBean.scLoa.scLoiLoa.zonal}" />
	<p:dialog id="qtItemDtlDialog" widgetVar="qtItemDtlDlg"
		header="#{lbl['lbl.sc.item.details']}" modal="true" dynamic="true"
		resizable="false" styleClass="pop_up_top" width="690">

		<p:dataTable id="itemtbl" var="scLoiLoaItem"
		    emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{qtLOABackingBean.managedBean.selectedSuppLoiLoaBean.scLoiLoaItems}"
			rows="10">

			<ac:paginator for="itemtbl" />

			<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}">
				#{scLoiLoaItem.tplSpecZoneDtl.zoneName}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.item']}">
				#{scLoiLoaItem.scRequestItem.itemName}
			</p:column>
			
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.frequency.per.uom']}">
					<h:outputText
						value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomFrequency}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
	
             <p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.day']}">
					<h:outputText
						value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomPerDay}" />
				</p:column>
	
				<p:column style="width:8%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.content.no.uom.per.month']}">
					<h:outputText
						value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clUomPerMonth}" />
				</p:column>
	
				<p:column style="width:7%;white-space:normal;text-align:right;"
					headerText="#{lbl['lbl.tpl.spec.duration.month']}">
					<h:outputText
						value="#{scLoiLoaItem.scRequestItem.tplSpecQuestion.clDurationMonth}">
						<f:convertNumber
							pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
					</h:outputText>
				</p:column>
			
			
			<p:column style="width:10%; text-align:right;"
				headerText="#{lbl['lbl.sc.quantity']}">
				<h:panelGroup rendered="#{!empty scLoiLoaItem.tplSpecTierQty}">
					<h:outputText value="#{scLoiLoaItem.tplSpecTierQty.fromQty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom)}" />
					</h:outputText>
					<h:outputText value=" #{lbl['lbl.sc.qty.and.above']}" rendered="#{empty scLoiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value=" - " rendered="#{!empty scLoiLoaItem.tplSpecTierQty.toQty}" />
					<h:outputText value="#{scLoiLoaItem.tplSpecTierQty.toQty}" rendered="#{!empty scLoiLoaItem.tplSpecTierQty.toQty}">
						<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom)}" />
					</h:outputText>
				</h:panelGroup>
				<h:outputText value="#{scLoiLoaItem.qty}" rendered="#{scLoiLoaItem.tplSpecTierQty eq null}">
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_QTY, scLoiLoaItem.scRequestItem.uom)}" />
				</h:outputText>
				
			</p:column>

			<p:column style="width:15%;"
				headerText="#{lbl['lbl.sc.uom']}">
				#{scLoiLoaItem.scRequestItem.uom.uomName}
			</p:column>

		</p:dataTable>
		<div class="ppRightBtn BtnSpacing">
			<p:commandButton value="#{lbl['lbl.btn.close']}" process="@this"
						onclick="qtItemDtlDlg.hide()"/>
		</div>
		
	</p:dialog>
</ui:composition>
