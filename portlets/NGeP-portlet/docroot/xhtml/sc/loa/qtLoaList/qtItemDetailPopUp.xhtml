<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="isZonal"
		value="#{lOADetailBackingBean.managedBean.selectedSuppLoiLoaBean.scLoa.scLoiLoa.zonal}" />
	<p:dialog id="qtItemDtlDialog" widgetVar="qtItemDtlDlg"
		header="#{lbl['lbl.sc.item.details']}" modal="true" dynamic="true"
		resizable="false" styleClass="pop_up_top" width="570">

		<p:dataTable id="itemtbl" var="scLoiLoaItem"
			value="#{lOADetailBackingBean.managedBean.selectedSuppLoiLoaBean.scLoiLoaItems}"
			rows="10">

			<ac:paginator for="itemtbl" />

			<p:column headerText="#{lbl['lbl.sc.zone']}" rendered="#{isZonal}">
				#{scLoiLoaItem.tplSpecZoneDtl.zoneName}
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.loiloa.item.name']}">
				#{scLoiLoaItem.scRequestItem.itemName}
			</p:column>

			<p:column style="width:10%; text-align:right;"
				headerText="#{lbl['lbl.sc.loiloa.item.quantity']}">
				<h:outputText value="#{scLoiLoaItem.qty}">
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_INTEGER)}" />
				</h:outputText>
			</p:column>

			<p:column style="width:15%;"
				headerText="#{lbl['lbl.sc.loiloa.item.uom']}">
				#{scLoiLoaItem.scRequestItem.uom.uomName}
			</p:column>

		</p:dataTable>

		<p:spacer height="15px"></p:spacer>
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column>
					<p:commandButton value="#{lbl['lbl.sc.close']}" process="@this"
						onclick="qtItemDtlDlg.hide()" icon="ui-icon-cancel" />
				</p:column>
			</p:row>
		</p:panelGrid>

	</p:dialog>
</ui:composition>
