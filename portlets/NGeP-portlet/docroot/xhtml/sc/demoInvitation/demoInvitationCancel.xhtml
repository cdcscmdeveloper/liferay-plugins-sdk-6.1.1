<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<ui:param name="currentApproval" value="#{demoInvBB.managedBean.currentApproval}"/>
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/icon_loadingLarge.gif" />
		</p:blockUI>
		<p:messages id="cancelMsg" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" severity="error, info" />

		<div class="ppRightBtn">
			<h:panelGroup id="cancelBtns">
				<p:commandButton value="#{lbl['lbl.btn.submit']}"
					action="#{demoInvBB.submitQtCancelDetails}" process="@form"
					update="@all" onstart="blockWidget.show();"
					oncomplete="blockWidget.hide();" />
			</h:panelGroup>
		</div>

		<p:panel id="cancelQt"
			header="#{demoInvBB.getParameterDesc(ParameterTypeConst.approvalCategory, ParameterConst.approvalCategoryFinalizationCommittee)}"
			toggleable="true">
			<ui:param name="fcaApprovalTab"
				value="#{demoInvBB.managedBean.selectedApprovalTabBean}" />
			<ui:param name="fcaApprovalRemarkList"
				value="#{demoInvBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" />

			<p:panel id="fcreqDetails" header="#{lbl['lbl.sc.qt.req.dtls']}"
				toggleable="true">
				<p:dataTable id="fcareqdtlsid"
					value="#{fcaApprovalTab.scQtApproval.scQtApprovalDtls}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					var="fcrequestdetails">

					<p:column headerText="#{lbl['lbl.sc.qt.type.reqdtls']}">
						<h:outputText
							value="#{approvalBackingBean.getParameterDesc(fcrequestdetails.approvalType)}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.from.value']}">
						<h:outputText value="#{fcrequestdetails.originalValue}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.to.value']}">
						<h:outputText value="#{fcrequestdetails.changedValue}" />
					</p:column>
				</p:dataTable>
			</p:panel>

			<p:panel id="fcappoint"
				header="#{lbl['lbl.sc.qt.approver.selection']}" toggleable="true">
				<p:dataTable id="finalizationsecretaryid"
					value="#{fcaApprovalTab.scQtApproval.approverSettings}"
					emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
					var="approverSettings">
					<p:column headerText="#{lbl['lbl.sc.finalization.committee']}"
						width="30%">
						<c:choose>
							<c:when
								test="#{!empty fcaApprovalTab.scQtApproval.scQtApprovalDtls and empty fcaApprovalTab.scQtApproval.scQtApprovalDtls[0].submissionDate and 
							qTDetailBB.managedBean.selectedApprovalTabBean.tabType != ParameterConst.approvalCategoryProcurementBoard}">
								<p:selectOneMenu id="fcApprovalId"
									value="#{approverSettings.committeeType.parameterId}"
									style="width:75%;margin-bottom: 5px;"
									disabled="#{qTDetailBB.managedBean.readOnly}">
									<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
										itemValue="#{null}" />
									<f:selectItems var="secretary"
										value="#{fcaApprovalTab.fcTypes}" />

									<p:ajax event="change" update="commTypes" process="@this"
										listener="#{demoInvBB.changePbSecretaryCommType(approverSettings)}"
										partialSubmit="true" />
								</p:selectOneMenu>
							</c:when>
							<c:otherwise>
								#{qTDetailBB.getParameterDesc(approverSettings.committeeType,null)}
							</c:otherwise>
						</c:choose>
					</p:column>
					<p:column headerText="#{lbl['lbl.sc.secretary.name']}" width="70%">
						<h:panelGroup id="commTypes">
							<c:choose>
								<c:when
									test="#{!empty fcaApprovalTab.scQtApproval.scQtApprovalDtls and empty fcaApprovalTab.scQtApproval.scQtApprovalDtls[0].submissionDate}">
									<p:selectOneMenu id="usersSecretaryId"
										value="#{approverSettings.pmUser.userId}"
										disabled="#{qTDetailBB.managedBean.readOnly}"
										style="width:90%;margin-bottom: 5px;">
										<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
											itemValue="#{null}" />
										<f:selectItems var="usersSecretary"
											value="#{demoInvBB.retrievePmUserSecratryDtl(approverSettings.committeeType.parameterCode)}"
											itemLabel="#{usersSecretary.userName}"
											itemValue="#{usersSecretary.userId}" />
										<p:ajax event="change"
											listener="#{demoInvBB.updateUserIdToSettings}"
											process="@this" partialSubmit="true" update="@this" />
									</p:selectOneMenu>
								</c:when>
								<c:otherwise>
									#{approverSettings.pmUser.userName}
								</c:otherwise>
							</c:choose>
						</h:panelGroup>
					</p:column>
				</p:dataTable>
			</p:panel>
			
			<ac:scRemarkAndAttachment
				remarkList="#{demoInvBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}"
				attachmentList="#{currentApproval.scQtApprovalAttachments}"
				fileUploadListener="demoInvBB.handleFileUpload" />

<!-- 			<ac:scRemarkAndAttachment -->
<!-- 				remarkList="#{demoInvBB.managedBean.selectedApprovalTabBean.scQtApproval.scQtApprovalRemarks}" -->
<!-- 				attachmentList="#{demoInvBB.managedBean.scQtApprovalAttachments}}" -->
<!-- 				readonly="" fileUploadListener="demoInvBB.handleFileUpload" /> -->

			<ui:include
				src="/xhtml/sc/quatationtender/approval/approvalhistory.xhtml" />
		</p:panel>

	</ui:define>

</ui:composition>
