<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="demoRemark">
		<p:panel header="#{lbl['lbl.txt.remarks']}" text-transform="uppercase"
			toggleable="true">
			<table width="100%">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.pm.access.app.remarks']}" />
					</td>
					<td colspan="3"><p:inputTextarea id="title1"
							label="#{lbl['lbl.pm.access.app.remarks']}"
							required="#{empty param['skipvalidation']}"
							value="#{demoInvBB.managedBean.demoRemark}" cols="110" rows="3"
							valueChangeListener="#{createQtBB.qtTitleValueChanged}"
							onkeyup="limitTextArea(this,500);"
							onkeydown="limitTextArea(this,500);"
							onmouseout="limitTextArea(this,500);"
							style=" margin-bottom:5px; width: 714px;" maxlength="500">
							<f:ajax></f:ajax>
						</p:inputTextarea> <p:message id="title1Msg" for="title1" display="icon" /></td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>

	<h:panelGroup id="demoContact">
		<p:panel header="#{lbl['lbl.sc.contact.person.details']}"
			id="democontactPersonPanel" text-transform="uppercase"
			toggleable="true">
			<p:dataTable id="contactPrsId" var="contactPerson"
				widgetVar="openCodes"
				value="#{demoInvBB.managedBean.scQtDemoContactList}"
				rowIndexVar="index" rows="10"
				selection="#{demoInvBB.managedBean.selectedContactList}"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				rowKey="#{contactPerson}">
				<ac:paginator for="contactPrsId" />
				<p:ajax event="rowSelect"
					update="@([id$=demoContactPersonDeleteCategoryBtnId])" />
				<p:ajax event="rowUnselect"
					update="@([id$=demoContactPersonDeleteCategoryBtnId])" />
				<p:ajax event="rowSelectCheckbox"
					update="@([id$=demoContactPersonDeleteCategoryBtnId])" />
				<p:ajax event="rowUnselectCheckbox"
					update="@([id$=demoContactPersonDeleteCategoryBtnId])" />
				<p:ajax event="toggleSelect"
					update="@([id$=demoContactPersonDeleteCategoryBtnId])" />

				<p:column selectionMode="multiple" style="width:1%"
					rendered="#{!contactReadonly}"
					disabledSelection="#{contactPerson.disableRowSelection}" />

				<p:column headerText="#{lbl['lbl.pm.contact.name']}"
					style="white-space: normal;">
					<h:inputText value="#{contactPerson.userName}"
						disabled="#{contactPerson.disableRowSelection}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.contact.phone']}"
					style="white-space: normal;">
					<h:inputText value="#{contactPerson.telephoneNo}"
						disabled="#{contactPerson.disableRowSelection}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.contact.fax']}"
					style="white-space: normal;">
					<h:inputText value="#{contactPerson.faxNo}"
						disabled="#{contactPerson.disableRowSelection}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.pm.contact.email']}">
					<h:inputText value="#{contactPerson.email}"
						disabled="#{contactPerson.disableRowSelection}" />
				</p:column>

			</p:dataTable>
			<table width="100%">
				<tr>
					<td>
						<table width="100%">
							<tr>
								<td>
									<!-- 									<c:if test="#{!categoryCodeReadonly and !specCommitteeReadOnly}"> -->
									<div class="ppRightBtn">
										<p:commandButton value="#{lbl['lbl.btn.add']}"
											styleClass="BtnSpacing" process="@this, contactPrsId"
											partialSubmit="true"
											action="#{demoInvBB.addNewContactPerson()}"
											update="@([id$=democontactPersonPanel])" />
										<p:commandButton value="#{lbl['lbl.btn.delete']}"
											id="demoContactPersonDeleteCategoryBtnId"
											styleClass="BtnSpacing" process="@this, contactPrsId"
											partialSubmit="true"
											disabled="#{empty demoInvBB.managedBean.selectedContactList}"
											oncomplete="contactPersonDeletePopUp.show();"
											update="@([id$=#{contactPersonDeleteId}])"
											onclick="contactPersonDeletePopUpDeletePopUp.show()" />
									</div> 
									<ui:param name="contactPersonDeleteId"
										value="contactPersonDeleteId" /> 
<!-- 										<ac:confirmationPopup -->
<!-- 										id="#{contactPersonDeleteId}" -->
<!-- 										widget="contactPersonDeletePopUpDeletePopUp" -->
<!-- 										okAction="demoInvBB.deleteContactPerson" width="33%" -->
<!-- 										height="100" title="#{lbl['lbl.btn.dialog.cofirm.header']}" -->
<!-- 										content="#{lbl['lbl.sc.dialog.confirm.contact.person.dtls']}" -->
<!-- 										update="@([id$=democontactPersonPanel])" /> 									</c:if> -->

									<p:confirmDialog id="contactPersonDeleteId"
										widgetVar="contactPersonDeletePopUp"
										header="#{lbl['lbl.sc.confirmation']}"
										message="#{lbl['lbl.sc.dialog.confirm.contact.person.dtls']}"
										resizable="false" closable="false">
										<div align="right">
											<p:commandButton id="okDialogId"
												value="#{lbl['lbl.btn.dialog.cofirm.yes']}"
												action="#{demoInvBB.deleteContactPerson}"
												update="@([id$=democontactPersonPanel])" process="@this"
												onclick="contactPersonDeleteId.hide();" />
											<p:commandButton value="#{lbl['lbl.btn.no']}"
												onclick="contactPersonDeleteId.hide();" type="button"
												partialSubmit="true" process="@this" />
										</div>
									</p:confirmDialog>

								</td>
							</tr>
						</table>
					</td>
				</tr>
			</table>
		</p:panel>
	</h:panelGroup>

</ui:composition>
