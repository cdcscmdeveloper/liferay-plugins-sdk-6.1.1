<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="demoDetails" width="150px">
		<p:panel header="#{lbl['lbl.sc.demo.details']}"
			text-transform="uppercase" toggleable="true"
			rendered="#{demoInvBB.managedBean.qualifiedSupplier}">
			<table style="width: 100%;">
				<tr>
					<td>
						<table>
							<tr>
								<td><p:outputLabel value="#{lbl['lbl.invitation.by']}" /></td>
								<td><p:selectOneRadio id="invById"
										label="#{lbl['lbl.invitation.by']}"
										value="#{demoInvBB.managedBean.demoInvBy}">
										<f:selectItems value="#{demoInvBB.getAllByItemDropDown()}" />
										<p:ajax event="change"
											listener="#{demoInvBB.onchangeInvBy(demoInvBy)}"
											process="@this" partialSubmit="true" update="@form"></p:ajax>
									</p:selectOneRadio></td>
								<td><p:message id="invByMsgId" for="invById" display="icon" />
									<ac:iconTooltip value="#{lbl['lbl.invitation.by.tooltip']}" /></td>
							</tr>
						</table>
					</td>
				</tr>
				<tr>
					<td id="demoInstruction">
						<table>
							<c:choose>
								<c:when test="#{demoInvBB.managedBean.demoInvBy eq 'AI'}">
									<tr>
										<td style="padding-right: 392px;"><h:outputText
												styleClass="instruction"
												value="#{lbl['lbl.demo.instruction.all']}" escape="false" /></td>
									</tr>
									<tr>
										<td><br /></td>
									</tr>
									<tr>
										<td><ui:include src="demoSubTableAllItemList.xhtml" /></td>
									</tr>
									<tr>
										<td><ui:include src="demoRemarkAndContactPerson.xhtml" /></td>
									</tr>
								</c:when>
								<c:when test="#{demoInvBB.managedBean.demoInvBy eq 'BI'}">
									<tr>
										<td style="padding-right: 392px;"><h:outputText
												styleClass="instruction"
												value="#{lbl['lbl.demo.instruction.item']}" escape="false" /></td>
									</tr>
									<tr>
										<td><br /></td>
									</tr>
									<tr>
										<td><ui:include src="demoSubTableItemList.xhtml" /></td>
									</tr>
									<tr>
										<td><ui:include src="demoRemarkAndContactPerson.xhtml" /></td>
									</tr>
								</c:when>
								<c:otherwise>
									<tr>
										<td>
<!-- 										<h:outputText styleClass="instruction" value="#{lbl['lbl.demo.instruction']}" escape="false" /> -->
										</td>
									</tr>
								</c:otherwise>
							</c:choose>
						</table>
					</td>
				</tr>
			</table>
		</p:panel>

		<p:confirmDialog id="demoCancelId" widgetVar="democancel"
			header="#{lbl['lbl.sc.confirmation']}"
			message="#{lbl['lbl.demo.cancel']}" resizable="false"
			closable="false">
			<div align="right">
				<p:commandButton id="demoCancelDialogId"
					value="#{lbl['lbl.btn.ok']}" action="#{demoInvBB.demoCancel()}"
					update="@form" process="@this" onclick="demoCancelId.hide()" />
			</div>
		</p:confirmDialog>
	</h:panelGroup>




</ui:composition>
