<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<ui:define name="contentSection">

		<table>
			<TR>
				<td style="width: 20%; white-space: nowrap;"><p:outputLabel
						value="#{lbl['lbl.sc.invitation.type']}" /></td>
				<td style="width: 80%"> <p:selectOneMenu
						value="#{scSupplirInvitationdBB.managedBean.selectedInvitationType}"
						style="width: 250px; margin-bottom: 5px;">
						<f:selectItems
							value="#{scSupplirInvitationdBB.managedBean.invitationTypeMap.entrySet()}" var="typeMap" itemValue="#{typeMap.key}" 
							itemLabel="#{typeMap.value}"/>
						<p:ajax event="change" update="scSuppInviteTblId"
							listener="#{scSupplirInvitationdBB.searchSelectedInvitationType}" partialSubmit="true" process="@this" />
					</p:selectOneMenu>
					</td>
			</TR>
		</table>
		
		<p:dataTable id="scSuppInviteTblId"
			value="#{scSupplirInvitationdBB.supplierInvitationModel}" lazy="true"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			 style="width:100%" var="supplierInviteList" rows="10" rowIndexVar="rowIndex">
			<ac:paginator for="scSuppInviteTblId" />
			
			<p:column headerText="#{lbl['lbl.sc.no']}" style="text-align:center">
				<h:outputText value="#{rowIndex+1}." />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.title']}" style="text-align:center">
				<h:outputText value="#{supplierInviteList[1]}" style="float:left;"/>
			</p:column>
			
			<p:column headerText="#{lbl['lbl.sc.start.date']}" style="text-align:center">
				<h:outputText value="#{supplierInviteList[2]}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.end.date']}" style="text-align:center">
				<h:outputText value="#{supplierInviteList[3]}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATETIME_FORMAT}" />
				</h:outputText>
			</p:column>

		<p:column headerText="#{lbl['lbl.sc.invitation.type']}" style="text-align:center">
			<ui:param name="statusId" value="#{supplierInviteList[4]}"></ui:param>
			<ui:param name="labelVlaue" value="#{scSupplirInvitationdBB.labelValue(statusId)}" />
				<h:outputLink
					value="#{scSupplirInvitationdBB.getNavigationUrl(statusId,supplierInviteList[0])}">
					<h:outputText value="#{labelVlaue}" />
				</h:outputLink>
		</p:column>

	</p:dataTable>
</ui:define>

</ui:composition>
