<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		
	<ui:define name="contentSection">
		<p:panel id="suppQualPnl" header="Supplier Qualification Criteria" toggleable="true">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" columnClasses="columnWidth20">
				
				<h:column>
					<h:outputLabel value="* #{lbl['lbl.so.qttentype']}" />
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{supplierReviewBackingBean.managedBean.qt.qtType}">
						<f:selectItems value="#{supplierReviewBackingBean.getDropdownCodeValues(PmCodeCatConst.quotationTenderType)}" />
						<p:ajax event="change" partialSubmit="true" process="@this" update="suppQualPG" />
					</p:selectOneMenu>
				</h:column>
			</h:panelGrid>
					
			<h:panelGroup id="suppQualPG">
				<c:if test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypeOpen 
						or qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypeBumiputra}">
				<ui:include src="/xhtml/ss/quatationtender/nrmqtntender.xhtml" />
				</c:if>
				<c:if test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypePanel}">
					<ui:include src="/xhtml/ss/quatationtender/panelqtntender.xhtml" />
				</c:if>
				<c:if test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypeRestrictedTender}">
					<ui:include src="/xhtml/ss/quatationtender/restictedtender.xhtml" />
				</c:if>
			</h:panelGroup>
			
			<p:commandButton value="#{lbl['lbl.so.qtmscreen']}"
				style="float:right;"
				action="#{qTDetailBB.newAction}" icon="ui-icon-add" />
				
			<br />
			<br />
		</p:panel>
	</ui:define>
</ui:composition>
