<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
    <p:panel>
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td" ></p:panelGrid>
     </p:panel>
     		<div align="right">
     	<p:commandButton  value="SUBMIT" style="margin-right:30px;" />	
	    <p:commandButton  value="SAVE" style="margin-right:30px;" /> 
    </div>
	<p:panel header="Template" toggleable="true">
	
	<p:panelGrid columns="2" style="width:25%;" styleClass="noBorders tr,noBorders td">
	
	<h:outputText value="Qtn/Tender No: "></h:outputText>
	<h:inputText />
	
  
    <h:outputText value="Supporting Doc: " />  
       <p:selectOneRadio id="options" value="">  
           <f:selectItem itemLabel="Yes" itemValue="1" />  
           <f:selectItem itemLabel="No" itemValue="2" />    
       </p:selectOneRadio>

	</p:panelGrid>
	
	<br/>
	<br/>
	</p:panel>
	
	<p:panel header="Supporting Document List" toggleable="true">
	<p:dataTable value="#{maintainenceMB.maintainlist}" var="mantainenceObj" id="maintainlist" resizableColumns="true" editable="true">
        
   <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />  
  
        <p:column headerText="No" style="width:12%">  
           <p:outputLabel value="#{mantainenceObj.supno}"></p:outputLabel>
        </p:column>
          
        <p:column headerText="Title" style="width:20%">  
           <p:outputLabel value="#{mantainenceObj.suptitle}"></p:outputLabel>
        </p:column>
        
        <p:column headerText="Type" style="width:20%">  
           <p:outputLabel value="#{mantainenceObj.suptype}"></p:outputLabel>
        </p:column>            
        
       <p:column style="width:6%">  
            <p:rowEditor />  
        </p:column> 
        
    </p:dataTable>
</p:panel>
<p:panel>
<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">
<p:commandButton value="ADD" style="float:right;">
    
</p:commandButton>
</p:panelGrid>
</p:panel>

</ui:composition>
