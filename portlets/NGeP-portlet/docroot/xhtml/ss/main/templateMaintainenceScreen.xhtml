	<h:panelGroup id="chekSupport">
		<h:panelGrid
			rendered="#{TemplateMBB.managedBean.scqtDoc.isSupportDocReq eq '1'}">
			<p:panel header="Supporting Document List" toggleable="true"
				style="width:1000px;">

				<p:dataTable style="width:950px;" id="docList" var="scQtlist"
					value="#{TemplateMBB.managedBean.supportDocList}"
					rowIndexVar="index">



					<p:column headerText="No" style="width:10%">
						<h:outputText value="#{index+1}"></h:outputText>
					</p:column>

					<p:column headerText="Title" style="width:50%">
						<p:inputText size="50" value="#{scQtlist.title}"></p:inputText>
					</p:column>

					<p:column headerText="Type" style="width:20%">
						<h:outputText value="Upload"></h:outputText>
					</p:column>

					<p:column headerText="Action" style="width:20%">
						<p:commandLink>
							<p:graphicImage library="ep/images/design" name="edit.png"
								value="/resources/ep/images/design/edit.png" />

						</p:commandLink>
						<p:commandLink>
							<p:graphicImage library="ep/images/design" name="delete.png"
								value="/resources/ep/images/design/delete.png" />

						</p:commandLink>
					</p:column>

				</p:dataTable>

				<div align="right" style="width: 950px;">
					<p:commandButton value="ADD" style="float:right;"
						process="@this,docList"  partialSubmit="true" action="#{TemplateMBB.supportingDocAdd}"
						update="docList" />
				</div>
			</p:panel>
		</h:panelGrid>

	</h:panelGroup>
