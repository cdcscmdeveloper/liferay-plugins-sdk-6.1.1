<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel id="searchId" header="#{lbl['lbl.sc.tpl.search']}" toggleable="true"
		style="width:1000px;">
		<p:commandLink value="#{lbl['lbl.sc.tpl.search.template']}"></p:commandLink>
		<table style="width: 80%">
			<tr>
				<td class="TableFieldLeft" style="width: 20%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.title']}"></h:outputLabel></td>
				<td class="TableFieldRight"><h:inputText size="70" style="margin-bottom:5px;"
						value="#{TemplateMBB.managedBean.specName}" />
				</td>
			</tr>
			<tr>
				<td class="TableFieldLeft" style="width: 50%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.spec']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu style="margin-bottom:5px;"
						value="#{TemplateMBB.managedBean.searchSpecTypeId}">
						<f:selectItems
							value="#{TemplateMBB.getDropdownValues(PmCodeCatConst.specificationType)}" />
					</p:selectOneMenu></td>
				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.search.item']}"></h:outputLabel>
				</td>
				<td class="TableFieldRight"><p:selectOneMenu  style="margin-bottom:5px;"
						value="#{TemplateMBB.managedBean.searchItemTypeId}">
						<f:selectItems
							value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.itemType)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.qtn.no']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:inputText  style="margin-bottom:5px;"
						value="#{TemplateMBB.managedBean.qtNum}" /></td>
				<td class="TableFieldLeft" style="width: 30%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.procure.category']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu  style="margin-bottom:5px;"
						value="#{TemplateMBB.managedBean.searchProcurementId}">
						<f:selectItems
							value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.procurementCategory)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>

				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.search.status']}"></h:outputLabel>
				</td>
				<td class="TableFieldRight"><p:selectOneMenu
						value="#{TemplateMBB.managedBean.statusId}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItem itemLabel="Pending" itemValue="0" />
						<f:selectItem itemLabel="Complete" itemValue="1" />
					</p:selectOneMenu></td>
				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.search.record.status']}"></h:outputLabel>

				</td>
				<td class="TableFieldRight"><p:selectOneMenu
						value="#{TemplateMBB.managedBean.recordStatus}">
						<f:selectItem itemLabel="Select One" itemValue="-" />
						<f:selectItem itemLabel="Active" itemValue="1" />
						<f:selectItem itemLabel="Inactive" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>
			
		</table>
       <div align="right" style="width: 80%">
			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.search']}"
			process="@all,searchId"	action="#{TemplateMBB.searchCreateListAction}" update="searchTemplateSpec" icon="ui-icon-search"/>
		</div>
		

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.tpl.tmp.search']}" style="width:1000px;">
	<p:commandLink value="#{lbl['lbl.sc.tpl.list']}"></p:commandLink>
		<h:panelGrid style="width:1000px;">
			<p:dataTable id="searchTemplateSpec" var="scQtDoc"
				value="#{TemplateMBB.templateSpecSearch}" 
				rowKey="#{scQtDoc.qtDocId}" rowIndexVar="index" lazy="true">
				<!--   <p:column selectionMode="multiple"  style="text-align:center;"/> -->
                 <ac:paginator for="searchTemplateSpec"></ac:paginator>
				<p:column headerText="#{lbl['lbl.sc.tpl.search.qtn.no']}">
					<h:outputText value="#{scQtDoc.scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tpl.search.title']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.specName}"></h:outputText>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.search.spec']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.specTypeCode.parameterId}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.search.item']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.itemTypeCode.parameterId}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.search.procure.category']}">
					<h:outputText
						value="#{scQtDoc.tplSpecMaster.procurementCategory.parameterId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tpl.search.status']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.status.statusId}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.search.action']}">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />

					</p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 950px;">
			<p:commandButton value="#{lbl['lbl.sc.tpl.btn.create']}" onclick="create.show();" icon="ui-icon-add"/>

		</div>
		<ui:include src="/xhtml/ss/main/createTemplate.xhtml" />
	</p:panel>

</ui:composition>
