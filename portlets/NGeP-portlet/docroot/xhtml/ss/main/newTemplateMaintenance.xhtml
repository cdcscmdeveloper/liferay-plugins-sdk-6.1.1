<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>


	<ui:define name="contentSection">
	<ui:include src="/xhtml/ss/main/createTemplate.xhtml" />
		<div align="right">
		
			<p:commandButton value="SUBMIT" style="margin-right:30px;"
				onclick="create.show();"/>
			<p:commandButton value="SAVE" style="margin-right:30px;"
				action="#{TemplateMBB.save}" />
		</div>
		<p:panel header="Template" toggleable="true">
			
			<h:panelGrid columns="4"
				columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
				styleClass="noBorders tr,noBorders td">

				<h:outputLabel value="Qtn/Tender No: "></h:outputLabel>

				<p:inputText value="#{TemplateMBB.managedBean.scqtDoc.scQt.qtNo}" />

				<h:outputLabel value="Specification Type: "></h:outputLabel>

				<p:selectOneMenu
					value="#{TemplateMBB.managedBean.specificationType}">
					<f:selectItem itemLabel="Select One" itemValue=" " />
					<f:selectItem itemLabel="Technical" itemValue="1" />
					<f:selectItem itemLabel="Financial" itemValue="2" />
					<p:ajax update="estimated,price"></p:ajax>
				</p:selectOneMenu>

				<h:outputLabel value="Procurement Category: "></h:outputLabel>
				<p:inputText
					value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.procurementCategory.codeId}" />


				<h:outputLabel value="Item Type: "></h:outputLabel>

				<p:inputText
					value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.itemTypeCode.codeId}" />
			</h:panelGrid>
			<h:panelGrid columns="2">
				<h:outputLabel value="Checklist: "></h:outputLabel>

				<p:selectOneMenu
					value="#{TemplateMBB.managedBean.specificationType}">
					<f:selectItem itemLabel="Select One" itemValue="0" />
					<f:selectItem itemLabel="Stagetwo" itemValue="1" />
					<f:selectItem itemLabel="StagetwoAdd" itemValue="2" />
				</p:selectOneMenu>
				<h:outputLabel value="Title: "></h:outputLabel>

				<p:inputText size="100"
					value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.specName}" />





				<h:outputLabel value="Description: "></h:outputLabel>

				<p:inputTextarea rows="3" cols="100" autoResize="false"
					value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.specDesc}" />

			</h:panelGrid>

			<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:70%">
				<p:row>
					<p:column>
						<h:outputLabel value="Zone: " />
					</p:column>
					<!--   <p:inputText id="zone" disabled="#{TemplateMBB.managedBean.specificationType ne '2'}"></p:inputText> -->
					<p:column>
						<p:selectOneMenu id="zone"
							value="#{TemplateMBB.managedBean.scqtDoc.qtZoneCriteriaId}">
							<f:selectItems
								value="#{templateSpecBackingBean.getDropdownValues(PmCodeCatConst.zonalCategory)}" />
						</p:selectOneMenu>
					</p:column>
					<p:column>
						<h:outputLabel value="Estimated Cost Required: " />
					</p:column>
					<p:column>
						<p:selectOneRadio id="estimated"
							disabled="#{TemplateMBB.managedBean.specificationType ne '2'}"
							value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.estCostReq}">
							<f:selectItem itemLabel="Yes" itemValue="true" />
							<f:selectItem itemLabel="No" itemValue="false" />

						</p:selectOneRadio>
					</p:column>
				</p:row>
				<p:row>
					<p:column>
						<h:outputLabel value="Status: " />
					</p:column>
					<p:column>
						<p:inputText value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.status.statusId}"></p:inputText>
					</p:column>

					<p:column>
						<h:outputLabel value="Tier price Required: " />
					</p:column>
					<p:column>
						<p:selectOneRadio id="price"
							disabled="#{TemplateMBB.managedBean.specificationType ne '2'}"
							value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.tierPrice}">
							<f:selectItem itemLabel="Yes" itemValue="true" />
							<f:selectItem itemLabel="No" itemValue="false" />

						</p:selectOneRadio>
					</p:column>
				</p:row>


			</p:panelGrid>
		</p:panel>


		<ui:include src="/xhtml/tpl/spec/specContent.xhtml" />
		<h:panelGrid columns="2">
			<h:outputLabel value="Total:"></h:outputLabel>
			<p:inputText
				value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.specTotal}"></p:inputText>
		</h:panelGrid>



	</ui:define>


</ui:composition>
