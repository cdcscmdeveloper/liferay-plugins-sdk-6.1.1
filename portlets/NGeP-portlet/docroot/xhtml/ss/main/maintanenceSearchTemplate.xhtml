                        <table style="width:100%">
<tr>
<td class="TableFieldLeft" style="width:30%">

			<h:outputLabel value="Template Title"></h:outputLabel>
</td>
<td class="TableFieldRight">
			<h:inputText size="70" value="#{TemplateMBB.managedBean.scqtDoc.tplSpecMaster.specName}" />
</td>
</tr>
		<tr>
<td class="TableFieldLeft" style="width:50%">

			<h:outputLabel value="Specification Type"></h:outputLabel>
</td>
<td class="TableFieldRight">
			<p:selectOneMenu value="#{TemplateMBB.managedBean.searchSpecTypeId}">
							<f:selectItems value="#{TemplateMBB.getDropdownValues(PmCodeCatConst.specificationType)}" />
						</p:selectOneMenu>
</td>
<td class="TableFieldLeft">
			<h:outputLabel value="Item Type"></h:outputLabel>
</td>

				<p:selectOneMenu value="#{TemplateMBB.managedBean.searchItemTypeId}" >

		<div align="right">
			<p:commandButton value="SEARCH" action="#{TemplateMBB.searchCreateListAction}" update="searchDoc"/>
		</div>

	<p:panel header="Template Search" style="width:1000px;">
		<h:panelGrid  style="width:950px;">
			<p:dataTable id="searchDoc" var="scQtDoc"
				value="#{TemplateMBB.managedBean.docSearchlist}"
				editable="true"
				rowKey="#{scQtDoc.qtDocId}" rowIndexVar="index">
          <!--   <p:column selectionMode="multiple"  style="text-align:center;"/> -->

				<p:column headerText="Qtn/Tender No">
					<h:outputText value="#{scQtDoc.scQt.qtNo}" />
				</p:column>

				<p:column headerText=" Template Title">
					<h:outputText value="#{scQtDoc.tplSpecMaster.specName}"></h:outputText>
				</p:column>
				<p:column headerText="Specification Type">
					<h:outputText value="#{scQtDoc.tplSpecMaster.specTypeCode.parameterId}" />
				</p:column>
				<p:column headerText="Item Type">
					<h:outputText value="#{scQtDoc.tplSpecMaster.itemTypeCode.parameterId}" />
				</p:column>
				<p:column headerText="Procurement Category">
					<h:outputText value="#{scQtDoc.tplSpecMaster.procurementCategory.parameterId}" />
				</p:column>
			
				<p:column headerText="Status">
					<h:outputText value="#{scQtDoc.tplSpecMaster.status.statusId}" />
				</p:column>
				<p:column headerText="Action">
					   <p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 950px;">
			<p:commandButton value="CREATE"  onclick="create.show();"/>

		</div>
      <ui:include src="/xhtml/ss/main/createTemplate.xhtml" />
	</p:panel>
