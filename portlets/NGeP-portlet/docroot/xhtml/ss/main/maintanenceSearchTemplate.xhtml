<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="Search" toggleable="true">
		<p:commandLink value="Search Template"></p:commandLink>
		<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">

			<h:outputText value="Qtn/Tender No: "></h:outputText>
			<h:inputText size="70" />

			<h:outputText value="Template Title: "></h:outputText>
			<h:inputText size="100" />

		</p:panelGrid>
		<div align="right">
			<p:commandButton value="SEARCH" />
		</div>

	</p:panel>

	<p:panel header="Template Search" style="width:1000px;">
		<h:panelGrid style="width:950px;">
			<p:dataTable var="compilance"
				value="#{specificationBackingBean.managedBean.compilaenceList}"
				editable="true"
				selection="#{specificationBackingBean.selectedCompilenceList}"
				rowKey="#{compilance.compilanceId}" rowIndexVar="index">


				<p:column headerText="Qtn/Tender No">
					<h:outputText value="#{index+1}" />
				</p:column>

				<p:column headerText=" Template Title">
					<h:outputText value="Title#{index+1}"></h:outputText>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 950px;">
			<p:commandButton value="CREATE"
				action="#{TemplateMBB.editAction}" />

		</div>

	</p:panel>

</ui:composition>
