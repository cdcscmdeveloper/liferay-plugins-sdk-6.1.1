<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
    <p:panel>
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td" ></p:panelGrid>
     </p:panel>
     		<div align="right">
	    <p:commandButton  value="SEARCH" ajax="false" style="margin-right:30px;" /> 
    </div>
	<p:panel header="Search Template" toggleable="true">
	
	<p:panelGrid columns="2" style="width:25%;" styleClass="noBorders tr,noBorders td">
	
	<h:outputText value="Qtn/Tender No: "></h:outputText>
	<h:inputText />
	
	<h:outputText value="Template Title: "></h:outputText>
	<h:inputText />

	</p:panelGrid>
	
	<br/>
	<br/>
	</p:panel>
	
	<p:panel header="Template List" toggleable="true">
	<p:dataTable value="#{maintainenceMB.maintainlist}" var="mantainenceObj" id="maintainlist" resizableColumns="true" editable="true">
        
   <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />  
  
        <p:column headerText="Qtn/Tender No" style="width:12%">  
           <p:outputLabel value="#{mantainenceObj.mainno}"></p:outputLabel>
        </p:column>
          
        <p:column headerText="Template Title" style="width:20%">  
           <p:outputLabel value="#{mantainenceObj.maintitle}"></p:outputLabel>
        </p:column>  
        
       <p:column style="width:6%">  
            <p:rowEditor />  
        </p:column> 
        
    </p:dataTable>
</p:panel>
<p:panel>
<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">
<p:commandButton value="CREATE" action="templateMaintainence.xhtml?faces-redirect=true" style="float:right;">
    
</p:commandButton>
</p:panelGrid>
</p:panel>

</ui:composition>
