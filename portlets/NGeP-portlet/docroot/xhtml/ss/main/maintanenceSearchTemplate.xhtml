	<p:panel header="Template Search" style="width:1000px;">
		<h:panelGrid style="width:950px;">
			<p:dataTable var="compilance"
				value="#{specificationBackingBean.managedBean.compilaenceList}"
				editable="true"
				selection="#{specificationBackingBean.selectedCompilenceList}"
				rowKey="#{compilance.compilanceId}" rowIndexVar="index">


				<p:column headerText="Qtn/Tender No">
					<h:outputText value="#{index+1}" />
				</p:column>

				<p:column headerText=" Template Title">
					<h:outputText value="Title#{index+1}"></h:outputText>
				</p:column>
				<p:column headerText="Specification Type">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="Item Type">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="Procurement Category">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="Qtn/Tender No">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="Status">
					<h:outputText value="#{index+1}" />
				</p:column>
				<p:column headerText="Action">
					   <p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 950px;">
			<p:commandButton value="CREATE" action="#{TemplateMBB.editAction}" />

		</div>
