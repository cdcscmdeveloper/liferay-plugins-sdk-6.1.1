<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

<p:dialog  widgetVar="approvalUpload" modal="true" 
		 hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{approvalBackingBean.handleFileUpload}" mode="advanced"
			
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			 oncomplete="approvalUpload.hide()" update1="#{approvalBackingBean.managedBean.uploadUpdateId}">
			 <f:attribute name="uploadAction" value="#{approvalCategory.titleName}" />
		</p:fileUpload>
	</p:dialog>
	
	
	
	</ui:composition>
