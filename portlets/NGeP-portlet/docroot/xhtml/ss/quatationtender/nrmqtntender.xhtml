<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Normal Qtn/Tender  (for Qtn/Tender Type is Open/Bumiputra)"
		toggleable="true">


		<p:dataTable value="#{searchQtnTenderBB.managedBean.categories}"
			var="ccode" resizableColumns="true" editable="true">
			<p:ajax event="rowEdit" />
			<p:ajax event="rowEditCancel" />

			<p:column headerText="No.">

				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.num}" />
					</f:facet>
					<f:facet name="input">
						<p:inputText value="#{ccode.num}" style="width:100%" />
					</f:facet>
				</p:cellEditor>

			</p:column>

			<p:column headerText="Category Code">

				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.mainCCode}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItems value="#{searchQtnTenderBB.managedBean.mainCcode}" />
						</p:selectOneMenu>
					</f:facet>
				</p:cellEditor>
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.subCCode}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="sub1" itemValue="1" />
							<f:selectItem itemLabel="sub2" itemValue="2" />
							<f:selectItem itemLabel="sub3" itemValue="3" />
						</p:selectOneMenu>
					</f:facet>
				</p:cellEditor>
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.subCDevison}" />
					</f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Subcc1" itemValue="1" />
							<f:selectItem itemLabel="Subcc2" itemValue="2" />
							<f:selectItem itemLabel="Subcc3" itemValue="3" />
						</p:selectOneMenu>
					</f:facet>
				</p:cellEditor>



			</p:column>

			<p:column headerText="Mandatory">


				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.manditory}" />
					</f:facet>
					<f:facet name="input">

						<p:selectManyCheckbox
							value="#{searchQtnTenderBB.managedBean.selectOptions}">
							<f:selectItem itemLabel="yes" />
							<f:selectItem itemLabel="no" />

						</p:selectManyCheckbox>
					</f:facet>
				</p:cellEditor>

			</p:column>
			<p:column style="width:6%">
				<p:rowEditor />
			</p:column>

		</p:dataTable>


		<h:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<p:commandButton value="Add" style="float:right;"
				onclick="ccdlg.show();" />
		</h:panelGrid>
		<h:panelGrid columns="2" style="width:50%;"
			styleClass="noBorders tr,noBorders td">

			<h:outputText value="MulitipleLocality: " />
			<p:selectOneRadio
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="yes" itemValue="1" />
				<f:selectItem itemLabel="No" itemValue="2" />
				<p:ajax update="@form" />
			</p:selectOneRadio>
		</h:panelGrid>

		<h:panelGrid columns="2"
			rendered="#{searchQtnTenderBB.managedBean.selectOption eq '1'}">

			<h:outputText value="AllStates: " />
			<p:selectBooleanCheckbox value="#{searchQtnTenderBB.checked}" />


		</h:panelGrid>

		<p:panel header="Location List" toggleable="true">

			<p:dataTable id="dtusers"
				value="#{searchQtnTenderBB.managedBean.locations}" var="tenders"
				editable="true">
				<p:ajax event="rowEdit" />
				<p:ajax event="rowEditCancel" />
				<p:column headerText="States" style="width:30%">
					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="#{tenders.state}" />
						</f:facet>
						<f:facet name="input">
							<h:selectOneMenu value="#{tenders.state}">
								<f:selectItems
									value="#{searchQtnTenderBB.managedBean.stateList}" var="state"
									itemLabel="#{state}" itemValue="#{state}" />
							</h:selectOneMenu>
						</f:facet>
					</p:cellEditor>
				</p:column>

				<p:column headerText="Districts">
					<p:cellEditor>
						<f:facet name="output">
							<ui:repeat var="loccity" value="#{tenders.location}">
								<h:outputText value="#{loccity}"  />
							</ui:repeat>

						</f:facet>
						<f:facet name="input">
							<p:selectManyCheckbox value="#{tenders.city}"
								layout="pageDirection">
								<f:selectItems value="#{searchQtnTenderBB.managedBean.cities}" />
							</p:selectManyCheckbox>


						</f:facet>
					</p:cellEditor>

				</p:column>


				<p:column style="width:6%">
					<p:rowEditor />
				</p:column>


			</p:dataTable>
			<p:commandButton value="ADDStates" style="float:right;"
				onclick="stateDlg.show();"></p:commandButton>
			<br />

		</p:panel>




		<p:panel header="Location List" toggleable="true">
			<h:panelGroup style="width:100%;">
				<p:dataTable id="zones"
					value="#{searchQtnTenderBB.managedBean.locations}" var="tenders"
					editable="true">
					<p:ajax event="rowEdit" />
					<p:ajax event="rowEditCancel" />

					<p:column headerText="Zones">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{tenders.zone}" />
							</f:facet>
							<f:facet name="input">
								<h:selectOneMenu value="#{tenders.zone}">
									<f:selectItems value="#{searchQtnTenderBB.managedBean.zones}"
										var="state" itemLabel="#{state}" itemValue="#{state}" />
								</h:selectOneMenu>
							</f:facet>
						</p:cellEditor>

					</p:column>
					<p:column headerText="States" style="width:30%">
						<p:cellEditor>
							<f:facet name="output">
								<h:outputText value="#{tenders.state}" />
							</f:facet>
							<f:facet name="input">
								<h:selectOneMenu value="#{tenders.state}">
									<f:selectItems
										value="#{searchQtnTenderBB.managedBean.zoneState}" var="state"
										itemLabel="#{state}" itemValue="#{state}" />
								</h:selectOneMenu>
							</f:facet>
						</p:cellEditor>

					</p:column>

					<p:column headerText="Districts">
						<p:cellEditor>
							<f:facet name="output">
								<ui:repeat var="loccity" value="#{tenders.location}">
								<h:outputText value="#{loccity}"  />
							</ui:repeat>
							</f:facet>
							<f:facet name="input">
								<p:selectManyCheckbox value="#{tenders.city}"
									layout="pageDirection">
									<f:selectItems
										value="#{searchQtnTenderBB.managedBean.zoneCities}" />
								</p:selectManyCheckbox>

							</f:facet>
						</p:cellEditor>
					</p:column>



					<p:column style="width:6%">
						<p:rowEditor />
					</p:column>


				</p:dataTable>
				<p:commandButton value="ADDZones" style="float:right;"
					onclick="dlg1.show();"></p:commandButton>
			</h:panelGroup>
			<br />

		</p:panel>


		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<h:outputText value="Paid Up Capital RM (More than)" />
			<p:inputText value="#{searchQtnTenderBB.managedBean.qtno}" />


		</p:panelGrid>

		<p:commandButton value="Search" style="float:right;"
			onclick="suppdlg.show();"></p:commandButton>

		<br />
		<br />
		<ui:include src="/xhtml/ss/quatationtender/supplierlist.xhtml"></ui:include>

		<p:panelGrid columns="3" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<h:outputText value="TotalSuppliers" />
			<p:inputText value="1" readonly="true" />


			<p:commandButton value="CreateQtn/Tender" style="float:right;"
				action="quatationtendercreation?faces-redirect=true">

			</p:commandButton>
		</p:panelGrid>
	</p:panel>

	<p:dialog widgetVar="stateDlg" modal="true">
		<p:panel header="Add State" toggleable="true">

			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="States"></p:outputLabel>
				<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.state}"
					valueChangeListener="#{searchQtnTenderBB.managedBean.stateChangeListener}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems value="#{searchQtnTenderBB.managedBean.stateList}" />
					<p:ajax event="change" update="cities" />
				</p:selectOneMenu>
				<p:fieldset legend="Districts">
					<p:selectManyCheckbox id="cities"
						value="#{searchQtnTenderBB.managedBean.location}"
						layout="pageDirection">
						<f:selectItems value="#{searchQtnTenderBB.managedBean.cities}" />
					</p:selectManyCheckbox>
				</p:fieldset>
			</p:panelGrid>
			<p:commandButton action="#{searchQtnTenderBB.managedBean.addAction}"
				update="dtusers" value="Add" oncomplete="stateDlg.hide()"
				style="float:right" />

		</p:panel>
	</p:dialog>

	<p:dialog widgetVar="dlg1" modal="true">
		<p:panel header="Add State" toggleable="true">

			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:outputLabel value="Zones"></p:outputLabel>
				<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.zone}"
					valueChangeListener="#{searchQtnTenderBB.managedBean.zoneChangeListener}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems value="#{searchQtnTenderBB.managedBean.zones}" />
					<p:ajax event="change" update="zstates" />
				</p:selectOneMenu>

				<p:outputLabel value="States"></p:outputLabel>
				<p:selectOneMenu id="zstates"
					value="#{searchQtnTenderBB.managedBean.zoneSt}"
					valueChangeListener="#{searchQtnTenderBB.managedBean.zoneStChangeListener}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems value="#{searchQtnTenderBB.managedBean.zoneState}" />
					<p:ajax event="change" update="zcities" />
				</p:selectOneMenu>
				<p:fieldset legend="Districts">
					<p:selectManyCheckbox id="zcities"
						value="#{searchQtnTenderBB.managedBean.zoneCt}"
						layout="pageDirection">
						<f:selectItems value="#{searchQtnTenderBB.managedBean.zoneCities}" />
					</p:selectManyCheckbox>
				</p:fieldset>
			</p:panelGrid>
			<p:commandButton
				action="#{searchQtnTenderBB.managedBean.addZoneAction}"
				update="zones" value="Add" oncomplete="dlg1.hide()"
				style="float:right" />

		</p:panel>
	</p:dialog>

</ui:composition>
