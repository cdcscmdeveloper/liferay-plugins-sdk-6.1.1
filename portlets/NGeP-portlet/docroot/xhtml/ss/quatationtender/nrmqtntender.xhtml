<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20AlignTop">
			<h:column>
				<h:outputLabel value="Category Code List" />
			</h:column>
			<h:column>
				<ui:include src="categoryList.xhtml" />
			</h:column>
		</h:panelGrid>
		
		<br />
		
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:outputLabel value="#{lbl['lbl.so.mullocal']}" />
			<p:selectOneRadio
				value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality}" style="margin-bottom:5px;" disabled="#{!qTDetailBB.managedBean.editable}">
				<f:selectItem itemLabel="yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
				<p:ajax event="change"
					listener="#{qTSupplierQulCriteriaBackingBean.multiLocationChange}"
					partialSubmit="true" process="@this" update="allstate, supplierlist"></p:ajax>
			</p:selectOneRadio>
		</h:panelGrid>
		<h:panelGroup id="allstate">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" columnClasses="columnWidth20"
				rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.multiLocality}">
				<h:outputLabel value="#{lbl['lbl.so.allstate']}" />
				<p:selectBooleanCheckbox value="#{qTSupplierQulCriteriaBackingBean.qtCriteria.allState}" disabled="#{!qTDetailBB.managedBean.editable}" />
			</h:panelGrid>
		</h:panelGroup>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.paidup']}" />
			</h:column>
			<h:column>  
            	<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}" style="margin-right:5px;" disabled="#{!qTDetailBB.managedBean.editable}"/> 
            	<h:inputText value="MYR" disabled="true" size="1" />
          	</h:column>
        </h:panelGrid>
		<p:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:commandButton value="#{lbl['lbl.so.searchbtn']}" rendered="#{qTDetailBB.managedBean.editable}"
				icon="ui-icon-search" style="float:right;"
				partialSubmit="true"
				process="suppQualPnl"
				update="supplierlist"
				action="#{qTSupplierQulCriteriaBackingBean.searchNormalSupplierAction}" />
		</p:panelGrid>
		
		<br/>

	<ui:include src="supplierlist.xhtml" />	
	
	<p:panel header="Delivery Location Details" toggleable="true">
	</p:panel>
</ui:composition>
