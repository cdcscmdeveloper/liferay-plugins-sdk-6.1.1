<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel
		header="Category Code List"
		toggleable="true" >

				<p:dataTable value="#{qTSupplierQulCriteriaBackingBean.managedBean.openCategorys}"
			var="ccode" resizableColumns="true" editable="true" styleClass="myCatList">
			<p:column headerText="Category Code">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL1.categoryL1Id}" />
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL1.categoryL1Id}" >
						<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.handleL2CategoryChange}"/>
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL1s}" var="catL1Opt" itemLabel="#{catL1Opt.cateogryL1Code}" itemValue="#{catL1Opt.categoryL1Id}"/>
						</p:selectOneMenu>
					</f:facet>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL2.categoryL2Id}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL2.categoryL2Id}"
							effect="fold" editable="true">
							<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.handleL3CategoryChange}"/>
							<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL2s}" var="catL2Opt" itemLabel="#{catL2Opt.cateogryL2Code}" itemValue="#{catL2Opt.categoryL2Id}"/>
						</p:selectOneMenu>
					</f:facet>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL3.cateogryL3Id}" />
					</f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL3.cateogryL3Id}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL3s}" var="catL3Opt" itemLabel="#{catL3Opt.cateogryL3Code}" itemValue="#{catL3Opt.categoryL3Id}"/>
						</p:selectOneMenu>
					</f:facet>
					</p:cellEditor>
			 </p:column>
			 <p:column headerText="Mandatory" style="width: 150px;">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.isMandatory}" />
					</f:facet>
					<f:facet name="input">

						<p:selectManyCheckbox
							value="#{searchQtnTenderBB.managedBean.selectOptions}">
							<f:selectItem itemLabel="yes" />
							<f:selectItem itemLabel="no" />

						</p:selectManyCheckbox>
					</f:facet>
				</p:cellEditor>

			</p:column>
     		<p:column style="width:6%">
				<p:rowEditor />
			</p:column>

		</p:dataTable>


		<h:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<p:commandButton value="ADD" style="float:right;"
				actionListener="#{qTSupplierQulCriteriaBackingBean.addNewCategoryItem}" update="@(.myCatList)" />
		</h:panelGrid>
	
	<h:panelGrid columns="2" style="width:40%;"
			styleClass="noBorders tr,noBorders td">

			<h:outputText value="Mulitiple Locality: " />
			
		
			<p:selectOneRadio value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtc.multiLocality}">
			<f:selectItem itemLabel="yes" itemValue="true" />
			<f:selectItem itemLabel="No" itemValue="false" />
			<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.multiLocationChange}"
				partialSubmit="true" process="@this" update="allstate"></p:ajax>
		</p:selectOneRadio>
		
		<h:panelGroup id="allstate">
			<h:panelGroup rendered="#{qTSupplierQulCriteriaBackingBean.managedBean.qtc.multiLocality}">
				<h:outputText value="All States: " />
				<p:selectBooleanCheckbox value="#{qTSupplierQulCriteriaBackingBean.checked}" />
			</h:panelGroup>
		</h:panelGroup>
	</h:panelGrid>
	</p:panel>
	</ui:composition>
