<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dialog widgetVar="dlg2" modal="true">
		<p:panel header="Site Details" toggleable="true">

			
			<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">
		
		<h:outputLabel for="sitedesc" value="Site Description" />
				<p:inputTextarea id="sitedesc" value="" columns="50"/>	
				
			<h:outputText value="Site Visit Date "></h:outputText>
			<p:calendar value="#{searchQtnTenderBB.managedBean.tenderBean}"
				id="visitDate" showOn="button" />
				
					
					<h:outputText value="Site Visit Time" />
			<p:calendar value="#{searchQtnTenderBB.managedBean.tenderBean}"
				pattern="HH:mm a" timeOnly="true"/>
			
				 
			 
            
             <h:outputText value="#{lbl['lbl.so.visitlocation']}" />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Location Name" itemValue="" />  
            <f:selectItem itemLabel="Adress Line1" itemValue="1" />  
            <f:selectItem itemLabel="Address Line2" itemValue="2" />  
            <f:selectItem itemLabel="Address Line3" itemValue="3" />  
        </p:selectOneMenu> 
        
         <h:outputText value="#{lbl['lbl.so.coordinateofficer']}" />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Coordinate Officer" itemValue="" />  
            <f:selectItem itemLabel="Officer 1" itemValue="1" />  
            <f:selectItem itemLabel="Officer 2" itemValue="2" />  
            <f:selectItem itemLabel="Officer 3" itemValue="3" />  
        </p:selectOneMenu> 
        
        <h:outputText value="Attendance" />  
        <p:selectOneRadio >  
            <f:selectItem itemLabel="All Zone" itemValue="1" />  
            <f:selectItem itemLabel="Certain Zone" itemValue="2" />  
           </p:selectOneRadio>    
           
           <h:outputText value="#{lbl['lbl.so.zone']}" />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Zone" itemValue="" />  
            <f:selectItem itemLabel="East Zone" itemValue="1" />  
            <f:selectItem itemLabel="West Zone" itemValue="2" />  
            <f:selectItem itemLabel="Central Zone" itemValue="3" />  
        </p:selectOneMenu> 
         </p:panelGrid>  
       	<p:commandButton  value="#{lbl['lbl.so.cancelbtn']}"
			styleClass="apply_button" style="float:right;" onclick="dlg2.hide()">
		</p:commandButton>	
			<p:commandButton value="OK"
			styleClass="apply_button" style="float:right;" onclick="dlg2.hide()">

		</p:commandButton>
		
		
        </p:panel>
        </p:dialog>
</ui:composition>
