<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog widgetVar="dlg1"  header="Briefing Details" 
		 modal="false" >
		<p:panel toggleable="true" styleClass="qtBriefDetails">

			<h:panelGrid style="width:100%;" border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20,columnWidth80">
		
		<h:outputLabel value="#{lbl['lbl.so.briefdesc']}" />
				<p:inputTextarea id="briefdesc" value="#{qTScheduleDetailBB.managedBean.qtBriefing.briefingDesc}" coulumns="50"/>	
		
		<h:outputLabel value="#{lbl['lbl.so.briefdate']}"/>
			<p:calendar value="#{qTScheduleDetailBB.managedBean.qtBriefing.briefingDate}"
				id="briefDate" pattern="MM/dd/yyyy HH:mm a" showOn="button" />	
				
				<h:outputLabel value="#{lbl['lbl.so.location']}" />
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.location}"/>  
               
                  <h:outputLabel value="#{lbl['lbl.so.country']}" />  
       <p:selectOneMenu value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.pmCountry.countryName}"> 
            <f:selectItem itemLabel="Malaysia" itemValue="Malaysia" />  
            <f:selectItem itemLabel="Singapore" itemValue="Singapore" />  
           </p:selectOneMenu> 
               
               </h:panelGrid>
             <h:panelGrid style="width:100%;" border="0" cellpadding="0" cellspacing="0" width="100%" columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
               
               <h:outputLabel value="#{lbl['lbl.so.add1']}" />
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.address1}" />
               
                 <h:outputLabel value="* #{lbl['lbl.so.city']}"/>
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.pmCity.cityName}" /> 
               
               
               <h:outputLabel value="#{lbl['lbl.so.add2']}" />
                <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.address2}" /> 
                
                 <h:outputLabel value="#{lbl['lbl.so.district']}" />
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.pmDistrict.districtName}" />   
               
                <h:outputLabel value="#{lbl['lbl.so.add3']}" />
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.address3}" /> 
               
                <h:outputLabel value="#{lbl['lbl.so.state']}" />  
       <p:selectOneMenu value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.pmState.stateName}"> 
            <f:selectItem itemLabel="Selangor" itemValue="1" />  
            <f:selectItem itemLabel="Kaula lumpur" itemValue="2" />  
           </p:selectOneMenu> 
                    	
                <h:outputLabel value="#{lbl['lbl.so.add4']}" />
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.address4}" />  
        
       	     <h:outputLabel value="* #{lbl['lbl.so.postcode']}" />
               <p:inputText value="#{qTScheduleDetailBB.managedBean.qtBriefing.pmAddress.postcode}" />  
               
             </h:panelGrid>  
       	  <h:panelGrid style="width:100%;" border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth20,columnWidth80">
            
             <h:outputLabel value="#{lbl['lbl.so.coordinateofficer']}" />  
       <p:selectOneMenu value="#{qTScheduleDetailBB.managedBean.qtBriefing.coordinatingOfficer}"> 
            <f:selectItem itemLabel="Coordinate Officer" itemValue="" />  
            <f:selectItem itemLabel="Officer 1" itemValue="Officer 1" />  
            <f:selectItem itemLabel="Officer 2" itemValue="Officer 2" />  
            <f:selectItem itemLabel="Officer 3" itemValue="Officer 3" />  
        </p:selectOneMenu> 
     
           <h:outputLabel value="#{lbl['lbl.so.attendance']}"  />
       <p:selectOneMenu value="#{qTScheduleDetailBB.managedBean.qtBriefing.attendanceType}"> 
            <f:selectItem itemLabel="Zone" itemValue="" />  
            <f:selectItem itemLabel="East Zone" itemValue="East Zone" />  
            <f:selectItem itemLabel="West Zone" itemValue="West Zone" />  
            <f:selectItem itemLabel="Central Zone" itemValue="Central Zone" />  
        </p:selectOneMenu> 
        
        <h:outputLabel value="#{lbl['lbl.so.zone']}" />  
        <p:selectOneRadio value="#{qTScheduleDetailBB.managedBean.qtBriefing.scQtZoneCriteria.zoneName}"> 
            <f:selectItem itemLabel="All Zone" itemValue="All Zone" />  
            <f:selectItem itemLabel="Certain Zone" itemValue="Certain Zone" />  
           </p:selectOneRadio>    
        
			
         </h:panelGrid>  
           
		<p:commandButton  value="#{lbl['lbl.so.cancelbtn']}"
			styleClass="apply_button" style="float:right;" oncomplete="dlg1.hide()">
		</p:commandButton>	
			<p:commandButton value="#{lbl['lbl.so.okbtn']}"    
			styleClass="apply_button" update="briefdetaillist" process="@(.qtBriefDetails)" style="float:right;" oncomplete="dlg1.hide()" action="#{qTScheduleDetailBB.addToBrefieyingList}">

		</p:commandButton>

		
		
        </p:panel>
        </p:dialog>
</ui:composition>
