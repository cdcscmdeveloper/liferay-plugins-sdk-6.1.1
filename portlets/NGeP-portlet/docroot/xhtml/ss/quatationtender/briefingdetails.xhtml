<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog widgetVar="dlg1" modal="true" appendToBody="true">
		<p:panel header="Briefing Details" toggleable="true">

			<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">
		
		<h:outputLabel for="briefdesc" value="Briefing Description" />
				<p:inputTextarea id="briefdesc" value="#{searchQtnTenderBB.managedBean.selectOption}" coulumns="50"/>		
				
			<h:outputText value="Briefing Date and Time "></h:outputText>
			<p:calendar value="#{searchQtnTenderBB.managedBean.tenderBean}"
				id="briefDate" pattern="MM/dd/yyyy HH:mm a" showOn="button" />
				
				 <h:outputText value="#{lbl['lbl.so.location']}" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}"/>  
       	
				 <h:outputText value="Address 1" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
       	 
       	       <h:outputText value="Address 2" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
               
                <h:outputText value="Address 3" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
       	
                <h:outputText value="Address 4" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
       	      	
            
             <h:outputText value="#{lbl['lbl.so.country']}" />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Malaysia" itemValue="1" />  
            <f:selectItem itemLabel="Singapore" itemValue="2" />  
           </p:selectOneMenu> 
           
            <h:outputText value="#{lbl['lbl.so.state']}" />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Selangor" itemValue="1" />  
            <f:selectItem itemLabel="Kaula lumpur" itemValue="2" />  
           </p:selectOneMenu> 
           
             <h:outputText value="* City" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
               
                <h:outputText value="District" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
       	
       	     <h:outputText value="* Postcode" />
               <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
       	  
        
        
          <h:outputText value="#{lbl['lbl.so.coordinateofficer']}" />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Coordinate Officer" itemValue="" />  
            <f:selectItem itemLabel="Officer 1" itemValue="1" />  
            <f:selectItem itemLabel="Officer 2" itemValue="2" />  
            <f:selectItem itemLabel="Officer 3" itemValue="3" />  
        </p:selectOneMenu> 
        
           
           <h:outputText value="Attendance"  />  
        <p:selectOneMenu >  
            <f:selectItem itemLabel="Zone" itemValue="" />  
            <f:selectItem itemLabel="East Zone" itemValue="1" />  
            <f:selectItem itemLabel="West Zone" itemValue="2" />  
            <f:selectItem itemLabel="Central Zone" itemValue="3" />  
        </p:selectOneMenu> 
        
        <h:outputText value="#{lbl['lbl.so.zone']}" />  
        <p:selectOneRadio >  
            <f:selectItem itemLabel="All Zone" itemValue="1" />  
            <f:selectItem itemLabel="Certain Zone" itemValue="2" />  
           </p:selectOneRadio>    
        
         </p:panelGrid>  
           
		<p:commandButton  value="#{lbl['lbl.so.cancelbtn']}"
			styleClass="apply_button" style="float:right;" onclick="dlg1.hide()">
		</p:commandButton>	
			<p:commandButton value="OK"
			styleClass="apply_button" style="float:right;" onclick="dlg1.hide()">

		</p:commandButton>

		
		
        </p:panel>
        </p:dialog>
</ui:composition>
