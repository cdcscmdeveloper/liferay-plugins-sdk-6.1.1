<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	
	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Remarks" toggleable="true">
		<p:panelGrid columns="4" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:dataTable  var="attendancecompany"
				value="#{qTRemarksBB.managedBean.scQtRemarks}" editable="false" styleClass="remarkslist">





				<p:column headerText="Remarks">
					
					
						<p:inputTextarea value="#{qTRemarksBB.managedBean.qtRemark.remark}" rows="1" cols="50" 
                     	disabled="e" />
						
				</p:column>

				<p:column headerText="User">
					<h:outputText value="" readonly="true"></h:outputText>
						 
                     	</p:column>
						
							
						
				

				<p:column headerText="Date/Time">

					
							<h:outputText value="#{qTRemarksBB.managedBean.qtRemark.createdDate}" readonly="true"></h:outputText>
					
				
						

				</p:column>

				<p:column headerText="Status">
					<h:outputText value="#{qTRemarksBB.managedBean.qtRemark.recordStatus}" readonly="true"></h:outputText>
					</p:column>

			</p:dataTable>

		</p:panelGrid>
		<p:commandButton value="Delete" style="float:right;" ></p:commandButton>
		
		 <p:commandButton value="ADD" action="#{qTRemarksBB.addRemarks}" update="@(.remarkslist)" style="float:right;" ></p:commandButton>

	</p:panel>
</ui:composition>
