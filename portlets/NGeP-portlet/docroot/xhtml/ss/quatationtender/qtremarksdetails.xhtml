<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	
	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Remarks" style="width: 100%" toggleable="true">
	
	<table style="width: 50%" id="remarkslist">
		<tr>
			<td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
			<td class="TableFieldRight">
				<p:dataGrid id="remarklist" value="#{qTRemarksBB.managedBean.scQtRemarks}" var="remarkVar" rowIndexVar="remarkIndex" columns="1" >
					<table>
						<tr>
							<td rowspan="2" valign="top">
								<h:graphicImage value="#{qTRemarksBB.userImagePath(remarkVar.createdUsername)}" height="30" width="30" />
							</td>
							<td width="5"></td>
							<td>
								<h:outputText value="#{remarkVar.createdUsername}"></h:outputText>,
								<h:outputText id="remarkDate" value="#{remarkVar.changedDate}">
									<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
								</h:outputText>
							</td>
						</tr>
						<tr>
							<td></td>
							<td>
								<p:inputTextarea cols="40" value="#{remarkVar.remark}" rendered="#{remarkIndex==0}" /> 
								<h:outputText value="#{remarkVar.remark}" rendered="#{remarkIndex>0}" style="display: inline-block; width:220px;word-wrap: break-word;" />
							</td>
						</tr>
					</table>
				</p:dataGrid>
			</td>
		</tr>
	</table>    				
<!-- <p:commandButton value="ADD" action="#{qTRemarksBB.addRemarks}" update="@(.remarkslist)" style="float:right;" ></p:commandButton> -->
	</p:panel>	
	

	
</ui:composition>
