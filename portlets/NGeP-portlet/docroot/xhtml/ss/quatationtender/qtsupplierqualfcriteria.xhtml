<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<ui:define name="contentSection">
		<table style="border: 0px; width: 1000px">
			<tr>
				<td width="200px" valign="top"><ui:include
						src="/xhtml/ss/quatationtender/qtsubmenu.xhtml"></ui:include></td>

				<td width="800px" align="left" valign="top"><ui:include
						src="/xhtml/ss/quatationtender/dopublicationbuttons.xhtml" /> <ui:include
						src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" /> <p:panel
						header="Supplier Qualification Criteria" toggleable="true">
						<p:panelGrid columns="2" style="width:40%;"
							styleClass="noBorders tr,noBorders td">
							<h:outputText value="* Qtn/Tender Type" />
							<p:selectOneMenu
								value="#{searchQtnTenderBB.managedBean.tenderSelction}">
								<f:selectItem itemLabel="Select One" itemValue="" />
								<f:selectItem itemLabel="Open" itemValue="1" />
								<f:selectItem itemLabel="Bumiputra" itemValue="2" />
								<f:selectItem itemLabel="Panel" itemValue="3" />
								<f:selectItem itemLabel="Restricted Tender" itemValue="4" />
								<p:ajax event="change" update="parentText" process="@this" />


							</p:selectOneMenu>

						</p:panelGrid>

					</p:panel> <h:panelGroup id="parentText">
						<h:panelGroup
							rendered="#{searchQtnTenderBB.managedBean.tenderSelction eq '1' or searchQtnTenderBB.managedBean.tenderSelction eq '2'}">
							<ui:include src="/xhtml/ss/quatationtender/nrmqtntender.xhtml" />
						</h:panelGroup>
						<h:panelGroup
							rendered="#{searchQtnTenderBB.managedBean.tenderSelction eq '3' }">

							<ui:include src="/xhtml/ss/quatationtender/panelqtntender.xhtml" />
						</h:panelGroup>

						<h:panelGroup
							rendered="#{searchQtnTenderBB.managedBean.tenderSelction eq '4' }">
							<ui:include src="/xhtml/ss/quatationtender/restictedtender.xhtml" />
						</h:panelGroup>

					</h:panelGroup> <ui:include
						src="/xhtml/ss/quatationtender/cloneqtntenderscreen.xhtml" /></td>
			</tr>
		</table>


	</ui:define>
</ui:composition>
