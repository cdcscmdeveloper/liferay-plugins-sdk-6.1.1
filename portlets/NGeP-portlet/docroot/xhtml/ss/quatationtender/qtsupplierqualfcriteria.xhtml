<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" /> 
	
	<p:panel id="suppQualPnl" header="Supplier Qualification Criteria" toggleable="true">
		<h:panelGroup id="suppQualPG">
			<c:if test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypeOpen 
						or qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypeBumiputra}">
				<ui:include src="nrmqtntender.xhtml" />
			</c:if>
			<c:if test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypePanel}">
				<ui:include src="panelqtntender.xhtml" />
			</c:if>
			<c:if test="#{qTSupplierQulCriteriaBackingBean.managedBean.qt.qtType == PmCodeConst.quotationTenderTypeRestrictedTender}">
				<ui:include src="restictedtender.xhtml" />
			</c:if>
		</h:panelGroup>
	</p:panel>
</ui:composition>
