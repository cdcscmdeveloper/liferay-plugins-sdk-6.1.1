<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	
	 <ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" /> 
	 <p:panel
						header="Supplier Qualification Criteria" toggleable="true">
						<p:panelGrid columns="2" style="width:40%;"
							styleClass="noBorders tr,noBorders td">
							<h:outputText value="* Qtn/Tender Type" />
							<p:selectOneMenu
								value="#{qTDetailBB.managedBean.qt.qtType}">
								<f:selectItem itemLabel="Select One" itemValue="" />
								<f:selectItem itemLabel="Open" itemValue="1" />
								<f:selectItem itemLabel="Bumiputra" itemValue="2" />
								<f:selectItem itemLabel="Panel" itemValue="3" />
								<f:selectItem itemLabel="Restricted Tender" itemValue="4" />
								<p:ajax event="change" update="parentText" />


							</p:selectOneMenu>

						</p:panelGrid>
						<p:inputText value="#{qTDetailBB.managedBean.qt.qtType}"></p:inputText>

					</p:panel> <h:panelGroup id="parentText">
						<h:panelGroup
							rendered="#{qTDetailBB.managedBean.qt.qtType == '1' or qTDetailBB.managedBean.qt.qtType == '2'}">
							<ui:include src="/xhtml/ss/quatationtender/nrmqtntender.xhtml" />
						</h:panelGroup>
						<h:panelGroup
							rendered="#{qTDetailBB.managedBean.qt.qtType == '3' }">

							<ui:include src="/xhtml/ss/quatationtender/panelqtntender.xhtml" />
						</h:panelGroup>

						<h:panelGroup
							rendered="#{qTDetailBB.managedBean.qt.qtType eq '4' }">
							<ui:include src="/xhtml/ss/quatationtender/restictedtender.xhtml" />
						</h:panelGroup>

					</h:panelGroup> 
			

</ui:composition>
