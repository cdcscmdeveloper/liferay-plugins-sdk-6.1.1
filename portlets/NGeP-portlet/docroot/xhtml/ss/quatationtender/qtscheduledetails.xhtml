<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
	<title>Include demo</title>
</h:head>
<h:body>
	
	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Schedule" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" columnClasses="columnWidth30,columnWidth80">

			<h:outputLabel value="#{lbl['lbl.so.noticepublish']}" />
			<p:calendar value="#{qTScheduleDetailBB.managedBean.qt.publishDate}"
				id="noticePublish" showOn="button" />
	
	        <h:outputLabel value="Proposal Preparation Start Date/Time " />
	
			 <p:calendar value="#{qTScheduleDetailBB.managedBean.qt.proposalStartDate}"  id="proposalPreparation" showOn="button"/> 
			
			
			<h:outputLabel value="Closing Date and Time"/>
			
			 <p:calendar value="#{qTScheduleDetailBB.managedBean.qt.closingDate}" id="closingDate" showOn="button"/>
			
			<h:outputLabel  value="Publishing Period (Days) " escape="false" />
					
			<p:inputText value="#{qTScheduleDetailBB.managedBean.qt.qtValidityPeriod}"  readonly="true" id="publishingperiod" />
			
			<h:outputLabel value="Expected LOA Issuance Date "/>
			
			<p:calendar value="#{qTScheduleDetailBB.managedBean.qt.expectedLoaDate}"  id="loaDate" showOn="button"/>
			
			<h:outputLabel value="Expected Start Delivery Date "/>
			
			<p:calendar value="#{qTScheduleDetailBB.managedBean.qt.expectedDeliveryDate}"  id="deliveryDate" showOn="button"/>
		
	</h:panelGrid>
	</p:panel>
	
	<p:panel header="Briefing/Site Visit Schedule" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%" columns="2" 
			 columnClasses="columnWidth30,columnWidth70">

		 	<h:outputLabel value="Briefing/Site Visit Required" />
		 <p:selectOneRadio
				value="#{qTScheduleDetailBB.managedBean.qt.bsvRequired}">
				<f:selectItem itemLabel="yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
				<p:ajax update="bsvrequire" listener="#{qTSupplierQulCriteriaBackingBean.processChecked}"/>
			</p:selectOneRadio>
			<h:outputLabel value="Briefing Same As Site Visit" />
			<p:selectOneRadio
				value="#{qTScheduleDetailBB.managedBean.qt.sameBsv}">
				<f:selectItem itemLabel="yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
				<p:ajax update="samebsv" listener="#{qTSupplierQulCriteriaBackingBean.processChecked}"/>

			</p:selectOneRadio>


		</h:panelGrid>
	</p:panel>
    <h:panelGroup id="bsvrequire">
	<h:panelGroup
		rendered="#{qTScheduleDetailBB.managedBean.qt.bsvRequired eq 'true'}" >
		<p:panel header="Briefing Details" toggleable="true">
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

				
					
			<p:dataTable value="#{qTScheduleDetailBB.managedBean.briefings}"
			id="briefdetaillist" var="briefdetails" editable="true" >

					<p:ajax event="rowEdit" listener="#{searchQtnTenderBB.onEdit}" />
					<p:ajax event="rowEditCancel"
						listener="#{searchQtnTenderBB.onCancel}" />

					<p:column headerText="Description">
						<p:commandLink >
								<h:outputText value="#{briefdetails.briefingDesc}"></h:outputText>
								</p:commandLink>
							
					</p:column>
					<p:column headerText="Date/Time">
                   <h:outputText value="#{briefdetails.briefingDate}"></h:outputText>
								</p:column>
								
								<p:column headerText="Location">
					<h:outputText value="#{briefdetails.location}"></h:outputText>
							</p:column>
							
							<p:column headerText="Coordinating Officer">

								<h:outputText value="#{briefdetails.coordinatingOfficer}"></h:outputText>

					</p:column>

					<p:column headerText="Attendance">

								<h:outputText value="#{briefdetails.attendanceType}"></h:outputText>

					</p:column>

					<p:column headerText="Zone">
            <h:outputText value="#{briefdetails.scQtZoneCriteria.zoneName}"></h:outputText>
							
					</p:column>
					<p:column headerText="Briefing Status">
		<h:outputText value="#{briefdetails.pmStatus}"></h:outputText>
							</p:column>
				<p:column headerText="Action" style="width:6%">
						<p:rowEditor />
						</p:column>

				</p:dataTable>

			</p:panelGrid>
				<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
						<div align="right">

							<p:commandButton id="briefadd" value="#{lbl['lbl.so.addbtn']}" process="@this" action="#{qTScheduleDetailBB.addBriefingDetails}" oncomplete="dlg1.show();" update="@(.qtBriefDetails)"></p:commandButton>
						</div>
					</f:facet>
			</p:panelGrid>
		</p:panel>

	</h:panelGroup>
	</h:panelGroup>
	<h:panelGroup id="samebsv">
	<h:panelGroup
		rendered="#{qTScheduleDetailBB.managedBean.qt.sameBsv eq 'false'}" >


		<p:panel header="Site/Visit Details" toggleable="true">
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

			<p:dataTable value="#{qTScheduleDetailBB.managedBean.siteBriefings}"
			id="sitedetails" var="sitedetails" editable="true" styleClass="">
			
			<p:column headerText="Description">
						<p:commandLink >
								<h:outputText value="#{sitedetails.briefingDesc}"></h:outputText>
								</p:commandLink>
							
					</p:column>
					<p:column headerText="Date/Time">
                   <h:outputText value="#{sitedetails.briefingDate}"></h:outputText>
								</p:column>
								
								<p:column headerText="Location">
					<h:outputText value="#{sitedetails.location}"></h:outputText>
							</p:column>
							
							<p:column headerText="Coordinating Officer">

								<h:outputText value="#{sitedetails.coordinatingOfficer}"></h:outputText>

					</p:column>

					<p:column headerText="Attendance">

								<h:outputText value="#{sitedetails.attendanceType}"></h:outputText>

					</p:column>

					<p:column headerText="Zone">
            <h:outputText value="#{sitedetails.scQtZoneCriteria.zoneName}"></h:outputText>
							
					</p:column>
					<p:column headerText="Briefing Status">
		<h:outputText value="#{sitedetails.pmStatus}"></h:outputText>
							</p:column>
				<p:column headerText="Action" style="width:6%">
						<p:rowEditor />
						</p:column>
				</p:dataTable>

				
			</p:panelGrid>
				<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
						<div align="right">

							<p:commandButton id="siteadd" value="#{lbl['lbl.so.addbtn']}" process="@this" action="#{qTScheduleDetailBB.addSiteDetails}" oncomplete="dlg2.show();" update="@(.qtSiteBriefDetails)"></p:commandButton>

						</div>
					</f:facet>
			</p:panelGrid>
		</p:panel>
	</h:panelGroup>
	</h:panelGroup>
	<p:panel header="Contact Person Details" toggleable="true">
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:dataTable id="contactdetails" var="contactpersondetails"
				value="#{qTScheduleDetailBB.managedBean.scQtContactPersons}" editable="true">

				<p:ajax event="rowEdit" listener="#{searchQtnTenderBB.onEdit}" />
				<p:ajax event="rowEditCancel"
					listener="#{searchQtnTenderBB.onCancel}" />

				<p:column headerText="No">
					<!-- <h:outputText value="1"></h:outputText> -->
					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="1"></h:outputText>
						</f:facet>
						<f:facet name="input">
							<p:inputText value="2" />
						</f:facet>
					</p:cellEditor>
				</p:column>

				<p:column headerText="Name">
					<!-- <h:outputText value="Arjun"></h:outputText> -->
					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="#{contactpersondetails.name}"></h:outputText>
						</f:facet>
					</p:cellEditor>	
                </p:column>
				<p:column headerText="Tel No">

					<!--    <h:outputText value="355446727" />   -->
					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="#{contactpersondetails.phoneNo}"></h:outputText>
						</f:facet>
						
					</p:cellEditor>

				</p:column>

				<p:column headerText="Fax No">
					<!-- <h:outputText value="1234555" />  -->

					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="#{contactpersondetails.faxNo}"></h:outputText>
						</f:facet>
						
					</p:cellEditor>
				</p:column>

				<p:column headerText="Email">
					<!-- <h:outputText value="1234555" />  -->

					<p:cellEditor>
						<f:facet name="output">
							<h:outputText value="#{contactpersondetails.email}"></h:outputText>
						</f:facet>
						
					</p:cellEditor>
				</p:column>

				<p:column headerText="Action" style="width:6%">
					<p:rowEditor />
            <!-- <ui:include src="/xhtml/ss/committe/clonecommitteescreen.xhtml" /> -->

				</p:column>
				

			</p:dataTable>
		</p:panelGrid>
			<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
					<div align="right">
						<p:commandButton id="add" value="#{lbl['lbl.so.addbtn']}" />
					
					</div>
				</f:facet>
			</p:panelGrid>
			
	</p:panel>

</h:body>
</html>
