<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<!-- <ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" / -->
	<p:panel header="Deduction Payment" toggleable="true">
		<p:commandLink value="Deduction Payment"></p:commandLink>

		<p:dataTable id="deductpayments" var="dpayment"
			value="#{qTDeductionPaymentBackingBean.managedBean.scQtDeductionList}"
			styleClass="deductiondetails"
			selection="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction}"
			rowKey="#{dpayment}" selectionMode="single">

			<p:ajax event="rowSelect" update=":form:qtsubId:deductclause" />

			<ac:paginator for="deductpayments" />

			<p:column headerText="Deduction Type">
				<h:outputText
					value="#{dpayment.deductionType.pmParameterType.parameterName}"
					rendered="#{dpayment.brandNew eq false}" />
				<p:selectOneMenu
					value="#{qTDeductionPaymentBackingBean.managedBean.deductionPaymentArray}"
					rendered="#{dpayment.brandNew eq true}">
					<f:selectItems
						value="#{qTDeductionPaymentBackingBean.getDropdownCodeValues(ParameterTypeConst.deductionType)}" />
					<p:ajax event="change" update="deductpayments"
						listener="#{qTDeductionPaymentBackingBean.deductionPaymentEvent}"
						partialSubmit="true" process="@this" />
				</p:selectOneMenu>
			</p:column>

			<p:column headerText="Description">
				<h:outputText value="#{dpayment.deductionAmount}"
					rendered="#{dpayment.brandNew eq false}" />
				<p:inputText value="#{dpayment.deductionAmount}"
					rendered="#{dpayment.brandNew eq true}" />
			</p:column>

			<p:column headerText="Percentage"
				rendered="#{qTDeductionPaymentBackingBean.managedBean.percentageField}">
				<h:outputText value="#{dpayment.deductionAmount}"
					rendered="#{dpayment.brandNew eq false}" />
				<p:inputText value="#{dpayment.deductionAmount}"
					rendered="#{dpayment.brandNew eq true}" />
			</p:column>

			<p:column headerText="Amount"
				rendered="#{qTDeductionPaymentBackingBean.managedBean.amountField}">
				<h:outputText value="#{dpayment.deductionAmount}"
					rendered="#{dpayment.brandNew eq false}" />
				<p:inputText value="#{dpayment.deductionAmount}"
					rendered="#{dpayment.brandNew eq true}" />
			</p:column>
		</p:dataTable>
		<!-- </p:panelGrid> -->
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.so.addbtn']}"
						process="@this,deductpayments" partialSubmit="true"
						action="#{qTDeductionPaymentBackingBean.addDedcutionPayment}"
						update="deductpayments" icon="ui-icon-add" />
					<p:commandButton value="#{lbl['lbl.so.delete']}"
						icon="ui-icon-delete" />
				</div>
			</f:facet>
		</p:panelGrid>

		<p:commandLink value="Deduction Clause"></p:commandLink>

		<p:dataTable
			value="#{qTDeductionPaymentBackingBean.managedBean.selectedScQtDeduction.scQtDeductionClauses}"
			id="deductclause" var="dclause" rowKey="#{dclause}"
			rowIndexVar="rowIndex" rows="10">

			<!-- <p:column selectionMode="multiple" style="width:5%" /> -->

			<ac:paginator for="deductclause" />

			<!-- <p:column headerText="Deduction Clause">
					<h:outputLabel value="#{dclause.deductionType}" />
				</p:column> -->

			<p:column headerText="Description">
				<h:outputText value="desc" />
			</p:column>

		</p:dataTable>
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
				<div align="right">
					<p:commandButton value="#{lbl['lbl.so.addbtn']}" icon="ui-icon-add"></p:commandButton>
					<p:commandButton value="#{lbl['lbl.so.delete']}"
						icon="ui-icon-delete" />
				</div>
			</f:facet>
		</p:panelGrid>
	</p:panel>
</ui:composition>
