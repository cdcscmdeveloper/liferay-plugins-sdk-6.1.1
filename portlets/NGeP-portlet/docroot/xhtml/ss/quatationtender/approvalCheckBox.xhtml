<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Approval Workflow" toggleable="true" id="approvalWorkFlow">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">
		<tr>
			<td width="20%"><h:outputLabel value="Approval Category" /></td>
			<td width="80%">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="3"
					styleClass="noBorders tr,noBorders td" columnClasses="columnWidth30">
					<c:forEach var="approvalCategory" items="#{approvalBackingBean.approvalCategories}">
						<p:selectManyCheckbox
							value="#{approvalBackingBean.appCatList}"
							layout="lineDirection" disabled="true">
							<f:selectItem value="#{approvalCategory}" />
						</p:selectManyCheckbox>
					</c:forEach>
				</h:panelGrid>
			</td>
		</tr>
		</table>
	
	<p:tabView var="approvalCategory" dynamic="true" cache="true" orientation="top"
		activeIndex="#{qTDetailBB.managedBean.subTabIndex}"
		value="#{approvalBackingBean.managedBean.tabList}">		

		<p:tab title="#{approvalCategory.titleName}" >
			<ui:fragment rendered="#{approvalCategory.titleName eq 'Division Approval'}">

				<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
				  <ui:include src="/xhtml/ss/quatationtender/approvalDetailsPTJ.xhtml" /> 
			</ui:fragment>
			<ui:fragment rendered="#{approvalCategory.titleName ne 'Division Approval'}">
				<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
				 <ui:include
					src="/xhtml/ss/quatationtender/verificationDetails.xhtml" />
				<ui:include
					src="/xhtml/ss/quatationtender/approvalDetailSection.xhtml" /> 
			</ui:fragment>

		</p:tab>
	</p:tabView>

</p:panel>
</ui:composition>
