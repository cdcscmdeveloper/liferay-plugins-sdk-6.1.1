<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Approval Workflow" toggleable="true">
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column>
					<p:outputLabel value="Approval Category"></p:outputLabel>
				</p:column>
				<p:column>
					<p:selectManyCheckbox
						value="#{searchQtnTenderBB.managedBean.selectedOptions}">

						<f:selectItems
							value="#{searchQtnTenderBB.managedBean.checkBoxList}"></f:selectItems>
						<p:ajax event="change" update="tabView12345"
							listener="#{searchQtnTenderBB.addMessage}" />
					</p:selectManyCheckbox>
				</p:column>
			</p:row>


		</p:panelGrid>
	</p:panel>
	<p:tabView id="tabView12345" var="player" dynamic="true" cache="true"
		value="#{searchQtnTenderBB.managedBean.tabBean}">
		<p:tab title="#{player.titleName}">
			<ui:fragment rendered="#{player.titleName eq 'PTJApproval'}">
				
				<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
				<ui:include src="/xhtml/ss/quatationtender/approvalDetailsPTJ.xhtml" />
			</ui:fragment>
			<ui:fragment rendered="#{player.titleName ne 'PTJApproval'}">
				<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
				<ui:include
					src="/xhtml/ss/quatationtender/verificationDetails.xhtml" />
				<ui:include
					src="/xhtml/ss/quatationtender/approvalDetailSection.xhtml" />
			</ui:fragment>
			<!-- <c:choose>
				<c:when test="${player.titleName =='PTJApproval'}">
					<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
					<ui:include
						src="/xhtml/ss/quatationtender/approvalDetailsPTJ.xhtml" />
				</c:when>

				<c:otherwise>
					<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
					<ui:include
						src="/xhtml/ss/quatationtender/verificationDetails.xhtml" />
					<ui:include
						src="/xhtml/ss/quatationtender/approvalDetailSection.xhtml" />
				</c:otherwise>
			</c:choose> -->
		</p:tab>
	</p:tabView>


</ui:composition>
