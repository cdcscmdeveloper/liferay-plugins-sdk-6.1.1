												</p:selectManyCheckbox></td>

									</Table>
								</td>
							</tr>

	<p:tabView var="player" dynamic="true" cache="true"
		activeIndex="#{approvalBackingBean.activTab}" orientation="top"
		value="#{approvalBackingBean.managedBean.tabList}">
		<p:ajax event="tabChange" process="@all"
			listener="#{approvalBackingBean.newTabSelected}" />

		<p:tab title="#{player.titleName}">
			<ui:fragment rendered="#{player.titleName eq 'Division Approval'}">

				<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
				  <ui:include src="/xhtml/ss/quatationtender/approvalDetailsPTJ.xhtml" /> 
			</ui:fragment>
			<ui:fragment rendered="#{player.titleName ne 'Division Approval'}">
				<ui:include src="/xhtml/ss/quatationtender/requestDetails.xhtml" />
				 <ui:include
					src="/xhtml/ss/quatationtender/verificationDetails.xhtml" />
