<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="Briefing/Site Visit Attendence Register" toggleable="true">
<p:panelGrid  styleClass="noBorders tr,noBorders td">
	 <p:row >  
   <p:column >
    <p:outputLabel value="Brefing As Same Values"></p:outputLabel>
    </p:column>
          <p:column>
           <p:selectOneRadio id="attendenceRadio" value="searchQtnTenderBB.managedBean.qtnTenders.planNumber">  
            <f:selectItem itemLabel="Yes" itemValue="1" />  
            <f:selectItem itemLabel="No" itemValue="2" />  
             
        </p:selectOneRadio>
          </p:column>
          </p:row>
</p:panelGrid>

</p:panel>


<p:panel header="BriefingDetails" toggleable="true">
<p:dataTable  id="attendancebrief" var="attendancetenderbrief" value="#{searchQtnTenderBB.managedBean.qtnTenders}"  rows="10"  >
				
				<p:column headerText="checkBox" >
				 <h:selectBooleanCheckbox value="1" style="width:200px" /> 
				</p:column>
					<p:column headerText="No">
						<h:outputText value="1"></h:outputText>
				</p:column>
				   <p:column headerText="Description">              
                <p:commandLink value="Register" action="attendenceRegistrationList.xhtml?faces-redirect=true">
                  <h:outputText value="Register" />  
                 </p:commandLink> 
        </p:column>
           <p:column headerText="Date">              
                <h:outputText value="04/09/2013 04:44" />  
        </p:column>
           <p:column headerText="Location">              
                <h:outputText value="Malaysia" />  
        </p:column>
          <p:column headerText="Coordinating officer">              
                <h:outputText value="DeskOfficer" />  
        </p:column>
          <p:column headerText="Attendence">              
                <h:outputText value="Present" />  
        </p:column>
          <p:column headerText="ZoneName">              
                <h:outputText value="EastMalaysia" />  
        </p:column>
         <p:column headerText="BriefingStatus">              
                    <p:selectOneMenu value="searchQtnTenderBB.managedBean.qtnTenders.planNumber" > 
	<f:selectItem itemLabel="siteVisit" itemValue="1" />   
	<f:selectItem itemLabel="siteMaintain" itemValue="2" />
	</p:selectOneMenu> 
        </p:column>
			</p:dataTable>


</p:panel>

<p:panel header="SiteDetails" toggleable="true">
<p:dataTable  id="attendencesite" var="attendancetender" value="#{searchQtnTenderBB.managedBean.qtnTenders}"  rows="10"  >
                
				
				<p:column headerText="checkBox" >
				 <h:selectBooleanCheckbox value="1" style="width:200px" /> 
				</p:column>
					<p:column headerText="No">
						<h:outputText value="1"></h:outputText>
				</p:column>
				   <p:column headerText="Description">
				     <p:commandLink value="Register" action="attendenceRegistrationList.xhtml?faces-redirect=true">
                  <h:outputText value="Register" />  
                 </p:commandLink>
        </p:column>
           <p:column headerText="Date">              
                <h:outputText value="04/09/2013 04:44" />  
        </p:column>
           <p:column headerText="Location">              
                <h:outputText value="Malaysia" />  
        </p:column>
          <p:column headerText="Coordinating officer">              
                <h:outputText value="DeskOfficer" />  
        </p:column>
          <p:column headerText="Attendence">              
                <h:outputText value="Present" />  
        </p:column>
          <p:column headerText="ZoneName">              
                <h:outputText value="EastMalaysia" />  
        </p:column>
         <p:column headerText="SiteStatus">              
               <p:selectOneMenu value="searchQtnTenderBB.managedBean.qtnTenders.planNumber" > 
	<f:selectItem itemLabel="siteVisit" itemValue="1" />   
	<f:selectItem itemLabel="siteMaintain" itemValue="2" />
	</p:selectOneMenu>
        </p:column>
        
          <f:facet name="footer">
         <div align="right"  >
					<p:commandButton id="addAttendance" value="#{lbl['lbl.so.attendence']}" />
					</div>
			</f:facet>
			</p:dataTable>


</p:panel>
	</ui:composition>
