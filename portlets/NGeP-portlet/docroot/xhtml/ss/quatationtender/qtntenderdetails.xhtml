<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Qtn/Tender Details" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			
			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.qttentype']}" />
			</h:column>
			<h:column>
			 <c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
				<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.qtType}">
					<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.quotationTenderType)}" />
				<p:ajax event="change" partialSubmit="true" process="@this" update="approvalWorkFlow" listener="#{qTDetailBB.onChangeAction}"/>
			
				</p:selectOneMenu>
				</c:if>
				<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
            		<p:inputText 
            			value="#{qTDetailBB.managedBean.qt.qtType}"
            			disabled="true"/>
            			</c:if>
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.itemorg']}"  />
			</h:column>
			<h:column>
			    <c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
				<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.itemOrigin}" style="margin-bottom:5px;">
					<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.itemOrigin)}" />
				<p:ajax event="change" partialSubmit="true" process="@this" update="approvalWorkFlow" listener="#{qTDetailBB.onChangeAction}"/>
			
				</p:selectOneMenu>
				</c:if>
				<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
            		<p:inputText 
            			value="#{qTDetailBB.managedBean.qt.itemOrigin}" 
            			disabled="true"/>
            			</c:if>
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.itemtype']}"  />
			</h:column>
			<h:column>
			     <c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
				<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.itemType}">
					<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.scItemType)}" />
				<p:ajax event="change" partialSubmit="true" process="@this" update="approvalWorkFlow" listener="#{qTDetailBB.onChangeAction}"/>
			
				</p:selectOneMenu>
				</c:if>
				 <c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
            		<p:inputText 
            			value="#{qTDetailBB.managedBean.qt.itemType}" 
            			disabled="true"/>
            	</c:if>
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.asqttype']}" />
			</h:column>
			<h:column>
				<p:inputText id="AsnTenderNo"
					value="#{qTDetailBB.managedBean.qt.qtNo}" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.mto']}" />
			</h:column>
			<h:column>
				<p:inputText id="MTO" value="#{qTDetailBB.managedBean.qt.mto ? 'Yes' : 'No'}"
					disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.rfp']}" />
			</h:column>
			<h:column>
				<p:selectOneRadio id="rfpType" value="#{qTDetailBB.managedBean.qt.rfp}" disabled="#{!qTDetailBB.managedBean.editable}">
					<f:selectItem itemLabel="Yes" itemValue="true" />
					<f:selectItem itemLabel="No" itemValue="false" />
				</p:selectOneRadio>
			</h:column>
			<h:column>
				<h:outputLabel 
					value="* #{lbl['lbl.so.provaldate']}" />
			</h:column>
			<h:column>
				<p:inputText id="validityperiod"
					value="#{qTDetailBB.managedBean.qt.qtValidityPeriod}" disabled="#{!qTDetailBB.managedBean.editable}"/>
			</h:column>
			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.resrules']}"  />
			</h:column>
			<h:column>
			   <c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
				<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.responseRule}" style="width:220px;">
					<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.responseRulesByItem)}" />
				</p:selectOneMenu>
			    </c:if>
			     <c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
            		<p:inputText 
            			value="#{qTDetailBB.managedBean.qt.responseRule}" 
            			disabled="true"/>
            	</c:if>
			</h:column>
			
		</h:panelGrid>
	</p:panel>
</ui:composition>
