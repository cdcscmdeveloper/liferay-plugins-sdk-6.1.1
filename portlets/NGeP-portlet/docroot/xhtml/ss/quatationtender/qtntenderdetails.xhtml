<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Qtn/Tender Details" toggleable="true">
		<p:panelGrid rows="5" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<p:column>
				<h:outputText value="* Qtn/Tender Type" />
			</p:column>
			<p:column>
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.qt.qtType}">
					<f:selectItem itemLabel="Select One" itemValue="null" />
					<f:selectItem itemLabel="Open" itemValue="1" />
					<f:selectItem itemLabel="Bumiputra" itemValue="2" />
					<f:selectItem itemLabel="Panel" itemValue="3" />
					<f:selectItem itemLabel="Restricted Tender" itemValue="4" />
					<f:validateRequired />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<h:outputText value="* Type of Goods/Services" />
			</p:column>
			<p:column>
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.qt.itemOrigin}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Local" itemValue="1" />
					<f:selectItem itemLabel="Imported" itemValue="2" />
					<f:selectItem itemLabel="Local And Imported" itemValue="3" />

				</p:selectOneMenu>
			</p:column>
			<p:column>
				<h:outputText value="MTO" />
			</p:column>
			<p:column>
				<p:inputText id="MTO" value="Yes/No" readonly="true" />
			</p:column>
			<p:column>
				<h:outputText value="Associated Qtn/Tender No." />
			</p:column>
			<p:column>
				<p:inputText id="AsnTenderNo" value="QT12345" readonly="true" />
			</p:column>

			<p:column>
				<h:outputText value="Fulfillment Type" />
			</p:column>
			<p:column>
				<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.itemOrigin}"
					required="true">
					<f:selectItem itemLabel="Select One" itemValue="null" />
					<f:selectItem itemLabel="One-Off" itemValue="1" />
					<f:selectItem itemLabel="Periodic (Schedule)" itemValue="2" />
					<f:selectItem itemLabel="Periodic (As When)" itemValue="3" />
				</p:selectOneMenu>
			</p:column>
			<p:column>
				<h:outputText value="* RFP" />
			</p:column>
			<p:column>
				<p:selectOneRadio id="rfpType"
					value="#{qTDetailBB.managedBean.qt.isRfp}">
					<f:selectItem itemLabel="Yes" itemValue="1" />
					<f:selectItem itemLabel="No" itemValue="2" />

				</p:selectOneRadio>
			</p:column>
		</p:panelGrid>
		
		<p:panelGrid columns="4" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:column>
				<h:outputText for="validityperiod"
					value="* Proposal Validity Period (days)" />
			</p:column>
			<p:column>
				<p:inputText id="validityperiod"
					value="#{qTDetailBB.managedBean.qt.qtValidityPeriod}" />
			</p:column>
			<p:column>

				<h:outputText value="* Response Rules for Line Item / Zone" />
			</p:column>
			<p:column>
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.qt.responseRule}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="All Line Item / All Zone" itemValue="1" />
					<f:selectItem itemLabel="All Line Item / Certain Zone"
						itemValue="2" />
					<f:selectItem itemLabel="Certain Line Item / All Zone"
						itemValue="3" />
					<f:selectItem itemLabel="Certain Line Item / Certain Zone"
						itemValue="4" />

				</p:selectOneMenu>
			</p:column>

		</p:panelGrid>

	</p:panel>
</ui:composition>
