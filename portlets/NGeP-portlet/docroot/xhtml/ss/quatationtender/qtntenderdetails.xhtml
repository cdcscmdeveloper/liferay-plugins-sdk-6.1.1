<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Qtn/Tender Details" toggleable="true">
		<p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">

			<h:outputText value="* Qtn/Tender Type" />

			<p:selectOneMenu
				value="#{searchQtnTenderBB.managedBean.tenderSelction}">
				<f:selectItem itemLabel="Select One" itemValue="null" />
				<f:selectItem itemLabel="Open" itemValue="1" />
				<f:selectItem itemLabel="Bumiputra" itemValue="2" />
				<f:selectItem itemLabel="Panel" itemValue="3" />
				<f:selectItem itemLabel="Restricted Tender" itemValue="4" />
				<f:validateRequired />
			</p:selectOneMenu>

			<h:outputText value="* Type of Goods/Services" />
			<p:selectOneMenu
				value="#{searchQtnTenderBB.managedBean.tenderSelction}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Local" itemValue="1" />
				<f:selectItem itemLabel="Imported" itemValue="2" />
				<f:selectItem itemLabel="Local And Imported" itemValue="3" />

			</p:selectOneMenu>

			<h:outputLabel for="MTO" value="MTO" />
			<p:inputText id="MTO" value="Yes/No" readonly="true" />

			<h:outputLabel for="AsnTenderNo" value="Associated Qtn/Tender No." />
			<p:inputText id="AsnTenderNo" value="QT12345" readonly="true" />



			<h:outputText value="Fulfillment Type" />
			<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
				required="true">
				<f:selectItem itemLabel="Select One" itemValue="null" />
				<f:selectItem itemLabel="One-Off" itemValue="1" />
				<f:selectItem itemLabel="Periodic (Schedule)" itemValue="2" />
				<f:selectItem itemLabel="Periodic (As When)" itemValue="3" />
			</p:selectOneMenu>

			<h:outputText value="* RFP" />

			<p:selectOneRadio id="rfpType"
				value="#{searchQtnTenderBB.managedBean.qtno}">
				<f:selectItem itemLabel="Yes" itemValue="1" />
				<f:selectItem itemLabel="No" itemValue="2" />

			</p:selectOneRadio>
</p:panelGrid>
<p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">
<h:panelGroup>
  
  <h:outputLabel for="contractperiod"
				value="* Contract Period" />
			<p:inputText id="contractperiod"
				value="#{searchQtnTenderBB.managedBean.qtno}" />
				<h:outputText value="(Year)" />
				<p:inputText id="contractperiod"
				value="#{searchQtnTenderBB.managedBean.qtno}" />
				<h:outputText value="(Month)" />
</h:panelGroup>

<h:panelGroup>
  
  <h:outputLabel for="completionperiod"
				value="* Completion Period" />
			<p:inputText id="completionperiod"
				value="#{searchQtnTenderBB.managedBean.qtno}" />
				<h:outputText value="(Year)" />
				<p:inputText id="completionperiod"
				value="#{searchQtnTenderBB.managedBean.qtno}" />
				<h:outputText value="(Month)" />
</h:panelGroup>

</p:panelGrid>


<p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">
			<h:outputLabel for="validityperiod"
				value="* Proposal Validity Period (days)" />
			<p:inputText id="validityperiod"
				value="#{searchQtnTenderBB.managedBean.qtno}" />


			<h:outputText value="* Response Rules for Line Item / Zone" />
			<p:selectOneMenu
				value="#{searchQtnTenderBB.managedBean.tenderSelction}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="All Line Item / All Zone" itemValue="1" />
				<f:selectItem itemLabel="All Line Item / Certain Zone" itemValue="2" />
				<f:selectItem itemLabel="Certain Line Item / All Zone" itemValue="3" />
				<f:selectItem itemLabel="Certain Line Item / Certain Zone"
					itemValue="4" />

			</p:selectOneMenu>


		</p:panelGrid>

	</p:panel>
</ui:composition>
