<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Qtn/Tender Details" toggleable="true">
		<p:panelGrid rows="5" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column>
					<h:outputText value="* Qtn/Tender Type" />
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.qtType}">

						<f:selectItems value="#{qTDetailBB.managedBean.tenderTypeList}" />
					</p:selectOneMenu>
				</p:column>
				<p:column>
					<h:outputText value="Item Origin" />
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.itemOrigin}">
						<f:selectItems value="#{qTDetailBB.managedBean.itemOriginList}" />

					</p:selectOneMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<h:outputText value="Item Type" />
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.itemType}">
						<f:selectItems value="#{qTDetailBB.managedBean.itemTypeList}" />

					</p:selectOneMenu>
				</p:column>
				<p:column>
					<h:outputText value="Associated Qtn/Tender No." />
				</p:column>
				<p:column>
					<p:inputText id="AsnTenderNo"
						value="#{qTDetailBB.managedBean.qt.qtNo}" readonly="true" />
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<h:outputText value="MTO" />
				</p:column>
				<p:column>
					<p:inputText id="MTO" value="#{qTDetailBB.managedBean.qt.isMto}"
						readonly="true" />
				</p:column>
				<p:column>
					<h:outputText value="* RFP" />
				</p:column>
				<p:column>
					<p:selectOneRadio id="rfpType"
						value="#{qTDetailBB.managedBean.qt.isRfp}">
						<f:selectItem itemLabel="Yes" itemValue="1" />
						<f:selectItem itemLabel="No" itemValue="2" />

					</p:selectOneRadio>
				</p:column>

			</p:row>
			<p:row>
				<p:column>
					<h:outputText for="validityperiod"
						value="* Proposal Validity Period (days)" />
				</p:column>
				<p:column>
					<p:inputText id="validityperiod"
						value="#{qTDetailBB.managedBean.qt.qtValidityPeriod}" />
				</p:column>
				<p:column>
					<h:outputText value="* Response Rules for Line Item / Zone" />
				</p:column>
				<p:column>
					<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.responseRule}">
						<f:selectItems value="#{qTDetailBB.managedBean.lineItemList}" />


					</p:selectOneMenu>
				</p:column>

			</p:row>

		</p:panelGrid>

	</p:panel>
</ui:composition>
