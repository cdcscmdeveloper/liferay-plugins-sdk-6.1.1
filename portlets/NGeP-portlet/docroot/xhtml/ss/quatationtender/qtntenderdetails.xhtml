<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
<p:panel header="Qtn/Tender Details" toggleable="true">
	<p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">
	<h:outputText value="Fulfillment Type * " />  
       <p:selectOneRadio id="option1" value="">  
            <f:selectItem itemLabel="Yes" itemValue="1" />  
            <f:selectItem itemLabel="No" itemValue="2" />  
             
        </p:selectOneRadio>  
        
        
        
        <h:outputText value="Contract Period *"></h:outputText>
       
        <h:panelGroup>
        <p:inputText value="" size="4"></p:inputText>
        <p:inputText value="" size="2"></p:inputText>
        </h:panelGroup> 
        
        <h:outputText value="Completion Period *"></h:outputText>
       
        <h:panelGroup>
        <p:inputText value="" size="4"></p:inputText>
        <p:inputText value="" size="2"></p:inputText>
        </h:panelGroup> 
       
        <h:outputText value="MTO " />  
          
        <p:selectOneRadio id="option1" value="">  
            <f:selectItem itemLabel="Yes" itemValue="1" />  
            <f:selectItem itemLabel="No" itemValue="2" />  
             
        </p:selectOneRadio>  
        
         <h:outputText value="RFP *" />  
          
        <p:selectOneRadio id="option" value="">  
            <f:selectItem itemLabel="Yes" itemValue="1" />  
            <f:selectItem itemLabel="No" itemValue="2" />  
             
        </p:selectOneRadio>  
  
   <h:outputText value="Qtn/Tender Type*" />  
        <p:selectOneMenu value="" >  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Open" itemValue="1" />  
            <f:selectItem itemLabel="Bumiputra" itemValue="2" />  
            <f:selectItem itemLabel="Panel" itemValue="3" />  
            <f:selectItem itemLabel="Restricted Tender" itemValue="3" />
        </p:selectOneMenu>  
        
   <h:outputText value="Type of Goods/Services *" />  
        <p:selectOneMenu value="" >  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Local" itemValue="1" />  
            <f:selectItem itemLabel="Imported" itemValue="2" />  
            <f:selectItem itemLabel="Local And Imported" itemValue="3" />  
            
        </p:selectOneMenu>
        
        <h:outputLabel for="validityperiod" value="Proposal Validity Period (days) *" />  
            <p:inputText id="validityperiod" value="" /> 
        
        
        <h:outputText value="Response Rules for Line Item / Zone *" />  
        <p:selectOneMenu value="" >  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="All Line Item / All Zone" itemValue="1" />  
            <f:selectItem itemLabel="All Line Item / Certain Zone" itemValue="2" />  
            <f:selectItem itemLabel="Certain Line Item / All Zone" itemValue="3" />             
            <f:selectItem itemLabel="Certain Line Item / Certain Zone" itemValue="4" /> 
            
        </p:selectOneMenu>  
    
  		  
	</p:panelGrid>
		
	</p:panel>
	</ui:composition>
