<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="Qtn/Tender Title" toggleable="true">
<p:panelGrid  style="width:100%;" styleClass="noBorders tr,noBorders td">

        <p:row>
        <p:column>
        <h:outputText value="* Title" />
        </p:column>
        <p:column>
        <p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" />  
        </p:column>
        </p:row>
        <p:row>
        <p:column>
        <h:outputText value=" * File No." />
        </p:column>
       
<p:column>
            <p:inputText id="fileno" value="#{qTDetailBB.managedBean.qt.fileNo}" /> 
           </p:column> 
            </p:row>
            <p:row>
           <p:column>
            <h:outputText value="Plan No." />  
            </p:column>
            <p:column>
            <p:inputText id="planno" value="#{qTDetailBB.managedBean.qt.planId}"/>  
            </p:column>
            <p:column>
           <h:outputText value="* Estimated Price/Planned Amount" />
            </p:column>  
            <p:column>
            <p:inputText id="estprice" value="#{qTDetailBB.managedBean.qt.qtAmount}"/>  
            </p:column>
            </p:row>
            <p:row>  
         
           <p:column>
          <h:outputText value="* ProcurementMode" />  
          </p:column>
          <p:column>
        <p:selectOneMenu  value="#{qTDetailBB.managedBean.qt.procurementMode}" >  
             <f:selectItems value="#{qTDetailBB.managedBean.procurementModeItems}" />
        </p:selectOneMenu>  
        </p:column>
        <p:column>
         <h:outputText  value="* Financial Year" /> 
         </p:column>
         <p:column> 
        <p:selectOneRadio id="optionradio" value="#{qTDetailBB.managedBean.qt.financialYear}">  
            <f:selectItem itemLabel="Current Year" itemValue="1" />  
            <f:selectItem itemLabel="Next Year" itemValue="2" />  
             
        </p:selectOneRadio>  
        
  </p:column>
  </p:row>
  
</p:panelGrid>

	</p:panel>
	<p:panel header="GOSODO List" toggleable="true">
	<p:panelGrid columns="3" style="width:100%;" styleClass="noBorders tr,noBorders td">
	<p:dataTable id="gosodoList" value="#{qTDetailBB.managedBean.qt.scQtGosodoBudgets}" var="gosodo" editable="true">
	
	<p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" /> 
	<p:column headerText="GOSODO">  
                     
             <p:cellEditor>
            <f:facet name="output">  
                  <h:outputText value="#{gosodo.pmGo.goCode}" />
                </f:facet>  
                <f:facet name="input">  
                    <p:selectOneMenu value="#{gosodo.pmGo}" valueChangeListener="#{qTDetailBB.handleGoChange()}">  
           <f:selectItem itemLabel="Select One" itemValue="#{null}"/>
                            <f:selectItems value="#{qTDetailBB.managedBean.goList}" var="go" 
                                       itemLabel="#{go.goCode}" itemValue="#{go}" />

<p:ajax event="change" update="solist"/>
        </p:selectOneMenu> 
                </f:facet> 
                <f:facet name="output">  
                  <h:outputText value="#{gosodo.pmSo.soCode}" />
                </f:facet>  
                <f:facet name="input">  
                    <p:selectOneMenu id="solist"  value="#{gosodo.pmSo}" valueChangeListener="#{qTDetailBB.handleSoChange()}" >  
           <f:selectItem itemLabel="Select One" itemValue="#{null}"/>
                            <f:selectItems value="#{qTDetailBB.managedBean.soList}" var="so" 
                                       itemLabel="#{so.soCode}" itemValue="#{so}" />
<p:ajax event="change" update="dolist"/>
        </p:selectOneMenu> 
                </f:facet>
                <f:facet name="output">  
                  <h:outputText value="#{gosodo.pmDo.doCode}" />
                </f:facet>  
                <f:facet name="input">  
                     <p:selectOneMenu id="dolist" value="#{gosodo.pmDo}" >  
           <f:selectItem itemLabel="Select One" itemValue="#{null}"/>
                            <f:selectItems value="#{qTDetailBB.managedBean.doList}" var="do" 
                                       itemLabel="#{do.doCode}" itemValue="#{do}" />

        </p:selectOneMenu> 
                </f:facet>     
            </p:cellEditor>   
        </p:column>  
  
  <p:column headerText="Budget Availability"> 
  <p:cellEditor>  
                <f:facet name="output">  
                   <h:outputText value="#{gosodo.isBudgetAvailable}" /> 
                </f:facet>  
                <f:facet name="input">  
                    
              <p:selectBooleanCheckbox value="#{gosodo.isBudgetAvailable}">  
            <f:selectItem itemLabel="yes" itemValue="yes"/>  
            <f:selectItem itemLabel="no" itemValue="no"/>  
           
        </p:selectBooleanCheckbox>  
                </f:facet>  
            </p:cellEditor> 
			 
             
        </p:column>  
  
   <p:column headerText="Action ">  
            <p:commandLink  style="margin-right:20px;" ajax="false">  
        <h:outputText value="CheckAvailability" />  
    </p:commandLink>    
        </p:column>  
        
         <p:column style="width:6%">  
            <p:rowEditor />  
        </p:column>
   
	
	</p:dataTable>
	</p:panelGrid>
	
	    <p:commandButton value="ADD" style="float:right;"
                                actionListener="#{qTDetailBB.addNewGoSoDoItem}"
                                update="gosodoList">
                               
                            </p:commandButton>
	       <br/>
  <br/>
	</p:panel>
	
</ui:composition>
