<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

		<p:panel header="Qtn/Tender Title" toggleable="true">
<p:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">

 <h:outputText value="Title *" />
<p:inputTextarea rows="1" cols="50" maxlength="10"       
     autoResize="false"/>  

<h:outputLabel for="fileno" value="File No. *" />  
            <p:inputText id="fileno" value="" /> 
            
            <h:outputLabel for="planno" value="Plan No." />  
            <p:inputText id="planno" value=""/>  
            
            <h:outputLabel for="estprice" value="Estimated Price / Planned Amount *" />  
            <p:inputText id="estprice" value=""/>  
            
             <h:outputLabel for="deptcode1" value="Department Code/Name" />  
            <p:inputText id="deptcode1" value=""/>  
           
           
              <h:outputText value="#{lbl['lbl.so.procmode']}" />  
        <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectOption}" >  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Quotation" itemValue="1" />  
            <f:selectItem itemLabel="Tender" itemValue="2" />  
            <f:selectItem itemLabel="Direct Negotiation" itemValue="3" />  
        </p:selectOneMenu>  
        
         <h:outputText value="Financial Year * " />  
        <p:selectOneRadio id="optionradio" value="#{searchQtnTenderBB.managedBean.qtno}">  
            <f:selectItem itemLabel="Current Year" itemValue="1" />  
            <f:selectItem itemLabel="Next Year" itemValue="2" />  
             
        </p:selectOneRadio>  
  
  
  
</p:panelGrid>
	</p:panel>
	<p:panel header="GOSODO List" toggleable="true">
	<p:panelGrid columns="3" style="width:100%;">
	<p:dataTable value="#{searchQtnTenderBB.managedBean.goSodo}" var="gosodo" editable="true">
	
	<p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" /> 
	<p:column headerText="GOSODO">  
           
            
             <p:cellEditor>
            <f:facet name="output">  
                  <h:outputText value="#{gosodo.type}" />
                </f:facet>  
                <f:facet name="input">  
                    <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" >  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="gosodo1" itemValue="1" />  
            <f:selectItem itemLabel="gosodo2" itemValue="2" />  
            <f:selectItem itemLabel="gosodo3" itemValue="3" />  
        </p:selectOneMenu> 
                </f:facet>  
            </p:cellEditor>   
        </p:column>  
  
  <p:column headerText="Budget Availability"> 
  <p:cellEditor>  
                <f:facet name="output">  
                   <h:outputText value="#{gosodo.bdgAvail}" /> 
                </f:facet>  
                <f:facet name="input">  
                    
              <p:selectManyCheckbox value="#{searchQtnTenderBB.managedBean.selectOptions}">  
            <f:selectItem itemLabel="yes"/>  
            <f:selectItem itemLabel="no" />  
           
        </p:selectManyCheckbox>  
                </f:facet>  
            </p:cellEditor> 
			 
             
        </p:column>  
  
   <p:column headerText="Action ">  
            <p:commandLink  style="margin-right:20px;" ajax="false">  
        <h:outputText value="CheckAvailability" />  
    </p:commandLink>    
        </p:column>  
        
         <p:column style="width:6%">  
            <p:rowEditor />  
        </p:column>
   
	
	</p:dataTable>
	</p:panelGrid>
	      <p:button value="Add" style="float:right;"></p:button>
  <br/>
  <br/>
	</p:panel>
	
</ui:composition>
