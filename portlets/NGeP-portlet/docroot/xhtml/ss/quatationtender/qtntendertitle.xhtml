<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="Qtn/Tender Title" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">

			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.title']}" />
			</h:column>
			<h:column>
				<p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" size="103" />
			</h:column>
		</h:panelGrid>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">

			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.fileno']}"/>
			</h:column>
			<h:column>
				<p:inputText id="fileno" value="#{qTDetailBB.managedBean.qt.fileNo}" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="#{lbl['lbl.so.planno']}" 
					rendered="#{qTDetailBB.managedBean.qt.planned}" />
			</h:column>
			<h:column>
				<p:inputText id="planno" 
					value="#{qTDetailBB.managedBean.qt.ppPlan.planId}"
					rendered="#{qTDetailBB.managedBean.qt.planned}" />
			</h:column>
			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.planamount']}" 
					rendered="#{qTDetailBB.managedBean.qt.planned}" />
				<h:outputLabel value="* #{lbl['lbl.so.estimated']}"
					rendered="#{!qTDetailBB.managedBean.qt.planned}" />
			</h:column>
			<h:column>
				<p:inputText id="estprice"
					value="#{qTDetailBB.managedBean.qt.qtAmount}" />
			</h:column>
			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.procmode']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.qt.procurementMode}" >
					<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
				<p:ajax event="change" partialSubmit="true" process="@this" update="approvalWorkFlow" listener="#{qTDetailBB.onChangeAction}"/>
				</p:selectOneMenu>
			</h:column>
			<h:column>
				<h:outputLabel value="* #{lbl['lbl.so.financialyr']}" />
			</h:column>
			<h:column>
				<p:selectOneRadio id="optionradio"
					value="#{qTDetailBB.managedBean.qt.financialYear}">
					<f:selectItem itemLabel="Current Year" itemValue="1" />
					<f:selectItem itemLabel="Next Year" itemValue="2" />
				</p:selectOneRadio>
			</h:column>
		</h:panelGrid>
	</p:panel>

	<p:panel header="GOSODO List" toggleable="true"
		rendered="#{!qTDetailBB.managedBean.qt.planned}">
		<p:dataTable id="gosodoList"
			value="#{qTDetailBB.managedBean.qt.scQtGosodoBudgets}" var="gosodo"
			selection="#{qTDetailBB.managedBean.selectedGosodoBudgets}"
				rowKey="#{gosodo}" rowIndexVar="rowIndex"
				rows="10">
				<p:column selectionMode="multiple" style="width:2%" />
				<ac:paginator for="gosodoList" />
			
			<p:column headerText="GO Code">
				<h:outputText value="#{gosodo.pmGo.goCode}"
					rendered="#{rowIndex lt qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}" />
				<p:selectOneMenu value="#{gosodo.pmGo.goId}"
					rendered="#{rowIndex eq qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItems value="#{qTDetailBB.managedBean.goList}" var="go"
						itemLabel="#{go.goCode}" itemValue="#{go.goId}" />
					<p:ajax event="change"
						listener="#{qTDetailBB.handleGoChanged(gosodo)}"
					partialSubmit="true" process="@this" update="solist, dolist" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="SO Code">
				<h:outputText value="#{gosodo.pmSo.soCode}"
					rendered="#{rowIndex lt qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}" />
				<p:selectOneMenu id="solist" value="#{gosodo.pmSo.soId}"
					rendered="#{rowIndex eq qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItems value="#{qTDetailBB.managedBean.soList}" var="so"
						itemLabel="#{so.soCode}" itemValue="#{so.soId}" />
					<p:ajax event="change"
					listener="#{qTDetailBB.handleSoChanged(gosodo)}"
						partialSubmit="true" process="@this" update="dolist" />
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="DO Code">
				<h:outputText value="#{gosodo.pmDo.doCode}"
					rendered="#{rowIndex lt qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}" />
				<p:selectOneMenu id="dolist" value="#{gosodo.pmDo.doId}"
					rendered="#{rowIndex eq qTDetailBB.managedBean.qt.scQtGosodoBudgets.size()-1}">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItems value="#{qTDetailBB.managedBean.doList}" var="do"
						itemLabel="#{do.doCode}" itemValue="#{do.doId}" />
						<p:ajax event="change"
					listener="#{qTDetailBB.handleDoChange(gosodo)}"
						partialSubmit="true" process="@this" />
						
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="Budget Availability"> 
       		#{empty gosodo.budgetAvailable ? (gosodo.budgetAvailable ? 'Yes' : 'No') : ''}
       	</p:column>
		<!-- 	<p:column headerText="Action ">
				<p:commandLink style="margin-right:20px;" ajax="false">
					<h:outputText value="CheckAvailability" />
				</p:commandLink>
			</p:column>  -->
		</p:dataTable>
        <p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
						<div align="right">
		
        <p:commandButton value="#{lbl['lbl.so.delete']}" icon="ui-icon-delete"/>
        <p:commandButton value="#{lbl['lbl.so.addbtn']}" 
			actionListener="#{qTDetailBB.addGoSoDoAction}" update="gosodoList" icon="ui-icon-add">
		</p:commandButton>
		<br />
		<br />
		</div>
		</f:facet>
		</p:panelGrid>
	</p:panel>
</ui:composition>
