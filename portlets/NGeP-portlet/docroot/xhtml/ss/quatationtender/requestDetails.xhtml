<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel>
		<table style="width: 100%">
			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'BPK Approval'}">


				<tr>
					<td style="width: 138px;">
						<!-- <h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
 --> <p:outputLabel value="Type Of Approval Request"></p:outputLabel>
					</td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="RestrictedTender" itemValue="Restricted" />
							<f:selectItem itemLabel="DirectNegotiations" itemValue="Direct" />
							<f:selectItem itemLabel="Qtn/Tender Type Approval"
								itemValue="TendertypeApproval" />
							<f:selectItem itemLabel="ReducePublishingPeriod"
								itemValue="PublishingPeriod" />
							<f:selectItem itemLabel="ReduceProposalValidityPeriod"
								itemValue="ProposalValidity" />
						</p:selectManyCheckbox></td>
				</tr>

				<!-- </h:panelGrid> -->

			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'Procurement Board'}">


				<!-- <h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
 -->
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="Type Of Approval Request"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="CancellationQtn/Tender"
								itemValue="Publication" />
							<f:selectItem itemLabel="ExtendedProposalValidityPeriod"
								itemValue="startDate" />
							<f:selectItem itemLabel="ExtendPerformenceBondPeriod"
								itemValue="ModificationQT" />
						</p:selectManyCheckbox></td>
				</tr>

				<!-- </h:panelGrid> -->

			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'MITI Approval'}">


				<!-- 	<h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
 -->
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="Type Of Approval Request"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="Imported Goods"
								itemValue="Imported Goods" />

						</p:selectManyCheckbox></td>
				</tr>
				<!-- </h:panelGrid> -->

			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'Budget Approval'}">


				<!-- <h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
 -->
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="Type Of Approval Request"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="Budget" itemValue="Budget" />

						</p:selectManyCheckbox></td>
				</tr>
				<!-- </h:panelGrid> -->

			</ui:fragment>

			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'ICT Approval'}">


				<!-- 	<h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
 -->
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="Type Of Approval Request"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="ICT Project" itemValue="ICT Project" />

						</p:selectManyCheckbox></td>
				</tr>

				<!-- 	</h:panelGrid> -->

			</ui:fragment>


			<ui:fragment
				rendered="#{approvalCategory.titleName eq 'Division Approval'}">

				<!-- 
		<h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
 -->
				<tr>
					<td style="width: 138px;"><p:outputLabel
							value="Type Of Approval Request"></p:outputLabel></td>
					<td style="width: 100px;"><p:selectManyCheckbox
							value="#{approvalBackingBean.managedBean.approvalTypelist}"
							layout="pageDirection">
							<f:selectItem itemLabel="Publication" itemValue="Publication" />
							<f:selectItem itemLabel="ExtendedProposalPreparationStartDate"
								itemValue="startDate" />
							<f:selectItem itemLabel="ModificationQT"
								itemValue="ModificationQT" />
						</p:selectManyCheckbox></td>
				</tr>

				<!-- </h:panelGrid> -->


			</ui:fragment>


			<!-- <h:panelGrid columns="2"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td"> -->

			<tr>
				<td><p:outputLabel value="Status"></p:outputLabel></td>
				<td><p:inputText
						value="#{approvalCategory.scQtApproval.pmStatus.statusId}"
						readonly="true"></p:inputText></td>
			</tr>
			<!-- 	</h:panelGrid> -->

			<!-- 	<h:panelGrid columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td"> -->
			<tr>
				<td><p:outputLabel value="Letter No"></p:outputLabel></td>
				<td><p:inputText
						value="#{approvalCategory.scQtApproval.approvalLetterNo}"></p:inputText>
				</td>
				<td style="width: 110px; padding-left: 127px"><p:outputLabel
						value="Standard Document"></p:outputLabel></td>
				<td><h:panelGroup>



						<p:commandLink oncomplete="approvalUpload.show();return false;"
							partialSubmit="true" process="@this">
							<p:graphicImage library="ep/images/design" name="upload.png"
								value="/resources/ep/images/design/upload.png" />
							<f:setPropertyActionListener
								value="#{approvalCategory.scQtApproval}"
								target="#{approvalBackingBean.managedBean.scQtApproval}" />
							<f:setPropertyActionListener value="@(.testClass)"
								target="#{approvalBackingBean.managedBean.uploadUpdateId}" />
						</p:commandLink>

						<p:outputPanel autoUpdate="true">
							<h:outputText styleClass="testClass"
								value="#{approvalCategory.scQtApproval.scQtApprovalAttachment.fileName}"></h:outputText>
						</p:outputPanel>

					</h:panelGroup></td>
			</tr>
		</table>
		<!-- </h:panelGrid> -->
	</p:panel>


	<p:panel header="Proposal/Working Paper" toggleable="true">
		<h:panelGrid columns="3" rows="1"
			columnClasses="columnWidth50,columnWidth20,columnWidth30">
			<h:panelGroup>
				<p:dataTable var="attendancetender" rows="10">


					<p:column headerText="Proposal/Working Paper" style="width:30%">
						<h:outputText value="proposalpaper"></h:outputText>
					</p:column>

					<p:column headerText="Action">
						<p:commandLink>
							<p:graphicImage library="ep/images/design" name="delete.png"
								value="/resources/ep/images/design/delete.png" />

						</p:commandLink>



					</p:column>


				</p:dataTable>
				<p:commandButton value="Upload" style="float:right;" styleClass="ui-icon-upload"></p:commandButton>
			</h:panelGroup>



			<p:outputLabel value="Remarks"></p:outputLabel>

			<p:inputTextarea rows="3" cols="50" autoResize="false"
				value="#{approvalCategory.scQtApproval.requesterRemark}"></p:inputTextarea>


		</h:panelGrid>
	</p:panel>

</ui:composition>
