<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="Request Details by(DO)">
<p:panelGrid  styleClass="noBorders tr,noBorders td">
 <p:row >  
   <p:column >
   <p:outputLabel value="Type Of Approval Request"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
   <p:inputText></p:inputText>
 </p:column>
   </p:row>  
    
</p:panelGrid>
   </p:panel>
  
   <ui:fragment rendered="#{player.titleName eq 'BPKApproval'}">
				
			
<p:panel header="Applicable For BPK Approval Selection" toggleable="true">
<p:panelGrid styleClass="noBorders tr,noBorders td">

  <p:row >  
   <p:column >
   <p:outputLabel value="Type Of Approval Request"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
  
   <p:selectOneRadio   value="#{searchQtnTenderBB.managedBean.checkBoxBPK}" >  
            <f:selectItem itemLabel="RestrictedTender" itemValue="Restricted" />  
            <f:selectItem itemLabel="DirectNegotiations" itemValue="Direct" />  
            <f:selectItem itemLabel="Qtn/Tender Type Approval" itemValue="TendertypeApproval" /> 
              <f:selectItem itemLabel="ReducePublishingPeriod" itemValue="PublishingPeriod" />
               <f:selectItem itemLabel="ReduceProposalValidityPeriod" itemValue="ProposalValidity" />
                <!--   <p:ajax event="click" update="checkboxBPK" listener="#{searchQtnTenderBB.addBPKMessage}"/> -->
                    <p:ajax event="change"  listener="#{searchQtnTenderBB.addBPKMessage}" update="checkboxBPK"/>  
  </p:selectOneRadio>
   </p:column>
   </p:row>  

</p:panelGrid>
</p:panel>
</ui:fragment>

  <ui:fragment rendered="#{player.titleName eq 'PBApproval'}">

<p:panel header="Procurement Board Approval" toggleable="true">
<p:panelGrid styleClass="noBorders tr,noBorders td">

  <p:row >  
   <p:column >
   <p:outputLabel value="Type Of Approval Request"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
  
    <p:selectManyCheckbox  >  
            <f:selectItem itemLabel="CancellationQtn/Tender" itemValue="Publication" />  
            <f:selectItem itemLabel="ExtendedProposalValidityPeriod" itemValue="startDate" />  
            <f:selectItem itemLabel="ExtendPerformenceBondPeriod" itemValue="ModificationQT" /> 
              </p:selectManyCheckbox>
   </p:column>
   </p:row>  

</p:panelGrid>
</p:panel>
</ui:fragment>

  <ui:fragment rendered="#{player.titleName eq 'PTJApproval'}">

<p:panel header="For PTJ Approval" toggleable="true">
<p:panelGrid styleClass="noBorders tr,noBorders td">

  <p:row >  
   <p:column >
   <p:outputLabel value="Type Of Approval Request"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
  
    <p:selectManyCheckbox  >  
            <f:selectItem itemLabel="Publication" itemValue="Publication" />  
            <f:selectItem itemLabel="ExtendedProposalPreparationStartDate" itemValue="startDate" />  
            <f:selectItem itemLabel="ModificationQT" itemValue="ModificationQT" /> 
              </p:selectManyCheckbox>
   </p:column>
   </p:row>  

</p:panelGrid>
</p:panel>

</ui:fragment>

<p:panel>
<p:panelGrid styleClass="noBorders tr,noBorders td">
 <p:row >  
   <p:column >
   <p:outputLabel value="Letter NO"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
   <p:inputText></p:inputText>
 </p:column>
   </p:row>
   
    <p:row >  
   <p:column rowspan="2" >
   <p:outputLabel value="Standard Document"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
   
    <p:fileUpload  mode="simple" dragDropSupport="false"  
                  sizeLimit="100000" fileLimit="3" allowTypes="/(\.|\/)(gif|jpe?g|png)$/" />  
 </p:column>
   </p:row>

</p:panelGrid>
</p:panel>


<p:panel header="Proposal/WorkingPaper" toggleable="true">
<p:dataTable  var="attendancetender" value="#{searchQtnTenderBB.managedBean.qtnTenders}"  rows="10"  >
                
				
				<p:column headerText="Proposal/WorkingPaper" style="width:30%">
				 	<h:outputText value="proposalpaper"></h:outputText>
				</p:column>
				
				   <p:column headerText="Action" style="width:50%">
				     <p:commandLink >
                  <h:outputText value="Delete"  style="width:20%" />  
                 </p:commandLink>
                    <p:fileUpload  mode="simple" dragDropSupport="false" style="width:50%"
                  sizeLimit="100000" fileLimit="3" allowTypes="/(\.|\/)(gif|jpe?g|png)$/" />  
        </p:column>
        </p:dataTable>
  </p:panel>
  
  
  
  <p:panel>
<p:panelGrid  style="width:100%;"  styleClass="noBorders tr,noBorders td">
 <p:row >  
   <p:column >
   <p:outputLabel value="Option to add committee(s) "></p:outputLabel>
   </p:column>
     <p:column width="100%" style="text-align:right">
      <p:commandButton value="AddFunction"   style="float:right;" />
 </p:column>
   </p:row>  
    
</p:panelGrid>
   </p:panel>
   
   
   
   
   <p:panel >
<p:panelGrid  styleClass="noBorders tr,noBorders td">
 <p:row >  
   <p:column >
   <p:outputLabel value="Required Verification"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
   <p:selectOneRadio   value="#{searchQtnTenderBB.managedBean.checkBoxBPK}" >  
            <f:selectItem itemLabel="Yes" itemValue="0" />  
            <f:selectItem itemLabel="No" itemValue="1" /> 
            </p:selectOneRadio>
            
 </p:column>
   </p:row>  
    
    
    <p:row >  
   <p:column >
   <p:outputLabel value="Remarks"></p:outputLabel>
   </p:column>
   <p:column  width="20%">
   <p:inputTextarea rows="1"></p:inputTextarea>
            
 </p:column>
   </p:row> 
    
</p:panelGrid>
   </p:panel>

	</ui:composition>
