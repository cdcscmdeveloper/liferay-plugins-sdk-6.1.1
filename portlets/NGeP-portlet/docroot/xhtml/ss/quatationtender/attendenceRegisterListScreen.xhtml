<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="Briefing Description/Site Visit Description">
<p:panelGrid  styleClass="noBorders tr,noBorders td">
	 <p:row >  
   <p:column >
     <div style="position:absolute;top:200px;right:220px;"   >
           <p:commandButton  
					value="#{lbl['lbl.so.submit']}"/>
					</div>
					</p:column>
					</p:row>

</p:panelGrid>

</p:panel>
<p:panel header="Attendence Registration List" toggleable="true">
<p:dataTable id="attendanceList" var="attendancetenderbrief" value="#{searchQtnTenderBB.managedBean.qtnTenders}">
<p:column headerText="No" >
<h:outputText value="1"></h:outputText>
</p:column>

<p:column headerText="MOFRegistrationNo">
						<h:outputText value="123456"></h:outputText>
				</p:column>
				  
				   <p:column headerText="CompanyName">              
                <p:commandLink value="CommerceDotCom" action="attendenceByCompany.xhtml?faces-redirect=true">
                  <h:outputText value="CommerceDotCom" />  
                 </p:commandLink> 
        </p:column>
         
         <p:column headerText="Attendence" >
				 <h:selectBooleanCheckbox value="1"  style="width:200px" /> 
		</p:column>

</p:dataTable>
       
</p:panel>


<p:panel header="ApprovalDetails" toggleable="true">
<p:panelGrid  styleClass="noBorders tr,noBorders td">
<p:row>
<p:column>
<p:outputLabel value="ApproverName"></p:outputLabel>
</p:column>

<p:column>
 <p:selectOneMenu value="searchQtnTenderBB.managedBean.qtnTenders.planNumber" > 
	<f:selectItem itemLabel="DeskOfficer" itemValue="1" />   
	<f:selectItem itemLabel="siteManager" itemValue="2" />
	</p:selectOneMenu> 
</p:column>

</p:row>

<p:row>
<p:column>
<p:outputLabel value="Status"></p:outputLabel>
</p:column>

<p:column>
<p:inputText value="yes" readonly="true"></p:inputText>
</p:column>
</p:row>

<p:row>
<p:column>
<p:outputLabel value="ApprovalDate"></p:outputLabel>
</p:column>

<p:column>
<p:inputText value="23/09/2013 04:15" readonly="true"></p:inputText>
</p:column>
</p:row>

<p:row>
<p:column>
<p:outputLabel value="Action"></p:outputLabel>
</p:column>

<p:column>
 <p:selectOneMenu value="searchQtnTenderBB.managedBean.qtnTenders.planNumber" > 
	<f:selectItem itemLabel="Approve" itemValue="A" />   
	<f:selectItem itemLabel="Reject" itemValue="R" />
	<f:selectItem itemLabel="Revise" itemValue="R" />
	</p:selectOneMenu> 
</p:column>

</p:row>

<p:row>
<p:column>
<p:outputLabel value="Remarks"></p:outputLabel>
</p:column>

<p:column>
<p:inputTextarea rows="1" cols="100"></p:inputTextarea>
</p:column>
</p:row>

</p:panelGrid>

</p:panel>

	</ui:composition>
