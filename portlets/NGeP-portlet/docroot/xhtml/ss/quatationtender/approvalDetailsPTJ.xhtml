<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="Approval Details Section" toggleable="true">

<p:panelGrid columnClasses="30,20,30,20" styleClass="noBorders tr,noBorders td">
 
<p:row >  
   <p:column >
    <p:outputLabel value="Approver Name"></p:outputLabel>
    </p:column>
          <p:column  >
          <h:panelGroup  id="sample2"  >
          <p:selectOneMenu value="#{approvalBackingBean.managedBean.scQtApproval.approverUserId}"  rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '1'}" > 
	<f:selectItem itemLabel="approve" itemValue="1" />   
	<f:selectItem itemLabel="reject" itemValue="2" />
	<f:selectItem itemLabel="revise" itemValue="3" />
	</p:selectOneMenu> 
	 
          <p:inputText value="#{approvalBackingBean.managedBean.scQtApproval.approverUserId}"  rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '2'}"></p:inputText>
          </h:panelGroup>
          </p:column>
          
             <p:column  style="width:35%;">
    <p:outputLabel value="Approver Date"></p:outputLabel>
    </p:column  >
          <p:column >
      <p:inputText value="#{approvalBackingBean.managedBean.approvalDate}"></p:inputText>
          </p:column>
         	
          </p:row>	
        
           
 
          
               

         	
          
       <p:row>             
           
   <p:column >
    <p:outputLabel value="Action"></p:outputLabel>
    </p:column>
          <p:column  >
           <p:selectOneMenu value="#{approvalBackingBean.managedBean.scQtApproval.approvalAction}" > 
	<f:selectItem itemLabel="Approver" itemValue="ar" />   
	<f:selectItem itemLabel="Reject" itemValue="rj" />
	
	</p:selectOneMenu> 
          </p:column>
           
   <p:column >
    <p:outputLabel value="Remarks"></p:outputLabel>
    </p:column>
          <p:column  width="20%">
      <p:inputText value="#{approvalBackingBean.managedBean.scQtApproval.approvalRemark}"></p:inputText>
          </p:column>
      		  </p:row>   	

</p:panelGrid>

</p:panel>

	</ui:composition>
