<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Approval Details Section" toggleable="true">

		<h:panelGrid columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">


			<h:outputLabel value="Approver Name"></h:outputLabel>

			<h:panelGroup id="sample2">
				<p:selectOneMenu
					value="#{approvalCategory.scQtApproval.approverId}"
					rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '1'}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="ROSLAN" itemValue="2" />
					<f:selectItem itemLabel="KHAIR" itemValue="3" />
				</p:selectOneMenu>

				<p:inputText
					value="#{approvalCategory.scQtApproval.approverId}"
					rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '2'}"></p:inputText>
			</h:panelGroup>

			<h:outputLabel value="Approver Date"></h:outputLabel>

			<p:calendar
				value="#{approvalCategory.scQtApproval.approverActionDate}"
				showOn="button"></p:calendar>










			<h:outputLabel value="Action"></h:outputLabel>

			<p:selectOneMenu
				value="#{approvalCategory.scQtApproval.approverAction}">
					<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="APPROVER" itemValue="ar" />
				<f:selectItem itemLabel="REJECT" itemValue="rj" />

			</p:selectOneMenu>

			<h:outputLabel value="Remarks"></h:outputLabel>

			<p:inputTextarea rows="3" cols="50"
				value="#{approvalCategory.scQtApproval.approverRemark}"
				autoResize="false"></p:inputTextarea>


		</h:panelGrid>

	</p:panel>

</ui:composition>
