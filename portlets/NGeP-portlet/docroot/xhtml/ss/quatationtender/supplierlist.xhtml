<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel toggleable="true">
				<p:dataTable value="#{searchQtnTenderBB.managedBean.categories}" var="ccode" resizableColumns="true"
				>
			
				<p:column headerText="CompanyName" >
				
				 <p:tree value="#{companyBean.root2}" var="node"
            selectionMode="checkbox"
            selection="#{companyBean.selectedNodes}" style="border:none;">

        <p:treeNode>
            <h:outputText value="#{node}" />
        </p:treeNode>
    </p:tree>

				</p:column>

				<p:column headerText="MOF No">
				<h:outputText value="Mof001"></h:outputText>
				</p:column>
						

<p:column headerText="MOF Expiry Date">
				<h:outputText value="05/09/2013"></h:outputText>
				</p:column>
				
				
			
				<p:column headerText="Status">
				<h:outputText value="Active/Expired"></h:outputText>
				</p:column>
				
			</p:dataTable>


		  
	
		</p:panel>
		
		<p:dialog widgetVar="suppdlg" modal="true" appendToBody="true" width="800" height="400">
		
          <p:panel header="Search Supplier" toggleable="true" size="100">
				<p:panelGrid columns="2" style="width:50%;" styleClass="noBorders tr,noBorders td">
				
			<h:outputText  value="Circular No" />
			<p:inputText  value="#{searchQtnTenderBB.managedBean.qtno}"/>

<h:outputText value="Circular Name" />
			<p:inputText value="#{searchQtnTenderBB.managedBean.qtno}"/>

<h:outputText value="Item Name " />
			<p:inputText  value="#{searchQtnTenderBB.managedBean.qtno}"/>
	
		
	</p:panelGrid>
		
	<p:panelGrid style="width:33%;"
    styleClass="noBorders tr,noBorders td">
    <p:row>
     <p:column width="100%" style="text-align:right">
    <p:commandButton  value="#{lbl['lbl.so.addbtn']}"
			styleClass="apply_button">
		</p:commandButton>
     </p:column>
   </p:row>
   </p:panelGrid>		

		
<p:panelGrid columns="2" style="width:35%;" styleClass="noBorders tr,noBorders td">
				 <h:outputText value="Circular Coverage" />  
        <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectOption}">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="ALL" itemValue="All" />  
            <f:selectItem itemLabel="Semenanjung" itemValue="Semenanjung" />  
            <f:selectItem itemLabel="Sabah" itemValue="Sabah" />
            <f:selectItem itemLabel="Sarawak" itemValue="Sarawak" />  
        </p:selectOneMenu>  
    
				
			</p:panelGrid>
			
			<p:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
<p:commandButton  value="#{lbl['lbl.so.searchbtn']}"
			styleClass="apply_button" style="float:right;" >
		</p:commandButton>
		</p:panelGrid>
		
			<p:panel header="Supplier List" toggleable="true">
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			
			<p:dataTable value="#{searchQtnTenderBB.managedBean.categories}" var="ccode" resizableColumns="true"
				>
				

				<p:column headerText="CompanyName">
				
				
       <p:tree value="#{companyBean.root2}" var="node"
            selectionMode="checkbox"
            selection="#{companyBean.selectedNodes}" style="border:none;">

        <p:treeNode>
            <h:outputText value="#{node}" />
        </p:treeNode>
    </p:tree>

				</p:column>

				<p:column headerText="MOF No">
				<h:outputText value="Mof001"></h:outputText>
				</p:column>
						

<p:column headerText="MOF Expiry Date">
				<h:outputText value="05/09/2013"></h:outputText>
				</p:column>
				
				
				<p:column headerText="Status">
				<h:outputText value="Active/Expired"></h:outputText>
				</p:column>
				
			</p:dataTable>
</p:panelGrid>
</p:panel>

	

 <p:panelGrid columns="2" style="width:42%;"
				styleClass="noBorders tr,noBorders td">
		<h:outputText value="TotalSuppliers" />  
            <p:inputText  value="1" readonly="true"/> 
 
 </p:panelGrid>
	
 </p:panel>           

<p:panel toggleable="true">
<div>           
<p:commandButton value="CANCEL" style="float:right;" oncomplete="suppdlg.hide()">
</p:commandButton>
<p:commandButton value="OK" style="float:right;" oncomplete="suppdlg.hide()">
</p:commandButton>
</div> 
</p:panel>
		
		
	</p:dialog>
	
		
			
		</ui:composition>
