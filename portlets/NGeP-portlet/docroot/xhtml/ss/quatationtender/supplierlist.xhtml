<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true">
				<p:dataTable value="#{qTSupplierQulCriteriaBackingBean.managedBean.smMofAccounts}" var="panelsupplier" resizableColumns="true" id="panelsuppliermain"
				>
			
				<p:column headerText="#{lbl['lbl.so.suppliername']}" style="width:40%">  
          <f:facet name="header">   </f:facet>  
           <p:outputLabel value="#{ccode.zoneName}" style="float:left;"/>  
       </p:column>  
       

				<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText value="#{panelsupplier.mofNo}"></h:outputText>
				</p:column>
						

               <p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText value="#{panelsupplier.expDate}"></h:outputText>
				</p:column>
				
				
			
				<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText value="Active/Expired"></h:outputText>
				</p:column>
				
			</p:dataTable>


		  
	
		</p:panel>
		
		<p:dialog header="Search Supplier" widgetVar="suppdlg" modal="false" appendToBody="false" width="800" height="400">
		
          <p:panel  toggleable="true" size="100">
				<p:panelGrid columns="2" style="width:50%;" styleClass="searchsupplierClass noBorders tr noBorders td" >
				
			<h:outputLabel  value="#{lbl['lbl.so.circularno']}" />
			<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctPanelSupplier.ctPanelItem.ctCircularVer.circularNo}"/>

<h:outputLabel value="#{lbl['lbl.so.cirname']}" />
			<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctPanelSupplier.ctPanelItem.ctCircularVer.circularFileName}"/>

<h:outputLabel value="#{lbl['lbl.so.itemname']}" />
			<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctPanelSupplier.ctPanelItem.itemName}"/>
	
		
	</p:panelGrid>
		
	<p:panelGrid style="width:33%;"
    styleClass="noBorders tr,noBorders td">
    <p:row>
     <p:column width="100%" style="text-align:right">
    <p:commandButton  value="#{lbl['lbl.so.addbtn']}"
		icon=".ui-icon-add"	styleClass="apply_button">
		</p:commandButton>
     </p:column>
   </p:row>
   </p:panelGrid>		

		
<p:panelGrid columns="2" style="width:35%;" styleClass="noBorders tr noBorders td">
				 <h:outputLabel value="#{lbl['lbl.so.circularcoverage']}"/>  
        <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectOption}">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="ALL" itemValue="All" />  
            <f:selectItem itemLabel="Semenanjung" itemValue="Semenanjung" />  
            <f:selectItem itemLabel="Sabah" itemValue="Sabah" />
            <f:selectItem itemLabel="Sarawak" itemValue="Sarawak" />  
        </p:selectOneMenu>  
    
				
			</p:panelGrid>
			
			
			<p:panelGrid columns="1" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
<p:commandButton  value="#{lbl['lbl.so.searchbtn']}"
			styleClass="apply_button" style="float:right;" action="#{qTSupplierQulCriteriaBackingBean.searchQtPanelSupplier}" id="panelsupplier" update="mySupplierListId" icon=".ui-icon-search"> 
		</p:commandButton>
		</p:panelGrid>
		</p:panel>
			<p:panel header="Supplier List Results" toggleable="true">
		<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			
			<p:dataTable value="#{qTSupplierQulCriteriaBackingBean.managedBean.ctPanelSuppliers}" var="psupplier" id="mySupplierListId"
			 selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedpanelsupplier}"
				rowKey="#{psupplier}" rowIndexVar="rowIndex"
				rows="10">
				<p:column selectionMode="multiple" style="width:2%" />
				<ac:paginator for="mySupplierListId" />
				
                  
				<p:column headerText="#{lbl['lbl.so.suppliername']}">
				
				
      
            <h:outputText value="#{psupplier.smSupplier.pmOrgProfile.orgName}" />
        

				</p:column>
				
				<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText value="#{psupplier.smMofAccounts.mofNo}"></h:outputText>
				</p:column>

			     <p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText value="#{psupplier.smMofAccounts.expDate}"></h:outputText>
				</p:column>
				
				
			
				<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText value="Active/Expired"></h:outputText>
				</p:column>
				
			</p:dataTable>
</p:panelGrid>


	

 <p:panelGrid columns="2" style="width:42%;"
				styleClass="noBorders tr,noBorders td">
		<h:outputText value="#{lbl['lbl.so.totalsup']}"/>  
            <p:inputText  value="1" readonly="true"/> 
 
 </p:panelGrid>
	
          


<div>           
<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" style="float:right;" oncomplete="suppdlg.hide()">
</p:commandButton>
<p:commandButton value="#{lbl['lbl.so.okbtn']}" style="float:right;" oncomplete="suppdlg.hide()" update="panelsuppliermain">
</p:commandButton>
</div> 
</p:panel>
		 
		
	</p:dialog>
	
		
			
		</ui:composition>
