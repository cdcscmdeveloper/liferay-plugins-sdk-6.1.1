            <h:outputText id="txt1" value="CyberJaya" />

		<p:dialog widgetVar="suppdlg" modal="true" width="800" height="400">
		
		<p:panel header="Search Supplier" toggleable="true">

			</p:panel>	
				
			<p:panel header="Category Code List" toggleable="true">	
				<p:dataTable value="#{searchQtnTenderBB.managedBean.categories}"
			var="ccode" resizableColumns="true" editable="true">
			<p:ajax event="rowEdit" />
			<p:ajax event="rowEditCancel" />

			<p:column headerText="No.">

				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.num}" />
					</f:facet>
					<f:facet name="input">
						<p:inputText value="#{ccode.num}" style="width:100%" />
					</f:facet>
				</p:cellEditor>

			</p:column>

			<p:column headerText="Category Code">

				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.mainCCode}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItems value="#{searchQtnTenderBB.managedBean.mainCcode}" />
						</p:selectOneMenu>
					</f:facet>
				
					<f:facet name="output">
						<h:outputText value="#{ccode.subCCode}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="sub1" itemValue="1" />
							<f:selectItem itemLabel="sub2" itemValue="2" />
							<f:selectItem itemLabel="sub3" itemValue="3" />
						</p:selectOneMenu>
					</f:facet>
				
					<f:facet name="output">
						<h:outputText value="#{ccode.subCDevison}" />
					</f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="" />
							<f:selectItem itemLabel="Subcc1" itemValue="1" />
							<f:selectItem itemLabel="Subcc2" itemValue="2" />
							<f:selectItem itemLabel="Subcc3" itemValue="3" />
						</p:selectOneMenu>
					</f:facet>
				</p:cellEditor>



			</p:column>

			<p:column headerText="Mandatory">


				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.manditory}" />
					</f:facet>
					<f:facet name="input">

						<p:selectManyCheckbox
							value="#{searchQtnTenderBB.managedBean.selectOptions}">
							<f:selectItem itemLabel="yes" />
							<f:selectItem itemLabel="no" />

						</p:selectManyCheckbox>
					</f:facet>
				</p:cellEditor>

			</p:column>
			<p:column style="width:6%">
				<p:rowEditor />
			</p:column>

		</p:dataTable>
			
			<p:commandButton  value="#{lbl['lbl.so.addbtn']}"
			styleClass="apply_button" style="float:right;">
		</p:commandButton>
		<br/>
		<br/>

<h:outputText value="Company Name" />
