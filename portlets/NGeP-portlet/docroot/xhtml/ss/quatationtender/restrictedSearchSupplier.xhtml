<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel toggleable="true">
		
		
				<p:dataTable value="#{searchQtnTenderBB.managedBean.categories}" var="ccode" resizableColumns="true">
				
			
				<p:column headerText="#{lbl['lbl.so.suppliername']}">
				
				<h:outputLink id="lnk" value="#">  
        <h:outputText value="XXXX"></h:outputText>  
    </h:outputLink>  
    <p:tooltip for="lnk"> 
     <p:panel id="display" header="#{lbl['lbl.so.suppliername']}" style="margin-top:10px;">  
        <h:panelGrid columns="2">  
            <h:outputText value="Address: " />  
            <h:outputText id="txt1" value="CyberJaya" />               
            <h:outputText value="PhNo" />  
            <h:outputText id="txt2" value="1111111111111111" />  
             <h:outputText value="Fax" />  
            <h:outputText id="txt3" value="01-25-3456" />
        </h:panelGrid>  
    </p:panel>  </p:tooltip> 
							

				</p:column>

				<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText value="Mof001"></h:outputText>
				</p:column>
						

<p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText value="05/09/2013"></h:outputText>
				</p:column>
				
				
			
				<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText value="Active/Expired"></h:outputText>
				</p:column>
				
			</p:dataTable>


		  
	
		</p:panel>
		
		<p:dialog header="Search Supplier" widgetVar="suppdlg" modal="true"  width="800" height="400">
		
		
				
			<p:panel header="Category Code List" toggleable="true">	
						<p:dataTable value="#{qTSupplierQulCriteriaBackingBean.managedBean.restrictedCategorys}"
			var="ccode" resizableColumns="true" editable="true" >
  
				

				<p:column headerText="#{lbl['lbl.so.category']}">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL1.categoryL1Id}" />
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL1.categoryL1Id}" >
						<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.handleL2CategoryChange}"/>
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL1s}" var="catL1Opt" itemLabel="#{catL1Opt.cateogryL1Code}" itemValue="#{catL1Opt.categoryL1Id}"/>
						</p:selectOneMenu>
					</f:facet>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL2.categoryL2Id}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL2.categoryL2Id}"
							effect="fold" editable="true">
							<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.handleL3CategoryChange}"/>
							<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL2s}" var="catL2Opt" itemLabel="#{catL2Opt.cateogryL2Code}" itemValue="#{catL2Opt.categoryL2Id}"/>
						</p:selectOneMenu>
					</f:facet>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL3.cateogryL3Id}" />
					</f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL3.cateogryL3Id}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL3s}" var="catL3Opt" itemLabel="#{catL3Opt.cateogryL3Code}" itemValue="#{catL3Opt.categoryL3Id}"/>
						</p:selectOneMenu>
					</f:facet>
					</p:cellEditor>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.so.mandatory']}"  style="width: 150px;">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.mandatory}" />
					</f:facet>
					<f:facet name="input">

						<p:selectManyCheckbox
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategory.mandatory}">
							<f:selectItem itemLabel="yes" />
							<f:selectItem itemLabel="no" />

						</p:selectManyCheckbox>
					</f:facet>
				</p:cellEditor>

			</p:column>
     		<p:column style="width:6%">
				<p:rowEditor />
			</p:column>
			</p:dataTable>
			
			
			
				<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td" >
			
			<h:outputLabel  value="#{lbl['lbl.so.paidup']}" />
			<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"/>
           
<h:outputLabel value="#{lbl['lbl.so.companyname']}" />
			<p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.searchSupplier.pmOrgProfile.orgName}"/>

<h:outputLabel value="#{lbl['lbl.so.mofno']}" />
			<p:inputText  value="#{qTSupplierQulCriteriaBackingBean.managedBean.smMofAccounts[0].mofNo}"/>
				
			</p:panelGrid>
			
			<p:commandButton  value="#{lbl['lbl.so.searchbtn']}"
			styleClass="apply_button" style="float:right;" id="restrictSupplier" action="#{qTSupplierQulCriteriaBackingBean.searchQtPanelSupplier}" update="restrictedsupplier">
		</p:commandButton>
		
				<br/>
				<br/>
		</p:panel>
			<p:panel header="Supplier List" toggleable="true">
		<p:panelGrid columns="2" style="width:100%;"
			id="restrictedsupplier" styleClass="noBorders tr,noBorders td">
			
			<p:dataTable value="#{qTSupplierQulCriteriaBackingBean.managedBean.smSupplierList}" var="supplier" resizableColumns="true" id="ressupplier"
				selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedrestircedsupplier}"
				rowKey="#{supplier}" rowIndexVar="rowIndex"
				rows="10">
				<p:column selectionMode="multiple" style="width:2%" />
				<ac:paginator for="ressupplier" />
				

				<p:column headerText="#{lbl['lbl.so.suppliername']}">
				
				<h:outputLink id="lnk1" value="#">  
        <h:outputText value="#{supplier.pmOrgProfile.orgName}"></h:outputText>  
    </h:outputLink>  
    <p:tooltip for="lnk1"> 
     <p:panel header="CompanyAddress" style="margin-top:10px;">  
        <h:panelGrid columns="2">  
            <h:outputText value="Address: " />  
            <h:outputText  value="CyberJaya" />               
            <h:outputText value="PhNo" />  
            <h:outputText value="1111111111111111" />  
             <h:outputText value="Fax" />  
            <h:outputText  value="01-25-3456" />
        </h:panelGrid>  
    </p:panel>  </p:tooltip> 
				
				</p:column>

				<p:column headerText="#{lbl['lbl.so.mofno']}">
				<h:outputText value="#{supplier.smMofAccounts[0].mofNo}"></h:outputText>
				</p:column>
	
<p:column headerText="#{lbl['lbl.so.mofexp']}">
				<h:outputText value="#{supplier.smMofAccounts[0].expDate}"></h:outputText>
				</p:column>
			
				<p:column headerText="#{lbl['lbl.so.status']}">
				<h:outputText value="#{supplier.smMofAccounts[0].statusId}"></h:outputText>
				</p:column>
				
			</p:dataTable>
</p:panelGrid>

<div>           
<p:commandButton value="#{lbl['lbl.so.cancelbtn']}" style="float:right;" oncomplete="suppdlg.hide()">
</p:commandButton>
<p:commandButton value="#{lbl['lbl.so.okbtn']}" style="float:right;" oncomplete="suppdlg.hide()">
</p:commandButton>
</div> 
</p:panel>

	</p:dialog>
		</ui:composition>
