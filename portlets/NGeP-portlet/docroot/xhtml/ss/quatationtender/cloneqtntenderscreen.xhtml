<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog widgetVar="clonedlg" modal="true" appendToBody="true"
		width="800" height="400">


		<p:panel header="Search Qtn/Tender" toggleable="true">
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

				<h:outputText value="Title" />
				<p:inputText value="#{qTDetailBB.managedBean.qt.qtTitle}" size="100" />

			</p:panelGrid>

			<p:panelGrid columns="4" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

				<h:outputLabel for="qtnno" value="#{lbl['lbl.so.qtnno']}" />
				<p:inputText id="clnqtnno" value="#{qTDetailBB.managedBean.qt.qtNo}" />


				<h:outputText value="#{lbl['lbl.so.procmode']}" />
				<p:selectOneMenu
					value="#{qTDetailBB.managedBean.qt.procurementMode}">
					<f:selectItems
						value="#{qTDetailBB.managedBean.procurementModeItems}" />
				</p:selectOneMenu>


				<h:outputText value="#{lbl['lbl.so.creatdtfrom']}" />
				<p:calendar value="#{qTDetailBB.managedBean.qt.createDateFrom}"
					id="clncrdateFrm" showOn="button" />

				<h:outputText value="#{lbl['lbl.so.creatdtto']}" />
				<p:calendar value="#{qTDetailBB.managedBean.qt.createdDateTo}"
					id="clncrdateTo" showOn="button" />


				<h:outputText value="#{lbl['lbl.so.status']}" />
				<p:selectOneMenu
					value="#{searchQtnTenderBB.managedBean.selectOption}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Option 1" itemValue="" />
					<f:selectItem itemLabel="Option 2" itemValue="" />
					<f:selectItem itemLabel="Option 3" itemValue="" />
				</p:selectOneMenu>

			</p:panelGrid>
			<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
				style="float:right;" action="#{qTDetailBB.cloneSearchQt}"
				update="cloneQtsearch">


			</p:commandButton>


			<br />


		</p:panel>


		<p:panel header="Search Qtn/Tender Result" toggleable="true">
			<h:panelGroup style="width:100%;">
				<p:dataTable value="#{qTDetailBB.managedBean.cloneTenderList}"
					id="cloneQtsearch" var="tenders" rowIndexVar="index">


					<p:column headerText="#{lbl['lbl.so.no']}" style="width:3%">
						<h:outputText value="#{index + 1}" />
					</p:column>

					<p:column headerText="Qtn/Tender No">

						<h:outputText value="#{tenders.qtNo}" />



					</p:column>

					<p:column headerText="#{lbl['lbl.so.title']}">
						<h:outputText value="#{tenders.qtTitle}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.procmode']}">
						<h:outputText value="#{tenders.procurementMode}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.so.crtdt']}">
						<h:outputText value="#{tenders.createdDate}" />
					</p:column>

				</p:dataTable>

			</h:panelGroup>



		</p:panel>

		<p:panel header="Clone Qtn/Tender Sections" toggleable="true">
			<!-- 	<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">


				<p:tree value="#{cloneBean.root2}" var="node"
					selectionMode="checkbox" selection="#{cloneBean.selectedNodes}"
					style="border:none;">

					<p:treeNode>
						<h:outputText value="#{node}" />
					</p:treeNode>
				</p:tree>
			</h:panelGrid>

 -->

			<!-- <p:commandButton  value="Cancel"
			styleClass="apply_button" style="float:right;" onclick="dlg.hide()" />
 -->
			<p:commandButton value="CANCEL" styleClass="apply_button"
				style="float:right;" onclick="clonebtn.hide()">

			</p:commandButton>
			<p:commandButton value="CLONE" style="float:right;"
				onclick="clonebtn.hide();"></p:commandButton>
		</p:panel>
	</p:dialog>


</ui:composition>
