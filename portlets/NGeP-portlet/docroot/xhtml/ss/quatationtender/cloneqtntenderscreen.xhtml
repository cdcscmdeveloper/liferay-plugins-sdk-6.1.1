<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog widgetVar="clonedlg" modal="true">


		<p:panel header="Search Qtn/Tender" toggleable="true">
			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

				<h:outputText value="Title" />
				<p:inputText value="#{searchQtnTenderBB.managedBean.qtno}"
					size="100" />

			</p:panelGrid>

			<p:panelGrid columns="4" style="width:100%;"
				styleClass="noBorders tr,noBorders td">

				<h:outputText value="QTN/Tender No" />
				<p:inputText value="#{searchQtnTenderBB.managedBean.qtno}" />


				<h:outputText value="#{lbl['lbl.so.procmode']}" />
				<p:selectOneMenu
					value="#{searchQtnTenderBB.managedBean.selectOption}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Quotation" itemValue="Quotation" />
					<f:selectItem itemLabel="Tender" itemValue="Tender" />
					<f:selectItem itemLabel="Direct Negotiation"
						itemValue="Direct Negotiation" />
				</p:selectOneMenu>


				<h:outputText value="#{lbl['lbl.so.creatdtfrom']}" />
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}"
					showOn="button" />

				<h:outputText value="#{lbl['lbl.so.creatdtto']}" />
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}"
					showOn="button" />

				<h:outputText value="#{lbl['lbl.so.status']}" />
				<p:selectOneMenu
					value="#{searchQtnTenderBB.managedBean.selectOption}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Option 1" itemValue="1" />
					<f:selectItem itemLabel="Option 2" itemValue="2" />
					<f:selectItem itemLabel="Option 3" itemValue="3" />
				</p:selectOneMenu>
			</p:panelGrid>
<p:commandButton value="SEARCH" styleClass="apply_button"
				style="float:right;">

			</p:commandButton>
			<br/>
			

					</p:panel>
		<br />

		<p:panel header="Search Qtn/Tender Result" toggleable="true">
			<h:panelGroup  style="width:100%;">
				<p:dataTable value="#{searchQtnTenderBB.managedBean.dataBean}"
					var="tenders" selection="#{searchQtnTenderBB.managedBean.selectableBean}">


					<p:column headerText="#{lbl['lbl.so.no']}" style="width:3%">
						<h:outputText value="1" />
					</p:column>

					<p:column headerText="Qtn/Tender No" style="width:5%">

						<h:outputText value="#{tenders.qtnTenderNum}" />

					</p:column>

					<p:column headerText="#{lbl['lbl.so.title']}" style="width:60%">
						<h:outputText value="#{tenders.title}" />
					</p:column>
					<p:column headerText="#{lbl['lbl.so.procmode']}" style="width:10%">
						<h:outputText value="#{tenders.procumentMode}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.so.crtdt']}" style="width:20%">
						<h:outputText value="#{tenders.crtdDateTo}" />
					</p:column>

<p:column selectionMode="single" style="width:2%" /> 

				</p:dataTable>

			</h:panelGroup>

			<p:commandButton value="CLONE" style="float:right;"
				onclick="clonebtn.show();"></p:commandButton>

		</p:panel>
	</p:dialog>

	<p:dialog widgetVar="clonebtn" modal="true">

		<p:panel header="Clone Qtn/Tender Sections" toggleable="true">
			<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="5">

				<p:selectManyCheckbox
					value="#{searchQtnTenderBB.managedBean.selectOptions}"
					layout="pageDirection">
					<f:selectItem itemLabel="Qtn/Tender Title"
						itemValue="Qtn/Tender Title" />
					<f:selectItem itemLabel="Qtn/Tender Details"
						itemValue="Qtn/Tender Details" />
					<f:selectItem itemLabel="ApprovalWorkFlow"
						itemValue="ApprovalWorkFlow" />
					<f:selectItem itemLabel="Supplier Qualification Criteria"
						itemValue="Supplier Qualification Criteria" />
					<f:selectItem itemLabel="Schedule" itemValue="Schedule" />
					<f:selectItem itemLabel="Documents" itemValue="Documents" />
				</p:selectManyCheckbox>
			</h:panelGrid>



			<!-- <p:commandButton  value="Cancel"
			styleClass="apply_button" style="float:right;" onclick="dlg.hide()" />
 -->
			<p:commandButton value="CANCEL" styleClass="apply_button"
				style="float:right;" onclick="clonebtn.hide()">

			</p:commandButton>
			<p:commandButton value="OK" styleClass="apply_button"
				style="float:right;" onclick="clonebtn.hide()">

			</p:commandButton>
		</p:panel>
	</p:dialog>
</ui:composition>
