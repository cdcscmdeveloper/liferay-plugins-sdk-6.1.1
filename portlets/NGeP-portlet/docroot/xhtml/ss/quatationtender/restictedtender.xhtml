
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
		<p:panel header="Category Code List" toggleable="true">

  
<p:panelGrid columns="2" style="width:38%;"
				styleClass="noBorders tr,noBorders td">
		<h:outputText value="#{lbl['lbl.so.paidup']}"  />  
            <p:inputText value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCriteria.paidUpCaptial}"/> 
            </p:panelGrid>
          
    
			

<h:panelGroup  style="width:100%;">
			<p:dataTable value="#{qTSupplierQulCriteriaBackingBean.managedBean.restrictedCategorys}"
			var="ccode" resizableColumns="true" editable="true"  styleClass="myCatList2" id="rescatcode"
			selection="#{qTSupplierQulCriteriaBackingBean.managedBean.selectedrestrictedcCategories}"
				rowKey="#{ccode}" rowIndexVar="rowIndex"
				rows="10">
				<p:column selectionMode="multiple" style="width:2%" />
				<ac:paginator for="rescatcode" />
  
				

				<p:column headerText="#{lbl['lbl.so.category']}">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL1.categoryL1Id}" />
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL1.categoryL1Id}" >
						<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.handleL2CategoryChange}"/>
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL1s}" var="catL1Opt" itemLabel="#{catL1Opt.cateogryL1Code}" itemValue="#{catL1Opt.categoryL1Id}"/>
						</p:selectOneMenu>
					</f:facet>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL2.categoryL2Id}" />,
                </f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL2.categoryL2Id}"
							effect="fold" editable="true">
							<p:ajax event="change" listener="#{qTSupplierQulCriteriaBackingBean.handleL3CategoryChange}"/>
							<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL2s}" var="catL2Opt" itemLabel="#{catL2Opt.cateogryL2Code}" itemValue="#{catL2Opt.categoryL2Id}"/>
						</p:selectOneMenu>
					</f:facet>
					<f:facet name="output">
						<h:outputText value="#{ccode.pmCategoryL3.cateogryL3Id}" />
					</f:facet>
					<f:facet name="input">
						<p:selectOneMenu value="#{ccode.pmCategoryL3.cateogryL3Id}"
							effect="fold" editable="true">
							<f:selectItem itemLabel="Select One" itemValue="#{null}" />
							<f:selectItems value="#{qTSupplierQulCriteriaBackingBean.managedBean.categoryL3s}" var="catL3Opt" itemLabel="#{catL3Opt.cateogryL3Code}" itemValue="#{catL3Opt.categoryL3Id}"/>
						</p:selectOneMenu>
					</f:facet>
					</p:cellEditor>
			 </p:column>
			 <p:column headerText="#{lbl['lbl.so.mandatory']}"  style="width: 150px;">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{ccode.mandatory}" />
					</f:facet>
					<f:facet name="input">

						<p:selectBooleanCheckbox
							value="#{qTSupplierQulCriteriaBackingBean.managedBean.qtCategory.mandatory}">
							<f:selectItem itemLabel="yes" />
							<f:selectItem itemLabel="no" />

						</p:selectBooleanCheckbox>
					</f:facet>
				</p:cellEditor>

			</p:column>
     		<p:column style="width:6%">
				<p:rowEditor />
			</p:column>
			</p:dataTable>




		</h:panelGroup>
<p:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<f:facet name="footer">
						<div align="right">
		<p:commandButton value="#{lbl['lbl.so.addbtn']}" style="float:right;"
			actionListener="#{qTSupplierQulCriteriaBackingBean.addNewRestrictedCategoryItem}"  update="@(.myCatList2)"/>
			
					<p:commandButton value="#{lbl['lbl.so.delete']}" style="float:right;"/>
			</div>
			</f:facet>
			</p:panelGrid>
			<p:panelGrid columns="1" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
<p:commandButton value="#{lbl['lbl.so.searchbtn']}" style="float:right;"
					onclick="suppdlg.show();"></p:commandButton>	
				</p:panelGrid>
			<br/>
			<br/>
</p:panel>
<p:panel header="Supplier List" toggleable="true"> 
	<ui:include src="/xhtml/ss/quatationtender/restrictedSearchSupplier.xhtml"></ui:include>	
	
	 <p:panelGrid columns="3" style="width:45%;"
				styleClass="noBorders tr,noBorders td">
		<h:outputText value="#{lbl['lbl.so.totalsup']}" />  
            <p:inputText  value="1" readonly="true"/> 
            
            

		</p:panelGrid>
		</p:panel>
		</ui:composition>
