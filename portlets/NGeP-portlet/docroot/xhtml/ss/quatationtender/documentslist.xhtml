<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets">
<h:head>
	<title>Include demo</title>
</h:head>
<h:body>
	
	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Documents" toggleable="true">
	
	<p:panelGrid columns="4" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:dataTable  var="document"
				value="#{qTDocumentsBB.managedBean.scQtChecklists}"  editable="false" styleClass="documentslist">

         <p:column headerText="#{lbl['lbl.so.title']}">  
                     <p:inputTextarea value="#{qTDocumentsBB.managedBean.scQtDoc.docTitle}"  rows="1" cols="50" 
                     	disabled="e" />
                     	</p:column>
         
          
					

    <p:column headerText="#{lbl['lbl.so.type']}" style="width:35%">
				<h:outputText value="#{qTDocumentsBB.managedBean.qtCheckList.docType}"></h:outputText>
					
</p:column>
     <p:column headerText="#{lbl['lbl.so.order']}" style="width:35%">
				<h:inputText value="number" size="2"/>
					
</p:column>
 <p:column headerText="#{lbl['lbl.so.action']}" style="width:35%"> 
				
		<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />
				</p:commandLink>			
</p:column>
  
			</p:dataTable>
			
			
	</p:panelGrid>
<!-- <p:commandButton value="ADD" action="#{qTDocumentsBB.addDocuments}" update="@(.documentslist)" style="float:right;" ></p:commandButton>  -->	 
 
	  <br/>
  <br/>
	
	</p:panel>
	</h:body>
	</html>
