<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:ac="http://ac.my/jsf/composite/cc">
<h:head>
	<title>Include demo</title>
</h:head>
<h:body>
	
	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Documents" toggleable="true">
	
	<p:panelGrid columns="4" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:dataTable  var="document" id="doclist"
				value="#{qTDocumentsBB.managedBean.scQtChecklists}"  editable="false" styleClass="documentslist"
			    rowKey="#{document}" rowIndexVar="rowIndex"
				rows="10">
				
				<ac:paginator for="doclist" />
			

         <p:column headerText="#{lbl['lbl.so.title']}">  
                    <h:outputText value="#{document.title}"></h:outputText>
                     	</p:column>
         
          
					

    <p:column headerText="#{lbl['lbl.so.type']}" style="width:25%">
				<h:outputText value="#{document.checklistType}"></h:outputText>
					
</p:column>
     <p:column headerText="#{lbl['lbl.so.order']}" style="width:10%">
				<h:outputText value="#{document.checklistSeq}" size="2"/>
					
</p:column>
 
 <!-- <p:column headerText="#{lbl['lbl.so.action']}" style="width:35%"> 
				
		<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />
				</p:commandLink>			
</p:column> -->
  
			</p:dataTable>
			
			
	</p:panelGrid>
	 
 
	  <br/>
  <br/>
	
	</p:panel>
	</h:body>
	</html>
