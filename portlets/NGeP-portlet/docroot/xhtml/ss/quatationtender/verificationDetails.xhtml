<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Verification Details Section" toggleable="true">


		<h:panelGrid columns="4"
			columnClasses="columnWidth25,columnWidth25,columnWidth20,columnWidth30">

			<h:outputLabel value="Option Of Verification"></h:outputLabel>

			<p:selectOneRadio
				value="#{approvalCategory.scQtApproval.verifyOption}">
				<f:selectItem itemLabel="Online" itemValue="O" />
				<f:selectItem itemLabel="Offline" itemValue="F" />
				<p:ajax event="change"
					listener="#{approvalBackingBean.processChecked}"
					update="sample,sample1,sample2" />
				<!--  <p:ajax update="@form"   />  -->
			</p:selectOneRadio>
			<h:column></h:column>
			<h:column></h:column>
			<h:outputLabel value="Verifier Name"></h:outputLabel>

			<h:panelGroup id="sample">
				<p:selectOneMenu value="#{approvalCategory.scQtApproval.verifierId}"
					rendered="#{approvalCategory.scQtApproval.verifyOption eq 'O'}" style="width: 100px;">
					<f:selectItems value="#{qTDetailBB.managedBean.veryfiers}" var="verifyer"   itemLabel="#{verifyer.userName}" itemValue="#{verifyer.userId}"></f:selectItems>
				
				</p:selectOneMenu>

				<p:inputText value="#{approvalCategory.scQtApproval.verifierId}"
					rendered="#{approvalCategory.scQtApproval.verifyOption eq 'F'}"></p:inputText>
			</h:panelGroup>

			<h:outputLabel value="Verification Date"></h:outputLabel>

			<p:calendar
				value="#{approvalCategory.scQtApproval.verifierActionDate}"
				showOn="button"></p:calendar>






			<h:outputLabel value="Action"></h:outputLabel>

			<p:selectOneMenu
				value="#{approvalCategory.scQtApproval.verifyAction}" style="width: 100px;">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="REVISE" itemValue="s" />
				<f:selectItem itemLabel="REJECT" itemValue="r" />
				<f:selectItem itemLabel="ACCEPT" itemValue="e" />
			<p:ajax event="change" partialSubmit="true" process="@this" listener="#{qTDetailBB.setOutComeAction(approvalCategory.scQtApproval.verifyAction)}"/>
						
			</p:selectOneMenu>

			<h:outputLabel value="Remarks" style="vertical-align:top;"></h:outputLabel>

			<p:inputTextarea rows="3" cols="50" autoResize="false"
				value="#{approvalCategory.scQtApproval.verifierRemark}"></p:inputTextarea>


		</h:panelGrid>

	</p:panel>

</ui:composition>
