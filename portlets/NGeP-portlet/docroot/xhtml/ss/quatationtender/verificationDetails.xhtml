<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Verification Details Section" toggleable="true">

		<p:panelGrid columnClasses="30,20,30,20"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column>
					<h:outputText value="Option Of Verification"></h:outputText>
				</p:column>
				<p:column width="20%">
					<p:selectOneRadio
						value="#{approvalBackingBean.managedBean.scQtApproval.verifyOption}">
						<f:selectItem itemLabel="Online" itemValue="1" />
						<f:selectItem itemLabel="Offline" itemValue="2" />
						<p:ajax event="change"
							listener="#{approvalBackingBean.processChecked}"
							update="sample,sample1,sample2"/>
						<!--  <p:ajax update="@form"   />  -->
					</p:selectOneRadio>
				</p:column>
			</p:row>


			<p:row>

				<p:column>
					<h:outputText value="Verifier Name"></h:outputText>
				</p:column>
				<p:column width="20%">
					<h:panelGroup id="sample">
						<p:selectOneMenu
							value="#{approvalBackingBean.managedBean.scQtApproval.verifierUserId}"
							rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '1'}">
							<f:selectItem itemLabel="approve" itemValue="1" />
							<f:selectItem itemLabel="reject" itemValue="2" />
							<f:selectItem itemLabel="revise" itemValue="3" />
						</p:selectOneMenu>

						<p:inputText
							value="#{approvalBackingBean.managedBean.scQtApproval.verifierUserId}"
							rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '2'}"></p:inputText>
					</h:panelGroup>
				</p:column>

				<p:column>
					<h:outputText value="Verification Date"></h:outputText>
				</p:column>
				<p:column width="20%">
					<p:inputText value="#{approvalBackingBean.managedBean.verifyDate}"></p:inputText>
					
					</p:column>
				
				
            
       </p:row>


			<p:row>
				<p:column>
					<h:outputText value="Action"></h:outputText>
				</p:column>
				<p:column width="20%">
					<p:selectOneMenu
						value="#{approvalBackingBean.managedBean.scQtApproval.verifyAction}">
						<f:selectItem itemLabel="approve" itemValue="1" />
						<f:selectItem itemLabel="reject" itemValue="2" />
						<f:selectItem itemLabel="revise" itemValue="2" />
					</p:selectOneMenu>
				</p:column>

				<p:column>
					<h:outputText value="Remarks"></h:outputText>
				</p:column>
				<p:column width="20%">
					<p:inputTextarea rows="3"
						value="#{approvalBackingBean.managedBean.scQtApproval.verifierRemark}"></p:inputTextarea>
				</p:column>
			</p:row>

		</p:panelGrid>

	</p:panel>

</ui:composition>
