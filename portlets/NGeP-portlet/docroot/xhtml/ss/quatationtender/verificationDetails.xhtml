<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Verification Details Section" toggleable="true">

		
		<h:panelGrid columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">

			<h:outputLabel value="Option Of Verification"></h:outputLabel>

			<p:selectOneRadio
				value="#{approvalCategory.scQtApproval.verifyOption}">
				<f:selectItem itemLabel="Online" itemValue="1" />
				<f:selectItem itemLabel="Offline" itemValue="2" />
				<p:ajax event="change"
					listener="#{approvalBackingBean.processChecked}"
					update="sample,sample1,sample2" />
				<!--  <p:ajax update="@form"   />  -->
			</p:selectOneRadio>
		   <h:outputLabel></h:outputLabel>
		     <h:outputLabel></h:outputLabel>
			<h:outputLabel value="Verifier Name"></h:outputLabel>

			<h:panelGroup id="sample">
				<p:selectOneMenu
					value="#{approvalCategory.scQtApproval.verifierUserId}"
					rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '1'}">
					<f:selectItem itemLabel="verifier Name" itemValue="1" />
					<f:selectItem itemLabel="Roslan" itemValue="2" />
					<f:selectItem itemLabel="Hanib" itemValue="3" />
				</p:selectOneMenu>

				<p:inputText
					value="#{approvalCategory.scQtApproval.verifierUserId}"
					rendered="#{approvalBackingBean.managedBean.selectedBoolean1 eq '2'}"></p:inputText>
			</h:panelGroup>

			<h:outputLabel value="Verification Date"></h:outputLabel>

			<p:calendar
				value="#{approvalCategory.scQtApproval.verificationDate}"
				showOn="button"></p:calendar>






			<h:outputLabel value="Action"></h:outputLabel>

			<p:selectOneMenu
				value="#{approvalCategory.scQtApproval.verifyAction}">
				<f:selectItem itemLabel="approve" itemValue="1" />
				<f:selectItem itemLabel="reject" itemValue="2" />
				<f:selectItem itemLabel="revise" itemValue="2" />
			</p:selectOneMenu>

			<h:outputLabel value="Remarks"></h:outputLabel>

			<p:inputTextarea rows="3" cols="50" autoResize="false"
				value="#{approvalCategory.scQtApproval.verifierRemark}"></p:inputTextarea>


		</h:panelGrid>

	</p:panel>

</ui:composition>
