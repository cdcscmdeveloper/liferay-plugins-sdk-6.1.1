<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="Verification Details" toggleable="true">
<p:panelGrid style="width:100%;"
    styleClass="noBorders tr,noBorders td">
    <p:row>
     <p:column width="100%" style="text-align:right">
      <p:commandButton value="Submit"   style="float:right;" />
					<p:commandButton value="SendReminder" style="float:right;">
        </p:commandButton>
     </p:column>
     </p:row>
     </p:panelGrid>
<p:panelGrid style="width:40%;" styleClass="noBorders tr,noBorders td">
 <p:row >  
   <p:column >
    <p:outputLabel value="Option Of Verification"></p:outputLabel>
    </p:column >
          <p:column  width="20%">
           <p:selectOneRadio  value="searchQtnTenderBB.managedBean.selectedBoolean1">  
            <f:selectItem itemLabel="Online" itemValue="1" />  
            <f:selectItem itemLabel="Offline" itemValue="2" />  
               <p:ajax event="change"  listener="#{searchQtnTenderBB.processChecked}" update="sample,sample1,sample2"/>   
             <!--  <p:ajax update="@form"   />  --> 
        </p:selectOneRadio>
          </p:column>
          </p:row>	
          
          
          
           <p:row >  
   <p:column >
    <p:outputLabel value="Verifier Name"></p:outputLabel>
    </p:column>
          <p:column  width="20%">
          <h:panelGroup  id="sample"  >
          <p:selectOneMenu value="searchQtnTenderBB.managedBean.qtnTenders.planNumber"  rendered="#{searchQtnTenderBB.managedBean.selectedBoolean1 eq '1'}" > 
	<f:selectItem itemLabel="approve" itemValue="1" />   
	<f:selectItem itemLabel="reject" itemValue="2" />
	<f:selectItem itemLabel="revise" itemValue="2" />
	</p:selectOneMenu> 
	 
          <p:inputText  rendered="#{searchQtnTenderBB.managedBean.selectedBoolean1 eq '2'}"></p:inputText>
          </h:panelGroup>
          </p:column>
          </p:row>	
          
          
             
           <p:row >  
   <p:column >
    <p:outputLabel value="Status"></p:outputLabel>
    </p:column>
          <p:column  width="20%">
          <p:outputLabel value="ReadOnly"></p:outputLabel>
          </p:column>
          </p:row>	
          
          
               
           <p:row >  
   <p:column >
    <p:outputLabel value="Verification Date"></p:outputLabel>
    </p:column>
          <p:column  width="20%">
          <p:outputLabel value="10/09/2013 04:45"></p:outputLabel>
          </p:column>
          </p:row>	
          
                    
           <p:row >  
   <p:column >
    <p:outputLabel value="Action"></p:outputLabel>
    </p:column>
          <p:column  width="20%">
           <p:selectOneMenu value="searchQtnTenderBB.managedBean.qtnTenders.planNumber" > 
	<f:selectItem itemLabel="approve" itemValue="1" />   
	<f:selectItem itemLabel="reject" itemValue="2" />
	<f:selectItem itemLabel="revise" itemValue="2" />
	</p:selectOneMenu> 
          </p:column>
          </p:row>	
          
          
                 
           <p:row >  
   <p:column >
    <p:outputLabel value="Remarks"></p:outputLabel>
    </p:column>
          <p:column  width="20%">
         <p:inputTextarea rows="1"></p:inputTextarea>
          </p:column>
          </p:row>				

</p:panelGrid>

</p:panel>

	</ui:composition>
