<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
<p:panel >	
	<div>
		<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
			<p:commandButton  action="#{qTDetailBB.clonePopupAction}" value="CLONE" oncomplete="clonedlg.show();"
				style="float:right;margin-right: 12px;" />
			<ui:include src="/xhtml/ss/quatationtender/cloneqtntenderscreen.xhtml" />
		</c:if>
		<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
			<p:button value="Cancel" style="float:right;margin-right: 12px;" />
		</c:if>
		<p:commandButton value="Submit" style="float:right;margin-right: 12px;" action="#{qTDetailBB.submitQTDetailsAction}" process="@all" />
		<p:commandButton value="Save" style="float:right;margin-right: 12px;" action="#{qTDetailBB.saveQtDetailsAction}" process="@all"/>
		<br/>
		<br/>
	</div>
</p:panel>
</ui:composition>
