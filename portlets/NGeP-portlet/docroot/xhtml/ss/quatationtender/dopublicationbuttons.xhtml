<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<div align="right">

			<c:if test="#{qTDetailBB.managedBean.taskId eq null}">
				<c:if test="#{qTDetailBB.managedBean.qt.brandNew}">
					<p:commandButton action="#{qTDetailBB.clonePopupAction}"
						value="Clone" oncomplete="clonedlg.show();" icon="ui-icon-clone" update="cloneQTPopup" />
					<ui:include
						src="/xhtml/ss/quatationtender/cloneqtntenderscreen.xhtml" />
				</c:if>
				<c:if test="#{!qTDetailBB.managedBean.qt.brandNew}">
					<p:button value="Cancel" style="float:right;margin-right: 12px;" icon="ui-icon-cancel"  />
				</c:if>
				<p:commandButton value="Submit" 
					action="#{qTDetailBB.submitQTDetailsAction}" process="@all" icon="ui-icon-submit" />
				<p:commandButton value="Save" 
					action="#{qTDetailBB.saveQtDetailsAction}" process="@all" icon="ui-icon-save"/>
				<br />
				<br />
			</c:if>
			<c:if
				test="#{((qTDetailBB.managedBean.processName != 'QuotationTender Creation' ) and (qTDetailBB.managedBean.taskId != null))}">
				<p:commandButton value="Submit" 
					action="#{qTDetailBB.updateBpmTask}" process="@all" icon="ui-icon-submit">

				</p:commandButton>
			</c:if>
		
		<table>
			<tr>
				<td align="right"><c:if
						test="#{qTDetailBB.managedBean.processName eq 'QuotationTender Creation'}">
						<c:forEach items="#{qTDetailBB.managedBean.outComes}"
						var="action">

						<c:if test="${action == 'SUBMIT'}">
							<ui:param name="iconVar" value="ui-icon-submit" />

						</c:if>

						<c:if test="${action == 'REJECT'}">
							<ui:param name="iconVar" value="ui-icon-reject" />

						</c:if>
						<c:if test="${action == 'REVISE'}">
							<ui:param name="iconVar" value="ui-icon-revise" />

						</c:if>
						<c:if test="${action == 'APPROVE'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
						<c:if test="${action == 'ACCEPT'}">
							<ui:param name="iconVar" value="ui-icon-approve" />

						</c:if>
							<p:commandButton value="#{action}" process="@all"
								styleClass="ui-button" icon="#{iconVar}"
								actionListener="#{qTDetailBB.updateBpmTask(action)}" />
						</c:forEach>


					</c:if></td>
			</tr>
		</table>
		</div>
	</p:panel>
</ui:composition>
