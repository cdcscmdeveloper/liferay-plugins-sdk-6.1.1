<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="Search Quotation/Tender Screen" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			
			<h:outputLabel for="qtnno" value="#{lbl['lbl.so.qtnno']}" />
			<p:inputText id="qtnno" value="#{qTDetailBB.managedBean.qtnTenderSearchBean.qtNo}" />

			<h:outputLabel value="#{lbl['lbl.so.procmode']}" />
			<p:selectOneMenu value="#{qTDetailBB.managedBean.qtnTenderSearchBean.procurementMode}">
				<f:selectItems value="#{qTDetailBB.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
			</p:selectOneMenu>

			<h:outputLabel value="#{lbl['lbl.so.creatdtfrom']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromCreatedDate}"
				id="crdateFrm" showOn="button" />

			<h:outputLabel value="#{lbl['lbl.so.creatdtto']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toCreatedDate}"
				id="crdateTo" showOn="button" />

			<h:outputLabel value="#{lbl['lbl.so.pbldtfrom']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromPublishDate}"
				id="pbdateFrom" showOn="button" />

			<h:outputLabel value="#{lbl['lbl.so.pbldtto']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toPublishDate}"
				id="pbdateTo" showOn="button" />

			<h:outputLabel value="#{lbl['lbl.so.clsdtfrom']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qtnTenderSearchBean.fromClosingDate}"
				id="cldateFrom" showOn="button" />

			<h:outputLabel value="#{lbl['lbl.so.clsdtto']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qtnTenderSearchBean.toClosingDate}"
				id="cldateTo" showOn="button" />

			<h:outputLabel value="#{lbl['lbl.so.status']}" />
			<p:selectOneMenu
				value="#{qTDetailBB.managedBean.qtnTenderSearchBean.qtStatus}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Option 1" itemValue="" />
				<f:selectItem itemLabel="Option 2" itemValue="" />
				<f:selectItem itemLabel="Option 3" itemValue="" />
			</p:selectOneMenu>
		</h:panelGrid>

		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			style="float:right;" action="#{qTDetailBB.searchQTAction}"
			update="searchQTs">


		</p:commandButton>
		
		<br />
		<br />
	</p:panel>

	<p:panel header="Qtn/Tender List" toggleable="true">
		<h:panelGroup id="table-wrapper" style="width:100%;">
			<p:dataTable id="searchQTs" value="#{qTDetailBB.managedBean.qtList}"
				var="scQt" resizableColumns="true" rowIndexVar="index">
				
				<ac:paginator for="searchQTs" />

				<p:column headerText="#{lbl['lbl.so.no']}" style="width:20px;">
					<h:outputText value="#{index + 1}" />
				</p:column>

				<p:column headerText="Qtn/Tender No" style="width:100px;">
					<p:commandLink action="#{qTDetailBB.editAction(scQt)}"
						style="margin-right:20px;">
						<h:outputText value="#{scQt.qtNo}" />
					</p:commandLink>


				</p:column>

				<p:column headerText="#{lbl['lbl.so.title']}">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.procmode']}" style="width:100px;">
					<h:outputText value="#{scQt.procurementMode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.crtdt']}" style="width:120px;">
					<h:outputText value="#{scQt.createdDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.pbdt']}" style="width:120px;">
					<h:outputText value="#{scQt.publishDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.clsdt']}" style="width:120px;">
					<h:outputText value="#{scQt.closingDate}" />
				</p:column>

			</p:dataTable>
		</h:panelGroup>

		<p:commandButton value="#{lbl['lbl.so.qtmscreen']}"
			style="float:right;"
			action="#{qTDetailBB.newAction}">

		</p:commandButton>

		<br />
		<br />
	</p:panel>
</ui:composition>
