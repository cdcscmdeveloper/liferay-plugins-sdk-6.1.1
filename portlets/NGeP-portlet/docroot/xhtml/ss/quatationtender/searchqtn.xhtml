<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="Search Quotation/Tender Screen" toggleable="true">


		<p:panelGrid columns="4" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<h:outputLabel for="qtnno" value="#{lbl['lbl.so.qtnno']}" />
			<p:inputText id="qtnno" value="#{qTDetailBB.managedBean.qt.qtNo}" />

			<h:outputText value="#{lbl['lbl.so.procmode']}" />
			<p:selectOneMenu value="#{qTDetailBB.managedBean.qt.procurementMode}">
				<f:selectItems
					value="#{qTDetailBB.managedBean.procurementModeItems}" />
			</p:selectOneMenu>

			<h:outputText value="#{lbl['lbl.so.creatdtfrom']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qt.createDateFrom}"
				id="crdateFrm" showOn="button" />

			<h:outputText value="#{lbl['lbl.so.creatdtto']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qt.createdDateTo}"
				id="crdateTo" showOn="button" />

			<h:outputText value="#{lbl['lbl.so.pbldtfrom']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qt.pubDateFrom}"
				id="pbdateFrom" showOn="button" />

			<h:outputText value="#{lbl['lbl.so.pbldtto']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qt.pubDateTo}"
				id="pbdateTo" showOn="button" />

			<h:outputText value="#{lbl['lbl.so.clsdtfrom']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qt.clsDateFrom}"
				id="cldateFrom" showOn="button" />

			<h:outputText value="#{lbl['lbl.so.clsdtto']}" />
			<p:calendar value="#{qTDetailBB.managedBean.qt.clsDateTo}"
				id="cldateTo" showOn="button" />

			<h:outputText value="#{lbl['lbl.so.status']}" />
			<p:selectOneMenu
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Option 1" itemValue="" />
				<f:selectItem itemLabel="Option 2" itemValue="" />
				<f:selectItem itemLabel="Option 3" itemValue="" />
			</p:selectOneMenu>


		</p:panelGrid>

		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			style="float:right;" action="#{qTDetailBB.searchQT}"
			update="searchQTs">


		</p:commandButton>

		<br />
		<br />
		<br />

	</p:panel>


	<p:panel header="Qtn/Tender List" toggleable="true">
		<h:panelGroup id="table-wrapper" style="width:100%;">
			<p:dataTable id="searchQTs" value="#{qTDetailBB.managedBean.qtList}"
				var="tenders" resizableColumns="true" rowIndexVar="index">

				<p:column headerText="#{lbl['lbl.so.no']}">
					<h:outputText value="#{index + 1}" />
				</p:column>

				<p:column headerText="Qtn/Tender No">
					<p:commandLink action="#{qTDetailBB.showMaintanceQT(tenders.qtId)}"
						style="margin-right:20px;" ajax="false">
						<h:outputText value="#{tenders.qtNo}" />
					</p:commandLink>


				</p:column>

				<p:column headerText="#{lbl['lbl.so.title']}">
					<h:outputText value="#{tenders.qtTitle}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.so.procmode']}">
					<h:outputText value="#{tenders.procurementMode}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.crtdt']}">
					<h:outputText value="#{tenders.createdDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.pbdt']}">
					<h:outputText value="#{tenders.publishDate}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.so.clsdt']}">
					<h:outputText value="#{tenders.closingDate}" />
				</p:column>

			</p:dataTable>
		</h:panelGroup>

		<p:commandButton value="#{lbl['lbl.so.qtmscreen']}"
			style="float:right;"
			action="quatationtendercreation?faces-redirect=true">

		</p:commandButton>

		<br />
		<br />
	</p:panel>
</ui:composition>
