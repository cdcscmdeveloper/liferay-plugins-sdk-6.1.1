<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="Approval Details" toggleable="true">
<p:panelGrid style="width:100%;"
    styleClass="noBorders tr,noBorders td">
    <p:row>
     <p:column width="100%" style="text-align:right">
      <p:commandButton value="Submit"   style="float:right;" />
					<p:commandButton value="SendReminder" style="float:right;">
        </p:commandButton>
     </p:column>
     </p:row>
     </p:panelGrid>
     

<p:panelGrid  styleClass="noBorders tr,noBorders td">
 <p:row >  
   <p:column >
    <p:outputLabel value="Approver Name"></p:outputLabel>
    </p:column>
           <p:column>
             <h:panelGroup  id="sample1"  >
         <c:if test="${searchQtnTenderBB.managedBean.selectedBoolean1 eq '1'}">
          <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectedBoolean1}"   > 
	<f:selectItem itemLabel="approve" itemValue="1" />   
	<f:selectItem itemLabel="reject" itemValue="2" />
	<f:selectItem itemLabel="revise" itemValue="2" />
	</p:selectOneMenu> 
	</c:if>
	  <c:if test="${searchQtnTenderBB.managedBean.selectedBoolean1 eq '2'}">
          <p:inputText value="#{searchQtnTenderBB.managedBean.selectedBoolean1}" ></p:inputText>
          </c:if>
          </h:panelGroup>
          </p:column>
          </p:row>	
          
          
             
           <p:row >  
   <p:column >
    <p:outputLabel value="Status"></p:outputLabel>
    </p:column>
          <p:column>
          <p:outputLabel value="ReadOnly"></p:outputLabel>
          </p:column>
          </p:row>	
          
          
               
           <p:row >  
   <p:column >
    <p:outputLabel value="Approver Date"></p:outputLabel>
    </p:column>
          <p:column>
          <p:outputLabel value="10/09/2013 04:45"></p:outputLabel>
          </p:column>
          </p:row>	
          
                    
           <p:row >  
   <p:column >
    <p:outputLabel value="Action"></p:outputLabel>
    </p:column>
          <p:column>
             <h:panelGroup  id="checkboxBPK"  >
               <c:choose>
               
         <c:when test="${searchQtnTenderBB.managedBean.checkBoxBPK eq 'Restricted'}">
          <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectedBoolean1}"   > 
	<f:selectItem itemLabel="approve" itemValue="1" />   
	<f:selectItem itemLabel="reject" itemValue="2" />
	<f:selectItem itemLabel="revise" itemValue="2" />
		<f:selectItem itemLabel="restrict" itemValue="2" />
	</p:selectOneMenu> 
	</c:when>
	  <c:when test="${searchQtnTenderBB.managedBean.checkBoxBPK eq 'Direct'}">
         <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectedBoolean1}"   > 
	<f:selectItem itemLabel="approve" itemValue="1" />   
	<f:selectItem itemLabel="reject" itemValue="2" />
	<f:selectItem itemLabel="revise" itemValue="2" />
	<f:selectItem itemLabel="direct" itemValue="2" />
	</p:selectOneMenu> 
          </c:when>
          
          <c:otherwise>
           <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectOption}" > 
	<f:selectItem itemLabel="Approver" itemValue="1" />   
	<f:selectItem itemLabel="Reject" itemValue="2" />
	<f:selectItem itemLabel="Revise" itemValue="2" />
	</p:selectOneMenu> 
	</c:otherwise>
	</c:choose>
	</h:panelGroup>
          </p:column>
          </p:row>	
          
          
                 
           <p:row >  
   <p:column >
    <p:outputLabel value="Remarks"></p:outputLabel>
    </p:column>
          <p:column>
      <p:inputText></p:inputText>
          </p:column>
          </p:row>				

</p:panelGrid>

</p:panel>

	</ui:composition>
