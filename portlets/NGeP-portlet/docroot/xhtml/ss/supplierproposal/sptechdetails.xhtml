<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/ss/supplierproposal/spheader.xhtml" />
	<p:panel header="#{lbl['lbl.sc.sp.techpplcheklist']}" toggleable="true">
		<p:dataTable id="techDeails" var="techList"
			value="#{sPDetailBackingBean.managedBean.tecCheckDetailsList}" rows="10"
			selection="#{sPDetailBackingBean.managedBean.selectedCheckDetails}"
			rowKey="#{techList.qtProposalChecklistId}" rowIndexVar="rowIndex">

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.sc.sp.desc']}" style="width:68%">
				<h:outputText value="#{techList.scQtCheckList.title}" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.upload']}" style="width:15%">
				<p:commandLink oncomplete="uploadDlg.show();return false;"
					update="techDeails">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{techList}"
						target="#{sPDetailBackingBean.managedBean.qtProposalChecklist}" />
				</p:commandLink>
				<p:spacer width="10" height="5" />
				<p:commandLink ajax="false"
					action="#{sPDetailBackingBean.downloadSPFile(techList)}">
					<h:outputText
						value="#{techList.scQtProposalChecklistAttachment.fileName}"
						rendered="#{!empty techList.scQtProposalChecklistAttachment}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.download']}" style="width:10%">
				<p:commandLink action="#{sPDetailBackingBean.downloadPTJFile(techList)}"
					update="techDeails">
					<p:graphicImage library="ep/images/design" name="download.png"
						value="/resources/ep/images/design/download.png"
						rendered="#{!empty techList.scQtCheckList.scQtCheckListAttachment}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.online']}" style="width:10%">
				<p:commandButton value="Online"
					action="#{sPDetailBackingBean.onlineAction(techList)}"
					oncomplete="popupDetails.show()"
					rendered="#{techList.scQtCheckList.checklistType == 'TS'}" update=":form:popupDetails"/>
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.sp.termconds']}" toggleable="true">
		<p:inputTextarea rows="5" cols="140" autoResize="false" value="ABC"
			disabled="true"></p:inputTextarea>
		<p:spacer width="5" height="15" />
		<h:selectBooleanCheckbox value="#{sPDetailBackingBean.managedBean.checkStatus}" style="margin-right: 5px;"/> I have read and agree with the Terms and Condition
	</p:panel>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{sPDetailBackingBean.handleFileUpload}" mode="advanced"
			id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="techDeails" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>

</ui:composition>
