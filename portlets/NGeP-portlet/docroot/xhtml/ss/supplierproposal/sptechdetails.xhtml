<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/ss/supplierproposal/spheader.xhtml" />
	<p:panel header="#{lbl['lbl.sc.sp.techpplcheklist']}" toggleable="true">
		<p:dataTable id="techDeails" var="techList"
			value="#{sPDetailBB.managedBean.tecCheckDetailsList}" rows="10"
			selection="#{sPDetailBB.managedBean.selectedCheckDetails}"
			rowKey="#{techList.qtProposalChecklistId}" rowIndexVar="rowIndex">

			<p:column selectionMode="multiple" style="width:2%" />
			<p:column headerText="#{lbl['lbl.sc.sp.desc']}" style="width:68%">
				<h:outputText value="#{techList.scQtCheckList.title}" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.sp.upload']}" style="width:10%">
				<p:commandLink oncomplete="uploadDlg.show();return false;"
					update="techDeails">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{techList}"
						target="#{sPDetailBB.managedBean.qtProposalChecklist}" />
				</p:commandLink>

				<p:commandLink
					action="#{sPDetailBB.downloadFile(techList)}">
					<h:outputText
						value="#{techList.scQtProposalChecklistAttachment.fileName}"
						rendered="#{!empty techList.scQtProposalChecklistAttachment}" />
				</p:commandLink>


			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.download']}" style="width:10%">
				<p:commandLink action="#{sPDetailBB.downloadFile(techList)}"
					update="techDeails">
					<p:graphicImage library="ep/images/design" name="download.png"
						value="/resources/ep/images/design/download.png" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.sp.online']}" style="width:10%">
				<p:commandButton value="Online"
					action="#{sPDetailBB.newAction(techList)}"
					oncomplete="popupDetails.show()" />
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.sp.termconds']}" toggleable="true">
		<p:inputTextarea rows="5" cols="140" autoResize="false" value="ABC"
			disabled="true"></p:inputTextarea>
		<p:selectManyCheckbox
			value="#{approvalBackingBean.managedBean.approvalTypelist}"
			layout="pageDirection">
			<f:selectItem
				itemLabel=" I have read and agree with the Terms and Condition"
				itemValue="I have read and agree with the Terms and Condition" />
		</p:selectManyCheckbox>
	</p:panel>

	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="false"
		resizable="false" width="700px" height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{sPDetailBB.handleFileUpload}" mode="advanced"
			id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="messages, techDeails">
		</p:fileUpload>
		<p:growl id="messages" showDetail="true" />
	</p:dialog>

	<p:dialog id="attendancebyCompId" widgetVar="popupDetails"
		modal="false" resizable="false" header="SPECIFICATION CONTENT DETAILS"
		width="950" height="550" hideEffect="true">
		<p:ajax event="close" />
		<ui:include src="/xhtml/tpl/spec/specContent.xhtml" />
	</p:dialog>

</ui:composition>
