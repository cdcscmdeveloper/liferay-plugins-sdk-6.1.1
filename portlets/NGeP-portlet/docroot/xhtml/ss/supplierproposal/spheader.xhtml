<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Header" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.sp.qtno']}" />
			</h:column>
			<h:column>
				<p:inputText  value="#{sPDetailBackingBean.managedBean.qtProposal.scQtSupplier.scQt.qtNo}" disabled="true"/>
			</h:column>
			<h:column />
			<h:column />
            <h:column>
            	<h:outputLabel value="#{lbl['lbl.sc.sp.suppno']}" />  
            </h:column>
            <h:column>
            	<p:inputText  value="#{sPDetailBackingBean.managedBean.qtProposal.supplierNo}" disabled="true" />  
            </h:column>
            <h:column>
             	<h:outputLabel value="#{lbl['lbl.sc.sp.pplno']}" />
            </h:column>
            <h:column>
            	<p:inputText  value="#{sPDetailBackingBean.managedBean.qtProposal.proposalNo}" disabled="true" />
           	</h:column>
  		</h:panelGrid>
  		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.sp.title']}" />
			</h:column>
			<h:column>
				<p:inputText value="#{sPDetailBackingBean.managedBean.qtProposal.scQtSupplier.scQt.qtTitle}" size="93" disabled="true" />
			</h:column>
		</h:panelGrid>
	</p:panel>
</ui:composition>
