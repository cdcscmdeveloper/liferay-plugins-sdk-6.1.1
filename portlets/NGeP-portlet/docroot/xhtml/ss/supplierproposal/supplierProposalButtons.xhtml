<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="Save"
						action="#{sPDetailBackingBean.saveSPDetailsAction}" process="@all" />

					<ui:repeat var="action"
						value="#{sPDetailBackingBean.managedBean.outComes}">

						<ui:fragment rendred="#{action eq 'SUBMIT'}">
							<c:set var="iconVar" value="ui-icon-submit" scope="request"></c:set>
						</ui:fragment>
						<ui:fragment rendred="#{action eq 'REJECT'}">
							<c:set var="iconVar" value="ui-icon-reject" scope="request"></c:set>
						</ui:fragment>
						<ui:fragment rendred="#{action eq 'REVISE'}">
							<c:set var="iconVar" value="ui-icon-revise" scope="request"></c:set>
						</ui:fragment>
						<ui:fragment rendred="#{action eq 'APPROVE'}">
							<c:set var="iconVar" value="ui-icon-save" scope="request"></c:set>
						</ui:fragment>

						<p:commandButton value="#{action}" process="@all"
							styleClass="ui-button"
							actionListener="#{sPDetailBackingBean.updateBpmTask(action)}" icon="#{iconVar}"/>
					</ui:repeat>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
</ui:composition>
