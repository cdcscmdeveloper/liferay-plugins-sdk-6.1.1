<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
    <p:panel header="Search Procurement" toggleable="true">
	
	<p:panelGrid columns="2" style="width:25%;" styleClass="noBorders tr,noBorders td">
	
	<h:outputText value="Plan Number:"></h:outputText>
	<h:inputText value="#{procureCodeManagedBean.plannumber}"></h:inputText>
	
	<h:outputText value="Procurement Mode:"></h:outputText>

	 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectOption}" style="width:80%;">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Mode 1" itemValue="1" />  
            <f:selectItem itemLabel="Mode 2" itemValue="2" />  
            <f:selectItem itemLabel="Mode 3" itemValue="3" /> 
        </p:selectOneMenu>
        
	<h:outputText value="Plan Status:"></h:outputText>

	 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.selectOption}" style="width:80%;">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Status 1" itemValue="1" />  
            <f:selectItem itemLabel="Status 2" itemValue="2" /> 
            <f:selectItem itemLabel="Status 3" itemValue="3" />  
     </p:selectOneMenu>            
	

	</p:panelGrid>
	
	<p:commandButton value="SEARCH" style="float:right;">
    
</p:commandButton>
	<br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable value="#{procureMB.procurementPlanList}" var="procurementObj" id="procureList" resizableColumns="true" editable="true">
        
   <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />  
  
        <p:column headerText="Planned Number" style="width:12%">  
           <p:outputLabel value="#{procurementObj.planNo}"></p:outputLabel>
        </p:column>
          
        <p:column headerText="Plan Description" style="width:20%">  
           <p:outputLabel value="#{procurementObj.planDesc}"></p:outputLabel>
        </p:column>  
  
        <p:column headerText="Procurement Mode" style="width:17%">  
           <p:outputLabel value="#{procurementObj.ppPlanMaster.procurementMode}"></p:outputLabel>			   
        </p:column>  
  
        <p:column headerText="Planned Amount" style="width:15%">  
           <p:outputLabel value="#{procurementObj.actualAmount}"></p:outputLabel>    
        </p:column>  
  		
  		<p:column headerText="Purchase Request Date" style="width:22%">  
           <p:outputLabel id="arr_date" value="#{procurementObj.createdDate}" /> 	 
        </p:column>
        
        <p:column headerText="Notification Date" style="width:25%">  
		   <p:calendar value="#{calendarBean.date3}" id="popupButtonCal" showOn="button" /> 	
        </p:column> 

        <p:column headerText="Notification Days" style="width:15%">  
           <p:outputLabel value="#{procurementObj.notificationDays}"></p:outputLabel>
        </p:column> 
        
        <p:column headerText="Plan Status" style="width:15%">  
        	<!-- p:outputLabel value="#{procurementObj.statusCode}"></p:outputLabel	-->   
        </p:column> 
        	
       <p:column headerText="Action" style="width:6%">  
            <p:rowEditor />  
            <p:commandLink value="createBPMTask" actionListener="#{procurementListBackingBean.createBPMTask(procurementObj)}" 
            	rendered="true" update="procureList" process="@this">
            	<h:outputText value="create" /> 
            </p:commandLink>
        </p:column> 
        
    </p:dataTable>
</p:panel>

</ui:composition>
