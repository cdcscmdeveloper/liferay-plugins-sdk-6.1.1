<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
    <p:panel header="Search Procurement" toggleable="true">
	
	<h:panelGrid columns="2" style="width:25%;" styleClass="noBorders tr,noBorders td">
	
	<h:outputLabel value="Plan Number:"></h:outputLabel>
	<h:inputText value="#{procurementListBackingBean.managedBean.planSearchBean.planNo}"></h:inputText>
	
	<h:outputLabel value="Procurement Mode:"></h:outputLabel>

	 <p:selectOneMenu value="#{procurementListBackingBean.managedBean.planSearchBean.procurementMode}" style="width:80%;">  
           <f:selectItems value="#{procurementListBackingBean.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
		
        </p:selectOneMenu>
        
	<h:outputLabel value="Plan Status:"></h:outputLabel>

	 <p:selectOneMenu value="#{procurementListBackingBean.managedBean.planSearchBean.status}" style="width:80%;">  
         <f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Option 1" itemValue="" />
				<f:selectItem itemLabel="Option 2" itemValue="" />
				<f:selectItem itemLabel="Option 3" itemValue="" />
     </p:selectOneMenu>            
	

	</h:panelGrid>
	
	<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			style="float:right;" action="#{procurementListBackingBean.retriveProcuremntPlanDtls}"
			update="procureList">

		</p:commandButton>
    

	<br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable value="#{procurementListBackingBean.managedBean.procurementPlanList}" var="procurementObj" id="procureList" resizableColumns="true" editable="true">
        
   <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />  
  
        <p:column headerText="Planned Number" style="width:15%">  
           <p:outputLabel value="#{procurementObj.planNo}"></p:outputLabel>
        </p:column>
          
        <p:column headerText="Plan Description" style="width:20%">  
           <p:outputLabel value="#{procurementObj.planDesc}"></p:outputLabel>
        </p:column>  
  
        <p:column headerText="Procurement Mode" style="width:17%">  
           <p:outputLabel value="#{procurementObj.ppPlanMaster.procurementMode}"></p:outputLabel>			   
        </p:column>  
  
        <p:column headerText="Planned Amount" style="width:15%">  
           <p:outputLabel value="#{procurementObj.actualAmount}"></p:outputLabel>    
        </p:column>  
  		
  		<p:column headerText="Purchase Request Date" style="width:22%">  
           <p:outputLabel id="arr_date" value="#{procurementObj.createdDate}" /> 	 
        </p:column>
        
       
        <p:column headerText="Notification Days" style="width:15%">  
           <p:outputLabel value="#{procurementObj.notificationDays}"></p:outputLabel>
        </p:column> 
        
        <p:column headerText="Plan Status" style="width:15%">  
        	 
        </p:column> 
        	
       <p:column headerText="Action" style="width:6%">  
            <p:rowEditor />  
            <p:commandLink value="createBPMTask" action="#{procurementListBackingBean.initiateBPMTask(procurementObj)}" 
            	rendered="true" update="procureList" process="@this">
            	<h:outputLabel value="create" /> 
            </p:commandLink>
        </p:column> 
        
    </p:dataTable>
</p:panel>

</ui:composition>
