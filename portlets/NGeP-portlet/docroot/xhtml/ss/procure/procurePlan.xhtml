<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions">

	<p:panel header="Search Procurement" toggleable="true">
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:25%">
					<p:outputLabel value="Plan Number:"></p:outputLabel>
				</p:column>
				<p:column>
					<p:inputText value="#{procurementListBackingBean.managedBean.planSearchBean.planNo}"></p:inputText>
				</p:column>
			</p:row>
			<p:row>
				<p:column style="width:25%">
					<p:outputLabel value="Procurement Mode:"></p:outputLabel>
				</p:column>
				<p:column>
					<p:selectOneMenu
						value="#{procurementListBackingBean.managedBean.planSearchBean.procurementMode}">
						<f:selectItems
							value="#{procurementListBackingBean.getDropdownCodeValues(PmCodeCatConst.scProcurementMode)}" />
		
					</p:selectOneMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Plan Status:"></p:outputLabel>
				</p:column>
				<p:column>
					<p:selectOneMenu
						value="#{procurementListBackingBean.managedBean.planSearchBean.status}">
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItem itemLabel="Option 1" itemValue="" />
						<f:selectItem itemLabel="Option 2" itemValue="" />
						<f:selectItem itemLabel="Option 3" itemValue="" />
					</p:selectOneMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column colspan="2">
					<p:commandButton value="#{lbl['lbl.so.searchbtn']}" style="float:right;"
						action="#{procurementListBackingBean.retriveProcuremntPlanDtls}"
						update="procureList" icon="search-icon" />
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
	<p:panel header="Results" toggleable="true" style="width:100%">
		<p:dataTable paginator="true" rows="20" paginatorPosition="bottom" width="100%" cellpadding="1"
			value="#{procurementListBackingBean.managedBean.procurementPlanList}"
			var="procurementObj" id="procureList" editable="true">

			<p:ajax event="rowEdit" />
			<p:ajax event="rowEditCancel" />

			<p:column headerText="Planned No." style="width:15%">
				<p:outputLabel value="#{procurementObj.planNo}"></p:outputLabel>
			</p:column>

			<p:column headerText="Plan Description" style="width:20%">
				<p:outputLabel value="#{procurementObj.planDesc}"></p:outputLabel>
			</p:column>

			<p:column headerText="Procurement Mode" style="width:17%">
				<p:outputLabel
					value="#{procurementObj.ppPlanMaster.procurementMode}"></p:outputLabel>
			</p:column>

			<p:column headerText="Planned Amount" style="width:15%">
				<p:outputLabel value="#{procurementObj.actualAmount}"></p:outputLabel>
			</p:column>

			<p:column headerText="Purchase Request Date" style="width:22%">
				<h:outputText value="#{procurementObj.createdDate}">
					<f:convertDateTime pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"/>
				</h:outputText>
			</p:column>


			<p:column headerText="Notification Days" style="width:15%">
				<p:outputLabel value="#{procurementObj.notificationDays}"></p:outputLabel>
			</p:column>

			<p:column headerText="Plan Status" style="width:15%">

			</p:column>

			<p:column headerText="Action" style="width:6%">
				<p:graphicImage value="/resources/ep/images/design/edit.png"></p:graphicImage>
				<p:commandLink value="createBPMTask"
					action="#{procurementListBackingBean.initiateBPMTask(procurementObj)}"
					rendered="true" update="procureList" process="@this">
					<h:outputLabel value="create" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
