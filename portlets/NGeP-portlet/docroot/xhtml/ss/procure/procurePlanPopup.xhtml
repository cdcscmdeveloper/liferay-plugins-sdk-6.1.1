<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:dialog id="planInforDialog" widgetVar="procurePlanPopup" modal="true" width="750" height="400">
		
	<p:panel header="PLANNED INFO" toggleable="true" id="mainPanel">
		<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:100%">
			<p:row>
				<p:column><p:outputLabel value="Plan Number"/></p:column>
				<p:column>
					<p:inputText readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.planNo}"/>
				</p:column>
			</p:row>
			<p:row>
				<p:column><p:outputLabel value="VOT Type"/></p:column>
				<p:column ><p:inputText  value="#{procurementListBackingBean.managedBean.currentPlan.planNo}"/ disabled="true"></p:column>
			</p:row>
			<p:row>
				<p:column><p:outputLabel value="Tot. Est. Amount (RM)"/></p:column>
				<p:column >
					<p:inputText readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.estimatedAmt}"/>
				</p:column>
			</p:row>
			<p:row>
				<p:column><p:outputLabel value="Product Family"/></p:column>
				<p:column>
					<p:inputText readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.cmUnspscFamily.unspscCode}"/>
				</p:column>
				
				<p:column>
					<p:outputLabel value="Product Commodity"/>
				</p:column>
				<p:column>
					<p:inputText readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.cmUnspscFamily.actualEndDate}"/>
				</p:column>
			</p:row>
			
			<p:row>
				<p:column><p:outputLabel value="Activity Start Date"/></p:column>
				<p:column>
					<p:inputText readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.cmUnspscFamily.actualStartDate}"/>
				</p:column>
				<p:column>
					<p:outputLabel value="Activity End Date"/>
				</p:column>
				<p:column>
					<p:inputText readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.cmUnspscFamily.actualEndDate}"/>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Plan Desc."/>
				</p:column>
			 <p:column colspan="3">
					<p:inputTextarea style="width:90%;" readonly="true" value="#{procurementListBackingBean.managedBean.currentPlan.planDesc}" />
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Notification Date"/>
				</p:column>
				<p:column>
					<p:inputText id="popupNotificationDate" value="#{procurementListBackingBean.managedBean.currentPlan.notificationDays}" />
				</p:column>
			</p:row>
	   </p:panelGrid>
		<p:spacer width="20px"/>
		 <p:panelGrid style="width:100%;"
			 styleClass="noBorders tr,noBorders td">
			  <p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton process="@this, popupNotificationDate" value="Ok" action="#{procurementListBackingBean.updatePlannedInfo}"
						oncomplete="procurePlanPopup.hide();" partialSubmit="true"  update="procurementPlanList"
						icon="ui-icon-ok" />
					<p:commandButton value="Cancel" onclick="procurePlanPopup.hide()" icon="ui-icon-close" />
				</p:column>
			  </p:row>
		 </p:panelGrid>
		
			
    </p:panel>
	</p:dialog>
</ui:composition>
