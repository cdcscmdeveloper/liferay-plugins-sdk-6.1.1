<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="scQt" value="#{sfBackingBean.managedBean.scQt}" />	
	<!-- <ui:include src="/xhtml/ss/common/commonHeader.xhtml" /> -->
		
	<ui:include
		src="/xhtml/ss/supplierFinalization/supplierFinalizationZonePopUp.xhtml" />
	<p:panel header="Summary" toggleable="true">
		<table style="width: 100%">
			<tr>
				<td style="width: 45px"><p:outputLabel
						value="ViewBy" /></td>
				<td><p:selectOneRadio value="#{sfBackingBean.managedBean.awardType}"
					rendered="true">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sf.by.package']}"
						itemValue="true" />
					<f:selectItem itemLabel="#{lbl['lbl.sc.sf.by.item']}"
						itemValue="false" />
					
					<p:ajax event="change" update="byItemPackage"
						listener="#{sfBackingBean.viewByEvent}" process="@this" />
				</p:selectOneRadio></td>
			</tr>
		</table>
		<h:panelGroup id="byItemPackage">

			<h:panelGroup id="bypackageId"
				rendered="#{sfBackingBean.managedBean.summaryByPackageStatus}">
				<ui:include
					src="/xhtml/ss/supplierFinalization/supplierFinalizationSummaryByPackage.xhtml" />
			</h:panelGroup>
			
			<h:panelGroup id="byitemId"
				rendered="#{sfBackingBean.managedBean.summaryByItemStatus}">
				<ui:include
					src="/xhtml/ss/supplierFinalization/supplierFinalizationSummaryByItem.xhtml" />
			</h:panelGroup>
			
		</h:panelGroup>
		

	</p:panel>
</ui:composition>
