
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGrid border="0" cellpadding="0" cellspacing="4" width="100%"
		columns="4"
		columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
		<h:column>
			<h:outputLabel value="#{lbl['lbl.sc.sf.options']}" />
		</h:column>
		<h:column>
			<p:selectOneRadio id="options"
				value="#{sfBackingBean.managedBean.optionType}">
				<f:selectItem itemLabel="#{lbl['lbl.sc.sf.basic']}"
					itemValue="Basic" />
				<f:selectItem itemLabel="#{lbl['lbl.sc.sf.multiple']}"
					itemValue="Multiple Items" />
				<f:selectItem itemLabel="#{lbl['lbl.sc.sf.by.supplier']}"
					itemValue="By Supplier" />
				<p:ajax event="change" update="byiteminfo"
					listener="#{sfBackingBean.optionsEvent}" process="@this" />
			</p:selectOneRadio>
		</h:column>

		<h:column>
			<p:outputLabel value="" />
		</h:column>
		<h:column>
			<p:outputLabel value="" />
		</h:column>
	</h:panelGrid>

	<h:panelGroup id="byiteminfo">
		<p:spacer height="30px" />
		<p:panel header="Item List">
			<p:dataTable id="itembyItemId" var="item"
				value="#{sfBackingBean.managedBean.itemSuppFinalizationlist}"
				rows="10"
				selection="#{sfBackingBean.managedBean.selectedItemsSuppFinalization}"
				rowKey="#{item.qtItemId}" rowIndexVar="rowIndex">
				<p:column selectionMode="#{sfBackingBean.managedBean.selectionMode}" style="width:2%" /> 
				
				<ac:paginator for="itembyItemId" />

				<p:column headerText="#{lbl['lbl.sc.sf.item']}">
					<h:outputText value="#{item.itemName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.uom']}">
					<h:outputText value="#{item.pmUom.uomName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.item.award.by']}">
					<h:column>
						<p:selectOneMenu value="#{sfBackingBean.managedBean.selectItem}">
							<f:selectItem itemLabel="Quantity" itemValue="1" />
							<f:selectItem itemLabel="Percentage" itemValue="2" />
						</p:selectOneMenu>
					</h:column>
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.tot.value']}">
					<h:outputText value="#{item.qty}" />
				</p:column>

			</p:dataTable>

			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td"
				rendered="#{sfBackingBean.managedBean.multipleItemSelection}">
				<p:row>
					<p:column width="100%" style="text-align:right">
						<p:commandButton value="#{lbl['lbl.sc.sf.search.supplier.btn']}"
							icon="ui-icon-search" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:panel>

		<!-- Shortlisted Supplier Listing  -->
		<p:panel
			rendered="#{sfBackingBean.managedBean.shortlistedSuppVisible}">
			<p:spacer height="20px" />
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="70%"
				columns="4" rendered="#{sfBackingBean.managedBean.basicSelection}">
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.supplier']}" />
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{sfBackingBean.managedBean.selectItem}">
						<f:selectItem itemLabel="suplier1" itemValue="1" />
						<f:selectItem itemLabel="suplier2" itemValue="2" />
					</p:selectOneMenu>
				</h:column>

				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.action']}" />
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{sfBackingBean.managedBean.selectItem}">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sf.recommended']}"
							itemValue="1" />
					</p:selectOneMenu>

					<p:commandButton value="#{lbl['lbl.sc.sf.ok']}"
						icon="ui-icon-accept" />
				</h:column>
			</h:panelGrid>

			<p:panel header="Shortlisted Supplier List">
				<p:dataTable id="selectedSuppId" var="shortlistedSupp"
					value="#{sfBackingBean.managedBean.shortlistedSuppList}" rows="10"
					rowKey="#{shortlistedSupp.qtProposalRankingId}"
					rowIndexVar="rowIndex">
					<ac:paginator for="selectedSuppId" />
					<p:column headerText="#{lbl['lbl.sc.sf.supplier.code']}">
						<p:commandLink update=":form:popupSuppDtl"
							action="#{sfBackingBean.showSupplierDetails}"
							oncomplete="suppDetails.show();">
							<f:setPropertyActionListener value="#{shortlistedSupp}"
								target="#{sfBackingBean.managedBean.scQtProposalRanking}" />
							<h:outputText value="#{shortlistedSupp.scQtProposalEvaluate.scQtProposal.supplierNo}" />
						</p:commandLink>
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.bumi.status']}">
						<h:outputText value="#{shortlistedSupp.qtProposalRankingId}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.total.score']}">
						<h:outputText value="#{shortlistedSupp.qtProposalRankingId}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.ranking']}">
						<h:outputText value="#{shortlistedSupp.qtProposalRankingId}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.cmtee.decision']}">
						<h:selectBooleanCheckbox value="#{shortlistedSupp.scQtProposalEvaluate.shortListed}" />
					</p:column>
				</p:dataTable>
				<p:spacer height="20px" />

				<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
					columns="2" columnClasses="columnWidth20,columnWidth30">
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.sf.total.selected.supplier']}"></p:outputLabel>
					</p:column>

					<p:column>
						<p:inputText
							value="#{sfBackingBean.managedBean.totalSelectedSupplier}"
							readonly="true" size="10" />
					</p:column>
				</h:panelGrid>

			</p:panel>
		</p:panel>

		<!-- Recommended Supplier Listing  -->
		<p:panel
			rendered="#{sfBackingBean.managedBean.recommendedSuppVisible}">
			<p:spacer height="20px" />
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="70%"
				columns="4" rendered="#{sfBackingBean.managedBean.basicSelection}">
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.supplier']}" />
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{sfBackingBean.managedBean.selectItem}">
						<f:selectItem itemLabel="suplier1" itemValue="1" />
						<f:selectItem itemLabel="suplier2" itemValue="2" />
					</p:selectOneMenu>
				</h:column>
				<h:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.action']}" />
				</h:column>
				<h:column>
					<p:selectOneMenu value="#{sfBackingBean.managedBean.selectItem}">
						<f:selectItem itemLabel="#{lbl['lbl.sc.sf.recommended']}"
							itemValue="1" />
					</p:selectOneMenu>

					<p:commandButton value="#{lbl['lbl.sc.sf.ok']}"
						icon="ui-icon-accept" />
				</h:column>
			</h:panelGrid>

			<!-- <p:commandLink value="Recommended Supplier List" /> -->
			<p:panel header="Recommended Supplier List">
				<p:dataTable id="recommendedSuppId" var="recommendedSupp"
					value="#{sfBackingBean.managedBean.shortlistedSuppList}" rows="10"
					rowKey="#{recommendedSupp.qtProposalRankingId}"
					rowIndexVar="rowIndex">
					<ac:paginator for="recommendedSuppId" />

					<p:column headerText="#{lbl['lbl.sc.sf.supplier.code']}">
						<p:commandLink update=":form:popupSuppDtl"
							action="#{sfBackingBean.showSupplierDetails}"
							oncomplete="suppDetails.show();">
							<f:setPropertyActionListener value="#{recommendedSupp}"
								target="#{sfBackingBean.managedBean.scQtProposalRanking}" />
							<h:outputText value="#{recommendedSupp.scQtProposalEvaluate.scQtProposal.supplierNo}" />

						</p:commandLink>

					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.bumi.status']}">
						<h:outputText value="#{recommendedSupp.qtProposalRankingId}" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.total.score']}">
						<h:outputText value="345" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.ranking']}">
						<h:outputText value="#{recommendedSupp.qtProposalRankingId}" />
					</p:column>


					<p:column headerText="#{lbl['lbl.sc.sf.bid.ranking']}">
						<h:outputText value="323" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.shortlisted.loi']}">
						<h:outputText value="-" />
					</p:column>

					<p:column headerText="#{lbl['lbl.sc.sf.cmtee.decision']}">
						<h:selectBooleanCheckbox value="#{recommendedSupp.scQtProposalEvaluate.awarded}" />
					</p:column>
					
					<p:column headerText="#{lbl['lbl.sc.sf.qty.percentage']}">
						<p:inputText value="-"/>
					</p:column>
					 
				</p:dataTable>
			</p:panel>

			<p:spacer height="20px" />

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
				columns="2" columnClasses="columnWidth20,columnWidth30">
				<p:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.total.selected.supplier']}"></p:outputLabel>
				</p:column>

				<p:column>
					<p:inputText
						value="#{sfBackingBean.managedBean.totalSelectedSupplier}"
						readonly="true" size="10" />
				</p:column>
			</h:panelGrid>

		</p:panel>
	</h:panelGroup>
</ui:composition>
