<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
    <p:panel header="Reminder">
    
       <p:dataTable  var="signoff"
		   value="#{sfBackingBean.managedBean.committeeSignOffMemberlist}"
			rows="10"
			rowKey="#{signoff.qtCommitteeActivityId}" rowIndexVar="rowIndex" >

				<p:column headerText="#{lbl['lbl.sc.sf.committee.member']}" style="width:100px;">
					<h:outputText value="#{signoff.scCommitteeMember.memberName}"/>
				</p:column>
			
        </p:dataTable>
    
         <p:spacer height="25px"/>
		<h:panelGrid border="0" cellpadding="0" cellspacing="4" 
			columns="2">
	
			<h:outputLabel value="Subject" />
			<p:inputText value="" readonly="true"  size="25"/>
	
			<h:outputLabel value="Message" />
			<p:inputTextarea value="-" readonly="true"  cols="26" rows="9"/>
	
		</h:panelGrid>
		</p:panel>
        <p:spacer height="20px"/>
       	 <p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
				     <p:commandButton value="Send" icon="ui-icon-sign" />
					<p:commandButton value="Cancel" icon="ui-icon-cancel" onclick="popupReminder.hide();" />
				</p:column>
			</p:row>
		</p:panelGrid>


     
</ui:composition>
