<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:param name="scQt" value="#{sfBackingBean.managedBean.scQt}" />
	
	<p:panel>
		<div align="left">
			<table>
				<tr>
					<td style="width: 103px"><h:outputLabel value="Qtn/Tender No." /></td>
					<td><p:inputText value="#{scQt.qtNo}" disabled="true"
							size="30" /></td>
					<td style="width: 210px"><h:outputLabel value="PTJ Name" /></td>
					<td><p:inputText
							value="#{scQt.pmOrgProfile.orgCode} - #{scQt.pmOrgProfile.orgName}"
							disabled="true" size="30" /></td>
					<td style="width: 198px"><h:outputLabel value="Status" /></td>
					<td><p:inputText value="#{sfBackingBean.getStatusDescById(scQt.pmStatus.statusId)}" disabled="true"
							size="30" /></td>
				</tr>
			</table>
		</div>
	</p:panel>

</ui:composition>
