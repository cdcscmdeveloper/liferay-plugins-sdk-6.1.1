<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:spacer height="5px" />
	<h4>
		<u>Location List:</u>
	</h4>
	<p:spacer height="10px" />

	<h:panelGrid border="0" cellpadding="0" cellspacing="0" columns="4"
		columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
		<p:column>
			<p:outputLabel value="#{lbl['lbl.sc.sf.multiple.locality']}" />
		</p:column>

		<p:column>
			<p:inputText
				value="#{sfBackingBean.managedBean.scQt.scQtCriterias.multiLocality ? 'Yes' : 'No' }"
				readonly="true" disabled="true" />
		</p:column>
		<p:column />
		<p:column />
	</h:panelGrid>

	<p:dataTable id="zoneByItemId" var="zone"
		rendered="#{sfBackingBean.managedBean.scQt.scQtCriterias.multiLocality}"
		selection="#{sfBackingBean.managedBean.selectZoneByItem}"
		value="#{sfBackingBean.managedBean.zoneItemList}" rowKey="#{zone.qtZoneCriteriaId}"
		rowIndexVar="rowIndex" selectionMode="single">

		<p:ajax event="rowSelect" listener="#{sfBackingBean.onRowZoneSelect}" />

		<ac:paginator for="zoneId" />

		<p:column headerText="#{lbl['lbl.sc.sf.location']}">
			<h:outputText value="#{zone.zoneName}" />
		</p:column>
	</p:dataTable>

	<p:spacer height="20px" />
	<p:panel header="Item List">
		<p:dataTable id="itemId" var="item"
			value="#{sfBackingBean.managedBean.itemPreSummarylist}"
			selection="#{sfBackingBean.managedBean.selectedItemsSummary}"
			rowKey="#{item}" rowIndexVar="rowIndex" selectionMode="single">

			<p:ajax event="rowSelect" listener="#{sfBackingBean.getZoneByItemDtl}" />

			<ac:paginator for="itemId" />

			<p:column headerText="#{lbl['lbl.sc.sf.item']}">
				<h:outputText value="#{item.itemName}" />
			</p:column>
		</p:dataTable>
	</p:panel>

	<p:outputPanel id="qdisqdtlbyitem">
		<p:spacer height="25px" />
		<p:panel header="Qualified Supplier List">
			<p:dataTable id="quasupplierId" var="qsupplier"
				value="#{sfBackingBean.managedBean.qualifiedSuppByItemList}"
				rowKey="#{qsupplier.qtProposalRankingId}" rowIndexVar="rowIndex">
				<ac:paginator for="quasupplierId" />

				<p:column headerText="#{lbl['lbl.sc.sf.ranking']}"
					style="width:120px;">
					<h:outputText
						value="#{qsupplier.evaluationResultDtls.get(0).autoRank}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.supplier.code']}"
					style="width:120px;">
					<h:outputText value="#{qsupplier.scQtProposal.supplierNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.total.score']}"
					style="width:120px;">
					<h:outputText
						value="#{qsupplier.evaluationResultDtls.get(0).totalScore}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.finalization.remarks']}"
					style="width:100px;">
					<p:inputTextarea rows="2" />
				</p:column>

			</p:dataTable>
			<p:spacer height="15px" />
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
				columns="4"
				columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
				<p:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.total']}" />
				</p:column>

				<p:column>
					<p:inputText
						value="#{sfBackingBean.managedBean.totalQulifiedSupplierByItem}"
						readonly="true" size="10" />
				</p:column>
				<p:column />
				<p:column />
			</h:panelGrid>
		</p:panel>
		<p:spacer height="20px" />

		<p:panel header="Disqualified Supplier List">
			<p:dataTable id="disqsupplierId" var="dqsupplier"
				value="#{sfBackingBean.managedBean.disQualifiedSuppByItemList}"
				rowKey="#{qsupplier.qtProposalRankingId}" rowIndexVar="rowIndex">
				<ac:paginator for="disqsupplierId" />

				<p:column headerText="#{lbl['lbl.sc.sf.ranking']}">
					<h:outputText
						value="#{dqsupplier.evaluationResultDtls.get(0).autoRank}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.supplier.code']}">
					<h:outputText value="#{dqsupplier.scQtProposal.supplierNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.sf.total.score']}">
					<h:outputText
						value="#{dqsupplier.evaluationResultDtls.get(0).totalScore}"></h:outputText>
				</p:column>
			</p:dataTable>
			<p:spacer height="15px" />

			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
				columns="4"
				columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
				<p:column>
					<p:outputLabel value="#{lbl['lbl.sc.sf.total']}"></p:outputLabel>
				</p:column>

				<p:column>
					<p:inputText
						value="#{sfBackingBean.managedBean.totalDisQualifiedSupplierByItem}"
						readonly="true" size="10" />
				</p:column>
				<p:column />
				<p:column />
			</h:panelGrid>
		</p:panel>
	</p:outputPanel>

	<p:dialog id="popZoneByItem" widgetVar="popZoneByItem"
		resizable="false" styleClass="pop_up_top" header="Zone Details"
		width="300" height="190">

		<h:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<h:outputLabel value="#{lbl['lbl.sc.sf.zone.name']}" />
			<p:inputText readonly="true"
				value="#{sfBackingBean.managedBean.scQtZoneCriteria.zoneName}"
				size="30" />
		</h:panelGrid>
		<p:spacer height="10px" />

		<h:panelGroup style="width:100%;">
			<p:dataTable value="" var="">
				<p:column headerText="#{lbl['lbl.sc.sf.loc.name']}" />
			</p:dataTable>

		</h:panelGroup>

		<p:spacer height="25px" />
		<p:commandButton value="#{lbl['lbl.sc.sf.cancel']}"
			style="float:right;" icon="ui-icon-cancel"
			onclick="popZoneByItem.hide();">
		</p:commandButton>
	</p:dialog>


</ui:composition>
