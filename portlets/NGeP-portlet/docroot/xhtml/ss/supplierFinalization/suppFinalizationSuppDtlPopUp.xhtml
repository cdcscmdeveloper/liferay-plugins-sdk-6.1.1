<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!--  Supplier Details dialog -->
	<p:dialog id="popupSuppDtl" widgetVar="suppDetails" resizable="false"
		styleClass="pop_up_top" header="Supplier Details" width="750"
		height="350">

		<h:panelGrid border="0" cellpadding="0" cellspacing="4" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">

			<h:outputLabel value="#{lbl['lbl.sc.sf.supplier.code']}" />
			<p:inputText
				value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.supplierNo}"
				readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.supplier.name']}" />
			<p:inputText
				value="#{sfBackingBean.managedBean.scQtProposalRanking.scQtProposalEvaluate.scQtProposal.scQtSupplier.smSupplier.supplierName}"
				readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.reg.type']}" />
			<p:inputText value="" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.reg.no']}" />
			<p:inputText
				value="#{sfBackingBean.managedBean.scQtProposalRanking.scQtProposalEvaluate.scQtProposal.scQtSupplier.smSupplier.regNo}"
				readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.mof.no']}" />
			<p:inputText
				value="#{sfBackingBean.managedBean.scQtProposalRanking.scQtProposalEvaluate.scQtProposal.scQtSupplier.smSupplier.smMofAccounts[0].mofNo}"
				readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.income.tax.ref.no']}" />
			<p:inputText
				value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.incomeTaxNo}"
				readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.est.date']}" />
			<p:inputText
				value="#{sfBackingBean.managedBean.scQtEvaluationResult.scQtProposal.scQtSupplier.smSupplier.establishDate}"
				readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.type.of.company']}" />
			<p:inputText value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.mof.exp.date']}" />
			<p:inputText value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.disciplinary.rating']}" />
			<p:inputText value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.branch']}" />
			<p:inputText value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.address']}" />
			<p:inputTextarea value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.contact.person']}" />
			<p:inputText value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.designation']}" />
			<p:inputText value="-" readonly="true" />

			<h:outputLabel value="#{lbl['lbl.sc.sf.email']}" />
			<p:inputText value="-" readonly="true" />

		</h:panelGrid>

		<p:spacer height="20px" />
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="Cancel" icon="ui-icon-cancel"
						onclick="suppDetails.hide();" />
				</p:column>
			</p:row>
		</p:panelGrid>


	</p:dialog>

</ui:composition>
