<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<!--  Zone Details dialog -->
	<p:dialog id="popZone" widgetVar="popZone" resizable="false"
		styleClass="pop_up_top" header="Zone Details" width="300"
		height="190">

		<h:panelGrid columns="2" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<h:outputLabel value="#{lbl['lbl.sc.sf.zone.name']}" />
			<p:inputText readonly="true"
				value="#{sfBackingBean.managedBean.scQtZoneCriteria.zoneName}"
				size="30" />

		</h:panelGrid>
		
		<p:spacer height="10px" />
		
		<h:panelGroup style="width:100%;">
			<p:dataTable value="" var="">
			  <p:column headerText="#{lbl['lbl.sc.sf.loc.name']}">
			   </p:column>
			</p:dataTable>

		</h:panelGroup>

        <p:spacer height="25px" />
		<p:commandButton value="#{lbl['lbl.sc.sf.cancel']}"
			style="float:right;" icon="ui-icon-cancel" onclick="popZone.hide();">
		</p:commandButton>

	</p:dialog>
</ui:composition>
