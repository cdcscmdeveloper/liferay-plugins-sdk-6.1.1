	<p:panel>

	<p:panel toggleable="true">

			<p:tab id="tba1" title="Qtn / Tender Notice ">
			<br />
				<h:panelGrid columns="2" style="width:100%;"
					styleClass="noBorders tr,noBorders td">
					
					<h:outputText value="Title"/>
					<h:inputText readonly="true" size="80" />
				</h:panelGrid>
				<br />

				<h:panelGrid columns="4" style="width:70%;"
					styleClass="noBorders tr,noBorders td">

					<h:outputText value="Qtn / Tender No"></h:outputText>
					<h:inputText readonly="true" />

					<h:outputText value="Ministry"></h:outputText>
					<h:inputText readonly="true" />

					<h:outputText value="Department"></h:outputText>
					<h:inputText readonly="true" />

					<h:outputText value="Division"></h:outputText>
					<h:inputText readonly="true" />

					<h:outputText value="Proposal Validity Period: "></h:outputText>
					<h:inputText readonly="true" />

				</h:panelGrid>

				<p:panel header="Supplier Qualification Criteria " toggleable="true">

					<h:outputLabel value="Category Code List"
						style="text-decoration:underline;float:left;" />

					<br />
					<h:panelGroup style="width:100%;">
						<p:dataTable value="" var="" resizableColumns="true"
							editable="true">
							<p:column headerText="Category Code">
								<h:outputText value="ct01"/>
							</p:column>

							<p:column headerText="Mandatory">
								<h:outputText value="high" />
							</p:column>

						</p:dataTable>
					</h:panelGroup>
					<br />

				<h:panelGrid columns="2" style="width:50%;"
					styleClass="noBorders tr,noBorders td">

					<h:outputText value="Multiple Locality "></h:outputText>
					<h:inputText readonly="true" />

					<h:outputText value="All States"></h:outputText>
					<h:inputText readonly="true" />

				</h:panelGrid>
				<br />
					<h:outputLabel value="Location List"
						style="text-decoration:underline;float:left;" />	
						<br/>			
					<h:panelGroup style="width:100%;">
						<p:dataTable value="" var="">
							<p:column headerText="Location">
							 <p:commandLink onclick="popQtn.show();">
								<h:outputText value="Zone Name" />
							 </p:commandLink>
							</p:column>

						</p:dataTable>
					</h:panelGroup>
					<br />
					<h:panelGrid columns="2" style="width:43%;"
						styleClass="noBorders tr,noBorders td">
						<h:outputText value="Paid Up Capital (RM)" />

				</p:panel>

				</h:panelGrid>	
				<br />
				<br />	
				<p:panel>

				<br />

      						  <h:outputText  />

      						  <h:outputText readonly="true" />

							<p:column headerText="Tel. No">
      						  <h:outputText readonly="true" />

							<p:column headerText="Fax No">
      						  <h:outputText readonly="true" />
							</p:column>
							
							<p:column headerText="Email">
      						  <h:outputText readonly="true" />
							</p:column>

					</h:panelGroup>
