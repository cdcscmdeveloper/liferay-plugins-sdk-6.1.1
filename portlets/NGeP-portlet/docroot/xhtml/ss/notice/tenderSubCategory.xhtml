
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel>
		<h:panelGrid columns="5" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="80%" style="text-align:center">
						<h:panelGrid border="1" cellpadding="0" cellspacing="0"
							width="100%" columns="1"
							columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth20,columnWidth20 ">
							<h:column>
								<h:outputText
									value="#{lbl['lbl.sc.notice.board.view.notice.publish']}" />
							</h:column>
							<h:column>
								<h:commandLink value="#{lbl['lbl.sc.notice.board.today']} " /> <p:spacer width="1"/> |
								<p:spacer width="1"/> 
								<h:commandLink value="#{lbl['lbl.sc.notice.board.yesterday']} " /> <p:spacer width="1"/> |
								<p:spacer width="1"/> 
								<h:commandLink value="#{lbl['lbl.sc.notice.board.pass']}" />
								<p:spacer width="3"/> 
								<h:inputText size="2" />
								<p:spacer width="3"/> 
								<h:commandLink value="#{lbl['lbl.sc.notice.board.days']}" />
							</h:column>
						</h:panelGrid>
					</p:column>

					<p:column width="80%" style="text-align:center">
						<h:panelGrid border="1" cellpadding="0" cellspacing="0"
							width="100%" columns="1"
							columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth20,columnWidth20 ">
							<h:column>
								<h:outputText value="#{lbl['lbl.sc.notice.board.view.bsv']}" />
							</h:column>
							<h:column>
								<h:commandLink value="#{lbl['lbl.sc.notice.board.today']} " /><p:spacer width="1"/>  | 
								<p:spacer width="1"/>  
								<h:commandLink value="#{lbl['lbl.sc.notice.board.yesterday']} " /> <p:spacer width="1"/>  |
								<p:spacer width="1"/> 
								<h:commandLink value="#{lbl['lbl.sc.notice.board.pass']}" />
								<p:spacer width="3"/> 
								<h:inputText size="2" />
							    <p:spacer width="3"/> 
								<h:commandLink value="#{lbl['lbl.sc.notice.board.days']}" />
							</h:column>
						</h:panelGrid>
					</p:column>

					<p:column width="80%" style="text-align:center">
						<h:panelGrid border="1" cellpadding="0" cellspacing="0"
							width="100%"
							columnClasses="columnWidth20,columnWidth20,columnWidth20,columnWidth20,columnWidth20 ">
							<h:column headerClass="text-align: center;">
								<h:outputText value="#{lbl['lbl.sc.notice.board.view.by.catcode']}" />
							</h:column>
							<h:column>
								<h:inputText size="25" />
							</h:column>
						</h:panelGrid>
					</p:column>
				</p:row>
			</p:panelGrid>

	</h:panelGrid>
	</p:panel>
</ui:composition>
