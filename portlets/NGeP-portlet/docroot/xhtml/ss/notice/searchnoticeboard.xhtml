<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td"></p:panelGrid>
	</p:panel>

	<p:panel header="Search Qtn/Tender" toggleable="true">

		<p:panelGrid columns="4" style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<h:outputText value="#{lbl['lbl.sc.notice.board.ministry']} "></h:outputText>

			<p:selectOneMenu style="width:40%;"
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Defence minister" itemValue="1" />
				<f:selectItem itemLabel="Education minister" itemValue="2" />
				<f:selectItem itemLabel="Environment minister" itemValue="3" />
				<f:selectItem itemLabel="Finance minister" itemValue="1" />
			</p:selectOneMenu>

			<h:outputText value="#{lbl['lbl.sc.notice.board.jabatan']} "></h:outputText>

			<p:selectOneMenu style="width:40%;"
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="JPJ" itemValue="1" />
				<f:selectItem itemLabel="JKR" itemValue="2" />
				<f:selectItem itemLabel="JPN" itemValue="3" />
				<f:selectItem itemLabel="JPA" itemValue="4" />
			</p:selectOneMenu>

			<h:outputText value="#{lbl['lbl.sc.notice.board.ptj']} "></h:outputText>

			<p:selectOneMenu style="width:40%;"
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Team 1" itemValue="1" />
				<f:selectItem itemLabel="Team 2" itemValue="2" />
				<f:selectItem itemLabel="Team 3" itemValue="3" />
				<f:selectItem itemLabel="Team 4" itemValue="4" />
			</p:selectOneMenu>

			<h:outputText value="#{lbl['lbl.sc.notice.board.title']}"></h:outputText>
			<h:inputText
				value="#{noticeBoardBackingBean.managedBean.scQt.qtTitle}" />

			<h:outputText value="#{lbl['lbl.sc.notice.board.npdate']}"></h:outputText>
			<p:calendar value="#{searchQtnTenderBB.managedBean.date}"
				id="notdate" showOn="button" />

			<h:outputText value="#{lbl['lbl.sc.notice.board.clsdate']}"></h:outputText>
			<p:calendar value="#{searchQtnTenderBB.managedBean.date}"
				id="closedate" showOn="button" />

			<h:outputText value="#{lbl['lbl.sc.notice.board.ctgcode']}" />
			<p:selectOneMenu style="width:40%;"
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="Code 1" itemValue="1" />
				<f:selectItem itemLabel="Code 2" itemValue="2" />
				<f:selectItem itemLabel="Code 3" itemValue="3" />
				<f:selectItem itemLabel="Code 4" itemValue="4" />
			</p:selectOneMenu>

			<h:outputText value="#{lbl['lbl.sc.notice.board.state']}"></h:outputText>

			<p:selectOneMenu style="width:40%;"
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="WP" itemValue="1" />
				<f:selectItem itemLabel="Selangor" itemValue="2" />
				<f:selectItem itemLabel="Perak" itemValue="3" />
				<f:selectItem itemLabel="Pahang" itemValue="4" />
			</p:selectOneMenu>

			<h:outputText value="#{lbl['lbl.sc.notice.board.district']}"></h:outputText>

			<p:selectOneMenu style="width:40%;"
				value="#{searchQtnTenderBB.managedBean.selectOption}">
				<f:selectItem itemLabel="Select One" itemValue="" />
				<f:selectItem itemLabel="District 1" itemValue="1" />
				<f:selectItem itemLabel="District 2" itemValue="2" />
				<f:selectItem itemLabel="District 3" itemValue="3" />
				<f:selectItem itemLabel="District 4" itemValue="4" />
			</p:selectOneMenu>

		</p:panelGrid>

		<p:commandButton value="#{lbl['lbl.sc.notice.board.searchbtn']}"
			style="float:right;"
			action="#{noticeBoardBackingBean.searchNoticeBoard}"
			update=":form:summaryId" />

		<br />
		<br />
		<p:tabView id="tabView" dynamic="true" cache="true">

			<p:tab id="tba1" title="Publish">
				<h:panelGrid columns="2" cellpadding="10">
				</h:panelGrid>
			</p:tab>

			<p:tab id="tab2" title="Changes">
				<h:panelGrid columns="2" cellpadding="10">
				</h:panelGrid>
			</p:tab>

			<p:tab id="tab3" title="Closed">
				<h:panelGrid columns="2" cellpadding="10">
				</h:panelGrid>
			</p:tab>

			<p:tab id="tab4" title="Price Schedule">
				<h:panelGrid columns="2" cellpadding="10">

				</h:panelGrid>
			</p:tab>

			<p:tab id="tab5" title="Awarded">
				<h:panelGrid columns="2" cellpadding="10">
				</h:panelGrid>
			</p:tab>

		</p:tabView>

		<ui:include src="/xhtml/ss/notice/tenderSubCategory.xhtml" />

	</p:panel>

	<p:panel header="Qtn/Tender Summary" id="summaryId">
		<p:dataTable
			value="#{noticeBoardBackingBean.managedBean.scQtSearchlist}"
			var="scQt" rowKey="#{scQt.qtId}" rowIndexVar="index">

			<p:column headerText="#{lbl['lbl.sc.notice.board.title']}"
				style="width:15%">
				<p:commandLink action="tenderNoticeDetail.xhtml?faces-redirect=true">
					<h:outputText value="#{scQt.qtTitle}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.notice.board.pdate']}">
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}"
					id="publdate" showOn="button" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.notice.board.clsdate']}">
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}"
					id="closdate" showOn="button" />
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.notice.board.cdown']}"
				style="width:15%">
				<h:outputText value="21" />
			</p:column>

			<p:column
				headerText="#{lbl['lbl.sc.notice.board.bsv.if.yes.selfreg']}"
				style="width:30%">
				<p:commandLink
					action="tenderSelfRegistration.xhtml?faces-redirect=true">
					<h:outputText value="#{lbl['lbl.sc.notice.board.self.reg']}" />
				</p:commandLink>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.notice.board.view.det']}">
				<p:commandLink
					action="noticeBoardQtnTenderDocs.xhtml?faces-redirect=true">
					<h:outputText
						value="#{lbl['lbl.sc.notice.board.view.qtn.tender.docs']}" />
				</p:commandLink>
			</p:column>

		</p:dataTable>
	</p:panel>

</ui:composition>
