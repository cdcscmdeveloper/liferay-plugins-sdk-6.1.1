<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:include src="/xhtml/ss/evaluation/evaluationHeader.xhtml" />


	<p:panel header="#{lbl['lbl.sc.eva.report.head']}" toggleable="true">
		<p:dataTable id="evaluationreport" width="100%" cellpadding="1"
			rowIndexVar="rowIndex"
			value="#{evaluationBackingBean.managedBean.evaluationReportListItems}"
			var="item1">
			<ac:paginator for="evaluationreport" />
			<p:columnGroup type="header">
				<p:row>
					<p:column colspan="1" width="60%" rendered="true"
						style="text-align:center; vertical-align:top;"
						headerText="#{lbl['lbl.sc.eva.report.content']}">
					</p:column>
					<p:column colspan="1" width="40%" rendered="true"
						style="text-align:center; vertical-align:top;"
						headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}">
					</p:column>

				</p:row>
			</p:columnGroup>
			<p:subTable id="supplierItemTable1#{rowIndex}" var="supplierItem1"
				value="#{item1.supplierItems}">
				<f:facet name="header">
					<h:outputText value="#{item1.itemName}" /> :   
				            	
				            </f:facet>
				<p:column>  
				                #{supplierItem1.remarks}  
				            </p:column>
				<p:column>
					<p:commandLink value="Download"></p:commandLink>
				</p:column>

			</p:subTable>
		</p:dataTable>



	</p:panel>

	<p:panel header="#{lbl['lbl.sc.eva.report.final.head']}">
		<h:panelGrid columns="2">

			<p:outputLabel value="#{lbl['lbl.sc.eva.report.attachment']}"></p:outputLabel>

			<h:panelGroup>
				<p:inputText></p:inputText>
				<p:commandButton value="UPLOAD"></p:commandButton>
				<p:commandLink value="view"></p:commandLink>
			</h:panelGroup>
		</h:panelGrid>

	</p:panel>
	
	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
			<c:if test="#{evaluationBackingBean.managedBean.committeeType eq'OC'}">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('5','3')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" /></c:if>
						<c:if test="#{evaluationBackingBean.managedBean.committeeType ne'OC'}">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('5','4')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" /></c:if>
				</div></td>
			<td><div align="right" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.next']}"
						actionListener="#{evaluationBackingBean.setTabValue('5','6')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-next"
						iconPos="right" update=":form" />
				</div></td>
		</tr>
	</table>
	
</ui:composition>
