<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

 <p:dialog  widgetVar="uploadDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" 
			 mode="advanced" id="requestDocument1"	fileUploadListener="#{evaluationBackingBean.handleFileUpload}"
			
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="requestDocument" oncomplete="uploadDlg.hide()">
		</p:fileUpload>
	</p:dialog>
	
	
	 <p:dialog  widgetVar="reportDlg" modal="true"
		dynamic="true" hideEffect="explode" resizable="false" width="700px"
		height="200" styleClass="pop_up_top"
		header="#{lbl['lbl.bpm.choose.file']}">
		<p:fileUpload style="display:inline;" 
			 mode="advanced" id="reportUpload"	fileUploadListener="#{evaluationBackingBean.handleFileUpload}"
			
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
			update="report" oncomplete="reportDlg.hide()">
		</p:fileUpload>
	</p:dialog>
	
	</ui:composition>
