<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="SendEmail" widgetVar="sendEmail"
		modal="true" width="800" height="250">
		<p:panel header="Meeting Details" toggleable="true">

			<p:dataTable  var="simpleQuote5"
				value="#{simpleQuoteBidBackingBean.utilList}"
				selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
				rowKey="#{simpleQuote5.seqNo}" rowIndexVar="index">

				<p:column selectionMode="multiple" style="width:5%" />

				<p:column headerText="Committee Name" style="width:45%">
					<h:outputText value="committee#{index+1}"></h:outputText>
				</p:column>

				<p:column headerText="Email" style="width:50%">
					<h:outputText value="garikapat#{index+1}@gmail.com"></h:outputText>
				</p:column>

				</p:dataTable>

		</p:panel>


<p:panel header="FINAL xxx EVALUATION REPORT">
		 <p:panelGrid  style="width:100%" styleClass="noBorders tr,noBorders td">
                <p:row>
                <p:column>
                <p:outputLabel value="Meeting location"></p:outputLabel>
                </p:column>
                
                <p:column>
               
                <p:inputText></p:inputText>
                
                </p:column>
                
                
                </p:row>
				 
					
					
					  <p:row>
                <p:column>
                <p:outputLabel value="Meeting Date"></p:outputLabel>
                </p:column>
                
                <p:column>
               
                <p:calendar showOn="button"></p:calendar>
                
                </p:column>
                
                
                </p:row> 
	        
	        
					  <p:row>
                <p:column>
                <p:outputLabel value="Message"></p:outputLabel>
                </p:column>
                
                <p:column>
               
               <p:inputTextarea rows="1" cols="50"></p:inputTextarea>
                
                </p:column>
                
                
                </p:row> 
	        				
	          
				</p:panelGrid>
		
		</p:panel>

 
		<p:commandButton value="OK" style="float:right;"
			onclick="sendEmail.hide();" oncomplete="simpleQuoteBid.hide();"></p:commandButton>
				&#160;&#160;
				<p:commandButton value="CANCEL" style="float:right;"
			onclick="sendEmail.hide();"></p:commandButton>


	</p:dialog>
</ui:composition>
