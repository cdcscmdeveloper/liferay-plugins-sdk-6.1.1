<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<div align="right">
				<p:commandButton value="SUBMIT" />
				
			</div>

   <ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" /> 
	


	
			<p:panel header="SUPPLIER LIST" toggleable="true">

			<p:dataTable  var="simpleQuote2"
				value="#{simpleQuoteBidBackingBean.utilList}"
				selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
				rowKey="#{simpleQuote2.seqNo}" rowIndexVar="index">

				

				<p:column headerText="Supplier No" style="width:20%">
					<h:outputText value="120#{index+1}"></h:outputText>
				</p:column>

				<p:column headerText="Evaluation Status" style="width:30%">
					<h:outputText value="Evaluation#{index+1}Pending"></h:outputText>
				</p:column>

				
				<p:column headerText="Total Score" style="width:15%">
					<h:outputText value="100#{index+1}"></h:outputText>
				</p:column>

                 <p:column headerText="Result" style="width:15%">
					<h:outputText value="Result#{index+1}Failed"></h:outputText>
				</p:column> 
				 <p:column headerText="Action" style="width:20%">
					<p:commandButton value="EVALUATE" onclick="evaluation.show();"></p:commandButton>
				</p:column>
			

			</p:dataTable>

		</p:panel>
		
					
					
				
				
				
				
					
</ui:composition>
