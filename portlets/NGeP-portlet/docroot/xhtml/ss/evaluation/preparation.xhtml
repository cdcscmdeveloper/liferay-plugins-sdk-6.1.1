<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

    <div align="right">
				<p:commandButton value="SAVE" />
				&#160;
				<p:commandButton value="EVALUATE" />
			</div>

   <ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" /> 
	
	<p:panel header="MEETING DETAILS" toggleable="true">

			<p:dataTable  var="simpleQuote1"
				value="#{simpleQuoteBidBackingBean.utilList}"
				selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
				rowKey="#{simpleQuote1.seqNo}" rowIndexVar="index" editable="true">

			<p:ajax event="rowEdit" listener="#{searchQtnTenderBB.onEdit}"  />  
            <p:ajax event="rowEditCancel" listener="#{searchQtnTenderBB.onCancel}"  /> 

				<p:column headerText="Meeting Date" style="width:20%">
					
				<p:cellEditor>  
                <f:facet name="output">  
                <h:outputText value="30/09/2013"></h:outputText>
                </f:facet>  
                <f:facet name="input">  
                    <p:inputText value="30/09/2013"></p:inputText>
                </f:facet>  
            </p:cellEditor>  
		</p:column>
				<p:column headerText="Location" style="width:30%">
					
			 <p:cellEditor>  
                <f:facet name="output">  
                 <h:outputText value="#{simpleQuote1.description}Location"></h:outputText> 
                </f:facet>  
                <f:facet name="input">  
                    <p:inputText value="#{simpleQuote1.description}Location"></p:inputText>
                </f:facet>  
            </p:cellEditor>  
		</p:column>
		
		
		
		
		
         <p:column headerText="#{lbl['lbl.ss.simple.quote.item.action']}" style="width:60%"> 
       
            
            
            <p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
                
				 
					 <p:rowEditor />
            <p:commandButton value="SEND EMAIL" onclick="sendEmail.show();"></p:commandButton>  
	        
	        				
	          
				</p:panelGrid>
            </p:column>  
</p:dataTable>
               <div align="right"  >
					<p:commandButton  value="ADD" 
						               />
					
					</div>
              
		</p:panel>

	
			<p:panel header="COMMITTEE MEMBER LIST" toggleable="true">

			<p:dataTable  var="simpleQuote2"
				value="#{simpleQuoteBidBackingBean.utilList}"
				selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
				rowKey="#{simpleQuote2.seqNo}" rowIndexVar="index">

				

				<p:column headerText="Name" style="width:48%">
					<h:outputText value="Hari#{index+1}"></h:outputText>
				</p:column>

				<p:column headerText="Member Type" style="width:25%">
					<h:outputText value="Member#{index+1}"></h:outputText>
				</p:column>

				
				<p:column headerText="Role" style="width:25%">
					<h:outputText value="Supplier#{index+1}"></h:outputText>
				</p:column>

				<p:column headerText="Attendance" selectionMode="multiple" style="width:2%" />

			</p:dataTable>

		</p:panel>
		
					
					
				
				
				
				
					
</ui:composition>
