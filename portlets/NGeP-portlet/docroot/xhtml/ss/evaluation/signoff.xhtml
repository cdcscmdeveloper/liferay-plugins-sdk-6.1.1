<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	 <!-- <ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />  -->


	<p:panel header="#{lbl['lbl.sc.eva.sign.off']}" toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.eva.sign.report']}"></p:commandLink>
		<p:dataTable id="evaluationSignOff" var="signOffMember"
			value="#{evaluationBackingBean.managedBean.signOffMemberList}"
			rowKey="#{signOffMember}" rowIndexVar="index">

			<ac:paginator for="evaluationSignOff" />

			<p:column headerText="#{lbl['lbl.sc.eva.committee.member']}"
				style="width:50%">
				<h:outputText value="#{signOffMember.scCommitteeMember.memberName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.eva.sign.off']}"
				style="width:30%">
				<h:outputText value="#{signOffMember.signedOff}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.eva.prepare.meeting.action']}"
				style="width:20%">
				<h:outputText value="(sign#{index+1})"></h:outputText>
			</p:column>

		</p:dataTable>
		<p:spacer height="10"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.eva.btn.reminder']}"
				onclick="evaluationreminder.show();" icon="ui-icon-mail" />

		</div>
		<ui:include src="/xhtml/ss/evaluation/evaluationreminderpopup.xhtml" />
	</p:panel>
	<table style="width: 100%">
		<tr>
			<td><div align="left" style="width: 99%">
					<p:commandButton value="#{lbl['lbl.sm.prev']}"
						actionListener="#{evaluationBackingBean.setTabValue('6','5')}"
						action="#{evaluationBackingBean.updateSmAppl}" icon="ui-icon-prev"
						update=":form" />
				</div></td>
			
		</tr>
	</table>
</ui:composition>
