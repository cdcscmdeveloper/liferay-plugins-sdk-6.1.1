<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="#{lbl['lbl.sc.tpl.doc.search']}" toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.tpl.doc.search.temp']}"></p:commandLink>

		<table style="width: 100%">
			<tr>
				<td class="TableFieldLeft" style="width: 10%"><h:outputLabel
						value="Template Title"></h:outputLabel></td>
				<td class="TableFieldRight"><h:inputText size="70" />
				</td>
			</tr>

			<tr>
				<td class="TableFieldLeft" style="width: 10%"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.doc.qtn.no']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:inputText /></td>
				<td class="TableFieldLeft"><h:outputLabel
						value="#{lbl['lbl.sc.tpl.search.procure.category']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu>
						<f:selectItems
							value="#{sourcingTemplateDBB.getDropdownValues(PmCodeCatConst.procurementCategory)}" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.status']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu>
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItem itemLabel="Pending" itemValue="P" />
						<f:selectItem itemLabel="Complete" itemValue="C" />
					</p:selectOneMenu></td>

				<td class="TableFieldLeft"><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.record.status']}"></h:outputLabel></td>
				<td class="TableFieldRight"><p:selectOneMenu>
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItem itemLabel="Active" itemValue="1" />
						<f:selectItem itemLabel="Inactive" itemValue="0" />
					</p:selectOneMenu></td>
			</tr>
		</table>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.search']}"
				action="#{TemplateMBB.searchCreateListAction}" update="searchDoc"
				icon="ui-icon-search" />
		</div>

	</p:panel>

	<p:panel header="#{lbl['lbl.sc.tpl.doc.list']}" style="width:1000px;">
		<h:panelGrid style="width:950px;">
			<p:dataTable id="searchDoc" var="scQtDoc"
				value="#{TemplateMBB.managedBean.docSearchlist}" editable="true"
				rowKey="#{scQtDoc.qtDocId}" rowIndexVar="index">
				<!--   <p:column selectionMode="multiple"  style="text-align:center;"/> -->



				<p:column headerText="#{lbl['lbl.sc.tpl.doc.title']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.specName}"></h:outputText>
				</p:column>
				
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.procure.category']}">
					<h:outputText
						value="#{scQtDoc.tplSpecMaster.procurementCategory.parameterId}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.qtn.no']}">
					<h:outputText value="#{scQtDoc.scQt.qtNo}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tpl.doc.status']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.status.statusId}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.tpl.doc.record.status']}">
					<h:outputText value="#{scQtDoc.tplSpecMaster.status.statusId}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.tpl.doc.action']}">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />

						<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.clone']}"
							action="#{sourcingTemplateDBB.sourcingTemplateAction}"
							icon="ui-icon-clone" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
		</h:panelGrid>

	</p:panel>

</ui:composition>
