<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

  <p:messages id="templateDocmessages" showDetail="true" autoUpdate="true"
				closable="true" />
	<ui:define name="contentSection">
 
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.save']}"
				 action="#{sourcingTemplateDBB.saveAction}" icon="ui-icon-save"/>
			<p:commandButton value="#{lbl['lbl.sc.tpl.doc.btn.submit']}"
				style="margin-right:30px;" icon="ui-icon-submit"/>

		</div>
		<p:panel header="#{lbl['lbl.sc.tpl.doc.section']}" toggleable="true">
	
		
			<table>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.qtn.no']}"></h:outputLabel>
					</td>
					<td><p:inputText value="#{sourcingTemplateDBB.managedBean.scQtDoc.scQt.qtNo}"  readonly="true" disabled="true" /></td>

				</tr>
                 <tr>
					<td>
                <h:outputLabel value="Document Type"></h:outputLabel></td>
			<td><p:selectOneRadio style="margin-bottom:5px;" value="#{sourcingTemplateDBB.managedBean.docType}">
				<f:selectItem itemLabel="Quotation/Tender" itemValue="0" />
				<f:selectItem itemLabel="LOA" itemValue="6" />
               <p:ajax event="change" process="@this" partialSubmit="true"  update="checklist" listener="#{sourcingTemplateDBB.retriveChecklist}"  ></p:ajax>
			</p:selectOneRadio></td></tr>
			
			<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.check.list']}"></h:outputLabel>
					</td>
					<td><p:selectOneMenu id="checklist" style="margin-bottom:5px;"
							value="#{sourcingTemplateDBB.managedBean.scQtDoc.scQtCheckList.qtChecklistId}">
							<f:selectItem itemLabel="-Select One -" itemValue="#{null}" />
								<f:selectItems value="#{sourcingTemplateDBB.managedBean.checkListItem}" var="checklist" itemLabel="#{checklist.title}" itemValue="#{checklist.qtChecklistId}"/>
							<p:ajax event="change"  process="@this" partialSubmit="true" update="title" listener="#{sourcingTemplateDBB.handleCheckListChanged(sourcingTemplateDBB.managedBean.scQtDoc)}"
							></p:ajax>
						</p:selectOneMenu></td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.title']}"></h:outputLabel>
					</td>
					<td>
					<h:panelGroup  id="title">
					<ui:fragment rendered="#{sourcingTemplateDBB.managedBean.checklistTitle !=null}">
						<p:inputText size="50" disabled="true" value="#{sourcingTemplateDBB.managedBean.scQtDoc.scQtCheckList.title}" />
					</ui:fragment>
					<ui:fragment rendered="#{sourcingTemplateDBB.managedBean.checklistTitle==null}">
					<p:inputText size="50" value="#{sourcingTemplateDBB.managedBean.scQtDoc.scQtCheckList.title}" />
					</ui:fragment>
					</h:panelGroup>
					</td>
				</tr>
				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.desc']}"></h:outputLabel>
					</td>
					<td><p:inputTextarea rows="3" cols="50" autoResize="false" value="#{sourcingTemplateDBB.managedBean.docDescription}" style="margin-bottom:5px;"/>
					</td>
				</tr>

				<tr>
					<td><h:outputLabel value="#{lbl['lbl.sc.tpl.doc.status']}" />
					</td>
					<td><p:inputText readonly="true" disabled="true"></p:inputText></td>

				</tr>
				<tr>
					<td class="TableFieldLeft"><h:outputLabel
							value="#{lbl['lbl.sc.tpl.doc.record.status']}"></h:outputLabel>

					</td>
					<td class="TableFieldRight"><p:selectOneMenu value="#{sourcingTemplateDBB.managedBean.scQtDoc.recordStatus}">

							<f:selectItem itemLabel="Active" itemValue="1" />
							<f:selectItem itemLabel="Inactive" itemValue="0" />
						</p:selectOneMenu></td>
				</tr>
			</table>



		</p:panel>

<p:panel>
	<ui:include src="/xhtml/tpl/doc/templateDocMaintSection.xhtml" /> 
		<!-- <ui:include src="/xhtml/tpl/doc/templateDocMaint.xhtml" /> -->
	</p:panel>	
	</ui:define>


</ui:composition>
