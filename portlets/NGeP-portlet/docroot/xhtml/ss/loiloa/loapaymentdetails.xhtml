<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<ui:include src="/xhtml/ss/loiloa/loaheader.xhtml" />
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.supp.pay.info']}"
		toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.acc.no']}" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{lOADetailBackingBean.managedBean.scQtSpec.approverName}"
					style="width: 178px;margin-bottom: 5px;">
					<f:selectItem itemLabel="-- Select -- " itemValue="" />
					<f:selectItem itemLabel="" itemValue="1" />
				</p:selectOneMenu>
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.name']}" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" size="30" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.branch']}" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" size="30" />
			</h:column>
			<h:column>
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.loa.bank.addr']}" />
			</h:column>
			<h:column>
				<p:inputTextarea id="bondAddrText" cols="30" rows="5" value=""
					style=" margin-bottom:5px;" disabled="true" />
			</h:column>
		</h:panelGrid>
	</p:panel>
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.ded.pay']}" toggleable="true">
		<p:panel header="#{lbl['lbl.sc.loiloa.loa.ded.pay']}"
			toggleable="false">
			<p:dataTable id="deductionpaymenttbl" var="deductionpaymentList"
				value="#{bsvAttendanceBackingBean.managedBean.briefingAttendanceList}"
				rows="10">
				<ac:paginator for="deductpayId" />

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.ded.type']}">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.ded.desp']}">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.ded.percentage']}">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.amt']}">
					<p:inputText value="" />
				</p:column>

			</p:dataTable>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.loiloa.loa.ded.clause']}"
			toggleable="false">
			<p:dataTable id="deductionclausetbl" var="deductionclauseList"
				value="#{bsvAttendanceBackingBean.managedBean.briefingAttendanceList}"
				rows="10">
				<ac:paginator for="deductId" />

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.ded.clause']}">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.ded.desp']}">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<p:spacer height="20px" />
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.loiloa.add']}" process="@this"
					partialSubmit="true" icon="ui-icon-add" />
				<p:commandButton value="#{lbl['lbl.sc.loiloa.delete']}"
					process="@this" partialSubmit="true" icon="ui-icon-delete" />
			</div>
		</p:panel>
	</p:panel>

</ui:composition>
