<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Supplier Payment Information" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="Account No" />
			</h:column>
			<h:column>
				<p:selectOneMenu
					value="#{lOADetailBackingBean.managedBean.scQtSpec.approverName}">
					<f:selectItem itemLabel="" itemValue="1" />
				</p:selectOneMenu>
			</h:column>

			<h:column>
				<h:outputLabel value="Bank Name" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Bank Branch" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Bank Address" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
		</h:panelGrid>
	</p:panel>
	<p:panel header="Deduction Payment" toggleable="true">
		<p:panel header="Deduction Payment" toggleable="false">
			<p:dataTable id="deductionpaymenttbl" var="deductionpaymentList"
				value="#{bsvAttendanceBackingBean.managedBean.briefingAttendanceList}"
				rows="10">

				<p:column headerText="Deduction Type">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="Description">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="Percentage">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="Amount">
					<p:inputText value="" />
				</p:column>

			</p:dataTable>
		</p:panel>
		<p:panel header="Deduction Clause" toggleable="false">
			<p:dataTable id="deductionclausetbl" var="deductionclauseList"
				value="#{bsvAttendanceBackingBean.managedBean.briefingAttendanceList}"
				rows="10">

				<p:column headerText="Deduction Clause">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="Description">
					<p:inputText value="" />
				</p:column>

				<p:column headerText="Action">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="edit.png"
							value="/resources/ep/images/design/edit.png" />
					</p:commandLink>
				</p:column>

			</p:dataTable>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.sc.bsv.attendance.add']}"
					process="@this" partialSubmit="true" icon="ui-icon-add"/>
				<p:commandButton value="Delete" process="@this" partialSubmit="true" icon="ui-icon-delete"/>
			</div>
		</p:panel>
	</p:panel>

</ui:composition>
