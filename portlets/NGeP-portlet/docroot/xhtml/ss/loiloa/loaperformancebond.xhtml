<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Performance Bond" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="Required Performance Bond" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>

			<h:column>
				<h:outputLabel value="Bond Duration (Days)" />
			</h:column>
			<h:column>
				<p:inputText value="30" />
			</h:column>
			<h:column>
				<h:outputLabel value="Bond Amount (RM)" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Percentage Bond" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
		</h:panelGrid>
	</p:panel>
	<p:dataTable id="itemlisttbl" var="itemList"
		value="#{bsvAttendanceBackingBean.managedBean.briefingAttendanceList}"
		rows="10">

		<p:column headerText="Reference No">
			<p:inputText value="" />
		</p:column>

		<p:column headerText="Financial Institution">
			<p:inputText value="" />
		</p:column>

		<p:column headerText="Amount">
			<p:inputText value="" />
		</p:column>

		<p:column headerText="Effective Date">
			<p:inputText value="" />
		</p:column>

		<p:column headerText="Expiry Date">
			<p:inputText value="" />
		</p:column>

		<p:column headerText="Attachment">
			<p:inputText value="" />
		</p:column>

		<p:column headerText="Action">
			<!-- <p:commandLink>
				<p:graphicImage library="ep/images/design" name="edit.png"
					value="/resources/ep/images/design/edit.png" />
			</p:commandLink> -->
			<p:commandLink>
				<p:graphicImage library="ep/images/design" name="delete.png"
					value="/resources/ep/images/design/delete.png" />
			</p:commandLink>

		</p:column>
	</p:dataTable>
	<div align="right">
		<p:commandButton value="#{lbl['lbl.sc.bsv.attendance.add']}"
			process="@this" partialSubmit="true" />
	</div>
</ui:composition>
