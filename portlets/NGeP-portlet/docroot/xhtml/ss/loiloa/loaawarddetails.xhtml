	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Award Details" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="Award Type" />
			</h:column>
			<h:column>
				<p:inputText value="1" disabled="true" />
			</h:column>
			<h:column />
			<h:column />
		</h:panelGrid>
	</p:panel>
	<p:panel>
		<h:panelGroup>
			<p:spacer height="20px" />
			<p:commandLink value="Location List" />
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
				columns="2" columnClasses="columnWidth20,columnWidth30">
				<h:outputLabel value="#{lbl['lbl.sc.loiloa.multiple.locality']}" />
				<p:inputText
					value="#{lOADetailBackingBean.managedBean.scQtCriteria.multiLocality ? 'Yes' : 'No'}"
					readonly="true" disabled="true" size="6"></p:inputText>
				<!-- <p:inputText value="#{lOADetailBackingBean.managedBean.status}"
					readonly="true" /> -->
			</h:panelGrid>
			<h:panelGroup>
				<p:dataTable id="zoneId" var="zone"
					value="#{lOADetailBackingBean.managedBean.zonelist}" rows="10"
					rowIndexVar="rowIndex" style="width:35%">
					<!-- <ac:paginator for="zoneId" /> -->

					<p:column headerText="#{lbl['lbl.sc.loiloa.location']}">
						<p:commandLink onclick="zonePopUp.show();">
							<h:outputText value="#{zone.zoneName}" />
						</p:commandLink>
					</p:column>
				</p:dataTable>
			</h:panelGroup>
			<p:spacer height="35px" />
			<p:commandLink value="Item List" />
			<p:dataTable id="itemtbl" var="itemList"
				value="#{lOIDetailBackingBean.managedBean.scQtItemList}" rows="10"
				rowIndexVar="rowIndex">
				<p:column headerText="#{lbl['lbl.sc.loiloa.item']}">
					<h:outputText value="#{itemList.itemName}" />
					<!-- <h:outputText value="item1" /> -->
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.uom']}">
					<h:outputText value="#{itemList.pmUom.uomName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.item.award.by']}">
					<h:outputText value="item" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.value']}">
					<h:outputText value="1234" />
				</p:column>

			</p:dataTable>
			<p:spacer height="25px" />
		</h:panelGroup>
	</p:panel>

	<p:dialog id="zonePopUpId" widgetVar="zonePopUp" modal="true">
		<p:panel toggleable="true">
			<h:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="Zone Name" />
				<p:inputText readonly="true" />
			</h:panelGrid>
			<h:panelGroup style="width:100%;">
				<p:dataTable value="" var="">
					<p:column headerText="Location Name" />

			</h:panelGroup>
