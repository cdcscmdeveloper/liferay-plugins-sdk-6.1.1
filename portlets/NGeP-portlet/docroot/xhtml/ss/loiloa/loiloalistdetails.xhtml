<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
		<p:panel header="Award Details" toggleable="true">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" columnClasses="columnWidth20">

				<h:column>
					<h:outputLabel value="Award Type" />
				</h:column>
				<h:column>
					<p:inputText
						value="#{loiLoaDetailBackingBean.managedBean.scQtSpec.awardType}"
						disabled="true" />
				</h:column>
			</h:panelGrid>
		</p:panel>
		<p:panel header="Recommended Supplier List" toggleable="false">
			<p:dataTable id="list" var="proposalRankingList"
				value="#{loiLoaDetailBackingBean.managedBean.scQtProposalRankingList}"
				rows="10" rowIndexVar="rowIndex">

				<p:column headerText="Supplier Name" style="width:40%">
					<h:outputText
						value="#{proposalRankingList.scQtProposal.scQtSupplier.smSupplier.supplierName}" />
				</p:column>

<!-- 				<p:column headerText="MOF No" style="width:20%">
					<h:outputText
						value="#{loiLoaDetailBackingBean.managedBean.smMofAccount.mofNo}" />
				</p:column> -->

				<p:column headerText="LOI Status" style="width:20%">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="LOA Status" style="width:20%">
					<h:outputText value="" />
				</p:column>

				<p:column headerText="Action" style="width:20%">
					<p:commandButton value="LOI"
						action="#{lOIDetailBackingBean.createLOIAction(proposalRankingList, doctype)}" />
					<p:commandButton value="LOA"
						action="#{lOADetailBackingBean.createLOAAction(proposalRankingList, doctype)}" />
				</p:column>

			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
