<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	<ui:param name="scQt" value="#{loiLoaDetailBackingBean.managedBean.qt}" />
		<ui:include src="/xhtml/ss/common/commonHeader.xhtml" />
		<p:panel header="#{lbl['lbl.sc.loiloa.award.details']}"
			toggleable="true">
			<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
				columns="2" columnClasses="columnWidth20">

				<h:column>
					<h:outputLabel value="#{lbl['lbl.sc.loiloa.award.type']}" />
				</h:column>
				<h:column>
					<p:inputText value="#{loiLoaDetailBackingBean.managedBean.qt.awardType}" disabled="true" />

				</h:column>
			</h:panelGrid>
		</p:panel>
		<p:panel header="#{lbl['lbl.sc.loiloa.recom.supp.list']}"
			toggleable="false">
			<p:dataTable id="list" var="evaluationResultList"
				value="#{loiLoaDetailBackingBean.managedBean.scQtEvaluationResultList}"
				rows="10" rowIndexVar="rowIndex">

				<p:column headerText="#{lbl['lbl.sc.loiloa.supp.name']}"
					style="width:40%">
					<h:outputText
						value="#{evaluationResultList.scQtProposal.scQtSupplier.smSupplier.companyName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loi.status']}"
					style="width:20%">
					<h:outputText value="#{evaluationResultList.loi.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.loa.status']}"
					style="width:20%">
					<h:outputText value="#{evaluationResultList.loa.pmStatus.pmStatusDescs[0].statusName}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.sc.loiloa.action']}"
					style="width:20%">
					<p:commandButton value="#{lbl['lbl.sc.loiloa.loi']}"
						action="#{lOIDetailBackingBean.createLOIAction(evaluationResultList, doctype)}" />
					<p:commandButton value="#{lbl['lbl.sc.loiloa.loa']}"
						action="#{lOADetailBackingBean.createLOAAction(evaluationResultList, doctype)}" />
				</p:column>

			</p:dataTable>
		</p:panel>
	</ui:define>
</ui:composition>
