<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />
	<p:panel header="Supplier Details" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="MOF No." />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.smMofAccount.mofNo}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Supplier Name" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierName}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Branch" />
			</h:column>
			<h:column>
				<!-- 				<p:selectOneMenu
					value="#{lOIDetailBackingBean.managedBean.scQtSpec.approverAction}">
					<f:selectItem itemLabel="HQ" itemValue="1" />
				</p:selectOneMenu>
 -->
				<!-- <p:selectOneMenu
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierName}"
					styleClass="minstryclass" style="width: 124px;">
					<f:selectItem itemLabel="Select One" itemValue="#{null}" />
					<f:selectItems
						value="#{lOIDetailBackingBean.managedBean.branchsList}"
						var="brList" itemLabel="#{brList.branchName}"
						itemValue="#{brList.branchName}" />
				</p:selectOneMenu> -->
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Address" />
			</h:column>
			<h:column>
				<p:inputTextarea rows="3" cols="30" autoResize="false"
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierAddress}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Contact Person" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column />
			<h:column />

			<h:column>
				<h:outputLabel value="Tel No (Office)" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierPhoneNo}"
					disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Fax No" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.supplierFaxNo}"
					disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Tel No (HP)" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Email" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Remark" />
			</h:column>
			<h:column>
				<p:inputTextarea rows="3" cols="30" autoResize="false"
					value="#{lOIDetailBackingBean.managedBean.scLoi.ackRemark}" />
			</h:column>
		</h:panelGrid>
	</p:panel>
	<p:panel header="LOI Details" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputLabel value="LOI Title" />
			</h:column>
			<h:column>
				<p:inputText value="#{lOIDetailBackingBean.managedBean.scLoi.title}"
					size="103" />
			</h:column>
		</h:panelGrid>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="LOI No" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column/>
			<h:column/>
			<h:column>
				<h:outputLabel value="File No." />
			</h:column>
			<h:column>
				<p:inputText value="#{lOIDetailBackingBean.managedBean.qt.fileNo}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="LOI Issue Date" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.issueDate}"
					disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Remark" />
			</h:column>
			<h:column>
				<p:inputTextarea rows="3" cols="30" autoResize="false"
					value="#{lOIDetailBackingBean.managedBean.scLoi.remark}" />
			</h:column>
			<h:column>
				<h:outputLabel value="LOI Duration (Days)" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.loiDuration}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
		</h:panelGrid>
	</p:panel>
	<p:panel header="Officer Details" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="Name" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.officierName}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Designation" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.officerDesignation}"
					disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Address" />
			</h:column>
			<h:column>
				<p:inputTextarea rows="3" cols="30" autoResize="false"
					value="#{lOIDetailBackingBean.managedBean.scLoi.officerAddress}" disabled="true" />
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Tel No" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.officerPhoneNo}"
					disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Fax No" />
			</h:column>
			<h:column>
				<p:inputText
					value="#{lOIDetailBackingBean.managedBean.scLoi.officerFaxNo}"
					disabled="true" />
			</h:column>
			<h:column>
				<h:outputLabel value="Email" />
			</h:column>
			<h:column>
				<p:inputText value="" disabled="true" />
			</h:column>
			<h:column />
			<h:column />
		</h:panelGrid>
	</p:panel>
	<p:panel header="Approval Details" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel value="Approval LOI Required" />
			</h:column>
			<h:column>
				<p:selectOneRadio
					value="#{lOIDetailBackingBean.managedBean.scLoi.reqApproval}">
					<f:selectItem itemLabel="Yes" itemValue="true" />
					<f:selectItem itemLabel="No" itemValue="false" />
					<p:ajax event="change" update="app, appDate, appaction, appremark" />
				</p:selectOneRadio>
			</h:column>
			<h:column />
			<h:column />
			<h:column>
				<h:outputLabel value="Approver" />
			</h:column>
			<h:column>
				<p:selectOneMenu id="app"
					value="#{lOIDetailBackingBean.managedBean.scQtSpec.approverName}">
					<f:selectItems value="#{lOIDetailBackingBean.approverNames}" />
				</p:selectOneMenu>
			</h:column>
			<h:column>
				<h:outputLabel value=" Approval Date : " />
			</h:column>
			<h:column>
				<p:inputText id="appDate" readonly="true" disabled="true"
					value="#{lOIDetailBackingBean.managedBean.scLoi.approverActionDate}"></p:inputText>
			</h:column>
			<h:column>
				<h:outputLabel value=" Approver Action : " />
			</h:column>
			<h:column>
				<p:selectOneMenu id="appaction"
					value="#{lOIDetailBackingBean.managedBean.scLoi.approverAction}">
					<f:selectItem itemLabel="Approver" itemValue="1" />
					<f:selectItem itemLabel="Revise" itemValue="2" />
				</p:selectOneMenu>
			</h:column>
			<h:column>
				<h:outputLabel value=" Approval  Remarks : " />
			</h:column>
			<h:column>
				<p:inputTextarea id="appremark" rows="3" cols="30"
					value="#{lOIDetailBackingBean.managedBean.scLoi.approverRemark}"
					autoResize="false"></p:inputTextarea>
			</h:column>
		</h:panelGrid>
	</p:panel>
</ui:composition>
