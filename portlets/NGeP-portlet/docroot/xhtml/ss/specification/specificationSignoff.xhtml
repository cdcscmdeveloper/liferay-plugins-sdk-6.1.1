<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="SIGN-OFF" toggleable="true">

		<p:dataTable id="specificationSignOff" var="scCommittee"
			value="#{specificationBackingBean.managedBean.committeeMemberList}"
			rowKey="#{scCommittee.committeeMemberId}" rowIndexVar="index"
			style="width:100%">
			<ac:paginator for="specificationSignOff" />
			<p:column headerText="Committee Member" style="width:60%">
				<h:outputText value="#{scCommittee.memberName}"></h:outputText>
			</p:column>
			<p:column headerText="Sign-Off" style="width:50%">
				<h:outputText value="#{scCommittee.memberName}"></h:outputText>
			</p:column>
			<p:column headerText="Action" style="width:30%">
				<h:outputText value="(sign#{index+1})"></h:outputText>
			</p:column>

		</p:dataTable>
		<p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="SEND REMINDER" onclick="reminder.show();" />

		</div>
	</p:panel>

</ui:composition>
