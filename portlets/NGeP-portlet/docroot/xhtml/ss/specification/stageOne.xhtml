<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:panel header="STAGE ONE(TECHNICAL)" toggleable="true">
		<p:commandLink value="Proposal Checklist"></p:commandLink>

		<p:dataTable id="compilence" var="stageoneTechnical"
			value="#{specificationBackingBean.managedBean.scQtCheckSt1techProposal}"
			editable="true" rowIndexVar="index" style="width:100%"
			selection="#{specificationBackingBean.selectedst1TechProposal}" rowKey="{stageoneTechnical.qtChecklistId">
           <ac:paginator for="compilence" />

       <!--   <p:column selectionMode="multiple"  style="text-align:center;"/>  -->
			<!-- <p:column headerText="No">
				<h:outputText value="1"></h:outputText>

				<h:outputText value="#{index+1}"></h:outputText>

			</p:column> -->

			<p:column headerText="Title" style="width:80%">
				<!-- <h:outputText value="Arjun"></h:outputText> -->

				<h:outputText value="#{stageoneTechnical.title}"></h:outputText>

			</p:column>

			<p:column headerText="Type" style="width:40%">

				<!--    <h:outputText value="4355446727" />   -->

				<h:outputText value="Upload"></h:outputText>


			</p:column>

			<p:column headerText="Sample Document" style="width:40%">
				<p:commandButton value="Upload"></p:commandButton>
			</p:column>


			<p:column headerText="Ordering">

				<!--    <h:outputText value="4355446727" />   -->

				<p:inputText value="#{stageoneTechnical.checklistSeq}"></p:inputText>
			</p:column>


			<p:column headerText="Action" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>
			<p:inputText type="hidden"
				value="#{specificationBackingBean.managedBean.scQtChecklist.docType}"></p:inputText>
			<p:inputText type="hidden"
				value="#{specificationBackingBean.managedBean.scQtChecklist.evaluationStage}"></p:inputText>
		</p:dataTable>
 <p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="ADD" process="@this" partialSubmit="true"
				onclick="compliance.show();" />
				<p:commandButton value="DELETE"  />

		</div>




		<p:commandLink value="Additional Proposal Checklist"></p:commandLink>
		<p:dataTable id="additionaltech" var="stageoneaddTechnical" rowKey="#{stageoneaddTechnical.qtChecklistId}"
			value="#{specificationBackingBean.managedBean.scQtCheckSt1techAdditionalProposalList}"
			 		selection="#{specificationBackingBean.selectedst1TechAddProposal}"
			 rowIndexVar="index" style="width:100%">
              <ac:paginator for="additionaltech" />
       <!--     <p:column selectionMode="multiple"  style="text-align:center;"/>  -->

		<!-- 	<p:column headerText="No">
				<h:outputText value="1"></h:outputText>

				<h:outputText value="#{index+1}"></h:outputText>

			</p:column> -->

			<p:column headerText="Title" style="width:80%">
				<!-- <h:outputText value="Arjun"></h:outputText> -->

				<p:inputText value="#{stageoneaddTechnical.title}" size="50"></p:inputText>

			</p:column>

			<p:column headerText="Type" style="width:40%">

				<!--    <h:outputText value="4355446727" />   -->

				<h:outputText value="Upload"></h:outputText>


			</p:column>
			<p:column headerText="Sample Document" style="width:40%">
				<p:commandButton value="Upload"></p:commandButton>
			</p:column>


			<p:column headerText="Ordering">

				<!--    <h:outputText value="4355446727" />   -->

				<p:inputText value="#{stageoneaddTechnical.checklistSeq}"></p:inputText>
			</p:column>


			<p:column headerText="Action" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>

		</p:dataTable>
 <p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="ADD" process="@this,additionaltech"
				partialSubmit="true"
				action="#{specificationBackingBean.stageOneAdditionalAdd}"
				update="additionaltech" />
				<p:commandButton value="DELETE"  />

		</div>

	</p:panel>






	<p:panel header="STAGE ONE(FINANCIAL)" toggleable="true">
		<p:commandLink value="Proposal Checklist"></p:commandLink>

             <ac:paginator for="financeProposal" />
    <!--    <p:column selectionMode="multiple"  style="text-align:center;"/> -->

				<h:outputText value="1"></h:outputText>

		<p:commandLink value="Additional Proposal Checklist"></p:commandLink>

			 rowKey="#{stageonefinanceAdd.qtChecklistId}" selection="#{specificationBackingBean.selectedst1FinanceAddProposal}"
			editable="true" style="width:100%" rowIndexVar="index">
              <ac:paginator for="financeAdditional" />
     <!--    <p:column selectionMode="multiple"  style="text-align:center;"/> -->

		<!-- 	<p:column headerText="No">
				<h:outputText value="1"></h:outputText>

				<h:outputText value="#{index+1}"></h:outputText>

			</p:column> -->

			<p:column headerText="Title" style="width:80%">

				<p:inputText value="#{stageonefinanceAdd.title}" size="50"></p:inputText>

			</p:column>

			<p:column headerText="Type" style="width:40%">

				<!--    <h:outputText value="4355446727" />   -->

			</p:column>
			<p:column headerText="Sample Document" style="width:40%">

				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="ADD" process="@this,financeAdditional"
				partialSubmit="true"
				action="#{specificationBackingBean.stageOneFiAdditioalProposalAdd}"
				update="financeAdditional" />

		</div>




		<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td">


			<h:outputText value="Sample Product Required" />


			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.scQtSpec.sampleReq}">
				<f:selectItem itemLabel="Yes" itemValue="true"/>
				<f:selectItem itemLabel="No" itemValue="false"/>

			</p:selectOneRadio>

			<h:outputText value="Sample Closing Date Time" />


			<p:calendar
				value="#{specificationBackingBean.managedBean.scQtSpec.approvalDate}"
				showOn="button"></p:calendar>


			<h:outputText value="Sample Product Information" />


			<p:inputTextarea rows="3" cols="40"
				
				autoResize="false"></p:inputTextarea>



		</h:panelGrid>


	</p:panel>
