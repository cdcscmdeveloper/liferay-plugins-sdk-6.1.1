<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.stage.technical']}" toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.spec.stage.proposal.checklist']}"></p:commandLink>

		<p:dataTable id="compilence" var="stageoneTechnical"
			value="#{specificationBackingBean.managedBean.scQtCheckSt1techProposal}"
			editable="true" rowIndexVar="index" style="width:100%"
			selection="#{specificationBackingBean.selectedst1TechProposal}"
			rowKey="{stageoneTechnical}">
			<ac:paginator for="compilence" />

			<p:column selectionMode="multiple" style="text-align:center;" />

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">
				<h:outputText value="#{stageoneTechnical.title}"></h:outputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<h:outputText value="Upload"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}" style="width:40%">
				<ui:include src="/xhtml/ss/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadDlg.show();return false;"
					update="compilence">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageoneTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageoneTechnical.scQtCheckListAttachment.fileName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">
				<p:inputText value="#{stageoneTechnical.checklistSeq}"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this" partialSubmit="true"
				onclick="compliance.show();" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>

<p:commandLink value="#{lbl['lbl.sc.spec.stage.addproposal.checklist']}"></p:commandLink>
<p:dataTable id="additionaltech" var="stageoneaddTechnical"
			rowKey="#{stageoneaddTechnical}"
			value="#{specificationBackingBean.managedBean.scQtCheckSt1techAdditionalProposalList}"
			selection="#{specificationBackingBean.selectedst1TechAddProposal}"
			rowIndexVar="index" style="width:100%">
			<ac:paginator for="additionaltech" />
			<p:column selectionMode="multiple" style="text-align:center;" />

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">

				<p:inputText value="#{stageoneaddTechnical.title}" size="50"></p:inputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<h:outputText value="Upload"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}" style="width:40%">
				<ui:include src="/xhtml/ss/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS1TechAdd.show();return false;"
					update="additionaltech">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageoneaddTechnical}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageoneaddTechnical.scQtCheckListAttachment.fileName}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">
				<p:inputText value="#{stageoneaddTechnical.checklistSeq}"></p:inputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>

		</p:dataTable>
		<p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,additionaltech"
				partialSubmit="true"
				action="#{specificationBackingBean.stageOneAdditionalAdd}"
				update="additionaltech" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>

	</p:panel>
	<p:panel header="#{lbl['lbl.sc.spec.stage.financial']}" toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.spec.stage.proposal.checklist']}"></p:commandLink>
		<p:dataTable id="financeProposal" var="stageonefinanceProp"
			value="#{specificationBackingBean.managedBean.scQtCheckSt1financeProposalList}"
			rowKey="#{stageonefinanceProp}"
			selection="#{specificationBackingBean.selectedst1FinanceProposal}"
			style="width:100%" rowIndexVar="index">
			<ac:paginator for="financeProposal" />
			<p:column selectionMode="multiple" style="text-align:center;" />
			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">
				<p:inputText value="#{stageonefinanceProp.title}" size="50"></p:inputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<h:outputText value="Upload"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}" style="width:40%">
				<ui:include src="/xhtml/ss/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS1Fin.show();return false;"
					update="financeProposal">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageonefinanceProp}"

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageonefinanceProp.scQtCheckListAttachment.fileName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">
				<p:inputText value="#{stageonefinanceProp.checklistSeq}"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,financeProposal"
				partialSubmit="true"
				action="#{specificationBackingBean.stageOneFiProposalAdd}"
				update="financeProposal" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>

		<p:commandLink value="#{lbl['lbl.sc.spec.stage.addproposal.checklist']}"></p:commandLink>
		<p:dataTable id="financeAdditional" var="stageonefinanceAdd"
			value="#{specificationBackingBean.managedBean.scQtCheckSt1financeAdditionalProposalList}"
			rowKey="#{stageonefinanceAdd}"
			selection="#{specificationBackingBean.selectedst1FinanceAddProposal}"
			editable="true" style="width:100%" rowIndexVar="index">
			<ac:paginator for="financeAdditional" />
			<p:column selectionMode="multiple" style="text-align:center;" />

			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">
				<p:inputText value="#{stageonefinanceAdd.title}" size="50"></p:inputText>

			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<h:outputText value="Upload"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}" style="width:40%">
				<ui:include src="/xhtml/ss/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS1FinAdd.show();return false;"
					update="financeAdditional">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageonefinanceAdd}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageonefinanceAdd.scQtCheckListAttachment.fileName}"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">
				<p:inputText value="#{stageonefinanceAdd.checklistSeq}"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,financeAdditional"
				partialSubmit="true"
				action="#{specificationBackingBean.stageOneFiAdditioalProposalAdd}"
				update="financeAdditional" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>
		<h:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
			<h:outputText value="#{lbl['lbl.sc.spec.stage.sample.product']}" />
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.scQtSpec.sampleReq}">
				<f:selectItem itemLabel="Yes" itemValue="true" />
				<f:selectItem itemLabel="No" itemValue="false" />
			</p:selectOneRadio>
			<h:outputText value="#{lbl['lbl.sc.spec.stage.sample.date.time']}" />
			<p:calendar
				value="#{specificationBackingBean.managedBean.scQtSpec.approvalDate}"
				showOn="button"></p:calendar>
			<h:outputText value="#{lbl['lbl.sc.spec.stage.sample.info']}" />
			<p:inputTextarea rows="3" cols="40" autoResize="false"></p:inputTextarea>
		</h:panelGrid>
	</p:panel>
</ui:composition>
