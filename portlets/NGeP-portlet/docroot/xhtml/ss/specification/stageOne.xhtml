<p:commandLink value="Proposal Checklist"></p:commandLink>

<p:dataTable id="compilence"  var="stageoneTechnical" value="#{specificationBackingBean.managedBean.scQtCheckSt1techProposal}" editable="true" rowIndexVar="index" style="width:100%">



<p:column headerText="No" >
<!-- <h:outputText value="1"></h:outputText> -->

</p:column>

						<!-- <h:outputText value="Arjun"></h:outputText> -->

				</p:commandLink>

         <p:inputText type="hidden" value="#{specificationBackingBean.managedBean.scQtChecklist.evaluationStage}"></p:inputText>
</p:dataTable>
       

	       <div align="right"  >
