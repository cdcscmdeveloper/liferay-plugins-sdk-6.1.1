<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel>
<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="Save" />
				
			<ui:repeat var="action" value="#{specificationBackingBean.managedBean.outComes}">
							<p:commandButton value="#{action}" process="@all"
								styleClass="ui-button"
								actionListener="#{specificationBackingBean.updateBpmTask(action)}"  icon="ui-icon-submit"/>
						</ui:repeat>
						</p:column>
						</p:row>
		</p:panelGrid>

</p:panel>

	</ui:composition>
