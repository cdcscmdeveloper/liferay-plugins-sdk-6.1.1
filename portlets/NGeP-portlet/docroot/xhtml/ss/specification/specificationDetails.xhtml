	<p:panel header="SPECIFICATION DETAILS" toggleable="true">

		<h:panelGrid columns="4" style="width:100%;"
			columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30"
			styleClass="noBorders tr,noBorders td">
			<h:outputLabel value="*Procurement Category:" />
			<p:selectOneMenu
				value="#{specificationBackingBean.managedBean.scQtSpec.pmProcurementCategory.procurementCategoryId}">
				<f:selectItem itemLabel="01 kawalan keselamatan" itemValue="1" />
				<f:selectItem itemLabel="02 kawalan keselamatan" itemValue="2" />

			</p:selectOneMenu>
			<h:outputLabel value="Max.Proposaal:" />
			<p:inputText
				value="#{specificationBackingBean.managedBean.scQtSpec.maxProposal}"></p:inputText>


			<h:outputLabel value="* Evaluation TYpe : " />
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.scQtSpec.evaluationType}">
				<f:selectItem itemLabel="One Tier" itemValue="1" />
				<f:selectItem itemLabel="Two Tier" itemValue="2" />

			</p:selectOneRadio>
			<h:outputLabel value="Award Type : " />
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.scQtSpec.awardType}">
				<f:selectItem itemLabel="By LineItem" itemValue="1" />
				<f:selectItem itemLabel="By Package" itemValue="2" />

			</p:selectOneRadio>

			<h:outputLabel value="* Fulfillment TYpe : " />
			<p:selectOneMenu
				value="#{specificationBackingBean.managedBean.scQtSpec.fulfilmentType}">
				<f:selectItem itemLabel="One-Off" itemValue="1" />
				<f:selectItem itemLabel="Periodic" itemValue="2" />
				<f:selectItem itemLabel="Periodic(Schedule)" itemValue="3" />
			</p:selectOneMenu>

			<h:outputLabel value="Currency : " />
			<p:selectOneMenu
				value="#{specificationBackingBean.managedBean.scQtSpec.pmCurrency.currencyCode}">
				<f:selectItem itemLabel="RM" itemValue="1" />
				<f:selectItem itemLabel="$" itemValue="2" />
			</p:selectOneMenu>
			<h:outputLabel value="*Planned Amount: " />
			<p:inputText
				value="#{specificationBackingBean.managedBean.scQtSpec.scQt.qtAmount}"></p:inputText>
			<h:outputLabel value=" Justification: " />
			<p:inputText
				value="#{specificationBackingBean.managedBean.scQtSpec.justificationRemark}"></p:inputText>


			<h:outputLabel value="Required Approval : " />
			<p:selectOneRadio
				value="#{specificationBackingBean.managedBean.scQtSpec.isApprovalReq}">
				<f:selectItem itemLabel="Yes" itemValue="1" />
				<f:selectItem itemLabel="No" itemValue="2" />

			</p:selectOneRadio>


			<h:outputLabel value="Status: " />
			<p:inputText
				value="#{specificationBackingBean.managedBean.scQtSpec.statusId}"></p:inputText>


			<h:outputLabel value="*Contract Period : " />
			<h:panelGroup>

				<h:inputText size="4"
					value="#{specificationBackingBean.managedBean.scQtSpec.contractDuration}"></h:inputText>
				<h:outputLabel value="(Year)" />

				<h:inputText size="2"
					value="#{specificationBackingBean.managedBean.scQtSpec.contractDuration}"></h:inputText>
				<h:outputLabel value="(Month)" />
			</h:panelGroup>


		</h:panelGrid>

	<p:panel id="deduction" header="Deduction Payment Details"
		toggleable="true">
		<p:dataTable var="specificationdetails"
			value="#{specificationBackingBean.managedBean.scQtDeductionList}"
			editable="true" rowIndexVar="index">


			<p:column headerText="No">
				<h:outputText value="#{index+1}"></h:outputText>
			</p:column>

			<p:column headerText="Type Of Deduction">

				<p:inputText value="#{specificationdetails.deductionType}" />

			</p:column>
			<!-- 
			<p:column headerText="Fixed/Variable">


				<p:inputText
					value="#{specificationdetails.isFixed}" />


			</p:column> -->

			<p:column headerText="Amount">

				<p:inputText value="#{specificationdetails.deductionAmount}" />

			</p:column>
			<p:column headerText="Action" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>

		</p:dataTable>
		<div align="right">
			<p:commandButton value="ADD" process="@this,deduction"
				partialSubmit="true"
				action="#{specificationBackingBean.specificAdd}" update="deduction" />

		</div>

	</p:panel>




	<p:panel header="APPROVAL DETAILS SECTION" toggleable="true">

		<h:panelGrid style="width:100%;" columns="4"
			
			styleClass="noBorders tr,noBorders td">


			<h:outputLabel value="Approver Name: " />

			<p:selectOneMenu
				value="#{specificationBackingBean.managedBean.scQtSpec.approverName}">
				<f:selectItem itemLabel="Rostima" itemValue="1" />
				<f:selectItem itemLabel="Gustia" itemValue="2" />
			</p:selectOneMenu>

			<h:outputLabel value=" Approval Date : " />

			<p:calendar
				value="#{specificationBackingBean.managedBean.scQtSpec.approvalDate}"
				showOn="button"></p:calendar>


			<h:outputLabel value=" Approver Action : " />
				
					<p:selectOneMenu
				value="#{specificationBackingBean.managedBean.scQtSpec.approverAction}">
				<f:selectItem itemLabel="Approver" itemValue="1" />
				<f:selectItem itemLabel="Revise" itemValue="2" />
			</p:selectOneMenu>

			<h:outputLabel value=" Approval  Remarks : " />


			<p:inputTextarea rows="3" cols="40"
				value="#{specificationBackingBean.managedBean.scQtRemarks.remark}"
				autoResize="false"></p:inputTextarea>



			</h:panelGrid>
	</p:panel>

</ui:composition>
