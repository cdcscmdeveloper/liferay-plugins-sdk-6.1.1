<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">





	<p:panel header="#{lbl['lbl.sc.spec.weight.tech']}" toggleable="true">
	
	<h:panelGrid columns="3" id="weightage" rendered="#{specificationBackingBean.managedBean.scQtSpec.evaluationType eq'2'}">

			
					<h:outputText value="Passing Score(%)" />
			
					<p:inputText  ></p:inputText>
			        <h:outputText value="/100 "/>

	
		</h:panelGrid>
	
		<p:dataTable id="technicalWeigtage" var="Technical" 
			  value="#{specificationBackingBean.managedBean.weightageTechnical}" 
			 selection="#{specificationBackingBean.managedBean.weightageTechnicalSelect}" rowIndexVar="index"
			 editable="true"
			  rowkey="#{Technicall}">
			 <ac:paginator for="technicalWeigtage"></ac:paginator>
		<!--  <p:column selectionMode="multiple" style="width:2%;"/> -->
			<p:column headerText="#{lbl['lbl.sc.spec.weight.weight']}">
				<p:inputText value="#{Technical.weightageTitle}" size="50"/>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.weight.percent']}">
				<p:inputText value="#{Technical.weightagePercentage}" />
			</p:column>
			<!-- <p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
			</p:column> -->

		</p:dataTable>
      <p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,technicalWeigtage" partialSubmit="true"
			action="#{specificationBackingBean.weightageTechnical}"  icon="ui-icon-add" update="technicalWeigtage" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"  icon="ui-icon-delete"/>

		</div>
	</p:panel>





	

		<h:panelGrid columns="3">

			
					<h:outputText value="#{lbl['lbl.sc.spec.weight.total']} " />
			
					<p:inputText  readonly="true" disabled="true"></p:inputText>
			         <h:outputText value="/100 " />


		</h:panelGrid>






	<p:panel header="#{lbl['lbl.sc.spec.weight.finnance']}" toggleable="true">
		<p:dataTable id="financialweightage" var="financial" 
			 editable="true" value="#{specificationBackingBean.managedBean.weightageFinancial}" 
			 selection="#{specificationBackingBean.managedBean.weightageFinancialSelect}" rowIndexVar="index"
			  rowkey="#{financial}">

       <ac:paginator for="financialweightage"></ac:paginator>
          <!-- 	 <p:column selectionMode="multiple" style="width:2%;"/>  -->
			<p:column headerText="#{lbl['lbl.sc.spec.weight.weight']}">
				<p:inputText value="#{financial.weightageTitle}" size="50" />
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.weight.percent']}">
				<p:inputText value="#{financial.weightagePercentage}" />
			</p:column>
		<!-- 	<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
			</p:column> -->

		</p:dataTable>
		 <p:spacer height="15"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,financialweightage" partialSubmit="true"
			action="#{specificationBackingBean.weightageFinancial}"	 icon="ui-icon-add" update="financialweightage"/>
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}"  icon="ui-icon-delete"/>

		</div>
	</p:panel>





	<p:panel>

		<h:panelGrid columns="3">

			
					<h:outputText value="#{lbl['lbl.sc.spec.weight.total']} " />
				
					<p:inputText readonly="true" disabled="true"></p:inputText>
			
                     <h:outputText value="/100 " />




		</h:panelGrid>

	</p:panel>






</ui:composition>
