<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="Committee" widgetVar="reminder" modal="true"
		width="600" height="250">
		<p:panel header="Committee" toggleable="true">
			<p:dataTable var="reminderpopup"
				value="#{searchQtnTenderBB.managedBean.qtnTenders}" editable="true">

				<p:column headerText="Committee Name" style="width:100%">
					<h:outputText value="readOnly"></h:outputText>
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:panel header="COMMITTEE DETAILS" toggleable="true">
			<p:panelGrid styleClass="noBorders tr,noBorders td">

				<p:row>
					<p:column>
						<h:outputLabel value="Subject" />
					</p:column>
					<p:column>
						<p:inputText size="50"></p:inputText>
					</p:column>
				</p:row>

				<p:row>
					<p:column>
						<h:outputLabel value="Message" />
					</p:column>
					<p:column>
						<p:inputTextarea rows="5" cols="40"></p:inputTextarea>
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:panel>


		<p:commandButton value="SEND" style="float:right;"
			onclick="reminder.hide();"></p:commandButton>
				&#160;&#160;
				<p:commandButton value="CANCEL" style="float:right;"
			onclick="reminder.hide();"></p:commandButton>


	</p:dialog>
</ui:composition>
