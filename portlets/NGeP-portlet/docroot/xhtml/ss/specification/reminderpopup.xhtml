<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="Committee" widgetVar="reminder" modal="true"
		width="600" height="250">
		<p:panel header="#{lbl['lbl.sc.spec.committee']}" toggleable="true">
			<p:dataTable id="specificationReminder" var="reminderpopup"
				editable="true">
				<ac:paginator for="specificationReminder" />
				<p:column headerText="#{lbl['lbl.sc.spec.committee.name']}" style="width:100%">
					<h:outputText value="readOnly"></h:outputText>
				</p:column>

			</p:dataTable>
		</p:panel>

		<p:panel header="#{lbl['lbl.sc.spec.committee.details']}" toggleable="true">
			<h:panelGrid styleClass="noBorders tr,noBorders td" columns="2">


				<h:outputLabel value="#{lbl['lbl.sc.spec.committee.subject']}" />

				<p:inputText size="50"></p:inputText>

				<h:outputLabel value="#{lbl['lbl.sc.spec.committee.message']}" />

				<p:inputTextarea rows="5" cols="50"></p:inputTextarea>

			</h:panelGrid>
		</p:panel>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}" style="float:right;"
				onclick="reminder.hide();" icon="ui-icon-cancel"></p:commandButton>

			<p:commandButton value="#{lbl['lbl.sc.spec.committee.btn.send']}" style="float:right;"
				onclick="reminder.hide();"></p:commandButton>
		</div>

	</p:dialog>
</ui:composition>
