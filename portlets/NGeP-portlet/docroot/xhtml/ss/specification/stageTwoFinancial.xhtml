<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:dialog header="Compilance" widgetVar="stageTwoFinance" modal="true"
		width="400" height="200">
		<p:panel header="#{lbl['lbl.sc.spec.stage.compilence']}" toggleable="true">

			<p:dataTable id="stageTwoFinPopup" var="compilance"
				value="#{specificationBackingBean.managedBean.stageTwoFinComplianceList}"
				editable="true"
				selection="#{specificationBackingBean.managedBean.stageTwoFinComplianceSelect}"
				rowKey="#{compilance.checkListCategoryId}" rowIndexVar="index">

				<p:column selectionMode="multiple" style="width:2%;text-align:center;" />
				<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}">
					<h:outputText value="#{compilance.pmCheckList.checkListName}"></h:outputText>
				</p:column>
			</p:dataTable>

		</p:panel>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.cancel']}" style="float:right;"
			onclick="stageTwoFinance.hide();" icon="ui-icon-cancel"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.ok']}" style="float:right;" process="@all"
			partialSubmit="true"
			action="#{specificationBackingBean.stageTwoFinanceCheckList}"
			oncomplete="stageTwoFinance.hide();" update="financeProposaltwo" icon="ui-icon-accept" ></p:commandButton>


	</p:dialog>
</ui:composition>
