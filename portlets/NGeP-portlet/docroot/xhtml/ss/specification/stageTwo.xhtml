	<p:panel header="STAGE TWO(TECHNICAL)" toggleable="true">
		<p:commandLink value="Proposal Checklist"></p:commandLink>
		<p:dataTable id="stageTwotechProposal" var="stageTwoTechnical"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			editable="true" style="width:100%" rowIndexVar="index">

             <p:column headerText="No">
				
             <h:outputText value="#{index+1}"></h:outputText>

			</p:column>

			<p:column headerText="Title" style="width:80%">

				<p:inputText
					value="#{stageTwoTechnical.title}" size="50"></p:inputText>

			</p:column>

			<p:column headerText="Type" style="width:40%">

				<p:selectOneMenu
					value="#{stageTwoTechnical.checklistType}">
					<f:selectItem itemLabel="Select One" itemValue=" " />
					<f:selectItem itemLabel="Specification" itemValue="1" />
					<f:selectItem itemLabel="Document" itemValue="2" />
					<f:selectItem itemLabel="System Defined" itemValue="3" />
					<f:selectItem itemLabel="Input" itemValue="4" />
					<p:ajax event="change" update="stageTwotechProposal"  process="@this" listener="#{specificationBackingBean.stageTwotechproposal}" />
				</p:selectOneMenu>

			</p:column>
			<p:column headerText="Supporting Doc">
				<h:outputText value="Yes/No"></h:outputText>

			</p:column>
			<p:column headerText="Ordering">

				<p:inputText
					value="#{stageTwoTechnical.checklistSeq}"></p:inputText>
			</p:column>

			<p:column headerText="Template Status">
				<h:outputText value="(InProgress/Completed)"></h:outputText>

			</p:column>

            </p:column> -->

					<p:graphicImage library="ep/images/design" name="edit.png"

				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>


			</p:column>

		</p:dataTable>


		<div align="right">
			<p:commandButton value="ADD" process="@this,stageTwotechProposal" partialSubmit="true"

		</div>
