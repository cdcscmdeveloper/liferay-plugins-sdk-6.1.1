<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{lbl['lbl.sc.spec.stage2.details']}" toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.spec.stage.proposal.checklist']}"></p:commandLink>
		<p:dataTable id="stageTwotechProposal" var="stageTwoTechnical"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techProposal}"
			editable="true" style="width:100%" rowIndexVar="index"
			selection="#{specificationBackingBean.selectedst2TechProposal}"
			rowKey="#{stageTwoTechnical}">
			<ac:paginator for="stageTwotechProposal" />
			<p:column selectionMode="multiple" style="text-align:center;" />
			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">
				<p:inputText value="#{stageTwoTechnical.title}" size="50"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<p:selectOneMenu value="#{stageTwoTechnical.checklistType}">
					<f:selectItem itemLabel="Select One" itemValue=" " />
					<f:selectItem itemLabel="Specification" itemValue="UP" />
					<f:selectItem itemLabel="System Defined" itemValue="SD" />
					<f:selectItem itemLabel="Web Form" itemValue="WF" />
					<!-- 	<p:ajax event="change" update="stageTwotechProposal"  process="@this" listener="#{specificationBackingBean.stageTwotechproposal}" /> -->
				</p:selectOneMenu>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">
				<p:inputText value="#{stageTwoTechnical.checklistSeq}"></p:inputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.temp.status']}">
				<h:outputText value="(InProgress/Completed)"></h:outputText>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<p:commandLink>
					<!-- <p:commandButton value="Search" process="@this" partialSubmit="true"
				onclick="qtnTndr.show();"  rendered="#{specificationBackingBean.selctValue eq '1' or specificationBackingBean.selctValue eq '2'}" /> -->
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,stageTwotechProposal"
				partialSubmit="true"
				action="#{specificationBackingBean.stageTwoTechnicalAddProposal}"
				update="stageTwotechProposal" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>

		<p:commandLink value="#{lbl['lbl.sc.spec.stage.addproposal.checklist']}"/>
		<p:dataTable id="techAdditionaltwo" var="stageTwoTechnicalAdditional"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2techAdditionalProposalList}"
			rowIndexVar="index" editable="true" style="width:100%"
			selection="#{specificationBackingBean.selectedst2TechAddProposal}"
			rowKey="#{stageTwoTechnicalAdditional}">
			<ac:paginator for="techAdditionaltwo" />
			<p:column selectionMode="multiple" style="text-align:center;" />
			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">
				<p:inputText value="#{stageTwoTechnicalAdditional.title}" size="50"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<h:outputText value="Upload"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}">
				<ui:include src="/xhtml/ss/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS2TechAdd.show();return false;"
					update="techAdditionaltwo">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener value="#{stageTwoTechnicalAdditional}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />

				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageTwoTechnicalAdditional.scQtCheckListAttachment.fileName}"></h:outputText>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.max.score']} ">

				<h:outputText value="readOnly"></h:outputText>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">
				<p:inputText value="#{stageTwoTechnicalAdditional.checklistSeq}"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<!-- <p:commandButton value="Search" process="@this" partialSubmit="true"
				onclick="qtnTndr.show();"  rendered="#{specificationBackingBean.selctValue eq '1' or specificationBackingBean.selctValue eq '2'}" /> -->
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>
			</p:column>

		</p:dataTable>
		<p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,techAdditionaltwo"
				partialSubmit="true"
				action="#{specificationBackingBean.stageTwoAdditionalAdd}"
				update="techAdditionaltwo" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>
	</p:panel>

	<p:panel header="#{lbl['lbl.sc.spec.stage2.financial']}" toggleable="true">
		<p:commandLink value="#{lbl['lbl.sc.spec.stage.proposal.checklist']}"></p:commandLink>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">

			<p:column headerText="#{lbl['lbl.sc.spec.stage2.temp.status']}">

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<!-- <p:commandButton value="Search" process="@this" partialSubmit="true"

				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"
						value="/resources/ep/images/design/edit.png" />

				</p:commandLink>
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>
			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,financeProposaltwo"
				partialSubmit="true"
				action="#{specificationBackingBean.stageTwoFiProposalAdd}"
				update="financeProposaltwo" />
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>

		<p:commandLink value="#{lbl['lbl.sc.spec.stage.addproposal.checklist']}"></p:commandLink>
		<p:dataTable id="financeAdditionaltwo"
			var="stageTwofunctionalAdditional"
			value="#{specificationBackingBean.managedBean.scQtCheckSt2financeAdditionalProposalList}"
			editable="true" style="width:100%" rowIndexVar="index"
			selection="#{specificationBackingBean.selectedst2FinanceAddProposal}"
			rowKey="#{stageTwofunctionalAdditional}">
			<ac:paginator for="financeAdditionaltwo" />
			<p:column selectionMode="multiple" style="text-align:center;" />
			<p:column headerText="#{lbl['lbl.sc.spec.stage.title']}" style="width:80%">
				<p:inputText value="#{stageTwofunctionalAdditional.title}" size="50"></p:inputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.type']}" style="width:40%">
				<h:outputText value="Upload"></h:outputText>
			</p:column>

			<p:column headerText="#{lbl['lbl.sc.spec.stage.document']}">
				<ui:include src="/xhtml/ss/specification/upload.xhtml" />
				<p:commandLink oncomplete="uploadS2FinAdd.show();return false;"
					update="financeAdditionaltwo">
					<p:graphicImage library="ep/images/design" name="upload.png"
						value="/resources/ep/images/design/upload.png" />
					<f:setPropertyActionListener
						value="#{stageTwofunctionalAdditional}"
						target="#{specificationBackingBean.managedBean.scQtChecklist}" />
				</p:commandLink>
				<p:spacer width="10" height="5" />
				<h:outputText
					value="#{stageTwofunctionalAdditional.scQtCheckListAttachment.fileName}"></h:outputText>

			</p:column>
			<p:column headerText="#{lbl['lbl.sc.spec.stage.max.score']}">

			<p:column headerText="#{lbl['lbl.sc.spec.stage.order']}">

			<p:column headerText="#{lbl['lbl.sc.spec.stage.action']}" style="width:10%">
				<!-- <p:commandButton value="Search" process="@this" partialSubmit="true"

				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="edit.png"

			</p:column>
		</p:dataTable>
		<p:spacer height="20"></p:spacer>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.add']}" process="@this,financeAdditionaltwo"

			<p:commandButton value="#{lbl['lbl.sc.spec.stage.btn.delete']}" />

		</div>
	</p:panel>

</ui:composition>
