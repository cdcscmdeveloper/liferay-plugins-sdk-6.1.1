<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<h:panelGroup>


		<div style="text-align: left; float: right;">
			<p:selectOneMenu value="#{bpmTasklistBackingBean.managedBean.viewBy}">
				<f:selectItem itemLabel="Current Biddings" itemValue="CB"></f:selectItem>
				<f:selectItem itemLabel="Upcoming Biddings" itemValue="UB"></f:selectItem>

			</p:selectOneMenu>
		</div>
		
		<div style="text-align: left; float: left;">
			<p:commandButton
				value="#{lbl['lbl.bpm.refresh']}" icon="ui-icon-reset" ></p:commandButton>
		</div>
		
		<div class="clear"></div>
		
		<p:dataTable value="#{searchQtnTenderBB.managedBean.qtnTenders}"
			var="tenders" resizableColumns="true" style="width:100%;" paginator="true"
			rows="10" paginatorPosition="bottom"
			paginatorTemplate="{LastPageLink} {NextPageLink} {PreviousPageLink} {FirstPageLink} Page {JumpToPageDropdown} {CurrentPageReport}"
			currentPageReportTemplate="/ {totalPages}"
			rowsPerPageTemplate="5,10,15">>

			<p:column headerText="Document No.">
				<p:commandLink action="viewbiddingscreen.xhtml?faces-redirect=true">
					<h:outputText value="QT00001" style="width:100%" />
				</p:commandLink>
			</p:column>
			<p:column headerText="Document Type.">

				<h:outputText value="Quotation/Tender" style="width:100%" />

			</p:column>
			<p:column headerText="Bid No">
				<h:outputText value="B00005" />
			</p:column>
			<p:column headerText="Bid Title">
				<h:outputText value="Purchase Computer Server" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.crtdt']}">
				<h:outputText value="10/01/2014" />
			</p:column>
			<p:column headerText="Created By">
				<h:outputText value="001" />
			</p:column>
		</p:dataTable>

	</h:panelGroup>
</ui:composition>
