<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:panel header="Search Criteria" toggleable="true">
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputText value="Document No." />
			</h:column>
			<h:column>
				<p:inputText id="DocNo" value="#{biddingBB.managedBean.docNo}" />
			</h:column>
			<h:column>
				<h:outputText value="Bid No." />
			</h:column>
			<h:column>
				<p:inputText id="BidNo" value="#{biddingBB.managedBean.bidNo}"/>
			</h:column>
		</h:panelGrid>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="2" columnClasses="columnWidth20">
			<h:column>
				<h:outputText value="Bid Title" />
			</h:column>
			<h:column>
				<p:inputText id="BidTitle" value="#{biddingBB.managedBean.bidTitle}" size="125" />
			</h:column>
		</h:panelGrid>
		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="100%"
			columns="4" columnClasses="columnWidth20,columnWidth30,columnWidth20,columnWidth30">
			<h:column>
				<h:outputText value="Bidding Date (From) " />
			</h:column>
			<h:column>
				<p:calendar value="#{biddingBB.managedBean.createdDate}" pattern="MM/dd/yyyy" id="bidFromDate" showOn="button"/>
			</h:column>
			<h:column>
				<h:outputText value="Bidding Date (To)" />
			</h:column>
			<h:column>
				<p:calendar value="#{biddingBB.managedBean.createdDate}" pattern="MM/dd/yyyy" id="bidToDate" showOn="button"/>
			</h:column>
	    </h:panelGrid>
	    
	    <p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			style="float:right;" />
			
		<br />
		<br />
	</p:panel>
	
	<p:panel header="Search Results" toggleable="true">
		<p:dataTable value="#{searchQtnTenderBB.managedBean.qtnTenders}"
			var="tenders" resizableColumns="true">

			<p:column headerText="Document No." >              
				<p:commandLink  action="viewbiddingscreen.xhtml?faces-redirect=true">
					<h:outputText value="QT00001"  style="width:100%"/>  
				</p:commandLink> 
			</p:column>
			<p:column headerText="Bid No">
				<h:outputText value="B00005" />
			</p:column>
			<p:column headerText="Bid Title">
				<h:outputText value="Purchase Computer Server" />
			</p:column>
			<p:column headerText="#{lbl['lbl.so.crtdt']}">
				<h:outputText value="#{biddingBB.managedBean.createdDate}" />
			</p:column>
			<p:column headerText="Created By">
				<h:outputText value="#{biddingBB.managedBean.createdBy}" />
			</p:column>
		</p:dataTable>
     </p:panel>
</ui:composition>
