<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel toggleable="true">
		<div>
			<p:button value="SUBMIT" style="float:right;margin-right: 12px;"></p:button>
			<p:button value="SAVE" style="float:right;margin-right: 12px;"></p:button>
			<br/>
			<br/>
		</div>
	</p:panel>
	
	<ui:include src="/xhtml/ss/quatationtender/qtntenderheader.xhtml" />

	<p:panel header="Bidding Schedule" toggleable="true">		
		<p:dataTable id="itemlist"  value="" style="width:100%;">
			<p:column headerText="Item Name" >
				<h:outputText value="Ipad" />
			</p:column>	
			<p:column headerText="Bidding Start" >
				<h:outputText value="01-11-2013 10:00AM" />
			</p:column>	
			<p:column headerText="Bidding End" >
				<h:outputText value="01-11-2013 11:00AM" />
			</p:column>	
			<p:column headerText="Bidding Duration" >
				<h:outputText value="1 Hour" />
			</p:column>
			<p:column headerText="Min. Decrement Block" >
				<h:outputText value="1000" />
			</p:column>	
		</p:dataTable>
	</p:panel>
	
	<p:panel header="Supplier List" toggleable="true">
		<p:dataTable id="supplist"  value="" style="width:100%;">
			<p:column headerText="Proposal No." >
				<h:outputText value="003" />
			</p:column>	
			<p:column headerText="Supplier Name" >
				<h:outputText value="Archisoft" />
			</p:column>		
			<p:column headerText="Total Price (RM)" >
				<h:outputText value="2000" />
			</p:column>	
		</p:dataTable>
	</p:panel>
</ui:composition>
