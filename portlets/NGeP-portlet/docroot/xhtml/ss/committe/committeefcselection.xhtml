<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

  <p:panel header="Committee Details" toggleable="true">
  
    <h:panelGroup style="width:100%;" >
    <p:dataTable value="#{CommitteBackingBean.managedBean.supplierItemList}" var="committeqc" resizableColumns="true" editable="true">
    
        <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />
        
        <p:column headerText="No" style="width:5%">  
           <h:outputText value="#{committeqc.committeeMemberId}" />  
        </p:column>  
  
        <p:column headerText="Group">
          <p:selectOneMenu value="#{buttonBean.number}">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="QC" itemValue="1" />  
            <f:selectItem itemLabel="PBB" itemValue="2" />  
            <f:selectItem itemLabel="PBA" itemValue="3" />  
            <f:selectItem itemLabel="FBP Sabah" itemValue="4" />  
            <f:selectItem itemLabel="FBP Sarawak" itemValue="5" />                                                   
          </p:selectOneMenu> 
       </p:column>  
  
        <p:column headerText="Secretary Name" >  
           <p:cellEditor>
            <f:facet name="output">  
              <h:outputText value="#{committeqc.memberName}" />
             </f:facet>  
            <f:facet name="input">  
                    <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" >  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Existing record" itemValue="1" />  
            <f:selectItem itemLabel="New record" itemValue="2" />   
        </p:selectOneMenu> 
                </f:facet>  
            </p:cellEditor>     
        </p:column> 
        
       <p:column headerText="Action" style="width:10%">  
            <p:rowEditor />  
        </p:column>        
       
    </p:dataTable>
   
  </h:panelGroup>
   
  </p:panel>
		</ui:composition>
