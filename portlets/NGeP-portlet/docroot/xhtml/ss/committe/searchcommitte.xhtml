<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<p:panel>
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td" ></p:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
	<br/>
	
	<p:commandLink value="Search Quotation/Tender" onclick="screen5.show();" />
	<br/>
	
	<p:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">


	<h:outputText value="Committee No"></h:outputText>
	<p:inputText size="#{committeBackingBean.managedBean.qtCommittee.commNumber}"></p:inputText>
		
	<h:outputText value="Qtn/Tender No"></h:outputText>
	<p:inputText value="#{committeBackingBean.managedBean.qtCommittee.qtno}" size="49"></p:inputText>
	
	<h:outputText value="Committe Type" ></h:outputText>

	 <p:selectOneMenu value="#{committeBackingBean.managedBean.selectedCommitte}">  
            <f:selectItems value="#{committeBackingBean.managedBean.committeType}"></f:selectItems>
      </p:selectOneMenu> 
         
	<h:outputText value="Date Created"></h:outputText>
	<p:calendar value="#{committeBackingBean.managedBean.qtCommittee.committeCreatedDate}"
				 showOn="button" />
	
	<h:outputText value="Record Status" style="width:104px;"></h:outputText>

	 <p:selectOneMenu style="width:61%;">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Active" itemValue="1" /> 
            <f:selectItem itemLabel="Non-Active" itemValue="1" />  
     </p:selectOneMenu> 
     	 
    </p:panelGrid>
	<p:commandButton value="SEARCH" style="float:right;" action="#{committeBackingBean.sarchQtCommitte}"
			update="searchCommitte" />
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchCommitte" value="#{committeBackingBean.managedBean.qtcommittees}" var="committe">
        
 
        <p:column headerText="CommitteType" > 
        <h:outputText value="#{committe.scCommittee.committeeType}"></h:outputText>   
    </p:column>
         <p:column headerText="QTN/TenderNo" > 
         <p:commandLink action="#{committeBackingBean.viewQtDetail()}"
						style="margin-right:20px;" ajax="false" oncomplete="screen5.show();">
        <h:outputText value="#{committe.scQt.qtNo}"></h:outputText>   
        </p:commandLink>
    </p:column>
     <p:column headerText="DateCreated" > 
        <h:outputText value="#{committe.scCommittee.createdDate}"></h:outputText>   
    </p:column>
     <p:column headerText="ApprovalStatus" > 
         <h:outputText value="#{committe.scCommittee.approvalStatus}"></h:outputText>   
    </p:column>
     <p:column headerText="RecordStatus"> 
        <h:outputText value="#{committe.scCommittee.recordStatus}"></h:outputText>   
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="ADD" style="float:right;" action="committeemaintanancepage?faces-redirect=true"  />
	 </p:panelGrid>
	</p:panel>

</ui:composition>
