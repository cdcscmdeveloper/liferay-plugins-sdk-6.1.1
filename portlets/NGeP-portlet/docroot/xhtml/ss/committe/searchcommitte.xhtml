<ui:composition	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	
	<p:panel>
		<h:panelGrid styleClass="noBorders tr,noBorders td" ></h:panelGrid>
    </p:panel>
	
	<p:panel header="SEARCH" toggleable="true">
		
	<h:panelGrid id="search" columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">


	<h:outputLabel value="Committee No"></h:outputLabel>
	<p:inputText value="#{committeBackingBean.managedBean.committeNo}"></p:inputText>
		
	<h:outputLabel value="Qtn/Tender No"></h:outputLabel>
	<p:inputText value="#{committeBackingBean.managedBean.qtNo}" size="49"></p:inputText>
	
	<h:outputLabel value="Committe Type" ></h:outputLabel>

	 <p:selectOneMenu value="#{committeBackingBean.managedBean.selectedCommitte}">  
            <f:selectItems value="#{committeBackingBean.managedBean.committeType}"></f:selectItems>
      </p:selectOneMenu> 
         
	<h:outputLabel value="Date Created"></h:outputLabel>
	<p:calendar value="#{committeBackingBean.managedBean.createdDt}"
				 showOn="button" />
	
	<h:outputLabel value="CommitteStatus" ></h:outputLabel>

	 <p:selectOneMenu style="width:61%;" value="#{committeBackingBean.managedBean.status}">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="Active" itemValue="1" /> 
            <f:selectItem itemLabel="Non-Active" itemValue="2" />  
     </p:selectOneMenu> 
     	 
    </h:panelGrid>
	<p:commandButton value="SEARCH" style="float:right;" action="#{committeBackingBean.sarchQtCommitte}"
			update="searchCommitte"/>
    <br/>
	<br/>
	</p:panel>
	
	<p:panel header="Results" toggleable="true">
	<p:dataTable id="searchCommitte" value="#{committeBackingBean.managedBean.qtcommittees}" var="committe" editable="true">
        
  <p:ajax event="rowEdit" listener="#{committeBackingBean.goToMaintainceAction}" />  
                 <p:ajax event="rowEditCancel"/> 
				
 
        <p:column headerText="CommitteType" > 
        <h:outputLabel value="#{committe.scCommittee.committeeType}"></h:outputLabel>   
    </p:column>
         <p:column headerText="QTN/TenderNo" > 
         <p:commandLink action="#{committeBackingBean.showQtDetailAction(committe.scQt.qtId)}"
						style="margin-right:20px;" ajax1="false" oncomplete="screen5.show()" update="@(.qtCount)">
        <h:outputLabel value="#{committe.scQt.qtNo}"></h:outputLabel>   
        </p:commandLink>
    </p:column>
     <p:column headerText="DateCreated" > 
        <h:outputLabel value="#{committe.scCommittee.createdDate}"></h:outputLabel>   
    </p:column>
     <p:column headerText="ApprovalStatus" > 
         <h:outputLabel value="#{committe.scCommittee.approvalStatus}"></h:outputLabel>   
    </p:column>
     <p:column headerText="CommitteStatus"> 
        <h:outputLabel value="#{committe.scCommittee.recordStatus}"></h:outputLabel>   
    </p:column>
    <p:column>
    <p:rowEditor />
    </p:column>
     </p:dataTable>
	</p:panel>
	
	<p:panel>
	<h:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">

      <p:commandButton value="ADD" style="float:right;" action="#{committeBackingBean.newCommitteeAction}" ajax="false"/>
	 </h:panelGrid>
	</p:panel>

</ui:composition>
