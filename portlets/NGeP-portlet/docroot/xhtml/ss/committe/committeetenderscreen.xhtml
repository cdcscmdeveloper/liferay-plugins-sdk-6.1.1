<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="POP" header="View Quotation/Tender List" widgetVar="screen5" modal="true"> 
	<p:panel>
		<p:panelGrid style="width:100%;" styleClass="noBorders tr,noBorders td" ></p:panelGrid>
    </p:panel>
    
    <p:panel>
    <p:commandLink value="Search Quotation/Tender" />
    <br/>
		   <h:panelGroup  style="width:100%;">
				<p:dataTable value="#{CommitteBackingBean.managedBean.supplierItemList}" var="searchquo" editable="true">
				
				  <p:ajax event="rowEdit" />  
                  <p:ajax event="rowEditCancel" /> 

					<p:column headerText="Qtn/Tender No" style="width:2px">
					  <p:outputLabel value="#{searchquo.qtno}" />
					</p:column>

					<p:column headerText="Title" style="width:10px;">
				      <p:cellEditor>  
                       <f:facet name="output">  
                        <h:outputText value="#{searchquo.committeeType}" />
                     </f:facet>  
                      <f:facet name="input">  
                       <p:inputText value="#{searchquo.committeeType}"/>  
                     </f:facet>  
                    </p:cellEditor>   
					</p:column>

					<p:column headerText="Procurement Mode" style="width:5px">  
                        <h:outputText value="#{searchquo.procuremode}" />  
                    </p:column>
                    
					<p:column headerText="Date Created" style="width:5px">  
                        <h:outputText value="#{searchquo.dateCreated}" />  
                    </p:column>                       
                      
		            <p:column headerText="Status" style="width:5px">  
                        <h:outputText value="#{searchquo.status}" />  
                    </p:column>  
            
		       </p:dataTable>	
			</h:panelGroup>	
			
		<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="Total: " />
                <p:inputText value="#{CommitteBackingBean.managedBean.total}" readonly="true"></p:inputText>

		</p:panelGrid>	
						<p:commandButton value="CANCEL"  style="float:right;" onclick="screen5.hide();"></p:commandButton>  		
		</p:panel>		
	</p:dialog>
</ui:composition>
