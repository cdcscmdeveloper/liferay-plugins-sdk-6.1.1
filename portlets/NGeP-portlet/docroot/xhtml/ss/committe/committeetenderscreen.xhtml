<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="POP" header="View Quotation/Tender List" widgetVar="screen3" modal="true"> 
    
    <p:panel>
    <p:commandLink value="Search Quotation/Tender" />
    <br/>
		   <h:panelGroup  style="width:100%;">
				<p:dataTable value="" var="" editable="true">
				
				  <p:ajax event="rowEdit" />  
                  <p:ajax event="rowEditCancel" /> 

					<p:column headerText="Qtn/Tender No" style="width:5px">
					  <p:outputLabel value="QTN 1" />
					</p:column>

					<p:column headerText="Title" style="width:140px;">
				      <p:cellEditor>  
                       <f:facet name="output">  
                        <h:outputText value="Title 1" />
                     </f:facet>  
                      <f:facet name="input">  
                       <p:inputText value=""/>  
                     </f:facet>  
                    </p:cellEditor>   
					</p:column>

					<p:column headerText="Procurement Mode" style="width:5px">  
                        <h:outputText value="Mode 1" />  
                    </p:column>
                    
					<p:column headerText="Date Created" style="width:5px">  
                        <h:outputText value="Active" />  
                    </p:column>                       
                      
		            <p:column headerText="Status" style="width:5px">  
                        <h:outputText value="Active" />  
                    </p:column>  
            
		       </p:dataTable>	
			</h:panelGroup>	
			
		<p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
				<h:outputLabel for="name" value="Total: " />
                <p:inputText readonly="true"></p:inputText>

		</p:panelGrid>	
						<p:commandButton value="CANCEL"  style="float:right;" onclick="screen3.hide();"></p:commandButton>  		
		</p:panel>		
	</p:dialog>
</ui:composition>
