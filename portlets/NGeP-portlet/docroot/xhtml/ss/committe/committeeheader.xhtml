<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Header" toggleable="true">
		<p:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">

		<h:outputText value="Committee Type" />
		 <p:selectOneMenu value="#{committeBackingBean.managedBean.scCommittee.committeeType}">
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="DOAA" itemValue="1" />  
            <f:selectItem itemLabel="OC" itemValue="2" />  
            <f:selectItem itemLabel="EC" itemValue="3" /> 
            <f:selectItem itemLabel="TEC" itemValue="4" />  
            <f:selectItem itemLabel="FEC" itemValue="5" />  
            <f:selectItem itemLabel="FC Secretary" itemValue="6" />
            <f:selectItem itemLabel="MSC" itemValue="7" />  
            <f:selectItem itemLabel="QC" itemValue="8" />
            <f:selectItem itemLabel="PBB" itemValue="9" />
            <f:selectItem itemLabel="PBA" itemValue="10" />
            <f:selectItem itemLabel="FPB SBH" itemValue="11" />
            <f:selectItem itemLabel="FPB SRW" itemValue="12" />
            <f:selectItem itemLabel="BPK PB" itemValue="13" />
			<p:ajax event="change" update="parentText, approvaldetails,committecheckbox" />
         </p:selectOneMenu>

            <h:outputText value="Ministry Code/Name" />  
            <p:inputText readonly="true"/> 
                     			
			<h:outputText value="Qtn/Tender No" />  
            <p:inputText readonly="true"/>            
            
            <h:outputText value="Status" />  
            <p:inputText  readonly="true" />  
            
            <h:outputText value="Department Code/Name" />  
            <p:inputText readonly="true"/>  
           
           <h:outputText value="Created Date"  /> 
   		   <p:inputText readonly="true"/>  
 
           <h:outputText value="Divison Code/Name" />  
           <p:inputText readonly="true"/>  
                          
           <h:outputText value="Committee Status" /> 
   		   <p:inputText readonly="true"/> 
   		   
           <h:outputText value="Record Status" /> 
   		   <p:inputText readonly="true"/>     		     		                                                                          
                      
      </p:panelGrid>
  	</p:panel>   
       
       <h:panelGroup id="parentText">
       
	    <h:panelGroup rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '1' or committeBackingBean.managedBean.scCommittee.committeeType eq '2'
	                         or  committeBackingBean.managedBean.scCommittee.committeeType eq '3' or committeBackingBean.managedBean.scCommittee.committeeType eq '4'
	                         or  committeBackingBean.managedBean.scCommittee.committeeType eq '4' or  committeBackingBean.managedBean.scCommittee.committeeType eq '5'}">
          <ui:include src="/xhtml/ss/committe/committeescselection.xhtml" />
		</h:panelGroup>
	    
	    <h:panelGroup rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '6' }" >
          <ui:include src="/xhtml/ss/committe/committeefcselection.xhtml" />
		</h:panelGroup>

        <h:panelGroup rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '7' or committeBackingBean.managedBean.scCommittee.committeeType eq '8'
                             or committeBackingBean.managedBean.scCommittee.committeeType eq '9'  or  committeBackingBean.managedBean.scCommittee.committeeType eq '10' 
                             or committeBackingBean.managedBean.scCommittee.committeeType eq '11' or  committeBackingBean.managedBean.scCommittee.committeeType eq '12' 
                             or committeBackingBean.managedBean.scCommittee.committeeType eq '13' }">       
		  <ui:include src="/xhtml/ss/committe/committeeqcselection.xhtml" />
	    </h:panelGroup>

	  </h:panelGroup>
</ui:composition>
