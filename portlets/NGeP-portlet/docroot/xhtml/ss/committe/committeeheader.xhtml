<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Header" toggleable="true">
		<h:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">

		<h:outputLabel value="#{lbl['lbl.sc.committe.header.comtype']}" />
		 <p:selectOneMenu value="#{committeBackingBean.managedBean.selectedCommitte}">
            <f:selectItem itemLabel="Select One" itemValue="-1" />  
            <f:selectItem itemLabel="DOAA" itemValue="DOAA" /> 
            <f:selectItem itemLabel="SC" itemValue="SC" />            
            <f:selectItem itemLabel="OC" itemValue="OC" />  
            <f:selectItem itemLabel="EC" itemValue="EC" /> 
            <f:selectItem itemLabel="TEC" itemValue="TEC" />  
            <f:selectItem itemLabel="FEC" itemValue="FEC" />  
            <f:selectItem itemLabel="FC Secretary" itemValue="FCSecretary" />
            <f:selectItem itemLabel="MSC" itemValue="MSC" />  
            <f:selectItem itemLabel="QC" itemValue="QC" />
            <f:selectItem itemLabel="PBB" itemValue="PBB" />
            <f:selectItem itemLabel="PBA" itemValue="PBA" />
            <f:selectItem itemLabel="FPB SBH" itemValue="FPBSBH" />
            <f:selectItem itemLabel="FPB SRW" itemValue="FPBSRW" />
            <f:selectItem itemLabel="FPA SBH" itemValue="FPASBH" />
            <f:selectItem itemLabel="FPA SRW" itemValue="FPASRW" />
            <f:selectItem itemLabel="BPK PB" itemValue="BPKPB" />            
			<p:ajax event="change" update="parentText, approvaldetails,committecheckbox" />
         </p:selectOneMenu>

            <h:outputLabel value="#{lbl['lbl.sc.committe.header.ministrycodename']}" />  
            <p:inputText readonly="true"/> 
            
            <c:if test="#{committeBackingBean.managedBean.selectedCommitte != 'QC'}">                 			
			<h:outputLabel value="#{lbl['lbl.sc.committe.header.qtntenderno']}" />  
            <p:inputText value="#{committeBackingBean.managedBean.tenderNum}"/>            
            </c:if>
            
            <h:outputLabel value="#{lbl['lbl.sc.committe.header.status']}" />  
            <p:inputText  readonly="true" />  
            
            <h:outputLabel value="#{lbl['lbl.sc.committe.header.departcode']}" />  
            <p:inputText readonly="true"/>  
           
           <h:outputLabel value="#{lbl['lbl.sc.committe.header.createddate']}" /> 
   		   <p:inputText readonly="true"/>  
 
           <h:outputLabel value="#{lbl['lbl.sc.committe.header.divcode']}" />  
           <p:inputText readonly="true"/>  
                          
           <h:outputLabel value="#{lbl['lbl.sc.committe.header.comstatus']}" /> 
   		   <p:inputText readonly="true"/> 
   		   
           <h:outputLabel value="#{lbl['lbl.sc.committe.header.recstatus']}" /> 
   		   <p:inputText readonly="true"/>     		     		                                                                          
                      
      </h:panelGrid>
  	</p:panel>   
       
       <h:panelGroup id="parentText">
       
	    <h:panelGroup rendered="#{committeBackingBean.managedBean.selectedCommitte eq 'DOAA' or committeBackingBean.managedBean.selectedCommitte eq 'SC'
	                         or  committeBackingBean.managedBean.selectedCommitte eq 'OC' or committeBackingBean.managedBean.selectedCommitte eq 'EC'
	                         or  committeBackingBean.managedBean.selectedCommitte eq 'FEC' or  committeBackingBean.managedBean.selectedCommitte eq 'TEC'}">
          <ui:include src="/xhtml/ss/committe/committeescselection.xhtml" />
		</h:panelGroup>
	    
	    <h:panelGroup rendered="#{committeBackingBean.managedBean.selectedCommitte eq 'FCSecretary' }" >
          <ui:include src="/xhtml/ss/committe/committeefcselection.xhtml" />
		</h:panelGroup>

        <h:panelGroup rendered="#{committeBackingBean.managedBean.selectedCommitte eq 'MSC' or committeBackingBean.managedBean.selectedCommitte eq 'QC'
                             or committeBackingBean.managedBean.selectedCommitte eq 'PBB'  or  committeBackingBean.managedBean.selectedCommitte eq 'PBA' 
                             or committeBackingBean.managedBean.selectedCommitte eq 'FPBSBH' or  committeBackingBean.managedBean.selectedCommitte eq 'FPBSRW' 
                             or committeBackingBean.managedBean.selectedCommitte eq 'FPASBH' or committeBackingBean.managedBean.selectedCommitte eq 'FPASRW'
                             or committeBackingBean.managedBean.selectedCommitte eq 'BPKPB'}">       
		  <ui:include src="/xhtml/ss/committe/committeeqcselection.xhtml" />
	    </h:panelGroup>

	  </h:panelGroup>
</ui:composition>
