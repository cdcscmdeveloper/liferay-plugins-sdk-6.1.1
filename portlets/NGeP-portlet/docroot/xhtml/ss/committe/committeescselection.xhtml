<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="Committee Details" toggleable="true">
		<h:panelGrid columns="4" style="width:100%;" cellpadding="3"
			id="committecheckbox"
			rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '3' 
    	         or committeBackingBean.managedBean.scCommittee.committeeType eq '4'
    	         or committeBackingBean.managedBean.scCommittee.committeeType eq '5'}">

			<h:outputText value="" />
			<p:selectManyCheckbox>
				<f:selectItem itemLabel="&#160;Committee to TEC/FEC"
					itemValue="Option 1" />
				<f:selectItem itemLabel="&#160;Change Committee to EC"
					itemValue="Option 2" />
			</p:selectManyCheckbox>

		</h:panelGrid>
		<br />

		<h:panelGroup style="width:100%;">
			<p:dataTable id="committeMember"
				value="#{committeBackingBean.managedBean.committemembers}"
				var="committemember" rowIndexVar="index">
				<p:column headerText="No">
					<h:outputText value="#{index + 1}" />
				</p:column>

				<p:column headerText="Name">
					<h:outputText value="#{committemember.memberName}" />
				</p:column>

				<p:column headerText="IC/PassPort No">
					<h:outputText value="#{committemember.icPassport}" />
				</p:column>
				<p:column headerText="Role">
					<h:outputText value="#{committemember.memberRole}" />
				</p:column>
				<p:column headerText="Access">
					<h:outputText value="#{committemember.accessRight}" />
				</p:column>
			
			</p:dataTable>
		</h:panelGroup>

		<div align="right">
			<p:commandButton value="ADD"
				action="#{committeBackingBean.showCommitteMember}"
				oncomplete="screen3.show();" ></p:commandButton>

			<p:commandButton value="CLONE" onclick="screen4.show();"></p:commandButton>
		</div>
		<br />
	</p:panel>


	<p:panel header="Approval Details" toggleable="true"
		id="approvaldetails"
		rendered="#{committeBackingBean.managedBean.scCommittee.committeeType eq '2' or committeBackingBean.managedBean.scCommittee.committeeType eq '3' 
    or committeBackingBean.managedBean.scCommittee.committeeType eq '4' or committeBackingBean.managedBean.scCommittee.committeeType eq '4' 
    or committeBackingBean.managedBean.scCommittee.committeeType eq '5' or committeBackingBean.managedBean.scCommittee.committeeType eq '7'}">
		<br />

		<h:panelGrid columns="4" style="margin-bottom:10px;width:100%;"
			cellpadding="3">
			<h:outputText style="bold" value="Approver Name: " />
			<p:selectOneMenu
				value="#{committeBackingBean.managedBean.scCommittee.pmUser}"
				style="width: 120px;">
				<f:selectItem itemLabel="" itemValue="" />
				<f:selectItem itemLabel="" itemValue="1" />
				<f:selectItem itemLabel="" itemValue="2" />
				<f:selectItem itemLabel="" itemValue="3" />
			</p:selectOneMenu>

			<h:outputText style="bold" value="Approver Date: " />
			<p:calendar value="#{committeBackingBean.managedBean.scCommittee.approvalDate}" showOn="button"></p:calendar>
			

			<h:outputText style="bold" value="Approver Action: " />
			<p:selectOneMenu
				value="#{committeBackingBean.managedBean.scCommittee.approvalStatus}"
				style="width: 120px;">
				<f:selectItem itemLabel="" itemValue="" />
				<f:selectItem itemLabel="" itemValue="1" />
				<f:selectItem itemLabel="" itemValue="2" />
				<f:selectItem itemLabel="" itemValue="3" />
			</p:selectOneMenu>

			<h:outputText style="bold" value="Approval Remarks: " />
			<p:inputText id="appRemark"
				value="#{committeBackingBean.managedBean.scCommittee.approvalRemark}"
				/>

		</h:panelGrid>
	</p:panel>

</ui:composition>
