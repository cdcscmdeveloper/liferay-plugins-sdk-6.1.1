<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

  <p:panel header="Committee Details" toggleable="true">
   <h:panelGrid columns="4" style="width:100%;" cellpadding="3" id="committecheckbox" 
       rendered="#{searchQtnTenderBB.managedBean.tenderSelction eq '3' 
    	         or searchQtnTenderBB.managedBean.tenderSelction eq '4'
    	         or searchQtnTenderBB.managedBean.tenderSelction eq '5'}">
   
        <h:outputText value="" />  
        <p:selectManyCheckbox>  
            <f:selectItem itemLabel="&#160;Committee to TEC/FEC" itemValue="Option 1" />  
            <f:selectItem itemLabel="&#160;Change Committee to EC" itemValue="Option 2" />  
        </p:selectManyCheckbox> 
          
   </h:panelGrid>     
        <br />
        
  <h:panelGroup  style="width:100%;" >
    <p:dataTable value="#{CommitteBackingBean.managedBean.supplierItemList}"  var="committets" resizableColumns="true" editable="true">
   
	    <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />
                             
        <p:column headerText="No">  
          <h:outputText value="#{committets.committeeMemberId}" />  
        </p:column>  
  
        <p:column headerText="Name"> <p:commandLink  actionListener="#{pprBean.savePerson}" style="margin-right:20px;" ajax="false">  
          <h:outputText value="#{committets.memberName}" />  
        </p:commandLink>  
     
             
        </p:column>  
  
        <p:column headerText="IC No" >  
            <p:outputLabel value="#{committets.icPassport}"></p:outputLabel>  
        </p:column>  
        
         <p:column headerText="Passport No" >  
            <p:outputLabel value="#{committets.icPassport}"></p:outputLabel>  
         </p:column>  
        
        <p:column headerText="Role" > 
           <p:cellEditor>
            <f:facet name="output">  
              <h:outputText value="#{committets.memberRole}" />
             </f:facet>  
            <f:facet name="input">  
         <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" >
            <f:selectItem itemLabel="Select One" itemValue="" /> 
            <f:selectItem itemLabel="Chairperson" itemValue="" />  
            <f:selectItem itemLabel="Secretary" itemValue="1" />  
            <f:selectItem itemLabel="Member" itemValue="2" />   
         </p:selectOneMenu> 
                </f:facet>  
            </p:cellEditor>            
        </p:column>                   
              
         <p:column headerText="Access" >  
           <h:outputText value="#{committets.accessRight}" />
         </p:column>
         
        <p:column headerText="TEC/FEC" > 
          <p:selectOneMenu value="#{buttonBean.number}">  
            <f:selectItem itemLabel="Select One" itemValue="" />  
            <f:selectItem itemLabel="TEC" itemValue="1" />  
            <f:selectItem itemLabel="FEC" itemValue="2" />    
          </p:selectOneMenu>        
        </p:column>            
        
       <p:column headerText="Action">  
            <p:rowEditor />  
        </p:column> 
          
       
    </p:dataTable>
  </h:panelGroup>

	<div align="right">
	    <p:commandButton value="ADD" onclick="screen3.show();" ></p:commandButton>  
	    <p:commandButton value="CLONE" onclick="screen4.show();"></p:commandButton>  
    </div>
   <br/>   
  </p:panel>


  <p:panel header="Approval Details" toggleable="true" id="approvaldetails"
    rendered="#{searchQtnTenderBB.managedBean.tenderSelction eq '2' or searchQtnTenderBB.managedBean.tenderSelction eq '3' 
    or searchQtnTenderBB.managedBean.tenderSelction eq '4' or searchQtnTenderBB.managedBean.tenderSelction eq '4' 
    or searchQtnTenderBB.managedBean.tenderSelction eq '5' or searchQtnTenderBB.managedBean.tenderSelction eq '7'}">
  <br/>

  		<h:panelGrid columns="4" style="margin-bottom:10px;width:100%;" cellpadding="3"> 		
        <h:outputText style="bold" value="Approver Name: " />  
        <p:selectOneMenu value="#{CommitteBackingBean.managedBean.pmUser}" style="width: 120px;">  
            <f:selectItem itemLabel="" itemValue="" />  
            <f:selectItem itemLabel="" itemValue="1" />  
            <f:selectItem itemLabel="" itemValue="2" />  
            <f:selectItem itemLabel="" itemValue="3" />  
        </p:selectOneMenu>  
              
        <h:outputText style="bold" value="Approver Date: " />  
           <p:inputText value="#{CommitteBackingBean.managedBean.approvalDate}" readonly="true"></p:inputText> 
           
        <h:outputText style="bold" value="Approver Action: " />  
        <p:selectOneMenu value="#{CommitteBackingBean.managedBean.approverAction}" style="width: 120px;">  
            <f:selectItem itemLabel="" itemValue="" />  
            <f:selectItem itemLabel="" itemValue="1" />  
            <f:selectItem itemLabel="" itemValue="2" />  
            <f:selectItem itemLabel="" itemValue="3" />  
        </p:selectOneMenu>              
     
        <h:outputText style="bold" value="Approval Remarks: " />  
           <p:inputText id="appRemark" value="#{CommitteBackingBean.managedBean.approvalRemark}" readonly="true" ></p:inputText>                    
           
        </h:panelGrid>          
  </p:panel>

</ui:composition>
