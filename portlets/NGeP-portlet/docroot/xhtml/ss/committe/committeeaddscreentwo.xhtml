<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Add2" header="ADD" widgetVar="screen3" modal="true">
		<p:panel header="New Committee" toggleable="true">

			<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="* Selection  " />
				  <p:selectOneRadio value="#{CommitteBackingBean.managedBean.supplierItemList}">  
                     <f:selectItem itemLabel="Profile" itemValue="1" />  
                     <f:selectItem itemLabel="Existing List" itemValue="2" />  
                     <f:selectItem itemLabel="New" itemValue="3" />  
                  </p:selectOneRadio>  
            </p:panelGrid>
   
             <p:panelGrid columns="2" styleClass="noBorders tr,noBorders td">
 		    	<h:outputLabel value="*Name " />
				 <p:selectOneMenu value="#{CommitteBackingBean.managedBean.memberName}"> 
	            	<f:selectItem itemLabel="" itemValue="1" />   
	           		<f:selectItem itemLabel="" itemValue="2" />
	                <f:selectItem itemLabel="" itemValue="3" />
	             </p:selectOneMenu>
				
				<h:outputLabel value="Type of User  " />
				  <p:selectOneRadio value="#{CommitteBackingBean.managedBean.supplierItemList}">  
                     <f:selectItem itemLabel="Government User" itemValue="1" />  
                     <f:selectItem itemLabel="Non Government User" itemValue="2" />  
                  </p:selectOneRadio>  
             </p:panelGrid>

 			 <p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">
 
 		    	<h:outputLabel value="Identification Type " />
				 <p:selectOneMenu value="#{CommitteBackingBean.managedBean.icPassportType}"> 
	            	<f:selectItem itemLabel="" itemValue="1" />   
	           		<f:selectItem itemLabel="IC No." itemValue="2" />
	                <f:selectItem itemLabel="Passport No." itemValue="3" />
	             </p:selectOneMenu>
 
		    	<h:outputLabel value="Ministry: * " />
				 <p:selectOneMenu value="#{CommitteBackingBean.managedBean.ministry}"> 
	                <f:selectItem itemLabel="" itemValue="1" />   
	                <f:selectItem itemLabel="Finance" itemValue="2" />
	                <f:selectItem itemLabel="Home Ministry" itemValue="3" />
	             </p:selectOneMenu>
	             
                <h:outputLabel value="* Identification No.  " />
			  <p:inputText id="ICno" value="#{CommitteBackingBean.managedBean.icPassport}" />
			  
			<h:outputLabel value="* Department " />
				 <p:selectOneMenu value="#{CommitteBackingBean.managedBean.department}"> 
	           		<f:selectItem itemLabel="" itemValue="1" />   
	            	<f:selectItem itemLabel="IT" itemValue="2" />
	             	<f:selectItem itemLabel="Marketing" itemValue="3" />
	             </p:selectOneMenu>			  	             
                  
                   <h:outputLabel value="* Designation " />
					<p:inputText value="#{CommitteBackingBean.managedBean.designation}" readonly="true"/>
            
				
					<h:outputLabel value="* Division " />
					 <p:selectOneMenu value="#{CommitteBackingBean.managedBean.isEvaluateMember}" >  
	           		   <f:selectItem itemLabel="" itemValue="1" />   
	           		   <f:selectItem itemLabel="Div 1" itemValue="2" />
	           		   <f:selectItem itemLabel="Div 2" itemValue="3" />
	            	 </p:selectOneMenu>
	            	 
	                <h:outputLabel value="* Grade " />
					  <p:inputText value="#{CommitteBackingBean.managedBean.grade}" readonly="true" />
				
					<h:outputLabel value="* Role " />
				 	  <p:selectOneMenu value="#{CommitteBackingBean.managedBean.memberRole}"> 
	           			<f:selectItem itemLabel="" itemValue="1" />   
	           			<f:selectItem itemLabel="role 1" itemValue="2" />
	            	    <f:selectItem itemLabel="role 2" itemValue="3" />
	            	  </p:selectOneMenu>
	            	  
					<h:outputLabel value=" A Member for Evaluate Proposal" />
				 	  <p:selectOneMenu value="#{CommitteBackingBean.managedBean.memberType}"> 
	           			<f:selectItem itemLabel="" itemValue="1" />   
	           			<f:selectItem itemLabel="Secratery" itemValue="2" />
	             		<f:selectItem itemLabel="ChairPerson" itemValue="3" />
	             	  </p:selectOneMenu>  	            	  				
				    				    
					<h:outputLabel value="* Access " />
					 <p:selectOneMenu value="#{CommitteBackingBean.managedBean.accessRight}"> 
	           			<f:selectItem itemLabel="" itemValue="1" />   
	            		<f:selectItem itemLabel="approve" itemValue="2" />
	             		<f:selectItem itemLabel="reject" itemValue="3" />
	           		 </p:selectOneMenu>      
                
	</p:panelGrid>

				<p:commandButton value="CANCEL"  style="float:right;" onclick="screen3.hide();"></p:commandButton>
				<p:commandButton value="ADD"  style="float:right;" onclick="screen3.hide();"></p:commandButton>      
		
		</p:panel>
	</p:dialog>
</ui:composition>
