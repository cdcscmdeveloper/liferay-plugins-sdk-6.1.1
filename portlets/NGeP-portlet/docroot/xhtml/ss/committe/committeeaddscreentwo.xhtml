<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Add2" header="ADD" widgetVar="screen3" modal="true">
		<p:panel header="New Committee" toggleable="true">

			<p:panelGrid columns="2" style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<h:outputLabel value="* Selection  " />
				 <p:selectOneRadio
					value="#{committeBackingBean.managedBean.committeMember.userSelection}">
					<f:selectItems
						value="#{committeBackingBean.managedBean.selections}" />
				</p:selectOneRadio>

				<h:outputLabel value="* Type of User  " />
				<p:selectOneRadio
					value="#{committeBackingBean.managedBean.committeMember.userType}">
					<f:selectItems value="#{committeBackingBean.managedBean.userTypes}"></f:selectItems>
				</p:selectOneRadio>
				 
			</p:panelGrid>

			<p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">

				<h:outputLabel value="* Name " />
				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.committeMember.memberName}">
					<f:selectItem itemLabel="test" itemValue="test1" />
					<f:selectItem itemLabel="test" itemValue="test2" />
					<f:selectItem itemLabel="test" itemValue="test3" />
				</p:selectOneMenu>

				<h:outputLabel value="* Identification Type " />
				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.committeMember.idType}">
					<f:selectItems value="#{committeBackingBean.managedBean.idTypes}"></f:selectItems>
				</p:selectOneMenu>

				<h:outputLabel value="* Ministry" />
				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.committeMember.ministry}">
					<f:selectItems value="#{committeBackingBean.managedBean.minstryList}"/>
					<p:ajax update="departments" event="change"
					listener="#{committeBackingBean.fetchDepartements}" />
				</p:selectOneMenu>

				<h:outputLabel value="* Identification No. " />
				<p:inputText id="ICno"
					value="#{committeBackingBean.managedBean.committeMember.icPassport}" />

				<h:outputLabel value="* Department " />
				<p:selectOneMenu id="departments"
					value="#{committeBackingBean.managedBean.committeMember.department}">
					<f:selectItems value="#{committeBackingBean.managedBean.deptList}" />
						<p:ajax update="divisons" event="change"
				listener="#{qTDetailBB.fetchDivisions}" />
				</p:selectOneMenu>

				<h:outputLabel value="* Designation " />
				<p:inputText
					value="#{committeBackingBean.managedBean.committeMember.designation}"
					readonly="true" />


				<h:outputLabel value="* Division " />
				<p:selectOneMenu id="divisons"
					value="#{committeBackingBean.managedBean.committeMember.designation}">
					<f:selectItem itemLabel="" itemValue="1" />
					<f:selectItem itemLabel="Div 1" itemValue="2" />
					<f:selectItem itemLabel="Div 2" itemValue="3" />
				</p:selectOneMenu>

				<h:outputLabel value="* Grade " />
				<p:inputText
					value="#{committeBackingBean.managedBean.committeMember.grade}"
					readonly="true" />

				<h:outputLabel value="* Role " />
				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.committeMember.memberRole}">
					<f:selectItems value="#{committeBackingBean.managedBean.roles}"></f:selectItems>
				</p:selectOneMenu>

				<h:outputLabel value="* A Member for Evaluate Proposal" />
				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.committeMember.memberType}">
					<f:selectItem itemLabel="" itemValue="1" />
					<f:selectItem itemLabel="Secratery" itemValue="2" />
					<f:selectItem itemLabel="ChairPerson" itemValue="3" />
				</p:selectOneMenu>

				<h:outputLabel value="* Access " />
				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.committeMember.accessRight}">
					<f:selectItem itemLabel="" itemValue="1" />
					<f:selectItem itemLabel="approve" itemValue="2" />
					<f:selectItem itemLabel="reject" itemValue="3" />
				</p:selectOneMenu>

			</p:panelGrid>

			<p:commandButton value="CANCEL" style="float:right;"
				onclick="screen3.hide();"></p:commandButton>
			<p:commandButton value="OK" style="float:right;"
				action="#{committeBackingBean.addCommitteMember}"
				oncomplete="screen3.hide();" update="committeMember"
				process="@all"></p:commandButton>

		</p:panel>
	</p:dialog>
</ui:composition>
