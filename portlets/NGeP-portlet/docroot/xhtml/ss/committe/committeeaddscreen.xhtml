<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Add" header="ADD" widgetVar="screen1" modal="true">
		<p:panel header="New Desk Officer Admin Assistant" toggleable="true">

			<p:panelGrid columns="2" style="width:100%;" styleClass="noBorders tr,noBorders td">
				

				<h:outputLabel for="SelReg" value="Selection of New Registration : " />
				  <p:selectOneRadio id="selreg" value="#{searchQtnTenderBB.managedBean.qtno}">  
                     <f:selectItem itemLabel="Profile" itemValue="1" />  
                     <f:selectItem itemLabel="Existing List" itemValue="2" />  
                     <f:selectItem itemLabel="New" itemValue="3" />  
                  </p:selectOneRadio>  
</p:panelGrid>

<p:panelGrid style="width:100%;"
    styleClass="noBorders tr,noBorders td">
    <p:row>
     <p:column width="100%" style="text-align:right">
      <p:commandButton value="Search"   style="float:right;" />
				
     </p:column>
     </p:row>
 </p:panelGrid>
     
     <p:panelGrid columns="2"  styleClass="noBorders tr,noBorders td">
				<h:outputLabel for="name" value="Name: " />
                <p:inputText></p:inputText>
				
				  <p:selectOneRadio  value="#{searchQtnTenderBB.managedBean.qtno}">  
                     <f:selectItem itemLabel="GovernmentUser" itemValue="1" />  
                    </p:selectOneRadio>  
                    
                     <p:selectOneRadio value="#{searchQtnTenderBB.managedBean.qtno}">  
                     <f:selectItem itemLabel="NonGovernmentUser" itemValue="2" />  
                    </p:selectOneRadio>
</p:panelGrid>

 <p:panelGrid columns="4" styleClass="noBorders tr,noBorders td">
 
            <h:outputLabel for="ICno" value="IC No/Passport: * " />
				<p:inputText id="ICno" value="#{searchQtnTenderBB.managedBean.qtno}" />
            

		    	<h:outputLabel for="Ministry" value="Ministry: * " />
				 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" > 
	           <f:selectItem itemLabel="approve" itemValue="1" />   
	            <f:selectItem itemLabel="reject" itemValue="2" />
	             <f:selectItem itemLabel="revise" itemValue="3" />
	             </p:selectOneMenu>
                  
                   <h:outputLabel for="designation" value="Designation: * " />
				<p:inputText id="designation" value="ReadOnly" readonly="true"/>
            
				
					<h:outputLabel for="Department" value="Department: * " />
				 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" > 
	           <f:selectItem itemLabel="approve" itemValue="1" />   
	            <f:selectItem itemLabel="reject" itemValue="2" />
	             <f:selectItem itemLabel="revise" itemValue="3" />
	             </p:selectOneMenu>
	             
	                <h:outputLabel for="Grade" value="Grade: * " />
				<p:inputText id="Grade" value="Readonly" readonly="true" />
            
				
					<h:outputLabel for="Division" value="Division: * " />
				 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" > 
	           <f:selectItem itemLabel="approve" itemValue="1" />   
	            <f:selectItem itemLabel="reject" itemValue="2" />
	             <f:selectItem itemLabel="revise" itemValue="3" />
	             </p:selectOneMenu>
				    
				    
					<h:outputLabel for="Access" value="Access: * " />
				 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" > 
	           <f:selectItem itemLabel="approve" itemValue="1" />   
	            <f:selectItem itemLabel="reject" itemValue="2" />
	             <f:selectItem itemLabel="revise" itemValue="3" />
	             </p:selectOneMenu>  
	             
	             
					<h:outputLabel for="proposal" value="A Member for Evaluate Proposal: " />
				 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" > 
	           <f:selectItem itemLabel="ChairPerson" itemValue="1" />   
	            <f:selectItem itemLabel="reject" itemValue="2" />
	             <f:selectItem itemLabel="revise" itemValue="3" />
	             </p:selectOneMenu> 
	             
	             
					<h:outputLabel for="role" value="Role: * " />
				 <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" > 
	           <f:selectItem itemLabel="approve" itemValue="1" />   
	            <f:selectItem itemLabel="reject" itemValue="2" />
	             <f:selectItem itemLabel="revise" itemValue="3" />
	             </p:selectOneMenu>     
                
	</p:panelGrid>

				<p:commandButton value="Cancel"  style="float:right;" onclick="screen1.hide();"></p:commandButton>
				<p:commandButton value="Ok"  style="float:right;" onclick="screen1.hide();"></p:commandButton>      
		
		

		</p:panel>
		
	</p:dialog>
</ui:composition>
