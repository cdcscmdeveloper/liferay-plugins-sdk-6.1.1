<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Add" header="ADD" widgetVar="screen1" modal="true">
		<p:panel header="New Desk Officer Admin Assistant" toggleable="true">

			<p:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">
				

				<h:outputLabel for="SelReg" value="Selection of Registration : " />
				  <p:selectOneRadio id="selreg" value="#{searchQtnTenderBB.managedBean.qtno}">  
                     <f:selectItem itemLabel="Profile" itemValue="1" />  
                     <f:selectItem itemLabel="Existing List" itemValue="2" />  
                     <f:selectItem itemLabel="New" itemValue="3" />  
                  </p:selectOneRadio>  

		    	<h:outputLabel for="SelPro" value="Select User Profile: * " />
				<p:inputText id="SelPro" value="#{searchQtnTenderBB.managedBean.qtno}" />

				<h:outputLabel for="ICno" value="IC No.: * " />
				<p:inputText id="ICno" value="#{searchQtnTenderBB.managedBean.qtno}" />

				<h:outputLabel for="Eml" value="Email: * " />
				<p:inputText id="Eml" value="#{searchQtnTenderBB.managedBean.qtno}" />              
                
			</p:panelGrid>

				<p:commandButton value="Cancel"  style="float:right;" onclick="screen1.hide();"></p:commandButton>
				<p:commandButton value="Add"  style="float:right;" onclick="screen1.hide();"></p:commandButton>      
		
		<br/>

		</p:panel>
		
	</p:dialog>
</ui:composition>
