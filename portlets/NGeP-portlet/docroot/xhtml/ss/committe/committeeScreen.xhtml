<ui:composition
	
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

  <p:panel header="TSC Selected List" toggleable="true">
  <h:panelGroup id="table-wrapper" style="width:100%;" >
    <p:dataTable value="#{committeeMB.committeelist}" var="committeeObj" resizableColumns="true">
        
        <p:column headerText="No">  
          <h:outputText value="#{committeeObj.comno}" />  
        </p:column>  
  
        <p:column headerText="Name"> <p:commandLink  actionListener="#{pprBean.savePerson}" style="margin-right:20px;" ajax="false">  
          <h:outputText value="#{committeeObj.comname}" />  
        </p:commandLink>  
     
             
        </p:column>  
  
        <p:column headerText="IC" >  
            <p:outputLabel value="#{committeeObj.ic}"></p:outputLabel>  
        </p:column>  
         <p:column headerText="Passport No." >  
            <p:outputLabel value="#{committeeObj.pass}"></p:outputLabel>  
        </p:column>  
        
         <p:column headerText="Role" >  
            <p:outputLabel value="#{committeeObj.roles}"></p:outputLabel>  
        </p:column>  
        
         <p:column headerText="Access" >  
             
        </p:column>  
        
         <p:column headerText="Action" >  
             
        </p:column>  
       
    </p:dataTable>
  </h:panelGroup>

  </p:panel>

	<div align="right">
	    <p:commandButton value="Add" onclick="screen1.show();" ></p:commandButton>  
	    <p:commandButton value="Clone" onclick="screen2.show();"></p:commandButton>  
    </div>
   <br/>

  <p:panel header="Approval Details" toggleable="true">
  <br/>

  		<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="3"> 		
        <h:outputText style="bold" value="Procurement Mode:&#160; &#160; &#160; " />  
        <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" style="width: 120px;">  
            <f:selectItem itemLabel="Select Mode" itemValue="" />  
            <f:selectItem itemLabel="name 1" itemValue="1" />  
            <f:selectItem itemLabel="name 2" itemValue="2" />  
            <f:selectItem itemLabel="name 3" itemValue="3" />  
        </p:selectOneMenu>  
        
        <h:outputText style="bold" value="Approval Status:&#160; &#160; &#160; " />  
           <p:outputLabel value="Ok"></p:outputLabel>
        
        <h:outputText style="bold" value="Approval Date:&#160; &#160; &#160; " />  
           <p:outputLabel value="10/8/13"></p:outputLabel>
           
        <h:outputText style="bold" value="Approver Action:&#160; &#160; &#160; " />  
        <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" style="width: 120px;">  
            <f:selectItem itemLabel="Select Mode" itemValue="" />  
            <f:selectItem itemLabel="approve" itemValue="1" />  
            <f:selectItem itemLabel="revise" itemValue="2" />   
        </p:selectOneMenu>
        
        <h:outputText style="bold" value="Approval Remarks:&#160; &#160; &#160; " />  
           <p:inputText id="appRemark" required="true" label="remarks"  
                    value="#{CommitteeCodeManagedBean.remarks}" >  
           </p:inputText>                    
           
        </h:panelGrid>          
  </p:panel>

  <p:panel header="QC/PB/FPB Secretary List" toggleable="true">
  
    <h:panelGroup id="table-wrapper" style="width:100%;" >
    <p:dataTable value="#{committeeMB.committeelist}" var="committeeappObj" resizableColumns="true">
        
        <p:column headerText="No">  
           <h:outputText value="#{committeeappObj.appno}" />  
        </p:column>  
  
        <p:column headerText="Group">
          <h:outputText value="#{committeeappObj.appgroup}" />   
       </p:column>  
  
        <p:column headerText="Secretary Name" >  
            <p:outputLabel value="#{committeeappObj.secname}" />  
        </p:column> 
        
        <p:column headerText="Action" >  
        </p:column>         
       
    </p:dataTable>
   
  </h:panelGroup>
  </p:panel>
  
  	<div align="right">
	    <p:commandButton value="Add" ></p:commandButton>  
	      
    </div>
   <br/>
   <br/>
   
  <p:panel header="QC/PBB/PBA/FPB Sabah/FPB Sarawak/MOF List" toggleable="true">
  <br/>

  		<h:panelGrid columns="2" style="margin-bottom:10px" cellpadding="3"> 		
        <h:outputText style="bold" value="Member Type:&#160; &#160; &#160; " />  
        <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" style="width: 120px;">  
            <f:selectItem itemLabel="Select Mode" itemValue="" />  
            <f:selectItem itemLabel="Others" itemValue="1" />  
            <f:selectItem itemLabel="JKR" itemValue="2" />  
            <f:selectItem itemLabel="Turut Hadir" itemValue="3" />  
        </p:selectOneMenu>            

        </h:panelGrid>          
  </p:panel>  
               
	                              	

</ui:composition>
