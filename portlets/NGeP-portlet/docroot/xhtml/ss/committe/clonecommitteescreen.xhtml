<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Clone" header="Clone XXXX" widgetVar="screen2" modal="true">
		<p:panel header="Search Qtn/Tender" toggleable="true">

			<p:panelGrid columns="4" style="width:46%;" styleClass="noBorders tr,noBorders td">
				

				<h:outputText value="Qtn/Tender No" ></h:outputText>
					<p:selectOneMenu>  
    	             <f:selectItem itemLabel="Select One" itemValue="" />  
                     <f:selectItem itemLabel="no 1" itemValue="1" /> 
                     <f:selectItem itemLabel="no 2" itemValue="1" />  
    			    </p:selectOneMenu> 
				</p:panelGrid>
    
     <p:panelGrid columns="4"  style="width:100%;"  styleClass="noBorders tr,noBorders td">
				 
				 <h:outputText value="Created Date (From)" />
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}" id="createdateFrom"
					showOn="button" />

				<h:outputText value="Created Date (To)" />
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}" id="createdateTo" showOn="button" />                

				<h:outputText value="Record Status"></h:outputText>
					<p:selectOneMenu>  
    	             <f:selectItem itemLabel="Select One" itemValue="" />  
                     <f:selectItem itemLabel="Active" itemValue="1" /> 
                     <f:selectItem itemLabel="Non-Active" itemValue="1" />  
    			    </p:selectOneMenu> 
			   
                
			</p:panelGrid>

		<p:commandButton value="SEARCH"
			styleClass="apply_button" style="float:right;">

		</p:commandButton>
		
		<br/>

		</p:panel>
<br/>

		<p:panel header="Search Committee" toggleable="true">
		   <h:panelGroup  style="width:100%;">
				<p:dataTable value="" var="" editable="true">
				
				  <p:ajax event="rowEdit" />  
                  <p:ajax event="rowEditCancel" /> 

					<p:column headerText="Committee Type" style="width:130px">
					  <p:outputLabel value="Type1 " />
					</p:column>

					<p:column headerText="Qtn/Tender No" style="width:5px;">
				      <p:cellEditor>  
                       <f:facet name="output">  
                        <h:outputText value="No 1" />
                     </f:facet>  
                      <f:facet name="input">  
                       <p:inputText value=""/>  
                     </f:facet>  
                    </p:cellEditor>   
					</p:column>

					<p:column headerText="Date Created" style="width:5px">  
                        <h:outputText value="11/12/13" />  
                    </p:column>
                    
					<p:column headerText="Record Status" style="width:5px">  
                        <h:outputText value="Active" />  
                    </p:column>                       
                      
                    <p:column style="width:5px">  
                        <p:rowEditor />  
                     </p:column>  
            
		       </p:dataTable>	
			</h:panelGroup>	
		</p:panel>
		<br/>
		
		<p:panel header="Clone Committee Result" toggleable="true">
		   <h:panelGroup style="width:100%;">
				<p:dataTable value="" var="" >

					<p:column>
					   <p:selectBooleanCheckbox />
					</p:column>

					<p:column headerText="Name">
					   <h:outputText value="John" />
					</p:column>

					 <p:column headerText="Ministry" >  
                        <h:outputText value="Finance" />  
                     </p:column>  
                      
                    <p:column headerText="Division" >  
                       <h:outputText value="Div 2" />  
                    </p:column>  
                    
                    <p:column headerText="Designation" >  
                       <h:outputText value="Head" />  
                    </p:column>  
                    
                    <p:column headerText="Role" >  
                       <h:outputText value="Management" />  
                    </p:column>                                          
            
		       </p:dataTable>			       				
				<p:commandButton value="CLONE"  style="float:right;" onclick="dlg.hide();"></p:commandButton>
			</h:panelGroup>
		</p:panel>		
	</p:dialog>
</ui:composition>
