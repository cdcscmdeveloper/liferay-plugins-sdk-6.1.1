<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Clone" header="Clone XXXX" widgetVar="screen2" modal="true">
		<p:panel header="Search Sourcing" toggleable="true">

			<p:panelGrid columns="4" style="width:100%;" styleClass="noBorders tr,noBorders td">
				

				<h:outputLabel for="clonetitle" value="Title" />
				<p:inputText id="clonetitle" value="" />

		
			    <h:outputText value="Sourcing Type" />  
                  <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}">  
           			<f:selectItem itemLabel="Source 1" itemValue="1" />  
            		<f:selectItem itemLabel="Source 2" itemValue="2" />  
            	    <f:selectItem itemLabel="Source 3" itemValue="3" />  
            		<f:selectItem itemLabel="Source 4" itemValue="4" />  
                  </p:selectOneMenu> 

				<h:outputText value="Created Date (From)" />
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}" id="createdateFrom"
					showOn="button" />

				<h:outputText value="Created Date (To)" />
				<p:calendar value="#{searchQtnTenderBB.managedBean.date}" id="createdateTo" showOn="button" />                

			    <h:outputText value="Sourcing No" />  
                  <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}">  
           			<f:selectItem itemLabel="No 1" itemValue="1" />  
            		<f:selectItem itemLabel="No 2" itemValue="2" />  
            	    <f:selectItem itemLabel="No 3" itemValue="3" />  
            		<f:selectItem itemLabel="No 4" itemValue="4" />  
                </p:selectOneMenu> 
                
			</p:panelGrid>

		<p:commandButton value="#{lbl['lbl.so.searchbtn']}"
			styleClass="apply_button" style="float:right;">

		</p:commandButton>
		
		<br/>

		</p:panel>
<br/>

		<p:panel header="Search Sourcing Result" toggleable="true">
		   <h:panelGroup id="table-wrapper" style="width:100%;">
				<p:dataTable value="" var="committeeObj" >

					<p:column headerText="No">
					  <h:outputText value="" />
					</p:column>

					<p:column headerText="Title">
					   <h:outputText value="" />
					</p:column>

					 <p:column headerText="Date Created" >  
                        <h:outputText value="" />  
                     </p:column>  
                      
                    <p:column headerText="Action" >  
                       <h:outputText value="" />  
                    </p:column>  
            
		       </p:dataTable>	
			</h:panelGroup>	
		</p:panel>
		<br/>
		
		<p:panel header="Clone Committee Result" toggleable="true">
		   <h:panelGroup id="table-wrapper" style="width:100%;">
				<p:dataTable value="" var="committeeObj" >

					<p:column headerText="(CheckBox)">
					</p:column>

					<p:column headerText="Name">
					   <h:outputText value="" />
					</p:column>

					 <p:column headerText="Ministry" >  
                        <h:outputText value="" />  
                     </p:column>  
                      
                    <p:column headerText="Division" >  
                       <h:outputText value="" />  
                    </p:column>  
                    
                    <p:column headerText="Designation" >  
                       <h:outputText value="" />  
                    </p:column>  
                    
                    <p:column headerText="Role" >  
                       <h:outputText value="" />  
                    </p:column>                                          
            
		       </p:dataTable>			       				
				<p:commandButton value="Cancel"  style="float:right;" onclick="dlg.hide();"></p:commandButton>
				<p:commandButton value="Clone"  style="float:right;" onclick="dlg.hide();"></p:commandButton>
			</h:panelGroup>
		</p:panel>		
	</p:dialog>
</ui:composition>
