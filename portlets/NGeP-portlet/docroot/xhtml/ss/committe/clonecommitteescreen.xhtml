<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog id="Clone" header="Clone Committe" widgetVar="screen2"
		modal="true">
		<p:panel>
			<h:panelGrid id="search" columns="4" style="width:100%;"
				styleClass="noBorders tr,noBorders td">


				<h:outputLabel value="Committee No"></h:outputLabel>

				<p:inputText value="#{committeBackingBean.managedBean.committeNo}"></p:inputText>

				<h:outputLabel value="Qtn/Tender No"></h:outputLabel>
				<p:inputText value="#{committeBackingBean.managedBean.qtNo}"
					size="49"></p:inputText>

				<h:outputLabel value="Committe Type"></h:outputLabel>

				<p:selectOneMenu
					value="#{committeBackingBean.managedBean.selectedCommitte}">
					<f:selectItems
						value="#{committeBackingBean.managedBean.committeType}"></f:selectItems>
				</p:selectOneMenu>

				<h:outputLabel value="Date Created"></h:outputLabel>
				<p:calendar value="#{committeBackingBean.managedBean.createdDt}"
					showOn="button" />

				<h:outputLabel value="Record Status" style="width:104px;"></h:outputLabel>

				<p:selectOneMenu style="width:61%;"
					value="#{committeBackingBean.managedBean.status}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Active" itemValue="1" />
					<f:selectItem itemLabel="Non-Active" itemValue="2" />
				</p:selectOneMenu>

			</h:panelGrid>
			<p:commandButton value="SEARCH" style="float:right;"
				action="#{committeBackingBean.cloneSearchCommitteAction}"
				update="clonesearchCommitte,cloneSearchResults" />
			<br />
			<br />
		</p:panel>

		<p:panel header="Results" toggleable="true">
			<p:dataTable id="clonesearchCommitte"
				value="#{committeBackingBean.managedBean.cloneSearchCommittes}"
				var="committe">


				<p:column headerText="CommitteType">
					<h:outputLabel value="#{committe.scCommittee.committeeType}"></h:outputLabel>
				</p:column>
				<p:column headerText="QTN/TenderNo">

					<h:outputLabel value="#{committe.scQt.qtNo}"></h:outputLabel>

				</p:column>
				<p:column headerText="DateCreated">
					<h:outputLabel value="#{committe.scCommittee.createdDate}"></h:outputLabel>
				</p:column>
				<p:column headerText="ApprovalStatus">
					<h:outputLabel value="#{committe.scCommittee.approvalStatus}"></h:outputLabel>
				</p:column>
				<p:column headerText="RecordStatus">
					<h:outputLabel value="#{committe.scCommittee.recordStatus}"></h:outputLabel>
				</p:column>
				<p:column headerText="Action">
					<p:commandButton value="ClONE" style="float:right;"
						action="#{committeBackingBean.cloneCommitteMembersAcition(committe.scCommittee.committeeId)}"
						update="@(.cloneCommitteMembers)" />
				</p:column>
			</p:dataTable>
		</p:panel>

		<p:panel header="Clone Committee Result" toggleable="true">
			<h:panelGroup style="width:100%;">
				<p:dataTable id="cloneSearchResults"
					value="#{committeBackingBean.managedBean.cloneCommitteMemebers}"
					var="member" styleClass="cloneCommitteMembers"
					rowKey="#{member.committeeMemberId}"
					selection="#{committeBackingBean.managedBean.selectedCommitteMemebers}">
					<p:column selectionMode="multiple" style="width:2%" />

					<p:column headerText="Name">
						<h:outputLabel value="#{member.memberName}" />
					</p:column>

					<p:column headerText="Ministry">
						<!--  <h:outputLabel value="#{member.pmOrgProfile.ministry}" />   -->
					</p:column>

					<p:column headerText="Division">
						<!-- <h:outputLabel value="#{member.pmOrgProfile.division}" />  -->
					</p:column>

					<p:column headerText="Designation">
						<!-- <h:outputLabel value="#{member.pmOrgProfile.designation}" />   -->
					</p:column>

					<p:column headerText="Role">
						<h:outputLabel value="#{memberR.memberRole}" />
					</p:column>


				</p:dataTable>
				<p:commandButton value="Cancel" style="float:right;"
					onclick="screen2.hide();"></p:commandButton>
				<p:commandButton value="Clone" style="float:right;"
					action="#{committeBackingBean.addCloneCommitteeMembersAction}"
					oncomplete="screen2.hide();" update="committeMember"></p:commandButton>
			</h:panelGroup>
		</p:panel>
	</p:dialog>
</ui:composition>
