
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

  <p:panel header="Committee Details" toggleable="true">
  <div align ="right">
  	<p:commandLink value="View Qtn/Tender" onclick="screen5.show();" />
  </div>
 <br /> 
  <h:panelGroup  style="width:100%;" >
    <p:dataTable id="committeQc" value="#{committeBackingBean.managedBean.committemembers}"  var="committeqc" resizableColumns="true" editable="true">
   
	    <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />
                             
        <p:column headerText="No">  
		  <h:outputText value="#{index + 1}" />  
        </p:column>  
  
        <p:column headerText="Name"> <p:commandLink  actionListener="#{pprBean.savePerson}" style="margin-right:20px;" ajax="false">  
          <h:outputText value="#{committeqc.memberName}" />  
        </p:commandLink>  
     
             
        </p:column>  
  
		<p:column headerText="IC/PassPort No">
	      <h:outputText value="#{committeqc.icPassport}" />
		</p:column> 
        
		<p:column headerText="Role">
		  <h:outputText value="#{committeqc.memberRole}" />
		</p:column> 
        
        <p:column headerText="Member Type" > 
           <h:outputText value="#{committeqc.memberType}" />       
        </p:column>                  
              
         <p:column headerText="Access" >  
           <h:outputText value="#{committeqc.accessRight}" />
         </p:column>  
        
       <p:column headerText="Action">  
            <p:rowEditor />  
        </p:column> 
          
       
    </p:dataTable>
  </h:panelGroup>

	<div align="right">
	    <p:commandButton value="ADD" onclick="screen1.show();" ></p:commandButton>  
	    <p:commandButton value="CLONE" onclick="screen2.show();"></p:commandButton>  
    </div>
   <br/>
  </p:panel>
		</ui:composition>
