
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

  <p:panel header="Committee Details" toggleable="true">
 <!--   <div align ="right">
  	<p:commandLink value="View Qtn/Tender" onclick="screen5.show();" />
  </div> --> 
 <br /> 
  <h:panelGroup  style="width:100%;" >
    <p:dataTable id="committeQc" value="#{committeBackingBean.managedBean.committemembers}"  var="committeqc" resizableColumns="true" editable="true">
   
	    <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />
                             
        <p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsno']}">  
		  <h:outputText value="#{index + 1}" />  
        </p:column>  
  
        <p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsname']}"> <p:commandLink  actionListener="#{pprBean.savePerson}" style="margin-right:20px;" ajax="false">  
          <h:outputText value="#{committeqc.memberName}" />  
        </p:commandLink>  
     
             
        </p:column>  
  
		<p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsicno']}">
	      <h:outputText value="#{committeqc.icPassport}" />
		</p:column> 
        
		<p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsrole']}">
		  <h:outputText value="#{committeqc.memberRole}" />
		</p:column> 
        
        <p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsmembertype']}"> 
           <h:outputText value="#{committeqc.memberType}" />       
        </p:column>                  
              
         <p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsaccess']}">  
           <h:outputText value="#{committeqc.accessRight}" />
         </p:column>  
        
       <p:column headerText="#{lbl['lbl.sc.committe.qctable.detailsaction']}">  
            <p:rowEditor />  
        </p:column> 
          
       
    </p:dataTable>
  </h:panelGroup>

		<div align="right">
			<p:commandButton value="Add"
				action="#{committeBackingBean.addCommitteMember}"
				 process="@this" oncomplete="screen3.show();" update="@(.qtAddMember)"></p:commandButton>

			<p:commandButton value="Clone" onclick="screen2.show();" process="@this"></p:commandButton>
		</div>
   <br/>
  </p:panel>
		</ui:composition>
