
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

  <p:panel header="Committee Details" toggleable="true">
  <div align ="right">
  	<p:commandLink value="View Qtn/Tender" onclick="screen5.show();" />
  </div>
 <br /> 
  <h:panelGroup  style="width:100%;" >
    <p:dataTable value="#{CommitteBackingBean.managedBean.supplierItemList}"  var="committets" resizableColumns="true" editable="true">
   
	    <p:ajax event="rowEdit" />  
        <p:ajax event="rowEditCancel" />
                             
        <p:column headerText="No">  
          <h:outputText value="#{committets.committeeMemberId}" />  
        </p:column>  
  
        <p:column headerText="Name"> <p:commandLink  actionListener="#{pprBean.savePerson}" style="margin-right:20px;" ajax="false">  
          <h:outputText value="#{committets.memberName}" />  
        </p:commandLink>  
     
             
        </p:column>  
  
        <p:column headerText="IC" >  
            <p:outputLabel value="#{committets.icPassport}"></p:outputLabel>  
        </p:column>  
         <p:column headerText="Passport No." >  
            <p:outputLabel value="#{committets.icPassport}"></p:outputLabel>  
         </p:column>  
        
        <p:column headerText="Role" > 
           <p:cellEditor>
            <f:facet name="output">  
              <h:outputText value="#{committets.memberRole}" />
             </f:facet>  
            <f:facet name="input">  
         <p:selectOneMenu value="#{searchQtnTenderBB.managedBean.qtno}" >
            <f:selectItem itemLabel="Select One" itemValue="" /> 
            <f:selectItem itemLabel="Chairperson" itemValue="" />  
            <f:selectItem itemLabel="Secretary" itemValue="1" />  
            <f:selectItem itemLabel="Member" itemValue="2" />   
         </p:selectOneMenu> 
                </f:facet>  
            </p:cellEditor>            
        </p:column>  
        
        <p:column headerText="Member Type" > 
           <h:outputText value="#{committets.memberType}" />       
        </p:column>                  
              
         <p:column headerText="Access" >  
           <h:outputText value="#{committets.accessRight}" />
         </p:column>  
        
       <p:column headerText="Action">  
            <p:rowEditor />  
        </p:column> 
          
       
    </p:dataTable>
  </h:panelGroup>

	<div align="right">
	    <p:commandButton value="ADD" onclick="screen1.show();" ></p:commandButton>  
	    <p:commandButton value="CLONE" onclick="screen2.show();"></p:commandButton>  
    </div>
   <br/>
  </p:panel>
		</ui:composition>
