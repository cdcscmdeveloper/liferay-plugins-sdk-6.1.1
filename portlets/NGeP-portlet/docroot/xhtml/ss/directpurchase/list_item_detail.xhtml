<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		
	<table style="width: 100%">
			<tr>
				<td><h4 style="color: white; text-align: left; background-color: blue;">
						<h:outputText value="#{lbl['lbl.sc.item.detail']}" />
					</h4></td>
			</tr>
			<tr>
				<td width="100%" align="right">
					<p:button value="#{lbl['lbl.sc.action.search.catelogue']}" />
					<p:button value="#{lbl['lbl.sc.action.simple.quote']}" />
					<p:button value="#{lbl['lbl.sc.action.simple.bid']}" />
					<p:button value="#{lbl['lbl.sc.action.clone']}" />
				</td>
			</tr>
		</table>
		<p:panel label="#{lbl['lbl.sc.item.detail']}">
			<h:panelGrid columns="1" width="100%">
				<p:dataTable id="itemdataTable"
			        width="100%"
			        cellpadding="1"
			        columnClasses="at-dataTable-columnClass">
			        <p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.category']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.minqty']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.uom']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.supplier']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.unitPerPrice']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.amount']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.quotebid']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.item.detail.recentPrice']}" /></f:facet>
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</p:panel>
</ui:composition>
