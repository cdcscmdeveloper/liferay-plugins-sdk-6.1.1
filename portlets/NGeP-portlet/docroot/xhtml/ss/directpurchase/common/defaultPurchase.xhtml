<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:dp="http://openam.com/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="content">
			<div align="right">
				<p:commandButton value="#{lbl['lbl.ss.save']}" />
				&#160;
				<p:commandButton value="#{lbl['lbl.ss.submit']}" />
			</div>


			<p:panel header="PURCHASE IN DEFAULT">
				<div align="right">
					<p:commandButton value="SEARCH CATALOGUE" />
				</div>
				<p:dataTable var="simpleQuote"
					value="#{simpleQuoteBidBackingBean.utilList}"
					selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
					rowKey="#{simpleQuote.seqNo}" rowIndexVar="index">

					<p:columnGroup type="header">
						<p:row>

							<p:column colspan="1" headerText="Item Nam" />
							<p:column colspan="1" headerText="UOM" />
							<p:column colspan="1" headerText="Category Type" />
							<p:column colspan="1" headerText="PKP/Contract No." />
							<p:column colspan="1" headerText="Contract Period" />
							<p:column colspan="1" headerText="Contract Amount" />
							<p:column colspan="1" headerText="Quantity Offer" />
						</p:row>
					</p:columnGroup>

					<p:column>
						<p:outputLabel value="#{simpleQuote.supplier}" />
					</p:column>
					<p:column>
						<p:outputLabel value="#{simpleQuote.description}" />
					</p:column>
					<p:column>
						<p:outputLabel value="#{simpleQuote.qtyOrder}" />
					</p:column>
					
					<p:column>
						<p:outputLabel value="#{simpleQuote.unitPerPrice}" />
					</p:column>
					<p:column>
						<p:outputLabel value="#{simpleQuote.amount}" />
					</p:column>
					<p:column>
						<p:outputLabel />
					</p:column>
					<p:column selectionMode="single" style="width:2%" />


				</p:dataTable>
				
				<p:panelGrid  style="width:100%;" styleClass="noBorders tr,noBorders td">
				
				<p:row>
                <p:column>
                <p:outputLabel value="Approval ListName"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:selectOneMenu>
                <f:selectItem itemLabel="" itemValue=""></f:selectItem>
                </p:selectOneMenu>
                </p:column>
                </p:row>
                <p:row>
                <p:column>
                <p:outputLabel value="Remarks"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:inputTextarea rows="1" cols="100"></p:inputTextarea>
                </p:column>
                </p:row>
                </p:panelGrid>
			</p:panel>
		
	</ui:define>
</ui:composition>
