<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
     <p:dialog id="addToCartPopup" widgetVar="addToCartPopup" modal="true" width="800" height="500" resizable="false" >
     
      <p:panel header="ADD TO CART">
		<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:100%">
			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.ss.supp.name']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText size="79" disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.smSupplier.companyName}" />
				</p:column>
			</p:row>

          	<p:row>
				<p:column width="20%">
					<p:outputLabel value="#{lbl['lbl.ss.product.code']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.extensionCode}" />
				</p:column>
		    </p:row>
		    
			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.ss.item.name']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText  size="79" disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.itemName}" />
				</p:column>
			</p:row>
			
			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.desc']}" />
				</p:column>
				<p:column colspan="3">
					<p:inputTextarea readonly="true"  disabled="true" rows="2" cols="80" value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.itemDesc}" />
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.uom']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.pmUom.uomName}">
					</p:inputText>
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.min.qty']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.minOrder}">
					</p:inputText>
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.order.qty']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.requestNoteItem.quantity}"/>
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.price.type']}" />
				</p:column>
				<p:column width="25%">
				<p:selectOneMenu  id="priceType"
						value="#{directPurchaseBackingBean.managedBean.priceType}">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" />
						<f:selectItems
						value="#{directPurchaseBackingBean.managedBean.priceTypes}"
						var="cmprice"
						itemLabel="#{cmprice.pricingType}" itemValue="#{cmprice.pricingType}" />
						
					</p:selectOneMenu> 
				</p:column>
			</p:row>
			
		 	<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.procurement.type']}" />
				</p:column>
				<p:column>
				<p:selectOneMenu
						value="#{directPurchaseBackingBean.managedBean.procurementType}">
						<f:selectItems
							value="#{directPurchaseBackingBean.getDropdownCodeValues(ParameterTypeConst.procurementType)}" />
				</p:selectOneMenu>
				</p:column>
			</p:row>	
			
			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.justification']}" />
				</p:column>
				<p:column width="25%">
					<p:selectOneMenu
						value="#{directPurchaseBackingBean.managedBean.justification}">
						<f:selectItem itemLabel="Select One" itemValue="#{null}" /> 
						<f:selectItem itemLabel="Ad hoc meeting" itemValue="01"/>
						<f:selectItem itemLabel="Car Break down" itemValue="02"/>
						<f:selectItem itemLabel="Others (Ad Hoc)" itemValue="03"/>
                      </p:selectOneMenu>
                      <p:inputText  size="35" value="100"/>
				</p:column>
			</p:row>	
		</p:panelGrid>
		 <p:spacer width="20px"/>
	    <p:panelGrid style="width:100%;"
			 styleClass="noBorders tr,noBorders td">
			  <p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.ss.ok']}" action="#{directPurchaseBackingBean.submitAddToCart}"
					    oncomplete="addToCartPopup.hide();" icon="ui-icon-ok" />
					<p:commandButton value="#{lbl['lbl.ss.cancel']}" onclick="addToCartPopup.hide()" icon="ui-icon-close" />
				</p:column>
			  </p:row>
		 </p:panelGrid>
       
      </p:panel>
	</p:dialog>
</ui:composition>
