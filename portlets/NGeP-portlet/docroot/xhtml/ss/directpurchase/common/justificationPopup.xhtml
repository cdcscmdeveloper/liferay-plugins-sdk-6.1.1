<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:dialog widgetVar="justPopup" modal="true"
		width="550" height="250" resizable="false">

      <p:panel header="Justification">
		<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:60%">
			<p:row>
				<p:column width="20%">
					<p:outputLabel value="#{lbl['lbl.sc.purchase.procurement.type']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText readonly="true" value="" />
				</p:column>
			</p:row>

			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.sc.purchase.justification']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText readonly="true" value="" />
				</p:column>

			</p:row>
			<p:row>
              <p:column width="25%"></p:column>
				<p:column colspan="3">
					<p:inputTextarea readonly="true" rows="2" cols="80" value="" />
				</p:column>
			</p:row>


		</p:panelGrid>
	  </p:panel>
	</p:dialog>
</ui:composition>
