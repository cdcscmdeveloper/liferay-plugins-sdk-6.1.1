<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel id="zonePanel" header="ZONE" toggleable="true">
		<h:panelGrid width="100%" style="margin-top:20px">
			<p:dataTable id="zoneLocationDataTable" value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.scQBZones}" var="qbZone">
				<p:column headerText="Name">
					#{qbZone.zoneName}
				</p:column>
				<p:column headerText="Action">
					<p:commandLink>
						<p:graphicImage library="ep/images/design" name="delete.png"
							value="/resources/ep/images/design/delete.png" />
					</p:commandLink>
				</p:column>
			</p:dataTable>
			<div align="right" style="width: 100%">
				<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" onclick="ZoneLocation.show();" icon="ui-icon-add"/>
			</div>
		</h:panelGrid>
	</p:panel>
	<ui:include src="/xhtml/ss/directpurchase/common/zonePricePopup.xhtml" />
</ui:composition>
