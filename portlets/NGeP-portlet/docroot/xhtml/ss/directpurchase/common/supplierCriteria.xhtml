<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:panel header="INVITATION CRITERIA" toggleable="true">

		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:100%">
					<p:selectBooleanCheckbox>By Business Nature</p:selectBooleanCheckbox>
				</p:column>
			</p:row>
		</p:panelGrid>
		<p:dataTable id="businessNatureTable"
			value="#{simpleQuoteBidBackingBean.managedBean.businessNatureCriterias}"
			var="businessNatureCriteria" editable="true">
			<p:column headerText="Code">
				<p:cellEditor>
					<f:facet name="output">
						<h:outputText value="#{businessNatureCriteria.criteriaValue}" />
					</f:facet>
					<f:facet name="input">
						<p:inputText value="#{businessNatureCriteria.criteriaValue}" style="width:100%" />
					</f:facet>
				</p:cellEditor>
			</p:column>
			<p:column headerText="Description">
			</p:column>
			<p:column style="width:6%">  
				<p:rowEditor />  
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.ct.ded.btn.add']}" process="@this" partialSubmit="true"  icon="ui-icon-add"
			  action="#{simpleQuoteBidBackingBean.addBusinessNature()}" update="businessNatureTable"/>
		</div>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:100%">
					<p:selectBooleanCheckbox>By Locality</p:selectBooleanCheckbox>
				</p:column>
			</p:row>
		</p:panelGrid>
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column style="width:15%">
					<p:selectBooleanCheckbox>By Supplier</p:selectBooleanCheckbox>
				</p:column>
				<p:column style="width:15%">
					<p:selectBooleanCheckbox>By Supplier</p:selectBooleanCheckbox>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
	<p:panel header="SUPPLIER" toggleable="true">

		<p:dataTable var="simpleQuote"
			value="#{simpleQuoteBidBackingBean.utilList}"
			selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
			rowKey="#{simpleQuote.seqNo}" rowIndexVar="index">

			<p:column selectionMode="multiple" style="width:2%" />

			<p:column
				headerText="#{lbl['lbl.ss.simple.quote.purchase.group.seq.no']}"
				style="width:10%">
				<h:outputText value="#{index+1}"></h:outputText>
			</p:column>

			<p:column headerText="Company Name" style="width:50%">
				<h:outputText value="Commerce Dot Com"></h:outputText>
			</p:column>

			<p:column headerText="Supplier Status" style="width:38%">
				<h:outputText value="Active"></h:outputText>
			</p:column>



		</p:dataTable>

	</p:panel>
</ui:composition>
