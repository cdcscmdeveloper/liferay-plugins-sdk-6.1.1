<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<p:panel header="HEADER">

			<p:panelGrid  style="width:100%;" styleClass="noBorders tr,noBorders td">
				
				<p:row>
                <p:column>
                <p:outputLabel value="Ministry Code"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:inputText></p:inputText>
                </p:column>
                <p:column>
                <p:outputLabel value="Department Code/Name"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:inputText></p:inputText>
                </p:column>
                </p:row>
                
                
                <p:row>
                <p:column>
                <p:outputLabel value="Division Code/Name"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:inputText></p:inputText>
                </p:column>
                <p:column>
                <p:outputLabel value="Requisitioner"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:inputText></p:inputText>
                </p:column>
                </p:row>
                
                
                  <p:row>
                <p:column>
                <p:outputLabel value="Requisition Title"></p:outputLabel>
                </p:column>
                   <p:column colspan="3">
                <p:inputText size="100"></p:inputText>
                </p:column>
               
                </p:row>
                
                <p:row>
                <p:column>
                <p:outputLabel value="Remarks"></p:outputLabel>
                </p:column>
                   <p:column colspan="3">
                <p:inputText size="100"></p:inputText>
                </p:column>
               
                </p:row>
                
                 <p:row>
                <p:column>
                <p:outputLabel value="Price Mode"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:selectOneMenu> 
				
	                 <f:selectItem itemLabel="Tier" itemValue="1" />   
	                
	          </p:selectOneMenu>
                </p:column>
               
                </p:row>
                
         
</p:panelGrid>

</p:panel>	
		
	<p:panel header="QUOTE DETAIL" >
     <p:commandLink value="Item Detail"></p:commandLink>
			<p:dataTable  var="simpleQuote"
				value="#{simpleQuoteBidBackingBean.utilList}"
				selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
				rowKey="#{simpleQuote.seqNo}" rowIndexVar="index">

			

				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.group.seq.no']}" style="width:10%">
					<h:outputText value="#{index+1}"></h:outputText>
				</p:column>

				<p:column headerText="Item Name" style="width:10%">
					<h:outputText value="#{simpleQuote.description}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.description']}" style="width:35%">
					<h:outputText value="#{simpleQuote.supplier}Description"></h:outputText>
				</p:column>
                
                <p:column headerText="Product Code" style="width:5%">
					<h:outputText value="123#{index+1}"></h:outputText>
				</p:column>
                
                
				<p:column headerText="Quantity" style="width:25%">
					<h:outputText value="#{simpleQuote.qtyOrder}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.simple.quote.item.uom']}" style="width:5%">
					<h:outputText value="#{simpleQuote.uom}"></h:outputText>
				</p:column>

				
				  <p:column headerText="Action" style="width:10%">  
            <p:commandLink >
				     <p:graphicImage    library="ep/images/design" name="delete.png" value="/resources/ep/images/design/delete.png" />
                  
                 </p:commandLink>
           
                
        </p:column>  
				

			</p:dataTable>
			<div align="right">
			<p:commandButton  value="ADD"/>
			</div>
			
			
			
			<p:panelGrid  style="width:100%;" styleClass="noBorders tr,noBorders td">
				
				<p:row>
                <p:column>
                <p:outputLabel value="Quote Price"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:inputText></p:inputText>
                </p:column>
                <p:column>
                <p:outputLabel value="Panel"></p:outputLabel>
                </p:column>
                   <p:column>
               <p:selectOneRadio>
               <f:selectItem itemLabel="Yes" itemValue="true" ></f:selectItem>
                 <f:selectItem itemLabel="No" itemValue="false" ></f:selectItem>
               </p:selectOneRadio>
                </p:column>
                </p:row>
                
                
                <p:row>
                <p:column>
                <p:outputLabel value="start Date"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:calendar showOn="button"></p:calendar>
                </p:column>
                <p:column>
                <p:outputLabel value="End Date"></p:outputLabel>
                </p:column>
                   <p:column>
                <p:calendar showOn="button"></p:calendar>
                </p:column>
                </p:row>
                
			</p:panelGrid>
			

		</p:panel>	
			
					
					
				
				
				
				
					
</ui:composition>
