<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:panel header="HEADER" toggleable="true"  toggleSpeed="500">
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">

			<p:row>
				<p:column>
					<p:outputLabel value="Ministry Code"></p:outputLabel>
				</p:column>
				<p:column>
					<p:inputText></p:inputText>
				</p:column>
				<p:column>
					<p:outputLabel value="Department Code/Name"></p:outputLabel>
				</p:column>
				<p:column>
					<p:inputText></p:inputText>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Division Code/Name"></p:outputLabel>
				</p:column>
				<p:column>
					<p:inputText></p:inputText>
				</p:column>
				<p:column>
					<p:outputLabel value="Requisitioner"></p:outputLabel>
				</p:column>
				<p:column>
					<p:inputText></p:inputText>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
	<p:panel header="QUOTE DETAIL" toggleable="true"  toggleSpeed="500">
		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column>
					<p:outputLabel value="Requisition Title"></p:outputLabel>
				</p:column>
				<p:column colspan="3">
					<p:inputText size="100" value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.title}"></p:inputText>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Price Mode"></p:outputLabel>
				</p:column>
				<p:column colspan="3">
					<p:selectOneMenu value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.priceMode}">
						<f:selectItem itemLabel="Normal" itemValue="N"></f:selectItem>
						<f:selectItem itemLabel="Zone" itemValue="Z"></f:selectItem>
						<f:selectItem itemLabel="Tier" itemValue="T" />
						<f:selectItem itemLabel="Zone Tier" itemValue="ZT"></f:selectItem>
					</p:selectOneMenu>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Panel"></p:outputLabel>
				</p:column>
				<p:column colspan="3">
					<p:selectOneRadio value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.isPanel}">
						<f:selectItem itemLabel="Yes" itemValue="1"></f:selectItem>
						<f:selectItem itemLabel="No" itemValue="0"></f:selectItem>
					</p:selectOneRadio>
				</p:column>
			</p:row>
			<p:row>
				<p:column width="25%">
					<p:outputLabel value="start Date"></p:outputLabel>
				</p:column>
				<p:column width="25%">
					<p:calendar value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.startDate}" showOn="button"></p:calendar>
				</p:column>
				<p:column width="25%">
					<p:outputLabel value="End Date"></p:outputLabel>
				</p:column>
				<p:column width="25%">
					<p:calendar value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.endDate}" showOn="button"></p:calendar>
				</p:column>
			</p:row>	
			<p:row>
				<p:column>
					<p:outputLabel value="Estimate Price"></p:outputLabel>
				</p:column>
				<p:column colspan="3">
					<p:inputText value="#{simpleQuoteBidBackingBean.managedBean.scQuoteBid.estimatePrice}"></p:inputText>
				</p:column>
			</p:row>
			<p:row>
				<p:column>
					<p:outputLabel value="Remarks"></p:outputLabel>
				</p:column>
				<p:column colspan="3">
					<p:inputText size="100"></p:inputText>
				</p:column>
			</p:row>
		</p:panelGrid>
	</p:panel>
	<p:panel header="ITEM DETAIL" toggleable="true"  toggleSpeed="500">
		<p:dataTable 
			value="#{simpleQuoteBidBackingBean.managedBean.quoteBidItems}"
			var="item" rowIndexVar="index">
			<p:column
				headerText="#{lbl['lbl.ss.simple.quote.purchase.group.seq.no']}"
				style="width:10%">
				<h:outputText value="#{index+1}"></h:outputText>
			</p:column>
			<p:column headerText="Item Name" style="width:10%">
				<h:outputText value="#{item.itemName}"></h:outputText>
			</p:column>
			<p:column
				headerText="#{lbl['lbl.ss.simple.quote.purchase.description']}"
				style="width:35%">
				<h:outputText value="#{item.itemDesc}"></h:outputText>
			</p:column>
			<p:column headerText="Product Code" style="width:5%">
				<h:outputText value="#{item.cmItem.extensionCode}"></h:outputText>
			</p:column>
			<p:column headerText="Quantity" style="width:25%">
				<h:outputText value="#{item.quantity}"></h:outputText>
			</p:column>
			<p:column headerText="#{lbl['lbl.ss.simple.quote.item.uom']}"
				style="width:5%">
				<h:outputText value="#{item.uom}"></h:outputText>
			</p:column>
			<p:column headerText="Action" style="width:10%">
				<p:commandLink>
					<p:graphicImage library="ep/images/design" name="delete.png"
						value="/resources/ep/images/design/delete.png" />

				</p:commandLink>
			</p:column>
		</p:dataTable>
		<div align="right">
			<p:commandButton value="ADD" />
		</div>
		
	</p:panel>
</ui:composition>
