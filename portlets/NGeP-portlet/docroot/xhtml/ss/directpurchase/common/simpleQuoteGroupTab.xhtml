<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="sideMenu">
		<ui:include
			src="/xhtml/ss/directpurchase/common/ss_directpurchase_sidemenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<p:panel header="SimpleQuote-PTJ">
			<p:panelGrid style="width:100%;"
				styleClass="noBorders tr,noBorders td">
				<p:row>
					<p:column width="100%" style="text-align:right">
						<p:commandButton value="SUBMIT" />
					</p:column>
				</p:row>
			</p:panelGrid>
			<p:tabView>
				<p:tab title="GENERAL" styleClass="noBorders tr,noBorders td">
					<ui:include src="/xhtml/ss/directpurchase/common/general.xhtml" />
				</p:tab>
				<p:tab title="ZONE PRICE" styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/ss/directpurchase/common/supplierCriteria.xhtml" />
				</p:tab>
				<p:tab title="SUPPLIER CRITERIA"
					styleClass="noBorders tr,noBorders td">
					<ui:include
						src="/xhtml/ss/directpurchase/common/supplierCriteria.xhtml" />
				</p:tab>
			</p:tabView>
		</p:panel>
	</ui:define>
</ui:composition>
