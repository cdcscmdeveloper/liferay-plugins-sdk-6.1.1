<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<div align="right" id="div_globe_11">
			<p:commandButton id="commond_button_save1" process="@all"
				value="#{lbl['lbl.ss.save']}"
				action="#{simpleQuoteBidBackingBean.saveQuoteBid('saveQuote')}"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.ss.submit']}" action="#{simpleQuoteBidBackingBean.submitQuoteBid('saveQuote')}">
			</p:commandButton>
		</div>
		<c:if test="#{simpleQuoteBidBackingBean.managedBean.action eq SourcingConstants.createSimpleQuote}">
			<p:tabView id="dp" orientation="left" widgetVar="dp">
			<p:tab id="simpleQuoteTab" title="#{lbl['lbl.sc.tab.title.simple.quote']}" >
				<p:panel header="Simple Quote-PTJ">
					<p:tabView dynamic="true" activeIndex="#{simpleQuoteBidBackingBean.managedBean.activeTabIndex}">
						<p:tab title="GENERAL" styleClass="noBorders tr,noBorders td">
							<ui:include src="/xhtml/ss/directpurchase/common/general.xhtml" />
						</p:tab>
						<p:tab title="ZONE PRICE" styleClass="noBorders tr,noBorders td">
							<ui:include src="/xhtml/ss/directpurchase/common/zonePrice.xhtml" />
						</p:tab>
						<p:tab title="SUPPLIER CRITERIA"
							styleClass="noBorders tr,noBorders td">
							<ui:include
								src="/xhtml/ss/directpurchase/common/supplierCriteria.xhtml" />
						</p:tab>
					</p:tabView>
				</p:panel>
			</p:tab>
			<!-- p:tab id="marketResearch"
				title="#{lbl['lbl.ss.sidemenu.market.research']}">
				<ui:include src="/xhtml/ss/directpurchase/marketResearch.xhtml"></ui:include>
			</p:tab-->
		</p:tabView>
		</c:if>
		<c:if test="#{simpleQuoteBidBackingBean.managedBean.action eq SourcingConstants.createSimpleBid}">
			<p:tabView id="dp" dynamic="true" orientation="left" widgetVar="dp">
			<p:tab id="simpleQuoteTab" title="#{lbl['lbl.sc.tab.title.simple.bid']}">
				<p:panel header="Simple Bid-PTJ">
					<p:tabView dynamic="true">
						<p:tab title="GENERAL" styleClass="noBorders tr,noBorders td">
							<ui:include src="/xhtml/ss/directpurchase/common/general.xhtml" />
						</p:tab>
						<p:tab title="SUPPLIER CRITERIA"
							styleClass="noBorders tr,noBorders td">
							<ui:include
								src="/xhtml/ss/directpurchase/common/supplierCriteria.xhtml" />
						</p:tab>
					</p:tabView>
				</p:panel>
			</p:tab>
			<!-- p:tab id="marketResearch"
				title="#{lbl['lbl.ss.sidemenu.market.research']}">
				<ui:include src="/xhtml/ss/directpurchase/marketResearch.xhtml"></ui:include>
			</p:tab-->
		</p:tabView>
		</c:if>
	</ui:define>
</ui:composition>
