<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
     <p:dialog  widgetVar="pricingPopup" modal="true"
		width="650" height="400" resizable="false">
      <p:panel header="Pricing">
		<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:100%">
			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.ss.supp.name']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.smSupplier.companyName}"/>
				</p:column>
			</p:row>

			<p:row>
				<p:column width="25%">
					<p:outputLabel value="#{lbl['lbl.ss.item.name']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmItem.itemName}" />
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.desc']}" />
				</p:column>
				<p:column colspan="3">
					<p:inputTextarea disabled="true" rows="2" cols="80" value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.itemDesc}" />
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.uom']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true"
						value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.pmUom.uomName}">
					</p:inputText>
				</p:column>
			</p:row>

			<p:row>
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.price.type']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText disabled="true" value="#{directPurchaseBackingBean.managedBean.priceType}" />
				</p:column>
			</p:row>
		</p:panelGrid>
        <p:spacer height="10px"/>

			<p:dataTable id="priceDtl" var="pricing"
				value="#{directPurchaseBackingBean.managedBean.requestSupplierItem.pricing.cmSupplierItem.cmPricings}"
				rowKey="#{pricing}" rowIndexVar="index">

				<p:column headerText="#{lbl['lbl.ss.zone']}">
					<h:outputText value="zone" />
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.from.qty']}">
					<h:outputText value="#{pricing.fromQty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.to.qty']}">
					<h:outputText value="#{pricing.toQty}" />
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.price.per.uom']}">
					<h:outputText value="#{pricing.price}" />
				</p:column>

			</p:dataTable>


		</p:panel>
	</p:dialog>
</ui:composition>
