<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Simple Quote">
		
		 <p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
				   <p:commandButton value="#{lbl['lbl.ss.submit']}" action="#{directPurchaseBackingBean.savePrInquiry()}"
				      oncomplete="prInquiry.hide();"/>
				</p:column>
			</p:row>
		</p:panelGrid>
        <p:spacer height="10px"/>
			<p:panelGrid styleClass="noBorders tr,noBorders td" >
				<p:row>
					<p:column>
						<p:outputLabel
							value="#{lbl['lbl.ss.simple.quote.supp.simple.quote.no']}" />
					</p:column>
					<p:column width="25%">
						<p:inputText readonly="true" />
					</p:column>

					<p:column>
						<p:outputLabel value="#{lbl['lbl.ss.simple.quote.supp.ptn.name']}" />
					</p:column>

					<p:column width="25%">
						<p:inputText readonly="true" />
					</p:column>

					<p:column>
						<p:outputLabel value="#{lbl['lbl.ss.simple.quote.supp.req.date']}" />
					</p:column>
					<p:column width="25%">
						<p:inputText readonly="true" />
					</p:column>
				</p:row>
			</p:panelGrid>

			<p:spacer height="15px" />
			<p:panel header=" Item Specs" toggleable="true">
				<p:panelGrid styleClass="noBorders tr,noBorders td" style="width:100%">
					<p:row>
						<p:column width="25%">
							<p:outputLabel value="#{lbl['lbl.ss.simple.quote.supp.title']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" value="" size="80"/>
						</p:column>
					</p:row>

					<p:row>
						<p:column width="20%">
							<p:outputLabel value="#{lbl['lbl.ss.simple.quote.supp.desc']}" />
						</p:column>
						<p:column width="25%">
							<p:inputTextarea readonly="true" rows="2" cols="80" value="" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<p:outputLabel
								value="#{lbl['lbl.ss.simple.quote.supp.start.date']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" value="" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<p:outputLabel
								value="#{lbl['lbl.ss.simple.quote.supp.end.date']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" value="">
							</p:inputText>
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<p:outputLabel
								value="#{lbl['lbl.ss.simple.quote.supp.no.of.quote']}" />
						</p:column>
						<p:column colspan="3">
							<p:selectOneRadio
								value="#{directPurchaseBackingBean.managedBean.stockAvailability}"
								rendered="true">
								<f:selectItem itemLabel="Single" itemValue="true" />
								<f:selectItem itemLabel="Multiple" itemValue="false" />
							</p:selectOneRadio>
						</p:column>
					</p:row>

				</p:panelGrid>
			</p:panel>

			<p:panel header="Item List" toggleable="true">

				<p:dataTable id="suppdtlId" var="">

					<p:column headerText="#{lbl['lbl.ss.simple.quote.supp.item.name']}">
						<h:outputText value="-" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.ss.simple.quote.supp.min.qty.order']}">
						<h:outputText value="-" />
					</p:column>

					<p:column headerText="#{lbl['lbl.ss.simple.quote.supp.qty.order']}">
						<h:outputText value="" />
					</p:column>

					<p:column headerText="#{lbl['lbl.ss.simple.quote.supp.uom']}">
						<h:outputText value="" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.ss.simple.quote.supp.spec.offered']}">
						<h:outputText value="433" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.ss.simple.quote.supp.qty.offered']}">
						<h:outputText value="43" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.ss.simple.quote.supp.price.per.uom']}">
						<h:outputText value="43" />
					</p:column>

					<p:column
						headerText="#{lbl['lbl.ss.simple.quote.supp.tot.amount']}">
						<h:outputText value="43" />
					</p:column>
				</p:dataTable>
			</p:panel>

			<p:spacer height="15px" />
			<p:panel header="Remarks" toggleable="true">
				<table style="width: 100%">
					<tr>
					  <td class="TableFieldLeft" width="24%"><h:outputLabel value="Remark" /></td>
					  <td class="TableFieldRight">
					  <p:dataGrid id="catatan" value=""  columns="1" >
						<table>
							<tr>
								<td rowspan="2" valign="top">
								  <h:graphicImage value="" height="30" width="30" />
								</td>
								<td width="5"></td>
								<td>
								 <h:outputText value=""></h:outputText>,
								 <h:outputText id="remarkDate" value="">
								 <f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
								 </h:outputText>
								</td>
						    </tr>
							<tr><td></td>
							 <td><h:inputTextarea cols="40" />  </td>
						   </tr>
					</table>
				    </p:dataGrid>
			     </td>
			    </tr>
		      </table>    			
			</p:panel>
	</p:panel>
</ui:composition>
