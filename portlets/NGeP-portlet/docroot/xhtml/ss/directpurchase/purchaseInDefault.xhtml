<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:dp="http://openam.com/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>
	<h:head>
		<h:outputStylesheet library="ep/css" name="ep.css" />
	</h:head>
	<ui:define name="contentSection">
		<div align="right" id="div_globe_11">
			<p:commandButton id="commond_button_save1" process="@all"
				value="#{lbl['lbl.ss.save']}"
				action="#{directPurchaseBackingBean.saveRequestList('save')}"></p:commandButton>
			<p:commandButton process="@all" value="#{lbl['lbl.ss.submit']}"
				action="#{directPurchaseBackingBean.submitAction('submit')}">
			</p:commandButton>
		</div>
		<p:panel id="globe_panel_1"
			label="#{lbl['lbl.ss.panel.title.general']}"
			header="#{lbl['lbl.ss.panel.title.general']}" toggleable="true"
			toggleSpeed="500">
			<p:spacer height="10" />
			<table style="width: 100%">
				<tr>
					<td width="20%" align="left"><p:outputLabel
							value="#{lbl['lbl.ss.simple.quote.ministry.code']}" /></td>
					<td><p:inputText readonly="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.ss.simple.quote.department']}" /></td>
					<td><p:inputText readonly="true" /></td>
				</tr>
				<tr>
					<td width="20%" align="left"><p:outputLabel
							value="#{lbl['lbl.ss.simple.quote.devision']}" /></td>
					<td><p:inputText readonly="true" /></td>
					<td><p:outputLabel
							value="#{lbl['lbl.ss.simple.quote.requisitioner']}" /></td>
					<td><p:inputText readonly="true" /></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>
</ui:composition>
