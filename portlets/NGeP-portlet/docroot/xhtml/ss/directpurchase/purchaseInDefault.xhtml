<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<p:panel header="Purchase In Default ">
     <p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
				   <p:commandButton value="#{lbl['lbl.ss.submit']}" action="#{directPurchaseBackingBean.savePrInquiry()}"
				      oncomplete="prInquiry.hide();" />
				</p:column>
			</p:row>
		</p:panelGrid>
		<p:spacer height="10px"/>
		<p:panelGrid styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column>
					<p:outputLabel
						value="#{lbl['lbl.ss.purchase.in.default.pid.no']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText readonly="true" />
				</p:column>

				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.pkp.no']}" />
				</p:column>

				<p:column width="25%">
					<p:inputText readonly="true" />
				</p:column>

				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.cat.type']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText readonly="true" />
				</p:column>
				
				<p:column>
					<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.status']}" />
				</p:column>
				<p:column width="25%">
					<p:inputText readonly="true" />
				</p:column>
				
			</p:row>
		</p:panelGrid>

		<p:spacer height="15px" />
		<p:panel header=" Contract Detail" toggleable="true">
			<p:panelGrid styleClass="noBorders tr,noBorders td">
					<p:row>
						<p:column width="25%">
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.supp.name']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" value=""  size="35"/>
						</p:column>
					</p:row>

					<p:row>
						<p:column width="20%">
							<p:outputLabel
								value="#{lbl['lbl.ss.purchase.in.default.prod.code']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" />
						</p:column>

						<p:column width="25%">
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.item.name']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" />
						</p:column>
					</p:row>
					
					<p:row>
						<p:column>
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.min.qty.no']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" />
						</p:column>
					</p:row>

					<p:row>
						<p:column>
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.price.per.uom']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" />
						</p:column>
					</p:row>
                   
                   	<p:row>
						<p:column>
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.val.period']}" />
						</p:column>
						<p:column width="25%" colspan="2">
							<p:inputText value="" readonly="true" />
							<p:inputText readonly="true" />
						</p:column>
					</p:row>
					
					<p:row>
						<p:column>
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.max.proc.amt']}" />
						</p:column>
						<p:column width="25%">
							<p:inputText readonly="true" />
						</p:column>
					</p:row>
		
		 </p:panelGrid>
		</p:panel>

		   <p:panel header="Justification" toggleable="true">
			   <p:panelGrid styleClass="noBorders tr,noBorders td">
					<p:row>
						<p:column width="25%">
							<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.just']}"/>
						</p:column>
					    <p:column width="25%">
							<p:selectOneMenu
								value="#{directPurchaseBackingBean.managedBean.stockAvailability}">
								<f:selectItem itemLabel="Cheaper Price" />
							</p:selectOneMenu>
						 </p:column>
					</p:row>

				<p:row>
					<p:column width="25%">
						<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.remark']}"/>
					</p:column>

					<p:column width="25%">
						<p:inputTextarea readonly="true" cols="35" rows="3" />
					</p:column>
				</p:row>
				
				<p:row>
					<p:column width="25%">
						<p:outputLabel value="#{lbl['lbl.ss.purchase.in.default.attachment']}" />
					</p:column>

					<p:column width="25%">
					<p:commandButton oncomplete="uploadDlg.show();return false;" icon="iconAttachment" 
					   value="Attach file(s)" />
					</p:column>
				</p:row>
				
		 </p:panelGrid>

		</p:panel>

		<p:spacer height="15px" />
		<p:panel label="#{lbl['lbl.ss.panel.title.approve.list']}"
			header="#{lbl['lbl.ss.panel.title.approve.list']}" toggleable="true"
			toggleSpeed="500">
			<div style="width: 100%">
				<p:pickList
					value="#{directPurchaseBackingBean.managedBean.approvalUsers}"
					var="approverUser" showTargetControls="true"
					itemLabel="#{approverUser.userName}" itemValue="#{approverUser}"
					converter="approverConverter">
					<f:facet name="sourceCaption">Available Approver </f:facet>
					<f:facet name="targetCaption">Approver List Name</f:facet>
				</p:pickList>
			</div>
		</p:panel>

	</p:panel>
	
	
	
	<p:dialog id="uploadDlg" widgetVar="uploadDlg" modal="false" resizable="false" width="700px" height="350" styleClass="pop_up_top" header="#{lbl['lbl.bpm.choose.file']}">
		<p:ajax event="close" />
		<p:fileUpload style="display:inline;"
			fileUploadListener="#{ctBackingBean.fileUpload}"
			mode="advanced" id="upload"
			allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/" 
			invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted" >
		</p:fileUpload> 
	</p:dialog>		
	
	
	
	
</ui:composition>
