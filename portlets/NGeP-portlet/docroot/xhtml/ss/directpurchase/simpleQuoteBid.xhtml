<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="SimpleQuote/Bid" widgetVar="simpleQuoteBid"
		modal="true" width="800" height="250">
		<p:panel header="#{lbl['lbl.ss.simple.quote.purchase.panel.header']}">

			<p:dataTable id="supplierItemPopupTable" var="supplierItem"
				value="#{directPurchaseBackingBean.managedBean.scRequestSupplierItems}"
				selection="#{directPurchaseBackingBean.managedBean.selectedSupplierItems}"
				rowKey="#{supplierItem.cmSupplierItem.supplierItemId}" rowIndexVar="index">

				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.supplier']}" style="width:10%">
					<h:outputText value="#{supplierItem.smSupplier.supplierName}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.description']}" style="width:25%">
					<h:outputText value="#{supplierItem.cmSupplierItem.itemDesc}"></h:outputText>
				</p:column>

				
				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.qty.order']}" style="width:25%">
					<h:outputText value="#{supplierItem.cmSupplierItem.minOrder}"></h:outputText>
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.simple.quote.item.uom']}" style="width:5%">
				</p:column>

				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.unit.price']}" style="width:20%">
					<h:outputText value="#{supplierItem.cmSupplierItem.minOrder}"></h:outputText>
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:commandButton value="#{lbl['lbl.ss.simple.quote.purchase.btn.ok']}" style="float:right;"
			onclick="simpleQuoteBid.hide();" process="@all" action="#{directPurchaseBackingBean.simpleQuoteBid()}"></p:commandButton>
				&#160;&#160;
				<p:commandButton value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}" style="float:right;"
			onclick="simpleQuoteBid.hide();"></p:commandButton>


	</p:dialog>
</ui:composition>
