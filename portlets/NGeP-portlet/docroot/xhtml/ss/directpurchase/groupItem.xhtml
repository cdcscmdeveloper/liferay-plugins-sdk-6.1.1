<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<p:dialog header="GroupItem" widgetVar="groupItem"
		modal="true" width="800" height="250">
		<p:panel header="#{lbl['lbl.ss.simple.quote.purchase.group.panel']}">

			<p:dataTable  var="simpleQuote"
				value="#{simpleQuoteBidBackingBean.utilList}"
				selection="#{simpleQuoteBidBackingBean.managedBean.selectedUtilList}"
				rowKey="#{simpleQuote.seqNo}" rowIndexVar="index" editable="true">

			<p:ajax event="rowEdit" listener="#{searchQtnTenderBB.onEdit}"  />  
            <p:ajax event="rowEditCancel" listener="#{searchQtnTenderBB.onCancel}"  /> 

				<p:column headerText="#{lbl['lbl.ss.simple.quote.purchase.group.seq.no']}" style="width:10%">
					
				<p:cellEditor>  
                <f:facet name="output">  
                <h:outputText value="#{index+1}"></h:outputText>
                </f:facet>  
                <f:facet name="input">  
                    <p:inputText value="#{index+1}"></p:inputText>
                </f:facet>  
            </p:cellEditor>  
		</p:column>
				<p:column headerText=" #{lbl['lbl.ss.simple.quote.purchase.group.item.name']}" style="width:70%">
					
			 <p:cellEditor>  
                <f:facet name="output">  
                 <h:outputText value="#{simpleQuote.description}"></h:outputText> 
                </f:facet>  
                <f:facet name="input">  
                    <p:inputText value="#{simpleQuote.description}"></p:inputText>
                </f:facet>  
            </p:cellEditor>  
		</p:column>
         <p:column headerText="#{lbl['lbl.ss.simple.quote.item.action']}" style="width:20%">  
            <p:rowEditor />  
            </p:column>  
</p:dataTable>
               <div align="right"  >
					<p:commandButton  value="#{lbl['lbl.ss.simple.quote.purchase.group.btn.add.group']}" 
						               />
					
					</div>
              
		</p:panel>


<p:panel>
      
   <p:panelGrid  style="width:100%;" styleClass="noBorders tr,noBorders td">
				
				<p:row>
                <p:column>
				<h:outputLabel  value="#{lbl['lbl.ss.simple.quote.purchase.group.group.name']}" />
				</p:column>
				 <p:column>
				<p:inputText ></p:inputText>
	          </p:column>
	        
	          
    </p:row>
    </p:panelGrid>
     <p:pickList id="pickList" value="#{simpleQuoteBidBackingBean.cities}" var="city"   
                itemLabel="#{city}" itemValue="#{city}" style="width:100%"/> 
                
                 <div align="right"  >
					<p:commandButton  value="#{lbl['lbl.ss.simple.quote.purchase.group.btn.add']}" 
						               />
					
					</div> 
				  
	</p:panel>	
	

		<p:commandButton value="#{lbl['lbl.ss.simple.quote.purchase.group.btn.confirm']}" style="float:right;"
			onclick="groupItem.hide();"></p:commandButton>
				&#160;&#160;
				<p:commandButton value="#{lbl['lbl.ss.simple.quote.purchase.btn.cancel']}" style="float:right;"
			onclick="groupItem.hide();"></p:commandButton>

</p:dialog>
</ui:composition>
