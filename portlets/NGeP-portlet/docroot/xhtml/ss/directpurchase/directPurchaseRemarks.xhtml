<ui:composition
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
		<p:panel label="#{lbl['lbl.ss.panel.title.remarks']}" header="#{lbl['lbl.ss.panel.title.remarks']}" toggleable="true">
			<h:panelGrid columns="1" width="100%">
				<p:dataTable id="remarkDataTable"
			        width="100%" rowIndexVar="index"
			        value="#{directPurchaseBackingBean.managedBean.requestList.scDpRemarks}" var="remark"
			        cellpadding="1" columnClasses="at-dataTable-columnClass">
			        <p:column width="15%" rendered="true" headerText="#{lbl['lbl.sc.purchase.remark.no']}">
						<h:outputText value="#{index+1}"></h:outputText>
					</p:column>
					<p:column width="15%" rendered="true" headerText="#{lbl['lbl.sc.purchase.remark.comment']}">
			             <h:outputText value="#{remark.remark}"></h:outputText>  
					</p:column>
					<p:column width="10%" rendered="true" headerText="#{lbl['lbl.ss.purchase.remark.createdby']}">
					</p:column>
					<p:column width="15%" rendered="true" headerText="#{lbl['lbl.ss.purchase.remark.createddate']}">
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						<p:commandButton title="delete" update="@([id$=remarkDataTable])" action="#{directPurchaseBackingBean.deleteRemark(remark)}" 
						  icon="ui-icon-delete" styleClass="ui-icon-button">
						</p:commandButton>
					</p:column>
					<f:facet name="footer">
						<p:column></p:column>
						<p:column>
							<p:inputText id="remarkInput" value="#{directPurchaseBackingBean.managedBean.requestListRemark}" style="width:450px;" required="false"/>
						</p:column>
						<p:column></p:column>
						<p:column></p:column>
						<p:column>
							<p:commandLink partialSubmit="true" process="@this,remarkInput" update="@([id$=remarkDataTable])" action="#{directPurchaseBackingBean.addRemark()}">
								<h:graphicImage value="/resources/ep/images/design/btn_add.png"></h:graphicImage>
							</p:commandLink>
						</p:column>
					</f:facet>
				</p:dataTable>
			</h:panelGrid>
		</p:panel>
		<p:confirmDialog message="Do you want to delete this record?" closable="true" appendToBody="true" header="Delete Confirmation"
		   severity="alert" widgetVar="confirmation">
	       <h:panelGrid columns="2" columnClasses="column-align-right-50,column-align-left">
			  <p:commandButton value="Yes" 	update="dataTable" partialSubmit="true" process="@this"
				 onclick="confirmation.hide();"/>
			  <p:commandButton value="No" onclick="confirmation.hide()" type="button" />
		   </h:panelGrid>
	    </p:confirmDialog> 
</ui:composition>
