<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ss/directpurchase/sc_sidemenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<h:form>
		<table style="width: 100%">
			<tr>
				<td width="100%" align="right">
					<p:commandButton value="#{lbl['lbl.sc.save']}" />
					<p:commandButton value="#{lbl['lbl.sc.submit']}" />
				</td>
			</tr>
			<p:spacer height="10" />
			<tr>
				<td width="100%" align="right">
					
				</td>
			</tr>
		</table>
		<p:panel label="#{lbl['lbl.sc.item.detail']}" header="#{lbl['lbl.sc.item.detail']}" toggleable="true">
			<h:panelGrid columns="1" width="100%">
				<p:dataTable id="itemdataTable"
			        width="100%"
			        cellpadding="1"
			        columnClasses="at-dataTable-columnClass">
			        <p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.purchase.remark.no']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.purchase.remark.comment']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.purchase.remark.createdby']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.purchase.remark.createddate']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
					</p:column>
				</p:dataTable>
				
			</h:panelGrid>
		</p:panel>
		<div align="right">
	        <h:graphicImage value="/resources/ep/images/design/btn_add.png"></h:graphicImage>
	    </div>
		</h:form>
	</ui:define>	
</ui:composition>
