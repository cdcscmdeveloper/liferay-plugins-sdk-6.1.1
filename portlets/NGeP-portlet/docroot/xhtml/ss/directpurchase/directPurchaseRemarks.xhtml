<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ss/directpurchase/common/ss_directpurchase_sidemenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<h:form>
		<div align="right">
			<p:commandButton value="#{lbl['lbl.ss.save']}" /> 
			<p:commandButton value="#{lbl['lbl.ss.submit']}" />
		</div>
		<p:panel label="#{lbl['lbl.ss.panel.title.remarks']}" header="#{lbl['lbl.ss.panel.title.remarks']}" toggleable="true">
			<h:panelGrid columns="1" width="100%">
				<p:dataTable id="itemdataTable"
			        width="100%"
			        cellpadding="1"
			        columnClasses="at-dataTable-columnClass">
			        <p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.purchase.remark.no']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.sc.purchase.remark.comment']}" /></f:facet>
					</p:column>
					<p:column width="10%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.ss.purchase.remark.createdby']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
						 <f:facet name="header"><h:outputText value="#{lbl['lbl.ss.purchase.remark.createddate']}" /></f:facet>
					</p:column>
					<p:column width="15%" rendered="true" style="white-space:nowrap; text-align:center; vertical-align:top;">
					</p:column>
				</p:dataTable>
			</h:panelGrid>
		</p:panel>
		<div align="right">
	        <h:graphicImage value="/resources/ep/images/design/btn_add.png"></h:graphicImage>
	    </div>
		</h:form>
	</ui:define>	
</ui:composition>
