<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ss/directpurchase/sc_sidemenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<h:form>
			<table style="width: 100%">
				<tr>
					<td width="100%" align="right"><p:commandButton
							value="#{lbl['lbl.sc.save']}" /> <p:commandButton
							value="#{lbl['lbl.sc.submit']}" /></td>
				</tr>
				<p:spacer height="10" />
			</table>
			<table style="width: 100%">
				<tr>
					<td width="100%" align="left"><p:commandButton
							value="#{lbl['lbl.sc.save']}" /> <p:commandButton
							value="#{lbl['lbl.sc.submit']}" /></td>
				</tr>
				<p:spacer height="10" />
			</table>
			<p:panel label="#{lbl['lbl.sc.item.detail']}"
				header="#{lbl['lbl.sc.item.detail']}" toggleable="true">
				<div align="right">
					<p:button value="#{lbl['lbl.sc.action.search.catelogue']}" />
					<p:button value="#{lbl['lbl.sc.action.simple.quote']}"
						outcome="/xhtml/ss/directpurchase/simpleQuote.xhtml" />
					<p:button value="#{lbl['lbl.sc.action.simple.bid']}" />
					<p:button value="#{lbl['lbl.sc.action.clone']}" />
				</div>
				<h:panelGrid columns="1" width="100%">
					<p:dataTable id="itemdataTable"
						value="#{directPurchaseBackingBean.managedBean.requestNote.reqNoteItems}"
						var="reqNoteItem" width="100%" cellpadding="1"
						columnClasses="at-dataTable-columnClass">
						<p:column width="15%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.category']}" />
							</f:facet>
						</p:column>
						<p:column width="15%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.minqty']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.uom']}" />
							</f:facet>
						</p:column>
						<p:column width="15%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.supplier']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.unitPerPrice']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.amount']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.quotebid']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.recentPrice']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">

						</p:column>
					</p:dataTable>
					<div style="text-align: right !important;">
						<p:button value="ADD" />
					</div>
				</h:panelGrid>
			</p:panel>
			<p:spacer height="20" />
			<p:panel label="#{lbl['lbl.sc.supplier.recommend']}"
				header="#{lbl['lbl.sc.supplier.recommend']}" toggleable="true">
				<h:panelGrid columns="1" width="100%">
					<p:dataTable id="supplierdataTable" width="100%" cellpadding="1"
						columnClasses="at-dataTable-columnClass">
						<p:column width="15%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.item.detail.category']}" />
							</f:facet>
						</p:column>
						<p:column width="15%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.supplier.supplier']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.supplier.district']}" />
							</f:facet>
						</p:column>
						<p:column width="15%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.supplier.postcode']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.supplier.quote.detail']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.supplier.price.offer']}" />
							</f:facet>
						</p:column>
						<p:column width="10%" rendered="true"
							style="white-space:nowrap; text-align:center; vertical-align:top;">
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.sc.supplier.recommend']}" />
							</f:facet>
						</p:column>
					</p:dataTable>
				</h:panelGrid>
			</p:panel>
			<p:spacer height="20" />
			<p:panel label="#{lbl['lbl.sc.purchase.detail']}"
				header="#{lbl['lbl.sc.purchase.detail']}" toggleable="true">
				<h:panelGrid columns="4" width="100%">
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.procurement.type']}" />
					</p:column>
					<p:column>
						<h:selectOneMenu id="procurementType"
							style="width: auto; min-width: 200px;" required="false"
							disabled="false">
						</h:selectOneMenu>
					</p:column>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.fulfillment.type']}" />
					</p:column>
					<p:column>
						<h:selectOneMenu id="fulfillmentType"
							style="width: auto; min-width: 200px;" required="false"
							disabled="false">
						</h:selectOneMenu>
					</p:column>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.justification']}" />
					</p:column>
					<p:column>
						<h:selectOneMenu id="justification"
							style="width: auto; min-width: 100px;" required="false"
							disabled="false">
						</h:selectOneMenu>
						<h:inputText id="justificationTextId" style="width:100px;"
							required="false" />
					</p:column>
					<p:column>
					</p:column>
					<p:column />
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.start.date']}" />
					</p:column>
					<p:column>
						<p:calendar id="startdatePopupButtonCal22" showOn="button">
							<p:ajax process="startdatePopupButtonCal22" partialSubmit="true"
								event="change" />
						</p:calendar>
					</p:column>

					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.end.date']}" />
					</p:column>
					<p:column>
						<p:calendar id="enddatePopupButtonCal22" showOn="button">
							<p:ajax process="enddatePopupButtonCal22" partialSubmit="true"
								event="change" />
						</p:calendar>
					</p:column>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.approval.list']}" />
					</p:column>
					<p:column>
						<h:selectOneMenu id="approvalId"
							style="width: auto; min-width: 200px;" required="false"
							disabled="false">
						</h:selectOneMenu>
					</p:column>
					<p:column>
						<p:outputLabel value="#{lbl['lbl.sc.purchase.prepare.loiloa']}" />
					</p:column>
					<p:column>
						<h:selectOneMenu id="prepareLOILOAId"
							style="width: auto; min-width: 200px;" required="false"
							disabled="false">
						</h:selectOneMenu>
					</p:column>
				</h:panelGrid>
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
