<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ss/directpurchase/common/ss_directpurchase_sidemenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<h:form>
			<div align="right">
				<p:commandButton value="#{lbl['lbl.ss.save']}" /> 
				<p:commandButton value="#{lbl['lbl.ss.submit']}" />
			</div>
			<p:panel label="#{lbl['lbl.ss.simple.quote.general']}" header="#{lbl['lbl.ss.simple.quote.general']}" toggleable="true"  toggleSpeed="500">
				<p:spacer height="10" />
				<table style="width: 100%">
					<tr>
						<td width="20%" align="left">
							<p:outputLabel value="#{lbl['lbl.sc.purchase.procurement.type']}" />
						</td>
						<TD>
							<h:selectOneMenu id="procurementType" style="width: auto; min-width: 200px;" required="false" disabled="false">
								<!--TODO hardcode  option value because later will replace by the list in backing bean -->
								<f:selectItem id="adHoc" itemLabel="Ad Hoc procurement" itemValue="1" />
								<f:selectItem id="emergency" itemLabel="Emergency Procurement" itemValue="2" />
								<f:selectItem id="g2g" itemLabel="G2G" itemValue="3" />
							</h:selectOneMenu>
						</TD>
					</tr>
					<TR>
						<TD width="20%" align="left">
							<p:outputLabel value="#{lbl['lbl.sc.purchase.justification']}" />
						</TD>
						<TD>
							<h:selectOneMenu id="justification" style="width: auto; min-width: 100px;" required="false" disabled="false">
								<!--TODO hardcode  option value because later will replace by the list in backing bean -->
								<f:selectItem id="flood" itemLabel="Flood" itemValue="1" />
								<f:selectItem id="fire" itemLabel="Fire" itemValue="2" />
								<f:selectItem id="epidemic" itemLabel="Epidemic" itemValue="3" />
								<f:selectItem id="other" itemLabel="Others" itemValue="4" />
							</h:selectOneMenu>
							<h:inputText id="justificationTextId" style="width:450px;" required="false" />
						</TD>
					</TR>
				</table>
			</p:panel>
			<p:panel label="#{lbl['lbl.ss.market.research']}" header="#{lbl['lbl.ss.market.research']}" toggleable="true"  toggleSpeed="500">
				<div align="right">
					<p:button value="#{lbl['lbl.ss.action.search.catelogue']}" />
					<p:button value="#{lbl['lbl.sc.action.simple.quote']}"
						outcome="/xhtml/ss/directpurchase/simpleQuote.xhtml" />
					<p:button value="#{lbl['lbl.sc.action.simple.bid']}" />
					<p:button value="#{lbl['lbl.sc.action.clone']}" />
				</div>
				<h:panelGrid columns="1" width="100%">
					<p:dataTable id="itemdataTable" width="100%" cellpadding="1"
						value="#{directPurchaseBackingBean.managedBean.requestListItems}" var="item" rowKey="#{supplierItem.supplierId}">
						<p:columnGroup type="header">  
				            <p:row>  
				                <p:column colspan="1" width="20%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.supplier']}">
								</p:column>
				                <p:column colspan="1" width="20%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.ss.item.detail.desc']}">
								</p:column>
								<p:column colspan="1" width="20%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.ss.item.detail.desc']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.minqty']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.unitPerPrice']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.amount']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.ss.item.detail.view']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="white-space:nowrap; text-align:center; vertical-align:top;">
		
								</p:column>
				            </p:row>  
				        </p:columnGroup>
						<p:subTable var="supplierItem" value="#{item.supplierItems}" >
							<!--  p:selectOneRadio id="radioFor#{supplierItem.supplierItemId}" value="#{supplierItem.selected}" layout="custom">  
						        <f:selectItem itemLabel="Option 1" itemValue="1" />  
						        <f:selectItem itemLabel="Option 2" itemValue="2" />  
						        <f:selectItem itemLabel="Option 3" itemValue="3" />  
						    </p:selectOneRadio>  -->
							<f:facet name="header">  
				            	#{item.itemName}   
				            </f:facet> 
				            <p:column>  
				                #{supplierItem.supplierId}  
				            </p:column>  
				            <p:column>  
				                #{supplierItem.supplierId}  
				            </p:column>
				            <p:column>  
				                #{supplierItem.supplierId}  
				            </p:column>
				            <p:column>  
				                #{supplierItem.priceOffer}  
				            </p:column>
				            <p:column>
				            </p:column>
				            <p:column>
				            </p:column>
				            <p:column>
				            </p:column>
				            <p:column selectionMode="single" />
						</p:subTable>
					</p:dataTable>
				</h:panelGrid>
				<div align="right">
					<p:commandButton value="#{lbl['lbl.ss.action.group']}" onclick="groupItem.show();" />
					<p:button value="#{lbl['lbl.ss.action.recommend']}" />
				</div>
					<ui:include src="/xhtml/ss/directpurchase/groupItem.xhtml" />
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
