<ui:composition
	template="/WEB-INF/facelets/templates/sidemenu_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	<ui:define name="resourceSection">
	</ui:define>

	<ui:define name="sideMenu">
		<ui:include src="/xhtml/ss/directpurchase/common/ss_directpurchase_sidemenu.xhtml" />
	</ui:define>
	<ui:define name="content">
		<h:form>
			<div align="right" id="div_globe_11">
				<p:commandButton value="#{lbl['lbl.ss.save']}" /> 
				<p:commandButton value="#{lbl['lbl.ss.submit']}" />
			</div>
			<p:panel label="#{lbl['lbl.ss.panel.title.general']}" header="#{lbl['lbl.ss.panel.title.general']}" toggleable="true"  toggleSpeed="500">
				<p:spacer height="10" />
				<table style="width: 100%">
					<tr>
						<td width="20%" align="left">
							<p:outputLabel value="#{lbl['lbl.sc.purchase.procurement.type']}" id="lbl_11"/>
						</td>
						<TD>
							<h:selectOneMenu id="procurementType" style="width: auto; min-width: 200px;" required="false" disabled="false">
								<!--TODO hardcode  option value because later will replace by the list in backing bean -->
								<f:selectItem id="adHoc" itemLabel="Ad Hoc procurement" itemValue="1" />
								<f:selectItem id="emergency" itemLabel="Emergency Procurement" itemValue="2" />
								<f:selectItem id="g2g" itemLabel="G2G" itemValue="3" />
							</h:selectOneMenu>
						</TD>
					</tr>
					<TR>
						<TD width="20%" align="left">
							<p:outputLabel value="#{lbl['lbl.sc.purchase.justification']}" id="lbl_22"/>
						</TD>
						<TD>
							<h:selectOneMenu id="justification" style="width: auto; min-width: 100px;" required="false" disabled="false">
								<!--TODO hardcode  option value because later will replace by the list in backing bean -->
								<f:selectItem id="flood" itemLabel="Flood" itemValue="1" />
								<f:selectItem id="fire" itemLabel="Fire" itemValue="2" />
								<f:selectItem id="epidemic" itemLabel="Epidemic" itemValue="3" />
								<f:selectItem id="other" itemLabel="Others" itemValue="4" />
							</h:selectOneMenu>
							<h:inputText id="justificationTextId" style="width:450px;" required="false" />
						</TD>
					</TR>
				</table>
			</p:panel>
			<p:panel label="#{lbl['lbl.ss.panel.title.market.research']}" header="#{lbl['lbl.ss.panel.title.market.research']}" toggleable="true"  toggleSpeed="500">
				<div align="right" id="div_j111">
					<p:button value="#{lbl['lbl.ss.action.search.catelogue']}" />
					<p:commandButton value="#{lbl['lbl.ss.action.simple.quote']}"
						onclick="simpleQuoteBid.show();" />
					<p:commandButton value="#{lbl['lbl.ss.action.simple.bid']}" onclick="simpleQuoteBid.show();" />
					<p:button value="#{lbl['lbl.ss.action.clone']}" />
				</div>
				<ui:include src="/xhtml/ss/directpurchase/simpleQuoteBid.xhtml" />
				<h:panelGrid width="100%" style="margin-top:20px">
					<p:dataTable id="itemdataTable" width="100%" cellpadding="1" rowIndexVar="rowIndex" 
						value="#{directPurchaseBackingBean.managedBean.requestListItems}" var="item">
						<p:columnGroup type="header">  
				            <p:row>  
				                <p:column colspan="1" width="20%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.supplier']}">
								</p:column>
				                <p:column colspan="1" width="35%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.ss.item.detail.desc']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.minqty']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.unitPerPrice']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.sc.item.detail.amount']}">
								</p:column>
								<p:column colspan="1" width="10%" rendered="true"
									style="text-align:center; vertical-align:top;" headerText="#{lbl['lbl.ss.item.detail.action']}">
								</p:column>
								<p:column colspan="1" width="5%" rendered="true" headerText="#{lbl['lbl.ss.item.detail.recommend']}"
									style="text-align:center; vertical-align:top;">
								</p:column>
				            </p:row>  
				        </p:columnGroup>
				       	<p:subTable id="supplierItemTable#{rowIndex}" var="supplierItem" value="#{item.supplierItems}">
							<f:facet name="header"> 
				            	<p:outputLabel value="#{lbl['lbl.ss.item.detail.item.name']}" /> :#{item.itemName}   <p:spacer width="10px" />
				            	<p:outputLabel value="#{lbl['lbl.ss.item.detail.quantity']}" /> :#{item.quantity}   <p:spacer width="10px" />
				            	<p:outputLabel value="#{lbl['lbl.ss.item.detail.uom']}" /> :#{item.uom}
				            </f:facet> 
				            <p:column>  
				                #{supplierItem.supplierId}  
				            </p:column>  
				            <p:column>  
				                #{supplierItem.supplierId}  
				            </p:column>
				            <p:column>  
				                #{supplierItem.supplierId}  
				            </p:column>
				            <p:column>  
				                #{supplierItem.priceOffer}  
				            </p:column>
				            <p:column>
				            </p:column>
				            <p:column>
				            </p:column>
				            <p:column>
				            	<input type="radio" id="supplierItemId#{supplierItem.supplierItemId}" name="itemId#{rowIndex}"/>
				            </p:column>
						</p:subTable>
					</p:dataTable>
				</h:panelGrid>
				<div align="right" id="divGroupBtnAction">
					<p:commandButton value="#{lbl['lbl.ss.action.group']}" onclick="groupItem.show();" />
					<p:button value="#{lbl['lbl.ss.action.recommend']}" outcome="/xhtml/ss/directpurchase/requestList.xhtml"/>
				</div>
					<ui:include src="/xhtml/ss/directpurchase/groupItem.xhtml" />
			</p:panel>
		</h:form>
	</ui:define>
</ui:composition>
