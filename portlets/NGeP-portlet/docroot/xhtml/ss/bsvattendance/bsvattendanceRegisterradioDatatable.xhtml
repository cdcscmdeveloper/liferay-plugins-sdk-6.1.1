<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel header="Briefing/Site Visit Attendance Register"
		toggleable="true">

		<p:panelGrid style="width:100%;"
			styleClass="noBorders tr,noBorders td">
			<p:row>
				<p:column width="100%" style="text-align:right">
					<p:commandButton value="#{lbl['lbl.sc.bsv.attendance.regbtn']}"
						action="#{bsvAttendanceBackingBean.attendanceByCompany}"
						oncomplete="popupAttendaceByComp.show();return false;"
						update="attendancebyCompId" />
				</p:column>
			</p:row>
		</p:panelGrid>


		<h:panelGrid border="0" cellpadding="0" cellspacing="0" width="50%"
			columns="2" columnClasses="columnWidth20,columnWidth30">
			<h:column>
				<h:outputLabel
					value="#{lbl['lbl.sc.bsv.attendance.briefing.sameas.sv']}"></h:outputLabel>
			</h:column>

			<p:column>
				<p:inputText value="#{bsvAttendanceBackingBean.managedBean.briefSameAsSiteVisit}" readonly="true" disabled="true" size="6"></p:inputText>
			</p:column>

		</h:panelGrid>


		<p:panel header="Briefing Details">
			<p:dataTable id="briefingDeails" var="scQtBriefing"
				value="#{bsvAttendanceBackingBean.managedBean.briefingDetailsList}"
				rows="10"
				selection="#{bsvAttendanceBackingBean.managedBean.selectedBriefingDetails}"
				rowKey="#{scQtBriefing.qtBriefingId}" rowIndexVar="rowIndex">
				<p:column selectionMode="multiple" style="width:2%" />
				<ac:paginator for="briefingDeails" />

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.desc']}"
					style="width:100%">
					<p:commandLink update=":form:popupAttendanceReg"
						action="#{bsvAttendanceBackingBean.attendanceRegistration}"
						oncomplete="popupAttendanceReg.show();return false;">
						<f:setPropertyActionListener value="#{scQtBriefing}"
							target="#{bsvAttendanceBackingBean.managedBean.scQtBriefing}" />
						<h:outputText value="#{scQtBriefing.briefingDesc}"
							style="width:100%" />
					</p:commandLink>
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.date']}">
					<h:outputText value="14/11/2013" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.location']}">
					<h:outputText value="#{scQtBriefing.location}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.bsv.attendance.coordinating.officer']}">
					<h:outputText value="#{scQtBriefing.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.attendance']}">
					<h:outputText value="#{scQtBriefing.attendanceType}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.zone.name']}">
					<h:outputText value="-" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.bsv.attendance.briefing.status']}">
					<p:selectOneMenu
						value="searchQtnTenderBB.managedBean.qtnTenders.planNumber">
						<f:selectItem itemLabel="siteVisit" itemValue="1" />
						<f:selectItem itemLabel="siteMaintain" itemValue="2" />
					</p:selectOneMenu>
				</p:column>
			</p:dataTable>

		</p:panel>

		<p:panel header="Site Visit Details" visible="#{bsvAttendanceBackingBean.managedBean.visibleState}">
			<p:dataTable id="sitevisitdetails" var="scQtsitevisit"
				value="#{bsvAttendanceBackingBean.managedBean.siteVisitDetailsList}"
				selection="#{bsvAttendanceBackingBean.managedBean.selectedSiteVisitDetails}"
				rowKey="#{scQtsitevisit.qtBriefingId}" rowIndexVar="rowIndex"
				rows="10">
				<ac:paginator for="sitevisitdetails" />
				<p:column selectionMode="multiple" style="width:2%" />

				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.desc']}"
					style="width:100%">
					<p:commandLink oncomplete="popupAttendanceReg.show();return false;"
						action="#{bsvAttendanceBackingBean.attendanceRegistration}">
						<h:outputText value="#{scQtsitevisit.briefingDesc}"
							style="width:100%" />
					</p:commandLink>

				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.date']}">
					<h:outputText value="04/09/2013 04:44" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.location']}">
					<h:outputText value="#{scQtsitevisit.location}" />
				</p:column>
				<p:column
					headerText="#{lbl['lbl.sc.bsv.attendance.coordinating.officer']}">
					<h:outputText value="#{scQtsitevisit.coordinatingOfficer}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.attendance']}">
					<h:outputText value="#{scQtsitevisit.attendanceType}" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.zone.name']}">
					<h:outputText value="EastMalaysia" />
				</p:column>
				<p:column headerText="#{lbl['lbl.sc.bsv.attendance.Site.status']}">
					<p:selectOneMenu
						value="searchQtnTenderBB.managedBean.qtnTenders.planNumber">
						<f:selectItem itemLabel="siteVisit" itemValue="1" />
						<f:selectItem itemLabel="siteMaintain" itemValue="2" />
					</p:selectOneMenu>
				</p:column>
			</p:dataTable>
		</p:panel>

	</p:panel>
	<!--  Attendance by company dialog -->
	<p:dialog id="attendancebyCompId" widgetVar="popupAttendaceByComp"
		modal="false" resizable="false" header="Attendance By Company">
		<p:ajax event="close" />
		<ui:include src="bsvAttendanceByCompanyPopup.xhtml" />
	</p:dialog>



	<!--  Attendance Registration dialog -->
	<p:dialog id="popupAttendanceReg" widgetVar="popupAttendanceReg"
		modal="false" resizable="false" header="Attendance Registration">
		<p:ajax event="close" />
		<ui:include src="bsvAttendanceRegisterPopup.xhtml" />
	</p:dialog>



</ui:composition>
