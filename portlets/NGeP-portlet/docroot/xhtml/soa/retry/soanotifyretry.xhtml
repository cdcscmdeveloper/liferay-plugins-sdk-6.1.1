<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	
	<ui:define name="contentSection">
		
		<p:messages id="messages" autoUpdate="true" />
	
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<tr>
				<td width="100%" valign="top">
					<table width="100%">
						<tr>
							<td colspan="2">
								
								<div style="text-align: left; float: right;">
									
									#{lbl['lbl.portal.soa.targetSystem']} :
									
									<p:selectOneMenu id="targetSystemId" value="#{soaNotifyRetryBackingBean.managedBean.targetSystem}">
										<f:selectItem itemLabel="#{lbl['lbl.portal.soa.all']}" itemValue=""></f:selectItem>
										 <f:selectItems value="#{soaNotifyRetryBackingBean.statusDropdown}" />
									</p:selectOneMenu>
									
									<p:commandButton
									value="#{lbl['lbl.portal.soa.btn.submit']}"
									action="#{soaNotifyRetryBackingBean.submitNotifyRetryList}"
									update=":form:notifyRetryTable" /> <p:commandButton
									value="#{lbl['lbl.portal.soa.btn.refresh']}"
									action="#{soaNotifyRetryBackingBean.refreshNotifyRetryList}"
									update=":form:notifyRetryTable" />
									
								</div>
							</td>
						</tr>
						<tr>
							<td colspan="2" width="100%" valign="top"><p:dataTable
									value="#{soaNotifyRetryBackingBean.notifyRetryDataModel}"
									var="notifyRetry" id="notifyRetryTable" rows="10" rowIndexVar="index"
									width="100%" rowKey="#{notifyRetry}" lazy="true"
									selection="#{soaNotifyRetryBackingBean.managedBean.selectedNotifyRetries}">

									<ac:paginator for="notifyRetryTable" />

									<p:column selectionMode="multiple" style="width:2%;text-align:center"/>

									<p:column headerText="#{lbl['lbl.portal.soa.transId']}">
										<p:commandLink 
											action="#{soaNotifyRetryBackingBean.managedBean.setPayload(notifyRetry.transId, notifyRetry.payload)}"
											oncomplete="payloadPopUp.show()" update="@form">
											#{notifyRetry.transId}			
										</p:commandLink>
									</p:column>
									
									<p:column headerText="#{lbl['lbl.portal.soa.serviceName']}">
											#{notifyRetry.serviceName}
									</p:column>
									
									<p:column headerText="#{lbl['lbl.portal.soa.targetSystem']}">
										#{notifyRetry.targetSystem}
									</p:column>
									
									<p:column headerText="#{lbl['lbl.portal.soa.statusDesc']}">
										#{notifyRetry.errorMsg}
									</p:column>
									
									<p:column headerText="#{lbl['lbl.portal.soa.dateTime']}"
										style="text-align: right;width:2%;">
									
										<h:outputText value="#{notifyRetry.changedDate}">
											<f:convertDateTime pattern="dd-MM-yyyy hh:mm:ss a" />
										</h:outputText>
									
									</p:column>
									
									<p:column headerText="#{lbl['lbl.portal.soa.retryCount']}" styleClass="#{soaServiceRetryBackingBean.getRetryCountFieldColor(serviceretry.retryCount)}">
										#{notifyRetry.retryCount}
									</p:column>
									
								</p:dataTable>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
		
		<p:dialog id="payloadPopUp" widgetVar="payloadPopUp"
			header="Payload transId = #{soaNotifyRetryBackingBean.managedBean.payloadSubject}" styleClass="screen-title"
			resizable="false" modal="true" width="800" height="700">
			<h:outputText value="#{soaNotifyRetryBackingBean.managedBean.payloadContent}" />
		</p:dialog>
		
	</ui:define>
</ui:composition>
