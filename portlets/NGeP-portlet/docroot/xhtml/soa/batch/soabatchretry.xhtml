<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	</ui:define>
	<ui:define name="contentSection">
		<p:messages id="messages" autoUpdate="true" />
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
			<tr>
				<td width="100%" valign="top">
					<table width="100%">
						<tr>
							<td style="text-align: left; vertical-align: middle;"></td>
							<td style="text-align: right;"><p:commandButton
									value="#{lbl['lbl.portal.soa.btn.submit']}" id="submit"
									action="#{soaBatchRetryBackingBean.submitBatchRetryList}"
									update=":form:batchRetryTable" /> <p:commandButton
									value="#{lbl['lbl.portal.soa.btn.refresh']}" id="refresh"
									action="#{soaBatchRetryBackingBean.refreshBatchRetryList}"
									update=":form:batchRetryTable" /> <p:commandButton
									value="#{lbl['lbl.portal.soa.btn.delete']}" id="delete"
									action="#{soaBatchRetryBackingBean.removeBatchRetryList}"
									update=":form:batchRetryTable" /></td>
						</tr>
						<tr>
							<td colspan="2" width="100%" valign="top"><p:dataTable
									value="#{soaBatchRetryBackingBean.batchRetryDataModel}"
									var="batchRetry" id="batchRetryTable" rows="10"
									rowIndexVar="index" width="100%" rowKey="#{batchRetry}"
									lazy="true"
									selection="#{soaBatchRetryBackingBean.managedBean.selectedRetryLogs}">

									<ac:paginator for="batchRetryTable" />

									<p:column selectionMode="multiple" style="width:7%" />

									<p:column headerText="Tran Id">
										#{batchRetry.transId}
									</p:column>

									<p:column headerText="RQ Uid">
										#{batchRetry.rqUid}
									</p:column>

									<p:column headerText="Service Code">
										#{batchRetry.serviceCode}
									</p:column>

									<p:column headerText="Service Module">
										#{batchRetry.serviceModule}
									</p:column>

									<p:column headerText="Source System">
										#{batchRetry.sourceSystem}
									</p:column>

									<p:column headerText="Target System">
										#{batchRetry.targetSystem}
									</p:column>

									<p:column headerText="Status Code">
										#{batchRetry.statusCode}
									</p:column>

									<p:column headerText="Status Desc">
										#{batchRetry.statusDesc}
									</p:column>

									<p:column headerText="File Name">
										#{batchRetry.fileName}
									</p:column>

									<p:column headerText="#{lbl['lbl.portal.soa.datetime']}"
										style="text-align: right;width:2%;">
										<h:outputText value="#{batchRetry.createdDate}">
											<f:convertDateTime pattern="dd-MM-yyyy hh:mm:ss a" />
										</h:outputText>
									</p:column>
								</p:dataTable>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</ui:define>
</ui:composition>
