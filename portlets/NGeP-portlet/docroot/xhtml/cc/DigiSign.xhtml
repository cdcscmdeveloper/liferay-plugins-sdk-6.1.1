<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:p="http://primefaces.org/ui" 
   	xmlns:ac="http://ac.my/jsf/composite/cc">
    <ui:define name="resourceSection">
  <h:outputScript library="ep/gpki_js" name="gpki-api.js" />

	</ui:define>
   <ui:define name="contentSection">
	<p:messages id="catSrchMsg" showDetail="true" autoUpdate="true" closable="true" showSummary="true"></p:messages>
	 <h:panelGrid id="asd" columns="1" cellpadding="5">
	   <h:commandLink  value="User Challenge Response Update" target="_blank" update="asd" action="#{softCertMaintenanceBackingBean.RequestChallRespUpdate}">
		</h:commandLink> 
		<p:spacer width="15" />
	      <h:commandLink value="User Change PIN" target="_blank" update="asd" action="#{softCertMaintenanceBackingBean.RequestChangePIN}">
		</h:commandLink>
		<p:spacer width="15" />
		   <h:commandLink value="User Reset PIN" target="_blank" update="asd" action="#{softCertMaintenanceBackingBean.RequestResetPIN}">
		</h:commandLink>
		<p:spacer width="15" />
		   <h:commandLink value="User Revoke Certificate" target="_blank" update="asd" action="#{softCertMaintenanceBackingBean.RequestRevokeCert}">
		</h:commandLink>
		<p:spacer width="15" />
	   </h:panelGrid>
	<h:panelGrid columns="1" cellpadding="5">
<p:commandButton value="Submit"  action="#{smTrackingDiaryBackingBean.managedBean.spkiBackingBean.getChallengeQuestions}" update="aasd" />	 
	</h:panelGrid>
 <ac:spkiPopup  id="aasd" password="#{smTrackingDiaryBackingBean.managedBean.spkiBackingBean.password}" 
					 challengeAns1="#{smTrackingDiaryBackingBean.managedBean.spkiBackingBean.challengeAns1}" 
					 challengeQues1="#{smTrackingDiaryBackingBean.managedBean.spkiBackingBean.challengeQues1}" 
					 postSignAction="#{smTrackingDiaryBackingBean.search}"  /> 
	</ui:define>
</ui:composition>
