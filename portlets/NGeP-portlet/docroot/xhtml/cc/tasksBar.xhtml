<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<ui:define name="contentSection">

		<h:panelGroup id="tasksBarId">
			<table style="width: 100%">
				<tr>
					<td colspan="2">
						<div class="summary-title">
							<h:outputFormat value="#{lbl['lbl.cc.task.summary.title']}" rendered="#{bpmTaskDashSumBackingBean.totalTask gt 0}">
								<f:param value="#{bpmTaskDashSumBackingBean.totalTask}" />
							</h:outputFormat>
							<h:outputFormat value="#{lbl['lbl.cc.task.summary.title2']}" rendered="#{bpmTaskDashSumBackingBean.totalTask eq 0}" />
						</div>
					</td>
				</tr>

					<tr>
						<td colspan="2">
							
							<p:panel toggleable="true">
						 	
						 	<p:dataTable styleClass="taskFirstDatatable" var="task" value="#{bpmTaskDashSumBackingBean.dashboardSummary}">
			
							 	<p:column style="width:5px">
						            
									<p:rowToggler/>
						            
						        </p:column>
						        
						        <p:column>
						        
						        	#{bpmTaskDashSumBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, task.docTypeId)}
						        
						        </p:column>
						        
						        <p:column style="width:20px; text-align: left;">
						           
						            <p:commandLink action="#{bpmTaskDashSumBackingBean.goToTaskListFilterDocType(task.docTypeId)}">
										<p:graphicImage styleClass="taskView" value="/css/images/design/next-icon2.png" style="width:16px"/>
									</p:commandLink>
									
						        </p:column>
					        
						        <p:rowExpansion styleClass="taskRowExpansion">
						        
				                    <p:dataTable styleClass="taskSecondDatatable" var="status" value="#{task.bpmTaskStatusList}">
					    	          	
					    	          	<p:column>
					    	          		#{bpmTaskDashSumBackingBean.applicationStatus(status.statusId)}
					    	        		
					    	        		<p:spacer width="50" />
					    	        		
			    	        				<h:outputFormat rendered="#{status.critical > 0}"
												value="(#{lbl['lbl.cc.task.summary.urgent.request']})">
												<f:param value="#{status.critical}" />
											</h:outputFormat>
					    	        
					    	          	</p:column>
									
					    	          	<p:column style="width:4%; text-align: right;">
					    	          		#{status.total}
					    	          	</p:column>
					    	          	
											
					    	        </p:dataTable>
					    	        
						        </p:rowExpansion>
						        
						    </p:dataTable>
						    
						    </p:panel>
						    
						</td>
					</tr>
			
			</table>
		</h:panelGroup>

	</ui:define>

</ui:composition>
