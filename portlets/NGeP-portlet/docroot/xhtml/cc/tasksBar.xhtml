<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">
	
	<h:head>
		<h:outputStylesheet library="ep/css" name="ep.css" />
	</h:head>
	
	<ui:define name="contentSection">

		<h:panelGroup id="tasksBarId">
			<table style="width: 100%">
				<tr>
					<td colspan="2">
						<div class="summary-title">
							<h:outputFormat value="#{lbl['lbl.cc.task.summary.title']}" rendered="#{bpmTaskDashSumBackingBean.totalTask gt 0}">
								<f:param value="#{bpmTaskDashSumBackingBean.totalTask}" />
							</h:outputFormat>
							<h:outputFormat value="#{lbl['lbl.cc.task.summary.title2']}" rendered="#{bpmTaskDashSumBackingBean.totalTask eq 0}" />
						</div>
					</td>
				</tr>

					<tr>
						<td colspan="2">
							
							<p:panel toggleable="true">
						 	
						 		<table class="taskFirstTable">
						 		
						 			<ui:repeat value="#{bpmTaskDashSumBackingBean.dashboardSummary}" var="task">
						 			
							 			<tr>
							 			
							 				<td>
							 					#{bpmTaskDashSumBackingBean.getParameterDesc(ParameterTypeConst.documentTypes, task.docTypeId)}
							 				</td>
				
											<td>
	
									            <p:commandLink action="#{bpmTaskDashSumBackingBean.goToTaskListFilterDocType(task.docTypeId)}">
													<p:graphicImage styleClass="taskView" value="/css/images/design/next-icon2.png" style="width:16px"/>
												</p:commandLink>
						
											</td>			 			
							 			</tr>
						 		
						 				<tr>
						 					
						 					<td colspan="2">
						 						
						 						<table class="taskSecondTable">
						 						
						 							<ui:repeat var="status" value="#{task.bpmTaskStatusList}" varStatus="loopStatus">
						 							
							 							<tr>
							 								
							 								<td width="100%">
							 									#{bpmTaskDashSumBackingBean.applicationStatus(status.statusId)}
							 									<h:outputFormat rendered="#{status.critical > 0}"
																	value="(#{lbl['lbl.cc.task.summary.urgent.request']})">
																	<f:param value="#{status.critical}" />
																</h:outputFormat>
																#{status.total}
							 								</td>
							 							
							 							</tr>
						 						
						 							</ui:repeat>
						 							
						 						</table>
						 						
						 					</td>
					 					
					 					</tr>
					 					
						 			</ui:repeat>
						 			
						 		</table>
						    
						    </p:panel>
						    
						</td>
					</tr>
			
			</table>
		</h:panelGroup>

	</ui:define>

</ui:composition>
