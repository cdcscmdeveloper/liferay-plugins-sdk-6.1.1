<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

  <p:outputPanel id="opDefinedSearch">
	<div class="columnPmTableLOPClass">

		<table style="width: 100%;">
			<tr>
				<td><h:panelGrid id="pmReportCriteriaForLOP" columns="4" columnClasses="pmColumn1Width,pmColumn2Width,pmColumn3Width"
						style="width:100%;">
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryOrgTypeForLOPView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel value="#{lbl['lbl.rpt.org.type']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu label="#{lbl['lbl.rpt.org.type']}"
												id="orgaType"
												value="#{reportBackingBean.managedBean.selectedOrgType.parameterId}"
												style="width:300px;">
												<f:selectItems value="#{reportBackingBean.itemsList}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true"
													listener="#{reportBackingBean.changeOrgTypeValuesForList}"
													update="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="rptOrgTypeMsg" for="orgaType"
												display="icon" showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryOrgNameForLOPView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td class="pmColumn3Width"><p:outputLabel value="#{lbl['lbl.rpt.orgName']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td style="width: 100%"><p:outputPanel id="opFfcOrgCode"
												rendered="#{ParameterConst.orgTypeFactoring eq reportBackingBean.managedBean.selectedOrgType.parameterCode}">
												<ac:lov id="lovFfcOrg" lovId="PM_ORG_PROFILE_FFC" size="43"
													update="@form" readonly="true"
													disabled="#{reportBackingBean.managedBean.selectedOrgType.parameterId==null}"
													headerText="#{reportBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, reportBackingBean.managedBean.selectedOrgType.parameterCode)}"
													value="#{reportBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.finOrgName}"
													postUpdateListener="reportBackingBean.updateSearchCriteriaForOrgName"
													saveObject="reportBackingBean.managedBean.selectedOrgProfile"
													conditionField="#{reportBackingBean.constructConditionFields()}" />
												<p:message id="lovFfcOrgMsg" for="lovFfcOrg" display="icon" />
											</p:outputPanel> <p:outputPanel id="opSupOrgCode"
												rendered="#{ParameterConst.orgTypeSupplier eq reportBackingBean.managedBean.selectedOrgType.parameterCode}">
												<ac:lov id="lovSupOrg" lovId="PM_ORG_PROFILE_WITH_SUPPLIER"
													size="43" update="@form" readonly="true"
													disabled="#{reportBackingBean.managedBean.selectedOrgType.parameterId==null}"
													headerText="#{reportBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, reportBackingBean.managedBean.selectedOrgType.parameterCode)}"
													value="#{reportBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}"
													postUpdateListener="reportBackingBean.updateSearchCriteriaForOrgName"
													saveObject="reportBackingBean.managedBean.selectedOrgProfile"
													conditionField="#{reportBackingBean.constructConditionFields()}" />
												<p:message id="lovSupOrgMsg" for="lovSupOrg" display="icon" />
											</p:outputPanel> <p:outputPanel id="opPtjOrgCode"
												rendered="#{ParameterConst.orgTypePegawaiPengawal eq reportBackingBean.managedBean.selectedOrgType.parameterCode or 
				                                	ParameterConst.orgTypePtj eq reportBackingBean.managedBean.selectedOrgType.parameterCode or 
				                                	ParameterConst.orgTypePtjGroup eq reportBackingBean.managedBean.selectedOrgType.parameterCode}">
												<p:inputText size="43" id="itSelectedPtj"
													value="#{reportBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
													readonly="true" />	&#160;	
					                           <p:commandLink id="ptjSearchCL"
													partialSubmit="true"
													disabled="#{reportBackingBean.managedBean.selectedOrgType.parameterId==null}"
													process="@this" update=":form:orgProfileCcId:ptjPopup"
													action="#{organisationSearchBackingBean.initPtjPopup}"
													oncomplete="ptjPopup.show();">
													<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
												</p:commandLink>
											</p:outputPanel> <p:outputPanel id="opOrgCode"
												rendered="#{ParameterConst.orgTypeFactoring ne reportBackingBean.managedBean.selectedOrgType.parameterCode 
						                     	and ParameterConst.orgTypeSupplier ne reportBackingBean.managedBean.selectedOrgType.parameterCode
						                     	and ParameterConst.orgTypePegawaiPengawal ne reportBackingBean.managedBean.selectedOrgType.parameterCode
						                     	and ParameterConst.orgTypePtj ne reportBackingBean.managedBean.selectedOrgType.parameterCode
						                     	and ParameterConst.orgTypePtjGroup ne reportBackingBean.managedBean.selectedOrgType.parameterCode}">
												<ac:lov id="lovMinistry1" lovId="PM_ORG_PROFILE" size="43"
													disabled="#{reportBackingBean.managedBean.selectedOrgType.parameterId==null}" update="@form" readonly="true"
													headerText="#{reportBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, reportBackingBean.managedBean.selectedOrgType.parameterCode)}"
													value="#{reportBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
													saveObject="reportBackingBean.managedBean.selectedOrgProfile"
													postUpdateListener="reportBackingBean.updateSearchCriteriaForOrgName"
													conditionField="#{reportBackingBean.constructConditionFields()}" />
												<p:message id="lovMinistryMsg" for="lovMinistry1"
													display="icon" />
											</p:outputPanel></td>
									</tr>
								</table>
							</p:column>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmIdentificationNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.identificationNo']}" />
								<ac:lov id="pmIdentificationNo" style="width:265px;"
									lovId="PM_USER_ID_REPORT" size="40" update="@form"
									disabled="#{!reportBackingBean.managedBean.disabledOrgFields}"
									headerText="#{lbl['lbl.rpt.identificationNo']}" readonly="true"
									value="#{reportBackingBean.managedBean.selectedPmUser.identificationNo}"
									postUpdateListener="#{reportBackingBean.onChangePmListOfProfileFields()}"
									conditionField="#{reportBackingBean.constructConditionForIdentification()}"
									saveObject="reportBackingBean.managedBean.selectedPmUser" />
							</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmUserNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.username']}" />
							<p:inputText maxlength="100" readonly="true"
								value="#{reportBackingBean.pmUserName}" style="width:290px;">
								<p:ajax process="@this" partialSubmit="true" update="@form" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmRoleCodeView}">
							<p:outputLabel value="#{lbl['lbl.pm.profiles.search.role']}" />
							<p:inputText size="43" id="itSelectedRoleDesc" 
									value="#{not empty(reportBackingBean.managedBean.selectedRoleDesc) ? reportBackingBean.managedBean.selectedRoleDesc.roleName :''}"
									readonly="true" /><p:commandLink id="roleSearchCL"
									partialSubmit="true" process="@this"
									update="roleSearchPanel,roleResultPanel"
									action="#{reportBackingBean.resetRoleSearchAction}"
									disabled="#{reportBackingBean.managedBean.selectedOrgType eq null or 
		            	            reportBackingBean.managedBean.selectedOrgType.parameterId eq null or ParameterConst.orgTypePegawaiPengawal eq reportBackingBean.managedBean.selectedOrgType.parameterCode}"
									oncomplete="reportRoleSearchPopUp.show();">
									<p:graphicImage style="margin-left:-53px;"  value="/css/images/design/search.png"></p:graphicImage>
								</p:commandLink>&#160;
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmListOfOrgStatusView}">
							<p:outputLabel value="#{lbl['lbl.rpt.status']}" />
							<p:selectOneMenu value="#{reportBackingBean.pmStatus}"
								style="width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.pm.status.active']}"
									itemValue="#{1}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.pm.status.inactive']}"
									itemValue="#{0}"></f:selectItem>
								<p:ajax event="change" partialSubmit="true"
									listener="#{reportBackingBean.checkPmStatusValue()}"
									update="@form" />
							</p:selectOneMenu>
						</c:if>

						<ac:lovPopup />
						<ac:ptjPopup id="orgProfileCcId"
							orgTypeParamCode="#{reportBackingBean.managedBean.selectedOrgType.parameterCode}"
							okAction="reportBackingBean.selectPtjAction" update="@form"
							includePegawaiPengawal="true" />
						<ui:include
							src="/xhtml/reports/reportRoleSearchPopUp.xhtml" />						
					</h:panelGrid></td>
			</tr>
		</table>
	</div></p:outputPanel>
</ui:composition>
