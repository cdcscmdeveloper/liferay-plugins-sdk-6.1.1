<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div class="columnPpTableClass">

		<table style="width: 100%; height: 100%;">
			<c:if
				test="#{rptBackingBean.commonLOVBasedRoles}">
				<c:if
					test="#{rptBackingBean.ppNonMandatoryView}">
					<c:if
						test="#{rptBackingBean.ppMinistryView}">
						<tr>
							<td style="width: 15%;"><p:outputLabel
									value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel></td>
							<td><ac:lov id="lovPpMinistry" lovId="PM_ORG_PROFILE_REPORT"
									size="100" update="@form" readonly="true"
									headerText="#{lbl['lbl.rpt.ministry']}"
									value="#{rptBackingBean.pmOrgValidity.orgName}"
									saveObject="rptBackingBean.selectedMinistry"		
									postUpdateListener="#{rptBackingBean.onChangeValuesForLOVs()}" 							
									conditionField="#{rptBackingBean.constructMinistryConditionFields()}" /></td>
							<td><p:message id="lovPpMinistryMsg" for="lovPpMinistry"
									display="icon" /></td>
						</tr>
					</c:if>
				</c:if>
				<c:if
					test="#{rptBackingBean.ppMandatoryView}">
					<c:if
						test="#{rptBackingBean.ppMinistryView}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel></td>
							<td><ac:lov id="lovPpMinistry1"
									lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
									readonly="true" headerText="#{lbl['lbl.rpt.ministry']}"
									value="#{rptBackingBean.pmOrgValidity.orgName}"									
									saveObject="rptBackingBean.selectedMinistry"
									postUpdateListener="#{rptBackingBean.onChangeValuesForLOVs()}" 
									conditionField="#{rptBackingBean.constructMinistryConditionFields()}" /></td>
							<td><p:message id="lovPpMinistry1Msg" for="lovPpMinistry1"
									display="icon" /></td>
						</tr>
					</c:if>
				</c:if>
				<c:if
					test="#{rptBackingBean.ppPegaWaiPengawalView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.pegawaipengawal']}"></p:outputLabel>
						</td>
						<td><ac:lov id="lovPpPegaWaiPengawal"
								lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
								headerText="#{lbl['lbl.rpt.pegawaipengawal']}" readonly="true"
								disabled="#{rptBackingBean.selectedMinistry==null}"
								value="#{rptBackingBean.selectedPegwaiPengawal.pmOrgValidity.orgName}"							
								saveObject="rptBackingBean.selectedPegwaiPengawal"								
								conditionField="#{rptBackingBean.constructPegwaiPengawalConditionFields()}" /></td>
						<td><p:message id="lovPpPegaWaiPengawalMsg"
								for="lovPpPegaWaiPengawal" display="icon" /></td>
					</tr>
				</c:if>
				<c:if
					test="#{rptBackingBean.ppKumpulanPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.kumpulan.ptj']}"></p:outputLabel></td>
						<td><ac:lov id="lovPpKumpulanPTJ"
								lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
								headerText="#{lbl['lbl.rpt.kumpulan.ptj']}" readonly="true"
								disabled="#{rptBackingBean.selectedPegwaiPengawal==null}"
								value="#{rptBackingBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"								
								saveObject="rptBackingBean.selectedKumpulanPTJ"								
								conditionField="#{rptBackingBean.constructKumpulanPTJConditionFields()}" /></td>
						<td><p:message id="lovPpKumpulanPTJMsg"
								for="lovPpKumpulanPTJ" display="icon" /></td>
					</tr>
				</c:if>
				<c:if test="#{rptBackingBean.ppPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.ptj']}"></p:outputLabel></td>
						<td><ac:lov id="lovPpPTJ" lovId="PM_ORG_PROFILE_REPORT"
								readonly="true" size="100" headerText="#{lbl['lbl.rpt.ptj']}"
								update="@form"
								disabled="#{rptBackingBean.selectedKumpulanPTJ==null}"
								value="#{rptBackingBean.selectedPTJ.pmOrgValidity.orgName}"
								saveObject="rptBackingBean.selectedPTJ"							
								conditionField="#{rptBackingBean.constructPTJConditionFields()}" /></td>
						<td><p:message id="lovPpPTJMsg" for="lovPpPTJ" display="icon" /></td>
					</tr>
				</c:if>
			</c:if>
		</table>

		<table style="width: 100%; height: 100%;">
			<c:if
				test="#{rptBackingBean.textBoxBasedRoles}">
				<c:if
					test="#{rptBackingBean.ppMinistryView}">
					<tr>
						<td style="width: 15%;"><p:outputLabel
								value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width:720px;"
								id="lovPpMinistryOnly"
								value="#{rptBackingBean.commonMinistry}">
								<f:selectItems value="#{rptBackingBean.ministryList}" />
							</p:selectOneMenu></td>
						<td><p:message id="lovPpMinistryMsg" for="lovPpMinistryOnly"
								display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
				<c:if
					test="#{rptBackingBean.ppPegaWaiPengawalView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.pegawaipengawal']}"></p:outputLabel>
						</td>
						<td><p:selectOneMenu style="width:720px;"
								id="lovPpPegaWaiPengawal"
								value="#{rptBackingBean.commonPegaWaiPengawal}">
								<f:selectItems value="#{rptBackingBean.pegaWaiPengawalList}" />
							</p:selectOneMenu></td>
						<td><p:message id="lovPpPegaWaiPengawalMsg"
								for="lovPpPegaWaiPengawal" display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
				<c:if
					test="#{rptBackingBean.ppKumpulanPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.kumpulan.ptj']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width:720px;"
								id="lovPpKumpulanPTJ"
								value="#{rptBackingBean.commonKumpulanPTJ}">
								<f:selectItems value="#{rptBackingBean.kumpulanPTJList}" />
							</p:selectOneMenu></td>
						<td><p:message id="lovPpKumpulanPTJMsg"
								for="lovPpKumpulanPTJ" display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
				<c:if test="#{rptBackingBean.ppPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.ptj']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width:720px;" id="lovPpPTJ"
								value="#{rptBackingBean.commonPtj}">
								<f:selectItems value="#{rptBackingBean.ptjList}" />
							</p:selectOneMenu></td>
						<td><p:message id="lovPpPTJMsg" for="lovPpPTJ" display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
			</c:if>
		</table>

		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:panelGrid id="ppReportCriteria" columns="4"
						style="width:43%;">
						<c:if
							test="#{ctrptBackingBean.ppYearView}">
							<p:column>
								<table style="width: 100%;">
									<tr style="width: 100%;">
										<td><p:outputLabel value="#{lbl['lbl.rpt.yearone']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td style="width: 39%"><p:selectOneMenu id="ppYear"
												value="#{rptBackingBean.ppYear}" style="width:203px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
													itemValue="#{null}"></f:selectItem>
												<f:selectItems
													value="#{rptBackingBean.generateYearList()}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true"
													listener="#{rptBackingBean.onChangeValues()}"
													update="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="ppYearMsg" for="ppYear" display="icon"
												showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
					</h:panelGrid></td>
			</tr>
		</table>

	</div>

</ui:composition>
