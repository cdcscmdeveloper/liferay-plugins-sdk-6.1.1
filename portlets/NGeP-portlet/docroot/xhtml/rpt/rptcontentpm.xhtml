<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div class="columnPmTableClass">
		<table style="width: 100%;">
			<tr>
				<td><h:panelGrid id="pmReportCriteria" columns="4"
						columnClasses="pmColumn1Width,pmColumn2Width,pmColumn3Width"
						style="width:100%;">
						<c:if
							test="#{rptBackingBean.pmServiceTypeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.servicescreen']}" />
							<p:selectOneMenu value="#{rptBackingBean.pmServiceType}"
								style="width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItems value="#{rptBackingBean.serviceTypeList}"></f:selectItems>
								<p:ajax event="change" partialSubmit="true" listener="#{rptBackingBean.onChangServiceType()}"
									update="@form" />
							</p:selectOneMenu>
						</c:if>						
						<c:if
							test="#{rptBackingBean.pmFinancialOrgNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.financialOrgNamescreen']}" />
							<ac:lov id="pmFinOrgName" style="width:265px;"
								lovId="PM_ORG_PROFILE_FFC_REPORT" size="40" update="@form"
								headerText="#{lbl['lbl.rpt.orgCode']}" readonly="true"
								value="#{rptBackingBean.selectedOrgProfile.pmFinancialOrg.finOrgName}"
								postUpdateListener="#{rptBackingBean.onFinaOrgNameChangeForLOV()}"
								saveObject="rptBackingBean.selectedOrgProfile" />
						</c:if>
                        <c:if
							test="#{rptBackingBean.pmBusinessRegNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.businessregnoscreen']}" />
							<p:inputText value="#{rptBackingBean.pmBusinessRegNo}" readonly="true"
								style="width:290px;">
							</p:inputText>
						</c:if>
						<c:if
							test="#{rptBackingBean.pmMandatoryOrgCategoryTypeView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel value="#{lbl['lbl.rpt.org.category']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu
												label="#{lbl['lbl.rpt.org.category']}" id="orgCatg"
												value="#{rptBackingBean.pmOrgCategory}" 
												style="width:300px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.federal']}"
													itemValue="1"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.others']}"
													itemValue="2"></f:selectItem>
												<p:ajax event="change" partialSubmit="true" update="@form"
													listener="#{rptBackingBean.changeOrgCategoryType}" />
											</p:selectOneMenu></td>
										<td><p:message id="rptOrgCatgMsg" for="orgCatg"
												display="icon" showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
						<c:if
							test="#{rptBackingBean.pmMandatoryOrgTypeView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel value="#{lbl['lbl.rpt.org.type']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu label="#{lbl['lbl.rpt.org.type']}"
												id="orgType" value="#{rptBackingBean.pmOrgType}"
												style="width:300px;">
												<f:selectItems value="#{rptBackingBean.itemsList}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true" listener="#{rptBackingBean.changeOrgTypeValues}" update="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="rptOrgTypeMsg" for="orgType"
												display="icon" showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
                        <c:if
							test="#{rptBackingBean.pmNonMandatoryOrgTypeView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel value="#{lbl['lbl.rpt.org.type']}" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu label="#{lbl['lbl.rpt.org.type']}"
												id="orgType" value="#{rptBackingBean.pmOrgType}"
												style="width:285px;">
												<f:selectItems value="#{rptBackingBean.itemsList}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true" listener="#{rptBackingBean.changeOrgTypeValues()}" update="@form" />
											</p:selectOneMenu></td>										
									</tr>
								</table>
							</p:column>
						</c:if>

						<c:if
							test="#{rptBackingBean.pmNonMandatoryOrgNameForProfileView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td class="pmColumn3Width"><p:outputLabel
												value="#{lbl['lbl.rpt.orgName']}" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td style="width: 100%"><ac:lov id="pmOrgName"
												style="width:265px;" lovId="PM_ORG_PROFILE_REPORT" size="40"
												update="@form" headerText="#{lbl['lbl.rpt.orgName']}"
												readonly="true" 
												value="#{rptBackingBean.selectedOrgProfile.pmOrgValidity.orgName}"
												postUpdateListener="#{rptBackingBean.onNonMandatoryOrgNameChangeForProfileLOV()}"
												saveObject="rptBackingBean.selectedOrgProfile" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
						<c:if
							test="#{rptBackingBean.pmOrgCodeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.orgCode']}" />
							<ac:lov id="pmOrgCode" style="width:265px;"
								lovId="PM_ORG_PROFILE_REPORT" size="40" update="@form"
								headerText="#{lbl['lbl.rpt.orgCode']}" readonly="true"
								value="#{rptBackingBean.selectedOrgProfile.pmOrgValidity.orgCode}"
								postUpdateListener="#{rptBackingBean.onOrgCodeChangeForLOV()}"
								saveObject="rptBackingBean.selectedOrgProfile" />
						</c:if>						
                        <c:if
							test="#{rptBackingBean.pmNonMandatoryOrgNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.orgName']}" />
							<p:inputText maxlength="120" readonly="true"
								value="#{rptBackingBean.pmOrgName}" style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{rptBackingBean.pmContractNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.contractNo']}" />
							<p:inputText maxlength="100"
								value="#{rptBackingBean.pmContractNo}" style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{rptBackingBean.pmPhysicalContractNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.physicalContractNo']}" />
							<p:inputText maxlength="100"
								value="#{rptBackingBean.pmPhysicalContractNo}"
								style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{rptBackingBean.pmLOANoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.loaNo']}" />
							<p:inputText maxlength="100" value="#{rptBackingBean.pmLOANo}"
								style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{rptBackingBean.pmPhysicalLOANoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.physicalLOANo']}" />
							<p:inputText maxlength="100"
								value="#{rptBackingBean.pmPhysicalLOANo}"
								style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{rptBackingBean.pmItemCodeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.itemCode']}" />
							<ac:lov id="itemCode" style="width:265px;" lovId="CM_UNSPSC_REPORT"
								readonly="true" size="40" update="@form"
								headerText="#{lbl['lbl.rpt.itemCode']}"
								value="#{rptBackingBean.selectedUnspscItem.unspscCode}"
								postUpdateListener="#{rptBackingBean.onItemCodeChangeForLOV()}"
								saveObject="rptBackingBean.selectedUnspscItem" />
						</c:if>

						<c:if
							test="#{rptBackingBean.pmItemNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.itemName']}" />
							<p:inputText maxlength="100" readonly="true"
								value="#{rptBackingBean.pmItemName}" style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{rptBackingBean.pmContractItemCodeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.itemCode']}" />
							<ac:lov id="contactItemCode" style="width:265px;" lovId="CM_ITEM_REPORT"
								size="40" update="@form" headerText="#{lbl['lbl.rpt.itemCode']}"
								readonly="true"
								value="#{rptBackingBean.selectedItem.extensionCode}"
								postUpdateListener="#{rptBackingBean.onItemCodeChangeForLOV()}"
								saveObject="rptBackingBean.selectedItem" />
						</c:if>
						<c:if
							test="#{rptBackingBean.pmContractItemNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.itemName']}" />
							<p:inputText maxlength="100" readonly="true"
								value="#{rptBackingBean.pmItemName}" style="width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{rptBackingBean.pmStatusView}">
							<p:outputLabel value="#{lbl['lbl.rpt.status']}" />
							<p:selectOneMenu value="#{rptBackingBean.pmStatus}"
								style="width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.pm.status.active']}"
									itemValue="#{1}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.pm.status.inactive']}"
									itemValue="#{0}"></f:selectItem>
								<p:ajax event="change" partialSubmit="true" listener="#{rptBackingBean.checkPmStatusValue()}"
									update="@form" />
							</p:selectOneMenu>
						</c:if>
						<c:if
							test="#{rptBackingBean.extraTwoColumnView}">
							<p:outputLabel value="" style="margin-top:5px;width:162px;" />
							<p:outputLabel value="" style="margin-top:5px;width:290px;" />
						</c:if>

						<c:if
							test="#{rptBackingBean.pmMandatoryZoneView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel value="#{lbl['lbl.rpt.zone']}" /> <p:outputLabel
												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu label="#{lbl['lbl.rpt.zone']}"
												id="Zone" value="#{rptBackingBean.pmZone}"
												style="width:300px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}"
													itemValue="#{null}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
													itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
													itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
													itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
												<p:ajax event="change" partialSubmit="true"
													update="@([id$=Msg])" />
											</p:selectOneMenu></td>
										<td><p:message id="rptZoneMsg" for="Zone" display="icon"
												showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>

						<c:if
							test="#{rptBackingBean.pmMandatoryZoneViewBPK}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel value="#{lbl['lbl.rpt.zone']}" /> <p:outputLabel
												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu label="#{lbl['lbl.rpt.zone']}"
												id="Zone" value="#{rptBackingBean.pmZone}"
												style="width:300px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}"
													itemValue="#{null}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
													itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
													itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
													itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
												<p:ajax event="change" partialSubmit="true"
													update="@([id$=Msg])" />
											</p:selectOneMenu></td>
										<td><p:message id="rptZoneMsg" for="Zone" display="icon"
												showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>


						<c:if
							test="#{rptBackingBean.pmProfileStatusView}">
							<p:outputLabel value="#{lbl['lbl.rpt.profilestatus']}"
								style="width:113px;" />
							<p:selectOneMenu value="#{rptBackingBean.pmProfileStatus}"
								style="margin-top:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.rpt.active']}"
									itemValue="#{lbl['lbl.rpt.active.val']}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.rpt.inactive']}"
									itemValue="#{lbl['lbl.rpt.inactive.val']}"></f:selectItem>
								<p:ajax event="change" partialSubmit="true"
									update="@([id$=Msg])" />
							</p:selectOneMenu>
						</c:if>

					</h:panelGrid></td>
			</tr>
		</table>
	</div>

	<div>
		<TABLE style="width: 100%;">
			<TR>
				<c:if
					test="#{rptBackingBean.pmExemptedCompanyNameView}">
					<TD class="pmColumn1Width"><p:outputLabel
							value="#{lbl['lbl.rpt.companyName']}" /></TD>
					<TD><ac:lov id="pmCompanyName" readonly="true"
							style="width:289px;" lovId="PM_ORG_PROFILE_WITH_COMPANY_REPORT"
							size="44" update="@form"
							headerText="#{lbl['lbl.rpt.companyName']}"
							value="#{rptBackingBean.selectedOrgProfile.smSupplier.companyName}"
							postUpdateListener="#{rptBackingBean.onCompanyNameChangeForLOV()}"
							saveObject="rptBackingBean.selectedOrgProfile" />
					</TD>
				</c:if>
			</TR>

			<TR>
				<c:if
					test="#{rptBackingBean.pmExemptedBusinessRegNoView}">
					<TD><p:outputLabel
							value="#{lbl['lbl.rpt.businessregnoscreen']}" /></TD>
					<TD class="pmColumn4Width"><p:inputText
							value="#{rptBackingBean.pmBusinessRegNo}" style="width:290px;">
						</p:inputText></TD>
				</c:if>
				<c:if
					test="#{rptBackingBean.pmExemptedEpNoView}">
					<TD><p:outputLabel value="#{lbl['lbl.rpt.epNo']}"
							style="width:43px;" /></TD>
					<TD><p:inputText maxlength="100"
							value="#{rptBackingBean.pmEpNo}" style="width:290px;">
						</p:inputText></TD>
				</c:if>
			</TR>

			<TR>
				<c:if
					test="#{rptBackingBean.pmExemptedItemCodeView}">
					<TD class="pmColumn1Width"><p:outputLabel
							value="#{lbl['lbl.rpt.itemCode']}" /></TD>
					<TD><ac:lov id="itemCode" style="width:265px;"
							lovId="CM_ITEM_REPORT" size="40" update="@form"
							headerText="#{lbl['lbl.rpt.itemCode']}" readonly="true"
							value="#{rptBackingBean.selectedItem.extensionCode}"
							postUpdateListener="#{rptBackingBean.onItemCodeChangeForLOV()}"
							saveObject="rptBackingBean.selectedItem" /></TD>
				</c:if>
				<c:if
					test="#{rptBackingBean.pmExemptedItemNameView}">
					<TD><p:outputLabel value="#{lbl['lbl.rpt.itemName']}" /></TD>
					<TD><p:inputText maxlength="100" readonly="true"
							value="#{rptBackingBean.pmItemName}" style="width:290px;">
							<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
						</p:inputText></TD>
				</c:if>
			</TR>
		</TABLE>
	</div>

	<div>
		<c:if
			test="#{rptBackingBean.pmNonMandatoryDateView}">
			<TABLE style="width: 100%;" class="pmColumn2Width">
				<TR>
					<c:if
						test="#{rptBackingBean.pmFromDateView}">
						<TD class="pmColumn1Width"><p:outputLabel
								value="#{lbl['lbl.rpt.effDateFrom']}" /></TD>
					</c:if>
					<TD class="pmColumnWidthDateFrom"><p:calendar showOn="button"
							navigator="true" display="inline" readonlyInput="true" size="9"
							value="#{rptBackingBean.fromDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
						</p:calendar></TD>
					<TD class="pmColumnWidthDateTo"><p:outputLabel
							value="#{lbl['lbl.rpt.dtRangeTo']}" /></TD>
					<TD><p:calendar showOn="button" navigator="true"
							display="inline" readonlyInput="true"
							value="#{rptBackingBean.toDate}" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">

						</p:calendar></TD>
				</TR>
			</TABLE>
		</c:if>
	</div>

	<div>
		<c:if
			test="#{rptBackingBean.pmNonMandatorySupDateView}">
			<TABLE style="width: 100%;">
				<TR>
					<c:if
						test="#{rptBackingBean.pmFromDateView}">
						<TD class="pmColumn1Width"><p:outputLabel
								value="#{lbl['lbl.rpt.effDateFrom']}" /></TD>
					</c:if>
					<TD class="pmColumnWidthDateFrom"><p:calendar showOn="button"
							navigator="true" display="inline" readonlyInput="true"
							value="#{rptBackingBean.fromDate}" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
						</p:calendar></TD>
					<TD class="pmColumnWidthDateTo"><p:outputLabel
							value="#{lbl['lbl.rpt.dtRangeTo']}" /></TD>
					<TD><p:calendar showOn="button" navigator="true"
							display="inline" readonlyInput="true"
							value="#{rptBackingBean.toDate}" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">

						</p:calendar></TD>
				</TR>
			</TABLE>
		</c:if>
	</div>

</ui:composition>
