<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:panel header="#{expenditurePlanDetailReportBackingBean.reportName}" toggleable="true">

		Fields with (*) are mandatory. <br/>
		If there is no detail search criteria being specified, system will display all data under the specified Ministry / PT. <br/>

		<table style="width: 100%; height: 100%;">

			<!--  Ministry -->

			<tr>

				<td style="width: 15%;">
				
					<p:outputLabel value="#{lbl['lbl.rpt.ministry']}"/>
				
				</td>

				<td>
				
					<ac:lov id="lovPpMinistry" lovId="PM_ORG_PROFILE_REPORT"
						size="100" update="@form" readonly="true"
						headerText="#{lbl['lbl.rpt.ministry']}"
						value="#{expenditurePlanDetailReportBackingBean.selectedMinistry.pmOrgValidity.orgName}"
						saveObject="expenditurePlanDetailReportBackingBean.selectedMinistry"		
						postUpdateListener="#{expenditurePlanDetailReportBackingBean.refreshLovData()}" 							
						conditionField="#{expenditurePlanDetailReportBackingBean.constructMinistryConditionFields()}"/>
				
				</td>
		
				<td>
					<p:message id="lovPpMinistryMsg" for="lovPpMinistry" display="icon" />
									
				</td>
			
			</tr>

			<!--  Pegawai Pengawal -->

			<tr>
			
				<td>
				
					<p:outputLabel value="#{lbl['lbl.rpt.pegawaipengawal']}"/>
					
				</td>
				
				<td>
				
					<ac:lov id="lovPpPegaWaiPengawal"
						lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
						headerText="#{lbl['lbl.rpt.pegawaipengawal']}" readonly="true"
						disabled="#{expenditurePlanDetailReportBackingBean.selectedMinistry==null}"
						value="#{expenditurePlanDetailReportBackingBean.selectedPegwaiPengawal.pmOrgValidity.orgName}"							
						saveObject="expenditurePlanDetailReportBackingBean.selectedPegwaiPengawal"								
						conditionField="#{expenditurePlanDetailReportBackingBean.constructPegwaiPengawalConditionFields()}" />
						
				</td>
		
				<td>
				
					<p:message id="lovPpPegaWaiPengawalMsg"	for="lovPpPegaWaiPengawal" display="icon" />
				
				</td>
					
			</tr>

			<!--  Kumpulan Ptj -->
				
			<tr>
			
				<td>
				
					<p:outputLabel value="#{lbl['lbl.rpt.kumpulan.ptj']}"/>
					
				</td>
				
				<td>
					
					<ac:lov id="lovPpKumpulanPTJ"
						lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
						headerText="#{lbl['lbl.rpt.kumpulan.ptj']}" readonly="true"
						disabled="#{expenditurePlanDetailReportBackingBean.selectedPegwaiPengawal==null}"
						value="#{expenditurePlanDetailReportBackingBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"								
						saveObject="expenditurePlanDetailReportBackingBean.selectedKumpulanPTJ"								
						conditionField="#{expenditurePlanDetailReportBackingBean.constructKumpulanPTJConditionFields()}" />
				
				</td>
				
				<td>
				
					<p:message id="lovPpKumpulanPTJMsg" for="lovPpKumpulanPTJ" display="icon" />
					
				</td>
		
			</tr>

			<!--  Ptj -->

			<tr>
			
				<td>
				
					<p:outputLabel value="#{lbl['lbl.rpt.ptj']}"/>
				
				</td>
				
				<td>
					
					<ac:lov id="lovPpPTJ" lovId="PM_ORG_PROFILE_REPORT"
						readonly="true" size="100" headerText="#{lbl['lbl.rpt.ptj']}"
						update="@form"
						disabled="#{expenditurePlanDetailReportBackingBean.selectedKumpulanPTJ==null}"
						value="#{expenditurePlanDetailReportBackingBean.selectedPTJ.pmOrgValidity.orgName}"
						saveObject="expenditurePlanDetailReportBackingBean.selectedPTJ"							
						conditionField="#{expenditurePlanDetailReportBackingBean.constructPTJConditionFields()}" />
				
				</td>
				
				<td>
					
					<p:message id="lovPpPTJMsg" for="lovPpPTJ" display="icon" />
					
				</td>
			
			</tr>

			<!--  Application year -->
			
			<tr>
			
				<td>
				
					<p:outputLabel value="#{lbl['lbl.rpt.application.year']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				
				</td>

				<td>
				
					<p:selectOneMenu id="ppYear" value="#{expenditurePlanDetailReportBackingBean.ppYear}">

						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"/>
						
						<f:selectItems value="#{expenditurePlanDetailReportBackingBean.generateYearList()}"/>
						
						<p:ajax event="change" partialSubmit="true" listener="#{expenditurePlanDetailReportBackingBean.refreshLovData()}" update="@form" />
							
					</p:selectOneMenu>
				
				</td>
				
				<td>
					
					<p:message id="ppYearMsg" for="ppYear" display="icon" showDetail="false" />
					
				</td>

			</tr>
			
		</table>
	
	</p:panel>
	
	<h:panelGroup id="rptbtnGroup" style="margin-top:10px;">
		
		<div align="right" style="margin-bottom:-3%;"> 

			<p:commandButton id="generate" value="#{lbl['lbl.rpt.generate']}" 
				onstart="blkReportContent.show();" oncomplete="blkReportContent.hide();"
				action="#{expenditurePlanDetailReportBackingBean.generateReport()}">
							
			</p:commandButton>
						
			<p:commandButton value="#{lbl['lbl.btn.reset']}"
				action="#{expenditurePlanDetailReportBackingBean.reset()}"
				update="@form" partialSubmit="true" process="@form"/>

		</div>

	</h:panelGroup>	

</ui:composition>
