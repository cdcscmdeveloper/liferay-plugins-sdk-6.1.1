<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	
		<style type="text/css">
			
			.ui-scrollpanel-native{
				background-color : #FFFFFF !important;
			}
			
			.ui-menubutton .ui-state-default .ui-icon {
			    background-image: url("/css/images/design/icon_trash.png") !important; 
			}
			
		</style>
	
	</ui:define>
	
	<ui:define name="contentSection">
	
	  	<p:remoteCommand name="onload" action="#{rptRequestBackingBean.getLatestStatusCodeForRequests()}" partialSubmit="true" process="@this" update="@form"/>
	  
		<p:messages id="messages" autoUpdate="true" closable="true" />
		
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
	
			<tr>
	
				<td width="42%" valign="top">
					
					<table width="100%">
					
						<tr style="background-color:#f4f4f4;">
						
							<td style="text-align: right;">
							
								<p:commandButton value="#{lbl['lbl.portal.notify.btn.refresh']}"
								   action="#{rptRequestBackingBean.getLatestStatusCodeForRequests()}"
								   update="@form"/> 
									
								<p:commandButton id="deleteBtn"
									
									value="#{lbl['lbl.portal.notify.btn.delete']}"
									oncomplete="confirmation.show();"/>
							</td>
							
						</tr>

						<tr>
						
							<td colspan="2" width="100%" valign="top">
							
								<p:dataTable
									value="#{rptRequestBackingBean.rptRequestDataModel}" var="rptRequest"
									id="rptRequestTable" rows="5" rowIndexVar="index" width="100%"
									rowKey="#{rptRequest}" lazy="true" >

									<ac:paginator for="rptRequestTable" />
	
									<p:column headerText="Job Id" style="text-align:center;">
										<h:outputText value="#{rptRequest.jobId}" style="text-align:center;"/>
									</p:column>
									
									<p:column headerText="Report Module" style="text-align:center;">
										<h:outputText value="#{rptRequestBackingBean.getReportModule(rptRequest.reportCode)}"/>
									</p:column>
									
									<p:column headerText="Report Name" style="padding-left:8px!important;">
										<h:outputText value="#{rptRequestBackingBean.getReportName(rptRequest.reportCode)}"/>
									</p:column>
									
	      							<p:column headerText="Date/Time"
										style="text-align: center;width:10%; padding:5px!important; ">

										<h:outputText value="#{rptRequest.createdDate}">
											<f:convertDateTime pattern="dd-MM-yyyy" />
										</h:outputText>
										
										<br/>
										
										<h:outputText value="#{rptRequest.createdDate}">
											<f:convertDateTime pattern="hh:mm:ss a" />
										</h:outputText>

									</p:column>
									
									<p:column headerText="Status" style="text-align:center;">
										<h:outputText value="#{rptRequestBackingBean.getTrimmedStatusCode(rptRequest.statusCode)}" style="text-align:center;"/>
									</p:column>
									
									<p:column headerText="Action" style="text-align:center;">
										
										<p:commandLink rendered="#{rptRequestBackingBean.isSuccess(rptRequest.statusCode)}"
											onstart="blkReportContent.show();" update="@form"
															ajax="false" style="text-align:center;">
											<p:fileDownload
												value="#{rptRequestBackingBean.generateReport(rptRequest)}" />
											<p:graphicImage value="/css/images/design/download.png" id="downloadImage"
												style="margin-right:2px;" />
											<p:tooltip id="tooltip" for="downloadImage">
												<p:outputLabel escape="false" value="Download"  />
											</p:tooltip>	
											
										</p:commandLink>
									
									</p:column>
									
								</p:dataTable>
								
							</td>
						
						</tr>
					
					</table>
				
				</td>
			
			</tr>
			
		</table>
		
		<p:confirmDialog message="#{lbl['lbl.btn.dialog.cofirm.delete.msg']}" header="#{lbl['lbl.btn.dialog.cofirm.header']}" widgetVar="confirmation">
	
			<div align="right">
	
				<p:commandButton id="conf" value="#{lbl['lbl.btn.dialog.cofirm.yes']}"
					oncomplete="confirmation.hide()" />
	
				<p:commandButton id="decline" value="#{lbl['lbl.btn.dialog.cofirm.no']}"
					onclick="confirmation.hide()" />
	
					<h:inputHidden id="rowIndex"></h:inputHidden>
			</div>
	
		</p:confirmDialog>
	
	</ui:define>
	
</ui:composition>
