<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	
	</ui:define>
	
	<ui:define name="contentSection">
	
		<p:messages id="messages" autoUpdate="true" closable="true" />
		
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
	
			<tr>
	
				<td valign="top">
					
					<table width="100%">
					
						<tr>
							<td colspan="2" width="100%" valign="top">
							
								<p:dataTable
									value="#{rptRequestBackingBean.rptRequestDataModel}" var="rptRequest"
									id="rptRequestTable" rows="10" rowIndexVar="index" width="100%"
									rowKey="#{rptRequest}" lazy="true" >

									<ac:paginator for="rptRequestTable" />

									<p:column headerText="Job Id">
										<h:outputText value="#{rptRequest.jobId}"/>
									</p:column>
									
									<p:column headerText="Report Code">
										<h:outputText value="#{rptRequest.reportCode}"/>
									</p:column>
									
									<p:column headerText="Status Code">
										<h:outputText value="#{rptRequest.statusCode}"/>
									</p:column>
									
									<p:column>
										<p:commandButton value="Get latest status code" process="@form"
											action="#{rptRequestBackingBean.getLatestStatusCode(rptRequest)}" update="@form">
										</p:commandButton>
									</p:column>
									
									<p:column>
										<p:commandButton value="#{lbl['lbl.rpt.generate']}"
											ajax="false" update="@form" onstart="statusDialog.show();"
															id="falseGenerate" oncomplete="statusDialog.hide();">
											<p:fileDownload
												value="#{rptRequestBackingBean.generateReport(rptRequest)}" />
										</p:commandButton>
									</p:column>
									
									<p:dialog modal="true" widgetVar="statusDialog" header="Status" draggable="false" closable="false" resizable="false">
									    <p:graphicImage name="/demo/images/ajaxloadingbar.gif" />
									</p:dialog>

									
									
									<p:column headerText="Date Time"
										style="text-align: right;width:10%; padding:5px!important; ">

										<h:outputText value="#{rptRequest.createdDate}">
											<f:convertDateTime pattern="dd-MM-yyyy" />
										</h:outputText>
	
										<br />
	
										<h:outputText value="#{rptRequest.createdDate}">
											<f:convertDateTime pattern="hh:mm:ss a" />
										</h:outputText>

									</p:column>

   								<p:ajax event="rowSelectCheckbox" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
								<p:ajax event="rowUnselectCheckbox" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
								<p:ajax event="rowUnselect" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
								<p:ajax event="rowSelect" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
								<p:ajax event="toggleSelect" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
									
								</p:dataTable>
								
							</td>
						</tr>
					</table>
	
				</td>
			</tr>
	
		</table>
		
			<p:dialog id="statusDialog" modal="true" widgetVar="statusDialog" width="376" 
				draggable="false" closable="true"  header="#{lbl['lbl.rpt.reportstatus']}"
				resizable="false">	
				<h:outputText  value="#{lbl['lbl.rpt.warninformation']}" />					
				<p:graphicImage value="/css/images/ajax-loader.gif" />						
			</p:dialog>
				
		<p:confirmDialog message="Do you want to delete the current record?" header="Delete Confirm Box" widgetVar="confirmation">
	
			<div align="right">
	
				<p:commandButton id="conf" value="yes"
					actionListener="#{rptRequestBackingBean.removeRptRequests}" 
					update=":form:rptRequestTable"
					oncomplete="confirmation.hide()" />
	
				<p:commandButton id="decline" value="No"
					onclick="confirmation.hide()" />
	
				<h:inputHidden id="rowIndex"></h:inputHidden>
			</div>
	
		</p:confirmDialog>
	
	</ui:define>
	
</ui:composition>
