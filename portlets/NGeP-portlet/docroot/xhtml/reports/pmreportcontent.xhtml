<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div>
		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:panelGrid id="pmReportCriteria" columns="4"
						style="width:85%;margin-top:-3%;">
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmServiceTypeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.servicescreen']}"
								style="margin-top:5px;width:160px;" />
							<p:selectOneMenu value="#{reportBackingBean.pmServiceType}"
								style="margin-top:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItems value="#{reportBackingBean.serviceTypeList}"></f:selectItems>
								<p:ajax event="change" partialSubmit="true"
									update="@([id$=Msg])" />
							</p:selectOneMenu>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmBusinessRegNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.businessregnoscreen']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText value="#{reportBackingBean.pmBusinessRegNo}"
								style="margin-top:5px;width:290px;">
							</p:inputText>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmFinancialOrgNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.financialOrgNamescreen']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText value="#{reportBackingBean.pmFinancialOrgName}"
								style="margin-top:5px;width:290px;">
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryOrgCategoryTypeView}">
							<p:column>
								<table style="width: 182px;">
									<tr style="width: 100%;">
										<td style="width: 160px;"><p:outputLabel
												style="margin-right:-20px;"
												value="#{lbl['lbl.rpt.org.category']}" /> <p:outputLabel
												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td style="width: 84%"><p:selectOneMenu
												label="#{lbl['lbl.rpt.org.category']}" id="orgCatg"
												value="#{reportBackingBean.pmOrgCategory}"
												style="margin-top:5px;width:300px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.federal']}"
													itemValue="1"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.others']}"
													itemValue="2"></f:selectItem>
												<p:ajax event="change" partialSubmit="true" update="@form"
													process="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="rptOrgCatgMsg" for="orgCatg"
												display="icon" showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryOrgTypeView}">
							<p:column>
								<table style="width: 182px;">
									<tr style="width: 100%;">
										<td style="width: 160px;"><p:outputLabel
												style="margin-right:-16px;"
												value="#{lbl['lbl.rpt.org.type']}" /> <p:outputLabel
												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td style="width: 84%"><p:selectOneMenu
												label="#{lbl['lbl.rpt.org.type']}" id="orgType"
												value="#{reportBackingBean.pmOrgType}"
												style="margin-top:5px;width:300px;">
												<f:selectItems
													value="#{reportBackingBean.getOrgTypeDropdownValues()}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true" update="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="rptOrgTypeMsg" for="orgType"
												display="icon" showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryOrgNameView}">
							<p:column>
								<table style="width: 182px;">
									<tr style="width: 100%;">
										<td style="width: 160px;"><p:outputLabel
												style="margin-right:-20px;"
												value="#{lbl['lbl.rpt.orgName']}" /> <p:outputLabel
												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td style="width: 84%"><p:inputText
												label="#{lbl['lbl.rpt.orgName']}" id="orgName"
												maxlength="100" value="#{reportBackingBean.pmOrgName}"
												required="true" style="margin-top:5px;width:290px;">
												<p:ajax event="blur" partialSubmit="true"
													update="@([id$=Msg])" />
											</p:inputText></td>
										<td><p:message id="orgNameMsg" for="orgName"
												display="icon" showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>



						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmOrgCodeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.orgCode']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="30"
								value="#{reportBackingBean.pmOrgCode}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmNonMandatoryOrgNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.orgName']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="120"
								value="#{reportBackingBean.pmOrgName}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmContractNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.contractNo']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmContractNo}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmPhysicalContractNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.physicalContractNo']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmPhysicalContractNo}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmLOANoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.loaNo']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100" value="#{reportBackingBean.pmLOANo}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmPhysicalLOANoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.physicalLOANo']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmPhysicalLOANo}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmItemCodeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.itemCode']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmItemCode}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmItemNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.itemName']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmItemName}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmIdentificationNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.identificationNo']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="30"
								value="#{reportBackingBean.pmIdentificationNo}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmUserNameView}">
							<p:outputLabel value="#{lbl['lbl.rpt.username']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmUserName}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmRoleCodeView}">
							<p:outputLabel value="#{lbl['lbl.rpt.roleCode']}"
								style="margin-top:5px;width:160px;" />
							<p:inputText maxlength="100"
								value="#{reportBackingBean.pmRoleCode}"
								style="margin-top:5px;width:290px;">
								<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmStatusView}">
							<p:outputLabel value="#{lbl['lbl.rpt.status']}"
								style="margin-top:5px;width:160px;" />
							<p:selectOneMenu value="#{reportBackingBean.pmStatus}"
								style="margin-top:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.pm.status.active']}"
									itemValue="#{1}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.pm.status.inactive']}"
									itemValue="#{0}"></f:selectItem>

								<p:ajax event="change" partialSubmit="true"
									update="@([id$=Msg])" />
							</p:selectOneMenu>
						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.extraTwoColumnView}">
							<p:outputLabel value="" style="margin-top:5px;width:162px;" />
							<p:outputLabel value="" style="margin-top:5px;width:290px;" />
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryZoneView}">
							<p:column>
								<table style="width: 182px;">
									<tr style="width: 100%;">
										<td style="width: 160px;"><p:outputLabel
												style="margin-right: -16px;" value="#{lbl['lbl.rpt.zone']}" />
											<p:outputLabel  value="*"
												styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%">
									<tr>
										<td style="width: 84%"><p:selectOneMenu
												label="#{lbl['lbl.rpt.zone']}" id="Zone"
												value="#{reportBackingBean.pmZone}"
												style="margin-top:5px;width:300px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}"
													itemValue="#{null}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
													itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
													itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
												<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
													itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
												<p:ajax event="change" partialSubmit="true"
													update="@([id$=Msg])" />
											</p:selectOneMenu></td>
										<td><p:message id="rptZoneMsg" for="Zone" display="icon"
												showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmProfileStatusView}">
							<p:outputLabel value="#{lbl['lbl.rpt.profilestatus']}"
								style="margin-top:5px;width:295px;" />
							<p:selectOneMenu value="#{reportBackingBean.pmProfileStatus}"
								style="margin-top:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.rpt.active']}"
									itemValue="#{lbl['lbl.rpt.active']}"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.rpt.inactive']}"
									itemValue="#{lbl['lbl.rpt.inactive']}"></f:selectItem>
								<p:ajax event="change" partialSubmit="true"
									update="@([id$=Msg])" />
							</p:selectOneMenu>
						</c:if>

					</h:panelGrid></td>
			</tr>
		</table>
	</div>

	<div>
		<TABLE style="margin-top: -3%; width: 50%;">
			<TR>
				<c:if
					test="#{pmReportBackingBean.managedBean.rptGenBean.pmExemptedCompanyNameView}">
					<TD><p:outputLabel value="#{lbl['lbl.rpt.companyName']}"
							style="margin-top:5px;width:197px;" /></TD>
					<TD><p:inputText maxlength="100"
							value="#{reportBackingBean.pmCompanyName}"
							style="margin-top:5px;width:289px;">
							<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
						</p:inputText></TD>
				</c:if>
			</TR>

			<TR>
				<c:if
					test="#{pmReportBackingBean.managedBean.rptGenBean.pmExemptedBusinessRegNoView}">
					<TD><p:outputLabel
							value="#{lbl['lbl.rpt.businessregnoscreen']}"
							style="margin-top:5px;width:160px;" /></TD>
					<TD><p:inputText value="#{reportBackingBean.pmBusinessRegNo}"
							style="margin-top:5px;width:290px;">
						</p:inputText></TD>
				</c:if>
				<c:if
					test="#{pmReportBackingBean.managedBean.rptGenBean.pmExemptedEpNoView}">
					<TD><p:outputLabel value="#{lbl['lbl.rpt.epNo']}"
							style="margin-top:5px;width:297px;" /></TD>
					<TD><p:inputText maxlength="100"
							value="#{reportBackingBean.pmEpNo}"
							style="margin-top:5px;width:290px;">
						</p:inputText></TD>
				</c:if>
			</TR>

			<TR>
				<c:if
					test="#{pmReportBackingBean.managedBean.rptGenBean.pmExemptedItemCodeView}">
					<TD><p:outputLabel value="#{lbl['lbl.rpt.itemCode']}"
							style="margin-top:5px;width:160px;" /></TD>
					<TD><p:inputText maxlength="100"
							value="#{reportBackingBean.pmItemCode}"
							style="margin-top:5px;width:290px;">
							<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
						</p:inputText></TD>
				</c:if>
				<c:if
					test="#{pmReportBackingBean.managedBean.rptGenBean.pmExemptedItemNameView}">
					<TD><p:outputLabel value="#{lbl['lbl.rpt.itemName']}"
							style="margin-top:5px;width:160px;" /></TD>
					<TD><p:inputText maxlength="100"
							value="#{reportBackingBean.pmItemName}"
							style="margin-top:5px;width:290px;">
							<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
						</p:inputText></TD>
				</c:if>
			</TR>
		</TABLE>
	</div>

	<div>
		<c:if
			test="#{reportBackingBean.managedBean.rptGenBean.pmNonMandatoryDateView}">
			<TABLE style="margin-top: 10px; width: 50%;">
				<TR>
					<c:if
						test="#{reportBackingBean.managedBean.rptGenBean.pmFromDateView}">
						<TD><p:outputLabel value="#{lbl['lbl.rpt.effDateFrom']}"
								style="width:198px;" /></TD>
					</c:if>
					<TD><p:calendar showOn="button" navigator="true"
							display="inline" readonlyInput="true"
							value="#{reportBackingBean.fromDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
						</p:calendar></TD>
					<TD><p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}"
							style="width:50px;" /></TD>
					<TD><p:calendar showOn="button" navigator="true"
							display="inline" readonlyInput="true"
							value="#{reportBackingBean.toDate}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">

						</p:calendar></TD>
				</TR>
			</TABLE>
		</c:if>
	</div>
</ui:composition>
