								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"

								<f:selectItems value="#{reportBackingBean.serviceTypeList}"></f:selectItems>
								<p:ajax event="change" partialSubmit="true"
									update="@([id$=Msg])" />

						</c:if>
						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmBusinessRegNoView}">
							<p:outputLabel value="#{lbl['lbl.rpt.businessregnoscreen']}" />
							<p:inputText value="#{reportBackingBean.pmBusinessRegNo}"

							</p:inputText>
						</c:if>
						<c:if

							<p:inputText value="#{reportBackingBean.pmFinancialOrgName}"

							</p:inputText>
						</c:if>

						<c:if
							test="#{pmReportBackingBean.managedBean.rptGenBean.pmMandatoryOrgCategoryTypeView}">
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:outputLabel

												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>

								<table style="width: 100%">
									<tr>
										<td><p:selectOneMenu

												display="icon" showDetail="false" /></td>

									</tr>
								</table>

												value="#{reportBackingBean.pmZone}"

											</p:selectOneMenu></td>
										<td><p:message id="rptZoneMsg" for="Zone" display="icon"
												showDetail="false" /></td>

								<f:selectItem itemLabel="#{lbl['lbl.rpt.active']}"

								<f:selectItem itemLabel="#{lbl['lbl.rpt.inactive']}"

					test="#{pmReportBackingBean.managedBean.rptGenBean.pmExemptedCompanyNameView}">
