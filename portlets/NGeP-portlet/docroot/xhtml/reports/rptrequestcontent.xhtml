<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="resourceSection">
	
	</ui:define>
	
	<ui:define name="contentSection">
	
		<p:messages id="messages" autoUpdate="true" closable="true" />

		<p:commandLink id="refreshId" partialSubmit="true" process="@this"
			action="#{rptRequestBackingBean.getLatestStatusCodeForRequests()}" update="@form">
			<p:graphicImage value="/css/images/design/ico-refresh.png"/>
		</p:commandLink>&#160;
		
		<h:outputText value="Click Refresh to get the latest status update.">
		</h:outputText>
		
		<table width="100%" border="0" cellpadding="0" cellspacing="0">
	
			<tr>
	
				<td valign="top">
					
					<table width="100%">
					
						<tr>
							<td colspan="2" width="100%" valign="top">
							
								<p:dataTable
									value="#{rptRequestBackingBean.rptRequestDataModel}" var="rptRequest"
									id="rptRequestTable" rows="5" rowIndexVar="index" width="100%"
									rowKey="#{rptRequest}" lazy="true" >

									<ac:paginator for="rptRequestTable" />
									
									<p:column headerText="Job Id">
										<h:outputText value="#{rptRequest.jobId}" style="text-align:center"/>
									</p:column>
									
									<p:column headerText="Report Module">
										<h:outputText value="#{rptRequestBackingBean.getReportModule(rptRequest.reportCode)}"/>
									</p:column>
									
									<p:column headerText="Report Name">
										<h:outputText value="#{rptRequestBackingBean.getReportName(rptRequest.reportCode)}"/>
									</p:column>
									
	      							<p:column headerText="Date/Time"
										style="text-align: right;width:10%; padding:5px!important; ">

										<h:outputText value="#{rptRequest.createdDate}">
											<f:convertDateTime pattern="dd-MM-yyyy" />
										</h:outputText>
										
										<br/>
										
										<h:outputText value="#{rptRequest.createdDate}">
											<f:convertDateTime pattern="hh:mm:ss a" />
										</h:outputText>

									</p:column>
									
									<p:column headerText="Status">
										<h:outputText value="#{rptRequestBackingBean.getTrimmedStatusCode(rptRequest.statusCode)}" style="text-align:center"/>
									</p:column>
									
									<p:column headerText="Action">
										
										<p:commandLink rendered="#{rptRequestBackingBean.isSuccess(rptRequest.statusCode)}"
											onstart="blkReportContent.show();" update="@form"
															ajax="false" style="text-align:center">
											<p:fileDownload
												value="#{rptRequestBackingBean.generateReport(rptRequest)}" />
											<p:graphicImage value="/css/images/design/download.png" id="downloadImage"
												style="margin-right:2px;" />
										</p:commandLink>
									
									</p:column>
									
									<p:tooltip for="downloadImage" value="Download" trackMouse="true"/>
									 
	   								<p:ajax event="rowSelectCheckbox" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
									<p:ajax event="rowUnselectCheckbox" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
									<p:ajax event="rowUnselect" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
									<p:ajax event="rowSelect" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
									<p:ajax event="toggleSelect" listener="#{rptRequestBackingBean.rowSelectUnselectCheckbox}" />
										
								</p:dataTable>
								
							</td>
						</tr>
					</table>
				</td>
			</tr>
	
		</table>
							
  		<p:dialog widgetVar="blkReportContent" modal="true" draggable="false" closable="false" resizable="false" showHeader="false">
	    	<p:graphicImage name="../css/images/ajax-loader.gif" />
		</p:dialog>
	</ui:define>
	
</ui:composition>
