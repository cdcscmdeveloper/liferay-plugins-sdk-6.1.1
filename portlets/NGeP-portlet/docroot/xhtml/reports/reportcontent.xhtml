<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


 <p:messages id="rptmessages" showDetail="true" autoUpdate="true" closable="true" showSummary="false" />		
		<table style="width: 100%" >
			<tr>
				<td>
				<p:panel style="width: 100%;border:0;" header="REPORT CRITERIA"
						toggleable="true" id="rptModuleId" >
						 <table style="margin-top: 10px; width: 100%;">
						  <tr>
						    <td width="100%">
						    <h:panelGrid id="rptModule" columns="4"  style="margin-bottom:5px;width:85%;">
						    <p:outputLabel value="#{lbl['lbl.rpt.module']}" style="margin-bottom:5px;width:160px;"/>
						    <p:selectOneMenu  value="#{reportBackingBean.moduleValue}" style="margin-bottom:5px;width:300px;" >
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>
								<f:selectItems value="#{reportBackingBean.retriveModuleList()}"></f:selectItems>
								<p:ajax event="change" listener="#{reportBackingBean.retriveReportListBymoduleName}" process="@this"
								 partialSubmit="true"  update="@all"/>
							</p:selectOneMenu>
							<p:outputLabel value="#{lbl['lbl.rpt.rptName']}" style="margin-bottom:5px;width:160px;"/>
							<p:selectOneMenu value="#{reportBackingBean.reportValue}" style="margin-bottom:5px;width:300px;">
								<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>
								<f:selectItems value="#{reportBackingBean.reportList}"></f:selectItems>
								<p:ajax event="change" listener="#{reportBackingBean.criteriaVariablesByReport}" process="@this"
					 			partialSubmit="true" update="@all"/>
							</p:selectOneMenu>
							</h:panelGrid>
						    </td>
						    </tr>
						     <tr>
						    <td width="100%">					
						  		<p:outputLabel value="#{reportBackingBean.reportName}" 
							 	style="font-size:17px;margin-top:17px;font-weight:bold;white-space:normal;float:left;"/>
							</td>
						  </tr>						    
						  </table>	
						 <ui:include src="screportcontent.xhtml"></ui:include>
						 <ui:include src="cmreportcontent.xhtml"></ui:include>						
						 <ui:include src="flreportcontent.xhtml"></ui:include>
						 <ui:include src="smreportcontent.xhtml"></ui:include>
						 <ui:include src="ctreportcontent.xhtml"></ui:include>		
					<div>
						<c:if test="#{reportBackingBean.managedBean.rptGenBean.fromDateView}">
						<TABLE style="margin-top:10px;width:45%;">
							<TR>
								<TD>
									<p:outputLabel  value="#{lbl['lbl.rpt.dtRangeFrm']}" style="width:158px;"/>
								</TD>
								<TD>
									<p:calendar showOn="button" navigator="true" display="inline" readonlyInput="true" value="#{reportBackingBean.fromDate}" 
									
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"  partialSubmit="true" process="@form">																				
									</p:calendar>
								</TD>
								<TD>
									<p:outputLabel  value="#{lbl['lbl.rpt.dtRangeTo']}" style="width:50px;"/>
								</TD>				
								<TD>
									<p:calendar  showOn="button" navigator="true" display="inline" readonlyInput="true" value="#{reportBackingBean.toDate}"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"   partialSubmit="true" process="@form">	
																							
									</p:calendar> 
								</TD>
							</TR>
						</TABLE>
						</c:if>							
		            </div>		            
		           <h:panelGroup id="rptbtnGroup"  style="margin-top:10px;">
		            <div align="right">	
		            <p:commandButton value="#{lbl['lbl.btn.generate']}" ajax="false" onclick="handleLocalesDialogComplete(xhr, status, args)" 
		            update="@form" partialSubmit="true" process="@form">
        				<p:fileDownload value="#{reportBackingBean.generateReport()}" />
    				</p:commandButton> 	           
					<p:commandButton value="#{lbl['lbl.so.reset']}"	action="#{reportBackingBean.resetReportForm}"
					update="@form"  partialSubmit="true" process="@form"/>					        					
				   </div>
				   </h:panelGroup>
				   <div>
						
						<TABLE style="margin-top:10px;width:43%;">
							<TR>
								<td width="100%">
								<p:outputLabel value="*" styleClass="mandatory" style="float:left;margin-left:100px"/><p:outputLabel value=" Indicates required field" style="white-space:normal;float:left;"/>
							    </td>
							</TR>
					    </TABLE>
					    </div>
					<p:dialog id="reportGenDialog" widgetVar="reportGenDialog"
						modal="true" header="Report" width="1100" height="500" 
						resizable="false" position="right" closable="true"
						closeOnEscape="true" draggable="true" onHide="closeDialogBox(this)">
						<h:panelGroup id="reportResult" styleClass="reportResultStyle">
							<object id="someId" data="#{reportBackingBean.reportURL}"
								type="application/pdf" width="1100" height="500" />
						</h:panelGroup>						
					</p:dialog>
			<script type="text/javascript">
			/*Function to hide the Iframe*/
			function closeDialogBox(obj){
				//$('.reportIframe').hide();
			}
			function handleLocalesDialogComplete(xhr, status, args)
			{
			   if (args) {
			      var reportInValid = args.reportInValid;			
			     if(reportInValid){
			    	 window.open(args.reportViewUrl,'_blank');
			    	 //reportGenDialog.show();
			     }
			   }
			}
		     </script>
		</p:panel>
		</td>
	</tr>
  </table>
  </ui:composition>
