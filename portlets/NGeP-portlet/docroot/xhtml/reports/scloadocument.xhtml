<ui:composition xmlns="http://www.w3.org/1999/xhtml"

	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
 
  <div class="columnDPMarginTopClass">
  
   <c:if test="#{scReportBackingBean.managedBean.rptGenBean.scLOAContentView}" >   
	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contents.content']}" 
		toggleable="true">
		<p:dataTable id="contentsTbl" widgetVar="contentsTblWidget"
			var="scLoaReport" value="#{reportBackingBean.managedBean.loaReportDocumentList}" rows="10"
			rowKey="#{scLoaReport}">
			<ac:paginator for="contentsTbl" />
           
           <!-- <p:column style="width:2%" >
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selectAllNegoLoc"
						value="#{lOIDetailBackingBean.flag}" >
						<p:ajax partialSubmit="true" process="@this" update="contentsTbl"
							listener="#{reportBackingBean.selectAllDocuments}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{scLoaReport.selected}" >
					<p:ajax partialSubmit="true" process="@this" update="contentsTbl" />
				</p:selectBooleanCheckbox>
			</p:column> -->
			
			<p:column headerText="#{lbl['lbl.sc.content']}">				
				<h:outputText value="#{scLoaReport.title}" />
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.sc.action']}">
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{reportBackingBean.downloadReport(scLoaReport)}" />
			</p:column>
		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
				styleClass="ui-button"
				action="#{reportBackingBean.downloadAllReports}" />

		</div>
	</p:panel>
	</c:if></div>
</ui:composition>
