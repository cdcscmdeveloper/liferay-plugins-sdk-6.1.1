<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table style="width: 100%;">
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.ministry']}" /></td>
			<td colspan="3">
				<ac:lov id="lovCtMinistry"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					disabled="#{ctReportBB.managedBean.disableMinistryField}"
					readonly="true" headerText="#{lbl['lbl.ct.ministry']}"
					value="#{ctReportBB.managedBean.selectedMinistry.pmOrgValidity.orgName}"
					saveObject="ctReportBB.managedBean.selectedMinistry"
					postUpdateListener="ctReportBB.onChangeMinistry"
					conditionField="#{ctReportBB.constructMinistryConditionFields()}" /></td>
		</tr>
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.jabatan']}" /></td>
			<td colspan="3">
			<!-- Enhancement 32675 - shaqimi start -->
				<ac:lov id="lovCtKumpulanPTJ"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.ct.jabatan']}" readonly="true"
					disabled="#{(ctReportBB.managedBean.disableOrgField) and !ctReportBB.managedBean.factoringUser}" 
					value="#{ctReportBB.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
					saveObject="ctReportBB.managedBean.selectedKumpulanPTJ"
					conditionField="#{ctReportBB.constructKumpulanPTJConditionFields()}"
					postUpdateListener="ctReportBB.onChangeKumpulanPTJ" /></td>
			<!-- Enhancement 32675 - shaqimi end -->
		</tr>
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.ptj']}" /></td>
			<td colspan="3">
			<!-- Enhancement 32675 - shaqimi start -->
				<ac:lov id="lovCtPTJ"
					lovId="PM_ORG_PROFILE_REPORT" readonly="true" size="100"
					headerText="#{lbl['lbl.ct.ptj']}" update="@form"
					disabled="#{(ctReportBB.managedBean.disableOrgField) and !ctReportBB.managedBean.factoringUser}"
					value="#{ctReportBB.managedBean.selectedPTJ.pmOrgValidity.orgName}"
					saveObject="ctReportBB.managedBean.selectedPTJ"
					conditionField="#{ctReportBB.constructPTJConditionFields()}" /></td>
			<!-- Enhancement 32675 - shaqimi end -->
		</tr>
		<!--Start - #29416-->
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.contract.no']}" /></td>
			<td>
				<p:inputText value="#{ctReportBB.managedBean.contractNo}"  maxlength="17" style="width:300px">
					<p:ajax event="change" partialSubmit="true" process="@this" listener="#{ctReportBB.onChangeContractNo()}"/>
				</p:inputText>
				<!-- Enhancement 32675 - shaqimi start -->		
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.report.contract.no']}" />
				<!-- Enhancement 32675 - shaqimi end -->		
			</td>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.physical.no']}" /></td>
			<td colspan="2"><p:inputText
					value="#{ctReportBB.managedBean.contractPhysicalNo}" maxlength="30"
					style="width:300px">
					<p:ajax event="blur" partialSubmit="true" />
				</p:inputText> 
				<c:choose>
					<c:when
						test="#{ctReportBB.managedBean.reportCode == CtReportConst.ctContractItemUsageMonitoringRptMcVal}">
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no.item.monitoring']}" />
					</c:when>
					<c:otherwise>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.physical.contract.no']}" />
					</c:otherwise>
				</c:choose>
			 </td>
		</tr>
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.loa.no']}" /></td>
			<td>
				<p:inputText value="#{ctReportBB.managedBean.loaNo}"  maxlength="17" style="width:300px">
					<p:ajax event="blur" partialSubmit="true" />
				</p:inputText>
				<!-- Enhancement 32675 - shaqimi start -->		
				<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.contract.report.loa.no']}" />
				<!-- Enhancement 32675 - shaqimi end -->		
			</td>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.loa.physical.no']}" /></td>
			<td colspan="2">
				<p:inputText value="#{ctReportBB.managedBean.loaPhysicalNo}"  maxlength="100" style="width:300px">					
					<p:ajax event="blur" partialSubmit="true" />
				</p:inputText>
				<c:choose>
					<c:when
						test="#{ctReportBB.managedBean.reportCode == CtReportConst.ctContractItemUsageMonitoringRptMcVal}">
						     <ac:iconTooltip value="#{lbl['lbl.ct.tooltip.file.reference.no.item.monitoring']}" />
					</c:when>
					<c:otherwise>
						<ac:iconTooltip value="#{lbl['lbl.ct.tooltip.loa.physical.no']}" />
					</c:otherwise>
				</c:choose>
			</td>
		</tr>
		<!--End - #29416-->
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.agreement']}" /></td>
			<td>
				<p:selectOneMenu value="#{ctReportBB.managedBean.agreement}" style="width:300px">
					<f:selectItem itemLabel="#{lbl['lbl.txt.all']}" itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.txt.yes']}" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.txt.no']}" itemValue="0"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" />
				</p:selectOneMenu>
			</td>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.proc.method']}" /></td>
			<td>
				<p:selectOneMenu value="#{ctReportBB.managedBean.procurementMode}" style="width:300px">
					<f:selectItems value="#{ctReportBB.getProcurementModeDropdownValues()}" />
					<p:ajax event="change" partialSubmit="true" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.status']}" /></td>
			<td>
				<p:selectOneMenu value="#{ctReportBB.managedBean.status}" style="width:300px">
					<f:selectItem itemLabel="#{lbl['lbl.txt.all']}" itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.ct.effective']}" itemValue="1"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.ct.inactive']}" itemValue="2"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.ct.expired']}" itemValue="3"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.ct.terminated']}" itemValue="4"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" />
				</p:selectOneMenu>		
			</td>
			<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.contract.eff.date.from.2']}" /></td>
			<td>
				<table><tr>
					<td class="columnDateFromClass">
						<p:calendar showOn="button" navigator="true" display="inline" readonlyInput="true"
							value="#{ctReportBB.managedBean.fromDate}" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
							<!-- Enhancement 32675 - shaqimi start -->		
							<p:ajax event="dateSelect"
									listener="#{ctReportBB.onChangeFromToDate}"
									update="@form"></p:ajax>
							<!-- Enhancement 32675 - shaqimi end -->		
						</p:calendar>
					</td>
					<td class="columnDateToClass"><p:outputLabel value="#{lbl['lbl.ct.date.range.to']}" style="width:55px;" /></td>
					<td>
						<p:calendar showOn="button" navigator="true"
							display="inline" readonlyInput="true"
							value="#{ctReportBB.managedBean.toDate}" size="9"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
							partialSubmit="true" process="@form">
						</p:calendar>
					</td>
				</tr></table>
			</td>
		</tr>
		<!--Start - #29416-->
		<c:if test="#{ctReportBB.managedBean.reportCode eq CtReportConst.ctContractItemUsageMonitoringRptMcVal}">	
		<tr>	
				<td style="width:20%"><p:outputLabel value="#{lbl['lbl.ct.name.supplier']}" /></td>
				<td><ac:lov id="ctSupplierName" readonly="true"
						size="40" lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT"
						headerText="#{lbl['lbl.ct.name.supplier']}" update="@form"
						value="#{ctReportBB.managedBean.selectedSupplier.smSupplier.companyName}"
						saveObject="ctReportBB.managedBean.selectedSupplier" /></td>
						
			    <td style="width:20%"><p:outputLabel value="#{lbl['lbl.rpt.itmName']}" /></td>
				<td colspan="2"><ac:lovItemName id="ctReportItemName"
						lovId="CT_CONTRACT_ITEM_USAGE_MONITORING" readonly="true"
						size="60" headerText="#{lbl['lbl.rpt.itmName']}"
						value="#{ctReportBB.managedBean.formattedSelectedItems}"
						saveObject="ctReportBB.managedBean.lovSelectedItemList"
						selectionMode="multiple"
						postUpdateListener="ctReportBB.checkValue()"
						update="@form"
						flagBean="ctReportBB" /></td>
		 </tr> 		
		 </c:if> 
		 <!--End - #29416-->
	</table>
	<br/>
	<ac:generateReport bBean="#{ctReportBB}"
		reportMainBean="#{ctReportBB}">
	</ac:generateReport>
</ui:composition>
