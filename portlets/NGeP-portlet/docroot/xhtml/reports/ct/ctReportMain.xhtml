<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<p:messages id="ctReportMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>
		<table style="margin-top: 10px; width: 100%;">
			<tr>
				<td style="width:20%">
					<p:outputLabel value="#{lbl['lbl.rpt.rptCategory']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu
						label="#{lbl['lbl.rpt.rptCategory']}" id="reportCategory"
						value="#{ctReportBackingBean.managedBean.reportCategory}"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{ctReportBackingBean.managedBean.reportCategoryList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{ctReportBackingBean.retrieveReportListByCategory(ctReportBackingBean.managedBean.reportCategory)}"
							process="@this" partialSubmit="true" update="@all" />
					</p:selectOneMenu>
				</td>
			</tr> 
			<tr>
				<td style="width:20%">
					<p:outputLabel value="#{lbl['lbl.rpt.rptName']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu label="#{lbl['lbl.rpt.rptName']}"
						id="reportName"
						value="#{ctReportBackingBean.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{ctReportBackingBean.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{ctReportBackingBean.onChangeReportName()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:selectOneMenu>
				</td>
			</tr>
		</table>	

		<p:outputPanel id="ctReportSearchCriteriaPanel">
			<p:panel header="#{ctReportBackingBean.managedBean.reportTitle}"
				rendered="#{!empty ctReportBackingBean.managedBean.reportCode}">
				
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctContractMonitoringRptVal}">
					<ui:include src="/xhtml/reports/ct/mc/CT006_contractMonitoringReport.xhtml"></ui:include>
				</c:if>
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctFulfilmentStatusRptVal}">
					<ui:include src="/xhtml/reports/ct/mc/CT018_fulfilmentStatusReport.xhtml"></ui:include>
				</c:if>		
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctListOfContractMcRptVal}">
					<ui:include src="/xhtml/reports/ct/mc/CT003_listOfContract.xhtml"></ui:include>
				</c:if>							
								
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctListOfContractCcRptVal}">
					<ui:include src="/xhtml/reports/ct/cc/CT022_listOfContract.xhtml"></ui:include>
				</c:if>
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctStatementOfOrderCcRptVal}">
					<ui:include src="/xhtml/reports/ct/cc/CT021_statementOfOrderReport.xhtml"></ui:include>
				</c:if>
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctListOfCircularCqRptVal}">
					<ui:include src="/xhtml/reports/ct/cc/CT016_listOfCircular.xhtml"></ui:include>
				</c:if>
												
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctListOfCircularPqRptVal}">
					<ui:include src="/xhtml/reports/ct/panel/CT023_listOfCircular.xhtml"></ui:include>
				</c:if>				
				<c:if test="#{ctReportBackingBean.managedBean.reportCode eq CtReportConst.ctStatementOfOrderPqRptVal}">
					<ui:include src="/xhtml/reports/ct/panel/CT024_statementOfOrderReport.xhtml"></ui:include>
				</c:if>
				
			</p:panel>
		</p:outputPanel>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{ctReportBackingBean.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{ctReportBackingBean.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
		<ac:lovPopup />
	</ui:define>
</ui:composition>
