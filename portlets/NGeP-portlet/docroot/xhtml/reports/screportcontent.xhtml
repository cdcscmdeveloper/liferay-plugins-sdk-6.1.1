<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
 		
		         <div>						 
					 <table style="margin-top:10px;width:100%;" >
						  <tr>
						    <td width="100%">
							    <h:panelGrid  id="scReportCriteria" columns="4" style="width:85%;">
							    	 <c:if test="#{scReportBackingBean.managedBean.rptGenBean.scQuotationNoView}" >			
									<p:outputLabel value="#{lbl['lbl.rpt.qtNo']}"   style="margin-top:5px;width:160px;"/>
									<p:inputText id="rptQuotation" value="#{reportBackingBean.scQuotationNo}" style="margin-top:5px;width:290px;">									
									<p:ajax event="blur" listener="#{reportBackingBean.quotationNumberValidation()}" process="@form"
					 				partialSubmit="true" update="@form"/>	
									</p:inputText>
									<p:outputLabel value=""  style="margin-top:5px;width:160px;"/>
									<p:outputLabel value="" style="margin-top:5px;width:290px;"/>												
									</c:if>
																  
								   <c:if test="#{scReportBackingBean.managedBean.rptGenBean.extraTwoColumnView}">
								  <p:outputLabel value=""  style="margin-top:5px;width:162px;"/>
									<p:outputLabel value="" style="margin-top:5px;width:290px;"/>
								  </c:if>								 							 			
							    </h:panelGrid>							    
						    </td>
						  </tr>	
						  <tr>
						    <td width="100%">
							    <h:panelGrid  id="scProcureReportCriteria" columns="4" style="width:85%;">
							    	 
								  <c:if test="#{scReportBackingBean.managedBean.rptGenBean.scProcureAllChkView}" >			
									<p:outputLabel value="#{lbl['lbl.rpt.scProcurementMethod']}"   style="margin-top:5px;width:160px;"/>
									 <p:selectManyCheckbox value="#{reportBackingBean.scProcureAllList}"	>
										<f:selectItem itemLabel="All" itemValue="A" itemDisabled="#{scReportBackingBean.managedBean.rptGenBean.scProcureAllEditView}"/>										
									 </p:selectManyCheckbox>												
									</c:if>	
									<c:if test="#{scReportBackingBean.managedBean.rptGenBean.scQuotationChkView}" >			
									 <p:outputLabel value=""  style="margin-top:5px;width:160px;"/>
									 <p:selectManyCheckbox value="#{reportBackingBean.scQuotationList}" >										
										<f:selectItem itemLabel="Quotation" itemValue="Q" itemDisabled="#{scReportBackingBean.managedBean.rptGenBean.scProcureQuoteEditView}"/>										
									 </p:selectManyCheckbox>												
									</c:if>
									<c:if test="#{scReportBackingBean.managedBean.rptGenBean.scTenderChkView}" >			
									<p:outputLabel value=""  style="margin-top:5px;width:160px;"/>
									 <p:selectManyCheckbox value="#{reportBackingBean.scTenderList}">										
										<f:selectItem itemLabel="Tender" itemValue="T" itemDisabled="#{scReportBackingBean.managedBean.rptGenBean.scProcureTenderEditView}"/>										
									 </p:selectManyCheckbox>												
									</c:if>
									<c:if test="#{scReportBackingBean.managedBean.rptGenBean.scRstrctdChkView}" >			
									<p:outputLabel value=""  style="margin-top:5px;width:160px;"/>
									 <p:selectManyCheckbox value="#{reportBackingBean.scRstrctdTndrList}">										
										<f:selectItem itemLabel="Restricted Tender" itemValue="R" itemDisabled="#{scReportBackingBean.managedBean.rptGenBean.scProcureRestrctdEditView}"/>
									 </p:selectManyCheckbox>												
									</c:if>
									<c:if test="#{scReportBackingBean.managedBean.rptGenBean.scStatusView}">
									<p:outputLabel value="#{lbl['lbl.rpt.status']}" style="margin-top:5px;width:160px;" />									
									<p:selectOneMenu value="#{reportBackingBean.scStatus}" style="margin-top:5px;width:300px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>										
										<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue="#{1}"></f:selectItem>
										<f:selectItem itemLabel="#{lbl['lbl.rpt.preparation']}" itemValue="#{2}"></f:selectItem>
										<f:selectItem itemLabel="#{lbl['lbl.rpt.publishing']}" itemValue="#{3}"></f:selectItem>
										<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingEvaluation']}" itemValue="#{4}"></f:selectItem>	
										<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSupplierFinalization']}" itemValue="#{5}"></f:selectItem>
										<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingLOInLOA']}" itemValue="#{6}"></f:selectItem>
										<f:selectItem itemLabel="#{lbl['lbl.rpt.loaCompleted']}" itemValue="#{7}"></f:selectItem>
										<f:selectItem itemLabel="#{lbl['lbl.rpt.cancelled']}" itemValue="#{8}"></f:selectItem>																								
									</p:selectOneMenu>
								  </c:if>	
								  <c:if test="#{smReportBackingBean.managedBean.rptGenBean.scPtjView}">
									<p:outputLabel value="#{lbl['lbl.rpt.ptj']}" style="margin-top:5px;width:130px;" />									
									<p:selectOneMenu value="#{reportBackingBean.scPtj}" style="margin-top:5px;width:300px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>									
									</p:selectOneMenu>
								  </c:if>
								   <c:if test="#{smReportBackingBean.managedBean.rptGenBean.scDeskOfficerView}">
									<p:outputLabel value="#{lbl['lbl.rpt.deskOfficer']}" style="margin-top:5px;width:160px;" />									
									<p:selectOneMenu value="#{reportBackingBean.scDeskOfficer}" style="margin-top:5px;width:300px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>																																	
									</p:selectOneMenu>
								  </c:if>							 			
							    </h:panelGrid>							    
						    </td>
						  </tr>							  
					</table>
		       </div>
		       <div>
						<c:if test="#{smReportBackingBean.managedBean.rptGenBean.scCreatedFromView}">
						<TABLE style="width:85%;" id="createDateTable">
							<TR>
								<TD>
									<p:outputLabel  value="#{lbl['lbl.rpt.createdFrom']}" style="margin-top:5px;width:160px;margin-left:-71px"/>
								</TD>
								<TD>
									<p:selectOneMenu value="#{reportBackingBean.scCreatedFromMonth}" style="margin-top:5px;width:90px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>
										<f:selectItems value="#{reportBackingBean.generateMonthList()}"></f:selectItems>																																	
									</p:selectOneMenu>
								</TD>				
								<TD>
									<p:selectOneMenu value="#{reportBackingBean.scCreatedFromYear}" style="margin-top:5px;width:80px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>
										<f:selectItems value="#{reportBackingBean.generateYearList()}"></f:selectItems>	
										<p:ajax event="change" listener="#{reportBackingBean.createdToDtUpdate}" process="@this"
					 			         partialSubmit="true" update=":form:createDt"/>																																
									</p:selectOneMenu>
								</TD>
								<TD>
									<p:outputLabel  value="#{lbl['lbl.rpt.createdTo']}" style="margin-top:5px;width:145px;;margin-left:-55px"/>
								</TD>
								<TD>
									<p:selectOneMenu value="#{reportBackingBean.scCreatedToMonth}" style="margin-top:5px;width:90px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>
										<f:selectItems value="#{reportBackingBean.generateMonthList()}"></f:selectItems>																																	
									</p:selectOneMenu>
								</TD>				
								<TD id="">
									<p:selectOneMenu id="createDt" value="#{reportBackingBean.scCreatedToYear}" style="margin-top:5px;width:80px;">
										<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>	
										<f:selectItems value="#{reportBackingBean.generateYearList()}"></f:selectItems>																																
									</p:selectOneMenu>
								</TD>
							</TR>
						</TABLE>
						</c:if>							
		            </div>
  </ui:composition>
