<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{mcSmRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ministry']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchMinistry"
					lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ministry']}"
					disabled="#{mcSmRptBB.disableMinistryLov()}"
					value="#{mcSmRptBB.managedBean.ministry.orgName}"
					postUpdateListener="mcSmRptBB.resetPtjGroupProfile()"
					update=":form:searchPtj,:form,:form:flSupplierName,:form:supplierCompName"
					saveObject="mcSmRptBB.managedBean.ministry"
					conditionField="#{mcSmRptBB.getMinistryCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchJabatan"
					lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.jabatan']}"
					disabled="#{mcSmRptBB.disablePtjGroupLov()}"
					value="#{mcSmRptBB.managedBean.ptjGroup.orgName}"
					postUpdateListener="mcSmRptBB.resetPtjProfile()"
					update=":form:searchPtj"
					saveObject="mcSmRptBB.managedBean.ptjGroup"
					conditionField="#{mcSmRptBB.constuctConditionFieldsForPTJGroup()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchPtj"
					lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ptj']}"
					disabled="#{mcSmRptBB.disablePtjLov()}"
					value="#{mcSmRptBB.managedBean.ptj.orgName}"
					update=":form"
					saveObject="mcSmRptBB.managedBean.ptj"
					conditionField="#{mcSmRptBB.getPTJCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}"></p:outputLabel><!-- 29890 - change label  -->
			</td>
			<td>
				<p:inputText maxlength="400" id="contractSysTypeId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{mcSmRptBB.managedBean.contractSystem}">
					<p:ajax event="blur" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:inputText><!-- 29890 - change label  -->
				&#160;
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforpoandpacontract']}" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}" />
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form"
					value="#{mcSmRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="mcSmRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{mcSmRptBB.managedBean.supplier}"
					value="#{mcSmRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
		</tr>	
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.documentType']}"/>
			</td>
			<td>
				<p:selectOneMenu value="#{mcSmRptBB.managedBean.documentType}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.contractOrderlbl']}"
						itemValue="#{lbl['lbl.rpt.drpdown.contractOrdervalue']}"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.purchaseOrderlbl']}"
						itemValue="#{lbl['lbl.rpt.drpdown.purchaseOrdervalue']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.pkpNoScreen']}"/>
			</td>
			<td>
				<p:inputText maxlength="400" value="#{mcSmRptBB.managedBean.pkpNo}"/>
				&#160;
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforpoandpa']}" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
			</td>
			<td>
				<p:selectOneMenu id="statusId"
					value="#{mcSmRptBB.managedBean.statusDescId}">
					<f:selectItems value="#{mcSmRptBB.getStatusDropDownValues('CR')}" />
					<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"/>
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{mcSmRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" 
						itemDisabled="#{mcSmRptBB.hasSupplierRole()}"
      					itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.status']}"
						itemValue="#{lbl['lbl.rpt.sts']}"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.procurementCodelbl']}"
						itemValue="#{lbl['lbl.rpt.drpdown.procurementCodevalue']}"></f:selectItem>

					<f:selectItem itemLabel="#{lbl['lbl.rpt.pkpNoScreen']}"
						itemValue="#{lbl['lbl.rpt.pkpnumber']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.documentType']}"
						itemValue="#{lbl['lbl.rpt.dcmntType']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcSmRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcSmRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar>
			</td>
		</tr>
	</table>
	
		<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{mcSmRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{mcSmRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{flReportBB.resetAction()}">
		</p:commandButton>
	</div>
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{mcSmRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{mcSmRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
	
</ui:composition>
