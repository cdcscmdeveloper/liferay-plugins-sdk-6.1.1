<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{poRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{poRptBB.disableMinistryLov()}"
							value="#{poRptBB.managedBean.ministry.orgName}"
							postUpdateListener="poRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form,:form:flSupplierName,:form:supplierCompName"
							saveObject="poRptBB.managedBean.ministry"
							conditionField="#{poRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{poRptBB.disablePtjGroupLov()}"
							value="#{poRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="poRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="poRptBB.managedBean.ptjGroup"
							conditionField="#{poRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{poRptBB.disablePtjLov()}"
							value="#{poRptBB.managedBean.ptj.orgName}"
							saveObject="poRptBB.managedBean.ptj"	
							conditionField="#{poRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.item.name']}" /></td>
			<td><p:inputText value="#{poRptBB.managedBean.itemName}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
			<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
			<td><p:inputText maxlength="20"
					value="#{poRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" />
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{poRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>

			<td><p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{poRptBB.managedBean.physicalContractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> <ac:iconTooltip
					value="#{lbl['lbl.rpt.tooltipforphycontract']}" />
				<p:message id="flphycontractIdMsg" for="flphycontractId"
					display="icon" /></td>

		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" /></td>
			<td><p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{poRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphysst']}" />
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" /></td>

			<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" /></td>
			<td><p:inputText maxlength="100" id="loaId"
					label="#{lbl['lbl.fl.doc.maintain.loa.no']}"
					value="#{poRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}"/>
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!poRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form" 
					value="#{poRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="poRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{poRptBB.managedBean.supplier}"
					value="#{poRptBB.managedBean.supplierCompName}">
				</p:inputText>
				
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.approver.name']}"/>
			</td>
			<td><p:selectOneMenu value="#{poRptBB.managedBean.approver}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{poRptBB.retrieveApproverList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{poRptBB.managedBean.purchaseOrderNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{poRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			
		</tr>
		
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
			<td><p:selectOneMenu id="statusId"
								value="#{poRptBB.managedBean.statusDescId}"
								style="width: 314px;">
								<f:selectItems
									value="#{poRptBB.getStatusDropDownValues('CO')}" />
								<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>	
							</p:selectOneMenu></td>
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}" /></td>
			<td><p:selectOneMenu value="#{poRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
										itemValue="#{null}"></f:selectItem>
									<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" itemDisabled="#{poRptBB.hasSupplierRole()}"
										itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
									<f:selectItem itemLabel="#{lbl['lbl.rpt.sstScreen']}"
										itemValue="#{lbl['lbl.rpt.sstnospace']}"></f:selectItem>
									<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
										itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
									<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
										itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
									<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
										itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
									<f:selectItem
										itemLabel="#{lbl['lbl.rpt.procurementtypeScreen']}"
										itemValue="#{lbl['lbl.rpt.procurementtypeScreen']}"></f:selectItem>
									<f:selectItem itemLabel="#{lbl['lbl.rpt.status']}"
										itemValue="#{lbl['lbl.rpt.sts']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar></td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{poRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{poRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{poRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{poRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{poRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
