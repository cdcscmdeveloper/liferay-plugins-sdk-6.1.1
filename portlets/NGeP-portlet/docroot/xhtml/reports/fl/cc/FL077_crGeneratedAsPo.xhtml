<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{ccCrGenAsPoRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ministry']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchMinistry"
					lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ministry']}"
					disabled="#{ccCrGenAsPoRptBB.disableMinistryLov()}"
					value="#{ccCrGenAsPoRptBB.managedBean.ministry.orgName}"
					postUpdateListener="ccCrGenAsPoRptBB.resetPtjGroupProfile()"
					update=":form:searchPtj,:form"
					saveObject="ccCrGenAsPoRptBB.managedBean.ministry"
					conditionField="#{ccCrGenAsPoRptBB.getMinistryCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchJabatan"
					lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.jabatan']}"
					disabled="#{ccCrGenAsPoRptBB.disablePtjGroupLovByReportCode()}"
					value="#{ccCrGenAsPoRptBB.managedBean.ptjGroup.orgName}"
					postUpdateListener="ccCrGenAsPoRptBB.resetPtjProfile()"
					update=":form"
					saveObject="ccCrGenAsPoRptBB.managedBean.ptjGroup"
					conditionField="#{ccCrGenAsPoRptBB.constuctConditionFieldsForPTJGroup()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchPtj"
					lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ptj']}"
					disabled="#{ccCrGenAsPoRptBB.disablePtjLovByReportCode()}"
					value="#{ccCrGenAsPoRptBB.managedBean.ptj.orgName}"
					update=":form"
					saveObject="ccCrGenAsPoRptBB.managedBean.ptj"
					conditionField="#{ccCrGenAsPoRptBB.getPTJCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{ccCrGenAsPoRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.central.contract.panel.name']}" />
			</td>

			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.central.contract.panel.name']}"
					value="#{ccCrGenAsPoRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.req.no']}" />
			</td>
			<td>
				<p:inputText value="#{ccCrGenAsPoRptBB.managedBean.contractRequestNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{ccCrGenAsPoRptBB.managedBean.purchaseOrderNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{ccCrGenAsPoRptBB.managedBean.physicalContractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no.fact.user']}" />
				<p:message id="flphycontractIdMsg" for="flphycontractId" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{ccCrGenAsPoRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no.fact.user']}"/> 
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20" value="#{ccCrGenAsPoRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa.fact.user']}"/>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{ccCrGenAsPoRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.file.ref.no.fact.user']}"/> 
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" />
			</td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}" />
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!ccCrGenAsPoRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form"
					value="#{ccCrGenAsPoRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="ccCrGenAsPoRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{ccCrGenAsPoRptBB.managedBean.supplier}"
					value="#{ccCrGenAsPoRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{ccCrGenAsPoRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.physical.treasury.circular']}"
						itemValue="#{lbl['lbl.fl.physical.treasury.circular']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.central.contract.panel.name']}"
						itemValue="#{lbl['lbl.fl.central.contract.panel.name']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.flContractRequest']}"
						itemValue="#{lbl['lbl.rpt.flContractRequest']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
						itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNoValue']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
						itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.loa.no']}"
						itemValue="#{lbl['lbl.fl.doc.maintain.loa.no']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" 
						itemDisabled="#{mcCrGenAsPoRptBB.hasSupplierRole()}"
      					itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.cr.submission.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					id="crSubDateFrom" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.submissionDateFrom}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcrsubmissiondate']}"/>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.cr.submission.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					id="crSubDateTo" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.submissionDateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.cr.approved.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					id="crAppDateFrom" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.approvedDateFrom}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcrapproveddate']}"/>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.cr.approved.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					id="crAppDateTo" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.approvedDateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.po.generated.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					id="poGenDateFrom" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.poGenDateFrom}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforpogenerateddate']}"/>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.po.generated.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					id="poGenDateTo" readonlyInput="true"
					value="#{ccCrGenAsPoRptBB.managedBean.poGenDateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect"
							listener="#{ccCrGenAsPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{ccCrGenAsPoRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{ccCrGenAsPoRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{ccCrGenAsPoRptBB.resetAction()}">
		</p:commandButton>
	</div>
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{ccCrGenAsPoRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{ccCrGenAsPoRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
</ui:composition>
