<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{poCancelRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{poCancelRptBB.disableMinistryLov()}"
							value="#{poCancelRptBB.managedBean.ministry.orgName}"
							postUpdateListener="poCancelRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form"
							saveObject="poCancelRptBB.managedBean.ministry"
							conditionField="#{poCancelRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{poCancelRptBB.disablePtjGroupLov()}"
							value="#{poCancelRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="poCancelRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="poCancelRptBB.managedBean.ptjGroup"
							conditionField="#{poCancelRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td>
			<!-- 29550 - Start (add condition to display PTJ label)-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel>
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{poCancelRptBB.disablePtjLov()}"
							value="#{poCancelRptBB.managedBean.ptj.orgName}"
							saveObject="poCancelRptBB.managedBean.ptj"	
							conditionField="#{poCancelRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.contract.no']}" /></td>
			<td><p:inputText maxlength="20"
					value="#{poCancelRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<!-- 29550 - start -->
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no.fact.user']}" rendered="#{flReportBB.hasFactoringUserRole()}"/> 
				<!-- 29550 - end -->
			</td>
			<td>
			<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.central.contract.panel.name']}" />
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" />
					</c:otherwise>
				</c:choose>
			<!-- 29550 - end -->
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{poCancelRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>

			<td><p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{poCancelRptBB.managedBean.physicalContractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> 
				<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no.fact.user']}"/> 
					</c:when>
					<c:otherwise>
						<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphycontract']}" />
					</c:otherwise>
				</c:choose>
				<!-- 29550 - end -->
				<p:message id="flphycontractIdMsg" for="flphycontractId"
					display="icon" /></td>
			<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" /></td>
			<td><p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{poCancelRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.file.ref.no.fact.user']}"/> 
					</c:when>
					<c:otherwise>
						<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphysst']}"/>
					</c:otherwise>
				</c:choose>
				<!-- 29550 - end -->
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" />
			</td>
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" /></td>
			<td><p:inputText maxlength="100" id="loaId"
					label="#{lbl['lbl.fl.doc.maintain.loa.no']}"
					value="#{poCancelRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<!-- 29550 - start -->
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa.fact.user']}" rendered="#{flReportBB.hasFactoringUserRole()}"/>
				<!-- 29550 - end -->
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}"/>
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true" rendered="#{!poCancelRptBB.managedBean.supplier}"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form" 
					value="#{poCancelRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="poCancelRptBB.managedBean.selectedOrgProfile" />
			<p:inputText size="51" disabled="true" rendered="#{poCancelRptBB.managedBean.supplier}"
					value="#{poCancelRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{poCancelRptBB.managedBean.purchaseOrderNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{poCancelRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}" /></td>
			<!-- 29550 - start(to cater option displayed by factoring user)-->
			<td><p:selectOneMenu value="#{poCancelRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" itemDisabled="#{poCancelRptBB.hasSupplierRole()}"
						itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
						itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
					<c:choose>
						<c:when test="#{flReportBB.hasFactoringUserRole()}">
							<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.loa.no']}"
								itemValue="#{lbl['lbl.fl.doc.maintain.loa.no']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.central.contract.panel.name']}"
								itemValue="#{lbl['lbl.fl.central.contract.panel.name']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
								itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.physical.treasury.circular']}"
								itemValue="#{lbl['lbl.fl.physical.treasury.circular']}"></f:selectItem>
						</c:when>
						<c:otherwise>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.sstScreen']}"
								itemValue="#{lbl['lbl.rpt.sstnospace']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.pkpNoScreen']}"
								itemValue="#{lbl['lbl.rpt.pkpnumber']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.procurementtypeScreen']}"
								itemValue="#{lbl['lbl.rpt.procurementtypeScreen']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.cancelledby']}"
								itemValue="#{lbl['lbl.rpt.cancelledby']}"></f:selectItem>
						</c:otherwise>
					</c:choose>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<!-- 29550 - end -->
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poCancelRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{poCancelRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poCancelRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{poCancelRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar></td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{poCancelRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{poCancelRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{poCancelRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{poCancelRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{poCancelRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
