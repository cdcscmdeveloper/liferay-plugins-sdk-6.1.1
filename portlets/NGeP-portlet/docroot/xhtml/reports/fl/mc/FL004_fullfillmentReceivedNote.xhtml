<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{mcFrnRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{mcFrnRptBB.disableMinistryLov()}"
							value="#{mcFrnRptBB.managedBean.ministry.orgName}"
							postUpdateListener="mcFrnRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form"
							saveObject="mcFrnRptBB.managedBean.ministry"
							conditionField="#{mcFrnRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{mcFrnRptBB.disablePtjGroupLov()}"
							value="#{mcFrnRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="mcFrnRptBB.resetPtjProfile()"
							update=":form"
							saveObject="mcFrnRptBB.managedBean.ptjGroup"
							conditionField="#{mcFrnRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{mcFrnRptBB.disablePtjLov()}"
							value="#{mcFrnRptBB.managedBean.ptj.orgName}"
							update=":form"
							saveObject="mcFrnRptBB.managedBean.ptj"	
							conditionField="#{mcFrnRptBB.getPTJCondition()}"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{mcFrnRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
					<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{mcFrnRptBB.managedBean.physicalContractNo}">
				
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphycontract']}" />
				<p:message id="flphycontractIdMsg" for="flphycontractId" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{mcFrnRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphysst']}" /> 
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20" value="#{mcFrnRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}" />
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!mcFrnRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form"
					value="#{mcFrnRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="mcFrnRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{mcFrnRptBB.managedBean.supplier}"
					value="#{mcFrnRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.receiving.officer.name']}"
								style="margin-top:5px;width:191px;" />
			</td>
			<td>
				<p:selectOneMenu
					value="#{mcFrnRptBB.managedBean.receivingOfficer}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{mcFrnRptBB.retrieveReceivingOfficerList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.flRecNoteNo']}" style="margin-top:5px;width:191px;" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{mcFrnRptBB.managedBean.flRecNoteNo}"
					style="margin-top:5px;width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>				
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.acknowledgeOfficer']}"
					style="margin-top:5px;width:191px;" />
			</td>
			<td>
				<p:selectOneMenu
					value="#{mcFrnRptBB.managedBean.acknowledgeOfficer}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{mcFrnRptBB.retrieveAcknowledgeOfficerList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.req.no']}" />
			</td>
			<td>
				<p:inputText maxlength="35"
					value="#{mcFrnRptBB.managedBean.contractRequestNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"/> 
			</td>
			<td>
				<p:inputText value="#{mcFrnRptBB.managedBean.purchaseOrderNo}"/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{mcFrnRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" 
						itemDisabled="#{mcFrnRptBB.hasSupplierRole()}"
      					itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sstScreen']}"
						itemValue="#{lbl['lbl.rpt.sstnospace']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
						itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
						itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
			</td>
			<td>
				<p:selectOneMenu id="statusId"
					value="#{mcFrnRptBB.managedBean.statusDescId}" style="width: 314px;">
					<f:selectItems value="#{mcFrnRptBB.getStatusDropDownValues('CR')}" />
					<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"/>
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcFrnRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcFrnRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar>
			</td>
		</tr>
	</table>
	
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{mcFrnRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{mcFrnRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{mcFrnRptBB.resetAction()}">
		</p:commandButton>
	</div>
	
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{mcFrnRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{mcFrnRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>

</ui:composition>
