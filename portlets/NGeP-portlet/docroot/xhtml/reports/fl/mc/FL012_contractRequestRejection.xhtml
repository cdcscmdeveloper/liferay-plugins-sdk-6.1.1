<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
			<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.ministry']}" /></td>
			<td colspan="3">
				<ac:lov id="lovFlMinistry"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.rpt.ministry']}" readonly="true"
					value="#{mcCrRejectRptBB.managedBean.selectedMinistry.pmOrgValidity.orgName}"
					saveObject="mcCrRejectRptBB.managedBean.selectedMinistry"	
					postUpdateListener="mcCrRejectRptBB.onChangeMinistry" 
					conditionField="#{mcCrRejectRptBB.constructMinistryConditionFields()}" />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.pegawai.pengawal']}"></p:outputLabel>
			</td>
			<td colspan="3"><ac:lov id="lovPpPegaWaiPengawal"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.pp.pegawai.pengawal']}" readonly="true"
					disabled="#{mcCrRejectRptBB.managedBean.selectedMinistry==null or mcCrRejectRptBB.managedBean.disableOrgFields}"
					value="#{mcCrRejectRptBB.managedBean.selectedPegawaiPengawal.pmOrgValidity.orgName}"
					saveObject="mcCrRejectRptBB.managedBean.selectedPegawaiPengawal"
					postUpdateListener="mcCrRejectRptBB.onChangePegawaiPengawal"
					conditionField="#{mcCrRejectRptBB.constructPegwaiPengawalConditionFields()}" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}"></p:outputLabel></td>
			<td colspan="3"><ac:lov id="lovPpKumpulanPTJ"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.pp.kumpulan.ptj']}" readonly="true"
					disabled="#{mcCrRejectRptBB.managedBean.selectedPegawaiPengawal==null or mcCrRejectRptBB.managedBean.disableOrgFields}"
					value="#{mcCrRejectRptBB.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
					saveObject="mcCrRejectRptBB.managedBean.selectedKumpulanPTJ"
					conditionField="#{mcCrRejectRptBB.constructKumpulanPTJConditionFields()}"
					postUpdateListener="mcCrRejectRptBB.onChangeJabatan" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.ptj']}"></p:outputLabel></td>
			<td colspan="3"><ac:lov id="lovPpPTJ"
					lovId="PM_ORG_PROFILE_REPORT" readonly="true" size="100"
					headerText="#{lbl['lbl.pp.ptj']}" update="@form"
					disabled="#{mcCrRejectRptBB.managedBean.selectedKumpulanPTJ==null or mcCrRejectRptBB.managedBean.disableOrgFields}"
					value="#{mcCrRejectRptBB.managedBean.selectedPTJ.pmOrgValidity.orgName}"
					saveObject="mcCrRejectRptBB.managedBean.selectedPTJ"
					conditionField="#{mcCrRejectRptBB.constructPTJConditionFields()}" /></td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{mcCrRejectRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
					<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{mcCrRejectRptBB.managedBean.physicalContractNo}">
				
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphycontract']}" />
				<p:message id="flphycontractIdMsg" for="flphycontractId" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{mcCrRejectRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphysst']}" /> 
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.search.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20" value="#{mcCrRejectRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.requisitioner']}" />
			</td>
			<td>
				<p:selectOneMenu
					value="#{mcCrRejectRptBB.managedBean.requisitioner}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems value="#{mcCrRejectRptBB.retrieveRequisitionerList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.approver.name']}"/>
			</td>
			<td>
				<p:selectOneMenu value="#{mcCrRejectRptBB.managedBean.approver}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{poRptBB.retrieveApproverList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.req.no']}" />
			</td>
			<td>
				<p:inputText maxlength="35"
					value="#{mcCrRejectRptBB.managedBean.contractRequestNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{reportBackingBean.flGroupOne}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}"
						itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sstScreen']}"
						itemValue="#{lbl['lbl.rpt.sstnospace']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
						itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
						itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcCrRejectRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcCrRejectRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar>
			</td>
		</tr>
	</table>
		
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{mcCrRejectRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{mcCrRejectRptBB.managedBean.reportCode}" value="#{mcCrRejectRptBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{flReportBB.resetAction()}">
		</p:commandButton>
	</div>
	
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{mcCrRejectRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{mcCrRejectRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
	
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{mcCrRejectRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{mcCrRejectRptBB.managedBean.reportCode}" value="#{mcCrRejectRptBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{flReportBB.resetAction()}">
		</p:commandButton>
	</div>

	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{mcCrRejectRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{mcCrRejectRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
	
</ui:composition>
