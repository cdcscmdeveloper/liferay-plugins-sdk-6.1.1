<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{mcPoRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ministry']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchMinistry"
					lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ministry']}"
					disabled="#{mcPoRptBB.disableMinistryLov()}"
					value="#{mcPoRptBB.managedBean.ministry.orgName}"
					postUpdateListener="mcPoRptBB.resetPtjGroupProfile()"
					update=":form:searchPtj,:form"
					saveObject="mcPoRptBB.managedBean.ministry"
					conditionField="#{mcPoRptBB.getMinistryCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchJabatan"
					lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.jabatan']}"
					disabled="#{mcPoRptBB.disablePtjGroupLov()}"
					value="#{mcPoRptBB.managedBean.ptjGroup.orgName}"
					postUpdateListener="mcPoRptBB.resetPtjProfile()"
					update=":form"
					saveObject="mcPoRptBB.managedBean.ptjGroup"
					conditionField="#{mcPoRptBB.constuctConditionFieldsForPTJGroup()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
			<!-- 29550 - Start (add condition to display PTJ label)-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel>
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td colspan="3">
				<ac:lov id="searchPtj"
					lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ptj']}"
					disabled="#{mcPoRptBB.disablePtjLov()}"
					value="#{mcPoRptBB.managedBean.ptj.orgName}"
					update=":form"
					saveObject="mcPoRptBB.managedBean.ptj"
					conditionField="#{mcPoRptBB.getPTJCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.item.name']}" />
			</td>
			<td>
				<p:inputText value="#{mcPoRptBB.managedBean.itemName}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{mcPoRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<!-- 29550 - start -->
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.contr.no.fact.user']}" rendered="#{flReportBB.hasFactoringUserRole()}"/> 
				<!-- 29550 - end -->
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{mcPoRptBB.managedBean.physicalContractNo}">
				
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> 
				<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.phycontr.no.fact.user']}"/> 
					</c:when>
					<c:otherwise>
						<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphycontract']}" />
					</c:otherwise>
				</c:choose>
				<!-- 29550 - end -->
				<p:message id="flphycontractIdMsg" for="flphycontractId" display="icon" />
			</td>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{mcPoRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
				<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.file.ref.no.fact.user']}"/> 
					</c:when>
					<c:otherwise>
						<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphysst']}"/>
					</c:otherwise>
				</c:choose>
				<!-- 29550 - end -->
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" />
			</td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20" value="#{mcPoRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<!-- 29550 - start -->
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltip.doc.maintain.loa.fact.user']}" rendered="#{flReportBB.hasFactoringUserRole()}"/>
				<!-- 29550 - end -->
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}" />
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!mcPoRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form"
					value="#{mcPoRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="mcPoRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{mcPoRptBB.managedBean.supplier}"
					value="#{mcPoRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.approver.name']}"/>
			</td>
			<td>
				<p:selectOneMenu value="#{mcPoRptBB.managedBean.approver}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<!-- 29550 - start (change backing bean name from poRptBB to mcPoRptBB -->
					<f:selectItems
						value="#{mcPoRptBB.retrieveApproverList()}"></f:selectItems>
					<!-- 29550 - end -->
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}">
				</p:outputLabel> 
			</td>
			<td>
				<p:inputText value="#{mcPoRptBB.managedBean.purchaseOrderNo}">
				<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> 
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<!-- 29550 - start(to cater option displayed by factoring user)-->
				<p:selectOneMenu value="#{mcPoRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" 
						itemDisabled="#{mcPoRptBB.hasSupplierRole()}"
      					itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
						itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
					<c:choose>
						<c:when test="#{flReportBB.hasFactoringUserRole()}">
							<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.loa.no']}"
								itemValue="#{lbl['lbl.fl.doc.maintain.loa.no']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.itmName']}"
								itemValue="#{lbl['lbl.rpt.itmName']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.approverName']}"
								itemValue="#{lbl['lbl.rpt.approverName']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
								itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.doc.status']}"
								itemValue="#{lbl['lbl.fl.doc.maintain.doc.status']}"></f:selectItem>
						</c:when>
						<c:otherwise>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.sstScreen']}"
								itemValue="#{lbl['lbl.rpt.sstnospace']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
								itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
						</c:otherwise>
					</c:choose>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<!-- 29550 - End -->
			</td>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
			</td>
			<td>
				<p:selectOneMenu id="statusId"
					value="#{mcPoRptBB.managedBean.statusDescId}">
					<f:selectItems value="#{mcPoRptBB.getStatusDropDownValues('CO')}" />
					<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"/>
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcPoRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{mcPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{mcPoRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{mcPoRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar>
			</td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{mcPoRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{mcPoRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{mcPoRptBB.resetAction()}">
		</p:commandButton>
	</div>
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{mcPoRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{mcPoRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
</ui:composition>
