<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.ministry']}" /></td>
			<td colspan="3">
				<ac:lov id="lovFlMinistry"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.rpt.ministry']}" readonly="true"
					value="#{flReportsBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
					saveObject="flReportsBackingBean.managedBean.selectedMinistry"	
					postUpdateListener="flReportsBackingBean.onChangeMinistry" 
					conditionField="#{flReportsBackingBean.constructMinistryConditionFields()}" />
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.pegawai.pengawal']}"></p:outputLabel>
			</td>
			<td colspan="3"><ac:lov id="lovPpPegaWaiPengawal"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.pp.pegawai.pengawal']}" readonly="true"
					disabled="#{flReportsBackingBean.managedBean.selectedMinistry==null or flReportsBackingBean.managedBean.disableOrgFields}"
					value="#{flReportsBackingBean.managedBean.selectedPegawaiPengawal.pmOrgValidity.orgName}"
					saveObject="flReportsBackingBean.managedBean.selectedPegawaiPengawal"
					postUpdateListener="flReportsBackingBean.onChangePegawaiPengawal"
					conditionField="#{flReportsBackingBean.constructPegwaiPengawalConditionFields()}" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}"></p:outputLabel></td>
			<td colspan="3"><ac:lov id="lovPpKumpulanPTJ"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.pp.kumpulan.ptj']}" readonly="true"
					disabled="#{flReportsBackingBean.managedBean.selectedPegawaiPengawal==null or flReportsBackingBean.managedBean.disableOrgFields}"
					value="#{flReportsBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
					saveObject="flReportsBackingBean.managedBean.selectedKumpulanPTJ"
					conditionField="#{flReportsBackingBean.constructKumpulanPTJConditionFields()}"
					postUpdateListener="flReportsBackingBean.onChangeJabatan" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.ptj']}"></p:outputLabel></td>
			<td colspan="3"><ac:lov id="lovPpPTJ"
					lovId="PM_ORG_PROFILE_REPORT" readonly="true" size="100"
					headerText="#{lbl['lbl.pp.ptj']}" update="@form"
					disabled="#{flReportsBackingBean.managedBean.selectedKumpulanPTJ==null or flReportsBackingBean.managedBean.disableOrgFields}"
					value="#{flReportsBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}"
					saveObject="flReportsBackingBean.managedBean.selectedPTJ"
					conditionField="#{flReportsBackingBean.constructPTJConditionFields()}" /></td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{crRptBB.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
					<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" />
			</td>
			<td>
				<p:inputText maxlength="30" id="flphycontractId"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{crRptBB.managedBean.physicalContractNo}">
				
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphycontract']}" />
				<p:message id="flphycontractIdMsg" for="flphycontractId" display="icon" />
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="100" id="flphyloaId"
					label="#{lbl['lbl.fl.doc.maintain.physical.loa.no']}"
					value="#{crRptBB.managedBean.physicalLoaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphysst']}" /> 
				<p:message id="flphyloaIdMsg" for="flphyloaId" display="icon" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.search.loa.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20" value="#{crRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}" />
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form"
					value="#{crRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="crRptBB.managedBean.selectedOrgProfile" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.receiving.officer.name']}"
								style="margin-top:5px;width:191px;" />
			</td>
			<td>
				<p:selectOneMenu
					value="#{reportBackingBean.flRecievingOfficer}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{reportBackingBean.rolecodeRecievingOfficerList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.acknowledgeOfficer']}"
					style="margin-top:5px;width:191px;" />
			</td>
			<td>
				<p:selectOneMenu
					value="#{reportBackingBean.flAcknowledgeOfficer}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{reportBackingBean.rolecodeAcknowledgeOfficerList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"/> 
			</td>
			<td>
				<p:inputText value="#{poRptBB.managedBean.purchaseOrderNo}"/>
			</td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.frn.do.no']}"/>
			</td>
			<td>
				<p:inputText value="#{ldRptBB.managedBean.deliveryOrderNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.supplierDeliveryOrderNo']}" />
			</td>
			<td>
				<p:inputText maxlength="30"
					value="#{reportBackingBean.flSupplierDeliveryOrderNo}"
					style="margin-top:5px;width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{reportBackingBean.flGroupOne}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}"
						itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sstScreen']}"
						itemValue="#{lbl['lbl.rpt.sstnospace']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.cntrctno']}"
						itemValue="#{lbl['lbl.rpt.cntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycntrctno']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycntrctno']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.phycloano']}"
						itemValue="#{lbl['lbl.rpt.drpdown.phycloano']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
						itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td colspan="2">
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td> 
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{crRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" />
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{crRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar>
			</td>
		</tr>	
	</table>
</ui:composition>
