<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
	
		<table style="margin-top: 10px; width: 100%;">
			
			<c:if test="#{flReportBB.managedBean.showRptCategory}">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.rpt.rptCategory']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu
						label="#{lbl['lbl.rpt.rptCategory']}" id="reportCategory"
						value="#{flReportBB.managedBean.reportCategory}"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{flReportBB.managedBean.reportCategoryList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{flReportBB.retrieveReportListByCategory(flReportBB.managedBean.reportCategory)}"
							process="@this" partialSubmit="true" update="@all" />
					</p:selectOneMenu>
				</td>
			</tr>
			</c:if>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.rpt.rptName']}"
						id="somReportName"
						value="#{flReportBB.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{flReportBB.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{flReportBB.onChangeReportName()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
		<p:panel id="flRptSearchCriteriaPnl"
			header="#{flReportBB.managedBean.reportTitle}"
			rendered="#{not empty flReportBB.managedBean.reportCode}"
			toggleable="true">
			<!-- Validation Message -->
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			<c:choose>
				
				<!-- Ministry Contract -->
				
				<c:when
					test="#{FlReportConst.fl001ContractRequest == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL001_contractRequest.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl002PurchaseOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL002_purchaseOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl003DeliveryOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL003_deliveryOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl004FullfillmentReceivedNote == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL004_fullfillmentReceivedNote.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl005LateDelivery == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL005_lateDelivery.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl009Invoice == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL009_invoice.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl010PaymentMatch == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL010_paymentMatch.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl011Deduction == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL011_deduction.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl012ContractRequestRejection == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL012_contractRequestRejection.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl013PurchaseOrderCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL013_purchaseOrderCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl014DeliveryOrderCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL014_deliveryOrderCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl015FullfillmentReceivedNoteCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL015_fullfillmentReceivedNoteCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl016InvoiceCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL016_invoiceCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl050StopInstructionInitiatedByPtj == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL050_stopInstructionInitiatedByPtj.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl053StopInstructionInitiatedBySupplier == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL053_stopInstructionInitiatedBySupplier.xhtml"></ui:include>
				</c:when>

				
				<!-- Others -->
				
				<c:when
					test="#{FlReportConst.fl018ContractReq == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL018_contractRequest.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl019PurchaseOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL019_purchaseOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl020DeliveryOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL020_deliveryOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl021FulfilmentReceivedNote == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL021_fulfilmentReceivedNote.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl022LateDelivery == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL022_lateDelivery.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl025Invoice == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL025_invoice.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl026PaymentMatch == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL026_paymentMatch.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl027ContractReqRejection == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL027_contractRequestRejection.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl028PurchaseOrderCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL028_purchaseOrderCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl029DeliveryOrderCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL029_deliveryOrderCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl030FulfilmentReceivedNoteCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL030_fulfilmentReceivedNoteCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl031InvoiceCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL031_invoiceCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl051StopInstByPtj == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL051_stopInstByPtj.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl054StopInstBySupplier == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL054_stopInstBySupplier.xhtml"></ui:include>
				</c:when>
			 	<c:when
					test="#{FlReportConst.fl066Deduction == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL066_deduction.xhtml"></ui:include>
				</c:when>
			<!-- Purchase Order -->
				
				<c:when
					test="#{FlReportConst.fl034PurchaseRequest == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl034_purchaseRequest.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl035PurchaseOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl035_purchaseOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl038PurchaseDelivery == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl038_purchaseDelivery.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl039PurchaseFulRecNote == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl039_purchaseFulRecNote.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl040PurchaseLateDelivery == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl040_purchaseLateDelivery.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl043PurchaseInvPtj == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl043_purchaseInvPtj.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl044PurchasePaymentMatch == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl044_purchasePaymentMatch.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl045PurchaseReqRejection == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl045_purchaseReqRejection.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl046PurchaseOrderCancel == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl046_purchaseOrderCancel.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl047PurchaseDeliOrdCancel == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl047_purchaseDeliOrdCancel.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl048PurchaseFulfiNoteCancel == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl048_purchaseFulfiNoteCancel.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl049PurchaseInvoiceCancel == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl049_purchaseInvoiceCancel.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl052PurchaseStopInstrPtj == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl052_purchaseStopInstrPtj.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl055PurchaseStopInstrSupp == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/po/Fl055_purchaseStopInstrSupp.xhtml"></ui:include>
				</c:when>
				
				<!-- Panel -->
				
				<c:when
					test="#{FlReportConst.fl033Summary == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/pa/Fl033_summary.xhtml"></ui:include>
				</c:when>
				
				<!-- Year End Report -->
				<c:when
					test="#{FlReportConst.fl067YearEndReport == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/yep/Fl067_yearEndReport.xhtml"></ui:include>
				</c:when>
				
				<!-- Year End Report -->
				<c:when
					test="#{FlReportConst.fl067YearEndReport == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/yep/Fl067_yearEndReport.xhtml"></ui:include>
				</c:when>
				
				<!-- 29554 start - transaction fee -->
				<c:when test="#{FlReportConst.fl071ServiceFeeReportBasedOfAccountingOffice == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/tf/Fl071_ServiceFeeReportBasedOfAccountingOffice.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl072AccumulatedServiceFeeReport == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/tf/Fl072_AccumulatedServiceFeeReport.xhtml"></ui:include>
				</c:when>
				<!-- 29554 end - transaction fee -->
				
				<c:otherwise>
        			ERROR!
    
				</c:otherwise>
			</c:choose>
			
			</p:panel>

		<ac:lovPopup />

	</ui:define>
	

</ui:composition>
