<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		
		<p:outputLabel id="reportUrl" value="#{reportBackingBean.managedBean.reportUrl}"></p:outputLabel>
	
		<table style="margin-top: 10px; width: 100%;">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.rpt.rptCategory']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu
						label="#{lbl['lbl.rpt.rptCategory']}" id="reportCategory"
						value="#{flReportBB.managedBean.reportCategory}"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{flReportBB.managedBean.reportCategoryList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{flReportBB.retrieveReportListByCategory(flReportBB.managedBean.reportCategory)}"
							process="@this" partialSubmit="true" update="@all" />
					</p:selectOneMenu>
				</td>
			</tr> 
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.rpt.rptName']}"
						id="somReportName"
						value="#{flReportBB.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{flReportBB.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{flReportBB.onChangeReportName()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
		<p:panel id="flRptSearchCriteriaPnl"
			header="#{flReportBB.managedBean.reportName}"
			rendered="#{not empty flReportBB.managedBean.reportCode}"
			toggleable="true">
			<!-- Validation Message -->
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			<c:choose>
				
				<!-- Ministry Contract -->
				
				<c:when
					test="#{FlReportConst.fl001ContractReq == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL001_contractRequest.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl002PurchaseOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/mc/FL002_purchaseOrder.xhtml"></ui:include>
				</c:when>
				
				<!-- Others -->
				
				<c:when
					test="#{FlReportConst.fl018ContractReq == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL018_contractRequest.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl019PurchaseOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL019_purchaseOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl020DeliveryOrder == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL020_deliveryOrder.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl021FulfilmentReceivedNote == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL021_fulfilmentReceivedNote.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl022LateDelivery == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL022_lateDelivery.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl025Invoice == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL025_invoice.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl026PaymentMatch == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL026_paymentMatch.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl027ContractReqRejection == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL027_contractRequestRejection.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl028PurchaseOrderCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL028_purchaseOrderCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl029DeliveryOrderCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL029_deliveryOrderCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl030FulfilmentReceivedNoteCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL030_fulfilmentReceivedNoteCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl031InvoiceCancellation == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL031_invoiceCancellation.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl051StopInstByPtj == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL051_stopInstByPtj.xhtml"></ui:include>
				</c:when>
				<c:when
					test="#{FlReportConst.fl054StopInstBySupplier == flReportBB.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/fl/cc/FL054_stopInstBySupplier.xhtml"></ui:include>
				</c:when>
				<c:otherwise>
        			ERROR!
    
				</c:otherwise>
			</c:choose>
			
			</p:panel>

		<ac:lovPopup />

	</ui:define>
	

</ui:composition>
