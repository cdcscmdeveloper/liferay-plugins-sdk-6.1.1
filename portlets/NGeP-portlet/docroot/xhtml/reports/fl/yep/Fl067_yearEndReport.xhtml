<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{yepRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" />
			<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131"
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{yepRptBB.disableMinistryLov()}"
							value="#{yepRptBB.managedBean.ministry.orgName}"
							postUpdateListener="yepRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form"
							saveObject="yepRptBB.managedBean.ministry"
							conditionField="#{yepRptBB.getMinistryCondition()}"
							required="true"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{yepRptBB.disablePtjGroupLov()}"
							value="#{yepRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="yepRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="yepRptBB.managedBean.ptjGroup"
							conditionField="#{yepRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{yepRptBB.disablePtjLov()}"
							value="#{yepRptBB.managedBean.ptj.orgName}"
							saveObject="yepRptBB.managedBean.ptj"	
							conditionField="#{yepRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		
		<tr>
					
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.flPurchaseOrderNo']}" rendered="#{!yepRptBB.managedBean.contractFlag}"/>
			</td>
			<td>
				<p:inputText maxlength="35" value="#{yepRptBB.managedBean.purchaseOrderNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.yep.search.title']}"/>
			</td>
			<td>
				<p:inputText maxlength="35"
					value="#{yepRptBB.managedBean.poTitle}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>		
			
			</tr>
		
		<tr>
		<td>
				<p:outputLabel value="#{lbl['lbl.fl.yep.search.doc.type']}"/>
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td>
				<p:selectOneMenu label="#{lbl['lbl.fl.yep.search.doc.type']}" value="#{yepRptBB.managedBean.documentType}" required="true">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.do.poco']}"
						itemValue="PR"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.menu.contract.order']}"
						itemValue="CR"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" process="@this"
						listener="#{yepRptBB.onChangeDocType()}"
						update=":form" />
				</p:selectOneMenu>
			</td>
			
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.purchaseorder.status']}"/>
				<p:outputLabel value="*" styleClass="mandatory"/>
			</td>
			
			<td>
			<div>
			<p:selectOneMenu id="pOStatusId" required="true"
				style="width: 314px;"
				label="#{lbl['lbl.fl.purchaseorder.status']}"
				value="#{yepRptBB.managedBean.purchaseOrderStatus}">
				<f:selectItems value="#{yepRptBB.getStatusDropdownValuesForYEP('FL',yepRptBB.managedBean.documentType)}"/>
				<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>
			</p:selectOneMenu>
			 </div>
			</td>
			
		</tr>
		
		<tr>
		<td>
		</td>
		<td>
		</td>
		<td>
		</td>
		<td>
			<p:selectBooleanCheckbox 
				value="#{yepRptBB.managedBean.checkAP58}" disabled="#{!yepRptBB.managedBean.ap58Flag}">
				<p:ajax event="change" partialSubmit="true" listener="#{yepRptBB.onChangeAp58()}"
				 process="@this" update=":form"></p:ajax>
			</p:selectBooleanCheckbox>
			<p:spacer width="2"/>
			<h:outputText value="#{lbl['lbl.fl.yep.ap58a']}"/>
		</td>
		</tr>
		
		<tr>
		<td>
		</td>
		<td>
		</td>
		<td>
		</td>
		<td>
			<p:selectBooleanCheckbox
				value="#{yepRptBB.managedBean.checkCFwd}" disabled="#{!yepRptBB.managedBean.cfwdFlag}">
				<p:ajax event="change" partialSubmit="true" listener="#{yepRptBB.onChangeCarryFow()}"
				 process="@this" update=":form"></p:ajax>
				</p:selectBooleanCheckbox>
				<p:spacer width="2"/>
				<h:outputText value="#{lbl['lbl.fl.yep.carryFow']}" ></h:outputText>
		</td>
		</tr>
		
		<tr>
		<td>
		</td>
		<td>
		</td>
		<td>
		</td>
		<td>
		<p:selectBooleanCheckbox
		value="#{yepRptBB.managedBean.checkCMP}" disabled="#{!yepRptBB.managedBean.cmpFlag}">
				<p:ajax event="change" partialSubmit="true" listener="#{yepRptBB.onChangeCMPay()}" 
				 process="@this" update=":form"></p:ajax>
				</p:selectBooleanCheckbox>
				<p:spacer width="2"/>
				<h:outputText value="#{lbl['lbl.fl.yep.closedManPay']}"/>		
		</td>			
		</tr>
		
		<tr>
		<td>
		</td>
		<td>
		</td>
		<td>
		</td>
		<td>
		<p:selectBooleanCheckbox
				value="#{yepRptBB.managedBean.checkNAT}" disabled="#{!yepRptBB.managedBean.natFlag}">
				<p:ajax event="change" partialSubmit="true" listener="#{yepRptBB.onChangeNATransaction()}" 
				 process="@this" update=":form"></p:ajax>
				</p:selectBooleanCheckbox>
				<p:spacer width="2"/>
				<h:outputText value="#{lbl['lbl.fl.yep.nonActTrans']}"/>
		</td>	
		</tr>
		
		
			<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{yepRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" /></td>
		
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{yepRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar>
				
				
				</td>
			
			
		</tr>
		
			<tr>	
				
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.yep.business.company.name']}"/>
			</td>
			<td>
				<p:inputText maxlength="35"
					value="#{yepRptBB.managedBean.supplierCompName}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.financial.year']}"/>
			</td>
			<td>
				<p:selectOneMenu id="financialYear"
								value="#{yepRptBB.managedBean.financialYear}"
								style="width: 314px;">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
									itemValue="#{null}"></f:selectItem>
								<f:selectItems
									value="#{yepRptBB.getFinancialYearOpt()}" />
							</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>	
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{yepRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon"/></td>
					
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.circular.no']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{yepRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
			</td>

		</tr>
		
		<tr>
		<td>
				<p:outputLabel value="#{lbl['lbl.fl.contract.no']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
			</td>
			<td>
				<p:inputText maxlength="35"
				    rendered="#{yepRptBB.managedBean.contractFlag}"
				    label="#{lbl['lbl.fl.contract.no']}"
					value="#{yepRptBB.managedBean.contractNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
					
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.yep.file.ref.no']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="refNoId"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					label="#{lbl['lbl.fl.yep.file.ref.no']}"
					value="#{yepRptBB.managedBean.referenceNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
							
		</tr>
		
		<tr>
			<td>
			<p:outputLabel value="#{lbl['lbl.ct.loa.no']}" rendered="#{yepRptBB.managedBean.contractFlag}"/></td>
			<td><p:inputText maxlength="20"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					value="#{yepRptBB.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
				
			<td>
			<p:outputLabel value="#{lbl['lbl.fl.physical.contract.no']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
			</td>

			<td><p:inputText maxlength="30" id="flphycontractId"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					label="#{lbl['lbl.fl.physical.contract.no']}"
					value="#{yepRptBB.managedBean.physicalContractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />

				</p:inputText> 
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforphycontract']}" rendered="#{yepRptBB.managedBean.contractFlag}"/>
				<p:message id="flphycontractIdMsg" for="flphycontractId"
					display="icon" /></td>
		
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.yep.contract.start.date']}" rendered="#{yepRptBB.managedBean.contractFlag}"/></td>
			<td><p:calendar showOn="button" navigator="true"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					display="inline" readonlyInput="true"
					value="#{yepRptBB.managedBean.contractFromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" /></td>
		
			<td><p:outputLabel value="#{lbl['lbl.fl.yep.contract.end.date']}" rendered="#{yepRptBB.managedBean.contractFlag}"/></td>
			<td><p:calendar showOn="button" navigator="true"
					rendered="#{yepRptBB.managedBean.contractFlag}"
					display="inline" readonlyInput="true"
					value="#{yepRptBB.managedBean.contractToDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar></td>
		</tr>
	</table>
	
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{yepRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{yepRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{yepRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{yepRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{yepRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
