<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{purPmRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{purPmRptBB.disableMinistryLov()}"
							value="#{purPmRptBB.managedBean.ministry.orgName}"
							postUpdateListener="purPmRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form"
							saveObject="purPmRptBB.managedBean.ministry"
							conditionField="#{purPmRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{purPmRptBB.disablePtjGroupLov()}"
							value="#{purPmRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="purPmRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="purPmRptBB.managedBean.ptjGroup"
							conditionField="#{purPmRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td>
				<!-- 29550 - Start (add condition to display PTJ label)-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel>
					</c:otherwise>
				</c:choose>
				<!-- 29550 - End -->
			</td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{purPmRptBB.disablePtjLov()}"
							value="#{purPmRptBB.managedBean.ptj.orgName}"
							saveObject="purPmRptBB.managedBean.ptj"	
							conditionField="#{purPmRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
			<!-- 29550 - Start-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.central.contract.panel.name']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" />
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{purPmRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
			<td>
			<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.paymentMatchOfficers']}" style="margin-top:5px;width:191px;" />
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.txt.paymentMatchOfficer']}" style="margin-top:5px;width:191px;" />
					</c:otherwise>
				</c:choose>
			<!-- 29550 - end -->
			</td>
			<td><p:selectOneMenu value="#{purPmRptBB.managedBean.payOfficer}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{purPmRptBB.retrievePayOfficerList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.invoice.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{purPmRptBB.managedBean.invNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
			<td>
			<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.inv.ref']}"></p:outputLabel> 
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.supp.invoice.no']}"></p:outputLabel> 
					</c:otherwise>
				</c:choose>
			<!-- 29550 - end -->
			</td>
			<td><p:inputText value="#{purPmRptBB.managedBean.supplierInvNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
		</tr>
		<tr>
			<td>
			<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:outputLabel value="#{lbl['lbl.rpt.paymentAdviceNo']}"></p:outputLabel> 
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.payment.match.no']}"></p:outputLabel> 
					</c:otherwise>
				</c:choose>
			<!-- 29550 - end -->	
			</td>
			<td><p:inputText value="#{purPmRptBB.managedBean.paymentMatchNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
			<td><p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{purPmRptBB.managedBean.purchaseOrderNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{purPmRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			<td><p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
			<td><p:selectOneMenu id="statusId"
								value="#{purPmRptBB.managedBean.statusDescId}"
								style="width: 314px;">
								<f:selectItems
									value="#{purPmRptBB.getStatusDropDownValues('PA')}" />
								<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>	
							</p:selectOneMenu></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}" /></td>
			<!-- 29550 - start(to cater option displayed by factoring user & supplier)-->
			<td><p:selectOneMenu value="#{purPmRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}" itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" itemDisabled="#{purPmRptBB.hasSupplierRole()}"
								itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>	
					<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.doc.status']}"
						itemValue="#{lbl['lbl.fl.doc.maintain.doc.status']}"></f:selectItem>
					<c:choose>
						<c:when test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
							<f:selectItem itemLabel="#{lbl['lbl.fl.paymentMatchOfficers']}" 
								itemValue="#{lbl['lbl.fl.paymentMatchOfficers']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.central.contract.panel.name']}"
								itemValue="#{lbl['lbl.fl.central.contract.panel.name']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.invoice.no']}"
								itemValue="#{lbl['lbl.fl.invoice.no']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.inv.ref']}"
								itemValue="#{lbl['lbl.fl.doc.maintain.inv.ref']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.paymentAdviceNo']}"
								itemValue="#{lbl['lbl.rpt.paymentAdviceNo']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
								itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.physical.treasury.circular']}"
								itemValue="#{lbl['lbl.fl.physical.treasury.circular']}"></f:selectItem>
						</c:when>
						<c:otherwise>
							<f:selectItem itemLabel="#{lbl['lbl.txt.paymentMatchOfficer']}" 
								itemValue="#{lbl['lbl.txt.paymentMatchOfficer']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
								itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
						</c:otherwise>
					</c:choose>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			
			<c:if test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">	
				<td><p:outputLabel value="#{lbl['lbl.fl.supp.name']}"/></td>
				<td>
					<ac:lov id="flSupplierName" readonly="true"
						lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!purPmRptBB.managedBean.supplier}"
						headerText="#{lbl['lbl.fl.supp.name']}" update="@form"
						value="#{purPmRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
						saveObject="purPmRptBB.managedBean.selectedOrgProfile" />
					<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{purPmRptBB.managedBean.supplier}"
						value="#{purPmRptBB.managedBean.supplierCompName}">
					</p:inputText>
				</td>
			</c:if>
			<!-- 29550 - end -->
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{purPmRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:ajax event="dateSelect"
							listener="#{purPmRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{purPmRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole() or flReportBB.hasSupplierRole()}">
						<p:ajax event="dateSelect"
							listener="#{purPmRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar></td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{purPmRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{purPmRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{purPmRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{purPmRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{purPmRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
