<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{itemThRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ministry']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
						headerText="#{lbl['lbl.fl.ministry']}" 
						disabled="#{itemThRptBB.disableMinistryLov()}"
						value="#{itemThRptBB.managedBean.ministry.orgName}"
						postUpdateListener="itemThRptBB.resetPtjGroupProfile()"
						update=":form:searchPtj,:form"
						saveObject="itemThRptBB.managedBean.ministry"
						conditionField="#{itemThRptBB.getMinistryCondition()}"
						>
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.jabatan']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
					headerText="#{lbl['lbl.fl.jabatan']}" 
					disabled="#{itemThRptBB.disablePtjGroupLov()}"
					value="#{itemThRptBB.managedBean.ptjGroup.orgName}"
					postUpdateListener="poPurRptBB.resetPtjProfile()"
					update=":form:searchPtj,:form"
					saveObject="itemThRptBB.managedBean.ptjGroup"
					conditionField="#{itemThRptBB.constuctConditionFieldsForPTJGroup()}"
					>
				</ac:lov>
			</td>

		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
					headerText="#{lbl['lbl.fl.ptj']}"
					disabled="#{itemThRptBB.disablePtjLov()}"
					value="#{itemThRptBB.managedBean.ptj.orgName}"
					saveObject="itemThRptBB.managedBean.ptj"	
					conditionField="#{itemThRptBB.getPTJCondition()}"
					update=":form"
					>			
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}" />
			</td>
			<td>
				<p:inputText value="#{itemThRptBB.managedBean.purchaseOrderNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText> 
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{itemThRptBB.managedBean.statusDescId}" >
					<f:selectItems value="#{itemThRptBB.getStatusDropdownValuesForItemThreshold('PO')}" />
					<f:selectItem itemLabel="#{lbl['lbl.txt.all']}" itemValue="0" />
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{itemThRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}" itemValue="#{null}" />
					<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.doc.status']}" itemValue="#{lbl['lbl.fl.doc.maintain.doc.status']}" />
					<f:selectItem itemLabel="#{lbl['lbl.fl.fulfilment.type']}" itemValue="#{lbl['lbl.fl.fulfilment.type']}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.procurement.type']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{itemThRptBB.managedBean.procurementTypeCode}">
                    <f:selectItems value="#{itemThRptBB.getDropdownValuesProcurementType()}" />
                    <f:selectItem itemLabel="#{lbl['lbl.txt.all']}" itemValue="0" />

                    <p:ajax event="change"
                            process="@this"
                            listener="#{itemThRptBB.onProcurementTypeChange}"
                            update=":form:reasonLabelPanel, :form:reasonValuePanel" />
                </p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.financial.year']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{itemThRptBB.managedBean.financialYear}" style="width: 100px;">
					<f:selectItems value="#{itemThRptBB.getFinancialYearOpt()}" />
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<ac:iconTooltip value="#{lbl['lbl.fl.tooltips.financial.year']}"/>
			</td>
			<td>
				<h:panelGroup id="reasonLabelPanel">
                    <p:outputLabel rendered="#{itemThRptBB.managedBean.reasonFlag}"
                                   value="#{lbl['lbl.fl.si.reason']}" />
                </h:panelGroup>
			</td>
			<td>
				<h:panelGroup id="reasonValuePanel">
                    <p:selectOneMenu style="margin-bottom: 5px; width: 225px;"
							    	 panelStyle="overflow-y: scroll; width:400px; height:100px;" 
							    	 rendered="#{itemThRptBB.managedBean.reasonFlag}"
                                     value="#{itemThRptBB.managedBean.reasonCode}">
                        <f:selectItems value="#{itemThRptBB.managedBean.reasonDropdown}" />
                    </p:selectOneMenu>
				</h:panelGroup>
			</td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{itemThRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{itemThRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{itemThRptBB.resetAction()}">
		</p:commandButton>
	</div>
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{itemThRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{itemThRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
</ui:composition>
