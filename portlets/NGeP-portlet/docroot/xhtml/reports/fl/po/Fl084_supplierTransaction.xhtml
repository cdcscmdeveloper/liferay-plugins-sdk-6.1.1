<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{poSuppTransRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ministry']}" />
			</td>
			<td colspan="3">
				<ac:lov id="searchMinistry"
					lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ministry']}"
					disabled="#{poSuppTransRptBB.disableMinistryLov()}"
					value="#{poSuppTransRptBB.managedBean.ministry.orgName}"
					postUpdateListener="poSuppTransRptBB.resetPtjGroupProfile()"
					update=":form:searchPtj,:form"
					saveObject="poSuppTransRptBB.managedBean.ministry"
					conditionField="#{poSuppTransRptBB.getMinistryCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchJabatan"
					lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.jabatan']}"
					disabled="#{poSuppTransRptBB.disablePtjGroupLovByReportCode()}"
					value="#{poSuppTransRptBB.managedBean.ptjGroup.orgName}"
					postUpdateListener="poSuppTransRptBB.resetPtjProfile()"
					update=":form"
					saveObject="poSuppTransRptBB.managedBean.ptjGroup"
					conditionField="#{poSuppTransRptBB.constuctConditionFieldsForPTJGroup()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
			</td>
			<td colspan="3">
				<ac:lov id="searchPtj"
					lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true"
					headerText="#{lbl['lbl.fl.ptj']}"
					disabled="#{poSuppTransRptBB.disablePtjLovByReportCode()}"
					value="#{poSuppTransRptBB.managedBean.ptj.orgName}"
					update=":form"
					saveObject="poSuppTransRptBB.managedBean.ptj"
					conditionField="#{poSuppTransRptBB.getPTJCondition()}">
				</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{poSuppTransRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.central.contract.panel.name']}" />
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.central.contract.panel.name']}"
					value="#{poSuppTransRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}" />
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" 
					rendered="#{!poSuppTransRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" 
					update=":form:supplierBusRegNo,:form:suppliermofNo,:form:supplierepNo,:form"
					value="#{poSuppTransRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					postUpdateListener="poSuppTransRptBB.autopopSuppData()"
					saveObject="poSuppTransRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{poSuppTransRptBB.managedBean.supplier}"
					value="#{poSuppTransRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
			<td>
				<p:inputText maxlength="20" disabled="true" rendered="#{poSuppTransRptBB.managedBean.supplier}"
					value="#{poSuppTransRptBB.managedBean.businessRegNo}">
				</p:inputText>
				<p:inputText id="supplierBusRegNo" maxlength="20" disabled="true" 
					rendered="#{!poSuppTransRptBB.managedBean.supplier}" value="#{poSuppTransRptBB.managedBean.businessRegNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforbusinessregno']}"/> 
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.mofNo']}" />
			</td>
			<td>
				<p:inputText maxlength="20" disabled="true" rendered="#{poSuppTransRptBB.managedBean.supplier}"
					value="#{poSuppTransRptBB.managedBean.mofNo}">
				</p:inputText>
				<p:inputText id="suppliermofNo" maxlength="20" disabled="true" 
					rendered="#{!poSuppTransRptBB.managedBean.supplier}" value="#{poSuppTransRptBB.managedBean.mofNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipformofno']}"/> 
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.epNo']}" />
			</td>
			<td>
				<p:inputText maxlength="20" disabled="true" rendered="#{poSuppTransRptBB.managedBean.supplier}"
					value="#{poSuppTransRptBB.managedBean.epNo}">
				</p:inputText>
				<p:inputText id="supplierepNo" maxlength="20" disabled="true" 
					rendered="#{!poSuppTransRptBB.managedBean.supplier}" value="#{poSuppTransRptBB.managedBean.epNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
				<ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforepno']}"/> 
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.financial.year']}" />
			</td>
			<td>
				<p:selectOneMenu id="searchFinancialYear" style="width: 100px;"
					value="#{poSuppTransRptBB.managedBean.financialYear}">
					<f:selectItems value="#{poSuppTransRptBB.getFinancialYearOpt()}" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.purchaseorder.status']}"/>
			</td>
			<td>
				<p:selectOneMenu id="poStatus" 
				label="#{lbl['lbl.fl.purchaseorder.status']}"
				value="#{poSuppTransRptBB.managedBean.purchaseOrderStatus}">
					<f:selectItems value="#{poSuppTransRptBB.getPOStatusDropdownValues('FL',flReportBB.managedBean.reportCategory)}" />
					<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.rpt.group']}" />
			</td>
			<td>
				<p:selectOneMenu value="#{poSuppTransRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.physical.treasury.circular']}"
						itemValue="#{lbl['lbl.fl.physical.treasury.circular']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.central.contract.panel.name']}"
						itemValue="#{lbl['lbl.fl.central.contract.panel.name']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" 
						itemDisabled="#{mcCrGenAsPoRptBB.hasSupplierRole()}"
      					itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
      				<f:selectItem itemLabel="#{lbl['lbl.rpt.business.registrationNo']}"
						itemValue="#{lbl['lbl.rpt.business.registrationNo']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.mofNo']}"
						itemValue="#{lbl['lbl.rpt.mofNo']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.epNo']}"
						itemValue="#{lbl['lbl.rpt.epNo']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.financial.year']}"
						itemValue="#{lbl['lbl.fl.financial.year']}"></f:selectItem>	
					<f:selectItem itemLabel="#{lbl['lbl.fl.purchaseorder.status']}"
						itemValue="#{lbl['lbl.fl.purchaseorder.status']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
						itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNoValue']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}" />
			</td>
			<td>
				<p:inputText maxlength="20"
					value="#{poSuppTransRptBB.managedBean.purchaseOrderNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poSuppTransRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<p:ajax event="dateSelect"
							listener="#{poSuppTransRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" />
			</td>
			<td>
				<p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poSuppTransRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<p:ajax event="dateSelect"
							listener="#{poSuppTransRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
				</p:calendar>
			</td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{poSuppTransRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{poSuppTransRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{poSuppTransRptBB.resetAction()}">
		</p:commandButton>
	</div>
	<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
		width="500px" resizable="false" styleClass="pop_up_top">
		<h:outputText escape="false" style="float:left;margin-left:5px;"
			value="#{poSuppTransRptBB.managedBean.popUpMsg}">
		</h:outputText>
		<br />
		<div style="float:right;">
			<table style="width:100%">
				<tr>
					<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
							onclick="confirmationId.hide();" />
						<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
							action="#{poSuppTransRptBB.redirect()}">
						</p:commandButton></td>
				</tr>
			</table>
		</div>
	</p:dialog>
</ui:composition>
