<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{poPurRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{poPurRptBB.disableMinistryLov()}"
							value="#{poPurRptBB.managedBean.ministry.orgName}"
							postUpdateListener="poPurRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form,:form:flSupplierName,:form:supplierCompName"
							saveObject="poPurRptBB.managedBean.ministry"
							conditionField="#{poPurRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{poPurRptBB.disablePtjGroupLov()}"
							value="#{poPurRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="poPurRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="poPurRptBB.managedBean.ptjGroup"
							conditionField="#{poPurRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td>
			<!-- 29550 - Start (add condition to display PTJ label)-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel>
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{poPurRptBB.disablePtjLov()}"
							value="#{poPurRptBB.managedBean.ptj.orgName}"
							saveObject="poPurRptBB.managedBean.ptj"	
							conditionField="#{poPurRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
			<!-- 29550 - Start-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.central.contract.panel.name']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" />
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{poPurRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}"/>
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!poPurRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form" 
					value="#{poPurRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="poPurRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{poPurRptBB.managedBean.supplier}"
					value="#{poPurRptBB.managedBean.supplierCompName}">
				</p:inputText>
				
			</td>			
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.approver.name']}"/>
			</td>
			<td><p:selectOneMenu value="#{poPurRptBB.managedBean.approver}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{poPurRptBB.retrieveApproverList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<td><p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{poPurRptBB.managedBean.purchaseOrderNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
		</tr>
		
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{poPurRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			<td><p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
			<td><p:selectOneMenu id="statusId"
								value="#{poPurRptBB.managedBean.statusDescId}"
								style="width: 314px;">
								<!-- 29550 - start  -->
								<c:choose>
									<c:when test="#{flReportBB.hasFactoringUserRole()}">
										<f:selectItems value="#{poPurRptBB.getStatusDropDownValues('PO')}" />
									</c:when>
									<c:otherwise>
										<f:selectItems value="#{poPurRptBB.getStatusDropDownValues('CO')}" />
									</c:otherwise>
								</c:choose>
								<!-- 29550 - end -->
								<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>	
							</p:selectOneMenu></td>
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}" /></td>
			<td><p:selectOneMenu value="#{poPurRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" itemDisabled="#{poPurRptBB.hasSupplierRole()}"
						itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<!-- 29550 - start(to cater option displayed by factoring user)-->
					<c:choose>
						<c:when test="#{flReportBB.hasFactoringUserRole()}">
							<f:selectItem itemLabel="#{lbl['lbl.fl.central.contract.panel.name']}"
								itemValue="#{lbl['lbl.fl.central.contract.panel.name']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.approverName']}"
								itemValue="#{lbl['lbl.rpt.approverName']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
								itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.physical.treasury.circular']}"
								itemValue="#{lbl['lbl.fl.physical.treasury.circular']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.doc.status']}"
								itemValue="#{lbl['lbl.fl.doc.maintain.doc.status']}"></f:selectItem>
						</c:when>
						<c:otherwise>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.itemType']}"
								itemValue="#{lbl['lbl.rpt.itmtype']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.procurementtypeScreen']}"
								itemValue="#{lbl['lbl.rpt.prcmnttype']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.status']}"
								itemValue="#{lbl['lbl.rpt.sts']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
								itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
								
							<ui:remove>#27476 start</ui:remove>
							<f:selectItem itemLabel="#{lbl['lbl.fl.procurement.type']}"
								itemValue="#{lbl['lbl.rpt.prcmnttype']}"></f:selectItem>
							<ui:remove>#27476 end</ui:remove>
							
						</c:otherwise>
					</c:choose>
					<!-- 29550 - end -->
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
				
			<ui:remove>#27476 start</ui:remove>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.fl.procurement.type']}" /></td>
			<td width="35%"><p:selectOneMenu
					value="#{poPurRptBB.managedBean.procumentType}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.all']}" itemValue="#{null}" />
					<f:selectItems
						value="#{poPurRptBB.getRadioButtonCodeValues(ParameterTypeConst.procurementTypeTemp)}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<ui:remove>#27476 end</ui:remove>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poPurRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{poPurRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{poPurRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{poPurRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar></td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{poPurRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{poPurRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{poPurRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{poPurRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{poPurRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
