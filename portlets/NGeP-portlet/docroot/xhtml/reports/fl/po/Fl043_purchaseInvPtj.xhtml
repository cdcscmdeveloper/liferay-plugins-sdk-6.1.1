<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{purInvRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{purInvRptBB.disableMinistryLov()}"
							value="#{purInvRptBB.managedBean.ministry.orgName}"
							postUpdateListener="purInvRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form,:form:flSupplierName,:form:supplierCompName"
							saveObject="purInvRptBB.managedBean.ministry"
							conditionField="#{purInvRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{purInvRptBB.disablePtjGroupLov()}"
							value="#{purInvRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="purInvRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="purInvRptBB.managedBean.ptjGroup"
							conditionField="#{purInvRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td>
			<!-- 29550 - Start (add condition to display PTJ label)-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.ptj']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel>
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{purInvRptBB.disablePtjLov()}"
							value="#{purInvRptBB.managedBean.ptj.orgName}"
							saveObject="purInvRptBB.managedBean.ptj"	
							conditionField="#{purInvRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
			<!-- 29550 - Start-->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.central.contract.panel.name']}"></p:outputLabel>
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" />
					</c:otherwise>
				</c:choose>
			<!-- 29550 - End -->
			</td>
			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{purInvRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.supp.name']}"/>
			</td>
			<td>
				<ac:lov id="flSupplierName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" size="44" rendered="#{!purInvRptBB.managedBean.supplier}"
					headerText="#{lbl['lbl.fl.supp.name']}" update="@form" 
					value="#{purInvRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="purInvRptBB.managedBean.selectedOrgProfile" />
				<p:inputText size="51" disabled="true" id="supplierCompName" rendered="#{purInvRptBB.managedBean.supplier}"
					value="#{purInvRptBB.managedBean.supplierCompName}">
				</p:inputText>
			</td>
		</tr>
		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.invoice.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{purInvRptBB.managedBean.invNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
			<td>
			<!-- 29550 - start -->
				<c:choose>
					<c:when test="#{flReportBB.hasFactoringUserRole()}">
						<p:outputLabel value="#{lbl['lbl.fl.doc.maintain.inv.ref']}"></p:outputLabel> 
					</c:when>
					<c:otherwise>
						<p:outputLabel value="#{lbl['lbl.fl.supp.invoice.no']}"></p:outputLabel> 
					</c:otherwise>
				</c:choose>
			<!-- 29550 - end -->
			</td>
			<td><p:inputText value="#{purInvRptBB.managedBean.supplierInvNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.do.poco.no']}"></p:outputLabel> </td>
			<td><p:inputText value="#{purInvRptBB.managedBean.purchaseOrderNo}">
			<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" /></p:inputText> </td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{purInvRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
			
		</tr>
		
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.fl.doc.maintain.doc.status']}" /></td>
			<td><p:selectOneMenu id="statusId"
								value="#{purInvRptBB.managedBean.statusDescId}"
								style="width: 314px;">
								<f:selectItems
									value="#{purInvRptBB.getStatusDropDownValues('IN')}" />
								<f:selectItem itemLabel="#{lbl['lbl.bpm.all']}" itemValue="0"></f:selectItem>	
							</p:selectOneMenu></td>
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}" /></td>
			<!-- 29550 - start(to cater option displayed by factoring user)-->
			<td><p:selectOneMenu value="#{purInvRptBB.managedBean.group}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<c:choose>
						<c:when test="#{flReportBB.hasFactoringUserRole()}">
							<f:selectItem itemLabel="#{lbl['lbl.fl.central.contract.panel.name']}"
								itemValue="#{lbl['lbl.fl.central.contract.panel.name']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" itemDisabled="#{purInvRptBB.hasSupplierRole()}"
								itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.invoice.no']}"
								itemValue="#{lbl['lbl.fl.invoice.no']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.inv.ref']}"
								itemValue="#{lbl['lbl.fl.doc.maintain.inv.ref']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"
								itemValue="#{lbl['lbl.rpt.drpdown.GovernmentPurchaseOrderNo']}"></f:selectItem>
							<f:selectItem itemLabel="#{lbl['lbl.fl.physical.treasury.circular']}"
								itemValue="#{lbl['lbl.fl.physical.treasury.circular']}"></f:selectItem>
						</c:when>
						<c:otherwise>
							<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.treasurycrclr']}"
								itemValue="#{lbl['lbl.rpt.drpdown.treasurycrclrvalue']}"></f:selectItem>
						</c:otherwise>
					</c:choose>
					<f:selectItem itemLabel="#{lbl['lbl.fl.doc.maintain.doc.status']}"
						itemValue="#{lbl['lbl.fl.doc.maintain.doc.status']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<!-- 29550 - end -->
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{purInvRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{purInvRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{purInvRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
					<!-- 29550 - start -->	
					<c:if test="#{flReportBB.hasFactoringUserRole()}">
						<p:ajax event="dateSelect"
							listener="#{purInvRptBB.onChangeFromToDate}"
							update="@form"></p:ajax>
					</c:if>
					<!-- 29550 - end -->
				</p:calendar></td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{purInvRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{purInvRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{purInvRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{purInvRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{purInvRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
