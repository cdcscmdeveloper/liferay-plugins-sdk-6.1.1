<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td colspan="4">
				<h:outputText value="#{prRejectRptBB.managedBean.reportUrl}" /><br/><br/>
			</td>
		</tr>		
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ministry']}" /></td>
			<td colspan="3">
					<ac:lov id="searchMinistry" lovId="PM_ORG_PROFILE_MINSTRY" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ministry']}" 
							disabled="#{prRejectRptBB.disableMinistryLov()}"
							value="#{prRejectRptBB.managedBean.ministry.orgName}"
							postUpdateListener="prRejectRptBB.resetPtjGroupProfile()"
							update=":form:searchPtj,:form"
							saveObject="prRejectRptBB.managedBean.ministry"
							conditionField="#{prRejectRptBB.getMinistryCondition()}"
							>
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.jabatan']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchJabatan" lovId="PM_ORG_PROFILE_PTJ_GROUP" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.jabatan']}" 
							disabled="#{prRejectRptBB.disablePtjGroupLov()}"
							value="#{prRejectRptBB.managedBean.ptjGroup.orgName}"
							postUpdateListener="prRejectRptBB.resetPtjProfile()"
							update=":form:searchPtj,:form"
							saveObject="prRejectRptBB.managedBean.ptjGroup"
							conditionField="#{prRejectRptBB.constuctConditionFieldsForPTJGroup()}"
							>
						</ac:lov>
			</td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.ptj.name']}"></p:outputLabel></td>
			<td colspan="3">
					<ac:lov id="searchPtj" lovId="PM_ORG_PROFILE_PTJ" size="131" readonly="true" 
							headerText="#{lbl['lbl.fl.ptj']}"
							disabled="#{prRejectRptBB.disablePtjLov()}"
							value="#{prRejectRptBB.managedBean.ptj.orgName}"
							saveObject="prRejectRptBB.managedBean.ptj"	
							conditionField="#{prRejectRptBB.getPTJCondition()}"
							update=":form"
							>			
						</ac:lov>
			</td>
		</tr>
		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.sistem.panel.name']}" />
			</td>

			<td><p:inputText maxlength="30" id="panelNameId"
					label="#{lbl['lbl.fl.sistem.panel.name']}"
					value="#{prRejectRptBB.managedBean.panelName}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
				<p:message id="panelNameMsg" for="panelNameId"
					display="icon" /></td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.do.requisitioner']}"/>
			</td>
			<td>
				<p:selectOneMenu value="#{prRejectRptBB.managedBean.requisitioner}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{prRejectRptBB.retrieveRequisitionerList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>

		</tr>

		<tr>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.approver.name']}"/>
			</td>
			<td><p:selectOneMenu value="#{prRejectRptBB.managedBean.approver}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{prRejectRptBB.retrieveApproverList()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<td>
				<p:outputLabel value="#{lbl['lbl.fl.physical.treasury.circular']}"/>
			</td>
			<td>
			<p:inputText maxlength="20" id="pkpNoId"
					label="#{lbl['lbl.fl.physical.treasury.circular']}"
					value="#{prRejectRptBB.managedBean.pkpNo}"
					style="margin-top:5px;width:268px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText><ac:iconTooltip value="#{lbl['lbl.rpt.tooltipforcc']}"/>
			</td>
		</tr>
		
		<tr>
			
			<td><p:outputLabel value="#{lbl['lbl.fl.purchase.request.no']}" /></td>
			<td><p:inputText maxlength="35"
					value="#{prRejectRptBB.managedBean.purchaseRequestNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
			
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}" /></td>
			<td><p:selectOneMenu value="#{reportBackingBean.flGroupOne}">

					<f:selectItem itemLabel="#{lbl['lbl.rpt.nonelabel']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.supplierName']}" itemDisabled="#{prRejectRptBB.hasSupplierRole()}"
						itemValue="#{lbl['lbl.rpt.supplerNm']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.approver.name']}"
						itemValue="#{lbl['lbl.fl.approver.name']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.fl.do.requisitioner']}"
						itemValue="#{lbl['lbl.fl.do.requisitioner']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pkpNoScreen']}"
						itemValue="#{lbl['lbl.rpt.pkpnumber']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.from']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{prRejectRptBB.managedBean.fromDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.fl.created.date.to']}" /></td>
			<td colspan="2"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{prRejectRptBB.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					partialSubmit="true" process="@form">
				</p:calendar></td>
		</tr>
	</table>
	<div style="text-align: right;">
		<p:commandButton id="generateBtnId" value="#{lbl['lbl.btn.generate']}"
			process="@form" update="@form"
			action="#{prRejectRptBB.generateReport()}">
			<f:setPropertyActionListener target="#{prRejectRptBB.managedBean.reportCode}" value="#{flReportBB.managedBean.reportCode}" />
		</p:commandButton>
		<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
			process="@this" update="@form" action="#{prRejectRptBB.resetAction()}">
		</p:commandButton>
	</div>
		<p:dialog id="confirmationId" widgetVar="confirmationId" modal="true"
			width="500px" resizable="false" styleClass="pop_up_top">
			<h:outputText escape="false" style="float:left;margin-left:5px;"
				value="#{prRejectRptBB.managedBean.popUpMsg}">
			</h:outputText>
			<br />
			<div style="float:right;">
				<table style="width:100%">
					<tr>
						<td><p:commandButton value="#{lbl['lbl.rpt.btn.generate']}"
								onclick="confirmationId.hide();" />
							<p:commandButton value="#{lbl['lbl.rpt.btn.viewreport']}"
								action="#{prRejectRptBB.redirect()}">
							</p:commandButton></td>
					</tr>
				</table>
			</div>
		</p:dialog>
</ui:composition>
