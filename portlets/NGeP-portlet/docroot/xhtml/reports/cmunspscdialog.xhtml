<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<c:if
		test="#{cmReportBackingBean.managedBean.rptGenBean.cmUnspscCodeView}">
		<c:if
			test="#{cmReportBackingBean.managedBean.rptGenBean.cmUnspscTitleView}">

			<p:remoteCommand name="updateCmunspsc" update="@form"
				action="#{reportBackingBean.populateToSaveLOV}" />

			<p:dialog id="lovPopupUnspsc" widgetVar="lovPopupUnspsc" modal="true"
				width="700" position="top">
				<p:ajax event="close" listener="#{reportBackingBean.resetLOV}"
					update="lovPopupUnspsc" />
				<f:facet name="header">
					<h:panelGroup id="lovTitle">#{lbl['lbl.rpt.select.unspsccode']}</h:panelGroup>
				</f:facet>

				<p:panel header="#{lbl['lbl.btn.search']}" toggleable="true">
					<h:panelGroup id="searchPanel" style="width:100%;">
						<h:panelGrid columns="3" id="lovCriteria" cellpadding="0"
							cellspacing="0">

							<p:selectOneMenu
								value="#{reportBackingBean.managedBean.searchFieldValue[0]}">
								<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
								<f:selectItems
									value="#{reportBackingBean.managedBean.searchField}" />
							</p:selectOneMenu>
							<p:inputText
								value="#{reportBackingBean.managedBean.searchValue[0]}"
								style="margin-top:0%;" />

						</h:panelGrid>

						<table style="width: 100%;">
							<tr>
								<td style="text-align: right;"><p:commandButton
										 value="#{lbl['lbl.btn.search']}"
										 action="#{reportBackingBean.searchLOV}" update="lovTb2">
									</p:commandButton> <p:commandButton 
										value="#{lbl['lbl.btn.reset']}"
										action="#{reportBackingBean.resetLOV}"
										update="searchPanel,resultPanel">
									</p:commandButton></td>
							</tr>
						</table>
					</h:panelGroup>
				</p:panel>

				<p:panel header="#{lbl['lbl.rpt.search.result']}" toggleable="true">
					<h:panelGroup id="resultPanel" style="width:100%;">

						<p:dataTable id="lovTb2" var="unspscCode"
							selection="#{reportBackingBean.managedBean.selectedLOV}"
							rowIndexVar="rowIndex" rows="10" lazy="true"
							value="#{reportBackingBean.searchUnspscPagingDataModel}">
							<ac:paginator for="lovTb2" />

							<p:column selectionMode="single" style="width:2%" />

							<p:column headerText="#{lbl['lbl.rpt.unspscCode']}">
								<h:outputText value="#{unspscCode.unspscCode}" />
							</p:column>

							<p:column headerText="#{lbl['lbl.rpt.unspscTitle']}">
								<h:outputText value="#{unspscCode.unspscTitle}" />
							</p:column>

						</p:dataTable>

					</h:panelGroup>

					<table style="width: 100%;">
						<tr>
							<td style="text-align: right;"><p:commandButton id="slbtn"
									value="#{lbl['lbl.btn.select']}"
									update="searchPanel,resultPanel"
									oncomplete="updateCmunspsc();lovPopupUnspsc.hide();" />
									<p:commandButton 
									value="#{lbl['lbl.btn.cancel']}"
									action="#{reportBackingBean.resetLOV}"
									oncomplete="lovPopupUnspsc.hide();"
									update="searchPanel,resultPanel">
								</p:commandButton>
									
							</td>
						</tr>
					</table>
				</p:panel>
			</p:dialog>
		</c:if>
	</c:if>
</ui:composition>
