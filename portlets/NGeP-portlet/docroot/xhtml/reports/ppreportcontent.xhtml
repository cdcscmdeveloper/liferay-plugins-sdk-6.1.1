<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div class="columnPpTableClass">
		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:panelGrid id="ppReportCriteria" columns="4"
						style="width:85%;">
						<c:if
							test="#{ppReportBackingBean.managedBean.rptGenBean.commonLOVBasedRoles}">
							<c:if
								test="#{ppReportBackingBean.managedBean.rptGenBean.ppNonMandatoryView}">
								<c:if
									test="#{ppReportBackingBean.managedBean.rptGenBean.ppMinistryView}">
									<p:column>
										<table style="width: 100%;">
											<tr style="width: 100%;">
												<td style="width:34.4%;"><p:outputLabel value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel>
												</td>
											</tr>
										</table>
									</p:column>
									<p:column>
										<table style="width: 100%;">
											<tr style="width: 100%;">
												<td><ac:lov id="lovMinistry"
														lovId="PM_ORG_PROFILE_REPORT" size="38" update="@form"
														headerText="#{lbl['lbl.rpt.ministry']}"
														value="#{reportBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
														saveObject="reportBackingBean.managedBean.selectedMinistry"
														conditionField="#{reportBackingBean.constructMinistryConditionFields()}"
														postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
												<td><p:message id="lovMinistryMsg" for="lovMinistry"
														display="icon" /></td>
											</tr>
										</table>
									</p:column>
								</c:if>
							</c:if>
							<c:if
								test="#{ppReportBackingBean.managedBean.rptGenBean.ppMandatoryView}">
								<c:if
									test="#{ppReportBackingBean.managedBean.rptGenBean.ppMinistryView}">
									<p:column>
										<table style="width: 100%;">
											<tr style="width: 100%;">
												<td style="width:33%;"><p:outputLabel value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel>
													<p:outputLabel value="*" styleClass="mandatory" /></td>
											</tr>
										</table>
									</p:column>
									<p:column>
										<table style="width: 100%;">
											<tr style="width: 100%;">
												<td><ac:lov id="lovMinistry"
														lovId="PM_ORG_PROFILE_REPORT" size="38" update="@form"
														headerText="#{lbl['lbl.rpt.ministry']}"
														value="#{reportBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
														saveObject="reportBackingBean.managedBean.selectedMinistry"
														conditionField="#{reportBackingBean.constructMinistryConditionFields()}"
														postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
												<td><p:message id="lovMinistryMsg" for="lovMinistry"
														display="icon" /></td>
											</tr>
										</table>
									</p:column>
								</c:if>
							</c:if>
							<c:if
								test="#{ppReportBackingBean.managedBean.rptGenBean.ppPegaWaiPengawalView}">
								<p:column>
									<table style="width: 100%;">
										<tr style="width: 100%;">
											<td style="width:79%;"><p:outputLabel
													value="#{lbl['lbl.rpt.pegawaipengawal']}"></p:outputLabel></td>
										</tr>
									</table>
								</p:column>
								<p:column>
									<table style="width: 100%;">
										<tr style="width: 100%;">
											<td><ac:lov id="lovPegaWaiPengawal"
													lovId="PM_ORG_PROFILE_REPORT" size="38" update="@form"
													headerText="#{lbl['lbl.rpt.pegawaipengawal']}"
													value="#{reportBackingBean.managedBean.selectedPegwaiPengawal.pmOrgValidity.orgName}"
													saveObject="reportBackingBean.managedBean.selectedPegwaiPengawal"
													conditionField="#{reportBackingBean.constructPegwaiPengawalConditionFields()}"
													postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
											<td><p:message id="lovPegaWaiPengawalMsg"
													for="lovPegaWaiPengawal" display="icon" /></td>
										</tr>
									</table>
								</p:column>
							</c:if>
							<c:if
								test="#{ppReportBackingBean.managedBean.rptGenBean.ppKumpulanPTJView}">
								<p:column>
									<table style="width: 100%;">
										<tr style="width: 100%;">
											<td><p:outputLabel
													value="#{lbl['lbl.rpt.kumpulan.ptj']}"></p:outputLabel></td>
										</tr>
									</table>
								</p:column>
								<p:column>
									<table style="width: 100%;">
										<tr style="width: 100%;">
											<td><ac:lov id="lovKumpulanPTJ"
													lovId="PM_ORG_PROFILE_REPORT" size="38" update="@form"
													headerText="#{lbl['lbl.rpt.kumpulan.ptj']}"
													value="#{reportBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
													saveObject="reportBackingBean.managedBean.selectedKumpulanPTJ"
													conditionField="#{reportBackingBean.constructKumpulanPTJConditionFields()}"
													postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
											<td><p:message id="lovKumpulanPTJMsg"
													for="lovKumpulanPTJ" display="icon" /></td>
										</tr>
									</table>
								</p:column>
							</c:if>
							<c:if
								test="#{ppReportBackingBean.managedBean.rptGenBean.ppPTJView}">
								<p:column>
									<table style="width: 100%;">
										<tr style="width: 100%;">
											<td><p:outputLabel value="#{lbl['lbl.rpt.ptj']}"></p:outputLabel></td>
										</tr>
									</table>
								</p:column>
								<p:column>
									<table style="width: 100%;">
										<tr style="width: 100%;">
											<td><ac:lov id="lovPTJ" lovId="PM_ORG_PROFILE_REPORT"
													size="38" update="@form" headerText="#{lbl['lbl.rpt.ptj']}"
													value="#{reportBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}"
													saveObject="reportBackingBean.managedBean.selectedPTJ"
													conditionField="#{reportBackingBean.constructPTJConditionFields()}"
													postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
											<td><p:message id="lovPTJMsg" for="lovPTJ"
													display="icon" /></td>
										</tr>
									</table>
								</p:column>
							</c:if>
						</c:if>						
						<c:if
							test="#{ctReportBackingBean.managedBean.rptGenBean.ppYearView}">
							<p:column>
								<table style="width: 100%;">
									<tr style="width: 100%;">
										<td><p:outputLabel style="margin-right:2px;"
												value="#{lbl['lbl.rpt.yearone']}" /> <p:outputLabel
												value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td><p:selectOneMenu id="ppYear"
												value="#{reportBackingBean.ppYear}"
												style="margin-top:5px;width:300px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
													itemValue="#{null}"></f:selectItem>
												<f:selectItems
													value="#{reportBackingBean.generateYearList()}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true"
													listener="#{reportBackingBean.onChangeValues()}"
													update="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="ppYearMsg" for="ppYear" display="icon"
												showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
					</h:panelGrid></td>
			</tr>
		</table>
	</div>

</ui:composition>
