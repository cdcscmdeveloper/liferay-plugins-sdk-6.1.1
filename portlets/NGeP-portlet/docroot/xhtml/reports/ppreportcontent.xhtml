<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<div class="columnPpTableClass">

		<table style="width: 100%; height: 100%;">
			<c:if
				test="#{ppReportBackingBean.managedBean.rptGenBean.commonLOVBasedRoles}">
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppNonMandatoryView}">
					<c:if
						test="#{ppReportBackingBean.managedBean.rptGenBean.ppMinistryView}">
						<tr>
							<td style="width: 15%;"><p:outputLabel
									value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel></td>
							<td><ac:lov id="lovPpMinistry" lovId="PM_ORG_PROFILE_REPORT"
									size="100" update="@form" readonly="true" 
									headerText="#{lbl['lbl.rpt.ministry']}"
									value="#{reportBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
									saveObject="reportBackingBean.managedBean.selectedMinistry"
									conditionField="#{reportBackingBean.constructMinistryConditionFields()}"
									postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
							<td><p:message id="lovPpMinistryMsg" for="lovPpMinistry"
									display="icon" /></td>
						</tr>
					</c:if>
				</c:if>
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppMandatoryView}">
					<c:if
						test="#{ppReportBackingBean.managedBean.rptGenBean.ppMinistryView}">
						<tr>
							<td><p:outputLabel value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel></td>
							<td><ac:lov id="lovPpMinistry1" lovId="PM_ORG_PROFILE_REPORT"
									size="100" update="@form" readonly="true" 
									headerText="#{lbl['lbl.rpt.ministry']}"
									value="#{reportBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
									saveObject="reportBackingBean.managedBean.selectedMinistry"
									conditionField="#{reportBackingBean.constructMinistryConditionFields()}"
									postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
							<td><p:message id="lovPpMinistry1Msg" for="lovPpMinistry1"
									display="icon" /></td>
						</tr>
					</c:if>
				</c:if>
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppPegaWaiPengawalView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.pegawaipengawal']}"></p:outputLabel>
						</td>
						<td><ac:lov id="lovPpPegaWaiPengawal" 
								lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
								headerText="#{lbl['lbl.rpt.pegawaipengawal']}"	 readonly="true"	
								disabled="#{reportBackingBean.managedBean.selectedMinistry==null}"						
								value="#{reportBackingBean.managedBean.selectedPegwaiPengawal.pmOrgValidity.orgName}"
								saveObject="reportBackingBean.managedBean.selectedPegwaiPengawal"
								conditionField="#{reportBackingBean.constructPegwaiPengawalConditionFields()}"
								postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
						<td><p:message id="lovPpPegaWaiPengawalMsg"
								for="lovPpPegaWaiPengawal" display="icon" /></td>
					</tr>
				</c:if>
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppKumpulanPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.kumpulan.ptj']}"></p:outputLabel></td>
						<td><ac:lov id="lovPpKumpulanPTJ" lovId="PM_ORG_PROFILE_REPORT"
								size="100" update="@form" 
								headerText="#{lbl['lbl.rpt.kumpulan.ptj']}"	 readonly="true"				
								disabled="#{reportBackingBean.managedBean.selectedMinistry==null 
								or reportBackingBean.managedBean.selectedPegwaiPengawal==null}"				
								value="#{reportBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
								saveObject="reportBackingBean.managedBean.selectedKumpulanPTJ"
								conditionField="#{reportBackingBean.constructKumpulanPTJConditionFields()}"
								postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
						<td><p:message id="lovPpKumpulanPTJMsg" for="lovPpKumpulanPTJ"
								display="icon" /></td>
					</tr>
				</c:if>
				<c:if test="#{ppReportBackingBean.managedBean.rptGenBean.ppPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.ptj']}"></p:outputLabel></td>
						<td><ac:lov id="lovPpPTJ" lovId="PM_ORG_PROFILE_REPORT" readonly="true"
								size="100" update="@form" headerText="#{lbl['lbl.rpt.ptj']}"	 
								disabled="#{reportBackingBean.managedBean.selectedMinistry==null 
								or reportBackingBean.managedBean.selectedPegwaiPengawal==null or reportBackingBean.managedBean.selectedKumpulanPTJ==null}"							
								value="#{reportBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}"
								saveObject="reportBackingBean.managedBean.selectedPTJ"
								conditionField="#{reportBackingBean.constructPTJConditionFields()}"
								postUpdateListener="#{reportBackingBean.onChangeValuesForLOVs()}" /></td>
						<td><p:message id="lovPpPTJMsg" for="lovPpPTJ" display="icon" /></td>
					</tr>
				</c:if>
			</c:if>
		</table>

		<table style="width: 100%; height: 100%;">
			<c:if
				test="#{ppReportBackingBean.managedBean.rptGenBean.textBoxBasedRoles}">
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppMinistryView}">
					<tr>
						<td style="width: 15%;"><p:outputLabel
								value="#{lbl['lbl.rpt.ministry']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width:656px;"
								id="lovPpMinistryOnly"  
								value="#{reportBackingBean.commonMinistry}">
								<f:selectItems  value="#{reportBackingBean.ministryList}" />
							</p:selectOneMenu></td>
						<td><p:message id="lovPpMinistryMsg" for="lovPpMinistryOnly"
								display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppPegaWaiPengawalView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.pegawaipengawal']}"></p:outputLabel>
						</td>
						<td><p:selectOneMenu style="width:656px;"
								id="lovPpPegaWaiPengawal" 
								value="#{reportBackingBean.commonPegaWaiPengawal}">
								<f:selectItems value="#{reportBackingBean.pegaWaiPengawalList}"/>
							</p:selectOneMenu></td>
						<td><p:message id="lovPpPegaWaiPengawalMsg"
								for="lovPpPegaWaiPengawal" display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
				<c:if
					test="#{ppReportBackingBean.managedBean.rptGenBean.ppKumpulanPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.kumpulan.ptj']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width:656px;"
								id="lovPpKumpulanPTJ" 
								value="#{reportBackingBean.commonKumpulanPTJ}">
								<f:selectItems value="#{reportBackingBean.kumpulanPTJList}"	/>
							</p:selectOneMenu></td>
						<td><p:message id="lovPpKumpulanPTJMsg"
								for="lovPpKumpulanPTJ" display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
				<c:if test="#{ppReportBackingBean.managedBean.rptGenBean.ppPTJView}">
					<tr>
						<td><p:outputLabel value="#{lbl['lbl.rpt.ptj']}"></p:outputLabel></td>
						<td><p:selectOneMenu style="width:656px;" id="lovPpPTJ" 
								value="#{reportBackingBean.commonPtj}">
								<f:selectItems value="#{reportBackingBean.ptjList}" />
							</p:selectOneMenu></td>
						<td><p:message id="lovPpPTJMsg" for="lovPpPTJ" display="icon" /></td>
					</tr>
					 &#160;
				</c:if>
			</c:if>
		</table>

		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:panelGrid id="ppReportCriteria" columns="4"
						style="width:85%;">
						<c:if
							test="#{ctReportBackingBean.managedBean.rptGenBean.ppYearView}">
							<p:column>
								<table style="width: 100%;">
									<tr style="width: 100%;">
										<td><p:outputLabel value="#{lbl['lbl.rpt.yearone']}" />
											<p:outputLabel value="*" styleClass="mandatory" /></td>
									</tr>
								</table>
							</p:column>
							<p:column>
								<table style="width: 100%;">
									<tr>
										<td style="width: 36%"><p:selectOneMenu id="ppYear"
												value="#{reportBackingBean.ppYear}" style="width:203px;">
												<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
													itemValue="#{null}"></f:selectItem>
												<f:selectItems
													value="#{reportBackingBean.generateYearList()}"></f:selectItems>
												<p:ajax event="change" partialSubmit="true"
													listener="#{reportBackingBean.onChangeValues()}"
													update="@form" />
											</p:selectOneMenu></td>
										<td><p:message id="ppYearMsg" for="ppYear" display="icon"
												showDetail="false" /></td>
									</tr>
								</table>
							</p:column>
						</c:if>
					</h:panelGrid></td>
			</tr>
		</table>

	</div>

</ui:composition>
