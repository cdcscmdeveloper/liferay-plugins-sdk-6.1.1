<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="cmReportListId">
		<c:choose>
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm002}">
				<ui:include src="cm/listOfApprovalCatalogItem.xhtml"></ui:include>
			</c:when>
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm008}">
				<ui:include src="cm/listOfCatalogItemNormalPrice.xhtml"></ui:include>
			</c:when>
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm009}">
				<ui:include src="cm/listOfCatalogItemTierPrice.xhtml"></ui:include>
			</c:when>
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm010}">
				<ui:include src="cm/listOfCatalogItemZonalPrice.xhtml"></ui:include>
			</c:when>
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm011}">
				<ui:include src="cm/listOfCatalogItemZonalTierPrice.xhtml"></ui:include>
			</c:when>
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm005}">
				<ui:include src="cm/listOfExpiredCatalogItem.xhtml"></ui:include>
			</c:when>
			
			
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm017}">
				<ui:include src="cm/listOfItemCode.xhtml"></ui:include>
			</c:when>
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm016}">
				<ui:include src="cm/listOfNewExtensionCode.xhtml"></ui:include>
			</c:when>
			
			<c:when
				test="#{cmReportsBackingBean.managedBean.reportCode == CmConst.reportCodeCm004}">
				<ui:include src="cm/listOfPendingApprovalItem.xhtml"></ui:include>
			</c:when>
			
			
			
		</c:choose>
	</h:panelGroup>



</ui:composition>
