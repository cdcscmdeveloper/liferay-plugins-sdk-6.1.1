<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%;">
		<tr>
			<td style="width: 168px;"><p:outputLabel
					value="#{lbl['lbl.rpt.scsimplequoteno']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>

			<td style="width: 84%"><p:inputText
					label="#{lbl['lbl.rpt.scsimplequoteno']}" id="simpleQuotationNo"
					maxlength="40"
					value="#{simpleQuoteInviteSupplierRptBackingBean.managedBean.simpleQuoteNum}"
					required="true" style="margin-top:5px;width:290px;">
					<p:ajax event="change"
						listener="#{simpleQuoteInviteSupplierRptBackingBean.simpleQuoteNoValidation()}"
						process="@this" partialSubmit="true" update="@form" />
				</p:inputText></td>
			<td><p:message id="simpleQuotationNoMsg" for="simpleQuotationNo"
					display="icon" showDetail="false" /></td>
		</tr>
	</table>

	<ac:generateReport bBean="#{simpleQuoteInviteSupplierRptBackingBean}"
		reportMainBean="#{dpReportBackingBean}">
	</ac:generateReport>

</ui:composition>
