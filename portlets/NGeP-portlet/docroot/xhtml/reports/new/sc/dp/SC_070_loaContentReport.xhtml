<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<div class="columnScTableClass">
		<table style="width: 45%;">
			<tr>
				<td>
					<p:outputLabel style="float:left;" value="#{lbl['lbl.rpt.loaidnolabel']}" />
				</td>
				<td>
					<p:inputText id="loaContentRptLOANo"
						value="#{loaContentRptBackingBean.scLOAIdNo}"
						style="margin-top:5px;width:290px;">
						<p:ajax event="blur"
							listener="#{loaContentRptBackingBean.getScLOAReports()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:inputText>
				</td>
			</tr>
		</table>
	</div>

	<p:panel header="#{lbl['lbl.sc.loiloa.loa.contents.content']}" toggleable="true">
		<p:dataTable id="loacontentReportTbl" widgetVar="contentsTblWidget"
			var="scLoaReport"
			value="#{loaContentRptBackingBean.managedBean.loaReportDocumentList}"
			rows="10" rowKey="#{scLoaReport}">
			<ac:paginator for="loacontentReportTbl" />

			<!-- <p:column style="width:2%" >
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selectAllNegoLoc"
						value="#{lOIDetailBackingBean.flag}" >
						<p:ajax partialSubmit="true" process="@this" update="contentsTbl"
							listener="#{reportBackingBean.selectAllDocuments}"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox value="#{scLoaReport.selected}" >
					<p:ajax partialSubmit="true" process="@this" update="contentsTbl" />
				</p:selectBooleanCheckbox>
			</p:column> -->

			<p:column headerText="#{lbl['lbl.sc.content']}">
				<h:outputText value="#{scLoaReport.title}" />
			</p:column>

			<p:column style="width:10%;" headerText="#{lbl['lbl.sc.action']}">
				<p:commandButton id="download" icon="ui-icon-download"
					style="background-color:transparent !important; border:0px none;"
					ajax="false"
					action="#{loaContentRptBackingBean.downloadReport(scLoaReport)}" />
			</p:column>
		</p:dataTable>

		<div class="ppRightBtn">
			<p:commandButton value="#{lbl['lbl.btn.download.all']}" ajax="false"
				styleClass="ui-button" action="#{loaContentRptBackingBean.downloadAllReports}" />
		</div>
	</p:panel>

	<div style="text-align: right;">
		<p:commandButton id="btnReset" value="#{lbl['lbl.btn.reset']}" update=":form" 
				process="@this" action="#{loaContentRptBackingBean.resetSearch()}" />
	</div>

	<!-- <ac:generateReport bBean="#{loaContentRptBackingBean}"
		reportMainBean="#{dpReportBackingBean}">
	</ac:generateReport> -->

</ui:composition>
