<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<style>
		.no-header .ui-accordion-header {
	    	display: none;
		}	
		
		.custom-scroll-border.ui-scrollpanel {
		    border: 1px solid #dcdcdc !important;
		}
	</style>
	
	<ui:param name="requisitionerEnableDisable"
			value="#{pidSummaryRptBackingBean.retrieveUserRoles()}"></ui:param>
	<ui:param name="ptjEnableDisable"
			value="#{pidSummaryRptBackingBean.retrievePtjRoles()}"></ui:param>

	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.sc.status']}" /></td>
			<td width="35%">
				<ui:remove>#29558 start</ui:remove>
				<p:accordionPanel multiple="true" id="accPanel" styleClass="no-header">
				    <p:tab title="">
				        <p:scrollPanel style="width:300px;height:200px" styleClass="custom-scroll-border">
				            <p:selectManyCheckbox id="manyMenusts" value="#{pidSummaryRptBackingBean.managedBean.scStatusManyMenuTemp}" layout="pageDirection">
				                <f:selectItem itemValue="#{lbl['lbl.rpt.all']}" itemLabel="#{lbl['lbl.rpt.all']}"/>
				                <f:selectItems value="#{pidSummaryRptBackingBean.reportStatusDropdownValuesSelectManyMenu(ParameterConst.doctypePurchaseInDefault)}" 
				                var="status" itemValue="#{status}" itemLabel="#{status}" 
				                itemDisabled="#{pidSummaryRptBackingBean.isDisabled(status,ParameterConst.doctypePurchaseInDefault)}"/>
				                <p:ajax event="change" update="manyMenusts" process="@form" 
    					 		 listener="#{pidSummaryRptBackingBean.onSelectAll(ParameterConst.doctypePurchaseInDefault)}"/>
    			            </p:selectManyCheckbox>
				        </p:scrollPanel>
				    </p:tab>
    			</p:accordionPanel>
    			<ui:remove>#29558 end</ui:remove>
			</td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.PIDNO']}" /></td>
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{pidSummaryRptBackingBean.managedBean.docNo}">
				</p:inputText></td>
		</tr>
		<tr>
			<!-- #36613 - start -->
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.CONTCRCTYPE']}" /></td>
			<!-- #36613 - end -->
			<td width="35%"><p:selectOneMenu
					value="#{pidSummaryRptBackingBean.managedBean.contractType}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.ministry']}"
						itemValue="#{lbl['lbl.rpt.MNSTRY']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.panel']}"
						itemValue="#{lbl['lbl.rpt.PANEL']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.central']}"
						itemValue="#{lbl['lbl.rpt.CNTRL']}"></f:selectItem>
					<p:ajax event="change"
						listener="#{reportBackingBean.onChangeScContractOrPKPType()}"
						partialSubmit="true" update="@form" />
				</p:selectOneMenu></td>
			<!-- #36613 - start -->
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.CONTCRCNO']}" /></td>
			<!-- #36613 - end -->
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{pidSummaryRptBackingBean.managedBean.contractNo}">
				</p:inputText></td>
		</tr>
		<tr>`
		<!-- #36613 - start -->
			<td><p:outputLabel
					value="#{lbl['lbl.rpt.CONTCRCNAME']}" /></td>
			<td><p:inputText maxlength="50" size="50"
					value="#{pidSummaryRptBackingBean.managedBean.contractName}">
				</p:inputText></td>
		<!-- #36613 - end -->
		</tr>

		<c:if test="#{requisitionerEnableDisable}">
		<tr>
			<td width="15%">
				<p:outputLabel value="#{lbl['lbl.rpt.requisitioner']}"
					style="margin-top:5px;width:160px;" /></td>
			<td width="35%">
				<p:selectOneMenu
					value="#{pidSummaryRptBackingBean.managedBean.scRequisitioner}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
	
					<f:selectItems value="#{pidSummaryRptBackingBean.retrieveRequisitioner()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@this" />
				</p:selectOneMenu>
			</td>
			<td width="15%"></td>
			<td width="35%"></td>
		</tr>
		</c:if>
	</table>
	
	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.createdDt']}" /></td>
			<td width="15%"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pidSummaryRptBackingBean.managedBean.dateFrom}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>
			<td width="1%"><p:outputLabel
					value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{pidSummaryRptBackingBean.managedBean.dateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>

		</tr>
	</table>
	
	<ac:generateReport bBean="#{pidSummaryRptBackingBean}"
		reportMainBean="#{dpReportBackingBean}">
	</ac:generateReport>
	
</ui:composition>
