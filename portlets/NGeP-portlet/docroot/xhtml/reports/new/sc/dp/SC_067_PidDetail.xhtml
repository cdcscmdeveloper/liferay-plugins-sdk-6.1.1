<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:param name="requisitionerEnableDisable"
			value="#{pidDetailRptBackingBean.retrieveUserRoles()}"></ui:param>
	<ui:param name="ptjEnableDisable"
			value="#{pidDetailRptBackingBean.retrievePtjRoles()}"></ui:param>
	
	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.sc.supp.name']}" /></td>
			<td width="35%"><ac:lov id="dpInquirySupplierName" readonly="true" 
								lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" 
								headerText="#{lbl['lbl.sc.supp.name']}" update="@form"
								value="#{pidDetailRptBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}"
								saveObject="pidDetailRptBackingBean.managedBean.selectedOrgProfile" 
								postUpdateListener="#{pidDetailRptBackingBean.onSupplierChange()}" /></td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.sc.status']}" /></td>
			<td width="35%"><p:selectOneMenu
					value="#{pidDetailRptBackingBean.managedBean.status}">
					<f:selectItems
						value="#{pidDetailRptBackingBean.searchStatusDesc(ParameterConst.doctypePurchaseInDefault)}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.PIDNO']}" /></td>
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{pidDetailRptBackingBean.managedBean.docNo}">
				</p:inputText></td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.CONTRPKPTYPE']}" /></td>
			<td width="35%"><p:selectOneMenu
					value="#{pidDetailRptBackingBean.managedBean.contractType}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.ministry']}"
						itemValue="#{lbl['lbl.rpt.MNSTRY']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.panel']}"
						itemValue="#{lbl['lbl.rpt.PANEL']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.central']}"
						itemValue="#{lbl['lbl.rpt.CNTRL']}"></f:selectItem>
					<p:ajax event="change"
						listener="#{reportBackingBean.onChangeScContractOrPKPType()}"
						partialSubmit="true" update="@form" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.CONTRPKPNO']}" /></td>
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{pidDetailRptBackingBean.managedBean.contractNo}">
				</p:inputText></td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.CONTRPKPNM']}" /></td>
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{pidDetailRptBackingBean.managedBean.contractName}">
				</p:inputText></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.group']}"
					style="margin-top:5px;width:160px;" /> 
			</td>
			<td>
				<p:selectOneMenu
					value="#{pidDetailRptBackingBean.managedBean.pidGroup}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.contractpkpno']}"
						itemValue="#{lbl['lbl.rpt.contractpkpno.val']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.contractType']}"
						itemValue="#{lbl['lbl.rpt.capscontracttype']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.approverscreen']}"
						itemValue="#{lbl['lbl.rpt.capsapprover']}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>

	<c:if test="#{requisitionerEnableDisable}">
	<tr>
		<td width="15%">
			<p:outputLabel value="#{lbl['lbl.rpt.requisitioner']}"
				style="margin-top:5px;width:160px;" /></td>
		<td width="35%">
			<p:selectOneMenu
				value="#{pidDetailRptBackingBean.managedBean.scRequisitioner}"
				style="margin-top:5px;width:300px;">
				<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
					itemValue="#{null}">
					</f:selectItem>
	
					<f:selectItems
						value="#{pidDetailRptBackingBean.retrieveRequisitioner()}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@this" />
			</p:selectOneMenu>
		</td>
		<td width="15%"></td>
		<td width="35%"></td>
	</tr>
	</c:if>
	</table>

	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.createdDt']}" /></td>
			<td width="15%"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pidDetailRptBackingBean.managedBean.dateFrom}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>
			<td width="1%"><p:outputLabel
					value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{pidDetailRptBackingBean.managedBean.dateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>

		</tr>
	</table>
	
	<ac:generateReport bBean="#{pidDetailRptBackingBean}"
		reportMainBean="#{dpReportBackingBean}">
	</ac:generateReport>
	
</ui:composition>
