<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<ui:param name="requisitionerEnableDisable"
			value="#{loaRptBackingBean.retrieveUserRoles()}"></ui:param>
	<ui:param name="ptjEnableDisable"
			value="#{loaRptBackingBean.retrievePtjRoles()}"></ui:param>
			
	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.sc.sq.simple.quote.no']}" /></td>
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{loaRptBackingBean.managedBean.simpleQuoteNo}">
				</p:inputText></td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.sc.supp.name']}" /></td>
			<td width="35%"><ac:lov id="dpInquirySupplierName" readonly="true" 
								lovId="PM_ORG_PROFILE_WITH_SUPPLIER_REPORT" 
								headerText="#{lbl['lbl.sc.supp.name']}" update="@form"
								value="#{loaRptBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}"
								saveObject="loaRptBackingBean.managedBean.selectedOrgProfile" 
								postUpdateListener="#{loaRptBackingBean.onSupplierChange()}" /></td>
		</tr>
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.sstScreen']}" /></td>
			<td width="35%"><p:inputText maxlength="50" size="50"
					value="#{loaRptBackingBean.managedBean.docNo}">
				</p:inputText></td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.sc.sq.simple.quote.type']}" /></td>
			<td width="35%"><p:selectOneMenu
					value="#{loaRptBackingBean.managedBean.simpleQuoteType}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.sc.sq.multiple']}"
						itemValue="#{1}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.sc.sq.single']}"
						itemValue="#{0}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true"
						listener="#{loaRptBackingBean.onChangeScSimpleQuoteTypeView()}"
						update="@form" />
				</p:selectOneMenu></td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.sc.status']}" /></td>
			<td><p:selectOneMenu
					value="#{loaRptBackingBean.managedBean.status}">
					<f:selectItems
						value="#{loaRptBackingBean.searchStatusDesc(ParameterConst.doctypeLetterOfAward)}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>

	<c:if test="#{requisitionerEnableDisable}">
		<tr>
			<td width="15%">
				<p:outputLabel value="#{lbl['lbl.rpt.requisitioner']}"
					style="margin-top:5px;width:160px;" /></td>
			<td width="35%">
				<p:selectOneMenu
					value="#{loaRptBackingBean.managedBean.scRequisitioner}"
					style="margin-top:5px;width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}">
						</f:selectItem>

						<f:selectItems
							value="#{loaRptBackingBean.retrieveRequisitioner()}"></f:selectItems>
						<p:ajax event="change" partialSubmit="true" update="@this" />
				</p:selectOneMenu>
			</td>
			<td width="15%"></td>
			<td width="35%"></td>
		</tr>
	</c:if>
	</table>

	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.createdDt']}" /></td>
			<td width="15%"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{loaRptBackingBean.managedBean.dateFrom}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>
			<td width="1%"><p:outputLabel
					value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{loaRptBackingBean.managedBean.dateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>

		</tr>
	</table>
	
	<ac:generateReport bBean="#{loaRptBackingBean}"
		reportMainBean="#{dpReportBackingBean}">
	</ac:generateReport>
	
</ui:composition>
