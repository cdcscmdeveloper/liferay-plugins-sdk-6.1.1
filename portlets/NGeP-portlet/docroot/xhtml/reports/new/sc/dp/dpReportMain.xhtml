<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<!-- Validation Message -->
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<table style="margin-top: 10px; width: 100%;">
			<tr>
				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td width="90%"><p:selectOneMenu
						label="#{lbl['lbl.rpt.rptName']}" id="somReportName"
						value="#{dpReportBackingBean.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{dpReportBackingBean.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{dpReportBackingBean.onChangeReportName()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
		<br />
		<p:panel id="dpRptSearchCriteriaPnl"
			header="#{dpReportBackingBean.managedBean.reportTitle}"
			rendered="#{not empty dpReportBackingBean.managedBean.reportCode}"
			toggleable="true">
			<table width="100%">
				<tr>
					<td><h:outputText styleClass="instruction"
							style="float:left;margin-left:20px;"
							value="#{lbl['lbl.instruction.mandatory']}" /></td>
				</tr>
				<tr>
					<td><h:outputText styleClass="instruction"
							style="float:left;margin-left:20px;"
							value="#{lbl['lbl.instruction.dpatleast']}" /></td>
				</tr>
			</table>
			<br />
			<c:choose>
				<!-- SC_050 -->
				<c:when
					test="#{DpReportConst.dpItemInquiryDetailRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include
						src="/xhtml/reports/new/sc/dp/SC_050_ItemInquiryDetail.xhtml"></ui:include>
				</c:when>
				<!-- SC_051 -->
				<c:when
					test="#{DpReportConst.dpItemInquirySummuryRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/sc/dp/SC_051_ItemInquirySummary.xhtml"></ui:include>
				</c:when>
				<!-- SC_055 -->
				<c:when
					test="#{DpReportConst.dpPurchaseInDefaultSummaryRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include
						src="/xhtml/reports/new/sc/dp/SC_055_PidSummary.xhtml"></ui:include>
				</c:when>
				<!-- SC_056 -->
				<c:when
					test="#{DpReportConst.dpRequestNoteDetailRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include
						src="/xhtml/reports/new/sc/dp/SC_056_RequestNoteDetail.xhtml"></ui:include>
				</c:when>
				<!-- SC_058 -->
				<c:when
					test="#{DpReportConst.dpRequestNoteSummaryRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include
						src="/xhtml/reports/new/sc/dp/SC_058_RequestNoteSummary.xhtml"></ui:include>
				</c:when>
				<!-- SC_060 -->
				<c:when
					test="#{DpReportConst.dpSimpleQuoteSummaryRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include
						src="/xhtml/reports/new/sc/dp/SC_060_SimpleQuoteSummary.xhtml"></ui:include>
				</c:when>
				<!-- SC_062 -->
				<c:when
					test="#{DpReportConst.dpSimpleQuoteDetailRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include
						src="/xhtml/reports/new/sc/dp/SC_062_SimpleQuoteDetail.xhtml"></ui:include>
				</c:when>
				<!-- SC_067 -->
				<c:when
					test="#{DpReportConst.dpPurchaseInDefaultDetailRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/sc/dp/SC_067_PidDetail.xhtml"></ui:include>
				</c:when>
				<!-- SC_068 -->
				<c:when
					test="#{DpReportConst.dpSimpleQuoteListInvitedSupplierRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/sc/dp/SC_068_SimpleQuote_Invited_Supplier.xhtml"></ui:include>
				</c:when>
				<!-- SC_069 -->
				<c:when
					test="#{DpReportConst.dpLoaRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/sc/dp/SC_069_Loa.xhtml"></ui:include>
				</c:when>
				<!-- SC_070 -->
				<c:when
					test="#{DpReportConst.dpLoaContentRptVal eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/sc/dp/SC_070_loaContentReport.xhtml"></ui:include>
				</c:when>
				<ui:remove>26059 - start SC_093</ui:remove>
				<c:when
					test="#{DpReportConst.dpItemExceedThresholdRpt eq dpReportBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/sc/dp/SC_093_itemExceedThresholdValue.xhtml"></ui:include>
				</c:when>
				<ui:remove>26059 - end</ui:remove>
				<c:otherwise>
        			#{lbl['lbl.rpt.search.REPORTS_NOT_AVAILABLE_BY_MODULE']}    				
				</c:otherwise>
			</c:choose>
			<br />
			<br />
		</p:panel>
		<ac:lovPopup />
	</ui:define>

</ui:composition>
