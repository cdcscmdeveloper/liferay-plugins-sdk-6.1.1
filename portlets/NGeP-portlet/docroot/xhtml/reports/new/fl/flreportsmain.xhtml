<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<table style="margin-top: 10px; width: 100%;">
			<tr>
				<td>
					<p:outputLabel value="#{lbl['lbl.rpt.rptCategory']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<p:selectOneMenu
						label="#{lbl['lbl.rpt.rptCategory']}" id="reportCategory"
						value="#{flReportsBackingBean.managedBean.reportCategory}"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{flReportsBackingBean.managedBean.reportCategoryList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{flReportsBackingBean.retrieveSubModuleReportCategoryList(flReportsBackingBean.managedBean.reportCategory)}"
							process="@this" partialSubmit="true" update="@all" />
					</p:selectOneMenu>
				</td>
			</tr> 
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td><p:selectOneMenu label="#{lbl['lbl.rpt.rptName']}"
						id="somReportName"
						value="#{flReportsBackingBean.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{flReportsBackingBean.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{flReportsBackingBean.onChangeReportName()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
		<p:panel id="flRptSearchCriteriaPnl"
			header="#{flReportsBackingBean.managedBean.reportName}"
			rendered="#{not empty flReportsBackingBean.managedBean.reportCode}"
			toggleable="true">
			<!-- Validation Message -->
			<p:messages id="messages" showDetail="true" autoUpdate="true"
				closable="true" showSummary="false" />
			<p:blockUI block=":form" widgetVar="blockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			<c:choose>
				<c:when
					test="#{'FL_001' eq flReportsBackingBean.managedBean.reportCode}">
					<ui:include src="/xhtml/reports/new/fl/contractRequestReport.xhtml"></ui:include>
				</c:when>

				<c:otherwise>
        			ERROR!
    
				</c:otherwise>
			</c:choose>
			
			<p:commandButton 
					id="generateBtnId"
					value="#{lbl['lbl.btn.generate']}"
					process="@form"   
					update="@form" 
					action="#{flReportsBackingBean.generateFlReport()}">
			</p:commandButton>
			<p:commandButton 
					id="resetBtnId"
					value="#{lbl['lbl.btn.reset']}"
					process="@this"   
					update="@form" 
					action="#{flReportsBackingBean.resetAction()}">
			</p:commandButton>
		</p:panel>
		<ui:include src="/xhtml/reports/new/fl/common/confirmationDialog.xhtml"></ui:include>

		<ac:lovPopup />

	</ui:define>
	

</ui:composition>
