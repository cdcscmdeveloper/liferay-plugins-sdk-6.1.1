<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">
		<!-- Validation Message -->
		<p:messages id="messages" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false" />
		<p:blockUI block=":form" widgetVar="blockWidget">
			<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
		</p:blockUI>
		<table style="margin-top: 10px; width: 100%;">
			<tr>
				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>
				<td width="90%"><p:selectOneMenu
						label="#{lbl['lbl.rpt.rptName']}" id="somReportName"
						value="#{ppReportsBackingBean.managedBean.reportCode}"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
							itemValue="#{null}"></f:selectItem>
						<f:selectItems
							value="#{ppReportsBackingBean.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change"
							listener="#{ppReportsBackingBean.onChangeReportName()}"
							process="@this" partialSubmit="true" update="@form" />
					</p:selectOneMenu></td>
			</tr>
		</table>
		<br />
		<p:panel id="ppRptSearchCriteriaPnl"
			header="#{ppReportsBackingBean.managedBean.reportTitle}"
			rendered="#{not empty ppReportsBackingBean.managedBean.reportCode}"
			toggleable="true">
			<table width="100%">
				<tr>
					<td><h:outputText styleClass="instruction"
							style="float:left;margin-left:20px;"
							value="#{lbl['lbl.instruction.mandatory']}" /></td>
				</tr>
				<tr>
					<td><h:outputText styleClass="instruction"
							style="float:left;margin-left:20px;"
							value="#{lbl['lbl.rpt.instructioninfo']}" /></td>
				</tr>
			</table>
			<br />
			<ui:include src="/xhtml/reports/new/pp/pplanReport.xhtml"></ui:include>
			<br />
			<br />
			<p:outputPanel id="btnOp">
				<div align="right" style="width: 100%">
					<p:commandButton id="generateBtnId"
						value="#{lbl['lbl.btn.generate']}" process="@form" update="@form"
						action="#{ppReportsBackingBean.generatePpReport()}">
						<f:param name="disableValidation" value="true" />
					</p:commandButton>
					<p:commandButton id="resetBtnId" value="#{lbl['lbl.btn.reset']}"
						process="@this" update="@form"
						action="#{ppReportsBackingBean.resetAction()}">
					</p:commandButton>
				</div>
			</p:outputPanel>
		</p:panel>
		<ui:include
			src="/xhtml/reports/new/pp/common/confirmationDialog.xhtml"></ui:include>
		<ac:lovPopup />
	</ui:define>


</ui:composition>
