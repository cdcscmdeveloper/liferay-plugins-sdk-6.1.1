<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td width="20%"><p:outputLabel value="#{lbl['lbl.pp.ministry']}" /></td>
			<td colspan="2"><ac:lov id="lovPpMinistry"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					disabled="#{ppReportsBackingBean.managedBean.disableOrgFields}"
					readonly="true" headerText="#{lbl['lbl.pp.ministry']}"
					value="#{ppReportsBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
					saveObject="ppReportsBackingBean.managedBean.selectedMinistry"
					postUpdateListener="ppReportsBackingBean.onChangeMinistry"
					conditionField="#{ppReportsBackingBean.constructMinistryConditionFields()}" /></td>


		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.pegawai.pengawal']}"></p:outputLabel>
			</td>
			<td colspan="2"><ac:lov id="lovPpPegaWaiPengawal"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.pp.pegawai.pengawal']}" readonly="true"
					disabled="#{ppReportsBackingBean.managedBean.selectedMinistry==null or ppReportsBackingBean.managedBean.disableOrgFields}"
					value="#{ppReportsBackingBean.managedBean.selectedPegawaiPengawal.pmOrgValidity.orgName}"
					saveObject="ppReportsBackingBean.managedBean.selectedPegawaiPengawal"
					postUpdateListener="ppReportsBackingBean.onChangePegawaiPengawal"
					conditionField="#{ppReportsBackingBean.constructPegwaiPengawalConditionFields()}" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.kumpulan.ptj']}"></p:outputLabel></td>
			<td colspan="2"><ac:lov id="lovPpKumpulanPTJ"
					lovId="PM_ORG_PROFILE_REPORT" size="100" update="@form"
					headerText="#{lbl['lbl.pp.kumpulan.ptj']}" readonly="true"
					disabled="#{ppReportsBackingBean.managedBean.selectedPegawaiPengawal==null or ppReportsBackingBean.managedBean.disableOrgFields}"
					value="#{ppReportsBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
					saveObject="ppReportsBackingBean.managedBean.selectedKumpulanPTJ"
					conditionField="#{ppReportsBackingBean.constructKumpulanPTJConditionFields()}"
					postUpdateListener="ppReportsBackingBean.onChangeJabatan" /></td>

		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pp.ptj']}"></p:outputLabel></td>
			<td colspan="2"><ac:lov id="lovPpPTJ"
					lovId="PM_ORG_PROFILE_REPORT" readonly="true" size="100"
					headerText="#{lbl['lbl.pp.ptj']}" update="@form"
					disabled="#{ppReportsBackingBean.managedBean.selectedKumpulanPTJ==null or ppReportsBackingBean.managedBean.disableOrgFields}"
					value="#{ppReportsBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}"
					saveObject="ppReportsBackingBean.managedBean.selectedPTJ"
					conditionField="#{ppReportsBackingBean.constructPTJConditionFields()}" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.yearone']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td width="20%"><p:selectOneMenu id="ppYear"
					label="#{lbl['lbl.rpt.yearone']}"
					required="#{!empty param['disableValidation']}"
					value="#{ppReportsBackingBean.managedBean.selectedYear}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems
						value="#{ppReportsBackingBean.generateCommonYearList()}"></f:selectItems>
				</p:selectOneMenu></td>
			<td width="60%"><p:message id="ppYearMsg" for="ppYear" display="icon"
					showDetail="false" /></td>


		</tr>
	</table>
</ui:composition>
