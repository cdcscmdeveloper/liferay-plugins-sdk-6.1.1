<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.rpt.sm.SM_APPL_VERIFY_RPT_NAME']}" toggleable="true">
		<table>
			<tr>
				<td class="columnGenClass">
					<p:outputLabel value="#{lbl['lbl.rpt.applicationreceiveddatefrom']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
			
				<td class="columnDateFromClass">
					<p:calendar label="#{lbl['lbl.rpt.applicationreceiveddatefrom']}"
						id="calDtFrm" showOn="button" navigator="true"
						display="inline" readonlyInput="true" size="9" update="calDtTo" 
						value="#{applVerificationRptBB.managedBean.dateFrom}" required="true"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
						<p:ajax event="dateSelect"  update="calDtTo" process="@this"/>
					</p:calendar>
					<p:message id="calDtFrmMsg" for="calDtFrm" display="icon" showDetail="false" />
				</td>
				
				<td class="columnDateToClass"><p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
				<td><p:calendar label="#{lbl['lbl.rpt.todate']}"
					id="calDtTo" showOn="button" navigator="true" disabled="#{empty applVerificationRptBB.managedBean.dateFrom}"
					display="inline" readonlyInput="true" size="9" mindate="#{applVerificationRptBB.managedBean.dateFrom}"
					value="#{applVerificationRptBB.managedBean.dateTo}" required="true" 
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					</p:calendar></td>
				<td style="width:53%;"><p:message id="calDtToMsg" for="calDtTo" display="icon" showDetail="false" /></td>
			</tr>
		</table>
		
		<ac:smGenerateReport bBean="#{applVerificationRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
			generateAction="generateReport" resetAction="resetSearch">
		</ac:smGenerateReport>
	</p:panel>
</ui:composition>
