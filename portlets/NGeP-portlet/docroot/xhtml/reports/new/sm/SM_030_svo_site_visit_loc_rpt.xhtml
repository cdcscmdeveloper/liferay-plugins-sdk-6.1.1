<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{svoSiteVisitLocRptBB}" showItemAll="true" />
			</td>
		
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{svoSiteVisitLocRptBB}" 
				saveObj="svoSiteVisitLocRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16"
					value="#{svoSiteVisitLocRptBB.managedBean.applNo}"
					style="width:290px;">
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.site.visit.status']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.svouser']}"
					id="smSVOUser" value="#{svoSiteVisitLocRptBB.managedBean.svoUser}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItems value="#{svoSiteVisitLocRptBB.managedBean.svoUserList}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="smSVOUserMsg" for="smSVOUser" display="icon" showDetail="false" />
			</td>
			
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.state']}" />
			</td>
			<td class="tdContent">
				<ac:smReportState bBean="#{svoSiteVisitLocRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.district']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDistrict bBean="#{svoSiteVisitLocRptBB}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.expectedsitevisitrptdatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{svoSiteVisitLocRptBB}" />
			</td>
			<!-- 12625 add application status and perform site visit drop-down -->
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.application.status']}" /></td>
			<td class="tdContent"><p:selectOneMenu
					label="#{lbl['lbl.rpt.application.status']}"
					id="smSVOApplicationStatus"
					value="#{svoSiteVisitLocRptBB.managedBean.svoApplicationStatus}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSiteVisit']}"
						itemValue="A">
					</f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendingSiteReVisit']}"
						itemValue="B">
					</f:selectItem>
				</p:selectOneMenu>
			</td>
		</tr>

		<tr>
			<td></td>
			<td></td>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.perform.site.visit']}" /></td>
			<td class="tdContent"><p:selectOneMenu
					label="#{lbl['lbl.rpt.perform.site.visit']}"
					id="smSVOPerformSiteVisit"
					value="#{svoSiteVisitLocRptBB.managedBean.svoPerformSiteVisit}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sv.before.approval']}"
						itemValue="Before">
					</f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sv.after.approval']}"
						itemValue="After ">
					</f:selectItem>
				</p:selectOneMenu>
			</td>
		<!-- 12625 end  -->
		</tr>
	</table>
	<br />
	
	<ac:smGenerateReport bBean="#{svoSiteVisitLocRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
