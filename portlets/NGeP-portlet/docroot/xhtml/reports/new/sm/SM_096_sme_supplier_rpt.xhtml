<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<p:blockUI block=":form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>
	<p:outputPanel id="smeRptPanel">
		<table class="customTbl">
			<tr>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.sme.rpt.account.type']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td class="tdContent"><p:selectOneMenu style="width:300px;"
						label="#{lbl['lbl.sm.sme.rpt.account.type']}"
						value="#{smeSupplierRptBB.managedBean.accountType}"
						required="true">
						<f:selectItem itemLabel="#{lbl['lbl.sm.sme.txt.select']}"
							itemValue=""></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.sme.rpt.account.basic']}"
							itemValue="#{SupplierManagementConst.ACC_BASIC}"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.sme.rpt.account.mof']}"
							itemValue="#{SupplierManagementConst.ACC_MOF}"></f:selectItem>
						<p:ajax update="smeRptPanel" partialSubmit="true"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.sme.rpt.comp.name']}" /></td>
				<td class="tdContent">
					<!-- 
					<ac:smReportCompanyNameLOV
						bBean="#{smeSupplierRptBB}"
						saveObj="smeSupplierRptBB.managedBean.selectedOrgProfile" />
					-->
					
					<p:outputPanel rendered="#{smeSupplierRptBB.managedBean.regType == SupplierManagementConst.ACC_BASIC}">
						<ac:lov id="rptSmeBasic" lovId="SM_SME_SUPPLIER_BASIC"
							headerText="#{lbl['lbl.rpt.cmpName']}"
							value="#{smeSupplierRptBB.managedBean.selectedSupplier.companyName}" 
							saveObject="smeSupplierRptBB.managedBean.selectedSupplier"
							conditionField="#{smeSupplierRptBB.constructConditionFields()}"
							tooltip="#{lbl['lbl.sm.rpt.profile.tooltip']}" >
						</ac:lov>
					</p:outputPanel>
					
					<p:outputPanel rendered="#{smeSupplierRptBB.managedBean.regType != SupplierManagementConst.ACC_BASIC}">
						<ac:lov id="rptSmeMof" lovId="SM_SME_SUPPLIER_MOF"
							headerText="#{lbl['lbl.rpt.cmpName']}"
							value="#{smeSupplierRptBB.managedBean.selectedSupplier.companyName}" 
							saveObject="smeSupplierRptBB.managedBean.selectedSupplier"
							conditionField="#{smeSupplierRptBB.constructConditionFields()}"
							tooltip="#{lbl['lbl.sm.rpt.profile.tooltip']}" >
						</ac:lov>
					</p:outputPanel>
					
				</td>
			</tr>
			<!-- // #29617 Reopen Start - note #119 item 1, 3, 4, 5 -->
			<p:outputPanel
					rendered="#{smeSupplierRptBB.managedBean.accountType eq SupplierManagementConst.ACC_MOF}"> 
			<tr> 
					<td class="tdTitle"><p:outputLabel 
							value="#{lbl['lbl.sm.sme.rpt.zone']}" /></td> 
					<td class="tdContent"><ac:smReportZoneList 
							bBean="#{smeSupplierRptBB}" showItemAll="true" /></td> 
				<td class="tdTitle"><p:outputLabel 
						value="#{lbl['lbl.rpt.supplierType']}" /></td> 
				<td class="tdContent">
					<ac:smReportSupplierType bBean="#{smeSupplierRptBB}" 
						required="true" allValue="all" />
				</td> 
			</tr> 
			</p:outputPanel>
			<tr> 
				<td class="tdTitle"><p:outputLabel 
						value="#{lbl['lbl.sm.sme.rpt.status.type']}" /></td>
				<td class="tdContent"><p:selectOneMenu style="width:300px;" 
						value="#{smeSupplierRptBB.managedBean.smeStatusType}"> 
						<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" 
							itemValue="#{cc.attrs.allValue}"></f:selectItem> 
			<!-- // #29617 Reopen End -->
						<f:selectItems
							value="#{smeSupplierRptBB.managedBean.statusTypeList}" />
					</p:selectOneMenu></td>
				<td class="tdTitle"><p:outputLabel
						value="#{lbl['lbl.sm.sme.reg.status']}" /></td>
				<td class="tdContent" colspan="2"><p:selectOneRadio
						style="width:100px;"
						value="#{smeSupplierRptBB.managedBean.smeCorpRegistered}">
						<f:selectItem itemLabel="#{lbl['lbl.sm.sme.txt.yes']}"
							itemValue="1"></f:selectItem>
						<f:selectItem itemLabel="#{lbl['lbl.sm.sme.txt.no']}"
							itemValue="0"></f:selectItem>
						<p:ajax update="smeRptPanel" partialSubmit="true"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()" />
					</p:selectOneRadio></td>
			</tr>
			<p:outputPanel
				rendered="#{smeSupplierRptBB.managedBean.smeCorpRegistered eq '1'}">
				<tr>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.sme.valid.start.from']}" /></td>
					<td><table style="width: 100%;">
							<tr>
								<td class="columnDateFromClass"><p:calendar
										id="calDtStartFrm" showOn="button" navigator="true"
										value="#{smeSupplierRptBB.managedBean.dateStartFrom}"
										disabled="#{not empty smeSupplierRptBB.managedBean.dateEndFrom}"
										display="inline" readonlyInput="true" size="9"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
										<p:ajax event="dateSelect" update="calDtStartTo calDtEndFrm"
											process="@this"
											listener="#{smeSupplierRptBB.setSmeDateToByDateRange(1,12)}" />
									</p:calendar> <p:message id="calDtStartFrmMsg" for="calDtStartFrm"
										display="icon" showDetail="false" /></td>
								<td class="columnDateToClass"><p:outputLabel
										value="#{lbl['lbl.sm.sme.rpt.to']}" /></td>
								<td><p:calendar id="calDtStartTo" showOn="button"
										navigator="true"
										value="#{smeSupplierRptBB.managedBean.dateStartTo}"
										disabled="#{empty smeSupplierRptBB.managedBean.dateStartFrom}"
										display="inline" readonlyInput="true" size="9"
										mindate="#{smeSupplierRptBB.managedBean.dateStartFrom}"
										maxdate="#{smeSupplierRptBB.managedBean.dateTo}"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
										<p:message id="calDtStartToMsg" for="calDtStartTo"
											display="icon" showDetail="false" />
									</p:calendar></td>
							</tr>
						</table></td>
					<td class="tdTitle"><p:outputLabel
							value="#{lbl['lbl.sm.sme.valid.end.from']}" /></td>
					<td><table style="width: 100%;">
							<tr>
								<td class="columnDateFromClass"><p:calendar
										id="calDtEndFrm" showOn="button" navigator="true"
										value="#{smeSupplierRptBB.managedBean.dateEndFrom}"
										disabled="#{not empty smeSupplierRptBB.managedBean.dateStartFrom}"
										display="inline" readonlyInput="true" size="9"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
										<p:ajax event="dateSelect" update="calDtEndTo calDtStartFrm"
											process="@this"
											listener="#{smeSupplierRptBB.setSmeDateToByDateRange(2,12)}" />
									</p:calendar> <p:message id="calDtEndFrmMsg" for="calDtEndFrm"
										display="icon" showDetail="false" /></td>
								<td class="columnDateToClass"><p:outputLabel
										value="#{lbl['lbl.sm.sme.rpt.to']}" /></td>
								<td><p:calendar id="calDtEndTo" showOn="button"
										navigator="true"
										value="#{smeSupplierRptBB.managedBean.dateEndTo}"
										disabled="#{empty smeSupplierRptBB.managedBean.dateEndFrom}"
										display="inline" readonlyInput="true" size="9"
										mindate="#{smeSupplierRptBB.managedBean.dateEndFrom}"
										maxdate="#{smeSupplierRptBB.managedBean.dateTo}"
										pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
										<p:message id="calDtEndToMsg" for="calDtEndTo" display="icon"
											showDetail="false" />
									</p:calendar></td>
							</tr>
						</table></td>
				</tr>
			</p:outputPanel>
		</table>
		<ac:lovPopup />

		<ac:smGenerateReport bBean="#{smeSupplierRptBB}"
			reportCode="#{smReportBB.managedBean.reportCode}"
			generateMethod="generateReport" resetMethod="resetSearch">
		</ac:smGenerateReport>
	</p:outputPanel>
</ui:composition>
