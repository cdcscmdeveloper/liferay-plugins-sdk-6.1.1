<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{dirOwnCeoOneCompRptBB}" 
					required="true" showAll="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{dirOwnCeoOneCompRptBB}" 
				saveObj="dirOwnCeoOneCompRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.identificationNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{dirOwnCeoOneCompRptBB.managedBean.identificationNo}" style="width:289px;">
					<p:ajax event="blur" process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
		
			<!-- 15174 - Start -->
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.PersonnelName']}" />
			</td>
			
			<td class="tdContent">
				<p:inputText maxlength="200" style="width:289px;" value="#{dirOwnCeoOneCompRptBB.managedBean.personnelName}">
					<p:ajax event="blur" process="@form" partialSubmit="true"  update="@form" />
				</p:inputText>
			</td>
			<!-- 15174 - End -->
			
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNoFrom']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{dirOwnCeoOneCompRptBB.managedBean.mofRegNoFrom}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{dirOwnCeoOneCompRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{dirOwnCeoOneCompRptBB.managedBean.mofRegNoTo}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{dirOwnCeoOneCompRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.allregistereddatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{dirOwnCeoOneCompRptBB}" />
			</td>
			<td colspan="2"></td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{dirOwnCeoOneCompRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
