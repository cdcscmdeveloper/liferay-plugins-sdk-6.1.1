<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table class="customTbl">
		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.supplierType']}" /> <p:outputLabel value="*"
					styleClass="mandatory" /></td>
			<td class="tdContent"><ac:smReportSupplierType
					bBean="#{applVerificationPerformanceRptBB}" required="true"
					showAll="false" selectOne="true" /></td>
		</tr>

		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.po.receiveddatefrom']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td class="tdContent"><ac:smReportDateFromTo
					bBean="#{applVerificationPerformanceRptBB}" required="true" limitYearRange="true"
					dateRange="12" mandatoryDateTo="true" /></td>

			<td class="tdTitle">&#160;</td>
			<td class="tdContent">&#160;</td>
		</tr>
	</table>

	<ac:smGenerateReport bBean="#{applVerificationPerformanceRptBB}"
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
