<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.rpt.sm.SM_APPL_VERI_PERFORM_CLNT_CHARTER_ACHIVE_RPT_NAME']}" toggleable="true">
		<table class="customTbl">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /> <p:outputLabel value="*"
						styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<ac:smReportSupplierType />
				</td>
			</tr>
			
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.rpt.receiveddatefrom']}" /> 
					<p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td class="tdContent">
					<ac:smReportDateFromTo />
				</td>
			</tr>
		</table>
		
		<ac:smGenerateReport bBean="#{applVerificationRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
			generateMethod="generateReport" resetMethod="resetSearch">
		</ac:smGenerateReport>
	</p:panel>
</ui:composition>
