<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.paymentType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<!-- Enhancement #19245 -->
				<c:if test="#{!dailyReceivedRptBB.managedBean.isCdcCollector()}">
				<p:selectOneMenu 
					label="#{lbl['lbl.rpt.paymentType']}" id="paymentType"
					value="#{dailyReceivedRptBB.managedBean.paymentType}" required="true"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.payment.processingFee']}" itemValue="P" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.registrationfee']}" itemValue="R" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.softcertificate']}" itemValue="S" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				</c:if>
				<c:if test="#{dailyReceivedRptBB.managedBean.isCdcCollector()}">
				<p:selectOneMenu rendered="#{dailyReceivedRptBB.managedBean.isCdcCollector()}"
					label="#{lbl['lbl.rpt.paymentType']}" id="paymentType" style="width:300px;"
					value="#{dailyReceivedRptBB.managedBean.paymentType}" required="true">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.softcertificate']}" itemValue="S" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				</c:if>
				<!-- end of Enhancement #19245 -->
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.paymentdate']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{dailyReceivedRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.drpdown.documentTypelbl']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{dailyReceivedRptBB.managedBean.documentType}" styleClass="ppDropDownWidthM" style="margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{dailyReceivedRptBB.getDocumentTypeOptions()}" />
				</p:selectOneMenu>
			</td>
			<td class="tdTitle">	
			</td>
			<td class="tdContent">
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{dailyReceivedRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
