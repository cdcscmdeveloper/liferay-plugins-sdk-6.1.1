<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.registeredyearfrom']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.yearfrom']}"
					id="yearFrom" value="#{categoryStatYearRptBB.managedBean.year}" required="true"
					style="width:294px;">
					<f:selectItems
						value="#{categoryStatYearRptBB.managedBean.yearList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="yearFromMsg"
					for="yearFrom" display="icon" showDetail="false" />
			</td>
		</tr>
		
			
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.dtRangeTo']}"
					id="yearTo"
					value="#{categoryStatYearRptBB.managedBean.yearTo}" required="true"
					style="width:294px;">
					<f:selectItems
						value="#{categoryStatYearRptBB.managedBean.yearList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="yearToMsg" for="yearTo" display="icon" showDetail="false" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{categoryStatYearRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
