<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{categoryStatRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{categoryStatRptBB.managedBean.regStatus}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue=""></f:selectItem>
					<f:selectItems value="#{categoryStatRptBB.managedBean.regStatusLs}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" />
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.state']}" />
			</td>
			<td class="tdContent">
				<ac:smReportState bBean="#{categoryStatRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.district']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDistrict bBean="#{categoryStatRptBB}" />
			</td>
		</tr>
	</table>
	<br />
	

	<ac:smReportCategoryBidang bBean="#{categoryStatRptBB}" />
	<br />
	<br />
	<br />
	<br />

	<ac:smGenerateReport bBean="#{categoryStatRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
