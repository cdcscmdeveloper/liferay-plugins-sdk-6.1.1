<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{categoryStatRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstStatus']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{categoryStatRptBB.managedBean.regStatus}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue=""></f:selectItem>
					<f:selectItems value="#{categoryStatRptBB.managedBean.regStatusLs}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" />
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.state']}" />
			</td>
			<td class="tdContent">
			<!-- //#7754_#35984 - Start -->
				<!-- <ac:smReportState bBean="#{categoryStatRptBB}" /> --> 
				<p:selectOneMenu
					label="#{lbl['lbl.rpt.state']}" id="byZoneState"
					value="#{categoryStatRptBB.managedBean.stateByZone}"
					required="false" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItems value="#{categoryStatRptBB.managedBean.stateLstByZone}" />
					<p:ajax event="change" listener="#{categoryStatRptBB.onChangeStateByZone()}"
						process="@this" partialSubmit="true" update="@form" />
				</p:selectOneMenu> 
				<p:message id="byZoneStateMsg" for="byZoneState" display="icon" showDetail="false" />
			<!-- //#7754_#35984 - End -->
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.district']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDistrict bBean="#{categoryStatRptBB}" />
			</td>
		</tr>
		<!-- 32521 - START -->
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.categoryRegistered']}" />
			</td>
			<td>
				<!-- 32521 - START -->
				<ac:smReportDateFromTo bBean="#{categoryStatRptBB}" limitYearRange="true" dateRange="36" mandatoryDateTo="true"  />
				<!-- 32521 - END -->
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.disciplinaryActionStatus']}"  />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{categoryStatRptBB.managedBean.disciplinaryActionStatus}">
				<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.yes']}" itemValue="#{lbl['lbl.rpt.yes']}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.no']}" itemValue="#{lbl['lbl.rpt.no']}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<!-- 32521 - END -->
	</table>
	<br />
	

	<ac:smReportCategoryBidang bBean="#{categoryStatRptBB}" />
	<br />
	<br />
	<br />
	<br />

	<ac:smGenerateReport bBean="#{categoryStatRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
