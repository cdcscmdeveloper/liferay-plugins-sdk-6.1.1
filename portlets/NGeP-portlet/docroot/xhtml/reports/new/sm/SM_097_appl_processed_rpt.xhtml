<!-- 32521 - START -->
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{applProcessedRptBB.managedBean.zone}" id="zoneId"
					style="width:300px;" required="true" label="#{lbl['lbl.rpt.zone']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
						itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
						itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
						itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
				</p:selectOneMenu>
				<p:message id="zoneIdMsg" for="zoneId" display="icon" />
			</td>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.supplierType']}" /> <p:outputLabel value="*"
					styleClass="mandatory" /></td>
			<td class="tdContent"><ac:smReportSupplierType
					bBean="#{applProcessedRptBB}"
					showAll="true" selectOne="false" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationStatus']}" /></td>
			<td class="tdContent">
			<!-- 32521 - START -->
				<ac:smReportApplStatus bBean="#{applProcessedRptBB}" statusApplication="true"/>
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationType']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{applProcessedRptBB.managedBean.applType}" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.newAccRegMOF']}" itemValue="N"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.renewAccMOF']}" itemValue="R"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.updateAccMOF']}" itemValue="U"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.addCatCode']}" itemValue="A"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.bumiStatus']}" itemValue="B"></f:selectItem>
					<!-- 32521 - END -->
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.processingofficername']}"  />
			</td>
			<td class="tdContent">
						<ac:lov id="lovUser" lovId="PM_USER_ID" style="width:289px;" size="40"
		            	readonly="true" 
						headerText="#{lbl['lbl.pm.ta.user.lov']}"
						value="#{applProcessedRptBB.managedBean.selectedUser.userName}" 
						saveObject="applProcessedRptBB.managedBean.selectedUser" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationsubmitpodate']}" />
			</td>
			<td>
				<ac:smReportDateFromTo bBean="#{applProcessedRptBB}" limitYearRange="true" dateRange="12" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:lov id="smCompanyName" readonly="true" style="width:289px;"
					lovId="PM_ORG_PROFILE_WITH_COMPANY_REPORT" size="40"
					headerText="#{lbl['lbl.rpt.cmpName']}" 
					value="#{applProcessedRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="applProcessedRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
	</table>
	<ac:lovPopup />
	
	<ac:smGenerateReport bBean="#{applProcessedRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
<!-- 32521 - END -->
