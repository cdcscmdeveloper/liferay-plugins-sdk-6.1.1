<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<!-- #33741 - START -->
		<h:outputText value="#{lbl['lbl.rpt.instruction.oneyearmaxperiod']}" styleClass="splNotesFonts" escape="false" />
		<!-- #33741 - END -->
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
		<!-- 		 <p:outputLabel value="*" styleClass="mandatory" />  -->
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{suppPerformRptBB}" 
				saveObj="suppPerformRptBB.managedBean.selectedSupplierPerformance" update=":form:OrgMofNO"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" value="#{suppPerformRptBB.managedBean.mofNo}" 
				style="width:290px;" label="#{lbl['lbl.rpt.mofRegNo']}" id="OrgMofNO"/>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.epNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="12" value="#{suppPerformRptBB.managedBean.epNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.thresholdyearfrom']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>

			<td >
			<table style="width: 100%;">
			<tr>
			<td class="columnDateFromClass">
			<!-- #33741 - START -->
				<p:calendar showOn="button" navigator="true" id="calFromDate"
					display="inline" readonlyInput="true"
					value="#{suppPerformRptBB.managedBean.dateFrom}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						listener="#{suppPerformRptBB.findMinMaxDate('from', suppPerformRptBB.managedBean.dateFrom)}"
						update="@this, calToDate" />
				</p:calendar>
				<!-- #33741 - END -->
			</td><td class="columnDateToClass">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td >
				<!-- #33741 - START -->
				<p:calendar showOn="button" navigator="true" id="calToDate" 
					mindate="#{suppPerformRptBB.managedBean.minToDate}" maxdate="#{suppPerformRptBB.managedBean.maxToDate}"
					display="inline" readonlyInput="true"
					value="#{suppPerformRptBB.managedBean.dateTo}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						listener="#{suppPerformRptBB.findMinMaxDate('to', suppPerformRptBB.managedBean.dateTo)}"
						update="@this, calFromDate" />
				</p:calendar>
				<!-- #33741 - END -->
			</td>
			
			</tr>
			</table>
			
			
				
			</td>
			
			
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{suppPerformRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
