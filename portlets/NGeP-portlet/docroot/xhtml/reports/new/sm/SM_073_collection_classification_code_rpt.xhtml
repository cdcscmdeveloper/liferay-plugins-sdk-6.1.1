<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.code']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{colClassificationCodeBB.managedBean.classificationCode}" 
				label="#{lbl['lbl.rpt.code']}" style="width:300px;">
					<f:selectItem itemLabel="#{SmReportConst.classificationCode1}"
						itemValue="#{SmReportConst.classificationCode1}"></f:selectItem>
					<f:selectItem itemLabel="#{SmReportConst.classificationCode2}"
						itemValue="#{SmReportConst.classificationCode2}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">&#160;</td>
			<td class="tdContent">&#160;</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.transactiondatefrom']}" /> 
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{colClassificationCodeBB}" required="false" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.drpdown.documentTypelbl']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{colClassificationCodeBB.managedBean.documentType}" styleClass="ppDropDownWidthM" style="margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{colClassificationCodeBB.getDocumentTypeOptions()}" />
				</p:selectOneMenu>
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{colClassificationCodeBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>

</ui:composition>
