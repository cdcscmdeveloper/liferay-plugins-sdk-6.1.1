<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
	
	<!-- #7754 - Start -->
		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.zone']}" /> <p:outputLabel value="*"
					styleClass="mandatory" /></td>

			<td class="tdContent"><ac:smReportZoneList
					bBean="#{dailyRegApplRptBB}" showItemAll="true" /></td>
		</tr>
	<!-- #7754 - End -->
	
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportRegType bBean="#{dailyRegApplRptBB}" showAll="false" showUpgrade="true" showG2g="true"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{dailyRegApplRptBB}" 
				saveObj="dailyRegApplRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{dailyRegApplRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.subactdatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{dailyRegApplRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{dailyRegApplRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
