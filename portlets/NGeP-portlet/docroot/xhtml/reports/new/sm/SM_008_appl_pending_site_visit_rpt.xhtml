<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"

	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
	
	<!-- #7754 - Start -->
		<tr>
			<td class="tdTitle"><p:outputLabel

			<td class="tdContent"><ac:smReportZoneList
					bBean="#{applPendingSiteVisitRptBB}" showItemAll="true" /></td>
		</tr>
	<!-- #7754 - End -->	
		
		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.schedulesitevisitdatefrom']}" /></td>
			<td class="tdContent"><ac:smReportDateFromTo

			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.cmpName']}" /></td>

			<td class="tdContent"><ac:smReportCompanyNameLOV
					bBean="#{applPendingSiteVisitRptBB}"
					saveObj="applPendingSiteVisitRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
	</table>
	<br />
	

	<ac:smReportCategory bBean="#{applPendingSiteVisitRptBB}" />
	<br />
	<br />
	<br />
	<br />
	
	<ac:smGenerateReport bBean="#{applPendingSiteVisitRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"

	</ac:smGenerateReport>
