<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16" value="#{dailyReceiptRptBB.managedBean.applNo}" />
			</td>

			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.receiptno']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="100" value="#{dailyReceiptRptBB.managedBean.receiptNo}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.transactiondatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{dailyReceiptRptBB}" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.drpdown.documentTypelbl']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{dailyReceiptRptBB.managedBean.documentType}" styleClass="ppDropDownWidthM" style="margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{dailyReceiptRptBB.getDocumentTypeOptions()}" />
				</p:selectOneMenu>
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{dailyReceiptRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
