<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:panel header="#{lbl['lbl.rpt.sm.SM_APPL_APPROVED_RPT_NAME']}" toggleable="true">
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{applApprovedRptBB.managedBean.zone}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
						itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
						itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
						itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
					<ui:remove>
					<p:ajax event="change"
						listener="#{applApprovedRptBB.retrieveProcessingOfficerList}"
						partialSubmit="true" update="@form" />
					</ui:remove>
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:lov id="smCompanyName" readonly="true" style="width:289px;"
					lovId="PM_ORG_PROFILE_WITH_COMPANY_REPORT" size="40"
					headerText="#{lbl['lbl.rpt.cmpName']}" update="@form"
					value="#{applApprovedRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="applApprovedRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofNo.epNo']}" />

			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" value="#{applApprovedRptBB.managedBean.mofNo}" style="width:290px;" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.approvedyearfrom']}" />
			</td>
			<td class="tdContent">
				<table style="width: 100%;">
					<tr>
						<td class="columnGenClass"><p:outputLabel
								value="#{lbl['lbl.rpt.smApprovedDateFrm']}" /></td>
						<td class="columnDateFromClass"><p:calendar showOn="button"
								navigator="true" display="inline" readonlyInput="true" size="9"
								value="#{applApprovedRptBB.managedBean.dateFrom}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								partialSubmit="true" process="@form">
							</p:calendar></TD>
						<td class="columnDateToClass"><p:outputLabel
								value="#{lbl['lbl.rpt.dtRangeTo']}" /></TD>
						<td><p:calendar showOn="button" navigator="true" size="9"
								display="inline" readonlyInput="true"
								value="#{applApprovedRptBB.managedBean.dateTo}"
								style="columnDateToWidthClass"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
								partialSubmit="true" process="@form">
							</p:calendar>
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
</ui:composition>
