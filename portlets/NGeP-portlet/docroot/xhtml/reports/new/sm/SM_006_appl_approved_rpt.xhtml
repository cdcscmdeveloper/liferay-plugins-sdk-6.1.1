<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{applApprovedRptBB.managedBean.zone}" id="zoneId"
					style="width:300px;" required="true" label="#{lbl['lbl.rpt.zone']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
						itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
						itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
						itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
					<p:ajax event="change" update="@form" />	<!-- #32521 -->
				</p:selectOneMenu>
				<p:message id="zoneIdMsg" for="zoneId" display="icon" />
			</td>
			
			<!-- #32521 -->
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{applApprovedRptBB}"
					showAll="true" selectOne="false" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:lov id="smCompanyName" readonly="true" style="width:289px;"
					lovId="PM_ORG_PROFILE_WITH_COMPANY_REPORT" size="40"
					headerText="#{lbl['lbl.rpt.cmpName']}" 
					value="#{applApprovedRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="applApprovedRptBB.managedBean.selectedOrgProfile" 
					conditionField="#{applApprovedRptBB.getConditionFieldsCompany()}"/>	<!-- #32521 -->
			</td>
			<!-- 32521 - START -->
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.applicationType']}" /></td>
			<td class="tdContent"><p:selectOneMenu
					value="#{applApprovedRptBB.managedBean.applType}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.menu.all']}" itemValue="" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.menu.applType.newAccRegMOF']}"
						itemValue="N" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.menu.applType.renewAccMOF']}"
						itemValue="R" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.menu.applType.updateAccMOF']}"
						itemValue="U" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.menu.applType.addCatCode']}"
						itemValue="A" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.menu.applType.bumiStatus']}"
						itemValue="B" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<!-- 32521 - END -->
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />

			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" value="#{applApprovedRptBB.managedBean.mofNo}" 
				style="width:290px;" label="#{lbl['lbl.rpt.mofRegNo']}"/>
			</td>
			<!-- 32521 - START -->
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.approvedBy']}" /></td>
			<td class="tdContent"><ac:lov id="lovUser" lovId="PM_USER_ID_RPT"
					style="width:289px;" size="40" readonly="true"
					headerText="#{lbl['lbl.pm.ta.user.lov']}"
					value="#{applApprovedRptBB.managedBean.selectedUser.userName}"
					saveObject="applApprovedRptBB.managedBean.selectedUser"
					conditionField="#{applApprovedRptBB.getConditionFieldsPO(true)}" />
				<!-- #32521 --></td>
			<!-- 32521 - END -->
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.approveddatelabel']}" />
			</td>
			<td>
				<ac:smReportDateFromTo bBean="#{applApprovedRptBB}" />
			</td>
		</tr>
	</table>
	<ac:lovPopup />
	
	<ac:smGenerateReport bBean="#{applApprovedRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
