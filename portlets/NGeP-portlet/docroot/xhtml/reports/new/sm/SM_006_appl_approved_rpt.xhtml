<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{applApprovedRptBB.managedBean.zone}" id="zoneId"
					style="width:300px;" required="true" label="#{lbl['lbl.rpt.zone']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.semenanjung']}"
						itemValue="#{lbl['lbl.rpt.semenanjung']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sabah']}"
						itemValue="#{lbl['lbl.rpt.sabah']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sarawak']}"
						itemValue="#{lbl['lbl.rpt.sarawak']}"></f:selectItem>
				</p:selectOneMenu>
				<p:message id="zoneIdMsg" for="zoneId" display="icon" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:lov id="smCompanyName" readonly="true" style="width:289px;"
					lovId="PM_ORG_PROFILE_WITH_COMPANY_REPORT" size="40"
					headerText="#{lbl['lbl.rpt.cmpName']}" 
					value="#{applApprovedRptBB.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="applApprovedRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />

			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" value="#{applApprovedRptBB.managedBean.mofNo}" 
				style="width:290px;" label="#{lbl['lbl.rpt.mofRegNo']}"/>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.approveddatelabel']}" />
			</td>
			<td>
				<ac:smReportDateFromTo bBean="#{applApprovedRptBB}" />
			</td>
		</tr>
	</table>
	<ac:lovPopup />
	
	<ac:smGenerateReport bBean="#{applApprovedRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
