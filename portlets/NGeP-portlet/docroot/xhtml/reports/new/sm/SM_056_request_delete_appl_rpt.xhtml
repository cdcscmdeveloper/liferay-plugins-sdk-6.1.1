<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{reqDelApplWithStatRptBB}" required="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{reqDelApplWithStatRptBB}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.companyName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{reqDelApplWithStatRptBB}" 
				saveObj="reqDelApplWithStatRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16" value="#{reqDelApplWithStatRptBB.managedBean.applNo}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.reportType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{reqDelApplWithStatRptBB.managedBean.reportType}"
					style="width:300px;" required="true" label="#{lbl['lbl.rpt.reportType']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.deletependingapplverifi']}"
						itemValue="V"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.deletependingapplapprove']}"
						itemValue="A"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.deletependingapplreject']}"
						itemValue="R"></f:selectItem>
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.processingofficername']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu
					value="#{reqDelApplWithStatRptBB.managedBean.selectedPO}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="#{null}"></f:selectItem>
					<f:selectItems value="#{reqDelApplWithStatRptBB.managedBean.processingOfficerLs}"></f:selectItems>
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeFrm']}" /> 
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{reqDelApplWithStatRptBB}" required="false" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{reqDelApplWithStatRptBB}" 
			reportCode="#{smReportBB.managedBean.reportCode}"
			generateMethod="generateReport" resetMethod="resetSearch">
		</ac:smGenerateReport>
</ui:composition>
