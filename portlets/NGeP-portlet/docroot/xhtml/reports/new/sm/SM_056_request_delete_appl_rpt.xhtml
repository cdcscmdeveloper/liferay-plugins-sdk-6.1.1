<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="" required="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{profileOfRegCompanyRptBB}" required="true" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.companyName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{colReceiptTransDtRptBB}" 
				saveObj="colReceiptTransDtRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16" value="#{dailyReceiptRptBB.managedBean.applNo}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.reportType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{questionRespSummaryRptBB.managedBean.reportType}"
					style="width:300px;" required="true" label="#{lbl['lbl.rpt.reportType']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.deletependingapplverifi']}"
						itemValue="V"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.deletependingapplapprove']}"
						itemValue="A"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.deletependingapplreject']}"
						itemValue="R"></f:selectItem>
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.processingofficername']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu
					value="#{reportBackingBean.smProcessingOfficerName}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItems value="#{reportBackingBean.processingOfficerList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.code']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				
			</td>
			
			<td class="tdTitle">&#160;</td>
			<td class="tdContent">&#160;</td>
		</tr>
	</table>
</ui:composition>
