<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{applRequireSiteVisitRptBB}" showItemAll="true" />
			</td>
		
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{applRequireSiteVisitRptBB}" 
				saveObj="applRequireSiteVisitRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16"
					value="#{applRequireSiteVisitRptBB.managedBean.applNo}"
					style="width:290px;">
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.site.visit.status']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu
					value="#{applRequireSiteVisitRptBB.managedBean.siteVisitStatus}" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sv.after.approval']}"
						itemValue="A"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.sv.before.approval']}"
						itemValue="B"></f:selectItem>
				</p:selectOneMenu></td>
			
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.state']}" />
			</td>
			<td class="tdContent">
				<ac:smReportState bBean="#{applRequireSiteVisitRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.district']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDistrict bBean="#{applRequireSiteVisitRptBB}" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeFrm']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{applRequireSiteVisitRptBB}" />
			</td>
		</tr>
	</table>
	<br />
	

	<ac:smReportCategory bBean="#{applRequireSiteVisitRptBB}" />
	<br />
	<br />
	<br />
	<br />
	
	<ac:smGenerateReport bBean="#{applRequireSiteVisitRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
