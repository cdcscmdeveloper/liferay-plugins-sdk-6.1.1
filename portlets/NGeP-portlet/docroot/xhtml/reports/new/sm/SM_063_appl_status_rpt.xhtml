<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />

			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" value="#{applStatusRptBB.managedBean.mofNo}" readonly="true"
				style="width:290px;" label="#{lbl['lbl.rpt.mofRegNo']}"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16"
					value="#{applStatusRptBB.managedBean.applNo}"
					style="width:290px;">
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationType']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{applStatusRptBB.managedBean.applType}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue=""></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforBasicOnlineAccount']}"
						itemValue="O"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.NewApplicationforMOF']}"
						itemValue="N"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforBumiputeraStatus']}"
						itemValue="B"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforaddCategoryCode']}"
						itemValue="A"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforupdateMOFprofile']}"
						itemValue="U"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.RenewMOFAccount']}"
						itemValue="R"></f:selectItem>
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.drpdown.CancelMOFAccount']}"
						itemValue="C"></f:selectItem>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="20"  required="true"  readonly="true"
				label="#{lbl['lbl.rpt.business.registrationNo']}"
					value="#{applStatusRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>

		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.application.submissiondatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{applStatusRptBB}" />
			</td>
			<td colspan="2">&#160;</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{applStatusRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
