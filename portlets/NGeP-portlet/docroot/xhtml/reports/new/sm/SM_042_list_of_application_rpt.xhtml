<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{listOfApplicationRptBB}" required="true" showItemAll="true"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{listOfApplicationRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16"
					value="#{listOfApplicationRptBB.managedBean.applNo}"
					style="width:290px;">
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationStatus']}" />

			</td>
			<td class="tdContent">
				<ac:smReportApplProgressStatus bBean="#{listOfApplicationRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.epNo.mofNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="12" value="#{listOfApplicationRptBB.managedBean.epNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{listOfApplicationRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supportingDocumentMode']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportSuppDocMode bBean="#{listOfApplicationRptBB}" required="true" showItemAll="true"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supportingDocumentStatus']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu
					value="#{listOfApplicationRptBB.managedBean.suppDocStatus}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.complete']}"
						itemValue="#{SmReportConst.SM_COMPLETE}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.inncomplete']}"
						itemValue="#{SmReportConst.SM_IN_COMPLETE}"></f:selectItem>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.application.submissiondatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{listOfApplicationRptBB}" />
			</td>
			<!-- 32521 - START -->
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationType']}" /></td>
			<td class="tdContent">
				<p:selectOneMenu value="#{listOfApplicationRptBB.managedBean.applType}" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.NewApplicationforMOF']}" itemValue="N" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.renewAccMOF']}" itemValue="R" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.updateAccMOF']}" itemValue="U" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.addCatCode']}" itemValue="A" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.bumiStatus']}" itemValue="B" />
				</p:selectOneMenu>
				
			</td>
			<!-- 32521 - END -->
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{listOfApplicationRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
