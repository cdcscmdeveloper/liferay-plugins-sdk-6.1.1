<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{listPersMoreCompRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{listPersMoreCompRptBB}" 
				saveObj="listPersMoreCompRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.role']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{listPersMoreCompRptBB.managedBean.role}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.director']}" itemValue="#{SmReportConst.SM_ROLE_DIRECTOR}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.owner']}" itemValue="#{SmReportConst.SM_ROLE_OWNER}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.highermanagemnt']}" itemValue="#{SmReportConst.SM_ROLE_CEO}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.identificationNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{listPersMoreCompRptBB.managedBean.identificationNo}" style="width:289px;">
					<p:ajax event="blur" process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNoFrom']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{listPersMoreCompRptBB.managedBean.mofRegNoFrom}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{listPersMoreCompRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{listPersMoreCompRptBB.managedBean.mofRegNoTo}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{listPersMoreCompRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofregistereddatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{listPersMoreCompRptBB}" />
			</td>
			<td colspan="2"></td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{listPersMoreCompRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
