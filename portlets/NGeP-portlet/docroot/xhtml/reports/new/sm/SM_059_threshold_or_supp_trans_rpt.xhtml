<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{thresholdOrSuppTransRptBB}" showItemAll="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{thresholdOrSuppTransRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{thresholdOrSuppTransRptBB}" 
				saveObj="thresholdOrSuppTransRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofNo.epNo']}" />

			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" value="#{thresholdOrSuppTransRptBB.managedBean.mofNo}" style="width:290px;" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportRegType bBean="#{thresholdOrSuppTransRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{thresholdOrSuppTransRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.thresholdyearfrom']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.thresholdyearfrom']}"
					id="yearFrom" value="#{thresholdOrSuppTransRptBB.managedBean.year}" required="true"
					style="width:294px;">
					<f:selectItems
						value="#{thresholdOrSuppTransRptBB.managedBean.yearList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="yearFromMsg"
					for="yearFrom" display="icon" showDetail="false" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.dtRangeTo']}"
					id="yearTo"
					value="#{thresholdOrSuppTransRptBB.managedBean.yearTo}" required="true"
					style="width:294px;">
					<f:selectItems
						value="#{thresholdOrSuppTransRptBB.managedBean.yearList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="yearToMsg" for="yearTo" display="icon" showDetail="false" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{thresholdOrSuppTransRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
