<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{questionRespSummaryRptBB}" required="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{questionRespSummaryRptBB}" allValue="all"/>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.reportType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{questionRespSummaryRptBB.managedBean.reportType}"
					style="width:300px;" required="true" label="#{lbl['lbl.rpt.reportType']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.responserpt']}" itemValue="#{SmReportConst.SM_RESPONSE_REPORT}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.summaryrpt']}" itemValue="#{SmReportConst.SM_SUMMARY_REPORT}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.submissiondatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{questionRespSummaryRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{questionRespSummaryRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
