<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="smReportMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>

		<table style="margin-bottom: 10px; width: 100%;">
			<tr>
				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>

				<td width="90%">
					<p:selectOneMenu
						label="#{lbl['lbl.rpt.rptName']}" id="reportName"
						value="#{smReportBB.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue=""></f:selectItem>

						<f:selectItems
							value="#{smReportBB.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change" update="outputPnlSmReport" listener="#{smReportBB.reportOnChange}" />
					</p:selectOneMenu></td>
			</tr>
		</table>

		<p:outputPanel id="outputPnlSmReport">
			<p:panel header="#{smReportBB.managedBean.reportTitle}" rendered="#{!empty smReportBB.managedBean.reportCode}">
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smApplicationVerificationRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_005_appl_verification_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smApplicationApprovedRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_006_appl_approved_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smApplicationRejectedRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_007_appl_rejected_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smAgencyStatistical}">
					<ui:include src="/xhtml/reports/new/sm/SM_064_agency_stat_status_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smApplClientCharterRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_011_appl_verification_performance.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smCdcssDepositAdjustmentRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_077_cdc_deposit_adjustment_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smRegCompanyInMofRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_001_profile_of_reg_company.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smDailyAppSubmitted}">
					<ui:include src="/xhtml/reports/new/sm/SM_061_daily_appl_submit_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smListOfApplStatus}">
					<ui:include src="/xhtml/reports/new/sm/SM_063_appl_status_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smListOfGstRgstrdSupplier}">
					<ui:include src="/xhtml/reports/new/sm/SM_065_gst_registered_supplier_rpt.xhtml"></ui:include>
				</c:if>
				
				<c:if test="#{smReportBB.managedBean.reportCode eq SmReportConst.smVirtualDayReportRptVal}">
					<ui:include src="/xhtml/reports/new/sm/SM_044_virtual_cert_release_rpt.xhtml"></ui:include>
				</c:if>
				
			</p:panel>
		</p:outputPanel>
	</ui:define>


</ui:composition>
