<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.zone']}" /> <p:outputLabel value="*"
					styleClass="mandatory" /></td>

			<td class="tdContent"><ac:smReportZoneList
					bBean="#{applRevisedRptBB}" showItemAll="true"
					disabled="#{applRevisedRptBB.managedBean.flag}" required="true"/></td>

			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.cmpName']}" /></td>
			<td class="tdContent"><ac:smReportCompanyNameLOV
					bBean="#{applRevisedRptBB}"
					saveObj="applRevisedRptBB.managedBean.selectedOrgProfile" /></td>
		</tr>

		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.supplierType']}" /></td>
			<td class="tdContent"><p:selectOneMenu
					value="#{applRevisedRptBB.managedBean.supplierType}"
					style="width:300px;" 
					disabled="#{applRevisedRptBB.managedBean.flag}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}"
						itemValue="#{cc.attrs.allValue}"></f:selectItem>
				<!-- #12483 - START -->
					<f:selectItem itemLabel="#{lbl['lbl.rpt.contractor']}"
						itemValue="#{SupplierManagementConst.SUPP_TYPE_CONTRACTOR}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.consultant']}"
						itemValue="#{SupplierManagementConst.SUPP_TYPE_CONSULTANT}"></f:selectItem>
				<!-- #12483 - END -->
				</p:selectOneMenu></td>

			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.applicationNo']}" /></td>
			<td class="tdContent"><p:inputText maxlength="16"
					value="#{applRevisedRptBB.managedBean.applNo}" style="width:290px;">
				</p:inputText></td>
		</tr>

		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.applicationType']}" /></td>
			<td class="tdContent"><p:selectOneMenu
					value="#{applRevisedRptBB.managedBean.applType}"
					style="width:300px;" >
					<f:selectItem itemLabel="#{lbl['lbl.rpt.all']}" itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.newAccRegMOF']}"
						itemValue="N"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.renewAccMOF']}"
						itemValue="R"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.applType.updateAccMOF']}"
						itemValue="U"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.addCatCode']}"
						itemValue="A"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.bumiStatus']}"
						itemValue="B"></f:selectItem>
				</p:selectOneMenu>
				
			</td>

			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.sendrevisedfrom']}" /></td>
			<td><ac:smReportDateFromTo bBean="#{applRevisedRptBB}"  required="true"/></td>
		</tr>

	</table>
	<ac:lovPopup />

	<ac:smGenerateReport bBean="#{applRevisedRptBB}"
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
