<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.smPaymentType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent" colspan="3">
				<ac:smReportPaymentType id="paymentType" required="true" bBean="#{colReceiptTransDtRptBB}"/>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.companyName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{colReceiptTransDtRptBB}" 
				saveObj="colReceiptTransDtRptBB.managedBean.selectedOrgProfile" />
			</td>

			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.reportType']}" />
			</td>
			
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.reportType']}" id="ReportType"
				value="#{colReceiptTransDtRptBB.managedBean.reportType}" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.rpttypetarikhresit']}"
						itemValue="#{lbl['lbl.rpt.rpttypetarikhresit']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.rpttypetarikhtransaksi']}"
						itemValue="#{lbl['lbl.rpt.rpttypetarikhtransaksi']}"></f:selectItem>
				</p:selectOneMenu>
			</td>
			
		</tr>
	
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.receiptdatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{colReceiptTransDtRptBB}" required="false" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.drpdown.documentTypelbl']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{colReceiptTransDtRptBB.managedBean.documentType}" styleClass="ppDropDownWidthM" style="margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{colReceiptTransDtRptBB.getDocumentTypeOptions()}" />
				</p:selectOneMenu>
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{colReceiptTransDtRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
