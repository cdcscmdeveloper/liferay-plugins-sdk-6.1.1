<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
	
		<!-- #7754 - Start -->
		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.zone']}" /> <p:outputLabel value="*"
					styleClass="mandatory" /></td>

			<td class="tdContent"><ac:smReportZoneList
					bBean="#{expiredCompanyRptBB}" showItemAll="true" /></td>
		</tr>
	<!-- #7754 - End -->	
	
		<tr>
			<td class="tdTitle"><p:outputLabel
					value="#{lbl['lbl.rpt.supplierType']}" /> <p:outputLabel value="*"
					styleClass="mandatory" /></td>
			<td class="tdContent"><ac:smReportSupplierType
					bBean="#{expiredCompanyRptBB}" /></td>
					
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{expiredCompanyRptBB}" 
				saveObj="expiredCompanyRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
	
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.expirydatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{expiredCompanyRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{expiredCompanyRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
