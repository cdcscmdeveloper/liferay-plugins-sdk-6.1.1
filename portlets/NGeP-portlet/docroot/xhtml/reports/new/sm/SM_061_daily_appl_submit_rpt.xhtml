<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationStatus']}" />

			</td>
			<td class="tdContent">
				<ac:smReportApplProgressStatus bBean="#{dailyApplSubmitRptBB}" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportRegType bBean="#{dailyApplSubmitRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.state']}" />
			</td>
			<td class="tdContent">
				<ac:smReportState bBean="#{dailyApplSubmitRptBB}" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.submissiondatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{dailyApplSubmitRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{dailyApplSubmitRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
