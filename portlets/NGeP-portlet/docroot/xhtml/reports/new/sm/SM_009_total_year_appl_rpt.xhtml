<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{totalYearApplRptBB}" required="true" showItemAll="true"/>
			</td>
			<td colspan="2"></td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.frommonth']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.frommonth']}" id="mandatoryFromMonth"
					value="#{totalYearApplRptBB.managedBean.monthFrom}" required="true"
					style="width:294px;">
					<f:selectItems value="#{totalYearApplRptBB.managedBean.monthList}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="mandatoryFromMonthMsg"
					for="mandatoryFromMonth" display="icon" showDetail="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.tomonth']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.tomonth']}"
					id="mandatoryToMonth" value="#{totalYearApplRptBB.managedBean.monthTo}"
					required="true" style="width:294px;">
					<f:selectItems value="#{totalYearApplRptBB.managedBean.monthList}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="mandatoryToMonthMsg" for="mandatoryToMonth"
					display="icon" showDetail="false" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.yearfrom']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.yearfrom']}"
					id="mandatoryFromYear"
					value="#{totalYearApplRptBB.managedBean.year}" required="true"
					style="width:294px;">
					<f:selectItems
						value="#{totalYearApplRptBB.managedBean.yearList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="mandatoryFromYearMsg"
					for="mandatoryFromYear" display="icon" showDetail="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.dtRangeTo']}"
					id="mandatoryToYear" value="#{totalYearApplRptBB.managedBean.yearTo}"
					required="true" style="width:297px;">
					<f:selectItems
						value="#{totalYearApplRptBB.managedBean.yearList}"></f:selectItems>
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="mandatoryToYearMsg" for="mandatoryToYear"
					display="icon" showDetail="false" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{totalYearApplRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
