<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{statCompTypeCapitalRptBB}" showItemAll="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{statCompTypeCapitalRptBB}" allValue="all" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.busComptype']}" />
			</td>
		
			<td class="tdContent">
				<p:selectOneMenu value="#{statCompTypeCapitalRptBB.managedBean.bussType}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItems value="#{statCompTypeCapitalRptBB.managedBean.bussTypeList}" />
					<p:ajax event="change" process="@this"
						listener="#{statCompTypeCapitalRptBB.onChangeBussType}"
						partialSubmit="true" update="@form" />
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofregistereddatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{statCompTypeCapitalRptBB}" />
			</td>
		</tr>
		<p:outputPanel rendered="#{not empty statCompTypeCapitalRptBB.managedBean.capitalLabel}">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{statCompTypeCapitalRptBB.managedBean.capitalLabel}" />
				</td>
			
				<td class="tdContent">
					<p:inputText maxlength="40"
						value="#{statCompTypeCapitalRptBB.managedBean.capitalShareFrom}"
						style="width:289px;">
						<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
					</p:inputText>
				</td>
				
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
				</td>
				<td class="tdContent">
					<p:inputText maxlength="40"
						value="#{statCompTypeCapitalRptBB.managedBean.capitalShareTo}"
						style="width:289px;">
						<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
					</p:inputText>
				</td>
			</tr>
		</p:outputPanel>
	</table>
	
	<ac:smGenerateReport bBean="#{statCompTypeCapitalRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
