<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{virtualCertReleasedRptBB}" showItemAll="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{virtualCertReleasedRptBB}" 
				saveObj="virtualCertReleasedRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.virtualcertdate']}" />
			</td>
			<td>
				<ac:smReportDateFromTo bBean="#{virtualCertReleasedRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{virtualCertReleasedRptBB}"
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
