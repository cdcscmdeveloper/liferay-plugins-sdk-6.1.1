<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{companyAddrListRptBB}" allValue="all"/>
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{companyAddrListRptBB}" 
				saveObj="companyAddrListRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applStatus']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<p:selectOneMenu label="#{lbl['lbl.rpt.applStatus']}"  
					value="#{companyAddrListRptBB.managedBean.applStatus}" style="width:300px;" 
					required="true">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.approvedLabel']}"
						itemValue="Approved"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.rejectedLabel']}"
						itemValue="Rejected"></f:selectItem>
					<p:ajax event="change" partialSubmit="true"
						update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationType']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{companyAddrListRptBB.managedBean.applType}"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.NewApplicationforMOF']}" itemValue="N" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.RenewMOFAccount']}" itemValue="R" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforaddCategoryCode']}" itemValue="A" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforBumiputeraStatus']}" itemValue="B" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.drpdown.ApplicationforupdateMOFprofile']}" itemValue="U" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supportingDocumentMode']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportSuppDocMode bBean="#{companyAddrListRptBB}" required="true" showItemAll="true"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.approvaldatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{companyAddrListRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{companyAddrListRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
