<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{offlineSuppDocPendSubRptBB}" required="true" showItemAll="true"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="16"
					value="#{offlineSuppDocPendSubRptBB.managedBean.applNo}"
					style="width:290px;">
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.epNo.mofNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="12" value="#{offlineSuppDocPendSubRptBB.managedBean.epNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{offlineSuppDocPendSubRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.application.submissiondatefrom']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{offlineSuppDocPendSubRptBB}" />
			</td>
			<td colspan="2"></td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{offlineSuppDocPendSubRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
