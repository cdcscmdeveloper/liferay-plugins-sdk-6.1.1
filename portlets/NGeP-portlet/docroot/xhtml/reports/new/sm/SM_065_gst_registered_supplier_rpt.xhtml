<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{gstRegSupplierRptBB}" showItemAll="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{gstRegSupplierRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{gstRegSupplierRptBB}" 
				saveObj="gstRegSupplierRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportRegType bBean="#{gstRegSupplierRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{gstRegSupplierRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.gstregistrationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{gstRegSupplierRptBB.managedBean.gstRegNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.gstregisteredstatus']}" />
				<p:outputLabel value="*" styleClass="mandatory" />	
			</td>
		
			<td class="tdContent">
				<p:selectOneMenu value="#{gstRegSupplierRptBB.managedBean.gstRegStatus}" 
					required="true" style="width:300px;" id="gstRegStatusId" 
					label="#{lbl['lbl.rpt.gstregisteredstatus']}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.active']}" itemValue="#{SmReportConst.SM_STATUS_ACTIVE}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.inactive']}" itemValue="#{SmReportConst.SM_STATUS_INACTIVE}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu>
				<p:message id="gstRegStatusIdMsg" for="gstRegStatusId" showSummary="true" 
					showDetail="false" display="icon" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.gsteffectivedate']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{gstRegSupplierRptBB}" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{gstRegSupplierRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
