<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{profileOfRegCompanyRptBB}"  showItemAll="true" required="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{profileOfRegCompanyRptBB}" required="false" allValue="all" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ui:remove>
					<p:inputText maxlength="20" required="true" 
					label="#{lbl['lbl.rpt.mofRegNo']}"
					value="#{profileOfRegCompanyRptBB.managedBean.mofNo}" style="width:290px;" />
				</ui:remove>
		
				<ac:lov id="supplier" lovId="SM_SUPPLIER_RPT" 
					headerText="#{lbl['lbl.sm.supplov']}" 
					saveObject="profileOfRegCompanyRptBB.managedBean.smSupplier"
					value="#{profileOfRegCompanyRptBB.managedBean.mofNo}"
					conditionField="recordStatus^1|smMofAccounts.recordStatus^3*smMofAccounts.recordStatus^1#{profileOfRegCompanyRptBB.mofNoCriteria}"
					postUpdateListener="profileOfRegCompanyRptBB.populateMofNo"
					tooltip="#{lbl['lbl.sm.rpt.profile.tooltip']}" >
				</ac:lov>
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{profileOfRegCompanyRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
	<ac:lovPopup />
</ui:composition>
