<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{profileOfRegCompanyRptBB}"  showItemAll="true" required="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{profileOfRegCompanyRptBB}" required="true" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" required="true" 
				label="#{lbl['lbl.rpt.mofRegNo']}"
				value="#{profileOfRegCompanyRptBB.managedBean.mofNo}" style="width:290px;" />
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{profileOfRegCompanyRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
