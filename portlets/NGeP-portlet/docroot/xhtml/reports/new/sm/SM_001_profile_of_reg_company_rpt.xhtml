<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{profileOfRegCompanyRptBB}"  showItemAll="true" required="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.accountType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportRegType bBean="#{profileOfRegCompanyRptBB}" selectOne="true" showAll="false" compProfile="true" required="true" />
			</td>
		</tr>
		
		<p:outputPanel rendered="#{profileOfRegCompanyRptBB.managedBean.regType eq SmReportConst.SM_REG_TYPE_BASIC}">
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<!-- #30824 & #29712, #32564 - start -->
			<!-- 
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{profileOfRegCompanyRptBB}" required="true"
				saveObj="profileOfRegCompanyRptBB.managedBean.selectedOrgProfile" />
			</td>
			 -->
			<td class="tdContent">
				<ac:smReportBasicSupplier bBean="#{profileOfRegCompanyRptBB}" required="true"
				saveObj="profileOfRegCompanyRptBB.managedBean.selectedSupplier" />
			</td>
		</p:outputPanel>
		<!-- #30824 & #29712, #32564 - end -->
		
		<p:outputPanel rendered="#{profileOfRegCompanyRptBB.managedBean.regType eq SmReportConst.SM_REG_TYPE_G2G}">
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.sm.agency.type']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent"><ac:smReportOrganizationType
					bBean="#{profileOfRegCompanyRptBB}" selectOne="true" required="true"
					saveObj="profileOfRegCompanyRptBB.managedBean.selectedOrgProfile" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.sm.agency.name']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ui:remove>
					<p:inputText maxlength="255" required="true" size="150"
					label="#{lbl['lbl.rpt.mofRegNo']}"
					value="#{profileOfRegCompanyRptBB.managedBean.agencyName}" style="width:290px;" />
				</ui:remove>
				<!-- #30824 & #29712, #32564 - start -->
				<ac:lov id="g2g" lovId="SM_RPT_G2G_ACCOUNT"
					headerText="#{lbl['lbl.rpt.organization.list.lov']}"
					value="#{profileOfRegCompanyRptBB.managedBean.selectedOrgProfile.pmOrgValidity.orgName}" 
					saveObject="profileOfRegCompanyRptBB.managedBean.selectedOrgProfile"
					conditionField="#{profileOfRegCompanyRptBB.constructConditionFields()}"
					tooltip="#{lbl['lbl.sm.rpt.profile.tooltip']}" >
				</ac:lov>
				<!-- #30824 & #29712, #32564 - end -->
			</td>
		</p:outputPanel>
		
		<p:outputPanel rendered="#{profileOfRegCompanyRptBB.managedBean.regType eq SmReportConst.SM_REG_TYPE_MOF}">
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ui:remove>
					<p:inputText maxlength="20" required="true" size="150"
					label="#{lbl['lbl.rpt.mofRegNo']}"
					value="#{profileOfRegCompanyRptBB.managedBean.mofNo}" style="width:290px;" />
				</ui:remove>
				<!-- #30824 & #29712, #32564 - start -->
				<ac:lov id="supplier" lovId="SM_RPT_MOF_ACCOUNT"
					headerText="#{lbl['lbl.sm.supplov']}"
					value="#{profileOfRegCompanyRptBB.managedBean.mofNo}" 
					saveObject="profileOfRegCompanyRptBB.managedBean.smSupplier"
					conditionField="#{profileOfRegCompanyRptBB.constructConditionFields()}"
					postUpdateListener="profileOfRegCompanyRptBB.populateMofNo"
					tooltip="#{lbl['lbl.sm.rpt.profile.tooltip']}" >
				</ac:lov>
				<!-- #30824 & #29712, #32564 - end -->
			</td>

			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{profileOfRegCompanyRptBB}" required="true" allValue="all" />
			</td>
		</p:outputPanel>
	</table>
	
	<ac:smGenerateReport bBean="#{profileOfRegCompanyRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
	<ac:lovPopup />
</ui:composition>
