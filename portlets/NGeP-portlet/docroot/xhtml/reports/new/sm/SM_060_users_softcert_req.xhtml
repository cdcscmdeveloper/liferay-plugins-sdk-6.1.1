<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.username']}" /> 
			</td>
			<td class="tdContent">
				<p:inputText maxlength="100" value="#{userSoftcertReqRptBB.managedBean.userName}" style="width:290px;">
				</p:inputText>
			</td>

			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.companyName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{userSoftcertReqRptBB}" 
				saveObj="userSoftcertReqRptBB.managedBean.selectedOrgProfile" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofNo']}" /> 
			</td>
			<td class="tdContent" colspan="3">
				<p:inputText maxlength="20"
					value="#{userSoftcertReqRptBB.managedBean.mofNo}" style="width:290px;">
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" /> 
			</td>
			<td class="tdContent" colspan="3">
				<p:inputText maxlength="20" 
					value="#{userSoftcertReqRptBB.managedBean.regNo}" style="width:290px;">
				</p:inputText>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.type.date']}" /> 
			</td>
			<td class="tdContent">
				<p:selectOneRadio id="reqexpdate" style="width:376px"
						value="#{userSoftcertReqRptBB.managedBean.softcertDateType}">
						<f:selectItem itemLabel="#{lbl['lbl.rptsoftcertreqdate']}"
							itemValue="#{SmReportConst.softcertReqDate}" />
						<f:selectItem itemLabel="#{lbl['lbl.rptsoftexpdate']}"
							itemValue="#{SmReportConst.softcertExpDate}" />
						<f:selectItem itemLabel="#{lbl['lbl.rptsoftrenewaldate']}"
							itemValue="#{SmReportConst.softcertRenewDate}" />
						<p:ajax event="change"  update="pnlDateType" />
					</p:selectOneRadio>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.identificationnumber']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="40" value="#{userSoftcertReqRptBB.managedBean.identificationNo}"
					style="width:290px;">
				</p:inputText>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputPanel id="pnlDateType">
					<p:outputLabel value="#{lbl['lbl.rpt.softcertreqdatefrom']}" rendered="#{userSoftcertReqRptBB.managedBean.softcertDateType == SmReportConst.softcertReqDate}" />
					<p:outputLabel value="#{lbl['lbl.rpt.softcertexpdatefrom']}" rendered="#{userSoftcertReqRptBB.managedBean.softcertDateType == SmReportConst.softcertExpDate}" />
					<p:outputLabel value="#{lbl['lbl.rpt.softcertrenewaldatefrom']}" rendered="#{userSoftcertReqRptBB.managedBean.softcertDateType == SmReportConst.softcertRenewDate}" />
				</p:outputPanel>
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{userSoftcertReqRptBB}" required="false" />
			</td>
		</tr>
		
		<ac:smGenerateReport bBean="{userSoftcertReqRptBB}" 
			reportCode="#{smReportBB.managedBean.reportCode}"
			generateMethod="generateReport" resetMethod="resetSearch">
		</ac:smGenerateReport>
		
	</table>
</ui:composition>
