<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.username']}" /> 
			</td>
			<td class="tdContent">
				<p:inputText maxlength="100" value="#{userSoftcertReqRptBB.managedBean.userName}" 
					style="width:290px;" disabled="#{userSoftcertReqRptBB.managedBean.supplierUser}">
				</p:inputText>
			</td>

			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.companyName']}" />
			</td>
			<td class="tdContent">
				<p:outputPanel rendered="#{!userSoftcertReqRptBB.managedBean.supplierUser}">
					<ac:smReportCompanyNameLOV bBean="#{userSoftcertReqRptBB}" 
					saveObj="userSoftcertReqRptBB.managedBean.selectedOrgProfile" />
				</p:outputPanel>
				<p:outputPanel rendered="#{userSoftcertReqRptBB.managedBean.supplierUser}">
					<p:inputText maxlength="100" value="#{userSoftcertReqRptBB.managedBean.companyName}" 
						style="width:290px;" disabled="#{userSoftcertReqRptBB.managedBean.supplierUser}">
					</p:inputText>
				</p:outputPanel>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofNo']}" /> 
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" disabled="#{userSoftcertReqRptBB.managedBean.supplierUser}"
					value="#{userSoftcertReqRptBB.managedBean.mofNo}" style="width:290px;">
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" /> 
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20" disabled="#{userSoftcertReqRptBB.managedBean.supplierUser}"
					value="#{userSoftcertReqRptBB.managedBean.regNo}" style="width:290px;">
				</p:inputText>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationType']}" /> 
			</td>
			<td class="tdContent">
				<p:selectOneMenu id="certAppType" style="width:376px"
					value="#{userSoftcertReqRptBB.managedBean.certApplicationType}" >
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.softcert.new']}"
						itemValue="#{SmReportConst.certAppNew}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.softcert.renew']}"
						itemValue="#{SmReportConst.certAppRenew}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.softcert.reapply']}"
						itemValue="#{SmReportConst.certAppReapply}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.softcert.revoke']}"
						itemValue="#{SmReportConst.certAppRevoke}" />
					<p:ajax event="change" update="reqexpdate,certStatus" listener="#{userSoftcertReqRptBB.certAppTypeOnChange}" />
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.identificationnumber']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="40" value="#{userSoftcertReqRptBB.managedBean.identificationNo}"
					disabled="#{userSoftcertReqRptBB.managedBean.supplierUser}" style="width:290px;">
				</p:inputText>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.type.date']}" /> 
			</td>
			<td class="tdContent">
				<p:selectOneMenu id="reqexpdate" style="width:376px"
					value="#{userSoftcertReqRptBB.managedBean.softcertDateType}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.cert.request.date']}"
						itemValue="#{SmReportConst.softcertRequestDate}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.cert.issued.date']}"
						itemValue="#{SmReportConst.softcertIssuedDate}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.cert.expiry.date']}"
						itemValue="#{SmReportConst.softcertExpiryDate}" />
					<c:if test="#{userSoftcertReqRptBB.managedBean.showRevoke}">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.cert.revoke.date']}"
							itemValue="#{SmReportConst.softcertRevocationDate}" />
					</c:if>
				</p:selectOneMenu>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applStatus']}" /> 
			</td>
			<td class="tdContent">
				<p:selectOneMenu id="certStatus" style="width:376px"
					value="#{userSoftcertReqRptBB.managedBean.certStatus}"
					disabled="#{userSoftcertReqRptBB.managedBean.showRevoke}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.cert.appl.status.pending.request']}"
						itemValue="#{SmReportConst.certStatusPendingRequest}" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.cert.appl.status.pending.payment']}"
						itemValue="#{SmReportConst.certStatusPendingPayment}" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.cert.appl.status.pending.issuance']}"
						itemValue="#{SmReportConst.certStatusPendingIssuance}" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.cert.appl.status.renewal.ready']}"
						itemValue="#{SmReportConst.certStatusRenewalReady}" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.cert.appl.status.issued']}"
						itemValue="#{SmReportConst.certStatusIssued}" />
					<f:selectItem
						itemLabel="#{lbl['lbl.rpt.cert.appl.status.rejected']}"
						itemValue="#{SmReportConst.certStatusRejected}" />
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cert.date.from']}"  />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{userSoftcertReqRptBB}" required="false" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.sm.softcert.provider']}" 
				  rendered="#{userSoftcertReqRptBB.managedBean.showCertProvider}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu id="certProvider"
				  value="#{userSoftcertReqRptBB.managedBean.certProvider}"
				  rendered="#{userSoftcertReqRptBB.managedBean.showCertProvider}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue="" />
					<f:selectItem itemLabel="Digi Cert"
						itemValue="#{SmReportConst.providerDigiCert}" />
					<f:selectItem itemLabel="Trust Gate"
						itemValue="#{SmReportConst.providerTrustGate}" />
				</p:selectOneMenu>
			</td>
		</tr>
		
	</table>
	
	<ac:smGenerateReport bBean="#{userSoftcertReqRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
