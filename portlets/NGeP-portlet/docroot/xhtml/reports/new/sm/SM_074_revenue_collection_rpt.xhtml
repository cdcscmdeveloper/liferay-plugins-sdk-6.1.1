<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	

	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.smPaymentType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent" colspan="3">
				<ac:smReportPaymentType id="paymentType" required="true" bBean="#{revenueCollectionRptBB}" />
			</td>
		</tr>
	
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.expirydatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{revenueCollectionRptBB}" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.drpdown.documentTypelbl']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{revenueCollectionRptBB.managedBean.documentType}" styleClass="ppDropDownWidthM" style="margin-bottom: 5px;">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{revenueCollectionRptBB.getDocumentTypeOptions()}" />
				</p:selectOneMenu>
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{revenueCollectionRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
