<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.smPaymentType']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent" colspan="3">
				<ac:smReportPaymentType id="paymentType" required="true" bBean="#{revenueCollectionRptBB}" />
			</td>
		</tr>
	
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.expirydatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{revenueCollectionRptBB}" />
			</td>
			<td class="tdTitle">&#160;</td>
			<td class="tdContent">&#160;</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{revenueCollectionRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
