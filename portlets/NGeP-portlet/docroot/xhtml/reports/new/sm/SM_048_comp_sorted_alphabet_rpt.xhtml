<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{compSortedAlphabetRptBB}" showItemAll="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{compSortedAlphabetRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:lovMofCompanyName bBean="#{compSortedAlphabetRptBB}" 
				saveObj="compSortedAlphabetRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td colspan="2"></td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNoFrom']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{compSortedAlphabetRptBB.managedBean.mofRegNoFrom}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{compSortedAlphabetRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{compSortedAlphabetRptBB.managedBean.mofRegNoTo}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{compSortedAlphabetRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
		</tr>		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.drpdown.smSearchDtLabel']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<p:selectOneMenu id="searchApplTypeId" style="width:300px;" 
					label="#{lbl['lbl.rpt.drpdown.smSearchDtLabel']}"
					value="#{compSortedAlphabetRptBB.managedBean.searchDate}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="" />
					<f:selectItem itemLabel="#{lbl['lbl.rpt.mofAccRegDt']}" itemValue="mofRegisteredDate"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.mofAccEndDt']}" itemValue="mofEndDate"></f:selectItem>
					<p:ajax event="change" process="@this" partialSubmit="true" update="@form" />
				</p:selectOneMenu>
			</td>
		</tr>			
						
		<p:outputPanel rendered="#{compSortedAlphabetRptBB.managedBean.searchDate eq 'mofRegisteredDate'}">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.rpt.mofregistereddatefrom']}" />
				</td>
				<td class="tdContent">
					<ac:smReportDateFromTo bBean="#{compSortedAlphabetRptBB}" noMaxdate="true" />
				</td>
			</tr>
		</p:outputPanel>
		
		<p:outputPanel rendered="#{compSortedAlphabetRptBB.managedBean.searchDate eq 'mofEndDate'}">
			<tr>
				<td class="tdTitle">
					<p:outputLabel value="#{lbl['lbl.rpt.mofaccountenddatefrom']}" />
				</td>
				<td class="tdContent">
					<table style="width: 100%;">
						<tr>
							<td class="columnDateFromClass">
								<p:calendar label="#{lbl['lbl.rpt.frmdate']}"
									id="calDtFrm" showOn="button" navigator="true"
									display="inline" readonlyInput="true" size="9" update="calDtTo" yearRange="-99"
									value="#{compSortedAlphabetRptBB.managedBean.dateExpFrom}" 
									pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
									<p:ajax event="dateSelect"  update="calDtTo" process="@this"/>
								</p:calendar>
								<p:message id="calDtFrmMsg" for="calDtFrm" display="icon" showDetail="false" />
							</td>
							
							<td class="columnDateToClass"><p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
							<td><p:calendar label="#{lbl['lbl.rpt.todate']}"
								id="calDtTo" showOn="button" navigator="true" disabled="#{empty compSortedAlphabetRptBB.managedBean.dateExpFrom}"
								display="inline" readonlyInput="true" size="9" mindate="#{compSortedAlphabetRptBB.managedBean.dateExpFrom}" yearRange="-99"
								value="#{compSortedAlphabetRptBB.managedBean.dateExpTo}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
								</p:calendar>
								<p:message id="calDtToMsg" for="calDtTo" display="icon" showDetail="false" />
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</p:outputPanel>
	</table>
	
	<ac:smGenerateReport bBean="#{compSortedAlphabetRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
