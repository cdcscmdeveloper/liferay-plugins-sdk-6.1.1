<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{compSortedAlphabetRptBB}" required="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{compSortedAlphabetRptBB}" required="true" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{compSortedAlphabetRptBB}" 
				saveObj="compSortedAlphabetRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td colspan="2"></td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofRegNoFrom']}" />
			</td>
		
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{compSortedAlphabetRptBB.managedBean.mofRegNoFrom}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{compSortedAlphabetRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="22"
					value="#{compSortedAlphabetRptBB.managedBean.mofRegNoTo}" style="width:289px;">
					<p:ajax event="blur"
						listener="#{compSortedAlphabetRptBB.validateMofRegNo()}"
						process="@form" partialSubmit="true" update="@form" />
				</p:inputText>
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofregistereddatefrom']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{compSortedAlphabetRptBB}" />
			</td>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.mofaccountenddatefrom']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<table style="width: 100%;">
					<tr>
						<td class="columnDateFromClass">
							<p:calendar label="#{lbl['lbl.rpt.frmdate']}"
								id="calDtFrm" showOn="button" navigator="true"
								display="inline" readonlyInput="true" size="9" update="calDtTo" 
								value="#{compSortedAlphabetRptBB.managedBean.dateExpFrom}" maxdate="#{CommonConstants.CURRENT_DATE}"
								pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
								<p:ajax event="dateSelect"  update="calDtTo" process="@this"/>
							</p:calendar>
							<p:message id="calDtFrmMsg" for="calDtFrm" display="icon" showDetail="false" />
						</td>
						
						<td class="columnDateToClass"><p:outputLabel value="#{lbl['lbl.rpt.dtRangeTo']}" /></td>
						<td><p:calendar label="#{lbl['lbl.rpt.todate']}"
							id="calDtTo" showOn="button" navigator="true" disabled="#{empty compSortedAlphabetRptBB.managedBean.dateExpFrom}"
							display="inline" readonlyInput="true" size="9" mindate="#{compSortedAlphabetRptBB.managedBean.dateExpFrom}"
							value="#{compSortedAlphabetRptBB.managedBean.dateExpTo}" maxdate="#{CommonConstants.CURRENT_DATE}"
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
							</p:calendar>
							<p:message id="calDtToMsg" for="calDtTo" display="icon" showDetail="false" />
						</td>
					</tr>
				</table>
			</td>
		</tr>
	</table>
	
	<ac:smGenerateReport bBean="#{compSortedAlphabetRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
