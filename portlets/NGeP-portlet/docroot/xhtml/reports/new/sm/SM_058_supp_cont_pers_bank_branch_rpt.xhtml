<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<p:outputPanel id="sm058">
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
		
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{suppContPersBankBranchRptBB}" showItemAll="true"/>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.supplierType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportSupplierType bBean="#{suppContPersBankBranchRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
		
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{suppContPersBankBranchRptBB}" 
				saveObj="suppContPersBankBranchRptBB.managedBean.selectedOrgProfile" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.rgstType']}" />
			</td>
			<td class="tdContent">
				<ac:smReportRegType bBean="#{suppContPersBankBranchRptBB}" />
			</td>
		</tr>
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.business.registrationNo']}" />
			</td>
			<td class="tdContent">
				<p:inputText maxlength="20"
					value="#{suppContPersBankBranchRptBB.managedBean.regNo}"
					style="width:290px;">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText>
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.allregistereddatefrom']}" /> 
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{suppContPersBankBranchRptBB}" />
			</td>
		</tr>
	</table>
	</p:outputPanel>
	<ac:smGenerateReport bBean="#{suppContPersBankBranchRptBB}" 
		reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
		
</ui:composition>
