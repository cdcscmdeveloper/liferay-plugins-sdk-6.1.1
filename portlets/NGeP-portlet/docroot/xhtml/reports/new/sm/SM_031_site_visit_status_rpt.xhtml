<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.zone']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
				
			</td>
			<td class="tdContent">
				<ac:smReportZoneList bBean="#{siteVisitStatusRptBB}" showItemAll="true" required="true" />
			</td>
		
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationNo']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<!-- #7754 - Start  -->
			<td class="tdContent">
				<p:inputText maxlength="16"
					value="#{siteVisitStatusRptBB.managedBean.applNo}"
					label="#{lbl['lbl.rpt.applicationNo']}"
					required="true"
					style="width:290px;">
				</p:inputText>
			</td>
			<!-- #7754 - End  -->
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.state']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportState bBean="#{siteVisitStatusRptBB}"  required="true" />
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.district']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportDistrict bBean="#{siteVisitStatusRptBB}"  required="true" />
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applStatus']}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent"><p:selectOneMenu
					label="#{lbl['lbl.rpt.applStatus']}" id="ApplicationStatus"
					value="#{siteVisitStatusRptBB.managedBean.applStatus}" required="true"
					style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue=""></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.pendrpt']}"
						itemValue="#{SmReportConst.pendingSvStatus}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.cmpltdrpt']}"
						itemValue="#{SmReportConst.svCompletedStatus}"></f:selectItem>
					<p:ajax event="change" process="@this" partialSubmit="true" update="@form" />
				</p:selectOneMenu></td>
				
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.dtRangeFrm']}" 
					rendered="#{empty siteVisitStatusRptBB.managedBean.applStatus}" />
					
				<p:outputLabel value="#{lbl['lbl.rpt.expectedsitevisitdatefrom']}" 
				rendered="#{(!empty siteVisitStatusRptBB.managedBean.applStatus) and (siteVisitStatusRptBB.managedBean.applStatus == SmReportConst.pendingSvStatus)}" />
				
				<p:outputLabel value="#{lbl['lbl.rpt.actualsitevisitdatefrom']}" 
				rendered="#{(!empty siteVisitStatusRptBB.managedBean.applStatus) and (siteVisitStatusRptBB.managedBean.applStatus == SmReportConst.svCompletedStatus)}" />
				<p:outputLabel value="*" styleClass="mandatory" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{siteVisitStatusRptBB}" required="true" />
			</td>
		</tr>
	</table>

	
	<ac:smGenerateReport bBean="#{siteVisitStatusRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
</ui:composition>
