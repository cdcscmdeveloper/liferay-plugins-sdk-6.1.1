<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	
	<table class="customTbl">
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.cmpName']}" />
			</td>
			<td class="tdContent">
				<ac:smReportCompanyNameLOV bBean="#{procAndRegPaymentRptBB}" 
				saveObj="procAndRegPaymentRptBB.managedBean.selectedOrgProfile" />
				
			</td>
			
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.paymentType']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu value="#{procAndRegPaymentRptBB.managedBean.paymentType}">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.processFee']}"
						itemValue="#{lbl['lbl.rpt.processingFee']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.registerFee']}"
						itemValue="#{lbl['lbl.rpt.regFee']}"></f:selectItem>
				</p:selectOneMenu>
			</td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.applicationType']}" />
			</td>
			<td class="tdContent">
				<p:selectOneMenu
					value="#{procAndRegPaymentRptBB.managedBean.applType}" style="width:300px;">
					<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
						itemValue="#{null}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.newappl']}"
						itemValue="#{lbl['lbl.rpt.new']}"></f:selectItem>
					<f:selectItem itemLabel="#{lbl['lbl.rpt.renewappl']}"
						itemValue="#{lbl['lbl.rpt.reNew']}"></f:selectItem>
				</p:selectOneMenu></td>
		</tr>
		
		<tr>
			<td class="tdTitle">
				<p:outputLabel value="#{lbl['lbl.rpt.application.paymentprdate']}" />
			</td>
			<td class="tdContent">
				<ac:smReportDateFromTo bBean="#{procAndRegPaymentRptBB}" required="false" />
			</td>
			<td class="tdTitle">&#160;</td>
			<td class="tdContent">&#160;</td>
		</tr>
	</table>
	
	
	<ac:smGenerateReport bBean="#{procAndRegPaymentRptBB}" reportCode="#{smReportBB.managedBean.reportCode}"
		generateMethod="generateReport" resetMethod="resetSearch">
	</ac:smGenerateReport>
	
</ui:composition>
