<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel style="width: 100%;" header="#{lbl['lbl.rpt.rptcriteria']}"
		toggleable="true" id="cm012Id">

		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:outputText styleClass="instruction"
						style="float:left;margin-left:5px;"
						value="#{lbl['lbl.rpt.search.criteria.PLZ_ENTER_ONE_RPT_CRITERIA_SEARCH']}" /></td>
			</tr>
		</table>


		<table style="margin-top: 5px; width: 100%;">


			<tr>
				<td width="15%"><p:outputLabel
						value="#{lbl['lbl.rpt.dtFrm']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></td>
				<td width="35%"><p:calendar showOn="button" navigator="true"
						readonlyInput="true" size="9"
						value="#{cmReportsBackingBean.managedBean.dateFrom}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">

					</p:calendar></td>
				<td width="15%"><p:outputLabel value="#{lbl['lbl.rpt.dtTo']}" />
					<p:outputLabel value="*" styleClass="mandatory" /></td>
				<td width="35%"><p:calendar showOn="button" navigator="true"
						readonlyInput="true" size="9"
						value="#{cmReportsBackingBean.managedBean.dateTo}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">

					</p:calendar></td>
			</tr>
			
			
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.item.table.type']}" /></td>
				<td><p:selectOneMenu
						value="#{cmReportsBackingBean.managedBean.itemType}"
						style="width:90%">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue=""></f:selectItem>
						<f:selectItem itemValue="Product"
							itemLabel="#{lbl['lbl.txt.product']}" />
						<f:selectItem itemValue="Services"
							itemLabel="#{lbl['lbl.txt.service']}" />

					</p:selectOneMenu></td>
				<td></td>
				<td></td>
			</tr>
			


		</table>


		<ac:generateButton
			generateAction="cmReportsBackingBean.generateReportCM012()"
			resetAction="cmReportsBackingBean.resetReport()" />



	</p:panel>




</ui:composition>
