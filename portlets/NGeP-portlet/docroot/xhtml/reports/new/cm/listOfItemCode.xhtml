<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:panel style="width: 100%;" header="#{lbl['lbl.rpt.rptcriteria']}"
		toggleable="true" id="cm017Id">

		<table style="width: 100%;">
			<tr>
				<td width="100%"><h:outputText styleClass="instruction"
						style="float:left;margin-left:5px;"
						value="#{lbl['lbl.rpt.search.criteria.PLZ_ENTER_ONE_RPT_CRITERIA_SEARCH']}" /></td>
			</tr>
		</table>


		<table style="margin-top: 5px; width: 100%;">
			<tr>
				<td width="15%"><p:outputLabel
						value="#{lbl['lbl.cm.unspsc.code.lov']}" /></td>
				<td width="35%"><ac:lov id="unspscCodeLovId" lovId="CM_UNSPSC"
						headerText="#{lbl['lbl.cm.unspsc.code.lov']}"
						update=":form:unspscTitleId"
						saveObject="cmReportsBackingBean.managedBean.selectedCmUNSPSC"
						value="#{cmReportsBackingBean.managedBean.selectedCmUNSPSC.unspscCode}"
						conditionField="recordStatus^1">
					</ac:lov> <ac:lovPopup /></td>
				<td width="15%"><p:outputLabel
						value="#{lbl['lbl.cm.unspsc.title.lov']}" /></td>
				<td width="35%"><p:inputText style="width:90%;"
						id="unspscTitleId"
						value="#{cmReportsBackingBean.managedBean.selectedCmUNSPSC.unspscTitle}"
						readonly="true" /></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.itmName']}" /></td>
				<td><ac:lov id="itemName" style="width:265px;"
						lovId="CM_ITEM_REPORT" readonly="true" size="30"
						headerText="#{lbl['lbl.rpt.itmName']}"
						value="#{cmReportsBackingBean.managedBean.selectedCmItem.itemName}"
						saveObject="cmReportsBackingBean.managedBean.selectedCmItem" /></td>
				<td></td>
				<td></td>

			</tr>








		</table>


		<ac:generateButton
			generateAction="cmReportsBackingBean.generateReportCM017()"
			resetAction="cmReportsBackingBean.resetReport()" />



	</p:panel>




</ui:composition>
