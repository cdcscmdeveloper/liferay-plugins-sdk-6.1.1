<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.pm.financialorg.services']}" /></td>
			<td><p:selectOneMenu id="serviceTypeId"
					label="#{lbl['lbl.pm.financialorg.services']}"
					value="#{pmReportsBackingBean.managedBean.serviceType}">
					<f:selectItems
						value="#{pmReportsBackingBean.getDropdownCodeValues(ParameterTypeConst.bankServices)}" />
					<!-- 34299 - START -reendorse -->
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
					<!-- 34299 - END -reendorse -->
				</p:selectOneMenu></td>
		</tr>
		<tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.financialorg.name']}" /></td>
		<td><ac:lov id="pmFinOrgName" lovId="PM_ORG_PROFILE_FFC_REPORT"
				size="50" update="@this,:form:regNoIt"
				headerText="#{lbl['lbl.pm.header.general.finance']}" readonly="true"
				value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.finOrgName}"
				saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile" /></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.txt.business.reg.no']}" /></td>
			<td><p:inputText id="regNoIt" maxlength="50" readonly="true"
				  size="50"
					value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.bizRegNumber}">
				</p:inputText></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.profilestatus']}" /></td>
			<td><p:selectOneMenu
					value="#{pmReportsBackingBean.managedBean.status}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems
						value="#{pmReportsBackingBean.getStatusOptions()}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
		</tr>
	</table>
</ui:composition>
