<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.pm.contract.no']}" /></td>
			<td width="35%"><p:inputText maxlength="100" size="50"
					value="#{pmReportsBackingBean.managedBean.contractNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.pm.contract.physical.no']}" /></td>
			<td width="35%"><p:inputText maxlength="100" size="50"
					value="#{pmReportsBackingBean.managedBean.contractPhyscialNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
		</tr>
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.contract.loa.referece.no']}" /></td>
			<td><p:inputText maxlength="100" size="50"
					value="#{pmReportsBackingBean.managedBean.loaNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.contract.loa.physical.no']}" /></td>
			<td><p:inputText maxlength="100" size="50"
					value="#{pmReportsBackingBean.managedBean.loaPhyscialNo}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pm.itemcode']}" /></td>
			<td><ac:lov id="itemCode" lovId="CM_UNSPSC_REPORT"
					readonly="true" size="50" update="@form"
					headerText="#{lbl['lbl.pm.itemcode']}"
					value="#{pmReportsBackingBean.managedBean.selectedUnspscItem.unspscCode}"
					saveObject="pmReportsBackingBean.managedBean.selectedUnspscItem" /></td>
			<td><p:outputLabel value="#{lbl['lbl.pm.itemname']}" /></td>
			<td><p:inputText maxlength="100" readonly="true"
					value="#{pmReportsBackingBean.managedBean.selectedUnspscItem.unspscTitle}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
		</tr>
	</table>
	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.effDateFrom']}" />
					<p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td width="15%"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pmReportsBackingBean.managedBean.fromDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>
			<td width="4%"><p:outputLabel
					value="#{lbl['lbl.rpt.dtRangeTo']}" />
					<p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{pmReportsBackingBean.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>

		</tr>
	</table>
</ui:composition>
