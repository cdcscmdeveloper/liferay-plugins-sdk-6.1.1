<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel value="#{lbl['lbl.rpt.zone']}" /> <p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:selectOneMenu label="#{lbl['lbl.pm.supplier.zone']}"
					id="somzone" value="#{pmReportsBackingBean.managedBean.zoneName}">
					<f:selectItems value="#{pmReportsBackingBean.getPmZoneList()}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<td>&#160;</td>
			<td>&#160;</td>

		</tr>
		<tr>
			<td width="15%"><p:outputLabel value="#{lbl['lbl.rpt.profilestatus']}" /></td>
			<td><p:selectOneMenu
					value="#{pmReportsBackingBean.managedBean.status}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems value="#{pmReportsBackingBean.getStatusOptions()}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			<td>&#160;</td>
			<td>&#160;</td>
		</tr>
	</table>
</ui:composition>
