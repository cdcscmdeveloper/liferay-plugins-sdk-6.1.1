<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:outputPanel id="opDefinedSearch">
		<table class="ppTwoTable">

			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.org.category']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></th>
				<td><p:selectOneRadio id="sorSearchOrgTypeId" layout="custom"
						styleClass="commonLabel" widgetVar="myCheckbox"
						value="#{pmReportsBackingBean.managedBean.searchOrgCategory}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.federal.government']}"
							itemValue="#{PmReportConst.orgCatFederalGovt}" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}"
							itemValue="#{PmReportConst.orgCatOthers}" />
						<p:ajax process="@this,orgCategoryMaintainPG"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							event="change" partialSubmit="true"
							update=":form:opDefinedSearch"
							listener="#{pmReportsBackingBean.resetOrganisationSearchBean()}" />
					</p:selectOneRadio> <h:panelGrid id="orgCategoryMaintainPG" columns="7">
						<p:radioButton id="sorSearchGovn" for="sorSearchOrgTypeId"
							itemIndex="0" />
						<h:outputLabel styleClass="commonLabel"
							for="sorMaintainFederalGovn"
							value="#{lbl['lbl.pm.org.federal.government']}" />
						<p:radioButton id="sorSearchOthers" for="sorSearchOrgTypeId"
							itemIndex="1" />
						<h:outputLabel styleClass="commonLabel" for="sorMaintainOthers"
							value="#{lbl['lbl.pm.org.others']}" />	
					     &#160; <p:graphicImage id="giOthersOrg"
							style="vertical-align:top;"
							value="/css/images/design/tooltips.png" />
						<p:tooltip id="ttOthersOrg" for="giOthersOrg">
							<h:outputText escape="false"
								value="#{lbl['lbl.pm.org.others.tooltip']}" />
						</p:tooltip>
					</h:panelGrid></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /></th>
				<td><p:outputPanel id="somType">
						<p:selectOneMenu id="orgTypeFederalList"
							disabled="#{pmReportsBackingBean.managedBean.disabledOrgFields}"
							rendered="#{pmReportsBackingBean.managedBean.searchOrgCategory eq PmReportConst.orgCatFederalGovt}"
							styleClass="ppDropDownWidthL"
							label="#{lbl['lbl.pm.organisation.orgType']}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId}">
							<f:selectItems
								value="#{pmReportsBackingBean.getOrgTypeDropdownValues()}" />
							<p:ajax event="change"
								listener="#{pmReportsBackingBean.onChangeOrgType()}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								update=":form:opDefinedSearch" />
						</p:selectOneMenu>
						<p:selectOneMenu id="orgTypeOthersList"
							disabled="#{pmReportsBackingBean.managedBean.disabledOrgFields}"
							rendered="#{pmReportsBackingBean.managedBean.searchOrgCategory eq PmReportConst.orgCatOthers}"
							styleClass="ppDropDownWidthL"
							label="#{lbl['lbl.pm.organisation.orgType']}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId}">
							<f:selectItems
								value="#{pmReportsBackingBean.getOrgTypeDropdownValues()}" />
							<p:ajax event="change"
								listener="#{pmReportsBackingBean.onChangeOrgType()}"
								onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
								update=":form:opDefinedSearch" />
						</p:selectOneMenu>
					</p:outputPanel></td>

			</tr>

			<tr>

				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.profiles.search.orgname']}" /></th>
				<td><p:outputPanel id="opFfcOrgCode"
						rendered="#{ParameterConst.orgTypeFactoring eq pmReportsBackingBean.managedBean.selectedOrgType.parameterCode}">
						<ac:lov id="lovFfcOrg" lovId="PM_ORG_PROFILE_FFC" size="100"
							update=":form:opDefinedSearch" readonly="true"
							disabled="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId==null or pmReportsBackingBean.managedBean.disabledOrgFields}"
							postUpdateListener="pmReportsBackingBean.onChangeOrgLov"
							headerText="#{pmReportsBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, pmReportsBackingBean.managedBean.selectedOrgType.parameterCode)}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmFinancialOrg.finOrgName}"
							saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile"
							conditionField="#{pmReportsBackingBean.constructConditionFields()}" />
						<p:message id="lovFfcOrgMsg" for="lovFfcOrg" display="icon" />
					</p:outputPanel> <p:outputPanel id="opSupOrgCode"
						rendered="#{ParameterConst.orgTypeSupplier eq pmReportsBackingBean.managedBean.selectedOrgType.parameterCode}">
						<ac:lov id="lovSupOrg" lovId="PM_ORG_PROFILE_WITH_SUPPLIER"
							size="100" update=":form:opDefinedSearch" readonly="true"
							postUpdateListener="pmReportsBackingBean.onChangeOrgLov"
							disabled="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId==null or pmReportsBackingBean.managedBean.disabledOrgFields}"
							headerText="#{pmReportsBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, pmReportsBackingBean.managedBean.selectedOrgType.parameterCode)}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}"
							saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile"
							conditionField="#{pmReportsBackingBean.constructConditionFields()}" />
						<p:message id="lovSupOrgMsg" for="lovSupOrg" display="icon" />
					</p:outputPanel> <p:outputPanel id="opPtjOrgCode"
						rendered="#{ParameterConst.orgTypePtj eq pmReportsBackingBean.managedBean.selectedOrgType.parameterCode or 
						ParameterConst.orgTypePtjGroup eq pmReportsBackingBean.managedBean.selectedOrgType.parameterCode
						or ParameterConst.orgTypePegawaiPengawal eq pmReportsBackingBean.managedBean.selectedOrgType.parameterCode}">
						<p:inputText size="100" id="itSelectedPtj"
							value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
							readonly="true" />
					&#160;	
					<p:commandLink id="ptjSearchCL" partialSubmit="true"
							disabled="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId==null or pmReportsBackingBean.managedBean.disabledOrgFields}"
							process="@this" update=":form:orgProfileCcId:ptjPopup"
							action="#{organisationSearchBackingBean.initPtjPopup}"
							oncomplete="ptjPopup.show();">
							<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
						</p:commandLink>
					</p:outputPanel> <p:outputPanel id="opOrgCode"
						rendered="#{ParameterConst.orgTypeFactoring ne pmReportsBackingBean.managedBean.selectedOrgType.parameterCode 
							and ParameterConst.orgTypeSupplier ne pmReportsBackingBean.managedBean.selectedOrgType.parameterCode
							and ParameterConst.orgTypePtj ne pmReportsBackingBean.managedBean.selectedOrgType.parameterCode
							and ParameterConst.orgTypePtjGroup ne pmReportsBackingBean.managedBean.selectedOrgType.parameterCode
							and ParameterConst.orgTypePegawaiPengawal ne pmReportsBackingBean.managedBean.selectedOrgType.parameterCode}">
						<ac:lov id="lovMinistry" lovId="PM_ORG_PROFILE" size="100"
							disabled="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId==null or pmReportsBackingBean.managedBean.disabledOrgFields}"
							update=":form:opDefinedSearch" readonly="true"
							postUpdateListener="pmReportsBackingBean.onChangeOrgLov"
							headerText="#{pmReportsBackingBean.getParameterDesc(ParameterTypeConst.organisationTypes, pmReportsBackingBean.managedBean.selectedOrgType.parameterCode)}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
							saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile"
							conditionField="#{pmReportsBackingBean.constructConditionFields()}" />
						<p:message id="lovMinistryMsg" for="lovMinistry" display="icon" />
					</p:outputPanel></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.profiles.userdetails.idno']}" /></th>
				<td><ac:lov id="pmIdentificationNo"
						lovId="PM_USER_ID_REPORT" size="60" update="@form"
						disabled="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId==null}"
						headerText="#{lbl['lbl.pm.profiles.userdetails.idno']}"
						readonly="true"
						postUpdateListener="pmReportsBackingBean.onChangeUserLov"
						value="#{pmReportsBackingBean.managedBean.selectedPmUser.identificationNo}"
						conditionField="#{pmReportsBackingBean.constructConditionForIdentification()}"
						saveObject="pmReportsBackingBean.managedBean.selectedPmUser" /></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.profiles.search.name']}" /></th>
				<td><p:inputText readonly="true" size="60"
						value="#{pmReportsBackingBean.managedBean.selectedPmUser.userName}">						
					</p:inputText></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.profiles.search.role']}" /></th>
				<td><p:inputText size="60" id="itSelectedRoleDesc"
						value="#{not empty(pmReportsBackingBean.managedBean.selectedRoleDesc) ? pmReportsBackingBean.managedBean.selectedRoleDesc.roleName :''}"
						readonly="true" /> &#160; <p:commandLink id="roleSearchCL"
						partialSubmit="true" process="@this"
						update="roleSearchPanel,roleResultPanel"
						action="#{pmReportsBackingBean.resetRoleSearchAction}"
						disabled="#{pmReportsBackingBean.managedBean.selectedOrgType eq null or 
		            	pmReportsBackingBean.managedBean.selectedOrgType.parameterId eq null }"
						oncomplete="roleSearchPopUp.show();">
						<p:graphicImage value="/css/images/design/search.png"></p:graphicImage>
					</p:commandLink></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.profilestatus']}" /></td>
				<td><p:selectOneMenu
						value="#{pmReportsBackingBean.managedBean.status}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{pmReportsBackingBean.getStatusOptions()}" />
						<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
					</p:selectOneMenu></td>
				<th>&#160;</th>
				<td>&#160;</td>
			</tr>


		</table>

	</p:outputPanel>
	<ac:ptjPopup id="orgProfileCcId"
		orgTypeParamCode="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterCode}"
		okAction="pmReportsBackingBean.selectPtjAction"
		update=":form:opDefinedSearch"
		includePegawaiPengawal="true" />
	<ui:include src="/xhtml/reports/new/pm/common/roleSearchPopUp.xhtml" />
</ui:composition>
