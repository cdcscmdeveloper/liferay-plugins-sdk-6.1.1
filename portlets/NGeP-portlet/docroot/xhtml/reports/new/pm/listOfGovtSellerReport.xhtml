<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel value="#{lbl['lbl.pm.organisation.orgCode']}" /></td>
			<td><ac:lov id="pmOrgCode" lovId="PM_ORG_PROFILE_REPORT"
					size="100" update="@this,:form:orgNameIt"
					headerText="#{lbl['lbl.pm.organisation.orgCode']}" readonly="true"
					value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgCode}"
					saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile"
					conditionField="#{pmReportsBackingBean.constructConditionFields()}" /></td>
		</tr>
		<tr>
			<td width="15%"><p:outputLabel value="#{lbl['lbl.pm.organisation.orgName']}" /></td>
			<td><p:inputText id="orgNameIt" maxlength="100" readonly="true"
					size="100"
					value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}">
				</p:inputText></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.rpt.profilestatus']}" /></td>
			<td><p:selectOneMenu
					value="#{pmReportsBackingBean.managedBean.status}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
						itemValue="#{null}" />
					<f:selectItems value="#{pmReportsBackingBean.getStatusOptions()}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
				</p:selectOneMenu></td>
			
		</tr>
	</table>
</ui:composition>
