<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.companyName']}" /></td>
			<td width="35%"><ac:lov id="pmCompanyName" readonly="true"
					lovId="PM_ORG_PROFILE_WITH_COMPANY_REPORT" size="50" update="@form"
					headerText="#{lbl['lbl.rpt.companyName']}"
					conditionField="#{pmReportsBackingBean.constructConditionFieldsSupplierList()}"
					value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.smSupplier.companyName}"
					saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile" /></td> <!-- #29991 add conditionField -->
			<td width="15%"></td>
			<td width="35%"></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.txt.business.reg.no']}" /></td>
			<td><p:inputText maxlength="50" size="50"
					value="#{pmReportsBackingBean.managedBean.bizRegNo}">
				</p:inputText></td>
			<td><p:outputLabel value="#{lbl['lbl.sm.epno']}"></p:outputLabel></td>
			<td><p:inputText maxlength="50" size="50"
					value="#{pmReportsBackingBean.managedBean.epNo}">
				</p:inputText></td>
		</tr>
		<tr>
			<td><p:outputLabel value="#{lbl['lbl.pm.itemcode']}" /></td>
			<td><ac:lov id="itemCode" lovId="CM_UNSPSC_REPORT"
					readonly="true" size="50" update="@form"
					headerText="#{lbl['lbl.pm.itemcode']}"
					value="#{pmReportsBackingBean.managedBean.selectedUnspscItem.unspscCode}"
					saveObject="pmReportsBackingBean.managedBean.selectedUnspscItem" /></td>
			<td><p:outputLabel value="#{lbl['lbl.pm.itemname']}" /></td>
			<td><p:inputText maxlength="100" readonly="true" size="50"
					value="#{pmReportsBackingBean.managedBean.selectedUnspscItem.unspscTitle}">
					<p:ajax event="blur" partialSubmit="true" update="@([id$=Msg])" />
				</p:inputText></td>
		</tr>
	</table>

	<table style="width: 100%;">
		<tr>
			<td width="15%"><p:outputLabel
					value="#{lbl['lbl.rpt.effDateFrom']}" />
					<p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td width="15%"><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pmReportsBackingBean.managedBean.fromDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>
			<td width="4%"><p:outputLabel
					value="#{lbl['lbl.rpt.dtRangeTo']}" />
					<p:outputLabel
					value="*" styleClass="mandatory" /></td>
			<td><p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{pmReportsBackingBean.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar></td>
			
		</tr>
	</table>

</ui:composition>
