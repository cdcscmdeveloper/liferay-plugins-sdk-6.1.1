<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<script>
		function autoSelectOrgType() {
			if ($("input[id$=':form:sorSearchOrgTypeId:0']").is(':disabled')) {
				console.log("0");
				$("input[id$=':form:sorSearchOrgTypeId:1']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeId:1']").change();
			} else if ($("input[id$=':form:sorSearchOrgTypeId:1']").is(
					':disabled')) {
				console.log("1");
				$("input[id$=':form:sorSearchOrgTypeId:0']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeId:0']").change();
			} else {
				console.log("2");
				$("input[id$=':form:sorSearchOrgTypeId:0']").prop('checked',
						true);
				$("input[id$=':form:sorSearchOrgTypeId:0']").change();
			}
		}
		//#29991 start 
		function hideOrgCodeName() {
			$('.tabOrgCode').hide();
			$('.tabOrgName').hide();
		}
		function showOrgCodeName() {
			$('.tabOrgCode').show();
			$('.tabOrgName').show();
		}
		//#29991 end 
		
	</script>
	<p:outputPanel id="orgSearchPanel">
		<table style="width: 100%;">
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.org.category']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></th>
				<td><p:selectOneRadio id="sorSearchOrgTypeId" layout="custom"
						styleClass="commonLabel" widgetVar="myCheckbox"
						value="#{pmReportsBackingBean.managedBean.searchOrgCategory}">
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.federal.government']}"
							itemValue="#{PmReportConst.orgCatFederalGovt}" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.org.others']}"
							itemValue="#{PmReportConst.orgCatOthers}" />
						<p:ajax process="@this,orgCategoryMaintainPG"
							onstart="blockWidget.show()" oncomplete="blockWidget.hide()"
							event="change" partialSubmit="true" update=":form:orgSearchPanel"
							listener="#{pmReportsBackingBean.resetOrganisationSearchBean()}" />
					</p:selectOneRadio> <h:panelGrid id="orgCategoryMaintainPG" columns="7">
						<p:radioButton id="sorSearchGovn" for="sorSearchOrgTypeId"
							itemIndex="0" />
						<h:outputLabel styleClass="commonLabel"
							for="sorMaintainFederalGovn"
							value="#{lbl['lbl.pm.org.federal.government']}" />
						<p:radioButton id="sorSearchOthers" for="sorSearchOrgTypeId"
							itemIndex="1" />
						<h:outputLabel styleClass="commonLabel" for="sorMaintainOthers"
							value="#{lbl['lbl.pm.org.others']}" />	
					     &#160; <p:graphicImage id="giOthersOrg"
							style="vertical-align:top;"
							value="/css/images/design/tooltips.png" />
						<p:tooltip id="ttOthersOrg" for="giOthersOrg">
							<h:outputText escape="false"
								value="#{lbl['lbl.pm.org.others.tooltip']}" />
						</p:tooltip>
					</h:panelGrid></td>
			</tr>
			<tr>
				<th width="15%"><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgType']}" /> <p:outputLabel
						value="*" styleClass="mandatory" /></th>
				<td><p:selectOneMenu id="orgTypeFederalList"
						disabled="#{pmReportsBackingBean.managedBean.disabledOrgFields}"
						rendered="#{pmReportsBackingBean.managedBean.searchOrgCategory eq PmReportConst.orgCatFederalGovt}"
						styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.organisation.orgType']}"
						style="margin-bottom: 5px;"
						value="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{pmReportsBackingBean.getOrgTypeDropdownValues()}" />
						<p:ajax process="@this" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" event="change"
							partialSubmit="true"
							update=":form:orgNameIt,:form:orgProfilePG, @form" 
							listener="#{pmReportsBackingBean.onChangeOrgType()}" /> 
					</p:selectOneMenu> <p:selectOneMenu id="orgTypeOthersList"
						rendered="#{pmReportsBackingBean.managedBean.searchOrgCategory eq PmReportConst.orgCatOthers}"
						styleClass="ppDropDownWidthL"
						required="#{!empty param['disableValidation']}"
						label="#{lbl['lbl.pm.organisation.orgType']}"					
						value="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{pmReportsBackingBean.getOrgTypeDropdownValues()}" />
						<p:ajax process="@this" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" event="change"
							partialSubmit="true"
							update=":form:orgNameIt,:form:orgProfilePG, @form" 
							listener="#{pmReportsBackingBean.onChangeOrgType()}" /> <!-- #29991 add @form -->
					</p:selectOneMenu></td>
			</tr>
			
			
			<tr class="tabOrgCode"> <!-- #29991-->
				<td><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgCode']}" /></td>
				<td><h:panelGroup id="orgProfilePG">
						<ac:lov id="pmOrgCode" lovId="PM_ORG_PROFILE_REPORT" size="100"
						    update="@this,:form:orgNameIt"
							headerText="#{lbl['lbl.pm.organisation.orgCode']}"
							readonly="true"
							disabled="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId==null}"
							conditionField="#{pmReportsBackingBean.constructConditionFields()}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgCode}"
							saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile" />
					</h:panelGroup></td>
			</tr>
			<tr class="tabOrgName"> <!-- #29991 -->
				<td><p:outputLabel
						value="#{lbl['lbl.pm.organisation.orgName']}" /></td>
				<td><p:inputText id="orgNameIt" maxlength="150" readonly="true" size="100"
						value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}">
					</p:inputText></td>
			</tr>
	
	        <!-- #29991 start -->
			<c:if test="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId eq PmReportConst.orgTypeSupplier}">
			<TR>
				<TD><p:outputLabel
							value="#{lbl['lbl.rpt.businessregistrationnoscreen']}" /></TD>
				<TD><h:panelGroup id="BusRegnoPG">
					    <ac:lov id="pmBusinessRegNo" readonly="true"
							style="width:289px;" lovId="PM_ORG_PROFILE_WITH_ORGANISATION_REPORT"
							size="100" update="@this,:form:compNameIt"
							headerText="#{lbl['lbl.rpt.businessregistrationnoscreen']}"
							conditionField="#{pmReportsBackingBean.constructConditionFieldsSupplierList()}"
							value="#{pmReportsBackingBean.managedBean.selectedSupplier.smSupplier.regNo}"
							postUpdateListener="#{pmReportsBackingBean.onCompanyNameChangeForLOVPMReport()}"
							saveObject="pmReportsBackingBean.managedBean.selectedSupplier" />
				    </h:panelGroup></TD>
			</TR>
			<TR>
				<TD><p:outputLabel
							value="#{lbl['lbl.rpt.companyName']}" /></TD>
				<TD><p:inputText id="compNameIt" maxlength="150" readonly="true" size="100"
							value="#{pmReportsBackingBean.managedBean.selectedSupplier.smSupplier.companyName}">
					</p:inputText></TD>
			</TR>
			</c:if>
			<!-- #29991 end -->
			
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.pm.status']}" /></td>
				<td><p:selectOneMenu
						value="#{pmReportsBackingBean.managedBean.status}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}"
							itemValue="#{null}" />
						<f:selectItems value="#{pmReportsBackingBean.getStatusOptions()}" />
						<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
					</p:selectOneMenu></td>
			</tr>
			<!-- #28833 start -->
			 <c:if test="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId eq PmReportConst.orgTypeMinistry
			 			or pmReportsBackingBean.managedBean.selectedOrgType.parameterId eq PmReportConst.orgTypeKumpulanPTJ
			 			or pmReportsBackingBean.managedBean.selectedOrgType.parameterId eq PmReportConst.orgTypePTJ}">
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.g2g']}"/></td>
				<td><p:selectBooleanCheckbox id="isGovtSellerCheckBox"
					value="#{pmReportsBackingBean.managedBean.govtSeller}">
						<p:ajax event="change" partialSubmit="true" update="@form" />
					</p:selectBooleanCheckbox></td>
			</tr>
			</c:if> 
			<!-- #28833 end -->
		</table>
	</p:outputPanel>
</ui:composition>
