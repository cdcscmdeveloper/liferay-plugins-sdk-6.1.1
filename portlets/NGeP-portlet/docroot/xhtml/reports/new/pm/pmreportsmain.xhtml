<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
		<p:panel style="width: 100%;" header="#{lbl['lbl.rpt.rptcriteria']}"
			toggleable="true" id="rptModuleId">
			<table style="margin-top: 10px; width: 100%;">
				<tr>
					<td><p:outputLabel value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel
							value="*" styleClass="mandatory" /></td>
					<td><p:selectOneMenu label="#{lbl['lbl.rpt.rptName']}"
							id="somReportName" value="#{pmReportsBackingBean.managedBean.reportName}"
							required="true" style="margin-top:5px;width:300px;">
							<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}"
								itemValue="#{null}"></f:selectItem>
							<f:selectItems value="#{pmReportsBackingBean.retrieveReportListByAuthorization(ReportConst.pmModVal)}"></f:selectItems>
							<p:ajax event="change"
								listener="#{pmReportsBackingBean.onChangeReportName()}"
								process="@this" partialSubmit="true" update="@all" />
						</p:selectOneMenu></td>
				</tr>
			</table>
		</p:panel>
	</ui:define>


</ui:composition>
