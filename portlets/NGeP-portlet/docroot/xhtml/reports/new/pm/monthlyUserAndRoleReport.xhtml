<script type="text/javascript" src="/NGeP-portlet/js/wp/al/jquery.ticker.js" />
	<p:outputPanel id="opDefinedSearch">
		<table border="0" cellspacing="0" cellpadding="0" width="100%">			
			<tr>
				<th width="15%"><p:outputLabel value="#{lbl['lbl.pm.org.ptj.search.ministry']}" />
					<p:outputLabel value="*" styleClass="mandatory" />
				</th>
				<td>
					<ac:lov id="minstryPtjsearchRpt" lovId="PM_ORG_PROFILE_MINSTRY"
						headerText="#{lbl['lbl.pm.org.ptj.search.ministry']}" update="@form"
						saveObject="pmReportsBackingBean.managedBean.selectedMinistry"
						value="#{pmReportsBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName}"
						size="100" readonly="true"
						postUpdateListener="pmReportsBackingBean.updateMinistrySearchCriteria" 
						conditionField="#{pmReportsBackingBean.constructMinistryConditionFields()}" />				
				</td>
			</tr>		
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pm.org.ptj.search.jabatan']}" /><p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<ac:lov id="PtjGroupsearchRpt" lovId="PM_ORG_PROFILE_PTJ_GROUP"
						headerText="#{lbl['lbl.pm.org.ptj.search.jabatan']}" update="@form"
						disabled = "#{pmReportsBackingBean.managedBean.selectedMinistry.pmOrgValidity.orgName == null}"
						saveObject="pmReportsBackingBean.managedBean.selectedKumpulanPTJ"
						value="#{pmReportsBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName}"
						size="100" readonly="true" 
						postUpdateListener="pmReportsBackingBean.updateKPTJSearchCriteria"
						conditionField="#{pmReportsBackingBean.constuctConditionFieldsForPTJGroup()}" /> 
				</td>
			</tr>			
			<tr>
				<td style="white-space: nowrap">
					<p:outputLabel value="#{lbl['lbl.pm.sidemenu.general.org.resProfile']}" /> <p:outputLabel value="*" styleClass="mandatory" />
				</td>
				<td>
					<ac:lov id="openPtjsearchRpt" lovId="PM_ORG_PROFILE_PTJ"
						headerText="#{lbl['lbl.pm.sidemenu.general.org.resProfile']}"
						disabled = "#{pmReportsBackingBean.managedBean.selectedKumpulanPTJ.pmOrgValidity.orgName == null}"
						saveObject="pmReportsBackingBean.managedBean.selectedPTJ"
						value="#{pmReportsBackingBean.managedBean.selectedPTJ.pmOrgValidity.orgName}"
						size="100" readonly="true"
						postUpdateListener="pmReportsBackingBean.updateSearchCriteria"
						conditionField="#{pmReportsBackingBean.constuctConditionFieldsForPTJEpEnabled()}" /> 			
				</td>	
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.userstatus']}" /></td>
				<td><p:selectOneMenu
					value="#{pmReportsBackingBean.managedBean.status}">
					<f:selectItem itemLabel="#{lbl['lbl.txt.all']}"
						itemValue="#{null}" />
					<f:selectItems
						value="#{pmReportsBackingBean.getStatusOptions()}" />
					<p:ajax event="change" partialSubmit="true" update="@([id$=Msg])" />
					</p:selectOneMenu></td>
			</tr>
			<tr>
				<td><p:outputLabel value="#{lbl['lbl.rpt.month']}" /></td>
				<td><!-- <p:calendar showOn="button" display="inline"
						readonlyInput="true" 
						value="#{pmReportsBackingBean.managedBean.month}"
						pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_MONTH_YEAR)}" 
						size="9">						
					</p:calendar> -->
					<input type="text" id="month" name="month" class="monthPicker" /></td>

			</tr>
		</table>
		<!-- <p:datePicker value="#{managedBean.date}" view="month" 
        pattern="MM/yyyy" yearNavigator="true" yearRange="1986:2025" monthNavigator="true"/> -->
		<!-- pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"> -->
		<!-- <p:calendar showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pmReportsBackingBean.managedBean.fromDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this" />
				</p:calendar> -->

	</p:outputPanel>
	
</ui:composition>
