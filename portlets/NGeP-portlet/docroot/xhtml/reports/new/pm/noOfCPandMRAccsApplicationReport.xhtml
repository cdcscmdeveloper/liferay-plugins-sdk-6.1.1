<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:param name="language" value="#{pmReportsBackingBean.getLanguage()}" />
	<table style="width: 100%;">
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.organisation.orgType']}" /></td>
		<td><p:selectOneMenu id="orgTypeForCPandMR"
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.organisation.orgType']}"
						style="margin-bottom: 5px;"
						value="#{pmReportsBackingBean.managedBean.selectedOrgType.parameterId}">
						<f:selectItems
							value="#{pmReportsBackingBean.getOrgTypeDropdownValues()}" />
						<p:ajax process="@this" onstart="blockWidget.show()"
							oncomplete="blockWidget.hide()" event="change"
							partialSubmit="true"
							update=":form:orgName"
							listener="#{pmReportsBackingBean.onChangeOrgType()}" />
					</p:selectOneMenu>
		</td>
	</tr>
	<tr>
		<td><p:outputLabel value="#{lbl['lbl.pm.organisation.orgName']}" /></td>
		<td><h:panelGroup id="orgName">
			<ac:lov id="pmOrgCode" lovId="PM_ORG_PROFILE_REPORT" size="100"
							update="@this"
							headerText="#{lbl['lbl.pm.organisation.orgName']}"
							readonly="true"
							conditionField="#{pmReportsBackingBean.constructConditionFields()}"
							value="#{pmReportsBackingBean.managedBean.selectedOrgProfile.pmOrgValidity.orgName}"
							saveObject="pmReportsBackingBean.managedBean.selectedOrgProfile" />
			</h:panelGroup></td>
	</tr>
	<tr>
	<td><p:outputLabel value="#{lbl['lbl.pm.access.app.applicant.name']}" /></td>
			<td><p:inputText maxlength="50" size="50"
					value="#{pmReportsBackingBean.managedBean.applicantName}">
				</p:inputText></td>
	</tr>
	<tr>
	<td><p:outputLabel value="#{lbl['lbl.pm.access.app.access.type']}" /></td>
		<td><p:selectOneMenu id="accessType"
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.access.app.access.type']}"
						style="margin-bottom: 5px;"
						value="#{pmReportsBackingBean.managedBean.selectedAccessType}">
						<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="#{null}" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.access.app.cp']}" itemValue="#{ParameterConst.doctypeCompanyProfile}" />
						<f:selectItem itemLabel="#{lbl['lbl.pm.access.app.mr']}" itemValue="#{ParameterConst.doctypeMarketResearch}" />
						<f:selectItem itemLabel="#{lbl['lbl.txt.both']}" itemValue="#{ParameterConst.doctypeCompanyProfile} _ #{ParameterConst.doctypeMarketResearch}" />
					</p:selectOneMenu>
		</td>
	</tr>
	<tr>
	<td><p:outputLabel value="#{lbl['lbl.pm.access.app.status']}" /></td>
		<td><p:selectOneMenu id="applicationStatus"
						styleClass="ppDropDownWidthL"
						label="#{lbl['lbl.pm.access.app.status']}"
						style="margin-bottom: 5px;"
						value="#{pmReportsBackingBean.managedBean.selectedApplicationStatus}">
						<f:selectItems
							value="#{pmReportsBackingBean.getApplicationStatusDropdown()}" />
					</p:selectOneMenu>
		</td>
	</tr>
	</table>
	<c:if test="#{language eq 'en'}">
	<table style="width: 47%;">
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.access.app.date.from']}" /></td>
			<td><p:calendar id="dateFrom" showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pmReportsBackingBean.managedBean.fromDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					maxdate="#{pmReportsBackingBean.managedBean.toDate}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this,:form:dateTo" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this,:form:dateTo" />
				</p:calendar>
				</td>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.access.app.date.to']}" /></td>
			<td><p:calendar id="dateTo" showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{pmReportsBackingBean.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					mindate="#{pmReportsBackingBean.managedBean.fromDate}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this,:form:dateFrom" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this,:form:dateFrom" />
				</p:calendar></td>
		</tr>
	</table>
	</c:if>
	<c:if test="#{language eq 'ms'}">
	<table style="width: 47%; margin-left: 81.4px;">
		<tr>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.access.app.date.from']}" /></td>
			<td><p:calendar id="dateFrom" showOn="button" navigator="true"
					display="inline" readonlyInput="true" size="9"
					value="#{pmReportsBackingBean.managedBean.fromDate}"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					maxdate="#{pmReportsBackingBean.managedBean.toDate}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this,:form:dateTo" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this,:form:dateTo" />
				</p:calendar>
				</td>
			<td><p:outputLabel
					value="#{lbl['lbl.pm.access.app.date.to']}" /></td>
			<td><p:calendar id="dateTo" showOn="button" navigator="true"
					display="inline" readonlyInput="true"
					value="#{pmReportsBackingBean.managedBean.toDate}" size="9"
					pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}"
					mindate="#{pmReportsBackingBean.managedBean.fromDate}">
					<p:ajax event="dateSelect" partialSubmit="true" process="@this"
						update="@this,:form:dateFrom" />
					<p:ajax event="change" partialSubmit="true" process="@this"
						update="@this,:form:dateFrom" />
				</p:calendar></td>
		</tr>
	</table>
	</c:if>
</ui:composition>
