<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">

		<p:messages id="cmReportMsgId" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>


		<table style="margin-bottom: 10px; width: 100%;">


			<tr>


				<td width="10%"><p:outputLabel
						value="#{lbl['lbl.rpt.rptName']}" /> <p:outputLabel value="*"
						styleClass="mandatory" /></td>



				<td width="90%"><p:selectOneMenu
						label="#{lbl['lbl.rpt.rptName']}" id="reportName"
						value="#{cmReportsBackingBean.managedBean.reportCode}"
						required="true" style="margin-top:5px;width:300px;">
						<f:selectItem itemLabel="#{lbl['lbl.rpt.selectOne']}" itemValue=""></f:selectItem>


						<f:selectItems
							value="#{cmReportsBackingBean.managedBean.reportList}"></f:selectItems>
						<p:ajax event="change" process="@this" listener="#{cmReportsBackingBean.retrieveCmReportValueFromDb()}"
							update=":form:cmReportListId" />
					</p:selectOneMenu></td>
			</tr>


		</table>



		<ui:include src="cmreportcontent.xhtml"></ui:include>



		


	</ui:define>


</ui:composition>
