<?xml version="1.0"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">
	<ui:define name="contentSection">
	<style>
		.tree-node-disabled .ui-treenode-label{
			cursor: pointer !important;
			opacity: 0.4 !important;
			margin-bottom: 1px !important;
			margin-top: 1px !important
		}
		.tree-node-disabled .cus-label-container, 
		.tree-node-disabled .cus-disabled-checkbox{
			vertical-align: middle !important;
			pointer-events: none !important;
		}
		.tree-node-disabled .cus-disabled-checkbox{
			height: 15px !important;
			width: 15px !important;
			border: 1px solid #dddddd !important;
			background: rgb(255, 255, 255) !important;
			border-color: #bcbec0 !important;
			display: inline-block !important;
			border-radius: 0px !important;
			margin-right: 11px !important;
			margin-left: 2px !important;
		}/*not baked to the component ep next gen*/
	
	</style>

		<p:messages id="zmMsgs" showDetail="true" autoUpdate="true"
			closable="true" showSummary="false"></p:messages>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.zm.save']}"
				process="@this, zoneDetailsDataTable" partialSubmit="true"
				update="@([id$=zmMsgs]), @([id$=zoneDetailsDataTable]), @([id$=zonePopupPanel])"
				action="#{zoneMaintenanceBackingBean.saveCmSupplierZones}" />
		</div>


		<h:panelGrid id="zoneTable" width="100%">
		<p:remoteCommand name="updateSelectAll" update="form:zoneDetailsDataTable"/>
			<p:dataTable id="zoneDetailsDataTable"
				emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
				value="#{zoneMaintenanceBackingBean.managedBean.zoneTrees}"
				var="zoneTree" rowIndexVar="index" rows="10"
				widgetVar="wv">
				<ac:paginator for="zoneDetailsDataTable"></ac:paginator>					
				
			<p:column style="text-align: left;width:2%;">
				<p:selectBooleanCheckbox id="singleCheckBoxID" disabled="#{!zoneMaintenanceBackingBean.managedBean.cmSupplierZoneList.get(index).selectable}"
					value="#{zoneMaintenanceBackingBean.getCurrentZone(zoneTree).selected}">
					<p:ajax event="change" update=":form:deleteBtnId"></p:ajax>
				</p:selectBooleanCheckbox>
				<p:tooltip id="sCBoxTooltipId"  rendered="#{!zoneMaintenanceBackingBean.getCurrentZone(zoneTree).selectable}" for="singleCheckBoxID" value="#{lbl['lbl.cm.zm.unabletodelete']}" position="right"/>
			</p:column>
				
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.cm.zm.details']}" />
					</f:facet>
					<p:tree id="treeZoneDetails" value="#{zoneTree}" var="zN">
						<p:treeNode type="cmSupplierZone">
							<h:outputText value="#{zN.locationName}" />
						</p:treeNode>
						<p:treeNode type="state">
							<h:outputText value="#{zN.locationName}" />
						</p:treeNode>
						<p:treeNode type="division">
							<h:outputText value="#{zN.locationName}" />
						</p:treeNode>
						<p:treeNode type="district">
							<h:outputText value="#{zN.locationName}" />
						</p:treeNode>
					</p:tree>
				</p:column>
				<p:column>
					<f:facet name="header">
						<h:outputText value="#{lbl['lbl.cm.action']}" />
					</f:facet>
					<p:commandLink
						actionListener="#{zoneMaintenanceBackingBean.editZone(zoneTree,index)}"
						process="@this" update=":form:ZL" oncomplete="ZL.show();">
						<p:graphicImage style="padding-left: 10px;"
							value="/css/images/design/edit.png"
							title="#{lbl['lbl.cm.zm.edit']}" />
					</p:commandLink>
					<ui:remove>
						<p:commandLink process="@this" update="zoneDetailsDataTable, @([id$=zmMsgs])" actionListener="#{zoneMaintenanceBackingBean.deleteTreeNodes(zoneTree)}">
						<p:graphicImage value="/css/images/design/trash.png"
							title="#{lbl['lbl.btn.delete']}" />
						</p:commandLink>
					</ui:remove>
				</p:column>
			</p:dataTable>
		</h:panelGrid>
		<div align="right" style="width: 100%">
			<p:commandButton value="#{lbl['lbl.cm.zm.btn.add']}" process="@this"
				update=":form:ZL" partialSubmit="true" oncomplete="ZL.show();"
				actionListener="#{zoneMaintenanceBackingBean.addNewZone}" />
			<p:commandButton id="deleteBtnId" value="#{lbl['lbl.cm.zm.btn.delete']}" disabled="#{zoneMaintenanceBackingBean.isDeleteListEmpty()}" actionListener="#{zoneMaintenanceBackingBean.deleteSelectedZones()}" update=":form:deleteZoneConfirmationId"/>
		</div>
		<p:confirmDialog id="deleteZoneConfirmationId" message="#{lbl['lbl.cm.zm.dialog.confirm.delete']}" header="#{lbl['lbl.cm.dialog.cofirm.header']}" widgetVar="deleteConfirmation">
				<div align="left" style="margin-top:-28px !important; margin-left: 10% !important; position: relative; z-index: 99;">
					<ul>
						<ui:repeat value="#{zoneMaintenanceBackingBean.managedBean.getTempDeletedSupplierZoneList()}" var="zone">
							<li><h:outputText value="#{zone.suppZoneName}"/></li>
						</ui:repeat>
					</ul>
				</div>
				<div align="right">
					<p:commandButton id="confirmID" process="@this" update="zoneDetailsDataTable, deleteBtnId"   actionListener="#{zoneMaintenanceBackingBean.deleteTreeNodes()}" value="#{lbl['lbl.cm.dialog.cofirm.yes']}" />
					<p:commandButton id="declineID"
						value="#{lbl['lbl.cm.dialog.cofirm.no']}"
						onclick="deleteConfirmation.hide()" />
				</div>
		</p:confirmDialog>
		<p:dialog id="ZL" widgetVar="ZL" width="450px"
			header="#{zoneMaintenanceBackingBean.managedBean.editMode}"
			modal="true" height="70%" style="position: absolute !important;">
			<f:facet name="header">
				<h:outputText value="#{lbl['lbl.cm.zm.header.add']}"
					rendered="#{!zoneMaintenanceBackingBean.managedBean.editMode}" />
				<h:outputText value="#{lbl['lbl.cm.zm.header.edit']}"
					rendered="#{zoneMaintenanceBackingBean.managedBean.editMode}" />
			</f:facet>
			<h:panelGroup id="zonePopupPanel">
				<table styleClass="noBorders tr,noBorders td">
					<tr>
						<td width="25%" valign="top"><p:outputLabel
								value="#{lbl['lbl.cm.zm.name']}"></p:outputLabel> <p:outputLabel
								value="*" styleClass="mandatory" /></td>
						<td width="75%"><p:inputText id="zoneNameId" maxlength="50"
								value="#{zoneMaintenanceBackingBean.managedBean.selectedSupplierZone.suppZoneName}">
								<p:ajax event="keyup" update=":form:zoneAddButton"></p:ajax>
								<p:ajax event="change" update=":form:zoneAddButton"></p:ajax>
							</p:inputText></td>
					</tr>
					<tr>
						<td width="20%" valign="top"><p:outputLabel
								value="#{lbl['lbl.cm.zm.details']}"></p:outputLabel></td>
						<td width="80%">
							<div style="height: 340px; overflow-y: scroll;">
								<p:tree id="treeZoneLocationPopup"
									value="#{zoneMaintenanceBackingBean.managedBean.rootZoneTree}"
									var="location" 
									selection="#{zoneMaintenanceBackingBean.managedBean.selectedNodes}"
									selectionMode="checkbox">
									<p:ajax event="select" update=":form:zoneAddButton"/>
									<p:ajax event="unselect" update=":form:zoneAddButton" />

									<p:treeNode  styleClass="#{!location.getState().selectable ? 'tree-node-disabled':''}" type="state">
											<p:outputPanel id="stateNodeId" >
												<p:outputPanel styleClass="cus-disabled-checkbox" rendered="#{!location.getState().selectable}" ></p:outputPanel>
												<p:outputPanel styleClass="cus-label-container"><h:outputText value="#{location.locationName}" /></p:outputPanel>
											</p:outputPanel>										
											<p:tooltip  style="z-index: 999;"   for="stateNodeId" rendered="#{!location.getState().selectable}" value="#{lbl['lbl.cm.zm.unabletoselect']}" position="top"></p:tooltip>					
									</p:treeNode>
									<p:treeNode  styleClass="#{!location.getDivision().selectable ? 'tree-node-disabled':''}" type="division">
											<p:outputPanel id="divisionNodeId" >
												<p:outputPanel styleClass="cus-disabled-checkbox" rendered="#{!location.getDivision().selectable}" ></p:outputPanel>
												<p:outputPanel styleClass="cus-label-container"><h:outputText value="#{location.locationName}" /></p:outputPanel>
											</p:outputPanel>											
											<p:tooltip  style="z-index: 999;"  for="divisionNodeId" rendered="#{!location.getDivision().selectable}" value="#{lbl['lbl.cm.zm.unabletoselect']}" position="top"></p:tooltip>
									</p:treeNode>
										 <p:treeNode  styleClass="#{!location.getDistrict().selectable ? 'tree-node-disabled':''}" type="district">
											<p:outputPanel id="districtNodeId" >
												<p:outputPanel styleClass="cus-disabled-checkbox" rendered="#{!location.getDistrict().selectable}" ></p:outputPanel>
												<p:outputPanel styleClass="cus-label-container"><h:outputText value="#{location.locationName}" /></p:outputPanel>
											</p:outputPanel>
											<p:tooltip style="z-index: 999;" for="districtNodeId"  rendered="#{!location.getDistrict().selectable}" value="#{lbl['lbl.cm.zm.unabletoselect']}" position="top"></p:tooltip>										 
										</p:treeNode>
								</p:tree>
							</div>
						</td>
					</tr>
				</table>
			</h:panelGroup>

			<div align="right">
				<p:commandButton value="#{lbl['lbl.cm.zm.btn.cancel']}"
					style="float:right;" immediate="true" oncomplete="ZL.hide();"></p:commandButton>
				&#160;&#160;

				<p:commandButton id="zoneAddButton" value="#{lbl['lbl.cm.zm.btn.ok']}" 
					disabled="#{zoneMaintenanceBackingBean.managedBean.selectedSupplierZone.suppZoneName eq null or zoneMaintenanceBackingBean.managedBean.selectedSupplierZone.suppZoneName.length() eq 0 or fn:length(zoneMaintenanceBackingBean.managedBean.selectedNodes)&lt;1}"
					style="float:right;" oncomplete="ZL.hide();"
					process="@all ,zoneNameId" update="@this, zonePopupPanel"
					partialSubmit="true"
					actionListener="#{zoneMaintenanceBackingBean.updateZoneListOnPopUpClose}">
				</p:commandButton>
			</div>

		
		</p:dialog>
	</ui:define>
</ui:composition>
