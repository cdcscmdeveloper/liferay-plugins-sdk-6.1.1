<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<ui:define name="contentSection">


		<p:tabView id="catalogueTabId">
			<p:tab title="Keyword Search">
				<table style="width: 100%; margin-top: 5px;">
					<tr>
						<td style="width: 20%;"><p:autoComplete size="120"
								id="itemNameId"
								value="#{pCatalogueBackingBean.managedBean.itemName}"
								completeMethod="#{pCatalogueBackingBean.autoCompleteItemName}"
								maxResults="15" dropdown="false" /> <p:watermark
								for="itemNameId" value="Search By Item Name Keywords"></p:watermark></td>
						<td style="padding-left: 5px;"><p:commandLink title="Search"
								update=":form" action="#{pCatalogueBackingBean.searchCatalogue}">
								<p:graphicImage value="/resources/ep/images/design/search.png"></p:graphicImage>
							</p:commandLink></td>

					</tr>
				</table>


				<div style="border: 2px solid #CFD62A; margin-top: 5px;"></div>

				<h:panelGroup id="frontPageId"
					rendered="#{pCatalogueBackingBean.managedBean.frontPage}">

					<p:panel header="Popular UNSPSC Categories in Commodity level"
						style="margin-top:10px;" toggleable="true">




						<p:dataGrid columns="4" rows="4" styleClass="publicCatGridCol"
							value="#{pCatalogueBackingBean.managedBean.popularCommodityList}"
							var="popular">
							<table>
								<tr>
									<td>#{popular.unspscTitle}</td>
								</tr>
								<tr>
									<td><p:commandLink value=">> Details"
											action="#{pCatalogueBackingBean.searchCatalogueByFamilyLevel(popular)}"
											update=":form"></p:commandLink></td>
								</tr>
							</table>

						</p:dataGrid>



					</p:panel>

				</h:panelGroup>

				<h:panelGroup id="resultpl"
					rendered="#{!pCatalogueBackingBean.managedBean.frontPage}">
					<table style="width: 100%; margin-top: 10px;">
						<tr style="vertical-align: top;">
							<td width="30%">

								<table style="width: 90%;">
									<tr>
										<td style="border-bottom: 1px solid #CFD62A;"><p:outputLabel
												value="Categories"
												style="font-weight:bold;padding-bottom: 10px;float:left;" /></td>
									</tr>
									<tr style="padding-top: 10px;">
										<td><ui:repeat var="family"
												value="#{pCatalogueBackingBean.managedBean.familyList}">
												<table>
													<tr>
														<td><p:commandLink value="#{family.unspscTitle}"
																action="#{pCatalogueBackingBean.searchCatalogueByFamilyLevel(family)}"
																update=":form" /></td>
													</tr>
												</table>
											</ui:repeat></td>
									</tr>
									<tr height="50px;">
										<td><h:panelGroup style="width:100%;"
												rendered="#{!(fn:length(pCatalogueBackingBean.managedBean.familyList) > 1) }">

												<table style="width: 100%;">
													<tr height="50px;">
														<td style="border-bottom: 1px solid #CFD62A;"><p:outputLabel
																style="font-weight:bold;float:left;"
																value="#{lbl['lbl.cm.brand']}"></p:outputLabel></td>
													</tr>

													<tr height="50px;">
														<td><p:selectOneMenu
																value="#{pCatalogueBackingBean.managedBean.brandId}"
																style="width:278px;">
																<f:selectItem itemLabel="Select One" itemValue="0" />
																<f:selectItems
																	value="#{pCatalogueBackingBean.managedBean.brandCriteria}" />
															</p:selectOneMenu></td>
													</tr>

												</table>

											</h:panelGroup></td>
									</tr>


									<tr height="50px;">
										<td style="border-bottom: 1px solid #CFD62A;"><p:outputLabel
												value="Price Range" style="font-weight:bold;float:left;" /></td>
									</tr>
									<tr height="50px;">
										<td>RM <p:inputText
												value="#{pCatalogueBackingBean.managedBean.priceForm}"
												size="15" /> - RM <p:inputText
												value="#{pCatalogueBackingBean.managedBean.priceTo}"
												size="15" />
										</td>
									</tr>
									<tr>
										<td><p:commandButton value="Go"
												action="#{pCatalogueBackingBean.searchCatalogueByPrice()}"
												update=":form" /></td>
									</tr>

								</table>


							</td>
							<td width="70%"><p:outputLabel
									rendered="#{pCatalogueBackingBean.managedBean.keyWord}"
									style="font-weight:bold;float:left;"
									value="#{fn:length(pCatalogueBackingBean.managedBean.catalogueList)} items found for #{pCatalogueBackingBean.managedBean.itemName}"></p:outputLabel>

								<p:outputLabel
									rendered="#{!pCatalogueBackingBean.managedBean.keyWord}"
									style="font-weight:bold;float:left;"
									value="#{fn:length(pCatalogueBackingBean.managedBean.catalogueList)} items found for #{pCatalogueBackingBean.managedBean.unspscTitle}"></p:outputLabel>



								<p:dataGrid columns="3" rows="9"
									value="#{pCatalogueBackingBean.managedBean.catalogueList}"
									id="catalogueGridViewID" var="supplierItem">
									<ac:paginator for="catalogueGridViewID"></ac:paginator>

									<table>
										<tr>
											<td><h:panelGroup
													rendered="#{fn:length(supplierItem.cmImages) == 0 }">

													<img src="/NGeP-portlet/images/noImage.jpg"
														style="height: 100px; width: 100px; left: 0px !important;" />

												</h:panelGroup> <h:panelGroup
													rendered="#{fn:length(supplierItem.cmImages) > 0 }">

													<img
														src="/NGeP-portlet/images/#{supplierItem.cmImages[0].imageName}"
														style="height: 100px; width: 100px; left: 0px !important;" />

												</h:panelGroup></td>
										</tr>
										<tr>
											<td><h:outputText
													value="#{supplierItem.cmItem.itemName}" /></td>
										</tr>
									</table>

								</p:dataGrid></td>
						</tr>

					</table>
				</h:panelGroup>


			</p:tab>
		</p:tabView>






	</ui:define>

</ui:composition>
