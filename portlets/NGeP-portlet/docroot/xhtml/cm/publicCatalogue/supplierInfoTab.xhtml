<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="cmSupplierInfoId">

		<table width="100%">
			<tr>
				<td width="15%"><p:outputLabel
						styleClass="outputLabel-view-label"
						value="#{lbl['lbl.cm.supplier.name']}" /></td>
				<td width="35%"><p:outputLabel
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.companyName}"
						styleClass="outputLabel-view" readonly="true"></p:outputLabel></td>
				<td width="15%"><p:outputLabel
						styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sc.gst.register.num']}" /></td>
				<td width="35%"><p:outputLabel styleClass="outputLabel-view"
						value="#{catalogueBackingBean.managedBean.smGstSupplier.gstRegNo}"
						readonly="true"
						rendered="#{catalogueBackingBean.managedBean.smGstSupplier ne null}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.companyaddress']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address1}"
						readonly="true" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sc.gst.effective.date']}" /></td>
				<td><h:outputText
						value="#{catalogueBackingBean.managedBean.smGstSupplier.gstEffDate}"
						rendered="#{catalogueBackingBean.managedBean.smGstSupplier ne null}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText></td>

			</tr>

			<tr>
				<td></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sc.gst.declared.date']}" /></td>
				<td><h:outputText
						value="#{catalogueBackingBean.managedBean.smGstSupplier.gstDeclaredDate}"
						rendered="#{catalogueBackingBean.managedBean.smGstSupplier ne null}">
						<f:convertDateTime
							pattern="#{CommonUtils.getDisplayDateTimeFormat(CommonConstants.DATE_FORMAT_TYPE_DATE)}" />
					</h:outputText></td>
			</tr>

			<tr>
				<td></td>
				<td colspan="2"><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address3}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.postcode']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.postcode}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.state']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmState.stateName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.district']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmCity.cityName}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.sm.towncity']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.pmDistrict.districtName}" /></td>
			</tr>

			<tr>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.cm.tel.no']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.phoneFull}"></p:outputLabel></td>
				<td><p:outputLabel styleClass="outputLabel-view-label"
						value="#{lbl['lbl.cm.fax.no']}" /></td>
				<td><p:outputLabel styleClass="outputLabel-view"
						readonly="true"
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.faxNo}"></p:outputLabel></td>
			</tr>
		</table>


	</p:outputPanel>


</ui:composition>
