<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<!-- <p:remoteCommand name="updateCoinSlider" update="imageUploadID2" ></p:remoteCommand> -->

	<h:outputScript library="jquery/slides" name="jquery.slides.js" />



	<script>
		function clearInvalidFileMsg() {

			importDevicesWidget.uploadContent.find("tr.ui-state-error")
					.remove();

		}
	</script>


	<p:messages id="catalogDetMsgId" showDetail="true" autoUpdate="true"
		closable="true" showSummary="false"></p:messages>

	<p:blockUI block="form" widgetVar="blockWidget">
		<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
	</p:blockUI>

	<p:outputPanel id="addCatDet">

		<div style="text-align: right; min-height: 40px;">
			<div style="float: left; clear: both;">
				<p:commandButton value="#{lbl['lbl.cm.back']}"
					rendered="#{!unspscCodeBackingBean.supplierTemp}"
					action="#{catalogueBackingBean.navigate}">
				</p:commandButton>
			</div>

			<h:panelGroup
				rendered="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier}">
				<p:commandButton value="#{lbl['lbl.cm.publish']}"
					rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P' and catalogueBackingBean.managedBean.displayCatalogue}"
					action="#{catalogueBackingBean.singleSubmitToReviewItems}"
					update="@form"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.cm.save.as.draft']}"
					rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P' and catalogueBackingBean.managedBean.displayCatalogue and !unspscCodeBackingBean.supplierTemp}"
					action="#{catalogueBackingBean.saveCatalogItem}" update="@form"></p:commandButton>

				<ui:remove>
					<p:commandButton value="#{lbl['lbl.cm.cancel']}"
						rendered="#{catalogueBackingBean.managedBean.displayCatalogue}"
						action="#{catalogueBackingBean.cancelToMaintenanceFile()}"></p:commandButton>
				</ui:remove>

				<div style="float: left; clear: both;">
					<ui:remove>
						<p:commandButton value="#{lbl['lbl.cm.back']}"
							rendered="#{!catalogueBackingBean.managedBean.displayCatalogue}"
							action="#{catalogueBackingBean.cancelToSupplierItemSearch()}">
						</p:commandButton>
					</ui:remove>

				</div>
			</h:panelGroup>

			<ui:remove>
				<h:panelGroup rendered="#{unspscCodeBackingBean.requisitioner}">
					<div style="float: left; clear: both;">
						<p:commandButton value="#{lbl['lbl.cm.back']}"
							action="#{catalogueBackingBean.cancelToSupplierItemSearch()}">
						</p:commandButton>
					</div>
				</h:panelGroup>
			</ui:remove>

			<h:panelGroup rendered="#{unspscCodeBackingBean.catalogueAdmin}">

				<p:commandButton value="#{lbl['lbl.btn.approve']}"
					action="#{reviewCatBackingBean.approveCatalogueItem}"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.btn.reject']}"
					update=":form:catalogDetMsgId :form:pricingTabID"
					action="#{reviewCatBackingBean.rejectCatalogueItem}"></p:commandButton>

				<ui:remove>
					<p:commandButton value="#{lbl['lbl.btn.cancel']}"
						action="#{reviewCatBackingBean.cancelToPendingApprovalItem()}"
						immediate="true">
					</p:commandButton>
				</ui:remove>

			</h:panelGroup>
		</div>


		<p:panel header="#{lbl['lbl.cm.item.details']}" toggleable="true">

			<h:panelGroup
				rendered="#{(unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier) 
				and catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U' and catalogueBackingBean.managedBean.displayCatalogue}">
				<table width="100%;">
					<tr>
						<td style="width: 90px;"></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.status']}" /></td>
						<td><p:selectOneRadio
								value="#{catalogueBackingBean.managedBean.selectedMaintainItem.recordStatus}">
								<f:selectItem itemLabel="#{lbl['lbl.cm.active']}"
									itemValue="true"></f:selectItem>
								<f:selectItem itemLabel="#{lbl['lbl.cm.inactive']}"
									itemValue="false"></f:selectItem>
							</p:selectOneRadio></td>
					</tr>
				</table>
			</h:panelGroup>

			<table style="width: 100%; margin-top: 10px;">
				<tr style="height: 30px;">
					<td rowspan="10"><h:outputText styleClass="instruction"
							value="#{lbl['lbl.cm.instruction.related.image']}"
							rendered="#{unspscCodeBackingBean.allSupplierWithoutTemp}" /><br /> <h:panelGroup
							id="refereshImageId">

							<h:panelGroup
								rendered="#{fn:length(catalogueBackingBean.managedBean.selectedMaintainItem.cmImages) == 0 }">
								<div
									style="display: block; width: 120px; padding: 60px; text-align: center; vertical-align: middle; border: 1px solid rgb(204, 204, 204);">#{lbl['lbl.cm.no.image.available']}</div>
							</h:panelGroup>

							<h:panelGroup
								rendered="#{fn:length(catalogueBackingBean.managedBean.selectedMaintainItem.cmImages) == 1 }">

								<div style="width: 250px; height: 150px;">
									<ui:repeat var="cmImage"
										value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmImages}">
										<p:graphicImage styleClass="catImageStyle"
											value="/image?imageName=#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.epNo}/#{cmImage.imageName}" />

									</ui:repeat>


								</div>
							</h:panelGroup>

							<h:panelGroup
								rendered="#{fn:length(catalogueBackingBean.managedBean.selectedMaintainItem.cmImages) > 1 }">

								<script>
			$(function() {
				$('#slides').slidesjs({
					width : 940,
					height : 528,
					navigation : {
						effect : "fade"
					},
					pagination : {
						effect : "fade"
					},
					effect : {
						fade : {
							speed : 400
						}
					}
				});
			});
		</script>


								<div id="slides" style="width: 250px;">
									<ui:repeat var="cmImage"
										value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmImages}">
										<p:graphicImage styleClass="catImageStyle"
											value="/image?imageName=#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.epNo}/#{cmImage.imageName}" />

									</ui:repeat>
								</div>



							</h:panelGroup>
						</h:panelGroup> <p:commandLink style="margin-left: 200px;padding-right: 10px;"
							title="#{lbl['lbl.cm.upload']}"
							rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P' and catalogueBackingBean.managedBean.displayCatalogue and !unspscCodeBackingBean.supplierTemp}"
							onclick="imageDialog.show(); clearInvalidFileMsg();">
							<p:graphicImage value="/css/images/design/upload.png"
								style="margin-top:10px;"></p:graphicImage>
						</p:commandLink> <p:commandLink
							rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P' and catalogueBackingBean.managedBean.displayCatalogue and !unspscCodeBackingBean.supplierTemp}"
							title="Delete" oncomplete="deleteImage.show()">
							<p:graphicImage style="padding-top:10px;"
								value="/css/images/design/trash.png"></p:graphicImage>
						</p:commandLink></td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.item.code']}" /></td>
					<td><p:outputLabel size="35" styleClass="outputLabel-view"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.extensionCode}"></p:outputLabel></td>
					<td><p:outputLabel styleClass="outputLabel-view-label"
							value="#{lbl['lbl.cm.item.name']}" /></td>
					<td style="overflow-wrap: break-word; width: 25%;"><p:outputLabel
							styleClass="outputLabel-view"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.itemName}"></p:outputLabel></td>
				</tr>

				<tr style="height: 30px;">

					<td><p:outputLabel value="#{lbl['lbl.cm.item.table.uom']}" />
						<p:outputLabel value="*" styleClass="mandatory" /></td>
					<td><ac:lov id="uomLovId" lovId="PM_UOM" size="26"
							headerText="#{lbl['lbl.cm.item.table.uom']}" readonly="true"
							saveObject="catalogueBackingBean.managedBean.selectedMaintainItem.pmUom"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.pmUom.uomName}"
							conditionField="recordStatus^1">
						</ac:lov> <ac:lovPopup /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.sku']}" /></td>
					<td><p:inputText size="35" maxlength="50"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.skuNumber}"
							readonly="#{!codificationBackingBean.productCode(catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.cmUnspsc.unspscCode) or unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"></p:inputText></td>
					<td></td>
				</tr>
				<tr style="height: 30px;">

					<td><p:outputLabel
							value="#{lbl['lbl.cm.manufacturing.part.no']}" /></td>
					<td><p:inputText size="35" maxlength="100"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.manufacturer}"
							readonly="#{!codificationBackingBean.productCode(catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.cmUnspsc.unspscCode) or unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.model']}" /></td>
					<td colspan="1"><p:inputText size="35" maxlength="20"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.modelNumber}"
							readonly="#{!codificationBackingBean.productCode(catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.cmUnspsc.unspscCode) or unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"></p:inputText></td>
				</tr>
				<tr style="height: 30px;">

					<td><p:outputLabel value="#{lbl['lbl.cm.min.order']}" /></td>
					<td><p:inputText size="35" label="#{lbl['lbl.cm.min.order']}"
							maxlength="6"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.minOrder}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.delivery.term']}" /></td>
					<td colspan="1"><p:inputText size="26" maxlength="6"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.leadTime}"
							converterMessage="#{lbl['lbl.cm.error.delivery.term']}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}" />
						<p:inputText style="margin-left: 2px;" size="3"
							value="#{lbl['lbl.cm.days']}" readonly="true" /></td>
				</tr>


				<tr style="height: 30px;">
					<td><p:outputLabel
							value="#{lbl['lbl.cm.additional.item.description']}" /></td>
					<td colspan="3"><p:inputTextarea maxlength="2000"
							style="width:80% !important;height:100px;overflow:scroll;"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemDesc}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue or unspscCodeBackingBean.supplierTemp}" /></td>

				</tr>


			</table>
		</p:panel>



		<p:dialog id="imageDialog" widgetVar="imageDialog" modal="true"
			width="700px" resizable="false" styleClass="pop_up_top">


			<p:fileUpload widgetVar="importDevicesWidget"
				fileUploadListener="#{catalogueBackingBean.imageUpload}"
				cancelLabel="#{lbl['lbl.btn.cancel']}"
				sizeLimit="#{catalogueBackingBean.getImageSize()}"
				uploadLabel="#{lbl['lbl.btn.upload']}"
				invalidSizeMessage="#{catalogueBackingBean.getInvalidFileSize()}"
				label="#{lbl['lbl.btn.choose']}" mode="advanced" id="upload"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp)$/"
				update=":form:deleteImage, :form:refereshImageId"
				invalidFileMessage="Only JPG, GIF, PNG, BMP files are accepted"
				multiple="true">
			</p:fileUpload>
		</p:dialog>



		<p:tabView id="pricingTabID" orientation="left"
			style="margin-top: 10px;"
			activeIndex="#{reviewCatBackingBean.managedBean.catDetTabActiveIndex}">

			<p:tab id="pricing1" title="#{lbl['lbl.cm.pricing']}">


				<p:tabView id="headerTabId"
					activeIndex="#{catalogueBackingBean.managedBean.pricingTabIndex}">


					<p:tab title="#{lbl['lbl.cm.normal']}">

						<p:tabView id="normalId"
							activeIndex="#{catalogueBackingBean.managedBean.normalPricingIndex}">

							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="pricingTab.xhtml" />
							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}"
								rendered="#{!unspscCodeBackingBean.supplierTemp}">
								<ui:include src="promotionTab.xhtml" />
							</p:tab>

						</p:tabView>



					</p:tab>

					<p:tab title="#{lbl['lbl.cm.tier']}"
						rendered="#{CommonUtils.convertStringToInteger(fn:substring(catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.extensionCode, 0, 2)) lt 70 and !unspscCodeBackingBean.supplierTemp}">

						<p:tabView id="tierId"
							activeIndex="#{catalogueBackingBean.managedBean.tierPricingIndex}">
							<p:ajax event="tabChange"
								update=":form:pricingTabID:headerTabId:tierId:pricingPromotionTierID" />


							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="pricingTierTab.xhtml" />
							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="pricingPromotionTierTab.xhtml" />
							</p:tab>

						</p:tabView>



					</p:tab>


					<p:tab title="#{lbl['lbl.cm.zonal']}"
						rendered="#{!unspscCodeBackingBean.supplierTemp}">

						<p:tabView id="zonalId"
							activeIndex="#{catalogueBackingBean.managedBean.zonalPricingIndex}">

							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="zonalStandardPricingTab.xhtml"></ui:include>

							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="zonalPromotionPricingTab.xhtml"></ui:include>

							</p:tab>

						</p:tabView>



					</p:tab>

					<p:tab title="#{lbl['lbl.cm.zonal.tier']}"
						rendered="#{CommonUtils.convertStringToInteger(fn:substring(catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.extensionCode, 0, 2)) lt 70 and !unspscCodeBackingBean.supplierTemp}">

						<p:tabView id="zonalTierId"
							activeIndex="#{catalogueBackingBean.managedBean.zonalTierPricingIndex}">
							<p:ajax event="tabChange"
								update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalPromotionTierPricingsId" />
							<p:tab title="#{lbl['lbl.cm.standard']}">
								<ui:include src="zonalTierPricingTab.xhtml"></ui:include>

							</p:tab>
							<p:tab title="#{lbl['lbl.cm.promotion']}">
								<ui:include src="zonalPromotionTierPricingTab.xhtml"></ui:include>

							</p:tab>

						</p:tabView>



					</p:tab>

				</p:tabView>



			</p:tab>







			<p:tab id="supplierInfoId" title="#{lbl['lbl.cm.supplier.info']}">
				<ui:include src="supplierInfoTab.xhtml"></ui:include>
			</p:tab>

			<p:tab id="remarkId" title="#{lbl['lbl.cm.reject.reason']}"
				rendered="#{(unspscCodeBackingBean.catalogueAdmin or unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier)
				and (catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'R' or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' )}">

				<ui:include src="remark.xhtml"></ui:include>

			</p:tab>

		</p:tabView>

		<p:dialog id="errorDialog" header="#{lbl['lbl.txt.error.list']}"
			widgetVar="errorDialog" modal="true" width="500" height="150">

			<p:panelGrid style="width:100%;">
				<p:row rendered="#{catalogueBackingBean.managedBean.error1}">
					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error1']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error2}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error2']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error3}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error3']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error4}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error4']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error5}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error5']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error6}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error6']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error7}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error7']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error8}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error8']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error9}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error9']}"></h:outputText>
					</p:column>
				</p:row>
				<p:row rendered="#{catalogueBackingBean.managedBean.error99}">

					<p:column style="border:none !important;">
						<h:outputText value="#{lbl['lbl.cm.error.error99']}"></h:outputText>
					</p:column>
				</p:row>

				<p:row>
					<p:column style="border:none !important;" colspan="1">
						<p:commandButton value="#{lbl['lbl.btn.ok']}" style="float:right;"
							onclick="errorDialog.hide();" />
					</p:column>
				</p:row>
			</p:panelGrid>
		</p:dialog>


		<p:dialog id="deleteImage"
			header="#{lbl['lbl.btn.delete']} #{lbl['lbl.cm.image']}"
			widgetVar="deleteImage" modal="true" width="500" height="500">


			<ui:include src="deleteImage.xhtml"></ui:include>


		</p:dialog>



	</p:outputPanel>


</ui:composition>
