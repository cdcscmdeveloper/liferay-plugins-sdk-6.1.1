<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:dataTable id="expiredSupplierItemID"
		value="#{catalogueBackingBean.managedBean.expiredItemList}"
		rowIndexVar="rowIndex" var="expired"
		rowKey="#{expired.supplierItemId}">

	
		<ac:paginator for="expiredSupplierItemID"></ac:paginator>
		<p:column width="30%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			
			#{expired.cmItem.itemName}

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{expired.cmStandardPricing.price}" size="10" disabled="true" style="text-align:right">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			<p:inputText value="#{expired.pmUom.uomName}" disabled="true"></p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{expired.cmStandardPricing.startDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>


		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{expired.cmStandardPricing.endDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>
			<p:commandLink title="Edit"
				action="#{catalogueBackingBean.navigateToExpiredItemDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>

		</p:column>
	</p:dataTable>

</ui:composition>
