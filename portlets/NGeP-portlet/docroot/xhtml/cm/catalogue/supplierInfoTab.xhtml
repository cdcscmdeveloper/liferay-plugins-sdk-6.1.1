	<p:outputPanel id="cmSupplierInfoId">

		<table width="100%">

				<td></td>
				<td></td>
			</tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.sm.companyaddress']}" /></td>

			</tr>

			<tr>
				<td></td>
				<td colspan="2"><p:inputText size="40" value="#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.smAppl.smCompanyBasic.smCompanyAddresses[0].smAddress.address2}" /></td>

			<tr>

				<td><p:outputLabel value="#{lbl['lbl.sm.state']}" /></td>

			<tr>

			<tr>
				<td><p:outputLabel value="#{lbl['lbl.cm.tel.no']}" /></td>

			</tr>
