<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<div style="text-align: right;">


		<p:commandButton value="#{lbl['lbl.cm.publish']}"
			id="approvedToPublishId"
			action="#{catalogueBackingBean.publishApprovedItems}"
			update="approvedSupplierItemID"
			disabled="#{fn:length(catalogueBackingBean.managedBean.selectedApprovedItems)&lt;1 }"></p:commandButton>
		<p:remoteCommand name="updateApproveItems"
			update="approvedSupplierItemID" />

	</div>
	<p:dataTable id="approvedSupplierItemID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{catalogueBackingBean.managedBean.approvedSearchDataModel}" style="width:100%;"
		rowIndexVar="rowIndex" var="approved"
		rowKey="#{approved.supplierItemId}" rows="10"
		selection="#{catalogueBackingBean.managedBean.selectedApprovedItems}">

		<p:column selectionMode="multiple" style="width:2%"
			rendered="#{fn:length(catalogueBackingBean.managedBean.approvedSearchDataModel.list) > 0 }" />

		<p:ajax event="rowSelectCheckbox" update=":form:approvedToPublishId"></p:ajax>
		<p:ajax event="rowUnselectCheckbox" update=":form:approvedToPublishId"></p:ajax>
		<p:ajax event="rowUnselect" update=":form:approvedToPublishId"></p:ajax>
		<p:ajax event="rowSelect" update=":form:approvedToPublishId"></p:ajax>
		<p:ajax event="toggleSelect" update=":form:approvedToPublishId" />

		<ac:paginator for="approvedSupplierItemID"></ac:paginator>

		<p:column width="3%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.code']}
			</f:facet>
			<h:outputText value="#{approved.cmItem.extensionCode}"
				style="white-space: normal" />
		</p:column>
		<p:column width="20%" style="white-space: normal;">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			<h:outputText value="#{approved.cmItem.itemName}"
				style="white-space: normal" />

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{approved.cmStandardPricing.price}" size="10"
				disabled="true" style="text-align:right">
				<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			<p:inputText value="#{approved.pmUom.uomName}" disabled="true"></p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{approved.cmStandardPricing.startDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>


		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{approved.cmStandardPricing.endDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>


		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>
			<p:commandLink title="Edit"
				action="#{catalogueBackingBean.navigateToApprovedItemDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/document.png"></p:graphicImage>
			</p:commandLink>
			<p:commandLink style="margin-left: 10px;"
				title="#{lbl['lbl.btn.delete']}" oncomplete="confirmation1.show();"
				action="#{catalogueBackingBean.setItemToDelete(approved.supplierItemId)}">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				<f:param name="index" value="#{rowIndex}"></f:param>
			</p:commandLink>
		</p:column>
	</p:dataTable>

</ui:composition>
