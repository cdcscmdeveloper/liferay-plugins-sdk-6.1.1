<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<p:dataTable
						value="#{codificationBackingBean.managedBean.unspscList}"
						var="selectedSuppCat" rowKey="#{selectedSuppCat.unspscID}">

						<p:column selectionMode="multiple" style="width:2%" />

						<p:column>
							<f:facet name="header">
								<p:outputLabel value="#{lbl['lbl.cm.item.name']}" />
							</f:facet>
							<p:outputLabel value="#{unspscObj.unspscCode}" />

						</p:column>
						<p:column>
							<f:facet name="header">
								<p:outputLabel value="#{lbl['lbl.cm.price']}" />
							</f:facet>
							<p:outputLabel value="#{unspscObj.unspscCode}" />
						</p:column>
						<p:column>
							<f:facet name="header">
								<p:outputLabel value="#{lbl['lbl.cm.start.date']}" />
							</f:facet>
							<p:outputLabel value="#{unspscObj.unspscCode}" />

						</p:column>
						<p:column>
							<f:facet name="header">
								<p:outputLabel value="#{lbl['lbl.cm.end.date']}" />
							</f:facet>
							<p:outputLabel value="#{unspscObj.unspscCode}" />

						</p:column>
						<p:column>
							<f:facet name="header">
								<p:outputLabel value="#{lbl['lbl.cm.action']}" />
							</f:facet>
							<p:commandButton
								action="#{catalogueBackingBean.navigateToCatalogDet()}"
								value="Details"></p:commandButton>

						</p:column>
		</p:dataTable>
</ui:composition>
