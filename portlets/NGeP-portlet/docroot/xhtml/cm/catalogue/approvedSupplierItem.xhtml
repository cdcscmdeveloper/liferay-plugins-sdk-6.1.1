<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.cm.publish']}"
			action="#{catalogueBackingBean.publishApprovedItems}"
			update="approvedSupplierItemID" rendered="#{fn:length(catalogueBackingBean.managedBean.approvedItemList) > 0 }"></p:commandButton>
		<p:remoteCommand name="updateApproveItems" update="approvedSupplierItemID" />
		
	</div>
	<p:dataTable id="approvedSupplierItemID"
		value="#{catalogueBackingBean.managedBean.approvedItemList}"
		rowIndexVar="rowIndex" var="approved"
		rowKey="#{approved.supplierItemId}"
		selection="#{catalogueBackingBean.managedBean.selectedApprovedItems}">

		<p:column selectionMode="multiple" style="width:2%" rendered="#{fn:length(catalogueBackingBean.managedBean.approvedItemList) > 0 }"/>
		
		<ac:paginator for="approvedSupplierItemID"></ac:paginator>

		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.code']}
			</f:facet>
			<h:outputText value="#{approved.cmItem.extensionCode}" style="white-space: normal"/>
		</p:column>
		<p:column width="30%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			<h:outputText value="#{approved.cmItem.itemName}" style="white-space: normal"/>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{approved.cmStandardPricing.price}" size="10" disabled="true" style="text-align:right">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			<p:inputText value="#{approved.pmUom.uomName}" disabled="true"></p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{approved.cmStandardPricing.startDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>


		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{approved.cmStandardPricing.endDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>


		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>
			<p:commandLink title="Edit"
				action="#{catalogueBackingBean.navigateToApprovedItemDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/document.png"></p:graphicImage>
			</p:commandLink>

		</p:column>
	</p:dataTable>

</ui:composition>
