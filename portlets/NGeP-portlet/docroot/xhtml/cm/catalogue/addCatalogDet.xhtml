<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<p:messages id="catalogDetMsgId" globalOnly="true"></p:messages>
	<p:outputPanel id="addCatDet">

		<div style="text-align: right;">

			<h:panelGroup
				rendered="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin}">
				<p:commandButton value="#{lbl['lbl.cm.submit']}"
					rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P'}"
					icon="ui-icon-submit"
					action="#{catalogueBackingBean.singleSubmitToReviewItems}"
					update="@form"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.cm.save.as.draft']}"
					icon="ui-icon-save"
					rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P'}"
					action="#{catalogueBackingBean.saveCatalogItem}" update="@form"></p:commandButton>
				<p:commandButton value="#{lbl['lbl.cm.cancel']}"
					icon="ui-icon-cancel"
					action="#{catalogueBackingBean.cancelToMaintenanceFile()}"
					immediate="true"></p:commandButton>

			</h:panelGroup>


			<h:panelGroup rendered="#{unspscCodeBackingBean.catalogueAdmin}">

				<p:commandButton value="Approve" icon="ui-icon-approve"
					action="#{reviewCatBackingBean.approveCatalogueItem}"></p:commandButton>
				<p:commandButton value="Reject" icon="ui-icon-reject"
					update=":form:catalogDetMsgId :form:pricingTabID"
					action="#{reviewCatBackingBean.rejectCatalogueItem}"></p:commandButton>

				<p:commandButton value="#{lbl['lbl.cm.cancel']}"
					icon="ui-icon-cancel"
					action="#{reviewCatBackingBean.cancelToPendingApprovalItem()}"
					immediate="true"></p:commandButton>

			</h:panelGroup>
		</div>


		<p:panel header="#{lbl['lbl.cm.item.details']}" toggleable="true">

			<h:panelGroup
				rendered="#{(unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin) 
				and catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U'}">
				<table width="100%;">
					<tr>
						<td style="width: 90px;"></td>
						<td><p:outputLabel value="#{lbl['lbl.cm.item.status']}" /></td>
						<td><p:selectOneRadio
								value="#{catalogueBackingBean.managedBean.selectedMaintainItem.recordStatus}">
								<f:selectItem itemLabel="Active" itemValue="true"></f:selectItem>
								<f:selectItem itemLabel="Inactive" itemValue="false"></f:selectItem>
							</p:selectOneRadio></td>
					</tr>
				</table>
			</h:panelGroup>

			<table style="width: 100%; margin-top: 10px;">
				<tr style="height: 30px;">
					<td rowspan="10" style="width: 250px;"><h:panelGrid
							styleClass="imageFrame">

							<p:galleria id="imageUploadID" autoPlay="false"
								value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmImages}"
								var="imageObj" panelWidth="230" panelHeight="150">
								<p:graphicImage id="imageId" height="150" width="230"
									value="/images/#{imageObj.imageName}" />
							</p:galleria>
						</h:panelGrid> <p:commandButton value="#{lbl['lbl.cm.upload']}"
							rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus != 'P' }"
							icon="ui-icon-upload" onclick="imageDialog.show()" /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.code']}" /></td>
					<td><p:inputText readonly="true" size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.extensionCode}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" /></td>
					<td><p:inputTextarea readonly="true" style="width: 195px;"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.itemName}"></p:inputTextarea></td>

				</tr>




				<tr style="height: 30px;">

					<td><p:outputLabel value="#{lbl['lbl.cm.uom']} *" /></td>
					<td><ac:lov id="uomLovId" lovId="PM_UOM" size="26"
							headerText="UOM Lov"
							saveObject="catalogueBackingBean.managedBean.selectedMaintainItem.pmUom"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.pmUom.uomName}"
							conditionField="recordStatus^1">
						</ac:lov> <ac:lovPopup /></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.sku']}" /></td>
					<td><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.skuNumber}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin}"></p:inputText></td>
					<td></td>
				</tr>
				<tr style="height: 30px;">

					<td><p:outputLabel
							value="#{lbl['lbl.cm.manufacturing.part.no']}" /></td>
					<td><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.manufacturer}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.model']}" /></td>
					<td colspan="1"><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.modelNumber}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin}"></p:inputText></td>
				</tr>
				<tr style="height: 30px;">

					<td><p:outputLabel value="#{lbl['lbl.cm.min.order']}" /></td>
					<td><p:inputText size="35"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.minOrder}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin}"></p:inputText></td>
					<td><p:outputLabel value="#{lbl['lbl.cm.delivery.term']}" /></td>
					<td colspan="1"><p:inputText size="26"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.leadTime}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin}" /> <p:inputText
							style="margin-left: 2px;" size="3" value="days" disabled="true" /></td>
				</tr>


				<tr style="height: 30px;">
					<td><p:outputLabel
							value="#{lbl['lbl.cm.additional.item.description']}" /></td>
					<td colspan="3"><p:inputTextarea style="width:660px;"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemDesc}"
							readonly="#{unspscCodeBackingBean.catalogueAdmin}" /></td>

				</tr>


			</table>
		</p:panel>

		<p:remoteCommand name="refresh" id="refresh"
			action="#{catalogueBackingBean.refreshImage}" />

		<p:dialog id="imageDialog" widgetVar="imageDialog" modal="true"
			width="700px" resizable="false" styleClass="pop_up_top">


			<p:fileUpload
				fileUploadListener="#{catalogueBackingBean.imageUpload}"
				oncomplete="refresh();" mode="advanced" id="upload"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update="imageUploadID">
			</p:fileUpload>

		</p:dialog>



		<p:tabView id="pricingTabID" orientation="left"
			activeIndex="#{reviewCatBackingBean.managedBean.catDetTabActiveIndex}">

			<p:tab id="pricing1" title="#{lbl['lbl.cm.pricing']}">


				<p:tabView id="headerTabId">


					<p:tab title="Normal">

						<p:tabView id="NormalId">


							<p:tab title="Standard">
								<ui:include src="pricingTab.xhtml" />
							</p:tab>
							<p:tab title="Promotion">
								<ui:include src="promotionTab.xhtml" />
							</p:tab>

						</p:tabView>



					</p:tab>

					<p:tab title="Tier">

						<p:tabView id="tierId">


							<p:tab title="Standard">
								<ui:include src="pricingTierTab.xhtml" />
							</p:tab>
							<p:tab title="Promotion">
								<ui:include src="pricingPromotionTierTab.xhtml" />
							</p:tab>

						</p:tabView>



					</p:tab>


					<p:tab title="Zonal">

						<p:tabView id="zonalId">

							<p:tab title="Standard">
								<ui:include src="zonalStandardPricingTab.xhtml"></ui:include>

							</p:tab>
							<p:tab title="Promotion">
								<ui:include src="zonalPromotionPricingTab.xhtml"></ui:include>

							</p:tab>

						</p:tabView>



					</p:tab>

					<p:tab title="Zonal Tier">

						<p:tabView id="zonalTierId">
							<p:tab title="Standard">
								<ui:include src="zonalTierPricingTab.xhtml"></ui:include>

							</p:tab>
							<p:tab title="Promotion">
								<ui:include src="zonalPromotionTierPricingTab.xhtml"></ui:include>

							</p:tab>

						</p:tabView>



					</p:tab>

				</p:tabView>



			</p:tab>







			<p:tab id="supplierInfoId" title="Supplier Info">
				<ui:include src="supplierInfoTab.xhtml"></ui:include>
			</p:tab>

			<p:tab id="remarkId" title="Reject Reason"
				rendered="#{(unspscCodeBackingBean.catalogueAdmin or unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin)
				and (catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'R' or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' )}">

				<ui:include src="remark.xhtml"></ui:include>

			</p:tab>

		</p:tabView>



	</p:outputPanel>


</ui:composition>
