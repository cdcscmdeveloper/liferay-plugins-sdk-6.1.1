<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="addCatDet">

		<div style="text-align: right;">
			<p:commandButton value="#{lbl['lbl.cm.ok']}"
				action="#{catalogueBackingBean.okToMaintenanceFile()}"></p:commandButton>
			<p:commandButton value="#{lbl['lbl.cm.cancel']}"
				action="#{catalogueBackingBean.cancelToMaintenanceFile()}"
				immediate="true"></p:commandButton>
			<p:commandButton value="Approve"
				action="#{reviewCatBackingBean.approveCatalogueItem}"></p:commandButton>
			<p:commandButton value="Reject"
				action="#{reviewCatBackingBean.rejectCatalogueItem}"></p:commandButton>
		</div>
		
		
		<p:outputLabel styleClass="screen-title" value="#{lbl['lbl.cm.item.details']}"></p:outputLabel>

		<div style="border-bottom: 1px solid;">
			
		</div>



		<table style="width: 100%; margin-top: 10px;">
			<tr style="height: 35px;">
				<td rowspan="10" style="width: 250px;"><h:panelGrid
						styleClass="imageFrame">
						<p:galleria id="imageUploadID"
							value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmImages}"
							var="imageObj" panelWidth="200" panelHeight="200">
							<p:graphicImage height="100" width="100"
								value="/image?imageName=#{imageObj.imagePath}" />
						</p:galleria>
					</h:panelGrid> <p:commandButton value="#{lbl['lbl.cm.upload']}"
						onclick="imageDialog.show()" /></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.item.code']}" /></td>
				<td><p:outputLabel
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.extensionCode}"></p:outputLabel></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.item.name']}" /></td>
				<td><p:outputLabel
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItem.itemName}"></p:outputLabel></td>

			</tr>
			<tr style="height: 35px;">

				<td><p:outputLabel value="#{lbl['lbl.cm.price']}" /></td>
				<td></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.currency']}" /></td>
				<td colspan="1"></td>
			</tr>




			<tr style="height: 35px;">

				<td><p:outputLabel value="#{lbl['lbl.cm.payment.term']}" /></td>
				<td><p:selectOneMenu></p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.sku']}" /></td>
				<td><p:inputText
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.skuNumber}"></p:inputText></td>
				<td></td>
			</tr>
			<tr style="height: 35px;">

				<td><p:outputLabel
						value="#{lbl['lbl.cm.manufacturing.part.no']}" /></td>
				<td><p:inputText
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.manufacturer}"></p:inputText></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.model']}" /></td>
				<td colspan="1"><p:inputText
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.modelNumber}"></p:inputText></td>
			</tr>
			<tr style="height: 35px;">
				<td rowspan="2"><p:outputLabel
						value="#{lbl['lbl.cm.additional.item.description']}" /></td>
				<td rowspan="2"><p:inputTextarea
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemDesc}" /></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.lead.time']}" /></td>
				<td colspan="1"><p:selectOneMenu></p:selectOneMenu></td>
			</tr>
			<tr style="height: 35px;">

				<td><p:outputLabel value="#{lbl['lbl.cm.unit.of.measurement']}" /></td>
				<td colspan="1"><p:selectOneMenu></p:selectOneMenu></td>
			</tr>
			<tr style="height: 35px;">

				<td><p:outputLabel value="#{lbl['lbl.cm.item.status']}" /></td>
				<td><p:selectOneMenu></p:selectOneMenu></td>
				<td><p:outputLabel value="#{lbl['lbl.cm.frequency']}" /></td>
				<td><p:inputText></p:inputText></td>
				<td></td>
			</tr>


		</table>

		<p:dialog id="imageDialog" widgetVar="imageDialog" modal="false"
			resizable="false" styleClass="pop_up_top">


			<p:fileUpload
				fileUploadListener="#{catalogueBackingBean.imageUpload}"
				mode="advanced" id="upload"
				allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|txt|xls|xlsx|pdf|doc|docx|csv)$/"
				invalidFileMessage="Only JPG, GIF, PNG, BMP, TXT, XLS, PDF, DOC, CSV files are accepted"
				update="imageUploadID">
			</p:fileUpload>

		</p:dialog>


		<p:tabView id="pricingTabID">

			<p:tab id="pricing1" title="#{lbl['lbl.cm.pricing']}">
				<ui:include src="pricingTab.xhtml" />
			</p:tab>
			<p:tab id="pricing2" title="Zonal Price">
				<ui:include src="zonalPricingTab.xhtml" />
			</p:tab>

		</p:tabView>



	</p:outputPanel>


</ui:composition>
