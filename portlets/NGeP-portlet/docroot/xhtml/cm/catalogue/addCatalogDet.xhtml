<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="addCatDet">

		<p:commandButton value="#{lbl['lbl.cm.ok']}" action="#{catalogueBackingBean.okToMaintenanceFile()}"></p:commandButton>
		<p:commandButton value="#{lbl['lbl.cm.cancel']}" action="#{catalogueBackingBean.cancelToMaintenanceFile()}"></p:commandButton>

		<div style="border-bottom: 1px solid;">
			<h:outputLabel styleClass="labelCss"
				value="#{lbl['lbl.cm.item.details']}"></h:outputLabel>
		</div>



		<table style="width: 100%; margin-top: 10px;">
			<tr style="height: 35px;">
				<td rowspan="10" style="width: 250px;"><h:panelGrid
						styleClass="imageFrame">
						<p:galleria  panelWidth="200" panelHeight="200">
							<p:graphicImage height="100" width="100" />
						</p:galleria>
					</h:panelGrid> <p:commandButton value="#{lbl['lbl.cm.upload']}" /></td>
				<td><h:outputLabel value="#{lbl['lbl.cm.item.code']}" /></td>
				<td><h:outputText></h:outputText>
				</td>
				<td><h:outputLabel value="#{lbl['lbl.cm.item.name']}" /></td>
				<td><h:outputText></h:outputText></td>

			</tr>
			<tr style="height: 35px;">

				<td><h:outputLabel value="#{lbl['lbl.cm.price']}" /></td>
				<td></td>
				<td><h:outputLabel value="#{lbl['lbl.cm.currency']}" /></td>
				<td colspan="1">
				</td>
			</tr>
			
		


			<tr style="height: 35px;">

				<td><h:outputLabel value="#{lbl['lbl.cm.payment.term']}" /></td>
				<td><h:selectOneMenu></h:selectOneMenu></td>
				<td><h:outputLabel value="#{lbl['lbl.cm.sku']}" /></td>
				<td><h:inputText></h:inputText></td>
				<td></td>
			</tr>
			<tr style="height: 35px;">

				<td><h:outputLabel value="#{lbl['lbl.cm.manufacturing.part.no']}" /></td>
				<td><h:inputText></h:inputText></td>
				<td><h:outputLabel value="#{lbl['lbl.cm.model']}" /></td>
				<td colspan="1"><h:inputText></h:inputText>
				</td>
			</tr>
			<tr style="height: 35px;">
				<td rowspan="2"><h:outputLabel
						value="#{lbl['lbl.cm.additional.item.description']}" /></td>
				<td rowspan="2"><p:inputTextarea /></td>
				<td><h:outputLabel value="#{lbl['lbl.cm.lead.time']}" /></td>
				<td colspan="1"><h:selectOneMenu></h:selectOneMenu></td>
			</tr>
			<tr style="height: 35px;">

				<td><h:outputLabel value="#{lbl['lbl.cm.unit.of.measurement']}" /></td>
				<td colspan="1"><h:selectOneMenu></h:selectOneMenu></td>
			</tr>
			<tr style="height: 35px;">

				<td><h:outputLabel value="#{lbl['lbl.cm.item.status']}" /></td>
				<td><h:selectOneMenu></h:selectOneMenu></td>
				<td><h:outputLabel value="#{lbl['lbl.cm.frequency']}" /></td>
				<td><h:inputText></h:inputText></td>
				<td></td>
			</tr>
			

		</table>
		
		
		<p:tabView id="pricingTabID">

			<p:tab id="pricing1" title="#{lbl['lbl.cm.pricing']}">
				<ui:include src="pricingTab.xhtml" />
			</p:tab>
			<p:tab id="pricing2" title="Zonal Price">
				<ui:include src="zonalPricingTab.xhtml" />
			</p:tab>

		</p:tabView>



	</p:outputPanel>


</ui:composition>
