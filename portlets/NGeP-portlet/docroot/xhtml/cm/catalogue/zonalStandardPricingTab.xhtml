<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:outputPanel id="zonalStandardPricingId">
	
	
	
		<p:dataTable id="zonalStandardPricingtableId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricings}"
			var="zonal" rowKey="#{zonal}"
			width="100%">
			
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.state.name']}
				</f:facet>
				<p:selectOneMenu  style="width: 128px;" 
						value="#{zonal.pmState.stateId}"> 
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItems
							value="#{catalogueBackingBean.managedBean.stateList}"
							var="state" itemLabel="#{state.stateName}"
							itemValue="#{state.stateId}"></f:selectItems>
							<p:ajax event="change" listener="#{catalogueBackingBean.retrieveDistrict(zonal)}" update=":form:pricingTabID:subPricingTabId:zonalStandardPricingtableId:districtDDId"/>
					</p:selectOneMenu>

			</p:column>
			
			
			
			<p:column >
				<f:facet name="header">
					#{lbl['lbl.cm.district.name']}
				</f:facet>
				<p:selectOneMenu  id="districtDDId" style="width: 128px;" 
						value="#{zonal.pmDistrict.districtId}"> 
						<f:selectItem itemLabel="Select One" itemValue="" />
						<f:selectItems
							value="#{catalogueBackingBean.managedBean.districtList}"
							var="district" itemLabel="#{district.districtName}"
							itemValue="#{district.districtId}"></f:selectItems>
							
					</p:selectOneMenu>

			</p:column>





			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<h:inputText value="#{zonal.price}" size="10"></h:inputText>
			</p:column>
		
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{zonal.startDate}" showOn="button" size="10"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{zonal.endDate}" showOn="button" size="10"></p:calendar>

			</p:column>

		</p:dataTable>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewZonalStandardPricing()}"
				update="zonalStandardPricingtableId" process="@this"></p:commandButton>
		</div>




	</p:outputPanel>


</ui:composition>
