<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="zStanPriceId">
		<p:dataTable id="zStanPriceTableId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.zStdPrices}"
			var="standard" rowKey="#{standard}" rowIndexVar="rowIndex"
			width="100%">


			<ac:paginator for="zStanPriceTableId"></ac:paginator>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.zm.name']}
				</f:facet>
				<p:selectOneMenu value="#{standard.cmSupplierZone.suppZoneId}" disabled="#{standard.standardDisabled}"
					style="width: 128px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>
					<p:ajax event="change" listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}" update="zonalStanErrorLink" />
				</p:selectOneMenu>

			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText value="#{standard.price}" size="10" disabled="#{standard.standardDisabled}" style="text-align:right">
					<p:ajax event="keyup" update="zonalStanErrorLink" />
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{standard.startDate}" showOn="button" size="10" mindate="#{catalogueBackingBean.managedBean.currentDate}" disabled="#{standard.standardDisabled}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}" update="zonalStanErrorLink" />
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}" update="zonalStanErrorLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{standard.endDate}" showOn="button" size="10" mindate="#{catalogueBackingBean.managedBean.currentDate}" disabled="#{standard.standardDisabled}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}" update="zonalStanErrorLink" />
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}" update="zonalStanErrorLink" />
				</p:calendar>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>

				<table width="5%">
					<tr>
						<td style="float: right;"><p:commandLink disabled="#{standard.standardDisabled}"
								style="margin-left: 10px;" title="Delete"
								action="#{catalogueBackingBean.deleteZonalStandardPrice(rowIndex)}"
								update=":form:pricingTabID:headerTabId:zonalId:zStanPriceTableId">
								<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
							</p:commandLink></td>

						<td style="text-align: right;">
							<p:panel id="zonalStanErrorLink" styleClass="noBorders tr,noBorders td">
								<p:commandLink title="Error" process="@this"
									actionListener="#{catalogueBackingBean.updateZonalStandardErrorDialog(rowIndex)}"
									update=":form" oncomplete="errorDialog.show();"
									rendered="#{(standard.price eq null or standard.startDate eq null or standard.endDate eq null or standard.startDate >= standard.endDate or standard.cmSupplierZone.suppZoneId == 0 or !standard.displayAction)}">
									<p:graphicImage
										value="/css/images/design/icon_error.png"></p:graphicImage>
								</p:commandLink>
								<p:graphicImage value="/css/images/design/icon_success.png" 
									rendered="#{!(standard.price eq null or standard.startDate eq null or standard.endDate eq null or standard.startDate >= standard.endDate or standard.cmSupplierZone.suppZoneId == 0 or !standard.displayAction)}"></p:graphicImage>
							</p:panel>	
						</td>
					</tr>


				</table>





			</p:column>

		</p:dataTable>

		<div class="clear"></div>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}" 
			rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'D' ||
			(catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U' and (unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier))}"
				action="#{catalogueBackingBean.addNewZonalStandardPricing()}" icon="ui-icon-add"
				update="zStanPriceTableId" process="@this zStanPriceId"></p:commandButton>
		</div>




	</p:outputPanel>


</ui:composition>
