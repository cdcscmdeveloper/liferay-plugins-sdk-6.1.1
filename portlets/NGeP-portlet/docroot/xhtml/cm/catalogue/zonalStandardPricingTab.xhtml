<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="zStanPriceId">
		<p:dataTable id="zStanPriceTableId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.zStdPrices}"
			var="standard" rowKey="#{standard}" rowIndexVar="rowIndex"
			width="100%">


			<ac:paginator for="zStanPriceTableId"></ac:paginator>

			
			<p:column>
				<f:facet name="header">
					Zone Name
				</f:facet>
				<p:selectOneMenu style="width: 128px;" rendered="#{standard.showFlag}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItem itemLabel="Zone A" itemValue="" />
					<f:selectItem itemLabel="Zone B" itemValue="" />
					
				</p:selectOneMenu>

			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<h:inputText value="#{standard.price}" size="10"
					rendered="#{standard.showFlag}"></h:inputText>
			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{standard.startDate}" showOn="button" size="10"
					rendered="#{standard.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{standard.endDate}" showOn="button" size="10"
					rendered="#{standard.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>

			<p:column width="5%">
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>

				<table>
					<tr>
						<td><p:commandLink style="margin-left: 10px;" title="Clone"
								rendered="#{standard.showFlag}"
								action="#{catalogueBackingBean.duplicateZonalStandardPrice(rowIndex)}"
								update=":form:pricingTabID:headerTabId:zonalId:zStanPriceTableId">
								<p:graphicImage value="/resources/ep/images/design/add.png"></p:graphicImage>
							</p:commandLink>&#160;</td>
						<td style="float: right;"><p:commandLink
								style="margin-left: 10px;" title="Delete"
								action="#{catalogueBackingBean.deleteZonalStandardPrice(rowIndex)}"
								update=":form:pricingTabID:headerTabId:zonalId:zStanPriceTableId">
								<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
							</p:commandLink></td>
					</tr>
				</table>





			</p:column>

		</p:dataTable>

		<div class="clear"></div>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewZonalStandardPricing()}"
				update="zStanPriceTableId" process="@this"></p:commandButton>
		</div>




	</p:outputPanel>


</ui:composition>
