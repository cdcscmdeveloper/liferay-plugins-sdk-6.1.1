<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="zStanPriceId">
		<p:dataTable id="zStanPriceTableId"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.zStdPrices}"
			var="standard" rowKey="#{standard}" rowIndexVar="rowIndex"
			width="100%">


			<ac:paginator for="zStanPriceTableId"></ac:paginator>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.zm.name']}
				</f:facet>
				<p:selectOneMenu value="#{standard.cmSupplierZone.suppZoneId}"
					disabled="#{standard.standardDisabled}" style="width: 128px;">
					<f:selectItem itemLabel="#{lbl['lbl.txt.select']}" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>
					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}"
						update="zonalStanErrorLink zPromoLink viewAllId" />
				</p:selectOneMenu>
				<p:commandLink id="viewAllId" title="#{lbl['lbl.cm.view']}"
					disabled="#{standard.cmSupplierZone.suppZoneId==0}" update=":form:zoneDtlsId"
					oncomplete="zoneDtlspopUp.show()"
					action="#{catalogueBackingBean.viewAllZone(standard.cmSupplierZone.suppZoneId)}">
					<p:graphicImage value="/css/images/design/document.png"></p:graphicImage>
				</p:commandLink>

			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText id="zonalStandPriceId" value="#{standard.price}" size="10" maxlength="18"
					disabled="#{standard.standardDisabled}" style="text-align:right">
					<p:ajax process="@this" update="zonalStanErrorLink zPromoLink zonalStandPriceId" />
					<f:converter converterId="bigDecimalConverter" />
				</p:inputText>
			</p:column>


			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{standard.startDate}" showOn="button" size="10" navigator="true"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					disabled="#{standard.standardDisabled}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}"
						update="zonalStanErrorLink zPromoLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}"
						update="zonalStanErrorLink zPromoLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{standard.endDate}" showOn="button" size="10" navigator="true"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					disabled="#{standard.standardDisabled}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}"
						update="zonalStanErrorLink zPromoLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateZonalStandardDateOverlap(rowIndex)}"
						update="zonalStanErrorLink zPromoLink" />
				</p:calendar>

			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>

				<p:commandLink title="#{lbl['lbl.btn.delete']}"
					action="#{catalogueBackingBean.setRowIndexForDelete(rowIndex)}"
					oncomplete="confirmationDeleteZonal.show()"
					update=":form:pricingTabID:headerTabId:zonalId:zStanPriceTableId">
					<f:param name="indexDelete" value="#{rowIndex}"></f:param>
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>




				<p:commandLink id="zPromoLink"
					title="#{lbl['lbl.cm.add.to.promotion']}"
					rendered="#{standard.showFlag}"
					disabled="#{standard.cmSupplierZone.suppZoneId eq 0 or standard.price eq null or standard.startDate eq null or standard.endDate eq null or standard.startDate >= standard.endDate or !standard.displayAction}"
					action="#{catalogueBackingBean.addToZonalPromotion(rowIndex)}"
					update=":form:pricingTabID:headerTabId:zonalId">
					<p:graphicImage height="16" width="16"
						value="/css/images/design/promo.png"></p:graphicImage>
				</p:commandLink>


				<h:panelGroup id="zonalStanErrorLink" style="border:none;">
					<p:commandLink title="#{lbl['lbl.txt.error']}" process="@this"
						actionListener="#{catalogueBackingBean.updateZonalStandardErrorDialog(rowIndex)}"
						update=":form" oncomplete="errorDialog.show();"
						rendered="#{(standard.price eq null or standard.startDate eq null or standard.endDate eq null or standard.startDate >= standard.endDate or standard.cmSupplierZone.suppZoneId == 0 or !standard.displayAction)}">
						<p:graphicImage value="/css/images/design/icon_error.png"></p:graphicImage>
					</p:commandLink>
					<p:graphicImage value="/css/images/design/icon_success.png"
						rendered="#{!(standard.price eq null or standard.startDate eq null or standard.endDate eq null or standard.startDate >= standard.endDate or standard.cmSupplierZone.suppZoneId == 0 or !standard.displayAction)}"></p:graphicImage>
				</h:panelGroup>


			</p:column>

		</p:dataTable>

		<div class="clear"></div>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}"
				rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'D' ||
			((catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'R' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'E') and (unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier))}"
				action="#{catalogueBackingBean.addNewZonalStandardPricing()}"
				update="zStanPriceTableId" process="@this zStanPriceId"></p:commandButton>
		</div>


		<p:confirmDialog id="confirmDeleteZonalId"
			message="#{lbl['lbl.cm.dialog.cofirm.delete.msg']}"
			header="#{lbl['lbl.cm.dialog.cofirm.header']}"
			widgetVar="confirmationDeleteZonal">

			<p:commandButton id="confirmID"
				value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
				actionListener="#{catalogueBackingBean.deleteZonalStandardPrice()}"
				update=":form" oncomplete="confirmationDeleteZonal.hide()" />
			<p:commandButton id="declineID"
				value="#{lbl['lbl.cm.dialog.cofirm.no']}"
				onclick="confirmationDeleteZonal.hide()" />

		</p:confirmDialog>


	</p:outputPanel>

	

</ui:composition>
