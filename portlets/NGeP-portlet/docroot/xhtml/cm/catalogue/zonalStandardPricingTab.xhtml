<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:panelGrid styleClass="tablePanel">
		<f:facet name="header">
			<p:row>
				<p:column>
							Pricing Type
						</p:column>
				<p:column>
							State
						</p:column>
				<p:column>
							District
						</p:column>
				<p:column>
							Price
						</p:column>
				<p:column>
							Start Date
						</p:column>
				<p:column>
							End Date
						</p:column>
			</p:row>

		</f:facet>

		<p:row>
			<p:column>
				<p:outputLabel value="Standard" />
			</p:column>

			<p:column>
				<p:selectOneMenu id="stateDDId"
					disabled="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.stateDisabled}"
					style="width: 128px;"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.pmState.stateId}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.stateList}" var="state"
						itemLabel="#{state.stateName}" itemValue="#{state.stateId}"></f:selectItems>
					<p:ajax event="change"
						listener="#{catalogueBackingBean.retrieveDistrict()}"
						update=":form:pricingTabID:subPricingTabId:districtDDId" />
				</p:selectOneMenu>

			</p:column>
			<p:column>
				<p:selectOneMenu id="districtDDId"
					disabled="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.districtDisabled}"
					style="width: 128px;"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.pmDistrict.districtId}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.pmDistricts}"
						var="district" itemLabel="#{district.districtName}"
						itemValue="#{district.districtId}"></f:selectItems>
				</p:selectOneMenu>

			</p:column>

			<p:column>
				<p:inputText
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.price}"
					size="10"></p:inputText>
			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.startDate}"
					size="10" showOn="button"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalStandardPricing.endDate}"
					size="10" showOn="button"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
		</p:row>


		<p:row>
			<p:column>
				<p:outputLabel value="Promotion" />
			</p:column>

			<p:column>
				<p:selectOneMenu style="width: 128px;"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.pmState.stateId}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.stateList}" var="state"
						itemLabel="#{state.stateName}" itemValue="#{state.stateId}"></f:selectItems>
					<p:ajax event="change"
						listener="#{catalogueBackingBean.retrievePromotionDistrict()}"
						update=":form:pricingTabID:subPricingTabId:zonalDistrictDDId" />
				</p:selectOneMenu>

			</p:column>
			<p:column>
				<p:selectOneMenu id="zonalDistrictDDId" style="width: 128px;"
					disabled="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.districtDisabled}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.pmDistrict.districtId}">
					<f:selectItem itemLabel="Select One" itemValue="" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.pmDistricts}"
						var="district" itemLabel="#{district.districtName}"
						itemValue="#{district.districtId}"></f:selectItems>

				</p:selectOneMenu>

			</p:column>

			<p:column>
				<p:inputText
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.price}"
					size="10"></p:inputText>
			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.startDate}"
					size="10" showOn="button"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalPromotionPricing.endDate}"
					size="10" showOn="button"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

			</p:column>
		</p:row>





	</p:panelGrid>




</ui:composition>
