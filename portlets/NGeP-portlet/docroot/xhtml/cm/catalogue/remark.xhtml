<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">



	<table style="width: 100%">
		<tr>
			<td width="30%"><p:selectManyCheckbox layout="pageDirection" disabled="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin}"
					value="#{catalogueBackingBean.managedBean.rejectReasonIds}">
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.statusDescList}"
						var="remark" itemLabel="#{remark.statusName}"
						itemValue="#{remark.statusDescId}"  ></f:selectItems>
					<p:ajax listener="#{catalogueBackingBean.enableRemark()}"
						update=":form:pricingTabID:remarkpg" />
				</p:selectManyCheckbox></td>
			<td>
				<h:panelGroup id="remarkpg">
				<p:inputTextarea id="remarkInputId"
					value="#{catalogueBackingBean.managedBean.rejectReason}"
					rendered="#{catalogueBackingBean.remarkRendered}"
					style="width: 95%;"></p:inputTextarea>
				</h:panelGroup>
			</td>
		</tr>
	</table>


</ui:composition>
