<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<h:panelGroup rendered="#{unspscCodeBackingBean.catalogueAdmin}">
		<table style="width: 100%; margin-left: 22px;">
			<tr>
				<td width="30%"><p:selectManyCheckbox layout="pageDirection" styleClass="float-left"
						disabled="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin}"
						value="#{catalogueBackingBean.managedBean.rejectReasonIds}">
						<f:selectItems
							value="#{catalogueBackingBean.managedBean.statusDescList}"
							var="remark" itemLabel="#{remark.statusName}"
							itemValue="#{remark.pmStatus.statusId}"></f:selectItems>
						<p:ajax listener="#{catalogueBackingBean.enableRemark}" update="@([id$=remarkpg])" />
					</p:selectManyCheckbox></td>
				<td style="vertical-align: bottom;">
				<h:panelGroup id="remarkpg">
						<p:inputTextarea id="remarkInputId" 
							readonly="#{unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin}"
							value="#{catalogueBackingBean.managedBean.rejectReason}"
							rendered="#{catalogueBackingBean.remarkRendered}"
							style="width: 78% !important;">
							<p:ajax partialSubmit="true" event="change" />
							</p:inputTextarea>
				</h:panelGroup></td>
			</tr>
		</table>
	</h:panelGroup>
	
	<div class="clear"></div>

	<p:panel header="Reject History" toggleable="true">

		<p:dataTable id="itemRejectReasonId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmItemRejectReasons}"
			var="reason">

			<ac:paginator for="itemRejectReasonId"></ac:paginator>

			<p:column headerText="Rejected By" width="5%">
				#{reason.createdUser}
		</p:column>

			<p:column headerText="Rejected Date" width="5%">
				<h:outputText value="#{reason.createdDate}">
					<f:convertDateTime pattern="dd/MM/yyyy hh:mm aaa" />
				</h:outputText>
			</p:column>

			<p:column headerText="Rejected Reason" width="5%">


				<h:outputText
					value="#{catalogueBackingBean.itemRejectReason(reason.pmStatus.statusId)}"></h:outputText>

			</p:column>

			<p:column headerText="Remark">

				<h:outputText value="#{reason.remark}"
					rendered="#{reason.pmStatus.statusId == 10010}" />


			</p:column>

		</p:dataTable>

	</p:panel>


</ui:composition>
