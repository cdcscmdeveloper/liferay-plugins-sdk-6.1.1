<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">







  <!--2020717@azza - Enhancement27627 - Start -->		
   <p:outputPanel id="normalpromotionPageID">
  <!--2020717@azza - Enhancement27627 - End -->	
	<p:panelGrid styleClass="tablePanel" style="width:100%;">
		<f:facet name="header">
			<p:row>
				<p:column>
							#{lbl['lbl.cm.price']}
						</p:column>
				<p:column>
							#{lbl['lbl.cm.start.date']}
						</p:column>
				<p:column>
							#{lbl['lbl.cm.end.date']}
						</p:column>
						
				<!--20200520@akmal - Enhancement27627 - Start -->		
				<p:column>
							#{lbl['lbl.cm.action']}
						</p:column>
				<!--20200520@akmal - Enhancement27627 - End -->
				
			</p:row>

		</f:facet>

		<!--20200520@akmal - Enhancement27627 - Start -->	
		<p:row rendered="#{catalogueBackingBean.isPromotionPriceExist(catalogueBackingBean.managedBean.selectedMaintainItem)}">
		<!--20200520@akmal - Enhancement27627 - End -->
		
			<p:column>
				<p:inputText id="promotionPriceId" disabled="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price}" maxlength="18" style="text-align:right">
						<f:converter converterId="bigDecimalConverter" />
					<p:ajax process="@this" update="promotionPriceId"></p:ajax>
				</p:inputText>
				<!-- 569 Start -->
				<p:graphicImage
				    rendered="#{catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price==null 
				    	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price le 0)
				    	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price ge catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.price)}"
				    value="#{catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price==null 
				    	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price le 0) 
				    	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price ge catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.price) ? '/css/images/design/icon_error.png' : ''}" 
				    update="@form" />
				<!-- 569 End -->
			</p:column>
			<p:column>
				<p:calendar disabled="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate}" mindate="#{catalogueBackingBean.managedBean.currentDate}" readonlyInput="true"
					showOn="button" navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					
				</p:calendar>
				<!-- 569 Start -->
				<p:graphicImage
				    rendered="#{catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate==null 
				   		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate gt catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate) 
				   		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate le catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.startDate) 
				   		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate gt catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.endDate)}"
				    value="#{catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate==null 
				    	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate gt catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate) 
				   		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate le catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.startDate) 
				   		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate gt catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.endDate) ? '/css/images/design/icon_error.png' : ''}" 
				   	update="@form" />
				<!-- 569 End -->
			</p:column>
			<p:column>
				<p:calendar disabled="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate}" mindate="#{catalogueBackingBean.managedBean.currentDate}" readonlyInput="true"
					showOn="button" navigator="true" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					
				</p:calendar>
				<!-- 569 Start -->
				<p:graphicImage
				    rendered="#{catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate==null and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate==null 
				  		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate gt catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate)
			   			or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate ge catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.endDate) 
				 	 	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate lt catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.startDate)
				 	 	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate lt catalogueBackingBean.managedBean.currentDate)}"
				    value="#{catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate==null and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate==null 
				    	or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate gt catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate)
			   			or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate ge catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.endDate) 
				  		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate lt catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.startDate) 
				  		or (catalogueBackingBean.managedBean.publish and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate lt catalogueBackingBean.managedBean.currentDate)? '/css/images/design/icon_error.png' : ''}" 
				  	update="@form" />
				<!-- 569 End -->
			</p:column>
			
			<!--20200520@akmal - Enhancement27627 - Start -->
			<p:column>
				<p:commandLink style="margin-left: 10px;"
					title="#{lbl['lbl.btn.delete']}" oncomplete="confirmationDelete.show();"
					action="#{catalogueBackingBean.setSingleItemToDelete(selectedSuppCat.supplierItemId)}"
					disabled="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}">
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					<f:param name="index" value="#{rowIndex}"></f:param>
				</p:commandLink>

			</p:column>
			<!--20200520@akmal - Enhancement27627 - End -->

		</p:row>
		
		
		<!--20200520@akmal - Enhancement27627 - Start -->
		<p:row rendered="#{!catalogueBackingBean.isPromotionPriceExist(catalogueBackingBean.managedBean.selectedMaintainItem)}">
			<p:column colspan="4">
				#{lbl['lbl.datatable.msg.no.records.found']}
			</p:column>
		</p:row>
		<!--20200520@akmal - Enhancement27627 - End -->

	</p:panelGrid>

	<!--20200520@akmal - Enhancement27627 - Start -->
	<div align="right">
	     <!--2020717@azza - Enhancement27627 - Start -->		
			<p:commandButton id="addPromoButton" 
				value="#{lbl['lbl.cm.add']}"
				action="#{catalogueBackingBean.addNewPromotionPricing()}"
				disabled="#{catalogueBackingBean.isPromotionPriceExist(catalogueBackingBean.managedBean.selectedMaintainItem) or
					unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
				update="normalpromotionPageID" 
				process="@this"></p:commandButton>
		<!--2020717@azza - Enhancement27627 - End -->		
	</div>
	
	<p:confirmDialog id="confirmDeleteId"
			message="#{lbl['lbl.cm.dialog.cofirm.delete.msg']}"
			header="#{lbl['lbl.cm.dialog.cofirm.header']}"
			widgetVar="confirmationDelete">
             <!--2020717@azza - Enhancement27627 - Start -->
			<p:commandButton id="confirmID"
				value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
				actionListener="#{catalogueBackingBean.deletePromotionPrice()}"
				update="normalpromotionPageID" oncomplete="confirmationDelete.hide()" />
			  <!--2020717@azza - Enhancement27627 - Start -->
			<p:commandButton id="declineID"
				value="#{lbl['lbl.cm.dialog.cofirm.no']}"
				onclick="confirmationDelete.hide()" />

	</p:confirmDialog>
	<!--20200520@akmal - Enhancement27627 - End -->
	
	<!--2020717@azza - Enhancement27627 - Start -->		
	</p:outputPanel>
	<!--2020717@azza - Enhancement27627 - End -->		


</ui:composition>
