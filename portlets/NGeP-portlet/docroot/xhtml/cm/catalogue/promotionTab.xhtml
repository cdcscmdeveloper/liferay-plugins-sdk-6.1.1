<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">









	<p:panelGrid styleClass="tablePanel">
		<f:facet name="header">
			<p:row>
				<p:column>
							Pricing Type
						</p:column>
				<p:column>
							Price (RM)
						</p:column>
				<p:column>
							Start Date
						</p:column>
				<p:column>
							End Date
						</p:column>
				<p:column>
							#{lbl['lbl.cm.action']}
						</p:column>
			</p:row>

		</f:facet>


		<p:row>
			<p:column>
				<p:outputLabel value="Promotion" />
			</p:column>
			<p:column>
				<p:inputText
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price}">
					<p:ajax event="keyup" update="promotionErrorLink" />
					</p:inputText>
			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate}"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" update="promotionErrorLink" />
					<p:ajax event="keyup" update="promotionErrorLink" />
					</p:calendar>

			</p:column>
			<p:column>
				<p:calendar
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate}"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" update="promotionErrorLink" />
					<p:ajax event="keyup" update="promotionErrorLink" />
					</p:calendar>

			</p:column>
			<p:column>
				<p:commandLink id="promotionErrorLink" title="Error" update=":form"
					oncomplete="errorDialog.show();"
					actionListener="#{catalogueBackingBean.updatePromotionErrorDialog()}"
					disabled="#{!(catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate >= catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate 
					or catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price > catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.price 
					or catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.startDate > catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate 
					or catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate > catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.endDate) 
					|| (catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.price eq null 
					and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.startDate eq null 
					and catalogueBackingBean.managedBean.selectedMaintainItem.cmPromotionPricing.endDate eq null)}">
					
				
					
					<p:graphicImage value="/resources/ep/images/design/icon_error.png"></p:graphicImage>
				</p:commandLink>
			</p:column>
			
			
			
		</p:row>



	</p:panelGrid>







</ui:composition>
