<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.cm.upload']}" icon="ui-icon-upload"
			onclick="excelDialog.show()"></p:commandButton>

		<p:commandButton id="downloadLink"
			value="#{lbl['lbl.cm.download']}" icon="ui-icon-download" ajax="false">
			<p:fileDownload value="#{catalogueBackingBean.file}" />
		</p:commandButton>

		<p:commandButton value="#{lbl['lbl.cm.save']}" icon="ui-icon-save"
			action="#{catalogueBackingBean.saveCatalogItem}"></p:commandButton>

		<p:commandButton value="#{lbl['lbl.cm.submit']}" icon="ui-icon-submit"
			action="#{catalogueBackingBean.submitToReviewItems}"
			update="draftSupplierItemID"></p:commandButton>
	</div>



	<p:dataTable id="draftSupplierItemID"
		value="#{catalogueBackingBean.managedBean.maintainItemList}"
		rowIndexVar="rowIndex" var="selectedSuppCat"
		rowKey="#{selectedSuppCat.supplierItemId}"
		selection="#{catalogueBackingBean.managedBean.selectedMaintainItems}">

		<p:column selectionMode="multiple" style="width:2%" />

		<p:column>
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			
			#{selectedSuppCat.cmItem.itemName}

		</p:column>
		<p:column>
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>

		</p:column>
		<p:column>
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>


		</p:column>
		<p:column>
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>


		</p:column>
		<p:column>
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>
			<p:commandButton
				action="#{catalogueBackingBean.navigateToCatalogDet(rowIndex)}"
				value="Details"></p:commandButton>
		</p:column>
	</p:dataTable>
	<p:dialog id="excelDialog" widgetVar="excelDialog" modal="true"
		resizable="false" appendToBody="true">


		<p:fileUpload fileUploadListener="#{catalogueBackingBean.uploadExcel}"
			mode="advanced" id="upload" allowTypes="/(\.|\/)(xls|flv|xlsx)$/"
			invalidFileMessage="Only XLS files are accepted">
		</p:fileUpload>

	</p:dialog>
</ui:composition>
