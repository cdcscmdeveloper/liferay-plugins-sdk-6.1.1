<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<script type="text/javascript">
		function clearInvalidFileMsg() {
			fileUploadWidget.uploadContent.find("tr.ui-state-error").remove();
		}
	</script>

	<div style="text-align: right;">
		<p:commandButton id="saveLink" value="#{lbl['lbl.cm.save']}"
			disabled="#{fn:length(catalogueBackingBean.managedBean.cloneCmSupplierItemLs)&lt;1}"
			action="#{catalogueBackingBean.saveMultipleDraftMaintainItem()}" update="@form"></p:commandButton>
			
		<p:commandButton value="#{lbl['lbl.cm.upload']}" rendered="#{!unspscCodeBackingBean.supplierTemp}"
			onclick="excelDialog.show(); clearInvalidFileMsg();" />

		<p:commandButton id="downloadLink" value="#{lbl['lbl.cm.download']}" rendered="#{!unspscCodeBackingBean.supplierTemp}"
			disabled="#{fn:length(catalogueBackingBean.managedBean.cloneCmSupplierItemLs)&lt;1}"
			update=":form" ajax="false">
			<p:fileDownload value="#{catalogueBackingBean.file}" />
		</p:commandButton>


		<p:commandButton id="submitLink" value="#{lbl['lbl.cm.publish']}"
			disabled="#{fn:length(catalogueBackingBean.managedBean.cloneCmSupplierItemLs)&lt;1}"
			action="#{catalogueBackingBean.submitToReviewItems(true)}" update="@form"></p:commandButton> <!-- #30457 -->
	</div>

	<ac:lovPopup />

	
	<p:remoteCommand name="refreshDraftSuppItem" id="refreshDraftSuppItem"
		action="#{catalogueBackingBean.checkingCheckAll}"
		update=":form:draftSupplierItemID:selectAllCheckBoxId"></p:remoteCommand>


		<table style="width: 100%; height: 100%;">
			<tr>
				<td width="100%"><h:outputText styleClass="instruction"
						style="float:left;margin-left:5px;" escape="false"
						value="#{lbl['lbl.cm.instruction.new1']}" /></td> <!-- #30457 -->
			</tr>
		</table>
		
		<ui:include src="/xhtml/common/uompopup.xhtml"></ui:include>
		
		

		
			<table style="width: 100%">
				<tr>
					<td><p:panel style="width: 100%;"
							header="#{lbl['lbl.cm.define.search']}" toggleable="true"
							id="searchTabId">
							<table style="margin-top: 10px; width: 100%;">
								<tr>
									<td width="15%"><p:outputLabel
											value="#{lbl['lbl.cm.item.code']}" /></td>
									<td width="35%"><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemCodeFilterBean.searchValue}"></p:inputText>
										</td>
									<td width="15%"><p:outputLabel
											value="#{lbl['lbl.cm.item.name']}" /></td>
									<td width="35%%"><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText>
										</td>
									
								</tr>
							</table>
							<div style="text-align: left;">
								<p:commandButton value="#{lbl['lbl.cm.search']}"
									action="#{catalogueBackingBean.managedBean.searchCatalogueMaintenance}" update="draftSupplierItemID" id="searchButtonId">

								</p:commandButton>
								<p:commandButton value="#{lbl['lbl.btn.reset']}"
									action="#{catalogueBackingBean.resetAction}"
									update="catMainItemViewID">
								</p:commandButton>
							</div>
						</p:panel>
					</td>
				</tr>
			</table>
			
	
		<p:dataTable id="draftSupplierItemID" lazy="true" style="width:100%;"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{catalogueBackingBean.managedBean.draftSearchDataModel}"
			rowIndexVar="rowIndex" var="selectedSuppCat"
			rowKey="#{selectedSuppCat.supplierItemId}" rows="10">
	
			<ac:paginator for="draftSupplierItemID"></ac:paginator>
			
			
	        <!-- #30457 - change width -->
			<p:column style="text-align: left;width:1%;">
				<f:facet name="header">
					<p:selectBooleanCheckbox id="selectAllCheckBoxId"
						value="#{catalogueBackingBean.managedBean.supplierItemcheckBoxAll}">
						<p:ajax event="change"
							listener="#{catalogueBackingBean.cloneAllSupplierItemSelection()}"
							update=":form:downloadLink,:form:saveLink, :form:submitLink, @(.ui-chkbox[id$=singleCheckBoxID])"></p:ajax>
					</p:selectBooleanCheckbox>
				</f:facet>
				<p:selectBooleanCheckbox id="singleCheckBoxID"
					value="#{selectedSuppCat.selected}">
					<p:ajax event="change"
						listener="#{catalogueBackingBean.cloneItemSelection(rowIndex)}"
						update=":form:downloadLink,:form:saveLink, :form:submitLink,  @(.ui-chkbox[id$=selectAllCheckBoxId])  "></p:ajax>
				</p:selectBooleanCheckbox>
			</p:column>
	
			<p:column width="3%">
				<f:facet name="header">
					#{lbl['lbl.cm.item.code']}
				</f:facet>
				<h:outputText value="#{selectedSuppCat.cmItem.extensionCode}"
					style="white-space: normal" />
			</p:column>
	
			<p:column width="20%" style="white-space: normal;">
				<f:facet name="header">
					#{lbl['lbl.cm.item.name']}     
				</f:facet>
				<h:outputText value="#{selectedSuppCat.cmItem.itemName}" />
	
			</p:column>
			<!-- #30457 - change width -->
			<p:column width="4%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.cm.price']}" />
				</f:facet>
				<!-- #30457 - Start -->
				<p:inputText id="stdPrice" value="#{selectedSuppCat.cmStandardPricing.price}"
					maxlength="18" label="#{lbl['lbl.cm.price']}" size="10"
					style="text-align:right">	
					<f:convertNumber
					pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
					<p:ajax event="blur" update="stdPrice" />
				</p:inputText>
	        <!-- #30457 - End -->
			</p:column>
			<!-- #30457 - change width -->
			<p:column width="4%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.cm.uom']}" />
				</f:facet>
				
				<p:autoComplete panelStyleClass="uomAuto" id="uomDraftId" scrollHeight="250" size="20" var="pmUom" converter="PmUomConverter"
								itemLabel="#{catalogueBackingBean.retriveUomCodeDesc(pmUom)}"
								itemValue="#{pmUom}" 
								value="#{selectedSuppCat.pmUom}"
								completeMethod="#{catalogueBackingBean.autoCompleteUom}"
								maxResults="50" dropdown="false" forceSelection="true" />
				
			</p:column>
			<!-- #30457 start -->
			<p:column  style="text-align: center;" width="2%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.cm.suptemp.upload.image']}" escape="false"/>
				</f:facet>
				<p:commandLink actionListener="#{catalogueBackingBean.loadBasicImageDialog(rowIndex,false)}" 
					update=":form:uplimg:imageAndBasicId" oncomplete="imageBasicDialog.show()" >
					<p:graphicImage id="uploadImage" value="/css/images/design/document.png" 
					title="#{lbl['lbl.cm.suptemp.upload.image.tooltip']}" /> 
				</p:commandLink>
			</p:column>
				<!-- #30457 end -->
			<!-- #30457 - change width -->
			<p:column width="4%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.cm.start.date']}" />
				</f:facet>
				<p:calendar value="#{selectedSuppCat.cmStandardPricing.startDate}" readonlyInput="true"
					navigator="true" showOn="button" size="10"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.onDateSelectListener(selectedSuppCat.cmStandardPricing)}" update="standardEndDateId"/>
				</p:calendar>
	
			</p:column>
			<p:column width="2%">
				<f:facet name="header">
					<h:outputText value="* " styleClass="mandatory" />
					<h:outputText value="#{lbl['lbl.cm.end.date']}" />
				</f:facet>
				<p:calendar value="#{selectedSuppCat.cmStandardPricing.endDate}" readonlyInput="true"
					navigator="true" showOn="button" size="10" 
					id="standardEndDateId"  maxdate="#{catalogueBackingBean.getNextTwoYear(selectedSuppCat.cmStandardPricing.startDate)}"
					disabled="#{selectedSuppCat.cmStandardPricing.startDate==null}"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>
	
			</p:column>
			<p:column width="2%">
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
	
				<h:panelGroup rendered="#{!unspscCodeBackingBean.supplierTemp}">
					<p:commandLink title="#{lbl['lbl.cm.zm.edit']}"
						action="#{catalogueBackingBean.navigateToCatalogDet(rowIndex)}">
						<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
					</p:commandLink>
				</h:panelGroup>
				<p:commandLink style="margin-left: 10px;"
					title="#{lbl['lbl.btn.delete']}" oncomplete="confirmation1.show();"
					action="#{catalogueBackingBean.setItemToDelete(selectedSuppCat.supplierItemId, rowIndex)}">
					<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
					<f:param name="index" value="#{rowIndex}"></f:param>
				</p:commandLink>
	
			</p:column>
			
		</p:dataTable>


	<div class="clear"></div>

	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.cm.add.new.item']}"
			action="#{catalogueBackingBean.navigateToSearchCode}" />

	</div>

	<!-- #30457 start-->
	
	<h:form id="uplexcl" enctype="multipart/form-data">
	<p:dialog id="excelDialog" widgetVar="excelDialog" modal="true"
		width="500px" onShow="singleUploadListener(fileUploadWidget);"
		resizable="false" styleClass="pop_up_top">
		<p:fileUpload fileUploadListener="#{catalogueBackingBean.uploadExcel}"
			cancelLabel="#{lbl['lbl.btn.cancel']}" multiple="false"
			uploadLabel="#{lbl['lbl.btn.upload']}" showButtons="false"
			label="#{lbl['lbl.btn.choose']}" widgetVar="fileUploadWidget"
			mode="advanced" id="upload" allowTypes="/(\.|\/)(xls|flv|xlsx)$/"
			update=":form" invalidFileMessage="#{lbl['lbl.cm.only.xls']}"
			oncomplete="excelDialog.hide()">
		</p:fileUpload>
	</p:dialog>
	</h:form>

	<h:form id="uplimg" enctype="multipart/form-data">
	<ui:param name="multipleFile" value="true"/>
	<ui:param name="updateImg" value=":form:uplimg:imageUploadId"/>
	<ui:include src="imageAndBasicPopup.xhtml" />
	</h:form>
	<!-- #30457 end-->
	

</ui:composition>
