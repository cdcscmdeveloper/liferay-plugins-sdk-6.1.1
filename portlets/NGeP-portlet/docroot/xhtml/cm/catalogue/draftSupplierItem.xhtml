<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<script type="text/javascript">
  

    function clearInvalidFileMsg() {
    	fileUploadWidget.uploadContent.find("tr.ui-state-error").remove();
    }
</script>

	<div style="text-align: right;">
		<p:commandButton value="#{lbl['lbl.cm.upload']}" icon="ui-icon-upload"
			onclick="excelDialog.show(); clearInvalidFileMsg();"></p:commandButton>

		<p:commandButton id="downloadLink" value="#{lbl['lbl.cm.download']}"
			disabled="#{1 > fn:length(catalogueBackingBean.managedBean.selectedMaintainItems)}"
			update=":form" icon="ui-icon-download" ajax="false">
			<p:fileDownload value="#{catalogueBackingBean.file}" />
		</p:commandButton>


		<p:commandButton value="#{lbl['lbl.cm.submit']}" icon="ui-icon-submit"
			action="#{catalogueBackingBean.submitToReviewItems}" update="@form"></p:commandButton>
	</div>

	<ac:lovPopup />

	<p:dataTable id="draftSupplierItemID"
		value="#{catalogueBackingBean.managedBean.maintainItemList}"
		rowIndexVar="rowIndex" var="selectedSuppCat"
		rowKey="#{selectedSuppCat.supplierItemId}"
		selection="#{catalogueBackingBean.managedBean.selectedMaintainItems}">

		<ac:paginator for="draftSupplierItemID"></ac:paginator>

		<p:column selectionMode="multiple" style="width:2%" />

		<p:ajax event="rowSelectCheckbox" update="@(.ui-button[id$=downloadLink])"></p:ajax>
		<p:ajax event="rowUnselectCheckbox" update="@(.ui-button[id$=downloadLink])"></p:ajax>
		<p:ajax event="rowUnselect" update="@(.ui-button[id$=downloadLink])"></p:ajax>
		<p:ajax event="rowSelect" update="@(.ui-button[id$=downloadLink])"></p:ajax>
		<p:ajax event="toggleSelect" update="@(.ui-button[id$=downloadLink])" />

		<p:column width="30%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			
			#{selectedSuppCat.cmItem.itemName}

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.price']}" />
			</f:facet>
			<p:inputText value="#{selectedSuppCat.cmStandardPricing.price}" size="10" style="text-align:right">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.uom']}" />
			</f:facet>
			<ac:lov id="draftUomLovId" lovId="PM_UOM" size="20" headerText="UOM" readonly="true"
				saveObject="catalogueBackingBean.managedBean.maintainItemList[#{rowIndex}].pmUom"
				value="#{selectedSuppCat.pmUom.uomName}"
				conditionField="recordStatus^1">
			</ac:lov>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.start.date']}" />
			</f:facet>
			<p:calendar value="#{selectedSuppCat.cmStandardPricing.startDate}"
				showOn="button" size="10" mindate="#{catalogueBackingBean.managedBean.currentDate}"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.end.date']}" />
			</f:facet>
			<p:calendar value="#{selectedSuppCat.cmStandardPricing.endDate}"
				showOn="button" size="10" mindate="#{catalogueBackingBean.managedBean.currentDate}"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>

			<p:commandLink title="Edit"
				action="#{catalogueBackingBean.navigateToCatalogDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>
			<p:commandLink style="margin-left: 10px;" title="Delete"
				action="#{catalogueBackingBean.deleteDraftItem(rowIndex)}"
				update="@form">
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
			</p:commandLink>
		</p:column>
	</p:dataTable>

	<div class="clear"></div>

	<div style="text-align: right;">
		<p:commandButton value="Add" icon="ui-icon-add"
			action="#{catalogueBackingBean.navigateToSearchCode}" />

	</div>


	<p:dialog id="excelDialog" widgetVar="excelDialog" modal="true"
		resizable="false" styleClass="pop_up_top">


		<p:fileUpload fileUploadListener="#{catalogueBackingBean.uploadExcel}"
			widgetVar="fileUploadWidget" mode="advanced" id="upload"
			allowTypes="/(\.|\/)(xls|flv|xlsx)$/" update="@form"
			invalidFileMessage="Only XLS files are accepted">
		</p:fileUpload>

	</p:dialog>
</ui:composition>
