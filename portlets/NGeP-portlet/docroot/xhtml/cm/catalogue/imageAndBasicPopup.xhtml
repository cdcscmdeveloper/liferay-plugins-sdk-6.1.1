<!-- 30457 new files -->
<ui:composition xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc"
	xmlns:p="http://primefaces.org/ui">
	
	<style type="text/css">
		#imageAndBasicId.ui-dialog {
		position: fixed !important;
		}
		.imageRightBtn .ui-widget-header{
		    background: transparent;
		    float: right;
		}
		.imageRightBtn .ui-fileupload .start {
        display: none;
	    }
	    .imageRightBtn .ui-fileupload .cancel {
	        display: none;
	    }
	    .imageRightBtn .ui-fileupload .progress {
	        display: none;
	    }
	    .imageRightBtn .fileupload-buttonbar .ui-state-disabled{
	    	background: #c1c1c1 !important;
	    	opacity: 0.55;
	    }
	</style>
			
	<p:dialog id="imageAndBasicId" widgetVar="imageBasicDialog" position="center"
		width="780" height="400" closable="true" resizable="true" styleClass="pop_up_top"
		header="#{lbl['lbl.cm.image.basic.item.spec']}" modal="true" >
			<c:if test="#{!catalogueBackingBean.managedBean.viewOnlyBasicPopup}">
				<p:ajax event="close" process="@form"
				listener="#{catalogueBackingBean.closeImagePopup()}"/>
			</c:if>

			<p:blockUI block="imageAndBasicIdPopup" widgetVar="popupBlockWidget">
				<p:graphicImage value="/css/images/ajax-loader.gif"></p:graphicImage>
			</p:blockUI>
			<p:growl for="growlMssg" showDetail="true"/>
			<p:outputPanel id="imageAndBasicIdPopup" layout="block">			
				<p:panel id="imageUploadId" header="#{lbl['lbl.pm.profiles.userdetails.upload.image']}" toggleable="true">
					<table class="noBorder" width="100%">
						<tr class="noBorder">
							<td class="noBorder" width="80%">
								<p:dataTable value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmImages}" 
								var="item" id="imageTable" rowIndexVar="rowIndex" rowKey="#{item.supplierItemId}"
								emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}">
									<!-- disable button when list have 1 image, find value for image based on item-->
									<p:column width="85%" style="text-align: center;">
										<f:facet name="header">
											<h:outputText value="* " styleClass="mandatory" />
											<h:outputText value="#{lbl['lbl.cm.image']}" />
										</f:facet>
										
										<p:graphicImage styleClass="catImageStyle"
											value="/image?imageName=#{catalogueBackingBean.managedBean.selectedMaintainItem.smSupplier.epNo}/#{item.imageName}" />
										
									</p:column>
									<p:column width="15%" headerText="#{lbl['lbl.cm.action']}" style="text-align: center;">
										<p:commandLink process="@this"
											title="Delete" action="#{catalogueBackingBean.deleteImageFromPopup(rowIndex)}" 
											update="#{updateImg}" 
											disabled="#{catalogueBackingBean.managedBean.viewOnlyBasicPopup}">
											<p:graphicImage style="padding-top:10px;"
												value="/css/images/design/trash.png"
												title="#{lbl['lbl.btn.delete']}"></p:graphicImage>
										</p:commandLink>
										
									</p:column>
								</p:dataTable>
							</td>
							<td class="noBorder" width="20%">
								<h:outputText value="&#160;" />
							</td>
						</tr>
						<tr>
							<td colspan="2">
								<div class="imageRightBtn">
									<p:fileUpload widgetVar="imageUploadWidget"
										fileUploadListener="#{catalogueBackingBean.imageUpload}"
										sizeLimit="#{catalogueBackingBean.getImageSize()}"
										auto="true" update="imageUploadId"
										invalidSizeMessage="#{catalogueBackingBean.getInvalidFileSize()}"
										label="#{lbl['lbl.btn.choose']}" id="uploadImageBasicDirect"
										allowTypes="/(\.|\/)(gif|jpe?g|png|bmp|webpg)$/"
										invalidFileMessage="#{lbl['lbl.cm.validation.img.type']}"
										multiple="#{multipleFile}" 
										disabled="#{not empty items 
											or fn:length(catalogueBackingBean.managedBean.selectedMaintainItem.cmImages) ge (multipleFile? 5 : 1)
											or catalogueBackingBean.managedBean.viewOnlyBasicPopup}" 
										onstart="popupBlockWidget.show();"
								    	oncomplete="popupBlockWidget.hide();">
									</p:fileUpload>
								</div>
							</td>
						</tr>
					</table>
	
				</p:panel>
				
				<p:panel id="textbasic" header="#{lbl['lbl.cm.basic.item.spec']}" toggleable="true">
	
					<table class="noBorder" width="100%">
						<tr class="noBorder">
							<td class="noBorder" width="80%">
								<h:outputText value="* " styleClass="mandatory" />
								<h:outputText value="#{lbl['lbl.cm.basic.item.spec']}" />
								<br/>
								<p:inputTextarea cols="70" rows="7" id="basicDesc"
								value="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemDesc}" 
								disabled="#{catalogueBackingBean.managedBean.viewOnlyBasicPopup}">
									<f:ajax event="blur" /> 
								</p:inputTextarea>
							</td>
							<td class="noBorder" width="20%">
								<h:outputText value="&#160;" />
							</td>
						</tr>
						<tr>
							<td class="noBorder" colspan="2">
								<div class="ppRightBtn">
									<c:if test="#{catalogueBackingBean.managedBean.viewOnlyBasicPopup}">
								    	<p:commandButton id="closeAction" value="#{lbl['lbl.btn.close']}"
								    		onstart="popupBlockWidget.show();" immediate="true"
								    		oncomplete="popupBlockWidget.hide(); imageBasicDialog.hide();"/>
								    </c:if>
									<c:if test="#{!catalogueBackingBean.managedBean.viewOnlyBasicPopup}">
								    	<p:commandButton id="closeAction" value="#{lbl['lbl.btn.close']}"
								    		onstart="popupBlockWidget.show();"
								    		oncomplete="popupBlockWidget.hide(); imageBasicDialog.hide();"/>
								    </c:if>
								</div>
							</td>

						</tr>
					</table>
				</p:panel>
			</p:outputPanel>
	</p:dialog>
</ui:composition>
