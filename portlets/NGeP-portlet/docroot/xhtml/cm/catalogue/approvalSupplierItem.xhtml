<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:dataTable id="approvalSupplierItemID"
		value="#{catalogueBackingBean.managedBean.approvalItemList}"
		rowIndexVar="rowIndex" var="approval"
		rowKey="#{approval.supplierItemId}">

		
		
		<ac:paginator for="approvalSupplierItemID"></ac:paginator>
		<p:column width="30%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			
			#{approval.cmItem.itemName}

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{approval.cmStandardPricings[0].price}" disabled="true" size="10"></p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			
			<p:inputText value="#{approval.pmUom.uomName}" disabled="true"></p:inputText>
			

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{approval.cmStandardPricings[0].startDate}" showOn="button" size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{approval.cmStandardPricings[0].endDate}" showOn="button" size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>

			<p:commandLink title="Edit"
				action="#{catalogueBackingBean.navigateToApprovalItemDet(rowIndex)}">
				<p:graphicImage value="/resources/ep/images/design/edit.png"></p:graphicImage>
			</p:commandLink>
		</p:column>

		
	</p:dataTable>

</ui:composition>
