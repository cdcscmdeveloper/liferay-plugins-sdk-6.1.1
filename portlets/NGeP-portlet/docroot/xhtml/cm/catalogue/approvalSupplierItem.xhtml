<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:dataTable id="approvalSupplierItemID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{catalogueBackingBean.managedBean.approvalSearchDataModel}" rows="10" style="width:100%;"
		rowIndexVar="rowIndex" var="approval"
		rowKey="#{approval.supplierItemId}">

		
		
		<ac:paginator for="approvalSupplierItemID"></ac:paginator>
		<p:column width="3%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.code']}
			</f:facet>
			<h:outputText value="#{approval.cmItem.extensionCode}" style="white-space: normal"/>
		</p:column>
		
		<p:column width="20%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			<h:outputText value="#{approval.cmItem.itemName}" style="white-space: normal"/>
			

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{approval.cmStandardPricing.price}" disabled="true" size="10" style="text-align:right">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			
			<p:inputText value="#{approval.pmUom.uomName}" disabled="true"></p:inputText>
			

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{approval.cmStandardPricing.startDate}" showOn="button" size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{approval.cmStandardPricing.endDate}" showOn="button" size="10" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>

			<p:commandLink title="View"
				action="#{catalogueBackingBean.navigateToApprovalItemDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/document.png"></p:graphicImage>
			</p:commandLink>
		</p:column>

		
	</p:dataTable>

</ui:composition>
