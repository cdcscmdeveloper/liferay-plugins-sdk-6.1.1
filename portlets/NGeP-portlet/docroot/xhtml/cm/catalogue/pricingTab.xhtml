<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">









	<p:panelGrid styleClass="tablePanel">
		<f:facet name="header">
			<p:row>
				<p:column>
							Pricing Type
						</p:column>
				<p:column>
							Price (RM)
						</p:column>
				<p:column>
							Start Date
						</p:column>
				<p:column>
							End Date
						</p:column>
				<p:column>
							#{lbl['lbl.cm.action']}
				</p:column>
			</p:row>

		</f:facet>

		<p:row>
			<p:column>
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="Standard" />
			</p:column>
			<p:column>
				<p:inputText readonly="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.price}" style="text-align:right">
					<p:ajax event="keyup" update="standardErrorLink" listener="#{catalogueBackingBean.updateStandardErrorDialog(catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing)}"/>
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<p:calendar readonly="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.startDate}" mindate="#{catalogueBackingBean.managedBean.currentDate}"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" update="standardErrorLink" listener="#{catalogueBackingBean.updateStandardErrorDialog(catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing)}"/>
					<p:ajax event="keyup" update="standardErrorLink" listener="#{catalogueBackingBean.updateStandardErrorDialog(catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing)}"/>
				</p:calendar>

			</p:column>
			<p:column>
				<p:calendar readonly="#{unspscCodeBackingBean.catalogueAdmin or catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'P' or !catalogueBackingBean.managedBean.displayCatalogue}"
					value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing.endDate}" mindate="#{catalogueBackingBean.managedBean.currentDate}"
					showOn="button" pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" update="standardErrorLink" listener="#{catalogueBackingBean.updateStandardErrorDialog(catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing)}"/>
					<p:ajax event="keyup" update="standardErrorLink" listener="#{catalogueBackingBean.updateStandardErrorDialog(catalogueBackingBean.managedBean.selectedMaintainItem.cmStandardPricing)}"/>
				</p:calendar>

			</p:column>
			<p:column>
				<p:commandLink id="standardErrorLink" title="Error" update=":form"
					oncomplete="errorDialog.show();"
					
					disabled="#{!(catalogueBackingBean.managedBean.error1 or
					catalogueBackingBean.managedBean.error2 or
					catalogueBackingBean.managedBean.error3 or
					catalogueBackingBean.managedBean.error4 or
					catalogueBackingBean.managedBean.error5 or
					catalogueBackingBean.managedBean.error6 or
					catalogueBackingBean.managedBean.error7
					)}">
					<p:graphicImage value="/resources/ep/images/design/icon_error.png"></p:graphicImage>
				</p:commandLink>
			</p:column>
		</p:row>


	</p:panelGrid>







</ui:composition>
