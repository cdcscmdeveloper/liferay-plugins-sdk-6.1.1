<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceTierPageID">
		<p:dataTable id="pricingTierID" rowIndexVar="rowIndex"
			emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmTierPricings}"
			width="100%" var="price">

			<ac:paginator for="pricingTierID"></ac:paginator>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.from.qty']}
				</f:facet>
				<p:inputText id="fromQty" styleClass="fromQty" maxlength="6"
					value="#{price.fromQty}" size="5"
					disabled="#{!price.showFlag || price.standardDisabled}">
					<p:ajax event="keyup"
						update="promoLink, cloneLink, deleteLink, errorLink" />
				</p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.to.qty']}
				</f:facet>
				<p:inputText value="#{price.toQty}" size="5" maxlength="6"
					disabled="#{price.standardDisabled}">
					<p:ajax event="change"
						listener="#{catalogueBackingBean.updateToQty(rowIndex)}"
						update="@(.fromQty)" />
					<p:ajax event="keyup" update="errorLink" />
				</p:inputText>
			</p:column>
			<p:column>

				<f:facet name="header">
					#{lbl['lbl.cm.price.uom']}
				</f:facet>
				<p:inputText id="tierPriceId" value="#{price.price}" size="10" maxlength="18"
					disabled="#{price.standardDisabled}" style="text-align:right">
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink, tierPriceId" />
					<f:convertNumber
						pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{price.startDate}" showOn="button" navigator="true"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					rendered="#{price.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateDateOverlap(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateDateOverlap(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{price.endDate}" showOn="button" navigator="true"
					mindate="#{catalogueBackingBean.managedBean.currentDate}"
					rendered="#{price.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateDateOverlap(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateDateOverlap(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="dateSelect"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="keyup"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
					<p:ajax event="change"
						listener="#{catalogueBackingBean.validateTierPrice(rowIndex)}"
						update="promoLink, cloneLink, deleteLink, errorLink" />
				</p:calendar>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
				<p:commandLink id="cloneLink" title="#{lbl['lbl.cm.clone']}"
					rendered="#{price.showFlag}"
					disabled="#{price.standardDisabled or price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate or !price.displayAction}"
					action="#{catalogueBackingBean.cloneTierPrice(rowIndex)}"
					update=":form:pricingTabID:headerTabId:tierId:pricingTierID, :form:pricingTabID:headerTabId:tierId:addTierButton">
					<p:graphicImage style="padding-right:10px;"
						value="/css/images/design/add.png"></p:graphicImage>
				</p:commandLink>
				<p:commandLink id="deleteLink" title="#{lbl['lbl.btn.delete']}"
					action="#{catalogueBackingBean.setRowIndex}"
					rendered="#{price.showFlag}" oncomplete="confirmation.show()"
					disabled="#{!price.displayAction}">
					<f:param name="index" value="#{rowIndex}"></f:param>
					<p:graphicImage style="padding-right:10px;"
						value="/css/images/design/trash.png"></p:graphicImage>
				</p:commandLink>
				<p:commandLink id="promoLink"
					title="#{lbl['lbl.cm.add.to.promotion']}"
					disabled="#{price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate or !price.displayAction}"
					rendered="#{price.showFlag}"
					action="#{catalogueBackingBean.addToPromotion(rowIndex)}"
					update="@form, deleteLink, :form:pricingTabID:headerTabId:tierId:pricingPromotionTierID">
					<p:graphicImage style="padding-right:10px;"
						value="/css/images/design/promo.png" width="16" height="16"></p:graphicImage>
				</p:commandLink>
				<h:panelGroup id="errorLink">
					<p:commandLink title="#{lbl['lbl.txt.error']}" process="@this"
						actionListener="#{catalogueBackingBean.updateErrorDialog(rowIndex)}"
						update=":form" oncomplete="errorDialog.show();"
						rendered="#{(price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate or !price.displayAction or !price.checkOk)}">
						<f:param name="index" value="#{rowIndex}"></f:param>
						<p:graphicImage value="/css/images/design/icon_error.png"></p:graphicImage>
					</p:commandLink>
					<p:graphicImage value="/css/images/design/icon_success.png"
						rendered="#{!(price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate or !price.displayAction or !price.checkOk)}"></p:graphicImage>
				</h:panelGroup>

			</p:column>

		</p:dataTable>



		<div class="clear"></div>


		<table style="width: 100%">
			<tr>
				<td><p:commandButton value="#{lbl['lbl.cm.add']}"
						id="addTierButton" style="float:right;"
						rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'D' || 
							((catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'R' || catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'E') and (unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier))}"
						action="#{catalogueBackingBean.addNewTierPricing()}"
						disabled="#{catalogueBackingBean.disableAddTier()}"
						update=":form:pricingTabID:headerTabId:tierId:pricingTierID, :form:pricingTabID:headerTabId:tierId:pricingPromotionTierID, :form:pricingTabID:headerTabId:tierId:addTierButton"
						process="@this :form:pricingTabID:headerTabId:tierId:pricingTierID"></p:commandButton>
				</td>
				<td style="width: 20px"><p:graphicImage id="uidti"
						value="/css/images/design/tooltips.png" /> <p:tooltip id="uidtt"
						for="uidti">
						<p:outputLabel escape="false"
							value="#{lbl['lbl.cm.addnew.tooltip']}" />
					</p:tooltip></td>
			</tr>
		</table>

		<p:confirmDialog id="confirmDeleteTierId"
			message="#{lbl['lbl.cm.dialog.cofirm.delete.msg']}"
			header="#{lbl['lbl.cm.dialog.cofirm.header']}"
			widgetVar="confirmation">

			<p:commandButton id="conf" value="#{lbl['lbl.cm.dialog.cofirm.yes']}"
				actionListener="#{catalogueBackingBean.deleteTierPrice()}"
				update=":form:pricingTabID:headerTabId:tierId:pricingTierID, :form:pricingTabID:headerTabId:tierId:pricingPromotionTierID, :form:pricingTabID:headerTabId:tierId:addTierButton"
				oncomplete="confirmation.hide();" />
			<p:commandButton id="decline"
				value="#{lbl['lbl.cm.dialog.cofirm.no']}"
				onclick="confirmation.hide()" />

		</p:confirmDialog>

	</p:outputPanel>


</ui:composition>
