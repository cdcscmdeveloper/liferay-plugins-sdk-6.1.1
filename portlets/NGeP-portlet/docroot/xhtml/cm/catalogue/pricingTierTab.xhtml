<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="priceTierPageID">
		<p:dataTable id="pricingTierID" rowIndexVar="rowIndex"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmTierPricings}"
			width="100%" var="price">

			<ac:paginator for="pricingTierID"></ac:paginator>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText value="#{price.price}" size="10" disabled="#{price.standardDisabled}" >
				 <p:ajax event="keyup" update="promoLink, cloneLink, errorLink" />
                </p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.from.qty']}
				</f:facet>
				<p:inputText id="fromQty" value="#{price.fromQty}" size="5" disabled="#{!price.showFlag || price.standardDisabled}">
				 <p:ajax event="keyup" update="promoLink, cloneLink, errorLink" />
                </p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.to.qty']}
				</f:facet>
				<p:inputText value="#{price.toQty}" size="5" disabled="#{price.standardDisabled}">
				<p:ajax event="change" listener="#{catalogueBackingBean.updateToQty(rowIndex)}" update=":form:pricingTabID:headerTabId:tierId:pricingTierID, errorLink" />
                </p:inputText>
            </p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{price.startDate}" showOn="button"
					disabled="#{price.standardDisabled}" rendered="#{price.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
				 <p:ajax event="dateSelect" update="promoLink, cloneLink, errorLink" />
				 <p:ajax event="keyup" update="promoLink, cloneLink, errorLink" />
                </p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{price.endDate}" showOn="button"
					disabled="#{price.standardDisabled}" rendered="#{price.showFlag}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
				 <p:ajax event="dateSelect" update="promoLink, cloneLink, errorLink" />
				 <p:ajax event="keyup" update="promoLink, cloneLink, errorLink" />
                </p:calendar>
			</p:column>

			<p:column width="5%">
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
				<table width="5%" styleClass="noBorders tr,noBorders td" >
					<tr>
						<td><p:commandLink id="promoLink" title="Promotion"
								disabled="#{price.standardDisabled or price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate}" 
								rendered="#{price.showFlag}"
								action="#{catalogueBackingBean.addToPromotion(rowIndex)}"
								update="@form, deleteLink, :form:pricingTabID:headerTabId:tierId:pricingPromotionTierID">
								<p:graphicImage value="/resources/ep/images/design/add.png"></p:graphicImage>
							</p:commandLink>&#160;</td>
						<td><p:commandLink id="cloneLink" title="Clone" rendered="#{price.showFlag}"
								disabled="#{price.standardDisabled or price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate}" 
								action="#{catalogueBackingBean.cloneTierPrice(rowIndex)}"
								update=":form:pricingTabID:headerTabId:tierId:pricingTierID">
								<p:graphicImage value="/resources/ep/images/design/add.png"></p:graphicImage>
							</p:commandLink>&#160;</td>
						<td style="text-align: right;">
							<p:commandLink id="deleteLink" title="Delete" action="#{catalogueBackingBean.setRowIndex}" rendered="#{price.showFlag}"
								disbaled="#{price.standardDisabled}" oncomplete="confirmation.show()">
								<f:param name="index" value="#{rowIndex}"></f:param>
								<p:graphicImage value="/resources/ep/images/design/trash.png"></p:graphicImage>
							</p:commandLink></td>
						<td style="text-align: right;">
							<p:commandLink id="errorLink" title="Error" process="@this" actionListener="#{catalogueBackingBean.updateErrorDialog(rowIndex)}" update=":form:pricingTabID:headerTabId:tierId:errorDialog" 
								oncomplete="errorDialog.show();" 
								disabled="#{!(price.price eq null or price.fromQty eq null or price.toQty eq null or price.fromQty >= price.toQty or price.startDate eq null or price.endDate eq null or price.startDate >= price.endDate)}" >
								<f:param name="index" value="#{rowIndex}"></f:param>
								<p:graphicImage value="/resources/ep/images/design/icon_error.png"></p:graphicImage>
							</p:commandLink></td>
					</tr>
				</table>
			</p:column>

		</p:dataTable>



		<div class="clear"></div>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}" icon="ui-icon-add"
				action="#{catalogueBackingBean.addNewTierPricing()}"
				update=":form:pricingTabID:headerTabId:tierId:pricingTierID, :form:pricingTabID:headerTabId:tierId:pricingPromotionTierID"
				process="@this :form:pricingTabID:headerTabId:tierId:pricingTierID"></p:commandButton>
		</div>

		<p:confirmDialog id="confirmDeleteTierId" message="Are you sure ?"
			header="Confirmation Message" widgetVar="confirmation">

			<p:commandButton id="conf" value="Yes"
				actionListener="#{catalogueBackingBean.deleteTierPrice()}" update=":form:pricingTabID:headerTabId:tierId:pricingTierID"
				oncomplete="confirmation.hide()" />
			<p:commandButton id="decline" value="No"
				onclick="confirmation.hide()" />

		</p:confirmDialog>

	</p:outputPanel>
		<p:dialog id="errorDialog" header="Error List" widgetVar="errorDialog" modal="true"
			width="400" height="125">
				<h:panelGroup id="errorPopupPanel">
					<table>
						<tr>
							<td>
							<p:graphicImage value="/resources/ep/images/messages/error.png"></p:graphicImage>
							</td>
							<td style="white-space:nowrap; float:left;">
								<p:panel>
									<p:outputLabel value="To quantity greater than from quantity." rendered="#{catalogueBackingBean.managedBean.error1}"></p:outputLabel>
									<br/>
									<p:outputLabel value="End date cannot be less than start date." rendered="#{catalogueBackingBean.managedBean.error2}"></p:outputLabel>
									<br/>
									<p:outputLabel value="Please fill all columns." rendered="#{catalogueBackingBean.managedBean.error3}"></p:outputLabel>
								</p:panel>	
							</td>
						</tr>
						<tr>	
							<td>
							<p:panel>
								<p:commandButton value="#{lbl['lbl.cm.zm.btn.ok']}"	style="float:right;" onclick="errorDialog.hide();"/>
							</p:panel>	
							</td>
						</tr>
					</table>
				</h:panelGroup>
		</p:dialog>			

</ui:composition>
