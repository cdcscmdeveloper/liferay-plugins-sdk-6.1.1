<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">

		<h:panelGroup id="catMainFileID">

			<p:tabView id="catMainFileTabID">
				<p:tab id="tab1" title="#{lbl['lbl.cm.draft']}">


					<p:commandButton value="#{lbl['lbl.cm.upload.to.draft']}"></p:commandButton>

					<p:commandButton id="downloadLink"
						value="#{lbl['lbl.cm.download.from.draft']}" ajax="false">
						<p:fileDownload value="#{catalogBackingBean.file}" />
					</p:commandButton>

					<p:commandButton value="#{lbl['lbl.cm.save.draft']}"
						action="#{catalogBackingBean.saveCatalogItem}"></p:commandButton>

					<p:commandButton value="#{lbl['lbl.cm.submit']}"></p:commandButton>

					<p:dataTable value="#{unspscCodeBackingBean.managedBean.unspscList}" var="selectedSuppCat" rowKey="#{selectedSuppCat.unspscID}">

						<p:column selectionMode="multiple" style="width:2%" />

						<p:column>
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.cm.item.name']}" />
							</f:facet>
							<h:outputText value="#{unspscObj.unspscCode}" />

						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.cm.price']}" />
							</f:facet>
							<h:outputText value="#{unspscObj.unspscCode}" />
						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.cm.start.date']}" />
							</f:facet>
							<h:outputText value="#{unspscObj.unspscCode}" />

						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.cm.end.date']}" />
							</f:facet>
							<h:outputText value="#{unspscObj.unspscCode}" />

						</p:column>
						<p:column>
							<f:facet name="header">
								<h:outputText value="#{lbl['lbl.cm.action']}" />
							</f:facet>
							<p:commandButton action="#{catalogueBackingBean.navigateToCatalogDet()}" value="Details"></p:commandButton>

						</p:column>




					</p:dataTable>

				</p:tab>
				<p:tab id="tab2" title="#{lbl['lbl.cm.published']}">
				</p:tab>
				<p:tab id="tab3" title="#{lbl['lbl.cm.approval']}">
				</p:tab>
				<p:tab id="tab4" title="#{lbl['lbl.cm.approved']}">
				</p:tab>
				<p:tab id="tab5" title="#{lbl['lbl.cm.reject.revise']}">
				</p:tab>
			</p:tabView>


		</h:panelGroup>
	</ui:define>

</ui:composition>
