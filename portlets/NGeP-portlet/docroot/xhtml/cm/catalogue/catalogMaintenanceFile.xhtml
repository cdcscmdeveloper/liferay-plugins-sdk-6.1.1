<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition
	template="/WEB-INF/facelets/templates/basic_template.xhtml"
	xmlns:p="http://primefaces.org/ui" xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<ui:define name="contentSection">
	
	<p:messages id="catalogFileMsg" globalOnly="true"></p:messages>

		<h:panelGroup>
			<p:tabView id="maintenanceTabId" dynamic="true" cache="false">

				<p:ajax event="tabChange" listener="#{catalogueBackingBean.onTabChange}" update=":form:maintenanceTabId :form:catalogFileMsg"/>
					
				<p:tab id="tab1" title="#{lbl['lbl.cm.draft']}">
					<ui:include src="draftSupplierItem.xhtml" />
				</p:tab>
				<p:tab id="tab3" title="#{lbl['lbl.cm.approval']}">
					<ui:include src="approvalSupplierItem.xhtml" />
				</p:tab>
				<p:tab id="tab4" title="#{lbl['lbl.cm.approved']}">
					<ui:include src="approvedSupplierItem.xhtml" />
				</p:tab>
				<p:tab id="tab5" title="#{lbl['lbl.cm.reject']}">
					<ui:include src="rejectedOrReviseSupplierItem.xhtml" />
				</p:tab>
				<p:tab id="tab6" title="#{lbl['lbl.cm.published']}">
					<ui:include src="publishedSupplierItem.xhtml" />
				</p:tab>
				<p:tab id="tab2" title="#{lbl['lbl.cm.expired']}">
					<ui:include src="expiredSupplierItem.xhtml" />
				</p:tab>
				
			</p:tabView>
		</h:panelGroup>
	</ui:define>
</ui:composition>
