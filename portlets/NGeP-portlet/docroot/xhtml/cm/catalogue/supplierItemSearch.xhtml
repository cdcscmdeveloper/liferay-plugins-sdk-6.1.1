<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup id="supplierItemViewID">

		<p:messages globalOnly="true"></p:messages>

		<table style="width: 100%">
			<tr>
				<td><p:tabView style="width: 100%;" id="searchTabId">

						<p:tab id="tab2" title="Search">
							<table style="margin-top: 10px;">
								<tr>
									<td style="padding-left: 56px;"><p:outputLabel
											value="#{lbl['lbl.cm.item.name']}" /></td>
									<td><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemName}"></p:inputText></td>
								</tr>
							</table>
							<ui:repeat var="search"
								value="#{catalogueBackingBean.managedBean.advanceSearchList}">

								<h:panelGrid columns="2" columnClasses="cmPadding5">
									<p:selectOneMenu value="#{search.name}">
										<f:selectItems
											value="#{catalogueBackingBean.managedBean.searchCriteria}" />
									</p:selectOneMenu>
									<p:inputText size="50" value="#{search.value}" />
								</h:panelGrid>


							</ui:repeat>
							<div style="text-align: right;">
								<p:commandButton value="Search" icon="ui-icon-search"
									action="#{catalogueBackingBean.searchCatalogue}"
									update="@(.ui-datatable[id$=supplierItemID])">

									<f:param name="unspscCode" value="#{unspscCode}" />

								</p:commandButton>

							</div>

						</p:tab>

					</p:tabView></td>
			</tr>
		</table>

		<table style="width: 100%;">
			<tr>
				<td width="70%" style="vertical-align: top;"><p:panel
						style="width: 100%;" header="SEARCH RESULTS" toggleable="true">

						<div style="text-align: right;">
							<p:commandButton id="compareButton"
								action="#{catalogueBackingBean.compareSupplierItem}"
								value="#{lbl['lbl.cm.compare']} ( #{fn:length(catalogueBackingBean.managedBean.selectedSupplierItemList)} )"
								disabled="#{2 > fn:length(catalogueBackingBean.managedBean.selectedSupplierItemList)}" />
						</div>
						<p:dataTable
							value="#{catalogueBackingBean.managedBean.supplierItemList}"
							id="supplierItemID" var="supplierItem" rowIndexVar="rowIndex">
							
							<ac:paginator for="supplierItemID"></ac:paginator>

							<p:ajax event="rowToggle"
								update="@(.ui-datatable[id$=supplierItemID])" />
							<p:column style="width:2%">
								<p:rowToggler />
							</p:column>

							<p:column headerText="Image">
								<p:graphicImage
									value="/resources/ep/images/product/computer/879949914_125.jpg"
									height="80" width="80" />
							</p:column>

							<p:column headerText="Item Name">
								<p:commandLink value="#{supplierItem.cmItem.itemName}"
									action="#{catalogueBackingBean.navigateToSupplierItemDet(rowIndex)}" />
								<cc:renderFacet name="simpleBidQuoteButton" />
							</p:column>

							<p:column headerText="Supplier Name">
							ABC SDN BHD
							</p:column>

							<p:column headerText="UOM">
							#{supplierItem.pmUom.uomName}
							</p:column>

							<p:column width="2%">
								<p:selectBooleanCheckbox value="#{supplierItem.selected}">
									<p:ajax update="@(.ui-button[id$=compareButton])"
										listener="#{catalogueBackingBean.triggerCompare(rowIndex)}" />
								</p:selectBooleanCheckbox>
							</p:column>

							<p:column width="2%">
								<cc:renderFacet name="cartButton" />
							</p:column>

							<p:rowExpansion>




								<p:tabView id="catalogueViewPricingId">
									<p:tab title="Normal">
										<ui:include src="/xhtml/cm/pricing/pricingTab.xhtml" />
									</p:tab>
									<p:tab title="#{lbl['lbl.cm.tier']}" rendered="#{fn:length(supplierItem.cmTierPricings) > 0}">
										<ui:include src="/xhtml/cm/pricing/pricingTierTab.xhtml" />
									</p:tab>
									<p:tab title="#{lbl['lbl.cm.promotion.tier']}" rendered="#{fn:length(supplierItem.cmPromotionTierPricings) > 0}">
										<ui:include src="/xhtml/cm/pricing/pricingPromotionTierTab.xhtml" />
									</p:tab>
									<p:tab title="Zonal Standard" rendered="#{fn:length(supplierItem.cmZonalStandardPricings) > 0}">
										<ui:include src="/xhtml/cm/pricing/zonalStandardPricingTab.xhtml"></ui:include>

									</p:tab>
									<p:tab title="Zonal Promotion" rendered="#{fn:length(supplierItem.cmZonalPromotionPricings) > 0}">
										<ui:include src="/xhtml/cm/pricing/zonalPromotionPricingTab.xhtml"></ui:include>

									</p:tab>

									<p:tab title="Zonal Tier" rendered="#{fn:length(supplierItem.cmZonalTierPricings) > 0}">
										<ui:include src="/xhtml/cm/pricing/zonalTierPricingTab.xhtml"></ui:include>

									</p:tab>
									<p:tab title="Zonal Promotion Tier" rendered="#{fn:length(supplierItem.cmZonalPromotionTierPricings) > 0}">
										<ui:include src="/xhtml/cm/pricing/zonalPromotionTierPricingTab.xhtml"></ui:include>

									</p:tab>
								</p:tabView>

							</p:rowExpansion>



						</p:dataTable>

					</p:panel></td>

			</tr>

		</table>


		<!-- <p:dialog id="wishListDialog" widgetVar="wishListPopUp" width="500px"
			modal="true">

			<ui:include src="wishListPopUp.xhtml" />

		</p:dialog>

		<p:dialog id="deleteWishListDialog" widgetVar="deleteWishListPopUp"
			width="500px" modal="true">
			<ui:include src="viewWishListItem.xhtml"></ui:include>
		</p:dialog> -->
	</h:panelGroup>




</ui:composition>
