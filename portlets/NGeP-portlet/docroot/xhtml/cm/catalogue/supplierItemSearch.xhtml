<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:cc="http://java.sun.com/jsf/composite"
	xmlns:ac="http://ac.my/jsf/composite/cc">


	<h:panelGroup id="supplierItemViewID">

		<p:messages globalOnly="true"></p:messages>

		<table style="width: 100%">
			<tr>
				<td><p:tabView style="width: 100%;" id="searchTabId">

						<p:tab id="tab2" title="Search">
							<table style="margin-top: 10px; width: 100%;">
								<tr>
									<td width="15%"><p:outputLabel
											value="#{lbl['lbl.cm.item.name']}" /></td>
									<td width="35%%"><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText></td>
									<td width="15%"><p:outputLabel
											value="#{lbl['lbl.cm.item.code']}" /></td>
									<td width="35%"><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemCodeFilterBean.searchValue}"></p:inputText></td>
								</tr>


								<tr>
									<td><p:outputLabel value="Supplier Name" /></td>
									<td><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.supplierNameFilterBean.searchValue}"></p:inputText></td>
									<td><p:outputLabel value="Business Reg No" /></td>
									<td><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.bizRegNoFilterBean.searchValue}"></p:inputText></td>
								</tr>
							</table>
							<h:panelGroup rendered="#{unspscCodeBackingBean.requisitioner}">
								<table style="width: 100%">
									<tr>
										<td width="15%"><p:outputLabel value="EP No" /></td>
										<td width="35%"><p:inputText size="50"
												value="#{catalogueBackingBean.managedBean.epNoFilterBean.searchValue}"></p:inputText></td>
										<td width="15%"><p:outputLabel value="MOF No" /></td>
										<td width="35%"><p:inputText size="50"
												value="#{catalogueBackingBean.managedBean.mofNoFilterBean.searchValue}"></p:inputText></td>
									</tr>

									<tr>
										<td><p:outputLabel value="Contract No" /></td>
										<td><p:inputText size="50"
												value="#{catalogueBackingBean.managedBean.contractNoFilterBean.searchValue}"></p:inputText></td>

										<td><p:outputLabel value="Cicular No" /></td>
										<td><p:inputText size="50"
												value="#{catalogueBackingBean.managedBean.circularNoFilterBean.searchValue}"></p:inputText></td>
									</tr>
								</table>
							</h:panelGroup>
							<table style="width: 100%">
								<tr>
									<td width="15%"><p:outputLabel value="State" /></td>
									<td width="35%"><p:selectManyMenu id="stateIdDD"
											showCheckbox="true" style="height:100px;width: 200px;"
											value="#{catalogueBackingBean.managedBean.stateId}">
											<f:selectItems
												value="#{catalogueBackingBean.managedBean.stateList}"
												var="state" itemLabel="#{state.stateName}"
												itemValue="#{state.stateId}"></f:selectItems>
											<p:ajax listener="#{catalogueBackingBean.findDistrict}"
												update="@(.ui-selectmanymenu[id$=districtDD])"></p:ajax>
										</p:selectManyMenu></td>
									<td width="15%"><p:outputLabel value="District" /></td>
									<td width="35%"><p:selectManyMenu id="districtDD"
											showCheckbox="true" style="height:100px;width: 200px;"
											value="#{catalogueBackingBean.managedBean.districtId}">
											<f:selectItems
												value="#{catalogueBackingBean.managedBean.districtList}"
												var="district" itemLabel="#{district.districtName}"
												itemValue="#{district.districtId}"></f:selectItems>
										</p:selectManyMenu></td>

								</tr>
							</table>




							<div style="text-align: right;">
								<p:commandButton value="Search" icon="ui-icon-search"
									action="#{catalogueBackingBean.managedBean.searchCatalogue}"
									update="@([id$=SupplierItemDtlId])">
									<f:param name="unspscCode" value="#{unspscCode}" />

								</p:commandButton>

							</div>

						</p:tab>

					</p:tabView></td>
			</tr>
		</table>
    <h:panelGroup id="SupplierItemDtlId">
		<table style="width: 100%;">
			<tr>
				<td width="70%" style="vertical-align: top;"><p:panel
						style="width: 100%;" header="SEARCH RESULTS" toggleable="true">

						<div style="text-align: right;">
						<p:commandButton value="CR ( #{fn:length(catalogueBackingBean.managedBean.ctRequestList)} ) "></p:commandButton>
						<p:commandButton value="#{lbl['lbl.sc.sq']}" action="#{simpleQuoteBackingBean.simpleQuoteAction(simpleQuoteBackingBean.managedBean.cmSupplierItem.supplierItemId , false)}" 
						         disabled="#{catalogueBackingBean.managedBean.simpleQuoteFlag}"  />
						   
						<p:commandButton id="compareButton"
								action="#{catalogueBackingBean.compareSupplierItem}"
								value="#{lbl['lbl.cm.compare']} ( #{fn:length(catalogueBackingBean.managedBean.selectViewItems)} )"
								disabled="#{2 > fn:length(catalogueBackingBean.managedBean.selectViewItems)}" />
						</div>
						<p:dataTable lazy="true"
							value="#{catalogueBackingBean.managedBean.searchDataModel}"
							rowKey="#{supplierItem}"
							selection="#{catalogueBackingBean.managedBean.selectViewItems}"
							id="supplierItemID" var="supplierItem" rowIndexVar="rowIndex">

							<ac:paginator for="supplierItemID"></ac:paginator>

							<p:ajax event="rowSelectCheckbox"
								update="@(.ui-button[id$=compareButton])"></p:ajax>
							<p:ajax event="rowUnselectCheckbox"
								update="@(.ui-button[id$=compareButton])"></p:ajax>
							<p:ajax event="rowUnselect"
								update="@(.ui-button[id$=compareButton])"></p:ajax>
							<p:ajax event="rowSelect"
								update="@(.ui-button[id$=compareButton])"></p:ajax>
							<p:ajax event="toggleSelect"
								update="@(.ui-button[id$=compareButton])" />

							<p:column headerText="Image" width="80px;">
								<p:graphicImage value="/images/#{supplierItem.imagePath}"
									height="80" width="80" />



							</p:column>

							<p:column headerText="#{lbl['lbl.cm.item.name']}">
								#{supplierItem.itemName}
								

							</p:column>

							<p:column width="10%" headerText="#{lbl['lbl.cm.contact.no']}"
								rendered="#{unspscCodeBackingBean.requisitioner}">
								#{supplierItem.contractNo}

							</p:column>

							<p:column width="10%" headerText="#{lbl['lbl.cm.circular.no']}"
								rendered="#{unspscCodeBackingBean.requisitioner}">
								
									
										#{supplierItem.circularNo}
						

							</p:column>

							<p:column headerText="#{lbl['lbl.cm.supplier.name']}">
								<h:outputText value="#{supplierItem.companyName}"
									rendered="#{supplierItem.contractNo != null or supplierItem.circularNo != null}"></h:outputText>
								<p:commandLink value="#{supplierItem.companyName}"
									rendered="#{supplierItem.contractNo == null and supplierItem.circularNo == null}"
									action="#{catalogueBackingBean.navigateToSupplierItemDet(supplierItem)}" />
							</p:column>

							<p:column headerText="UOM">
							#{supplierItem.uomName}
							</p:column>


							<p:column selectionMode="multiple" style="width:2%"
								disabledSelection="#{supplierItem.contractNo != null or supplierItem.circularNo != null}" />

							<p:column headerText="Action" width="2%"
								rendered="#{unspscCodeBackingBean.requisitioner}">
								<table>
									<tr>
										 <td><p:commandLink
												action="#{requestNoteBackingBean.addToCart(supplierItem.docId)}"
												process="@this" update="@([id$=addToCartId])"
												oncomplete="addToCartPopup.show();return false;"
												partialSubmit="true"
												rendered="#{supplierItem.contractNo == null and supplierItem.circularNo == null }">
												<p:graphicImage library="ep/images/design"
													name="cart_full.png" id="addToCartId" />
											</p:commandLink> <p:tooltip for="addToCartId"
												value="#{lbl['lbl.sc.add.to.cart']}" showEffect="fade"
												hideEffect="fade" /></td>
						                  <td><p:commandButton value="#{lbl['lbl.sc.purchase.in.default']}" id="pidId"
												action="#{purchaseInDefaultBackingBean.pidAction(supplierItem)}" 
												disabled="#{!catalogueBackingBean.managedBean.pidHelper.isPIDRequired(supplierItem.docId,16717,false)}"
												rendered="#{supplierItem.contractNo ne null or supplierItem.circularNo ne null }" >
											</p:commandButton>
											<p:tooltip for="pidId" value="#{lbl['lbl.sc.pid']}" showEffect="fade" hideEffect="fade" /></td>
											
								         <td><p:commandButton  value="#{lbl['lbl.sc.simple.quote']}" id="sqId"
									             action="#{simpleQuoteBackingBean.simpleQuoteAction(supplierItem.docId , false)}"
											     rendered="#{unspscCodeBackingBean.requisitioner}"
											     disabled="#{supplierItem.circularNo ne null }">
											</p:commandButton> 
										     <p:tooltip for="sqId" value="#{lbl['lbl.sc.sq']}" showEffect="fade" hideEffect="fade" /> </td>	

										 <td><p:commandButton value="CR" update="@form"
												action="#{catalogueBackingBean.addToContractRequest(supplierItem)}"
												rendered="#{supplierItem.contractNo ne null}">
											</p:commandButton></td>
									</tr>

								</table>
							</p:column>

						</p:dataTable>

					</p:panel></td>

			</tr>

		</table>
</h:panelGroup>

		<!-- <p:dialog id="wishListDialog" widgetVar="wishListPopUp" width="500px"
			modal="true">

			<ui:include src="wishListPopUp.xhtml" />

		</p:dialog>

		<p:dialog id="deleteWishListDialog" widgetVar="deleteWishListPopUp"
			width="500px" modal="true">
			<ui:include src="viewWishListItem.xhtml"></ui:include>
		</p:dialog> -->
	</h:panelGroup>
	<ui:include src="/xhtml/sc/directpurchase/common/addToCartPopup.xhtml" />


</ui:composition>
