<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<p:messages id="catalogTaskListMsgId" showDetail="true"
		autoUpdate="true" closable="true" showSummary="true"></p:messages>

	<p:remoteCommand name="refreshId" id="refreshId" update=":form"></p:remoteCommand>
	
		 <style>
      .dashboarTable {
             color: #000 !important;
             font-family: Arial,Helvetica,sans-serif;
              font-size: 12px;
              border-color: #ddd;
              border-width:1px;
              padding-left: 5px;
              border-style:solid;
      }  
    
    </style>

	<h:panelGroup id="catalogueTaskListId">

		<table style="border: 1px solid #e8e8e8; width: 100%;">
			<tr style="border: 1px solid #e8e8e8;">
				<td class="dashboarTable" style="border-right: 1px solid #e8e8e8; width: 80%;"><h:outputText
						style="float:left !important;margin-left: 5px !important;font-size: 12px;font-family: Arial,Helvetica,sans-serif;font-weight: bold;color:#000;"
						value="#{lbl['lbl.cm.approved']}" /></td>
				<td class="dashboarTable" style="text-align: center;"><h:outputText
						style="font-size: 12px;font-family: Arial,Helvetica,sans-serif;"
						value="#{reviewCatBackingBean.managedBean.approveSize}" /></td>
			</tr>
			<tr style="border: 1px solid #e8e8e8;">
				<td class="dashboarTable" style="border-right: 1px solid #e8e8e8;"><h:outputText
						style="float:left !important;margin-left: 5px !important;font-size: 12px;font-family: Arial,Helvetica,sans-serif;font-weight: bold;color:#000;"
						value="#{lbl['lbl.cm.reject']}" /></td>
				<td class="dashboarTable" style="text-align: center;"><h:outputText
						style="font-size: 12px;font-family: Arial,Helvetica,sans-serif;"
						value="#{reviewCatBackingBean.managedBean.rejectSize}" /></td>
			</tr>
			<tr>
				
				<td class="dashboarTable" colspan="2" style="text-align:right;padding-right: 6%;"><p:commandLink
						action="#{reviewCatBackingBean.navigateToCatalgoueURL}"
						value="#{lbl['lbl.pm.profiles.more.details']}" /></td>
			</tr>

		</table>

	</h:panelGroup>

</ui:composition>
