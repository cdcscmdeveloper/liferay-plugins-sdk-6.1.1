<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">



	<p:dataTable id="rejectedSupplierItemID"
		value="#{catalogueBackingBean.managedBean.rejectedItemList}" rowIndexVar="rowIndex"
		var="rejected" rowKey="#{rejected.supplierItemId}"
		selection="#{catalogueBackingBean.managedBean.selectedRejectedItems}">

		<p:column selectionMode="multiple" style="width:2%" />
		
		<p:column>
			<f:facet name="header">
				<p:outputLabel value="#{lbl['lbl.cm.item.name']}" />
			</f:facet>
			
			#{rejected.cmItem.itemName}

		</p:column>
		<p:column>
			<f:facet name="header">
				<p:outputLabel value="#{lbl['lbl.cm.price']}" />
			</f:facet>

		</p:column>
		<p:column>
			<f:facet name="header">
				<p:outputLabel value="#{lbl['lbl.cm.start.date']}" />
			</f:facet>


		</p:column>
		<p:column>
			<f:facet name="header">
				<p:outputLabel value="#{lbl['lbl.cm.end.date']}" />
			</f:facet>


		</p:column>
		<p:column>
			<f:facet name="header">
				<p:outputLabel value="#{lbl['lbl.cm.action']}" />
			</f:facet>
			<p:commandButton
				action="#{catalogueBackingBean.navigateToRejectedItemDet(rowIndex)}"
				value="Details"></p:commandButton>
		</p:column>
	</p:dataTable>
	
</ui:composition>
