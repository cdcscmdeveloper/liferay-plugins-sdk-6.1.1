<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">

	<h:panelGroup id="supplierItemViewID">
		

		
			<table style="width: 100%">
				<tr>
					<td><p:panel style="width: 100%;"
							header="#{lbl['lbl.cm.define.search']}" toggleable="true"
							id="searchTabId">
							<table style="margin-top: 10px; width: 100%;">
								<tr>
									<td width="15%"><p:outputLabel
											value="#{lbl['lbl.cm.item.code']}" /></td>
									<td width="35%"><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemCodeFilterBean.searchValue}"></p:inputText>
										</td>
									<td width="15%"><p:outputLabel
											value="#{lbl['lbl.cm.item.name']}" /></td>
									<td width="35%%"><p:inputText size="50"
											value="#{catalogueBackingBean.managedBean.itemNameFilterBean.searchValue}"></p:inputText>
										</td>
									
								</tr>
							</table>
							<!-- #569 start -->
							<div style="text-align: right;">
								<p:commandButton value="#{lbl['lbl.cm.search']}"
									action="#{catalogueBackingBean.managedBean.searchCatalogueMaintenance}" update="rejectedSupplierItemID" id="searchButtonRejId">
									
								</p:commandButton>
								<p:commandButton value="#{lbl['lbl.btn.reset']}"
									action="#{catalogueBackingBean.resetAction}"
									update="catMainItemViewID">
								</p:commandButton>
							</div>
							<!-- #569 end -->
						</p:panel>
					</td>
				</tr>
			</table>
			

	<p:spacer height="2" />
	

	<p:dataTable id="rejectedSupplierItemID" lazy="true" emptyMessage="#{lbl['lbl.datatable.msg.no.records.found']}"
		value="#{catalogueBackingBean.managedBean.rejectSearchDataModel}"
		rowIndexVar="rowIndex" var="rejected"
		rowKey="#{rejected.supplierItemId}"
		rows="10">

		
		<ac:paginator for="rejectedSupplierItemID"></ac:paginator>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.item.code']}
			</f:facet>
			<h:outputText value="#{rejected.cmItem.extensionCode}" style="white-space: normal"/>
		</p:column>
		<p:column width="20%" style="white-space: normal;">
			<f:facet name="header">
				#{lbl['lbl.cm.item.name']}
			</f:facet>
			<h:outputText value="#{rejected.cmItem.itemName}" style="white-space: normal"/>
			

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.price']}
			</f:facet>
			<p:inputText value="#{rejected.cmStandardPricing.price}" size="10" disabled="true" style="text-align:right">
			<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
			</p:inputText>
		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.uom']}
			</f:facet>
			<p:inputText value="#{rejected.pmUom.uomName}" disabled="true"></p:inputText>

		</p:column>
		<!-- #30457 start -->
		<p:column  style="text-align: center;" width="2%">
			<f:facet name="header">
				<h:outputText value="* " styleClass="mandatory" />
				<h:outputText value="#{lbl['lbl.cm.suptemp.upload.image']}" escape="false"/>
			</f:facet>
			<p:commandLink action="#{catalogueBackingBean.loadBasicImageDialog(rowIndex,true)}"
			update=":form:imageAndBasicId" oncomplete="imageBasicDialog.show()" >
				<p:graphicImage id="uploadImage" value="/css/images/design/document.png" 
				title="#{lbl['lbl.cm.suptemp.upload.image.tooltip']}" /> 
			</p:commandLink>
		</p:column>
		<!-- #30457 end -->
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.start.date']}
			</f:facet>
			<p:calendar value="#{rejected.cmStandardPricing.startDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="5%">
			<f:facet name="header">
				#{lbl['lbl.cm.end.date']}
			</f:facet>
			<p:calendar value="#{rejected.cmStandardPricing.endDate}"
				showOn="button" size="10"
				pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}" disabled="true"></p:calendar>

		</p:column>
		<p:column width="2%">
			<f:facet name="header">
				#{lbl['lbl.cm.action']}
			</f:facet>
			<p:commandLink title="#{lbl['lbl.cm.zm.edit']}"
				action="#{catalogueBackingBean.navigateToRejectedItemDet(rowIndex)}">
				<p:graphicImage value="/css/images/design/edit.png"></p:graphicImage>
			</p:commandLink>
			<p:commandLink style="margin-left: 10px;" 
				title="#{lbl['lbl.btn.delete']}" 
				oncomplete="confirmation1.show();" 
				action="#{catalogueBackingBean.setItemToDeleteReject(rejected.supplierItemId, rowIndex)}" >
				<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
				<f:param name="index" value="#{rowIndex}"></f:param>
			</p:commandLink>
		</p:column>
	</p:dataTable>
</h:panelGroup>

<!-- #30457 start-->
<ui:param name="multipleFile" value="false"/>
<ui:param name="updateImg" value=":form:imageUploadId"/>
<ui:include src="imageAndBasicPopup.xhtml" />
<!-- #30457 end-->

</ui:composition>
