<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


	<div class="catMenu">
		<p:menubar>
			<p:submenu
				label="Wish List ( #{fn:length(catalogueBackingBean.managedBean.wishLists)} )">
				<p:menuitem value="View WishList"
					action="#{wishListBackingBean.viewWishListItem}" />
			</p:submenu>
			<p:submenu
				label="Cart List ( #{fn:length(catalogueBackingBean.managedBean.cartList)} )"
				style=" border-right: 1px;">
				<p:menuitem value="View Cart Items"
					action="#{catalogueBackingBean.viewCartListItem}" />
			</p:submenu>
			<p:submenu
				label="Supplier List ( #{fn:length(catalogueBackingBean.managedBean.favoriteSupplierList)} )"
				style=" border-right: 1px;">

				<c:forEach
					items="#{catalogueBackingBean.managedBean.favoriteSupplierList}"
					var="favor">

					<p:menuitem value="#{favor.supplierId}*" action="#{favoriteSupplierBackingBean.filterFavoriteSupplierItems(favor.supplierId)}"/>
				</c:forEach>


			</p:submenu>
		</p:menubar>



	</div>


</ui:composition>
