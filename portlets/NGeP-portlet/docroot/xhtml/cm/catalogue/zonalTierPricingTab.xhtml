<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns:p="http://primefaces.org/ui"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:fn="http://java.sun.com/jsp/jstl/functions"
	xmlns:c="http://java.sun.com/jsp/jstl/core"
	xmlns:ac="http://ac.my/jsf/composite/cc">



	<p:outputPanel id="cmZonalTierPricings">
		<p:dataTable id="cmZonalTierPricingsId"
			value="#{catalogueBackingBean.managedBean.selectedMaintainItem.cmZonalTierPricings}"
			var="tier" rowKey="#{tier}" rowIndexVar="rowIndex" width="100%">


			<ac:paginator for="cmZonalTierPricingsId"></ac:paginator>


			<p:column>
				<f:facet name="header">
					Zone Name
				</f:facet>
				<p:selectOneMenu value="#{tier.cmSupplierZone.suppZoneId}" style="width: 128px;" disabled="#{!tier.showFlag || tier.standardDisabled}">
					<f:selectItem itemLabel="Select One" itemValue="0" />
					<f:selectItems
						value="#{catalogueBackingBean.managedBean.supplierZoneList}"
						var="zone" itemLabel="#{zone.suppZoneName}"
						itemValue="#{zone.suppZoneId}"></f:selectItems>
				 <p:ajax event="change" listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:selectOneMenu>

			</p:column>



			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.from.qty']}
				</f:facet>
				<p:inputText value="#{tier.fromQty}" size="4" disabled="#{!tier.showFlag || tier.standardDisabled}">
				<p:ajax event="keyup" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:inputText>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.to.qty']}
				</f:facet>
				<p:inputText value="#{tier.toQty}" size="4" disabled="#{tier.standardDisabled}">
				<p:ajax event="change" listener="#{catalogueBackingBean.updateZonalTierToQty(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:inputText>
			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.price']}
				</f:facet>
				<p:inputText value="#{tier.price}" size="10" disabled="#{tier.standardDisabled}" style="text-align:right">
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="change" listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<f:convertNumber pattern="#{CommonUtils.getDisplayNumberFormat(CommonConstants.NUMBER_FORMAT_TYPE_AMOUNT)}" />
				</p:inputText>
			</p:column>

			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.start.date']}
				</f:facet>
				<p:calendar value="#{tier.startDate}" size="10" showOn="button" rendered="#{tier.showFlag}" disabled="#{tier.standardDisabled}" mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:calendar>

			</p:column>
			<p:column>
				<f:facet name="header">
					#{lbl['lbl.cm.end.date']}
				</f:facet>
				<p:calendar value="#{tier.endDate}" size="10" showOn="button" rendered="#{tier.showFlag}" disabled="#{tier.standardDisabled}" mindate="#{catalogueBackingBean.managedBean.currentDate}"
					pattern="#{CommonConstants.DEFAULT_DATE_FORMAT}">
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalTierDateOverlap(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="dateSelect" listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
					<p:ajax event="keyup" listener="#{catalogueBackingBean.validateZonalTierPrice(rowIndex)}" update="zTPromoLink, zTCloneLink, zTErrorLink, zTDeleteLink" />
				</p:calendar>

			</p:column>

			<p:column width="20%">
				<f:facet name="header">
					#{lbl['lbl.cm.action']}
				</f:facet>
				
				<table width="5%">
					<tr>
						<td><p:commandLink id="zTCloneLink" title="Clone" rendered="#{tier.showFlag}"
								disabled="#{tier.cmSupplierZone.suppZoneId eq 0 or tier.standardDisabled or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction}" 
								action="#{catalogueBackingBean.cloneZonalTierPrice(rowIndex)}"
								update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId, :form:pricingTabID:headerTabId:zonalTierId:addZonalTierButton">
								<p:graphicImage value="/css/images/design/add.png"></p:graphicImage>
							</p:commandLink>&#160;</td>
						<td style="text-align: right;"><p:commandLink title="Delete" id="zTDeleteLink" rendered="#{tier.showFlag}" 
								action="#{catalogueBackingBean.setZonalRowIndex}" oncomplete="confirmationZonal.show()"
								update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId">
								<f:param name="index" value="#{rowIndex}"></f:param>
								<p:graphicImage value="/css/images/design/trash.png"></p:graphicImage>
							</p:commandLink></td>
						<td><p:commandLink id="zTPromoLink" title="Promotion" rendered="#{tier.showFlag}"
								disabled="#{tier.cmSupplierZone.suppZoneId eq 0 or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction}" 
								action="#{catalogueBackingBean.addToZonalPromotion(rowIndex)}"
								update=":form:pricingTabID:headerTabId:zonalTierId">
								<p:graphicImage value="/css/images/design/add.png"></p:graphicImage>
							</p:commandLink>&#160;</td>
						<td style="text-align: right;">
							<p:commandLink id="zTErrorLink" title="Error" process="@this" actionListener="#{catalogueBackingBean.updateZonalTierErrorDialog(rowIndex)}" update=":form:pricingTabID:headerTabId:zonalTierId:cmZonalTierPricingsId, :form:errorDialog" 
								disabled="#{!(tier.cmSupplierZone.suppZoneId eq 0 or tier.price eq null or tier.fromQty eq null or tier.toQty eq null or tier.fromQty >= tier.toQty or tier.startDate eq null or tier.endDate eq null or tier.startDate >= tier.endDate or !tier.displayAction)}"
								oncomplete="errorDialog.show();">
								<f:param name="index" value="#{rowIndex}"></f:param>
								<p:graphicImage value="/css/images/design/icon_error.png"></p:graphicImage>
							</p:commandLink></td>	
					</tr>
				</table>
				

			</p:column>

		</p:dataTable>

		<div class="clear"></div>

		<div align="right">
			<p:commandButton value="#{lbl['lbl.cm.add']}" id="addZonalTierButton"  
			rendered="#{catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'D' ||
			(catalogueBackingBean.managedBean.selectedMaintainItem.itemStatus == 'U' and (unspscCodeBackingBean.supplierUser or unspscCodeBackingBean.supplierAdmin or unspscCodeBackingBean.allSupplier))}"
				disabled="#{catalogueBackingBean.disableAddZonalTier()}"
				action="#{catalogueBackingBean.addNewZonalTierPricing()}" icon="ui-icon-add"
				update="cmZonalTierPricingsId, :form:pricingTabID:headerTabId:zonalTierId:addZonalTierButton" process="@this cmZonalTierPricingsId"></p:commandButton>
		</div>
		
		<p:confirmDialog id="confirmDeleteZonalTierId" message="Are you sure ?"
			header="Confirmation Message" widgetVar="confirmationZonal">

			<p:commandButton id="conf" value="Yes"
				actionListener="#{catalogueBackingBean.deleteZonalTierPrice()}" update=":form"
				oncomplete="confirmationZonal.hide()" />
			<p:commandButton id="decline" value="No"
				onclick="confirmationZonal.hide()" />

		</p:confirmDialog>




	</p:outputPanel>


</ui:composition>
